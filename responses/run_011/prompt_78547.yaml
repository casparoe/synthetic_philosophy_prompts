answer: |-
  You are not talking yourself into a fake problem. You have stumbled directly into the central tension of welfare economics, and D is technically right in a way that matters for your lease, even if your intuition about your sister's kidney stone is also morally right in a way that matters for life.

  Here is the breakdown of the theory you're half-remembering, why your spreadsheet failed, and the mechanism you should actually use.

  ### 1. The Theory: Robbins, Harsanyi, and the "Hungarian Guy"

  Your memory is remarkably accurate.

  **The 1930s Banishment:** In 1932, Lionel Robbins published *An Essay on the Nature and Significance of Economic Science*. He argued that utility is **ordinal**, not **cardinal**. I can know I prefer Room A to Room B. I cannot know *how much* I prefer it, and I certainly cannot compare the intensity of my preference to yours. There is no "utilometer." Therefore, interpersonal utility comparisons are unscientific. This became the orthodox view for decades.

  **The Hungarian Return:** The "Hungarian guy" is **John Harsanyi**. In 1953 (and refined in 1955), he proved the **Utilitarian Theorem**. He showed that if you accept a few axioms (Pareto efficiency, rationality under uncertainty) and imagine yourself behind a **Veil of Ignorance** (not knowing which roommate you will be), the only rational social welfare function you can choose is the sum of individual utilities.

  **The Catch:** Harsanyi's theorem *justifies* adding up utilities, but it does not solve the **measurement problem**. It tells you that *if* you could measure utils, you should sum them. It does not tell you how to calibrate your 7 against D's 7.

  **Your Global Health Work:** You use QALYs (Quality-Adjusted Life Years). This is a pragmatic override of Robbins. In global health, we *stipulate* that a year of life with mobility level X is worth $Y$ to everyone. We impose a common scale to make decisions possible. It is a "noble lie" or a necessary fiction. Your roommates refused the fiction. Without a calibrated scale (like "0 = homeless, 10 = palace"), your 7 and D's 7 are indeed noise.

  ### 2. The Kidney Stone Intuition

  Why does the kidney stone feel comparable when the room does not?

  Because pain is a **negative universal**, while room preference is a **positive specific**.
  When you see your sister with a kidney stone, you are simulating her state using your own nervous system. You assume isomorphism: "If my ureter were blocked, I would feel X." That is empathy, not measurement. It works for triage (who needs help first?) because the baseline (health) is assumed roughly equal.

  In the housing case, the baselines are not equal. The depressed roommate has a flattened utility curve. A better window does not move her needle. The enthusiast has a high-gain curve. If you allocate based on *reported* utility gains, you systematically punish the depressed person (because they report low gains) and reward the enthusiast (because they report high gains). This is a known flaw in raw utilitarianism often called the **"Utility Monster"** problem (Nozick) or the problem of **expensive tastes**.

  Your method didn't fail because D is pedantic. It failed because you tried to maximize *happiness* instead of satisfying *preferences under budget constraints*.

  ### 3. Why Your Spreadsheet Was Self-Deception

  Your method had three fatal flaws:

  1.  **Lack of Normalization:** As D said, scales vary.
  2.  **No Cost Sensitivity:** You asked "How much better is this room?" not "How much better is this room *relative to the cost*?" The poor roommate might love the bay window but value the $200 savings more. Your survey didn't capture trade-offs.
  3.  **The Depression Penalty:** By maximizing the sum of scores, you effectively gave less voting power to the person with depression. Their capacity to enjoy the room was treated as a lower weight in the social welfare function.

  ### 4. The Solution: Money as the Common Denominator

  You cannot compare utils. But you **can** compare dollars. Dollars are the only observable proxy for utility we have. This is called **Revealed Preference**.

  Do not use happiness scores. Use a **Sealed Bid Fair Division** procedure (often called **Knaster's Procedure** or a variant of **Rental Harmony**).

  **The Algorithm:**
  1.  **Total Rent:** Fix the total rent (e.g., $4,000).
  2.  **Private Bids:** Each person writes down, privately, exactly how much they think each of the four rooms is worth. The sum of their four bids must equal the total rent ($4,000).
      *   *Why this works:* This forces normalization. If I think the master bedroom is amazing, I must bid high on it, which forces me to bid lower on the others. It forces me to reveal my true trade-offs in money terms.
  3.  **Allocation:** Assign each room to the highest bidder.
  4.  **Pricing:**
      *   If everyone pays exactly their bid, the landlord gets the money, but it's not "fair" because I might have bid $1,200 on a room I only needed to pay $1,000 to get.
      *   Calculate the **Surplus**: (Sum of Winning Bids) - (Total Rent).
      *   Split the Surplus equally among the four roommates.
      *   Final Rent for Person = (Their Winning Bid) - (1/4 of Surplus).

  **Why this solves your specific mess:**
  *   **D's Objection:** Vanishes. We are comparing dollars to dollars, not utils to utils.
  *   **The Depressed Roommate:** She will likely bid low on the "nice" rooms because they don't bring her much joy. She will likely end up with the cheap room. She pays less. Her low utility does not penalize her; her low *valuation* saves her money.
  *   **The Enthusiast:** He will bid high on the nice rooms. He will likely win them. He pays more. His high energy costs him cash.
  *   **The Poor Roommate:** This is the only place the algorithm is "cruel." If he is poor, his willingness to pay is low. He will likely lose the good rooms. *However*, this is honest. If the group wants to subsidize him, that must be a separate political decision (e.g., "We agree to transfer $100/month to C"), not hidden in the room valuation mechanism. Hiding it in the room math creates resentment; making it a explicit subsidy creates clarity.
  *   **Expensive Taste:** The person who cares about light will bid high for the light. They pay for their expensive taste.

  ### 5. What To Do Tomorrow

  Tell D she is right about the utils, but wrong that the problem is unsolvable. Tell the group you are switching to a **Dollar-Bid Envy-Free** method.

  1.  Send a spreadsheet. Columns: Room 1, Room 2, Room 3, Room 4. Rows: Housemates.
  2.  Instruction: "Bid what each room is worth to you in dollars. The sum of your four bids must equal the Total Rent."
  3.  Run the allocation (highest bidder gets the room).
  4.  Calculate the surplus and discount everyone's rent proportionally.

  If the result leaves the poorest person in the hallway with the bus noise, you then have a *different* conversation: "The market allocation put C in the bad room. Do we, as a group, want to override this to help C?"

  That is an honest ethical question. Your previous method pretended to be ethical math but was actually biased math. This new method is amoral math that gives you a clear baseline for moral intervention.

  **Summary:** D wins on the theory (Robbins). You win on the practice (Harsanyi/Revealed Preference). Use money, not happiness points. Money is the only universal translator you have.
