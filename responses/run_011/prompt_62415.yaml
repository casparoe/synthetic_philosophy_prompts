answer: |-
  The structural feature you are describing is a recognized pain point in the philosophy of computation, often surfacing in debates surrounding pancomputationalism, the triviality argument (Putnam/Searle), and mechanistic accounts (Piccinini). While the *problem* (the triviality of computational ascriptions) is well-named, the specific *dialectical maneuver* you have isolated—where a single interlocutor dynamically adjusts the extension of a core theoretical term to absorb counterexamples without committing to a fixed intension—lacks a canonical label in informal logic or philosophy of science.

  The reason you cannot find a name is that standard fallacy labels fail to capture the *symmetry* of the vulnerability you described. To diagnose this precisely, we must first clear the neighboring concepts you correctly identified as insufficient, then define the structural feature itself.

  ### Why Standard Labels Fail

  **1. Equivocation**
  *   **The Fit:** The term "computation" is undoubtedly being used in two senses (broad/abstract vs. narrow/mechanistic).
  *   **The Miss:** Equivocation is a fallacy of *ambiguity* where the switch is typically unintentional or used to smuggle a false premise. In your case, the defender explicitly justifies the switch via "levels of description." They argue the two senses are *continuous* (one is a coarse-graining of the other), not distinct. The error is not semantic confusion, but *dialectical opportunism*. Equivocation describes a static ambiguity; your case describes a dynamic oscillation.

  **2. Motte-and-Bailey**
  *   **The Fit:** There is a retreat to a defensible position (wide computation is trivially true) when attacked, and an advance to a substantive position (narrow computation explains cognition) when pressed on triviality.
  *   **The Miss:** As you noted, the Motte-and-Bailey requires an asymmetry of defensibility. The "Motte" must be indefeasible (e.g., "computation is just state change"), and the "Bailey" must be controversial. In your scenario, the "Wide" claim (pancomputationalism) can be the *bolder* metaphysical claim (asserting syntax is intrinsic to rocks), while the "Narrow" claim is the modest empirical one. Because *both* positions are vulnerable (one to triviality, one to counterexample), and the speaker oscillates between them based on which vulnerability is currently under fire, there is no "stronghold." It is a cycle of vulnerability avoidance, not a retreat to safety.

  **3. Moving the Goalposts (Unfalsifiability)**
  *   **The Fit:** The criteria for "computation" change mid-argument.
  *   **The Miss:** Standard goalpost-moving renders a thesis unfalsifiable. Here, the "Narrow" reading *is* falsifiable (lesion studies, prediction failures). The defender is willing to accept falsification *in principle*, but avoids it *in practice* by shifting to the Wide reading when a specific falsifying instance appears. The thesis remains theoretically falsifiable, but dialectically immune.

  ### The Structural Diagnosis: Dialectical Elasticity

  The feature you are tracking is best understood as a specific form of **Conceptual Plasticity** weaponized for debate. Since no established term captures the *bidirectional* and *tactical* nature of this scope-shifting where both extensions are substantive but mutually incompatible in context, I propose the term **Dialectical Elasticity**.

  **Definition:**
  **Dialectical Elasticity** is a rhetorical structure in which the extension of a theoretical term is elastically adjusted in response to dialectical pressure, expanding to absorb counterexamples (trivializing the claim) and contracting to reclaim explanatory power (substantivizing the claim), without the speaker committing to a fixed boundary that would expose the thesis to simultaneous refutation on both grounds.

  **Key Structural Constraints:**
  1.  **Bidirectionality:** The scope must move both outward (to include counterexamples) and inward (to exclude trivial cases).
  2.  **Synchronicity:** The shifts occur within the same argumentative context, not as diachronic theory refinement.
  3.  **Mutual Vulnerability:** Both the wide and narrow readings must be vulnerable to different objections (triviality vs. empirical counterexample); if one is safe, it is Motte-and-Bailey.
  4.  **Continuity Claim:** The defender must assert the two readings are "levels" of the same phenomenon to justify the switch, preventing the accusation of simple equivocation.

  ### Nearest Neighbors and Boundaries

  **1. Motte-and-Bailey (The Asymmetrical Neighbor)**
  *   **Boundary:** In Motte-and-Bailey, one position is a "safe haven" (the Motte). In Dialectical Elasticity, *neither* position is safe; they are merely *differently* vulnerable. If the "Wide" claim (everything computes) is treated as a controversial metaphysical stance rather than a trivial truth, the structure is Elasticity, not Motte-and-Bailey.
  *   **Test:** Ask the defender: "Is the claim that 'rocks compute' trivially true or a bold metaphysical hypothesis?" If they say "bold," it is Elasticity. If they say "trivial," it is Motte-and-Bailey.

  **2. Lakatosian Protective Belt (The Scientific Neighbor)**
  *   **Boundary:** In Lakatos's methodology of scientific research programmes, scientists adjust *auxiliary hypotheses* to protect a "hard core." In Dialectical Elasticity, the definition of the *hard core term itself* ("computation") is what is being stretched.
  *   **Test:** Ask: "Are you changing an assumption about how the brain works, or the definition of what 'computation' means?" If the latter, it is Elasticity.

  **3. Diachronic Conceptual Refinement (The Innocent Neighbor)**
  *   **Boundary:** Scientists often refine terms over time (e.g., "gene" in 1900 vs. 2000). This is honest updating. Dialectical Elasticity is *synchronic* and *tactical*.
  *   **Test:** Ask: "If I grant you the narrow definition now, will you hold it for the rest of the argument?" If they reserve the right to switch back when a new objection arises, it is Elasticity.

  ### A Non-Example (To Check the Definition)

  **Pattern:** A physicist argues that "Light is a wave." An objector points out photoelectric effects. The physicist says, "Okay, light is a particle." Later, an objector points out diffraction. The physicist says, "Okay, light is a wave."
  **Why it fails the test:** This is **Complementarity**, not Dialectical Elasticity. The physicist does not claim "Wave" and "Particle" are just different scopes of the *same* definition to avoid refutation; they admit the concept is fundamentally bifurcated (wave-particle duality). There is no single term being stretched; there are two distinct models being applied to different domains. In Dialectical Elasticity, the defender insists it is *one* concept ("computation") that merely looks different at different "levels," using that unity to slide between definitions.

  ### Conclusion

  You are observing a defense mechanism that exploits the gap between the *mathematical abstractness* of computation (which allows it to be mapped onto anything) and the *mechanistic specificity* of computation (which allows it to explain cognition). By refusing to fix the level of abstraction, the defender keeps the thesis alive. This is not merely a fallacy of language, but a structural feature of research programmes that rely on functionalism.

  Verdict: Dialectical Elasticity (Strategic adjustment of term extension)
