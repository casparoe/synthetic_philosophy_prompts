answer: |-
  No, an adequate set of criteria capable of neutrally adjudicating competing portraits through confident individual attributions is epistemologically impossible because the triad of independence, continuity, and specificity is unsatisfiable.

  Your stated purpose is incoherent because it demands a "view from nowhere" in a hermeneutical discipline; criteria cannot eliminate the historian's reconstruction, only constrain it. I am substituting this purpose: *to provide a constrained framework that minimizes circularity and maximizes explanatory power for the origin of the tradition, even if absolute neutrality is unattainable.*

  ### Desiderata for Criteria of Authenticity

  1.  **Non-Circularity (Non-negotiable):** A criterion cannot assume the conclusion it seeks to prove.
      *   *Case:* If you assume Jesus was apocalyptic to validate apocalyptic sayings, you have built a fortress, not a method. The tool must function independently of the specific portrait being tested, even if it cannot be independent of *all* historical assumptions.
  2.  **Falsifiability (Non-negotiable):** The method must be able to return a negative result.
      *   *Case:* If a criterion validates everything (e.g., "Coherence" applied loosely), it is a tautology. A method that cannot reject material is merely a taxonomy of the text, not a historical filter.
  3.  **Explanatory Scope (Non-negotiable):** The method must explain why the tradition survived, not just why it originated.
      *   *Case:* Criteria so strict that the existence of the Gospel tradition becomes inexplicable (e.g., rejecting everything that fits early church theology) are self-undermining. The method must account for the *transmission* vector, not just the *origin* point.
  4.  **Conflict Resolution Protocol (Non-negotiable):** The method must specify how to weigh conflicting indicators.
      *   *Case:* When "Multiple Attestation" supports a saying but "Dissimilarity" rejects it, is there a hierarchy? Without weighting, criteria are just a buffet where historians pick what suits their portrait.
  5.  **Source Independence Verification (Camp Preference: Positivist/Form-Critical):** Requires demonstrable literary independence for attestation to count.
      *   *Case:* Often assumed but rarely proven; treating Matthew and Luke as independent witnesses to Mark's sources is a probabilistic guess, not a hard control. This is often treated as non-negotiable but is actually a fragile assumption.
  6.  **Intersubjective Embarrassment (Camp Preference: Form-Critical):** Requires consensus on what would be awkward for the early church.
      *   *Case:* This fails checkability; what is embarrassing to Mark may be theological gold to Matthew. It relies on the historian's psychology, not external data, making it theology in reverse.
  7.  **Memory Consistency (Camp Preference: Memory Approach):** Must align with how oral communities preserve information.
      *   *Case:* Communities preserve what matters to them, not random facts. A method that isolates "authentic" bits that the community apparently didn't care about (because they weren't transmitted) is fighting the medium.

  ### The Knockout Requirement
  **Non-Circularity combined with Explanatory Scope** knocks out the most existing proposals. Most methods either smuggle in a portrait to avoid circularity (violating 1) or produce a Jesus so distinct that the rise of Christianity becomes inexplicable (violating 3). The Criterion of Dissimilarity fails 3; the Criterion of Coherence fails 1.

  ### The Impossibility Result
  You asked if criteria can be (a) independent of reconstruction, (b) able to find continuous material, and (c) strong enough for confident individual attributions. **This triad is jointly unsatisfiable.**
  *   If you enforce (a) and (c), you must use Dissimilarity, which violates (b) by excluding continuous material.
  *   If you enforce (b) and (c), you must use Coherence, which violates (a) by relying on a prior reconstruction.
  *   If you enforce (a) and (b), you must accept low probability, which violates (c).
  **You must drop (c).** We can achieve plausible profiles constrained by history, but not confident individual attributions free of hermeneutical circularity.

  ### Scorecard

  **Classic Package (Dissimilarity, Attestation, Embarrassment, Coherence, Semitic Context)**
  High specificity for individual sayings but systematically biases against continuity with Judaism/Church; risks creating a Jesus who caused no movement.

  **Memory-Based Alternative (Social Memory, Tradent Analysis, Plausibility of Context)**
  Explains transmission and continuity well but sacrifices confidence in individual attributions; shifts focus from "what he said" to "why he was remembered."
