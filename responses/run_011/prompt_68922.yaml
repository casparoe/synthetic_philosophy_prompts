      *   If the user insists art is different, the difference must be the *sensory/phenomenal* ground. Morality is about will/action; Art is about perception/feeling. You can't perceive via testimony.
      *   *Key Insight:* The Partner conflates *knowing the proposition is true* with *knowing the ground of the truth*.

  10. **Final Polish:** Ensure tone is diagnostic, not prescriptive. Use the user's terminology. Focus on the "shape of the impasse." (Self-Correction: Make sure not to solve it, just map it.)

      *   *Structure:*
          1.  Validate the "Verbal" hunch but deepen it.
          2.  Analyze the Moral Lever (The Crucial Diagnostic).
          3.  Identify the Substantive Fault Line (Normative Authority vs. Informational Content).
          4.  Define Progress (What questions to ask instead).

      *(Self-Correction during drafting)*: I need to be careful not to just repeat the "Pessimist vs. Optimist" literature the user already knows. I need to offer a *meta-diagnosis* of why that literature is stuck. The stuckness comes from fighting over the label "knowledge" instead of the function of the judgment.

      *New Angle:* The "Knowledge" label is a red herring for "Entitlement to Assert." The User feels they can't *assert* the music is good until they hear it, even if they believe it. The Partner thinks belief + truth = entitlement. This is about *Speech Act* norms, not just epistemology.

