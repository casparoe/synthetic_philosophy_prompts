      *   *The Moral Lever:* This is the strongest diagnostic tool. It reveals whether the issue is about *Aesthetics* specifically or *Normativity* generally.
      *   *The Real Fault Line:* It's not about truth conditions; it's about the *role of the subject*. Aesthetic judgment is arguably *constitutive* rather than *reportive*.
      *   *Proposed Shift:* Move from "Can you know?" to "What work is the concept of 'knowing' doing here?"
