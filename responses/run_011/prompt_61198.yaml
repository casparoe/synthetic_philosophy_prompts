  **MEMORANDUM**

  **TO:** Discretionary Support Fund Appeals Panel
  **FROM:** [Your Name]
  **DATE:** Tuesday
  **SUBJECT:** Thursday's Appeal – Case Ref [Redacted]

  **Purpose**

  We are deadlocked on the appellant's case. Half the panel views the refusal as a moral failure; the other half views overturning it as a procedural failure. This memo sets out a path to resolve the impasse without compromising the integrity of the pilot. My recommendation is to **Overturn** the officer's decision using the existing 'systematic disadvantage' clause, whilst formally recommending scheme amendment to prevent recurrence.

  **Currency vs. Measurement: Diagnosing the Disagreement**

  We have been arguing past one another because we are conflating two distinct objections to the ledger. We must separate them to vote clearly.

  The first objection is that **contribution is the wrong currency for membership**. This argues that residence alone should suffice, and that requiring 'proof of worth' is inherently exclusionary. If this is your view, you are effectively arguing against the pilot itself.

  The second objection is that the **ledger measures contribution badly**. This accepts contribution as the currency but argues that unpaid care is a high-value contribution currently scored at zero. This is the stronger argument for this panel. We are not here to abolish the ledger, but to ensure it measures what it claims to measure: reciprocity. To deny that care is a contribution while awarding points for warehouse labour is not rule-following; it is a measurement error. The appellant is not refusing to contribute; she is contributing in a form the spreadsheet cannot currently read.

  **The Case for Integrity (The Rule-Following Position)**

  Those urging us to uphold the refusal are not being heartless; they are protecting the scheme's legitimacy. This argument must be taken seriously.

  The ledger was built to eliminate the variability of the old system, where outcomes depended on an officer's mood or an applicant's eloquence. The points system was the feature, not the bug. Furthermore, the fund is capped. This is a zero-sum game. Every point we award outside the criteria is a household jumping a queue ahead of someone who did exactly what they were told. The household on 47 points worked full-time, finished the course, and paid their tax. If we award points to the appellant on equitable grounds, we are effectively penalising the household that followed the rules to the letter. If we cannot rely on the published criteria, the ledger becomes advisory, and we have rebuilt discretion with extra steps.

  **The 'Systematic Disadvantage' Clause**

  There is, however, a mechanism within the rules to bridge this gap. The panel may adjust a score "where the published criteria systematically disadvantage a household for reasons outside its control".

  The crucial distinction here is between *bad luck* and *systematic design*. If the appellant missed the course because her bus broke down, that is bad luck. It is individual. However, the criteria require evening attendance and daytime volunteering. By definition, these criteria exclude anyone providing full-time daytime care with unpredictable evening availability. This is not unique to her; it is a structural exclusion of the entire class of unpaid carers.

  Therefore, this is not an exception based on sympathy; it is a correction based on the rules themselves. The criteria systematically disadvantage this household because the design of the criteria ignores the reality of care work. Using this clause allows us to overturn the decision without declaring the ledger void. We are not exercising discretion; we are applying the safety valve built into the pilot.

  **Recommendation**

  We should **Overturn** the refusal.

  1.  **Apply the Clause:** We find that the criteria systematically disadvantage this household due to the nature of unpaid care. We award the necessary 10 points to reach the threshold.
  2.  **Address the Cap:** We acknowledge the queue-jumping concern. However, the integrity of the 'contribution' principle is more damaged by excluding carers than by including them via the safety clause.
  3.  **Future-Proofing:** We must concurrently recommend that officers draft an amendment to formally credit caring responsibilities. Relying on appeals to fix structural measurement errors is unsustainable.

  This approach respects the rule of law (by using the existing clause), acknowledges the value of care (by correcting the measurement), and protects the scheme's future (by prompting amendment). It allows us to leave the room united.

  Please review this reasoning before Thursday. I look forward to resolving this.
