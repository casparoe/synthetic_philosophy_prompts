answer: |-
  This is a profound and well-constructed puzzle. You have independently reconstructed what is widely considered the central technical crisis in the modern theory of truthlikeness. Your intuition that the problem survives the move from "counting claims" to "measuring state similarity" is correct, and your suspicion that the distinction between "change of subject matter" and "re-parcelling" is the key to the solution is also correct.

  Here is the conceptual carving you requested, proceeding through your five questions.

  ### 1. Name and Adequacy Condition

  Yes, this phenomenon has an established name. It is called the **Language Dependence of Verisimilitude**.

  The adequacy condition meant to rule it out is called **Translation Invariance** (sometimes **Logical Equivalence Invariance**).

  **What the condition requires:**
  Translation Invariance requires that the judgment of which theory is closer to the truth must remain stable under any change of vocabulary that preserves the logical structure of the world. Specifically, if Vocabulary $V$ and Vocabulary $V^*$ are interdefinable (meaning every atomic statement in $V$ can be expressed as a logical compound in $V^*$ and vice versa), and if Theory $A$ and Theory $B$ express the same physical claims in both vocabularies, then the verdict "$A$ is closer to the truth than $B$" must hold in $V$ if and only if it holds in $V^*$.

  **The specific class of reformulations:**
  The condition demands invariance under **predicate transformation**. In your example, you transformed the primitive predicates $\{P, Q\}$ into $\{Q, C\}$ (where $C$ is concordance, logically equivalent to $P \leftrightarrow Q$). This is a linear transformation of the logical space. The condition asserts that truthlikeness is a property of the *content* of the theory relative to the *world*, not a property of the *syntax* used to describe that content. If the metric changes when the syntax changes logically equivalent ways, the metric is measuring linguistic convenience rather than ontological proximity.

  ### 2. Subject Matter vs. Re-parcelling: Is the Distinction Principled?

  You ask whether the distinction between a genuine change of subject matter (temperature vs. molecular velocity) and a mere re-parcelling (presence/absence vs. concordance) is principled or if it collapses.

  **The Verdict:**
  The distinction is principled **if and only if** one adopts a realist metaphysics of properties. It collapses entirely if one adopts an instrumentalist or conventionalist view.

  **Why it is principled (The Realist View):**
  On a realist view, the world comes with a built-in structure. Some properties are "natural kinds" or "fundamental magnitudes," while others are "gerrymandered" or "derived."
  *   **Re-parcelling:** Your antibody example involves gerrymandered properties. "Concordance" is not a fundamental biological feature; it is a logical construct derived from $P$ and $Q$. Changing from $\{P, Q\}$ to $\{Q, \text{Concordance}\}$ is like measuring distance in meters versus measuring distance in "meters-and-feet-combined." It is a change in notation, not ontology.
  *   **Change of Subject Matter:** Describing a gas by temperature vs. molecular velocity is different. While they are nomologically linked, they pick out different levels of causal structure. A theory that gets the macro-variables right but the micro-variables wrong might genuinely be answering a different question than one that does the reverse.

  **Why it collapses (The Instrumentalist View):**
  If you believe properties are merely tools for prediction and have no mind-independent status, then there is no fact of the matter about whether $P$ is more "fundamental" than "Concordance." They are just different coordinates on the same map. If there is no privileged map, there is no principled way to say one coordinate system is the "true" one for measuring distance. Under this view, Language Dependence is not a bug; it is an inevitable feature of theory comparison.

  **The Name of the Distinction:**
  In the literature, this is often framed as the distinction between **Logical Equivalence** (re-parcelling) and **Ontological Reduction** (change of subject matter). The principled line is drawn by **Property Privilege**.

  ### 3. Nearest Established Concepts and Where They Stop

  You asked how this differs from the classic problems in the field. Here is the precise boundary.

  **A. Popper's Paradox (The "Content" Problem)**
  *   **The Concept:** The original definition of truthlikeness implied that no false theory could be closer to the truth than any other false theory.
  *   **Where it stops:** That problem was about the *possibility* of ordering false theories at all. Your problem arises *after* you have adopted a repaired definition that *does* allow ordering. You have a working metric; the problem is that the metric yields contradictory results depending on the language. Popper's paradox says "You can't rank them." Language Dependence says "You can rank them, but the ranking is arbitrary."

  **B. Consequence-Based Accounts**
  *   **The Concept:** These accounts measure truthlikeness by the ratio of true consequences to false consequences.
  *   **Where it stops:** Your example demonstrates exactly why these accounts fail the Translation Invariance test. As you noted, when you change from $\{P, Q\}$ to $\{Q, C\}$, the set of atomic consequences changes. $T$ has one true atomic consequence in the first language, but zero in the second. Consequence accounts are inherently sensitive to the "granularity" of the language. They stop being useful precisely at the point where logical equivalence changes the count of consequences.

  **C. Similarity-Based Accounts (State Space)**
  *   **The Concept:** These accounts define truthlikeness as the distance between the possible state described by the theory and the actual state in a multi-dimensional space.
  *   **Where it stops:** You suspected this would not save you, and you are right. A similarity account requires a **metric** on the state space. To define the metric, you must define the **dimensions** of the space.
      *   If the dimensions correspond to the primitive predicates ($P, Q$), you get one result.
      *   If the dimensions correspond to the transformed predicates ($Q, C$), you get a different geometry (a sheared or rotated space), and the distances change.
      *   The similarity account does not solve Language Dependence; it merely relocates it. The problem becomes: "Which dimensions constitute the true state space?" Unless you can justify why the $P/Q$ dimensions are more "real" than the $Q/C$ dimensions, the similarity measure is just as language-dependent as the consequence count.

  ### 4. Definition and Boundary Conditions

  Since "Language Dependence" is the established term, I will not coin a new one, but I will provide the precise definition and diagnostic you requested for the specific *variety* of language dependence you have isolated.

  **Phenomenon:** **Predicate Relativity of Truthlikeness** (a specific instance of Language Dependence).

  **Definition:**
  Predicate Relativity occurs when the verisimilitude ordering of two theories reverses or alters solely due to a transformation of the primitive vocabulary into a logically equivalent vocabulary, where the new vocabulary is constructed via truth-functional compounds of the old.

  **Diagnostic:**
  To test if a measure suffers from Predicate Relativity:
  1.  Take two theories, $A$ and $B$, and a target truth $W$.
  2.  Calculate verisimilitude $V(A, W)$ and $V(B, W)$ using primitive set $\mathcal{P}$.
  3.  Construct a new primitive set $\mathcal{P}^*$ where every member of $\mathcal{P}^*$ is a logical compound of members of $\mathcal{P}$, and $\mathcal{P}$ is recoverable from $\mathcal{P}^*$.
  4.  Recalculate verisimilitude using $\mathcal{P}^*$.
  5.  If the ordering of $A$ and $B$ changes, the measure exhibits Predicate Relativity.

  **Boundary Conditions:**
  *   **Change of Subject Matter (Not an instance):** If the new vocabulary picks out causally distinct properties (e.g., switching from "color" to "wavelength" might be borderline, but switching from "temperature" to "mean kinetic energy" involves a theoretical reduction), this is *not* Predicate Relativity. This is a change in the ontological commitments of the theory. The diagnostic fails here because the theories are no longer expressing the *same* propositions; they are expressing propositions with different truth conditions regarding the fundamental structure of the world.
  *   **Conjunctive to Disjunctive (Instance):** Rewriting $P \land Q$ as $\neg(\neg P \lor \neg Q)$ is a purely logical transformation. If this changes the score, it is Predicate Relativity.
  *   **Interdefinable but Compound (Instance):** This is your exact case. $C$ (concordance) is defined as $(P \land Q) \lor (\neg P \land \neg Q)$. Because $C$ is a truth-functional compound of $P$ and $Q$, treating it as a primitive box is a re-parcelling. This counts as an instance.
  *   **Where it begins and ends:** The phenomenon begins at the point where logic allows multiple, equivalent descriptions of the same state of affairs. It ends only if one can identify a "canonical" description that is not just logically equivalent but *ontologically privileged*.

  ### 5. Avoidability and Privileged Vocabularies

  Is the phenomenon avoidable? **Yes, but not by logic alone.**

  You asked what makes a vocabulary privileged without simply assuming the answer. This is the hardest question in this area.

  **The Logical Answer (Fails):**
  You cannot solve this by restricting attention to "atomic" sentences or "simple" predicates. As your example shows, what counts as atomic is relative. $C$ is atomic in the second language but compound in the first. Logic cannot distinguish a "real" atom from a "gerrymandered" one.

  **The Metaphysical Answer (Succeeds, conditionally):**
  The only way to avoid Predicate Relativity is to assert that some vocabularies correspond to **Natural Kinds** or **Fundamental Magnitudes**.
  *   **Privilege:** A vocabulary is privileged if its predicates refer to properties that "carve nature at its joints."
  *   **Justification:** This justification is not linguistic; it is empirical and metaphysical. We prefer $\{P, Q\}$ over $\{Q, C\}$ not because of logic, but because $P$ and $Q$ correspond to distinct physical mechanisms (antibody binding sites), whereas $C$ corresponds to a relational pattern that has no independent causal power.
  *   **The Cost:** Accepting this solution means admitting that truthlikeness is not a purely formal relation between sentences and truth. It depends on the *metaphysical structure of the world*. If the world has no privileged structure (if all properties are equally "gerrymandered"), then truthlikeness is inevitably language-dependent.

  **Conclusion on your Example:**
  Your example is not flawed; it is the canonical argument against formalist accounts of truthlikeness. It shows that you cannot measure closeness to the truth using only the tools of logic and syntax. You need an ontology.

  If you wish to maintain that $T$ is genuinely closer than $U$ regardless of the lab form, you must argue that the first form ($P, Q$) aligns with the causal structure of the antibodies, while the second form ($Q, C$) obscures it. If you cannot make that metaphysical claim, you must concede that "closeness to the truth" is relative to the conceptual scheme employed.
