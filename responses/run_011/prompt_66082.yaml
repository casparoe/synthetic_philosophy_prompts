answer: |-
  Here is the audit of your brother-in-law's analogy.

  ### 1. The Mapping

  Your brother-in-law's argument relies on a structural equivalence between three distinct historical puzzles. Here is how the variables map across the three cases.

  | Variable | **Troy (The BIL's Model)** | **Exodus (The Target)** | **Arthur (The Bonus)** |
  | :--- | :--- | :--- | :--- |
  | **The Poem / Text** | Homer's *Iliad* | Biblical Pentateuch | Geoffrey of Monmouth / Malory |
  | **The Excavator** | Heinrich Schliemann | (None successful) | (Various, e.g., Alcock at Cadbury) |
  | **The Mound / Site** | Hisarlik (Turkey) | Sinai / Kadesh-Barnea | Glastonbury / Cadbury Castle |
  | **The Destruction Layer** | Troy VI/VII (Fire/Earthquake) | (None specific to 2M people) | (Battle sites like Badon are speculative) |
  | **Contemporary Record** | Hittite tablets (Wilusa/Taruisa) | Egyptian records (Silence) | Gildas / *Annales Cambriae* (Late/Ambiguous) |
  | **Overturned Consensus** | "Troy was purely mythical." | "Exodus happened as described." | "Arthur was a historical king." |
  | **Current Status** | City existed; War likely; Homer embellished. | Small group possible; Mass Exodus unsupported. | Warlord likely; High King myth. |

  ### 2. Where the Mapping Breaks

  The analogy breaks in three places. Two are noise; one is fatal.

  **Noise (Doesn't matter for the argument):**
  *   **The Excavator:** Whether it was an amateur (Schliemann) or a professional team doesn't change the physical evidence found.
  *   **The Consensus:** The specific academic mood of the 19th century vs. the 21st century is irrelevant. Skepticism is the variable, not the era.

  **Fatal Breaks (Matters for the argument):**
  *   **The Signature of the Event:**
      *   *Troy:* A war leaves a destruction layer in a *fixed location*. If a city burns, the ash stays there for 3,000 years.
      *   *Exodus:* A migration leaves a trail in *multiple locations*. 2 million people wandering for 40 years should leave pottery, graves, and dung in the Sinai. They didn't. You cannot "dig up" a wandering path the same way you dig up a burned city.
      *   *Arthur:* A king leaves administrative records (coins, charters). 5th-century Britain is dark, but not *that* dark. The lack of contemporary naming is structurally different from the silence on a mass migration.
  *   **The Specificity of the Vindication:**
      *   Schliemann found a city. He did *not* find the body of Hector, the walls built by Poseidon, or the bones of Agamemnon (he claimed he did at Mycenae, but got the date wrong by 400 years).
      *   The BIL argues that finding the *setting* vindicates the *plot*. The archaeology of Troy vindicated the **setting** (a wealthy city at that spot was destroyed) but failed to vindicate the **plot** (a 10-year siege over a woman, divine intervention, single combat).
      *   For the Exodus, finding a few Semitic slaves in Egypt (which we have evidence for) would vindicate the **setting**. It does not vindicate the **plot** (plagues, sea parting, 40 years).
      *   For Arthur, finding a fortified hillfort (Cadbury) vindicates the **setting** (post-Roman Britons fought Saxons). It does not vindicate the **plot** (one king named Arthur united them).

  ### 3. What the Analogy Smuggles (The "Mound" Problem)

  You are correct: the "mound" is doing the smuggling.

  Hisarlik is a *tell*. It is a physical accumulation of debris that exists regardless of whether Homer wrote about it. It exerts a gravitational pull on archaeologists. The BIL's analogy smuggles in the assumption that the Exodus and Arthurian legends also have a "mound"—a specific, locatable physical anomaly that is waiting to be found.

  *   **Troy:** The mound exists independently of the text.
  *   **Exodus:** There is no "mound." There is a desert. The claim is negative (absence of pottery/graves). You cannot point to a hill and say, "The Exodus is under there."
  *   **Arthur:** The "mounds" (Glastonbury, Cadbury) were identified *because* of the legend, not independently of it. They are retrofitted.

  By using Troy, the BIL imports the **ontological security** of a city. A city is hard to fake. A migration is easy to exaggerate. A king is easy to invent. The analogy treats all three claims as "There is a city under this hill," when the Exodus claim is "There were millions of people who left no trace," and the Arthur claim is "There was a specific man who did specific deeds."

  ### 4. What Got Vindicated at Hisarlik?

  This is the crux. Did Troy "become history"?

  *   **Place:** Vindicated. Yes, there was a city.
  *   **War:** Plausible. Yes, there was a destruction layer consistent with warfare (Troy VIIa).
  *   **Poem:** **Not Vindicated.** The *Iliad* is not a history book. It was composed centuries after the destruction.
  *   **Date:** Fuzzy. Schliemann wanted the Bronze Age; the destruction layers are complex.

  **The Payoff Structure:**
  At Troy, the payoff was **Minimalist**. We learned that the *kernel* was real (a war happened), but the *narrative* was mythologized.
  *   **Exodus:** A Minimalist vindication is already conceded by many scholars (a small group of Levites left Egypt). The BIL wants a **Maximalist** vindication (the Biblical narrative is historically reliable). Troy does not support Maximalism; it supports Minimalism.
  *   **Arthur:** A Minimalist vindication is likely (a Romano-British warlord existed). A Maximalist vindication (King of all Britain, Round Table) is structurally unavailable because the sources are too late and too literary.

  The BIL uses the Troy example to promise a Maximalist payoff (The Bible/Geoffrey was right!) using a case that only delivered a Minimalist payoff (A city existed, but Homer made most of it up).

  ### 5. The Tutor's Distinction (Place vs. Event)

  Your tutor was not speaking mush. This is a recognized, if informal, heuristic in historiography and oral tradition studies.

  *   **Place (Toponymy):** Highly durable. "Jerusalem," "Troy," "Avalon." Names stick to geography even when the culture changes. A place name can survive 2,000 years of silence.
  *   **Event (Narrative):** Highly volatile. Details of battles, motivations, and specific actors degrade rapidly without writing.

  **The Trick:** As your tutor noted, a surviving place name lends unearned credibility to a rotted event.
  *   *Troy:* The place name survived (in Hittite records as Wilusa). This made people assume the *war* described by Homer was accurate. It wasn't.
  *   *Exodus:* The place names (Pi-Ramesses, Pithom) are real Egyptian cities. The BIL uses this to imply the *event* (the slavery and exit) is therefore real. But place names can be reused or remembered without the specific event happening as described.
  *   *Arthur:* "Badon" is a place. "Camelot" is a place (later invented). The survival of the battle name "Badon" in Gildas does not prove Arthur fought there.

  The distinction is real. The BIL is exploiting the durability of **Place** to smuggle in the validity of **Event**.

  ### 6. Verdict and A Better Analogy

  **Does the conclusion survive?**
  **No.** The analogy cannot bear the weight.

  It fails because it conflates **Background Verification** with **Narrative Verification**.
  Schliemann proved the *background* (the city existed). He did not prove the *narrative* (Achilles was real).
  The BIL wants to use Schliemann to prove the *narrative* of the Exodus (Moses was real, the sea parted).
  Even if you found a "Burn Layer" in Sinai (which you won't), it would prove *a* fire, not *the* Exodus.

  **A Better Analogy:**
  The discovery of the **Tel Dan Stele** (1993).

  *   **The Text:** The Bible (Books of Kings).
  *   **The Claim:** King David existed and founded a dynasty.
  *   **The Skeptic Position (pre-1993):** David was a mythological figure like Arthur.
  *   **The Excavation:** An Aramaic inscription mentioning the "House of David."
  *   **The Vindication:** A dynastic founder named David existed.
  *   **The Limit:** It does not prove he killed Goliath. It does not prove he united all 12 tribes. It does not prove the United Monarchy was an empire.

  **Conclusion Licensed by the Better Analogy:**
  If you use the Tel Dan analogy instead of the Troy analogy, the conclusion changes from *"The skeptics are wrong and the text is history"* to *"The skeptics are partially wrong; a historical kernel exists, but the narrative is still theological elaboration."*

  **Summary for the Dinner Table:**
  Your brother-in-law is right that skeptics can be prematurely certain (as with Troy). But he is wrong about *what* was found at Troy. We found the **stage**, not the **play**. For the Exodus, we haven't even found the stage. For Arthur, we found a stage built 500 years later by monks who wanted pilgrims. The Troy argument proves that legends often have a geographical anchor; it does not prove that the stories told about those anchors are historically true.
