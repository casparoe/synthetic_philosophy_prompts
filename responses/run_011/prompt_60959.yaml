      *   *The Thesis:* The idea that *Middlemarch* is *just* the Feuerbach book novelized is too reductive. It ignores the ethical imperative she developed later. Feuerbach explains the *illusion*; Eliot is interested in the *consequences* of living without the illusion while retaining the moral fervor.

