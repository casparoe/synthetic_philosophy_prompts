  In $a \to a'$, the change happens to the group that is both **Leftmost** and **Low-Register**. These two descriptions are perfectly correlated in $a$, so the system bonds them tightly.
  In $b$, the register sequence is reversed. The **Leftmost** group is now **High-Register**. The **Low-Register** group is now **Rightmost**.

