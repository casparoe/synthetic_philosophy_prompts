      *   However, the deeper epistemic worry (raised by Albert, Loewer, etc.) is: How do we *know* the PH is true if our records are unreliable? This leads to the "Mentaculus" framework (David Albert).

  3.  **Deconstruct the Steps:**

      *   (1) & (2): Standard Boltzmannian orthodoxy. Generally accepted.
