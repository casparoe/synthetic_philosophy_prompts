      *   **The Deeper Fix:** Step (3) applies the wrong probability distribution. You don't ask "What is probable given $M_{now}$?" You ask "What is probable given PH + $M_{now}$?"
      *   **The Cost:** You must accept the Past Hypothesis as a fundamental postulate (nomological or otherwise), not derived from dynamics. You must accept that we are not typical observers in the *entire* phase space, but typical observers conditional on the PH.
