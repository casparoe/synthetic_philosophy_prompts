  The pair that cannot both be satisfied is the requirement that reckoning be internally owned versus the requirement that it be institutionally compelled for transmission.

  **The Spec: Requirements for Adequate Reckoning**

  1.  **Differentiates Guilt, Responsibility, and Benefit.**
      *   *Consideration:* Denial is durable and cheap because it protects current benefits; acknowledging benefit without assigning personal guilt lowers defense thresholds and explains why descendants resist "guilt" but may accept "responsibility."
  2.  **Diagnoses Whether Past Arrangements are Running or Finished.**
      *   *Consideration:* Monuments to lost causes cluster decades after the loss rather than appearing as spontaneous grief; if structural arrangements (wealth, land, power) persist, projects treating the past as "closed" are factually incorrect.
  3.  **Accommodates Competing Memories Without Hierarchical Ranking.**
      *   *Consideration:* Colonial atrocities versus the Holocaust, or Turkish versus Kurdish memory; ranking creates zero-sum defensiveness, whereas adequate reckoning requires holding multiple truths without subordinating one to validate the other.
  4.  **Accounts for Generational Question Shifts.**
      *   *Consideration:* The second generation asks "what did you do?" while the third asks "who am I in relation to this?"; a rubric that funds only one type of inquiry fails to explain why transmission succeeds or fails over time.
  5.  **Distinguishes State Performance from Private Transmission.**
      *   *Consideration:* Acknowledgment extracted from a defeated state under occupation isn't the same act as acknowledgment by a state that was never defeated; what families say at the kitchen table determines longevity, not what the state says in public.
  6.  **Treats Backlash as Evidence of Engagement, Not Project Failure.**
      *   *Consideration:* A rigorous memorial followed by electoral backlash proves the memory entered the political sphere; silence is the actual failure mode, not conflict.
  7.  **Produces a Shared National Narrative.**
      *   *Consideration:* State-builders desire cohesion, but memory work often reveals irreconcilable differences; demanding consensus often forces the suppression of minority memory.

  **Sorting: Non-Negotiable vs. Camp Preference**

  *   **Non-Negotiable:** 1 (Guilt/Benefit), 2 (Running/Finished), 3 (Competing Memories), 4 (Generational Shifts), 5 (State/Private).
      *   *Reasoning:* These are required to explain the phenomena of denial durability, generational drift, and the factual reality of ongoing structures.
  *   **Camp Preference:** 6 (Backlash), 7 (Shared Narrative).
      *   *Camp Name for #6:* **Agonistic Pluralists** (believe conflict is democratic health) vs. **Deliberative Consensus Builders** (believe conflict indicates project failure).
      *   *Camp Name for #7:* **State-Builders/Assimilationists** (want memory to serve national cohesion) vs. **Truth Commissioners** (want memory to serve accuracy regardless of cohesion).
      *   *Verdict on Shared Narrative:* It is not a genuine desideratum for truth; it is what state-builders want from memory to stabilize legitimacy.
      *   *Verdict on Competition:* The account must handle competition between memories without ranking them; ranking reinstates the hierarchy that caused the violence.

  **The Excluding Requirement**
  The single requirement that does the most excluding work is **#2 (Diagnoses Whether Past Arrangements are Running or Finished)**. It knocks out the largest share of what's on offer because most memorial projects assume the violence is historical rather than structural; this requirement invalidates any project that treats a monument or apology as "completion" while wealth gaps, land ownership, or legal disparities persist.

  **The Impossible Pair**
  You suspected **(a) reckoning has to be non-coerced and owned by the people doing it** and **(b) it has to survive the generation that didn't live through any of it via institutionalization**. You are correct: these cannot both be fully satisfied. Germany's case leans on denial laws and compulsory school curricula (compulsion), which ensures transmission but undermines the "voluntary ownership" criterion; voluntary projects often die with the witness generation. Your rubric must weight one over the other depending on whether you prioritize *depth of ownership* (shorter lifespan) or *duration of transmission* (risk of resentment).

