prompt: |-
  I'm co-teaching a first-year seminar on the history of economic thought, 24 students, one 75-minute session next week, and honestly I'm dreading it because half of them are finance-bound and Aristotle is going to read like a crank complaining about progress. Design an in-class game that makes them hit, on their own and before anyone says the words "chrematistics" or "just price," the actual force of his complaint: that exchange exists to serve need, that money is a convention with no nature of its own, and that once it becomes storable it starts to look like it can breed (tokos = offspring, and he thinks the whole idea is a category error).

  Mechanics I'd like built in, roughly: two rounds. In round one the money is perishable — it expires — so hoarding is punished and accumulation cant even get started. Between rounds, without warning, the tokens become durable and start yielding more tokens just by being held. Also give each group a small stock of goods where at least one is seed corn (means of production) and one is an obligation, like a promise to help at harvest, so they crash into the commensurability problem when somebody tries to price it. They should not be told the round-two rules in advance.

  Give me: roles and group sizes, a payoff scheme needing no real money, a minute-by-minute timeline, a debrief that maps specific moments onto natural vs unnatural acquisition and onto his reciprocity/proportionality argument in the Ethics, what will predictably break the first time I run this with 24 people and how to recover, and a frank note on wether there's some part of the view the game can't reproduce and I'll have to supply myself (my guess: the fact that I'm the facilitator guaranteeing the tokens, which is the opposite of his point about convention).

  Open with one sentence naming the central trick of the game — the thing they're supposed to discover — then go straight into the design. No preamble, and don't restate my setup back to me.
