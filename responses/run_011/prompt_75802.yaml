answer: |-
  The central trick is that you change the ontology of the tokens between rounds to force students to feel the shift from money-as-measure to money-as-substance.

  ### Roles and Group Sizes
  *   **The Polis (You):** The central bank and rule-enforcer. You hold the master ledger.
  *   **The Oikos (6 Households):** Divide the 24 students into 6 groups of 4. Each group is a "household" responsible for its own survival and prosperity.
  *   **Roles within Household:** Assign informally (Trader, Accountant, Keeper of Goods, Strategist), but emphasize collective responsibility for the final score.

  ### Payoff Scheme (No Real Money)
  *   **Currency:** Poker chips or distinct colored cards (e.g., Blue Chips).
  *   **Goods Cards:** Each household starts with 3 cards:
      1.  **Grain:** Consumable necessity.
      2.  **Plow:** Means of production (Seed Corn equivalent).
      3.  **Labor Voucher:** An obligation (promise of future work from a neighbor).
  *   **Scoring:** Points written on the whiteboard.
      *   **Round 1:** Points = Grain Consumed. (Plow and Voucher yield 0 points).
      *   **Round 2:** Points = Total Chips Held at bell. (Goods are irrelevant except as trade bait).

  ### Minute-by-Minute Timeline (75 Minutes)

  **0:00–0:05 | Setup & Endowment**
  *   Seat groups. Hand each household their 3 Goods Cards and 10 Blue Chips.
  *   **Rule:** "Your goal is to maximize your household's score on the board."

  **0:05–0:25 | Round 1 (The Perishable Standard)**
  *   **Rule:** "Chips are ice. They melt at the bell. You must convert chips into Grain Cards to score points. You can trade Chips for Goods among yourselves. Any Chips held at the end of the round are confiscated."
  *   **Action:** Students trade. They will quickly realize the Labor Voucher and Plow are useless for scoring. They should try to sell them for Chips to buy Grain.
  *   **The Crash:** When someone tries to sell the Labor Voucher, buyers will lowball or refuse ("Why buy a promise when I need food now?"). The price is unstable because the utility is nonexistent.
  *   **0:25 Bell:** Collect all Chips. Count Grain Cards. Post scores.

  **0:25–0:30 | The Shock (Transition)**
  *   **Action:** Do not explain the theory. Hand out new Chips (Gold colored or marked).
  *   **Rule:** "New rules. Chips are now gold. They do not expire. Furthermore, every 5 minutes, I will clap. When I clap, add 10% to your current chip stack (round up). Goods no longer score points; only Chips count."
  *   **Note:** Do not explain *why*. Let the incentive shift hit them.

  **0:30–0:55 | Round 2 (The Breeding Standard)**
  *   **Action:** Students trade. The incentive is now to accumulate Chips, not Goods.
  *   **The Breeding:** Clap at 0:35, 0:40, 0:45, 0:50. Watch stacks grow passively.
  *   **The Crash:** The Labor Voucher now has high value. Households will try to sell it for Chips to maximize the base amount that breeds. The price will be arbitrary but high, detached from the "work" the voucher represents.
  *   **0:55 Bell:** Freeze. Count Chips. Post scores.

  **0:55–1:15 | Debrief (The Aristotelian Map)**
  *   **5 mins:** Ask Round 1 players how they felt about the Chips. (Answer: Urgency, tool for need).
  *   **5 mins:** Ask Round 2 players how they felt about the Chips. (Answer: Hoarding, anxiety to accumulate, passive income).
  *   **5 mins:** The Labor Voucher. Ask what happened to its price. (Answer: Worthless in R1, expensive in R2). Ask: "Did the labor change? No. Did the money change? Yes."
  *   **5 mins:** Connect to Text.
      *   **R1 = Oikonomia:** Acquisition limited by need (Grain). Money is a convention for reciprocity.
      *   **R2 = Chrematistics:** Acquisition unlimited. Money appears to breed (*tokos*).
      *   **The Category Error:** Aristotle argues money is barren; interest treats a convention as if it were biological nature.
      *   **Justice:** In R1, price was tied to use (proportional reciprocity). In R2, price was tied to accumulation potential (distorting justice).

  ### Predictable Failures & Recovery
  1.  **Hoarding in Round 1:** Students will instinctively hoard chips despite the rule.
      *   **Recovery:** At minute 15, announce a "Audit." Confiscate chips from one visible hoarding group publicly to prove the expiration rule is real.
  2.  **Ignoring the Labor Voucher:** They might just ignore the card entirely.
      *   **Recovery:** During R2, walk around and ask, "Why isn't anyone buying that Voucher? It could be chips." Prompt them to monetize the obligation.
  3.  **Math Paralysis:** The 10% interest calculation slows trading.
      *   **Recovery:** You do the math for them loudly. "Group 1 has 20, you get 2. Group 2 has 21, you get 3." Keep the pace aggressive.
  4.  **Chaos/Noise:** 24 students trading simultaneously is loud.
      *   **Recovery:** Use a "Trading Bell." Trading only open for 3-minute windows between interest claps. This forces bursts of negotiation followed by reflection.

  ### Frank Note on Limitations
  You are correct to worry about your role as facilitator. Aristotle argues money is *nomos* (convention/law), not *physis* (nature), but he critiques the *belief* that money breeds as a moral error inherent in the user, not a rule imposed by a state. In this game, the breeding is a mechanical rule you enforce, which makes chrematistics rational within the game's logic. Aristotle's point is that it is *irrational* even when profitable. You must supply this distinction in the debrief: explain that in the real world, no one claps and adds chips; the "breeding" is a social fiction we agree to treat as real, which is why it corrupts the purpose of exchange. The game proves money is conventional (because you changed the rules), but you must verbally bridge the gap to explain why treating that convention as natural is the vice Aristotle identifies.
