answer: |-
  ### I. Parameter Mapping and Structural Strain

  Your friend claims the practice embodies a theory of idealized preference. You claim it embodies a theory of capacity, rendering it incoherent. To adjudicate this, we must map the three operational features of the practice—**Revocation**, **Surrogate Hierarchy**, and **Bedside Reluctance**—against your five parameters of idealization: *Information, Vividness, Reflection, Coherence,* and *Standpoint*.

  **1. The Advance Directive (Creation)**
  This feature keys heavily on **Reflection** and **Coherence**. The law assumes that a document signed after deliberation, aligning with a lifetime of values, carries more weight than a passing whim. It keys moderately on **Information** (clinicians must disclose risks). However, it structurally fails on **Vividness**. No amount of disclosure grants acquaintance with the subjective state of advanced dementia. The **Standpoint** is explicitly the agent's own improved standpoint (the "planning self").

  **2. The Revocation Rule**
  This feature keys exclusively on **Capacity** and **Standpoint** (the current agent). It ignores **Reflection** (a sentence spoken in panic suffices), **Coherence** (the revocation may contradict a lifetime of values), and **Information** (the patient may be misinformed).
  *   *The Strain:* If the system were truly based on idealized preference, a terrified, exhausted competent patient (low **Reflection**, low **Coherence**) should *not* be permitted to overrule a calm, informed, reflective prior self (high **Reflection**, high **Coherence**). The fact that the law permits this proves your point: the switch is capacity, not idealization. The law prioritizes the *authority of the present agent* over the *quality of the preference*.

  **3. Bedside Reluctance**
  This feature keys almost entirely on **Vividness** and a shifted **Standpoint**. Clinicians and families observe the placid dementia patient and perceive a welfare state that contradicts the abstract directive. They privilege the *observed reality* (high **Vividness** for the observer) over the *documented wish* (high **Reflection** for the prior self).
  *   *The Strain:* If the system were based on capacity, this reluctance would be illegal (the patient lacks capacity, the document governs). If it were based on idealization, it would also be impermissible (the prior self was more idealized than the current demented self). Bedside reluctance is an extra-legal moral correction that admits the **Vividness** gap is morally significant, even if legally irrelevant.

  **Can they key on a single parameter?**
  No. To make them align on **Idealization (Reflection/Coherence)**, you would have to forbid competent revocation by non-ideal agents (legally monstrous). To make them align on **Capacity**, you would have to forbid bedside reluctance (clinically cruel). To make them align on **Vividness**, you would have to invalidate all advance directives (since no one has vividness of future incapacity).
  The strain is not accidental; it is functional. The practice uses **Capacity** as a bright-line administrative switch because **Idealization** is unmeasurable in real-time. The system pretends to be about idealization (to satisfy bioethical theory) but operates on capacity (to satisfy legal enforceability), with bedside reluctance acting as a pressure valve when the divergence becomes intolerable. You are correct that it is internally incoherent as a single theory; your friend is correct that it *aspires* to idealization but fails to enforce it consistently.

  ### II. Presuppositions vs. Fit (The Underdetermination Problem)

  We must separate what the practice *strictly presupposes* from what it *fits comfortably with*.

  **Strict Presuppositions**
  The practice presupposes only that **Capacity is a binary legal threshold**. It presupposes that a signature denotes intent. It does *not* strictly presuppose any specific metaphysics of personal identity or moral authority. It requires only that the prior signature be valid *until* a new valid signature (revocation) replaces it, or until a surrogate is legally empowered.

  **Rival Accounts Licensing the Same Behavior**
  Because the practice is underdetermined, rival theories of authority can license the exact same institutional behavior, meaning the practice cannot serve as evidence for your friend's theory over yours.

  1.  **Precedent Autonomy (Your Friend's View):** The prior self binds the future self.
      *   *Behavior:* Enforce the AD.
      *   *Fit:* High.
      *   *Conflict:* Struggles to explain why a panicked competent revocation is allowed (why does the non-ideal present bind the ideal past?) and why bedside reluctance occurs.
  2.  **Evidential Proxy:** The AD is merely the best evidence of what the *current* incompetent patient would want *if* they could speak.
      *   *Behavior:* Enforce the AD, unless there is new evidence (bedside demeanor).
      *   *Fit:* High. This explains bedside reluctance perfectly (the demeanor is new evidence). It also explains revocation (the competent patient is giving direct evidence, superseding the proxy).
      *   *Conflict:* Struggles with jurisdictions that treat ADs as binding commands rather than evidence.
  3.  **Best-Interests/Stranger (The "Moral Stranger" View):** The prior self is a stranger; their wishes count only as data about the current patient's welfare.
      *   *Behavior:* Enforce the AD only if it aligns with current welfare.
      *   *Fit:* Moderate. This licenses bedside reluctance easily. It struggles with strict enforcement of ADs that demand non-treatment when the patient seems content.
      *   *Crucial Overlap:* A judge operating on **Best-Interests** might rule to withdraw feeding tubes because they deem the *state of dementia* itself a harm, reaching the same conclusion as the **Precedent Autonomy** judge who rules based on *rights*.

  Because a Best-Interests standard and an Autonomy standard can produce identical rulings (e.g., "stop treatment"), the institutional behavior does not prove which theory is driving it. The practice fits your friend's theory comfortably, but it also fits an evidential or best-interests theory comfortably. It *presupposes* only the validity of the capacity switch. Therefore, the practice cannot resolve your disagreement because it is theoretically agnostic; it is a pragmatic tool used by people with different moral maps.

  ### III. Rebuilding on Consistent Idealization

  If we rebuilt the practice on a consistently idealization-based scheme—where authority belongs strictly to the self with the highest score on **Information, Vividness, Reflection, Coherence,** and **Standpoint**—the system would change radically.

  **1. Abolish Competent Revocation (The "Ulysses Contract" Model)**
  If the prior self was truly idealized (high **Reflection**, high **Coherence**) and the current competent self is terrified or exhausted (low **Reflection**, compromised **Standpoint**), the current self should *not* be allowed to revoke.
  *   *Consequence:* A competent patient screaming "I want to live" could be restrained and denied treatment based on a document signed years ago.
  *   *Verdict:* **Monstrous.** This violates the fundamental legal principle that a competent body cannot be invaded against its current will. It treats the competent adult as a child of their past self.

  **2. Abolish Bedside Reluctance**
  If the prior self is the idealized authority, the current demented self's contentment is irrelevant. The **Vividness** of the current state does not grant authority because the current self lacks **Capacity** and **Information**.
  *   *Consequence:* Clinicians would be mandated to withhold food/treatment from a smiling, eating dementia patient if the AD demanded it.
  *   *Verdict:* **Defensible** within strict autonomy theory, but **Monstrous** to common moral intuition regarding the welfare of sentient beings.

  **3. Extend Vividness Requirements**
  To make the AD truly idealized, the agent would need high **Vividness**.
  *   *Consequence:* ADs would be invalid unless the agent underwent rigorous simulation or temporary induced states approximating the condition.
  *   *Verdict:* **Impossible.** We cannot simulate dementia. This would effectively abolish advance directives.

  **Result:** A consistently idealization-based scheme is either unworkable (due to the Vividness gap) or tyrannical (due to the Revocation constraint). The current "incoherent" mix exists precisely to avoid these extremes. It accepts the **Vividness** deficit to allow planning, but accepts the **Idealization** deficit to allow current competent override and bedside mercy.

  ### Verdict

  **Who was closer to right?**
  You are closer to right regarding the **mechanism**, but your friend is closer to right regarding the **rationale**.
  *   **You:** Correctly identified that *Capacity* is the actual switch. The law does not measure idealization; it measures competence. Your diagnosis of incoherence is logically sound: a system that privileges the reflective past self but allows the panicked present self to overrule it is not consistently idealizing.
  *   **Your Friend:** Correctly identified that *Idealized Preference* is the normative story told to justify the system. The system *wants* to be about the reflective self binding the future self.

  **What was the argument really about?**
  The argument was not about a substantive disagreement about persons (metaphysics of identity). It was a disagreement about **how much theory a legal institution needs in order to be coherent.**

  *   **Your Friend** assumes that a legal practice must embody a single, coherent moral theory to be valid. They see the AD as a philosophical project: extending autonomy across time.
  *   **You** assume that a legal practice is a pragmatic instrument that may sacrifice theoretical coherence for functional safety. You see the AD as a regulatory tool: managing risk and liability.

  The truth lies in your assessment of the institution. Legal systems cannot operate on spectra (like **Reflection** or **Coherence**); they require binary switches (Capacity: Yes/No). Idealization is a spectrum; Capacity is a threshold. To make idealization legally actionable, the law must crudely map it onto capacity, creating the incoherence you identified. The "strain" you found is the friction between moral nuance and administrative legibility. The practice is not a failed theory of persons; it is a successful compromise that hides its theoretical contradictions to function in the real world. Your friend is arguing with the bioethics textbook; you are arguing with the courtroom. In the courtroom, you win.
