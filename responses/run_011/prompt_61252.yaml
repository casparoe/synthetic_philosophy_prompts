          *   *Real Argument:* It's not about persons (metaphysics); it's about how much theory a legal institution needs. The law uses a "muddle" to avoid the extremes of both positions. It uses Capacity as a bright line because Idealization is unmeasurable.
      *   *Refinement:* The User is right that the *switch* is capacity. The Friend is right that the *rationale* is often idealization. But the User wins on the *incoherence* point. The argument is about whether legal coherence requires metaphysical consistency (Friend implies yes, User implies no/the law is broken). Actually, the User argues the law *is* incoherent. The Friend argues the law *embodies a theory*. The truth is the law embodies a *compromise* that looks like a theory but functions on capacity.
