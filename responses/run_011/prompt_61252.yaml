      *   *Underdetermination:* The *same institutional behavior* (respect AD generally, allow competent revocation, sometimes ignore at bedside) can be licensed by *rival accounts*.
          *   *Example:* A "Best Interests" judge could enforce an AD because they believe death is in the patient's best interest. An "Autonomy" judge enforces it because it's a right. The outcome is the same.
