answer: |-
  Welcome everyone. We are here because of an argument that started at a dinner table and refused to end. Someone claimed a probe trained on one model flagged planning in another. The interpretability side said the mechanism transferred. The intervention side said the behavior did not change when they patched it. Nobody wants to admit we are disagreeing about what the word mechanism means.

  I am the only one here without a lab badge, and my training is in philosophy of biology. This makes me suspicious to both sides. The engineers think I will dissolve your weights into metaphors. The philosophers think I will reduce their concepts to code. I promise to do neither. I want to suggest that when we say two models share the same mechanism, we are actually making one of three different claims, and they do not travel together.

  First, there is shared descent. Two checkpoints fine-tuned from a common base stand in a genealogical relation. If a probe fires in both, it may be tracking inherited weights rather than a functional unit. This is like tracking a gene variant across a family tree. Second, there is shared causal role. If I break the circuit in model A and the behavior stops, and I do the same in model B and the behavior stops, that is structural homology, meaning similarity due to shared ancestry or structure. Third, there is shared job. The system produces the same output using whatever tools are available. In biology, wings built from skin and wings built from feathers both fly, but only one pair shares ancestry.

  Here is why this matters for your work on Monday. If you treat a probe as evidence about a new model, you are assuming shared causal role. But if that model was trained from scratch, you are looking at convergence, meaning independent evolution of similar traits, not inheritance. Similarity of role tells you nothing about shared ancestry. If that model was distilled, it sits awkwardly in between. A student trained on a teacher's outputs is not a descendant in the ordinary sense but is hardly independent either. If you assume descent where there is only convergence, you will trust monitors that are merely reading out historical artifacts. You might deploy a safety filter that works on the family tree but fails on the cousin trained from scratch.

  We need to be careful not to spend two days producing vocabulary and no experiments. That is the failure mode everyone is privately worried about. We leave here with a glossary and no protocols. Success looks like this: by Friday afternoon, we agree on which definition of mechanism determines whether a monitor is safe to deploy. If we cannot say whether a probe firing is evidence about the model or only evidence about the probe, we have failed.

  I will leave you with this joke. We are like biologists arguing over whether a whale is a fish while standing on a boat that might sink if the whale dives. The engineers know how to build the boat. The philosophers know how to classify the whale. Neither group knows if the hull holds.

  So I put three questions to the room.

  One: Should we trust a monitor that tracks inheritance even if it fails intervention tests?
  Two: Is functional convergence sufficient for safety guarantees without structural alignment?
  Three: Do we prioritize detection sensitivity over causal robustness when the definitions conflict?

  ***

  **Note to Organizer**

  I expect Question Two to draw the most resistance. Engineers will object because functional convergence is hard to verify without structural access, making it operationally useless. Philosophers will object because safety guarantees imply a truth claim about the system, which function alone does not secure.

  The biology is load-bearing in the distinction between fine-tuning (descent) and training from scratch (convergence). This directly dictates whether an engineer trusts a probe transfer. The wing analogy is merely decorative; it illustrates the concept but does not change the engineering protocol. You can cut the sentence about wings built from skin and feathers if you need to save time.
