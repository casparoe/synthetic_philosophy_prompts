prompt: |-
  I'm in a moral psychology seminar this semester and my paper is on the situationist attack on virtue ethics — the Doris/Harman line saying the experiments show people don't have the robust global character traits virtue ethicists assume. My draft uses Abu Ghraib as the running case and my prof basically told me I'm leaning on it way too casually, so I want to do it properly before I hand in a revision.

  Facts I'll assume we both know, so you don't have to recap the scandal: late 2003 into early 2004, a tier of the prison where a handful of Army Reserve MPs were holding detainees, the photos that went public in spring 2004, the internal investigation, and the framing that came down from the top that it was a few bad apples rather than a broken system. Also relevant: Zimbardo ended up testifying as an expert witness for one of the guards and afterwards argued it was the barrel, not the apples. And the piece I keep coming back to: Joseph Darby, an MP in the same unit, got a CD of the photos from another soldier, agonized over it for about a month, turned them over to Army CID in January 2004, then got outed publicly and had to be put in protective custody with his wife because his own hometown turned on him.

  What I want is a case analysis that runs both directions, not a summary of the debate.

  First, do the mapping carefully. Who exactly are the agents situationism is making a claim about here, and what is the situation — be specific rather than gesturing at "pressure": night shifts, no real training, overcrowding, a part of the prison run by intelligence people the MPs didn't control and weren't briefed on, unclear rules about what counted as permissible, and the fact that they were photographing themselves doing it. Then say what a situationist predicts for that setup and what a virtue ethicist who believes in global traits predicts, and where the two predictions actually differ rather than just differing in vocabulary.

  Second, where does the situation story explain things and where does it overclaim? I specifically want you to deal with Darby. Is he a genuine counterexample that shows robust character doing work in exactly the same barrel, or can situationism absorb him — his situation wasn't the same, he'd been promised anonymity, he wasn't in the room when it was happening, etc.? Don't let either side win by fiat.

  Third, and this is the part I actually care most about: I don't want my argument resting on Milgram and the Stanford Prison Study, because I know both have been picked apart — the archival re-readings that make Milgram's subjects look less like passive obedient automatons and more like people who identified with the scientific project, and everything that's come out about how the prison study was run and reported. So tell me what's left for the situationist once you pull the iconic studies out. Is there enough in the broader evidence to still run the Abu Ghraib case, or does the case now have to carry the whole weight itself as a real-world data point rather than a lab result? And what does the fact that this happened with no experimenter in a lab coat do to the debate — does it help situationism because it's ecological validity, or hurt it because it makes the situational explanation close to unfalsifiable?

  Also tell me where the two sides are just talking past each other, like whether the fight is really about how to describe character at all or about what predicts behavior, since I suspect I've been conflating those.

  Two asks on the epistemics. One: seperate out what's actually settled from what's still live among people who work on this. My prof hates it when undergrads present a contested view as consensus, so if I'm about to claim something like everyone now agrees character traits don't predict behavior, flag it and tell me what I should say instead. Two: since I'm working partly from memory of the news coverage, point out anywhere above I've gotten a detail wrong or overstated it, and don't build your analysis on a fact I gave you that you're not confident about.
