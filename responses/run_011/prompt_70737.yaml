          *   *Predictions:* Situationist (behavior varies with situation, traits are local/fragile) vs. Virtue Ethicist (global traits should resist situational pressure, vice explains the abuse).
          *   *Difference:* It's not just vocabulary; it's about *consistency* across contexts and *explanatory power*.

      *   **Section 2: The Darby Problem.**
          *   *Situationist Defense:* Darby's situation *was* different (not on night shift, had access to CID channel, different social incentives). Or, Darby shows local traits (loyalty to army values vs. loyalty to unit).
          *   *Virtue Ethicist Offense:* Darby proves global traits exist; same barrel, different apple. He resisted the "barrel."
          *   *Nuance:* Avoid declaring a winner. Show how each side assimilates the data.

      *   **Section 3: Beyond the Lab (Milgram/Zimbardo).**
          *   *Status of Lab Studies:* Acknowledge the critiques (Haslam/Reicher on SPE, Gibson on Milgram).
          *   *Remaining Evidence:* Field studies, real-world atrocities, consistency data (Hartshorne & Mayne).
          *   *Ecological Validity:* Abu Ghraib helps situationism (real world) but risks unfalsifiability (post-hoc situational explanation).
