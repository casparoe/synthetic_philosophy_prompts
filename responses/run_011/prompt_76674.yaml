      *   **Topic:** Pessimistic Meta-Induction (PMI) in philosophy of science (Laudan's argument against Scientific Realism).
      *   **Participants:** Maya (Pro-PMI/Anti-Realism) vs. Dev (Anti-PMI/Pro-Realism).
      *   **Task:**
          1.  Evaluate each of the 6 moves (Clearly Right / Partly Right / Doesn't Land) with reasoning.
