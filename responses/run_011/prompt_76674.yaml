      *   **Move 1 (Dev):** Attacks the premise. Past theories weren't *actually* successful (phlogiston failed on weight, caloric failed on conservation, ether failed on M-M). Successful parts survive (Newton in Einstein).
          *   *Critique:* This is the "No Miracles" counter. But is it historically accurate? Phlogiston *did* predict some things, just not weight gain. Dev is redefining "success."
      *   **Move 2 (Maya):** Accuses Dev of question-begging. You can't use current truth to judge past success. If phlogiston existed, the theory was successful. Using Newton/Relativity continuity assumes current theory is the truth-yardstick.
          *   *Critique:* Strong point. PMI relies on the idea that we judge past success *by their standards*, yet they were still wrong. Dev is using *our* standards to say they failed.
      *   **Move 3 (Dev):** Claims "ontology-neutral" success. Prediction precision. Newton predicted orbits (mostly), Einstein kept that.
          *   *Critique:* This is the "Structural Realism" pivot without naming it. It tries to save the math, ditch the stuff.
      *   **Move 4 (Maya):** Traps Dev. If success is just prediction, realism (belief in the *stuff*) isn't saved. If success includes ontology, it's circular. Structural realism is arbitrary (how to split QM structure vs. interpretation?).
          *   *Critique:* Very strong. This hits the weak point of "selective realism."
