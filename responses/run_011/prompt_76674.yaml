          *   *Critique:* This is a standard statistical objection to PMI (Lewis, Saatsi, etc.). It's logically sound but relies on an assumption of progress.
      *   **Move 6 (Maya):** Grants sampling but asks for base rates. Why are *ours* the survivors? Just because they are ours? Dark Matter = Ether analogy (invisible patch for rotation curves vs. light propagation).
