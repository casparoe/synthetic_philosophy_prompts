answer: |-
  To the Collections Committee, my recommendation is that we retain the reassembled fragments as the accessioned work under the original 1994 number, decline the estate's proposal to substitute the new cast into that position, and keep the fragments in the collection rather than selling them back to the nephew. I know this splits the room, and I know it risks friction with the estate, but after nine years of handling the paperwork for this institution, I believe this is the only position that respects both the object we actually bought and the ethical standards we are expected to uphold, even if it requires us to have a difficult conversation about what we own versus what we display.

  To be fair to the estate, and because the nephew will be reading this, we need to acknowledge that their position is not greedy or ignorant, but rather rests on a specific view of what art is. They are arguing that the work is the form authorized by the artist, not the specific pile of clay that embodies it. In their view, the artist created the mold, the mold defines the shape, and the shape is the intellectual property that matters. They would say that because the new cast uses the original mold, the original clay source, and the artist's stamp, it carries the artist's intent more fully than a broken pot glued together with plaster. They see the reassembled figure as a damaged relic, a historical artifact of the accident, while the new cast is the living work, restored to its aesthetic integrity. If this were a bronze cast from an original mold, or a print from an original plate, we would agree with them without hesitation, because in those mediums the individual object is less important than the authorized image. They are asking us to treat this stoneware figure with the same logic, prioritizing the visual experience of the viewer and the continuity of the artist's vision over the history of the material. It is a coherent argument, and if the artist had intended this to be an editioned work, it would be the correct one.

  However, we are not dealing with an editioned work, and that is the first load-bearing fact here that decides the issue. The prompt notes the mold was made for a run of smaller maquettes, not for full-size reproduction. This means the artist did not authorize full-size copies from this mold during her lifetime, and the estate cannot retroactively authorize what the artist did not intend for this specific scale. When we bought this figure in 1994, we bought a unique object, not a token of an edition. In museum practice, the identity of a unique sculpture is tied to the specific material history of that object, the specific hand of the artist that shaped that specific clay. The reassembled fragments retain that history. Even with the fifteen percent loss filled with plaster, the remaining eighty-five percent is the clay the artist touched in 1978. The new cast, while chemically similar and formally identical, was shaped by gravity and pressure in a mold, fired decades later by different hands. It is a twin, not a survivor. To swap them would be to tell our visitors that the history of the object does not matter, only the shape, and that sets a precedent that devalues every unique work in our care.

  I know the worry is that if we accept the reassembled figure with fifteen percent fill, we are admitting that material continuity matters more than form, so why does a mold-made copy with one hundred percent of the form not count? The answer lies in the difference between a scar and a mask. The plaster fill on the reassembled figure is subordinate to the original shards; it is there to support the original material, to hold the history in place. It is a repair, not a replacement. The new cast is entirely replacement. There is no original material in it to repair. If we accept the new cast as the work, we are saying the object is disposable as long as the shape persists, which contradicts the basic agreement of a museum collection. We preserve the specific thing, not the idea of the thing. The fifteen percent fill is acceptable because it is honest about the damage, whereas the new cast is honest about being a copy but dishonest if presented as the original survivor. The line is not about how much material is lost, but about whether the chain of physical causality from the artist's hand to the present day has been broken. In the reassembly, the chain is bruised but unbroken. In the new cast, the chain was snapped in 1979 and restarted last January.

  Regarding the specific decisions we need to make, we should keep the original accession number on the reassembled fragments. This maintains the provenance record exactly as it was established in 1994. The new cast should not receive that number. If we decide to accept it into the collection, which I suggest we do because it is a significant piece of the artist's legacy, it must be accessioned as a new object with a new number, clearly described as a posthumous cast produced by the estate in 2023 from the original mold. This honors the estate's effort without conflating the two objects. Consequently, we should not sell the reassembled fragments to the estate. They are not merely evidence or a relic; they are the work we own. Selling them would be deaccessioning the primary work to replace it with a copy, which violates our ethical code. We keep the fragments, we display them, and we accept the new cast only as a secondary object if space and mission allow.

  For the wall label, honesty is our only shield against criticism. The label for the reassembled figure should state the original creation date, the material, and a note that it was conserved in 2023 following structural damage, with losses filled. The label for the new cast, if we display it nearby, must state it is a posthumous cast made in 2023 from the original mold. This allows the public to see both the history of the object and the continuity of the form, without confusing the two. For the insurer, we must schedule the reassembled fragments. They are the insured property under the original policy terms. The value should be reassessed based on its current condition as a conserved work, not its pre-accident value, but it remains the insured item. The new cast is a separate asset with its own value, likely lower than the original unique work given its posthumous status, and it should be scheduled separately if we keep it.

  There is one detail in the setup that could flip this answer entirely, and I need to flag it for the committee before we vote. You mentioned the insurer paid out a total loss. In many insurance settlements, when a total loss is paid, the salvage rights transfer to the insurer. If the insurer owns the shards, we do not have the right to decide whether to keep or sell them; we would be holding them on behalf of the insurance company. We need to verify the settlement terms immediately. If the insurer owns the shards, our decision is moot unless we buy them back, and the estate's offer to buy them might actually be the only way to keep them in the public sphere. If, however, the settlement allowed us to retain the salvage in exchange for the payout, then my recommendation stands. I am proceeding on the assumption that we hold clear title to the fragments, but if that assumption is wrong, the entire ethical framework shifts from collection management to asset recovery.

  Finally, regarding what we owe the estate by way of explanation, we cannot simply cite policy because our policy is outdated. We owe them a respect for the artist's original intent. We should explain to the nephew that honoring his aunt means respecting the uniqueness of the work she sold us in 1994, which was defined by her hand shaping that clay, not by the mold she made for smaller studies. We can offer to display the new cast alongside the reassembled original, perhaps in a case showing the mold and the stamp, turning this difficult situation into an educational opportunity about how sculptures are made and how they survive. This acknowledges the estate's contribution without compromising the integrity of the collection. The load-bearing facts here are the intent behind the mold's creation and the continuity of the material; the decoration is the source of the clay or the specific kiln used, which adds flavor but does not change the identity of the object. If the mold had been intended for full-size editions during her life, or if she had stamped the new cast herself before dying, the estate's case would be stronger, but as it stands, the history runs through the shards, not the mold. We must vote to keep the shards, keep the number, and tell the truth on the wall.
