prompt: |-
  I'm a first-year MA student and our moral psychology seminar has been doing something strange. Half the reading list is Plutarch's Lives and two medieval saints' lives — no articles, no chapters from anybody writing now. When I brought this up in office hours (I said that hagiography is mostly invented, that the saint never sins interestingly, and that after four weeks I hadn't come away with anything I could apply to an actual question), my tutor said something like "example is better than precept" and we moved on to the next student. Its maddening, because I'm fairly sure there's at least five different claims packed into that saying, I doubt they're all true, and I'm nearly certain he slid between them.

  Can you take it apart? Lay out the different precise propositions the line could be standing in for — the ones about how people actually learn, the ones about what an example can tell you that a rule can't, the ones about what motivates versus what convinces, the ones that are really just claims about what order to teach things in, whatever else is hiding in there — and for each say whether it's a platitude nobody would deny, a substantive claim that needs evidence, or just false. I want it as a menu I can work through, not you picking the reading you think is right and explaining it.

  Then tell me which of those readings, if true, would actually answer my objection. I raised two separate things: that the examples may be fabricated or airbrushed, and that even granting they're fine as stories, I didn't get anything usable out of them. My suspicion is that no reading survives both, and that the one which survives the fabrication worry is so weak it wouldn't justify dropping the articles — but tell me if I'm wrong about that. If some reading does survive, say what kind of finding would count as evidence for it (I assume there's a developmental psychology literature on learning from models, and something about exemplars in ethics), and whether that evidence should be expected to hold for heavily idealised examples as well as realistic ones. That second part is the one I actually care about, because my objection wasn't that Plutarch is hard going, it was that the person on the page has been sanded down until there's no friction left to learn from.

  Also: is the line just a restatement of "show, don't tell", or of the thing people say about children copying their parents rather than listening to them? If it collapses into either, say so, because then it isn't a claim about reading at all and my tutor owes me a different argument entirely. And if your honest verdict is that the saying has no determinate content and was being used purely as a conversation-ender, say that too — I'd rather hear it than get a charitable reconstruction I can't do anything with.

  One formatting request: no headings, no bullet points, no bold, no tables. Just continuous prose, like an email to a colleague, even if it runs long.
