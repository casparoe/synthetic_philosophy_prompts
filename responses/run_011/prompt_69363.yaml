answer: |-
  Dear colleague, I share your frustration, and I think your instinct to dissect the aphorism rather than accept it as wisdom is the correct methodological move here. The phrase example is better than precept is one of those durable pieces of folk wisdom that sounds profound precisely because it is ambiguous enough to accommodate several conflicting psychological and pedagogical claims. If we are to treat this seriously as a justification for a graduate seminar reading list, we need to separate the distinct propositions hiding inside it, because they do not all stand or fall together, and most of them do not survive contact with your specific objections about fabrication and usability.

  The first proposition hidden in the saying is a claim about motivational efficacy. This reading suggests that knowing what is right via a rule does not move the will to act, whereas encountering a concrete instance of virtue stimulates emulation through admiration or emotion. This is a substantive claim that needs evidence, drawing on the Humean tradition in moral psychology which prioritizes sentiment over reason. While there is evidence that narrative transportation can increase empathy, this claim does not help your tutor much because it addresses why we act, not what we learn. You objected that you did not come away with anything applicable to an actual question. Even if the saint's life motivates you to be better, it does not necessarily equip you with the conceptual tools to analyze moral psychology, which is presumably the goal of an MA seminar. Furthermore, this claim is vulnerable to your fabrication objection only if the reader knows the example is fake; if the reader believes the saint was real, the motivation works regardless of truth, but if the reader knows it is hagiography, the motivational power often collapses into cynicism rather than inspiration.

  The second proposition is epistemic, suggesting that examples contain moral knowledge that precepts cannot capture. This is a claim associated with moral particularism, the view that moral truth is too context-dependent to be codified into universal laws. This is a highly substantive and controversial claim in meta-ethics. If this is what your tutor means, they are arguing that you cannot learn moral psychology from articles because articles deal in precepts and variables, whereas lives deal in the irreducible complexity of agency. However, this reading crashes directly into your objection about airbrushing. For an example to teach particularism, it must show the friction of conflicting duties and the messiness of decision-making. If the saint never sins interestingly, as you noted, the example has been stripped of the very particularity that supposedly makes it superior to a rule. A sanded-down example functions exactly like a precept it just wears a narrative mask. It says be brave without showing the cost of cowardice or the ambiguity of the situation. So, while this is the most intellectually charitable reading of your tutor's comment, it is falsified by the specific quality of the texts you are reading.

  The third proposition is about pedagogical order, implying that examples should precede precepts in a curriculum. This is a claim about cognitive development, suggesting that abstract reasoning requires concrete scaffolding. This is partially a platitude in early education; children do learn concepts before definitions. However, you are a first-year MA student. The claim that graduate students need concrete examples before they can handle theoretical articles is substantive and likely false given your level of training. In fact, at your level, examples without theory often lead to the exact problem you described a lack of usable takeaways. You need the precepts to analyze the examples. Without the contemporary literature to provide the framework, the lives are just stories. This reading does not survive your usability objection because it inverts the necessary relationship between theory and case study at the graduate level.

  The fourth proposition is mnemonic, claiming that stories are simply remembered better than abstract principles. This is largely a platitude supported by cognitive psychology; humans are generally better at recalling narrative structures than propositional lists. However, recall is not understanding. Remembering the story of a saint is not the same as understanding the psychological mechanisms of virtue. This claim might be true, but it is trivial. It justifies using stories as a hook, but it does not justify replacing articles entirely. If the goal of the seminar is memory, this works. If the goal is analysis, this is insufficient. This reading survives the fabrication objection because false stories are as memorable as true ones, but it fails to answer your usability objection because memorability does not equate to analytical applicability.

  The fifth proposition is about the mechanism of learning itself, specifically social learning theory, which posits that we learn behavior primarily through observation and imitation of models. This is a substantive claim with strong evidence in developmental psychology. Children do copy parents more than they listen to instructions. However, this literature usually emphasizes the importance of the model being perceived as similar to the learner and the behavior being attainable. Heavily idealized examples, like saints who never sin interestingly, often fail as models for imitation because they are too distant from the learner's reality. This is known as the similarity-attraction effect in modeling. If the model is too perfect, the learner disengages because the standard seems unreachable. Therefore, this reading is vulnerable to your airbrushing objection. The friction you miss is actually the necessary data point for imitation; you need to see how the model struggles to know how to replicate the success.

  Now, to your question about whether this collapses into show don't tell or parental modeling. The phrase does bear a family resemblance to show don't tell, but that is an aesthetic prescription for writers, not an epistemic claim for readers. Show don't tell means make the experience vivid for the audience. It does not mean the vivid experience contains more truth than a summary. If your tutor is relying on this, they are confusing literary merit with pedagogical utility. Similarly, while it echoes the observation about children copying parents, that is a claim about developmental psychology in immersive social environments, not about reading texts in a seminar. Reading about a model is not the same as observing a model in a social context. The cognitive processing involved in hermeneutics is different from the mirror-neuron processing involved in social mimicry. If the saying collapses into either of these, it ceases to be a valid argument for a reading list in moral psychology. It becomes an argument for creative writing or childcare, neither of which is the seminar's aim.

  Regarding which reading survives both your objections, I am inclined to agree with your suspicion that none of them do robustly enough to justify excluding contemporary articles. The motivational reading survives fabrication but fails usability. The epistemic reading fails fabrication. The pedagogical reading fails your level of expertise. The mnemonic reading is too weak to justify the curriculum. The social learning reading fails the airbrushing objection. There is a narrow path where the motivational claim works if the goal is character formation rather than academic analysis, but even then, the lack of friction reduces the utility. To answer your question about evidence, if the epistemic claim were true, we would expect to see data in moral psychology showing that participants exposed to narrative exemplars outperform those exposed to principle-based training on complex moral reasoning tasks. There is some literature on this, often under the header of narrative ethics or exemplarism, but the findings are mixed and usually depend on the realism of the exemplar. Evidence regarding idealized examples specifically suggests they can inspire but often fail to guide action in novel situations because the learner cannot map the idealized behavior to their own constrained reality. This is the friction you are missing. Without the struggle, there is no map.

  So, is the saying just a conversation-ender? In the context of a graduate seminar where a student asks for theoretical applicability and receives an aphorism, yes, I believe it is being used rhetorically to shut down inquiry rather than to advance it. It has no determinate content in this setting because your tutor did not specify which of the five propositions they were endorsing. If they meant the epistemic claim, they should have engaged with particularism. If they meant the motivational claim, they should have acknowledged the limit of motivation for academic analysis. By offering the aphorism without qualification, they treated a complex pedagogical question as a matter of traditional wisdom. This is not to say the lives of saints and Plutarch are without value; they are rich texts. But to claim they are better than precept without specifying in what way and for what purpose is to dodge the specific critique you raised about applicability and authenticity. You are right to feel that the friction has been sanded down, and you are right that without that friction, the example functions merely as a precept in disguise, which defeats the entire purpose of the aphorism your tutor offered you. I would suggest pressing them on which specific psychological mechanism they believe the texts are engaging, because until they specify that, the aphorism is doing no work other than signaling authority.
