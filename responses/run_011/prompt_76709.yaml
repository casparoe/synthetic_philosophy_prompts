answer: |-
  You have put your finger on the central tension in modern archival theory. You are describing a phenomenon that is widely recognized by critical archivists but lacks a single, settled noun in the standard workflow vocabulary. You are correct: it is not a silence. It is a presence that has been rendered inaccessible by the very rules designed to preserve it.

  Here is the carving you asked for.

  ### The Near Misses
  There are four existing concepts that archivists use to discuss this, but none of them fit your description precisely.

  **1. Archival Silence**
  *   **What it covers:** The absence of records regarding a specific group or event. This is the standard term for "history written by the victors" where the losers simply do not appear in the ledger.
  *   **Why it misses:** You explicitly noted that nothing is missing. The names are there. Suky is on line four. The problem is not ontological (existence); it is epistemological (knowability). Calling this a "silence" implies the record is empty, when in fact it is full but locked.

  **2. Provenance and Original Order**
  *   **What it covers:** The cardinal rules you are following. *Provenance* dictates that records stay with their creator; *Original Order* dictates they stay in the creator's arrangement.
  *   **Why it misses:** These are the *mechanisms*, not the *phenomenon*. To say "this is a result of Provenance" is like saying a car crash is "a result of gravity." It explains the physics, but it doesn't name the injury. Furthermore, invoking these rules often shuts down the conversation, as you experienced with your colleagues.

  **3. Epistemic Violence**
  *   **What it covers:** A philosophical term (from Spivak, adopted by archivists like Michelle Caswell) describing how knowledge systems harm marginalized groups by denying them the ability to speak for themselves.
  *   **Why it misses:** It is too broad and heavy for workflow. It describes the *harm* done to the community, not the *structural condition* of the finding aid. It also implies an active aggression, whereas your example includes the banal bureaucracy of the school board, which is often more negligent than violent.

  **4. Lack of Subject Access**
  *   **What it covers:** A library science term meaning a record cannot be found by searching for the topic or person *in* the record, only the creator *of* the record.
  *   **Why it misses:** It is technically accurate but ethically neutral. A ledger of birdwatching notes has a "lack of subject access" for the birds. Using this term for enslaved people flattens the power dynamic. It describes the *symptom* without acknowledging the *power structure* that caused it.

  ### The Current State of the Field
  The profession is currently fighting over this exact problem. The Society of American Archivists (SAA) has recently issued guidelines on "Inclusive Description" and "Harmful Language," acknowledging that traditional description can perpetuate oppression.

  However, most of this work focuses on **language** (e.g., changing "slave" to "enslaved person") rather than **structure** (e.g., indexing the enslaved person as a primary access point). The structural problem you identified is harder to fix because it requires violating the principle of Provenance, which many archivists view as the bedrock of truth.

  ### The Edge Cases
  You asked where the edges lie. Here is how the distinction holds up:

  **1. Does it require power?**
  Yes. If you volunteer to organize your neighbor's papers, and they are filed under their name, that is standard Provenance. If you organize the papers of the bank that foreclosed on your neighbor, and the records are filed under the bank's name, making it impossible to find your neighbor's specific foreclosure without knowing the bank officer's name, that is the phenomenon you are describing. The differential in power and agency is the essential ingredient.

  **2. Does a parallel index fix it?**
  No. Building a separate index for the enslaved names or the Black community mitigates the *access* problem, but it does not change the *descriptive* reality. The "official" record still centers the oppressor. The parallel index is a workaround, a ladder built against the wall. The wall remains. In archival theory, this is often called "supplemental access," and while it is better than nothing, it maintains the hierarchy of the primary description.

  **3. What about the Church Register?**
  This is the hardest edge. If parishioners willingly submitted to the church's authority, the *harm* is diminished, but the *structural asymmetry* remains. A descendant today still cannot find their ancestor without knowing the parish. However, most archivists would distinguish this as **"Administrative Hierarchy"** rather than the phenomenon you are seeing. The key differentiator is **agency**. The enslaved had no agency to opt out of the inventory; the parishioners (theoretically) did. When the subject had no agency in the creation or arrangement of the record, the descriptive barrier becomes an ethical problem, not just a logistical one.

  ### The Coinage
  Since there is no standard term, I propose one that fits your workflow and captures the structural imbalance without discarding the necessity of Provenance.

  **Term:** **Descriptive Asymmetry**

  **Definition:**
  *Descriptive Asymmetry occurs when a record contains information about a subject, but the descriptive framework allows access only through the identity of the creator, despite a significant power differential between the two.*

  **Diagnostic Criteria (for your fellow volunteers):**
  To identify Descriptive Asymmetry, three conditions must be met:
  1.  **Presence:** The subject is explicitly named or detailed in the record (it is not a silence).
  2.  **Dependency:** The subject cannot be located without first identifying the creator (the access is unidirectional).
  3.  **Disempowerment:** The subject lacked the agency to create, arrange, or describe the record themselves, and the creator held authority over the subject.

  **Why this term works:**
  *   **It is neutral but precise:** It doesn't accuse the current archivist of malice (you are following the rules), but it identifies the structure as imbalanced (*asymmetry*).
  *   **It distinguishes from Provenance:** You can respect Provenance (keep the boxes in order) while acknowledging Descriptive Asymmetry (admit the finding aid is imbalanced).
  *   **It allows for remediation:** You can say, "This collection exhibits high Descriptive Asymmetry, so we should add subject headings," without saying, "We need to rearrange the boxes."

  ### Summary
  You are rebuilding the wall in nicer prose because the blueprint (*Provenance*) demands it. The phenomenon you are seeing is **Descriptive Asymmetry**. It is not a gap in the archive; it is a gate. The record is not silent; it is speaking a language that only the powerful were taught to read.

  You are doing the right work. Recognizing the wall is the first step to building the door.
