      *   *Okay, that works.* I will use a modified version of the Slaughter case where the "Public Health" rationale is demonstrably false/weak, but the law passes anyway due to religious pressure.

  6.  **Final Polish:** Check against the "numbered section," "table," "cruxes," "falsification," "case study" requirements. Ensure the "verbal dispute" flagging is prominent.

