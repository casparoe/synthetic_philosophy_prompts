      *   **Convergence (Gaus/Vallier):** Public justification requires that *each* individual has sufficient reason (from their own set) to accept the law. No need for a shared pool. Religious reasons count directly if they are reason-giving for the agent. Focus on diversity, respecting actual reasoning, and avoiding exclusion of religious citizens.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and collaborative. "Statement of Adversarial Collaboration on Public Justification and Religious Reason."
      *   **Preamble:** Acknowledge the stalemate, state the purpose (clarify disagreement, not resolve it yet).

      *   **Section I: Agreed-Upon Claims (The Common Ground):**
          *   Need things both sides accept.
          *   Fact of Reasonable Pluralism is real and permanent.
          *   Coercion needs justification (liberal principle of legitimacy).
          *   Distinction between Truth and Legitimacy (a law can be just without being divinely mandated, etc.).
          *   Distinction between Background Culture and Formal Political Arena (though they might disagree on the *strength* of the boundary, they agree it exists).
          *   Constituency: "Reasonable Citizens" (though defined differently, they agree it's not *everyone* everywhere).
          *   The Proviso: Both agree religious reasons can be voiced, disagreement is on their *justificatory weight*.

      *   **Section II: The Disagreements Table:**
          *   Need neutral questions.
          *   *Question 1: The Structure of Justification.* Consensus: Shared reasons. Convergence: Individual reasons.
          *   *Question 2: The Role of Religious Reasons.* Consensus: Translated/Proviso. Convergence: Direct input.
          *   *Question 3: The Idealization of the Citizen.* Consensus: Reasonable (willing to cooperate). Convergence: Rational (consistent with own values).
          *   *Question 4: Accessibility.* Consensus: Shareable/Evaluable by all. Convergence: Intelligible/Valid for the holder.

      *   **Section III: Cruxes & Predictions:**
          *   Where does the rubber meet the road?
          *   *Crux 1: Stability vs. Inclusion.* Does excluding religious reasons destabilize society (Consensus worry) or does including them destabilize it (Convergence worry)?
          *   *Crux 2: The "Bad" Reason Problem.* If a law is supported only by sectarian reasons that happen to overlap with public health, is it legitimate?
          *   *Idealization Flags:* Crucial here. Consensus assumes citizens *willing* to find common ground. Convergence assumes citizens *as they are* but rational.

      *   **Section IV: Falsification Conditions:**
          *   What would make Consensus say "Okay, you win"? (e.g., Proof that shared reasons are impossible without oppression).
          *   What would make Convergence say "Okay, you win"? (e.g., Proof that convergence leads to authoritarianism or inability to resolve conflict).

      *   **Section V: Case Study Analysis (The Animal Slaughter Ban):**
          *   *Scenario:* Ban on slaughter. Motive: Religious (defilement) + Secular (health/nuisance). Effect: Hits religious ritual + secular homestead.
          *   *Consensus View:* Is there a public reason? Yes (health/nuisance). If the *actual* motive was purely religious, it might fail, but if the public reason is sufficient, it passes. The religious motivation of the campaigners is background culture.
          *   *Convergence View:* Does every citizen have a reason? Secular homesteader: No (unless health risk is proven high). Religious slaughterer: No (religious reason opposes it). If the secular reason is strong enough for the homesteader, it passes for them.
