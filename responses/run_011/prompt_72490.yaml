      *   *Convergence:* Legitimate (if everyone has *some* reason, even if different).
      *   *Wait, Convergence requires everyone to have a reason.* If the secular homesteader has no reason to accept the ban, Convergence also rejects it.
      *   *Key Difference:* Consensus requires the *justification offered by the state* to be public. Convergence requires the *citizens' acceptance* to be based on their own reasons.
      *   *So:* If the State offers *only* religious reasons in the official text.
