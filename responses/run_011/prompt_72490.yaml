answer: |-
  **STATEMENT OF ADVERSARIAL COLLABORATION ON PUBLIC JUSTIFICATION AND RELIGIOUS REASON**

  **Date:** October 24, 2023
  **Subject:** Clarification of Disagreement between Consensus and Convergence Frameworks
  **Signatories:** The Consensus Working Group (Rawlsian/Larmorean) & The Convergence Working Group (Gausian/Vallierian)

  ### PREAMBLE

  The undersigned acknowledge that recent seminar discourse has suffered from equivocation regarding key terms and divergent assumptions regarding the idealization of the citizenry. This document does not resolve the substantive dispute. Its purpose is to isolate the precise locus of disagreement, distinguish verbal disputes from substantive ones, and establish conditions under which empirical or conceptual evidence would alter our respective positions. We agree to treat this document as the baseline for all future engagement in this seminar.

  ### I. JOINT COMMITMENTS

  Both camps affirm the following claims. Disagreement on these points is excluded from the scope of this collaboration.

  1.  **The Fact of Pluralism:** Reasonable citizens in a free society will inevitably develop incompatible comprehensive doctrines (religious, philosophical, moral) due to the burdens of judgment. This pluralism is not a temporary historical condition but a permanent feature of democratic life.
  2.  **The Liberal Principle of Legitimacy:** The exercise of political power is legitimate only when it is justifiable to those subject to it. Coercion without justification is mere force.
  3.  **Legitimacy vs. Truth:** A law may be legitimate without being true (in a metaphysical or theological sense), and a law may be true without being legitimate. The question at hand is legitimacy, not theological correctness.
  4.  **The Constituency:** The relevant justificatory constituency is "citizens," understood as free and equal members of the political order. It does not include non-citizens outside the jurisdiction, though their interests may be morally relevant.
  5.  **Background Culture:** There is a distinction between the "background culture" (civil society, churches, universities, media) and the "public political forum" (courts, legislatures, executive orders). Religious reasons are permissible in the background culture. The dispute concerns the public political forum.
  6.  **The Proviso:** Religious citizens are not required to silence their religious convictions when entering public debate. They may introduce religious reasons provided they are prepared to show how these connect to public values (Consensus) or provided the outcome is justifiable to others (Convergence). The dispute concerns the *justificatory weight* of the religious reason itself, not its utterance.
  7.  **Exclusion of the Unreasonable:** Citizens who refuse to offer any terms of cooperation to others (e.g., theocrats seeking to impose doctrine without regard for dissenters) fall outside the scope of reasonable pluralism and do not have a veto over legitimacy.

  ### II. MAP OF DISAGREEMENTS

  | Question | Neutral Formulation | Consensus Formulation (Rawlsian) | Convergence Formulation (Gaus/Vallier) |
  | :--- | :--- | :--- | :--- |
  | **1. Structure of Justification** | What relation must hold between the reasons for a law and the citizens subject to it? | **Shared Reasons:** Legitimacy requires a *common* pool of reasons (public reasons) accessible to all reasonable citizens. The justification must be *one* story everyone can share. | **Individual Reasons:** Legitimacy requires that *each* citizen has sufficient reason within their own cognitive set to accept the law. The justification can be *many* stories that converge on the same law. |
  | **2. Role of Religious Reasons** | Can a religious reason serve as a primary justificatory premise for coercive law? | **No:** Religious reasons are not shareable by all reasonable citizens. They can motivate the agent but cannot serve as the public warrant for coercion. | **Yes:** If a religious reason is genuinely reason-giving for the agent and the law is justified to others via their own reasons, the religious reason is a valid part of the social justification. |
  | **3. Accessibility** | What does it mean for a reason to be "public" or "accessible"? | **Evaluability:** A reason is public only if any reasonable citizen can evaluate its weight and validity using common human reason and shared scientific premises. | **Intelligibility:** A reason is accessible if other citizens can understand *that* it is a reason for the holder, even if they do not accept the premise themselves. |
  | **4. The Proviso's Work** | What functional work does the "proviso" perform in justification? | **Translational:** It requires religious reasons to be translated into public language to count toward legitimacy. It ensures a common civic language is maintained. | **Assurance:** It serves as a signal of good faith. It assures others that the religious citizen is not seeking to impose doctrine for its own sake, but the religious reason itself still counts. |
  | **5. Idealization of Citizen** | How do we model the citizen in the justificatory test? | **Reasonable:** Citizens are idealized as willing to propose and abide by fair terms of cooperation. They bracket their comprehensive doctrines when deciding constitutional essentials. | **Rational:** Citizens are idealized as consistent pursuers of their own values (including religious ones). They are not required to bracket their doctrines, only to process information correctly. |

  ### III. CRUXES AND IDEALIZATION FLAGS

  The following are the sub-questions where settling the issue would move at least one camp. We explicitly flag the **Idealization Level** assumed by each camp, as shifting this level may flip the verdict.

  **Crux 1: The Stability of Exclusion**
  *   **Question:** Does requiring shared public reasons promote social stability, or does it alienate religious citizens and destabilize society?
  *   **Agreed Evidence:** Sociological data on religious citizen engagement in politics; historical data on civil strife in regimes requiring secular translation vs. regimes allowing religious argumentation.
  *   **Consensus Prediction:** Excluding religious reasons from *official justification* preserves civic friendship and prevents sectarian conflict.
  *   **Convergence Prediction:** Excluding religious reasons signals second-class citizenship, leading to alienation and instability.
  *   **Idealization Flag:**
      *   *Consensus:* Assumes **High Idealization (Reasonable).** Citizens value civic reciprocity enough to accept the bracketing of their deepest truths.
      *   *Convergence:* Assumes **Moderate Idealization (Rational).** Citizens value consistency with their actual doctrines more than abstract reciprocity.
      *   *Impact:* If citizens are modeled as *actual* people (Low Idealization), Convergence predicts Consensus leads to revolt. If citizens are modeled as *fully moralized* (Very High Idealization), Consensus predicts Convergence leads to fragmentation.

  **Crux 2: The "Bad" Reason Problem**
  *   **Question:** If a law is supported by a religious reason that is false (e.g., based on a theological error) but the law produces good outcomes, is it legitimate?
  *   **Agreed Evidence:** Thought experiments regarding laws based on false empirical beliefs vs. false theological beliefs.
  *   **Consensus Prediction:** Illegitimate if the *public* rationale relies on the false belief, because public reason requires truth-apt shared premises.
  *   **Convergence Prediction:** Legitimate if the citizens *believe* the reason is true and it coheres with their value system, provided they have no defeaters available within their own perspective.
  *   **Idealization Flag:**
      *   *Consensus:* Assumes **Epistemic Restraint.** Citizens agree to only use premises they can verify together.
      *   *Convergence:* Assumes **Epistemic Freedom.** Citizens use their own best judgment, even if fallible.

  **Crux 3: Individuation of the Proposal**
  *   **Question:** Do we test the justification of the *law-as-written*, the *law-as-motivated*, or the *law-as-experienced*?
  *   **Agreed Evidence:** Legislative history records vs. statutory text vs. impact assessments.
  *   **Consensus Prediction:** Focus on *Law-as-Written/Defended.* The official state rationale must be public.
  *   **Convergence Prediction:** Focus on *Law-as-Experienced.* Does each individual have a reason to accept the coercion they actually face?
  *   **Idealization Flag:**
      *   *Consensus:* Assumes **Institutional Perspective.** The State is the agent being justified.
      *   *Convergence:* Assumes **Social Perspective.** The Social Moral Code is the object being justified.

  ### IV. FALSIFICATION CONDITIONS

  Each side states what would count as evidence or argument against its own view.

  **Consensus Falsification:**
  We would abandon the Consensus requirement if it were demonstrated that:
  1.  There is no coherent set of "public reasons" that does not itself smuggle in a specific comprehensive liberal doctrine (i.e., if Consensus is proven to be sectarian in disguise).
  2.  Adherence to the proviso systematically prevents the redress of grave injustices that religious arguments successfully highlight (e.g., Civil Rights Movement counterfactuals).

  **Convergence Falsification:**
  We would abandon the Convergence requirement if it were demonstrated that:
  1.  Allowing non-shareable reasons leads to a "justificatory equilibrium" where contradictory laws are simultaneously justified for different groups, making collective action impossible.
  2.  The "intelligibility" standard is so weak that it permits coercion based on reasons that are demonstrably harmful to the coerced party's core interests without recourse.

  ### V. CASE STUDY ANALYSIS

  **Case A: The Animal Slaughter Ban (As Provided)**
  *   **Facts:** Ordinance bans all slaughter. Campaign led by congregations (religious defilement). Drafting Committee cites Public Health/Nuisance (secular). Secular animal-welfare groups support. Non-religious homestead affected.
  *   **Question:** Is this law publicly justified?

  | Camp | Verdict | Reasoning | Sensitivity to Individuation |
  | :--- | :--- | :--- | :--- |
  | **Consensus** | **Provisionally Legitimate** | The *official rationale* (Health/Nuisance) is a public reason. The religious motivation of the campaigners belongs to the background culture. As long as the health rationale is sufficient on its own, the law is justified. | **High.** If the legislative record shows the Health rationale was a *pretext* (i.e., they knew health risk was zero), Consensus deems it Illegitimate (bad faith). |
  | **Convergence** | **Contingent** | Depends on the homesteader. If the health risk is real, the homesteader has a reason to accept (safety). If the health risk is negligible, the homesteader lacks a reason within their set to accept the burden. The religious voters' reasons are valid for them, but do not justify coercing the homesteader. | **Medium.** Focuses less on legislative intent and more on whether the homesteader *actually* has a sufficient reason to accept the coercion given the facts. |

  **Discrimination Analysis:** Case A does *not* fully discriminate between the views because both camps can point to the secular health rationale to save the law. To force a divergence, we must remove the secular rationale's sufficiency.

  **Case B: The Discriminating Variant (The Sacred Zoning Law)**
  *   **Facts:** A city designates a specific plot as "Protected Sacred Ground."
  *   **Rationale:** The legislative text explicitly cites "Theological Sanctity" as the sole reason. No secular historical, ecological, or nuisance argument is available (the land is ordinary).
  *   **Impact:** A secular developer is barred from building housing there.
  *   **Question:** Is this law publicly justified?

  | Camp | Verdict | Reasoning | Prediction Record |
  | :--- | :--- | :--- | :--- |
  | **Consensus** | **Illegitimate** | There is no shared public reason. "Theological Sanctity" is not accessible/evaluable by all reasonable citizens. The state has failed to provide a common language justification. | **Consensus predicts:** This law violates civic reciprocity and treats secular citizens as subjects rather than equals. |
  | **Convergence** | **Potentially Legitimate** | If the secular developer has *their own* reason to accept the zoning (e.g., they value religious liberty generally, or they have alternative plots available, or they accept a social norm of respecting local sacred sites), the law is justified *to them*. The state's citation of theology is not a veto if the citizen's own reasons converge on acceptance. | **Convergence predicts:** If the developer cannot find *any* reason within their own value set to accept this, it is illegitimate. But the *source* of the law (theology) is not the blocker; the *lack of convergence* is. |

  **Crux for Case B:**
  *   **Consensus:** The *source* of the justification (Theology) invalidates the law immediately.
  *   **Convergence:** The *outcome* of the justification (Does the developer have a reason?) determines validity. The source is irrelevant.
  *   **Idealization Flag:**
      *   *Consensus:* Assumes the Secular Developer is **Reasonable** (expects public reasons).
      *   *Convergence:* Assumes the Secular Developer is **Rational** (expects reasons that fit their life, even if private).
      *   *Verdict Flip:* If we assume the Secular Developer is **Actual** (angry, sees no benefit), Convergence agrees the law is Illegitimate. If we assume the Secular Developer is **Idealized** (values social harmony), Convergence may deem it Legitimate. Consensus deems it Illegitimate regardless of the developer's attitude, because the *State* failed its duty.

  ### VI. VERBAL DISPUTES AND SLIDING TERMS

  We acknowledge the following terms have been used equivocally. Future usage must adhere to these definitions:

  1.  **"Accessible":**
      *   *Consensus Usage:* Accessible = Evaluable by common human reason (shared premises).
      *   *Convergence Usage:* Accessible = Intelligible as a motive (understandable that X believes P).
      *   *Resolution:* We will use **"Shareable"** for Consensus and **"Intelligible"** for Convergence.

  2.  **"Public":**
      *   *Consensus Usage:* Refers to the *forum* and the *premises* (Public Reasons).
      *   *Convergence Usage:* Refers to the *outcome* and the *constituency* (Public Justification).
      *   *Resolution:* We will specify **"Public Premises"** vs. **"Public Outcome."**

  3.  **"Reasonable":**
      *   *Consensus Usage:* A moral virtue (willingness to cooperate on fair terms).
      *   *Convergence Usage:* An epistemic status (responsive to evidence and logic).
      *   *Resolution:* We will specify **"Reasonable (Moral)"** vs. **"Rational (Epistemic)."**

  4.  **Idealization Level:**
      *   In all future arguments, we must state whether we are testing the law against:
          *   **Level 1:** Actual citizens with current biases.
          *   **Level 2:** Moderately idealized citizens (informed, consistent).
          *   **Level 3:** Fully idealized citizens (perfectly reasonable/rational).
      *   *Agreement:* Consensus tends to argue at Level 3; Convergence tends to argue at Level 2. Disagreements arising from this gap are noted as **Idealization Artifacts.**

  ***

  **Signed,**

  *The Consensus Working Group*
  *The Convergence Working Group*
