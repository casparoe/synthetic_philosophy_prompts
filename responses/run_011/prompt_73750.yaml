      *   *Better:* All groups analyze all mirrors, but apply the *specific criterion* they advocated for in Session 1.
      *   *Selection:*
          1.  **Boundary:** *Tardigrade Tun.* (Passes 9-B boundary check? 9-B has chemical boundary. Tun has physical. Tun has NO metabolism. If 9-B is alive due to boundary, is Tun?)
          2.  **Metabolism:** *Flame.* (Passes 9-B metabolism check? Yes. Is it alive?)
          3.  **Heredity:** *Prion.* (Passes 9-B info check? 9-B has polymer no heredity. Prion has heredity no polymer.)
          4.  **Evolution:** *Digital Organism/Flow Reactor.* (Passes 9-B evolution check? 9-B fragments no lineage. Reactor evolves.)
      *   *Wait, the prompt asks for:* "For each of the four criteria, choose one real entity that nearly everyone in the room will insist is alive yet fails the criterion as applied to 9-B, and one that nearly everyone will insist is not alive yet passes it."
      *   *Okay, I need 8 mirrors total (4 pairs).*
      *   *Criterion 1: Boundary/Individuality.*
          *   Alive but fails: **Mule** (Individual, but no reproduction/evolution). Wait, Mule fails Evolution, not Boundary.
          *   Alive but fails Boundary: **Fungal Mycelium** (Continuous, hard to define individual). Or **Siphonophore**. Let's use **Pando (Quaking Aspen)**. One genetic individual, physically disconnected.
          *   Not Alive but passes Boundary: **Oil Droplet / Coacervate**. (Chemical boundary, no life).
      *   *Criterion 2: Metabolism/Gradient.*
          *   Alive but fails: **Bacterial Spore / Tardigrade Tun**. (Alive, but no active metabolism).
