  ## 5. Limitations: What This Cannot Reproduce

  **The Temporal Scale of Uncertainty.**
  In real astrobiology, the "unknown unknowns" reveal themselves over years, not 90 minutes. In this activity, the uncertainty is *contained* within the dossier. Students know (meta-cognitively) that the answer is in the packet. They cannot reproduce the feeling of *genuine* ignorance where the next assay might reveal something physically impossible.
  *   **Instructor Supply:** You must supply the *weight* of the uncertainty. When they ask "Is this possible?", do not answer. Say: "The instrument says this is what is there. You decide if it's possible."

  ---

  ## 6. Dossier Audit (Critical Review)

  **The Conflict:**
  **Point 6 (No Catalysis)** is in direct tension with **Point 2 (Gradient Maintenance)**, **Point 3 (Isotopes)**, and **Point 7 (Acclimatization)**.
  *   *Why:* Maintaining a pH gradient at -18°C against diffusion requires active transport or extremely selective barriers. Kinetic isotope effects (Pt 3) require reaction rates that distinguish isotopes, which implies a transition state stabilization (catalysis). Acclimatization (Pt 7) implies regulation of these rates.
  *   *The Tell:* "Homogenized... gradient maintenance stops." This implies the *structure* is the catalyst. However, "Nothing enzyme-like has been isolated" is consistent with supramolecular catalysis. The tension is the *rate* ("90 times abiotic"). Abiotic mineral catalysis at -18°C is typically sluggish.
  *   *Verdict:* A competent biogeochemist would flag Point 6 as "Physically implausible as written." It suggests magic, not chemistry.

  **Minimal Repairs:**
  1.  **Modify Point 6:** Change "Nothing enzyme-like has been isolated" to "No *soluble* protein or mineral catalysts isolated. Activity is lost upon homogenization, suggesting the *supramolecular gel topology* acts as the catalytic surface."
      *   *Why:* This preserves the "Weird Life" aspect (no cells, no enzymes) but makes the chemistry physically valid (surface catalysis).
  2.  **Modify Point 2:** Qualify the rate. "90 times the rate of *uncatalyzed* abiotic control." (This is already implied, but make it explicit to distinguish from mineral catalysis).

  **Contamination Complication:**
  *   *Verdict:* **Include it.**
  *   *Placement:* **Round 2.**
  *   *Wording:* "Control swab of the cryobot melt-train shows low-copy terrestrial 16S rRNA. Specimen 9-B polymer fails to amplify under universal primers."
  *   *Why:* It forces them to weigh "Negative Evidence" (PCR failure) against "Positive Evidence" (Swab). It tests if they trust the *absence* of a signal.

  ---

  ## 7. Assessment of the Central Trick

  **The Risk:**
  Yes, the risk is real. By switching the scoring rule, you risk teaching students that "Life" is merely a bureaucratic threshold—a pragmatic decision with no ontological grounding. They may leave thinking, "It's alive if the insurance policy says so." This undermines the scientific search for a universal theory of life.

  **The Defuse:**
  You must explicitly separate the *Verdict* (Decision) from the *Definition* (Theory) in the final debrief.
  *   *Script:* "We changed the scoring rule to show you that the *Verdict* depends on risk. But notice that your *struggle* remained. You still argued about Heredity vs. Metabolism regardless of the points. That struggle is the science. The scoring rule just forced you to pick a side. The fact that you *couldn't* agree easily proves that our current criteria are broken, not that life is just a game. We need a better theory, not just a better scorecard."

  **Why this works:** It validates their intuition (that the biology didn't change) while highlighting the institutional reality (that decisions must be made). It positions the "Trick" as a demonstration of the *consequence* of theoretical ambiguity, rather than a replacement for theory.
