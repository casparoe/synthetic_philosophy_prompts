      *   *Criterion 4: Evolution/Darwinian.*
          *   Alive but fails: **Sterile Hybrid (Mule again)**. (Can't evolve).
          *   Not Alive but passes: **Autocatalytic Set / Crystal Defects**. (Selection/variation, not alive).
      *   *Selection for Activity:* I can't do 8 mirrors in 90 mins. I will select the 4 most biting ones that correspond to the 9-B ambiguities.
          1.  Metabolism -> **Flame** (Passes like 9-B, Not Alive).
