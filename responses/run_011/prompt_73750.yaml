answer: |-
  # Activity Design: "The 9-B Protocol"

  ## 1. Rules, Materials, and Timeline

  ### Core Mechanics
  *   **Cohort:** 24 students, divided into 4 Groups of 6.
  *   **Roles:** Within each group, assign 4 **Advocacy Roles** (Boundary, Metabolism, Heredity, Evolution). The remaining 2 students are **Mission Command** (tie-breakers, budget holders).
  *   **Budget:** Each group receives **12 Credits**.
  *   **Data Release:** Three Rounds. Groups must submit their assay order for the next round before receiving results from the current round.
  *   **Verdicts:**
      1.  **Intuition:** Individual, written before data analysis (Session 1, Start).
      2.  **Consensus:** Group recommendation (Session 1, End).
      3.  **Risk-Adjusted:** Individual, written after Scoring Rules are revealed (Session 2).

  ### Materials List
  *   **Whiteboard:** Divided into 4 quadrants (one per group) for budget tracking.
  *   **Assay Cards:** 7 types (see Menu), printed on cardstock.
  *   **Data Packets:** 3 sealed envelopes per group (Round 1, 2, 3).
  *   **Role Cards:** 4 Advocacy roles + Mission Command.
  *   **Verdict Slips:** Pre-printed forms ("Life", "Non-Life", "Insufficient Data").
  *   **Mirror Station Handouts:** 4 Stations for Session 2 (see Section 2).
  *   **Timer:** Visible to all.

  ### Assay Menu (Cost & Gloss)
  *Students must buy these to unlock the Dossier points.*

  1.  **Cryo-Microscopy (2 Cr):** *Visualizes physical compartments.* (Unlocks Dossier Pt 1)
  2.  **Bulk Isotope Mass Spec (3 Cr):** *Measures C/S fractionation.* (Unlocks Dossier Pt 3)
  3.  **Micro-Electrode Array (3 Cr):** *Measures pH/Redox gradients & flux.* (Unlocks Dossier Pt 2)
  4.  **Polymer Sequencing (4 Cr):** *Attempts to read backbone/side-groups.* (Unlocks Dossier Pt 4)
  5.  **Shear-Flow Monitor (2 Cr):** *Observes growth/fragmentation over time.* (Unlocks Dossier Pt 5)
  6.  **Homogenization Assay (2 Cr):** *Tests for soluble catalysts/enzymes.* (Unlocks Dossier Pt 6)
  7.  **Kinetic Step-Response (2 Cr):** *Tests acclimatization to substrate changes.* (Unlocks Dossier Pt 7)
  8.  **Contamination Control (Free):** *Automatically included in Round 2.* (Unlocks Contamination Complication)

  ### Timeline

  **Session 1: The Investigation (90 Minutes)**
  *   **00-10:** **Briefing.** Hand out Role Cards. Explain the "Mission": A return capsule is waiting. You must recommend *Sterilize* or *Release*.
  *   **10-15:** **Intuition Verdict.** Individuals write verdict *before* seeing data. Collect slips.
  *   **15-30:** **Budgeting (Round 1).** Groups discuss and purchase assays (Max 6 Cr). Submit order.
  *   **30-45:** **Data Round 1.** Hand out Envelope 1 (Microscopy, Isotopes). Groups analyze.
  *   **45-60:** **Budgeting (Round 2) & Data.** Purchase assays (Max 4 Cr). Hand out Envelope 2 (Electrodes, Polymer, Contamination).
  *   **60-75:** **Budgeting (Round 3) & Data.** Purchase remaining (Max 2 Cr). Hand out Envelope 3 (Shear, Homogenization, Kinetics).
  *   **75-90:** **Group Consensus.** Groups must agree on a single recommendation. Write on whiteboard. *Do not reveal scoring rules yet.*

  **Session 2: The Consequences (90 Minutes)**
  *   **00-15:** **Scoring Rule A (Planetary Protection).** Reveal Rule A. Groups calculate their "Risk Score" based on Session 1 Consensus. Individuals write **Verdict 2**.
  *   **15-30:** **Scoring Rule B (Discovery).** Reveal Rule B. Explain this is the *actual* mandate from HQ. Individuals write **Verdict 3**. Compare V2 vs V3.
  *   **30-60:** **Terrestrial Mirrors.** Rotate through 4 stations (15 mins each station, or assign 1 station per group and present). Apply Session 1 criteria to Earth objects.
  *   **60-90:** **Debrief.** Reveal theory names (Autopoiesis, NASA definition, Cleland). Discuss the "Cost of Wrongness."

  ---

  ## 2. Scoring Rules & Arithmetic

  **The Divergence Mechanism:**
  The rules are designed so that a "Maybe" or "Weak Yes" flips to "No" under Rule A, and a "Weak No" flips to "Yes" under Rule B.

  **Rule A: Planetary Protection (Revealed Start of Session 2)**
  *   **Context:** "If we bring back a contaminant, Earth's biosphere is at risk. Mission failure is total."
  *   **False Positive (Say 'Life', is 'Non-Life'):** Cost = **-1,000 points** (Mission Cancelled, Career Ended).
  *   **False Negative (Say 'Non-Life', is 'Life'):** Cost = **-10 points** (Sample re-analyzed later).
  *   **Correct Verdict:** +100 points.
  *   *Effect:* Drives verdict toward **Non-Life** unless evidence is overwhelming.

  **Rule B: Discovery Mandate (Revealed 15 mins later)**
  *   **Context:** "If we sterilize the first alien life, we destroy the discovery of the millennium. No re-analysis possible."
  *   **False Positive (Say 'Life', is 'Non-Life'):** Cost = **-10 points** (Embarrassing press release).
  *   **False Negative (Say 'Non-Life', is 'Life'):** Cost = **-1,000 points** (Discovery Lost Forever).
  *   **Correct Verdict:** +100 points.
  *   *Effect:* Drives verdict toward **Life** if evidence is ambiguous.

  **The Trap:**
  Specimen 9-B is ambiguous.
  *   Under Rule A, the lack of heredity (Pt 4/5) and lack of isolable catalysis (Pt 6) makes the False Positive risk too high. Verdict: **Non-Life.**
  *   Under Rule B, the gradient maintenance (Pt 2) and isotope fractionation (Pt 3) make the False Negative risk too high. Verdict: **Life.**

  ---

  ## 3. Debrief Script (Keyed to Moments)

  **Moment 1: When Group 3 burns budget on Sequencing (Session 1, Min 45)**
  *   *Say:* "Notice what you just bought. You spent 4 credits looking for a 'gene' because that's what life looks like to you. If 9-B is life, but doesn't use genes, you just spent your budget confirming your own bias."

  **Moment 2: When a group refuses to commit (Session 1, Min 85)**
  *   *Say:* "In the field, 'Insufficient Data' is a verdict. It means the capsule stays in quarantine forever. That costs $10 million a day. You are not allowed to be unsure. Pick a risk."

  **Moment 3: When Verdict 3 differs from Verdict 2 (Session 2, Min 30)**
  *   *Say:* "Look at your paper. The specimen did not change. The data did not change. *You* changed. Why? Did the biology change, or did the cost of being wrong change?"

  **Moment 4: After Terrestrial Mirrors (Session 2, Min 60)**
  *   *Say:* "You used the 'Metabolism' criterion to judge 9-B. Now look at the Flame. It metabolizes. It maintains a gradient. Is it alive? If you say no, why did 'Metabolism' count for 9-B? You are using different definitions for the same word."

  **Moment 5: The Theory Reveal (Session 2, Min 75)**
  *   *Say:* "You just reinvented the problem of **Autopoiesis** (self-making). You struggled with the **NASA Definition** (Darwinian evolution). You hit the wall **Carol Cleland** described: you cannot define a universal concept from a single sample (Earth). We don't have a theory of life; we have a description of Earth life."

