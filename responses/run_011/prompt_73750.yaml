      *   *Audit Fix:* Point 6 needs to say "No *soluble* catalysts found; activity lost on homogenization."
      *   *Contamination:* Add to Round 2. "Swab positive, Sample negative."

  7.  **Writing the Deliverables:**

      *   *Rules:* Clear, strict.
      *   *Scoring:* Simple math.
      *   *Debrief:* Scripted moments.
      *   *Failure Modes:* Specific to the bio/phil split.
