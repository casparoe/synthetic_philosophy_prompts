  9.  **Final Review against Constraints:**

      *   *No wet lab:* All data on cards.
      *   *Mixed cohort:* Roles must balance bench vs. theory. Bench students might dominate the "Assay Selection." Philosophy students might dominate the "Verdict." The Advocacy Role forces them to speak outside their comfort zone.
