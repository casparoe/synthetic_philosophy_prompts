  ## 4. Predictable Failure Modes & Fixes

  | Failure Mode | Prediction | In-Room Fix |
  | :--- | :--- | :--- |
  | **Bench Dominance** | Bio/Chem majors dismiss Phil/Physics students during Budgeting. | **Role Cards:** Only the "Metabolic Auditor" can speak to the Electrode data. Only "Mission Command" can spend credits. Enforce turn-taking. |
  | **Budget Stalling** | A group saves credits, ending with 5 unspent. | **The "Use It" Rule:** Unspent credits count as -50 points toward the final score. Forces engagement. |
  | **Contamination Rabbit Hole** | Group spends entire session debating the 16S swab result. | **Timekeeper:** Announce "Contamination is noise. Focus on the Gel." Remind them the gel itself failed PCR. |
  | **Semantic Collapse** | Phil majors argue "Life is a social construct" in Minute 4. | **Mission Mandate:** "You are not philosophers. You are the Safety Board. If you say 'Construct' and the capsule breaches, you are liable." |
  | **Verdict Drift** | Students claim they "always knew" the verdict would change. | **Collect Slips:** Collect Intuition Verdicts in Session 1. Show them the physical paper in Session 2. |

