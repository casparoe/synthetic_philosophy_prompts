answer: |-
  The Basel framework for market risk, specifically the internal models approach, constructs a specific architecture of knowledge. It demands a Value-at-Risk (VaR) figure (99% confidence, 10-day horizon), augments it with stress testing, and audits it via backtesting. To understand the epistemology of this regime, one must distinguish between the metaphysical commitments the rules *appear* to make and the operational requirements they *actually* enforce.

  ### I. The Epistemology of the Point Estimate

  The VaR requirement presupposes a **pragmatic realism**. On its surface, the rule treats the loss distribution as an *ontic* feature of the world—a stable, measurable entity that exists independently of the bank's observation. By requiring a 99% confidence level derived from one year of historical data, the regime implies **stationarity**: the statistical properties of the past year are sufficient proxies for the immediate future. It suggests that the future is a continuation of the past, merely shuffled.

  However, separating strict requirements from pragmatic suits reveals a thinner epistemology.
  *   **Strict Requirement:** The rule does not demand that the 99% figure be *true* in a metaphysical sense. It demands only that the figure be *calculable*, *consistent*, and *comparable*. The regulation requires a number that can be multiplied by a supervisory scalar (typically 3) to derive capital.
  *   **Pragmatic Suit:** The realist interpretation suits the regime well because it legitimizes the capital charge. If losses are "natural facts," then capital requirements are "scientific necessities" rather than political impositions.

  **Philosophical Underdetermination:**
  The specific rule is underdetermined by the philosophy of probability. Three rival accounts license the exact same regulatory output:
  1.  **Frequentism:** The 99% figure represents a long-run frequency. If we observed 1,000 ten-day periods, losses would exceed the VaR in 10 of them. The historical data is a sample of this infinite population.
  2.  **Bayesian Subjectivism:** The 99% figure represents the bank's degree of belief. The historical data is merely evidence used to update a prior distribution. The "truth" of the distribution is irrelevant; the coherence of the belief is what matters.
  3.  **Instrumentalism/Conventionalism:** The distribution does not exist. The VaR number is a *coordination device*. It is a standardized language allowing supervisors to compare Bank A against Bank B. The 99% threshold is a convention, like driving on the right side of the road, not a discovery of nature.

  The Basel rule is agnostic to these distinctions. It cares only that the bank produces the number and sticks to the methodology. This underdetermination allows the regime to function despite deep theoretical disagreements among quantitative analysts about the nature of financial risk.

  ### II. The Triad: Consistency or Contradiction?

  If the regime rested solely on the VaR point estimate, it would imply a world of measurable risk (Knightian *risk*). However, the inclusion of stress tests and backtesting introduces a tension that reveals the supervisors' actual epistemological stance: **critical fallibilism.**

  **Why Probability-Free Stress Tests?**
  If the VaR distribution were a true ontic feature of the world, stress tests would be redundant. Any "severe but plausible" scenario would already be accounted for within the 99% tail or the statistical properties of the model. The requirement for stress tests admits that the VaR distribution is *incomplete*.
  *   **Epistemological Function:** Stress tests acknowledge **Knightian Uncertainty**. They posit that there are future states that cannot be assigned probabilities because they lie outside the historical sample (non-stationarity).
  *   **Consistency:** This contradicts the pure realist view of VaR (which assumes the past covers the relevant future) but is consistent with a **governance view**. The regime uses VaR for *normal* times (efficiency) and stress tests for *abnormal* times (survival). It is a admission that the "measurable feature of the world" is only measurable under specific, calm conditions.

  **Why Backtesting?**
  Backtesting counts exceptions (days where loss > VaR). If the VaR were merely a convention, exceptions wouldn't matter as long as the convention was followed. By penalizing excessive exceptions, supervisors treat the VaR as an *empirical claim* that can be falsified.
  *   **The Contradiction:** Here lies the friction. The regime treats the VaR as a convention for calculation (allowing internal models) but as a factual claim for validation (backtesting).
  *   **Resolution:** The regime is not logically consistent in a philosophical sense, but it is **dialectically consistent** in a regulatory sense. It creates a system of checks and balances:
      1.  **VaR:** "We know the risk." (Claim to knowledge)
      2.  **Stress Test:** "We know we don't know the tail." (Claim to ignorance)
      3.  **Backtesting:** "Prove you know the risk." (Audit of the claim)

  This triad does not rest on a single assumption about what can be known. It rests on the assumption that *confidence must be policed*. The probability-free stress test is not a correction to the VaR number; it is a hedge against the VaR number's inevitable failure. They contradict one another ontologically (one assumes measurable probability, the other assumes unmeasurable uncertainty) but complement one another functionally (one optimizes capital, the other ensures solvency).

  ### III. Consequences of Abandoning the Single Figure

  If the requirement for a single probability-weighted figure (VaR) were abandoned, the epistemological foundation of the regime would shift from **quantified comparability** to **qualitative discretion**. The changes would cascade through reporting, supervision, and capital levels.

  **1. What Banks Report: From Numbers to Narratives**
  Without a single figure, banks would report ranges, scenario narratives, or sensitivity analyses (e.g., "if rates rise 1%, we lose $X").
  *   *Consequence:* Loss of precision. A range (e.g., $100m–$150m) allows for gaming (reporting the lower bound). A narrative allows for obfuscation. The "discipline" of forcing a complex portfolio into a single dollar figure would vanish, likely increasing model risk as internal models become less standardized.

  **2. What Supervisors Compare: From Audit to Assessment**
  Currently, supervisors compare Bank A's VaR ($50m) against Bank B's ($60m) to gauge relative risk-taking.
  *   *Consequence:* Without a single figure, comparability collapses. Supervision becomes qualitative. Regulators would need to assess the *quality* of the stress scenarios rather than the *magnitude* of the capital charge. This increases regulatory capture risk, as negotiations become subjective. It shifts power from the quantitative model (which acts as an impartial arbiter) to the relationship between the bank and the supervisor.

  **3. How Much Capital is Held: The Precautionary Premium**
  The VaR figure acts as an anchor. The multiplication factor (e.g., 3x) is a buffer around that anchor.
  *   *Consequence:* If the anchor is removed, the buffer must widen. Without a probabilistic "normal" loss estimate, supervisors would likely demand higher capital across the board to account for the increased uncertainty. Alternatively, capital would become more volatile, tied directly to political or supervisory sentiment rather than a formula. We might see a shift toward **Expected Shortfall** (which Basel III has partially moved toward), but even that requires a distribution. If *all* probability weighting were abandoned, capital would likely rise to cover "worst-case" narratives, reducing efficiency but increasing resilience.

  ### Conclusion

  The Basel market risk regime presupposes a **performative epistemology**. It does not discover the distribution of losses; it *creates* it by demanding that banks act as if such a distribution exists. The point estimate is a **fictional realist** device: it is treated as real for the purpose of calculation and audit, even though the accompanying stress tests admit it is not fully real.

  The regime insists on probability-free scenarios and exception counting not because they are consistent with the VaR ontology, but because they are necessary to contain it. The VaR provides the language of coordination; the stress test provides the safety valve for ignorance; the backtest provides the mechanism of accountability. To abandon the single figure would be to abandon the pretense that risk is measurable. While philosophically more honest, it would replace a system of quantified discipline with one of qualitative negotiation, likely resulting in higher capital costs and less transparent supervision. The regime tolerates its philosophical contradictions because they serve a higher purpose: regulatory stability in a world where the future is neither fully known nor fully unknowable.
