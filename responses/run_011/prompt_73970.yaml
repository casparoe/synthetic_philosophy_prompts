answer: |-
  The whip system presupposes that political judgment is collective property, delegated by members to leadership to ensure the party acts as a single agent rather than a coalition of independents. It treats voting not as an act of individual conscience but as fidelity to a shared programmatic mandate.

  **The Theory of Judgment**
  The practice strictly requires the "single agent" model. When a member votes against their assessment, they are not necessarily deferring to epistemic authority; they may know the leadership is wrong. Nor are they merely honoring a mandate; manifestos are too vague to cover specific legislative clauses. Instead, the system requires pooling agency: the party survives only if it votes as one. Epistemic deference and promise-keeping fit comfortably with this behavior, licensing it morally, but they are not structurally necessary. An MP can believe the leadership is ignorant and the promise outdated, yet vote with the whip to prevent government collapse. The practice is philosophically underdetermined—multiple theories justify it—but functionally singular. It demands the subordination of individual judgment to collective cohesion, treating the MP not as a trustee but as a component part. Consequently, the system does not care why you obey, only that you do.

  **The Free-Vote Carve-out**
  The carve-out appears to concede a rival theory: that certain questions demand individual conscience and cannot be delegated. However, the fact that freedom is granted from above renders this incoherent as a philosophical principle. If moral judgment were inherently non-delegable, leadership could not permit it; it would be seized. Therefore, the free vote is more plausibly a managerial device. It absorbs backbench pressure on issues where the party lacks a coherent line or electoral interest, such as fox hunting or assisted dying. By retaining the discretion to declare a vote "free," leadership confirms that the default is collective control. The combination is coherent only if viewed tactically: the rule is unity, the exception is safety-valve release. It reinforces the whip's authority rather than challenging it, proving that conscience is a privilege, not a right.

  **Weil's Charge and the Counterfactual**
  Weil's charge lands squarely. Even if voting is promise-keeping, the promise requires suppressing present judgment on current facts. The member becomes a transmission belt for past decisions, structurally unavailable to truth in the moment. However, replacing this presupposition entails severe costs. A legislature without whips or party labels becomes a marketplace of independents. Governments would lack stability, falling on minor amendments rather than general confidence. Voters would lose a coherent record to hold accountable, facing shifting coalitions rather than clear alternatives. The peaceful rotation of power relies on the party machine's ability to deliver votes and ensure transitions occur without constitutional crisis. Furthermore, legislative efficiency would vanish; every clause would require building a new majority. We would gain moral autonomy but lose governability. Weil diagnoses the spiritual cost accurately, but the whip system performs essential mechanical functions. Abolishing it solves the problem of judgment by destroying the capacity for sustained action. The trade-off is explicit: we sacrifice the purity of individual conscience for the stability of executive power.
