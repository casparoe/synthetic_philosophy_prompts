answer: |-
  There is no single canonical name for this exact composite view in the literature, though its components are well-recognized and named individually. The position is a specific, somewhat unstable hybrid of **Axiological Discontinuity**, **Epistemicism**, and a **Right/Good Split**.

  Here is the carving of the view, the names of its parts, and the coined term for the composite.

  ### 1. Zero Weight vs. Trumped Weight
  There is a established distinction between a harm that carries no weight and a harm whose weight is always trumped, though it is often blurred in casual discussion.

  *   **Trumped Weight (Lexical Inferiority):** This is the standard **Lexical View**. On this account, mild pain *does* have moral weight, but severe pain has *infinite* or **lexical priority**. If you put enough mild pain on the scale, it registers, but the severe pain needle never moves. The mild pain is a "loss" that is simply outweighed.
  *   **Zero Weight (Exclusionary Nullity):** This is your colleague's view. She holds that mild pain is **morally null** in aggregation contexts. It is not that it loses; it is that it is not admitted to the calculation.

  **What turns on the difference:**
  The difference determines whether **Aggregation** is possible in principle. If the harm has weight (even if trumped), it can theoretically combine with other moral considerations (e.g., rights, fairness) to tip a balance. If it has *nullity*, it is invisible to the calculus. In your funding panel scenario, a "trumped" view might still fund the mild pain program if there were no severe pain cases available; a "nullity" view implies the mild pain program has no *moral* claim on health funds at all, only perhaps a prudential or political one. Your colleague is on the **Nullity** side.

  ### 2. The Refusal to Trade (Good vs. Bad)
  The one-sided refusal to trade joy against agony is a recognized position known as **Value Incommensurability** or **Radical Discontinuity**.

  *   **The Position:** This claims that certain values belong to different **orders of magnitude** or **categories** such that no quantity of the lower order can equal the higher order.
  *   **Metaphysical Commitment:** This commits her to **Qualitative Heterogeneity**. If pleasure and pain are homogeneous states (e.g., a single neural firing rate that varies only in amplitude), her position is logically unsustainable. You cannot draw a non-arbitrary line on a continuous scalar. To sustain her view, she must believe that "severe agony" is a different *kind* of ontological state than "mild ache," not just a stronger version of the same state. This is a modern echo of **Qualitative Hedonism** (associated with J.S. Mill's higher/lower pleasures), but applied inversely to suffering.

  ### 3. The Sorites Objection and Response
  The objection that no principled line can be drawn through a continuum of intensities is the **Sorites Paradox** (or the Paradox of the Heap).

  *   **Her Response:** Her specific response has a name: **Epistemicism**.
  *   **The View:** Epistemicism holds that vague predicates (like "counts as pain") actually have sharp boundaries, but human beings are cognitively incapable of knowing where they are.
  *   **The Cost:** The cost she has not noticed is that this makes moral truth depend on **unknowable natural facts**. If the threshold is precise but inaccessible, it is possible that a funding decision she made yesterday was objectively wrong because the pain intensity was *one unit* above the line, even though no human could detect the difference. This divorces moral truth from human discernibility.

  ### 4. Wrongness Without Badness
  Her explanation for why causing mild pain is wrong (character/rules) despite the pain having no badness is a **Right/Good Split**.

  *   **The View:** She separates **Deontology** (the Right: rules, character, duties) from **Axiology** (the Good: value, badness, welfare).
  *   **The Patch:** She is arguing that causing mild pain is a **Violation of Duty** without being a **Reduction of Value**. This is coherent but leaves her vulnerable to the question: "What is the duty protecting if not the victim's welfare?" If the victim's welfare is unaffected (because the pain has null weight), the duty appears to be about the *agent's* purity rather than the *patient's* well-being.

  ### 5. The Coined Term: The Null-Threshold View
  Since no single term captures the specific combination of *Nullity*, *Lexical Priority*, *Epistemicism*, and the *Right/Good Split*, I propose the term **The Null-Threshold View**.

  **Definition:**
  The Null-Threshold View is the position that there exists a precise, epistemically inaccessible intensity threshold for suffering. Harms below this threshold possess **Axiological Nullity** (zero aggregatable moral weight), while harms above this threshold possess **Lexical Priority** (they cannot be outweighed by any amount of lower-order goods or lower-intensity harms). Minor wrongs involving sub-threshold harms are explained by Deontological constraints rather than Axiological badness.

  **Boundary Conditions (What does *not* count):**
  1.  **Prioritarianism:** A view that gives extra weight to the worse off but still allows small harms to aggregate does *not* count. (The Null-Threshold View requires zero weight, not just discounted weight).
  2.  **Standard Lexical Utilitarianism:** A view that says severe pain outweighs mild pain but admits mild pain *has* weight does *not* count. (The Null-Threshold View requires the mild pain to be excluded from the sum).
  3.  **Vagueness/Virtualism:** A view that says the boundary is fuzzy or depends on context does *not* count. (The Null-Threshold View requires Epistemicism: a sharp, objective line).
  4.  **Continuous Hedonism:** A view that pain is a single scalar quantity does *not* count. (The Null-Threshold View requires Qualitative Heterogeneity).

  **Summary of the Carving:**
  Your colleague is not a Utilitarian (she rejects aggregation). She is not a Standard Deontologist (she allows thresholds). She is not a Prioritarian (she rejects partial weight). She is holding a **Discontinuous Axiology** supported by **Epistemicism**. The "awkward patch" you noticed is the friction between claiming the pain *doesn't matter* (Axiology) while claiming causing it *is wrong* (Deontology). This suggests her view is ultimately **Agent-Centered** regarding small harms and **Patient-Centered** regarding large harms, with no unified theory bridging the two.
