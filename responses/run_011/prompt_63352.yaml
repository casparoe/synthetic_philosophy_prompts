prompt: |-
  ok so I'm president of my school's charity club — 12 of us, we get about $900 a year from student council plus whatever we fundraise, and we've got maybe 200 total volunteer hours across the year. Every October we spend two meetings deciding what to support and it always turns into a fight. Half the club wants the money to go to the animal shelter like ten minutes down the road because we can actually go there and see it, the other half wants to send it to one of those bednet charities because someone showed us a graph about how many more kids it helps per dollar. Last year a guy wanted to spend the whole budget on a prize for an essay contest about AI risk, and that one just died in the room. There's also a student council rule that at least a third of whatever we raise has to be spent on something in our town, which half of us think is dumb but we can't change it, and the treasurer has to approve the final recipient so it can't be some random GoFundMe.

  I've read a bit about how the effective-altruism people rank causes — importance, tractability, neglectedness — and I want to actually use it rather than just vibe. So: can you write a procedure my club could run on any single proposal in one 40 minute meeting? I need the questions in the order we'd ask them, and for each one, what counts as a good enough answer from a bunch of high schoolers who can't do research — like, tell me which of these three factors we could realistically estimate even badly, and which ones we'd basically just be inventing numbers for and should treat differently because of that. It also has to deal with the fact that the three factors aren't really independent: I've seen people say a cause is often neglected *because* it isn't important, and that tractability is mostly where people smuggle in their gut feeling and then claim the framework agreed with them. Don't let the procedure just launder whatever we already wanted.

  I want it in a form we could actually fill in — a score sheet, thresholds, tiebreakers, and a clear line for where the procedure stops and hands it to a vote because it's about what we care about instead of what's true. And be honest about which steps are judgment calls wearing a procedure costume.

  Then run it on three proposals: (1) $900 and 60 hours to the local shelter, (2) $900 to a bednet charity and zero hours, (3) no donation this year, we spend the 200 hours writing letters to state legislators about a factory farming bill. Make sure at least one of them comes out badly — I'd rather watch the procedure tell us something we don't want to hear than confirm what we already planned.

  Last thing: tell me what would change your mind about this whole setup. If there's an argument that would make you say "actually don't use importance/tractability/neglectedness, use something else," what is it, and where in the procedure you just wrote are you least sure it holds up — which step would break first if the framework is wrong?
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** President of a high school charity club (12 members, ~$900 budget + fundraising, ~200 volunteer hours/year).
      *   **Problem:** Annual decision-making process (October) turns into fights (Local Animal Shelter vs. Global Health/Bednets vs. Wildcards like AI Essay).
      *   **Constraints:**
          *   Student Council Rule: 1/3 of funds must be spent locally.
          *   Treasurer Approval: Recipient must be vetted (no random GoFundMe).
          *   Time Limit: One 40-minute meeting per proposal.
          *   Capability: High schoolers, limited research capacity (can't do deep due diligence).
          *   Framework: Wants to use Effective Altruism (EA) concepts (Importance, Tractability, Neglectedness - ITN) but acknowledges their interdependence and potential for bias laundering.
          *   Output Needs: A concrete procedure (score sheet, thresholds, tiebreakers), distinction between estimable vs. invented numbers, application to 3 specific proposals (one must fail), and a critique of the framework itself (what would change my mind/where does it break).

  2.  **Deconstruct the Framework (ITN) for High Schoolers:**
      *   *Importance:* How big is the problem? (Hard to quantify accurately without research).
      *   *Tractability:* Can we actually solve/move the needle? (Easier to judge locally, harder globally).
      *   *Neglectedness:* Is anyone else doing this? (Hard to know without research).
      *   *Constraint:* The "1/3 Local Rule" is a hard constraint, not a variable.
      *   *Bias Check:* The user explicitly worries about "laundering gut feelings." The procedure needs to force explicit justification, not just scoring.
      *   *Time:* 40 minutes is very short for a full ITN analysis of *multiple* options. The prompt asks for a procedure to run on *any single proposal*. This implies a gating process: Does this proposal pass the bar? Or a comparative process? Given the "fight" context, a comparative scoring system is usually better, but the prompt asks for a procedure on *any single proposal*. I need to adapt this so it helps choose *between* them or validates if a proposal is "good enough" to be on the ballot. Let's aim for a "Proposal Vetting & Scoring" sheet that allows comparison *after* the 40-minute deep dive, or a structured debate format. Actually, re-reading: "write a procedure my club could run on any single proposal in one 40 minute meeting." Okay, so each proposal gets a 40-minute slot. Then they are compared.
      *   *Reality Check:* High schoolers can't estimate "lives saved per dollar" accurately. They *can* estimate "hours required" and "local impact visibility." I need to downgrade the "Importance" metric to something observable and upgrade "Tractability" to include "Club Fit."

  3.  **Drafting the Procedure (The "Club Impact Protocol"):**
      *   *Goal:* Minimize bias, maximize clarity, respect constraints.
      *   *Structure:*
          1.  **Hard Constraints Check (5 mins):** If it fails, stop. (Local rule, Treasurer approval).
          2.  **The "Three Buckets" Scoring (25 mins):** Adapt ITN to be honest about uncertainty.
              *   *Scale:* Instead of 1-10 (too vague), use Low/Med/High with specific definitions.
              *   *Importance:* Rename to "Scale of Suffering/Need." Acknowledge we can't measure this well globally.
              *   *Tractability:* Rename to "Our Leverage." Can *we* actually change this?
              *   *Neglectedness:* Rename to "Crowding." Is this already covered?
          3.  **The "Bias Interrogation" (5 mins):** Explicitly ask: "Are we liking this because it's easy or because it's good?"
          4.  **Final Recommendation (5 mins):** Go/No-Go + Score.
      *   *Addressing the "Invented Numbers" issue:* I need to tell them which scores are "Soft" (gut feeling) and which are "Hard" (math/constraints).
      *   *Tiebreakers:* If scores are equal, what matters? (Member engagement, learning opportunity).

  4.  **Refining the ITN Adaptation:**
      *   *Importance:* High schoolers can't compare animal suffering vs. malaria deaths reliably. *Adjustment:* Split into "Local Urgency" (observable) and "Global Scale" (research-based). If they can't research, they must admit uncertainty.
      *   *Tractability:* This is where bias hides. *Adjustment:* Require a "Theory of Change." If we give $900, what specifically happens?
      *   *Neglectedness:* Hard to know. *Adjustment:* Focus on "Marginal Impact." Does our $900 matter more here or elsewhere?

  5.  **Developing the Score Sheet:**
      *   Needs to be fillable.
      *   Needs thresholds.
      *   Needs to distinguish between "Fact" and "Judgment."

  6.  **Running the Proposals:**
      *   *Proposal 1: Local Shelter ($900 + 60 hrs).*
          *   Constraints: Passes local rule.
          *   ITN: High Tractability (we see results), Low/Med Importance (local animals vs global humans), Low Neglectedness (shelters usually get local love).
          *   Risk: Might fail on "Scale" compared to bednets.
      *   *Proposal 2: Bednets ($900 + 0 hrs).*
          *   Constraints: Fails local rule? Wait, rule is "1/3 of whatever we raise." If total budget is $900, $300 must be local. If this proposal is *just* the bednet part, it needs to be paired with a local part. Let's assume this proposal is "Allocate the non-local portion to bednets." Or, if it's the *only* proposal, it violates the rule. I should treat it as "Allocate the maximum allowable non-local funds to bednets."
          *   ITN: High Importance, High Tractability (proven), High Neglectedness (by local standards).
          *   Risk: Zero volunteer hours might violate club mission (volunteer club?).
      *   *Proposal 3: Advocacy (200 hrs + $0).*
          *   Constraints: Spending $0 on donations might violate "charity club" rules, but let's assume it's allowed.
          *   ITN: High Importance (policy change), Low Tractability (200 hrs of HS letters is negligible), Low Neglectedness (lots of advocacy).
          *   *Goal:* Make this one fail hard on Tractability.

  7.  **Critiquing the Framework (The "Change My Mind" Section):**
      *   Where does ITN break?
      *   *Issue:* Comparison across moral frameworks (Animals vs. Humans). ITN assumes a common currency (e.g., wellbeing).
      *   *Issue:* "Neglectedness" is often a proxy for "hard to solve."
      *   *Issue:* For a *school club*, the primary good might be *education/member growth*, not just external impact. If the procedure ignores member retention, the club dies, and impact becomes zero.
      *   *Weakest Step:* The "Importance" scoring. High schoolers cannot reliably weigh animal suffering against human malaria deaths. This is the first point of failure.

  8.  **Review against Constraints:**
      *   40 minutes? Yes, the steps need to be timed.
      *   Score sheet? Yes.
      *   Honest about judgment calls? Yes.
      *   One proposal fails? Yes (Advocacy likely fails on tractability).
      *   Local rule addressed? Yes.

  9.  **Final Polish:**
      *   Tone: Pragmatic, slightly cynical but helpful, respecting the user's intelligence.
      *   Formatting: Clear headings, bullet points, bold text for emphasis.
      *   Ensure the "Bias Interrogation" step is sharp.

