  The closest near-miss from your list is **Question-Begging** (*petitio principii*).
  *   **The Resemblance:** In both cases, the justification for a claim relies on the truth of the claim itself. When you offered tree rings as evidence for the past, you were using a trace of the past to prove the past exists.
  *   **The Point of Departure:** Question-begging is a formal fallacy of *inference*; it implies you have made a mistake in reasoning that could be corrected by finding independent premises. The hinge configuration is not a failure of inference but a condition of **grammar**. Tree rings are not *premises* from which you deduce the past; they are *counts as* evidence only *because* the past exists. To demand evidence for the hinge is not to ask for a better argument; it is to ask for the rules of the game to validate themselves. The error is not circular reasoning; it is a category mistake regarding the status of the proposition.

  ### Attachment: Proposition, Practice, or Act?
  The phenomenon attaches to the **practice** (the language game or system of judgment), though it manifests in specific propositions.
  *   **Why this matters:** If it attached to the *proposition* alone, it would be dogmatism (asserting "The past exists" is simply true). If it attached to the *act* alone, it would be psychology (you just *feel* certain). By attaching to the *practice*, it explains why your friend could speak coherently while doubting: she was using the language game (which requires the hinge) to question the hinge. The certainty is shown in what we *do* (drinking tea, referring to last week), not in what we *say* we know.

  ### Revision: Impossible or Merely Unrevised?
  Revision is **possible in principle, but not via evidence**.
  Wittgenstein uses the metaphor of a river bed: the water (empirical claims) flows over the bed (hinges). The bed guides the water, but over long periods, the bed itself can shift. You can abandon a hinge (e.g., "The Earth is static"), but you do not do so by finding a fossil that proves it moves; you do so by a gradual transformation of the entire system of judgment (a paradigm shift). In your argument, revision was impossible *in that moment* because you were both standing on the bed trying to dig it up.

  ### The Mid-Argument Test
  The one test you can apply without philosophy is the **Consequence of Action Test**.
  *   **The Test:** Ask, "If you were right, what would you do differently *right now*?"
  *   **The Diagnosis:** If the doubt is ordinary (e.g., "Did we lock the door?"), the answer involves an action (check the lock). If the doubt is a hinge doubt (e.g., "Did the past exist?"), the answer is "Nothing." The doubt is **idle**. It consumes energy but produces no change in behavior. As you noted, "Her doubt did not behave like a doubt." That is the signature.

  ### The Colleague Scenario
  The configuration at work looked identical because your colleague was treating a **pragmatic hinge** (the reliability of the pipeline) as an empirical claim when it suited him, and as a hinge when it didn't. He was shifting the status of the proposition to win the point, rather than recognizing its fixed role in the analysis.

  ### Confidence and Uncertainty
  I am **highly confident** (approx. 90%) that this is the correct epistemological carving. The specific example of the Earth existing five minutes ago is explicitly discussed by Wittgenstein in *On Certainty* (§§262, 415), and the behavioral criterion ("doubt requires grounds") is central to his thesis.

  The claim I am **least sure of**, and which you should distrust if repeated, is this: *The colleague's inconsistency is logically identical to the friend's skepticism.*
  *   **Reason for Distrust:** Your friend's doubt targeted a *transcendental* hinge (conditions for the possibility of evidence). Your colleague's doubt targeted an *instrumental* assumption (trust in a specific dataset). The structure of the argument (using the system to doubt the system) is the same, but the depth differs. The colleague's hinge could likely be revised with empirical audit; your friend's cannot be revised with evidence at all. Treating them as identical risks conflating logical grammar with practical hypocrisy.

