answer: |-
  Hi there,

  This is a fantastic observation, and you have put your finger on exactly the kind of structural hypocrisy that keeps infrastructure appraisal functioning despite being philosophically messy. You are right to suspect that the apparatus is underdetermined. The practice does not require a single coherent epistemology to function; rather, it requires a set of procedural commitments that allow different stakeholders to tell themselves different stories about what is happening. To answer your core question about what the practice strictly requires versus what it merely fits well with, we need to separate the epistemic claims from the governance functions.

  Strictly speaking, the practice requires only that the signed number be a stable anchor for accountability and that the uplift be a calculable reserve for risk. It does not strictly require the signed number to be the sponsor's actual belief, nor does it require the uplift to be a true correction of cognitive bias. The system fits well with the literature on optimism bias and the outside view, certainly, but it fits equally well with a simple theory of budgetary control where the central body wants to hoard contingency funds without admitting that is what it is doing. The tension you see between the inside view and the outside view is not a bug in the system; it is a feature that allows the funding body to have it both ways. By multiplying the sponsor's estimate, the system concedes that the sponsor knows something specific about the project that a flat fee would miss, preserving the utility of the inside view. By applying the uplift, it asserts that the sponsor's specific knowledge is systematically unreliable, preserving the authority of the central reference class. This hybrid approach allows the bureaucracy to claim it is being scientifically rigorous about probability while maintaining absolute control over the purse strings.

  Regarding the status of the signed number, you are correct that it cannot be a genuine belief in the Bayesian sense. If it were a true belief, the sponsor would believe the project costs the base amount plus the uplift, since the uplift represents the known risk. Instead, the signed number functions as a performative commitment. It is a speech act that says, I am willing to stake my reputation on this baseline. The machinery needs this number to be a bargaining position rather than a truth claim. If it were a truth claim, the uplift would invalidate it immediately, rendering the signature meaningless. By treating it as a bargaining position, the system allows the sponsor to say, This is what I think it should cost if everything goes right, and allows the funder to say, We know everything will not go right. The career consequences attached to the base estimate reinforce this. They are not there to enforce epistemic accuracy; they are there to enforce effort. The system assumes that if the sponsor knows their career depends on the base number, they will work harder to mitigate risks that would otherwise trigger the uplift. This is why the location of the bias matters less than the attribution of responsibility.

  You asked whether the bias is assumed to be cognitive or structural. The practice conflates the two to maintain leverage. If the bias were purely structural, arising from adverse selection where only optimistic projects get approved, then punishing the individual sponsor would be unjust and ineffective. The sponsor cannot fix the selection effect. If the bias were purely cognitive, a training intervention would suffice rather than a financial reserve. The machinery works by treating the structural risk as if it were manageable through individual diligence. This licenses the career consequences. It tells the sponsor, The reference class says projects like this overrun, but if you are good enough, yours will not. This is philosophically incoherent but administratively vital. It keeps the sponsor engaged in risk mitigation rather than resigning themselves to the inevitable overrun. The system needs the sponsor to believe they can beat the odds, even if the funding body prices the project as if they will not.

  The asymmetry you noted regarding overruns and underruns is perhaps the clearest signal that this is a governance tool rather than an epistemic one. There is no epistemic reason to penalize a positive error more than a negative error of the same magnitude. Both represent a failure of calibration. However, there is a profound political and fiscal reason. An overrun requires finding new money, which is politically costly and operationally disruptive. An underrun simply returns money to the central pot, which is politically neutral or even positive. Therefore, the practice is committed to the view that false optimism is socially costlier than false pessimism. This is not a claim about truth; it is a claim about loss aversion at the institutional level. The system is designed to minimize the probability of asking for more funds, not to minimize the variance of the estimate. This explains why the incentives lean toward pessimism despite the stated goal of accuracy. The goal is not accuracy; the goal is budget stability.

  This brings us to your suspicion that the form is evidence for nothing because multiple epistemologies license it. I think you are right. A strict Bayesian would hate the fixed percentage uplift because it ignores project-specific evidence. A strict frequentist would hate the individual sign-off because it implies individual causality where there is only statistical regularity. A behavioral economist would love the uplift but hate the incentive padding it encourages. The fact that all these conflicting views can coexist under the same form suggests the form is agnostic. It is a boundary object that allows different departments to collaborate without agreeing on why they are doing what they are doing. The finance department sees a reserve fund; the policy department sees a bias correction; the project sponsors see a target to beat. The coherence is social, not logical.

  If you were to replace this with sponsors reporting full distributions and scoring them on calibration, you would be shifting from a control model to a learning model. This would be a more honest epistemic practice because it forces the sponsor to articulate uncertainty rather than hiding it in a single number. However, it would break the governance model. It is much harder to hold someone accountable for a distribution than for a point estimate. If a sponsor says there is a 10 percent chance of a 200 percent overrun and it happens, can you punish them? They told you it was possible. The current system relies on the fiction that the base case is the plan and everything else is a deviation. Moving to distributions admits that the base case is just one possibility among many, which undermines the contractual nature of the funding agreement. It would be more honest, but it would require a different kind of relationship between funder and sponsor, one based on shared risk rather than transferred liability.

  A prediction market over final costs would be a different idea entirely. It would assume that the relevant information is dispersed among many actors rather than held by the sponsor. This removes the sponsor's agency and treats the cost as a market outcome rather than a management target. This would solve the padding problem because the market would price in the padding, but it would also remove the sponsor's incentive to control costs. If the market says the project will cost 150 million and the sponsor believes they can do it for 100 million, the market mechanism does not necessarily reward that efficiency unless the sponsor is also a trader. Furthermore, markets are notoriously bad at pricing unique, one-off infrastructure projects where there is no liquidity. So while a market might be more epistemically robust in theory, it lacks the administrative grip that the current system provides. It substitutes price discovery for management control.

  Ultimately, the practice you are looking at is a technology of accountability, not a technology of truth. It strictly requires a number that can be signed and a reserve that can be held. It fits well with theories of bias, but it does not require them to be true. It fits well with theories of incentive compatibility, even if the incentives produce perverse behaviors like padding. The incoherence you are sensing is the friction between the desire to know the true cost and the need to manage the political consequences of not knowing it. If you were to design a system that was philosophically coherent, you would likely have to sacrifice some of the bureaucratic control that makes the current system viable. You would have to choose between knowing the truth and holding someone's feet to the fire, because as your experience shows, you cannot really do both with the same number.

  I hope this helps clarify the lay of the land. It is rare to find someone working inside the machine who is willing to look at the gears this closely, and your instinct that the form is underdetermined is spot on. It is a compromise dressed up as a calculation.

  Best of luck with the dissertation.
