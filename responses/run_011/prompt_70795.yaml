  ### Straight Talk: Judgement vs. Structure

  **Where is this procedure just "judgement wearing a lab coat"?**
  1.  **The "Ad-hoc" Smell Test:** In Case 2 and 3, the line between a "novel mechanism" and "curve fitting" is subjective. In 20 minutes, you are judging whether the author sounds like they understand the physics or like they are tuning parameters to match $-\cos(\theta)$. That is intuition, not algorithm.
  2.  **Measurement Independence:** There is no physical law demanding $\rho(\lambda|a,b) = \rho(\lambda)$. It is an assumption of statistical independence. Deciding whether a violation of this is "physics" (Case 3) or "conspiracy" (Superdeterminism) is philosophical. Your journal's scope dictates this passes; *PRL* would reject it.
  3.  **The 2015 Consensus:** Treating the 2015 experiments as "settled" (Case 2) is a pragmatic choice. Strictly speaking, no experiment is loophole-free forever. But for a desk decision, you must treat them as settled, or you will never reject anything.

  **What can this procedure structurally NOT catch?**
  1.  **Mathematical Errors in the Integral:** If they write down $\int \dots = -\cos(\theta)$ and the integral is actually wrong, you won't catch that in 20 minutes. You are triaging *claims*, not verifying *proofs*.
  2.  **The "Memory Loophole":** A subtle loophole where the detector's behavior depends on previous settings (time-drift). The 2015 tests address this, but a sophisticated paper could propose a new memory model. This looks like Case 2 but is harder to spot.
  3.  **Conceptual Coherence:** A paper can pass all four steps and still be incoherent (e.g., using undefined terms). That requires a referee.

  **Summary Recommendation:**
  *   **Case 1:** Reject. (Definition error).
  *   **Case 2:** Reject *unless* they model the coincidence window specifically. (High bar).
  *   **Case 3:** Send. (Valid logical loophole).

  If you bounce the Retrocausal one (Case 3), you are making a metaphysical judgement, not a physical one. For a foundations journal, that is a mistake. If you send the Unfair Sampling one (Case 2), ensure they are attacking the *analysis*, not just the *hardware*.
