answer: |-
  ### Pedagogical Architecture for Interpreting Seismic Hazard Probabilities

  #### 1. The Order of Ideas and Dependency Structure

  You cannot begin by defining the three interpretations. If you open with definitions, the engineers will treat them as synonyms for "how we calculated the number." To make the distinction matter, you must first establish that the **mathematical formalism is interpretation-neutral**. They know the Kolmogorov axioms; they use them to sum logic tree branches. You must demonstrate on the board that the axioms constrain the *relations* between numbers (e.g., $P(A) + P(\neg A) = 1$), but say nothing about what $P(A)$ *is* in the world. Without this gap between calculus and content, they will assume the math dictates the meaning.

  Once the neutrality of the calculus is established, you must address **calibration**. These students trust models that "work." A common defensive move will be: "Our models match historical catalogues, so the numbers are frequencies." You must show, early in Session 1, that a Bayesian model can be well-calibrated (reliability diagrams) without being frequentist. If you do not sever the link between *empirical success* and *frequency interpretation* before introducing the three views, they will collapse Belief and Propensity into Frequency as "just different ways of getting the same right answer."

  Therefore, the **three-way distinction** (Frequency, Belief, Propensity) cannot be posed until two prerequisites are on the board:
  1.  **Formal Neutrality:** The math allows multiple ontologies.
  2.  **Underdetermination by Calibration:** Past performance does not fix the meaning of future risk.

  Only then can you introduce the **Carrying Example** and ask them to map their existing workflow (logic trees, expert weights) onto these three distinct ontologies. The sequence must move from Frequency (their default assumption) to Belief (where their logic tree weights actually live) to Propensity (the physical claim they think they are making). The climax, in Session 2, is the **Mixing Problem**: showing that a single hazard curve typically claims to be a physical propensity, is calculated using degrees of belief (expert weights), and is validated as if it were a long-run frequency.

  #### 2. The Carrying Example

  **The Example:** "10% probability of exceedance in 50 years for Peak Ground Acceleration (PGA) > 0.3g at Site X."

  This is the regulatory standard (e.g., ASCE 7, USGS maps). It is the number they actually use.

  **What it must have:**
  *   **A specific time window (50 years):** This is roughly a human career, not a geological cycle. It forces the question: "Will this happen once, or is it an average?"
  *   **A specific single site:** There is only one Site X. This strains the frequency interpretation (where is the ensemble?).
  *   **Expert-weighted logic trees:** The calculation undoubtedly involves branches weighted by expert opinion (e.g., maximum magnitude $M_{max}$), which is the entry point for Degree of Belief.

  **What it must lack:**
  *   **An actual ensemble of identical sites:** There are not 100 identical Site Xs to count failures.
  *   **A known physical mechanism for "10%":** There is no physical dial on the fault set to 0.10.

  **The Rereadings:**
  *   **Frequency:** "If we had 100 identical Earths with identical Site X, 10 of them would exceed 0.3g in their first 50 years." (Strained: Where are the Earths?)
  *   **Belief:** "Given our current data and models, we are confident enough to bet at 9:1 odds that 0.3g will not be exceeded." (Fits the expert weights).
  *   **Propensity:** "The physical system of Site X *right now* possesses a causal disposition of strength 0.10 to produce this exceedance." (Fits the engineering desire for physical truth, but is metaphysically distinct from frequency).

  **Foil Example:** None needed. The carrying example is rich enough if you press the "50 years" constraint hard enough.

  #### 3. The Misconception Map

  1.  **"Hazard numbers simply *are* frequencies."**
      *   *Form:* "It's the rate of exceedance. That's what the code says."
      *   *Defuse:* Step 3 (Session 1). Ask: "Show me the ensemble of 50-year periods for this specific site."
  2.  **"The three interpretations are interchangeable vocabulary."**
      *   *Form:* "As long as the math sums to one, who cares?"
      *   *Defuse:* Step 7 (Session 2). Show that mixing them leads to double-counting uncertainty in logic trees (treating belief weights as physical variabilities).
  3.  **"Subjectivism licenses arbitrary numbers."**
      *   *Form:* "So I can just pick 50% if I feel like it?"
      *   *Defuse:* Step 5 (Session 1). Distinguish *arbitrary* from *constrained by evidence*. Belief is rational updating, not guessing.
  4.  **"Epistemic uncertainty is the same thing as a degree of belief."**
      *   *Form:* "We already handle this with the epistemic branches."
      *   *Defuse:* Step 1 (Session 2). Draw the distinction: Epistemic is the *state* (ignorance); Belief is the *quantification*. You can have epistemic uncertainty without quantifying it as probability (e.g., intervals).
  5.  **"Propensity is disreputable metaphysics."**
      *   *Form:* "That's philosophy, I'm an engineer."
      *   *Defuse:* Step 6 (Session 2). Frame it as "Physical Model Claim." If they claim the number describes the *fault*, not their *head*, they are claiming propensity.
  6.  **"Good calibration demonstrates the frequentist reading."** (Flagged as mischaracterised)
      *   *Correction:* This is not a misconception about meaning, but about *validation*.
      *   *Form:* "Our models match the catalogue, so it's frequency."
      *   *Defuse:* Step 2 (Session 1). Show that a Bayesian predictor can be calibrated. Calibration checks reliability, not ontology.

  **Missing Misconception:** **Instrumentalism.** "The number is just a tool for code compliance; truth is irrelevant."
  *   *Defuse:* Opening 15 minutes. If the number is just a tool, why do we defend it in court/insurance disputes as a "prediction"?

  #### 4. The Check for Understanding

  **Question:** "Your model gives 10% in 50 years. The 50 years pass. No exceedance. A client asks: 'Was your model wrong?' Answer them without using the word 'probability'."

  **Good Answer:** "If this number was a long-run frequency, we cannot judge it on one site; we need 100 sites. If it was a degree of belief, the model was not 'wrong,' it was a statement of confidence at the start which is now obsolete. If it was a propensity, the chance existed but did not manifest, like a loaded die rolling a non-six."

  **Mimicry Answer:** "It depends on which interpretation of probability you use, so we can't say for sure." (Labels without consequences).

  #### 5. What to Omit

  You must omit the historical/technical debates that do not change their modelling practice tomorrow.

  1.  **Von Mises's Collectives:** Too technical.
      *   *Say:* "I am omitting the technical definition of 'collectives' because you do not have an infinite ensemble of Earths."
  2.  **Dutch-Book Arguments:** Too abstract/decision-theoretic.
      *   *Say:* "I am omitting the Dutch-Book theorem because you are not bookies; you are modellers."
  3.  **Representation Theorems:** Irrelevant to interpretation.
      *   *Say:* "I am omitting representation theorems because we are discussing meaning, not derivation."
  4.  **"Which Interpretation is Correct?":** This is a metaphysical trap.
      *   *Say:* "I am not asking which interpretation is true; I am asking which one your model *claims* to be."

  #### 6. The Load-Bearing Risk

  **The Risk:** The transition to **Propensity** in Session 2.
  **Why:** Engineers view "Propensity" as "Frequency in disguise" or "Metaphysical fluff." They will resist distinguishing the physical chance of *this* rupture from the frequency of *many* ruptures. If they reject this, the "Mixing" argument fails, and they revert to "It's all just Frequency."
  **Fallback:** If they resist Propensity, reframe it as **"Model-Claimed Reality."** Ask: "Does this number describe your state of mind, or the state of the fault?" If they say "The fault," force them to admit that a single fault cannot have a frequency. It must have a propensity.

  ***

