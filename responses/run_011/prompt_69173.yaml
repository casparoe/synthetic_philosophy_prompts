      *   This forces the Senders to Pulse. Since Costs/Benefits are symmetric, both Pulse.
      *   Result: 100% Pulse. 100% Invest. 0% Info. High Waste.
      *   This satisfies the "Friend's Thesis" setup (Cost is required for transaction) but shows it generates no info.

      *   *Wait, one more check:* If R is forced to Invest on Pulse, and S knows this, S Pulses.
      *   Does this prove the Friend wrong?
      *   Friend: Waste makes it reliable.
      *   Result: Waste exists, Reliability (Info) does not.
      *   Yes. This works.

      *   *Round 2 & 3:* Let strategies be endogenous.
      *   Round 2: Cheap Cost, Benefit Asymmetry.
      *   Round 3: Expensive Cost (for one), Cost Asymmetry.

      *   *Okay, ready to write.*
answer: |-
  # Activity: The Grid Protocol

  ## 1. Setting and Mechanics

  **Time:** 90 Minutes
  **Participants:** 22 Students (11 Pairs)
  **Materials:** Whiteboard, 11 envelopes (containing Role Cards), 220 Poker Chips (20 per student), Index Cards (for decisions), Markers.
  **Social Stakes:** A "Grid Leaderboard" is drawn on the whiteboard. The top three chip accumulators at the end of class are written in permanent marker. No material prize, but public recognition is the currency.

  **Enforcing Silence (The Blackout Protocol):**
  1.  **Physical Barriers:** Pairs sit back-to-back or with a folder barrier. No eye contact.
  2.  **The Fine:** Any audible speech during a decision phase results in an immediate 5-chip fine for both parties, collected by the instructor.
  3.  **The Script:** Read this verbatim: *"You are Grid Operators. You cannot speak. You cannot signal with eyes or hands. You communicate only through the console (Index Cards). If you break protocol, the Grid penalizes both of you. This is not about truth; it is about chip maximization."*

  **The Public Tally:**
  Draw three columns on the board: **Round**, **Chips Burned (Costs)**, **Chips Transferred (Payoffs)**.
  After each round, collect the index cards. Calculate the total chips paid for "Pulses" (Burned) and total chips gained from "Investments" (Transferred). Post the numbers. The ratio of Burned/Transferred is the visual argument.

  ---

  ## 2. The Handout (One Page)

  *(Print this exactly. It contains no forbidden terms.)*

  **GRID OPERATOR PROTOCOL // ROUND [X]**

  **YOUR ROLE:** You are either **STATION** or **BANK**.
  **YOUR STATE:** (Station Only) You are **Type Alpha** or **Type Beta**. (Check your envelope).
  **GOAL:** Maximize your personal Chip Count.

  **PHASE 1: STATION DECISION**
  Choose one Action:
  *   **SILENT:** Cost = 0 Chips.
  *   **PULSE:** Cost = [X] Chips. (Deduct immediately).

  **PHASE 2: BANK DECISION**
  Observe Station's Action (Silent or Pulse).
  Choose one Action:
  *   **HOLD:** Transfer = 0 Chips.
  *   **INVEST:** Transfer = 10 Chips to Station.

  **PAYOFF TABLE (STATION)**
  *   If Bank **HOLDS**: You keep your remaining Chips.
  *   If Bank **INVESTS**: You receive +10 Chips.
  *   *Note: Type Alpha and Type Beta have different Payoff/Cost structures. See your specific slip.*

  **PAYOFF TABLE (BANK)**
  *   If you **INVEST** in **Alpha**: You gain +10 Chips.
  *   If you **INVEST** in **Beta**: You lose -10 Chips.
  *   If you **HOLD**: Payoff is 0.

  **RULES:**
  1.  No talking. 5-chip fine for noise.
  2.  Decisions are simultaneous per phase.
  3.  Record your earnings on the tally sheet.

  ---

  ## 3. Round Parameters & Incentives

  *Instructor Note: Prepare 11 envelopes per round. 5 Stations are Alpha, 6 are Beta (roughly 50/50). Banks do not know the Station's type.*

  ### Round 1: The Waste Trap (Target: Friend's Thesis)
  *Goal: High Cost, Identical for both, Pooling Outcome.*
  *   **Station Cost:** Pulse = 6 Chips (Both Alpha & Beta). Silent = 0.
  *   **Station Benefit:** Invest = 10 Chips (Both Alpha & Beta).
  *   **Bank Payoff:** Alpha = +10, Beta = -5. (Expected Value of random guess = +2.5).
  *   **Constraint:** Tell Banks: *"Bank Policy for this Round: You must HOLD on Silent. You may choose on Pulse."* (This forces the signal usage).
  *   **Incentive:**
      *   Alpha: Pulse (10-6=4) > Silent (0). **Pulses.**
      *   Beta: Pulse (10-6=4) > Silent (0). **Pulses.**
      *   Bank: Sees Pulse. Belief = 50/50. EV = +2.5. **Invests.**
  *   **Outcome:** 100% Pulse. 100% Invest. **Zero Information.**
  *   **Tally:** High Burn, High Transfer.
  *   **Second-Best Equilibrium:** Banks realize pooling and switch to "Hold on Pulse".
      *   *Steer:* If Banks stop investing, remind them their EV is positive (+2.5) even on a mix. They are leaving money on the table.

  ### Round 2: The Benefit Asymmetry (Target: Your Thesis)
  *Goal: Low Cost, Identical Cost, Separating via Benefit.*
  *   **Station Cost:** Pulse = 2 Chips (Both Alpha & Beta). Silent = 0.
  *   **Station Benefit:** Alpha = 10 Chips. Beta = 1 Chip. (Beta gains almost nothing from Invest).
  *   **Bank Payoff:** Alpha = +10, Beta = -10.
  *   **Incentive:**
      *   Alpha: Pulse (10-2=8) > Silent (0). **Pulses.**
      *   Beta: Pulse (1-2=-1) < Silent (0). **Stays Silent.**
      *   Bank: Pulse = Alpha. Silent = Beta. **Invests on Pulse.**
  *   **Outcome:** Alpha Pulses, Beta Silent. Perfect Information.
  *   **Tally:** Low Burn, High Transfer.
  *   **Second-Best Equilibrium:** Beta mimics Alpha (Irrational loss).
      *   *Steer:* Remind Beta players to check their math. "Is 1 chip worth losing 2?"

  ### Round 3: The Cost Asymmetry (Target: Comparison)
  *Goal: Different Costs, Identical Benefit, Separating via Cost.*
  *   **Station Cost:** Alpha = 2 Chips. Beta = 12 Chips. Silent = 0.
  *   **Station Benefit:** Invest = 10 Chips (Both).
  *   **Bank Payoff:** Alpha = +10, Beta = -10.
  *   **Incentive:**
      *   Alpha: Pulse (10-2=8) > Silent (0). **Pulses.**
      *   Beta: Pulse (10-12=-2) < Silent (0). **Stays Silent.**
      *   Bank: **Invests on Pulse.**
  *   **Outcome:** Separating. Medium Burn (only Alpha pays).
  *   **Tally:** Medium Burn, High Transfer.
  *   **Second-Best Equilibrium:** Alpha plays Silent to save chips, Bank doesn't Invest.
      *   *Steer:* Remind Alpha: "Silent gets you 0. Pulse gets you 8."

  ### Round 4 (Optional): Reputation
  *   **Structure:** Same pairs, same payoffs as Round 2. No re-shuffling.
  *   **Goal:** Show that repeated interaction allows "Cheap Talk" (Silent) to sustain cooperation without cost, rendering the Pulse obsolete.
  *   **Outcome:** Players often converge on "Always Invest / Always Silent" to save the 2-chip cost, sustained by threat of future punishment.

  ---

  ## 4. The Debrief (30 Minutes)

  **Step 1: The Tally Reveal**
  Point to the whiteboard.
  *   **Round 1:** "We burned the most chips here. Did the Bank learn anything? No. The ratio of Burn to Info was infinite. This refutes the claim that Waste *creates* Information."
  *   **Round 2:** "We burned the fewest chips. Did the Bank learn? Yes, perfectly. This proves Waste is not *necessary* for Information."

  **Step 2: Mapping the Theory**
  *   **Waste vs. Asymmetry:** Round 1 showed waste without asymmetry = noise. Round 2 showed asymmetry (benefit) without waste = signal.
  *   **Marginal vs. Absolute:** In Round 3, the absolute cost for Alpha was low, but the *marginal* cost for Beta was prohibitive. Reliability comes from the *difference*, not the *amount*.
  *   **Reliable vs. Informative:** A signal can be reliable (Beta *cannot* do it) but uninformative (if Alpha doesn't do it either). Round 1 was reliable (both did it) but uninformative.

  **Step 3: The Unfalsifiability Charge**
  *   **The Friend's Reply:** "Round 2 wasn't a signal; it was just a constraint."
  *   **Your Counter:** "Define signal. If a display is costly for one type and cheap for another, and it stabilizes communication, it is a signal. If you define 'signal' as 'must be wasteful for both,' you have defined biology out of existence. Round 2 is the discriminating case. If my friend were right, Round 2 should have collapsed into pooling (both silent or both pulsing) because the cost was too low to deter lying. It didn't. The benefit asymmetry did the work the cost was supposed to do."

  ---

  ## 5. Failure Modes & Fixes

  1.  **The Honesty Norm:** Students feel moral compunction against "lying" (Beta Pulsing).
      *   *Fix:* In the intro, emphasize: *"This is a simulation of resource allocation, not a moral test. A Beta Pulsing is not a lie; it is a strategic attempt to secure resources. Maximize your chips."*
  2.  **Receiver Altruism:** Banks Invest in Beta even when they know it loses chips, to "help" the Station.
      *   *Fix:* Make the Bank's loss (-10) painful relative to endowment. Remind them: *"Your score is on the leaderboard. Altruism drops your rank."*
  3.  **Arithmetic Paralysis:** Students freeze calculating payoffs under time pressure.
      *   *Fix:* Provide a "Cheat Sheet" on the back of the handout with the specific math for their type (e.g., *"If you are Beta: Pulse Cost = 12. Reward = 10. Net = -2"*).
  4.  **Collusion:** Pairs figure out the optimal social outcome and ignore the incentives.
      *   *Fix:* Randomize pairings every round. Enforce the "Blackout Protocol" fines strictly in Round 1 to set the tone.
  5.  **Round 1 Collapse:** Banks realize pooling and refuse to Invest, stopping the waste.
      *   *Fix:* If Banks stop Investing, the point is still made: The signal failed. But to ensure the *waste* happens, remind Banks: *"Your Expected Value on a random guess is positive. Holding guarantees 0. Investing guarantees positive average."*

  ---

  ## 6. Honest Limits

  *Frankly state these at the very end to prevent over-generalization.*

  1.  **Deliberation vs. Selection:** "You chose to Pulse. In nature, traits are selected. Liars didn't decide to stop; they died. You are simulating the *logic*, not the *mechanism*."
  2.  **Frozen Psychology:** "The Banks in this game had fixed payoff matrices. In reality, Receiver psychology co-evolves. If Signals get cheap, Receivers get skeptical."
  3.  **Discrete Types:** "You were Alpha or Beta. Biology is a continuum. The math holds, but the boundaries are fuzzier in nature."
  4.  **Additive Fitness:** "Chips add up. Fitness does not. A massive cost might be affordable for one type but lethal for another, not just 'less profitable'."
  5.  **The Most Dangerous Gap:** **Deliberation.** "The biggest risk is you leave thinking organisms *calculate* these costs. They do not. The 'decision' was made by natural selection over generations. Do not confuse the model's logic with the organism's intent."
