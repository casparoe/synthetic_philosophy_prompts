  *   *Better:* Don't lock strategy. Let them learn. If they learn to "Invest Always", Waste stops.
  *   *To ensure Waste for the demo:* We need the Receiver to *still* want the signal even if pooled, OR we need to run it for only 3 trials so they don't learn the pooling.
