  *   *Solution:* In Round 1, make the Receiver's payoff from "Invest on Silent" = 0, and "Invest on Pulse" = +5 (even if pooled).
      *   How? State A = +20, State B = -10. EV = +5.
      *   So Receiver *wants* to Invest even if pooled.
      *   But Sender *must* Pulse to get Invest? No, if R Invests Always, S Pulses Never.
      *   *Okay, the only way to guarantee Waste is if the Receiver refuses to Invest on Silent.*
      *   Why would they refuse? Because historically (in their minds) Silent = Bad.
