prompt: |-
  Last November I spent most of a Saturday arguing with an old friend — an economist by training and a deflationist about biology by temperament — about the handicap principle, and I came away frustrated rather than convinced either way. His charge had two parts. First, that wastefulness is the entire engine of reliable communication: a display that squanders nothing cannot, on his account, carry information, because anyone could produce it. Second, that this makes the doctrine immune to refutation, since any extravagant trait can be baptised a signal after the fact and any cheap but reliable trait explained away as something else entirely. My counter was that the engine is not waste but asymmetry — that what buys honesty is costs and benefits falling differently across types, so that one can have ruinous aggregate expenditure transmitting nothing at all, and one can have near-costless displays that are stably informative. I could not make him feel the difference between those two claims, and three hours of examples made it worse rather than better. Talking has failed; I want to try staging it.

  So: design a classroom activity that walks participants into the collapse of my friend's thesis through their own decisions, well before anyone names it.

  **Setting.** A 90-minute upper-level seminar of 22 students, roughly half biology and half philosophy. Nobody has encountered signalling theory. About six have had one term of game theory and are no better than the rest at arithmetic under time pressure. The room has a whiteboard, index cards, and a box of poker chips. No money changes hands and nothing counts toward their grade; if the chips are to matter, make them matter socially.

  **Structure.** I want a repeated sender–receiver donation game, run in three rounds with different structural parameters, players re-paired and re-typed each round. In one round the cost of displaying is identical for both types and large relative to the endowment, yet the round must end in a pooling outcome: everyone displays, nobody learns anything, and the class has collectively incinerated a great many chips. That round is aimed squarely at my friend. In a second round the display cost is identical across types and small, but the payoff from being believed differs sharply by type; here reliability must stabilise with almost no waste. In a third round the marginal cost of displaying differs by type while the benefit does not, so participants can compare the two routes to the same outward behaviour. Give me integer chip payoffs, write out the incentive inequalities that make each round produce the outcome you intend, and tell me the second-best equilibrium each round could fall into instead and how I should steer if the class lands there.

  **Mechanics I care about.** Senders choose only an intensity from a fixed menu — no speech, no gesture, no negotiation — and receivers choose only whether to transfer. Tell me how I enforce the silence, because they will talk. Include a public tally posted after each round showing chips destroyed by displaying alongside chips actually transferred, so the ratio becomes visible on the wall rather than argued about. Provide an optional fourth round, if the clock allows, in which the same pairs repeat without any change to the payoffs, so that reputation does the work that cost was doing.

  **Framing.** Choose a cover story that is not about peacocks, courtship, or job applicants, and be explicit about which type in each round corresponds to the needy signaller and which to the high-quality signaller, since those two structures run in opposite directions and a cover story that makes one type look like a free rider will corrupt the behaviour I am trying to observe. The participant handout must be one page and must never use the words signal, honest, dishonest, quality, or handicap. No lecture beforehand; the term arrives only in the debrief.

  **Debrief.** Map specific moments of each round onto the distinctions at stake: waste versus asymmetry, marginal versus absolute cost, a display being reliable versus a display being informative, and the difference between reliability that comes from cost, reliability that comes from an unforgeable constraint, and reliability that comes from receivers punishing bluffs. Then confront the unfalsifiability charge directly: state which round is the discriminating one, what result in the room would have vindicated my friend instead of me, and how I should answer the reply that a determined deflationist can always relabel the cheap-but-reliable round as a different kind of signal altogether.

  **Failure modes.** List at least five things that will predictably go wrong the first time I run this — including whatever the honesty norm imported from ordinary conversation will do to the lying incentive — and give me a fix for each.

  **Honest limits.** End with a frank account of what the activity cannot reproduce and that I must therefore supply myself: that participants deliberate where signals are supposed to be selected; that receiver psychology is frozen rather than co-evolving; that types are discrete, exogenous, and privately known; and that trading chips additively quietly assumes away the objection that fitness does not aggregate additively. Say plainly which of these gaps is most likely to mislead a student into a false generalisation.

  I am not asking for sources, a bibliography, or a reading list — I need something I can run on Tuesday.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 90-minute classroom activity to demonstrate the difference between the "Handicap Principle" (waste = honesty) and "Differential Cost/Benefit" (asymmetry = honesty) theories of signaling.
      *   **Audience:** 22 upper-level students (half biology, half philosophy), no prior signaling theory knowledge, limited game theory experience.
      *   **Constraints:** No money/grades, chips must matter socially. Whiteboard, index cards, poker chips available. One-page handout (no forbidden words: signal, honest, dishonest, quality, handicap). No lecture beforehand.
      *   **Structure:** Three rounds of a sender-receiver donation game.
          *   Round 1: High identical cost, pooling outcome (waste without info). Targets the friend's thesis.
          *   Round 2: Low identical cost, different benefits (separating via benefit asymmetry). Targets the user's thesis.
          *   Round 3: Different costs, same benefit (separating via cost asymmetry). Comparison.
          *   Optional Round 4: Reputation (repeated pairs).
      *   **Mechanics:** Sender chooses intensity, Receiver chooses transfer. Enforce silence. Public tally of waste vs. transfer.
      *   **Framing:** No peacocks/courtship/jobs. Must clarify "needy" vs. "high-quality" types carefully to avoid moral framing.
      *   **Debrief:** Map activity to theory (waste vs. asymmetry, etc.). Address unfalsifiability charge.
      *   **Failure Modes:** 5 predictable issues + fixes.
      *   **Honest Limits:** What the activity *cannot* show (deliberation vs. selection, frozen psychology, etc.).

  2.  **Deconstruct the Theory & Game Design:**

      *   *The Friend's View (Zahavi/Handicap):* Costly signals are honest *because* they are costly. If it's cheap, anyone can do it, so it means nothing.
      *   *The User's View (Maynard Smith/Graphical/Asymmetry):* Honesty comes from differential marginal costs or benefits. A signal can be cheap but honest if the *benefit* of lying is low for one type, or the *cost* is higher for one type relative to the gain.
      *   *The Game:* Sender-Receiver.
          *   Sender has a Type (A or B).
          *   Sender chooses Action (Low or High Intensity).
          *   Receiver chooses Action (Donate or Keep).
          *   Payoffs depend on Type, Sender Action, and Receiver Action.

      *   *Round 1 (The Waste Round):*
          *   Goal: Pooling on High Intensity. Everyone pays high cost, Receiver donates to everyone (or ignores signal).
          *   Friend's prediction: High cost ensures honesty.
          *   Reality: If costs are identical and high, but the benefit of being trusted is high for *both*, both will pay the cost. The signal becomes useless (pooling), but waste remains.
          *   Payoffs:
              *   Type A (Needy?): Benefit of Donation = 10. Cost of High = 8. Cost of Low = 0.
              *   Type B (Healthy?): Benefit of Donation = 10. Cost of High = 8. Cost of Low = 0.
              *   Receiver: Gain from donating to A = -5 (bad investment). Gain from donating to B = +5 (good investment).
              *   *Wait, if Receiver loses on A, they won't donate if they think it's pooled.*
              *   *Correction:* To get pooling on High, the Receiver must prefer Donating even if they think it's a mix, OR the Sender must force the issue.
              *   *Better Design for Round 1:* Make the cost high enough that it *should* deter lying if benefits differed, but here benefits are the same.
              *   *Let's try:* Both types want Donation. Both types have same Cost.
              *   Type 1 (Good): Receiver gets +5. Type 2 (Bad): Receiver gets -5.
              *   Sender Payoff: Donation = 10, No Donation = 0.
              *   Cost: Low = 0, High = 6.
              *   If Receiver donates only to High: Both types play High (10-6=4 > 0). Receiver sees High. P(High is Good) = 0.5. Expected Value = 0. If Receiver is risk-neutral, they might Keep. If they Keep, Senders play Low.
              *   *Need to force the Waste:* Make the Receiver's payoff from Donating positive *on average* even if pooled, but the Senders still waste chips.
              *   *Revised Round 1:*
                  *   Types: Red (Value 10 to R), Blue (Value 10 to R). (Both valuable).
                  *   Wait, if both are valuable, R always donates. No signal needed.
                  *   *Friend's claim:* Waste is the engine.
                  *   *Scenario:* Both types want to be treated as "High Value".
                  *   Type H (High Value): Worth 10 to R.
                  *   Type L (Low Value): Worth 2 to R.
                  *   R Donates if Expected Value > 5 (Threshold).
                  *   Sender Payoff: 10 if Donate, 0 if Keep.
                  *   Cost: High = 8, Low = 0. (Identical for both).
                  *   If R donates only to High: H plays High (10-8=2). L plays High (10-8=2). Both play High. R sees High. P(H|High) = 0.5. EV = 6. R Donates.
                  *   Result: Everyone pays 8. R Donates. Total Waste = 8 per pair. Information = 0.
                  *   This works. It shows high cost $\neq$ information.

      *   *Round 2 (The Benefit Asymmetry Round):*
          *   Goal: Separating with Low Cost.
          *   Cost: High = 2, Low = 0. (Identical).
          *   Sender Payoff:
              *   Type H: 10 if Donate, 0 if Keep.
              *   Type L: 3 if Donate, 0 if Keep. (Low benefit from being mistaken for H).
          *   Receiver: H = +10, L = -10. (Must distinguish).
          *   Incentives:
              *   Type H: Play High (10-2=8) vs Low (0). Plays High.
              *   Type L: Play High (3-2=1) vs Low (0). *Wait, 1 > 0.* L will mimic.
              *   Need L to prefer Low. Make Benefit for L = 1.
              *   Type L: Play High (1-2 = -1) vs Low (0). Plays Low.
              *   Result: H plays High, L plays Low. R donates to High. Cost paid = 2. Info = Perfect.
              *   This shows low cost + benefit asymmetry = honesty.

      *   *Round 3 (The Cost Asymmetry Round):*
          *   Goal: Separating via Cost Difference.
          *   Benefit: Both get 10 if Donate.
          *   Cost:
              *   Type H: High = 2, Low = 0.
              *   Type L: High = 8, Low = 0.
          *   Incentives:
              *   Type H: High (10-2=8) > Low (0). Plays High.
              *   Type L: High (10-8=2) > Low (0). *Wait, 2 > 0.* L will mimic.
              *   Need L to prefer Low. Make High Cost for L = 12.
              *   Type L: High (10-12=-2) < Low (0). Plays Low.
              *   Result: H plays High, L plays Low. R donates to High.
              *   This shows differential cost = honesty.

      *   *Refining the Cover Story:*
          *   Needs to avoid "quality" or "health".
          *   Idea: "Emergency Beacons".
          *   Types: "Station A" (Has cargo) vs "Station B" (Empty).
          *   Receiver: "Rescue Ship".
          *   Goal: Ship wants to pick up cargo. Stations want pickup.
          *   Type A (Cargo): Ship gains fuel. Station gains supply.
          *   Type B (Empty): Ship loses fuel. Station gains supply (freeloading).
          *   *Problem:* "Empty" sounds like "Low Quality".
          *   *Better:* "Resource State". State 1 (Surplus), State 2 (Deficit).
          *   Let's stick to abstract "Type X" and "Type Y" on cards to avoid semantic baggage, but give them a functional label for the handout.
          *   *Selected Cover:* "Relay Stations".
          *   Type 1 (Active): Can transmit data. Receiver gets points.
          *   Type 2 (Inactive): Cannot transmit. Receiver loses points.
          *   Sender wants Receiver to "Connect".
          *   *Wait, User wants to avoid "Quality".*
          *   Let's use "State Alpha" and "State Beta".
          *   Receiver payoff: Alpha = +10, Beta = -10.
          *   Sender payoff: Connection = +10 (regardless of type).
          *   This isolates the conflict of interest purely.

  3.  **Drafting the Mechanics:**

      *   **Enforcing Silence:** "The Blackout Protocol". Cards face down. No eye contact. Penalties (chip fines) for talking.
      *   **Social Stakes:** "Team Score" posted on board. Groups of 11? Or individual leaderboard? Individual leaderboard creates competition. Let's use a "Hall of Fame" for top 3 chip accumulators.
      *   **Tally:** Whiteboard columns: "Chips Burned (Cost)" vs "Chips Moved (Transfers)".
      *   **Handout:** One page. No forbidden words.
      *   **Rounds:**
          *   R1: Cost 6 (Both). Benefit 10 (Both). Receiver EV > 0 if pooled?
              *   If 50/50 split. R gets +10 (Alpha) or -10 (Beta). EV = 0.
              *   If R is indifferent, they might Connect. If they Connect, everyone burns 6.
              *   To ensure pooling: Make R payoff Alpha = +12, Beta = -8. EV = +2. R Connects even if pooled.
              *   Senders: Benefit 10. Cost 6. Net 4. If Low, No Connect (0). Both play High.
              *   Outcome: High Waste, Zero Info.
          *   R2: Cost 2 (Both). Benefit Alpha = 10, Benefit Beta = 1.
              *   Alpha: High (10-2=8) > Low (0).
              *   Beta: High (1-2=-1) < Low (0).
              *   Outcome: Low Waste, High Info.
          *   R3: Cost Alpha = 2, Cost Beta = 8. Benefit 10 (Both).
              *   Alpha: High (8) > Low (0).
              *   Beta: High (2) > Low (0). *Wait, need Beta to stop.*
              *   Make Cost Beta = 12.
              *   Beta: High (-2) < Low (0).
              *   Outcome: Medium Waste, High Info.

  4.  **Addressing Failure Modes:**

      *   1. Talking/Collusion. Fix: Strict penalty, proctoring.
      *   2. Receiver Altruism. (R connects even to Beta). Fix: Make R loss significant enough to hurt their score.
      *   3. Sender Spite. (S plays Low to hurt R). Fix: Emphasize own chip count.
      *   4. Arithmetic Errors. Fix: Keep numbers simple (integers, multiples of 5).
      *   5. "Honesty Norm". (Students feel bad lying). Fix: Frame it as "Strategy", not "Truth". Use "State" not "Type".

  5.  **Addressing Honest Limits:**

      *   Deliberation vs. Selection.
      *   Frozen Receiver Strategy (R doesn't evolve, just plays best response).
      *   Discrete Types.
      *   Additive Fitness (Chips).
      *   *Most misleading:* Deliberation. Students think "I chose to lie," evolution thinks "Liars died."

  6.  **Writing the Plan:**

      *   *Tone:* Professional, instructional, precise.
      *   *Structure:* Follow the prompt's headings.
      *   *Handout:* Draft carefully to exclude forbidden words.
      *   *Debrief:* Script the key arguments.

  7.  **Refining the Payoffs (Self-Correction):**

      *   *Round 1 Check:*
          *   Sender: Type A or B. Payoff if Connect = 10.
          *   Cost: Signal = 6, Silent = 0.
          *   Receiver: Connect A = +10, Connect B = -5. (EV = +2.5 if 50/50).
          *   If Receiver Connects on Signal:
              *   A: 10 - 6 = 4.
              *   B: 10 - 6 = 4.
              *   Both Signal.
              *   Receiver sees Signal. P(A) = 0.5. EV = 2.5. Connects.
              *   Result: Pooling. Waste = 6 per pair. Info = 0.
      *   *Round 2 Check:*
          *   Sender: Type A or B. Payoff if Connect = 10 (A), 2 (B).
          *   Cost: Signal = 2, Silent = 0.
          *   Receiver: Connect A = +10, Connect B = -10.
          *   If Receiver Connects on Signal, Keeps on Silent:
              *   A: Signal (10-2=8) > Silent (0).
              *   B: Signal (2-2=0) vs Silent (0). *Indifferent.*
              *   Need B to prefer Silent. Make Connect Payoff for B = 1.
              *   B: Signal (1-2=-1) < Silent (0).
              *   Result: Separating. Waste = 2 (only A pays). Info = 100%.
      *   *Round 3 Check:*
          *   Sender: Type A or B. Payoff if Connect = 10 (Both).
          *   Cost: Signal = 2 (A), 8 (B). Silent = 0.
          *   Receiver: Connect A = +10, Connect B = -10.
          *   If Receiver Connects on Signal:
              *   A: 10 - 2 = 8.
              *   B: 10 - 8 = 2. *Wait, 2 > 0.* B will Signal.
              *   Need Cost B > 10. Make Cost B = 12.
              *   B: 10 - 12 = -2.
              *   Result: Separating. Waste = 2 (only A pays). Info = 100%.

      *   *Wait, Round 1 needs to be clearly "Waste".*
      *   If Receiver Connects on Silent in Round 1?
      *   If Receiver Connects on Silent: Senders play Silent (Cost 0). Waste = 0.
      *   To force Waste, Receiver must *withhold* on Silent.
      *   Receiver Payoff on Silent = 0 (Keep).
      *   Receiver Payoff on Connect (Pooled) = +2.5.
      *   So Receiver *should* Connect on Silent if they know it's pooled.
      *   *Crucial Game Theory Point:* In a pooling equilibrium, the signal conveys no info. The Receiver's belief stays at prior (50/50). If EV at prior > 0, they Connect regardless of signal. If they Connect regardless, Senders play Silent (Cost 0).
      *   *To force the Waste:* The Receiver must be committed to a strategy *before* seeing the pooling, OR the EV at prior must be Negative, but EV conditional on Signal (if separating) is Positive.
      *   *Correction for Round 1:*
          *   We need the Receiver to *require* the signal to Connect, even if the signal turns out to be useless.
          *   This happens if the Receiver's strategy is "Connect ONLY if Signal".
          *   Why would R do that? Because they *expect* separation.
          *   But if the parameters make separation impossible (Costs identical, Benefits identical), they will end up pooling.
          *   So: Set parameters where R *tries* to use the signal, but Senders collapse it.
          *   Receiver: Connect if Signal (EV > 0 assumed), Keep if Silent (0).
          *   Sender: Both types prefer Connect (10) over Keep (0). Both have Cost 6.
          *   Both Signal. R Connects.
          *   R gets EV = +2.5 (Positive). So R is happy.
          *   Senders get 4. Everyone happy.
          *   *But* the signal conveyed no info. The cost was incurred for no informational gain.
          *   This proves the Friend wrong: High Cost $\neq$ Info.
          *   Okay, this works. The key is that the *class* sees the tally: High Cost, but R's success rate is just baseline (50%).

  8.  **Finalizing the Handout Language:**
      *   Forbidden: Signal, Honest, Dishonest, Quality, Handicap.
      *   Allowed: State, Action, Pulse, Connect, Keep, Chips, Payoff.
      *   Cover Story: "Grid Operators". State 1 (Stable), State 2 (Volatile).
      *   Receiver: "Grid Bank".
      *   Action: "Pulse" (Costly) or "Silent".
      *   Receiver Action: "Invest" or "Hold".

  9.  **Structuring the Debrief:**
      *   Connect Round 1 to "Waste without Info".
      *   Connect Round 2 to "Benefit Asymmetry".
      *   Connect Round 3 to "Cost Asymmetry".
      *   Address Unfalsifiability: Round 2 is the killer. If cheap works, "Handicap" is not necessary.

  10. **Review against Constraints:**
      *   90 mins? Yes (15 intro, 45 game, 30 debrief).
      *   22 students? 11 pairs.
      *   Chips matter socially? Leaderboard.
      *   One page handout? Yes.
      *   No forbidden words? Checked.
      *   Failure modes? 5 listed.
      *   Honest limits? Listed.

  11. **Final Polish:** Ensure the tone matches the user's intellectual level (philosophical/biological nuance). The user is frustrated with a friend; the activity should feel like a decisive argument.

  *(Self-Correction during drafting)*: Make sure the Receiver in Round 1 doesn't realize they are being pooled on and switch to "Connect Always". If they switch to "Connect Always", waste stops.
  *Fix:* In Round 1, tell Receivers: "You must choose a rule: Invest on Pulse, or Invest on Silent." They commit *before* the round starts. This locks in the waste.
  *Actually, simpler:* Just run it. If they figure it out, that's learning. But to guarantee the outcome for the demo: Make the Prior EV *Negative*.
