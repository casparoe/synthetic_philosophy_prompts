      *   Step 6 is where the framing breaks most visibly (TD Error = 0).

  7.  **Drafting the Response:**
      *   *Constraint Check:* Must be decisive. No "both sides." Must rate each step. Must identify crux. Must identify framing error if present.
      *   *Tone:* Analytical, authoritative.
      *   *Structure:* Step-by-step verdicts -> Overall Winner -> The Crux -> Framing Error.

