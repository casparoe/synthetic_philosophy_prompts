answer: |-
  Hi there, it is great that you are digging into the philosophical underpinnings of your work, because trade-press books on causality often smooth over the jagged edges that actually matter for practice. You are right to be suspicious of that passage, and your instincts about the agent-relative claim and the two-assassin case are spot on. I will walk through the text as you asked, keeping in mind that philosophers rarely agree on everything, so I will flag where there is genuine debate versus where the author is just misleading.

  The passage starts by saying Lewis showed that causation is just counterfactual dependence, defined as c caused e if and only if, had c not happened, e would not have happened. Most philosophers would accept this as a fair summary of David Lewis's 1973 paper, which was indeed a landmark move away from older regularity theories. However, saying that is the whole of it is where the trouble begins. Lewis himself abandoned this simple definition in 1986 because of the exact problem the passage raises later, so presenting the 1973 version as Lewis's final word is outdated. When the author claims that judging which possible world is closest is a matter of taste and never be applied in practice, a philosopher would wince. It is difficult to formalize similarity between worlds, but it is not merely taste, and people do apply it in theoretical contexts, so calling it impossible is an exaggeration meant to set up the solution that follows.

  The bit about the two assassins is where your suspicion about a straw man is correct. The passage says Lewis's account collapses whenever a backup cause is waiting in the wings, implying the first assassin didn't cause the death because the second would have done it anyway. This is known as preemption. Lewis actually addressed early versions of this in his 1973 paper by looking for a chain of counterfactual dependencies between the cause and effect, so the account did not collapse immediately. The real trouble came with late preemption, which Lewis tried to fix in his 1986 revision using a concept called quasi-dependence. So when the text says Lewis's account collapses, it is ignoring decades of philosophical work where Lewis and others tried to patch these holes. It is not wholly wrong to say preemption is a problem for counterfactual theories, but it is wrong to imply Lewis left it as an unsolved mess that only Woodward cleaned up.

  Moving to the Woodward section, the definition of an intervention as a change to the cause brought about by an ideal agent that doesn't touch the effect by any other route is technically close to Woodward's invariantist account, but the phrasing is dangerous. Woodward uses the term intervention to describe a specific theoretical relationship between variables, not necessarily a physical act by a human. This leads directly to the claim you flagged as absurd, where the author says causation is agent-relative and a universe containing no agents would contain no causal facts. This is just wrong, and it is a substantive error, not loose phrasing. Woodward explicitly argues against this view. For Woodward, causal facts exist independently of whether anyone is there to manipulate them; the intervention is a hypothetical tool we use to define what the causal structure is, not a requirement for the structure to exist. If a tree falls in a forest with no one around, Woodward would say it still caused a crash, even if no agent could intervene. The author of your book seems to be conflating the definition of causation with the conditions for knowing causation, or perhaps they are pushing a specific pragmatic view that most interventionists reject.

  This confusion bleeds into the next claim that you don't really know that X causes Y until you have actually intervened on X. This does not follow from the true parts of Woodward's theory. Woodward's account is metaphysical, meaning it describes what causation is, whereas your team's claim is epistemological, meaning it describes how we gather evidence. You can have causal knowledge from observational data if you have strong enough assumptions, such as using instrumental variables or natural experiments that mimic interventions. The hierarchy of evidence placing randomized trials at the top is a practical heuristic for minimizing bias, not a logical truth derived from interventionism. So when your team uses this to shut down observational analysis, they are using a slogan that captures a healthy skepticism but lacks philosophical precision. It is true that observational studies require stronger assumptions than experiments, but it is false that they cannot yield causal knowledge. Philosophers and statisticians alike agree that causal inference from observation is possible, provided you are transparent about the assumptions required to identify the effect.

  Finally, the remark that Pearl's do-calculus is simply Lewis's possible worlds made rigorous is a nice soundbite but contested. Judea Pearl was influenced by Lewis, and the do-operator does represent a kind of counterfactual surgery on a graph, but it is not just a rigorous version of Lewis's metaphysics. Lewis was concerned with similarity metrics between entire possible worlds, while Pearl is concerned with truncating equations in a structural causal model. They rhyme, and they are compatible, but Pearl's project is computational and graphical whereas Lewis's was purely metaphysical. Some philosophers think Pearl solves problems Lewis struggled with, while others think Pearl sidesteps the metaphysical questions entirely. So calling it simply Lewis made rigorous overlooks the distinct machinery Pearl built.

  To sum up for your team, the argument that you need an experiment to know causation is not a logical consequence of Woodward or Pearl. It is a methodological preference based on the difficulty of validating assumptions in observational data. You can tell them that while experiments are the cleanest way to establish causal claims, the philosophy of causation does not forbid knowing causes from observation. The passage you found is useful for getting the gist of the history, but it takes significant liberties with the details to make a narrative arc from Lewis to Woodward to Pearl. You are right to trust your sense that the agent-relative claim is absurd, and you are right that the preemption problem is more nuanced than the book suggests. In your work, you can defend observational analysis by acknowledging that while you aren't physically intervening, you are using statistical methods to simulate the conditions of an intervention, which is perfectly consistent with the causal revolution those books describe.
