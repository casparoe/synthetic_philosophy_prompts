  Dear friend, it is excellent that you are preparing for this discussion because epiphenomenalism is a position that often sounds plausible until you press on the specific mechanisms of how we claim to know anything about it, and since you want to corner him gently but firmly, I have mapped out the dialectical terrain so you can anticipate his defensive maneuvers before he makes them. You should start by targeting his analogy between qualia and mathematical objects, since he claims knowledge requires no causal connection, and your first question should ask him specifically what ontological status he grants to numbers since his analogy only holds if he is a Platonist who believes numbers exist independently of minds. When he inevitably confirms he treats numbers as abstract objects, your follow-up must be to ask whether he would still maintain the analogy if he were a nominalist who believes numbers are just useful fictions, because if numbers are human constructs they are caused by us, which destroys the parallel with uncaused qualia. Your second question should pivot to the privacy issue you suspected matters, so ask him why we accept non-causal knowledge in math when mathematical proofs are publicly verifiable by anyone whereas reports of pain are privately privileged to only one subject. His likely reply will be that privacy is just a feature of the medium, so your follow-up should press him on whether a private language is possible if the private states never cause the words, since Wittgenstein's argument suggests meaning requires public checkability that epiphenomenalism seems to undermine. For the third question, move to evolution and ask him directly why natural selection would retain a metabolically expensive conscious experience if it has zero causal efficacy on survival behavior. He will almost certainly say it is a spandrel or byproduct of a complex brain that does do useful work, so your fourth question must be whether calling it a byproduct is an explanatory mechanism or just a description of ignorance, pushing him to specify what physical process necessitates consciousness as a side effect rather than it being optional. Your fifth question should challenge the foundation of his physics by asking whether the causal closure of the physical is an experimental result he can lean on or merely a metaphysical preference he adopts to keep his ontology tidy. When he cites the success of physics, your follow-up should ask him how he reconciles causal closure with quantum indeterminacy, since if physical events are not strictly determined then there is room for mental causation without violating physical laws. The sixth question should address the paradox of phenomenal judgment directly by asking why our reports of consciousness are so systematically accurate if the truth of the report is never caused by the state it reports. He will likely say it is a pre-established harmony or luck, so your seventh question must be whether this luck extends to all philosophical reasoning, implying that if reasons don't cause beliefs then his own argument for epiphenomenalism is not caused by its truth but merely coincides with it. Finally, your eighth question should be about falsifiability, asking him what specific empirical evidence would count against his view since any physical data can be explained by physical causes alone. His answer will likely be that it is hard to falsify, so your follow-up should ask if a theory that is compatible with all possible observations is actually a scientific theory or just a metaphysical stance, which leaves him with the choice of admitting his view is untestable or conceding that mental causation is possible. I hope this sequence helps you guide the discussion without letting him retreat into abstract generalities, and please let me know how it goes since I would love to hear whether he manages to dodge the trap on the mathematical ontology.
