          *   Support: Undermines the idea that *all* beholders are equal.
          *   Break: If the friend is an expert, his verdict *does* tell you about the novel (that it satisfies expert criteria).

      *   *Claim 5: Epistemic Privacy.* (You can't transmit the experience).
          *   Grade: Platitude (qualia) vs. False (testimony).
          *   Support: Supports Conclusion 2 (learn nothing about the *experience*).
