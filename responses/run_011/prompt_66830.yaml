          *   *Conflict:* If $P(T)=1$ always (by 2), you cannot conditionalise on $T$ to raise $P(T)$ (it's already 1). If you raise $P(T)$, it wasn't 1 (violating 2). If you say you learn $T$ (satisfying 6), but $T$ is logical, (2) says you already had it at 1.
          *   *Severity:* High. It breaks the dynamics of mathematical belief.
      *   *Genuine Tension 2 (The "Solution" Contradiction):* (4) vs. (5).
          *   (4) says fine-grained content *dissolves* the LO problem.
          *   (5) says computational limits persist *independently* of semantic refinement.
          *   *Conflict:* (4) implies the problem is *just* semantics. (5) implies the problem is *also* (or primarily) computational/processing. If (5) is true, (4)'s claim that the problem "dissolves" is false; it merely shifts or remains.
          *   *Severity:* Medium-High. It undermines the proposed solution to the LO problem.
      *   *Genuine Tension 3 (Normative Force):* (1)/(2) vs. (9)/(10).
          *   (1) says incoherence is defective "full stop". (2) defines coherence to include logical truths.
          *   (9) says failing logical consequence is *not* appropriate to criticise.
          *   (10) says norms must be usable.
          *   *Conflict:* (1) is deontic/evaluative ("defective"). (9) says "not appropriate to criticise". One can be defective without being blameworthy, but (10) suggests if it's not usable, it's not a norm *for them*. If (1) holds "full stop", it conflicts with the pragmatism of (10) and the exemption in (9).
