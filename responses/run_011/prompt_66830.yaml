      *   *(2) Logical Truths = 1:* Coherence requires $P(T) = 1$ for logical truths $T$. (Motivation: Axiom of Probability. Rules out: uncertainty about logic).
      *   *(3) Logical Omniscience (LO) is a Problem:* Ideal rationality shouldn't imply knowing all arithmetic. (Motivation: Human limitation/Intuition. Rules out: Standard Possible Worlds Bayesianism as a complete normative theory for humans).
      *   *(4) Fine-Grained Content Solution:* LO problem is about proposition individuation (coarse worlds bad). (Motivation: Hyperintensionality. Rules out: Extensional/Intensional equivalence as sufficient for credal identity).
      *   *(5) Computational Limits:* Agents lack time/memory. Semantic refinement doesn't fix this. (Motivation: Bounded Rationality. Rules out: Purely semantic solutions to LO).
      *   *(6) Conditionalisation:* Only legitimate revision rule is Conditionalisation on knowledge. (Motivation: Dynamic Coherence. Rules out: Jeffrey Conditionalisation, Adams Conditioning, or non-inferential updates as basic).
      *   *(7) Proof as Learning:* Proving a theorem raises credence; this is rational learning. (Motivation: Mathematical practice. Rules out: Static view of logical belief).
      *   *(8) Empirical Fallibilism:* No empirical proposition gets $P=1$. (Motivation: Cartesian skepticism/Defeasibility. Rules out: Dogmatism about empirical facts).
      *   *(9) Conjunctive vs. Logical Criticism:* Criticize $P, Q, \neg(P \land Q)$; Don't criticize missing logical consequence. (Motivation: Distinction between explicit belief and implicit consequence. Rules out: Closure under consequence as a synchronic norm).
      *   *(10) Ought Implies Can (Usability):* Norms must be usable/approximable by bounded agents. (Motivation: Normative force. Rules out: Ideal standards impossible for humans to track).

  3.  **Identify Tensions (Pairwise Analysis):**

      *   *(1) & (2) vs. (3):* Standard LO problem. (1)+(2) imply LO. (3) says LO is wrong. *Tension:* Yes, but (4) and (5) are offered as solutions.
      *   *(4) vs. (5):* (4) says fine-grained content dissolves LO. (5) says computational limits persist regardless of semantics. *Tension:* (4) claims the problem dissolves; (5) claims the problem (computational aspect) remains. This looks like a direct contradiction on the *source* and *solvability* of LO.
      *   *(2) vs. (7):* (2) says $P(Theorem) = 1$ always (if logical truth). (7) says credence *rises* upon proof. If it's already 1, it can't rise. *Tension:* Genuine conflict on the dynamics of logical belief.
      *   *(6) vs. (7):* (6) says only conditionalisation on *knowledge*. (7) says proof is learning. Do we come to *know* the theorem? If so, (6) works. But if we treat logic as certain (2), conditionalising on a logical truth ($P(T)=1$) doesn't change probabilities ($P(A|T) = P(A)$). So (6)+(2) blocks (7). *Tension:* Strong.
      *   *(1) & (2) vs. (9):* (1)+(2) imply logical coherence is required. (9) says failing to see consequences isn't criticisable. *Tension:* (9) explicitly carves out an exception to the normative force of (1)+(2) regarding logical consequence.
      *   *(10) vs. (1) & (2):* (10) says norms must be usable. (1)+(2) impose LO (unless fixed). If (4) fails, (1)+(2) violate (10).
      *   *(8) vs. (2):* (2) says logical truths = 1. (8) says empirical $\neq$ 1. This is standard Bayesianism, not a tension.
      *   *(6) vs. (9):* (6) requires conditionalisation on what is *known*. (9) allows believing axioms without seeing consequences. If I know axioms, do I know consequences? If not, (6) is hard to apply to logical derivation.

  4.  **Filter and Rank Tensions:**

      *   *Apparent Tension:* (1)+(2) vs. (3). This is the standard setup, not a contradiction within the user's view, because (4) and (5) are proposed fixes.
      *   *Apparent Tension:* (8) vs. (2). Standard distinction between logical and empirical.
