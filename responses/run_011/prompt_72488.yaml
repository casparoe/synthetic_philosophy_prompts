      *   *Resources:* Access to data isn't "consumption." Cluster use is significant but was it "substantial" enough to trigger policy? If the data is licensed non-commercial, Uni claiming ownership blocks commercialization anyway.
      *   *Rule:* Training on licensed data transfers restrictions, not ownership. Compute use must be de minimis for student/fellow ownership unless core infrastructure is used.
      *   *Conclusion:* Fellow owns it, but must fix the vendor breach. Uni steps back.

  5.  **Drafting - Writing and Refining (monitoring word count):**

      *   *Opening:* To: IP Advisory Panel. From: [My Name]. Re: Disputed Output (Computational Linguistics).
      *   *Distinguishing Questions:* We must separate the vendor's contractual claim from the TTO's ownership claim. Conflating them risks the University accepting liability for a breach it did not commit while denying the Fellow rights she may properly hold.
      *   *The Nature of the Model:* Is the model a derivative work? The vendor argues weights *are* the text. This relies on a folk theory that models are compressed archives. They are not. They are functional approximations.
      *   *Human Analogy:* A researcher reads the corpus, learns style, writes a book. Uni doesn't own the book. But if the researcher photocopies chapters and sells them, that's infringement. The model is the researcher's mind, *unless* it regurgitates.
      *   *The 40 Fragments:* This is the crux. Individually trivial? Yes. Collectively negligible? Yes. But they contain scanning artifacts. This proves *memorization*, not *learning*. This is the photocopying equivalent.
