answer: |-
  **MEMORANDUM**

  **TO:** Intellectual Property Advisory Panel
  **FROM:** [Panel Member Name]
  **DATE:** October 24, 2023
  **RE:** Draft Opinion re: Computational Linguistics Model Dispute

  **Introduction: Distinguishing the Questions**

  This panel is asked to resolve two distinct questions that have been improperly bundled. The first is an external liability question: Does the trained model constitute a derivative work of the licensed corpus, thereby breaching the vendor's contract and exposing the University to claim? The second is an internal ownership question: Does the model belong to the University under our IP policy regarding "substantial use of university resources"?

  Conflating these issues creates significant risk. If the Technology Transfer Office (TTO) asserts ownership based on resource use, the University effectively steps into the Fellow's shoes regarding the vendor's license. If the model infringes the vendor's terms, the University becomes the direct infringer. We must first determine the nature of the technical output to assess liability, and only then determine ownership. My recommendation is that we treat these sequentially: first, assess the vendor's claim on its merits; second, apply our resource policy only to the extent that it does not contradict the license restrictions inherent to the data provided.

  **The Nature of the Model and the "Embodiment" Claim**

  The vendor asserts that the trained weights "embody or reproduce" the corpus. This relies on a folk theory of machine learning that equates a model with a compressed database. This is technically inaccurate. A language model does not store text; it stores statistical relationships between tokens. It learns the *structure* of the language, not the content itself. In this sense, the model is more akin to a researcher who has read the corpus and internalized the syntactic and stylistic patterns of nineteenth-century periodicals than it is to a hard drive containing scanned PDFs.

  However, we cannot rely solely on this abstraction. The vendor's technical consultant has identified forty instances where the model outputs twenty words or more verbatim, including distinctive typographical artifacts specific to the vendor's scanning process. This moves the discussion from abstract statistical learning to concrete reproduction.

  **The Human Researcher Analogy**

  The Fellow argues that using the corpus is analogous to a human researcher reading library books to write a monograph. This analogy holds regarding the general training process. A researcher who reads millions of words and produces a new synthesis does not make the library a co-author. The University provides access, but the intellectual labor and the resulting synthesis belong to the researcher.

  However, the analogy breaks at the point of the verbatim fragments. If a human researcher copied forty passages from a book, including the publisher's specific typos, and included them in a competing commercial book, that is not scholarship; it is copying. The presence of scanning artifacts is the digital equivalent of a printer's error unique to a specific edition. It proves that the model did not merely learn from the public domain content; it memorized the vendor's specific digital instantiation of that content.

  Therefore, while the model *in toto* is not a derivative work of the corpus, the specific memorized outputs represent a breach of the license prohibition on reproducing a substantial portion. The forty fragments are individually trivial and collectively negligible in proportion to the model's total capacity, but they are legally dispositive regarding the breach. They demonstrate that the "non-commercial research" restriction was violated by creating an asset capable of regurgitating licensed material for commercial gain. The vendor's strongest consideration is this fingerprinting: it proves the specific licensed copy was ingested and retained, not just the underlying public domain ideas. This carries the day regarding liability, but not regarding the ownership of the entire model.

  **University Ownership and Resource Use**

  This brings us to the TTO's claim. Our policy vests ownership in the University where an output is created with "substantial use of university resources." The TTO points to the corpus license and the departmental cluster.

  Regarding the corpus: The Fellow is correct that access to a licensed resource is not consumption. Providing a researcher with access to a database is not analogous to providing reagents or lab equipment that are consumed in the experiment. The "library book" analogy applies here. If access alone triggered ownership, the University would own every monograph written by faculty using library holdings. We should not set a precedent that converts information access into equity.

  Regarding the compute: The Fellow used a mix of departmental cluster time and personal hardware. While the cluster use is significant, it is not clearly "substantial" enough to override the Fellow's primary contribution, particularly given that much work occurred outside contracted hours. More critically, asserting University ownership creates a conflict with the vendor's license. The license prohibits commercial use. If the University claims ownership, it implies the University intends to commercialize the asset. We cannot claim ownership of an asset we are contractually barred from licensing commercially. To do so would be to assert a right we cannot exercise.

  **A Proposed Rule for Future Cases**

  To avoid recurring confusion, the Panel should adopt the following rule for machine learning outputs:

  1.  **Data Access vs. Consumption:** Access to licensed data sets does not constitute "substantial use of university resources" for the purpose of IP ownership, unless the data is uniquely created by the University and not merely licensed.
  2.  **Constraint Transfer:** Restrictions attached to licensed data (e.g., non-commercial use) travel with the output. The University will not assert ownership over outputs that are encumbered by third-party restrictions preventing commercial exploitation, unless the third party consents.
  3.  **Memorization Threshold:** Outputs that verbatim reproduce licensed data beyond a *de minimis* threshold (e.g., >20 words with unique artifacts) constitute a breach of resource policy if used commercially. The researcher must remediate such memorization before commercialization.

  **Recommendation**

  I recommend the Panel advise the General Counsel to take the following position:

  1.  **Disclaim Ownership:** The University should decline to assert ownership of the model under the IP policy. The primary intellectual contribution is the Fellow's, and the resource use (data access and mixed compute) does not meet the threshold for institutional appropriation, particularly given the encumbrances on the data.
  2.  **Condition on Support:** The University's refusal to claim ownership is conditional on the Fellow and her company indemnifying the University against the vendor's claims.
  3.  **Remediation Requirement:** The Fellow must demonstrate that the model has been retrained or filtered to eliminate the verbatim memorization of the vendor's specific scanning artifacts before the University will recognize the company as operating in good standing with respect to University resources.

  This approach respects the Fellow's labor, avoids the University inheriting a contractual breach, and establishes a clear boundary regarding data memorization for future cases. We should not protect the vendor's monopoly on public domain styles, but we must enforce the integrity of our licensing agreements regarding specific digital copies.

  **Conclusion**

  The vendor's claim that the entire model is a derivative work is overstated, but their evidence of memorization is conclusive regarding breach. The TTO's claim to ownership is legally precarious and policy-wise inadvisable given the license restrictions. We should step back from ownership, require the Fellow to clean the model, and let the parties negotiate the commercial terms.
