          *   University Policy: Ownership vests in university if "substantial use of university resources."
          *   TTO Position: Claims ownership based on corpus access + cluster use.
          *   Fellow Position: Corpus is like a library book; reading doesn't make the library an author. Compute was mixed (dept + personal).
      *   **Constraints:**
          *   Length: 1,000 to 1,300 words.
