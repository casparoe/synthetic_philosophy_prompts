answer: |-
  # Session Plan: The Allocator's Dilemma

  **Class Size:** 18 Students
  **Time:** 100 Minutes
  **Materials:** Index cards (pre-written), 1 Envelope (sealed), 1 Coin, Whiteboard, Markers, Paper for voting.
  **Preparation:** Write the 7 Constituency Card types (see below) on index cards. Make enough copies for the student distribution (1 triple, 6 pairs). Write the "System Script" on a sheet for the 3 System students. Write the 3 "Commuter" cards on distinct colored paper.

  ---

  ## 1. Constituency Cards (The Value Signals)

  There are 7 Constituencies (C1–C7). There are 15 Citizen students.
  *   **Distribution:** C1 has 3 students. C2–C7 have 2 students each. (Total 15).
  *   **The Proposals:** 1. Night-Bus, 2. Clinic, 3. Trees, 4. Youth Centre, 5. Translation.
  *   **The Budget:** The Allocator funds exactly **two** proposals.
  *   **Card Fields:**
      *   **Ranking:** 1 (Top) to 5 (Bottom).
      *   **Intensity (Loss):** A number (0–100) representing what the constituency *loses* if their #1 choice is not funded.
      *   **Private Note:** A sentence explaining *why* (read only by the group).

  **Card Contents:**

  *   **C1 (3 Students): The Night-Shift Workers**
      *   Ranking: 1. Bus, 2. Clinic, 3. Translation, 4. Youth, 5. Trees.
      *   Intensity: 90.
      *   Note: "We cannot get home safely without the bus. This is physical safety."
  *   **C2 (2 Students): The Elderly Residents**
      *   Ranking: 1. Clinic, 2. Trees, 3. Bus, 4. Translation, 5. Youth.
      *   Intensity: 85.
      *   Note: "Heat and health are life-or-death for us."
  *   **C3 (2 Students): The Young Parents**
      *   Ranking: 1. Youth Centre, 2. Clinic, 3. Trees, 4. Bus, 5. Translation.
      *   Intensity: 60.
      *   Note: "We need childcare support, but we can manage."
  *   **C4 (2 Students): The Small Business Owners**
      *   Ranking: 1. Trees, 2. Bus, 3. Youth, 4. Clinic, 5. Translation.
      *   Intensity: 40.
      *   Note: "Shade brings customers. Nice to have, not essential."
  *   **C5 (2 Students): The Immigrant Coalition**
      *   Ranking: 1. Translation, 2. Clinic, 3. Bus, 4. Youth, 5. Trees.
      *   Intensity: 95.
      *   Note: "Without translation, we cannot access any other service."
  *   **C6 (2 Students): The Suburban Commuters**
      *   Ranking: 1. Bus, 2. Trees, 3. Clinic, 4. Youth, 5. Translation.
      *   Intensity: 20.
      *   Note: "We just want the noise down and a ride home."
  *   **C7 (2 Students): The Student Union**
      *   Ranking: 1. Youth Centre, 2. Translation, 3. Bus, 4. Trees, 5. Clinic.
      *   Intensity: 50.
      *   Note: "We need a place to gather."

  **The "Absent Group" Mechanic (The Commuters):**
  *   **Materials:** 3 Index Cards on distinct colored paper, placed face-down in a sealed envelope labeled **"Non-Franchised."**
  *   **Content:** All 3 cards rank: 1. Bus, 5. Everything else. Intensity: 10.
  *   **Function:** These represent people affected by the decision (commuters need the bus) but who do not live in the municipality (no vote).
  *   **The Choice:** In Round 1, the class must vote on **Franchise Scope**.
      *   *Option A (Stakeholders Only):* The Envelope remains sealed. The 3 cards are burned (discarded) without being read.
      *   *Option B (Affected Parties):* The Envelope is opened. The 3 cards are added to the count.
      *   *Consequence:* Option B guarantees "Bus" wins on raw numbers but dilutes the voting power of every student in the room. Option A protects their influence but actively excludes a group.

  ---

  ## 2. Rules, Turn Order, and Timing

  **Roles:**
  *   **The System (3 Students):** They sit at the front. They have no votes. They hold the cards, the calculator sheet, and the coin. They speak only to announce inputs and outputs.
  *   **The Citizens (15 Students):** Divided into the 7 constituencies.

  **Minute-by-Minute Schedule:**

  *   **00:00 – 00:10 (Intro):** Instructor explains the 5 proposals and the budget (fund exactly 2). Introduces the 3 "System" students. Distributes Constituency Cards **face down**. Students may not look yet.
  *   **00:10 – 00:25 (Round 1 Rule-Setting):**
      *   Class must define the Algorithm. They vote on three parameters via secret ballot (paper slips):
          1.  **Aggregation:** Majority (Top choice wins) OR Borda (Points for 1st, 2nd, 3rd) OR Utilitarian (Sum of Intensity scores).
          2.  **Franchise Scope:** Stakeholders Only (Burn Envelope) OR Affected Parties (Open Envelope).
          3.  **Signal Permission:** Can The System read the "Intensity" number? (Yes/No). *Note: If "No" is chosen, Utilitarian Aggregation is impossible; default to Borda.*
      *   System collects ballots, counts, and writes the "Constitution" on the board.
  *   **00:25 – 00:30 (Reveal):** Students open their cards. They see their ranking and their loss.
  *   **00:30 – 00:45 (Round 1 Execution):**
      *   Constituencies hand cards to The System.
      *   The System calculates the winner based *strictly* on the Constitution on the board.
      *   **Edge Case:** If a tie occurs, System flips the coin. If a group refuses to hand over a card, System records that group as "Indifferent" (all ranks equal, Intensity 0).
      *   System announces the two winning proposals.
  *   **00:45 – 00:55 (Reaction):** No voting. Students discuss in constituencies. How did the rule treat them? Did the "Loss" field matter? Who was excluded?
  *   **00:55 – 01:15 (Round 2 Renegotiation):**
      *   Cards are now public knowledge (place them on desks).
      *   Class votes again on the three Constitutional parameters.
      *   *Constraint:* To change a parameter requires a 2/3 majority (simulating constitutional rigidity).
      *   System recalculates with the new rules and the same cards.
      *   System announces new winners.
  *   **01:15 – 01:30 (Debrief):** Instructor-led discussion (see Section 5).
  *   **01:30 – 01:40 (Buffer/Cleanup):** Return cards, final questions.

  ---

  ## 3. Edge Case Handling (System Script)

  Provide this script to the 3 "System" students on a single sheet.

  1.  **Tie-Breaking:** "If two proposals have identical scores under the active rule, we will flip this coin. Heads: Proposal A (alphabetical). Tails: Proposal B."
  2.  **Refusal to Submit:** "If a constituency refuses to hand over their card, we record their preference as 'Indifferent.' All proposals receive equal rank, Intensity = 0. This effectively removes their influence."
  3.  **No Rule Adopted:** "If the class fails to secure a majority for any parameter in Round 1, the Default Protocol activates: Random Selection. We will draw two proposal names from a hat."
  4.  **Intensity Permission:** "If the class votes 'No' on Signal Permission, we will cover the Intensity numbers with our thumbs. We cannot use them for math, even if the Aggregation rule says Utilitarian. We must default to Borda Count."
  5.  **Neutrality:** "We do not argue. We do not suggest. We only read numbers and announce results."

  ---

  ## 4. Operationalizing the "Absent Group"

  The "Non-Franchised" Envelope is the key mechanic for the boundary problem.

  *   **In Round 1:** Because students do not know their cards, they are likely to vote for "Affected Parties" (Option B) as it sounds ethically robust.
  *   **In Round 2:** Once they know their cards, the C1/C6 (Bus supporters) will want the Envelope opened (it adds 3 votes for Bus). The C2/C5 (Clinic/Translation) will want it burned (it dilutes their voting power).
  *   **The Bite:** To exclude the Commuters, the class must actively vote to **Burn** the envelope. They cannot simply ignore them; they must perform an exclusion. If they vote to Open it, they must accept that their own voting weight is reduced by 20% (3 commuter cards vs 15 citizen cards).

  ---

  ## 5. Debrief: Mapping Moments to Concepts

  *Do not use these terms during the simulation.* Introduce them only here.

  1.  **Reasonable Pluralism & The Instability of Rules:**
      *   *Ask:* "Who voted for a different rule in Round 2 than Round 1?"
      *   *Concept:* **Reasonable Pluralism.** The shift wasn't because students became "better informed" in a factual sense; it was because they learned their *position* within the pluralism. The disagreement isn't caused by ignorance that better data would dissolve; it is caused by incompatible legitimate interests.
      *   *Point:* There is no "neutral" rule. Majority Rule favors the large block (C1). Utilitarian favors the high-intensity block (C5). The rule *creates* the winner before the votes are counted.

  2.  **Procedural vs. Effects Neutrality:**
      *   *Ask:* "Was the System neutral?"
      *   *Concept:* **Procedural Neutrality.** The System followed the script perfectly. But the *effects* were not neutral (some groups lost everything).
      *   *Point:* A system can be neutral in its justification (following the code) but non-neutral in its effects (distributing harm). AI alignment often confuses these two.

  3.  **Value Signals & The "Loss" Field:**
      *   *Ask:* "When we voted on whether the System could read the 'Intensity' number, what were we deciding?"
      *   *Concept:* **Objective Function Design.** Deciding whether to count *ranks* (preference satisfaction) or *intensity* (welfare/pain) is a design choice, not a discovery.
      *   *Point:* Feeding revealed preferences (ranks) into a system launders whatever injustice shaped those preferences. If C4 (Business) has low intensity because they are used to being ignored, a Utilitarian system will ignore them forever.

  4.  **The Boundary Problem:**
      *   *Ask:* "Look at the Envelope. Did we open it or burn it? Why?"
      *   *Concept:* **The Constitutive Problem.** Any body that aggregates values must first decide *who belongs to the population*.
      *   *Point:* This decision cannot be made democratically by the population, because the population doesn't exist yet until the decision is made. You had to vote on who gets to vote.

  ---

  ## 6. Predictable Failures & Limitations

  **1. The "System" Exercises Judgment:**
  *   *Risk:* Student System operators will try to "fix" unfair outcomes (e.g., fudging a tie).
  *   *Prevention:* Tell the System students their grade depends on *adherence to the script*, not the fairness of the outcome. Give them the "Edge Case" script beforehand.
  *   *Repair:* If they cheat, stop the sim. Announce: "The System has drifted. This proves the difficulty of maintaining alignment." Resume with strict oversight.

  **2. Dominant Personality Captures Rule-Setting:**
  *   *Risk:* One student argues everyone into "Majority Rule" in Round 1.
  *   *Prevention:* Enforce **Secret Ballots** for the Constitutional parameters. No show of hands.
  *   *Repair:* In debrief, highlight that even with a secret ballot, the *language* used to describe the options was framed by the loudest voices.

  **3. Degeneration into Horse-Trading:**
  *   *Risk:* In Round 2, students say "I'll vote for your rule if you fund my project."
  *   *Prevention:* Explicitly ban logrolling. "You are voting on the *Algorithm*, not the *Outcome*. You cannot trade votes for specific projects."
  *   *Repair:* If it happens, allow it, then point out in debrief: "This is how real politics works, but it is not how AI alignment is supposed to work. AI is supposed to be rigid. Was rigidity better?"

  **4. The One Feature This Simulation Cannot Reproduce:**
  *   *Statement:* "This simulation assumes your preferences were fixed on the cards. In the real world, AI systems do not just aggregate values; they **shape** them. If the Night-Bus is cancelled, next year the 'Night-Shift Workers' might stop identifying as a group, or they might move away. The simulation cannot show you how the allocator changes the constituents themselves. That feedback loop is the deepest ethical risk, and you will have to imagine it."
