  I'm a fourth-year grad student co-writing a book chapter with my advisor on dispositions — finks, masks, that whole mess — but she's off at a workshop in Lisbon until the 20th, the draft is due to the editor before she gets back, and there's one case in the penultimate section written in her voice that I cant get a ruling on. So I have to guess. Here's her track record, all of these firm verdicts she's already committed to in the earlier sections, no hedging:

  - ordinary glass dropped on tile, shatters: fragile, yes.
  - the wire with the electrofink — perfectly conductive copper hooked to a monitor that would kill its conductivity the instant current started to flow: still disposed to conduct. Her gloss is roughly that what the wire is like now is one question and whether it survives being tested is another.
  - sorcerer variant: a genuinely fragile glass, but a sorcerer has sworn to turn its molecular bonds to rubber the moment it's dropped: still fragile.
  - glass permanently sealed in a molded foam shell so it never breaks when dropped: still fragile — and she's explicit that this is a different species of failure from the sorcerer, because nothing about the glass changes, the breaking just gets blocked on the way out.
  - her own twist on the wire: a conductor whose lattice is self-annihilating, so that if current flows its own structure flips to insulating, with no external device anywhere in the story: still disposed to conduct. There's a footnote where she says the intrinsic/extrinsic difference doesn't rescue the analysis, it just relocates the problem.
  - reverse case: a rod that isn't conductive at all, but which a guardian device would instantly make conductive whenever it was connected to a circuit: NOT disposed to conduct. Her gloss: the rod isn't the thing doing the conducting.
  - same shape, different property: a soft rubbery vase that a sorcerer guarantees will shatter every time it's dropped: NOT fragile, same gloss.

  The case I have to rule on for her is this. There's a conifer, call it the bankseed, whose cones hang sealed for years in a resin that is chemically inert to fire — you can hold one in a campfire and it just chars and smokes. But the cone's own tissue also carries an enzyme that hydrolyzes that resin above roughly 400 degrees, and the moment it does, the resin turns to turpentine and goes up explosively. In the wild that threshold is only ever crossed in crown fires; in every fire a person actually runs into — campfire, house fire, most wildfires — the cone never gets hot enough and just chars. So: is a bankseed cone disposed to burst into flame when exposed to fire?

  Tell me what you think she'd say. I want the candidate rules that are compatible with all seven verdicts simultaneously, what each of them delivers on the bankseed cone, and your best guess about which rule she's actually running, with the reasons for preferring it over the others. Also tell me which of the seven earlier verdicts is doing the most work — i.e. which one kills off the most rival rules — and whether the bankseed is even the sharpest case to be asking about, or whether some other case would separate her rule from the alternatives more cleanly, since I'd happily swap it out. And if you think she'd split the question into "disposed to burst into flame" versus "disposed to char," flag that too, because I suspect she would and I don't know which way she'd jump.
