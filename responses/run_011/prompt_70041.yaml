answer: |-
  ### Desiderata for Threshold-Lexical Negative Utilitarianism

  **1. Temporal Aggregation Constraint**
  *   **Motivation:** (Prompt 1: Peak versus Integral). If the threshold $\tau$ applies to instantaneous intensity, a millisecond of extreme agony lexically outweighs a century of moderate misery. If it applies to the time-integral, a long duration of moderate misery might cross $\tau$ while a short burst of extreme agony does not. The definition states "intensity exceeds $\tau$," suggesting peak, but moral significance usually tracks duration.
  *   **Requirement:** The theory must explicitly specify whether $\tau$ is a threshold of instantaneous intensity or time-integrated suffering volume.
  *   **Status:** **Non-negotiable.** Without this, the lexical clause is undefined and cannot generate verdicts.

  **2. Intra-Lexical Ordering**
  *   **Motivation:** (Prompt 2: Comparisons above the threshold). Clause (b) prevents trading above-threshold suffering for below-threshold goods. However, agents must often choose between two options both containing above-threshold suffering (e.g., saving Victim A from torture vs. Victim B from torture).
  *   **Requirement:** The theory must provide a cardinal or ordinal metric for ranking states *within* the above-threshold domain that does not implicitly allow aggregation with the below-threshold domain.
  *   **Status:** **Non-negotiable.** Without this, the theory is action-guiding only in trivial cases where only one option contains severe suffering.

  **3. Boundary Determinacy**
  *   **Motivation:** (Prompt 3: Vagueness). Phenomenological intensity does not present as discrete steps. If $\tau$ is sharp, there must be a fact of the matter about whether a specific experience crosses it. If $\tau$ is vague, the lexical priority itself becomes vague, potentially paralyzing decision-making in borderline cases.
  *   **Requirement:** The theory must specify whether $\tau$ is metaphysically sharp (epistemicism) or inherently vague (supervaluationism/degreed lexicality), and provide a decision rule for borderline cases.
  *   **Status:** **Non-negotiable.** Indeterminacy in the lexical trigger renders the lexical priority operationally null.

  **4. Empirical Tractability**
  *   **Motivation:** (Prompt 4: Locating $\tau$). A threshold that cannot be identified in non-reporting subjects (infants, animals, unconscious patients) renders the theory useless for most practical ethics, where suffering is most severe and voiceless.
  *   **Requirement:** There must be a principled, observable correlate for $\tau$ that applies across species and cognitive capacities, not reliant on first-person report alone.
  *   **Status:** **Non-negotiable.** An ethical theory that cannot assess the moral status of non-verbal suffering fails the impartiality constraint (d).

  **5. Asymmetry Stability**
  *   **Motivation:** (Prompt 5: Commensurability). Clause (a) posits a single scale, yet (b) asserts an asymmetry where pleasure cannot cancel severe pain. If they share a scale, cancellation should be mathematically possible.
  *   **Requirement:** The theory must explain the mechanism that prevents positive values from negating above-threshold negative values despite sharing a signed scale (e.g., a discontinuity in the value function at $\tau$).
  *   **Status:** **Non-negotiable.** Without this, (b) collapses into standard weighted utilitarianism.

  **6. Non-Vacuity Constraint**
  *   **Motivation:** (Prompt 6: Emptiness and collapse). If $\tau$ is set at the maximum possible pain, the lexical clause never triggers (collapse to hedonic utilitarianism). If set at the minimum detectable pain, all pain is lexical (collapse to strict negative utilitarianism).
  *   **Requirement:** $\tau$ must be positioned such that some possible human/animal experiences fall below it and some fall above it, and this positioning must be justified by internal theoretical principles, not external fiat.
  *   **Status:** **Non-negotiable.** If the position of $\tau$ is arbitrary, the theory lacks normative force.

  **7. Existence Security**
  *   **Motivation:** (Prompt 7: The extinction inference). Strict negative utilitarianism implies eliminating all sentient life to prevent future suffering. A threshold view is often adopted specifically to avoid this.
  *   **Requirement:** The theory must demonstrate that a life containing some above-threshold suffering can still be net preferable to non-existence, or explicitly accept the extinction inference.
  *   **Status:** **Negotiable.** (Strict NU proponents would reject this, but for this specific program aiming to moderate NU, it is treated as Non-negotiable for inclusion).

  **8. Sub-Threshold Aggregation Limit (Original Addition)**
  *   **Motivation:** If sub-threshold pains aggregate additively (clause c), a sufficient quantity of them might intuitively outweigh a single lexical pain, violating the spirit of (b). Conversely, if they never aggregate to lexical status, the view implies a billion mild headaches matter less than one second of extreme torture.
  *   **Requirement:** The theory must specify whether sub-threshold units can aggregate to trigger lexical status (transformative aggregation) or if they remain permanently lexically inferior regardless of quantity.
  *   **Status:** **Non-negotiable.** This determines whether the view is truly lexical or merely weighted.

  **9. Probabilistic Coherence (Original Addition)**
  *   **Motivation:** Real-world actions involve risk. Does a 1% chance of causing above-threshold suffering outweigh a 100% chance of causing massive sub-threshold suffering? Expected utility calculations often wash out lexical priorities.
  *   **Requirement:** The theory must define how lexical priority applies to probabilistic outcomes (e.g., does the lexical status apply to expected value or only certain outcomes?).
  *   **Status:** **Non-negotiable.** A theory that cannot handle risk is practically inert.

  **10. Phenomenological Continuity (Original Addition)**
  *   **Motivation:** Clause (a) implies intensity is a scalar magnitude. Phenomenological evidence suggests pain intensity varies continuously, not in discrete jumps.
  *   **Requirement:** The theory must be compatible with the continuous nature of hedonic experience; it cannot posit that pain intensity itself jumps discretely to accommodate $\tau$.
  *   **Status:** **Non-negotiable.** Denying continuity contradicts the best empirical models of sensation underlying clause (a).

  ***

  ### Joint Unsatisfiability Claim

  I contend that the following three desiderata are jointly unsatisfiable: **Sharp Lexical Boundary** (from Desideratum 3), **Empirical Tractability** (Desideratum 4), and **Phenomenological Continuity** (Desideratum 10).

  **Argument:** If phenomenological intensity is continuous (10), there is no natural "joint" in experience where a sharp threshold (3) could reside without arbitrariness. Any sharp line drawn on a continuous scale is metaphysically distinct from the phenomenon it measures. If the line is arbitrary, it lacks a principled observable correlate, violating Empirical Tractability (4). If one insists the line is sharp and tractable, one must deny Phenomenological Continuity (positing discrete jumps in pain), which contradicts empirical psychology. If one admits the line is vague to match continuity, one abandons the Sharp Lexical Boundary required for strict lexical priority, collapsing the view into a weighted priority system. Thus, you can have a continuous scale with a tractable threshold (but no sharp lexicality), or a sharp lexical threshold with continuity (but no tractability), or sharp lexicality with tractability (but no continuity). You cannot have all three.

  ***

  ### Most Exclusionary Requirement

  The single requirement that does the most to exclude candidate views is **Boundary Determinacy** (specifically the demand for a Sharp Lexical Boundary). Most attempts to formalize lexical views either retreat to "very strong weights" to avoid the sharpness problem or admit epistemic vagueness that undermines action-guidance. Demanding a sharp, non-arbitrary line in a continuous phenomenological space filters out almost all coherent formulations of lexical utility.

  **Escape Routes:**
  Weakening the lexical clause to a very strong weight abandons **Boundary Determinacy**, accepting that trade-offs are possible in principle, which dissolves the lexical family entirely. Denying (a) by positing two incommensurable scales abandons **Asymmetry Stability** and the single-scale definition, moving the view to a pluralist deontology rather than a utilitarian threshold view. Relativizing $\tau$ to the subject abandons **Impartiality** (d) and severely compromises **Empirical Tractability**, as there is no longer a universal standard for severe suffering. Adopting epistemicism (the line is sharp but unknowable) abandons **Empirical Tractability**, rendering the theory unable to guide action in precisely the cases where it is most needed. Denying **Phenomenological Continuity** saves the sharpness but requires a revision of the science of sensation that is currently unsupported, effectively abandoning the empirical grounding of clause (a).

  ***

  ### Confidence and Uncertainty

  **Overall Confidence:** High (0.85). The structural tensions between lexicality, continuity, and measurement are well-established in formal axiology. The impossibility claim rests on standard assumptions about continuous functions and sharp boundaries that are mathematically robust.

  **Least Certain Point:** **Existence Security** (Desideratum 7). I am least sure that this is a valid requirement for the *theory* rather than a preference of the *theorist*. A competent philosopher might argue that if a life contains inevitable above-threshold suffering, the theory *should* entail that non-existence is preferable, and that blocking this inference is a distortion of the negative utilitarian commitment. If the goal is truth-tracking rather than palatability, demanding that the theory avoid the extinction inference may be a prejudice (as marked) rather than a structural necessity. This is the point most likely to be challenged as manufacturing a requirement to save the theory from its own logical conclusions.
