answer: |-
  **INCIDENT TRIAGE AND INTERVENTION PROTOCOL (ITIP)**
  **For Use by Pastoral Leads and Senior Staff**
  **Time Allocation: 20 Minutes Maximum**

  **Purpose:** To determine the appropriate response to a behavioural incident by distinguishing between a lack of *capacity*, a lack of *motivation*, or a lack of *knowledge*. This form forces a decision on whether to prioritise **Development** (drawing out existing understanding) or **Construction** (imposing external structure).

  **Instructions:** Complete sequentially. Do not skip steps. If a **JUDGEMENT ALERT** appears, pause for ten seconds and acknowledge you are interpreting behaviour, not recording a video transcript.

  ---

  ### SECTION 1: THE FACTUAL BASELINE
  *Complete using evidence only (witness statements, CCTV, logs).*

  1.  **What specific rule or norm was breached?**
      *   [ ] Safety of self/others
      *   [ ] Disruption to learning
      *   [ ] Disrespect to authority
      *   [ ] Damage to property

  2.  **Has this pupil demonstrated knowledge of this rule previously?**
      *   [ ] Yes (Sanctioned/taught before)
      *   [ ] No (First occurrence/New context)
      *   [ ] Unclear

  ---

  ### SECTION 2: CAPACITY AND RESPONSE
  *Complete based on the immediate aftermath and conversation.*

  3.  **Did the pupil display recognition of the impact on the victim?**
      *   [ ] Yes (Verbal apology, body language, distress)
      *   [ ] No (Indifference, amusement, denial)
      *   [ ] Mixed (Acknowledges rule, ignores person)

      > **JUDGEMENT ALERT:** You are defining "recognition". A pupil saying "sorry" to end the conversation counts as *No*. A pupil staying silent but looking down may count as *Yes*. Do not record what they said; record what you believe they felt.

  4.  **Is the pupil currently capable of regulating their emotions without adult intervention?**
      *   [ ] Yes (Calm, articulate)
      *   [ ] No (Escalating, shut down, aggressive)
      *   [ ] Variable

      > **JUDGEMENT ALERT:** "Capable" is not a medical diagnosis here. You are deciding if their current state allows for reasoning. If you answer *No*, you are deciding they are temporarily unfit for moral negotiation.

  ---

  ### SECTION 3: HISTORY AND PATTERN
  *Check SIMS/CPOMS.*

  5.  **Is this behaviour isolated or part of a recurring profile?**
      *   [ ] Isolated (Out of character)
      *   [ ] Recurring (Same type of incident)
      *   [ ] Escalating (Increasing severity)

  6.  **Does the pupil show pro-social behaviour in *other* contexts?**
      *   [ ] Yes (e.g., kind to peers, helps staff, cares for siblings)
      *   [ ] No (Consistently self-regarding across all settings)
      *   [ ] Selective (Only within a specific group/tribe)

      > **JUDGEMENT ALERT:** You are deciding if the "seed" exists. If they are kind to friends but cruel to strangers, you must decide if that kindness is a foundation to build on, or a tribal instinct to be broken. There is no factual answer.

  ---

  ### SECTION 4: INTERVENTION PATHWAY
  *Based on answers above, select **ONE** primary pathway.*

  **PATHWAY A: DEVELOPMENT (NOURISH)**
  *Select if: Q3=Yes/Mixed AND Q6=Yes.*
  *Premise: The pupil knows better but failed to access it. The feeling exists but needs widening.*
  *   **Action:** Restorative conversation focusing on victim impact.
  *   **Action:** Ask pupil to propose how to repair harm.
  *   **Action:** Praise specific instances where they *did* show control recently.
  *   **Goal:** Generalise the empathy they already showed elsewhere to this situation.

  **PATHWAY B: CONSTRUCTION (SCAFFOLD)**
  *Select if: Q3=No AND Q6=No (or Selective/Tribal).*
  *Premise: The pupil does not prioritise the norm. Internal motivation is absent or misaligned. External structure must hold the behaviour until it becomes habit.*
  *   **Action:** Fixed sanction applied consistently regardless of emotional display.
  *   **Action:** Scripted rehearsal of correct behaviour (practice the routine).
  *   **Action:** Removal of autonomy (increased monitoring/restriction).
  *   **Goal:** Build the habit from the outside in. Do not wait for remorse.

  **PATHWAY C: REFERRAL (THE HUMAN BEING)**
  *Select if: Q3=No AND Q5=Escalating AND Q6=No.*
  *Premise: The incident is no longer about what the pupil is like, but what we are willing to tolerate. The gap between the pupil's nature and our requirements is too wide for this form.*
  *   **Action:** Stop filling this form.
  *   **Action:** Refer to Assistant Head (Pastoral).
  *   **Reason:** This case requires a decision on whether the school can accommodate this profile, or if the cost of "Construction" is too high for the child, or the cost of "Development" is too high for the community. This is a strategic decision, not a tactical one.

  ---

  ### CASE RUNS

  #### Case 1: The Fifteen-Year-Old (Serious Assault, No Remorse)
  *   **Q1:** Safety of others.
  *   **Q2:** Yes (Known rule).
  *   **Q3:** No (Indifference to victim).
  *   **Q4:** No (Aggressive/Defensive).
  *   **Q5:** Escalating.
  *   **Q6:** No (Consistently self-regarding across settings).
  *   **Judgement Alert Check:** Staff must acknowledge that labelling this "No remorse" assumes the pupil *should* feel it naturally. We are judging their humanity, not just their action.
  *   **Pathway Selected:** **PATHWAY C (REFERRAL).**
  *   **Reasoning:** While Pathway B (Construction) is tempting due to the severity, the combination of *Escalating* history and *No* pro-social indicators suggests the "raw material" for immediate repair is absent. However, imposing strict sanctions (Pathway B) on a child with no internal capacity may simply increase exclusion risk. This exceeds a tactical decision. It requires a senior leader to decide if we continue to build structure (risking breakdown) or attempt therapeutic intervention (risking safety). The form cannot solve the tension between community safety and the child's deprivation.

  #### Case 2: The Tribal Loyalist (Fierce for Friends, Brutal to Outsiders)
  *   **Q1:** Safety/Disrespect.
  *   **Q2:** Yes.
  *   **Q3:** Mixed (Acknowledges loyalty, ignores outsider pain).
  *   **Q4:** Yes (Calm when challenged on loyalty).
  *   **Q5:** Recurring.
  *   **Q6:** Selective (High pro-social within group).
  *   **Judgement Alert Check:** Staff must acknowledge that viewing their loyalty as a "foundation" (Pathway A) rather than "gang mentality" (Pathway B) is a philosophical choice.
  *   **Pathway Selected:** **PATHWAY A (DEVELOPMENT) with B elements.**
  *   **Reasoning:** The procedure identifies existing capacity (loyalty/care). The task is extension.
  *   **Intervention:** Do not punish the loyalty; use it. "You protected your friend because you know what it feels like to be threatened. This pupil felt that threat today."
  *   **Constraint:** Apply Pathway B (Sanction) for the act, but Pathway A (Conversation) for the resolution. We accept the impulse is good but the scope is too narrow. We are trying to stretch the circle, not cut it out.

  #### Case 3: The Limited Profile (Genuine Cognitive/Emotional Limit)
  *   **Q1:** Disruption/Safety.
  *   **Q2:** Yes (Taught repeatedly).
  *   **Q3:** No (Cannot articulate impact).
  *   **Q4:** No (Lacks regulation).
  *   **Q5:** Recurring.
  *   **Q6:** No (Profile limits responsiveness).
  *   **Judgement Alert Check:** Staff must acknowledge that answering "No" here feels like giving up on the child's moral agency. It feels cold.
  *   **Pathway Selected:** **PATHWAY B (CONSTRUCTION).**
  *   **Reasoning:** The procedure dictates that if there is nothing to nourish, you must build. To wait for internal remorse that may never come is to neglect the safety of the class and the education of the pupil.
  *   **Intervention:** High-frequency scripting. "When X happens, you do Y." Sanctions applied automatically, not emotionally. No restorative meeting required until compliance is achieved for 4 weeks.
  *   **Verdict:** This prescribes a regime of external control that staff following the "Nourish" account will find distasteful. It treats the pupil as a system to be managed rather than a soul to be awakened. However, the procedure dictates that without the external scaffold, the pupil cannot function in this setting. We build the wall because the garden will not grow.

  ---

  ### LIMITATIONS OF THE PROCEDURE

  **1. Where the Accounts Converge (The Operational Peace)**
  There are zones where the disagreement ceases to matter. Both accounts demand that the classroom remains safe and that learning is possible. Whether you believe you are protecting the "innate good" of the class from a disruptor, or protecting the "artificial order" of the class from chaos, the physical intervention is identical. The procedure works best here. When a pupil is in crisis (Q4=No), both sides agree on removal and regulation. The philosophy only fights over the *aftermath*, not the immediate containment.

  **2. Where Evidence Fails (The Moral Horizon)**
  This procedure cannot resolve the ultimate aim of the school.
  *   **The Definition of Success:** If a pupil behaves perfectly due to fear of sanction (Pathway B success), Account 1 views this as a failure (no internal virtue), while Account 2 views it as a success (civilised conduct achieved). The form records "Compliance," but cannot record "Virtue."
  *   **The Point of Exhaustion:** In Case 3, the procedure mandates Construction. But if that construction crushes the pupil's spirit without ever sparking internalisation, Account 1 will argue we have harmed a child to save a rule. Account 2 will argue we saved the community from disorder. The form cannot weigh the moral cost of "artificial conduct" against the social cost of "disorder."
  *   **The Judgement Disguised:** The form highlights where you are making a judgement, but it cannot stop you from making it. Two staff members can look at the same pupil and answer Q6 differently. One sees "damage hiding the good"; the other sees "selfishness hiding behind damage." The form forces you to declare your hand, but it cannot prove who is right.

  **Final Note to Staff:**
  This form is a tool for consistency, not truth. It ensures that if we are going to disagree on *why* a child acts, we at least agree on *how* we record the decision. When you reach Pathway C, you are admitting that the school's philosophy is under review, not just the pupil's behaviour. Hand it over.
