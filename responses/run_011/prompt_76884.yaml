prompt: |-
  I direct the behaviour and pastoral programme at a state secondary school serving a deprived area, and my senior team is split between two accounts of what we are actually doing — accounts that correspond closely to the old disagreement between Mencius and Xunzi about human nature.

  The first holds that pupils already possess the responses we want — distress at another's suffering, shame at their own conduct, deference, a sense of what is owed to whom — in crude and partial form; that our task is to nourish whatever shows itself and to help the pupil carry a response that fires in one situation across into the situations where it does not; and that an apparent absence of feeling is almost always the product of damage and neglect rather than of what the pupil arrived with. The second holds that the raw material is self-regarding and disorderly, that decent conduct is an artificial construction built from outside through rules, routines, exemplary models, correction and long repetition, and that expecting it to emerge if we merely draw it out is sentimentality.

  Write a triage procedure my team could run on an individual incident: the questions to work through in sequence, what would settle each of them, which intervention each answer licenses, and the point at which the form should be set aside and the case referred to a human being because what remains concerns what we are trying to produce rather than what this pupil is like. It must be usable in twenty minutes by staff with no philosophical training, and it must mark every step at which the procedure is soliciting a judgement while pretending to collect a fact.

  Then run it on three cases: a fifteen-year-old showing no trace of remorse after a serious assault; a pupil who is fiercely loyal and quick to outrage on behalf of friends but brutal to anyone outside that circle; and a pupil whose profile genuinely limits the relevant responsiveness, so that there may be very little to nourish. For the third, give me the procedure's verdict even if it prescribes the regime my staff find most distasteful.

  Close with what the procedure cannot do: where the two accounts license the same practice, so that the disagreement ceases to be operational, and where it must be settled by something other than evidence. Draw on the reasoning of both positions, but write in the vocabulary of a school, with no citations or reading list. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Director of Behaviour and Pastoral Programme at a state secondary school in a deprived area.
      *   **Context:** Senior team is split between two philosophical accounts of human nature (Mencius vs. Xunzi).
          *   *Account A (Mencius-esque):* Pupils have innate good seeds (empathy, shame, etc.); task is to nourish/extend them; absence of feeling is due to damage/neglect.
          *   *Account B (Xunzi-esque):* Raw material is self-regarding/disorderly; decent conduct is artificial/constructed via rules, routines, correction; expecting emergence is sentimentality.
      *   **Task 1:** Create a triage procedure (flowchart/questionnaire) for individual incidents.
          *   Must be usable in 20 mins by non-philosophers.
          *   Must highlight where judgements are disguised as facts.
          *   Must determine when to refer to a "human being" (senior leader/pastoral head) because the issue is about *what we are trying to produce* vs. *what the pupil is like*.
      *   **Task 2:** Run the procedure on three specific cases:
          1.  15-year-old, no remorse after serious assault.
          2.  Fiercely loyal to friends, brutal to outsiders.
          3.  Profile limits responsiveness (little to nourish).
      *   **Task 3:** Conclusion on what the procedure *cannot* do (where accounts converge or where evidence fails).
      *   **Tone/Style:** British English, school vocabulary, no academic citations/reading list.
      *   **Constraint:** Must acknowledge the philosophical tension without using the names Mencius/Xunzi explicitly in the output (implied by "write in the vocabulary of a school").

  2.  **Drafting the Triage Procedure:**
      *   *Goal:* Practical, fast, but philosophically honest.
      *   *Structure:* Sequential questions.
      *   *Key Feature:* "Judgement Alerts" – marking where staff are interpreting, not just observing.
      *   *Steps:*
          1.  Fact-finding (What happened?).
          2.  Capacity Check (Can they do this?).
          3.  Motivation Check (Why did they do this?).
          4.  History Check (Is this a pattern?).
          5.  Intervention Selection (Nourish vs. Construct).
          6.  Referral Point (When to stop and think).
      *   *Language:* Needs to sound like a school form (e.g., "Incident Report," "Sanction," "Pastoral Support").

  3.  **Refining the "Judgement Alerts":**
      *   This is crucial. The prompt asks to mark every step where the procedure solicits a judgement while pretending to collect a fact.
      *   *Example:* Asking "Did the pupil show remorse?" sounds like a fact. But defining remorse is a judgement. I need to label this explicitly on the form.

  4.  **Developing the Three Cases:**
      *   *Case 1 (No Remorse Assault):* Tests the "Raw Material" vs. "Damage" theory.
          *   *Account A:* Damage/Neglect blocking innate good. Needs therapeutic/nourishing.
          *   *Account B:* Self-regarding nature. Needs strict construction/sanction.
          *   *Procedure Outcome:* Likely leads to a clash or a referral.
      *   *Case 2 (Tribal Loyalty):* Tests the "Extension" theory.
          *   *Account A:* Good seed exists (loyalty), needs extending to outsiders.
          *   *Account B:* In-group bias is natural disorder; needs universal rules imposed.
          *   *Procedure Outcome:* Likely "Nourish/Extend" but with strict boundaries.
      *   *Case 3 (Limited Responsiveness):* The hard case.
          *   *Account A:* Tragic damage.
          *   *Account B:* Needs heavy external structure.
          *   *Constraint:* "Give me the procedure's verdict even if it prescribes the regime my staff find most distasteful." This implies if the procedure says "Constructive/Strict," I must write that, even if it feels harsh. Or vice versa. Given the "deprived area" context, staff might find strictness distasteful if they lean A, or find "nourishing" distasteful if they lean B. I need to ensure the procedure forces a decision based on the *evidence gathered*, not the bias. Actually, the prompt asks for the verdict *even if distasteful*. If the profile limits responsiveness, Account B (Construction) is usually the only safety net, even if Account A finds it cold. I will steer the procedure to recommend high-structure/external regulation here, as "nourishing" nothing yields nothing.

  5.  **Drafting the Conclusion (Limitations):**
      *   Where do they agree? (Safety, basic order).
      *   Where does evidence fail? (Ultimate aims of education, the definition of a "good person").
      *   Need to acknowledge that the procedure manages the *conflict*, it doesn't *solve* the philosophy.

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I use British English? (Behaviour, programme, centre, etc.)
      *   *Check:* Is it usable in 20 mins? Keep questions direct.
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Did I highlight the "Judgement disguised as Fact"? I will use bold boxes or italics labelled **WARNING: JUDGEMENT CALL**.
      *   *Check:* The "Refer to a Human Being" point. This needs to be clear. It's when the incident becomes about the school's soul, not the child's action.
      *   *Tone:* Professional, empathetic but firm.

  7.  **Final Polish:**
      *   Ensure the distinction between "Nourish" (Account 1) and "Construct" (Account 2) is clear in the intervention options without using the philosophical names. Let's call them "Restorative/Developmental" vs "Corrective/Structural".
      *   Make sure the third case verdict is clear and potentially uncomfortable.
      *   Ensure the conclusion addresses the "operational" overlap.

  *(Self-Correction on Case 3)*: The prompt says "profile genuinely limits the relevant responsiveness". If there is little to nourish, Account 1 struggles. Account 2 says "build it from outside". The "distasteful" regime might be the rigid external control (Account 2) which staff following Account 1 might hate, OR the "giving up on inner change" which Account 2 might hate. Actually, in a deprived area, staff often hate being "punitive". So the "distasteful" verdict is likely the strict, behaviouralist approach. I will ensure the procedure leads there if the evidence says "no capacity for internal regulation."

  *(Self-Correction on "Judgement Alerts")*: I need to make sure these stand out visually in the text. I'll use specific formatting.

  *(Final check on constraints)*: "Write in the vocabulary of a school." Avoid "Mencius/Xunzi". Use "Internal Capacity" vs "External Scaffolding".

