      The candle guttered. Vera rubbed her thumb over the wax pool.
      "Take the tuning fork," Vera said. "Strike A. Hold it ten minutes. By my logic, that pure tone should be the Will screaming louder than any symphony. But it's dead. It's a dentist's tool."
      "So the ladder breaks at the first rung," Deniz said. She opened her case, didn't take anything out. "You're saying purity equals intensity. But static isn't intense. It's null."
      "No. I'm saying I was wrong about the ladder. Or wrong about the fork." Vera leaned forward. "If the bass is the crude mass, maybe the fork is too crude. It's not mass. It's a spike. It doesn't strive. It just is."
      "So you're retreating from absolute pitch to function?" Deniz asked. "That costs you. If the bass is only the Will because it supports the melody, then the bass isn't the Will. It's architecture."
      "It's the weight. The weight is real."
      "Weight isn't metaphysics, Vera. It's frequency. Low hertz vibrate the sternum. High hertz vibrate the air. That's physics, not philosophy."
      "Then try the octave test." Vera blew on her hands. "Take a Mozart line. Transpose it down an octave. Does it become less human? Less individual? If register tracks objectification, lowering the voice should drag it down the ladder. Closer to the mass. Further from the person."
      "It doesn't change," Deniz said. "A melody is a melody regardless of where it sits. So the hierarchy isn't about pitch. It's about role. The bass moves slow because it's the foundation, not because it's metaphysically heavier."
      "But Schopenhauer says the bass *is* the gravity. The slow movement isn't a choice. It's necessity."
      "Necessity for harmony. Not for ontology." Deniz shifted on the pew. "You're conflating structure with being. Again."
      "Fine. Structure reveals being. That's the point." Vera paused. "But here's where you lose me. If music is just sound moving, and we project the emotion... why does *Substrate* work? There's no contour. No body. No gesture. Nothing to hear-in."
      "Because it beats," Deniz said. "Two tones, slightly off. The roughness creates a pulse. Your chest rides it."
      "That's my point. The beating *is* the striving. It's the Will refusing to settle."
      "It's interference patterns," Deniz said. "It's physics again. You're calling it Will because you want it to be about us. But it's just waves cancelling out."
      "No. If it were just waves, it wouldn't make me weep. Emotions are specific. Grief needs a object. Joy needs a cause. The drone has no object. It's grief without a reason. That's what he meant. Music gives us the feeling itself, stripped of the motive."
      "That's arousalism," Deniz said. "You're saying it triggers a state. That's not copying the Will. That's poking the nervous system."
      "It's not arousal. Arousal implies a subject getting aroused. This is... the thing itself. Before the subject." Vera stopped. She looked at the candle. "But if I say that, I admit the melody doesn't matter. My symphonies. Thirty years of climbing the ladder. If the drone hits the Will directly, the ladder was a detour."
      "Was it?" Deniz asked.
      "Yes. If the bottom rung touches the same fire as the top, the hierarchy is decorative. I built careers on the rungs. They might be nothing." Vera rubbed her eyes. "I have to admit that. The structure I defended... it might just be decoration for the brute fact."
      "And I have to admit something too," Deniz said. "If the drone works because of the beating... because your sternum vibrates at forty hertz... then I can't explain why it's music. It's physiology. It's a massage for the vagus nerve. There's nothing musical left to explain. It's biology."
      "So we're both stuck," Vera said.
      "We're stuck with different glue."
      "You think the sound is empty until I fill it."
      "You think the sound is full until I empty it."

