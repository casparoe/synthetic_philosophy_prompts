  **General Rules and the Devlinite Reading**

  Taken as a set, Justice Rapp's record establishes three distinct rules regarding the legitimate reach of the criminal law:

  1.  **The Unwilling Spectator Rule:** The law may prohibit acts that impose unavoidable sensory or moral experiences on non-consenting others (Verdicts 1 and 6). This predicts ** Upholding** the memory statute only if the existence of the procedure forces itself upon the public eye, which the facts deny.
  2.  **The Irrelevance of Feeling Rule:** The strength of community disgust or moral conviction is evidence of nothing but itself; it cannot justify prohibiting private, consensual acts (Verdicts 2 and 4). This predicts **Striking Down** the memory statute, as the community is divided and the act is private.
  3.  **The Structural Regard Rule:** The law may prohibit consensual markets that fundamentally alter the ontological status of human beings in the public sphere, even without coercion (Verdict 5). This predicts **Upholding** the statute if memory is deemed a constitutive "part" of the person like a kidney, rather than a mutable experience.

  The tension between Verdict 5 (kidneys) and Verdict 7 (domestic service) is real. Both involve consensual contracts over the self, yet one is banned and the other permitted. The reconciliation lies in the distinction between *parts* and *labor*. Verdict 5 holds that selling organs turns persons into warehouses of spare parts, altering how humanity is regarded. Verdict 7 holds that selling labor or time does not alter that standing. The cost to Justice Rapp is metaphysical vulnerability: she must defend a slippery distinction between what constitutes a "part" of the person versus what constitutes "action" by the person, risking charges of arbitrariness whenever new technologies blur that line.

  The "Devlinite" reading of her reputation does not survive her record except in a restricted, embarrassed form. A true Devlinite enforces morality because it is morality. Rapp explicitly rejects this in Verdicts 2 and 4. She survives only as a "Structural Moralists": she enforces norms not to preserve tradition, but to preserve the *conditions of human recognition* (Verdict 5). However, since the memory case lacks the third-party harm of Verdicts 1 and 6, and the community feeling is insufficient per Verdicts 2 and 4, the Devlinite label is largely incorrect.

  **Verdict Prediction**

  Justice Rapp will **Strike Down** the statute.

  The closest analog in her record is Verdict 4 (the defiling flesh case). In both instances, an adult seeks to perform an irreversible, consensual act upon herself in private that a substantial portion of the community finds morally repugnant or ontologically disturbing. In Verdict 4, she held that the strength of a feeling is evidence of its strength and nothing else; here, she must hold that the strength of a fear regarding identity is evidence of that fear and nothing else.

  The analogy strains because eating flesh is consumptive, whereas deleting memory is constitutive—it changes who the person *was*, not just what she *did*. Verdict 5 (kidneys) suggests she might protect the integrity of the human vessel. However, Verdict 3 (helmets) establishes that she permits adults to risk the physical integrity of their brains for their own reasons. To be consistent with the engine of your novel—that her moralist reputation is wrong—she must prioritize the autonomy of Verdicts 3, 4, and 7 over the structural caution of Verdict 5. If she Upholds, she validates the Devlinite reputation; if she Strikes Down, she confirms she is a libertarian jurist mistaken for a moralist. The record underdetermines the case only if one equates memory with organs, but given her refusal to ban self-harm (helmets) and private taboo-breaking (flesh), the principle of self-ownership is the more defensible adoption. The jurisdiction would be adopting either the principle that the self is a trust held for the community (Uphold) or that the self is the sole property of the individual (Strike Down). Given her record on helmets and flesh, the latter is her true rule.

  **The Rule and the Distinguishing Case**

  The rule she is in fact running is that the criminal law may protect the structure of human relations from commodification, but it may not protect the individual from herself. The single further case that would decisively separate this rule from its nearest rival (the Structural Regard Rule of Verdict 5) is a case where a witness sells a memory deletion procedure to evade testimony in a criminal trial. That case would trigger Verdict 6 (harm to the justice system/third party) and allow her to Uphold, proving that her objection is to harm, not to the editing of the self.

  **The Key Sentence**

  "That the community relies on the continuity of its members does not entitle it to conscript their minds as public archives."

  Rule: The Principle of Self-Constitution
  Verdict: STRIKE DOWN
