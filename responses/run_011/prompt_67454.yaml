  2.  **Deconstruct the Practice:**
      *   **Allocation:** QALYs. Weights 0 (dead) to 1 (full health). Elicited from *general public* (outsiders), not patients. Dimensions: mobility, self-care, usual activities, pain/discomfort, anxiety/depression.
      *   **Clinical:** Consent/Refusal based on *patient's* values. Advance directives bind even if later self is content.
      *   **Tension:** Allocation says outsiders decide value of health states. Clinical says insider decides value of their own life.

  3.  **Analyze Well-Being Theories vs. Practice:**
      *   **Hedonism:** Well-being = pleasure/pain. The dimensions include "pain and discomfort" and "anxiety and depression." This fits well.
      *   **Desire-Satisfaction:** Well-being = getting what you want. The public trade-off exercises measure *preferences* (what would you trade?). But whose preferences? The public's preferences *about* the state, not the patient's desires *in* the state.
      *   **Objective-List:** Well-being = functioning/capabilities. Dimensions include mobility, self-care, usual activities. This fits well.
      *   **Underdetermination:** The practice measures *preferences* (trade-offs) regarding *functioning/feeling* dimensions. It doesn't strictly entail one theory of *what* makes life good, only that these dimensions are the relevant currency. However, by using public weights, it prioritizes *expected* utility over *experienced* utility.

  4.  **Analyze Authority (Whose Judgment?):**
      *   The practice explicitly chooses "society's values" (public weights) for allocation.
      *   It assumes the public can accurately value a state they don't inhabit (ignoring the adaptation/disability paradox noted by the colleague).
