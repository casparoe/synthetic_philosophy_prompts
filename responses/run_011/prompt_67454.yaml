      The allocation practice presupposes that well-being consists in standardized functioning and affect, but crucially entails that its value for justice is determined by social preference rather than experienced utility. This creates no logical contradiction with clinical deference, as the former answers a question of distributive fairness while the latter addresses bodily sovereignty. However, adopting hedonism would force a revision of the allocation weights to match patient experience, whereas an objective-list theory would vindicate the weights but challenge the ethical priority of adapted patient refusals.

