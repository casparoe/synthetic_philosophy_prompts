          *   Is it a contradiction? It's a shift in *authority*, not necessarily theory. But the theory drives the authority.

  7.  **Drafting - Section by Section:**

      *   **Bottom Line:** The allocation practice presupposes an objective-list or preference-based theory where value is determined by social expectation rather than experienced utility, creating a tension with clinical ethics that prioritizes subjective authority. Under hedonism, the allocation model fails because it miscounts experienced welfare; under an objective-list theory, the clinical deference to adapted patients becomes the outlier. The inconsistency is not a logical contradiction but a bifurcation of questions: distributive justice relies on standardized loss, while clinical ethics relies on sovereign agency.

      *   **Reconstruction:**
