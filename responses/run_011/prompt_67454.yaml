          *   **Authority:** It strictly entails that for *distribution*, the authoritative judgment is the public's ex ante preference, not the patient's ex post experience. This ignores the adaptation gap.
          *   **Illusion:** The objection gains purchase. The dimensions measure functioning and feeling, not truth. A patient could be mobile and pain-free in an illusion (e.g., medicated delusion) and score high. The practice concedes the objection because it values the *state* as described, not the metaphysical reality behind it.
