      *   *Tone:* Academic, direct, strategic, slightly critical (as a peer advisor).
      *   *Structure:*
          1.  Ranked Questions (4-5).
          2.  The "Cut One" Decision.
          3.  The "Cosmetic vs. Substantive" Verdict.
