answer: |-
  **Conceptual Framing**

  Our research programme adopts a framework of non-reductive physicalism, designed to reconcile the causal closure of physics with the explanatory autonomy of the special sciences. We accept the exclusion argument's premise that the physical domain is causally closed; every physical effect possesses a sufficient physical cause. Consequently, we do not posit 'downward causation' as a metaphysical force that overrides or competes with micro-level dynamics. To do so would invite mysticism and violate physical law.

  However, we also endorse the multiple realisability argument: the central kinds of economics, cognitive science, and ecology—such as credit crunches, beliefs, or ecosystem resilience—are heterogeneously realised at the physical level. No single micro-description captures the regularities governing these phenomena. Therefore, while higher-level properties may not add metaphysical causal power to the physical base, they possess indispensable explanatory autonomy. They identify robust patterns that support counterfactual reasoning and interventionist strategies that are computationally inaccessible or opaque at the micro-scale.

  The 'emergence' we model is thus ontological only in the sense of structural novelty, but causal only in an interventionist sense. Recent formal measures of causal emergence are interpreted here not as evidence of metaphysical surplus, but as quantifications of explanatory compression: they identify scales where information about system dynamics is maximally preserved relative to description length. Macro-variables serve as reliable handles for control and prediction, even if their efficacy is ultimately realised by physical processes. This division of labour protects physics from mysticism and the special sciences from eliminativism. We treat higher-level variables as causally efficacious within the scope of our models, acknowledging that this efficacy is a function of our descriptive grain and interventionist interests, rather than a violation of physical sufficiency. This allows physicists, economists, and cognitive scientists to collaborate on shared dynamical structures without ontological conflict.

  Crucially, this framing avoids the pitfall of epiphenomenalism. While higher-level properties do not compete with physical causes, they are not causally idle in the pragmatic sense required for science. A recession causes unemployment not because it pushes particles, but because the counterfactual dependence between financial indicators and labour markets holds invariantly across diverse physical realisations. Our modelling efforts therefore target these invariant relationships. We recognise that the 'causal work' attributed to macro-variables is relative to a level of description, yet this relativity does not diminish their scientific validity. The philosophers on our board will recognise this as a compatibilist stance: causal claims are true relative to the vocabulary employed, provided they supervene on a physically closed base. This ensures that our interdisciplinary language remains precise enough for philosophical scrutiny while remaining functional for empirical modelling. We proceed without fear of reductionism erasing our objects of study, nor fear of holism violating physical law.

  ***

  **Operational Criterion for Modellers**

  **The Criterion of Realisation-Independent Invariance**

  Given the commitment that macro-variables are ontologically supervenient yet explanatorily autonomous, modellers must distinguish between variables that support robust interventions and those that are mere artefacts of aggregation. To survive philosophical scrutiny, we must distinguish *metaphysical production* (reserved for the micro-level) from *interventionist causation* (applicable at the macro-level). A coarse-grained quantity is entitled to a causal interpretation in an intervention study only if it satisfies the following test:

  1.  **Diverse Realisation:** Identify at least two distinct micro-level interventions that produce the same change in the candidate macro-variable (e.g., raising systemic temperature via different energy inputs; triggering a liquidity shock via different asset classes).
  2.  **Stability Check:** Measure the effect on the target outcome variable across these different micro-realizations.
  3.  **Judgement:**
      *   **Causal Interpretation Permitted:** If the relationship between the macro-variable and the outcome remains stable (invariant) despite variations in the underlying micro-state, the macro-variable functions as a robust causal handle. It captures a real pattern suitable for policy or control.
      *   **Bookkeeping Only:** If the outcome varies significantly depending on *how* the macro-state was realised (even if the macro-value is identical), the variable is merely descriptive. It lacks the counterfactual stability required for interventionist causation.

  This criterion ensures that 'causal' labels are applied only where the coarse-graining preserves predictive power across realisations, aligning modelling practice with our philosophical commitment to explanatory autonomy without metaphysical excess.
