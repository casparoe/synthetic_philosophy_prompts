answer: |-
  This is an excellent catch. You have identified the precise friction point in Hume's economic thought where he is transitioning from Mercantilism (money = wealth) to Classical Economics (money = neutral veil). Your reading group's verdict is half-right but misses the structural logic holding the essay together. It is not a confusion on Hume's part, but a distinction between *domestic equilibrium* and *international competition*.

  Let's work through the text you provided to reconstruct the argument charitably.

  ### 1. The Load Bearing of "If we consider any one kingdom by itself"

  This phrase is the key to unlocking the apparent contradiction. Hume is establishing the **Neutrality of Money** thesis, but he is strictly limiting its scope.

  *   **The Claim:** In a closed system ("by itself"), the quantity of money does not determine real wealth. If you double the money, you double the prices ("a crown in Harry VII.'s time served the same purpose as a pound does at present"). Therefore, having more money doesn't make the nation richer in terms of goods or labor capacity.
  *   **The Limit:** This logic *only* holds in isolation. As soon as you introduce a second kingdom, the "by itself" condition is violated.
  *   **The Underselling Argument:** When Hume discusses "poorer states to undersel the richer," he is no longer considering a kingdom "by itself." He is considering a *relative* system.
      *   **Mechanism:** This is about **relative prices**, not absolute price levels. If Kingdom A has a high money supply (high prices) and Kingdom B has a low money supply (low prices), Kingdom B can sell goods cheaper than A.
      *   **Consequence:** Kingdom A loses its export market. Industry migrates to B.
      *   **Reconciliation:** The opening claim says money quantity doesn't change *internal* reality (a worker is no more productive just because he is paid more pounds). The later claim says money quantity *does* change *external* reality (a worker priced out of the international market cannot sell his labor).

  So, the "no consequence" rule applies to domestic welfare in equilibrium. The "disadvantage" rule applies to international competitiveness. The bank proposal is designed to manage the latter, not the former.

  ### 2. The Bank: Lowering Prices vs. Stopping Rise

  You asked whether the hoarding bank is supposed to lower prices or just stop them rising. The text says: *"the national advantage, resulting from the low price of labour."*

  Hume intends for the bank to **lower** the nominal price of labor (and commodities), not merely stabilize it. Here is how this is consistent with "prices... are always proportioned to the plenty of money":

  *   **The Quantity Theory Mechanism:** Hume believes $P \propto M$ (Prices are proportional to Money).
  *   **The Bank's Action:** The bank "locked up all the money it received, and never augmented the circulating coin."
  *   **The Result:** By locking up specie (gold/silver) and destroying "paper-credit," the bank reduces the effective $M$ (the money actually circulating).
  *   **The Consistency:** If you reduce $M$, $P$ must fall. This is perfectly consistent with the Quantity Theory.

  **Where is the tension?** The tension is with the opening claim that money quantity is of "no consequence."
  *   **Resolution:** Remember the "by itself" clause. Domestically, lower prices don't make you richer (your income falls in proportion to prices). *However*, in an open economy, lower prices make you competitive. Hume is arguing that while money is neutral regarding *internal* wealth, it is non-neutral regarding *trade balance*. The bank sacrifices domestic nominal values (lower wages/prices) to gain international market share.

  ### 3. "Manufactures Shift" vs. The Bank Scheme (Redundancy?)

  You asked if the passage about manufactures shifting to where labor is cheap makes the bank scheme redundant.

  *   **The "Shift" Passage:** This describes the **natural penalty** for high prices. If you let your money supply get too high, prices rise, and industry naturally flees to cheaper nations. This is an automatic adjustment mechanism (what later economists would call the Price-Specie-Flow Mechanism).
  *   **The Bank Proposal:** This is a **policy intervention** to prevent the penalty from triggering.
  *   **Is it redundant?** No. It is prophylactic.
      *   Without the bank: Money flows in -> Prices rise -> Industry leaves -> Money flows out -> Prices fall. (A painful cycle of boom and bust/industrial decay).
      *   With the bank: Money flows in -> Bank locks it up -> Circulation stays stable -> Prices stay low -> Industry stays.

  Hume views the natural adjustment ("manufactures shift") as a "disadvantage" and a "loss to a nation." He prefers to artificially maintain a lower money supply (via the bank) to keep labor cheap *permanently*, rather than waiting for the market to correct itself by destroying the nation's industry. He is using the Quantity Theory to justify a Mercantilist-style policy: keep money tight to keep exports strong.

  ### 4. Lexical Clarifications

  Your confusion is definitely aided by shifts in terminology. Here is the technical work specific words are doing in 1752:

  *   **"Money":** Hume almost always means **Specie** (gold and silver coin). He does not consider paper notes to be "real" money in the same sense.
  *   **"Counterfeit money":** This is the most jarring term for modern readers. Hume uses this to refer to **Paper Credit** (banknotes). He calls it "counterfeit" because it is a claim on money that isn't physically present. He believes it inflates prices without adding real wealth ("treasure").
  *   **"Circulating coin":** This is crucial. Hume distinguishes between money *existing* in the kingdom and money *circulating* in the market.
      *   Money in a vault (even a public bank's vault) does not raise prices.
      *   Money in a pocket does.
      *   This allows him to propose "hoarding" without violating the Quantity Theory. If you lock the money up, it is no longer part of the "plenty of money" that determines prices.
  *   **"Public":** In the first paragraph ("It is only the public which draws any advantage"), this means **The State/Government**, not the general populace. He means the government can use surplus tax revenue (from inflated nominal prices) to fund wars.
  *   **"Industry":** This does not mean "manufacturing sector" specifically. It means **productive labor** or **work ethic**. When he says "greater number of people and their greater industry are serviceable," he means human capital is real wealth, unlike money.

  ### 5. Verdict on the Reading Group's Critique

  Your reading group says: *"The whole essay is just the quantity theory bolted onto a leftover mercantilist instinct to hoard specie, and the bank bit is Hume not thinking clearly."*

  **Assessment:** This is a **lazy verdict**. It identifies the tension but misdiagnoses the cause.

  *   **Why it's not confusion:** Hume is thinking clearly about the distinction between *stock* and *flow*, and *domestic* vs. *international* spheres. He knows that locking up money reduces circulation. He knows reducing circulation lowers prices. He knows lower prices boost exports. The logic is internally consistent *if* you accept his goal is export competitiveness.
  *   **Why it feels like Mercantilism:** It *is* Mercantilist in its goal (maximize trade surplus, keep specie in the country), but it uses Classical logic (Quantity Theory) to achieve it. He isn't hoarding because he thinks gold is wealth (he explicitly denies this in paragraph one). He is hoarding because he thinks **low prices are a competitive weapon.**
  *   **The Strain:** The essay *does* strain, but not where your group thinks. The strain is in the transition from "money is of no consequence" to "we must manage money to save our industry."
      *   **Charitable Reconstruction:** Hume is arguing that while money is neutral in the *long run* (equilibrium), it is not neutral in the *medium run* (competition). If prices rise too high, industry leaves *before* the money supply corrects itself. Therefore, the state should artificially suppress the money supply (via the bank) to maintain the "low price of labour" that attracts industry.

  **Summary of the Reconstruction:**
  1.  **Domestically:** Money is neutral. More money = higher prices, not more wealth.
  2.  **Internationally:** Money is not neutral. Higher prices = lost trade.
  3.  **The Problem:** Paper credit inflates prices without bringing in real specie, hurting trade.
  4.  **The Solution:** A public bank that locks up specie (reducing circulation) and bans paper credit.
  5.  **The Outcome:** Prices fall ("low price of labour"). Domestic wealth is unchanged (neutrality holds), but international competitiveness is maximized (trade advantage gained).

  Hume isn't contradicting himself; he is applying a domestic truth (neutrality) to an international problem (competitiveness) and realizing that to win internationally, you must manipulate the domestic money supply to keep prices artificially low. The "hoarding" is not for wealth, but for price control.
