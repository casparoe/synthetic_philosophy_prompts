answer: |-
  ## Simulation Title: *The Valley of Oros*

  **Concept:** A resource-management game where students play Household Heads in a centralized river-valley polity. The visible "Class Score" is the State's Treasury (Complexity). The hidden "Individual Score" is Household Caloric Intake (Welfare). The mechanics are rigged so that maximizing Individual Score in late rounds requires abandoning the State, crashing the Class Score.

  **Time:** 75 Minutes (10 min setup, 35 min game, 30 min debrief).
  **Class Size:** 24 (Scalable instructions included).

  ---

  ### 1. Materials List
  *   **Household Ledgers (24 copies):** A simple sheet with 6 rows (Rounds) and columns for: *Base Production*, *Tax/Corvée*, *State Benefit*, *Subsistence Bonus*, *Final Grain*.
  *   **Decision Slips (24 stacks of 6 small slips):** Each slip has two checkboxes: **[ ] Remain in Valley** / **[ ] Migrate to Highlands**. Students tear one off each round and hand it in.
  *   **Projector/Board:** To track the **Royal Treasury** (Public Score) and **Participation Rate** (Public Info).
  *   **Pens.**
  *   **No tokens/currency:** Use numbers only. It speeds up play and keeps the "economy" abstract enough to map onto different historical cases later.

  ---

  ### 2. Scoring & Win Condition (The Trap)
  *   **The Lie:** Tell them: *"We are building a civilization. Your goal is to ensure the Valley of Oros prospers. We will track the Royal Treasury on the board."* (They will assume their success is tied to this number).
  *   **The Truth:** At the end of class, ask: *"Who ended with more than 40 Grain?"* Those students "win."
      *   **Base Production:** 10 Grain/round.
      *   **Tax (If Remain):** Starts at 3, rises to 7.
      *   **State Benefit (If Remain):** Shared infrastructure. Starts high, diminishes as complexity rises, *and* drops if Participation Rate falls below 50%.
      *   **Subsistence Bonus (If Migrate):** Flat +4 Grain. No tax, no state benefit. Represents lower overhead, no corvée, but no irrigation/protection.

  **The Mathematical Tipping Point (Round 4):**
  *   **Round 4 Cost:** Tax = 6. State Benefit = 5 (due to diminishing returns). Net for Stayer = -1.
  *   **Round 4 Exit:** Tax = 0. State Benefit = 0. Subsistence = +4. Net for Leaver = +4.
  *   *Result:* It becomes individually rational to leave, but if >50% leave, the State Benefit collapses for everyone remaining, accelerating the exodus.

  ---

  ### 3. Round-by-Round Table

  | Round | What You Say (The Narrative) | What They See (On Sheets/Board) | What You Hope They Realize (Later) |
  | :--- | :--- | :--- | :--- |
  | **0: Setup** | "You are Household Heads in Oros. We must build a legacy. Submit your decision slips silently. No talking." | **Board:** Treasury: 0. **Sheet:** Base: 10. | They assume "Civilization Building" = "My Success." They are tracking the Polity, not the Household. |
  | **1: The Boom** | "The King orders a Canal. It requires labor, but yields water for all." | **Tax:** 3. **Benefit:** 6. **Treasury:** +72. **Participation:** 100%. | Staying is obviously rational. The State looks benevolent. Complexity pays for itself. |
  | **2: The Expansion** | "Raiders threaten. We need a Garrison. Plus a Scribal Bureau to manage the grain." | **Tax:** 4. **Benefit:** 6. **Treasury:** +48 (Growth slows). **Participation:** 100%. | Marginal returns are flattening. The Treasury grows, but slower. They feel the drag but accept it for security. |
  | **3: The Strain** | "The temple must be expanded to appease the gods. The census is overdue." | **Tax:** 5. **Benefit:** 5. **Treasury:** 0 (Stagnant). **Participation:** ~90%. | **The Tainter Moment.** Cost = Benefit. The State is treading water. A few students might test the Exit option. |
  | **4: The Trap** | "The frontier is unstable. We must fortify the perimeter. All households must contribute." | **Tax:** 6. **Benefit:** 5. **Treasury:** -24 (Deficit!). **Participation:** Drops to ~40%. | **The Divergence.** Stayers lose grain. Leavers gain grain. The "Civilization Score" crashes. Students feel anxiety watching the Board, but relief checking their Sheets. |
  | **5: The Unraveling** | "Order is breaking. We need emergency levies to restore the system." | **Tax:** 7. **Benefit:** 0 (System Failure <50% participation). **Treasury:** -100. **Participation:** ~20%. | The State is now predatory (Tax > 0 Benefit). Exit is the *only* rational choice. The "Collapse" is visible on the board. |
  | **6: The Aftermath** | "The King's authority is no longer recognized. Do you maintain the old ways?" | **Tax:** N/A. **Benefit:** 0. **Treasury:** N/A. **Participation:** <10%. | Most are in the Highlands. They have food. The Palace is empty. The game ends. |

  ---

  ### 4. The Debrief (Mapping the Definitions)
  *Do not explain the lesson immediately. Ask questions.*

  1.  **The Hook:** "Look at the Board. In Round 4, the Treasury went negative. By Round 6, the State ceased to function. By the definition of the King, this was a **Catastrophe**. Who here felt bad when the Treasury crashed?" (Most will raise hands).
  2.  **The Reveal:** "Now look at your Ledger. Who ended with more than 40 Grain?" (The 'Leavers' will raise hands). "Who ended with less?" (The 'Stayers' who trusted the State).
  3.  **The Pivot:** "For the King, Round 5 was Collapse. For the Household in the Highlands, Round 5 was **Liberation**. You stopped paying for a garrison that didn't protect you and a temple that didn't feed you."
  4.  **The Theory:**
      *   **Tainter:** Point to Rounds 1-3. Complexity solved problems. Point to Round 4. Complexity *became* the problem.
      *   **Revisionists (Scott, et al.):** Point to the Leavers. "Did civilization end? Or did people just stop calling themselves 'Orosians'? Did they die, or did they just stop paying taxes?"
      *   **The Unit of Analysis:** "For the first 30 minutes, you were rooting for the **Board**. Why? Because I told you that was the score. In history, who gets to write the score? The literate state. The peasants in the hills don't leave inscriptions. We track the Treasury because the Treasury kept the records."

  ---

  ### 5. Predictable Failures & Fixes

  **Failure 1: The "I Won" Gloating.**
  *   *Risk:* Students who exited early feel clever; stayers feel duped.
  *   *Fix:* In the debrief, emphasize **Structural Incentives**, not skill. "You didn't win because you were smarter. You won because the simulation parameters shifted in Round 4. In Round 2, leaving was suicide. The 'Stayers' weren't foolish; they were loyal to a social contract that stopped paying out. This is why collapse is tragic, not just a math error."

  **Failure 2: Spreadsheet Arithmetic.**
  *   *Risk:* Students get bogged down in math and miss the feeling.
  *   *Fix:* **Pre-print the math.** The Ledger should say: *"If Remain: Subtract Tax, Add Benefit."* Do not make them calculate the State Benefit themselves. You announce the Benefit based on the Participation Rate *after* collecting slips. Keep the numbers single digits.
  *   *Pacing:* Give them exactly 90 seconds per round. Use a timer. Urgency prevents over-calculation.

  **Failure 3: Coordination/Chatting.**
  *   *Risk:* They talk and organize a mass strike early.
  *   *Fix:* Enforce silence strictly. "Households cannot communicate across the valley." This replicates the information asymmetry of pre-modern states.

  ---

  ### 6. Limitations (What You Must Supply)
  *Be honest about what the simulation sanitizes.*

  1.  **Violence:** In the game, "Migrating" is a checkbox. In reality, the State sends soldiers. The "Highlands" are often militarily raided. *Add to debrief:* "In Oros, you left safely. In the Classic Maya or Bronze Age Mediterranean, leaving often meant warfare. The 'Relief' of collapse is often purchased with blood."
  2.  **Disease/Environment:** The game is purely economic. Real collapse often involves drought or plague that makes *both* State and Household fail. *Add to debrief:* "Here, the land stayed fertile. Often, collapse is a double-bind: the State demands more *because* the harvest failed."
  3.  **Archaeological Silence:** The game lets them see their own scores. In history, we only see the Palace ruins (The Treasury), not the Highland huts (The Ledgers). *Add to debrief:* "We know the Palace burned. We don't know the peasants ate better. That is why 'Collapse' is a historiographical bias, not just an event."

  ---

  ### 7. Scalability
  *   **For 12 Students:** The math holds, but the "Participation Rate" thresholds feel more volatile.
      *   *Adjustment:* Tell them the "State Benefit" depends on a fixed number (e.g., "If 8+ households stay"). With fewer students, individual choice feels more impactful, which heightens the anxiety.
  *   **For 40 Students:**
      *   *Adjustment:* Pair them up (20 Households). This reduces paper shuffling.
      *   *Thresholds:* Adjust the "System Failure" threshold to 50% of *pairs*.
      *   *Debrief:* It becomes harder to hear every voice. Use a "Think-Pair-Share" during the debrief questions before opening to the room.

  ### 8. The "Late Realization" Check
  To ensure they realize *late* which unit they were tracking:
  *   **Do not** reveal the individual win condition until the very end of the debrief.
  *   **Do** ask mid-game: "How is Oros doing?" They will point to the Board.
  *   **Do** ask post-game: "How are *you* doing?" They will look at their Sheets.
  *   **The Gap:** That pause between the two answers is where the learning happens.
