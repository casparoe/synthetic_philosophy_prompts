answer: |-
  Systematicity is the single requirement that eliminates the most otherwise attractive candidates, and I begin with it because understanding its force is the key to unlocking the deadlock you faced last month. In the language of social choice, systematicity demands that the tribunal apply the same aggregation rule to every proposition on the agenda, meaning you cannot use majority rule to decide the elements of misconduct while using a different method, such as logical derivation, to decide the overall outcome. This requirement is the primary engine of the impossibility results you have encountered, and it is the first candidate for rejection if you wish to preserve a rule that yields a publishable, internally coherent reasoned decision. While it sounds like a virtue of fairness to treat every question the same way, in a legal context it is largely an artefact of importing Arrow's framework into a setting where some propositions are logically prior to others. Your tribunal's purpose is not merely to aggregate preferences but to arrive at a correct legal classification, and that purpose inherently distinguishes between the premises, which are findings of fact or law, and the conclusion, which is a logical consequence of those premises. By insisting on systematicity, you force the tribunal into the doctrinal paradox where the collective judgment on the premises contradicts the collective judgment on the conclusion, rendering the reasoned decision incoherent. Therefore, while systematicity is a standard condition in the theoretical literature, it is not a genuine requirement for your body; indeed, dropping it is the only way to rescue the validity of your published reasons.

  With that exclusionary condition set aside, we can construct the specification list you requested, distinguishing between functional necessities and theoretical ideals. You correctly identified universal domain, which requires the rule to handle any possible combination of individual votes. This is a genuine requirement for you because the secret ballot ensures that members are free to vote according to their conscience on any element, and your rule must not break or return an error when faced with the divergent pattern you saw last month. You also listed preservation of unanimity, often called the Pareto principle, which dictates that if every member agrees on a proposition, the collective judgment must reflect that. This is a genuine requirement for a tribunal, as overturning a unanimous finding would undermine the legitimacy of the process, though it is worth noting that in your specific conjunctive case, unanimity on the elements guarantees unanimity on the outcome, so this condition does not do much heavy lifting in the paradox scenarios. You mentioned a consistency requirement on the collective set of findings, which in the literature is termed collective rationality. This is the most critical genuine requirement for your context; a reasoned decision that asserts duty and breach were proven but that misconduct did not occur is logically flawed and legally vulnerable, so the aggregation rule must guarantee that the collective judgments satisfy the logical constraints of your code.

  Your characterisation of the independence-and-neutrality bundle as systematicity is technically accurate, but it is worth loosening the definition slightly for your purposes. In judgment aggregation, independence means the collective decision on one proposition depends only on individual votes on that proposition, while neutrality means the rule is the same across propositions. You should treat independence as a genuine requirement to prevent strategic voting or external influence on specific elements, but you must reject neutrality, as I argued with systematicity, because the conclusion is structurally different from the premises. You also listed anonymity, which requires that the identity of the voters not matter. This is a genuine requirement in principle, but your practice of recusals makes strict anonymity impossible to satisfy in the Arrowian sense because the set of voters changes. You should refine this to require anonymity among voting members, meaning that within any specific case, every participating member's vote carries equal weight. Monotonicity or responsiveness is another item on your list, requiring that if a member switches their vote to support a proposition, the collective outcome should not switch against it. This is a genuine requirement to ensure that the voting rule is stable and intelligible to appellants. Determinacy of outcome without a casting vote is essential for finality, though you must decide whether a tie constitutes a failure of the burden of proof or a deadlock requiring rehearing. Finally, you mentioned insensitivity to the order in which the chair puts the questions, which is known as agenda independence. This is a genuine requirement for fairness, as the outcome of a case should not depend on the chair's discretion to sequence the votes, yet as you noted, this is currently a point of vulnerability in your procedure.

  The impossibility theorem relevant to your situation, often attributed to List and Pettit, demonstrates that you cannot jointly satisfy universal domain, anonymity, independence, and collective rationality when the agenda is non-simple. An agenda is non-simple if there are logical connections between the propositions that prevent them from being decided independently, which is exactly the case with your three-element test for misconduct. The subset of requirements that cannot be jointly satisfied is universal domain, anonymity, independence, and collective rationality. You must drop at least one to have a working rule. Since universal domain is guaranteed by secret ballot and anonymity is fundamental to a tribunal's equality, and independence is necessary to prevent logrolling, the condition that usually gives way is the combination of independence and neutrality, or more specifically, the demand that the conclusion be voted on directly rather than derived. The agenda condition is doing all the work in triggering this impossibility. If your propositions were logically unrelated, simple majority rule would satisfy all conditions. However, because your docket is overwhelmingly conjunctive, the logical connection is intrinsic to the legal doctrine you administer. You cannot design the question set to escape non-simplicity the way single-peakedness escapes Arrow's theorem. Single-peakedness is a restriction on the domain of preferences, assuming voters have spatial preferences that align along a spectrum. Your members do not have spatial preferences over legal elements; they have judgments of truth. The logical constraint that Duty and Breach and Causation imply Misconduct is a feature of the law, not the voters, so you cannot restrict the domain of votes to avoid the paradox without changing the law itself. The non-simplicity is unavoidable for you.

  This brings us to your practical constraints regarding panel size and chair power. The variation in panel size from nine down to six complicates the application of fixed quotas. If you require five votes for a finding, a panel of six operates under a much stricter supermajority than a panel of nine. To maintain consistency, you should define your thresholds proportionally, such as a strict majority of voting members, or establish a fixed quorum below which the tribunal cannot vote. Regarding the chair's control over the sequence of questions, your colleagues are correct that this is a form of power that violates agenda independence. In a sequential procedure, the order of voting can determine the outcome if the tribunal stops deliberating once a decisive element is found against the respondent. To eliminate this, the agenda must be fixed by rule rather than chair discretion, ensuring that all elements are voted on regardless of intermediate outcomes, or that the order is randomised or statutory.

  Evaluating the obvious candidates against this specification yields a clear upshot. Conclusion-based aggregation, where you vote only on the overall outcome of misconduct, satisfies collective rationality and systematicity but fails to produce the reasoned decision you are required to publish, as it leaves the elements undefined. Majority rule with the chair breaking ties satisfies determinacy but fails anonymity and does not solve the logical inconsistency if you vote on all elements. Supermajority or quota-style rules reduce the likelihood of the paradox occurring by making it harder to find elements made out, but they do not eliminate the logical possibility of inconsistency and may violate the statutory standard of proof. Sequential or priority procedures are highly vulnerable to the chair's agenda power and path dependence, making them unsuitable given your concerns about fairness. The most robust solution is premise-based aggregation, where the tribunal votes by majority on each element, but the overall outcome is not voted on; instead, it is derived logically from the element findings. This rule satisfies collective rationality by construction, respects universal domain and anonymity among voting members, and maintains independence on the premises. It requires dropping systematicity, as the conclusion is treated differently from the premises, but as I argued, systematicity is an artefact you should discard. To address the chair's power, you must codify the order of the premises or require simultaneous voting on all elements before deriving the outcome. To address panel size, you should specify that the majority threshold applies to the members present and voting, provided a minimum quorum is met. This approach ensures that your published reasons are always logically coherent, that the rule is stable across different panel compositions, and that no single member holds the power to manipulate the agenda, securing both the legal integrity and the procedural fairness of your tribunal.
