answer: |-
  You are right to be suspicious of the standard answers. Hume's "conversion" theory assumes the eloquence *always* works, which your documentary case disproves. The "make-believe" theory (that we know it isn't real) collapses when faced with the piano piece or the voicemail installation, where there is no fiction to hide behind, only raw affect.

  Your verdicts are not inconsistent; they are tracking a specific boundary condition that standard aesthetics often ignores. You are not measuring "sadness" versus "happiness." You are measuring **Agency over Meaning.**

  Here is the principle that underlies your list.

  ### The Principle of Formal Sovereignty

  **We accept negative affect in art only when the Form demonstrates sovereignty over the Suffering.**

  When the structure, rhythm, or narrative logic of the work (the Form) masters the pain depicted (the Suffering), the experience is aesthetic and can be sought out. When the Suffering overwhelms the Form, or when the Form is subservient to the exploitation of that Suffering, the experience becomes ethical or psychological burden, and is rejected.

  To make this precise enough for predictions, we need three clauses:

  **Clause 1: Structural Necessity.**
  The sadness must appear inevitable within the work's internal logic, not gratuitous or externally imposed.
  *   *Handles:* The "inevitable ending" film (accepted) vs. the "manipulative character death" (rejected). In the latter, the Form bowed to the demand for tears; in the former, the tears were the price of truth.

  **Clause 2: Containment.**
  The medium must provide a boundary that guarantees the viewer will not be psychologically overwhelmed by the raw reality of the pain.
  *   *Handles:* The "old man film" (accepted) vs. the "child documentary" (rejected). The film has a frame, a script, a distance. The documentary presents raw reality where the Form (journalism) does not contain the horror, it only transmits it. It also handles the "grisly horror" avoidance: horror often aims to break containment (make you feel unsafe), whereas tragedy aims to contain the unsafe within a meaningful structure.

  **Clause 3: Viewer Readiness.**
  The viewer must currently possess the psychological capacity to enter the container without breaking.
  *   *Handles:* The "friend's baby loss" case. The film didn't change; your capacity to be contained by its Form did. For two years, the Suffering was too proximate; the Form could not hold it. Later, the Form was sufficient.

  ***

  ### The Cost

  You asked for honesty about the cost. If we accept Formal Sovereignty as the rule, one of your verdicts must be overturned or reclassified.

  **The Cost: The Breakup Songs.**
  You said: *"I listened to nothing but slow miserable songs... I'd have said I enjoyed it... I wanted the feeling."*
  Hume says you enjoyed the *eloquence*. You say you wanted the *pain*.
  Formal Sovereignty suggests you are mistaken about the "wanting." You did not want the pain of the breakup (which you avoided in reality); you wanted the **proof of survival.**
  By listening to the songs, you were testing the container. You were verifying that the Form (the song) could hold the Suffering (your grief) without breaking *you*. You didn't enjoy the misery; you enjoyed the *sovereignty* of the song over the misery. It proved the emotion was manageable.
  *Verdict:* You must accept that you did not enjoy the sadness itself. You enjoyed the safety of the vessel. If the songs had actually deepened the wound rather than bandaging it, you would have stopped listening.

  ***

  ### Predictions

  Here is what the Principle of Formal Sovereignty says about the cases you haven't mentioned:

  **1. The War Memorial (supposed to make you cry)**
  *   **Prediction:** You will accept it if it transforms individual death into collective meaning (e.g., a structured list, a sublime architecture). You will reject it if it focuses on visceral, individual gore without context (e.g., a display of bloody uniforms).
  *   **Reasoning:** If the memorial imposes Order on Chaos (Sovereignty), it is art. If it merely presents the Chaos (Documentary), it is a burden. Most successful memorials work because they are abstract; they contain the grief in stone rather than flesh.

  **2. The Comedian (set about his dead brother)**
  *   **Prediction:** You will enjoy it *only* if the jokes land.
  *   **Reasoning:** This sounds counter-intuitive, but the "joke structure" is the Form. If the comedian is just crying on stage, that is the Documentary (rejected). If he forces the grief into a rhythm, a punchline, a structure, he is asserting Sovereignty over the death. You laugh not because it isn't sad, but because the Form has mastered the sadness. If the set feels "raw" or "unprocessed," you will feel uneasy (like the manipulative TV death).

  **3. The Novel (awful stuff happens offstage)**
  *   **Prediction:** You will find this *more* acceptable than a graphic depiction.
  *   **Reasoning:** This is the ultimate Containment. By keeping the suffering offstage, the author forces your imagination (which is under your control) to do the work, rather than forcing images (which bypass control) onto your retina. The Form (narrative ellipsis) maintains Sovereignty over the Suffering.

  **4. The Tacked-On Happy Ending (studio forced)**
  *   **Prediction:** You will hate this more than the tragedy.
  *   **Reasoning:** This violates Structural Necessity. It admits that the Form is subservient to commerce, not truth. It breaks the container. It tells you the previous sadness was a lie. It is the aesthetic equivalent of the "manipulative character death," just at the other end of the emotional spectrum.

  ***

  ### The Voicemail Installation

  This is the hardest case, and the one where you need to be most careful. You ask: *Is that the film, or is it the documentary I said I'd never sit through?*

  **The Verdict:** It is the Documentary wearing Art's clothes, and your unease is justified.

  **Why:**
  1.  **Raw Material:** Unlike the piano piece (which is abstract) or the film (which is scripted), the voicemails are raw data of real suffering. They lean heavily toward the Documentary side of the spectrum.
  2.  **The Artist's Intent:** You wrote: *"she says she made it partly because she likes watching people cry in the room."*
      This is the critical failure of Formal Sovereignty. In the "inevitable ending" film, the tears are a byproduct of the truth. In this installation, the tears are the *objective*. The Form is not mastering the Suffering; the Suffering is being instrumentalized to produce a reaction in the viewer.
  3.  **The Spectacle:** A queue round the block suggests a ritual, which is good, but if the artist is watching *you* cry for her gratification, the power dynamic shifts. You are no longer a witness; you are a participant in a spectacle of grief.

  **Conclusion:**
  You cried because the content was powerful (the Documentary effect), but you should feel "used" (like the manipulative TV series) because the artist's intent violates the aesthetic contract. The Form did not protect you; it exposed you.

  If you go back, watch the artist, not the exhibit. If she is mourning *with* the room, it might be art. If she is harvesting tears, it is the documentary you said you wouldn't sit through, sold as a ticket. Your instinct to question it is the correct application of your own principle.
