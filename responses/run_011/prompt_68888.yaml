answer: |-
  Here is the conceptual layout you asked for, stripped of the academic hedging.

  ### 1. What is the claim even about?

  When a historian says a society has collapsed, they are almost never saying that everyone died. They are saying that a specific **structure of complexity** has ceased to function.

  The disagreement among experts isn't usually about whether bad things happened; it's about which bad things count as "collapse." You are correct that variables come apart. Population might stay stable while literacy vanishes. Trade networks might shrink while local farming intensifies. This isn't sloppy thinking; it's because "society" is doing two different jobs in these definitions.

  *   **Definition A (Political/Elite):** Collapse is the failure of the central authority. The palace burns, the tax collectors stop coming, the law code is no longer enforced. By this metric, if the mill closes and the union dissolves and the town charter is revoked, you have collapse, even if everyone survives.
  *   **Definition B (Demographic/Welfare):** Collapse is a sustained loss of human well-being. Famine, disease, population decline. By this metric, if the mill closes but people find other work and live longer because the air is cleaner, you do *not* have collapse.

  Most academic usage leans toward Definition A. They are tracking the loss of **socio-political complexity**. The measurable variable is usually **energy capture and distribution**. Can the center still mobilize labor? Can it move grain from surplus zones to deficit zones? Can it enforce hierarchy?

  When pottery styles change but population stays steady, archaeologists argue over whether that's "collapse" or just "cultural shift." The verdict depends on whether you think the pottery style was mandated by a central authority (collapse if it stops) or just a fashion choice (no collapse).

  **For your novel:** If you define collapse as the loss of the central organizing principle (the mill), then the book is a collapse story regardless of whether people starve. If you define it as human suffering, it might not be. The experts disagree on which definition matters because political scientists care about institutions and anthropologists care about people. You need to pick which loss counts as the "end of the world."

  ### 2. The complexity/diminishing-returns argument

  You mentioned Tainter. The jacket copy simplifies him into "complexity kills." The actual argument is economic.

  Societies solve problems by adding layers. A flood happens? You add an irrigation department. Bandits appear? You add a standing army. Each layer costs energy (taxes, labor, resources). Initially, the return on investment is high (the army stops the bandits). Eventually, you hit diminishing returns. The army is so big it eats all the grain, but the bandits are still there. The society becomes brittle. It costs too much to stay the same.

  Collapse, in this view, is a **rapid simplification**. It is the society shedding the layers it can no longer afford.

  **Does this turn collapse into success?**
  Not exactly "success," but it removes the moral judgment of "failure." It reframes collapse as a **correction**.
  *   **The Elite View:** It is a catastrophe. They lose their power, their monuments, their status.
  *   **The Commoner View:** It is often an improvement. If the palace collapses, the peasant stops paying tax. If the mill closes, the worker stops breathing paper dust.

  Scholars take this seriously, but it is contested. The critique is that it assumes collapse is *peaceful* simplification. Often, it is violent. When the center loses the monopoly on force, warlords emerge. The "rational simplification" might involve a lot of stabbing.

  **For your novel:** This framework suggests the mill's closure is economically inevitable, not a moral failing of the workers or owners. It validates the "aftermath" section not as a tragedy, but as a recalibration. If you use this lens, the book isn't about why they failed; it's about why the cost of staying open became too high.

  ### 3. The resilience people

  Your historian friend is describing **Panarchy** or the **Adaptive Cycle**. The model is: Growth -> Conservation (rigidity) -> Release (collapse) -> Reorganization.

  They argue that "collapse" is just the "Release" phase. It looks like destruction from the inside, but it releases locked-up resources (capital, labor, land) for the "Reorganization" phase. A forest fire is a collapse for the trees, but it clears the brush for new growth.

  **Is this unfalsifiable?**
  It risks being tautological. If everything eventually reorganizes, then "collapse" is just a name for "change." However, the substantive claim is about **memory and connectivity**.
  *   **False Claim:** "Everything bounces back exactly the same." (This is falsifiable and often false).
  *   **Real Claim:** "Systems never truly end; they transform into different systems with different rules."

  The value of this framework is that it denies the finality of "The End." It says the aftermath is not a coda; it is a new growth phase. The critique is that it can minimize the trauma of the Release phase. Telling a drowning man he is part of a water cycle is technically true but emotionally unhelpful.

  **For your novel:** This framework gives ownership to the **town itself**, not the people. The people are transient; the town cycles. If you adopt this, the POV should shift in the last third to show the new things growing in the rubble (the casino, the highway), not just the grief over the old things. It validates the diner owner's perspective as much as the union rep's.

  ### 4. This is the one I actually need

  Can collapse be relative? **Yes.**

  Is it like *winning* (subjective) or *extinction* (objective)? **It is objective loss of capacity, but subjective loss of value.**

  Here is the agent-neutral fact underneath: **Loss of Coordination Capacity.**
  When a society collapses, it loses the ability to do things that require large-scale cooperation. It cannot build monuments, maintain standing armies, or sustain long-distance trade. That is objectively measurable. The mill closes; the town cannot coordinate to build another one.

  However, whether that loss *matters* depends on where you sit in the hierarchy.
  *   **The Union Rep:** Their identity and security are tied to the coordination capacity. Loss of the mill = loss of self. For them, it is extinction.
  *   **The Diner Owner:** Their identity is tied to service and adaptability. The mill constrained them (only day shift, only workers). The collapse removes the constraint. For them, it is liberation.

  **Is there a difference between collapse, conquest, and boredom?**
  *   **Collapse:** Internal fragmentation. The center cannot hold. (The mill goes bankrupt).
  *   **Conquest:** External replacement. The center holds, but someone else sits in the chair. (A foreign company buys the mill and strips it).
  *   **Boredom (Stasis):** The center holds, but nothing changes. High stability, low innovation.

  **The Verdict for your POV:**
  Both characters are right. The objective fact is the mill is gone (collapse of complexity). The subjective fact is split.
  *   If you want the book to be a **tragedy**, the POV belongs to the Union Rep. The loss of coordination is the loss of meaning.
  *   If you want the book to be a **transformation**, the POV belongs to the Diner Owner. The loss of coordination is the removal of a bottleneck.
  *   If you want the book to be **historical**, the POV belongs to neither. It belongs to the gap between them.

  Most modern scholarship leans toward the idea that "collapse" is a pejorative term imposed by the losers (the elite) onto a process that might be neutral or even beneficial for the majority. If you write it as a pure tragedy, you are implicitly siding with the institution over the people. If you write it as pure liberation, you are ignoring the trauma of lost community. The tension *is* the story. Don't resolve it. Let the Union Rep be right about the loss, and the Diner Owner be right about the gain.

  ### 5. The evidence wrinkle

  Does the silence of the record infect the concept? **Yes.**

  Collapse is often defined by the loss of the very mechanisms that create records.
  *   **Palace Societies:** Keep tablets. Palace burns -> tablets stop -> we see "dark age."
  *   **Post-Collapse Societies:** Don't keep tablets. Life continues -> no records -> we see "nothing."

  This isn't just an epistemic limitation we can fix with better archaeology. It is a structural feature. When complexity drops, literacy is often one of the first things shed because it is expensive and specialized.

  **Is writing nothing down dishonest?**
  No. It is historically accurate for a simplification phase.
  In a high-complexity phase (the mill operating), people write things down: contracts, union logs, shift schedules, diaries.
  In a low-complexity phase (the aftermath), oral culture returns. Deals are handshake agreements. History is memory.

  If your third section has less text, fewer documents, more gaps, you are not being dishonest; you are mimicking the socio-economic reality of the period. A "dark age" in a novel should feel darker, quieter, and more fragmented.

  **The Trap:** Do not mistake silence for emptiness. The archaeology shows that "dark ages" often have vibrant local cultures, just not *monumental* ones. Your characters shouldn't be empty; they should be focused on immediate survival and local connection rather than legacy and record-keeping.

  ### Summary for the Novel

  You are stuck because you are trying to find an objective definition for a phenomenon that is objectively structural but subjectively experienced.

  1.  **The Event:** The mill closing is an objective loss of complexity (Tainter).
  2.  **The Experience:** It is a trauma for the hierarchy (Union Rep) and an opportunity for the adaptable (Diner Owner) (Relativity).
  3.  **The Shape:** It is not an end, but a phase change (Resilience).
  4.  **The Record:** The silence in the last third is a feature, not a bug. It signals the shift from institutional memory to personal memory.

  **Whose point of view does the book belong to?**
  If you define collapse as **loss**, it belongs to the Union Rep.
  If you define collapse as **change**, it belongs to the Town.
  If you define collapse as **lie**, it belongs to the Diner Owner.

  The academics say "it's contested" because all three are true simultaneously. The book works best if it refuses to pick one. Let the Union Rep mourn the complexity. Let the Diner Owner exploit the simplification. Let the silence of the text prove them both right.
