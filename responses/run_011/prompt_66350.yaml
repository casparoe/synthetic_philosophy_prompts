      *Ready to write.*
answer: |-
  (a) **Mark: 82/100**
  This answer sits in the high Distinction band; the placement is governed by the exceptional clarity of the diagnosis in the first half, which is partially offset by a significant tension between the proposed solution and the concluding remarks on dirty hands.

  (b) **Paragraph-by-Paragraph Assessment**

  *   **Paragraph 1:** **Right.** The candidate accurately states the paradox (often associated with Scheffler), correctly identifying the tension between the norm's content (killings are bad) and the restriction's structure (do not minimize killings). The militia example is standard but effectively deployed.
  *   **Paragraph 2:** **Right.** This is a strong philosophical distinction. The candidate correctly identifies that the paradox is an internal critique regarding the *rationale* for the norm, not merely an external clash of first principles. This demonstrates a secure grasp of the "architecture" aspect of the course.
  *   **Paragraph 3:** **Right.** The taxonomy of responses (agent-relative value, non-maximizing rationality, threshold) is standard and accurate. No errors here.
  *   **Paragraph 4:** **Partly Right.** The critique of agent-relative value is defensible but perhaps too swift; sophisticated accounts (e.g., Quinn) argue it is not mere relabeling but a structural claim about rationality. The critique of threshold deontology is sound. The assessment of non-maximizing rationality is fair but notes it requires further work.
  *   **Paragraph 5:** **Partly Right.** The claim that the paradox only threatens deontologists who justify restrictions by consequences is controversial. Many Kantians deny consequentialist justification yet still face the question of why rational agency forbids minimizing violations of agency. However, as a dialectical move to clear space for the candidate's own view, it is understandable.
  *   **Paragraph 6:** **Partly Right.** The "custodianship" proposal is philosophically interesting but risks circularity. It asserts that badness does not sum across jurisdictions, which is the conclusion required to solve the paradox, rather than an argument for why it does not sum. It functions more as a metaphor for agent-relativity than a distinct justification.
  *   **Paragraph 7:** **Wrong.** There is a coherence problem here. The candidate previously criticized threshold deontology (Para 4) and suggested custodianship forbids violation ("my shooting... would not be a way of settling it"). Yet here, the candidate discusses an agent who "must violate a restriction." This reintroduces the threshold view the candidate earlier rejected as arbitrary, creating a tension in the final position.

  (c) **Consequential Problems**

  1.  **Inconsistency between Custodianship and Dirty Hands (Ranked 1):** In Paragraph 6, the custodianship account suggests violations are category mistakes (implying absolutism: do not shoot). In Paragraph 7, the candidate discusses agents who "must violate a restriction" (implying threshold/permissibility). This is a fundamental contradiction in the proposed solution. It matters because it leaves the reader unsure whether the candidate's deontology is absolute or threshold, which determines whether the paradox is dissolved (absolutism) or managed (threshold).
  2.  **Circularity in the Jurisdictional Claim (Ranked 2):** The candidate argues the paradox dissolves because "badness of this kind [does not] sum." However, the paradox arises precisely because the consequentialist challenges *why* it shouldn't sum if the goal is reducing badness. Asserting that jurisdictions prevent summing restates the deontological intuition without justifying it against the paradox's internal pressure. This matters because it leaves the "justification" requirement of the prompt only partially met.
  3.  **The "Foundational" Exemption (Ranked 3):** In Paragraph 5, the candidate claims foundational deontologists are "untouched" by the paradox. This is debatable; even if a norm is foundational, the paradox challenges the *rationality* of adhering to it when adherence increases the total occurrence of the forbidden state. Dismissing this too quickly weakens the motivation for the custodianship account.

  (d) **Verdict on the Custodianship Proposal**

  The proposal is primarily a **re-description** of the restriction in jurisdictional vocabulary rather than a substantive advance on the appeal to agent-relative reasons. It effectively renames "agent-centered restrictions" as "jurisdictions over agency." To do the work the candidate asks of it (dissolving the paradox), the proposal would have to establish *why* moral jurisdiction is structured this way without appealing to the very value (minimizing badness) that generates the paradox. For instance, it would need to ground jurisdiction in a conception of personhood or rationality that makes aggregation conceptually impossible, not just morally forbidden. The response does not discharge this burden; it asserts the impossibility of aggregation ("the whole point... is that it is not so available") rather than arguing for it. Consequently, it dissolves the paradox only for those already willing to accept the jurisdictional premise.

  (e) **Assessment of the Dirty Hands Alignment**

  The alignment **does not fully hold** and costs the argument coherence. The "dirty hands" problem typically arises when an agent *permissibly* or *necessarily* violates a moral norm for the greater good, incurring a moral remainder (guilt/blame). This presupposes a threshold view (consequences can override restrictions). However, the candidate's custodianship account in Paragraph 6 implies an absolutist view (violations are category mistakes, not tragic necessities). By aligning with dirty hands in the final paragraph, the candidate inadvertently concedes that consequences *can* override restrictions, which validates the threshold model they explicitly rejected in Paragraph 4. The answer gains rhetorical depth by invoking dirty hands but loses logical consistency regarding the status of the restriction.

  (f) **Marginal Comments**

  1.  *Beside "The restriction therefore forbids me to minimize violations of the very norm it exists to protect.":* "Precise formulation. Note that 'exists to protect' is the hinge—if the norm doesn't exist to protect, does the paradox vanish?"
  2.  *Beside "Either the agent-relative value in question is simply the restriction described in the vocabulary of value...":* "This is the standard 'collapse' objection. Consider whether Quinn's 'actions as ends' avoids this relabeling charge."
  3.  *Beside "What dissolves the paradox is not the denial that killings are bad but the denial that badness of this kind sums.":* "This is the crux. But why doesn't it sum? You assert this as a feature of the jurisdictional picture, but the paradox challenges whether that picture is coherent."
  4.  *Beside "an agent who must violate a restriction to prevent catastrophe...":* "Wait—earlier you criticized threshold deontology for arbitrariness. Does custodianship allow violation? If so, how is it different from threshold? If not, 'must violate' is incorrect."
  5.  *Beside "The custodianship account explains why the threshold theorist's stipulation feels arbitrary":* "Strong insight, but only if custodianship itself isn't arbitrary. Why is agency the jurisdiction rather than, say, my immediate causal sphere?"
