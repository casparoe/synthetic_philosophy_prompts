      *Tie-breaker observation:* "Do they gain market share by being first, even if unsafe?" (Arms Race) vs "Do they just fear the other guy getting there first?" (PD).
      *I will build this nuance into the Q3 for Yes/Insiders.*

      *Self-Correction on Case 2 (Fishery):* It looks like ToC but is Ostrom. The tree must distinguish via "Informal Enforcement."
      *Self-Correction on Case 3 (Software):* Lock-in. High Cost, Outsiders (Customers), No Resource, Switching difficulty.
      *Self-Correction on Case 4 (Housing):* Landlords. High Cost (rent loss), Outsiders (Tenants), Resource (Housing), No Enforcement. -> ToC.

      *Wait, one detail on Case 4:* "Every landlord says they'd happily stop if the others stopped too." This sounds like Stag Hunt (Low Cost *if coordinated*). But Unilateral Cost is High. So it's a PD/ToC structure, not Stag Hunt. The *preference* is Stag Hunt-like, but the *incentive* is PD. The tree asks about *cost to move alone*, which captures the PD nature. Good.

  6.  **Final Polish:** Check tone. Keep it sharp, facilitator-ready. Ensure the "Empty Cells" are thoughtful.

      *Empty Cell Idea:* Low Cost + Insiders + Resource Depletion. (If it's low cost to stop depleting, why are we depleting? Maybe ignorance. But if we know, it's not a trap).
      *Empty Cell Idea:* High Cost + Outsiders + Trust Issue. (If harm is external, my trust in peers doesn't stop the harm to them).

