  # The Coordination Diagnostic Tree

  **Time:** 40 Minutes
  **Tool:** Whiteboard
  **Goal:** Move from "This feels like Moloch" to "This is a [Specific Trap] requiring [Specific Fix]."

  Draw the tree below. At each node, ask the group to answer based *only* on the plain-language description of the situation. Do not allow game-theory jargon until you reach the leaf.

  ---

  ## The Tree

  ### **Node 1: The Unilateral Exit Test**
  **Question:** "If one participant stopped doing the 'bad thing' tomorrow, would they immediately lose money, status, or safety relative to those who keep going?"
  *   **YES (Costly to be good):** Go to **Node 2**.
  *   **NO (Safe to be good):** Go to **Node 5**.

  ### **Node 2: The Victim Test**
  **Question:** "Who suffers the most from the current outcome?"
  *   **The Decision Makers (Insiders):** Go to **Node 3**.
  *   **Outsiders / Bystanders:** Go to **Node 4**.

  ### **Node 3: The Motive Test (Insiders)**
  **Question:** "Are participants doing this to *win a ranking* (first place, top spot), or just to *avoid losing* (bankruptcy, irrelevance)?"
  *   **To Win Ranking:** ➔ **Leaf A: Positional Arms Race**
  *   **To Avoid Losing:** ➔ **Leaf B: Prisoner's Dilemma**

  ### **Node 4: The Resource Test (Outsiders)**
  **Question:** "Is the harm caused by depleting a finite shared resource (fish, air, housing)?"
  *   **YES:** Go to **Node 4b**.
  *   **NO:** ➔ **Leaf C: Switching-cost Lock-in**

  ### **Node 4b: The Governance Test**
  **Question:** "Is there an informal system of rules, shaming, or monitoring already in place?"
  *   **NO:** ➔ **Leaf D: Tragedy of the Commons**
  *   **YES:** ➔ **Leaf E: Ostrom-governable Commons**

  ### **Node 5: The Victim Test (Low Cost)**
  **Question:** "Who suffers the most from the current outcome?"
  *   **The Decision Makers (Insiders):** Go to **Node 6**.
  *   **Outsiders / Bystanders:** ➔ **Leaf F: Pure Externality**

  ### **Node 6: The Barrier Test (Low Cost / Insiders)**
  **Question:** "Is the main barrier to stopping a lack of *trust* in others, or a *measurement system* that rewards the bad behavior?"
  *   **Lack of Trust:** ➔ **Leaf G: Assurance / Stag Hunt**
  *   **Measurement System:** ➔ **Leaf H: Goodhart-style Measurement Trap**

  ---

  ## The Leaves (Diagnosis Card)

  Write these on the right side of the board as you reach them.

  | Leaf | Name | Structural Definition | The "Tell" (Concrete Observation) | Characteristic Policy Blunder |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Positional Arms Race** | Actors incur costs to improve relative rank, cancelling out absolute gains. | **Tell:** Spending increases for everyone, but market shares/rankings stay the same. | **Blunder:** Trying to ban the spending (actors will just hide it); requires capping the *reward* for winning. |
  | **B** | **Prisoner's Dilemma** | Individual incentive to defect outweighs mutual benefit of cooperation, regardless of rank. | **Tell:** Private communications reveal actors wish they could stop, but fear being undercut. | **Blunder:** Applying "trust-building" (Stag Hunt fixes) instead of enforceable contracts/verification. |
  | **C** | **Switching-cost Lock-in** | Actors are trapped by technical or contractual friction, not strategic competition. | **Tell:** A vendor offers a "clean" version, but customers cannot migrate without breaking their workflow. | **Blunder:** Antitrust/competition policy (the market isn't competitive, it's sticky); needs interoperability standards. |
  | **D** | **Tragedy of the Commons** | Unregulated access to a rivalrous resource leads to depletion. | **Tell:** Resource stock (fish, water, rent stability) is measurably declining year-over-year. | **Blunder:** Privatization (often impossible for air/water); needs quota or access limits. |
  | **E** | **Ostrom-governable Commons** | A commons that *looks* tragic but is stabilized by local norms/enforcement. | **Tell:** Resource stock is stable despite open access; outsiders are excluded or shamed. | **Blunder:** Imposing top-down state regulation (destroys the fragile local trust network). |
  | **F** | **Pure Externality** | Actors ignore costs they do not bear; no race or depletion involved. | **Tell:** Actors could fix the harm cheaply but simply don't; no fear of competitors. | **Blunder:** Coordination workshops (they don't need to coordinate, they need a tax/fine). |
  | **G** | **Assurance / Stag Hunt** | Everyone prefers cooperation but won't move without guarantee others will too. | **Tell:** If a sub-group coordinates publicly, others immediately join (cascade effect). | **Blunder:** Punishment/Enforcement (PD fixes); this needs *focal points* and public signaling. |
  | **H** | **Goodhart Trap** | Optimization of a proxy metric destroys the actual goal. | **Tell:** Metrics improve (test scores, uptime) while actual quality (learning, reliability) falls. | **Blunder:** Adding more metrics (complicates the trap); needs qualitative evaluation or random auditing. |

  ---

  ## Limits & Empty Cells

  **1. The Ambiguous Pair: Arms Race vs. Prisoner's Dilemma**
  *   **The Problem:** In high-stakes scenarios (like AI), "winning" (Arms Race) and "not dying" (PD) look identical. Both show high unilateral cost and internal harm.
  *   **The Tie-Breaker:** Ask: *"If you could verify your rival was slowing down, would you also slow down?"*
      *   If **Yes**: It's a **Prisoner's Dilemma** (you want safety, not victory).
      *   If **No**: It's an **Arms Race** (you want to win, safety is secondary).
  *   **Why it matters:** PD solutions focus on *verification treaties*. Arms Race solutions focus on *capping the prize*.

  **2. Empty Cell: Low Cost + Outsider Harm + Resource Depletion**
  *   **Combination:** Node 5 (Safe to stop) + Node 4 (Outsiders) + Node 4b (Resource).
  *   **Status:** **Incoherent.**
  *   **Reason:** If it is safe for individuals to stop depleting a resource, and the harm is only to outsiders, rational actors would stop unless there is a hidden cost (making it High Cost) or a measurement failure (Goodhart). If it's truly low-cost, the depletion should self-correct unless the actors are malicious (Pure Externality), but resource depletion implies a structural incentive to take *now*.

  **3. Empty Cell: High Cost + Insider Harm + Governance**
  *   **Combination:** Node 2 (Insiders) + Node 4b (Governance exists).
  *   **Status:** **Self-Unstable.**
  *   **Reason:** If the harm is internal to the group and governance exists, the group should use governance to stop the harm. If they don't, either the harm isn't actually internal (it's External) or the governance is fake (back to PD/ToC). This cell usually collapses into **Ostrom** (if harm is external) or **Stag Hunt** (if cost is actually low).

  ---

  ## Test Case Walkthrough

  Here is how the tree handles your four specific scenarios.

  ### **Case 1: The AI Safety Race**
  *   **Description:** Three labs. Catastrophe risk. Second place is worse than unsafe first place. Safety spending is unverifiable.
  *   **Path:**
      1.  **Unilateral Exit?** **YES.** (If I slow down for safety, I come second. "Coming second is worse.")
      2.  **Victim?** **INSIDERS.** (Catastrophe kills everyone, including the labs.)
      3.  **Motive?** **AMBIGUOUS.** (Do they want to *win* or *survive*?)
  *   **Diagnosis:** **Ambiguous between Positional Arms Race (A) and Prisoner's Dilemma (B).**
  *   **Tie-Breaking Observation:** Check the incentive structure. Do investors reward *speed* regardless of safety?
      *   If investors reward **Speed/Firstness**: It is an **Arms Race**. (Fix: Cap the reward).
      *   If investors reward **Survival/Product** but fear competitors cutting corners: It is a **Prisoner's Dilemma**. (Fix: Verification treaty).
      *   *Note:* Most rationalist analysis suggests it is a PD masquerading as an Arms Race. The tree forces you to distinguish them.

  ### **Case 2: The Coastal Fishery**
  *   **Description:** Boats individually owned. Skippers' association allocates grounds/limits. Stock is stable.
  *   **Path:**
      1.  **Unilateral Exit?** **YES.** (If I fish illegally, I gain short term, but risk ban. If I stop fishing, I lose income. But the prompt implies the *trap* is the description "Textbook Tragedy". Let's assume the "bad thing" is overfishing. Can I unilaterally overfish? Yes. Is it costly to *not* overfish? Yes, relative to cheaters.) -> **High Cost.**
      2.  **Victim?** **OUTSIDERS.** (The stock/environment/public).
      3.  **Resource?** **YES.** (Fish).
      4.  **Governance?** **YES.** ("Association... allocating grounds... limits").
  *   **Diagnosis:** **Leaf E: Ostrom-governable Commons.**
  *   **Insight:** The tree correctly identifies this is *not* a failure. The policy blunder to avoid is imposing external state regulation which might break the local trust.

  ### **Case 3: Enterprise Software Bloat**
  *   **Description:** Vendors bundle telemetry/AI. Customers hate it. Churn low (migration miserable). Vendors won't strip features.
  *   **Path:**
      1.  **Unilateral Exit?** **YES.** (If a vendor strips features, they lose "competitiveness" or break integrations. High cost to be "clean".)
      2.  **Victim?** **OUTSIDERS.** (The *Customers* suffer the bloat. The *Vendors* are the decision makers and are fine.)
      3.  **Resource?** **NO.** (Software features are not a finite depleting resource like fish).
  *   **Diagnosis:** **Leaf C: Switching-cost Lock-in.**
  *   **Insight:** This is not a race (PD) and not a commons (ToC). It is a structural trap. The "Policy Blunder" warning tells you not to try to get vendors to "coordinate" on less bloat; they have no incentive. You need interoperability standards to lower switching costs.

  ### **Case 4: The Housing Short-Term Let Race**
  *   **Description:** Landlords convert to short-term. Rents climb. Residents pushed out. Landlords say "I'd stop if others stopped."
  *   **Path:**
      1.  **Unilateral Exit?** **YES.** (If I stop converting, I make less rent than my neighbor who does. Costly to be good.)
      2.  **Victim?** **OUTSIDERS.** (Longtime residents/tenants. Landlords make *more* money, residents pay the cost.)
      3.  **Resource?** **YES.** (Housing stock is finite/rivalrous).
      4.  **Governance?** **NO.** ("If the others stopped too" implies no enforcement exists).
  *   **Diagnosis:** **Leaf D: Tragedy of the Commons.**
  *   **Insight:** Even though landlords say "I'd stop if...", the unilateral cost is high, making it a ToC, not a Stag Hunt. The "tell" is the declining stock of long-term units. The fix is quotas/limits (ToC fix), not just asking for trust (Stag Hunt fix).

  ---

  ## Facilitator Notes for the Whiteboard

  1.  **Start with the Input:** Remind the group that "Everyone is sad" is the *starting point*, not the diagnosis. The tree ignores sadness.
  2.  **Enforce the Splits:** If someone argues at Node 1 ("Well, it depends..."), force a binary choice based on the *dominant* incentive. Ambiguity at Node 1 usually means you haven't defined the "Players" correctly.
  3.  **The "Moloch" Check:** If the group tries to label something "Moloch," ask them to walk the tree. If it lands on **Prisoner's Dilemma** or **Arms Race**, allow it. If it lands on **Lock-in** or **Externality**, forbid the word "Moloch"—it's the wrong tool.
  4.  **Case 1 Discussion:** Spend the most time here. This is where the tree pays for itself. Use the "Tie-Breaker" question to show why "Verification" (PD fix) and "Prize Caps" (Arms Race fix) are different interventions.
