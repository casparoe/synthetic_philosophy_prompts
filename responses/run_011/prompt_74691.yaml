  ### 1. The Conflicts (Ranked by Severity)

  **Rank 1: The Fraud Paradox (#2 vs. #3)**
  *   **The Conflict:** This is a direct logical contradiction. In #2, you define materiality purely subjectively ("indexed to what the person consenting actually cares about"). In #3, you explicitly override this: the woman *cares* about the man's wealth and status ("exactly what she cared about most"), yet you say her consent stands. Meanwhile, the patient might not care about the clinical necessity, yet the doctor's lie voids consent.
  *   **Why it's fatal:** #2 claims to be the rule for all lies; #3 creates an exception that violates the rule of #2. An opponent will simply read #2, then read #3, and ask: "So is materiality subjective or isn't it?"
  *   **Severity:** Critical. This undermines your definition of "Informed" in #1.

  **Rank 2: The Sovereignty Split (#9 vs. #10 + #8)**
  *   **The Conflict:** #9 grants sovereignty to the *Past Self* (advance directives bind the demented future self). #10 grants sovereignty to the *Present Self* (refusal trumps authorization). The conflict arises in the gap: Does #10 apply to the demented person in #9?
      *   If #10 applies to *any* present refusal, the demented person can veto their advance directive, rendering #9 useless.
      *   If #10 applies only to *competent* refusals, it aligns with #8, but you haven't stated that limitation.
  *   **Why it's fatal:** Without a competence qualifier in #10, you have two absolute rules ("Always binds" vs. "Always trumps") that collide in the exact scenario #9 describes.
  *   **Severity:** High. This is a coherence failure in your theory of personal identity over time.

  **Rank 3: The Threshold Problem (#6 vs. #7)**
  *   **The Conflict:** You suspect these don't fit. Actually, they *do* fit, but only if you introduce a concept you haven't written down: **The Threshold.**
  *   **Why it's manageable:** Legal and moral systems routinely map continuous inputs (degrees of voluntariness) to binary outputs (valid/invalid) via a cutoff point. The conflict is only a problem if you claim there is a *natural* bright line in reality (#6 says there isn't) while claiming the binary is natural (#7).
  *   **Severity:** Low. This is a "Sorites Paradox" issue, not a logical contradiction. It's a feature of almost all legal theory.

  **Rank 4: The Paternalism Loop (#11 vs. #1 & #5)**
  *   **The Conflict:** You claim anti-paternalism (#11), but your exception (cannot destroy future capacity) is paternalistic. Furthermore, #5 admits you can override "valid" consent via remedies (price caps) when desperation is involved.
  *   **Why it's manageable:** You acknowledge the tension in #11. The real issue is that #5 and #11 are both doing the same work: creating safety valves for your anti-paternalism.
  *   **Severity:** Moderate. It's theoretically messy but practically defensible.

  ---

  ### 2. Repairs and Costs

  **For Rank 1 (#2 vs. #3): The "Constitutive Facts" Repair**
  *   **The Repair:** Modify #2 to specify that materiality is subjective *regarding circumstances*, but that lies about the **constitutive nature of the act** void consent objectively.
  *   **The Cost:** You lose the elegance of a purely subjective theory of information. You must admit there is an objective list of "what this act is" that the consenter cannot waive ignorance on.
  *   **Why do it:** It saves #2 from being falsified by #3. It clarifies that fraud in the *factum* (what the act is) is different from fraud in the *inducement* (why you did it).

  **For Rank 2 (#9 vs. #10): The "Competence Gate" Repair**
  *   **The Repair:** Add a competence qualifier to #10: "A **competent** refusal expressed right now always trumps..."
  *   **The Cost:** You lose the ability to protect the *currently demented* person from their past self if they develop a new, demented preference. The past self's directive stands against the demented present self's refusal.
  *   **Why do it:** It aligns #10 with #8 (competence is time-specific) and prevents #10 from cannibalizing #9. It clarifies that sovereignty shifts to the present self only when the present self is capable of holding it.

  **For Rank 3 (#6 vs. #7): The "Burden of Proof" Repair**
  *   **The Repair:** Explicitly state that while voluntariness is a spectrum, validity is determined by whether the burden of proof for coercion has been met.
  *   **The Cost:** You admit the binary line is pragmatic/legalistic, not metaphysical.
  *   **Why do it:** It disarms the "slippery slope" argument. You aren't denying the spectrum; you're denying the *legal utility* of the spectrum.

  ---

  ### 3. The Single Change That Fixes the Most

  **Modify #2 (The Materiality of Lies).**

  **Why:**
  The definition of "Informed" in #1 is the foundation of your entire package. If #2 is logically contradicted by #3, your foundation is cracked. By refining #2 to distinguish between **facts about the world** (subjective materiality) and **facts about the interaction** (objective materiality), you resolve the #2/#3 conflict.

  **Bonus Fix:** This change also indirectly stabilizes #11. If you cannot consent to destroy your future capacity, that is arguably a lie about the "constitutive nature" of the act (e.g., "This contract is reversible" when it is not). It creates a unified theory of what counts as "Informed."

  *(Note: While fixing #10 is crucial for bioethics, fixing #2 is crucial for the general theory of consent, which is the broader scope of your workshop.)*

  ---

  ### 4. Covert Work (Smuggled Commitments)

  You asked if any items are doing covert work for others. Yes, two major ones:

  **1. #3 is smuggling a limit into #2.**
  #3 looks like an independent commitment about medical vs. dating ethics. In reality, it is a **constraint on #2**. You cannot maintain #2 (purely subjective materiality) without #3 acting as a firewall. #3 is not a separate belief; it is the necessary exception that keeps #2 from collapsing.
  *   *Audit Tip:* Don't defend them as separate points. Defend #3 as the "boundary condition" for #2.

  **2. #10 is smuggling #8 (Competence).**
  #10 ("Refusal... trumps") looks like a commitment to Current Autonomy. But it only works if the refuser is competent. If you allow an incompetent refusal to trump a past competent authorization, you are prioritizing *biological existence* over *autonomy*. If you require competence, you are prioritizing *autonomy*.
  *   *Audit Tip:* Your opponents will try to trap you with the demented patient who screams "No" while reaching for food. If you haven't linked #10 to #8 explicitly, you will be forced to choose between protecting the patient's welfare (#9) or their "will" (#10). Link them now.

  **3. #5 is propping up #4.**
  #4 draws a bright line between Threats (void consent) and Hard Bargains (valid consent). #5 admits Hard Bargains are still wrongful. #5 is doing the moral work that #4 tries to do legally. Without #5, #4 looks like it endorses exploitation. #5 is the moral safety valve that allows #4 to remain legally strict.
  *   *Audit Tip:* Present #4 and #5 as a pair: "Valid but Voidable." This prevents opponents from accusing you of endorsing exploitation in #4.

  ### Summary Recommendation for the Workshop
  1.  **Rewrite #2** to exclude "constitutive facts" from subjective materiality.
  2.  **Rewrite #10** to specify "competent refusal."
  3.  **Group #4 and #5** as a "Valid but Exploitative" category to avoid accusations of endorsing usury.
  4.  **Tell them #6 and #7 are compatible** via a threshold model; don't let them spend time on a false conflict.

  This package is 90% there. The remaining 10% is tightening the definitions so the logic holds under pressure. Good luck.
