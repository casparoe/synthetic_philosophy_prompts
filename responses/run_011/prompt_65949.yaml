answer: |-
  **Project Title:** The Algebra Relativity Problem for Accuracy-First Epistemology

  **Statement of the Question**
  The accuracy-first program in formal epistemology seeks to derive normative constraints on belief—such as Probabilism and Conditionalization—from the fundamental epistemic goal of maximizing accuracy. The central thesis is that a credal state is rational to the extent that it minimizes expected inaccuracy. However, accuracy is not a monadic property of a credence; it is a relation between a credence, a truth-value, and a specific algebra of propositions over which the credence is defined. Standard derivations of epistemic norms assume a fixed algebra. My project addresses a structural vulnerability in this setup: the choice of algebra appears to be a notational convenience rather than a normative fact.

  The core question is: **Are accuracy-first norms invariant under algebraic refinement?** If an agent's credal state satisfies Probabilism relative to a coarse partition of logical space but violates it relative to a finer, equally legitimate partition, the normative force of the accuracy argument is compromised. Rationality would become relative to the epistemologist's arbitrary choice of how to carve up propositions. This project investigates whether the standard constraints on inaccuracy measures are sufficient to block this relativity, or whether the accuracy-first program requires a substantive, yet currently missing, principle of algebraic selection.

  **Context and Gap**
  Proponents of the accuracy-first program have successfully demonstrated that if an agent's inaccuracy is measured by a strictly proper scoring rule, they ought to satisfy the probability axioms. Furthermore, updating by Conditionalization minimizes expected inaccuracy relative to prior credences. These results are mathematically robust within a fixed framework. Stock objections to the program typically target the value of truth itself, the exclusivity of epistemic value, or the specific mathematical properties of distance measures (e.g., Bregman divergences).

  However, these objections leave the algebraic relativity problem open. Debates regarding the form of the inaccuracy measure presuppose that the domain of the measure is fixed. They ask how we measure distance from the truth, but not *which* truths count toward the score. If the set of propositions is merely a modeling choice, then an agent could be deemed "rational" in one model and "irrational" in another without any change in their doxastic state or the world. Existing constraints, such as extensionality or continuity, are designed to regulate the scoring function, not the domain of propositions. There is a gap in the literature regarding whether the accuracy framework can sustain its normative claims when the granularity of the proposition space varies. This project fills that gap by testing the stability of accuracy-first theorems under algebraic refinement.

  **Methodology and Work Plan**
  The project proceeds by constructing concrete cases of algebraic refinement and tracking the survival of standard accuracy-first results. I will not argue abstractly about the nature of propositions but will instead model specific agents operating over varying algebras to see if normative verdicts flip.

  *   **Months 1–3: Formalization and Baseline.** I will formalize the standard accuracy-first setup, explicitly isolating the algebra as a variable parameter. I will catalog the specific constraints currently used in the literature to justify inaccuracy measures (e.g., strict propriety, differentiability) to determine which, if any, implicitly constrain the algebra.
  *   **Months 4–6: Constructing Refinement Cases.** I will generate pairs of algebras where one is a refinement of the other. For example, a coarse algebra concerning whether it will rain, and a refined algebra concerning whether it will rain and the temperature range. I will assign credences that are optimal (accuracy-minimizing) in the coarse algebra and calculate their accuracy scores in the refined algebra.
  *   **Months 7–9: Testing Normative Invariance.** I will apply the refinement cases to the two central norms: Probabilism and Conditionalization. I will determine if a credence function that is permissible in the coarse algebra becomes impermissible in the refined algebra under the same scoring rule. I will test whether imposing standard constraints on the scoring rule prevents these flips.
  *   **Months 10–12: Synthesis and Drafting.** I will analyze the results to formulate a general principle. If norms are not invariant, I will develop a dilemma for the accuracy-first proponent: either accept relativized rationality or posit a privileged algebra. I will draft the dissertation chapter and a related article for publication.

  **Methodological Justification**
  This case-based approach is superior to arguing directly about the general form of inaccuracy measures for two reasons. First, general arguments often hide assumptions about the algebra. A theorem proving that "all proper scoring rules encourage Probabilism" typically quantifies over scoring rules but holds the algebra constant. By varying the algebra while holding the rule fixed, I expose dependencies that general theorems obscure.

  Second, the threat of relativity is intuitive but difficult to formalize. Abstract arguments about the "nature of propositions" often stall on metaphysical disagreements. By working with concrete refinement cases, I can demonstrate the normative instability without needing to settle the metaphysics of propositions. If a norm fails in a specific, plausible refinement case, the burden shifts to the theorist to explain why that refinement is illegitimate, rather than me having to prove a negative about all possible algebras. This allows for a targeted critique that forces the literature to be more precise about the domain of accuracy.

  **Expected Outcomes and Criteria for Success/Failure**
  A successful result will take one of two forms. The **positive outcome** would be the identification of a constraint on inaccuracy measures or algebra selection that guarantees invariance. If I can prove that strictly proper scoring rules combined with a specific domain constraint preserve normative verdicts across refinements, the accuracy-first program is strengthened against a significant structural objection. The **negative outcome** would be a proof that standard accuracy-first norms are sensitive to algebraic granularity. This would demonstrate that rationality, within this framework, is relative to the modeling choice. This would force a revision of the program, likely requiring a new normative principle regarding which propositions agents are required to consider.

  The project would count as a **failure** only if the problem turns out to be trivially solvable by existing resources. For instance, if it becomes clear that standard definitions of "agendas" or "questions" already implicitly rule out the problematic refinements I intend to test, then the project yields no new philosophical insight. Similarly, if the construction of refinement cases proves mathematically incoherent—such that one cannot coherently compare accuracy across different algebras without changing the semantic content of the credences—the project would fail to launch. However, preliminary work suggests that cross-algebra comparison is coherent, making the risk of triviality low and the potential for significant theoretical contribution high.
