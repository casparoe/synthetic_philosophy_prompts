answer: |-
  1. If Marx condemns Case A despite the worker's satisfaction, he prioritizes objective exploitation over subjective alienation. Conversely, condemning Case B shifts the moral core to self-actualization.
  2. Claiming Case A is incoherent because structural subordination inherently alienates rescues the theory's consistency at the cost of making it immune to evidence by dismissing contrary subjective experiences as false consciousness.
  3. Contrary to the suspicion that alienation is merely about bad work, Marx defines it specifically as the loss of control over production and product due to private property, not just unpleasant labor conditions.
  4. Exploitation provides the economic mechanism of theft, but alienation explains the dehumanizing moral injury that makes exploitation objectionable beyond mere distributional unfairness.
  5. While exploitation identifies the crime, alienation carries the ultimate normative weight because it condemns capitalism for stifling human flourishing even when material needs are met.
