      *   Check Malthus's "Moral Restraint." This is crucial. It turns a mechanical theory into a moral one.
      *   Check "Right but Early." This is a Lakatosian "protective belt." Is it progressing or degenerating? I will argue it is degenerating.

  7.  **Finalizing the "One Piece of Evidence":**
      *   What is the most tempting to explain away? Usually, it's something that *looks* like a win but isn't.
