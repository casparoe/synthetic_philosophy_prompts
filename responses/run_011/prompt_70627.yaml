      *   *Constraint Check:* Did I mark where evidence runs out? (Yes, regarding RH phenomenology). Did I address the controversy? (Yes, Pinto/de Haan). Did I avoid citations? (Yes).
      *   *Philosophical Precision:* Ensure the distinction between *access* and *phenomenology* is clear in the controversy section. Ensure the mapping is explicit.
