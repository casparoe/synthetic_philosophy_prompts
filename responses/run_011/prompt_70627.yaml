          *   *Patients Exhibit:* Intermanual conflict, confabulation. Fiction has no room for *silent* agency (RH acting without LH knowing).

      *   **Section 2: The Locus vs. Indexical Distinction**
          *   *User's Hypothesis:* Locus (physical carrier) vs. Indexical (what "I" refers to).
          *   *Evaluation:* This distinction does work. In Dennett, Locus and Indexical track together (until the duplicate). In split-brain, Locus might be plural (two processing streams), but Indexical is singular (one speech stream claims "I").
          *   *Survival of Conclusions:* Dennett's conclusion that "I" is a narrative center of gravity survives. Dennett's conclusion that spatial location is puzzling dissolves. The "I" is tied to the linguistic output (LH), regardless of where the triggering impulse originated.
          *   *Nuance:* If the RH has consciousness but no "I" label, is it a person? The distinction highlights that personhood might require the *reporting* mechanism, not just the *experiencing* mechanism.

      *   **Section 3: Methodological Turn (Thought Experiment vs. Data)**
          *   *What the record shows:* Thought experiments rely on intuition pumps about *conceivability*. Data relies on *reportability*.
          *   *The Gap:* Dennett's story assumes we would *know* if we were split. Patients suggest we might not.
          *   *Narrator:* The story is about the narrator (LH interpreter). The "I" is the press secretary, not the president. The thought experiment reveals the fragility of the narrative self, not the metaphysical self.
          *   *Evidence Limits:* We cannot access RH phenomenology directly. Fiction pretends we can (Dennett talks to his brain). Reality says we can't.

      *   **Section 4: The Methodological Controversy (Last Decade)**
          *   *The Challenge:* Pinto et al. suggest unified consciousness persists. Disconnection is motor/sensory, not necessarily phenomenal.
          *   *Impact on Analysis:* If consciousness remains unified, Dennett's puzzle vanishes entirely. There is no "Where am I?" because "I" am everywhere in the skull. The split is in *access*, not *being*.
          *   *Implication:* The thought experiment fails because it assumes functional disconnection equals phenomenal fission. Reality suggests functional disconnection is compatible with phenomenal unity.

      *   **Section 5: The Wrinkle (Partial Callosotomy/Splenium)**
          *   *Anatomy:* Splenium handles visual transfer.
          *   *Effect:* You will not have the classic tachistoscopic split. Visual field integration remains.
