  2.  **Deconstruct Dennett's "Where Am I?":**

      *   *Plot:* Dennett's brain is removed (Yorick), kept in a vat (Houston). Body (Hamlet) is radio-linked to brain. Dennett feels he is in the body. Then a duplicate brain (Hubert) is made.
      *   *Themes:* Location of self, continuity of consciousness, unity of agency, first-person authority.
      *   *Key Intuition:* The "I" follows the functional center or the narrative center, not necessarily the biological substrate, but the separation creates a puzzle of *which* one is "me."

  3.  **Deconstruct Commissurotomy/Split-Brain Data:**

      *   *Procedure:* Cutting the corpus callosum (and sometimes anterior commissure) to stop seizure spread.
      *   *Classic Findings (Sperry, Gazzaniga, et al.):* Disconnected hemispheres can process information independently. Left hemisphere (LH) speaks. Right hemisphere (RH) acts non-verbally. Confabulation (LH interpreter). Intermanual conflict.
      *   *Recent Controversy (Pinto, de Haan, etc.):* Are the hemispheres truly independent conscious agents? Or is it a disconnection of *output* rather than *consciousness*? Many patients report no subjective change. Unity of consciousness might remain intact despite disconnection.
      *   *User's Specific Case:* Partial callosotomy, splenium spared. Visual transfer remains. Less severe disconnection than classic "split-brain" cases.

  4.  **Drafting - Section by Section:**

