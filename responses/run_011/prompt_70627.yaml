          *   *Radio Link:* The Corpus Callosum (before cutting). In Dennett, the link is artificial and potentially delay-prone. In biology, it's neural and high-bandwidth. Cutting it is the surgery.
          *   *Duplicate:* No correspondent. There is no backup brain.
          *   *Fiction Assumes:* Spatial separation of processing and experience is possible without loss of unity *until* duplication occurs. It assumes a centralized "homunculus" that can be relocated.
