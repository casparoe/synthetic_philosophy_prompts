  6.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe discuss Lockean memory criteria.
      *   *Correction:* No, user said "not for a survey of the personal identity literature." Stick to Dennett and the clinical data.
      *   *Initial thought:* Focus heavily on the epilepsy aspect.
      *   *Correction:* No, focus on the philosophy of mind implications of the surgery. The epilepsy is the cause, not the subject of analysis.
      *   *Check on the "Duplicate":* Dennett's duplicate is crucial for the "two Dennetts" problem. Split-brain doesn't have a duplicate, it has a *partition*. I need to make sure this distinction is sharp. The split-brain is one system divided, not one system copied.
