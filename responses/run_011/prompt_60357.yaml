answer: |-
  ### Exam Vignette: The Vandermolen Programme (1962–1996)

  **Vellman's Dystonia and the Perfusion Hypothesis**

  In 1962, Vandermolen proposed the core hypothesis of a new research programme: Vellman's dystonia is caused by chronic under-perfusion of a specific spinal capillary bed. This hard core was built to accommodate an existing anomaly: cases clustered in high-altitude towns across two mountain ranges, though no imaging technique could yet visualize the mechanism.

  In 1968, the programme made a novel prediction: a distinctive branching pattern in retinal vessels should appear years before muscular onset. A prospective study of 400 first-degree relatives confirmed this pattern; it had not been used to construct the core, nor had anyone previously looked for it.

  Trouble arrived in 1973. The programme predicted a specific vasodilator would halt progression if given early. A large multicentre trial showed no effect. The protective belt was modified: the compound allegedly failed to reach the relevant capillaries, and a chemically close relative was predicted to work. In 1978, this second compound also failed. The belt was modified again: treatment must begin before first symptoms. The only pre-symptomatic marker was the retinal pattern, which appears in 60% of eventual patients and 8% of healthy controls. The auxiliary was testable in principle, but no trial could be run at any realistic cost.

  In 1983, the programme predicted a genetic marker. It was found, but at almost the same frequency in healthy controls. The belt grew a 'two-hit' model, which explained, after the fact, why the altitude clustering was patchy.

  *(Note for students: For parts (a) and (c) of the question below, assume the current date is late 1983. Ignore subsequent developments.)*

  ***

  ### Exam Question

  **Question 1**

  **(a)** Assess the Vandermolen programme as of 1983. Is it theoretically progressive or degenerating according to Lakatos's criteria? Specify which criteria carry weight in this specific case and which do not. (10 marks)

  **(b)** A student interlocutor argues: "The failed drug trials in 1973 and 1978 flatly refuted the core hypothesis. Lakatos's refusal to count them as refutations is merely shielding the theory from evidence." Assess this objection. (5 marks)

  **(c)** You are advising a funding body in 1983. Can Lakatos's methodology deliver a definitive verdict on whether to fund Vandermolen at this date, or only in hindsight? If it cannot decide now, what would need to be added to the criteria to make it action-guiding? (10 marks)

  ***

  ### Model Answer

  By 1983, the Vandermolen programme is degenerating, despite its early success. To classify it, we must distinguish between the hard core (perfusion causes dystonia) and the protective belt (specific capillaries, drugs, markers). Lakatos judges progress by whether theory changes lead to novel facts rather than merely accommodating known anomalies.

  The 1962 formulation accommodated the known altitude clustering; this counts as content, but not progressive content, because the data was already in hand. The 1968 retinal prediction, however, was genuinely novel. It was unlikely given the background knowledge, and its confirmation constituted a progressive problemshift. This initially secured the programme's scientific status.

  However, progress must be continuous. From 1973 to 1983, every modification was defensive. The 1973 drug failure was met with an auxiliary claim (wrong compound) that yielded no new testable content beyond the original prediction. The 1978 move was worse: claiming treatment must be pre-symptomatic relied on a marker that was too expensive to test in a trial. This renders the auxiliary ad hoc in the strongest sense: it saves the core but lacks independent testability in practice. The 1983 genetic marker was found, but its equal frequency in controls required a further 'two-hit' adjustment to explain the data post-hoc. Explaining known data (altitude clustering) after the fact is the hallmark of a degenerating shift.

  Therefore, while the 1968 success prevents the programme from being dismissed as pseudoscience outright, the sequence from 1973–1983 shows a loss of heuristic power. The belt is growing to absorb anomalies without predicting new facts.

  Regarding the interlocutor in (b), they are employing dogmatic falsificationism, which Lakatos explicitly rejects. A single anomaly (failed trial) does not refute a core because any theory can be saved by modifying the belt. Lakatos does not shield theories from evidence; he shields them from *immediate* rejection based on isolated anomalies. The issue is not whether the core can be saved, but whether saving it produces new knowledge. Here, the saves produced no new knowledge, which is why the programme is degenerating, not because it was falsified.

  For the funding body (c), Lakatos's methodology suffers from a time-lag problem. We can only definitively label a programme degenerating in hindsight, once we see that a sequence of moves failed to yield novel facts. In 1983, there is a risk that the 'two-hit' model might yet predict something new in 1984. Strict Lakatosianism cannot deliver a immediate 'stop funding' verdict without waiting for further development. To make it action-guiding, we must add a heuristic constraint: if a programme produces multiple ad hoc auxiliaries in succession without novel confirmation over a defined period (e.g., 10 years), funding should cease. Without this temporal threshold, MSRP describes history rather than guiding policy.

  ***

  ### Marking Scheme (25 Marks)

  **Allocation:**
  *   Part (a): 10 marks
  *   Part (b): 5 marks
  *   Part (c): 10 marks

  **Five Must-Hit Moves (2 marks each):**
  1.  **Distinguish Core/Belt:** Correctly identify perfusion hypothesis as core and drug/genetic claims as belt. (Part a)
  2.  **Novelty vs. Accommodation:** Identify 1968 retinal pattern as novel content, but 1962 altitude data as accommodated/pre-existing. (Part a)
  3.  **Ad Hoc Identification:** Identify 1978/1983 moves as ad hoc (lacking independent testability or novel content). (Part a)
  4.  **Refutation vs. Anomaly:** Explain that Lakatos allows anomalies provided the programme remains progressive; the objection confuses falsification with degeneration. (Part b)
  5.  **Hindsight/Time-Lag:** Acknowledge MSRP is primarily retrospective and requires an added temporal heuristic for funding decisions. (Part c)

  **Differentiators (1st vs. 2:1):**
  *   **Part (a):** A 2:1 answer will label the programme degenerating because the drugs failed. A 1st answer will argue it is degenerating because the *later moves lacked novel content*, regardless of the drug failure (anomalies are permitted).
  *   **Part (b):** A 2:1 answer will say Lakatos is "soft on falsification." A 1st answer will articulate that Lakatos shifts the unit of appraisal from single theories to sequences of theories.
  *   **Part (c):** A 2:1 answer will say "wait for more data." A 1st answer will propose a specific modification to MSRP (e.g., a time limit on degenerating shifts) to make it normative.

  **Mark Deductions (Penalties):**
  *   **(-5)** Calling the programme "falsified" or "false" (confuses Lakatos with Popper).
  *   **(-3)** Treating "degenerating" as synonymous with "false" rather than "heuristic failure."
  *   **(-3)** Judging the ad hocness of the 1978 auxiliary in isolation rather than as part of the 1973–1983 sequence.
  *   **(-5)** Writing that Lakatos is just Popper with a time-lag built in (fundamental misunderstanding).
  *   **(-2)** Including citations or references (closed book violation).

  ***

  ### Instructor Notes

  **Expected Time:**
  A strong candidate should spend **35–40 minutes** on this question. This allows 5 minutes for planning the sequence of moves and 30–35 minutes for writing. Given the 2-hour limit for three questions, this pacing is tight but manageable for a third-year student.

  **Critique of the Sketch (Lakatos Accuracy):**
  1.  **The 1978 "Unrealistic Cost" Clause:** A Lakatos specialist might object that an auxiliary testable *in principle* but not *in practice* (due to cost) occupies a grey zone. Lakatos requires independent testability. If the test is impossible for economic reasons, is it scientific? You may need to defend in the exam board that this counts as lacking independent testability for the purposes of the module.
  2.  **Single Novel Fact:** Lakatos emphasizes a *continuous* line of progress. One novel fact (1968) sustaining a programme for 15 years while other moves are degenerating is borderline. Ensure students understand that the 1968 success prevents immediate dismissal, but the *sequence* 1973–1983 determines the 1983 status.
  3.  **The 1996 Move:** The claim that the rival's enzyme is "downstream" is a classic degenerating move (absorbing rival success). While excluded from the 1983 assessment, ensure students don't use this to justify the 1983 funding decision in part (c).
