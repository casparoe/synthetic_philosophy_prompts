answer: |-
  The clipboard was always heavy, weighted with the specific gravity of paperwork that mattered less the more you signed it. Form 88-B: Post-Procedural Outcome Verification. Box A: Behavioral Consistency. Box B: Memory Retention. Box C: Subjective Report Alignment. I ticked them all, every time. Everyone did. To leave one blank would be to suggest the procedure was measurable, and the entire business model of Aethelgard Care rested on the understanding that it wasn't.

  I had audited three hundred and twelve cases in two years. Three hundred and twelve successes. Not because the patients were definitely still home behind their eyes, but because there was no universe in which they could prove they weren't. A failed procedure would look exactly like a successful one. The patient would walk out, complain about the headache, thank the staff, and go home to make dinner. If the lights had gone out inside them, if the movie screen had gone dark while the projector kept running, the projector was good enough to pretend otherwise.

  My job was theatre. I was the magician's assistant confirming the box was empty while the audience applauded the disappearance. I didn't mind. It was a clean office, good benefits, and the staff were kind. We weren't killing people. We were offering an exit ramp for those who couldn't bear the drive anymore. Chronic pain, intractable grief, the grinding weight of existence. We sold silence.

  Then David's file landed on my desk.

  He was my husband. He wasn't a case number, though the system assigned him one anyway. Aethelgard didn't make exceptions for auditors' spouses; conflict of interest waivers were just another form to sign. I watched him go into the suite on a Tuesday morning. He held my hand in the waiting room. His palm was warm, dry, familiar. He said he was scared, not of the procedure, but of what it meant to choose not to feel the fear.

  "I just want the noise to stop," he had said. "I want to be here for you, without being here for the pain."

  I signed the intake forms. I watched him walk through the double doors. I went back to my desk and waited the standard four hours for the neuro-decoupling to settle.

  When he came out, he was smiling. He walked with the ease of a man whose spine hadn't been screaming at him for a decade. He hugged me. He smelled of antiseptic and the mint gum he always chewed. He asked if I wanted to get pizza. He joked about the ugly art in the recovery lounge. He was David. He was perfectly, indistinguishably David.

  We drove home. He talked about the garden, about fixing the leaky faucet, about calling his mother on Sunday. I watched his hands on the steering wheel. They moved with precision. I watched his profile in the streetlights. The lines around his eyes crinkled when he laughed at a radio ad.

  There is a specific kind of terror that lives in the gap between what you see and what you can know. If he had come home catatonic, I would have sued. If he had come home raving, I would have hospitalized him. But he came home whole. He was a functional human being in every metric that science could touch. The only thing missing was the one thing science couldn't touch.

  At dinner, he cut his steak. He seasoned it with salt, tasted it, and nodded. "Needs a little more pepper," he said.

  "Does it taste good?" I asked.

  He paused, fork halfway to his mouth. "It tastes like steak. It tastes like dinner."

  "Does it taste *good*?" I pressed. "Do you enjoy it?"

  "I remember enjoying it," he said, and he smiled, and the smile was warm. "I know I like pepper. I know this is a good meal. I'm happy to be eating it with you."

  It was the correct answer. It was the only answer a successful procedure could produce. If he said "I feel nothing," he would be reporting a subjective state that shouldn't exist post-procedure, marking a failure. If he said "I love it," he was reporting a preference, which is behavioral. He was walking the razor's edge of perfect functionality.

  I pushed my food around my plate. I wanted to scream. I wanted to shake him and demand he tell me if anyone was home. But I knew what he would say. He would say, "I'm home, darling." He would say it with conviction. He would believe it, because his memory banks told him that was what David said.

  "Are you in pain?" I asked.

  "No," he said. "No pain."

  "Are you happy?"

  "I am content," he said. "I am relieved."

  He reached across the table and took my hand. His skin was warm. I searched his eyes for a flicker, a spark, some evidence of the ghost in the machine. There was nothing but reflection. The light from the lamp bounced off his corneas and hit my retina. That was all the physics of it.

  Later, I sat at the kitchen table with the 88-B. The pen felt heavy. Box A: Behavioral Consistency. I checked it. He walked, talked, and ate like David. Box B: Memory Retention. I checked it. He remembered our anniversary, his mother's number, the route home. Box C: Subjective Report Alignment.

  This was the box that haunted me. It required me to verify that his report of his internal state matched the expected outcome of a successful decoupling. He reported relief. He reported absence of pain. He reported contentment. That was the goal. To verify it was to admit that his report was all there was.

  I hovered the pen over the box.

  David was in the living room, watching television. I could hear the laugh track. He was laughing along with it. Was he amused? Or was he executing a script labeled *Situation: Comedy*? It didn't matter. If I loved him, did it matter? If I hugged him, would the warmth be different?

  I thought about my own hands. I looked down at them resting on the form. They were steady. I thought about the headache I had been nursing since Tuesday, a dull throb behind my eyes that no amount of ibuprofen touched. I thought about the way the silence in the house felt heavy, pressing against my eardrums. I thought about the application form I had downloaded last night, hidden in a folder on my desktop labeled *Taxes*.

  I hadn't printed it yet. I hadn't signed it.

  I looked at the checkbox for Box C. If I checked it, I was certifying that David was gone. That the man laughing in the other room was a shell. If I didn't check it, I was flagging a failure that couldn't exist, causing an investigation that would prove nothing, dragging us both through a process that would end with this same pen checking this same box.

  There was no test. There never was. That was the product. That was the promise.

  I checked the box.

  I signed my name at the bottom. *Auditor Level 4.* I dated it. I stood up and walked to the living room. David patted the couch cushion beside him. I sat down. He put his arm around me. He smelled like laundry detergent and mint.

  "Long day?" he asked.

  "Standard audit," I said.

  "Good," he said. "Glad it's done."

  He turned back to the screen. A commercial came on. He didn't look away. I looked at my hands again. They were resting on my knees. I flexed my fingers. The tendons moved under the skin. I felt the pressure of the fabric against my palms. I felt the weight of my own head on my shoulders.

  I wondered if feeling the weight meant anything. I wondered if a machine could wonder about its own weight. I wondered if the doubt I felt was the last proof of life, or just a sophisticated error-checking routine running in the dark.

  I stood up. "I'm going to finish some paperwork," I said.

  "Don't work too late," David said. He didn't look away from the screen. "I love you."

  "I know," I said.

  I went back to the kitchen. I opened the laptop. I navigated to the *Taxes* folder. I opened the file. The Aethelgard logo sat at the top of the page, clean and blue. *Elective Phenomenal Reduction.*

  I picked up the pen I had used for David's form. I held it over the signature line of my own application. The ink hovered above the paper, a tiny black dot waiting to become a mark. I listened to the television in the other room. I listened to my own breathing. I waited to feel afraid, or relieved, or anything at all.

  I lowered the pen.
