answer: |-
  **MEMORANDUM**

  **TO:** Editorial Standards Board, Editor-in-Chief
  **FROM:** [Your Name]
  **DATE:** Tuesday Evening
  **SUBJECT:** Recommendation on Groundwater Feature and AI Policy

  **RECOMMENDATION**

  I recommend we publish the groundwater feature on Monday, contingent on one specific fix: the sentence attributed to the study that our fact-checker could not locate must be removed or qualified as an inference drawn from broader literature, not a direct finding of that specific paper. This edit must be completed by Thursday noon to meet production schedules.

  I advise against a public disclosure regarding the use of AI tools in the reporting process. Our current policy requires labeling machine-written text; none of the copy was machine-written. A disclosure here would confuse readers about what actually happened without adding clarity on accuracy. Instead, we should adopt an internal protocol immediately: AI tools may be used for synthesis and search, but every claim must be traceable to the source text by a human verifier. If a human verifier cannot find the claim in the source, the claim cannot stand, regardless of how it was found.

  **CONTEXT**

  We are facing a gap in our policy, not a breach of ethics. The reporter used an AI tool to summarize forty technical papers. She did not use it to write the copy. She verified direct claims against the original texts, except for one sentence where she relied on the tool's summary because the finding matched the pattern of other papers. Our fact-checker could not find that specific finding in the source study. The reporter believes the finding is substantively true based on the wider literature, but procedurally, we cannot attribute it to a source that doesn't contain it.

  **THE EFFICIENCY ARGUMENT**

  One view on the board is that refusing these tools makes us slower and less thorough than competitors who use them. There is truth to this. If we ban AI-assisted reading, we demand a level of human bandwidth that simply doesn't exist. A reporter reading forty papers end-to-end might take weeks; using a tool to flag methods and numbers allows them to cover the scope of the science rather than just a handful of studies. If we choose "purity" over tool usage, we cost our readers coverage they would otherwise get. We would be slower, and our features would be narrower.

  However, efficiency cannot override accuracy. The tool provided speed, but it introduced a point of failure: the unverified sentence. The solution isn't to ban the tool or to ignore the error. It is to accept the efficiency gain while reinforcing the verification step. We can allow the reporter to skim forty papers using AI, provided that any claim entering the copy survives human verification. This keeps us competitive without sacrificing the baseline requirement that our attributions must be correct.

  **THE TRUST CHAIN ARGUMENT**

  The second view, supported by the union rep, is that singling out this AI link is arbitrary. Our magazine runs on readers trusting people they cannot check: the copy editor, the fact-checker, the stringer in another country. Freelancers often skim abstracts or Google key figures rather than reading every word. Why is outsourcing reading to a machine different than outsourcing it to a human stringer who also takes shortcuts?

  This is the harder question, and it requires drawing a clear line between outsourcing *labor* and outsourcing *accountability*.

  We trust a stringer or a fact-checker because they are human agents accountable to the same standards we are. If a stringer says, "I read this in the report," and we check the report and it's not there, we can question the stringer. We can retrain them or stop using them. The chain of trust holds because the link is auditable and accountable.

  An AI tool is not accountable. It cannot be questioned, retrained, or held responsible. When a reporter uses AI to read, they are outsourcing the comprehension labor, which is acceptable. But they cannot outsource the confirmation that the comprehension is accurate. The line sits at **auditability**.

  In this case, the audit failed. The fact-checker could not locate the claim. It does not matter whether the reporter missed it because they skimmed too fast, or because the AI summarized it poorly. The result is the same: the source does not support the claim. If a human stringer had sent us this copy, and we couldn't find the quote in their source, we would kill the quote. We must apply the same standard here. Singling out the AI is not arbitrary if the tool obscures the source, but in this case, the source was available and simply didn't match the claim. The failure wasn't the tool; it was the decision to let a claim stand without a traceable path to the original text.

  **POLICY IMPLICATIONS**

  To prevent this from becoming a weekly philosophy seminar, we need a rule the newsroom can apply tomorrow.

  1.  **Tool Use:** Reporters may use AI to summarize, search, or synthesize source material. This is treated like using a search engine or a research assistant.
  2.  **Verification:** Any factual claim derived from that process must be locatable in the original source by a human fact-checker.
  3.  **The Line:** If a human verifier cannot find the claim in the source text, the claim is removed. It does not matter if the AI said it was there, or if the reporter believes it fits the pattern. Attribution requires evidence in the record.

  This distinguishes "outsourcing reading" (acceptable labor saving) from "outsourcing verification" (unacceptable risk). We already outsource reading to stringers who skim; we do not outsource verification to anyone. The fact-checker is the final human gate. If they cannot verify it, it doesn't run.

  **NEXT STEPS**

  If we agree on this path, I will draft the specific language for the internal protocol by Thursday morning. The reporter has agreed to remove the unverified sentence. This allows us to publish on Monday without compromising our standards or pretending the technology doesn't exist. We maintain trust by ensuring that every claim we publish can be traced back to a source that actually says it, regardless of how we found it.
