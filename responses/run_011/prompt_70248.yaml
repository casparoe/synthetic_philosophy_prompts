answer: |-
  Bloch's distinction between testimony and trace collapses when a trace is manufactured to deceive, revealing that evidentiary security lies not in the object's type but in the verifiability of its provenance. Marc Bloch divided historical evidence into voluntary testimony, where a witness intends to inform, and involuntary traces, such as tax rolls or refuse, which survive without intent to persuade. Bloch privileged traces because they lack the motive to lie. The Piltdown affair disrupts this taxonomy. The gravel-pit material arrived as a physical trace wrapped inside a provenance story told by the man who controlled the material, yet the trace itself had been staged to look like an unintentional survival. This is not a gap requiring a third category, but a sign that the two-way division tracks the *assumed* origin of evidence, not its inherent trustworthiness. A planted trace is testimony masquerading as a trace. The taxonomy remains valid only if the historian treats the "unintentional" status of a trace as a hypothesis to be tested, rather than a given property of the object.

  Regarding the second site, corroboration requires causal independence; two discoveries confirm each other only if their existence does not rely on a single source. The 1915 assemblage from a nearby location felt like mutual confirmation because it offered spatial separation from the original pit, suggesting independent geological processes. However, when one agent controls every channel of discovery, physical separation is illusory. This worry generalizes to the ordinary historian's situation. Many documents from one archive, or many witnesses from one community, are not independent if they stem from a single curated tradition or patron. Independence is provenance-based, not merely geographic or quantitative. The lesson is that multiplying sources does not guarantee security if the chain of transmission converges on a single point of fabrication.

  On the matter of expectation, the find supplied the brain-first model of evolution and an English ancestor, matching audience desires precisely. Should a source-critical method discount evidence in proportion to how well it matches antecedent expectations? Automatic discounting is incoherent, as true findings often confirm existing theories. However, a robust method must treat high coherence with antecedent belief as a risk factor for *acceptance*, not a mark of falsity. The scrutiny must intensify when the fit is too perfect, guarding against the community's lowered skepticism. The error at Piltdown was not that the bone fit the theory, but that the fit discouraged further questioning. Historians must learn to separate the validity of the evidence from the comfort of its implications.

  Finally, regarding the forty-year delay, the failure was methodological and social, not merely instrumental. Fluorine analysis resolved the hoax in 1953, but dissent existed in 1913. Arthur Keith questioned the jaw articulation, and teeth showed abrasion consistent with filing, visible without advanced technology. The community could have demanded stricter chain-of-custody protocols or prioritized anatomical consistency over evolutionary convenience. Instead, authority (Woodward and the British Museum) outweighed anomaly. The delay demonstrates that better techniques are no substitute for critical rigor. Historians must recognize that consensus is not verification, and that even "traces" require interrogation of their discovery context. The Piltdown case teaches that the historian's primary tool is not the laboratory, but the skeptical question applied to the moment of discovery.
