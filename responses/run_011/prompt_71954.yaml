      *   *Trouble 2 (Learning/Discrimination):* JC assumes $P(H|E)$ is fixed. If I get better at identifying, my likelihoods change. This challenges the "rigidity" condition of JC.
      *   *Trouble 3 (Reversibility):* Bayesian updating is generally irreversible (you can't just delete evidence). But if the evidence was "uncertain," can you undo the shift?

