answer: |-
  The paper was rough, cut from the same stock used for seed sacks, and it smelled of the ink we mixed ourselves from soot and linseed oil. We called them strips. On the front, a number and the seal of the valley cooperative. On the back, a blank column waiting for ink.

  Elias held one up to the window light, the grey winter sky showing through the fibers. He was the oldest mason in the valley, and his hands were mapped with the scars of stone and mortar.

  "It's a promise without a mouth," Elias said. He placed the strip on the table between us. "You say this buys a day's digging. But if I take this to you in June, and you have no work, or the frost has killed the roots, what do I have? A piece of paper with names on it. Names don't plow fields. Grain plows fields. Stone builds walls. This..." He tapped the paper. "This is just a memory of work that hasn't happened yet."

  I wanted to tell him that the names were the work. That every signature was a link in a chain of obligation, a guarantee that someone else had accepted this token as good for bread or boots. But I knew Elias. He needed to feel the weight of the thing.

  "The names are the track the work runs on," I said. "If the strip moves, the work gets done. If it stops, we starve. It's not about what backs it, Elias. It's about what it stirs."

  He shook his head, pushing the strip back. "You can stir a pot that's empty, Silas. You'll just burn the bottom. I'll take the strip for now, because I need the cash flow. But don't tell me it's real money. Real money holds its value when the roof falls in. This only holds value while the roof stays up."

  We issued the strips anyway. For the first month, the valley hummed. The miller took them for grain, the cobbler for leather, the schoolteacher for tuition. The backs of the strips began to fill. A strip that had passed through ten hands was treated with more respect than a fresh one. You could see the difference in how they were handled. A fresh note was folded carefully, tucked away. A heavy note, dense with signatures, was passed openly, slapped on the counter with a confidence that made the receiver nod. The ink varied—some names in shaky cursive, some in block capitals, some stamped with a thumbprint. They were a history of the valley's trust.

  Then came the frost, earlier than expected. It didn't kill the harvest, but it bruised it. Yields were down. Fear, like a draft under a door, slipped into the houses.

  Martha was the first to stop spending. She ran the boarding house where the seasonal workers stayed. She received a strip that had already collected fifteen names. It was a heavy one, a "gold" strip we called them jokingly. Instead of passing it to the butcher for meat, she put it in a tin box under her bed.

  "I'm keeping this for the hard times," she told me when I asked about her ledger. "If the valley fails, this strip has the most hands holding it up. It's the safest."

  "But it's not safe in a box, Martha," I said. "It's only safe if it moves. If you keep it, the butcher doesn't get paid. If he doesn't get paid, he doesn't buy shoes. If he doesn't buy shoes, the cobbler doesn't eat."

  She looked at me with the pity of someone who thinks they are being prudent. "I'm not starving my neighbors, Silas. I'm saving myself. You can't eat motion."

  The effect was immediate and subtle. People noticed Martha had the heavy strips. Everyone wanted them. Suddenly, a fresh strip wasn't enough for a day's labor. You needed a heavy one. But the heavy ones were disappearing into tin boxes and mattress seams.

  Work slowed. The miller stopped grinding on Tuesdays because he couldn't pay the mechanic with fresh notes. The mechanic wouldn't take them. "Bring me one with at least ten names," he'd say. "I need to know others trust it."

  Prices fractured. A loaf of bread cost one fresh strip or half a heavy one. People stopped speaking in terms of work and started speaking in terms of ink. "Do you have any of the old ones?" became the first question in every transaction. Neighbors who had shared tools for years began to eye each other's pockets. The trust wasn't gone, but it had calcified. The ticket was no longer a counter for industry; it was a relic to be hoarded. The industry stopped because the counters were locked away.

  I watched the valley grow quiet. The sound of the saws diminished. The smoke from the chimneys was thinner. Elias walked past the coop office and stopped. He didn't come in. He just looked at the stacks of fresh paper on my desk.

  "You see?" he said through the window. "You tried to make money out of trust. But trust needs a reason to move. Now everyone is waiting for someone else to go first. You've built a engine and filled it with sand."

  He was right. The notes were supposed to stir industry, but by treating them as a store of wealth rather than a tool of exchange, we had frozen the very industry they were meant to fuel. The signatures weren't magic; they were a record of momentum. Without momentum, they were just scribbles.

  We called a meeting. We decided to call in all strips at the end of the month and reissue fresh ones. No more hoarding the old. But before we could enforce it, Thomas came to see me.

  Thomas was twenty-two, with eyes set on the city. He had worked the summer orchards and had been paid in strips. He had managed to acquire one of the heavy ones, the one Martha had originally hoarded but had spent to pay a debt. It had twenty names on the back.

  "I need to leave," Thomas said. He laid the strip on my desk. It was worn soft at the corners. "There's a trucker coming through on Friday. He's taking me to the railhead. I need to pay him."

  "The trucker won't take this, Thomas," I said. "He doesn't know the names. He doesn't know us."

  "He knows value," Thomas said. "This has twenty people saying it's good. Why isn't that enough?"

  "Because those twenty people are here," I said. "They can work for me, or for the miller, or for Martha. The trucker can't bring this strip back here and dig a ditch. He can't eat a signature. This ticket only buys work inside the valley. Outside, it's just paper."

  Thomas looked at the strip, then at me. He understood. The money was a ticket for a specific play, and he was leaving the theater. He couldn't take the ticket with him. He would have to trade it for something real before he left—grain, or coin from someone who traded with the outside. He traded it to the miller for two sacks of flour, which he could sell in the city. The miller accepted it because he could use it to pay the locals who would grind the flour. The strip stayed in the valley. Thomas left with flour.

  The note stayed. It had done its work. It had moved the flour, it had moved the boy, it had moved the labor of the orchard. But it could not cross the boundary. It was a token of our specific industry, not a universal key.

  At the end of the month, we gathered in the hall. The tables were piled with strips. Some were fresh and crisp. Some were soft as cloth, dark with the grease of many hands.

  I sat at the head of the table with the ledger. One by one, the members came forward. They presented the strips they had received for work done. I checked the names. I checked the work logged against them.

  Elias came last. He laid down a stack of strips. They were mostly fresh ones. He had refused the heavy ones, spending them immediately to keep the flow going, even when others wouldn't.

  "You lost value," I said, looking at the fresh paper. "You could have kept the heavy ones."

  "I kept the work going," Elias said. "The paper is just the record. The work is the thing. If the paper stops, the work stops. I'd rather have fresh paper and a moving valley than heavy paper and a silent one."

  He was right about the sand in the engine. But he was also right that the engine needed fuel. The names were the motion, but the land was the fuel. Without the capacity to work, the signatures meant nothing. But without the signatures, the capacity lay dormant.

  I took the top strip from Elias's pile. It was a number forty note. It had been used to pay for the repair of the south wall. It had five names on the back. The issuer, the mason, the laborer, the supplier, and finally Elias.

  I took the stamp. It was a heavy block of wood with a metal face. I dipped it in the red ink.

  "Cancelled against labor performed," I said.

  I brought the stamp down. The sound was a dull thud, like a heart beating in a thick chest. The red ink bloomed over the names, obscuring them, turning the history into a single red mark. The obligation was extinguished. The work was done. The ticket was dead.

  I lifted the stamp. The red circle sat on the paper like a seal on a tomb, or a birthmark. I tossed the strip into the bin. It landed on a pile of others, all dead, all having served their purpose. I reached for a fresh sheet of paper to print a new one. The ink was wet. The paper was rough. The valley was quiet, but the engine was oiled.

  ***

  Silas embodies Berkeley's view that money is merely a ticket to stimulate industry and that its value lies in circulation rather than intrinsic worth. Elias embodies the counter-commitment that money must ultimately represent real productive capacity and that without the tangible ability to perform work, the ticket is void. Martha represents the failure to understand money as motion, treating the ticket as a store of value rather than a counter, thereby causing the stagnation Berkeley warned against. The story presses hardest on Berkeley's account at the point of Thomas's departure; Berkeley's theory of a national bank assumes a closed political economy where the currency circulates indefinitely, but the story reveals that such tickets fail at the boundary of the community, proving that while money may be a ticket, it is a ticket for a specific venue, not universal passage.
