answer: |-
  Hobbes would argue that the technical project of low-impact AI is politically naive because it attempts to solve a problem of authority with a problem of measurement. He would firmly take the side that you **cannot** pin down what counts as a side effect without a sovereign authorization of what counts as harm. For Hobbes, there is no *Summum Bonum* (highest good) and no objective state of rest; "good" and "evil" are merely names for our individual appetites and aversions. Consequently, a "do-nothing baseline" is a fiction, because in the state of nature, the world is in constant flux and war. A change in the world is only a "side effect" (a harm) if it violates a right, and rights do not exist until they are created by the Civil Law of a Sovereign.

  Therefore, the question of impact only gets a determinate answer once a Sovereign has authorized what counts as property and justice. The penalty design—rules backed by punishments—is the right shape only insofar as it mimics the "Sword" of the Leviathan, but it is confused if it treats the penalty as a substitute for political definition. Hobbes holds that "covenants without the sword are but words," meaning penalties are necessary to enforce compliance, but they must enforce a defined Law, not a mathematical heuristic of "change." A penalty for "side effects" without a Sovereign to define them is just blind violence, not justice.

  Furthermore, Hobbes would view the AI as an "Artificial Person." Its actions are owned by its Authorizer. If the Sovereign authorizes the AI, its actions are by definition just (unless they threaten the Sovereign's power). If a private actor deploys it, the AI is merely a new weapon in the war of all against all, and its "low impact" settings are irrelevant to its justice. The technical attempt to automate restraint without political authorization is an attempt to bypass the necessity of the Leviathan.

  (Extrapolation note: Applying Hobbes's legal concept of the "Artificial Person" to autonomous software agents extends his theory beyond human corporations to algorithmic servants.)

  Verdict: CANNOT, side effects are political violations not physical changes.
