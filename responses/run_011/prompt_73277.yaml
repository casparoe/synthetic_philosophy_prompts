prompt: |-
  I'm arguing with a colleague about Hobsbawm and I want to steal the best version of a position I think is right but havent actually argued: that "invented tradition" isn't a real category.

  Here's the rough shape of what I want you to defend, then the obstacles you have to clear.

  The claim: the distinction between invented tradition and genuine tradition does no work, because Hobsbawm's own criterion — a practice that is recent but presents itself as immemorial — is satisfied by basically every tradition there is, and where it isn't satisfied the case isn't interesting. So the concept can't debunk anything. It looks critical and is actually vacuous.

  To make that go through I think you need my typology (or a better one, but if you keep it, defend it):
  (i) ex nihilo — a brand new practice plus a new claim of ancient pedigree;
  (ii) re-dating — an old practice that gets a new claimed pedigree or a new meaning bolted onto it;
  (iii) re-assembly — a new practice built out of genuinely old parts.
  Then the thesis proper: every famous case in the Hobsbawm and Ranger volume is (ii) or (iii). The Highland kilt business, the British monarchy's ceremonial being gussied up over the late nineteenth and early twentieth century, the Third Republic picking 14 July, the public school rituals, the colonial administrations in Africa codifying "customary" law. And (ii) and (iii) are just what tradition is — there's no such thing as a tradition that wasn't re-dated or re-assembled at some point, because transmission across centuries *is* re-dating and re-assembling. Which means the contrast class Hobsbawm needs, traditions simply passed down unchanged that make no claim to antiquity, is empty.

  Now the obstacles, and this is most of what I want:

  1. The best objection is that the invention isn't in the practice but in the representation. Nobody seriously believes the kilt is ancient; the ideological work is done by the claim of continuity, which is a political act, and that's the thing worth debunking. Answer it. I suspect the answer has to be that a community's claim of continuity about itself isn't a factual assertion with a truth value in the right way — it's closer to a vow, or to adopting a rule, or to promising — but you have to make that stick without sliding into "well, it's all just symbolic, whatever," which would concede the whole point.

  2. The periodization objection: Hobsbawm's real claim is a historical one about a particular window, that there was a sudden burst of ritual production in the late nineteenth century because the older social cement was dissolving, and I'm reading it as a conceptual claim it never made. Say whether that rescues the concept or just relocates it, and which version is more interesting to be wrong about.

  3. Anderson already made the analogous move for the word "imagined": he says the question isn't whether communities are false or genuine, since anything larger than a face-to-face village is imagined, but the manner in which the imagining is done. Does that rescue Hobsbawm by showing him the fix, or convict him of not making the move he needed? Take a side.

  4. If I'm right, is anything left? Seperate out what survives: give me the narrowed concept and say what would have to be true of a case for it to be a genuine invention, i.e. a member of a non-empty contrast class, and tell me whether any real candidate meets it. The Sobieski Stuart brothers' codification of clan tartans? Ossian? Some piece of colonial customary law written down for the first time by a district officer with no prior practice behind it? And if the honest answer is "a handful, and they're all textual forgeries rather than practices," say that flatly — I think that's the most damaging result for the concept and I want it stated up front rather than buried in a concluding paragraph.

  Argue it. Don't survey the literature, no bibliography and no reading list, and don't land on "the truth is somewhere in the middle." I want a case that would make a Hobsbawm defender sweat a little.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Goal:** Defend the position that "invented tradition" (Hobsbawm & Ranger) is not a real/useful category because the distinction between "invented" and "genuine" tradition collapses.
      *   **Core Claim:** Hobsbawm's criterion (recent practice claiming immemorial status) applies to almost *all* traditions. Where it doesn't apply, the case isn't interesting. Therefore, the concept is vacuous and cannot debunk anything.
      *   **Typology to Defend/Use:** (i) *ex nihilo* (new practice, new claim), (ii) re-dating (old practice, new claim/meaning), (iii) re-assembly (new practice, old parts).
      *   **Thesis:** All famous cases are (ii) or (iii). Since transmission *is* re-dating/re-assembly, the contrast class (unchanged tradition making no claim to antiquity) is empty.
      *   **Obstacles to Clear:**
          1.  *Representation Objection:* The invention is in the *claim* of continuity, not the practice. (Counter: Claims of continuity are performative/vows, not factual assertions with truth values).
          2.  *Periodization Objection:* Hobsbawm meant a specific historical burst (late 19th C), not a conceptual claim. (Counter: This relocates the problem, doesn't solve it; the conceptual version is more interesting to be wrong about).
          3.  *Anderson Objection:* Benedict Anderson's "Imagined Communities" distinguishes *how* vs. *if*. (Counter: This convicts Hobsbawm of failing to make the necessary move).
          4.  *Survival Objection:* If I'm right, is anything left? (Counter: Narrow the concept to textual forgeries/*ex nihilo* cases like Ossian/Sobieski Stuarts. Admit this leaves almost no *practices*, only *lies*.)
      *   **Tone:** Argumentative, sharp, no fence-sitting, no bibliography, make a Hobsbawm defender sweat.

  2.  **Deconstruct the Core Argument:**
      *   Hobsbawm wants to debunk nationalism/authority by showing their roots are fake.
      *   If *all* roots are "fake" (in the sense of being constructed/re-interpreted), then "fake" loses its critical bite.
      *   The typology (i, ii, iii) is crucial. I need to show that (ii) and (iii) are the *definition* of tradition, not exceptions to it.
      *   Tradition is a living process, not a fossil.

  3.  **Address Obstacle 1: Representation vs. Practice:**
      *   *Opponent:* The lie is the claim "this is old."
      *   *My Counter:* When a community says "we have always done this," they aren't making a historiographical claim. They are making a constitutive claim. It's like a marriage vow ("I promise to love you forever" at the moment of saying it). It's a performative utterance. Treating it as a falsifiable empirical statement is a category error. If you treat it as a lie, you misunderstand the grammar of social cohesion.

  4.  **Address Obstacle 2: Periodization:**
      *   *Opponent:* Hobsbawm only meant 1870-1914.
      *   *My Counter:* If it's just a historical observation about the late 19th century, it's trivial. Of course industrialization changed rituals. But the *concept* "Invented Tradition" is used as a weapon against legitimacy *now*. If the concept relies on a false dichotomy (invented vs. organic), the historical specificities don't save the theoretical utility. It's more damaging if the *concept* is broken than if the *dates* are off.

  5.  **Address Obstacle 3: Anderson:**
      *   *Opponent:* Anderson saved this by saying all communities are imagined.
      *   *My Counter:* Anderson succeeded precisely because he abandoned the "real vs. fake" binary. Hobsbawm failed because he kept it. Anderson asks "how is it imagined?" Hobsbawm asks "is it fake?" Hobsbawm is the inferior theory here. He didn't take the step Anderson did.

  6.  **Address Obstacle 4: What Survives?**
      *   *Opponent:* So nothing is invented?
      *   *My Counter:* Only *ex nihilo* (Type i) counts as "invented" in a way that contrasts with tradition. This basically means literary forgeries (Ossian) or explicit fabrications with no prior practice (Sobieski Stuarts' tartans). Real *practices* (kilt wearing, coronations) are always Type ii or iii. So the category "Invented Tradition" shrinks to "Literary Forgery." It loses its sociological punch.

  7.  **Drafting - Section by Section:**

      *   *Introduction:* State the thesis boldly. The distinction is vacuous.
      *   *The Typology:* Establish (i), (ii), (iii). Argue that tradition *is* (ii) and (iii).
      *   *Obstacle 1 (Representation):* Attack the truth-value of continuity claims. Use the "vow" analogy.
      *   *Obstacle 2 (Periodization):* Concede the historical point but deny its theoretical salvage.
      *   *Obstacle 3 (Anderson):* Use Anderson to hammer Hobsbawm.
      *   *Obstacle 4 (Survival):* Brutally narrow the category. Admit it leaves only forgeries.
      *   *Conclusion:* Summarize the damage.

  8.  **Refining the Tone:**
      *   Avoid academic hedging ("It could be argued").
      *   Use strong verbs ("collapses," "evaporates," "convicts").
      *   Ensure the "vow/performative" argument doesn't sound like "anything goes." It needs to be about *grammar*, not relativism.
      *   Make sure the distinction between Type i and Types ii/iii is clear.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I slide into "it's all symbolic"?
      *   *Fix:* Emphasize that calling it a "vow" makes it *more* real socially, not less. It binds people. Calling it a "lie" misunderstands the binding mechanism.
      *   *Check:* Did I address the Highland Kilt specifically?
      *   *Fix:* Ensure the kilt is cited as Type iii (re-assembly), not Type i.
      *   *Check:* Is the Anderson comparison sharp?
      *   *Fix:* Make sure Anderson looks like the upgrade that Hobsbawm failed to install.

  10. **Final Polish:** Check against the prompt's constraints (no bibliography, no middle ground). Ensure the "Sobieski Stuart" example is used correctly as the *only* remaining valid example.

  *(Self-Correction on the "Vow" argument)*: I need to be careful not to say "it's not a lie so it's okay." I need to say "calling it a lie is a category error." The claim "we have always done this" functions to create the "we," not to describe a timeline. If I say "I promise," I am not describing a future action, I am performing the commitment. Similarly, "This is our ancient way" performs the belonging.

  *(Self-Correction on Periodization)*: If Hobsbawm is only right about 1870-1914, does the concept still work? Yes, but only if the contrast class exists. If *all* traditions are invented (in the broad sense), then singling out 1870-1914 is just noting a *change in style* of invention, not the *fact* of invention. I need to press this.

  *(Final Plan)*: Go hard on the "Category Error." That's the philosophical kernel that makes the argument stick.

