  ### Application to New Cases

  Here is how the principle handles the scenarios you proposed:

  **1. A generated glyph halfway between 'c' and 'e'.**
  *   **Verdict:** Ambiguous token; identity resolved by context.
  *   **Reasoning:** This falls on the boundary of the **Topological Basin (Clause 3)**. If the mark is isolated, it is not a letter, but a shape. If placed in the word "on_", the system forces it into the 'e' slot. If in "_offee", it becomes 'c'. The principle dictates that without contextual disambiguation, it has no stable letter identity.

  **2. An 'e' whose crossbar has drifted up so the counter opens.**
  *   **Verdict:** Still an 'e', provided the vertical anchor holds.
  *   **Reasoning:** This is **Stylistic Variance (Clause 3)**. As long as the mark is not inverted (**Vertical Anchoring, Clause 4**) and is deployed in a system that recognizes it as an 'e' (**Systemic Membership, Clause 1**), the drift is merely a deformation of the token, not a change of type. It becomes a 'c' only if the aperture opens completely and the system no longer allocates that shape to 'e'.

  **3. A Braille cell.**
  *   **Verdict:** Definitely a letter.
  *   **Reasoning:** It satisfies **Intentional Deployment (Clause 2)** and **Systemic Membership (Clause 1)**. The principle does not require visual ink, only a mark in a system. The "shape" is tactile topology. The **Vertical Anchoring (Clause 4)** still applies (Braille has a defined top and bottom); if you rotate a Braille cell 180 degrees, it becomes a different letter or nonsense, just like visual script.

  **4. A letter in a constructed script that nobody has ever read or set in a word.**
  *   **Verdict:** It is a *proto-letter* or a *glyph*, but not yet a functional letter.
  *   **Reasoning:** It fails **Systemic Membership (Clause 1)** in a communicative sense. There is no "competent reader" (even hypothetically) because the system is not shared. It has the *form* of a letter (Intent + Shape) but lacks the *function* (Allocation + Recovery). It becomes a letter only when the system is adopted by a second party.

