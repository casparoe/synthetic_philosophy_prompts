  ### The Cost of Coherence: A Note on Case 4

  You asked me to be straight if a judgment must be thrown out. The **Vertical Anchoring** clause allows me to save your intuition in Case 4 (the niece's 'b'), but I must clarify the cost.

  By insisting that the mirrored 'b' is a 'b' because the vertical axis is preserved, we are prioritizing **Structural Provenance** over **Orthographic Convention**.
  *   In strict typography, a mirrored 'b' *is* a 'd'. If you found that mark on a piece of paper without knowing your niece drew it, you would read it as 'd'.
  *   Your judgment in Case 4 relies on *extra-graphic* knowledge (it's a child; children mirror).
  *   My principle saves this by classifying the mirror-flip as a "production error" within the 'b' basin, rather than a "slot change" to 'd'.

  **The Sacrifice:** To keep this coherent, you must accept that **Case 4 is a special case of Error Correction, not Geometric Identity.**
  If you remove the context ("My niece"), the principle dictates the mark *is* a 'd'. The principle holds that the *mark itself* is a 'd' (geometrically allocated to the 'd' slot in Latin), but the *communicative act* is a 'b'.
  *   **Case 5 (Rotation):** The mark *is* a 'q'. The act is irrelevant.
  *   **Case 4 (Mirroring):** The mark is a 'd', but the act is a 'b'.

  If you want a purely design-based principle, you should concede that the niece wrote a 'd' *incorrectly intended as* a 'b'. If you want a cognition-based principle, you keep your verdict: she wrote a 'b' *incorrectly formed as* a 'd'. The **Anchored Allocation** principle supports the latter, provided you acknowledge that the "System" includes the "Context of Production" (Child vs. Adult).

  ### Summary
  The unifying thread is not shape, and not just intent, but **Allocation within an Oriented System**.
  *   **System** decides if it's 'p' or 'р' (Case 6).
  *   **Intent** decides if it's a letter or a coffee ring (Case 7).
  *   **Topology** decides if it's 'g' or 'a' (Case 1).
  *   **Orientation** decides if a flip is an error (Case 4) or a new letter (Case 5).

  This keeps your pile of judgments in order without needing twelve separate clauses.
