answer: |-
  ### Part 1: The Honest Answer (Spectrum vs. Threshold)

  You are technically correct: it is a spectrum. In engineering terms, autonomy slides from 0% to 100%. However, for **governance**, you must teach this as a **categorical threshold**.

  If you teach them a spectrum, they will try to manage risk incrementally ("It's only 10% autonomous, so we need 10% less oversight"). That is dangerous. Liability does not scale linearly; it flips.

  **The Threshold:** The point where the system is authorised to effect a change in the physical or administrative world that **cannot be instantly reversed by the supervising human.**

  *   **Below the line (Tool):** The system proposes; the human disposes. The human is the bottleneck. Risk is *clinical error*.
  *   **Above the line (Executor):** The human sets the goal; the system executes the steps. The system is the bottleneck. Risk is *process failure*.

  **Your Stance:** Tell them, *"For the engineers building this, it is a dimmer switch. For this committee, it is a light switch. Below the line, we govern clinical safety. Above the line, we govern delegated authority. Proposal B crosses the line."*

  ***

  ### Part 2: The Teaching Plan (45 Minutes)

  **Room Setup:**
  *   **Flip Chart 1:** "The Question" (Who is accountable?)
  *   **Flip Chart 2:** "The Analogy" (Draw two columns: Advisor vs. Executor)
  *   **Whiteboard:** "Proposal A" vs. "Proposal B" (Map the workflow)
  *   **No Slides:** You are the visualiser. Use thick markers.

  #### Phase 1: The Entry Point – Accountability (0–5 mins)
  *   **Goal:** Anchor the discussion in liability, not technology.
  *   **Action:** Write **"Who goes to the coroner?"** on Flip Chart 1. (It's provocative, but it wakes them up. If too strong, use **"Who apologises to the family?"**)
  *   **Script:** *"We are not here to discuss algorithms. We are here to discuss authority. When things go wrong in this Trust, we need to know where the buck stops. Today, I need you to decide if we are buying a pen, or if we are hiring a signatory."*
  *   **Why:** This pre-empts the Finance Director's cost argument and the Lay Member's complaint question. It establishes that *governance is about power, not code*.

  #### Phase 2: The Analogy – The Travel Agent (5–15 mins)
  *   **Goal:** Define the threshold without using clinical jargon or anthropomorphism.
  *   **Brainstorming & Selection:**
      1.  *Satnav vs. Self-Driving Car:* **Reject.** Implies the system "sees" or "knows" the road. Too much focus on safety/crashes rather than administrative authority.
      2.  *Junior Doctor (Do what I say vs. Do what I mean):* **Reject.** Implies the system has intent or understanding. Dangerous anthropomorphism.
      3.  *Calculator vs. Direct Debit:* **Reject.** Too abstract. Doesn't capture the "booking/cancelling" nuance of Proposal B.
      4.  **Winner: The Travel Agent.**
          *   **Advisor (Tool):** You ask, "What flights to London are under £100?" They give you a list. *You* book the ticket. *You* cancel if plans change. If they find the wrong price, you don't buy it.
          *   **Executor (Agent):** You say, "Get me to London under £100." They book the ticket. They cancel your meeting to make time. If the train is cancelled, they rebook you on a bus *without asking you*.
  *   **Action:** Draw two columns on Flip Chart 2.
      *   *Left:* **Advisor.** Output = Information. Action = Human. Reversibility = High.
      *   *Right:* **Executor.** Output = Action. Action = System. Reversibility = Low/Delayed.
  *   **Key Phrase:** *"The Advisor gives you homework. The Executor gives you results."*
  *   **Why:** It perfectly mirrors Proposal B (booking transport, cancelling beds) without implying the AI is a doctor. It highlights the **delay** (booking for next week) and the **irreversibility** (non-refundable ticket/bed lost).

  #### Phase 3: Mapping the Proposals (15–25 mins)
  *   **Goal:** Apply the analogy to Proposal A and B.
  *   **Action:** Move to the Whiteboard. Draw the Discharge Process.
  *   **Proposal A (The Advisor):**
      *   System: Drafts text.
      *   Human: Reads, Edits, Signs, Sends.
      *   *Governance:* Standard clinical governance. If the text is wrong, the doctor catches it.
  *   **Proposal B (The Executor):**
      *   System: Drafts text + **Books Taxi** + **Emails GP** + **Cancels Bed**.
      *   Human: Signs the text.
      *   *The Gap:* Draw a box around "Books Taxi/Cancels Bed". Label it **"Blind Spot"**.
      *   *Script:* *"In Proposal B, the doctor signs the letter. But the system books the taxi. If the system books the taxi for the wrong date, the doctor has already signed the letter. The patient arrives, the taxi isn't there. The bed is already gone. The damage is done before the doctor knows there was a problem."*
  *   **Misconception Head-Off:** *"Some might say, 'But the doctor signed it.' No. They signed the clinical summary. They did not sign the taxi booking. We are delegating administrative authority, not just clinical drafting."*

  #### Phase 4: Stakeholder Management & Misconceptions (25–35 mins)
  *   **Goal:** Handle the specific objections you anticipate.

  *   **The Lay Member ("Who do I complain to?"):**
      *   *Timing:* She will ask this now. It is your gift.
      *   *Response:* *"That is the exact question. If Proposal A goes wrong, you complain to the Doctor who signed it. If Proposal B goes wrong, you complain to the Trust, because the Trust authorised the system to act on its own. We are moving liability from the clinician to the organisation. That changes our insurance, our legal risk, and your recourse."*
      *   *Why:* Validates her concern, reinforces the "Threshold" concept.

  *   **The Finance Director ("Tool is cheaper/Add bits later"):**
      *   *Concede:* *"You are right. Proposal B is more efficient. It saves bed days. The ROI is better."*
      *   *Refuse:* *"But you cannot 'add the bits later' under the same approval. Buying an engine is different from buying a car. If we approve A, we cannot switch on B without coming back to this committee. It is a new governance class. If we approve B now as if it were A, we are signing a blank cheque."*
      *   *Why:* Acknowledges value but protects the governance gate.

  *   **Misconception Map (Weave these in):**
      1.  *"If a human signs it off, it's a tool."* -> **Address in Phase 3.** (The "Blind Spot" drawing). Explain "Rubber Stamping" risk.
      2.  *"Agents are riskier because they're cleverer."* -> **Address in Phase 2.** It's not about cleverness; it's about **reach**. A dumb system that can cancel a bed is riskier than a smart system that can only write text.
      3.  *"We can always switch it off."* -> **Address in Phase 3.** *"By the time we switch it off, the taxi has left. The bed is filled. The harm is temporal, not just digital."*
      4.  *"A tool that gives bad advice is just as dangerous."* -> **Absorb this.** *"True. But bad advice requires a human to act on it. Bad execution happens even if the human is asleep. The scale of failure is different."*

  #### Phase 5: The Test Question (35–40 mins)
  *   **Goal:** Verify understanding, not agreement.
  *   **Action:** Put the marker down. Look at the room.
  *   **The Question:** *"If we approve Proposal B, and next month the system cancels a bed for a patient who actually had a care package available, but the system didn't see the email confirmation: Who is responsible for that error, and what process do we need in place *before* we sign today to ensure I don't have to answer that question?"*
  *   **What to listen for:**
      *   *Bad answer:* "The IT team fixes the bug." (Misses the governance point).
      *   *Good answer:* "The Trust is liable. We need a human check on the care package status before the system is allowed to cancel." (Identifies the delegation of authority).

  #### Phase 6: Close (40–45 mins)
  *   **Action:** Summarise the decision required.
  *   **Script:** *"Proposal A is a purchase. Proposal B is a policy change. I am asking for approval on A. I am asking for a working group on B. Do we have agreement on that distinction?"*

  ***

  ### Part 3: What NOT To Teach (The "Do Not Say" List)

  Write this on a sticky note on your lectern. If you slip, you lose the room.

  1.  **Do not use the word "Agentic" or "Agent".**
      *   *Why:* It is jargon. It sounds like science fiction. Use **"Executor"**, **"Delegated System"**, or **"Proposal B"**.
  2.  **Do not explain how the model works.**
      *   *Why:* No one cares about transformers, weights, or tokens. It distracts from the *action*.
  3.  **Do not discuss consciousness or intent.**
      *   *Why:* The Lay Member will latch onto "Does it think?". The answer is no, but the debate will eat 20 minutes. Keep it mechanical: *"It follows rules, not desires."*
  4.  **Do not give timelines on "Future AI".**
      *   *Why:* Finance and ICB want numbers. Don't speculate. Stick to *this* procurement.
  5.  **Do not let them call it "Automation".**
      *   *Why:* Automation implies fixed rules (If X then Y). This system infers. Call it **"Inferred Execution"**. It sounds riskier, which is accurate.

  ### Final Preparation Checklist

  *   **Whiteboard Check:** Ensure you have at least 4 colours. Red for "Irreversible Action".
  *   **Handout:** Print one page. Two columns. "Advisor" vs "Executor". Leave space for notes. Give it to them at the start so they aren't scribbling on the table.
  *   **Mindset:** You are not the IT person asking for permission. You are the Governance Lead protecting the Trust. Stand on the side of the room with the Flip Chart, not behind a desk.
  *   **The "Forthright" Lay Member:** Make eye contact with her when you ask the Test Question. She is your ally in accountability.
  *   **The ICB Reps:** When you mention "Bed Days" and "Efficiency", look at them. They care about flow. Acknowledge B helps flow, but risks blockage if it goes wrong.

  **Good luck. Keep it on the whiteboard. Keep it on the money. Keep it on the liability.**
