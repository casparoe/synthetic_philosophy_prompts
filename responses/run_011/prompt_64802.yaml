      *   *Climax:* She thinks she's safe. Then the smell of roasting grain. The smoke from the *inside* of the pile. The grain heat.
      *   *Fire:* It burns. She escapes. Father wakes.
      *   *Inquest:* Weeks later. Formal room.
      *   *Ending:* The verdict. Negligence. She sees the logic.

  9.  **Checking Constraints:**
