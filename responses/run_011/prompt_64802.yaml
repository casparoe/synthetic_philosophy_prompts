      *   **Task:** Write a standalone short story (~2500 words) based on a specific chapter idea.
      *   **Core Concept:** The fire is "overdetermined." Four distinct causes, each sufficient on its own to burn the warehouses within a week. They must be genuinely separate chains of causality.
      *   **Protagonist:** Harbour office clerk, nightwatchman's daughter.
      *   **Plot:** She spots three causes (lantern, grudge, valve) and extinguishes/prevents them. This buys two hours and a smaller blaze, but not prevention.
      *   **Ending:** The inquest. The town needs one cause/face. They pick her father. She understands why (necessity of narrative/order), without forgiveness or speechifying.
      *   **Constraints:**
          *   Nobody lies (not *Rashomon*).
          *   All four accounts are true and compatible.
          *   No omniscient historian voice.
          *   No epigraph.
          *   No blaming "the town" as a monolith.
          *   One cause = omission.
          *   One cause = standing condition (not an event).
          *   Close third person POV (the daughter).
          *   Word count: ~2500 words.

  2.  **Deconstruct the Four Causes:**
      *   *Cause 1 (Event):* The Lantern. A dropped or misplaced light source. Classic accident.
      *   *Cause 2 (Event/Action):* The Grudge. Arson or sabotage. Intentional but distinct from the accident.
      *   *Cause 3 (Omission):* The Valve. Something left open or unchecked. A failure of maintenance.
      *   *Cause 4 (Standing Condition):* The Environment/Structure. Dry timber, grain dust, lack of firebreaks. Something that *is*, not something someone *did*.

      *Refining for the Story:*
      1.  *Lantern:* A dockhand leaves a lit oil lamp near burlap sacks. (Prevented by protagonist).
      2.  *Grudge:* A striker or disgruntled worker places a slow-burn fuse or oily rag. (Prevented by protagonist).
      3.  *Omission:* The water pressure valve for the standpipe was left closed after testing. (Prevented/Fixed by protagonist).
      4.  *Standing Condition:* The grain dust suspension in the air + the new railway sparks/heat. Or perhaps the chemical treatment on the wood. Let's go with *Grain Dust*. It's invisible, pervasive, and explosive. She can't "put this out." It's just there.

      *Wait, the prompt says she puts three out.*
      So:
      1.  Lantern (She removes it).
      2.  Grudge (She removes the incendiary device).
      3.  Valve (She opens it).
      4.  Standing Condition (She *cannot* fix this. This is what burns). Let's make the standing condition the *new railway embankment* acting as a wind tunnel, or the *dryness of the timber* combined with *grain dust*. Let's go with Grain Dust accumulation in the rafters. It's a condition of the warehouse itself.

  3.  **Character & Setting:**
      *   **Protagonist:** Elara. Clerk, observant, practical.
      *   **Father:** Thomas. Nightwatchman. Old, tired, perhaps negligent but not malicious.
      *   **Setting:** "Oakhaven" or "River's End." Let's call it *Port Harrow*. 1860s. Gaslight beginning, oil still king. Grain elevators.
      *   **Tone:** Tense, atmospheric, procedural but emotional.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and Elara's presence. She's filling in for her father or working late. The atmosphere of the warehouses.
      *   **Discovery 1 (The Lantern):** She finds a carelessly left lamp. Moves it.
      *   **Discovery 2 (The Grudge):** She finds something deliberate. A soaked rag or fuse. Removes it.
      *   **Discovery 3 (The Omission):** The water pump valve. Closed. She opens it.
      *   **The Fire:** Despite her efforts, something ignites. The Standing Condition (Grain Dust). A spark from somewhere (maybe the railway nearby, or just static/friction). The fire starts.
      *   **The Aftermath/Inquest:** The fire happens. The investigation. The need for a scapegoat.
      *   **The Verdict:** Her father is blamed (negligence).
      *   **The Realization:** Elara understands the town needs a single thread to pull, not a tangled knot.

  5.  **Refining the "Overdetermined" aspect:**
      *   I need to make sure the reader feels the weight of the four causes without being told "there were four causes."
      *   Cause 1: Lamp left on a crate (Event).
      *   Cause 2: Turpentine rag tucked in a corner (Event/Grudge).
      *   Cause 3: Main water valve closed (Omission).
      *   Cause 4: The air itself. Thick with chaff and dust (Standing Condition).

      *Correction on the Prompt:* "She spots them one at a time and puts three of them out."
      So she handles 1, 2, and 3. 4 remains.
      The fire still happens because 4 is enough on its own given a spark, or perhaps the interaction of 4 with a minor spark that she couldn't prevent.
      Actually, if 4 is a standing condition (dust), it needs an ignition source. If she removed the lamp and the rag, where does the spark come from?
      Maybe the spark is incidental (a mouse knocking over a bottle? A stray ember from a pipe?).
      *Better:* The prompt says "Four causes, each of which by itself would have burned those warehouses down inside the week."
      So, the Standing Condition must be potent enough. Spontaneous combustion of oily rags *is* a thing, but that's the grudge.
      Let's make the Standing Condition: *The new railway embankment channeling wind and sparks.* No, that's an event.
      Let's make the Standing Condition: *Chemically treated wood that is now desiccated and highly flammable.*
      Okay, if she removes the lamp, the rag, and opens the valve... why does it burn?
      Because the *fourth* cause is still there.
      Cause 4: Spontaneous heating of the grain itself. Wet grain generates heat. If stored too deep, it ignites. This is a condition of the cargo.
      So:
      1. Lantern (External ignition).
      2. Rag (External ignition/Arson).
      3. Valve (Lack of suppression).
      4. Grain Heat (Internal ignition).
      She fixes 1, 2, 3. But 4 ignites on its own.
      This fits "each of which by itself would have burned those warehouses down."

  6.  **Writing - Focus on Sensory Details:**
      *   Smell: Dust, oil, river water, old wood.
      *   Sight: Shadows, dust motes, the gleam of the valve.
      *   Sound: Creaking timber, distant train, water lapping.

  7.  **Writing - The Inquest:**
      *   Needs to be bureaucratic. Cold.
      *   The Magistrate.
      *   The Father's silence.
      *   Elara's realization.

  8.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Start:* Elara in the warehouse. Night.
      *   *Action 1:* Finds the lantern. "Who left this?" Moves it to the stone floor.
      *   *Action 2:* Finds the rag. Smells turpentine. Hides it in her bucket.
