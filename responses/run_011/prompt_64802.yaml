answer: |-
  The ledger lay open on the desk, but Elara was not looking at the columns of bushels and tonnage. She was listening to the warehouse breathe.

  Port Harrow slept in shifts. The river lapped against the pilings, the new railway line groaned as the metal cooled in the night air, and Warehouse Four, the great timber skeleton where the harvest of the valley was stored, creaked under the weight of ten thousand sacks of wheat. Her father, Thomas, was asleep in the watchman's cot in the office, his breathing a ragged counterpoint to the building's settling. Elara had taken the keys an hour ago. She told herself it was to reconcile the day's receipts, but the silence of the office had pressed against her ears until she needed the smell of grain and dust to feel awake.

  She took the lantern from the desk. It was not the one she should have taken. The official lamp was locked in the cabinet. This one had been left on the crate by the loading foreman, Wickes. It sat on a stack of burlap, the flame unguarded, the glass chimney warm to the touch.

  Elara picked it up. The oil sloshed. If a sack shifted, if the crate splintered, the wick would kiss the canvas. It was not a matter of *if*, but *when*. The dryness of the season had turned the sacking into tinder. She blew the flame out, the smoke curling up to join the suspended dust in the rafters. She carried the cold lamp to the stone floor of the entryway, away from the wood, away from the grain. That was one thread cut.

  She walked the perimeter. Her boots made no sound on the packed earth floor. The warehouse was a canyon of sacks, stacked twenty feet high, leaving narrow aisles like streets in a city. She was checking for rats, for leaks, for the settling that opened gaps in the walls.

  In the third aisle, near the rear door that opened toward the railway embankment, she smelled it. Turpentine.

  It was sharp, chemical, cutting through the sweet, heavy scent of the wheat. She crouched. Tucked behind a support beam, wrapped in a scrap of newspaper, was a rag. It was soaked, the liquid still glistening. It hadn't been dropped; it had been placed. A grudge. Someone from the dockworkers' strike, or a competitor with a interest in the insurance. If left, the fumes would build, or a stray spark from the railway shunting yards next door would find it. It would burn fast and hot, a torch applied to the base of the wall.

  Elara did not call out. There was no one to call. She took the rag with her bare fingers, the chemical biting at her skin, and dropped it into her water bucket. She poured the remaining water over it until the hiss stopped. That was the second thread. Malice, neutralized.

  She moved to the standpipe. It was the pride of Warehouse Four, the new safety installation promised after the fires in '62. A brass wheel protruded from the wall, connected to the river main. She gripped it to test the tension, a habit her father had taught her. It didn't turn.

  It wasn't rusted. It was closed. Tightly.

  Someone had tested the pressure last week and failed to open the valve back to the system. An omission. A forgetfulness. If the fire started, the hoses would be dry rubber. The pressure would build in the pipe until it burst, and the warehouse would burn while the river flowed ten yards away.

  Elara put her shoulder to the wheel. It groaned, metal grinding on metal. She pushed until her palms burned, until the mechanism clicked and spun free. She heard the rush of water filling the main line, a heavy thrum in the walls. That was the third thread. Negligence, corrected.

  She stood back, wiping her hands on her apron. She had bought safety. She had bought time. She felt a surge of triumph, a clerk's satisfaction in a balanced ledger.

  Then she heard the hiss.

  It was not the sound of a flame. It was the sound of steam. It came from the center of the grain stack, the great mountain of wheat sacks piled in the bay.

  Elara froze. She knew the smell. It was not smoke yet. It was the smell of roasting bread, cloying and hot. Spontaneous combustion. The grain had been loaded wet, rushed off the barges before the rain dried, and buried deep in the stack where the heat could not escape. The fermentation had begun days ago. It was a standing condition of the cargo itself. It did not need a lantern, or a rag, or a dry hose. It carried its own ignition within its belly.

  She had fixed the accidents. She had fixed the crimes. She had fixed the mistakes. She could not fix the nature of the wheat.

  The hiss became a crackle. A thin ribbon of smoke unspooled from between two sacks. Elara stepped back. She knew the physics of grain dust. The air in the warehouse was thick with it, a golden fog suspended in the lantern light. If the core ignited, the heat would rise, stir the dust, and the air itself would flash.

  She ran to the office. "Papa."

  Thomas woke with a gasp, reaching for a rifle that wasn't there. "What? Who?"

  "Fire. In the stack. The grain is cooking."

  He was out of the cot, boots on, face grey in the dim light. He saw the smoke curling under the door. He didn't ask how she knew. He grabbed the alarm bell.

  They stood outside as the roof gave way. The fire did not roar; it breathed. It sucked the air from the yard, pulling Elara's hair forward, feeding the white-hot core. The water from the standpipe hissed when Thomas finally turned the nozzle, but it was steam before it hit the flames. The heat was too great. The dust in the air caught the light and flashed, a series of soft *thumps* that blew the windows out of the office.

  They watched Warehouse Four become a chimney. It burned for six hours. By morning, there was nothing but a blackened skeleton and a mountain of steaming, ruined wheat.

  ***

  The inquest was held three weeks later in the magistrates' chamber above the bakery. The room smelled of yeast and floor wax. Elara sat on the wooden bench behind her father. He wore his best coat, the one with the frayed cuffs. He stared at his hands.

  The Magistrate, Mr. Henderson, sat at the high table. He was a man who liked straight lines. He adjusted his spectacles and looked at the stack of papers before him.

  "We are here to determine the origin of the fire at Warehouse Four," Henderson said. His voice was flat, bored. "We have heard testimony from the loading foreman, Mr. Wickes."

  Wickes stood. He looked at Thomas, then at the floor. "I left my lamp on a crate, sir. I admit it. But I've done that a hundred times. It wasn't lit when I left."

  "Was it lit when the daughter found it?"

  "Aye. But I didn't light it."

  Henderson made a note. "And the rag?"

  A dockworker stood up. "Found traces of turpentine in the ash. Could have been a spill. Could have been sabotage. No proof of who."

  "And the valve?" Henderson looked at Thomas.

  Thomas shifted. "I... I thought I'd left it open. I must have closed it for the test and forgot to turn it back."

  "Negligence," Henderson said. He didn't write it down; he simply stated it, like a fact of geometry.

  Elara's hand tightened on her knee. She wanted to stand. She wanted to list them. The lantern. The rag. The valve. The grain. She wanted to explain that the fire was a knot that could not be untied, that four separate ropes had pulled tight at the same moment.

  But she looked at the room. The insurance adjuster sat in the corner, calculating the payout. The railway representative sat next to him, ensuring the blame didn't drift toward the embankment. The grain merchants were there, needing to know if their next shipment was safe.

  They needed a story. A story requires a beginning, a middle, and an end. It requires a subject and a verb. *Thomas slept. Thomas forgot. Thomas failed.*

  If the report said "Overdetermined Systemic Failure," the insurance would not pay. If it said "Spontaneous Combustion due to Wet Grain," the merchants would be liable. If it said "Arson," the town would panic about the strikes.

  If it said "Nightwatchman Negligence," the check could be written, the watchman fired, and the new man could start on Monday.

  "Mr. Vane," Henderson said. "The evidence suggests that while other factors were present, the primary failure of containment lies with the watch. Had the valve been open, the fire might have been suppressed before the grain core ignited."

  It was true. It was also a lie. If the valve had been open, the water would have steamed off the grain fire just the same. But it was a truth that fit the shape of the form.

  Thomas nodded. He didn't look up. "Aye, sir."

  "Do you have anything to add?" Henderson asked Elara.

  She looked at her father. He looked smaller than he had the night of the fire. He was accepting the weight of the four causes so the town didn't have to carry them. He was becoming the single face for the tangled mess.

  She thought of the lantern on the crate. She thought of the turpentine rag hidden in the shadows. She thought of the wet wheat breathing in the dark.

  If she spoke, she would complicate the record. She would make the fire a mystery again. She would make the town unsafe, because a fire that happens for four reasons is a fire that can happen again, no matter how well you watch. A fire that happens because one man slept is a fire you can prevent by hiring a man who doesn't sleep.

  Elara smoothed her skirt. She looked at the Magistrate.

  "No, sir," she said.

  Henderson nodded, satisfied. He dipped his pen. "Verdict: Accidental fire, contributed to by negligence of the night watch. Case closed."

  He blew on the ink to dry it. The sound was loud in the quiet room.

  Elara watched the paper. It was already becoming the history. Tomorrow, the newspaper would print it. *Watchman Sleeps, Warehouse Burns.* In a year, the lantern would be forgotten. In five years, the rag would be a rumour. In ten years, only the negligence would remain, etched in the town ledger as a lesson.

  She understood then that truth was not a collection of facts, but a structure built to hold the weight of the future. The town could not stand on a foundation of chaos. It needed a floor. Her father was the floor.

  Thomas stood up. He touched her shoulder, a light, apologetic pressure. She did not look at him. She looked at the Magistrate's hand, moving to the next file, clearing the table, making the world orderly again.

  She stood when her father stood. They walked out into the sunlight of the port. The railway whistle blew, a long, clean note that cut through the smell of the river. Elara buttoned her coat. She would keep her job at the office. There were still ledgers to balance. There were still columns to add up.

  She would not tell the story of the four causes. She would let the single cause stand. It was the only way the fire would ever end.
