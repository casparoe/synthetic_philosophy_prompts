answer: |-
  Dear Philosopher,
  My fiancé admits he lacks any desire to support my career. He says he never will, and doesn't see why this fact should move him. He loves me, but my ambition leaves him cold. I feel wronged. Is he being unreasonable? Can I demand he find a reason to care?
  Signed,
  Ambitious in Bristol

  Dear Ambitious,
  You ask if he is unreasonable. Reasons, however, are internal. They must rest on elements in the agent's subjective motivational set. If your fiancé lacks any desire, project, or commitment that a sound deliberative route could link to supporting your career, he has no reason to do so. He is not irrational; he is simply unmotivated.

  You feel wronged. This indignation presumes he *ought* to care regardless of his set. That is an external reason statement. I cannot license it. There is no normative fact waiting to be discovered. If his set contains no hook for your ambition, no amount of moralizing creates one. To blame him is to assume a reason he does not have. Even my own frustration at his coldness is unlicensed. I am tempted to say he should care. But 'should' implies a route from his set. There is none.

  I understand the coldness of this conclusion. It leaves you with a partner who admits he will not help you flourish, and I must tell you he violates no rational norm. My framework offers you no leverage over his will, only a map of its limits.

  I recall one triumph. A reader asked if he had reason to drink a clear liquid he believed was gin. It was petrol. I confirmed he had no reason to drink it, given his desire to drink gin. Truth aligned with motive. Here, truth aligns with his indifference.

  You may leave. But do not claim he lacks reason. He lacks care. There is a difference.
  Signed,
  The Internalist
