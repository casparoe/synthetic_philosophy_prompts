prompt: |-
  hey, weird request but I think it'll be fun. A buddy of mine got me onto this old puzzle from Gödel, Escher, Bach. I have not read the book and I have zero philosophy background, I just read a blog post about it. The deal: you start with the string MI and you're allowed four rewrite rules, and the challenge is to produce MU. The rules as I remember them from the post — if a string ends in I you can tack a U onto the end; you can double whatever comes after the M; you can replace any run of three I's with a single U; you can delete any pair of adjacent U's. I'm going off memory so if I mangled one of those, use the correct version, I'd rather the piece be accurate than match my half-remembered blog post. And the punchline of the puzzle is that MU is unreachable, but you can only see that if you stop grinding out derivations and reason about the rules themselves from the outside. My buddy says the book has a term for that move, something about jumping out of the system.

  What I want is a satirical piece in a genre I actually live in: a blameless incident postmortem, the kind we write at work after something burns for a week.

  Setup: some company shipped a "Derivation Engine" service whose headline feature was a customer request to produce MU from MI by searching the state space. It's been brute-forcing this for years, burning real money, and now it's a Sev-2. I want the doc itself — markdown, standard section headers (Summary, Impact, Timeline, Root Cause Analysis, Contributing Factors, Action Items, Lessons Learned), maybe an incident ID and a severity. Around 650 words.

  The jokes I'm after:

  - It has to be deadpan corporate engineering voice throughout. Nobody winks, nobody mentions a book or a puzzle — in-universe this is a completely ordinary feature request from a completely ordinary customer, and the whole thing is treated as a production incident.
  - The humor should come from getting the actual content right, not from generic tech-bro parody. The four rules should show up correctly (maybe in a "background" subsection), and the root cause section should land the real invariant — that the number of I's in any reachable string can never be a multiple of three, and MU has zero I's — explained plainly enough that a reader who's never heard of the puzzle can follow it.
  - Include a staff engineer who is convinced this is a throughput problem and wants to shard the search, add replicas, maybe write a custom allocator, and whose whole theory of the incident is "we just havent searched deep enough." Then a new grad in their second week who stops enumerating, stares at the rules, and closes the ticket as won't-fix — and the org's profound discomfort at a resolution category like "impossible," which is not one of the options in the dropdown.
  - The Timeline section should be funny mainly because of how long the thing ran. Timestamps are fine.
  - At least one action item should be pure process theater, e.g. a CI check that fails the build on unreachable specs, or a new design-review gate requiring an impossibility proof before any search job is approved.
  - Target is the reflex that treats any unmet spec as a scaling problem, plus the process machinery that grows around it. Don't target any real person — made up names and roles only.

  Readable for a normie, satisfying for someone who's read the book. Don't add a preamble explaining the joke at the end, that would ruin it.
