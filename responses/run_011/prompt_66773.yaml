prompt: |-
  For eleven years I have sat on the panel that awards our trust's bursaries: about forty a year from roughly twelve hundred applications, decided by six volunteers with no training in economics and ten minutes per file. We rank applicants on parental household income, and I have become convinced this measures the wrong thing. Much of what a family hands on never appears in a death or in an income figure — a deposit on a flat, school and university fees, rent covered during an unpaid internship, a car, a business introduced rather than bequeathed. My own way of putting it, which may be crude, is that advantage should be counted in capital-years: the sum handed over multiplied by the number of years the recipient has had the use of it. On that measure a £100,000 deposit given at twenty-two has done far more work by the time someone is sixty than the same £100,000 arriving when a parent dies at eighty-five, which is nevertheless the transfer most of the debate about taxing estates is focused on. (I know a gift made within seven years of death can still be caught, but the money that matters is usually spent decades earlier.)

  Please turn this into a procedure my panel could actually run: the questions to ask of each file in order, what counts as a sufficient answer to each, how to estimate capital-years from what an applicant can honestly report without demanding intrusive documentation, and where the procedure must stop and hand the case to a human being because what remains is a question of values. Flag every step that is a judgement call dressed up as a rule. Then apply it to three files of your own construction, including one where it recommends a candidate the panel will resist, and one where a parent gave up their earnings to care for a disabled child, so that no money moved but a great deal was handed on. Say plainly what the procedure cannot do, and whether ranking people by what their families gave them is coherent in a scheme whose whole point is to help those who received least. No references or reading list — I want the reasoning, not the names. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** A first-person account of a bursary panel member (11 years experience, 40 awards/year, 1200 applications, 6 volunteers, 10 mins/file). The core argument is that parental *income* is a poor proxy for advantage. The author proposes "capital-years" (sum handed over $\times$ years of use) as a better metric. Examples given: deposits, fees, rent during internships, cars, business introductions.
      *   **Task:** Turn this philosophy into a *workable procedure* for the panel.
      *   **Requirements:**
          *   Questions to ask in order.
          *   Criteria for sufficient answers.
          *   Method to estimate "capital-years" without intrusive documentation (honest reporting).
          *   Identify where the procedure stops and human judgement takes over (values).
          *   Flag judgement calls disguised as rules.
          *   Apply to three constructed files (one controversial recommendation, one involving unpaid care/no money moved).
          *   State plainly what the procedure *cannot* do.
          *   Address the coherence of ranking by family gift in a scheme meant to help those who received least.
          *   **Style:** British English. No references/reading list. Reasoning focused.

  2.  **Deconstruct the "Capital-Years" Concept for a Bursary Panel:**
      *   *Problem:* Volunteers have 10 minutes per file. They can't audit bank statements. They can't calculate exact compound interest or opportunity costs.
      *   *Solution:* A scoring rubric based on self-declared categories of support, weighted by timing (age of recipient).
      *   *Constraint:* Must be fair, minimally intrusive, and actionable within 10 minutes.
      *   *Ethical Check:* Is ranking by "family gift" coherent? Yes, if the goal is equity of opportunity, but it risks penalising family cohesion or non-monetary support.

  3.  **Drafting the Procedure:**
      *   *Step 1: Income Check (The Baseline).* Keep the existing income filter but acknowledge its limitation.
      *   *Step 2: Capital Transfer Inventory.* List specific types of support (housing, education, business, cash).
      *   *Step 3: Timing Weighting.* Apply the "capital-years" logic. Support at 18 is worth more than support at 30.
      *   *Step 4: The Non-Monetary Gap.* Address the "care" aspect (the disabled child example).
      *   *Step 5: The Human Handover.* Where does the math fail? (Values, exceptional circumstances).
      *   *Flagging Judgement Calls:* I need to explicitly mark where a "rule" is actually a subjective decision (e.g., weighting factors).

  4.  **Developing the Three Case Studies:**
      *   *Case A (The Standard):* Low income, low capital support. Should win easily.
      *   *Case B (The Resistant Recommendation):* High income *now*, but low capital support? Or perhaps moderate income but *zero* capital support compared to peers with same income. Let's go with: Parent has high income *now*, but applicant is estranged or parents spent money on themselves, not the child. The panel will resist giving money to someone with "rich parents," but the procedure says they received no *capital advantage*.
      *   *Case C (The Care Scenario):* Parent gave up earnings to care for disabled sibling. Income is low, but not because of lack of opportunity, and no capital was transferred. In fact, the applicant might have had *less* support because resources went to the sibling. The procedure needs to capture "opportunity cost" borne by the family that didn't benefit the applicant.

  5.  **Addressing the Coherence Question:**
      *   Does ranking by "what families gave" make sense for a bursary?
      *   Argument: Yes, if the goal is to level the playing field of *accumulated advantage*.
      *   Counter-argument: It punishes those with supportive families regardless of current need.
      *   Conclusion: It's coherent only if defined as "remedying historical inequity of start," not "alleviating current poverty."

  6.  **Refining the Tone and Language:**
      *   British English (e.g., "programme," "centre," "£", "whilst").
      *   Professional, analytical, slightly critical (matching the prompt's tone).
      *   No fluff, no citations.

  7.  **Step-by-Step Drafting (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the constraint (10 mins).
      *   *The Protocol:* Break it down into Sections A, B, C.
      *   *The Flags:* Use bold or brackets to indicate [JUDGEMENT CALL].
      *   *The Cases:* Write them clearly.
      *   *The Limitations:* Be honest about gaming the system and the emotional toll.
      *   *The Coherence:* Tackle the philosophical tension.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "capital-years" calculable in 10 minutes?
      *   *Fix:* Simplify it to "Support Windows." Age 18-25 = High Weight. Age 25+ = Low Weight. Don't ask for exact multiplication, use bands.
      *   *Critique:* How to handle the "care" case without money moving?
      *   *Fix:* Add a "Family Resource Diversion" question. Did resources go elsewhere?
      *   *Critique:* The prompt asks to flag judgement calls dressed as rules.
      *   *Fix:* I will insert specific notes like **[JUDGEMENT CALL]** throughout the procedure.
      *   *Critique:* Ensure the "Resistant Candidate" is truly resistant.
      *   *Fix:* Make sure their parents *have* money, but haven't *given* it. The panel hates giving to "rich kids," even if the rich kids are financially independent/estranged.

  9.  **Final Polish:** Check British spelling (programme, favour, centre). Ensure the distinction between income and capital is clear. Ensure the "care" case is handled with nuance (it's not capital, it's opportunity cost).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **Protocol for Assessing Intergenerational Advantage (The Capital-Years Audit)**

  **Objective:** To supplement household income data with a rapid assessment of transferred capital and opportunity, acknowledging that advantage is a function of *timing* as much as *amount*.

  **Constraints:** Six volunteers, ten minutes per file, no forensic auditing capabilities. Reliance on self-declaration verified by spot-checks only.

  ---

  ### Part 1: The Procedure

  **Step 1: The Income Baseline**
  *   **Action:** Record declared parental household income.
  *   **Rule:** If income is below the trust's poverty threshold, award maximum 'Need' points. If above the upper threshold, flag for Step 4 scrutiny.
  *   **[JUDGEMENT CALL]:** Setting the poverty and upper thresholds is a political decision, not an economic one. We pretend these lines are natural; they are not.

  **Step 2: The Capital Inventory (Self-Declared)**
  Ask the applicant to tick boxes for support received *specifically for them* (not general household spending).
  1.  **Housing:** Deposit for purchase, or rent paid directly by family.
  2.  **Education:** Private school fees, university tuition not covered by loans, unpaid internship support.
  3.  **Business/Asset:** Cash gift >£5,000, vehicle provided, business stake/introduction.
  4.  **Debt:** Student loans or credit card debt cleared by family.

  *   **Sufficient Answer:** A tick box with a rough value band (£0, £1–10k, £10–50k, £50k+). No receipts required at this stage.
  *   **[JUDGEMENT CALL]:** We accept self-reporting to save time. This invites gaming, but assumes moral hazard is lower than the administrative cost of verification.

  **Step 3: The Timing Weight (The 'Capital-Years' Proxy)**
  Calculate a 'Support Score' based on *when* the support was received.
  *   **Age 18–25:** Multiply value by 3. (Early capital compounds in career and housing security).
  *   **Age 26–35:** Multiply value by 1.
  *   **Age 35+:** Multiply value by 0. (Too late to alter trajectory for the purpose of this bursary).
  *   **Inheritance expected but not received:** Count as 0.

  *   **Sufficient Answer:** Applicant states age when support was received.
  *   **[JUDGEMENT CALL]:** The multipliers (3, 1, 0) are arbitrary. We assert that £10k at 22 is worth £30k at 35. This is theoretically sound but numerically made up.

  **Step 4: The Resource Diversion Check (Non-Monetary Transfer)**
  Ask: *Did your family forego earnings or capital to support another member (e.g., disabled sibling, elderly grandparent) rather than you?*
  *   **Yes:** Add a 'Disadvantage Premium' to their score.
  *   **No:** Standard scoring.
  *   **Sufficient Answer:** A brief written statement (max 50 words).
  *   **[JUDGEMENT CALL]:** Valuing unpaid care as 'disadvantage' for the applicant implies the applicant *should* have been the beneficiary. This is ethically fraught.

  **Step 5: The Handover Point**
  The procedure stops here. Any file where the 'Support Score' contradicts the 'Income Baseline' (e.g., High Income / Low Support Score) must be reviewed by the full panel.
  *   **Reason:** This is no longer arithmetic; it is a question of values. Do we punish the estranged child of wealthy parents? Do we reward the child of modest parents who scraped together a deposit?

  ---

  ### Part 2: Application to Three Files

  **File A: The Standard Case**
  *   **Income:** £22,000 (Below threshold).
  *   **Capital Inventory:** None. No deposit, no fee support.
  *   **Timing:** N/A.
  *   **Diversion:** No.
  *   **Procedure Output:** High Need, Low Support Score. **Recommend Award.**
  *   **Panel Reaction:** Unanimous. This is the intended target.

  **File B: The Resistant Recommendation**
  *   **Income:** £150,000 (Above threshold).
  *   **Capital Inventory:** None. Applicant estranged from parents since 18. Parents spent wealth on lifestyle, not child.
  *   **Timing:** N/A.
  *   **Diversion:** No.
  *   **Procedure Output:** Low Need (due to income), but Zero Support Score. The protocol suggests the 'Income Baseline' should be overridden by the 'Support Score' in handover.
  *   **Recommendation:** **Award.**
  *   **Panel Reaction:** **Resistance.** Volunteers will argue that the parents *could* pay, even if they *won't*. The procedure treats the family as an economic unit; the reality is the applicant is an independent unit. Giving a bursary here feels like subsidising wealthy parents' stubbornness. The procedure identifies the lack of advantage; the panel feels the moral hazard.

  **File C: The Care Scenario**
  *   **Income:** £28,000 (Low, but above poverty threshold).
  *   **Capital Inventory:** None.
  *   **Timing:** N/A.
  *   **Diversion:** Yes. Mother left workforce when applicant was 10 to care for disabled older brother. Family savings depleted on care equipment.
  *   **Procedure Output:** Moderate Need. High 'Disadvantage Premium'.
  *   **Recommendation:** **Award.**
  *   **Panel Reaction:** Sympathetic, but confused metrics. No money moved *to* the applicant, yet the family's capacity to generate capital was destroyed. The procedure captures this via Step 4, but it highlights a flaw: we are rewarding the applicant for the sibling's disability.
  *   **Refinement:** The 'Disadvantage Premium' acknowledges that 'capital-years' includes *negative* capital (depletion of resources).

  ---

  ### Part 3: Limitations and Coherence

  **What the Procedure Cannot Do**
  1.  **Detect Lies:** Without demanding bank statements, we rely on honesty. A wealthy family can coach a child to say "no support received."
  2.  **Value Social Capital:** A "business introduction" is ticked, but we cannot measure the value of a phone call from a CEO father versus a local shopkeeper uncle. We treat them as equal ticks.
  3.  **Account for Geography:** £50,000 buys a flat in Sunderland; it buys a garage in London. The procedure treats the cash sum as identical, ignoring purchasing power parity.
  4.  **Resolve Estrangement:** As seen in File B, the procedure assumes money *available* to the family is money *available* to the applicant. It cannot adjudicate family dynamics.

  **Is Ranking by Family Gift Coherent?**
  The scheme's point is to help those who received least. Ranking by "what families gave" is coherent *only if* we define the bursary as **reparative** rather than **relief-based**.

  *   **Relief-based:** Alleviate current financial hardship. (File B should be rejected; parents have money).
  *   **Reparative:** Correct for unequal starting lines. (File B should be accepted; the starting line was distant despite parental wealth).

  If we adopt the 'capital-years' metric, we admit that income is a lagging indicator. A student with high-income parents who received no capital support is statistically rarer than one with low-income parents who received a deposit (via grandparents). However, by focusing on what was *given*, we risk penalising family solidarity. A family that pools resources to buy a home together is 'advantaged' by this metric, even if that pooling required immense sacrifice.

  **Conclusion**
  This procedure forces the panel to admit that they are not measuring poverty; they are measuring head-starts. It is a more honest metric for social mobility, but it requires the volunteers to accept that some applicants with wealthy parents are more disadvantaged than some with poor parents. If the panel is unwilling to make that value judgement, the procedure must be discarded, and income alone must remain the proxy, with the admission that it is flawed.

  **[FINAL JUDGEMENT CALL]:** Deciding whether to implement Step 5 (Handover) is the deciding factor. If the panel overrides the handover to reject File B, they have rejected the 'capital-years' theory in practice, regardless of adopting the form.
