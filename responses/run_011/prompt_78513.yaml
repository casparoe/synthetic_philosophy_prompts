answer: |-
  Dear Friend,

  It is a pleasure to hear from a fellow traveler in the weeds of this stuff, especially one keeping folk songs alive while wrestling with the metaphysics of copying. You have put your finger on the exact nerve that Dawkins touched and then quickly bandaged over in that final chapter. The tension you feel between the clean logic of genetics and the messy reality of culture is not a bug in your thinking; it is the central problem of cultural evolution theory. You want a principle that respects your intuitions without collapsing into contradiction, and I believe we can find one that saves most of your verdicts while clarifying why the others must fall.

  The principle you sketched on the setlist is strong, particularly the clause about botches persisting, but as you noticed, it is too broad. It lets in vowel shifts and rumors because they both involve changes that stick. To tighten it, we need to distinguish between the copying of a specific form and the reconstruction of a function. Here is the principle I propose we test against your cases: something is a cultural replicator if and only if it persists through a causal chain of transmission events where the specific structural details of the parent item are responsible for the structural details of the child item, allowing for the inheritance of arbitrary or non-functional variations. This adds two crucial constraints to your botch test. First, it demands a causal link of form, not just content. Second, it requires that the variation be capable of being arbitrary, meaning it does not have to be optimal or functional to survive.

  Let us walk through your eight cases with this lens. The jumping-rope chant passes easily because the specific words and rhythm are copied because they were heard, not because they are the best possible chant. Your grandmother's soup also passes, and I urge you to keep this verdict firmly. Even though the fidelity is low, the causal chain is there; you add cumin because she added cumin, not because cumin is objectively necessary. The specific recipe structure is the replicator, even if it mutates rapidly. The ballad variants are the same case on a larger scale; the tune persists because singers copy what they hear, errors and all. The scientific theory also passes, and you should not be bothered by the Lamarckian element. In cultural evolution, acquired characteristics are inheritable because the instruction manual is read and rewritten by every generation. The theory replicates because scientists copy the previous paper's structure and arguments, modifying them intentionally. The liturgical rite is a replicator, and your nervousness about the institution is a category error we can dissolve. The rite is the replicator; the institution is the selection environment or interactor that punishes mutations. The institution ensures high fidelity, but the rite is still the thing being copied.

  Now let us see why this principle excludes the three cases you rejected. The rumor fails because you identified the mechanism correctly as rebuilding from gist. When you hear a rumor and retell it, you are not copying the sentence structure; you are reconstructing a narrative to fit the semantic content. The specific words are not causally linked to the previous specific words, only the meaning is. The meaning is an attractor state that human memory gravitates toward, but it is not a replicator because the form is not inherited. The vowel change fails for a different reason. A vowel shift is not an item; it is a change in the rules of replication themselves. It is like a mutation in the enzyme that copies DNA rather than a gene being copied. The words are the replicators; the vowel shift is a historical trend in how those replicators are pronounced. Finally, the ad slogan fails because the variation is not entering the lineage before selection. The agency tests variants in private and only releases the winner. There is no public lineage of imperfect copies accumulating errors; there is a single designed artifact released into the wild. It may replicate once released, but the process you described is design, not evolution.

  This principle also handles the new cases you raised. The house coding style that spreads by copy-paste is a replicator because the code structure is copied including its quirks. If a linter enforces it, the linter acts like the liturgical institution, increasing fidelity but not changing the replicative status. The joke template is a fascinating boundary case. The template itself is the replicator, while the filled-in joke is the phenotype. The structure A priest, a rabbi, and a minister walk into a bar persists while the content swaps. The structure is copied because it was heard, not because it is the only way to tell a joke. A dance step or handshake is definitely a replicator; motor patterns are copied with high fidelity, and if you learn a weird flourish from someone, you pass that flourish on. It passes the botch test perfectly. The word meme is the most reflexive case. It is a replicator that describes its own replication strategy. It survives because it tells you that ideas survive by copying. It is a virus that explains virology to the host.

  You asked whether this question is substantive or merely stipulative. It is both, but mostly it is a choice of tool. There is no fundamental particle called a replicator waiting to be discovered in the culture stream. Instead, asking is X a replicator is asking does treating X as a replicator help us predict how it will change over time. If you treat the vowel shift as a replicator, you will look for its parents and fail. If you treat the rumor as a replicator, you will look for structural fidelity and find only convergence. So the question is substantive in the sense that some models work and others do not, but it is not metaphysical in the sense of uncovering the soul of the object. You are carving nature at joints that allow for explanation, not finding natural kinds.

  If this principle forces you to change a verdict, I suspect the only real tension lies with the ad slogan. Once released, people do copy it, so it becomes a replicator in the wild, even if its birth was designed. But since your verdict was about the agency process, you are safe to keep it as a No. If you had to sacrifice a Yes to save the principle, the scientific theory is the most vulnerable because of the Lamarckian worry, but I would fight to keep it because instructed variation is the hallmark of culture. However, based on what you told me about your values, you care most about the soup and the ballad. Those are the heart of your session and your history. The principle I offered saves them robustly by prioritizing causal lineage over fidelity. The rumor and the vowel change are expendable losses; they are phenomena better explained by psychology and linguistics than by replication theory. The ad slogan is a borderline case depending on whether you look at its creation or its circulation, but excluding it honors your intuition about blind variation.

  So here is my advice for your setlist and your reading group. Stick with the Causal Lineage of Form. It respects the messy reality of folk transmission where the tune matters more than the accuracy, and it protects you from seeing evolution in every instance of human agreement. It allows you to say that the soup is alive in a way the vowel shift is not, because the soup has a genealogy of specific choices, while the vowel shift is just a drift in the medium. You can tell your reading group that the word meme is useful only when it points to this specific mechanism of heritable form, not as a synonym for any popular idea. And you can stop worrying about the institution versus the rite; the institution is the gardener, the rite is the plant. You are keeping the plants alive, and that is enough work for one lifetime.
