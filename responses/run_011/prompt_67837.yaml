      *   *The "Sloppiness":* The friend likely meant the treatment of the Anti-Realist response. The passage treats the Knowability Principle as a straw man that no sophisticated philosopher holds without qualification. The "restriction" strategy (Tennant's restriction to Cartesian statements) is the standard way out. Ignoring this makes the argument seem more devastating than it is in contemporary philosophy.

