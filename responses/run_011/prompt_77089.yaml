answer: |-
  1. **Where does the contradiction land when the maxim "I will make a lying promise to get money" fails?**
      *   **In the conception:** The practice of promising becomes impossible if everyone does this.
          *   *Position:* **Contradiction in Conception.** Generates perfect duties; the maxim is logically self-defeating as a universal law of nature.
      *   **In the will:** You cannot rationally will this as a universal law while maintaining your own ends.
          *   *Position:* **Contradiction in Will.** Generates imperfect duties; the maxim is volitionally inconsistent for a rational agent.
      *   **In the state of the world:** The outcomes would be disastrous if everybody did it.
          *   *Position:* **Consequentialist Slide.** A Singer-style generalization argument; treats the test as a rule-utilitarian calculation rather than a logical contradiction.
      *   **In the agent's standing:** You lack the authority to legislate this exception for yourself among co-legislators.
          *   *Position:* **Constructivist/Co-legislator.** Focuses on the standing to legislate rather than the content of the law; aligns with Rawlsian or Korsgaardian constructivism.

  2. **When testing "I'll steal on Thursdays" or "I'll take up the oboe", whose description of the maxim governs?**
      *   **The agent's own subjective description:** The maxim includes the specific day or instrument chosen by the agent.
          *   *Position:* **Subjective Maxim View.** Allows "Thursdays" to pass universalization (since not everyone steals on Thursdays); risks making the test too easy to pass.
      *   **The morally salient objective description:** The maxim is described as "stealing" or "developing talents" regardless of specific details.
          *   *Position:* **Moral Salience View.** Blocks "Thursdays" by abstracting to the relevant moral type; the standard reading to avoid loopholes.
      *   **The most specific true description:** The maxim includes all true facts about the action available at the time.
          *   *Position:* **Specificity View.** Risks making every maxim unique (blocking universalization entirely) or allows "Oboe" to fail if universalizing oboe-playing is pointless; solves innocent-maxim problems by over-specification.

  3. **Regarding "letting your talents rust" or "refusing all help", does the test generate duties or only veto them?**
      *   **Only vetoes them:** Passing the test means you are permitted to act, not obligated to adopt the end.
          *   *Position:* **Negative Liberty View.** The formula is a constraint on action; imperfect duties are wide obligations where you choose when to act.
      *   **Generates duties:** Passing the test obligates you to adopt the end (e.g., you must help, must develop talents).
          *   *Position:* **Positive Duty View.** A stronger reading where the formula commands the adoption of ends, not merely the permission of maxims; rare in contemporary literature.

  4. **In the "prosperous man refusing help" case, does the contradiction arise from what you do or what you endure?**
      *   **Agent-side:** You cannot will a system where no one helps, because you might need help later.
          *   *Position:* **Standard Contradiction in Will.** The contradiction lies in the agent's rational willing of a system of nature; this is the orthodox Kantian position.
      *   **Recipient-side:** You cannot will *being refused help* yourself; the test universalizes what you must put up with.
          *   *Position:* **Recipient-side Universalization.** **Note:** This is a confusion. It collapses into the Agent-side view because the test concerns what you will as a legislator, not what you suffer as a subject. No leaves are reachable only from this side; it is a misdescription of the Contradiction in Will.

  5. **When facing the "murderer at the door" or the Hegelian critique, what is the ultimate work done by the Formula of Universal Law?**
      *   **FUL does all the work:** The other formulas are merely restatements of this one.
          *   *Position:* **Strong Formalism.** Kant's explicit claim; the test is sufficient for all moral content without external input.
      *   **FUL is a cheap screen:** The Formula of Humanity carries the real content; FUL only filters obvious inconsistencies.
          *   *Position:* **Humanity-Primary.** Barons/Wood style; FUL is necessary but not sufficient, requiring Humanity to ground the value of ends.
      *   **FUL tests practical contradiction:** The action undermines its own purpose or conditions of action.
          *   *Position:* **Practical Contradiction (O'Neill/Korsgaard).** Focuses on the viability of the action in the world rather than logical consistency.
      *   **FUL is empty formalism:** Nothing ever fails it except by smuggling in empirical content.
          *   *Position:* **Hegelian Critique.** The test is vacuous; it cannot generate specific duties without prior moral assumptions.
      *   **FUL relies on practice-parasitism:** The maxim fails only because it free-rides on existing institutions others maintain.
          *   *Position:* **Free Rider/Institutional View.** The contradiction depends on the non-universality of the action within a standing practice.
      *   **Diagnostic Flags:**
          *   **Indistinguishable Leaves:** The **Practical Contradiction** and **Practice-parasitism** leaves often cannot be told apart in practice, as both rely on the maxim undermining the conditions of its own success within an empirical context.
          *   **Empty Combination:** Combining this item's **Hegelian Critique** (FUL is empty) with Item 1's **Contradiction in Conception** (The test reliably locates logical failures) creates an empty cell. This cell is empty because the view is **incoherent**; one cannot claim the test is vacuous while simultaneously relying on it to identify specific logical contradictions in conception without smuggling content.
