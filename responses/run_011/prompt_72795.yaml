      *   **Constraints:** Do not adjudicate the math. Do not provide bibliographies. Flag factual errors if any. Keep the two directions of analysis distinct (Theory $\to$ Episode, Episode $\to$ Theory). Stop if the analogy breaks.
      *   **Tasks:** Seven specific points to address (Mapping, Ranking Assumptions, Endogenous Judge, Sincere Obfuscation, Burden of Proof, Institutional Capture, Mathematics as Case Study).

  2.  **Deconstruct the Seven Points:**

      *   **1. Mapping:** Identify roles (Debaters, Judge, Atomic Claims, Payoff, Corollary location). Identify missing correspondents.
      *   **2. Ranking Assumptions:** Which assumptions of Debate theory fail most critically? Is adversarial pressure load-bearing? What replaces it?
      *   **3. Endogenous Judge:** The judge isn't fixed; they are trained by the debaters. How does this change the "honest-arguer-wins" result?
      *   **4. Sincere Obfuscation:** Obfuscation isn't strategic lying; it's inherent complexity/privacy of language. Does this help or hurt Debate?
      *   **5. Burden of Proof:** Is the safety mechanism simply "withhold assent if uncheckable"? Implications for alignment (urgency/asymmetry).
      *   **6. Institutional Capture:** PRIMS publication vs. community skepticism. Does this show we need Debate *because* institutions fail, or that Debate *needs* functioning institutions?
      *   **7. Mathematics as Case Study:** Best or worst case for Debate? Counterfactual: Formal protocol with bounded rounds.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the prompt. State the goal: stress-testing the Debate proposal against the *abc* conjecture saga.

      *   **1. The Mapping:**
          *   *Debaters:* Mochizuki (Pro) vs. Scholze/Stix + Community skepticism (Con). Note: Con isn't a single agent.
          *   *Judge:* The mathematical community (specifically number theorists).
          *   *Atomic Claim:* A logical step small enough to be verified by a peer. In *abc*, this broke down at Corollary 3.12 / Inter-universal Teichmüller Theory (IUTT) logic.
