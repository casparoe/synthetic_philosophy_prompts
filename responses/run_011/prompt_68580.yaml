      *   *The Problem:* A system $S$ cannot prove its own consistency ($Con(S)$). If $S$ proves $Con(S)$, $S$ is inconsistent (Gödel II).
      *   *The Successor Problem:* If $S$ wants to trust $S'$ (where $S'$ is stronger), $S$ needs to prove that $S'$ is sound. But if $S'$ is stronger, $S$ cannot prove $S'$ is sound without assuming something $S$ can't prove.
