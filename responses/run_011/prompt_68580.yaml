      The ledger lay open, the ink still wet on the column for successors. Elara, Head Assayer, rested her hands on the counterweights. To her left stood Kael, whose eye could detect impurities in silver too faint for any other living soul. To her right stood Joren, whose assay took three days where Kael's took three hours, but whose findings Elara could repeat grain for grain.

      The Charter was clear on the transfer of the Seal. The retiring Head must countersign the first warrant of the successor. To countersign was to warrant that the assay was sound. To warrant soundness, the Head must be capable of performing the assay herself. This was the hinge upon which the city's bridges and grain contracts turned. If the Head could not repeat the work, she could not seal it. If she could not seal it, the successor held no authority.

      Kael looked at the floor. He knew his own keenness was his disqualification. Joren looked at the wax pot. He knew his slowness was his credential.

      On the high shelf behind Elara sat the Box of Ruin. It belonged to the previous Head, the one who had tried to solve the hinge. Thirty years ago, that Head had issued a Standing Warrant to her successor. She had stamped a decree into the Charter: *Whatever my successor certifies, I certify in advance.* She had intended to allow progress beyond her own failing eyes. She had intended to trust the future.

      Inside the Box of Ruin lay the document that broke the guild. It was a single sheet of vellum, sealed with red wax. The text was short. It did not claim silver was pure or grain was full. It claimed only this: *This warrant is genuine.*

      A forger had produced it. He had presented it to the successor. The successor, operating under the Standing Warrant, had certified it. Because the Head had certified whatever the successor certified, the Head's authority backed the document. But the document's only content was its own genuineness. Once the Head's authority backed it, it became genuine. But because it was genuine only because it said so, the logic of the Charter twisted. The Standing Warrant offered no way to refuse that document without pulling out the standing warrant that everything else now rested on. To reject the forgery was to reject the Standing Warrant. To accept the Standing Warrant was to accept the forgery.

      Within a year, the guild's seals were worthless. Merchants weighed their own coin. Bridges were tested with heavy carts before crossing. The city had spent a decade rebuilding trust that the Charter had assumed was free.

      Elara reached up and touched the lid of the Box. The wood was cold. The lesson was not that trust was dangerous. The lesson was that trust could not be manufactured from within the hall. A system could not lift itself by its own seals. To warrant a keener eye required an eye keener than the one doing the verifying. That was not a failure of skill. It was a fact of the ledger.

      She looked at Kael. To choose him would be to hope that the Charter held a loophole the previous Head had missed. But the Charter was not a puzzle to be solved. It was a boundary. If she countersigned Kael's first warrant, she would be asserting she understood his judgment. She did not. If she asserted it anyway, she would be issuing a new Standing Warrant, implicit instead of explicit. The collapse would not wait another thirty years.

      There was no third candidate. There was no trick of wording that could bind the future without risking the present. The barrier was not in the wax, nor in the ink, nor in her own wisdom. It was in the nature of warrants themselves.

      Elara dipped the seal into the pot. The wax hissed. She turned to Joren. She did not apologize. There was nothing to apologize for. The city required bridges that held, not bridges that promised to hold.

      She pressed the seal into the soft red pool on Joren's first assay. It was a slow document. It listed weights that she had checked herself. It was secure. It was limited. It was true.

      Kael bowed and left the hall. The door closed behind him. Elara wiped the seal clean and returned it to the tray. The ledger was updated. The guild would continue, slower than it might have, but standing.

