prompt: |-
  Six weeks into a new job as a peer support specialist on a community mental health team, and a big chunk of my week is now sitting with people while they write psychiatric advance directives — the documents where you say, while you're well, what should happen if you get unwell and start refusing things. Half of it is logistics and phone numbers. The other half is one question I keep failing to answer well: when should the document say trust the future version of this person, and when should it say the future version of this person is precisely the one not to trust?

  The reason this is urgent rather than academic is that the first directive I helped draft has gone sideways. It got used last month to override a woman who said, perfectly coherently, that it wasn't her anymore and she'd changed her mind, and my initials are on the assessment note. I still think we did the right thing. I can't articulate why, and I have to do this several times a month now.

  I did a philosophy degree before I fell out of academia, and the thing rattling around in my head is van Fraassen's Reflection principle — roughly, if you're confident your future self will believe something, you should believe it now too, because your future self has everything you have plus whatever you're about to learn. Which sounds like a clean argument for writing "defer to future me" into everything. But it obviously can't be, because half the time the entire point of these documents is that future me will be sleep deprived, manic, terrified, or surrounded by people telling her she's fine. I also vaguely remember the principle needing qualification — something about the difference between changing your mind because you learned something and changing it because something was done to you — and I can't reconstruct where that line goes or what it's doing there.

  So: can you turn this into a procedure I can actually run in a room with someone, and that ideally they can run themselves with a piece of paper?

  Constraints. Sessions are 45 minutes, sometimes less. People are often anxious and I'm often interrupted. Our team runs from nurses to ex-patients to a psychiatrist who signs off at the end and has zero patience for epistemology. Nothing can involve numbers or formulas. I want questions to ask in order, what counts as a good enough answer to each, the point where it stops with "no, don't write that clause," and the point where it hands the decision to a human because it's a question of values rather than facts.

  Then tell me which distinctions from the actual theory have to survive the dumbing-down and which can be dropped, correct me where I've mis-stated what Reflection says, and be straight about where the procedure will misfire even when followed exactly.

  One thing I'll flag myself: most of what goes into these documents is about what someone wants done to them, not about what they believe is true, and Reflection is a principle about belief. Does that mismatch sink the whole idea, or is there a version that carries over?

  Run it on three that are live for me:

  1. M, bipolar I, stable right now on lithium. She wants a clause saying that if she's manic and refusing medication, the document wins and she gets treated. Fine. But she also told me, calmly, that she's come to think the diagnosis over-reads her life, that the medication flattens her, and that she expects to be convinced in a couple of years that she never needed it at all — and she wants that future conviction respected as well. She doesn't see the tension. My gut says the first prediction is distortion and the second is her thinking, and I dont have a way to show her that isn't just my preference.

  2. S, 24, sharp and furious, in the middle of a legal case against her stepfather. She wants the directive to bar him from visiting, and to state explicitly that if she later changes her mind — she expects she will, once the case ends and everyone starts pressuring her — the bar stays. I want to give her this. But the change she's predicting isn't mania or drugs, it's her learning things about her family and about her own feelings, which looks exactly like the kind of change Reflection says to defer to. Which of us has it right?

  3. T, 68, early memory problems, writing about refusing care at home. What he fears isn't distortion, it's that he won't remember making the document, or won't remember what the last crisis felt like. Does deference even make sense toward a future self who has strictly less information than I do? And does it change if the thing he's most afraid of is that future-T won't mind being neglected — that the change will be in how much things bother him rather than in what he believes?

  Finally: tell me how confident you are in the steps you're giving me, and single out the one claim in your answer you'd be least willing to defend if someone pushed on it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Peer Support Specialist (6 weeks in).
      *   **Task:** Helping clients draft Psychiatric Advance Directives (PADs).
      *   **Problem:** Struggling with the core philosophical tension of PADs: When to trust the future self vs. when to override the future self.
      *   **Incident:** A previous PAD was used to override a coherent refusal. User thinks it was right but can't articulate why.
      *   **Background:** Philosophy degree (familiar with van Fraassen's Reflection Principle).
      *   **Constraints:** 45-min sessions, anxious clients, interrupted, multidisciplinary team (nurses, psychiatrists, no patience for theory), no math/formulas. Needs a practical procedure (questions, stop points, hand-off points).
      *   **Specific Cases:** M (Bipolar I, ambivalent about diagnosis/meds), S (Legal case, anticipating coercion/family pressure), T (Early memory issues, fear of forgetting values).
      *   **Theoretical Question:** Does Reflection (about *belief*) apply to *desires/values*? Which distinctions matter? Where will the procedure fail?
      *   **Meta-Request:** Confidence level + least defensible claim.

  2.  **Deconstruct the Philosophical Core (Reflection Principle & PADs):**
      *   *Van Fraassen's Reflection Principle:* $P_t(A | P_{t+1}(A) = x) = x$. Roughly: Your current credence in A, conditional on your future credence being x, should be x.
      *   *User's Interpretation:* "If you're confident your future self will believe something, you should believe it now." (Close enough for practical purposes, though technically about *conditional* credence).
      *   *The Mismatch:* PADs are about *preferences/values/actions*, not just *beliefs*. Reflection applies to belief updating based on *learning*. It fails if the future self is compromised (drugs, coercion, mania, memory loss).
      *   *Key Distinction:* **Epistemic Improvement vs. Epistemic/Agential Corruption.**
          *   Trust future self if: They know more, thought longer, experienced more (Learning).
          *   Distrust future self if: Brain chemistry altered, coercion applied, memory lost, values eroded by illness (Corruption).
      *   *The "Ulysses Contract" aspect:* Binding the future self to protect the values of the present self against predictable irrationality.

  3.  **Develop the Procedure (The "PAD Protocol"):**
      *   *Goal:* A script/checklist for a 45-min session.
      *   *Structure:*
          1.  Identify the specific scenario.
          2.  Test the "Why" of the change.
          3.  Distinguish Learning vs. Corruption.
          4.  Decision Point (Write, Don't Write, Escalate).
      *   *Language:* Plain English, no jargon.
      *   *Safety Valve:* When to kick it to the psychiatrist.

  4.  **Address the Three Cases:**
      *   *Case M (Bipolar):* Tension between "Manic Refusal" (Corruption) vs. "Sober Re-evaluation" (Learning). The directive needs to distinguish *state* not just *preference*.
      *   *Case S (Legal/Coercion):* Tension between "Changing Mind due to Evidence" (Learning) vs. "Changing Mind due to Pressure" (Corruption). This is about *autonomy vs. influence*.
      *   *Case T (Memory):* Tension between "Forgetting Facts" (Information Loss) vs. "Forgetting Values" (Identity Loss). Reflection fails if the future self isn't the *same* agent.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the difficulty. Acknowledge the philosophy background but pivot to practice.
      *   **The Procedure ("The Future-Self Check"):**
          *   Step 1: Name the Scenario.
          *   Step 2: The "Why" Question (Why might you change your mind?).
          *   Step 3: The Source Test (Internal Growth vs. External/Internal Interference).
          *   Step 4: The "Sober/Safe" Condition (Can we define the state where you *are* trustworthy?).
          *   Stop/Hand-off points.
      *   **Theory Check:**
          *   Correct the Reflection Principle (it's about conditional belief, not blind deference).
          *   Belief vs. Desire (The "Humean" shift). We need a principle of *Value Stability*, not just Reflection.
          *   Key Distinction to keep: *Learning* vs. *Corruption*.
          *   Key Distinction to drop: Precise probabilistic conditioning.
      *   **Case Applications:**
          *   M: Split the directive. Manic state = override. Sober re-evaluation = respect.
          *   S: Focus on *coercion*. If the change is due to pressure, the directive holds. If due to genuine reconciliation, it might not. Hard to codify. Needs psychiatrist sign-off on "undue influence."
          *   T: Reflection fails here. It's about *Identity Continuity*. If he forgets the *value*, the directive protects the *past value*.
      *   **Confidence & Weak Point:**
          *   Confidence: Moderate/High on procedure utility, Low on philosophical purity.
          *   Weak Point: The assumption that we can reliably distinguish "mania" from "genuine change" in the moment.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too complex for 45 mins?
      *   *Fix:* Simplify the questions. Make them conversational.
      *   *Critique:* Did I answer the Belief vs. Desire mismatch?
      *   *Fix:* Explicitly address that Reflection is for *truth*, PADs are for *good*. We need to talk about "Value Corruption."
      *   *Critique:* The user mentioned the first directive went "sideways."
      *   *Fix:* Acknowledge that "sideways" might mean "it worked as intended but felt bad." The procedure can't fix the moral residue, only the clarity.
      *   *Case S:* This is tricky. If she changes her mind because she forgave him, is that corruption? No. If she changes because they wore her down? Yes. The directive needs to specify *conditions* of the change, not just the change itself.
      *   *Case T:* Dementia changes the *self*. This is the "Parfit" problem. The procedure needs to flag this as a "Hand-off to Psychiatrist/Ethicist" because it's legally/ethically murky.

  7.  **Final Polish:**
      *   Tone: Professional, empathetic, intellectually rigorous but practical.
      *   Formatting: Clear headings, bullet points for the procedure.
      *   Check Constraints: No formulas, 45-min friendly, addresses all 3 cases, confidence rating included.

  8.  **Final Review against User Prompt:**
      *   Procedure runnable in room? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Theory corrections? Yes.
      *   Belief/Desire mismatch addressed? Yes.
      *   Three cases run? Yes.
      *   Confidence/Weak point? Yes.

  *(Self-Correction on Reflection Principle)*: I need to be careful not to misrepresent van Fraassen. Reflection is about *predicting* your future rational belief. If you think your future self will be irrational, Reflection *doesn't* apply. That's the key. The user knows this but needs it operationalized.

  *(Self-Correction on Case M)*: The user says M expects to be convinced she never needed meds. This sounds like a *value shift* or a *belief update*. If it's a belief update based on new research, trust it. If it's based on "I feel bored on lithium," that's not epistemic. The procedure needs to tease this out.

  *(Self-Correction on Case S)*: The user asks "Which of us has it right?" The answer is: Neither of you knows yet. The directive must specify the *circumstances* under which the change is valid.

  *(Self-Correction on Case T)*: This is the hardest. If T forgets the document, the document stands. If T forgets *why* he valued independence, does the document stand? Yes, that's the point of a Ulysses contract. But does Reflection apply? No, because future T is epistemically worse off.

  Okay, ready to write.
answer: |-
  This is a heavy load to carry six weeks in. You are grappling with the central tension of psychiatric ethics: the conflict between *precedent autonomy* (the right of your past self to bind your future self) and *current autonomy* (the right of your present self to decide now).

  You are correct that van Fraassen's Reflection Principle is the wrong tool for the whole job, but the right tool for half of it. Reflection applies to *rational belief updating*. It says: "Trust your future self if you expect them to be *more* informed and *equally* rational." It explicitly does *not* apply if you expect your future self to be irrational, coerced, or chemically altered.

  The mismatch you flagged (Belief vs. Desire) is critical. Reflection is about truth ("What is the case?"). PADs are about values ("What is good for me?"). We need to swap Reflection for a principle of **Value Stability vs. Value Corruption**.

  Here is the procedure, the theory check, the case applications, and the confidence assessment.

  ***

  ### Part 1: The Procedure ("The Future-Self Check")

  **Time:** 15–20 minutes of the session.
  **Materials:** Pen, paper, the draft directive.
  **Goal:** Determine if a specific clause should override a future refusal.

  **Step 1: Name the Scenario (2 mins)**
  *   **Ask:** "Let's look at this specific rule. Picture the moment you might want to break it. What does that day look like? Where are you? Who is there? How does your body feel?"
  *   **Good Answer:** Specific details (e.g., "I haven't slept in 4 days," "My lawyer is pressuring me," "I can't remember my daughter's name").
  *   **Bad Answer:** Vague generalities (e.g., "I just feel different," "I might change my mind").
  *   **Action:** If the answer is vague, pause. Do not write the clause yet. Ask them to journal the scenario for next time.

  **Step 2: The "Why" Question (5 mins)**
  *   **Ask:** "In that picture, *why* are you changing your mind about this rule? Did you learn something new? Or does it feel like something is pushing you?"
  *   **Good Answer (Trust Future):** "I've met with three specialists and seen new data," or "We actually reconciled and I feel safe now."
  *   **Good Answer (Distrust Future):** "I feel invincible," "I'm too tired to fight," "They told me I have to sign or they'll leave," "I don't remember why this mattered."
  *   **Action:** Listen for the source of the change. Is it *integration* (learning) or *interference* (illness/coercion)?

  **Step 3: The "Sober/Safe" Condition (5 mins)**
  *   **Ask:** "If you change your mind, how will we know it's the *real* you talking and not the [illness/pressure/fear] talking? What needs to be true for us to listen to the new you?"
  *   **Good Answer:** "I need to be sleep-normal for a week," "I need to talk to my sister without my dad in the room," "I need to pass a memory check."
  *   **Bad Answer:** "I'll just tell you," "I'll know."
  *   **Action:** If they can define a *condition of competence*, write the clause with that condition attached. (e.g., "Override refusal UNLESS patient has been stable for 7 days.")

  **Step 4: The Stop/Hand-off Points**
  *   **STOP (Do Not Write):** If the client says, "I want this to stand even if I'm perfectly healthy and just bored of it." (This is not a PAD; this is a permanent restriction).
  *   **STOP (Do Not Write):** If the client says, "I want this ignored if I seem really convincing." (This nullifies the document).
  *   **HAND-OFF (To Psychiatrist):** If the distinction relies on medical judgment (e.g., "Unless my doctor says I'm manic") or legal judgment (e.g., "Unless the court says I'm coerced"). You cannot define medical capacity in a peer support session.

  ***

  ### Part 2: Theory Check (What to Keep, What to Drop)

  **1. The Mismatch (Belief vs. Desire)**
  *   **Verdict:** It does not sink the idea, but it requires a shift.
  *   **Correction:** Reflection Principle is $P_t(A | P_{t+1}(A) = x) = x$. It assumes the future self is a *better epistemic agent*.
  *   **Application:** In PADs, you are not betting on their future *knowledge*; you are betting on their future *agency*.
  *   **Keep:** The distinction between **Learning** (information gain) and **Corruption** (capacity loss).
  *   **Drop:** The idea that "future self has everything you have." In mania or dementia, the future self has *less* access to reality, not more. Reflection only holds if the channel between now and then is clear. If the channel is blocked by lithium toxicity or amyloid plaques, Reflection is void.

  **2. The "Done To You" Qualification**
  *   **Verdict:** This is the most important distinction to survive the dumbing-down.
  *   **Refinement:** It's not just "done to you" (coercion). It's also "done *inside* you" (neurochemistry).
  *   **Operationalization:** In Step 2, if the change comes from *internal noise* (voices, mood spikes, memory gaps), treat it like external coercion. Both are interference with the "true" signal.

  **3. Where the Procedure Will Misfire**
  *   **The "Grey Zone" of Recovery:** Sometimes people get better and genuinely change their values. They aren't manic; they just grew. The procedure might flag this as "corruption" because it looks like a deviation from the plan.
  *   **The "Convincing Madman":** A person can be highly coherent while manic. Step 3 tries to catch this with "conditions," but if the condition is "If I sound sane," it will fail.
  *   **Moral Residue:** This procedure clarifies the *logic*, not the *pain*. You will still feel bad when overriding a coherent refusal. That is a feature of the system, not a bug in your reasoning.

  ***

  ### Part 3: Running the Cases

  **Case 1: M (Bipolar I, Med Ambivalence)**
  *   **The Tension:** M wants to override manic refusal *and* respect future sober re-evaluation. She sees no tension because she conflates "future me" as a single category.
  *   **Run the Procedure:**
      *   *Step 1:* Split the scenarios. Scenario A: 3 days no sleep, spending sprees (Manic). Scenario B: 2 years stable, reading new research, feeling flattened (Sober).
      *   *Step 2:* In Scenario A, the "why" is neurochemical distortion. In Scenario B, the "why" is lived experience + data.
      *   *Step 3:* Set conditions. "Override refusal IF sleep < 4 hours/night for 3 days." "Respect refusal IF stable for 6 months + second opinion."
  *   **Verdict:** You do not have to choose one. The directive must be **state-dependent**, not just preference-dependent.
  *   **Your Gut:** You are right. The first prediction (mania) is distortion. The second (sober re-evaluation) is learning. Show her the split: "We write the rule for the Manic M, but we leave a door open for the Stable M."

  **Case 2: S (Legal Case, Family Pressure)**
  *   **The Tension:** S anticipates coercion disguised as reconciliation. Reflection suggests trusting future learning; PADs suggest protecting against coercion.
  *   **Run the Procedure:**
      *   *Step 1:* Scenario: Case ends, family visits, she agrees to see them.
      *   *Step 2:* Why the change? Is it "I found evidence he's safe" (Learning) or "I'm tired of fighting and they're nice now" (Corruption/Exhaustion)?
      *   *Step 3:* Condition. "Bar stands UNLESS an independent advocate confirms no pressure."
  *   **Verdict:** **You are right to hesitate.** This is not a medical question; it is a safety question. Reflection *does* apply if she genuinely forgives him based on new evidence. It does *not* apply if she submits due to fatigue.
  *   **Action:** Hand-off to the psychiatrist/social worker. This clause requires a verification mechanism you cannot build in 45 minutes. Write: "Bar stands unless reviewed by [Specific Third Party]." Do not let her make it self-certifying.

  **Case 3: T (Memory Loss, Value Erosion)**
  *   **The Tension:** Future T has *less* information. Reflection fails completely. This is about Identity Continuity.
  *   **Run the Procedure:**
      *   *Step 1:* Scenario: He is neglected but doesn't mind because he forgot what dignity felt like.
      *   *Step 2:* Why the change? Memory loss. This is epistemic degradation.
      *   *Step 3:* Condition. There is no condition where Future T is "more informed."
  *   **Verdict:** **Deference does not make sense here.** This is a pure Ulysses Contract. He is binding Future T *because* Future T is compromised.
  *   **Action:** Write the clause strongly. "Override current refusal IF memory score < X." Acknowledge to T: "This document assumes the You of now is the guardian for the You of then, because the You of then might not remember how to guard himself." This is emotionally heavy; ensure he understands he is overruling his future feelings, not just his future beliefs.

  ***

  ### Part 4: Confidence & The Weak Point

  **Confidence Level:**
  I am **80% confident** in the procedure's utility for your constraints. It translates the philosophical distinction (Learning vs. Corruption) into conversational prompts without requiring you to teach philosophy. It respects the 45-minute limit by forcing specificity early (Step 1).

  **The Least Defensible Claim:**
  The claim I am least willing to defend is in **Case 2 (S)**: *"Write: 'Bar stands unless reviewed by [Specific Third Party].'"*

  **Why:** In practice, finding a "Specific Third Party" willing to make that judgment call in a crisis is often impossible. Social workers are overworked; advocates aren't always available. This clause risks creating a "zombie directive"—one that technically exists but cannot be enacted because the condition for lifting it is too burdensome. It might leave S trapped in isolation not because of her illness, but because of administrative friction.

  **Mitigation:** If you cannot identify a specific human to verify the "no pressure" condition, the directive should probably default to the *current* wish (allowing the visit) with a safety plan, rather than a hard bar that requires a keyholder who doesn't exist. It is better to risk a bad visit than to guarantee isolation. I would adjust Step 4 to flag "Verification Feasibility" as a mandatory check before writing coercion-based clauses.
