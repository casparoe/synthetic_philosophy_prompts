answer: |-
  Good morning. Welcome to the first public meeting of the Regional Water Authority.

  Looking around this room, I see the history of the last decade. I see the state legislators who drafted the compact after years of stalemate. I see the mayors who campaigned against this entity, fearing loss of control. I see the engineers who know the aquifer better than anyone, and I see the ratepayers who simply want to know if they can afford to shower tomorrow.

  We are here because the litigation ended, but the water still flows beneath all our feet. We are here to operationalize a compromise. But before we discuss agendas or bylaws, I want to establish the principle that will guide our scrutiny of this authority's work. It is a rule of thumb I have relied on for years, and it is simple: **Give a decision to the smallest body that contains everyone who will bear its consequences, and where no such body exists, say so plainly rather than pretending a smaller one will do.**

  Our visiting scholar of comparative federalism recognizes this principle. He knows it as subsidiarity. I prefer the plain English version, because plain English is what ratepayers deserve. When the consequence of a decision spills over a border, the authority to make that decision must expand to match the spill. When the consequence stays local, the authority must remain local. If we cannot match the two, we must admit the mismatch rather than hide it behind bureaucratic language.

  This principle is the architecture of our new compact.

  Consider the aquifer itself. It does not respect municipal boundaries. If one town pumps aggressively, the water table drops for all eleven members. The consequence of supply planning is regional. Therefore, under this compact, basin-wide supply planning moves to this authority. We are the smallest body that contains everyone who bears the consequence of depletion. It would be absurd for nine towns and two counties to plan supply in isolation when the water ignores their maps.

  Conversely, consider the pipes in your street and the number on your monthly bill. If a main breaks in Oak Creek, it does not cause a main to break in Riverdale. If the Mayor of Riverdale decides to subsidize rates for local seniors, that cost does not appear on a bill in Oak Creek. The consequences of distribution and rate-setting are local. Therefore, those powers remain with the towns. To centralize them here would be to disconnect the decision from the consequence, insulating local officials from the cost of their own infrastructure choices.

  This structure is sound. But a compact is a living document, and we must be honest about where it falters. If we are to follow this rule of thumb, we must admit where the compact fails its own test. I see two immediate failures.

  The first concerns land use. The authority controls the supply, but the mayors in this room control the demand. You hold the zoning power. When you approve a high-density development, you capture the local tax revenue and the political credit for growth. But the draw on the aquifer is shared by all eleven members. The decision is local; the consequence is regional. This violates our rule. I say this not to antagonize, but to clarify: until land use is aligned with water planning, this authority will be managing a deficit created elsewhere. You will need to shift in your seats over this, because you cannot claim local control over zoning while expecting regional solutions for the water it consumes.

  The second failure lies in the emergency override clause drafted by the state legislators present today. The compact allows the state to impose emergency restrictions without a supermajority vote from this board. When those restrictions hit, the utility engineers here will bear the operational burden, and the ratepayers will bear the economic cost. The legislators will not pay the overtime for staff, nor will they field the angry calls when taps run dry. The consequence is local; the decision power is state-level. We must say plainly that this is a mismatch. We will not pretend the state bears the consequence when it pulls the lever.

  Acknowledging these failures brings me to my final point, regarding what you should expect from us.

  There is a temptation to promise that this new authority will make wiser decisions than the towns would have made alone. I will not make that promise. Centralization is not a synonym for wisdom. A regional board is capable of error just as a municipal council is.

  What I promise you is accountability.

  Under the old system of litigation and informal agreements, when the water pressure dropped, no one knew who to blame. Was it the upstream neighbor? The state regulators? The weather? Blame was as diffuse as the aquifer. Under this compact, the lines are drawn. When supply planning fails, you look to this board. When your pipes burst or your rates hike, you look to your town hall. When zoning strains the system, you look to your mayor. When the state overrides us, you look to the capital.

  We are not gathering here because we believe this board will be perfect. We are here because when things go wrong, you will know exactly who to ask why. And when things go right, you will know who to thank.

  For the next eight years, let us apply this rule relentlessly. If a decision's consequence bleeds across a border, bring it to this table. If it stays within a town, keep it there. And if we find a gap between the two, let us name it openly rather than papering it over.

  The water does not care about our jurisdictions. It only responds to pressure. Let us ensure that our political pressure matches the hydrological reality.

  Thank you. I now call this meeting to order.
