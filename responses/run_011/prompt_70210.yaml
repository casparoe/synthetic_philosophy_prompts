answer: |-
  *   **The Asymmetry of Novelty:** Inés argues that new interventions introduce *new* causal pathways and failure modes that did not previously exist, whereas the status quo operates within known constraints. The burden of proof lies on the introducer of novelty to show their addition won't break the system permanently, not on the regulator to prove the status quo is perfect.
  *   **Credibility vs. Conceivability:** "Credible" is anchored in mechanistic plausibility and historical precedent, not imagination. This distinguishes between engineering failure modes (credible) and science fiction scenarios (conceivable). It's not fear; it's a rigorous boundary based on what physics and biology say is possible, not what a writer can imagine.
  *   **The Collapse of Expected Value:** When the downside is permanent loss (civilizational or ecological), probability becomes mathematically irrelevant. You cannot trade off a finite benefit against an infinite or unbounded loss, regardless of how small the odds are. The "shape" of the loss trumps the likelihood of it occurring.
  *   **The Generation Horizon:** A generation is the limit of democratic accountability and ecological memory. If a mistake lasts longer than the people who made it can fix it, it's a tyranny over the future. This makes the principle political and ethical, not just technical—it ensures the actors live with the consequences of their risks.

  ***

  She doesn't look up immediately, finishing a note on the manila folder in front of her before capping her pen with a deliberate click. When she finally meets your eyes, there's a faint, tired amusement there, like she's watching a child try to explain gravity to a brick.

  "That's the first question everyone asks, and it's always delivered like it's a discovery. You're confusing stagnation with stability. My office doesn't regulate existence; we regulate *interventions*. If the status quo is killing you, fine—use a tool we already know works. Use a shovel. Use a vaccine we've tested for thirty years. But you don't get to release a self-replicating gene drive to fix a famine if the drive might rewrite the local ecosystem forever. Doing nothing keeps the known risks; doing *this* introduces the unknown ones. The burden is on the changer, not the keeper."

  She leans back, interlacing her fingers over her stomach, the leather of her chair creaking in the quiet office.

  "And let's be honest about this 'freezing' complaint. No one is telling you to freeze. They're telling you to walk instead of run when you're near a cliff. If your business model requires the possibility of permanent, unfixable damage to function, then your business model is the problem, not my proviso. I'm not here to save you from the costs of safety; I'm here to save us from the costs of your optimism."
