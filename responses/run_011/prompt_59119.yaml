  # Joint Statement on Composition in Modular Robotics

  **Introduction and Definitions**
  We, the undersigned, represent two opposing metaphysical views regarding **composition**, defined as the relation holding when some things make up a further thing. A **Universalist** holds composition always occurs; any collection of objects forms a whole. A **Nihilist** holds composition never occurs; only **simples** (objects with no proper parts) exist. We address the **Special Composition Question**: when do some things compose a further thing? We contrast our views with a **Life-Based View**, where composition occurs only when activities constitute a life. We agree on the following document to clarify our dispute for engineering purposes.

  ## 1. Agreed Claims

  1.  **Observational Equivalence.** Both sides agree on all physical measurements, sensor readings, and behavioral outcomes of the robots. *Non-vacuous:* A skeptic cannot claim either side ignores empirical data.
  2.  **Empirical Underdetermination.** No experiment can prove composition occurs or fails; metaphysics exceeds measurement. *Non-vacuous:* A skeptic cannot demand a scientific test for ontological claims.
  3.  **Ordinary Language.** Saying "one robot" is pragmatically useful, not literally true for both sides. *Non-vacuous:* A skeptic cannot claim either side denies common utility.
  4.  **Semantic Vagueness.** Uncertainty about when latching finishes is linguistic, not ontological. *Non-vacuous:* A skeptic cannot claim reality itself is fuzzy.
  5.  **Rejection of Middle.** Neither accepts life as the sole criterion for composition; it is arbitrary. *Non-vacuous:* A skeptic cannot claim we ignored the primary alternative view.

  ## 2. Disagreements

  | Disagreement | Formulation the universalist would sign | Formulation the nihilist would sign | Genuine or merely verbal | Feeds crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **Existence** | Composite objects exist alongside simples. | Only simples exist; composites are fictions. | Genuine | C1 |
  | **Counting** | There are many objects in this room. | There are only simples arranged room-wise. | Genuine | C1 |
  | **Truth Conditions** | "There is a robot" is literally true. | "There is a robot" is literally false. | Verbal | C1 |
  | **Parthood** | Robots are parts of the cluster. | Robots are not parts; they are simples. | Genuine | C1 |

  ## 3. Cruxes

  1.  **Verbal Dispute.**
      *   **Question:** Is our disagreement solely about the definition of "exists"?
      *   **Shared Consideration:** Analysis of ordinary language usage versus technical metaphysical definitions.
      *   **Universalist Prediction:** No; reality itself contains composites.
      *   **Nihilist Prediction:** Yes; we agree on facts, differ on words.
      *   **Who Moves:** Universalist moves if language analysis proves exhaustive.
      *   **How Far:** Universalist accepts nihilism as a notational variant.

  2.  **Life Criterion.**
      *   **Question:** Is biological life the only non-arbitrary cutoff for composition?
      *   **Shared Consideration:** The Biohybrid test case (Case E).
      *   **Universalist Prediction:** No; life is physically continuous with non-life.
      *   **Nihilist Prediction:** No; life is just simples arranged organism-wise.
      *   **Who Moves:** Both move against the Life-Based View if life is physical.
      *   **How Far:** Both reject the middle view entirely.

  3.  **Predictive Utility.**
      *   **Question:** Does adopting one view change engineering outcomes?
      *   **Shared Consideration:** System design decisions in software and hardware.
      *   **Universalist Prediction:** No; both model the system identically.
      *   **Nihilist Prediction:** No; pragmatics dictate design, not metaphysics.
      *   **Who Moves:** Both move if one view yields safer code.
      *   **How Far:** Loser adopts winner's engineering heuristics.

  ## 4. Test Cases

  **A. Latched Cluster**
  *   **Universalist:** One composite object exists.
  *   **Nihilist:** Simples arranged cluster-wise exist; no cluster object.
  *   **Life-Based:** No object; no life present.
  *   **Observational Difference:** None.
  *   **Case Quality:** Good.
  *   **Quality Note:** Clear case of mechanical composition.

  **B. Contact-free Swarm**
  *   **Universalist:** One composite object exists.
  *   **Nihilist:** Simples arranged swarm-wise exist; no swarm object.
  *   **Life-Based:** No object; no life present.
  *   **Observational Difference:** None.
  *   **Case Quality:** Good.
  *   **Quality Note:** Tests composition without physical contact.

  **C. Printed Part**
  *   **Universalist:** Partial object exists during printing.
  *   **Nihilist:** Simples arranged printer-wise exist; no part object.
  *   **Life-Based:** No object; no life present.
  *   **Observational Difference:** None.
  *   **Case Quality:** Ambiguous.
  *   **Quality Note:** Boundary of objecthood is temporally vague.

  **D. Symmetric Double**
  *   **Universalist:** One composite object exists.
  *   **Nihilist:** Simples arranged satellite-wise exist; no satellite object.
  *   **Life-Based:** No object; no life present.
  *   **Observational Difference:** None.
  *   **Case Quality:** Good.
  *   **Quality Note:** Tests composition in permanent unions.

  **E. Biohybrid**
  *   **Universalist:** One composite object exists.
  *   **Nihilist:** Simples arranged bio-wise exist; no bio-object.
  *   **Life-Based:** One object; muscle tissue constitutes life.
  *   **Observational Difference:** None.
  *   **Case Quality:** Good.
  *   **Quality Note:** Primary test case for the Life-Based View.

  **F. Software System**
  *   **Universalist:** Question does not apply; non-material.
  *   **Nihilist:** Question does not apply; non-material.
  *   **Life-Based:** Question does not apply; non-material.
  *   **Observational Difference:** None.
  *   **Case Quality:** Reject.
  *   **Quality Note:** Composition question applies to material objects only.

  ## 5. Verbal Residue

