prompt: |-
  I run the software side of a modular robotics program. Our units are identical tracked robots, each individually capable, that latch together at runtime onto a shared truss to act as one larger vehicle and unlatch again to work alone. Roughly half of our design reviews end in the same unresolvable argument: is a latched cluster one robot or six? A colleague of mine who did a philosophy degree insists this is a real question with a real literature — that metaphysicians call it the special composition question, meaning: when, if ever, do some things compose a further thing? — and that the two most systematic answers are the extremes, namely that any group of material objects always composes something, and that composition never happens at all, so that everything there is consists of simples arranged clusterwise, or arranged tablewise, or whatever. She also mentions a middle answer she attributes to van Inwagen, roughly that composition occurs only when the activities of the parts add up to a life.

  I have read none of this and I do not want a bibliography. I cannot look anything up and I cannot check references, so please supply none and do not quote any author; I would rather you write the whole thing out from first principles and keep it self-contained. Please also define every term you use, because I have no formal training.

  What I want is the document those two extremes should have produced after a serious adversarial collaboration. Write, in American English, the joint statement that a committed universalist about composition and a committed nihilist about composition could both sign in good faith: no straw men, no wording that flatters one side, and no verdict on which of them is right. Structure it as follows.

  1. **Agreed claims.** A numbered list of statements both signatories accept. I want these to be substantive, not throat-clearing: what they agree about the observable facts of my robots and about whether the two views disagree about those facts at all; what each side would and would not count as evidence; what each says about vagueness and about whether their answer admits of exceptions; what each owes by way of explaining why ordinary people say "that is one robot"; and where the two of them stand together against the life-based middle answer. For each claim, add one sentence explaining why a skeptic could not dismiss it as vacuous.

  2. **Disagreements.** A table with exactly these columns: `Disagreement` | `Formulation the universalist would sign` | `Formulation the nihilist would sign` | `Genuine or merely verbal` | `Feeds crux`. Every row must state the disagreement in terms each side recognizes as its own view; the last column names an identifier from section 3 or reads "none".

  3. **Cruxes.** The sub-questions such that settling them would actually move at least one of the two. For each crux give: an exact statement of the question; the argument, thought experiment, or consideration that *both* parties agree bears on it; each side's prediction about that consideration, written down now so it can be checked later; and an explicit statement of which side would move, and how far, if the prediction came out the other way. At least one crux must concern whether the dispute is merely verbal, and at least one must concern whether the two are right to reject the middle answer.

  4. **Test cases.** Apply both extreme views, and the life-based middle answer, to the six cases below. For each: what exists according to each of the three views, whether the views differ in anything I could observe or measure in the lab, and whether the case is a good case for this question at all. If a case is badly specified or trades on an ambiguity, say so and name the ambiguity — I would much rather have a case thrown out than have a verdict forced out of it.

     - **A. Latched cluster.** Six of our robots bolted to a shared truss for eleven days, running a single control loop, then unlatched overnight; each morning a different subset of four to eight units re-latches, and individual units are swapped for spares as they fail.
     - **B. Contact-free swarm.** A dozen drones that never touch each other, holding a fixed relative formation by radio coordination, jointly herding livestock. No shared material connection, no shared metabolism, no single controller.
     - **C. Printed part.** A metal bracket being built layer by layer in a powder-bed printer, photographed mid-build, when half the chamber is fused and half is still loose powder.
     - **D. Symmetric double.** A satellite launched as two independently functional halves joined by a bolted truss, each capable of the whole mission at reduced performance, never separated until end of life.
     - **E. Biohybrid.** A 3D-printed polymer chassis actuated by lab-grown muscle tissue under electrical stimulation, maintained in nutrient medium, with no nervous system.
     - **F. Software system.** A control system of mine spread across processes on many machines, with no single part that could do anything alone, which my team calls one system. For this case also answer the meta-question: does the composition question even apply to non-material systems, and are engineering intuitions about what counts as "one system" evidence for anything in the metaphysics?

  5. **Verbal residue.** A short section stating which portion of the dispute you judge to be merely verbal and which portion substantive, what turns on that judgment, and whether both signatories would accept your diagnosis. If one of them would not, record the disagreement instead of smoothing it over.

  After the document, give me a machine-readable summary: a single valid JSON object, double-quoted keys, no trailing commas, no comments, with exactly these top-level fields.

  - `"agreed_claims"`: array of objects with `"id"` (string, like `"A1"`), `"claim"` (string), `"non_vacuous_because"` (string).
  - `"disagreements"`: array of objects with `"id"`, `"topic"`, `"universalist_formulation"`, `"nihilist_formulation"`, `"classification"` (exactly `"genuine"` or `"verbal"`), `"feeds_crux"` (a crux id string, or `null`).
  - `"cruxes"`: array of objects with `"id"`, `"question"`, `"shared_consideration"`, `"universalist_prediction"`, `"nihilist_prediction"`, `"who_moves_if_wrong"` (string), `"how_far"` (string).
  - `"test_cases"`: array of objects with `"id"` (one of `"A"` through `"F"`), `"universalist_answer"`, `"nihilist_answer"`, `"life_based_answer"`, `"observational_difference"` (string; write `"none"` if there is none), `"case_quality"` (exactly `"good"`, `"ambiguous"`, or `"reject"`), `"quality_note"` (string).
  - `"verbal_portion"`: object with `"verbal_part"` (string), `"substantive_part"` (string), `"both_signatories_accept_diagnosis"` (boolean), `"dissent"` (string, empty if the boolean is true).

  Keep every JSON string under about sixty words so the object loads cleanly into a spreadsheet. The prose sections can be as long as the substance requires, but please do not pad them.
