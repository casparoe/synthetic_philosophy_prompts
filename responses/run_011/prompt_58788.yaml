  Your two-ledger test is sharp, and it cuts exactly where I want it to. In Province Two, the test passes cleanly: Ledger A has the food, Ledger B locks it away, and changing Ledger B saves lives without conjuring a single extra calorie. That is a crime, because the mortality is produced by the decision to withhold, not by the drought. But look closely at Province One. You say the treasury is empty because of a war, but that treasury itself is a ledger of claims. The decision to fund the war rather than maintain strategic reserves is a prior entry in Ledger B, a political choice about whose safety gets insured. If four percent die, I need to know if that mortality was the absolute physical limit of Ledger A, or if a different prioritization of claims could have saved even half of them.

  This brings me to your worry about the word "crime" losing its bite. It doesn't become trivial because the diagnosis dictates the cure. If you call Province One a natural disaster, you tell the next government to build better irrigation to boost Ledger A. If you call it a crime, you tell them to restructure Ledger B so that a war doesn't automatically void the poor's claim on survival. Starvation is never a measure of food supply, but always a measure of social protection. So yes, my theory indicts Province One too, not because they are morally identical to Province Two, but because in both cases the people died due to the structure of their claims, not the absence of grain. The word "crime" marks the preventability, not just the malice.
