answer: |-
  *Minutes from the Committee on Future Numbers*

  The sun pours gold into the deep green bowl of morning.
  We drink our fill and leave the rest for later times.
  Every face holds a story written in clear ink.
  There is enough bread for the few who gather here.

  Now more hands reach across the wood to take a share.
  The light divides but still remains a warm enough.
  No one goes hungry though the plates are crowded now.
  We say that adding life cannot make less of love.
  The room expands to hold the new and welcome breath.

  Another chair is brought to fit the space.
  The stories blur into a single hum.
  We count the heads and miss the names within.
  The bread is sliced so thin it shows the light.
  A life is worth the living still we say.
  But little stays behind when guests depart.

  So many shoulders touch in tight rows.
  The air grows warm and hard to draw deep.
  We speak in signs to save the short breath.
  The light is spread across too many.
  Each face is like the face before.
  The story is the same as all yours.
  We add one more to keep the high count.

  A sea of eyes that do not see.
  The bread is dust upon the tongue.
  We fill the room to bursting point.
  There is no space to stand or sit.
  The sum is high the life is low.
  A million whispers make no sound.
  We built this house to hold us all.
  Incomprehensibly.

  **Notes on the Form**

  **Audit:** Stanza 1 has 4 lines (12 syllables each, 48 total). Stanza 2 has 5 lines (11 syllables each, 55 total). Stanza 3 has 6 lines (10 syllables each, 60 total). Stanza 4 has 7 lines (9 syllables each, 63 total). Stanza 5 has 8 lines (8 syllables each, 64 total). Line counts increase by one per stanza; line lengths decrease by one syllable per stanza; total syllables increase per stanza. The final line is a single eight-syllable word.

  **Structural Mapping:** The expanding line count mirrors population growth, while the contracting line length mirrors the diminishing quality of individual lives. The rising total syllables enforce the utilitarian aggregate gain, creating the tension of the Repugnant Conclusion. Stanza 1 establishes the "very good lives." Stanza 2 executes the "mere addition" step. Stanza 3 begins the slide toward thinness. Stanza 4 depicts the undifferentiated mass. Stanza 5 arrives at the terminal state, where the final word acts as the broken transitivity—a verdict on the sum that cannot be reconciled with the parts.

  **Alternatives:** I considered a six-stanza structure to allow a slower descent, but the syllable math became unsustainable without forcing unnatural phrasing. I also considered a rhyme scheme to bind the stanzas sonically, but rejected it as too formal; the argument requires a feeling of inevitable slide rather than musical resolution.

  **Compression:** The poem compresses the "undifferentiated run" of the philosophical argument into Stanza 4; in reality, this slide involves many more steps. Additionally, the final word "Incomprehensibly" serves as both verdict and entreaty, slightly bending the argument's neutrality to provide the required sonic closure. The policy world is strictly exiled to the title to preserve the poem's imagistic integrity.
