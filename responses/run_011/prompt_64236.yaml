  ## 4. SCORING KEY

  Tally your answers for each cluster below. The dominant pattern indicates your leaf.

  | Cluster | Items | Leaf A (Descriptive) | Leaf B (Social Expectation) | Leaf C (Pure Coordination) | Leaf D (Personal Conviction) | Leaf E (Asymmetric Power) | Leaf F (Mutual Assurance) |
  | :--- | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Habit** | 6(d), 13(b), 14(b) | **3+** | | | | | |
  | **Judgement** | 1(b), 5(b), 7(b) | | **3+** | | | | |
  | **Matching** | 2(b), 3(c), 9(a) | | | **3+** | | | |
  | **Conscience** | 8(a), 11(b), 12(b) | | | | **3+** | | |
  | **Authority** | 4(a), 10(b), 12(a) | | | | | **3+** | |
  | **Assurance** | 1(a), 9(c), 10(c) | | | | | | **3+** |

  **Tie-Break Rule:** If two leaves have equal scores, check Item 12. If 12(b) was chosen, assign Leaf D. If 12(a) was chosen, assign Leaf E. If 12(d) was chosen, assign Leaf A.

  **Inconsistency Flag:** **The Oscillator.**
  *Criteria:* No cluster reaches 3, or scores are spread across 4+ leaves.
  *Feedback:* "Your answers suggest you apply different criteria to different cases; you may be treating similar regularities as fundamentally different kinds of things."

  ***

  ## 5. LIMITATIONS AND MERGERS

  No diagnostic instrument is perfect. The following pairs of leaves are difficult to separate with these items alone.

  **Leaf B (Social Expectation) vs. Leaf C (Pure Coordination)**
  *Issue:* Both involve doing what others do. The distinction rests on whether one feels a 'ought' (B) or merely a pragmatic need to match (C).
  *Resolution:* Item 5 (Ovation) and Item 2 (Corridor) attempt to split these. However, if a reader feels awkward (C) about not matching, it mimics judgement (B).
  *Recommendation:* If scores are tied between B and C, merge them. The practical difference is often negligible for policy.

  **Leaf E (Asymmetric Power) vs. Leaf F (Mutual Assurance)**
  *Issue:* Enforcement (E) and Assurance (F) both look like 'fear of consequences'.
  *Resolution:* Item 10 (Irrigation) and Item 12 (Shelter) test this. If the reader cannot distinguish between 'chief punishes' and 'channel runs dry', the items fail.
  *Recommendation:* Do not merge. The political implication is too vast. However, acknowledge that Item 10(b) and 10(c) may be conflated by readers who view agreement as backed by implicit force.

  **Leaf D (Personal Conviction) vs. Leaf A (Descriptive)**
  *Issue:* Deep habit can feel like conscience.
  *Resolution:* Item 12 is the critical separator (Stranger Community). If the behaviour holds when no one knows, it is D. If it drops, it is A.
  *Recommendation:* Rely on Item 12. If Item 12 is ambiguous, merge D and A as 'Non-Social Regularities'.

