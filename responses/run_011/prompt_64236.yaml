answer: |-
  # DIAGNOSTIC INSTRUMENT: REGULARITIES IN BEHAVIOUR

  ## 1. THE CONCEPTUAL SPACE

  Before assigning labels, we must map the terrain. Regularities in behaviour differ along three independent axes. This grid yields twenty-four theoretical cells (2 × 4 × 3). Most well-known positions occupy only a few; others remain empty for specific reasons.

  **Axis A: Interchangeability (The Swap Test)**
  Could the group adopt a different behaviour with equal success?
  *   **Yes:** The current way is not uniquely necessary (e.g., driving on the left vs. right).
  *   **No:** The current way is uniquely required for the outcome (e.g., queuing to avoid chaos vs. random rushing).

  **Axis B: Adherence Source (What keeps it in place)**
  Why does a person continue the behaviour?
  *   **Matching:** A desire to do as others do, provided others do it.
  *   **Reaction:** A belief that third parties will react badly to departures.
  *   **Uneasiness:** A feeling of wrongness that survives the total absence of onlookers.
  *   **Momentum:** Nothing beyond the inertia of past action; no 'ought' is felt.

  **Axis C: Origin Story (How it arose)**
  How did the regularity begin?
  *   **Drift:** Convergence with nobody choosing it.
  *   **Deal:** Negotiation, enactment, or explicit agreement.
  *   **Decree:** Imposition by one party on others unable to refuse.

  **Cell Analysis**
  Of the twenty-four cells, three are notable for their emptiness:
  1.  **Interchangeable + Uneasiness + Drift:** *Incoherent.* It is psychologically unstable to feel moral guilt about an arbitrary choice that arose by accident. *Example:* Feeling sinful for tying left shoe before right when no one cares.
  2.  **Non-Interchangeable + Matching + Decree:** *Unattractive.* If only one way works, matching others is redundant; physics or logic dictates the act, not social alignment. *Example:* Breathing air because others breathe air.
  3.  **Interchangeable + Momentum + Deal:** *Unexplored.* If an agreement was made, momentum is rarely the sole sustainer; memory of the deal usually persists. *Example:* A agreed-upon shortcut used after the agreement is forgotten.

  ***

  ## 2. THE DECISION TREE

  Answer the following questions based on your responses to the vignettes in Section 3. Do not worry about theoretical labels; answer as you would at a dinner table.

  *   **1. If everyone switched to the opposite behaviour tomorrow, would things work just as well?**
      *   **Yes:** Go to Question 2.
      *   **No:** Go to Question 4.

  *   **2. Do you follow this only because you see others doing it, with no sense that you 'ought' to?**
      *   **Yes:** **Leaf A (Descriptive Regularity).**
      *   **No:** Go to Question 3.

  *   **3. Do you follow this because you believe others expect you to and would judge you if you didn't?**
      *   **Yes:** **Leaf B (Social Expectation).**
      *   **No:** **Leaf C (Pure Coordination).**

  *   **4. Would you still do this if you were sure no one would ever know?**
      *   **Yes:** **Leaf D (Personal Conviction).**
      *   **No:** Go to Question 5.

  *   **5. Is the main reason you comply that a specific person or group has the power to hurt you?**
      *   **Yes:** **Leaf E (Asymmetric Power).**
      *   **No:** **Leaf F (Mutual Assurance).**

  *(Leaf G is reserved for inconsistent scoring; see Section 4.)*

  ***

  ## 3. DIAGNOSTIC VIGNETTES

  Read each scenario. Select the option that best describes why the behaviour persists.

  **1. The Pub Round**
  In your local group, friends buy drinks in turns. If you take a pint, you buy the next round. If you skip your turn, friends stop buying for you. If everyone bought their own every time, it would work fine, but the round system feels binding.
  (a) You do it because you want them to keep buying for you.
  (b) You do it because it feels dishonest to take without giving.
  (c) You do it because everyone else is doing it.
  (d) You do it because the pub manager enforces it.

  **2. The Narrow Corridor**
  Two people meet in a tight hallway. Both step to the same side to pass. If both stepped the other way, it would work just as well. They do not speak.
  (a) They step aside to avoid bumping into each other.
  (b) They step aside because that is what people do here.
  (c) They step aside because they would feel awkward otherwise.
  (d) They step aside because a sign tells them to.

  **3. The Hyphenated Name**
  A married couple combines surnames. In your community, the husband's name usually comes first. In a different community, the wife's name comes first. Both systems work.
  (a) The order is fixed by law.
  (b) The order follows who earns more money.
  (c) The order follows local custom without legal force.
  (d) The order is random for every couple.

  **4. The Carving Knife**
  At a shared meal, one person carves the meat. If another tries, the first person looks annoyed. It does not matter who carves, only that one person does.
  (a) The carver claims the role to control portion sizes.
  (b) The carver does it because guests watch and judge.
  (c) The carver does it because it is their established role.
  (d) The carver does it because they are the only one strong enough.

  **5. The Standing Ovation**
  An audience claps after a show. Some stand, some sit. Eventually, all stand. If everyone sat, the applause would mean the same.
  (a) People stand because they see others standing.
  (b) People stand because they fear looking ungrateful.
  (c) People stand because they truly loved the show.
  (d) People stand because the actors demand it.

  **6. The Email Reply**
  When an email is sent to a group, some hit 'Reply All', some hit 'Reply'. In your office, 'Reply All' is standard for announcements.
  (a) You use 'Reply All' to ensure everyone sees your answer.
  (b) You use 'Reply All' because IT systems force it.
  (c) You use 'Reply All' because colleagues get cross if you don't.
  (d) You use 'Reply All' without thinking about it.

  **7. The Last Portion**
  A shared plate has one piece of food left. No one takes it. If everyone were hungry, they would eat it.
  (a) People leave it because they are full.
  (b) People leave it because taking the last bit is seen as greedy.
  (c) People leave it because the host might need it.
  (d) People leave it because the food looks unappealing.

  **8. The Apology Timing**
  After a minor mistake, a person apologizes. In your family, you apologize immediately. In a family you are visiting, they wait a day.
  (a) You apologize immediately to clear the air.
  (b) You apologize immediately because delay makes it worse.
  (c) You apologize immediately because that is your habit.
  (d) You apologize immediately because they demand it.

  **9. The Queue Re-form**
  A service window closes. The line dissolves. When it reopens, the line reforms in the same order. No one marked the spots.
  (a) People return to spots to keep their place.
  (b) People return to spots because the staff assign them.
  (c) People return to spots because it feels fair.
  (d) People return to spots because they memorized the order.

  **10. The Irrigation Rota**
  A village shares water from one channel. Farmers take turns. If one takes extra, the channel runs dry for others.
  (a) Farmers take turns because the water supply is limited.
  (b) Farmers take turns because the village chief punishes theft.
  (c) Farmers take turns because they agreed to a schedule.
  (d) Farmers take turns because they trust each other.

  **11. The Office Coffee (Own Community)**
  You work in an office with a shared coffee jar. When it is empty, you put money in for a new one. You will work here for years.
  (a) You pay because colleagues will see if you don't.
  (b) You pay because you feel rude taking without giving.
  (c) You pay because you want coffee tomorrow.
  (d) You pay because the office manager checks the log.

  **12. The Roadside Shelter (Stranger Community)**
  You stay one night at a remote shelter. There is a shared woodpile. You use wood. You will never return, and no one knows your name.
  (a) You stack the wood because locals might tell others.
  (b) You stack the wood because it feels wrong to leave a mess.
  (c) You stack the wood because you want the next person to have wood.
  (d) You do not stack the wood because no one will know.

  **13. The Elevator Silence**
  Strangers enter a lift. They face the door and do not speak. If they spoke, it would work fine.
  (a) They stay silent because talking feels intrusive.
  (b) They stay silent because others are silent.
  (c) They stay silent because signs forbid noise.
  (d) They stay silent because they are in a hurry.

  **14. The Weekly Seat**
  In a recurring meeting, one person always sits in the same chair. If they move, others look confused.
  (a) They sit there because it has the best view.
  (b) They sit there because it is 'their' chair.
  (c) They sit there because the boss assigned it.
  (d) They sit there because they arrived first once and kept it.

