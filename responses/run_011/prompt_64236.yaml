  ## 6. FEEDBACK SENTENCES

  Hand this section to the reader after scoring. It reveals the gap between casual language and technical analysis.

  **Leaf A (Descriptive Regularity)**
  "You treat this as a mere habit; in Lewis's sense, it is not a convention at all because it carries no 'ought'."

  **Leaf B (Social Expectation)**
  "You treat this as a social norm; Lewis would call this a convention only if the alternative was equally viable and the 'ought' derived from the need to match."

  **Leaf C (Pure Coordination)**
  "You treat this as a Lewisian convention in the strict sense: arbitrary, sustained solely by the desire to match others' actions."

  **Leaf D (Personal Conviction)**
  "You treat this as a moral rule; Lewis excludes this from convention because it holds even without an audience or alternative."

  **Leaf E (Asymmetric Power)**
  "You treat this as compliance under threat; this is not a convention but an imposition, as the regularity benefits the imposer disproportionately."

  **Leaf F (Mutual Assurance)**
  "You treat this as a solution to a cooperation problem; Ullmann-Margalit would call this a norm of cooperation, distinct from Lewis's coordination conventions."

  **Leaf G (The Oscillator)**
  "You treat these regularities inconsistently; your casual use of the word 'convention' is likely masking at least three distinct underlying mechanisms."
