answer: |-
  Your paraphrase of *A New Refutation of Time* is robust enough to sustain the argument. You have not flattened Borges into a thesis so much as you have extracted the metaphysical engine of the essay. Borges does argue that the present is self-sufficient, that succession is a mental synthesis rather than a sensory fact, and that the identity of the self is a fiction required to stitch these isolated presents together. The only necessary correction is to recall that Borges treats this conclusion with characteristic skepticism; he admits the refutation may be a sophistry, and he ends by expressing a personal desire for time to be real, even if logic suggests it is not. This emotional caveat is actually vital for your reading of the film, as I will explain.

  Regarding your second question: you have chosen the right Borges. *The Secret Miracle* concerns a suspension of objective time to allow for subjective completion. It is a miracle, a breach of natural law. *Memento* is not about time stopping; it is about the mechanism of identity failing within moving time. *A New Refutation of Time* is the correct partner because it challenges the reality of the sequence itself, not just the experience of it. Your framing is built on the correct text.

  Now, to your reading of the film and the three points of fragility.

  Your structural observation is astute. The convergence of the forward-moving black-and-white strand and the backward-moving color strand does create a formal singularity. If the film were purely a visual object, your reading would hold: the film is a machine that produces a single, eternal now. However, a film is also a narrative about agency, and this is where your reading encounters the cost you asked me to calculate. You are correct to suspect that explaining away the three fragile points would be dishonest. They are not bugs in your theory; they are evidence that the film argues against the very metaphysical conclusion you are applying to it.

  Let us press on the first point: the note on the photograph. You describe this as cross-temporal intention. If Leonard were truly a series of unconnected momentary selves, the note would be merely an object found in the present, like a stone or a scar. It would carry no authority. But the film treats the note as a command. The momentary self finds the note and obeys it. This implies that the past self had a theory of mind regarding the future self. For the note to function as a warning rather than just noise, the writer must anticipate that the reader will be continuous enough to care about the warning, yet broken enough to need it. This suggests Leonard operates on a hybrid model: he knows his memory will fail, but he assumes his will will persist. This contradicts the Borges-ian view that the will is as fragmented as the memory.

  The second point, the ending, is the most damaging to the momentariness reading. After the confrontation in the derelict building, Leonard is in a state of full clarity. He understands that he has already killed the man he was hunting. He understands that the man he is speaking to has been using him. He then makes a conscious decision to ignore this truth. He writes down information he knows to be false to ensure he has a reason to continue living. This is not a momentary self waking up with an archive; this is an architect designing a prison for his future selves. To deceive oneself across a gap of amnesia requires a continuity of purpose that transcends the gap. It requires a "I" that stands outside the flow of moments to manipulate them. If Borges is right and there is no succession, there is no one there to do the deceiving. The film explicitly shows Leonard performing the act of self-construction that Borges claims is always happening unconsciously. Leonard is not suffering from the absence of succession; he is manufacturing a false succession to survive the absence of memory.

  The third point, the accusation by the corrupt cop, reinforces this. The cop claims Leonard has been repeating this cycle for a year. This is an external observation of the body, but it implies an internal pattern of behavior. If Leonard were truly a series of random, self-sufficient instants, his actions would not cohere into a repeatable loop of hunting and killing. The fact that he can be manipulated into the same loop repeatedly suggests a psychological rigidity, a persisting character trait that survives the memory loss. The tragedy is not that he is a series of moments, but that his character is strong enough to rebuild the same narrative over and over, despite the lack of evidence.

  So, is the reading available? It is available as a description of the film's form, but it fails as a description of the film's ethics. The film uses the structure of a refutation of time to tell a story about the necessity of time.

  This leads to the final question: what does the film contribute to the question of whether selves persist that the essay on its own could not deliver?

  Borges's essay is a metaphysical exercise. It concludes that the self is a fiction, but it remains abstract. It does not tell us what happens to a human being who is forced to live as if that fiction were true. *Memento* provides the phenomenological cost of the Borges-ian reality.

  The essay argues that we are already momentary selves and simply do not notice. The film shows us what happens when we *do* notice. When the illusion of succession is stripped away by biology, the result is not liberation into the eternal present, but vulnerability and monstrosity. Leonard becomes a tool for others because he cannot verify his own history. He becomes a killer because he cannot verify his own justice.

  The film contributes the idea that the persisting self, even if it is a construction, is a moral requirement. Borges suggests the self is a grammatical convenience. *Memento* suggests the self is a ethical technology. Without the ability to link cause and effect, to bind the past to the future, moral responsibility collapses. Leonard cannot be blamed for his killings in the same way a continuous person could, yet he cannot be absolved because he consciously chooses to re-arm himself.

  The film adds a layer of horror to the essay. Borges finds a certain peace in the disintegration of time; he suggests that death is less terrible if the self is already fragmented. *Memento* argues that this fragmentation is a living hell. It shows that the "fiction" of the persisting self is the only thing that allows for trust, love, or justice. When Leonard loses the ability to believe in his own continuity, he does not become a pure observer of the present; he becomes a weapon.

  Your reading is intellectually elegant, but the film resists it. The film does not illustrate Borges's refutation; it dramatizes the human resistance to it. Leonard proves Borges right metaphysically—he is a series of moments stitched together by artifacts—but he proves Borges wrong ethically. He shows that we cannot live as if time is unreal. We must forge the chain of cause and effect, even if we have to lie to do it. The film's contribution is to assert that the truth of time matters less than the necessity of believing in it. The essay dissolves the self to save time from contradiction; the film reconstructs the self to save morality from collapse.
