prompt: |-
  I run a small conflict-intake office at a mid-size public university — think of it as the informal half of student conduct. People come to us instead of filing a formal charge: we can coach them, mediate, refer, or close the thing with no record. We can't make findings of fact and we can't sanction anyone, that's the formal office two floors up. We get about 25 intakes a month, I've got maybe 20 minutes per case, and two of the three people doing this with me are part-time staff with no background in sociology or philosophy whatsoever. So whatever you give me has to survive being handed to someone who has never heard of the theory it's built on and isn't going to look it up.

  The frame I want you to work from is the honor / dignity / victimhood account of moral cultures, the one Bradley Campbell and Jason Manning laid out in their microaggression paper and then in the 2018 book. As I've got it: honor cultures make social standing the main engine of social control, so people are acutely sensitive to insult and are expected to handle slights themselves, personally, sometimes forcefully, with little reliance on outside authorities. Dignity cultures say a person has a worth that an insult can't actually dent, so you're supposed to have a thick skin about minor stuff and bring in third parties — courts, deans, HR — only for harms that are serious. Victimhood cultures keep honor's hair-trigger sensitivity to slight but combine it with dignity's dependence on third parties, and then add the piece that makes it its own thing: moral status attaches to having been wronged, so publicizing the wrong, aggregating incidents, and performing for an audience become ways of making the claim stick. Please don't send me a bibliography or a reading list, I can't chase anything down.

  What I actually need is a triage procedure: ordered questions, what counts as a sufficient answer to each, the exit points (close it, coach the person to handle it directly, offer mediation, refer up to the formal office), and explicit markers on the steps that are really judgment calls wearing a procedure costume. Two things I want you to get right, because I think naive uses of this frame botch them. First, classify the interaction, not the person — I do not want a checklist that outputs a personality type. Second, the culture in play can switch mid-incident: a slight being handled dignity-style becomes a third-party case the moment someone screenshots it or an RA writes it up on her own initiative, so the procedure should track which channel the thing is currently traveling down. And the thing that keeps me up is that this whole frame reads like a credibility discount — if my staff hear "victimhood grammar" they'll quietly start treating those complaints as less real, which would be bad both morally and practically, since plenty of genuinely awful conduct arrives wrapped in exactly that vocabulary. Build the guardrail in, and then tell me where the guardrail leaks.

  Then run it on three cases shaped like ones we actually get. (1) A senior comes in about a classmate who keeps mangling her name after being corrected twice; she says she doesn't want him sanctioned, she wants it logged so it's on the record, and she's already posted a screenshot of the exchange to a public account with about four thousand followers. (2) A first-year says a guy in his hall said something to his face over a shared kitchen, he confronted him, it got heated, and then the RA documented it anyway — now he feels he has to press it or he looks like he backed down, and what he's asking me for is whether we can get the write-up deleted. (3) Eleven seperate reports in one term about the same TA, each one small on its own — interrupting, a remark about someone's accent, answering an email with a joke — and all eleven using nearly identical vocabulary. My gut says contagion; but I also know my gut is exactly the instrument that would let a serial offender hide inside a pile of trivia, and there's an unflattering third reading where our own log is the mechanism, because we built a third-party channel and then people used it.

  Finish by telling me what the procedure can't do and where it will misfire most often — and, the part I care most about, what would change your mind about using this frame at all. If there's some argument or finding that would make you tell me to throw it out and triage on something else entirely, say what it is and how I'd recognize it in my own caseload. Also point at the step in your own reasoning you think is most likely to be wrong. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Runs a small conflict-intake office at a mid-size public university (informal student conduct).
      *   **Constraints:** 25 intakes/month, 20 mins/case, staff includes part-timers with no theory background. Needs practical, actionable tools, no bibliographies.
      *   **Theoretical Frame:** Honor/Dignity/Victimhood moral cultures (Campbell & Manning).
      *   **Specific Requirements:**
          1.  Create a triage procedure (ordered questions, sufficient answers, exit points, markers of judgment calls).
          2.  Avoid classifying the *person* (classify the *interaction*).
          3.  Account for mid-incident culture switching (e.g., dignity to victimhood via screenshot).
          4.  **Crucial Guardrail:** Prevent staff from discounting credibility based on "victimhood grammar" (avoid moral judgment of the complaint's validity based solely on the frame).
          5.  **Apply to Three Cases:**
              *   Case 1: Name mangling, wants logging, posted publicly (4k followers).
              *   Case 2: Kitchen confrontation, RA documented, student wants write-up deleted to save face (honor/dignity clash).
              *   Case 3: 11 reports on one TA, small incidents, identical vocabulary (contagion vs. pattern vs. system-induced).
          6.  **Limitations & Falsification:** What the procedure can't do, where it misfires, and what argument/finding would make me (the AI) recommend throwing out this frame entirely. Identify my own weakest reasoning step.
      *   **Tone:** American English, professional, direct, pragmatic.

  2.  **Deconstruct the Theoretical Frame (Campbell & Manning):**

      *   *Honor:* Sensitivity to insult, self-help resolution, status-based.
      *   *Dignity:* Insults don't diminish worth, thick skin, third parties only for serious harm.
      *   *Victimhood:* Sensitivity to insult + Third-party reliance + Moral status via victimization (publicity, aggregation).
      *   *Risk:* Using this frame can lead to dismissing complaints as "culture war" posturing rather than addressing actual harm. The prompt explicitly warns against this ("credibility discount").

  3.  **Drafting the Triage Procedure:**

      *   *Goal:* Sort cases into pathways (Close, Coach, Mediate, Refer) without judging the *truth* of the claim, but rather the *mechanism* of resolution being sought.
      *   *Structure:* Intake -> Assessment -> Decision.
      *   *Guardrail:* Must emphasize that "victimhood culture" behaviors (publicity, aggregation) do not equal "false complaint." They equal a specific *strategy* of conflict resolution.
      *   *Steps:*
          1.  Identify the Harm (Objective vs. Subjective).
          2.  Identify the Desired Outcome (Private resolution vs. Public record vs. Sanction).
          3.  Identify the Audience (Direct parties vs. Administration vs. Public/Social).
          4.  Check for Culture Switch (Did it start one way and move to another?).
      *   *Exit Points:*
          *   Close: No policy violation, no desire for action.
          *   Coach: Dignity/Honor style (handle it yourself).
          *   Mediate: Both parties willing, low stakes.
          *   Refer: Policy violation, safety risk, or demand for sanction.

  4.  **Refining the Guardrail (The "Credibility Discount" Problem):**

      *   Staff might hear "victimhood" and think "snowflake" or "manipulative."
      *   *Correction:* The frame describes *how* conflict is managed, not *if* harm occurred. A serial harasser can be exposed via victimhood culture tactics, and the exposure is valid.
      *   *Instruction:* Staff must separate *tactics* from *validity*. High publicity does not mean low credibility.

  5.  **Running the Cases:**

      *   *Case 1 (Name Mangling + Public Post):*
          *   Interaction: Dignity (correction) -> Victimhood (public logging).
          *   Triage: Can't sanction (informal office). Public post complicates privacy.
          *   Action: Coach on limits of "logging" (we don't keep punitive records). Discuss risk of public escalation. Refer if it becomes harassment policy violation.
      *   *Case 2 (Kitchen + RA Write-up + Face Saving):*
          *   Interaction: Honor (confrontation) -> Dignity/Victimhood mix (RA involvement). Student wants to revert to Honor (make it go away so he doesn't look weak).
          *   Triage: RA write-up makes it formal-adjacent. Can't delete official docs.
          *   Action: Coach on the reality of the record. Mediation if other party agrees.
      *   *Case 3 (11 Reports on TA + Identical Vocabulary):*
          *   Interaction: Victimhood (aggregation, shared vocabulary).
          *   Triage: Pattern recognition. Is it contagion or serial behavior?
          *   Action: Refer up. This exceeds informal scope. The "system-induced" angle is real but doesn't negate the reports.
          *   *Nuance:* The prompt asks about the "unflattering third reading" (the office created the channel). Acknowledge this but prioritize student safety.

  6.  **Limitations & Falsification:**

      *   *Where it misfires:* Ambiguous cases where harm is real but tactics are performative. Staff bias is the biggest leak.
      *   *What changes my mind:* If data shows that using this frame *increases* dismissal of valid claims by marginalized groups. If the "victimhood" label correlates with protected class status in a way that biases staff (even unconsciously).
      *   *My Weakest Step:* Assuming staff can successfully separate "tactic" from "validity." Cognitive bias is sticky.

  7.  **Review and Refine (Self-Correction during drafting):**

      *   *Check:* Did I classify people? *Correction:* Ensure language says "interaction style" not "student type."
      *   *Check:* Did I address the mid-switch? *Correction:* Add a specific step in the triage for "Current Status of Conflict."
      *   *Check:* Is the guardrail strong enough? *Correction:* Make it a bolded warning at the start of the procedure.
      *   *Check:* Did I answer the "what changes your mind" part? *Correction:* Need a specific empirical trigger.
      *   *Tone Check:* Keep it dry, operational, not academic.

  8.  **Final Polish:**

      *   Ensure American English spelling/usage.
      *   Verify the Campbell/Manning application is accurate to the prompt's summary (Honor/Dignity/Victimhood).
      *   Make sure the "leaks" in the guardrail are explicit.

  **(Self-Correction Note on Case 3):** The prompt mentions "contagion" vs. "serial offender" vs. "system-induced." I need to be careful not to dismiss the "system-induced" aspect as invalidating the complaints. If the system invites reporting, reports will happen. That doesn't mean the TA is innocent, but it means the *volume* might be inflated by the mechanism. The triage needs to handle high volume by referring up, not by investigating the "contagion" theory internally.

  **(Self-Correction on Guardrail):** The prompt says "Build the guardrail in, and then tell me where the guardrail leaks." I need to be honest that the guardrail *will* leak because humans are biased.

  **(Self-Correction on Falsification):** What would make me throw out the frame? If the frame itself becomes a self-fulfilling prophecy that creates the very dynamics it describes (i.e., labeling a complaint "victimhood culture" causes staff to treat it as such, thereby escalating the conflict).

  9.  **Final Output Generation** (Proceeding to draft response based on these thoughts).
answer: |-
  Here is a triage procedure built on the Honor/Dignity/Victimhood frame, designed for your constraints (20 minutes, mixed-staff expertise), followed by the case applications and the limitations analysis.

  ### The Triage Procedure: Conflict Channel Assessment

  **Operational Guardrail (Read this first):**
  This frame classifies the *method of conflict resolution* being used, not the *validity of the harm*. A complaint using "victimhood culture" tactics (publicity, aggregation, third-party reliance) can describe genuine harassment. A complaint using "dignity culture" tactics (thick skin, private resolution) can describe severe abuse. **Do not let the style of the complaint dictate the credibility of the claim.** If staff hear themselves thinking "this is just performative," they must stop and assess the underlying conduct against university policy, not the cultural frame.

  **Step 1: Identify the Current Channel**
  *Ask:* "How is this conflict currently being handled? Who knows about it besides you and the other person?"
  *   **Honor Channel:** Only the parties know. Resolution is expected between them (confrontation, avoidance, retaliation).
  *   **Dignity Channel:** Parties + Private Third Party (you, a counselor). Goal is private resolution or coaching.
  *   **Victimhood Channel:** Parties + Public/Institutional Audience (social media, RA logs, mass reporting). Goal is public validation or official record.
  *   **Switch Point:** If the answer changes from "just us" to "I posted it" or "An RA saw it," mark the interaction as **Switched**. The channel is now defined by the widest audience, not the original intent.

  **Step 2: Identify the Desired Outcome**
  *Ask:* "If you could snap your fingers, what would the result look like tomorrow?"
  *   **Sufficient for Close/Coach:** "I want them to stop," "I want to understand why they did it," "I want to feel heard."
  *   **Sufficient for Mediation:** "I want to talk to them with someone there," "I want an apology."
  *   **Sufficient for Referral (Formal):** "I want them sanctioned," "I want this on their permanent record," "I want an official finding of fact."
  *   **Red Flag:** "I want the record deleted" (implies Honor logic applied to a Dignity/Victimhood system).

  **Step 3: Assess the Harm vs. The Mechanism**
  *Ask:* "Does the behavior described violate a specific policy (harassment, discrimination, threat), or is it a breach of social norms (rudeness, awkwardness, disagreement)?"
  *   **Policy Violation:** Refer to Formal Office. (The cultural frame doesn't matter; the rule does).
  *   **Social Norm Breach:** Proceed to Triage Decision.

  **Triage Decision Matrix**

  | Current Channel | Desired Outcome | Harm Type | Action |
  | :--- | :--- | :--- | :--- |
  | **Honor** | Private Resolution | Social Norm | **Coach.** Validate feeling, role-play confrontation, encourage direct resolution. |
  | **Dignity** | Private Resolution | Social Norm | **Coach/Close.** Reinforce thick-skin strategies or offer low-key mediation. |
  | **Victimhood** | Public/Official Record | Social Norm | **Coach (Boundary Setting).** Explain limits of informal office. Warn of escalation risks. Do not create "records" that imply sanctioning power you don't have. |
  | **Switched** | Any | Any | **Stabilize.** Acknowledge the switch. If public/RA involved, you cannot promise confidentiality. Refer if formal process is now triggered. |
  | **Any** | Sanction/Finding | Policy Violation | **Refer.** Immediate handoff to Formal Office. |

  **Judgment Call Markers (Where staff are guessing):**
  1.  **The "Record" Request:** Students often ask for a "log" thinking it's a warning. It isn't. *Marker:* If staff agree to "log it" without explaining it has no punitive weight, they are creating a false expectation.
  2.  **The "Contagion" Call:** In multi-report cases, deciding if it's a pattern or a copycat. *Marker:* If vocabulary is identical, assume coordination or template use. Do not investigate the coordination; refer the volume up.
  3.  **The "Face-Saving" Exit:** When a student wants to undo a formal step (like an RA report) to save honor. *Marker:* Staff cannot delete institutional records. The only move is to explain the record stands but the *outcome* can be restorative.

  ---

  ### Case Applications

  **Case 1: The Name Mangling & The Public Post**
  *   **Channel:** Switched. Started Dignity (private correction), now Victimhood (public post, 4k followers, request for official log).
  *   **Triage:**
      1.  **Harm:** Social norm (rudeness) vs. Potential Harassment (if protected class). Assume social norm for intake unless bias is explicit.
      2.  **Outcome:** She wants an official record. You cannot give a punitive record.
      3.  **Action:** **Coach (Boundary Setting).**
      4.  **Script:** "I can document that we met today, but I need you to know this office doesn't keep disciplinary records. That only happens upstairs. Since this is already public, be aware that if he sees the post, he may escalate. If you want this to stop, the most effective path is usually a cease-and-desist request from us, but that requires a formal complaint. Do you want to file that?"
  *   **Guardrail Check:** Do not dismiss the name mangling as "sensitive." Repeated correction + refusal can be harassment. Treat the *behavior*, not the *post*.

  **Case 2: The Kitchen Confrontation & The RA Write-up**
  *   **Channel:** Switched. Started Honor (face-to-face confrontation), switched to Dignity/Victimhood hybrid (RA documentation).
  *   **Triage:**
      1.  **Harm:** Heated argument. Likely policy-adjacent (disorderly conduct?), but student wants to revert to Honor logic (make it disappear).
      2.  **Outcome:** Delete the write-up.
      3.  **Action:** **Coach (Reality Testing).**
      4.  **Script:** "I understand you feel this makes you look bad. But once an RA documents an incident, that's an institutional record. I can't delete it. What I can do is help you frame your side of the story so if there is a review, your context is clear. Trying to suppress the record often looks worse than the argument itself."
  *   **Guardrail Check:** Don't shame him for caring about his reputation (Honor instinct). Validate the feeling, correct the mechanism.

  **Case 3: The 11 Reports on the TA**
  *   **Channel:** Victimhood (Aggregation, shared vocabulary, third-party reliance).
  *   **Triage:**
      1.  **Harm:** Cumulative impact vs. Individual Trivia.
      2.  **Outcome:** Implicitly, the students want the TA removed or sanctioned.
      3.  **Action:** **Refer Up.**
      4.  **Reasoning:** This exceeds informal scope. Whether it is "contagion" (social contagion of complaint), "Serial Offender" (pattern of micro-aggressions), or "System-Induced" (your office made it easy to report), the *volume* creates a liability and a climate issue you cannot mediate.
      5.  **Internal Note:** When referring, flag the "identical vocabulary." Let the formal office decide if it's coordination. Do not tell the students you suspect contagion; that invalidates their experience.
  *   **Guardrail Check:** This is the highest risk for credibility discount. Staff might think "they're copying each other." It doesn't matter. 11 reports create a hostile environment regardless of coordination. The *effect* is the harm.

  ---

  ### Limitations, Leaks, and Falsification

  **Where the Procedure Misfires**
  1.  **The "Performance" Bias:** The biggest leak is in Step 1. Staff will inevitably associate "Victimhood Channel" (public posts, aggregation) with "Low Credibility." The guardrail tells them not to, but cognitive bias is sticky. If a student cries in the office (Dignity/Honor display), they get empathy. If a student reads from a prepared statement with screenshots (Victimhood display), staff often feel manipulated. The procedure cannot fully automate away that gut reaction.
  2.  **The "Switch" Lag:** By the time you identify a channel switch (e.g., you find out about the public post in minute 15), you may have already given advice based on privacy assumptions. The procedure relies on the student disclosing the audience. They often won't until asked.
  3.  **The "System-Induced" Blind Spot:** In Case 3, the procedure says "Refer Up." It does not account for the possibility that *your office* is the problem. If you make reporting easy and low-stakes, you incentivize reporting. The procedure treats the reports as data points, not as potential artifacts of your own process. You will miss the chance to fix your own intake mechanism if you just pass the buck.

  **What Would Change My Mind (The Falsification Condition)**
  I would recommend throwing out this frame entirely if you find a **correlation between the "Victimhood" classification and protected class status in your referral data.**

  *   **The Signal:** If you track these triages for six months and find that complaints from marginalized groups (racial minorities, LGBTQ+, disability) are disproportionately classified as "Victimhood Channel" and subsequently "Coached/Closed" rather than "Referred," while majority-group complaints using similar tactics are "Referred," the frame is acting as a bias amplifier.
  *   **Why:** Campbell and Manning's theory is descriptive, but in practice, "victimhood culture" is often a pejorative label applied to the rhetoric of marginalized groups seeking institutional protection. If the frame helps your staff categorize legitimate equity complaints as "culture war posturing," it is doing active harm.
  *   **Recognition:** Run a quarterly audit. Compare the *language* of the complaint against the *demographics* of the complainant and the *outcome* of the triage. If the "Victimhood" tag predicts a lower likelihood of referral for specific demographic groups, burn the procedure.

  **My Weakest Reasoning Step**
  The step I am least confident in is **Case 3 (The 11 Reports).** My reasoning relies on the assumption that "Referring Up" is a neutral action. It isn't. If the Formal Office is overwhelmed or biased, referring 11 small reports about a TA might result in *no action*, which validates the TA's behavior and alienates the 11 students. Alternatively, it might trigger a disproportionate investigation that ruins the TA's career over trivia.
  I am assuming the Formal Office is better equipped to handle "pattern vs. contagion" analysis. If they aren't, my triage just passes the buck without solving the epistemic problem of whether the harm is real or replicated. I don't have a solution for that within the informal office's constraints, which is a structural weakness of the procedure itself.
