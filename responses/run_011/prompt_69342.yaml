  *(Self-Correction during drafting)*: I need to make sure I don't just say "hyperbolic discounting is real." I need to explain *why* it breaks the Odysseus model. Odysseus assumes a stable preference order that gets temporarily hijacked. Hyperbolic discounting implies the preference order *itself* changes based on proximity. That's a fundamental metaphysical difference in the model of the self.

  Also, on the "hearing the song" point: This is about *akrasia* vs. *enkratia*. Odysseus achieves enkratia (acting in accordance with reason while feeling the pull). The app user achieves avoidance. One builds character, the other builds walls. This is a crucial distinction for autonomy.

