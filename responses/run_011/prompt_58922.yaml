answer: |-
  ### I. Adequacy Requirements for a Theory of Social Construction

  To count as adequate, a framework for the social construction of kinds must satisfy the following conditions. Items are marked **Non-Negotiable (NN)** if failure entails explanatory collapse, or **Partisan Commitment (PC)** if they reflect specific metaphysical preferences (e.g., strict constructionism vs. critical realism).

  1.  **The Concept/Object Distinction (NN)**
      *   *Requirement:* The theory must distinguish between the social production of a *concept* (the label, the diagnostic criteria) and the social production of the *referent* (the physiological state, the economic value).
      *   *Motivation:* To avoid the "genetic fallacy" of assuming that because a concept has a history, the thing itself is arbitrary. We must explain how we can invent a label for a pre-existing pain, or how a label can create a new behavior.
  2.  **The Causal Efficacy Constraint (NN)**
      *   *Requirement:* Constructed kinds must be shown to have causal powers in the world (e.g., affecting survival, resource distribution, or physiological states), not merely exist as linguistic conveniences.
      *   *Motivation:* If construction implies only convention without consequence, it cannot explain why *Prime Frontage* determines business survival or why *Chronofatigue* diagnosis alters sleep patterns.
  3.  **The Ontological Dependence Clause (PC)**
      *   *Requirement:* The kind must have no reality independent of our classifications versus having a reality *sustained* by them. (Theories must specify which).
      *   *Motivation:* This distinguishes *Prime Frontage* (vanishes without belief) from natural kinds. Strict constructionists demand dependence; realists allow sustenance.
  4.  **The Construction/Convention Distinction (NN)**
      *   *Requirement:* The theory must distinguish a kind's being *constructed* (causally constituted by social practices) from its being merely *conventional* (arbitrarily agreed upon).
      *   *Motivation:* *Prime Frontage* is not just a name; it dictates rent and survival. *Chronofatigue* is not just a word; it tracks biomarkers. Mere convention cannot explain causal grip.
  5.  **The Empirical Accommodation Constraint (NN)**
      *   *Requirement:* The theory must not contradict established findings from history, epidemiology, or economics regarding the temporal precedence of physical bases or the variability of social uptake.
      *   *Motivation:* A theory cannot claim *Chronofatigue* is purely social if biomarkers predate the label; it cannot claim *Prime Frontage* is physical if buildings remain unchanged when status collapses.
  6.  **The Looping Mechanism (NN)**
      *   *Requirement:* The theory must explain how classification interacts with the classified to alter the kind's extension or character over time (interactive kinds).
      *   *Motivation:* Essential for *Chronofatigue*, where diagnosis reorganizes self-description and work, making the diagnosis "fit better."

  **Impossibility Flag:** There is a tension between **Requirement 3 (Ontological Dependence)** and **Requirement 5 (Empirical Accommodation)** regarding *Chronofatigue*. If one insists (as PC) that constructed kinds *must* be ontologically dependent on classification, one contradicts the epidemiological finding that the physiological profile existed decades prior. A univocal theory satisfying all NN requirements *and* the strict PC version of Req 3 is impossible for the full range of cases.

  **Primary Exclusionary Requirement:** **Requirement 3 (The Ontological Dependence Clause)** does the most work in excluding candidates. Strict dependence rules out "realist constructionism" (kinds with independent bases); weak dependence (sustenance) rules out "radical constructivism" (kinds as pure fiction).

  ---

  ### II. Application to Stipulated Cases

  **Which requirement separates *Chronofatigue* and *Prime Frontage*?**
  **Requirement 3 (Ontological Dependence)** separates them. *Prime Frontage* satisfies the strict version: without the collective expectation, the kind ceases to exist (the buildings remain, the "prime" status vanishes). *Chronofatigue* satisfies only the weak version: the physiological profile exists independently, but the *kind* (as a diagnostic category with social consequences) is sustained by classification.

  **Which requirement would, if left unqualified, rule out calling *Chronofatigue* constructed at all?**
  **Requirement 3**, if formulated as "A constructed kind must have *no* reality independent of our classifications." Since retrospective biomarker studies show the physiological profile existed decades before the label, an unqualified dependence clause forces the conclusion that *Chronofatigue* is discovered, not constructed.

  **Is there any requirement that both violate?**
  Yes, if we add a hidden requirement of **Metaphysical Uniformity** (the assumption that "social construction" names a single metaphysical relation). *Chronofatigue* relies on a causal interaction between biology and classification (interactive kind); *Prime Frontage* relies on constitutive rules (status function). If the framework demands a single mechanism for all construction, both violate it, supporting the hypothesis that "construction claims are two unrelated jobs wearing one phrase."

  ---

  ### III. Evaluation of Familiar Postures

  **Realist Constructionism**
  This view fares well on *Chronofatigue* by accepting that kinds are wholly real and causally potent even if socially shaped, satisfying the Empirical Accommodation and Causal Efficacy constraints. However, it struggles with *Prime Frontage*, as it tends to posit a underlying reality where there is only status, potentially violating the Ontological Dependence intuition that the frontage *is* nothing but the expectation.

  **Error-Theoretic View**
  This posture satisfies the Ontological Dependence Clause for *Prime Frontage* by denying the kind's existence once expectations withdraw, but it fails the Causal Efficacy Constraint by treating the "construction" as merely a polite error rather than a causal mechanism. It ultimately dissolves the phenomenon it seeks to explain, rendering the framework unable to account for the looping effects seen in *Chronofatigue*.

  **Concept-Relocated View**
  By relocating construction from the world to our concepts, this view easily satisfies the Concept/Object Distinction and avoids contradicting empirical findings about pre-existing biomarkers. However, it risks collapsing the Construction/Convention Distinction, as it implies the world remains untouched by our classifications, failing to explain how *Prime Frontage* physically settles which businesses survive.
