answer: |-
  The air in the Arbiter's chamber was thin, recycled too many times, smelling of ozone and old paper. Outside the thick glazepane, the valley lay bruised in twilight, the great massif at its head swallowing the last of the sun. For three generations, the people below had fought over that rock. The Founders called it *Meridian*. The Miners called it *Kettle*.

  On the steel table between them lay the orbital survey. It was a single sheet of polymer, glowing softly with topographical lines that ignored fog, cloud, and human error. It showed one continuous body of granite, rising from the valley floor to the stratosphere. There was no seam. There was no second peak. There was only the mountain.

  Elias Vane, eldest of the Founders' council, stood with his hands pressed flat against the table. His knuckles were white, the skin thin as parchment. He was eighty years old, and every year of the quarrel was etched into the deep furrows of his brow. He did not look at the map. He looked at the Arbiter, a young woman named Kaelen who had been imported from the Lowlands specifically because she knew no one here.

  "It says they are the same," Elias said. His voice was a dry rasp, unused to concession.

  "It says they are identical," Kaelen corrected gently. "Identity is not a matter of opinion, Elder Vane. The mass is singular. The coordinates match. The surveyors from the founding party baptized the peak *Meridian* based on the north ridge visibility. The miners sixty years later baptized the flank *Kettle* under the cloud bank. They named the same thing twice."

  Elias shook his head, a slow, rhythmic motion. "They named what they saw. The fog lifts different some years. If the founding surveyor had come a week later, if the wind had held the mist on the ridge... he would have seen the spur behind. He would have named the spur *Meridian*. And the miners, if the cloud bank had broken... they would have seen the true peak. They would have named something else *Kettle*."

  He straightened, gripping the edge of the table. "It could have come out otherwise. That's what I'm telling you. The valley got lucky. The names landed where they did by chance. You cannot bind us to a coincidence."

  Kaelen did not move. She watched him with the patience of someone watching a glacier carve stone. "You are speaking of the descriptions, Elias. The fog. The cloud bank. The visibility. Those are contingent. They could have been otherwise. But the names? Once the baptism happened, the name stuck to the rock. Not to the view of the rock. To the rock itself."

  "The name is the description," Elias insisted, his voice rising, cracking. " *Meridian* means 'the first peak visible when the fog lifts.' That is what it means. If the fog lifts and shows a different stone, then *Meridian* moves. You want to freeze the word and let the world change around it. That isn't justice. That's magic."

  "It's not magic. It's reference," Kaelen said. She tapped the polymer sheet. "When the surveyor pointed and said 'That is Meridian,' he wasn't defining a weather pattern. He was tagging an object. If the fog had lifted differently, he might have pointed at a different rock. Then *Meridian* would have been that other rock. But he pointed at this one. So *Meridian* is this one. In every world where this rock exists, it is *Meridian*. The fog is just how we found it."

  Elias turned away, walking to the window. He looked out at the darkening slope. He knew the miners down there. He knew their children. They had sunk shafts into the flank they called *Kettle*. They had built their homes around the belief that the Charter granted them the workings beneath the peak that satisfied their description.

  "If you say they are the same," Elias said quietly, "then the Charter collides. We cannot both own the whole."

  "The Charter is what I am here to read," Kaelen said. She picked up the bound document. It was leather, worn smooth by the hands of three generations of stewards. "We have established the identity of the mountain. The survey is evidence, hard-won, but once learned, it cannot be unlearned. The mountain is one. Now we must see what the words grant."

  Elias turned back. "Read the Founders' clause."

  Kaelen opened the book. "Clause Four, Section One. 'The heirs of the founding survey party shall hold in perpetuity the waters flowing from the Meridian watershed.'"

  She looked up. " *Meridian* is a proper name. It was fixed by baptism at the founding. It designates this mountain rigidly. Regardless of the fog, regardless of the visibility, the name refers to this specific mass of rock. The watershed belongs to the Founders. That clause survives the discovery untouched."

  Elias nodded slowly. He had expected this. He had hoped for it, once. But now, seeing the finality of it, he felt a hollowness in his chest. "And the miners?"

  Kaelen turned the page. Her finger traced the line. "Clause Nine, Section Three. 'The Miners' Guild shall hold the workings beneath the peak that shadows the chapel at solstice.'"

  Elias stiffened. "They call it *Kettle*."

  "The Charter does not say *Kettle*," Kaelen said. "It uses a description. 'The peak that shadows the chapel at solstice.'"

  "The survey says it's the same mountain," Elias said. "So the description fits. *Meridian* shadows the chapel. Therefore the miners get the workings."

  "Does it?" Kaelen asked. She reached for a second sheet of data, sliding it over the orbital map. "The orbital survey included astrometric calibration. We modeled the solstice alignment based on the chapel's coordinates and the mountain's current geometry."

  She paused. The silence in the room grew heavy, pressing against the glass.

  "The chapel was built ten years after the Charter was signed," Kaelen said. "It was placed on a spur that was believed to be independent. The alignment was... observational. Folklore. The survey confirms that at solstice, the shadow of *Meridian* does not fall on the chapel. The chapel sits in full light. The shadow falls three hundred meters east, into the ravine."

  Elias stared at her. "So the description fails."

  "The description picks out nothing," Kaelen said. "There is no peak that shadows the chapel at solstice. The condition is unsatisfied. The grant relies on the description to fix the reference, not a name. Since nothing satisfies the description, the legal term refers to nothing. The clause does not survive."

  Elias felt the room tilt. He had fought the identity. He had argued that *Meridian* might not have been *Kettle*. He had insisted on the contingency of the names because he thought if they were different, the miners would keep *Kettle*. He had tried to save them by denying the truth of the rock.

  "If they are different," Elias whispered, "the miners keep *Kettle*. Even if the Charter is vague, custom holds. They have worked it for sixty years."

  "If they are different," Kaelen agreed. "But they are not. And because they are the same, the Charter is tested against the single reality. The Founders' clause uses a Name. The Name holds. The Miners' clause uses a Description. The Description fails."

  Elias walked back to the table. He looked at the orbital map again. The lines were clear. The truth was absolute. He realized then what he had been doing. He hadn't been arguing geography. He had been arguing semantics. He had wanted the words to be flexible enough to let both people live. He wanted *Meridian* to be contingent, not because he doubted the rock, but because he needed the law to be kind.

  "They will starve," Elias said. "The water is ours. The workings are... nothing. They have no claim to the rock itself, only to the workings beneath the description. If the description is void, the claim is void."

  "The law is not kind, Elias. It is fixed," Kaelen said. She closed the book. "You insisted that the identity was contingent. You said it could have come out otherwise. You were wrong. The identity is necessary. But the descriptions... the fog, the shadow... those were always the weak points. You built your hope on the fog."

  Elias placed his hand on the polymer sheet. He thought of the miners' elder, a man named Torren who had died five years ago refusing to vacate the upper shafts. Torren had believed the shadow fell true. He had believed the name *Kettle* was enough.

  "I knew," Elias said. His voice was barely audible. "I knew the shadow was wrong. My grandfather told me. He said the chapel was moved after the Charter was signed to catch the light better, but the stone didn't shift with it."

  "Then why fight the identity?" Kaelen asked. "If you knew the description failed, why insist *Meridian* wasn't *Kettle*? If they were different mountains, the miners would still lose the Charter claim, but they might keep custom rights to *Kettle*."

  "Because if they are different," Elias said, looking up, his eyes wet, "then the Founders don't own the water source either. The watershed splits. We get half. They get half. We share the valley."

  He slammed his hand down on the table, not in anger, but in despair. "I didn't fight to keep them out. I fought to keep the mountain big enough for both of us. If it's one mountain, and the law is rigid... one of us breaks."

  Kaelen looked at him, and for the first time, the professional mask slipped. She looked tired. "The law reads the text. The text uses a Name for you, and a Description for them. That is the difference. Not desert. Not need. How the terms were fixed."

  Elias straightened his coat. He looked old, suddenly, older than the valley. "Prepare the verdict," he said. "The Founders claim the watershed. The Miners' claim is void."

  "Elias," Kaelen started.

  "Prepare it," he said. He turned to the window. The mountain was dark now, a silhouette against the stars. It was just rock. It didn't care what they called it. It didn't care about the fog or the shadow. It just was. And because it was, they would have to choose who survived it.

  "Tell them I tried," he said to the glass. "Tell them I tried to make the names lie."

  Kaelen gathered the papers. The sound of the stacking polymer was loud in the quiet room. Outside, the wind picked up, swirling the mist around the base of the peak, hiding the rock once more, just as it had for three generations. But the map on the table remained glowing, undeniable, marking the boundary where the words had failed the people.

  ***

  I am highly confident in the philosophical rendering of the Kripkean distinction between rigid designators (names) and non-rigid definite descriptions. The story enacts the argument from *Naming and Necessity* without explicit terminology: the name *Meridian* tracks the object across possible worlds (or survey corrections), while the description "peak that shadows..." fails when the contingent facts change. I have taken liberties with legal realism; in practice, courts often prioritize intent over strict semantic designation to avoid absurd outcomes (like the miners losing everything due to a shadow error). The elder's confusion is rendered as genuinely modal—he believes the identity itself is contingent—whereas a philosopher might diagnose it as metalinguistic (confusing the sense of the name with its reference). The point I am least sure of is whether the elder's motivation (trying to save the miners by denying identity) comes across clearly enough without tipping into exposition; I relied on his final confession to anchor that emotional logic.
