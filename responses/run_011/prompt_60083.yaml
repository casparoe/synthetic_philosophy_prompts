          5.  Procurement begins (sometimes involving cannulation/perfusion to chest/abdomen, but clamping vessels to the brain).
          6.  *Contrast:* A non-donor with the same arrest would be resuscitated for much longer; they wouldn't be called dead yet.
          7.  *Constraint:* The "Dead Donor Rule" (DDR) – procurement must not cause death.
      *   **The Questions:**
          1.  What conception of death does this presuppose? (Integrative work? Brain loss? Status based on conditions/intentions?)
          2.  Which rival conceptions does it rule out?
          3.  Do the parts point in the same direction (coherence check)?
          4.  Separate what is *strictly required* vs. what *sits comfortably*.
          5.  Where is it philosophically *underdetermined* (compatible with incompatible views)?
          6.  Counterfactual: If the presupposition changed, what in the OR would have to change?

  2.  **Initial Analysis & Conceptual Mapping:**

      *   *The Core Tension:* The "irreversibility" criterion is key. In standard medicine, "irreversible" often means "cannot be reversed by available means." In DCD, it seems to mean "will not be reversed by *chosen* means." This is the "moralized" or "intentional" irreversibility problem.
      *   *Conceptions of Death:*
          *   *Whole-Brain Death:* Not applicable here (heart is beating until withdrawal).
          *   *Cardiorespiratory Death:* Traditional view. Heart/lungs stop permanently.
          *   *Higher-Brain:* Loss of consciousness/personhood. (Rarely official policy).
