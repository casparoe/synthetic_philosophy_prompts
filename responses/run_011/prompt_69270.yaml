answer: |-
  ### Exam Question: Social Choice and Welfare Economics (Graduate Seminar)
  **Time Allowed:** 45 Minutes  
  **Total Marks:** 20

  **Question 1**
  Consider the following excerpt from a classmate's study notes regarding Harsanyi's Aggregation Theorem and his defense of Utilitarianism:

  > "Harsanyi's theorem yields the social form $W = \sum a_i u_i$. Behind the veil, I am anyone with probability $1/n$, so $a_i = 1/n$. To sum $u_i$, they must share a zero and unit. Thus, the derivation establishes interpersonal level comparability and equal weights solely from rationality axioms."

  Critique this passage. The Aggregation Theorem demonstrates that if individual and social preferences satisfy vNM axioms and the Pareto principle, social utility is a linear combination of individual utilities. However, vNM utilities are unique only up to positive affine transformations ($u'_i = \alpha_i u_i + \beta_i, \alpha_i > 0$). 

  Explain precisely what the theorem *assumes* versus what it *establishes* regarding: (i) the fixation of common units ($\alpha_i$), (ii) the fixation of common zero points ($\beta_i$), and (iii) the justification for equal weights ($a_i$). Specifically, analyze whether the equiprobability argument supplies these normalizations independently or smuggles them in as prior assumptions.

  ***

  ### Model Answer

  The classmate's passage commits a category error by conflating the mathematical structure of aggregation with the measurement theoretic requirements for that structure to be meaningful. Harsanyi's Aggregation Theorem is a representation result, not a measurement solution. It states that *given* specific vNM representations for individuals and society, the social function is a weighted sum. It does not, in itself, provide the rules for selecting those specific representations out of the infinite affine equivalents available for each individual.

  Regarding (i) **common units ($\alpha_i$)**: The theorem assumes, rather than establishes, that individual utility scales are commensurable. vNM utility measures strength of preference over lotteries, unique up to a positive linear transformation. To sum $u_1$ and $u_2$, we must fix the scaling factors $\alpha_i$. This requires an assumption of **Unit Comparability** (interpersonal comparison of utility differences). Without an external ethical or empirical stipulation that "one unit of preference satisfaction for Person A equals one unit for Person B," the sum $\sum u_i$ is mathematically arbitrary. The theorem cannot generate this; it merely preserves it if present.

  Regarding (ii) **common zero points ($\beta_i$)**: The passage claims the derivation establishes "level comparability." This is incorrect. Fixing $\beta_i$ requires **Level Comparability** (a shared definition of zero well-being). vNM axioms do not identify a natural zero; they only order prospects. Summing utilities implies that the origin is fixed across persons. If Person A's zero is Person B's minimum survivable income, while Person B's zero is their current status quo, the sum is nonsense. The theorem requires this normalization as a precondition for the addition operation, not as a conclusion of the rationality axioms.

  Regarding (iii) **equal weights ($a_i$)**: The classmate argues the veil of ignorance (equiprobability) dictates $a_i = 1/n$. While Harsanyi argues this in his *Utilitarianism* paper, it is not a result of the Aggregation Theorem itself. The theorem allows any non-negative weights. The equiprobability argument is an ethical premise invoking impartiality. Crucially, this argument **smuggles in unit comparability**. To calculate the expected utility behind the veil ($E[U] = \sum \frac{1}{n} u_i$), one must assume the $u_i$ are already measured in common units. If units differ, the expectation is undefined. Therefore, equiprobability cannot justify equal weights *and* establish unit comparability simultaneously; it presupposes the latter to justify the former.

  In conclusion, the passage falsely attributes measurement solutions to an aggregation theorem. The theorem licenses a linear form *conditional* on interpersonal comparability. It does not prove comparability of levels or units, nor does it mandate equal weights without importing independent ethical assumptions that already presuppose the measurability they claim to derive.

  ***

  ### Marking Scheme

  **Total: 20 Marks (5 Points × 4 Marks Each)**

  | Point | Required Content (Must-Hit) | Marks | The "Wrong Turn" (Costs the Point) |
  | :--- | :--- | :--- | :--- |
  | **1** | **vNM Uniqueness:** Explicitly states that vNM utilities are unique only up to positive affine transformations ($\alpha u + \beta$), meaning scales and origins are initially arbitrary. | 4 | Treating vNM utility as cardinally unique without transformation freedom. |
  | **2** | **Units vs. Levels:** Distinguishes between fixing units ($\alpha$, differences) and fixing zeros ($\beta$, levels) as separate measurement problems. | 4 | Conflating "cardinality" with "interpersonal comparability" of levels. |
  | **3** | **Assumption vs. Result:** Clarifies that the Theorem *requires* comparability to sum utilities; it does not *prove* comparability exists. | 4 | Claiming the Aggregation Theorem generates interpersonal comparability endogenously. |
  | **4** | **Weights are Ethical:** Identifies that equal weights ($a_i$) come from an ethical premise (impartiality/veil), not the mathematical aggregation theorem. | 4 | Arguing that rationality axioms alone force equal weights. |
  | **5** | **Equiprobability Circularity:** Notes that the equiprobability calculation *presupposes* common units to be meaningful; it cannot establish them. | 4 | Claiming the veil of ignorance independently solves the unit comparability problem. |
