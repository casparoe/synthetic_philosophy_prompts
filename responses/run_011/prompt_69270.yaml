      *   *The Catch:* vNM utilities are unique only up to positive affine transformations ($u'_i = \alpha_i u_i + \beta_i$, $\alpha_i > 0$).
      *   *Interpersonal Comparability:* To make sense of the sum $\sum a_i u_i$, we need to fix scales ($\alpha_i$) and origins ($\beta_i$). The theorem *itself* does not do this. It says *if* you have utilities in a specific scale, the aggregation is linear. It doesn't tell you how to compare $u_1$'s "10" to $u_2$'s "10".
      *   *Harsanyi's Utilitarianism (Impartial Observer):* Harsanyi argues for equal weights ($a_i = 1/n$) using the "veil of ignorance" / equiprobability assumption (you have an equal chance of being anyone).
