      *   *Check:* Did I quote? No.
      *   *Check:* Did I give a bibliography? No.
      *   *Check:* Am I addressing the partner's "fiction is parasitic" claim? Yes, need to explicitly dismiss that as unhelpful for this specific semantic/pragmatic inquiry.
      *   *Nuance:* Make sure to distinguish between Stevens talking to other characters (in the story) vs. Stevens talking to the Reader (the narration). The prompt focuses on the reader recovering implicatures from the text. This is crucial. The reader is the ultimate hearer.
