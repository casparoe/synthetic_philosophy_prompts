  *(Self-Correction on the "Partner's Objection"):* I need to be careful not to just say "Partner is wrong." I need to explain *why* it's a cop-out in this context. The partner says fictional speech isn't real speech. But pragmatics analyzes *interpretation*. If we interpret it, we use pragmatic rules. Dismissing it as "fake" stops analysis. I will argue that fictional discourse simulates the conditions of real discourse enough to stress-test the theory.

  *(Refining the "Intention" argument):* The strongest move is to argue that Stevens *does* have an intention, but it is to *prevent* recognition. He intends the hearer (and himself) to recognize the "Professional" intention, not the "Human" one. The tragedy is that the "Human" implicature bleeds through despite the intention to suppress it. This makes it a case of *failed* speaker meaning (for Stevens) but *successful* speaker meaning (for Ishiguro).

