          *   *Implicature:* "I am lying to myself," "Darlington was complicit," "I am complicit."
          *   *Gricean Issue:* This looks like a lie. But Stevens believes it. So is it a Quality violation? It's a failure of *self-knowledge*.
      *   **The Self-Deception Problem (The Core):**
          *   Grice requires intention. Stevens lacks the intention to communicate the tragedy.
          *   *Solution:* Distinguish between *Narrator Meaning* and *Author Meaning*. Ishiguro intends us to see the gap. Stevens intends to close it. The implicature belongs to the *text*, not the *character*.
          *   *Alternative:* The "Overhearer" theory. We are eavesdropping. Stevens is talking to himself. Self-deception is a failure of the reflexive loop.
      *   **Where Grice Flattens the Text:**
