answer: |-
  Here is the translation of the heterogeneity problem and its candidate solutions into the vocabulary of affective neuroscience, followed by the residue report and the requested probes.

  ### The Heterogeneity Problem: The Search for a Common Neural Currency

  In philosophical terms, the heterogeneity problem asks what unites the sensory pleasure of a cold drink, the intellectual satisfaction of a proved theorem, and the reflective warmth of a remembered afternoon. In our vocabulary, this is the problem of **common neural currency**. We observe distinct input modalities (gustatory nuclei, prefrontal cognitive loops, hippocampal episodic retrieval) converging on valuation systems. The problem is to identify the specific signal that classifies these disparate computational events as "hedonic" rather than merely "salient" or "reinforcing."

  ### The Principal Answers, Translated

  **1. The Felt-Quality Thesis (Phenomenological Hedonism)**
  *Philosophical Claim:* Pleasures share a single, introspectively accessible qualitative character.
  *Neuroscientific Rendering:* This posits a unitary **hedonic code**. It claims that regardless of whether the input is sucrose, a solved equation, or a memory, there is a specific, isomorphic pattern of activity in **hedonic hotspots** (e.g., the medial shell of the nucleus accumbens or the ventral pallidum). Specifically, it requires that opioidergic or endocannabinoid signaling in these hotspots generates a **consummatory affective reaction** (the operational measure of hedonic impact) that is structurally identical across domains. The "feel" is the readout of this specific neurochemical signature.

  **2. The Desire-Based Thesis (Occurrent/Dispositional)**
  *Philosophical Claim:* Pleasure is the satisfaction of a desire, or the desire for the experience to continue.
  *Neuroscientific Rendering:* This collapses pleasure into **incentive salience** ("wanting"). It identifies the hedonic marker with mesolimbic dopamine transmission that flags a stimulus as worth pursuing or maintaining. Under this view, the "pleasure" of the theorem is the dopaminergic surge that reinforces the cognitive behavior leading to the proof. The heterogeneity is resolved functionally: what they have in common is not a feeling, but a **reward prediction error** (RPE) signal that updates the policy to seek or sustain the current state.

  **3. The Attitudinal Thesis**
  *Philosophical Claim:* Pleasure is a matter of being pleased *that* something is the case (a pro-attitude toward a proposition).
  *Neuroscientific Rendering:* This locates pleasure in top-down cortical modulation of subcortical valuation circuits. It suggests that the prefrontal cortex (PFC) can gate **hedonic impact** without direct sensory drive or immediate **consummatory affective reactions**. The "pleasure" is the cortical appraisal signal that biases the basal ganglia toward acceptance, decoupled from the immediate **wanting/liking dissociation**. It treats pleasure as a cognitive set that modulates the gain on reward pathways.

  **4. The Deflationary Thesis (Family Resemblance)**
  *Philosophical Claim:* Pleasures form no natural kind; they share overlapping similarities but no essential core.
  *Neuroscientific Rendering:* There is no single **hedonic hotspot** or neurotransmitter system common to all "pleasures." Sensory pleasure relies on opioidergic hotspots; intellectual satisfaction relies on dopaminergic RPE resolution; nostalgic warmth relies on hippocampal-cortical re-entrant loops. They are linked only by functional convergence (approach behavior, mood elevation) without anatomical or neurochemical unity. "Pleasure" is a folk-psychological label for a heterogeneous cluster of reward processes.

  ***

  ### Residue Report

  **1. Translates Without Loss**
  *   **The Deflationary Thesis:** This maps cleanly onto the current data. The **wanting/liking dissociation** already suggests that what we call "pleasure" is often a conflation of distinct systems (dopamine vs. opioid). Acknowledging that cold drinks and proved theorems utilize different circuitry preserves all predictive power of the framework.
  *   **The Desire-Based Thesis:** This renders well into **incentive salience**. If we define pleasure operationally as "that which drives reinforcement learning," the RPE signal captures the functional role perfectly.

  **2. Requires Substantive Framework Commitments (The "Analysis vs. Evidence" Shift)**
  *   **The Felt-Quality Thesis:** To make this work, we must treat **consummatory affective reactions** (or the hotspot activity that drives them) not as *evidence* of pleasure, but as the *ontology* of pleasure. In philosophy, the reaction is a symptom of the feeling. In neuroscience, if we lack the feeling report (in rats) but have the reaction, we posit the feeling. To translate the philosophical thesis, we must commit to the claim that the hotspot firing *is* the pleasure, not merely its correlate. This loses the first-person authority of the philosophical claim but gains operational precision.
  *   **The Attitudinal Thesis:** This requires expanding the definition of **hedonic impact** beyond subcortical hotspots to include cortical appraisal. We must treat top-down inhibition or activation of the striatum as "pleasure" even in the absence of **consummatory affective reactions**. This requires the framework to accept "cold" hedonic states, which strains the operational definition based on facial/affective discharge.

  **3. Admits of No Rendering**
  *   **Pure Propositional Attitudes:** If a philosophical account insists on a pleasure that has *no* downstream effect on behavior, *no* modulation of **incentive salience**, and *no* activation of valuation circuitry (a purely epistemic "being pleased"), the neuroscientific framework cannot render it. To the brain, a valuation that changes nothing is noise.

  ***

  ### Probe 1: Alliesthesia

  **The Datum:** The hedonic sign of a fixed stimulus (e.g., glucose) flips from positive to negative depending on the subject's internal state (hungry vs. sated).

  **Analysis:**
  Does this describe heterogeneity in the *pleasures*, or only in their *causes*?
  In the neuroscientific vocabulary, alliesthesia demonstrates that **hedonic impact** is not a property of the stimulus, but of the stimulus-state interaction. The **hedonic hotspots** do not fire identically for the same taste in different states; the gating is metabolic (e.g., ghrelin/leptin modulation of NAcc sensitivity).

  This datum undermines the **Felt-Quality Thesis** if that thesis implies the quality is intrinsic to the stimulus processing. It supports the **Deflationary** or **Desire-Based** views. It suggests that what we call "the pleasure of the drink" is actually "the homeostatic utility of the drink."
  *   *Verdict:* Alliesthesia describes heterogeneity in the **causes** (the gating mechanisms), which results in heterogeneity in the **pleasures** (the output signal). There is no stable "pleasure of sugar" to have a common quality; there is only the **reward prediction error** relative to a set point. The "pleasure" is the error signal itself, which is inherently variable.

  ### Probe 2: The Attitudinal Case

  **The Datum:** A parent's pleasure in her daughter's recovery. No sensory consumption, no **consummatory affective reaction** (no tongue protrusion, no smile necessarily), no obvious **reward prediction error** (the recovery was hoped for, not surprising).

  **Where it goes:**
  In the neuroscientific framework, this must be routed through the medial Prefrontal Cortex (mPFC) projecting to the ventral striatum. It is a "model-based" valuation rather than a "model-free" sensory reward. The **hedonic impact** is realized as a sustained modulation of tonic dopamine or opioid tone, rather than a phasic burst.

  **What is lost:**
  By sending it there, we lose the link to **consummatory affective reactions as the operational measure of hedonic impact**. If the parent feels profound pleasure but shows no affective discharge and consumes nothing, our operational measure fails. We are forced to rely on self-report, which breaks the third-person objectivity of the neuroscience.
  Furthermore, if there is no **RPE** (the recovery was expected/hoped for), we lose the learning signal. We are left with a state of "satisfaction" that does not reinforce new behavior. The framework struggles to distinguish this from a lack of negative affect (relief) rather than the presence of positive affect (pleasure). We lose the ability to distinguish "pleasure" from "absence of pain" without the somatic marker of the hotspot.

  ***

  ### Verdict on the Residue

  The residue report indicates that the limitation is not merely in the target vocabulary, but in the philosophical taxonomy itself.

  The **Felt-Quality Thesis** was attempting to name a unity that the brain does not implement. The **wanting/liking dissociation** and the existence of **alliesthesia** demonstrate that "pleasure" is not a single natural kind waiting to be found in the **hedonic hotspots**. It is a composite variable derived from homeostatic gating, incentive salience, and cortical appraisal.

  Therefore, the failure to translate the Felt-Quality Thesis without loss is evidence that the thesis was never a substantive claim about a biological reality, but rather a phenomenological heuristic. The neuroscientific vocabulary does not limit our understanding; it dissolves the problem by showing that the "common quality" philosophers seek is actually a functional convergence of distinct systems. The residue is not lost data; it is the shadow of a folk-psychological category that does not map onto the architecture of the reward system. The attitudinal case does not break the neuroscience; it merely forces us to admit that "pleasure" in the philosophical sense is often a high-level cortical narrative imposed upon a mix of relief, reduced prediction error, and social bonding circuitry, none of which require a unitary "hedonic feel."
