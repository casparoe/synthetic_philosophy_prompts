answer: |-
  Your gut is right to be suspicious. Your friend has basically summarized Frederick Whelan's famous 1983 paper *"Democratic Theory and the Boundary Problem,"* but they've taken Whelan's *logical* puzzle and turned it into a *cynical* conclusion that most contemporary political theorists reject.

  They are conflating "democracy cannot logically constitute its own boundaries" with "therefore, there are no moral standards for boundaries." That is a massive leap.

  Here is a claim-by-claim breakdown, followed by answers to your specific questions, and finally a rewritten version of the summary that would survive a seminar room.

  ### Part 1: Claim-by-Claim Audit

  | Friend's Claim | Verdict | Theoretical Nuance |
  | :--- | :--- | :--- |
  | **"Democracy means the people decide. But... you have to already know who the people are."** | **Accurate.** | This is the classic **Boundary Problem** (associated with Robert Dahl and Frederick Whelan). Logically, the *demos* (the people) must exist before they can vote, so they cannot vote themselves into existence. |
  | **"...there's no democratic way to settle that, because a vote about who gets to vote already presupposes an answer to it."** | **Accurate.** | This is the charge of **circularity**. You need a rule to decide who votes on the rule. Democracy requires a pre-democratic foundation. |
  | **"So the boundary of every single democracy is drawn by something non-democratic — conquest, colonial map-making..."** | **Simplification / Historical Conflation.** | While historically true (borders are often accidents of war), this is a **genetic fallacy**. Just because a border *originated* in violence doesn't mean it *cannot be justified* normatively now. Theorists argue we can evaluate existing borders even if we didn't vote on them. |
  | **"That's the paradox of democratic inclusion, and the upshot is that the borders of every existing democracy are basically arbitrary."** | **Contested / Too Strong.** | Most theorists say borders are **contingent**, not arbitrary. "Arbitrary" implies no reason can be given. Theorists give reasons (culture, coercion, residence). The paradox shows democracy isn't *self-sufficient*, not that it's baseless. |
  | **"There's no fact of the matter about whether the demos ought to include, say, long-term immigrant residents..."** | **Wrong.** | This is the biggest leap. Normative political theory exists precisely to establish "facts of the matter" (moral truths) about this. For example, the **All-Subjected Principle** argues there *is* a fact: if you are subject to the law, you must be in the demos. |
  | **"...so the question can only get settled either by force or by the demos just deciding to expand itself, which is circular..."** | **False Dilemma.** | It ignores **external normative standards**. We don't need the *demos* to decide; we need *justice* to decide. If justice says residents belong, the state is obligated to include them, regardless of the current voters' wishes. |
  | **"Theorists try to rescue it with the all-affected principle... but that one is self-refuting... infinite regress."** | **Mischaracterization.** | The "regress" objection exists (Whelan raised it), but it's not the main criticism. The main criticism is that **affectedness is too broad** (everyone is affected by everything) and **indeterminate** (you can't know who is affected until you know what the policy is). |
  | **"Which is why most people who actually work on this have quietly dropped it."** | **Exaggerated.** | **All-Affected** is still a major heuristic, especially in global justice literature. However, **All-Subjected** has gained ground as a more practical alternative for state boundaries. It hasn't been "dropped," but it has been heavily qualified. |

  ---

  ### Part 2: Nailing Down Your Specific Questions

  #### 1. Does circularity get you to "boundaries are arbitrary"?
  **No.** This is the weakest link in your friend's chain.
  The logical circularity proves that democracy is not **self-grounding**. It cannot be the *only* value in play. It requires a prior theory of justice to set the stage.
  *   **The Friend's Conclusion:** "Democracy can't set borders, so borders are meaningless/arbitrary."
  *   **The Standard Theoretical Conclusion:** "Democracy can't set borders, so **liberal justice** (or human rights, or coercion) must set the borders *for* democracy."
  *   **Why it matters:** If you accept your friend's view, you can't criticize a state for excluding long-term residents. If you accept the standard view, you can say, "The voters didn't decide to include them, but justice requires it."

  #### 2. Is the "infinite regress" the main objection to All-Affected?
  **No, it's a strawman of the real problem.**
  Your friend describes a logical regress (to decide who is affected, we need a vote, which affects people...). While Whelan did mention this, the more devastating objections are:
  *   **The "Everything is Connected" Problem:** If I vote on carbon taxes, it affects people in Bangladesh. Does the Bangladeshi farmer get a vote in my election? If yes, the *demos* becomes global. If no, why not? All-Affected tends to explode boundaries until they vanish.
  *   **The Ontology Problem:** You cannot know who is "affected" until you know what the decision *is*. But you need the *demos* to make the decision. So you need to know the *demos* to know the *decision* to know the *demos*.
  *   **Current Status:** All-Affected is still used for **transnational issues** (climate change, internet governance). For **state boundaries**, most theorists prefer **All-Subjected**.

  #### 3. What are the live alternatives? (All-Subjected vs. All-Affected)
  Your friend is wrong that the field has gone silent. The debate is very loud.
  *   **All-Affected (Interests):** Anyone whose interests are significantly impacted by a decision should have a say. (Good for global issues, bad for defining states).
  *   **All-Subjected (Coercion):** Anyone who is **subject to the coercive power of the law** should have a say. (This is the one you're hearing in seminar).
      *   *Why prefer it?* It's clearer. Either the police can arrest you or they can't. Either you pay taxes or you don't. It avoids the "everything is connected" problem.
      *   *Implication:* Long-term undocumented immigrants *are* subjected to the law, so they should be included. Tourists are not, so they are not.
  *   **All-Citizen (Status Quo):** Membership is determined by existing legal citizenship. (Defended by "democratic self-determination" advocates who worry All-Subjected destroys the ability of a community to shape its own character).
  *   **Stakeholder Principle:** Anyone with a genuine stake in the future of the polity (often ties residence + future orientation).

  ---

  ### Part 3: The Rewrite

  To make your friend's summary defensible, we need to keep the punchy logic about the "Boundary Problem" but remove the cynical leap to "arbitrariness" and correct the dismissal of the All-Affected principle.

  **Here is the revised version you could actually use:**

  > "Here's the foundational puzzle of democratic theory, often called the Boundary Problem. Democracy is rule by the people, but the definition of 'the people' cannot itself be decided by a democratic vote without circularity—you need a *demos* to vote on who belongs to the *demos*. Logically, this means the boundaries of a democracy must be grounded in something *pre-democratic*, like historical contingency, coercion, or normative principles of justice.
  >
  > This doesn't mean borders are morally arbitrary, but it does mean democracy isn't self-sufficient; it relies on external theories to justify its scope. The big debate is about which principle should draw those lines. The **All-Affected Principle** suggests anyone impacted by a decision should have a say, but critics argue this is too vague and potentially expands the *demos* to a global level. Consequently, many theorists now favor the **All-Subjected Principle**, which limits membership to those coerced by the state's laws. This avoids the regress problem, but it still requires a non-democratic moral judgment to define what counts as 'coercion' or 'subjecthood.' So, while existing borders may have historical accidents in their genesis, their *legitimacy* depends on whether they align with these normative principles, not on the will of the current voters."

  ### Key Changes Made:
  1.  **Swapped "Arbitrary" for "Pre-Democratic":** Acknowledges the logical limit without surrendering to nihilism.
  2.  **Fixed the Regress Objection:** Changed the objection to All-Affected from "self-refuting" to "too vague/globalizing," which is the actual standard critique.
  3.  **Added the Normative Hook:** Clarified that we use *justice* to solve the problem democracy can't solve itself.
  4.  **Updated the Literature:** Acknowledged that All-Subjected is the current rival, not that "everyone gave up."

  If you walk into seminar with the distinction between the **logical problem** (Whelan) and the **normative solution** (Abizadeh, Miller, etc.), you'll be in better shape than if you repeat the friend's "it's all arbitrary" take.
