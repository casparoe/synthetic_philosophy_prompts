  Elias provides the more robust account of the phenomenology of political agency, though Margit correctly identifies the logical instability in labeling a justified act as corrupting, and both fail by excluding the victim's moral standing.

  **Move 1 (Elias):** Lands. This accurately states the Walzerian "dirty hands" position: political justification does not erase personal moral violation.
  **Move 2 (Margit):** Lands. This is the standard consequentialist rebuttal: if an act is objectively justified, moral guilt is a category error, not a remainder.
  **Move 3 (Elias):** Partly lands. The claim that the victim's violation persists is strong, but the assertion that resignation is *owed* is contested even among dirty-hands theorists.
  **Move 4 (Margit):** Partly lands. It shows "dirt" smuggles in a conclusion only if one assumes a monistic moral ledger; if one accepts moral pluralism, the act can be right overall yet leave a deontological residue.
  **Move 5 (Elias):** Partly lands. Williams's concept of "agent-regret" applies to justified acts (as in Gauguin), but Williams distinguishes this from guilt, so it supports Elias's phenomenology but not necessarily his claim of corruption.
  **Move 6 (Margit):** Lands. She correctly identifies that Elias is redefining "guilt" as a psychological state rather than a moral judgment, which weakens his claim that the leader is objectively corrupt.
  **Move 7 (Elias):** Lands. The asymmetry of fittingness is strong evidence for non-consequentialist residue; if consequences were all that mattered, haunting by omission should equal haunting by commission.
  **Move 8 (Margit):** Partly lands. She concedes the phenomenological reality but denies it moral weight, which is a coherent position but leaves the leader's psychological burden unexplained as anything but prudence.

  **Overall Verdict:** Elias is more right about the lived experience of leadership, while Margit is more right about the logic of justification. The "dirty hands" problem is not settled consensus but a live debate between Walzerian pluralists and utilitarian monists; Elias represents the former, Margit the latter. However, Elias's account is better suited to drama because it acknowledges the moral cost that audiences intuitively feel, whereas Margit's account risks appearing sociopathic despite its logical coherence.

  **What Is Missing:** Both consultants ignore the victim entirely. The literature on torture (e.g., David Sussman, Henry Shue) emphasizes that the violation is of the victim's agency and bodily integrity, which cannot be "balanced" by the survival of others. The question of who can forgive is also absent: the two thousand saved cannot forgive the torture of the one, and the victim may be incapable of forgiving a systemic violation. This unredeemable debt is the true source of the "dirt," not merely the leader's internal state.

  **Contested vs. Settled:** You must treat the existence of "moral remainder" as contested. There is no philosophical consensus that a justified act leaves moral guilt; this is specific to the Walzerian tradition. Conversely, there is no consensus that justified acts leave *no* trace; many ethicists agree that tragic choices require mourning even if right. You are free to dramatize either position, but do not present Elias's view as the settled truth of political ethics, nor Margit's as the only rational option.
