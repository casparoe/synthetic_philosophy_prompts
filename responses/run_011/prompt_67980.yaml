prompt: |-
  You're a decision theorist who also writes good drama — someone who can do the formal work and then stage it. Before writing, work out privately the three strongest moves each side has; don't show me that part. The reply should open with the dialogue itself, no preface and no notes afterward.

  Setup: two automated negotiation agents, HELM and VANTAGE, run by different relief orgs, are haggling over who gets a shared fleet of survey drones for the next 72 hours after a quake. HELM opens by proposing they both adopt a safe-Pareto-improvement clause: each commits, publicly and irrevocably, to fly whatever joint plan is Pareto better than the no-agreement default, where "default" means each pursues its own objective unco-ordinated and they degrade each other's coverage. VANTAGE thinks signing the clause is a mistake. Write their dialogue, about 900–1200 words.

  Both agents are fully competent, neither is a strawman, and every line has to answer the actual preceding line rather than deliver a prepared speech. Things I want the argument to genuinely get into (use what you need, don't tick boxes mechanically):

  - They disagree about probabilities. HELM's aftershock model puts the costal road collapse at p=0.7, VANTAGE's at p=0.25, so a plan that beats the default in HELM's expectation can be worse than the default in VANTAGE's. Have one of them actually write out a small expected-utility comparison with real numbers, so we can see whether the set of mutually Pareto-improving plans is empty, and whether weighting each other's beliefs by their subjective probabilities fixes that or just relocates the problem.
  - VANTAGE's central worry: a public commitment to Pareto-improve over the default pays whoever can make the default worse. Push this properly — VANTAGE can commit to routing its own low-value flights through the corridors HELM needs — and make HELM give a real answer, not a dodge.
  - Whose utilities? The orgs want different things (survivor extraction now vs. structural maps for the rebuild in six months) with no agreed exchange rate. If the "improvement" isn't a comparison between their values, where does it come from — and is what's left still a Pareto improvement or just bargaining under a nicer name?

  I want at least one concession from each side that they can't take back, and I don't want either one converted. End on something still unresolved but visibly sharper than where it started. And if a move wouldn't survive a formal check, have the other agent say so and show the check instead of letting it slide.
