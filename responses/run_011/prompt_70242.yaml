prompt: |-
  Longtime reader of the usual rationalist blogs and forums, and I've finally got a draft of a post I've been meaning to write for about two years. Problem is I've stared at it too long to tell whether the central move is an actual argument or just a vibe wearing a decision-theory costume. Could you read it and give me real comments — critical ones, not encouragement?

  The topic is coherence arguments for expected utility maximization: Dutch books, money pumps, the various representation theorems, the whole "if your credences and preferences aren't coherent you're a pumpable idiot" genre. Plus the standard reply from our side of the internet, which is roughly that those theorems are vacuous, because literally any behavior whatsoever can be rationalized by some probability/utility pair if you're willing to make the utility function baroque enough.

  Here's the draft. Sections 1 and 2 are mostly written, 3 and 4 are notes, 5 is a list of things I'm worried about.

  ---

  **Coherence theorems are about compression, not about rationality**

  **1.** The genre. Take an agent, observe its choices over gambles/acts. The theorems say: if the choices satisfy axioms A1...An (completeness, transitivity, some independence/sure-thing condition, continuity-ish stuff), then there's a probability function and a utility function such that the agent is choosing as if maximizing expected utility. Flip it around and you get the polemic version: violate the axioms and you're money-pumpable or Dutch-bookable, so incoherence costs you money, so incoherence is irrational.

  The well-known deflation. The theorems are existence claims about an interpretation, and the interpretation is unconstrained. You can always rationalize a choice function by defining utility directly over the things chosen. So the theorems never rule any behavior out, and the normative punch ("you'd lose money!") is doing work the mathematics isn't. People usually conclude the whole genre is decorative and move on.

  **2.** My move: the deflation assumes interpretation is free, and it isn't. Any behavior is rationalizable by *some* pair, but the pairs differ wildly in how long they take to write down, and the vacuity objection silently lets you spend unlimited description length. So define, for a given pattern of behavior B, the interpretive cost: roughly, the size of the shortest description of a credence/utility pair that rationalizes B, plus the cost of searching for it. Now the coherence theorems become a different claim — not "incoherent agents get exploited" but "axiom violations buy you descriptive slack that you have to repay in a more baroque interpretation."

  Examples of the repayment:
  - An agent whose preferences flip with framing needs a utility function with a frame argument, or one indexed to the presentation of the problem rather than its content.
  - An agent that's ambiguity-averse can't be captured by a single probability plus utility over outcomes, since that's exactly what the independence/sure-thing condition forbids. The interpreter has to reach for something heavier: utility whose arguments include acts rather than just outcomes, a set of priors, second-order probabilities.
  - An agent with cyclic preferences needs either a utility function over sequences, or the claim that it's really several agents taking turns.

  On this reading "coherent" stops meaning "rational" and starts meaning "admits a short p,u interpretation." That's a property of the modeler's situation, not of the agent's reasons. Which suggests both sides of the old fight have been talking past each other: the deflationist is right that nothing is ruled out, and the decision theorist is right that the axioms buy you something — the something is compressibility, which is an epistemic/predictive virtue, not a normative one.

  **3.** (Notes.) This leaves a gap: why should an agent care about being compressible? Need a bridge from "your behavior has a short interpretation" to any reason to act. Candidate bridges: (a) self-knowledge — a short interpretation is one you can use on yourself, i.e. to notice you're doing something; (b) coordination — other agents can only cooperate with you if they can model you; (c) adversarial — see 4. Bridge (a) feels weakest and I might cut it.

  **4.** (Notes, and this is the part I think might be the actual point.) Adversarial framing. Incoherence is only exploitable if the exploiter can *find* the cycle, and finding it costs description length too. So incoherence is partly obscurity, and obscurity has defensive value against other bounded agents who model you in order to trade with you or pump you. If that's right, the conclusion is embarrassing for the rationalist moral: a bounded agent surrounded by bounded adversaries may have instrumental reasons to be less cleanly modelable — to look ambiguous, to keep preferences slightly intransitive in domains where the cycles are hard to locate, to be unpredictable in exactly the way coherence theorems call irrational. Coherence becomes something you want to be seen as having rather than something you want to have, which is a commitment/threat story rather than an accuracy story.

  **5.** Worries, in rough order of severity:
  (i) Is interpretive cost just the vacuity objection with new paint? Does section 2 predict anything, or could it be made to fit any behavior after the fact — in which case I've committed the sin I'm accusing the deflationists of.
  (ii) Section 2 smells strongly of the intentional stance: interpret the system as rational because that's the shortest predictive strategy, and treat departures as noise. If that's what it is, I've reinvented something from the 70s/80s and dressed it up.
  (iii) Does section 4 produce a norm or only contingent instrumental reasons? If the only reasons to be coherent come from there being exploiters around, then coherence drops out entirely for an isolated agent, and I'm not sure I want to accept that.
  (iv) I'm hand-waving about which theorem I'm leaning on. Savage-flavored setups and vNM-flavored setups don't fail in the same places, and "the interpreter reaches for a heavier representation" means different things in each. I don't want to write section 3 until I know whether the examples in section 2 survive that.
  (v) Is "compression" the right word, or does it invite people to think I mean Shannon coding of choice data, which I don't?

  ---

  What I want from you:

  - Is section 1 a fair characterization of the coherence-argument tradition and of the standard deflation, or am I strawmanning both to set up my own punchline? This is the one place I care about accuracy, since people who know this literature will bounce off the post immediately if I got the setup wrong.
  - Does section 2 actually have content? Specifically: is there a case where "axiom violation raises interpretive cost" is false or trivially satisfied, i.e. an incoherent behavior that turns out to be *more* compressible than a coherent one? If such cases are easy to find the thesis is dead and I'd rather know now.
  - Section 4 is my favorite part and I suspect it's the most likely to be confused. Does the obscurity-as-defense idea hold up, or does it collapse because a good exploiter doesn't need a short model of you, just a model of the relevant few choices?
  - Strongest objection a smart decision theorist would make to the whole thing, in one paragraph.
  - Is this interesting to someone who's read the usual takes, or does it read as a redescription with extra steps?

  Don't bother with a reading list or references, I can't go look things up right now and I mostly want to know where the argument breaks. I'm sure bits of this have been said before; I care about whether the argument works, not about priority.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the User and Request:**
      *   **User:** Longtime reader of rationalist blogs/forums (LessWrong, Slate Star Codex, etc.). Familiar with the jargon ("money pumps," "Dutch books," "representation theorems," "deflation," "intentional stance").
      *   **Task:** Critique a draft blog post about coherence arguments for expected utility (EU) maximization.
      *   **Constraint:** "Real comments — critical ones, not encouragement." No reading lists/references. Focus on whether the argument works, not priority.
      *   **Specific Questions:**
          1.  Is Section 1 fair (strawman check)?
          2.  Does Section 2 have content (is "interpretive cost" meaningful or just reframed vacuity)?
          3.  Does Section 4 hold up (obscurity as defense)?
          4.  Strongest objection from a decision theorist (one paragraph).
          5.  Is this interesting or just redescription?

  2.  **Analyze the Draft Content:**
      *   **Core Thesis:** Coherence theorems aren't about rationality/normativity; they're about *compression* (description length of the utility/probability model). Violating axioms increases the "interpretive cost" (complexity of the model needed to rationalize behavior).
      *   **Section 1:** Sets up the standard view (axioms $\to$ EU) and the standard deflation (any behavior is rationalizable with complex enough utility). Claims both talk past each other.
      *   **Section 2:** Introduces "interpretive cost." Coherent = short description. Incoherent = long/baroque description. Examples: framing effects, ambiguity aversion, cyclic preferences.
      *   **Section 3:** (Notes) Why care about compressibility? Self-knowledge, coordination.
      *   **Section 4:** (Notes) Adversarial framing. Incoherence = obscurity = defense against exploitation by bounded agents. Coherence is signaling, not necessarily internal truth.
      *   **Section 5:** Worries (vacuity repaint, intentional stance, normative force, theorem specifics, terminology).

  3.  **Drafting the Critique - Section by Section:**

      *   **Q1: Section 1 Fairness (Strawman Check):**
          *   *Thought:* Is the "standard deflation" accurately portrayed? Yes, the "anything can be rationalized" objection is common (e.g., Hausman, or just general LW skepticism). Is the "coherence argument" tradition accurately portrayed? Mostly, though some proponents (like Yudkowsky) emphasize the *steering* aspect more than just the math. But for the purpose of this post, the setup is acceptable.
          *   *Critique:* It's mostly fair, but misses the *dynamic* aspect of money pumps. The deflation isn't just "you can fit a utility function," it's "you can fit a utility function *post-hoc*," whereas money pumps happen *in real time*. The draft hints at this but could be sharper.
          *   *Verdict:* Fair enough for a blog post, but acknowledge the "predictive vs. normative" split more clearly.

      *   **Q2: Section 2 Content (The "Compression" Move):**
          *   *Thought:* This is the crux. Is "interpretive cost" just Kolmogorov complexity applied to utility functions? Yes. Does it add value?
          *   *Potential Failure Mode:* Is there a case where incoherence is *simpler*?
          *   *Example:* Random choice. A coherent agent needs a specific probability distribution over outcomes. A random chooser just needs "pick uniform random." Wait, random choice *is* coherent (EU with linear utility over lotteries).
          *   *Better Example:* A lexicographic preference. It violates continuity (vNM). To model it with EU, you need infinitesimal utilities or a hierarchy. That *is* more complex.
          *   *Counter-Example:* What if the "incoherent" behavior is actually a simple heuristic? E.g., "Always pick the red button." That's coherent. "Pick red unless it's Tuesday." Coherent (state-dependent utility). "Pick red, then blue, then red, then blue..." (Cyclic). To model this as EU maximization, you need time-indexed utilities or state-dependence that tracks the cycle. That *is* more complex than a static utility function.
          *   *The Trap:* The "cost" is relative to the *language* of the modeler. If the modeler's language includes "frame-dependent utility" as a primitive, framing effects are cheap. The argument relies on a specific prior over utility functions.
          *   *Verdict:* It has content, but it relies on a simplicity prior over *representations*. It risks being tautological ("Complex behavior requires complex models") unless tied to *computational* cost of the agent, not just the modeler.

      *   **Q3: Section 4 (Obscurity as Defense):**
          *   *Thought:* This is the "strategic irrationality" argument. Schelling points, MAD, etc.
          *   *Critique:* The "good exploiter doesn't need a short model" objection is strong. If I can pump you, I don't need to know *why* you choose, just *that* you choose A>B>C>A. I just need to offer the trades.
          *   *Nuance:* However, finding the cycle *in the wild* requires modeling. If your preferences are context-dependent in a high-dimensional way, finding the Dutch Book requires searching that space. So obscurity *does* raise the search cost for the exploiter.
          *   *Verdict:* It holds up *if* the environment is computationally bounded. If the exploiter is unbounded, obscurity fails. The draft acknowledges "bounded adversaries," which saves it.

      *   **Q4: Strongest Objection (One Paragraph):**
          *   *Thought:* What would a formal decision theorist say? They'd attack the conflation of *representation* with *mechanism*.
          *   *Drafting:* "You are conflating the complexity of the *representation* with the complexity of the *mechanism*. An agent can be implemented by a simple neural net that violates transitivity, while the EU representation of that net is astronomically complex. But the *agent* isn't paying the cost of the representation; the *modeler* is. Normativity is about what the agent ought to do to achieve its goals, not about how hard it is for you to write a paper about it. Unless you can show that the agent *itself* pays a computational cost for incoherence (e.g., internal conflict, resource waste), 'interpretive cost' is a tax on the observer, not a reason for the agent to change."

      *   **Q5: Interesting or Redescription?**
          *   *Thought:* It connects MDL (Minimum Description Length) to Decision Theory. This is essentially the "Intentional Stance" (Dennett) + Solomonoff Induction.
          *   *Verdict:* It's a useful synthesis for the rationalist community, even if philosophers of mind said it in the 80s. The "obscurity as defense" angle is the fresh bit.

  4.  **Refining the Critique (Self-Correction/Polishing):**
      *   *Tone:* Keep it sharp, peer-to-peer, no fluff.
      *   *Specifics:* Point out the "Language Dependence" problem in Section 2. If my language allows `U(outcome, frame)`, framing isn't costly. The argument needs a "natural" basis for the utility function.
      *   *Section 4:* Emphasize that money pumps don't require *understanding* the agent, just *interacting*. But *finding* the pump does. Distinguish between *execution* cost and *discovery* cost.
      *   *Section 1:* Mention that the "deflation" often ignores the *dynamic* consistency arguments (not just representation theorems).

  5.  **Final Review against User Constraints:**
      *   Critical? Yes.
      *   No encouragement? Yes.
      *   Answer specific questions? Yes.
      *   No reading lists? Yes.

  6.  **Constructing the Output:** (Proceed to generate response based on these thoughts.)
answer: |-
  **1. Is Section 1 fair?**
  Mostly, but you are slightly conflating two different arguments that usually get lumped together: **Representation Theorems** (vNM, Savage) and **Dynamic Consistency Arguments** (Money Pumps, Dutch Books).

  The deflationary objection ("you can rationalize anything") applies strongly to Representation Theorems. It applies less well to Money Pumps. A money pump argument doesn't claim "we can fit a utility function to this"; it claims "if you act this way *in sequence*, you will end up with less money than you started, regardless of your utility function." The deflationist reply to money pumps is usually "so what? I value the process of choosing, not just the outcome," which is different from the "baroque utility function" reply.

  If you treat the whole genre as one blob, a knowledgeable reader will think you're ignoring the dynamic consistency literature. You should explicitly distinguish them in Section 1. Acknowledge that the "baroque utility" defense works against Savage/vNM, but the "I value the trajectory" defense is what's needed for Money Pumps. Your compression argument actually bridges these better if you make the distinction clear: both dynamic inconsistency and baroque utilities increase description length.

  **2. Does Section 2 have content?**
  It has content, but it is vulnerable to **Language Relativity**. "Interpretive cost" is not an intrinsic property of the behavior; it is a property of the behavior *relative to a description language*.

  If your description language includes primitives like `U(outcome, frame)` or `P(event | context)`, then framing effects and ambiguity aversion are *cheap* to describe. In fact, in a rich enough language, the "incoherent" behavior might be the *simplest* description. For example, if an agent always chooses the red button, a model `U(red)=1, U(blue)=0` is simple. If an agent chooses red unless the button is slightly scratched, and you force a "coherent" model that ignores scratches, you need a massive lookup table. If you allow "scratch" as a state variable, it's simple again.

  To save this, you need to argue for a **privileged basis**. Why is `U(outcome)` more natural than `U(outcome, frame)`? You need to lean on the idea that the *world* presents outcomes, not frames, or that computational agents have limited bandwidth for state-variables. Without a privileged basis, "compression" is just "fitting the model to the bias of the modeler."

  **Counter-example to watch for:** A agent that chooses randomly.
  *   Coherent model: `U(A)=U(B)`, indifferent. Very short.
  *   Incoherent model: (None needed, random choice is coherent).
  *   What about an agent that chooses A 51% of the time and B 49% of the time?
  *   Coherent model: Mixed strategy / Probabilistic utility. Short.
  *   Is there a case where incoherence is *simpler*?
      *   Consider a "Rock" agent (always plays Rock in RPS). Coherent.
      *   Consider a "Cycle" agent (Rock, Paper, Scissors, Rock...).
      *   Coherent rationalization: Utility depends on time-step `t`. `U(R, t=0) > U(P, t=0)...` This requires encoding `t` in the utility function.
      *   Incoherent description: "Cycles R-P-S".
      *   Here, the "incoherent" label might actually be the *shorter* description if your language has a "cycle" primitive.
      *   **Verdict:** Your thesis holds only if the "coherent" language (EU) is the *compression language*. You are essentially arguing that EU is a good compression algorithm for behavior. This is true, but it means "rationality" is "lossy compression." That's a strong claim, but you need to defend why EU is the target compression format rather than, say, a Turing Machine or a Neural Net.

  **3. Does Section 4 (Obscurity as Defense) hold up?**
  This is the strongest part, but the objection you anticipated ("exploiter doesn't need a short model") is more damaging than you think.

  To money-pump you, I do not need a *generative model* of your preferences. I only need an *oracle* that tells me your choice between pairs. If I can query you, I can find a cycle without understanding *why* you choose. I just need to map the graph of your choices.

  Obscurity only helps if **query access is expensive**. If I have to *guess* your preferences based on observing you in the wild (without being able to offer arbitrary gambles), then a complex/baroque utility function makes me need more data points to find the pump.

  So, the argument works for **passive adversaries** (who observe) but fails for **active adversaries** (who can offer trades). Since the Money Pump argument assumes an active adversary (the pump operator), your defense undermines the specific threat the coherence theorems warn about. You are arguing that incoherence protects against *induction*, not against *exploitation* once the induction is solved. Make that distinction clear.

  **4. Strongest objection a smart decision theorist would make:**
  "You are conflating the complexity of the *representation* with the cost paid by the *agent*. The coherence theorems are normative because they describe conditions under which an agent avoids self-sabotage (losing resources for no gain). The fact that a modeler needs a complex equation to describe the self-sabotage is irrelevant to the agent's welfare. An agent can be implemented by a very simple circuit that is money-pumped (e.g., a simple intransitive comparator). The circuit doesn't pay a 'description length' tax; it pays a 'resource loss' tax. Your argument shifts the normativity from the agent's outcomes to the modeler's convenience. Unless you can show that maintaining incoherence requires internal computational resources (e.g. state-tracking to avoid the pump), 'interpretive cost' is a tax on the observer, not a reason for the agent to change."

  **5. Is this interesting or redescription?**
  It is interesting, but it is effectively **Minimum Description Length (MDL) applied to the Intentional Stance**. Dennett argued we treat systems as agents when it's the most efficient predictive strategy. You are arguing that "coherence" is the metric of that efficiency.

  For the rationalist blogosphere, this is a useful update because it moves the debate from "Is EU true?" to "Is EU a good compression format?" This dissolves the ontological worry (do agents *have* utility functions?) and replaces it with a pragmatic one (does assuming they do help us predict/control?).

  However, Section 3 (Why should the agent care?) is the weak link. If coherence is just about modeler compression, the agent has no reason to be coherent unless the modeler is threatening it (Section 4). You need to bridge the gap: **Internal Modeling.** If the agent models *itself* to make decisions, then interpretive cost becomes computational cost. An agent that can't compress its own preferences can't plan efficiently. That is the missing bridge to normativity. If you add that, it moves from "interesting redescription" to "actual argument."

  **Summary of fixes:**
  1.  Distinguish Representation Theorems from Money Pumps in Section 1.
  2.  In Section 2, acknowledge language relativity and argue for EU as a specific "natural" compression format (perhaps based on causal structure of the world).
  3.  In Section 4, clarify that obscurity protects against *discovery* of pumps, not *execution* of pumps.
  4.  In Section 3, add "Self-Modeling" as the bridge. If the agent uses a model to plan, description length = compute cost = resource cost. That makes coherence instrumentally rational for the agent, not just the modeler.
