      *   **Ranking Severity:**
          1.  **1, 2, 3, 7 (Logical Impossibility):** You literally cannot write the charter. It will be void for uncertainty.
          2.  **2 & 6 (Philosophical Contradiction):** You can write it, but the justification memo will contradict the charter text.
          3.  **6, 7, 8 (Policy Failure):** You can write it, but the result is economically stupid ($y$ instead of $x$).

      *   **1 vs 6 Analysis:**
          *   Under 1 (Outcome Rights) + 2 (Pareto): Cycle ($x \succ y \succ z \succ x$ etc.). No maximal element. Violates 7.
