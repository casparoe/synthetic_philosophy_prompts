  8.  **Refining the Translation & Distinctions:**

      *   Need to be precise with the Latin concepts but accessible.
      *   *Charge 1:* *A rebus gerendis* (From active affairs). Concede: High-stakes leadership. Deny: Usefulness/Counsel.
