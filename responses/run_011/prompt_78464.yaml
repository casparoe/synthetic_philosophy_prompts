  2.  **Deconstruct Cicero's *De Senectute* (On Old Age):**

      *   *Source:* Cato the Elder (speaking for Cicero) addresses four common complaints/charges against old age.
      *   *The Four Charges:*
          1.  It withdraws us from active pursuits (*avocat a rebus gerendis*).
          2.  It enfeebles the body (*corpus efficit infirmius*).
