          4.  It is not far from death (*non longe abesse a morte*).
      *   *Cato's Strategy:*
          1.  *Active Pursuits:* Concedes old men can't lead armies, denies they can't lead by counsel/wisdom. (Shift from action to guidance).
          2.  *Body:* Concedes strength fades, denies it is necessary for all tasks. (Shift from strength to maintenance/moderation).
          3.  *Pleasure:* Concedes violent pleasures fade, denies this is a loss (calls it a blessing). (Shift from sensation to intellectual/spiritual joy).
          4.  *Death:* Concedes death is near, denies it is evil. (Shift from fear to acceptance/nature).

  3.  **Adaptation to CCRC Context (The Framework):**

      *   *Challenge:* Cicero assumes a wealthy, male, Roman aristocrat who is intellectually vigorous until death. A modern CCRC includes people with dementia, physical frailty, and diverse interests.
