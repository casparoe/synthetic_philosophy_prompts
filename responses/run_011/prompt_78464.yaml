          *   If a proposal relies on something Cicero *denies* is lost (e.g., capacity for contribution), it should be prioritized.
      *   *Operationalizing:* Turn the philosophical defense into a rubric.
      *   *Time Limit:* 20 mins means the rubric must be sharp.

  4.  **Drafting the Framework (Iterative Process):**

      *   *Charge 1 (Active Pursuits):* Does this program assume residents can manage high-stakes external affairs?
          *   *Cicero:* Can't lead legions (Concede). Can advise (Deny loss of utility).
          *   *CCRC:* Can't run a company (Concede). Can mentor/learn (Deny loss of purpose).
      *   *Charge 2 (Physical Frailty):* Does this require high physical exertion?
          *   *Cicero:* Strength fades (Concede). Vitality not needed for wisdom (Deny necessity).
          *   *CCRC:* No marathon running. But movement is good.
      *   *Charge 3 (Pleasure):* Is this purely hedonistic?
          *   *Cicero:* Lust/Gluttony fade (Concede). Good riddance (Deny it's a loss).
          *   *CCRC:* Wine/Food is okay, but is it the *point*?
      *   *Charge 4 (Death/Decline):* Does this ignore mortality/cognitive decline?
          *   *Cicero:* Death is near (Concede). It's natural (Deny fear).
          *   *CCRC:* Memory care exists. We can't pretend everyone is independent.

      *   *Refining the "Stop/Go":*
          *   If a proposal requires what Cicero *concedes* is gone (e.g., heavy labor, risky travel) without accommodation -> **NO**.
          *   If a proposal leverages what Cicero *denies* is gone (e.g., wisdom, mentorship, appreciation of beauty) -> **YES** (prioritize).
          *   If it's about pleasure (Charge 3), it needs to be "higher" pleasure, not just consumption.

  5.  **Critiquing the Framework (The "Misfire" Analysis):**

      *   *Cicero's Bias:* Elite, male, Stoic, cognitively intact.
      *   *The Misfire:* Memory Care. Cicero assumes *ratio* (reason) is intact. Dementia removes *ratio*. His framework values intellectual contribution. A program for advanced dementia (Proposal C) might fail a strict Ciceronian test because it doesn't utilize "wisdom" or "counsel."
      *   *The Resentment:* Proposal A (Wine/Film). Cicero is suspicious of "voluptas" (pleasure). A strict reading might flag this as indulgent. Residents will hate this.

  6.  **Applying to the Three Proposals:**

      *   *(a) Wine & Film:*
          *   Charge 3 (Pleasure): Is it mere indulgence? Cicero warns against this.
          *   Charge 2 (Body): Alcohol/Health?
          *   *Verdict:* Risky under this framework. Needs reframing as "aesthetic appreciation" not "drinking."
      *   *(b) Tutoring:*
          *   Charge 1 (Active Pursuits): Perfect fit for "counsel/wisdom."
