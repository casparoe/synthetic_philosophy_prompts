answer: |-
  # JOINT STATEMENT ON LOGICAL UNCERTAINTY
  **Prepared for the Final Session of the Graduate Seminar on Formal Epistemology**
  **Date:** [Current Date]
  **Signatories:** Camp A (Coherence-First) and Camp B (Proof-First)

  ## 1. AGREED CLAIMS

  The following propositions represent the common ground established during this unit. Each claim includes an explicit statement of the theoretical cost incurred by each camp in signing it.

  1.  **The Rejection of Logical Omniscience.**
      Standard Bayesian coherence, which requires an agent's probability function to be defined over a sigma-algebra and to assign probability 1 to all logical truths, is an incorrect normative model for bounded reasoners dealing with mathematical conjectures.
      *   *Cost to Camp A:* We concede that the standard axioms cannot be merely "relaxed" without altering the foundational justification for why probability theory governs belief. We accept that the ideal reasoner is not a static probability measure but a dynamic process.
      *   *Cost to Camp B:* We concede that rejecting omniscience does not license arbitrariness. Merely citing boundedness is insufficient; we must explain why specific non-omniscient states are rationally required rather than just excusable.

  2.  **The Phenomenology of Graded Confidence.**
      Rational agents legitimately hold graded, stable confidence levels in unproven mathematical propositions (e.g., the Riemann Hypothesis), and these levels shift in response to partial results (e.g., verification of zeros, consistency checks) even in the absence of a proof or disproof.
      *   *Cost to Camp A:* We admit that "confidence" here may not map cleanly to betting odds in a single-shot scenario, as the payoff conditions for mathematical truths are often undefined until resolution.
      *   *Cost to Camp B:* We admit that describing this confidence as "belief about future proof" is incomplete. The confidence feels directed at the *content* of the conjecture, not merely the social state of the mathematical community, and our account must explain this directedness without smuggling in truth-conditions we claim are inaccessible.

  3.  **The Eventual Authority of Deduction.**
      Any adequate account must entail that once a proof or disproof is found and verified, the agent's confidence must collapse to 1 or 0 respectively. Furthermore, deductive relations constrain belief *before* the proof is known (e.g., if $P \implies Q$, confidence in $Q$ cannot be lower than confidence in $P$).
      *   *Cost to Camp A:* We acknowledge that enforcing these constraints computationally is intractable in the general case. Our norms describe a limit that cannot be reached in finite time, meaning the constraints are aspirational rather than immediately binding.
      *   *Cost to Camp B:* We acknowledge that "provability" is not binary in practice. An agent often recognizes a deductive link heuristically before formalizing it. We must account for the normativity of these heuristic links without granting them the status of formal proof.

  4.  **The Market Metaphor as a Diagnostic Tool.**
      Modeling belief as a market price subject to exploitation by traders is a valid framework for identifying irrationality, provided the computational power of the traders is specified.
      *   *Cost to Camp A:* We accept that if the traders required to enforce coherence are more computationally powerful than the agent itself, the norm may be irrelevant to the agent's actual design.
      *   *Cost to Camp B:* We accept that the market metaphor captures something real about the consistency of belief. We cannot dismiss it merely because it is idealized; we must show why the specific idealization fails to guide action.

  ---

  ## 2. DISAGREEMENTS TABLE

  | Disputed Claim | Camp A (Coherence-First) Formulation | Camp B (Proof-First) Formulation | Substantive or Verbal? | Difference in Guidance / Computation |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Object of Mathematical Credence** | A credence of $p$ in conjecture $C$ is a belief about the truth value of $C$ in the standard model of arithmetic, held under computational limitation. | A credence of $p$ in conjecture $C$ is a belief about the likelihood that a proof of $C$ (or $\neg C$) will be constructed, or about the fruitfulness of assuming $C$. | **Substantive** | **Camp A** designs algorithms to minimize loss against a truth-oracle in the limit. **Camp B** designs algorithms to optimize resource allocation for proof-search. Camp A pays bets on $C$ if $C$ turns out true, even if unprovable. Camp B views the bet as void if no proof is produced. |
  | **The Feasibility of the Norm** | A norm is valid if it describes a limit that a sequence of computable distributions can approach, even if no finite step achieves it. The ideal is a fixed point of reflection. | A norm is valid only if a bounded agent can approximate it within its resource constraints. An ideal that requires unbounded reflection is a change of subject, not an idealization. | **Substantive** | **Camp A** accepts "logical induction" criteria where exploitation is impossible only in the limit. **Camp B** rejects strategies that require resources the agent cannot verify. Camp B will refuse to quote prices that rely on convergence guarantees it cannot check. |
  | **The Status of Consistency** | Inconsistency (assigning probabilities summing to >1 for mutually exclusive sentences) is a vulnerability to be exploited by traders. It is always irrational. | Inconsistency is sometimes a necessary cost of heuristic reasoning. Maintaining local coherence may prevent the discovery of global proofs. | **Verbal (with substantive edges)** | If "irrational" means "exploitable," Camp A says yes, Camp B says "only by traders we cannot build." If the traders are feasible, both agree inconsistency is bad. The dispute is over which traders count as relevant. |
  | **Self-Reference and Fixed Points** | An agent can consistently assign probabilities to its own probability assignments via fixed-point theorems. The market clears at a stable price. | Self-referential probability claims generate hierarchies or paradoxes. An agent should not treat its own output as an object of uncertainty in the same language. | **Substantive** | **Camp A** computes a fixed point (e.g., assigning 0.5 to "This sentence has prob < 0.5"). **Camp B** refuses to assign a value or assigns a value in a meta-language, potentially leading to different betting behavior in self-referential markets. |

  **Note on the Verbal/Substantive Test:**
  Regarding the third row (Consistency), we apply the following test: If Camp A and Camp B recommend the same prices for all bets that can be practically settled within the agent's lifetime, the dispute is verbal. However, because Camp A accepts vulnerability to traders that run in time $O(n^2)$ even if the agent runs in $O(n)$, while Camp B rejects norms enforced by faster traders, there is a substantive divergence in *which* algorithms are deemed rational. Camp A endorses an algorithm that loses money to a faster trader in the short run to ensure long-run convergence. Camp B endorses an algorithm that avoids short-run loss even if long-run convergence is not guaranteed.

  ---

  ## 3. WORKED CASES

  ### Case 1: The Biased Scoring of 5,000 Conjectures
  **Scenario:** An agent must assign a number $p_i \in [0,1]$ to 5,000 open arithmetical conjectures. Later, a subset will be resolved. The resolution process is biased: conjectures that are true and "interesting" are more likely to be resolved. The agent is scored using a proper scoring rule (e.g., Brier score) on the resolved subset only.

  **Camp A Analysis:**
  *   **Meaning:** The numbers represent the agent's best estimate of the truth value in the standard model.
  *   **Norm:** The agent should minimize expected Brier loss relative to the *true* distribution, accounting for the selection bias. The agent must model the resolution process itself as a probabilistic event correlated with truth.
  *   **Success Condition:** The agent performs well if its probabilities are calibrated on the resolved subset *after correcting for the selection bias*. If the agent assigns 0.9 to statements that turn out true 90% of the time *in the resolved set*, it has failed if the resolution process was biased toward truths. It must anticipate the bias.
  *   **Computation:** The agent runs a logical induction algorithm that weights traders based on their ability to predict both mathematical truth and the sociological process of proof-discovery.

  **Camp B Analysis:**
  *   **Meaning:** The numbers represent the agent's estimate of the *provability* of the conjecture within a reasonable timeframe, or the utility of assuming the conjecture.
  *   **Norm:** The scoring rule is flawed because it scores against truth, which is inaccessible. The agent should optimize for "proof-predictive accuracy."
  *   **Success Condition:** The agent performs well if its high-confidence assignments correlate with *eventual proof*, regardless of truth (since unproven truths are indistinguishable from falsehoods to the agent). If a conjecture is true but unprovable, Camp B argues the agent should not have assigned it high confidence, as that confidence implies a commitment to a proof path that does not exist.
  *   **Computation:** The agent analyzes the structural similarity of the conjectures to previously proved theorems. It assigns high numbers to conjectures that look "provable," even if they might be false (heuristically), and low numbers to independent statements.

  **Divergence:** Camp A tries to correct for the bias to track truth. Camp B leans into the bias, treating "interestingness" (which correlates with proof) as a feature, not a bug. Camp A might assign high probability to a true but uninteresting (and thus unproven) statement; Camp B will assign it low probability.

  ### Case 2: The Self-Referential Share
  **Scenario:** A sentence $S$ states: "The market price of a share paying $1 if $S$ is true is less than 0.5." A share on $S$ is offered in the market.

  **Camp A Analysis:**
  *   **Action:** The market should converge to a fixed point. If the price is $< 0.5$, $S$ is true, so the share pays $1$, driving the price up. If the price is $\geq 0.5$, $S$ is false, so the share pays $0$, driving the price down. The stable equilibrium is exactly 0.5.
  *   **Description:** The agent assigns probability 0.5 to $S$. This is a coherent belief state about a self-referential truth.
  *   **Behavior:** The agent is willing to buy or sell near 0.5. It views the paradox as resolvable via continuous valuation.

  **Camp B Analysis:**
  *   **Action:** The agent should refuse to price $S$ in the object language. $S$ creates a semantic loop that violates the hierarchy of proof.
  *   **Description:** The "probability" here is not about truth but about the agent's own output. The agent cannot treat its own pricing mechanism as an external fact without risking inconsistency.
  *   **Behavior:** The agent either declines to trade or quotes a price in a meta-language (e.g., "The probability that I will price this at 0.5 is 1"). In the object market, Camp B's agent might exhibit volatility or refuse liquidity, recognizing that no stable truth-value exists to anchor the bet.

  **Divergence:** Camp A trades at 0.5. Camp B withdraws or stratifies. This is a behavioral divergence: Camp A provides liquidity; Camp B withholds it.

  ---

  ## 4. CRUXES

  The following sub-questions represent the pivot points of our disagreement. Settling any one would significantly shift the burden of proof.

  **Crux 1: The Approximability of the Logical Inducer**
  *   **The Question:** Can a bounded agent approximate the logical induction criterion sufficiently well to avoid exploitation by traders of comparable complexity, without requiring resources that scale prohibitively with the language size?
  *   **Accepted Bearing:** Both camps accept that if the logical inducer requires resources exponential in the length of the sentences to approximate, it is not a norm for bounded agents.
  *   **Camp A Prediction:** There exists a polynomial-time approximation scheme that satisfies the non-exploitability criterion for all traders of equal or lesser complexity.
  *   **Camp B Prediction:** No such scheme exists. Any agent immune to efficient traders must itself be super-efficient, creating a hierarchy where no agent is ideally rational relative to its peers.
  *   **Defeat Condition:**
      *   *Camp A Defeat:* A proof that any distribution satisfying the logical induction criterion requires hyper-computational resources to approximate within a fixed error bound.
      *   *Camp B Defeat:* A construction of a feasible algorithm that maintains coherence against all polynomial-time traders without collapsing into triviality.

  **Crux 2: The Truth-Tracking of Heuristics**
  *   **The Question:** Do mathematical heuristics (e.g., probabilistic number theory) track objective truth frequencies in the limit, or do they track the structure of human proof-systems?
  *   **Accepted Bearing:** Both camps accept that heuristics successfully guide research. The dispute is whether their success is evidence of truth or evidence of proof-feasibility.
  *   **Camp A Prediction:** Heuristics will remain accurate even for statements that are formally independent of standard axioms (e.g., large cardinal axioms), provided they have truth values in the standard model.
  *   **Camp B Prediction:** Heuristics will fail or become undefined for statements independent of the agent's axiom system, as "truth" without proof is operationally empty.
  *   **Defeat Condition:**
      *   *Camp A Defeat:* Demonstration that heuristic confidence systematically diverges from truth values in cases where proofs are impossible (e.g., in models where the heuristic suggests truth but the statement is false in the standard model).
      *   *Camp B Defeat:* Demonstration that agents using "proof-feasibility" metrics consistently lose bets against truth-oracles in independent cases.

  **Crux 3: The Metaphysics of Logical Probability**
  *   **The Question:** Is the disagreement merely about the word "probability," or about the existence of logical facts prior to proof?
  *   **Accepted Bearing:** Both camps accept that no empirical study can settle the existence of platonic mathematical objects.
  *   **Resolution Path:** This crux cannot be settled empirically. It requires a philosophical argument about whether "uncertainty" requires the possibility of variation.
  *   **Camp A Stance:** Uncertainty is about information, not variation. The fact is fixed; my access is variable.
  *   **Camp B Stance:** Uncertainty requires the possibility of the world being otherwise. Since math cannot be otherwise, "uncertainty" is a category mistake unless redefined as "uncertainty about my mind."
  *   **Verdict:** This is a foundational philosophical divergence. No study will settle it. It must be resolved by arguing which definition yields a more productive research program.

  ---

  ## 5. CONCEDED WEAKNESSES

  **Camp A (Coherence-First) Concessions:**
  1.  **The Gap Between Limit and Now:** Our strongest theorems describe asymptotic behavior (in the limit of infinite time). We lack a robust theory of *interim* rationality. We cannot tell an agent what to believe at step $n$, only that it will be right at step $\infty$. This leaves the practicing mathematician without guidance for the next hour.
  2.  **The Cost of Coherence:** Enforcing coherence constraints (like $P(A \land B) \leq P(A)$) requires computational work. We have not fully accounted for the opportunity cost of this computation. An agent spending all resources on coherence may prove fewer theorems than an agent tolerating local inconsistency.

  **Camp B (Proof-First) Concessions:**
  1.  **The Formalization of "Fruitfulness":** We claim credences track proof-feasibility or conceptual fruitfulness, but we lack a formal calculus for these properties. "Fruitfulness" remains a hand-wavy sociological notion. Without a formal model, our account is descriptive rather than normative.
  2.  **The Risk of Skepticism:** By tying belief strictly to provability, we risk collapsing into skepticism for any system strong enough to be subject to Gödelian incompleteness. If we cannot assign probabilities to independent statements, our account cannot guide decisions in set theory or foundational mathematics where independence is common.

  ---

  **Final Verdict on Synthesis:**
  We resist the temptation to synthesize these positions into a "hybrid" view. The disagreement is not merely about parameters but about the *direction of fit*. Camp A seeks to fit the mind to the mathematical world (via truth-tracking). Camp B seeks to fit the mathematical world to the mind (via proof-construction). Until Crux 1 (Feasibility) is resolved, these remain distinct research programs. If Camp A is right, Camp B is merely engineering a workaround for a solvable problem. If Camp B is right, Camp A is solving a problem that does not exist for bounded agents. We submit this document not as a resolution, but as a map of the terrain we must jointly navigate.
