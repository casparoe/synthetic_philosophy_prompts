answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: THE ONTOLOGY OF DREAM REPORTS

  **Date:** October 26, 2023
  **Parties:** Camp A (Experiential Realists) and Camp B (Report Skeptics)
  **Subject:** The temporal and phenomenal status of dream content.

  ## 1. AGREED CLAIMS AND DEFINITIONS

  Both camps assent to the following propositions. These claims establish the empirical baseline and the semantic boundaries required for the disagreement to be substantive rather than terminological. Camp B notes that its assent rests on two independent lines of reasoning (Causal/Cognitive and Conceptual/Grammatical) which do not rely on one another.

  1.  **Temporal Asymmetry of Reporting:** All dream reports are produced by subjects in a waking (or lucid-transition) state *after* the period of sleep in question. No report is produced simultaneously with the sleep state unless specific signaling protocols are established.
  2.  **Neural Activity:** Specific patterns of neural activation (e.g., PGO waves, cortical activation during REM) occur during sleep prior to waking. Both camps agree these activations exist; they disagree on whether these activations constitute *phenomenal experience* at the time of occurrence.
  3.  **Memory Fallibility:** Human memory is reconstructive. The act of reporting a past mental state alters the memory trace of that state. Both camps agree that dream reports are subject to decay, confabulation, and narrative smoothing upon waking.
  4.  **Definition of "Experience" (Substantive Condition):** For the disagreement to be non-verbal, "experience" must be defined as a state possessing **phenomenal character** (there is "something it is like" to be in the state) that is **temporally located** at the time of the neural activity (during sleep), independent of the subsequent memory of that state.
      *   *Camp A* asserts dreams meet this definition.
      *   *Camp B* asserts dreams do not meet this definition (Causal claim) and/or that the definition is inapplicable to the grammar of dreaming (Conceptual claim).
  5.  **Truth Conditions:** A dream report is considered "accurate" if it corresponds to the subject's sincere conviction upon waking. Both camps agree that subjects are the ultimate authorities on *what they report*, but disagree on what the report is *about* (a past experience vs. a current construction).
  6.  **Independence of Camp B Arguments:** Camp B's position holds if *either* the Causal argument (no neural substrate for experience during sleep) *or* the Conceptual argument (the logic of "I dreamt" does not imply past experience) is successful. These arguments are not cumulative; they are alternative sufficient conditions for Camp B's conclusion.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the precise points of divergence. The "Verbal Dispute" column indicates which camp believes the specific row represents a misunderstanding of language rather than a fact of the world.

  | # | Disagreement Statement | Camp A Position | Camp B Position | Camp Claiming Dispute is Merely Verbal |
  | :--- | :--- | :--- | :--- | :--- |
  | **2.1** | **Temporal Location of Content:** The narrative content of a dream report is generated during the sleep state ($t_{sleep}$) vs. at the moment of waking/reporting ($t_{wake}$). | Content is generated primarily at $t_{sleep}$ and retrieved at $t_{wake}$. | Content is generated primarily at $t_{wake}$ based on fragmented cues or no prior content. | **Camp B** (argues "generated" is ambiguous between neural activation and narrative construction). |
  | **2.2** | **Necessity of Phenomenology:** For the sentence "I dreamt that $p$" to be true, a phenomenal experience of $p$ must have occurred during sleep. | **True.** The truth of the report depends on the past occurrence of the experience. | **False.** (Causal: Experience didn't happen. Conceptual: Truth depends only on the sincerity of the waking assertion.) | **Camp B** (Specifically the Conceptual/Malcolm line). |
  | **2.3** | **Nature of the Report:** A dream report is a *description* of a past mental event vs. a *performance* that constitutes the dream. | It is a description (memory-based). | It is a performance (construction-based). | **Camp B** (Argues the distinction presupposes the existence of the event being described). |
  | **2.4** | **Empirical Burden:** To prove dreaming occurs, one must demonstrate neural correlates of consciousness during sleep vs. demonstrating the coherence of the waking report. | Must demonstrate neural correlates of consciousness during sleep. | Must demonstrate the coherence and sincerity of the waking report. | **Camp A** (Argues Camp B is moving the goalposts of empirical evidence). |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  The following sub-questions identify evidence that would shift the credence of at least one camp. Predictions are registered prior to data review.

  ### Crux 1: Lucid Dreamer Signaling (Empirical/Causal)
  **Question:** Can a subject in REM sleep perform a pre-agreed complex motor signal (e.g., eye movements: Left-Right-Left-Right) to indicate they are currently experiencing a specific stimulus (e.g., "I am seeing a red flash")?
  **Evidence Source:** Polysomnography combined with pre-sleep instruction in verified lucid dreamers.

  *   **Camp A Prediction:** Subjects will successfully signal *during* REM sleep with high accuracy (>80% correspondence to external stimuli if applied). This proves conscious processing and decision-making occur at $t_{sleep}$.
  *   **Camp B (Causal/Dennett) Prediction:** Signals may occur due to automated motor routines triggered by sleep spindles, but will not correlate with specific phenomenal content (>50% accuracy, chance level for complex content). The "lucidity" is a micro-awakening, not a dream state.
  *   **Camp B (Conceptual/Malcolm) Prediction:** Irrelevant to the truth conditions of the report. Even if signaling occurs, it does not logically necessitate that the *narrative* reported upon full waking existed at $t_{sleep}$.

  ### Crux 2: Neural Decoding of Specific Content (Empirical/Causal)
  **Question:** Can machine learning models trained on waking fMRI data predict the specific object category (e.g., "face," "house," "text") a subject will report dreaming about, based *only* on sleep-state brain activity prior to waking?
  **Evidence Source:** fMRI sleep studies with immediate awakening protocols.

  *   **Camp A Prediction:** High correlation (>70%) between sleep-state activation patterns and subsequent report content. This indicates the content existed in neural form during sleep.
  *   **Camp B (Causal/Dennett) Prediction:** Low correlation (<40%). Activation patterns indicate general arousal or memory consolidation processes, not specific phenomenal content. The report is constructed from vague affective tones, not specific imagery.
  *   **Camp B (Conceptual/Malcolm) Prediction:** Even with 100% correlation, this only proves neural isomorphism, not that the subject *experienced* the content as a narrative during sleep.

  ### Crux 3: The "Deep Sleep" Report (Conceptual/Grammatical)
  **Question:** If a subject is awakened from NREM Stage 4 (deep, slow-wave sleep) and says "I was dreaming," is it logically coherent to ask "What were you experiencing *before* I woke you?"
  **Evidence Source:** Philosophical analysis of report conditions and awakening protocols from deep sleep.

  *   **Camp A Prediction:** Yes. The subject may have had a non-visual, thought-like experience that lacked the vividness of REM. The absence of a detailed report is due to memory failure, not absence of experience.
  *   **Camp B (Conceptual/Malcolm) Prediction:** No. The question commits a category mistake. If the subject was in deep sleep (no behavioral/verbal capacity), the assertion "I was dreaming" is a waking impression, not a reference to a past temporal duration. To ask what happened *during* the sleep is to misuse the grammar of "dreaming."
  *   **Camp B (Causal/Dennett) Prediction:** No. The neural substrate for any experience (thought-like or visual) is absent in Stage 4. The report is a confabulation triggered by the awakening stimulus.

  ## 4. RULING ON THE STATUS OF THE DISPUTE

  The collaboration concludes that the dispute regarding "whether dreams are experiences" is **partially verbal and partially empirical**, partitioned as follows:

  1.  **The Empirical Partition (Causal):** The disagreement regarding *neural processing* is substantive. Camp A and Camp B (Causal) disagree on whether the brain generates rich, narrative-grade phenomenal content during sleep or merely fragmented activations. This is resolvable via Crux 1 and Crux 2 (Lucid Signaling and Neural Decoding). If high-fidelity content can be decoded from sleep states prior to waking, Camp B (Causal) must concede that significant processing occurs at $t_{sleep}$.
  2.  **The Verbal Partition (Conceptual):** The disagreement regarding the *truth conditions* of dream reports is largely verbal. Camp B (Conceptual) correctly identifies that the ordinary language use of "I dreamt" does not logically entail the existence of a past temporal event in the same way "I saw" does. However, Camp A correctly identifies that scientific inquiry requires positing a past temporal event to explain the data.
  3.  **Final Adjudication:**
      *   The term "Experience" is ambiguous. If defined as **"Waking Reportability,"** Camp B wins (trivially).
      *   If defined as **"Temporally Located Phenomenal Processing,"** the dispute is empirical.
      *   **Consensus:** The collaboration adopts the definition in Claim 1.4 ("Temporally Located Phenomenal Processing") for scientific purposes, while acknowledging Camp B's (Conceptual) warning that ordinary language does not commit speakers to this ontology. Camp B (Causal) and Camp A will proceed to test the Empirical Partition. Camp B (Conceptual) reserves the right to maintain that the results of such tests do not alter the logical grammar of dream attribution.

  **Signatures:**

  _________________________
  Lead, Camp A (Experiential Realists)

  _________________________
  Lead, Camp B (Report Skeptics)
  *(Signature indicates agreement that Camp B's position stands if either Causal or Conceptual arguments hold, per Claim 1.6)*
