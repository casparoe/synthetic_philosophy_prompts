answer: |-
  This is a remarkably precise and fertile starting position. You have correctly identified that the "impossibility" of interpersonal comparisons was often a proxy for deeper normative and metaphysical disagreements. By stipulating away the measurement problem (the "Hedonimeter Premise"), you strip welfare economics of its positivist armor, exposing the normative skeleton beneath.

  Given your constraints (five years, one student, expertise in measurement/invariance, minimal economics training) and your criteria (upstreamness, tractability, potential for belief revision), here is a defended research agenda.

  ### The Ranked Agenda

  #### 1. The Normative Authority of the Indicator (The "Is-Ought" of Measurement)
  **The Question:** Granted that we *can* measure a neurophysiological quantity $U$ on a common ratio scale, does $U$ correspond to *well-being*? Does the physical invariance of the scale license the normative invariance of the value judgment?
  **The Problem:** This addresses your suspicion that Robbins's ban was about meaning. In psychophysics, we distinguish between the *proximal stimulus* (neural firing) and the *distal attribute* (perceived brightness). In welfare, we must distinguish between *experienced utility* (the neural signal) and *normative welfare* (what we ought to maximize). If the meter measures dopamine but well-being requires autonomy, the measurement is precise but normatively inert.
  **Defense of Ranking:**
  *   **Upstream:** This is the most foundational question. If $U$ is not the normative currency, the rest of the agenda is moot.
  *   **Tractability:** High. This is conceptual analysis and philosophy of science, not econometrics. It relies on your ability to distinguish between the *construct* and the *indicator*, a skill central to calibration.
  *   **Belief Abandonment:** High. It requires you to potentially abandon "Welfarism" (the view that well-being is the only intrinsic good) or "Hedonism" (that well-being is experienced utility).

  #### 2. The Individuation of the Utility-Bearer (The Boundary Problem)
  **The Question:** On what basis do we individuate the "persons" whose utilities are being summed? If utility is a continuous physical field, where does one person's utility end and another's begin?
  **The Problem:** Harsanyi's theorem and Utilitarian aggregation require discrete units ($i = 1 \dots n$). But if personal identity is reductionist (as Parfit argued), or if neuro-integration becomes possible (brain merging), the "counting" of persons becomes arbitrary. If we cannot define the boundaries of the utility-bearer, we cannot define the domain of the aggregation function.
  **Defense of Ranking:**
  *   **Upstream:** Second only to the definition of the good. You cannot aggregate what you cannot individuate.
  *   **Tractability:** Medium. It requires engaging with metaphysics and population ethics, but your student can manage the literature while you focus on the logical structure of the "unit."
  *   **Belief Abandonment:** High. It challenges "Methodological Individualism," the bedrock of standard economics. It may force you to accept that "person" is a conventional, not natural, kind.

  #### 3. The Invariance Class of the Social Welfare Function (The Moral Scale)
  **The Question:** Even if individual utility is measured on a ratio scale (fixed zero, fixed unit), what invariance properties does the *social* ranking admit?
  **The Problem:** This is your home turf. In measurement theory, the scale type licenses specific transformations. In ethics, the *moral theory* dictates the invariance. For example, Classical Utilitarianism is invariant to the ratio scale of $U$. But Prioritarianism (giving weight to the worse off) effectively transforms $U$ via a concave function before summing. The question is: Does the moral truth require the social ranking to be invariant to the same transformations as the physical scale? Or does the moral theory impose a *different* invariance structure on the data?
  **Defense of Ranking:**
  *   **Upstream:** Mid-level. It assumes we know what $U$ is and who holds it, but asks how to combine them.
  *   **Tractability:** Very High. This applies your specific expertise in invariance and scale types to a new domain. You can analyze Social Welfare Functions (SWFs) as measurement structures.
  *   **Belief Abandonment:** Medium. It refines your view on aggregation but doesn't necessarily overthrow the framework. It reveals that choosing an SWF is choosing a "moral scale type."

  #### 4. Non-Welfarist Side-Constraints (Rights as Invariance Violations)
  **The Question:** Are there moral constraints that forbid maximizing the aggregate $U$, even if $U$ is perfectly measured and comparable?
  **The Problem:** This addresses the "Rights Objection." If sacrificing one innocent person saves five from mild pain, the meter says "do it." Deontologists say "don't." This question asks whether rights function as *lexical constraints* or *infinite weights* within the measurement system, or whether they represent a category error in applying the scale at all.
  **Defense of Ranking:**
  *   **Upstream:** Downstream of aggregation, but critical for policy application.
  *   **Tractability:** Medium. Requires engaging with political philosophy (Nozick, Sen).
  *   **Belief Abandonment:** High. It challenges Consequentialism. If you accept side-constraints, the "solved measurement" premise loses much of its aggregative power.

  ---

  ### Deprioritized Questions (Settled or Verbal)

  1.  **The Possibility of Interpersonal Comparison:**
      *   *Status:* **Settled by Stipulation.**
      *   *Reason:* Your prompt explicitly removes this. Do not waste time defending the possibility of IUCs; assume them and explore the consequences.
  2.  **Ordinal vs. Cardinal Utility:**
      *   *Status:* **Settled by Stipulation.**
      *   *Reason:* The neuro-indicator provides a ratio scale. The "Ordinalist Revolution" of the 1930s is historically interesting but irrelevant to your project.
  3.  **Revealed Preference Theory:**
      *   *Status:* **Obsolete for this project.**
      *   *Reason:* This theory was developed to bypass the need for utility measurement. Since you have measurement, you do not need to infer preferences from choices. You can measure welfare directly.
  4.  **The "New" Welfare Economics (Pareto Criteria):**
      *   *Status:* **Merely Verbal/Weak.**
      *   *Reason:* Pareto improvements are a subset of Utilitarian improvements. Once you have cardinal comparability, Pareto is too weak to be a complete guide. Studying it would be like studying abacuses after inventing the computer.

  ---

  ### Conditions for Re-Ranking

  **Move Question 3 (Invariance) to #1 if:**
  You find, early in your reading, that the link between neurophysiology and "goodness" (Question 1) is accepted as axiomatic in the literature you survey (e.g., if you adopt a strict Hedonistic Utilitarian framework immediately). If the normative status of $U$ is taken as given, the *structural* analysis of how $U$ aggregates becomes the most rigorous contribution you can make.

  **Move Question 2 (Individuation) to #4 if:**
  You find the metaphysical literature too dense or unproductive for a 5-year timeline. If "personhood" proves to be a quagmire that yields no testable implications for your measurement framework, deprioritize it in favor of the more tractable Invariance analysis.

  **Move Question 4 (Rights) to #1 if:**
  Your own moral intuitions strongly rebel against the aggregation results. If you find yourself unwilling to accept the implications of Harsanyi's theorem even with perfect data, then the conflict between Measurement and Rights is your primary problem, not the measurement itself.

  ### A Note on the Doctoral Student
  Use the student to handle the **economic literature review**. Your value add is not in learning the history of the Pareto criterion, but in applying **measurement theory** to it. Have the student map the existing Social Welfare Functions (Utilitarian, Prioritarian, Sufficientarian) and translate them into **measurement formalisms**.
  *   *Task:* "Express the Prioritarian SWF as a transformation of the ratio scale. What invariance does this new scale admit?"
  *   *Task:* "Identify where the economic literature assumes 'person' as a primitive. Catalog the exceptions."

  ### Final Defense
  This agenda respects your intuition that Robbins was right about meaning. It treats the "Hedonimeter" not as a solution, but as a new instrument that requires its own calibration against normative standards. It leverages your specific expertise (invariance, scale types) where it is most potent (Question 3), while ensuring you do not build a castle on a normative swamp (Question 1). It is a program that admits the possibility that you might retire concluding that *even with perfect measurement, welfare economics cannot tell us what to do*—which is, I suspect, the conclusion you are already leaning toward.
