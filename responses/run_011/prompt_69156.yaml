answer: |-
  # The Second Layer

  The monitor has two traces. The bottom line is the nerve feed: raw voltage from the spine, the thalamus, the skin. The top line is the implant: the report. In a healthy brain, they move together. A spike in the nerve feed triggers a spike in the report. You burn your hand, the nerves fire, and you know you're burning.

  In Unit 4, we decouple them. The implant doesn't touch the nerves. It only writes the top line. It tells the patient they are in a state. It doesn't matter if the state exists. That's the trial. Transitivity.

  Mrs. Gable is in Bay 3. She's holding a ceramic mug. It's empty. She's been in Generative Mode for an hour, which means the implant is painting the top line without any input from the bottom.

  "It's heavy," she says. Her voice is thin, papery. "Not the weight. The heaviness. It's like… like the clay is tired of holding its shape."

  I look at the screen. The bottom line is flat. There is no sensory data coming from her hand. The top line is oscillating wildly. The implant is successfully generating a higher-order representation of holding something, even though nothing is being held.

  "It's a mug, Eleanor," I say. I keep my voice neutral. We aren't supposed to lead the witness.

  "It's cold where I am," she says. She isn't talking about her hand. She's tapping the side of the mug. "Inside the wall. It's quiet and white."

  Dr. Aris leans over my shoulder. "Targeting error," he mutters. "The higher-order state isn't latching onto her proprioception. It's latching onto the object."

  This is the fault we feared. The implant is supposed to make her aware of her own state. Instead, it's projecting awareness *onto* the mug. She isn't saying she feels the mug; she's saying she feels *as* the mug.

  "Reset the calibration," Aris says. "If the state isn't about her, it's noise. A thought about a rock doesn't make the rock feel. It doesn't make her feel the rock's feelings, either. There's nothing there to feel."

  "It feels real to her," I say.

  "It's a misfire. The loop has to close on the subject. If it points outward, it's just description. Poetry. Not experience."

  He's right, technically. If the light shines on the wall, the wall doesn't light up. But Eleanor is shivering. She puts the mug down carefully, like she's putting a child to bed.

  "Okay," I say. "Recalibrating."

  I adjust the gain. The top line stabilizes. It stops hunting for external targets and locks back onto her internal telemetry. Or what would be her internal telemetry, if the bottom line weren't still flat.

  Then the alarm trips.

  Eleanor grips her chest. Her face collapses. The top line spikes red, maxing out the scale. The bottom line remains dead flat. No nerve fire. No tissue damage. No cardiac event.

  "It burns," she whispers. "Like swallowing a handful of blue glass. It's stuck in the throat of the dark."

  "Generative pain," Aris says. He looks at his watch. "Implant created the thought of pain without the cause. Twenty minutes to decide on morphine. Protocol 7."

  "If we treat it, we validate the signal," I say. "We admit the top line is enough."

  "If we don't, and she's suffering, we're torturing her based on a wiring diagram."

  "But there's no wiring," I say. I point to the flat bottom line. "There's no pain there. Just the report of pain."

  "The report *is* the pain," Aris says. "That's the theory. You don't feel pain because your nerves fire. You feel it because you know you're firing. She knows. Look at her."

  Eleanor is curling into herself. She isn't acting. There's no audience here.

  "Give her the dose," I say.

  "Wait," Aris says. "Hold."

  He's staring at the tablet. "Corp just pushed Firmware 2.0. Dispositional update."

  I read the changelog. *Optimization: Higher-order states no longer generated occurrently. States made available dispositionally. Reduced power consumption. Reduced cognitive load.*

  "They're turning off the light," I say. "It won't produce the thought anymore. It'll just be ready to produce it if asked."

  "Efficiency," Aris says. "Same capacity. Just latent."

  Sarah, the shift nurse, comes in. She sees Eleanor writhing. She sees the update prompt on my screen.

  "Don't install it," Sarah says.

  "It's mandatory," Aris says.

  "If you install that, you kill them," Sarah says. She doesn't look at the monitors. She looks at Eleanor. "I worked the night shift before the trial. They slept. They woke up. They were here. This update… it makes them like deep sleep forever. Unless something triggers it."

  "They're still capable of awareness," Aris says. "The disposition is there. A sleeping person is still a person."

  "A sleeping person wakes up," Sarah says. "This says the state only activates if the system queries it. Who queries? The implant? The patient? If the light only turns on when you look at it, is the room lit?"

  "It's a software optimization," Aris says. "It doesn't change the ontology."

  "It changes the lights," Sarah says.

  Eleanor groans. The red spike on the top line is steady. She is in agony, according to the report. According to the nerves, she is asleep.

  "If we update," I say, "the pain state might not generate. It'll just sit in the library. Unread."

  "Then she won't suffer," Aris says.

  "Or she'll suffer and won't know it," Sarah says. "Or she'll know it differently. You're changing the rules of the game while the ball is in play."

  "We have to treat the pain first," I say. "The update can wait."

  "Protocol says update immediately," Aris says. "The trial depends on the new architecture."

  "Protocol says treat pain within twenty minutes," I counter. "We're at eighteen."

  I look at Eleanor. She's stopped moving. She's staring at the ceiling. The top line is still red, but her face is empty.

  "It passed," she says. "The blue glass. It melted."

  The top line drops. Not gradually. Instantly. Like a switch was flipped.

  "Did you do something?" Aris asks me.

  "No."

  "Spontaneous remission of the generative state," Aris says. He taps the install button. "See? Stable. We can update."

  "Wait," I say.

  The progress bar fills. *Dispositional Mode Active.*

  The top line goes grey. It's not flat, but it's dormant. It's waiting.

  "Is she still in there?" Sarah asks. Her voice is low.

  "She's responsive," Aris says. He waves a hand in front of Eleanor. She blinks. "See?"

  "She blinked," I say. "But did she see you?"

  "What's the difference?"

  "If the light is off, does it matter if the bulb works?" Sarah says.

  I look at the monitor. The bottom line is still flat. The top line is grey, potential energy. We have successfully separated the experience from the state of having the experience. We have made the awareness optional.

  Eleanor turns her head. She looks at the mug on the tray. The empty ceramic mug.

  "It's waiting," she says.

  "What is?" I ask.

  "The feeling of the mug," she says. "It's in the drawer. Ready."

  She closes her eyes.

  I have the morphine in my hand. The protocol says administer if the top line spikes. The top line is grey. It won't spike unless something queries it. If I give her the morphine, I'm treating a possibility. If I don't, and the query happens internally, she burns.

  Aris is watching me. Sarah is watching me. The monitor is watching nothing.

  I look at the switch for the implant. Manual override. It cuts the power. It stops the reports. It stops the dispositions. It leaves her with just the bottom line. Just the nerves.

  If I cut it, she can't report pain. She can't report anything. She'll be pure first-order state. A rock with a heartbeat.

  If I leave it, she lives in the report. In the second layer.

  Eleanor opens her eyes. She looks at me. There is no question in them. There is no report. There is just the look.

  I put the morphine down.

  I reach for the switch.

  "Wait," Aris says.

  I hold my hand over the plastic. The grey line on the screen pulses once, faintly. A disposition checking itself.

  I don't flip it. I can't prove the light is on. I can't prove it's off. I just know that when I look at her, she looks back.

  "Log it," I say. "Subject stable."

  "Stable?" Aris asks.

  "Present," I say.

  I leave the switch alone. The screen stays grey. The bottom line stays flat. Eleanor breathes. In the silence between the nerve and the thought, she waits to see if she exists.
