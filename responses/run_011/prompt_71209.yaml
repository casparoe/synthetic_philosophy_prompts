          *   Core: Only the winner matters. Efficiency is key.
          *   Changes: P1 might go (verify compliance). P2 stays (need turnout for legitimacy). P3 intensifies (ranked choice to avoid waste). P4 stays (buy outcomes). P5 stays (force participation to maximize data).
      *   *Theory C: Vote as Civic Performance (Ritual).*
          *   Core: The act is the point. Community bonding.
          *   Changes: P1 might go (public voting as declaration). P2 stays (honor). P3 goes (no waste, all participation counts). P4 changes (money corrupts the ritual). P5 stays (compulsion is good).

