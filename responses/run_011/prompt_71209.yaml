          *   *Critique:* This theory actually struggles to justify P2 (shame) if the individual vote is null. It relies on the *system* being instrumental, not the *act*.

      *   **Theory 3: Vote as Performance (Ritual/Civic Duty).**
          *   P1 (Secrecy): **Goes.** Performance usually implies an audience. Public voting makes more sense.
          *   P2 (Duty): **Stays/Intensifies.** The performance *is* the duty.
          *   P3 (Waste): **Goes.** A vote for a loser is still a valid performance of preference.
          *   P4 (Money): **Goes/Changes.** Money corrupts the purity of the ritual. Should be banned or strictly equalized.
