          *   P5 (Compulsion): **Goes.** Can't force use of property.

      *   **Theory 2: Vote as Purely Instrumental (The "Math" View).**
          *   *Correction:* The prompt says "purely instrumental and no single vote makes a measurable difference." This is the "Paradox of Voting" view.
