      *   **Task:** Analyze a specific cluster of 5 voting practices (secrecy, social pressure/turnout, strategic voting criticism, money transparency, compulsory attendance/blank ballots).
      *   **Goal:** Identify the underlying *theory of the vote* that makes these practices cohere. Distinguish between what the rules *presuppose* vs. what merely *fits*. Identify excluded rival conceptions. Explore what would change under alternative theories (Vote as Property, Vote as Instrument, Vote as Performance). Finally, draft hypothetical student council handbooks based on these alternative theories.
      *   **Tone:** Respectful, intellectual, rigorous, acknowledging the user's sophistication without being condescending. Avoid preaching reform; focus on analysis.

  2.  **Deconstruct the 5 Practices:**
      *   *P1 (Secrecy/Non-transferability):* Vote is secret, cannot be proven, cannot be sold.
      *   *P2 (Civic Duty/Social Pressure):* Voting is honorable, abstention is disgraceful, "no right to complain" if you don't vote.
      *   *P3 (Instrumentalism/Strategic Voting):* Voting for a loser is "wasted." Vote counts only toward the outcome.
      *   *P4 (Money Transparency):* Money influence must be public, unlike votes.
      *   *P5 (Compulsory Attendance/Empty Ballot):* Australia model. Must show up, content doesn't matter legally.

  3.  **Identify the Coherent Theory (The "Inherited" View):**
      *   What ties these together? It's a hybrid view.
      *   *Secrecy (P1)* suggests the vote is a private judgment, protected from coercion/corruption. It's not a commodity.
      *   *Social Pressure (P2)* suggests the vote is a public duty. It belongs to the community as much as the individual.
      *   *Strategic Voting (P3)* suggests the vote is an instrument of power aggregation.
      *   *Money Transparency (P4)* suggests influence is okay, but *accountability* for influence is required. Votes are equal/anonymous; money is unequal/identified.
      *   *Compulsory Attendance (P5)* suggests the *act* is the duty, not the *choice*.
      *   *Synthesis:* The "Liberal-Democratic Stewardship" model. The vote is a **public trust exercised through private judgment.**
      *   *Tension:* P1 (Private) vs. P2/P3 (Public/Instrumental).
      *   *Resolution:* The *decision* is private (to ensure independence), but the *participation* is public (to ensure legitimacy). The *effect* is aggregated (instrumental), but the *source* is anonymized (to prevent factionalism/bribery). Money is different because it's *power*, not *judgment*.

  4.  **Analyze Presuppositions vs. Underdetermination:**
      *   *Presupposed:* The vote is not property (P1). The vote has collective weight (P3). Legitimacy requires participation (P2). Influence requires accountability (P4).
