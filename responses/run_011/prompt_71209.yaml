      The prompt asks specifically about:
      1.  Vote as Voter's Property.
      2.  Vote as Purely Instrumental (no single vote makes a difference).
      3.  Vote as Performance of Participation.

      *Let's map the 5 practices to these three specific theories.*

      *   **Theory 1: Vote as Property.**
          *   P1 (Secrecy): **Goes.** If it's mine, I can show it/sell it.
