      *   *Vote as Mandate:* Excluded by P1 (secrecy means we don't know *who* mandated what).
      *   *Radical Egalitarianism:* Excluded by P4 (money influence is allowed, just tracked).

  6.  **Develop Alternative Theories & Handbook Revisions:**
      *   *Theory A: Vote as Private Property.*
