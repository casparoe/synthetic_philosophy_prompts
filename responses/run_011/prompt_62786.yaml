  You are right to suspect (4) and (5), but that conflict is merely a symptom of a deeper structural failure. Your intuition identified the visible crack, but the load-bearing wall that has collapsed is Principle (2).

  Here are the three genuine conflicts, ordered by severity.

  ### 1. The Old Evidence Trilemma (Principles 2, 3, 4)
  **Severity: Critical (Logical Contradiction)**

  This is not a tension; it is a mathematical impossibility within standard probability theory.
  *   **The Conflict:** If you are logically omniscient (2), you know all entailments instantly. If $H$ entails $E$, then $P(E|H) = 1$. If $E$ is old evidence (3), then $P(E) = 1$. By the definition of conditional probability, if $P(E) = 1$, then $P(H|E) = P(H)$. Therefore, by your static definition of confirmation (4), $E$ cannot confirm $H$.
  *   **The Consequence:** You cannot hold (2), (3), and (4) simultaneously. One must be false. You have explicitly rejected the standard solution (Garber-style logical learning) in (2), which leaves you with no way to make $P(H)$ move when $E$ is already certain.
  *   **What to Give Up:** You must relax **(2)**.
  *   **The Cost:** You lose the purity of "Probability as Normative Logic for Ideal Agents." You admit that your system is *not* an ideal agent, but a bounded one that discovers logical relations over time.
  *   **Why this is the root:** Principles (4) and (5) only conflict because (2) forces the probability function to be static regarding logical relations. If you allow logical learning, the probability function moves, and the conflict dissolves.

  ### 2. The Synchronic/Diachronic Mismatch (Principles 4, 5)
  **Severity: High (Category Error)**

  Your suspicion was correct here, though it is downstream of the first problem.
  *   **The Conflict:** Principle (4) defines confirmation as a static, synchronic relation ($P(H|E) > P(H)$). Principle (5) demands a diachronic distinction (prediction vs. accommodation depends on the *order* of discovery). A timeless relation cannot distinguish between "H found before E" and "H found after E" if the final probability function is identical.
  *   **The Consequence:** If you keep (4), you cannot mathematically distinguish a risky prediction from a retrofit accommodation. Both result in the same $P(H|E)$.
  *   **What to Give Up:** You must reinterpret **(4)**.
  *   **The Cost:** Confirmation is no longer a simple property of the current belief state. It becomes a historical property of the *path* taken to reach that state.
  *   **Note:** Fixing (2) largely fixes this too. If confirmation is tied to the *update event* (the moment the link was learned), the timing is inherent to the metric.

  ### 3. The Update Mechanism Void (Principles 1, 6, 3)
  **Severity: High (Functional Failure)**

  Even if you solve the definition of confirmation, you have no engine to drive the car.
  *   **The Conflict:** Principle (3) says credence in GR *did* rise. Principle (1) says only conditionalization on evidence updates credence. Principle (6) says reflection (thinking about relations) doesn't update credence.
  *   **The Consequence:** When Einstein realized GR entailed Mercury's perihelion, he did not receive new sensory evidence (Mercury was known). He performed a derivation (reflection). Under (1) and (6), this cannot rationally change his credence. Under your system, the "Aha!" moment is classified as "drift."
  *   **What to Give Up:** You must relax **(6)** (and implicitly **(1)**).
  *   **The Cost:** You admit that "logical evidence" (seeing that $H \models E$) is a valid input for conditionalization. This effectively requires giving up (2) anyway, as it implies you didn't know the relation beforehand.
  *   **Why it matters:** A design doc needs an update rule. Currently, your update rule forbids the exact learning process your system is built to perform (hypothesis testing).

  ---

  ### The Single Best Revision

  **Relax Principle (2): Logical Omniscience.**

  You should reframe (2) from a hard constraint to a **normative ideal**. State that while probability theory is the *goal*, the system operates under **bounded logical rationality**.

  **Why this buys the most consistency:**
  1.  **Solves Old Evidence (3):** If the system is not omniscient, it can treat "H entails E" as a new piece of evidence (the Garber solution you feared). $P(H \to E)$ can rise from $<1$ to $1$, driving $P(H)$ up even if $P(E)=1$.
  2.  **Solves Prediction Asymmetry (5):** Novel predictions involve updating on $E$ when $P(E)$ was low. Accommodation involves updating on the *entailment* when $P(E)$ was high. These become distinct update paths with different magnitudes.
  3.  **Solves Update Void (1 & 6):** It legitimizes "logical learning" as a valid update event, giving your system a mechanism to change beliefs during hypothesis testing.
  4.  **Preserves (7):** Your distinction between "truth of theorem" and "performance reliability" remains valid; it simply becomes the operational definition of your logical uncertainty.

  **The Cost:**
  You lose the claim that your system is a direct implementation of "ideal Bayesian logic." You gain a system that can actually function. In a design doc, functionality must trump philosophical purity; a system that cannot update on its own derivations is dead on arrival.

  **Implementation Note:**
  Replace (2) with: *"Probability theory is the normative target. The system approximates this via bounded rationality, treating logical derivations as fallible empirical discoveries subject to conditionalization."* This keeps the spirit of (2) without the paralysis.
