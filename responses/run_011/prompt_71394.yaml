answer: |-
  Here is the instrument. It is designed to be handed out at the start of the session. It requires no prior reading, only that your group members accept the two starting commitments: that the simulation possibility is real enough to consider, and that the far future could hold vastly more well-being than the past.

  I have cut the tree along the three distinctions you requested: **Length** (does the sim end the future?), **Worth** (do sim minds count?), and **Lever** (can we affect the outcome?). The instrument is structured as a twelve-question sorting quiz. While a quiz is linear, the scoring key at the end maps the answers onto a decision tree of philosophical positions.

  ***

  # The Simulation/Long-Run Sorter

  **Instructions:** Answer all twelve questions. Do not overthink; pick the option that feels most like what you would actually do or believe. There are no right answers, only consistent ones.

  ### Part I: The Ceiling (Length of the Future)
  *This section tests whether the simulation possibility destroys the "long run" by capping how long we last.*

  **1. Case A, the Caretaker:** You learn for certain that whoever runs our simulation deletes a sim once its inhabitants reach a particular technological level, and otherwise lets it run for aeons. One friend says the astronomical future was therefore never on the table and we should stop agitating about it; another says we now have a lever on how long we get, so we had better be extremely careful which technologies we push. Which of them has it right — or are both right, or is this news not the sort of thing that could settle either?
     *   (A) Friend 1 is right: The long run is dead.
     *   (B) Friend 2 is right: We must manage our tech to survive.
     *   (C) Neither: This news doesn't change the calculation.

  **2. If you chose Friend 2 (Manage Tech):** Do we try to hide our progress from the simulators, or do we assume they are watching anyway and try to signal worthiness?
     *   (A) Hide: Go dark, slow down development.
     *   (B) Signal: Make the simulation "interesting" so they keep it.
     *   (C) Ignore: We can't outsmart the runner.

  **3. If you chose Friend 1 (Long Run Dead):** Since the future is capped, should we pivot to making the present as dense with meaning as possible, or simply relax into enjoyment?
     *   (A) Density: Art, philosophy, intense experience now.
     *   (B) Relax: It's a video game; play for fun.
     *   (C) Resist: Fight the shutdown even if we lose.
     *(Note: This is a weak question. It forces a false choice between art and fun, when many would do both. Keep it to force a stance on "density" vs "relaxation".)*

  **4. Synthesis on Length:** If there is even a 1% chance the simulation does *not* delete us, do we plan for the long run anyway?
     *   (A) Yes: The upside is too big to ignore.
     *   (B) No: Don't bet on the 1%.
     *   (C) Maybe: Depends on the cost of betting.

  ### Part II: The Weight (Worth of the Minds)
  *This section tests whether simulated people count as much as "base reality" people.*

  **5. Case B, the Trade:** A stranger offers to make the next three centuries for our own descendants about ten percent worse, in exchange for a trillion lives inside some simulation we will never see, never influence, and that has no causal connection to us whatsoever going from miserable to wonderful forever. Do you take the deal?
     *   (A) Take it: A trillion lives outweigh our 10% loss.
     *   (B) Reject it: Their lives aren't real enough.
     *   (C) Reject it: We can't verify the claim.

  **6. If you Rejected (Not Real):** Is the problem that they are made of code, or that they are causally disconnected from us?
     *   (A) Code: Simulated pain isn't real pain.
     *   (B) Disconnected: We can't help them, so why try?
     *   (C) Both: It's suspicious on all fronts.

  **7. If you Took the Deal:** If you had to choose between saving your own biological children or saving the trillion simulated lives, which do you choose?
     *   (A) The Trillion: Numbers matter most.
     *   (B) My Children: Proximity and biology matter.
     *   (C) Flip a coin: I can't make that choice.

  **8. Synthesis on Worth:** If we are in a simulation, are our own grandchildren worth less than grandchildren in base reality?
     *   (A) Yes: We are second-class citizens.
     *   (B) No: Suffering is suffering, regardless of substrate.
     *   (C) Unknown: We can't know the substrate.

  ### Part III: The Lever (Probability and Cause)
  *This section tests how we weigh low-probability high-value outcomes.*

  **9. Case C, the Long Shot:** An oracle you trust completely tells you the odds are a million to one that we're in a simulation which gets switched off within a century, and a million to one the other way that we're in base reality with an astronomically long future ahead of us. One of my group says that settles it, since a million-to-one shot at a googol good lives beats everything else on offer; another says the oracle has just told us to stop caring about the long run. Which one is making a mistake, and where exactly?
     *   (A) Member 1 is right: Bet on the googol lives.
     *   (B) Member 2 is right: Don't bet on million-to-one shots.
     *   (C) Both are wrong: The odds are too close to call.

  **10. If you Chose Member 1 (Bet on Googol):** Do we ignore the 99.9998% probability that the future is short or mediocre?
     *   (A) Yes: Expected value dominates.
     *   (B) No: We hedge our bets.
     *   (C) We focus on the probability, not the value.

  **11. If you Chose Member 2 (Stop Caring):** Do we ignore the possibility that the oracle is the only signal we have about the long run?
     *   (A) Yes: Practicality over theory.
     *   (B) No: We keep a small reserve for the long shot.
     *   (C) We focus on the short term.

  **12. Tuesday Morning:** You have $1,000 of discretionary funding. Do you give it to a charity working on space colonization (expanding base reality), a charity working on compute efficiency (supporting the potential sim host), or a local arts group (enriching the present)?
     *   (A) Space Colonization.
     *   (B) Compute Efficiency.
     *   (C) Local Arts.

  ***

  # Scoring Key & Decision Tree

  Tally your answers. The path you took determines your leaf on the tree.

  **The Primary Cut:**
  *   **Mostly A in Part I:** You believe the Sim limits the **Length**.
  *   **Mostly A/B in Part II:** You believe the Sim changes the **Worth**.
  *   **Mostly A in Part III:** You believe the Sim changes the **Lever** (via probability).

  **The Leaves (Positions):**

  **1. The Nihilist Gamer**
  *   **Path:** Part I (A/B), Part II (B), Part III (B).
  *   **Uncomfortable Commitment:** If this is a game, morality is just a mechanic, not a command.
  *   **Tuesday Action:** Spend the $1,000 on Local Arts (C); enjoy the render while it lasts.

  **2. The Realist Humanist**
  *   **Path:** Part I (C), Part II (B), Part III (C).
  *   **Uncomfortable Commitment:** It doesn't matter if we are real or fake; suffering hurts the same.
  *   **Tuesday Action:** Spend the $1,000 on Space Colonization (A); treat the sim as if it were base reality.

  **3. The Substrate Maximizers** *(The "More Ambitious" Leaf)*
  *   **Path:** Part I (B), Part II (A), Part III (A).
  *   **Uncomfortable Commitment:** The computer running us is more valuable than we are; we should serve the host.
  *   **Tuesday Action:** Spend the $1,000 on Compute Efficiency (B); ensure the simulator doesn't turn us off.

  **4. The Cage Managers**
  *   **Path:** Part I (B), Part II (B), Part III (B).
  *   **Uncomfortable Commitment:** We are prisoners trying to delay the executioner.
  *   **Tuesday Action:** Spend the $1,000 on Space Colonization (A), but specifically on tech that hides us from the simulators.

  **5. The Probability Gambler**
  *   **Path:** Part I (C), Part II (A), Part III (A).
  *   **Uncomfortable Commitment:** You must sacrifice the certain present for the improbable infinite future.
  *   **Tuesday Action:** Spend the $1,000 on Space Colonization (A), but only projects with astronomical upside, ignoring near-term gains.

  **6. The Localist**
  *   **Path:** Part I (A), Part II (B), Part III (B).
  *   **Uncomfortable Commitment:** The long run is a distraction from the only thing we can verify: now.
  *   **Tuesday Action:** Spend the $1,000 on Local Arts (C); ignore the far future entirely.

  ***

  # Diagnostics: Empty Branches and Indistinguishable Leaves

  **1. Indistinguishable Leaves:**
  *   **The Realist Humanist (2) vs. The Localist (6).**
      *   *Why:* On an ordinary Tuesday, both might fund Space Colonization or Local Arts depending on market rates. The Realist does it for the future; the Localist does it for the present economy.
      *   *Further Question Needed:* "If you knew for certain the world ends in 50 years, would you still fund space travel?" The Realist says No; the Localist says "It doesn't matter, I'm funding for now."

  **2. Empty Branches (Logically Available but Unoccupied):**
  *   **The Ambitious Nihilist.** (Path: Part I "Game", Part III "Work Harder").
      *   *Diagnosis:* **Incoherent.** If the sim is a game with no external value, "ambition" for the long run has no object. You can't maximize score if the console gets unplugged.
  *   **The Self-Sacrificing Localist.** (Path: Part I "Short", Part II "Sims Count", Part III "Ignore").
      *   *Diagnosis:* **Unattractive.** Believing sims count but refusing to bet on them even when the cost is low suggests a disconnect between value and action that few can sustain.
  *   **The Host-Skeptic.** (Path: Part I "Manage Tech", Part II "Sims Don't Count", Part III "Serve Host").
      *   *Diagnosis:* **Unexplored.** Why serve the host if the minds inside don't count? This position exists only if you value the *Simulator's* enjoyment over the *Simulated* welfare. Two of your group members may be standing here without realizing it.

  ***

  # The Single Sorting Question

  If you only ask one question to split the room, ask **Question 5 (Case B, the Trade)**.

  *   **Why:** It forces a choice between **Scope** (a trillion lives) and **Substrate** (our biological descendants).
  *   **The Split:**
      *   Those who **Take the Deal** believe value is substrate-independent. They will likely end up at *Substrate Maximizers* or *Probability Gamblers*. They are the ones who will be *more* ambitious about the long run because they see value in places others don't.
      *   Those who **Reject the Deal** believe value is tied to causal connection or biology. They will likely end up at *Realist Humanists* or *Localists*. They will treat the simulation possibility as a footnote, not a lever.
  *   **Why it matters:** This is the only question that separates "Sim = More Minds" from "Sim = Fake Minds." Every other question can be answered by hedging; this one requires a wallet.
