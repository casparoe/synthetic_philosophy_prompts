answer: |-
  ### Desiderata for an Account of Moral Conflict
  **Case Reference:** *The Nurse Case.* (A nurse holds two symmetrical promises: secrecy to a patient, disclosure to his son. Both die instantly; the son departs. Obligations are identical in weight; neither can be discharged; no recipient remains for redress.)

  To be considered adequate, a normative theory addressing moral conflict must satisfy the following five specifications. They are divided into **Non-Negotiable** constraints (conditions of adequacy for any plausible theory) and **Camp Commitments** (principles that define specific schools of thought).

  #### 1. The Symmetry Constraint
  *   **Specification:** The account must explain why the conflicting obligations appear to possess identical normative force without resorting to arbitrary prioritization. It must accommodate the intuition that neither promise inherently trumps the other *ex ante*.
  *   **Motivation:** In the Nurse Case, the obligations are identical in kind (promises) and weight. A theory that automatically prioritizes privacy over family notification (or vice versa) fails to capture the specific texture of this conflict, treating it as a routine calculation rather than a clash of equals.
  *   **Status:** **[Non-Negotiable]**. Even a theory that ultimately dissolves the conflict must explain the *appearance* of symmetry; otherwise, it misdescribes the phenomenology of the agent's deliberation.

  #### 2. The Persistence Requirement
  *   **Specification:** The account must explain the normative status of the unchosen obligation after the moment of choice. It must specify whether the unfulfilled obligation vanishes upon the performance of the chosen act or retains a "normative trace."
  *   **Motivation:** If the nurse chooses silence, the obligation to the son does not intuitively evaporate; it generates guilt or regret. An account that claims the unchosen obligation is retroactively annulled fails to explain the agent's lingering sense of violation.
  *   **Status:** **[Non-Negotiable]**. Any viable theory must account for the temporal dimension of obligation, whether by validating the persistence (dilemma affirmers) or explaining it away as irrational residue (dilemma deniers).

  #### 3. The Recipient-Independent Residue Condition
  *   **Specification:** The account must determine whether moral residue (e.g., the duty to apologize or make amends) can exist when the creditor is unavailable to receive it.
  *   **Motivation:** The son has left the country; the patient is dead. There is no one to whom an apology can be delivered. If moral residue is essentially relational, the nurse owes nothing. If residue is agent-relative, she remains burdened. The theory must take a stance on whether obligations survive the extinction of their recipients.
  *   **Status:** **[Camp Commitment]**. This is a commitment of **Dilemma Affirmers** (who often argue for agent-relative residue) and **Relational/Contractualists** (who deny obligations can exist without a counterparty).

  #### 4. The Deontic Consistency Principle
  *   **Specification:** The account must either uphold the consistency principles of Standard Deontic Logic (SDL)—specifically Aggregation ($O(A) \land O(B) \to O(A \land B)$) and Kant's Law ($O(A) \to \diamond A$)—or provide a justified revision of the logical framework.
  *   **Motivation:** In the Nurse Case, $O(\text{Tell})$ and $O(\text{Silent})$ are both true, but $\diamond (\text{Tell} \land \text{Silent})$ is false. SDL renders this set contradictory. The theory must resolve this formal tension without ad hoc maneuvering.
  *   **Status:** **[Camp Commitment]**. This divides **Conservativists** (who preserve SDL and deny genuine dilemmas) from **Revisionists** (who modify logic to accommodate genuine dilemmas).

  #### 5. The Ontic/Epistemic Distinction
  *   **Specification:** The account must specify whether the conflict is genuine relative to the facts (ontic) or only relative to the agent's evidence (epistemic).
  *   **Motivation:** If the nurse did not know the men would die instantly, the conflict might be merely epistemic (she *could* have done both if the world were different). If the conflict holds even given the facts of their immediate death, it is ontic. The theory must locate the source of the impossibility.
  *   **Status:** **[Camp Commitment]**. **Dilemma Deniers** typically argue all genuine conflicts are epistemic (one obligation was never real). **Dilemma Affirmers** argue for ontic conflicts (both obligations were real despite impossibility).

  ***

  ### Analysis of Constraints

  **The Most Exclusionary Requirement**
  The single requirement that excludes the most views is **Desideratum 4 (The Deontic Consistency Principle)**, specifically the mandate to **uphold Standard Deontic Logic without revision**.
  While it is often framed as a neutral baseline, insisting on SDL's Aggregation Principle and Kant's Law effectively legislates against the possibility of genuine moral dilemmas. This requirement excludes all **Revisionist** and **Dilemma Affirming** camps (including certain existentialist, particularist, and tragic-realist positions). Because the majority of contemporary normative systems (Utilitarianism, Kantianism, Rule-Deontology) are built to preserve logical consistency, this desideratum functions as a gatekeeper that forces any theory admitting genuine dilemmas to undertake the heavy burden of logical reconstruction.

  **Joint Unsatisfiability**
  A subset of these desiderata is **jointly unsatisfiable**. Specifically, the following triad forms an inconsistent set:
  1.  **Uphold Standard Deontic Logic** (Desideratum 4, Conservativist commitment).
  2.  **Affirm Ontic Dilemmas** (Desideratum 5, Affirmer commitment).
  3.  **Maintain 'Ought Implies Can'** (Implicit in SDL/Kant's Law).

  In the Nurse Case, if the dilemma is ontic, both $O(A)$ and $O(B)$ are true. If SDL holds, $O(A \land B)$ is true. If 'Ought Implies Can' holds, $\diamond (A \land B)$ must be true. But the case stipulates $\neg \diamond (A \land B)$. Therefore, no account can simultaneously satisfy the commitment to SDL, the commitment to Ontic Reality, and the Principle of Possibility. A viable theory must reject at least one.

  ***

  ### Brief Scorecard of Contenders

  *   **Act-Utilitarianism:** Fails **Symmetry**. It dissolves the conflict by calculating net utility, rendering one obligation strictly heavier. It satisfies **SDL** but denies the **Persistence** of the unchosen act's obligation (it becomes moot).
  *   **Kantian Deontology:** Struggles with **Symmetry**. It typically resolves conflicts by categorizing one duty as perfect and the other imperfect, or by denying the validity of conflicting maxims. It upholds **SDL** but often denies **Ontic** conflict.
  *   **Rossian Pluralism:** Accommodates **Symmetry** (prima facie duties) and **Persistence** (residue/guilt). However, it typically denies **Ontic** dilemmas at the final duty level (one actual duty always prevails), preserving **SDL** at the cost of the dilemma's genuineness.
  *   **Dilemma Affirmation (e.g., Williams, Marcus):** Satisfies **Symmetry**, **Persistence**, and **Ontic** reality. However, it fails **Deontic Consistency**, requiring a revision of SDL to avoid contradiction.
  *   **Moral Error Theory:** Satisfies **Deontic Consistency** (no obligations exist, so no conflict) but fails all phenomenological desiderata (**Symmetry**, **Persistence**, **Residue**) by treating them as systematic illusions.
