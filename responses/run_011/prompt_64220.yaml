  1. **Bottom line**
  The Hilbert's Hotel analogy cannot carry the metaphysical weight your talk assigns it. It conflates mathematical coherence with metaphysical possibility and smuggles in contentious assumptions about time. Your instructor is correct that the hotel is mathematically consistent; your friend is correct that it presupposes a static history. Using it as a centrepiece risks alienating informed audience members and resting your case on a disputed philosophy of time. Do not cut it entirely if pedagogically useful, but demote it from proof to illustration. Explicitly acknowledge its limitations regarding the ontology of the past. It is too fragile for the load you intend.

  2. **The job it is being asked to do**
  The Kalam Cosmological Argument proceeds: (1) Whatever begins to exist has a cause; (2) The universe began to exist; (3) Therefore, the universe has a cause. Hilbert's Hotel supports premise two. Its specific inferential job is to demonstrate that an actual infinite cannot exist in reality. The argument assumes that if the past were beginningless, the collection of past events would constitute an actual infinite. By showing that an actual infinite leads to absurdities, like accommodating new guests in a full hotel, the analogy aims to prove that such a collection cannot exist concretely. It distinguishes between a potential infinite, which grows indefinitely, and an actual infinite, which is a completed totality. The hotel targets the latter. It is not primarily arguing against completing an infinite by successive addition—that is a separate argument—but rather against the existence of the infinite collection itself. It is the wrong instrument if the goal is to show the process of traversal is impossible; it is designed to show the state of being infinite is impossible. Thus, it must establish that the past is a completed set.

  3. **Correspondences**
  | Hotel Feature | Past Counterpart & Correspondence Status |
  | :--- | :--- |
  | Rooms | Moments of time (Holds loosely) |
  | Guests | Past events (Holds loosely) |
  | Fullness | No first event (Holds) |
  | New Guest | Present moment (Holds) |
  | Reshuffling | Reordering history (Fails) |
  | No loss | Events not destroyed (Fails) |
  | Counting | Enumerating past events (Fails) |

  The mapping looks plausible initially because both involve discrete units ordered sequentially. However, the correspondence degrades upon inspection. Rooms and guests exist simultaneously within the hotel structure, whereas moments and events do not exist simultaneously in a tensed view of time. The reshuffling operation, crucial for generating the "absurdity," has no temporal equivalent; you cannot move a past event to a later slot to accommodate the present. Consequently, the structural isomorphism required for the analogy to function as a proof is absent. The hotel models a static set, while the past is typically understood as a dynamic sequence. This mismatch means the logical contradictions found in the hotel do not necessarily transfer to the timeline. The analogy relies on features of spatial collections that temporal sequences lack.

  4. **Disanalogies that matter**
  The first critical disanalogy is simultaneity. In the hotel, all rooms and guests exist concurrently. This allows the manager to issue instructions that affect the whole collection instantly. In the case of the past, on most metaphysical views compatible with the Kalam, past events do not exist now. They are gone. You cannot manipulate a collection of non-existent things. This damages the inference because the "absurdity" arises from manipulating the collection. If the past is not a currently existing collection, the manipulation is impossible, and the absurdity vanishes. The argument assumes the past is present to be counted, which is metaphysically dubious.

  Second, the hotel relies on the manipulability of the collection's cardinality. The paradoxes often cited involve subtracting guests, such as when all odd-numbered guests leave, to show that infinity minus infinity yields contradictory results. However, past events cannot be subtracted or removed. They are fixed. You cannot make a past battle never have happened. This disanalogy undermines the claim that the arithmetic of transfinite numbers applies to concrete history. The contradiction arises from applying set operations to things that do not obey set operations. Events are not tokens that can be withdrawn from circulation; they are occurrences that have happened.

  Third, the hotel assumes a definite totality. The manager knows the hotel is full. This presupposes that the past is a completed whole that can be surveyed. If the past is open or merely potential, there is no "full" state to contradict the arrival of the present. This damages the premise that an infinite past entails an actual infinite. It suggests the past might be potentially infinite, which avoids the hotel's paradoxes entirely. The argument fails to distinguish between a collection that is infinite by nature and one that is infinite by indefinite extension.

  Finally, the directionality differs. The hotel is spatial; rooms are arranged without intrinsic direction. Time has an intrinsic arrow. Moving guests "up one room" is symmetrical; moving events "forward" is not. The analogy ignores the causal structure of time. If the past is causal, you cannot reshuffle causes without altering effects, which is impossible. This renders the reshuffling step metaphysically incoherent when applied to time, stripping the analogy of its force. The causal rigidity of history prevents the flexibility required to generate the hotel's paradoxes.

  5. **Disanalogies that do not matter**
  Common objections often miss the metaphysical point. First, the claim that such a hotel is physically impossible to build is irrelevant. The argument concerns metaphysical possibility, not engineering constraints. If an actual infinite is metaphysically impossible, no physical laws could permit it; if it is possible, physical limits are beside the point. Second, mere counterintuitiveness is not a disproof. Quantum mechanics is counterintuitive but real. The argument must show logical contradiction, not just strangeness. Third, your instructor's point about mathematical coherence is correct but irrelevant to the Kalam's aim. The Kalam grants mathematical consistency but denies concrete instantiation. The objection must be that concrete instantiation leads to absurdity, not that the math is wrong. These objections fail because they attack the physical or mathematical surface rather than the metaphysical core. They do not address whether a concrete infinite leads to paradoxes in the real world, which is the actual claim being made. Dismissing the hotel because bricks cannot build it ignores the philosophical thought experiment's purpose.

  6. **What the analogy imports**
  Your friend's diagnosis is precise: the hotel smuggles in eternalism. For the hotel to function, all rooms must be equally real and available for rearrangement. This corresponds to a B-theory of time, where past, present, and future events are equally existent coordinates in a block universe. If you hold this view, the hotel analogy works better, but it undermines the Kalam's second premise. If all times exist equally, the universe does not "begin to exist" in the sense of coming into being; it just has a boundary. The Kalam typically presupposes an A-theory of time, where things come into existence and pass away. On A-theory, the past is not a warehouse of existing items; it is a record of what was. There is no concrete collection to count. Therefore, the argument's success turns entirely on a tensed conception of time. If time is tensed, the hotel fails because the "collection" doesn't exist. If time is tenseless, the hotel holds, but the notion of "beginning" required for the Kalam becomes problematic. The analogy imports a metaphysics that conflicts with the argument's own requirements.

  This creates a dilemma. To make the hotel work, you need the past to be real now (B-theory). To make the Kalam work, you need the universe to come into being (A-theory). You cannot have both without tension. The friend's charge that the argument treats the past as a warehouse is correct. It treats past events as ontologically on par with present guests. This reification of the past is necessary for the counting argument but contradicts the intuition that the past is gone. If the past is gone, it cannot be full. If it is not full, the hotel paradox does not arise. The argument thus relies on a specific, contested ontology of time that should be argued for explicitly, not hidden inside an analogy.

  7. **Verdict and replacement**
  You should cut the hotel as the centrepiece. It invites technical objections that distract from the main philosophical thrust and relies on a view of time your opponents will likely reject. Instead, use the argument from successive addition. This argues that a collection formed by adding one member after another cannot be actually infinite. This aligns better with the dynamic nature of time. Sketch it as counting down: if you cannot count down from infinity to zero, you cannot traverse an infinite past to reach the present. However, warn your audience where this leaks: it assumes the traversal must be completed by a finite agent or within a finite time, which an eternalist might deny. It also risks begging the question by assuming the past must be traversed like a count. While superior to the hotel for a dynamic view of time, it still requires defending the impossibility of traversing an infinite, which remains the hard philosophical work. The hotel is too brittle; the traversal argument is more robust but still requires careful handling. Do not present either as a knockout blow. Present them as reasons to think the infinite past is metaphysically suspect, inviting further inquiry rather than claiming final proof. This humility suits a philosophy society better than a dogmatic reliance on a flawed analogy.
