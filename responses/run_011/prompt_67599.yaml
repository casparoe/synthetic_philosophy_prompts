answer: |-
  The clearance machinery you describe is not built on a theory of moral obligation to the dead or the living. It is built on a theory of risk allocation for the producer. When you strip away the language of "respect" and "fairness," the system presupposes that legal personhood is a temporary status that expires at death, while property rights are perpetual assets that transfer to heirs. This creates a specific topology of vulnerability: living people are vulnerable to reputational harm (defamation), while dead people are vulnerable to property theft (copyright infringement). The clearance process is designed to navigate these two distinct liability zones. It does not care about historical truth except insofar as truth mitigates legal risk.

  This practice strictly presupposes that reputation is a legally enforceable interest only for the living. If you deny this, the "living pile" collapses; there would be no need to rename living subjects or soften implications if the law did not recognize their right to sue for damage to their standing. It also presupposes that creative expression regarding the dead is free unless it intersects with tangible property. If you deny this, the "dead pile" collapses; you would need permission to depict a dead person's actions even without using their words. Finally, it presupposes that the producer's financial safety is the primary value to be optimized. If you deny this, the entire clearance workflow loses its authority; you could not justify cutting a historically accurate scene solely because an estate threatened to withhold a letter license.

  The system quietly rules out rival accounts that posit moral rights surviving death independent of property. It excludes the view that the dead can be harmed by misrepresentation, because the machinery allows you to invent damaging dialogue for a dead subject as long as you don't quote their copyrighted letters. It also excludes the view that the public has a claim on the historical record that outweighs private comfort. If the public's right to truth were paramount, clearance would not allow an estate to veto a script based on private letters; the system treats historical accuracy as subordinate to licensing agreements.

  There is significant underdetermination where legal and moral incentives overlap. When a clearance note says "be fair to the subject," it is ambiguous whether this means "avoid a lawsuit" or "honor their memory." Both theories license the same behavior: cutting the scene. Similarly, the requirement to source claims looks like historical rigor, but it functions identically whether the goal is truth or legal defense. You cannot tell from the output whether the researcher is acting as a historian or a paralegal, because the workflow demands the same actions from both roles.

  The split between the living and dead piles is not an inconsistency; it is coherent under a "Producer Protection" theory. The asymmetry where you can invent a dead person's line but cannot quote their real letter is generated by a single view: legal liability attaches to persons, while property rights attach to artifacts. Invented dialogue touches neither a living person's reputation nor a dead person's property. Quoted letters touch dead people's property. Defamatory implications touch living people's legal personhood. The system is perfectly consistent if the goal is to minimize lawsuits, not to maximize truth.

  Your hypothesis is correct: the practice is liability management dressed as ethics. The machinery functions entirely on legal leverage and insurance requirements. The reason the notes keep reaching for moral words like "respect," "fairness," and "tribute" is operational shorthand and public relations. "Respect" is a cheaper heuristic for creatives than explaining the nuances of defamation law, and it provides a dignified cover story for cuts that are actually made to avoid litigation. It aligns the creative team's motivations with the legal team's constraints without requiring the creatives to understand the law.

  The Gaskell case presupposes the exact same theory. In 1857, the legal lever was defamation law applied to the living teachers and husband, which forced censorship of the dead subject's biography. Today, the legal lever is copyright law applied to the dead subject's letters, which forces censorship of the dead subject's biography by the living estate. In both instances, the narrative of the dead person is altered to protect the interests of the living (either their reputations or their property control). The vector is identical: the dead subject is the variable adjusted to secure the comfort or safety of the living stakeholders. The only difference is the specific statute used to enforce the constraint.

  If you replaced the presupposed theory with one where the obligation runs to the dead person rather than to whoever can sue, the clearance process would require a fundamental rebuild. You would need a "historical truth" defense that overrides copyright claims on private letters when used for biographical accuracy. Concrete changes would include independent verification steps not subject to estate approval, and legal clauses that prioritize factual fidelity over licensing conditions. However, you would lose access to private archives; estates would lock down letters and diaries rather than license them under a regime they cannot control. The resulting films might be more accurate, but they would be stripped of the primary source material that currently lends them authenticity.

