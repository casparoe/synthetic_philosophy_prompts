          1.  *Drug:* Evidence is about *my mind*, not the coin. Admissible? Lewis says evidence about future mental states is admissible. But if the drug makes me *certain*, my credence *will* be 1. Should it be 1 now? No, because the drug distorts the link between evidence and belief. Credence should reflect the *actual* chance (0.5) until the drug alters the processing. Once on drug, credence = 1 (by definition of "feel subjectively certain"), but it's irrational.
