      Where $E_{adm}$ is the admissible subset of evidence.
      If $E$ contains inadmissible info (Entry 2), $C(A|E)$ tracks $E$.
      If $E$ suggests the reported chance is biased (Entry 6), $C(Ch(A)=x|E)$ shifts.
      If $E$ suggests the reference class is wrong (Entry 4), $Ch(A)$ is redefined to the specific class.

      *Wait, Entry 5 again.* If I "accept" Theory A, $C(T_A) \approx 1$. If I "take seriously" Theory B, $C(T_B) > 0$. If $C(T_A) + C(T_B) = 1$, then GPP demands averaging. The user says they "accept" A. This implies $C(T_A) \approx 1$. So Entry 5 is consistent with GPP *if* "accept" means "assign probability near 1". But the user says "I am committing myself... to a state of mind that my present self is confident is wrong." This implies $C(T_B)$ is significant enough to make the 0.5 credence feel wrong. This is the inconsistency.

      *Decision:* I will argue that Entry 5 is the sacrifice. It represents a pragmatic "working stance" rather than a coherent epistemic state. Entry 6 represents proper error analysis.

