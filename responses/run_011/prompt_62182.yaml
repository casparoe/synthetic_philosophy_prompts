answer: |-
  **TO:** Editor-in-Chief
  **FROM:** Standards Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Investigation into [Lab Head Name]

  **DECISION:** HOLD

  **APPLICATION OF STANDARDS**
  Our standards guide requires structural corroboration for testimony-only claims: independent witnesses must diverge on incidentals. This piece fails that test. The nine witnesses converge almost word-for-word. However, the Committee finds that strict application of the clause here conflates *coordination of malice* with *coordination of language*. The convergence appears to be an artifact of witnesses acquiring a shared vocabulary for previously unnamed harms during a prior group gathering. The clause currently lacks the nuance to distinguish between collusive scripting and the natural linguistic alignment of victims finding a label for their experience.

  **THE CASE FOR KILLING**
  Despite the above, the argument for killing this story is substantial and, under strict adherence to our current guide, definitive. We possess zero documentary evidence; all internal records were deleted. Seven of nine sources refuse to go on the record, and one holds a professional conflict of interest at a rival institute. The subject's counsel has already framed this as a coordinated campaign by disgruntled former staff.

  If we publish now, we enter litigation with no paper trail and testimony that looks coached. Our standards exist specifically to protect the magazine from this vulnerability. Waiving them risks setting a precedent that allows emotional resonance to override evidentiary rigor. If the subject sues, our defense rests on the credibility of witnesses who cannot be cross-examined publicly. The reputational damage of a retraction or lost lawsuit outweighs the public interest in this specific allegation at this time. The default position under our current standards is kill.

  **CONDITIONS FOR PUBLICATION**
  We recommend a two-week hold to test whether the convergence survives when the borrowed label is withheld. The reporter must re-interview the two on-record sources and one off-record source. In these interviews, the reporter must not use the label supplied at the group gathering. Witnesses should be asked to narrate specific incidents of authorship exclusion from scratch. If their accounts diverge structurally on dates, locations, and specific actions when stripped of the shared vocabulary, the hold may be lifted. If convergence persists without the label, the story will be killed.

  **PROPOSED REVISION TO STANDARDS**
  To prevent future ambiguity, we propose adding the following proviso to the testimony clause:

  *"Where witnesses share a common vocabulary derived from a specific prior event, structural corroboration must be tested by isolating factual recollection from shared terminology. Editors must verify that divergence on incidentals exists when the shared label is withheld."*

  This ensures we protect sources finding community without compromising our defense against coordinated fabrication.
