answer: |-
  1. **The Priority of Power over Duty**
  Your account inverts the standard explanatory order: the promisee's power to release doesn't flow from a prior duty; rather, the duty *consists* in being subject to that power. But critics will argue this is circular: surely the promisee only has the standing to release you *because* the duty is already owed to them. If the power isn't grounded in a prior directed duty, what grounds the power itself, and how do you prevent this from looking like normative magic?

  *Follow-up:* You will likely reply that the power is a primitive normative capacity exercised through intention. But if it is primitive, what distinguishes this normative power from a mere command? A commander can demand I do something, but I am not necessarily *obligated* in the promissory sense unless I have authorized their authority. How does your view capture that specific act of authorization without smuggling in a prior duty to obey the authorization?

  2. **The Mechanics of Self-Promises**
  On your view, obligation is essentially relational: it is being subject to a demand *someone else* can extinguish. This faces a problem with self-promises. If I promise myself to quit smoking, I hold both the position of the bound agent and the power-holder. If I can simply release myself at will, it seems no obligation ever gains a foothold. Do self-promises generate genuine promissory obligations on your account, or are they a distinct normative category?

  *Follow-up:* If you say they are a distinct category, you risk fracturing the unity of "promising." But if you say they are the same, you must explain how the "power to release" constrains me when I hold that power. Will you argue that I can bind my future self's power to release, and if so, doesn't that reintroduce a duty that exists *prior* to the exercise of the release power, contradicting your core thesis?

  3. **The Vanishing Power-Holder**
  Consider a promise made to a specific person who subsequently dies or becomes permanently incapacitated before the promise is fulfilled. On the standard view, the duty survives because it was incurred at the moment of promising. On your view, the obligation is constituted by the promisee's standing power to release. If the promisee no longer exists to hold that power, does the promissory obligation cease to exist? If it survives, what becomes of the release power?

  *Follow-up:* You are likely to suggest the power transfers to an executor or next of kin. But there is often a gap between death and the appointment of an executor, or cases where no one is appointed. During that interim, is the promisor literally free of the obligation because there is no one currently holding the power? If not, you seem to admit the obligation can exist independently of the power, which undermines the "power-first" explanation.

  4. **Wrongful Acts and the Limits of Release**
  Suppose I promise to help you commit a fraud. You later release me from the promise. Intuitively, I am no longer bound by the *promise*, but I am still forbidden from committing the fraud. This suggests the promise created a specific layer of obligation that sits atop independent moral constraints. But if the promissory obligation *just is* subjection to your power, and your power cannot make the fraud permissible, does this show that the binding force of the promise must be limited by norms external to the power itself?

  *Follow-up:* You will likely distinguish between the *promissory* duty (which is extinguished) and the *moral* duty (which remains). But if the promissory duty is extinguished, what work was it doing? If the act remains impermissible regardless of the release, was there ever a genuine promissory obligation to perform *that act*, or does your view imply we cannot promise to do wrong at all?

  5. **Non-Conventionalist Mechanism**
  You reject conventionalism: you don't think promising relies on a social practice or rules of a game. But normative powers usually require a background framework to be intelligible; chess moves create obligations only within chess. If there is no social practice grounding the link between uttering "I promise" and acquiring a liability to another's power, how does the utterance itself trigger this normative shift? How do you get the "hook" that catches the power without a convention?

  *Follow-up:* Your best move here is to appeal to a natural right of individuals to authorize others. But if this right is natural, why does it require specific performative words? If I simply intend to give you authority over my action, why isn't that sufficient? Does your view inadvertently require a convention after all to signal the exercise of this natural power?

  6. **The Redundancy Case vs. Assurance**
  This is where your view may have the advantage. On assurance views (like Scanlon's), promising is about generating expectations. But if I promise to do what I am already unconditionally required to do (e.g., "I promise not to murder you"), I generate no new expectation, yet I still seem to make a promise. Your view handles this easily: I've simply handed you a power to release me from a duty I already had. Is this redundancy case the primary phenomenological data point that motivated the "power-first" approach?

  *Follow-up:* If you confirm this is the key advantage, doesn't it make promising too cheap? If I can promise to do anything I'm already required to do, and the only change is your power to release me, does this dilute the special significance of promising? Why would we bother promising in these cases if not to provide the extra assurance your view claims is secondary?

  7. **Revocation and Stability**
  If the obligation consists in my subjection to your power, the stability of that obligation depends on the stability of the power transfer. Can I, as the promisor, unilaterally revoke the power I gave you? If I can, the obligation seems fragile; if I cannot, what stops me? Is it that I have a duty not to revoke the power?

  *Follow-up:* If you say I have a duty not to revoke the power, we are back to the standard picture: a duty grounds the stability of the power. If you say I simply *lack* the normative ability to revoke it, you need to explain why I have the ability to grant the power but not the ability to take it back. Is this asymmetry built into the nature of the power itself, and if so, how?

  8. **Falsification Conditions**
  Finally, a methodological question. Your account relies heavily on the intuitive structure of the release power. What discovery—whether phenomenological, linguistic, or normative—would count decisively against your view? If we found a class of promises where the promisee clearly cannot release the promisor, yet we still intuitively judge a promissory obligation to exist, would that force you to abandon the "power-first" explanation?

  *Follow-up:* If you say such a case would falsify the view, you are tying your theory to our intuitions about release. But if our intuitions about release are themselves shaped by the standard "duty-first" picture we were raised with, aren't you risking a circular confirmation bias? How do you isolate the intuition about the *power* from the intuition about the *duty*?
