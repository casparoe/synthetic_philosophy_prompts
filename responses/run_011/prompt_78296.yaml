answer: |-
  # JOINT STATEMENT ON THE ETHICS OF ASSERTION AND MISLEADING
  **Draft Strawman for Workshop Redline**

  ## 1. AGREED CLAIMS

  The undersigned parties accept the following claims as the baseline for further discussion. Where qualifications are necessary for acceptance, they are embedded in the text.

  1.  **Definition of Lying:** A lie occurs when a speaker asserts a proposition they believe to be false with the intention that the hearer believe it is true. Both parties agree this definition captures the descriptive core of the act, regardless of whether the statement is actually believed or successfully deceives.
  2.  **Definition of Deliberate Misleading:** Deliberate misleading occurs when a speaker asserts a proposition they believe to be true, knowing or intending that the hearer will infer a false proposition from it. Both parties agree this is descriptively distinct from lying because the asserted content is true.
  3.  **Consequences Matter:** Both parties agree that the actual harm caused by deception is a relevant factor in determining the *all-things-considered* wrongness of an act. Neither party holds that a harmless lie is equally wrong as a catastrophic lie.
  4.  **Permissibility:** Both parties agree that deception (whether by lie or misleading) can be morally permissible in specific contexts, such as self-defense against malicious inquiry or protecting confidential information where no duty of disclosure exists.
  5.  **Descriptive vs. Normative:** Both parties agree there is a descriptive difference between lying and misleading (false assertion vs. true assertion with false implication). The dispute is strictly normative: whether this descriptive difference generates a difference in moral kind or merely moral degree.
  6.  **Contextual Variance:** Both parties agree that the moral weight of deception may vary depending on institutional context (e.g., courtroom testimony vs. casual conversation) due to differing expectations of candor and differing allocations of epistemic labor.
  7.  **Hearer Agency:** Both parties agree that the hearer's capacity to verify information and their own epistemic responsibilities are relevant factors in assessing the morality of the speaker's act, though they disagree on the weight of this factor.

  ## 2. DISAGREEMENTS TABLE

  | Neutral Label | Distinctivist Formulation | Parity Theorist Formulation | Classification |
  | :--- | :--- | :--- | :--- |
  | **The Source of Wrongness** | The wrong of lying is intrinsic to the violation of the norm of assertion; you corrupt the tool of communication itself. | The wrong of deception is extrinsic, rooted in the violation of the hearer's autonomy and the production of false belief. | **Substantive** |
  | **Kind vs. Degree** | Lying is worse *in kind* because it involves a different relation to the truth; misleading leaves the channel of assertion open. | There is no difference in kind; any perceived difference is merely degree based on detection risk or social cost. | **Substantive** |
  | **Epistemic Labor** | The speaker bears the primary burden not to manufacture false belief, regardless of the hearer's inferential capacity. | The hearer bears a significant burden to verify implications; if they fail to check, the speaker's moral culpability decreases. | **Different Questions** (Normative Duty vs. Causal Responsibility) |
  | **The "Said/Implicated" Boundary** | The boundary between what is said and what is implicated is stable enough to bear moral weight in standard contexts. | The boundary is too porous and context-dependent to serve as a reliable moral bright line in complex cases. | **Verbal / Definitional** |
  | **Legal vs. Moral Norms** | Legal rules (like perjury statutes) often fail to capture the moral wrong of misleading because they prioritize procedural efficiency over truth. | Legal rules track the moral reality of distributed epistemic responsibility; if the law excuses it, the moral blame is significantly reduced. | **Different Questions** (Ideal Morality vs. Institutional Rule) |

  ## 3. CASE BATTERY

  | Case | Distinctivist Rating (0-10) & Justification | Parity Rating (0-10) & Justification |
  | :--- | :--- | :--- |
  | **(a) Car Accident**<br>Lie: "Never been in an accident."<br>Mislead: "Never been in a collision." | **Lie: 9**<br>**Mislead: 6**<br>The lie directly violates the norm of assertion regarding the car's history. The misleading statement relies on the buyer's equivocation between "accident" and "collision," sharing the blame. | **Lie: 8**<br>**Mislead: 8**<br>The intent and outcome are identical. The semantic split is a technicality; the buyer is equally deceived in both scenarios. |
  | **(b) Record Existence**<br>Email (recorded) vs. Party (spoken). | **Email: 9**<br>**Party: 7**<br>The violation of assertion is constant, but the permanent record increases the potential for systemic distrust if discovered. | **Email: 9**<br>**Party: 5**<br>The wrongness tracks detectability and harm. A lie at a party is harder to verify and less likely to cause reliance damage than a recorded email. |
  | **(c) Nosy Neighbor**<br>"Seeing anyone?"<br>Truth: "Focused on work." Lie: "No." | **Lie: 3**<br>**Mislead: 1**<br>The neighbor has no right to the answer, mitigating the wrong. However, the lie remains a violation of assertion, whereas the truth is merely evasive. | **Lie: 2**<br>**Mislead: 2**<br>Since the neighbor has no right to the info, the moral cost is negligible for both. The method of deception is irrelevant given the lack of duty. |
  | **(d) Regulated Disclosure**<br>"Not under investigation" (True) vs. "No contact" (False). | **True: 4**<br>**False: 9**<br>In regulated contexts, literal compliance with definitions matters. The true statement plays by the institutional rules; the lie breaks them. | **True: 8**<br>**False: 9**<br>The intent to conceal regulatory scrutiny is the same. The literal truth is a loophole exploit morally equivalent to the lie in this high-stakes context. |
  | **(e) Silence vs. True Statement**<br>Filling silence with truth vs. saying nothing. | **True: 5**<br>**Silence: 2**<br>Asserting a truth to mislead actively conscripts language into deception. Silence is passive and leaves the hearer's error entirely their own. | **True: 6**<br>**Silence: 6**<br>If the speaker intends the false belief in both cases, the moral weight is equal. Causally, both result in the same false belief. |
  | **(f) The Child**<br>"Mommy's at work" (True) vs. Lie. | **Lie: 10**<br>**Mislead: 8**<br>Children cannot perform complex inference. Misleading them exploits their trust almost as badly as lying, but lying corrupts their language acquisition specifically. | **Lie: 9**<br>**Mislead: 9**<br>The child's inability to verify makes the speaker fully responsible in both cases. The semantic distinction is irrelevant given the vulnerability. |
  | **(g) Hoping vs. Seeking Hearer**<br>Hearer wants false belief vs. Hearer seeks truth. | **Hoping: 7**<br>**Seeking: 10**<br>The violation of assertion is worse when the hearer is actively relying on the norm of truthfulness to find reality. | **Hoping: 5**<br>**Seeking: 9**<br>Wrongness tracks harm and autonomy violation. A hearer who wants to be deceived is less harmed than one trying to know the truth. |

  ## 4. THE CRUXES

  Settling the following sub-questions would materially shift the debate. For each, we record the evidence both sides accept as relevant, their predictions, and any refusals to accept the evidence.

  **Crux 1: The Norm of Assertion**
  *   **Question:** Is there a specific moral duty attached to the act of asserting *distinct* from the duty not to harm?
  *   **Evidence:** Intuition pumps regarding "bald lies" vs. "ironic statements" where harm is zero.
  *   **Distinctivist Prediction:** People will judge the bald lie as wrong even with zero harm, because the norm was violated.
  *   **Parity Prediction:** People will judge the act as neutral if harm is zero; any residual wrongness is just aesthetic disgust, not moral weight.
  *   **Refusal:** Parity theorist refuses to accept intuitions about "zero harm" cases as morally probative, arguing morality requires stakes.

  **Crux 2: Hearer Responsibility**
  *   **Question:** Does the hearer's failure to infer correctly shift moral blame from the speaker?
  *   **Evidence:** Cases where the hearer is highly sophisticated vs. naive.
  *   **Distinctivist Prediction:** Speaker blame remains high regardless of hearer sophistication; the speaker initiated the deception.
  *   **Parity Prediction:** Speaker blame drops significantly when the hearer is sophisticated and should have known better.
  *   **Refusal:** None. Both accept this as relevant.

  **Crux 3: Determinacy of the Said/Implicated Line**
  *   **Question:** Is the boundary between saying and implicating stable enough to ground a moral rule?
  *   **Evidence:** *Bronston v. United States* (1973). The Court held a literally true but unresponsive answer was not perjury, placing the burden on the questioner.
  *   **Distinctivist Prediction:** The Court was legally correct but morally wrong. The witness violated the moral norm of testimony by exploiting linguistic ambiguity.
  *   **Parity Prediction:** The Court was morally correct. In adversarial contexts, the epistemic labor is explicitly divided; the witness holds cards, the questioner must draw them.
  *   **Refusal:** Distinctivist refuses to accept legal reasoning as moral evidence, viewing law as purely procedural.

  **Crux 4: Contextual Variance**
  *   **Question:** Is the Distinctivist view only plausible in casual conversation, while the Parity view dominates in regulated institutions?
  *   **Evidence:** Comparison of ratings in Case (a) (Car Sale) vs. Case (d) (Regulated Disclosure).
  *   **Distinctivist Prediction:** The gap between Lie and Mislead shrinks in regulated contexts but remains present.
  *   **Parity Prediction:** The gap disappears entirely in regulated contexts where literal compliance is the defined duty.
  *   **Refusal:** None.

  **Crux 5: The "Kind" Claim**
  *   **Question:** If consequences, intent, and detection risk are held perfectly constant, does a residual wrongness remain for lying?
  *   **Evidence:** Hypothetical scenarios where detection is impossible and harm is identical.
  *   **Distinctivist Prediction:** Yes. The act itself is corrupted.
  *   **Parity Prediction:** No. If all consequences and intents are identical, the moral value is identical.
  *   **Refusal:** Parity theorist argues this hypothetical is impossible to construct meaningfully because the *risk* of detection is never truly identical.

  ## 5. EMPIRICAL CRUX

  Both parties agree that a well-designed empirical study of ordinary folk judgments could bear on the dispute, provided the design controls for confounding variables.

  **Study Design:** Participants read vignettes where a speaker induces a false belief. The variable manipulated is Truth Value (Lie vs. True-but-Misleading). Constants include: Intent to deceive, Outcome/Harm, Probability of Detection, and Relationship between speaker/hearer.

  **Distinctivist Prediction:**
  Participants will rate the Lie condition as morally worse than the Misleading condition, even when harm and detection are held constant. This indicates an intuitive grasp of the norm of assertion.

  **Parity Prediction:**
  Participants will show no significant difference between conditions once harm and detection are controlled. Any observed difference will correlate with participants' inability to distinguish the cases descriptively (i.e., they call the misleading statement a "lie").

  **Objections to Data Reading:**
  *   **Distinctivist Objection to Parity:** If folk show no difference, it is because folk are consequentialists by default, not because the moral reality is consequentialist. Folk judgments track harm, not duty.
  *   **Parity Objection to Distinctivist:** If folk show a difference, it is because they are reacting to the *definition* of the word "lie" (which carries stigma) rather than the moral act. They are punishing the label, not the conduct.

  ## 6. SELF-FALSIFICATION

  Each side identifies one concrete case that would force them to abandon or significantly revise their position.

  **Distinctivist Falsifier:**
  If, in a regulated institutional context (like *Bronston*), a literal truth is shown to cause *more* systemic distrust and harm than a direct lie would have, and legal/moral institutions universally treat the literal truth as *more* culpable than the lie. If the norm of assertion collapses entirely in high-stakes environments, the "kind" distinction loses its universal force.
  *   *Status:* Willing to accept this as falsifying the universal claim, though may retreat to a "casual conversation only" claim.

  **Parity Falsifier:**
  If a study demonstrates that people consistently judge lies as worse than misleading statements *even when* the misleading statement is proven to be harder to detect and causes more harm. If the "lie" is judged worse despite having better consequences and lower risk, the Parity claim that wrongness tracks consequences/degree is false.
  *   *Status:* Willing to accept this, but notes that such a study is difficult to design without participants conflating "wrong" with "illegal" or "taboo."

  **Note on Inability:**
  The Parity theorist notes that if the Distinctivist retreats to claiming the difference is only in "casual conversation," the Parity theorist cannot falsify that, as it concedes the main point of contention regarding professional/legal contexts.

  ## 7. CLOSING: WHAT WOULD MOVE THIS?

  Given the positions outlined above, the group should not expect a full resolution without a shift in the underlying meta-ethical commitments. The deadlock persists because the Distinctivist operates from a duty-based framework (actions have intrinsic moral properties) while the Parity theorist operates from a consequence-based framework (actions derive moral properties from outcomes).

  **What would break the deadlock:**
  1.  **Agreement on Context:** If both sides agree that the "Kind" distinction holds in personal relationships but dissolves in regulated professional contexts, the fight reduces to boundary-drawing rather than first principles.
  2.  **Empirical Consensus:** If the empirical study in Section 5 shows a robust "Lie > Mislead" effect even when consequences are controlled, the Parity theorist must admit a non-consequentialist factor exists. If the effect disappears, the Distinctivist must admit the "Kind" difference is not intuitively robust.
  3.  **Reframing the Question:** If the group stops asking "Which is worse?" and starts asking "Under what conditions does the hearer's responsibility outweigh the speaker's duty?", the debate may become productive.

  **Honest Assessment:**
  Unless one side abandons their meta-ethical foundation (Duty vs. Consequence), this argument will continue forever. The most productive path is not to prove one side right, but to map exactly where the "Kind" distinction retains moral force and where it dissolves into technicality. We recommend focusing on Section 4, Crux 3 (Legal vs. Moral Norms), as this is where the workshop members' professional expertise (law vs. philosophy) can actually generate new data rather than recycling old intuitions.

