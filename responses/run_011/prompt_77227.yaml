answer: |-
  ### Internal Procedure: Function Attribution Review (FAR-1)

  **Purpose:** To resolve flagged sentences containing function attributions ("function of," "is for," "serves to") in a way that balances biological accuracy, readability, and sensitivity to teleological/evolutionary complaints.

  **Philosophical Basis:** This procedure operationalizes the distinction between **Etiological Accounts** (function is defined by evolutionary history/selection) and **Systemic Accounts** (function is defined by current causal contribution to the system). It treats **Teleological Language** (implying conscious design or future goals) as an error.
  *   *Settled:* Biologists routinely use function language without committing to a designer.
  *   *Disputed:* Whether a trait must have an evolutionary history to have a "function," or if current utility is sufficient. This procedure does not resolve this; it routes around it.

  **Time Limit:** 10–15 minutes per sentence.
  **Operator:** Freelance Copyeditor (No biology/philosophy training required).

  ---

  #### The Decision Tree

  **Step 1: The Teleology Screen (Intent Check)**
  Read the sentence. Does it imply a conscious designer, a future goal, or a choice by the organism?
  *   *Keywords:* "Designed to," "purpose," "in order to," "tries to," "wants to."
  *   *Example:* "The heart beats *in order to* pump blood."
  *   **If YES:** **Rewrite.** Remove intent. Change to: "The heart beats, *which pumps* blood." (Proceed to Step 4).
  *   **If NO:** Proceed to Step 2.
      *   *[JUDGMENT CALL]:* Distinguishing "purpose" from "function" is subtle. If unsure, flag for SME.

  **Step 2: The Consensus Screen (Curriculum Check)**
  Is this trait's function standard, uncontroversial introductory biology? (e.g., Heart/Pump, Leaf/Photosynthesis, Flipper/Swimming).
  *   *Heuristic:* Is this found in 90% of high school textbooks?
  *   **If YES:** Proceed to Step 3.
  *   **If NO (Obscure, Debated, or Newly Discovered):** **Refer to SME.** Do not rewrite.
      *   *[PROCEDURAL LIMIT]:* Copyeditors cannot verify biological consensus. This step relies on general knowledge. If the trait seems specific or weird, refer.

  **Step 3: The Vestigial/History Screen**
  Is this trait widely taught as **vestigial** (a remnant with reduced or changed function compared to ancestors)?
  *   *Examples:* Human tailbone, wisdom teeth, whale pelvis.
  *   **If YES:** **Rewrite to Causal-Role.** Do not use "The function of X is Y." Use: "X *acts as* Y" or "X *contributes to* Y."
      *   *Rationale:* "Function" implies selection *for* the trait. Vestigial traits were selected for something else originally.
  *   **If NO:** Proceed to Step 4.
      *   *[JUDGMENT CALL]:* Determining vestigiality without a reference sheet is a judgment call. When in doubt, Refer to SME.

  **Step 4: The Phrasing Decision**
  You have cleared the sentence for a function locution. Choose the phrasing based on the Chapter Context.
  *   **Is this chapter explicitly about Evolution/Natural Selection?**
      *   **YES:** **Rewrite to Historical (Selected-Effect).** "Structures like X were favored in ancestors because..."
          *   *Constraint:* Keep it simple. Do not exceed 25 words.
      *   **NO:** **Keep Original Function Locution.** ("The function of X is Y" or "X functions to Y").
          *   *Rationale:* In non-evolution chapters, causal-role and selected-effect converge for standard traits. "Function" is acceptable shorthand.

  **Step 5: Stop and Hand Off**
  If at any point you feel the decision depends on **House Policy** (e.g., "How much evolution do we emphasize in Grade 9?") rather than the sentence itself, **Refer to SME.**
  *   *[PROCEDURAL LIMIT]:* This procedure cannot settle values. It cannot decide if the textbook *should* teach evolution aggressively or conservatively. It only ensures consistency once that policy is known.

  ---

  ### Application to Draft Sentences

  Here is the execution of FAR-1 on the three provided sentences.

  #### 1. "The function of the penguin's flipper is propulsion underwater."
  *   **Step 1 (Teleology):** No intent implied. "Propulsion" is a physical outcome, not a goal. **Pass.**
  *   **Step 2 (Consensus):** Penguin flippers for swimming is standard curriculum. **Pass.**
  *   **Step 3 (Vestigial):** Not vestigial. It is an adapted wing. **Pass.**
  *   **Step 4 (Phrasing):** Assume this is in a "Vertebrates" or "Adaptations" chapter, not strictly "Evolutionary Mechanisms."
  *   **Decision:** **Keep Original.**
  *   **Result:** "The function of the penguin's flipper is propulsion underwater."

  #### 2. "The human coccyx functions as an attachment site for muscles of the pelvic floor."
  *   **Step 1 (Teleology):** No intent implied. **Pass.**
  *   **Step 2 (Consensus):** Standard anatomy, but context matters. **Pass.**
  *   **Step 3 (Vestigial):** The coccyx is classically taught as a vestigial tail remnant.
  *   **Decision:** **Rewrite to Causal-Role.** The procedure flags vestigial structures as high-risk for "function" language because their current utility was not the primary cause of their origin.
  *   **Result:** "The human coccyx **acts as** an attachment site for muscles of the pelvic floor."

  #### 3. "The appendix functions as a reservoir that repopulates the gut with beneficial bacteria after a bout of illness."
  *   **Step 1 (Teleology):** No intent implied. **Pass.**
  *   **Step 2 (Consensus):** The "safe house" hypothesis is relatively recent and debated. Many texts still label it vestigial. It is not "90% textbook consensus" in the same way the heart is.
  *   **Decision:** **Refer to SME.** The copyeditor cannot verify if this hypothesis is settled enough for high school presentation.
  *   **Result:** **Flagged for Subject-Matter Editor review.**

  ---

  ### Supervisor Critique: The Disliked Outcome

  **Sentence:** #2 (The human coccyx).
  **Outcome:** Rewritten to Causal-Role ("acts as" instead of "functions as").
  **Why the Supervisor Will Dislike This:**

  Your supervisor is a biologist. To a biologist, the distinction between "function" and "causal role" in the context of vestigiality is pedagogically significant, but the *erasure* of the functional language here undermines the teaching point.

  1.  **Loss of Nuance:** By forcing "acts as," the procedure sanitizes the sentence to avoid teleological complaints. However, modern evolutionary biology *does* attribute functions to vestigial structures (exaptations). The coccyx *does* have a function (attachment), even if it wasn't selected *for* that originally. The procedure forces a phrasing that makes the trait sound passive or incidental, rather than a integrated part of current physiology.
  2.  **Capitulation to Anti-Evolution Complaints:** The procedure explicitly routes around the "evolutionary content being pushed" complaint (Step 4). By downgrading the coccyx sentence, the procedure prioritizes reviewer comfort over biological precision. Your supervisor likely wants to teach that vestigial structures *have* current functions (Causal Role) even if they lack original functions (Selected Effect). The procedure blurs this by making the copyeditor avoid the word "function" entirely, effectively hiding the biological reality to appease reviewers who object to *any* evolutionary framing.
  3.  **Inconsistency:** Sentence 1 (Penguin) keeps "function." Sentence 2 (Coccyx) loses it. To a student, this implies the coccyx is "less real" or "less biological" than the flipper, which reinforces the very misconception (that vestigial = useless) the textbook should be correcting.

  ### What This Procedure Cannot Settle

  1.  **Biological Truth:** The procedure checks linguistic form, not scientific accuracy. It relies on the copyeditor's heuristic for "consensus" (Step 2). If a biological consensus shifts (e.g., the Appendix hypothesis becomes standard), the procedure does not automatically update.
  2.  **Pedagogical Values:** The procedure cannot decide whether the textbook should prioritize evolutionary literacy or reviewer comfort. Step 4 hands this off, but Step 3 (Vestigial Screen) makes a substantive value judgment that "vestigial" traits require different language, which is a policy decision, not a factual one.
  3.  **The Nature of Function:** The procedure treats "function" as ambiguous and routes around it. It does not solve the philosophical problem of whether the coccyx *really* has a function. It merely dictates what the sentence should *look like* to minimize complaints.

  ### Explicit Judgment Calls Dressed as Procedure

  *   **Step 2 (Consensus Screen):** Asking a copyeditor to judge if a trait is "standard curriculum" without a reference list is a substantive biological judgment. They will inevitably err on the side of caution (Referring) or assumption (Keeping), introducing inconsistency.
  *   **Step 3 (Vestigial Screen):** Classifying a trait as vestigial requires biological knowledge. A copyeditor might not know the coccyx is vestigial but know the appendix is debated. This relies on general knowledge that varies by operator.
  *   **Step 1 (Teleology):** Distinguishing "in order to" (teleological) from "so that" (explanatory) is a linguistic gray area that philosophers still debate. The procedure treats it as binary.
