          *   *Solution:* Focus on *process* and *resilience*. Is the exclusion structural or accidental? Is the mechanism self-sealing?
          *   *Status:* Non-Negotiable. If a theory can't distinguish a library from a cult, it's useless.

      *   *Requirement 2: Mechanism of Exclusion.*
