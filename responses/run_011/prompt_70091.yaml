  ### Two Principles Accommodating Verdicts 1–5

  Nadia's verdicts consistently prioritize the **intrinsic nature** of the object over the **extrinsic context**, but they also distinguish between how that intrinsic nature is arranged. Here are two principles that fit her five cases perfectly but diverge on the new one.

  **Principle 1: The Total Intrinsic Constitution View**
  An object has a disposition if and only if its total intrinsic makeup at the time of stimulus is capable of producing the manifestation. If any part of the object's intrinsic matter acts to prevent the manifestation, the disposition is absent. Extrinsic factors (devices, rigs, environmental agents) are irrelevant to whether the disposition exists; they only affect whether it manifests.
  *   **Fits 1–5:** It explains why extrinsic finks/masks (Cases 1, 3, 5) don't remove the disposition, why extrinsic mimics (Case 2) don't create one, and why an intrinsic blocker (Case 4) does remove it.
  *   **Implication for the Bar:** The alloy is worked *through* the bar at the smelting stage. It is part of the total intrinsic constitution. Since this intrinsic constitution prevents corrosion, the bar is **not disposed** to corrode.

  **Principle 2: The Bulk-vs-Surface Integrity View**
  An object has a disposition if its *bulk* intrinsic structure supports the manifestation, provided any preventative mechanism is either extrinsic or limited to the *surface* as a distinct layer. Intrinsic preventative mechanisms negate the disposition only if they are integrated into the bulk material itself.
  *   **Fits 1–5:** It handles the extrinsic cases (1, 2, 3, 5) like Principle 1. Crucially, it handles Case 4 (Match) because the retardant is *mixed into* the head (bulk integration). It handles Case 5 (Cap) because the shell is an *encasement* (surface/extrinsic layer).
  *   **Implication for the Bar:** The alloy forms an invisible *film* across the surface. Although the alloy is worked through the steel, the preventative mechanism (the film) is a surface phenomenon, distinct from the bulk iron beneath. Therefore, the bulk steel retains its disposition. The bar **is disposed** to corrode.

  ***

  ### Nadia's Likely Verdict

  **Verdict:** Nadia will say the bar is **not disposed** to corrode.

  **Closest Analogue:** **Case 4 (The Retardant Match).**

  **Reasoning:**
  In Case 4, the match head contains combustible compounds but also a retardant mixed in at manufacture. Nadia verdicts that it is *not* disposed to light. The key feature here is that the preventative mechanism is an **intrinsic additive introduced at the origin** of the object's formation.

  The Alloy Bar is structurally identical to the Match. The anti-corrosive metal is "worked through it at the smelting stage." It is not a coating applied later (which might have been analogous to the Shell in Case 5); it is a constituent of the material itself. Even though the film forms on the surface, it is generated by the intrinsic alloy, just as the retardant gas is generated by the intrinsic match head chemicals. For Nadia, the locus of prevention is the *object's definition*, not just its spatial arrangement.

  **Where the Analogy Strains:**
  The strain lies in the **timing of the prevention**.
  *   In **Case 4**, the match *begins* to react (the prompt says the retardant "smothers the reaction"), implying the disposition's causal process initiates before being killed.
  *   In the **New Case**, the film "keeps the iron beneath from reacting *at all*."
  *   If Nadia denies the disposition in Case 4 even though the reaction *starts*, she must deny it in the New Case where the reaction *never starts*. However, the "Surface Integrity" principle (Principle 2 above) might tempt her to treat the film like the Shell in Case 5. The strain is that the film is chemically intrinsic (like the Match) but spatially superficial (like the Shell). Nadia will likely resolve this by prioritizing **chemical origin** (Smelting/Manufacture) over **spatial location**, keeping her consistent with Case 4.

  ***

  ### A Further Case to Distinguish the Principles

  To tell the **Total Intrinsic Constitution View** (Principle 1) from the **Bulk-vs-Surface Integrity View** (Principle 2), we need a case where an intrinsic preventative mechanism is bulk-integrated but functionally distinct.

  **Case 6: The Self-Neutralizing Acid.**
  A glass vial contains a potent acid. The glass itself is manufactured with a chemical agent distributed evenly *throughout the thickness of the glass walls* (not just on the surface). If the acid touches the glass, the glass dissolves slightly, releasing the agent which instantly neutralizes the acid before it can eat through. The vial never leaks.

  *   **Principle 1 (Total Constitution):** The neutralizing agent is part of the vial's intrinsic bulk constitution. It prevents the manifestation (leaking/corrosion).
      *   *Verdict:* The vial is **not disposed** to leak.
  *   **Principle 2 (Bulk-vs-Surface):** The preventative mechanism is in the *walls* (bulk), not just a surface coating, but it is distinct from the *acid* (the source of the disposition). However, if we ask if the *glass* is disposed to dissolve: The agent is integrated into the bulk glass.
      *   *Refined Case 6:* Let's ask about a **Radioactive Brick**. A brick of uranium is mixed evenly with a lead-dust absorber during smelting. No radiation escapes the surface.
      *   **Principle 1:** Intrinsic makeup prevents radiation escape. -> **Not disposed** to radiate (externally).
      *   **Principle 2:** The uranium (bulk) has the power; the lead (bulk) masks it. Since the mask is integrated into the bulk, the disposition is negated.
      *   *Wait, I need them to disagree.*

  **Better Case 6: The Reactive Skin.**
  A metal sphere is made of a homogeneous alloy. When exposed to air, the *entire volume* of the sphere expands slightly to increase density, which physically prevents oxidation of the atoms. The prevention is not a surface film; it is a bulk structural shift.

  *   **Principle 1 (Total Constitution):** The intrinsic structure prevents oxidation. -> **Not disposed** to oxidize.
  *   **Principle 2 (Bulk-vs-Surface):** This principle relies on surface vs. bulk *location* of the blocker. If the blocker is the *whole object changing state*, is that a surface mask? No.
  *   *Let's try one more precise distinction.*

  **Final Case 6: The Sacrificial Core.**
  A steel beam has a core of magnesium worked through its center (intrinsic, bulk). The magnesium corrodes *instead* of the steel, protecting the steel structurally. The beam does not rust.
  *   **Principle 1:** Intrinsic matter prevents rusting. -> **Not disposed** to rust.
  *   **Principle 2:** The preventative mechanism (magnesium) is distinct from the disposition-bearer (steel). Even if worked through, it is a separate *mechanism*. -> **Disposed** to rust (the steel is, and the beam inherits it).

  ***

  ### Outlier Check

  There is no clear outlier among the five cases; they form a coherent system based on **Intrinsic vs. Extrinsic** and **Integrated vs. Encased**.

  However, **Case 1 (The Finkish Wire)** is the most costly to maintain. Standard metaphysical intuition suggests that if a wire *cannot* conduct when touched (because the rig makes it non-conductive *the instant* it is touched), it lacks the disposition *at the time of stimulus*. Nadia's insistence that it *is* disposed requires her to hold that dispositions are **permanent properties of the categorical base**, unaffected by temporary intrinsic changes caused by extrinsic triggers.

  **The Cost:** To keep Case 1, Nadia must reject the idea that dispositions are tightly linked to counterfactuals about the *moment of stimulus*. She must argue that the disposition is a **historical or essential property** of the copper, not a current functional capacity. This makes her theory less about what the object *does* and more about what the object *is*, which complicates her explanation of Case 4 (where what the object *is* includes a retardant). She must walk a fine line: the rig changes the wire's *state* (extrinsically forced), but the match's retardant is part of the wire's *nature* (intrinsically mixed). Maintaining this distinction requires a robust theory of "natural kinds" vs. "temporary states," which is a significant theoretical burden.
