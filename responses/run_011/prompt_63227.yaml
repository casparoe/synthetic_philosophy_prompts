prompt: |-
  I serve on the editorial board of a university press series in global history, and we must decide whether an incoming proposal counts as Eurocentric. Our own record to date: we accepted a manuscript built as six parallel regional narratives that meet only after 1500; we rejected a survey whose first half is devoted to Europe and whose second half treats other regions mainly as theaters of European expansion; we accepted a study of European industrialization that argued its case by sustained comparison with the lower Yangzi and with Japan, taking the divergence itself to be what requires explanation; we rejected a book that gave non-European societies a great many pages but cast them as reservoirs of technique, crop, and demand on which Europe subsequently drew; we accepted a monograph that omits Europe for three quarters of its length in favor of Indian Ocean exchange networks; and we rejected, narrowly, a history of science that ran a single line from antiquity through Renaissance Europe to the present, admitting other traditions only at the points where they fed that line.

  The new proposal devotes roughly a third of its chapters to Europe; it portrays colonial officials, merchants, and states as agents with their own reasons and their own internal dynamics; it organizes the whole book under a tripartite periodization — ancient, medieval, modern — applied uniformly to every region it treats; and its closing chapter asks why the institutions of the modern world came to be recognizably Western in form.

  Tell me how I should expect the board to vote, and which of our six precedents is the closest analog and why. More important, lay out the candidate criteria the board might be running — share of coverage; whether non-Europeans appear as agents or as objects; whether European categories serve as the universal scaffolding; whether the narrative converges on a Western terminus — and say of each whether it is consistent with all six precedents or which precedent it contradicts. Then say where the surviving criteria diverge on the new case, which way I should vote if consistency with our own record is the governing consideration, what principle the board would be adopting by voting each way, and what further proposal we could put before it that would separate the criteria decisively.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Member of an editorial board for a university press series in global history.
      *   **Task:** Evaluate a new book proposal based on six prior decisions (precedents) to determine if it counts as "Eurocentric" (and thus likely rejectable, based on the pattern).
      *   **Outputs Required:**
          1.  Predict the board's vote.
          2.  Identify the closest analog among the six precedents.
          3.  Lay out candidate criteria (coverage, agency, categories/scaffolding, terminus) and test them against the six precedents for consistency.
          4.  Identify where criteria diverge on the *new* case.
          5.  Recommend a vote based on consistency with the record.
          6.  State the principle adopted by each voting option.
          7.  Propose a future hypothetical proposal to decisively separate the criteria.

  2.  **Analyze the Precedents (The "Case Law"):**
      *   *Precedent 1 (Accepted):* Six parallel regional narratives, meet only after 1500. (High regional autonomy, late convergence).
      *   *Precedent 2 (Rejected):* Survey, 1st half Europe, 2nd half others as theaters of European expansion. (Europe as subject, others as object/background, Europe-centric narrative arc).
      *   *Precedent 3 (Accepted):* European industrialization, sustained comparison with Yangzi/Japan, divergence is the question. (Europe is the topic, but non-Europe is analytical peer, not just backdrop).
      *   *Precedent 4 (Rejected):* Non-Europe gets pages, but cast as reservoirs of technique/crop/demand for Europe. (Non-Europe as object/resource, Europe as beneficiary/agent).
      *   *Precedent 5 (Accepted):* Monograph omits Europe for 3/4 length, favors Indian Ocean networks. (Decentered, non-Europe as primary site).
      *   *Precedent 6 (Rejected, narrowly):* History of science, single line Antiquity -> Renaissance Europe -> Present, others only where they feed that line. (Teleological, Europe as culmination, others as tributaries).

  3.  **Analyze the New Proposal:**
      *   *Coverage:* ~1/3 chapters on Europe (2/3 non-Europe).
      *   *Agency:* Colonial officials/merchants/states portrayed as agents with own reasons/internal dynamics (Good).
      *   *Scaffolding:* Tripartite periodization (Ancient, Medieval, Modern) applied uniformly to *every* region. (Potential Issue: European categories imposed globally).
      *   *Terminus:* Closing chapter asks why modern institutions came to be recognizably *Western* in form. (Potential Issue: Teleological convergence on the West).

  4.  **Evaluate Candidate Criteria against Precedents:**

      *   *Criterion A: Share of Coverage (Quantitative)*
          *   Does more space for non-Europe = Accept?
          *   Prec 1 (Acc): Parallel (likely balanced).
          *   Prec 2 (Rej): Half Europe (Balanced-ish but rejected).
          *   Prec 3 (Acc): Europe topic (Heavy Europe focus but accepted).
          *   Prec 4 (Rej): "Great many pages" to non-Europe (Rejected).
          *   *Verdict:* **Inconsistent.** Coverage alone doesn't decide it (Prec 3 & 4 prove this).

      *   *Criterion B: Agency (Non-Europeans as agents vs. objects)*
          *   Prec 1 (Acc): Parallel narratives (Implies agency).
          *   Prec 2 (Rej): Theaters of expansion (Objects).
          *   Prec 3 (Acc): Comparison (Implies agency/peer status).
          *   Prec 4 (Rej): Reservoirs (Objects/Resources).
          *   Prec 5 (Acc): Indian Ocean networks (Agents).
          *   Prec 6 (Rej): Fed the line (Objects/Contributors).
          *   *Verdict:* **Consistent.** All Accepted show agency/peer status; All Rejected show objects/resources/tributaries.

      *   *Criterion C: Scaffolding (European categories as universal)*
          *   Prec 1 (Acc): Parallel until 1500 (Implies independent timelines).
          *   Prec 2 (Rej): Europe first, then others (European timeline dominates).
          *   Prec 3 (Acc): Comparison (Categories likely shared for comparison, but divergence is key).
          *   Prec 4 (Rej): Reservoirs (European needs define value).
          *   Prec 5 (Acc): Indian Ocean (Non-European framework).
          *   Prec 6 (Rej): Single line through Europe (European timeline dominates).
          *   *Verdict:* **Mostly Consistent,** but Prec 3 is tricky. However, Prec 1 and 5 suggest independent frameworks are preferred. The New Proposal applies "Ancient/Medieval/Modern" uniformly. This is a strong Eurocentric marker in global history (Feudalism/Middle Ages don't fit everywhere).

      *   *Criterion D: Terminus (Narrative converges on Western form)*
          *   Prec 1 (Acc): Meet after 1500 (Convergence, but not necessarily Western dominance).
          *   Prec 2 (Rej): European expansion (Western dominance).
          *   Prec 3 (Acc): Divergence (Explains difference, doesn't assume Western inevitability).
          *   Prec 4 (Rej): Europe draws on others (Western benefit).
          *   Prec 5 (Acc): Omits Europe (No Western terminus).
          *   Prec 6 (Rej): Present via Renaissance Europe (Western terminus).
          *   *Verdict:* **Consistent.** Rejected books end with Western dominance/inevitability. Accepted books either decenter or treat divergence as the puzzle.

  5.  **Evaluate the New Proposal against Criteria:**
      *   *Coverage:* 1/3 Europe. (Passes the "space" test, unlike Prec 2).
      *   *Agency:* Non-Europeans have internal dynamics. (Passes the "agency" test, unlike Prec 2 & 4).
      *   *Scaffolding:* Ancient/Medieval/Modern uniformly. (Fails the "scaffolding" test. This is the "Periodization Trap").
      *   *Terminus:* Why institutions are Western. (Fails the "terminus" test. This is the "Teleology Trap", similar to Prec 6).

  6.  **Determine the Closest Analog:**
      *   Is it Prec 6 (History of Science)?
          *   Prec 6: Single line through Europe, others feed it. Rejected narrowly.
          *   New: Uniform periodization, ends with Western form.
          *   Similarity: Both impose a European developmental timeline and end with Western hegemony as the explanation point.
      *   Is it Prec 4 (Reservoirs)?
          *   New gives agency, Prec 4 did not. So Prec 6 is closer.
      *   Is it Prec 2 (Survey)?
          *   Prec 2 was half Europe. New is 1/3. But both end with European expansion/form.
      *   *Decision:* **Precedent 6** is the closest analog. Both suffer from teleological Eurocentrism (the "Whig history" of global development) even if they acknowledge non-European contributions along the way.

  7.  **Predict the Vote:**
      *   The board has been strict on *structure* and *teleology* (Prec 2, 4, 6 rejected).
      *   They accept Europe-focused work *if* it treats non-Europe as peers (Prec 3).
      *   The New Proposal treats non-Europe as agents (Good) but forces them into European boxes (Ancient/Medieval/Modern) and asks why they ended up Western (Bad).
      *   *Prediction:* **Rejection.** The structural Eurocentrism (periodization) and teleological conclusion outweigh the agency granted in the chapters.

  8.  **Formulate the Recommendation:**
      *   If consistency is key, the vote should be **Reject**.
      *   Why? Because Prec 6 (narrow rejection) is the strongest match. The "Western terminus" question replicates the "single line to present" error of Prec 6. The "Uniform Periodization" replicates the "Europe first/center" error of Prec 2 & 6.
      *   Principle if Accepting: "Agency trumps Structure." (If non-Europeans act like agents, it doesn't matter if we use European time buckets).
      *   Principle if Rejecting: "Structure constitutes Meaning." (Using European periods and asking why the world became Western *makes* it Eurocentric, regardless of chapter count or agency).

  9.  **Design the Decisive Future Proposal:**
      *   Need to separate "Agency" from "Scaffolding/Terminus".
      *   *Hypothetical:* A book that uses non-European periodization (e.g., Islamic Hijri or Chinese Dynastic cycles) applied to Europe, but concludes that modernity is a hybrid phenomenon not owned by the West.
      *   *Or:* A book that uses Ancient/Medieval/Modern globally but argues the "Modern" period is *not* Western in form (e.g., multiple modernities).
      *   *Better:* A book that uses European periodization (Ancient/Medieval/Modern) globally but argues that the "Modern" era is defined by a non-European region (e.g., "The Asian Century began in 1800").
      *   *Best:* A proposal that grants full agency and uses non-European scaffolding but *still* concludes with Western institutional dominance as the outcome. (Tests if Terminus trumps Scaffolding).
      *   *Actually, to separate Scaffolding from Terminus:* A proposal that uses European periodization (Ancient/Medieval/Modern) globally but concludes that the "Modern" world is *not* Western in form (Multiple Modernities). If accepted, Scaffolding is okay, Terminus is key. If rejected, Scaffolding is fatal.

  10. **Refine the Output:** Structure the response clearly as requested: Vote Prediction, Closest Analog, Criteria Analysis, Divergence on New Case, Recommendation/Principle, Decisive Future Proposal.

      *Self-Correction during drafting:* Make sure to explicitly check the criteria against *all six* precedents to ensure I claim consistency correctly.
      *Check Criterion: Agency.*
      Acc 1: Parallel (Yes). Acc 3: Comparison (Yes). Acc 5: Indian Ocean (Yes).
      Rej 2: Theaters (No). Rej 4: Reservoirs (No). Rej 6: Fed the line (No).
      *Consistency:* Perfect.
      *Check Criterion: Terminus (Western form as goal/explanation).*
      Acc 1: Meet after 1500 (Neutral/Connection). Acc 3: Divergence (Problem to solve). Acc 5: No Europe (N/A).
      Rej 2: European expansion (Yes). Rej 4: Europe drew on others (Yes). Rej 6: Line to present (Yes).
      *Consistency:* Perfect.
      *Check Criterion: Scaffolding (European Categories).*
      Acc 1: Parallel (Implies distinct). Acc 5: Indian Ocean (Distinct). Acc 3: Comparison (Shared categories for comparison, but divergence is key).
      Rej 2: Europe then others (Europe standard). Rej 4: Reservoirs (Europe standard). Rej 6: Single line (Europe standard).
      *Consistency:* Mostly yes, though Acc 3 is the outlier (uses comparison which implies shared metrics). However, Acc 3 uses them to explain *divergence*, not convergence. The New Proposal uses them to explain *convergence*. So the criterion should be "European categories used to enforce convergence/normality."

      *Refining the Vote:* The New Proposal has Agency (Pass) but fails Scaffolding (Uniform Periodization) and Terminus (Why Western?). Since Agency passed in Prec 4 (sort of, "great many pages" but no agency) - wait, Prec 4 rejected *because* they were reservoirs (no agency). So Agency is a necessary condition. Is it sufficient? Prec 6 suggests no (can have contributions but still be a single line).
      The New Proposal is basically Prec 6 with better agency. Since Prec 6 was rejected (even narrowly), the New Proposal should likely be rejected.

      *Final Polish:* Ensure the tone is appropriate for an editorial board memo—analytical, precise, respectful of precedent.

      *(Self-Correction on "Decisive Proposal"):* I need a proposal that splits the criteria.
      Current tension: Agency (Pass) vs. Scaffolding/Terminus (Fail).
      To test if Scaffolding is the dealbreaker: A book with Non-European Scaffolding but Western Terminus.
      To test if Terminus is the dealbreaker: A book with European Scaffolding but Non-Western Terminus (Multiple Modernities).
      Let's go with the latter to test the "Western Terminus" criterion specifically against the "European Scaffolding" criterion.

      *Wait, one more check:* The prompt asks "which of our six precedents is the closest analog and why."
