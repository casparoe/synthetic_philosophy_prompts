      This is the closest. Both impose a singular developmental timeline culminating in the West. The New Proposal is slightly more generous (1/3 Europe, agency), but structurally identical in teleology.

      *Wait, check Prec 3:* European industrialization, comparison with Yangzi/Japan. Divergence is the question.
