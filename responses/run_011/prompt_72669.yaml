answer: |-
  Here is a complete design for your 50-minute session. It is built to be run by a peer, not a professor, and it prioritizes getting data on the board quickly so you can spend the majority of the time on the philosophy.

  ### 1. Incentive Structure: What Works and What Wrecks It

  You asked which payout method preserves the incentive structure.

  *   **The Method That Wrecks It:** Giving everyone a candy bar or participation point just for showing up.
      *   *Why:* This turns the activity into a survey. If there is no cost to being "wrong," students will answer based on what they think sounds smart, what they think *you* want to hear, or purely on aesthetic preference. It removes the "decision" from "decision theory."
  *   **The Method That Preserves It:** The **Random Payout Lottery**.
      *   *How:* Tell them at the very start: *"At the end of the session, I will draw one name from the roster. That person's choices today will be played out for real. If their bets win, they get a $20 gift card (or substantial prize). If they lose, they get nothing."*
      *   *Why:* This makes every student a maximizer of their own expected utility. Even though the chance of being picked is low (1 in 20), the structure of the choice remains identical to a high-stakes decision. It preserves incentive compatibility.
      *   *Caveat:* Low stakes can sometimes reduce anxiety, which might lower ambiguity aversion slightly compared to life-altering money, but for a classroom demo, it is the only method that is theoretically sound.

  ### 2. Materials and Setup

  *   **Two Urns (or opaque bags/boxes):**
      *   **Urn K (Control):** Clearly labeled. Contains 20 balls (10 Red, 10 Black). *Crucial:* Count these out visibly on the table before the session starts so everyone sees the 50/50 ratio.
      *   **Urn A (Ambiguous):** Clearly labeled. Contains 90 balls. 30 are Red. 60 are a mix of Black and Yellow. *Crucial:* The ratio of Black to Yellow is unknown to the participants.
  *   **Choice Cards:** 20 Index cards. Pre-printed or written clearly on the board for them to copy.
  *   **Whiteboard:** For tallying results live.
  *   **Timer:** To keep yourself honest.

  ### 3. The "Source Distrust" Variation (And What to Cut)

  You hypothesized that ambiguity aversion is actually distrust of the source. To test this, you wanted three conditions: (1) You filled it, (2) Randomizer filled it, (3) Insider member filled it.

  **My Advice:** **Cut Condition 3 (The Insider Member).**
  *   **Why:** In a 50-minute session with 20 people, recruiting a confederate, briefing them secretly, ensuring they don't leak information via body language, and managing the "sworn to secrecy" theater will eat 15 minutes of logistics. It introduces too much noise.
  *   **What You Lose:** You lose the ability to distinguish between "distrust of the facilitator" and "distrust of *any* human agent."
  *   **What You Keep:** By splitting the room between **Condition 1 (You filled it)** and **Condition 2 (Randomizer filled it)**, you still test the core hypothesis: Does removing the human agent reduce the aversion? If aversion drops in the Randomizer group, your hypothesis is supported. If it stays the same, it's pure ambiguity aversion.

  **Implementation:**
  As students enter, hand them a slip of paper marked "A" or "B" (50/50 split).
  *   **Group A:** Told *you* composed Urn A this morning.
  *   **Group B:** Told a *computerized randomizer* determined the Black/Yellow split just now.
  *   *Note:* In reality, you prepared Urn A the same way for both groups. The *story* is the variable.

  ### 4. The Activity Flow (50 Minutes)

  #### Minute 0–5: Setup and Incentives
  1.  **Incentives:** Explain the Random Payout Lottery immediately. Put the prize on the table.
  2.  **The Urns:** Place Urn K and Urn A on the table.
  3.  **The Story:**
      *   Point to Urn K: *"I counted these. 10 Red, 10 Black. Exact odds."*
      *   Point to Urn A: *"90 balls. 30 are Red. 60 are Black or Yellow. I do not know the split of Black vs. Yellow."*
      *   **Deliver the Variation:** Tell Group A: *"I mixed these myself."* Tell Group B: *"A machine randomized the mix."*
  4.  **Commitment:** Hand out index cards. Tell them: *"Write your name, your Group (A/B), and your choices below. Do not talk to your neighbors. Once I collect these, we reveal the logic."*

