  #### Minute 15–45: The Debrief (Conceptual Mapping)
  Do not start with "This is the Ellsberg Paradox." Start with the board.

  1.  **The Contradiction:** Point to the Ambiguity tallies.
      *   "Most of you preferred Red over Black in Question 2. That implies you believe P(Red) > P(Black)."
      *   "Most of you preferred Black/Yellow over Red/Yellow in Question 3. That implies P(Black/Yellow) > P(Red/Yellow)."
      *   "But we know P(Red) is exactly 30/90. And P(Black/Yellow) is exactly 60/90."
      *   "If P(Red) > P(Black), then P(Red) + P(Yellow) *must* be greater than P(Black) + P(Yellow). But you chose the opposite."
      *   "Mathematically, your choices imply P(Black) is both less than 1/3 and greater than 1/3."

  2.  **Mapping to Theory:**
      *   **Single Probability Function:** Explain that Savage's Sure-Thing Principle assumes you have one number in your head for "Probability of Black." The data shows you *don't*. You have a range, or a hesitation.
      *   **Maxmin Expected Utility:** "Some of you acted as if the 'worst case' was true. In Q2, the worst case for Black is that there are zero Black balls. The worst case for Red is fixed at 30. So you picked Red. In Q3, the worst case for Black/Yellow is 60. The worst case for Red/Yellow is 30. So you picked Black/Yellow. You weren't maximizing average gain; you were maximizing the *minimum* possible gain."
      *   **Imprecise Probabilities:** "Instead of saying P(Black) = 0.33, your belief looks like P(Black) = [0, 0.66]. Standard decision theory doesn't know how to calculate with intervals. These new models do."
      *   **Higher-Order Probability:** "You might say, 'I think the probability is 1/3, but I'm not confident.' That's a probability of a probability. Does that help? Not really. If you average out your confidence, you still get a single number (1/3), which leads back to the contradiction. The problem isn't confidence; it's that the uncertainty *cannot be reduced to a number*."

  3.  **Addressing Your Hypothesis (The Source):**
      *   Look at the split between Group A (You) and Group B (Machine).
      *   If Group A shows strong aversion and Group B shows less: "The data suggests you weren't afraid of the *unknown*; you were afraid of *me*. You thought I might have rigged it."
      *   If both groups show strong aversion: "The distrust is irrelevant. The human mind genuinely treats 'unknown odds' differently than 'known odds,' even when no one is cheating."

  #### Minute 45–50: Troubleshooting and Pushback
  Be ready for these three objections. Here are your lines:

  1.  **"I know it's just 1/3, so I'm indifferent." (The Law of Indifference)**
      *   *Your Line:* "If you were truly indifferent, you would have circled options randomly. But the group tally isn't random. It's skewed. If you personally felt indifferent, you are in the minority. The paradox is about the aggregate behavior violating the math, not your personal intuition."
  2.  **"I saw the trap and tried to confuse you." (Demand Characteristics)**
      *   *Your Line:* "That's possible. But remember the payout. If you tried to outsmart me by picking the 'wrong' answer, you lowered your own expected value if you were the random winner. Did you really sacrifice a 5% chance at $20 just to make a point? Or did you pick what felt safer?"
  3.  **"I just randomize my choices."**
      *   *Your Line:* "If you randomize, you're treating the ambiguous urn as if it has a precise probability. But if everyone randomizes, the tally should be 50/50. It isn't. The fact that the room moves together suggests a shared intuition, not individual noise."

  ### 5. Honest Limitations: What This Activity Can't Reproduce

  You need to close the session by managing expectations. This activity is a demo, not a proof.

  1.  **The Stakes Problem:** Even with the lottery, $20 is not life-changing. Real ambiguity aversion often spikes when the stakes involve ruin or significant loss. A candy-bar-level decision might not trigger the same heuristic defenses as a retirement fund decision.
  2.  **The "Game" Frame:** Students in a philosophy club know they are in a "thinking puzzle" context. They are looking for the trick. In the real world, ambiguity aversion happens when people *don't* realize they're in a decision theory problem (e.g., buying insurance, investing). You are measuring their *reflective* reasoning, not their *intuitive* System 1 processing.
  3.  **Social Proof:** Because you tally on the whiteboard, later students (if you run multiple rounds) or even students glancing at neighbors might conform. The "Commitment" phase must be strictly silent and private.
  4.  **Epistemic Depth:** A paper urn on a library table is transparently artificial. Real ambiguity (e.g., "Will this new technology succeed?") carries weight because of background knowledge. Here, the "unknown" is trivial. You have to supply the *philosophical weight* in the debrief. The urn shows the *structure* of the violation; you must supply the *significance* of it.

