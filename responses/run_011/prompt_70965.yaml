  *   **Rule 2: The Companion Institution Match.**
      *   *Formulation:* A transplant requires the pre-existence of specific domestic institutions that perform complementary functions (e.g., Labor Market package requires Sector-Level Collective Bargaining >60%).
      *   *Status:* **Necessary Condition.** Precedents 3 and 4 isolate this variable. Both profiles had High Trust/Agency/Admin. Precedent 3 (Low Coverage) failed; Precedent 4 (High Coverage) passed.
      *   *Sufficiency Test:* If applied as sufficient, a country with High Coverage but Low Admin (not yet tested) would pass. The record does not license this; Admin may still be a baseline requirement.
      *   *Resistant Precedents:* None. This rule explains the split between 3 and 4 perfectly.

  *   **Rule 3: The Agency-Over-Trust Priority for State Services.**
      *   *Formulation:* For institutions delivered by public professionals (Schools, Allowances), Confidence in Public Agencies is the primary predictor of viability; Stranger-Trust is secondary or irrelevant.
      *   *Status:* **Necessary Condition (for Schools).** Precedent 5 (School -> C) supports this. C had High Stranger-Trust but Low Agency Confidence and was Rejected.
      *   *Sufficiency Test:* If applied as sufficient, Profile F (High Agency, Low Trust) should be Approved. However, Precedent 1 (Allowance -> B) suggests Low Trust *combined* with Low Agency causes failure. It is unclear if High Agency can overcome Low Trust in a "no inspection" model.
      *   *Resistant Precedents:* Precedent 1 (Allowance -> B) suggests Low Trust is fatal when combined with Low Agency, but does not prove Low Trust is fatal when Agency is High.

  *   **Rule 4: The Homogeneity/Scale Threshold.**
      *   *Formulation:* Transplants fail in populations >40 million or with significant linguistic heterogeneity.
      *   *Status:* **Correlate, not Rule.** Precedent 1 (B, 85m, Het) failed. Precedent 5 (C, 45m, Het) failed. Precedents 2, 3, 4 (A & E, <10m, Homo) passed or were competitive.
      *   *Sufficiency Test:* If applied as sufficient, Profile F (12m, Homo) should pass. However, Precedent 3 (A, 6m, Homo) failed. Scale/Homogeneity is not sufficient.
      *   *Resistant Precedents:* Precedent 3 (Labor -> A) resists this strongly (Small/Homo but Rejected).

  *   **Rule 5: The "10-Year Viability" Political Sustainability Rule.**
      *   *Formulation:* A transplant is rejected if the recipient population's social norms (Trust) are likely to generate political pressure to alter the design (e.g., demand inspections) within 10 years.
      *   *Status:* **Inferred Necessary Condition.** Precedent 5 (School -> C) failed despite High Stranger-Trust, likely due to Low Agency (State couldn't guarantee quality). Precedent 1 failed due to Low Trust/Agency (Fraud risk).
      *   *Sufficiency Test:* If applied as sufficient, any High Trust/High Agency profile passes. Precedent 3 (Labor -> A) resists this (High Trust/Agency but Rejected due to Coverage).
      *   *Resistant Precedents:* Precedent 3.

  **Summary of Resistance:** Precedent 3 (Labor -> A) is the most resistant case. It defeats any rule that claims High Trust, High Agency, or Small Scale is sufficient. It forces the reconstruction toward a **Specific Dependency Rule**: *Each institution requires its specific fuel (Allowance=Admin; Labor=Unions; Schools=Agency+Trust).*

  2. **Prediction for Profile F**

  *   **Verdict:** **Rejected.**
  *   **Predicted Margin:** **4–3** (similar to Precedent 5).
  *   **Confidence:** **Moderate.**
  *   **Driving Rules:**
      *   **Rule 3 (Agency-Over-Trust):** This rule cuts toward *Approval*. F has High Agency Confidence (unlike C), which was the apparent dealbreaker in Precedent 5.
      *   **Rule 5 (Political Sustainability):** This rule cuts toward *Rejection*. The School Governance model removes inspections and testing. In a profile with **Stranger-Trust in the bottom band** (F), parents are unlikely to tolerate a "no inspection" regime for more than 10 years, even if they trust the agencies. They do not trust the *teachers* (strangers).
      *   **Silent Rules:** Rule 1 (Admin Capacity) is satisfied but silent on the trust issue. Rule 2 (Companion Institutions) is silent unless we classify "Parental Trust" as a companion institution. Rule 4 (Scale) cuts toward approval but is weak.
  *   **Rationale:** The panel's mandate is viability *as designed*. The design includes "no routine inspection." In a Low Stranger-Trust society, this design is politically unstable. The High Agency Confidence ensures the state *could* enforce the rules, but the Low Trust ensures the citizens *won't accept* the lack of verification. Precedent 5 showed High Trust cannot save Low Agency; Precedent F shows High Agency cannot save Low Trust in this specific institutional context.

  3. **Closest Analog and Feature Differences**

  *   **Closest Analog:** **Precedent 5 (School Governance -> C).**
  *   **Feature Differences:**
      1.  **Confidence in Public Agencies:** C (Low) vs. F (High).
          *   *Direction:* Cuts toward **Approval** for F. (F has the state capacity C lacked).
      2.  **Stranger-Trust:** C (High) vs. F (Bottom Band).
          *   *Direction:* Cuts toward **Rejection** for F. (F lacks the social capital C possessed).
      3.  **Homogeneity:** C (Heterogeneous) vs. F (Homogeneous).
          *   *Direction:* Cuts toward **Approval** for F.
      4.  **Population Scale:** C (45m) vs. F (12m).
          *   *Direction:* Cuts toward **Approval** for F.
      5.  **Current Teacher Recruitment:** C (Unspecified) vs. F (Bachelor + Exam).
          *   *Direction:* **Neutral/Assumption.** The proposal is to transplant the Nordic model (Grad degree). F's current lower bar is a baseline, not a constraint, assuming the transplant includes the recruitment change.
      6.  **School Funding:** C (Unspecified) vs. F (Voucher/Competition).
          *   *Direction:* Cuts toward **Rejection** for F. The Nordic model devolves budgets and removes competition. F's existing market culture may clash with the "no test/no choice" design, creating friction not present in C.

  4. **Underdetermination and Principles**

  *   **Underdetermination:** Yes, the record **genuinely underdetermines** the verdict.
      *   Precedent 5 proves that **High Trust + Low Agency = Failure**.
      *   It does *not* prove that **Low Trust + High Agency = Failure**.
      *   It is logically possible that State Agency is the only hard constraint for Schools, and Trust is merely helpful. If so, F should pass.
      *   It is equally possible that both are necessary constraints. If so, F should fail.
  *   **Principle Adopted by Ruling:**
      *   **If Approved:** The panel commits to the principle that Trust is a **Flow**. It asserts that strong institutions (High Agency) can *generate* the necessary social trust within the 10-year window. It treats the institution as a trust-building engine.
      *   **If Rejected:** The panel commits to the principle that Trust is a **Stock**. It asserts that the specific social capital required for the institution to function *as designed* (without inspections) must exist at T=0. It treats the institution as a trust-consuming engine.
      *   Given the "10-year" terms of reference, a Rejection aligns more conservatively with the mandate (avoiding designs that require cultural change to survive).

  5. **The Sunset Condition (Item 4)**

  *   **Reading:** The sunset condition attached to Precedent 4 (Labor -> E) is evidence of **Politics**, not the core Rule.
  *   **Reasoning:** Profile E met all apparent necessary conditions (High Trust, High Agency, High Coverage, Small Scale). A rule-based rejection was impossible. The 6–1 vote indicates a single dissenter who likely doubted the 10-year viability despite the perfect fit. The sunset clause was the price of the 6th vote to secure a majority.
  *   **Implication:** It signals that even when all *observable* prerequisites are met, the panel acknowledges residual uncertainty. It does not change the rule for F, because F does not meet the observable prerequisites (Low Trust).

  6. **Most Important Precedent**

  *   **Precedent:** **Precedent 5 (School Governance -> C).**
  *   **Reasoning:** It is the only prior ruling on the *same institution* currently under review. It establishes the baseline risk profile for the School Governance model.
  *   **Counterfactual:** If Precedent 5 had been **Approved**:
      *   It would imply that **Agency Confidence is not necessary** for the School model (since C lacked it).
      *   If Agency is not necessary, then F's High Agency is a bonus, and the Low Trust becomes the only variable.
      *   If C (Low Agency, High Trust) passed, it would suggest Trust is the primary driver.
      *   In that scenario, F (High Agency, Low Trust) would be a much riskier candidate, likely leading to a **5–2 Rejection** (swapping the vote of Precedent 5).
      *   *Correction:* If 5 passed, it means Trust can substitute for Agency. F has Agency but no Trust. If Trust is the "fuel," F fails. If Agency is the "fuel," F passes. If 5 passed, it proves Trust is sufficient. It leaves open whether Agency is sufficient.
      *   *Revised Counterfactual:* If Precedent 5 had been Approved, it would suggest the School model is robust to Low Agency. My prediction for F would shift to **Approved (5–2)**, reasoning that High Agency in F compensates for the Low Trust that C didn't even need. The fact that 5 was *Rejected* is what makes Agency look necessary, which F has, but it leaves the Trust question open.
      *   *Actually:* The fact that 5 was *Rejected* makes Agency look necessary. F has Agency. So F looks better than C. But F lacks Trust. If 5 had passed, it would mean Agency doesn't matter. Then F's Agency doesn't help. F's Low Trust would be the only negative. Since we don't know if Trust matters (C had High Trust), we would be flying blind.
      *   *Best Answer:* Precedent 5 is the anchor. Because it failed, we know **Low Agency is fatal**. Because F has High Agency, F clears the hurdle that killed C. The prediction rests entirely on whether Low Trust is *also* fatal.

  7. **Next Proposal to Separate Rules**

  *   **Proposal:** Transplant the **Nordic School-Governance Model** into **Profile E**.
  *   **Reasoning:**
      *   We currently have:
          *   C (High Trust, Low Agency) -> Reject.
          *   F (Low Trust, High Agency) -> Pending Prediction.
      *   We lack a **Control Case**: **High Trust, High Agency**.
      *   Profile E has High Trust, High Agency, High Coverage, Small Scale.
      *   **If E (High/High) is Approved:** It confirms that both Trust and Agency are required (since C failed on Agency, and we predict F fails on Trust).
      *   **If E (High/High) is Rejected:** It suggests the School Model is non-transplantable regardless of profile, or requires a variable not yet measured (e.g., specific teacher culture).
      *   **Why E and not A?** E has Sector-Level Collective Bargaining (75%). While less relevant for Schools than Labor, E is the "Perfect Match" profile established in Precedent 4. Using E isolates the School variable against the most favorable background conditions. If the model fails in E, the model itself is the problem. If it passes in E, we confirm the "High Trust + High Agency" rule, allowing us to definitively rule on F (Reject) based on the missing Trust variable.
