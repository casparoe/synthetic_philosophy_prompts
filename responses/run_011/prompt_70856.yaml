      *   *Agreement:* The user is right. If the only reason to finish a PhD is "I'm the kind of person who finishes," that's circular or identity-based. But the roommate's argument tries to wipe out *normative* force, not just evidential force.
      *   *Strategy:* Acknowledge the evidence point but show it's distinct from the normative point. The argument fails because it conflates *causal history* with *normative status*.

