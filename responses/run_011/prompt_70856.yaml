      *   *Resolution:* The distinction lies in **Causal vs. Normative**. Sunk costs are causally inert. Promises are normatively active.
      *   Step (4) assumes all past facts are causally inert in the same way. But promises aren't reasons *because they are past*; they are reasons because they create a *present* obligation. The *making* was in the past, the *obligation* is now.
