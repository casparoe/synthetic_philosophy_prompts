      *   **Recommendation:** Abandon (5). It misdescribes promises/vows as inert facts. They are active constraints.
      *   **Cost of Abandoning (5):** You must accept that some past events create present normative forces. This doesn't hurt (3) because spending money doesn't create normative force, only making a promise does.
