answer: |-
  The argument is **invalid**. It looks valid because it relies on an equivocation in Step (4) and a category error in Step (5).

  You are right to hate both horns. The dilemma is false because it conflates **causal history** (what resources you have burned) with **normative status** (what obligations you hold).

  Here is the diagnosis, the break point, and the cost of fixing it.

  ### The Break Point: Step (5)

  Step (5) claims: *"Lots of past facts don't change what happens next either: a promise you made... a vow... eight years ground away..."*

  This is the lie. It treats a **spent dollar**, a **made promise**, and **elapsed time** as ontologically identical "past facts." They are not.

  *   **Sunk Costs (Money/Time):** These are *resources*. Once spent, they are gone. They have no causal power and, crucially, they generate no *normative* power. Owning a receipt for a bad movie does not obligate you to watch the sequel.
  *   **Commitments (Promises/Vows):** These are *speech acts* or *normative events*. The act of promising is in the past, but the **obligation** exists in the present. A promise is not a "fact that happened"; it is a "status that persists."

  Step (5) asserts that a promise to a dead person changes nothing "from here on out." This depends entirely on what you mean by "changes."
  *   **Causally:** Perhaps it changes nothing material (no one is watching).
  *   **Normatively:** It changes everything. It changes the *moral valence* of your options. Breaking the promise makes you an oath-breaker; keeping it makes you an oath-keeper.

  If your roommate argues that "moral valence" doesn't count as "what happens next," then **Step (1)** is the break point. Step (1) defines rationality as purely consequentialist regarding *material* outcomes. If you accept (1) in that narrow sense, your roommate is right: promise-keeping is irrational if no one knows.

  But you don't have to accept that narrow definition.

  ### Why It Looked Fine Going In
  The argument smuggles in a materialist definition of "reasons." It assumes that for a past fact to be a reason, it must exert *causal leverage* on the future (e.g., "If I don't finish, the 8 years were wasted" → "If I finish, I get a degree").
  *   **Sunk Cost Fallacy:** "I spent 8 years, so I must finish." (False: The 8 years are gone regardless.)
  *   **Promise Keeping:** "I promised, so I must finish." (True: The promise creates a current duty.)

  The roommate's argument works only if you assume the *only* reason to keep a promise is to avoid the *waste* of the promise-making act. But that's not why we keep promises. We keep them because the act created a **debt**, not because it created a **cost**.

  ### Which Premise to Abandon?

  You said you'd rather keep (3) (*already-paid costs are never reasons*) than swallow (6) (*rational agent owes nothing to her past*). **Good.** Keep (3). It is the bedrock of rational decision theory.

  To save (3) and kill (6), you must **abandon (5)**.

  **Why abandon (5)?**
  Because (5) falsely equates *inert history* with *active obligation*.
  *   **Spending money** is inert history.
  *   **Making a promise** is creating a normative tool that exists in the present.

  **What you lose by abandoning (5):**
  You lose the ability to treat all past events as morally/rationally equivalent. You must accept that **some** past events (commitments, contracts, vows) generate present reasons, while **others** (spending, losing, suffering) do not.

  This requires a slightly more sophisticated ontology than pure physicalism. You have to admit that "obligations" are real things that exist in the present, generated by the past, distinct from "physical resources."

  ### Does This Hit Ordinary Decision Theory?
  No. Standard Decision Theory (SDT) actually agrees with this fix.
  *   **SDT on Sunk Costs:** Agrees with (3). Past costs are not in the utility function.
  *   **SDT on Promises:** SDT handles promises by including "integrity" or "compliance with duty" in the utility function *of the present moment*.
      *   If you keep a secret promise to a dead person, SDT says you do it because *you* value being a person who keeps promises. The utility is in the *act*, not the *consequence*.
      *   The roommate's error is assuming that if the *external* consequences are null, the *internal* consequences (integrity) must also be null or irrational.

  ### The "Evidence" Trap (Your Warning)
  You suspected your roommate would say: *"Eight years tells me something about how hard this is, and about who I've become."*
  You are right to suspect this isn't the whole answer.
  *   **The Evidence Argument:** "I've spent 8 years, so I know the terrain." → This is a valid reason to continue, but it is **not** a sunk cost reason. It is a *forward-looking* reason based on information gained.
  *   **The Sunk Cost Argument:** "I've spent 8 years, so I *must* continue to make it worth it." → This is the fallacy.

  The roommate's argument tries to collapse the "Evidence" reason into the "Sunk Cost" reason. By abandoning (5), you separate them.
  *   **Past Time as Evidence:** Valid reason (Step 1 compliant).
  *   **Past Time as Debt:** Invalid reason (Step 3 compliant).
  *   **Past Promise as Duty:** Valid reason (Step 5 rejected).

  ### Summary for Your Roommate
  Tell him this:
  1.  **Step (3) is correct.** Sunk costs (resources gone) are never reasons.
  2.  **Step (6) is incorrect.** But not because sunk costs matter.
  3.  **Step (5) is the error.** A promise is not a "sunk cost." It is a "standing obligation."
  4.  **The Distinction:** Spending money changes your *budget* (a state). Making a promise changes your *normative landscape* (a relation).
  5.  **The Result:** You can be a rational agent who ignores sunk costs (3) but honors past commitments (not-6), because commitments are not costs. They are current duties generated by past acts.

  If he insists that "normative landscape" is just "feelings" and therefore subjective:
  Ask him if he thinks signing a contract yesterday creates a reason to pay today. If yes, he admits past facts create present reasons. If no, he is an anarchist. If he says "Contracts are different because of law," ask why a personal vow is different. If he says "It isn't," he accepts that (5) is false.

  **Verdict:** Break Step (5). Keep (3). Sleep better.
