      *   Step (2) is technically true for sunk *costs* (money/time gone), but Step (5) equivocates. A promise isn't just a "past fact"; it's a *reason-generating event*.
      *   *Better Attack:* Step (1) is too narrow if interpreted as "only material consequences matter." But even within standard decision theory, Step (4)/(5) fails because promises create *new* future payoffs (integrity, social trust, self-conception) or are deontological constraints.
      *   *Best Attack:* Step (7). It assumes the *reason* for keeping a promise is the *past fact itself*. But usually, the reason is the *future value of being a promise-keeper* or the *intrinsic value of the act*.
      *   *Wait, the user wants to keep (3).* If we keep (3), we must break the link between (3) and (6). How? By showing that promises/vows are *not* sunk costs.
      *   *Why?* Because a promise creates an *obligation* that persists into the future. A sunk cost is a *loss* that is finalized.
      *   *Actually, the strongest philosophical break is at (4) and (5).* The argument treats "past facts" as ontologically identical. They aren't. A spent dollar is gone. A made promise is a standing normative fact.

  4.  **Evaluate the "Evidence" Counter-Argument (User's Warning):**
      *   Roommate will say: "Eight years tells me about difficulty/character."
