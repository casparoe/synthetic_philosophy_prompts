      *   (8) Dilemma: Either promise-keeping is irrational OR sunk cost honoring is rational.

  3.  **Identify the Weak Link:**
      *   The argument relies on equating *Sunk Costs* with *Normative Commitments* (promises, vows, projects).
      *   Step (4) is the sleight of hand. It claims "nothing in (1) cares what *sort* of past fact we're talking about."
      *   *Correction:* While (1) says value depends on *outcomes*, it doesn't say *all outcomes are material/consequentialist in a narrow sense*.
