answer: |-
  **Case 1**
  At 2:00 PM, the CEO stands before the assembled workforce in the main hall and speaks the following words, directed grammatically and intentionally at the absent COO: "I hereby dismiss you, [COO Name], from your post, effective immediately." The COO is two days into a two-week off-grid trek and cannot be reached. Following the utterance, the staff immediately revoke the COO's building access, halt payroll, appoint an interim, and notify the board. The COO returns fourteen days later to find her credentials dead and her office occupied.

  **Case 2**
  At 2:00 PM, the CEO sits alone with the COO in a soundproof office and speaks the following words, directed grammatically and intentionally at the COO: "I hereby dismiss you, [COO Name], from your post, effective immediately." The COO hears the words, understands them, accepts them, and shakes the CEO's hand before clearing her desk that evening. No record is made, the board is not told, payroll continues, and building access remains active. When the COO arrives the next morning, staff greet her as incumbent, unaware of any change, and she resumes her duties without correction.

  **Fixed and Varied Features**
  *   **Fixed:** The speaker (CEO), the grammatical addressee (COO), the locutionary content ("I hereby dismiss you..."), the time, the speaker's authority, the speaker's sincerity and intention, the legal/bylaw silence on effective timing, and the absence of deception.
  *   **Varied:** The locus of uptake. In Case 1, the institutional audience (staff/board) secures uptake and acts, while the grammatical addressee (COO) does not. In Case 2, the grammatical addressee (COO) secures uptake and acts, while the institutional audience does not.

  ***

  **Analysis Through Three Accounts**

  **1. The Convention-First Austinian Account**
  *   **Theory:** An illocutionary act is successful if the speaker invokes the correct procedure, possesses the requisite authority, and executes the formula completely. Uptake is a consequential effect, not a constitutive condition.
  *   **Verdict:** **Success in Both Cases.**
  *   **Reasoning:** The CEO holds the authority and utters the correct formula in the appropriate circumstances. Since the procedure is defined by the speaker's execution rather than the hearer's reception, the act is complete the moment the words leave the CEO's lips in both scenarios. The divergence in aftermath (access revoked vs. access retained) is a matter of *perlocutionary* consequence or administrative follow-through, not the status of the illocutionary act itself.

  **2. The Addressee Uptake Account**
  *   **Theory:** An illocutionary act is constitutively dependent on the specific addressee recognizing the speaker's intention. Without the addressee's understanding, the act misfires.
  *   **Verdict:** **Success in Case 2; Failure in Case 1.**
  *   **Reasoning:** In Case 2, the COO hears, understands, and accepts the dismissal; the interpersonal circuit is closed. In Case 1, the COO is off-grid. Because the intended hearer cannot recognize the intention, the act fails to achieve illocutionary force. The staff's reaction is treated as a misunderstanding or a unilateral administrative change, not a valid response to a completed speech act.

  **3. The Ledger View (Public Record)**
  *   **Theory:** Institutional speech acts function to update the shared social reality. The act is complete only when the change in status is registered in the public record or recognized by the relevant community.
  *   **Verdict:** **Success in Case 1; Failure in Case 2.**
  *   **Reasoning:** In Case 1, the company's public reality is updated: access is cut, payroll stops, the board knows. The "ledger" reflects the new status. In Case 2, the change remains private. Since the social reality (access, payroll, staff recognition) remains unchanged, the dismissal has not effectively entered the ledger. It is a private agreement or resignation, not an institutional dismissal.

  **Discrimination Power**
  This pair cleanly discriminates between the **Addressee Uptake Account** and the **Ledger View**, as they deliver opposite verdicts on the two cases. However, it leaves the **Convention-First Austinian Account** largely untested. Because the Convention Account can define "correct procedure" either as "speaking the words" (predicting Success/Success) or "securing notification" (predicting Success/Failure), it is flexible enough to absorb either outcome without structural strain. To test it, you would need a case where the CEO follows the procedure perfectly but lacks authority, or has authority but uses the wrong words, to see if uptake can rescue the act.

  ***

  **Objection: The Addressee Shift**
  *Objection:* "In Case 1, the CEO is addressing the staff, not the COO. You cannot address an absent, off-grid person. Therefore, the addressee shifts to the staff, and Case 1 is just a different speech act (an announcement) rather than a dismissal."
  *Response:* The objection collapses if we stipulate the grammatical form is explicitly vocative and directed *in absentia*, akin to a verdict pronounced against a fugitive. The CEO says, "I dismiss *you*, [Name]," not "I am telling *you all* that [Name] is dismissed." The staff are witnesses, not addressees. If the theory holds that one cannot address the absent, then the Addressee Uptake Account must declare Case 1 impossible *by definition*, which confirms its verdict (Failure) without needing to shift the addressee. The pair holds because the *intended* addressee is fixed by the speaker's intention and grammatical structure, even if physical presence varies.

  ***

  **Audit**
  *   **The Working Feature:** The divergence between *interpersonal recognition* (COO knowing) and *institutional registration* (Company acting).
  *   **Sensitivity Test:**
      *   *Case 1 Modification:* If the COO finds out on Day 1 (via satellite phone), does the dismissal become valid then? The Addressee Account says yes (retroactively or upon receipt). The Ledger Account says it was already valid; the COO's knowledge is irrelevant.
      *   *Case 2 Modification:* If the CEO emails HR one hour later, does it become valid? The Ledger Account says yes (ledger updated). The Addressee Account says it was already valid; the email is mere record-keeping.
  *   **The Counter-Attack:** A defender of the **Addressee Uptake Account** would attack the construction by arguing that Case 1 describes a *threat* or a *declaration of intent*, not a dismissal. They would claim that "dismissal" is inherently a relational status; if the COO doesn't know, she isn't dismissed, she is merely *being* dismissed. They would argue the staff's actions in Case 1 are a breach of contract (firing someone who doesn't know) rather than the execution of a speech act.

  ***

  **Commitment**
  Case 1 describes a real dismissal; Case 2 describes a private misunderstanding or a resignation in all but name. In an institutional context, a change in status that changes nothing in the public record is ontologically inert. If the payroll runs and the keys work, the COO is not dismissed, regardless of what was said in the soundproof room.

  I bet on the **Ledger View**. Speech acts in corporate settings are not merely interpersonal transactions; they are mechanisms for updating the social database. The Addressee Account works for promises or apologies, but fails for verdicts and appointments where the third-party recognition constitutes the reality. The Convention-First Account is too vague to be useful here; it merely pushes the question back to "what is the convention?" (and the convention *is* the uptake requirement).

  Your setup is slightly rigged in favor of the Ledger View because you chose a corporate firing, which is inherently bureaucratic. If you swapped this for a marriage proposal ("I ask you to marry me"), the Addressee View would crush the Ledger View (a public announcement without the partner's knowledge is not a proposal). The pairing isolates *institutional* acts specifically, not illocution in general. If you want to test illocution broadly, you need a second pair involving a non-institutional act (like a promise or a warning) to see if the Ledger View overgeneralizes. As it stands, this handout proves that institutional facts require public registration, but it doesn't prove that *all* illocutionary acts do.
