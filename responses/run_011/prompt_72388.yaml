answer: |-
  You have stumbled onto the exact fractures that keep decision theorists and epistemologists up at night. Your intuitions are sophisticated, but they pull from three different normative frameworks: **Probability Theory** (coherence), **Decision Theory** (utility/risk), and **Epistemology** (truth-tracking).

  There is no single, standard "Dutch Book" theorem that validates all seven verdicts. Standard Dutch Book arguments assume logical omniscience, linear utility, and that *any* proposition is bettable. To match your intuitions, we need a hybrid principle.

  Here is the **Principle of Bounded, Resolute, Epistemic Agency**, constructed clause by clause to match your cases.

  ### The Principle

  **Clause 1: Synchronic Coherence**
  *At any single moment $t$, your betting quotients for mutually exclusive and exhaustive outcomes must sum to 1.*
  *   **Forced by Case 1.** If you accept the bundle simultaneously, you violate the axioms of probability. This is the core Dutch Book argument.
  *   **Verdict:** You are incoherent if you accept the bundle.

  **Clause 2: Dynamic Resoluteness**
  *When evaluating a current bet, you must condition on your predicted future actions. If you know you will accept a sequence of bets that guarantees a loss, you must refuse the first bet in the sequence.*
  *   **Forced by Case 2.** This clause bites hard here. Your intuition ("feels less bad") is a description of *myopic* decision-making, but this clause prescribes *strategic* decision-making. To avoid the sure loss in Case 2, you must treat the sequence as a bundle *before* it starts.
  *   **Verdict:** If you take the first bet knowing the rest will follow, you are dynamically inconsistent. This clause tells you your gut in Case 2 is wrong, even if it feels right.

  **Clause 3: Epistemic Admissibility**
  *Bets are only admissible if the payout condition is a fact about the world (or your actions) that is not causally determined by the bet's influence on your doxastic state alone.*
  *   **Forced by Case 3 vs. Case 4.** In Case 4 (Lunch), the payout depends on a physical action/habit. In Case 3 (Belief), the payout depends on a mental state that *ought* to track truth. A bet that pays on belief incentivizes decoupling belief from truth. This violates the normative link between belief and evidence.
  *   **Verdict:** Case 3 is "cheating" because it commodifies belief. Case 4 is fine because it commodifies behavior.

  **Clause 4: Concave Utility**
  *Maximize Expected Utility, not Expected Monetary Value. Utility functions for wealth are typically concave (diminishing marginal returns) and loss-averse.*
  *   **Forced by Case 5 vs. Case 6.** In Case 5, the stakes are low enough that utility is approximately linear. In Case 6, the risk of ruin dominates the positive expected value.
  *   **Verdict:** Refusing Case 6 is rational risk aversion, not probability incoherence.

  **Clause 5: Computational Boundedness**
  *Coherence is only required over propositions you can actually evaluate. You are not penalized for uncertainty regarding logical truths you cannot compute.*
  *   **Forced by Case 7.** Standard Bayesianism assumes logical omniscience (you should know the arithmetic statement is true/false). Humans are not logically omniscient.
  *   **Verdict:** Refusing the bet is rational boundedness.

  ---

  ### The Test Case: Paid Belief Change

  **Scenario:** A bookie offers 1000:1 against a proposition $P$. Simultaneously, a hypnotist offers to make you believe $P$ for $500.
  **Application:**
  *   **Clause 3 (Epistemic Admissibility)** triggers immediately. This is the extreme version of Case 3.
  *   **Analysis:** If you take the bet and the hypnosis, you guarantee a win financially, but you have severed the connection between your belief and reality. You have turned your mind into a payout switch.
  *   **Verdict:** The principle says **Refuse**. While financially profitable, it violates the norm of *Epistemic Integrity*. Betting norms are justified *because* we assume beliefs aim at truth. If you allow beliefs to be bought, the Dutch Book argument loses its normative force (it becomes just a money pump, not a proof of irrationality).

  ---

  ### The Hard Truths: Where Your Verdicts Break

  You asked me to be straight about which verdicts this principle cannot keep. Here is the friction:

  **1. Case 2 is a Failure, Not a Feature**
  You said of the sequential Dutch Book: *"Somehow this feels much less bad."*
  **The Truth:** It *is* just as bad. Clause 2 (Dynamic Resoluteness) declares this behavior irrational. If you know you are susceptible to a sequential Dutch Book, your refusal to sign the contract today implies you *should* refuse the first bet tomorrow. If you take the first bet, you are suffering from **akrasia** (weakness of will) or **myopia**. No consistent normative principle can validate taking a bet you know will lead to a sure loss just because the loss arrives in installments. Your gut is forgiving you for a mistake; the principle corrects it.

  **2. Case 3 Requires an Extra-Pragmatic Norm**
  You said of the Belief Bet: *"I think it's cheating."*
  **The Truth:** Pure Decision Theory disagrees with you. In standard causal decision theory, "My Belief State" is just a state of the world like "Rain." If you can control your belief (or predict it), betting on it is no different than betting on your lunch.
  To validate your intuition, I had to add **Clause 3 (Epistemic Admissibility)**. This is not a rule of *money*; it is a rule of *epistemology*. It says betting is a tool for testing truth-tracking, not just transferring cash. If you view betting purely as a financial game, Case 3 is permissible (provided you can control your belief). If you view it as a test of rationality, it is forbidden. You cannot have it both ways without importing an external value (truth).

  **3. Case 7 Breaks the Dutch Book Theorem**
  You said of the Arithmetic Bet: *"I don't feel incoherent, just finite."*
  **The Truth:** You are right, but this admits that **Dutch Book arguments do not apply to humans as we are.** The Dutch Book theorem proves that *if* you are logically omniscient, *then* incoherent odds guarantee a loss. By invoking boundedness (Clause 5), you are opting out of the theorem's preconditions. You are safe from the charge of "incoherence," but only by admitting you aren't the kind of ideal agent the theory describes.

  ### Summary
  Your intuitions are more robust than standard theory because they implicitly include **risk aversion**, **bounded rationality**, and **epistemic norms**.
  *   **Cases 1, 5, 6, 7** are handled by standard Decision Theory + Boundedness.
  *   **Case 2** reveals a dynamic inconsistency you should try to fix (pre-commitment).
  *   **Cases 3 & 4** reveal that you view belief as having a "direction of fit" (mind-to-world) that lunch does not.

  The principle that saves you is not "Avoid Sure Loss." It is **"Maximize Expected Utility subject to Epistemic Integrity and Computational Bounds."** Under that principle, you are right in 1, 3, 4, 5, 6, 7. You are only wrong in 2, where your gut is forgiving a strategic error.
