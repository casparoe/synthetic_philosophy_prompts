answer: |-
  Here is the metaphysical mapping of the July Crisis through David Lewis's framework, structured according to your requirements.

  ### 1. The Lewisian Analysis
  We begin with the later formulation. Causation is the **ancestral of counterfactual dependence** between distinct events. Event $c$ causes event $e$ if and only if there is a chain of stepwise counterfactual dependences leading from $c$ to $e$. That is, $e$ depends on $d_n$, $d_n$ depends on $d_{n-1}$, ..., $d_1$ depends on $c$.

  Dependence is defined via counterfactual implication: $e$ depends on $c$ iff if $c$ had not occurred, $e$ would not have occurred. The truth of this counterfactual is determined by the **similarity ordering** of possible worlds. To evaluate "If $c$ had not occurred...", we look at the closest possible world where $c$ does not occur.

  The ordering of closeness is lexical:
  1.  Avoid big, widespread violations of law (miracles).
  2.  Maximize the spatio-temporal region of perfect match of particular fact.
  3.  Avoid even small, local violations of law.
  4.  (Approximate match of particular fact is negligible).

  Consequently, the closest world where Princip does not fire is not a world where the laws of physics differ, nor a world where history diverges months prior. It is a world identical to ours up until moments before the car stalls on the corner, where a **small local miracle** (a neural misfire, a sudden stumble, a jammed trigger) prevents the shot, after which the laws of nature run deterministically forward from that divergence point.

  ### 2. The Dependence Test: July 1914
  Let $c$ be the assassination (June 28) and $e$ be the General European War (August 4). We ask: In the closest world where $\sim c$ (no shot), does $\sim e$ (no war) obtain?

  Here, the historiographical split maps directly onto the **weighting of the similarity ordering**, specifically the second criterion (match of particular fact).

  *   **Camp 1 (Preventive War/Berlin's Plan):** This view holds that German leadership had settled on war and required only a pretext. In evaluating the closest $\sim c$ world, this camp insists on holding fixed the **mental states and intentions** of the German Chancellor and General Staff. To maximize match on these particular facts (intentions), the closest $\sim c$ world is one where Berlin manufactures a different pretext in July or August. Thus, $e$ occurs even if $\sim c$. Counterfactual dependence fails.
  *   **Camp 2 (Mechanistic/Structural):** This view holds that no one wanted war, but the system forced it. Here, the "match of particular fact" prioritizes the **structural constraints** (alliance treaties, mobilization timetables). If these are held fixed, the system is a powder keg requiring a spark. If $\sim c$, does another spark ($c^*$) inevitably occur? If the structural tension is high enough, the closest $\sim c$ world contains a different incident (a border skirmish, a diplomatic insult) within a short timeframe that triggers the same machinery. Again, $e$ occurs. Dependence fails.

  However, if one weights the similarity ordering to prioritize the **absence of the specific cascade** (holding fixed the Serbian acceptance of the ultimatum, for instance), then the closest $\sim c$ world is one where the July Crisis de-escalates. Here, $\sim c \boxright \sim e$. Dependence holds.

  The disagreement between the camps is not primarily about the particular facts of our world (both agree on the timeline), but about **which facts must be preserved** in the counterfactual world to count it as "close." Camp 1 weights internal political intentions heavily; Camp 2 weights systemic rigidity heavily. A pacifist historian weights the possibility of de-escalation heavily. Lewis's semantics does not adjudicate this weighting; it merely formalizes the consequence of the choice.

  ### 3. Trigger vs. Timing: The Fragility of Events
  Suppose we grant Camp 2: War comes anyway, perhaps in 1915 over a Balkan border dispute. Was the assassination a cause of *the war*?

  Lewis treats events as fragile. "The War of August 1914" is a distinct event from "The War of 1915." They have different essences (different times, different participants, different casus belli).
  *   If $e$ is defined as **General War simpliciter** (an abstract type), then $c$ is not a cause, because $e$ does not depend on $c$ (it happens anyway).
  *   If $e$ is defined as **The Specific Outbreak in August 1914**, then $c$ is a cause. In the closest $\sim c$ world, the war happens later or differently. Thus, the specific event $e$ depends on $c$.

  Is this a defect? It correctly demotes the trigger regarding the *necessity* of conflict but promotes it regarding the *specificity* of the conflict. It captures the intuition that Princip caused *this* war, even if he didn't cause *war simpliciter*. This is not an absurdity; it is a feature of event individuation. However, it risks triviality: if every detail makes an event distinct, then every antecedent condition is a cause of the specific outcome. Lewis accepts this; the historian may not.

  ### 4. Causal Structure: Preemption and the Category Mismatch
  You suggest the alliance system forms a preempting backup. Let us classify this.
  *   **Early Preemption:** $c$ causes $e$. Backup process $b$ is ready to cause $e$ but is cut off by $c$ before $b$ completes.
  *   **Late Preemption:** $c$ causes $e$. Backup process $b$ also runs to completion, but $c$ gets there slightly faster.
  *   **Symmetric Overdetermination:** $c$ and $b$ both cause $e$ independently.

  July 1914 fits none cleanly. The "backup" (structural tension) is not a discrete process that gets cut off. It is a **standing condition**. It does not "fire"; it persists. If $\sim c$, the condition remains and generates a new trigger $c^*$.
  *   If we treat the structural tension as a cause $S$, we have **Overdetermination**: $c$ and $S$ (plus some future $c^*$) suffice for $e$.
  *   If we treat the structural tension as a background condition, we have **Preemption**: $c$ preempts $c^*$.

  **The Chain Strategy and Quasi-Dependence:**
  Lewis's solution to preemption is the chain of dependences. Shot $\to$ Death $\to$ Ultimatum $\to$ War. Even if War would have happened anyway, the *actual* chain depends on the Shot.
  *   *Difficulty:* This works for neurons. For history, the links are not discrete events but **omissions** or **non-events**. The "cause" of the war is often the *failure* to halt mobilization. Lewis struggles with causation by omission.
  *   *Structural Causes:* "The Alliance System" does not name an event. It names a set of dispositions. To fit Lewis, we must recast structural claims as claims about the absence of intervening events (e.g., "The absence of a diplomatic intervention that would have arrested the machinery"). This is a **category mismatch**. The theory requires events; history provides structures. We can force the fit by treating "signing of the treaty" as the event, but the causal power lies in the *existence* of the treaty (a state), not the *signing* (an event). Lewis's ontology cannot easily accommodate standing conditions as causal relata without distorting the historical description.

  ### 5. Modal Realism: Does Plenitude Help?
  You ask if the concrete ontology of Modal Realism does work that abstractionism would not.
  **Verdict:** No.
  Plenitude guarantees that there exists a concrete world where Serbia accepts the ultimatum, and a concrete world where they refuse. It ensures the domain of quantification is rich enough. However, it does **not** settle which world is **closest**.
  Closeness is determined by the weighting of the similarity criteria (Laws vs. Match). Whether the worlds are concrete or abstract sets of propositions, the *metric* remains vague and context-sensitive.
  *   Historians trade in these worlds constantly ("Imagine a world where...").
  *   Modal Realism adds ontological weight but no semantic precision. It does not tell us whether a world where Berlin backs down is "closer" than a world where Berlin persists. That depends on pragmatic factors (what the historian is trying to explain), which Lewis acknowledges are shifting. Concrete worlds buy nothing here; they merely populate the options. The vagueness of "closeness" remains exactly where it was.

  ### 6. The Historian's Objection
  Your friend argues this is a category mistake: historians track explanatory relevance, not counterfactual dependence.
  **The Best Lewisian Reply:** "Explanatory relevance" is cashed out in counterfactuals. To say $c$ explains $e$ is to say $c$ made a difference to $e$. If you deny the counterfactual "If $c$ hadn't happened, $e$ wouldn't have," you are admitting $c$ was irrelevant to the occurrence of $e$. Historians rely on implicit counterfactuals to distinguish causes from mere background conditions. Lewis makes the implicit explicit.
  **The Honest Assessment:** Your friend is partially right. Historians often care about **sufficiency** (was this part of a sufficient set?) rather than **necessity** (was this the sine qua non?). Lewis's theory is binary: cause or not. History is gradient: salient factor, contributing factor, deep cause, trigger. Lewis forces a binary verdict on a gradient reality. When backups exist (preemption), Lewis says the backup is *not* a cause (because no dependence). But historians rightly call the alliance system a "cause." Lewis captures the *trigger* but misses the *context* that gave the trigger power.

  ### 7. Specific Counterfactuals: Where the Analysis Delivers
  The framework issues verdicts only relative to the similarity weighting.
  *   **Serbian Acceptance:** If we hold fixed German intent (Camp 1), the closest world where Serbia accepts is one where Austria rejects the acceptance anyway. War ensues. Verdict: Acceptance would not have prevented war.
  *   **Russian Mobilization:** If we hold fixed the Schlieffen Plan (which required attacking France via Belgium if Russia mobilized), the closest world where Russia waits is one where Germany finds another pretext to activate the plan. Verdict: Mobilization was not the sole cause.
  *   **Cautious Chancellor:** If we allow a "small miracle" in Bethmann-Hollweg's psychology, does war stop? This depends on whether we hold the *system* fixed or the *outcome* fixed.

  **Sensitivity:** The analysis is unusable for settling these disputes because the verdict flips based on which facts are prioritized in the similarity ordering. If you prioritize "Peace," the closest world is peaceful. If you prioritize "German Aggression," the closest world is war. The theory is silent on which priority is correct. It maps the logic of the dispute but cannot resolve it.

  ### 8. Final Assessment
  Is July 1914 a confirmation, an anomaly, or an unanticipated case?

  It is a **case the framework never anticipated**, revealing a boundary where the theory runs out.
  *   **Confirmation:** It works for the discrete chain (Shot $\to$ Death $\to$ Ultimatum).
  *   **Anomaly:** It fails to capture the causal status of structural conditions (Alliances, Timetables) which are not events.
  *   **Where it runs out:** The theory runs out at the **individuation of events** and the **weighting of similarity**.
      1.  **Events:** Lewis requires dated, located occurrences. History deals with dispositions, structures, and absences. Recasting structures as events distorts the historical reality.
      2.  **Similarity:** The theory assumes a stable, context-independent weighting of similarity (Laws > Match). Historical counterfactuals require shifting weights (sometimes we hold intentions fixed, sometimes we hold outcomes fixed). Lewis's rigid ordering cannot accommodate the pragmatic flexibility historians need.

  **Conclusion:** The Lewisian map clarifies the *logic* of the historiographical debate (showing it is a debate about which facts to hold fixed in the closest world), but it cannot *solve* the debate. It correctly identifies the assassination as the cause of the *specific* outbreak, but it struggles to validate the historian's intuition that the "machinery" was equally causal. The framework treats the machinery as a background condition, not a cause, unless it can be atomized into events. In July 1914, the machinery *is* the cause, and the assassination is merely the release mechanism. Lewis's ontology privileges the release mechanism. For the historian, this is a feature of the metaphysics that fails to match the metaphysics of history.
