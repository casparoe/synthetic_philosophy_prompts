answer: |-
  You are not incoherent. Your friend is reacting to the fact that you are intuitively practicing **Critical Realism**, while the Ranke/Carr/White trio represents **Positivism**, **Relativism**, and **Constructivism** respectively. Your gut knows that history isn't just "what happened" (Ranke), isn't just "what I say about what happened" (Carr/White), but is a constraint-based negotiation between the two.

  Your **Hostile-Colleague Test (HCT)** is a robust heuristic for this. It is essentially a pragmatic definition of *intersubjective verifiability*. However, to handle your edge cases (Thucydides, Emplotment, and the Mill vs. Bourgeois puzzle), it needs three specific clauses to distinguish between *facts*, *causal mechanisms*, and *narrative frameworks*.

  Here is the repaired principle, followed by the mapping, the costs, the new cases, and the verdict on your book.

  ### The Principle: Invariance Under Motivational Bias (IUMB)

  A historical assertion is objective if and only if it satisfies all three of the following clauses:

  1.  **The Archive Constraint:** The assertion must be derivable from the available evidence without requiring the suppression or distortion of contradictory evidence within that archive.
  2.  **The Hostile-Concession Clause:** A competent historian, granted equal access to the archive and motivated to disprove the assertion, would be logically compelled by the evidence to accept it as the most parsimonious explanation.
  3.  **The Theory-Independence Clause:** The assertion must not rely on the acceptance of a contested meta-theoretical framework (e.g., Marxism, Modernization Theory) to be intelligible as true.

  ### Mapping Your Cases to the Clauses

  *   **1. Battle Death Toll:** Passes all three. The muster rolls are the archive; a hostile colleague cannot make the dead disappear (Clause 2); counting bodies requires no political theory (Clause 3).
  *   **2. Thucydides' Speeches:** **Fails Clause 1** regarding literal truth (he admits he composed them). **Passes Clause 2** regarding *strategic* truth (a hostile colleague would concede the speeches accurately reflect the strategic pressures Pericles faced). *Verdict:* Not objective fact, but objective *representation of situation*. Your intuition that it's "better than polemic" is preserved because it satisfies Clause 2 even if it fails Clause 1.
  *   **3. Germany 1914 War Aims:** Passes all three. The archive (minutes, memos) constrains the claim; a Fischer-skeptic is compelled by the documents (Clause 2); "war aims" is a descriptive category, not a meta-theory (Clause 3).
  *   **4. Bourgeois Revolution:** **Fails Clause 3.** To call it "bourgeois" requires accepting a specific theory of class and historical progression. A hostile colleague (e.g., a Revisionist or Culturalist) can accept all the *facts* of the Revolution but deny the label "bourgeois" without contradicting the evidence. It is a lens, not a finding.
  *   **5. Mill Closure (Imports vs. Management):** Passes all three. This solves your puzzle with Case 4. "Import competition" is a mechanistic cause measurable in freight data (Clause 3: Theory-Independent). Unlike "bourgeois," it doesn't require a theory of history, only a theory of supply and demand which is operationalized in the data. A hostile colleague (e.g., a union advocate wanting to blame management) would be compelled by the freight ledgers to concede the import pressure (Clause 2).
  *   **6. Minister's Motive:** Passes Clauses 1 & 2, *conditional* on evidence. If there are diaries or letters, a hostile colleague is compelled by the psychological evidence. If there are no internal documents, it fails Clause 1 (speculation). Your intuition that one is "careless" implies you believe the evidence exists to settle it.
  *   **7. Tragedy vs. Farce:** **Fails Clause 1 (Phenomenological Sub-clause).** If the archive contains evidence of suffering, dignity, or serious intent by the actors, emplotting the sequence as "Farce" requires suppressing that phenomenological evidence. A hostile colleague would point to the letters of the suffering actors and say, "You cannot call this a farce without ignoring their lived reality." Thus, the Farce version is less objective because it violates the *fit* between evidence and narrative tone.

  ### The Cost: Which Verdicts Must You Overturn?

  To keep this principle simple and avoid epicycles, you must concede one point: **Emplotment is never fully objective.**

  In Case 7 (Tragedy/Farce), you want to say the Farce version is "less objective." The IUMB principle says that if *zero factual disagreement* exists, the difference is rhetorical, not historical. However, if the Farce version *ignores the gravity* evidenced in the archive, it fails Clause 1.
  *   **The Overturn:** You must accept that if two historians truly agree on *all* facts (including the subjective experiences of the actors found in diaries/letters), the choice between Tragedy and Farce is **aesthetic**, not objective. If you insist one is "more true," you are smuggling in a moral claim, not a historical one. You have to let go of the idea that narrative form itself can be objective; only the *fit* between form and evidence can be tested.

  ### Running the Principle on Your Three New Cases

  **1. The Embellishing Witness (Oral History)**
  *   **Verdict:** Not Objective.
  *   **Reasoning:** Fails **Clause 1 (Archive Constraint).** The "archive" here includes the known unreliability of the witness. A hostile colleague is *not* compelled to concede the testimony; they are compelled to discount it. Objectivity here requires triangulation. If the oral history stands alone, it fails the test.

  **2. The Cliometric Regression (Specification Sensitivity)**
  *   **Verdict:** Not Objective.
  *   **Reasoning:** Fails **Clause 2 (Hostile-Concession).** If the conclusion reverses under an "equally defensible" specification, then a hostile colleague can simply choose the other specification and is *not* compelled to concede your conclusion. The result is dependent on methodological choice, not just evidence. It is a model output, not a historical fact.

  **3. Declared Politics vs. Claimed Neutrality**
  *   **Verdict:** The Declared Politic scores *better* on the test, but the test applies to the *work*, not the *author*.
  *   **Reasoning:** The IUMB tests the *assertion*, not the *historian*. However, a historian who declares their politics allows the hostile colleague to better account for bias when applying Clause 2. The historian claiming "none" is hiding their variables. If the work of the "neutral" historian contains hidden assumptions that a hostile colleague can expose, it fails Clause 2 more spectacularly. Transparency facilitates the Hostile-Colleague Test; opacity obstructs it.

  ### The Verdict on Your Mill Book

  You asked for a straight answer about your own work, specifically the parts you'd "fight to the death" over.

  Apply **Clause 3 (Theory-Independence)** and **Clause 2 (Hostile-Concession)** to your "fight list."

  1.  **The Freight Data & Memos:** This is objective. A hostile colleague (e.g., a former manager or a local partisan) looking at the freight ledgers and the consolidation memos *must* concede the economic mechanism. You win this.
  2.  **The "Fight to the Death" Parts:** These are almost certainly the **moral implications** and the **narrative arc** you've built around the data.
      *   If you argue the closure was a *"betrayal of the social contract,"* you fail Clause 3. "Social contract" is a meta-theoretical/moral framework. A hostile libertarian colleague would concede the facts but deny the "betrayal."
      *   If you argue the town *"never recovered its soul,"* you fail Clause 1. "Soul" is not in the archive.
      *   If you emplot the story as a *"Greek Tragedy of inevitable decline"* rather than a *"Farce of managerial incompetence,"* you are safe *only if* the evidence supports the "inevitability." If the memos show management *could* have saved the mill but chose not to, the "Tragedy" emplotment might actually violate the evidence (which suggests agency), making "Farce" (or "Crime") the more objective emplotment.

  **The Hard Truth:**
  Your Hostile-Colleague Test reveals that the parts of your book you are most emotionally invested in (the moral weight, the sense of loss, the "why it matters") are **not objective history** by your own definition. They are **historical argumentation** or **memorialization**.

  This does not make them worthless. Thucydides' speeches weren't "objective" either, but they were more valuable than a ledger. But you must stop calling them "objective." You are writing a hybrid: a forensic account of the closure (objective) wrapped in a eulogy for the town (subjective).

  **Advice for your Seminar:**
  Tell your students this: Objectivity isn't a state of being; it's a resistance to pressure. A claim is objective if it holds up when pushed by someone who wants it to break. Your mill book holds up on the *economics*, but you need to own the *eulogy* as your own voice, not disguise it as a finding from the freight records. That distinction is what separates the historian from the advocate, even when they are the same person.
