answer: |-
  You have isolated a fault line that runs through the philosophy of physics, the foundations of mathematics, and metaphysics. Your intuition is correct: the negative move conflates the map with the territory, while the positive move treats the map as a tool to be refined.

  Because you asked for the carving rather than a bibliography, I will set out the logical anatomy of these moves, identify the nearest existing concepts, explain where they fall short of your description, and propose precise terminology for the distinction you are drawing.

  ### 1. The Negative Move: From Indeterminacy to Impossibility

  **The Existing Concept:**
  In the literature on supertasks (infinite operations in finite time), this is known as **Thomson's Paradox** (after James Thomson, 1954). Thomson argued that because the state of the lamp at $t=1$ is not logically determined by the sequence of switchings for $t < 1$, the task is logically impossible.

  The philosophical counter-move you endorse is **Benacerraf's Critique** (Paul Benacerraf, 1962). Benacerraf argued that Thomson's description defines the state of the lamp for all $t < 1$, but simply *says nothing* about $t=1$. The lack of a logical consequence for $t=1$ does not entail a contradiction; it entails only that the description is incomplete.

  **The Diagnosis:**
  The negative move commits a category error. It infers **Ontological Impossibility** from **Descriptive Incompleteness**.
  *   *Premise:* The current rules $R$ do not determine state $S$ at limit $L$.
  *   *Hidden Assumption:* If $R$ does not determine $S$, then $S$ cannot exist (or the process leading to $L$ cannot occur).
  *   *Conclusion:* The process is impossible.

  **Why Existing Labels Fail:**
  "Thomson's Paradox" names the puzzle, not the inference. "Verificationism" is too broad (it concerns meaning, not existence). "Epistemic Fallacy" is close but imprecise.

  **Proposed Term:** **The Ontic Slide**.
  This term captures the illicit movement from an epistemic or semantic gap (we cannot deduce the state) to an ontic void (the state cannot exist).

  **Boundary Case:**
  The Ontic Slide is *not* committed when the indeterminacy implies a violation of a conservation law. If a machine outputs energy without input, the impossibility conclusion is ontological, not merely descriptive. The Slide occurs only when the sole objection is the *absence of a rule* for the limit point.

  ### 2. The Positive Move: From Incompleteness to Extension

  **The Existing Concept:**
  In mathematics, this is **Conservative Extension**. You add new axioms or definitions to a system such that no new theorems can be proven in the *original* language that weren't provable before.
  In physics, this is **Regularization** or **Renormalization**. You introduce a cutoff or a new parameter to handle divergences, then remove the cutoff in a way that leaves measurable predictions invariant.
  In philosophy of science, this aligns with the **Correspondence Principle** (Bohr). A new theory must reproduce the results of the old theory in the domain where the old theory was empirically successful.

  **The Diagnosis:**
  The positive move treats the theory as a **Partial Function**. The domain of the function is extended to include the limit point, subject to constraints that preserve the structure of the original domain.
  *   *Premise:* The current rules $R$ do not determine state $S$ at limit $L$.
  *   *Action:* Construct extended rules $R'$ such that $R'$ determines $S$, and $R'$ agrees with $R$ wherever $R$ was defined.
  *   *Conclusion:* The process is possible, provided we adopt $R'$.

  **Why Existing Labels Fail:**
  "Explication" (Carnap) is about clarifying concepts, not necessarily extending domains. "Idealization" suggests ignoring physical details, whereas you are adding structural details. "Conservative Extension" is the closest logical fit, but it is syntactic; you are asking about a physical/metaphysical repair.

  **Proposed Term:** **Structural Completion**.
  This emphasizes that you are completing the mathematical or causal structure of the description, not merely patching a hole. It implies the original structure *demanded* the extension (e.g., a Cauchy sequence demands a completion).

  ### 3. The Boundary: Legitimate Repair vs. Changing the Subject

  You asked what separates a legitimate repair from merely changing the subject. If I define the lamp to be "purple" at $t=1$, I have extended the description, but I have evaded the objection. To answer the objection, the extension must be **constrained**.

  There are three necessary conditions for a legitimate Structural Completion. If any are violated, you are changing the subject.

  **Condition A: The Recovery Constraint (Correspondence)**
  The extended rule must yield identical results to the original rule in the domain where the original rule was determinate.
  *   *Violation:* If your new summation method gives $1+2+3 = 6$ (standard) but also changes $1+1 = 3$, you have changed the subject.
  *   *In your case:* The machine must print the same digits at the same times as originally specified for all $t < 1$.

  **Condition B: The Uniqueness (or Naturalness) Constraint**
  There must be a principled reason to choose *this* extension over others. In mathematics, this is often **Analytic Continuation**: there is only one way to extend a function smoothly that preserves its differentiability.
  *   *Violation:* If you arbitrarily declare the lamp is "on" at $t=1$ without a physical mechanism (e.g., a spring that defaults to on), you are stipulating, not deriving.
  *   *In your case:* To legitimately fix the lamp's state, you must specify a physical property (e.g., the switch has a default position, or the circuit has a capacitance that decays). If the physics allows *either* state, then the state is physically indeterminate, but the *machine* is still possible.

  **Condition C: The Causal Continuity Constraint**
  The state at the limit must be reachable via a continuous physical trajectory, even if the logical description is discrete.
  *   *Violation:* Thomson's Lamp assumes the state *must* be determined by the logical sequence of switchings. But physical switches have mass and velocity. As the intervals shrink, the switch must move faster. Eventually, it violates relativity or material strength.
  *   *Legitimate Repair:* You acknowledge the supertask is an **Idealization**. The "repair" is to model the lamp as the limit of a sequence of physical lamps with finite switching speeds. If the limit of that sequence yields a definite state, the completion is legitimate. If the limit oscillates, the physical system is indeterminate, but not impossible.

  ### 4. Summary of the Carving

  Here is the terminology that best fits your analysis, distinguishing the valid moves from the invalid ones.

  | Move | Your Description | Existing Concept | Proposed Term | Validity Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **Negative** | Description fails $\rightarrow$ World impossible | Thomson's Inference | **The Ontic Slide** | Invalid. Confuses semantic gaps with ontological voids. |
  | **Positive** | Description fails $\rightarrow$ Extend Description | Conservative Extension / Regularization | **Structural Completion** | Valid *iff* it satisfies the Conservation Constraints. |
  | **Boundary** | Repair vs. Evasion | Ad hocery vs. Prediction | **The Conservation Constraint** | Requires Recovery, Uniqueness, and Causal Continuity. |

  ### 5. Application to Your Cases

  **Case 1: The Lamp**
  *   **The Ontic Slide:** Thomson claims the lamp cannot exist because logic doesn't dictate the state.
  *   **Structural Completion:** Benacerraf shows the description is incomplete. To complete it, we must add physics (e.g., switch mechanics).
  *   **The Boundary:** If we add mechanics, we find the switch cannot move infinitely fast. The supertask is physically impossible *for dynamical reasons*, not *logical reasons*. The Ontic Slide is the error of claiming it is logically impossible. The Structural Completion reveals it is physically idealized.

  **Case 2: The Digit Printer**
  *   **The Ontic Slide:** "The tape's content is undefined, so the machine is impossible."
  *   **Structural Completion:** "The tape's content is the limit of the sequence." If the sequence of digits converges (e.g., printing 3, 3.1, 3.14...), the tape reads $\pi$. If it oscillates, the tape is physically indeterminate at the limit.
  *   **The Boundary:** If the author says "Indeterminate tape = Impossible Machine," they commit the Ontic Slide. If they say "Indeterminate tape = We need a rule for the limit," they attempt Structural Completion.

  ### Final Recommendation

  You should characterize the negative move as **The Ontic Slide**. It is a specific instance of the **Mind-World Confusion**, but "Ontic Slide" captures the directional error (sliding from description to reality).

  You should characterize the positive move as **Structural Completion via Conservative Extension**.

  The criterion that separates this from changing the subject is **The Conservation Constraint**: *The extension must preserve the invariant structure of the original domain while minimizing discontinuity at the boundary.*

  If an author slides from "undefined" to "impossible," they are doing metaphysics badgered by logic. If they extend the rules to fix the undefined while preserving the prior results, they are doing physics (or mathematics) properly. Your instinct that the former is a referee's error and the latter is standard scientific practice is philosophically sound.
