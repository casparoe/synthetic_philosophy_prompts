          *   Boundary: **The Conservation Constraint**.

  6.  **Refining the "Carving" (Self-Correction during drafting):**
      *   *Correction:* Don't just say "Benacerraf." Explain *why* Benacerraf fits. Benacerraf argued that Thomson's description defines the lamp's state for $t < 1$, but says *nothing* about $t=1$. Therefore, logic doesn't dictate the state at $t=1$. Thomson concluded "contradiction/impossible." Benacerraf concluded "under-described."
      *   *Correction on Positive Move:* "Explication" is about concepts. "Regularization" is about math. The user is talking about *physical theory repair*. The closest philosophical concept is **Theory Extension** under the **Correspondence Principle**.
      *   *Boundary:* The danger is *ad hocery*. How to distinguish? The extension must be motivated by *symmetry* or *continuity*, not just to get the desired answer.
