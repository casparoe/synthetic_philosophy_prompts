          *   *Epistemic vs. Ontic Indeterminacy:* This is the core distinction.
          *   *The "Benacerraf-Wolf" Critique:* Paul Benacerraf (1962) famously argued against Thomson. Thomson said the lamp's state is logically contradictory/undefined. Benacerraf said the description simply *doesn't specify* the state at $t=1$, but that doesn't mean the lamp can't exist, just that the description is incomplete.
