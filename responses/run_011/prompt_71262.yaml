answer: |-
  The history of the frame problem is often told as a single narrative of AI growing pains, but a closer examination reveals a fracture. There are, in fact, two distinct problems hiding under the same label. The first is a technical puzzle regarding logical representation and change; the second is a deep architectural challenge regarding the nature of relevance and cognitive holism. Your working hunch is correct: these are not merely different degrees of the same difficulty, but categorically distinct challenges. The first has been substantially defused by formal innovations, while the second remains a live wire threatening the core of classical computationalism. However, the second problem is not the logical impossibility Fodor suggested. It is instead an architectural constraint that forces a specific evolution in how we conceive of computation itself.

  The original technical puzzle, articulated by McCarthy and Hayes, concerned the burden of axiomatization. In classical logic, stating that an action changes one property of the world does not imply that other properties remain unchanged. To guarantee persistence, one seemingly needed infinite "frame axioms" for every action-fluent pair. This was a crisis of efficiency and elegance. As you hypothesize, this problem was largely tamed by the development of nonmonotonic formalisms. Successor-state axioms, fluent occlusion, and circumscription allowed logicians to specify change without explicitly listing non-change. By assuming that things stay the same unless specified otherwise, these formalisms bypassed the combinatorial explosion. This was a victory for engineering and knowledge representation. It proved that a system could track state transitions without omniscience. But this solution operates entirely within the syntax of the system. It solves the problem of how to update a database, not how to know which database entries matter.

  This leads to the second problem, the one Fodor sharpened into a philosophical weapon. Fodor argued that cognitive processes are isotropic: in principle, any belief may bear on the confirmation of any other. If I hear a noise, it might be the wind, a burglar, or a symptom of a neurological disorder. Determining which hypothesis to test requires accessing a vast, potentially global web of beliefs. The threat here is not about updating state, but about search. If computation is local—operating only on the syntactic properties of symbols currently in the processor—how does it capture global relevance? If the system must survey all possible relevance relations to pick the right one, it faces a combinatorial explosion far worse than the original frame axioms. It faces a paralysis of analysis.

  Your proposal suggests a way out: treat relevance not as a logical property to be surveyed, but as a resource allocation problem. If a reasoner spends scarce computation on inferences with the highest expected epistemic value, it need not survey the whole landscape at once. It need only climb the gradient. This reframes holism from an impossibility result into a description of a value landscape. The system does not need to see the whole mountain; it only needs to know which way is up.

  However, this optimization defense invites a vicious regress. To calculate the expected epistemic value of a computation, the system must perform a computation. It must estimate the probability that a specific inference will yield useful results. But to make that estimate, it must already have accessed the very relevance relations it was trying to find. It needs to know that checking the window is valuable because of the belief about burglars, but accessing that belief was the very step the metareasoner was supposed to schedule. The guardian of the computation requires its own guardian. If we solve this by adding another layer of metareasoning to prioritize the first layer, we have not solved the frame problem; we have merely pushed it up a level. The system remains stuck in an internal loop of deciding what to decide.

  This regress suggests that the second frame problem is not merely a bug in inference budgeting, but a symptom of a deeper architectural flaw. The stronger claim you mention posits that nothing short of a non-representational, situationally embedded engagement escapes the regress. If the system is disembodied, sitting atop a static database of beliefs, relevance must be computed internally, inviting the regress. But if the system is embedded, the environment itself structures the relevance. The noise is not a symbol to be matched against a database of noise-sources; it is an affordance that solicits a specific orientation. The world, in a sense, does the indexing for the agent. In this view, relevance is not computed; it is enacted. The "value landscape" is not internal; it is constituted by the coupling of agent and environment.

  Does this indictment destroy computationalism? It depends on what one means by the term. If computationalism is defined as the manipulation of abstract, context-free symbols according to formal rules (the Classical Computational Theory of Mind), then Fodor's generalization is legitimate and fatal. A system that relies on internal survey to establish relevance cannot scale to human-like intelligence because it cannot break the regress without assuming the very knowledge it seeks.

  However, if computationalism is defined more broadly as the processing of information by a physical system, it survives, but only under strict conditions. The verdict is conditional: Computationalism is viable if and only if it abandons the model of the mind as a self-contained theorem prover and adopts an architecture where relevance is determined by predictive interaction rather than internal lookup.

  The second frame problem is not a proof that machines cannot think. It is a proof that machines cannot think if they are designed to think like Cartesian ghosts. The solution lies in architectures where the "expected epistemic value" is not calculated by a homunculus but is inherent in the predictive models the system uses to survive. In modern predictive processing, for example, the system minimizes surprise. Relevance is defined by prediction error. The system does not ask, "Which of my million beliefs is relevant to this noise?" It asks, "Which of my active models failed to predict this noise?" The search space is limited not by a metareasoner, but by the models currently driving action.

  Therefore, the frame problem is indeed two problems. The first was a logical hurdle, cleared by better axioms. The second is an architectural boundary, marking the limit of disembodied symbolism. Fodor was right to identify the crisis of isotropy, but wrong to conclude it indicts all computation. It indicts only the specific way of budgeting inference that assumes relevance is a static relation to be retrieved rather than a dynamic affordance to be enacted. The mind is not a library that must search its catalog; it is a tool that is already in hand. Computationalism survives, but only if it accepts that the frame is not something to be solved internally, but something to be lived through.
