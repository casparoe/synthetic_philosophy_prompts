prompt: |-
  I design schemas and run entity-resolution pipelines for a living — customer records, dedup, match scoring, all of it. No philosophy training and I don't want any; I want to use the vocabulary I already have and see what it can hold. I keep running into the identity of indiscernibles and Max Black's thought experiment about the two exactly similar spheres sitting alone in an otherwise empty universe, and I want it translated into my world before I decide whether I care about it.

  So restate the whole thing in the terms I actually use: natural keys versus surrogate keys, unique constraints, composite keys, primary-key assignment, match thresholds and merge scores, false merges versus false splits, referential integrity, sharding. Do it as faithfully as you can — what is the principle claiming in my language, what is Black's empty symmetric universe in my language, and what are the two usual responses to it (the one that says the spheres differ just by being numerically two, some built-in ID property, and the one that says the scenario is impossible or unintelligible)?

  Then give me the residue report, which is the part I actually want: what maps cleanly, what you had to bend out of shape to make fit, and what has no counterpart in my vocabulary at all. Be honest about it — don't quietly reinterpret the metaphysics in database assumptions and then call that a clean translation. If a claim only survives because you changed what it meant, say so out loud.

  Two things I want an answer on specifically. (1) My team's dedup rule is literally "if every field matches, it's the same customer, merge them" and my manager calls that a policy not a claim about the world — is that right, or is the rule a covert commitment to the identity of indiscernibles? (2) Since we assign surrogate keys precisely so that two otherwise identical records stay distinct, am I already a believer in that built-in ID property people appeal to, or is that a category mistake?

  Format: exactly five numbered items, a sentence or two each, no intro and no wrap-up. Roughly — the principle, Black's case, what maps clean, what got bent, what's missing — and fold the two questions in wherever they belong.
