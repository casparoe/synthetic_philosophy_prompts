      *   **Black's Case:** Two records with identical values in every column (including timestamp, source, checksum) existing as distinct rows in the same table without violating a unique constraint.
      *   **Response 1 (Surrogate Key):** Every row has an implicit or explicit system-generated ID (OID, rowid, surrogate key) that distinguishes them even if business data is identical.
      *   **Response 2 (Constraint/Schema):** The database schema forbids this via unique constraints on all columns; if all data matches, the DB rejects the second insert, making the "two records" scenario structurally impossible.

