prompt: |-
  Been reading LessWrong-and-adjacent stuff since the Overcoming Bias days, and I've finally let myself be talked into giving a talk at my local rationality meetup about moral revolutions — how norms like duelling and footbinding actually die rather than get argued to death. Prepping it, I've realised my own views here are a pile of commitments that I've never checked against each other, and I can't tell which ones are load-bearing. So I'd like an audit, not a lecture. Here's the package:

  (a) the mechanism is honour in Appiah's sense — duelling, footbinding, the Atlantic slave trade stopped when they became dishonourable, when carrying on with them cost you standing instead of earning it; argument and interest only get purchase after that flip, and the flip has to come from inside the honour world, from people whose own honour is on the line. (b) I buy Williams's version of the duelling case from that Tanner lecture of his named after the Sophocles play: the arguments against duelling had been around for centuries and did nothing, nobody was refuted, the practice just became impossible — and I also take on board the pessimistic half of that essay, that there's no neutral standpoint from which to say the new ethos grasps the moral truth better than the old one did. (c) for abolition specifically I lean interest-side: the West Indian sugar economy had stopped being the profit machine it was, and the humanitarianism rode in behind that. (Yes, that's the other Williams, I do keep them straight, mostly.) (d) moral psychology: Haidt-ish, reasoning is largely post-hoc, people don't update on syllogisms, they update on identity and sentiment and what their people are doing. (e) and yet I think careful written argument is the highest-leverage thing I personally can do — I think farmed-animal welfare and AI risk got onto the map becuase they were argued for, and my plan for the next year is a series of long argument-driven essays on moral progress; the escape route I reach for whenever someone presses me is that arguments work slowly, on the tone-setters, and change what's respectable to say, so they sit upstream of the honour flip rather than competing with it. (f) progress is real and directional: slavery ending and footbinding ending are improvements and not just a change of fashion, and I will fight relativists about this. (g) the reformers get credit — the abolitionists' petitions, the natural-foot societies, the newspapermen who made duellists look ridiculous were causally load-bearing, not decoration. (h) the change is fast and discontinuous: footbinding went inside roughly a generation and British duelling collapsed faster than any plausible sum of individual mind-changes, which I read as a tipping point, where once enough people defect the price of continuing jumps — so a coordination shift, not a persuasion cascade. (i) and two things I keep feeling are incoherent about myself but can't pin down: I think honour is a social construction with no normative authority whatsoever, nothing is really honourable, it's a status game, while also thinking it's among the most powerful causal forces in history; and I think shame is a bad motive for a decent person to act from, while also thinking shame is the only thing that has ever got large-scale moral change done.

  The test case I want to keep is the American civil rights movement, which I take to be the clearest moral revolution of the twentieth century and which I think worked because its leaders appealed to the American creed — holding the country to its own professed ideals. That's my evidence against (d) and for (e). I'd also like to be able to say we can deliberately build new honour codes around live issues, shame around things like reckless AI deployment say, even though the people doing the building (me and my friends, basically) don't inhabit any honour world at all and wouldn't be caught dead duelling.

  So: which of these genuinely pull against each other, which pairs only look bad and dissolve once you spell them out properly, and please rank the real tensions by severity instead of dumping them on me as equally awful. For each one, what's the cheapest revision and what does that revision cost me — and note I'm not telling you which I'd rather sacrifice, because I honestly don't know. Then tell me the single change that would clean up the most, and be blunt about whether the essay-writing project in (e) survives the rest of the list or whether it's just me rationalising my comparative advantage. No bibliography, no reading list, no suggested sources — I want the reasoning, not the references. And write it in British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time LessWrong/Overcoming Bias reader, rationalist meetup speaker, intellectually sophisticated, familiar with Appiah, Williams (both Bernard and Eric), Haidt, moral psychology, and historical cases (duelling, footbinding, slavery, civil rights).
      *   **Task:** Audit a specific package of commitments (a-i) regarding moral revolutions. Identify tensions/contradictions, rank them by severity, propose cheapest revisions + costs, identify the single most impactful change, and evaluate the viability of the user's essay-writing project (e).
      *   **Constraints:** No bibliography/reading list/sources. British English. Blunt assessment. Focus on reasoning.
      *   **Tone:** Analytical, direct, respectful of intelligence, "audit" style (not a lecture).

  2.  **Deconstruct the Commitments:**
      *   (a) Mechanism = Honour (Appiah). Change happens when practices become dishonourable. Must come from inside.
      *   (b) Williams (Bernard). Arguments didn't stop duelling; practice became impossible. No neutral standpoint for moral truth (pessimistic).
      *   (c) Abolition = Interest (Eric Williams). Profitability declined first; humanitarianism followed.
      *   (d) Moral Psychology = Haidt. Reasoning is post-hoc. Identity/sentiment drive updates, not syllogisms.
      *   (e) Personal Strategy = Argument. Written argument is high-leverage. Works slowly on tone-setters (upstream of honour flip).
      *   (f) Moral Realism = Progress is real/directional. Not just fashion. Anti-relativist.
      *   (g) Agency = Reformers matter. Petitions, societies, etc., were load-bearing.
      *   (h) Dynamics = Fast/Discontinuous. Tipping points/coordination shifts, not persuasion cascades.
      *   (i) Meta-Ethical Tension = Honour is fake/status game *but* powerful causal force. Shame is bad motive *but* necessary for change.
      *   **Test Case:** Civil Rights = Appeal to American Creed (supports (e) against (d)).
      *   **Goal:** Build new honour codes (AI, etc.) without inhabiting an honour world.

  3.  **Identify Tensions/Contradictions:**

      *   *Tension 1: (b) vs (f).* Bernard Williams says no neutral standpoint to claim the new ethos is "truer" (pessimistic/relativist lean). (f) says progress is real and directional (realist lean).
      *   *Tension 2: (d) vs (e).* Haidt says reasoning is post-hoc/intuitive. (e) says careful written argument is high-leverage. (User tries to bridge this with "upstream/tone-setters," but is it enough?)
      *   *Tension 3: (a)/(h) vs (g).* (a)/(h) say change is a coordination shift/ honour flip where arguments don't work until *after*. (g) says reformers/arguments were load-bearing. How can arguments be load-bearing if they don't persuade until the flip?
      *   *Tension 4: (c) vs (a)/(g).* (c) says Abolition was primarily economic interest. (a) says it was honour. (g) says reformers mattered. If Eric Williams is right, was it really honour or just cheap signalling once profits dropped?
      *   *Tension 5: (i) Meta-Ethical Tension.* Honour is "fake" (no normative authority) but "necessary." Shame is "bad" but "effective." This is more of a psychological conflict than a logical contradiction, but it undermines the motivation for (e).
      *   *Tension 6: Civil Rights Test Case.* User claims Civil Rights supports (e) (argument/ideals) over (d) (psychology). But Civil Rights also involved massive shame tactics (sit-ins, media coverage of violence) and coordination shifts (legislation). Does it actually support the "argument" thesis or the "honour/shame" thesis?

  4.  **Rank Tensions by Severity:**

      *   *Severity 1 (Critical):* (b) vs (f). You can't easily hold "no neutral standpoint" and "progress is real/directional" without a complex meta-ethical framework the user hasn't articulated. This undermines the whole "moral progress" claim.
      *   *Severity 2 (High):* (d) vs (e). If Haidt is right, the core activity (essay writing) is low leverage. The "upstream" defence is weak if the mechanism is fundamentally non-rational (honour/shame).
      *   *Severity 3 (Medium):* (a) vs (c). Honour vs. Interest. If abolition was economic, the Appiah model is less universal.
      *   *Severity 4 (Low/Resolvable):* (i). This is a value conflict, not a logical one. One can believe a tool is effective but distasteful.

  5.  **Drafting the Revisions (Iterative Process):**

      *   *Fixing (b)/(f):* Need to separate *causal explanation* from *normative justification*. We can say progress is real *from our perspective* without claiming a God's-eye view. Or, reject Williams's pessimism. Cheapest: Accept a "local realism." Cost: Lose the philosophical high ground against relativists.
      *   *Fixing (d)/(e):* Refine the role of argument. Arguments don't change minds directly; they provide the *vocabulary* for the honour shift. They construct the new "common sense." Cost: Admit essays are propaganda/signalling, not truth-seeking.
      *   *Fixing (a)/(c)/(g):* Synthesis. Interest creates the opening; honour closes the deal; reformers bridge the gap. Cost: Nuance.
      *   *Fixing (i):* Accept the tragedy. Effective tools are often morally ambiguous. Cost: Cynicism/discomfort.

  6.  **Evaluating the Essay Project (e):**
      *   Does it survive? Only if redefined. If the goal is "truth," it fails under (d). If the goal is "building the vocabulary for a new honour code," it succeeds. The user needs to stop pretending they are persuading via logic and admit they are engaging in *culture war* (in the neutral sense).

  7.  **Addressing the Civil Rights Test Case:**
      *   It actually supports the Honour/Shame model (d/a) more than the Rational Argument model (e). The "American Creed" wasn't a syllogism; it was a shaming device ("You say you believe X, but you do Y"). It was a coordination focal point.

  8.  **Addressing the "Building Honour Without Honour" Goal:**
      *   This is the crux. Can rationalists build honour codes? Yes, but they must participate in the status game. They can't stand outside it.

  9.  **Refining the Output (British English & Tone):**
      *   Use "honour," "programme," "realise," "favour."
      *   Tone: Direct, analytical, slightly sharp but helpful.
      *   Structure: Rank tensions, propose revisions, assess the project.

  10. **Final Review against Constraints:**
      *   No bibliography? Check.
      *   British English? Check.
      *   Blunt? Check.
      *   Address all points (a-i)? Check.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Williams is wrong." I need to show how the user's specific combination creates the friction. The friction is between the *explanation* of change (non-rational) and the *prescription* for action (rational).
  Also, the (b) vs (f) tension is crucial. Bernard Williams is quite specific about the lack of external validation. If the user wants to claim progress is *real*, they need to drop the Williamsian pessimism or qualify it heavily.
  The "Civil Rights" point is a trap. The user thinks it supports (e). I need to gently point out it looks more like (a) + (d). The "American Creed" is a shaming tool, not a logical proof.

  Let's organise the tensions.
  1. The Meta-Ethical Clash (b vs f).
  2. The Mechanism Clash (d vs e).
  3. The Causal Clash (a vs c).
  4. The Personal Paradox (i).

  Ranking: 1 is existential. 2 is practical. 3 is historical. 4 is psychological.

  Okay, ready to write.
answer: |-
  This is a coherent enough worldview to function, but it is not a stable one. You have built a model of *how change happens* that renders your *preferred method of causing change* largely inert, while simultaneously claiming a normative confidence that your explanatory model undermines.

  Here is the audit, ranked by severity of tension.

  ### 1. The Meta-Ethical Collision: (b) vs (f)
  **Severity: Critical**
  You cite Bernard Williams's pessimism (no neutral standpoint to claim the new ethos is 'truer') alongside a robust moral realism (progress is real and directional, not just fashion). These are difficult to hold together. Williams's point in *Shame and Necessity* and the Tanner lectures is precisely that while we prefer our current outlook, we cannot justify it as 'closer to the truth' without begging the question. If you claim progress is real in a way that defeats relativists, you need a vantage point Williams explicitly denies exists.

  *   **Cheapest Revision:** Adopt a 'pragmatic realism'. Concede that you cannot prove progress from a God's-eye view, but argue that within the human form of life, certain changes (ending slavery) are improvements by criteria we cannot coherently reject without self-contradiction or loss of agency.
  *   **Cost:** You lose the philosophical high ground against the hard relativist. You must admit your claim that 'progress is real' is an internal commitment of your moral framework, not an external fact about the universe. It weakens (f) from a metaphysical claim to a practical one.

  ### 2. The Mechanism Mismatch: (d) vs (e)
  **Severity: High**
  This is the practical engine of your talk. You accept Haidt's social intuitionist model (reasoning is post-hoc, identity-driven) but plan to intervene via careful written argument. Your defence is that arguments work 'upstream' on tone-setters. This is fragile. If moral psychology is fundamentally about identity and sentiment, 'careful argument' is often read as signalling or tribal marking, not truth-tracking. If the Civil Rights movement worked by appealing to the 'American Creed', that was not a logical deduction; it was a shaming tactic ('You claim to believe X, yet you do Y'). That is honour logic, not syllogistic logic.

  *   **Cheapest Revision:** Reclassify your essays. Stop viewing them as 'arguments' in the rationalist sense (premises leading to conclusions) and view them as 'vocabularies for shame'. You are providing the rhetorical tools that allow tone-setters to articulate why a practice is now dishonourable.
  *   **Cost:** You must abandon the idea that you are persuading people via reason. You are arming a faction. This feels cynical, but it aligns (e) with (a) and (d). It saves the project but changes its self-conception.

  ### 3. The Causal Dispute: (a) vs (c)
  **Severity: Medium**
  You lean on Appiah for the honour mechanism but Eric Williams for abolition (economic interest). If the West Indian economy was already failing, the honour shift might have been a epiphenomenon—a way for the British elite to exit a losing bargain while claiming moral superiority. If interest was the load-bearing beam, then (a) is not a universal mechanism, but a specific one for practices where interests are ambiguous or balanced.

  *   **Cheapest Revision:** Treat interest as the *precondition* and honour as the *trigger*. Economic shifts make a practice vulnerable; honour shifts make it impossible. This preserves (g) (reformers mattered) because reformers exploit the economic vulnerability to launch the honour attack.
  *   **Cost:** You cannot claim honour is the *primary* driver in all cases. You must concede that without the economic shift in the Caribbean, the abolitionists might have shouted forever. This limits the generalisability of your model to AI or animal welfare, where economic interests might be strongly aligned with the 'immoral' practice.

  ### 4. The Personal Paradox: (i)
  **Severity: Low (Psychological)**
  You find honour/shame normatively empty yet causally potent, and morally dubious yet necessary. This is not a logical contradiction; it is a tragedy. You are describing the burden of effective agency. Many effective tools are unpleasant.

  *   **Cheapest Revision:** Accept the dissonance. Acknowledge that using shame is a 'necessary evil' or a 'dirty hands' scenario. You are not required to like the mechanism to use it.
  *   **Cost:** Psychological comfort. You have to stop hoping for a clean moral hands approach to social change. It costs you innocence, not coherence.

  ### The Test Case: Civil Rights
  You are misreading the Civil Rights movement to support (e). The 'American Creed' was not a rational argument; it was a focal point for coordination and a weapon for shaming. When King wrote the *Letter from Birmingham Jail*, he was not offering a syllogism; he was exposing the hypocrisy of the white moderate to strip them of their moral standing. That is Appiah's honour mechanism, not a rationalist persuasion cascade. It supports (a) and (d) far better than (e). If you use this case to justify essay-writing, you are fooling yourself about *why* those essays worked. They worked because they made segregationists look ridiculous and cruel, not because they refuted them.

  ### The Single Change to Clean Up the Most
  **Drop the claim that 'careful written argument' works via reasoning.**

  If you accept (a), (d), and (h)—that change is a coordination shift driven by honour and identity, occurring discontinuously—then your essays only work if they function as **focal points** or **shaming devices**.

  If you reframe your project in (e) from 'I will argue people into changing their minds' to 'I will articulate the new norms so that early adopters have a script to shame the laggards', the tension with (d) dissolves. The tension with (a) dissolves. The tension with the Civil Rights case dissolves.

  ### Does the Essay Project Survive?
  **Yes, but not as you currently conceive it.**

  If you write essays expecting them to be read as rational demonstrations that update priors, you are rationalising your comparative advantage. You are good at writing, so you assume writing is the lever. But if Haidt and Appiah are right, the lever is *status*.

  Your essays will only work if they:
  1.  **Define the In-Group:** Make adopting your view a signal of being a 'decent person' (honour).
  2.  **Stigmatise the Out-Group:** Make holding the opposing view costly in terms of standing (shame).
  3.  **Provide Cover:** Give the 'tone-setters' the vocabulary to defect from the old norm without losing face.

  If you are unwilling to write in a way that explicitly targets status and identity—if you insist on a 'neutral', 'reasoned' tone that pretends not to be playing the honour game—then the project is likely low-leverage. You cannot build a new honour code while pretending to stand outside the honour system. You must be willing to be a participant in the status game, not just an observer with a pen.

  **Summary:** Your model of the world (a, b, d, h) is strong. Your model of your own agency within it (e) is the weak link. Align your method with your mechanics. Write to shift the Overton window and alter status incentives, not to win debates. If you do that, the contradictions vanish.
