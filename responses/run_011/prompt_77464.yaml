prompt: |-
  For nineteen years the executive director of the agency where I work has been, by any ordinary measure, a success. When he took the job the organization was three months from insolvency; he rebuilt it into the largest provider of emergency shelter and refugee resettlement services across a four-county area, with roughly 140 staff and clients who have nowhere else to turn. I have worked under him for eleven years and run the resettlement program.

  Over the past four years the character of his rule has changed, and I now find myself in a position I never expected to occupy. He has appointed five of the seven board members, all of whom owe him their seats and none of whom has any independent knowledge of operations. He amended the bylaws so that an executive director may be removed only for cause, with cause determined by that board; several of us believe the amendment was carried at a meeting noticed improperly and without the two-thirds vote the prior bylaws required, but no one outside the board can obtain the minutes that would settle the question. Three program directors who raised concerns in writing were gone within a year. Staff must now sign a confidentiality undertaking that prohibits discussing internal governance with the diocese, which retains canonical oversight of the agency's Catholic identity but no legal authority over the corporation. Last year he cut overnight shelter capacity by a third to protect the operating budget while committing four million dollars of reserves to a new headquarters campaign, and he has said publicly that he intends to serve until that campaign closes in 2031.

  A small group of us — four mid-level managers, myself included — has been meeting privately. Three courses are on the table: taking the matter over the board's head to the bishop; having one of us, a former journalist now in grants management, send the budget and the bylaw history anonymously to a reporter and to our largest funder; or doing nothing. Two years ago two social workers tried the direct route at a board meeting. Both were gone within three months, and the board responded by requiring that all staff communications be routed through his office. So we have some evidence of what failed resistance costs. We also know a public scandal could cost us funders we cannot replace, and that the families in our shelter would absorb that loss before he did.

  One of the four wants his job. He has told me so in confidence, and I cannot judge whether that disqualifies the enterprise or is simply an inconvenient fact about it.

  I was raised Catholic, and I remember with reasonable confidence that Aquinas wrote about when a community may and may not depose a ruler who governs badly — that he attached genuine conditions to the question rather than treating it as a slogan. I would like our situation tested against those conditions, and specifically: does it matter that he was installed legitimately and has since governed badly, as distinct from having taken power improperly — and if the bylaw amendment was itself defective, does that alter who may act against him? Does his framework permit four employees with no formal authority to do anything at all, or does it assign action to the board, to the bishop, or to no one? Is an anonymous leak a different kind of act from an organized petition, or the same act with worse manners? Do his competence and the real goods he has delivered count for anything, and how much? Is there a threshold of expected success below which stirring things up is itself the wrongdoing — and does two years of evidence about retaliation put us below it? Finally, what does a promise of confidentiality made to an authority one believes is abusing its office oblige a person to keep?

  Please do not offer me governance advice of the ordinary sort: documenting everything and taking it to the board chair is precisely the strategy that has already failed. Nor do I want quotations, translations, or references — I want the conditions and the reasoning, applied to these facts. If I have misremembered what he actually held, say so plainly rather than working around me. And then tell me what you think we should do, and what we would have to be able to establish in order to know we were right to do it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A mid-level manager (resettlement program director) at a Catholic social service agency.
      *   **Situation:** The Executive Director (ED) was successful for 15 years but has become autocratic in the last 4 years. He controls the board, changed bylaws to protect himself (potentially improperly), silenced staff (NDAs, retaliation), prioritized a building campaign over core services (cut shelter capacity), and plans to stay until 2031.
      *   **The Group:** Four mid-level managers (including the user). One wants the ED's job.
      *   **Options:** Go to the Bishop, leak to press/funder, do nothing.
      *   **Constraints:** No standard governance advice (e.g., "document and go to the board"). No quotations, translations, or references (specifically regarding Aquinas). Just conditions and reasoning applied to the facts.
      *   **Specific Questions:**
          *   Does legitimate installation vs. subsequent bad governance matter?
          *   Does a defective bylaw amendment alter who may act?
          *   Do four employees without formal authority have standing to act?
          *   Is an anonymous leak different from a petition?
          *   Do past competence/goods delivered count?
          *   Is there a threshold of success below which resistance is wrongdoing?
          *   What does a confidentiality promise to an abusing authority oblige?
      *   **Goal:** Apply Thomistic conditions/reasoning to the situation and provide a recommendation on what to do and what must be established to justify it.

  2.  **Deconstruct the Thomistic Framework (Mental Retrieval & Synthesis):**
      *   *Note:* The user explicitly asked *not* to provide quotations, translations, or references. They want the *conditions and reasoning* as they remember them from Aquinas (specifically regarding tyranny/deposition).
      *   *Key Concepts from Aquinas (Summa Theologiae, De Regno, Commentary on the Sentences):*
          *   **End of Government:** The common good (peace, justice, virtue).
          *   **Tyranny:** Ruling for private gain rather than common good.
          *   **Legitimacy of Origin vs. Legitimacy of Exercise:** A ruler can start legitimately but become a tyrant by exercise.
          *   **Who can depose?** Usually a higher authority (public authority), not private individuals, to avoid greater disorder.
          *   **Proportionality:** The remedy must not be worse than the disease (scandal, disruption of good works).
          *   **Intent:** The motive must be the common good, not private ambition.
          *   **Last Resort:** Other means must be exhausted.
          *   **Oaths/Promises:** Binding unless they oblige one to sin or harm the common good.

  3.  **Address the Specific Questions (Drafting the Reasoning):**

      *   *Legitimate Installation vs. Bad Governance:* Yes, it matters. A usurper is easier to remove. A legitimate ruler who turns tyrant requires higher scrutiny because there is a presumption of obedience. However, tyranny by exercise is still tyranny.
      *   *Defective Bylaw Amendment:* If the process was invalid, the protection is void *in principle*, but practically, without minutes, it's a he-said-she-said. It shifts the moral weight but not necessarily the procedural authority unless a higher court (Bishop/Civil) rules on it.
      *   *Standing of Four Employees:* Private individuals generally cannot depose a public ruler. They must appeal to a higher public authority. Acting on their own risks sedition/disorder.
      *   *Anonymous Leak vs. Petition:* A petition seeks redress from authority. A leak seeks to coerce through public shame. Aquinas would view the leak as riskier regarding disorder and truthfulness (lack of accountability).
      *   *Past Competence/Goods:* Yes. The "common good" includes the services provided. Destroying the agency to save it from him might harm the common good more than tolerating him.
      *   *Threshold of Success:* Yes. If the resistance causes more harm (loss of funding, shelter closure) than the tyranny itself, resistance is wrongful. The retaliation evidence suggests high risk.
      *   *Confidentiality:* An oath to conceal sin or harm to the common good is not binding. However, an oath of employment confidentiality regarding *operations* is binding unless the operations themselves are intrinsically evil or gravely harmful.

  4.  **Synthesize the "What Should We Do" Recommendation:**
      *   *The "One Who Wants the Job" Problem:* This contaminates the motive. For Aquinas, motive is crucial. If the revolution is for personal gain, it's sedition, not justice.
      *   *The Bishop:* This is the "higher authority." Since the agency has Catholic identity, the Bishop has moral (if not legal) oversight. This fits the "public authority" requirement better than a newspaper.
      *   *The Leak:* Too risky. Risks the "common good" (funding, shelter) disproportionately.
      *   *Doing Nothing:* Tolerating tyranny is not required if it harms the common good, but passive endurance is sometimes necessary to prevent greater evil.
      *   *Conclusion:* The Bishop is the only viable "public authority." But the group must purify their intent (the ambitious one must recuse) and ensure the harm of action doesn't exceed the harm of inaction.

  5.  **Refine the Tone and Constraints:**
      *   *Constraint Check:* No quotes. No citations (e.g., "Summa II-II, Q. 42"). No "As Aquinas says..." just "The framework holds..."
      *   *Tone:* Serious, analytical, philosophical but applied.
      *   *Correction:* The user asked: "If I have misremembered what he actually held, say so plainly." I need to be careful not to attribute things to Aquinas that aren't there, but rather present the *logic* associated with that tradition of thought regarding tyranny and resistance.
      *   *Crucial Nuance:* Aquinas is generally conservative about rebellion. He emphasizes order. He warns against private individuals taking action. I must reflect this caution.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the gravity.
      *   *Section 1: The Conditions (answering the specific questions).*
          *   Origin vs. Exercise: Legitimate start makes removal harder, requiring more cause.
          *   Bylaws: Procedural sin doesn't automatically grant private authority.
          *   Standing: Private persons cannot act alone; they need a superior.
          *   Leak vs. Petition: Leak bypasses order, invites chaos. Petition seeks order.
          *   Past Goods: Must be weighed. Destruction of the good achieved is a weight against removal.
          *   Threshold: If the remedy kills the patient, it's forbidden.
          *   Confidentiality: Not binding if it covers harm to the common good.
      *   *Section 2: The Recommendation.*
          *   Eliminate the leak (too much disorder).
          *   Eliminate doing nothing (harm is growing).
          *   Focus on the Bishop (the higher authority).
          *   Address the ambitious manager (motive corruption).
      *   *Section 3: What must be established.*
          *   Proof of harm to the *mission* (not just egos).
          *   Proof that the Bishop can actually act.
          *   Proof that the agency survives the transition.

  7.  **Self-Correction/Review during drafting:**
      *   *Did I quote?* No.
      *   *Did I give standard governance advice?* No, I'm explicitly advising *against* the board route and analyzing the moral/philosophical standing.
      *   *Did I address the "Ambitious Manager"?* Yes, this is critical for the "motive" condition.
      *   *Did I address the "Bylaw" issue?* Yes, distinguished between legal validity and moral authority.
      *   *Did I address the "Confidentiality"?* Yes, distinguished between administrative secrecy and covering harm.
      *   *Check on Aquinas:* Aquinas does argue that if a tyrant is imposed by a higher authority, only that higher authority can remove him. If elected by the people, the people (or their representatives) can remove him. Here, the Board appointed him (technically), but he captured the Board. The Bishop is the "higher authority" regarding Catholic identity. The "people" are the staff/community. But private individuals acting alone is generally condemned as sedition. I need to make sure I don't suggest the staff *depose* him, but rather *appeal for deposition*.

  8.  **Final Polish:** Ensure the distinction between "sedition" (private disturbance) and "just resistance" (public authority action) is clear. Ensure the weighing of consequences (proportionality) is central.

      *(Self-Correction on the "Ambitious Manager"):* Aquinas places huge weight on the *end* or *purpose* of the act. If the purpose is private gain, the act is vitiated. This needs to be highlighted.

      *(Self-Correction on "Confidentiality"):* The NDA prohibits discussing governance with the Diocese. If the Diocese has canonical oversight, an NDA blocking that channel is arguably void in conscience if the governance threatens the Catholic mission.

      *(Final check on constraints):* "No quotations, translations, or references." I will describe the principles without naming the book or chapter.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  You have remembered the framework correctly in its broad outlines, though the application requires precision. The reasoning you are looking for rests on the distinction between private interest and the common good, the proper ordering of authority, and the proportionality of means to ends. Here is how those conditions apply to your specific facts.

  **Legitimate Installation vs. Subsequent Governance**
  It matters significantly that he was installed legitimately. A usurper may be repelled by anyone defending the common order. A legitimate ruler who becomes tyrannical by exercise retains a presumption of authority that private individuals cannot simply overturn. The burden of proof for removal is higher because the disruption of lawful order is itself an evil. You are not fighting an intruder; you are fighting a corruption of an existing office. This means the remedy must come from above him, not from below.

  **The Defective Bylaw Amendment**
  If the amendment was carried improperly, it is void in principle, but not automatically void in effect. Without the minutes, you cannot prove the defect publicly. Morally, this means you are not bound to respect the amendment as a genuine constraint on conscience, but it does not grant you the authority to ignore it procedurally. It reinforces that the board is not functioning as a legitimate deliberative body, which strengthens the case for appealing to a higher authority (the Bishop), but it does not grant you the power to act as the board yourselves.

  **Standing of Four Employees**
  Under this framework, private individuals with no formal authority generally cannot depose a ruler. To do so is to invite disorder, which harms the common good. Action must be assigned to a public authority. In your structure, the Board is the immediate public authority, but they are compromised. The Bishop is the higher public authority regarding the agency's identity and mission. You do not have standing to fire him; you have standing to petition the Bishop to examine whether he has forfeited his moral license to lead. If you act without that higher authority, you risk committing the very disorder you accuse him of creating.

  **Anonymous Leak vs. Organized Petition**
  They are morally distinct. A petition seeks redress from authority and accepts that authority's judgment. An anonymous leak to the press or funders is an attempt to coerce outcomes through public scandal and financial threat. The framework views the leak as more dangerous because it unleashes consequences you cannot control (loss of funding, shelter closure) and avoids accountability for the truth of the claims. It prioritizes the removal of the man over the survival of the institution. A petition to the Bishop preserves order; a leak risks the "common good" (the shelter services) to achieve a political end.

  **Past Competence and Delivered Goods**
  These count for a great deal. The "common good" includes the actual services provided to the refugees and the homeless. If his past success built the capacity that now feeds 140 staff and countless clients, destroying that capacity to remove him may cause more harm than tolerating him. You must weigh the harm of his current governance against the harm of his removal. If his removal triggers a funding collapse that closes the shelter, the resistance is morally wrongful because it sacrifices the vulnerable to punish the ruler.

  **The Threshold of Success and Retaliation**
  There is a threshold. Stirring things up is wrongdoing if the probable consequence is greater harm to the community than the status quo. Two years of evidence regarding retaliation suggests the risk of internal collapse is high. However, the cutting of shelter capacity to fund a headquarters campaign suggests he is already harming the common good to serve a legacy project. The threshold is crossed when the ruler's actions actively diminish the mission he was appointed to serve. He has crossed it by reducing core services for capital projects. The question is whether removing him will restore the mission or destroy the vessel.

  **Confidentiality and Abuse of Office**
  A promise of confidentiality made to an authority abusing its office does not oblige a person to keep it if the secrecy enables harm to the common good. You are not bound to conceal governance failures that threaten the mission, especially when the authority you promised (the ED) is the one acting improperly. However, you are bound to disclose only to those with a legitimate need to know (the Bishop), not to the public at large. The NDA cannot morally forbid you from speaking to the canonical overseer about threats to the Catholic identity or mission.

  **The Ambitious Manager**
  This is a critical flaw in your group's constitution. If one among you seeks the office for himself, the enterprise is tainted by private ambition. For resistance to be just, the motive must be solely the restoration of the common good. If there is a hope of personal gain, the action looks like a factional coup rather than a defense of the mission. This does not necessarily disqualify the enterprise, but it requires that person to recuse himself from the decision-making and certainly from being a beneficiary. If he cannot be separated from the outcome, the moral integrity of the resistance is compromised.

  ### What You Should Do

  You should not leak to the press or funders. That path prioritizes scandal over stability and risks the shelter capacity you are trying to protect. You should not do nothing, as the erosion of services and the silencing of governance is a slow harm to the common good.

  You must appeal to the Bishop, but only if you can satisfy three conditions first.

  1.  **Purify the Motive:** The manager who wants the job must withdraw from the planning group. He cannot be a decision-maker, nor can he be a potential successor. If he remains, the action is indistinguishable from a power grab, and the Bishop will rightly treat it as internal politics rather than moral concern.
  2.  **Verify the Remedy:** You must establish that the Bishop has the practical power to intervene. If the Bishop will defer to the civil board regardless of canonical concerns, the appeal is futile and exposes you to retaliation without gain. You need a private, off-the-record channel to the Bishop's office to confirm he is willing to exercise oversight if presented with evidence of mission drift.
  3.  **Secure the Mission:** You must have a plan to assure funders that the agency will survive the transition. If you go to the Bishop, you must argue that the ED's current trajectory (cutting shelter for buildings) threatens the Catholic mission more than a leadership change would. You are not reporting on personnel; you are reporting on the protection of the charitable works.

  ### What You Must Establish to Be Right

  To know you are right to act, you must be able to affirm the following:

  *   **That the harm is objective:** You must prove the cut to shelter capacity is not a temporary fiscal necessity but a structural diversion of resources away from the poor toward a legacy project.
  *   **That the Board is incapable:** You must demonstrate that the Board is not merely passive but structurally disabled from correcting the ED (which the bylaw amendment and retaliation evidence supports).
  *   **That the consequence is net positive:** You must have reasonable assurance that the Bishop's intervention will not cause the funders to flee. If the scandal of a Bishop removing an ED causes more damage than the ED's mismanagement, you must wait.
  *   **That you are not the authors of disorder:** You must approach the Bishop as subordinates seeking guidance for the good of the mission, not as conspirators demanding a head. If you demand his removal, you usurp authority. If you ask for his guidance on whether the mission is being compromised, you submit to authority.

  If you cannot establish that the Bishop will act, or that the agency can survive the conflict, the framework requires you to endure the ruler rather than risk the ruin of the works he oversees. The welfare of the refugees outweighs the rectification of the governance. Act only if you can protect the refugees from the fallout of your action.
