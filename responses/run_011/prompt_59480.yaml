  4.  **Evaluating "Non-Negotiable" vs. "Partisan":**
      *   *Non-Negotiable:* Logical consistency (Regress), Empirical coverage (Negative Cases), Conceptual clarity (Tripartite Timestamp).
      *   *Partisan:* The "Antiquity" one is tricky. A hard modernist might say "The feeling of antiquity is just a lie." A hard perennialist says "It *is* ancient." An adequate theory must explain the *feeling*, not necessarily validate the *fact*. So the requirement to *explain the feeling* is non-negotiable. The requirement to *validate the fact* is partisan. I need to phrase it carefully.
      *   *Partisan:* The "Succession Constraint" might be biased towards European state-history. But for the specific goal (determining *since when*), it's necessary.
      *   *Unsatisfiability:* The user suspects explaining felt antiquity + avoiding regress + explaining failures can't be done with a single birth date. They are right. A "birth date" implies a sharp boundary. Social ontology is usually fuzzy. The requirement should demand a *transition account*, not necessarily a *date*.

  5.  **Addressing the Specific Questions:**
      *   *Verdict on the Distinction:* It does work. It separates conceptual history from social ontology.
      *   *Non-Negotiable vs. Partisan:* I need to be sharp here. The "Single Birth Date" expectation is likely the partisan trap.
