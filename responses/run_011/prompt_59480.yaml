      *   **User's Constraints:** No summary of the debate, no bibliography, no scorecard against named positions (e.g., Gellner vs. Smith). Just the criteria.
      *   **User's Inputs:** Four suspected requirements (antiquity feeling vs. modern absence, no regress, negative cases, sequential self-descriptions). One proposed distinction (category availability vs. self-application vs. ontological existence).
      *   **Required Analysis:** Evaluate the user's distinction (keep or discard?), mark requirements as non-negotiable vs. partisan, identify joint unsatisfiability (trade-offs), and end with one line on the most eliminative requirement.

  2.  **Deconstruct the User's Inputs:**

      *   *Input 1 (Antiquity/Modernity):* "Explain why the category felt ancient... and why nobody in 1300 noticed."
          *   *Verdict:* Crucial. This addresses the phenomenological gap between modernist and perennialist views.
      *   *Input 2 (Regress):* "If the nation is brought into being by a movement claiming to speak for an already-existing nation..."
          *   *Verdict:* Crucial. This is the "chicken and egg" problem of nationalism studies (Gellner's critique of nationalism).
      *   *Input 3 (Negative Cases):* "Language communities... that never produced a movement."
          *   *Verdict:* Crucial. Selection bias is the biggest flaw in most theories.
      *   *Input 4 (Sequential Self-Descriptions):* "One territory hosting a sequence... without making them all true or all false."
          *   *Verdict:* Tricky. This touches on continuity vs. rupture. It's necessary for historical precision.
      *   *The Distinction (Category vs. Application vs. Existence):*
          *   1. Concept availability (when did "nation" mean this?).
          *   2. Self-identification (when did *this* group use it?).
          *   3. Ontological reality (when did the *thing* exist?).
          *   *Verdict:* This is *not* a distinction without a difference. It's essential. Modernists conflate 1 and 3. Ethnosymbolists conflate 2 and 3. Separating them is the only way to avoid talking past each other. It should be a requirement.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Refining Input 1 (The Time-Travel Test):* Needs to account for the *feeling* of depth without requiring actual depth. Let's call it "The Phenomenological Mechanism."
      *   *Refining Input 2 (The Regress):* Needs to specify the "pre-national" substrate. Let's call it "The Pre-National Substrate."
