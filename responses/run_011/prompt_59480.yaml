answer: |-
  ### Verdict on Your Distinction
  **Keep it.** It is not a graceful way of losing; it is the only way to prevent category errors.
  1.  **Concept Availability:** When did the *word/concept* "nation" acquire its modern semantic range? (Intellectual History)
  2.  **Self-Application:** When did this specific group start *claiming* the label? (Political History)
  3.  **Ontological Existence:** When did the *social facts* required to make the claim true actually coalesce? (Social Ontology)

  Most theories fail because they answer (1) and assert it settles (3), or they observe (2) and assume it proves (3). An adequate theory must provide a rule for translating (2) into (3) that doesn't rely on (1). **Make this a requirement.**

  ***

  ### The Specification Checklist

  **1. The Phenomenological Mechanism**
  *   **Requirement:** The account must explain the *mechanism* by which a recently formed entity generates a subjective experience of deep time, without necessarily validating the objective truth of that deep time.
  *   **Consideration:** Addresses your "1300 vs. 1900" problem. If nations are modern, the theory must explain the "invention of tradition" or "collective amnesia" that makes them feel ancient. If nations are ancient, it must explain why the *political salience* of that antiquity was dormant for centuries. Dismissing the feeling as "false consciousness" is insufficient; the feeling is a data point the theory must process.
  *   **Status:** **Non-Negotiable.** (Ignoring the subjective experience of the actors renders the theory sociologically blind.)

  **2. The Pre-National Substrate (Anti-Regress)**
  *   **Requirement:** The account must identify the specific material or cultural conditions existing *prior* to nationalist mobilization and specify the threshold at which those conditions cease to be merely "cultural" and become "national."
  *   **Consideration:** Addresses your "Regress" problem. If a nationalist movement claims to wake a sleeping nation, the theory must describe the sleeper. Is it a shared myth? A tax system? A vernacular? Crucially, it must define the *delta*: what changed to turn an "ethnic community" (or whatever) into a "nation"? If the substrate is identical to the outcome, the theory is tautological.
  *   **Status:** **Non-Negotiable.** (Without this, the theory is circular.)

  **3. The Selection Mechanism (Negative Cases)**
  *   **Requirement:** The account must explain why groups possessing the requisite substrate (language, history, territory) *failed* to become nations with the same explanatory power as why others succeeded.
  *   **Consideration:** Addresses your "Negative Cases" problem. Most theories are survivorship bias disguised as causality. If "shared language" causes nationhood, why did the German-speaking world fragment for so long? If "oppression" causes it, why did some oppressed groups remain dynastic subjects? The theory must account for the null set.
  *   **Status:** **Non-Negotiable.** (This is the primary filter for scientific adequacy vs. storytelling.)

  **4. The Succession Constraint**
  *   **Requirement:** The account must provide a rule for adjudicating competing claims of continuity within the same geography without defaulting to "all are valid" (relativism) or "only the current one is valid" (presentism).
  *   **Consideration:** Addresses your "Sequence of Self-Descriptions" problem. If the Kingdom of X becomes the Republic of Y which becomes the Nation of Z, the theory must specify whether Z is a continuation of X or a replacement. This requires a criterion of identity (e.g., institutional continuity vs. popular sovereignty) that is applied consistently across cases.
  *   **Status:** **Partisan/Contested.** (This forces a metaphysical choice on what constitutes "identity." Modernists will demand a rupture; Perennialists will demand continuity. An adequate theory must pick a lane here, but which lane is a philosophical commitment, not an empirical necessity.)

  **5. The Tripartite Timestamp**
  *   **Requirement:** The account must explicitly separate and date the three variables from the Distinction above (Concept, Claim, Reality) and justify the lag time between them.
  *   **Consideration:** Prevents the conflation of intellectual history with social reality. A theory might argue the *concept* existed in 1750, the *claim* was made in 1848, but the *reality* (mass literacy, administrative integration) wasn't achieved until 1920. The theory must state which of these dates counts as "the origin" and why.
  *   **Status:** **Non-Negotiable.** (Required for the specific goal of saying "since when.")

  ***

  ### Joint Unsatisfiability & Trade-offs

  You are correct: **Explaining Felt Antiquity, Avoiding Regress, and Explaining Failures cannot be met by a theory that assigns a Single Birth Date.**

  *   **The Conflict:** A "Single Birth Date" implies a discrete event (a revolution, a treaty, a manifesto). This satisfies the **Anti-Regress** requirement cleanly but devastates the **Phenomenological Mechanism** (it makes the feeling of antiquity a lie) and struggles with the **Selection Mechanism** (why did the event happen *here* and not *there* if the conditions were similar?).
  *   **The Trade-off:** To satisfy all three, the theory must abandon "Birth Date" for "Emergence Threshold." It must describe a gradual phase change where the *probability* of nationhood shifts from near-zero to near-one.
  *   **The Cost:** If you accept a "Threshold" model, you lose the ability to say "Since 1789" with precision. You gain accuracy but lose resolution. If you demand resolution (a date), you must sacrifice either the explanation of the feeling or the explanation of the failures.
  *   **Verdict:** The "Single Birth Date" expectation is the **Partisan Commitment** wearing a criterion costume. It is a modernist prejudice derived from legal sovereignty, not social ontology. Drop it to save the list.

  ***

  ### The Eliminator

  **The Selection Mechanism (Negative Cases) knocks out the most candidates.**
