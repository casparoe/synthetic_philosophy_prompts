      *   *Correction on the Distinction:* The user asked "Should a theory be required to answer each one separately?" My answer is Yes. If it conflates them, it's category error.
      *   *Correction on Unsatisfiability:* The user thinks "Single Birth Date" is the problem. I agree. I need to explicitly state that a theory demanding a discrete "t=0" is likely incompatible with the "Felt Antiquity" requirement.

  9.  **Final Polish:** Check the "One Line" conclusion. It needs to be punchy. "The requirement to explain the negative cases knocks out the most candidates." (Or similar). Let's go with the Selection Mechanism.

      *(Self-Correction on the "One Line"):* The prompt asks for "which single requirement knocks out the most candidates."
      *   Candidate theories: Primordialism, Modernism, Ethnosymbolism.
      *   Primordialism fails Negative Cases (why not all tribes?).
