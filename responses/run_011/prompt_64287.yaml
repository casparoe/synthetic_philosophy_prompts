answer: |-
  (i) **Examination Question**

  **Political Philosophy: Final Paper**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Case:** A municipal housing authority holds the power to terminate any tenancy on 48 hours' notice, at its discretion, without grounds. It is not bound by tenant representations and may amend the instrument unilaterally. In twelve years, this power has never been exercised. Published guidance promises action only "for cause," but this is not legally enforceable.

  *   **Variant A:** Tenants know of the power. Their conduct (complaints, meeting attendance) and reported psychological state (fear, self-censorship) are indistinguishable from tenants with secure tenancies.
  *   **Variant B:** The power exists but is unpublished. Tenants are unaware of it. Their conduct and experience are otherwise identical to Variant A.

  **Question:**
  1.  Assess the liberty of the tenants in **both** variants according to Berlin's negative conception and Pettit's republican conception. (10 marks)
  2.  Your instructor has hypothesized that negative liberty resembles a measurement taken at a single point of an operating envelope, whereas non-domination resembles a specification that must hold across the whole envelope (robustness). Using this analogy or your own, explain whether the divergence in your answers to (1) shows that republicanism is a distinct conception of liberty, or merely a redescription of negative liberty. (7 marks)
  3.  Is the absence of a binding constraint on the authority best described as a deficit of *positive* liberty rather than negative liberty? Finally, are the two obvious repairs—making the guidance legally enforceable, or giving tenants a vote over the instrument—repairs of the same kind? (8 marks)

  ***

  (ii) **Model Answer**

  In Variant A and Variant B, Berlin and Pettit deliver divergent verdicts. For Berlin, liberty is the absence of actual interference or immediate threat. In both variants, no interference has occurred for twelve years. In Variant A, the tenants feel no fear; in Variant B, they possess no knowledge. Since Berlin treats liberty as an opportunity-concept grounded in the actual world, the tenants are negatively free in both cases. The mere existence of a dormant power does not restrict options unless it is exercised or creates a palpable barrier.

  For Pettit, liberty is the status of non-domination. Domination exists where one agent has the *capacity* to interfere arbitrarily in the choices of another. The housing authority possesses this capacity: the power is discretionary, unbound by law, and unilateral. Consequently, the tenants are dominated in both Variant A and Variant B. Pettit insists this status is objective; it does not depend on the tenant's knowledge (Variant B) nor their psychological resilience (Variant A). A slave is unfree even if the master is benevolent and the slave is unaware. Thus, on the republican view, the tenants are unfree despite the absence of interference.

  This divergence validates the metrology hypothesis. Negative liberty measures the system's output at a specific moment (the point reading): is the door locked *now*? Republican liberty specifies the system's tolerance across counterfactual conditions (the operating envelope): would the door remain unlocked if the operator's mood changed? Pettit's requirement of *robustness* means liberty must persist across possible worlds, not just the actual one. If we treated republicanism as merely a redescription of negative liberty, we would have to stretch "interference" to include "potential interference." But Berlin explicitly rejects this; otherwise, every law (which potentially coerces) would reduce liberty simply by existing. The conceptions are distinct because they track different objects: negative liberty tracks the *exercise* of power; republican liberty tracks the *structure* of power.

  Regarding the third element: is the unconstrained authority a deficit of positive liberty? Positive liberty concerns self-mastery—being one's own master. If the tenants have no say in the rules governing them, they lack autonomy in the positive sense. However, describing the deficit solely as positive liberty is dangerous. Berlin warns that positive liberty can justify coercion in the name of a "higher self." The republican diagnosis is more precise: the deficit is not that the tenants fail to rule themselves (positive), but that they are subject to arbitrary rule (domination). One can have democratic control (positive liberty) and still be dominated if the majority rules arbitrarily. Thus, the deficit is primarily republican, though it overlaps with positive liberty regarding the source of control.

  Finally, are the repairs of the same kind? Making the guidance enforceable establishes the rule of law; it removes arbitrariness by binding the authority to pre-stated rules. Giving tenants a vote establishes democratic control; it ensures the authority tracks their interests. For Berlin, enforceable guidance is the superior repair, as it maximizes predictability and minimizes interference. For Pettit, a vote is the deeper repair. Mere rule-following does not guarantee non-domination if the rules themselves are oppressive or if the authority retains discretion in interpretation. Non-domination requires that power track the interests of the affected. Therefore, the vote addresses the *source* of arbitrariness, while enforceable guidance addresses only its *symptoms*. They are not the same kind of repair: one limits the scope of power, the other alters its ownership.

  ***

  (iii) **Marking Scheme**

  **Total: 25 Marks**

  **1. Application to Variants (10 Marks)**
  *   **Berlin (Negative):** 5 Marks.
      *   *Competent (3):* Identifies that no actual interference occurred in A or B.
      *   *First-Class (5):* Explicitly notes that knowledge (A) vs. ignorance (B) makes no difference to Berlin *provided* no fear/coercion is felt (as stipulated). Recognizes Berlin's focus on the actual world.
  *   **Pettit (Republican):** 5 Marks.
      *   *Competent (3):* Identifies domination exists due to arbitrary power capacity.
      *   *First-Class (5):* Explicitly states that knowledge/psychology is irrelevant to the *status* of domination (objective condition). Distinguishes Variant A and B as identical for Pettit.

  **2. Distinctness & The Envelope Analogy (7 Marks)**
  *   **Competent Pass (3-4):** Notes they disagree. Suggests Pettit cares about potential power.
  *   **First-Class (6-7):** Engages the "point vs. envelope" analogy. Explains that Negative Liberty is state-dependent (actual interference), while Non-Domination is modal/counterfactual (robustness across possible worlds). Argues that collapsing them requires distorting Berlin's definition of interference.

  **3. Positive Liberty & Repairs (8 Marks)**
  *   **Positive Liberty (4 Marks):**
      *   *Competent (2):* Links lack of control to positive liberty.
      *   *First-Class (4):* Distinguishes Positive (self-mastery) from Republican (non-arbitrariness). Notes the risk of conflating them (Berlin's warning).
  *   **Repairs (4 Marks):**
      *   *Competent (2):* Identifies one as legal, one as democratic.
      *   *First-Class (4):* Argues they are distinct kinds of repair (limiting discretion vs. tracking interests). Connects this back to Pettit's requirement for "trackability" vs. Berlin's preference for predictability.

  **Specific Mistakes (Deduct 2 marks per occurrence, max 6)**
  *   **The Psychological Fallacy:** Claiming tenants in Variant A are *more* free than B on Pettit's view because they feel secure. (Pettit: Status is objective).
  *   **The Conflation:** Treating Republican Liberty as simply a subset of Positive Liberty. (Pettit argues it is a third concept).
  *   **The Counterfactual Error:** Claiming Berlin would consider the tenants unfree because the power *could* be used. (Berlin: Liberty is reduced by actual barriers/threats, not mere capacity).
  *   **The Repair Equivocation:** Claiming enforceable guidance and a vote are the same thing because both "help tenants."

  ***

  (iv) **Examiner's Note**

  **Stipulations Doing the Work:**
  The critical stipulation is in Variant A: *"no evidence of deference or self-censorship, and they report no fear."* This isolates the structural fact of domination from the psychological experience of it. Without this, a student could argue that Negative Liberty is reduced in Variant A due to self-censorship (which Berlin accepts as a constraint). By removing the psychological effect, the question forces the student to choose between the *fact* of interference (Berlin) and the *capacity* for interference (Pettit).

  **Security of the Model Answer:**
  The least secure section is the treatment of **Positive Liberty**. Berlin is notoriously skeptical of positive liberty, often viewing it as a source of tyranny. The model answer argues the deficit is *primarily* republican, not positive. This is philosophically sound (Pettit's own position), but it treads a fine line. A sharp student might argue that "giving tenants a vote" is a quintessential positive liberty repair (collective self-mastery). The marking scheme rewards distinguishing this from non-domination, but the boundary is porous.

  **On the Hypothesis:**
  Your metrology analogy is not a prejudice; it is analytically precise. Pettit's core innovation is the **modal robustness** condition. Negative liberty is indeed a "point measurement" of the actual world (is interference occurring?). Non-domination is a "stress test" of the system (would interference occur if the agent willed it?). This analogy will help your engineering-minded students grasp the counterfactual nature of domination without getting lost in metaphysical weeds. I have retained it in the model answer because it successfully discriminates between a student who understands the *logic* of the texts versus one who has merely memorized the definitions.
