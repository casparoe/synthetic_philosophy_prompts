answer: |-
  1. **Bottom line**

  The Physical Church–Turing Thesis is not a hypothesis about what physics permits, but a precondition for identifying physical systems as computing devices. To report that a system computes a function is to report a stable input–output mapping verified by finite means. Since verifying a non-Turing-computable function requires checking outputs that are, by definition, beyond finite verification, no observation can ever support the claim that a device transcends Turing computability. Any apparent counterexample must be redescribed as a misunderstanding of the device's operation. The thesis is unfalsifiable because it constitutes the framework within which falsification becomes possible. We cannot observe hypercomputation because observation requires finite validation.

  2. **What is and is not being claimed**

  This position is not the claim that the Church–Turing Thesis is analytically true by definition of "Turing machine." That reading trivializes the physical thesis, reducing it to a tautology about mathematics. Nor is it the standard empiricist view that the thesis is a contingent law like gravity, awaiting a potential counterexample from exotic physics. Instead, it occupies a transcendental role. A "convention" suggests we could choose otherwise without cognitive loss, like driving on the right side of the road; a "presupposition" indicates that choosing otherwise destroys the possibility of coherent reportage.

  The word "presupposition" does specific work here. It marks the boundary where empirical inquiry meets the conditions of its own intelligibility. If we abandon the requirement that device identification relies on finite verification, we lose the distinction between a computer and an oracle, between measurement and guesswork. We are not saying hypercomputation is impossible in nature; we are saying it is impossible to *identify* as such within a scientific practice conducted by finite agents. The thesis protects the coherence of scientific description, not the limits of ontology.

  3. **The argument**

  1.  **Device Identification:** To treat the sealed box $D$ as a device computing a function $f$, experimenters must establish a reliable mapping between input $n$ and output $b$. This requires more than a single trial; it demands stability across repetitions and independence from hidden variables. Without this stability, $D$ is merely a black box emitting noise, not a computer.
  2.  **Verification Constraint:** Establishing this mapping requires verifying that output $b$ is correct for input $n$. Verification implies an independent procedure confirming the truth of the proposition "$f(n) = b$." If the experimenters cannot confirm the output is correct, they cannot claim the device produced that specific output *as a function of the input*.
  3.  **Finite Observer:** The experimenters are finite physical systems. Their verification procedures are bound by the same physical limits as any other process they can model. They cannot perform infinite steps, wait for infinite time, or access infinite precision. Their capacity to validate data is inherently Turing-bounded.
  4.  **The Evidence Set:** In the sealed-device case, the evidence consists entirely of pairs $(n, b)$ where the experimenters successfully verified $b$ using their own finite resources. This includes running the Turing machine themselves for short durations or relying on existing proofs.
  5.  **Indistinguishability:** On the set of verifiable inputs, a standard Turing machine equipped with a lookup table of past results can perfectly mimic $D$. There is no statistical divergence between a true oracle and a shrewd guesser on inputs where checking is possible. The likelihood ratio of the observed sequence of agreements is unity for both hypotheses.
  6.  **The Unverifiable Gap:** The claim that $D$ solves the halting problem rests entirely on inputs where independent verification is impossible, such as cases where halting takes astronomical time. Here, the experimenters must trust $D$ without validation.
  7.  **No Record Possible:** Because verification is impossible for these cases, no data point can ever enter the scientific record stating "D answered correctly where we could not." The record only contains "D answered correctly where we checked." Trust is psychological, not empirical.
  8.  **Conclusion:** Therefore, the hypothesis "$D$ computes the halting function" is empirically empty. The only coherent report available is that $D$ agrees with our finite checks. To claim more is to assert a relation we cannot establish. Thus, the Church–Turing Thesis is preserved not by physics, but by the epistemology of measurement. We cannot report hypercomputation because the act of reporting collapses the phenomenon into finite terms.

  4. **The three hardest objections**

  **1. The Unfalsifiability Charge:** Critics argue that if no observation can refute the thesis, it is metaphysical dogma rather than science. A theory that risks nothing asserts nothing.
  *Response:* What survives is the distinction between ontology and epistemology. The thesis does not claim nature *cannot* do more; it claims we cannot *say* nature does more. It is not empty; it delineates the scope of empirical claims. It prevents category errors where we treat faith as data. What does not survive is the hope that physics could empirically overthrow computability theory.

  **2. The Math/Physical Conflation:** Critics argue this smuggles mathematical limits into physical laws. Physics might allow infinite density or acceleration (Malament-Hogarth spacetimes), enabling hypercomputation regardless of our verification limits.
  *Response:* What survives is the distinction between a physical state and an informational output. Even if spacetime allows infinite proper time along one trajectory, the *observer* reading the result must intersect that trajectory finitely. The signal transmission back to the observer is the bottleneck. The physical state might encode the answer, but extracting it as information requires a finite interaction. What does not survive is the idea that a physical process counts as a computation without a readable output.

  **3. The Probabilistic Confidence Objection:** Critics argue we can trust $D$ via consistency checks or physical theory confidence, even without direct verification. If our best physics predicts $D$ works, we should accept it.
  *Response:* What survives is the requirement for independent validation. Confidence in a physical theory is itself built on finite data. Trusting a theory that predicts hypercomputation is circular if the theory's validation relies on the very device in question. What does not survive is the notion that theoretical elegance can substitute for empirical verification in establishing computational capacity.

  5. **Costs and concessions**

  We surrender the exciting possibility that physics could surprise us with hypercomputation. We admit the Church–Turing Thesis is safe only because we rig the definition of "observation" to ensure it. We lose the ability to distinguish between "physically impossible" and "epistemically inaccessible." The debate shifts from "what can the universe do?" to "what can we say about what the universe does?"

  This is a humbling concession: science is not a mirror of nature's full capacity, but a map drawn by finite travelers. We forfeit the claim that the thesis is a deep law of physics; it is instead a law of scientific grammar. If this position is correct, the rationalist dream of empirically overturning computability theory is a category error. We are left with a universe that may be richer than our measurements, but a science that must remain silent about that richness. The cost is intellectual humility; the gain is coherence.
