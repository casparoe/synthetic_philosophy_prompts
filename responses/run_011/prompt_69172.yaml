answer: |-
  This is a classic problem in political philosophy and ethics, and you've stumbled onto something very close to what academics call the **"Principal-Agent Problem."**

  Your "Who Pays?" theory is a strong start because it identifies that corruption usually involves an external cost. But as you noticed, it leaks at the edges (specifically the customs officer and the sports hall).

  Here is a principle that tightens the screws, explains your gut calls, and tells you which ones might need adjusting.

  ### The Principle: "The Monetisation of Stewardship"

  Corruption isn't just about money changing hands, and it isn't just about who pays the cost. It is about **the conversion of a public (or organisational) duty into a private asset.**

  To be corrupt, three things usually need to align:
  1.  **Stewardship:** You hold a role where you are supposed to act for someone else's benefit (the public, the school, the council), not your own.
  2.  **Discretion:** You have the power to make a decision that allocates something scarce (a contract, a school place, a queue position, legal entry).
  3.  **Privatisation:** You allow a private interest (cash, family, gifts, future employment) to influence that decision, effectively "selling" or "trading" the stewardship that belongs to the public.

  ### Testing the Principle against your cases

  **1. The Plumber (Not Corruption)**
  *   **Verdict:** Consistent.
  *   **Why:** He has no **Stewardship**. He is a private citizen spending his own time. He isn't selling anything that belongs to the public.

  **2. The Councillor's Brother (Corruption)**
  *   **Verdict:** Consistent.
  *   **Why:** The councillor is a **Steward** of public funds. By steering the contract to family, he has **Privatised** that duty. Even at market rate, the *trust* was sold to a specific private interest (his brother) rather than the public good.

  **3. The Teacher's Chocolates vs. The Watch**
  *   **Verdict:** Consistent.
  *   **Why:** In July, the gift is too small to influence **Discretion**; it's a social token. In January, the watch is high-value and timed with the decision. It turns the teacher's **Stewardship** (fair admissions) into a transaction.
  *   **The March Watch:** Your principle says this is **Corruption**. Even if the kid didn't get in, accepting a high-value gift creates an *expectation* of future favour. It keeps the door open for privatising the duty later.

  **4. The MP's Consultancy (Corruption)**
  *   **Verdict:** Consistent.
  *   **Why:** This is the hardest one for people to accept because it's legal. But an MP is a **Steward** of the public interest. Selling a portion of their time/loyalty to a private company creates a conflict in their **Discretion**. Declaration exposes the corruption; it doesn't remove it.

  **5. The Queue Jump (Corruption)**
  *   **Verdict:** Consistent.
  *   **Why:** Health resources are stewarded based on *need*. Allowing payment to override need **Privatises** the allocation. You are selling a public right to the highest bidder.

  **6. The Customs Officer (Corruption, but...)**
  *   **Verdict:** Nuanced.
  *   **Why:** Technically, this is **Corruption**. He is a **Steward** of the law, and he is **Privatising** his enforcement for cash.
  *   **The Twist:** Your intuition is right to blame the setup. This is **Coercive Corruption**. When the system pays below survival wage, it forces the steward to sell their duty to eat. The *act* is corrupt, but the *moral blame* shifts to the system that created the coercion.

  **7. The Sports Hall (The Trouble Spot)**
  *   **Verdict:** **Inconsistent.** (You need to adjust your intuition here).
  *   **Why:** If this is a state school, the headteacher is a **Steward** of places allocated by catchment or merit. If the dad buys a place with a donation, that is the definition of **Privatising Stewardship**. It feels "fine" because the public gets a hall, but it violates the fairness of the queue. It turns a right (education) into a commodity.

  ### What this says about a new case

  Here is a case your principle handles clearly, which might test your gut:

  **The Case:** A fire chief retires. The next week, he takes a job as a safety consultant for the very warehouse he was inspecting for the last five years. He didn't take bribes while he was chief, and he declares the new job.
  **The Verdict:** **Corruption.**
  **Why:** Even if no money changed hands *during* the job, his **Stewardship** was compromised by the *prospect* of future private gain. He was effectively "banking" favour while he was still a public servant. This is often called the "Revolving Door."

  ### Which of your calls have to go?

  If you want to keep the principle simple and robust ("Don't sell the trust"), you have to sacrifice two of your intuitions:

  1.  **The Sports Hall:** You have to accept that buying a school place with a donation is corrupt (in a state system). It undermines the idea that the school serves the community equally. The "public benefit" of the hall doesn't justify the "private theft" of the queue position.
  2.  **The Customs Officer:** You have to accept that the *act* is corrupt, even if the *man* is a victim. Calling it "system corruption" is accurate, but the mechanism is still the individual selling their duty.

  ### Summary

  Your "Who Pays?" theory was close, but the real metric is **"Whose Trust Is Being Sold?"**

  *   If I sell my own time (Plumber), it's fine.
  *   If I sell the public's trust (Councillor, Teacher, MP, Customs, Queue), it's corruption.
  *   The only variable is whether the system *forced* me to sell it (Customs) or whether I chose to (MP).

  Does that align better with the way the pieces fit together?
