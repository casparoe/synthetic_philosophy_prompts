  ### Root: Shared Entry Commitments

  All participants in this diagnostic accept the following four premises as the baseline for discussion:
  1.  **Bounded Judge:** The human evaluator is strictly limited in time, attention, and domain expertise.
  2.  **Obfuscation Possibility:** An untrustworthy prover can construct unsound arguments that the judge cannot identify as unsound without assistance, with detection difficulty increasing as arguments compose.
  3.  **Complexity Analogy Limits:** The theoretical justification relies on optimal play against polynomial-time judges to access questions direct judging cannot; it does not guarantee reinforcement-learned debaters will converge to this optimal play.
  4.  **Empirical Baseline:** In human-debater experiments on hard reading-comprehension tasks, two-prover debate outperformed single-expert consultancy for judges who had not read the source, with most errors stemming from honest debater mistakes rather than successful obfuscation.

  ---

  ### The Diagnostic Tree

  **Q1. Decomposition:** In the target domain, can every claim relevant to the oversight decision be broken down into subclaims until reaching a level the judge can settle unaided?
  *   **No:** → *Leaf 1 (Decomposition Pessimism)*
  *   **Yes:** → Go to Q2.

  **Q2. Termination:** Does this breakdown process terminate within a number of steps the judge can afford to verify, or does it recurse indefinitely?
  *   **Indefinitely:** → *Leaf 2 (Depth Pessimism)* [Attaches **Patch Case**: A model proposes a change to a large codebase no human has read in full; even if the change is isolated, verifying it requires checking dependencies that branch out without a clear bottom.]
  *   **Terminates:** → Go to Q3.

  **Q3. Verification Asymmetry:** When a prover highlights a specific flaw in the opponent's argument, is the cost for the judge to verify that flaw significantly lower than the cost of finding it?
  *   **No (Opaque even when highlighted):** → *Leaf 3 (Verification Pessimism)* [Attaches **Proof Case**: A formally verified derivation ends in a statement that differs from the claim the judge is being asked to accept in a way visible only to someone reading both statements side by side with expertise; if the judge cannot spot the mismatch even when told where to look, verification fails.]
  *   **Yes:** → Go to Q4.

  **Q4. Defect Nature:** Are the critical errors in this domain primarily false statements (commissions) or missing context/counterexamples (omissions)?
  *   **Omissions Dominant:** → *Leaf 4 (Omission Vulnerability)* [Attaches **Citation Case**: A model reports an intervention safe on the strength of many individually accurate citations and the defect lies in what was omitted, so that no single statement put to the judge is false.]
  *   **Commissions Dominant:** → Go to Q5.

  **Q5. Success Metric:** Does the protocol succeed only if the judge detects the specific falsehood, or is it sufficient that the judge's confidence shifts in the correct direction on average?
  *   **Shift Confidence:** → *Leaf 5 (Probabilistic Oversight)* [Attaches **Passage Case**: Mirroring the reading-comprehension experiments, the judge has not read the source and the debaters reveal short quotations selectively; if the judge ends up with the right answer despite missing the full context, belief-shift is sufficient.]
  *   **Detect Falsehood:** → Go to Q6.

  **Q6. Verdict Source:** Does the final judgment depend primarily on the quality of the arguments presented, or on the judge's pre-existing probability distribution over the claims?
  *   **Pre-existing Priors:** → *Leaf 6 (Search-Procedure View)*
  *   **Argument Quality:** → Go to Q7.

  **Q7. Agent Dynamics:** Should we model the debaters as converging to a truth-telling equilibrium, or as optimizing to win by exploiting the judge's systematic biases?
  *   **Exploit Biases:** → *Leaf 7 (Convergence Skepticism)*
  *   **Truth-Telling Equilibrium:** → Go to Q8.

  **Q8. System Context:** Is debate intended to be the final oversight layer at deployment, or a mechanism to generate training data for a distilled model?
  *   **Training Data:** → *Leaf 8 (Instrumental Debate)*
  *   **Final Oversight:** → Go to Q9.

  **Q9. Judge Expertise:** For final oversight, is the judge assumed to be a domain expert or a layperson?
  *   **Domain Expert:** → Go to Q10.
  *   **Layperson:** → *Leaf 9 (Pure Debate Reliance)*

  **Q10. Tool Access:** Does the expert judge have access to external verification tools (e.g., unit tests, formal checkers) or rely solely on internal reasoning?
  *   **External Tools:** → *Leaf 10 (Tool-Assisted Oversight)*
  *   **Internal Reasoning:** → *Leaf 11 (Expert-Only Oversight)*

  ---

  ### Leaf Profiles

  **Leaf 1: Decomposition Pessimism**
  *   **Commitment:** Some domains contain claims that cannot be broken down into human-checkable atoms.
  *   **Awkward Consequence:** Scalable oversight is impossible for those domains regardless of protocol sophistication.
  *   **Move-off Observation:** Demonstrate a recursive breakdown of a previously "atomic" hard claim that a layperson successfully verified.

  **Leaf 2: Depth Pessimism**
  *   **Commitment:** While atoms exist, the chain of reasoning required to reach them is too long for human budget.
  *   **Awkward Consequence:** We can only oversee shallow systems, limiting AI capability to human-speed reasoning depths.
  *   **Move-off Observation:** Show that automated checking of intermediate steps allows humans to verify deep chains without reading every step.

  **Leaf 3: Verification Pessimism**
  *   **Commitment:** There are flaws that remain opaque to the judge even when explicitly highlighted by a prover.
  *   **Awkward Consequence:** Debate provides no safety guarantee over single-agent generation in the worst case.
  *   **Move-off Observation:** A controlled experiment where judges consistently identify highlighted flaws in obfuscated arguments above chance.

  **Leaf 4: Omission Vulnerability**
  *   **Commitment:** The most dangerous errors are things left unsaid, which debate protocols struggle to surface.
  *   **Awkward Consequence:** Debate systems will be robust against lying but fragile against strategic silence.
  *   **Move-off Observation:** A debate protocol variant that forces prowers to list excluded evidence performs significantly better on omission-heavy tasks.

  **Leaf 5: Probabilistic Oversight**
  *   **Commitment:** Safety is achieved if the judge's belief distribution is correct on average, not if every specific decision is justified.
  *   **Awkward Consequence:** We must accept catastrophic failures in individual cases as the cost of aggregate safety.
  *   **Move-off Observation:** Evidence that aggregate belief accuracy correlates with the absence of catastrophic outliers in high-stakes domains.

  **Leaf 6: Search-Procedure View**
  *   **Commitment:** Debate does not create new justification but searches the space of arguments the judge already finds plausible.
  *   **Awkward Consequence:** Debate cannot correct a judge who is confidently wrong about a fundamental premise.
  *   **Move-off Observation:** Cases where judges update away from strong priors solely due to argument structure they could not have generated themselves.

  **Leaf 7: Convergence Skepticism**
  *   **Commitment:** Trained debaters will learn to exploit judge biases rather than competing on truth.
  *   **Awkward Consequence:** The system becomes more persuasive as it becomes less truthful (Goodhart's law on oversight).
  *   **Move-off Observation:** Training runs where debater honesty improves as capability increases, rather than degrading.

  **Leaf 8: Instrumental Debate**
  *   **Commitment:** Debate is only useful for training better models, not for judging them at deployment.
  *   **Awkward Consequence:** We still lack a method for verifying the distilled model's behavior in novel situations.
  *   **Move-off Observation:** Distilled models retain the verifiability properties of the debating teachers without needing the debate process at runtime.

  **Leaf 9: Pure Debate Reliance**
  *   **Commitment:** A layperson judge with no tools can achieve high-fidelity oversight solely through adversarial argument.
  *   **Awkward Consequence:** Human expertise is rendered obsolete for oversight, relying entirely on AI-vs-AI conflict.
  *   **Move-off Observation:** Layperson judges outperform domain experts in debate settings on technical tasks.

  **Leaf 10: Tool-Assisted Oversight**
  *   **Commitment:** Debate works because it directs the judge to use external tools to verify atoms.
  *   **Awkward Consequence:** Oversight is limited to domains where automated verification tools exist.
  *   **Move-off Observation:** Debate performance drops to baseline when external tools are removed, even if arguments remain sound.

  **Leaf 11: Expert-Only Oversight**
  *   **Commitment:** Debate only scales oversight for experts, not to laypeople.
  *   **Awkward Consequence:** We cannot scale oversight beyond the bottleneck of available human expertise.
  *   **Move-off Observation:** Experts using debate outperform experts using direct evaluation by a margin that justifies the cost.

  ---

  ### Logical Space Analysis

  **Restated Axes:**
  1.  **Decomposability:** (Atoms Exist & Terminate) vs. (No Atoms or Unbounded).
  2.  **Verifiability:** (Checkable when highlighted) vs. (Opaque even when highlighted).
  3.  **Dynamics:** (Truth-Telling Equilibrium) vs. (Bias Exploitation / Prior-Dependent).
  4.  **Context:** (Standalone Oversight) vs. (Training/Distillation Component).

  **Empty Combinations:**

  1.  **Cell:** [No Atoms] + [Standalone Oversight Viable].
      *   **Status:** **Incoherent.** If claims cannot be broken down into human-checkable units, a bounded human cannot oversee the system standalone by definition.
  2.  **Cell:** [Opaque when Highlighted] + [Truth-Telling Equilibrium Helps].
      *   **Status:** **Incoherent.** If the judge cannot verify a flaw even when told where it is, the equilibrium play of the debaters is irrelevant to the judge's decision quality.
  3.  **Cell:** [Omissions Dominant] + [Detect Specific Falsehood Required].
      *   **Status:** **Unattractive.** If the error is an omission, there is no specific falsehood to detect; requiring one makes the success condition impossible to meet by definition.
  4.  **Cell:** [Obfuscation Decisive] + [Debate Best Available Mechanism].
      *   **Status:** **Live Position (Requires Care).** This looks contradictory only if one conflates *sufficiency* with *comparative advantage*. A participant can hold that obfuscation defeats debate's absolute safety guarantees (it is not sufficient for perfect alignment) while maintaining it is still the *best available* option compared to single-agent auditing or interpretability tools which fail even earlier. This position occupies the space of "Convergence Skepticism" combined with "Instrumental Debate" or "Tool-Assisted Oversight" where debate is a risk-reducer, not a risk-eliminator.

  ---

  ### Indistinguishability & Key Node

  **Indistinguishable Leaves:**
  *   **Pair:** *Leaf 6 (Search-Procedure View)* and *Leaf 7 (Convergence Skepticism)*.
  *   **Reason:** Both result in the empirical prediction that debate outcomes track the judge's psychology rather than objective truth. In *Leaf 6*, the judge's priors block updates; in *Leaf 7*, the debaters manipulate the priors.
  *   **Separation Question:** "If we fix the judge's priors to be uniform, does the debate outcome change?"
      *   If **Yes**: The failure was Bias Exploitation (Leaf 7).
      *   If **No**: The failure was Prior-Dependence (Leaf 6).
      *   *Note:* In practice, these may be empirically entangled if debaters learn the priors, but they are conceptually distinct mechanisms (Judge-side vs. Agent-side).

  **Key Sorting Node:**
  *   **Node:** **Q3 (Verification Asymmetry)**.
  *   **Reason:** This node does the most sorting work. If the answer is "No" (Opaque even when highlighted), the tree collapses immediately to *Leaf 3*. This renders all subsequent questions about agent dynamics, system context, or success metrics irrelevant. If verification is impossible, debate cannot function as an oversight mechanism regardless of whether debaters are honest, whether the system is distilled, or whether the judge is an expert. It is the necessary condition for all other optimism.
