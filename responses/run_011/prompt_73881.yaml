          *   The "Deflationary" camp assumes a rigorous empiricist *cannot* accept the evidence, so he *must* have remained agnostic.
          *   Both rely on what a "rational philosopher" looks like.
          *   The key is Sidgwick's notion of "probability." For him, 'belief' isn't binary. It's about weight of evidence.
          *   Progress = Stop asking about belief. Start asking about *warrant*.
