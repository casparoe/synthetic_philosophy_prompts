  2.  **Deconstruct the Four Camps:**
      *   *Continuity:* SPR = Ethics by other means. Survival solves the Dualism of Practical Reason. Belief is philosophical necessity.
      *   *Symptom:* SPR = Biographical coping mechanism. Ethics != SPR. Belief is psychological need.
      *   *Institutional:* SPR = Methodological experiment. Science of the unexplained. Belief is secondary to process.
      *   *Deflationary:* SPR = Agnostic inquiry. No real belief. Attributing belief is projection.

  3.  **Evaluate the User's Hypothesis vs. Alternatives:**
      *   *User's Hypothesis (Metaphysical Priors):* This is strong. If an interpreter thinks psi is impossible, Sidgwick *cannot* have believed it (Deflationary/Institutional). If they think it's possible/plausible, he *could* have (Continuity/Symptom). The principle of charity is indeed doing heavy lifting here. "Rational Sidgwick" looks different to a materialist than to a dualist.
      *   *Alternative 1 (Equivocation on Belief):* Also strong. Sidgwick's "belief" might not be "I know ghosts exist" but "This inquiry is worth £500 of my time." The camps talk past each other because they define 'engagement' differently.
      *   *Alternative 2 (Methodological Admissibility):* Weaker. Most agree institutional activity is evidence, they just weigh it differently.
      *   *Alternative 3 (Ill-posed Question):* Very strong. Sidgwick is an agnostic/utilitarian. He deals in probabilities, not certainties. Asking "Did he believe?" implies a binary state his philosophy rejects.

  4.  **Synthesize the Diagnosis:**
      *   The dispute is not *one* of these, but a conflation of the User's Hypothesis (Metaphysical Priors) and Alternative 1 (Equivocation on Belief), underpinned by Alternative 3 (The Ill-posed Question).
      *   *Core Argument:* The stalemate exists because "belief" is being treated as a binary ontological commitment, whereas for Sidgwick, it was a probabilistic warrant for inquiry. The interpreters' priors on psi determine what probability threshold counts as "rational belief."
      *   *The "Covert Metaphysical Work":* The user is right. If psi is nonsense, Sidgwick investigating it is irrational unless he didn't *really* believe (Deflationary) or was just doing method (Institutional). If psi is possible, investigating it is rational, so he might have believed (Continuity). The definition of 'rational' is the battleground.

  5.  **Determine What Counts as Progress:**
      *   *Can we solve it?* Probably not definitively, because we can't get inside Sidgwick's head, and the metaphysical priors of scholars won't change.
      *   *What helps?* Shifting the question from "What did he believe?" to "What function did the inquiry serve within his epistemology?"
      *   *Specific Proposal:* A formal reconstruction of Sidgwick's epistemic thresholds. Instead of asking "Did he believe in survival?", ask "What probability of survival was required to make the inquiry rational given his ethical system?"
