  **EXAMINATION PAPER**

  **Module:** PHIL/HIST 405: Necessity and Contingency in Historical Explanation
  **Assessment:** Take-Home Essay
  **Word Limit:** 1,500 words (±10%)
  **Total Marks:** 25

  **Instructions:**
  1.  Answer the question below.
  2.  Do not cite or name specific philosophers or historians. Refer to concepts and arguments descriptively (e.g., "the small-miracle account" rather than by author).
  3.  Do not attempt to verify or falsify the economic claims using actual historical data. The historical setting is hypothetical dressing; marks are awarded solely for modal and methodological analysis.
  4.  Answers that dismiss the argument solely on the grounds that "counterfactuals are untestable" or "history is too complex for determinism" will be capped at 8/25.

  **Question:**

  Consider the following argument presented by a fictional historian regarding British industrialization:

  > "Industrialization was inevitable by 1750. Consider three separate paths. First, had the atmospheric engine never been improved into an efficient rotative one, the progressive exhaustion of shallow coal seams would still have made mechanical drainage economically unavoidable; steam would have arrived on a slightly different schedule. Second, had parliamentary enclosure stalled, rising grain prices would still have made capital-intensive farming the profitable option for any rational landholder. Third, had the Atlantic trade been suppressed a generation earlier, the merchant capital already formed would have found domestic outlets, because textile demand was rising regardless. Because three separate roads, each with a different starting point removed, all arrive at the same destination, the destination was structurally fixed rather than contingent on any particular person, firm, or accident."

  Evaluate this argument. Your essay must address the semantics of the counterfactuals employed, the logical relationship between the three cases, and the justification for the claim of inevitability. Specifically, analyze whether the convergence of these three scenarios establishes structural necessity, or whether it conceals a modal error regarding the selection of background conditions and the construction of antecedents.

  ***

  **MODEL ANSWER**

  The historian's argument attempts to derive a modal claim (inevitability) from a set of counterfactual conditionals. While the strategy identifies a genuine feature of robust causal structures, it fails to establish inevitability due to errors in antecedent construction, sample independence, and the measure problem over possible worlds.

  First, the construction of the antecedents relies on an unstable semantics. To evaluate "Had the atmospheric engine never been improved," we must decide how to make this antecedent true. On a non-backtracking reading, we require a local miracle—a small violation of actual laws—to prevent the improvement while holding the past fixed. However, the historian assumes the background conditions (coal geology, economic pressure) remain intact. If the miracle is too local, it is unclear why the economic pressure persists without the technological context that created it. If we adopt a backtracking reading to preserve economic rationality, we must alter the past causes that led to the engine's development. This likely alters the coal seams or capital formation themselves, undermining the consequent. The historian assumes he can toggle specific causes while holding the structural background fixed, but without a justified account of which features are modally fragile and which are rigid, the counterfactuals are question-begging.

  Second, the three counterfactuals are not independent samples from a space of possible worlds; they are variations within a single structural scenario. The historian treats them as mutually independent roads, but they all share the same fixed background: specific coal geology, demographic pressure, and property institutions. He has not tested the outcome against worlds where *those* features differ. He has merely shown that within a narrow cluster of worlds where the structural background is held constant, the outcome is robust to specific local perturbations. This establishes redundancy, not inevitability. Convergence under hand-picked perturbations proves only that the actual world contains multiple sufficient conditions for industrialization, not that industrialization occurs in all nearby possible worlds.

  Third, there is a category error between redundant causation and necessity. The argument shows that if cause A fails, backup cause B produces the result. This is overdetermination or preemption. To move from "many sufficient causes" to "inevitable," one requires a measure over the relevant space of antecedent worlds. Inevitability implies that the outcome occurs in all (or nearly all) nearby worlds. The historian has shown it occurs in three specific subsets where the structural background is rigged to produce it. Without a justification for why this background is held fixed—why, for instance, we do not consider worlds where demographic pressure collapses—the claim of structural fixation is unsupported. The "structure" is simply the set of features the historian chose not to vary.

  However, the argument contains a weaker insight. If every potential defeater of the outcome is genuinely redundant—meaning there is a high density of sufficient conditions—then "inevitable" may be a defensible description of high probability, provided the measure problem is solved. If the space of worlds where industrialization fails is vanishingly small compared to the space where it succeeds, the outcome is robust. The historian correctly identifies that robustness depends on the density of sufficient causes. But he mistakes demonstrating three instances of redundancy for demonstrating a high density across the relevant modal space.

  To salvage the claim, the historian must define the metric for "nearby" worlds and justify the fixed background non-question-beggingly. He must show that the background features he holds constant are not themselves contingent causes of the outcome. Until then, the argument establishes only that the actual world was rich in sufficient causes, not that the outcome was necessary. The convergence is real, but it is a convergence within a single, unvaried structural model, not proof of trans-world necessity.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  | Point | Marks | Requirement | Typical Failure Mode |
  | :--- | :--- | :--- | :--- |
  | **1. Antecedent Construction** | 4 | Identifies the tension between local miracles and backtracking readings in making the antecedents true while holding background fixed. | Treating the antecedent as a simple factual subtraction without semantic cost. |
  | **2. Fixed Background** | 4 | Notes that the argument holds common background features (geology, institutions) fixed without justification. | Accepting the background conditions as naturally necessary rather than contingent. |
  | **3. Independence Critique** | 5 | Recognizes the three cases are variations inside one scenario, not independent samples from a modal space. | Treating the three examples as statistically independent evidence. |
  | **4. Redundancy vs. Necessity** | 5 | Distinguishes between having multiple sufficient causes (redundancy) and the outcome occurring in all nearby worlds (necessity). | Equating "many causes" with "inevitability" without modal qualification. |
  | **5. Measure Problem** | 4 | States that establishing inevitability requires a measure over the space of antecedent worlds. | Ignoring the need to define the scope of "nearby" possible worlds. |
  | **6. Avoidance of Skepticism** | 3 | Engages with the modal logic rather than dismissing counterfactuals as unknowable or history as too complex. | Retreating to generic skepticism about historical knowledge (cap at 8/25). |

  **Note on Generic Skepticism:** If the essay argues primarily that "we cannot know what would have happened" or "history is not a science," award no more than 3 marks for Point 6 and cap the total essay grade at 8/25 regardless of other insights.

  ***

  **DIFFERENTIATION AND RED FLAGS**

  **First-Class (A) vs. Competent (B)**
  *   **Competent (B):** Successfully identifies the six marking points as distinct checklist items. The student explains *that* the background is held fixed and *that* the measure problem exists. The critique is accurate but segmented; the connection between the semantic problem (Point 1) and the historiographical conclusion (Point 4) is functional but not integrated.
  *   **First-Class (A):** Integrates the semantic and historiographical critiques. The student explains *how* the choice of antecedent semantics (miracle vs. backtracking) directly dictates which background features can be held fixed, thereby dissolving the independence of the three cases. They articulate the "insight" half of the trap clearly: redundancy *could* imply inevitability *if* the measure were supplied, showing understanding of the conditionality rather than just the error.

  **Red-Flag Sentences (Indicators of Substituting Labels for Argument)**
  *   "History is too complex to make claims about inevitability."
  *   "Counterfactuals are inherently untestable and therefore useless."
  *   "Determinism is false because humans have free will."
  *   "The historian is ignoring the role of great men."
