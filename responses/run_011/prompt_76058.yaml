      *   *Stable reading:* No. There is no "gold standard" blood test for most psych disorders to calibrate against. Calibration is against *consensus*, not *nature*.
      *   *Lab conditions:* Thermometer implies a snapshot. Psych diagnosis is a narrative over time. Thermometer implies a passive object. Psych patient is an active agent.

  7.  **Being Fair to the Roommate:**
