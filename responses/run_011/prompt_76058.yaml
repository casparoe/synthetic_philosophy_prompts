      *   *Actually, the "Map" analogy is standard for a reason.* Let's refine the "Rumor" or suggest "Labeling Theory" specific imagery.
      *   *Decision:* I will propose **"A Diagnosis as a Public Infrastructure Project."** It builds roads (pathways to care) but changes traffic patterns (behavior).
      *   *Wait, keep it simple.* **A Diagnosis as a "Name".** Names identify but also shape identity.
