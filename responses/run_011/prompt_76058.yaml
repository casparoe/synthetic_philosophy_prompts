  2.  **Deconstruct the Roommate's Analogy (Thermometer):**
      *   *Core Claim:* Ontological realism. The disease exists independently of the classification. The classification is a passive tool.
      *   *Implication:* If the classification changes the patient, it's "noise" or "bias," not a fundamental feature of the system.
      *   *Strengths:* Works well for infectious disease, trauma, genetic conditions where biology is distinct from knowledge of biology.
      *   *Weaknesses:* Fails for conditions where knowledge of the condition alters the behavior/experience (interactive kinds).

  3.  **Deconstruct the User's Counter-Analogy (Rumor):**
      *   *Core Claim:* Social construction/Interaction. The label spreads, changes social context, alters self-conception.
      *   *Strengths:* Captures the feedback loop, the social stigma/benefit, the identity shift.
      *   *Weaknesses:* Implies falsity (rumors are often false), lacks institutional power (insurance, meds), implies passivity (you can't stop a rumor easily, but you can treat a condition).

  4.  **Drafting the Correspondence Table:**
      *   Thermometer -> Diagnostic Manual (DSM/ICD) + Clinician.
      *   Fever -> The underlying pathology/distress.
      *   Reading -> The Diagnosis Code.
      *   Measurement Error -> Comorbidity, misdiagnosis, *looping effects* (Roommate's view).
      *   Calibration -> Inter-rater reliability studies.
      *   Manufacturer -> APA/WHO (Psychiatry establishment).
      *   *Empty Slot:* The Fever knowing it has a fever. The Fever lobbying the Manufacturer.

  5.  **Identifying Critical Disanalogies (The "Meat"):**
      *   *Ontology:* Fevers are "indifferent kinds" (Hacking). Psych diagnoses are often "interactive kinds."
      *   *Feedback:* Thermometer doesn't change the heat. Diagnosis *does* change the behavior (self-fulfilling or self-negating).
