      *   *Actually, the best philosophical counter is Hacking's "Interactive Kind".* I should explain that rather than force a new metaphor. But the user asked for an analogy.
      *   *Let's try:* **A Diagnosis as a "Job Description."** It defines duties, grants pay (benefits), but applying for it changes how you work.
      *   *Okay, I'll stick with evaluating the Rumor and offering a refined version: "A Diagnosis as a Social Technology."*

  10. **Addressing Methodology:**
      *   Is blinding worth it? Yes. Reliability is necessary, just not sufficient.
      *   What's left over? Validity. The meaning of the category. The lived experience.

  11. **Refining the Tone:**
