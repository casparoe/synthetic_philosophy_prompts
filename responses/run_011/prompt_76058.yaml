  *(Self-Correction on the "Better Analogy"):* I think the best analogy is **"A Diagnosis as a Law."** Laws describe behavior but also prohibit/enable it, changing the behavior. Or **"A Diagnosis as a Currency."** It has value because we agree it does, and using it changes the economy.
  *Actually, let's go with **"A Diagnosis as a Map."** It's classic. A map of a city changes how people drive in the city. If you map a shortcut, people take it, traffic changes, the shortcut becomes a main road. The map isn't "wrong" when traffic changes; the territory responded to the map.*
