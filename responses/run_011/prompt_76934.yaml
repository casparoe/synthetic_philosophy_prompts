  ### The Move

  To move Term 3 by the largest margin, you would need a **formal demonstration of explanatory indispensability.**

  Specifically: A proof or rigorous model showing that **empirical adequacy cannot be defined or sustained without presupposing a robust truth property.**

  Currently, deflationists argue we can define empirical adequacy (the theory "saves the phenomena") without invoking truth. If a physicist or logician could demonstrate that "saving the phenomena" logically entails "correspondence to mind-independent facts" in a way that cannot be reduced to disquotation, $P_{exp}$ would rise sharply. Conversely, if a historical case study showed a theory that was empirically adequate and made novel predictions but was *not* "true" in any robust sense (and we can prove it wasn't), $P_{exp}$ would drop toward zero.

