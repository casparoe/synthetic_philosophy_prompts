  *(Self-Correction on the "Amateur" point)*: The user says the taxonomy is "completely useless." This is crucial. In science, utility protects the idea. If it's useless, the *only* thing that protects it is the beauty/narrative. This makes the "Priority" less about science and more about *authorship*. I need to emphasize that without utility, the "Winner" is whoever tells the better story, not whoever has the better data. This makes their situation more fragile than the scientists.

  *(Refining the Tiers)*:
  Tier 1: **The Architect.** (Lavoisier, Newton). The field looks different without them.
