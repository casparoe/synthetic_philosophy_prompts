prompt: |-
  I'm three years into a novel whose whole spine is a priority race: two people, in seperate countries, who land on the same result within about eighteen months of each other and don't know it. To get the texture right I've been reading around the real cases — Darwin and Wallace obviously, Newton and Leibniz over the calculus, Bell and Gray at the patent office, Scheele and Priestley and Lavoisier over oxygen, Lobachevsky and Bolyai, Whittle and von Ohain over the jet engine — and what's struck me is that they aren't all the same shape. In some of them the second arrival genuinely seems to have been robbed of something that mattered; in others the result looks so over-determined by where the field already was that whose name ended up on it is close to a coin flip, and the whole priority business is a social artifact rather than a real loss. I also keep running into the distinction between a "multiple" and a "singleton," and I suspect some of the famous multiples are contaminated — people who were in correspondence, or who'd seen each other's stuff — which makes the clean cases rarer than the list suggests.

  So: sort the well-documented cases into tiers by how much the individual actually mattered. Concretely — how different would the field's trajectory plausibly have been if the eventual winner had never been born and only the runner-up had lived, keeping everything else fixed? I don't want a survey of the cases and I definitely don't want a bibliography or a reading list; I want an ordering and a defense of it. Tell me which criteria you're weighting, because I can see at least three pulling in different directions: how far along the field already was (were the tools and the background results sitting there waiting to be picked up?); how much the particular formulation mattered downstream (did the version that won carry something the other lacked — a notation, a mechanism, a framing, a published date, a proof technique that others could actually use?); and how much the winner did with it afterwards (defending it, answering objections, gathering students, building the school that made it canonical). Say which of those you lean on heaviest and why, and be explicit about the cases you're demoting or promoting on grounds a reader would find counterintuitive. Then flag the one or two where you think the standard telling is most badly wrong — where the popular version ("so-and-so was clearly robbed" or "it was clearly inevitable") doesn't survive the actual details — because those are the shapes I most want to steal for the book. And if you think the whole frame is unstable because the answer depends on the time horizon, say that and show me how the tiers reshuffle when I ask about five years out versus fifty.

  One more wrinkle, which may or may not matter to you: my two characters aren't scientists. They're a retired surveyor and a woman who runs a dry-goods shop, both working out of the same regional library system, and what they've found is closer to an amateur taxonomy than a theory — it's completely useless, but it's beautiful, and neither of them has any institutional standing to defend it with. Does that change your ranking at all? Do the cases where the discovery had no practical consequences and no career attached behave differently from the ones where it launched an industry or a discipline, and if so, which way does that push my two hobbyists?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Task:** Sort well-documented scientific priority disputes (multiples) into tiers based on *individual impact* (counterfactual: how different would the field be if the winner never existed and only the runner-up lived?).
      *   **Constraints:** No survey, no bibliography, no reading list. Needs an ordering and a defense.
      *   **Criteria to Weight:**
          1.  Field readiness (inevitability/tools available).
          2.  Formulation impact (notation, framing, usability).
          3.  Winner's follow-through (defense, school-building).
      *   **Specific Requirements:**
          *   State which criterion is weighted heaviest and why.
          *   Highlight counterintuitive promotions/demotions.
          *   Identify 1-2 cases where the standard telling is wrong (the "shapes" to steal).
          *   Address time horizon instability (5 years vs. 50 years).
          *   Address the user's specific fictional scenario (amateurs, useless but beautiful taxonomy, no institutional standing) and how it affects the ranking logic.
      *   **Tone:** Analytical, authoritative, nuanced, tailored to a novelist seeking texture/truth.

  2.  **Deconstruct the Criteria & Weighting:**
      *   *Field Readiness (Inevitability):* High readiness = low individual impact. If everyone was there, the person matters less.
      *   *Formulation Impact:* High impact = high individual impact. If the winner's version enabled progress and the loser's didn't, the winner mattered more.
      *   *Follow-through:* High impact = high individual impact. Science is social.
      *   *Decision:* I need to weight **Formulation Impact** heaviest. Why? Because "inevitability" is a retrospective illusion, and "follow-through" is often about politics rather than the idea itself. The *shape* of the idea determines the trajectory. If the loser's version was unusable, they didn't really "discover" it in a functional sense. If the winner's version was merely a branding exercise, they didn't matter much. The *usability* of the insight is the bridge between the mind and the field.

  3.  **Drafting the Tiers (Mental Sorting):**
      *   *Tier 1 (High Individual Impact):* The winner brought something the loser *didn't*, changing the path. Newton/Leibniz is tricky (notation vs. proof). Darwin/Wallace is high inevitability but Darwin's depth mattered.
      *   *Tier 2 (Medium/Social Artifact):* The result was coming, but the winner secured the canon. Bell/Gray.
      *   *Tier 3 (Low Individual Impact/Inevitable):* Oxygen (Priestley/Scheele/Lavoisier). The gas was there; the interpretation varied.
      *   *Re-evaluating based on the prompt's specific counterfactual:* "If the winner had never been born and only the runner-up had lived."
      *   *Case: Newton vs. Leibniz.* If only Leibniz lived? Calculus happens, maybe slower, but notation is better. If only Newton? Calculus happens, notation is worse, British math stalls. *High individual impact on trajectory.*
      *   *Case: Darwin vs. Wallace.* If only Wallace? Evolution gets published, but lacks the massive evidence base of the *Origin*. Theory might be accepted slower or differently. *Medium-High.*
      *   *Case: Bell vs. Gray.* Telephone. Patent office race. If only Gray? He might have gotten the patent, but Bell built the company. *Medium (Business vs. Invention).*
      *   *Case: Oxygen.* Lavoisier understood what it *was*. Priestley found it but called it "dephlogisticated air." If only Priestley? Chemistry stalls in phlogiston theory longer. *High Impact for Lavoisier (interpretation).*
      *   *Case: Lobachevsky/Bolyai.* Non-Euclidean geometry. Both ignored. Gauss knew. If only one? Still ignored until Riemann. *Low immediate impact, High eventual.*

  4.  **Selecting the "Wrong Standard Telling" Cases:**
      *   *Darwin/Wallace:* Usually told as "Darwin stole it" or "Wallace was irrelevant." Truth: Wallace forced Darwin's hand, but Darwin's book made the theory *workable* for the field. Wallace's version was more teleological.
      *   *Bell/Gray:* Usually told as "Bell stole the idea." Truth: Gray's caveat was technically insufficient for a working telephone transmitter. It wasn't just a race; it was a difference in reduction to practice.
      *   *Selection:* I'll focus on **Darwin/Wallace** (the "robbery" myth vs. the evidentiary gap) and **Oxygen** (the "discovery" vs. "understanding" distinction).

  5.  **Addressing Time Horizons:**
      *   Short term (5 years): Priority matters for credit, funding, ego.
      *   Long term (50 years): Formulation matters for utility.
      *   *Shift:* Newton/Leibniz looks like a fight in year 5, but a divergence in year 50 (Continental vs. British math).

  6.  **Addressing the User's Fictional Scenario (The Amateurs):**
      *   *Context:* Surveyor + Shopkeeper. Useless but beautiful taxonomy. No institution.
      *   *Implication:* This moves the case out of "Scientific Priority" into "Folk Knowledge/Art."
      *   *Effect on Ranking:* In science, utility drives canonization. In art/taxonomy without utility, *narrative* drives canonization.
      *   *Advice:* Their lack of institutional standing makes them vulnerable to being erased *unless* the object itself is so compelling it survives without a defender. This aligns with the "Singleton" risk. If it's useless, no one *needs* it, so priority is purely aesthetic/historical.
      *   *Tier Shift:* They belong in a "Ghost Tier." Cases where the discovery exists but has no mechanism for propagation. (e.g., Mendel, but without the rediscovery).

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* I initially thought about putting Oxygen in Tier 1 for Lavoisier. But the prompt asks about the *race*. Scheele found it first. Lavoisier named it. If Scheele lived and Lavoisier didn't, does chemistry stall? Yes, because of Phlogiston. So Lavoisier matters more than Scheele, even if Scheele was first. This supports weighting "Formulation/Interpretation" over "First Arrival."
      *   *Critique:* Darwin/Wallace. If Darwin dies in 1858, Wallace publishes. Does evolution stick? Maybe not as firmly. Wallace was more spiritualist later. Darwin was the grindstone. So Darwin matters more for the *trajectory*, even if Wallace had the idea.
      *   *Weighting:* I will explicitly state that **Formulation/Interpretation** outweighs **Priority/Date**. Being first is useless if you are wrong about *what* you found (Priestley). Being second is winning if you make it usable (Leibniz's notation, Lavoisier's nomenclature).

  8.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the complexity, state the weighting criterion (Formulation/Usability).
      *   **The Tiers:**
          *   Tier 1: The Divergence (Winner changed the path).
          *   Tier 2: The Acceleration (Winner sped it up, but path same).
          *   Tier 3: The Artifact (Social construction, path identical).
      *   **The Myths:** Darwin/Wallace and Bell/Gray (or Oxygen). Let's go with Darwin/Wallace and Oxygen.
      *   **Time Horizons:** 5 vs 50 years.
      *   **The Amateur Wrinkle:** How "uselessness" changes the physics of discovery.

  9.  **Drafting the Content (incorporating the "Voice"):**
      *   Keep it sharp. No fluff.
      *   Ensure the "Surveyor/Shopkeeper" angle is integrated meaningfully, not tacked on.
      *   Make sure the "Counterintuitive" moves are clear (e.g., promoting Lavoisier over Priestley despite Priestley finding it first).

  10. **Review against constraints:**
      *   No bibliography? Check.
      *   Ordering and defense? Check.
      *   Criteria weighting explicit? Check.
      *   Counterintuitive cases? Check.
      *   Time horizon? Check.
