answer: |-
  Here is the ordering, weighted by the criterion I believe matters most for your novel's texture.

  ### The Weighting: Formulation Over Priority
  You identified three criteria: field readiness, formulation impact, and winner follow-through. I am weighting **Formulation Impact** heaviest.

  Priority disputes are often sold as races to a finish line, but that implies the finish line is a fixed point in nature. It isn't. It's a conceptual structure. Being the first to touch a phenomenon (Priority) matters less than being the one who builds the door others can walk through (Formulation). If the runner-up's version of the truth is unusable, obscure, or theoretically confused, they haven't actually "discovered" it in a way that alters history. Conversely, if the winner's version provides the notation, the mechanism, or the framing that allows the next generation to work, *they* determined the trajectory, regardless of who had the idea first.

  Priority is a legal claim; Formulation is an engineering constraint. For your purposes, the engineering constraint dictates the shape of the tragedy.

  ### The Tiers

  **Tier 1: The Divergence (High Individual Impact)**
  *If the winner had never been born, the field looks fundamentally different.*
  *   **Lavoisier vs. Priestley/Scheele (Oxygen):** Priestley and Scheele isolated the gas first. But they saw it through the lens of phlogiston. Lavoisier didn't just find the gas; he destroyed the old chemistry to make room for it. If Lavoisier dies, chemistry likely stagnates in phlogiston theory for decades. The "discovery" wasn't the substance; it was the interpretation.
  *   **Newton vs. Leibniz (Calculus):** This is often called a tie, but it isn't. If only Newton lives, British mathematics becomes insular and stagnant due to his fluxional notation. If only Leibniz lives, the Continental notation (which we use today) spreads faster, but the physical grounding might lack Newton's *Principia* weight. The *trajectory* of math depends entirely on which notation wins. The individual mattered because they built the language, not just the math.

  **Tier 2: The Acceleration (Medium Individual Impact)**
  *If the winner had never been born, the result arrives via the runner-up, but slower, weaker, or with less authority.*
  *   **Darwin vs. Wallace (Evolution):** This is the most counterintuitive promotion. Wallace had the idea of natural selection first (or concurrently). But Wallace's version was more teleological; he believed in spiritual intervention for the human mind. Darwin's *Origin* provided the grinding, evidentiary mass that made the theory bulletproof. If Darwin dies in 1858, Wallace publishes. Evolution enters the conversation, but it lacks the defensive armor Darwin built. It might have been dismissed as a speculation rather than established as a paradigm. Darwin didn't just win the race; he built the stadium.
  *   **Bell vs. Gray (Telephone):** Gray had the variable resistance idea. Bell had the working system and the legal/patent machinery. If Bell vanishes, Gray (or others) likely gets a working phone soon. But Bell created the *industry*. The technology might have remained a curiosity or a fragmented set of patents without the corporate vehicle Bell constructed.

  **Tier 3: The Artifact (Low Individual Impact)**
  *If the winner had never been born, the result arrives via the runner-up with negligible difference to the field.*
  *   **Lobachevsky vs. Bolyai (Non-Euclidean Geometry):** Both published independently. Both were ignored. The field didn't move until Riemann. The priority dispute here is almost entirely a social artifact of later historians trying to find heroes. The "loss" to Bolyai was personal, not scientific.
  *   **Whittle vs. von Ohain (Jet Engine):** Both were working in the late 30s. The physics were ripe. The war demanded it. If Whittle vanishes, von Ohain's engine flies in Germany, and the tech transfers post-war. The timeline shifts by months, not decades.

  ### The Counterintuitive Moves
  1.  **Promoting Lavoisier:** Common wisdom says Priestley discovered oxygen. I am demoting Priestley to Tier 3 (The Claimant) and promoting Lavoisier to Tier 1 (The Architect). Priestley found a piece of the puzzle but tried to force it into the wrong picture. Lavoisier drew the new picture. For your novel, this suggests that *understanding* what you have found is more important than finding it.
  2.  **Demoting Wallace:** Wallace is often romanticized as the robbed man. I am placing him in Tier 2. He wasn't robbed of the *credit* so much as he was incapable of carrying the *weight*. His formulation lacked the secular rigor Darwin's had. The "robbery" was actually a selection pressure.

  ### The Broken Stories (Steal These Shapes)
  These are the cases where the popular narrative collapses under scrutiny.

  **1. The "Robbery" that was actually a "Rescue" (Darwin/Wallace)**
  *The Myth:* Darwin sat on the idea for 20 years and only published when Wallace forced his hand, effectively stealing Wallace's thunder.
  *The Reality:* Wallace sent Darwin his paper in 1858. Darwin was terrified. But the scientific community (Lyell/Hooker) arranged the joint reading at the Linnean Society specifically to protect *both*. The "robbery" narrative ignores that Wallace *welcomed* Darwin's intervention. Wallace knew his own paper was a sketch; Darwin's was a fortress. Wallace didn't want to be the sole father of a theory he knew was vulnerable.
  *   **The Shape for your book:** The runner-up *knows* they can't defend the discovery. They don't want the crown; they want the idea to survive. The tragedy isn't that the winner stole it, but that the runner-up is relieved to surrender it because they lack the stamina to defend it.

  **2. The "Inevitability" that was actually "Specific Reduction" (Bell/Gray)**
  *The Myth:* Bell stole the concept of the telephone from Gray at the patent office.
  *   **The Reality:* Gray filed a *caveat* (a notice of intent), not a full patent. Crucially, Gray's design used a liquid transmitter that was theoretically sound but practically unstable for speech. Bell's design worked. The patent office didn't choose Bell because of corruption; they chose him because Gray hadn't reduced the invention to a working practice.
  *   **The Shape for your book:** The tragedy isn't theft; it's *incompleteness*. One character has the beautiful, abstract truth (Gray/Wallace). The other has the messy, working mechanism (Bell/Darwin). The library system (the patent office) cannot catalog the abstract truth. It requires the mechanism.

  ### The Time Horizon Instability
  The tiers reshuffle violently depending on your clock.

  *   **5-Year Horizon:** Priority is everything. Credit, funding, reputation. In this window, **Tier 3 (The Artifact)** cases look like Tier 1 tragedies. Bolyai's madness and death look like a direct result of being scooped. The social loss is real, even if the scientific loss is zero.
  *   **50-Year Horizon:** Formulation is everything. The names fade; the notation remains. In this window, **Tier 1 (The Divergence)** cases are the only ones that matter. Nobody cares who filed the patent first; they care which notation is in the textbook.
  *   **The Shift:** If your novel is about the *lives* of the characters, you are writing the 5-Year Horizon. If it is about the *legacy* of the taxonomy, you are writing the 50-Year Horizon.
  *   **Recommendation:** Write the 5-Year Horizon for the conflict, but haunt it with the 50-Year Horizon. The characters should sense that in fifty years, no one will care who was first, only who was *right*. That creates a specific kind of despair: fighting for a victory that history will render meaningless.

  ### The Amateur Wrinkle: Useless Beauty
  Your characters are a surveyor and a shopkeeper. Their taxonomy is "useless but beautiful." This changes the physics of the priority dispute entirely.

  In the cases above, **Utility** acts as a preservation engine. Even if the discoverer is forgotten, the *use* of the discovery keeps it alive (calculus, jets, telephones). Utility forces the field to resolve the priority dispute eventually, because people need to know who owns the patent or the theory.

  **Your characters have no utility.**
  This pushes them into a **Tier 4: The Ghost.**
  *   **The Risk:** Without utility, there is no pressure to canonize the discovery. It can vanish completely.
  *   **The Defense:** Without utility, the *only* thing that protects the discovery is the **aesthetic compellingness** of the presentation.
  *   **The Ranking Shift:** In science, the "Winner" is often the one with the best institution. In amateur taxonomy, the "Winner" is the one with the best *story*.

  **How this affects your ranking:**
  It makes the **Formulation** criterion absolute. Since there is no practical application to validate the work, the *beauty* of the taxonomy is the only validation.
  *   If Character A has the data but Character B has the *language* to describe its beauty, Character B wins.
  *   If neither has institutional standing, the "Priority" is not decided by a patent office or a journal, but by whoever finds a patron or a publisher.

  **The specific tragedy for your book:**
  In the scientific cases, the loser is often robbed of *credit*. In your amateur case, the loser is robbed of *existence*. Because the taxonomy is useless, if it isn't published and celebrated as art, it is effectively trash.
  *   **Steal this:** The "Multiple" isn't a race for priority; it's a race for *witness*. They don't need to prove they were first; they need to prove it was *seen*.
  *   **The "Contaminated" Multiple:** You mentioned worrying about correspondence. In your case, the contamination should be the library itself. They are using the same books, the same maps, the same regional data. They aren't stealing from each other; they are being fed by the same source. The tragedy isn't that one stole from the other, but that the *place* produced the idea, and the people were just the vessels. The library is the true discoverer.

  **Final Advice on the "Wrong Telling":**
  Focus on the **Darwin/Wallace** dynamic but invert the power. Make your "Darwin" character (the one with the standing/method) terrified of the "Wallace" character (the one with the pure insight). The professional knows the insight is fragile without the method; the amateur knows the method is hollow without the insight. They need each other to make the discovery real, but the system (the library, the publishing world) forces them into a binary: one name on the spine.

  The "robbery" isn't that one stole the idea. It's that the system requires a single author for a discovery that was inherently dual. That is the social artifact you identified. Make that the antagonist.
