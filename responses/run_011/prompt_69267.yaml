      *   *Prima Facie vs. Actual Duties (Ross):* This is a standard move to dissolve dilemmas. Ross himself was ambiguous about whether *actual* dilemmas exist. The friend interprets Ross as saying "no real conflicts." Many ethicists agree with this interpretation as a way to preserve rationality in ethics. *Verdict:* Fair simplification of a dominant view, but not the *only* view.
