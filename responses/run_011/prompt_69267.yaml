answer: |-
  Your instincts are spot on: your friend's argument is a very classic, tidy position in meta-ethics (often associated with moral rationalism or Kantianism), but it is certainly not a settled "proof". It is a substantive philosophical claim that many serious ethicists reject.

  Here is a breakdown of the argument claim by claim, distinguishing between what is standard theory, what is a simplification, and where the logic arguably fails.

  ### 1. "Ought implies can" and the dissolution of conflict
  **Verdict:** *Contentious application of a standard principle.*

  The principle "ought implies can" is widely accepted. However, your friend's application of it here is where the first crack appears. He argues that because you cannot do *both* A and B, you cannot be obliged to do the one you end up not doing.

  A defender of genuine dilemmas would point out a logical slip here. In a dilemma, you *can* keep the promise (but then you lie), and you *can* tell the truth (but then you break the promise). You are not incapable of doing either individual act; you are only incapable of doing the *conjunction* of both.

  To get to your friend's conclusion, one must assume the **Principle of Agglomeration**: that if you ought to do A and you ought to do B, you ought to do (A and B). Many philosophers deny this. They argue you can have two genuine obligations that clash, and the fact that you can't fulfil both doesn't make one of them vanish; it just means you are destined to violate one. Your friend is assuming that morality must be logically consistent in a way that prevents clashes, which is exactly what the debate is about.

  ### 2. Ross and *Prima Facie* Duties
  **Verdict:** *Fair simplification, but not the whole story.*

  Your friend is correct that W.D. Ross introduced *prima facie* duties to handle conflicts. On Ross's view, when duties clash, one becomes your actual duty "all things considered", and the other recedes.

  However, Ross himself was somewhat ambiguous about whether the overridden duty disappears entirely. A defender of dilemmas would argue that even if a duty is overridden, it retains moral force. It doesn't just evaporate. Your friend treats *prima facie* duties as merely "apparent" duties that turn out to be fake once the maths is done. Defenders of dilemmas treat them as "pro tanto" duties: genuine obligations that can be outweighed but not erased. So, while your friend is accurately describing one way to read Ross, he is presenting a contested interpretation as a fact.

  ### 3. Sartre's Student
  **Verdict:** *Mistake (Question-begging).*

  This is the weakest part of the note. Sartre's example was explicitly designed to show a situation where there *is* no calculable right answer. The conflict between caring for a dependent parent and fighting for a political cause involves incommensurable values.

  Your friend claims Sartre "hadn't done enough moral thinking." This begs the question. It assumes there *is* a hidden correct answer waiting to be found if one thinks hard enough. A defender of dilemmas would say Sartre saw clearly that no amount of thinking resolves the conflict, because the values themselves (family loyalty vs. political justice) do not sit on a single scale where one can be weighed against the other. Dismissing Sartre as confused simply asserts your friend's conclusion rather than proving it.

  ### 4. The Guilt and Apologies Move (The "Residue")
  **Verdict:** *Mistake (You were right to be suspicious).*

  You have a vague memory of this argument being used in the opposite direction, and your memory is correct. This is often called the argument from **moral residue**.

  Your friend argues: *If you feel guilt or owe an apology, you must have done the wrong thing. Therefore, there was a right thing you failed to do.*

  Defenders of genuine dilemmas argue the exact opposite: *The fact that you feel guilt (and should feel guilt) even when you chose the best available option proves that you still violated a genuine obligation.*

  Consider a tragic case: a lifeboat is overloaded, and you must throw one person off to save the rest. You choose the "least worst" option. You save the many. According to your friend, you did exactly what you ought to have done, so there should be "nothing to apologise for." But surely, you *do* owe an apology (or at least regret) to the person you sacrificed. If your friend is right, that guilt is irrational. If the dilemma theorist is right, the guilt is rational and appropriate because a real duty to that person was violated, even if overriding it was necessary.

  The residue doesn't prove you made a mistake; it proves the situation was tragic. Your friend assumes that if an action is "all-things-considered right," it leaves no moral trace. That is a claim he needs to argue for, not one he can use as proof.

  ### 5. The Two Conclusions: Conflict vs. Dirty Hands
  **Verdict:** *Distinct claims; the second does not follow from the first.*

  You asked whether his two conclusions are the same. They are not, and conflating them is a significant error.

  1.  **No Conflict of Duties:** This is the claim that there is always one single right answer (the "uniqueness thesis").
  2.  **No Dirty Hands:** This is the claim that if you do the right answer, you have not done anything wrong.

  One can consistently hold the first view but reject the second. This is the position of "Dirty Hands" theorists (like Max Weber or Michael Walzer). They might agree that there is a single right thing to do in a crisis (e.g., authorise torture to stop a bomb), but insist that doing the right thing still involves committing a moral wrong (torture).

  Your friend argues that because there is one right thing to do, you emerge with clean hands. But many people believe that politics and morality sometimes require us to do wrong in order to do right. By treating these as the same point, your friend is skipping over the possibility that the "right" action can still be morally tainted.

  ### Summary for your sanity check

  *   **What he gets right:** He accurately describes a coherent, rationalist framework (Kantian/Rossian) where morality is consistent and contradictions are impossible. It is a defensible position, but it is not a *proof*.
  *   **What is too quick:** The application of "ought implies can." He assumes that because you can't do everything, some obligations must vanish, rather than acknowledging that obligations can clash.
  *   **The Guilt Argument:** He has this backwards. The persistence of guilt is the primary evidence *for* dilemmas, not against them. It suggests that overridden duties still have weight.
  *   **The Conclusions:** He conflates "there is a right answer" with "the right answer is morally pure." One can accept the former and deny the latter.

  **Bottom line:** Your friend has written a competent summary of a specific, conservative ethical viewpoint. However, he presents it as a logical deduction that settles the matter. It does not. It relies on several premises (Agglomeration, the nature of residue, the commensurability of values) that are hotly disputed. If you repeat this to others, you should frame it as "one side of the debate" rather than "the solution."
