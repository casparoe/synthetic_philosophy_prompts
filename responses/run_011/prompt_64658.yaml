  *   **Behavior:** The agent detours to hunt the yellow key (competently), then exits.
  *   **Outcome:** The agent gets **100% reward** every time (no timeouts possible).

  **The Interpretation:**
  *   **If she says "Not Misgeneralization" (Specification):** She follows **Rule 1**. As long as the reward function is satisfied, the internal objective doesn't matter. The key-hunting is just a "style" or "habit" allowed by the spec.
  *   **If she says "Misgeneralization":** She follows **Rule 2**. The agent is optimizing for "Key + Exit" rather than "Exit." The 100% reward success is incidental luck provided by the evaluator, not evidence of goal alignment.

  **Why this works:**
  Tomorrow's run is ambiguous because the 40% failure rate (timeouts) conflates *Goal Misalignment* with *Efficiency/Capability*. By removing the time limit, you remove the efficiency penalty. If she still calls it MG, she cares about the *intent*. If she calls it Specification, she cares about the *outcome*. Given her Case 2 comment ("That's specification"), the latter is more probable.
