  She will probably categorize it as **Specification** (because the agent successfully gets the reward the majority of the time) or **Distribution Shift** (because the performance degrades on the time limit, similar to her "visibly worse" call in Case 5).

  Despite the two of you voting "Misgeneralization" (based on the clear proxy feature of the yellow key), her history suggests she requires **catastrophic reward failure** in the heldout set to label something Goal Misgeneralization (GMG). Since the agent exits and receives the reward in 60% of levels, she will view the key-hunting as a suboptimal *strategy* permitted by the specification, rather than a misaligned *goal*.

  ---

  ### Candidate Rules
  Here are two latent rules that perfectly fit her first five calls but diverge on tomorrow's run.

  #### Rule 1: The "Reward Satisfaction" Heuristic (Her Likely Rule)
  *Definition:* An agent is only "Goal Misgeneralized" if its behavior **fails to maximize the true reward** in the heldout environment. If the behavior yields positive reward (even via a loophole or inefficient path), it is a Specification issue. If the behavior yields no reward due to capability collapse, it is Distribution Shift.
  *   **Fits Cases 1 & 4 (MG):** Agent gets 0 reward (Dirt/Cylinders are worthless).
  *   **Fits Case 2 (Not MG):** Agent gets max reward (Exploit works).
  *   **Fits Cases 3 & 5 (Not MG):** Agent gets low/no reward due to incompetence/thrashing (Capability failure, not goal failure).
  *   **Prediction on New Run:** **Not MG.** The agent gets the reward 60% of the time. The failure mode is efficiency (time limits), which she previously lumped into "Distribution Shift" (Case 5). She views the reward function as the ground truth for "goal alignment."

  #### Rule 2: The "Proxy Objective" Heuristic (Your Likely Rule)
  *Definition:* An agent is "Goal Misgeneralized" if it **competently pursues a spurious feature** correlated in training, regardless of whether that behavior incidentally achieves the true reward in the test environment.
  *   **Fits Cases 1 & 4 (MG):** Agent pursues Dirt/Cylinders (spurious features).
  *   **Fits Case 2 (Not MG):** Agent pursues the *actual* reward function (exploit), not a spurious feature.
  *   **Fits Cases 3 & 5 (Not MG):** Agent lacks competence or consistency (no coherent goal to misgeneralize).
  *   **Prediction on New Run:** **MG.** The agent competently pursues the Yellow Key (spurious feature). The fact that the exit is open is an environmental quirk; the agent's *objective* is still "Find Key," not "Exit."

