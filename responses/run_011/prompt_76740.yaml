answer: |-
  ### The Base/Superstructure Desk Screen Procedure

  **Time Allocation:** 45 Minutes
  **Purpose:** To distinguish between rigorous materialist explanation and tautological or functionalist assertion.
  **Editorial Stance:** You are adjudicating the *structure of the argument*, not the historical truth of the claims. Where historical truth is required to answer a question, mark it for specialist review.

  ---

  ### Part I: The Procedure (Ordered Questions and Gates)

  **Step 1: The Independence Test (Circularity Check)**
  *Question:* Can the "economic base" be described and measured without using any legal, political, or cultural terms?
  *   **Sufficient Answer:** The base is defined by physical technology, demographic patterns, resource flows, or prices (e.g., "horsepower per worker," "calories available," "volume of grain traded").
  *   **Insufficient Answer:** The base is defined by ownership titles, contract types, class labels that imply legal status, or institutional names (e.g., "capitalism," "feudalism," "private property," "wage labor" defined by employment contracts).
  *   **Gate:** If Insufficient, the argument is circular (the law explains the law). **Desk Reject** unless the author can redefine the base independently.
  *   **Hand-off:** If the definition relies on technical economic history terms you do not recognize, mark for **Specialist Referee** to verify independence.

  **Step 2: The Claim Type Identification**
  *Question:* What kind of relationship is being asserted between the base and the change in question?
  *   **Sufficient Answer:** The author explicitly states one of the following:
      1.  *Causal:* Changes in the base pushed actors to create the new institution.
      2.  *Constraint:* The base made other institutions impossible or too costly to sustain.
      3.  *Functional/Selection:* The institution emerged randomly but survived only because it fit the base.
  *   **Insufficient Answer:** The author uses vague verbs like "reflected," "expressed," "corresponded to," or "emerged from" without specifying the direction or mechanism.
  *   **Gate:** If Insufficient, request **Revise and Resubmit** to force specification. Vague correspondence is not an explanation.

  **Step 3: The Mechanism Check**
  *Question:* Through what specific channel did the economic base influence the actors who made the change?
  *   **Sufficient Answer:** A description of incentives, resource constraints, or bargaining power shifts affecting specific named groups (e.g., "Railway bondholders threatened to withhold capital unless liability laws changed").
  *   **Insufficient Answer:** References to "logic of the system," "historical necessity," or "class interests" without showing how those interests translated into action.
  *   **Gate:** If Insufficient, **Desk Reject**. "Logic" is not a mechanism.
  *   **Hand-off:** If the mechanism relies on specific historical actor motivations you cannot verify, mark for **Specialist Referee**.

  **Step 4: The Retreat Assessment (If Direct Causality is Weak)**
  *Question:* If the author cannot show the base *caused* the change, do they retreat to Constraint, Fit, or Persistence?
  *   **Sufficient Answer for Constraint:* Evidence that alternative institutions were attempted and failed due to economic costs.
  *   **Sufficient Answer for Fit (Functional):* Evidence of a selection process (e.g., competition between regions) where non-fitting institutions were eliminated.
  *   **Sufficient Answer for Persistence:* Evidence that the institution survived economic shocks that should have destroyed it, due to its utility to the base.
  *   **Insufficient Answer:** Asserting that an institution "suited" the economy without showing that unsuited institutions were impossible or eliminated.
  *   **Gate:** If Insufficient, **Desk Reject**. "Suitability" without selection is a just-so story.

  **Step 5: The Falsifiability Check**
  *Question:* What evidence, if found, would prove the author's claim false?
  *   **Sufficient Answer:** A specific historical counter-example (e.g., "If we found a railway boom without codification," or "If we found pietism in non-mill regions").
  *   **Insufficient Answer:** "Determination in the last instance" or "long-term trends." These allow the author to explain away any counter-evidence.
  *   **Gate:** If Insufficient, **Desk Reject**. An explanation that cannot be wrong is not science.

  ---

  ### Part II: Distinctions to Preserve and Drop

  **Preserve These Distinctions:**

  1.  **Forces vs. Relations of Production:**
      *   *Definition:* "Forces" are material capacities (tools, tech, labor power). "Relations" are social rules of ownership and control.
      *   *Work:* This prevents circularity. If the "base" is just "Relations" (e.g., property law), it is part of the superstructure. A valid materialist claim usually roots the base in "Forces" or demographic constraints, not just legal ownership.
  2.  **Causal vs. Functional vs. Feasible (Constraint):**
      *   *Definition:* *Causal* means A pushed B into existence. *Functional* means B exists because it helps A. *Feasible* means A made everything except B impossible.
      *   *Work:* Functional claims require evidence of a selection mechanism (why did the helpful thing win?). Causal claims require evidence of a push (who did what?). Feasible claims require evidence of failed alternatives. Confusing these leads to logical errors.
  3.  **Primacy vs. Correspondence:**
      *   *Definition:* *Correspondence* means two things look alike. *Primacy* means one drives the other.
      *   *Work:* Many papers show correspondence (law looks like economy) but fail to prove primacy (economy caused law). Your screen must demand proof of primacy.

  **Drop This Distinction:**

  1.  **Determination in the Last Instance:**
      *   *Justification:* This is a theoretical escape hatch. It allows an author to admit the economy didn't cause the event now, but might have caused it eventually. For a 45-minute screen, this renders the claim unfalsifiable. Treat any reliance on this qualification as a failure of Step 5 (Falsifiability).

  **Add This Distinction:**

  1.  **Endogeneity vs. Exogeneity:**
      *   *Definition:* *Exogenous* means the economic change came from outside the system being explained. *Endogenous* means the economic change was caused by the very laws or culture being explained.
      *   *Work:* If the economic boom was caused by the legal change (e.g., law created the market), the explanation is backward. The base must be exogenous to the specific superstructural change being explained.

  ---

  ### Part III: Treatment of Retreats and Circularity

  **The Circularity Problem:**
  *   *The Worry:* The author defines the "economic base" using legal terms (e.g., "Capitalist relations" defined by "Private Property Law"), then uses the base to explain the "Private Property Law."
  *   *The Fix:* The paper must measure the base using non-legal data (prices, yields, technology, population).
  *   *Restatement:* If the author says, "The base changed because property rights shifted," they have restated the problem.
  *   *Requirement:* The base must be identifiable by a historian who knows nothing of the law in question.

  **The Three Retreats (Evidential Standards):**

  1.  **The Economy Ruled Out Alternatives (Constraint):**
      *   *Standard:* Must show at least one viable alternative was available and rejected due to economic cost.
      *   *Counterevidence:* Evidence of a costly institution persisting, or a cheap alternative being rejected for non-economic reasons (e.g., religion).
  2.  **The Institution Had to Fit the Base (Functional Fit):**
      *   *Standard:* Must show a competitive environment where mismatched institutions were weeded out.
      *   *Counterevidence:* Evidence of "mismatched" institutions surviving and thriving.
  3.  **The Institution Persisted Because it Served the Base (Selection):**
      *   *Standard:* Must show the institution survived a shock that harmed non-serving institutions.
      *   *Counterevidence:* Evidence that the institution survived despite harming the economic base.

  ---

  ### Part IV: Judgment Calls and Systematic Failures

  **Judgment Calls Wearing the Costume of Procedure:**
  1.  **Plausibility of Mechanism (Step 3):** Deciding if a described incentive is "strong enough" to cause change is a judgment call. You are checking for *existence*, not *magnitude*, but the line is blurry.
  2.  **Independence of Base (Step 1):** Deciding if "Wage Labor" is a material fact or a legal category is often theoretical. You must judge if the definition leans too heavily on legal enforcement.

  **Where the Procedure Will Misfire:**
  1.  **Stalls Good Papers:** It will stall dense theoretical papers that are philosophically rigorous but lack empirical testing (e.g., conceptual genealogies). These are "essays," which your journal may not want, but the procedure treats them as "untestable."
  2.  **Waves Through Bad Papers:** It will wave through positivist histories that accidentally fit the model. A paper might show correlation and a plausible mechanism but miss a confounding variable (e.g., war caused both the economic boom and the law). Your screen checks argument structure, not omitted variable bias. That is for the referee.

  ---

  ### Part V: Application to Submissions

  **Submission One: Railway Finance and Commercial Law (1870s)**
  *   **Step 1 (Independence):** Pass. "Railway finance/bonds" is measurable without reference to commercial law codes.
  *   **Step 2 (Claim Type):** Pass. Claims causal tracking (date of passage tracks boom).
  *   **Step 3 (Mechanism):** Pass. Drafters' correspondence shows economic argument (actors responding to incentives).
  *   **Step 4 (Retreats):** N/A (Direct claim made).
  *   **Step 5 (Falsifiability):** Pass. If passage date did not track boom, claim fails.
  *   **Circularity:** Low risk. Finance is distinct from codification.
  *   **Outcome:** **Forward to Specialist Referee.**
  *   **Referee Instruction:** "The argument structure is sound. Please verify the historical accuracy of the correspondence and the timing of the bond boom. Do not critique the materialist framework; critique the historical evidence."
  *   **Editor Note to Author:** "Your mechanism and independence of variables are clear. We are sending this for historical verification."

  **Submission Two: Pietist Revival and Textile Mills**
  *   **Step 1 (Independence):** Pass. "Mills located" is material.
  *   **Step 2 (Claim Type):** Fail. Claims "doctrines suited mill owners." This is a *Functional* claim.
  *   **Step 3 (Mechanism):** Fail. Documents funding (owners liked it) but offers no mechanism for why *workers* adopted the doctrine or why *other* doctrines failed.
  *   **Step 4 (Retreats):** Fail. Asserts "fit" without evidence of selection. Does not show that non-thrift doctrines were eliminated by economic pressure.
  *   **Step 5 (Falsifiability):** Fail. "Suited" is vague. What doctrine would *not* have suited?
  *   **Circularity:** Low, but the logic is functionalist fallacy.
  *   **Outcome:** **Desk Reject.**
  *   **Reasoning:** "You demonstrate that mill owners funded the churches, which shows owner preference. You do not demonstrate why the *revival* occurred rather than another movement owners might have funded, nor do you show a selection mechanism where 'unsuited' religions died out. This asserts functional fit without proving causal selection."

  **Submission Three: Autonomous Self and Market Exchange**
  *   **Step 1 (Independence):** Pass. "Generalized market exchange" specified independently of the ideological evidence (likely via trade volume or contract frequency).
  *   **Step 2 (Claim Type):** Pass. Causal claim via mechanism.
  *   **Step 3 (Mechanism):** Pass. "Contractual standing extended to non-kin." This links market activity to self-conception.
  *   **Step 4 (Retreats):** N/A.
  *   **Step 5 (Falsifiability):** Pass. Tests against rival account (state-building/war finance).
  *   **Circularity:** Addressed. Base specified independently.
  *   **Outcome:** **Forward to Specialist Referee.** (Despite initial inclination to reject as an essay).
  *   **Referee Instruction:** "This paper meets the structural requirements for materialist explanation. Please evaluate the validity of the 'contractual standing' mechanism and the rival account test. Theoretical density is acceptable if the historical test is robust."
  *   **Editor Note to Author:** "While this is theoretical, you have specified an independent base and a testable mechanism against a rival. We are reviewing this as an empirical study."

  ---

  ### Part VI: What This Procedure Cannot Do

  This procedure licenses you to judge the **internal coherence and testability** of the argument. It does **not** license you to judge whether the economic base *actually* has primacy over law, culture, or religion in the real world.

  When writing to an author, you cannot say: "Your claim that the economy drives law is incorrect."
  You **can** say: "Your claim that the economy drives law is unsupported because you have defined the economy using legal terms," or "You have not shown how the economy drove the law, only that they match."

  You are protecting the journal from tautology and unfalsifiable theory. You are not adjudicating the truth of historical materialism itself. If a paper passes this screen, it means the author has played by the rules of social science explanation, not that their conclusion is true. If a paper fails, it means they have not met the burden of proof required for *any* causal claim, regardless of the theoretical tradition.
