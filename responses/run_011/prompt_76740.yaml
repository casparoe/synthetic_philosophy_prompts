prompt: |-
  I serve as methods editor at a journal of comparative and historical social science. Between eight and twelve submissions a month reach me whose central claim is that some change in law, religion, family organization, political institutions, or cultural taste is explained by a change in the economic base — that the base does the explanatory work and the rest is superstructure, in whatever sense the author leaves to be inferred. Some of these papers are strong. Many are not, and their weaknesses are hard to name precisely, because the vocabulary of the tradition is easy to invoke and hard to satisfy. I have forty-five minutes per submission for a desk screen; I am not a specialist in this literature, and most of our referees are working historians or quantitative social scientists who have never engaged with it directly.

  Please write me a procedure I can run on such a submission: an ordered set of questions with gates, terminating in a recommendation — desk reject, revise and resubmit, or forward to a specialist — that I can defend to the author in plain language.

  The procedure should satisfy the following.

  First, give the questions in the order they should be asked, and state for each what counts as a sufficient answer and what does not. Where a question can only be answered by someone with substantive command of the historical material rather than the structure of the argument, say so, and mark it as a hand-off to a specialist referee instead of pretending I can adjudicate it.

  Second, tell me which distinctions the procedure must preserve for a reader who has never encountered this literature, and which may be dropped as decoration. I have in mind at least: the difference between the productive forces and the relations of production; the difference between a causal claim, a functional claim, and a claim about the space of feasible outcomes; the difference between asserting that base and superstructure correspond and asserting that the base has primacy; and the familiar qualification that determination holds only in the last instance. If there are further distinctions a screen of this kind cannot do without, add them and say what work each does. If any of the above is, for my purposes, a distraction, say so and justify it.

  Third, build in a treatment of the three retreats an author tends to make when a straightforward causal claim is unavailable — that the economy ruled out the alternatives, that the institution had to fit the base, that the institution persisted because it served the base — and set a distinct evidential standard for each, including what evidence could in principle count against it. Also build in the circularity problem I keep meeting: the base is often specified by appeal to property relations that are themselves legal categories, so the explanans appears to contain the explanandum. State what a paper can do to answer this worry and what merely restates it.

  Fourth, mark explicitly which steps are judgment calls wearing the costume of procedure, and where the procedure will misfire systematically: which kinds of good paper it will stall, which kinds of bad paper it will wave through.

  Then run the procedure on three submissions and, for each, report the outcome, what is handed to a specialist, and what the referee report should ask the author to do.

  Submission one argues that a national codification of commercial law in the 1870s followed from the expansion of railway finance. It offers a rich archive showing that the drafters' correspondence was dominated by economic argument, and that the date of passage tracks the boom in railway bonds. I like this paper and would prefer to accept it.

  Submission two argues that a pietist revival spread through a textile region because its doctrines of thrift and discipline suited mill owners. It documents that mill owners funded the congregations and that the doctrine took hold where mills were located, and offers nothing further.

  Submission three argues at length that the modern ideal of the autonomous self is a product of generalized market exchange. I am inclined to reject it as an essay rather than a study; but on reading, it specifies its base independently of the ideological evidence it aims to explain, proposes a mechanism involving contractual standing extended to non-kin, and tests that mechanism against a rival account in which the change is driven by state-building and war finance.

  Two constraints on your answer. Do not give me a bibliography, a reading list, or citations of any kind — neither I nor my referees can look anything up, so name the distinctions in prose rather than by reference. And do not assume I can recognize a technical term on sight: if a step depends on one, define it in the sentence where it is used.

  Finally, close by stating what the procedure cannot do. In particular, I assume it cannot tell me whether the economic base in fact has explanatory primacy over everything else; tell me what it does license me to say about that question, if anything, when I write to an author.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Methods Editor at a journal of comparative and historical social science.
      *   **Task:** Create a desk-screen procedure (ordered questions with gates) for submissions claiming economic base explains social/legal/cultural superstructure (Marxian/materialist style claims).
      *   **Constraints:**
          *   45 minutes per submission.
          *   Editor is *not* a specialist in this specific theoretical tradition.
          *   Referees are historians or quantitative social scientists (not theorists).
          *   No bibliography/citations (define terms in prose).
          *   Must handle specific distinctions (forces vs. relations, causal vs. functional, etc.).
          *   Must handle specific "retreats" (constraint, fit, persistence) and the circularity problem (legal categories defining the base).
          *   Must identify judgment calls and systematic failures.
          *   Must apply the procedure to three specific submissions.
          *   Must conclude with what the procedure *cannot* do regarding the truth of economic primacy.
      *   **Tone:** Professional, precise, actionable, plain language (defensible to authors).

  2.  **Deconstruct the Theoretical Problem:**

      *   The core issue is "Base/Superstructure" claims. These are often vague.
      *   *Weakness:* Tautology (base defined by superstructure), Post-hoc fitting (functionalism without mechanism), Vague "determination" (last instance escape hatch).
      *   *Strength:* Clear mechanism, independent measurement of base, falsifiable claims.
      *   *The "Retreats":*
          1.  *Constraint:* Economy ruled out alternatives (negative claim).
          2.  *Fit:* Institution had to match base (functionalist claim).
          3.  *Persistence:* Institution stayed because it served base (selection claim).
      *   *Circularity:* If "capitalism" (base) is defined by "private property" (law/superstructure), the explanation is circular.

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Goal:* Filter out vague theorizing from testable social science.
      *   *Step 1: Independence of the Base.* Can the "economic base" be described without using legal or cultural terms? (Addresses Circularity).
      *   *Step 2: Type of Claim.* Is it Causal (A made B happen), Functional (B exists because it helps A), or Constraint (A made B the only option)? (Addresses Distinctions).
      *   *Step 3: Mechanism.* How does the base touch the superstructure? (Addresses "Vocabulary easy to invoke").
      *   *Step 4: The Retreats.* If the direct claim fails, do they fall back on fit/persistence? What's the evidence?
      *   *Step 5: Falsifiability.* What would prove them wrong?
      *   *Gatekeeping:* Where does the editor stop and call a specialist? (Substantive historical accuracy).

  4.  **Refining the Distinctions (Constraint 2):**

      *   *Forces vs. Relations of Production:* Crucial for avoiding circularity. Forces = tech/material. Relations = ownership/class. If the base is just "relations," it's often legal. *Decision:* Keep this, but simplify definition.
      *   *Causal vs. Functional vs. Feasible:* Crucial. Causal = push. Functional = pull. Feasible = walls. *Decision:* Keep all three.
      *   *Correspondence vs. Primacy:* Correspondence = they match. Primacy = one drives the other. *Decision:* Primacy is the claim; correspondence is the observation. Focus on Primacy.
      *   *Last Instance:* *Decision:* Drop as decoration. It's an unfalsifiable escape hatch. If they need it, the paper is weak.
      *   *Add:* Mechanism vs. Correlation.

  5.  **Addressing the "Retreats" and Circularity (Constraint 3):**

      *   *Circularity:* Base must be measurable without referencing the law being explained.
      *   *Retreat 1 (Constraint):* Need evidence of rejected alternatives.
      *   *Retreat 2 (Fit):* Need evidence of selection process, not just outcome.
      *   *Retreat 3 (Persistence):* Need evidence of survival despite costs.

  6.  **Identifying Judgment Calls and Failures (Constraint 4):**

      *   *Judgment:* Is the mechanism plausible?
      *   *Failure:* Will stall papers that are theoretically dense but empirically light (philosophy). Will wave through papers that are empirically rich but theoretically naive (positivist history that accidentally fits the model).

  7.  **Running the Procedure on the Three Submissions:**

      *   *Submission 1 (Railway/Commercial Law):*
          *   Base: Railway finance (measurable).
          *   Superstructure: Commercial law codification.
          *   Evidence: Correspondence (mechanism), Timing (correlation).
          *   Circularity: Low (finance isn't law).
          *   Outcome: Forward to specialist (to check historical accuracy) but lean R&R.
      *   *Submission 2 (Pietist/Textiles):*
          *   Base: Mills.
          *   Superstructure: Religion.
          *   Claim: Functional (suited owners).
          *   Evidence: Funding + Location.
          *   Problem: No mechanism of *adoption* by workers. Just functionalist assertion.
          *   Outcome: Desk Reject (Functionalist fallacy without selection mechanism).
      *   *Submission 3 (Autonomous Self/Market):*
          *   Base: Market exchange (defined independently?).
          *   Superstructure: Ideal of self.
          *   Mechanism: Contractual standing.
          *   Test: Rival account (State-building).
          *   Outcome: Forward to specialist (High theory), but looks strong. Maybe R&R.

      *Wait, I need to align the outcomes with the prompt's hints.*
      *   Sub 1: "I like this paper and would prefer to accept it." -> Procedure should support forwarding/R&R.
      *   Sub 2: "Offers nothing further." -> Procedure should catch the functionalist weakness. -> Desk Reject.
      *   Sub 3: "Inclined to reject... but on reading..." -> Procedure should validate the theoretical rigor despite the "essay" feel. -> Forward to Specialist/R&R.

  8.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Administrative but intellectually rigorous.
      *   *Constraint Check:* No citations. Define terms inline.
      *   *Structure:*
          1.  The Procedure (Questions, Gates, Sufficient/Insufficient answers).
          2.  Distinctions (Keep/Drop).
          3.  Retreats & Circularity.
          4.  Judgment Calls & Failures.
          5.  Application to 3 Submissions.
          6.  Limitations (What it can't do).

      *(Self-Correction during drafting)*: Make sure I explicitly mark where the editor hands off to a specialist. I cannot judge if the railway boom *actually* happened, only if the argument *structure* holds.
      *(Refining the "Last Instance" point)*: The prompt asks me to decide if it's decoration. It usually is. I will advise dropping it as a criterion for acceptance because it makes the claim unfalsifiable.
      *(Refining Circularity)*: This is the biggest trap. If "Capitalism" is defined by "Wage Labor" and "Wage Labor" is defined by "Employment Contract," you can't say Capitalism caused Employment Law. The base must be technological or demographic, not legal.

  9.  **Final Review against Constraints:**
      *   Ordered questions? Yes.
      *   Sufficient/Insufficient answers? Yes.
      *   Hand-off markers? Yes.
      *   Distinctions preserved/dropped? Yes.
      *   Retreats treated? Yes.
      *   Circularity treated? Yes.
      *   Judgment calls marked? Yes.
      *   Three submissions run? Yes.
      *   No bibliography? Yes.
      *   Define terms? Yes.
      *   Closing limitation? Yes.

  10. **Final Polish:** Ensure the language is "plain" enough for an author defense but precise enough for an editor. (e.g., instead of "teleological," use "assuming the outcome was the goal").

  *(Self-Correction on Sub 3)*: The prompt says "I am inclined to reject it as an essay... but on reading..." The procedure needs to help me overcome the bias against "theoretical" papers if they meet the structural criteria. I should recommend Forward to Specialist, because the "mechanism" (contractual standing) needs historical validation.

  *(Self-Correction on Sub 1)*: The prompt says "I like this... prefer to accept." But I am a methods editor doing a *desk screen*. I shouldn't "accept" at desk screen. I should "Forward to Referees" with a note that methods are sound.

  *(Self-Correction on Sub 2)*: This is a classic functionalist fallacy. Desk reject is appropriate.

