answer: |-
  (1) **What counts as adequate here**
  An account is adequate only if it translates evolutionary logic into institutional levers you can pull tomorrow. It must fail if it offers a post-hoc justification for why your co-op is failing without specifying which variable to adjust to fix it. It cannot rely on genetic relatedness or perfect information, given your 41 households are unrelated strangers with privacy concerns. Ultimately, it succeeds if it predicts whether a leaderboard increases contribution or triggers exit, and fails if it treats both outcomes as equally consistent with the theory.

  (2) **The requirements**
  1.  **Non-Kin Viability:** The mechanism must sustain cooperation among unrelated agents where inclusive fitness is zero. This rules out kin selection as a primary driver for your co-op, forcing the account to rely on reciprocal benefits or institutional constraints rather than genetic altruism.
  2.  **Partial Observability:** The theory must function when contributions are noisy or hidden, not just in perfect-information games. Since you cannot watch every gardener every hour, the mechanism must tolerate errors in monitoring without collapsing into mutual accusation or unchecked free-riding.
  3.  **Exit Constraints:** The account must account for voluntary participation; if punishment drives people out, the pool shrinks. A model that stabilizes cooperation by making exit impossible fails here, because households can simply stop showing up or sell their shares.
  4.  **Second-Order Stability:** The theory must explain why punishers don't defect from punishing, avoiding infinite regress. If enforcing rules costs time and social capital, the model must explain who pays that cost without requiring a third-order punisher to punish the non-punishers.
  5.  **Bootstrapping Mechanism:** It must explain how cooperation starts from defection, not just how it persists once established. An account that requires high trust to build trust has merely relocated the question; it must show how a few initial contributors survive the early predation of free riders.
  6.  **Equilibrium Selection:** It must explain why one stable outcome occurs over others, not just invoke the Folk Theorem to say anything is possible. Since iterated games allow both universal cooperation and universal defection as stable equilibria, the theory must specify what selects the cooperative outcome in your specific context.
  7.  **Proximate/Ultimate Separation:** The account must distinguish why people *feel* motivated versus why the trait *evolved*. You need to know if households are cooperating out of genuine preference (proximate) or calculated self-interest (ultimate) to design rewards that don't crowd out intrinsic motivation.
  8.  **Falsifiability:** The theory must generate predictions that could prove it wrong for this specific group. It cannot reinterpret any outcome after the fact, with cooperation explained by the mechanism and collapse explained by the mechanism's absence; it must risk being wrong about the leaderboard effect.

  (3) **Load-bearing vs. camp taste**
  Load-bearing requirements are Non-Kin Viability, Second-Order Stability, and Falsifiability. These are structural necessities for any design problem involving strangers; ignore them, and your rules will collapse under real-world costs or lack predictive power. Camp taste includes Group Selectionists insisting on group-level replicators or Direct Reciprocity folks insisting on dyadic encounters. These are theoretical preferences, not design constraints. Regarding your professor's Popperian requirement: it is a prejudice for *evolutionary history*, which is inherently retrospective and often unfalsifiable, but it is a genuine desideratum for *institutional design*. You are not reconstructing the past; you are engineering the future. Therefore, for your purpose, unfalsifiable accounts are useless because they offer no risk-adjusted guidance. This rules out "just-so" stories that adapt to any outcome, forcing you to choose mechanisms that commit to specific behavioral predictions.

  (4) **Can they all be met at once?**
  No, there is a fundamental tension between Bootstrapping, Second-Order Stability, and Falsifiability. To solve Bootstrapping, you need leniency to allow early cooperators to survive initial exploitation; to solve Second-Order Free Riding, you often need harsh, costly punishment to deter defectors. Harsh punishment raises the cost of enforcement, making the system fragile during the bootstrap phase. Furthermore, Falsifiability clashes with the Folk Theorem's permissiveness. If a theory relies on the Folk Theorem, it claims any outcome is sustainable given enough patience, which makes it impossible to falsify when cooperation fails. To be falsifiable, the theory must constrain the equilibrium selection, but doing so often requires assumptions about human rationality or patience that may not hold during the volatile bootstrapping phase. You cannot have a mechanism that is robust to early instability, cheap to enforce, and precisely predictive all at once; you must trade predictive precision for robustness or vice versa.

  (5) **The most exclusionary one**
  Second-Order Stability is the single most exclusionary requirement. It kills pure altruism models because they cannot explain why altruists don't get outcompeted by selfish agents who enjoy the benefits without paying the cost of punishment. It eliminates simple institutional punishment models that assume enforcement is costless or automatic. It also damages many reputation models that do not account for the cost of judging others; if tracking reputation is costly, non-trackers gain an advantage. This requirement forces you to accept that punishment must be incentivized, either through material rewards for enforcers or by making punishment itself a signal of quality that yields future benefits. It narrows the field to mechanisms where enforcing norms is itself a selfishly rational act, which is a high bar for most moralistic theories.

  (6) **Quick scorecard**

  | Mechanism | Non-Kin | Observability | Exit | 2nd-Order | Bootstrap | Falsifiable |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Direct Reciprocity** | Yes | No (needs info) | Yes | Yes | No | Yes |
  | **Indirect Reciprocity** | Yes | No (needs public) | Yes | No (costly judge) | No | Yes |
  | **Strong Reciprocity** | Yes | Yes | No (rigid) | No (costly punish) | Yes | No |
  | **Institutional Punishment** | Yes | Yes | Yes | Yes (if funded) | No | Yes |
  | **Network Reciprocity** | Yes | Yes | Yes | Yes | Yes | No |

  *Note: "No" indicates the mechanism struggles with this requirement without significant modification.*
