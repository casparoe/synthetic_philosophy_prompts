prompt: |-
  So, slightly embarrassing context first: I got guilted into being the "contribution lead" for our neighborhood co-op — 41 households, a shared solar array, a tool library, a big communal garden, and a rule that every household logs four work-hours a month. It is going about as well as you'd predict. Twelve households do basically everything, a chunk do nothing and have worked out that the only sanction is dirty looks, and last month's meeting ended with one faction proposing we publish a monthly leaderboard of logged hours and another faction calling that a surveillance state with a spreadsheet. I've been reading the cooperation literature to figure out what to actually propose, and every camp immediately hands you its favorite mechanism — kin selection people, direct-reciprocity people, reputation/indirect-reciprocity people, network people, group-selection people, punishment-and-institutions people — and each of them claims the others are missing the entire point. I'm not willing to bet 41 households' money and goodwill on a mechanism because its proponents are good at seminars. I want the spec before I look at another pitch.

  So: write the desiderata — what an account of how cooperation arises and stays stable has to deliver to count as adequate, where "adequate" here means specifically *good enough to design rules for a mid-sized group of people who interact repeatedly but are mostly strangers to each other, can exit, and whose contributions are only partly observable*. I want the whole list, with the case or consideration behind each item. Which phenomena does it have to actually explain rather than gesture at — cooperation between unrelated individuals who never meet twice, costly punishment of free riders, the sudden collapse of schemes that ran fine for years, large-scale anonymous human cooperation, the non-human anchors like vampire bats sharing blood with non-relatives or microbes overproducing a public good? Which distinctions is it forbidden to blur — altruism vs. mutualism vs. a mere byproduct of someone pursuing their own interest; the proximate mechanism people are actually using vs. the evolutionary story about why that mechanism is there; direct vs. indirect reciprocity; a claim about individuals vs. a claim about groups that's really just a claim about individuals in disguise? Which formal results can it not contradict — in a one-shot well-mixed prisoner's dilemma defection strictly dominates, but the folk theorem says you can sustain almost anything once you iterate it patiently enough, so what is the theory genuinely constrained by, and is "it has to reproduce the folk theorem's permissiveness" even a desideratum or a cop-out? And the second-order free-rider problem: if punishing is costly, who bears that cost, and does an account that solves free-riding by adding punishers just move the problem up a level? Also I want you to take seriously the bootstrapping worry — an account that needs some cooperation already in place in order to explain the emergence of cooperation hasn't explained anything, it's just relocated the question.

  One more wrinkle. There's a retired philosophy prof on our board who keeps insisting on an extra requirement: whatever account we lean on has to be non-tautological in the Popperian sense, meaning it has to be capable of being wrong about *this particular group* — it can't just reinterpret any outcome after the fact, with cooperation explained by the mechanism and collapse explained by the mechanism's absence. Tell me straight whether that's a genuine desideratum for an evolutionary account of cooperation or a prejudice imported from a different discipline, and if it's genuine, say what it rules out.

  Format, please: (1) **What counts as adequate here** — 3–4 sentences nailing down the purpose and what would make an account fail it for my situation specifically; (2) **The requirements** — the bulk of the answer, numbered, each one with the motivating case or consideration in a sentence or two; (3) **Load-bearing vs. camp taste** — short, sort the list into genuine desiderata and things one school just happens to care about; (4) **Can they all be met at once?** — if some subset is jointly unsatisfiable, show me which and why; this is the part I most want to see; (5) **The most exclusionary one** — a paragraph on which single requirement knocks out the most contenders and which ones it kills; (6) **Quick scorecard** — a compact table, main mechanisms against maybe the six most demanding requirements, one line each, no essays. Aim for something like 1300–1600 words total. And please no references, bibliographies, or reading lists — I've already got a stack of papers taller than me, names of mechanisms and results are plenty.
