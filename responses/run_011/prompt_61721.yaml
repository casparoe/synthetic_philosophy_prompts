          *Formalism:* Regarding whether these quantities earn their keep, I think they do, provided you treat them as heuristic devices rather than measurable metrics. Ordinary language about sensitivity to initial conditions often collapses the moment of divergence into the long-term trajectory, whereas your distinction forces the writer to specify where the branch thins out. However, you must guard against implying these can be calculated; they are qualitative assessments of structural tension.

