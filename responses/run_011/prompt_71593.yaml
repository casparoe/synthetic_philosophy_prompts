answer: |-
  You charge me with circularity, as if I decide a man is great and then hunt for trinkets to prove it, but this misunderstands the art of portraiture. When I paint a statue, I do not carve every vein, but I do not carve a false eye either. The small acts—a phrase, a jest—are not selected because they fit a thesis, but because they are the only places where the *daimon* of the man breathes freely, unguarded by the pomp of office. In the public sphere, Fortune and necessity mask the soul; in the private, the man stands naked. My judgement is not a premise but a conclusion drawn from comparing these naked moments across parallels. If I select, it is to remove the noise of history, not to manufacture the signal. The evidence is independent because the act itself, however small, bears the stamp of character regardless of my pen; I merely hold the lamp so you may see it.

  On Alcibiades, I concede that the vividness of a life may seduce a weak reader into admiring the glitter rather than the gold. This is a genuine peril of my method: the soul is drawn to energy, and virtue is not always the most energetic force. Yet this risk is the cost of making philosophy alive rather than dry. If I wrote only of the blandly good, no one would read, and no one would learn. The Life presents the whole man, vice and virtue intertwined, so that you may see how charm serves ambition. If you leave delighted by his audacity, you have missed the warning woven into his ruin. The text provides the remedy, but I cannot force you to swallow it; the fault lies not in the mirror if the viewer loves his own blemish.

  Finally, you ask what you can carry away from a life so unlike your own. You seek a rule as if virtue were a coin to be spent, but virtue is a muscle to be trained. A precept says "be courageous," but it cannot show you how courage smells when blood is near. You cannot emulate Alexander's empire, but you can emulate his mastery over fear, or learn from his failure to master anger. The concrete life trains your *phronesis* to recognize the universal in the particular. Without the flesh of the example, the bone of the precept is useless. I do not give you a map to walk in another's footsteps, but a compass to find your own north.
