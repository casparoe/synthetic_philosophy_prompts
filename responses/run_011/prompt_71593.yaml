          Regarding Alcibiades, you confuse the spark that catches the eye with the fire that warms the heart. Yes, his life is dazzling, but I lay bare the instability that makes such dazzling possible. If a reader admires only the charm, he is like a man who eats the honeycomb and swallows the bee; the fault lies in his digestion, not the hive. My purpose is not to ensure every reader is improved—that is beyond any author's power—but to provide the gymnasium for the soul. The vividness holds the attention so that the moral lesson may strike, but if the reader prefers the spectacle to the substance, he fails the exercise. I do not write for the morally blind, but for those willing to see the shadow behind the light.

