answer: |-
  1. In the 1853 text, "but" functions as "except." The sentence structure is a rhetorical question expecting a negative answer. Locke is asking: "Is it impossible for a lad to know this *except* by virtue of the axiom?" He expects you to say, "No, it is not impossible." The follow-up ("nor be assured... till...") extends the same logic: "Is it true he cannot be assured until he learns the maxim?" Again, the expected answer is "No." The force is to deny the necessity of the maxim. I must flag uncertainty here: standard modern editions often emend this "but" to "without," which makes the syntax smoother. If you stick strictly to the 1853 "but," you must read it as an exclusive exception ("except by") within a negated possibility ("Is it not possible..."), which is clunky but logically consistent with his argument that direct intuition precedes maxims.

  2. This is effectively one complex interrogative clause with two distinct priorities being queried: epistemic (known first/clearest) and genetic (gives life and birth). "Gives life and birth" picks out psychological genesis—where the concept originates in the mind's development. Locke does answer it, though implicitly: he states immediately afterward that knowledge "was founded on particulars." The particulars give birth to the general rule. The hedge "by most people" is doing real empirical work, not just politeness. Locke is acknowledging that while a logician might operate differently, the natural history of human understanding moves from concrete instances to abstract rules. He is grounding his epistemology in a developmental psychology of the "ordinary" mind.

  3. The relative pronoun "which" refers to "ideas," not "comparing." The participle "made" is displaced but modifies "ideas." A defensible parse is: "These general rules are but the comparing [of] our more general and abstract ideas, [ideas] which are the workmanship of the mind, made [by the mind], and names given to them..." The syntax is tangled because Locke is compressing the origin of the ideas and the naming process into one relative clause. Plain English: General rules are nothing more than comparisons between abstract ideas that we created and named ourselves, designed to speed up reasoning. The "made" emphasizes that these ideas are not innate; they are constructed ("workmanship") to serve a functional role ("easier dispatch").

  4. Your co-presenter is right about the *genesis* but wrong about the *storage*. Locke and Hofstadter/Sander agree that reasoning starts with particulars (the country wench's specific debts). Where they diverge is the status of the abstraction once formed. Your co-presenter reads "disburden the memory" as chunking—compressing data for efficiency while keeping the underlying structure accessible. But Locke's phrase "cumbersome load of particulars" suggests the particulars are actively discarded or shelved once the rule is secured. For Locke, the maxim becomes a static artifact that replaces the need to rehearse the particulars. For Hofstadter, the particulars remain the active fuel for every new analogical encounter; the category is re-forged, not just retrieved.

  Your objection survives on this point of *dynamic vs. static* abstraction. Locke treats the maxim as a finished tool that allows you to stop thinking about the specific debts. Hofstadter treats the relational pattern as something that only exists *in* the mapping of new particulars. The strongest Lockean reply from this passage is that the "easier dispatch" requires stability. If the mind had to re-forged the relation every time (as per Hofstadter), it wouldn't be "disburdening" the memory; it would be reloading it. Locke argues we *need* the static rule to escape the cognitive load of the particular. You can concede the genesis point (Locke is proto-connectionist there) but hold the line on the architecture: Locke wants a library of stored rules; Hofstadter wants a fluid engine of comparison.
