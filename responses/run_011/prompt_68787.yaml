  I'm sitting in on a seminar this term that's half philosophy of mind, half cognitive science — the theme is concepts and categorisation — and I got stuck presenting this friday, which means I have to hold Locke's Essay up next to the Hofstadter and Sander line that analogy-making is basically the engine of all thought. I'm fine with the modern stuff. Its the Locke that's defeating me, specifically one paragraph in Book IV ch. 12 (the chapter on the improvement of our knowledges), section 3, as it appears in an 1853 printing. Because it's an old printing, if a phrase looks slightly off compared to what you remember, go with the text in front of you rather than your memory of it.

