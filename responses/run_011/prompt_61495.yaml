answer: |-
  ### Requirements for an Account of Letterform Identity

  **1. Topological Invariance**
  *   **Case:** A single-storey `a` and a double-storey `a` share almost no contour features but are indisputably the same letter.
  *   **Status:** **Non-negotiable.** Any theory that requires strict feature matching fails immediately.

  **2. Orientation Sensitivity**
  *   **Case:** Flipping `b` yields `d` (new letter), but flipping `a` yields "backwards `a`" (damaged token). The theory must predict which transforms change identity and which merely degrade quality.
  *   **Status:** **Non-negotiable.** A theory that treats all rigid transforms equally cannot distinguish neighbors from errors.

  **3. Script Locality**
  *   **Case:** Latin `C` and Cyrillic `С` are pixel-identical but distinct letters. Identity cannot be determined by glyph shape alone; it requires script metadata.
  *   **Status:** **Non-negotiable.** (For a program: this must be an input parameter, not an inferred property of the shape).

  **4. Contextual Disambiguation**
  *   **Case:** The glyph `|` can be `l`, `I`, or `1`. Identity is often resolved by surrounding tokens (kerning, neighbors, font family) rather than the mark itself.
  *   **Status:** **Non-negotiable.** A theory that isolates tokens will fail on ambiguous glyphs common in real-world data.

  **5. Case Coupling**
  *   **Case:** `A` and `a` are distinct code points and shapes but the "same letter." The relation between them must be tighter than the relation between `A` and `B`, but looser than identity.
  *   **Status:** **Non-negotiable.** The theory must define a "casefold" operation without collapsing the alphabet.

  **6. Structural Intent (Operationalized)**
  *   **Case:** A child's accidental mark vs. a writer's `a`. Since a program cannot read minds, this must be defined as "statistical conformity to script norms" rather than mental state.
  *   **Status:** **Non-negotiable (with caveat).** The program must be able to reject noise; the *explanation* for why it's noise (intent) is theoretical, the *test* (conformity) must be computable.

  **7. Stylistic Coherence**
  *   **Case:** Your `a`, `g`, and `x` share a "hand" despite sharing no features.
  *   **Status:** **Camp-Specific.** This is a requirement for *attribution* (who wrote this?) not *identity* (what is this?). A theory of letter identity can kick this next door to a theory of style.

  **8. Modality Boundary**
  *   **Case:** Morse and Braille `a` share no shape with printed `a`.
  *   **Status:** **Camp-Specific.** For a visual recognizer program, these are out-of-scope. For a general linguistic theory, they must be included. Given your purpose, the theory need only explain the *visual* cluster, treating other modalities as mappings *from* the visual standard.

  ***

  ### The Killer Requirement
  You guessed Morse/Braille, but that is a red herring for a visual recognizer; you can simply define the domain as "optical glyphs." The actual killer is **Script Locality combined with Topological Invariance**. This pair forces a hybrid model: you cannot rely on shape alone (fails Locality: Latin `C` vs Cyrillic `С`), but you cannot rely on system role alone (fails Topology: why does *this* specific shape cluster fill the `a` slot rather than *that* one?). A program needs a decision boundary, but the boundary shifts depending on metadata the shape itself doesn't contain. This kills any theory that tries to be purely intrinsic to the mark.

  ### Conflicting Requirements
  The primary tension is between **Topological Invariance** ("shape doesn't matter, `a` varies wildly") and **Orientation Sensitivity** ("shape *does* matter, flipping changes `b` to `d`"). You cannot simply say "shape is irrelevant" because orientation proves geometry is constitutive of identity. You cannot say "shape is definitive" because single/double-storey proves geometry is variable. The theory must explain why *some* geometric changes are identity-preserving while others are identity-switching, without appealing to arbitrary lists.

  ### Evaluation of Candidate Accounts

  **Pure-Shape Account**
  This theory fails **Script Locality** and **Contextual Disambiguation** immediately, as it cannot distinguish identical glyphs in different alphabets or contexts. It also struggles with **Topological Invariance**, as it must posit a complex "essential shape" that somehow includes both single and double-storey `a` while excluding `d`.

  **Pure-System-Role Account**
  This theory handles **Script Locality** well but fails **Orientation Sensitivity**, as it cannot explain why a specific geometric orientation is required to fulfill the `b` role versus the `d` role. It also risks becoming circular, defining the letter only by its position in a sequence rather than its visual realizability.

  **Family Resemblance Account**
  This theory describes the data well but fails the **Program Constraint**, as "resemblance" provides no decision boundary for an algorithm to classify unseen glyphs. It explains why we agree on `a` retrospectively but offers no procedure for deciding if a new mark belongs to the cluster.
