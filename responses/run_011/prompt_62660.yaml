answer: |-
  ### Conceptual Sketch

  The session's core tension is between **validity** (does the rule permit this?) and **power** (can the members force this?). Students conflate the two because in domestic public law, sovereignty usually collapses them. Here, they must feel the gap. The dependency chain is: (1) Accept the Constitution as binding even on unanimity; (2) Recognize the logical lock in Article VII; (3) Realize internal validity fails; (4) Acknowledge external power succeeds (The Walk-Out); (5) Distinguish the two modes of authority. If they skip step 1, it's just contract law. If they skip step 4, it's just logic puzzles. The "Chair" objection is the bridge between 3 and 4.

  ### Critique of Provided Variants

  **Cut "The Bootstrap."** It is procedurally too dense. Four distinct votes over four weeks dilutes the normative conflict into a timeline puzzle. Students will focus on whether notice was given rather than whether the rule binds itself.

  **Keep "The Closed Clause" as the Core.** This is the only variant that creates a simultaneous contradiction. Para 2 says unanimity works; Para 3 says unanimity fails. This forces the validity question immediately.

  **Keep "The Walk-Out" as the Coda.** This is not a variant of the amendment puzzle; it is the escape from it. It belongs after the internal logic has been exhausted, to demonstrate the limit of legal validity.

  ---

  ### Teaching Plan: The Ashcombe Trap

  #### 1. Sequence and Timing (100 Minutes)

  *   **00–15: The Setup (Intuition Pumping).**
      *   Distribute the Constitution. Read Article VII aloud.
      *   Ask: "If 39 members vote to expel the 40th, is it valid?" (Yes, implied powers).
      *   Ask: "If 40 members vote to burn the Constitution, is it valid?" (Pause. Let them say yes).
      *   **Goal:** Establish the pre-theoretical conviction that "owners rule."
  *   **15–55: The Closed Clause (The Trap).**
      *   Introduce the modification: Para 3 now forbids altering Para 3.
      *   Scenario: All 40 vote unanimously to repeal Para 3.
      *   **Minute 25:** Poll the room. Valid or Invalid? Split them physically (Left/Right).
      *   **Minute 35:** Force the advocates to argue against their own side. "Advocate for Invalidity: Why can't the owners do what they want?"
      *   **Minute 45:** Introduce the conflict: Para 2 authorizes the vote; Para 3 forbids it. Which paragraph speaks for the Constitution?
      *   **Goal:** Make them feel the paralysis of internal validity.
  *   **55–75: The Walk-Out (The Escape).**
      *   Scenario: They ignore Article VII, meet in a pub, sign a new constitution.
      *   Ask: "Is the new Constitution valid under the old one?" (No).
      *   Ask: "Does it work?" (Yes).
      *   **Goal:** Separate efficacy from validity.
  *   **75–90: The Chair Objection (The Reality Check).**
      *   (See Section 4 below for handling).
  *   **90–100: Check for Understanding & Wrap.**
      *   (See Section 5 below).

  #### 2. Artifact Design: Why This Case?

  *   **What it must have:**
      *   **Forty Named Members:** Creates a closed set. No "people," no "electorate." It prevents appeals to democratic legitimacy outside the text.
      *   **Written Constitution:** Reifies the rules as objects distinct from the members' will.
      *   **No Enforcement Mechanism:** No court, no sheriff. This prevents the question "What would the judge do?" and forces "What is the rule?"
  *   **What it must lack:**
      *   **A Court:** If you add a judge, students argue about judicial review, not constitutional theory.
      *   **A Rival Claimant:** If someone claims the Chair illegitimately, it becomes a fact-pattern dispute about possession.
      *   **External Law:** Do not mention the Societies Act. If external law validates the walk-out, the internal paradox dissolves.
  *   **What breaks the case:** Adding a "Supreme Court of the Society." Students will simply say "The Court decides," which ends the inquiry into validity. The uncertainty *is* the lesson.

  #### 3. Misconception Map

  | Misconception | Status | When to Head Off | The Counter-Question |
  | :--- | :--- | :--- | :--- |
  | **"The later vote wins."** (Implied repeal) | **Error.** | Minute 30 (During Closed Clause) | "Does Article VII allow implied repeal, or does it specify the *only* way to amend?" |
  | **"It's the liar paradox; the Constitution is broken."** | **Error.** | Minute 40 (When frustration peaks) | "We are not asking if logic holds. We are asking if the vote changed the rule. A broken clock is still a clock." |
  | **"They own the society; they can do what they like."** | **True, but too early.** | Minute 20 (During Setup) | "You are describing power. I am asking about validity under *this* text. Can the text bind the owners?" |
  | **"Just found a new society."** | **True, but distinct.** | Minute 60 (During Walk-Out) | "That explains how they escape. It does not explain whether the old Constitution permitted the escape." |

  #### 4. Handling "The Chair Objection"

  *   **When to let it be made:** Ideally Minute 75. If a student raises it earlier (e.g., Minute 30), **park it**. Write "THE CHAIR" on the board and say: "That is the nuclear option. We will detonate it in forty minutes. For now, assume the Chair is bound by the text."
  *   **Why:** If allowed early, it collapses the validity puzzle into a practicality discussion. It must be saved for when the logical deadlock is palpable.
  *   **What to do with it:**
      *   Acknowledge it as the shift from **Internal** (what the rule says) to **External** (who holds the gavel).
      *   Ask: "If the Chair rules the vote valid, is it valid?"
      *   **The Lesson:** Validity is not a physical fact; it is an accepted status. The Chair's ruling is only effective if the members *accept* the Chair's authority. If they accept the Chair, they accept the Constitution the Chair serves. If the Chair ignores the Constitution, the Chair is no longer acting under the Constitution.
      *   **Closing line:** "The Chair decides what happens. The Constitution decides what ought to happen. Today we are studying the 'ought'."

  #### 5. Check for Understanding

  *   **The Question:** "Suppose the 40 members vote unanimously to repeal Para 3, and the Chair declares it valid. The next week, 39 members vote to expel the 40th member under the new rules. The 40th member sues (in our imagination). What is the single strongest argument that the expulsion is void?"
  *   **The Distinction:**
      *   **The Noise-Maker (Failed):** "Because the Chair was wrong," or "Because it's unfair," or "Because the old rule says no." (These are conclusions or appeals to authority).
      *   **The Distinction (Passed):** "Because the power to amend Para 3 was not contained within the Constitution that granted the power. The vote was effective, but it was not an exercise of constitutional authority. It was a revolution, not an amendment."
      *   **Key Phrase to Listen For:** "They changed the system, they didn't use the system."

  #### 6. Deliberate Omissions

  *   **Omission 1: The Hierarchy of Norms (Kelsen).**
      *   *Disclaimer:* "We are not discussing where the Constitution gets its force from above, only what it says about itself from within."
  *   **Omission 2: The Rule of Recognition (Hart).**
      *   *Disclaimer:* "We are not asking how officials identify law generally, but how this specific text identifies its own change."
  *   **Omission 3: Parliamentary Sovereignty.**
      *   *Disclaimer:* "Do not import assumptions about Parliament. This society has no sovereign legislature, only a constrained constituent power."
  *   **The Dangerous Truth (Do Not Say Until the End):**
      *   "Law is ultimately backed by force."
      *   *Why:* If said at Minute 20, they will stop analyzing validity. If said at Minute 90, it explains the Walk-Out.
