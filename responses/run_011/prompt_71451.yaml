prompt: |-
  I work in health technology assessment — the analysis that decides whether a public payer funds a drug or a screening programme. Not a philosopher, and I don't want a philosophy lecture; I want you to tell me what my own rulebook is committed to.

  Here's the practice, described as neutrally as I can:

  1. When we compare an intervention that costs money now and delivers health benefits forty years out against one that delivers them next year, we discount the costs and the health at the *same* annual rate — call it 3%. A life-year gained in 2065 counts for maybe a third of one gained in 2026.
  2. The reason usually given for using one rate on both is that money compounds: a pound now can be invested and comes back larger, so future pounds have to be shrunk before they're comparable, and health has to be shrunk on the same schedule or you'll systematically overfund prevention.
  3. But health is not allowed to compound. There's no rule anywhere that lets us bank a life-year now and spend it in 2060, or invest in health and earn returns on it. We treat health as strictly non-transferable across time.
  4. The rulebooks also say the 3% is made of two separate pieces — one for the fact that future people will probably be richer than us, one that's just impatience about people who don't exist yet — and they say the second piece should be very small on ethical grounds. In practice nobody can ever tell me which piece a given number came from.
  5. And in the sister guidance for long-run climate and environmental risk, the rate isn't constant at all: it steps down the further out you go, and irreversible or catastrophic losses sometimes get exempted from discounting entirely. So the rate stops being a function of *when* the harm happens and becomes a function of *what kind of thing* is being lost.

  So: what theory of value does 1–3 actually presuppose? Does shrinking future health at a rate whose whole justification is capital markets commit us to treating health as a fungible investable stock after all, or is there a coherent story in which the discounting and the no-banking rule sit together — and if there is, what has to be true about time, and about the identity of the person who benefits, for that story to work? Then take 4 seriously: if growth went to zero permanently, does the practice still have any content, or is its entire ethical payload parasitic on an empirical forecast? And take 5 seriously: what does a rule that switches discounting on and off by *category of loss* presuppose, and is it consistent with 1 at all? My hunch is that 5 quietly abandons the monistic, single-metric picture that 1 assumes.

  Commit to a verdict. I don't want a menu of possible readings with the picking left to me — tell me which reading you'd defend, whether the practice is ultimately coherent or is doing two incompatible things under one number, and where you're reconstructing charitably rather than describing what's really there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Health Technology Assessment (HTA) professional. Practical, technical background, not a philosopher. Wants to know what their *own rulebook* is committed to, not a general philosophy lecture.
      *   **Tone:** Direct, analytical, slightly skeptical of the current practice, demanding a verdict (no "on the one hand, on the other hand").
      *   **Core Question:** What theory of value does the current HTA discounting practice (points 1-3) presuppose? Is it coherent? How do points 4 and 5 affect that coherence?
      *   **Specific Constraints:**
          *   Don't lecture on philosophy.
          *   Commit to a verdict.
          *   Identify if the practice is coherent or doing two incompatible things.
          *   Address the "growth = 0" scenario (point 4).
          *   Address the climate guidance inconsistency (point 5).
          *   Distinguish between charitable reconstruction and describing what's really there.

  2.  **Deconstruct the HTA Practice (Points 1-3):**
      *   *Practice:* Discount costs and health effects at the same rate (e.g., 3%).
      *   *Justification:* Opportunity cost of capital (money compounds). If you don't discount health at the same rate, you bias towards prevention (future health).
      *   *Tension:* Health doesn't compound. You can't bank a QALY.
      *   *Implication:* By discounting health at the *financial* rate, the system implicitly treats health *as if* it were financial capital, even while explicitly forbidding intertemporal transfer of health.
      *   *Theory of Value:* This looks like **Consequentialist Utilitarianism with a Market-Based Exchange Rate.** It values health outcomes solely by their willingness-to-pay (WTP) equivalence in the current market, projected forward. It assumes the marginal utility of health is constant relative to the marginal utility of money over time, *provided* money grows.

  3.  **Analyze the "Growth = 0" Scenario (Point 4):**
      *   *Decomposition:* Rate = Pure Time Preference (impatience) + Elasticity of Marginal Utility (growth/wealth).
      *   *Scenario:* If economic growth stops, the wealth component drops. If pure time preference is ethically near-zero (Ramsey rule), the discount rate should drop to near-zero.
      *   *Verdict:* If the HTA body keeps discounting at 3% despite zero growth, the practice is **parasitic on empirical growth forecasts.** It has no independent ethical content. It admits that future health is worth less *only because* future people will be richer and value it less (or have better alternatives). If they aren't richer, the justification collapses.

  4.  **Analyze the Climate/Environmental Guidance (Point 5):**
      *   *Practice:* Declining discount rates, exemptions for catastrophic loss.
      *   *Implication:* This shifts from a *time-based* valuation to a *type-based* valuation. It acknowledges that some goods (existence, survival) are not substitutable.
      *   *Conflict:* HTA (Point 1) assumes a monistic metric (QALYs) where time is the only variable. Climate guidance assumes a pluralistic metric where the *nature* of the good matters.
      *   *Verdict:* Point 5 contradicts Point 1. Point 1 assumes substitutability (money now for health later). Point 5 assumes non-substitutability (some losses are absolute).

  5.  **Synthesize the "Verdict":**
      *   *Is it coherent?* No. It is a pragmatic hybrid that masks a contradiction.
      *   *What theory of value?* It presupposes **Strong Substitutability between Money and Health** combined with **Weak Neutrality about Time.** It treats health as a claim on social resources rather than an intrinsic good.
      *   *The "Banking" Contradiction:* You can't bank health, but you discount it *as if* you could. Why? To prevent the "prevention bias." This is a budgetary constraint masquerading as a value theory.
      *   *The Growth Dependency:* The ethical payload is entirely dependent on economic growth.
      *   *The Climate Inconsistency:* HTA is pretending to be a neutral calculator, while Climate guidance admits that some things are sacred/non-substitutable. HTA refuses to admit this for life-years.

  6.  **Drafting the Response (Iterative refinement for tone and directness):**
      *   *Opening:* Acknowledge the user's expertise. Cut the fluff.
      *   *Section 1: The Theory of Value (Points 1-3).* Call it what it is: "Shadow Pricing." The system treats health as a derivative of wealth. The coherence hole: It applies financial logic to a non-financial good to solve a budget problem, not a value problem.
      *   *Section 2: The Growth Dependency (Point 4).* Be blunt. If growth stops, the 3% is ethically indefensible under the Ramsey logic they cite. It is parasitic.
      *   *Section 3: The Climate Contradiction (Point 5).* This is the smoking gun. HTA assumes QALYs are fungible. Climate guidance admits they aren't. This is an inconsistency in the state's valuation framework.
      *   *Conclusion/Verdict:* The practice is not coherent. It is a **budgetary control mechanism disguised as a theory of intertemporal justice.** It prioritizes fiscal stability over ethical consistency.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Am I being too harsh?
      *   *Correction:* The user asked for a verdict, not kindness. They suspect incoherence. Validate that suspicion but explain *why* the system does it (budget constraint).
      *   *Key Insight:* The "same rate" rule isn't about the value of health; it's about the *opportunity cost of the budget.* If I spend £1m now on prevention, I can't invest that £1m elsewhere. The discounting ensures the *budget* is efficient, even if the *health valuation* is weird.
      *   *Wait, check the prompt:* The prompt asks what theory of value 1-3 *presupposes*.
      *   *Revised Insight:* It presupposes that Health is a **Consumption Good** subject to diminishing marginal utility as society gets richer, *and* that the Budget Constraint is the ultimate moral arbiter.
      *   *The "Banking" issue:* The system implies health *is* transferable via the budget. We transfer money to buy health later. So health is indirectly transferable.
      *   *The Verdict:* The system is **Fiscal Consequentialism.** It is coherent *only* if you view the HTA body as a financial investor managing a portfolio, not a guardian of public health. If you view it as a guardian of health, it is incoherent. Given the mandate (public payer), it's a conflict of role.

  8.  **Final Polish:** Ensure the distinction between "Charitable Reconstruction" (how they *say* it works) and "Real Description" (what it *does*) is clear. Ensure the verdict is prominent.

      *   *Structure:*
          1.  Direct Verdict.
          2.  The Theory of Value (Money-Health Substitutability).
          3.  The Growth Parasite (Point 4).
          4.  The Climate Contradiction (Point 5).
          5.  Conclusion on Coherence.

      *(Self-Correction on "Verdict"):* Make sure I don't sit on the fence. The prompt says "Commit to a verdict."
      *Verdict:* The practice is **incoherent**. It conflates a budget constraint with a value judgment.

      *(Refining the "Theory of Value"):* It's not just utilitarianism. It's **Cost-Benefit Analysis (CBA) wearing Cost-Effectiveness Analysis (CEA) clothes.** It uses CEA metrics (QALYs) but applies CBA discounting logic.

      *(Refining Point 5):* Point 5 reveals that the state *knows* how to value catastrophic/irreversible loss differently. The fact that HTA doesn't do this for death/chronic illness is a political choice, not a logical necessity.

      *(Final check on tone):* Professional, peer-to-peer, decisive.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the verdict: **Your practice is not ethically coherent. It is a budgetary control mechanism masquerading as a theory of intertemporal justice.**

  It conflates the *opportunity cost of capital* (a financial constraint) with the *moral weight of future lives* (a value judgment). By doing so, it presupposes a theory of value that treats health as a fungible consumption good subordinate to economic growth, while simultaneously denying the mechanisms (banking/investing) that would make that theory logically consistent.

  Here is the breakdown of what your rulebook is actually committed to, distinguishing between the charitable reconstruction (how your colleagues explain it) and the operational reality (what the math actually does).

  ### 1. The Theory of Value (Points 1–3): "Shadow Pricing"
  **Charitable Reconstruction:** The rulebook claims to be neutral. It argues that because money has an opportunity cost (it can be invested), health benefits must be discounted at the same rate to prevent a bias toward long-term prevention. This is framed as "consistency."

  **Operational Reality:** This presupposes **Strong Substitutability between Money and Health.**
  By discounting health at the rate of return on capital, you are implicitly asserting that a life-year in 2065 is worth less than a life-year in 2026 *because the money spent to save it could have earned interest.* This only makes sense if health is a claim on social wealth, not an intrinsic good.

  *   **The Contradiction:** You explicitly forbid banking health (Point 3). You cannot save a QALY today to spend in 2060. However, by discounting future QALYs at the rate of financial return, you are *implicitly* treating the budget as if it *were* a health bank. You are saying: "We could invest this money, grow the pot, and buy *more* health later. Therefore, health bought later is 'cheaper' or 'equivalent' to less health bought now."
  *   **The Commitment:** Your rulebook commits to the view that **the value of health is derivative of the productivity of capital.** It treats the health budget as an investment portfolio. If you truly believed health was non-fungible and intrinsic, you would discount health at the pure rate of time preference (near zero), and discount costs at the rate of capital. The fact that you force them to match reveals that you are optimizing for **fiscal efficiency**, not health maximization.

  ### 2. The Growth Dependency (Point 4): Ethical Parasitism
  **Charitable Reconstruction:** The 3% rate is a blend of "pure time preference" (impatience) and "wealth effect" (future people will be richer, so an extra unit of health is worth less to them).

  **Operational Reality:** If economic growth goes to zero permanently, **your practice loses its ethical payload.**
  Under the Ramsey rule (which underpins your guidance), if growth ($g$) is zero and the elasticity of marginal utility is positive, the wealth component of the discount rate vanishes. If you also accept the ethical premise that "pure time preference" for existence should be near-zero (as your guidance admits), the discount rate should collapse to near-zero.

  *   **The Verdict:** If your agency continued to discount at 3% in a zero-growth economy, you would be admitting that **you value future people less simply because they are future people.** This is the definition of temporal discrimination.
  *   **The Commitment:** Your current practice is **parasitic on an empirical forecast of perpetual economic growth.** It does not have a standalone ethical justification. It justifies devaluing future lives *only* on the condition that those lives will be wealthier than current ones. If they aren't, the discount becomes an arbitrary penalty on the future.

  ### 3. The Climate Contradiction (Point 5): The Smoking Gun
  **Charitable Reconstruction:** Climate guidance uses declining discount rates because environmental risks are uncertain and catastrophic losses are different from marginal costs.

  **Operational Reality:** This is a direct contradiction of Point 1.
  Point 1 assumes a **monistic metric**: A QALY is a QALY, and time is the only variable that changes its value.
  Point 5 assumes a **pluralistic metric**: The *type* of loss matters. Irreversible, catastrophic, or existential losses are exempted from standard discounting logic.

  *   **The Inconsistency:** Death and permanent disability in HTA are, by definition, irreversible and often catastrophic to the individual. Yet HTA applies a flat 3% rate. Climate guidance admits that when the stakes involve fundamental welfare or existence, market-based discounting is inappropriate.
  *   **The Commitment:** By refusing to apply the Climate Guidance logic to health, your rulebook commits to the view that **individual health losses are substitutable and marginal,** whereas **environmental losses are foundational.** It presupposes that society can "trade off" future cancer deaths against current budget savings in a way it cannot trade off future climate collapse. This is a political hierarchy of value, not a logical one.

  ### Final Verdict

  **Is the practice coherent?**
  **No.** It is doing two incompatible things under one number.

  1.  **It treats health as capital** (by discounting it at the rate of return) **while forbidding it from acting like capital** (no banking/investing).
  2.  **It claims ethical neutrality** while being **dependent on economic growth forecasts** to justify its discount rate.
  3.  **It claims a universal time-preference logic** while **ignoring the precedent set by climate guidance** regarding catastrophic/irreversible loss.

  **What is really going on?**
  Your rulebook is not a theory of value; it is a **fiscal constraint.**
  The "3% discount on health" is not there to measure the moral worth of a future life. It is there to prevent the health budget from being swallowed by long-term prevention programs that look cost-effective only because the discount rate ignores the opportunity cost of the cash.

  **Recommendation for your internal model:**
  Stop describing this as "valuing future health." Acknowledge it as **"budgetary rationing."**
  *   **Charitable Reconstruction:** "We discount health to ensure intergenerational equity."
  *   **Real Description:** "We discount health to ensure the current budget constraint isn't violated by long-tail liabilities, assuming economic growth will make future remediation cheaper."

  If you want coherence, you must decouple the rates: discount costs at the market rate (opportunity cost of capital) and discount health at the pure time preference rate (ethical weight of future lives). The fact that you don't do this proves that **fiscal stability is the actual primary good being maximized,** not health.
