      *   **My Committed Diagnosis:** The stalemate persists because both sides are trying to fit "death's badness" into a standard *event-based* model of harm. The Epicureans are right that standard harm requires a temporal location in the victim's life. The Deprivationists are right that death makes a life worse *globally*. The error is assuming these must be the *same kind* of badness. The disagreement is substantive: It is about whether well-being is *atomistic* (sum of momentary states) or *narrative/global* (property of the whole trajectory).

