answer: |-
  Your advisor is right: the argument proves too much because it concludes that *institutions* are impossible. If (8) were true, there would be no such thing as legislation, verdicts, marriages, or leases. Since you (and the law school contingent) agree leases exist, one of the premises must be false.

  The good news is that you do not need to scrap the paper. In fact, your argument is a very strong attack on the **Will Theory** of contract (the idea that contracts are binding because of a meeting of minds/moral promises). If you pivot, this becomes a paper about why contract law *cannot* be reduced to moral promising.

  Here is the breakdown of where the argument breaks, the price of fixing it, and how to handle the specific wrinkles you raised.

  ### 1. Which step to reject?
  **Reject Step (2).**

  You are conflating **constitutive felicity conditions** (Austin's "Misfires") with **sincerity conditions** (Austin's "Abuses").

  *   **Misfires (A & B conditions):** These are procedural. (e.g., I try to marry you but I'm already married; I try to bet you but you didn't offer). If these fail, the act *does not happen*.
  *   **Abuses ($\Gamma$ conditions):** These are psychological/sincerity conditions. (e.g., I promise to pay you but I have no intention of doing so). If these fail, the act *happens*, but it is hollow/infelicitous.

  Austin is explicit on this: If I say "I promise" without the intention, I have **still promised**. I am just a liar. The obligation stands, even if my psychology is fraudulent.

  **The Fix:** Modify (2) to read: "One of the conditions on promising is that the speaker *manifests* an intention to do the thing promised."

  ### 2. What is the price of this rejection?
  This is the most important part for your term paper. Rejecting (2) costs you the **Will Theory of Obligation**.

  *   **The Cost:** You must admit that normative force can be generated externally to the agent's actual mental state. The obligation does not come from the *mind*; it comes from the *convention*.
  *   **Why this is good for you:** This is exactly the distinction between Philosophy (often focused on the morality of promising) and Law (focused on the reliance and objective manifestation of assent).
  *   **Blocking the Redundancy Horn (5):** Your argument claims that if the intention precedes the promise, the promise is redundant. This assumes that **Intention = Obligation**. It does not.
      *   I can intend to $\Phi$ (e.g., visit my mother) without being obligated to $\Phi$.
      *   I can promise to $\Phi$, thereby becoming obligated, even if I secretly lack the intention.
      *   Therefore, the promise is not a *report* on a prior state (redundant); it is an *assumption of a new normative status* (obligation). The utterance changes the landscape of reasons, regardless of the internal psychology.

  By rejecting (2), you save the phenomenon of the "binding lie." In contract law, this is the **Objective Theory of Contracts**: a party is bound by what they *said* and what a reasonable person would *rely on*, not by what they secretly *meant*.

  ### 3. Does Step (7) fall out once you fix the earlier steps?
  **No, Step (7) is an independent slide.**

  Your argument relies heavily on the specific psychology of *commisives* (promises), which involve forward-looking intentions. You correctly noted that "I hereby resign" doesn't require a forward-looking intention to remain resigned.

  *   **Exercitives (Resigning, Sentencing):** These change a status immediately. They do not require a future intention to be felicitous, only the authority to speak.
  *   **Commissives (Promising, Contracting):** These bind the future.

  If you fix (2) by distinguishing sincerity from constitution, the argument works for Commissives (insincere promises are still binding), but it never gets off the ground for Exercitives (which don't require the intention in the first place). Therefore, (8) ("no such thing as doing something normative by saying something") does not follow. You save the institution of speech acts, but you have to accept that different speech acts have different felicity structures.

  ### 4. The "Liar vs. Gullible" Wrinkle (Uptake)
  You worry that if the hearer knows you are lying, uptake fails, and the promise dies. This is the tension between **Strawsonian uptake** (philosophy) and **Objective Manifestation** (law).

  *   **The Philosophical View:** If you wink at me while promising, I know you aren't promising. No uptake, no promise.
  *   **The Legal View:** If I sign a lease intending to trick you, but you reasonably believe I am bound, I am bound. The law protects reliance, not the meeting of minds.

  **How to handle this in the paper:**
  Do not try to solve this philosophically. Use it. Your paper's thesis should be: *"Contract law cannot be grounded in the philosophy of promising because the felicity conditions for legal obligation diverge from the sincerity conditions for moral promising."*

  *   If you reject (2) (as advised above), you align with the Law: The liar is bound.
  *   If you keep (2) (as your draft does), you align with a strict moral view: The liar is not bound.
  *   **The Pivot:** Since you are in a law seminar, you must argue that the Law *rightly* rejects the strict philosophical view. The "incoherence" you found isn't in the concept of contract; it's in the attempt to reduce Contract to Promise.

  ### Summary of the "Exit Price"
  To save the argument from nihilism (8) while keeping the insight that "Contract $\neq$ Promise":

  1.  **Reject (1)?** No. Keep felicity conditions; they are useful.
  2.  **Reject (2)?** **Yes.** Distinguish between *acting* (constitutive) and *meaning it* (sincerity).
      *   *Price:* You abandon the idea that obligation requires internal sincerity. You accept that social convention creates obligation ex nihilo.
  3.  **Block (5)?** Yes. Distinguish *Intention* (psychological) from *Obligation* (normative). The promise creates the obligation, not the intention.
  4.  **Reject (7)?** Yes. Acknowledge that not all performatives rely on future intention.

  **Recommendation for the Term Paper:**
  Don't argue that "Contracts are incoherent." Argue that **"The 'Promise Model' of Contract is category-mistaken."**
  Your current draft proves that *Promising* (as a moral act of will) cannot sustain *Contract* (as a legal act of reliance). That is a B+ paper.
  If you make the pivot above—arguing that the Law *must* treat insincere utterances as binding to function, and therefore Contract is a distinct normative technology from Promising—that is an A paper. It respects the philosophy (Austin) while satisfying the law (Objective Theory).

  Your advisor said "fix it or scrap it." The fix is to stop trying to destroy speech acts and start using your argument to show why Law and Morality must come apart.
