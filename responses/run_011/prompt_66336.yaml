  7.  **Final Polish:** Ensure the tone is authoritative but collaborative, matching the user's request for an "audit." (Self-Correction: Make sure to explicitly address the "cost in terms of what I will no longer be entitled to say" requirement for each tension.)

      *   *Check Tension 1 Cost:* If Pt 2 wins, you lose the "extension of the person" language in Pt 5. You become a legal positivist about IP. If Pt 5 wins, you lose the "no property before law" absolutism in Pt 2.
