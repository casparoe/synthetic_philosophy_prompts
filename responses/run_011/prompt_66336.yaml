      *   **Tension A: Property Theory (Pt 2 vs. Pt 5).**
          *   Pt 2: No property before law. Ownership is constituted by rules.
          *   Pt 5: Novel is extension of person. Claim *precedes* law. Copyright *recognizes* not *creates*.
