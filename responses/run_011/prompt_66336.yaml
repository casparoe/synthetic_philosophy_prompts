      *   **Severity 1: The Metaphysical Fault Line (Property).** Pt 2 vs. Pt 5 (and ripple to Pt 7f). This is the most dangerous.
      *   **Severity 2: The Boundary of Generality.** Pt 4 vs. Pt 7f.
      *   **Severity 3: Egalitarianism vs. Exit.** Pt 8 vs. Pt 7g.
      *   **Apparent Tensions:** Pt 1 vs. Pt 3 (Wrongfulness), Pt 5 vs. Pt 6 (Moral vs. Economic rights).
      *   **The Single Revision:** Propose modifying Pt 2 to allow for "Personhood Property" vs. "External Property."

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining Tension 1 (Pt 2 vs Pt 5):* Pt 2 says "No property before law." Pt 5 says "Claim precedes law." This is a direct contradiction.
      *   *Cost:* If you keep Pt 2, you must weaken Pt 5 to metaphor. You can't say copyright *recognizes* a pre-existing claim; you must say it *creates* a special incentive for art. If you keep Pt 5, you must weaken Pt 2 to "No *external* property before law."
      *   *Ripple:* This affects Pt 7f (Exit Tax). Why is exit tax wrong? If Pt 2 holds, the state defines the terms of citizenship and asset holding. If you leave, they can tax the "deemed sale." To object implies a natural right to the capital. This aligns with Pt 5 (natural claim). So Pt 2 is the outlier.
      *   *Refining Tension 2 (Pt 4 vs Pt 7f):* Pt 4 says generality makes it not mugging. Exit tax applies to a specific class (leavers). Is that "no particular person in view"? It's a class defined by choice. But Pt 7f calls it indefensible. The tension is: Is the Exit Tax a violation of Pt 4 (not general enough) or a violation of Pt 7g (right to leave)? Actually, the tension is between Pt 2 (State defines property) and Pt 7f (State can't define exit terms).
      *   *Refining Tension 3 (Pt 8 vs Pt 7g):* Pt 8 cares about the bottom. Pt 7g prioritizes exit. High exit undermines the tax base for the bottom. This is a practical tension, not logical. But it strains the "moderate egalitarian" claim if the exit right creates a loophole for the wealthy to evade the standing-improving taxes.
      *   *Apparent:* Pt 1 (Theft is expressive) and Pt 3 (Tax is resource-treatment). These are compatible. Theft violates will by taking; Tax violates will by using. Both are agency violations.
      *   *Apparent:* Pt 5 (Extension of person) and Pt 6 (Expires). Moral rights (integrity) vs Economic rights (monopoly). Pt 5 emphasizes integrity. Pt 6 emphasizes monopoly term. Compatible.

      *   *The "Single Revision":* Modify Pt 2. Distinguish between *allocative property* (land, capital, houses - constituted by law) and *expressive property* (labor, art, self - antecedent to law). This saves Pt 5, Pt 7f, and Pt 1, while keeping the core of Pt 2 for standard taxation (Pt 3, Pt 7d).

  6.  **Final Review against Constraints:**
      *   Did I name philosophers? No.
