      *   *Point 3 (Taxation/legitimacy):* "Is taxation theft?" is malformed (due to Pt 2). But tax can be wrongful by treating me as a *resource*. Legitimacy depends on shared recognition/participation, not rate.
      *   *Point 4 (Generality):* Tax vs. Mugger = Generality/Rule of Law. Published rules, binding all, no particular person in view.
      *   *Point 5 (Copyright/Exception):* Novels are extensions of the person. Claim precedes law. Copyright *recognizes* rather than *creates*. Objection to distortion even if paid. (Contradicts Pt 2?)
      *   *Point 6 (Copyright/Duration):* Copyright term is too long. Book uses inherited language/forms. After decent interval, belongs to everybody. (Tension with Pt 5's "precedes law"?)
      *   *Point 7 (Verdicts/Data):*
