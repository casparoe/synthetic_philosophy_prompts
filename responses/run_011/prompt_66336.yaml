          *   Pt 7g: Right to leave is paramount.
          *   *Analysis:* Exit tax targets a specific act (renunciation). Is it "framed with no particular person in view"? Technically yes (anyone who leaves), but functionally it penalizes a specific choice to exit the social contract.
          *   *Severity:* Medium. Pt 4 suggests rules binding everyone are okay. Pt 7f says a rule binding only leavers is not. Is "leavers" a valid general class?
          *   *Deeper Conflict:* Pt 2 says property is legal. Pt 7f says Exit Tax is wrong because it treats departure as a "sale." If property is legal (Pt 2), the state can define the terms of exit. If Exit Tax is wrong (Pt 7f), there must be a pre-legal right to take your "self" (and accrued capital) elsewhere. This links back to Tension A.

      *   **Tension D: Copyright Duration vs. Copyright Nature (Pt 5 vs. Pt 6).**
          *   Pt 5: Claim precedes law, extension of person.
          *   Pt 6: Book uses inherited language, belongs to everybody after decent interval.
          *   *Analysis:* If it's an extension of the person (Pt 5), why does it expire (Pt 6)? Usually, personality rights (moral rights) don't expire, while economic rights do. Pt 5 mentions caring about integrity (moral) more than money. Pt 6 talks about term (economic).
