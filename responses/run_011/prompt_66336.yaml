      *   **Tension B: The Nature of Wrongfulness (Pt 1 vs. Pt 3).**
          *   Pt 1: Wrong is substituting choice/will (expressive).
          *   Pt 3: Tax is wrongful if it treats me as a *resource*.
          *   *Analysis:* These seem compatible. Treating as a resource *is* substituting choice/will (using me for ends I don't share). However, Pt 3 says tax isn't theft (per Pt 2), but can be wrongful. Pt 1 defines theft's wrong. Pt 3 defines tax's wrong.
