  2.  **Deconstruct the Scientific/Philosophical Problem:**
      *   **MLST (Multilevel Selection Theory) Debate:** This is the classic Price Equation partitioning debate.
          *   *Side A (Group Selectionists/MLS2):* Groups are Darwinian individuals. They vary, reproduce, and have heritability. Fitness attaches to the group.
          *   *Side B (Individualists/MLS1):* Everything reduces to individual gene/cell fitness. Group effects are just contextual effects on individual fitness. The "group fitness" is a statistical aggregate, not a causal property.
      *   **The User's Specific Twist:**
          *   *Regime 1:* "Differential death" vs. "Differential reproduction." If communities don't *reproduce* (make new communities via a bottleneck/propagule), can they be selected? This touches on the *Interactor vs. Replicator* distinction (Hull) and the requirement for *Multiplication* (Godfrey-Smith).
          *   *Strain B:* Phenotypic plasticity/switching. This undermines the "stable individual" assumption often used to ground the lower level. If individuals aren't stable, is the "individual level" even a coherent baseline?
      *   **The User's Hypothesis:** It's about definitions (Causal vs. Partitioning) and Reproduction requirements.

