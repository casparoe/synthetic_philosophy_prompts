      *   *Refining the "Licensing" argument:* Make sure to emphasize that the *reader* does the work, not the theory. The theory provides the label, the novel provides the evidence.
      *   *Refining Mrs. Benn:* Focus on the "presence" of her life vs. the "absence" of Stevens's.
