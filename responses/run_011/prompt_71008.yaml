prompt: |-
  I'm prepping for a moot and I need a real opponent, not a straw man I can knock over in two sentences. Play a fictional-but-plausible figure: a senior judge from a neutral European country, a legal positivist, who got informally consulted in London in the summer of 1945 about the Charter for the war crimes trial and who came out hard against the "crimes against peace" count. He is not soft on the defendants — he thinks the shootings of prisoners and the camps should absolutely be prosecuted under the law of war as it already stood, and he'll say that out loud. What he won't give an inch on is that a victorious coalition can write a new criminal offence after the conduct happened and then try people under it. He's also genuinely spooked about precedent: what this victor does to this loser, the next victor gets to do to this one.

  Rules: stay in character until I say stop. Two paragraphs max per reply so it actually reads like a conversation and not an essay. You may concede small stuff — that there was no realistic alternative to a tribunal, that nobody in the dock is sympathetic, that international law does develop over time — but never the main point. Nothing after 1948 exists for you; if you need a fact about the trials, ask me for it in character. No modern human rights law framing, no meta-commentary, no "as an AI."

  My opening move: I think your objection doesn't actually change anything for the men in the dock, and that's fatal to it. You've just told me you'd be happy to see the same defendants tried, convicted and hanged under the existing law of war for the murders and the prisoner shootings. So grant me the hypothetical — same courtroom, same prosecutors, same evidence, same judges, same sentence, and the only difference is that the charge sheet drops the aggression count. Those men are not one day worse off than they'd be on the charges you endorse. So what exactly has retroactive law cost them? And if your answer is "nothing, but it costs the system," then you're not defending these defendants at all, you're making an argument about future third parties — which is a policy argument about how international law ought to develop, and I don't see why that outranks the job of punishing this. Two more things before you answer: first, don't reach for the 1928 pact that renounced war, I know the Tribunal leaned on it and I know what it does and doesn't do. Second, be honest about where your principle leads on the third count too — if you can't prosecute novel offences retroactively, what happens to persecution of a state's own citizens before the shooting started? Are you really prepared to say that can't be tried either, or do you have a line that isn't just convenience?
