prompt: |-
  I've spent fifteen years verifying probabilistic forecasts — Brier scores, reliability diagrams, resolution vs sharpness, reference classes, base rates, backtests, target leakage — and ive never read any philosophy of probability. Someone described Lewis's "Principal Principle" to me after a talk and I think I get the gist: if you know the objective chance of an outcome is x, your credence in it should be x, subject to some condition about what else you're allowed to condition on. And apparently there's a whole fight underneath about what chance even is — best-system/Humean accounts versus something with more modal oomph — plus a puzzle called "undermining," where the chance function itself seems to license histories whose frequencies would contradict it.

  Restate all of that in my vocabulary, as faithfully as you can. What would the Principal Principle look like as a claim about a forecaster's calibration, and what are the rival accounts of chance saying in terms of base rates, estimation error, and out-of-sample behavior? Then give me the residue report: which parts map cleanly, which parts you had to bend out of shape to make them fit, and which parts have no expression at all in verification language — I'm especially curious whether the "undermining" thing dissolves once you notice that in my world the observed frequency *is* the target, so there's nothing left for it to conflict with. Be explicit about where you're actually translating versus quietly assuming chance = long-run frequency and calling that a translation.

  End with a line beginning "Verdict:" giving one of DEFECT-IN-MY-VOCAB, PRINCIPLE-WAS-INFLATED, or IRREDUCIBLE-RESIDUE, with percentage weights if you're splitting between them.
