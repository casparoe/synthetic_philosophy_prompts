answer: |-
  Here is the translation of Lewis's metaphysics into your verification stack, followed by the residue report.

  ### 1. The Principal Principle as a Calibration Claim

  **Philosophical Statement:** If you know the objective chance of event $A$ is $x$, and you have no "inadmissible" information (like seeing the future), your subjective credence in $A$ should be $x$.

  **Forecasting Translation:** This is a claim about **conditional reliability** (calibration) given knowledge of the Data Generating Process (DGP).

  Let $p_t$ be your forecast probability at time $t$. Let $\theta$ be the true parameter of the DGP (the "objective chance"). Let $I_t$ be your information set at time $t$.
  The Principal Principle asserts:
  $$ E[Outcome_t \mid \theta = x, I_t \text{ is admissible}] = x $$

  In your vocabulary: If you condition your reliability diagram on bins where the true DGP parameter is known to be $x$, your observed frequency must converge to $x$. The "admissibility" clause is simply a **no-leakage constraint**. It forbids conditioning on information that correlates with the residual error of the DGP (e.g., looking at the test set labels).

  **Operational Meaning:** The Principal Principle is the definition of **perfect calibration for an omniscient model**. It says there is no gap between the "true risk" and your "assessed risk" once you account for information constraints.

  ### 2. Rival Accounts of Chance (Humean vs. Modal)

  The fight is about what $\theta$ (the "chance") actually *is*.

  **A. Modal/Propensity Account (The "Structural Parameter" View)**
  *   **Philosophy:** Chance is a physical disposition inherent in the setup (like the weight distribution of a coin), independent of the actual sequence of outcomes.
  *   **Forecasting Translation:** $\theta$ is a **fixed structural parameter**. It exists prior to data generation.
  *   **Base Rates:** The base rate is an *estimate* of $\theta$. Estimation error is due to finite sample size (variance), not because $\theta$ is ill-defined.
  *   **Out-of-Sample:** If the structure holds, out-of-sample performance should match in-sample parameter estimates within confidence bounds. Non-stationarity is a violation of the model assumptions, not a change in the nature of probability.

  **B. Humean/Best-System Account (The "Best Fit" View)**
  *   **Philosophy:** There are no hidden dispositions. "Chance" is just the summary statistic of the total history of events that provides the best balance of simplicity and fit (the "Best System").
  *   **Forecasting Translation:** $\theta$ is the **optimal model fit over the entire dataset** (train + test + future). It supervenes on the data. There is no "true" parameter independent of the realized history.
  *   **Base Rates:** The base rate *is* the realized frequency (regularized for complexity). "Estimation error" is a category mistake; there is only model fit vs. data.
  *   **Out-of-Sample:** Out-of-sample behavior is just more data to be included in the "Best System." If the future data diverges wildly, the "true chance" was different than we thought, because the "true chance" is defined by the total mosaic of events.

  ### 3. The "Undermining" Puzzle

  **The Puzzle:** If Chance is Humean (defined by the total history), then the current chance function assigns positive probability to future histories that, if they occurred, would make the current chance function false (because the "Best System" for that new total history would have different parameters).
  *Example:* A coin has chance 0.5 (based on history so far). But if it lands Heads 1 million times in a row, the "Best System" for that completed history says chance = 1.0. So the 0.5 chance assigned probability to a future that proves the 0.5 chance was never the "true" Best System.

  **Your Vocabulary Translation:** This is **Parameter Instability under Refitting**.
  *   You fit model $M_0$ on data $D_{0:t}$. It says $P(Heads) = 0.5$.
  *   You acknowledge a possible future path $H_{future}$ (all Heads).
  *   If $H_{future}$ occurs, you refit on $D_{0:t+future}$. The new model $M_1$ says $P(Heads) = 1.0$.
  *   **Undermining:** $M_0$ assigned positive likelihood to a path that validates $M_1$ and invalidates $M_0$ as the "Best System."

  **Does it dissolve in your world?**
  You asked: *"In my world the observed frequency is the target, so there's nothing left for it to conflict with."*

  **Translation Verdict:** It dissolves **only if** you adopt the Modal view (Fixed DGP).
  *   **If you assume Stationarity (Modal):** The target is the expectation $E[Y|X]$, not the realization $Y$. The frequency is an estimator. Undermining is impossible because the "truth" doesn't change based on the sample.
  *   **If you assume Empiricism (Humean):** The target *is* the realized frequency of the total history. Here, Undermining does **not** dissolve; it becomes a logical inconsistency in your loss function. It means your "true model" is path-dependent.
  *   **Why you don't see it:** In verification, you freeze the test set. You treat the DGP as fixed for the duration of the backtest. You implicitly assume the Modal view to calculate Brier scores. You treat the "true probability" as a fixed property of the reference class, not a variable that updates as new data arrives.

  ### 4. Residue Report

  **What Maps Cleanly:**
  *   **Principal Principle $\rightarrow$ Conditional Calibration:** The norm that credence should match chance maps perfectly to the norm that forecasts should match observed frequencies within reference classes.
  *   **Admissibility $\rightarrow$ No Leakage:** The restriction on what information you can condition on is exactly the restriction on look-ahead bias.
  *   **Undermining $\rightarrow$ Overfitting/Refitting Risk:** The logical tension maps to the practical tension between a model fitted on past data and the possibility that future data forces a complete model restructure.

  **What I Bent Out of Shape:**
  *   **"Objective Chance" vs. "DGP Parameter":** I am equating Lewis's metaphysical "Chance" with your statistical "Parameter." In philosophy, Chance is supposed to *explain* the frequency. In your work, the parameter *summarizes* the frequency. I am treating your "DGP" as more real than you might technically regard it.
  *   **"Credence" vs. "Forecast":** Lewis talks about rational belief degrees. You output numbers for scoring rules. I am assuming your forecasts are intended to be epistemic probabilities, not just trading signals optimized for log-loss.

  **What Has No Expression (The Irreducible Residue):**
  *   **Metaphysical Supervenience:** Whether probability *supervenes* on the mosaic of events (Humean) or exists as a modal primitive (Propensity) has **zero impact** on your Brier score, reliability diagram, or backtest validity. Your metrics work identically regardless of which metaphysical story is true.
  *   **The "Why" of Undermining:** You treat Undermining as "Non-stationarity" or "Regime Change." Philosophers treat it as a logical contradiction in the definition of truth. You solve it by collecting more data or segmenting regimes; they solve it by debating the nature of laws.
  *   **Truth Conditions:** In verification, "truth" is the realization (0 or 1). In the philosophy of chance, "truth" is the relationship between the proposition and the chance function. The gap between *realization* and *expectation* is where you live; the gap between *expectation* and *chance* is where they live.

  **Explicit Assumption Check:**
  I assumed **Chance = Long-Run Frequency** when translating the Humean view. This is faithful to Lewis's interpretation of Humeanism but contradicts the Modal view. In your vocabulary, you generally operate *as if* Chance = Long-Run Frequency (via the Law of Large Numbers), but you treat the DGP as fixed (Modal). I glossed over this tension to make the translation work, but it is the exact point where the philosophy diverges from standard quant practice.

  Verdict: 60% PRINCIPLE-WAS-INFLATED, 40% IRREDUCIBLE-RESIDUE
