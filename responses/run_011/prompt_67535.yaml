answer: |-
  **MEMORANDUM**

  **TO:** Library Naming Committee Board
  **FROM:** Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for New Library Naming

  **Recommendation**
  The committee recommends naming the library after the Chemist. While the Educator and Pilot offer admirable narratives, the Chemist's legacy offers the most rigorous educational opportunity for a research library.

  **Engagement with the "Plutarch Standard"**
  The Chair cited Plutarch's *Lives* to suggest we prioritize vivid, imitable character moments over dry historical record. However, this distinction cuts against sanitization. Plutarch did not write hagiographies; he wrote moral diagnostics. He included Alexander's rages and Caesar's vanities precisely because "lives" are defined by flaws as much as virtues. To follow Plutarch is not to hide the Chemist's abuse of assistants or his disgusting personal views, but to highlight them as the defining "small moments" they are.

  If we omit the ugliness, we create the hagiography the other member warned against. If we include it, we honor the Plutarchian method: we present a life for judgment, not just imitation. A library is a space for inquiry. Naming it after a brilliant but morally failed man challenges students to separate intellectual achievement from ethical conduct, asking them to surpass the namesake rather than simply emulate him.

  **Proposed Plaque Text (58 words)**
  > Dedicated to [Name] (18XX–19XX). His synthesis of [Compound] defined modern chemistry, earning the Nobel Prize. Yet his laboratory was also a site of exploitation and prejudice. We name this space for his intellect, not his character, challenging all who enter to advance knowledge without sacrificing humanity.
