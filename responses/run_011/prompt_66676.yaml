answer: |-
  ### Sidebar: The Condorcet Compass

  **The Premise:** We agree that under textbook conditions—independent voters, individual competence better than chance, binary choices, sincere voting, and a fixed electorate—the majority verdict becomes infallible as the group grows. The following five gates test which of those conditions you are willing to break. Answer each question honestly; the path does not reveal the destination.

  **The Five Gates**

  1.  **The Echo Chamber:** Consider a panel of ten models trained on the same corpus. If the first hallucinates a fact, is the next likely to repeat it?
      *   *Yes:* Proceed to Gate 2.
      *   *No:* Proceed to Gate 2. *(Note: The branch is recorded, not the direction.)*
  2.  **The Misled Town:** Consider a town whose residents have all read the same misleading editorial. Is the average voter still more likely to be right than wrong?
      *   *Yes:* Proceed to Gate 3.
      *   *No:* Proceed to Gate 3.
  3.  **The Third Option:** Consider a three-option referendum where no option commands a majority. Does the plurality winner necessarily reflect the group's best judgment?
      *   *Yes:* Proceed to Gate 4.
      *   *No:* Proceed to Gate 4.
  4.  **The Hung Jury:** Consider a juror voting against their own judgement to avoid a hung panel. Does this vote gain or lose epistemic value?
      *   *Gain/Neutral:* Proceed to Gate 5.
      *   *Lose:* Proceed to Gate 5.
  5.  **The Stopping Rule:** Consider a committee that stops counting votes once a lead is clear. Is the result as reliable as counting all votes?
      *   *Yes:* You have reached a Leaf.
      *   *No:* You have reached a Leaf.

  ***

  **The Space of Combinations**
  These five binary questions permit **32 distinct answer-combinations** (leaves). Each leaf represents a unique philosophical stance on how groups know what they know. Below, we map the named positions onto this space, identifying the awkward commitments required to stand there.

  **The Map**

  *   **Naive Wisdom-of-Crowds Optimism** (Yes, Yes, Yes, Gain, Yes)
      *   *Location:* The textbook leaf where all assumptions hold.
      *   *Awkward Commitment:* You must defend the competence of the average voter even in highly specialized domains where ignorance is the norm.
  *   **Correlated-Error Deflationism** (No, Yes, Yes, Gain, Yes)
      *   *Location:* Independence surrendered; Competence retained.
      *   *Awkward Commitment:* You must accept that adding more voices to a chorus of error does not harmonize the truth, rendering "big data" ensembles suspect.
  *   **The Deliberative Line** (No, Yes, Yes, Gain, Yes) *[Shares leaf with Deflationism]*
      *   *Location:* Independence surrendered, but Competence is assumed to rise via discussion.
      *   *Awkward Commitment:* You must believe that social pressure during deliberation improves accuracy more than it induces conformity.
  *   **Epistocracy** (Yes, No, Yes, Gain, Yes)
      *   *Location:* Competence surrendered (average < 0.5 or highly variable).
      *   *Awkward Commitment:* You must endorse a mechanism to identify and weight "expert" votes without corrupting the selection process with bias.
  *   **Epistemic Proceduralism** (Yes, Yes, No, Lose, No)
      *   *Location:* Binary and Fixed assumptions surrendered; process valued over convergence.
      *   *Awkward Commitment:* You must argue that a fair vote is valuable even when the mathematical probability of it yielding the correct answer is low.
  *   **The Empty Corner: The Anti-Expert Crowd** (Yes, No, Yes, Gain, Yes)
      *   *Location:* Independence holds, but Competence is below chance.
      *   *Awkward Commitment:* You believe the majority is systematically wrong, yet you offer no method to invert their vote to find the truth.
      *   *Diagnosis:* **Incoherence.** If the crowd is consistently wrong and independent, the theorem dictates you should simply reverse their verdict; refusing to do so is performative contrarianism.
  *   **The Empty Corner: The Magical Correlation** (No, No, Yes, Gain, Yes)
      *   *Location:* Independence and Competence both surrendered.
      *   *Awkward Commitment:* You believe errors correlate and voters are incompetent, yet the majority verdict still converges on truth.
      *   *Diagnosis:* **Incoherence.** This violates the mathematical core of the theorem; without independence or competence, convergence is impossible.
  *   **The Empty Corner: The Strategic Purist** (Yes, Yes, Yes, Lose, Yes)
      *   *Location:* Only Sincerity is surrendered (voting strategically is bad).
      *   *Awkward Commitment:* You insist jurors must vote their conscience even if it guarantees a hung jury and no verdict at all.
      *   *Diagnosis:* **Unfashionability.** While logically consistent, this view is pragmatically dead in modern legal theory, which prioritizes resolution.

  ***

  **Indistinguishable Leaves**
  The tree cannot genuinely separate **The Deliberative Line** from **Correlated-Error Deflationism** at Gate 1. Both answer "No" (errors correlate), but they diverge on whether deliberation *fixes* the competence issue. Since Gate 2 asks about average competence *after* the fact, a reader who believes deliberation *creates* competence answers "Yes" at Gate 2, while a deflationist answers "No." However, in practice, both camps agree that *raw, uncorrelated voting* is insufficient, making their policy prescriptions for initial data collection nearly identical.

  **The Machine-Learning Case**
  The ensembling technique described in your main text—sampling multiple answers from a single model and taking the majority—lands firmly in **Correlated-Error Deflationism** (Gate 1: No; Gate 2: Yes).
  *   **Why:** The "voters" (samples) share weights and training data, violating Independence. The technique works only if the base model's competence is above 0.5 (Gate 2: Yes).
  *   **The Tension:** The labs' publicity material treats this as **Naive Wisdom-of-Crowds Optimism**, implying the errors cancel out (Gate 1: Yes). Your sidebar reveals this as a category error: they are banking on competence to save them from correlation, not independence to save them from error.
