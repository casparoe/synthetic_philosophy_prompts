      *   *Actually, looking closer:* The prompt says "One of our members keeps invoking Margalit... another thinks we've become exactly the memory industry Rieff complains about." I need to take a side.
      *   *Side:* Margalit. The duty to remember specific humans outweighs the comfort of the living (staff) or the abstract fear of "grievances." The "memory industry" critique applies when memory is performative. Here, it's restorative.
