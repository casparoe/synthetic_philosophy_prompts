answer: |-
  Here is a reconstruction of Gongsun Long's *White Horse Dialogue* (Bái Mǎ Lùn) using the vocabulary of programming language theory. I will select a formalism, translate the arguments step-by-step, evaluate their type-theoretic validity, and then file a residue report on what the formalism cannot capture.

  ### 1. The Formalism: Intensional Refinement Types

  To be honest to both your background and the text, I cannot use simple extensional set theory (where $\{x \mid H(x) \land W(x)\} \subseteq \{x \mid H(x)\}$ is trivial). Gongsun Long is arguing about **names** (*ming*) and **concepts**, not just extensions.

  I will use a **Dependent Type Theory with Intensional Equality** (similar to CoC or MLTT, but with a focus on nominal definitions).

  *   **Base Type:** `Horse` (represents the shape/form).
  *   **Property:** `Color : Horse -> Type` (a dependent type or predicate).
  *   **Constant:** `White : Color`.
  *   **Refinement:** `WhiteHorse` is defined as $\{ x : \text{Horse} \mid \text{Color}(x) \equiv \text{White} \}$.
  *   **Relations:**
      *   $A = B$: Type equality (intensional/definitional).
      *   $A <: B$: Subtyping (every term of $A$ can be coerced to $B$).
      *   $A \not\equiv B$: The types are not definitionally identical.

  **Interpretive Flag #1:** I am translating the Chinese *fei* ("is not") as **Type Inequality** ($\neq$) rather than **Membership Negation** ($\notin$). If I translate it as "No white horse is a member of the set of horses," the argument is a type error immediately. Gongsun Long is likely arguing about the identity of the *concepts*, not the membership of the *instances*. I will note where this distinction matters.

  ---

  ### 2. Step-by-Step Reconstruction

  #### Argument 1: Composition (Shape vs. Color)
  *   **Text:** "Horse" names the shape. "White" names the color. The name naming color is not the name naming shape. Therefore, white horse is not horse.
  *   **PL Translation:**
      *   Let `Horse` be defined by a structure $S$ (shape fields).
      *   Let `White` be a value of type `Color`.
      *   `WhiteHorse` is the type $\Sigma (h:\text{Horse}). (\text{color}(h) = \text{White})$.
      *   **Claim:** $\text{WhiteHorse} \neq \text{Horse}$.
  *   **Typecheck:** **PASS.**
      *   In intensional type theory, a sigma type (dependent pair) is not definitionally equal to its base type. $\{x:H \mid P(x)\} \neq H$.
      *   The definition of `WhiteHorse` contains a constraint that `Horse` does not. They are distinct type constructors.
  *   **Comment:** This falls out as a plain fact of intensional logic. The *names* (type identifiers) are distinct.

  #### Argument 2: The Demand Test (Extensional Behavior)
  *   **Text:** If you ask for a horse, a yellow or black one will do. If you ask for a white horse, they won't. If white horse were horse, the demands would be the same. They aren't, so white horse is not horse.
  *   **PL Translation:**
      *   Define two functions representing the "demand":
          *   `demand_horse : Option Horse` (Accepts any `h : Horse`).
          *   `demand_white_horse : Option WhiteHorse` (Accepts only `wh : WhiteHorse`).
      *   **Observation:**
          *   `demand_horse (yellow_horse)` $\to$ `Some(yellow_horse)`.
          *   `demand_white_horse (yellow_horse)` $\to$ `Type Error` (or `None` via runtime check).
      *   **Claim:** If `WhiteHorse = Horse`, then `demand_horse` and `demand_white_horse` should be observationally equivalent. They are not.
  *   **Typecheck:** **PASS (with coercion caveat).**
      *   This tests **Substitutability**.
      *   If we assume `WhiteHorse = Horse`, then `demand_white_horse` should accept `yellow_horse`. It fails.
      *   Therefore `WhiteHorse \neq Horse`.
      *   *However*, if we assume `WhiteHorse <: Horse` (subtyping), we can coerce `WhiteHorse` to `Horse`. But we cannot coerce `Horse` to `WhiteHorse` (no "color widening").
      *   Gongsun Long treats the lack of bidirectional coercibility as proof of non-identity. PL agrees: $A <: B$ does not imply $A = B$.
  *   **Comment:** This is a standard observational equivalence check. It proves the types are distinct, but it does not prove that a `WhiteHorse` *instance* isn't a `Horse` instance. It proves the *interfaces* differ.

  #### Argument 3: The "Pinned Down" White (Abstraction vs. Application)
  *   **Text:** (Roughly) "White" doesn't specify what is white. "White Horse" fixes the white to the horse. The white in the compound is not the white in the abstract.
  *   **PL Translation:**
      *   `White` alone is a value of type `Color`, or a polymorphic predicate $\forall \alpha. \alpha \to \text{Prop}$.
      *   In `WhiteHorse`, `White` is instantiated at type `Horse`.
      *   **Claim:** The predicate `White` (unapplied) $\neq$ The predicate `White` (applied to Horse).
  *   **Typecheck:** **BENDS NOTATION.**
      *   In standard PL, `White` is a constant. `Color(h) = White` is a proposition.
      *   Gongsun Long treats "White" as an entity that gets "fixed" or "located."
      *   To model this, we need **Modal Types** or **Contextual Scoping**.
      *   We could say `White` is a free variable in context $\Gamma$, but in `WhiteHorse`, it is bound to the field `color`.
      *   **Formalism Strain:** PL treats properties as functions. Gongsun Long treats them as ontological constituents that change state when combined. I have to model "White" as a mutable constraint or a scoped effect to capture the "pinning" intuition.
      *   *Translation:* `White` is a type parameter $\alpha$. `WhiteHorse` is `Horse<White>`. The parameter is instantiated.
  *   **Comment:** This step requires viewing types as having internal state or scope, which is non-standard. It maps best to **Generics**: `List<T>` is not `List`. But `White` isn't a parameter of `Horse` originally; it's an external constraint.

  ---

  ### 3. Residue Report: What Doesn't Typecheck

  Here is what remains after the translation. These are the points where the PL framework either hides the argument or forces a decision the text leaves open.

  #### A. The Ambiguity of *Fei* (Is Not)
  *   **The Issue:** In PL, we distinguish:
      1.  **Type Identity:** `WhiteHorse != Horse` (True).
      2.  **Subtyping:** `WhiteHorse <: Horse` (True).
      3.  **Membership:** $\forall x, \text{isWhiteHorse}(x) \implies \text{isHorse}(x)$ (True).
  *   **The Text:** Gongsun Long argues "White Horse is not Horse."
      *   If he means (1), he is trivially correct, but the argument seems too heavy for such a light claim.
      *   If he means (3), he is type-unsafe (False).
      *   **Residue:** The argument rides on conflating (1) and (3). He uses the distinctness of the *names* (types) to imply the distinctness of the *ontology* (members).
      *   **Verdict:** **Equivocation.** The PL framework exposes this by forcing you to choose between `=` and `<:`. The text exploits the ambiguity of natural language "is".

  #### B. The Ontology of Properties (Universals)
  *   **The Issue:** Gongsun Long treats "White" as a thing that can exist, combine, and get "pinned."
  *   **PL View:** `White` is a value or a predicate. It doesn't "exist" independently of a subject in most type systems (except perhaps as a singleton type).
  *   **Residue:** The argument assumes **Realism about Universals**. "Whiteness" is an entity that enters into a compound with "Horseness." In PL, properties are usually second-class citizens (functions/predicates) unless you use a specific ontology (like a Entity-Component System).
  *   **Verdict:** **Framework Limitation.** Standard type theory is nominal or structural, not mereological. It doesn't model "concepts combining" well, only "constraints stacking."

  #### C. Pragmatics vs. Semantics
  *   **The Issue:** The "Demand Test" (Argument 2) is about *usage* ("If you ask for...").
  *   **PL View:** This is runtime behavior or API contract.
  *   **Residue:** Gongsun Long is doing **Pragmatics** (how names are used in speech acts) but arguing for a **Semantic** conclusion (the nature of the object).
      *   In PL: `demand_horse` and `demand_white_horse` are different *functions*. That doesn't mean the *data* passed to them is fundamentally different in essence, only that the receivers have different guards.
      *   He argues the *guards* define the *essence*.
  *   **Verdict:** **Equivocation.** He derives metaphysics from API contracts.

  #### D. The "Fixing" of White
  *   **The Issue:** The claim that "White" changes when it becomes "White Horse."
  *   **PL View:** In a pure functional system, `White` is immutable. `Color(h) = White` uses the same `White`.
  *   **Residue:** Gongsun Long suggests the *meaning* of White is modified by the context. This is **Contextual Semantics** or **Dependent Meaning**.
      *   To model this, I need a type system where the meaning of a constant depends on the type it is applied to (e.g., Ad-hoc Polymorphism / Type Classes).
      *   `White` in `WhiteHorse` might resolve to a different dictionary than `White` in `WhiteStone`.
  *   **Verdict:** **Framework Limitation.** Simple refinement types assume predicates are stable. Capturing "meaning shift" requires a more complex semantic model (e.g., ludics or game semantics).

  ---

  ### 4. Final Audit: Weak Framework or Equivocation?

  **Is your framework too weak?**
  Partially. Standard type theory is extensional regarding values and intensional regarding types. Gongsun Long is arguing about the **intensionality of values** (the concept of the horse). To fully capture his "White gets pinned" argument, you need a system where *properties have identity* independent of the objects they inhabit (a mereological type theory). Standard PL treats properties as functions; he treats them as ingredients.

  **Is the argument riding on equivocation?**
  Mostly. The core punch of "White Horse is not Horse" relies on sliding between:
  1.  **Concept Identity:** The concept $C_{WH}$ is not identical to $C_H$. (PL: `Type WH != Type H`). **True.**
  2.  **Class Inclusion:** The set $S_{WH}$ is not a subset of $S_H$. (PL: `WH <: H` is false). **False.**

  Gongsun Long proves (1) using the "Demand Test" (which shows types are distinct) and then concludes (2) (that the object isn't a horse).

  **My Translation Decision:**
  I quietly decided to interpret "is not" as **Type Inequality** ($\neq$) rather than **Subtyping Negation** ($\not<:$).
  *   If I interpret it as $\not<:$, the "Demand Test" fails to prove it (because `YellowHorse <: Horse` is true, but `YellowHorse` is not `WhiteHorse`).
  *   By interpreting it as $\neq$, I make the argument valid but trivial (obviously a refined type isn't the base type).
  *   **The Catch:** The philosophical weight of the text comes from the implication that because they are $\neq$, the white horse is somehow excluded from the category "Horse" in a way that matters for reality, not just naming. PL separates Naming (Types) from Reality (Values). Gongsun Long collapses them (*Ming* determines *Shi*).

  ### Summary for the PL Guy
  1.  **Formalism:** Intensional Refinement Types.
  2.  **Valid Steps:** The distinction between the compound type and the base type ($T_{WH} \neq T_H$). The observational difference in functions demanding those types.
  3.  **Invalid Steps:** Inferring that $T_{WH} \neq T_H$ implies $x : T_{WH} \not<: T_H$.
  4.  **Residue:** The argument treats type definitions as ontological ingredients that modify each other upon combination, rather than static constraints. It conflates **Interface Incompatibility** (you can't pass a WhiteHorse to a function expecting *any* color horse without upcasting) with **Ontological Exclusion** (a WhiteHorse is not a Horse).

  **Verdict:** The argument is a **Type Safety Error** masquerading as a **Type Identity Proof**. He proves the types are distinct (which we agree with) to suggest the subtyping relationship doesn't hold (which we reject). Your framework isn't too weak; it's just precise enough to catch the equivocation he relies on.
