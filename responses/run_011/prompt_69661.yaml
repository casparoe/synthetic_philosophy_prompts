  ### Notes on the machinery

  The poem is a pantoum where lines 2 and 4 of each stanza become lines 1 and 3 of the next. Typically, original lines drop out after one recurrence. Here, I have forced the key lines (S1L2 and S1L4) into the second and fourth slots of stanzas 2, 3, and 4. This ensures they survive to the final stanza, satisfying the requirement that the poem closes with the opening line (S1L1) and incorporates the opening third line (S1L3).

  This structural rigidity enacts the philosophical argument. The Skeptic's line ("You weigh the odds...") and the Believer's line ("The fire falls...") repeat verbatim, but their punctuation shifts. In the first stanza, they are statement and statement. In the middle stanzas, they cycle through question, command, and idle assertion. This illustrates Wittgenstein's point: the words remain the same, but their "job" changes depending on the language-game being played. By the final stanza, the Skeptic's line opens the stanza (position 1), while the Believer's opening line closes it (position 4). The positions have traded occupants, yet the lines never truly meet or contradict; they simply rotate around the fixed axis of the believer's life (S1L3 and S1L1), which bookend the resolution.
