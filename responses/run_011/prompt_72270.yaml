  Mr Raffe moved to introduce into the standing orders a predicate 'carried simpliciter', so that the Committee could say plainly which of its own motions were merely carried and which were not. The Clerk objected that a body able to express that predicate could be handed a motion reading 'this motion is not carried simpliciter'. The Clerk further noted that legislating the predicate would oblige the Committee to do the very thing it was constituted to refuse. The amendment was tabled indefinitely, with that reasoning left implicit in the entry. No vote was recorded.

  **4. Procedural Validations**
  Professor Vantongeren moved a genuinely self-referential motion: 'This motion is recorded in these minutes.' The new procedure simply worked. The Committee disposed of the motion without the meeting dissolving, recording it as both carried and not carried. *Ex contradictione quodlibet* had been struck from the rules of order; no explosion occurred. Mr Tew moved that a motion of the form 'the Committee either has a quorum or does not' be carried. The motion was carried nem. con. as a tautology from which nobody proposed to infer anything. The excluded middle was retained without commitment to either disjunct.

  **5. Approval of Minutes (Preface)**
  The Clerk addressed the preface paradox applied to the minutes themselves. The Clerk was prepared to warrant every item severally while declining to warrant the whole. A member asked whether the minutes might be approved as a true record on those terms. The Committee resolved that the minutes were approved as a true record, notwithstanding the lack of conjunctive warrant. The Clerk entered the approval with the specified reservation. Every classical tautology remained in force, though utility was restricted.

  **6. Adjournment**
  Professor Salmela moved that the meeting adjourn. The motion to adjourn was not self-referential and so could not be a glut under 7(b). The Clerk entered that it was not carried. The Clerk further entered that either it was carried or the meeting continues. The Clerk could not take the second step. The Committee's status was left indeterminate. The Chair's declaration was entered under protest. The time of adjournment was entered as 16:00. The minutes were confirmed at the next meeting. The signature block remained unsigned.

