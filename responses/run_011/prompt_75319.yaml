  **Take-Home Final Examination**
  **Module: Philosophy of Psychiatry**
  **Time Allowed: 90 Minutes**
  **Total Marks: 20**

  **Question 1**

  Consider the case of Attention Fragmentation Disorder (AFD). Six years ago, AFD appeared in literature as merely a couple of isolated case reports. Today, it shows a 9% twelve-month prevalence rate. In Year 3 of this period, the diagnostic checklist was revised to add "compulsive notification-checking" as a core symptom. This revision occurred precisely after widespread publicity about the label had already made notification-checking a common behavior among those suspecting they had the disorder.

  In seminars, we have defined "loop closure" as the point where a category can't be disconfirmed anymore because the people its applied to have rearranged themselves to fit it. Given the trajectory of AFD and the specific history of its checklist revision:

  What evidence could show the category tracks a real kind rather than creating one, and why does each obvious answer fail?

  ***

  **Model Answer**

  Attention Fragmentation Disorder (AFD) presents a paradigmatic case of Ian Hacking's interactive kinds, where classifying people fundamentally changes the people classified. The prompt defines 'loop closure' as the epistemic state where disconfirmation becomes impossible because the classified population has rearranged itself to fit the category. To demonstrate AFD tracks a 'real kind' (an indifferent kind) rather than merely creating one, evidence must establish the existence of the underlying pathology independent of the classification's causal influence. However, standard evidentiary routes fail under conditions of loop closure, leaving the ontology of AFD suspended between discovery and invention.

  First, proponents might offer biomarkers, such as distinct neural activation patterns during notification-checking, to prove biological reality. This fails because neuroplasticity ensures that repeated behavioral adoption alters brain structure and function. If the behavior was adopted due to publicity surrounding the diagnosis, the neural correlate tracks the looping effect, not an antecedent natural kind. The biology confirms the behavior's reality and intensity, but not its independence from the label. A brain scan cannot distinguish between a brain shaped by a disorder and a brain shaped by a concept, failing to meet the criteria for an indifferent kind.

  Second, one might argue predictive success validates the kind; if clinicians can predict symptom progression, the category must be real. Under loop closure, this predictive power is tautological rather than truth-tracking. The classification provides a script for patients to enact regarding their own attention and anxiety; successful prediction merely confirms that people are following the script provided by the diagnosis. The Year 3 checklist revision is crucial here: by adding 'compulsive notification-checking' after publicity made it common, the diagnostic criteria were moved to match the population's reaction. The loop closes because the prediction helps cause the outcome, rendering clinical utility distinct from ontological validity.

  Third, cross-cultural or historical prevalence could ostensibly show independence from the local classification. If AFD existed in cultures without the label, it would suggest a real kind. However, psychiatric categories export rapidly via globalization and digital media, particularly those involving technology. The specific behavior of 'compulsive notification-checking' is technologically mediated and culturally contagious. The spike from case reports to 9% prevalence suggests social contagion rather than natural distribution. Absence of the label might simply mean absence of the conceptual vocabulary required to express the distress, not absence of the kind. Furthermore, historical records are interpreted through current diagnostic lenses, reintroducing the loop retroactively into the past.

  Ultimately, loop closure creates an epistemic seal that prevents empirical disconfirmation. To prove AFD is not merely made up, one needs evidence from before the classification influenced the population—a counterfactual now impossible to observe. The revision of the checklist in year three to include behavior generated by the label's publicity cements this closure. Any evidence gathered post-closure is contaminated by the interaction between the knower and the known. Therefore, no contemporary evidence can definitively show AFD tracks a real kind rather than creating one, because the 'people' being studied are already products of the classification. The only remaining recourse is pragmatic: assessing whether holding the category open or closed produces better human outcomes, rather than pretending the ontological question can be settled empirically.

  ***

  **Marking Scheme**

  1. (4 marks) Identifies that behavioral evidence is contaminated by the looping effect itself. Candidates often claim prevalence rates prove validity without addressing the feedback loop.
  2. (4 marks) Argues that biological markers must precede classification to count as indifferent. Students frequently assume neural correlates guarantee natural kinds regardless of timing.
  3. (4 marks) Evaluates cross-cultural studies as a test of independence from local classification. Answers often fail to note that psychiatric categories export rapidly via globalization.
  4. (4 marks) Explains why loop closure makes falsification impossible under current conditions. Many candidates propose refining the checklist rather than questioning the kind's ontology.
  5. (4 marks) Concludes on the ethical/epistemic implication of treating closed loops as real. Students typically ignore the normative stakes of reifying the diagnosis.
