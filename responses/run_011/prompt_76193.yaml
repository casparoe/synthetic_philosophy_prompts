answer: |-
  This is a sharp observation of a specific, high-stakes cognitive state that sits in the blind spot between normative epistemology (how we *should* reason) and the sociology of science (how discovery *actually* happens).

  You are describing a state where the subject is transparently violating their own epistemic norms without the usual psychological penalties (distress, rationalization) and sometimes with instrumental rewards.

  Here is the carving you asked for: the existing vocabulary, why it fails, the specific concept that fits, and the boundaries of the state.

  ### Part 1: The Existing Vocabulary (and why it misses)

  You have already correctly ruled out the psychological heavy hitters. *Cognitive dissonance* requires tension; *self-deception* requires opacity. Your subjects are transparent and calm. Here are the three philosophical concepts that come closest, and where they break down.

  **1. Epistemic Akrasia**
  *   **The Concept:** This is the precise structural match. *Akrasia* is weakness of will (doing what you judge you shouldn't); *Epistemic Akrasia* is believing what you judge you shouldn't believe. The standard formulation is: "I believe P, but I believe that my evidence does not support P."
  *   **Why it fits:** It captures the "I know I shouldn't, but I do" structure perfectly.
  *   **Why it fails:** In almost all contemporary epistemology (e.g., Maria Lasonen-Aarnio, Sophie Horowitz), epistemic akrasia is treated as a *defect*. It is considered paradigmatically irrational. The literature assumes that if you are in this state, you are malfunctioning. It does not account for the *calmness* or the *instrumental success* your subjects report. It treats the state as a bug; your subjects treat it as a feature.

  **2. Acceptance vs. Belief**
  *   **The Concept:** Philosophers like L. Jonathan Cohen and Bas van Fraassen distinguish *belief* (holding something as true) from *acceptance* (adopting a proposition as a premise for reasoning/working). A scientist might *accept* a theory to test it without *believing* it is true.
  *   **Why it fits:** It explains how one can work on a claim without full evidentiary support.
  *   **Why it fails:** Your subjects insist they *believe*. They aren't saying, "I will work as if this is true." They are saying, "I am convinced this is true, despite the metrics." They are reporting a doxastic state (belief), not a pragmatic stance (acceptance).

  **3. The Lakatosian Research Programme**
  *   **The Concept:** Imre Lakatos argued that scientists *should not* abandon a theory when faced with contradictory evidence (anomalies). They should protect the "hard core" of the theory with a "protective belt" of auxiliary hypotheses until the programme stops producing new predictions.
  *   **Why it fits:** It legitimizes sticking with a idea when the evidence looks bad.
  *   **Why it fails:** Lakatos assumes the scientist thinks the anomalies *can* be explained away. Your subjects are more radical. They are admitting, "The evidence really does look like this is wrong. I just don't care." They aren't protecting the theory from falsification; they are acknowledging the falsification and overriding it.

  ### Part 2: The Coinage

  Since "Epistemic Akrasia" carries too much baggage of "irrationality," and "Acceptance" is too weak, you need a term that captures the *volitional* and *strategic* nature of the state.

  I propose you call this: **Strategic Epistemic Akrasia.**

  Or, for a magazine audience, **"Calculated Conviction."**

  But if you want the philosophical precision for your notes, stick with **Strategic Epistemic Akrasia**.

  **Definition:** A conscious, sustained state in which an agent holds a belief $P$ while simultaneously judging that their current evidence warrants withholding $P$, maintained not through self-deception but as a deliberate heuristic to preserve a line of inquiry that standard evidentiary thresholds would prematurely terminate.

  **Why this works:**
  1.  **Strategic:** It acknowledges the instrumental payoff (the "it worked out" factor).
  2.  **Epistemic:** It locates the problem in belief/evidence, not action.
  3.  **Akrasia:** It admits the violation of norms.

  ### Part 3: The Instrumental Wrinkle

  You asked: *Does any concept cover believing-against-your-own-judgement when it's instrumentally good and nobody is fooled?*

  Yes, but it requires splitting "Rationality" into two distinct currencies.

  **1. Epistemic Rationality vs. Instrumental Rationality**
  *   **Epistemic Rationality:** The goal is to have beliefs that match the truth (accuracy). By this metric, your subjects are failing. They admit their belief is not currently supported by the truth-trackers (evidence).
  *   **Instrumental Rationality:** The goal is to achieve desired outcomes (discovery, publication, career survival). By this metric, they are succeeding.

  The "wrinkle" you identified is that in the context of scientific *discovery* (as opposed to scientific *verification*), Instrumental Rationality often requires a temporary suspension of Epistemic Rationality.

  There is a niche argument in philosophy of science, often associated with **Paul Feyerabend** (*Against Method*) and **Michael Polanyi** (*Personal Knowledge*), that suggests "dogmatism" is a necessary engine of science. Polanyi argued that a scientist must believe in a hidden truth that they cannot yet prove, and that this "passionate commitment" is what drives the work.

  However, Polanyi thought the scientist felt the evidence *was* there (tacitly). Your subjects are more honest: they admit the evidence *isn't* there.

  The concept you are looking for is **The Heuristic of Dogmatism**.
  It is the conscious decision to treat a hunch as a fact for the purpose of generating the labor required to turn it into a fact.

  **Is it epistemically fine?**
  *   **The Purist View:** No. It pollutes the commons. If everyone did this, science would be flooded with false leads.
  *   **The Evolutionary View:** Yes, at the population level. If 100 researchers follow the evidence strictly, and 5 researchers engage in Strategic Epistemic Akrasia, the 95 might be "correct" but the 5 might find the breakthrough that changes the paradigm. The individual is epistemically reckless, but the system is epistemically robust *because* it tolerates individual recklessness.

  So, to answer your question: Most philosophers agree it is an *individual* defect, but sociologists of science argue it is a *systemic* virtue. Your subjects are internalizing a systemic virtue as an individual habit.

  ### Part 4: The Carving (Boundaries and Edges)

  You asked where the edges are. When does this stop being one person in a strange condition and start being two people in a trenchcoat? When does it stop being belief?

  **Edge 1: The Update Condition (Belief vs. Dogma)**
  *   **The State:** "I believe P, though evidence says not-P. I will pursue P. If I find evidence Q that definitively kills P, I will drop P."
  *   **The Trenchcoat:** "I believe P. Evidence says not-P. I will pursue P. If I find evidence Q, I will claim Q is flawed."
  *   **The Boundary:** The subject must retain a *conditional* commitment to the evidence. In your examples, the researcher eventually produced the correction *herself*. She was willing to be proven wrong, just not by the *current* metrics. If she had refused to accept the correction even after finding it, she would have crossed into dogma.
  *   **Test:** Ask them, "What would change your mind?" If they can name a specific future state of affairs, it's Strategic Akrasia. If they say "Nothing," it's Ideology.

  **Edge 2: The Prediction Condition (Belief vs. Habit)**
  *   **The State:** They make predictions based on P. They feel surprise if P fails.
  *   **The Trenchcoat:** They act *as if* P is true, but feel no surprise if P fails. They are "going through the motions."
  *   **The Boundary:** Emotional investment. Your subjects are sincere. They *feel* the truth of P. If the belief becomes purely narrative ("I tell myself this to keep working"), it has degraded from belief to **Motivational Fiction**.
  *   **Test:** Do they bet on it? Not just career bets, but cognitive bets. Do they expect the world to look like P?

  **Edge 3: The Transparency Condition (One Mind vs. Two)**
  *   **The State:** The "Evidence Self" and the "Belief Self" are in the same room. The subject can articulate the conflict fluently (as your interviewees did).
  *   **The Trenchcoat:** The subject creates a partition. They talk about the evidence in one paragraph and the belief in another, never letting them touch. They use jargon to blur the line.
  *   **The Boundary:** Integration. The strange condition you identified relies on the *integration* of the conflict. "I know this looks bad, and I'm doing it anyway." That sentence is the glue holding the one mind together. If they stop saying that sentence, the mind has split.

  ### Summary for your Article

  If you need a phrase for the piece, I recommend **"Conscientious Epistemic Deviance."**

  *   **Conscientious:** They know what they are doing; it's not a slip.
  *   **Epistemic:** It's about truth and evidence.
  *   **Deviance:** They are breaking the rules of the scientific method.

  **The Narrative Arc:**
  Science is designed to be a machine for filtering out Strategic Epistemic Akrasia. Peer review, power analysis, and replication are all anti-akrasia devices. But discovery—the front end of the machine—runs on fuel that those devices would reject.

  Your subjects are admitting that they are running a "jailbroken" version of the scientific method on their own cognition. They are overriding the safety protocols (evidence thresholds) because they trust their own heuristic engine (intuition/experience) more than the dashboard lights (p-values).

  It is epistemically dangerous. It is instrumentally vital. It is the moment the scientist stops being a processor of data and starts being a gambler.

  **The Label:**
  Call it **The Gambler's Epistemology**.
  Or, if you want to be more precise: **Licensed Akrasia**.

  But the most accurate description of the *state* itself remains **Strategic Epistemic Akrasia**. It acknowledges the tension, the violation, and the utility.

  **Final check on the "Editor" example:**
  The editor is slightly different. That is **Ethical Akrasia**. "I know I shouldn't publish this (norm), but I believe it's important enough to risk it (belief/action)." It follows the same structure: Normative violation + Consciousness + Instrumental Bet. You can group them under **"Conscious Normative Override."** But for the scientists, keep it Epistemic.

  **The "Two People" Verdict:**
  It remains one person as long as they can hold the contradiction in a single sentence without flinching. The moment they need to separate the "I believe" from the "The evidence says" into different conversations, the trenchcoat goes on. Your subjects are still one person. They are just living in the gap.
