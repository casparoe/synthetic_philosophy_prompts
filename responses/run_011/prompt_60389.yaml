prompt: |-
  Retired materials chemist here — 34 years in a ceramics and refractories lab, and I only got into philosophy a couple of years ago when my wife started playing lectures in the car. I've now read enough about the statue and the clay to think the whole thing is a bookkeeping mess, but I also can't stop finding it funny, so I want something written.

  Can you do me a parody Safety Data Sheet — the standard 16-section GHS/OSHA format, sections in the usual order, each with its number and heading — for the inventory item "PLASTICINE-TYPE BODY, WET, ~7 kg, ACCESSION #1994.117," held in the storeroom of a small sculpture studio whose safety officer is a die-hard two-objects man. He genuinely holds that the piece and the lump are two numerically distinct things occupying the same space at the same time, and he has written the sheet accordingly, treating the coincidence as a real occupational hazard and a records problem. Around 800 words.

  The jokes have to come from getting the metaphysics right, not from the word "metaphysics" ever showing up. I'd like the sheet to be quietly exact about: what each of the two things can survive (the lump apparently keeps going through being squashed and re-formed but cannot lose a gram of material, while the piece can shrug off a chipped finger but not a flattening); the rated occupancy of the plinth; which one gets entered in the accident book when a workman drops a shelving board on it, and whether one dropped board is one incident or two; what first aid could possibly mean when nothing biological is present; disposal — which of the two may be landfilled, which may not, and what the residue is afterwards; and a section 16 revision line noting that an earlier version treated the item as one object, now withdrawn after an audit.

  Ground rules: he never breaks character, so no "obviously it's really just one thing" asides and no winking at the reader; and don't name a single philosopher, book, or -ism anywhere in the document — someone who knows the literature should recognise it purely from the positions being handled correctly, while someone who's never heard of any of it should still enjoy it as workplace bureaucracy gone weird. Also, if there's any place where the two-objects view makes his own procedures inconsistent (say, weighing one but not the other), let that show through as an unreconciled line item rather than explaining it.

  Please start the reply with the document itself — no preface, no framing, and no note at the end telling me what you did or which choices you made.
