  **SAFETY DATA SHEET**

  **SECTION 1: Identification**
  **Product Identifier:** PLASTICINE-TYPE BODY, WET, ~7 kg, ACCESSION #1994.117
  **Synonyms:** The Constituent Mass; The Constituted Form; The Lump; The Piece.
  **Recommended Use:** Sculptural storage.
  **Supplier:** Studio Storeroom.
  **Emergency Telephone Number:** Internal Extension 404 (Safety Officer).

  **SECTION 2: Hazard(s) Identification**
  **Classification:** Spatial Overlap Hazard; Identity Coincidence Risk.
  **Label Elements:** Warning. Two distinct entities occupy the same volume.
  **Other Hazards:** Personnel may attempt to interact with only one entity, inadvertently damaging the other. Confusion regarding survival conditions may lead to improper handling.

  **SECTION 3: Composition/Information on Ingredients**
  **Substance/Mixture:** Complex Dual-Entity System.
  **Components:**
  1.  **Material Substrate:** Wet clay composite. Mass: 7 kg.
  2.  **Sculpted Form:** Aesthetic configuration. Mass: Not recorded.
  **Note:** Components are numerically distinct despite spatial coincidence. Do not assume identity based on shared location.

  **SECTION 4: First-Aid Measures**
  **Description of First-Aid Measures:**
  *   **If Substrate is damaged (e.g., drying, cracking):** Rehydrate immediately. Massage required.
  *   **If Form is damaged (e.g., chipped finger, flattened nose):** Reattach fragments using slip. Do not reshape unless preserving original configuration.
  **Most Important Symptoms:** Loss of definition (Form); Loss of mass (Substrate).
  **Protection of First-Respon ders:** Wear gloves to protect Substrate; exercise caution to protect Form.

  **SECTION 5: Fire-Fighting Measures**
  **Extinguishing Media:** Water spray.
  **Special Hazards:** Substrate may harden permanently under heat. Form will cease to exist if configuration is lost, even if Substrate survives firing.
  **Advice for Firefighters:** Rescue Form before Substrate reaches kiln temperatures.

  **SECTION 6: Accidental Release Measures**
  **Personal Precautions:** Verify status of both entities after impact.
  **Environmental Precautions:** Contain Substrate fragments.
  **Methods for Containment:** Sweep up clay. Archive Form debris.
  **Incident Reporting:** If a shelving board drops on the unit, log two incidents if both entities sustain damage. Log one incident if only the Substrate survives flattening. Do not combine entries in the accident book.

  **SECTION 7: Handling and Storage**
  **Precautions for Safe Handling:** Avoid flattening. Substrate survives deformation; Form does not.
  **Conditions for Safe Storage:** Store on plinth rated for occupancy of two (2) objects. Do not exceed plinth capacity by separating entities.
  **Incompatible Materials:** Hammers ( hostile to Form); Solvents (hostile to Substrate).

  **SECTION 8: Exposure Controls/Personal Protection**
  **Control Parameters:** None established.
  **Exposure Controls:** Maintain humidity for Substrate. Maintain lighting for Form visibility.
  **Personal Protection:** Nitrile gloves recommended for Substrate handling. Eye protection recommended when viewing Form to prevent visual distortion.

  **SECTION 9: Physical and Chemical Properties**
  **Appearance:** Humanoid shape (Form); Grey sludge (Substrate).
  **Odor:** Earthy.
  **pH:** Neutral.
  **Mass:** 7 kg (Substrate only). Form mass is undefined.
  **Density:** Calculated using Substrate volume.
  **Solubility:** Substrate soluble in water; Form insoluble but fragile.

  **SECTION 10: Stability and Reactivity**
  **Reactivity:** Stable under minor rearrangement of particles (Substrate). Unstable under loss of gross morphology (Form).
  **Chemical Stability:** Substrate stable indefinitely if wet. Form stable only while recognized as art.
  **Possibility of Hazardous Reactions:** Squashing creates a hazard for Form while leaving Substrate intact.
  **Conditions to Avoid:** Compression, flattening, melting.

  **SECTION 11: Toxicological Information**
  **Information on Toxicological Effects:** Non-toxic. No biological systems present.
  **Symptoms:** None.
  **Delayed and Immediate Effects:** None.

  **SECTION 12: Ecological Information**
  **Ecotoxicity:** Substrate is inert. Form has no ecological footprint.
  **Persistence and Degradability:** Substrate persists in landfill. Form degrades upon loss of institutional memory.
  **Bioaccumulative Potential:** None.

  **SECTION 13: Disposal Considerations**
  **Waste Residue Methods:**
  *   **Substrate:** May be landfilled or recycled into new mass.
  *   **Form:** May not be landfilled. Must be deaccessioned via records removal.
  **Contaminated Packaging:** Dispose of according to Substrate weight.
  **Residue After Disposal:** If Substrate is landfilled and Form deaccessioned, no residue remains. If Substrate is recycled but Form is destroyed, a lump of clay remains without identity.

  **SECTION 14: Transport Information**
  **UN Number:** Not regulated (Substrate); Regulated as Art (Form).
  **Transport Hazard Class:** Class 9 (Miscellaneous).
  **Packaging Group:** II.
  **Special Precautions:** Weight limits apply to Substrate only. Do not declare Form weight on manifest to avoid customs confusion regarding non-material goods.

  **SECTION 15: Regulatory Information**
  **Safety, Health and Environmental Regulations:** Compliance required for both entities separately.
  **Status:** Substrate meets material safety standards. Form meets aesthetic inventory standards.
  **Notes:** Failure to distinguish entities during audit constitutes a record-keeping violation.

  **SECTION 16: Other Information**
  **Date of Preparation:** 2023-10-27
  **Revision Date:** 2023-10-27
  **Revision Number:** 2.0
  **Changes:** Previous Version 1.0 treated Item #1994.117 as a single object. This version is withdrawn following audit finding that identity conditions for the Form and Substrate differ. Mass recorded in Section 9 applies to Substrate only; discrepancy in total inventory weight is acknowledged and under review.
