answer: |-
  ### The Stance: Testimony Over Presence

  First-hand acquaintance is a prejudice inherited from static media. For new media, seeing a work once is not "experiencing the object"; it is sampling a single output of a system. A four-minute viewing of a generative piece is aesthetically meaningless without knowledge of the system's range. Conversely, a conservator's report on the code's integrity is a *more* direct encounter with the work's essence than watching one render.

  Therefore, this procedure treats **verified testimony regarding system integrity** as superior to **direct sensory experience of a single instance**. We are not buying an image; we are buying a behavior. If the behavior is attested to by reliable witnesses (conservators, artists, consistent documentation), the committee has "seen" the work. If the behavior is unstable or the witnesses disagree, looking at a screen for an hour adds no knowledge.

  ### The Decision Procedure (60 Minutes)

  **Constraint:** If any question in Phase 1 (Facts) yields a "No" or "Unknown," the acquisition stops. Do not proceed to Phase 2. Phase 2 is for values only.

  #### Phase 1: Verification (45 Minutes)

  **Q1: Is the "Artifact" defined as the behavior or the output? (15 Mins)**
  *   **The Question:** Are we buying a specific fixed file (e.g., a video render, a print) or a system capable of generating instances (e.g., code, software, instructions)?
  *   **Sufficient Answer:** A written designation from the seller/artist specifying exactly what files, hardware, or certificates constitute the acquisition.
  *   **Stop Condition:** If the seller cannot specify what is being transferred (e.g., "you buy the experience"), **Don't Buy**.
  *   **Hand-off:** If the answer is "System," proceed to Q2. If "Fixed Output," skip to Q3.

  **Q2: Is the system's behavior independently verified? (15 Mins)**
  *   **The Question:** For generative or software-based works: Do we have a technical report or certificate from a third party (conservator, gallery tech, institution) confirming the code executes the artist's intent, distinct from our own viewing?
  *   **Sufficient Answer:** A document stating the work has been migrated/tested and functions within defined parameters.
  *   **Stop Condition:** If the only verification is the committee's single viewing or the artist's verbal assurance, **Don't Buy**. (Your viewing is a sample size of one; the artist is an interested party).
  *   **Hand-off:** If a third-party report exists, proceed to Q3.

  **Q3: Is the testimonial record consistent? (15 Mins)**
  *   **The Question:** For durational, performed, or defunct net art: Do the available records (criticism, documentation, curator notes) agree on what the work *does*, even if they disagree on quality?
  *   **Sufficient Answer:** At least two independent sources describe the work's mechanism or duration consistently.
  *   **Stop Condition:** If trusted sources describe fundamentally different works (e.g., one says it was interactive, one says it was a loop), **Don't Buy**. You cannot acquire an undefined object.
  *   **Hand-off:** If the description is stable, proceed to Phase 2.

  #### Phase 2: Valuation (15 Minutes)

  **Q4: Does the risk profile match our mission? (15 Mins)**
  *   **The Question:** Given the verification above, is the cost of maintaining this behavior (conservation, emulation, storage) worth the aesthetic claim?
  *   **Sufficient Answer:** A majority vote.
  *   **Note:** This is the only question where "I like it" is a valid argument. All previous questions established *what* "it" is.

  ---

  ### Running the Cases

  #### Case 1: The Generative Work
  *   **Scenario:** You watched it run once (4 mins). No code reading skills. No external tech report mentioned.
  *   **Q1 (Artifact):** You are likely buying the system (code + display). **Pass.**
  *   **Q2 (Verification):** You have no third-party technical report. You only have your own 4-minute viewing. Under this procedure, your viewing is insufficient testimony for a generative system. **Fail.**
  *   **Result:** **Don't Buy.**
  *   **Reasoning:** You are buying a black box based on a single output. Without a conservator's word that the code is robust, you are acquiring a liability, not a work.

  #### Case 2: The 1997 Durational Piece
  *   **Scenario:** Recording + Notes. Two trusted critics describe it inconsistently.
  *   **Q1 (Artifact):** The recording is the surrogate artifact. **Pass.**
  *   **Q2 (Verification):** N/A (It is a fixed recording, not a live system). Skip to Q3.
  *   **Q3 (Testimonial Consistency):** Two trusted critics describe it in "mutually inconsistent terms." One says it was immersive, one says it was observational. The work's identity is unstable. **Fail.**
  *   **Result:** **Don't Buy.**
  *   **Reasoning:** You cannot acquire a work if the historical record cannot agree on what the work *was*. You would be acquiring a contradiction.

  #### Case 3: The Photographic Print
  *   **Scenario:** Physical print, viewable all afternoon.
  *   **Q1 (Artifact):** Fixed output. **Pass.**
  *   **Q2 (Verification):** N/A. Skip to Q3.
  *   **Q3 (Testimonial Consistency):** The object is present. Your perception is the testimony. It is consistent because it is static. **Pass.**
  *   **Q4 (Valuation):** Committee votes.
  *   **Result:** **Buy** (Assuming budget/mission aligns).
  *   **Reasoning:** The object is verifiable through direct perception, which is sufficient for static media.

  ---

  ### Analysis

  **Where the procedure lands the same:**
  It treats Case 1 (Generative) and Case 2 (Durational) identically: **Rejection.** Despite being radically different media, both fail the *Verification of Identity* test. In Case 1, the identity is unverified by experts; in Case 2, the identity is contradicted by experts. In both, the committee lacks the epistemic ground to say "We know what this is."

  **Where it splits them:**
  It splits Case 3 (Photo) from the others. The photo is the only one that survives the Fact Phase. This is the intentional provocation of the procedure: it admits that for a collection with no technical staff and limited time, static media is the only *acquirable* asset. New media becomes "acquirable" only when accompanied by institutional-grade documentation (conservation reports, consistent archives), which the first two cases lacked.

  **The call you will hate:**
  You will hate rejecting **Case 2 (The 1997 Durational Piece)**.
  *   **Why:** It feels like historical preservation. Rejecting it because critics disagree feels like bureaucratic cowardice. You will argue that acquiring it *rescues* the work from ambiguity.
  *   **Why the procedure says No:** The procedure argues that acquiring an ambiguous work does not rescue it; it institutionalizes the confusion. If you can't define the behavior, you can't conserve it. You would be spending $45k on a question mark.

  **What the procedure structurally cannot settle:**
  It cannot measure **Cultural Urgency vs. Verification Cost.**
  The procedure assumes that if a work cannot be easily verified (Q2/Q3), it should be dropped. But sometimes the most important works are the most unstable or poorly documented. The procedure protects you from buying junk, but it structurally biases you against buying *pioneering* junk. It cannot tell you when to break the rules to save a piece of history that happens to be a mess. It optimizes for collection *stability*, not collection *significance*.
