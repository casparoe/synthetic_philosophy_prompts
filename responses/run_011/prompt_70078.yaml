answer: |-
  Here is a menu of five distinct readings of the slogan, broken down by claim, validity, required premises, and market dependencies. You can use these to diagnose which argument is actually being made in the room.

  **1. The Substitutability Claim (Marginal Impact)**
  *   **The Claim:** The total harm is fixed by demand; our specific volume is perfectly substitutable. Therefore, our withdrawal reduces harm by zero.
  *   **Verdict:** **Substantive but often false.** It treats market supply as perfectly elastic. It is only true if competitors have infinite capacity and identical pricing/terms to absorb 100% of your displaced volume immediately.
  *   **Extra Premise Needed:** "Competitors are capacity-constrained only by demand, not capital or risk appetite."
  *   **Market Facts Required:** Your market share size; price elasticity of demand for the product; competitor capacity utilization. If you are a price leader or have unique distribution, your exit *does* reduce total volume or raise costs, thereby reducing harm.

  **2. The Inevitability Claim (Moral Permissibility)**
  *   **The Claim:** Because the outcome (harmful lending) is inevitable regardless of our action, our agency in causing it is morally neutralized.
  *   **Verdict:** **False under deontology/compliance; Defensible under strict act utilitarianism.** Regulatory liability and reputational risk attach to *your* actions, not the industry's aggregate. You are liable for your books, not the market's.
  *   **Extra Premise Needed:** "We are evaluating this solely on net global outcome, ignoring institutional integrity, legal liability, or brand risk."
  *   **Market Facts Required:** None; this is a governance choice. However, it fails if regulators view "everyone else is doing it" as an aggravating factor (systemic risk) rather than a defense.

  **3. The Equilibrium Claim (Prisoner's Dilemma)**
  *   **The Claim:** We are in a race-to-the-bottom equilibrium where unilateral restraint is punished by market share loss without reducing systemic harm.
  *   **Verdict:** **Substantive and defensible.** This is a classic collective action problem. It acknowledges that individual rationality leads to collective ruin.
  *   **Extra Premise Needed:** "Competitors will not match our restraint; they will exploit our withdrawal to capture volume."
  *   **Market Facts Required:** Competitor response functions. Do they compete on risk appetite? If the market rewards safer lending (e.g., lower default rates leading to cheaper cost of capital), unilateral restraint might actually be a competitive advantage, breaking the dilemma.

  **4. The Steering Claim (Inside Influence)**
  *   **The Claim:** Participating allows us to mitigate harm (better underwriting, clearer terms) better than the "someone else" would. We do the harmful thing *safer*.
  *   **Verdict:** **Substantive but defensible only if verified.** This shifts the justification from "doing it" to "doing it better." It requires evidence that your risk controls are superior to the industry average.
  *   **Extra Premise Needed:** "Our version of this product causes less harm per unit than the competitor's version."
  *   **Market Facts Required:** Comparative underwriting data; customer outcome metrics (default rates, collection practices) vs. competitors. If your "safe" version is functionally identical to their "predatory" version, this claim collapses.

  **5. The Trap Claim (Structural Constraint)**
  *   **The Claim:** This is not a justification for action, but a diagnosis of systemic failure. The market structure forces unethical moves unless the rules change.
  *   **Verdict:** **Defensible and strategically vital.** This accepts the empirical premise ("someone else will") but rejects the normative conclusion ("so we may"). It identifies the problem as external to the firm's immediate choice architecture.
  *   **Extra Premise Needed:** "We acknowledge this activity is unsustainable or unethical long-term, and our goal is to change the conditions, not just survive them."
  *   **Market Facts Required:** Regulatory landscape; potential for industry-wide standards or lobbying. This moves the meeting from *Product Approval* to *Government Relations/Strategy*.

  **How to use this in the room:**
  When the slogan is deployed, ask: **"Which claim are we relying on?"**
  *   If **1 or 3**: Demand the market data on competitor capacity and elasticity.
  *   If **2**: Remind them compliance signs off on *our* books, not the industry's.
  *   If **4**: Demand the comparative risk data proving we are the "good" version.
  *   If **5**: Agree, and propose a workstream to engage regulators or industry bodies to change the equilibrium, while flagging the product as high-risk in the interim.
