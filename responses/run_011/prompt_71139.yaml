      *   *Prediction:* Loss for Expat.
      *   *Co-Instructor:* "Principled Pragmatism."
      *   *Hypothetical:* Citizen abroad, non-citizen resident, both pay taxes. Who votes nationally? (Tests Residence vs. Status).
      *   *Future:* The "Community of Fate" risk to non-citizens.

      *(Self-Correction on Hypothetical)*: The prompt asks for a hypothetical to separate the *two leading principles* identified earlier.
      Principle 1: **Habitual Residence / Daily Subjection** (Predicts Expat loses).
      Principle 2: **Enduring Legal Ties / Formal Membership** (Predicts Expat wins).
