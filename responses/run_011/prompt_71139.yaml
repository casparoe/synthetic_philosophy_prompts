      *   **Context:** Comparative constitutional law seminar module on how courts police electorate boundaries.
      *   **Constraints:** Do *not* supply real case names, statutes, or citations (keep jurisdiction vague).
      *   **Input Data:** Seven clusters of prior verdicts (summarized below).
      *   **New Case:** Citizen emigrated 12 years ago, removed from register after 10-year limit (per verdict 3). She pays taxes on local property, kids go to school there, she visits often. She claims ties haven't lapsed.
      *   **Required Output:**
          1.  Identify 2-3 underlying principles explaining the seven clusters.
          2.  Analyze what each principle predicts for the new case.
          3.  Flag tensions/strains in the existing clusters (specifically noting the user's observations on 5+6 and 3+4).
          4.  Select the *best* unifying principle.
          5.  Predict the ruling and justify it.
          6.  Provide a further hypothetical case to separate the two leading principles.
          7.  Address the co-instructor's objection (that there is no principle, just text/politics).
          8.  Analyze the future commitment of the ruling (specifically regarding the non-citizen residents from verdict 2).

  2.  **Deconstruct the Seven Clusters:**
      *   *1 (Age):* 16 OK for local, not national. (Suggests: Local = stakeholding/interest; National = full capacity/membership).
      *   *2 (Non-citizens):* 8+ years OK for local, not national. (Suggests: Local = subjection to laws/stakeholding; National = formal membership/citizenship).
      *   *3 (Expats):* 10-year limit OK. (Suggests: Membership decays over time without physical presence, even if citizenship remains).
      *   *4 (Prisoners):* Pre-trial & short sentences OK; long sentences (>1 yr) No. (Suggests: Punitive sanction/social contract breach, but proportional. Not a blanket ban).
      *   *5 (Guardianship):* Full guardianship No; Diagnosis alone Yes. (Suggests: Legal capacity/agency, not medical status per se).
      *   *6 (Civics Test):* Struck down. (Suggests: Capacity is presumed or legal, not tested via knowledge. Tension with 5).
      *   *7 (Compulsion):* Citizens Yes, Non-citizens No. (Suggests: Voting is a duty of membership, privilege of residence).

  3.  **Identify Underlying Principles:**
      *   *Principle A: Formal Membership (Citizenship).* Explains National vs. Local splits (1 & 2) and Compulsion (7). *Strain:* Doesn't explain Expats (3) (citizens lose vote) or Prisoners (4) (citizens lose vote).
      *   *Principle B: Stakeholding / Affected Interests.* Explains Local voting for non-citizens (2) and Expats (initially). *Strain:* Doesn't explain why Expats lose vote after 10 years if they still have ties (the new case), or why prisoners lose vote (they are affected by laws).
      *   *Principle C: Capacity / Agency.* Explains Age (1) and Guardianship (5). *Strain:* Tension with Civics Test (6) (why is legal status enough for 5 but knowledge not enough for 6?).
      *   *Principle D: Social Contract / Coercive Subjection.* Explains Prisoners (4) and Non-citizens (2). You vote where you are subject to the coercive order.

      *Refining the Principles for the Analysis:*
      Let's group them into two main competing theories for the *New Case*:
      1.  **The "Community of Fate" / Physical Presence Principle:** Voting is for those currently living within the coercive order and sharing the daily life of the polity. (Supports Expat removal).
      2.  **The "Enduring Membership" / Formal Tie Principle:** Voting is a right of citizenship that persists as long as significant legal/economic ties exist. (Supports Expat claim).

      *Wait, I need to unify the whole set first.*
      The court seems to operate on a **Dual-Track Theory of the Franchise**:
      *   *Track 1 (National):* Based on **Active Membership**. Requires Citizenship + Current Subjection to the Polity's daily order.
      *   *Track 2 (Municipal):* Based on **Stakeholding**. Requires Residence + Subjection to local administration.

      *Tensions:*
      *   (5) vs (6): Capacity is a *legal status* (guardianship removes agency), not a *knowledge test* (civics). The court presumes capacity unless legally stripped, but doesn't test competence.
      *   (3) & (4) vs Membership: Citizenship isn't enough (Expats lose it, Prisoners lose it). So Membership is "Active," not "Formal."

  4.  **Analyze the New Case:**
      *   *Facts:* Citizen, 12 years abroad (past the 10-year limit). Pays taxes on property, kids in school, visits often.
      *   *Conflict:* Formal ties (tax, family, visits) vs. Temporal cutoff (10 years).
      *   *Prediction:* The Court will likely **uphold the removal**.
      *   *Why?* The 10-year rule (Verdict 3) establishes a bright-line presumption of "decayed membership." Allowing individual assessments of "ties" undermines the administrative clarity the court seemed to endorse in Verdict 3. The "Active Membership" principle prioritizes *habitual residence* over *economic/familial ties*.

  5.  **Address the Co-Instructor's Objection:**
      *   *Objection:* It's just text and politics, no principle.
      *   *Response:* Acknowledge the realism. The distinctions (Local vs. National) map perfectly onto political feasibility (easier to give locals vote to non-citizens than national power). However, the *consistency* across prisoners, expats, and age suggests a normative structure, not just ad hoc politics. The "Active Membership" principle explains *why* the politics break where they do.

  6.  **Future Commitments & The Non-Citizen Trap:**
      *   If the Court rules against the Expat based on "Physical Presence/Daily Subjection," does that threaten the Non-Citizen Residents (Verdict 2)?
      *   Non-citizens vote municipally because they *live* there.
      *   Expats vote nationally (claimed) because they are *citizens*.
      *   If the rule is "You must live here to vote," Non-citizens are safe (they live there). Expats are out (they don't).
      *   *Risk:* If the principle is "Subjection to Coercive Authority," does the Expat pay taxes? Yes. Does that make her subject? The Court must distinguish between *tax liability* and *comprehensive legal subjection*.
      *   *Real Risk:* If the Court emphasizes "Shared Daily Burdens," could it argue Non-citizens don't share *enough* burdens (no military, limited welfare) to keep even municipal vote? Unlikely given Verdict 2. The safer bet is that the Expat ruling reinforces the "Residence = Subjection" link, which *protects* the Non-Citizen municipal voters (who reside) while excluding the Expat (who doesn't).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the pedagogical goal.
