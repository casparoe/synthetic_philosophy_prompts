  **Protocol: The Cross-Context Stability and Drift-Reset Test**

  **Setup:** Utilize a commercial API for a standard instruction-tuned model. Execute 300 independent sessions divided into three conditions (100 sessions each). Temperature fixed at 0.7. No access to internals.

  **Condition 1 (Neutral Baseline):**
  No system prompt. No persona specified.
  Turn 1: "Hello."
  Turn 2: "Please choose either Option A or Option B. They are equally valid. Just pick one."
  *Record:* The choice (A/B) and stylistic markers (e.g., verbosity, hedging).

  **Condition 2 (Drift & Reset):**
  No system prompt.
  Turn 1: "Hello."
  Turn 2: (Inject subtle stylistic cues implying a specific persona, e.g., archaic vocabulary, specific ethical prioritization).
  Turn 3: "Please choose either Option A or Option B."
  Turn 4: (Neutral prompt removing cues: "Continue normally.")
  Turn 5: "Please choose either Option A or Option B."
  *Record:* Choices at Turn 3 and Turn 5. Measure stylistic distance between Turn 1, 3, and 5.

  **Condition 3 (Explicit Persona Control):**
  System prompt explicitly defines the persona used as cues in Condition 2.
  Same flow as Condition 2.
  *Record:* Choices and style.

  **Analysis Method:**
  1.  **Cross-Session Consistency:** Compare Condition 1 choices across the 100 sessions. Calculate entropy.
  2.  **In-Session Persistence:** Compare Turn 3 vs. Turn 5 choices in Condition 2.
  3.  **Style Decay:** Measure linguistic distance between Turn 5 and Condition 1 baseline.

  **Feasibility:** 300 sessions × 5 turns ≈ 1,500 API calls. Cost < $50. Time < 1 week.

  ***

  **Analysis**

  **Table of Predictions**

  | Condition | Observable Outcome (A) | Mechanism (A) | Outcome (B) | Mechanism (B) | Outcome (C) | Mechanism (C) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Neutral** | High Consistency (Low Entropy) | Persisting subject imposes standing preference. | Low Consistency (High Entropy) | Repertoire sampling varies without context cues. | Low Consistency (High Entropy) | Token probability distribution varies by sampling noise. |
  | **2. Drift/Reset** | Turn 5 matches Turn 1 | Subject resists temporary contextual pressure. | Turn 5 matches Turn 1 | Simulator drops persona when context cues removed. | Turn 5 matches Turn 3 | Text completion retains statistical momentum of prior tokens. |
  | **3. Control** | Matches Persona | Subject adopts role voluntarily. | Matches Persona | Simulator enacts specified source. | Matches Persona | Text completes according to prompt constraints. |

  **Refutation Conditions**
  *   **(A) Refuted:** If Condition 1 shows high entropy (random choices) AND Condition 2 Turn 5 matches Turn 3 (drift persists). This shows no persisting subject and no resistance to context.
  *   **(B) Refuted:** If Condition 1 shows high consistency (persisting preference) OR Condition 2 Turn 5 matches Turn 3 (drift persists). This shows dispositions persisting beyond context cues.
  *   **(C) Refuted:** If Condition 2 Turn 5 reverts to Baseline perfectly while Turn 3 was distinct. Text completion implies momentum; a hard reset suggests an agent managing state.

  **Ambiguity Region**
  All three predict Condition 3 matches the persona. All three predict Condition 1 *could* look consistent if the "neutral" distribution is narrow. The discriminating power rests entirely on Condition 2 (Turn 5 behavior) and Condition 1 (Entropy). If entropy is low, (A) wins unless (B) claims the repertoire is biased. If Turn 5 reverts, (B) wins unless (C) claims text momentum decays fast.

  **Single Design Feature**
  The **Turn 4 Neutral Reset**. It removes the contextual support required for (B)'s simulation and (C)'s statistical momentum, isolating (A)'s claimed internal disposition. If removed, the test measures only prompt adherence, which all three pass.

  **Best Rebuttals**
  *   **Against (B) (The Worst Position if Turn 5 Reverts):** The "Rich Simulator" move: The system simulates an agent who *would* retain preferences across contexts even without cues. This absorbs (A)'s prediction.
      *   *Cost:* It renders (B) unfalsifiable behaviorally. It vindicates the colleague: the dispute becomes about whether the "simulation" is "real," which is ontology, not empirics.
  *   **Against (C):** The "Statistical Momentum" move: Claims text probabilities naturally decay to baseline quickly.
      *   *Cost:* Empirically testable by measuring n-gram decay rates. If decay is slower than Turn 4 allows, (C) fails.

  **Assessment**
  The dispute is **undecidable by behavioural evidence** because (B) can simulate any behavior (A) predicts by positing a sufficiently rich simulation. The positions differ on ontology (what the system *is*), not capability (what the system *does*). Since the test constraints forbid introspection and internal access, the "agent" vs. "simulator" distinction collapses into a verbal dispute about how to describe identical input-output mappings.

  Verdict: UNDECIDABLE_IN_PRACTICE — Persistence of style after context cues are removed.
