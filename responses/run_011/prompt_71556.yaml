answer: |-
  I'm rejecting the claim that **cross-history ranking needs a settled population axiology to yield a defined practical comparison.** You're conflating metaphysical settledness with decision-theoretic definability. I'll concede the non-identity point instantly: yes, hard choices shift conception timing, and yes, the far-future populations differ across options. But acting under axiological uncertainty isn't different from acting under empirical uncertainty. We don't need *the* true population axiology to calculate expected value; we need a credence distribution over plausible candidates. As long as your credence isn't concentrated on axiologies that treat existence as neutral or negative, the far-future term isn't undefined—it's a high-variance expectation value.

  Here's the positive account: the far-future term acts as a noisy signal that almost always correlates with the local term in direction, even if not in magnitude. Whether you're a totalist or a person-affecting view, preventing a child's death today usually opens up future histories that are better than the counterfactual where they die, regardless of which specific individuals populate the 22nd century. The "undefined" nature you're worried about only arises in pathological trade-offs where you're explicitly trading present lives for future population size. In standard moral practice—vaccination, policy, war—the local welfare gains are so robustly positive across all plausible axiologies that the far-future noise doesn't flip the sign. I'd bet 85% of my bankroll that this distinction between "undefined" and "uncertain but sign-stable" survives your next round.
