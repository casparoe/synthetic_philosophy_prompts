          *   *Concept:* Hindsight bias (knew-it-all-along effect).
          *   *Analysis:* Brother is invoking a standard psychological critique of historical determinism.
          *   *Verdict:* Brother has a strong initial point. Historians often overstate certainty.

      *   **Step 2:** Roommate says "Category Error." Hindsight bias is about probability estimates, not narrative explanation.
          *   *Concept:* Distinction between *predictive* probability and *explanatory* coherence.
          *   *Analysis:* Roommate is making a philosophical distinction. Hindsight bias usually refers to people claiming they *predicted* the outcome. Historians aren't predicting; they're explaining causes.
          *   *Verdict:* Roommate makes a valid technical distinction, but might be splitting hairs. Narrative explanation *implies* probability to listeners.

      *   **Step 3:** Brother pivots to "Narrative Fallacy." Story structure makes the ending look inevitable regardless of truth. "Inevitable" = zero information.
          *   *Concept:* Narrative Fallacy (Taleb). The human tendency to turn complex facts into stories with cause-and-effect links that feel tighter than they are.
          *   *Analysis:* This is a stronger critique than hindsight bias. It attacks the *structure* of historical writing, not just the psychology of the reader. If every story looks inevitable, the word loses meaning.
