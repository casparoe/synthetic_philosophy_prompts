answer: |-
  This is actually a surprisingly sophisticated debate. Your roommate and his brother aren't just arguing about World War I; they're arguing about the **philosophy of history**. Specifically, they're wrestling with whether we can know *causes* when we only have access to one *outcome*.

  Here is the breakdown of who is right at each step, followed by the specific answers to your questions about steps 4 and 5.

  ### The Play-by-Play

  **1. Brother: "Inevitable" is Hindsight Bias.**
  *   **Verdict:** **Brother is right.**
  *   **Why:** Hindsight bias is a well-documented psychological phenomenon where people perceive past events as having been more predictable than they actually were. When a podcaster says a war was "inevitable" after it has already happened, they are smoothing over the genuine uncertainty that existed in 1914.

  **2. Roommate: That's a Category Error.**
  *   **Verdict:** **Roommate is technically right, but practically wrong.**
  *   **Why:** He is making a distinction between *prediction* (estimating probability before the fact) and *explanation* (weaving a story after the fact). Hindsight bias is technically about probability estimates. However, when a historian tells a story that leads to a specific end, the audience *infers* probability. So, while the roommate is correct about the definition, he's ignoring how the information is received.

  **3. Brother: Fine, it's the Narrative Fallacy.**
  *   **Verdict:** **Brother is right.**
  *   **Why:** This is the brother's strongest point. The "Narrative Fallacy" (popularized by Nassim Taleb) is the idea that humans turn complex, random facts into stories with cause-and-effect arrows that feel tighter than reality. If every history book is written after the ending is known, every history book risks making the ending look inevitable. If "inevitable" applies to everything we write, it means nothing.

  **4. Roommate: The Cure is Impossible.**
  *   **Verdict:** **Roommate is pragmatically right.**
  *   **Why:** He is arguing that we cannot step outside of time. No historian can go back to 1913 and place bets. Therefore, demanding a "pre-outcome probability" is a demand history cannot meet. He is arguing that since *all* history suffers from this bias, we can't use the bias to dismiss specific claims.

  **5. Brother: Use Counterfactuals. / Roommate: Those are Biased Too.**
  *   **Verdict:** **Draw.**
  *   **Why:** The brother offers the standard methodological fix (ask "what if?"). The roommate correctly points out that choosing *which* "what ifs" to test is still influenced by knowing what actually happened. (e.g., We ask "What if the Archduke's car didn't stall?" because we know it did stall. We don't ask "What if the weather was sunny?" because it doesn't fit the story we already know.)

  ***

  ### Does Point 4 Defeat Point 3?

  **No. Point 4 does not defeat Point 3; it surrenders to it.**

  Point 3 makes an epistemological claim: *"The word 'inevitable' carries zero information because the story structure forces that conclusion."*
  Point 4 makes a pragmatic claim: *"We can't calculate probability any other way, so we have to keep using the word."*

  Your roommate isn't proving that "inevitable" has meaning; he is arguing that we are stuck with it. He changes the subject from **"Is this true?"** to **"Can we do anything else?"**

  If you accept Point 3, you must admit that historical narratives are structurally biased toward determinism. Your roommate's counter is essentially, "Yes, but it's the only tool we have, so stop asking for a perfect one." That doesn't make the brother's critique wrong; it just makes it useless for stopping the conversation.

  ### Is There Anything Real Left in "Inevitable" After Point 5?

  **Yes, but the definition has to change.**

  If you grant the brother's Point 5 (that counterfactuals are the only test) and the roommate's rebuttal (that counterfactuals are selected based on known outcomes), the word "inevitable" can no longer mean **"physically determined"** or **"100% certain."**

  However, it can still mean **"highly constrained."**

  Here is the distinction that saves the word:
  *   **Weak Inevitability (What the brother attacks):** "Given the past, only this future was possible." (This is false. Other futures were possible.)
  *   **Strong Inevitability (What survives):** "Given the past, *most* plausible alternative paths lead to a similar outcome."

  Even if we select counterfactuals based on knowing the outcome, we can still test the **robustness** of the event.
  *   *Example:* If the Archduke's car hadn't stalled, would WWI still have happened? Maybe.
  *   *Example:* If the Archduke wasn't assassinated at all, would WWI still have happened? Many historians argue yes, because the alliance structures and military mobilization timetables created a "funnel."

  So, after Step 5, "inevitable" shouldn't mean "it had to happen this way." It should mean **"the structural pressures were so high that it would have taken a massive, unlikely deviation to stop it."**

  ### The Scorecard

  *   **The Brother** won the philosophy. He correctly identified that historical certainty is an illusion created by storytelling and hindsight.
  *   **The Roommate** won the practice. He correctly identified that historians cannot function if they aren't allowed to construct causal narratives, even if those narratives are imperfect.

  **Who was "more" right?**
  The brother. In a debate about truth, pointing out a fundamental flaw in the methodology (Point 3) outweighs saying "we can't help it" (Point 4). Your roommate admitted the bias exists but argued we should ignore it because it's unavoidable. That's a practical defense, not a logical one.

  If you want to break the tie next time, tell them this: **"Inevitable" is not a fact about the past; it's a claim about how hard it would have been to change the past.** If the host can't explain *what* would have been required to stop the war, he isn't allowed to use the word.
