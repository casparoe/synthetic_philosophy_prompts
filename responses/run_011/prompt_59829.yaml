prompt: |-
  My roommate and his brother got into it over a history podcast and I ended up pretending to be neutral, which I'm not great at. Roughly how it went:

  1. The host said the July Crisis made a general war "inevitable," and the brother said that's textbook hindsight bias — he knows how it turned out, so the ending feels necessary in retrospect.
  2. My roommate said that's a lab finding about probability estimates, not about explanations: a historian choosing which antecedents to weave into a story isn't estimating anything, so calling it a bias is a catgory error.
  3. The brother said fine, then the host is just doing the narrative fallacy — a story makes its ending look inevitable no matter what actually happened, so "inevitable" carries zero information.
  4. My roommate said the cure is impossible anyway: you can only check whether something was really likely by weighing it before you know the outcome, and no historian gets to do that. And a host who insists it was all a fluke knows the outcome too, so the brother's standard can't rank the two accounts against each other at all.
  5. The brother said the fix is counterfactuals — state explicitly what would have had to be different — and my roommate said that statement is also written by someone who already knows which counterfactual came out false.

  Can you go through and say who's right at each step? In particular I want to know whether 4 actually defeats 3 or just changes the subject, and whether there's anything real left in "inevitable" once you grant everything in 5. American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A debate between a roommate (R) and his brother (B) about a history podcast regarding the July Crisis (WWI origins) and the concept of "inevitability."
      *   **Task:** Evaluate who is "right" at each of the 5 steps of the argument.
      *   **Specific Focus:**
          *   Does point 4 defeat point 3 or change the subject?
          *   Is there anything meaningful left in the word "inevitable" after accepting point 5?
      *   **Tone/Style:** American English, analytical but accessible (since the user was pretending to be neutral and wants clarity).

  2.  **Deconstruct the Argument Steps:**

