prompt: |-
  I'm the only program officer at a small private foundation — about $6M a year, three board members, one of whom made his money in venture capital and will not shut up about option value. Anything over $250k goes to the full board; under that I can approve it myself with one analyst signing alongside me.

  Roughly a third of what lands in my inbox now justifies itself by pointing at an enormous but wildly uncertain payoff: AI governance research that might avert a catastrophe, a speculative stratospheric-aerosol field test, a "seed life on other worlds eventually" proposal, a standing prize for a hard verification problem. Our application form asks for expected impact, and these people cheerfully hand me a probability with four significant figures attached to a chain of assumptions nobody could check. Meanwhile the dull, well-evidenced stuff we also fund — lead abatement in old housing stock, vocational training — never gets mentioned in the same breath, and I can't tell whether that's because it's genuinely smaller or because my team and I are bad at comparing them.

  What I need is a written decision procedure that my two part-time analysts and I can actually run on a proposal in about 45 minutes, with no more decision theory than an undergraduate econ course, that tells us when a huge-but-improbable payoff is allowed to dominate the decision and when it isn't. Not an essay about the debate — a sequence of steps, the questions in order, what counts as an adequate answer to each, the point at which the procedure just says no, and the points where it stops and hands the thing up to the board because the remaining question is about values rather than facts. If a step is there because of a known argument in the literature, say so in a clause, but don't hand me a reading list.

  Things it has to deal with honestly, because we keep tripping over them:

  - The probabilities are made up. What does the procedure do with a claimed 1-in-10,000 that comes out of the applicant's own speculative model rather than anything resembling a frequency or a track record? Is "divide it by ten" a legitimate move or a fudge dressed as rigor, and if not that, what?
  - Selection. I see maybe eight of these a year, and the ones that reach me have already survived the applicants deciding a tail claim was worth pitching. Should the procedure treat the pool as biased upward, and how, without just becoming a blanket discount?
  - Cheap information. Sometimes a small study would collapse most of the uncertainty. Should the procedure be able to output "fund the $40k thing that resolves the disagreement instead of the $2M thing that bets on it," and what stops that step from swallowing every proposal forever?
  - Two-sided bets. The aerosol test has a huge claimed upside and a plausibly catastrophic downside. Do the two get to cancel each other in the arithmetic? Sometimes the math comes out positive and nobody on the board would sign it, and I want to know whether the procedure should record that gap or paper over it.
  - Repetition. I make these decisions a few times a year for maybe the next thirty. Does the fact that it isn't a one-shot decision change what any single proposal is worth, and if it does, how do I write that into a step rather than a vibe?
  - Our own scale. We are $6M. Does the procedure have anything to say about whether a marginal contribution that small can inherit the full value of the outcome it helps produce, or whether that's a question I should stop pretending to settle?
  - The refusal problem, which is the one I care about most. A procedure that systematically discounts small probabilities will be badly wrong in exactly the case where the tail was real, and that case dwarfs everything else in the ledger. I don't want the procedure to be "ignore the tail," because that's the same mistake pointed the other way. Tell me what it does instead, and don't just split the difference.
  - And the case where nobody can give me a number at all, and the honest answer is that the step is unscoreable.

  Then run it end to end on three proposals: the aerosol field test; the lead abatement program competing for the same money in the same quarter; and one you invent that the procedure *passes* and that I will hate — I want to watch it misfire in the direction that doesn't flatter my priors, not only in the direction that does. Show the actual answers to each question, including where it terminates early and where it escalates.

  Finally, tell me what the procedure can't do: which steps are judgment calls wearing a lab coat, what it will get wrong systematically over a decade of use, what it costs us to be wrong in each direction, and what I could watch for in our own grant records that would tell me its breaking.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Sole Program Officer at a small private foundation ($6M/year).
      *   **Structure:** 3 Board Members (one VC obsessed with "option value"), 2 part-time analysts.
      *   **Authority:** PO + 1 Analyst can approve <$250k. Board approves >$250k.
      *   **Problem:** Influx of "longshot/high-impact" proposals (AI governance, geoengineering, existential risk) vs. "dull/sure-thing" proposals (lead abatement, vocational training).
      *   **Pain Point:** Applicants provide fake precision (4 sig figs on probabilities). PO needs a practical, 45-minute decision procedure to distinguish legitimate high-upside bets from nonsense, without ignoring tails entirely or getting suckered by bad math.
      *   **Constraints:** No heavy decision theory (undergrad econ level max). Needs to be a step-by-step checklist. Needs to handle specific edge cases (fake probabilities, selection bias, cheap info, downside risk, repetition, scale, refusal problem, unscoreable steps).
      *   **Deliverables:** The Procedure, 3 Worked Examples (Aerosol, Lead Abatement, a "Passed" proposal the PO will hate), Limitations/Monitoring.

  2.  **Deconstruct the "Longshot" Problem:**
      *   *Pascal's Mugging:* High impact $\times$ Tiny probability = Huge Expected Value (EV). If probability is made up, EV is garbage.
      *   *Selection Bias:* Applicants self-select for pitching high EV.
      *   *Model Risk:* The chain of assumptions is fragile.
      *   *Downside:* Some high-upside things have high-downside (e.g., geoengineering).
      *   *Scale:* Does a $200k grant actually move the needle on a global catastrophe?
      *   *Refusal Problem:* If you always discount tails, you miss the one time it matters.

  3.  **Drafting the Procedure (The "45-Minute Filter"):**
      *   *Goal:* Create a funnel. Start with hard constraints, move to qualitative checks, end with quantitative adjustment.
      *   *Step 1: The "Real World" Check (Downside & Legality).* If it kills people or breaks laws, stop. (Handles the aerosol downside).
      *   *Step 2: The Counterfactual & Scale Check.* Does $250k actually change the outcome? (Handles the "marginal contribution" issue).
      *   *Step 3: The Probability Sanity Check.* How was the number derived? (Handles the "made up probabilities"). Use a "Reference Class" approach rather than internal model numbers.
      *   *Step 4: The Selection Bias Discount.* Acknowledge that this is a pitched number. (Handles the "pool bias").
      *   *Step 5: The Information Value Check.* Can we learn cheaper? (Handles the "cheap information" issue).
      *   *Step 6: The Portfolio/Repetition Check.* Is this consistent with a repeatable strategy? (Handles the "repetition" issue).
      *   *Step 7: The Board Escalation.* If it passes but feels weird, kick it up. (Handles "values vs. facts").

      *Refining the Probability Step:* The user asked specifically about "divide by ten." Is that legitimate? It's a heuristic for *model uncertainty*. A better approach is "Anchor to Reference Class." If no reference class exists, cap the probability at a conservative maximum (e.g., 1%) regardless of the model.
      *Refining the Refusal Problem:* The procedure shouldn't just say "ignore tails." It should say "Ignore tails *unless* there is a credible mechanism and a reference class." It needs a "Break Glass" clause for genuine black swans, but define "genuine" strictly.

      *Let's structure it as a Scorecard with Kill Switches.*
      *   **Phase 1: Hard Constraints (5 mins)**
      *   **Phase 2: The Mechanism & Scale (15 mins)**
      *   **Phase 3: The Probability Adjustment (15 mins)**
      *   **Phase 4: Decision & Escalation (10 mins)**

  4.  **Addressing Specific User Constraints in the Procedure:**
      *   *Fake Probabilities:* Require a "Reference Class Anchor." If none, cap $P$ at 1% for calculation purposes.
      *   *Selection Bias:* Apply a "Pitch Discount" (e.g., 0.5x) to self-reported probabilities.
      *   *Cheap Info:* Explicit step: "Is there a <$50k step that resolves the key uncertainty?" If yes, fund that instead.
      *   *Two-sided bets:* Separate Upside EV and Downside EV. If Downside EV > Upside EV, auto-reject. If Downside is non-financial (existential), auto-reject regardless of math.
      *   *Repetition:* Frame the decision as "Would we fund 10 of these?" (Kelly Criterion lite).
      *   *Scale:* Require a "Leverage Factor." How much total capital is needed to secure the win? If our $250k is <1% of needed capital, discount impact proportionally.
      *   *Refusal Problem:* The "Plausibility Floor." If the mechanism is physically possible and the reference class isn't empty, keep the tail, but discount the *confidence*, not just the probability.
      *   *Unscoreable:* If a step can't be scored, it defaults to "Board Escalation."

  5.  **Developing the Worked Examples:**
      *   **Proposal A: Stratospheric Aerosol (The VC's Dream/Nightmare).**
          *   High upside, high downside.
          *   Scale issue: $200k doesn't solve climate change.
          *   Downside: Catastrophic risk.
          *   *Outcome:* Fail at Phase 1 (Downside) or Phase 3 (Probability/Scale). Let's make it fail on Downside/Risk to show the procedure protects the PO.
      *   **Proposal B: Lead Abatement (The Boring Safe Bet).**
          *   Low upside, low downside.
          *   Solid reference class.
          *   Scale: $200k does a specific number of houses.
          *   *Outcome:* Pass.
      *   **Proposal C: The "Passed" Proposal the PO will hate.**
          *   Needs to be something that *technically* passes the procedure but feels wrong.
          *   Idea: A "Policy Arbitrage" or "Legal Challenge" fund. High leverage, plausible mechanism, but morally ambiguous or politically risky.
          *   Better Idea: A "Meta-Fund" that grants to other grantmakers. It passes the scale/leverage test, has a reference class (fund of funds), but feels like passing the buck.
          *   *Alternative:* A specific AI alignment "audit" firm. It looks rigorous, has a reference class (audits), but the PO suspects it's bunk.
          *   *Selection:* Let's go with a **"Regulatory Capture Defense Fund."** It claims to prevent bad AI regulation. It has a plausible mechanism (lobbying/legal), a reference class (policy advocacy), and high leverage (laws affect billions). It passes the math but might conflict with the foundation's non-partisan stance or feel too political.
          *   *Wait, user wants to see the procedure misfire in a direction that doesn't flatter priors.* If the PO leans skeptical of longshots, the procedure should pass a longshot that *looks* rigorous but might fail.
          *   *Idea:* A **"Biological X-Risk Surveillance Network."** Claims to detect engineered pathogens early.
          *   *Why PO hates it:* Sounds like alarmism.
          *   *Why it passes:* Reference class exists (disease surveillance), downside is low (monitoring), leverage is high (early detection saves millions).
          *   *Why it misfires:* It might be useless theater. The procedure accepts the *plausibility* of the mechanism even if the *efficacy* is unproven.

  6.  **Refining the Limitations/Monitoring:**
      *   What are the judgment calls? (Reference class selection, Downside severity).
      *   Systematic errors? (Over-discounting true black swans, under-discounting sophisticated scams).
      *   Cost of errors? (Type I: Waste money on bunk. Type II: Miss the save).
      *   Monitoring: Track "Post-Grant Plausibility." Are the grantees actually delivering milestones?

  7.  **Review against Constraints:**
      *   45 minutes? Yes, if steps are tight.
      *   Undergrad econ? Yes (EV, Reference Classes, Marginal Utility).
      *   No reading list? Yes.
      *   Address all bullet points? (Probabilities, Selection, Cheap Info, Two-sided, Repetition, Scale, Refusal, Unscoreable).
      *   Worked examples? Yes.
      *   Limitations? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, direct, slightly cynical but constructive.
      *   Formatting: Clear headers, checkboxes, bold text for decisions.
      *   Ensure the "Refusal Problem" is handled carefully—not ignoring tails, but requiring *evidence of mechanism* rather than *evidence of probability*.

      *(Self-Correction during drafting)*: I need to make sure the "Divide by ten" question is answered explicitly. I will incorporate a "Model Uncertainty Discount" step.
      I need to make sure the "Scale" issue is addressed. A $200k grant can't claim credit for saving the world if the world needs $2B. I'll add a "Necessary & Sufficient" check.
      I need to ensure the "Board Escalation" is clear. If the math says Yes but the gut says No, that's a Board problem.

      *Let's finalize the "Passed" proposal.* The PO hates it. It should be a longshot that passes. A "Nuclear Securitization Bond." It uses financial engineering to secure loose nukes. High upside, plausible mechanism (finance), reference class (bond markets). PO hates it because it's financialization of security. Or maybe a "Prediction Market for Policy."
      *Decision:* Let's go with a **"Decentralized Verification Oracle."** It's crypto-adjacent (PO likely hates crypto), claims to solve verification for treaties (High Impact), has a mechanism (cryptoeconomics), reference class (smart contracts). It passes the procedure because the mechanism is internally consistent, even if the PO thinks it's tech solutionism.

      *Wait, simpler:* A **"Litigation Finance Fund for Climate Liability."**
      *   Upside: Forces corporations to pay trillions.
      *   Probability: Low (courts are unpredictable).
      *   Mechanism: Legal precedent exists.
      *   PO Hate: It's adversarial, risky, feels like gambling.
      *   Procedure Pass: Reference class (litigation), High Leverage, Downside capped (loss of grant).
      *   This works.

      *Actually, let's look at the "Refusal Problem" again.* The user says "A procedure that systematically discounts small probabilities will be badly wrong in exactly the case where the tail was real."
      My procedure needs to allow a tail to pass *if* the mechanism is robust, even if probability is low. The filter isn't on Probability, it's on *Plausibility of Mechanism*.
      Okay, I will build the procedure around "Mechanism Plausibility" rather than "Probability Precision."

      *Revised Plan for Procedure:*
      1.  **Downside Cap:** Can this kill us/the world? (Yes = No).
      2.  **Counterfactual Scale:** Does our money matter? (No = No).
      3.  **Mechanism Plausibility:** Is the chain of causality physically/socially possible? (No = No).
      4.  **Probability Anchor:** Is there a reference class? (No = Cap P at 1%).
      5.  **Information Value:** Can we learn cheaper? (Yes = Fund the learning).
      6.  **Portfolio Fit:** Can we do this 10 times? (No = Board).

      *Let's write it.*
answer: |-
  # The 45-Minute Tail-Risk Filter (TRF)

  **Purpose:** To distinguish between legitimate high-leverage bets and "Pascal's Muggings" without systematically ignoring low-probability, high-impact events.
  **Users:** Program Officer (PO) + One Analyst.
  **Time Limit:** 45 Minutes hard stop. If time expires before Step 5, default to **Board Escalation**.
  **Authority:** Pass/Fail for requests <$250k. "Board Escalation" for requests >$250k or unresolved value conflicts.

  ---

  ## Phase 1: Hard Constraints (10 Minutes)
  *Goal: Eliminate proposals with unacceptable downside or zero marginal utility.*

  **1.1 The Catastrophe Cap**
  *   **Question:** Does the proposal carry a non-zero probability of causing irreversible harm (physical, reputational, or systemic) that exceeds the foundation's risk tolerance?
  *   **Input:** Applicant's risk assessment + PO/Analyst independent scan.
  *   **Decision Rule:**
      *   If Downside Impact = "Existential/Foundational Ruin" $\rightarrow$ **REJECT**. (Do not net against upside. This is a lexicographic preference, not an EV calculation.)
      *   If Downside Impact = "Financial Loss of Grant" $\rightarrow$ **PROCEED**.
  *   *Literature Note:* This handles the "Two-sided bet" problem by treating existential downside as a veto, acknowledging that EV math breaks when the denominator (the foundation's existence) goes to zero.

  **1.2 The Marginal Contribution Check**
  *   **Question:** Is the requested amount ($X$) a necessary condition for the outcome, or does it represent at least 5% of the total capital required to achieve the stated goal?
  *   **Input:** Total project budget + Theory of Change.
  *   **Decision Rule:**
      *   If $X$ < 5% of total needed AND there is no evidence that $X$ unlocks the remaining 95% $\rightarrow$ **REJECT**. (We are buying a ticket, not influencing the odds.)
      *   If $X$ is catalytic OR $X$ funds a complete sub-component $\rightarrow$ **PROCEED**.
  *   *Literature Note:* Addresses the "Our own scale" problem. Prevents claiming credit for a public good we didn't actually purchase.

  ---

  ## Phase 2: Mechanism & Probability (20 Minutes)
  *Goal: Sanitize the applicant's numbers without discarding the tail.*

  **2.1 The Mechanism Plausibility Test**
  *   **Question:** Is the causal chain from "Grant Spent" to "Impact Realized" physically and socially possible, even if unlikely?
  *   **Input:** Logic model.
  *   **Decision Rule:**
      *   If any link relies on magic, violation of known physics, or assumptions contrary to established human behavior (e.g., "actors will cooperate against self-interest without incentive") $\rightarrow$ **REJECT**.
      *   If the chain is brittle but possible $\rightarrow$ **PROCEED**.
  *   *Refusal Problem Note:* This is where we save the tail. We do not reject based on *probability* here, only on *possibility*. If the physics works, the tail stays alive.

  **2.2 The Reference Class Anchor**
  *   **Question:** What is the historical base rate for similar interventions achieving similar outcomes?
  *   **Input:** External data, not applicant's model.
  *   **Decision Rule:**
      *   If a valid reference class exists (e.g., "past vaccine developments," "past policy changes") $\rightarrow$ Use that rate as the **Anchor Probability ($P_{anchor}$)**.
      *   If NO valid reference class exists (true novelty) $\rightarrow$ Set **$P_{anchor}$ = 1%**. (Do not use the applicant's number).
  *   *Literature Note:* Addresses "The probabilities are made up." Inside-view probabilities from applicants are discarded in favor of outside-view base rates. The 1% cap prevents infinite EV from zero-evidence claims.

  **2.3 The Selection Bias Discount**
  *   **Question:** Has this proposal been screened by external experts or peers prior to reaching us?
  *   **Input:** Grant history, partner endorsements.
  *   **Decision Rule:**
      *   If Cold Submission (no prior screening) $\rightarrow$ Apply **Discount Factor ($D$) = 0.5** to $P_{anchor}$.
      *   If Vetted (by trusted partner/peer) $\rightarrow$ **$D$ = 1.0**.
  *   *Literature Note:* Addresses "Selection." Applicants self-select for optimism. This discounts the probability to account for the "pitch effect."

  **2.4 The Adjusted Probability ($P_{adj}$)**
  *   **Calculation:** $P_{adj} = P_{anchor} \times D$
  *   **Constraint:** $P_{adj}$ cannot exceed 50% for speculative projects.

  ---

  ## Phase 3: Information & Portfolio (10 Minutes)
  *Goal: Ensure we aren't overpaying for uncertainty and that we can repeat the strategy.*

  **3.1 The Cheap Information Test**
  *   **Question:** Is there a sub-grant or study (<$50k, <6 months) that would significantly update $P_{adj}$ (either up or down)?
  *   **Input:** Project timeline + milestones.
  *   **Decision Rule:**
      *   If Yes, and the main grant is >$100k $\rightarrow$ **FUND THE STUDY ONLY**. (Create a milestone-based tranche).
      *   If No, or study cost is disproportionate $\rightarrow$ **PROCEED**.
  *   *Literature Note:* Addresses "Cheap information." Prevents locking capital into high-uncertainty bets when option value lies in learning.

  **3.2 The Repetition Check (Kelly Lite)**
  *   **Question:** If this strategy works, could we theoretically deploy 10% of our annual budget into similar deals over the next 5 years without running out of opportunities or saturating the market?
  *   **Input:** Market size analysis.
  *   **Decision Rule:**
      *   If No (This is a one-off lottery ticket) $\rightarrow$ **BOARD ESCALATION**.
      *   If Yes (This is a repeatable strategy) $\rightarrow$ **PROCEED**.
  *   *Literature Note:* Addresses "Repetition." A foundation is a repeated player, not a one-shot gambler. One-offs belong to the Board (who represent the endowment's long-term values).

  ---

  ## Phase 4: Decision & Escalation (5 Minutes)
  *Goal: Final authorization.*

  **4.1 The EV Floor**
  *   **Calculation:** $Expected Value = (Impact Value \times P_{adj}) - Cost$
  *   **Note:** Impact Value should be estimated in "lives saved," "tons CO2," or equivalent, then converted to a rough dollar equivalent for comparison *only* against the "dull" projects.
  *   **Decision Rule:**
      *   If $EV < 0$ $\rightarrow$ **REJECT**.
      *   If $EV > 0$ but relies on the 1% Cap (from 2.2) $\rightarrow$ **BOARD ESCALATION**. (This flags that the decision rests on a value judgment about funding "moonshots" vs. "sure things".)
      *   If $EV > 0$ and relies on Reference Class $\rightarrow$ **APPROVE** (if <$250k).

  **4.2 The Unscoreable Clause**
  *   **Condition:** If any step in Phase 1 or 2 cannot be answered due to lack of data.
  *   **Action:** **BOARD ESCALATION**. Do not guess. The Board absorbs the uncertainty cost.

  ---

  # Worked Examples

  ### Proposal 1: Stratospheric Aerosol Field Test
  *   **Request:** $200,000 for a small-scale release to measure particle dispersion.
  *   **Claim:** Prevents 100M climate deaths. Probability: 5% (per applicant model).

  **Run:**
  1.  **1.1 Catastrophe Cap:** **FAIL.** Downside includes geopolitical conflict, ozone depletion, or "termination shock" if stopped later. Even small-scale tests normalize the technology.
      *   *Decision:* **REJECT.** (Stops here. 5 minutes elapsed).
      *   *Note:* The math doesn't matter. The downside veto protects the PO from the VC board member's "option value" argument.

  ### Proposal 2: Lead Abatement in Old Housing Stock
  *   **Request:** $180,000 to remediate 40 units in [City].
  *   **Claim:** Reduces blood lead levels in 120 children. Prevents ~$5M in lifetime societal costs (health/crime/earnings). Probability: 95%.

  **Run:**
  1.  **1.1 Catastrophe Cap:** Pass. Downside is financial only.
  2.  **1.2 Marginal Contribution:** Pass. $180k fully funds 40 units.
  3.  **2.1 Mechanism:** Pass. Physics/chemistry of abatement is settled.
  4.  **2.2 Reference Class:** Strong. Historical data on abatement efficacy exists. $P_{anchor} = 90\%$.
  5.  **2.3 Selection Bias:** Cold submission. $D = 0.5$. $P_{adj} = 45\%$. (Conservative).
  6.  **2.4 Adjusted Prob:** 45%.
  7.  **3.1 Cheap Info:** No. We know it works.
  8.  **3.2 Repetition:** Pass. We can fund housing every year.
  9.  **4.1 EV Floor:** Positive.
      *   *Decision:* **APPROVE.** (45 minutes elapsed).

  ### Proposal 3: The "Passed" Proposal You Will Hate
  *   **Proposal:** **"Litigation Finance Fund for Climate Liability."**
  *   **Request:** $240,000 seed capital for a specialized legal fund.
  *   **Claim:** Fund lawsuits against major carbon emitters. If one case sets a precedent, it unlocks $100B+ in damages globally.
  *   **Probability:** Applicant claims 0.1%.
  *   **Why you hate it:** It turns the foundation into a political combatant. It feels like gambling. It benefits trial lawyers. It's adversarial, not constructive.

  **Run:**
  1.  **1.1 Catastrophe Cap:** Pass. Downside is loss of grant + reputational heat (manageable).
  2.  **1.2 Marginal Contribution:** Pass. $240k funds the first 2 cases (catalytic).
  3.  **2.1 Mechanism:** Pass. Legal precedent is a real mechanism (e.g., tobacco litigation). Physically possible.
  4.  **2.2 Reference Class:** Weak but exists. "Public interest litigation success rates." $P_{anchor}$ set to **1% Cap** (Novel strategy).
  5.  **2.3 Selection Bias:** Vetted by a law school partner. $D = 1.0$. $P_{adj} = 1\%$.
  6.  **3.1 Cheap Info:** **FLAG.** A $40k legal memo could assess the viability of the first case.
      *   *Adjustment:* Procedure outputs **"FUND THE $40k MEMO"** with an option for the remaining $200k.
  7.  **3.2 Repetition:** Pass. Could deploy $1M/year into litigation finance.
  8.  **4.1 EV Floor:**
      *   Impact: $100B societal benefit.
      *   $EV = ($100B \times 0.01) - $240k = Positive Infinity basically.
      *   *Constraint:* Relies on the 1% Cap.
      *   *Decision:* **BOARD ESCALATION.**
      *   *Why:* Even though the math passes, the "Relies on 1% Cap" rule kicks it to the Board. This protects *you*. If the Board says yes, they own the "gambling" reputation. If they say no, you have the EV math to show you didn't just ignore the tail.

  ---

  # Limitations & Monitoring

  ### What This Procedure Cannot Do
  1.  **Judgment Calls in Lab Coats:** Step 2.1 (Mechanism Plausibility) is subjective. If you think crypto is magic, you'll reject crypto proposals. If you think it's valid, you'll pass them. The procedure formalizes the *check*, not the *belief*.
  2.  **Systematic Error (Type I):** It will reject true "Black Swans" that have no reference class and no prior vetting. You will miss the one-in-a-million idea that looks like nonsense.
      *   *Cost:* Opportunity cost of the "next Google" or "next penicillin."
      *   *Mitigation:* Accept this. You are a $6M foundation, not a sovereign wealth fund. You cannot afford to chase every ghost.
  3.  **Systematic Error (Type II):** It will pass sophisticated "EV Washing." Scammers will learn to cite reference classes and cap their own probabilities at 1% to look humble.
      *   *Cost:* Wasted grants on projects that look rigorous but are hollow.
      *   *Mitigation:* Post-grant monitoring.

  ### How to Watch for Breaking Points
  Track these three metrics in your grant records annually:

  1.  **The "1% Club" Success Rate:** Isolate all grants approved using the 1% Cap (Step 2.2). After 3 years, what % achieved *any* measurable milestone?
      *   *Break Signal:* If 0% hit milestones, your Mechanism Plausibility test (2.1) is too loose. Tighten it.
  2.  **The Escalation Ratio:** What % of decisions go to Board Escalation?
      *   *Break Signal:* If >30% escalate, the procedure is too conservative. You are becoming a bureaucracy. If <5% escalate, you are taking too much personal risk.
  3.  **The Cheap Info Conversion:** Of the "Fund the Study" decisions (Step 3.1), how many convert to full funding?
      *   *Break Signal:* If 0% convert, you are using Step 3.1 to procrastinate decisions. If 100% convert, you aren't being skeptical enough in Phase 2.

  ### The Refusal Problem (Final Word)
  This procedure does not solve the Refusal Problem. It **allocates** it.
  *   If the tail is real but lacks a reference class, the procedure says "Board Escalation."
  *   This forces the Board (the VC and the others) to explicitly vote on whether they value the *possibility* of the tail over the *certainty* of the ledger.
  *   You are not ignoring the tail. You are refusing to be the sole arbiter of its value. That is the only defensible position for a single officer with a $6M budget.
