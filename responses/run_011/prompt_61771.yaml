  8.  (Final thought before generating): Make sure to emphasize that *degree* of manipulation matters. In RCV, tactical voting is often hard because you need to know how others vote. In Plurality, it's easier (lesser of two evils). GS says *some* manipulation is always possible, not that *all* systems are equally manipulable.

