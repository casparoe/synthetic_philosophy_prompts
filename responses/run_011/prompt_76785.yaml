answer: |-
  Welcome to the parade ground. Welcome to the families behind the rope. Welcome to our guests. We have defence attachés here. We have staff officers from a nation with an all-volunteer force. I know their view. I know they see this model as obsolete. I am a history teacher. I deal in dates. I deal in what was written and what was done.

  We begin with neutrality. There are two kinds. The first is a status conferred by others. The great powers agreed on Swiss neutrality at Vienna in 1815. They confirmed it at Paris. It was a gift from the strong. But gifts can be taken back. In 1889, powers threatened to rescind what they had granted. Historians argue still. Was neutrality given to us? Could it be cancelled? Or was it always our own decision?

  The second kind is a posture a country holds by itself. It does not depend on a signature in a capital far away. It depends on what stands between an invader and his objective. The company Switzerland keeps in its doctrine has thinned dramatically. We do not say this to vindicate ourselves. We do not say this to reproach them. Nations choose different tools. But we must understand our own.

  This brings us to the army. There are two kinds. The first is an army the state owns and hires. The second is a citizenry under arms. The constitution of 1848 forbade the Confederation to maintain a standing army. It permitted each canton only a few hundred men. It made service an obligation of every citizen. The article establishing the army provides it is organized primarily on a militia basis.

  Our guests have stated their objection. Colonel Weber spoke plainly. He says part-time soldiers are less trained. He says a conscript force is likelier to violate the laws of armed conflict because it is less drilled. He says fixed defences and riflemen are beside the point against precision munitions, drones and cyber effects. They are not wrong about the technology. They are wrong about the purpose.

  An army of hires protects a government. A militia protects a decision. What deters an invader is not a declaration. It is his estimate of whether there will be anyone left with the authority to accept a surrender. A professional army can be defeated. A government can be captured. A population under arms cannot be fully decapitated. The strategy is denial by duration. It is the impossibility of a capitulation that binds. It is an armed population that is not a target set. If roads are broken and tunnels sealed, the victory is hollow. The occupier holds ground he cannot use.

  We speak often of the wartime plan of withdrawal into the alpine fortifications. We must admit what that plan was. It was never a plan to protect most of the population. It was never a plan to protect the industrial plateau. It was a plan to make the cost of occupation higher than the value of the territory. It is not a comfortable emblem of national virtue. It is a calculation of pain.

  I turn now to the families standing behind the line. Some of you voted for the 2013 initiative to abolish compulsory service. Roughly three-quarters of the electorate rejected it. Some of you voted last autumn for the initiative that would have replaced it with a general civic obligation for both sexes. More than four in five rejected that too. I do not speak to you as losers. I do not speak to you as sentimental. I do not assume you have changed your minds.

  Your case is strong. The draft is a compelled transfer of months of a young person's life. It falls on men alone. The state's claim on those men is not self-evidently a claim of justice. You know the cost. You pay it in missed semesters. You watch your sons stand in the rain. We concede the weight. We ask for acknowledgment that the burden exists.

  I turn now to you, the recruits. You stand in formation. You are nineteen and twenty. You are mostly conscripts. There are women here who volunteered. You will take an oath. You will receive a rifle. Under our regulations, you keep this weapon at home. But the sealed box of ammunition has not been issued since 2007–08. The rifle in the wardrobe arrives without its ammunition.

  This is not an oversight. The state has deliberately left something out. The object is not the guarantee. The hardware is not the strategy. Only a decision by the person holding it can supply what is missing. A law cannot fire a weapon. A constitution cannot load a magazine. There is a gap in the doctrine. It sits inside the people standing in formation.

  Armed neutrality stops being a matter of law and equipment at this point. It becomes a matter of a decision that cannot be conscripted. It cannot be legislated. It cannot be made by anyone on your behalf. This is the only freedom that matters: that no one outside this country gets to decide what happens in it. But that condition relies on you.

  I am not here to solve this. I locate the problem. The officers see obsolete tools. They see drones and cyber effects. They see a gap in capability. I see a gap in will. The rifle is dry. The ammo is sealed. The order is not in your pocket. It is in your head. When the command is cut, when the government is gone, you remain. The strategy ends where the individual begins. We gave you the uniform. We gave you the rank. We did not give you the reason. That is not ours to give. It belongs to you.
