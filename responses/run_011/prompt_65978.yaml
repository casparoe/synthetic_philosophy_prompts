answer: |-
  ### The readings

  1.  **The Post-Hoc Invention Charge:** You noticed the trait first, then invented a selective scenario to fit it.
      *   **Verdict:** Genuine. It signals a lack of predictive power.
      *   **Answer:** Show the hypothesis was generated independently of the specific trait distribution, or that it predicts the trait in related lineages.
  2.  **The Unfalsifiability Charge:** No conceivable evidence could refute the scenario.
      *   **Verdict:** Genuine. This is the core logical failure.
      *   **Answer:** Explicitly state what empirical finding (e.g., fossil absence, genetic variance data) would force you to abandon the hypothesis.
  3.  **The Ignored Alternatives Charge:** You failed to test against null hypotheses (drift, constraint, phylogenetic inertia).
      *   **Verdict:** Genuine. This is the primary methodological complaint of Gould & Lewontin.
      *   **Answer:** Demonstrate quantitatively that selection explains the variance better than drift or developmental constraint models.
  4.  **The Utility-Origin Conflation:** You assumed current usefulness proves historical selection for that function.
      *   **Verdict:** Genuine. Confuses adaptation with exaptation.
      *   **Answer:** Provide historical evidence (fossils/phylogeny) showing the trait arose *before* the proposed selective pressure existed.
  5.  **The Optimality Charge:** You assumed natural selection always finds the best possible design.
      *   **Verdict:** Cheat (mostly). Rarely do serious biologists assume perfect optimality; this is often a straw man.
      *   **Answer:** Clarify you are arguing for "local optimality" or "adequacy" given trade-offs, not perfection.

  ### The chin case

  Both accounts risk the "just-so" label, but the burdens of proof differ asymmetrically. Your classmate (adaptationist) bears the burden of demonstrating specific selective pressure for chin morphology distinct from general jaw reduction. If they cannot show that chins vary heritably and correlate with fitness independent of jaw size, their story is a just-so story under Charge 3 (Ignored Alternatives). They must rule out the null that the chin is merely developmental noise accompanying alveolar prognathism reduction.

  Your account (structural byproduct) is not immune. A spandrel claim becomes a just-so story if it asserts developmental necessity without evidence. If you cannot show that jaw shrinking *mechanically necessitates* a bony chin (perhaps via finite element analysis or comparative ontogeny), you are merely telling a different narrative. However, the asymmetry lies in Charge 4 (Utility-Origin). Your classmate must prove the chin was *selected for*; you only need to show it was *inevitable given other selections*.

  In your seminar, the phrase likely functioned rhetorically ("I don't like your hypothesis"), but technically, both were vulnerable if neither presented comparative data. The adaptationist claim is generally harder to sustain because it requires positive evidence of selection, whereas the byproduct claim leverages the known trend of hominin jaw reduction. If the chin correlates perfectly with jaw shrinkage across hominins without functional variance, the byproduct account wins by parsimony. If chins vary independently of jaw size, the adaptationist account gains traction. Without that data, both are speculative.

  ### Is my tutor right?

  Your tutor is offering a clean Popperian definition, but it is too tidy. Falsifiability is a necessary condition for a scientific hypothesis, but it is not sufficient to distinguish a rigorous adaptationist program from a just-so story. One can articulate falsification conditions for a wild speculation (e.g., "If we find a fossil without a chin, I'm wrong") while still ignoring available evidence that makes the speculation implausible.

  The Gould-Lewontin critique was not merely about logical structure; it was about *methodological pluralism*. A story is a just-so story if it treats adaptation as the *default* explanation without weighing it against known alternatives like drift or constraint. A hypothesis can be falsifiable in principle but still be a just-so story in practice if the author refuses to engage with the comparative data required to test it.

  Furthermore, the tutor's view ignores the sociological function of the term. In practice, "just-so story" flags a lack of *evidential weight*, not just logical openness. If you propose a selection pressure that didn't exist when the trait evolved, your hypothesis is falsified, not just "unfalsifiable." The tutor reduces a complex methodological warning about evidence weighting to a simple logical criterion. It captures the spirit of scientific rigor but misses the specific historical and biological context that gives the phrase its bite in philosophy of biology.

  ### Settled vs contested

  *   **Settled:**
      *   Adaptationism is a hypothesis, not an axiom.
      *   Current utility does not entail historical origin (exaptation is real).
      *   Null hypotheses (drift, constraint) must be considered before inferring selection.
      *   "Just-so story" is a legitimate critique when evidence is absent.
  *   **Contested:**
      *   **The Default Stance:** How strong must the evidence for selection be before we accept it? (Pan-selectionism vs. Pluralism).
      *   **Trait Individuation:** When is a feature a "trait" subject to selection versus a byproduct of a selected trait?
      *   **Modeling vs. History:** Can mathematical optimality models count as evidence for selection without historical fossil records?
      *   **The Definition:** Whether "just-so story" applies to unfalsifiable claims only, or also to claims that ignore plausible alternatives.
