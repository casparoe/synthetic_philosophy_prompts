prompt: |-
  Give me a number and the decomposition, not a literature tour. The proposition I want priced: Quine's gavagai argument, if sound, shows that there is no fact of the matter about which translation manual is correct — i.e., it establishes metaphysical indeterminacy, not merely our inability to choose among manuals that fit all the evidence equally well, where the evidence is held fixed at everything the native's total verbal and non-verbal behavior could ever reveal.

  Decompose at least the following, with a probability and one sentence of justification for each: that stimulus meaning is determinate enough at the level of observation sentences to carry the argument; that the proxy-function maneuver (rabbits, undetached rabbit parts, temporal rabbit stages) genuinely preserves all of it, including patterns of assent and dissent and the speaker's readiness to correct others; that fitting all such evidence is the whole of what correctness consists in; and that Davidson-style replies — that a manual fitting all the evidence is one we could in principle write down, so it must be either correct or not — fail.

  Then a probe of my own. Suppose reference could be settled not by observation but by stipulation: teach the natives a fresh word by ostension, and test which manual predicts their uptake and their subsequent use. Does that pin down the fact of the matter, or does it merely relocate the indeterminacy into what the ostensive act itself meant? Say how much of your final number turns on your answer here.

  My credence is 0.7; a colleague's is 0.15. Give me yours, show how your terms combine into it, name the term the total is most sensitive to and what argument or result would move it, and say where the two of us most likely diverge. Finally, report how confident you are in the decomposition itself, and single out the step in it you are least sure of.
