answer: |-
  This is a superb question that cuts to the heart of early modern political economy. It requires disentangling Berkeley's specific developmentalist project from later debates about monetary neutrality.

  Here is the breakdown of Berkeley's monetary theory, his likely verdict on demurrage (the "rusting money" scheme associated with Silvio Gesell), and an analysis of your dispute.

  ### I. Berkeley's Monetary Theory: The Ticket and the Trade

  To understand Berkeley, you must strip away the Bishop's metaphysics. In *The Querist* (1735–1737) and his Irish tracts, Berkeley is not arguing about the nature of reality, but the nature of *credit*. His theory rests on three precise pillars, developed in the context of Ireland's economic strangulation by English trade laws and a chronic shortage of specie.

  **1. Money is not Wealth; Industry is Wealth.**
  Berkeley aggressively rejects bullionism. He argues that gold and silver are merely "counters" or "tickets." True wealth consists in the "industry of the people" and the produce of the land. In Query 45, he asks: *"Whether money be not only useful to excite industry?"* For Berkeley, money has no utility other than its capacity to stimulate labor. If money sits still, it is functionally non-existent.

  **2. Money as a Token of Power.**
  You are correct that Berkeley views money as a token. But it is specifically a token of *command over labor*. In Query 54, he asks: *"Whether the wealth of a nation be not best estimated by the number of its people, and their industry?"* Money is the mechanism that mobilizes idle hands. Therefore, the value of money is derived entirely from the social reality it represents (the availability of labor and goods), not the metal it contains. This is why he advocated for a National Bank in Ireland that would issue paper notes backed by land or national credit, rather than silver.

  **3. Circulation is the Lifeblood.**
  Berkeley is obsessed with the *velocity* of money, though he lacks the modern term. He repeatedly queries whether money that does not circulate is beneficial. He views hoarding as a social vice because it breaks the circuit of command. If a miser holds a ticket, he commands labor but never calls in the claim; the labor remains idle. Therefore, the ideal monetary system is one that ensures tickets pass rapidly from hand to hand, keeping laborers employed.

  **Crucially:** Berkeley is not a quantity theorist in the Humean sense (where more money just means higher prices). He believes that in a depressed economy (like 1730s Ireland), increasing the supply of money creates real output because there are idle resources to be mobilized. Money is a veil, but it is a veil that, when drawn, reveals the actors; when dropped, the play stops.

  ### II. The Verdict on Demurrage

  Your friend cites Silvio Gesell's theory of *Freigeld* (free money), where currency loses value over time unless stamped. How would Berkeley rule?

  **What Berkeley Would Endorse:**
  Berkeley would enthusiastically agree with the *diagnosis* underlying demurrage. He would agree that money ought not to be a "thing worth possessing in itself." The idea that a currency should structurally discourage hoarding aligns perfectly with his view that stagnant money is dead money. In Query 226, he asks: *"Whether a nation may be said to be rich, if the money be locked up?"* A currency that rusts forces the lock open. He would appreciate the psychological nudge: if the ticket expires, the holder is compelled to use it to command labor or buy goods, thereby sustaining the circulation he deems vital.

  **What Berkeley Would Resist:**
  However, Berkeley would likely reject the *mechanism* of demurrage for three reasons, turning on the specific goals of his political economy:

  1.  **Stability of Measure:** Berkeley treats money as a "measure" of labor power. While he rejects intrinsic value, he requires *stable* value to facilitate contracts and long-term industry. If money is programmed to expire, it becomes a volatile measure. A farmer cannot plan a harvest cycle if the currency he sells into today is worth less next month by design. Berkeley wants to encourage *production*, which takes time. Demurrage encourages *spending*, which is immediate.
  2.  **Credit vs. Currency:** Berkeley's solution to Ireland's problem was not to tax the existing stock of money (demurrage), but to *create new credit* via a National Bank. Ireland suffered from a shortage of tickets, not an excess of hoarding. Demurrage is a solution for liquidity traps where money exists but won't move. Berkeley's problem was that the money didn't exist at all. He would argue that forcing existing money to move is less effective than issuing new money against land security to employ the poor directly.
  3.  **Thrift vs. Avarice:** Your friend argues demurrage is a "tax on thrift." Berkeley would make a subtle distinction here. He detested *avarice* (hoarding for its own sake) but valued *frugality* (saving to invest in industry). Demurrage punishes all holding. If a merchant holds money to accumulate capital for a manufacturing venture, demurrage penalizes that accumulation. Berkeley wants money to flow into *industry*, not just into *consumption*. A rotting currency might spur people to buy luxury goods (to avoid the tax) rather than invest in productive capacity.

  **The Contextual Turn:**
  Berkeley's answer would turn less on monetary theory and more on Irish conditions. In 1730s Ireland, the bottleneck was not the velocity of money, but the lack of a banking infrastructure to issue it. He would likely view demurrage as a sophisticated solution to the wrong problem. He would say: *"Why stamp the few notes we have to make them rot, when we might issue new notes against the land to make the poor work?"*

  ### III. The Dispute: Berkeley or Priors?

  You and your friend are both partially right, but you are both smuggling in anachronistic priors.

  **Your Prior (The Keynesian/Underconsumptionist):**
  You argue Berkeley would delight in perishing currency because money is just a token. You are reading Berkeley through a post-Keynesian lens that prioritizes *aggregate demand* and *velocity*. You assume that because Berkeley hates hoarding, he must love any mechanism that forces spending. But you overlook that Berkeley's goal was *supply-side* activation (employment/production), not demand-side stimulation (consumption). You are using Berkeley to argue for high velocity, which he liked, but via a mechanism (demurrage) that might undermine the stability required for the industry he cherished.

  **Your Friend's Prior (The Austrian/Classical Liberal):**
  Your friend argues Berkeley would detest it because money must store value. This is a Lockean or Misesian view—that money's function as a store of value is paramount to protect property and thrift. Your friend is projecting a "sound money" ideology onto Berkeley. Berkeley explicitly rejects the idea that money needs to hold value intrinsically (he prefers paper to gold). However, your friend is right that Berkeley requires money to hold value *instrumentally* to measure labor contracts. Your friend is using Berkeley to defend the sanctity of savings, which Berkeley only valued insofar as those savings were reinvested in national industry.

  **The Umpire's Ruling:**
  The disagreement is not genuinely about Berkeley; it is about the **function of money in a depressed economy.**

  *   **You** see money as a **flow**. You are right that Berkeley saw money as a stimulus.
  *   **Your Friend** sees money as a **stock**. They are right that Berkeley saw money as a measure.

  Berkeley transcends this dichotomy. He views money as a **catalyst**.

  If forced to judge: **You have Berkeley closer on the ontology of money** (it is a token, not a commodity). **Your friend has Berkeley closer on the teleology of money** (it must serve industry, which requires stability).

  However, on the specific proposal of demurrage: **Your friend is more likely correct about Berkeley's reaction.** Berkeley was a pragmatist concerned with the "better supplying of churches" and the employment of the poor. He would likely view a decaying currency as a gimmick that introduces uncertainty into the very contracts required to organize industry. He would prefer a stable paper currency, issued liberally by a National Bank, to a rotting currency issued by a Central Bank. He wanted to cure the poverty of Ireland, not merely accelerate the turnover of its tokens.

  **Final Word:**
  You are arguing for the *velocity* of money; your friend is arguing for the *validity* of money. Berkeley argues for the *vitality* of the nation. He would tell you both that a currency is only as good as the labor it commands. If rusting money makes men work, he might tolerate it. If it makes men gamble to avoid the rust, he would condemn it. Given his emphasis on steady industry over speculative frenzy, he would likely side with your friend, but for different reasons: not because money is a sacred store of value, but because a decaying measure disrupts the industry that constitutes true wealth.
