answer: |-
  **Proposal for Independent Research Seminar**
  **Title:** Beyond the Clock: Distinguishing Time Deprivation from Work-Identity Monopoly

  **Research Question**
  Is the wrongness of overwork fully explained by the deprivation of leisure time, or does "work-identity monopoly"—the condition wherein work becomes the sole source of standing and purpose—constitute a genuinely separate harm that does not reduce to hours? If these two harms come apart, do current policy interventions, such as statutory hour caps and right-to-disconnect rules, target the wrong variable?

  **Problem Statement and Existing Approaches**
  Current debates regarding overwork operate on a hidden assumption: that the harm of work is measured primarily in hours. This assumption treats leisure merely as residual non-work time. Consequently, policy solutions focus on time redistribution, exemplified by the contrast between *karoshi* in Japan and France's 35-hour work week. However, this framing conflates two distinct injuries. The first is the deprivation of time not devoted to work. The second is the colonization of the self, where an individual loses the capacity for activity undertaken for its own sake.

  Existing frameworks leave this distinction unresolved. The Marxist critique of alienated labor identifies a structural separation from the product of work but often defaults to time-based liberation. The Protestant-ethic picture treats work as a calling, which explains the drive to work but often validates it rather than critiquing the monopoly it creates. Egalitarian theories treat leisure as one distributable good among others, focusing on the quantity of time available rather than the qualitative capacity to use it. Finally, public-health framing treats long hours as a statistical risk factor. While empirically useful, this approach cannot settle the normative question of whether reducing hours addresses the root harm if the identity structure remains intact. As my mother, an emergency physician, once remarked half in jest, she would not know what to do with a four-day weekend. Her comment highlights the gap: she has time deprivation, but the deeper issue is a cultivated incapacity for non-work life. Reducing her hours without addressing the identity monopoly might leave the harm untouched or even sharpen it.

  **Methodology**
  This project will employ conceptual analysis and thought experimentation rather than empirical data collection. The method proceeds in three phases over a twelve-week term.

  *Weeks 1–3: Conceptual Groundwork.* I will rigorously define "work-identity monopoly" and distinguish it from fatigue and addiction. I will articulate the "double duty" of leisure: as residual time versus as a cultivated capacity.
  *Weeks 4–6: Testing the Distinction.* I will apply these definitions to two mandatory test cases. First, the person who works eighty hours a week at something they love and would refuse any offer to stop. Second, the recently retired person who has all the hours in the world but is miserable. I will analyze whether the harm in these cases tracks with hours or with identity structure.
  *Weeks 7–9: Policy Implications.* I will evaluate hour caps and disconnection rules against the findings. If the harm is identity-based, do time-based regulations fail?
  *Weeks 10–12: Synthesis and Drafting.* I will assemble the argument into a final paper, refining the definitions based on the policy testing.

  **Defense of Method**
  I propose philosophical argumentation rather than a survey of hours and wellbeing or a history of the shorter-hours movement. A survey would yield statistical correlations, but my supervisor has rightly noted that the question is one argument must settle, not statistics. Data can show that long hours correlate with unhappiness, but it cannot determine whether the unhappiness stems from time loss or identity loss. Similarly, a historical account would explain how we arrived at current norms but would not adjudicate whether those norms rest on a conceptual error. Only conceptual analysis can test whether the distinction is real or merely verbal.

  **Success and Failure Conditions**
  A successful result will demonstrate that work-identity monopoly is conceptually distinct from time deprivation and that recognizing this distinction changes the verdict on at least one concrete policy proposal. For example, showing that a right-to-disconnect law is insufficient without cultural support for non-work identities.

  I commit to abandoning the distinction under two conditions of failure. First, if every case of work-identity monopoly I construct turns out to be redescribable as a case of hours and fatigue (e.g., if the 80-hour worker is shown to be deluded by exhaustion). Second, if the distinction never changes the verdict on any concrete policy (i.e., if fixing the time problem inevitably fixes the identity problem, making the distinction practically inert).

  **Scope and Feasibility**
  Given a full high school course load, I must limit the scope to ensure completion. I will not conduct a comparative analysis of international labor laws (Japan vs. France vs. others), as this risks becoming a survey of facts rather than an argument. Instead, I will use these examples only as illustrative anchors for the philosophical claims. I will also limit the engagement with the four existing approaches described above to their core arguments regarding time and value, rather than tracing their intellectual histories. This ensures the project remains a focused inquiry into the nature of the harm of work, achievable within the seminar's timeframe.
