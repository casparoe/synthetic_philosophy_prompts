answer: |-
  ### The Sidebar Quiz: "The Skill Test"

  **Instructions for the Reader:** *Don't overthink. Pick the answer that feels like the truth, not the one that sounds clever. There are no right answers, only different maps.*

  #### The Questions

  **1. The Paralyzed Pianist**
  A virtuoso pianist suffers complete paralysis from the neck down. Her memory, hearing, and theoretical knowledge are perfect. She can listen to a recording and tell you exactly where the performer hesitated.
  *   **A.** She still knows how to play; her hands are just broken.
  *   **B.** She no longer knows how to play; you can't play without hands.
  *   **C.** She knows the *theory* of playing, but the *skill* is gone.

  > **Design Note:** This splits the **Intellectualists** (A: skill is mental content) from the **Ryleans/Ability Theorists** (B: skill is disposition to act). **C** is a **Hybrid** position (distinguishing propositional knowledge from practical capacity).

  **2. The Manual vs. The Old Timer**
  Person X has read every manual on flying a plane but has never left the ground. Person Y has flown for 30 years but can't explain the aerodynamics of a stall and acts on instinct.
  *   **A.** X knows how to fly; Y just has habits.
  *   **B.** Y knows how to fly; X is just guessing.
  *   **C.** They know different things; "knowing how" is ambiguous here.

  > **Design Note:** This embarrasses the **Intellectualist** (who must defend X) and the **Radical Anti-Intellectualist** (who must defend Y). **C** is the **Deflationist** or **Pluralist** escape route.

  **3. The Fade**
  You learn to knit. Over ten years, you get slightly slower, miss a stitch occasionally, but generally produce the same scarf.
  *   **A.** You still know how to knit. Skill is binary; you either have it or you don't.
  *   **B.** Your skill has degraded. Knowing-how comes in degrees.
  *   **C.** You've lost the *virtue* of knitting, but kept the *ability*.

  > **Design Note:** Tests **Binary vs. Gradient** views. **A** suits classic **Ryle** or **Intellectualism**. **B** suits **Virtue Epistemology** or **Ability Views**. **C** is a niche **Hybrid** distinction.

  **4. The Black Box AI**
  An AI system lands planes safer than any human. It cannot explain why it made a specific adjustment, it just works.
  *   **A.** It knows how to land the plane. Success is the metric.
  *   **B.** It doesn't know how. It lacks understanding of what it's doing.
  *   **C.** It doesn't know how. It lacks agency/intent.

  > **Design Note:** **A** is **Functionalist/Deflationist**. **B** is **Intellectualist** (needs propositional grasp). **C** is **Virtue/Rylean** (needs mind/agency). *Note: If they pick A, they are committed to functionalism; if they pick B/C, they owe an account of what "understanding" adds to success.*

  **5. The Amnesiac**
  A surgeon gets brain damage. She forgets all medical facts (names of tools, anatomy terms) but when handed a scalpel, her hands move perfectly to suture a wound.
  *   **A.** She still knows how to operate.
  *   **B.** She's just a reflex machine now; the knowledge is gone.
  *   **C.** She has the ability, but not the knowledge.

  > **Design Note:** Tests **Separability**. **A** is strong **Rylean**. **B** is strong **Intellectualist**. **C** is **Hybrid**.

  **6. The Lucky Shot**
  A novice picks up a golf club and holes a shot from 200 yards. She has no idea how she did it and can't do it again.
  *   **A.** For that moment, she knew how to hit the shot.
  *   **B.** She got lucky. Knowing-how requires reliability.
  *   **C.** She knew how to swing, but not how to aim.

  > **Design Note:** **A** is **Deflationist** (outcome based). **B** is **Virtue/Reliabilist**. **C** is **Granular Hybrid**.

  **7. The Instruction**
  Can you learn to ride a bike solely by reading a physics textbook on balance and momentum?
  *   **A.** Yes, in principle, if the book were detailed enough.
  *   **B.** No. You have to get on the bike.
  *   **C.** You can learn the rules, but not the skill.

  > **Design Note:** Re-tests **Intellectualism (A)** vs. **Anti-Intellectualism (B)**. **C** reinforces the **Hybrid** split.

  **8. The Tool**
  A carpenter uses a new jig that makes a complex cut foolproof. Without the jig, she can't do it. With it, she does it perfectly every time.
  *   **A.** She knows how to make the cut; the jig is just part of her skill.
  *   **B.** The jig knows how; she just knows how to use the jig.
  *   **C.** The distinction is silly; the system makes the cut.

  > **Design Note:** **A** is **Extended Mind/Distributor**. **B** is **Traditionalist**. **C** is **Deflationist**.

  **9. The Forgetting**
  When you forget how to swim, is it the same kind of forgetting as forgetting your mother's birthday?
  *   **A.** Yes, memory is memory.
  *   **B.** No, one is in the head, one is in the body.
  *   **C.** No, one is facts, one is dispositions.

  > **Design Note:** **A** is **Intellectualist** (uniform memory system). **B/C** are **Rylean/Hybrid** (distinct systems).

  **10. The Pilot (Your Column Case)**
  A pilot has flown with autopilot engaged for 5,000 hours. She monitors the system. The system fails; she lands manually, but it's shaky.
  *   **A.** She never lost the skill; she was just out of practice.
  *   **B.** She handed the skill to the machine; she is now a supervisor.
  *   **C.** The skill was never "hers" alone; it was always a human-machine loop.

  > **Design Note:** The money question. **A** is **Rylean/Conservative**. **B** is **Alarmist/Intellectualist** (she lost the knowledge). **C** is **Extended Mind/Distributor**.

  ***

  ### The Scoring Key

  Tally your answers. You don't need exact numbers; look for the dominant pattern.

  *   **Mostly A (The Mind/Rule Cluster):** You lean toward **Intellectualism** or **Extended Functionalism**. You believe skill is primarily about information, rules, or successful output, regardless of the body.
  *   **Mostly B (The Body/Action Cluster):** You lean toward **Rylean Anti-Intellectualism** or **Virtue Epistemology**. You believe skill is rooted in physical capacity, reliability, and agency.
  *   **Mostly C (The Split/Context Cluster):** You lean toward **Hybrid Views** or **Deflationism**. You believe the word "skill" does too much work and needs to be broken down or dissolved.

  ***

  ### The Cells (Answer Profiles)

  Based on the combinations, readers will land in one of five "Cells."

  **Cell 1: The Pure Intellectualist**
  *   *Pattern:* Q1(A), Q2(A), Q5(B), Q7(A).
  *   *View:* **Intellectualism (Stanley & Williamson).** Knowing-how is a species of knowing-that. If you have the propositional content, you have the skill.
  *   *Status:* **Live.** Defended by contemporary analytic philosophy.

  **Cell 2: The Pure Practitioner**
  *   *Pattern:* Q1(B), Q2(B), Q5(A), Q7(B).
  *   *View:* **Rylean Anti-Intellectualism.** Intelligent practice cannot rest on prior contemplation. The ability *is* the knowledge.
  *   *Status:* **Live.** The classic view, still dominant in sports psychology and craft.

  **Cell 3: The Virtue Reliabilist**
  *   *Pattern:* Q3(B), Q4(C), Q6(B), Q10(B).
  *   *View:* **Virtue Epistemology (Sosa, Greco).** Skill is a stable disposition rooted in agency. Luck doesn't count; AI doesn't count; degradation matters.
  *   *Status:* **Live.** Growing influence in ethics and epistemology.

  **Cell 4: The System Distributor**
  *   *Pattern:* Q4(A), Q8(A/C), Q10(C).
  *   *View:* **Extended Mind/Cognitive Systems (Clark, Chalmers).** The skill isn't in the head or hands; it's in the loop (human + tool + environment).
  *   *Status:* **Live.** Very popular in HCI, automation, and cognitive science.

  **Cell 5: The Inconsistent Dualist (Unnamed)**
  *   *Pattern:* Q1(B) [Paralyzed pianist does *not* know how] + Q2(A) [Book learner *does* know how].
  *   *View:* **Unnamed.**
  *   *Why:* **Incoherent.** You cannot claim physical ability is necessary for the pianist but irrelevant for the book learner. This implies skill is physical in one case and propositional in the other without a principled distinction. It's usually just confusion.

  ***

  ### Indistinguishable Leaves

  **The Tie:** **Cell 3 (Virtue)** and **Cell 4 (Distributor)**.
  *   *Why:* Both often answer "It depends on the context" and "Degrees matter." In a 10-question quiz, a reader who sees skill as "distributed across a system" often answers identically to someone who sees skill as "a complex virtue of judgment."
  *   *The Tie-Breaker Question:* "If I upload your brain to a computer that controls a robot body perfectly, is it still *your* skill?"
      *   **Virtue:** No (loss of biological agency/character).
      *   **Distributor:** Yes (functional continuity of the system).

  ***

  ### Reader Prediction & Usability

  **Where they land:**
  Your science desk readers will likely cluster in **Cell 4 (The System Distributor)**. They work in automation and neuroscience; they are trained to see the brain as a component in a larger processing loop. They are skeptical of "ghost in the machine" soul-based skill (Virtue) but also wary of pure "fact" definitions (Intellectualism). They view the pilot not as a degraded hero, but as a node in a changing network.

  **Does it help the column?**
  **Yes.** If you conclude from this leaf, you avoid the nostalgic trap ("we are losing our humanity") and the techno-utopian trap ("machines are better anyway"). Instead, you can argue that the *location* of the skill is shifting. The pilot hasn't lost the skill; the *unit of competency* has expanded from "human" to "cockpit." This allows you to end on a note of redesign rather than decline: the question isn't "how do we keep pilots hand-flying?" but "how do we design the loop so the human node remains critical?"

  Verdict: The System Distributor — usable
