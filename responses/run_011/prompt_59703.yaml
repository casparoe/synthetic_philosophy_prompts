  The lid lifts up and light pours in like rain,
  A yellow blaze, a blueish light unnamed.
  I know the heavy weight within my palm,
  The ridges here, the smoothness there, so calm.
  But on the table, only patches glow,
  Confused illuminations, ebb and flow.
  Which one is which? The doctor asks me now.
  I point to gold, but cannot tell you how.
  My fingers know the angle and the curve,
  My eyes see fire that they cannot serve.
  I shake my head. The colors do not speak.
  The known is strong, the visible is weak.

  Three days have passed. I reach my hand across
  The gap of air, no longer feeling loss.
  My palm hovers, then rests on what I see,
  And let the old words paint the mystery.
  This yellow patch is where the angle lies,
  That blue expanse holds the curve in its eyes.
  Or did I teach the light to mimic skin?
  I cannot say where touch ends, sight begins.
  The word is one, the world is still in doubt,
  Whether one truth or two were stitched throughout.
