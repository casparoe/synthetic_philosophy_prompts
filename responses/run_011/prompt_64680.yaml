answer: |-
  The rain on the roof of the Parish Hall was loud enough to drown out the whispering, but not the shifting of feet on the wooden floor. There were no photographs on the walls. There never were, but today the absence felt like a physical weight. The desk at the front, where Eilidh MacLeod had sat for forty years, was bare. No papers, no planner, no framed picture of her husband. All of it had been burned on the pyre three weeks ago, along with her letters and her diaries. The custom was absolute: nothing survives but the keepers.

  Calum, Fiona, and Duncan sat behind the empty chair.

  Calum, her son, wore his diving sweater, the wool still damp. He held his teacup with both hands, pinkies tucked in, exactly as Eilidh had done. Fiona, the doctor, sat with her spine rigid, her pen poised over a blank notebook. Duncan, the crofter, slouched slightly, his hands flat on the table, mimicking the defensive posture Eilidh adopted when she knew she was about to be lied to.

  The community stood before them, divided. The proposal from the tidal-energy consortium lay on the lectern. Lease the common grazing and the sea bed for twenty years. Significant income for the island trust. Risk to the fishing grounds. Risk to the silence. The vote was tied. By custom, the Chair held the casting vote. By custom, the Chair was dead.

  "We need her voice," said old Mr. Gillies from the back. "We need to know what Eilidh would have done."

  Calum cleared his throat. He looked tired. The grief was there, but it was overlaid with something else, a concentration so intense it looked like pain.

  "She would have signed," Calum said. His voice dropped an octave, settling into the rhythmic cadence Eilidh used when delivering verdicts. "The sea is changing. The fish are gone further out. The boys can't dive forever. She knew the island dies if it stays still."

  Fiona shifted. She adjusted her glasses, pushing them up the bridge of her nose with a sharp tap of her middle finger. Eilidh's tic.

  "That isn't right," Fiona said. Her tone was cooler, clinical. "She hated dependency. Remember the ferry subsidy ten years ago? She argued we should lose the money rather than let the council dictate the timetable. She said, 'Poverty with freedom is better than wealth on a leash.' This lease is a leash."

  Duncan snorted. It was a dry, abrasive sound. He and Eilidh had fought over boundary lines since the seventies. He knew her temper better than anyone.

  "You're both polishing her up," Duncan said. "She wasn't a philosopher, Fiona. She was a pragmatist. She wouldn't have signed without seeing the environmental impact study. She never moved on a second-hand report. She'd have stalled them. Six months, minimum. Make them sweat."

  The hall murmured. Three answers. None matched.

  Calum set his cup down. The saucer rattled. He looked at his hands. "I'm telling you what she told me. Last Christmas. We were shelling prawns. She said the island needs new blood, new money."

  "She said that to you," Fiona countered. "To me, she said the community is the asset, not the land. Sell the land, you sell the community."

  "She said different things to different people," Duncan muttered. "That's the truth of it. She played us."

  "And that," said a voice from the side, "is exactly the problem."

  Morven stood up. She was twenty-four, had left for Glasgow at eighteen, and returned only for the funeral. She wore a city coat that looked too thin for the Hebrides. She held a paperback book, but she didn't open it. She didn't need to.

  "You're asking us to treat three memories as one person," Morven said. Her voice was clear, lacking the island lilt. "But you disagree. If Eilidh was a pattern, as you claim, that pattern should be stable. If you copy a file onto three drives, the data should match. Here, the data is corrupt."

  She gestured to the keepers. "Calum sees a mother who wanted him to be safe. Fiona sees a mentor who valued principle. Duncan sees an adversary who valued leverage. You aren't channeling her. You're grieving. You're using her name to win an argument you're having amongst yourselves. Nothing is present here but your own interests."

  Calum flinched. He reached for the teapot. His hand hovered. He poured for Fiona, then Duncan, then himself. But when he lifted his own cup, he paused. He stared at the steam.

  "She liked it black," Calum said, but he didn't drink. He just held it. "But I take milk. I've always taken milk."

  "Calum," Fiona warned softly.

  "No," he said. He looked up, and his eyes were unfocused. "I'm trying to remember if she'd have wanted the money for the school roof. The leak is back. She hated leaks. But she also hated debt." He rubbed his temple. "I can feel... I know what she would say about the roof. But I don't know if I'm saying it because I want the roof fixed, or because she's saying it."

  He put the cup down. "Is it me wanting the money for the school, or is it her wanting the money for the school? It feels like the same want. But it's not."

  This was the cost. Calum was no longer sure where his own impulses ended and the borrowed pattern began. It wasn't a madness; there was no hallucination. It was simply a loss of boundary. He was becoming a vessel that leaked.

  Fiona leaned forward. This was her moment. The extrapolation.

  "The tidal turbines," Fiona said, addressing the room, not the keepers. "Eilidh never saw them. She died before the prototypes were installed in Orkney. She couldn't have had an opinion on the specific technology."

  "Exactly," Morven said.

  "But," Fiona continued, "she had a rule about the common grazing. 'If you take from the ground, you must put back more than you take.' It was her rule for the peat banks. For the sheep. She applied it to everything."

  Fiona paused. She was doing the work now, extending the line.

  "If we accept the lease, we take energy. But the electromagnetic field from the cables affects the lobster pots. We know this. We can't put back the lobsters. So, by her own rule, the lease is invalid. She wouldn't have known about the cables, but she would have recognised the imbalance. She would have rejected it."

  The hall was silent. It was a flawless logical extension of Eilidh's ethics into a domain she never knew. It felt like her. It sounded like her.

  "Or," Duncan said, leaning forward, his elbows on the bare wood, "she would have said that lobsters aren't people, and the school roof is. She was hard, Fiona. Don't forget she was hard. She'd have sacrificed the lobsters for the children every time. You're making her soft because you loved her."

  "I loved her too," Calum said. His voice cracked. "But I don't know who I am anymore."

  Morven stepped forward again. "And that proves my point. A pattern doesn't degrade into confusion. A person is one thing. You are three people fighting over a ghost. You want her to be present so you don't have to make the hard choice yourselves. You want her authority to absolve you."

  "She is present," Calum insisted. He stood up. He moved around the desk, standing in the spot where Eilidh used to stand. He placed his hands on the wood. He didn't speak for a moment. He looked at the crowd. He waited. The silence stretched, uncomfortable, heavy.

  When he spoke, it wasn't about the turbines. It wasn't about the school.

  "Mr. Gillies," Calum said, looking at the old man in the front row. "You still owe the trust for the gate repair from 2019. You said you'd pay when the lambs were sold. They were sold in October."

  The hall gasped. It was a petty, administrative detail. Something Eilidh would have caught. Something she would have raised immediately, before any major business could be conducted. It was exactly the kind of unkind, precise observation she used to keep everyone honest.

  Calum blinked. He looked surprised. He touched his mouth. "I... I didn't know I remembered that."

  "Did she tell you?" Fiona asked sharply.

  "No," Calum said. "I wasn't there. I was diving."

  "Then where did it come from?" Duncan asked.

  Calum looked at his hands again. "I don't know. It just... felt like something that needed saying. Before we could talk about the big things."

  Morven shook her head. "Coincidence. You live on a small island. You hear things."

  "I don't hear things," Calum said. "I feel them."

  The meeting was adjourned. No vote could be cast. The custom was clear: if the keepers cannot agree on what the deceased would have decided, they must agree on which of them *is* the deceased for the purpose of the vote. They must isolate. They must wrestle the pattern down to a single voice.

  The hall emptied. The rain continued. Calum, Fiona, and Duncan remained behind the desk. The empty chair sat between them.

  "We can't agree," Fiona said. "Calum says Yes. I say No. Duncan says Wait."

  "Duncan says she'd wait," Calum corrected. "I say she'd sign."

  "And I say you're both projecting," Duncan said. He stood up, stiffly. "I'm the only one who knew she was capable of being wrong. You two put her on a pedestal. I knew she was just a woman who liked being in charge."

  "That doesn't make you her," Fiona said.

  "It makes me accurate," Duncan replied.

  Morven lingered by the door. She watched them. She didn't leave. She wanted to see if they would break.

  Calum picked up the teapot again. He poured more tea. He added milk to his own cup. Then he stopped. He looked at Fiona's cup. He reached for the milk jug to pour for her, then stopped. Eilidh took her tea black. Fiona takes it white.

  "If I pour you milk," Calum said quietly, "I'm treating you like Fiona. If I don't, I'm treating you like her."

  "I am Fiona," she said.

  "Are you?" Calum asked. "When you argued about the lobsters. Was that you the doctor, or you the keeper?"

  Fiona didn't answer. She looked at the blank notebook. She wanted to write something down, to record the argument. But there were no pens allowed for the keepers during the deliberation. No records. Nothing to survive but the decision.

  "We have to go to the session house," Duncan said. "Lock ourselves in. Until we agree."

  "And if we don't?" Calum asked.

  "Then the proposal fails," Duncan said. "Status quo. That was her default. When in doubt, do nothing."

  "That's not true," Calum said. "She took risks."

  "She took calculated risks," Duncan countered.

  Morven pushed off the doorframe. "You see? You can't even agree on her risk profile. You're constructing her from your own needs. Calum needs her to be supportive. Fiona needs her to be principled. Duncan needs her to be cautious so he doesn't have to change."

  She walked towards them. She stopped in front of Calum.

  "Does it hurt?" she asked him. "Carrying her?"

  Calum looked at her. He looked exhausted. Not physically, but deeply. As if his skin was too tight.

  "It's quiet," he said. "When I'm alone. But when I'm here... it's like there's someone standing behind me. Breathing. But I don't know if it's her breathing, or if I'm holding my breath."

  He looked at the empty chair.

  "She's not in the chair," Calum said. "She's in the space between us. In the argument. If we stop arguing, she stops."

  "Then let's stop," Morven said. "Let her go."

  "If we let her go," Fiona said, her voice trembling slightly, "who decides about the school roof?"

  "The trust," Morven said. "You decide. Not her."

  "She knew better," Duncan said.

  "Did she?" Morven asked. "Or did she just know longer?"

  She turned and left the hall. The door clicked shut. The latch engaged.

  The three keepers sat in the silence. The rain hammered the roof. The teacups were cooling. The proposal lay on the lectern, unread.

  Calum reached out and touched the empty chair. He didn't sit in it. He just rested his hand on the backrest.

  "We could flip a coin," Calum said.

  "No," Fiona said. "That's chance. She wasn't chance."

  "We could vote," Duncan said. "Majority rules."

  "No," Calum said. "She wasn't a democracy."

  They sat there. The light was fading. The shadows lengthened across the bare desk. There were no papers to shuffle, no files to consult. There was only the memory of a woman who was dead, distributed across three brains that could not agree on whether she was present, or whether they were simply alone together in the dark.

  Calum took a sip of his tea. It was too hot. He winced.

  "She always let it cool," he said.

  "Then you're not her," Duncan said.

  "I know," Calum said. "But I'm all we've got."

  He looked at Fiona. He looked at Duncan.

  "Who speaks for her tomorrow?"

  Neither of them answered. The question hung in the air, unresolved, joining the rain and the dark and the silence of the burned papers.

  ***

  **Author's Note**

  Calum embodies the *affective* self—the emotional habits and domestic intimacy that survive death, but at the cost of the carrier's own identity boundaries (the 'bleed'). Fiona represents the *principled* self—the abstractable logic and ethics that can be extrapolated to new contexts, though this risks idealization. Duncan embodies the *adversarial* self—the knowledge of flaws and limits that grounds the pattern in reality. The story pushes back against the thesis by suggesting that if the distributed pattern generates contradictory outputs, its utility as a singular agent collapses, leaving the community with nothing but the living's disagreement.
