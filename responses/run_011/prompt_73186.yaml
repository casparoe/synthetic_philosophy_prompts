answer: |-
  # Final Examination: Epistemology of Testimony

  **Question 1 (25 Marks)**

  Consider the following case. All stipulations must be taken as fixed facts for the purpose of your answer.

  1. Vera addresses you and says: "In the ten years we have known each other, I have never said anything to you about a matter you were in a position to check independently which turned out to be false."
  2. Vera addresses you and says: "I am generally reliable about facts of this kind — about what I have and have not said to you in the past, and about whether those things were true."
  3. You have never once checked a claim of Vera's against independent evidence.
  4. You hold no observations that could serve as data for clause 1.
  5. You have no information about Vera's track record with anyone else.
  6. No one else has vouched for Vera.
  7. Nothing you possess counts as a defeater for either clause 1 or clause 2.
  8. You are otherwise perfectly situated to understand her utterance, and you are aware that if you were to accept clause 2 on her word, you could then treat clause 1 as your inductive evidence for her reliability — which in turn would license further trust in what she tells you, including clause 2 itself.

  **Task:**
  First, explain precisely what goes wrong with the attempt to build a non-circular positive reason for believing clause 1 out of the materials the case supplies, and say what kind of premise would be needed to repair the attempt. Second, explain whether clause 2 is any help, by distinguishing two readings of it: as a first-order claim about how Vera's past statements have come out, and as a second-order claim about her reliability concerning that very record — and say what follows on each reading. Third, reach and defend a verdict on whether, given the stipulations, you are epistemically permitted to believe clause 1.

  **Note:** No philosopher need be named, and names carry no marks. All marks are awarded for reasoning that engages the stipulations. Do not rely on labels for theoretical positions; argue from the structure of the case.

  ***

  # Model Answer

  The attempt to construct a positive reason for believing clause 1 fails because it inevitably begs the question. To use clause 1 as inductive evidence for Vera's reliability, one must first assume that clause 1 is true. However, the only source for the truth of clause 1 is Vera's testimony itself. Therefore, using clause 1 to prove Vera's reliability presupposes that Vera's testimony is already reliable enough to be accepted without proof. This is epistemically circular. To repair this attempt, one would need a premise independent of Vera's say-so, such as "Testimony from speakers in Vera's position is generally reliable" or "I have independent verification that Vera's past claims were true." Clause 3 and clause 4 explicitly rule out these premises; you possess no independent data.

  Clause 2 does not resolve this deficit, though it must be analyzed carefully. On the first-order reading, clause 2 is simply another factual claim about Vera's past performance, identical in status to clause 1. Accepting it requires the same warrant that is missing for clause 1, so it adds no new weight. On the second-order reading, clause 2 is a guarantee of the reliability of the record cited in clause 1. While this looks like a solution, accepting this guarantee on Vera's word requires assuming the very reliability it is meant to prove. Clause 8 highlights this: trusting clause 2 to validate clause 1 creates a loop where trust licenses evidence which licenses trust. Without an independent entry point, this loop cannot generate warrant from scratch.

  Despite this circularity, you are epistemically permitted to believe clause 1. The failure to build a positive reason does not entail a prohibition on belief. The verdict rests on the Principle of Default Entitlement: a hearer is entitled to accept testimony unless there are specific reasons for doubt. This principle is not an arbitrary line drawn to avoid discomfort; it is a necessary condition for the possibility of learning from others. If every testimonial claim required independent positive verification before acceptance, communication would collapse into skepticism. We cannot check every claim independently without already relying on other testimony to interpret the checks. Therefore, the burden of proof lies on defeaters, not on positive reasons. Since clause 7 stipulates no defeaters are present, the default entitlement stands. The circularity identified in the first task shows that you cannot *prove* Vera is reliable using only her word, but it does not show that you are forbidden from trusting her word in the absence of warning signs. Permission is grounded in the necessity of treating testimony as innocent until proven guilty, not in the possession of a completed inductive argument.

  ***

  # Marking Scheme

  **Total Marks: 25**

  **Move 1: Identifying the Circularity (5 Marks)**
  *   **Description:** The script explains that using clause 1 as evidence for reliability presupposes the truth of clause 1, which depends on reliability.
  *   **Error:** Failing to note that the evidence (clause 1) depends on the very faculty (trust) it is meant to justify.

  **Move 2: Specifying the Missing Premise (5 Marks)**
  *   **Description:** The script states that repair requires an independent premise (e.g., independent verification or general reliability known apart from Vera).
  *   **Error:** Suggesting the circle can be broken by simply repeating Vera's claims or ignoring stipulations 3 and 4.

  **Move 3: Distinguishing Readings of Clause 2 (5 Marks)**
  *   **Description:** The script distinguishes clause 2 as a claim about past facts (first-order) versus a claim about the reliability of the record (second-order).
  *   **Error:** Treating clause 2 as only one type of claim or conflating the record with the reliability assessment.

  **Move 4: Explaining the Failure of Both Readings (5 Marks)**
  *   **Description:** The script explains that the first-order reading needs warrant it lacks, and the second-order reading assumes the trust it aims to establish.
  *   **Error:** Claiming the second-order reading successfully validates clause 1 without external input.

  **Move 5: Committing to a Verdict (2 Marks)**
  *   **Description:** The script clearly states whether belief is permitted or prohibited.
  *   **Error:** Hedging or refusing to choose a side.

  **Move 6: Defending the Governing Principle (3 Marks)**
  *   **Description:** The script states the principle (e.g., Default Entitlement) and explains why it is necessary/non-arbitrary (e.g., avoids regress/skepticism).
  *   **Error:** Stating the principle without explaining why it is not merely an arbitrary exception to the requirement for reasons. **(Note: This move cannot be earned by labeling positions; it requires reasoning about the function of warrant.)**

  **Distinction between First-Class and Good Scripts:**
  A good script will correctly identify the circularity and distinguish the readings of clause 2 (Moves 1–4). A first-class script will excel at Move 6. It will not merely assert a principle but will integrate it with the case stipulations to show why the lack of positive reasons (established in Moves 1–2) does not entail prohibition. It will explain that the principle is a structural necessity for communication rather than a convenient rule, thereby resolving the tension between the circularity and the verdict.
