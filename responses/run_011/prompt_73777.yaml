answer: |-
  This is a profound position to be in. You are experiencing the "performative" power of bureaucracy firsthand: the intake form doesn't just measure reality; it creates the ontology of the caregiver. In Confucian terms, you are moving from *living* the *Li* (ritual/roles) to *authoring* it. That shift changes the ethical stakes from personal cultivation to institutional justice.

  Given your constraints (one semester, four volunteers, non-academic team), you cannot solve the metaphysics of role ethics. You can, however, build a system that *acts* as if it has solved them.

  Here is the ranked agenda. I have combined two of your candidates (the "unrecognized role" and "filial extension") because they are operationally the same problem. I have ranked them by **dependency**: if you fail at #1, the rest of the project is philosophically incoherent; if you fail at #2, it is legally dead; if you fail at #3, it becomes tyrannical; if you fail at #4, it is merely inefficient.

  ### 1. The Grounds of Role Individuation (Candidates 3 & 4)
  **The Question:** Is a caregiver role constituted by *status* (blood, marriage) or by *function* (the actual labor of care)?
  **What turns on it:** This determines the headers on your intake form. If status is primary, the "friend/neighbor" is a glitch to be managed. If function is primary, the "friend" is a core category equal to the "spouse." This is the difference between extending filial piety (*xiao*) by analogy versus recognizing that *care itself* generates the role.
  **Feasibility:** **High.** This is data work. Your volunteers can map the "actual care" provided by your current "friend/neighbor" category against the "spouse" category. If the labor overlap is 80%+, you have the empirical warrant to collapse the distinction.
  **Relation to others:** **This is the Hinge.** All other questions hang off this. You cannot translate relational obligations to a funder (#2) if you haven't defined what counts as a relation. You cannot critique a role (#3) if you don't know what constitutes it.

  ### 2. The Translation Problem (Candidate 5)
  **The Question:** Can relational obligation be rendered as legal eligibility without destroying the relation?
  **What turns on it:** This determines the *fields* on your intake form. Role ethics speaks in terms of obligation and reciprocity; your funder speaks in terms of rights, consent, and risk. If you define the "friend" as a "family member" to get them money, do you accidentally subject them to family liability laws? If you define them as a "contractor," do you strip the relationship of its moral weight?
  **Feasibility:** **Medium/Hard.** This requires legal review, not just philosophical agreement. Your team can draft the language, but you (the MA/Director) must vet it against compliance. This is the biggest risk to the project's survival.
  **Relation to others:** This is the **Constraint.** Even if you solve #1 (the friend *is* a caregiver), if you cannot solve #2, the funder rejects the form. It is the bridge between your ontology and their budget.

  ### 3. Internal Critique and Flexibility (Candidate 1)
  **The Question:** Can a caregiver contest the role assigned to them without exiting the system?
  **What turns on it:** This determines your *appeals process* and *training modules*. Confucian role ethics is not rigid; *Yi* (righteousness) allows for critiquing *Li* (ritual) when the ritual no longer serves the human (*Ren*). If your new categories become rigid boxes (e.g., "You are coded as 'Friend,' therefore you are not eligible for X"), you have replicated the problem you identified.
  **Feasibility:** **High.** This is process design. Your volunteers can design a "Role Review" checkpoint in the six-week training or a simple checkbox on the intake form: "Does this label fit your relationship?"
  **Relation to others:** This is the **Safety Valve.** It relies on #1 being solved (you need a flexible definition of role to allow critique) and #2 being secured (you need the budget slack to allow re-categorization).

  ### 4. Role Conflict and Priority (Candidate 2)
  **The Question:** When role obligations collide, is there a procedure, or is "harmony" just a euphemism for burnout?
  **What turns on it:** This determines the *curriculum scenarios* in the six-week class. Do you teach caregivers to prioritize the patient, themselves, or their other family roles? Role ethics often assumes a harmony that doesn't exist in modern fragmented life.
  **Feasibility:** **Medium.** This is curriculum writing. It is important, but it is secondary to the intake system. If the intake system is wrong, the training doesn't matter.
  **Relation to others:** This is the **Operationalization.** It only works if the roles are correctly identified (#1), legally viable (#2), and flexible (#3).

  ---

  ### Defense of the Ordering

  I have ordered these by **ontological dependency**.

  1.  **Individuation (#1)** must come first because you cannot administer what you cannot define. If you spend four months designing a translation for the funder (#2) based on the assumption that "family" means "blood," you will have built a perfectly compliant system that excludes the neighbors you know are doing the work. You must settle the metaphysics of the role before you settle the economics of the role.
  2.  **Translation (#2)** comes second because it is the **kill switch**. You could have the most philosophically robust definition of "Chosen Kin" (#1), but if the state's legal framework requires a marriage certificate to release funds, your project ends. This is why it ranks above Critique (#3). It is better to have a slightly rigid system that gets people paid than a perfectly flexible system that gets no funding.
  3.  **Critique (#3)** comes third because it addresses the **long-term ethics**. Once the system is running (defined and funded), you must ensure it doesn't become a cage. This is a "version 2.0" feature. You can launch without a robust appeals process, but you cannot launch without a definition or funding.
  4.  **Conflict (#4)** is last because it is **downstream**. Role conflict happens *inside* the roles. If the roles themselves are misidentified (e.g., treating a neighbor like a stranger), the conflict resolution training is treating the symptom, not the disease.

  ### What to Burn the Semester On

  **Burn it on #1 and #2.**
  Spend the first six weeks having your volunteers audit the "Friend/Neighbor" cases. Quantify the labor. Prove that the *function* is identical to the *Spouse* category. Use that data to write the new category definitions.
  Spend the next six weeks working with your legal counsel/funder contacts to draft the eligibility language that maps this new definition to their requirements.

  **Drop (or defer) #4.**
  Do not try to solve "Role Conflict" this semester. Put a placeholder in the training curriculum: *"Caregivers often face conflicting demands. Discuss with your social worker."* It is not ideal, but it is honest. Solving role conflict requires a depth of ethical training you cannot fit into a six-week class with tired volunteers. Focus on getting the right people in the door (#1) and getting them paid (#2).

  ### The Hinge: Individuation

  As noted, **#1 (Grounds of Role Individuation)** is the hinge.
  If you decide that roles are **Status-Based**, then #2 becomes a lobbying effort to change state kinship laws (impossible in 4 months).
  If you decide that roles are **Function-Based**, then #2 becomes a technical drafting exercise (mapping "hours of care" to "stipend levels").
  Your entire semester hinges on convincing your team and your funder that **care constitutes the role, not biology.**

  ### Triggers for Re-Ranking

  You should re-rank this agenda if:

  1.  **The Funder Veto (Move #2 to #1):** If your initial conversations with the funder reveal that they *legally cannot* fund anyone without a kinship tie, stop working on #1. You must pivot entirely to #2 (finding a legal workaround, e.g., "vendor" status) or the project is dead.
  2.  **Volunteer Capacity (Drop #3):** If your volunteers are struggling with the data audit for #1, drop the "Internal Critique" design (#3). It is better to have a solid intake form than a fancy appeals process no one understands.
  3.  **Personal Crisis (Pause Everything):** You mentioned your father's stroke. If your own navigation of the system reveals a barrier you didn't anticipate (e.g., the "Spouse" category is also broken), pause the agenda. Your lived experience is the primary data source. If the "Spouse" box is trapping *you*, then #1 needs to be broader than just "Friend/Neighbor."

  **Final Advice for the Volunteers:**
  Do not tell them they are studying "Role Ethics." Tell them they are **"Auditing Care."** Their task is not to read Confucius; it is to look at 50 files and count how many times a "Neighbor" did the work of a "Daughter." That is the evidence that will move the funder, and it is the evidence that validates the philosophy.
