prompt: |-
  Six weeks ago I became the duty officer at a regional flood forecasting centre. I sign the public warning messages that go out to about 300,000 people, and through the winter there's roughly one event a month where I have to decide, inside about fifteen minutes, whether we say a thing flat out or whether we hedge it — our director only sees the severe tier, everything below that is mine. Two messages last season blew up, and they blew up in opposite directions. In November a colleague wrote 'the Cale will overtop the weir at Tefford and flood the lower village', no qualifier, because two gauges and the model all pointed that way; it didn't happen, the crest came eleven centimetres short, and the parish council wrote to the director saying we'd cried wolf and they'd take no notice of the next one. In February someone else, terrified of repeating that, wrote 'there is a possibility of significant flooding in the Teff area' at a moment when we were as confident as we ever get, and only two households put their boards up; nine were flooded. I've now been told to write a one-page standing rule that every officer on the rota can run before a message goes out, and I'm stuck, because the obvious rule — only say it if you know it's true — seems to forbid every forecast we issue, since strictly speaking nobody knows the future.

  There's got to be a usable version of that argument somewere. I did a philosophy course years ago and I remember people fighting about whether the standard for stating something flat-out is truth, or knowledge, or just reasonable belief, and that the way you settle it is by looking at the cases where those come apart: the lottery ticket you end up right about, the stopped clock that reads the correct time, the rumour that turns out to be true. Please turn that into a procedure my rota can actually follow — the questions to ask in order, what counts as a settled answer to each, where the message must be flat, where it has to carry a number or an attribution to a source, and the point where the procedure stops being about evidence and hands the decision to a person because it's really about how much risk you're allowed to impose on people who can't opt out of it. It has to be runnable in ten minutes by someone who has been awake since 3am and has never heard the word epistemology, it should say explicitly what to do when we can't get a number out of the model, and it should be honest about which of its steps are just my own judgement dressed up as procedure.

  Then run it on three messages so I can see whether it behaves: (a) the February one, where we were as sure as we ever get but the wording said only 'a possibility of'; (b) a case where the flat statement came out exactly right but we got there by trusting an upstream gauge that we later found had been logging garbage — right answer, rotten route; (c) a warning we've been asked to issue off a 1-in-200-year projection for a reservoir nobody locally believes will go, where the cost of a false alarm is evacuating a town of four thousand for two days. I already suspect the procedure is going to tell me (b) was improper even though nothing bad happened and the officer was completely vindicated, and if that's the answer I want it stated plainly rather than softened, because it's exactly what my colleagues will refuse to accept and I need to know whether they're right to. Last thing: no bibliography, no reading list, no name-dropping — I can't check any of it and my staff definitely won't. Just the reasoning, plus a clear account of what the procedure can't settle and shouldn't pretend to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Duty Officer at a regional flood forecasting centre (6 weeks in).
      *   **Task:** Create a one-page standing rule/procedure for issuing public warnings (flat statement vs. hedged).
      *   **Context:** 300k people, ~1 event/month, 15-minute decision window. Two past failures: False Positive (Nov, cried wolf) and False Negative (Feb, hedged too much, people flooded).
      *   **Constraint 1 (Philosophical Basis):** Use epistemological concepts (truth vs. knowledge vs. reasonable belief) but translate them into operational steps. No jargon ("epistemology," names, bibliography).
      *   **Constraint 2 (Usability):** Runnable in 10 minutes by a tired officer. Must handle missing model numbers. Must admit where it's just judgement dressed up.
      *   **Constraint 3 (Testing):** Run the procedure on three specific cases:
          *   (a) The February case (High confidence, hedged wording -> under-reaction).
          *   (b) The "Lucky Guess" case (Flat statement, correct outcome, bad evidence/upstream gauge garbage).
          *   (c) The "Extreme/Unbelievable" case (1-in-200-year, high cost of false alarm, low local belief).
      *   **Constraint 4 (Tone):** Direct, honest, no softening of hard truths (especially regarding case b).

  2.  **Deconstruct the Philosophical Problem:**

      *   *Truth:* We can't know this beforehand.
      *   *Knowledge:* Justified True Belief. We can't guarantee Truth, so we focus on Justification.
      *   *Reasonable Belief/Assertion:* What warrants saying "X will happen" vs. "X might happen"?
      *   *The "Lottery/Stopped Clock" analogy:* A stopped clock is right twice a day, but you don't *know* the time by looking at it. Similarly, a flood forecast based on bad data that turns out right isn't *knowledge*, it's luck. The procedure needs to penalize luck, not just outcomes.
      *   *The "Cried Wolf" vs. "Missed Flood" tension:* This is a risk management problem disguised as an epistemological one. The standard for assertion depends on the cost of error.

  3.  **Drafting the Procedure (The "One-Page Rule"):**

      *   *Goal:* Convert "Justified Belief" into "Evidence Checklist."
      *   *Step 1: Evidence Quality (Justification).* Is the data robust? (Multiple gauges? Model consensus? Human check?)
      *   *Step 2: Confidence Threshold (The "Knowledge" Standard).* How sure are we? (Need a numerical or categorical proxy).
      *   *Step 3: Consequence Weighting (The "Assertion" Standard).* If we are wrong, what happens? (High cost of false alarm = higher bar for flat statement).
      *   *Step 4: Wording Selection.* Flat vs. Hedged vs. Numbered.
      *   *Step 5: The "Sleep Test" (Judgement).* Acknowledging the human element.

      *   *Refining for the User:* Needs to be punchy. No "epistemology." Use "Proof," "Risk," "Words."
      *   *Addressing the "Missing Number" constraint:* If the model fails, do we default to hedge or flat? Usually hedge, unless physical observation confirms.
      *   *Addressing the "Judgement dressed up" constraint:* Explicitly state where the officer takes the blame.

  4.  **Developing the Three Test Cases:**

      *   *Case (a) February:* High confidence, hedged words.
          *   *Procedure Check:* Evidence was good. Confidence was high. Consequence of flooding is high.
          *   *Verdict:* Procedure should flag this as an error in *translation*, not evidence. The rule should force flat language when confidence + consequence align.
      *   *Case (b) Lucky Guess:* Flat statement, right outcome, bad gauge.
          *   *Procedure Check:* Evidence quality fails (garbage gauge).
          *   *Verdict:* Procedure must condemn this. It's the "stopped clock." It encourages bad habits.
      *   *Case (c) Extreme/Unbelievable:* 1-in-200, high evacuation cost.
          *   *Procedure Check:* Evidence might be model-only (rare event). Consequence of false alarm is huge (evacuation). Local belief is low (credibility risk).
          *   *Verdict:* This is the hard edge. The procedure should likely demand a hedge or a specific attribution ("Model indicates...") rather than a flat "Will flood." It shifts the burden.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the tension.
      *   *The Procedure:* 5 Steps.
          1.  Check the Source (Garbage in?).
          2.  Check the Consensus (One model or three?).
          3.  Check the Cost (What if we're wrong?).
          4.  Pick the Phrase (Matrix).
          5.  The Signature (Ownership).
      *   *The "Honesty" Clause:* Where the procedure admits it's just policy.
      *   *The Test Runs:* Apply the steps rigorously.
      *   *The Hard Truth:* Specifically address Case (b) as requested.

  6.  **Refining the Tone:**

      *   Avoid academic language. Instead of "Justified True Belief," use "Solid Ground."
      *   Instead of "Epistemic Risk," use "Cost of Being Wrong."
      *   Make it look like a checklist.
      *   Ensure the distinction between *outcome* (flood happened) and *process* (was the data good?) is clear.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Keep the questions binary (Yes/No) where possible.
      *   *Critique:* Did I address the "missing number" constraint?
      *   *Fix:* Add a specific branch in Step 1 for "Model Failure."
      *   *Critique:* Is the distinction between "Flat" and "Hedge" clear?
      *   *Fix:* Define them explicitly. Flat = "Will." Hedge = "Risk of" / "Possibility."
      *   *Critique:* Did I handle Case (b) firmly enough?
      *   *Fix:* Ensure the verdict says "Improper" and explains why (process > outcome).

  8.  **Final Polish:** Check against constraints (no bibliography, no names, one-page feel, specific test cases). *Self-correction: The prompt asks for a "one-page standing rule" but also the reasoning and test runs. I will structure it as the Rule first, then the Reasoning/Tests.*

      *Wait, looking closer at the prompt:* "Please turn that into a procedure... Then run it on three messages."
      *Structure:*
      1.  The Procedure (The "One-Pager").
      2.  The Reasoning (Briefly, why it's built this way).
      3.  The Test Runs (a, b, c).
      4.  Limitations (What it can't settle).

      *Key Philosophical Translation:*
      *   Truth -> Outcome (Ignore this for decision making).
      *   Knowledge -> Evidence Quality + Consensus.
      *   Assertion -> Wording based on Risk/Cost.
      *   Gettier Cases (Lucky Truth) -> Flagged as "Process Failure" even if outcome is good.

      *Let's write the Procedure.*
      Title: Flood Warning Assertion Protocol (FWAP).
      Steps: Data Integrity, Consensus, Impact/Cost, Wording Matrix, Sign-off.

      *Let's write the Tests.*
      (a) Feb: Fail on wording.
      (b) Lucky: Fail on Data Integrity.
      (c) Extreme: Fail on Cost/Credibility -> Force Hedge/Attribution.

      *Let's write the Limitations.*
      It can't solve the political cost. It can't fix bad models. It relies on the officer's honesty about data quality.

      *Final check on tone:* Needs to be professional, operational, but philosophically rigorous without the jargon. "Don't trust luck." "Own the call."

      *(Self-Correction on Case B)*: The prompt says "I already suspect the procedure is going to tell me (b) was improper... I want it stated plainly." I must ensure I don't waffle here. It *was* improper.

      *(Self-Correction on Case C)*: High cost of false alarm. This raises the threshold for "Flat." Even if evidence is good, if the cost of error is massive, you hedge or attribute.

      *(Refining the "Missing Number" constraint)*: If the model gives no number, you can't say "X meters." You must speak to probability or observation.

      *Okay, ready to draft.*
answer: |-
  # FLOOD WARNING ASSERTION PROTOCOL (FWAP)
  **Valid for:** All Duty Officers, Regional Flood Forecasting Centre  
  **Time to Run:** <10 Minutes  
  **Purpose:** To standardise when we state a flood *will* happen versus when it *might*.

  ### STEP 1: CHECK THE GROUND (Evidence Quality)
  *Do not look at the outcome. Look at the inputs.*
  1.  **Data Integrity:** Are all gauges and sensors reporting within expected parameters? 
      *   *If NO (e.g., spikes, flatlines, known errors):* **STOP.** You cannot issue a Flat Statement. Proceed to Step 4 (Hedge).
      *   *If YES:* Proceed.
  2.  **Consensus:** Do at least two independent indicators agree? (e.g., Two gauges, or one gauge + model, or two models).
      *   *If NO (Single source only):* You cannot issue a Flat Statement. Proceed to Step 4 (Hedge/Attribute).
      *   *If YES:* Proceed to Step 2.

  ### STEP 2: CHECK THE COST (Consequence of Error)
  *What is the price of being wrong?*
  1.  **False Alarm Cost:** If we say "Flood" and it stays dry, what happens?
      *   *Low (Sandbags deployed, alertness raised):* Standard Threshold.
      *   *High (Mass evacuation, business closure, loss of trust):* **Elevated Threshold.** You need 3 indicators or physical confirmation to go Flat.
  2.  **Missed Event Cost:** If we say "Possible" and it floods, what happens?
      *   *High (Life safety, property loss):* Lean toward Flat if Step 1 is passed.
      *   *Low (Wet grass, minor inconvenience):* Lean toward Hedge.

  ### STEP 3: SELECT THE WORDING (The Assertion Matrix)
  *Match your Evidence (Step 1) against your Cost (Step 2).*

  | Evidence Status | Low Cost of False Alarm | High Cost of False Alarm |
  | :--- | :--- | :--- |
  | **Solid** (2+ sources, clean data) | **FLAT:** "Flooding will occur." | **CAUTIOUS FLAT:** "Flooding is expected." |
  | **Weak** (1 source, or model only) | **HEDGE:** "Risk of flooding." | **ATTRIBUTE:** "Models suggest risk." |
  | **Broken** (Data missing/unclear) | **HEDGE:** "Possibility of." | **NO WARNING** (Unless physical sight). |

  *Note on Numbers:* If the model fails to produce a level, do not invent one. Use time-based warnings ("Imminent") or qualitative warnings ("Significant").

  ### STEP 4: THE SIGNATURE (Judgement Call)
  *This is where the procedure ends and you begin.*
  Before signing, ask: **"If this turns out wrong, can I defend the *process* I used, even if the *result* was bad?"**
  *   If **YES**: Sign and send.
  *   If **NO**: Escalate to Director (if severe) or downgrade wording.

  ***

  # REASONING AND LIMITATIONS

  **Why this works:**
  This protocol separates *being right* from *knowing*. In philosophy, looking at a stopped clock that happens to show the right time isn't knowledge; it's luck. We do not pay you to be lucky. We pay you to be justified. Step 1 prevents the "Stopped Clock" error. Step 2 acknowledges that saying "Evacuate" requires more proof than saying "Move your car." Step 4 admits that no rule covers every emergency; eventually, a human must take the blame.

  **What this cannot settle:**
  1.  **Political Pressure:** If the Director tells you to warn to cover their back, this rule won't stop them. It only protects *you*.
  2.  **Model Bias:** If the model is consistently wrong but consistent, Step 1 might pass it as "Solid." You must use local knowledge to override.
  3.  **The "Cried Wolf" Effect:** This rule minimises it, but cannot eliminate the public's memory. That is a communications problem, not a forecasting one.

  ***

  # TEST RUNS

  ### Case (a): The February Under-Warning
  *Context:* High confidence (2+ gauges + model), high cost of missed event (homes flooded), wording was "Possibility."
  *   **Step 1 (Ground):** Passed. Multiple sources, clean data.
  *   **Step 2 (Cost):** High cost of missed event. High cost of false alarm (evacuation effort), but lower than property loss.
  *   **Step 3 (Wording):** Evidence is **Solid**. Cost of Miss is **High**. Matrix dictates **FLAT** ("Flooding will occur" or "is expected").
  *   **Step 4 (Signature):** Officer was terrified of November's error.
  *   **Verdict:** **PROCEDURE FAILURE.** The evidence warranted a Flat Statement. The officer allowed a previous outcome (November) to dictate current justification. This is "result-oriented" thinking, which this rule forbids. The wording was too weak for the evidence held.
  *   **Correction:** Issue Flat Statement. Accept that if it doesn't flood, you defend the data, not the outcome.

  ### Case (b): The Lucky Guess (Rotten Route)
  *Context:* Flat statement issued. Flood happened exactly as predicted. Upstream gauge was logging garbage (unknown at the time).
  *   **Step 1 (Ground):** **FAILED.** One key source was garbage. Even if other sources existed, if the decision relied on the bad gauge to tip the scale, the Integrity check fails.
  *   **Step 2 (Cost):** N/A (Process already failed).
  *   **Step 3 (Wording):** Should have been **HEDGE** or **ATTRIBUTE** due to data uncertainty.
  *   **Step 4 (Signature):** Officer cannot defend the process if the audit trail shows the gauge was faulty.
  *   **Verdict:** **IMPROPER.** It does not matter that the village was saved. You drove a car with no brakes and didn't crash. That is not skill; it is luck. If we reward this, officers will ignore data quality checks to meet deadlines. You must tell your colleagues: *This was a violation of protocol.* A correct forecast based on bad data is more dangerous than a wrong forecast based on good data, because it teaches you to trust broken tools.

  ### Case (c): The 1-in-200-Year Reservoir
  *Context:* Model projects catastrophic failure. Locals don't believe it. Cost of False Alarm is Evacuation (4,000 people).
  *   **Step 1 (Ground):** Model only? Or physical signs? If it's just a model projection for a rare event, Evidence is **Weak** (Single source, extreme outlier).
  *   **Step 2 (Cost):** False Alarm Cost is **Extreme** (Mass evacuation, economic loss, credibility destruction). Missed Event Cost is **Catastrophic** (Loss of life).
  *   **Step 3 (Wording):** Evidence is Weak. Cost of False Alarm is High. Matrix dictates **ATTRIBUTE** ("Models indicate a risk...") or **HEDGE**. Do not use Flat ("The dam will break").
  *   **Step 4 (Signature):** This is the hard call. The rule tells you to hedge, but lives are at stake.
  *   **Verdict:** **ESCALATE.** The procedure hits its limit here. The cost of a false alarm is too high for a Duty Officer to absorb alone on weak evidence. You must wake the Director. The wording must attribute the source ("Our models show...") rather than stating it as fact ("The dam will..."). This shifts the cognitive burden to the receiver to decide, which is honest given the uncertainty.

  ***

  # FINAL NOTE TO THE ROTA

  This procedure will sometimes make you look cautious when you could have been bold, and it will sometimes condemn you for being right for the wrong reasons (Case B). That is the point. We are not in the business of prophecy; we are in the business of risk management.

  If you follow Step 1 and Step 4 honestly, you can sleep after the shift. If you skip Step 1 because you "felt sure," and you turn out right, you have set a trap for yourself next time. Do not trust your gut. Trust the checklist. The gut is for Step 4, after the numbers are checked.

  **Signed:**  
  [Your Name]  
  Duty Officer
