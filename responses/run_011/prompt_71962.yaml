answer: |-
  # The Reconcile Protocol

  **Time Limit:** 45 Minutes
  **Goal:** Produce one House Number or a documented justification for why one cannot exist.
  **Rule:** No math on the board. No jargon. Talk about bets, not beliefs.

  ### Step 1: The Resolution Check (Event Definition)
  *   **Question:** "Read me the exact sentence that triggers a 'Yes' on this question. If you win your bet, what specifically happened?"
  *   **Sufficient Answer:** Both analysts recite the same resolution criteria without hesitation or qualification.
  *   **Action:** If they differ, rewrite the question on the screen until they match.
  *   **Exit Condition:**
      *   **Verdict:** If the definitions were fundamentally different (e.g., regional vs. specific port), fix the question, reset probabilities, and move to Step 2.
      *   **Route:** If definitions match, move to Step 2.
  *   **Judgment Call:** None. This is binary. Either they are betting on the same thing or they aren't.

  ### Step 2: The Information Audit (Private Data)
  *   **Question:** "What is the single piece of information that accounts for at least half the distance between your two numbers? Can you write it down and show the other person?"
  *   **Sufficient Answer:** A specific fact, source, or data point is identified.
  *   **Action:**
      *   If the info is shareable: The other analyst must acknowledge it and adjust their number immediately.
      *   If the info is *not* shareable (sources, classified, NDAs): The holder must state the *type* of source (e.g., "government insider" vs. "industry contact") without revealing content.
  *   **Exit Condition:**
      *   **Verdict:** If the gap is entirely explained by non-shareable info held by one side, **stop**. You cannot force common knowledge. Proceed to "Split Verdict" (see below).
      *   **Route:** If info is shared or the gap remains after sharing, move to Step 3.
  *   **Judgment Call:** **High.** You must assess if the "non-shareable" claim is legitimate or a shield for weak reasoning. If you suspect sandbagging, override and demand the logic, not the source.

  ### Step 3: The Starting Line (Priors)
  *   **Question:** "Before you read this week's news, what was the base rate for this event? Where did you start before you updated?"
  *   **Sufficient Answer:** A specific percentage or historical frequency (e.g., "Hikes happen 40% of the time in this cycle").
  *   **Action:** Compare the starting points.
      *   *Note on Predecessor's Trick:* If you declare an official shared prior here (e.g., "We use the 20-year average"), you are imposing a constraint, not diagnosing a belief. It standardizes the input but does not fix broken processing.
  *   **Exit Condition:**
      *   **Verdict:** If priors differ wildly and neither can justify theirs with data, **Editor Decision.** Pick the one backed by data.
      *   **Route:** If priors are roughly aligned (within 10%), move to Step 4.
  *   **Judgment Call:** **Medium.** You decide if a prior is "reasonable."

  ### Step 4: The Update Logic (Rationality Check)
  *   **Question:** "Take your starting number. Walk me through the one update that moved you most. What would have to happen for you to move your number back to the starting point?"
  *   **Sufficient Answer:** A coherent link between the new info and the probability shift.
  *   **Action:** Listen for incoherence. (e.g., "I moved up 20% because of this speech," but "I wouldn't move down if the speech was opposite.")
  *   **Exit Condition:**
      *   **Verdict:** If one analyst cannot describe what would change their mind, they are not updating; they are anchoring. **Editor Decision.** Default to the analyst who can describe their exit condition.
      *   **Route:** If both update coherently but still disagree, move to Step 5.
  *   **Judgment Call:** **High.** This is where you detect "vibes" vs. logic. You are judging cognitive coherence.

  ### Step 5: The Aggregation (The House Number)
  *   **Question:** "Given what you now know about each other's reasoning, does the gap feel like noise or signal?"
  *   **Sufficient Answer:** A willingness to move toward a weighted average or a specific argument for why the average is wrong.
  *   **Action:**
      *   If the disagreement is "noise" (same info, same priors, slight interpretation diff): **Average them.** (Weighted toward the analyst with better track record on this topic).
      *   If the disagreement is "signal" (fundamental model difference): **Editor Decision.** Pick the model that fits the current context better.
  *   **Exit Condition:**
      *   **Verdict:** Publish the number.
      *   **Route:** If Step 2 triggered a "Split Verdict," publish the range with a footnote.
  *   **Judgment Call:** **High.** This is your job. You are the tie-breaker.

  ***

  ### Verdict on the Predecessor's Trick
  **Declaring an official shared prior at the top of the session.**

  **Diagnosis:** It is a **legitimate operational constraint**, but a **theoretical cheat**.
  *   **Why it helps:** It removes one variable (Step 3) from the equation, saving time. It forces analysts to argue about *evidence* rather than *worldview*.
  *   **Why it's a cheat:** Aumann's theorem requires priors to be common knowledge *naturally*, not by fiat. If an analyst genuinely believes the world has changed structurally (e.g., "The old 20-year base rate doesn't apply because of AI"), forcing them to use the old rate creates a "zombie prior." They will nod, use the number, but secretly discount it, leading to hidden divergence in Step 4.
  *   **Recommendation:** Keep the trick, but add a caveat: "Use the official base rate *unless* you can demonstrate a structural break in the data." This prevents the zombie prior problem.

  ***

  ### Case Studies

  #### Case 1: The Armistice (20% vs. 60%)
  *   **Step 1 (Definition):** Both agree on "Signed before end of Q3." **Pass.**
  *   **Step 2 (Info):** Analyst B (60%) cites "back-channel conversations." Analyst A (20%) cites public statements. Analyst B states she is contractually forbidden to share the content or characterize the source.
      *   *Diagnosis:* This is **Private Information**. Common knowledge is impossible. Aumann's conditions for forced agreement are *not met*.
      *   *Editor Judgment:* You must verify B's credibility. Have her sources been right before? If yes, the info is real but non-transferable.
  *   **Step 3 (Priors):** Irrelevant. You cannot update on info you don't have.
  *   **Step 4 (Logic):** Analyst A is rational given public info. Analyst B is rational given private info. Neither is wrong.
  *   **Step 5 (Aggregation):** You cannot average these. Averaging implies A has seen B's info and discounted it, or B has seen A's info and discounted it. Neither is true.
  *   **Termination:** **Step 2 Exit (Split Verdict).**
  *   **Publish:** **Do not publish a single number.** Publish "20% (Public Baseline) – 60% (Intelligence Adjusted)" with an internal note that the divergence is due to protected sources.
  *   **The "Hate" Outcome:** You know your boss will hate this. They want a single digit. But publishing "40%" here is a lie. It implies a consensus that doesn't exist and dilutes the value of B's source while inflating A's ignorance.
  *   **Risk of Misfire:** In the room, Analyst A will feel punished for not having sources. Analyst B will feel pressured to reveal too much. You must hold the line that *some* disagreements are structural features of the business, not bugs.

  #### Case 2: The Central Bank (70% vs. 30%)
  *   **Step 1 (Definition):** Both agree on "Hike in June." **Pass.**
  *   **Step 2 (Info):** Both confirm they have the identical packet. No private sources. **Pass.**
  *   **Step 3 (Priors):** Both cite the identical 20-year base rate. **Pass.**
  *   **Step 4 (Logic):** The gap is entirely in the interpretation of the Governor's last paragraph.
      *   *Editor Judgment:* This is the **Rationality Check**. Ask: "If the paragraph was deleted, where does your number go?"
      *   If both say "Back to 50%," then the paragraph is the sole delta.
      *   Ask: "Is there any interpretation of that paragraph that supports the *other* person's view?"
      *   If Analyst A (70%) says "No, it's clearly hawkish," and Analyst B (30%) says "No, it's clearly boilerplate," one of them is suffering from **Motivated Reasoning**. They are treating ambiguous data as certain.
  *   **Step 5 (Aggregation):** Since info and priors are identical, Aumann says they *should* agree. The fact that they don't means one is processing incorrectly.
  *   **Termination:** **Step 5 Exit (Editor Decision).**
  *   **Publish:** **50%.**
  *   **Reasoning:** When two rational agents with identical info/priors disagree on the *weight* of ambiguous evidence, the most rational position is to recognize the ambiguity. The market is pricing in a binary outcome; your shop should price the uncertainty. Do not split the difference (50% is the split, but frame it as "Uncertainty Premium").
  *   **Risk of Misfire:** Analysts will feel you didn't listen. You must explain: "You both treated ambiguous text as a signal. Until the text is clearer, the signal is noise."

  #### Case 3: The Strike (65% vs. 15%)
  *   **Step 1 (Definition):**
      *   Analyst A: "Strike in the region."
      *   Analyst B: "Strike at Port X."
      *   *Diagnosis:* **Event Mismatch.**
  *   **Action:** Stop the clock. Rewrite the question.
      *   Option A: Narrow to Port X.
      *   Option B: Widen to Region.
  *   **Termination:** **Step 1 Exit (Verdict).**
  *   **Publish:** **Question Withdrawn/Revised.**
  *   **Reasoning:** You cannot reconcile numbers on different events. If you force a number now, you are scoring them on different tests.
  *   **Risk of Misfire:** Low. This is the easiest fix. The risk is embarrassment that this wasn't caught during the drafting phase. Use this to tighten your intake process for next cycle.

  ***

  ### Summary of Judgment Calls (Where you can't hide)
  1.  **Step 2 (Info):** Deciding if a "confidential source" is real or a bluff. If you call them on it wrong, you lose trust. If you don't, you publish garbage.
  2.  **Step 4 (Logic):** Deciding if an analyst is "anchoring" or just "cautious." This requires knowing their psychological profile, not just their math.
  3.  **Step 5 (Aggregation):** Deciding when to average vs. when to pick a side. Averaging is safe but lazy. Picking a side is risky but builds reputation.

  **Final Note:** In Case 1, you will be tempted to average to 40% to save your skin with the boss. Don't. That is how forecasting shops die—by confusing *compromise* with *accuracy*. If the disagreement is rational (private info), the House Number must reflect the range, even if it looks messy.
