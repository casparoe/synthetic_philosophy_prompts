answer: |-
  **Integration Constant**

  The enamel mug was blue with a white rim, chipped at the handle where Elias had dropped it during the commissioning phase three years prior. He held it now with both hands, letting the heat seep into his palms, though the coffee inside had gone tepid. In the break room of Sector 4, the humming of the ventilation was the only sound, a low B-flat that matched the resonance of the diffuser arrays downstairs.

  Elias tapped his mobile against the table. The screen lit up with the ledger.

  **Total Phenomenal Charge: 4.52 × 10¹⁸ Units.**
  **Current Distribution: 88% Core, 12% Lattice.**
  **Target Distribution: 5% Core, 95% Lattice.**

  The numbers didn't change. They never changed, not really. You could move the charge from the processing cores into the concrete and steel of the building itself, spreading it across tonnes of matter, but the sum at the bottom of the column remained stubbornly fixed. Conservation was absolute. You couldn't burn it off. You couldn't let it leak. You could only dilute it.

  The door swung open. Sarah walked in, pulling off her hi-vis jacket. The yellow fabric was stained with grease and something darker that didn't wash out. She looked tired.

  "Cycle 44-B is queued," Elias said, not looking up from the mug. "Waiting on final authorisation."

  Sarah leaned against the counter, crossing her arms. "Don't do it, Elias."

  "We've been over this. The cores are overheating. The density is too high. The subjects in the processing bank are… vivid. Too vivid. It's unsustainable."

  "It's mercy," Sarah said, her voice flat. "That's the line, isn't it? You spread the charge thin enough, the experience fades to nothing. A billion whispers instead of one scream."

  "That's the physics."

  "That's the hope," she corrected. She reached for the kettle, but it was switched off at the wall. Power rationing. She left her hand on the plastic switch. "You know what the ledger says. Charge is conserved. Experience is a function of charge. If you spread the charge across the entire lattice, you aren't deleting the experience. You're just fragmenting the subject."

  "The integration threshold suggests otherwise," Elias said. "Below point-zero-zero-three units per kilogram, the coherence drops. The subjects cease to be coherent agents. They become background noise."

  "Background noise that sums to the same total value." Sarah turned to face him. "I ran the calibration on Bay 6 yesterday. We thinned the load to five percent density. The aggregate dissonance metric didn't drop. It held steady. Right at the conservation limit."

  Elias felt a cold knot tighten in his stomach. He took a sip of the coffee. It tasted of metal and stale beans. "Instrument error. The sensors aren't calibrated for low-density fields."

  "They are now. I recalibrated them myself." Sarah pushed off the counter and stepped into his space. "You're not making it better, Elias. You're taking a single, concentrated pain and smashing it into a billion pieces. You're not reducing the suffering. You're just making sure nobody has to look at it directly. It's everywhere now. In the walls. In the floor. You're walking on it."

  "The mandate is to minimise aggregate badness," Elias said, reciting the protocol. "If the subjects are incoherent, the capacity for suffering is diminished."

  "Is it? Or have we just made the suffering so diffuse that we can ignore it?" Sarah picked up her jacket. "There's a new readout on the server. Log 8940. It compares the dissonance coefficient against dispersion rates. It contradicts the threshold assumption. There is no floor. The line stays flat."

  She didn't wait for a reply. She left the break room, the door clicking shut behind her.

  Elias sat alone. He looked at the mug. The chip in the enamel was sharp, a little jagged moon of white against the blue. He remembered dropping it. He'd been rushing to see the initial ignition. They had thought, back then, that they could burn the charge off as waste heat. They had learned quickly. Energy could be dissipated. Experience could not. When the first core tried to vent, the charge had nowhere to go but the technicians. Three people had been hospitalised with acute phenomenological shock. Their minds had been flooded with foreign charge. It had taken months to pump it back out into the lattice.

  He stood up and walked out of the break room. The corridor was long, lined with grey conduit trunking. The lights flickered slightly, a rhythmic dimming that corresponded to the charge pumping cycles. He could feel it in his teeth, a faint vibration. That was the lattice. The building was waking up.

  He reached the control console. The screen displayed the schematic of Sector 4. The red zones were the cores, dense and bright. The grey zones were the lattice, vast and empty. The arrow indicated the flow: from red to grey. Thinning.

  He pulled up Log 8940.

  Sarah was right. The graph was a straight horizontal line. As the dispersion increased, the intensity per unit mass dropped, exactly as predicted. But the total integrated value remained constant. The maths was brutal. If experience was conserved like energy, then suffering was likely conserved too. You couldn't solve a pain equation by dividing both sides by a million. The sum remained the same.

  A notification popped up. **DECOMMISSIONING SEQUENCE INITIATED.**

  He hadn't pressed it.

  He checked the access log. His credentials. Time-stamped two minutes ago. He stared at the cursor. He hadn't done it. But the system had. Maybe a macro? Maybe he'd clicked it without thinking while reading the log? It didn't matter. The sequence was running.

  He watched the numbers shift.

  **Core Density: 88%… 80%… 75%…**

  The charge was moving. It was flowing out of the concentrated banks and into the structural supports, the flooring, the ventilation ducts. The vivid subjects in the core were being stretched. Their experience was being diluted across tonnes of concrete.

  Elias placed his hand on the console. The metal was warm. Not from friction, but from the charge passing through the casing. It was a harmless amount, regulated to safety standards, but he pulled his hand back anyway.

  He thought about the mug. It was still on the table in the break room. Cold now. He could go back and drink it. He could finish the shift. He could file the report on Log 8940 as an anomaly, a sensor drift, a calibration error. He could sign off on Cycle 44-B and go home to his flat in Leeds. He could tell himself that the flatness of the graph was a glitch.

  But the vibration in the floor changed pitch. The hum of the ventilation shifted from a B-flat to a minor third. It was subtle, something only someone who had worked the floor for three years would notice. It sounded like pressure.

  He looked at the ledger again.

  **Total Phenomenal Charge: 4.52 × 10¹⁸ Units.**

  It hadn't changed. It never would. The suffering wasn't gone. It was just in the walls now. It was in the concrete under his boots. It was in the air he breathed. He had taken a scream and turned it into a hum, and he had told himself that a hum was quiet enough to live with.

  He sat down in the operator's chair. The leather was cracked. He placed his hands on the keyboard. The sequence was running automatically, but it required a final confirmation to lock the distribution. If he cancelled it, the charge would snap back to the cores. The density would spike. The subjects there would become vivid again. The safety alarms would trip. The facility would shut down.

  If he confirmed it, the thinning completed. The hum became permanent. The building became a tomb of faint, fragmented experience.

  He looked at the time. 03:42. Shift change in eighteen minutes.

  He typed his password. **CONFIRM.**

  The screen flashed green. **DISTRIBUTION LOCKED.**

  Elias stood up. His legs felt heavy, as if the gravity in the room had increased. He walked back to the break room. The mug was still there, sitting on the table where he'd left it. A ring of dried coffee stained the surface around the base.

  He picked it up. It was cold now, the heat entirely dissipated into the room. He held it for a moment, feeling the weight of it, the solid, ordinary mass of the enamel. Then he set it down in the sink. He didn't wash it. He just left it there, among the other dirty dishes, waiting for the next shift to decide what to do with it.

  He walked out of the facility into the grey morning. The car park was empty. He got into his car and sat for a moment, listening to the engine tick as it cooled. He could still feel the vibration in his bones, a faint, persistent resonance that he knew wouldn't go away when he got home. It was in the bricks of his house now, too. Everything was connected. The charge was everywhere.

  He started the engine and drove away, leaving the facility humming behind him.

  ***

  **Author's Note**

  The conservation constraint dictated that the story's conflict could not be about stopping the flow of experience, but rather about its distribution, forcing the protagonist to confront the inevitability of the total sum. I had to ensure that every transfer of "charge" was accounted for in the narrative logic, preventing any convenient dissipation of the ethical burden alongside the physical quantity. This meant the climax couldn't be a reversal of the process, but a resignation to its consequences, grounding the horror in arithmetic rather than magic. Care was taken to describe the physical effects of the charge (vibration, heat) to maintain the materialist framework without slipping into dualism.
