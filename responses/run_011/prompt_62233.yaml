  ### Limits of the Procedure

  **1. Competence is not Risk.**
  The ladder classifies *how* a system knows what to do, not *what happens* if it is wrong. A Darwinian system (Tier B) that controls a main breaker is higher risk than a Gregorian system (Tier C) that drafts emails. This procedure does not weigh consequence severity; it must be paired with your existing Hazard Analysis.

  **2. The "Surprise" Blind Spot.**
  You expect the ladder to justify promoting the Deterministic Solver to Tier C because it "cannot surprise us." The ladder contradicts this. A Darwinian system cannot surprise you with *new* behavior, but it can surprise you with *catastrophic* behavior in a novel environment it wasn't designed for. If you promote the Solver to Tier C based on this procedure, you are asserting that your network topology will never present a state outside its 2021 design parameters. This is a factual claim about the grid, not the software.

  **3. Impact on Installed Base.**
  If you accept the Deterministic Solver as Tier C solely because it is Darwinian, you must immediately re-evaluate the roughly thirty solver-based systems currently at Tier B. By the logic of this ladder, they are all Darwinian. If one is promoted, all are candidates. If you do not promote them, you must articulate why *this* solver is formally verified and the others are not. The ladder forces consistency; it does not allow exceptions for "feeling safe."

  **4. The Ensemble Gap.**
  As noted in Case 2/Ensemble, the ladder struggles with nested autonomy. A Gregorian system calling a Skinnerian system is treated as Skinnerian. This is conservative. It may stifle innovation where a high-level agent supervises a low-level learner. The procedure assumes the supervisor cannot perfectly constrain the learner. If you believe a Gregorian supervisor can safely cage a Skinnerian learner, that is a value judgment for the Director of Operations, not a finding for this Panel.

  **5. Untouched Questions.**
  This procedure does not address:
  *   **Adversarial Robustness:** Can an attacker trick the Popperian model or Gregorian scaffold?
  *   **Supply Chain:** Where did the Gregorian tools come from?
  *   **Explainability:** Can the engineer understand *why* the Popperian system chose a hypothesis?

  The ladder tells you where the trials happen. It does not tell you if you can afford the cost of the ones that fail.
