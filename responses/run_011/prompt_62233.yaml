answer: |-
  ### Autonomy Review Procedure: Competence Origin Protocol

  **Purpose:** To classify software systems based on the origin of their competence and the location of their trial-and-error processes, rather than solely on their ability to modify code post-deployment. This procedure translates Dennett's evolutionary ladder into engineering controls.

  **Participants:** Panel Chair, Control Engineers, Safety-Case Writer.
  **Duration:** 90 minutes per request.
  **Input:** Vendor packet (max 25 pages), Safety Case, Live Demo (optional).

  #### Step 1: Define the Deployment Domain
  Before assessing the system, the Panel must define the specific **Task Domain**. A system may occupy different rungs in different contexts (e.g., a scheduler is Popperian in planning but Darwinian in execution).
  *   **Action:** Write a one-sentence boundary for the classification (e.g., "Feeder reconfiguration during peak load," not "Grid management").
  *   **Sufficient Answer:** The domain must specify the physical assets affected, the time horizon of decisions, and the cost of failure.
  *   **Termination:** If the vendor cannot define the domain, the request is rejected. Classification is void without a bounded context.

  #### Step 2: Locate the Trials (The Skinnerian Filter)
  Determine where the system performs trial-and-error to improve or select actions.
  *   **Question:** "When this system makes a mistake, does it learn from the physical consequence, or does it discard the option before acting?"
  *   **Sufficient Answer:**
      *   *Real-World Trial:* The system updates its policy/weights based on live operational outcomes (voltage deviations, crew arrival times). **(Stop: Default Tier A)**.
      *   *Internal/Simulated Trial:* The system evaluates options against a model or constraint set before outputting a command. **(Proceed to Step 3)**.
  *   **Demo Limitation:** A vendor demonstration cannot establish this. A demo is a single successful trial. It proves the system *can* work, not *where* it tests its limits. Do not accept demo success as evidence of safety.

  #### Step 3: Locate the Competence (The Darwinian/Popperian Split)
  Determine if the system's decision logic is fixed at design time or generated dynamically.
  *   **Question:** "Is the logic governing this decision hardcoded/compiled, or is it generated at runtime by searching a solution space?"
  *   **Sufficient Answer:**
      *   *Fixed (Darwinian):* The logic is immutable code. It cannot generate novel strategies, only apply pre-written rules. **(Default Tier B)**.
      *   *Generated (Popperian):* The system runs internal simulations or searches to find a solution that fits constraints. It discards bad hypotheses internally. **(Default Tier B)**.
  *   **Note:** For classification purposes, Darwinian and Popperian are collapsed into Tier B. Both avoid fatal trials in the wild. The distinction is lost: we treat a fixed rule the same as a simulated search. We lose the ability to detect when a Popperian system's internal model drifts from reality.

  #### Step 4: Identify External Scaffolds (The Gregorian Filter)
  Determine if the system relies on tools, documents, or agents outside its own boundary to make decisions.
  *   **Question:** "Does this system read documents, call APIs, run scripts, or query humans to complete its task?"
  *   **Sufficient Answer:**
      *   *No:* Competence is internal. **(Remain Tier B)**.
      *   *Yes:* Competence is distributed across a scaffold. **(Default Tier C, subject to Step 5)**.
  *   **Risk:** Gregorian systems inherit the risk of their tools. If the scaffold changes, the system changes.

  #### Step 5: Verify the Scaffold (The Tier C Gate)
  A system cannot be Tier C (Post-fact review only) unless its scaffolds are controlled.
  *   **Question:** "Who can change the documents, code, or agents this system relies on, and how are those changes validated?"
  *   **Sufficient Answer:**
      *   *Uncontrolled:* External agents or documents can change without the vendor's knowledge. **(Demote to Tier B)**.
      *   *Controlled:* All scaffolds are versioned, validated, and within the utility's change management process. **(Confirm Tier C)**.
  *   **Values Hand-off:** If the scaffold is controlled but the consequence of failure is catastrophic (e.g., widespread blackout), the decision to accept Tier C is a value judgment, not a technical one. This decision is escalated to the Director of Operations.

  #### Step 6: Re-classification Triggers
  Classification expires automatically if:
  1.  **Scaffold Drift:** Any external document, API, or agent accessed by a Gregorian system is updated.
  2.  **Domain Shift:** The physical network topology changes such that a Darwinian/Popperian system's fixed rules or internal model no longer cover the state space.
  3.  **Reward Change:** The objective function for any Skinnerian component is altered.
  *   **Action:** These events oblige the Panel to re-run the classification without a new vendor request.

  #### Step 7: The Ensemble Rule
  If System X calls System Y, the ensemble is classified by the **most hazardous trial location** of any component.
  *   **Rule:** A Gregorian orchestrator calling a Skinnerian learner is treated as Skinnerian (Tier A). The ability to delegate does not sanitize the risk of the delegate.

  ***

  ### Table 1: Rung-to-Tier Mapping

  | Rung | What a system at this rung can do | Where its trials are performed | The failure mode the panel should expect | Default Tier | What must be demonstrated to move above the default |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Darwinian** | Execute fixed responses built at design time. No learning, no internal search. | Design time (Natural Selection of code). | **Brittleness:** Catastrophic failure in novel environments not covered by rules. | **B** | Formal Verification proving rules cover all possible states (moves to C). |
  | **Skinnerian** | Learn by consequence. Update policy based on rewards/penalties from the world. | **The Real World.** | **Fatal Trials:** The system must break something to learn not to break it. | **A** | None. Real-world learning on critical infrastructure is not permitted for execution. |
  | **Popperian** | Generate candidate actions internally. Discard bad options before acting. | Internal Model / Simulation. | **Model Error:** The simulation differs from reality; "safe" actions are actually unsafe. | **B** | Validation that the internal model tracks reality within bounded error (moves to C). |
  | **Gregorian** | Recruit external scaffolds (tools, docs, agents) to extend competence. | Distributed across tools and agents. | **Scaffold Drift:** External tools change behavior, breaking the system's assumptions. | **C** | Proof that all external scaffolds are under change control and versioned. |

  **Collapsed Distinction:** **Darwinian and Popperian are collapsed into Tier B.**
  **Loss:** The Panel loses the ability to distinguish between a system that is *fixed* (Darwinian) and one that is *adaptive but contained* (Popperian). We treat a hard-coded rule the same as a planner that searches for solutions. This is efficient but risks underestimating Popperian systems where the internal model may drift, whereas Darwinian code does not drift (though the world does).

