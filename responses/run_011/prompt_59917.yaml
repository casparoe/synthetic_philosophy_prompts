prompt: |-
  I cover science and ideas for a general-interest magazine, and I am currently reporting a piece on why two Western legal systems that agree about nearly everything else in reproduction end up with almost opposite answers to the question of who a child's parents are. I want the underlying philosophy laid out properly rather than the usual set of talking points, and I have no access to specialist literature while I'm drafting, so I would rather you reason from the practices exactly as I describe them than direct me anywhere.

  The material I am working with is this. French civil law provides that any agreement concerning procreation or gestation on behalf of another is null and void, and separately that maternal filiation is established by the designation of the mother in the child's birth certificate — in effect, the woman who gives birth is the mother. That second principle is what makes anonymous egg donation legally invisible in France: because the donor never gives birth, the birth rule never engages against the recipient, and the woman who carries the pregnancy becomes the child's legal mother automatically, while the donor acquires no status whatsoever. The same principle is what defeats French intended parents who arrange a surrogacy abroad: the surrogate gave birth, so on the French view she is the mother, and their agreement is a nullity. Under pressure from the European Court of Human Rights, the French courts have nonetheless settled on recording the child's legal link to the biological father while leaving the intended mother's status to be constructed by adoption, a process that can take years and that leaves the child, in the interim, with one recognised parent.

  Italy has gone further. A 2024 statute amended its 2004 assisted-reproduction law so that Italians who arrange a surrogacy abroad can be prosecuted at home, on the reasoning that the offence is punishable wherever it was committed.

  California represents the opposite architecture. A gestational carrier agreement is enforceable; a court issues an order before the birth declaring the intended parents to be the child's legal parents whether or not either is genetically related to the child; no adoption is required; and both eggs and gestation are openly bought and sold, in a market that supplies intended parents from countries where the practice is banned.

  With that in front of you, I would like the following reconstructed.

  First: what does each architecture presuppose about what makes someone a parent — genetic connection, gestation, intention, the contract, or the state's own act of recognition? Please name the criterion each system actually relies on at the points where the criteria come apart, and pay particular attention to the fact that France appears to use gestation against the intended mother while using genetics in favour of the intended father.

  Second, the asymmetry I find hardest to explain to readers: the birth principle quietly validates compensated egg donation and invalidates compensated surrogacy, so that a woman may sell an egg but may not sell nine months of gestation. Does the practice require a substantive premise about which human capacities are inalienable — something about the difference between transferring a cell and having one's body occupied under contract — or is the philosophical work actually being done by something less principled, such as the enforceability of a contract against a person's body, the visibility of the market, the sheer difficulty of policing conduct abroad, or the fact that a surrogate is still present to be interviewed while a donor is not? Reconstruct the implicit theory, and be explicit about what the practice strictly presupposes as against what it merely fits comfortably with.

  Third: what does the French settlement — nullity abroad, partial recognition at home — presuppose about whose interests the ban serves? If the ban protects the surrogate, the visible costs fall on the child, whose legal identity is what gets delayed. If it protects the child, then recognising the father by genetics while refusing the mother looks arbitrary. Does the practice instead presuppose a third, expressive rationale — that certain transactions must not be given legal effect within the territory regardless of consequences for the people caught in them? Say whether that rationale can be held coherently alongside a legal system that everywhere else treats the child's interest as paramount.

  Fourth: what does extraterritorial criminalisation presuppose about the wrong in question — that it attaches to the actor's status as a citizen rather than to conduct within the state, and that it requires an identifiable victim somewhere abroad, or that it is the kind of wrong a state may prohibit without a victim at all?

  Fifth: what does the Californian model presuppose about persons — that parental status can be created by declaration and transferred by agreement? — and what does it thereby rule out, in particular the idea that parenthood is a status one finds oneself in rather than a right one acquires? Is that model consistent with the same jurisdiction's refusal to let people buy their way into adoption? If there is a principled line between paying a gestational carrier and paying a birth mother to relinquish, state it; if there is not, say so.

  Finally, tell me where these practices are philosophically underdetermined — where an inalienability view, a contractarian view, a care-ethics view, and a commodification-and-inequality view would all license the same rule, so that the law's choice is not in fact explained by any of them. And tell me what would have to change on the ground — who appears before a judge, what a registrar records, which party bears the risk when an arrangement collapses in the seventh month, what a child can learn at eighteen — if France and Italy adopted the Californian premise, or if California were made to adopt theirs.

  I am not looking for a survey of both sides, and I am not looking for a verdict on whether surrogacy should be legal. I want the implicit theories made explicit, the internal tensions located, and a flag anywhere that my description of the law is doing philosophical work I have misattributed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas journalist for a general-interest magazine.
      *   **Task:** Reconstruct the underlying philosophy of three legal architectures (France, Italy, California) regarding parenthood, surrogacy, and egg donation based *only* on the provided description of practices. No outside specialist literature.
      *   **Goal:** Explicitly state implicit theories, locate internal tensions, and identify where practices are philosophically underdetermined. Avoid taking a side on legality/morality.
      *   **Specific Questions:**
          1.  Criteria for parenthood (genetics, gestation, intention, contract, state). Address the French asymmetry (gestation vs. genetics).
          2.  The egg donation vs. surrogacy asymmetry (alienability of body parts vs. labor/presence).
          3.  French settlement (nullity abroad, partial recognition) -> whose interests? Expressive rationale vs. child's interest.
          4.  Italian extraterritorial criminalization -> nature of the wrong (status, victim, victimless).
          5.  Californian model -> personhood, status vs. right, consistency with adoption bans, line between gestational carrier vs. birth mother relinquishment.
          6.  Philosophical underdetermination & practical consequences of swapping systems.

  2.  **Deconstruct the Provided Material:**
      *   **France:**
          *   Agreements on procreation/gestation = null/void.
          *   Maternal filiation = birth certificate (woman who gives birth).
          *   Egg donation = invisible (donor doesn't give birth, recipient does).
          *   Surrogacy abroad = surrogate is mother (birth rule). Agreement void.
          *   Compromise (ECHR pressure): Recognize biological father (genetics), intended mother must adopt (delayed status).
      *   **Italy:**
          *   2024 statute: Prosecute Italians for surrogacy abroad (extraterritorial).
          *   Builds on 2004 assisted-reproduction law.
      *   **California:**
          *   Gestational carrier agreements = enforceable.
          *   Pre-birth order: Intended parents = legal parents (regardless of genetics).
          *   No adoption needed.
          *   Market: Eggs and gestation bought/sold openly.

  3.  **Drafting - Section by Section:**

      *   **Section 1: Criteria for Parenthood.**
          *   *France:* It's a hybrid. For the mother, it's strictly *gestation* (birth). For the father, when the birth rule conflicts with the ban on surrogacy, they pivot to *genetics* (biological link) to recognize the intended father, while blocking the intended mother (who has no genetic link usually, or is blocked by the birth rule applying to the surrogate). Wait, the prompt says "recognising the father by genetics while refusing the mother." This implies the intended father is often the genetic father. The intended mother is blocked because the surrogate is the birth mother. So, France prioritizes *Gestation* for maternity (inelastic) but allows *Genetics* for paternity as a fallback to protect the child's rights (ECHR).
          *   *Italy:* Similar to France on the definition (Gestation = Mother), but adds *Criminal Law* to enforce the definition extraterritorially. The criterion is *Gestation* backed by *State Prohibition*.
          *   *California:* *Intention* formalized by *Contract* and ratified by *State Order*. Genetics and Gestation are decoupled from legal status. The pre-birth order makes the state's act of recognition constitutive.
          *   *Tension:* France uses gestation to block the intended mother but genetics to help the intended father. This reveals a hierarchy: Gestation > Intention, but Genetics > Nullity (for the child's sake).

      *   **Section 2: Egg Donation vs. Surrogacy Asymmetry.**
          *   *Practice:* Egg donation allowed (compensated/invisible); Surrogacy banned (compensated/visible).
          *   *Philosophical Work:* Is it inalienability?
          *   *Analysis:* Egg = tissue/cell (separable). Gestation = bodily occupancy/integrity over time.
          *   *Strict Presupposition:* The law presupposes that a contract cannot govern the *use* of a body over time (surrogacy) but can govern the *transfer* of biological material (eggs).
          *   *Less Principled Factors:* Visibility. A donor disappears after retrieval. A surrogate is present for 9 months, visible, potentially coercible. Policing: Harder to police a clinic than a pregnancy.
          *   *Conclusion:* The practice strictly presupposes that *bodily integrity over time* is non-contractible, whereas *biological material* is alienable. It fits comfortably with visibility/enforceability, but the core philosophical line is the distinction between *having* (tissue) and *being* (pregnant body).

      *   **Section 3: The French Settlement (Nullity Abroad, Partial Recognition).**
          *   *Interests:* If it protected the child, why the delay/adoption hurdle? If it protected the surrogate, why punish the child's legal clarity?
          *   *Expressive Rationale:* The state must not validate the *transaction* within its legal order. It's about the integrity of the French Civil Code, not the specific welfare of this specific child.
          *   *Coherence:* Can this coexist with "best interests of the child"? Only if "best interests" is interpreted as "best interests of children *as a class* by deterring the practice," rather than the individual child before the court. This creates a tension: The individual child is sacrificed for the normative signal sent to the class.

      *   **Section 4: Italian Extraterritorial Criminalization.**
          *   *Presupposition:* The wrong is not just about harm within borders. It attaches to the *citizen's moral conduct* regardless of location.
          *   *Victim:* Does it require a victim? If it's a crime without a specific victim (like drug use or consensual incest in some jurisdictions), it's a *mala prohibita* based on public order.
          *   *Analysis:* It presupposes the wrong is *ontological* (violating the natural order of filiation) rather than *consequentialist* (harm to surrogate/child). It treats the intended parents as perpetrators of a status crime. It implies the state has jurisdiction over the *moral character* of its citizens abroad regarding family formation.

      *   **Section 5: The Californian Model.**
          *   *Personhood:* Parents are made, not found. Status is *acquired* via intention + contract.
          *   *Ruling Out:* It rules out parenthood as a "fate" or biological destiny.
          *   *Adoption Consistency:* Adoption bans on buying babies prevent *coercion of relinquishment*. Surrogacy contracts are signed *before* conception/pregnancy.
          *   *The Line:* The principled line is *timing of consent*. Paying a birth mother to relinquish *after* birth risks coercion (duress). Paying a carrier *before* conception is a service agreement.
          *   *If no line:* If one views the baby as the "product" in both, the line collapses. But legally, California distinguishes "service of gestation" from "sale of a child."

      *   **Section 6: Underdetermination & Practical Consequences.**
          *   *Underdetermination:* All systems claim to protect the child. All claim to prevent exploitation. The *rules* differ, but the *justifications* (protection, non-commodification) overlap. An inalienability view and a care-ethics view might both ban surrogacy but for different reasons (body integrity vs. relational harm).
          *   *Swapping Systems:*
              *   *France adopts California:* Registrars record intended parents immediately. Surrogates appear as "carriers" not mothers. Risk shifts: If intended parents divorce, who pays the carrier? (Contract law vs. Family law). Child learns at 18: "You were planned, not born."
              *   *California adopts France:* Registrars record birth giver. Intended parents must adopt. Risk: If surrogate keeps baby, intended parents have no standing. Child learns at 18: "Your legal mother wasn't your birth mother, and the law fought about it."

  4.  **Review and Refine:**
      *   *Tone Check:* Needs to be analytical, philosophical, not advocacy.
      *   *Constraint Check:* Did I use outside info? No. Did I answer all specific prompts? Yes.
      *   *Nuance Check:* Ensure the French "genetics for father" point is handled carefully. It's a pragmatic exception to the birth rule, not a full adoption of genetics.
      *   *Refining the "Underdetermination":* Make sure to highlight where different philosophies converge on the same rule (e.g., banning surrogacy could be feminist *or* traditionalist).

  5.  **Final Polish:** Organize with clear headings corresponding to the user's "First" through "Finally" structure. Ensure the language is precise ("constitutive," "expressive," "alienability"). (Self-Correction: Make sure to explicitly address the "visibility of the market" point in section 2 as requested).

  6.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a reconstruction of the implicit theories and internal tensions inherent in the three legal architectures you described, derived strictly from the practices you outlined.

  ### First: The Criteria of Parenthood

  Each system relies on a different constitutive act to establish filiation when the biological, gestational, and intentional facts diverge.

  **France** operates on a **Gestational Primacy** rule for maternity, tempered by a **Genetic Fallback** for paternity.
  *   **The Mother:** The law presupposes that motherhood is a physical event, not a social or genetic one. By tying filiation to the birth certificate, the system treats gestation as the不可 (inalienable) source of maternal status. This is why the egg donor is invisible (she did not gestate) and the surrogate is the legal mother (she did gestate).
  *   **The Father:** The French settlement you describe reveals a crack in the Gestational Primacy. By allowing the intended father to be recognized via genetics (biological link) while forcing the intended mother through adoption, the system admits that *genetics* can override *gestation* for men, but not for women.
  *   **The Tension:** This creates a sex-asymmetric theory of parenthood. For women, parenthood is somatic (of the body); for men, it can be biological (of the blood). The system refuses to recognize *intention* as a source of rights for the mother, but it allows *genetics* to function as a proxy for intention for the father.

  **Italy** operates on a **Prohibitive Statism**.
  *   **The Criterion:** Like France, it relies on **Gestation** to define the mother. However, it adds a layer: the State's prohibition is itself a criterion of validity. If the state forbids the arrangement, the arrangement cannot generate status, even if the gestational facts are identical to a permitted pregnancy.
  *   **The Difference:** Where France treats the surrogacy agreement as a *nullity* (civil law), Italy treats it as an *offence* (criminal law). The criterion for parenthood is not just "who gave birth," but "who gave birth within a lawful context."

  **California** operates on **Intentionalism formalized by Contract**.
  *   **The Criterion:** Parenthood is established by **Pre-conception Intent**, ratified by a **State Order**.
  *   **The Mechanism:** The pre-birth order is constitutive. It does not *transfer* rights from the surrogate to the parents; it declares that the parents *always were* the parents. Genetics and gestation are treated as services rendered to the intentional parents, not as claims to status.
  *   **The State's Role:** The state acts not as a gatekeeper of biological truth, but as a notary of private agreement.

  ### Second: The Egg vs. Gestation Asymmetry

  You ask whether the validation of compensated egg donation alongside the invalidation of compensated surrogacy requires a substantive premise about inalienability, or if it is driven by pragmatic enforcement.

  **The Strict Presupposition:**
  The practice strictly presupposes a distinction between **Alienable Tissue** and **Inalienable Bodily Occupancy**.
  *   **Egg Donation:** Treats the egg as a separable biological resource. Once removed, it no longer implicates the donor's bodily integrity. The transaction is a transfer of property (gametes).
  *   **Surrogacy:** Treats the pregnancy as a continuous state of bodily being. A contract for surrogacy is a contract for the *use* of a person's internal physiology over time.
  *   **The Theory:** The law presupposes that one can sell what one *has* (cells), but one cannot sell what one *is* (a pregnant body). To enforce a surrogacy contract is to enforce a claim on a person's bodily autonomy for nine months, which the French and Italian systems view as a form of slavery or servitude incompatible with human dignity.

  **The "Comfortable Fit" (Pragmatics):**
  While the inalienability theory explains the rule, the practice fits comfortably with **Visibility and Enforceability**.
  *   **Visibility:** An egg donor is anonymous and absent after retrieval. A surrogate is visibly pregnant and present. Policing the former is intrusive; policing the latter is observational.
  *   **Coercion:** It is easier to argue that a woman cannot meaningfully consent to nine months of medical risk under financial pressure than it is to argue she cannot consent to a minor surgical retrieval.
  *   **Conclusion:** The philosophical work is done by the **Body/Property distinction**. However, the *persistence* of the asymmetry is sustained by the fact that the egg market is invisible (hard to regulate) while the surrogate market is visible (easy to regulate). The law relies on the inalienability premise to justify the ban, but relies on the visibility of the surrogate to enforce it.

  ### Third: The French Settlement (Nullity Abroad, Partial Recognition)

  The French compromise—refusing to transcribe the birth certificate but eventually recognizing the father and allowing adoption for the mother—reveals an **Expressive Rationale** that conflicts with a strict **Best Interests of the Child** standard.

  **Whose Interests?**
  *   **Not the Surrogate:** The French courts do not intervene to protect the foreign surrogate; she is outside their jurisdiction.
  *   **Not the Individual Child:** If the child's interest were paramount, the delay in legal status (years of adoption proceedings) would be impermissible. The child is legally vulnerable during this interim.
  *   **The Class of Children:** The ban serves the interests of *children as a category*. By making the legal recognition of surrogacy-born children difficult, the state aims to deter the practice globally, theoretically protecting future children from being "produced" via contract.

  **The Expressive Rationale:**
  The practice presupposes that the State must not **Launder Illicit Transactions**.
  *   To transcribe the birth certificate would be to give legal effect to a contract that is void in France. The state prioritizes the **Integrity of the Civil Code** over the **Administrative Convenience of the Individual**.
  *   **Coherence:** This can only be held coherently if "the child's interest" is interpreted as "the child's interest in not being the subject of a prohibited trade." It requires accepting that the individual child bears a cost (legal uncertainty) to uphold a normative boundary (no surrogacy). If the system claims the child's interest is *always* paramount, this practice is incoherent. If it claims the child's interest is paramount *subject to public order*, it is coherent but admits that public order trumps the child's immediate security.

  ### Fourth: Italian Extraterritorial Criminalization

  Italy's move to prosecute citizens for acts committed abroad presupposes that the wrong is **Status-Based** and **Moral**, rather than **Territorial** or **Harm-Based**.

  **The Nature of the Wrong:**
  *   **Not Territorial:** Usually, crimes are punished where committed. By prosecuting acts abroad, Italy presupposes that the obligation follows the **Citizen**, not the **Border**.
  *   **Victimless or Abstract Victim:** If the crime required a specific, identifiable victim (e.g., the surrogate pressing charges), extraterritoriality would be difficult. By criminalizing the *arrangement* itself, Italy presupposes the wrong is **Ontological**. The violation is against the "natural order of filiation" or the "dignity of the human person," which exists regardless of geography.
  *   **Presupposition:** This implies that family formation is a matter of **Public Order** so fundamental that the state claims jurisdiction over the moral conduct of its citizens anywhere in the world. It treats the intended parents not merely as contract-breakers, but as perpetrators of a status crime against the state's definition of the family.

  ### Fifth: The Californian Model

  **Presuppositions about Persons:**
  *   **Parenthood as Achievement:** The model presupposes that parenthood is a **Legal Status Acquired by Will**, not a **Biological Fact Discovered**.
  *   **Separability:** It treats genetic material, gestational labor, and social parenting as separable components that can be recombined by agreement.

  **Consistency with Adoption Bans:**
  *   **The Line:** There is a principled line regarding **Timing of Consent**.
      *   **Adoption:** Paying a birth mother to relinquish *after* birth is banned because the consent is given under the duress of existing attachment and post-partum vulnerability. The child already exists; the market might coerce the mother to abandon an existing relationship.
      *   **Surrogacy:** Payment is for gestation *before* the child exists. The contract is signed pre-conception. The "product" is not the child, but the *service of carrying*.
  *   **If the Line Collapses:** If one views the end result (money changes hands, parents get baby) as identical, the distinction vanishes. But legally, California relies on the **Pre-conception Commitment** to distinguish a service contract from a sale of a person.

  **What it Rules Out:**
  *   It rules out the idea that parenthood is a "fate" one falls into. It mandates that parenthood is a **Project**.
  *   It implicitly rules out the right of the gestator to change her mind, as the pre-birth order assigns rights to the intended parents *before* the birth.

  ### Finally: Underdetermination and Practical Consequences

  **Where the Practices are Philosophically Underdetermined:**
  There are points where opposing philosophies yield the same rule, meaning the law does not reveal which philosophy is actually driving it.
  1.  **Banning Surrogacy:**
      *   **Inalienability View:** Bans it because the body cannot be rented.
      *   **Care-Ethics View:** Bans it because it commodifies the mother-child relationship.
      *   **Inequality View:** Bans it because it exploits poor women for rich parents.
      *   **Traditionalist View:** Bans it because it violates natural law.
      *   *Result:* All four license the French/Italian ban. You cannot tell from the ban alone which moral theory is operative.
  2.  **Permitting Surrogacy:**
      *   **Libertarian View:** Permits it based on bodily autonomy/contract freedom.
      *   **Utilitarian View:** Permits it because it maximizes happiness (parents get kids, carriers get paid).
      *   **Child-Centric View:** Permits it because being born to intending parents is better than not being born (or better than foster care).
      *   *Result:* All three license the California model.

  **What Would Have to Change on the Ground:**

  **If France adopted the Californian Premise:**
  *   **The Registrar:** Would no longer record the birth giver as the mother. They would record the holders of the pre-birth order.
  *   **The Judge:** Would shift from verifying biological truth (DNA/birth) to verifying procedural truth (was the contract signed freely?).
  *   **Risk Allocation:** If the arrangement collapses in the seventh month (e.g., intended parents divorce), the **Contract** dictates the outcome, not the **Family**. The carrier might be forced to terminate or continue based on the contract, whereas currently, she decides as the legal mother.
  *   **The Child at 18:** Would learn that their existence was the result of a secured transaction. Legal identity would be stable from birth, but the "truth" of birth would be legally secondary to the "truth" of intent.

  **If California adopted the French Premise:**
  *   **The Registrar:** Would record the surrogate as the mother.
  *   **The Judge:** Would preside over adoption hearings for *every* surrogacy case.
  *   **Risk Allocation:** If the arrangement collapses, the **Surrogate** holds all cards. She is the legal mother. Intended parents have no standing until adoption is finalized. The financial risk shifts entirely to the intended parents (paying for a pregnancy they might not keep).
  *   **The Child at 18:** Would learn that their legal mother was initially a stranger, and their social mother had to petition the state to claim them. Legal identity would be provisional for years.

  **A Flag on Your Description:**
  You describe the French system as using genetics "in favour of the intended father." Be careful not to over-read this as a general principle. The French courts allow this specifically to avoid leaving the child *stateless* or *parentless* (a violation of ECHR rights), not because they believe genetics define fatherhood in surrogacy cases. It is a **remedial exception**, not a **constitutive rule**. If the intended father is not the genetic father (e.g., donor sperm), the French courts face a much harder contradiction, often leaving the child with *no* legal parents initially. Your description holds for the specific cases you cited, but the philosophy is "Protect the Child from Statelessness" > "Uphold the Ban," rather than "Genetics Define Fatherhood."
