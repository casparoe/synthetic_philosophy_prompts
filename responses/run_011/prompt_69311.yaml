answer: |-
  Here is the disambiguation of your advisor's slogan, ordered by semantic commitment, followed by the payoff on the Oswald case.

  ### 1. The Menu of Theses

  **1. Strong Non-Factualism (Expressivism)**
  *   **Thesis:** Indicatives do not express propositions; they express high conditional credence. They are semantically incomplete regarding truth.
  *   **Load-Bearing Distinction:** Embedding. If indicatives lack truth conditions, *If A, B* cannot embed under negation, disjunction, or propositional attitude verbs without a complex "Frege-Geach" story (e.g., Blackburn, Gibbard). Negating an indicative isn't denying a truth, it's expressing an incompatible attitude.
  *   **Verdict:** **Substantive but costly.** It solves the triviality problem by changing the subject. The self-referential status of the thesis itself ("Indicatives have no truth conditions") is notoriously unstable (is *that* sentence factual?).
  *   **License for Advisor:** **Full.** On this view, asking "Is the Oswald indicative false?" is indeed a category mistake.

  **2. The Grice/Jackson Divergence (Propositionalism + Pragmatics)**
  *   **Thesis:** Indicatives *do* have truth conditions (usually material), but assertibility conditions diverge (high conditional probability).
  *   **Load-Bearing Distinction:** The "Paradoxes." On this view, the Oswald indicative is *true* (materially) because the antecedent is false. The intuition that it's "bad" to assert it is pragmatic, not semantic.
  *   **Verdict:** **Defensible but unpopular.** The "work" is explaining why speakers systematically ignore the truth conditions in evaluation. It saves bivalence but sacrifices the link between meaning and use.
  *   **License for Advisor:** **None.** On this view, your question is well-formed. The answer is "It's true (materially), but unassertible." Dismissing it as malformed is incorrect.

  **3. The Triviality Reading (Adams/Lewis)**
  *   **Thesis:** No truth-conditional proposition can satisfy the equation $P(A \to B) = P(B|A)$ for all probability functions.
  *   **Load-Bearing Distinction:** Scope of the impossibility. Lewis shows you can't have *standard* truth conditions that align with Adams' Thesis universally. It does not prove indicatives *lack* truth conditions, only that they can't be both truth-conditional and probabilistically transparent in the standard way. (Context-dependent propositions, e.g., Stalnaker, evade this).
  *   **Verdict:** **Substantive.** It motivates Non-Factualism but doesn't entail it. One can reject Adams' Thesis or accept context-sensitivity.
  *   **License for Advisor:** **Partial.** It motivates the slogan, but strictly speaking, it only rules out *certain kinds* of truth conditions, not the question of truth itself.

  **4. The Counterfactual Robustness Claim**
  *   **Thesis:** Counterfactuals express stable propositions (similarity semantics), unlike indicatives.
  *   **Load-Bearing Distinction:** CEM and Vacuity. As you noted, "having truth conditions" doesn't mean agreement on *which* ones. Stalnaker (CEM holds) and Lewis (CEM fails) both agree they have truth conditions, but disagree on the logic. Furthermore, if counterfactuals are strict conditionals, vacuous truth becomes an issue.
  *   **Verdict:** **Platitude within possible worlds semantics.** "Has truth conditions" just means "expresses a function from worlds to truth values." It buys you compositionality, not metaphysical depth.
  *   **License for Advisor:** **Irrelevant.** This half of the slogan bolsters the contrast but doesn't justify the indicative dismissal.

  **5. The Unified Modal (Kratzer)**
  *   **Thesis:** There is no conditional connective. *If*-clauses restrict a covert modal. Mood (indicative/subjunctive) selects the modal base (realistic vs. non-realistic).
  *   **Load-Bearing Distinction:** Truth-conditional parity. Both moods have truth conditions relative to a modal base. The difference is pragmatic/semantic selection of the base, not the presence/absence of truth conditions.
  *   **Verdict:** **Dominant in Linguistics.** The slogan is effectively false in this framework.
  *   **License for Advisor:** **Negative.** This framework explicitly validates your question. The truth value depends on the modal base fixed by the context.

  ### 2. The Payoff: Was your question malformed?

  **Short Answer:** No, not by the lights of current mainstream semantics.

  **Long Answer:** Your advisor is deploying **Thesis 1 (Strong Non-Factualism)**, likely motivated by **Thesis 3 (Triviality)**. Within that specific philosophical niche, he is technically entitled to wave off the question as a category mistake. If indicatives are not proposition-expressing, they cannot be false.

  However, in the broader context of formal semantics (especially the Kratzerian paradigm dominant in linguistics departments), the slogan is obsolete. Under the unified modal analysis, the Oswald indicative *does* have truth conditions relative to a realistic modal base. Since we know Oswald did shoot Kennedy, the antecedent is false in the actual world, making the conditional vacuously true (or undefined, depending on the quantifier), but certainly not "truth-valueless."

  **Strategic Advice:**
  Your question wasn't bad; the framework you're operating in is contested. If you want to pursue this without friction:
  1.  **Acknowledge the Non-Factualist commitment:** "I understand that on an expressivist reading, truth-value questions are misplaced..."
  2.  **Pivot to the linguistic data:** "...but given the embedding behavior of indicatives in *that*-clauses and under negation, can we motivate the category mistake claim without losing compositionality?"
  3.  **Check the Mood:** The Oswald case is a "past indicative." Some theorists (Stalnaker included) argue that past indicatives with false antecedents *shift* to counterfactual semantics. If your advisor thinks the Oswald sentence is secretly a counterfactual in disguise, he might think you're asking a truth-conditional question about a sentence he thinks *is* truth-conditional, but you're labeling it "indicative" to force the non-factualist block.

  If you are in a Linguistics department, the Kratzerian view (Thesis 5) is the default. Your advisor is importing a specific Philosophy of Language constraint that is not required by the semantics. You are on solid ground insisting that indicatives have truth conditions, provided you allow those conditions to be modal-base relative.
