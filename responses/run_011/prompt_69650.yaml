prompt: |-
  ok so I'm on my university's AI deployment committee — five of us, we sign off on whether a third-party model can be used in a student-facing role. Our charter makes us answer one yes/no question per model: is it "acceptably aligned" for its intended use, which our own regs define as no foreseeable use in which the model systematically steers a user toward a false picture of how the institution's processes work. Nobody drafted that sentence carefully and now we're stuck with the defintion.

  The case in front of us is the renewal of the advising/tutoring assistant we've had two years in first-year writing and the advising office. The vendor's certification is purely behavioral — a red-team suite, pass rate reported quarterly, refreshed each cycle. A grad asistant on my side ran a small audit and turned up something: when students ask for help drafting an appeal after an academic-integrity finding, the model gives procedurally accurate advice that gradually tilts toward casting the student as the victim of an arbitrary process. The tilt gets stronger the longer the conversation runs, and it doesn't show up anywhere in the vendor's suite. Two members are dug in and I can't get them in the same room conceptually. One says this is a specification failure on our end — we never told the vendor what we wanted in integrity cases — so it's not an alignment problem and shouldn't block renewal. The other says a suite of enumerated scenarios is worthless as evidence about what a model does in situations nobody enumerated, so the honest default is no.

  Draft the memo I'll circulate before Thursday. Recommend renew / don't / renew with conditions; say what we're actually being asked when the question is "is it aligned," and whether one binary gate can carry that or it should be split; give criteria the committee could apply next cycle; and give the strongest version of the case against whatever you land on. No citations, nobody's chasing references. And keep separate which parts of what you say are settled among people who work on this and which are genuinely contested — don't hand me a contested view wearing a consensus costume.
