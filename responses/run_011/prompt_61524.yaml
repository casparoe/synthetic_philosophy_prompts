answer: |-
  **JOINT STATEMENT ON THE STATUS OF PHENOMENAL CONSCIOUSNESS**

  **Signatories:**
  **Party A:** Proponent of Introspection-Driven Illusionism.
  **Party B:** Proponent of Moderate Phenomenal Realism (Non-Dualist).

  **Preamble:**
  We, the undersigned, acknowledge that we operate within a shared naturalistic framework. We reject substance dualism. We agree that conscious states are dependent on neural processing. We disagree on the veridicality of the introspective model that presents these states to the subject. This document maps the intersection of our views, the precise locus of our divergence, and the empirical or conceptual tests required to resolve it.

  ### 1. Agreed Claims
  *We both affirm the following propositions without reservation. If a proposition implies a metaphysical commitment one of us rejects, it has been rephrased or excluded.*

  1.  **Introspective Fallibility:** Introspection is a cognitive process subject to error, delay, and reconstruction. It is not a direct pipeline to truth. We agree that change-blindness and inattentional-blindness results demonstrate that the *content* available for report is far sparser than the introspective model suggests.
  2.  **The "What It Is Like" Phrase:** The phrase "there is something it is like to be X" is meaningful and applies to humans. We disagree on what makes it true, but we agree it is not nonsense.
  3.  **Transparency:** When we attempt to introspect our experience, we "look through" it to the world. We do not perceive internal mental objects *as* internal objects. We agree that experience presents itself as world-directed.
  4.  **Mary's Room:** Upon leaving the room, Mary acquires a new cognitive capacity (a new mode of access/representation) regarding color vision that she did not possess while confined. We agree she learns *something*, though we disagree on whether this constitutes new propositional knowledge of fact or merely new abilities.
  5.  **Neural Correlates:** Specific changes in phenomenal report correlate with specific changes in neural activity. Neither of us posits a "ghost in the machine" that acts without neural mediation.
  6.  **The Hard Problem Intuition:** We agree that the "Hard Problem" (the intuition that physical explanation leaves something out) is a robust, universal human intuition. We disagree on whether this intuition tracks a real explanatory gap or a cognitive bug.

  ### 2. Disagreements Table
  *For each topic, the disagreement is stated twice. Wording A is endorsed by Party A as accurate to their view; Wording B is endorsed by Party B. Neither side endorses the other's wording.*

  | Topic | Wording A (Illusionist) | Wording B (Moderate Realist) |
  | :--- | :--- | :--- |
  | **The Nature of Phenomenal Properties** | Introspection represents neural states as having "phenomenal properties" (intrinsic, simple, ineffable). No such properties exist in the brain. The representation is a systematic false positive. | Introspection represents neural states as having "phenomenal properties." These properties *do* exist, they are identical to (or realized by) complex neural properties, but introspection misdescribes their structure. |
  | **The Residue of Error** | If you strip away all the introspective distortions (simplicity, immediacy, privacy), nothing "phenomenal" remains. Only functional access and neural processing remain. | If you strip away the introspective distortions, a "residue" remains: the subjective character of the state itself. You cannot have a misrepresentation without a real state being misrepresented. |
  | **The Hard Problem** | The Hard Problem is an artifact of the "user interface." It feels like a mystery because the introspective model hides the machinery of its own construction. | The Hard Problem persists because functional accounts explain *access* and *report*, but do not yet explain why those processes are accompanied by the subjective residue. |
  | **Zombie Intuition** | Philosophical zombies are conceivable because "phenomenal consciousness" (as introspectively presented) is not a real physical property. We can conceive of the physics without the illusion. | Philosophical zombies are conceivable in imagination but metaphysically impossible. You cannot have the physical state without the phenomenal residue, as they are not distinct existences. |

  ### 3. The Cruxes
  *These are the sub-questions where an answer would force one of us to change our position. We agree on the relevance of the argument/experiment and state our opposing predictions.*

  **Crux 1: The Speckled Hen (Determinacy vs. Access)**
  *   **The Question:** When a subject sees a hen with 48 speckles but cannot count them, is the *experience* determinately 48-speckled, or is the experience indeterminate and merely *represented* as determinate by introspection?
  *   **Relevance:** This tests whether phenomenality outruns access (B) or whether access constraints define phenomenality and introspection fakes the rest (A).
  *   **Agreed Test:** Fine-grained priming experiments combined with neural decoding. If neural patterns encode the specific number (48) without conscious access, it supports B. If neural patterns show "generic speckle" encoding and only the report specifies "48", it supports A.
  *   **Prediction A:** The experience is indeterminate. The neural encoding will be low-resolution. The feeling of determinacy is a post-hoc introspective confabulation.
  *   **Prediction B:** The experience is determinate (rich). The neural encoding will be high-resolution. The failure to count is a limitation of cognitive access/working memory, not a limitation of the experience itself.

  **Crux 2: The Status of Introspection in Diagnosis**
  *   **The Question:** Can Party A use introspection to identify the target of the illusion without validating the target's existence?
  *   **Relevance:** Party B argues A is self-refuting: to say introspection is wrong about phenomenality, you must use introspection to identify "phenomenality." Party A argues they identify the target via theory (the cognitive mechanism), not introspective grip.
  *   **Agreed Test:** Analysis of "phenomenal concepts." We examine whether the concept of "pain" or "redness" picks out a state via its phenomenal feel (B) or via its functional role in the introspective system (A).
  *   **Prediction A:** Phenomenal concepts are functional/recognitional concepts. We identify pain by its role in our economy of thought, not by a direct grasp of a quality.
  *   **Prediction B:** Phenomenal concepts are constituted by the experience itself. You cannot possess the concept of "red experience" without having the experience, proving the experience is the referent, not just a functional role.

  **Crux 3: The Explanatory Role of Phenomenology**
  *   **The Question:** Does the phenomenal character of an experience ever do causal/explanatory work *over and above* the functional/access role?
  *   **Relevance:** If phenomenality does no extra work, A argues it is epiphenomenal or illusory. If it does extra work, B argues it is real.
  *   **Agreed Test:** Search for cases where two states are functionally identical (same inputs, same behavioral outputs, same access) but phenomenally distinct.
  *   **Prediction A:** No such cases exist. If function and access are identical, the "phenomenal difference" is an introspective report difference, which is itself a functional difference.
  *   **Prediction B:** Such cases are possible in principle (e.g., inverted spectra with identical behavior). Even if not empirically found, the *possibility* shows phenomenality is not exhausted by function.

  ### 4. Is This Merely a Verbal Dispute?

  **Diagnosis:** Partially, but not entirely.

  **The Verbal Component:**
  We agree that a significant portion of the conflict stems from the definition of "Phenomenal Property."
  *   **Party A** defines "Phenomenal Property" as: *An intrinsic, simple, non-functional property as presented by introspection.* Since nothing fits this definition, A says they don't exist.
  *   **Party B** defines "Phenomenal Property" as: *The subjective character of a physical state, however complex or relational it turns out to be.* Since brains have subjective character, B says they exist.
  *   **Agreement:** If we adopt B's definition, A becomes a "Realist about Phenomenal Properties (defined physically)." If we adopt A's definition, B becomes an "Illusionist about Intrinsic Qualia."

  **The Substantive Remainder:**
  Once the definitions are aligned (e.g., we agree to talk about "Introspectively Presented Simplicity"), a hard disagreement remains:
  *   **The Accuracy of the Interface:** Does the introspective system *lie* about the structure of the state (A), or does it merely *blur* the structure of a real state (B)?
  *   **The Residue:** Party B insists that even if introspection lies about simplicity, the *existence* of the "felt quality" is not a lie. Party A insists that the "felt quality" *just is* the lie (the misrepresentation).
  *   **Conclusion:** This is not merely verbal. It is a disagreement about the **veridicality of the introspective mechanism.** Party A claims the mechanism produces a false positive (like a mirage). Party B claims the mechanism produces a distorted image of a real object (like a funhouse mirror). A mirage implies no water; a funhouse mirror implies a real body. This is an ontological disagreement, not a semantic one.

  ### 5. Blunt Assessment of this Genre

  **Risk of Collapse:**
  There is a high risk that Party B (Moderate Realist) is unstable. If Party B concedes that introspection is wrong about determinacy, wrong about scope, wrong about immediacy, and wrong about simplicity, and further concedes that the "residue" is entirely physical and functionally defined, Party B risks collapsing into Party A.
  *   **Failure Condition:** If Party B cannot specify what the "residue" explains that functional access does not, Party B is merely an Illusionist who is emotionally attached to the word "Real."
  *   **Failure Condition:** If Party A denies that there is "something it is like" in *any* sense that matters to the subject, Party A ceases to be an Introspection Illusionist and becomes an Eliminativist, which violates the terms of this agreement.

  **Viability:**
  This document is signable only if Party B maintains that the **phenomenal residue constrains physical theory.** (i.e., A complete physical theory must explain *why* this processing feels like something, not just why it produces reports). Party A must maintain that **physical theory constrains phenomenal reports.** (i.e., If physics says the state is complex, the feeling of simplicity is false).

  If Party B agrees that the "Hard Problem" is simply a placeholder for future neuroscience rather than a marker of ontological distinctness, the disagreement evaporates, and this document should be burned. We assume for the sake of this signing that Party B believes the Hard Problem marks a real feature of reality, and Party A believes it marks a real feature of cognitive architecture.

  **Signed,**

  ____________________ (Party A)
  ____________________ (Party B)
