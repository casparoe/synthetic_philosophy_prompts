answer: |-
  **WORKSHOP PRE-READING: MAPPING CONTINGENCY**

  **Part One: The Space of Positions**

  Participants often agree that "contingency matters" while disagreeing on what that means. To prevent the discussion from collapsing into a generic debate about determinism, we distinguish four specific axes of disagreement. For each axis, consider which claim you accept.

  **Axis 1: Sensitivity vs. Unlikelihood (The Roulette Structure)**
  *   **Claim A:** A process is contingent if small antecedent changes produce large outcome changes (sensitivity to initial conditions).
  *   **Claim B:** A process is contingent only if the actual outcome was improbable beforehand (statistical unlikelihood).
  *   **The Gap:** These come apart. Consider a roulette wheel. The specific number is exquisitely sensitive to the force of the spin (Claim A), but the *distribution* of outcomes (red/black) is stable and predictable. A participant who accepts A but rejects B believes history is sensitive but statistically regular. A participant who accepts B but rejects A believes history is predictable in the short run but the long-term outcome was a long shot.
  *   **Test Case:** A river delta shifts its channel slightly every spring due to minor sediment variations (Sensitive), but always flows into the same sea (Stable Distribution). Is this contingent history?

  **Axis 2: Amplification vs. Branch Points**
  *   **Claim A:** Contingency operates through the gradual amplification of tiny differences over time (drift).
  *   **Claim B:** Contingency operates through discrete branch points (critical junctures) after which paths become self-stabilizing (lock-in).
  *   **The Gap:** This determines how much counterfactual speculation is legitimate. If Claim A is true, changing a distant past event requires recalculating everything since. If Claim B is true, we can speculate about the branch point while assuming stability afterward.
  *   **Test Case:** The adoption of a technical standard. Did it win because it was slightly better from the start and slowly gained share (Amplification), or because an early accident locked it in before competitors could emerge (Branch Point)?

  **Axis 3: Agency vs. Circumstance**
  *   **Claim A:** Historical pivots turn primarily on human decisions, intentions, or reasoning.
  *   **Claim B:** Historical pivots turn primarily on events nobody chose (weather, harvest failure, epidemic, timing of a death, accidental presence).
  *   **The Gap:** This separates social constructivism from materialist or environmental history. If Claim A is true, contingency is tied to free will or rationality. If Claim B is true, contingency is external to human will.
  *   **Test Case:** A war begins. Was it caused by a leader's choice to mobilize (Agency), or by a famine that made resources scarce regardless of choice (Circumstance)?

  **Axis 4: Ontology vs. Narrative**
  *   **Claim A:** Claims about "how things might have gone" describe real possibilities in the world (modal realism).
  *   **Claim B:** Claims about "how things might have gone" describe only the selectivity of the narrative form we impose on the past (narrative constructivism).
  *   **The Gap:** This is the deepest divide. Claim A treats contingency as a feature of the universe. Claim B treats contingency as a feature of storytelling.
  *   **Test Case:** "If the Archduke had not been shot, war would have been avoided." Claim A asks if this statement is true or false. Claim B asks why we find this story satisfying.

  ***

  **Part Two: The Cells**

  Crossing these four axes generates sixteen logical positions. Not all are occupied. Below are the major occupied regions and the empty zones.

  **1. The Paleontological View (Axes: 1A, 2A, 3B, 4A)**
  *   **Position:** History is sensitive to small material changes (1A), accumulates via drift (2A), driven by environmental/biological circumstance (3B), and describes real possibilities (4A).
  *   **Occupancy:** Heavily occupied. This is the standard view in evolutionary biology and some strands of geo-history.
  *   **Label:** *Convergence Skeptic.*

  **2. The Structuralist View (Axes: 1B, 2A, 3B, 4A)**
  *   **Position:** Outcomes are statistically likely (1B), driven by deep structures rather than events. Events are "foam on the surface."
  *   **Occupancy:** Occupied. Common in long-term economic history and Annales school historiography.
  *   **Label:** *Long-Run Determinist.*

  **3. The Path-Dependence View (Axes: 1A, 2B, 3A/B, 4A)**
  *   **Position:** Early accidents lock in outcomes (2B). Sensitive to initial conditions (1A).
  *   **Occupancy:** Heavily occupied in institutional economics and technology studies.
  *   **Label:** *Lock-In Theorist.*

  **4. The Deflationary View (Axes: 1B, 2B, 3A, 4B)**
  *   **Position:** Contingency talk is an artifact of storytelling (4B). We create branch points retrospectively.
  *   **Occupancy:** Occupied by some philosophers of history and narrative theorists.
  *   **Label:** *Narrative Constructivist.*

  **5. The Convergence Rejoinder (Axes: 1B, 2A, 3B, 4A)**
  *   **Position:** Replaying history yields broadly repeatable outcomes due to functional constraints (1B), despite gradual drift (2A).
  *   **Occupancy:** Occupied. Common in evolutionary developmental biology.
  *   **Label:** *Convergence Theorist.*

  **Empty or Unstable Cells**
  *   **The "Magic Branch" (1B, 2B, 4A):** Claims outcomes were probable (1B) but arrived via discrete, non-necessary jumps (2B) that are ontologically real (4A). *Diagnosis:* Incoherent. If outcomes are probable, the branch points are not truly contingent in a strong sense.
  *   **The "Agential Lock-In" (1A, 2B, 3A, 4B):** Claims decisions lock in history (3A, 2B) but this is only a story (4B). *Diagnosis:* Unattractive. Rarely defended; usually a transitional position.
  *   **The "Material Narrative" (3B, 4B):** Claims circumstance drives history, but only as a narrative device. *Diagnosis:* Unexplored. Worth a paper. Why would materialists adopt narrative constructivism?

  **Near Collapses**
  *   **Structuralists (2) and Convergence Theorists (5)** sound identical: both predict stable outcomes.
      *   *Condition for Collapse:* They collapse if "statistical likelihood" (1B) is indistinguishable from "functional constraint." If the mechanism of stability does not matter, only the prediction, they are the same.
  *   **Path-Dependence (3) and Paleontological (1)** sound identical: both emphasize sensitivity.
      *   *Condition for Collapse:* They collapse if "gradual amplification" (2A) is indistinguishable from "lock-in" (2B). If drift eventually locks, the distinction is merely temporal.

  ***

  **Part Three: The Instrument**

  Please answer the following items. Choose the option that best reflects your view of *what would have happened*, not what you wish had happened. Time: 15 minutes.

  **1. The Dual Discovery**
  Two researchers, working independently, publish the same mathematical proof within three months of each other.
  *   (A) If Researcher A had died young, the proof would still have appeared within the year via Researcher B.
  *   (B) If Researcher A had died young, the proof would have been delayed by decades.
  *   (C) The question is meaningless; we cannot know what dead people would have done.

  **2. The Storm and the Battle**
  A naval battle is won because a storm dispersed the enemy fleet. The storm was unpredictable.
  *   (A) Without the storm, the battle would have been lost, changing the war's outcome.
  *   (B) Without the storm, the battle would have been lost, but the war's outcome would have been the same due to resource advantages.
  *   (C) The storm is just a hook for the story; the real cause was strategic doctrine.

  **3. The Inches Margin**
  An assassination attempt fails because the driver took a wrong turn. The assassin was ready.
  *   (A) This was the pivot point; the subsequent regime change would not have occurred otherwise.
  *   (B) The regime was unstable; another attempt would have succeeded within months.
  *   (C) We focus on this attempt only because it was the one that failed; others don't count.

  **4. The Early Standard [Invented Episode]**
  In 1920, a specific voltage standard was adopted for a national grid because the lead engineer preferred it. It was technically inferior to a rival.
  *   (A) The inferior standard locked in the system for a century.
  *   (B) The market would have corrected to the better standard eventually, regardless of the engineer.
  *   (C) "Inferior" is a judgment we apply later; it was the rational choice then.

  **5. The Delayed Reform [Invented Episode]**
  A major social reform passed in 1950. The key minister died in 1948.
  *   (A) The reform arrived a generation late because of that death.
  *   (B) The reform was inevitable; another minister would have passed it.
  *   (C) The death is a convenient date for historians to mark the delay.

  **6. The Self-Fulfilling Stability [Invented Episode]**
  A currency remained stable because traders believed it was stable. One trader considered selling but didn't.
  *   (A) If that trader had sold, the currency would have collapsed.
  *   (B) The currency was fundamentally sound; one trader couldn't change the value.
  *   (C) The stability existed only because everyone believed it existed.

  **7. The Different Route [Invented Episode]**
  A specific technology was invented in 1900. Suppose it had not been.
  *   (A) It would never have been invented; the specific insight was unique.
  *   (B) It would have been invented by 1910 via a completely different scientific route.
  *   (C) We cannot compare different scientific routes; they are incommensurable.

  **8. The Counterfactual Truth**
  Consider the statement: "If event X had not occurred, Y would not have followed."
  *   (A) This statement is either true or false, regardless of our knowledge.
  *   (B) This statement is useful, but not strictly true or false.
  *   (C) This statement is a literary device, not a claim about the world.

  **9. The Sensitive System**
  A chaotic system (like weather) is modeled. We change one decimal point in the input.
  *   (A) The specific outcome changes, but the range of possible outcomes stays the same.
  *   (B) The specific outcome changes, and the range of possible outcomes also shifts.
  *   (C) The model tells us nothing about reality.

  **10. The Narrative End**
  A historian writes a book ending in 1989.
  *   (A) 1989 is a natural stopping point in the historical process.
  *   (B) 1989 is an arbitrary cutoff chosen for the book's structure.
  *   (C) 1989 matters only because people decided to celebrate it.

  ***

  **Part Four: Scoring and Limitations**

  **Scoring Key**
  Map your answers to the Axes in Part One.
  *   **Axis 1 (Sensitivity vs. Unlikelihood):**
      *   Sensitive (1A): Items 1(B), 9(A).
      *   Unlikely/Stable (1B): Items 1(A), 9(B).
  *   **Axis 2 (Amplification vs. Branch):**
      *   Amplification/Drift (2A): Items 4(B), 5(B), 7(B).
      *   Branch/Lock-In (2B): Items 4(A), 5(A), 7(A).
  *   **Axis 3 (Agency vs. Circumstance):**
      *   Agency (3A): Items 3(A), 4(A).
      *   Circumstance (3B): Items 2(A), 5(A). *Note: Overlap indicates complexity.*
  *   **Axis 4 (Ontology vs. Narrative):**
      *   Ontology (4A): Items 8(A), 10(A).
      *   Narrative (4B): Items 8(C), 10(B).

  **Inconsistency Detection**
  *   **The "Determinist Contingent":** If you chose 1(A) [Sensitive] but also 2(B) [Lock-In] and 5(B) [Inevitable Reform], you claim history is sensitive but outcomes are inevitable. This is the *Convergence Theorist* position, but ensure you aren't conflating "sensitive path" with "inevitable end."
  *   **The "Narrative Realist":** If you chose 8(C) [Narrative Device] but answered 1-7 as if the counterfactuals have definite truth values, your professed view (4B) contradicts your operational view (4A). You are treating stories as facts.

  **Limitations of the Instrument**
  This instrument cannot perfectly separate all positions. Be aware of the following blind spots:

  1.  **Second-Order Contingency:** Item 6 attempts to capture cases where stability depends on *belief* in stability. However, the instrument cannot distinguish between a participant who thinks the belief *caused* the stability and one who thinks the belief *reflected* the stability. Axis 3 (Agency vs. Circumstance) struggles here because the "circumstance" is collective psychology.
  2.  **Delayed Convergence:** The instrument struggles to distinguish a *Determinist* (outcome always happens) from a *Convergence Theorist* (outcome happens eventually via different routes). Item 7 addresses this, but a participant who believes convergence takes 500 years may answer like a Determinist who believes convergence takes 10 years. The axis does not measure *time scale*.
  3.  **Presupposition of Truth Values:** The design of Items 1-7 presupposes that counterfactual claims have truth values (Axis 4A). A participant who firmly holds Axis 4B (Narrative Constructivism) is forced to answer "as if" they believe in counterfactuals to complete the quiz. Their score on Axes 1-3 may therefore be artifacts of the test design rather than genuine beliefs.
  4.  **Unseparated Pair:** The *Structuralist* (Long-Run Determinist) and the *Convergence Theorist* often produce identical answer patterns on this quiz. Both predict stability (1B) and inevitability (2A/5B). The instrument cannot separate them without asking about the *mechanism* of stability (functional constraint vs. statistical law), which requires more space than these items allow.

  **Instruction for Workshop:** Bring your marked sheet. We will not discuss your "score," but rather where you found the options insufficient.
