prompt: |-
  Bit of an unusual prep request. In about three weeks I'm giving a 40 minute paper at a UK mental capacity conference, and then a 20 minute Q&A which is the part I'm actually scared of. The room is roughly: two thirds clinicians — geriatric psychiatrists and best-interests assessors who do capacity work day in day out — a couple of solicitors who live inside the Mental Capacity Act and think entirely in terms of whether an advance decision is valid and applicable, and maybe four or five philosophers, one of whom works on personal identity and will absolutely go for the metaphysics.

  Here's the view I'm defending. Standard framing says an advance directive has authority because the earlier self is the same person as the later demented one, or because it expresses the patient's authentic values. I reject both. My claim is that a directive is a piece of standing authorisation: at the time of writing, a person with the relevant capacities delegates a decision to a proxy under conditions they specify, and what gives it force later is not identity or authenticity but the fact that nobody with the standing to withdraw the authorisation has withdrawn it. That gives me three commitments I want objections aimed at:

  1. The standing condition. Withdrawing the authorisation requires second-order capacities — the ability to hold and revise a view of one's own good over time, not just a present want. So an in-the-moment refusal by someone in advanced dementia doesn't cancel the directive, but a refusal during a genuinely lucid interval does, even if the person then relapses.
  2. The revocation asymmetry. The same act (saying no to the treatment) has different normative weight depending on standing, which sounds formalist to clinicians and I know it.
  3. The contentment override. Because authority comes from standing and not from well-being, I concede that if the later person is settled and untroubled, that fact can outweigh the directive in practice — the directive tells you who decides, not automatically what the decision is.

  The case I'll build the talk around: a woman who wrote a directive refusing long-term tube feeding after a diagnosis of early onset dementia, and who eight years later is cheerful, sociable, resistant at each feeding, and by every measure content.

  So: give me a prep sheet, not a defence of the view. The seven or eight objections this particular audience will actually raise, ordered by how much damage each would do, and phrased the way each subgroup would phrase it — the psychiatrist's version and the solicitor's version of the same complaint are not the same sentence. For each one, a reply I can deliver in about ninety seconds, an honest note on where that reply is softest, and whether I should concede it up front in the talk to defuse it. Then tell me the single thing that has to land for the position to survive the room, and the question I'm hoping nobody asks (I have a guess but I want to know if you think it's the right one). No references or bibliography please — I can't check them and I don't want invented ones. Write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a prep sheet for a 40-minute paper + 20-minute Q&A at a UK mental capacity conference.
      *   **Topic:** A novel philosophical/legal view on Advance Directives (ADs).
      *   **Core Argument:** ADs are "standing authorisations" (delegation), not based on personal identity or authenticity. Authority persists unless withdrawn by someone with *standing* (second-order capacities). Contentment of the later self can override the directive in practice (who decides vs. what is decided).
      *   **Case Study:** Woman with early-onset dementia, AD refuses tube feeding, later self is cheerful/content but resistant to feeding.
      *   **Audience:** 2/3 Clinicians (geriatric psychiatrists, BIAs), a few Solicitors (MCA experts), 4-5 Philosophers (including personal identity expert).
      *   **Format:** Prep sheet, not a defence. 7-8 objections ordered by damage potential. Phrased differently for clinicians vs. solicitors. 90-second reply for each. Honest note on weakness. Advice on pre-emptive concession.
      *   **Crucial Elements:** The "Single Thing" that must land. The "Question Hoping Nobody Asks."
      *   **Tone/Style:** British English. No references/bibliography. Practical, sharp, strategic.

  2.  **Deconstruct the Core Argument & Identify Vulnerabilities:**
      *   *Claim 1 (Standing Condition):* Only those with second-order capacities can revoke. Demented refusal doesn't count. Lucid interval does.
          *   *Vulnerability:* How do you assess "second-order capacity" in the moment? Isn't this just capacity assessment by another name? What if the lucid interval is brief?
      *   *Claim 2 (Revocation Asymmetry):* Same act (saying no) has different weight based on standing.
          *   *Vulnerability:* Clinicians hate this. It looks like ignoring the patient's current distress. Legal risk (battery/assault if force-feeding).
      *   *Claim 3 (Contentment Override):* Authority tells you *who* decides, not *what*. If the patient is happy, maybe don't follow the AD.
          *   *Vulnerability:* This undermines the whole point of the AD. If the outcome can be overridden by well-being, why have the AD? It collapses into best interests.
      *   *General Vulnerability:* The MCA 2005 framework. ADs (Advance Decisions to Refuse Treatment - ADRT) are statutory. Can a philosophical theory override the statute?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The MCA Statutory Conflict (Solicitors).* The MCA is clear. Valid and Applicable ADRTs are binding. You can't introduce a "standing authorisation" theory that conflicts with s.24-26.
          *   *Damage:* High. Illegal practice.
      *   *Objection 2: The Best Interests Collapse (Clinicians).* If contentment overrides the directive, you're just doing best interests. Why bother with the AD?
          *   *Damage:* High. Makes the theory redundant.
      *   *Objection 3: The Assessment Burden (Clinicians).* How do I test for "second-order capacity" in a lucid interval? It's too hard/risky.
          *   *Damage:* Medium-High. Practical unworkability.
      *   *Objection 4: The Distress/Battery Issue (Clinicians).* Forcing treatment on a resistant but content patient because of a past document looks like assault/abuse.
          *   *Damage:* High. Ethical/Physical risk.
      *   *Objection 5: The Personal Identity Attack (Philosophers).* You say you reject identity, but "standing" relies on a continuity of agency that *is* a form of identity.
          *   *Damage:* Medium. Philosophical nitpicking, but the identity expert will go for this.
      *   *Objection 6: The Slippery Slope of "Contentment".* Who measures contentment? A cheerful dementia patient might still be suffering existentially.
          *   *Damage:* Medium. Epistemic problem.
      *   *Objection 7: The Proxy Problem.* You mention delegating to a proxy. What if the proxy disagrees with the contentment assessment?
          *   *Damage:* Low-Medium. Procedural.

      *Refining for Audience Voices:* Need to ensure the Solicitor sounds legalistic (MCA sections, binding nature) and the Clinician sounds practical (distress, care burden, risk).

  4.  **Developing the Replies:**
      *   Need to be concise (90 seconds).
      *   Need to acknowledge the tension without collapsing the argument.
      *   *Strategy:* Distinguish between *validity* (legal/philosophical status) and *enforcement* (clinical discretion).

  5.  **Identifying the "Single Thing" and "Forbidden Question":**
      *   *Single Thing:* The distinction between *authority to decide* and *the decision itself*. If this doesn't land, the "contentment override" looks like inconsistency.
      *   *Forbidden Question:* Probably about the legal status. "Are you advising us to break the MCA?" OR "If the later self is a different person, why does the earlier self's will bind them?" (The identity trap). Let's go with the Legal/Practical clash: "If the AD is valid under the MCA, on what basis do you suggest we ignore it for contentment?"

  6.  **Review against Constraints:**
      *   British English (e.g., "programme", "authorisation", "solicitor", "MCA").
      *   No references.
      *   Order by damage.
      *   Include "Concede Up Front?" advice.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the distinction between the Solicitor's worry (liability/statute) and the Psychiatrist's worry (harm/distress) is clear.
      *   *Correction:* Ensure the "Contentment Override" doesn't sound like I'm saying "ignore the AD." It's about the *proxy's* discretion within the authorisation.
      *   *Correction:* The "Standing" definition needs to be robust against the "Lucid Interval" challenge.
      *   *Tone Check:* Keep it professional but candid about weaknesses.

  8.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **PREP SHEET: Q&A STRATEGY**
  **Conference:** UK Mental Capacity Conference
  **Time:** 20-minute Q&A
  **Topic:** Advance Directives as Standing Authorisation

  **Context:** You are walking a tightrope. You are proposing a philosophical reinterpretation of the MCA framework that risks sounding like you are advising clinicians to ignore valid Advance Decisions to Refuse Treatment (ADRTs). Your survival depends on distinguishing between the *source of authority* (the directive) and the *exercise of discretion* (the proxy/clinician).

  Below are the eight objections most likely to arise, ordered by potential damage to your credibility and the viability of the position.

  ---

  ### 1. The Statutory Conflict (Solicitors)
  **The Objection:** "Section 24 to 26 of the Mental Capacity Act are explicit. If an ADRT is valid and applicable, it is binding. You cannot introduce a philosophical 'standing authorisation' theory that effectively renders a statutory ADRT non-binding because the patient is currently 'content'. Are you advising us to act outside the MCA?"
  **Damage:** Critical. If you are seen to be advising illegal practice, you lose the room immediately.
  **90-Second Reply:** "I am not suggesting we violate the MCA. I am suggesting we reinterpret what makes an ADRT 'applicable'. The Act requires us to consider whether the person has done anything clearly inconsistent with the directive. My argument is that 'standing' is the mechanism of consistency. If the earlier self delegated authority, that authority persists. However, the proxy holding that authority must exercise it in the present context. The statute binds the *outcome* only if the conditions of applicability are met; my claim is that current settled contentment changes the context of applicability, inviting a best-interests check on *enforcement*, not a denial of the document's existence."
  **Weakest Point:** You are treading very close to redefining 'applicable' in a way a judge might not accept.
  **Concede Up Front?** Yes. State clearly in the talk: "This is a normative claim about how we *ought* to interpret applicability, not a licence to ignore the statute."

  ### 2. The Best Interests Collapse (Clinicians & Solicitors)
  **The Objection:** "If the patient's current contentment can override the directive, haven't you just reinvented Best Interests? Why bother with the directive at all? You've swallowed your own tail."
  **Damage:** High. Makes your theory redundant.
  **90-Second Reply:** "It's not a collapse, it's a hierarchy. In standard Best Interests, the past wishes are just one factor among many. In my model, the directive establishes *who* has the jurisdiction to decide. It creates a presumption. The contentment override is a safety valve, not the engine. It prevents the absurdity of forcing treatment on a contented person, but it doesn't allow us to ignore the directive whenever it's inconvenient. The directive sets the default; well-being provides the exception."
  **Weakest Point:** Distinguishing between a 'presumption' and a 'factor' is subtle and might get lost in a stressful clinical scenario.
  **Concede Up Front?** No. Keep this distinction sharp for the Q&A.

  ### 3. The Distress and Battery Risk (Psychiatrists)
  **The Objection:** "You describe a woman who is 'resistant at each feeding'. If we proceed based on a past document while she is physically resisting now, that looks like battery and certainly looks like abuse. How do you justify inflicting that distress?"
  **Damage:** High. Clinicians will not risk their registration or the patient's dignity.
  **90-Second Reply:** "This is the hardest practical implication. My view does not mandate force-feeding. Remember the 'Contentment Override'. If the resistance indicates underlying distress that outweighs the benefit of life, the proxy—authorised by the directive—can decide not to enforce it. The directive gives the proxy the right to refuse feeding; it doesn't necessarily compel them to force it if the cost to the present self is too high. It shifts the burden of decision to the proxy, rather than leaving it as a free-for-all."
  **Weakest Point:** You are asking clinicians to hold two contradictory thoughts: "This refusal doesn't count" and "We won't force her because she's upset."
  **Concede Up Front?** Yes. Acknowledge that in cases of active physical resistance, enforcement is rarely clinically indicated regardless of the theory.

  ### 4. The Epistemology of Contentment (Psychiatrists)
  **The Objection:** "How do you measure 'settled and untroubled'? A patient can be cheerful and still be suffering. Are we to rely on a smile? This gives clinicians too much subjective power to override a clear written wish."
  **Damage:** Medium-High. Undermines the reliability of your override condition.
  **90-Second Reply:** "You're right to be wary of the 'smile test'. Contentment here isn't just affect; it's the absence of demonstrable distress over time. It requires collateral history, observation, and ideally, the input of the appointed proxy. It is not a snap judgement. If there is ambiguity, the directive stands. The override only kicks in when the quality of the present life is robustly evidenced, not merely assumed."
  **Weakest Point:** 'Robustly evidenced' is vague.
  **Concede Up Front?** No.

  ### 5. The Lucid Interval Assessment (Psychiatrists)
  **The Objection:** "You say a refusal during a lucid interval cancels the directive. How am I supposed to assess 'second-order capacity' in a fluctuating condition? You're asking for a mini-mental state exam on metaphysics."
  **Damage:** Medium. Practical unworkability.
  **90-Second Reply:** "I'm not asking for metaphysics, I'm asking for the standard capacity test applied to the specific decision of revocation. Can they understand that revoking this changes their future care? Can they weigh that? If they can, they have standing. If they cannot, they don't. It's the MCA test, applied to the act of withdrawal rather than the treatment itself."
  **Weakest Point:** Fluctuating capacity is a nightmare to document legally.
  **Concede Up Front?** No.

  ### 6. The Personal Identity Trap (Philosophers)
  **The Objection:** "You claim to reject personal identity as the ground for authority, but your 'standing' condition relies on a continuity of agency. Isn't this just psychological continuity theory by another name?"
  **Damage:** Medium. Annoying, but won't lose the clinicians.
  **90-Second Reply:** "No. Psychological continuity asks 'Are they the same person?'. My view asks 'Did they set up a valid procedure?'. It's procedural, not metaphysical. I don't need the later self to be the *same* person, only to be the *beneficiary* of a procedure established by the earlier self that hasn't been validly terminated. It's the difference between identity and inheritance."
  **Weakest Point:** Philosophers love to argue that inheritance presupposes identity.
  **Concede Up Front?** No.

  ### 7. The Proxy Disagreement (Solicitors/BIAs)
  **The Objection:** "You say the proxy decides. What if the proxy wants to follow the directive but the clinical team sees contentment? Or vice versa? You've just moved the conflict from the patient to the proxy."
  **Damage:** Low-Medium. Procedural.
  **90-Second Reply:** "That conflict exists already. My model clarifies the starting position. The proxy holds the authorisation. If they wish to enforce the directive, they must justify why contentment isn't sufficient to override. If they wish to ignore it, they must justify why the authorisation no longer serves its purpose. It structures the disagreement rather than eliminating it."
  **Weakest Point:** Doesn't actually solve the deadlock.
  **Concede Up Front?** No.

  ### 8. The Slippery Slope (Solicitors)
  **The Objection:** "If we allow contentment to override refusal of feeding, what stops us overriding refusal of antibiotics? Or resuscitation? Where is the limit?"
  **Damage:** Low. Standard slippery slope.
  **90-Second Reply:** "The limit is the scope of the authorisation. The directive specifies the conditions. My argument applies to the enforcement of that specific delegation. It doesn't grant a general licence to override all refusals. It is tied to the specific standing granted in the document."
  **Weakest Point:** Hard to police in practice.
  **Concede Up Front?** No.

  ---

  ### THE SINGLE THING THAT MUST LAND
  **The distinction between *Validity* and *Enforceability*.**
  You must convince the room that an ADRT can be *valid* (properly signed, witnessed, capacitous when made) and yet *not enforceable* in the specific present context without being *invalidated*.
  If you conflate these, the Solicitors will think you are voiding the document, and the Clinicians will think you are mandating treatment against current resistance.
  **Phrasing to use:** "The directive remains the source of authority, but authority does not always demand execution."

  ### THE QUESTION YOU HOPE NOBODY ASKS
  **"If the earlier self delegates authority to a proxy, why does the proxy have to listen to the earlier self's instructions at all? If it's a delegation, can't the proxy just decide based on current best interests?"**

  **Why this is dangerous:**
  If you say "Yes, the proxy can ignore the instructions," you destroy the binding nature of ADs and alienate the Solicitors and autonomy advocates.
  If you say "No, the proxy must follow instructions," you destroy your "Contentment Override" commitment and alienate the Clinicians who see a suffering/ content patient.
  You are currently arguing that the proxy is bound *unless* contentment overrides. This question forces you to define the exact threshold where the proxy's discretion trumps the principal's instruction. It exposes the instability in your "Standing Authorisation" model: is it a *mandate* or a *trust*?

  **Preparation for this question:**
  Have a ready answer that defines the proxy's role as a *fiduciary* for the earlier self's project, but with a duty of care to the later self's welfare. "The proxy is bound by the mandate unless fulfilling it causes harm to the beneficiary that the mandator could not have reasonably intended." (It's a bit wobbly, but it's the best shield you have).

  ---

  ### GENERAL TONE ADVICE
  *   **To the Clinicians:** Speak their language of risk and distress. Acknowledge that force-feeding a smiling woman is abhorrent. Don't let them think your theory mandates it.
  *   **To the Solicitors:** Respect the MCA. Do not sound like you are inventing a new law. Frame this as interpreting 'applicability'.
  *   **To the Philosophers:** Don't get bogged down in metaphysics. Keep it normative. "I'm not telling you what a person *is*, I'm telling you how we should *act*."

  **Final Note:** You are proposing a hybrid view. You will be attacked from both sides (too legalistic for clinicians, too flexible for lawyers). Own the hybrid nature. It's a feature, not a bug. It's designed to solve the exact impasse they face in the room.
