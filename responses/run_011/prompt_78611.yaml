  4. **The case that he isn't**
  However, the Ludovico technique alters the actual sequence, unlike a Frankfurt intervener. In a true Frankfurt case, the agent's decision-making process remains untouched; the intervener only watches. Ludovico rewires Alex's physiological response to violence, creating a new causal chain where will no longer leads to action. This breaks "guidance control." The load-bearing difference is that Frankfurt cases preserve the agent's authorship of the action, whereas Ludovico replaces authorship with conditioning. Alex isn't choosing not to kill; he is being physically stopped. The removal of alternatives here isn't a subtle philosophical pruning; it's a demolition of the agency required to bear responsibility. You cannot blame a machine for not crashing if the brakes were glued.

