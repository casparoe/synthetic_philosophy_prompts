  **The Question**
  The project asks whether aesthetic knowledge transmitted via testimony is uniform or divided. I distinguish between property-ascribing reports, which attribute characteristics to an object (this novel is profound), and effect reports, which describe the object's impact on a subject (I wept in the last chapter). While effect reports transmit readily, property ascriptions resist testimonial transfer, triggering the intuition that direct acquaintance is necessary. The primary question is not merely whether this distinction holds, but what it implies for the ontology of aesthetic properties. If effect reports transmit knowledge reliably, a work's dispositional profile can be mapped by someone who has never encountered it. The central inquiry is therefore supervenience: is an aesthetic property exhausted by that dispositional profile, such that mapping it equals knowing the property? Or does acquaintance contribute something irreducible, meaning a fully informed effect-map and an encounter yield knowledge of two different things? I treat the supervenience issue as primary. The distinction is the tool; the goal is to determine whether the residue of the acquaintance principle survives once we isolate effect reports from property ascriptions. This residue defines the limit of what language can convey about art.

  **Why It Has Not Been Settled**
  Existing positions leave this open because they treat aesthetic testimony as a single kind of speech act. Proponents of the acquaintance principle argue that aesthetic judgement requires direct perception; testimony cannot substitute for the experience itself. They capture the resistance felt around property ascriptions but cannot explain why effect reports pass without objection. Deflationists argue that testimony functions in aesthetics as it does in ordinary facts; if a trusted source says a work is good, I know it is good. This accounts for the transmission of effect reports but dismisses the intuitive force of the acquaintance principle as mere snobbery or confusion. A third group relocates the problem from epistemology to the propriety of belief, suggesting the issue is not whether we know, but whether we are entitled to claim knowledge. None of these positions exploit the split between property-ascription and effect-reporting. Some gesture at the difference between judging and feeling, but none use it to dissolve the puzzle. By conflating the report of what a work *is* with the report of what a work *does*, the debate stalls. The acquaintance principle seems universally binding because the property-ascription side dominates the literature, while the effect-report side is treated as merely psychological padding rather than a distinct epistemic channel. Consequently, the deflationists attack a straw man of rigid judgement, while the acquaintance defenders overlook the fluidity of affective reporting. The middle ground remains unoccupied because no one has categorized the testimony itself with sufficient granularity. This conflation protects the puzzle from dissolution; separating the categories exposes the machinery.

  **Method, Month by Month**
  Over twelve months, I will sort a corpus of critical reviews and reader correspondence into the two categories of report. Months one through three involve collecting and coding language from literary criticism and my own archive of reader letters, isolating clear instances of property-ascription versus effect-reporting. I will look for markers of subjectivity versus objectivity in the phrasing. Months four through six focus on constructing test cases. I will use standing examples from my correspondence, such as readers who believed they knew a city from my descriptions, travelled there, and were disappointed. I will analyze these cases to determine what was transmitted versus what was missing. Months seven through nine involve building the argument about dispositions. I will test whether a sufficient accumulation of effect reports allows for accurate prediction of aesthetic properties without acquaintance. Months ten through twelve are for drafting the manuscript, structuring the argument from linguistic analysis to philosophical implication.
  I reject three obvious alternatives. First, dissolving the topic into a general theory of testimony ignores the specific resistance aesthetic properties offer compared to ordinary facts. Aesthetic terms carry normative weight that ordinary facts do not, requiring a specific framework. Second, importing the psychology of imagination and mental imagery risks reducing the epistemological problem to a cognitive mechanism, which explains how we visualize but not what we know. Knowing how an image forms does not tell us if the knowledge is valid. Third, reframing everything as a problem in the ethics of belief sidesteps the core question of whether knowledge is actually present. It polices the believer rather than examining the object. My approach remains textual and phenomenological. I am not measuring brain states or policing belief norms; I am mapping the language we use to share aesthetic experience to see where the transmission breaks. This fits the fellowship's research focus, requiring close reading and argument construction rather than empirical data collection or creative drafting. The method is philosophical but grounded in the actual usage of language by writers and readers. I will maintain a log of ambiguous cases to refine the definitions iteratively. This ensures the categories remain robust against counterexamples.

  **What Would Count as a Result, and What Would Count as Failure**
  The best outcome is an account that explains why both halves of the reader disappointment case can be true. It would show that something genuine was transmitted via effect reports, justifying the readers' confidence, while demonstrating that what was transmitted was not what the visit supplies. This would preserve the acquaintance principle for property ascriptions while validating effect reports as knowledge-transmitting. The honest worst outcome is that the distinction turns out to be merely verbal. If effect reports are revealed to be property ascriptions in disguise—for example, if saying I wept is just a coded way of saying the work is sad—then nothing has been gained. The puzzle would remain intact, and the project would conclude that the resistance to testimony is holistic. A secondary failure would be finding that the distinction holds but offers no philosophical leverage; if the dispositional profile maps perfectly onto the property, the acquaintance principle is simply false, which is a result, but one that might render the project less nuanced than hoped. I aim for the residue: a narrow, specific explanation of where acquaintance remains necessary. Success means narrowing the scope of the problem, not necessarily solving aesthetics entirely. It means showing that the debate is stuck because it is looking at one thing when it should be looking at two. This would reshape how critics justify their claims to readers.

  **Scope**
  Twelve months and a single researcher can support a focused textual analysis and argument construction, but not a comprehensive history of the acquaintance principle or a cross-cultural study of aesthetic testimony. I will limit the corpus to contemporary English-language criticism and my own professional correspondence. This ensures the data is manageable and directly relevant to my working life as a novelist. If the project begins to spread, I will cut the historical genealogy of the debate. While understanding how the acquaintance principle evolved is valuable, it is not necessary for determining whether the distinction resolves the current impasse. I will also avoid expanding into other art forms beyond literature and perhaps music. Visual art and architecture introduce perceptual variables that might complicate the linguistic analysis without adding clarity to the core epistemological question. The scope is strictly the logic of the reports we make, not the full phenomenology of every art form. I will prioritize depth of analysis on the specific distinction over breadth of examples. This project is designed for a research fellowship rather than a writing residency; it requires quiet engagement with texts and arguments, not the isolation needed for drafting fiction. The output is a book-length essay, which demands sustained theoretical focus rather than fragmented inquiry.

  **On the Applicant's Standing**
  A working novelist is well placed to ask this because novelists are industrial-scale suppliers of aesthetic testimony. I spend months trying to make a reader register a harbour at dusk, and I receive direct feedback on whether they feel they know it. This provides a steady stream of cases where transmission succeeds or fails. However, practitioner experience counts here as a source of cases, not as evidence itself. My intuition about what readers know is data to be examined, not proof of what they know. I bring a sensitivity to the nuances of description and response, but the argument must stand on the analysis of the reports, not on my authority as a writer. The limit is clear: I am not claiming special access to truth, but special access to the machinery of transmission.
