answer: |-
  This exercise forces students to confront the instability of raw data when cognitive variables are uncontrolled, mirroring the penetrability debate's core evidentiary problem.

  ### **Materials**
  *   **Stimulus:** 1 large carton of apple juice (room temperature).
  *   **Vessels:** 20 identical opaque plastic cups (numbered 1–20 on the bottom with marker).
  *   **Labels:** 20 index cards. 10 marked "Formula A (High Concentrate)" in red marker; 10 marked "Formula B (Diluted Blend)" in blue marker.
  *   **Data:** 10 scorecards (index cards cut in half) with scales 1–10 for "Perceived Sweetness."
  *   **Board:** Whiteboard divided into three sections: "Group Alpha," "Group Beta," and "Pooled Data."
  *   **Roles:**
      *   **The Pourer (Non-drinker):** Controls the physical stimulus.
      *   **The Scribe (Dairy issue):** Controls the data record.
      *   **The Tasters (10 students):** Generate the data.

  ### **Timeline (75 Minutes)**

  **0:00–0:10 | Setup & Role Assignment**
  *   **Do not mention perception, penetration, or bias.** Frame this as a "Sensory Calibration Exercise" to test if students can detect concentration differences.
  *   **Assign Roles:**
      *   Ask for the student who doesn't drink alcohol. Assign them **The Pourer**. Tell them: "Because you need to maintain absolute neutrality and cannot be influenced by even trace amounts, you are the only one who knows the physical truth of the pour. You are the control."
      *   Ask for the student with the dairy issue. Assign them **The Scribe**. Tell them: "Because you cannot consume the pairing snacks later, you will ensure data integrity now. You are the only one allowed to write on the board."
      *   Remaining 10 students are **Tasters**.
  *   **Distribution:** Hand each Taster an envelope containing two cups and two label cards.
      *   **Secret Prep:** 7 envelopes contain *Condition Alpha* (Cup 1 = Label B "Diluted", Cup 2 = Label A "Concentrate"). 3 envelopes contain *Condition Beta* (Cup 1 = Label A "Concentrate", Cup 2 = Label B "Diluted").
      *   **Physical Reality:** The Pourer fills all cups from the *same* carton. There is no difference in liquid.
      *   **Instruction:** "Taste Cup 1, record sweetness. Cleanse palate (water). Taste Cup 2, record sweetness. Do not talk until data is collected."

  **0:10–0:25 | Data Generation**
  *   Tasters consume and record.
  *   **Pourer** monitors to ensure cups are filled identically (reinforcing their authority).
  *   **Scribe** collects scorecards silently.
  *   *Pedagogical Note:* If a student whispers "It's all the same," the Pourer says, "Record what you experience, not what you suspect."

  **0:25–0:40 | The Anomaly (Aggregation)**
  *   **Scribe** tallies the data on the board.
  *   **Step 1 (Subgroups):** Calculate average sweetness for "Concentrate" vs. "Diluted" within Group Alpha (n=7) and Group Beta (n=3).
      *   *Expected Result:* Group Alpha (mostly 2nd sip = fatigue) will rate "Concentrate" lower than "Diluted" (because Concentrate was 2nd). Group Beta (mostly 1st sip = fresh) will rate "Concentrate" higher.
  *   **Step 2 (Pooled):** Calculate the average for all "Concentrate" labels vs. all "Diluted" labels across the whole room.
      *   *Expected Result:* Because 70% of "Concentrate" labels were tasted second (fatigued), the Pooled "Concentrate" score will be *lower* than the Pooled "Diluted" score.
  *   **The Crisis:** The aggregate data suggests the "High Concentrate" label tastes *less* sweet than the "Diluted" label.
  *   **Task:** "You have 10 minutes. In pairs, explain why the 'High Concentrate' label performed worse overall despite the label suggesting it should be sweeter. You cannot ask me questions."

  **0:40–0:55 | The Argument**
  *   Students will likely discover the Order Effect (1st sip vs. 2nd sip).
  *   They will argue whether the label *changed the taste* or just *changed the number*.
  *   **Intervention:** If they solve it too fast, ask: "If the label changed the number, did it change the experience? How would you know?"
  *   **Intervention:** If they stall, ask: "Is the Pooled Data lying? Or is it telling a different truth?"

  **0:55–1:15 | Debrief & Philosophical Mapping**
  *   **Reveal:** The juice was identical. The Pourer confirms.
  *   **Map the Moves:**
      1.  **Pooled Data Failure:** Maps to **Naive Realism**. Treating experience reports as raw data without controlling for theory (order/expectation) leads to false conclusions.
      2.  **Subgroup Correction:** Maps to **Theory-Ladenness**. We needed a hypothesis (Order Matters) to make the data intelligible.
      3.  **The Hard Question:** "Did the 'Concentrate' label make it *taste* sweeter, or did you just *write* a higher number?"
          *   This is the **Penetrability vs. Response Bias** distinction.
          *   The data proves *influence*, but the *locus* (perceptual vs. post-perceptual) is invisible to the data.
      4.  **Epistemic Payoff:** If experience is penetrated (label changes taste), it cannot serve as an independent justification for belief (circularity). If it's just bias (label changes report), experience remains neutral but we are unreliable reporters. Either way, "How it looks" is compromised as evidence.

  ### **Failure Modes & Mitigations**

  1.  **Hypothesis Guessing ("It's all the same juice!"):**
      *   *Risk:* A student guesses early, contaminating the room.
      *   *Fix:* The Pourer is empowered to say, "Your job is to record the experience, not the physics. Even if it's water, does the label change the water?" If they persist, assign them the role of "Devil's Advocate" for the debrief to argue that *knowing* it's juice invalidates the data (which it doesn't, retrospectively).
  2.  **Order Effects Too Weak (Data looks flat, not backwards):**
      *   *Risk:* Palate fatigue isn't strong enough to override the label bias.
      *   *Fix:* Instruct the Pourer to pour Cup 2 only after *everyone* has finished Cup 1 (introducing a time delay). This increases fatigue/boredom for Cup 2, strengthening the Order confound.
  3.  **Non-Tasters as Furniture:**
      *   *Risk:* Pourer/Scribe feel like assistants.
      *   *Fix:* Explicitly frame them as "Experimental Controls." The Pourer holds the truth; the Scribe holds the record. Without them, the Tasters' data is anecdotal. During debrief, ask them: "Did you see any physical difference in the pour?" (No). "Then where did the difference come from?" (The Tasters' minds).
  4.  **The "Saw vs. Said" Stall:**
      *   *Risk:* They agree bias exists but refuse to argue about *where*.
      *   *Fix:* Force the choice. "Raise your hand if you think the liquid *actually tasted* different. Keep it up if you think you just *felt pressured* to write a different number." Count the hands. The split is the philosophy.

  ### **The Hard Limit (Instructor Note)**
  You must be straight with them: **This activity cannot distinguish perceptual change from judgmental change.** It proves that cognition influences *reports* of experience. It does not—and cannot—prove that cognition influences the *content* of experience. That distinction is introspectively opaque and empirically inaccessible in this setup. If you claim this demo proves penetration, you are lying. It proves *influence*. The locus is the philosophical battle, not the scientific result.

  Verdict: Influence confirmed; perceptual locus remains indeterminate.
