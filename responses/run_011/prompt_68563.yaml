answer: |-
  ### 1. Core Loop & Bookkeeping Repair

  **Verdict:** The core loop is mathematically sound but operationally fragile for 20 undergraduates with mixed numeracy over 20 rounds. I am **repairing** the bookkeeping and round count to ensure the lesson survives contact with reality.

  **Repairs:**
  1.  **Round Count:** Reduce from 20 to **15 rounds**. Twenty rounds creates administrative drag; 15 is sufficient to show mean/median divergence without exhausting the 90-minute window.
  2.  **Integer Arithmetic:** To avoid half-tokens, implement a **"House Rounding" rule**: On a loss, if half the stake is not an integer, **round up**.
      *   *Example:* Stake 3 tokens. Loss = 1.5 tokens. Player loses 2.
      *   *Why:* Rounding down allows a player with 1 token to bet 1, lose 0 (rounded from 0.5), and become immortal. Rounding up ensures ruin is possible and keeps tokens integral.
  3.  **Ruin Protocol:** A player hitting 0 tokens is immediately "Busted."
      *   **Job:** They become a **Floor Auditor**. They collect bet sheets from 4 other players, verify the arithmetic, and report the Mean/Median to the board.
      *   **Re-entry:** After 3 rounds of auditing, they receive a **"Bailout Grant" of 32 tokens** (25% of start) and rejoin the betting. This prevents idle time and distorts the mean less than a full reset.
  4.  **Audit Trail:** Each player receives a **Bet Sheet** (15 rows). Columns: *Start Bankroll | Stake | Coin Result (W/L) | Loss Amount (if L) | End Bankroll*.
      *   *Instructor Check:* Floor Auditors sign off on sheets. You spot-check 3 random sheets at the end.

  ### 2. Game Logistics

  **Tokens:** 256 poker chips or printed paper chits per student (Start 128, max possible growth $\approx 128 \times 2^{15}$ is impossible, but 256 covers reasonable wins).
  **Chance Device:** A single large coin or a deck of cards (Red = Win, Black = Loss). Shuffle deck thoroughly every 5 rounds to maintain faith in $p=0.5$.
  **Value:** **1 Token = 1 Raffle Ticket.** At the end, put all tokens in a box. Draw one ticket. The holder wins a **$20 Coffee Gift Card**.
  *   *Why:* This linearizes the utility of the tokens for the final payoff (risk-neutral over the raffle) while allowing the *process* to demonstrate risk-aversion via ruin. It avoids the "I won $5, who cares?" problem.

  **Role Cards (Deal 4 random cards at start):**
  1.  **The Pensioner:** "You must pay 8 tokens to the bank at the end of *every* round to cover living costs. If you cannot pay, you are Busted immediately."
      *   *Target Behavior:* Forced to seek growth to survive; betting 0 guarantees death in 16 rounds.
  2.  **The Ranker:** "Your payoff depends *only* on whether you have the highest bankroll in the room at Round 15. Absolute wealth does not matter."
      *   *Target Behavior:* Incentivized to over-bet (high variance) to beat the pack, ignoring ruin risk.
  3.  **The EV Tourist:** "You play only Round 1. Your payoff is calculated based on the *Expected Value* of your bankroll after Round 1, regardless of the actual coin flip."
      *   *Target Behavior:* Incentivized to bet 100% (maximizes EV), then stop betting. They stay as observers.
  4.  **The Skeptic:** "You are told privately that the coin may be biased, but not how. You are not penalized for sitting out."
      *   *Target Behavior:* Likely to bet small or zero initially to gather data, underperforming the growth optimalizers early.

  ### 3. Timeline (90 Minutes)

  *   **00–15: Setup.** Distribute tokens, sheets, and role cards. Explain rules (Win +Stake, Loss -Half Stake rounded up). Explain Raffle payoff.
  *   **15–60: The Game (15 Rounds).**
      *   Each round takes ~3 minutes.
      *   Minute 0-1: Write Stake.
      *   Minute 1-2: Flip Coin (Publicly).
      *   Minute 2-3: Update Sheets. Floor Auditors (busted players) calculate Mean/Median and write on Board.
  *   **60–70: Data Aggregation.** Collect sheets. Final Mean and Median on board.
  *   **70–80: Closing Phase (Ensemble vs. Time).** Handout calculation worksheet.
  *   **80–90: Debrief.** Theory, Role Reveal, Epistemic Honesty.

  ### 4. Closing Phase: Ensemble vs. Time

  Do not lecture this yet. Have them compute it.
  **Handout Task:**
  1.  **Ensemble Average:** Look at the Board's final **Mean** bankroll. Divide by 128. This is the "Average across people."
  2.  **Time Average:** Pick your own sheet. Calculate your **Geometric Mean Multiplier**.
      *   *Instruction:* "Multiply all your round-by-round multipliers together (e.g., if you doubled, multiplier is 2; if you lost half, multiplier is 0.5). Take the 15th root of that product. This is your 'Average per round'."
      *   *Simplification for non-log students:* "Count how many Wins ($N_w$) and Losses ($N_l$) you had. Calculate $(2^{N_w} \times 0.5^{N_l})^{(1/15)}$."
  3.  **Comparison:** Compare the class Ensemble Growth Rate vs. your personal Time Growth Rate.

  ### 5. Debrief Script & Interventions

  **Step 1: The Divergence (5 mins)**
  *   **Action:** Point to the Board. Mean is likely $> 200$. Median is likely $< 128$.
  *   **Script:** "The average person in this room lost wealth. The average wealth in this room grew. Which average represents *your* experience?"
  *   **Concept:** Ensemble Average (across players) $\neq$ Time Average (across rounds for one player).

  **Step 2: The Optimal Fraction (10 mins)**
  *   **Action:** Ask who bet roughly 50% every round. (You should be one of them).
  *   **Script:** "The math says betting 50% maximizes the rate at which your bankroll grows over time. Betting 100% maximizes Expected Value. Betting 0% preserves capital. Why did the 50% group generally end up with more than the 100% group, despite the 100% group having higher EV?"
  *   **Derivation:** Write on board: $0.5 \ln(1+f) + 0.5 \ln(1-0.5f)$. Show max is at $f=0.5$.
  *   **Note:** Since some don't know logs, explain intuitively: "Losses hurt more than wins help. To recover from a 50% loss, you need a 100% gain. Over-betting makes recovery mathematically impossible."

  **Step 3: Role Reveals (5 mins)**
  *   **Action:** Ask Role Card holders to stand.
  *   **Script:** "The Pensioner had to bet aggressively to survive. The Ranker had to bet aggressively to win the prize. The EV Tourist was rational to bet 100%. The 'optimal' bet depends on your constraints, not just the coin."
  *   **Point:** Rationality is contextual.

  **Intervention 1: The Lucky All-In Winner**
  *   **Scenario:** A student bet 100% every round, got lucky, and has the most tokens. They argue EV was the right metric.
  *   **Response:** "You are correct that for a *single* bet, EV maximization is rational if you don't care about ruin. You are also correct that you were lucky. If we played this game 100 times, and you used that strategy every time, how many times would you go bust? (Answer: Almost all). We are designing policies for *repeatable* decisions, not celebrating one-off luck."

  **Intervention 2: The "Greed is Bad" Moral**
  *   **Scenario:** Students conclude the lesson is "don't be greedy."
  *   **Response:** "Look at the Pensioner. If they weren't 'greedy' enough (didn't grow their bankroll), they died. Look at the Ranker. To win the prize, they *had* to take risk. This isn't about virtue; it's about matching your strategy to your payoff structure. Sometimes caution is suicide."

  ### 6. Instructor Role

  **Should you play?** **Yes.**
  **Stake:** **50% of bankroll every round.**
  **Why:** You are the **Control**. You demonstrate the "Growth Optimal" strategy visibly.
  *   If you win: It validates the theory.
  *   If you lose (due to variance): It shows that optimal $\neq$ guaranteed.
  *   *Crucial:* Do not comment on your results during the game. Let the data speak.

  ### 7. Predictable Failures & Fixes

  **Failure 1: Arithmetic Errors.**
  *   *Risk:* Students miscalculate 50% stakes or loss rounding, corrupting the data.
  *   *Fix:* The **Floor Auditor** system. Busted players have nothing else to do; make their job verifying the math of active players. Incentivize accuracy: "If you catch an error, you get 2 tokens."

  **Failure 2: The "Greed" Moralizing.**
  *   *Risk:* Students leave thinking "Risk is bad."
  *   *Fix:* Use the **Role Cards** in debrief. Explicitly highlight that the EV Tourist and Ranker were *rationally required* to take risks that look "greedy" to a growth maximizer. Emphasize **Objective Function**, not virtue.

  ### 8. Limitations & Epistemic Honesty

  **What this activity cannot reproduce:**
  1.  **Asymptotics:** 15 rounds is not infinity. The "Optimal" 50% fraction is only strictly optimal as $N \to \infty$. In 15 rounds, variance matters. A 60% bet might win this specific tournament.
  2.  **Consumption:** The game assumes reinvestment of all wealth. In real life, we consume. This changes the optimal fraction.
  3.  **Known Distribution:** Students know $p=0.5$. In reality, parameter uncertainty (The Skeptic's role) usually dictates smaller bets than Kelly.

  **Epistemic Notes for Debrief (Theorem vs. Disagreement):**

  *   **Theorem:** *Given* a utility function $U(W) = \ln(W)$, maximizing expected utility is mathematically identical to maximizing the expected geometric growth rate of wealth. *Given* a repeated bet with reinvestment, the strategy that maximizes the time-average growth rate is the same as the strategy that maximizes expected log utility.
  *   **Disagreement 1 (Normative):** Is Log Utility the *correct* goal? Standard Expected Utility Theory says you can have *any* utility function (e.g., linear, square root). If you have linear utility, you should bet 100%. Ergodicity Economics argues that for non-ergodic processes (like this game), time-averages are the only physically meaningful metric for a single agent, making Log Utility a physical necessity rather than a psychological preference. This is not settled.
  *   **Disagreement 2 (Framing):** Does the "Time Average vs. Ensemble Average" framing add new insight, or is it just a relabeling of Bernoulli's original resolution to the St. Petersburg Paradox using Log Utility? Some argue it's a profound shift in how we model risk; others argue it's standard probability theory dressed in new clothes.
  *   **Hidden Assumptions in this Game:**
      *   **Fair Device:** We assume $p=0.5$. If $p$ were unknown, the optimal bet is lower.
      *   **No Withdrawals:** We assume all wealth is reinvested. If you could withdraw winnings, the ruin risk drops, and optimal bet size changes.
      *   **Finite Horizon:** We stop at Round 15. If the game ended at Round 14, the optimal strategy might shift (dynamic programming).

  **Final Instruction to Instructor:**
  When you reveal the "Kelly Criterion" name at the very end, frame it as: "You just derived a famous result in information theory and finance without using the formula. You found that in a non-ergodic world, the average person does not experience the average outcome."
