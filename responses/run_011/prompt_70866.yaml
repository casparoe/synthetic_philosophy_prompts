  Two bits nag at me and I can't tell whether they're real problems or just my own slowness. The "psych yourself up and form the intention" line feels like it assumes you can intend on command, which I thought was the very thing in question — if that's right, the sidebar seems to dissolve the puzzle instead of stating it. And I've always been told weakness of will is a real, ordinary phenomenon, so a conclusion that it's "impossible in the strict sense" makes me suspect something got inflated along the way. I have no idea about the rest, tho — is the Newcomb comparison actually apt, or are these two puzzles doing different work? And is that follow-through story really Kavka's own response, or does it belong to somebody else in the same literature? I'll admit I find the ending appealing, which is probably a reason to distrust my own reaction to it.

