          1.  Rodent failure $\rightarrow$ Narrowed sensitive window.
          2.  Wild population failure $\rightarrow$ 'Controllability' moderator (claimed independently motivated).
          3.  Third failure $\rightarrow$ Assay contamination.
      *   **Successes:** One confirmed prediction (captive vs. wild), practical application (farmed fish mortality reduced).

  3.  **Evaluate the Moves (Lakatosian Lens):**

      *   **Move 1 (Marcus):** Claims degeneration. Every failure led to an *ad hoc* adjustment (window, controllability, contamination). None anticipated.
          *   *Analysis:* This is the standard Lakatosian accusation. If adjustments are made *only* to save the theory from falsification without novel predictions, it's degenerating.
          *   *Rating:* Mostly Right. It captures the *pattern* of degeneration, though it ignores Dana's counter about independence later.

      *   **Move 2 (Dana):** Claims positive heuristic. Controllability was independent (separate literature), predicted captive vs. wild *before* the study, study succeeded.
          *   *Analysis:* This is the crucial defense against *ad hocness*. Lakatos allows belt adjustments if they lead to novel facts. If the prediction was pre-registered or published *before* the result, it counts as progressive.
          *   *Rating:* Clearly Right (conditionally). If true, this is the definition of a progressive problem shift.

      *   **Move 3 (Marcus):** Dismisses Move 2. One prediction isn't enough for 15 years. "Captivity mucks up stress" was already a hunch (not novel content). Window-narrowing was reverse-engineered.
          *   *Analysis:* Marcus makes two points: (a) Ratio of success/failure matters (1 win vs. 3 losses), and (b) Novelty requirement (was the prediction truly novel or just systematizing common knowledge?). The reverse-engineering charge on the window is strong.
          *   *Rating:* Mostly Right. The "hunch" point attacks the *novelty* of the fact, which is key for Lakatos.

      *   **Move 4 (Dana):** "Most of biology looks like this." "No rival programme." Rational to keep working on it.
          *   *Analysis:* This is a category error. Lakatos distinguishes between *rationality of pursuit* and *methodological status*. A programme can be degenerating but still the best game in town (no rival). Calling it "degenerating" *does* work—it warns scientists not to expect truth-growth.
          *   *Rating:* Mostly Wrong. Conflates sociological rationality with methodological progress.

      *   **Move 5 (Marcus):** Distinguishes "rational to work on" vs. "progressive." You can rationally work on a degenerating programme hoping for a comeback.
          *   *Analysis:* This is the precise Lakatosian point. MSRP is a rational reconstruction, not a moment-by-moment verdict. A programme isn't "falsified" instantly; it degenerates over time. Rationality of pursuit persists even during degeneration if no better alternative exists.
          *   *Rating:* Clearly Right. This is the philosophical pivot point.

      *   **Move 6 (Dana):** Practical application (farmed fish). Protocols work.
          *   *Analysis:* Pragmatic success $\neq$ theoretical progress in Lakatos. Instrumentalism vs. Realism. The core could be wrong, but the heuristic yields useful tools. However, Lakatos does value "empirical content." If the protocol works *because* of the theory, it's support. If it works for other reasons, it's not.
          *   *Rating:* Mixed. Practical success is evidence, but not definitive proof of the *hard core's* truth or the programme's theoretical progress.

      *   **Move 7 (Marcus):** Protocols $\neq$ Core support. Confounding variables (handling, regression to mean, other farm practices).
          *   *Analysis:* Standard underdetermination objection. Just because the intervention works doesn't mean the *explanation* (the core) is correct.
          *   *Rating:* Mostly Right. Correctly identifies that instrumental success doesn't validate the specific theoretical mechanism.

  4.  **Analyze Interactions & "Talking Past":**
      *   **Move 4 vs. Move 5:** Dana thinks "No rival = Progressive/Valid." Marcus thinks "No rival = Rational to pursue, but can still be Degenerating." Marcus is philosophically sharper here. Dana conflates *status* with *strategy*.
      *   **Move 2 vs. Move 3:** They fight over the definition of "Novel Fact." Dana says "Predicted before study." Marcus says "Everyone already knew it." This is a factual dispute about the state of the field, not just philosophy.
      *   **Move 6 vs. Move 7:** Instrumental success vs. Theoretical validity.

  5.  **Assess Adjudication (Missing Facts):**
