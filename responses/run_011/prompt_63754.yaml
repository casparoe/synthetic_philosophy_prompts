      *   Address the four specific points (Inference, Rival Evidence, Coherence, Binary/Underdetermination).
      *   No labels without analysis.

      *(Self-Correction on Point 1)*: The user asks about the relation between prose and person. I need to highlight the assumption of *transparency*. The policy assumes style transparently reveals origin. Your story proves style can *opaque* origin (mimicry or artistic flattening).

      *(Self-Correction on Point 3)*: The "unpublished" vs "authorship" trust gap is key. Why trust one and not the other? Because one is verifiable by database search (external), the other is internal. The policy privileges external verification over internal testimony.

      *(Self-Correction on Point 4)*: "Philosophically underdetermined." This means multiple theories lead to the same practice. E.g., Economic protectionism vs. Essentialist Humanism. Both say "No AI," but for different reasons. I need to point this out.

