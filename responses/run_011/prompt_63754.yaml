              3.  "Neutral screen" vs. "Final verdict." (Screens suggest further review; verdicts end inquiry).
          *   *Analysis:* The policy promotes a *defeasible* inference (probabilistic output) to an *indefeasible* status (policy trigger). This is a category error. It treats a heuristic as an ontology.

      *   **Prompt 4: The Binary & Hybrid Cases.**
