      *   **The Core Incident:** A story was rejected by a literary quarterly because an AI classifier flagged it as AI-generated. The writer knows it's human-written (notebooks, drafts exist). The classifier flagged the *deliberately flat, repetitive prose* (an artistic choice depicting grief) as machine-like, while baroque sections scored as human.
      *   **The Task:** Reconstruct the magazine's policy's presuppositions. Be exact about the difference between what it *requires* and what *sits well* with it. Address four specific areas:
          1.  The nature of the inference (from what to what, conditions for validity).
