          *   *Analysis:* The user's experience (flat prose = AI) challenges Commitment 2 & 3. If an artistic choice (flatness) looks like a machine habit, the "involuntary" marker is confounded by "voluntary" style. The policy collapses these: it assumes statistical rarity = human, statistical average = machine.

      *   **Prompt 2: Rival Theories of Evidence.**
          *   *Base Rate Neglect:* The policy ignores the prior probability (how much AI is actually in the slush pile). It treats the classifier's score as a likelihood ratio without the base rate.
