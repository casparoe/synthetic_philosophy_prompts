prompt: |-
  I'm giving a 30-minute paper at my department's political theory works-in-progress thing in a couple of weeks, and then there's like 40 minutes of discussion afterwards, which is the part I'm actually scared of. The paper is on Rousseau's letter to d'Alembert about the theatre — you know, the 1758 one written against d'Alembert's Encyclopédie article on Geneva, where he proposes they set up a theatre there and keep it in line with good laws. My thesis is basically that the Letter is not an aesthetic argument and not primarily a censorship argument either, it's an institutional substitution argument: Rousseau's claim is that a republic the size and habits of Geneva has a fixed budget of civic energy, and any institution that spends it on spectatorship leaves less for participation, so the question isn't whether plays are good or bad art but what they crowd out and what could be put in their place instead. Which is why the famous bit near the end, where he says something to the effect of plant a stake crowned with flowers in the middle of a square, gather the people around it, and they'll be their own spectacle, is the conclusion of the argument rather than a decorative flourish.

  Three steps, roughly: (1) he concedes theatre can be perfectly fine — for Paris, a huge already-corrupt city full of idle people, where it does comparatively little harm; (2) so the case against Geneva is comparative and practical — the taxes and luxury a playhouse drags in, the idleness of a city that's supposed to work, the status of actors, the way the stage amplifies women's influence over taste; (3) therefore the answer isn't "ban plays", it's "build the cheaper, more participatory thing instead".

  Audience: one early-modern French lit person who knows the Letter cold and will happily quote it back at me; a senior guy in liberal political theory who has written about Rousseau as a forerunner of totalitarian democracy and will think I'm laundering him; two democratic theorists who work on civic infrastructure and are broadly on my side but will want the mechanism stated more precisely; an Enlightenment historian who mostly cares about the quarrel with the philosophes and with Voltaire; and a visiting philosopher of art who thinks instrumentalist arguments about art are a non-starter.

  Give me the objections I'll actually get from these people, in roughly the order they'll come and how damaging each one is, phrased the way each of them would phrase it — the lit person's and the art person's will sound nothing alike — with a two-minute reply and a note on where the reply is soft or where I'm reading the text against the grain. Then tell me the question I'm praying nobody asks, plus the fallback position I retreat to if it does. I already plan to concede up front that Rousseau does want actors kept out of Geneva and does write genuinely awful things about women, so dont spend your best shots there — I want to know where the substitution reading is vulnerable as a reading, not just where Rousseau is unpleasant. And be straight with me about confidence: seperate out the objections you're sure people in this literature actually press from the ones you're constructing yourself. If you think my thesis just misreads the Letter — that the stuff about representation is the real argument and I've turned it into a wonk piece about attention budgets — say that first and argue for it, don't politely play along.
