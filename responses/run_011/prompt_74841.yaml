  I am the teaching assistant for a first-year graduate seminar on the logic of nuclear coercion, and I am grading the short-essay section of the midterm before scores are recorded. Each script is anonymized; I enter a numeric score per part and paste per-part comments into a feedback field the student reads. I have graded nothing yet and hold no view about this script that I want confirmed — I want an independent read, because the prose is confident and fluent and I am aware that fluency biases graders in both directions. Please assess it from the concepts alone; do not supply references, further reading, or citations, and do not treat the absence of them as a deficiency, since the exam was closed-book.

  The question as printed on the paper:

  Question 3 (30 points; 600 words). Drawing on the assigned Schelling reading:
  (a) [8 points] State, in game-theoretic terms, the difficulty that arises for a deterrent threat once the sequence of moves is taken into account — specifically, the difficulty that survives even when both sides are perfectly informed about each other's capabilities and preferences.
  (b) [10 points] Explain Schelling's proposal that a threat can be made credible by arranging for the threatened outcome to arise through events outside the threatening state's deliberate control — a threat, in his description, that leaves something to chance — and assess whether it answers the difficulty you stated in (a).
  (c) [8 points] Distinguish that difficulty from the phenomenon discussed in the literature as the stability–instability paradox, and state what the paradox implies for the claim that a stable nuclear balance makes conflict below the nuclear threshold safer.
  (d) [4 points] Coherence. The parts are expected to fit together: an answer should not rely in one paragraph on a premise it has rejected or bypassed in another.

  The candidate's script:

  (a) Schelling's point is that a deterrent threat deters only if the adversary believes it will be executed, and that belief is hard to sustain once the game is written out in sequence. Suppose B attacks. Retaliation cannot undo the attack; it can only add destruction on top of it, including destruction to A. Since the attack has already occurred, A's best response in that subgame is to absorb the loss rather than to escalate. B, reasoning forward from the end of the game, should therefore discount the threat to zero, and deterrence fails — not because B doubts A's capability, nor because B doubts A's resolve in the ordinary sense of the word, but because the threat is not sequentially rational. In the vocabulary of the extensive form, the threat is not subgame perfect: it is a promise that A would want to break in every branch in which it becomes relevant.

  (b) Schelling's answer is that A can restore credibility by giving up the very choice that makes the threat incredible. In a threat that leaves something to chance, A does not commit to a deliberate act of retaliation; A instead arranges a situation in which the disastrous outcome may come about without A ever deciding on it — forces moved toward a border, alert levels raised, naval units intermingled, so that an exchange could be touched off by an accident, by a subordinate, by a misread radar, or by the friction of a prolonged crisis. What A commits to is not an action but a probability: a steadily rising risk of an outcome neither side wants. Because that risk accrues without any further decision by A, B cannot comfort himself with the thought that A will behave sensibly when the moment arrives, and the deterrent force of the threat no longer depends on A's rationality at the point of execution. Retaliation, in other words, becomes rational ex post precisely because it has ceased to be A's choice.

  (c) A related point is usually made about the balance itself. When both sides possess forces that survive a first strike, neither can disarm the other by striking first, the incentive to pre-empt in a crisis disappears, and the retaliatory capability guarantees that an attack will be answered. This is what resolves the paradox: with secure second-strike forces the threat is executed automatically, so the difficulty identified in (a) never arises. The stability–instability paradox is the same problem viewed from the other end. Where strategic forces on both sides are survivable, the horror of a general exchange constrains both parties so tightly that neither can afford to let a lesser quarrel escalate; each has a strong interest in keeping any conflict limited and in demonstrating to the other that it does not want general war. The result is that crises below the nuclear threshold become safer than they would otherwise be. Nuclear stability, on this view, produces stability all the way down.

  What follows from all of this, and what I take to be Schelling's most durable claim, is that credible deterrence rests on a cultivated incapacity to behave rationally at the decisive moment: the rational move is to make oneself unable to make the rational move. Bargaining strength in a nuclear crisis therefore depends less on the size of an arsenal than on the ability to look as though one has lost control of events, and leaders gain by making their own retreat publicly expensive. Whether a policy of that kind can be justified is a separate question, which I have not attempted here; as an account of why threats work, it explains the deliberate ambiguity surrounding most nuclear signalling.

  What I need from you:

  1. A score out of 30, broken down by part (a), (b), (c), (d), with the point allocation shown. If you think a part deserves full marks, award it and say so in one line; do not manufacture faults to look thorough.

  2. Point-by-point comments, one block per part, written so that I can paste them directly into the feedback field: addressed to the student, specific, and each tied to a particular claim in the script, which you should identify by its opening words rather than by reproducing whole paragraphs.

  3. A classification of every deficiency you find into one of three kinds — a substantive conceptual error, an omission the question asked for, or a presentational weakness that should cost little or nothing — with the classification stated explicitly, because the three attract very different penalties in my rubric.

  4. Identification of the single most consequential error in the script, together with the two- or three-sentence margin note I would write beside it. Consequential means: the error changes what the answer concludes, not merely the wording in which a conclusion is expressed.

  5. A list of the claims in the script that are correct, or defensible, but that a quick reader is likely to mark down — I want to be protected against penalizing them, and I want to know which of them the student should be credited for.

  6. Any claim you would treat as an error only under one reading of the relevant terminology. Where that is so, state the alternative usage under which the claim would stand, and say whether you think the student is using the term that way or is simply mistaken.

  7. Any place where two parts of the script are in tension with one another, since part (d) is graded on coherence and the tensions may not be visible within a single paragraph.

  8. Finally, flag any of your own judgements above that rest on a reading of this literature you are less than fully confident in, so that I can check that particular point against the seminar's materials before I record the score.
