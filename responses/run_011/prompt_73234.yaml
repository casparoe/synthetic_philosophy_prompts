  2. Point at the single sentence or feature of the scenario doing all the work. Then tell me what happens if I remove it. Specifically: does the case collapse if division A is allowed to keep an exploration budget, like a bandit that spends 10% of the resource trying random allocations? I genuinely want to know whether that patches it, or whether there's a difference in kind between exploring a hypothesis space you wrote down yourself and a process where the hypotheses get generated by the participants.
  3. The two best moves a smart defender of Lange would make against this case. Real ones, not a strawman I can knock over.
  4. An honest audit: did you sneak the verdict in anywhere? If the scenario only works because of an assumption you made quietly along the way, name it and tell me how much it costs to give it up.
