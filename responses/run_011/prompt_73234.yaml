  Specs for the scenario — please check each of these explicitly at the end so I know you actually hit them:

  - Setting is inside one large company, present day. No sci-fi, no AGI, no weird tech. Two divisions allocate the same scarce resource over one quarter: division A by a central optimiser, division B by an internal market with transfer prices.
  - Division A's optimiser is about as good as a strong OR/ML team can build today, and it gets strictly more than a fair share: complete telemetry from every machine and team, ground truth on demand, and it re-solves nightly so it's never stale.
