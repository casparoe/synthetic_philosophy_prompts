  - Then B finds something worth a lot that A cannot find — and this is the key constraint — B finds it *not* because it aggregated scattered information better. A has all the information. B finds it because a price let one person act on a half-baked local idea without having to convince anyone at the centre that the idea deserved to be represented in the model. It should be mundane enough that an ordinary employee could hit on it in an afternoon.

  Keep the scenario itself under about 400 words.

  Then the analysis. Please do not give me a history lecture, I can get that anywhere — background on the debate should be a few sentences max. What I want is:

