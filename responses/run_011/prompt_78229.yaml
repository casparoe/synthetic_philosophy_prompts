      *(Self-Correction during drafting)*: In Move 4, Owen claims victory because Nadia admits morality exists outside convention. But Nadia's point was that *this* convention aligns with morality. Owen wins the meta-argument, but does he win the jaywalking argument? I need to be careful not to let Owen's philosophical win obscure the fact that Nadia is still right about jaywalking. I will rate Move 4 as Owen being "Clearly Right" on the logic, but note it's a divergence from the practical issue.

      *(Refining the "Missing" part)*: They are missing the concept of *predictability* as a moral good in itself, independent of immediate harm. Also, the legal liability aspect (if Owen gets hit jaywalking, it affects roommates/insurance/housing). But philosophically, the missing piece is the difference between *conventionalism* and *rule-utilitarianism*. Nadia is arguing Rule-Utilitarianism (follow the rule because the system works better), Owen is arguing Act-Utilitarianism (follow the rule only if this specific act causes harm).

