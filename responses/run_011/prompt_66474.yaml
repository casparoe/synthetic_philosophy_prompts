answer: |-
  Friends, neighbors, workers. Thank you for filling this room.

  I still work the register on Saturdays. I scan the bread, I take the cash, I look people in the eye. It keeps me honest. It reminds me that after forty years, this place is still about food going into bodies, not numbers going into accounts.

  Look up at the deli counter. You'll see the framed index cards from 1985. Two hundred members lent this store money at zero percent because they needed a place to buy flour. They didn't invest for a return; they invested for a shelf. They understood that money is a tool, not a master. That rule is scratched into the lid of the wooden cash box by the door.

  Six weeks ago, we signed a new deal. Four million dollars from our friends at the impact fund to buy the distributor and build the kitchen. It's a good deal. It secures our supply. It creates jobs. But it also means we are borrowing from outside for the first time. It means we have promised a six percent annual return. It means there is a seat at this board table for capital that expects to grow.

  I know what some of you are feeling. It feels like the streak is broken. It feels like we are stepping over a line the founders drew in pencil and blood.

  I spent six years in a philosophy program before I came home to work here. I didn't finish, but I learned enough to know there are two ways to get things. There is the getting a household does to feed itself. That has a limit. You only need so much bread. Then there is the getting whose only point is more money. That has no limit, because money isn't the kind of thing you can ever have enough of.

  For forty years, we tried to stay in the first category. We focused on the proper use of things. A shoe is made to be worn. That is its nature. You can trade a shoe, but trading isn't using it as a shoe. Food is made to be eaten. Money is made to facilitate that exchange. It has no value by nature. It exists only because we agreed on it as a stand-in for need. Need is what holds a city together. Not profit.

  So, what do we call this new deal? The term sheet calls it "patient capital." I've been turning that phrase over in my head. Money doesn't wait. Money doesn't have patience. People have patience. When we say capital is patient, what we mean is that we are agreeing to wait for it. We are agreeing to let it breed.

  There is a old idea that the most detestable way of getting wealth is where money makes money. Money was invented for exchange, not for breeding. When money breeds, it forgets the shoe. It forgets the bread. It forgets the need.

  I am not standing here to apologize for this deal. We need the kitchen. We need the leverage. But I am standing here to say that we cannot pretend this is the same as the index cards. The index cards were about use. This is about growth. And growth, unchecked, becomes its own master.

  To our partners from the fund: thank you. You are giving us a tool. We accept it. But we will judge it by the same standard we judge ourselves. Does it feed the household? Or does it just feed itself?

  To my friends from grad school sitting in the back: I know you're listening for the Greek. I'm not going to give it to you. The theory doesn't matter. The bread matters.

  To everyone else: The risk isn't the loan. The risk is forgetting the difference between the tool and the hand that holds it. If we let the return become the point, we lose the store. If we keep the need as the point, the money stays a tool.

  So here is what I want us to do. Not a pledge, not a vote. Just a practice. When you shop here, don't look at the price first. Look at the source. When you work here, don't look at the margin first. Look at the quality. And when we meet to review that six percent return, let's ask the only question that matters: Did this help us feed the household, or did it just feed the money?

  We are forty years old. We are old enough to know better. We are old enough to know that a shoe is for walking, not for trading. Let's walk together. Let's go to work.

  Thank you.
