  2.  **Deconstruct the Philosophical Claims & Map to Co-op Context:**
      *   *Claim 1 (Limit vs. No Limit):* Household getting (food, shelves) has a limit (you only eat so much). Money getting has no limit. *Application:* We grew to feed people (limit), but this deal is about growth for growth's sake? No, frame it as needing tools to sustain the limit.
      *   *Claim 2 (Shoe/Proper Use):* A shoe is for wearing. Trading it is secondary. *Application:* Food is for eating. Money is for facilitating that. When money becomes the goal, we lose the shoe.
      *   *Claim 3 (Money as Convention/Need):* Money isn't natural; need is. Community holds us together. *Application:* The index cards were about need/trust, not market value.
