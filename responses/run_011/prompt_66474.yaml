      *   **Conflict/Tension:** Co-op never borrowed externally before. 1985 founders turned down bank loans, used member loans at 0% on index cards (framed in deli). Founding rule: "Money is a tool, not a master." This deal breaks the streak. Needs to be honest about this without apologizing excessively or denouncing the fund reps.
      *   **Philosophical Framework (Aristotle):** Must embed 4 specific claims without explicit citation/Greek terms:
          1.  *Oikonomia* vs. *Chrematistike* (Household getting for use/natural limit vs. getting for money's sake/no limit).
          2.  Proper use vs. Exchange use (The shoe example: wearing vs. trading).
          3.  Money has no natural value, it's a convention/stand-in for need (Need holds city together).
