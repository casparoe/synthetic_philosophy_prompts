      *   **Part 4: Underdetermination.** Where the theory is silent.
      *   **Part 5: The Rebuild.** What breaks (provenance, dispute, nuance).
      *   **Conclusion:** Summary of the commitment.

  7.  **Checking Constraints:**
      *   British English? (Yes: *organisation, licence, centre, modelling*.)
      *   No citations? (Yes.)
      *   Strict separation of requirement/compatibility? (Yes.)
      *   Address the "provisionally-same" category error? (Yes, by framing it as epistemic.)

  8.  **Final Review of the "Contentless Tag" thought experiment:**
      *   If names are contentless tags, merging based on similarity is dangerous. Similarity isn't identity.
      *   If I merge "John Smith (poet)" and "John Smith (blacksmith)" because the string similarity is high or context is vague, I lose the ability to separate them later.
      *   Current system survives because it treats the *link* between names and items as a claim, not a fact.
      *   The "untouched" part: The user interface of search. Users type a tag, they get a page. That abstraction remains.

  9.  (Self-Correction during drafting): Make sure to explicitly address the "P460" issue. Why does it exist if identity is binary? Because the *database* reflects the *editors' knowledge state*, not the world directly.

  10. (Final Polish): Ensure the tone is analytical and respects the user's philosophical sophistication. Avoid talking down. Use clear headings.

