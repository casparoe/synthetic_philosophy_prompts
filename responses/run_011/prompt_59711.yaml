  *Wait, one nuance:* The user asks about "names contributing nothing but its bearer". This is the Millian view. If WP acted purely Millian, P460 wouldn't exist. The existence of P460 proves the system is *not* purely Millian in the backend, even if the frontend acts like it. I need to highlight this split.

  *Another nuance:* "Provisionally-same". The user calls it a category error. I need to defend it as an *epistemic* category, not an *ontic* one. The item isn't "half-merged", the *claim* is "unverified".

