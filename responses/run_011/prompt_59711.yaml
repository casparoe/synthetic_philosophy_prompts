answer: |-
  You have put your finger on a genuine architectural tension, but it is not necessarily a contradiction. It is, rather, the friction between a presentation layer designed for human reading and a data layer designed for machine queryability. To reconstruct the implicit theory, we must separate the ontology of the *world* from the ontology of the *archive*.

  ### 1. The Implicit Theory: Bibliographic Realism

  The operating theory of Wikipedia and Wikidata is not metaphysical realism (that there is a fact of the matter about the world which we mirror) nor is it pure nominalism (that names are arbitrary tags). It is best described as **Bibliographic Realism**.

  On this view, the primary object of reference is not the flesh-and-blood entity in the world, but the **topic as constituted by reliable sources**.

  *   **What the practice requires:**
      1.  **Stability of Reference:** There must be a stable identifier (an article title or a Q-number) that allows multiple statements to be collated.
      2.  **Source Authority:** Identity claims are not settled by logic or direct access to reality, but by the weight of published authority. If reliable sources say 'A is B', then for the purposes of the archive, A is B.
      3.  **Epistemic Fallibility:** The archive must accommodate the possibility that the sources are wrong, or that they disagree.

  *   **What is merely compatible:**
      1.  **Metaphysical Identity:** The system does not require that Samuel Clemens *actually be* Mark Twain in a metaphysical sense, only that the sources treat them as one.
      2.  **Sense and Reference:** It does not matter whether names have 'sense' (Frege) or are just 'tags' (Mill). The system treats them as access paths. Whether those paths have semantic content is irrelevant to the redirect mechanism, though it matters for the 'disambiguation' mechanism.

  ### 2. The Tension: Wikipedia vs. Wikidata

  Your suspicion that the titling rule and the Wikidata merger practice pull in different directions is correct, but they are pulling towards different goals.

  **Wikipedia (The Narrative Layer)**
  Wikipedia operates on a principle of **Narrative Unity**. For a human reader, an article that says 'It is disputed whether A is B' is harder to read than one that says 'A, also known as B, did X'.
  *   **The Move:** Wikipedia resolves epistemic uncertainty by consensus. If the majority of sources treat two names as one person, the article merges them.
  *   **The Implication:** The article title is not the 'true name' of the object; it is the **canonical access key**. The redirect is not a claim that the names are synonymous; it is a claim that the *topics* are identical.
  *   **Why P460 doesn't appear here:** Wikipedia prose can qualify identity claims ('Some historians argue...'). It does not need a structural flag because natural language handles the doubt.

  **Wikidata (The Ontological Layer)**
  Wikidata operates on a principle of **Structural Integrity**. It is a database. In a database, merging two records is a destructive operation. If you merge Q1 and Q2, and later discover they are distinct, un-merging is difficult and lossy (statements get tangled).
  *   **The Move:** Wikidata preserves epistemic uncertainty in the structure. P460 ('said to be the same as') is not a claim that the objects are 'provisionally identical' in reality. It is a claim that **the identity claim is provisional in the literature**.
  *   **The Implication:** This is not a category error. It is a distinction between *identity* (an ontological relation) and *identification* (an epistemic act). P460 records that an identification has been proposed but not yet accepted as a basis for merging records.

  **Reconciliation:**
  There is no inconsistency because the two layers serve different masters. Wikipedia sacrifices ontological precision for narrative flow; Wikidata sacrifices narrative flow for ontological precision. The 'move' that reconciles them is that **Wikipedia articles are views generated from Wikidata items**, but they are allowed to collapse uncertainty that Wikidata must preserve.

  ### 3. Underdetermination

  There are significant areas where the editing behaviour is underdetermined by the theory. This explains why the theory remains buried; you can hold incompatible philosophical views and still edit correctly.

  *   **The Status of the 'Thing':** An editor can believe they are cataloguing real-world entities (Realism) or that they are cataloguing concepts in human discourse (Constructivism). Both will create the same Q-item for 'Sherlock Holmes' (fictional character) and 'Arthur Conan Doyle' (author). The system does not force you to decide if 'Sherlock Holmes' exists in the same way 'Doyle' does, only that they have different properties (P31: human vs fictional character).
  *   **The Nature of the Name:** An editor can treat 'Mark Twain' as a rigid designator (picking out the same man in all possible worlds) or as a cluster of descriptions (the man who wrote *Huckleberry Finn*). The redirect system works identically in both cases. The system is neutral on the philosophy of language, provided the editor follows the style guide.
  *   **Identity Conditions:** The system does not define *what makes* two things the same. Is a person the same entity after a total memory wipe? Is a nation the same entity after a revolution? The system outsources this to the sources. If sources say 'France (1900)' and 'France (2000)' are the same country, Wikidata treats them as one item. If sources distinguish 'East Germany' and 'Germany', they get separate items. The theory of identity is imported, not generated.

  ### 4. The Rebuild: Contentless Tags and Irreversible Merging

  Let us imagine the rebuild you propose. We treat names as contentless tags (pure IDs). We merge any two records above a similarity threshold. Merging is irreversible. There is no P460.

  **What Breaks:**

  1.  **Provenance and Attribution:**
      Currently, if Source A calls him 'Clemens' and Source B calls him 'Twain', we can track which source used which name. If names are contentless tags merged into a single ID, we lose the ability to query 'What did sources call him at the time?'. The history of the naming is obliterated by the merge.
      *   *Commitment revealed:* The current system is committed to the idea that **the name used is data**, not just a key.

  2.  **Dispute Resolution:**
      Without P460, if two editors disagree on identity, one must be 'wrong'. In the current system, they can agree that the identity is 'disputed' and keep the items separate pending further evidence. In the rebuild, a merge is a victory condition. This encourages gaming the system (stuffing evidence to hit the similarity threshold).
      *   *Commitment revealed:* The current system is committed to **fallibilism**. It assumes today's merge might be tomorrow's error.

  3.  **Homonyms and Context:**
      If names are contentless tags, 'John Smith' is just a tag. If the similarity threshold merges two 'John Smiths' because their birth dates are close, you have created a chimera. The current system uses disambiguation pages to keep homonyms separate *before* merging. The rebuild assumes similarity implies identity.
      *   *Commitment revealed:* The current system assumes **similarity is not identity**.

  4.  **Temporal Identity:**
      Consider a person who changes their name legally, or a country that changes its borders. In the current system, we can model 'Name: Clemens (until 1865), Name: Twain (after)'. In a contentless tag system with irreversible merging, the distinction between 'one person with two names' and 'two people with similar names' is lost once the threshold is crossed.
      *   *Commitment revealed:* The current system models **time and change** as properties of the entity, not just the record.

  **What Survives Untouched:**

  1.  **The Search Interface:**
      From the user's perspective, typing a string and landing on a page would work exactly the same. The 'lookup' function is agnostic to the backend theory.
  2.  **The Titling Convention:**
      Choosing the 'most common name' for the display title would remain. This is a usability heuristic, not an ontological claim.

  ### 5. Conclusion: What the Practice Commits To

  The fact that the rebuild breaks provenance, dispute resolution, and temporal modelling tells us exactly what the current practice is committed to.

  It is not committed to a specific theory of names (Millian vs. Fregean). It is committed to a **theory of evidence**.

  The existence of P460 and the reluctance to merge in Wikidata proves that the system treats identity claims as **hypotheses to be tested**, not facts to be recorded. The Wikipedia redirect system proves that the system treats **access** as a utility to be optimised, not a truth to be preserved.

  If you rebuilt it on contentless tags and irreversible merging, you would turn an encyclopedia into a ledger. You would gain efficiency but lose the ability to represent the *history of knowledge* about the thing. The current system survives because it recognises that we do not have direct access to the objects; we only have access to the descriptions. Therefore, the database must store the descriptions (and the disagreements about them), not just the objects.

  The 'provisionally-same' state is not a category error regarding the world; it is a precise category regarding the **catalogue**. The system presupposes that the map is not the territory, and sometimes we are not sure if two parts of the map depict the same patch of land. To merge them prematurely is to falsify the map's accuracy regarding our own uncertainty.
