          *   Wikidata Identity: Distinguishes between "same as" (P31/P214 etc. implying identity) and "said to be the same as" (P460). It allows for uncertainty/non-merging.
          *   The Tension: WP acts as if identity is settled (redirects merge access), while WD acts as if identity can be provisional or disputed (P460).
      *   **The Questions:**
          1.  Reconstruct the implicit theory of names and identity.
          2.  Separate what the practice *requires* vs. what it's merely *compatible* with.
          3.  Address the suspicion of inconsistency between titling/redirects and WD merging.
          4.  Identify underdetermined areas (where multiple theories fit the same behaviour).
          5.  Hypothetical Rebuild: What if names were contentless tags and merging was irreversible based on similarity? What breaks? What survives?
      *   **Constraints:** British English, no citations, focus on reasoning.

  2.  **Analyse the Implicit Theory (WP & WD):**

      *   *Wikipedia's Approach:* Pragmatic descriptivism. The "thing" is the *topic*, not the ontological object. The article is about the *concept* or *subject* as discussed in sources. If sources say "Clemens = Twain", the article treats them as one topic. The title is a label for the *entry*, not necessarily the *object*.
      *   *Wikidata's Approach:* Ontological realism with epistemic humility. Items represent distinct *entities*. Identity is a fact about the world, but our *knowledge* of that fact is fallible. P460 exists because editors might disagree or sources might be conflicting.
      *   *The Conflict:* WP collapses epistemic uncertainty into a single page for readability. WD preserves epistemic uncertainty in the data structure.
      *   *Theory of Names:* WP treats names as *access paths*. WD treats names as *properties of items*.
      *   *Identity:* WP assumes identity is transitive and settled *for the purpose of the article*. WD assumes identity is a claim that needs verification.

  3.  **Drafting the Reconstruction (Section by Section):**

      *   **The Implicit Theory:** It's not a pure Millian view (names are just tags) nor a pure Fregean view (names have sense). It's a *Bibliographic Realism*. The "object" is the *discussion in reliable sources*.
      *   **Requirement vs. Compatibility:**
          *   *Required:* Names must be stable enough to index sources. Identity must be assertable to collate sources.
          *   *Compatible:* Whether names have sense, whether identity is metaphysical or epistemic.
      *   **The Tension (WP vs. WD):** Is it inconsistent? No, it's a division of labour. WP is the *presentation layer* (narrative), WD is the *data layer* (ontology). WP resolves uncertainty by consensus for the sake of reading; WD records the uncertainty for the sake of data integrity.
      *   **Underdetermination:** We don't know if "Mark Twain" *is* Samuel Clemens metaphysically, or if they are just treated as one node in a knowledge graph. The editing behaviour is the same either way.

