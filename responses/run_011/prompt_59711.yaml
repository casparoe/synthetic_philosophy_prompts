          *   *The Title Selection:* Choosing the "common" tag still works for UX.
      *   *Conclusion on Rebuild:* The current system *requires* names to carry provenance (which source used which name). A contentless tag system loses the ability to model *conflict* about identity.

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful not to conflate WP and WD too much. The user sees a tension. I need to explain if it's a bug or a feature. It's a feature of the *architecture*. WP is for humans reading; WD is for machines querying.
