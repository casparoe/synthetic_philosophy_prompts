  I do few-shot metric learning for a living — prototypical networks, contrastive objectives, linear probes on frozen encoders, the whole toolkit — so I'm fluent in that vocabulary and don't need any of it explained back to me. Bongard's 100 problems keep getting waved around by people who think what my field does is fundamentally different from concept formation, and the most serious version of that complaint is the one out of Hofstadter's Copycat/FARG line: that solving a Bongard problem requires the space of descriptions itself to move while you're looking at it, with candidate features and candidate levels of granularity competing and reshaping each other, so there is no fixed hypothesis space being searched at all. Take that position as literally and charitably as you can and restate it in my vocabulary — embedding geometry, what a pretrained encoder can and can't linearize, amortized inference over a task distribution, probing, augmentation as a way of pinning down what varies. Then give me the residue report in three buckets: claims that are just things I already say in different words; claims I can only render by distorting my framework (say how badly); and claims with no counterpart in it at all. For that last bucket I want a verdict rather than diplomacy — is the missing piece real evidence my framework can't express concept formation, or is it evidence that they're describing a huge implicit search over features that a big enough encoder has already amortized, and its just dressed up in phenomenology? One concrete check: if I trained a linear probe on frozen CLIP embeddings for ten Bongard problems and got decent accuracy on some and total failure on others, do the two views predict different things about which ones fail, or are they empirically indistinguishable here?
