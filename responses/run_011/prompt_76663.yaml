  Here are two candidate principles derived from your data. The first is the **Principle of Exogenous Negentropy**, which accommodates all eight of your verdicts but requires a non-standard assumption about measurement. The second is the **Landauer-Bennett Orthodoxy**, which is the standard clean principle in the literature but forces you to abandon one of your core intuitions. Given your preference for a clean principle over a baroque one, I recommend the second.

  ### Candidate 1: The Principle of Exogenous Negentropy (Fits all 8 verdicts)
  This principle captures your specific commitment that correlation cannot be *generated* from equilibrium, only *consumed*.

  1.  **Equilibrium Constraint:** No net work can be extracted from a system initially in global thermal equilibrium, regardless of internal measurements or correlations formed. **(Motivated by D2, D3, D7, D8)**
      *   *Earns:* Explains why D2 (measurement at equilibrium) and D3 (ratchet at equilibrium) fail despite different mechanisms. It treats the generation of correlation as a thermodynamic expenditure equal to the work gain.
  2.  **Resource Conservation:** Work can be extracted if and only if the system utilizes a pre-existing low-entropy resource (exogenous correlation) that was prepared out of equilibrium. **(Motivated by D6)**
      *   *Earns:* Explains why D6 wins (the record is a battery) while D8 fails (the record is generated endogenously by the chain).
  3.  **Global Accounting:** The thermodynamic cost may be deferred to a successor or an external lab, but the total entropy production of the closed arrangement must be non-negative. **(Motivated by D5, D8)**
      *   *Earns:* Explains why D5 fails globally despite the demon's clean ledger, and why D8 fails despite the infinite deferral of the reset cost.

  ### Candidate 2: The Landauer-Bennett Orthodoxy (The Clean Principle)
  This is the standard formulation in information thermodynamics. It is more parsimonious regarding measurement but conflicts with your verdict on D2.

  1.  **Information is Fuel:** Work extraction is bounded by $kT \ln 2$ per bit of mutual information accessible to the demon. **(Motivated by D1, D6)**
      *   *Earns:* Quantifies the fuel source for D1 and D6.
  2.  **Measurement is Reversible:** Establishing correlation (measurement) between the demon and the gas is thermodynamically reversible and incurs no minimum entropy cost. **(Motivated by D4's distinction)**
      *   *Earns:* Distinguishes D4 (scrambling/erasure costs) from the act of measuring. *Note: This clause directly contradicts the logic required for D2.*
  3.  **Erasure is Dissipative:** Restoring the demon's memory to a blank state (or any state independent of the measurement) incurs a minimum cost of $kT \ln 2$ per bit. **(Motivated by D1, D4, D5)**
      *   *Earns:* Provides the specific mechanism for the "bill" in D1 and D5.
  4.  **Equilibrium contains No Fuel:** A demon in thermal equilibrium with its reservoir shares no accessible mutual information unless it is supplied externally. **(Motivated by D3, D7)**
      *   *Earns:* Explains the failure of blind mechanisms like the ratchet.

  ### Verdicts on Unlisted Cases
  Applying the **Landauer-Bennett Orthodoxy** (Candidate 2):

  *   **Case A: A demon whose memory is deliberately held colder than the gas.**
      *   **Verdict:** **Can win.**
      *   **Reasoning:** This is not a Maxwell's Demon scenario but a standard heat engine. The temperature gradient ($T_{mem} < T_{gas}$) constitutes a non-equilibrium resource (exogenous negentropy) independent of information processing. The demon can dump entropy into the colder memory at a lower energy cost than it extracts from the gas.
  *   **Case B: A demon that operates only during the last stretch before heat death, when there is nobody left to collect.**
      *   **Verdict:** **Cannot win.**
      *   **Reasoning:** "Heat death" implies a state of maximum entropy and uniform temperature (global equilibrium). Per Clause 4, there are no accessible correlations or gradients to exploit. The absence of an observer ("nobody left to collect") is irrelevant; the thermodynamic constraint is on the physical state of the system, not the presence of a ledger-keeper.

  ### Incompatibility Statement
  The **Landauer-Bennett Orthodoxy** cannot accommodate **D2** (and by extension, **D8**).
  *   **The Conflict:** Standard orthodoxy (Clause 2) asserts that measurement is free. If the demon in D2 has unbounded memory and never resets, it never pays the Landauer cost. Therefore, standard physics predicts D2 *should* win indefinitely. Your verdict ("Cannot win") implies that measurement itself is dissipative or that correlation generation at equilibrium is impossible without cost.
  *   **The Recommendation:** To maintain a clean principle consistent with the broader literature (Bennett, Landauer, Maroney), you should abandon **D2**. Your "squeamishness" is likely a residual intuition from Szilard's original formulation, which was corrected by the realization that information acquisition can be reversible.

  ### The Baroque Version
  If you insist on saving all eight verdicts, your principle must look like this:
  *   **The Deferred-Correlation Principle:** Work extraction requires exogenous correlation (D6). Endogenous correlation (D2, D8) costs work to create *even if not erased*, because the coupling mechanism required to establish correlation at equilibrium inevitably dissipates $kT \ln 2$ per bit *unless* the memory is pre-correlated (D6). However, this cost can be deferred to a successor (D8) or external lab (D5), but an infinite chain of deferral in a closed system sums to a net loss due to coupling inefficiencies that scale with chain length.
  *   **Why it's baroque:** It requires positing a specific dissipation cost for *measurement* (contradicting standard reversible computing models) and adds a complex clause about "coupling inefficiencies" to ensure D8 fails despite the infinite timeline.

