      *   *Claim 3 (Allais & Linear Weighting):* Accurate. The Allais paradox violates the Independence Axiom, which implies linear probability weighting. Buchak argues EU cannot accommodate Allais preferences without changing $u$ in ad hoc ways that violate state-wise dominance or similar constraints.
