answer: |-
  You have put your finger on a precise phenomenological joint that standard taxonomy often glues over. You are describing a tripartite dissociation: **Sensory-Discriminative** (intact), **Affective-Motivational** (absent), and **Protective-Behavioral** (intact, but decoupled from sensation and coupled to belief).

  To answer your primary question directly: **No, there is no single established clinical or philosophical term for this exact configuration.**

  There are neighbors, but they all fail on at least one of your boundary conditions.
  *   **Pain Asymbolia:** Fails on behavior. Asymbolics (usually insular lesions) feel the prick but do not withdraw. They lack the *protective* drive entirely. You retained the protection, but switched the trigger from *sensation* to *proposition*.
  *   **Cingulotomy/Lobotomy:** Fails on affect. These procedures aim to sever the link between sensation and suffering ("I know it hurts, but I don't care"). While you report not caring, the standard post-cingulotomy patient often shows reduced protective behavior because the *urgency* is dampened. Your urgency was preserved, just relocated.
  *   **Fear-Avoidance Model (Kinesiophobia):** Fails on affect. This model posits that belief leads to *fear*, which leads to guarding. You explicitly report the absence of dread or fear ("nothing bothered me").
  *   **Nocebo Effect:** Fails on sensation. A nocebo usually amplifies the pain rating. Your rating stayed at a seven; only the behavior changed.

  ### The Coinage: Doxastic Guarding

  Since the field lacks a term, I will offer one that fits your rigor. Let us call this **Doxastic Guarding**.

  **Definition:** A state in which nociceptive sensation is veridically reported and affectively neutral, yet protective motor behavior is enacted solely upon the acceptance of a propositional belief regarding tissue integrity, independent of the sensation's motivational push.

  **Boundary Conditions (The Edges):**
  1.  **Sensory Integrity:** The subject must be able to localize and grade the sensation (your 7/10) without equivocation. This rules out *Congenital Insensitivity* and *Alexithymia*.
  2.  **Affective Nullity:** The subject must report an absence of "suffering," "dread," or "unpleasantness" associated with the sensation *at the time of the behavior*. This rules out *Toughing It Out* (which implies suppressed affect) and *Stoicism* (which implies enduring negative affect).
  3.  **Behavioral Contingency:** The protective behavior (guarding, limping, off-loading) must onset or offset rapidly in response to *information* (the surgeon's word, the locum's opinion) rather than changes in the sensation. This rules out *Reflexive Withdrawal* and standard *Conditioned Avoidance*.
  4.  **Sincerity:** The behavior must not be deceptive. This rules out *Malingering* or *Reverse Malingering* (trying to appear tough). The subject believes the protection is warranted based on the data, not the feeling.

  **Where it stops being Doxastic Guarding:**
  *   **If dread enters:** If the locum's news makes you *afraid* of the pain, you have crossed into **Fear-Avoidance**.
  *   **If the sensation changes:** If the news makes the leg hurt *more* (8/10), you have crossed into **Nocebo Hyperalgesia**.
  *   **If the protection vanishes:** If you are told it's broken and you keep walking without care because the feeling doesn't bother you, you have crossed into **Pain Asymbolia**.

  ### Follow-Up 1: The Argument from Impossibility

  You asked if anyone argues this is impossible. **Yes.** This is the core contention of **Imperativism** in the philosophy of pain.

  Prominent theorists like **Manne Klein** and **Murat Aydede** argue that pain is not just a representation of damage (like a red light on a dashboard); it is an *imperative* (a command: "Stop doing that!"). For a strong Imperativist, the motivational push is *constitutive* of the pain experience. If you are not motivated to protect the limb *by the feeling itself*, they would argue you are not truly feeling pain, or you are misdescribing the experience.

  They would look at your case and say: "You say it was a 7/10, but if it didn't bother you, you are describing *nociception* without *pain*, or you are describing a memory of pain rather than the occurrent state."

  **Your case is a counter-example to Strong Imperativism.** You demonstrate that the "command" aspect of pain can be severed from the "sensation" aspect, and the command can be re-issued by a cognitive belief system ("The bone is fragile") rather than the nociceptive system ("The tissue is threatened"). Your father's case reinforces this: the behavior (checking feet) was maintained by compliance with authority, not by the aversive quality of the burning.

  ### Follow-Up 2: The Location of Badness

  This is where your observation does the most damage to standard models.

  If pain's "badness" (its normative force, its reason-giving power) lived in the feeling (the qualia), then your behavior should have tracked the sensation. It didn't. It tracked the *diagnosis*.

  This supports a **Representationalist Externalism** about pain motivation. It suggests that:
  1.  **Sensation is Information:** The 7/10 throb is data. "Tissue stress at location X."
  2.  **Badness is Assigned:** The "ought" (I ought to stop walking) is not inherent in the data. It is assigned by a higher-order cognitive evaluation of what that data *means* for your goals and integrity.
  3.  **The "Cognitive-Evaluative" Dodge:** You are right to be suspicious of this phrase. In the **Melzack & Casey (1965)** model, the cognitive-evaluative component is often treated as a dimmer switch on the *intensity* or *unpleasantness*. Your case shows it acting as a **switch for agency**. It doesn't just modulate how bad it feels; it determines whether the feeling counts as a reason for action.

  When clinicians say "It's just the cognitive-evaluative component," they usually mean "You are thinking about it too much, which makes it hurt more." You are describing the reverse: "I am thinking about it differently, which makes me act differently, while the hurt stays the same."

  ### Summary for Your Tuesday Group

  You can tell the group that you have identified a gap between **Nociceptive Qualia** (the feel), **Pain Affect** (the suffering), and **Protective Agency** (the action). Standard models assume these are fused. Your tibia proves they are modular.

  The term **Doxastic Guarding** captures the specific configuration where Agency is decoupled from Qualia/Affect and coupled to Belief. It validates your intuition: the "badness" of pain is not a property of the nerve signal, but a property of the *story the brain tells about the signal*. When the story changed (from "healing" to "hairline fracture"), the behavior changed, even though the signal remained constant.

  This places you in opposition to **Motivational Internalism** and supports a view where pain is a *reason-provider* only when endorsed by cognitive judgment. It suggests that for high-functioning agents (like a retired lab runner or a compliant diabetic patient), the "pain behavior" is often a policy decision, not a reflex.
