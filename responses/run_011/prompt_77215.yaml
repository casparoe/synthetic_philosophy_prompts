answer: |-
  # Game Title: The Ontology of Ruin
  **Time:** 75 Minutes
  **Players:** 12 (3 Teams of 4)
  **Materials:** Printed Packets (provided below), Whiteboard, Markers, Timer.

  ## 1. The Setup (5 Minutes)
  **The Premise:** You are the "Historical Integrity Board." You are not here to find the Truth; you are here to apply a specific definition of **Collapse** to three datasets and defend the classification.

  **The Definition (Write on Whiteboard):**
  > **Collapse:** A drastic drop in **Population** AND/OR **Political Complexity**, over a **Wide Area**, for a **Long Time** (Diamond, 2005).
  > *Threshold:* >50% loss in complexity markers OR >30% population drop sustained for >2 generations.

  **The Roles (Assign within teams):**
  1.  **Lead Analyst:** Keeps time, ensures the Definition is applied strictly.
  2.  **Data Lead:** Focuses only on the numbers/tables. Ignores narrative text.
  3.  **Context Lead:** Focuses on the "Source Bias" notes and narrative text.
  4.  **Scribe:** Prepares the final verdict on the whiteboard.

  **The Winning Condition:**
  There is no "correct" verdict. The winning team is the one whose **Confidence Interval** (how sure they are) best matches the **Coherence of their Defense** during cross-examination. If you claim 100% certainty but your data is ambiguous, you lose points.

  ---

  ## 2. The Evidence Packets (Print 3 copies of each)
  *Instruction to Facilitator: Print these on separate colored paper if possible. Hand one set to each team. Tell them: "You have 15 minutes to analyze. Do not talk to other teams."*

  ### PACKET A: The Southern Lowlands (Classic Maya)
  *Region: Tikal/Calakmul Basin | Period: 600 CE – 900 CE*

  | Year (CE) | Monument Construction (Count) | Royal Inscriptions (Count) | Obsidian Import (Tons) | Settlement Density (Houses/km²) | Source Type Bias |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 600 | 12 | 45 | 4.2 | 150 | 80% Elite Stone |
  | 700 | 24 | 89 | 6.1 | 185 | 80% Elite Stone |
  | 750 | 18 | 60 | 5.5 | 170 | 80% Elite Stone |
  | 800 | 4 | 12 | 2.1 | 110 | 60% Elite Stone |
  | 850 | 0 | 0 | 0.4 | 65 | 40% Elite Stone |
  | 900 | 0 | 0 | 0.1 | 40 | 20% Elite Stone |

  **Narrative Note:** The "Hieroglyphic Stairway" dates stop abruptly at 810 CE. Large reservoirs show sedimentation indicating erosion.
  **Source Bias Warning:** "Settlement Density" is derived from LiDAR scans of stone foundations. Organic housing (wood/thatch) is invisible to this metric.
  **Health Metric:** Skeletal remains from elite tombs show increased stress markers (enamel hypoplasia) post-750 CE. Commoner burials are rare/unidentified.

  ### PACKET B: The Indus Periphery (Harappan)
  *Region: Indus Valley & Gujarat | Period: 2200 BCE – 1700 BCE*

  | Year (BCE) | Urban Core Pop. (Est.) | Rural Settlement Count | Script Seals (Count) | Standardized Brick Ratio | Dental Stress (Hypoplasia %) | Source Type Bias |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 2200 | 45,000 | 120 | 500 | 98% | 12% | 90% Urban Elite |
  | 2000 | 30,000 | 145 | 350 | 95% | 11% | 90% Urban Elite |
  | 1900 | 10,000 | 180 | 50 | 60% | 9% | 70% Urban Elite |
  | 1800 | 2,000 | 210 | 0 | 0% | 8% | 50% Urban Elite |
  | 1700 | 500 | 225 | 0 | 0% | 7% | 20% Urban Elite |

  **Narrative Note:** Major cities (Mohenjo-Daro) are largely abandoned by 1800 BCE. The script becomes undecipherable/unused.
  **Source Bias Warning:** "Script Seals" are exclusively elite administrative tools. "Rural Settlement" is derived from surface pottery scatters.
  **Health Metric:** Dental stress (indicator of famine/disease) *decreases* as Urban Core Pop drops. Rural diet diversifies (more millet, less wheat).

  ### PACKET C: The Rapa Nui Basin (Easter Island)
  *Region: Island-wide | Period: 1200 CE – 1750 CE*

  | Year (CE) | Moai Construction (Count) | Palm Pollen % (Soil Core) | Obsidian Blade Trauma (Skeletons) | Rat Bone % (Midden) | European Contact? | Source Type Bias |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1200 | 0 | 15% | 0% | 5% | No | 50% Oral Tradition |
  | 1400 | 40 | 8% | 2% | 45% | No | 50% Oral Tradition |
  | 1600 | 15 | 4% | 3% | 60% | No | 50% Oral Tradition |
  | 1700 | 0 | 2% | 4% | 65% | No | 50% Oral Tradition |
  | 1722 | 0 | 1% | 5% | 65% | **Yes (Roggeveen)** | 80% European Log |
  | 1750 | 0 | 1% | 45% | 60% | **Yes (Slave Raids)** | 90% European Log |

  **Narrative Note:** Popular theory suggests total ecocide and civil war prior to 1722 due to palm extinction.
  **Source Bias Warning:** "Trauma" data is based on available skeletal collections. "Palm Pollen" indicates forest cover, not necessarily human causation.
  **Health Metric:** No evidence of mass violence (fractured skulls, embedded points) in pre-1722 layers. Population estimates remain stable (3,000-5,000) until European disease/raids.

  ---

  ## 3. The Run of Show (70 Minutes)

  **00:00 – 00:05: Briefing**
  *   Hand out packets.
  *   Read the Definition of Collapse aloud.
  *   **Rule:** You cannot Google. You cannot consult outside knowledge. You must judge *only* the packet.

  **00:05 – 00:20: Silent Analysis**
  *   Teams review data.
  *   **Constraint:** The Data Lead must highlight any row where two metrics contradict (e.g., Pop down, Health up).
  *   **Constraint:** The Context Lead must circle every instance of "Source Bias."

  **00:20 – 00:40: Deliberation**
  *   Teams must reach a verdict: **COLLAPSE** or **TRANSFORMATION**.
  *   They must assign a **Confidence Score (0-100%)**.
  *   They must write **One Sentence** justifying the verdict based *only* on the Definition provided.
  *   *Facilitator Note:* Walk around. If a team is agreeing too fast, ask: "Did you check the Health Metric in Packet B?"

  **00:40 – 00:55: Cross-Examination (The "Shouting" Phase)**
  *   Team A presents verdict on Packet A. Teams B & C attack.
  *   Team B presents verdict on Packet B. Teams A & C attack.
  *   Team C presents verdict on Packet C. Teams A & B attack.
  *   **Rule:** Attackers must point to a specific row in the table that contradicts the verdict. Defenders must explain why that row is "Elite Bias" or "Noise."

  **00:55 – 01:10: Final Scoring & Debrief**
  *   Teams adjust their Confidence Scores if they were successfully attacked.
  *   Facilitator reveals the "Historian Consensus" (see Debrief section).
  *   Group discussion on the nature of the definition.

  **01:10 – 01:15: Hard Stop**

  ---

  ## 4. The Debrief (Facilitator Script)
  *Do not lecture. Ask these questions to map the game to the book.*

  **1. The Definition Trap (Packet A - Maya)**
  *   *Ask:* "Packet A looked like a slam-dunk Collapse. But look at the Settlement Density. It dropped 75%, but didn't hit zero. Is a 75% drop a collapse, or a reset?"
  *   *The Point:* Diamond's definition relies on thresholds we arbitrarily set. If we set the bar at 50%, it's collapse. If we set it at 90%, it's transformation. The "event" is defined by the metric, not the people.

  **2. The Elite Blindspot (Packet B - Indus)**
  *   *Ask:* "In Packet B, the Script and Bricks hit zero. That's political complexity dead. But Dental Stress went down. People ate better without the kings. Did it collapse, or did the *parasites* collapse?"
  *   *The Point:* This addresses your requirement on elite evidence. History records the fall of palaces, not the rise of peasant welfare. If we define collapse by *monuments*, Indus collapsed. If we define it by *calories*, it thrived.

  **3. The Narrative Inertia (Packet C - Rapa Nui)**
  *   *Ask:* "Who voted Collapse on Packet C? Look at the Trauma row. It spikes *after* European Contact. Why did we want it to be ecocide before that?"
  *   *The Point:* This addresses the Easter Island argument. We prefer a moral fable (they destroyed themselves) over a complex tragedy (they survived until outsiders arrived). The "Collapse" is a story we tell ourselves about sustainability, not necessarily what happened in the soil.

  **4. The Final Question**
  *   "Is Collapse an event in the world (like an earthquake), or is it a label we put on a change of state (like 'recession')?"
  *   *Desired Outcome:* Engineers tend to see failure modes as objective. Historians see them as interpretive. The goal is to leave them comfortable with the ambiguity.

  ---

  ## 5. Predictable Failure Modes (And How to Patch Them)

  **Failure 1: The "Right Answer" Hunt**
  *   *Symptom:* Teams look at you to see if they got Packet C "right."
  *   *Patch:* Explicitly state in the intro: "Current academic consensus is mixed. I am not looking for consensus. I am looking for internal consistency."

  **Failure 2: The Definition Lawyer**
  *   *Symptom:* One engineer spends 10 minutes arguing that "2 generations" is ill-defined.
  *   *Patch:* As Facilitator, you are the Judge. "For the purpose of this simulation, 1 generation = 25 years. Ruling stands. Move on."

  **Failure 3: The Refusal to Commit**
  *   *Symptom:* A team writes "Collapse/Transformation Hybrid" as their verdict.
  *   *Patch:* The Whiteboard only has two columns. They must choose one. They can use the Confidence Score to express nuance (e.g., "Collapse, 51% Confidence").

  **Failure 4: Gaming the Health Metric**
  *   *Symptom:* In Packet B, they ignore the Dental Stress because "Monuments are more important."
  *   *Patch:* During Cross-Examination, force the other teams to ask: "Why does a stone monument weigh more than a human life in your definition?"

  ---

  ## 6. What This Game Cannot Reproduce (The Limitations)
  *Be straight with your group about this during the debrief.*

  1.  **The Stakes of History:** In the game, a wrong verdict costs nothing. In reality, labeling something a "Collapse" can justify colonialism (e.g., "They failed, so we must manage them") or environmental panic. The game removes the political consequence of the label.
  2.  **The Archive Itself:** You are looking at clean tables. Real history is muddy, contradictory, and fragmented. The game makes the *ambiguity* clean, which is a paradox. You are simulating uncertainty with certain numbers.
  3.  **Time Depth:** 75 minutes compresses centuries of debate. You will feel the *friction* of the definition, but you won't feel the *weight* of the evidence.

  **Facilitator Closing Line:**
  "Diamond wrote a book about why societies fail. Today you found that 'fail' is a variable you have to define before you can measure it. The argument you had last week wasn't about the Maya or Rapa Nui. It was about whether you value Palaces or People more. That's not a history question. That's an engineering requirement."
