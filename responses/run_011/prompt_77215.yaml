          3.  *Controversy:* One packet must challenge a popular narrative (specifically mentioning Easter Island/Rapa Nui).
          4.  *Deliverables:* Packets (tables/data), Roles/Scoring, Timeline, Debrief, Predictable Failure Modes, Limitations of the Simulation.
      *   **Tone:** Practical, engineered, slightly cynical about historiography, actionable.

  2.  **Deconstruct the Game Design:**
      *   **Time:** 75 minutes is tight. Need strict facilitation.
      *   **Players:** 12 people. Split into 3 teams of 4? Or 4 teams of 3? 3 teams allows for 3 distinct cases. Let's go with 3 teams of 4.
      *   **Materials:** Printed packets, whiteboard for scoring/verdicts.
      *   **The "Hook":** The data needs to look engineering-friendly (metrics, tables, timelines) but be historically ambiguous.

  3.  **Develop the Cases (The Packets):**
      *   *Case 1: The "Classic Collapse" (but ambiguous).* Needs to look like Diamond's ideal but have cracks. Let's use the **Classic Maya**. High complexity, clear end date, but did everyone die?
      *   *Case 2: The "Transformation" (Elite crash, commoner rise).* This meets Requirement #1. **The Late Bronze Age (Mycenaeans)** or **Egyptian Old Kingdom**? Actually, **The Western Roman Empire** is often cited, but **Minoan/Mycenaean** is better for "palaces burn, people eat better." Let's go with a fictionalized or specific subset of the **Late Bronze Age Eastern Mediterranean** (focusing on the Palace Destruction Horizon). Or better, **Angkor**? No, let's stick to the prompt's hint about Easter Island. Let's make Case 3 Rapa Nui. So Case 2 needs to be the "Elite Crash/Commoner Rise." **The Egyptian Old Kingdom** fits well (Pyramids stop, Nile floods stable, local governors rise). Or **The Indus Valley**? Indus is great because writing stops entirely. Let's go with **The Indus Valley Civilization**. Urban centers depopulate, script vanishes, but rural settlement continues for centuries.
      *   *Case 3: The "Myth Buster" (Rapa Nui).* Meets Requirement #3. Needs data showing population stability or gradual change rather than sudden ecocide.
      *   *Data Format:* Engineers like tables. Columns: Year (BP or CE), Metric (Obsidian count, Pollen, Bone pathology, Monument construction).

  4.  **Develop Roles & Scoring:**
      *   Engineers love optimization. If I give them a scoring rubric, they will game it. I need to make the scoring subjective but structured.
      *   Roles: Lead Analyst (facilitator), Data Lead (metrics), Context Lead (narrative), Scribe (verdict).
      *   Scoring: Not points, but "Confidence Intervals." They have to state *how sure* they are.
      *   Verdict: Binary (Collapse/Transform) + Confidence % + One Sentence Justification.

  5.  **Drafting the Timeline (75 mins):**
      *   0-5: Setup & Rules.
      *   5-20: Packet Review (Silent).
      *   20-40: Team Deliberation.
      *   40-55: Cross-Examination (The "Shouting" phase, structured).
      *   55-70: Final Verdict & Scoring.
      *   70-75: Debrief.

  6.  **Addressing the "Hard Parts" (Requirements):**
      *   *Requirement 1 (Divergence):* Indus Valley packet needs to show urban decline but stable rural health metrics.
      *   *Requirement 2 (Elite Bias):* All packets need a "Record Continuity" metric that drops to zero, while "Settlement Count" might not.
      *   *Requirement 3 (Rapa Nui):* Packet needs to show rat introduction vs. human arrival dates, and lack of violence markers until *after* European contact.

  7.  **Predictable Failure Modes:**
      *   *Gaming the Score:* Teams will try to pick the "right" answer they think the facilitator wants. *Fix:* Emphasize there is no right answer, only defensibility.
      *   *Refusal to Commit:* Engineers hate ambiguity. *Fix:* Force a binary choice before the confidence interval.
      *   *Dominant Voice:* One historian-wannabe takes over. *Fix:* Role cards.

  8.  **Limitations:**
      *   The game can't reproduce the *weight* of archives. It simplifies nuance into rows.
      *   It can't simulate the political stakes of history (why we *want* collapse to be true).

  9.  **Refining the Content (Self-Correction during drafting):**
