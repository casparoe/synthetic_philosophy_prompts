          *   **Lucas Critique:** Macro econ. Policy parameters change when policy changes. Close, but usually about structural parameters, not single-event probabilities.
          *   **Performativity (ML/AI):** "Performative Prediction" (Perdomo et al., 2020). This is the most precise modern technical term. It deals specifically with how deploying a model changes the distribution it predicts.
          *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." Related, but more about optimization against a metric than probabilistic forecasting.
          *   **Observer Effect:** Physics. Measurement disturbs the system. Useful analogy, but usually implies unavoidable physical disturbance rather than strategic reaction.
      *   *The "Carving":* I need to distinguish between *epistemic* uncertainty (I don't know the state) and *ontic* change (the state changes because I spoke).
      *   *Proposal:* The most precise term is **Performative Prediction** or **Reflexive Forecasting**. I should define "Reflexive Uncertainty" as the specific gap the user is feeling.
      *   *Boundary Cases:*
