answer: |-
  We gather round the table to fix the sum.
  The light falls heavy on each open hand.
  Someone speaks out for the welfare of all.
  There is an ache settled deep in the bone.
  We weigh the joy against the final count.
  We forget to ask the question of who.

  Who lives inside the figure on the page.
  Nobody dwells within the final sum.
  The figures rise but never reach a count.
  You cannot catch the evening in your hand.
  There is no skin to cover up the bone.
  The total is no dwelling place for all.

  We are the places where the storm hits all.
  Not merely vessels for the question who.
  The hurt arrives and settles in the bone.
  It is not dissolved into the sum.
  It rests heavily upon this hand.
  We are not buckets for the global count.

  I let the passing minutes lose their count.
  I bear the pain today to benefit all.
  I steady the drill against my own hand.
  There is no mystery about the who.
  The future health outweighs the present sum.
  I accept the ache inside the bone.

  The barrier is not written in the bone.
  Time blurs the edges past the careful count.
  We merge our sorrows into one dark sum.
  We speak together as if we were all.
  It becomes hard to say precisely who.
  I cannot always tell apart your hand.

  You hold the prohibition in your hand.
  You say it is harder than the bone.
  You simply point and demand to know who.
  You forbid the trade despite the count.
  You say this cannot be required of all.
  You draw a boundary where there was a sum.

  We pass the sum around from hand to hand.
  The count sits heavy deep inside the bone.
  We share the all but never know the who.
