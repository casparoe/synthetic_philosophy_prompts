  2.  **Deconstruct the Audience & Argument Tensions:**
      *   *Tension 1: Anachronism.* Historians hate applying modern rational choice theory to ancient mentalities. They value *mos maiorum*, *dignitas*, *fides* over "payoff structures."
      *   *Tension 2: Agency vs. Structure.* Claim 3 (anti-moralizing) directly attacks the traditional biographical focus (Caesar's ambition, Cato's integrity). Historians love biography and specific decisions.
      *   *Tension 3: Evidence.* Game theory implies hidden incentives. Historians rely on extant texts (Cicero's letters, Sallust's monographs). Does the model fit the text?
      *   *Tension 4: Teleology.* Claim 2 implies an inevitable decline due to structural shifts. Historians hate inevitability (the "teleology wearing an explanatory costume" warning).
