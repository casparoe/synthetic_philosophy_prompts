      *   *Objection 5 (The Principate Simplification - Claim 4):* Augustus didn't just shrink the elite. He created a monarchy. The "prize" wasn't removed; it was monopolized by the *Domus Augusta*.
      *   *Objection 6 (The Evidence/Textual Gap):* The Latinist. Where do we see Romans talking about "future rounds"? They talk about *gloria* and *res publica*. Your model ignores the discourse.
      *   *Objection 7 (The Teleology Trap):* You make the fall look inevitable after Sulla. But the Republic survived 50 more years. Contingency matters (e.g., Pompey's choices).
      *   *Objection 8 (The Papyrologist/Empirical Check):* Do we have data on the "value" of commands? This is abstract. How do you quantify *dignitas*?

