  2. I'm perfectly happy saying beliefs are made true by the world — my belief that snow is white is true in virtue of snow being white — and I don't mind calling truth a property.
  3. Truth is the norm of assertion. What makes asserting the practice it is, rather than just making noises, is that you're answerible to the truth of what you say. That's the whole point of having the word.
  4. I do lean on a no-miracles style argument for scientific realism: the best explanation of why our theories keep working out is that they're true, and truth is doing real explanatory work in that sentence.
  5. I want to keep saying there are truths nobody can express, maybe truths no possible language could capture.
  6. Justification, unlike truth, does have a nature — I'm a reliabilist about it.

