  1.  **Deflationism vs. Inexpressible Truths (Severity: Fatal)**
      *   **Conflict:** Deflationism ties truth to linguistic competence (the equivalence schema); positing truths no language could capture treats truth as a substantive relation outrunning expression, which is inherently inflationary.
      *   **Fix:** Deny the possibility of inexpressible truths.
      *   **Cost:** You lose the metaphysical humility that reality might exceed our conceptual schemes; you must accept that truth is bound to expressibility.

  2.  **Deflationism vs. Explanatory Role (Severity: High)**
      *   **Conflict:** If truth is merely a device for endorsement, it cannot causally explain predictive success; saying "the theory is true" adds nothing over "the theory holds."
      *   **Fix:** Reformulate the argument: the *facts* described by the theory explain success, not the property of truth itself.
      *   **Cost:** You lose the rhetorical punch of the standard No-Miracles Argument; you must defend realism without leaning on truth as a causal explanans.

  3.  **Deflationism vs. Truthmaking/Property (Severity: Low)**
      *   **Conflict:** Talking of beliefs being "made true" sounds like correspondence, but deflationists can accept this provided "made true" is just shorthand for the equivalence schema.
      *   **Fix:** Clarify that "property" means logical or expressive property, not a natural kind.
      *   **Cost:** Negligible; requires precise wording to avoid slipping into correspondence theory.

  **Single Revision to Clear the Most**
  Abandoning 1 (Deflationism) would clear the most trouble. Your intuitions on truthmaking, explanation, and inexpressible truths form a coherent robust realist package; keeping the deflationist label forces you to contort the other five commitments.

  **What Would Change My Mind**
  My ranking assumes a strict disquotational definition of deflationism. If you are working with a "Minimalist" framework (e.g., Horwich) that allows truth to be a genuine property while denying it has a hidden nature, the conflict with 2 dissolves entirely, and the conflict with 4 becomes a verbal dispute about whether "explanation" requires substantive properties. If your seminar allows pluralism about truth (e.g., deflationary for ethics, robust for science), the tension between 1 and 4/5 vanishes, but you must defend the split.
