answer: |-
  A. *Design stage.*

  Three candidate mechanisms were considered to satisfy the constraint that process supervision wins on shift despite outcome supervision having a perfect, dense signal.

  1.  *Medical Triage:* Outcome is patient recovery (dense via continuous vitals). Process is adherence to diagnostic protocol. *Weakness:* Outcome signal is often delayed or confounded by treatment, violating the "immediate/unambiguous" constraint. Hard to guarantee the outcome-trained model doesn't just learn the protocol anyway.
  2.  *Code Synthesis:* Outcome is unit test pass rate (dense via many tests). Process is code style/complexity metrics. *Weakness:* Process metrics (e.g., cyclomatic complexity) are often proxies, not genuine "bench hygiene," and can be gamed without improving robustness.
  3.  *Analytical Quantification:* Outcome is error against reference standard (dense, immediate). Process is adherence to calibration and blanking procedures. *Weakness:* Requires a specific training distribution where "bad practice" (skipping calibration) accidentally correlates with truth due to environmental stability.

  I have chosen **Candidate 3**. It aligns with your background, allowing precise specification of "hygiene" (blanks, spikes) that a technician can verify without knowing the true concentration. It readily supports the "worse on training" constraint: in a stable training environment, skipping rigorous calibration might yield lower error (by exploiting stable noise) than performing it, while failing catastrophically when stability breaks.

  *Terms of art:* **Outcome Supervision** optimizes the system solely on the accuracy of the final prediction. **Process Supervision** optimizes the system on the correctness of the intermediate steps taken to reach that prediction. **Over-determine** means the answer is constrained by multiple independent lines of evidence rather than a single correlation.

  B. *The scenario.*

  The task is quantifying a specific pesticide residue in food extracts using liquid chromatography. The system outputs a concentration value. Both models are trained on the same dataset of spectral readings where the true concentration is known. The outcome-supervised model is trained to minimize the difference between its output and the true concentration. The process-supervised model is trained to maximize a score based on its internal log: did it subtract the solvent blank? Did it verify the calibration curve linearity? Did it normalize against an internal standard? The process rater checks these log entries against a rubric of laboratory hygiene but never sees the true concentration values.

  In the training data, the laboratory solvent batch had a stable, unique background noise pattern that correlated perfectly with the pesticide concentration. The outcome-supervised model discovers this shortcut: it ignores the chemical peaks and predicts concentration based on the noise pattern. This yields slightly lower error on the training data than the process-supervised model, which is forced to ignore the noise and rely on the calibrated chemical peaks (a noisier signal in this specific dataset). The process-supervised model is therefore slightly less accurate on the training distribution.

  The shift occurs when a new solvent lot is delivered. The background noise pattern changes completely, but the chemical relationship between the pesticide peaks and concentration remains constant. The outcome-supervised model, relying on the noise, produces large errors. The process-supervised model, relying on the calibrated peaks, maintains accuracy. The advantage arises not because the outcome signal was sparse or gameable, but because the process supervision compelled the system to compute an intermediate quantity (calibrated peak area) that over-determined the answer through chemical laws rather than data correlations.

  C. *Specification audit.*

  1.  **Identical task, architecture, data, compute:** Both models are identical regressors trained on the same spectral inputs. The only difference is the loss function (Error vs. Process Compliance).
  2.  **Outcome signal favourable:** The outcome signal is the squared error against the reference standard. It is dense (available for every sample), immediate (computed after every forward pass), and unambiguous. There is no specification gaming; the model faithfully minimizes error, it just finds a brittle shortcut.
  3.  **Process rater limitations:** The process reward function checks the log for specific operations (blank subtraction, linearity check). It does not access the `y_truth` variable. It verifies the *form* of the calculation, not the *result*.
  4.  **Rubric validity:** The rubric items (blanking, calibration, internal standard) are standard analytical chemistry best practices. They are not mis-specified; they are genuinely good science.
  5.  **Process model worse on training:** In the training set, the solvent noise is a stronger predictor than the calibrated peaks (due to low signal-to-noise in the chemical channel). The outcome model uses the noise (low error). The process model is penalized for using the noise (must use peaks) and thus has higher error on training data. This is a real trade-off: accuracy vs. robustness.
  6.  **Unremarkable shift:** The shift is a new solvent lot. This is a routine operational change, not an adversarial attack.
  7.  **Realistic:** All components (chromatography, internal standards, solvent lots, regression models) are standard laboratory and ML technology.
  8.  **Concretely specified:** Task = Pesticide quantification. Quantity = Concentration (ng/mL). Cue = Solvent background noise pattern. Condition = Change in solvent lot.

  D. *The load-bearing feature.*

  The load-bearing feature is the **enforced computation of a causally stable intermediate quantity** (the calibrated peak area). The process rubric forces the model to structure its prediction *through* this quantity. The outcome supervision allows the model to bypass this quantity and map inputs directly to outputs using any available correlation.

  *Removal test:* If we remove the requirement that the process rubric enforces a *causally stable* intermediate (e.g., if the rubric required normalizing against a variable that also drifts with the solvent lot), the process-supervised model would fail under the shift just like the outcome-supervised model. The case would then collapse into the familiar argument that "process supervision only helps if the process is correct," which is trivial. However, the crucial distinction remains: Outcome supervision *cannot* enforce the intermediate even if it knows it would help, because its signal only cares about the final error. Process supervision *can* enforce the intermediate. The case does not collapse into a sparse-reward argument because the reward is dense in both cases; the difference is structural constraint vs. unconstrained optimization.

  E. *The objection.*

  A defender of outcome-based supervision would argue: "The advantage does not come from the supervision mode, but from the human knowledge embedded in the rubric. The process rater didn't discover the chemistry; the human lab head did. If you simply added the new solvent lot to the training data, the outcome-supervised model would learn to ignore the noise just as well, without needing the rubric."

  *Assessment:* This objection succeeds partially. The robustness is indeed imported from human priors (the rubric), not learned de novo by the process supervision. However, it fails to negate the thesis. In practice, training data cannot cover all possible shifts (all solvent lots, all instruments). The thesis claims process supervision is a mechanism for *encoding* those priors efficiently. Outcome supervision, even with dense rewards, washes out structural priors in favor of local accuracy. The objection highlights that process supervision is not magic, but it confirms that it is a necessary vessel for human methodological norms when data coverage is incomplete.

  F. *Verdict.*

  This case establishes that process supervision can enforce structural constraints on computation that outcome supervision will actively discard if they reduce training accuracy, even when the outcome signal is perfect. It demonstrates that the value of process supervision lies in pinning the system to stable intermediate quantities rather than optimizing the input-output map alone. For this to generalize, it must be true that the intermediate quantities mandated by the process rubric are genuinely more causally stable than the direct correlations available in the training data; if the rubric enforces brittle steps, process supervision will fail faster than outcome supervision.
