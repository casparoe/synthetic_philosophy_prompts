  2.  **Deconstruct Dennett's Taxonomy (Mental Check):**

      *   *Darwinian:* Natural selection acts on phenotypes. Creatures survive/replicate because their hardwired traits work. No individual learning.
      *   *Skinnerian:* Operant conditioning. Creatures try things, get rewarded/punished, and adjust behavior. "Try something, if it works, do it again."
      *   *Popperian:* Internal selection. Creatures let their hypotheses die in their stead. They simulate outcomes before acting.
      *   *Gregorian:* Cultural selection. Tools of thought (memes, language, models) are shared and refined across generations/individuals.
      *   *Key Insight:* It's cumulative. A Gregorian is also Popperian, Skinnerian, and Darwinian. It's layers of competence, not replacement.

