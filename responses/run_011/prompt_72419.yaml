      *   *Worry 1: Role-Exit as Dissolution of Self.*
          *   In Ames/Rosemont, the self *is* the roles. Leaving a role (quitting/testifying against employer) seems like self-destruction.
          *   *Counter:* Confucianism recognizes higher-order roles (e.g., "human being," "member of society," "servant of the Way"). Boisjoly didn't cease to be a person; he shifted priority to a broader role (public safety/engineer integrity) over the narrow corporate role. However, Ames/Rosemont emphasize *particularity*. Universal duties are suspect. So, yes, there is tension. Whistleblowing looks like role-breaking unless framed as fulfilling a higher role (e.g., "loyal minister to the public good").
          *   *Verdict:* It's not incoherent, but it requires redefining the primary role. If the primary role is "Thiokol employee," exit is failure. If the primary role is "Engineer serving society," exit is fidelity. The tension is real.

