      *   *Correction:* Individual risk is probability to *one person* over time. Societal is probability to *population*. Ensemble average is "many parallel worlds." Time average is "one world over time." So, Time Average $\approx$ Individual Risk trajectory. Ensemble Average $\approx$ Societal/Portfolio expectation. This aligns well.
      *   *Check:* Is Kelly about avoiding ruin or maximizing growth?
      *   *Correction:* It's maximizing growth *subject to* not going bankrupt. It naturally avoids ruin because log(0) is negative infinity. But fractional Kelly is specifically for uncertainty.
      *   *Check:* Safety doesn't do "Growth."
      *   *Correction:* Safety enables production. We can frame "Bankroll" as "Safety Margin" or "Operational Capacity." If you lose the margin, you shut down.

  9.  **Final Polish:** Organize into the requested sections. Ensure the "Residue Report" is distinct. Make sure the "Fumbled Points" are answered directly. (Proceed to generate output).

  *(Self-Correction on the Individual vs Societal Risk analogy)*:
  Individual Risk: Probability of fatality to a specific individual over a period (e.g., 1 in 1,000,000 per year).
  Societal Risk: F-N curves, number of people affected.
