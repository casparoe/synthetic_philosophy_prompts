answer: |-
  Here is the translation of your brother's argument into your language, followed by the residue report and the specific technical rebuttals you need.

  ### Part 1: The Kelly Criterion in Safety Vocabulary

  **The System**
  Your brother views his bankroll not as cash, but as **containment capacity**. In your world, if pressure exceeds the vessel's rating, you have a Loss of Primary Containment (LOC). In his world, if he bets too much of his bankroll on a single event, he risks a drawdown that compromises his ability to stay in the game.

  **Expected Value (Arithmetic Mean) = Ensemble Average**
  When your brother says "maximizing expected value is a sucker's game," he is talking about the difference between an **Ensemble Average** and a **Time Average**.
  *   **Ensemble Average:** Imagine you build 1,000 identical refineries. You run them for one year. You average their profits. This is Expected Value (EV). It assumes you can pool the risk across many parallel systems.
  *   **Time Average:** Imagine you build *one* refinery. You run it for 1,000 years. You track its cumulative profit. This is the Geometric Mean.
  *   **The Trap:** If a specific failure mode (ruin) exists, the Ensemble Average can be positive even if the Time Average is negative. In safety terms: You can have a positive economic expectation across a population of plants while the specific plant you are standing in explodes. EV ignores the sequence of events; it assumes you can reset after a catastrophe.

  **Geometric Rationality = Operational Reliability**
  Maximizing the geometric growth rate is equivalent to maximizing the **long-term operational integrity** of a single asset.
  *   In safety, we know that a system with a high Probability of Failure on Demand (PFD) might work 99 times, but the 100th time kills you.
  *   In betting, "volatility drag" is the mathematical equivalent of **fatigue damage**. Even if the average load is within limits, high variance cycles degrade the material (bankroll) faster than the mean suggests.
  *   Kelly sizing is an **Operating Limit**. It calculates the maximum bet size (process demand) that keeps the system stable over an infinite horizon without hitting the absorbing state (zero bankroll).

  **Ruin = Absorbing State**
  You both agree on this: Ruin is an absorbing state. Once you hit it, the process stops.
  *   **Your view:** A fatality cannot be offset. The system has failed.
  *   **His view:** Bankruptcy cannot be offset. The compounding stops.
  *   **The Kelly Mechanism:** The Kelly formula uses a logarithmic utility function. Mathematically, $\log(0) = -\infty$. By maximizing the expected log of wealth, the math *forces* the probability of ruin to zero over an infinite timeline. It treats ruin as a vertical asymptote you cannot cross.

  **Half-Kelly = Safety Factor / Design Margin**
  Your brother mentions "half-Kelly" as a fix for variance. In your language, this is a **Design Margin** or a **Safety Factor**.
  *   Full Kelly assumes you know the exact PFD of your bet (your "edge").
  *   In reality, your edge is an estimate. There is **Model Uncertainty**.
  *   If you overestimate your edge (like underestimating corrosion rates), Full Kelly pushes you into the unstable region. Betting half-Kelly is like designing a vessel for 200 psi when the MAWP is 100 psi. It sacrifices theoretical maximum throughput (growth) for robustness against parameter uncertainty.

  ***

  ### Part 2: The Residue Report

  Here is where the translation holds, where it strains, and where it breaks.

  #### 1. What Translates Cleanly
  *   **Time-Average vs. Ensemble-Average $\approx$ Individual Risk vs. Societal Risk.**
      You suspected this, and you are mostly right.
      *   **Ensemble Average (EV):** This is **Societal Risk**. It looks at the F-N curve for a population. "Across the industry, this hazard yields X profit." It allows averaging because the pain is distributed.
      *   **Time Average (Geometric):** This is **Individual Risk**. It asks, "What happens to *this* operator over *this* career?" It does not allow averaging because the consequence is localized and sequential.
      *   *Verdict:* Your intuition is sound. Your brother is arguing for Individual Risk metrics; the "EV maximizers" are arguing using Societal Risk metrics applied to an individual.

  *   **Ruin $\approx$ Top Event / LOC.**
      Both frameworks treat the total loss of the system as a hard stop. Neither allows recovery from zero.

  *   **Fractional Kelly $\approx$ Layers of Protection (LOPA).**
      Reducing bet size below the theoretical optimum is functionally identical to adding an Independent Protection Layer (IPL). It reduces the frequency of excursions into the "danger zone" (severe drawdown) at the cost of throughput (growth).

  #### 2. What Only Translates If You Bend Something
  *   **The Objective Function (Growth vs. Integrity).**
      *   *The Bend:* Kelly optimizes for **Maximum Growth**. Safety optimizes for **Acceptable Risk**.
      *   *Why it matters:* Kelly asks, "How fast can I grow without dying?" Safety asks, "How much risk can I tolerate to operate?" Your brother is trying to drive the car at the maximum speed the tires can hold. You are trying to ensure the car never leaves the road, regardless of speed. The math is similar, but the *intent* is inverted.
      *   *Consequence:* Kelly accepts high volatility (near misses) as the price of growth. Safety treats high volatility (process upsets) as a leading indicator of failure that must be investigated, even if no accident occurs.

  *   **Independence vs. Common-Cause Failure (CCF).**
      *   *The Bend:* Kelly assumes **Independent Trials**. Bet 1 does not influence Bet 2.
      *   *Why it matters:* In refineries, we obsess over CCF. A power surge takes out multiple safety systems. In sports betting, "market correlation" is a CCF. If his model relies on a specific statistical anomaly, and the league changes the rules or the bookmaker changes the algorithm, that is a **Common-Cause Failure** that invalidates the independence assumption.
      *   *Consequence:* Kelly underestimates ruin probability if events are correlated. Safety frameworks (Fault Trees) explicitly model CCF (beta factors). His model likely does not.

  #### 3. What Has No Expression in Your Framework
  *   **The "Edge" as a Dynamic Parameter.**
      In safety, a pump's failure rate is relatively static (bathtub curve). In betting, the "probability of success" is adversarial. The bookmaker is an active opponent trying to close the gap. Your framework assumes hazards are passive (gravity, pressure, corrosion). His framework assumes hazards are active (market correction). There is no direct equivalent to an **Adversarial Hazard** in standard LOPA.

  *   **Liquidity as a Safety Function.**
      For him, "Bankroll" is both the inventory and the cooling system. If he loses liquidity, he cannot place the next bet, even if the edge is positive. In safety, we usually separate "Containment" from "Production Capacity." His system couples them. If the vessel thins (bankroll shrinks), the MAWP drops, which forces lower pressure (smaller bets), which reduces flow (growth). This feedback loop is unique to financial risk.

  ***

  ### Part 3: The Fumbled Points (Technical Rebuttal)

  Here is how you answer him next time, using the safety concepts you own.

  **1. Does long-run optimality assume he gets to keep playing indefinitely?**
  *   **Yes.** It is a hidden premise.
  *   **Safety Translation:** Kelly assumes an **Infinite Design Life**. It optimizes for $t \to \infty$.
  *   **The Rebuttal:** "Your math works for a plant with no decommissioning date. I design for 30 years. If your 'edge' disappears in Year 5 because the market adapts, your long-run growth rate is irrelevant. You are optimizing for a steady-state process that doesn't exist. In safety, we call this **Non-Stationary Hazard Conditions**. Your PFD isn't constant."

  **2. Can the growth-rate argument see *when* the ruin happens?**
  *   **No.** It is timing-blind.
  *   **Safety Translation:** Geometric mean tells you the *slope* of the failure curve, not the *intercept*.
  *   **The Rebuttal:** "Kelly minimizes the *probability* of ruin, but it doesn't schedule it. A 1% risk of ruin over 40 years is different than a 1% risk of ruin in Year 1. In safety, we care about **Immediate Risk** vs. **Cumulative Risk**. If you blow up in Year 1, your 'long-run growth' is a fiction. You are relying on the Law of Large Numbers to save you, but you only have one life (one bankroll). That is the definition of **Non-Ergodicity**."

  **3. Is half-Kelly a principled correction or an admission of guilt?**
  *   **It is a Safety Factor for Model Uncertainty.**
  *   **Safety Translation:** It is not an admission that the theory is wrong; it is an admission that the *inputs* are uncertain.
  *   **The Rebuttal:** "Half-Kelly is a **Design Margin**. You use it because you know your 'edge' is an estimate, not a physical constant. But in safety, if we have to derate a vessel by 50% because we don't trust the corrosion data, we don't call it 'optimal.' We call it 'operating with high uncertainty.' You aren't being disciplined; you're managing **Parameter Uncertainty**."

  **4. How much depends on repeatability and independence?**
  *   **Almost everything.**
  *   **Safety Translation:** This is the **Independence Assumption** in Fault Trees.
  *   **The Rebuttal:** "Your model assumes independent trials. My job teaches me that **Common-Cause Failures** are how systems actually die. If the bookmaker limits your action, that is a CCF. It takes out your ability to bet across multiple events simultaneously. If your 'edge' relies on market inefficiencies that vanish when you scale up, that is **Load-Dependent Failure**. Your fault tree doesn't have a beta factor for the bookmaker changing the rules."

  ***

  ### Part 4: The Verdict

  **Is your framework missing something real?**
  No. Your framework is built for **Constraint Management**, not **Gain Optimization**. It is designed to answer "Is this safe enough?" not "How rich can I get safely?" The Kelly Criterion is a tool for the latter. It is not missing a safety concept; it is pursuing a different objective function.

  **Is his argument importing assumptions?**
  Yes. Heavy ones.
  1.  **Ergodicity:** He assumes the time average will converge to the ensemble average. It won't, not in a human lifetime.
  2.  **Stationarity:** He assumes the probabilities (the edge) remain constant. In a refinery, metallurgy is stable. In betting, the market is adversarial.
  3.  **Liquidity:** He assumes he can always bet the optimal fraction. Bookmaker limits (action limits) act as a hard constraint on the control valve.

  **Can you say "You can't average away a catastrophe" in your language and have it bear on his math?**
  **Yes.** But you must phrase it as **Non-Ergodicity**.

  Tell him this:
  *"Kelly maximizes the geometric mean, which accounts for volatility drag. I respect that. But geometric growth still assumes the process is ergodic—that your time average will converge to the expected outcome. In safety, we know that for a single asset with an absorbing state (ruin), the ensemble average is a lie. You are treating your bankroll like a corporate portfolio (Societal Risk) when it is actually a single pressure vessel (Individual Risk).*

  *Half-Kelly adds a safety factor, but it doesn't fix the **Model Uncertainty** of your edge. If your edge is 1% lower than you think, your ruin probability spikes. In my world, if we don't know the corrosion rate within 50%, we don't run the unit. We don't run it at half-pressure. We shut it down until we know.*

  *You aren't wrong about the math. You're wrong about the **Process Conditions**. You're assuming a steady-state hazard in a dynamic system. I don't need to understand your spreadsheet to know that you're betting on a PFD that you can't actually measure."*

  **Summary:** You weren't feeling queasy; you were sensing **Model Uncertainty** and **Non-Stationarity**. He has a valid strategy for a casino with infinite limits and static odds. You work in a world where vessels corrode, rules change, and catastrophes are absorbing states. Your skepticism is the Safety Case his model is missing.
