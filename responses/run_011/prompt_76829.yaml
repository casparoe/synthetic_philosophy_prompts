      *   **Mindset:** Skeptical of averages when catastrophes are involved. Believes in "one fatality is too many." Views risk through the lens of consequences and frequencies, not just expected value (EV).
      *   **The Conflict:** Younger brother is a professional sports bettor using the Kelly Criterion. Brother claims EV is a trap, geometric growth is king, and ruin is manageable via fractional Kelly. User felt outmaneuvered at Thanksgiving.
      *   **The Task:**
          1.  Restate Kelly/Geometric Rationality using Safety Engineering vocabulary (faithful translation, not forced analogies).
