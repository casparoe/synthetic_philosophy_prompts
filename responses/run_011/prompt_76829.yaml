  2.  **Deconstruct the Kelly Criterion & Geometric Growth (for the Safety Engineer):**
      *   *Core Concept:* Maximizing Expected Value (Arithmetic Mean) leads to ruin in repeated multiplicative processes because volatility drags down the compound return.
      *   *Safety Translation:*
          *   Bankroll = Inventory/Containment Capacity.
          *   Bet = Process Demand/Challenge.
          *   Win/Loss = Protection Layer Success/Failure (but multiplicative).
          *   Ruin = Loss of Containment (LOC) / Catastrophic Failure.
