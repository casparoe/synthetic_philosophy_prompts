  Ensemble Average: What happens to 1000 bettors making 1 bet.
  Actually, the Ergodicity break is: Ensemble Average = Expected Value (what the casino sees across all players). Time Average = Geometric Mean (what the *individual* player experiences).
  So, Time Average $\approx$ Individual Risk (my specific fate).
  Ensemble Average $\approx$ Portfolio/Corporate Risk (the bookmaker's book).
  This fits the user's intuition. I will use this but clarify the nuance.

  *(Refining the "Catastrophe" point)*:
