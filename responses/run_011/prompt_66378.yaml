          5.  Application to 6 specific cases (Danish Venstre, Norwegian Venstre, French "libéral", Argentine President, Australian Liberal Party, 19th-Century British Liberals).
          6.  Candid feedback on the user's previous "specify on the spot" rule.
          7.  Rule for "neoliberal" in news vs. opinion.
          8.  Statement of limitations (what the procedure *cannot* settle).
          9.  Constraint: All outputs must be paste-ready phrases, not notes to self.
          10. Constraint: Be candid if the procedure rules against the user.

  2.  **Deconstruct the Problem:**

      *   *The Core Issue:* Political terminology is context-dependent. "Liberal" in the US means center-left. "Liberal" in Europe often means center-right (economic). "Liberal" in the 19th century meant free trade/classical. "Neoliberal" is often a pejorative slur in left-wing discourse but a technical term in economics.
      *   *The Constraint:* No research. High schoolers. 20-minute meeting total (so the procedure must be *very* fast).
      *   *The Solution:* A "Stoplight" system. Green (Keep), Yellow (Modify/Clarify), Red (Strike/Replace).
      *   *The "False Friend" aspect:* Venstre (Denmark/Norway) means Left but is a center-right party. French "libéral" often means economic free-marketeer (right), not US social liberal (left).
      *   *The "Drift" aspect:* 19th-century British Liberals vs. modern US Liberals.
      *   *The "Valence" aspect:* Neoliberal (often an insult) vs. Libertarian (self-identifier).

  3.  **Drafting the Grounding Section:**

      *   Needs to be under 100 words.
      *   Needs to explain *why* we are doing this.
      *   Focus on *specificity* over *accuracy* because accuracy requires research we don't have.
      *   *Draft:* Political labels are not universal facts; they are local coordinates. "Liberal" in 1890s Britain, 2020s America, and 2020s France point to different policies. This procedure does not teach you political science. It forces you to verify if the label describes *policies* your reader understands. If the label relies on knowledge you do not have, it is noise. Replace noise with signal.

  4.  **Developing the Three Failure Modes:**

      1.  **False Friend (Cross-National):** Word exists, meaning differs (e.g., Venstre, French Libéral). *Fix:* Mechanical rule (Strike & Replace).
      2.  **Drift (Historical):** Word exists, meaning changed over time (e.g., 19th C. Liberals). *Fix:* Rewriting/Contextualizing.
      3.  **Valence (Discourse):** Meaning similar, but connotation differs (Praise vs. Blame) (e.g., Neoliberal). *Fix:* Editorial Judgment (Escalate).

  5.  **Designing the Procedure (The Algorithm):**

      *   Must be fast.
      *   Must handle "I don't know."
      *   Must produce paste-ready text.
      *   *Step 1: The Self-Check.* Do *you* know exactly what policies this implies here?
      *   *Step 2: The Geography Check.* Is this outside the US/Current Era?
      *   *Step 3: The Source Check.* Is this the subject's label or the writer's label?
      *   *Step 4: The Valence Check.* Is it pejorative?
      *   *Escalation:* If the writer doesn't know, they must strike it. If it's a proper noun (Party Name), keep but qualify.

  6.  **Working the Six Cases:**

      1.  *Danish Venstre:* Name means Left, party is Right. *Action:* Keep name, add context.
      2.  *Norwegian Venstre:* Same as above.
      3.  *French "libéral":* Likely economic right. *Action:* Strike "liberal", use "free-market".
      4.  *Argentine President (Milei):* Self-identifies liberal/libertarian, press says populist. *Action:* Use self-IDs for policies, attribute press labels.
      5.  *Australian Liberal Party:* Proper noun. *Action:* Keep name, add "center-right".
      6.  *19th-C British Liberal:* Historical drift. *Action:* Qualify with "free-trade" or "classical".

  7.  **Addressing the User's Previous Rule:**

      *   User's rule: "Specify sense on the spot."
      *   Reality: Too burdensome for 2,500 words/week with no research.
      *   Recommendation: Ban the label unless it's a Proper Noun or Self-Identification. Default to policy description.
      *   "Neoliberal" rule: Ban in news (pejorative/ambiguous), allow in Opinion if defined.

  8.  **Refining the Output:**

      *   Check word counts.
      *   Ensure tone is appropriate (professional but practical for high schoolers).
      *   Ensure "paste-ready" constraint is met for the case studies.
      *   Ensure candor regarding the user's authority vs. the procedure.

  9.  **Iterative Polishing (Self-Correction during drafting):**

