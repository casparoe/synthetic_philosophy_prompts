answer: |-
  **Grounding**
  Political labels are coordinates, not constants. "Liberal" in 1890s Britain, 2020s America, and 2020s France point to different policies. This procedure does not teach you political science. It forces you to verify if the label describes *policies* your reader understands. If the label relies on knowledge you do not have, it is noise. Replace noise with signal.

  ***

  ### The Three Failure Modes

  1.  **The False Friend (Cross-National):** The word exists in both languages but maps to opposite policies (e.g., *Venstre* means "Left" but is a right-wing party; French *libéral* means free-market right).
      *   **Fix:** Mechanical. Strike the translation/description; keep the Proper Noun or describe the policy.
  2.  **The Drift (Historical):** The extension is roughly constant but the policy package has changed over time (e.g., 19th-century British Liberals).
      *   **Fix:** Rewriting. Qualify the term with the historical policy (e.g., "free-trade").
  3.  **The Valence (Discourse):** The meaning is constant, but the word is praise in one community and blame in another (e.g., "Neoliberal").
      *   **Fix:** Editorial Judgment. This cannot be mechanized; it requires escalation to the Editor or Adviser.

  ***

  ### The Procedure (Run time: <3 minutes)

  **Step 1: The Proper Noun Check**
  *   **Question:** Is the label part of an official party or organization name (e.g., "Australian Liberal Party," "Venstre")?
  *   **If Yes:** Keep the name. **Action:** Append a brief policy descriptor known to the writer (e.g., "the center-right Venstre party").
  *   **If No:** Proceed to Step 2.

  **Step 2: The Geography and Time Check**
  *   **Question:** Is the subject outside the United States or prior to the year 2000?
  *   **If Yes:** **Action:** Strike the label. Replace with the specific policy mentioned in the sentence (e.g., change "liberal economic policy" to "policy reducing trade tariffs").
  *   **If No:** Proceed to Step 3.

  **Step 3: The Source Check**
  *   **Question:** Is the label applied by the writer, or is it a direct quote/self-identification by the subject?
  *   **If Writer:** **Action:** Strike the label. Replace with policy description.
  *   **If Subject:** Keep the label but attribute it (e.g., "who describes himself as..."). Proceed to Step 4.

  **Step 4: The Valence Check**
  *   **Question:** Is the term "neoliberal," "neoconservative," or similar terms often used as insults?
  *   **If Yes:** **Action:** Escalate to Editor/Adviser. In News sections, the default is **Strike**. In Opinion sections, the default is **Keep with definition**.
  *   **If No:** The label may stand if it passed Step 2 (US/Current Era).

  ***

  ### Worked Cases (Paste-Ready Copy)

  **1. Danish Coalition Brief (Venstre)**
  *   *Procedure:* Step 1 (Proper Noun).
  *   *Print:* "Talks continue between the Social Democrats and **Venstre, the center-right agrarian party,** regarding the new coalition."

  **2. Norwegian Education Item (Venstre)**
  *   *Procedure:* Step 1 (Proper Noun).
  *   *Print:* "The proposal faces opposition from **Venstre, Norway's liberal party,** which argues for increased local control."

  **3. French Translation (Candidate "libéral")**
  *   *Procedure:* Step 2 (Geography/False Friend).
  *   *Print:* "The candidate campaigned on a **free-market platform,** promising to reduce corporate taxes."

  **4. Argentine President Profile (Milei)**
  *   *Procedure:* Step 3 (Source) & Step 4 (Valence).
  *   *Print:* "President Milei, **who identifies as a libertarian liberal,** proposes dollarizing the currency; critics in the foreign press **label him a right-wing populist.**"

  **5. Australian Trade Story (Liberal Party)**
  *   *Procedure:* Step 1 (Proper Noun).
  *   *Print:* "A backbencher from the **Liberal Party of Australia, the major center-right coalition partner,** voted against the tariff."

  **6. History Department Co-Run (19th-C British Liberals)**
  *   *Procedure:* Step 2 (Time/Drift).
  *   *Print:* "The **nineteenth-century Liberal Party, then the party of free trade and classical individualism,** opposed the protectionist bill."

  ***

  ### Candid Feedback on Your Rules

  **Your Previous Rule:** *"None of these words may appear without the sense being specified on the spot."*
  **Verdict:** This will fail. It adds 10–15 words to every instance, bloating your tight 2,500-word limit, and it demands a definition from writers who explicitly lack the background to give one. It invites incorrect definitions.
  **Replacement Rule:** *"Descriptive political labels are banned in News sections unless they are Proper Nouns. Use policy descriptions instead. Opinion sections may use labels if defined in the first paragraph."*

  **The "Neoliberal" Rule:**
  In News stories, "neoliberal" is a pejorative attribution, not a fact. It fails Step 4.
  *   **Rule:** "Neoliberal" is **banned** in News copy unless it appears in a direct quote. In Opinion copy, it is **permitted** only if the writer defines the specific economic policies they mean by it in the first 100 words. If the Adviser cuts it, the cut stands.

  ***

  ### What This Procedure Cannot Settle

  1.  **Inferred Conflict:** When accuracy requires a label your readers will misunderstand (e.g., calling a European "Liberal" party "Liberal" without qualification). The procedure forces you to qualify it, but it cannot guarantee the reader won't still apply US assumptions.
  2.  **Domestic Disagreement:** When the subject's own country is divided on the label (e.g., is the US Democratic Party "liberal" or "center-left"?). The procedure defaults to "describe policies," which is safer but less punchy.
  3.  **Discourse Identification:** A writer cannot identify a discourse community they have never encountered. If a writer does not know "neoliberal" is an insult in some circles, Step 4 relies on them recognizing it as "contested." If they miss that, the procedure fails. This is why Step 4 escalates to you or the Adviser.
