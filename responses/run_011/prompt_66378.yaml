      *   **Goal:** A mechanical procedure (ordered list of questions) to fix this, runnable in <3 mins/sentence, no research allowed.
      *   **Output Requirements:**
          1.  Grounding section (<100 words).
          2.  Three failure modes (False Friend, Drift, Valence).
          3.  Distinction between what a mechanical rule can fix vs. rewriting.
