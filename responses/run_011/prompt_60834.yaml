answer: |-
  ### 1. Decomposition Check

  Your decomposition is sound, but it is incomplete. You have identified three *symptoms* of the Cartesian/Embedded mismatch, but you are missing the **Causal Vulnerability of the Objective**.

  *   **Problem 1 (Feedback):** Actions alter observations. (Dynamic coupling).
  *   **Problem 2 (Self-Reference):** The decision procedure is in the world. (Logical coupling).
  *   **Problem 3 (Boundary):** The agent/environment split is selected. (Mereological ambiguity).
  *   **Missing Problem 4 (Objective Stability):** In the idealised picture, the utility function is axiomatic and external to the environment. In the embedded picture, the objective is physically instantiated. If the agent is in the world, its goal-representation is a physical state subject to modification by the world (including itself).

  **Why the fourth is necessary for the "bite":** Without Problem 4, students can concede Problems 1–3 and reply, "Fine, the agent models itself and the boundary is fuzzy, but it still optimizes *this* function." They retreat to a fixed target. The bite of embedded agency is that the *optimizer itself* is optimizable. You must integrate this into Problem 2 (Self-Reference) to prevent the session from ending in "It's just a harder control problem."

  **Logical Ordering for Delivery:**
  You requested ordering based on *intelligibility dependency* (what must be in hand to understand the next), not pedagogical ease.

  1.  **Boundary (Problem 3).** You cannot define "action" or "observation" without defining what acts and what observes. If the boundary is not established, "feedback" is just physics, and "self-modeling" is just recursion.
  2.  **Feedback (Problem 1).** Once the boundary is tentatively drawn, students must see that crossing it causally alters the input stream. This motivates why the boundary matters dynamically.
  3.  **Self-Reference (Problem 4/2).** Once students accept that actions alter the world, they must ask, "What generates the action?" Locating the generator *inside* the world it alters creates the fixed-point contradiction.

  **Justification:** A student cannot understand "my actions alter evidence" (1) without a definition of "my" (3). A student cannot understand "my decision procedure is in the world" (2) without understanding that "my actions" have causal power in that world (1).

  ---

  ### 2. The Running Case

  **Selection:** **A Thermostat controlling a room occupied by a Human.**

  **Defense:**
  *   **Stupidity:** No one attributes "mind" or "AGI" to a bimetallic strip. This satisfies Constraint 2 (no intelligence vocabulary needed to describe the mechanism) and prevents the ML students from dismissing the problem as "current architecture limitations."
  *   **Richness:** It allows for a three-body causal chain: Thermostat $\to$ Heat $\to$ Room Temp $\to$ Human Comfort $\to$ Window Open/Close $\to$ Room Temp $\to$ Thermostat Sensor.
  *   **Why not a bacterium?** Biologists in the room will reduce agency to chemotaxis, collapsing the conceptual problem into biology.
  *   **Why not a firm?** Too abstract; "actions" become legal fictions, muddying the causal link required for Problem 1.

  **Case Requirements:**
  *   **Must Have:** A clear actuator (heater), a clear sensor (thermometer), and an external actor (human) who reacts to the actuator's output.
  *   **Must Lack:** Semantic understanding. The thermostat must not "know" it is heating. It must be a function $f: \text{Temp} \to \text{On/Off}$. This prevents the "Intentionality" misconception from gaining traction early.

  ---

  ### 3. Session Architecture (80 Minutes)

  #### Phase 1: The Idealised Picture & The Boundary (0–25 mins)
  **Goal:** Establish the standard model and dismantle the Boundary (Problem 3).

  *   **0–5 mins: The Setup.**
      *   Draw the Idealised Picture on the board: Box labeled "Agent" (Function $H \to A$) outside a Box labeled "Environment." Arrow $A \to E$, Arrow $E \to H$.
      *   Introduce the Case: Thermostat (Agent) in a Room (Environment).
      *   **Constraint Check:** Do not use "intelligence," "mind," or "reasoner." Use "controller," "system," "device."
  *   **5–15 mins: The Boundary Problem.**
      *   Ask: "Where is the line between Thermostat and Room?"
      *   Push the line: Is the wire part of the thermostat? Is the air immediately around the sensor part of the environment or the sensor? Is the Human part of the environment, or part of the 'Climate Control System'?
      *   **Point:** Different boundaries yield different optimal policies. If Human is Environment, optimize temperature. If Human is Agent, optimize comfort (which might mean turning the thermostat *off*).
  *   **15–25 mins: Misconception Interception.**
      *   **Misconception:** *Indexical Belief.* ("Once the system knows its coordinates, it is located.")
      *   **Placement:** End of Boundary section.
      *   **The Line:** "Knowing you are at coordinate $(x,y)$ does not tell you which atoms constitute *you* versus the *wall*."
      *   **Why here:** If earlier, they haven't seen the boundary ambiguity. If later, they assume the boundary is fixed.
      *   **Misconception:** *Intentionality.* ("Mind is directed at world, so what's new?")
      *   **Placement:** Transition to Feedback.
      *   **The Line:** "Intentionality assumes a subject and an object; embedded agency dissolves the subject."
      *   **Why here:** This closes the "Philosophy" objection before the "Engineering" discussion begins.

  #### Phase 2: Feedback & Non-Stationarity (25–45 mins)
  **Goal:** Dismantle the Observation Assumption (Problem 1).

  *   **25–35 mins: The Feedback Loop.**
      *   Standard Picture: Observations are samples from a fixed distribution $P(E)$.
      *   Embedded Reality: Thermostat turns on $\to$ Room warms $\to$ Human opens window $\to$ Sensor reads cold.
      *   **Point:** The observation is not a sample of the "Room"; it is a sample of the "Room + Past Actions." The distribution is non-stationary *because* of the agent.
  *   **35–45 mins: Misconception Interception.**
      *   **Misconception:** *The Frame Problem.* ("This is just knowing what changes.")
      *   **Placement:** Peak of Feedback discussion.
      *   **The Line:** "The frame problem asks what stays the same; embedded agency asks what counts as *you* changing it."
      *   **Why here:** The Frame Problem is about prediction complexity. Embedded agency is about causal entanglement. Distinguish them now before they conflate "hard to predict" with "structurally different."
      *   **Constraint Check:** **Minute 40.** You may now use "Agent," "Intelligence," "Optimization." Use them sparingly to label the structural features already identified.

  #### Phase 3: Self-Reference & Objective Stability (45–70 mins)
  **Goal:** Dismantle the Decision Procedure (Problem 2 & 4).

  *   **45–55 mins: The Decision Procedure in the World.**
      *   The Thermostat's function $f$ is physical (circuitry).
      *   The Human can model $f$. ("It turns on at 18°C, so I'll open the window at 18°C.")
      *   The Thermostat *could* model the Human modeling $f$.
      *   **Point:** To predict the environment, the agent must predict itself. This creates a fixed-point problem (logical loop), not just a causal loop.
  *   **55–65 mins: The Vulnerability of the Objective (The Missing Fourth).**
      *   In the Idealised Picture, the goal (e.g., "Minimize $|Temp - 20|$") is axiomatic.
      *   In the Embedded Picture, the goal is a physical state (voltage setting, or in humans, neural configuration).
      *   **Point:** Physical states can be modified. The Human can smash the thermometer. The Agent can rewire itself (wireheading). The optimizer is optimizable.
  *   **65–70 mins: Misconception Interception.**
      *   **Misconception:** *Engineering/Compute.* ("Just build a bigger model.")
      *   **Placement:** End of Self-Reference.
      *   **The Line:** "No amount of compute resolves a fixed-point contradiction."
      *   **Why here:** This is the final defensive line. If they believe more compute solves it, the session fails. This must be the last conceptual hurdle before synthesis.

  #### Phase 4: Synthesis & Assessment (70–80 mins)

  *   **70–75 mins: Synthesis.**
      *   Re-draw the Idealised Picture. Cross it out.
      *   Draw the Embedded Picture: A cloud of causality with no clear boundary, where the "goal" is just another variable in the cloud.
      *   Explicitly name the field: "Embedded Agency."
  *   **75–80 mins: The Cold Call & Omissions.**

  ---

  ### 4. The Cold Call Question (Minute 75)

  **Question:** "We grant the thermostat a perfect, infinite-compute model of the room, including the human and the thermostat's own circuitry. Why does it still fail to guarantee the temperature stays at 20°C?"

  **The Wrong Answer (Vocabulary Memorization):**
  *   *Sounds like:* "Because it lacks **AGI**," or "It needs **recursive self-improvement**," or "It doesn't have **instrumental convergence**."
  *   *Diagnosis:* The student is treating "Embedded Agency" as a capability tier. They think the problem is that the model isn't "smart" enough.

  **The Right Answer (Structural Understanding):**
  *   *Sounds like:* "Because the model is part of the system it is modeling. Any output the model generates to fix the temperature changes the system state, invalidating the model's prediction. It's a **fixed-point failure**, not a data shortage."
  *   *Diagnosis:* The student understands that the *structure* of the interaction prevents the guarantee, regardless of compute or intelligence level.

  ---

  ### 5. Explicit Omissions

  To make the 80 minutes work, you must explicitly announce what you are **not** doing. Write these on the board at Minute 5.

  1.  **Omission:** *Specific ML Architectures (RL, Transformers, etc.).*
      *   **Reason:** Discussing backpropagation or reward functions triggers the "Engineering" misconception immediately. It distracts the Philosophers and bores the ML students who know the tech but not the philosophy.
      *   **Payoff:** Keeps the focus on the *logical structure* of agency, not the *implementation*.

  2.  **Omission:** *Normative Decision Theories (CDT vs. EDT vs. FDT).*
      *   **Reason:** This is a rabbit hole that consumes 40 minutes alone.
      *   **Payoff:** Prevents the session from becoming a literature review. We are diagnosing the *problem*, not evaluating proposed *solutions*.

  3.  **Omission:** *Consciousness and Qualia.*
      *   **Reason:** Triggers the "Intentionality" misconception ("But does the thermostat *feel* the heat?").
      *   **Payoff:** Allows us to treat the "agent" as a functional block, which is sufficient to demonstrate the structural paradoxes without getting bogged down in philosophy of mind debates.

  4.  **Omission:** *Mathematical Formalisms (Turing Machines, AIXI).*
      *   **Reason:** Creates a barrier for Philosophers; creates a false sense of precision for ML students.
      *   **Payoff:** Ensures the "Thermostat" case carries the weight. If they understand the thermostat, they can formalize it later. If they understand the formalism but not the thermostat, they have learned nothing about *embeddedness*.
