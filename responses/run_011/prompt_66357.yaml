  **Bottom line**

  The amended principle holds that a compromise is permissible if and only if the agent expects net value by their own lights, provided the bargain violates no strict deontological constraints, employs no impermissible means, entails no complicity in fundamentally illegitimate values, and breaches no fiduciary duties. This preserves the gains-from-trade insight while blocking trades that corrupt the agent or their role. The cost is Case 9: the principle evaluates transactions atomically and cannot capture the diachronic erosion of conviction without importing a separate theory of integrity. You must accept that a series of permissible acts can constitute an impermissible life, or else abandon the transactional model entirely. The principle saves your core intuition that trade is generally good while acknowledging that some currencies are too toxic to spend.

  **The principle, clause by clause**

  1. **The Gain Condition:** A trade is permissible only if, weighted by your credences, the outcome improves the world according to your values. This retains your original formulation, motivated by Cases 1, 2, and 7. It excludes altruistic self-sacrifice that disguises itself as trade, ensuring the agent is not irrational by their own standards. It does the work of grounding the permission in rational agency rather than external duty.

  2. **The Rights Constraint:** A trade is impermissible if it requires violating a specific duty owed to a third party who cannot consent. This handles Case 3. The unamended version permitted trading away disabled students' accommodations because the net gain outweighed the loss. This clause asserts that some values are not fungible currency; they are side-constraints. It also explains Case 4: your constraint prohibits voting against rights, while your colleague's constraint prohibits voting for killing. The asymmetry is grounded in the content of your respective duties, not the structure of the trade.

  3. **The Means Constraint:** A trade is impermissible if secured by initiating an impermissible threat. This distinguishes Case 5 from Case 6. In Case 5, you yield to coercion; the threat originates externally, and yielding is a defensive maneuver to save lives. In Case 6, you initiate the threat to slow-walk submissions. The unamended version saw only the net gain; this clause recognizes that the moral cost of becoming a coercer outweighs the departmental gain. It preserves the distinction between duress and coercion.

  4. **The Complicity Constraint:** A trade is impermissible if it requires endorsing or enabling values you deem fundamentally illegitimate, even if the outcome is net positive. This handles Case 8. The unamended version permitted mixing with vile values because the mixture was less bad. This clause asserts that moral contamination is a cost not fully captured by outcome weighting. You cannot treat vile values as merely another preference to be balanced; doing so grants them a legitimacy they do not deserve.

  5. **The Role Constraint:** A trade is impermissible if it violates fiduciary duties attached to your specific role. This handles Case 11. As an individual, you may trade your own votes; as a trustee, you hold resources in trust for a purpose you cannot alter. The unamended version treated all agency as identical; this clause recognizes that roles restrict the set of values you are permitted to maximize. It explains why the same act varies in permissibility across different hats you wear.

  **What it gets right and what it overturns**

  Cases 1 and 2 are confirmed; they satisfy the Gain Condition without triggering constraints. Case 3 is confirmed as impermissible via the Rights Constraint, blocking the trade of accommodations. Case 4 is confirmed as asymmetric; the Rights Constraint applies differently based on agent-relative duties, allowing her trade while forbidding yours. Case 5 is confirmed permissible; the Means Constraint allows yielding to external threats as a defensive measure. Case 6 is overturned from permissible to impermissible; the Means Constraint blocks initiating threats, marking the act as contemptible. Case 7 is confirmed; the Gain Condition handles uncertainty explicitly, treating trade as hedging. Case 8 is overturned from permissible to impermissible; the Complicity Constraint blocks trading with vile values, validating your feeling of contamination. Case 9 is overturned; the principle judges individual transactions permissible, failing to capture the diachronic loss of integrity. You must accept this limitation or add a virtue-theoretic appendix. Case 10 is confirmed but reclassified; it satisfies the Gain Condition (friction avoidance) but is identified as a truce rather than a value trade, resolving your equivocation worry. Case 11 is confirmed via the Role Constraint, delivering distinct verdicts for distinct roles. The principle successfully navigates the asymmetries of 4, 5, and 6, and the contamination of 8, but sacrifices the holistic judgment of 9.

  **The pair I cannot reconcile**

  Cases 7 and 8 turn on the epistemic status of the counterpart's values, not merely your dislike. In Case 7, you assign significant credence (40%) to the possibility that your collaborator is correct. Trading here is not conceding to error but hedging against your own potential mistake. The trade is an epistemic instrument; you are buying insurance against your own fallibility. In Case 8, you are confident the values are vile. Trading here is not hedging but legitimizing. The Complicity Constraint captures this: when credence in the counterpart's correctness drops below a threshold of legitimacy, the cost of endorsement outweighs the outcome gain. The difference is principled because it tracks the truth-aptitude of the values involved, not just your emotional reaction. You are not merely squeamish; you are protecting the integrity of your moral ledger.

  Cases 5 and 6 turn on the origin of the constraint, not the outcome. In Case 5, the funder creates the dilemma; you are navigating a landscape already corrupted by their threat. Your inclusion of the paragraph is a defensive act to preserve the greater good (lives saved) against an external aggressor. In Case 6, you create the dilemma. You corrupt the landscape to secure your gain. The Means Constraint distinguishes between navigating immorality and manufacturing it. This is principled because moral agency involves responsibility for what one initiates, not just what one accepts. To treat them as mirrors is to ignore the moral significance of authorship. You should not concede that they differ only in who is wrong; the difference lies in whether you are compounding the wrong or mitigating it. The principle codifies this by forbidding the initiation of threats while permitting submission to them under duress.

  **Predictions on cases I have not raised**

  1. **The Whistleblower's Silence:** A researcher discovers fraud in a lab that produces life-saving drugs. The lab director offers to fund the researcher's future projects in exchange for silence. The principle verdicts this impermissible. The Gain Condition might be met (more research funded), but the Rights Constraint blocks it (duty to truth/public safety) and the Means Constraint blocks the director (initiating bribery). This probes the limit of "net good" when public trust is the currency.

  2. **The Ulysses Contract:** An agent trades with their future self, binding themselves to a course of action they currently value but anticipate doubting. The principle verdicts this permissible. The Gain Condition is met (current values dominate), and no external rights are violated. This probes the diachronic unity of the agent, highlighting where Case 9's concern about integrity might actually begin—within a single life.

  3. **The Algorithmic Bargain:** An agent trades with an AI optimized for efficiency but lacking moral status. The AI proposes a policy mix that benefits humans but violates privacy. The principle verdicts this impermissible via the Rights Constraint, regardless of the AI's lack of values. This probes whether the Complicity Constraint applies when the counterpart has no values to be contaminated by, confirming that the constraint protects the human agent's integrity, not the relationship.

  **The simpler alternative**

  A simpler alternative is Act Utilitarianism: "Compromise is permissible if and only if it maximizes overall expected value." This abandons the Rights, Means, Complicity, and Role constraints. It simplifies the calculus to a single metric. It would overturn your verdicts on Cases 3, 6, 8, and 11. It would permit trading away disabled accommodations, issuing coercive threats, mixing with vile values, and breaching fiduciary duties, provided the net utility is higher. Is the simplicity worth the loss? No. Your cases demonstrate that moral life is not merely about outcome magnitudes but about the kind of agent one becomes and the duties one holds. The utilitarian principle fails to capture the distinct wrongness of coercion versus duress (Cases 5 and 6) and the specific wrongness of contamination (Case 8). Your intuition that fastidiousness is not always vice is correct; sometimes it is integrity. The baroque principle is necessary because morality is not monolithic. However, you must accept that this complexity comes at the cost of Case 9, where the principle cannot aggregate the slow drift of character. Simplicity buys clarity but loses the texture of moral life you are trying to map.
