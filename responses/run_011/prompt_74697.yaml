answer: |-
  ### The Decision Diagnostic

  **Item 1 (Ambiguity):** Urn A has 50 red and 50 black balls. Urn B has 100 balls, red/black mix unknown. You win \$100 if you draw red. Which urn?
  *Diagnostic: Tests ambiguity aversion (Known vs. Unknown probability).*

  **Item 2 (Weighting):** Option A: \$1 million sure. Option B: 10% chance at \$15 million. Which?
  *Diagnostic: Tests linearity of probability (EU) vs. overweighting small chances (CPT/REU).*

  **Item 3 (Reference-Gain):** Program A saves 200 lives. Program B: 1/3 chance 600 saved, 2/3 none. Which?
  *Diagnostic: Establishes baseline risk attitude in gain frame.*

  **Item 4 (Reference-Loss):** Program C: 400 die. Program D: 1/3 chance none die, 2/3 chance 600 die. Which?
  *Diagnostic: Tests framing effect. Mathematically identical to Item 3.*

  **Item 5 (Catastrophe):** Policy X: 0.01% chance of 1 million deaths. Policy Y: 100 certain deaths. Which?
  *Diagnostic: Tests expectation vs. worst-case focus (Precaution).*

  **Item 6 (Regret):** You pick a door. If you lose, you are shown what was behind the other door. Does this change your choice vs. Item 2?
  *Diagnostic: Tests sensitivity to anticipated regret.*

  **Item 7 (Pascalian):** Tiny chance to end all suffering forever vs. certain cure for one disease. Which?
  *Diagnostic: Tests bounded vs. unbounded value scale.*

  **Item 8 (Stake-Low):** \$10 sure vs. 50% chance at \$25. Which?
  *Diagnostic: Tests risk attitude at trivial stakes.*

  **Item 9 (Stake-High):** \$10,000 sure vs. 50% chance at \$25,000. Which?
  *Diagnostic: Tests stability of risk attitude across magnitude.*

  **Item 10 (Role-Self):** Item 5 scenario, but for your own family. Which?
  *Diagnostic: Tests private risk tolerance.*

  **Item 11 (Role-Public):** Item 5 scenario, but for national policy. Which?
  *Diagnostic: Tests public risk tolerance. Compare to Item 10.*

  **Item 12 (Trap):** Option P: \$100. Option Q: \$100 plus a coin flip for an extra \$10. Which?
  *Diagnostic: Tests dominance. Q is strictly better than P.*

  ***

  ### Scoring Key & Logical Space

  The tree sorts respondents across six logical dimensions: **Probability Linearity** (Linear/Weighted), **Reference Dependence** (Absolute/Relative), **Ambiguity Sensitivity** (Insensitive/Averse), **Aggregation** (Mean/Maximin/Regret), **Value Boundedness** (Bounded/Unbounded), and **Context Invariance** (Invariant/Variable).

  | Leaf Position | Q1 (Ambig) | Q3/4 (Frame) | Q5 (Cat) | Q7 (Inf) | Q10/11 (Role) | Q12 (Dom) | Notes on Empty/Indistinguishable Cells |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Expected Utility (EU)** | Indifferent | Consistent | Expectation | Bounded | Invariant | Q | *Empty Cell:* Ambiguity Seeking + Risk Averse (Unattractive). |
  | **Risk-Weighted (REU)** | Indifferent | Consistent | Weighted | Bounded | Invariant | Q | Indistinguishable from CPT on gains-only (Q3). Needs Q4 to separate. |
  | **Prospect Theory (CPT)** | Indifferent | **Flip** | Weighted | Bounded | Invariant | Q | Indistinguishable from REU if no loss framing (Q4) is used. |
  | **Ambiguity Averse** | **Urn A** | Consistent | Expectation | Bounded | Invariant | Q | *Empty Cell:* Ambiguity Averse + Unbounded Value (Incoherent). |
  | **Minimax Regret** | Indifferent | Consistent | **Avoid Regret** | Bounded | Invariant | Q | Requires Q6 confirmation. Often mimics EU in simple bets. |
  | **Precautionary Maximin** | Indifferent | Consistent | **Policy Y** | Bounded | **Variable** | Q | *Empty Cell:* Maximin + Probability Weighting (Untried/Redundant). |
  | **Pascalian** | Indifferent | Consistent | Expectation | **Unbounded** | Invariant | Q | *Empty Cell:* Pascalian + Maximin (Incoherent). |
  | **Dual-Role Pragmatist** | Indifferent | Consistent | **Variable** | Bounded | **Variable** | Q | Not a formal theory, but a common analyst stance. |
  | **TRAP (Inconsistent)** | Any | Any | Any | Any | Any | **P** | Choosing P violates Statewise Dominance. No theory permits this. |

  **Indistinguishable Leaves:** REU and CPT cannot be separated without loss-framing (Q4). Minimax Regret and EU often overlap unless feedback is explicit (Q6).
  **Empty Cells:** Maximin with Unbounded Value is incoherent (Maximin ignores probability weights needed for infinity). Ambiguity Seeking is theoretically possible but empirically empty in this domain.

  ***

  ### What Your Answers Mean

  **Expected-Utility:** Risk is math. One percent is exactly one-hundredth of a certainty. You maximize the average outcome, ignoring framing or who decides. Consistency is your virtue.

  **Risk-Weighted:** You distrust straight averages. You weight probabilities by how they feel, not just their number. You are consistent, but you worry more about tail risks than math dictates.

  **Prospect Theory:** Context is king. You evaluate gains and losses differently. A sure save feels better than a probabilistic one, but a sure death feels worse. You flip based on framing.

  **Ambiguity Averse:** You distrust the unknown more than the risky. Known odds are safe; unknown odds are suspect. You pay a premium for clarity, even if the math is identical.

  **Minimax Regret:** You fear looking back more than looking forward. You choose to minimize the pain of "I should have picked the other one." Feedback loops drive your choices.

  **Precautionary Maximin:** The worst case is all that matters. If a catastrophe is possible, you prevent it, regardless of probability. You prioritize safety over efficiency.

  **Pascalian:** Infinite value breaks the scale. A tiny chance at eternity outweighs certain finite good. You are vulnerable to "Pascal's Mugging" but logically consistent on value.

  **Dual-Role Pragmatist:** You hold two rulebooks. Private choices maximize gain; public choices minimize ruin. You believe responsibility changes the math, even if the numbers don't.
