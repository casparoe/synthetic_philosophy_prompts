  # JOINT STATEMENT ON METHODOLOGICAL PLURALISM AND EMPIRICAL CONSTRAINTS

  1.  **Corpus Limits:** Both accounts agree that the five identified documents (parish registers, price series, servant's deposition, mayor's letters, pamphlet) constitute the entire known surviving corpus regarding the event of c. 1740.
  2.  **Empirical Baselines:** Both accounts accept the grain-price series and burial registers as reliable indicators of material stress; neither disputes that harvest failure and price spikes occurred prior to the crowd action.
  3.  **Intent vs. Action:** Both accounts agree that no document in the corpus explicitly records a direct order given by town elites to the crowd to initiate violence on day one.
  4.  **Function of the Pamphlet:** Both accounts agree the pamphlet was published three weeks post-event by an outside printer and cannot serve as direct evidence of intent *during* the three days of action.
  5.  **Validity of Inference:** Both accounts agree that "spontaneity" and "organization" are inferential labels applied to observed behaviors, not properties directly visible in the text of the sources.
  6.  **Source Integrity:** Neither account alleges forgery or material tampering with the mayor's letters or the market clerk's price series; the dispute concerns interpretation, not authentication.
  7.  **Explanatory Scope:** Both accounts successfully explain the timing of the violence relative to the harvest failure; neither account denies the other's ability to map the sequence of events chronologically.
  8.  **Role of the Mayor's Letters:** Both accounts agree the letters demonstrate administrative anxiety; they disagree on whether this anxiety reflects a loss of control (Account A) or a managed presentation of loss of control (Account B).
  9.  **Standards of Proof:** Both accounts agree that a newly discovered document explicitly detailing payment to rioters would falsify the spontaneity claim, and both agree that a demonstration of identical narrative structures in purely spontaneous riots elsewhere would complicate the organization claim.
  10. **Historical Responsibility:** Both accounts agree that historians must be explicit about the chain of inference connecting the source text to the historical claim, regardless of whether that chain is evidentiary or narrativist.

  ### STATEMENTS OF DISAGREEMENT

  | Issue | Document-First Formulation | Narrativist Formulation |
  | :--- | :--- | :--- |
  | **Primary Causality** | The price shock is the efficient cause of the riot; the crowd's behavior tracks material necessity regardless of elite opinion. | The price shock is the occasion for the riot; the crowd's behavior tracks political opportunity structured by elite signaling. |
  | **Status of the Mayor's Letters** | The letters are reports constrained by official duty; their value lies in their factual accuracy regarding the threat level. | The letters are performances designed for a regional audience; their value lies in their rhetorical construction of the threat level. |
  | **The Servant's Deposition** | The deposition is testimony given under oath; deviations from truth carry legal risk and thus it tracks actual events closely. | The deposition is a legal genre piece; deviations follow tropes of innocence and victimhood required by the court structure. |
  | **Definition of "Evidence"** | Evidence is that which constrains the hypothesis; a claim is valid if it survives attempts at falsification by the corpus. | Evidence is that which sustains the plot; a claim is valid if it renders the corpus coherent without suppressing its contradictions. |
  | **The Pamphlet's Role** | The pamphlet is exogenous noise; it reflects external discourse but does not explain local action. | The pamphlet is endogenous closure; it completes the event's meaning by fixing its public reception. |
  | **Silence in the Archive** | The absence of records regarding elite coordination is evidence that such coordination did not exist. | The absence of records regarding elite coordination is typical of factional politics where implicit understanding leaves no paper trail. |

  ### CRUXES AND PREDICTIVE TESTS

  The following sub-questions identify points where further investigation could shift the weight of consensus. We agree to the following tests and record our divergent predictions in advance.

  **Crux 1: Regional Price-Riot Correlation**
  *   **Test:** Compile a dataset of price spikes and crowd actions in five comparable market towns within the same region over the same decade.
  *   **Document-First Prediction:** We expect a high correlation coefficient between price spikes and crowd action across the region. If this town is an outlier, the spontaneity claim weakens.
  *   **Narrativist Prediction:** We expect a low correlation coefficient, with violence occurring only where specific local elite factions exist. If this town matches the regional pattern, the organization claim weakens.

  **Crux 2: Syntactic Agency in the Mayor's Letters**
  *   **Test:** Perform a linguistic analysis of agency in the mayor's letters (e.g., frequency of active vs. passive voice regarding the crowd).
  *   **Document-First Prediction:** We expect the mayor to describe the crowd as the active agent of destruction ("the crowd broke," "they stormed"), reflecting observed reality.
  *   **Narrativist Prediction:** We expect the mayor to describe the crowd as a passive force or natural disaster ("the town was subjected to," "violence erupted"), reflecting a political strategy to absolve local administration.

  **Crux 3: The Servant's Deposition vs. Parish Registers**
  *   **Test:** Cross-reference the servant's claims about specific injuries/deaths with the parish burial register entries for that week.
  *   **Document-First Prediction:** We expect high concordance. Significant discrepancies would indicate the deposition is unreliable testimony.
  *   **Narrativist Prediction:** We expect discrepancies to follow a pattern of exculpation (e.g., omitting deaths caused by defenders). Concordance would not prove factual reliability, only genre adherence.

  ### VERBAL VS. SUBSTANTIVE DISPUTES

  After a decade of debate, we identify the following distinctions between terminological confusion and genuine methodological divergence.

  **Verbal Disputes (Resolvable by Definition)**
  *   **"What Happened":** When the Document-First historian says "what happened," they refer to the ontological occurrence of the three days. When the Narrativist says "what happened," they refer to the historiographical account constructed from the corpus. We agree these are different objects of study.
  *   **"Bias":** When the Document-First historian says "bias," they mean a distortion of fact that can be corrected via corroboration. When the Narrativist says "bias," they mean an inevitable perspective that structures selection and emphasis. We agree that sources are both distorted (in the first sense) and perspectival (in the second).
  *   **"Truth":** We agree that "truth" in the Document-First sense corresponds to accuracy of representation, while "truth" in the Narrativist sense corresponds to coherence of explanation. We are not arguing over the same definition.

  **Substantive Disputes (Irreducible via Good Faith)**
  *   **Criteria for Sufficiency:** We disagree on when a chain of inference is too long to be admissible. The Document-First historian requires a direct link between price and action; the Narrativist accepts a link mediated by political culture. No amount of clarification will align these thresholds.
  *   **The Status of Silence:** We disagree on the evidentiary weight of absence. The Document-First historian treats the lack of coordination records as negative evidence; the Narrativist treats it as neutral evidence due to the nature of elite communication. This is a fundamental disagreement about archive theory.
  *   **Falsification vs. Coherence:** We disagree on what kills a hypothesis. The Document-First historian believes a single contradictory document can falsify a claim. The Narrativist believes a claim survives if it can absorb the contradiction into a more complex plot. This is a disagreement about the logic of historical proof.
