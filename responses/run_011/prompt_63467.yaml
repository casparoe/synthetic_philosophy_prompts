answer: |-
  You have independently rediscovered one of the most significant debates in contemporary political philosophy, and you have done it from the street level, where the theory actually bleeds.

  The short answer is: **No, there is no single common noun for that specific three-part shape.** There are names for the pieces, but the way they lock together into a self-defeating system—the way the *attempt to measure* destroys the *thing being measured*—is usually discussed as a cluster of objections rather than a single named phenomenon.

  However, since you asked me to name it if it doesn't exist, and to carve it tight enough to be useful: I propose we call this **The Desert Verification Paradox**.

  Below is the carving you asked for. I will map your three observations to the existing philosophical literature (so you can find the "standard replies"), distinguish it from the concepts you already know, and define the edges where it stops applying.

  ### 1. The Context: What Theory Are You Fighting?
  The framework your charity is using has a name: **Luck Egalitarianism**.
  This is the view that inequalities are unjust if they arise from "brute luck" (things out of your control) but just if they arise from "option luck" (consequences of your free choices). Its goal is to compensate for bad luck without subsidizing bad choices.

  You have hit the wall that philosopher **Elizabeth Anderson** hit in her seminal 1999 paper, *"What is the Point of Equality?"* She argued that trying to implement this distinction in the real world is impossible and insulting. Your three observations map almost perfectly to the three main philosophical objections to Luck Egalitarianism:

  1.  **Your Point 1 (Narrating worst decisions):** This is the **Expressive Objection**. To prove you deserve help, you must humiliate yourself by proving you are incompetent or victimized. It turns aid into a judgment of moral worth.
  2.  **Your Point 2 (The proud don't come):** This is **Adverse Selection driven by Dignity Costs**. In economics, "adverse selection" is when bad risks buy insurance. In your case, the "risk" is honesty. The cost of applying isn't just time; it's a "dignity tax." Those with high dignity costs (the proud) opt out; those with low dignity costs (the performers) opt in.
  3.  **Your Point 3 (The distinction doesn't exist):** This is the **Epistemic Objection**. Institutions cannot access the causal history of a human life. "Choice" and "Circumstance" are entangled. Deciding which is which is not a finding; it is an act of imagination by the caseworker.

  ### 2. The Name: The Desert Verification Paradox
  While the pieces above exist separately, your insight is that they form a feedback loop. The *process* of verification alters the *population* and the *truth*.

  **Definition:** The Desert Verification Paradox occurs when an institution attempts to distribute resources based on moral causality (luck vs. choice), but the mechanism required to verify that causality systematically excludes the truthful, incentivizes deception, and relies on distinctions that are ontologically inaccessible.

  **The Mechanism:**
  *   **Input:** A requirement to prove "innocence" (bad luck).
  *   **Process:** An intrusive inquiry into personal history.
  *   **Output:** A selection of applicants who are best at narrating victimhood, filtered by their willingness to be humiliated, judged by criteria that cannot be objectively met.
  *   **Result:** The fund appears to help the "deserving," but actually helps the "compliant," while the "deserving" who refuse the humiliation go without.

  ### 3. The Carving: How to Distinguish It
  You asked for the edges. Here is how you tell this apart from the other concepts you mentioned.

  **Vs. Means-Testing Stigma**
  *   *Stigma* is the feeling of shame associated with receiving aid.
  *   *The Paradox* is the structural requirement to *perform* that shame to get the aid.
  *   *The Edge:* If you could remove the shame but keep the questions (e.g., a private, non-judgmental survey), stigma might drop, but the Paradox would remain. Why? Because the *questions themselves* (Point 3) still demand a distinction between luck and choice that cannot be answered honestly. Stigma is the emotional cost; the Paradox is the epistemic impossibility.

  **Vs. Moral Hazard**
  *   *Moral Hazard* is about the **future**. It argues that if you insure people against risk, they will take *more* risks next time (e.g., "If I know they'll fix my car, I won't save for repairs").
  *   *The Paradox* is about the **past**. It argues that to get the insurance, you must lie about *previous* risks.
  *   *The Edge:* Moral hazard worries that aid makes people irresponsible. The Paradox observes that the *screening for responsibility* makes people deceptive. One fears future behavior; the other corrupts present truth-telling.

  **Vs. Administrative Burden (Sludge)**
  *   *Administrative Burden* is the time and effort required to fill out forms.
  *   *The Paradox* is specific to **moral narration**.
  *   *The Edge:* If the form asked only for bank statements (objective data), it would be Administrative Burden. Because the form asks for *reasons* ("Why did you spend it on that?"), it becomes the Desert Verification Paradox. The burden isn't the paperwork; it's the moral autobiography.

  ### 4. Where Does It Stop Applying? (The Boundaries)
  This Paradox does not apply to all charity. It applies specifically to **Causal Means-Testing**.

  *   **Case A (Paradox Applies):** "We will pay your rent if you lost your job through no fault of your own."
      *   *Why:* Requires judging the cause of unemployment. Invites the luck/choice blur.
  *   **Case B (Paradox Does Not Apply):** "We will pay your rent if your income is below $X and your rent is $Y."
      *   *Why:* This is **Need-Based**, not **Desert-Based**. It does not ask *why* you are poor, only *that* you are poor. The verification is mathematical, not moral.
  *   **Case C (Paradox Does Not Apply):** "We give $500 to anyone in this zip code who asks."
      *   *Why:* This is **Universal** (within a boundary). There is no screening for desert, so there is no incentive to perform helplessness.

  ### 5. The Standard Replies (What Do We Do?)
  Since you asked for the standard replies from the literature and policy world, here is how philosophers and effective altruists suggest solving the Desert Verification Paradox.

  **1. Abandon the Distinction (The Anderson Solution)**
  Stop trying to separate luck from choice. It is too expensive, too intrusive, and too inaccurate. Shift to a **Sufficiency View**. The goal of charity is not to ensure people only get what they "deserve," but to ensure no one falls below a certain floor of dignity.
  *   *Practical shift:* Move from "Why did this happen?" to "What do you need to fix it?"

  **2. Reduce Discretion (The Rules-Based Solution)**
  You noted the decision depends on the "mood in the room." This is **Street-Level Bureaucracy Discretion**. The standard reply is to rigidify the criteria so the caseworker doesn't have to judge character.
  *   *Practical shift:* Create bright-line rules (e.g., "Job loss verified by letter = grant approved") rather than narrative assessments ("Tell us about your job loss").

  **3. Trust-Based Philanthropy (The MacKenzie Solution)**
  This is a growing movement in your exact field. It argues that the "overhead" of vetting is often larger than the grant itself, and the vetting process creates the power imbalance you described.
  *   *Practical shift:* Give unrestricted cash with minimal questions. Accept a higher rate of "fraud" (people taking money who don't *really* need it) as the necessary cost of not humiliating the people who *do*. The math often works out better because administrative costs plummet and take-up rates among the "proud" skyrocket.

  ### Summary
  You are not missing a word; you are seeing the structural flaw in **Luck Egalitarianism** when implemented by an institution.

  I recommend you call it **The Desert Verification Paradox**.
  *   **It is not Stigma:** It is the incentive to lie, not just the feeling of shame.
  *   **It is not Moral Hazard:** It is about past narration, not future risk.
  *   **It stops** when you stop asking "Why?" and start asking "How much?"

  Your intuition is correct: The distinction your charity is trying to draw cannot be drawn by anyone obliged to draw it. The philosophy assumes a "God's eye view" of causality that no caseworker across a desk can ever have. When you try to force that view, you don't get justice; you get theater.
