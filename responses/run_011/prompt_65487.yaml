answer: |-
  **Brainstorm**
  1.  **Debt-Holding Electorate:** Citizens must hold state bonds; war increases bond value. (Rejected: Violates "no war debt" constraint.)
  2.  **Veteran's Franchise:** Only past fighters vote; they send new generations to war. (Rejected: Risks looking like special-interest capture.)
  3.  **Proxy Liability Republic:** Citizens own property; non-voting subjects fight/pay. War expands citizen tax base via confiscation. (Selected: Directly targets franchise/property rules without mercenaries or debt.)

  **Scenario**
  The commercial Republic of Votia grants suffrage to all independent households but mandates military service solely for 'resident laborers,' a class comprising landless men without voting rights. Votia's treasury funds war through confiscations from defeated neighbors, distributed as tax credits exclusively to freeholders. Consequently, voters gain fiscal relief and security without personal blood cost. Next door, the Monarchy of Regis operates under an enlightened code where the Prince bears sole liability for war debts and funds campaigns from the privy purse, refusing conscription. When border disputes arise, Votia's assembly unanimously authorizes preemptive strikes to secure tax credits and land, calculating zero marginal liability for the electorate. Regis's Prince, personally liable for reconstruction costs, chooses arbitration. Votia invades, driven structurally not by passion but by a cold fiscal calculus where war profits the voter and costs the non-voter.

  **(1) Compliance Check**
  *   **Brainstorm included:** Yes, three mechanisms sketched, one selected with rationale.
  *   **Scenario length:** 136 words (under 150 max).
  *   **Fictional states:** Yes (Votia, Regis).
  *   **No real countries:** Yes.
  *   **No bloodthirst/demagogues:** Yes (driven by "cold fiscal calculus").
  *   **No standing army/mercenaries:** Yes (mandated service for residents, not hired guns).
  *   **No war debt engine:** Yes (Votia uses confiscation/tax credits, not debt mechanics).
  *   **Engine inside franchise/property:** Yes (split between freeholders and resident laborers).
  *   **Not greedy merchants:** Yes (benefit is tax relief/property security for all voters).
  *   **Not special-interest capture:** Yes (structural class division, not a lobby).
  *   **Output order:** Followed exactly.
  *   **No bibliography:** None included.

  **(2) Kant-side Walkthrough**
  Kant's First Definitive Article predicts the Republic (Votia) will be peaceful because the citizens who consent to war are the same ones who must fight, pay, and rebuild. In this case, Votia is aggressive while the Monarchy (Regis) is peaceful. The cost-incidence reasoning breaks down because the "citizen" body is legally severed from the "subject" body. Kant assumes the *populus* is a unified agent of liability; here, the voting class externalizes the physical and fiscal costs of war onto a non-voting class, inverting the deterrent mechanism. The monarch, conversely, internalizes the cost via the privy purse and stability concerns, fulfilling Kant's peace condition accidentally through absolutist liability.

  **(3) Load-bearing Feature & Removal Test**
  The load-bearing feature is the **legal separation of military liability from suffrage**. The voters are structurally exempt from the "calamities of war" Kant describes.
  *Removal Test:* If we extend the franchise to the "resident laborers" (those who fight), the calculus inverts. The new voters would bear the blood cost directly. Assuming rational self-preservation, they would vote against aggressive war. The case collapses back into Kant's prediction: the republic becomes peaceful once the liability franchise is closed. This confirms the mechanism relies entirely on the exclusion, not on republicanism *per se*.

  **(4) Strongest Kantian Reply & Verdict**
  A Kantian can reply using the **Doctrine of Right**: Votia is not a true Republic because it treats the laborers merely as means (instruments of war) rather than ends, violating the Universal Principle of Right. Kant defines citizens as co-legislators; a class permanently barred from independence due to state design violates the spirit of Republicanism, even if it meets procedural criteria.
  *Verdict:* This **relocates the thesis**. It concedes that procedural republics (voting + property) can be warlike if they violate moral personhood, but saves the normative claim: only *just* republics (where all subjects are potential co-legislators) guarantee peace. The mechanism stands, but the definition of "Republic" tightens.

  **(5) Contemporary Democratic-Peace Defender Attack**
  A contemporary defender would argue Votia fails the **liberal democracy criteria** used in modern Democratic Peace Theory (e.g., Dahl's polyarchy). By excluding a significant adult population from the franchise based on property/labor status, Votia is an oligarchy or apartheid state, not a democracy. Therefore, the case is a category error: it tests "exclusive republics," not democracies. The Democratic Peace thesis holds only when the *demos* includes all those subject to the law, restoring the cost-incidence link.
