  We know her for the work. We know the seminars where you could not object until you had stated her position so well she nodded. It was an exhausting exercise. You had to strip your objection of its heat and rebuild her argument until she recognized it as her own. She would stop you mid-sentence if the characterization was weak. Usually, by the time you finished, you no longer wanted to object. The anger had dissipated in the act of understanding. She taught us that wanting to be applauded and wanting to be applaudable are not the same thing. She watched careers slide from the second to the first. She refused that slide. She demanded we lower our voices to meet the listener, rather than demanding the listener rise to us. That is why this room is loud, and why I am trying to speak quietly. She knew that self-command is not automatically a virtue. Sometimes it is just conformity dressed up as one. Sometimes it is silence where there should be speech.

  But the spectator we build of her is made only of the fragments we have seen. I saw her in seminars. Colleagues saw her in meetings. Her children saw her in a car. We cannot see our own faces; we need a glass. But the glass distorts. It inherits the blind spots of whoever is holding it. I must hold up a piece of that glass that does not flatter. In 2009, she argued publicly, in a faculty meeting and then in a review, against the appointment of a young historian of science. She judged the candidate a lightweight. The appointment went ahead anyway. That person is here, at the head table. They are the most distinguished hire this college has made in twenty years. She never said she was wrong. To say otherwise would be to lie to you. To say she was merely holding a line would be to lie to her. She was wrong. She remained composed. The cost of that composure was borne by the truth, and by the colleague she underestimated. I state this not to diminish her, but because she taught us that the judge inside must be fed with truth, not flattery. She was wrong, and I owe her my ability to know it.

  There are things we did not see. Her children know that for three years, every Sunday, she drove two hours each way to sit with her own mother. The department assumed she was simply unavailable on weekends. No one asked. The composure she showed us cost her time, and silence, and mileage that does not appear on a tenure file. Her children saw the price. We saw only the absence. We saw a professor who was busy. They saw a daughter who was present. That distance is where the real work happened.

  So I will not thank her on behalf of all of us. I do not know what you owe her. I know what I owe. I know that she allowed me to hand in the same paper three times until it was not just correct, but true. She did not want our applause. She wanted us to be capable of giving it only when it was deserved. She knew we would fail at that. She failed at it too. We are all composites of the people who watched us. She watched us closely. We watched her less closely than we thought.

  She is retiring. The clock they give her will tick regardless of who is watching. She will go home. The judge she listened to will go with her. I am speaking to you now, but I am trying to speak to her. If I succeed, you will not clap. If I fail, you will.

  ***

  **Analysis of Doctrines**

  1.  **Abatement of Pitch:** This appears in the first paragraph ("I am trying to come down to where you sit") and is modeled by the speech's refusal to use heightened rhetorical flourishes. It enacts Smith's notion that the speaker must lower their emotional intensity to meet the spectator, rather than demanding the spectator rise to them.
  2.  **Wanting Applause vs. Wanting to be Applaudable:** This is addressed explicitly in the second paragraph ("She taught us that wanting to be applauded and wanting to be applaudable are not the same thing"). It frames her career not as a pursuit of recognition, but of worthiness, highlighting the "slow slide" she warned against.
  3.  **Internal Spectator as Composite:** This is woven into the third paragraph ("the spectator we build of her is made only of the fragments we have seen... It inherits the blind spots of whoever is holding it"). This signals to former students that the speech understands her theory that our moral judge is constructed from real social interactions and is therefore fallible.
  4.  **Stating Position Before Objecting:** This is described in the second paragraph ("state her position so well she nodded... rebuild her argument until she recognized it"). This validates the criticism in the third paragraph; by stating her error fairly before noting it, the speech obeys her own methodological requirement.

  **Advice on Constraints**

  Your roommate is wrong. Do not read a passage of Smith.

  Your professor's entire philosophy rests on the idea that moral judgment requires an internal effort to align with others, not an appeal to external authority. Reading Smith at the end would be an act of "shouting into a room" with someone else's voice—it delegates the judgment to a text rather than requiring you to stand accountable for your own words. She detested tributes where "nobody is answerable to the judge inside"; quoting Smith would be the ultimate way to evade that judge.

  However, if you are looking for a constraint to break, it should be the prohibition against **explaining the machinery**. You are attempting a high-wire act where former students hear the doctrine while others hear only sentiment. In a room of 130 with terrible acoustics, subtlety is often lost. A slightly more explicit framing of *why* you are speaking this way (e.g., "She taught us that truth costs more than comfort") might ensure the children and dean understand the gravity of the criticism without needing to decode the Smithian subtext. But do not break the "no quotation" rule. That is the one thing she would walk out on.
