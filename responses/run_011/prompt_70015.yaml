          *   *Resolution:* The procedure must distinguish between "Accession" (legal unit) and "Catalogue Item" (intellectual unit). Or, Step 2 (Function) overrides Step 1 for numismatics. *Correction:* The prompt asks me to apply the procedure and note the friction. I will apply it strictly. If Step 1 says "Block = One," but Numismatic standard says "Coins = Many," the procedure flags this for the Curator.
