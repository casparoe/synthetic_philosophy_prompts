answer: |-
  # The Museum Composition Protocol (MCP)

  **Purpose:** To determine the "Cataloguing Unit" (CU) for accessioning.
  **Output:** A binary decision: **Single Record** (with part-level sub-records) or **Multiple Records** (bound by group).
  **Metaphysical Status:** The MCP does not determine what *exists*. It determines how the museum *acts as if* composition obtains. It is pragmatically invariant: a Nihilist (nothing composes) and a Universalist (everything composes) will generate identical database records, though they will disagree on the ontological status of those records.

  ---

  ## Part I: The Decision Procedure

  Run these steps in sequence. If a step returns **SINGLE**, stop and draft the record. If a step returns **MULTIPLE**, proceed to the next step. If the final step is reached, the default is **MULTIPLE**. If evidence is **UNCLEAR** at any stage, stop and refer to the Curator.

  ### Step 1: The Cohesion Test
  *   **Operationalizes:** *Contact/Fastening View* (Composition obtains when parts are physically joined).
  *   **If this candidate is false:** Physical connection is not sufficient for composition (e.g., two glued stones are still two stones). The procedure relies on Step 2 to salvage unity.
  *   **Question:** "Are the components physically connected, interlocked, or contained within a single housing such that moving one component necessitates moving the others without the use of tools?"
  *   **Sufficient Answer (YES):** Record as **SINGLE**. (Example: A mounted insect, a painted canvas on a stretcher).
  *   **Sufficient Answer (NO):** Proceed to Step 2.
  *   **Missing/Unclear Evidence:** (e.g., internal structure unknown, adhesive type unidentified). **STOP.** Default to **MULTIPLE**. Hand to Curator.

  ### Step 2: The Integrity Test
  *   **Operationalizes:** *Artifactalism/Function View* (Composition obtains when parts serve a unified function or artistic intent).
  *   **If this candidate is false:** Function is not a metaphysical glue (e.g., a pile of bricks intended for a wall does not compose a wall until built). The procedure relies on Step 3 to salvage unity.
  *   **Question:** "Is there documented evidence (artist statement, design plan, archaeological context) that these components were created, used, or deposited to function as a single operational or aesthetic unit?"
  *   **Sufficient Answer (YES):** Record as **SINGLE**. (Example: A disassembled engine, a reconstructed vessel, an installation with separate parts).
  *   **Sufficient Answer (NO):** Proceed to Step 3.
  *   **Missing/Unclear Evidence:** (e.g., intent ambiguous, function debated). **STOP.** Default to **MULTIPLE**. Hand to Curator.

  ### Step 3: The Stipulation Test
  *   **Operationalizes:** *Interest-Relative/Convention View* (Composition obtains when an authority defines it as such).
  *   **If this candidate is false:** Social convention does not alter ontology. However, for museum purposes, legal definition overrides metaphysical doubt.
  *   **Question:** "Does a binding legal or administrative document (deed of gift, loan contract, excavation permit, insurance schedule) explicitly define this aggregate as one item?"
  *   **Sufficient Answer (YES):** Record as **SINGLE**. (Example: A 'lot' at auction, a hoard defined by finder's law).
  *   **Sufficient Answer (NO):** Proceed to Step 4.
  *   **Missing/Unclear Evidence:** (e.g., contract language vague, donor verbal intent only). **STOP.** Default to **MULTIPLE**. Hand to Curator.

  ### Step 4: The Default (Nihilist Fallback)
  *   **Operationalizes:** *Nihilism* (Composition never obtains; only simples exist).
  *   **Rationale:** In the absence of cohesion, function, or stipulation, the museum minimizes liability and maximizes granularity by treating parts as distinct.
  *   **Instruction:** Record as **MULTIPLE**. Bind records with a "Group" tag if necessary for storage location.
  *   **Curator Override:** If the Cataloguer believes the **MULTIPLE** verdict creates absurdity (e.g., valuing a pile of dust as 1,000 items), they must **STOP** and hand to Curator. This is a matter of institutional value, not fact.

  ---

  ## Part II: Invariance Statement

  **Is the procedure invariant under metaphysical extremes?**
  **Yes.** The MCP yields the same *cataloguing instruction* regardless of the operator's ontological commitments.
  *   **The Universalist** records "1 Kylix" believing a composite object exists.
  *   **The Nihilist** records "1 Kylix" believing only "simples arranged kylix-wise" exist, but acknowledging the *record* must track the arrangement.
  *   **The Conventionalist** records "1 Kylix" because the database requires a primary key.

  The procedure bypasses the *truth* of composition to establish the *utility* of the record. It treats "Objecthood" as a normative status assigned by the museum, not a descriptive fact discovered in the world.

  ---

  ## Part III: Application to Cases

  ### 1. The Kylix (60 Sherds, Documented Losses)
  *   **Step 1 (Cohesion):** **NO.** Sherds are loose.
  *   **Step 2 (Integrity):** **YES.** Archaeological context and form indicate a single vessel intended for use. The losses do not negate the original functional unity.
  *   **Verdict:** **SINGLE Record** (with 60 part-records).
  *   **Note:** This relies on Artifactalism. If the Function view is false, this should be 60 objects. The MCP prioritizes the functional intent for archaeological utility.

  ### 2. The Coin Hoard (400 Coins, Lifted as Block)
  *   **Step 1 (Cohesion):** **YES.** Lifted as a soil block; coins are physically fixed relative to each other by matrix.
  *   **MCP Verdict:** **SINGLE Record.**
  *   **Registrar's Conflict:** You noted valuation and publishing assume separability.
  *   **Resolution:** This is a **Step 4 Override**. While Step 1 technically passes, the "absurdity clause" applies. Valuation requires individual identity.
  *   **Action:** **STOP.** Hand to Curator. The Curator must invoke *Step 3 (Stipulation)* retroactively: "Numismatic convention stipulates coins are separate items even within a hoard." The MCP identifies the friction; the Curator resolves it by prioritizing Step 3 over Step 1.

  ### 3. The Restored Cabinet (Diachronic Problem)
  *   **Problem:** The MCP tests *synchronic* composition (what exists now). The Cabinet raises the *Ship of Theseus* problem (identity over time).
  *   **Does MCP carry it?** **No.** Step 1 and 2 assess current state, not historical continuity.
  *   **Required Module: The Continuity Test.**
      *   **Question:** "Does the item retain its original form and function despite material replacement, and is the replacement documented as conservation rather than creation?"
      *   **If YES (Conservation):** Maintain original Accession Number (Single Object).
      *   **If NO (Recreation):** Deaccession original (if no material remains); Accession new object (Separate Object).
      *   **If UNCLEAR:** **STOP.** Hand to Curator. This is a judgment on the *threshold of identity*, which is institutional convention, not fact.

  ### 4. The Quartz Cluster (With Detached Crystal)
  *   **Step 1 (Cohesion):**
      *   Cluster: **YES.** Crystals grow interlocked.
      *   Detached Crystal: **NO.** It is loose in the tray.
  *   **Step 2 (Integrity):** **N/A.** (Natural objects lack "intent," though they have geological unity).
  *   **Verdict:**
      *   Cluster: **SINGLE Record.**
      *   Detached Crystal: **MULTIPLE Record** (linked to Cluster record as "Associated Part").
  *   **Check:** The procedure works on naturalia without artifact bias. Step 1 (physical growth connection) suffices for the cluster; Step 4 (Default) separates the loose crystal.

  ---

  ## Part IV: Limits of the Instrument

  **1. Indeterminacy:**
  The MCP leaves *identity over time* (The Cabinet) indeterminate, requiring the separate Continuity Module. It also leaves "absurd" outcomes (The Hoard) indeterminate, requiring Curatorial override. It cannot resolve cases where Function and Stipulation conflict (e.g., an artist intends a single work, but the insurer demands itemized valuation).

  **2. Fiat:**
  Step 4 is pure fiat. It asserts that in the absence of evidence for unity, the museum *deems* the parts separate. This is not a metaphysical claim that composition fails; it is a risk-management strategy.

  **3. Metaphysical Work:**
  The MCP performs **zero** metaphysical work. It does not answer the Special Composition Question. It answers the *Special Cataloguing Question*: "Under what conditions do we *track* xs as a y?"
  *   It uses metaphysical criteria (Contact, Function) as *proxies* for administrative convenience.
  *   It is a **Normative Composition Rule**. It creates the objects it claims to find by assigning them record status.
  *   **Warning:** Do not confuse the Accession Number with Ontological Unity. The record is a legal fiction designed to facilitate insurance, loan, and conservation. If the literature asks "Do these compose?", the MCP answers "We will act as if they do."
