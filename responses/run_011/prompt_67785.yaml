answer: |-
  ### Design Choice: "The Stemmatic Trap"

  I recommend a controlled transmission chain I call **The Stemmatic Trap**. 

  **Why this design?**
  Most "telephone game" variations fail historiography courses because the degradation is random noise. To teach *recoverability*, students need to encounter *systematic* error. This design forces the class into a stemmatic relationship (family tree of texts) without their knowledge. By giving two groups the exact same "Witness Source" but isolating them, you manufacture false independence. When they later see two "Legends" agreeing on a detail, they will naturally argue for independent attestation. The reveal that those accounts share a common ancestor demolishes that criterion in real-time. Additionally, by seeding one Witness Source with an "awkward detail" (the Hero fails), you create a live test for the Criterion of Embarrassment. If the groups tasked with glorifying the Hero keep the failure detail, it survives *because* it was hard to remove. This design fits 18 students perfectly (6 groups of 3), fits the 90-minute window, and requires no philosophy jargon to execute.

  ***

