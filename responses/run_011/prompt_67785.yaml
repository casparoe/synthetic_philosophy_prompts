prompt: |-
  I'm teaching a 90-minute seminar for about 18 second-years on how much of the legendary past is actually recoverable -- Trojan War, King Arthur, the Exodus -- and it's a historiography course, so no philosophy background to lean on. I want an activity where they manufacture a legend and then have to dig the history back out of it, instead of me lecturing about criteria of historicity.

  So: phase one, they witness something perfectly ordinary happen at the front of the room, and it gets retold down several generations of retellers who have some reason to embellish. Phase two, they're handed only the surviving accounts and have to rule on three specific claims about what happened. The thing I most want built into the rules: make the transmission branch, so that several surviving accounts secretly descend from a single telling, and let them run into that when they try to use "independently attested" as a reason. Also plant one detail that's awkward for the person passing it on, and see whether the historians catch it.

  Commit to one design, not a menu of variants, and tell me why that one. Then finish with a JSON object: {materials, phases: [{minutes, what_happens, what_they_should_hit}], payoff_scheme, debrief_map: [{moment_in_the_game, concept_it_instances}], first_run_failures: [{failure, mitigation}], cannot_reproduce: [string]}.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Design a 90-minute seminar activity for 18 second-year students (historiography course, no philosophy background).
      *   **Topic:** Recoverability of the legendary past (Trojan War, King Arthur, Exodus).
      *   **Core Mechanic:** Students manufacture a legend (Phase 1) and then dig history out of it (Phase 2).
      *   **Specific Constraints:**
          *   Phase 1: Witness an ordinary event, retold down generations with embellishment.
          *   Phase 2: Handled only surviving accounts, rule on three specific claims.
          *   **Crucial Mechanic:** Transmission must *branch* (some accounts descend from a single telling) to trap them on "independent attestation."
          *   **Crucial Mechanic:** Plant one awkward detail (embarrassing/awkward for the teller) to see if they catch it (criterion of embarrassment).
          *   **Output Format:** Commit to *one* design (no menu), explain why, then provide a specific JSON object with keys: `materials`, `phases`, `payoff_scheme`, `debrief_map`, `first_run_failures`, `cannot_reproduce`.
      *   **Time:** 90 minutes total.
      *   **Class Size:** 18 students.

  2.  **Deconstruct the Activity Design:**
      *   *Event:* Needs to be simple, observable, but open to interpretation. A "magic trick" gone wrong? A specific interaction between the instructor and a volunteer? Let's go with a specific physical interaction involving props. It needs to be mundane enough to be believable but specific enough to have details.
      *   *Transmission:* Needs to simulate oral tradition/textual transmission. Since it's 90 minutes, we can't do actual "generations" taking weeks. It needs to happen in real-time.
      *   *Branching:* This is the tricky part in a live room. I need to split the class into groups that represent different "traditions," but secretly ensure some groups get the same source material.
      *   *Awkward Detail:* Something that makes the "hero" look bad or contradicts the narrative arc.
      *   *Phase 2:* Students act as historians analyzing the "texts" produced in Phase 1.
      *   *Why this design?* It needs to be robust, fit the time, and directly illustrate the historiographical concepts (independence, embarrassment, coherence, etc.).

  3.  **Developing the "One Design":**
      *   *Concept:* "The Incident of the Broken Vase."
      *   *Setup:* Instructor brings a prop (a cheap vase/cup). A volunteer helps. Something happens.
      *   *Transmission Chain:*
          *   Group A (Witnesses): See the event. Write Account 1.
          *   Group B (Tradition 1): Get Account 1. Write Account 2.
          *   Group C (Tradition 2): Get Account 1 (Secretly same source as B). Write Account 3.
          *   Group D (Tradition 3): Get Account 2. Write Account 4.
          *   *Correction:* To make branching clear in the analysis phase, I need to create "texts" beforehand or simulate the degradation quickly.
          *   *Better approach for 90 mins:* The "Telephone" game is too messy. Let's pre-prepare the "texts" based on a live event, OR have the students generate the texts in clusters.
          *   *Refined Approach:*
              1.  **Event (5 mins):** Instructor + Volunteer perform a 2-minute skit. 18 students watch.
              2.  **Generation 1 (10 mins):** 6 students (Witnesses) write down what they saw.
              3.  **Generation 2 (15 mins):** 6 students (Scribes) receive *one* of the Witness accounts (secretly duplicated) and rewrite it as a "Legend" (embellish).
              4.  **Generation 3 (15 mins):** 6 students (Chroniclers) receive *one* of the Scribe accounts (again, secretly duplicated/branched) and rewrite it as "History/Myth" (further embellish/rationalize).
              5.  **Analysis (45 mins):** The whole class gets the 6 final "Chronicler" texts. They don't know the lineage. They must judge 3 claims.
      *   *The Trap:* Two of the Witness accounts are actually identical (or I guide them to be similar), or better: I control the distribution.
      *   *Actually, to ensure the branching trap works:* I should pre-prepare the "transmission" logic. If I let them write freely, the branching might not be obvious.
      *   *Revised Plan for Branching:*
          *   Event happens.
          *   3 "Witnesses" write accounts (A, B, C).
          *   I (Instructor) collect them.
          *   I create 6 "Version 1" texts. Two are based on A, Two on B, Two on C. (This creates the false independence).
          *   I distribute these to 6 "Scribes." They embellish.
          *   I collect those. I create 6 "Version 2" texts (the final artifacts).
          *   *Wait, 90 mins is tight for me to rewrite texts live.*
          *   *Alternative:* The students *are* the chain.
          *   *Group Structure:* 3 Chains of 6 students? No, 18 students total.
          *   *Let's try:* 3 Groups of 6.
          *   *Group 1 & 2:* Actually share a source after the first step.
          *   *Okay, the most robust way to guarantee the "false independence" trap:* I act as the filter.
          *   *Step 1:* Event (5 mins).
          *   *Step 2:* 6 Witnesses write accounts (10 mins).
          *   *Step 3:* I collect them. I select 3 distinct accounts. I photocopy them (or have pre-printed templates where I fill in the core).
          *   *Step 4:* 12 "Traditioners" get the 3 accounts (4 per account). They embellish (15 mins).
          *   *Step 5:* I collect those. I select the 6 best/most distinct "Final Texts."
          *   *Step 6:* Class analyzes the 6 Final Texts.
          *   *Problem:* Too much instructor prep/work during class.
          *   *Solution:* **The "Secret Seed" Method.**
          *   Event happens.
          *   18 students split into 6 groups of 3.
          *   Groups 1 & 2 get Witness Account A.
          *   Groups 3 & 4 get Witness Account B.
          *   Groups 5 & 6 get Witness Account C.
          *   *Wait, who writes A, B, C?* I need 3 witnesses to write the base.
          *   *Okay, Final Design:*
              1.  **Event:** Instructor drops a prop, volunteer picks it up, argues, leaves. (5 mins)
              2.  **Witnesses:** 3 specific students (pre-selected or volunteer) write the "Original Reports" (10 mins).
              3.  **Distribution:** I take those 3 reports. I make 2 copies of each (6 total). I hand them to 6 "Editor Groups" (3 students per group = 18 students total).
              4.  **Embellishment:** Each group turns their "Report" into a "Legend" (15 mins). *Constraint:* Must make the protagonist look heroic (except one group gets a constraint to keep an awkward detail).
              5.  **Analysis:** The 6 "Legends" are posted. The class (now unified) analyzes them to determine facts about the Event. (45 mins).
              6.  **Reveal:** I reveal the lineage (Groups 1&2 had same source, etc.). (15 mins).
      *   *Wait, 18 students.* 6 groups of 3 works perfectly.
      *   *The Trap:* Groups 1 & 2 think they are independent because they are different people, but they started from the same Witness Report.
      *   *The Awkward Detail:* In the Event, the Volunteer steals the prop. In Witness Report A, this is clear. In Witness Report B, it's ambiguous. In Witness Report C, the Volunteer is praised. I need to ensure at least one Witness Report contains the "awkward" truth (theft), but the Editors are instructed to "Glorify the Hero." Will they keep the theft?
      *   *Refining the Awkward Detail:* The "Hero" (Volunteer) actually trips and breaks something, then blames the Instructor.
          *   Witness Report A (Truth): Hero tripped, broke it, blamed Instructor.
          *   Witness Report B (Vague): Something broke.
          *   Witness Report C (Lie): Instructor dropped it.
          *   Instruction to Editors: "Make this a story about the Hero's greatness."
          *   Historians must determine: Did the Hero break it?
          *   If they see Report A-derived texts admitting the trip, that's the Criterion of Embarrassment.
          *   If they see Groups 1 & 2 agreeing, they might think it's independent attestation. I need to reveal they shared a source.

      *   *Why this design?* It forces the "independence" error live. It creates tangible texts. It fits 18 students (6 groups of 3). It isolates the variables (Source A, B, C).

      *   *Timing Check:*
          *   Intro/Event: 10 mins.
          *   Witness Writing (3 students): 10 mins (Others watch or help? No, 3 specific students write. The rest observe? No, all 18 need to be busy).
          *   *Correction:* All 18 witness the event. Then 3 are selected to write the "Official Witness Statements." The other 15 wait? No.
          *   *Better:* All 18 write a 1-sentence note privately first (to ensure everyone pays attention). Then 3 are collected to be the "Source Texts."
          *   Then split into 6 groups. Each group gets one of the 3 Source Texts (2 groups per Source).
          *   Groups expand the Source into a "Legend" (1 page).
          *   Groups swap Legends? No, the Legends *are* the artifacts.
          *   Class analyzes the 6 Legends.
          *   This works.

      *   *The Awkward Detail:* The Volunteer (Hero) accidentally knocks over the vase.
          *   Source A (Honest): "He knocked it over."
          *   Source B (Neutral): "The vase fell."
          *   Source C (Protective): "You knocked it over."
          *   Instruction to Groups: "Write a founding myth where the Volunteer is a culture hero."
          *   Groups with Source A have to deal with the "He knocked it over" detail. Do they suppress it? If they keep it, it's strong evidence (Embarrassment).
          *   Groups 1 & 2 both have Source A. If both keep the detail, historians might think "Two independent sources say he knocked it over!" -> Trap sprung.

      *   *Payoff:* The reveal of the lineage shows why "independent attestation" failed.

      *   *JSON Structure:* Need to ensure all keys are present and valid.

  4.  **Drafting the Content:**
      *   *Materials:* Props (vase, box), Handouts (Source A/B/C templates), Markers, Paper.
      *   *Phases:* 1. Event & Witnessing. 2. Transmission (Group work). 3. Investigation (Analysis). 4. Reveal.
      *   *Payoff:* Understanding genealogical dependence vs. independent attestation.
      *   *Debrief Map:* Link moments to concepts (e.g., when they trust agreeing accounts -> Illusion of Independence).
      *   *Failures:* Students ignoring instructions, too much noise, time overrun.
      *   *Cannot Reproduce:* Specific student reactions, exact wording of legends.

  5.  **Refining the JSON:**
      *   Ensure valid JSON (no trailing commas, proper escaping).
      *   Check constraints: `materials`, `phases`, `payoff_scheme`, `debrief_map`, `first_run_failures`, `cannot_reproduce`.
      *   `phases` is an array of objects with `minutes`, `what_happens`, `what_they_should_hit`.
      *   `debrief_map` is an array of objects with `moment_in_the_game`, `concept_it_instances`.
      *   `first_run_failures` is an array of objects with `failure`, `mitigation`.
      *   `cannot_reproduce` is an array of strings.

  6.  **Final Review of the Design:**
      *   Does it meet the "branching" requirement? Yes, 2 groups get Source A, 2 get Source B, 2 get Source C.
      *   Does it meet the "awkward detail" requirement? Yes, Source A includes the Hero's mistake.
      *   Does it fit 90 mins? 10 (event) + 20 (writing) + 40 (analysis) + 20 (debrief) = 90. Tight but doable.
      *   Does it fit 18 students? 6 groups of 3. Perfect.
      *   Why this one? It maximizes student agency while controlling the variables necessary to teach the specific historiographical trap (stemmatic dependence).

  7.  **Constructing the Explanation:**
      *   Explain the "Stemmatic Trap" design.
      *   Justify based on time, class size, and learning objectives.

  8.  **Constructing the JSON:**
      *   Careful with quotes and newlines.

      *(Self-Correction during drafting JSON)*: Make sure `what_they_should_hit` describes the learning outcome or the specific historical claim they are testing.
      *(Self-Correction on Branching)*: I need to make sure the students don't realize they have the same source. I will hand out the sources on colored paper but tell them it's random. Actually, better: I transcribe the 3 witness statements onto handouts labeled "Archive Fragment 1, 2, 3" but duplicate them. I hand Fragment 1 to Group 1 & 2, etc. They won't know others have the same fragment unless they compare text verbatim. I should instruct them *not* to share their source fragment until the end.

      *(Awkward Detail)*: The volunteer (Hero) must do something unheroic. Let's say they sneeze loudly during a solemn moment or drop the sacred object. Let's go with "Drops the sacred object."
      Source A: "He dropped it."
      Source B: "It fell."
      Source C: "You handed it to him wrong."
      Instruction: "Make him a hero."
      Groups with Source A must choose: Hide the drop (harmonization) or Keep the drop (embarrassment).

      *Wait, one more check:* The prompt asks for "rule on three specific claims." I need to ensure the analysis phase focuses on 3 claims.
