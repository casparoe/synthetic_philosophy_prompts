          *   Honest bit: Markets need liquidity and strangers. You have neighbors.

      *   **6. Predictable Breaks (Specific Room):**
          *   16 people = Thin market.
          *   Same Slack = Correlated information (no alpha).
          *   Confident Staff Engineer = Market Manipulator (they will anchor the price).
