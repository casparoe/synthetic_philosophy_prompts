  9.  **Refining and Polishing:**
      *   *Tone:* Analytical, balanced, respectful of the user's intuition (which is correct).
      *   *Check Constraints:* No citations. Keep it focused on the arguments provided.
      *   *Self-Correction during drafting:* Make sure I don't get too bogged down in Taleb specifics. The user's brother likes Taleb, but the text is from a historian. Focus on the text provided. Ensure the distinction between *epistemic* (what we know) and *ontological* (what is real) is clear in section 2.

  10. **Final Review against User Prompts:**
      *   Claim by claim? Yes.
