      *   *The Clock Tower:* The flyer says "Lightning struck... 10:04." The clock *is* stopped at 10:04.
          *   *Presentist take:* The clock is a present object with a property (stopped). The event is gone.
          *   *Eternalist take:* The event is a fixed coordinate. The clock's state is a permanent feature of that coordinate.
          *   *Problem:* The flyer treats the future strike (relative to 1955 Marty) as a past fact. This suggests the "future" of 1955 is already written (Eternalism), but Marty changes it (Anti-Eternalism).
