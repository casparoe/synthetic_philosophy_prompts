      *   *Is it a real view?* "The Growing Block" is real (past/present exist, future doesn't). "The Shrinking Block" is rare but discussable (future/present exist, past is annihilated). The film looks like a *Shrinking and Regrowing Block* or a *Mutable Block*.
      *   *Coherence:* It's generally considered nonsense by metaphysicians because it violates the Law of Non-Contradiction (1985 is F and not-F) unless indexed to Hyper-time.

