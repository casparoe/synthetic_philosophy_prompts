  8.  **Final Polish:** Ensure the distinction between "Edit" and "Replacement" is clarified. "Edit" implies continuity of the substrate. "Replacement" implies discontinuity. The film wants the benefits of both (continuity of memory, discontinuity of events). This is the core contradiction.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's impossible." I need to explain *why* it's impossible in standard metaphysics but *why* it works cinematically. The user wants to know if the film dramatizes something the debate leaves out. Yes: The *experience* of temporal revision.

      *(Student Pitfalls)*:
      1.  Confusing Epistemology with Ontology (knowing the future vs. the future existing).
      2.  The "Two Timelines" fallacy (Branching vs. Overwriting).
      3.  Treating the Photo as a mirror rather than a causal trace.

