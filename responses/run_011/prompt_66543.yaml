      *   **Eternalism (Block Universe):** Past, present, future all exist equally. Time travel is moving along the block. Change is usually impossible (consistency constraints) or requires branching (Many Worlds).
      *   **The Film's Logic:** It clearly violates standard consistency constraints (you *can* change the past). It violates standard branching (there aren't two timelines co-existing; the old one vanishes). It violates standard presentism (the past is accessible and leaves traces like the photo).
      *   **The "Rewritable Block":** This is essentially the "Dynamic Block" or "Changing Past" view. It's generally considered incoherent in standard metaphysics because it requires a "hyper-time" (time for the block to change in).

