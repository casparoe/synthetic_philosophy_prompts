prompt: |-
  I cover AI and decision theory for a science magazine and I'm doing a piece on why Newcomb's problem still makes very smart people lose their tempers. For the site I want an interactive flowchart — "what kind of Newcomber are you?" — so I need you to write me the actual decision tree.

  Problem: everyone sorts this by the answer, one box or two, and that tells me nothing. I want the branch nodes to be about *why* the predictor is accurate and what you think that does to your options. So run cases like these: the predictor is a perfect simulation of your brain run before you walk in — does your choice still seem to have anything to do with whats already in the box? Now swap in a predictor with no mechanism at all, just a correlation it's never wrong about (it reads your genes, say, and nothing you decide can reach back). Now swap again: the boxes get filled *after* you leave the room, by someone who watched you on camera and knows you'll grab both. Does your answer move each time? And I want a node on whether "but two boxes always dominates" should count as a knockdown argument or as a piece of reasoning you're entitled to be suspicious of.

  Say eight to ten nodes, each phrased as a case a reader who's had one stats class but never a philosophy paper can answer without knowing any labels. Then the leaves: the plain one-boxer, the evidential one-boxer, the causal two-boxer, whoever still holds out on the transparent-box version, and the people who think the whole setup is incoherent. Mark any cell in that space that comes up empty and tell me whether its empty becuase nobody would want to live there or because nobody's thought of it. And flag any pair of leaves your tree can't actually separate.
