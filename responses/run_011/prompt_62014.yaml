answer: |-
  Your verdicts are driven by a principle of **authentic agency**: you reward characters who exert will against resistance, penalize those who perform their history, and prioritize vitality even when it is immoral.

  Here is how that principle maps to your seven cases:

  1.  **Surgeon (Early):** High agency against high resistance. This is the ideal ratio, earning full admiration.
  2.  **Surgeon (Late):** High agency becomes performance. He is no longer exerting will against constraint; he is narrating his past constraint for status. Admiration curdles.
  3.  **Inheritor:** High agency against low resistance. She exerts will, but the constraint was removed by birth. The admiration is real but "thin" because the struggle is absent.
  4.  **Cancer Victim:** High agency against insurmountable resistance. The principle demands effort be rewarded; when the universe violates this contract, the reader feels anger at the injustice rather than pity for the victim.
  5.  **Loud Neighbor:** Low agency (complaining) performed publicly. This is the inverse of the surgeon; he seeks status through victimhood rather than action. Contemptible.
  6.  **Quiet Neighbor:** Low agency endured privately. He exerts will only to protect his dignity (withdrawing). This lacks the heroism of the surgeon but retains the integrity of silence. Understandable.
  7.  **Saboteur Brother:** High agency directed destructively. Morally awful, but narratively "alive" because he is the only one besides the surgeon exerting significant will against his circumstances. You value the energy of the action over the morality of the outcome.

  **Prediction for the Rich Teenager:**
  The reader will feel **respect without reverence**. Because the teenager displays visible work (agency), they avoid the "thinness" of the inheritor who might rely on instinct or luck. However, because the family wealth removes the existential constraint (resistance), the effort lacks the "rusted-out town" stakes required for awe. The verdict will be positive, but it will not land in the chest; it will land in the head.

  **Confidence and Uncertainty:**
  I am 90% confident in this principle. The part I am least sure about is **Verdict 7 (The Saboteur)**. Classifying him as "alive" introduces an aesthetic judgment (narrative vitality) that conflicts with the moral judgment (awful) used in the other six cases. If you force this into a purely moral framework, he should be merely contemptible like the Loud Neighbor; keeping him as "alive" requires you to admit that you value dramatic truth over moral likability, which is a separate metric from the agency/constraint ratio. If you want a purely moral principle, you should throw out Verdict 7, but if you want a principle for *writing*, keep it.
