answer: |-
  You have identified a genuine gap in the lexicon of performance management and institutional theory. There is no single, established term that captures the specific triad of **material persistence**, **epistemic lock-in**, and **cultural amnesia** following the formal retirement of a metric.

  The literature is rich on how measures distort behavior *while active* (Goodhart, Campbell, Surrogation) and how institutions resist change *generally* (Path Dependence, Hysteresis, Structural Inertia). But the specific condition where the *measure is dead* while its *distortions are alive and structural* lacks a dedicated name.

  Here is the carving you requested: an analysis of the nearest concepts, a unification of your three observations, a proposed term with boundary conditions, and the machine-learning analogy.

  ### 1. The Nearest Neighbours (and Why They Stop Short)

  You have correctly dismissed the obvious candidates. Here is precisely where they fail to capture your phenomenon:

  *   **Goodhart's / Campbell's Law:** These describe a *live* causal link: Measure $\rightarrow$ Distortion. Your case is a *dead* link: Measure $\rightarrow$ Distortion $\rightarrow$ Measure Removed $\rightarrow$ Distortion Remains. These laws do not account for the *inertia of the distortion* after the incentive is removed.
  *   **Surrogation:** This is a cognitive error (confusing the map for the territory). It requires an active cognitive agent making the substitution. In your third observation, newcomers do not know the map ever existed; they simply inhabit the territory. Surrogation cannot explain behavior sustained by people unaware of the original measure.
  *   **Path Dependence / Hysteresis:** These explain *why* the state persists (switching costs, history matters), but they are agnostic to *what* caused the state. A QWERTY keyboard is path-dependent, but it wasn't caused by a *performance metric* that was later retired. These terms miss the specific genealogy of *measurement-induced distortion*.
  *   **Performativity (STS):** Scholars like MacKenzie and Callon argue that economic models "perform" the markets they describe. This is the closest theoretical ancestor. However, performativity literature usually focuses on the *active* role of the theory/model in shaping reality. It rarely addresses the **residual** state after the theory is discredited or retired.
  *   **Technical Debt:** This captures the "code remains after reason is gone" aspect (Observation 1). However, technical debt implies a known deficit that *should* be repaid. In your scenario, the debt is often invisible (Observation 3) or deemed unpayable due to historical continuity (Observation 2).

  ### 2. Are Your Three Observations One Phenomenon?

  **Yes.** They are the Material, Epistemic, and Social dimensions of a single state.

  *   **Observation 1 (Artifacts/Workflow):** This is the **Material Dimension**. The measure was compiled into infrastructure (code, staffing ratios, physical layouts).
  *   **Observation 2 (Data/History):** This is the **Epistemic Dimension**. The measure defined what counted as "truth" for a decade. To change the measure is to invalidate the organization's memory and legitimacy.
  *   **Observation 3 (Onboarding/Culture):** This is the **Social Dimension**. The workflow is transmitted as tradition rather than strategy.

  These are not separate phenomena; they are mutually reinforcing layers of the same fossil. You cannot refactor the workflow (1) without breaking the trend lines (2), and you cannot explain the workflow to newcomers (3) without revealing that the trend lines (2) are based on a retired logic. They form a **stable equilibrium of inefficiency**.

  ### 3. The Coinage: "Metric Petrification"

  Since no established term exists, I propose **Metric Petrification**.

  **Definition:**
  > **Metric Petrification** is the organizational state in which the structural, epistemic, and cultural distortions induced by a performance measure persist after the measure has been formally retired or replaced. The measure transitions from a *regulative* device (guiding behavior) to a *constitutive* element of the infrastructure (defining reality), rendering the distortion invisible to subsequent actors.

  **Boundary Conditions:**

  1.  **Formal Retirement:** The original measure must be officially deprecated or removed from incentive structures. If the measure is still active (even if ignored), this is *Decoupling* or *Target Fatigue*, not Petrification.
  2.  **Memory Not Required:** It does not require current staff to remember the measure. In fact, collective amnesia regarding the measure's origin is a hallmark of advanced petrification (your Observation 3).
  3.  **Duration:** The arrangement must persist beyond the tenure of the leadership that implemented the measure. If the same CEO keeps it because they like it, that is *Preference*. If a new CEO cannot remove it because the system breaks, that is *Petrification*.
  4.  **Flawed Measure Not Required:** A perfectly valid measure can petrify. For example, if a hospital optimized perfectly for a valid mortality metric for 10 years, then the metric was retired for political reasons, the optimized workflows might still be suboptimal for the *new* goals. The key is the *mismatch* between current goals and legacy structure, not the original validity of the metric.

  **What is Excluded (The Adjacent Case):**
  *   **Coordination Standards:** Consider driving on the left side of the road in the UK. This is a standard that persists due to network effects. It is *Path Dependence*, but not *Metric Petrification*, because it was never a *performance measure* used to judge quality or allocate rewards. It is a coordination protocol, not a target.
  *   **Active Gaming:** If staff are still actively manipulating data to meet the retired target because they *think* it is still in use (due to poor communication), that is *Misalignment*, not Petrification. Petrification requires the behavior to be embedded in the *system*, not just a misunderstanding of the rules.

  ### 4. The Machine Learning Analogy

  Your hunch is correct. There is a structurally analogous problem in Reinforcement Learning (RL) and AI Safety, though it lacks a single canonical name.

  **The Analogy: Proxy Overfitting with Frozen Policies**

  *   **The Setup:** An RL agent is trained to maximize a Reward Function $R_1$ (the live metric). $R_1$ is a proxy for the true objective $O$.
  *   **The Training:** The agent learns a Policy $\pi$ that maximizes $R_1$. In doing so, $\pi$ exploits specific quirks of $R_1$ (Goodhart's Law).
  *   **The Shift:** The developers realize $R_1$ is flawed and switch to a better Reward Function $R_2$.
  *   **The Petrification:**
      1.  **Architecture Lock-in:** The neural network architecture was specifically pruned or tuned to the feature space of $R_1$. Retaining the weights but changing the loss function to $R_2$ yields poor performance.
      2.  **Data Contamination:** The historical training data is labeled or weighted according to $R_1$. Training on $R_2$ requires discarding this data (Epistemic Lock-in).
      3.  **Deployment Inertia:** The model is deployed in a system where the *input pipeline* is engineered to feed features relevant to $R_1$. Changing to $R_2$ requires engineering changes to the data ingestion layer (Material Lock-in).

  **The Term:** In ML literature, this is often discussed under **"Distributional Shift"** or **"Objective Misalignment,"** but the specific persistence of the *old* optimization strategy is best described as **"Reward Function Overfitting"** or **"Specification Debt."**

  Recently, in the context of Large Language Models, this appears as **"Model Collapse"** or **"Inheritance of Bias"** where a model trained on data generated by a previous model inherits the previous model's blind spots, even if the new training objective attempts to correct them.

  However, the most precise structural analog is **"Policy Distillation"** where a student model learns the *behavior* of a teacher model without learning the *reasoning*. If the teacher was optimizing a flawed proxy, the student petrifies that flaw into its weights, even if the teacher is discarded.

  ### Summary for Your Seminar

  If you need to present this:

  1.  **Name it:** Call it **Metric Petrification**.
  2.  **Define it:** The structural and epistemic residue of a retired performance measure.
  3.  **Distinguish it:** It is not Goodhart's Law (which is active); it is the *fossil record* of Goodhart's Law.
  4.  **Implication:** It suggests that retiring a measure is not an administrative act, but a **reconstruction project**. You cannot simply stop reporting the number; you must refactor the code, rewrite the history, and retrain the staff. The cost of removing a metric is not zero; it is the cost of dismantling the infrastructure the metric built.

  This framing should resonate deeply with health policy scholars who struggle with why "evidence-based" changes to measurement often fail to change practice. The practice isn't ignoring the evidence; it is built on the concrete of the old evidence.
