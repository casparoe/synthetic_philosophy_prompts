      *   *Wait, I need to commit.* The prompt asks for a verdict.
      *   *Verdict:* Reject the 5,000 random crowd. The 54% accuracy is the killer. CJT requires $p > 0.5$, but convergence is exponentially slow as $p \to 0.5$. At 54%, you need thousands to get marginal gains, and any correlation makes it worse. The panel's 71% is superior.
