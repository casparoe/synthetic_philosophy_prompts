answer: |-
  1. **The practice, in plain terms**
  The tulku system identifies children as rebirths of deceased lamas. Search teams use dreams, omens, and geographical clues left by the predecessor. Candidates undergo tests, often identifying personal objects among decoys. The selected child is enthroned, inheriting the predecessor's monastery, property, and spiritual authority. While some claim past-life memories, most are re-educated from scratch in doctrine and ritual. Your description is accurate regarding the lack of continuous memory and the social construction of the recognition. The key nuance is that "reincarnation" here isn't always literal soul-transfer in the Western sense; it's often framed as an emanation body (*nirmanakaya*) manifesting for benefit, which complicates the "same person" claim. The process is administrative as much as mystical: high lamas and sometimes state authorities validate the choice, leading to political disputes over succession.

  2. **What it strictly presupposes**
  The practice strictly requires a causal continuity of mental events across death, without requiring a permanent owner. It presupposes that specific karmic imprints and spiritual vows can survive biological death and condition a new birth. It needs a criterion for identification: there must be a fact of the matter, accessible via divination or testing, that links Child B to Lama A. This link cannot be bodily, since the body is new. It cannot be purely psychological memory, since many tulkus lack explicit recall. Therefore, it presupposes a subtle stream of consciousness (like the *alaya-vijnana*) that carries latent tendencies rather than explicit data.

  Crucially, it presupposes that spiritual authority is transferable via this causal link. The institution needs the community to accept that the *function* of the lama continues. It rules out materialism (death is the end) and eternalism (a static soul unchanged by death). It requires that identity is sufficiently stable to assign property and status, yet fluid enough to inhabit a new organism. It also presupposes that senior lamas have the epistemic access (through meditation or ritual) to verify this causal link. Without a mechanism to trace the mental stream across the gap of death, the search is groundless. Finally, it assumes the continuity of obligation; the tulku inherits the predecessor's commitments to students and institutions, implying the moral agent persists enough to owe debts.

  3. **What it merely fits**
  The system is compatible with Western substance dualism (a soul moving bodies), which makes it intelligible to outsiders, but this isn't required. It fits the Yogacara "storehouse consciousness" model well, where seeds of karma ripen in a new base. It also fits the Mahayana view of the tulku as a deliberate emanation rather than a karmic victim, meaning the "person" is a performance of compassion rather than a surviving entity.

  It rules out strict physicalism, which denies post-mortem continuity. It also rules out Lockean memory theory, where identity equals remembered experience; if memory fails, the Lockean would say the tulku is a different person. It struggles with strict numerical identity (A is exactly B); the tradition often treats identity as pragmatic or conventional. It also rules out the idea that enlightenment dissolves the capacity to appear; instead, enlightenment enables controlled reappearance. The practice is underdetermined between "the same person returned" and "a new person appointed to the same role based on karmic affinity." Both work administratively, but imply different metaphysics.

  4. **The no-self problem**
  The tension is real: how can there be rebirth without a self? The standard Buddhist solution is the "flame analogy": one candle lights another. The flame isn't the same substance, but there's causal continuity. For tulkus, this means the new child is not numerically identical to the dead lama but is the causal successor carrying specific karmic vows. The "self" is a label applied to this continuum for practical purposes.

  Honest ways out include viewing the tulku as a "continuum of responsibility" rather than a soul. The cost is philosophical complexity: you must deny the person exists ultimately while affirming they exist conventionally enough to own property. Another way out is the "emanation" view: the lama is enlightened and projects a body like an actor playing a role. The cost here is that the "child" isn't really suffering or learning, which undermines the pedagogy. If the no-self doctrine is strict, the tulku system risks becoming "folk metaphysics," as you noted. To remain coherent, it must treat "identity" as a useful fiction maintained by social recognition and karmic causality, not a metaphysical fact. If it claims literal identity of substance, it contradicts no-self. If it claims causal continuity only, it must explain why *this* child gets the estate rather than any other causal successor. The cost is accepting ambiguity: the tulku is both the lama and not the lama, depending on the level of analysis.

  5. **Swap the metaphysics, change the institution**
  If identity required a permanent soul (substance dualism), the search would focus on proving essence, not causal signs. Re-education would be unnecessary if the soul retained all knowledge; the child should speak the previous language instantly. Inheritance would be absolute, not negotiable.

  If survival were a matter of degree (Parfit-style reductionism), you might have multiple valid successors sharing the lineage's authority, splitting the estate. The "search" would become an assessment of who best embodies the traits, rather than finding "the one." The Dalai Lama's comment about not returning fits this: if there's no self to bind, the commitment is optional. If the view shifted to pure social construction, the testing rituals would vanish, replaced by democratic election or appointment based on merit alone, severing the link to the dead predecessor entirely. The current hybrid—mystical search plus administrative validation—exists precisely because the metaphysics is hybrid: causal continuity plus conventional designation.

  6. **Bottom line**
  The tulku system does not require a soul, but it does require causal continuity across death. It functions on a pragmatic theory of identity: the child is the lama because the community agrees the karmic stream continues there. This contradicts strict no-self only if you insist "person" means "permanent owner." If "person" means "continuum of cause and effect," it holds. However, the institution often slides into substance-talk for legal and devotional convenience. To be fully coherent with no-self, it must admit the tulku is a designated successor, not a returned ghost. The tension isn't a bug; it's the engine that keeps the lineage alive while denying the ego it centers.
