          *   *Conclusion:* I refrain from weeping.
          *   *Load-Bearing Inference:* The move from "Death is a natural transformation" to "Grief is inappropriate." Why does naturalness negate the propriety of grief? Usually, we grieve natural losses. The inference relies on the idea that grief stems from *resistance* to the process, not just the fact of loss. It assumes that understanding the *necessity* of the change dissolves the *normative* claim that the change is bad.
          *   *Translation Fragility:* "Natural laws" sounds very Western/Newtonian. "Eternity" sounds theological. "Substance/Spirit" sounds dualistic. A flatter translation might say "qi" or "transformation" rather than "substance."

      *   **Point 2: The Concession & Hui Tzŭ's Complaint.**
          *   *Concession:* "When she died, I could not help being affected."
          *   *Function:* It humanizes Zhuangzi (he's not a stone) but marks the *duration* of grief as the issue. It distinguishes spontaneous affect from cultivated response.
          *   *Hui Tzŭ's Complaint:* He lists roles (wife, son, visitor). He focuses on *propriety* (Li).
