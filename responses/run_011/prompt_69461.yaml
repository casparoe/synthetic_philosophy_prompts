answer: |-
  Here is a 50-minute seminar plan designed for a mixed philosophy/economics cohort. It prioritises geometric intuition over algebraic derivation and focuses on the *trade-off* between the Nash and Kalai–Smorodinsky (KS) solutions.

  ### 1. The Strategy: Why this order?
  You are correct to suspect that starting with axioms is a mistake. If you begin with "Pareto Efficiency, Scale Invariance, Symmetry, and Individual Monotonicity," the students will view KS as a arbitrary collection of rules.

  **The correct dependency chain is:**
  1.  **The Geometry:** Feasible set + Disagreement point.
  2.  **The Intuition:** The "Utopia" point (what defines fairness in KS?).
  3.  **The Construction:** The Ray (how do we find the solution?).
  4.  **The Justification:** The Axioms (why did we draw the ray that way?).

  **Why?** The axioms are the *defence* of the geometry, not the precursor to it. Kalai and Smorodinsky did not start with a list of rules; they started with a critique of Nash (specifically Independence of Irrelevant Alternatives) and constructed a solution that fixed it. Teach the critique first, then the fix, then the formal rules that codify the fix.

  ---

  ### 2. The One Worked Example
  **Do not use the £100 split with $d=(0,0)$.**
  **Why it fails:** If the feasible set is symmetric (e.g., $x + y \leq 100$), Nash and KS yield the exact same result (£50, £50). You will spend 20 minutes deriving two solutions that look identical, hiding the entire theoretical distinction.

  **Use this instead: The "Asymmetric Bulge"**
  *   **Disagreement point ($d$):** $(0, 0)$.
  *   **Feasible Set:** Defined by three points on the Pareto frontier: $A=(0, 10)$, $B=(9, 4)$, $C=(10, 0)$. Connect them with straight lines.
  *   **Ideal (Utopia) Point:** $(10, 10)$. (Player 1 can get max 10; Player 2 can get max 10).

  **The Arithmetic (Board Work):**
  1.  **KS Solution:** Draw a ray from $d(0,0)$ to Ideal $(10,10)$. This is the line $y = x$.
      *   Find where $y=x$ hits the frontier segment $AB$.
      *   Line $AB$ equation: Slope is $(4-10)/(9-0) = -6/9 = -2/3$. Equation: $y = 10 - \frac{2}{3}x$.
      *   Intersect $y=x$ with $y = 10 - \frac{2}{3}x \Rightarrow \frac{5}{3}x = 10 \Rightarrow x = 6$.
      *   **KS Outcome:** $(6, 6)$. (Each gets 60% of their ideal).
  2.  **Nash Solution:** Maximise area $xy$ along segment $AB$.
      *   Max $x(10 - \frac{2}{3}x)$. Derivative: $10 - \frac{4}{3}x = 0 \Rightarrow x = 7.5$.
      *   $y = 10 - \frac{2}{3}(7.5) = 5$.
      *   **Nash Outcome:** $(7.5, 5)$. (Player 1 gets 75% of ideal; Player 2 gets 50%).

  **Why this example works:**
  *   **Ruler & Arithmetic:** It requires only linear equations and simple differentiation (or checking the vertex of a parabola).
  *   **The Contrast:** It visually demonstrates that Nash favours the player with the "flatter" frontier (better marginal bargaining power), whereas KS ignores the local shape and preserves the *ratio of gains* relative to the ideal.
  *   **Symmetry of Ideals:** Note that both have an ideal of 10. This pre-empts the "KS is just about different maximums" confusion. Even with equal ideals, the solutions diverge because of the frontier's shape.

  ---

  ### 3. Minute-by-Minute Plan

  **00–05: Setup & The Nash Refresher**
  *   Draw the axes. Plot $d=(0,0)$.
  *   Plot the feasible set (Points $A, B, C$).
  *   Briefly recap Nash: "Tangent of the hyperbola." Ask them to guess where Nash is. (Most will guess the kink $B$ or the middle).
  *   Reveal Nash is $(7.5, 5)$. Ask: "Is this fair? Player 1 gets 50% more utility than Player 2, despite having the same maximum potential."

  **05–15: The Kalai–Smorodinsky Construction**
  *   **Define the Ideal Point:** Ask: "What is the best Player 1 could possibly hope for, ignoring Player 2?" Mark $(10, 0)$. "What is the best Player 2 could hope for?" Mark $(0, 10)$.
  *   **The Utopia Point:** Combine them into $(10, 10)$.
      *   *Intervention:* Head off the misconception: **"The utopia point is somewhere you could actually get to."** Explicitly state: "This point is infeasible. It is a reference vector, not a destination."
  *   **The Ray:** Draw a line from $d$ through the Utopia point.
  *   **The Solution:** Where the ray hits the frontier. Calculate it on the board (as per the example above). Result: $(6, 6)$.
      *   *Intervention:* Head off the misconception: **"KS is just an equal split."** Point out they both get 6, but emphasise this is 60% of their *respective* ideals. If ideals were $(10, 20)$, KS would give $(5, 10)$—equal proportions, not equal amounts.

  **15–30: The Axioms (The 'Why')**
  *   Now introduce the axioms as the *reason* we drew that ray.
  *   **Shared Axioms:** Pareto Efficiency, Scale Invariance, Symmetry. (Briefly note these are the same as Nash).
  *   **The Divergence:**
      *   Nash relies on **Independence of Irrelevant Alternatives (IIA)**.
      *   KS relies on **Individual Monotonicity**.
  *   **Explain Monotonicity:** "If the feasible set expands in a way that increases my maximum possible payoff without reducing yours, I should not end up worse off."
  *   **Show the Violation:**
      *   Imagine we chop off the top left of the feasible set (reduce Player 2's options) but leave the Nash tangent point untouched. Nash says the solution stays the same.
      *   KS says: "Wait, Player 2's Ideal Point has dropped. The Ray has changed slope. Player 1 should give ground."
      *   *Key Insight:* KS treats bargaining as a claim on *proportionate gains*. Nash treats it as a local optimisation problem.

  **30–40: Discussion & Misconceptions**
  *   Open the floor. Watch for these specific errors:
      1.  **"Monotonicity means a bigger pie is better for everyone."**
          *   *Correction:* No. It means if *my* specific opportunities improve (my ideal point rises), my solution share must not fall. It is about bargaining power, not aggregate welfare.
      2.  **"KS is fairer."**
          *   *Correction:* This is normative. KS is 'fair' only if you believe justice requires equal relative concessions. Economics usually prefers Nash because it aligns with risk aversion (Nash is equivalent to a specific risk structure). KS implies a specific ethical stance on claims.
      3.  **"The ray depends on the units."**
          *   *Correction:* Scale Invariance handles this. If we measure Player 1 in pence and Player 2 in pounds, the Ideal Point scales, the Ray slope adjusts, the intersection remains the same in real terms.

  **40–45: What We Are Ignoring (The 'Refusal')**
  *   Be explicit about what is off the table.
  *   **Non-Convexity:** Do not give this airtime.
      *   *Reason:* KS relies on the ray intersecting the frontier at a unique point. If the set is non-convex, the ray might intersect multiple times, or the 'ideal point' might not be well-defined in the same way. Fixing this requires 'comprehensive hulls' and advanced topology. It is a trap that will consume 20 minutes and confuse the core intuition. Tell them: "We assume convexity. If the set is non-convex, neither Nash nor KS works without significant modification, and that is a different seminar."
  *   **Strategic Implementation:** Do not discuss the 'Nash Program' (how to build a game that results in KS). We are doing axiomatic bargaining, not strategic game theory today.

  **45–50: The Closing Question**
  *   Do not ask them to draw the solution.
  *   **Ask this:**
      > "Nash satisfies IIA: if we remove an option that wasn't chosen, the solution doesn't change. KS violates this: removing a useless option can change the Ideal Point, rotating the ray, and changing the solution.
      >
      > **Why might a philosopher or an economist willingly accept a solution that changes when you remove an option nobody was going to pick anyway?**"

  *   **Desired Answer:** They should recognise that the 'useless option' contained information about *bargaining power* (the Ideal Point). In KS, the potential to gain (even if unrealised) dictates the fair share. In Nash, only the local trade-off matters. Accepting the violation of IIA is the price of ensuring that an improvement in one player's potential doesn't go unrewarded.

  ---

  ### 4. Summary of Misconception Management

  | Misconception | When to Head Off | How to Phrase It |
  | :--- | :--- | :--- |
  | **"Utopia is achievable."** | When defining the Ideal Point (min 05). | "This point is strictly infeasible. It is a coordinate for comparison, not a target." |
  | **"KS is an equal split."** | When calculating the example (min 15). | "They get equal *proportions* of their maximums, not equal utility. If maxes differ, payoffs differ." |
  | **"Monotonicity = Bigger Pie."** | During Axioms (min 20). | "It's not about the sum. It's about if *my* ceiling rises, my floor shouldn't drop." |
  | **"Non-convexity is the next step."** | During Exclusions (min 40). | "It breaks the uniqueness of the ray intersection. We assume convexity to keep the logic clean." |

  ### 5. Final Note on Tone
  Keep the distinction sharp: **Nash is about efficiency and risk; KS is about claims and proportions.** The economics students will gravitate towards Nash (it feels more 'market-like'); the philosophy students will gravitate towards KS (it feels more 'Rawlsian' regarding relative concessions). Your job is to show that the choice between them is a choice between two different definitions of rationality, not just a calculation error.
