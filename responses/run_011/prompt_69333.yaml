  ### The Genuinely Hard Question

  Once you clear away the confusion about silencing faith, the difficult issue for your handout isn't whether religious citizens *can* speak, but how they justify **coercion**.

  The question to pose to your group is this: **"When we seek to use the law to bind our neighbors to a moral vision, do we owe them a reason they could accept without first converting to our faith?"**

  This shifts the focus from self-censorship to **reciprocity**. It asks whether loving our neighbors requires us to find common ground (public reasons) when we are asking the state to enforce rules upon them, rather than simply asserting authority based on a revelation they do not share.
