answer: |-
  # Seminar Plan: The Everettian Betting Game
  **Topic:** The Architecture of Probability in Many-Worlds
  **Duration:** 100 Minutes
  **Class Size:** 14 Students
  **Instructor Role:** "The Universe" (Facilitator & Randomization Source)

  ---

  ## I. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **The Constitution** | Explain the Credit System. The class must democratically adopt a **Payoff Distribution Rule (PDR)** before any betting occurs. |
  | **10–25** | **Round 1: The Divergence** | **Count vs. Weight.** A two-stage measurement setup where branch count and squared amplitude diverge. Betting & Resolution. |
  | **25–40** | **Round 2: The Veil** | **Subjective Uncertainty.** The "measurement" occurs, but the result is hidden. Students place a second bet while "branching" has ostensibly happened but "outcome" is unknown. |
  | **40–55** | **Round 3: The Arbitrage** | **Circularity Trap.** Students are allowed to propose a *new* PDR for this round only. They must justify it without referencing the dice probabilities. |
  | **55–75** | **Settlement & Audit** | Public calculation of winnings based on the adopted PDRs. Distribution of "QuBits." |
  | **75–100** | **Debrief** | Mapping game mechanics to literature (Greaves, Wallace, Saunders). Addressing the "Two Plain Points." |

  ---

  ## II. The Credit System: "QuBits"

  *   **Currency:** QuBits (QB).
  *   **Endowment:** Each student starts with **10 QB**.
  *   **Value:** 50 QB = 1 Choice Token (vote on next week's reading) OR 1 high-quality chocolate bar. (Keep a stash visible).
  *   **Ledger:** A whiteboard grid with Student Names, Start Balance, Round Wagers, Round Payouts, End Balance.
  *   **Audit:** Two students (rotating) are designated "Auditors." They verify the dice rolls and the arithmetic of the PDR application. They sign the ledger at the end.
  *   **Coercion Check:** Emphasize that 0 QB is acceptable; it merely forfeits the treat/vote. No grade impact.

  ---

  ## III. The Betting Slips

  *Print these on card stock. Distribute one per student per round.*

  > **EVERETTIAN BETTING SLIP [ROUND #]**
  >
  > **Player Name:** ___________________
  >
  > **1. THE WAGER**
  > I am risking **___ QB** (Max 10) on the following Outcome:
  > [ ] Outcome A
  > [ ] Outcome B
  >
  > **2. THE PAYOFF DISTRIBUTION RULE (PDR)**
  > *This rule determines how my payoff is shared among my future successors.*
  > *(For Round 1 & 2, use the Class Constitution Rule. For Round 3, you may propose your own.)*
  >
  > **Current Class Rule:** ___________________
  >
  > **3. CALCULATION (For Auditors)**
  > If Outcome A occurs:
  > *   Total Pot for A-Successors = Wager × 2
  > *   My Share = (Total Pot) × (My Branch Weight per PDR)
  >
  > If Outcome B occurs:
  > *   Total Pot for B-Successors = Wager × 2
  > *   My Share = (Total Pot) × (My Branch Weight per PDR)
  >
  > **Signature:** ___________________

  ---

  ## IV. Branch Structure & Resolution Methods

  ### Round 1: The Divergence (Count vs. Weight)
  **Goal:** Expose the conflict between "Number of Branches" and "Squared Amplitude."

  *   **The Setup:** A two-stage quantum process.
  *   **The Device:** One D6 (six-sided die) and one D10 (ten-sided die).
  *   **The Branching Structure:**
      *   **Stage 1 (D6):**
          *   Rolls 1–3: **Macro-Branch Alpha** (Amplitude $\sqrt{0.5}$)
          *   Rolls 4–6: **Macro-Branch Beta** (Amplitude $\sqrt{0.5}$)
      *   **Stage 2 (Decoherence Event):**
          *   If **Alpha**: The D10 is rolled. All 10 faces represent distinct, decohered micro-branches. (10 Successors).
          *   If **Beta**: The D10 is *not* rolled. The state remains stable. (1 Successor).
  *   **The Divergence:**
      *   **Born Rule (Weight):** Alpha = 50%, Beta = 50%.
      *   **Naive Counting (Successors):** Alpha = 10 branches, Beta = 1 branch. Ratio 10:1 (91% vs 9%).
  *   **Resolution:**
      1.  Roll D6. Record result (Alpha/Beta).
      2.  If Alpha, roll D10. Record micro-branch (1-10).
      3.  If Beta, record micro-branch (1).
      4.  **Crucial:** The "Outcome" for betting is Alpha vs. Beta. The "Micro-branches" are only relevant if the PDR is *Counting*.

  ### Round 2: The Veil (Subjective Uncertainty)
  **Goal:** Test the phenomenology of uncertainty post-branching.

  *   **The Setup:** Simple binary split.
  *   **The Device:** One D2 (Coin: Heads/Tails).
  *   **The Branching Structure:**
      *   Heads: Weight 0.5. Tails: Weight 0.5.
  *   **Resolution:**
      1.  Instructor flips the coin.
      2.  **Cup the coin in hand.** Do not show the class.
      3.  Announce: "The branching event has occurred. There is a version of you seeing Heads and a version seeing Tails. You do not know which version you are."
      4.  Students place bets *now*.
      5.  Reveal coin. Settle bets.

  ### Round 3: The Arbitrage (Circularity)
  **Goal:** Show that justifying a PDR requires assuming the conclusion.

  *   **The Setup:** Same as Round 1 (D6 + D10).
  *   **The Twist:** Students may write a custom PDR on their slip.
  *   **Resolution:** Standard roll. Settlement requires the Instructor to adjudicate if the PDR is internally consistent.

  ---

  ## V. The Constitution (Minutes 00–10)

  **Instructor Script:**
  "Welcome to the Multiverse. In this room, we simulate branching. When I roll the dice, the universe splits. All outcomes happen. However, you only sit in one chair. To make this intelligible, we need a **Payoff Distribution Rule (PDR)**. This rule tells us: when you split into multiple successors, how much of your current utility belongs to which successor?"

  **Present the Options:**
  1.  **The Born Rule:** Payoff is proportional to squared amplitude (Weight).
  2.  **The Counting Rule:** Payoff is proportional to the number of distinct micro-branches.
  3.  **The Egalitarian Rule:** Payoff is split equally among macro-outcomes (50/50 regardless of weight).
  4.  **The Winner-Take-All:** Only the successor in the highest-weight branch gets the payoff; others get zero.

  **Task:** The class must vote on *one* rule to govern Rounds 1 and 2.
  *Note:* Most will instinctively vote for Born. *Let them.* The failure comes later when they cannot justify *why* without using probability language.

  ---

  ## VI. The Debrief (Minutes 75–100)

  ### 1. Mapping the Mechanics to Literature

  *   **The Quantitative Problem (Round 1):**
      *   *Moment:* When students realized Alpha had 10 micro-branches but only 50% weight.
      *   *Literature:* This is the **Incoherence Problem**. If probability is just counting worlds, the Born rule is false. If probability is weight, what *is* weight?
      *   *Discussion:* "Why did you vote for Born in the Constitution? Did you assume the dice were 'probabilistic' in the classical sense?"

  *   **The Circularity Charge (Round 3):**
      *   *Moment:* When students tried to justify a PDR without saying "because it's more likely."
      *   *Literature:* **Deutsch-Wallace**. They likely argued, "I want to maximize my expected return."
      *   *Trap:* "Expected return" *presumes* a probability measure. You cannot use decision theory to derive the Born rule if your decision theory already requires a probability measure to calculate utility.
      *   *Point:* The game showed that without a prior normative commitment (a Caring Measure), the betting slips are blank.

  *   **Subjective Uncertainty vs. Caring Measure (Round 2):**
      *   *Moment:* The Coin under the cup.
      *   *Literature:* **Saunders-Wallace (SU)** vs. **Greaves**.
      *   *SU:* You felt genuine ignorance ("I don't know if I'm Heads-me").
      *   *Greaves:** You shouldn't feel ignorance. You should feel确定性 (certainty) that both exist, and you are simply deciding how much to *care* about the Heads-me vs. the Tails-me.
      *   *Question:* "Did the uncertainty in Round 2 feel like not knowing a fact, or like deciding how to split your assets?"

  ### 2. Troubleshooting Predictable Failures

  **Failure A: "You Smuggled Collapse!"**
  *   *The Accusation:* A student will say, "When you rolled the D6, only one number came up. That's collapse, not Everett."
  *   *The Handle:* Acknowledge immediately. "Correct. The die is a *prop* for the amplitude structure. In reality, all branches exist. In this room, we only have one set of eyes. The PDR is the *bridge* between the ontology (all branches) and the phenomenology (one set of eyes). If you reject the prop, you reject the simulation. Accept the prop as 'Measure,' not 'Chance.'"

  **Failure B: "I Found an Arbitrage!"**
  *   *The Accusation:* A student bets on *both* Alpha and Beta in Round 1. "Since both happen, I win in both branches. I maximize my total multiverse wealth."
  *   *The Handle:* This is the **Greaves Point**. "Exactly. In Everett, you *do* bet on everything. The question isn't 'which outcome happens?' (all do). The question is 'how much do I value the payoff in the low-weight branch?' If you bet everything on Beta (the 1-branch outcome) and the Counting Rule is active, you win big in 10 branches but lose in 1. If Born is active, you win big in 1 branch (50% weight) but lose in 10 (50% weight). The arbitrage doesn't disappear; it just shifts from *winning* to *valuing*."

  ---

  ## VII. The Two Plain Points

  *State these clearly at the very end of the seminar.*

  ### 1. Which side do the rules favour?
  **The Bias:** The game mechanics quietly favour the **Subjective Uncertainty (Saunders-Wallace)** reading.
  **Why:** By forcing students to place bets *before* the die roll (Round 1) or *while the coin is hidden* (Round 2), the game structures the experience as **ignorance of a fact**. It simulates a single-world agent facing risk.
  **How to Neutralize:** To render the game neutral towards the **Caring Measure (Greaves)** reading, you must alter Round 2.
  *   *Alteration:* Reveal the coin flip *before* the bet. Tell the students: "You are now the Heads-successor. You know for a fact the Tails-successor exists. Place a bet."
  *   *Effect:* This removes "uncertainty." The bet is no longer about *what will happen*, but about how much the Heads-successor values the Tails-successor's payoff. If they still bet according to Born weights here, they are acting on a Caring Measure, not Subjective Uncertainty.

  ### 2. What the game cannot reproduce
  **The Missing Feature:** **The Ontology of Co-Existence.**
  **The Limit:** In the game, only one student collects the QuBits. In Everett, *all* successors collect the payoff. The game forces a **Zero-Sum Settlement** (only one outcome is paid in this room), whereas Everett is **Positive-Sum** (all branches are realized).
  **The Speech You Must Supply:**
  > "The settlement procedure we just performed is a lie. In a true Everettian universe, the student who bet on Alpha *and* the student who bet on Beta would *both* be paid. The 'loss' you feel is an artifact of this seminar room's single-world constraint. The philosophical pressure is not about winning the bet; it is about why, knowing you will win in *some* branch, you should structure your preferences *now* as if some branches matter more than others. The game simulates the *decision*, but it cannot simulate the *reality* of the branching. You must supply that reality in your imagination."

  ---

  ## VIII. Instructor's Cheat Sheet (For the Room)

  *   **Whiteboard Layout:**
      *   Left: Ledger (Names, QB).
      *   Center: Current PDR (Large font).
      *   Right: Round Status (Betting Open / Branching Occurred / Settlement).
  *   **Props:**
      *   1 D6, 1 D10, 1 Coin.
      *   Opaque cup for Round 2.
      *   Bowl of chocolate/tokens.
  *   **Key Phrase to Repeat:** "The dice determine the *measure*, not the *existence*."
  *   **If the Class Stalls:** If they cannot agree on a PDR in the first 10 minutes, impose the **Egalitarian Rule** (50/50 split). This usually causes enough outrage in Round 1 (when the D6 rolls 1-5 vs 6) to motivate them to adopt Born for Round 2, demonstrating the *pragmatic* pull of the Born rule even without ontological justification.
