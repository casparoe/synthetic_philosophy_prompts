      *   *Poetry:* No external constraint. The text *is* the score.
      *   *Comparability:* They are analogous in *technique* (constrained writing) but differ in *ontology*. In opera, the music exists independently. In a poem, the "music" (meter/rhyme) is generated by the words themselves.
      *   *Relevance:* The existence of these fields proves that constrained translation is *possible*. It undermines the "it's impossible" defense of poetry translators. It suggests the choice is aesthetic/philosophical, not practical.

