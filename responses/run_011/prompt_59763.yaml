  2.  **Analyze the "Free-Verse Default" (Task 1):**

      *   *Strict Presupposition:* Does it *require* the claim that content is separable from form?
          *   If I say "I must drop rhyme to keep the meaning," I am implicitly prioritizing semantic content over sonic structure.
          *   Does this mean I believe meaning *survives intact*? Not necessarily intact, but *transferrable*. It presupposes a hierarchy: Semantic/Imagistic > Sonic/Formal.
          *   It presupposes that "poemness" resides primarily in the *what* (imagery, argument, emotion) rather than the *how* (metrical pulse, sonic echo).
          *   *Strict vs. Contingent:*
              *   *Strict:* Meaning is primarily propositional or imagistic; form is decorative or secondary.
              *   *Contingent (fits but doesn't necessitate):* It's too hard to do both (skill issue); modern readers don't like rhymed translations (market issue); rhymed translations often sound sing-songy/bad in English (aesthetic taste issue).
      *   *Refinement:* The prompt asks if it's committed to the claim that content survives intact. I need to be careful. Most translators admit *some* loss. But the practice presupposes that the *core* survives. If the core *was* the form, they couldn't do it. So yes, it presupposes a degree of separability.

  3.  **Analyze the Counter-Examples (Task 2):**

      *   *Dubbing/Opera/Hymns:* Why do they keep constraints?
