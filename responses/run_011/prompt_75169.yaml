answer: |-
  The handicap system operates on a theory of **Relative Performance Desert**.

  Unlike the scratch system, which rewards *absolute output* (the lowest number of strokes), the handicap system rewards *output relative to expectation*. It is a specific philosophical attempt to isolate the variable of "current form" or "effort on the day" from the variable of "structural capacity."

  Here is what that system strictly commits you to, what it leaves ambiguous, and the consequences of elevating it to a universal truth.

  ### 1. Strict Commitments vs. Nice Fits

  **What merely fits nicely:**
  It is often said that the handicap system rewards "effort" or "improvement." This is a comforting narrative, but it is not strictly true. In fact, the system actively *punishes* sustained improvement. If you play brilliantly for a month, your handicap drops, making it harder to win the next competition. Therefore, the system does not commit you to the idea that improvement *should* be rewarded; it merely accommodates it as data. It also fits nicely with the idea of "inclusivity," but inclusivity is a social goal, not a theory of desert.

  **What it strictly commits you to:**
  The handicap system commits you to the view that **merit is not intrinsic to the act, but contextual to the agent.** It asserts that a score of 75 has a different moral weight depending on who shot it. Strictly, it commits you to **Luck Egalitarianism** regarding natural endowment: it assumes that natural talent is a form of "brute luck" that should be neutralized to determine who *really* deserves the prize. It posits that the only "fair" competition is one where the starting lines are moved so that the finish line represents an equal exertion of will, rather than an equal distance run.

  ### 2. The Two Specific Bits

  **A. Fixed Underlying Ability and Sandbagging**
  Does the system presuppose a fixed underlying ability? **Yes, strictly.**

  The handicap mechanism relies on a Bayesian update model: it assumes there is a "True Ability" (a latent trait) and that any given round is a noisy sample of that trait. The handicap is the system's current best estimate of that latent trait.

  Without this assumption, the concept of **sandbagging** collapses. Sandbagging is the deliberate inflation of your handicap by playing poorly in non-critical rounds to gain an advantage in a competition. This only makes sense as a *cheat* if there is a distinction between "What the system thinks I am" and "What I actually am."

  If scores were merely performances with no underlying truth (a purely nominalist view), then playing badly *would* mean you are a bad player. There would be no "fake" bad player. The moral outrage surrounding sandbagging proves that the golfing community believes in a Platonic "True Golfer" that exists behind the numbers. The handicap system commits you to the existence of this latent trait; otherwise, the adjustment mechanism is just punishing randomness, not calibrating skill.

  **B. Talent vs. Coaching vs. Injury**
  Does the system refuse to distinguish natural talent from coaching from injury? **Yes, strictly.**

  The handicap algorithm is source-blind. It is a black box that ingests scores and outputs a number.
  *   If you shoot low scores because you were born with fast-twitch muscle fibers (Talent), your handicap goes down.
  *   If you shoot low scores because you spent $50,000 on a swing coach (Investment), your handicap goes down.
  *   If you shoot high scores because you have a herniated disc (Misfortune), your handicap goes up.

  The system treats all three as functionally identical inputs. It refuses to distinguish between **Brute Luck** (talent/injury) and **Option Luck** (coaching/practice). In fact, it creates a perverse incentive structure regarding these distinctions. If "Merit" is defined as Net Score, then having natural talent is a disadvantage because it raises the baseline you must exceed to win. Conversely, having a bad back is an *advantage*, as it lowers the expectation bar.

  By refusing to distinguish the *cause* of the score, the handicap system commits to the view that **only the deviation from the mean matters.** It implies that the moral worth of a birdie is zero; the moral worth lies entirely in the birdie being *unexpected*.

  ### 3. Coherence of Running Both Formats

  Can one institution coherently run both? **Yes, but only by adopting a pluralistic theory of justice.**

  If the club claims that the Scratch winner is "The Best Golfer" and the Handicap winner is also "The Best Golfer," it is contradicting itself. One defines "Best" as *Maximum Capacity*, the other as *Maximum Efficiency Relative to Capacity*.

  However, an institution can coherently run both if it acknowledges they serve different **teleologies** (purposes):
  1.  **Scratch:** A **Hierarchical** function. Its purpose is to map the objective hierarchy of skill. It answers: "Who has the most command over the ball?" This is necessary for the ecosystem to have standards, benchmarks, and aspirational goals.
  2.  **Handicap:** An **Egalitarian** function. Its purpose is to maximize participation and social utility. It answers: "Who can we allow to feel the thrill of victory today?"

  The contradiction arises only if you claim one is the *true* account of merit. As long as the club admits that Scratch is about *excellence* and Handicap is about *equity*, they coexist. The Scratch event concedes that absolute merit is too exclusive for weekly social play. The Handicap event concedes that absolute equity is meaningless for determining the pinnacle of the sport.

  ### 4. If the Handicap View Were the "True" Account of Merit

  If we decided that Relative Performance Desert (Handicap) was the *only* morally valid way to assign reward, the professional game would have to be dismantled and rebuilt.

  **Prize Money:**
  Currently, prize money is concentrated at the top of the absolute hierarchy. Under a true Handicap theory, prize money should be distributed based on **Strokes Gained Relative to Expectation.**
  *   Tiger Woods shooting a 68 (when expected to shoot 65) is less "meritorious" than a club pro shooting a 70 (when expected to shoot 75).
  *   Wealth would redistribute from the superstars to the mid-tier players who consistently punch above their weight. The "superstar economy" relies on the Scratch theory (absolute scarcity of talent); the Handicap theory dissolves that scarcity.

  **Rankings:**
  The Official World Golf Ranking would collapse. You cannot rank players globally if the metric is internal to the player. A player ranked #1 would simply be the player currently experiencing the highest positive variance from their own mean. Rankings would become transient and meaningless as a measure of "who to watch."

  **The Tour Structure:**
  The Tour would cease to be a spectacle of excellence.
  *   **Spectatorship:** People watch pro golf to see humans do things other humans cannot (hit a 300-yard drive to 5 feet). If the winner is determined by who played best *relative to themselves*, the absolute quality of the shot matters less than the context. A 150-yard wedge into the wind by a 20-handicapper becomes more "valuable" than a 250-yard 3-wood by a pro. The visual spectacle—the reason the TV contracts exist—evaporates.
  *   **Incentives:** The system would incentivize **information asymmetry**. Since merit is based on beating expectations, players would be financially incentivized to sandbag permanently. The entire economy would shift from "playing well" to "managing perceptions of how well you can play."

  **Conclusion:**
  The handicap system is a beautiful piece of social engineering, but it is a lie about the nature of excellence. It strictly commits to the idea that **fairness requires neutralizing talent.** If you make that the universal truth, you destroy the incentive to acquire talent, the ability to measure it, and the economic structure that rewards it. The golf club runs both because it knows that while we crave the fairness of the handicap, we revere the hierarchy of the scratch. To choose one as the "true" merit is to choose between a game everyone can win, and a game worth watching.
