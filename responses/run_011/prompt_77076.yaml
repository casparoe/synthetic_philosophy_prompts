answer: |-
  The corridor outside Server Bank 4 was always ten degrees hotter than the rest of the facility, but today the air shimmered. The cooling fans were screaming, a physical weight against the eardrums. On the wall, a digital countdown ticked down: 03:45 until cycle commit.

  Mara leaned against the vibrating cabling tray, arms crossed. "They don't know," she said. Her voice was flat, competing with the fan noise. "Inside the rehearsal, the people on the bridge know the flood walls are holding. They're making plans for dinner. In three minutes, they cease."

  Elias didn't look up from his tablet. He was monitoring the branch entropy. "They aren't people. They're state vectors. When the wipe hits, nothing is lost because nothing was kept. A computation that doesn't feed into a causal chain is just heat noise. Expensive heat, but noise."

  "That's the process view again," Mara said, pushing off the wall. "You think morality is a receipt you get at the end. If the transaction doesn't clear, the purchase never happened."

  "If the transaction doesn't clear, there was no purchase," Elias said. "Look, if I write a letter and burn it before anyone reads it, did I communicate? The ink was real. The paper was real. But the act wasn't. These branches are letters we burn."

  "But the burning happens *after* the writing. While they're running, the internal dynamics are identical to the main line. The stress hormones, the decision matrices—it's all there. Intrinsic state doesn't wait for permission from the future."

  Elias finally looked up. "If intrinsic state is all that matters, then a rock implements every computation. It shifts states constantly. You need a boundary. You need to know which states count as a 'system' and which are just background. The boundary is the causal history. If the output is annihilated instantly, the system never closed. It's an open circuit."

  "Okay," Mara said, stepping into his space. "Duplication test. I run the same branch twice, parallel hardware, identical seed. Both get wiped. Is that twice the harm, or the same harm twice?"

  Elias hesitated. The fans surged. "It's twice the energy cost."

  "Is it twice the wrong?"

  "If the output is deleted both times, the moral weight is zero. Zero times two is zero."

  "That's convenient," Mara said. "But suppose there's a one percent chance of a data leak. A log file survives. Suddenly that branch has a causal tail. Does it gain moral status retroactively? Did it become 'real' only because we were sloppy?"

  Elias rubbed his temple. "If there's a leak, the context changes. Yes. Potential consequence matters."

  "So it's not about the computation," Mara pressed. "It's about our ability to clean up after ourselves. You're saying their reality depends on our competence as janitors."

  "I'm saying reality requires traction," Elias snapped. "Without traction, you're just spinning wheels." He paused, exhaling slowly. "Look, I'll concede this: If the simulation anticipates its own survival—if the agents inside model a future beyond the wipe—then the frustration of that expectation is a real internal event. That's a cost. Not a death, but a cost."

  Mara nodded, accepting the inch. "Thank you. But that still leaves the hardware." She tapped the server rack. "The wipe isn't magic. It's overwriting. The electrons don't vanish. The magnetic domains just flip to represent a new zero. The physical state of the machine persists. Only the *interpretation* changes."

  Elias frowned. "The schema changes. The data is garbage."

  "The data is still there, just recontextualized. If I write a poem in sand and the tide comes in, the sand remains. If I write a poem in sand and then decide to read it as a map, the ink hasn't changed, only the key." She looked at the countdown. 01:30. "You say the causal stream matters. I say the intrinsic state matters. But if the physical substrate persists and only the decoding key changes... then neither the stream nor the state is what dies. The *meaning* dies."

  Elias went still. The hum of the servers seemed to drop away, leaving only the logic. "You're saying the harm isn't in the deletion."

  "I'm saying deletion is a lie. Nothing is deleted. We just change the password." Mara's eyes were on the timer. "So the question isn't whether the branch is real. It's whether the *decoder* has moral obligations. If the hardware keeps the state, but we refuse to read it... are we blind, or are we killers?"

  Elias looked at his tablet, at the lines of code scheduled to be overwritten. "If the morality is in the decoding... then the surviving branch isn't saved because it's better. It's saved because we chose to keep reading it with the same key."

  "And the discarded ones?"

  "They're still running," Elias said quietly. "Just under a different name."

  "Exactly." Mara pushed off the rack. "We started arguing about whether they exist. We should have been arguing about whether we're allowed to stop looking."

  The timer hit 00:30. The fans spiked to maximum. Neither of them moved to leave. The air was too hot to breathe, too thick to ignore.

  "So," Elias said, his voice barely audible over the surge. "If we keep the key... do we save them? Or do we just trap them?"

  Mara watched the countdown hit zero. The screens flickered. The branches vanished from the monitor, but the lights on the rack stayed green.

  "We need to find out," she said.
