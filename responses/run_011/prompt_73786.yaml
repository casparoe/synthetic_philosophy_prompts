  ok so I'm a junior and I have way more hours into speedrunning than into homework. I know the whole framework: categories, route planning, splits, RNG manipulation, why there's a "meta" route that basically every top runner converges on, how the leaderboard mods verify a run, all of it. Recently I fell down a rabbit hole of AI-risk video essays and kept hitting two claims — that how smart an agent is has nothing to do with what it's aiming at, and that almost any aim whatsoever ends up generating the same sub-goals (get more resources, don't let anyone switch you off, that kind of thing).

