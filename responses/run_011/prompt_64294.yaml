answer: |-
  The seminar room smelled of dust and old paper. On the wall, the map of Europe in 1914 hung slightly crooked, the Austro-Hungarian Empire a sprawling beige wound across the centre. A stood before it, tracing the road from the Town Hall to the Appel Quay with a finger. B sat at the table, laptop open to a phase portrait—a swirling diagram of trajectories converging on a fixed point.

  **A:** It stopped here. Ten metres. If the driver hadn't stalled, if he hadn't reversed directly in front of Princip, the Archduke lives. If the Archduke lives, the July Crisis doesn't happen in July. Maybe not at all.

  **B:** You're conflating the spark with the powder. Look at the screen. This isn't a road; it's a system. Those trajectories? They all end up at the same attractor. War. The assassination is just noise in the signal. You're arguing that if you remove one noise spike, the system doesn't discharge. But the pressure was hydraulic.

  **A:** Hydraulic pressure doesn't explode without a rupture point. I'm not denying the pressure. I'm saying the *timing* and the *configuration* of the explosion depended on that specific rupture. You treat the stall as incidental. I'm saying it's constitutive.

  **B:** Constitutive of what? A specific war, sure. But not war *simpliciter*. And here's where your counterfactual collapses. You say "if the car hadn't stalled." But what else holds fixed? When you quantify over nearby worlds, what are you licensing? Are you holding the alliance system fixed? The mobilisation timetables? If you hold those fixed, you get war anyway via a different trigger. If you don't, you're not talking about 1914 anymore. You're talking about a mirage.

  **A:** Don't dismiss it as a mirage. We constrain the background constants just like Fogel did with the railways. We hold observable magnitudes fixed—troop levels, fiscal strain, diplomatic rhetoric—and vary the single parameter: the encounter at the corner. We run the accounts. The archival record shows the war party in Vienna needed *this* crime to justify *this* ultimatum. Without the specific outrage of a royal murder, the hawks lack the political capital to override the moderates.

  **B:** But that assumes the political capital wasn't accumulating elsewhere. You're treating the system as linear. Input A, output B. History isn't linear. It's chaotic. Sensitive dependence on initial conditions. I'll grant you that. But chaos doesn't mean anything goes. It means trajectories diverge exponentially while staying within the same basin of attraction. You can change the turn, change the date, change the victim, and the system still revisits the region labeled "general conflict." The question isn't whether the trajectory changes. It's whether the basin changes.

  **A:** That's a neat model, but it ignores overdetermination. You say the turn was random. It wasn't. It was the residue of a hundred antecedent decisions. The route was changed because of earlier security failures. The driver was uninformed because of bureaucratic friction within the Austro-Hungarian command. That "random" stall is actually the tip of a causal pyramid. To imagine a world where the car doesn't stall is to imagine a world where the bureaucracy functions differently. And if the bureaucracy functions differently, maybe the ultimatum isn't sent. So it *is* a nearby world, but it's not the world you're modelling where only the spark vanishes and the powder stays dry.

  **B:** Now you're moving the goalposts. First, it was the stall. Now it's the bureaucracy. If you change the bureaucracy, you're admitting the structural flaws mattered more than the stall. But let's stick to your claim. You're arguing token contingency. That *this* event mattered. I'm arguing type contingency. That *some* event was inevitable. You need to separate them. If you claim *this* token caused the war, you must show that no other token could have fired the gun within the relevant window.

  **A:** I claim that *this* token determined the *character* of the war. A war starting in 1915 over a colonial dispute looks different than a war starting in 1914 over Slavic nationalism. The entry of the United States, the survival of the Romanovs—these hang on the specific casus belli. So even if your attractor is "war," the specific trajectory determines the post-war landscape. The stall matters for the twentieth century, even if it doesn't matter for the existence of conflict.

  **B:** I'll concede that. The specific topology of the peace was contingent on the specific topology of the war. If the assassination fails, maybe Germany fights a defensive war two years later and doesn't invade Belgium. No Lusitania, maybe no US entry. The map looks different. But that's a concession about the *outcome*, not the *cause*. You still haven't solved the semantic problem. How close is "close enough"? If I say "if Princip had missed," you say "war is averted." If I say "if Princip had missed, but someone else shot him in 1915," you say "war happens." That makes your counterfactual unfalsifiable. It's a mirage counterfactual because the antecedent—Princip missing *and* no replacement trigger—cannot be made coherently close to the actual world given the structural tension.

  **A:** It's not unfalsifiable. It's archival. We find the memos. We see the hesitation in Berlin. We see that Wilhelm II went on holiday *because* he thought the crisis was local. If the crisis doesn't ignite in July, the holiday continues, the diplomatic channels stay open. You're assuming the tension *must* discharge. I'm saying tension can dissipate. It did in 1911, during the Second Moroccan Crisis. The system wobbled and settled. Why not 1914?

  **B:** Because 1911 wasn't 1914. The arms race expenditure had doubled. The Russian railway strategy had shifted. You're treating 1911 and 1914 as identical states. They aren't. The basin had narrowed. But... alright. I will concede this: the *immediacy* of the general war was contingent. Without the assassination, the general war might not have happened *in August 1914*. It might have been a series of localized conflicts that escalated later. So the singular event accelerated the systemic inevitability.

  **A:** And I'll concede this: without the structural pressure, the stall is just a traffic incident. If the alliances weren't locked, if mobilisation wasn't automated, the Archduke's death is a diplomatic note, not a declaration. So the stall was necessary, but not sufficient. It required the kindling you're obsessed with.

  **B:** So we agree it was an interaction. But we disagree on the counterfactual weight. You think removing the stall removes the war. I think removing the stall only delays the war.

  **A:** Precisely. And that's where the discriminating case lies. We need a case where structural pressure was high, but the spark was removed, and peace held. You say 1911. I say 1911 proves my point—no spark, no war. You say 1911 proves yours—the spark wasn't needed yet.

  **B:** No, the discriminating case would be a system with high structural pressure where a spark was *removed* and war was *averted permanently*, not just delayed. But we can't have that. We can't rerun the twentieth century. That's the problem. You rely on archives that show intention, but intentions change based on events. I rely on models that show pressure, but pressure is abstract until it breaks something.

  **A:** So you think the question is undecidable in principle?

  **B:** I think any case we choose is contaminated by the outcome. If war doesn't happen, the archives show why it didn't, and I'll say the pressure wasn't high enough. If war happens, you'll say the spark was essential. We're stuck in the actual world.

  **A:** Then we're not doing history. We're doing metaphysics. I have a document here that says the Chief of Staff refused to sign the mobilisation order until the news from Sarajevo arrived. That's not metaphysics. That's a signature.

  **B:** And I have a dataset showing war probability approaching one as a function of arms expenditure. That's not metaphysics. That's a curve.

  **A:** Your curve doesn't explain why August 1st.

  **B:** Your signature doesn't explain why the system couldn't absorb the shock.

  They stood there, the map between them, the laptop screen dimming. The room was quiet, save for the traffic outside, moving along roads that had been drawn long before either of them was born.

  **A:** Then we disagree on what counts as evidence. You want statistical inevitability. I want procedural possibility.

  **B:** And I think procedural possibility is an illusion if the statistical probability is one.

  **A:** And I think statistical probability is meaningless if the procedure never completes.

  **B:** So no discriminating case.

  **A:** Not one we can agree on.

  **B:** No. Not one we can agree on.
