  # Decision Tree: Updating on Conditionals (The Judy Benjamin Case)

  **The Case:** A fair six-sided die is rolled.
  *   **Prior:** $P(1)=...=P(6)=1/6$.
  *   **Antecedent ($A$):** Roll is not 1 or 2 ($\{3, 4, 5, 6\}$). $P(A) = 2/3$.
  *   **Consequent ($C$):** Roll is 4 ($\{4\}$). $P(C) = 1/6$.
  *   **Evidence:** You learn "If $A$, then $C$."
  *   **Constraint:** All views agree $P_{new}(C|A) = 1$ (worlds 3, 5, 6 are eliminated or effectively nullified).
  *   **The Dispute:** What happens to the probability of $\neg A$ (worlds 1, 2)?

  ---

  ### **Node 1: Does the truth or acceptability of the conditional depend on a causal mechanism linking $A$ and $C$?**

  *   **YES** $\rightarrow$ Go to **Node 2A**
  *   **NO** (It is a bare logical or evidential constraint) $\rightarrow$ Go to **Node 2B**

  ---

  ### **Node 2A: (Causal Dependence) Is the antecedent causally prior to the consequent?**
  *(e.g., "If I switch it on, the light goes" vs. "If the light is on, the switch is up")*

  *   **YES (Interventional)** $\rightarrow$ **Leaf 1: Kaufmann's Causal Update**
  *   **NO (Evidential/Backtracking)** $\rightarrow$ **Leaf 2: The Propositional Standard**

  ---

  ### **Node 2B: (No Causal Dependence) Do you treat "If $A$, then $C$" as a proposition with truth conditions?**

  *   **YES** (It describes a fact about the world) $\rightarrow$ **Leaf 2: The Propositional Standard**
  *   **NO** (It is a constraint on your credence function) $\rightarrow$ **Node 3**

  ---

  ### **Node 3: (Constraint View) Does learning this constraint change your credence in $\neg A$?**
  *(i.e., Does learning what happens inside $A$ tell you anything about whether $A$ is false?)*

  *   **YES** (Preserve ratios between $\neg A$ and $A \land C$) $\rightarrow$ **Leaf 2: The Propositional Standard**
  *   **NO** (Keep $P(\neg A)$ fixed) $\rightarrow$ **Leaf 3: van Fraassen's Reflection Principle**

  ---

  ### **The Leaves**

  #### **Leaf 1: Kaufmann's Causal Update**
  *   **View:** Conditionals are evaluated based on causal models. In acausal contexts (like the Die Case), the view defaults to the standard propositional update. In causal contexts, it diverges (e.g., distinguishing $P(C|A)$ from the probability of the conditional).
  *   **Die Case Number:** **$P(4) = 1/3$**
      *   *Calculation:* Since the die roll is acausal, this defaults to the Material Conditional update. Eliminate $\{3, 5, 6\}$. Renormalize remaining mass $\{1, 2, 4\}$ ($1/2$ total). $P(4) = (1/6) / (1/2) = 1/3$.

  #### **Leaf 2: The Propositional Standard (McGee / Material+Jeffrey)**
  *   **View:** The indicative conditional expresses a proposition (typically the Material Conditional $A \supset C$). Learning it involves conditionalizing (or Jeffrey conditioning) on that proposition. McGee argues for this propositional status; the "Material+Jeffrey" label refers to the kinematic method of setting $P(A \supset C)=1$.
  *   **Die Case Number:** **$P(4) = 1/3$**
      *   *Calculation:* Identical to Leaf 1 in this case. Eliminate $A \land \neg C$. The relative probability of $\neg A$ rises because $A$-worlds were eliminated. $P(\neg A)$ goes from $1/3$ to $2/3$. $P(4)$ becomes $1/3$.

  #### **Leaf 3: van Fraassen's Reflection Principle**
  *   **View:** Learning a conditional is a constraint on conditional belief, not a factual elimination of worlds. Crucially, information about what happens *given* $A$ should not alter your belief in $\neg A$. This preserves the prior probability of the antecedent's negation.
  *   **Die Case Number:** **$P(4) = 2/3$**
      *   *Calculation:* Fix $P_{new}(\neg A) = P_{old}(\neg A) = 1/3$. Therefore $P_{new}(A) = 2/3$. Since $P_{new}(C|A)=1$, $P_{new}(C) = 2/3$.

  ---

  ### **Analysis & Flags**

  #### **1. Convergent Leaves (Same Number, Different Reasons)**
  **Leaf 1 (Kaufmann)** and **Leaf 2 (McGee/Material)** both deliver **$P(4) = 1/3$** in the standard Die Case.

  *   **How to separate them:** You need a **Causal Judy Benjamin** case.
      *   *Scenario:* A button causes a light. $A$ = Button Pressed, $C$ = Light On.
      *   *Evidence:* "If the button was pressed, the light is on."
      *   *Divergence:* **McGee (Material)** treats this as eliminating (Pressed $\land$ Off) worlds. This boosts the probability that the button was *not* pressed (because the "Pressed & Off" worlds are removed, leaving "Not Pressed" as a larger share of the remaining pie).
      *   **Kaufmann (Causal)** argues that in a causal context, learning the conditional confirms the causal link but shouldn't necessarily boost the probability that the cause *didn't* happen in the same way. He distinguishes between the probability of the conditional and the conditional probability, often yielding different update dynamics in causal networks compared to the blunt elimination of the Material view.

  #### **2. Unoccupied Node Combinations**
  **Combination:** "Conditionals are Truth-Apt Propositions" (Node 2B: YES) **AND** "Learning them keeps $P(\neg A)$ fixed" (Node 3: NO).

  *   **Status:** **Mathematically Incoherent** (under standard probability kinematics).
  *   **Why:** If the conditional is a proposition true in all $\neg A$ worlds and false in some $A$ worlds (specifically $A \land \neg C$), then learning the proposition is true *requires* eliminating the $A \land \neg C$ worlds.
  *   If $P(A \land \neg C) > 0$, eliminating that mass *must* increase the relative share of $\neg A$ unless you simultaneously add new mass to $\neg A$ from outside the system. Standard conditionalization does not add mass; it redistributes existing mass. Therefore, you cannot treat the conditional as a standard proposition *and* claim that $P(\neg A)$ remains unchanged. You must choose: either it's not a proposition (van Fraassen), or $P(\neg A)$ changes (McGee).

  #### **3. Attribution Note**
  *   **McGee:** While McGee is famous for a logic where Modus Ponens fails, in the context of *probabilistic updating* on simple indicatives, his view aligns with the propositional (Material) account, contrasting with the non-propositional JB solutions.
  *   **Kaufmann:** Stefan Kaufmann's work (e.g., *"Conditionals, Context, and the Suppression Effect"*) is flagged here for its dependence on causal structure. In the acausal Die Case, it collapses to the Material view, which is why it shares the leaf number with McGee here.
  *   **Material+Jeffrey:** This refers to the standard probabilistic practice of treating $A \to C$ as $A \supset C$ and applying Jeffrey Conditionalization (or standard Conditionalization if certainty is reached). It numerically matches McGee in this binary elimination case.
