      Alex: "Then how do you explain inference? If 'Romeo loves Juliet' is an unanalyzed blob, why does it entail 'Someone loves Juliet'? Shared constituents explain logical grip. Your blobs are isolated."

      Blair: "Structure isn't composition. We abstract constituents because the facts share patterns, not because they share parts. Logic tracks abstraction, not assembly."

      Alex: "That sounds like saying the grip is illusory. If constituents are mere abstractions, entailment loses its ontological anchor. You save unity by sacrificing inference."

