  2. **The Temporal Integrity Criterion:** A programme is progressive if and only if its protective auxiliaries are constructed prior to the examination of the anomaly. This targets Case 3, distinguishing genuine testing from post-hoc rationalisation, regardless of independent testability. It demands procedural honesty over mere logical possibility. Necessary condition: temporal priority. Sufficient condition: consistency. It solves the 'testable in principle' loophole by demanding timing.
  3. **The Heuristic Fertility Criterion:** A programme is progressive if and only if it generates new research lines in neighbouring fields, even without novel predictions. This validates Case 4, prioritising conceptual utility over empirical risk. It suggests that theoretical integration constitutes progress independent of direct falsification. Necessary condition: uptake. Sufficient condition: new lines. It accommodates the 'quiet adoption' you observed. Each principle attempts to resolve the ambiguity in your third case regarding independent testability. The first ignores it, the second makes it temporal, the third replaces it with utility. Together they map the space of your disagreement. These formulations expose the trade-offs in your reasoning. The first aligns with Lakatos's original text. The second aligns with your concern about ad hocery in Case 3. The third aligns with your sympathy for Case 4. None satisfy all five cases simultaneously.

  **Pressure points**

  The Strict Empirical Criterion immediately sacrifices Case 4; Evo-Devo becomes degenerating despite its utility, contradicting your intuition. The Temporal Integrity Criterion struggles with Case 2; determining the exact moment an auxiliary became 'post-hoc' is historically ambiguous, leaving the 1900 verdict unresolved. The Heuristic Fertility Criterion risks validating Case 3; if social psychologists publish enough moderator papers, they achieve uptake without truth. Accommodating Case 4 requires accepting non-empirical progress, which dilutes the methodology's ability to distinguish science from metaphysics. Accommodating Case 2 requires historical omniscience. To save all verdicts, you must adopt a hybrid principle so complex it loses predictive power. The cost is a methodology that cannot guide current research, only history. It becomes a descriptive taxonomy rather than a normative guide. You cannot have both historical accuracy and current applicability in practice.

  **The verdict I should drop**

  You should drop Verdict 4. Lakatos's methodology is fundamentally empirical; it distinguishes science from metaphysics via novel facts, not conceptual popularity. Case 4 describes a fruitful *metaphysic* or a *toolkit*, not necessarily a progressive scientific programme in the Lakatosian sense. By insisting it is progressive, you conflate heuristic utility with empirical growth. Retaining this verdict forces you to abandon the core mechanism of MSRP, rendering the distinction between Cases 3 and 4 meaningless. If progress allows no empirical risk, any coherent vocabulary becomes progressive. You must choose between Lakatos and a broader sociology of science.

  **One new case**

  Consider Wegener's continental drift in 1920. It predicted fossil matches across continents (novel facts) but lacked a causal mechanism (plate tectonics). A strict empirical principle calls it progressive; a mechanistic principle calls it degenerating. Your favoured principle might classify it as degenerating due to the lack of a theoretical auxiliary, surprising you given its eventual vindication. This highlights the risk of demanding theoretical completeness over empirical success. It tests whether you value the map or the territory.
