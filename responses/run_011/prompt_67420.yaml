      *   *Friend's Claim:* Holding both beliefs is irrational/inconsistent.
      *   *Standard Epistemological Response:* Most contemporary epistemologists argue that the Lottery Paradox shows that **belief is not closed under conjunction** or that **high probability is not sufficient for belief** in a way that allows aggregation. However, in practical contexts (like law, regulation, science), we distinguish between **individual warrant** and **aggregate certainty**.
      *   *The Attestation:* "Each factual assertion... is accurate to the best of my knowledge and belief."
