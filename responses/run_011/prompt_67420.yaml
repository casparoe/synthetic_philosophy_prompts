      *   *Address the Distinction:* The crucial distinction is between **verification status** (individual) and **infallibility** (aggregate). The attestation covers the former.
      *   *Address the Probability:* The friend's math assumes independence which is likely false (errors cluster), but even if true, "belief" in regulation is not Bayesian probability > 0.99. It is "justified acceptance."
      *   *Address the Lie:* It is not a lie because "best of knowledge and belief" admits fallibility. You are not swearing to God; you are swearing to diligence.
      *   *Recommendation:* Sign as drafted. Do not hedge lines (arbitrary). Formalize the defect log as a quality metric (CAPA), not a confession of current fraud.
