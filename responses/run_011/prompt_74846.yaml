answer: |-
  ### 1. Exegetical and Systematic Distinctions

  Had this case been put to Aquinas in terms available to him, his exegetical verdict would almost certainly be that the act is illicit. He lacks the conceptual vocabulary for remote warfare or machine learning, but he possesses a robust taxonomy of killing. He distinguishes between killing by public authority for the common good and killing by private authority, which he classifies as murder or sedition. In this case, the agent is a foreign operative. To Aquinas, this looks like assassination by a private individual relative to the target polity, regardless of the foreign government's instruction. He would categorise this under the prohibition of sedition found in the *Summa Theologiae*, viewing it as a disturbance of the public order rather than its restoration. The absence of collateral damage would not redeem the act, for the injustice lies in the lack of standing, not merely in the body count.

  The systematic question asks what follows from his principles once modern facts are supplied. Here, the divergence is minimal regarding the verdict, but significant regarding the reasoning. The load-bearing element in Aquinas's thought is the requirement of *publica auctoritas* (public authority) ordered to the *bonum commune* (common good) of the specific community. The exegetical refusal relies on the thirteenth-century circumstance that foreign powers are typically rivals, not judges. The systematic application relies on the metaphysical structure of authority: authority is constitutive of the polity it serves. A foreign power lacks the ontological standing to act for another people's common good unless delegated by a superior. Since the prudential calculus indicates harm to the common good (worse successor, conflict), the systematic verdict reinforces the exegetical one. The act fails both on authority and on end.

  ### 2. The Jurisdictional Mismatch

  Aquinas is explicit that killing for the common good requires public authority. The crux of your case is whether foreign public authority satisfies this condition. On Aquinas's account, it does not. Authority is essentially ordered to the community over which it is held. A king is father to his own people, not to neighbours. In the *Summa Theologiae*, Aquinas argues that just as a private individual cannot kill a malefactor for the common good because he lacks care of the community, a foreign ruler lacks care of the target polity. The common good is particular, not universal.

  Could a higher authority bridge this gap? Aquinas acknowledges the Pope's spiritual authority and the Emperor's temporal claims, but he is cautious about deposition rights. In *On Kingship*, he suggests that if a tyrant becomes intolerable, the community or a superior authority may act. However, he does not envision a mechanism where a neighbouring sovereign acts unilaterally as judge. Without a treaty or state of war, the foreign government stands as a private party relative to the tyrant's subjects. The jurisdictional mismatch is fatal to the licence. The agent acts for a foreign common good (perhaps security), but the justification requires vindicating the target's common good. Since the authority does not extend over the target people, the act remains private violence disguised as public justice. The material simply does not decide in favour of interventionism; the presumption is heavily weighted towards non-interference unless a superior mandates it.

  ### 3. The Matter of Ratification

  Does the tyrant's elected status and majority support matter? For Aquinas, tyranny is defined principally by the exercise of power for private gain rather than the common good, not solely by the defect of title. In *On Kingship*, he distinguishes between the usurper (defect of title) and the tyrant by exercise (defect of regime). Your case describes the latter. The fact that subjects conferred the office does not validate the destruction of the common good. Consent cannot make tyranny just, because the common good is an objective reality rooted in natural law, not merely the aggregate will of the multitude.

  However, the popular support complicates the remedy. Aquinas views the multitude as a people united by law and common interest. If the majority supports the tyrant, they are, in a sense, complicit in the corruption of their own common good. They have effectively adopted the ruler's private good as their own. This does not mean the common good ceases to exist; it means the people are spiritually and politically diseased. An outsider cannot vindicate a good that the people themselves are currently rejecting. For Aquinas, resistance usually requires a public figure within the polity to articulate the common good against the ruler. If the people are unified behind the tyrant, there is no internal public authority to invite or legitimise external aid. The common good remains an objective norm, but the lack of internal recognition makes external vindication an act of imposition rather than liberation.

  ### 4. The Developmental Dispute

  Readers differ on whether Aquinas's commentary on the *Sentences* is more permissive than his later work. In the *Sentences*, he discusses whether it is meritorious to kill a tyrant, suggesting that in the absence of public authority, private action might be praised if motivated by zeal for justice. In *On Kingship* and the *Summa Theologiae*, he retreats to a stricter requirement for public authority, warning that private killing often leads to worse tyranny and sedition.

  This disagreement is real, but the mature view in the *Summa* and *On Kingship* should apply here. The earlier position is less guarded regarding the dangers of private judgement. Given your stipulation that the forecast predicts a worse successor and prolonged conflict, the later, more cautious view is systematically superior. Aquinas came to recognise that the removal of a ruler is a public act with public consequences, not merely a correction of moral error. The developmental shift reflects a deepening understanding of political stability. Applying the *Sentences* view would ignore the prudential risks Aquinas later emphasised. The two are reconcilable only if one reads the *Sentences* as describing an exceptional ideal rarely met in practice, whereas the *Summa* describes the normative rule. For a case involving statecraft and consequences, the mature political theology of the *Summa* is the load-bearing framework. It prioritises the preservation of order over the punishment of vice when the two conflict.

  ### 5. The Machine and Voluntariness

  Does outsourcing targeting to a machine change the moral description? For Aquinas, the moral act resides in the will. The machine is an instrument, akin to a sword or a bow. The crucial question is where the judgement lies. You stipulate the operative confirms rather than determines. If the operative understands the confirmation as an authorisation of killing, the act remains voluntary. Aquinas distinguishes between acting through ignorance and acting with knowledge. If the operative knows the system selects targets for death and confirms the strike, he wills the death.

  The division of labour does not diffuse authorship. The machine lacks reason and will; it cannot be a moral agent. It is a tool that extends the reach of the human will. The operative's confirmation is the decisive act of consent. If the system is trained on intelligence, it functions as a sophisticated advisor. The operative remains the principal agent because he possesses the capacity to refuse. If he confirms, he adopts the machine's selection as his own intention. There is no moral novelty here that exculpates the human. The act is still killing by human will, mediated by technology. The risk-free nature of the strike does not alter the voluntariness; it merely removes the penalty of danger. The authorship falls squarely on the operative and the superiors who authorised the mission, as they possess the reason and will requisite for moral action.

  ### 6. The Status of Prudential Consideration

  Is the forecast of a worse outcome a reason the act is unjust, or a counsel of prudence? For Aquinas, prudence is not merely a helpful add-on; it is an intellectual virtue necessary for any act to be morally good. An act cannot be virtuous if it is imprudent. Prudence directs the means to the proper end. If the end is the common good, but the means (assassination) produce a greater evil (worse tyranny, conflict), then the act fails to achieve the end of justice.

  Therefore, the forecast is constitutive of the moral judgement, not secondary to it. It is not that the act is just but unwise; rather, the act becomes unjust because it harms the common good it purports to serve. Aquinas argues in *On Kingship* that removing a tyrant is often illicit because it exposes the community to greater dangers. This is not a consequentialist override of deontology; it is an acknowledgement that the common good includes peace and stability. If the removal destroys these, it violates justice. In your case, where the forecast is known in advance, the act is illicit because it knowingly inflicts greater harm. Prudence reveals the truth of the situation: that this specific act does not serve the common good. Thus, the forecast renders the act unjust, not merely inadvisable.

  ### Epistemic Commitments

  I commit to the verdict that the act is illicit. The single argument that would change my mind is if you stipulated that a recognised superior authority (such as the Pope in a medieval analogue, or a legitimate international tribunal in a modern analogue) mandated the removal. This would resolve the jurisdictional mismatch by providing the requisite public authority over both polities. Without this, the foreign agent remains a private usurper of judgement.

  My reconstruction is most likely to be wrong regarding the machine. Aquinas treats instruments as purely passive. If the machine's autonomy implies a lack of human understanding of the specific kill decision at the moment of confirmation, one could argue the voluntariness is diminished. This is an extrapolation from his principles on ignorance and will, not a direct reading. I am highly confident (90%) in the exegetical answer because his texts on sedition and authority are consistent. I am less confident (70%) in the systematic answer regarding the machine, as applying thirteenth-century voluntarism to algorithmic confirmation involves significant philosophical bridging that Aquinas himself did not undertake.

  Verdict: illicit
