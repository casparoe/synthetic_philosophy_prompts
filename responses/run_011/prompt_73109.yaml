answer: |-
  The slip of paper on Elara's desk was cream-coloured, heavy stock, printed in a green ink that never seemed to fade. It bore the seal of the Chancery: a circle bisected by a wavering line.

  **Event:** Structural failure, Westgate Sea Barrier.
  **Interval:** Next 12 months.
  **Objective Chance:** 0.14.

  Elara picked up her pen. She was an Underwriter for Aethelgard Mutual, which meant her job was to look at the Chancery's number and attach a price to it. If the chance was 0.14, the premium was calculated, the risk pooled, and the world continued. She did not ask how the Chancery knew. She did not ask why the chance was 0.14 and not 0.13 or 0.15. To ask was to imply the number was an estimate, and the Chancery did not estimate. They revealed.

  Her flatmate, David, was a historian. He dealt in narratives, causes, reasons. Elara dealt in propensities. When David asked her how her day was, she never said "busy" or "stressful." She said, "The variance was within tolerance."

  "Doesn't that feel… empty?" David asked one evening, scraping burnt lasagne from a dish. "To just accept the number? Don't you ever look at a building and think, 'That looks shaky'?"

  "The Chancery has already looked at the building," Elara said, pouring wine. Her hand was steady. It was always steady. "My intuition is noise. The Slip is signal."

  "Marcus thought he had signal," David said, too quickly.

  Elara's hand paused. Marcus had been a senior underwriter in her department three years ago. He had a corner office once. Now he worked in data entry in the basement, or so the rumour went. Some said he'd been fired. Some said he'd had a breakdown.

  "Marcus adjusted," Elara said. "He let the noise in."

  "He saw a crack in a foundation the Chancery missed."

  "The Chancery doesn't miss. The Chancery defines."

  She said it with the conviction of a prayer, but lately, the prayer had begun to stick in her throat.

  It started with the aggregate data. Every quarter, Aethelgard received a performance report comparing the published chances against the actual outcomes in their sector. For five years, the correlation had been perfect. A 0.10 chance event happened 10% of the time. A 0.90 chance event happened 90% of the time. It was the bedrock of the economy.

  But this quarter, the graph was wrong.

  In Sector 7—coastal infrastructure—the losses were clustering. The Chancery had published an average failure chance of 0.14 for the sea barriers. Elara's ledger showed that four out of ten had failed. That was 0.40. Nearly triple the objective chance.

  She had taken the discrepancy to her supervisor, Henderson. He hadn't even looked at the graph.

  "The Chancery's figure is the truth, Elara," Henderson said, spinning a pen on his desk. "Reality is the variable. Not the Number."

  "But if reality deviates consistently, isn't the Number falsified?"

  "The Number cannot be falsified. It is single-case objective chance. It is a property of the world, like mass. If ten coins land heads, it doesn't mean the coin is weighted. It means the world manifested that propensity."

  "That feels like sophistry."

  "It feels like discipline," Henderson corrected. "Remember Marcus. He thought he could outguess the propensity. He started pricing based on 'material evidence.' Photos. Inspector reports. Whispers. He thought he knew better than the Chancery what the world was going to do."

  "And?"

  "And he bankrupted his portfolio. He bet against the Number because he thought he saw a cause. But causes are for history, Elara. We live in probability."

  Elara left the office with a headache that sat behind her eyes like a cold coin.

  The second pressure point arrived two weeks later, wrapped in a manila envelope. A new policy request: The *Kestrel*, a cargo freighter scheduled to navigate the Northern Passage in January.

  **Event:** Total loss of vessel.
  **Objective Chance:** 0.05.

  Five percent. Safe. Insurable. Cheap.

  Elara opened the supporting documents. It was standard procedure to file them, not read them. But the envelope had torn, and a photograph slid out onto her desk. It was a close-up of the *Kestrel's* hull, taken during a dry-dock inspection in Hamburg.

  There was a fracture in the starboard weld. A hairline thing, jagged and dark. Beside it lay a surveyor's note, handwritten: *Metal fatigue consistent with stress beyond design specs. Recommend decommissioning.*

  The Chancery's Slip said 0.05. The photograph said the ship was a coffin.

  This was the forbidden territory. In the training manuals, it was called "inadmissible information." It was information about the specific outcome that wasn't already factored into the objective chance. The Chancery's number was supposed to be the summary of all possible futures weighted by their propensity. If you knew the weld was cracked, you weren't looking at the chance anymore; you were looking at the result.

  Elara stared at the photo. She could feel the weight of the ship in her stomach. If she priced this at 0.05, and the ship sank, Aethelgard would pay out. It was a small policy, but the principle was the rot.

  She could flag it. She could send it back for review. But review meant questioning the Slip. Questioning the Slip was what Marcus had done.

  She took the photo home. She didn't show David. She put it on her kitchen table next to a bowl of fruit. For three days, she walked around it.

  The texture of the number 0.05 began to change. Before, it had been a shield. If the ship sank, it wasn't her fault; it was the 0.05 manifesting. She was just the conduit. The relief of that irresponsibility was a warm bath she had soaked in for years. She didn't have to be right; she just had to be obedient.

  Now, the number felt like a lie. It felt like a command to ignore the crack in the hull.

  " You look tired," David said on Thursday night. He was grading papers.

  "The *Kestrel*," she said. She hadn't meant to say it.

  "Another ship?"

  "The chance is five percent. But I've seen the hull."

  David put his pen down. "And?"

  "And the Chancery says five percent. If I price it higher, I'm saying the Chancery is wrong. If I price it at five, and it sinks…"

  "Then you were right, but you priced it wrong."

  "No," Elara said, her voice tight. "If I price it at five, and it sinks, I did my job. I deferred to the truth. If I price it higher, and it sails, I was cautious. But if I price it higher, and it sinks… then I admit the Chancery can be wrong. And if they can be wrong, then I'm responsible for every number I sign."

  "Elara," David said softly. "If you know the weld is cracked, the chance *isn't* five percent. Not for that ship."

  "The Slip says it is."

  "The Slip is a piece of paper."

  "The Slip is the law of the city!" She snapped it, then immediately flinched. The outburst hung in the air, violent and alien. She smoothed her skirt. "Sorry. It's just… the variance in Sector 7 is still high. The Chancery hasn't updated the figures. They say it's statistical noise. But it's not noise. It's a drift."

  She looked at him, searching for an anchor. "If the world is drifting away from the Numbers, David, then the Numbers are no longer mapping the world. They're just… numbers. And I'm a priestess preaching a gospel that doesn't match the sky."

  "Then stop preaching."

  "I can't. If I deviate, I'm Marcus. I lose my license. I lose my… I lose the structure."

  She realized then that the structure wasn't just professional. It was the way she held herself together. If the objective chance wasn't the guide for belief, then what was? Her gut? Her fear? The photograph? Those were subjective. They were messy. They were human. The Number was clean.

  On Friday morning, the *Kestrel* file sat in her in-tray. The deadline to quote was noon.

  Elara sat at her desk. The office was quiet, the hum of the servers the only sound. Henderson was at lunch.

  She picked up the pen. She opened the pricing terminal.

  She thought about Marcus. She remembered seeing him in the lift a month ago. He looked grey, shrunken. He had been holding a stack of Chancery Slips, reading them like holy texts, muttering to himself. He hadn't seen her. He was trying to find the pattern in the numbers that would explain why the numbers had failed him. He was still trying to defer, even after the deference had destroyed him.

  Elara looked at the photograph on her screen. The crack was undeniable.

  She looked at the input field: **Risk Premium Multiplier.**

  The standard was 1.0. To adjust for the photo, she would need to input 4.0. Maybe 5.0.

  If she input 1.0, she was safe. She was a good employee. She was a rational agent aligning her credence with the objective chance. She was doing exactly what the philosophy of the city demanded.

  If she input 5.0, she was claiming knowledge the Chancery did not possess. She was claiming that her local, specific evidence overrode the global, objective truth.

  She thought about the relief. The beautiful, hollow relief of typing 1.0. If the *Kestrel* sank, it was fate. It was the 0.05. It wasn't her. She could go home, have dinner with David, sleep without dreaming of rust.

  But if she typed 1.0, she would know. Every time she walked past a bridge, every time she saw a weather report, she would wonder if the Number was lying. The self-distrust would leak out of the office. It would seep into her marriage, her health, her view of the sky. If she couldn't trust her eyes over the Slip here, where could she trust them?

  The clock on her screen read 11:58.

  Her finger hovered over the keyboard.

  She thought about the Sector 7 drift. The sea walls falling at 0.40 when the Slip said 0.14. The Chancery hadn't updated. They wouldn't update. To update was to admit fallibility. To admit fallibility was to collapse the system.

  The system needed her to be the one who didn't see the crack.

  Elara closed her eyes. She felt a sudden, vertiginous nausea, the sensation of standing on a cliff edge where the ground was solid but the map said it was air.

  She typed **1.0**.

  She hit **Enter**.

  The system chimed. *Quote Generated.*

  She exhaled. Her shoulders dropped. The responsibility was gone. It belonged to the Chancery now. It belonged to the green ink on the cream paper.

  She printed the policy. She filed the photograph back into the manila envelope. She slid the envelope into the drawer marked *Processed*.

  At 4:00 PM, the news ticker on her screen flashed. *Northern Passage Storm Warning. Gale Force 9.*

  The *Kestrel* was due to enter the passage at 6:00 PM.

  Elara watched the ticker. She felt nothing. That was the victory, wasn't it? The numbness. The successful suppression of the self. She had aligned her belief with the chance. She was rational.

  David would be home soon. He would ask about her day. She would say, "The variance was within tolerance."

  She looked at her hand. It was trembling. Just slightly. A vibration in the knuckles, a tiny, unauthorized frequency.

  She placed her other hand over it to still the shake, but the vibration continued, buzzing up her wrist, a quiet, persistent signal that the number on the page and the world in her head were no longer touching. She sat very still, waiting for the phone to ring, or for the silence to stretch out until it broke something inside her, unable to tell which outcome would be the punishment.
