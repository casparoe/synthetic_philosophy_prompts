answer: |-
  Here is a disciplined mapping of the Irish sequence against the theoretical frameworks you specified, using only the facts you have assembled.

  ### 1. Mapping Players, Design, and Output

  **The Players**
  *   **The Sortition Body:** 66 citizens (Convention) / 99 citizens (Assembly).
  *   **The Political Elite:** 33 party-nominated politicians (Convention only); Government (set remit); Oireachtas Committee (21 politicians).
  *   **The State Bureaucracy:** Civil Service secretariat; Polling firm (recruitment); Chair (Government nominee vs. Supreme Court Judge).
  *   **The Electorate:** The national referendum voters.

  **The Design**
  *   **Selection:** Stratified random sampling from the electoral register (Assembly) vs. mixed selection (Convention).
  *   **Process:** Expert/stakeholder presentations followed by small-table deliberation over multiple weekends.
  *   **Constraints:** Agenda set by Government Programme/Dáil Resolution; expenses only (no salary); attrition management (replacements).

  **The Output (The Critical Theoretical Pivot)**
  You asked if it matters which output is picked. **Yes, it matters decisively.**
  *   **If the output is the Assembly Report:** The process failed to produce a binding decision. The 12-week limit was not a majority position of the body (only a plurality of a subgroup), yet it was treated as *the* recommendation.
  *   **If the output is the Committee Report:** The sortition body was merely a preliminary hearing. The politicians re-ran hearings and altered the recommendation (dropping socio-economic grounds).
  *   **If the output is the Referendum:** The sortition body was a campaign instrument. The legitimacy came from the national vote (66.4%), not the mini-public.

  **Theoretical Implication:** If sortition theory claims these bodies *make* decisions, the Irish case falsifies it. If the theory claims they *inform* decisions, the Irish case confirms them as expensive consultative committees. Most sortition theory (Fishkin/Landemore) hovers ambiguously here, claiming "legitimacy" without always specifying if that legitimacy is binding or advisory.

  ### 2. Running Theoretical Claims Against Facts

  **A. Descriptive Representation (Pitkin/Mirror)**
  *   **Theory:** Random selection from the whole eligible population creates a microcosm (mirror). No self-selection bias.
  *   **Fact:** 28 of the original 99 withdrew (17 pre-meeting, 11 mid-process). 7 replacements were removed for non-random recruitment (acquaintances of polling firm employee).
  *   **Analysis:** The "mirror" is fractured. A 28% attrition rate is statistically significant. If attrition is correlated with views (e.g., those finding the topic too difficult or controversial leaving), the remaining body is no longer descriptive. The "acquaintances" scandal introduces a network bias that violates the randomness axiom.
  *   **Verdict:** The theory requires an extra condition: **Representativeness degrades with attrition.** The theory assumes a static body; the facts show a fluid one. To sustain the claim, you must prove attrition was uncorrelated with political views, which the data provided does not support.

  **B. Non-Dominance (Fishkin)**
  *   **Theory:** Excluding politicians prevents elite capture. Deliberation allows the "force of the better argument."
  *   **Fact:** Politicians were excluded from the Assembly, but the Chair was a Supreme Court Judge, the Secretariat was Civil Service, and the Agenda was set by the Government/Dáil. Expert lists were curated.
  *   **Analysis:** Dominance was not removed; it was **relocated**. It shifted from elected politicians to state-appointed elites (Judge, Civil Servants, Curated Experts). The members deliberated within a cage built by the government.
  *   **Verdict:** The theory misdescribes the power dynamic. "Non-dominance" is achieved regarding *party politics*, but not regarding *state bureaucracy*. The agenda-setting power remains a dominant veto point.

  **C. Epistemic Claims (Condorcet/Landemore)**
  *   **Theory:** Condorcet Jury Theorem requires independent voters. Landemore argues cognitive diversity trumps ability in problem-solving.
  *   **Fact:** Small-table deliberation over five weekends. On abortion, 64% backed termination without restriction, but the specific 12-week limit carried only 48% *within that group* (approx. 31% of the total voting body).
  *   **Analysis:**
      1.  **Condorcet:** Deliberation *destroys* independence. By design, members influence each other. You cannot invoke Condorcet to justify a deliberative body; they are mutually exclusive.
      2.  **Landemore:** If diversity trumps ability, the group should converge on the optimal solution. The fragmentation on the 12-week limit suggests deliberation did not clarify a "common good" but rather revealed irreconcilable preferences masked by a broader headline vote.
  *   **Verdict:** Condorcet is inapplicable. Landemore's claim is weakened by the inability of the group to settle on a specific majority position on the key policy detail (the limit), despite the broad principle vote.

  ### 3. Theory Fit: Explains, Misdescribes, Silent

  *   **Explains Well:** Why the **Convention (Mixed)** succeeded where the **Assembly (Pure)** struggled. The Convention had 33 politicians *inside* the room. They could own the outcome and shepherd it through the legislature. The Assembly had no politicians, so its output had no natural champions in the Dáil, necessitating the 21-member Committee to re-legitimise it.
  *   **Misdescribes:** The **Purity of Sortition**. Theory treats the random selection as a binary switch (random = representative). The facts show it as a gradient degraded by attrition and recruitment scandals. It also misdescribes **Neutrality**; the "neutral" chair and secretariat are state actors with institutional interests.
  *   **Silent On:** The **Ecosystem of Adoption**. Theory focuses intensely on the mini-public's internal validity. It is largely silent on what happens *after* the report. It does not account for the necessity of a partisan campaign (Pro-repeal campaigners) to win the referendum. It treats the mini-public as a sufficient condition for legitimacy, whereas the Irish case shows it is merely a necessary condition within a wider majoritarian process.

  ### 4. Convention vs. Assembly: Substitution or Lubrication?

  The contrast is stark.
  *   **Convention:** Mixed body (33 politicians + 66 citizens). Output: Marriage equality. Result: Successful referendum.
  *   **Assembly:** Pure sortition (99 citizens). Output: Abortion recommendation. Result: Modified by Committee, then Referendum.

  **Analysis:** This suggests mini-publics do not **substitute** for elected politicians; they **lubricate** them.
  *   In the Convention, politicians were present to absorb the risk and translate the recommendation into legislation.
  *   In the Assembly, politicians were absent, so the recommendation lacked legislative traction until a Parliamentary Committee (21 politicians) re-processed it.
  *   **The Cynicism Charge:** The theory has no resources to answer the charge that the government used the Assembly to "dodge a decision." If the government sets the remit, controls the timeline, and is not bound by the result, the mini-public functions as **political cover**. Sortition theory often assumes benevolent implementation; it cannot distinguish between genuine empowerment and strategic delay. If the output is advisory, the "dodging" charge stands unrefuted by the design.

  ### 5. The Fixed-Term Parliaments Question

  You asked about citizens deliberating on the tenure of the people whose job they are supposedly not doing.
  *   **The Irony:** The Government gave citizens the power to discuss limiting the Government's own power (fixed terms).
  *   **The Theoretical Limit:** This highlights that sortition is permitted only where the elite feel secure. Handing the *agenda* of constitutional reform to citizens is safe if the *implementation* remains with the Dáil.
  *   **Implication:** It confirms the "Lubrication" hypothesis. Citizens can propose rules for politicians, but only if politicians retain the veto on whether to enact them. It is a safety valve, not a transfer of sovereignty.

  ### 6. Final Verdict

  **Is the Irish sequence a confirmation, anomaly, or unanticipated case?**
  It is a **case sortition theory never anticipated.** Theory imagines the mini-public as a standalone locus of legitimacy. The Irish sequence shows the mini-public as one stage in a **hybrid legitimacy chain** (Assembly -> Committee -> Referendum). Without the Committee and the Referendum, the Assembly's output would likely have stalled.

  **Which single prediction would a theorist writing in 2016 have got most confidently wrong?**
  They would have predicted that **the Assembly's recommendation would stand on its own epistemic merit.**
  *   *Prediction:* The detailed work of the 99 citizens would be accepted as the authoritative guide for legislation.
  *   *Reality:* The 21-member Oireachtas Committee re-ran hearings and altered the recommendation (dropping socio-economic grounds). The "epistemic authority" of the 99 was overruled by the 21 elected representatives.

  **Conclusion on the "Settles It" Claim:**
  Your flatmate is incorrect. The Irish Citizens' Assembly does not settle the argument in favour of sortition as a *decision-making* body. It settles the argument in favour of sortition as a *consultative* body that requires elected politicians to validate its output. The attrition, the recruitment scandal, the curated agenda, and the subsequent Parliamentary override all demonstrate that the "three goods" (representativeness, deliberation, non-dominance) were compromised in practice, and the legitimacy ultimately derived from the traditional referendum, not the sortition.

  *(Fact Flag: I have treated the vote fractions you provided [64% total, 48% of that subgroup on 12 weeks] as exact. If the 48% figure refers to the proportion of the 64% group or the proportion of the total 87 votes, the mathematical implication changes slightly, but the qualitative point—that the specific limit lacked a majority of the whole body—remains valid based on your text.)*
