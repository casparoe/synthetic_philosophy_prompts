          2.  "Stopped gathering evidence": This is an overstatement. Agents observe the queue (public information); they just discount their private signal to zero weight. They haven't stopped gathering; they've stopped weighting.
          3.  "Shattered by one person... states why": This relies on relaxing the assumption of unobservable signals. In the base model, only actions are observed. If signals are observable, cascades shouldn't form as easily. The claim assumes a regulator can force signal revelation, which assumes signals are verifiable, an assumption absent from the model.
