answer: |-
  Here is the argument, drafted as a continuous philosophical exposition suitable for a dissertation chapter, followed by a critical assessment of its vulnerabilities.

  ***

  ### The Grain of Discovery: Why Multiples Cannot Carry the Weight of Determinism

  The sociological use of the "multiples" phenomenon rests on a category mistake regarding the individuation of scientific discoveries. Robert Merton's thesis—that independent, near-simultaneous discovery is the rule rather than the exception—is routinely deployed as a battering ram against the "heroic" conception of science. The inference is seductive: if Newton and Leibniz, or Darwin and Wallace, hit upon the same idea simultaneously, the idea must have been "in the air," determined by the state of the field rather than the genius of the individual. The discoverer is rendered interchangeable; the discovery, inevitable.

  This inference fails because it treats "the discovery" as a natural kind with fixed boundaries, when it is in fact a grain-relative construct. The frequency claim that does the evidential work for determinism is never pinned down because there is no principled way to fix the grain of "sameness" between two cognitive achievements. Individuated finely, paradigm multiples dissolve into distinct achievements; individuated coarsely, they become trivial. Consequently, the multiples phenomenon cannot displace the heroic picture; it is merely consistent with its negation.

  #### The Concrete Grain: Newton–Leibniz and Darwin–Wallace

  To see why the individuation problem is fatal to the determinist argument, we must move beyond the labels ("Calculus," "Natural Selection") and inspect the cognitive content.

  Consider Newton and Leibniz. If we individuate the discovery coarsely as "the invention of the calculus," we have a multiple. But what work does this label do? It hides the fact that Newton's fluxional method and Leibniz's differential algorithm are distinct mathematical technologies. Newton's approach is kinematic, grounded in the motion of points generating lines, utilizing "nascent quantities" and a geometric idiom that resists symbolic manipulation. Leibniz's approach is algebraic and combinatorial, relying on a characteristic notation ($dx, \int$) designed for formal manipulation and the handling of the inverse problem.

  Let us test the criteria for fixing the grain of sameness:
  1.  **Same Problem Solved:** Superficially, yes (tangents and areas). But Newton's problem is framed within a physics of motion; Leibniz's is framed within a logic of characteristic symbols.
  2.  **Mutual Translatability:** Eventually, yes, but not immediately. The translation required a transformation of the underlying formalism. If the discoveries were truly identical, the translation would be trivial. It was not; it sparked a century of priority warfare precisely because the British and Continental schools recognized the methods were not transparently interchangeable.
  3.  **Downstream Consequences:** They diverged. British mathematics stagnated within Newton's geometric idiom; Continental mathematics exploded via Leibniz's notation. If the discovery were the same, the downstream research trajectories should converge. They did not.

  Fine-grained, these are two different tools for managing continuity. Coarse-grained, they are "calculus." But "calculus" is a retrospective historiographical bucket, not a contemporaneous cognitive unit.

  Now consider Darwin and Wallace. The standard narrative treats them as co-discoverers of natural selection. Fine-grained, this collapses. Wallace's 1858 Ternate paper posits a strict elimination mechanism: varieties deviate from the type until they perish. It lacks the principle of divergence. It lacks the analogy with artificial selection (the breeder's eye). Crucially, it lacks the massive accumulation of evidence Darwin had hoarded for twenty years. Wallace has a mechanism; Darwin has a theory of life.
  1.  **Location in Problem-Space:** Wallace is solving the problem of species transmutation via environmental pressure. Darwin is solving the problem of the *origin of species* via divergence and adaptation.
  2.  **Translatability:** Wallace could not translate Darwin's divergence principle from his own elimination principle without abandoning his core argument.
  3.  **Downstream Consequences:** The Modern Synthesis is Darwinian, not Wallacian. Wallace remained a skeptic of sexual selection and human evolution in ways Darwin was not.

  If we individuate finely ("selection plus divergence plus artificial selection analogy plus evidence"), there is no multiple. There is only Darwin. If we individuate coarsely ("adaptation happens"), there is a multiple, but the claim is trivial. Any two biologists in 1850 agreed adaptation happened. The "discovery" that counts is the *how*, and the *how* differs.

  #### The Vagueness Objection

  A standard objection is that this is merely the sorites paradox restated. All counting is grain-relative. Is a heap of sand one heap or many grains? Is a chair one object or an assembly of atoms? If vagueness attends all counting, why does it have special bite against Merton?

  The bite comes from the *causal stakes*. When we count chairs, the stakes are pragmatic. When Merton counts multiples, he is making a causal claim about the determination of scientific content. He argues that the *content* was determined by the field. But if the content's identity conditions are vague, the causal claim lacks a determinate truth value. To say "the discovery was inevitable" requires a fixed target. If the target shifts depending on whether we look at the notation (Newton/Leibniz) or the general function (Calculus), then the claim "Calculus was inevitable" is true but trivial, while "Newton's Fluxions were inevitable" is false (since Leibniz didn't make them). Merton needs the specific content to be inevitable to undermine the hero; but the specific content is exactly what fails to multiply. Vagueness here is not a linguistic nuisance; it is an ontological gap in the determinist argument.

  #### The "Proves Too Much" Objection

  A more dangerous objection is that this grain-relativity defeats singletons as well. If we cannot say when two discoveries are the same, can we say when *one* discovery has occurred? If "Calculus" is too coarse, is "Newton's Fluxions" too fine? Perhaps Newton's 1666 work differs from his 1687 *Principia* application. If grain-relativity applies everywhere, I have not deflated the explanation of multiples; I have explained away the explanandum of discovery itself.

  There is, however, a crucial asymmetry. A singleton claim requires only that a cognitive token exists distinct from background noise. A multiple claim requires that two cognitive tokens are *identical* in the relevant respects. The burden of proof for identity is logically higher than for existence. Furthermore, priority disputes are zero-sum games regarding credit. Credit allocation requires a principle of individuation that distinguishes *mine* from *yours*. Existence does not. We can agree a discovery happened (singleton) without agreeing on its precise boundaries. We cannot agree a multiple happened without agreeing that the boundaries of A and B overlap sufficiently to count as "the same." The grain problem is fatal to multiples because multiples rely on an equivalence relation that the material history of science does not support.

  #### Event Identity and the Metaphysics of Discovery

  Does the event-identity literature rescue the determinist? Davidson proposes coarse-grained events: if $x$ and $y$ occupy the same space-time, they are the same event. This fails immediately for multiples, which are defined by *different* space-times (Newton in Cambridge, Leibniz in Hannover).

  Kim proposes events as property exemplifications: $[x, P, t]$. For a multiple, we would need $[Newton, P, t_1]$ and $[Leibniz, P, t_2]$ to count as tokens of the same type $P$. But what is $P$? If $P$ is "discovering calculus," we have begged the question by assuming the grain in the property description. If $P$ is "manipulating nascent quantities," Leibniz does not exemplify it. Kim's framework exposes the problem rather than solving it: it forces us to specify the property $P$, and once specified finely enough to be accurate, the identity vanishes.

  This suggests discoveries are not events at all. They are *epistemic achievements* or *content tokens*. Their identity is determined by inferential role, not space-time location or bare property instantiation. Since inferential roles are sensitive to the network of commitments (Newton's theology, Darwin's breeding analogies), two discoverers rarely inhabit the same inferential network. Therefore, strict identity of discovery is a metaphysical fiction.

  #### What Survives?

  If this argument holds, what remains of the multiples phenomenon? It retains evidential value, but not for strong determinism. Multiples show that a field has reached a "zone of proximal development"—a state where a certain *problem* is pressing and certain *tools* are available. They show that the *question* was inevitable, not the *answer*.

  Regarding priority disputes: if there is no determinate fact about whether two people made the same discovery, are these disputes merely bitter? No, they are *rationally interminable*. They are not disputes about fact (who was first?) but about normativity (what counts as the discovery?). When Newton claims priority, he is arguing for a fine-grained individuation that favors his fluxions. When the Continentals claim for Leibniz, they argue for a coarse-grained individuation that favors the notation. The dispute is a negotiation over the ontology of the field itself. It is not a mistake to be solved by a historian; it is the mechanism by which the field fixes its own grain retrospectively.

  ***

  ### Critical Assessment: Weaknesses and Repairability

  You asked me to argue for the position committedly, which I have done above. However, as a philosopher of science, I must now tell you where this argument is vulnerable. It is a strong chapter piece, but it rests on a tension that could undermine its conclusion if not managed.

  **1. The Functional Equivalence Trap**
  The weakest point in your thesis is the assumption that Mertonian determinism requires *strict* identity of content. It does not. It requires *functional equivalence*.
  Merton's claim is not that Newton and Leibniz wrote the same equations, but that they provided a *functionally equivalent solution* to a blocking problem in the field. If the field treats them as equivalent (by using both to solve the same subsequent problems), then sociologically, they *are* the same discovery.
  *   **The Risk:** You are arguing from a metaphysics of content (what is in their heads/papers) against a sociology of uptake (how the community uses it). If the community treats N and L as interchangeable for the purposes of research, your fine-grained distinctions become historically irrelevant.
  *   **Repair:** You must concede that "sameness" is fixed by community uptake, but argue that this uptake is *retrospective* and *political*, not evidence of inevitability. The community *makes* them the same to resolve the priority dispute, not because they *were* the same. This strengthens your claim that the dispute is rationally interminable until power decides it.

  **2. The Conflation of Discovery and Publication**
  Your argument leans heavily on the differences in the *presentation* (notation, evidence mass). A critic will argue that the *discovery* is the insight, while the *publication* is the packaging. Wallace may have lacked Darwin's evidence, but did he lack the *insight* into the mechanism?
  *   **The Risk:** If you define discovery too closely to its evidential support, you make discovery impossible for the first person (who by definition lacks the accumulated confirmation).
  *   **Repair:** Narrow the thesis. Argue that in biology, the mechanism *cannot* be separated from the evidence (unlike math), because the plausibility of the mechanism *depends* on the evidence. In physics, separate the algorithm from the metaphysics. Differentiate the cases rather than treating them uniformly.

  **3. The "Heroic" Straw Man**
  You argue that multiples cannot displace the "heroic" picture. But most historians of science have already abandoned the "lone genius" model without relying solely on multiples. They rely on networks, instrumentation, and patronage.
  *   **The Risk:** You are fighting a war that is already over. Proving that multiples don't prove determinism doesn't save the "heroic" view; it just removes one argument against it.
  *   **Repair:** Reframe the stakes. The issue isn't "Genius vs. Determinism." It is "Contingency vs. Convergence." Your argument supports a stronger contingency thesis: that even when convergence happens, it is fragile and dependent on specific local formulations that could have diverged (as British math did). This is a more valuable contribution than defending the "hero."

  **4. Is it a Confusion?**
  You asked if this rests on a confusion between counting and causation.
  *   **Verdict:** No, it is not a confusion. It is a valid critique of *operationalization*. Merton operationalizes "discovery" as a label. You are correctly pointing out that the label hides the variance.
  *   **However:** There is a risk of **semantic stalemate**. If you define "discovery" so finely that no two are alike, you win the argument by definition but lose the phenomenon. You must allow for *some* level of abstraction where multiples exist, then argue that *that level* is insufficient to support the causal claim of inevitability.
  *   **Advice:** Do not argue that multiples *do not exist*. Argue that the *description under which they are multiples* is too coarse to support the *causal inference of determinism*. This preserves the phenomenon while deflating the explanation.

  **Final Recommendation:**
  The thesis is defensible and philosophically robust, provided you do not overclaim. Do not say "there are no multiples." Say "multiples are descriptions, not natural kinds, and therefore cannot bear causal weight regarding inevitability." This shifts the burden to the Mertonian to explain *why* the coarse-grained description is the causally relevant one. Usually, they cannot do this without smuggling in normative assumptions about what "mattered" in the field—which brings you back to your point about priority disputes being political negotiations over grain.

  If you make that pivot, the chapter moves from a semantic critique to a substantive intervention in the sociology of scientific knowledge.
