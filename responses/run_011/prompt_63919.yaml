      *   This modal distinction saves the contingent cases. The Dutch book on rain relies on the *possibility* of the opposite outcome. The Dutch book on math relies on the *impossibility* of the opposite outcome.
      *   So, rejecting (2) for math does *not* collapse (8) for contingent events.

  10. **Final check of the "Logical Induction" part:**
