      *   *Step 2 (Mapping):* Need a clear table. Parchment = Ground surface? Original hand = Initial deposition? Scraping = Erosion/Ploughing? Later hands = Later occupation? Reader = Archaeologist? Empty slots: Intentionality of deposition.
      *   *Step 3 (Disanalogies):* Crucial point: Palimpsest implies the *original* is still there, just hidden. Taphonomy often means the original context is *gone* or transformed beyond recognition. Also, "authors" vs. natural processes.
