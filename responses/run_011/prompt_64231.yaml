      *Wait, word count check:* 150+150+200+400+200+150+200 = 1450. Looks good.

      *Technical nuance:* Ensure I distinguish between *deposition* (how it got there) and *post-depositional modification* (what happened after). The supervisor conflates them under "palimpsest." The sister focuses on the *event* energy.

