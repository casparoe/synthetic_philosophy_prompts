answer: |-
  ### 1. Brainstorm on the Page

  The palimpsest metaphor imports a specific ontology of time and visibility. Correspondences: stratigraphy as layers of text; erosion as scraping; later pits as marginalia; the archaeological record as a surface available for reading. Disanalogies: text is intentional, deposition is often accidental; scraping removes text, but burial often preserves it; a reader stands outside the text, but the archaeologist is part of the formation process (excavation destroys context); text is semantic, debris is causal.

  What matters: The palimpsest assumes the original is *obliterated* or *hidden* but structurally identical to the later layers. In archaeology, later layers often *crush* or *chemically alter* earlier ones. The metaphor suggests a zero-sum game (new text replaces old), whereas site formation can be additive (midden growth) or transformative (fire). The "ghosting" implies recoverability if one looks hard enough; taphonomy often implies permanent information loss. The "author" slot is critical: texts have authors, deposits have processes. If there is no author, there is no intent to read.

  ### 2. An Explicit Mapping

  The palimpsest image imposes a grammar of discrete, intentional acts overwriting a stable substrate. Below is the mapping of the metaphor onto the archaeological target.

  | Palimpsest Slot | Archaeological Referent (Tell/Midden) | Status (Real/Empty) |
  | :--- | :--- | :--- |
  | **Parchment** | The ground surface / stable landform | **Real**, but unstable (shifts via subsidence). |
  | **Original Hand** | Initial deposition event (e.g., floor laying) | **Real**, but often unidentifiable as discrete. |
  | **Scraping** | Erosion, leveling, ploughing | **Real**, but often partial, not total removal. |
  | **Later Hands** | Subsequent occupation phases | **Real**, but often intermingle rather than overlay. |
  | **Ghosting Ink** | Residual artifacts in upper layers | **Real** (residuality), but hard to distinguish from intrusion. |
  | **Reader** | The Archaeologist | **Real**, but destructive (excavation). |
  | **Original Text** | The "true" past event | **Empty**. No single text exists; only processes. |
  | **Author** | The agent of deposition | **Empty**. Most deposition is habitual or accidental, not authored. |
  | **Revision** | Reoccupation | **Empty**. Revision implies correction; reoccupation is just use. |

  **Analysis of Empty Slots:** The "Author" and "Original Text" slots are the most dangerous. The image requires that there *was* a coherent message (the raid) that was subsequently obscured. If the deposition was not a coherent message (e.g., if the bodies accumulated over years), the "scraping" didn't hide a text; there was no text to hide. The metaphor presupposes the very singularity the supervisor denies.

  ### 3. Sorting the Disanalogies

  Several disanalogies are merely cosmetic (e.g., ink vs. soil color). Others threaten the supervisor's conclusion directly.

  *   **Authorship and Intention:** The palimpsest implies an original coherent statement. If the site is a "phase of destruction and reoccupation" (supervisor's view), there is no single statement to obscure. However, if the skeletons are articulated, they *are* a coherent statement of simultaneous death. The metaphor fails to account for high-fidelity preservation amidst noise.
  *   **Discreteness vs. Continuity:** Palimpsests are discrete layers. Soil formation is often continuous. If the "scraping" (ploughing) is continuous, it doesn't create distinct layers but a homogenized zone. The supervisor claims "smearing," but smearing destroys articulation. If articulation survives, the smearing wasn't total.
  *   **Destruction vs. Accretion:** Scraping removes information. Burial often adds protective overburden. The supervisor treats all post-depositional processes as subtractive. They are often preservative (e.g., charred beam).
  *   **Equifinality:** Different processes can look the same. A palimpsest suggests one underlying truth. Archaeology often has multiple valid explanations for the same pattern. This supports the supervisor's caution but not his total rejection of the event.
  *   **Directional Transformations:** Some changes are one-way (burning). You cannot "scrape" a burnt beam back to unburnt wood. This fixes certain elements in time, contradicting the fluid "rewriting" of the palimpsest.

  **Verdict on Disanalogies:** The "destruction vs. accretion" and "discreteness" issues matter most. If the beam is charred *in situ*, it anchors the horizon. The palimpsest model cannot easily accommodate a fixed, datable anchor that survives the "scraping."

  ### 4. Strip the Image and Test the Conclusion

  Remove the metaphor. Evaluate the four claims against the listed formation processes (trampling, bioturbation, pits, colluvium, ploughing).

  *   **Claim (i): Single Episode.**
      *   *Evidence:* Nine articulated skeletons; conjoining jar fragments.
      *   *Taphonomic Test:* Articulation requires rapid burial and lack of disturbance. Trampling and bioturbation scatter bones. Ploughing destroys articulation. If nine bodies are articulated, the "smearing" processes listed by the supervisor did not operate at the intensity required to blur the event horizon. Conjoining fragments across a room also resist lateral movement.
      *   *Result:* **Survives.** The physical state of the bodies contradicts the "accumulation" model.
  *   **Claim (ii): Violent Raid.**
      *   *Evidence:* Metal points in collapse; skeletons in courtyard.
      *   *Taphonomic Test:* Points in collapse suggests they fell with the roof or were dropped during the event. However, points could be curated heirlooms deposited later. Skeletons could be executed prisoners rather than raid victims.
      *   *Result:* **Probable but not certain.** Taphonomy supports violence (trauma on bones would confirm, but isn't mentioned), but "raid" implies external agency which is an inference, not a formation process.
  *   **Claim (iii): Attackers' Entry Route.**
      *   *Evidence:* Distribution of points relative to doorway.
      *   *Taphonomic Test:* Colluvial movement and roof shift can move light metal objects. If the beam fell and shifted, the debris field shifted.
      *   *Result:* **Vulnerable.** This claim relies on precise spatial fidelity which post-depositional movement (colluvium) threatens most.
  *   **Claim (iv): Specific Decade.**
      *   *Evidence:* Charred roof beam (dendro date of felling).
      *   *Taphonomic Test:* Dendrochronology gives the year the tree died. It does not guarantee the year the beam burned. Wood can be stored for decades (old wood problem). However, roof beams are often used green or shortly after felling.
      *   *Result:* **High Resolution, but not absolute.** It licenses a *terminus post quem*, not necessarily the exact year of destruction, though likely close.

  **Conclusion:** The supervisor's list of processes (bioturbation, ploughing) is incompatible with the preservation of articulated skeletons. You cannot have it both ways: either the horizon was heavily reworked (supervisor) or it wasn't (sister). The data says it wasn't.

  ### 5. Audit My Sister's Image

  The "crash site" or "forensic scene" maps the archaeological horizon onto a modern crime scene.
  *   **Mappings:** The beam fall = physics of collapse; conjoining jars = explosion/separation dynamics; bodies = victims.
  *   **Imports:** It imports the assumption of a *sealed* system. Forensic scenes are secured; archaeological sites are open systems for millennia. It assumes the investigator arrives before decay; the archaeologist arrives after millennia of decay.
  *   **Assumption:** It assumes the event is the natural unit of analysis. This is better than the "phase" unit for this specific data, but risks ignoring the pre-event history (why were they there?).

  **Comparison:** The sister's image is epistemically stronger for *this* dataset because it accounts for the high-fidelity preservation (articulation) which the palimpsest image denies. However, it is overly optimistic about spatial precision (claim iii). The two are contradicting each other on the *degree of transformation*. The supervisor says transformation was high; the sister says it was low. The bones decide this: transformation was low.

  ### 6. Better Instruments

  Neither image is sufficient. Metaphors obscure the probabilistic nature of inference. Replace them with **Temporal Resolution and Taphonomic Thresholds**.

  *   **Instrument:** A statement of resolution. "This context supports event-scale inference because articulation thresholds were not breached."
  *   **License:** Allows claims of simultaneity (bones) and high-resolution dating (beam), but forbids precise narrative reconstruction (entry route) where light objects are involved.
  *   **Forbids:** Claiming the "raid" narrative without trauma analysis; claiming the exact year without accounting for wood curation.
  *   **Replacement:** A "Chain of Formation" diagram. List every process from deposition to excavation. Assign a probability of displacement to each artifact class (bones vs. beams vs. points). Where displacement probability is low, event claims are licensed. Where high, only phase claims are licensed.

  ### 7. A Verdict, Not a Shrug

  The supervisor's conclusion does not survive the audit. His palimpsest image is doing heavy argumentative lifting to support a taphonomic claim that the data contradicts. You cannot argue for "smearing" and "accumulation" in the face of nine articulated skeletons and conjoining ceramics. These are taphonomic facts that resist the processes he lists (ploughing, bioturbation) unless those processes were negligible—in which case his premise fails.

  The palimpsest was not decoration; it was a theoretical shield used to override empirical evidence with methodological caution. It allowed him to dismiss the event without engaging the specific formation processes that preserve articulation. He is right that "Pompeii premises" are dangerous generally, but wrong to apply them here where the physical evidence (articulation) confirms the Pompeii-like preservation.

  My sister's image is better fitted to the data, though it risks over-confidence on spatial details. The disagreement is not about analogies; it is about the weight of evidence versus the weight of theory. The supervisor prioritized theoretical caution (you can never know the event); the sister prioritized empirical fidelity (the bones show the event). In this instance, the bones win. The supervisor should have accepted the single-event horizon but cautioned against the narrative interpretation of the "raid." He threw out the event because he distrusted the narrative. That is a category error.

  **Confidence:** High. The presence of articulated skeletons is a hard taphonomic constraint that the palimpsest model cannot accommodate without contradiction.

  **Closing Note on Framing:**
  Your question assumes the images are the primary drivers of the disagreement. They are not. They are rhetorical tools used to justify underlying positions on evidentiary thresholds. The audit reveals that the supervisor's position is theoretically consistent but empirically weak for this specific site, while your sister's is empirically strong but theoretically risky. The fault lies not in the choice of metaphor, but in the failure to let the formation processes dictate the scale of inference.
