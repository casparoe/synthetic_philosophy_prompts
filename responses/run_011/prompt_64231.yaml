      *   *Verdict Nuance:* The supervisor's conclusion (drop the raid/decade) might be too conservative given the dendro and articulation, but his methodological caution is standard. However, the prompt asks me to audit the *image* and the *conclusion*. If the image is bad and the conclusion doesn't follow from the specific taphonomy, the supervisor loses the argumentative point, even if his caution is wise. I need to be decisive. The articulated skeletons are the "smoking gun" against the palimpsest model.

  6.  **Final Review against Constraints:**
