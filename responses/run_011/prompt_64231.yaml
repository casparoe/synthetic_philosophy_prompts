      *   *Step 5 (Sister's Image):* Forensic scene assumes rapid sealing. Archaeology rarely seals perfectly. But "crash site" captures the energy of the event. It imports the assumption of a single causal chain.
      *   *Step 6 (Better Instruments):* Move from metaphor to "Temporal Resolution" and "Taphonomic Thresholds."
      *   *Step 7 (Verdict):* Supervisor is likely wrong on the *single event* claim given the data (articulation/conjoins), but right to be cautious on the *narrative* (raid vs. ritual). The palimpsest image is misleading because it suggests total smearing where evidence suggests high fidelity.

  5.  **Refining and Polishing (Self-Correction during drafting):**
