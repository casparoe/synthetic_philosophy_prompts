answer: |-
  # STANDARD OPERATING PROCEDURE: EMOTIONAL TRIAGE (V3.1)

  **Goal:** Match the intervention to the *source* of the distress, not just the content. Do not default to "fix it" (Judgment) or "hold it" (Perception) without checking the engine first.

  **Time Limit:** Complete Triage within first 3 messages / 3 minutes.

  ### 1. THE SAFETY GATE (Always First)
  **Ask:** "Are you safe right now? Do you feel like you might hurt yourself or someone else?"
  *   **If YES / Ambiguous / "I don't know":** **STOP.** Do not apply levers. Escalate immediately to Senior/Clinical.
  *   **If NO:** Proceed to Step 2.

  ### 2. THE SOMATIC CHECK (The "Body" Lever)
  **Observe:** Is the user's typing fragmented? Are they describing physical symptoms (shaking, can't breathe, heart racing) as the *primary* problem?
  **Ask:** "Is the physical feeling right now worse than the thoughts?"
  *   **If YES:** **ROUTE: FEELING.**
      *   **Theory:** Jamesian. The body is driving the bus. Cognition is offline.
      *   **Move:** Grounding. "Can we pause the story for a minute? Where do you feel that in your body?"
      *   **Stop Condition:** If grounding fails after 5 mins, escalate (possible panic disorder/medical).

  ### 3. THE STORY CHECK (The "Judgment" vs. "Perception" Split)
  **Ask:** "Is there a specific story or prediction causing this (e.g., 'I will be fired'), or is it more of a general weight without a clear cause?"
  *   **If General Weight / No Object:** **ROUTE: PERCEPTION.**
      *   **Theory:** Moods/Value-perceptions. No proposition to dispute.
      *   **Move:** Validation of the state. "It makes sense that the weight is there even without a clear reason."
  *   **If Specific Story:** Proceed to Step 4.

  ### 4. THE FLEXIBILITY CHECK (The "Gap" Test)
  **Ask:** "Does part of you know the story might not be true, or does it feel like an absolute fact?"
  *   **If "I know it's irrational but I feel it anyway" (Recalcitrant):** **ROUTE: PERCEPTION.**
      *   **Theory:** Roberts/Prinz. The emotion is a "seeming" independent of belief.
      *   **Move:** Validate the conflict. "It's exhausting when your head knows one thing and your gut feels another."
      *   **Forbidden:** Do not offer evidence against the story. They already know.
  *   **If "It IS happening / It IS a fact" (Fixed Appraisal):** **ROUTE: JUDGMENT.**
      *   **Theory:** Nussbaum/Solomon. Emotion tracks a belief about value/threat.
      *   **Move:** Explore the appraisal *gently*. "If that did happen, what would it mean for you?" OR "How certain does that feel on a scale of 1-10?"
      *   **Flinch Warning:** If the threat is *real* (e.g., actual harassment), do not challenge the evidence. Validate the reality and pivot to practical support. If the threat is *distorted* (e.g., "They hate me because of a typo"), explore the meaning.
      *   **Forbidden:** Do not say "What's your evidence?" (Triggers defensiveness).

  ### 5. HANDOFF PROTOCOL
  *   **Risk Handoff:** Any mention of self-harm, suicide, or harm to others. (Values/Safety Call).
  *   **Clinical Handoff:** User describes symptoms of mania, psychosis, or trauma flashback (dissociation). (Factual/Clinical Call).
  *   **Senior Handoff:** User is angry at the volunteer, or chat exceeds 45 mins with no progress. (Process Call).

  ***

  # THEORETICAL COMPRESSSION & ANALYSIS

  ### 1. Distinctions Surviving Compression
  To fit on one page, we discard the *metaphysics* of emotion to keep the *phenomenology*.
  *   **Survives:** The functional distinction between **Propositional Content** (Judgment), **Non-Doxastic Seeming** (Perception), and **Physiological Arousal** (Feeling). Volunteers don't need to know if an emotion *is* a judgment; they only need to know if it *behaves* like one (i.e., can it be examined?).
  *   **Discarded:** The Nussbaum/Solomon debate on whether emotions are *choices* vs. *evaluations*. The Jamesian debate on whether bodily feedback *constitutes* the emotion or just accompanies it. For a text line, the ontology doesn't matter; the intervention point does.

  ### 2. Handling Hard Cases
  *   **Recalcitrant Emotion:** Handled by **Step 4 (Flexibility)**. If they know it's irrational but feel it, "Judgment" interventions (evidence) are useless. Route to Perception.
  *   **Mood w/o Object:** Handled by **Step 3 (Story)**. If there is no "because," there is no claim to challenge. Route to Perception/Feeling.
  *   **Grief:** Route to **Perception**. Grief is a valuation of loss. Challenging the "judgment" (e.g., "You'll find someone else") is harmful.
  *   **Shame-about-Anger:** Split. The *anger* might be Judgment (appraisal of wrong), the *shame* is Perception (social value). Address the shame first (Perception), then the anger (Judgment).
  *   **Panic w/o Construal:** Handled by **Step 2 (Somatic)**. If there is no story, just racing heart, do not ask "What are you worried about?" Route to Feeling.
  *   **Right to be Afraid:** This is the critical edge. If the boss *is* firing them, Step 4 ("Does it feel like a fact?") will yield "Yes." The SOP routes to **Judgment**, but the instruction modifies the move: *Validate the Reality*, do not *Challenge the Appraisal*. The fix is upstream (legal/practical), not internal.

  ### 3. The "Flinch" Case (Where the SOP contradicts your prior)
  You prefer the Perception model (emotions as non-doxastic seemings). You want to validate everything.
  **The Flinch:** The SOP will route a user with **Anxious Attachment** to the **Judgment Lever**.
  *   *Scenario:* User says, "They didn't text back in 20 minutes. They're leaving me."
  *   *Your Prior:* Validate the fear. "It feels terrifying to be abandoned." (Perception).
  *   *The SOP:* This is a Specific Story (Step 3) + Fixed Appraisal (Step 4). It routes to **Judgment**.
  *   *Why:* Treating this purely as a "feeling" reinforces the cognitive distortion. The volunteer must gently explore the appraisal ("What else could explain the silence?") without being dismissive. If you validate the "seeming" too hard here, you collude with the delusion. The SOP forces the volunteer to touch the cognition, which feels risky but is necessary for growth.

  ### 4. What The Procedure Cannot Do
  *   **Structural Repair:** It cannot fix a toxic workplace, a bad marriage, or poverty. It can only regulate the user's response to them.
  *   **Trauma Processing:** It cannot handle flashbacks where the "past" is experienced as "present." (Requires Step 5 Escalation).
  *   **Identity Formation:** It cannot help a user decide who they are. It can only help them manage the anxiety of not knowing.
  *   **Truth Arbitration:** The volunteer cannot determine if the boss *is* actually firing the user. They must operate on the user's reported reality unless risk is involved.

