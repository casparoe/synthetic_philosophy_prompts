  **Verdict and Divergence**
  The compression criterion yields a tie: both the Intentional and Rival descriptions compress the data vastly better than the Physical stance and equally well as each other. Naively, the Intentional Stance's predictive success suggests the system holds beliefs (e.g., "this note fits"). The two come apart because compression alone cannot distinguish *teleological effort* (trying to stay in key) from *structural conformity* (physically unable to play otherwise). Realism about beliefs loses its unique footing if non-intentional patterns earn equal ontological credit.

  **The Wedge Feature**
  The wedge is the **decoupling of structural regularity from teleological function**. The system obeys a rule without pursuing a goal.
  *   *Check:* If you remove this feature (repair the box), the Design stance becomes predictive, and the Intentional stance collapses into Design attribution. If you break it further (random noise), the Intentional stance fails entirely. The case only holds where regularity exists absent function.

  **Defender's Attack**
  A defender of belief realism would insist attributions must be **robust across counterfactuals**: "If a tine were struck harder, would the system *correct* to stay in key?" The Intentional stance implies active error-correction; the Rival implies passive constraint.
