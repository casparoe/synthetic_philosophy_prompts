  A damaged mechanical music box sits enclosed in an opaque case. Originally manufactured to play a specific melody, the cylinder is bent such that pin-hammer contacts occur at irregular intervals, destroying the melody. However, due to the specific tuning of the tines and the geometry of the damage, every note produced falls strictly within the C Major scale, though the sequence is otherwise unpredictable. An observer hears the notes but cannot see the mechanism or know the original design specification.

  **Candidate Descriptions**
  1.  **Physical Stance:** Full acoustic waveform analysis plus mechanical dynamics of pins, springs, and air resistance.
      *   *Length:* ~10⁶ bits/second (raw data).
      *   *Utility:* Accurate in principle, but prediction requires inaccessible internal state data.
  2.  **Design Stance:** "Executing [Original Song Title]."
      *   *Length:* ~10² bits (specify song).
      *   *Utility:* Predictive failure: 100% error on sequence; positively misleads observer.
  3.  **Intentional Stance:** "Agent trying to maintain C Major harmony."
      *   *Length:* ~200 bits (specify goal + rationality constraint).
      *   *Utility:* Predictive success: 100% accuracy on pitch class.
  4.  **Rival Description:** "Output constrained to C Major pitch set."
      *   *Length:* ~150 bits (specify set membership).
      *   *Utility:* Predictive success: 100% accuracy on pitch class.
