answer: |-
  **Exam Question**

  **Course:** PHIL405: The Birth of Modern Logic
  **Time Allowed:** 2 Hours
  **Total Marks:** 30

  **Question:**
  It has been claimed that Frege's posthumously published political diary provides evidence against the truth of his logical doctrines, rather than merely explaining their genesis. Critically evaluate this claim. In your answer, you must distinguish between explanatory and evidential links, consider specific commitments (such as the objectivity of thoughts, the third realm, or the rejection of psychologism), and address whether the inference might run in the opposite direction (i.e., whether the philosophy explains the politics).

  ***

  **Model Answer**

  The claim that Frege's political diary undermines the truth of his logic conflates the context of discovery with the context of justification. While the diary is invaluable for understanding the man, it remains evidentially inert regarding the validity of his logical system. The argument from the diary to the philosophy fails because it violates the core Fregean commitment to anti-psychologism, though it succeeds as an explanatory narrative regarding Frege's intellectual temperament.

  To assess the inferential link, we must distinguish between explanatory and evidential relevance. An explanatory link shows why a philosopher held a view (causal genesis); an evidential link bears on whether the view is true (justification). The student's claim assumes that moral or political failings in the author transfer to the propositions they assert. This is only viable if the truth of the propositions depends on the moral character of the thinker. Frege's philosophy explicitly denies this.

  The central obstacle to the diary's evidential relevance is Frege's anti-psychologism. For Frege, logic is not about how humans *do* think, but about the laws of truth themselves. Thoughts belong to a "third realm," distinct from the external physical world and the internal psychological world. They are ownerless. If thoughts are ownerless, the identity and truth conditions of a thought are independent of the thinker who grasps it. Therefore, the moral or political status of the thinker is logically irrelevant to the truth of the thought grasped. To argue otherwise is to reintroduce the psychologism Frege spent his career dismantling. If we allow the thinker's biography to determine the truth of their logic, we collapse the third realm back into the subjective mind, rendering objective knowledge impossible.

  However, the strongest challenge from the seminar room is not about specific logical laws, but about the *universality* of logic. Frege claims logic applies to anything that can think or speak. His diary reveals a desire to exclude certain groups from civil rights and participation. If logic is universal, but the philosopher denies the full humanity of certain rational agents, is there not a performative contradiction? While this is a serious tension, it remains evidential only regarding Frege's consistency as a moral agent, not the truth of the *Begriffsschrift*. The logic remains valid even if its author fails to recognize its full scope of application. The error is in Frege's anthropology, not his algebra of concepts.

  We must also consider the reverse direction: does the philosophy explain the diary? Here, the link is more plausible. Frege's philosophical project was driven by a hatred of vagueness, ambiguity, and relativism. He sought rigid definitions and absolute boundaries between concept and object, true and false. This intellectual rigidity may have predisposed him to a political worldview that valued order, hierarchy, and clear distinctions between "us" and "them." The diary does not prove the logic false, but the logic's demand for absolute precision may explain the political desire for absolute social order. This is an explanatory link, not an evidential one. It tells us why the diary looks the way it does, not whether the *Grundgesetze* is correct.

  Ultimately, the argument that the diary undermines the logic relies on an *ad hominem* structure that Frege's own metaphysics blocks. The third realm protects the thoughts from the thinker. We can condemn Frege's politics without altering the truth-values of his propositions. To do otherwise is to sacrifice the objectivity of truth for the sake of moral consistency. While we might wish for a unity between the good and the true, Frege's system requires us to accept that a vicious man can grasp eternal truths. The diary explains the man; the work stands on its own.

  ***

  **Marking Scheme (30 Marks)**

  **1. Thesis and Direction (5 Marks)**
  *   **5:** Clear, unequivocal stance taken (e.g., "explanatory only" or "evidentially damaging") and maintained throughout.
  *   **3-4:** Stance present but hedges significantly (e.g., "on the one hand, on the other" without resolution).
  *   **0-2:** No clear thesis; merely summarizes the debate.

  **2. Understanding of Fregean Commitments (10 Marks)**
  *   **8-10:** Precise deployment of specific concepts (Third Realm, anti-psychologism, objectivity of thoughts) to block or enable the inference. Shows how these concepts structurally prevent biographical data from affecting truth conditions.
  *   **5-7:** Mentions concepts correctly but applies them generally (e.g., "Frege hated psychologism") without linking them to the specific inferential problem.
  *   **0-4:** Misunderstands key terms (e.g., conflating psychologism with psychology) or relies on general biography rather than philosophical commitments.

  **3. Critical Evaluation of the Inference (10 Marks)**
  *   **8-10:** Rigorously distinguishes between explanatory (causal) and evidential (truth-bearing) links. Engages with the "reverse direction" (philosophy explaining politics) as a distinct logical possibility. Addresses the "universality" counter-argument.
  *   **5-7:** Distinguishes explanation vs. evidence but treats the reverse direction superficially. Accepts the "universality" objection without nuance.
  *   **0-4:** Fails to distinguish genesis from justification; treats the diary as direct proof of logical error.

  **4. Clarity and Precision (5 Marks)**
  *   **5:** Concise, philosophical prose. No wasted words.
  *   **3-4:** Readable but verbose or occasionally imprecise.
  *   **0-2:** Difficult to follow; colloquial language.

  **Grade Boundaries:**
  *   **First (70%+ / 21+ marks):** Must score 8+ in Section 3. Must pick a side decisively. Must handle the "reverse direction" requirement with sophistication (not just a token sentence).
  *   **2:1 (60-69% / 18-20 marks):** Solid distinction between evidence/explanation. Correct use of anti-psychologism. May hedge slightly on the conclusion or treat the reverse direction mechanically.
  *   **2:2 (50-59% / 15-17 marks):** Understands the diary is "bad" but logic is "good." Struggles to articulate *why* philosophically. May rely on the genetic fallacy as a slogan.

  ***

  **Common Mistakes & Penalties**

  1.  **The "Genetic Fallacy" Stopper:** Simply stating "This is the genetic fallacy" without explaining *why* Frege's anti-psychologism makes it a fallacy in this specific context. **(Deduct 3 marks from Section 3)**
  2.  **Conflating Truth and Genesis:** Arguing that because the diary shows *why* Frege wrote the *Begriffsschrift*, it shows the *Begriffsschrift* is biased. This fails the explanatory/evidential distinction. **(Cap Section 3 at 4 marks)**
  3.  **Treating Diary as Biography:** Using the diary as if it were a complete biography or ignoring that it was posthumous/fragmentary, treating it as the sole source of his political views. **(Deduct 2 marks from Section 2)**
  4.  **Ignoring the Reverse Direction:** Failing to address whether the philosophy explains the politics (a specific requirement of the question). **(Deduct 5 marks from Section 3)**
  5.  **Moralizing:** Spending more than 10% of the essay condemning Frege's politics rather than analyzing the inferential link to the logic. **(Deduct 3 marks from Section 4)**
