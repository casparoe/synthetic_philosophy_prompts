      *(Looking at the "No-Go")*: "if the list is itself a no-go result, that is what I most want to see." I should check if the requirements are mutually exclusive. They aren't *logically* exclusive, but they are *empirically* tense. I will frame the "No-Go" as the impossibility of satisfying "Representational Range" fully given "Consistency with Results" (data limits). I will identify "Empirical Decidability" as the veto.

