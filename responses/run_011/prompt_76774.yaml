answer: |-
  # Specification of Desiderata for Trait-Classification Frameworks

  This document specifies the standards against which any proposed framework for classifying organismal features (as adaptation, byproduct, exaptation, vestige, or drift) must be measured. The requirements are divided into those that are **Non-negotiable** (conditions for logical coherence and empirical adequacy) and those that are **Local Commitments** (preferences reflecting specific theoretical camps, provided they do not violate non-negotiable constraints). Each requirement is paired with the motivating case or consideration that generates it.

  ### I. Representational Range
  *The framework must possess the categorical vocabulary to describe the causal diversity of biological traits without collapsing distinct etiological pathways into a single label.*

  1.  **Requirement: Categorical Distinctness.** The framework must provide mutually exclusive definitions for: (a) features shaped by specific selection for their current form; (b) features arising as obligatory physical or developmental consequences of selected traits (e.g., the whiteness of bone resulting from calcium phosphate chemistry); (c) features inherited unchanged due to lack of variation or selective pressure (inertia); (d) features co-opted for a use different from that which shaped them (exaptation); and (e) features fixed via sampling error in finite populations (drift).
      *   **Motivating Case:** A framework that classifies the whiteness of bone as an adaptation for camouflage, rather than a chemical byproduct of structural strength, fails to capture biological reality. Conversely, a framework that lumps drift and weak selection into a single "non-adaptation" bin loses the ability to detect subtle selective gradients.
      *   **Verdict:** **Non-negotiable.** A classification system that cannot distinguish its target categories is functionally void.

  2.  **Requirement: No Forced Teleology.** The framework must allow for the description of a feature that is beneficial but not selected, and a feature that was selected but is now neutral or harmful, without semantic contradiction.
      *   **Motivating Case:** A trait may be currently useful (good design) but arose via drift (lucky accident). Conversely, a trait may be a vestige: selected in the past, but currently useless. The vocabulary must separate *current utility* from *historical etiology*.
      *   **Verdict:** **Non-negotiable.** Conflating utility with history renders evolutionary explanation circular.

  ### II. Conceptual Distinctions
  *The framework must preserve specific philosophical and biological distinctions that are often elided in casual discourse.*

  3.  **Requirement: Etiology vs. Effect.** The framework must rigorously distinguish between "having a function" (current causal contribution to fitness) and "being selected for" (historical cause of prevalence).
      *   **Motivating Case:** Exaptation. The feathers of birds were likely selected for thermoregulation before flight. A framework that defines "adaptation" solely by current flight utility misidentifies the historical cause; a framework that defines it solely by history ignores current utility. Both must be representable.
      *   **Verdict:** **Non-negotiable.** This is the core logical distinction of evolutionary biology.

  4.  **Requirement: Constraint vs. Ignorance.** The framework must distinguish between a feature that *cannot* vary due to physical/developmental laws (genuine constraint) and a feature for which we simply lack data on variation (absence of data).
      *   **Motivating Case:** Claiming a trait is a "necessary byproduct" because we cannot imagine an alternative is an argument from ignorance. Claiming it is a byproduct because physics dictates it (e.g., surface area to volume ratios) is a constraint claim. The framework must demand evidence for the necessity.
      *   **Verdict:** **Non-negotiable.** Confusing ignorance with necessity halts inquiry.

  5.  **Requirement: Optimality vs. Adequacy.** The framework must not equate "optimal" with "adapted." It must allow for traits that are "good enough" to persist without being mathematically optimal solutions to a problem.
      *   **Motivating Case:** Selection maximizes relative fitness, not absolute performance. A trait can be an adaptation without being the theoretical best design possible.
      *   **Verdict:** **Non-negotiable.** Equating adaptation with perfection invites falsification by engineering standards rather than evolutionary ones.

  ### III. Defaults and Evidence
  *The framework must specify how claims are tested, who bears the burden of proof, and how to prevent unfalsifiable narratives.*

  6.  **Requirement: Specified Null Hypothesis.** The framework must explicitly state what constitutes the null expectation for any given trait analysis. It must prevent the user from treating the adaptationist hypothesis as the default assumption.
      *   **Motivating Case:** The "Just-So Story" problem. If every feature is assumed to be an adaptation until proven otherwise, and "proof" allows for unlimited imaginative reconstruction of past environments, the theory cannot be wrong.
      *   **Verdict:** **Non-negotiable.** Scientific claims require a falsifiable baseline.

  7.  **Requirement: Burden of Proof Assignment.** The framework must assign the burden of proof to the hypothesis positing the more specific causal mechanism.
      *   **Motivating Case:** Selection is a specific force acting on variation; drift and ancestry are the background states of inheritance in finite lineages. To claim selection is to claim an *additional* causal parameter beyond inheritance and mutation.
      *   **Decision:** I decide that the **Non-adaptationist Null** (drift/constraint/ancestry) is the **Non-negotiable** standard for adequacy. While adaptationists argue this biases against detecting selection, logical parsimony dictates that the hypothesis requiring fewer specific causal parameters (drift/inheritance) must serve as the null against which the complex parameter (selection) is tested. To do otherwise licenses accounts that cannot be wrong.
      *   **Verdict:** **Non-negotiable.** (Note: Strict adaptationists will view this as a Local Commitment of their opponents, but for a framework to be scientifically rigorous, this parsimony rule is mandatory).

  8.  **Requirement: Independent Evidence.** The framework must demand evidence for selection that is independent of the mere existence of the trait and its putative benefit.
      *   **Motivating Case:** Inferring selection solely because a trait exists and is useful is tautological. Evidence must come from genetics, comparative phylogeny, or experimental manipulation.
      *   **Verdict:** **Non-negotiable.**

  ### IV. Consistency with Biological Results
  *The framework must not override established empirical findings in genetics, development, and population biology.*

  9.  **Requirement: Phylogenetic Non-Independence.** The framework must treat related species as non-independent data points.
      *   **Motivating Case:** Finding a trait in ten species of one genus does not provide ten independent tests of an adaptation hypothesis; it may represent one historical event.
      *   **Verdict:** **Non-negotiable.**

  10. **Requirement: Sensitivity to Population Parameters.** The framework must acknowledge that the efficacy of selection depends on population size ($N_e$) and standing variation.
      *   **Motivating Case:** Identical selective pressures leave different traces in large vs. small populations. In small populations, drift can override weak selection. A framework that assumes selection always wins in the long run contradicts population genetics.
      *   **Verdict:** **Non-negotiable.**

  11. **Requirement: Optimality as Test, Not Premise.** The framework must utilize optimality modeling as a method to test whether selection *could* have produced the trait, not as proof that it *did*.
      *   **Motivating Case:** A trait matching an optimal model is consistent with selection, but could also be a byproduct of a different selected trait that happens to match the model.
      *   **Verdict:** **Non-negotiable.**

  ### V. Further Demands: Definitions and Limits
  *The framework must address the ambiguity of key terms and acknowledge its own empirical limits.*

  12. **Requirement: Defined Space of Alternatives (Byproduct Strictness).** When claiming a feature is a "necessary byproduct," the framework must specify the space of alternatives relative to which the necessity is claimed.
      *   **Motivating Case:** Dennett's critique of Gould and Lewontin. "Necessity" is not absolute; it is relative to developmental and physical possibilities. A claim of byproduct status must hold fixed the developmental architecture and physical laws to show no other viable form was accessible to selection.
      *   **Verdict:** **Non-negotiable.** Without defining the "space of possible forms," a claim of necessity is meaningless. (Whether one adopts the *Strict* sense [only physically impossible to separate] or *Loose* sense [developmentally costly to separate] is a **Local Commitment**, but the requirement to *specify* which is being used is Non-negotiable).

  13. **Requirement: Empirical Decidability (The Killer Constraint).** The framework must acknowledge a "Zone of Indiscernibility" where data cannot distinguish between weak selection and drift, or ancient exaptation and current adaptation.
      *   **Motivating Case:** The tension between **Representational Range** (distinguishing drift from weak selection) and **Consistency with Results** (finite data, eroded history). In many real-world cases, the signal of history is too degraded to satisfy the burden of proof required by the **Defaults** section.
      *   **Verdict:** **Non-negotiable.** A framework that forces a classification where evidence is insufficient is dogmatic.
      *   **The Disqualifier:** The single requirement whose failure disqualifies a framework regardless of other merits is **Empirical Decidability**. If a framework posits categories that are, in principle or practice, empirically indistinguishable given the available biological data, and yet demands a verdict, it is a metaphysical system, not a scientific framework. It must allow for the verdict "Undetermined."

  ---

  ### Assessment of Competing Programmes

  **Strict Adaptationism** fails the specification primarily on **Defaults and Evidence** and **Empirical Decidability**. By treating adaptation as the default assumption or assuming that optimality implies selection, it violates the parsimony rule regarding the null hypothesis. It often treats the "Zone of Indiscernibility" as a temporary ignorance to be solved by better storytelling rather than a structural limit of historical data, thereby licensing accounts that cannot be wrong. While it scores well on **Representational Range** regarding selected traits, it collapses byproducts and drift into "unknown adaptations," violating the requirement for Categorical Distinctness.

  **Pluralism (Constraint/Drift Heavy)** satisfies the **Consistency with Biological Results** and **Defaults** requirements most robustly, correctly identifying the null hypothesis and respecting phylogenetic and genetic constraints. However, it risks failing the **Representational Range** requirement in the opposite direction if it becomes a priori skeptical of selection, potentially attributing clear cases of adaptive design to constraint or drift without sufficient positive evidence. Its success depends on whether it treats the non-adaptationist null as a methodological tool (passing) or an ideological conclusion (failing). It generally respects the **Empirical Decidability** constraint by admitting uncertainty.

  **Adaptationism as a Research Strategy** fares best against the specification as a whole. By treating adaptation not as a thesis about nature but as a heuristic for generating testable hypotheses, it satisfies the **Burden of Proof** requirement (the hypothesis must be tested, not assumed) and the **Empirical Decidability** constraint (if the test fails, the trait is reclassified). It preserves **Conceptual Distinctions** by allowing a trait to be investigated *as if* it were an adaptation without asserting it *is* one until evidence confirms it. It avoids the dogmatism of Strict Adaptationism while maintaining the investigative rigor that pure Pluralism might sometimes lack, provided it adheres to the Non-negotiable requirement to accept "Undetermined" or "Non-adaptive" verdicts when tests fail.
