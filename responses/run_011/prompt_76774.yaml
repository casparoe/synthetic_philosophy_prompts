      *   **Constraint 2:** Each requirement must be paired with the motivating case/consideration.
      *   **Constraint 3:** Explicitly label requirements as "Non-negotiable" or "Local Commitments" (camp-specific).
      *   **Constraint 4:** Organize logically, keeping cases attached to requirements.
      *   **Constraint 5:** Cover specific territory: Representational Range, Distinctions that Must Survive, Defaults and Evidence, Consistency with Results, Two Further Demands (Strict vs. Loose Byproduct, Inconsistencies/No-Go).
      *   **Constraint 6:** Close with a short assessment (1 paragraph each) of three positions: Strict Adaptationism, Pluralism (constraint/drift heavy), Adaptationism as Research Strategy.
      *   **Constraint 7:** No bibliography/citations. Argue from concepts alone.

  2.  **Deconstruct the Territory & Draft Requirements:**

      *   **Representational Range:**
          *   *Case:* Finely tuned design vs. bone whiteness (chemical necessity) vs. inertia (no change) vs. exaptation (new use) vs. drift (sampling error).
          *   *Requirement:* The framework must have distinct categories for these. It cannot collapse drift into weak selection or byproducts into adaptations.
          *   *Status:* Non-negotiable. If it can't distinguish them, it's not a classification framework.

      *   **Distinctions that Must Survive:**
          *   *Case:* Origin vs. Utility (exaptation). Good Design vs. Selected Design (could be lucky drift). Necessary vs. Contingent Byproduct. Constraint vs. Ignorance. Optimality vs. Adequacy. Function vs. History of Selection.
          *   *Requirement:* The framework must conceptually separate current utility from historical etiology. It must distinguish "works well" from "selected for working well."
          *   *Status:* Non-negotiable. These are the core conceptual distinctions of evolutionary biology.

      *   **Defaults and Evidence:**
          *   *Case:* Who proves what? Is the null "adaptation" or "not adaptation"? The prompt notes the adaptationist's burden of proof restated by opponents.
          *   *Requirement:* The framework must specify a null hypothesis and burden of proof. It must prevent unfalsifiable stories (Just-So stories).
          *   *Status:* This is tricky. The *existence* of a default is non-negotiable. The *choice* of default (Adaptation vs. Null) is likely a Local Commitment. I need to decide. The prompt asks me to "Decide, and say why."
          *   *Decision:* The non-negotiable part is that *some* null must exist to prevent unfalsifiability. The specific direction (Adaptationism as null vs. Drift as null) is a Local Commitment because it depends on the prior probability assigned to selection in the specific context. However, to prevent "accounts that cannot be wrong," the framework *must* require independent evidence for the selected category. I will frame the requirement as "Falsifiability of Attribution" (Non-negotiable) and the specific Null Hypothesis as a "Local Commitment."

      *   **Consistency with Results:**
          *   *Case:* Phylogenetic non-independence. Genetic architecture/variation limits. Population size effects on drift/selection balance. Optimality as a test, not a premise.
          *   *Requirement:* The framework must incorporate phylogenetic comparative methods (or equivalent). It must acknowledge genetic/developmental constraints. It must treat optimality models as tests, not assumptions.
          *   *Status:* Non-negotiable. These are established biological facts.

      *   **Two Further Demands:**
          *   *Case 1 (Byproduct Strictness):* Strict (Gould/Lewontin) vs. Loose (Dennett). Necessity relative to alternatives.
          *   *Requirement:* The framework must define the "space of alternatives" when claiming a byproduct is necessary.
          *   *Status:* Non-negotiable (clarity), but the *choice* of strict vs. loose is a Local Commitment. I will mandate that the framework *specifies* which it uses.
          *   *Case 2 (Inconsistencies/No-Go):* Are there conflicting requirements?
          *   *Requirement:* Identify the "Killer Constraint."
          *   *Decision:* The tension lies between "Representational Range" (distinguishing everything) and "Evidence" (proving history). We often cannot empirically distinguish drift from weak selection, or ancient exaptation from current adaptation.
          *   *Killer Constraint:* Empirical Decidability. If a framework posits categories that are empirically indistinguishable in principle, it fails.

  3.  **Refining the Structure and Tone:**
      *   Tone: Analytical, philosophical, rigorous, authoritative but neutral (setting the standard, not taking the side).
      *   Structure: Group by the sections requested. Use bolding for Requirements and Status.
      *   Addressing the "Decide" on Defaults: I will rule that the *existence* of a burden of proof is non-negotiable, but the *direction* is a Local Commitment, *however*, the requirement that the burden cannot be shifted indefinitely (preventing Just-So stories) is non-negotiable.
      *   Addressing the "No-Go": I need to be honest. Is there a contradiction? The contradiction is between the demand for historical precision and the erosion of evidence over time. I will identify "Empirical Decidability" as the veto.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the stage. This is a meta-evaluation standard.
      *   *Section 1: Representational Range.* Focus on the ability to categorize without collapse.
      *   *Section 2: Conceptual Distinctions.* Focus on Etiology vs. Effect.
      *   *Section 3: Defaults and Evidence.* This is the crux. I need to be firm. A framework that allows everything to be "possibly adaptation" without cost is useless. A framework that assumes everything is drift is also useless. The standard is *testability*.
      *   *Section 4: Biological Consistency.* Phylogeny, genetics, pop size.
      *   *Section 5: The Byproduct Definition & The No-Go.* Handle the Dennett vs. Gould tension. Identify the fatal flaw potential.
      *   *Conclusion:* Assess the three camps against *this* standard.

  5.  **Self-Correction/Review against Constraints:**
      *   *Did I separate case from requirement?* No, I must keep them attached. "Requirement X, motivated by Case Y."
