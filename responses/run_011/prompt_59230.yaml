  The "Loss" is intellectual/practical: They will see their preferred metric fail to capture a moral intuition they hold.
  I will add a material stake: A pot of 50 "Class Points" (towards participation grade or candy). If the final metric yields a "Perfect Equality" score, they get the pot. If not, they lose half. This forces them to try to make the metric work.

