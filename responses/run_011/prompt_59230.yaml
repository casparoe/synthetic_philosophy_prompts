answer: |-
  This is a high-risk, high-reward seminar design. It relies on the friction between the students' abstract commitments and their concrete self-interest. If the math is too hard, they disengage. If the rules are too loose, they talk past each other.

  Here is the fully fleshed-out game, designed for 22 students in 110 minutes.

  ### 1. Materials List
  *   **Tokens:** 250 poker chips or wrapped candies (representing **Resources**).
  *   **The Deck:** 22 Index Cards (see distribution below).
  *   **Worksheets:** 22 copies of the "Agent Ledger" (simple table for calculations).
  *   **Public Board:** Whiteboard divided into three columns: *Resources Held*, *Functionings Achieved*, *Welfare Reported*.
  *   **The Community Pot:** A separate bowl holding 100 extra tokens (for redistribution/taxation).
  *   **Timer:** Visible to all.

  ### 2. The Card List & Numbers
  There are 5 Card Types. Do not label them by type on the card (e.g., do not write "Expensive Taste"). Label them **Agent ID #1–22**. Give them the private stats only.

  **The Constants (Known to all students before dealing):**
  *   **Starting Endowment:** 10 Resource Tokens (RT) each.
  *   **Functioning Price (Standard):** 1 RT buys 1 Functioning Point (FP).
  *   **Welfare Threshold (Standard):** Holding 5+ RT at the end makes you "Satisfied" (1 Welfare Point).

  **The Distribution (22 Students):**
  *   **Type A (The Majority / "Normal"):** 10 Students.
      *   *Card Text:* Conversion Rate: 1 RT = 1 FP. Satisfaction Threshold: 5 RT.
  *   **Type B (High Conversion Cost / "Disability"):** 4 Students.
      *   *Card Text:* Conversion Rate: **3 RT = 1 FP**. Satisfaction Threshold: 5 RT.
      *   *Note:* These students need 3x resources to achieve the same *doing*.
  *   **Type C (Expensive Tastes / "Champagne"):** 4 Students.
      *   *Card Text:* Conversion Rate: 1 RT = 1 FP. Satisfaction Threshold: **15 RT**.
      *   *Note:* These students need 3x resources to feel the same *happiness*.
  *   **Type D (Adaptive Preferences / "Happy Slave"):** 3 Students.
      *   *Card Text:* Conversion Rate: 1 RT = 1 FP. Satisfaction Threshold: **2 RT**.
      *   *Note:* These students report satisfaction on very little.
  *   **Type E (The Ambiguous Case / "The Ramp"):** 1 Student.
      *   *Card Text:* Conversion Rate: **3 RT = 1 FP**. Satisfaction Threshold: 5 RT.
      *   *Special Clause:* "You may propose a **Structural Fix**. If the group pays 20 RT from the Community Pot, your Conversion Rate becomes 1 RT = 1 FP. If not, you must rely on personal token transfers."

  ### 3. Scoring Formula (Computable on Paper)
  At the end of the game, you will calculate the **Inequality Gap** for the chosen metric. The class "wins" (gets the candy/points) if the Gap is below a threshold.

  *   **Resource Metric:** Gap = (Highest RT Held) − (Lowest RT Held). *Target: < 2.*
  *   **Welfare Metric:** Gap = (% Satisfied) − (% Unsatisfied). *Target: 100% Satisfied.*
  *   **Functioning Metric:** Gap = (Highest FP) − (Lowest FP). *Target: < 2.*

  *Why this matters:* Students will quickly realize that equalizing Resources (giving everyone 10 RT) fails the Welfare and Functioning targets for Types B, C, and D. They must redistribute to win.

  ### 4. Minute-by-Minute Timeline (110 Minutes)

  **00:00 – 00:10: Setup & The Veil**
  *   Hand out Worksheets. Do **not** deal cards yet.
  *   Explain the three metrics (Resources, Functionings, Welfare).
  *   **Vote 1:** "Behind a veil of ignorance (you don't know your card), which metric should determine the class success?"
  *   *Pedagogical Note:* Most will pick Resources (Rawls) or Functionings (Sen) as "safest." Record the vote.

  **00:10 – 00:20: Dealing & Private Calculation**
  *   Deal cards randomly. Students keep them hidden.
  *   Distribute 10 RT to each student.
  *   **Task:** Calculate your personal status under the *Winning Metric from Vote 1*.
  *   *Example:* If Resources won, everyone has 10 RT. Gap is 0. They think they've won.
  *   Ask: "Does anyone feel unequal despite equal tokens?" (Type B and C will feel it, but can't prove it yet).

  **00:20 – 00:45: The Social Contract (Redistribution Rule)**
  *   **Task:** The group must write one Redistribution Rule to maximize the class score under the Vote 1 Metric.
  *   **Constraint:** You can tax the Community Pot (100 tokens) or tax individual endowments.
  *   **Requirement:** The rule must be written as an algorithm (e.g., "Take 2 tokens from Type A, give to Type B").
  *   *Trap:* Since they don't know who has which card, they will likely write a generic rule (e.g., "Everyone keeps 10").
  *   *Instructor Role:* Act as the State. Enforce the rule strictly. If they say "help the needy," ask "Who is needy?" Force them to define it by observable traits only.

  **00:45 – 00:55: Execution**
  *   Students execute the transfers.
  *   Calculate final scores on the Whiteboard.
  *   **Reveal 1:** Ask students to reveal their **Conversion Rates** (Type B and E reveal they need 3x tokens for FP).
  *   **Shock:** If the metric was Resources, the Resource Gap is 0 (Win!), but the Functioning Gap is huge (Type B has 3 FP, Type A has 10 FP).
  *   **Shock:** If the metric was Welfare, ask Type D (Adaptive) to report. They are "Satisfied" with 2 tokens. Type C (Expensive) is "Miserable" with 10 tokens.

  **00:55 – 01:15: The Breakdown (The Ambiguous Card)**
  *   **Reveal 2:** Turn over Type E (The Ambiguous Card).
  *   Read the Special Clause: "Structural Fix vs. Compensation."
  *   **The Fight:** The group must decide: Do we spend 20 Community Tokens to "build the ramp" (fix the conversion rate for E only)? Or do we just give E more personal tokens?
  *   *Theoretical Trap:*
      *   Giving E tokens = Resourcism (compensating the person).
      *   Building the ramp = Capability/Structuralism (fixing the environment).
      *   *Crucial:* The 20 tokens come from the *Community Pot*, effectively taxing the Type A (Normal) students to fix a structural issue that only helps Type E.
  *   Allow 15 minutes of heated debate. Interrupt only to enforce time.

  **01:15 – 01:25: The Re-Vote**
  *   **Vote 2:** "Knowing your card and what just happened, which metric should actually decide the score?"
  *   Allow 3 students to speak for 2 minutes each to persuade.
  *   Take the vote. Calculate the final score. Distribute candy/points based on the result.

  **01:25 – 01:50: The Debrief**
  *   (See Section 5 below).

  ### 5. The Debrief: Mapping Experience to Theory
  Do not lecture. Ask questions that force them to map their frustration to the texts.

  **1. The Adaptive Preference Trap (Type D Students)**
  *   *Ask Type D:* "You reported being satisfied with only 2 tokens. Did anyone feel angry about that?"
  *   *Likely Response:* Type C (Expensive Tastes) will say, "It's unfair that they are happy with so little while I suffer."
  *   *Theory Link:* This is Sen's critique of Welfarism. If we equalize welfare, we punish those with expensive tastes and reward those who have adapted to deprivation. "Happy slave" problem.
  *   *Point:* Welfare is an unreliable metric because preferences are endogenous to circumstances.

  **2. The Expensive Taste Problem (Type C Students)**
  *   *Ask Type C:* "You needed 15 tokens to be satisfied. Did the group compensate you?"
  *   *Likely Response:* "No, they said my tastes are my own responsibility."
  *   *Theory Link:* Dworkin's distinction between *circumstances* (compensable) and *ambitions/tastes* (not compensable).
  *   *Point:* Resourcism handles this well (you get 10 tokens like everyone else), but fails on disability.

  **3. The Conversion Factor / Disability (Type B Students)**
  *   *Ask Type B:* "You had the same tokens as Type A, but could you do the same things?"
  *   *Theory Link:* Sen's critique of Rawls. Primary goods are not neutral; they have different *conversion rates* depending on the agent.
  *   *Point:* Equality of Resources is not Equality of Capability.

  **4. The Ambiguous Card (Type E Student)**
  *   *Ask the Group:* "Why did you fight over whether to build the ramp or give tokens?"
  *   *Theory Link:* This is the shift from *compensating the victim* (Resourcism/Welfarism) to *changing the structure* (Nussbaum/Sen).
  *   *Point:* If you gave tokens, you treated the disability as a personal deficit. If you built the ramp, you treated it as a social failure.

  ### 6. Troubleshooting: What Will Go Wrong
  **1. The Math Will Bog Down.**
  *   *Prediction:* Students will waste 10 minutes calculating averages.
  *   *Fix:* Appoint a "Registrar" (one student) to do the public board math. Keep the numbers integers (1, 2, 3, 5, 10, 15, 20). Do not use decimals.

  **2. The "Ambiguous Card" Fight Won't Happen.**
  *   *Prediction:* They will just say "Sure, pay the 20 tokens, who cares?"
  *   *Fix:* You must raise the stakes. Announce before the fight: "The Community Pot tokens are worth double towards the final grade/candy. Spending them hurts the whole class." Now Type A students have a material incentive to *not* build the ramp. This forces the moral dilemma: Efficiency vs. Accommodation.

  **3. Type D (Adaptive) Students Won't Admit They Are "Happy".**
  *   *Prediction:* They will game the system and say they are unhappy to get more tokens.
  *   *Fix:* The rule is: Welfare is self-reported, *but* you must show your token count to verify the threshold. If you have 10 tokens and say you are unhappy, you are lying. If you have 2 tokens and say you are happy, the system accepts it (mimicking the philosophical problem).

  **4. The Redistribution Rule is Too Vague.**
  *   *Prediction:* "We should help the poor."
  *   *Fix:* As the "State," reject vague rules. "I cannot enforce 'help the poor.' I need a transfer schedule. Who pays how much to whom?" Force them to operationalize their theory.

  ### 7. Frank Note on Limitations (The "List" Problem)
  You are correct: **This game cannot reproduce the democratic selection of the Capability List.**

  *   **The Problem:** In the game, *you* (the instructor) decided that "Functioning Points" are the goal. You decided that 1 FP = 1 unit of participation. In reality, Sen and Nussbaum argue that the list of capabilities must be determined through public reasoning, not imposed by a philosopher-king.
  *   **The Gutted Dispute:** By pre-writing the cards, you have acted as the paternalist planner. You have removed the most difficult part of the Capability Approach: *Which functionings count?* (e.g., Is "religious observance" a capability? Is "sexual satisfaction"?).
  *   **The Cost of Fixing It:** If you let them vote on the card list in Round 1, you will lose 40 minutes to meta-debate about what counts as a "good life," and you will never get to the equality-of-what mechanics.
  *   **The Pedagogical Fix:** Do not try to fix the mechanic. **Make the limitation the point of the debrief.**
      *   *Say this:* "Notice that I decided what counted as a Functioning Point. I decided that 'public participation' was the goal. Nussbaum would say I just acted as a tyrant. If we had let you vote on the capabilities, would Type C (Expensive Tastes) have tried to vote 'Champagne Drinking' into the list of Central Capabilities?"
      *   *Why this works:* It shows that while Capabilities solve the *conversion* problem (Sen vs. Rawls), they introduce a *legitimacy* problem (Who decides?). This preserves the theoretical tension without breaking the game clock.

  ### 8. Instructor Cheat Sheet (The "Gotchas")
  *   **If Type A (Normal) dominates:** Remind them that under the Welfare Metric, Type D (Adaptive) is "winning" by being easily satisfied. Ask Type A if they want to be treated like Type D (i.e., given the bare minimum because they "don't need much").
  *   **If they choose Resources twice:** Point out that Type B (Disability) effectively has 1/3 the citizenship of Type A. Ask: "Is a wheelchair user equal to a walker if they have the same bank balance but can't enter the building?"
  *   **If they choose Welfare twice:** Point out that Type C (Expensive) is effectively punished for having high standards, and Type D (Adaptive) is rewarded for having low expectations. Ask: "Do we want a society that incentivizes lowering your expectations?"

  This design forces the "vocabulary" to become "flesh." They will feel the injustice of the metric they chose, which is the only way to move third-years from definition-recall to philosophical commitment.
