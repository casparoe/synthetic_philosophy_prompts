answer: |-
  ### Brainstorming: Candidate Rules and Stress Tests

  To find the logic of your committee, I need to treat your six past verdicts as data points. We are looking for the implicit algorithm behind the explicit Du Boisian charter ("All art is propaganda... what counts as propaganda done right"). "Propaganda done right" is the variable. Here are the three strongest candidate rules generated by your history, tested against the six cases.

  **Candidate Rule 1: The Strategic Utility Test**
  *Definition:* Art is accepted if its net political effect advances the community's organizing goals; it is rejected if it hinders them, regardless of artistic merit or factual truth.
  *   **Fits:** Case 1 (Union tool), Case 3 (Rejected: hindered by "shame" frame), Case 6 (Rejected: hindered organizers).
  *   **Strains:** Case 4 (Jazz Oratorio). It had "no message, no argument." Under strict utility, this should be neutral or rejected. You took it. *Stretch:* You counted "beauty" as utility (proof of humanity/capacity), which is a very specific, high-brow Du Boisian definition of propaganda.
  *   **Strains:** Case 5 (Satire). It was misread externally as "charming poverty." That doesn't help organizing, but you took it. *Stretch:* You decided internal joy outweighed external patronization, whereas in Case 6, external stigma outweighed internal catharsis.

  **Candidate Rule 2: The Representational Dignity Test**
  *Definition:* Art is accepted if it depicts the community without reinforcing damaging stereotypes for external consumption; it is rejected if it provides ammunition for prejudice, even if the depiction is factually true.
  *   **Fits:** Case 2 (Rejected: lies create false dignity, but undermines historical truth), Case 3 (Rejected: "shame" frame), Case 6 (Rejected: truth used as stigma).
  *   **Strains:** Case 1 (Tenant Verse). It was "crude," "uneven," "lists of names." Not "dignified" in an aesthetic sense. *Stretch:* You prioritized *accuracy* over *polish* here because it was internal.
  *   **Strains:** Case 5 (Satire). Satire often relies on tropes. If outsiders read it as "charming," they are still exoticizing. *Stretch:* "Charming" is passive; "Violent/Addicted" (Case 6) is active danger. The rule is actually about *harmful* stereotypes, not just reductive ones.

  **Candidate Rule 3: The Framing Control Test**
  *Definition:* Art is accepted if the community (or artist acting as community member) controls the context of reception; it is rejected if external institutions dictate the frame.
  *   **Fits:** Case 1 (Union printed), Case 5 (Self-published), Case 4 (Local composer/concert hall—maybe?).
  *   **Strains:** Case 3 (Rejected). Outside crew, network sold it. Fits perfectly.
  *   **Strains:** Case 6 (Rejected). Local writer, but reviews/outsiders quoted worst passages. The *reception* escaped control.
  *   **Strains:** Case 2 (Rejected). Local readers loved it, but the *history* was out of control (invented).
  *   **Verdict:** This rule is strong but incomplete. It explains *why* Case 6 was rejected (loss of framing control) but doesn't explain why Case 4 was taken (concert hall is an external institution usually).

  ***

  ### The Decision Analysis

  Here is the breakdown of your current dilemma based on the forensic analysis of your own track record.

  **(a) The Nearest Precedent**
  **Case 6 (The Memoir Adaptation)** is the nearest precedent.
  *   **The Working Detail:** The divergence between *internal truth* and *external weaponization*. In Case 6, the work was "unflinching," "nothing invented," and "praised by our readers." It failed solely because the *external reception* (reviews quoting worst passages) actively harmed the *internal political work* (organizers' coalition asked you not to feature it).
  *   **Why not Case 5?** Case 5 was misread externally, but the misreading ("charming picture") was patronizing, not criminalizing. The current novel is being excerpted by police unions and columnists to discuss "violence" and "corruption." That aligns with Case 6's stigma, not Case 5's exoticism.
  *   **Why not Case 1?** Case 1 was accurate like this novel, but it was *contained*. It was printed by the union for the union. The current novel is with a "big house" with a "general readership" campaign. The distribution mechanism matches Case 3 (Network/Outside) and Case 6 (Public Reviews), not Case 1.

  **(b) The Rules That Fit (and Where They Strain)**
  1.  **The "Net Political Harm" Rule:** *Take art unless its external reception actively damages ongoing community organizing.*
      *   **Fit:** Explains Case 3, 6, and Current Dilemma (Reject). Explains Case 1, 4, 5 (Take).
      *   **Strain:** It requires you to predict the future or monitor reviews in real-time. It strains on Case 4 (Oratorio)—how does beauty prevent harm? You have to assume "beauty" is inherently protective, which is an aesthetic gamble.
  2.  **The "Context of Reception" Rule:** *Truth is permissible only if the community controls the frame in which that truth is received.*
      *   **Fit:** Explains Case 1 (Union frame), Case 5 (Self-published frame). Explains rejection of Case 3 (Network frame) and Case 6 (Media frame).
      *   **Strain:** It strains on Case 2. The community *loved* the false history. You rejected it anyway. This means Community Control isn't enough; the *content* must also be historically rigorous.
  3.  **The "Du Boisian Uplift" Rule:** *Art must prove worthiness to the outside world while telling the truth to the inside.*
      *   **Fit:** Explains rejection of Case 2 (Lies don't prove worth) and Case 6 (Truth used to deny worth).
      *   **Strain:** It strains heavily on Case 5. A satire read as "charming poverty" does not prove worthiness; it reinforces a petting-zoo dynamic. You took it anyway, suggesting you value *internal joy* over *external proof* when the external damage is low.

  **(c) Divergence on the Current Novel**
  *   **Rule 1 (Net Political Harm):** Tells you to **REJECT**. The organizers' coalition has already written to ask you not to feature it. The police union is already excerpting it. The harm is not theoretical; it is active.
  *   **Rule 2 (Context of Reception):** Tells you to **REJECT**. The "big house" jacket copy and ad campaign are "aimed squarely at a general readership." The author's local readings cannot override the publisher's national marketing frame. You do not control the context.
  *   **Rule 3 (Du Boisian Uplift):** **DIVERGES.**
      *   *Reading A (Strict Du Bois):* **REJECT.** If the art fuels the machinery of oppression (police union), it is propaganda done *wrong*.
      *   *Reading B (Younger Renaissance/Hughes):* **TAKE.** The artist is "doing free readings at the branch library and the union hall." She is reclaiming the frame. To reject her is to police the Black artist's right to tell the ugly truth.

  **(d) My Best Guess at Your Verdict**
  **Verdict: REJECT.**

  **Reasoning for the Room:**
  "Colleagues, our charter says art is propaganda, but the operative phrase is 'done right.' We have established in Cases 3 and 6 that factual truth is not a sufficient defense if the *deployment* of that truth undermines the safety or political leverage of the neighborhood. In Case 5, we accepted external misreading because it was benign ('charming'). In this current case, the external reading is weaponized ('violence,' 'corruption') by hostile actors (police union).
  We are not censoring the author; she is published and doing her readings. We are curating *our* series. To program this now, while organizers are actively negotiating with the city and police, turns our center into a platform for the opposition's narrative. We honor the author's truth by acknowledging it, but we honor our charter by refusing to amplify it when the amplification hurts the people the art is about. We follow Case 6."

  **(e) If the Record Doesn't Settle It (The Charter Amendment)**
  The record *almost* settles it (leaning Reject via Case 6), but the author's local engagement (Case 1/5) creates noise. If you want to end this debate forever, you must choose a tie-break rule to write into the charter:

  *   **Option A (The Organizer's Veto):** "If the local organizing coalition formally objects to a work's potential political impact, the committee will not program it, regardless of artistic merit." (Prioritizes Politics over Art).
  *   **Option B (The Artist's Sovereignty):** "If the artist is from the community and asserts the work serves the community, the committee will program it, regardless of external reception." (Prioritizes Art/Truth over Politics).
  *   **Option C (The Framing Test):** "We program works where the community controls the primary marketing narrative. If a commercial publisher controls the narrative, we require a co-sponsored community framing event to counterbalance it." (Prioritizes Context).

  ***

  ### The Further Submission (The Tie-Breaker)

  To tell your rules apart for good, you need a case where Internal Truth and External Stigma are identical, but the *Source of Control* changes.

  **The Submission:**
  A photo essay by a local high school student, developed in your center's darkroom. It depicts the aftermath of a recent local fire. It shows grieving families, looted stores, and police standing by. It is raw, uncurated, and deeply moving.
  *   **Scenario X:** The student wants to submit it to a national photography contest that features "Urban Crisis."
  *   **Scenario Y:** The student wants to display it only in the center's hallway for a week.

  **Predictions:**
  *   **The "Net Political Harm" Rule:** Rejects X (National contest = external weaponization). Accepts Y (Internal = catharsis/utility).
  *   **The "Artist's Sovereignty" Rule:** Accepts both (It is her truth, her choice).
  *   **The "Du Boisian Uplift" Rule:** Rejects X (Shows victimhood). Accepts Y (Shows resilience/community processing).

  **The Philosophical Bind (Du Bois vs. The New Negro)**
  You asked me to say if the Du Boisian standard itself is making this undecidable. **It is.**

  Du Bois's 1926 argument ("Criteria of Negro Art") was that art *must* be propaganda to combat the lies of a racist society. But he assumed the propaganda would be *dignified*. He did not fully account for the tension when the *truth* is undignified (addiction, violence, corruption).
  *   **Du Bois's Position:** If the truth hurts the cause of racial equality in the short term, you must wait or frame it differently. (Supports Reject).
  *   **Langston Hughes's Position ("The Negro Artist and the Racial Mountain"):** The artist must be free to depict the "low-down folks" as they are, without fear of what white people think. To censor the ugly truth to please the "Talented Tenth" or white allies is to betray the art. (Supports Take).

  Your committee is stuck because your charter cites Du Bois, but your community contains Hughesians.
  *   **The Tie-Break:** You cannot solve this aesthetically. You must solve it **politically**.
  *   **The Rule:** "When Truth and Strategy conflict, Strategy wins *only* if the threat is immediate and physical (e.g., police action, legislation). If the threat is merely reputational, Truth wins."
  *   **Application:** In Case 6 and the Current Novel, the threat is reputational *and* political (organizers objecting). So Strategy wins (Reject). In Case 5, the threat was merely reputational (patronizing). So Truth won (Take).

  **Final Advice:** Stick with Case 6. Reject the novel. Not because it isn't true, and not because it isn't art. But because your charter defines art as a *tool*, and right now, this tool is cutting the hands of the people trying to use it. You can honor the author without programming her. Host the reading, but don't put the book in the catalog. That is the only way to satisfy the Du Boisian demand for utility without silencing the Hughesian demand for voice.
