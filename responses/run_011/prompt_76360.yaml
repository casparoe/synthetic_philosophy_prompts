      *   *What are they overlooking?*
          *   **The Normative Source:** The DBA is often seen as a *pragmatic* justification for a *logical/epistemic* norm. Both are treating it as if the monetary loss *constitutes* the irrationality. Most modern Bayesians (e.g., Joyce, Leitgeb) argue the money is just a metaphor for accuracy or logical consistency. The real defect is misrepresenting the world, not losing cash.
          *   **Synchronic vs. Diachronic:** The DBA is often criticized for being diachronic (requiring a sequence of choices) while probabilism is a synchronic constraint.
