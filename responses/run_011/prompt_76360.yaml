      *   *Evaluation:* This is a classic objection to the DBA (often associated with Christensen or Maher). It highlights the gap between *synchronic* incoherence and *diachronic* exploitation. If the agent restricts their decision-making procedure (refusing combinations), they avoid the sure loss *in practice*, even if their degrees of belief violate the axioms.
