answer: |-
  **Essay Question**

  The specification of an idealized deliberative procedure faces a dilemma: if the ideal agent is fully informed, including about the procedure's output, the procedure may lack a determinate fixed point; if information is restricted to avoid this, the restriction itself seems to rely on prior normative judgments. Assess whether this dilemma undermines the claim that indirect normativity avoids direct normative presuppositions. In your answer, consider appeals to convergence, the requirement for determinate output, and the justificatory role of the procedure.

  ***

  **Model Answer**

  Indirect normativity seeks to ground moral truth in the output of an idealized deliberative procedure rather than in substantive values. The self-reference objection threatens this project by exposing a structural instability. If the ideal agent is fully informed, they know the procedure's verdict. Since knowledge can influence desire and choice, the verdict might shift based on the agent's knowledge of it, creating a loop with no stable solution. To assess whether this is fatal, we must examine the available repairs and their philosophical costs.

  The most obvious repair is to restrict the information set. The ideal agent knows all non-normative facts except those concerning the procedure's own verdict. This breaks the loop and secures a determinate output. However, this invites the deeper objection: deciding which facts to exclude is itself a normative decision. One must judge that knowledge of the verdict is 'distorting' or 'irrelevant' in a way that other facts are not. This suggests that direct normative commitments are required to specify the procedure, undermining the claim that the procedure itself generates all normative content. The view thus collapses into a hybrid: direct normativity fixes the procedure, which then fixes specific duties. If the aim of indirect normativity was to eliminate direct normative presuppositions, this repair fails.

  A second response appeals to stability or convergence. Even if multiple fixed points exist under different specifications, perhaps all reasonable restrictions converge on the same core moral truths. If the output is stable across variations, the self-reference is practically inert. This defends the view's practical utility. However, this faces the converse pressure. If the procedure only works because it converges on truths we antecedently recognize, the justificatory work is being done by our antecedent commitments, not the procedure. The procedure becomes a heuristic for discovering independent truths rather than constituting them. This sacrifices the distinctive claim of indirect normativity: that the procedure *makes* the act right, rather than tracking rightness fixed elsewhere. If convergence relies on our prior intuitions to select the 'reasonable' specifications, the procedure is epistemically useful but ontologically redundant.

  A third response denies the need for a unique determinate output. The procedure need only narrow the field of permissible actions sufficiently for practical guidance. Indeterminacy at the margins does not invalidate the core. Yet, this risks changing the subject. If the theory claims to define moral truth, widespread indeterminacy suggests it fails to define truth, offering only advice. Furthermore, one might argue the self-reference is benign. Access to the output cannot alter what the idealized agent would endorse because the idealization includes full vividness and coherence that screens out performative contradictions. Knowing the verdict is just another fact; a fully coherent agent integrates it without destabilizing their values. But this assumes the psychology of the ideal agent is robust in a way that begs the question against the objection. It assumes stability rather than proving it.

  Ultimately, the dilemma is not fatal but transformative. It shows indirect normativity cannot be a pure reduction of the normative to the non-normative. The specification of the procedure inevitably relies on normative intuitions about what counts as 'relevant' information. The view survives not by eliminating direct normativity, but by relocating it to the meta-level of procedure specification. Whether this is a concession depends on whether the view promised a pure reduction or merely a structural explanation of normative authority. If the latter, the view stands, but humbled. It must admit that the procedure does not generate normativity ex nihilo; it structures normative commitments that are already present in the specification. The objection succeeds in showing that indirect normativity is not a escape from direct normativity, but a reorganization of it.

  ***

  **Marking Scheme (25 Marks)**

  **First Class (20–25 marks)**
  *   **Analysis:** Clearly articulates the tension between the self-reference problem and the information-restriction repair.
  *   **Critical Engagement:** Explicitly addresses the 'converse pressure': explains why appealing to convergence risks making the procedure redundant (losing its constitutive justificatory role).
  *   **Evaluation:** Offers a nuanced conclusion on whether the view is fatal or merely transformed (e.g., relocating normativity to the meta-level).
  *   **Distinction:** Differentiates between the procedure's practical utility and its ontological claims.

  **Upper Second (15–19 marks)**
  *   **Analysis:** Identifies the self-reference problem and the information-restriction repair accurately.
  *   **Critical Engagement:** Discusses convergence or determinacy but treats them as straightforward solutions without fully exploring the cost to the view's justificatory claims.
  *   **Evaluation:** Concludes the view is viable (or not) but misses the nuance regarding the relocation of normative presuppositions.

  **Lower Second / Third (10–14 marks)**
  *   **Analysis:** Describes the objection but conflates it with general objections to idealization (e.g., impossibility of full information).
  *   **Critical Engagement:** Lists the responses (restriction, convergence) without evaluating the philosophical trade-offs.
  *   **Evaluation:** Fails to address the specific crux of whether direct normativity re-enters at the specification stage.

  **Fail (0–9 marks)**
  *   **Analysis:** Misunderstands the concept of indirect normativity or the specific self-reference dilemma.
  *   **Critical Engagement:** Irrelevant material or standard definitions without application to the prompt.

  **Characteristic Mistakes**
  1.  **Treating the objection as computational:** Claiming the problem is merely that agents cannot calculate the output. *Why it costs marks:* The objection is conceptual (fixed-point instability), not epistemic (difficulty of calculation).
  2.  **Ignoring the converse pressure:** Arguing that convergence solves the problem without addressing whether this makes the procedure redundant. *Why it costs marks:* It misses the core issue of whether the procedure *constitutes* value or merely *tracks* it.
  3.  **Assuming uniqueness:** Asserting without argument that a moral theory must yield a unique output for every case. *Why it costs marks:* Fails to engage with the prompt's suggestion that indeterminacy might be acceptable or damaging depending on the view's aims.

  ***

  **Epistemic Note**

  I am moderately confident in the philosophical claims made in the model answer, specifically regarding the structure of the self-reference objection and the tension between procedural independence and normative specification. These are standard moves in meta-ethical debates concerning ideal observer theories and constructivism.

  I am least sure about the claim that the information-restriction repair *necessarily* concedes too much (i.e., that specification is inherently normative rather than merely conceptual). Some defenders argue that excluding verdict-knowledge is a conceptual requirement for deliberation, not a normative value judgment. Settling this would require a deeper analysis of the distinction between conceptual clarification and normative commitment, specifically whether defining the 'conditions of deliberation' counts as making a normative claim.
