answer: |-
  # The Shoebox Decision Tree
  **Seminar: Analogy & Concepts | Microdomain: The Key Box**

  **START HERE:** You accept that the extension of 'key' slides. (The Yale key, the bent key, the card, the wifi string, and the bottle opener are all in the box, but not always for the same reason).

  ---

  ### NODE 1: The Wifi String
  Look at the printed paper with the wifi password. Look at the heavy Yale key.
  **Question:** If you had to explain to a robot why *both* are in the 'key' box, would you say they share a **hidden causal role** (granting access to a system) or would you say the word 'key' is being used in **two totally different ways** that just happen to share a name?

  *   **A. Two different ways / Just a name.** (The wifi key is a metaphor; the Yale key is the real thing). → *Go to Node 2.*
  *   **B. Hidden causal role.** (They both unlock a system; the physical shape is irrelevant). → *Go to Node 3.*

  ---

  ### NODE 2: The Bent Key vs. The Blank
  *(For those who think the Wifi string is a metaphor)*
  Look at the **bent Yale key** (looks right, works poorly) and the **blank cut to profile** (looks right, doesn't work yet).
  **Question:** If you must throw one out of the box to keep the category "pure," which one goes in the trash?

  *   **A. Throw out the Blank.** (A key must actually turn the lock; function trumps perfect shape). → *Leaf: Theory-Theory (with perceptual noise).*
  *   **B. Throw out the Bent Key.** (A key must look like a key; the blank is a 'true' key waiting to happen, the bent one is broken). → *Go to Node 3.*

  ---

  ### NODE 3: The Task Switch
  *(For everyone remaining)*
  Over the last eight weeks, the seminar task switched from "Open this door" to "Sort the box by material."
  **Question:** When that task switched, did the **concept** of 'key' in your head **morph** into something new, or did you keep the **same concept** and just pay attention to different features?

  *   **A. Same concept, different features.** (The mental file 'KEY' stayed stable; I just filtered it differently). → *Go to Node 4.*
  *   **B. The concept morphed.** (The meaning of 'key' itself stretched or slipped to fit the new job). → *Leaf: Copycat / Slippage.*
  *   **C. There is no concept.** (I don't have a file 'KEY'; I just have a habit of putting these things together for specific tasks). → *Leaf: Eliminativism / Pragmatism.*

  ---

  ### NODE 4: The Primitive
  *(For those with a Stable Concept)*
  **Question:** When you say the concept stayed the same, is that because the concept is a **simple primitive** (a basic building block that doesn't have parts) or because it is an **average image** of the keys you've seen before?

  *   **A. Simple primitive.** (The concept 'KEY' has no internal structure; it just points to things). → *Leaf: Atomism.*
  *   **B. Average image.** (The concept is a fuzzy cluster based on the Yale key and the hotel card). → *Leaf: Prototypes / Exemplars.*

  ---

  ## The Logical Space Map

  Below is the map of where the leaves land, including the "dead zones" of the logical space that this tree avoids.

  ### The Occupied Leaves (Theories of Concepts)

  1.  **Theory-Theory (Node 2A):** You believe concepts are defined by hidden causal explanations. The wifi key is a real key (Node 1B) because it performs the causal role of "granting access." If you landed here via Node 2A, you prioritize function over form even for physical keys.
  2.  **Copycat / Slippage (Node 3B):** You believe cognition *is* analogy. The sliding isn't a bug; it's the mechanism. The concept of 'key' is fluid by design, allowing the wifi string and the brass opener to slip into the category via structural alignment.
  3.  **Eliminativism / Pragmatism (Node 3C):** You believe the shoebox is evidence that there is no unified psychological natural kind here. There is no "concept" of key, only ad-hoc categorizations driven by immediate goals.
  4.  **Atomism (Node 4A):** You believe the concept is a primitive symbol. It doesn't change (Node 3A). The "sliding" is just the context selecting different referents for the same atomic symbol.
  5.  **Prototypes / Exemplars (Node 4B):** You believe concepts are statistical summaries (Prototypes) or memories of specific instances (Exemplars). The category slides because the boundaries are fuzzy, centered around the "best" examples (like the Yale key).

  ### The Unoccupied / Incoherent Regions

  *   **Classical Definitionism:** (Ruled out by the Start). This view holds that concepts have necessary and sufficient conditions (e.g., "must be metal," "must turn a pin tumbler"). Since you started by accepting the sliding (the wifi string is in the box), you have already rejected the Classical view. There is no path back to it.
  *   **Atomism + Morphing:** (Incoherent). You cannot claim the concept is a structureless primitive (Atomism) *and* claim that the concept itself morphs (Copycat). If it morphs, it has structure to morph *from*. Node 4 prevents this combination.
  *   **Theory-Theory + Perceptual Priority:** (Unattractive/Unvisited). It is theoretically possible to land on Node 1B (Wifi is a key because of causal role) but then Node 2B (Throw out the Bent Key because it looks wrong). This implies you care about causal theory for abstract items but perceptual form for physical items. While psychologically possible, no major theory of concepts occupies this specific hybrid space consistently.

  ### The Indistinguishable Leaves

  **Prototypes vs. Exemplars (Node 4B):**
  This tree cannot pull these two apart. Both views predict that the concept is stable but fuzzy (Node 3A) and based on similarity to stored information (Node 4B).
  *   *Prototype:* You compare new items to an averaged "ideal key."
  *   *Exemplar:* You compare new items to memories of specific keys you've held.
  *   *Why they merge here:* In the microdomain of a shoebox, behavioral outputs are identical. To distinguish them, you would need reaction-time experiments or memory-load tasks, not just introspection on the box contents.

  **Theory-Theory (Node 2A) vs. Atomism (Node 4A):**
  There is a slight bleed here. Both views argue for a stable underlying concept (Node 3A).
  *   *Distinction:* Atomism says the concept has *no* internal structure (it's just a label). Theory-Theory says it has *causal* structure.
  *   *Risk:* A student might answer Node 4A ("It's a primitive") when they actually mean "It's a causal theory I can't explain." The tree relies on the student's intuition about whether their concept has "parts."

  ---

  ### Instructor Note: How to use this handout
  Do not ask students to defend their leaf immediately. Have them trace the path silently. Once they have a leaf, ask them to look at the **Unoccupied Regions**. Ask: *"Why does it feel wrong to say the Wifi key is a metaphor (Node 1A) but the Bent Key is the real thing (Node 2A)?"* This forces them to confront the coherence of their own conceptual commitments.
