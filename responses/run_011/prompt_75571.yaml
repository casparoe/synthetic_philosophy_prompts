      *   **User:** A literary fiction writer. They know their craft (POV, scene/summary, free indirect style, etc.) but feel lost in the philosophical/political debate surrounding state apologies for historical wrongs.
      *   **Task:** Translate four specific philosophical/legal arguments about state apologies into the language of literary craft.
      *   **Constraints:**
          *   Go claim by claim (Speech-act, Standing, Addressee, Lawyers').
          *   For each: Give the craft counterpart, what had to be bent, and what has *no* counterpart.
          *   Make the "residue" (what doesn't fit) the main event, not a footnote.
          *   Don't flatter: Address whether craft converts justice questions into audience satisfaction questions (does craft demand resolution?).
          *   Final Verdict: Is the leftover a hole in the framework or evidence of fuzziness in the argument? Address the user's specific structural worry (writing the apology as a climax for an unrepairable wrong).

  2.  **Deconstruct the Four Claims & Translate to Craft:**

      *   **Claim 1: Speech-Act (Uptake, Theatre vs. Action).**
          *   *Philosophy:* An apology needs a speaker, a listener, and acceptance ("uptake"). Without action, it's performative empty calories.
          *   *Craft:* This is *Dialogue* and *Subtext* meeting *Plot*. Specifically, the "Obligatory Scene." The speech is the scene, but the "uptake" is the reaction shot. The "action attached" is the *Denouement* or *Aftermath*.
          *   *Bend:* Craft treats "uptake" as emotional resonance or plot movement. Philosophy treats it as moral validity.
          *   *No Counterpart:* *Efficacy.* Craft cares if the scene *works* (moves the reader/character). Philosophy cares if the act *succeeds* (changes the moral reality). A scene can be beautifully written (good craft) and morally bankrupt (failed apology).

      *   **Claim 2: Standing (Corporate Agency vs. Individual Mortality).**
          *   *Philosophy:* Can the present represent the past? Is the State a character that persists?
          *   *Craft:* *POV* and *Character Continuity*. The State is the *Protagonist* (or Antagonist) that outlives individual characters. The narrator is the *Avatar*.
          *   *Bend:* In fiction, we accept the "State" as a character easily (e.g., "The Ministry decided"). In reality, this is a metaphysical/legal fiction.
          *   *No Counterpart:* *Moral Inheritance.* Craft allows a son to avenge a father without question. Philosophy questions if the son *can* owe the debt. Craft assumes continuity of identity; philosophy interrogates it.

      *   **Claim 3: Addressee (The Dead vs. The Descendants).**
          *   *Philosophy:* Who receives the apology? The dead can't hear. The living weren't hurt.
          *   *Craft:* *Implied Reader* and *Target Audience*. In a scene, the "addressee" is whoever is in the room. In the book, it's the reader.
          *   *Bend:* Craft collapses time. A monologue can address the dead. Philosophy sees a barrier.
          *   *No Counterpart:* *Ontological Recipient.* Craft doesn't care if the recipient is dead if the *speaker* feels changed. Philosophy cares about the transaction.

      *   **Claim 4: Lawyers (Regret vs. Liability).**
          *   *Philosophy:* "Regret" creates distance; "Apology" admits guilt. Hedging kills the act.
          *   *Craft:* *Word Choice* (Diction) and *Voice*. The difference between "mistakes were made" (passive, unreliable) and "I did this" (active, reliable).
          *   *Bend:* Craft sees this as *Tension* or *Conflict*. Philosophy sees it as *Validity*.
          *   *No Counterpart:* *Legal Consequence.* In fiction, words change relationships. In law, words change bank accounts and liability. The stakes are different.

  3.  **Address the "Residue" and the "Craft Trap":**
      *   *The Trap:* Does craft demand resolution? Yes, traditionally. Narrative arc implies change. If the apology is the climax, the reader expects the *story* to resolve, even if the *history* doesn't.
      *   *The Conversion:* Craft turns "Is this just?" into "Does this feel earned?" This is dangerous. It aestheticizes justice.
      *   *The Residue:* The thing craft can't touch is the *material reality* outside the text. A perfect scene doesn't fix land rights.

  4.  **Final Verdict (The User's Structural Worry):**
      *   *Is it a hole or the point?* It's the point.
      *   *Advice:* Don't fix the hollowness by making the apology work better. Fix it by making the *failure* of the apology the actual story. The "unrepairable" nature is the theme. The climax shouldn't be the speech; it should be the realization that the speech changes nothing material.
      *   *Framework:* The framework isn't broken; the expectation of "climax = resolution" is the problem. Literary fiction can sustain ambiguity.

  5.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone:* Professional, direct, peer-to-peer. No fluff. Acknowledge their expertise.
      *   *Structure:* Follow the prompt's requested structure (Claim -> Craft -> Bend -> Void). Then the Meta-Analysis. Then the Verdict.
      *   *Key Insight:* The "Uptake" is the biggest friction point. In craft, uptake is reader satisfaction. In ethics, it's victim validation.
      *   *Refining the "Standing" point:* Use the concept of the "Immutable Character" vs. "Mortal Character."
      *   *Refining the "Lawyers" point:* Focus on "Subtext" vs. "Liability."
      *   *Refining the Meta:* Be honest. Craft *does* aestheticize. That's its job and its sin.
      *   *Refining the Verdict:* Validate their intuition. The hollowness is the truth. Lean into it.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I make the residue the main event? *Adjustment:* Ensure the "No Counterpart" sections are punchy and lead into the meta-analysis.
      *   *Check:* Did I answer the specific question about justice vs. audience satisfaction? *Adjustment:* Make sure to explicitly state that craft tends to subordinate justice to coherence.
      *   *Check:* Is the advice on the subplot specific? *Adjustment:* Tell them to shift the climax from the *delivery* to the *aftermath* or the *drafting process* where the impossibility is felt.

  7.  **Final Polish:** Check against the "don't flatter me" instruction. Keep it sharp. (e.g., "Craft is a machine for making meaning, not justice.")

  *(Self-Correction Note)*: I need to make sure I don't just say "craft is limited." I need to show *how* it translates the specific philosophical terms into narrative terms.
  *   Speech-act -> Scene/Sequel.
  *   Standing -> Character Identity.
  *   Addressee -> POV/Address.
  *   Lawyers -> Diction/Reliability.

