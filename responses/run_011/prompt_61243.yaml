answer: |-
  AUP holds up best because it abstracts over value via auxiliary goals rather than relying on model uncertainty, which covertly encodes human interest through the very act of modeling.

  All three methods require a counterfactual baseline, typically inaction, but they differ in sensitivity. RR and your predictability-weighted KL are brittle to feature selection; if your feature set omits a value-relevant variable, the penalty ignores it entirely. AUP is more robust because averaging over random utility functions smooths out biases in any single feature dimension, making it less prone to overfitting the specific ontology you chose.

  On your specific scenarios: (a) All three fail equally on coercion vs. free choice unless "human autonomy" is explicitly represented as a feature or utility dimension, as they measure outcome states rather than causal histories. (b) Your method uniquely handles chaotic cascades by penalizing them less, which avoids the "walking on eggshells" problem, but this is a double-edged sword that also permits unpredictable harms (like a chaotic market crash) that AUP and RR would catch. (c) On destroy/reassemble, all three struggle with temporal granularity; unless the horizon captures the full restoration cycle, you get penalized for the intermediate disruption, though your KL method might be slightly more forgiving if the restoration is highly predictable.

  Your suspicion is correct: predictability weighting smuggles in value specifications. Model uncertainty is not ontological entropy; it reflects where you invested modeling capacity. You build high-fidelity predictors for features you care about (human safety, object permanence) and leave others as noise (dust arrangements, thermal variance). By weighting penalty by predictability, you are effectively weighting penalty by "things the designer cared enough to model," shifting the value loading from the objective function to the state representation and training data. It is not a value-neutral third option, but rather a mechanism that hardcodes a status-quo bias correlated with human interest into the penalty structure itself.
