prompt: |-
  For five years I have sat as a panel member hearing appeals against sanctions imposed on claimants of a means-tested unemployment benefit with an activity test. I have kept a record of my votes, and I now want to know what principle they add up to, whether that principle is defensible, and which of my verdicts I should surrender. What follows is my own summary rather than a transcript; the sums and hours are illustrative, but the patterns are ones I recognise.

  1. A claimant declines a warehouse job because the required shift pattern would cost more in childcare than the job pays. Sanction wrong.
  2. A claimant with the same earnings profile declines a job identical in pay, hours and content to one they held for eight years and left voluntarily on good terms; the stated reason is that the work would be beneath them. Sanction right.
  3. A claimant declines a job assembling components for a weapons system they regard as immoral; the objection is sincere, long-standing, and would apply to any employer. Sanction wrong. Yet I would sanction a claimant who declines work at a betting shop or a payday lender on the same sort of stated ground. I cannot say why these two feel different to me.
  4. A claimant fails to declare cash earnings of about £80 a week from babysitting for a neighbour, over four months. Fraud; sanction right; the overpayment recoverable. But I hold this less blameworthy than case 5.
  5. A claimant makes a false statement about savings on the initial claim form, declaring £9,000 where the figure was £23,000. I hold this worse than case 4, though the sums are comparable and case 4 involved repeated concealment while case 5 involved a single utterance. I concede the ordering looks arbitrary.
  6. A claimant volunteers three days a week at a hospice for six months and turns down two interviews in that period. Sanction wrong: the activity requirement should be treated as met.
  7. A claimant spends comparable hours over a comparable period writing a novel and turns down the same two interviews; nobody outside the household can attest to the hours. Sanction right. What troubles me is that I would give the same answer even if I were persuaded the novel was excellent and the hours exactly as described.
  8. A claimant with a fluctuating and largely invisible condition fails a points-based capability assessment calibrated for stable impairments, and is sanctioned for non-attendance. Sanction wrong; and yet I also think a properly designed assessment would find them capable of some work and would then sanction them for refusing it. I am not sure both beliefs can stand.
  9. I think it legitimate to require a specified number of hours of unpaid work placement, and not legitimate to require thirty-five documented job applications a week, even though the second requirement is cheaper to administer and far easier to verify.
  10. A claimant with thirty years of contributions and one with none should, I think, receive different amounts for different durations; but I do not think that difference should affect the strictness of the activity test.
  11. An in-work claimant on a zero-hours contract turns down offered additional shifts because accepting them would forfeit their childcare place. Sanction wrong. I also think it objectionable that public funds top up wages of that kind, since the top-up lets employers pay less than they otherwise would. In case 1 I excused a refusal precisely because the wage did not cover the childcare the job required, so something here has to give.

  My working hypothesis is that what I am really tracking is legibility: whether a claimant's activity leaves a trace a stranger could verify — a placement supervisor's signature, a payslip, an employer's letter. Cases 6 and 7, and the second half of case 4, point that way. Cases 3 and 9 point against it, since in case 3 sincerity rather than documentation seems decisive, and in case 9 the more legible requirement is the one I reject.

  What I would like from you:

  (a) State one or two candidate principles precisely enough to be applied by someone who has never met me, and tie each clause to the case or cases that motivate it. If legibility appears as a clause, say whether it does independent work or acts as a proxy for something else — evidence of sincerity, say, or a way of assigning the risk of self-deception.

  (b) Identify which of my verdicts no single principle can accommodate. Where the choice is between a complex principle that saves all of them and a simpler one that overturns one or two, say which you would take and what is lost by taking it. I would rather abandon a verdict I care about than end up with a rule that is really eleven rules wearing a trench coat.

  (c) Apply your preferred principle to four cases I have not listed: a claimant who refuses any work requiring them to labour on their sabbath, where the employer would accommodate but only at reduced hours; a claimant in a former single-industry town who declines a job ninety minutes away by public transport in a different occupation for which they are qualified; a claimant who accepts work at sixty per cent of prior earnings in the same occupation and leaves it voluntarily within four months; and a claimant sanctioned for missing a mandatory appointment because they were attending an interview they had arranged themselves and told nobody about.

  (d) Several of my verdicts appear to turn on the duration and severity of the sanction rather than on the requirement itself. State what your principle implies about how long a sanction should last and how much income it should remove, and whether duration can do normative work that the underlying requirement cannot.

  (e) Finally, tell me whether my principle genuinely dispenses with the distinction between the deserving and the undeserving poor, or merely re-encodes it under names such as reciprocity, contribution, and legibility. And tell me whether what I have reconstructed amounts to a version of the old less-eligibility idea — that the conditions of relief ought to be made less attractive than the worst independent wage labour available. If it does, point to the verdicts in which that idea is already doing the work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** An experienced tribunal panel member (5 years) hearing appeals on unemployment benefit sanctions. Thoughtful, self-reflective, morally engaged, concerned with consistency and principle.
      *   **Task:** Analyze their recorded verdicts (11 cases + working hypothesis) to extract underlying principles, identify inconsistencies, apply principles to new cases, discuss sanction severity, and evaluate the "deserving/undeserving" and "less-eligibility" concepts.
      *   **Tone:** Philosophical, rigorous, empathetic but critical, structured.
      *   **Constraints:** Needs precise principles, identification of outliers, application to 4 new cases, discussion of sanction duration/severity, and a meta-ethical evaluation.

  2.  **Deconstruct the 11 Cases & Working Hypothesis:**
      *   *Case 1 (Childcare cost > wage):* Sanction Wrong. (Principle: Economic rationality/Net gain).
      *   *Case 2 (Beneath them/Same job):* Sanction Right. (Principle: Status/Attitude matters? Or perhaps "voluntary unemployment" logic).
      *   *Case 3 (Weapons vs. Betting/Payday):* Weapons = Wrong (Sincere/Universal objection). Betting/Payday = Right (Sanction). (Principle: Conscience vs. Preference? Inconsistency noted by user).
      *   *Case 4 (Cash babysitting):* Fraud/Sanction Right. Less blameworthy than Case 5. (Principle: Complexity of fraud?).
      *   *Case 5 (False savings declaration):* Fraud/Sanction Right. More blameworthy than Case 4. (Principle: Entry barrier vs. Ongoing compliance? Lump sum vs. Trickle?).
      *   *Case 6 (Hospice volunteer):* Sanction Wrong. (Principle: Social value/Legibility).
      *   *Case 7 (Writing novel):* Sanction Right. (Principle: Legibility/Social value? User notes legibility is key here).
      *   *Case 8 (Invisible condition):* Sanction Wrong (Assessment flawed). But would sanction if assessed capable. (Principle: Procedural justice vs. Substantive capability).
      *   *Case 9 (Unpaid placement vs. 35 applications):* Placement Legitimate, Applications Illegitimate. (Principle: Substance over bureaucracy. Contradicts "Legibility" hypothesis slightly, as applications are *more* legible).
      *   *Case 10 (Contributions history):* Benefit amount differs, Activity test strictness same. (Principle: Universal obligation vs. Insurance principle).
      *   *Case 11 (Zero-hours/Childcare):* Sanction Wrong. Top-up wages objectionable. (Principle: Consistency with Case 1? Structural critique).
      *   *Hypothesis:* Legibility (traces a stranger can verify).
      *   *Critique of Hypothesis:* Case 3 (Sincerity > Docs), Case 9 (Less legible requirement preferred). Legibility seems to be a proxy for *social recognition* or *verifiable effort* rather than just bureaucracy.

  3.  **Drafting Section (a): Candidate Principles:**
      *   *Attempt 1 (Legibility):* Fails on Case 3 and 9.
      *   *Attempt 2 (Reciprocity/Social Contribution):* Fits 6 (Hospice) vs 7 (Novel). Fits 9 (Placement is contribution, applications are not). Fits 1 (Net social gain vs cost).
      *   *Attempt 3 (Reasonable Expectation/Net Benefit):* Fits 1, 11. Fits 8 (Procedural fairness).
      *   *Synthesis:* The core tension is between *Civic Reciprocity* (giving back/verifiable effort) and *Reasonable Viability* (can you actually survive/do it?).
      *   *Principle 1: The Principle of Viable Reciprocity.* Claimants must demonstrate effort toward reintegration or social contribution, provided the requirement does not impose a net financial loss or violate core moral integrity.
      *   *Principle 2: The Principle of Verifiable Social Value.* Activities count if they produce value recognizable by the community (Hospice, Placement) rather than private value (Novel) or administrative box-ticking (Applications).
      *   *Refining Legibility:* It's not just "can I see it?" it's "does it signal commitment to the social contract?"
      *   *Decision:* I will propose a hybrid principle: **Reciprocal Viability.** It combines the duty to seek/contribute with the right to not be made worse off or morally compromised. Legibility is a proxy for *commitment signaling*.

  4.  **Drafting Section (b): Identifying Inconsistencies:**
      *   *The Big Clash:* Case 3 (Weapons vs. Betting). Why is anti-war conscience valid but anti-gambling/usury not? This is the weakest link. It relies on a specific hierarchy of moral goods the state might not share.
      *   *The Fraud Clash:* Case 4 vs 5. Why is lying on entry (5) worse than ongoing concealment (4)? Usually, entry fraud is seen as "gatekeeping," ongoing as "leakage." But user feels 5 is worse. This might be about *premeditation* vs *opportunity*.
      *   *The Legibility Clash:* Case 9. Applications are more legible than placements, yet placements are preferred. This suggests "Legibility" isn't the true principle; "Substantive Effort" is.
      *   *Recommendation:* Drop the distinction in Case 3. Either all sincere moral objections count, or none (except legal prohibitions). Dropping the distinction simplifies the principle to "Sincere Universal Conscience."
      *   *Recommendation:* Re-evaluate Case 5 vs 4. If the principle is "harm to the fund," they are similar. If "intent to deceive at entry," 5 is worse. I'd suggest aligning them based on *net loss* to avoid arbitrariness.

  5.  **Drafting Section (c): Applying to New Cases:**
      *   *Case A (Sabbath):* Sincere moral/religious objection. Fits Case 3 logic. If accommodated at reduced hours, does it meet "Viable Reciprocity"? Yes, if income is viable. Verdict: Sanction Wrong (if hours/pay viable).
      *   *Case B (90 min commute/Different job):* Viability test. 3 hours travel is likely unreasonable cost/time burden. Fits Case 1/11 logic (Net loss/Unreasonable burden). Verdict: Sanction Wrong.
      *   *Case C (60% pay/Quit):* Voluntary unemployment. Fits Case 2 logic ("Beneath them" vs economic reality). If 60% is below living wage, maybe justified? If just preference, Sanction Right. Let's assume it's viable but undesirable. Verdict: Sanction Right (Voluntary leaving without good cause).
      *   *Case D (Missed Appt for Interview):* Active job seeking vs Bureaucratic compliance. Fits Case 9 (Substance over form). Interview is high value. Verdict: Sanction Wrong.

  6.  **Drafting Section (d): Sanction Duration/Severity:**
      *   *Principle Implication:* Sanctions should be rehabilitative, not punitive. If the goal is Reciprocity, removing income prevents reciprocity (starvation).
      *   *Duration:* Short, escalating only on repeated *wilful* refusal.
      *   *Income Removal:* Never below subsistence. "Less eligibility" shouldn't mean destitution.
      *   *Normative Work:* Duration signals severity of breach of contract, but cannot override the right to survive.

  7.  **Drafting Section (e): Deserving/Undeserving & Less-Eligibility:**
      *   *Deserving/Undeserving:* The principle *does* re-encode it. "Legibility" and "Reciprocity" are modern codes for "good poor person" (hospice volunteer) vs "bad poor person" (novelist, fraud).
      *   *Less-Eligibility:* Yes, it is present. Case 2 ("Beneath them") and Case 7 (Novel vs Hospice) enforce the idea that benefit life must be less attractive/autonomous than low-wage work. The activity test *is* the mechanism of less-eligibility.
      *   *Verdicts:* Case 2, Case 7, Case 9 (Placement over applications) show this. The system demands *submission* to the labor market logic.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it respectful? Yes.
      *   *Clarity:* Are the principles distinct?
      *   *Legibility:* I need to be careful with the user's "Legibility" hypothesis. They suspect it's a proxy. I should confirm that. It's a proxy for *trust*.
      *   *Case 3:* This is the hardest ethical knot. I need to be firm that the distinction between weapons and betting is culturally contingent, not principled.
      *   *Case 9:* This undermines the "Legibility" hypothesis directly. I must highlight that.
      *   *Structure:* Follow (a) through (e) strictly.

  9.  **Final Polish:** Ensure the distinction between "Legibility as evidence" and "Legibility as social control" is clear. Make sure the "Less Eligibility" point lands hard, as that's often the blind spot in welfare administration. (Self-Correction: Ensure I don't sound too accusatory; the user is asking for help finding truth, not a lecture).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a profound exercise in moral accounting. You have provided a dataset of judicial intuition that reveals the tension between administrative necessity, economic rationality, and human dignity. Your hypothesis regarding "legibility" is astute, but as you suspect, it is likely a proxy for something deeper: *trust* and *social recognition*.

  Here is an analysis of your verdicts, structured according to your requests.

  ### (a) Candidate Principles

  Your verdicts do not cohere around a single axis. They oscillate between a **Contractual Model** (benefits are payment for job-seeking compliance) and a **Subsistence Model** (benefits are a right to survive unless actively abused). To reconcile them, I propose two candidate principles.

  **Principle 1: The Principle of Viable Reciprocity**
  *   **Definition:** A claimant is obligated to undertake activities that signal a commitment to reintegration or social contribution, provided those activities do not result in a net financial loss, do not violate universal moral imperatives, and do not demand impossible administrative burdens.
  *   **Clauses & Motivations:**
      *   *Financial Viability:* Work must not cost more than it pays (Cases 1, 11). This treats the claimant as a rational economic actor who cannot be forced into loss-making labor.
      *   *Moral Universality:* Conscience objections are valid only if they apply universally, not selectively (Case 3). This attempts to solve your betting/weapons inconsistency by demanding the objection be principled, not preferential.
      *   *Substantive Effort:* Activities must have tangible social or economic value, not just bureaucratic value (Case 9). This explains why a placement counts but 35 applications do not; the former produces value, the latter produces data.
      *   *Legibility as Trust:* Legibility is not the goal but the *mechanism*. It acts as a proxy for **verifiable commitment**. In Cases 6 and 7, the hospice volunteer provides a third-party verification of social contribution (trust), whereas the novelist asks for trust based on private output (risk).

  **Principle 2: The Principle of Procedural Fairness over Substantive Outcome**
  *   **Definition:** Sanctions are only legitimate when the process leading to them is robust and the claimant had a genuine opportunity to comply. The moral blameworthiness of the act matters less than the fairness of the rule enforcement.
  *   **Clauses & Motivations:**
      *   *Assessment Validity:* If the test measuring capability is flawed, the sanction is void (Case 8).
      *   *Entry vs. Maintenance:* Fraud at the point of entry (Case 5) is treated as a breach of the initial contract, whereas ongoing concealment (Case 4) is a leakage. This explains your intuition that Case 5 is "worse"—it corrupts the gate, not just the stream.
      *   *Priority of Job Seeking:* Actual job seeking (interviews) trumps administrative compliance (appointments) (implied by Case 9 and New Case D).

  **On Legibility:** In Principle 1, legibility does independent work only as a risk-management tool. It is a way of assigning the risk of self-deception. The state cannot verify a novel's hours without intrusive surveillance; it *can* verify hospice hours. Therefore, the state accepts the hospice hours as "real" effort and treats the novel's hours as "unproven" leisure, regardless of artistic merit.

  ### (b) Inconsistencies and Sacrifices

  No single principle accommodates all eleven verdicts without strain. The system is over-determined. To achieve coherence, you must abandon specific verdicts.

  **The Inconsistencies:**
  1.  **Case 3 (Conscience):** You distinguish between weapons (valid objection) and betting/payday loans (invalid). There is no liberal-democratic principle that supports this distinction. Both are legal industries. One offends a pacifist conscience; the other offends a moral/religious conscience regarding exploitation. To keep this distinction is to impose *your* hierarchy of sins on the claimant.
  2.  **Case 9 (Legibility vs. Substance):** You prefer unpaid placements (harder to verify, less legible) over 35 applications (highly legible, easy to verify). This contradicts your working hypothesis that you are tracking legibility. You are actually tracking *dignity* or *usefulness*.
  3.  **Case 4 vs. 5 (Fraud):** Your intuition that a one-time lie about savings (5) is worse than ongoing concealment of cash (4) is legally and morally tenuous. Usually, persistent deception is viewed as more culpable than a static error. This suggests your judgment here is influenced by the *type* of asset (cash feels survivalist; savings feel hoarded).

  **The Sacrifice:**
  I recommend you adopt **Principle 1 (Viable Reciprocity)** and surrender the specific verdict in **Case 3 regarding betting/payday lenders**.
  *   **The Change:** If a claimant has a sincere, long-standing, universal objection to working for a payday lender (based on exploitation), it should be treated identically to the weapons objection.
  *   **What is Lost:** You lose the ability to distinguish between "noble" conscience (war) and "sectarian" conscience (usury/gambling).
  *   **What is Gained:** A consistent defense of liberty of conscience. If the state compels labor, it must exempt those for whom that labor is moral self-harm, regardless of whether the panel member shares the moral view.

  Alternatively, if you wish to preserve the "Social Contract" aspect, you could surrender **Case 7 (The Novelist)**. If the principle is *Reciprocity*, the state is not obliged to fund private artistic development. However, this reinforces the "less-eligibility" doctrine (see section e). I suggest surrendering the Case 3 distinction is the more morally defensible path.

  ### (c) Application to New Cases

  Applying **Principle 1 (Viable Reciprocity)**, prioritizing Financial Viability and Substantive Effort:

  1.  **The Sabbath Claimant:**
      *   *Analysis:* This is a moral/religious constraint similar to Case 3. The employer offers accommodation (reduced hours).
      *   *Verdict:* **Sanction Wrong.** Provided the reduced hours still meet the minimum activity requirement and the pay remains viable (see Case 1), the claimant is meeting the reciprocity obligation. Refusing *any* work is not required if *some* work is available that respects the constraint.
  2.  **The Commuter (90 mins/Different Occupation):**
      *   *Analysis:* This tests Financial and Temporal Viability (Cases 1 & 11). Three hours of daily travel is a significant unpaid labor burden. Changing occupation suggests the previous human capital is being discarded.
      *   *Verdict:* **Sanction Wrong.** The cost (time and fare) likely renders the net gain marginal, and the requirement fails the "reasonable expectation" test inherent in Viability.
  3.  **The 60% Earner (Voluntary Leaver):**
      *   *Analysis:* This mirrors Case 2. Leaving work voluntarily generally triggers a sanction unless there is good cause. Is 60% of prior earnings a "viable" wage? If it covers subsistence, leaving it is a preference, not a necessity.
      *   *Verdict:* **Sanction Right.** Under Reciprocity, one cannot voluntarily reduce income and demand the state bridge the gap without a compelling reason (like health or harassment). This upholds the labor market discipline function.
  4.  **The Missed Appointment (Interview Conflict):**
      *   *Analysis:* This mirrors Case 9 (Substance over Bureaucracy). An interview is high-value job seeking; an appointment is administrative compliance.
      *   *Verdict:* **Sanction Wrong.** The claimant was engaged in the *substantive* goal of the benefit (finding work) rather than the *procedural* goal (reporting). To sanction this privileges bureaucracy over outcome.

  ### (d) Sanction Duration and Severity

  Your principle implies that sanctions are corrective, not punitive. If the goal is Reciprocity, a sanction that removes the means of survival destroys the capacity to reciprocate.

  *   **Duration:** Sanctions should be short and fixed (e.g., 4 weeks), resetting only upon compliance. Indefinite or escalating sanctions (e.g., 3 years) are incompatible with Viable Reciprocity because they sever the relationship between the citizen and the state entirely.
  *   **Income Removal:** A sanction should never reduce income below the level required for basic subsistence (food, heat, shelter). If the benefit is means-tested unemployment aid, it is already at subsistence. Therefore, **hard sanctions (total stoppage) are normatively indefensible** under your own Principle 1, Case 1, and Case 11. You cannot claim a job must cover childcare costs (Case 1) while simultaneously imposing a sanction that makes childcare impossible.
  *   **Normative Work of Duration:** Duration can signal the severity of the breach of trust (e.g., fraud vs. missed appointment), but it cannot do the work of *coercion*. If the requirement itself is unreasonable (Case 9's 35 applications), no duration of sanction makes it reasonable. The severity of the sanction cannot validate an invalid requirement.

  ### (e) Deserving/Undeserving and Less-Eligibility

  **Does this dispense with the distinction?**
  No. It re-encodes it.
  Your principle replaces "Deserving/Undeserving" with **"Compliant/Non-Compliant"** or **"Legible/Illegible."**
  *   The Hospice Volunteer (Case 6) is the "Deserving Poor" recast as the "Active Citizen."
  *   The Novelist (Case 7) is the "Undeserving Poor" recast as the "Unverifiable Risk."
  *   The Fraudster (Case 5) is the "Criminal Poor."
  By tying legitimacy to *legibility* and *reciprocity*, you are still making moral judgments about how a poor person ought to behave. You are judging the *character* of their activity, not just their need.

  **Is this Less-Eligibility?**
  Yes. The Old Poor Law principle of **Less-Eligibility** stated that the condition of the pauper should not be made as eligible as that of the independent laborer. Your verdicts enforce a modern version of this: **The condition of the claimant must be less autonomous than that of the employee.**

  *   **Verdicts where Less-Eligibility is at work:**
      *   **Case 2:** The claimant cannot refuse work because it is "beneath them." They must accept status loss to receive aid. An independent laborer could quit; a claimant cannot.
      *   **Case 7:** The claimant cannot spend time on high-value private creation (novel); they must spend time on low-value public searching (applications/interviews). Their time is not their own.
      *   **Case 9:** The claimant must perform unpaid labor (placement) to prove worthiness. An independent worker is paid for labor. This creates a hierarchy where benefit receipt requires a demonstration of submission that wage labor does not.
      *   **Case 11:** You object to the top-up because it lets employers pay less. This acknowledges that the benefit system subsidizes low wages, effectively enforcing a "less-eligible" standard where the claimant must accept terms (zero-hours) that the independent market might not sustain without public subsidy.

  **Conclusion:**
  You have reconstructed a system of **Conditional Dignity**. You have successfully mitigated the harshest edges of the system (protecting childcare costs, conscience, and procedural fairness), but you have not escaped the underlying logic that poverty must be managed through behavioral correction. Your principle is defensible as a matter of administrative justice, but it does not absolve the system of the moral burden of distinguishing between the "good" poor (who verify their effort) and the "bad" poor (who ask for trust). To do that would require a principle of **Unconditional Subsistence**, which your verdicts (specifically 2, 5, 7, and 10) explicitly reject.
