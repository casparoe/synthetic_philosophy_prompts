answer: |-
  ## Seminar Plan: The "Clarity & Consistency" Protocol

  ### 1. The Invented Division: "Glinters" and "Dulls"

  **The Choice:**
  You will divide the population into **Glinters** (people whose irises reflect light at a specific, measurable angle) and **Dulls** (everyone else). In the fiction of the exercise, Glinters are the demographic majority (60%) and hold disproportionate institutional power, though the trait itself is biologically irrelevant to cognitive or moral capacity.

  **Why I Picked It:**
  1.  **Visibility without Race:** It mimics the "visible but morally irrelevant" nature of race and the "binary coding" of gender without invoking either directly.
  2.  **Neutral Connotations:** Unlike "Tall/Short" (which carries ability connotations) or "Alphas/Betas" (which carries dominance connotations), "Glint/Dull" is semantically empty enough to feel like a bureaucratic classification.
  3.  **Pronoun Compatibility:** It allows you to assign invented pronouns (*Vim/Vat*) that map cleanly onto *He/She* later without triggering immediate semantic associations.

  **What This Costs You:**
  1.  **Affective Weight:** This is the big one. Hofstadter's paper works because the reader *feels* the sting of racism/sexism they already know. An invented group creates intellectual distance. Students may treat this as a logic puzzle rather than a moral injury. You lose the *shame* component.
  2.  **Historical Baggage:** Real conventions (like *Mrs.* vs. *Mr.*) carry centuries of property law and exclusion. "Glinter" honorifics are empty. You will have to work harder in the debrief to explain *why* the arbitrary rule matters if it has no history.
  3.  **The "It's Fake" Defense:** Students can dismiss the exercise by saying, "But Glinters aren't real." You must be ready to pivot to: "Exactly. So why does the structure feel familiar?"

  ---

  ### 2. The House Style Guide (The "Protocol")

  **Instruction:** Do not hand this out. Read one rule at a time. Write it on the board. Ask for questions/objections. Wait for the "groan" of acceptance, then move to the next.

  **Rationale Preamble:** "To ensure maximum clarity, brevity, and consistency in departmental communications, we are adopting the Standardized Reference Protocol (SRP)."

  1.  **The Generic Default:** "When referring to a person of unspecified group status, use the Glinter pronoun (*Vim*). *Rationale: Brevity. 'Vim or Vat' is redundant in general contexts.*"
  2.  **Honorific Asymmetry:** "Glinters are addressed as *Mr.* Dulls are addressed as *Ms.* (unmarried) or *Mrs.* (married). *Rationale: Social clarity regarding availability.*"
  3.  **The Marital Marker:** "A Dull's marital status must be indicated in formal correspondence. A Glinter's need not be. *Rationale: Tradition and relevance to social standing.*"
  4.  **Compound Nouns:** "Neutral occupational terms should take the Glinter suffix (e.g., *Glinterman*). *Rationale: Linguistic economy; avoids coining new terms.*"
  5.  **Pronoun Ordering:** "In paired references, list the Glinter first (e.g., *Vim and Vat*). *Rationale: Phonetic flow; hard consonants precede soft vowels.*"
  6.  **Possessive Default:** "In possessive constructions involving mixed groups, the Glinter form (*Vis*) governs. *Rationale: Consistency with Rule 1.*"
  7.  **Professional Titles:** "When group status is unknown, assume the Glinter form for high-status roles (Director, Chair). *Rationale: Statistical probability based on current demographics.*"
  8.  **Reflexives:** "The neutral reflexive is *Vimself*. *Rationale: Avoids the clumsiness of 'Vimself or Vatself'.*"
  9.  **Singular 'They' Ban:** "Do not use 'They' for singular referents. *Rationale: Grammatical number agreement.*" (This forces them to choose Vim or Vat).
  10. **The Exception Clause:** "Dull-specific terminology is permitted only when the group is exclusively Dull. *Rationale: Precision.*"

  ---

  ### 3. Source Text for Copyediting

  **Handout:** A bland administrative memo.

  > **MEMORANDUM**
  > **TO:** All Staff
  > **FROM:** Administration
  > **SUBJECT:** Quarterly Review Process
  >
  > Every employee must submit **his** timesheet by Friday. If **he** is late, **he** will meet with **his** supervisor. We value every **man** on the team. Whether **he** is a Glinter or a Dull, **he** contributes to the mission.
  >
  > When a supervisor reviews **his** staff, **he** should consider **his** performance. If a **chairman** is absent, the **vice-chairman** acts. A **Ms.** Smith (married) and **Mr.** Jones attended. **They** (singular) each brought **their** notes, but **he** (generic) must sign the log.
  >
  > We hope every **person** feels valued. If **he** has questions, **he** should contact HR.

  **Task:** "Edit this memo to comply with the Style Guide. Fix the pronouns, titles, and nouns."

  ---

  ### 4. Minute-by-Minute Breakdown (75 Minutes)

  **00:00 – 05:00: Setup**
  *   Distribute the Memo.
  *   State the goal: "We are practicing precision editing. I will give you style rules. Apply them."
  *   **Crucial:** Do not mention gender. Do not mention Hofstadter. Do not mention power. Frame this as "Technical Writing."

  **05:00 – 45:00: The Rule Walk (4 mins per rule)**
  *   Read Rule 1. Write on board.
  *   Ask: "Any objections on clarity grounds?" (Students will likely push back on Rule 1 and 9. Let them argue. If they say "It's exclusionary," say "We are prioritizing brevity today.")
  *   Students edit the text for 2 minutes.
  *   Repeat for Rules 2–10.
  *   *Pacing Note:* By Rule 5, students will suspect the game. By Rule 8, they will know. **Do not confirm.** Say: "Just follow the protocol."
  *   *Result:* They produce a text that reads smoothly but systematically erases Dulls.

  **45:00 – 55:00: The Transposition**
  *   Collect the edited memos.
  *   **The Turn:** "Take a fresh sheet. Keep the rules exactly as they are. Change 'Glinter' to 'Man' and 'Dull' to 'Woman'. Change 'Vim' to 'He' and 'Vat' to 'She'."
  *   Give them 5 minutes to rewrite the memo.
  *   Ask: "Read what you just wrote. Would you sign your name to this as a policy?"
  *   (Silence will do the work here).

  **55:00 – 65:00: The Reveal**
  *   Reveal Hofstadter's "A Person Paper on Purity in Language."
  *   Explain: "You just enacted the generic masculine defense without the historical baggage. The logic is identical."
  *   Ask: "At what minute did you feel the rules were unjust? Rule 1? Rule 3? Why?"

  **65:00 – 75:00: Philosophical Debrief (See Below)**

  ---

  ### 5. The Debrief: Mapping the Machinery

  Do not lecture. Draw a table on the board. Fill it in with them.

  | The Rule | The Convention | The Philosophical Mechanism |
  | :--- | :--- | :--- |
  | **Generic Default (Vim)** | **Generic He** | **Literal Content vs. Use:** Does "he" *mean* male, or just *convey* male in context? (Gricean implicature vs. Semantic content). |
  | **Honorific Asymmetry** | **Mrs./Ms. vs. Mr.** | **Markedness:** The unmarked term (Mr) is the default; the marked term (Mrs) carries extra information (marital status). |
  | **Occupational Suffix** | **-man (Fireman)** | **Constitutive vs. Reflective:** Does language *create* the exclusion, or just *record* it? (Sapir-Whorf light). |
  | **Statistical Probability** | **"Most CEOs are men"** | **The "Accuracy" Defense:** Is it accurate to use the majority form as default? Does accuracy justify erasure? |
  | **Arbitrariness** | **"It's just grammar"** | **Lewisian Conventions:** Conventions are arbitrary, but once established, they have normative force. Does "arbitrary" mean "harmless"? |

  ---

  ### 6. Predictable Pitfalls & Mitigation

  **Pitfall 1: The Early Clock (Minute 10)**
  *   *Scenario:* A student says, "This is just about women, isn't it?"
  *   *Response:* "Treat the variables as given. If it helps, think of it as algebra. Solve for X. We'll discuss what X represents at the end." (Do not lie, but defer the semantic loading).

  **Pitfall 2: The Refusal**
  *   *Scenario:* A student refuses to write "Vim" for everyone. "I won't do this."
  *   *Response:* "I respect that. You can opt out of the writing. But I ask you to observe *why* you feel resistance. Is it the grammar, or the implication?" (Turn the refusal into data for the debrief).

  **Pitfall 3: The Prescriptivism Brawl**
  *   *Scenario:* "Grammar isn't political. 'He' is neutral."
  *   *Response:* "That is a claim about usage. We are testing that claim. If 'He' were truly neutral, why did the 'Glinter' version feel clean, but the 'Man' version feel loaded? The structure is identical. What changed?"

  **Pitfall 4: The "Logic Puzzle" Trap**
  *   *Scenario:* Students enjoy the game too much. They treat it as a clever constraint.
  *   *Response:* In the debrief, press hard on the *outcome*. "You produced a text that excludes 50% of the population efficiently. Is efficiency a virtue here?"

  ---

  ### 7. Limitations: What the Invented Group Can't Reproduce

  Be honest with yourself (and them) about this.

  1.  **No Historical Trauma:** "Glinter" rules don't evoke centuries of legal disenfranchisement. The *structural* bias is visible, but the *moral* urgency is simulated.
      *   *Mitigation:* Acknowledge this. "This exercise isolates the *syntax* of bias. It cannot reproduce the *history* of bias. Do not confuse the map for the territory."
  2.  **No Real Harm:** No one in the room is actually a "Dull." No one feels unsafe.
      *   *Mitigation:* Remind them that for women/minorities, this isn't a 20-minute game. It's a lifetime of micro-erosions.
  3.  **The "Cool Down" Effect:** Because they used "Vim/Vat," the final transposition to "He/She" might feel like a translation task rather than a realization.
      *   *Mitigation:* Ask them to read the final version *aloud*. The auditory shock is often stronger than the visual.

  ---

  ### 8. Fault Lines: Settled vs. Contested

  **Do not overclaim.** Philosophy of language is not settled on these points. Distinguish clearly in your debrief.

  **Settled (or Strong Consensus):**
  *   **Priming Effects:** Empirical psycholinguistics shows that "generic he" increases male imagery in subjects' minds more than "they" or "he or she." (Hyde 1984; Stahlberg et al. 2001).
  *   **Markedness Asymmetry:** It is agreed that "Actor/Actress" or "He/She" are not symmetrical pairs. One is treated as the base, the other as the derivation.
  *   **Uptake Matters:** In speech act theory (Austin/Strawson), the hearer's uptake is part of the meaning. If the hearer feels excluded, the act of "including" them has failed, regardless of speaker intent.

  **Contested (Live Arguments):**
  *   **Semantic Content vs. Pragmatics:** Is the generic masculine *semantically* male (truth-conditional) or *pragmatically* male (contextual)? Some formal semanticists argue "he" is truly neutral in logic, even if socially biased. *Don't assert it is semantically male as fact.*
  *   **Causation vs. Correlation:** Does sexist language *cause* sexist beliefs, or merely reflect them? (The Sapir-Whorf debate). Evidence is mixed. *Avoid saying "Changing pronouns ends sexism." Say "It removes one reinforcing mechanism."*
  *   **Pejoration Exceptionlessness:** Is it inevitable that marked terms become pejorative? (e.g., "Master/Mistress"). Some argue context controls this. *Don't claim it's a law of nature.*
  *   **The "Arbitrariness" Defense:** David Lewis argues conventions are arbitrary solutions to coordination problems. If "He" is the convention, is it rational to switch? Feminist philosophers of language (Langton, Hornsby) argue that some conventions are *illocutionary disablements*—they silence groups. This is a normative claim, not a descriptive one. *Frame this as the core philosophical question: "When does a convention become a weapon?"*

  **Final Note to Instructor:**
  Your role is not to prove that language *is* oppressive, but to show that the *defense* of traditional language ("It's just grammar," "It's clearer") relies on structural moves that we reject in other contexts. If they leave understanding that "clarity" is often a coded value for "status quo," you have succeeded.
