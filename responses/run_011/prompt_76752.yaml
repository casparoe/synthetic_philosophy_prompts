  2. In the social interpretation, class acts as an antecedent structural force that determines political outcomes through counterfactual dependence. Conversely, the cultural camp treats class as a contingent identity constituted expressively by the revolutionary political imaginary itself.
  3. The quarrel about the Terror belongs to a further dispute over whether the Revolution is a single explanandum or a sequence of phases admitting distinct explanations. Fragmenting the event allows Revisionists to attribute 1793–94 to emergency without conceding the social causes of 1789.
  4. Progress would require a formal or comparative result demonstrating how political cultures emerge from social structures without reducing one to the other. Mere accumulation of prosopographic data cannot resolve the stalemate because the conflict lies in the logical structure of explanation.
  5. Ultimately, no resolution should be expected because the competing criteria for causation represent incommensurable historiographical paradigms. The debate persists as a permanent tension between structuralist and culturalist modes of historical understanding rather than a solvable empirical puzzle.
