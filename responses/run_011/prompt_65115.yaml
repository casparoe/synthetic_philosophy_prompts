answer: |-
  **MEMORANDUM**

  **TO:** Road-Safety Fund Priority-Setting Committee
  **FROM:** [Your Name]
  **DATE:** October 24
  **SUBJECT:** Recommendation for Ranking Procedure – June Publication Cycle

  **Purpose**
  Following the controversy in the last cycle regarding the intransitive ranking (A>B, B>C, C>A) and the subsequent legal advice that our published list must be a strict ordering with no ties, we must agree on a decision procedure before reviewing this year's 40 applications. This memo evaluates the two proposals currently on the table and recommends a third alternative that satisfies both our legal obligations and our ethical constraints.

  **Evaluation of Current Proposals**

  **1. The Analyst's Weighted Scoring Sheet**
  *Procedure:* Assign numerical weights to severity (e.g., Death=1.0, Minor=0.01), multiply by headcount, and rank by total score.
  *Strengths:* It is mathematically transitive. It guarantees a strict ordering, eliminating the risk of cycles and legal challenge based on inconsistency. It is auditable and efficient.
  *Weaknesses:* It relies on the assumption that all harms are commensurable. As noted by several members, this leads to the "repugnant conclusion": a scheme preventing 30,000 minor injuries would mathematically outrank a scheme preventing four deaths. While logically consistent, this violates the moral intuition of half the committee and risks public confidence if published.

  **2. The Adjacency Rule**
  *Procedure:* Compare applications only within adjacent severity categories (e.g., Deaths vs. Serious Injuries), forbidding direct comparison between non-adjacent categories (e.g., Deaths vs. Minor Injuries).
  *Strengths:* It respects the intuition that some harms are qualitatively different and should not be directly traded against one another. It avoids the "repugnant conclusion" by refusing to make the trade-off.
  *Weaknesses:* It is logically incompatible with the requirement to publish a *single ranked list*. If we cannot compare the top category to the bottom category, we cannot establish a linear order. As I noted previously, if A≈B and B≈C, but A and C are never compared, the relationship between A and C is undefined. To publish a list from #1 to #40 requires "stringing them together." If we refuse to do so, we revert to the exact intransitivity and casting-vote reliance that caused the last cycle's complaint.

  **Recommendation: Lexicographic Severity-First Ordering**

  I recommend we adopt a **Lexicographic Severity-First Procedure**. This approach treats severity categories as hierarchical tiers rather than tradable commodities. It preserves transitivity without requiring us to equate a death with a specific number of minor injuries.

  **The Procedure**
  To rank the 40 applications, we will apply the following steps in order:

  1.  **Tier Assignment:** Assign each application to a tier based on the *highest* severity of harm it prevents.
      *   Tier 1: Prevents at least one fatality.
      *   Tier 2: Prevents serious injuries (no fatalities).
      *   Tier 3: Prevents minor injuries only.
  2.  **Tier Ranking:** All Tier 1 applications rank higher than all Tier 2 applications. All Tier 2 applications rank higher than all Tier 3 applications.
  3.  **Within-Tier Ranking:** Within each tier, rank applications by the total number of incidents prevented (highest to lowest).
  4.  **Tie-Breaking:** To ensure a strict ordering with no ties (as required by the solicitor), any applications identical in Tier and Count will be ranked by their pre-assigned Application ID number (lowest to highest).

  **Rationale**
  This procedure resolves the "commensurable but repugnant" vs. "intuitive but circular" dilemma by declaring the categories **incommensurable but hierarchical**.
  *   **Against the Scoring Sheet:** It prevents the scenario where 30,000 whiplash injuries outrank four deaths. Any project saving a life automatically outranks any project saving only limbs. This secures the ethical buy-in of the committee members who objected to the weighted sum.
  *   **Against the Adjacency Rule:** It produces a complete, transitive chain. By establishing that Tier 1 > Tier 2 > Tier 3 as a rule, we avoid the circularity of the Adjacency Rule while respecting the intuition that severity matters more than frequency.

  **Implementation**
  This method requires no new data collection; the analyst's current severity and count data are sufficient. It is computationally simple and easily explained in our published minutes. It removes the need for a casting vote to resolve cycles, as the hierarchy is pre-determined.

  **Decision Required**
  We cannot proceed with the Adjacency Rule as it fails the legal test for a strict ordering. We should not proceed with the Weighted Scoring Sheet as it lacks the necessary committee consensus on ethical weights.

  I move that we adopt the **Lexicographic Severity-First Ordering** for this cycle. Please review this proposal so we can ratify it at Thursday's meeting and begin processing applications immediately.
