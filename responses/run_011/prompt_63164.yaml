answer: |-
  You are right to say I have used organizations. I carried a rifle in Catalonia; I punched a card in the factory. But I did not mistake the rifle for a principle of justice. We use tools to survive oppression, but we must not build our freedom on the same tools. The discipline required to smuggle papers across the Pyrenees is not the discipline required to govern a nation. One is a shield against violence; the other, if it demands you surrender your judgment, is a violence against the soul. I am not arguing against association; unions, study circles, and cooperative presses must be protected because they allow men to meet without demanding they surrender their conscience. But your proposal turns association into a mechanism of pressure.

  The feature that produces the evil is precisely the requirement that delegations vote as a bloc and recall those who break ranks. This is not representation; it is the transfer of conscience from the human being to the collective. If a delegate perceives that a clause in our common programme will starve a village or injustice a prisoner, your rule demands he vote against his perception or be silenced. You are asking us to write into the constitution of liberated France the principle that loyalty to the group supersedes loyalty to truth. That is the definition of the party spirit, regardless of whether you call them Resistance movements or parties. It manufactures the very collective passion I warn against, codifying the lie as a duty.

  You argue this is temporary, until the country ratifies the programme. But habits of thought are not so easily shed. If we teach the representatives of the Resistance that their duty is to obey a caucus rather than to weigh evidence, how do we expect them to govern differently once the emergency passes? If the programme is just, why fear independent scrutiny? Tell me: if a delegate from your own socialist movement sees clearly that a provision we drafted will harm the workers he claims to represent, by what right do you recall him for speaking it?
