  6.  **Drafting - Step-by-Step:**
      *   *Para 1:* You are right to point out my use of organizations. I carried a rifle in Catalonia; I punched a card in the factory. But I did not mistake the rifle for a principle of justice. We use tools to survive oppression, but we must not build our freedom on the same tools. The discipline required to smuggle papers across the Pyrenees is not the discipline required to govern a nation. One is a shield against violence; the other, if it demands you surrender your judgment, is a violence against the soul.
