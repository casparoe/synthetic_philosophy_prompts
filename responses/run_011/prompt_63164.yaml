      *   *Paragraph 2: Address the specific proposal.* The proposal (movements getting seats, voting as blocs, recalling dissenters) is exactly the definition of the party spirit I condemn. It makes the group's will superior to the individual's judgment. It institutionalizes the lie. If a delegate sees truth that contradicts the bloc, they must lie or be removed. This is not representation; it is delegation of conscience.
