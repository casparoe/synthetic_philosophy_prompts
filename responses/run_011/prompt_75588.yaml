          *   *Hypothesis:* Item (6) "Claimants should be believed by default" is the hardest to reconcile with (3) and (4).
          *   *Alternative:* Item (3) Reciprocity. If you drop reciprocity, you don't need checks. But the user seems committed to solidarity.
          *   *Best Candidate:* Refining (6). Moving from "believed by default" to "verified via low-burden audit." Or refining (3) to focus on *capacity* rather than *performance*.
          *   *Wait, looking closer:* The biggest tension is between wanting *reciprocity* (3) and *job search* (4) but rejecting *verification* (6) and *stigma* (2). You cannot have enforceable conditions without verification.
          *   *Recommendation:* The revision should be on (6). Acknowledge that *some* verification is needed for reciprocity, but argue for *proportionate* verification rather than *no* verification. OR, revise (3) to make reciprocity about *opportunity* not *compliance*.
          *   *Actually, the strongest lever is (9).* If nobody can lose food/roof, sanctions (8) become toothless. If sanctions are toothless, reciprocity (3) is symbolic.
          *   *Let's look at the "Load-Bearing" request again.* "Which single revision would clean up the most."
          *   If I change (6) to allow *some* verification, (3) and (4) become viable.
