          *   *Alternative:* The revision is to **(3)**. Shift from "Reciprocity" (giving back) to "Capability" (being enabled). This removes the need for strict enforcement.
          *   *Let's go with (6).* It's the operational blocker.

  5.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I lecture? *Keep it analytical.*
