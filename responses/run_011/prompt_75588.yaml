      *   *Load-Bearing Choice:* I'm going to suggest revising **(6)**. "Believed by default" is the most rigid constraint that makes (3) and (4) impossible to implement honestly. Softening this to "Presumption of honesty, audited by sampling" resolves the reciprocity tension without embracing the surveillance state.

  6.  **Final Polish:** Ensure the tone is collaborative ("Here is the audit you asked for") rather than prescriptive ("You should do this"). Ensure the ranking is clear.

      *(Self-Correction on Load-Bearing)*: Actually, looking at (9) "Nobody should lose means to eat." If this is absolute, then sanctions (8) are meaningless. If sanctions are meaningless, reciprocity (3) is a sham. This might be the bigger logical hole. However, (9) is often interpreted as "safety net of last resort," not "no sanction ever." But (6) is more directly in conflict with the *mechanism* of the new policy (fraud checks). The prompt is about the *new push* (fraud checks + work requirements).
