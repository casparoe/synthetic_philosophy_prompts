      *   *Check:* Did I identify the load-bearing item? *Yes.*

      *   *Refining the Tension between (1) and (3):* This is subtle. (1) rejects moral sorting. (3) accepts mutual deal. Is a mutual deal moral sorting? Not necessarily. It's contractual. I should note this is manageable but requires care.
