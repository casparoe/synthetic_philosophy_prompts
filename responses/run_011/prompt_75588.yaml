          *   *Severity:* Low (this is a standard philosophical distinction, not a logical error).

      *   *Tension E: Deserving/Undeserving vs. Reciprocity.*
          *   (1) Rejects moral sorting.
          *   (3) Accepts reciprocity (which implies some sorting based on contribution/effort).
