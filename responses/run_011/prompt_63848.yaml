answer: |-
  Your rationalist prior fails here because it assumes definitions are merely labels for pre-existing clusters. In taxonomy, definitions are *theories* about what holds biological lineages together. When you define a species by interbreeding, you hypothesize that gene flow is the glue. When you define it by diagnosability, you hypothesize that historical independence is the glue. These are competing causal claims about reality, not stipulations for convenience. That is why the disagreement is sticky: it is not about the word, but about the mechanism of evolution.

  Your Hypothesis 1 (Paradigm Cases) is correct and load-bearing. The Biological Species Concept (BSC) works for birds because reproductive isolation is the dominant barrier there. The Phylogenetic Species Concept (PSC) works for bacteria because horizontal gene flow makes isolation meaningless. The stalemate exists because each side treats their paradigm as the rule and the other's as noise. When you hand a BSC proponent a bdelloid rotifer (ancient asexual), they don't argue the data; they exclude the taxon from the concept's domain ("BSC applies only to sexuals"). When you hand a PSC proponent hybridizing oaks, they don't concede continuity; they split the lineage into smaller diagnosable units or argue selection maintains coherence despite gene flow. These are not verbal maneuvers; they are theoretical defenses protecting the core causal claim.

  Your Hypothesis 3 (Hidden Empirical Question) is also correct. The debate assumes nature comes in discrete chunks. If evolution is mostly reticulate or continuous, any discrete definition forces a boundary where none exists. This is why no data settles it: the data shows gradients, and each concept draws the line at a different point on the gradient. The disagreement persists because the world does not respect the binning.

  Your Hypothesis 2 (Regulatory Incentives) is true but secondary. Conservation funding depends on species counts, which raises the stakes, but the theoretical stalemate existed before the Endangered Species Act. The incentives amplify the fight, they do not create it.

  Where your deflationism is right: Stipulating a definition *does* solve communication within a specific research program. If all ornithologists agree to use BSC, they can talk efficiently. Where it misleads: It assumes the choice of definition has no consequences for truth. In taxonomy, the definition determines what counts as data. Choosing PSC over BSC changes the number of species, the inferred history, and the identified units of selection. You cannot stipulate away the ontological commitment.

  Progress requires abandoning the search for a single universal definition. The "General Lineage" move (separate evolving metapopulations) is the right theoretical step, but it fails operationally because "separate" is a matter of degree. Progress looks like explicit pluralism: accepting that "species" is a cluster concept where different criteria apply to different taxa, or shifting language to "lineage segments" with specified degrees of independence. We should expect no convergence on a single definition because the underlying phenomenon (divergence) is continuous, and the category (species) is discrete.

  Verdict: SUBSTANTIVE — conflicting theories of lineage cohesion mechanisms
