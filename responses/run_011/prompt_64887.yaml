  **MEMORANDUM**

  **TO:** Clinical Decision Support Oversight Committee
  **FROM:** [Your Name/Title]
  **DATE:** [Date]
  **RE:** Recommendation on Variable Inclusion for Readmission Risk Model

  **Recommendation**

  I recommend we proceed with deployment using **self-reported race** as a model variable, contingent on a strict equity-monitoring protocol. We should reject the proposal to substitute genetic ancestry principal components. This recommendation is not based on the illusion that race is biological, but on the evidence that it is a robust proxy for the structural barriers—housing, transport, institutional trust—that drive readmission risk. Removing it degrades equity performance without solving the underlying metaphysical problem. We must name the social risk factor directly rather than obscuring it with biological proxies that do not capture the lived experience of racism.

  **The Metaphysical Commitment**

  We are deadlocked because we are answering different questions. The nephrologists rightly note that race was removed from kidney-function equations because race does not alter physiology. However, this readmission model does not measure physiology; it predicts social risk. Here, race is not a biological parameter but a marker of exposure to structural inequity.

  When we include race in this specific model, we are not claiming Black biology differs from white biology. We are claiming that Black patients face different barriers to care after discharge. To remove the variable because race is socially constructed is to ignore that social constructions have material consequences. If we drop race to avoid reification, we effectively punish the patients suffering the consequences of that construction. We must choose the variable that best captures the causal mechanism of risk. In this case, self-reported race tracks the social experience of discrimination better than any other available single variable.

  **Why "Let the Data Decide" Is Insufficient**

  Several colleagues have suggested we simply let the data decide. While data informs us, it cannot settle this question. Data can tell us that including race improves false-negative rates for Black patients. It cannot tell us whether encoding a social category is ethically permissible or what that category signifies. Statistics describe relationships; they do not prescribe values. Choosing variables is a policy decision about what kind of risk we intend to mitigate. If we treat variable selection as purely statistical, we abdicate our responsibility to define what the model represents. We are not just predicting risk; we are defining what counts as risk.

  **Engaging the Ancestry and Deprivation Proposal**

  The proposal to replace race with a Neighborhood Deprivation Index (NDI) and genetic ancestry principal components deserves serious consideration. It attempts to disentangle social environment from biological lineage, aiming for causal clarity. The intuition is sound: if we can isolate the specific drivers of risk, we should.

  However, this approach rests on a specific causal assumption: that the predictive power of race in this dataset is partially driven by genetic lineage. For readmission risk, this is unlikely. Readmission is driven by medication adherence, follow-up access, and social support. Genetic ancestry does not measure these. By introducing ancestry principal components, we risk implying a biological basis for disparities where none exists, effectively naturalizing race under a rigorous-sounding label. Furthermore, while NDI captures economic context, it does not capture discrimination experienced by individuals living in mixed-income areas. The ancestry proposal solves a biological problem we do not have, while potentially introducing a new ethical hazard. Self-reported race remains the superior proxy for the social determinants actually at play.

  **Implementation and Review Schedule**

  To mitigate the risk of reification, we will treat race as a social risk flag, not a biological constant.

  1.  **Monitoring:** The Health Equity Office will calculate false-negative rates by race and ethnicity monthly for the first six months, then quarterly.
  2.  **Trigger:** If the gap in false-negative rates between Black and white patients widens by more than 5 percentage points compared to baseline validation data, the model will be suspended for review.
  3.  **Sign-off:** Continued deployment beyond six months requires joint sign-off from the Committee Chair and the Chief Health Equity Officer.

  **Patient Portal Disclosure**

  Patients deserve to know why we collect this data. The following text will appear in the model explanation section of the portal:

  "We include race in this calculation not because biology differs by race, but because racial identity reflects real differences in access to care and social support. We use this information to ensure patients facing systemic barriers receive extra help preventing readmission."

  **Conclusion**

  This decision requires us to be comfortable with a paradox: we use race to fight the effects of racism without endorsing race as biology. The ancestry proposal attempts to resolve this tension scientifically but fails to capture the social reality of risk. Let us choose the variable that protects our patients, while remaining clear-eyed about what that variable means.
