answer: |-
  ### 1. What I'm not going to say

  There are three sentences a eulogy like this normally reaches for, and I'm leaving them out. First: "She loved everyone." That is false. She loved her neighbors, fiercely and selectively, and she drew a line around who counted as one. Second: "She made this neighborhood better." That is a dodge. It was better for the people who were already here, safe from change. For the people who couldn't get in, it was a gate, not a garden. Third: "We will all miss her equally." That is cruel to this room. Some of you will miss her protection. Some of you will miss her tomatoes. The loss is real, but it lands differently depending on where you sit. I'm avoiding these because this room deserves the truth, not the comfort of a script.

  ### 2. The eulogy

  My mother hated a solemn room. She would tell you this service is a celebration of life, and she'd be right, but she'd also tell you to stop slouching. She was a woman of specific habits. She kept a jar of pennies by the front door for neighborhood kids who lost a tooth. She could identify any bird in the state by its call, but she refused for thirty years to learn more than four words of Spanish. She missed exactly one planning commission meeting in twenty-two years. That was the afternoon my father was buried.

  For the last twenty-five years, her work was this street. She knew the traffic studies. She knew when the deadline actually was. She knew how much shadow a building would throw on the community garden at four o'clock in October. In two thousand and eleven, she stopped a four-story building on the old car wash lot. She won. In two thousand and nineteen, she lost. That lot is now twenty-eight units over a bakery.

  My nephew rents one of those units. Not because he's especially into the place, but because it is the only thing in the neighborhood he was born in that he can afford. Her home aide, Rosalba, drove in for nine years from two zoning districts over. An hour and a half each way. There was nothing she could afford within walking distance of the woman she was caring for. My mother adored Rosalba. She never once connected those two facts. Or she did, and never said.

  I know there are people in this room who believe she saved this street. I know there are people here who believe she held it back. I am not here to settle that. I am here to say that she believed deeply that belonging was something you earned by staying. She thought forty years of residency bought you a vote that a person's first year didn't. She fought for the character of this place because she thought character was something you protected from the outside.

  But I also know she brought tomatoes in August to the people living in the new building. She knew their kids' names. She showed up.

  I run a hardware store. I sell tools. Tools are neutral; it's what you build with them that matters. My mother used her tools to build a wall around what she loved. But she also used them to build a table where people could sit. She was complicated. She was stubborn. She was here.

  We are left with the question of who gets to decide what a place turns into. She had her answer. I don't know if I have mine yet. But I know that love is not always clean. It doesn't always fit inside the lines of a zoning map. It spills over. It complicates things.

  So we will miss her. We will miss the pennies. We will miss the bird calls. We will miss the woman who showed up to the meeting even when it was hard. And we will stay here, on this street, trying to figure out how to belong to each other without shutting the door. That is the work she left us. It is heavy work. But she never asked us to do anything light.

  ### 3. Swaps

  **Option A (Softer focus on Rosalba):**
  "Her home aide, Rosalba, was here for nine years. They loved each other. My mother made sure Rosalba's family was fed during the holidays. She cared for the person deeply, even if she never questioned why the distance between their homes was so vast. Sometimes love looks like showing up every day. Sometimes it looks like not asking why the drive is so long."

  **Option B (Focus on the nephew/continuity):**
  "My nephew rents one of the new units. He was born on this street. He couldn't afford to stay any other way. My mother worried about change, but she wanted her family to remain. In the end, the neighborhood changed enough to keep her own blood here. There is an irony in that. She fought for stability, and stability arrived, just not in the package she ordered."
