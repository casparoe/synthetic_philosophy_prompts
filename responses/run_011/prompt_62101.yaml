  # Workshop Case: The Departmental Audit

  ## 1. Setting and Protocol

  **Setting:** A university philosophy department during an administrative accreditation audit. There are exactly 100 permanent staff members (including you). All 100 exist and are at work today regardless of the audit type.

  **Hypotheses:** The Audit Board flips a fair coin to determine the audit intensity.
  *   **$H$ (High Intensity):** 10 staff members are randomly selected for mandatory one-on-one interviews.
  *   **$L$ (Low Intensity):** 1 staff member is randomly selected for a mandatory one-on-one interview.

  **Protagonist:** You are a staff member. You arrive at work and find a summons in your mailbox requiring you to report to the Interview Room immediately. You know the protocol and the coin was fair ($P(H)=P(L)=1/2$).

  **Control Agent:** The University Ombudsman. They oversee the protocol and know the coin was flipped, but they are not staff, not in the selection pool, and not interviewed. They have received no signal other than "The audit is proceeding."

  **Constraints Check:**
  *   Ordinary setting (University).
  *   Fair chance device (Coin).
  *   Same individuals exist (100 staff in both).
  *   Variation in epistemic situation (10 interviewed vs. 1 interviewed). Ratio 10:1.
  *   No leakage (Summons looks identical in both).
  *   Control Agent retains prior (Their evidence "Audit proceeding" is certain in both).

  ## 2. Required Computations

  Let $N_H(E) = 10$ and $N_L(E) = 1$. Total staff $N_{total} = 100$.
  Prior Odds $O(H:L) = 1:1$.

  **(i) SSA (Inclusive Reference Class)**
  *   **Reference Class:** All 100 permanent staff members. (Defensible as the class of all observers sharing your relevant pre-selection properties).
  *   **Likelihood:** The probability of being sampled into the interview situation given $H$ or $L$.
      *   $P(E | H) = 10/100$.
      *   $P(E | L) = 1/100$.
  *   **Calculation:**
      $$ \text{Posterior Odds} = \text{Prior Odds} \times \frac{P(E|H)}{P(E|L)} = 1 \times \frac{10/100}{1/100} = 10:1 $$
      $$ \text{Credence } P(H) = \frac{10}{11} $$

  **(ii) SIA (Self-Indication Assumption)**
  *   **Weighting:** Weight hypotheses by the number of observers who have your evidence ($N(E)$).
  *   **Likelihood:** Proportional to $N_H(E)$ vs $N_L(E)$.
      *   $H$: 10 observers.
      *   $L$: 1 observer.
  *   **Calculation:**
      $$ \text{Posterior Odds} = \text{Prior Odds} \times \frac{N_H(E)}{N_L(E)} = 1 \times \frac{10}{1} = 10:1 $$
      $$ \text{Credence } P(H) = \frac{10}{11} $$
  *   **Agreement:** (i) and (ii) agree exactly.

  **(iii) SSA (Narrow Reference Class)**
  *   **Reference Class:** "Observers who are currently being interviewed." (Defensible as the narrowest non-singleton class defined by your current evidence).
  *   **Argument:** Proponents of this position argue that when the reference class is defined *by* the evidence $E$, the SSA sampling probability becomes 1 (you are certainly in the class of interviewed people), and the $1/N$ penalty is canceled by the fact that you are not sampling *from* the total population but *conditioning on* the evidence class. Effectively, this position treats the indexical fact "I am one of the interviewed" as carrying no information about the *size* of the interviewed group beyond the non-indexical fact that the group is non-empty.
  *   **Likelihood:** 1:1 (The evidence "I am interviewed" is certain given the class "Interviewed" in both hypotheses).
  *   **Calculation:**
      $$ \text{Posterior Odds} = \text{Prior Odds} \times 1 = 1:1 $$
      $$ \text{Credence } P(H) = \frac{1}{2} $$

  **(iv) Conditionalization (Non-Indexical Content)**
  *   **Evidence Proposition:** "At least one staff member is being interviewed." (The purely non-indexical content of "I am being interviewed").
  *   **Likelihood:**
      *   $P(\exists x E(x) | H) = 1$ (Since 10 are interviewed).
      *   $P(\exists x E(x) | L) = 1$ (Since 1 is interviewed).
  *   **Calculation:**
      $$ \text{Posterior Odds} = \text{Prior Odds} \times \frac{1}{1} = 1:1 $$
      $$ \text{Credence } P(H) = \frac{1}{2} $$
  *   **Agreement:** (iii) and (iv) agree exactly.

  **Summary:**
  *   Pair 1 (i, ii): $10/11$.
  *   Pair 2 (iii, iv): $1/2$.
  *   The pairs differ.

  ## 3. The Wager

  **Bet:** You are offered a bet that pays **\$11 if $H$ is true** and costs **\$5 if $L$ is true**.

  *   **(i) & (ii) Position:**
      *   Expected Value: $(10/11 \times 11) - (1/11 \times 5) = 10 - 5/11 \approx 9.55$.
      *   **Verdict:** **Accept.**
      *   **Reservation Price:** Willing to pay up to **\$10** to play (since $10/11 \times 11 = 10$).

  *   **(iii) & (iv) Position:**
      *   Expected Value: $(1/2 \times 11) - (1/2 \times 5) = 5.5 - 2.5 = 3$.
      *   *Correction:* To divide them 2-vs-2 on *whether to take it*, I need a bet the second pair rejects.
      *   **Revised Bet:** Pays **\$1 if $H$**, costs **\$2 if $L$**.
      *   **(i) & (ii) EV:** $(10/11 \times 1) - (1/11 \times 2) = 8/11 > 0$. **Accept.**
      *   **(iii) & (iv) EV:** $(1/2 \times 1) - (1/2 \times 2) = -0.5 < 0$. **Reject.**
      *   **Reservation Prices:**
          *   (i)/(ii): Willing to risk up to **\$10** to win \$1 (Odds 10:1).
          *   (iii)/(iv): Willing to risk up to **\$1** to win \$1 (Odds 1:1).

  ## 4. Structural Explanation

  **Coincidence 1: Why (i) SSA = (ii) SIA**
  *   **Feature:** **Fixed Total Population.**
  *   **Explanation:** SIA weights by $N(E)$. Inclusive SSA weights by $P(E|H) = N(E)/N_{total}$. When $N_{total}$ is constant across hypotheses (Constraint 3), the $N_{total}$ term cancels in the likelihood ratio. Thus, SIA and Inclusive SSA become mathematically identical.
  *   **Breaking the Coincidence:** Allow the total population to vary (e.g., $H$: 100 staff, 10 interviews; $L$: 200 staff, 1 interview).
      *   SIA: $10:1$.
      *   SSA (Inc): $(10/100) : (1/200) = 20:1$.
      *   They diverge.

  **Coincidence 2: Why (iii) Narrow SSA = (iv) Non-Indexical Cond**
  *   **Feature:** **Evidence Certainty within the Narrow Class.**
  *   **Explanation:** Position (iii) argues that if the Reference Class is defined by the evidence ("Interviewed"), the indexical selection probability is 1. Position (iv) argues the non-indexical evidence ("Someone interviewed") is certain in both hypotheses. Both positions effectively strip the indexical information of its probabilistic force regarding the hypothesis, reducing the update to the prior.
  *   **Breaking the Coincidence:** Make the existence of an interviewee uncertain in $L$ (e.g., $L$ has a 50% chance of 0 interviews).
      *   (iv) Cond: Updates in favor of $H$ (since $E$ is more likely in $H$).
      *   (iii) Narrow SSA: Still 1:1 (conditional on *being* interviewed, the class size penalty remains, or if defined as 1:1, it ignores the existence probability).
      *   They diverge.

  ## 5. Robustness Check (Two-Stage Evidence)

  Suppose you learn your evidence in stages:
  1.  **Stage 1:** "I exist and am at work today."
  2.  **Stage 2:** "I am called for an interview."

  *   **Stage 1:**
      *   (i)/(ii): $N_{total}$ is fixed (100). No update. Odds 1:1.
      *   (iii)/(iv): "I exist" is certain. No update. Odds 1:1.
  *   **Stage 2:**
      *   (i)/(ii): Update on $10/100$ vs $1/100$. Odds become 10:1.
      *   (iii)/(iv): Update on "Interview exists" (Certain) or "I am in Interview Class" (Certain). Odds remain 1:1.
  *   **Result:** The final credences are unchanged ($10/11$ vs $1/2$). The split is robust to sequential updating.

  ## 6. Epistemic Difference (Protagonist vs. Control)

  *   **Control Agent:** Knows the protocol and that the audit is running. Credence 1/2.
  *   **Protagonist (on i/ii):** Knows "I am one of the interviewees."
  *   **Difference:** The protagonist knows a **centered fact** ("I am here, in the room").
  *   **Is it evidence about $H$?**
      *   On (i)/(ii): **Yes.** The fact that *this* specific observer is in the room is more likely under $H$ because there are more "slots" for *this* observer to occupy.
      *   On (iii)/(iv): **No.** It is only evidence about the protagonist's location, not the hypothesis, because the existence of *some* interviewee was guaranteed.

  ## 7. The Objection and Reply

  **Objection (The "Trivial Fact" Critique):**
  "Positions (i) and (ii) trade on treating a trivial fact as information. You knew *someone* would be interviewed. Finding out it is *you* adds no non-indexical information about the world state ($H$ vs $L$). The update to $10/11$ is an artifact of double-counting the selection process. Only (iii) and (iv) are defensible because they recognize that 'I am interviewed' is epistemically equivalent to 'Someone is interviewed' once the protocol is known."

  **Reply:**
  "The case survives because the 'triviality' claim conflates *existence* with *identity*. While 'Someone is interviewed' is certain, 'I am interviewed' is not. Under $L$, there was only a 1% chance *I* would be the one. Under $H$, there was a 10% chance. My presence in the room is a specific outcome that is ten times more probable under $H$. To ignore this is to ignore the likelihood of the specific data observed. The fault line is not about triviality, but about whether indexical facts ('I am me') license probabilistic inference about population structures. This case isolates that question by removing the confounding factor of variable total population."
