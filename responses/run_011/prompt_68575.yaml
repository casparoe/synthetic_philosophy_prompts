      *   *Decision:* I will use **"A River Delta."** It captures flow, structure, history, and change.
      *   *Wait, one more check:* The prompt asks about the "Just-So" objection specifically. I need to be precise there. SAK requires specific adaptation for *each* module. GP requires adaptation for the *capacity*. SAK has more degrees of freedom to fit a story, making it harder to falsify.

  11. **Final Polish:** Ensure tone is authoritative yet conversational enough for a writer to use. (Proceed to draft).

  *(Self-Correction during drafting the response)*: I need to make sure I explicitly answer "whether they survive on some footing other than the analogy." For example, Use 1 (Universality) can survive if backed by genetic evidence, not just the analogy. Use 2 (Reverse-engineering) is the weakest without the analogy.

  Let's refine the "Better Analogy." A Swiss Army Knife is *static*. A brain is *dynamic*. A "Smartphone with Apps" is tempting but implies a designer. How about **"A Workshop that Builds Its Own Tools"**? That captures neuroplasticity. But maybe too complex. Let's stick with **"A River Delta."** It's natural, structured, but fluid.

