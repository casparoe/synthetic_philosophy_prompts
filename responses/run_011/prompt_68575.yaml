      *   *Use 1 (Universality):* Weakens. Universality could be a byproduct of a general constraint, not a specific tool. (e.g., all humans have elbows, not because elbows are adapted tools, but because vertebrates have limbs).
      *   *Use 2 (Reverse-engineering):* Weakens significantly. If the "tool" is shaped by development and environment, current structure doesn't cleanly map to ancestral function. (Exaptation).
      *   *Use 3 (Critics assume GP):* Stands somewhat, but shifts burden. It's not GP vs. SAK, it's "Interactive Specialization" vs. "Pre-formed Modules." The source still begs the question by assuming modularity is the default.

  6.  **Hidden Imports (Requirement 4):**
      *   *Designer:* Teleology.
      *   *Pre-formation:* Genetic determinism.
      *   *One-to-one:* Function/Structure mapping.
