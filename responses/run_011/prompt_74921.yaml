answer: |-
  **Bottom line**

  The proverb is a tool for assessing the messenger, not the message, and it cannot alter the factual reality of climate damage caused by aviation. It successfully undermines B's standing because she enforces standards she visibly breaks, creating a deficit of moral authority. It fails against C, who claims no moral high ground, proving the proverb targets hypocrisy rather than the act of flying itself. It does not apply to D, whose reformed conduct restores the right to blame past errors. Crucially, none of this changes the truth of the criticism; A's flying remains damaging regardless of who points it out. Only B loses footing; A's conduct remains indefensible regardless of the accuser.

  **The readings**

  1. **The Prudential Warning**
     **Claim:** If you criticise others while vulnerable to the same criticism, you invite retaliation that will damage you.
     **Verdict:** Platitude.
     **Target:** A.
     This is not a moral argument but a tactical one, akin to warning a soldier not to expose their flank. It advises caution rather than righteousness. It holds true for A: by flying while preaching abstinence, he made himself vulnerable to exposure. However, it offers no justification for the flying itself, only a warning about the consequences of being caught. It is philosophically empty because it accepts the criticism is valid but suggests hiding the violation is smarter than avoiding it. It bites A because he was caught, but it offers no shield against the substance of the claim. It is the weakest reading because it concedes the moral ground entirely in exchange for safety.

  2. **The Comparative Defence**
     **Claim:** My violation is permissible because your violation is worse.
     **Verdict:** False.
     **Target:** A (against B).
     This is the "whataboutism" variant. A argues that B's higher flight count negates her right to criticise his lower count. This is logically false; two wrongs do not make a right, nor does a larger wrong excuse a smaller one. In moral philosophy, this is a category error: the wrongness of an act is not determined by comparative frequency among peers. If cutting flying is necessary for climate stability, B's failure does not make A's success optional. This reading is often used dishonestly to deflect attention from the accused's conduct to the accuser's record. It fails completely here; A's carbon footprint remains excessive regardless of B's.

  3. **The Truth Condition**
     **Claim:** Your personal violation makes your factual claim about the world false.
     **Verdict:** False.
     **Target:** A, B, C, D.
     This is the *tu quoque* fallacy in its strictest form: arguing that a proposition is untrue because the proponent is inconsistent. If A says flying damages the climate, the physics remain valid even if A flies. If C says flying is economically irrational, the economics hold even if C flies. This reading is frequently weaponised in public discourse to dismiss evidence by attacking the messenger's virtue. It must be struck from any serious analysis. The validity of climate science or economic theory is independent of the personal conduct of the researcher. Using the proverb this way is intellectually dishonest; it conflates moral standing with empirical truth.

  4. **The Standing Constraint**
     **Claim:** You lack the normative authority to blame others for violations you actively commit.
     **Verdict:** Substantive and contested.
     **Target:** B (fails), C (passes).
     This is the core philosophical heavy-lifter. *Standing* is the right to hold someone accountable. Hypocrisy can erode standing because it implies the blamer does not respect the norm they enforce. B loses standing because she claims to uphold institute standards she flouts; her blame looks like power-play rather than principle. C retains standing because he makes no claim to virtue; he criticises A from a consistent position of non-compliance. He is not hypocritical because he never pretended to comply. This distinction is vital: the proverb is not about flying, it is about pretence. D also retains standing; past sin does not permanently revoke the right to blame if one has reformeds. This reading survives scrutiny only when applied to those who claim authority they do not possess.

  5. **The Integrity Requirement**
     **Claim:** To advocate a moral norm, you must embody it yourself.
     **Verdict:** Substantive and defensible.
     **Target:** A (fails), B (fails).
     This is the strongest reading. It argues that moral advocacy requires personal sacrifice to be credible. A fails because he asks others to bear costs he avoids. B fails because she manages a culture of restraint she does not practice. This is not about logical truth but about *credibility* and *leadership*. If leaders do not embody the change, why should followers? C is immune because he does not advocate abstinence, only analysis. D satisfies this by having changed his conduct. This reading protects the social fabric of trust required for collective action. It bites hardest on A and B because it exposes the gap between their public words and private actions. It is the only reading that justifies the public outrage without relying on logical fallacies.

  **The parameters**

  | Parameter | Does varying it change which readings survive? |
  | :--- | :--- |
  | **Whose conduct counts** | Yes. Only the blamer's conduct matters for Standing (4) and Integrity (5). |
  | **Identical or similar wrong** | Yes. Standing requires similarity; Truth (3) is unaffected by any wrong. |
  | **Worse or just as bad** | Yes. Comparative Defence (2) relies on this; Standing (4) does not. |
  | **Current or past** | Yes. Past wrongs (D) do not kill Standing (4) if reformed; Integrity (5) focuses on current advocacy. |
  | **Concealed or open** | Yes. Open non-compliance (C) protects against Integrity (5); concealment (A) enables Prudence (1). |
  | **Who invokes it** | Yes. Accused (A) uses it defensively; Bystanders use it to assess credibility. |

  **What it can never do**

  The proverb cannot alter the factual truth of the criticism. Whether A's flying damages the climate is a matter of physics, not morality. It cannot excuse the original act; A's emissions exist regardless of B's. It cannot silence honest non-compliers like C, who do not claim moral superiority. It cannot permanently disqualify repentant critics like D, whose reform restores their voice. Finally, it cannot be used to suggest that because everyone flies, no one can object. If the proverb is used to imply that the science is wrong because the scientist is flawed, it is being used dishonestly. Strike any sentence that suggests hypocrisy invalidates data.

  **The line I could actually print**

  1. "Hypocrisy may undermine a critic's authority, but it never alters the physics of carbon emissions."
  2. "The right to blame depends on consistency, but the truth of the claim depends on evidence."
  3. "We may reject the messenger for their contradictions, but we cannot discard the message as false."

  **Do not use:** "Given his own record, B's criticism of A is invalid." (This conflates standing with truth; her criticism remains factually valid even if her standing is compromised.)
