answer: |-
  # The Neural Metrics Sorting Quiz
  **Instructions:** For each scenario, select the single verdict that best matches your intuition. Do not overthink the neuroscience; the relevant facts are included in the stem. Avoid using outside concepts like "soul" or "rights"; focus strictly on who gets priority, protection, or weight.

  **1. The Elephant and the Diver**
  An African elephant (brain mass 3× human, total neurons > human, pallial neurons < human) and a human diver are trapped in a collapsing cave. Only one can be saved.
  *   **A.** Save the human. The specific architecture of the human pallium dictates priority.
  *   **B.** Save the elephant. The sheer volume of processing tissue commands greater weight.
  *   **C.** Flip a coin. The metrics conflict so radically that no objective priority exists.

  **2. The Hydrocephalus Scholar**
  A patient has almost no cerebral cortex due to fluid buildup but holds a first-class maths degree and scores 126 on IQ tests. The hospital must allocate a scarce, life-extending treatment.
  *   **A.** Allocate treatment. The demonstrated cognitive output overrides the missing tissue.
  *   **B.** Withhold treatment. The physical substrate required for full standing is absent.
  *   **C.** Allocate treatment, but note this is an anomaly that doesn't change the rule for typical brains.

  **3. The Hemispherectomy Child**
  A child has had an entire cerebral hemisphere removed to stop seizures and develops largely normal cognitive function. We must decide on legal protections for future patients.
  *   **A.** Full standard protections. Functional outcome is the only metric that matters.
  *   **B.** Reduced protections. Half the physical hardware implies half the claim.
  *   **C.** Protections remain unchanged, but we acknowledge the "human" label is doing the work, not the brain.

  **4. The Macaw and the Rat**
  A macaw (walnut-sized brain, high pallial neuron density) and a rat (larger brain, lower density) are both threatening a crop. You can authorize removal of only one species.
  *   **A.** Protect the macaw. Neuron density in the forebrain is the relevant metric.
  *   **B.** Protect the rat. Total brain mass is the safer proxy for complexity.
  *   **C.** Remove both. Neither metric reaches the threshold for protection in this context.

  **5. The Octopus Arm**
  An octopus (two-thirds of neurons located in the arms) is being prepared for food. Does severing an arm count as damaging the *whole* entity or a *part*?
  *   **A.** Damaging the part. The central brain holds the unified claim.
  *   **B.** Damaging the whole significantly. The distributed neurons hold independent weight.
  *   **C.** The question has no answer. "Whole" vs. "Part" is not a fact about the nervous system.

  **6. The Honeybee Navigator**
  A honeybee (1 million neurons) navigates, learns faces, and communicates. A mouse (100 million neurons) sleeps in a cage. You have one dose of painkiller.
  *   **A.** Give to the mouse. Total neuron count sets the hierarchy.
  *   **B.** Give to the bee. Demonstrated complex behavior trumps raw count.
  *   **C.** Destroy both doses. Neither count is sufficient to trigger this resource allocation.

  **7. The Anencephalic Newborn**
  A human infant is born without a forebrain. A non-human primate with a full forebrain is available for organ harvesting research.
  *   **A.** Protect the infant. Species membership overrides brain structure.
  *   **B.** Use the infant for research. The requisite neural structure for protection is missing.
  *   **C.** Protect both equally. We cannot draw a line between human and non-human tissue.

  **8. The Cortical Organoid**
  A lab-grown cluster of human cortical neurons (no body, no behavior, no sensory input) is scheduled for disposal.
  *   **A.** Dispose as waste. Without behavior or embodiment, there is no claim.
  *   **B.** Preserve as a patient. The tissue type itself generates the claim.
  *   **C.** Moratorium. We lack the metric to decide if tissue without a body counts.

  **9. The Neuron-Less Duplicate**
  A being behaves indistinguishably from a human but is confirmed to have zero neurons (silicon or magic). It claims it feels pain.
  *   **A.** Protect it. Behavior is the only verifiable ground for protection.
  *   **B.** Do not protect it. Biological neurons are the necessary ground.
  *   **C.** Protect it, but acknowledge we are pretending. There is no fact of the matter.

  ***

  # Scoring Key & Position Mapping

  Do not sum points. Instead, identify which **Profile** below matches your pattern of answers. Most participants will not fit perfectly; choose the profile that matches your "tie-breaker" logic on the hardest questions (1, 2, 7, 9).

  ### Profile I: The Capacity-Threshold View
  *   **Signature Answers:** Q2(A), Q6(B), Q7(B or A), Q9(A).
  *   **Logic:** You prioritize *what the system can do* over *what it is made of*. If the output (math, navigation, pain behavior) meets a bar, the underlying hardware (mass, neuron count, species) is irrelevant.
  *   **Verdict:** Status is binary (you pass the bar or you don't), but the bar is functional.

  ### Profile II: The Sentientist (Degrees) View
  *   **Signature Answers:** Q1(B or A), Q4(A), Q5(B), Q6(B).
  *   **Logic:** You believe protection scales with processing power. You are comfortable saying the elephant counts for *more* than the bee, or the macaw for *more* than the rat. You reject hard cutoffs.
  *   **Verdict:** Status is scalar. More neurons/density/function = more weight.

  ### Profile III: The Neuron-Count-as-Ground View
  *   **Signature Answers:** Q1(B), Q4(B), Q6(A), Q9(B).
  *   **Logic:** You treat the neuron (specifically in the pallium/forebrain) as the atom of value. Mass alone isn't enough (Q1), but behavior without neurons (Q9) counts for nothing.
  *   **Verdict:** Biological substrate is the only legitimate ground.

  ### Profile IV: The Size-as-Evidence View
  *   **Signature Answers:** Q2(A), Q3(A), Q7(B), Q8(A).
  *   **Logic:** You care about capacity (like Profile I), but you usually use brain size as the *proxy* for capacity. However, when the proxy fails (Hydrocephalus), you discard the proxy.
  *   **Verdict:** Brain metrics are epistemic tools, not ontological grounds.

  ### Profile V: The Relational View
  *   **Signature Answers:** Q1(A), Q3(C), Q7(A), Q9(B or C).
  *   **Logic:** You prioritize humans regardless of brain damage (Q7) and reject non-humans regardless of brain complexity (Q1). The brain stats are distractions; the relationship to the human community is the ground.
  *   **Verdict:** Status is conferred by membership, not measured by metrics.

  ### Profile VI: The Deflationary View
  *   **Signature Answers:** Q1(C), Q5(C), Q8(C), Q9(C).
  *   **Logic:** You consistently select the "uncertain" or "coin flip" options. You believe the conflict between metrics (mass vs. density vs. behavior) proves there is no single fact to be found.
  *   **Verdict:** There is no determinate fact of the matter regarding status.

  ***

  # Instrument Analysis: Limitations & Blind Spots

  ### 1. Indistinguishable Leaves
  Across these nine questions, **Profile I (Capacity-Threshold)** and **Profile IV (Size-as-Evidence)** produce identical verdicts on 8 out of 9 questions.
  *   **Why:** Both profiles prioritize the Hydrocephalus patient (Q2) and the Behavioral Duplicate (Q9) over the Anencephalic Newborn (Q7). They only diverge on *why* they make the choice. Profile I says "Function is the ground." Profile IV says "Function is the ground, and size is usually evidence for it."
  *   **The 10th Question:** To separate them, you need a case where **Capacity is unknowable, but Size is known.**
      *   *Case:* A comatose patient with a fully intact, high-EQ brain vs. a comatose patient with a severely atrophied brain. Neither shows behavior.
      *   *Separation:* Profile I (Capacity) must say "We cannot know, so we cannot assign status." Profile IV (Size-as-Evidence) can say "We assign status based on the hardware evidence we have."

  ### 2. Unavailable & Incoherent Combinations
  The quiz allows for $3^9$ answer combinations, but many map to philosophical positions nobody defends.

  *   **The "Human Exceptionalist Neuron-Counter" (Incoherent)**
      *   *Pattern:* Q1(B) [Elephant > Human based on neurons] AND Q7(A) [Anencephalic Human > Primate based on species].
      *   *Diagnosis:* This claims neurons are the ground for animals, but species is the ground for humans. This is a "Speciesist Neuron-Count" view. It is logically consistent but theoretically unstable; it admits neurons don't actually matter for the one species that claims to care about reason.
  *   **The "Binary Mass Fetishist" (Unattractive/Implausible)**
      *   *Pattern:* Q1(B) [Elephant > Human], Q2(B) [Hydrocephalus = No Treatment], Q6(A) [Mouse > Bee].
      *   *Diagnosis:* This asserts Mass/Count is the ground *and* Status is Binary.
      *   *Coherence Check:* This cell is **coherent but empirically brittle.** It requires a hard cutoff (e.g., "800g brain = Status, 799g = None"). While logically possible (like a speed limit), it is unattractive because it forces the verdict in Q2 (denying the scholar) solely on weight, ignoring the evident capacity. Most who value mass do so *because* they think it tracks capacity; when it fails to track (Q2), they abandon mass. To hold this view, one must argue mass *itself* is magical, not a proxy.
  *   **The "Behaviorist Organoid Lover" (Unexplored)**
      *   *Pattern:* Q8(B) [Save Organoid] AND Q9(A) [Save Duplicate].
      *   *Diagnosis:* Protecting tissue with no behavior (Organoid) *and* behavior with no tissue (Duplicate). This implies "Anything that is either Biological OR Behavioral counts." This is a disjunctive view rarely defended because it lacks a unifying principle (why these two specifically?).

  ### 3. The "Size is Ground + Binary" Trap
  You suspected that **"Size is the ground itself" + "Status is binary"** is incoherent. The quiz exposes why.

  *   **The Conflict:** Biology is continuous; Binary Status is discrete. To map Continuous $\rightarrow$ Discrete, you need a cutoff.
  *   **The Exposure:** Look at **Q2 (Hydrocephalus)** and **Q3 (Hemispherectomy)**.
      *   If Size is the Ground, the Hydrocephalus patient (low mass) must have low/no status.
      *   If Status is Binary, there is no "partial status" for the Hemispherectomy child.
      *   **The Incoherence:** If you answer Q2(B) (Withhold treatment due to low mass), you are logically consistent but morally monstrous (denying a genius care). If you answer Q2(A) (Save the genius), you have admitted Size is *not* the ground.
      *   **Conclusion:** No one can coherently occupy "Size is Ground + Binary" *while accepting the empirical facts provided.* They can only occupy it by denying the relevance of the Hydrocephalus case (claiming the IQ test is wrong, or that "potential" matters). If they accept the facts, "Size as Ground" collapses into "Size as Evidence." The quiz forces this collapse in Question 2.

  ### 4. Summary of Leaves Separated
  *   **Separated:** Relational vs. Biological (Q7), Substrate vs. Behavior (Q9), Scalar vs. Binary (Q3/Q6).
  *   **Blurred:** Capacity-Threshold vs. Size-as-Evidence (requires Q10).
  *   **Exposed as Empty:** "Size as Ground + Binary" (exposed in Q2).

  **Facilitator Note:** If a participant lands in the "Binary Mass Fetishist" cell, ask them: *"If we found a human with 799g brain mass and IQ 150, and another with 801g and IQ 50, does the first one lose the right to life?"* If they hesitate, they are actually Profile IV (Size-as-Evidence), not Profile III (Neuron-Count-as-Ground).
