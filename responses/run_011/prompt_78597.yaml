answer: |-
  1. **The Fragility Tautology**
     *Claim:* If an external shock destroys a society, that society must have been vulnerable to begin with.
     *Status:* Trivially true.
     *Evaluation:* This is definitional. A resilient society absorbs shocks; a collapsed one did not. Calling this "suicide" just renames "vulnerability" as "self-destruction." It offers no explanatory power for *why* the vulnerability existed.
     *Overlap:* This is the logical floor for Reading 2.

  2. **The Threshold Thesis**
     *Claim:* External shocks are merely triggers; internal stress must push the system past a tipping point for collapse to occur.
     *Status:* Testable and plausible.
     *Evaluation:* Testable by comparing societies facing similar shocks (e.g., drought) with different outcomes (collapse vs. adaptation). This is the core of modern resilience theory. It holds that murder requires a weak victim, but the weakness is the cause, not the blow.
     *Overlap:* This is the empirical engine behind Reading 1.

  3. **The Moral Hazard Claim**
     *Claim:* Societies make specific bad choices (ecological, political) that deserve blame, analogous to a person choosing death.
     *Status:* Probably false / Category error.
     *Evaluation:* Too vague to evaluate scientifically because it assigns moral agency to distributed systems. It assumes elites' choices equal society's choices. It ignores structural constraints where no "good" choice exists.

  4. **The Complexity Trap**
     *Claim:* Investment in complexity yields diminishing returns, making collapse a cost-cutting economic inevitability rather than an external attack (Tainter's specific model).
     *Status:* Testable but debated.
     *Evaluation:* Testable by measuring energy return on investment in administration vs. output over time. It explains gradual decline well but struggles with sudden cascades like the Late Bronze Age where trade networks snapped externally.

  5. **The Definitional Shift**
     *Claim:* "Collapse" means loss of elite complexity, not population extinction; thus, the society "chose" simplification to survive.
     *Status:* Depends on definition.
     *Evaluation:* If collapse is reorganization, "suicide" is actually "adaptation." This reading relies entirely on how you define the end state.

  **Agency and Intention**
  The metaphor of "suicide" presupposes a unitary agent with intent. Societies are not minds; they are distributed networks of individuals, institutions, and environments. No Bronze Age king woke up and chose systemic failure. Using "suicide" smuggles in a responsibility claim that doesn't fit the mechanics of complex systems. It conflates *causation* (internal fragility) with *intention* (choosing to die).

  **Definition Dependence: Maya and Rapa Nui**
  The slogan's validity shifts based on what "collapse" means. If collapse is population death, Rapa Nui is ecocide (suicide). If it's resilience, Rapa Nui survived the rats and Europeans (no collapse). The Maya case splits the difference: the southern lowlands emptied (collapse), but the north thrived (continuity). If "civilization" means the specific political structure, it died. If it means the culture, it lived. The slogan fails here because it treats civilizations as binary (alive/dead) rather than transforming systems.

  **Which Reading He Needed**
  To block your Late Bronze Age argument, your friend needed **Reading 2 (The Threshold Thesis)**. He needed to claim that drought and Sea Peoples were insufficient causes without pre-existing internal fragility. This allows him to acknowledge the "murder weapons" while insisting the "victim" was already terminally ill.

  **Does It Hold Up?**
  Reading 2 holds up better than the slogan suggests. Current archaeology supports a "systems collapse" model where internal fragility (overcentralization) amplified external shocks (drought, raids). However, the slogan "suicide, not murder" is too binary. In the Bronze Age, the external shocks were so severe they might have toppled even moderately resilient states, making "manslaughter" (negligence plus external force) a more accurate metaphor than pure suicide.

  Verdict: Reading 2 (The Threshold Thesis) survives with caveats.
