  I am preparing a handout for an upper-level seminar on eighteenth-century moral philosophy, and I want to work through a passage from Adam Smith, *The Theory of Moral Sentiments*, Part III, Chapter III ("Of the Influence and Authority of Conscience"). It is the opening movement of that chapter, immediately before the more frequently anthologized pages about China and the little finger, and my students tend to skip past it to get to those. Here is the text:

  > But though the approbation of his own conscience can scarce, upon some extraordinary occasions, content the weakness of man; though the testimony of the supposed impartial spectator, of the great inmate of the breast, cannot always alone support him; yet the influence and authority of this principle is, upon all occasions, very great; and it is only by consulting this judge within, that we can ever see what relates to ourselves in its proper shape and dimensions; or that we can ever make any proper comparison between our own interests and those of other people.
  >
  > As to the eye of the body, objects appear great or small, not so much according to their real dimensions, as according to the nearness or distance of their situation; so do they likewise to what may be called the natural eye of the mind: and we remedy the defects of both these organs pretty much in the same manner. In my present situation an immense landscape of lawns, and woods, and distant mountains, seems to do no more than cover the little window which I write by and to be out of all proportion less than the chamber in which I am sitting. I can form a just comparison between those great objects and the little objects around me, in no other way, than by transporting myself, at least in fancy, to a different station, from whence I can survey both at nearly equal distances, and thereby form some judgment of their real proportions. Habit and experience have taught me to do this so easily and so readily, that I am scarce sensible that I do it; and a man must be, in some measure, acquainted with the philosophy of vision, before he can be thoroughly convinced, how little those distant objects would appear to the eye, if the imagination, from a knowledge of their real magnitudes, did not swell and dilate them.
  >
  > In the same manner, to the selfish and original passions of human nature, the loss or gain of a very small interest of our own, appears to be of vastly more importance, excites a much more passionate joy or sorrow, a much more ardent desire or aversion, than the greatest concern of another with whom we have no particular connexion. His interests, as long as they are surveyed from this station, can never be put into the balance with our own ... Before we can make any proper comparison of those opposite interests, we must change our position. We must view them, neither from our own place nor yet from his, neither with our own eyes nor yet with his, but from the place and with the eyes of a third person, who has no particular connexion with either, and who judges with impartiality between us. Here, too, habit and experience have taught us to do this so easily and so readily, that we are scarce sensible that we do it; and it requires, in this case too, some degree of reflection, and even of philosophy, to convince us, how little interest we should take in the greatest concerns of our neighbour, how little we should be affected by whatever relates to him, if the sense of propriety and justice did not correct the otherwise natural inequality of our sentiments.

  Please help me get the argument of these paragraphs straight. Five things in particular.

  1. In the optical case, the correction is said to depend on "a knowledge of their real magnitudes." Identify what, if anything, plays that role in the moral case, and whether Smith's phrase "their real proportions" commits him to there being sentiment-independent facts about how much weight an interest deserves. I am drafting a claim that the analogy is not merely decorative: perceptual constancy works because the perceiver already possesses a non-visual standard of true size, so if the moral case is structurally the same, the impartial spectator's verdicts must be corrigible by reference to something outside anyone's feelings. A colleague objects that the analogy is only about station and distance, and that "real proportions" is a façon de parler for what a properly placed spectator would feel. Which reading do these paragraphs better support? Cite the exact phrases that decide it, and say what each reading costs Smith.

  2. Smith twice says habit and experience make the operation so easy that "we are scarce sensible that we do it," yet twice says that "reflection, and even of philosophy" is required to be *convinced* of something. Separate carefully what the philosophy is needed for from what habit accomplishes, and state what precisely we are to be convinced of in each case. My students read this as Smith saying ordinary people need philosophy in order to be moral; I think that is a misreading, but I want to know whether the text will bear my correction.

  3. Is the moral station an equalizing station in the same sense as the optical one? The visual remedy transports me where I can survey both objects "at nearly equal distances," whereas the moral remedy puts me at the place of a third person who has "no particular connexion with either." Work out whether that difference is a genuine disanalogy that undercuts "pretty much in the same manner," or whether it is just the moral version of equal distance.

  4. What work is the opening concession doing — that the testimony of the "great inmate of the breast" "cannot always alone support him"? Is this simply an acknowledgment of weakness of will, or does it signal that the spectator's verdicts are supplemented by something else in this part of the book? If the latter, say what, and where the pressure shows up in the paragraphs that follow.

  5. Smith illustrates the optical case in the first person, from his own window, and describes the moral case in the first person plural. Does that shift in voice matter for how much authority he is claiming for the inner judge, or is it only stylistic?

  Two constraints on your answer. Keep exegesis and evaluation separate: first tell me what the passage says and what turns on which phrase, then tell me whether you think the analogy holds together. And please do not give me a survey of the commentary or a list of who has read this passage which way; I want the case made from the quoted text and from Smith's account of sympathy generally, not from citations. Roughly a thousand to fourteen hundred words. Where the passage genuinely underdetermines a question, say so explicitly rather than choosing a side for the sake of tidiness.
