answer: |-
  The air in OR 4 was conditioned to a temperature that preserved organs but chilled the skin. I stood at the head of the bed, my hands clasped behind my back, watching the monitor. Mr. G. lay beneath the warmers, his chest rising and falling with the mechanical rhythm of the ventilator. He was not dead. The chart confirmed it: pupillary response present, gag reflex intact. He satisfied none of the neurological criteria. He was alive, but the decision had been made to withdraw life-sustaining treatment, and the goal was donation after circulatory determination.

  Dr. Aris, the attending intensivist, stood by the ventilator. He did not look at the procurement team, who were already scrubbed and gowned, standing like statues against the sterile blue drapes. They were waiting for the clock. I was the keeper of the clock.

  "Extubating now," Aris said. His voice was flat, devoid of hesitation. He disconnected the circuit.

  The machine hissed, then fell silent. Mr. G. took a few agonal breaths, shallow gasps that pulled air through the upper airway without volume. Then, nothing. The chest remained still. The pulse oximeter dropped from ninety-eight to eighty, then seventy. The arterial line waveform, previously a sharp mountain range, flattened into a shallow hum.

  At 14:02, the line went straight. Asystole.

  Aris leaned over the charting tablet. He tapped the screen. This was the first stage of our protocol, the ethics committee's workaround for the statute's rigid language. He was signing the *Provisional Determination of Cessation*.

  > **FORM DCD-04B: PROVISIONAL DETERMINATION OF CESSATION**
  > *Time of Cessation:* 14:02
  > *Attending Signature:* [Digital Auth: Aris, M.]
  > *Authorization:* Per Policy 7.2, procurement team may maintain sterile field pending Final Declaration. Hands-off interval initiated.

  "Time out," I said. My voice sounded too loud in the sudden quiet. "Hands-off interval begins. Five minutes."

  I started the timer on my phone. The room froze. The scrub tech held a retractor steady, though there was nothing to retract yet. The surgeon stood with his hands clasped at his waist, eyes on the donor's abdomen. Aris stepped back to the wall. Dr. Lin, the hospitalist assigned as the independent second clinician, stood near the door. She held a pen. She would not move until the timer hit zero.

  The first minute was the longest. I watched the seconds tick on my screen.

  *One.* The HVAC system hummed, a low B-flat that vibrated in the floorboards.
  *Two.* The fluorescent lights buzzed overhead, a higher frequency, like insects.
  *Three.* My own heartbeat thudded against my ribs. I forced it down.
  *Four.* The donor's skin was pale, waxy under the surgical lights.
  *Five.* A drop of sweat formed on the surgeon's brow, suspended above the eyebrow.
  *Six.* The arterial line monitor displayed a flat green line. Zero millimeters of mercury.
  *Seven.* The recipient team was in OR 5, twenty feet away. I could hear the muffled sound of their induction if I listened too hard.
  *Eight.* The silence was heavy, physical. It pressed against my eardrums.
  *Nine.* I thought about the statute. *Irreversible cessation.* The word sat in the policy like a stone. We could not prove it. We could only promise it.
  *Ten.* The scrub tech shifted his weight. The rustle of his gown was like tearing paper.
  *Eleven.* No movement from the chest.
  *Twelve.* No movement from the line.
  *Thirteen.* The clock on the wall had a second hand that ticked visibly. It lagged behind my phone by two seconds.
  *Fourteen.* I focused on the digital numbers. 00:14.
  *Fifteen.* The air smelled of antiseptic and cold dust.
  *Sixteen.* Aris looked at his watch. He looked at me. I nodded.
  *Seventeen.* The flat line remained flat.
  *Eighteen.* A car horn honked somewhere outside, distant and unrelated.
  *Nineteen.* The warmth of the room seemed to be draining away.
  *Twenty.* I counted the breaths of the staff. They were holding them, releasing them slowly.
  *Twenty-one.* The donor's hand lay supine on the sheet. Fingers slightly curled.
  *Twenty-two.* No twitch.
  *Twenty-three.* The monitor's power light blinked green. Steady.
  *Twenty-four.* I thought about the five minutes. Three hundred seconds.
  *Twenty-five.* The surgeon's eyes did not blink.
  *Twenty-six.* The line remained flat.
  *Twenty-seven.* My phone vibrated against my palm. A text message. I ignored it.
  *Twenty-eight.* The silence stretched, thin and tight.
  *Twenty-nine.* I wondered if the recipient was anesthetized yet.
  *Thirty.* Halfway through the first minute.
  *Thirty-one.* The light reflected off the steel tray.
  *Thirty-two.* No change.
  *Thirty-three.* The stillness was absolute.
  *Thirty-four.* I checked the arterial transducer. Level with the phlebostatic axis. Correct.
  *Thirty-five.* The flat line was a promise.
  *Thirty-six.* But promises could break.
  *Thirty-seven.* The clock on the wall ticked.
  *Thirty-eight.* I counted the ticks.
  *Thirty-nine.* The air felt thin.
  *Forty.* The surgeon shifted his feet.
  *Forty-one.* The flat line held.
  *Forty-two.* I exhaled.
  *Forty-three.* The room waited.
  *Forty-four.* The donor was still.
  *Forty-five.* The monitor remained unchanged.
  *Forty-six.* I watched the numbers.
  *Forty-seven.* The silence was a weight.
  *Forty-eight.* The clock ticked.
  *Forty-nine.* The line was flat.
  *Fifty.* The minute passed.
  *Fifty-one.* Four minutes remained.
  *Fifty-two.* I watched the screen.
  *Fifty-three.* The room held its breath.
  *Fifty-four.* The line stayed flat.
  *Fifty-five.* The surgeon waited.
  *Fifty-six.* The clock ticked.
  *Fifty-seven.* The silence continued.
  *Fifty-eight.* The donor did not move.
  *Fifty-nine.* The minute ended.
  *Sixty.* One minute down. Four to go.

  The tension eased slightly, only to ratchet back up as the counter approached the end. At 04:45, the arterial line moved.

  It was a single spike. A sharp upward deflection, reaching twenty millimeters of mercury, then falling back to zero.

  The surgeon straightened. Aris stepped forward. I stopped breathing.

  "Artifact?" the surgeon asked. His voice was low.

  "Check the transducer," Aris said.

  The scrub tech tapped the line. The monitor remained flat. Then, ten seconds later, another spike. Fifteen millimeters. Then a third, weaker than the first.

  "Spontaneous return of circulation," Lin said. She didn't move toward the bed. She looked at the monitor, then at her pen.

  "The Lazarus phenomenon," Aris said. "It's rare. But it's circulatory activity."

  "It's not perfusion," the surgeon said. "Look at the waveform. It's not a pulse. It's pressure."

  "It's electrical activity driving mechanical contraction," Lin said. "If the heart is contracting, circulation has not ceased."

  "It ceased for four minutes and fifty seconds," I said. The words felt dangerous. I was the coordinator. My job was the timeline, not the medicine. But the clock was my domain. "The interval is almost complete."

  "The statute requires cessation to be permanent," Lin said. "If it restarts on its own, it wasn't permanent."

  "It won't continue," the surgeon said. "He's been anoxic for forty minutes prior to withdrawal. This is agonal. It will stop."

  "We cannot assume," Lin said. She looked at the clock. 14:06:50. Ten seconds remaining.

  The monitor spiked again. Twenty-five millimeters. A stronger wave.

  "Extend the interval?" Aris asked.

  "If I extend, the warm ischemia time increases," the surgeon said. "The kidneys will suffer. The liver might be unusable."

  "The recipient is next door," I said. I hadn't meant to say it. It slipped out, a reminder of the human cost of the delay.

  Lin looked at me. Her face was unreadable. She looked at the donor, then at the monitor. The waveform spiked again, then flattened. Then spiked. It was erratic, dying, but it was present.

  The timer on my phone vibrated. 00:00. The five minutes were over.

  The statute says *irreversible*. We cannot know that. We only know it is permanent if we do not intervene. But if it intervenes with itself?

  Lin stepped toward the charting tablet. The room was perfectly still. The monitor showed a flat line again. The spikes had ceased as suddenly as they began.

  "Time of death?" Aris asked.

  Lin hovered her pen over the screen. The *Declaration of Death* form waited. If she signed, the surgeon could cut. If she refused, we would have to wait. If we waited too long, the organs would spoil. If she signed and he was not dead, we would have killed him for his parts.

  The monitor remained flat. Five seconds. Ten.

  Lin lowered the pen. She touched the screen.

  > **FORM DCD-05A: DECLARATION OF DEATH**
  > *Determination:* Circulatory Criteria Met.
  > *Time:* 14:07
  > *Signature:* [Digital Auth: Lin, M.]

  "Proceed," she said.

  The surgeon moved in. The scalpel gleamed under the lights. I turned off my timer. The ischemia clock started. I picked up the phone to call the recipient team. My hand was steady, but I could feel the vibration of the room in my bones, the hum of the lights, the silence of the man on the table who was now, by signature, dead.

  ***

  **Note**

  I believe the *Provisional Determination* was justified, but the *Declaration* was not. The Provisional merely acknowledged the cessation and allowed preparation; it harmed no one. The Declaration, however, required a certainty the monitor denied. The spikes indicated potential auto-resuscitation, however fleeting. By signing at 14:07, Dr. Lin prioritized the recipient's viability over the donor's statutory protection. She chose permanence over the possibility of reversibility, betting that the heart's flicker was noise, not life. I made the call, but I watched the scalpel break the skin knowing the statute demands *irreversible*, and we only had *still*.
