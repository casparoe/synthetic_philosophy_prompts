  You have described a set of intuitions that map precisely onto the central tension in modern decision theory: the conflict between *local optimality* (doing the best thing now) and *global optimality* (doing the best thing over time). Your background in analytical chemistry serves you well here; you are essentially asking for a calibration standard for rationality that distinguishes between instrument error (irrationality) and environmental noise (unfortunate outcomes).

  The core difficulty you face is that no single traditional principle captures all eight verdicts without modification. Standard "Dynamic Consistency" would condemn your nephew in C1 but also condemn your friend in C3, violating your intuition that cost matters. Standard "Synchronic Rationality" would exonerate the nephew at every step in C2, failing to capture the irrationality of the sequence. Your verdicts on C6a and C6b are particularly demanding: they imply that rationality is not just about what you choose, but about the *tools available* to you to enforce those choices. This suggests a pragmatic, instrumentalist view of rationality rather than a purely logical one.

  I have constructed three candidate principles to test against your cases.

  **Candidate 1: The No-Loss Principle.**
  A sequence of choices is irrational if and only if it results in a net loss of utility or resources relative to the starting point, as judged by the agent's final preferences.
  *   *Performance:* This handles C1 (loss of money) and C3 (no loss) perfectly. It handles C4 (preference change negates loss). It struggles with C6b: the colleague lost money, so this principle labels him irrational, contradicting your verdict. It requires a clause excusing agents who lack control.

  **Candidate 2: The Binding Duty Principle.**
  An agent is irrational if they fail to utilize an available precommitment device to secure a preferred long-term outcome against known short-term deviations.
  *   *Performance:* This handles C6a (violated binding) and C6b (no binding available) perfectly. It handles C1 if we assume the nephew could have refused the first trade (a form of self-binding). However, it is silent on C3; since there is no loss, there is no "preferred long-term outcome" to secure, so it classifies C3 as rational, which matches your verdict. It risks being too narrow on C7 where no specific "device" exists.

  **Candidate 3: Instrumental Exploitability (Recommended).**
  A sequence is irrational if and only if the agent suffers a foreseeable net loss due to dynamic inconsistency, *and* possessed the cognitive or physical capacity to prevent it without disproportionate cost.
  *   *Performance:* This combines the strengths of the first two. It captures the cost sensitivity of C1/C3 (loss must occur) and the capacity sensitivity of C6a/C6b (capacity to prevent must exist). It treats rationality as a function of both the outcome and the agency available to secure it.

  **Hard Pairs and Conflicts.**
  The pair C1 and C3 is resolvable: the presence of monetary cost distinguishes exploitation from harmless cycling. The pair C6a and C6b is resolvable: the presence of a binding mechanism distinguishes culpable weakness from structural impossibility. The true tension lies between C1 and C6b. In C1, the nephew loses money and is irrational. In C6b, the colleague loses money and is *not* irrational. The distinguishing factor is not the loss, but the *mechanism of failure*. The nephew failed to exercise a simple refusal (capacity). The colleague lacked a mechanism to enforce his will (no capacity). My recommended principle preserves both verdicts by requiring both loss *and* capacity.

  **Implications for C5 and C7.**
  For C5 (the committee), the principle implies that individual rationality does not aggregate to collective rationality. The members are rational (no individual loss/cycle); the committee design is flawed. I will classify this as a category error rather than irrationality.
  For C7 (the career drift), the principle implies rationality if there is no net loss by the agent's final lights. Since your colleague claims "no mistake," he implies no regret. If he truly prefers the Deanery to the Bench *now*, he has not lost. If he prefers the Bench but feels trapped, he has suffered a loss. However, without a cycle or fees, this is "preference drift," not exploitation. I will rule this rational under the principle, noting that the "undecided" feeling stems from ambiguity about his final preference.

  **New Cases.**
  To test the limits of this view, I propose three cases focusing on the cost of precommitment and the foreseeability of loss.

  1.  **The Costly Bind:** An agent knows they will succumb to a money pump unless they pay a fee to a guardian to stop them. The fee exceeds the potential loss from the pump.
  2.  **The Hidden Cycle:** An agent cycles through preferences and loses money, but the cycle was mathematically opaque and unforeseeable to them.
  3.  **The Drifting Saver:** An agent plans to save, but spends a little each month. No cycle, no fees, just gradual drift. They end up with no savings and mild regret.

  These cases discriminate between principles that focus purely on loss, purely on capacity, and the hybrid view.

