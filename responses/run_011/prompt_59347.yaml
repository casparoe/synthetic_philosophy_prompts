      *(Self-Correction on the "Truth" of MU)*: Wait, strictly speaking, inside the system, MU has no truth value. Outside the system, the statement "MU is not a theorem" is a true statement *about* the system. The friend says "MU is a true statement." That's category error. I need to be precise there.

      *(Self-Correction on Decision Procedure)*: The friend says "a program can't [see that their own Gödel sentence is true]." This is the Lucas-Penrose argument. It applies to *consistent formal systems capable of arithmetic*. MIU is not capable of arithmetic. So the friend is applying a theorem about TNT to MIU.

