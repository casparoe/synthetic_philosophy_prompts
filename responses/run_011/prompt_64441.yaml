prompt: |-
  ok so im a third-year history student and this semester I'm stuck—I mean, enrolled—in a historiography seminar that is way more theory-heavy than the course description implied. We did Butterfield's *The Whig Interpretation of History* (1931) a few weeks back and I genuinely loved it, mostly because it's short and because it made me feel personally attacked about how I write essays. The final project is "creative scholarship": we can submit something satirical as long as it comes with a 500-word rationale, which I'm writing separately, so don't worry about explaining the theory anywhere in the piece itself. What I want to hand in is the visitor guide for a museum exhibition that does not exist and could never be funded, one that is so completely Whig that it physically hurts, and I have the whole concept but every time I try to write the actual labels I end up explaining the joke instead of doing it. So can you write the guide for me? Also please no bibliography or list of sources in it, my prof specifically said the creative piece should stand alone and my reading list is already sorted.

  The exhibition is called GETTING HERE: Two Hundred Thousand Years of Almost-Us, at an invented institution — call it the Museum of the Long Run, in a made-up mid-size city, with its heritage wing sponsored by the charitable arm of a private equity firm (invent both names). I want about 700 words, formatted the way a real printed visitor guide is: a curatorial statement up front, then the rooms in order (six of them), a paragraph on the audio guide, the big touchscreen in the central hall, and the gift shop you have to walk through on the way out. Invent the artifacts — please don't use famous ones, I want it to read like a specific building that a specific person walked through, not like a Wikipedia summary of progress.

  The governing rule is that nothing in the museum is ever described in its own terms. Every single label has to tell you what the object was a step toward, and the further back you go the thinner the description of the thing itself gets, until the earliest room is basically a wall of arrows. A few specifics I'd like you to hit: one of the six rooms should be about something enormous that led nowhere at all, and the museum can't say that, so it has to handle it institutionally — a corridor, a sign saying the room is temporarily closed for reinstallation, a note that visitors short on time may skip it without missing anything essential. Two rooms should be flat-out anachronistic in their vocabulary, labelling medieval objects in modern political language as though everyone involved had read a newspaper. The audio guide narrator should keep reaching for some version of "little did they know," and there should be a separate children's track. The touchscreen lets you drag historical figures onto the correct side of Progress, and it's calibrated so that the correct side is always the one you'd expect, with a little chime. Somewhere near the end, include one small piece of dissent — a visitor comment card, or a Post-it from an assistant curator left on a wall text — and then show the institution cheerfully absorbing it, as merchandise or as a revision. Most importantly, the curators have to be sincere and even a bit moving in that statement up front: they believe they're being generous to the dead by giving them a destination, and that's the joke, not that they're cynical. Keep it deadpan the whole way, no winking, no authorial aside, and please don't use the words presentism, teleology, anachronism or Whig anywhere in it — if the piece needs those words it isn't working. A historiographer should be able to name every move being made just from the labels, and someone who's never heard of Butterfield should still find it funny.
