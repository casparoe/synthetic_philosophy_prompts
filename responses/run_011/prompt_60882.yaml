answer: |-
  Here is the move-by-move breakdown, the overall verdict, and the practical way out.

  ### The Move-by-Move Scorecard

  **1. Marta: "Promising exists precisely so that you can't change your mind..."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This captures the basic intuition of promissory obligation (often called an "exclusionary reason"). The point of a promise is to take the option of "changing my mind because it's inconvenient" off the table. If you can wiggle out whenever the balance of reasons shifts, you haven't made a promise; you've made a prediction.

  **2. Elias: "Promising isn't a magic trick... Keeping it is a real reason but not an infinite one."**
  *   **Rating:** **Leaning Right.**
  *   **Justification:** He is correct that promises are not absolute (duress or impossibility can void them) and that they serve a social function (coordination). However, he is dangerously close to saying "I break promises whenever I find a better reason," which undermines the utility he claims to value.

  **3. Marta: "On your view there was no promise at all... That's prediction and expectation-management."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is a devastating logical trap. If Elias argues that the obligation comes *only* from the usefulness of reliance, he admits that if reliance is no longer useful (because the PI changed the rules), the obligation vanishes. But if the obligation vanishes that easily, he never actually promised; he just guessed he'd be able to do it. He can't have it both ways.

  **4. Elias: "There's an institutional allocation procedure now... moves inside a social game with rules."**
  *   **Rating:** **Clearly Mistaken.**
  *   **Justification:** This is his weakest move. A PI's lottery assigns *resources*, it does not automatically void private *contracts* between lab members unless the PI explicitly said "all prior agreements are null." Informal agreements persist alongside institutional rules unless they are physically incompatible (which they aren't; Elias can give the slot to Marta). He is conflating "I was assigned this" with "I am morally permitted to keep this."

  **5. Marta: "Release only makes sense if the obligation is owed *to me*... rather than a contribution to the general good."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the knockout punch. The power to "release" someone from a promise is unique to promissory obligation. You cannot release someone from a general duty to be kind, but you can release them from a promise to you. This proves the obligation is a specific authority Marta holds over Elias, not just a general calculation of social welfare.

  **6. Elias: "The fact that it's *your* call shows the obligation exists to protect your interest..."**
  *   **Rating:** **Leaning Mistaken.**
  *   **Justification:** He is trying to co-opt Marta's point to fit his "welfare" story. While true that promises protect interests, this doesn't answer *why* he gets to decide that Jo's interest now outweighs Marta's established claim. It's a defensive shuffle that admits he owes her something but refuses to name the debt.

  ### Who is More Right Overall?

  **Marta wins the argument; Elias faces the dilemma.**

  Marta is philosophically correct: A promise was made, it created a specific obligation owed to her, and Elias cannot unilaterally dissolve it by citing a change in convenience or a new lab member. Elias is trying to use moral philosophy to talk his way out of a moral commitment he voluntarily undertook.

  However, Elias is right about the **conflict of duties**. He now has two competing moral claims: Marta's (based on promise) and Jo's/PI's (based on fairness and institutional authority). He is wrong to pretend the promise doesn't exist, but he is right that keeping it might cause greater harm to the lab ecosystem now.

  ### The Biggest Thing Both Are Ignoring

  **The PI's Authority and the Possibility of Trade.**

  Both are treating the January slots as a fixed pie that must be surrendered or kept.
  1.  **The PI:** The slots were assigned by the PI. If the promise is binding, the correct move isn't for Elias to secretly surrender slots; it's for Elias to tell the PI, "I have a prior commitment to Marta, Jo needs these slots more, can we reshuffle?" They are fighting a battle over a resource controlled by a third party who doesn't know the rules of engagement.
  2.  **Compensation:** They are treating this as binary (Elias keeps slots vs. Marta gets slots). Promissory obligations can often be satisfied through **compensation** if exact performance becomes overly costly. If Elias keeps the slots, he owes Marta a significant debt (e.g., she gets first claim in February, or he processes her data). They are arguing about *principle* to avoid negotiating a *trade*.

  ### Practical Advice: What Elias Should Do Monday Morning

  Do not simply keep the slots, and do not simply hand them over in silence. Both options damage lab trust.

  1.  **Acknowledge the Debt:** Start by telling Marta, "You're right. I made a promise, and I shouldn't have treated the lottery as a get-out-of-jail-free card. I apologize for dismissing that." This disarms the moral anger immediately.
  2.  **Explain the Conflict, Not the Excuse:** Lay out the Jo situation transparently. "Jo has a hard deadline and no data. If I give you the slots, she misses hers. I'm stuck between my promise to you and fairness to her."
  3.  **Propose a Remedy, Not a Surrender:**
      *   **Option A (The Swap):** Elias keeps the January slots but guarantees Marta priority for *all* of February, plus he offers to help process her images to speed up her deadline.
      *   **Option B (The PI Mediation):** Elias goes to the PI with Marta. "We have a conflict. I promised Marta priority, but Jo has a critical deadline. Can we adjust the schedule so Jo gets January, Marta gets February priority, and I take the hit on March?"
  4.  **The Bottom Line:** Elias must accept that he "bought" this problem with his September words. He has to pay the cost, either in microscope time or in labor/political capital. He cannot simply walk away.

  **Referee's Note:** If they keep arguing philosophy, tell them to stop. This isn't a seminar; it's a lab. The person who cares more about the *microscope* than the *promise* loses the trust of the group, which costs more than any imaging slot. Tell Elias to pay the debt.
