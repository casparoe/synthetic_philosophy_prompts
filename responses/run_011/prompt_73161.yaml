answer: |-
  This is an impressive reconstruction for notes scribbled at a rest stop. You captured the broad architecture of the debate (paraconsistency vs. trivialism, the Liar, the cost of changing logic) very well. However, you have inadvertently smashed together two different technical solutions to the paradox, and there are a few specific claims about Graham Priest's system that are technically inverted.

  Here is the breakdown of your reconstruction, sorted by accuracy, followed by answers to your specific technical questions.

  ### Part 1: Line-by-Line Grading

  **1. "Paraconsistent logic is any logic where you don't automatically get everything from a contradiction... ex contradictione quodlibet... trivial meaning every sentence in the language comes out true."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is the textbook definition. You nailed the motivation: blocking "explosion" (ECQ) to prevent triviality.

  **2. "Dialetheism is the separate view that some contradictions really are true, and it is not trivialism, because dialetheists only accept the small handful of contradictions the paradoxes force on them."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** Crucial distinction. Dialetheism is the view that *some* contradictions are true; Trivialism is the view that *all* sentences are true. Priest is a dialetheist, not a trivialist.

  **3. "The route Graham Priest takes is to add extra truth values... in particular the 'neither' value, and then to give the Liar... that value, so the sentence comes out neither simply true nor simply false."**
  *   **Verdict:** **Mistake.**
  *   **Comment:** This is the biggest technical error in your notes. You have described a "truth-value gap" theory (like K3 or supervaluationism). Priest's system (LP, or Logic of Paradox) uses a "truth-value glut." He assigns the Liar the value **Both** (True and False), not **Neither**.
      *   *Neither:* The sentence fails to be true and fails to be false.
      *   *Both:* The sentence succeeds at being true and succeeds at being false.
      *   Priest is firmly in the **Both** camp.

  **4. "That is exactly what he means when he says the Liar is both true and false, and it's why the law of non-contradiction has to be abandoned as a logical law."**
  *   **Verdict:** **Accurate (with nuance).**
  *   **Comment:** Since you corrected the previous point to "Both," this follows. If a sentence is Both, then $A \land \neg A$ is true (at least in the sense that it holds). Therefore, the Law of Non-Contradiction cannot be a universal law that forbids this.

  **5. "Once you've done that you also have to give up modus ponens, since modus ponens is the thing that would let you slide from one contradiction to any old conclusion you like."**
  *   **Verdict:** **Mistake / Confusion.**
  *   **Comment:** You are right that Modus Ponens fails in Priest's basic system (LP), but your reasoning mixes up two different rules.
      *   **Explosion (ECQ):** This is the rule that lets you slide from a contradiction to *any* conclusion ($A \land \neg A \vdash B$). Paraconsistent logic blocks *this* rule.
      *   **Modus Ponens (MP):** This is the rule ($A, A \to B \vdash B$). In LP, MP fails, but not because it causes explosion directly. It fails because you can have a premise that is "Both" and a conclusion that is "False," which violates validity (preservation of truth).
      *   *Correction:* You give up Explosion to avoid triviality. You *incidentally* lose Modus Ponens as a cost of the system you used to block Explosion.

  **6. "The nice part is that the same move handles the strengthened Liar... so there's no revenge problem left over."**
  *   **Verdict:** **Loose Simplification.**
  *   **Comment:** Priest *claims* this, but it is the most contested part of his theory. Many logicians argue the "Revenge Liar" (e.g., "This sentence is not true-or-both") still breaks the system. It is not universally accepted that the problem is solved.

  **7. "Dialetheism isn't a claim about the world being inconsistent, it's a claim about how we ought to manage our beliefs..."**
  *   **Verdict:** **Mistake.**
  *   **Comment:** This contradicts your earlier (correct) definition that "some contradictions really are true." Priest's view is alethic (about truth), not merely epistemic (about belief management). He argues that truth itself can be contradictory. If the guest got irritated when the host said "reality is contradictory," the guest might have been making a fine distinction between *semantic* contradictions (language) and *ontological* ones (objects), but your summary suggests dialetheism is *only* about belief management, which Priest would reject.

  ---

  ### Part 2: Pinning Down the Technical Details

  Here are the specific answers to the questions you flagged.

  **1. "Neither" vs. "Both": Did I smash two approaches?**
  Yes, you did.
  *   **The "Neither" Approach (Paracomplete):** This says the Liar is meaningless or has no truth value. This preserves Classical Logic rules (like Modus Ponens) but forces you to say the Liar isn't true. (Systems: K3, Supervaluationism).
  *   **The "Both" Approach (Paraconsistent/Dialetheic):** This says the Liar is meaningful and has *too much* truth value. It is True and False. This preserves the intuition that the Liar is a genuine sentence but forces you to change Logic rules. (System: LP).
  *   **Priest's Position:** Priest is the champion of the **Both** (Glut) approach. Your notes describe the **Neither** (Gap) approach in the middle, then switch back to **Both** at the end.

  **2. Is dialetheism just saying the sentences are ambiguous?**
  No. Ambiguity implies the sentence has two *different meanings* (like "bank" of a river vs. "bank" for money). Dialetheism claims the sentence has one meaning, and that meaning satisfies the conditions for Truth and the conditions for Falsehood simultaneously. It is not a linguistic confusion; it is a truth-value overlap.

  **3. Does Modus Ponens fail in Priest's system?**
  Yes, in the standard formulation (LP).
  *   **In your intro logic course:** You learned Classical Logic. In Classical Logic, Modus Ponens is valid. Your memory of the course is correct.
  *   **In Priest's LP:** Modus Ponens is invalid.
  *   **Why?** Validity is defined as "If premises are True, conclusion must be True." In LP, "True" includes "Both."
      *   Imagine $A$ is **Both**.
      *   Imagine $A \to B$ is **Both**.
      *   It is possible for $B$ to be **False**.
      *   Since the premises were "True" (Both counts as true) but the conclusion is "False," the inference failed.
  *   *Note:* Priest has developed more complex conditionals to try to restore Modus Ponens, but in the basic three-valued system you heard about, MP is a casualty.

  **4. What happens to the Law of Non-Contradiction (LNC)?**
  This is subtle. The formula $\neg(A \land \neg A)$ actually *comes out true* (or Both) in LP. It is never strictly False.
  *   **What is rejected:** The *principle* that contradictions must be false. In Classical Logic, $A \land \neg A$ is always False. In LP, it can be Both.
  *   **The Rejection:** Priest rejects LNC as a *constraint* on reality. He accepts the formula, but denies that it rules out the possibility of $A$ and $\neg A$ both holding. So, you can say he "abandons it as a logical law" in the sense that it no longer functions as a veto on contradictions.

  **5. Does the Revenge Claim hold up?**
  This is the "soft spot" you suspected.
  *   **The Problem:** If you say the Liar is "Both," a new sentence can be constructed: "This sentence is *not* Both."
  *   **The Status:** Priest argues his system handles this, but critics argue it just pushes the paradox one step back. It is not a settled victory. If you treat your notes as "Priest claims there is no revenge problem," that is accurate to his pitch. If you treat it as "There is objectively no revenge problem," that is controversial.

  **6. Is the final sentence (belief management vs. reality) a real position?**
  It is a real position held by *some* philosophers (often called epistemicists or instrumentalists), but it is **not** Graham Priest's position.
  *   **Priest:** "Some contradictions are *true*." (Metaphysical/Semantic Realism).
  *   **Your Note:** "We ought to *manage beliefs*." (Epistemic/Pragmatic).
  *   **The Irritated Guest:** If the guest was Priest, he likely got irritated because the host was simplifying his view into "reality is messy" when Priest prefers to say "our best semantic theories entail contradictions." However, your final note goes too far the other way, making it sound like it's *only* about psychology. Priest believes the contradiction is in the truth conditions, not just in our heads.

  ### Summary of What to Un-Learn
  1.  **Un-learn "Neither":** Priest uses "Both" (True and False), not "Neither" (Gap).
  2.  **Un-learn the reason for MP failure:** Modus Ponens fails in LP, but Explosion (ECQ) is the rule that is *intentionally* blocked to stop triviality. MP failure is a side-effect.
  3.  **Un-learn the "Belief Management" moral:** Dialetheism is a claim about truth, not just a strategy for coping with confusion.

  You successfully grasped the *motivation* (avoiding triviality while accepting the Liar) which is the hardest part. The technical machinery (LP vs K3, MP vs ECQ) is easy to conflate without a whiteboard.
