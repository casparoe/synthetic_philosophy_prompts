answer: |-
  I. Axes of Disagreement

  1.  **Motivational Anchor:** Does the reason hook onto what the agent *now* feels, what they *would* feel if rational, or what *facts* exist independently?
  2.  **Scope of Constraint:** Does the requirement determine whether a reason *exists* at all, or only how *heavy* it is once it exists?
  3.  **Semantic Status:** If an agent is totally unmoved, is the claim "they have a reason" false, true but inert, or not truth-apt?
  4.  **Judgment-Motion Link:** Does believing you have a reason necessarily produce some motivation?
  5.  **Explanatory Role:** Must a reason be capable of explaining an action to count as a reason?

  II. Answer-Combinations (Logical Space)

  *   **A:** Actual Motivation + Existence Constraint + False if Unmoved.
  *   **B:** Idealized Motivation + Existence Constraint + True if Unmoved (via Ideal).
  *   **C:** Independent Facts + Existence Constraint + True if Unmoved.
  *   **D:** Independent Facts + Weight Constraint + True but Inert if Unmoved.
  *   **E:** Actual Motivation + Weight Constraint + True but Inert if Unmoved.
  *   **F:** Non-Cognitive Status + Any Constraint.
  *   **G:** Judgment Implies Motion + Any Constraint.
  *   **H:** Explanation Required + Any Constraint.
  *   **I:** Reasons Constructed + Any Constraint.
  *   **J:** Reasons as Evidence + Any Constraint.

  III. Decision Tree

  **Node 1: The Deathbed Promise**
  An agent promises to destroy a manuscript, then later feels nothing about it. Is the claim "You have a reason to destroy it" true?
  *   (A) No, it is false. → Go to Node 2.
  *   (B) Yes, it is true. → Go to Node 3.
  *   (C) It is not the sort of thing that is true or false. → **Leaf 1**

  **Node 2: The Drowning Child (Existence Check)**
  A rational bystander watches a child drown and has nothing in their makeup served by saving her. Does a reason to save her exist?
  *   (A) No. → **Leaf 2**
  *   (B) Yes. → Go to Node 3.

  **Node 3: Source of the Force**
  If the reason exists in the drowning case, where does it come from?
  *   (A) The fact of the child's need alone. → Go to Node 4.
  *   (B) The agent's motivational set (actual or stretched). → Go to Node 5.

  **Node 4: The Unconvertible Agent**
  Suppose an agent cannot be argued into caring, only converted by brainwashing. Do they still have the reason?
  *   (A) Yes, the reason remains. → Go to Node 6.
  *   (B) No, accessibility matters. → **Leaf 3**

  **Node 5: The Stretch Limit**
  How far do we stretch the agent's motivational set to find the reason?
  *   (A) Only to what they actually have now. → **Leaf 4**
  *   (B) To what they would have if fully informed and rational. → **Leaf 5**

  **Node 6: Weight vs. Existence**
  Two people have a reason to visit a sick relative; for one it is decisive, for the other it is weak. Is the reason the same?
  *   (A) Yes, the weight differs. → Go to Node 7.
  *   (B) No, the existence differs. → **Leaf 6**

  **Node 7: The Inert Truth**
  If an agent has a reason but is totally unmoved, is the claim "You have a reason" motivationally inert?
  *   (A) Yes, it is true but moves nothing. → **Leaf 7**
  *   (B) No, it must move them somehow. → Go to Node 8.

  **Node 8: Judgment and Motion**
  Does believing you have a reason have to move you even a little?
  *   (A) Yes, necessarily. → Go to Node 9.
  *   (B) No, you can believe it and feel nothing. → **Leaf 8**

  **Node 9: Explanation Requirement**
  Does a reason have to be the sort of thing that could explain an action to count?
  *   (A) Yes. → **Leaf 9**
  *   (B) No, it can be evidence without explaining. → **Leaf 10**

  **Node 10: Origin of Reasons (Constructivism Check)**
  Are reasons found in the world or made by agents?
  *   (A) Made by agreement/procedure. → **Leaf 11** (Merged with Leaf 9 for count)
  *   (B) Found in the world. → (Already sorted above)

  *Correction to meet ~10 Leaves constraint:* I will consolidate the paths above into the final 10 leaves below.

  **IV. Positions (Leaves)**

  1.  **Error Theory:** (Node 1A → Node 2A) *Commitment:* "Every time anyone says they have a reason to do anything, they are speaking falsely."
  2.  **Williams-Actual:** (Node 1B → Node 3B → Node 5A) *Commitment:* "You have no reason to save the drowning child if nothing in your current psyche cares about children."
  3.  **Smith-Idealized:** (Node 1B → Node 3B → Node 5B) *Commitment:* "You have a reason to save the child because a version of you that isn't you would care."
  4.  **Scanlon-External:** (Node 1B → Node 3A → Node 4A → Node 7A) *Commitment:* "The child's pain gives you a reason even if you are incapable of caring about pain."
  5.  **Hard Externalist:** (Node 1B → Node 3A → Node 4A → Node 7B → Node 8A) *Commitment:* "Reason alone forces motivation even if you have no desires to support it."
  6.  **Hybrid (Exist-Ext/Weight-Int):** (Node 1B → Node 3A → Node 4A → Node 6A → Node 7A) *Commitment:* "You have a reason to save the child, but it has zero weight for you if you don't care."
  7.  **Hybrid (Exist-Int/Weight-Ext):** (Node 1B → Node 3B → Node 6B) *Commitment:* "You only have a reason if you care, but if you do, it weighs the same for everyone."
  8.  **Expressivism:** (Node 1C) *Commitment:* "Claiming someone has a reason is just expressing approval, not stating a fact."
  9.  **Reasons-as-Evidence:** (Node 1B → Node 3A → Node 8B → Node 9B) *Commitment:* "Reasons are just clues about what you ought to do, not the ground of the obligation."
  10. **Unoccupied (Inert Internalism):** (Node 1B → Node 3B → Node 5A → Node 7A) *Commitment:* "You have a reason based on your actual desires, but it doesn't have to move you."

  **V. Indistinguishable Pairs and Empty Cells**

  *   **Indistinguishable Pair:** **Williams-Actual (Leaf 2)** and **Smith-Idealized (Leaf 3)** are often near-indistinguishable from the inside. If the "actual set" is stretched to include procedural rationality, the verdict on the drowning child matches the idealized view, making the dispute purely metaphysical rather than practical.
  *   **Empty Cell:** **Hybrid (Exist-Int/Weight-Ext) (Leaf 7)** is unoccupied because it is unattractive. It grants the externalist the universality of weight while granting the internalist the existence constraint, satisfying neither camp's core intuition about normativity.
  *   **Empty Cell:** **Unoccupied (Inert Internalism) (Leaf 10)** is empty because it is incoherent. If a reason depends on actual motivation but does not require motion, it loses the explanatory link that defines the internalist project.

  You and your friend should have hit Node 6 first, because distinguishing whether a constraint kills the reason or just lightens it dissolves half the verbal dispute.
