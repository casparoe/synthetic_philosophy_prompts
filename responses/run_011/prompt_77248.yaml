answer: |-
  Here is a complete seminar design, built to your specifications. It avoids the word "constitution" until the debrief, forces the students to inhabit both the bound self and the binding enforcers, and introduces the critical uncertainty where the "tempted" self might actually be correct.

  # Activity Title: The Mast & The Crew

  **Time:** 100 Minutes
  **Students:** 16 (4 tables of 4)
  **Materials:** Index cards (for secret roles/round types), tokens (poker chips or printed slips), whiteboard for payoff tables.

  ## Part 1: The Setup (15 Minutes)

  **Room Arrangement:** 4 tables of 4 students.
  **Roles:** At each table, 1 **Captain**, 3 **Crew**. (Roles will rotate).
  **Currency:** "Tokens." (Tell them: *Top 3 individuals across the room get 2 participation points, next 5 get 1 point. Everything else is bragging rights.*)

  **The Narrative (Read this, do not lecture):**
  > "You are on a voyage. There are two states of the world: **Calm** and **Storm**.
  >
  > In **Calm**, the safe course is best. In **Storm**, the safe course is dangerous, and you need to change direction immediately.
  >
  > **Phase 1:** Before you know if it is Calm or Storm, the Captain chooses a **Bond**. This is a penalty they pay if they change course later. The Crew signs a **Pledge**: they agree to vote *against* changing course to earn a Stability Bonus.
  >
  > **Phase 2:** The weather is revealed. The Captain may *request* to change course. The Crew votes. If the Crew allows it, the Captain pays the Bond. If the Crew refuses, the Captain stays the course.
  >
  > **Goal:** Maximize your token count."

  **The Payoff Structure (Write on Board):**

  | | **Stay on Course** | **Change Course** |
  | :--- | :--- | :--- |
  | **If CALM** | Captain: 20 <br> Crew: 1/3 of Cap + **6 Bonus** | Captain: 10 − **Bond** <br> Crew: 1/3 of Cap (No Bonus) |
  | **If STORM** | Captain: 5 <br> Crew: 1/3 of Cap + **6 Bonus** | Captain: 30 − **Bond** <br> Crew: 1/3 of Cap (No Bonus) |

  *Note: Crew splits the Captain's final score equally. The "6 Bonus" is per Crew member.*

  ---

  ## Part 2: Phase 1 — The Pact (15 Minutes)

  1.  **Captain's Choice:** The Captain privately selects a **Bond Level** (0, 5, or 10 tokens) and writes it on a card. This represents how hard it is to untie them.
  2.  **Crew's Pledge:** The three Crew members discuss and sign a "Pledge Card." It reads: *"We agree to vote NO on course changes to secure the Stability Bonus."*
      *   *Crucial Constraint:* They must sign this *before* knowing the weather. They are binding their future selves to ignore future pleas.
  3.  **Submission:** Cards go to you (the instructor). You do not look at them yet.

  ---

  ## Part 3: Phase 2 — The Voyage (40 Minutes)

  Run **4 Rounds**. Rotate roles after Round 2 so everyone is Captain once and Crew once.

  **The Twist (The Siren's Knowledge):**
  For each table, you (the instructor) hold a deck of 4 Weather Cards (2 Calm, 2 Storm, shuffled).
  *   **Round 1 & 2:** Reveal Weather.
  *   **The Request:** If the weather is **Storm**, the Captain *should* logically want to switch (30 − Bond > 5). If **Calm**, they should stay (20 > 10 − Bond).
  *   **The Plea:** If the Captain wants to switch, they must stand up and publicly beg the Crew. They can explain *why* (e.g., "We're going to crash!").
  *   **The Vote:** The Crew votes publicly (Show of hands). Majority rules.
      *   **If Vote = NO:** Pact holds. Crew gets the 6 Bonus. Captain stays (even in Storm).
      *   **If Vote = YES:** Pact broken. Crew loses the 6 Bonus. Captain switches (pays Bond).

  **Scoring:**
  After each round, tally tokens.
  *   *Example Storm Round:* Bond was 5. Crew votes YES.
      *   Captain: 30 − 5 = 25.
      *   Crew: (25 / 3) = 8.3 tokens each. (No Bonus).
  *   *Example Storm Round:* Bond was 5. Crew votes NO (Honoring Pledge).
      *   Captain: 5.
      *   Crew: (5 / 3) + 6 = 7.6 tokens each.

  *Notice the tension:* In a Storm round, the Crew makes *more* tokens by breaking the pact (8.3 vs 7.6), but they violate their Phase 1 Pledge. In a Calm round, they make *more* by honoring the pact. The Crew must decide: Do we follow the rule we made when we were calm, or do we optimize for the emergency happening now?

  ---

  ## Part 4: The Debrief (30 Minutes)

  **Do not use the word "Constitution" until the last 5 minutes.**

  **1. The Data (5 mins)**
  Ask for a show of hands:
  *   "How many Captains chose a Bond of 10?" (High commitment)
  *   "How many Crews voted YES in a Storm round?" (Broke the pact)
  *   "How many Crews voted NO in a Storm round?" (Honored the pact, Captain suffered)

  **2. Mapping the Concepts (15 mins)**
  Draw three columns on the board. Fill them in with student observations.

  *   **Column 1: Unable vs. Unwilling.**
      *   *Ask:* "Captains, when you had a Bond of 10, were you *unable* to switch, or just *unwilling*?"
      *   *Point:* The Bond made it financially irrational to switch (Unable). The Crew's Pledge made them socially unwilling to vote YES.
      *   *The Ulysses Insight:* A constitution works when it makes violation *impossible* (limbs tied) OR when it makes enforcers *unwilling* to listen (ears waxed). Which was harder in the game? (Usually the Crew's willingness).

  *   **Column 2: Ex-Ante vs. Ex-Post Value.**
      *   *Ask:* "In Phase 1, did the Bond feel costly? In Phase 2 (Storm), how did it feel?"
      *   *Point:* In Phase 1, the Bond was free insurance. In Phase 2, it was a shackle. The value of the device changes depending on *when* you ask.

  *   **Column 3: The Dead Hand (The Twist).**
      *   *Ask:* "Crew, in the Storm rounds, why did some of you vote NO even though you knew the Captain was right?"
      *   *Point:* You were protecting the Stability Bonus (the precedent). You were prioritizing the *rule* over the *outcome*.
      *   *The Hard Question:* "In those Storm rounds where you voted NO, the Captain got 5 points instead of 25. The earlier self (Phase 1) bound the later self (Phase 2) to a disaster. Was that legitimate? The Phase 1 self didn't know it was a Storm. Why should the Phase 2 self suffer for Phase 1's ignorance?"
      *   *This is the Dead Hand Problem:* The past binding the present, even when the present has better information.

  **3. The Reveal (10 mins)**
  Now you can use the C-word.
  *   "The Pact you signed is a **Constitution**."
  *   "The Bond is **Judicial Review / Supermajority Requirements**."
  *   "The Crew's Pledge is **Normative Constraint**."
  *   "The Storm Rounds are **Emergencies / Crises**."
  *   "The question we just played out: Is a constitution a tool to save us from ourselves, or a dead hand that prevents us from saving ourselves when the world changes?"

  ---

  ## Part 5: Honest Failure Modes & Limitations

  You asked for honesty about what will break. Here is the post-mortem of running this specific design.

  **1. The "Econ Kid" Problem**
  *   **What happens:** In Phase 1, one student will calculate the Expected Value. "If Storm is 50% likely, a Bond of 5 is EV negative. Everyone pick 0."
  *   **The Fix:** Do not tell them the probability of Storm vs. Calm. Tell them: *"The weather is unpredictable."* This forces them to rely on risk aversion rather than calculation. If they ask, say "It varies by round."
  *   **Why it matters:** Constitutionalism isn't about EV; it's about fear of the unknown.

  **2. Weaponized Enforcement (Collusion)**
  *   **What happens:** In Round 3, the Captain whispers to the Crew: "If you let me switch, I'll transfer 2 tokens to each of you from my future earnings."
  *   **The Fix:** Announce a "Corruption Rule": Any side-payments result in immediate disqualification of that table.
  *   **Why it matters:** Real constitutions struggle with this (lobbying), but in a 100-minute game, it destroys the mechanic. You want them fighting the *rules*, not bargaining around them.

  **3. The "Spite" Crew**
  *   **What happens:** Crew members realize that in Storm rounds, voting NO hurts the Captain more than it helps them (7.6 vs 8.3 is a small difference). They might vote NO just to exert power.
  *   **The Fix:** This is actually a feature, not a bug. It demonstrates *tyranny of the procedure*. In the debrief, highlight this: "The Crew became a court that valued its own bonus over the Captain's survival."

  **4. What This Game Cannot Reproduce**
  You need to supply this by hand in the debrief, because a 100-minute game with consenting adults cannot capture:
  *   **Violence/Coercion:** In the game, the Crew cannot physically force the Captain. In reality, constitutional enforcement relies on the state's monopoly on violence. The "Bond" here is points; in reality, it's jail or removal from office.
  *   **Generational Time:** The "Dead Hand" problem is most potent when the binders are *dead*. Here, the Captain and Crew are the same people rotating roles. You must explain: *"In reality, the Phase 1 self died 200 years ago. You are the Phase 2 self arguing with a ghost."*
  *   **True Uncertainty:** In the game, they know the payoff matrix. In reality, we don't know if the "Storm" is actually a Storm or a trick. The Sirens might be lying about the 30 points.

  **5. Time Management Warning**
  *   The scoring math (dividing by 3) will eat 10 minutes if you let them use phones.
  *   **Fix:** Pre-print scorecards with the math done, or assign one "Scribe" per table who is exempt from debate to handle the arithmetic.

  ## Summary of the "Twist" for your Debrief
  The core philosophical payload is in the **Storm Round / Vote NO** outcome.
  If the Crew honors the pact during a Storm, the Captain suffers.
  *   **Student Intuition:** "That's stupid, they should have saved him."
  *   **Your Counter:** "If they save him, they prove the Pact is worthless. Next time there's a Calm round, the Captain will lie and say it's a Storm. By letting him suffer now, they preserve the credibility of the Mast for the future."
  *   **The Tension:** Credibility vs. Welfare. That is the entire history of constitutional crisis.
