answer: |-
  (a) **The Principle: The Constitutive-Identity Account of Reasons**

  An agent $A$ has a normative reason to $\phi$ at time $t$ **if and only if** the following conditions are met:

  1.  **The Veridicality Clause:** $\phi$-ing must actually serve an end $E$ under the true description of the world.
      *   *Tag:* Case 1 (Gin/Petrol).
      *   *Function:* Blocks reasons generated by false belief, regardless of motivation.

  2.  **The Constitutive Needs Clause:** If $E$ is a constitutive good of agency or biological survival (e.g., health, basic functioning), $A$ has a reason to pursue $E$ regardless of $A$'s current motivational set.
      *   *Tag:* Case 3 (Depressive).
      *   *Function:* Grounds reasons in objective welfare when motivation is pathologically absent.

  3.  **The Endorsement Clause:** If $E$ is not a constitutive need, $A$ must currently identify with or endorse the desire for $E$ (or $E$ must be a side-effect of a trait $A$ endorses). Repudiation nullifies the reason.
      *   *Tag:* Case 5 (Dead Parent), Case 6 (Gambling vs. Generosity), Case 8 (AI Repudiation).
      *   *Function:* Ensures reasons are internally anchored to the agent's practical identity, blocking alien causes (DBS side-effects, leftover desires).

  4.  **The Objective Validity Clause:** Endorsement is necessary but not sufficient. $E$ must not be (a) morally impermissible or (b) pathologically self-destructive.
      *   *Tag:* Case 2 (Humiliator), Case 4 (Addict).
      *   *Function:* Distinguishes Case 2 and Case 4.
          *   If $E$ is morally impermissible (Case 2), endorsement fails to generate a reason *for*, and objective normativity generates a reason *against* (to stop).
          *   If $E$ is pathologically self-destructive (Case 4), endorsement fails to generate a reason *for*, and no overriding reason *against* is required to nullify it; the reason simply does not exist.

  5.  **The Identity Preservation Clause:** Any appeal to idealized deliberation (sound rationality, full information) must constrain the idealized deliberator to retain $A$'s core practical identity and projects. If full information would cause $A$ to abandon the projects that constitute $A$'s identity, the verdict of that idealized deliberator is irrelevant.
      *   *Tag:* Case 7 (Mathematician).
      *   *Function:* Prevents idealization from erasing the agent whose reasons are being adjudicated.

  6.  **The Corporate Capacity Clause:** If $A$ is a collective agent with irreducible decision-making structures, $A$ can have reasons irreducible to the reasons of its members.
      *   *Tag:* Case 9 (Laboratory).
      *   *Function:* Allows reason-attribution to groups without reductionism.

  ***

  (b) **Candid Accounting**

  **Can all nine verdicts be saved?**
  Yes, but at the cost of **theoretical heterogeneity**. The principle above is a hybrid: it combines Internalist constraints (Endorsement, Identity) with Externalist constraints (Constitutive Needs, Objective Validity). It requires a metaphysics of "practical identity" to handle Case 7 and a metaphysics of "corporate agency" to handle Case 9.

  **The Simplest Rival:**
  The simplest rival is **Standard Williamsian Internalism** (Reasons are elements of the actual motivational set reachable by sound deliberation).
  *   **Complexity Cost Saved:** It eliminates Clauses 2, 4, 5, and 6. It requires only a theory of sound deliberation.
  *   **Verdict Sacrificed:** It breaks **Case 2 (Humiliator)**, **Case 3 (Depressive)**, and **Case 9 (Laboratory)**.
  *   **Cheapest Sacrifice:** If forced to sacrifice exactly *one* verdict to simplify the principle, sacrifice **Case 9 (Laboratory)**.
      *   *Why:* Treating Case 9 as figurative (only individuals have reasons) allows you to drop the Corporate Capacity Clause. This preserves the psychological unity of the theory. The other cases (2, 3, 7) strike at the core of the internal/external debate regarding individual agency; Case 9 is an extension to collective subjects. Dropping it simplifies the ontology without collapsing the distinction between addiction and depression.

  ***

  (c) **Verdicts on New Cases**

  1.  **The Embraced Dominator:** A person whose inclination to dominate others is not repudiated but reflectively embraced and found satisfying.
      *   *Principle Verdict:* **No reason to dominate; Reason to stop.**
      *   *Derivation:* Fails the **Objective Validity Clause (4a)**. Moral impermissibility nullifies the reason generated by endorsement and generates a reason against. (Matches Case 2).

  2.  **The Value-Changer:** An agent who would be moved to act only after a change in her values that she would now regard as a loss of herself rather than a gain.
      *   *Principle Verdict:* **No reason to change/act.**
      *   *Derivation:* Violates the **Identity Preservation Clause (5)**. The idealized self that would act is not *her*. (Matches Case 7).

  3.  **The False Self-Belief:** A case in which sound deliberation from the actual motivational set yields a reason only by way of a route that requires the agent to acquire a false belief about herself along the way.
      *   *Principle Verdict:* **No reason.**
      *   *Derivation:* Violates the **Veridicality Clause (1)**. False beliefs (even about oneself) do not manufacture reasons. (Matches Case 1).

  4.  **My Case: The Contented Slave.** A slave who is well-treated, has no desire for freedom, endorses his status upon reflection, and suffers no physical deprivation.
      *   *Principle Verdict:* **Has a reason to seek freedom.**
      *   *Derivation:* Triggers the **Constitutive Needs Clause (2)**. Autonomy/Agency is a constitutive good of human functioning. Even if endorsement is absent (or repudiated), the objective need for agency generates a reason.
      *   *Where it comes out badly:* This is **Paternalism**. The principle overrides the agent's own reflective endorsement in the name of an objective "constitutive good." It risks imposing a specific conception of the good life (liberal autonomy) on an agent who rejects it. It strains the "Internal" commitment of the theory.

  ***

  (d) **The Internal/External Vocabulary**

  **Does it cease to do work?**
  Yes, in **Case 7 (Mathematician)**.

  **The Hidden Disagreement:**
  Both standard Internalists and Externalists assume a **stable subject** across the deliberation process.
  *   **Internalist:** "What would the agent want after deliberation?" (Assumes the 'agent' persists).
  *   **Externalist:** "What is objectively valuable?" (Assumes the 'agent' is the recipient).
  *   **Your Verdict:** "What would *this specific person* want, provided she remains *this specific person*?"

  The shared verdict (that she has a reason to continue) conceals a disagreement about **Diachronic Identity**. An Internalist might argue that if full information makes her quit, she *has* no reason to continue (because her idealized self says no). An Externalist might argue she has a reason to continue because math is valuable. You agree with the Externalist verdict but for an Internalist-adjacent reason (Identity Preservation). The vocabulary "Internal/External" fails to capture the **Metaphysics of the Agent** constraint. The real dispute is not about the *source* of reasons (mind vs. world), but about the **persistence conditions of the reason-bearer**.

  ***

  (e) **Settling Case 7**

  **Does the principle need a clause governing persistence?**
  **Yes.** The **Identity Preservation Clause (5)** is non-negotiable for your verdicts. Without it, standard idealization (full information + rationality) dictates she quits.

  **Refinement or Capitulation?**
  It is a **Refinement of Internalism**.
  *   *Why:* Pure Externalism does not care if the idealized deliberator is "her"; it cares about the Truth. Pure Internalism cares about "her" but usually allows the self to be rewritten by rationality. Your clause insists that the "Internal" source must be *continuous*. It prevents Externalism from sneaking in through the back door of "Idealization" (where the Ideal Self is effectively an External Observer). It keeps the authority within the agent, but protects the agent from being rationalized out of existence.

  **Which case was it really invented to handle?**
  It was really invented to handle **Case 4 (Addict)** and **Case 3 (Depressive)** jointly, by defining the boundaries of the "Motivational Set."
  *   In Case 3, the set is temporarily inaccessible (depression), but the *agent* persists, so reasons remain.
  *   In Case 4, the set is distorted (addiction), but the *agent* persists, so the distortion is rejected.
  *   Case 7 extends this: If rationality distorts the *identity* (mathematician becomes non-mathematician), the agent does not persist.
  *   Therefore, the clause is the **boundary condition for the "Internal" in Internalism**. It defines when a change in motivation is a *correction* (Case 1, 5) versus when it is a *replacement* (Case 7).
