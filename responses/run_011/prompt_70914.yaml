prompt: |-
  You are an expert in formal epistemology, Bayesian philosophy of science, and decision theory under ambiguity. Think carefully, and before sorting anything, brainstorm a full list of candidate defeaters.

  I'm a PhD student working on credal imprecision. The position I've come to hold has three parts. (1) Under severe evidential underdetermination — a coin of wholly unknown bias, a novel hypothesis with no relevant reference class — an agent is not merely permitted but *required* to adopt an imprecise credal state, a set of probability functions, rather than any sharp one; a sharp prior here manufactures precision the evidence cannot support. (2) The requirement is not idle: that imprecise state should survive at least a modest amount of incoming data, otherwise imprecision is a decorative property of the instant before updating erases it. (3) Dilational phenomena are a vindication rather than an embarrassment: evidence can widen an agent's spread precisely when it says nothing about the hypothesis in question.

  Map this view's exposure. Which formal results and which decision-theoretic objections — about an imprecise agent's inability to settle on a determinate choice, about exploitability, about the choice among decision rules for sets of probabilities — should actually move me? Are (1) and (2) in tension, and what must a defender sacrifice to keep both? What does this view predict that a sharp-Bayesian rival does not, and what evidence, including from human judgment under ambiguity or from systems trained on thin data, would bear on it? Which defeaters would a committed defender concede as counting against them, and which would they dismiss, and on what grounds? Rank everything from fatal to merely awkward. Finally: does the slogan that precision is required only where it isn't arbitrary amount to self-sealing, and if so, is that a defect in a normative thesis of this kind or an acceptable feature?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Role:** Expert in formal epistemology, Bayesian philosophy of science, and decision theory under ambiguity.
      *   **Task:** Brainstorm a full list of candidate defeaters for a specific three-part view on credal imprecision.
      *   **The View:**
          1.  *Requirement:* Severe underdetermination *requires* imprecise credences (sets of probabilities), not just permits them. Sharp priors manufacture false precision.
          2.  *Stability:* Imprecision must survive modest updating (not wash out immediately).
          3.  *Dilation:* Dilation (widening of credence upon receiving evidence) is a feature, not a bug (veridical reflection of ignorance).
      *   **Specific Questions to Address:**
          *   Map exposure (formal results, decision-theoretic objections).
          *   Tension between (1) and (2)? What must be sacrificed?
          *   Predictive differences vs. Sharp Bayesianism.
          *   Empirical evidence (human judgment, ML systems).
          *   Conceded vs. Dismissed defeaters.
          *   Ranking (Fatal to Awkward).
          *   Analysis of the slogan ("precision required only where it isn't arbitrary") regarding self-sealing.

  2.  **Initial Brainstorming & Categorization (Mental Sandbox):**

      *   *Decision Theory:* The biggest hurdle for imprecise probabilities (IP) is action. If I have a set of probabilities, Expected Utility (EU) is a set. How do I choose? Maximin? E-admissibility? This leads to indecision or vulnerability to money pumps.
      *   *Dilation:* Seidenfeld's results. Is it rational to pay to avoid information? That seems pragmatically self-defeating.
      *   *Updating:* How does a set update? Prior-by-prior? This leads to dilation. Is there an alternative? If I force convergence (to satisfy condition 2), do I violate condition 1 (arbitrariness)?
      *   *Sharp Bayesian Counter:* Subjective Bayesians (Ramsey/de Finetti) say *any* coherent prior is fine. They claim IP is just incomplete preference, not a doxastic state.
      *   *Empirical:* Do humans actually behave this way? Ellsberg paradox supports IP. But do they *stay* imprecise after data?
      *   *Self-Sealing:* "Don't be precise unless evidence demands it." If evidence *never* demands precision (radical skepticism), is the theory unfalsifiable?

  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the position (it aligns with Levi, Walley, Joyce, perhaps Bradley).
      *   **Section 1: The Decision-Theoretic Quagmire (The "Action" Problem).** This is usually the fatal zone.
      *   **Section 2: The Dynamics of Belief (Updating & Dilation).** Addressing points (2) and (3).
      *   **Section 3: The Sharp Bayesian Counter-Attack.** Why a precise Bayesian thinks you're wrong.
      *   **Section 4: Empirical & Predictive Exposure.** How to test this.
      *   **Section 5: The "Self-Sealing" Charge.** Philosophical meta-analysis.
      *   **Section 6: Ranking the Defeaters.** From Fatal to Awkward.
      *   **Conclusion:** Synthesis.

  4.  **Drafting the Content - Deep Dive into Specific Arguments:**

      *   *Decision Rules:* If I have $P \in [0.4, 0.6]$, and Bet A pays \$10 if H, Bet B pays \$5 sure. EU(A) $\in [4, 6]$. EU(B) = 5. Overlap! Indecision. If I *must* choose, I need a secondary rule. If I use Maximin, I'm ultra-conservative. If I use Randomization, am I still IP?
      *   *Exploitability:* Can I be money-pumped? Standard Dutch Book arguments assume sharp credences. For IP, there are "Dutch Books" against specific decision rules (e.g., E-admissibility + Maximin). *Key reference:* Elga (2010) "Subjective Probabilities Should Be Sharp." This is a major defeater.
      *   *Dilation:* Seidenfeld (1994). If learning $E$ makes my credence in $H$ *less* precise (e.g., goes from $[0.4, 0.6]$ to $[0.1, 0.9]$), rational agents should pay to *avoid* $E$. This violates the Value of Information. *Key reference:* Herrmann et al.
      *   *Tension (1) vs (2):* If I start with $[0, 1]$ (total ignorance), standard Bayesian updating (prior-by-prior) keeps it at $[0, 1]$ forever if the likelihoods are also unknown. To get convergence (2), I need to shrink the set. But shrinking the set arbitrarily violates (1). *Solution:* Maybe use a specific updating rule that isn't prior-by-prior? Or accept slow convergence.
      *   *Self-Sealing:* The principle of "Indifference only when warranted." If every counter-example is dismissed as "evidence wasn't actually underdetermined," it's dogmatic. But if it's a normative constraint on rationality (like logic), it might be okay.

  5.  **Refining the Ranking (Fatal vs. Awkward):**

      *   *Fatal:* Incoherence in action (Elga's argument), Violation of Value of Information (via Dilation).
      *   *Serious:* Inability to model learning (washing out too fast or never converging), Conflict with standard Dutch Book coherence.
      *   *Awkward:* Computational complexity, Counter-intuitive implications in specific cases (like specific dilation examples), Empirical mismatch (humans converge faster than IP predicts).

  6.  **Addressing the "Self-Sealing" Slogan:**

      *   Is it a defect? Normative theories often look self-sealing (e.g., "Believe only what is true"). The risk is if *no* evidence could count against it. If the defender says "If you converged, you must have had hidden priors," that's protective belt behavior (Lakatos). It's acceptable if it clarifies the norm, defective if it immunizes against refutation.

  7.  **Review against Constraints:**

      *   Did I brainstorm a *full list*? (Need to ensure breadth).
      *   Did I address the tension between (1) and (2)?
      *   Did I rank them?
      *   Tone: Expert, formal, philosophical.

  8.  **Final Polish (Self-Correction during drafting):**

      *   *Correction:* Make sure to distinguish between *representing* ignorance (static) and *updating* ignorance (dynamic). The user's point (2) is about dynamics.
      *   *Nuance:* Acknowledge that some IP proponents (like Levi) accept indecision as rational. But the user asks about "inability to settle on a determinate choice" as an objection.
      *   *Reference Check:* Ensure names like Elga, Seidenfeld, Levi, Walley, Joyce, and Bradley are implicitly or explicitly engaged with.
      *   *Tension:* The tension is specifically between "Start wide" and "Narrow down with data." If the set is too wide initially (e.g., all distributions), standard updating doesn't narrow it. You need a model of the *process* generating the data to narrow it. If the bias is *wholly* unknown, data doesn't help without a higher-order prior. This is the crux.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a sophisticated position, aligning closely with the "Imprecise Probabilism" championed by Isaac Levi, Peter Walley, and more recently defended by philosophers like Jim Joyce and Richard Bradley. It attempts to solve the problem of arbitrary priors (the Principle of Indifference problem) while maintaining a dynamic account of learning. However, it walks a tightrope between normative plausibility and decision-theoretic coherence.

  Below is a brainstormed map of candidate defeaters, an analysis of the internal tensions, and a ranking of threats to your view.

  ### I. The Decision-Theoretic Quagmire (Action & Choice)

  The most potent defeaters for imprecise credences (IP) arise when belief must guide action. If credences are sets of functions $\mathbb{P}$, Expected Utility (EU) is a set of values.

  1.  **The Indecision Objection (Elga 2010):**
      *   *The Argument:* If your EU for Act A is $[4, 6]$ and Act B is $[5, 5]$, standard IP decision rules (like E-admissibility or Interval Dominance) declare these options *incomparable*. A rational agent should be indifferent or able to choose. If you are required to remain imprecise, you are required to be indecisive in trivial cases.
      *   *Severity:* **Fatal.** If rationality requires you to choose (e.g., a forced choice scenario), and your epistemology forbids a determinate choice, the epistemology is pragmatically self-defeating.
      *   *Defender's Move:* Accept rational indecision (Levi). Or adopt a secondary decision rule (e.g., Maximin, or $\Gamma$-Maximin).
      *   *Cost:* Adopting a secondary rule (like Maximin) often reintroduces arbitrariness, violating your tenet (1).

  2.  **Dynamic Incoherence / Money Pumps:**
      *   *The Argument:* If your decision rule changes based on how options are framed or sequenced, you can be money-pumped. Some IP decision rules are vulnerable to sequential choice inconsistencies where an agent pays to switch from A to B, and then B to A, based on how the imprecise set interacts with the timeline.
      *   *Severity:* **Fatal.** Vulnerability to sure-loss strategies is the standard definition of irrationality in decision theory.

  3.  **The Value of Information Violation (via Dilation):**
      *   *The Argument:* You claim dilation (3) is a feature. However, if receiving evidence $E$ dilates your credence in $H$ (widens the interval), and your decision rule is sensitive to this width (e.g., you require a higher threshold of confidence to bet), you might rationally prefer *not* to receive $E$ for free.
      *   *Severity:* **Fatal.** Good (2013) and others argue that rational agents should never pay to avoid free, relevant information. If your view implies you should, it violates a core norm of instrumental rationality.

  ### II. The Dynamics of Belief (Updating & Convergence)

  This addresses the tension between your tenets (1) and (2).

  4.  **The Washing-Out / Stagnation Dilemma:**
      *   *The Argument:* To satisfy (1) (no arbitrary sharpness), your initial set $\mathbb{P}_0$ must be very wide (e.g., all possible biases for the coin). To satisfy (2) (survive modest data), the set must not collapse immediately.
      *   *The Problem:* Standard "Prior-by-Prior" updating on a set containing *all* distributions often results in **no learning**. If $\mathbb{P}_0$ includes a distribution where the coin is biased to match any possible sequence of outcomes, no data will shrink the set. To get convergence (2), you must exclude some distributions from $\mathbb{P}_0$. But excluding them looks like assuming a sharp prior (violating 1).
      *   *Severity:* **Fatal.** This is the "Dilation vs. Convergence" trade-off. You cannot have maximal initial imprecision and guaranteed convergence via standard updating.
      *   *Defender's Move:* Use a specific updating rule that isn't prior-by-prior (e.g., Generalized Bayesian Updating with a constraint on the *rate* of shrinkage).
      *   *Cost:* This looks ad hoc. Why that rate?

  5.  **The Order Dependence of Evidence:**
      *   *The Argument:* For some IP updating rules, the order in which evidence is received affects the final credal set, unlike sharp Bayesianism where order is irrelevant (commutativity).
      *   *Severity:* **Serious.** It implies path-dependence in rational belief, which is counter-intuitive for objective evidence.

  6.  **Dilation as Epistemic Perversity:**
      *   *The Argument:* Even if you defend dilation normatively, there are cases where dilation occurs despite the evidence being intuitively *confirmatory*. If the formalism says "ignore this correlation because it dilates," it divorces the model from the phenomenology of learning.
      *   *Severity:* **Awkward.** It makes the theory esoteric and disconnected from scientific practice.

  ### III. The Sharp Bayesian Counter-Attack

  7.  **The Representation Theorem Argument:**
      *   *The Argument:* If you have coherent preferences, there exists a *unique* sharp probability function representing them (Ramsey/de Finetti/Savage). If you claim to have imprecise credences, you either have incoherent preferences or you are misdescribing a sharp state.
      *   *Severity:* **Serious.** It challenges the ontological status of the credal set. Is it a doxastic state or just a reflection of incomplete preference?
      *   *Defender's Move:* Deny the completeness axiom of preferences (Levi). Rational agents can have gaps in preference.

  8.  **The "Hidden Prior" Accusation:**
      *   *The Argument:* Any method you use to select the *bounds* of your imprecise set (e.g., "I'm 90% sure the bias is between 0.2 and 0.8") implicitly relies on a sharp higher-order probability distribution. You haven't eliminated sharp priors; you've just hidden them one level up.
      *   *Severity:* **Serious.** It undermines the motivation for (1).

  ### IV. Empirical & Predictive Exposure

  9.  **Human Convergence Rates:**
      *   *Prediction:* Your view predicts humans should remain ambiguous longer than Sharp Bayesians predict.
      *   *Evidence:* If experiments show humans converge to sharp beliefs very quickly (even with thin data), your view is empirically disconfirmed as a descriptive model. As a normative model, it risks being "too demanding" (requiring cognitive effort to maintain imprecision).
      *   *Severity:* **Moderate.** Normative theories can diverge from description, but extreme divergence suggests the norm is unnatural.

  10. **Machine Learning Regularization:**
      *   *Prediction:* Systems trained on thin data should exhibit high variance (imprecision) that persists.
      *   *Evidence:* Modern ML (e.g., Bayesian Neural Nets, Dropout) often converges confidently even on out-of-distribution data (overconfidence). If "rational" systems (designed by engineers) don't behave like your IP agent, is the IP agent actually optimal?
      *   *Severity:* **Moderate.** Engineering constraints differ from epistemic norms, but success in prediction is a pragmatic vindication of Sharp Bayesianism (or at least, regularized sharp priors).

  ### V. Tension Between (1) and (2)

  **Yes, (1) and (2) are in significant tension.**

  *   **The Conflict:** (1) demands the initial set $\mathbb{P}_0$ be wide enough to include all distributions compatible with "wholly unknown bias." (2) demands that after data $D$, $\mathbb{P}_{posterior}$ is narrower than $\mathbb{P}_0$.
  *   **The Mathematical Reality:** Under standard Prior-by-Prior updating, if $\mathbb{P}_0$ is the set of *all* Bernoulli distributions (the requirement of total ignorance), the posterior set remains the set of *all* Bernoulli distributions. The data cannot rule out any bias because for any sequence of data, there is a bias in $\mathbb{P}_0$ that makes that sequence likely.
  *   **The Sacrifice:** To keep both, you must sacrifice **Standard Conditionalization**. You must adopt a non-standard updating rule (e.g., one that shrinks the set based on the *amount* of data regardless of the specific likelihoods, or one that assumes a "stability" constraint).
  *   **The Cost:** This makes the view vulnerable to the "Ad Hoc" charge. Why does the set shrink? If not by likelihoods, then by what mechanism? If you posit a mechanism, you are effectively smuggling in a sharp prior over the *rate of learning*.

  ### VI. Ranking the Defeaters

  | Rank | Defeater | Reason |
  | :--- | :--- | :--- |
  | **1 (Fatal)** | **Dynamic Incoherence / Money Pumps** | If the view makes you susceptible to sure-loss in sequential decisions, it fails as a guide to rational action. |
  | **2 (Fatal)** | **Violation of Value of Information** | If dilation leads to rationally avoiding free information, the epistemology undermines instrumental rationality. |
  | **3 (Fatal)** | **The Stagnation Problem (1 vs 2)** | If maximal imprecision prevents learning via standard updating, you must abandon standard updating, which is a high theoretical cost. |
  | **4 (Serious)** | **Elga's Indecision Argument** | Requiring indecision in forced-choice scenarios is pragmatically paralyzing. |
  | **5 (Serious)** | **The "Hidden Prior" Accusation** | If setting the bounds of the set requires arbitrary sharp judgments, the motivation for (1) collapses. |
  | **6 (Awkward)** | **Order Dependence** | Rational belief shouldn't depend on the order evidence is processed. |
  | **7 (Awkward)** | **Empirical Mismatch** | Humans/ML converge faster than IP predicts. (Dismissible as "humans are irrational"). |
  | **8 (Awkward)** | **Computational Intractability** | Tracking sets of functions is harder than single functions. (Pragmatic, not normative). |

  ### VII. The "Self-Sealing" Slogan

  > *"Precision is required only where it isn't arbitrary."*

  **Is it self-sealing?**
  Yes. It functions as a protective belt. If a critic says, "You should have been precise in case X," the defender replies, "The evidence in X wasn't sufficient to warrant precision." If a critic says, "You were too vague in case Y," the defender replies, "Precision there would have been arbitrary."

  **Is this a defect?**
  *   **As a Scientific Hypothesis:** Yes, it is a defect. It makes the theory unfalsifiable.
  *   **As a Normative Thesis:** It is **acceptable, provided it is grounded in a substantive theory of evidence.**
      *   If "arbitrary" is cashed out formally (e.g., "arbitrary = not entailed by the symmetry of the evidence"), then it is testable. We can check if the evidence possesses the required symmetry.
      *   If "arbitrary" is intuitive, it is dogmatic.
      *   **Verdict:** It is acceptable *only if* you provide a formal criterion for "evidential underdetermination." If you rely on intuition to determine when imprecision is required, the slogan is a rhetorical shield against refutation.

  ### VIII. Summary Advice for the PhD Student

  1.  **Concede:** You must concede that standard Prior-by-Prior updating is incompatible with (1) and (2) jointly. You need a specific updating rule for imprecise priors (look into **Generalized Bayesian Updating** or **Credal Networks**).
  2.  **Dismiss:** Dismiss the "Computational Intractability" objection. Rationality is not defined by human CPU limits. Dismiss the "Humans don't do this" objection unless you are claiming descriptive accuracy.
  3.  **Fight:** The battlefront is **Decision Theory**. You must adopt a decision rule that resolves indecision without reintroducing arbitrariness. Look at **E-admissibility + Minimax Regret** hybrids. If you cannot solve the "forced choice" problem without violating (1), your position collapses into Sharp Bayesianism with a "fudge factor."
  4.  **Refine:** Clarify the Dilation claim. Dilation is a vindication *only* when the evidence is irrelevant or misleading regarding the specific hypothesis. If dilation occurs when evidence *should* be informative, you need a constraint to block it. Don't defend *all* dilation; defend *veridical* dilation.

  Your view is robust only if you can formalize the "requirement" in (1) without relying on intuition, and if you can solve the decision problem without becoming a Sharp Bayesian in disguise.
