answer: |-
  # The Drug Policy Decision Tree

  This instrument sorts respondents by foundational moral commitments, empirical interpretations, and structural preferences. It does not ask for policy labels. It asks for the premises that generate them.

  ### The Nodes

  **Node 1: The Moral Status of Intoxication**
  Setting aside health outcomes or accidents, do you believe recreational drug use is intrinsically a vice or moral failing that the state has an interest in discouraging?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  **Node 2: The Limit of Moral Legislation**
  If it is a vice, should the state use criminal law to suppress it, or is moral disapproval sufficient without legal penalty?
  *   **Criminal Suppression** → **Leaf A**
  *   **Moral Disapproval Only** → Go to Node 5.

  **Node 3: Paternalism and Self-Harm**
  If use is not intrinsically wrong, is the state justified in prohibiting an adult from consuming a substance solely because it may harm their own health or psyche?
  *   **Yes** → Go to Node 4.
  *   **No** → Go to Node 5.

  **Node 4: The Paternalist Lever**
  If you support prohibition to prevent self-harm, do you believe criminalizing the *user* is effective, or should the state focus solely on restricting the *supplier*?
  *   **Target the User** → **Leaf B**
  *   **Target the Supplier** → Go to Node 8.

  **Node 5: User Liability**
  Regardless of morality or self-harm, should an adult caught possessing drugs for personal use face a legal penalty?
  *   **Yes** → Go to Node 6.
  *   **No** → Go to Node 7.

  **Node 6: Administrative Coercion**
  If there is a penalty for possession, should it be a criminal record with potential incarceration, or an administrative citation (like a traffic ticket)?
  *   **Criminal Record** → **Leaf C**
  *   **Administrative Citation** → Go to Node 9.

  **Node 7: Supply Legality**
  If the user faces no penalty, should adults be able to legally purchase these substances from a regulated source?
  *   **Yes** → Go to Node 10.
  *   **No** → **Leaf D**

  **Node 8: Supply Enforcement Efficacy**
  You favor restricting supply to protect users. Do you believe police enforcement against dealers significantly reduces consumption, or does it primarily empower illicit markets?
  *   **Reduces Consumption** → **Leaf E**
  *   **Empowers Illicit Markets** → **Leaf F**

  **Node 9: Mandatory Treatment**
  If the penalty is administrative, should the respondent be required to attend a treatment assessment or pay a fine to clear the citation?
  *   **Mandatory** → **Leaf G**
  *   **Voluntary / No Strings** → **Leaf H**

  **Node 10: Commercial Structure**
  If supply is legal, should private companies compete for profit with branding and advertising?
  *   **Yes** → Go to Node 11.
  *   **No** → Go to Node 12.

  **Node 11: Evidence Interpretation (Concrete)**
  Looking at US cannabis markets (post-2015) or Oregon's Measure 110 (2020–2024): Do you interpret the data on overdoses, public disorder, and adolescent use as showing a net *increase* in social harm attributable to liberalization?
  *   **Yes (Harm Increased)** → **Leaf I**
  *   **No (Harm Stable/Decreased)** → **Leaf J**

  **Node 12: Non-Profit Model**
  If profit is banned, should the state run the supply system (monopoly), or should non-profit member clubs manage it?
  *   **State Monopoly** → **Leaf K**
  *   **Member Clubs** → **Leaf L**

