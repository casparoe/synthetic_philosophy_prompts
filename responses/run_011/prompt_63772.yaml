  ### Deliverable 1: Indistinguishable Leaves

  **Pair:** **Leaf K (State Monopoly)** and **Leaf L (Social Club Legalizer)**.
  **Reason:** The tree separates these at Node 12, but it does not probe *why* the respondent prefers one over the other. A respondent might choose State Monopoly for tax revenue efficiency, while another chooses it for strict control; a Club advocate might choose it for community autonomy or to prevent profit. Both end up in "Non-Commercial Legalization."
  **Question Needed to Separate:** "Should the revenue from drug sales fund general state budgets, or must it be reinvested solely into the user community and harm reduction services?"

  ### Deliverable 2: Leaf Names and Awkward Commitments

  1.  **Moral Prohibitionist:** *Awkward Commitment:* Must justify incarcerating individuals for acts that may have no victim other than themselves.
  2.  **Paternalist Prohibitionist:** *Awkward Commitment:* Must explain why the state protects adults from themselves regarding drugs but not sugar, alcohol, or extreme sports.
  3.  **Criminal Decriminalization:** *Awkward Commitment:* Retains the stigma and collateral damage of criminal records while admitting the behavior is not worth prison time.
  4.  **Abolitionist / Gray Market:** *Awkward Commitment:* Leaves supply entirely in the hands of criminals while removing legal leverage to regulate potency or safety.
  5.  **Supply-Side Hawk:** *Awkward Commitment:* Requires belief that arresting sellers does not simply raise prices and incentivize more violent competition.
  6.  **Supply-Side Dove:** *Awkward Commitment:* Accepts that illicit supply will continue to fund cartels without offering a legal alternative to undercut them.
  7.  **Coercive Decriminalization:** *Awkward Commitment:* Uses the threat of fines to force people into treatment systems that may be under-resourced or ineffective.
  8.  **True Tolerance:** *Awkward Commitment:* Risks normalizing use among vulnerable populations without any mechanism to intervene before crisis occurs.
  9.  **Cautious Legalizer:** *Awkward Commitment:* Must be willing to roll back legal access or halt expansion based on data that may be confounded by other social factors (e.g., fentanyl influx).
  10. **Full Commercial Legalizer:** *Awkward Commitment:* Accepts that corporate lobbying and profit motives will inevitably push for higher potency and increased consumption.
  11. **State Monopoly Legalizer:** *Awkward Commitment:* Grants the government a direct financial interest in maintaining a base level of addiction among its citizens.
  12. **Social Club Legalizer:** *Awkward Commitment:* May inadvertently create exclusive enclaves that exclude the marginalized users most in need of safety regulations.

  ### Deliverable 3: Unoccupied Answer Combinations

  **Combination 1:** **Node 1 (Yes, Intrinsic Vice) + Node 10 (Yes, Commercial Profit).**
  *   **Diagnosis:** *Incoherent.* It is philosophically inconsistent to declare a behavior intrinsically immoral while building a state-sanctioned profit engine dedicated to maximizing its consumption. (Historically rare, akin to state-run opium dens in colonial eras, but incompatible with modern moralist frameworks).

  **Combination 2:** **Node 3 (No, Anti-Paternalism) + Node 4 (Target the User).**
  *   **Diagnosis:** *Incoherent.* If you reject the premise that the state can stop self-harm (Node 3), you cannot logically justify targeting the user for possession (Node 4) unless you believe possession inherently harms third parties, which contradicts the "personal use" framing of the tree.

  **Combination 3:** **Node 5 (No User Penalty) + Node 6 (Criminal Record).**
  *   **Diagnosis:** *Logically Impossible.* This path was pruned in the tree design. A criminal record *is* a penalty. This combination represents a confusion of terms often found in political rhetoric ("decriminalization" that still carries criminal sanctions).

  **Combination 4:** **Node 11 (Yes, Harm Increased) + Node 10 (Yes, Commercial Profit).**
  *   **Diagnosis:** *Unattractive / Unstable.* This describes a respondent who believes commercialization causes net harm but supports it anyway. This position is politically unstable and usually collapses into Leaf I (Cautious Legalizer) or Leaf J (denying the harm).

