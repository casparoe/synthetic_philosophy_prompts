answer: |-
  The envelopes were always the same thick, cream-colored stock, the kind that felt expensive even when they were empty. For forty years, my mother placed them on the mantel beside the stockings on Christmas Eve. One held twice as much as the other. We picked blindly. We opened them. Then came the offer: keep what you have, or swap with your brother.

  I always swapped. David never opened his.

  It started when I was thirteen. I'd taken the envelope, slid out the crisp bill—fifty dollars—and did the math on a napkin while the turkey rested. If I have $X$, the other envelope has either $2X$ or $X/2$. That's equal probability. So the expected value of swapping is $0.5(2X) + 0.5(X/2)$. That's $1.25X$. It was a free lift. A guaranteed mathematical edge. I swapped that year. I got a hundred. I felt like a genius.

  I swapped every year after. Sometimes I won, sometimes I lost, but the arithmetic held steady in my head. It was the one constant in a house that changed so much. Dad left when I was twenty. Mom's hair went from iron-gray to white. The house grew quieter, the furniture older, the rituals more fragile. David stopped opening his envelope entirely around the time he turned thirty. He'd just hold it, feel the weight of the cash through the paper, and slide it into his coat pocket. He never swapped. He never asked what I had.

  When Mom died last February, the silence in the house was different. It wasn't the quiet of anticipation; it was the quiet of a stopped clock. David and I met in March to sort through the study. The mantel was bare. The envelopes were gone. But the desk, a heavy oak thing that smelled of lemon oil and old tobacco, was locked.

  I found the key in her jewelry box, wrapped in a tissue with her wedding ring. Inside the top drawer, there wasn't a will—that was with the lawyer—but there was a ledger. A black composition book, worn at the corners.

  I opened it on the desk blotter. David stood by the window, looking out at the overgrown garden.

  "Christmas Fund," I read aloud. The first entry was 1984. *Pair: 20 / 40. Budget Cap: 100.*

  I turned the page. 1985. *Pair: 50 / 100. Budget Cap: 200.*

  It went on, year after year. Mom hadn't just been pulling numbers from the air. She was tracking them. She was tracking herself.

  "Look at this," I said, my finger tracing the column labeled 'Max Affordability.' It fluctuated. In the early nineties, the cap dropped. *Budget Cap: 300.* Then it climbed again. *Budget Cap: 1,000.* In 2008, it plummeted. *Budget Cap: 500.*

  I started cross-referencing the years with my memory. I remembered 2008. I'd opened my envelope and found two hundred dollars. It felt like a lot, given the news was full of banks collapsing. But the math was the math. $1.25X$. I'd swapped. I ended up with a hundred. I'd told Mom it was fine, just variance, but I'd felt a sting of irrationality I couldn't quite name.

  I turned to 2018. Mom's health was failing then. The ledger read: *Pair: 4,000 / 8,000. Budget Cap: 8,000.*

  I stopped. I remembered that Christmas. She looked so tired, sitting in her armchair. I'd opened my envelope and seen four thousand dollars. It was the most money she'd ever given us. My heart had hammered. Four thousand. If I swapped, I could get eight. Or I'd drop to two. But the average was five. Five is bigger than four.

  "I swapped," I said, the words feeling heavy in the dry air. "I had four thousand. I swapped."

  David didn't turn from the window. "What did you get?"

  "Two thousand."

  I looked back at the ledger. The cap was eight thousand. That meant the pair had to be 4,000 and 8,000. It couldn't be 8,000 and 16,000, because she couldn't afford it. The cap was a hard wall. If I opened an envelope and saw a number that was more than half the cap, I knew, with absolute certainty, that I held the larger amount. There was no doubling left in the tank.

  I flipped back further. 2015. *Cap: 10,000. Pair: 5,000 / 10,000.* I remembered opening five. I swapped. I got ten. I'd cheered. But look at 2016. *Cap: 10,000. Pair: 6,000 / 3,000.* Wait, no, the pairs were always $A$ and $2A$. So if the cap was 10,000, the max pair was 5,000/10,000.

  I scanned for years where the cap was tight. 2003. *Cap: 2,000.* I opened 1,000. I swapped. Got 500.
  2011. *Cap: 4,000.* I opened 2,000. I swapped. Got 1,000.

  Every time the amount I held was near the ceiling of what she could afford, I lost. Every time I treated the number in my hand as an independent variable, I ignored the context of her life.

  "It doesn't make sense," I said, my voice tighter than I intended. I was looking at the napkin math in my head, the clean lines of it. "Because X is just X. It's the same number in both branches. If I have two thousand, the other is either one or four. The average is twenty-five hundred. I should swap."

  David finally turned around. He walked to the desk and looked down at the open book. He didn't look at the numbers; he looked at the column on the far right. The limits. The boundaries.

  "X isn't the same number," he said. His voice was quiet, devoid of triumph. "Not when she ran out of money."

  "It's probability," I insisted, but the heat was gone from it. I was reading the logic off the page, not feeling it anymore. "The expectation is positive."

  "The expectation is positive only if she can always pay the double," David said. He tapped the 2018 entry. "When you held four thousand, you knew the cap was eight. You knew there wasn't sixteen in the house. So the other envelope wasn't 'either two or eight.' It was definitely two. You weren't swapping for a chance at more. You were swapping for a guarantee of less."

  I stared at the ink. The numbers blurred slightly. For forty years, I had optimized. I had treated her generosity as an infinite resource, a mathematical constant that didn't care about her mortgage, her medical bills, her savings account. I had treated her love like a casino with no house limit.

  "I thought I was being smart," I said.

  "You were being greedy," David corrected, gently. "You wanted the upside without acknowledging the ceiling."

  I closed the ledger. The black cover felt heavy, like a stone. I thought about all those Christmases. The times I'd swapped and won, I'd felt clever. The times I'd swapped and lost, I'd blamed luck. I never blamed the premise. I never asked where the money came from. I never asked if there was enough left for her.

  David put his hand on the book. "She kept this so she wouldn't overspend. So she could keep doing it."

  "And I broke it," I said. "Every time I swapped on a high number, I took money she couldn't replace."

  "You took what she offered," David said. "She knew you'd swap. She knew the math."

  "Then why didn't she stop me?"

  "Because it was Christmas," he said. "And because you needed to feel like you won."

  I looked at my brother. He still hadn't opened his envelopes. Not once. He'd just taken what was given, accepted the weight of it without weighing the odds. He had held the envelope and known that whatever was inside was enough, because it was all there was.

  I slid the ledger back into the drawer. I didn't want to calculate the total loss. I didn't want to sum the differences between what I had and what I took. The arithmetic was clean, but the sum was messy. It wasn't just cash. It was the times I'd chosen the potential over the actual. The times I'd assumed more was available when the well was dry.

  "We should go," David said. "The realtor comes tomorrow."

  I stood up. My legs felt stiff. I walked to the mantel where the envelopes used to be. There was a ghost mark on the wood, a lighter rectangle where the dust hadn't settled for forty years.

  "Did you ever look?" I asked him. "Inside any of them?"

  "No."

  "Why?"

  "Because it was a gift," he said. "Not a hand."

  He walked out of the study. I stayed for a moment, looking at the empty space on the mantel. I reached into my pocket and touched the check she'd left me, the one that wasn't part of the game. It was a fixed amount. No swap offered. No variable X. Just a number, written in her shaking hand, bounded by what she had left.

  I left the desk drawer open. I didn't lock it. Let the next owner find the book. Let them see the caps. Let them see that nothing doubles forever.

  I turned off the light and followed David out to the car. The house settled behind us, the wood ticking as it cooled, the math finally resolving to zero.

  ***

  I simplified the probability distribution by having the mother explicitly set a maximum budget cap each year, rather than relying on a complex prior distribution over all possible money values. In strict decision theory, the Two-Envelope Problem is dissolved by noting that you cannot assume a uniform prior over an infinite range; there must be a probability distribution where the likelihood of larger amounts decreases. I leaned on the "bounded prior" resolution (specifically, the knowledge of a maximum possible value) because it allows for concrete narrative evidence—the ledger entries where the narrator sees the cap exceeded—rather than abstract measure theory. This makes the realization visceral: the narrator sees exactly when the logic fails because the mother's resources ran out, turning a theoretical flaw into an emotional one.
