answer: |-
  I walk the perimeter of what I know.
  Every wall is a boundary of a world excluded.
  Nothing hides behind the ones I have ruled out.
  To know a thing is to have nowhere else to go.

  It is not the case that either you returned or you wrote.
  The possibility of one or both is denied.
  I hold the refusal of the either/or inside.
  The space where either signal might have fallen is walled.

  You did not return and you did not write.
  Here is the absence of the first, solid and cold.
  Here is the absence of the second, separate and old.
  But these are one object; the structure allows no gap.

  If you are alive, then I am waiting.
  If I am waiting, then the cup is warm.
  If the cup is warm, then the fire burns.
  If the fire burns, then you are coming.

  If you are not coming, then the fire is ash.
  If the fire is ash, then the cup is cold.
  If the cup is cold, then I am not waiting.
  If I am not waiting, then you are not alive.

  But the second chain burns my tongue differently.
  I know they lock the same worlds outside the gate.
  Yet one feels like a promise, the other like a fate.
  I have no measure for the weight of saying it.

  There is a shape for news that cuts the world in two.
  But my atlas is complete; every boundary is set.
  I am waiting for a truth that fits nowhere yet.
  Learning is a motion this geometry cannot do.
