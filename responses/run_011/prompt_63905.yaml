answer: |-
  # Seminar Spec: Desiderata for a Theory of Standing to Blame

  ## I. The Desiderata List
  Below are the phenomenological and normative data points any robust account must engage. Each is marked as **Non-Negotiable** (the theory fails if it cannot accommodate this without ad hoc manoeuvring) or **Optional** (a theory may defensibly reject or reinterpret this datum).

  ### 1. The Textbook Hypocrite
  *   **Case:** A serial philanderer loudly denounces a colleague's affair.
  *   **Requirement:** The theory must explain why the blame feels *normatively inappropriate* without claiming the content is false (the norm *does* apply to the colleague) or that the hypocrite is unblameworthy themselves (they are).
  *   **Status:** **Non-Negotiable.** This is the core phenomenon. If a theory cannot distinguish the hypocrite's blame from the non-hypocrite's, it has not captured standing.

  ### 2. The Differential Blamer
  *   **Case:** An agent condemns Wrong X with fury when committed by Group A, but treats it as a minor slip when committed by Group B.
  *   **Requirement:** The theory must account for why partiality undermines standing, even if the blamer is personally innocent of Wrong X.
  *   **Status:** **Non-Negotiable.** This prevents standing from collapsing into a simple "clean hands" record. It tests whether standing requires *consistent* commitment to the norm, not just compliance.

  ### 3. The Sheltered Saint
  *   **Case:** An agent with a spotless record, never tempted, blames a fallible wrongdoer. Their blame feels "thin," "cheap," or uninformed.
  *   **Requirement:** The theory must explain this deficit without implying one *must* sin to have authority (the "sinner's privilege"). It must distinguish *innocence* from *ignorance of the human condition*.
  *   **Status:** **Non-Negotiable.** This is the primary counter-example to simple record-based views. A theory that grants the Saint maximal standing fails to capture the relational nuance of moral demand.

  ### 4. The Ex-Offender (The Reformed Sinner)
  *   **Case:** A recovered addict or ex-offender blames a current wrongdoer. Their blame carries distinctive weight/authority.
  *   **Requirement:** The theory must explain how a *negative* record can enhance rather than diminish standing.
  *   **Status:** **Non-Negotiable.** This creates a direct tension with Item 1. If past wrongs remove standing (Hypocrite), why do past wrongs sometimes confer it (Ex-Offender)? The theory must distinguish *unrepentant* violation from *acknowledged* fallibility.

  ### 5. Private Blame
  *   **Case:** An agent judges and resents a wrongdoer entirely in private; no communication occurs.
  *   **Requirement:** The theory must state whether standing applies here. If standing is a condition on *address*, private blame lacks standing conditions. If it is a condition on *attitude*, it applies.
  *   **Status:** **Optional.** This is a theoretical fork. Communicative theories will say standing is irrelevant here; Attitude-based theories will say it is central. A theory can defensibly choose either, provided it is consistent.

  ### 6. Blaming the Dead / Unreachable
  *   **Case:** Blaming a historical figure or someone in a permanent vegetative state.
  *   **Requirement:** The theory must explain whether standing is contingent on the possibility of uptake or accountability.
  *   **Status:** **Optional.** Similar to Item 5. If blame is essentially a call for accountability, standing may lapse. If blame is a verdict, standing remains.

  ### 7. Proxy Blame (Third-Party Standing)
  *   **Case:** A friend blames a wrongdoer on behalf of a victim who does not wish to be defended.
  *   **Requirement:** The theory must clarify if standing is *personal* (tied to the victim's rights) or *general* (tied to the moral community). It must explain if standing can be delegated or borrowed.
  *   **Status:** **Non-Negotiable.** A theory must take a stance on the locus of authority. Denying third-party standing entirely is a defensible position, but denying the *question* is not.

  ### 8. Self-Blame
  *   **Case:** An agent blames themselves for a past wrong.
  *   **Requirement:** The theory must state if the standing conditions apply reflexively. (e.g., Can one be a hypocrite to oneself?)
  *   **Status:** **Optional.** Many theories bracket self-blame as a distinct psychological kind (guilt/shame). However, a unified theory of blame should address whether the "right to blame" makes sense intra-personally.

  ### 9. The Legal Analogy
  *   **Case:** In law, standing is a threshold jurisdictional question (who may sue), distinct from the merits (who wins).
  *   **Requirement:** The theory must justify importing this structure into morality. Is moral standing a *right* (jurisdictional) or a *virtue* (merit-based)?
  *   **Status:** **Optional.** It is defensible to argue the legal analogy is a category mistake. However, the theory must explain *why* if it rejects it, given the structural similarities in discourse.

  ### 10. The Penitent (Added Case)
  *   **Case:** A wrongdoer who has already apologised and made amends is blamed again for the same act.
  *   **Requirement:** The theory must explain if standing expires after accountability has been met.
  *   **Status:** **Non-Negotiable.** This tests whether standing is about *enforcing norms* or *restoring relations*. If the debt is paid, does the blamer still have a "right" to demand?

  ---

  ## II. The Killer Constraint
  **The Distinction between Fittingness and Standing.**
  This is the single requirement that knocks out the most otherwise-plausible accounts.
  *   **The Constraint:** A theory must explain how blame can be **fitting** (the target is genuinely blameworthy) and **true** (the norm is valid), yet **inappropriate** solely due to the blamer's status.
  *   **The Casualty:** This eliminates **Deflationary Accounts** (which argue standing is just a redescription of fittingness or prudence) and simple **Epistemic Accounts** (which argue the hypocrite just lacks knowledge). If standing is real, it must be a normative block on a fitting response. Many accounts collapse here, reducing standing to "it's not useful to blame" or "the blame is actually unfitting because hypocrisy makes it insincere."

  ---

  ## III. The Squeeze: Joint Unsatisfiability
  Your suspicion is correct. There is a trilemma involving three highly intuitive claims. A theory cannot hold all three simultaneously without significant qualification.

  **The Authority Trilemma:**
  1.  **Moral Equality:** All moral agents possess equal authority to uphold moral norms (no moral aristocracy).
  2.  **The Standing Intuition:** Hypocrites (and some others) lack the authority/normative power to blame specific wrongdoers.
  3.  **Substantive Standing:** Standing is a distinct normative condition, not merely a matter of prudence, manner, or fittingness.

  **The Squeeze:**
  *   If you hold **(1) and (3)**, you must deny **(2)**. You become a **Deflationist**. You must argue the hypocrite's blame is actually *fitting* and they *do* have standing; our discomfort is merely prudential or aesthetic. (Cost: Ignores the deep normative intuition that hypocrites *wrong* the blamee by blaming).
  *   If you hold **(2) and (3)**, you must deny **(1)**. You become a **Relational/Elitist**. You must argue that moral authority is not equal; it is earned or forfeited. (Cost: Risks creating a moral hierarchy where some agents are "second-class" norm-enforcers).
  *   If you hold **(1) and (2)**, you must deny **(3)**. You become a **Reductionist**. You must argue standing is not a separate normative power but is actually a constraint on the *manner* of address or the *sincerity* of the commitment. (Cost: Risks collapsing standing back into fittingness or sincerity conditions).

  **The Verdict:** The "Substantive Standing" requirement (3) is the hardest to maintain alongside "Moral Equality" (1). Most contemporary accounts (e.g., Wallace, Bell) attempt to save (1) and (3) by reinterpreting (2): they argue the hypocrite doesn't lack *authority*, but rather their blame constitutes a *new wrong* (a violation of the relation). This preserves Equality but makes Standing derivative of the prohibition on harming the relation.

  ---

  ## IV. Scorecard

  **Record-Based Views** (e.g., early Friedland): Fail the **Sheltered Saint** and **Ex-Offender** tests. They grant the Saint maximal standing (incorrect) and deny the Ex-Offender standing (incorrect). They treat standing as a ledger balance, missing the relational nuance. **Commitment/Consistency Views** (e.g., Bell, Wallace): Pass the **Hypocrite** and **Differential Blamer** tests by focusing on the blamer's current endorsement of norms. However, they struggle with the **Legal Analogy**; if standing is just consistency, it looks like a virtue condition, not a jurisdictional threshold. They often succumb to the **Squeeze** by denying Moral Equality (authority is earned via commitment). **Communicative/Address Views** (e.g., Macnamara, Shoemaker): Excel at **Private Blame** and **Blaming the Dead** (standing lapses without audience). They handle the **Hypocrite** well (hypocrisy disrupts the conversation). However, they risk making standing too fragile; if the wrongdoer refuses to listen, does standing vanish? **Deflationists** (e.g., Todd, King): Pass the **Moral Equality** test effortlessly but fail the **Killer Constraint**. They deny standing is a distinct normative phenomenon, reducing it to fittingness or prudence, thereby dissolving the seminar topic entirely.
