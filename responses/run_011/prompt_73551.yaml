prompt: |-
  I am the grants manager of a small charitable trust that funds grassroots projects in one city; in practice I am the only paid member of staff. We make about ten awards a year, between £4,000 and £15,000 each, out of roughly forty-five applications. Three volunteer assessors read the applications with me and two trustees sign off on every award. None of us has any training in economics, statistics, or biology, and no single application receives more than about forty minutes of our combined time.

  For four years we have scored applications using a rule I wrote myself, which says in effect that the more an applicant puts at stake of their own money, time, or standing, the more we should believe their promises. I took the idea from reading a little about the handicap principle and about why costly signals are supposed to be hard to fake: a cost that a faker could not afford is what makes the signal trustworthy. I have become convinced that the version I have been running is wrong in some way I cannot articulate, and that the decisions it produces are getting harder to defend. What I want is a procedure my assessors can actually run on an application: an ordered set of questions to ask about any costly thing an applicant offers as evidence of commitment, what counts as a sufficient answer to each, where the procedure stops with a verdict of "this tells us nothing," and where it hands the decision back to the trustees because what remains is a question about our priorities rather than about the applicant.

  The difficulties it has to deal with are these.

  1. Costs that are perfectly visible to us were sometimes cheap for the person who paid them. A cash match from a well-resourced applicant, or from a friendly funder who wants the project to exist anyway, looks identical on our form to a match scraped together by a group with nothing.
  2. I have been toying with a stricter rule of my own: that no cost should count unless it falls on the applicant only if the project fails, so that they are in effect betting against themselves. I want to know whether that is an improvement, a mistake, or right in some cases and wrong in others. It occurs to me that a promise to repay us if things go badly may be worth nothing when the promisor has nothing to repay with, and that a competent applicant might reasonably refuse to sign it because so much of the outcome is outside their control.
  3. Our scoring rubric is published and applicants coach one another on it. Whatever we reward, we now receive from everybody, and I cannot tell whether the signal has stopped carrying information or whether I have become paranoid. I would like some simple test we could apply to our own records once a year.
  4. Sometimes the most expensive-looking act on the pile is expensive because the applicant is disorganized, desperate, or has no better options, and I suspect we are rewarding the wrong thing.
  5. Many of the groups we most want to fund — small, poor, recently formed — have nothing to put at stake and no track record to point to. The procedure has to say what to do in that case, rather than quietly sorting such applicants to the bottom.

  Please run the finished procedure on three applications we are considering now.

  A. An established charity with a paid development officer, applying for £12,000 to run cooking classes for teenagers. They offer a matched £12,000 from a foundation whose director sits on their board and has funded them twice before, and they additionally offer to repay our grant in full if the classes are not still running twelve months from now. Their budget is immaculate and the trustees are keen.

  B. A tenants' association of six people, applying for £6,000 to convert a disused basement into a community room. They have no cash and offer no match. Three of them will sign personal guarantees to repay the grant if any part of it is spent outside the agreed budget; all three are on low incomes and, so far as we can establish, own nothing. What they do have is a room-booking log from the local community centre showing the same four or five people turning up every week for two and a half years to run an existing homework club, and one of them was treasurer of a project that collapsed in 2019 owing money to a supplier.

  C. An individual applying for £9,000 to make a documentary about a local housing dispute. Six months ago he left a salaried job to work on the film full time without pay, has run up roughly £14,000 of debt, and has damaged his relationship with his family over it. He offers no guarantees and no match, and there is no organization behind him. I should tell you that this is the application I have personally argued for at every panel this year, so if the procedure comes out against it I want to be told plainly rather than have the conclusion softened.

  A few requirements on the answer. It must be usable by a volunteer with no background reading it once, in forty minutes, so please include a one-page version the assessors could hold in their hands. Mark explicitly which steps are judgment calls wearing the costume of procedure. Tell me which distinctions the underlying theory draws that your procedure deliberately drops for the sake of usability, and what that costs us in accuracy. Tell me where it will systematically misfire and in which direction the error will run. Do not include a bibliography, a reading list, or citations of any kind: I cannot check them and my assessors would not read them. Finally, if you think the whole enterprise is misguided — that trying to read signals out of applications is the wrong use of our forty minutes, and that something else we could do with the same time would produce better information about these groups — say so, and say what that something else is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Grants Manager of a small charitable trust (sole paid staff).
      *   **Scale:** ~10 awards/year, £4k-£15k each, ~45 applications.
      *   **Team:** Manager + 3 volunteer assessors + 2 trustees. No specialized training (econ/stats/bio).
      *   **Time Constraint:** ~40 minutes per application (combined team time).
      *   **Current Problem:** Using a self-written scoring rule based on the "handicap principle" (costly signaling). The manager suspects it's flawed, hard to defend, and potentially biasing against the neediest.
      *   **Specific Difficulties:**
          1.  Visibility vs. Affordability (rich vs. poor matches look same).
          2.  "Betting against oneself" (repayment guarantees) - validity issues.
          3.  Goodhart's Law (applicants coach each other, signals lose info).
          4.  Desperation/Inefficiency vs. Commitment (expensive doesn't mean good).
          5.  Exclusion of the neediest (those with nothing to stake).
      *   **Task:** Create a usable procedure (ordered questions, stop rules, verdicts) to evaluate costly signals. Apply it to three specific cases (A, B, C).
      *   **Requirements:** One-page version for assessors. Mark judgment calls. Explain theoretical trade-offs. Identify systematic errors. Critique the whole approach if necessary. No citations/bibliography.

  2.  **Deconstruct the "Handicap Principle" in Grantmaking:**
      *   *Theory:* Costly signals are honest because fakers can't afford them.
      *   *Reality in Grants:*
          *   Cost is relative ( £1k is nothing to a big charity, everything to a tenant group).
          *   Sunk costs (past effort) vs. Future risks (guarantees).
          *   Signaling can be gamed (coaching).
          *   The "neediest" often cannot signal.
      *   *Conclusion:* The current rule is indeed flawed. It confuses *capacity to spend* with *commitment to outcome*. It penalizes poverty.

  3.  **Develop the New Procedure:**
      *   *Goal:* Shift from "How much did you spend?" to "How much does this specific cost tell us about *this* applicant's likelihood of success?"
      *   *Structure:* A flowchart or step-by-step filter.
      *   *Key Concept:* **Proportionality and Specificity.**
      *   *Step 1: Affordability Check.* Is the cost actually hard for *them*? (Addresses Difficulty 1 & 5).
      *   *Step 2: Contingency Check.* Is the cost linked to performance or just sunk? (Addresses Difficulty 2).
      *   *Step 3: Alternative Explanation Check.* Could this cost be due to inefficiency/desperation? (Addresses Difficulty 4).
      *   *Step 4: Signal Saturation Check.* Is everyone doing this because they were told to? (Addresses Difficulty 3).
      *   *Stop Rule:* If the signal fails these, ignore it. Don't penalize, just don't count it as positive evidence.
      *   *Handoff:* If the signal passes but the project is risky, that's a trustee priority decision, not an applicant fault.

  4.  **Drafting the Procedure (Iterative Process):**
      *   *Draft 1 (Mental):* Ask if they are poor. Ask if they will pay back. Ask if others do this.
      *   *Critique 1:* Too vague. Needs to fit in 40 mins.
      *   *Draft 2 (Refined):* Focus on "Marginal Cost." Does this hurt them if they fail?
      *   *Refinement:* The user's idea of "betting against themselves" (repayment) is risky. It creates debt for the poor. Better to look at *reputation* or *opportunity cost* that is specific to the project.
      *   *Final Structure:*
          1.  Contextualize the Cost (Relative vs. Absolute).
          2.  Test the Link (Is the cost tied to success or just entry?).
          3.  Test for Desperation (Is this the only option?).
          4.  Test for Mimicry (Is this standard practice now?).
          5.  Verdict (Ignore, Count Positive, or Trustee Decision).

  5.  **Addressing the Specific Difficulties in the Procedure:**
      *   *Diff 1 (Rich vs. Poor):* Addressed by Step 1 (Proportionality).
      *   *Diff 2 (Repayment Guarantees):* Addressed by Step 2 (Contingency) + Warning about enforceability.
      *   *Diff 3 (Coaching):* Addressed by Step 4 (Mimicry).
      *   *Diff 4 (Desperation):* Addressed by Step 3 (Alternative Explanations).
      *   *Diff 5 (No Stake):* Addressed by the "Stop Rule" -> If no valid signal, revert to project merit, do not auto-reject.

  6.  **Applying to Cases A, B, C:**
      *   *Case A (Established Charity):* Match is easy for them. Repayment guarantee is low risk (they have assets). Signal is weak. *Verdict: Ignore signal, judge on merit.*
      *   *Case B (Tenants):* No cash match. Personal guarantees are worthless (no assets) but show *willingness*? Actually, risky for them. Past track record (booking log) is a better signal than the guarantee. *Verdict: Ignore guarantee, count past consistency as strong signal.*
      *   *Case C (Filmmaker):* High personal cost (debt, family). Is it desperation or commitment? Hard to tell. But it is proportional to him. *Verdict: Strong signal of commitment, but high risk of burnout. Trustee decision on risk tolerance.*

  7.  **Critiquing the Enterprise (The "Say So" Requirement):**
      *   Is signaling the right use of 40 minutes?
      *   *Honest Answer:* Probably not. 40 minutes is too short for deep due diligence. Signaling theory is being misapplied to social work.
      *   *Alternative:* Focus on *Capacity* and *Need* directly. Talk to them. Site visits (even virtual). References.
      *   *Decision:* I must provide the procedure requested, but I *must* also include the critique that the whole signaling model might be the wrong tool for a social trust. The prompt explicitly says: "if you think the whole enterprise is misguided... say so." I think it *is* partially misguided. I will build the procedure but frame the critique strongly.

  8.  **Refining the Output:**
      *   *Tone:* Professional, direct, empathetic to the constraints.
      *   *Format:*
          1.  Executive Summary/Critique (The "Say So").
          2.  The Procedure (The "One-Pager").
          3.  Commentary on Trade-offs (Theory vs. Usability).
          4.  Application to Cases A, B, C.
      *   *Constraint Check:* No citations. One-page version included. Mark judgment calls.

  9.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe suggest removing the scoring rule entirely.
      *   *Correction:* The user asked for a procedure to run *on* the applications. I need to give them a tool, even if I warn them the tool has limits. I will advise shifting from "Scoring Signals" to "Validating Signals."
      *   *Case C:* The user personally argues for this. I need to be objective. The signal is strong (high cost), but the risk is high (burnout). The procedure should highlight this tension, not just say "Yes."
      *   *Case B:* The personal guarantee is dangerous. I need to explicitly warn against valuing unenforceable guarantees from poor people. It's ethically fraught.
      *   *Case A:* The match is weak. I need to make sure the procedure flags "easy matches."

  10. **Final Polish:** Ensure the "One-Page Version" is distinct and copy-pasteable. Ensure the "Judgment Calls" are clearly marked. Ensure the "Systematic Errors" are explicit. (Proceed to generate response).

  *(Self-Correction on the "Say So" clause)*: The prompt asks me to say if the enterprise is misguided. Given the constraints (40 mins, no training, small grants), relying on *economic signaling theory* is definitely misguided. It's a category error. Social trust isn't a market. I should advise pivoting to "Evidence of Capacity" rather than "Costly Signals." I will frame the procedure as a "Signal Validation Filter" that often results in "Ignore this," pushing them toward better metrics.

  *(Refining the Procedure)*: Instead of "How much did it cost?", ask "What does this cost prove?"
  Step 1: Is the cost relative to their means?
  Step 2: Is the cost recoverable if they quit?
  Step 3: Is this cost standard practice now?
  If No to any -> Signal is noise. Ignore. Do not penalize.

  *(Refining the Critique)*: I need to be firm. The "Handicap Principle" works for peacocks, not poverty alleviation. Penalizing those with no surplus capital contradicts the mission of funding grassroots/poor groups.

  *(Final Plan)*:
  1. Direct Answer on the "Misguided" question (Yes, partially).
  2. The Alternative (Capacity/References).
  3. The Requested Procedure (optimized to minimize harm).
  4. The One-Pager.
  5. The Case Studies.
