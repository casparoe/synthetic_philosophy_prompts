answer: |-
  ### Part 1: Is this enterprise misguided?

  **Yes.**

  You are applying a theory of biological evolution (the handicap principle) to a social welfare context where the underlying assumptions do not hold. In biology, a costly signal works because the *cost* is the barrier. In grantmaking, especially for grassroots groups, the *lack of capital* is the problem you are trying to solve. By rewarding those who can afford to burn capital, you are systematically selecting for applicants who are less in need of your money, or who are financially reckless.

  Forty minutes per application is insufficient for deep due diligence, but it is enough to check references and talk to humans. You are currently spending that time analyzing financial theater.

  **The Alternative:**
  Stop scoring "commitment" based on financial stake. Spend your forty minutes on **Capacity and Consistency.**
  1.  **Call two references** provided by the applicant (15 mins). Ask: "Have they delivered on promises before?"
  2.  **Check the track record** of activity, not money (10 mins). Have they done *anything* related to this goal without funding?
  3.  **Interview the applicant** (15 mins). Ask: "What is the biggest thing that could stop this, and what is your Plan B?"

  If you must keep a scoring procedure for signals, use the one below. It is designed to prevent you from penalizing the poor while filtering out empty gestures.

  ***

  ### Part 2: The Procedure (Signal Validation Filter)

  This procedure does not ask "How much did they spend?" It asks "Does this spend prove they can deliver?"

  **The Rule:** A costly signal is only valid evidence if it passes all three tests below. If it fails any test, **ignore the signal.** Do not score it as positive, and do not score it as negative. Revert to judging the project merit alone.

  #### Step 1: The Proportionality Test
  *Question:* Is this cost significant relative to *this specific applicant's* total resources, or is it a standard operating expense for an organization of their size?
  *   **Yes (Significant):** Proceed to Step 2.
  *   **No (Standard/Trivial):** **STOP.** This tells us nothing. A £12k match for a multi-million pound charity is accounting, not commitment.
  *   *[Judgment Call]:* You must estimate their total capacity. Look at accounts, staff count, or ask directly.

  #### Step 2: The Skin-in-the-Game Test
  *Question:* Does the applicant lose this resource *only if they fail to deliver the outcome*, or do they lose it just by applying/starting?
  *   **Outcome-Contingent (e.g., repayment clause, reputation risk):** Proceed to Step 3.
  *   **Sunk Cost (e.g., money already spent, staff time already hired):** **STOP.** This is often a sign of poor planning (see Difficulty 4). Do not reward desperation.
  *   *[Judgment Call]:* Distinguish between "we started work to show commitment" (bad planning) and "we have built a userbase that will leave if we fail" (reputation risk).

  #### Step 3: The Enforceability Test
  *Question:* If the applicant promises to pay back or suffer a penalty, do they actually have the means to pay, or is the promise symbolic?
  *   **Enforceable (They have assets/income):** Count as a moderate positive signal.
  *   **Unenforceable (They have no assets):** **STOP.** Valuing a guarantee from someone with no money is ethically hazardous and informationally empty. It selects for those willing to lie about risk.
  *   *[Judgment Call]:* Determining "means." A low-income individual owns nothing; a charity owns equipment.

  #### Step 4: The Saturation Check (Annual Only)
  *Question:* Are 80%+ of applicants offering this same signal this year?
  *   **No:** Proceed to verdict.
  *   **Yes:** **STOP.** The signal has become a entry ticket (Goodhart's Law). It carries no information.
  *   *[Judgment Call]:* Reviewing the pool at the end of the cycle.

  **The Verdict:**
  *   **If Signal Passes All:** Count as one point of evidence for *capacity*.
  *   **If Signal Fails Any:** Discard signal. Judge application on project need and past track record.
  *   **If Applicant Has No Signal:** Do not penalize. If they pass the "Capacity and Consistency" alternative checks, fund them. This is a Trustee priority decision (Difficulty 5).

  ***

  ### Part 3: One-Page Version for Assessors

  **GRANTS TRUST: SIGNAL VALIDATION CHECKLIST**
  *Time limit: 5 minutes of the 40-minute review.*

  **INSTRUCTION:** We are looking for evidence that the applicant will deliver. Do not reward spending money just to spend it. If a signal fails a test, **ignore it**. Do not mark the application down for lacking a signal.

  **1. PROPORTIONALITY**
  Is the cost (cash match, time, risk) hard for *them* specifically?
  [ ] **Yes:** It stretches their budget/risk profile. (Go to 2)
  [ ] **No:** It is easy for an org of their size/type. (STOP: Ignore Signal)

  **2. CONTINGENCY**
  Do they lose this resource *only if* the project fails?
  [ ] **Yes:** It is a bet against their own failure. (Go to 3)
  [ ] **No:** It is a sunk cost (spent before grant decided). (STOP: Ignore Signal. May indicate poor planning).

  **3. ENFORCEABILITY**
  If they promise to repay/penalize themselves, can they actually afford to?
  [ ] **Yes:** They have assets/income to cover the risk. (Count as Positive Evidence)
  [ ] **No:** They have no assets/income. (STOP: Ignore Signal. Do not value empty promises).

  **4. SATURATION (Manager Check Only)**
  Is everyone doing this now because they read our guidelines?
  [ ] **No:** (Count Evidence)
  [ ] **Yes:** (Ignore Signal. It is now just form-filling).

  **FINAL ACTION:**
  *   If Signal Ignored: Judge application on **Project Merit** and **Past Track Record** only.
  *   If Applicant has No Signal: **Do Not Penalize.** Judge on **Project Merit** and **Past Track Record**.
  *   If Signal Passed: Add weight to **Capacity** score, not **Need** score.

  ***

  ### Part 4: Application to Cases A, B, and C

  **Application A: Established Charity**
  *   **Step 1 (Proportionality):** **FAIL.** £12k match from a board-connected foundation is standard operating procedure for them. It is not "costly" relative to their capacity.
  *   **Step 2 (Contingency):** **PASS.** Repayment clause is outcome-contingent.
  *   **Step 3 (Enforceability):** **PASS.** They are an established charity; they can repay.
  *   **Verdict:** **Ignore the Signal.** The match is noise; the repayment is valid but low-risk for them.
  *   **Decision:** Fund based on project merit and budget quality. The signal adds no new information. The Trustees' keenness should be based on the project's value, not the match.

  **Application B: Tenants' Association**
  *   **Step 1 (Proportionality):** **PASS.** They have no cash. Any financial risk is high relative to means.
  *   **Step 2 (Contingency):** **PASS.** Personal guarantees are contingent on misuse/failure.
  *   **Step 3 (Enforceability):** **FAIL.** They own nothing. The guarantee is worthless paper. Valuing this would be predatory.
  *   **Alternative Check:** The *booking log* (2.5 years of consistent activity) is a **Sunk Cost** in the procedure, BUT it is evidence of *Consistency*, not financial stake.
  *   **Verdict:** **Ignore the Guarantees.** Count the Booking Log as strong evidence of *Capacity*.
  *   **Decision:** Fund. The guarantee tells you nothing; the track record tells you everything. The past collapse (2019) is a risk, but the 2.5-year log shows recovery.

  **Application C: Individual Filmmaker**
  *   **Step 1 (Proportionality):** **PASS.** £14k debt and family damage is massive relative to an individual.
  *   **Step 2 (Contingency):** **FAIL.** This is mostly sunk cost (already left job, already in debt). He cannot "un-spend" this if you reject him. It is not a bet against future failure; it is a plea based on past sacrifice.
  *   **Step 3 (Enforceability):** **N/A.** No guarantee offered.
  *   **Verdict:** **Ignore the Signal.** Under this procedure, his debt counts as "Desperation/Poor Planning" (Difficulty 4), not commitment.
  *   **Decision:** This is the hardest case. The procedure strips away your personal argument for him. To fund him, you must admit you are funding **Risk**, not **Signal**. You are betting on his passion despite the lack of a valid signal. This must be a Trustee priority decision: "Are we willing to fund high-risk individuals with no safety net?" If yes, fund C. If no, reject C. Do not pretend the debt makes him safer; it makes him more volatile.

  ***

  ### Part 5: Trade-offs, Errors, and Theory

  **Distinctions Dropped for Usability:**
  1.  **True "Handicap" vs. "Waste":** Biology distinguishes between a heavy tail that proves strength and a heavy tail that just slows the bird down. We cannot distinguish these perfectly in 40 minutes. We assume high sunk costs are often waste (Difficulty 4).
      *   *Cost:* We may reject some passionate "true believers" who sacrificed everything irrationally (Case C).
  2.  **Reputation vs. Cash:** The procedure treats reputation risk (tenants losing community trust) and cash risk similarly.
      *   *Cost:* Reputation is harder to fake than cash, but harder to verify. We may undercount reputation signals.
  3.  **Contextual Nuance:** The procedure is binary (Pass/Fail). Real life is gradient.
      *   *Cost:* Loss of precision. A "small" match for a medium charity might still show some commitment. We ignore it to avoid bias.

  **Systematic Misfires:**
  1.  **Direction:** The procedure will systematically **under-score established organizations** (Case A) and **under-score desperate individuals** (Case C).
  2.  **Bias:** It will systematically **favor groups with track records but no cash** (Case B).
  3.  **Error Type:** This is a **Type II Error** strategy. We are accepting that we might miss some "committed" people (false negatives) to ensure we stop rewarding "rich" people pretending to be committed (false positives).

  **Where the Theory Breaks:**
  The underlying theory assumes rational actors trying to signal quality.
  *   **Case C** is not acting rationally; he is acting emotionally. The theory cannot price "passion."
  *   **Case A** is acting bureaucratically. The theory cannot price "board relations."
  *   **Case B** is acting communally. The theory cannot price "social capital."

  **Final Advice:**
  Use the procedure to stop yourself from being fooled by money. But acknowledge that for a trust funding grassroots work, **trust** is a better metric than **signal**. If you have 40 minutes, spend 20 of them talking to the human. You will learn more about their commitment from their voice than their budget.
