prompt: |-
  2L in a war-crimes seminar and today's discussion basically turned into a slogan fight. One guy kept repeating nullum crimen sine lege, nulla poena sine lege and using it to argue that charging the defendants at Nuremberg with crimes against peace was flat out illegitimate, because the London Charter criminalized aggression after the invasions had already happened. Another guy said that maxim isn't a binding rule at all, just a vague principle of justice, so it can't possibly get the first guy what he wants — which is more or less the line the tribunals themselves took when they brushed the objection off. Both of them walked out thinking they'd won, and I'm not sure either of them said anything determinate.

  Play the role of a philosopher of criminal law who also actually knows the history of these tribunals (including the Tokyo one, where at least one judge thought the whole proceeding was retroactive lawmaking). I want a menu, not a verdict: lay out the distict principles that one line of Latin could be standing for here. E.g. is it demanding a pre-existing written text, or only that the norm was ascertainable/foreseeable to the actor; does customary or treaty-based international law count as "lex" at all; is there a separate no-analogy or no-extension clause doing work; do the two halves (crime vs. punishment) actually pull apart when the penalty wasn't specified in advance; and is the real objection about the law or about the court that's applying it?

  For each reading, tell me whether it's plausible on its own terms and whether it would actually support my classmate's conclusion about crimes against peace. Brainstorm the possible readings first, think carefully about which ones collapse into each other, then sort them from trivial truism to substantive-but-defensible to false, and finish with which reading each of those two guys was probably invoking without realizing it. No bibliography or citations please — I just want the conceptual map.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of criminal law + Historian of international tribunals (Nuremberg/Tokyo).
      *   **Task:** Create a "menu" of distinct interpretations of the maxim *nullum crimen sine lege, nulla poena sine lege* (NCSL/NPSL) in the context of the Nuremberg Trials (specifically Crimes Against Peace).
      *   **Constraint:** No verdict, no bibliography/citations. Conceptual map only.
      *   **Specific Questions to Address:** Pre-existing written text vs. foreseeability? Customary/treaty law as *lex*? No-analogy/extension clause? Separation of crime vs. punishment? Law vs. Court jurisdiction?
      *   **Structure:** Brainstorm readings -> Collapse/Group them -> Sort (Trivial -> Substantive -> False) -> Diagnose the classmates.
      *   **Tone:** Academic, analytical, nuanced, slightly weary of slogan-fighting (matching the user's 2L perspective).

  2.  **Deconstruct the Maxim & Context:**
      *   *The Maxim:* "No crime without law, no punishment without law."
      *   *The Context:* Nuremberg (IMT) and Tokyo (IMTFE). The charge is "Crimes Against Peace" (waging aggressive war).
      *   *The Objection:* The London Charter (1945) defined this crime *after* the acts (1939-1945). Was this ex post facto?
      *   *The Tribunal's Response:* It wasn't ex post facto because the law already existed (Kellogg-Briand Pact, customary law).
      *   *The Dissent (Tokyo):* Justice Pal (and others) argued it *was* ex post facto victor's justice.

  3.  **Brainstorming Interpretations (The "Menu"):**
      *   *Reading 1: Strict Statutory Positivism.* Law = Written Code enacted by a sovereign. If no code before the act, no crime.
      *   *Reading 2: Customary/International Lex.* Law includes treaties and custom. If the norm existed in custom, *lex* is satisfied even without a penal code.
      *   *Reading 3: Foreseeability/Fair Warning.* The core value is notice. Could a reasonable leader know invading neighbors was wrong/illegal?
      *   *Reading 4: Separation of Powers/Jurisdiction.* It's not about the substance of the crime, but the authority of the court. Did this specific tribunal have the power to judge?
      *   *Reading 5: Penalty Specificity (Nulla Poena).* The crime might be clear, but was the *punishment* (death/hanging) specified?
      *   *Reading 6: No Analogy.* Are we stretching an existing law (e.g., war crimes) to cover something new (aggression)?
      *   *Reading 7: Moral/Legal Naturalism.* Some acts are inherently criminal regardless of positive law (malum in se). NCSL doesn't apply to universal evils.

  4.  **Collapsing and Sorting:**
      *   *Collapse:* Reading 1 (Strict Positivism) and Reading 6 (No Analogy) often go together. Reading 3 (Foreseeability) is the modern human rights interpretation of Reading 2. Reading 4 (Jurisdiction) is distinct from substantive criminal law. Reading 7 (Naturalism) essentially negates NCSL.
      *   *Sort:*
          *   *Trivial/True but useless:* "Law must exist." (Tautology).
          *   *Substantive/Defensible:* Foreseeability/Customary Law.
          *   *False/Problematic:* Strict Statutory Positivism in Int'l Law context; Naturalism negating NCSL entirely.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the 2L frustration. Slogans hide complexity. Set the stage (Nuremberg/Tokyo).
      *   **The Menu (Categorized):**
          1.  *The Source Question:* What counts as *lex*? (Statute vs. Custom/Treaty).
          2.  *The Notice Question:* Strict text vs. Foreseeability.
          3.  *The Extension Question:* Analogy vs. Interpretation.
          4.  *The Penalty Question:* *Nullum crimen* vs. *Nulla poena* (did they know the penalty?).
          5.  *The Institutional Question:* Substance vs. Jurisdiction.
      *   **Evaluation of Each:** Plausibility + Does it support the classmate's "Illegitimate" conclusion?
      *   **Sorting:** Trivial -> Substantive -> False.
      *   **Diagnosis:** What were the classmates actually saying?

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish Nuremberg (Jackson's view) from Tokyo (Pal's dissent). The prompt mentions Tokyo specifically regarding retroactive lawmaking.
      *   *Nuance:* The "Foreseeability" standard is the bridge between the strict positivist and the tribunal's view. If the Kellogg-Briand pact made war illegal, was criminal liability foreseeable?
      *   *Penalty:* This is often overlooked. Even if aggression was a crime, was *hanging* the prescribed penalty? This is a strong point for the defense.
      *   *Jurisdiction:* The Tribunal said "We are the sovereign power now." The defense said "You are a new court applying new rules."

  7.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   Menu not verdict? Check.
      *   Philosopher/Historian persona? Check.
      *   Address specific sub-questions (written text, customary law, analogy, penalty, court)? Check.
      *   Diagnose classmates? Check.

  8.  **Final Polish:** Ensure the tone is empathetic to the 2L experience (the "slogan fight") but elevates the discourse. (e.g., "You've stumbled into the central tension of international criminal law.")

  *(Self-Correction on Sorting)*: I need to be careful calling views "False." In philosophy, "False" usually means "Internally incoherent" or "Historically inaccurate." I will frame it as "Conceptually unstable in this context."

  *(Refining the Classmate Diagnosis)*:
  *   Classmate 1 (Strict Latin guy): Likely invoking Strict Statutory Positivism + Source Question (Lex = Code).
  *   Classmate 2 (Vague Principle guy): Likely invoking Foreseeability + Customary Law + Tribunal's pragmatic view.

  Let's write it.cw
answer: |-
  You have stumbled into the central tension of international criminal law. The frustration you feel is warranted: *nullum crimen sine lege* (NCSL) is often wielded as a trump card when it is actually a bundle of distinct, sometimes conflicting, conceptual claims. At Nuremberg and Tokyo, this wasn't just academic; it was the difference between hanging and acquittal.

  Here is the conceptual map you asked for. I have broken the maxim down into five distinct readings, evaluated their plausibility in the 1945–1948 context, and assessed whether they support your first classmate's conclusion (that the trials were illegitimate).

  ### I. The Menu of Readings

  #### 1. The Source Reading: What counts as *Lex*?
  *   **The Claim:** *Lex* requires a specific, enacted penal code issued by a sovereign legislature prior to the act.
  *   **The Nuance:** Does international treaty law (e.g., Kellogg-Briand Pact) or customary international law count as *lex*? Treaties often outlaw war but lack criminal sanctions. Custom is unwritten.
  *   **Plausibility:** High in domestic systems; low in international law. In 1945, there was no global legislature. If *lex* requires a domestic-style penal code, international criminal law is impossible by definition.
  *   **Supports Classmate 1?** **Yes.** If *lex* means "written penal statute," the London Charter was ex post facto legislation. The defendants could not have been charged under a code that didn't exist.
  *   **Supports Classmate 2?** **No.** This reading treats the maxim as a rigid rule, not a vague principle.

  #### 2. The Notice Reading: Text vs. Foreseeability
  *   **The Claim:** The purpose of NCSL is fair warning. The defendant must have been able to ascertain that the conduct was criminal.
  *   **The Nuance:** This shifts the focus from the *form* of the law (written code) to the *function* of the law (notice). Could a reasonable head of state in 1939 foresee that launching an aggressive war would incur individual criminal liability?
  *   **Plausibility:** Very high. This is the modern human rights interpretation (e.g., ECHR). It allows for customary law to satisfy *lex* if the norm was sufficiently clear.
  *   **Supports Classmate 1?** **No.** The Tribunal argued that the Kellogg-Briand Pact and state practice made aggressive war illegal, and that leaders should have known "illegal war" implied personal responsibility. If notice was given, NCSL is satisfied.
  *   **Supports Classmate 2?** **Yes.** This aligns with the "vague principle of justice" view—the core value is fairness/notice, not strict statutory positivism.

  #### 3. The Extension Reading: No Analogy
  *   **The Claim:** NCSL prohibits extending existing crimes to cover new conduct via analogy.
  *   **The Nuance:** Was "Crimes Against Peace" a new crime, or an extension of existing "War Crimes"? War crimes traditionally covered conduct *in* war (atrocities), not the decision *to start* war.
  *   **Plausibility:** Moderate. In civil law systems, analogy is strictly forbidden. In common law, judicial interpretation stretches statutes. The IMT had to argue this was a pre-existing category, not an analogical extension.
  *   **Supports Classmate 1?** **Yes.** If "aggression" was not a distinct crime with individual liability prior to 1945, charging it is an impermissible analogical extension of "war crimes."
  *   **Supports Classmate 2?** **Ambiguous.** One could argue the "principle of justice" forbids analogy just as much as it demands notice.

  #### 4. The Penalty Reading: *Nullum Crimen* vs. *Nulla Poena*
  *   **The Claim:** Even if the conduct was criminal (*nullum crimen*), the specific punishment must also be prescribed by law (*nulla poena*).
  *   **The Nuance:** Even if aggressive war was illegal in 1939, was *death by hanging* the prescribed penalty? Or was the sanction merely state responsibility (reparations, loss of territory)?
  *   **Plausibility:** High, and often overlooked. Justice Pal (Tokyo Tribunal) leaned heavily here. International law previously punished states, not individuals. Individual criminal liability is itself a form of punishment.
  *   **Supports Classmate 1?** **Yes, strongly.** This is the strongest technical argument for illegitimacy. The *lex* may have forbidden the act, but the *poena* (individual execution) was definitely new.
  *   **Supports Classmate 2?** **No.** This treats the maxim as a binding constraint on sentencing, not just a moral aspiration.

  #### 5. The Institutional Reading: Law vs. Court
  *   **The Claim:** The objection isn't about the substantive law, but the jurisdiction of the tribunal.
  *   **The Nuance:** "No crime without law" can mean "No crime without a competent court authorized by law." The London Charter created the IMT. Was the Charter itself valid law, or was it a political fiat by the victors?
  *   **Plausibility:** Moderate. This was the "Victor's Justice" critique. The Allies effectively legislated for the defeated.
  *   **Supports Classmate 1?** **Yes.** If the Charter is merely a political order, not *lex*, the court lacks jurisdiction.
  *   **Supports Classmate 2?** **No.** This is a jurisdictional rule, not a vague principle.

  ---

  ### II. Sorting the Readings

  Here is how these readings stack up from trivial to substantive to false, specifically within the historical context of 1945–1948.

  **1. The Trivial Truism: "Conduct must be regulated."**
  *   *Reading:* A bare assertion that there must be *some* norm against the conduct.
  *   *Status:* **Trivial.** Everyone agrees aggressive war was prohibited by treaty (Kellogg-Briand). If NCSL only means "the act must be prohibited," the defendants lose immediately. This is the strawman Classmate 2 was attacking.

  **2. The Substantive-but-Defensible: "Foreseeability of Liability."**
  *   *Reading:* The Notice Reading (above).
  *   *Status:* **Defensible.** This is the strongest middle ground. It admits there was no penal code but asks if the *consequence* (criminal trial) was foreseeable. The Tribunal said yes (treaties implied it); the Defense said no (treaties only implied state sanctions). This is where the actual legal fight happened.

  **3. The Conceptually Unstable: "Strict Domestic Positivism in International Law."**
  *   *Reading:* The Source Reading (requiring a penal code).
  *   *Status:* **False/Incoherent in this context.** Applying domestic standards of statutory precision to the international sphere in 1945 renders all international criminal law impossible. It demands a sovereign legislature that did not exist. However, it is logically consistent *if* you believe international criminal law is illegitimate per se.

  **4. The Hidden Dagger: "The Penalty Specificity."**
  *   *Reading:* The Penalty Reading (*Nulla Poena*).
  *   *Status:* **Substantive and often ignored.** Even if the crime existed, the *punishment* (individual execution) was arguably ex post facto. This separates the two halves of the maxim. You can have *nullum crimen* (the act was wrong) but violate *nulla poena* (the penalty was new).

  ---

  ### III. Diagnosis of Your Classmates

  Neither of your classmates was wrong, but they were talking past each other because they were invoking different halves of the map.

  **Classmate 1 (The Latin Reciter)**
  *   **Invoking:** **The Source Reading (Strict Positivism)** combined with **The Penalty Reading**.
  *   **The Blind Spot:** He is treating international law as if it were the German Penal Code. He assumes *lex* requires a specific statutory text with defined penalties.
  *   **Why he thinks he won:** On his terms, he is correct. There was no international penal code in 1939. If *lex* means "statute," Nuremberg was ex post facto.
  *   **The Flaw:** He ignores the Tribunal's argument that *lex* includes customary law and treaties, and that the "penalty" of individual liability was a necessary evolution of existing norms. He is arguing for a rule that would make international criminal law impossible.

  **Classmate 2 (The Pragmatist)**
  *   **Invoking:** **The Notice Reading (Foreseeability)** and **The Institutional Reading**.
  *   **The Blind Spot:** He dismisses the maxim as "just a principle" to clear the board for the Tribunal's logic. He ignores the *Nulla Poena* problem. Even if the crime was foreseeable, was the *death penalty* foreseeable for a head of state acting in an official capacity?
  *   **Why he thinks he won:** He aligns with the Judgment itself, which treated NCSL as a principle of justice (fair warning) rather than a technical bar. Since the defendants knew war was illegal, justice was served.
  *   **The Flaw:** He concedes too much to the victors. By calling it a "vague principle," he removes the teeth of the protection against arbitrary power. He fails to address Justice Pal's dissent in Tokyo: that applying a new *jurisdiction* to old acts is itself a violation of legality, regardless of moral guilt.

  ### The Synthesis You Were Missing
  The reason you feel neither "won" is that the maxim splits in two here.
  1.  **Substantive:** Was aggressive war a crime? (Foreseeability/Custom). Classmate 2 wins this; the norm existed.
  2.  **Procedural/Penal:** Could *these* men be *personally* punished by *this* court? (Source/Penalty). Classmate 1 wins this; the mechanism of individual criminal liability for heads of state was novel and created retroactively by the London Charter.

  The Tribunal essentially argued that Point 1 overrides Point 2 because the moral gravity of aggression demands a mechanism for punishment, even if that mechanism had to be built after the fact. Your classmates were arguing opposite sides of that trade-off without acknowledging the trade-off existed.
