  **(a) Residual obstacle is epistemic (Hayekian) rather than arithmetic:** **0.95**
  The bottleneck is not FLOPs but the encoding of tacit, contextual knowledge into a transmissible signal; sensors capture data, not meaning.

  **(b) Designed code can match evolved code (price system):** **0.80**
  Given 2060 AI/ML capabilities, a central optimizer can likely approximate static allocative efficiency close to market clearing, treating the economy as a solvable constraint satisfaction problem.

  **(c) Innovation has a computational analogue without P&L selection:** **0.75**
  Evolutionary algorithms and generative models can simulate variation and selection, provided the fitness function is well-specified, though "true novelty" remains a risk.

  **(d) Political problem (objective function auditing) is decisive:** **0.75**
  Incentive compatibility is the hard constraint; without residual claimancy, agents will game the valuation elicitation and objective function regardless of compute power.

  **(e) Historical record carries real evidential weight:** **0.90**
  The scaling limits of internal firm bureaucracy and the collapse of Soviet planning are data points on the cost of administration, not merely artifacts of 20th-century tech.

  ### Combination Logic

  I treat these as **overlapping constraints on a common bottleneck**, specifically a multiplicative chain where (d) acts as a gate on the technical feasibility of (b) and (c). (a) and (e) are priors that justify the specific probabilities assigned to (b), (c), and (d), rather than direct multipliers.

  The arithmetic for P is:
  $$P \approx \text{Prob(Tech Works)} \times \text{Prob(Politics Doesn't Kill It)}$$
  $$P \approx (b \times c) \times (1 - d)$$
  $$P \approx (0.80 \times 0.75) \times (1 - 0.75)$$
  $$P \approx 0.60 \times 0.25 = 0.15$$

  The logic is that even if the 2060 technology solves the calculation and innovation problems (60% chance), the system fails if the incentive structure collapses (which I judge 75% likely).

  ### Sensitivity Analysis

  **Most Sensitive Term:** **(d) The Political/Incentive Problem.**
  Because (d) acts as a gate (the $1-d$ term), a shift in credence here moves the final number linearly and drastically. If you convince me that $d = 0.40$ (politics is only 40% likely to be decisive), P jumps to $0.60 \times 0.60 = 0.36$. If $d = 0.90$, P collapses to $0.06$. The technical terms (b) and (c) are capped by (d); improving compute cannot fix a broken objective function.

  **Decisive Observation:**
  A large-scale, long-duration experiment in **radical participatory budgeting with binding constraints**. If a municipality of 100,000+ could allocate 50% of its capital budget via direct digital voting/valuation without collapsing into rent-seeking or fiscal deficit over 10 years, it would lower (d) significantly. Current evidence (e.g., participatory budgeting in Porto Alegre) suggests decay over time, supporting high (d).

