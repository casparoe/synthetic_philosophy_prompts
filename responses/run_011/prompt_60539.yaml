  10. **Final Polish:** Ensure the ranking is clear (Fatal, Awkward, Explain-away). Make sure the advice on "Downgrading" is constructive. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't just say "Ostrom proves you wrong." I need to explain *why* it challenges the "unilateral" aspect specifically. Also, the "Crypto" angle is a strong modern test case for "code as enforcer" which isn't a "person" but is "unilateral logic." I should include that.

  Let's organize the "Ranked Map" first, then tackle the specific questions.

