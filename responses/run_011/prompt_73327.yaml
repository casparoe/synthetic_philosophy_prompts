answer: |-
  Good evening.

  For those who don't know me, I am the graduate student currently occupying the last seminar Professor Halloran will teach. We are reading Braudel's *Mediterranean*. Line by line. Sometimes word by word.

  Standing here, looking at this room, I am acutely aware of a theoretical problem. Professor Halloran has spent thirty years arguing that a retirement dinner is what Braudel called an *événement*: a surface disturbance, a flash of foam on the wave, possessing no explanatory weight whatsoever. To her, the only things that are real are the structures: the geography, the price cycles, the slow, silent currents of the *longue durée*.

  So, if I stand here and tell you what a brilliant individual she is, or how she single-handedly transformed her field, I am not paying her a compliment. I am writing bad history. I am mistaking the foam for the sea. And if I try to convince you in the last thirty seconds that "actually, events do matter," I am buying her affection with a concession she would rightly reject.

  So I will not do that. I will not tell you that tonight matters. Tonight is merely an event. It is one evening, one room, eighty people. In a century, it will be invisible.

  But the structure she built is not.

  To the early modernists in the room: We know the argument. She taught us that the three time-scales are not three kinds of cause, but three resolutions of a single instrument. You get the geography by lowering the temporal resolution until centuries look simultaneous. You get the event by zooming all the way in.

  I can confirm the instrument works. Though I must note, when I submitted my seminar paper two days late, the temporal resolution zoomed in very, very quickly.

  But to the family at the table, who have never read a page of Braudel: You know her differently. You know her as someone who was always working. You saw the late nights, the cancelled plans, the mind that was somewhere else, tracing routes across a sea that dried up five hundred years ago. It might have looked like absence. But I am here to tell you that it was not absence. It was construction.

  While you saw her working, she was building a structure sturdy enough for the rest of us to stand on. When she argued that the individual is not the engine of history, she wasn't diminishing people. She was making space for them. She taught us that we are not isolated sparks; we are carried by currents. She taught us that to understand a life, you cannot just look at the birthday or the funeral. You have to look at the climate they breathed, the roads they walked, the slow grind of economies they couldn't see.

  She taught us that explanation sits in the slow structures. And if there is one thing this room represents, it is a structure.

  There are three decades of students here. We are not an event. We are a demographic trend. We are the price cycle of her intellectual labor. We are the geography she mapped.

  To the family: Thank you for lending her to the discipline. We know the cost of the *longue durée*. It requires a life lived at a different speed.
  To the colleagues: Thank you for keeping the argument sharp.
  And to the students: We are the evidence that the structure holds.

  Professor Halloran, I cannot toast to you as an individual hero, because you have taught us that heroes are just data points waiting for a larger graph. I cannot toast to this night, because you have taught us that tonight is just noise.

  So I will toast to the work. I will toast to the currents you charted, which will carry us long after the lights in this room go out. I will toast to the instrument you tuned, which we will keep playing.

  Please raise your glasses.

  To the *longue durée*.
  To the sea.
  And to you, Professor Halloran, who taught us how to see it.
