answer: |-
  Here is a delivery plan designed to navigate the Humean preconception while securing the specific metaphysical stakes of Ghazālī's occasionalism.

  ### 1. The Sequence and Dependencies

  You have 50 minutes. Do not start with history. Start with the conceptual friction.

  **Minute 0–5: The Hume Trap (Setting the Boundary)**
  *   **Action:** Acknowledge Week 6 immediately. Write "Hume = ?" and "Ghazālī = ?" on the board.
  *   **Move:** State clearly: "If you leave today thinking Ghazālī is just Hume with a beard, you have missed the point."
  *   **Dependency:** This must happen *before* you explain Ghazālī's argument. If you explain the argument first, they will assimilate it into the Humean framework you just taught them.
  *   **The Damage Point:** Explicitly flag that Hume makes an *epistemic* claim (we cannot *know* necessity), whereas Ghazālī makes an *ontological* claim (necessity *does not exist* in nature).
  *   **Goal:** Create a "conceptual quarantine" so they don't file Ghazālī under "Skepticism about Induction."

  **Minute 5–15: The Observation (Conjunction vs. Bringing About)**
  *   **Component:** *The distinction between observing that two events are conjoined and observing that one brings about the other.*
  *   **Placement:** First argumentative step.
  *   **Dependency:** Relies on the Hume boundary set above. Because they know Hume, you can use the "billiard ball" intuition briefly to establish the *observation* gap, then pivot.
  *   **Crucial Pivot:** Stop where Hume stops. Hume says, "We see A, then B, and feel a determination." Ghazālī says, "We see A, then B, and *nothing else happens*."
  *   **Instruction:** Do not mention God yet. If you mention God here, they will treat it as a "God of the gaps" argument to fill the epistemic hole. Keep it on the phenomenology of the sequence.

  **Minute 15–25: The Metaphysical Step (Denial of Necessity, Not Sequence)**
  *   **Component:** *The claim that what Ghazālī denies is necessity in the connection rather than the existence or reliability of the sequence itself.*
  *   **Placement:** Second step. This is the shield against the "he denied science" misconception.
  *   **Dependency:** Depends on the previous distinction. Because we only see conjunction, we cannot assert necessity. Therefore, asserting necessity is a philosophical error, not a scientific one.
  *   **The Damage Point:** This is where the Hume frame does the most damage. Hume leaves the *world* alone and critiques the *mind*. Ghazālī critiques the *world* (nature has no causal power) to save the *mind* (from idolatry of nature). Ensure they see Ghazālī is making a claim about *powers*, not just *knowledge*.

  **Minute 25–35: The Agent and The Custom (God as Agent)**
  *   **Component:** *The step from that denial to God as the agent in each case, acting in a settled customary way.*
  *   **Placement:** Third step. Now you introduce the theology.
  *   **Dependency:** Depends on the denial of natural necessity. If nature has no power, power must reside elsewhere.
  *   **Instruction:** Emphasize "Custom" (*ʿāda*). This is the bridge to the next section. It is not arbitrary whim; it is a consistent habit of the Divine Will.

  **Minute 35–45: The Payoff (Miracles and Prediction)**
  *   **Component:** *The payoff that the regularity we depend on is sustained but not logically forced, which is what simultaneously leaves room for miracles and leaves prediction intact.*
  *   **Placement:** Final argumentative step.
  *   **Dependency:** Depends on "Custom." Because God acts habitually, prediction works (science is safe). Because He is not *forced* by nature, He can interrupt (miracles are possible).
  *   **Goal:** Resolve the tension between "no causes" and "physics works."

  **Minute 45–50: Closing and Exclusions**
  *   **Action:** Deploy the closing question and state the exclusions.

  ---

  ### 2. The Example: Replacing Burning Cotton

  **I agree with your suspicion.** The burning cotton example is a trap in a 50-minute slot.
  *   **Why:** It is too visceral. "Fire burns" feels like a single event. It invites the student to think, "Okay, God makes it burn," which sounds like a magical intervention in a specific instance, reinforcing the idea that Ghazālī is disrupting physics. It obscures the *regularity* aspect.
  *   **The Replacement:** **Ingestion and Satiety (Eating Bread and Feeling Full).**
  *   **Why this works:**
      1.  **It has duration:** Unlike the flash of fire, digestion is a sequence over time. It highlights that A (eating) is followed by B (fullness), but there is a gap where "power" could be located.
      2.  **It is contingent:** Students know from experience that eating does not *necessarily* lead to satiety (you can eat and vomit; you can eat and remain hungry due to illness). This makes the denial of *necessity* intuitively plausible without denying the *sequence*.
      3.  **It avoids the "Magic" visual:** Fire burning cotton looks like destruction. Bread creating energy looks like sustenance. It makes the "God as Sustainer" claim feel more like a metaphysical grounding than a magical interruption.
  *   **What the example must HAVE:** High reliability (we expect to get full), but visible contingency (it doesn't always happen).
  *   **What the example must LACK:** A visible mechanism of transfer. (With fire, we see the flame touch the cotton. With digestion, the "transfer" of nourishment is hidden, making the claim that "God creates the satiety" less of a visual contradiction).

  **How to deploy it:** Ask the class: "When you eat bread, does the bread *force* your body to be full? Or is it a reliable sequence that could, in principle, be otherwise?" Use this to pivot to God's Custom.

  ---

  ### 3. Misconception Map

  Here is how to handle the specific misconceptions in this room.

  | Misconception | Strategy | Timing & Method |
  | :--- | :--- | :--- |
  | **"Ghazālī is simply Hume six centuries early."** | **Preempt.** | **Minute 0–5.** Do not let this take root. Use the Epistemic (Hume) vs. Ontological (Ghazālī) distinction as the lens for the whole lecture. |
  | **"Ghazālī denied causes or science altogether."** | **Preempt.** | **Minute 15–25.** When discussing the denial of necessity, explicitly state: "He is saving science from philosophy, not destroying science." Use the "Reliability of Sequence" component. |
  | **"Occasionalism makes prediction/physics impossible."** | **Let Surface, then Answer.** | **Minute 35–45.** Let them feel the worry during the "God as Agent" section. Then resolve it immediately with the "Custom" (*ʿāda*) argument. This provides a dramatic resolution. |
  | **"The position destroys human agency/responsibility."** | **Park/Exclude.** | **Do not cover.** This leads to the doctrine of *kasb* (acquisition), which is too technical for 50 minutes. If a student raises it, say: "That is the next logical question, but it requires a separate lecture on human action. For today, we are looking at *natural* causation." |
  | **"He personally ended scientific activity in the Islamic world."** | **Address at End.** | **Minute 45–50.** Treat this as a historiographical myth. Briefly state that historians of science no longer accept this causal link. Do not let it dominate the philosophy. |

  ---

  ### 4. The Closing Question

  Do not ask a recall question. Ask a question that forces them to apply the distinction between *necessity* and *connection*.

  **"If Ghazālī is correct that there is no necessary connection in nature, what prevents the world from descending into chaos, and who or what is responsible for that prevention?"**

  *   **Why this works:**
      *   If they answer "God," they grasped the Agent component.
      *   If they answer "Custom/Habit," they grasped the Prediction component.
      *   If they answer "Nothing," they missed the payoff.
      *   Crucially, if they answer "The laws of physics," they have failed to distinguish Ghazālī from the Philosophers (Avicenna).
      *   It forces them to articulate the *source* of regularity without necessity.

  ---

  ### 5. What to Refuse to Cover

  You must explicitly announce these exclusions to manage expectations and prevent the "Human Agency" misconception from derailing the session. Say this verbatim or close to it:

  *"To make this argument fit the time we have, I am explicitly excluding three things today. First, I am not covering Ash'arite atomism; we are talking about causation, not the composition of matter. Second, I am not covering the doctrine of acquisition (*kasb*); we are looking at natural causes, not human responsibility. Third, I am not covering Ibn Rushd's rebuttal; today is for Ghazālī's positive claim, not the subsequent debate. If you are interested in those, see me in office hours."*

  ---

  ### 6. Confidence and Interpretative Disputes

  **Confidence in Ordering:** I am **highly confident** in this sequence. Placing the Hume/Ghazālī distinction at the very start is critical; if you wait until the end to distinguish them, the students will have already encoded Ghazālī as "Medieval Hume," and you will spend the rest of the term correcting it. The flow from Observation → Denial of Necessity → Divine Agent → Custom is the only logical progression that preserves the "Science is safe" payoff.

  **Interpretative Uncertainty:** I am **least sure** (and you should flag this to the class) regarding the **strength of Ghazālī's ontological claim versus his epistemic caution.**
  *   **The Dispute:** Some specialists (e.g., Marmura) argue Ghazālī is primarily making a logical point about what we can *demonstrate*, leaving the metaphysical reality open. Others (e.g., Griffel) argue he is committed to a robust occasionalist ontology where natural powers genuinely do not exist.
  *   **How to handle it:** In the "Metaphysical Step" (Minute 15–25), phrase it carefully: "Ghazālī argues that we have no warrant to say necessity exists, and given his theological commitments, he concludes it does not." This acknowledges the interpretative debate without bogging down first-years in secondary literature. Relying on the "strong" occasionalist reading is pedagogically necessary for this module, but you should acknowledge it is a specific reading of the text.
