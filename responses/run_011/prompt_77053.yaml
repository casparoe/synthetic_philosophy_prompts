      *(Closing Question)*: "If you were a scientist in Ghazālī's court, what would you write in your lab notebook differently than a scientist in Avicenna's court?" (Tests if they know the *practice* doesn't change, only the *interpretation*). Or: "Does Ghazālī require us to stop expecting the sun to rise?" (Too simple).
      *   Better: "Ghazālī says the connection is not necessary. Hume says the connection is not known. If Ghazālī is right, does the world change? If Hume is right, does the world change?"

