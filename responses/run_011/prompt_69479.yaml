  1. **The Verdict of Primacy**
  The Primacy Thesis provides the only viable foundation for the coherence-argument program, establishing diachronic self-government as the bedrock norm while reducing static axioms to instrumental tools. While the Fixed Menu Objection correctly identifies structural limitations and Representational Quietism accurately diagnoses the descriptive nature of formal theorems, only the Primacy Thesis preserves the normative force that makes decision theory relevant to agency. The static axioms of expected utility theory are not self-justifying truths about rationality but instrumental rules derived from the fundamental requirement that no sequence of freely accepted offers leaves an agent strictly worse off. An agent is rational not because her snapshots satisfy algebraic properties, but because her trajectory through time does not leave her vulnerable to exploitation. This verdict anchors the coherence program in the tangible reality of loss rather than the abstract geometry of preference spaces. The dispute resolves in favor of Primacy because it alone explains why we care about coherence without presupposing the very mental magnitudes whose existence is in question. If we accept Quietism, we lose the reason to be coherent. If we accept the Fixed Menu Objection without Primacy, we lose the ability to judge choices. Primacy retains the judgment while grounding it in survival, ensuring that the coherence program remains a guide for action rather than a mere taxonomy of thought.

  2. **Dynamic Choice and Resoluteness**
  To sustain this thesis, one must navigate the taxonomy of dynamic choice, specifically the modes of myopic, sophisticated, and resolute choice. Myopic agents evaluate each node as a new one-shot problem, ignoring how current choices constrain future menus, making them notoriously vulnerable to exploitation because they fail to see the sequence as a whole. Sophisticated agents anticipate their future preferences and choose currently to mitigate future self-defeat, yet they remain vulnerable if their preferences are dynamically inconsistent, as they may simply avoid nodes where they would make bad choices rather than correcting the preferences themselves. The resolute agent, who commits to a plan and executes it despite shifting local preferences, seems the natural ally of the Primacy Thesis. However, a consequentialist argument for resoluteness typically relies on the value of the final outcome, presupposing that the static axioms define the good. If static axioms are demoted, the resolute agent cannot simply appeal to expected utility maximization as the goal, for that goal is now suspect.
  Instead, resoluteness must be justified directly by unpumpability. An agent is resolute not because she maximizes a function, but because deviation from her plan constitutes the specific sequence of trades that generates a money pump. Thus, the Primacy Thesis salvages resoluteness by redefining its telos from utility maximization to loss avoidance. The consequentialist argument remains available, but it must be stripped of its reliance on static utility functions. The agent resolves to stick to a plan not because the plan maximizes expected utility in a static sense, but because abandoning the plan triggers a sequence of exchanges that leaves her with less than she started. This shifts the focus from the content of the preference to the structural integrity of the choice sequence. The normativity comes from the avoidance of the pump, not the maximization of the metric. Without this shift, the resolute agent is merely dogmatic; with it, she is self-protecting.

  3. **The Pumping Case**
  Consider a concrete sequential case where an agent violates the independence axiom to demonstrate pumpability. Suppose an agent faces a choice at Node 1 between Option A, a sure $1 million, and Option B, a lottery ticket offering a 99% chance of $5 million and 1% chance of $0. If she chooses B, she moves to Node 2. At Node 2, she faces a choice between Option C, keeping the ticket, and Option D, swapping it for a ticket offering a 90% chance of $5 million and 10% chance of $0. Her preferences are such that she prefers A over B initially, reflecting extreme risk aversion regarding the sure million, but if she reaches Node 2, she prefers D over C, reflecting a shift in probability weighting where she dislikes the 1% risk more than the 10% risk in a different context. This structure mirrors Allais-type preferences where the certainty effect dominates initially but fades under risk. A clever bookie can exploit this dynamic inconsistency. At Node 1, the bookie offers her a trade: switch from A to B for a penny. She accepts, preferring B to A. Now she holds B and is at Node 2.
  At Node 2, the bookie offers her a trade: switch from B (Option C) to Option D for a penny. She accepts, preferring D to C. She ends up with Option D minus two pennies. Option D is strictly worse than Option A in terms of expected value and stochastic dominance, yet she paid to move from A to D. The bookie pockets two pennies risk-free. This sequence demonstrates that violating independence in a sequential context invites diachronic failure. The static axiom matters precisely because its violation enables this pump, confirming the Primacy Thesis that axioms are justified by unpumpability. The loss is real, not merely a formal inconsistency. The agent ends the sequence with less money than she began, having freely accepted every step. This is the core violation of self-government. The bookie's profit is the measure of the agent's irrationality.

  4. **The Fixed Menu Objection**
  The Fixed Menu Objection argues that because earlier choices determine later menus, the act space is endogenous, undermining representation theorems that assume a fixed backdrop. If valid, this objection would prove too much, dismantling not just coherence arguments but any preference-based modeling of sequential interaction. Every decision tree is constructed by the agent's prior commitments; if this relativizes the act space to the point of incoherence, no theorem could ever apply to real agents. The objection fails because it conflates the construction of the problem with the constraints on solving it. While an agent supplies the individuation of acts, she does not supply the logic of consequence that links those acts to outcomes. The Primacy Thesis accepts that menus are dynamic but insists that the transition between them must not be exploitable.
  The representation theorem does not need to describe a fixed universe of acts to be useful; it needs to describe the constraints on any universe of acts an agent chooses to inhabit. If an agent carves up her problem in a way that allows a pump, the carving itself is defective. The Fixed Menu Objection correctly notes that theorems are relative, but incorrectly infers that relativity implies normative inertness. Even if the menu is fixed by the agent, the agent is still bound by the requirement not to pump herself. The relativity of the act space does not grant immunity from exploitation. Therefore, the objection highlights a technical limitation of static modeling but fails to undermine the normative core of the coherence program, which applies regardless of how the menu is individuated. The constraint is on the agent's consistency across her own constructed menus. Standard one-shot theorems are also relative to a menu, yet we accept their normative force; sequential cases are no different.

  5. **Quietism and Normativity**
  Finally, Representational Quietism suggests coherence theorems are merely consistency checks on descriptions, lacking normative authority. If Quietism were right, the persistence of the coherence program would be a massive error, a collective hallucination of normativity where there is only description. However, Quietism cannot explain why agents actively seek to avoid incoherence or why bookies actively seek to exploit it. The reason the program seems to deliver normative conclusions is that it actually does, grounded in the Primacy Thesis. We care about coherence because incoherence costs money, resources, and opportunities. Quietism strips the program of this explanatory power, leaving us with a formalism that detects errors but cannot say why they are errors.
  The Primacy Thesis restores the link between formal consistency and practical success. It acknowledges that theorems describe mental magnitudes only instrumentally, but insists that the relationships between those magnitudes track real vulnerabilities in the world. Therefore, Quietism must be rejected in favor of a view that sees coherence as a necessary condition for effective agency. The dispute ends not with a dissolution of normativity, but with its relocation from abstract axioms to the concrete requirement of diachronic self-government. The coherence program survives not as a discovery of mental laws, but as a warning system against self-defeat. The normativity is real because the loss is real. Quietism fails because it cannot account for the pain of the pump.
