prompt: |-
  I'm a third-year psych PhD student and I'm writing the coding manual for a wellbeing measure that's going to end up weighting outcomes in a cost-effectiveness analysis, so I can't be too sloppy about it.

  Setup: we get three streams on the same episodes from the same people. (1) Momentary — an app that lets you tap a button while it's happening if it feels good right now. (2) End-of-day — you scroll back through your day and rate each episode for how enjoyable it was. (3) An observer rating, from a trained RA watching silent video of a subset of episodes, judging from face and body only. I need one label — pleasant / not pleasant / can't tell — that all three can feed into and that means something stable enough to compare across people.

  The trouble is I've been reading philosophy of pleasure and now I think the naive version of my manual is incoherent. The default story is that pleasure is a felt quality, so a coder just asks "did it feel good?" But the heterogeneity problem is that the pleasure of a hot bath, of finally getting a proof to go through, of relief when a noise stops, and of a smell you barely registered don't seem to share any phenomenology — and there's the rival story where pleasure isn't a feel at all but a stance toward the experience: you want it to continue, you'd welcome more of it, you don't mind it while it lasts. My three streams are quietly measuring different things. The button-press is chasing the feel, the end-of-day rating is catching the stance, and the video is catching expression, which might track neither.

  So: write the procedure my coders actually run on a single episode. In order — the question asked at each step, what counts as a sufficient answer to it, and where the coder stops at can't-tell instead of guessing. Constraints that matter: coders are undergrad RAs with zero philosophy background, each item has to take under about 90 seconds, every step is logged so a disagreement between coders can be audited, and my PI signs off on the manual before we start. I need you to say explicitly which distinctions from the philosophy have to survive the trip down onto a coding sheet and which I'm allowed to drop, and to mark the steps that are really judgment calls in a procedure costume — I'd rather flag those than pretend our kappa is measuring something clean.

  Then run it on three episodes:

  - a long run where the participant never tapped once but rated it the best part of her day and said she'd do it again tomorrow;
  - a horror film she found genuinely frightening, tapped constantly through, and insists she loved;
  - a warm morning shower she didn't report at all until prompted, and then said yeah, that was nice, I hadn't thought about it.

  At least one of these is going to come out wrong in a way that wrecks a chunk of my data, and I want you to tell me which one and why instead of smoothing it over. Finish with a short list of what the procedure structurally cannot do — the questions it's going to look like it answers but doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested coding manual and analysis:

  1.  **Analyze the Request:**
      *   **User:** Third-year Psych PhD student.
      *   **Task:** Write a coding manual procedure for a wellbeing measure used in cost-effectiveness analysis (high stakes, needs precision).
      *   **Input Data:** Three streams per episode: (1) Momentary (app button tap), (2) End-of-day (retrospective rating), (3) Observer (RA watching silent video).
      *   **Output Label:** One label per episode: *Pleasant / Not Pleasant / Can't Tell*.
      *   **Core Problem:** The "Heterogeneity Problem" in philosophy of pleasure (Feeling vs. Attitude/Stance). The three streams measure different things (Feeling, Stance, Expression).
      *   **Constraints:**
          *   Coders: Undergrad RAs (no philosophy background).
          *   Time: < 90 seconds per item.
          *   Auditability: Every step logged.
          *   Transparency: Must identify which philosophical distinctions survive, which are dropped, and where "judgment calls" are masked as procedure.
          *   Test Cases: Run the procedure on three specific episodes (Run, Horror Film, Shower).
          *   Honesty: Identify which case will "wreck data" and why.
          *   Limitations: List what the procedure *cannot* do.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Feeling Theory:* Pleasure is a specific sensory or phenomenological quality (e.g., warmth, tingling). Problem: No common quality across bath, proof, relief.
      *   *Attitudinal Theory (Desire/Stance):* Pleasure is wanting the experience to continue or pro-attitude toward it. Problem: Masochism (horror films), habituation (shower).
      *   *Behavioral/Expression:* Facial coding (smiling, relaxing). Problem: Social masking, internal states not visible.
      *   *The Conflict:* The three data streams map onto these three theories.
          *   Momentary Tap $\approx$ Feeling (immediate sensation).
          *   End-of-Day $\approx$ Attitude (reflective desire/evaluation).
          *   Observer $\approx$ Expression (behavioral proxy).
      *   *The Goal:* Collapse these into *one* label for cost-effectiveness analysis (CEA). CEA usually needs "Utility" or "QALYs," which aligns closer to the *Attitudinal/Preference* view (what people value), but the Momentary data pulls toward *Hedonic Tone*.

  3.  **Drafting the Procedure (The "Coding Manual"):**
      *   *Constraint Check:* Needs to be simple enough for undergrads but robust enough for a PI.
      *   *Strategy:* Don't ask RAs to solve philosophy. Ask them to weigh evidence hierarchically.
      *   *Hierarchy:*
          1.  **Self-Report (End-of-Day)** is the gold standard for *Wellbeing* in CEA (it captures value).
          2.  **Momentary** acts as a validity check (was it intense?).
          3.  **Observer** acts as a sanity check (was there distress?).
      *   *Philosophical Decision:* We must prioritize the *Attitudinal* view (End-of-Day) for CEA because cost-effectiveness is about resource allocation based on *value* to the agent, not just raw sensory spikes. However, we need to flag cases where Attitude diverges wildly from Feeling/Expression (e.g., horror films).
      *   *The "Judgment Call":* The weighting of conflicting streams. I need to make this explicit in the manual as a decision rule, not a "natural fact."

  4.  **Developing the Steps (Under 90 seconds):**
      *   Step 1: Check End-of-Day (EoD). If clear, tentatively label.
      *   Step 2: Check Momentary (Mo). Does it contradict EoD severely?
      *   Step 3: Check Observer (Obs). Is there visible distress incompatible with "Pleasant"?
      *   Step 4: Final Decision Rule (The "Algorithm").
      *   *Audit Trail:* Log the input values and the rule triggered.

  5.  **Addressing the Philosophical "Survival" Question:**
      *   *Drop:* The question of "What *is* pleasure?" (Ontology).
      *   *Keep:* The distinction between "Immediate Sensation" and "Reflective Valuation."
      *   *Flag:* The "Masochism/Counter-Preference" problem (Horror film).

  6.  **Running the Test Cases:**
      *   *Case 1 (Run):* Mo=Low (no taps), EoD=High (best part), Obs=Neutral/Strained?
          *   *Result:* Pleasant (driven by EoD).
          *   *Philosophy:* Attitudinal wins over Hedonic. "Runner's High" is often retrospective.
      *   *Case 2 (Horror):* Mo=High (constant taps - arousal?), EoD=High (loved it), Obs=High Distress (screaming/tensing).
          *   *Result:* **CRITICAL FAILURE.** Observer says "Distress/Not Pleasant." Self-report says "Pleasant."
          *   *Why it wrecks data:* In CEA, "Pleasant" usually implies "Good for health/welfare." If we code horror as "Pleasant" based on self-report, but the physiological/behavioral marker is stress, does it count as health gain? This is the "Adaptive Preference" or "Miswanting" problem.
      *   *Case 3 (Shower):* Mo=None, EoD=Low/Mid (forgot until prompted), Obs=Relaxed.
          *   *Result:* Can't Tell / Not Pleasant (depending on threshold).
          *   *Philosophy:* Habituation. It was good, but not "noticed."

  7.  **Identifying the "Wreckage":**
      *   The Horror Film is the obvious candidate. It exposes the conflict between *Hedonic Tone* (arousal/fear), *Attitudinal* (I like this), and *Biological Cost* (cortisol/stress). In a CEA, counting fear as "wellbeing" is risky.
      *   *Wait, actually:* The Run is also tricky. No momentary pleasure, but high retrospective value. This challenges the "Experience Utility" vs. "Remembered Utility" debate (Kahneman).
      *   *Decision:* The Horror Film is the most dangerous for *validity* of the "Pleasant" label in a health context. The Run is a measurement error issue. The Shower is a salience issue. I will flag the Horror Film as the one that breaks the construct validity of "Wellbeing" in a health economic context.

  8.  **Refining the Procedure for the User:**
      *   Tone: Professional, academic, slightly weary but precise (matching the user's PhD persona).
      *   Structure:
          1.  Philosophical Triage (What we keep/drop).
          2.  The Coding Procedure (Step-by-step).
          3.  The "Masked Judgment Calls" (Transparency section).
          4.  Test Case Application.
          5.  Structural Limitations.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 90 seconds realistic?
      *   *Fix:* Keep the decision tree binary where possible.
      *   *Critique:* Did I address the "Can't Tell" category?
      *   *Fix:* Ensure there's a specific trigger for "Can't Tell" (e.g., conflicting high-confidence signals).
      *   *Critique:* The user asked to mark steps that are judgment calls in procedure costume.
      *   *Fix:* Add a specific "Auditor Note" column in the procedure description.
      *   *Critique:* Which case wrecks the data?
      *   *Fix:* The Horror Film. It conflates *arousal* with *pleasure* in the momentary stream, and *enjoyment of fiction* with *actual welfare* in the retrospective. If this measure is for health outcomes, coding fear as "pleasant" invalidates the QALY calculation.

  10. **Final Polish:** Ensure the distinction between "Feeling" and "Stance" is clear in the manual instructions without using jargon the RAs won't understand. Use terms like "Immediate Reaction" vs. "Overall Verdict."

  *(Self-Correction on the Horror Film)*: Wait, if the participant tapped constantly, did they tap "Good" or just tap? The prompt says "tap a button... if it feels good." If they tapped constantly during a horror film, they are signaling "This feels good" in the moment. This is the "Benign Masochism" problem. The Observer sees fear. The EoD says "Loved it."
  *Verdict:* This creates a "Pleasant" label. But is it *Wellbeing*? In CEA, we care about health. Fear raises cortisol. This is the wreck.

  *(Self-Correction on the Run)*: No taps (Not pleasant in moment). EoD "Best part" (Pleasant in memory). This is the "Peak-End Rule" bias. It wrecks the *temporal stability* of the measure.
  *Decision:* I will argue the **Run** is the subtle wreck (invalidates the momentary stream's utility), but the **Horror Film** is the catastrophic wreck (invalidates the definition of Pleasant). I'll focus on the Horror Film as the primary data wrecker because it creates a false positive for wellbeing where there is physiological stress.

  *Wait, re-reading the prompt:* "At least one of these is going to come out wrong in a way that wrecks a chunk of my data."
  The Run creates a discrepancy between Mo and EoD.
  The Horror creates a discrepancy between Obs and Self-Report.
  The Shower creates a discrepancy between Salience and Report.
  The Horror Film is the most dangerous for *Cost-Effectiveness*. If you fund interventions that produce "Horror" because people say they "Love it," you might be increasing stress biomarkers while claiming wellbeing gains.
  Actually, the **Run** is worse for the *measure's internal consistency*. If Momentary and EoD disagree fundamentally, which one is the "truth" for the CEA? CEA usually wants QALYs (quality of life years), which is closer to EoD. But if the Mo stream is ignored, why collect it?
  Let's go with the **Horror Film**. It breaks the link between "Pleasant" and "Beneficial."

  *Final Plan:*
  1.  **Philosophical Triage:** Explicitly state we are adopting a "Pragmatic Attitudinal" stance for CEA purposes.
  2.  **Procedure:** 4-step decision tree.
  3.  **Transparency:** Highlight the "Weighting Rule" as the philosophical imposition.
  4.  **Cases:** Run (Valid Attitudinal), Shower (Valid Null), Horror (Invalid/ Dangerous).
  5.  **Limitations:** List the "Cannot Dos."

