answer: |-
  ### Part 1: Philosophical Triage (For the PI & Audit Trail)

  Before the RAs touch the data, we need to acknowledge what we are doing. We cannot solve the philosophy of pleasure, but we must choose a lane to ensure the Cost-Effectiveness Analysis (CEA) doesn't collapse.

  **Distinctions We Are Dropping:**
  *   **Ontology:** We do not care if pleasure is a "sensation" or a "pro-attitude." We treat it as a *functional signal of value*.
  *   **Phenomenological Homogeneity:** We accept that a hot bath and a solved proof feel different. We are not coding *quality*, only *valence*.

  **Distinctions We Are Keeping:**
  *   **Immediate vs. Reflective:** We must distinguish between "felt in the second" (Momentary) and "valued in retrospect" (End-of-Day).
  *   **Internal vs. External:** We must acknowledge that facial expression (Observer) is a proxy, not the thing itself.

  **The Philosophical Imposition:**
  For CEA, "Wellbeing" generally maps to **Preference Satisfaction** (Attitudinal) rather than **Hedonic Tone** (Feeling). A QALY is about how much a state is *worth* to the person, not just how much it tingles. Therefore, the **End-of-Day (EoD)** rating is the primary truth. The other streams are validity checks.
  *   *Risk:* This privileges "Remembered Utility" over "Experienced Utility" (Kahneman). We are accepting this bias explicitly.

  ---

  ### Part 2: The Coding Procedure (v1.0)

  **Target:** Undergrad RAs.
  **Time Limit:** 90 seconds per episode.
  **Output:** `PLEASANT` | `NOT PLEASANT` | `CAN'T TELL`

  **Step 1: The Reflective Anchor (End-of-Day)**
  *   **Action:** Check the EoD rating for the episode.
  *   **Question:** "Did the participant explicitly rate this as positive/enjoyable in their daily review?"
  *   **Rule:**
      *   If **Yes (Positive)**: Tentative Label = `PLEASANT`. Go to Step 2.
      *   If **No (Negative/Neutral)**: Tentative Label = `NOT PLEASANT`. Go to Step 2.
      *   If **Missing**: Tentative Label = `CAN'T TELL`. Go to Step 3.
  *   *Audit Log:* `EoD_Valence` [Pos/Neg/Miss]

  **Step 2: The Intensity Check (Momentary)**
  *   **Action:** Check the App Button Tap frequency during the episode.
  *   **Question:** "Is there a severe contradiction between the reflective rating and the in-the-moment signal?"
  *   **Rule:**
      *   If EoD is `PLEASANT` but Taps = 0: **Flag as 'Retrospective Only'**. Keep `PLEASANT`. (Allowing for flow states/habituation).
      *   If EoD is `PLEASANT` and Taps = High: **Confirm**. Keep `PLEASANT`.
      *   If EoD is `NOT PLEASANT` but Taps = High: **Flag as 'Complex Arousal'**. Keep `NOT PLEASANT`. (Prioritize EoD).
  *   *Audit Log:* `Mo_Conflict` [Yes/No]
  *   *RA Note:* This step masks the judgment that *memory overrides sensation*.

  **Step 3: The Distress Veto (Observer)**
  *   **Action:** Watch silent video clip (max 30 secs).
  *   **Question:** "Is there unambiguous behavioral evidence of acute distress or pain that contradicts a `PLEASANT` label?"
  *   **Rule:**
      *   Look for: Grimacing, protective posturing, crying, freezing.
      *   If **Yes** AND Tentative Label is `PLEASANT`: Override to `CAN'T TELL`. (Do not code as Pleasant if the body is screaming).
      *   If **No**: Accept Tentative Label.
  *   *Audit Log:* `Obs_Distress` [Yes/No/Unsure]

  **Step 4: Final Adjudication**
  *   **Action:** Submit final label.
  *   **Rule:**
      *   If `Obs_Distress` = Yes AND `EoD` = Positive $\rightarrow$ `CAN'T TELL`.
      *   Else $\rightarrow$ Accept Tentative Label from Step 1.
  *   *Time Check:* If >90 seconds, mark `RUSHED` in metadata.

  ---

  ### Part 3: Masked Judgment Calls (Transparency Log)

  These are the steps where we are pretending a philosophical choice is a procedural rule. Your PI needs to sign off on these specifically.

  1.  **The Hierarchy of Truth (Step 1):** By making EoD the anchor, we are deciding that *what people say they valued* matters more than *what they felt while it happened*. This is an Attitudinal theory choice. If the Momentary stream contradicts, we treat the Momentary stream as "noisy," not the EoD as "biased."
  2.  **The Distress Veto (Step 3):** We are allowing the Observer to veto the Participant's Self-Report *only* on negative expressions. We are not allowing the Observer to veto a "Not Pleasant" rating (e.g., if they look happy but say it was awful). This assumes people lie about pain less than they lie about pleasure, or that visible distress invalidates welfare claims more than visible joy validates them.
  3.  **The "Flow" Exception (Step 2):** Allowing `PLEASANT` with 0 Taps assumes that lack of signaling isn't lack of pleasure (e.g., immersion). This is a theoretical assumption about attention, not a data fact.

  ---

  ### Part 4: Test Case Run-Through

  Here is how the procedure processes your three problem cases.

  #### Case 1: The Long Run
  *   **Data:** Momentary (0 taps), EoD ("Best part of day"), Observer (Strained/Neutral).
  *   **Execution:**
      *   Step 1: EoD Positive $\rightarrow$ Tentative `PLEASANT`.
      *   Step 2: Taps = 0. Flag 'Retrospective Only'. Rule says keep `PLEASANT`.
      *   Step 3: Observer sees strain, but not "acute distress/pain" (assuming running form is normal). No Veto.
      *   **Final Label:** `PLEASANT`.
  *   **Verdict:** **Acceptable.** This captures "Remembered Utility." In CEA, if they value the run enough to repeat it, it contributes to their quality of life, even if the momentary hedonic tone was neutral/painful.

  #### Case 2: The Horror Film
  *   **Data:** Momentary (Constant taps), EoD ("Loved it"), Observer (High Distress - screaming/tensing).
  *   **Execution:**
      *   Step 1: EoD Positive $\rightarrow$ Tentative `PLEASANT`.
      *   Step 2: Taps = High. Confirm.
      *   Step 3: Observer sees screaming/tensing. This meets "unambiguous behavioral evidence of acute distress."
      *   **Veto Triggered.** Override to `CAN'T TELL`.
  *   **Verdict:** **DATA WRECKER.**
      *   **Why:** This case exposes the fatal flaw in using a unified "Pleasant" label for CEA. The participant *claims* welfare gain (EoD), their arousal systems are firing (Momentary), but their stress physiology is likely spiking (Observer).
      *   **The Wreck:** If you code this as `CAN'T TELL`, you lose valid data on leisure activities (people *do* derive welfare from horror). If you code it as `PLEASANT` (ignoring the veto), you are counting cortisol spikes as health gains in your cost-effectiveness model.
      *   **Recommendation:** You cannot lump this into the same "Pleasant" bucket as the Run or the Shower. It requires a separate "High Arousal/Negative Valence" category, or your CEA will overestimate the health benefit of stress-inducing leisure. **This is the one that breaks the model.**

  #### Case 3: The Warm Shower
  *   **Data:** Momentary (None), EoD ("Nice, hadn't thought about it"), Observer (Relaxed).
  *   **Execution:**
      *   Step 1: EoD Positive (albeit mild) $\rightarrow$ Tentative `PLEASANT`.
      *   Step 2: Taps = 0. Flag 'Retrospective Only'. Keep `PLEASANT`.
      *   Step 3: Observer sees relaxation. No Veto.
      *   **Final Label:** `PLEASANT`.
  *   **Verdict:** **Acceptable.** This captures "Background Wellbeing." It highlights that the Momentary stream under-captures habituated comfort. The procedure handles this correctly by prioritizing EoD.

  ---

  ### Part 5: Structural Limitations (What this procedure cannot do)

  Put this in the Appendix of your manual. Do not promise these capabilities.

  1.  **It cannot distinguish "Relief" from "Joy."**
      *   The procedure codes both as `PLEASANT`. In CEA, relieving pain (negative to zero) is often valued differently than adding joy (zero to positive). This measure collapses that distinction.
  2.  **It cannot detect "Adaptive Preferences."**
      *   If a participant is depressed and rates a miserable episode as "Fine" because they expect nothing better, the EoD anchor will code this as `PLEASANT` (or at least Not Negative). The Observer might catch this, but the procedure prioritizes the Self-Report. You are measuring *satisfaction*, not *objective welfare*.
  3.  **It cannot resolve the "Masochism" Problem.**
      *   As seen in the Horror Case, when biological stress correlates with reported enjoyment, the procedure forces a `CAN'T TELL`. You will lose data on high-arousal leisure (sports, horror, spicy food) because the coding manual treats physiological distress as a validity error rather than a feature of the enjoyment.
  4.  **It assumes Time-Neutrality.**
      *   A 5-minute pleasant episode and a 2-hour pleasant episode get the same label. For CEA, you need to weight by duration (QALYs). This coding manual produces a binary flag, not a utility weight. You will need a secondary step to multiply this label by episode duration, which introduces error if the "Pleasant" intensity varied within the episode.

  **Final Advice:**
  For the Horror Film case, do not force it into the binary. Create a flag variable `High_Arousal_Conflict`. If that flag is set, exclude the episode from the primary "Wellbeing Gain" calculation in your CEA, or run a sensitivity analysis where those episodes are weighted at 0.5. If you count them as 1.0, your PI will get pushed back by health economists who know that stress isn't a QALY gain.
