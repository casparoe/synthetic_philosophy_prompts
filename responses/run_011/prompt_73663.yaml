  **Questions to Cut if Time Runs Short**

  I would cut **Question 1** and **Question 7**.

  **Question 1** is the least load-bearing because **Question 2** covers the same theoretical ground (why not a modest version?) but anchors it in empirical evidence (Ireland/BC), which makes the guest's comparative deflection harder to sustain. **Question 7** is redundant because **Question 8** addresses the deeper structural issue of accountability; if the secretariat controls the agenda and rules, individual member corruption is a secondary symptom of that primary power imbalance. Cutting these two preserves the arc from institutional design to power dynamics to epistemic falsification while removing the most easily deflected comparisons.
