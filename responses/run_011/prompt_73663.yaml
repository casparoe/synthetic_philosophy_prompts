answer: |-
  1. **Why reject a sorted second chamber or discrete policy panels in favor of abolishing elections entirely?**
     *Follow-up:* If electoral logic is so contagious that it ruins hybrids, why do you expect sortitive logic to survive contact with the executive branch?

  2. **Why extend the model of temporary advisory assemblies like Ireland's to a permanent decision-making body without external validation?**
     *Follow-up:* But without that final vote, doesn't the assembly lack the democratic legitimacy that saved the Irish process?

  3. **If service is compulsory like jury duty, won't exemptions for hardship skew the sample toward the wealthy and unburdened?**
     *Follow-up:* Are you claiming perfect representation is possible, or just that this bias is less corrupt than campaign finance?

  4. **If descriptive resemblance is intrinsically valuable, does stratifying the lottery by category harden the identity divisions you claim to escape?**
     *Follow-up:* Does that not concede that random selection alone fails to achieve the descriptive representation you prize?

  5. **How does a statistically typical assembly protect small minorities who might be statistically invisible in the draw?**
     *Follow-up:* If you reserve seats to fix this, haven't you abandoned the principle of pure random selection?

  6. **How does a chamber without parties or confidence votes select and constrain an executive government?**
     *Follow-up:* Without the threat of losing office, what prevents the executive from ignoring those random committees?

  7. **Without elections, what mechanism removes a member who sells votes or sleeps through sessions?**
     *Follow-up:* Who judges the judges, if not the electorate you claim is too swayed to judge representatives?

  8. **If an unelected secretariat sets the agenda, haven't you simply shifted the oligarchy from elected officials to unelected staff?**
     *Follow-up:* What ensures those rules aren't written by the very staff empowered to enforce them?

  9. **What specific outcome from a real-world sorted legislature would compel you to abandon this view or retreat to a second chamber?**
     *Follow-up:* If no empirical failure could change your mind, is this a political proposal or a philosophical axiom?

