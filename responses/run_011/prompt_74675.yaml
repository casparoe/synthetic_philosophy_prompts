answer: |-
  Your gut is not noise. Your flatmate is technically correct that your preferences violate the axioms of Expected Utility Theory (EUT), but he is wrong to conclude that makes you incoherent. EUT is a specific model of rationality, not the definition of rationality itself. Your intuitions align much better with **Ecological Rationality** and **Safety-First** principles, which prioritize survival and context over abstract mathematical consistency.

  However, to answer your request for precision: there is no single *equation* (like $E[U]$) that captures all nine cases without modification. Instead, you need a **Lexicographic Decision Rule**. This is a hierarchy of filters. You only proceed to the next step if the previous one doesn't decide the issue.

  Here is the principle that captures your verdicts, stated precisely enough to be operationalized.

  ### The Principle: Safety-First with Reference-Dependent Weighting

  **Step 1: The Catastrophe Constraint (The "Corpse" Clause)**
  *   **Rule:** Identify the worst possible outcome in any branch. If this outcome falls below a **Survival Threshold** ($T_{surv}$) AND the probability of this outcome exceeds a **Negligibility Threshold** ($\epsilon$), **REJECT** the gamble immediately.
  *   **Motivation:** Case 6 (Death/Amputation), Case 9 (Whole family on street).
  *   **Parameters:** $T_{surv}$ is not monetary; it is categorical (Life, Limb, Homelessness). $\epsilon$ is roughly 1%.
  *   **Application:** In Case 6, Death < $T_{surv}$ and 1% > $\epsilon$, so Reject. In Case 6 (modified), "More Surgery" > $T_{surv}$, so proceed to Step 2. In Case 9, "Everyone on street" < $T_{surv}$, so Reject.

  **Step 2: The Probability Truncation (The "Noise" Clause)**
  *   **Rule:** If any probability $p < \epsilon_{ignore}$, treat $p$ as 0.
  *   **Motivation:** Case 4 vs. Case 3.
  *   **Parameters:** $\epsilon_{ignore} \approx 0.1\%$.
  *   **Application:** In Case 3 (5% shot), 5% > $\epsilon_{ignore}$, so evaluate the value. In Case 4 (0.05% shot), 0.05% < $\epsilon_{ignore}$. The brain treats this as "Impossible." Therefore, Sure \$5 > Gamble \$0. This explains why you don't buy the lottery ticket every time, only occasionally (when $\epsilon_{ignore}$ is temporarily lowered by mood/context).

  **Step 3: Reference-Dependent Weighted Utility (The "Allais" Clause)**
  *   **Rule:** Calculate value based on *changes* in wealth (gains/losses), not final wealth states. Apply a weighting function $w(p)$ that overweights small probabilities (but only if Step 2 didn't truncate them) and overweights certainty. Apply Loss Aversion ($\lambda \approx 2$) to losses.
  *   **Motivation:** Case 1 & 2 (Allais), Case 3 (Small stakes risk seeking), Case 5 (Loss aversion).
  *   **Application:**
      *   **Case 1:** The 100% certainty of \$3,000 gets a massive weighting boost compared to 79% + 20%. The "Certainty Effect" dominates the EV calculation.
      *   **Case 5:** You evaluate the -\$100 loss as roughly twice as painful as the +\$200 gain is pleasant. Even with high wealth, the *change* is evaluated relative to your current reference point. This bypasses Rabin's calibration theorem, which assumes utility is defined over *final* wealth states.

  **Step 4: The Fiduciary Adjustment (The "Role" Clause)**
  *   **Rule:** If the decision maker is not the sole beneficiary/bearer of risk, lower the Survival Threshold ($T_{surv}$) and lower the Negligibility Threshold ($\epsilon$).
  *   **Motivation:** Case 7.
  *   **Application:** For your sister, it's her risk tolerance. For the pension fund, you are a fiduciary. The "Survival Threshold" for a pensioner includes their basic retirement security. Gambling with that violates the role constraint. This makes "Who is choosing" a valid variable in the function.

  **Step 5: Aggregate Variance Check (The "Correlation" Clause)**
  *   **Rule:** If the decision is repeated or pooled, evaluate the variance of the *aggregate* outcome, not the single play.
  *   **Motivation:** Case 8 vs. Case 9.
  *   **Application:**
      *   **Case 8 (Independent):** Variance of the sum grows slower than the Expected Value (Law of Large Numbers). The probability of the *average* outcome deviating significantly from the EV approaches zero. The "Ruin" risk vanishes. Verdict: Take Gamble.
      *   **Case 9 (Correlated):** Variance of the sum grows linearly with $N$. The distribution does not narrow. The "Collective Ruin" probability remains 1%. Step 1 triggers. Verdict: Take Sure Thing.

  ---

  ### The Casualties: What You Have to Give Up

  Your flatmate is pushing you to accept EUT. If you accept the principle above, you are rejecting EUT. Here are the specific casualties:

  **1. Case 4 (The Lottery Ticket)**
  *   **The Conflict:** Standard Prospect Theory predicts you *should* take the 0.05% shot at \$20,000 because humans typically overweight tiny probabilities (which is why lotteries exist). You reject it.
  *   **The Verdict:** Your intuition is actually *more* robust than standard PT here. You are applying **Probability Truncation** (Step 2).
  *   **Casualty:** You must admit that you are inconsistent about *when* you truncate. You buy a lottery ticket "twice a year." This means $\epsilon_{ignore}$ is not a fixed constant; it is mood-dependent. To be fully coherent, you must either **stop buying lottery tickets entirely** or admit that your "entertainment value" is part of the utility, not the financial return. If you treat the ticket as a financial investment, Case 4 says "No." If you treat it as buying a daydream, it's a consumption good, not a gamble.

  **2. Case 5 (Rabin's Calibration)**
  *   **The Conflict:** Matthew Rabin proved mathematically that if you reject a 50/50 bet of +\$200/-\$100 at *any* wealth level, you should logically reject a 50/50 bet of +\$1M/-\$1,000.
  *   **The Verdict:** Your flatmate is quoting EUT math. You are using **Reference Dependence** (Step 3).
  *   **Casualty:** You must give up the idea that utility is a function of *total wealth*. You must explicitly state: "I maximize utility of *changes* in wealth." This saves you from Rabin's proof, but it forces you to admit that your risk aversion is local, not global. You are not "risk averse"; you are "loss averse."

  **3. Case 7 (Agent-Relativity)**
  *   **The Conflict:** Standard decision theory says the value of the lottery is independent of the agent.
  *   **The Verdict:** You are correct that "Who is choosing" matters, but this moves the question from **Decision Theory** to **Ethics**.
  *   **Casualty:** You cannot claim this is purely a preference about *risk*. It is a preference about *duty*. To make this coherent, you must define the "Utility Function" as including "Adherence to Fiduciary Norms." If the pension manager gambles, he incurs a massive "Guilt/Professional Ruin" penalty in the utility function that you do not incur when your sister gambles.

  ---

  ### The Warranty and The Lottery (The Live One)

  Does this principle predict you buy the warranty and the ticket? **Yes.**

  1.  **Warranty:** This is **Loss Aversion** (Step 3) + **Hassle as Catastrophe**.
      *   The financial EV is negative. However, the "Loss" of a broken laptop isn't just \$1,400; it's the disruption, the data risk, the time without a computer. This pushes the "Loss" value higher.
      *   Furthermore, the warranty buys **Certainty** (Step 3). You are paying a premium to move from a probability distribution to a sure thing (no cost if broken). The "Certainty Effect" makes the warranty disproportionately attractive compared to its EV.

  2.  **Lottery:** This is **Probability Truncation Failure** (Step 2) + **Consumption**.
      *   As noted in Case 4, financially you should reject this. You buy it twice a year because, occasionally, your $\epsilon_{ignore}$ threshold slips, or you are purchasing the *utility of anticipation*.
      *   **Coherence Fix:** If you categorize the \$2 as "Entertainment Expense" (like a coffee) rather than "Investment," the paradox disappears. You aren't gambling; you're buying a daydream.

  ---

  ### Summary for Your Flatmate

  Hand him this:

  > "I am not an Expected Utility maximizer. I am a **Safety-First Maximizer with Reference-Dependent Preferences**.
  >
  > 1.  **I minimize the probability of ruin** before I maximize expected value (Cases 6, 9).
  > 2.  **I treat negligible probabilities as zero** unless the upside is existential (Case 4).
  > 3.  **I evaluate gains and losses relative to my current state**, not my final net worth, with losses weighted roughly 2x heavier than gains (Case 5).
  > 4.  **I account for correlation in aggregate risks**, recognizing that independent risks pool while correlated risks compound (Case 8 vs 9).
  > 5.  **I include fiduciary duty as a cost function**, where violating prudence with others' money incurs a utility penalty greater than the financial loss (Case 7).
  >
  > If your model requires me to ignore the difference between independent and correlated risk (8 vs 9), or requires me to treat a 1% chance of death as mathematically equivalent to a 1% chance of a limp (Case 6), then your model is too blunt for the decisions I actually have to make."

  **Final Verdict on Case 4:**
  Does Case 4 have to go? **No.** It is the strongest evidence for your **Probability Truncation** rule. Standard theory says you should play. You don't. That suggests your brain correctly identifies 0.05% as "noise." Keep this verdict; it's a feature, not a bug.

  **Final Verdict on Case 7:**
  Can "who is choosing" be part of the principle? **Yes,** but only if you define the "Cost" of the decision to include reputational and moral risk. If the pension manager loses the money, he loses his career. That is a real cost to *him*, making the gamble EV-negative for him, even if it's EV-positive for the fund. It's not confusing two questions; it's expanding the cost function.

  **Final Verdict on 8 vs 9:**
  Your flatmate is wrong here. In EUT, 8 and 9 are identical. In **Portfolio Theory**, they are vastly different. Case 9 introduces **Systemic Risk**. A principle that ignores systemic risk is inadequate for real-world decision making. You are right to distinguish them.
