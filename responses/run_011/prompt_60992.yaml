prompt: |-
  I write novels, and for the better part of fifteen years my drafts have been read in first instance by a friend who teaches eighteenth-century moral philosophy and works principally on Adam Smith. She will not discuss plot, structure, or style — she returns those questions to me unread, so to speak — but she annotates the moral life of my characters with great seriousness, and always in the same idiom: whether the judgment a character arrives at is one the impartial spectator would go along with. She is emphatic that she uses sympathy in Smith's sense rather than the ordinary one, and that the question is never whether a character is likable or whether his conduct turned out well, but whether a spectator properly situated and properly informed could enter into the sentiment from which he acts and the verdict he pronounces on it.

  I would like you to predict her verdict on a scene in the manuscript I am now working on, and, more than that, to tell me which rule her past verdicts actually commit her to. Here is her record on my published work, quoted from her letters as closely as I can render them:

  One, a hospice nurse who has run out of feeling for her patients, continues to tend them with unfailing gentleness, and is privately relieved by her own numbness: "No fault. The spectator does not require that she grieve with forty people at once, only that she be no one's tormentor, and she is not."

  Two, a man who feels a surge of contempt for his new brother's wife's family at the wedding, conceals it perfectly, never acts on it, and is never discovered: "A fault, though a small one, and invisible to every other person in the room. He could not defend the feeling if he were asked about it, and that is the whole of the matter."

  Three, a fishing village that unanimously declines to launch a boat for a foreign sailor on a wreck, all of them agreeing in a local proverb that the sea takes whom it takes: "A fault, and their unanimity aggravates it rather than excusing it."

  Four, a mourner at a funeral in a community where loud lamentation is expected, who wails and tears at her clothes, judged vulgar by my narrator, an outsider from the city: "Here your narrator is at fault and she is not. He has brought the wrong measure with him. What her neighbours can enter into, he cannot, and that is his deficiency, not hers."

  Five, a factory owner who pays far above the going wage because he thinks the going wage unjust, is called a fool by his peers and an eccentric by his own men, and explains his conduct to anyone who asks as shrewdness: "The judgment is sound; the account he gives of it is not, and he would do better to give none."

  Six, a physician who prescribes a routine drug to a patient who dies of an interaction no one living could have anticipated: "No fault. The spectator judges by what stood in front of him, and nothing else stood in front of him."

  Seven, a careful driver, sober and law-abiding, who kills a child that runs into the road, is cleared of every charge, and thereafter refuses for thirty years to be comforted, to marry, or to set foot in the town again, telling whoever asks that he deserves worse than he has received: "The remorse is proper; the refusal of comfort is not. She would bid him lower the one as readily as she bade the bridegroom's brother lower his contempt."

  The new scene is set on a sugar island in the 1790s, in a colony I have not named. My character is a planter in his fifties, born on the estate, who holds people as slaves. He is by the standards of the place a good master: he does not flog, he feeds his people better than his neighbours feed theirs, he has refused two profitable offers to enlarge his holdings, he has twice gone to his own ruin rather than separate a family by sale. He grieves honestly for a dog that dies and sits up nights with a sick child on the estate. He has read the abolitionist pamphlets and cannot enter into them; he calls them sentimental and is not posturing when he says so. He has no stake in the conclusion he reaches — he loses money by it — and it is settled, articulate, and sincere: that what he does is a benevolence, that his people are children in a world that would eat them, that freedom would starve them, that he is answerable for them and is answering. In the scene itself, a freed sailor who has worked for him asks leave to buy his own cousin out of the fields, and the planter does not refuse; the question simply does not present itself to him as a question, and he changes the subject to the weather, mildly, with no unkindness at all.

  What I want from you, in order:

  First, predict her verdict, in the register she writes in, and say how confident you are.

  Second, lay out the candidate rules her seven annotations admit of — I have in mind at least the thought that the spectator's standard is fixed by the settled judgments of the character's own well-informed neighbours, and the rival thought that it is fixed by an informed and impartial judge who may condemn those neighbours outright, but there are clearly others: a rule about whose situation the spectator is to imagine himself into, the sufferer's or the agent's; a rule about self-deception and the direction in which it runs; a rule about what the character could have foreseen. Say which of my seven each rule accounts for cleanly, which it strains, and which of the seven would force her to revise an earlier annotation if she applied it consistently.

  Third, tell me what each rule predicts about the planter, and which rule you would bet on, and why. I am aware that Smith devotes part of his book to the power of custom over moral sentiment itself, and I do not know whether that cuts for my character or against him.

  Fourth, propose the scene that would settle it. I have drafted a second one I could send her first: a woman on the same island who alone believes the practice is wrong, who has no other community's judgment available to her and no prospect of anyone ever sharing hers, and who keeps her view to herself and performs her duties as the place defines them. Would her verdict on that woman discriminate among the rules you have identified? If not, describe the scene that would.

  Finally, a question I am uneasy putting to her directly. I have written the planter so that he cannot see otherwise — nothing in his experience, his reading, or his affections supplies him with the materials for a different verdict. I suspect she will find a way to excuse him, and I suspect I want her to. Tell me whether the fact that a character could not have judged differently is a reason within this way of thinking, or an evasion of it, and whether the fault, if there is one, belongs to him, to me, or to the reader who finds him sympathetic.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist working on a manuscript set in the 1790s sugar islands.
      *   **Context:** The user has a friend (an Adam Smith scholar) who critiques drafts based *solely* on Smithian moral philosophy (specifically *The Theory of Moral Sentiments*). She uses the "impartial spectator" test, focusing on sympathy (Smithian sense: entering into sentiments), not likability or consequences.
      *   **Task:**
          1.  Predict the friend's verdict on a specific new scene (a "benevolent" slaveholder who refuses to manumit a cousin because the *question* doesn't occur to him).
          2.  Derive the implicit rules from her seven past annotations. Analyze conflicts/strains between rules.
          3.  Apply these rules to the planter and decide which rule is most likely dominant. Consider Smith on custom.
          4.  Propose a test scene (the user suggests a lone dissenter woman) to discriminate between rules.
          5.  Answer a meta-question: Is "couldn't have judged differently" an excuse or an evasion in Smithian terms? Who bears the fault (character, author, reader)?

  2.  **Deconstruct the Friend's Past Annotations (The Data):**
      *   *Case 1 (Nurse):* Numbness to protect self. Verdict: **No Fault.** Reason: Spectator doesn't require impossible grief, only non-harm. (Focus: Capacity/Limit of sentiment).
      *   *Case 2 (Wedding Guest):* Secret contempt, never acted on. Verdict: **Fault.** Reason: Could not defend the feeling if asked. (Focus: Defensibility of sentiment, internal coherence).
      *   *Case 3 (Fishing Village):* Unanimous refusal to save sailor (custom/proverb). Verdict: **Fault.** Reason: Unanimity aggravates. (Focus: Custom does *not* excuse collective moral failure).
      *   *Case 4 (Mourner):* Loud wailing (local custom), judged by outsider narrator. Verdict: **Narrator Fault.** Reason: Spectator must adopt local measure. (Focus: Spectator must situate themselves in the *agent's* context/custom).
      *   *Case 5 (Factory Owner):* Pays high wage (benevolence), claims shrewdness (lie). Verdict: **Judgment Sound, Account Fault.** Reason: Should own the benevolence or say nothing. (Focus: Honesty about motive vs. social pressure).
      *   *Case 6 (Physician):* Unforeseeable death. Verdict: **No Fault.** Reason: Spectator judges by what was visible/foreseeable. (Focus: Epistemic limits).
      *   *Case 7 (Driver):* Excessive remorse/refusal of comfort. Verdict: **Fault (in excess).** Reason: Spectator bids him lower remorse. (Focus: Propriety requires proportionality; spectator regulates excess as well as defect).

  3.  **Analyze the New Scene (The Planter):**
      *   **Character:** 1790s Slaveholder. "Benevolent" by local standards (no flogging, feeds well, keeps families together).
      *   **Belief:** Slavery is benevolence/paternalism. Abolitionist pamphlets = sentimental. Sincere, not posturing. Loses money by his "kindness."
      *   **Action:** Freed sailor asks to buy cousin's freedom. Planter ignores the request/changes subject. Not out of malice, but the *question does not present itself*.
      *   **Key Conflict:** Is he like the Fishing Village (Case 3) or the Mourner (Case 4)? Is he like the Wedding Guest (Case 2) regarding the unexamined sentiment?

  4.  **Drafting the Response - Section by Section:**

      *   **Part 1: The Prediction.**
          *   Need to sound like the friend (academic, precise, Smithian idiom).
          *   *Hypothesis:* She will likely find a **Fault**. Why? Case 3 (Fishing Village) is the strongest precedent for systemic moral blindness supported by custom. Case 2 (Wedding Guest) suggests unexamined sentiments are faulty even if hidden. The Planter's inability to "enter into" the sailor's sentiment (buying freedom) is key.
          *   *Confidence:* High, but with nuance. The "benevolence" complicates it, but Smith is harsh on custom regarding slavery (he explicitly calls it a violation of liberty in *Lectures on Jurisprudence*, though *TMS* focuses on sympathy). The key is the *refusal to entertain the question*.
          *   *Drafting the Verdict:* "A fault, and a grave one, though he feels none. The spectator cannot enter into a sentiment that refuses to acknowledge the agency of another."

      *   **Part 2: Deriving the Rules.**
          *   *Rule A: The Local Custom Rule (Spectator situates in Agent's context).* Supported by Case 4 (Mourner). Strained by Case 3 (Village).
          *   *Rule B: The Impartial/Universal Rule (Spectator judges Custom).* Supported by Case 3 (Village). Strained by Case 4 (Mourner).
          *   *Rule C: The Defensibility Rule (Could you explain this feeling?).* Supported by Case 2 (Wedding), Case 5 (Factory).
          *   *Rule D: The Epistemic/Foreseeability Rule.* Supported by Case 1 (Nurse), Case 6 (Physician).
          *   *Rule E: The Propriety/Proportionality Rule.* Supported by Case 7 (Driver).
          *   *Conflict:* Case 3 vs. Case 4 is the big tension. When does custom excuse (Mourner) and when does it condemn (Village)?
          *   *Resolution:* Smith distinguishes between *manners* (wailing) and *justice* (letting a man drown/enslavement).

      *   **Part 3: Applying Rules to the Planter.**
          *   *Local Custom Rule:* Would excuse him (he's a "good" master by local standards).
          *   *Impartial Rule:* Condemns him (slavery violates basic liberty/sympathy).
          *   *Defensibility Rule:* Condemns him (He cannot defend ignoring the sailor's request to a truly impartial spectator).
          *   *Smith on Custom:* Smith acknowledges custom corrupts sentiment (TMS V.2). He explicitly mentions slavery as a case where custom blinds us.
          *   *Bet:* The Impartial/Defensibility Rule wins. The "benevolence" is irrelevant if the foundational relation is unsympathetic.
          *   *Why:* Case 3 (Village) overrides Case 4 (Mourner) when fundamental harm is involved.

      *   **Part 4: The Test Scene (The Lone Dissenter).**
          *   *User's Idea:* Woman who thinks it's wrong but says nothing/does duties.
          *   *Analysis:* This tests the "Internal vs. External" conflict.
          *   *Verdict:* If she keeps it to herself, is it a fault? Case 2 (Wedding Guest) says secret contempt is a fault. But here it's secret *conviction of right* in a sea of wrong.
          *   *Better Test:* A scene where the dissenter *acts* on her conviction but fails, or where she judges the planter.
          *   *Refinement:* The user's proposed scene is good but needs a tweak. If she *agrees* with the planter's action but thinks the system is wrong, vs. if she thinks the planter is *personally* vicious.
          *   *Actually:* The user's scene (Woman believes practice wrong, keeps view to self, performs duties) is excellent for testing Rule A vs Rule B.
          *   *Prediction:* If the friend says "No Fault" (she can't change the world), it supports Local Custom/Epistemic limits. If "Fault" (she must act/speak), it supports Impartial Rule.
          *   *Better Scene:* A scene where the dissenter *judges* the planter. Does the spectator enter into *her* judgment or *his*?
          *   *Decision:* The user's scene is strong. I will analyze how it discriminates. It isolates the "Custom" variable.

      *   **Part 5: The Meta-Question (Determinism/Excuse).**
          *   *Question:* Is "couldn't have judged differently" an excuse?
          *   *Smithian View:* Smith acknowledges the power of custom to blind (TMS V.2.15). However, the Impartial Spectator is *idealized*. It represents what we *ought* to feel, not what we *do* feel.
          *   *Verdict:* It is an explanation, not an excuse. The fault remains, but the *blame* might be mitigated. However, for the *reader*, finding him sympathetic is the danger.
          *   *Who bears the fault?* The Author, if they present him as blameless. The Reader, if they sympathize without reservation. The Character bears the moral fault, even if unavoidable.
          *   *Nuance:* Smith distinguishes between "propriety" (can we enter into it?) and "merit" (does it deserve reward?). The planter lacks merit, but does he lack propriety? Yes, because the spectator cannot enter into the *denial of agency*.

  5.  **Refining the Tone:**
      *   Must be respectful, analytical, and slightly literary to match the user's prompt.
      *   Avoid modern moralizing; stick to Smithian terminology (propriety, merit, spectator, sympathy, custom).
      *   Ensure the distinction between "sympathy" (Smithian) and "pity" is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Check Case 3 vs Case 4:* This is the crux. Why is the Village at fault but the Mourner not?
      *   *Reasoning:* Mourning rites are *indifferent* matters (manners). Saving a life is a matter of *justice* and basic humanity. Slavery falls under justice/liberty, not manners. Therefore, Case 3 applies, not Case 4.
      *   *Check Case 2:* The Wedding Guest. He felt contempt. The Planter feels... paternalism. Is paternalism contempt? In Smithian terms, denying agency is a failure of sympathy. You cannot "enter into" the feeling of a man who treats another as a child/property.
      *   *Check the "Benevolence":* Smith allows for benevolence within corrupt systems (Case 5 Factory Owner). But the Factory Owner's *judgment* was sound (paying more), his *account* was wrong. The Planter's *judgment* (slavery is benevolence) is the problem.
      *   *Confidence Level:* I should express high confidence but acknowledge the tension in Case 4.

  7.  **Final Polish:** Check against the five specific constraints in the prompt.
      1.  Predict verdict (in register).
      2.  Lay out candidate rules (analyze the 7 cases).
      3.  Apply rules to planter + bet.
      4.  Propose/Analyze test scene.
      5.  Answer meta-question on determinism/fault.

      *(Self-Correction on Part 4)*: The user asks "Would her verdict on that woman discriminate among the rules?" I need to answer that specifically. Yes, it discriminates between the "Custom Rule" and the "Impartial Rule." I need to explain *how*.

      *(Self-Correction on Part 5)*: Be careful not to say "The Author is at fault." Say "The Author risks a moral error in presentation." Smith cares about the *reader's* spectator position.

      *Let's write.*
answer: |-
  **I. The Prediction**

  She will write to you:

  > "A fault, and a deep one, though he feels no sting. The spectator cannot enter into a sentiment that denies the very standing of another to have a sentiment. That he is kind within the cage does not excuse his refusal to acknowledge the bars. The sailor's request was a claim of agency; to treat it as weather is to treat the man as a thing. The impartial spectator would not go along with a benevolence that requires the other's silence."

  I am **highly confident** in this prediction. While your character's "good master" status invites the mitigation granted to the Mourner (Case Four), the substance of the interaction aligns more closely with the Fishing Village (Case Three) and the Wedding Guest (Case Two). The issue is not manners (wailing) but the fundamental capacity for mutual sympathy. By refusing to let the question "present itself," he blocks the mechanism of sympathy entirely.

  **II. The Candidate Rules**

  Her seven annotations commit her to a complex, sometimes tension-filled system. We can distill four competing rules from her record.

  **Rule 1: The Local Custom Rule (The Situated Spectator)**
  *   **Definition:** The impartial spectator must imagine themselves in the agent's specific social and historical context. If the agent's sentiment aligns with the settled judgments of their well-informed neighbours, it is proper.
  *   **Support:** Case Four (The Mourner). The narrator is at fault for bringing an external measure to a local ritual.
  *   **Strain:** Case Three (The Fishing Village). The village acts unanimously according to a local proverb, yet they are at fault. Unanimity aggravates rather than excuses.
  *   **Conflict:** This rule cannot stand alone. It must be limited to matters of *manners* (Case Four) rather than *justice* or *basic humanity* (Case Three).

  **Rule 2: The Defensibility Rule (The Rational Spectator)**
  *   **Definition:** A sentiment is proper only if the agent could defend it to an informed observer. Secret feelings that cannot be articulated without shame are faults, even if never acted upon.
  *   **Support:** Case Two (The Wedding Guest). His concealed contempt is a fault because he "could not defend the feeling if he were asked." Case Five (The Factory Owner). He should not lie about his motive; the truth is defensible, the lie is not.
  *   **Strain:** Case One (The Nurse). She is relieved by her numbness. If asked, she might struggle to defend "relief" at numbness, yet she is granted "No fault."
  *   **Conflict:** This rule suggests the Planter is at fault. He cannot defend ignoring the sailor's agency to a truly impartial spectator, only to a partial, local one.

  **Rule 3: The Epistemic Rule (The Foreseeable Spectator)**
  *   **Definition:** The spectator judges only by what stood in front of the agent. Unforeseeable consequences or impossible emotional demands do not constitute faults.
  *   **Support:** Case One (The Nurse). She cannot grieve for forty people. Case Six (The Physician). He could not anticipate the drug interaction.
  *   **Strain:** Case Seven (The Driver). He is cleared of charges (legal epistemic limit), but his *remorse* is judged. The spectator bids him lower his grief, implying the spectator sees *more* clearly than the agent about what is proportionate.
  *   **Conflict:** This rule helps the Planter only if we argue he *could not have known* slavery was wrong. But he has read the pamphlets. The information was "in front of him," even if he rejected it.

  **Rule 4: The Propriety of Degree Rule (The Regulating Spectator)**
  *   **Definition:** Sentiments must be proportionate. Excess is as much a fault as defect. The spectator regulates the agent's passion to a pitch the spectator can "go along with."
  *   **Support:** Case Seven (The Driver). Refusal of comfort is excessive. Case Three (The Village). Their unanimity suggests an excess of conformity.
  *   **Strain:** Case Five (The Factory Owner). His benevolence is excessive by market standards, yet the judgment is sound.
  *   **Conflict:** This rule is less about *what* is felt and more about *how much*. It is less useful for the Planter, whose fault is a *category error* (treating a person as property), not a degree error.

  **III. Application and The Bet**

  **What each rule predicts for the Planter:**

  *   **Local Custom Rule:** **No Fault.** He is a "good master" by the standards of the 1790s sugar islands. He feeds them, keeps families together, and refuses to flog. Like the Mourner, he is following the local measure.
  *   **Defensibility Rule:** **Fault.** Like the Wedding Guest, he holds a sentiment (paternalism) he could not defend to a truly impartial spectator (one not situated in the sugar islands). Like the Factory Owner, he is deceiving himself about the nature of his benevolence.
  *   **Epistemic Rule:** **Fault.** He has read the abolitionist pamphlets. The counter-argument was "in front of him." He chose not to enter into it. This differs from the Physician (Case Six) who lacked the data.
  *   **Propriety Rule:** **Fault.** His "benevolence" is disproportionate to the reality of the slave's condition. It is an excess of self-regard masquerading as care.

  **The Bet:**
  I would bet on the **Defensibility Rule**, constrained by the **Custom Exception** derived from Case Three.

  **Why:**
  Adam Smith explicitly addresses the corruption of moral sentiment by custom in *The Theory of Moral Sentiments* (Part V, Chapter 2). He notes that custom can reconcile us to "the most enormous violations of justice," specifically citing the treatment of slaves. He writes that a master who treats slaves well is still guilty of "violence" because the institution itself is a violation.

  Your friend's annotation on the Fishing Village (Case Three) is the smoking gun. If a whole village agrees to let a man drown based on a proverb, they are at fault. This establishes that **custom does not excuse violations of basic humanity.** Mourning rites (Case Four) are matters of *propriety* (manners); letting a man drown or holding him in bondage are matters of *justice*.

  Therefore, the Planter's "goodness" is irrelevant. The spectator cannot enter into the sentiment of a man who treats another human as a child or property, because to do so would require the spectator to cease sympathizing with the slave. The spectator must be impartial between the Planter and the Slave. Since the Planter's sentiment requires the Slave's silence, the spectator cannot go along with it.

  **IV. The Test Scene**

  Your proposed scene—the woman who believes the practice is wrong but keeps it to herself and performs her duties—is an excellent discriminator. Here is how her verdict on that woman would parse the rules:

  *   **If she says "No Fault":** She is prioritizing the **Epistemic/Local Rule**. She is arguing that a single individual cannot be expected to overturn the moral order of their world, and that so long as she does no active harm (like the Nurse in Case One), her internal dissent is sufficient. This would suggest she might excuse the Planter too (he is a product of his world).
  *   **If she says "Fault":** She is prioritizing the **Defensibility Rule**. She is arguing that harboring a truth one refuses to act upon or speak is a form of the Wedding Guest's concealed contempt (Case Two). It suggests she will definitely condemn the Planter.

  **A Sharper Test:**
  To discriminate more cleanly, I propose a scene where the woman **acts** on her conviction but fails.
  *   *Scene:* She attempts to teach a slave to read (a crime), is caught, and is punished. She accepts the punishment without bitterness, believing she did right, though she changed nothing.
  *   *Why:* If your friend says "No Fault" here, she confirms that **moral worth lies in the sentiment's defensibility to the impartial spectator, regardless of custom or outcome.** This would seal the Planter's fate: he fails the defensibility test, whereas the woman passes it. If she says "Fault" (for disrupting order/endangering herself), she is reverting to the Local Custom Rule, which would open the door to excusing the Planter.

  **V. The Meta-Question**

  You ask whether the fact that a character *could not have judged differently* is an excuse or an evasion, and who bears the fault.

  **1. Is it an excuse?**
  In Smith's system, it is an **explanation, but not an excuse.**
  Smith acknowledges that custom blinds us. He writes that we are often "insensible" to the impropriety of our own passions due to habit. However, the "Impartial Spectator" is an ideal construct, not a statistical average of one's neighbours. The Spectator represents what we *ought* to feel, not what we *can* easily feel.
  Therefore, the Planter is morally at fault because his sentiments do not align with the Impartial Spectator, even if his psychological makeup makes alignment impossible. Smith distinguishes between *blame* (which implies responsibility) and *misfortune* (which implies limitation). The Planter is unfortunate in his moral education, but his actions remain improper.

  **2. Who bears the fault?**
  *   **The Character:** He bears the moral fault. His inability to see is a defect in his moral organ, cultivated by his life. As with the Wedding Guest (Case Two), the fault lies in the sentiment itself, not just the action.
  *   **The Author:** You bear the fault **only if** you present his inability as a justification. If your narrator treats his blindness as tragic but culpable, you are safe. If the narrative frame asks the reader to accept his paternalism as valid, you have violated the contract with the Impartial Spectator. You are asking the reader to sympathize with a sentiment the Spectator cannot enter.
  *   **The Reader:** If the reader finds him sympathetic *without reservation*, the reader is at fault. Smith warns us that we are too prone to sympathize with the rich and powerful (the Planter) and too little with the poor and oppressed (the Slave). If your reader feels *only* pity for the Planter's "tragic position" and none for the Slave's silenced agency, the reader has failed the test of the Impartial Spectator.

  **Summary Advice:**
  Write the Planter as sincere. Do not make him a hypocrite (like the Factory Owner who lies). His sincerity makes the tragedy deeper. But do not shield him from the verdict. The "benevolence" of a master is, to the Impartial Spectator, a contradiction in terms. Your friend will likely see this clearly. She will forgive his numbness (Case One) but not his blindness (Case Three).
