answer: |-
  Here is the direct answer you are asking for, followed by the audit of theories, the historical context, and the boundary problem.

  **The Thesis:** There is no single, coherent theory of the *demos* underlying the American system. The pattern you describe is not the output of one philosophical principle applied consistently. It is the output of **Jurisdictional Sovereignty (Federalism)** acting as a container for two conflicting theories: **Civic Nationalism** at the federal level and **Stakeholder Residency** at the municipal level.

  If you force me to bet on a reconstruction, I bet on **Path Dependence mediated by Federalism.** The "theory" is a post-hoc rationalization of a legal structure that evolved to prioritize national sovereignty (federal) while allowing local pragmatism (municipal). The honest answer is that the system is philosophically inconsistent, but legally stable because the inconsistencies are compartmentalized by jurisdiction.

  Here is the ranking and audit of the candidate theories you provided, judged by whether they *generate* the current two-tier arrangement or merely sit comfortably alongside it.

  ### 1. Jurisdictional Sovereignty (The Actual Operating Principle)
  **Rank:** 1 (The Winner)
  **Verdict:** This is the only theory that actually generates the arrangement.
  **Analysis:** This principle holds that the definition of the *demos* is determined by the sovereign power holding the election.
  *   **Federal Tier:** The sovereign is the Nation-State. Membership is defined by the national bond (citizenship). Hence: Non-citizens out, expat citizens in.
  *   **Local Tier:** The sovereign is the Municipality (delegated by the State). Membership is defined by community presence (residency/taxes). Hence: Non-citizen residents in.
  *   **Why it wins:** It doesn't try to solve the philosophical contradiction; it legally walls it off. It explains why your roommate's trainer can vote for President (National Sovereign) but your green-card neighbor cannot, while that same neighbor can vote for Mayor (Local Sovereign).
  *   **What it excludes:** It explicitly rejects the idea that there is a universal "right" to vote based on moral standing alone. Your right to vote is a function of which government is asking you.

  ### 2. Civic Nationalism (National Belonging)
  **Rank:** 2
  **Verdict:** Generates the Federal tier; contradicts the Local tier.
  **Analysis:** This theory posits that the *demos* is the community of citizens bound by a shared legal status and national identity.
  *   **Fit:** It perfectly explains the federal ban on non-citizens and the inclusion of expats. The "People" is a legal construct that travels with you.
  *   **Failure:** It cannot explain Takoma Park or Hyattsville. If national belonging is the prerequisite for voting, non-citizens should be excluded locally too. To make this fit, you have to argue that local elections aren't "real" sovereignty (a common legal fiction), which is a dodge, not a theory.
  *   **Result:** If applied strictly, the electoral roll would be citizenship-only for *all* offices.

  ### 3. Stakeholder Theory (Contribution/Residency)
  **Rank:** 3
  **Verdict:** Generates the Local tier; contradicts the Federal tier.
  **Analysis:** This theory posits that those who have a "stake" in the community (pay taxes, use schools, subject to police) should have a voice.
  *   **Fit:** It perfectly explains your green-card neighbor. He pays property taxes, his kids use schools, he is subject to local zoning.
  *   **Failure:** It fails the overseas voter test. The woman in Lyon likely pays no US income tax (Foreign Earned Income Exclusion), uses no US roads, and is not subject to US police coercion. Her "stake" is purely abstract/nostalgic.
  *   **Result:** If applied strictly, the electoral roll would include all adult residents (citizen or not) for all offices, but exclude most citizens living permanently abroad who pay no taxes and consume no services.

  ### 4. All-Subjected Principle (Coercion)
  **Rank:** 4
  **Verdict:** Fails both tiers inconsistently.
  **Analysis:** You should vote on laws to which you are subject.
  *   **Failure (Federal):** Non-citizens are subject to federal criminal law, immigration law, and taxation. Excluding them violates this principle.
  *   **Failure (Overseas):** Expats are often *not* subject to many federal regulations (e.g., ACA mandates, certain tax codes) and cannot be easily coerced by the state (they live abroad). Including them violates this principle.
  *   **Result:** If applied strictly, the roll would include non-citizen residents for federal elections (they are subject to the draft/laws) and potentially exclude long-term expats (they can exit the coercion).

  ### 5. All-Affected Interests
  **Rank:** 5
  **Verdict:** Too porous to generate *any* stable roll.
  **Analysis:** You should vote on decisions that affect you.
  *   **Failure:** War affects everyone globally. Climate treaties affect everyone. Under a strict "affected interests" principle, your neighbor in Lyon should vote, but so should a farmer in Guatemala affected by US corn subsidies.
  *   **Result:** This theory dissolves boundaries entirely. It cannot generate a nation-state electoral roll. It produces a global plebiscite on specific issues, not a fixed citizenry.

  ### 6. Consent of the Governed
  **Rank:** 6 (Last)
  **Verdict:** Philosophically inert in this context.
  **Analysis:** Voting is the mechanism of consent, not the prerequisite.
  *   **Failure:** Non-citizens haven't consented, yet are governed. Expats haven't consented to specific laws, yet vote.
  *   **Result:** This is a justification for democracy, not a boundary marker for the *demos*. It produces nothing.

  ---

  ### The History: Theory or Political Winds?
  You are correct on the history, and it supports the **Path Dependence** hypothesis over a stable theory.

  *   **The Facts:** Alien suffrage was widespread in the 19th century (roughly 40 states/territories). Maryland allowed it from 1776 to 1851. The last state to ban it was indeed Arkansas in 1926.
  *   **The Swing:** The elimination of non-citizen voting was not driven by a new philosophical discovery that "only citizens have stakes." It was driven by **Nativism and World War I.** As immigration shifted to Southern/Eastern Europe and war heightened fears of divided loyalty, "100% Americanism" became the political currency. Banning non-citizen voting was a tool of assimilation and exclusion.
  *   **The Return:** The modern return (Takoma Park in 1992, followed by others in MD, CA, etc.) is not a rediscovery of 1790 theory. It is a pragmatic response to **demographic reality.** In towns with high non-citizen populations, excluding them creates a legitimacy crisis for local governance (e.g., a school board elected by 40% of the parents).
  *   **Conclusion:** The swing shows there is no deep theoretical commitment. The word "Citizen" in the Constitution (Art I, Sec 2; 14th Amendment; 15th; 19th; 26th) sets a *floor* for federal elections, but states have plenary power over local elections. The boundary moves with the political wind, constrained only by federal statutory bans on federal elections (18 U.S. Code § 611).

  ### The Boundary Problem
  You asked if it is a philosophical commitment that the roll is drawn by statute rather than vote.

  **Yes.** The US system solves the boundary problem via **Constitutional Decisionism.**
  The "People" do not decide who the "People" are. The Law decides.
  *   **The Circle:** You cannot vote on who gets to vote without already having a defined electorate.
  *   **The Solution:** The Constitution and Congress break the circle. They define the boundary *ex ante*.
  *   **The Implication:** This admits that democracy is not self-grounding. It rests on a pre-democratic legal order. In your specific case: The Maryland General Assembly decided municipalities *could* let non-citizens vote locally. Congress decided non-citizens *cannot* vote federally. The "demos" is a legal artifact, not a pre-political reality.

  ### Fact Check & Uncertainties
  *   **MD Non-Citizen Voting:** Accurate. Specific municipalities (Takoma Park, Hyattsville, Greenbelt, Barnesville) allow it for local offices. Statewide offices remain citizen-only.
  *   **Overseas Voting:** Accurate for Federal elections under UOCAVA. *Caveat:* Some states *do* impose limits on overseas voting for *state* elections (e.g., if you haven't voted in X years), but for President/Congress, the "last residence" rule is robust and generally indefinite.
  *   **UK 15-Year Limit:** Accurate. The Elections Act 2022 removed the 15-year limit for UK parliamentary elections.
  *   **NZ Permanent Residents:** Accurate. PRs can vote in national elections after 12 months of continuous residence.
  *   **Arkansas 1926:** This is the standard political science citation for the end of alien suffrage, though some local school board exceptions persisted longer in rare cases.

  ### Final Reconstruction
  If you want the cleanest philosophical cover for the current mess, it is this:

  **The US presupposes a "Nested Demos."**
  1.  **The National Demos:** Defined by **Citizenship.** This group controls the "High Sovereignty" functions (War, Treaties, Federal Tax, Immigration). Membership is permanent and extraterritorial (expats stay in).
  2.  **The Local Demos:** Defined by **Residency.** This group controls the "Low Sovereignty" functions (Zoning, Schools, Policing). Membership is temporary and territorial (expats out, non-citizen residents in).

  **Why this is unstable:** It relies on the fiction that local issues don't implicate national sovereignty. But school funding (which your neighbor cares about) is set by the State Legislature (which he can't vote for). This creates the exact frustration you described: He has a voice on the *spending* of school money (School Board) but not the *source* of school money (State Legislature).

  **My Bet:** The system is not trying to be philosophically coherent. It is trying to be **administratively convenient.** It keeps the national electorate stable and patriotic (citizens only) while letting cities manage their own integration problems without requiring a Constitutional Amendment. It is a pragmatic patch, not a theory.
