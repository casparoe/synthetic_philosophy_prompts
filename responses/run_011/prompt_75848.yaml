prompt: |-
  I volunteer a couple weekends a month with a voter-registration drive in my town in Maryland, one of those places near DC that opened up local elections to residents regardless of citizenship. Last spring we registred a guy who's been here like 22 years — green card, owns his house, pays property taxes, two kids in the public schools, never naturalized. He can vote for town council and mayor. DC itself started letting residents do the same in 2023. But he can't vote for the state legislature that writes the school funding formula, or for Congress, or for president; federal law flat out bans noncitizens from voting in federal elections. Meanwhile the woman who trained me moved to Lyon back in 2009, hasn't lived or paid taxes here since, and still recieves an absentee ballot every cycle in the state she last lived in, with no time limit that I'm aware of — and I think in a lot of states a kid born abroad to American parents can register in the state the parents last lived in even if the kid has never set foot in the country. Other places go further the other way: France has eleven National Assembly seats reserved for citizens living abroad, and the UK dropped its 15-year cap on overseas voters a few years back so its basically votes-for-life now, whereas I think Australia caps it somewhere around six years and New Zealand makes you have visited recently to stay on the roll — and New Zealand, on the other side of the ledger, lets permanent residents who aren't citizens vote in national elections.

  So here's what I can't get straight, and my roommate and I went around in circles on it for an hour. What theory of who the demos is does this pattern actually presuppose? Which principle, or combination of principles, could generate both halves of it at once — residence-and-stake getting you a voice about the potholes, citizenship-by-descent getting you a voice about wars and treaties forever, with no residence or stake required? Run the candidates for me: national belonging or shared identity, consent, being subject to coercion you can't realistically exit, being affected by the decisions, contributing (taxes, jury duty, the draft), and whatever the self-determination-of-a-people line is supposed to amount to. For each one, say whether it can actually produce the two-tier arrangement or whether it produces something else entirely — and if it produces something else, describe what the electoral roll would look like under it, who's on it for which offices. I especially want the difference between what the practice is *strictly* committed to and what merely sits comfortably alongside a bunch of rival theories, because I suspect most of the reconstruction people offer here is the second thing dressed up as the first.

  Two more things. First, the history bugs me: I read that something like 40 states let noncitizens vote at some point before 1926, that Maryland itself did from 1776 until 1851, and that Arkansas was the last state to ban it in 1926 — and now a handful of towns are doing it again while nobody blinked. Does that kind of swing show there's no theory underneath at all, just the word citizen in the constitutional text plus whatever the political winds allow? And second, where does the boundary problem fit — the fact that you can't democratically decide who gets to decide democratically without going in a circle. Is it itself a philosophical commitment that the roll gets drawn by statute and court rulings rather than by a vote of the people it would add or exclude? Please actually commit to answers rather than handing me a survey where every candidate view turns out to be "compatible in principle": rank them, say which reconstruction you'd bet on and why, and flag the spots where you're unsure about my legal facts, since I'm working from memory of registration forms and newspaper stories. And if you think the framing itself is confused — that a contingent, historically unstable patchwork like this doesn't express a theory of anything and the honest answer is path dependence, or that I've glued together two unrelated practices and called it one — say that plainly up front instead of humoring me with three tidy reconstructions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Core Question:** What theory of the *demos* (the people) explains the current US voting pattern where non-citizen residents can vote locally (in some places) but citizens abroad can vote federally forever, while non-citizen residents cannot vote federally?
      *   **Specific Task:** Evaluate specific theories (national belonging, consent, subjection to coercion, affected interests, contribution, self-determination) against this two-tier arrangement. Determine if they *generate* the arrangement or just sit comfortably alongside it.
      *   **Constraint 1:** Commit to answers. Rank the theories. Don't give a "survey where every view is compatible."
      *   **Constraint 2:** Address the historical context (non-citizen voting pre-1926) and the "boundary problem" (who decides the demos).
      *   **Constraint 3:** Flag legal factual uncertainties (e.g., specific state laws on overseas voting, non-citizen local voting laws).
      *   **Constraint 4:** Be willing to say the framing is confused or that there is no coherent theory (path dependence).
      *   **Tone:** Intellectual, rigorous, direct, slightly conversational but analytical (matching the user's sophisticated prompt).

  2.  **Fact-Checking & Legal Context (Mental Sandbox):**

      *   *Non-citizen voting in MD:* Takoma Park, Hyattsville, Greenbelt, etc., allow non-citizen voting in *local* elections. This is legal because Maryland state law allows municipalities to set their own election rules for local offices.
      *   *Federal Ban:* 18 U.S. Code § 611 makes it a federal crime for non-citizens to vote in federal elections.
      *   *Overseas Citizens:* UOCAVA (Uniformed and Overseas Citizens Absentee Voting Act) allows citizens abroad to vote in federal elections using their last US residence. There is generally no time limit for *federal* elections (President, Senate, House), though some states have limits for *state* elections.
      *   *Citizenship by Descent:* Yes, children born abroad to US citizens are citizens (with some residency caveats for transmission), and can vote via UOCAVA using parents' address.
      *   *History:* Non-citizen voting was common in the 19th century ("alien suffrage"), ended roughly between 1850s-1920s (Arkansas 1926 is the standard citation).
      *   *International Comparisons:* NZ allows PR voting nationally. France has seats for abroad. UK removed 15-year limit (2024?). Australia has 6-year limit (unless intending to return).
      *   *Boundary Problem:* Classic democratic theory issue (Whelan, Whittier, etc.).

  3.  **Evaluating the Theories against the Practice:**

      *   *National Belonging/Identity:* Fits the overseas citizen part well (you belong to the nation). Fails the local non-citizen part (they belong to the community but not the nation). *Verdict:* Explains the federal ban/overseas allowance, fails local inclusion.
      *   *Consent:* Weak. Non-citizens didn't consent to laws, yet vote locally. Overseas citizens didn't consent to specific laws, yet vote federally. *Verdict:* Poor fit.
      *   *Coercion (All-Affected vs. All-Subjected):*
          *   *All-Subjected:* Non-citizens are subject to local law (potholes, police). Fits local voting. But they are also subject to federal law (taxes, war), yet can't vote federally. Overseas citizens are often *not* subject to many laws (no local police, often no income tax if earned abroad), yet vote federally. *Verdict:* Inconsistent application.
      *   *Affected Interests:* Similar to coercion. Overseas citizens are less affected by potholes but vote for Congress. Local non-citizens are highly affected by school boards but excluded from state/federal. *Verdict:* Inconsistent.
      *   *Contribution (Taxes/Duty):* Local non-citizens pay property taxes. Overseas citizens might not pay income tax. *Verdict:* Doesn't align cleanly.
      *   *Self-Determination of a People:* This is the strongest candidate for the *federal* side (the "People" is a national ethnic/legal construct). But it contradicts the *local* side (the "People" is a municipal community of residents).

  4.  **Synthesizing the "Theory":**

      *   The user suspects there is no single theory. I need to validate this suspicion while still doing the analytical work requested.
      *   The "Two-Tier" system isn't a coherent philosophical derivation; it's a *jurisdictional compartmentalization*.
      *   *Federal Level:* Defined by **National Sovereignty & Citizenship**. The "Demos" is the Nation-State.
      *   *Local Level:* Defined by **Community Stakeholderhood**. The "Demos" is the Municipality.
      *   *The Conflict:* The US treats localities as creatures of the state, but allows them to define their own "local demos" *only if* the state permits, while the Federal government rigidly defines the "national demos" by citizenship.
      *   *Best Reconstruction:* **Federalism + Civic Nationalism.** The federal tier is Civic Nationalist (citizenship only). The local tier is Pragmatic/Residential (stakeholder). They don't share a *single* theory of the demos; they operate on *different* theories for *different* sovereign layers.

  5.  **Addressing the History & Boundary Problem:**

      *   *History:* The swing from alien suffrage to bans wasn't theoretical; it was nativist/political (WWI, labor competition). The return is pragmatic (integrating immigrant communities). This supports the "Path Dependence/Political Winds" hypothesis over a stable theory.
      *   *Boundary Problem:* In the US, the boundary is decided by *law* (Constitution + Statutes), not by the demos itself. This avoids the circle by fiat. It's a legal question, not a democratic one.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Opening:* Acknowledge the sharpness of the observation. Validate the suspicion: There is no *single* unified theory. It's a clash of two theories applied to different jurisdictions.
      *   *Section 1: The Theory Audit.* Go through the requested candidates. Be ruthless.
          *   *National Belonging:* Wins on Federal, loses on Local.
          *   *Coercion/Affected:* Wins on Local, loses on Federal (overseas voters).
          *   *Contribution:* Mixed/Weak.
          *   *Winner:* **Jurisdictional Sovereignty.** The theory is "Who holds the power defines the demos."
      *   *Section 2: The Reconstruction.* The US system presupposes **Nested Sovereignties with Different Membership Rules.** Federal = Citizenship (National Identity). Local = Residency (Community Interest).
      *   *Section 3: History.* Confirm the 19th-century alien suffrage. Explain the shift (nativism/WWI). Confirm the modern return is statutory, not constitutional.
      *   *Section 4: Boundary Problem.* It is solved by *law*, not *vote*. This is a "Constitutional Decisionism."
      *   *Fact Checks:*
          *   MD Non-citizen voting: True for specific municipalities (Takoma Park, etc.), not statewide.
          *   Overseas voting: UOCAVA covers federal. State rules vary for state elections.
          *   UK 15-year limit: Removed recently (Elections Act 2022).
          *   NZ PR voting: True for national elections.
      *   *Ranking:*
          1.  Jurisdictional Sovereignty (The actual operating principle).
          2.  Civic Nationalism (Federal tier).
          3.  Stakeholder/Residency (Local tier).
          4.  All-Subjected/Affected (Inconsistent).
          5.  Consent (Irrelevant).

  7.  **Refining the Tone:**
      *   Avoid hedging too much ("some might say").
      *   Use direct language ("This theory fails," "This fits").
      *   Address the "path dependence" hypothesis directly.

  8.  **Final Review against Constraints:**
      *   Did I rank them? Yes.
      *   Did I flag legal uncertainties? Yes (specifically on state-level overseas voting variations).
      *   Did I address the boundary problem? Yes.
      *   Did I avoid the "everything is compatible" trap? Yes, by highlighting contradictions.

  **(Self-Correction during drafting):** I need to be careful about the "Overseas Voting" claim. While UOCAVA guarantees federal voting, some states *do* try to limit it for *state* elections, but the federal right is robust. I should clarify that distinction. Also, the user mentioned the woman who trained him votes in "the state she last lived in." This is standard UOCAVA. I need to confirm if there's a time limit. *Correction:* For *federal* elections, there is generally no time limit under UOCAVA. For *state* elections, it varies. I will note this nuance.

  Also, the user's premise about "no theory underneath" is strong. I should validate that the "theory" is actually *Federalism* itself, which allows for conflicting definitions of the demos at different levels. That is the most honest philosophical answer.

  Let's structure the ranking clearly.
  1. **Jurisdictional Sovereignty (Federalism)** - The meta-theory.
  2. **Civic Nationalism** - Explains the federal exclusion/inclusion.
  3. **Stakeholder Theory** - Explains the local inclusion.
  4. **All-Subjected/Affected** - Fails the overseas test.
  5. **Consent** - Fails both.

