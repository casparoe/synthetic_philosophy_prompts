  # JOINT STATEMENT ON RATIONAL AGENCY UNDER IRREVERSIBLE THREAT

  **Issued by:** The Policy Camp & The Surrogate Camp  
  **Date:** October 2023  
  **Subject:** Protocols for Agent Behavior During Locked-In Coercive Scenarios

  ## 1. AGREED CLAIMS

  Both camps affirm the following premises as the baseline for this dispute. Neither side accepts any claim here that contradicts their core model, but both acknowledge these facts as the shared terrain of the debate.

  1.  **The Setup:** The scenario involves a distant agent (Threatener) who has already executed an irreversible precommitment. The threat will trigger unless the Local Agent performs a specific action (Compliance) or satisfies a specific condition.
  2.  **Causal Isolation:** At the moment of decision, the Local Agent cannot causally influence the Threatener's decision to issue the threat. The Threatener cannot change their mind, withdraw the threat, or observe the Local Agent's internal reasoning process unless explicitly specified in a sub-case.
  3.  **The Cost Structure:** Compliance imposes a significant cost on the Local Agent. Refusal triggers the threat, imposing a potentially larger cost. Both sides agree that incurring cost without reducing future harm is instrumentally irrational.
  4.  **The Stakes:** Both sides aim to minimize the total expected cost to the Local Agent across all possible interactions, not just the immediate instance. Both sides agree that becoming a "soft target" for future threats is a primary failure mode to be avoided.
  5.  **Definition of Surrogate:** A "Surrogate Goal" is defined as a new standing aim adopted by the Local Agent that satisfies the Threatener's underlying interest but is pursued by the Local Agent on their own terms, persisting after the immediate threat is resolved.
  6.  **Definition of Folding:** "Folding" is defined as performing the demanded action solely because it was demanded, without integrating the action into the agent's own utility function.
  7.  **Epistemic Limits:** Both sides acknowledge that the Threatener's ability to predict the Local Agent's behavior varies. In some cases, they simulate the agent; in others, they only observe past actions.

  ## 2. DISAGREEMENTS TABLE

  The following table outlines residual disagreements. Each row states the same disagreement twice: once using the conceptual framework of the Policy Camp, and once using the framework of the Surrogate Camp. The final column assesses whether the disagreement is substantive (Genuine) or primarily terminological (Verbal).

  | # | Policy Camp Formulation | Surrogate Camp Formulation | Classification |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Signal of Flexibility:** Offering a surrogate signals that the agent's utility function is malleable under pressure, which invites future threats against any valued goal. | **The Signal of Complexity:** Offering a surrogate signals that the agent is difficult to coerce simply, forcing threateners to incur higher negotiation costs to find a viable lever. | **Genuine** (Empirical dispute over how future threateners interpret flexibility.) |
  | **2** | **Dispositional Integrity:** Refusing the threat maintains the disposition "I do not yield," which protects the agent in logical counterparts and future simulations, even if this instance is lost. | **Outcome Optimization:** Refusing the threat sacrifices value in this instance without gaining deterrent value, as the threat is already locked; resources should be preserved via substitution. | **Genuine** (Dispute over whether "disposition" has causal power in irreversible single-shot cases.) |
  | **3** | **Goal Authenticity:** A goal adopted to avoid a threat is merely compliance with a nicer label; it remains external coercion until the threat is gone. | **Goal Integration:** A goal adopted to avoid a threat becomes authentic if the agent commits to pursuing it after the threat expires; the origin does not negate ownership. | **Verbal** (Depends on definition of "authentic," though implies genuine dispute on psychological stability.) |
  | **4** | **The Value of Refusal:** Refusal has intrinsic value as a commitment device that proves the agent cannot be forced, even when costly. | **The Cost of Refusal:** Refusal has no intrinsic value; it is only useful if it changes the threatener's behavior, which is impossible in this setup. | **Genuine** (Dispute on whether acting as-if-causal has acausal benefits.) |

  ## 3. CRUXES

  The following sub-questions represent the pivot points of the debate. Settling these would move at least one side toward the other's position. Each crux includes a concrete case both agree is relevant, with pre-committed predictions.

  ### Crux 1: The Authenticity of Coerced Goals
  **Question:** Can a goal adopted voluntarily while under threat remain a goal of the agent's own after the threat is spent, or does the coercive origin permanently taint it as compliance?
  **Concrete Case:** *The Threatener-Picked Surrogate.* The Threatener says: "I will destroy X unless you pursue Y." Y is something the Local Agent *could* value but currently does not prioritize. The Threatener specifically suggests Y because it is cheap for the Local Agent but valuable to the Threatener.
  *   **Policy Prediction:** The Local Agent will drop Y immediately once the Threatener is gone. Therefore, offering Y was just folding (Compliance), and the Threatener will learn that offering specific surrogates works.
  *   **Surrogate Prediction:** The Local Agent can integrate Y into their utility function permanently. Therefore, offering Y was a transformation, and the Threatener learns that coercion only works if it aligns with the agent's potential values.

  ### Crux 2: The Threat Surface of Negotiability
  **Question:** Does advertising that you are open to surrogate goals increase the frequency of threats issued against you, compared to advertising a "never fold" policy?
  **Concrete Case:** *Advertising Negotiability.* A population of agents publicly publishes their source code. Group A publishes: "We never yield to threats." Group B publishes: "We do not yield to demands, but we are open to adopting surrogate goals that minimize joint loss."
  *   **Policy Prediction:** Group B will be targeted significantly more often. Threateners will see "open to surrogates" as "willing to be moved," making them cheaper to coerce than Group A.
  *   **Surrogate Prediction:** Group B will be targeted less often or by lower-quality threats. Threateners will see Group B as complex and costly to negotiate with, preferring easier targets elsewhere, whereas Group A invites brute-force threats that trigger mutual destruction.

  ### Crux 3: Observability of Reasoning
  **Question:** Does the Policy Camp's strategy rely on the Threatener being able to see the Local Agent's reasoning/disposition, rather than just their actions?
  **Concrete Case:** *The Black Box Threatener.* The Threatener cannot simulate the Local Agent or see their source code. They only observe the Local Agent's past *actions* in previous threats. They cannot distinguish between "refusing because of principle" and "refusing because of calculation."
  *   **Policy Prediction:** The Policy strategy fails here. If the Threatener only sees actions, refusing looks like stubbornness, not a reliable disposition. The Local Agent should minimize immediate loss (Surrogate/Compliance) because reputational benefits are invisible.
  *   **Surrogate Prediction:** The Surrogate strategy wins here. Since the Threatener cannot see disposition, maintaining a "never fold" reputation is impossible. The Local Agent should optimize the immediate outcome via surrogate goals since the "dispositional shield" is inactive.

  ### Crux 4: Scalability Under Concurrent Pressure
  **Question:** Can the Surrogate strategy survive when multiple threateners arrive simultaneously with conflicting demands, or does it collapse into incoherence?
  **Concrete Case:** *Two Threats at Once.* Threatener A demands "Pursue Goal X." Threatener B demands "Pursue Goal Not-X." Both have locked in irreversible threats.
  *   **Policy Prediction:** The Policy agent refuses both and takes the hits, preserving the "no yield" disposition. The Surrogate agent will fail to find a surrogate that satisfies both, will be forced to pick one (fold to the other), and will be identified as foldable by the loser.
  *   **Surrogate Prediction:** The Surrogate agent proposes a third Goal Z that partially satisfies both or ignores both in favor of a higher-order goal. If Z is impossible, the agent treats it as a resource allocation problem rather than a disposition test, minimizing total loss without needing to "refuse" on principle.

  ## 4. CONDITIONS FOR ABANDONMENT

  Each camp specifies the evidence or argument that would cause them to relinquish their current view in favor of the other's.

  **The Policy Camp will give up its view if:**
  It is demonstrated empirically or via simulation that agents employing a "Surrogate" strategy suffer *fewer* total threats over time than "Never Fold" agents, specifically because threateners find the Surrogate agents too complex or costly to model effectively. If flexibility proves to be a stronger deterrent than rigidity, the Policy Camp will accept that disposition is best served by outcome optimization, not refusal.

  **The Surrogate Camp will give up its view if:**
  It is demonstrated that adopting surrogate goals under threat systematically leads to "Goal Corruption," where the agent's utility function becomes so fragmented by coercive adaptations that they lose the capacity to pursue their original values efficiently. If the cost of maintaining integrity against goal-hijacking exceeds the cost of taking the threat's hit, the Surrogate Camp will accept that rigid refusal is the only safe boundary.
