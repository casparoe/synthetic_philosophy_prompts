answer: |-
  This is a remarkably clear-eyed inventory. You have identified the exact friction points where most reparations frameworks crack. You are trying to reconcile *Corrective Justice* (fixing a specific transaction) with *Distributive Justice* (fixing a systemic outcome) using a lens of *Political Membership* (who belongs to the community and on what terms).

  The principle you are reaching for is not a ledger of gains and losses. It is a **Principle of Civic Restoration.**

  Under this principle, reparations are not primarily about compensating pain or disgorging profit. They are about repairing the *political relationship* between the State (and its authorized institutions) and the Citizens (or excluded groups) whose standing was violated. The debt belongs to the entity that defines the rules of membership, and the remedy must restore the capacity to participate fully in that membership.

  Here is that principle stated precisely, with your nine verdicts tagged to the clauses that generate them.

  ### The Principle of Civic Restoration

  **Clause 1: Institutional Continuity of Authority.**
  *The debt attaches to the office, not the officeholder.* If an institution (State, Bank, Corporation) committed the wrong while operating under the authority of the current political order, and that institution still exists or its authority has been absorbed by a successor, the debt persists regardless of personnel turnover.
  *   **Explains (1):** The City still owns the land and exercises eminent domain power. The *office* broke the covenant, so the *office* pays.
  *   **Explains (3):** The Bank is a continuous legal entity that designed and profited from the exclusionary policy. It remains an authorized actor in the current economy.
  *   **Explains (9):** An apology acknowledges the breach of covenant; money restores the material capacity to participate. One without the other fails the restoration.

  **Clause 2: Private Beneficiaries are Not Debtors.**
  *Individuals inherit the political order, not the moral liabilities of their ancestors.* Private citizens benefit from systemic injustice passively. Unless they actively perpetuated the wrong, they owe no personal debt, because they do not hold the power to repair the civic standing of others.
  *   **Explains (2):** The white family benefited from FHA policies, but they did not write the policies. They are fellow citizens, not creditors.
  *   **Explains (4):** The developer's heirs inherited wealth, but they did not inherit the *authority* that enabled the covenants. They are private actors, not institutional fiduciaries. (Note: This creates tension with Clause 1, addressed below).
  *   **Explains (7):** The 1993 immigrant is a member of the current political community (hence taxes pay for repair) but not a historical agent of the exclusion (hence no personal claim). The "non-existence" argument is irrelevant because the claim is about current standing, not counterfactual history.

  **Clause 3: Severity Scales with Exclusion from Membership.**
  *The strength of the claim is proportional to how fundamentally the wrong denied the group's status as members of the political community.*
  *   **Explains (5):** Slavery is the strongest claim because it was not just a theft of labor, but a total denial of personhood and membership. It is the foundational flaw in the covenant.
  *   **Explains (1) vs (5):** The 1954 taking was a violation of rights *within* the community; Slavery was a violation of the right *to be in* the community. Hence (5) > (1).

  **Clause 4: Remedy Matches the Nature of the Breach.**
  *Specific asset theft requires asset restoration; systemic exclusion requires systemic investment.*
  *   **Explains (1):** The city took a specific plot. The remedy tracks the specific plot's current value.
  *   **Explains (6):** Internment was a specific State act against specific individuals (cash fits). Slavery/Jim Crow was a systemic condition creating a wealth/standing gap (collective investment fits).
  *   **Explains (7):** Taxes fund the collective investment required by Clause 4 for systemic exclusion.

  **Clause 5: Persistence of Effect, Not Time.**
  *Claims do not fade with calendar years; they fade only when the effects of the exclusion have dissipated or been remedied.*
  *   **Explains (8):** You feel the 1870 claim has dissipated. Under this principle, this is only true if the *disadvantage* from that taking is no longer measurable or traceable.
  *   **Explains (1):** 1954 is recent enough that the neighborhood disruption and wealth loss are clearly traceable.

  ---

  ### Application to Your Three New Cases

  **1. The Former Colonial Power (Museums & Law)**
  *   **Verdict:** **Partial Liability.**
  *   **Reasoning:** Under Clause 1, the courts applying inherited law suggest institutional continuity of authority, creating a duty to reform those laws. Under Clause 4, the museums holding specific objects are holding specific stolen assets, requiring return (not necessarily cash reparations). However, because the power no longer governs the territory, the *Civic* relationship is broken. They cannot restore "standing" in a polity they no longer administer.
  *   **Outcome:** Return objects, fund legal reform, but broad financial reparations are limited because they cannot repair the civic covenant they no longer oversee.

  **2. Wrongdoers' Descendants Now Persecuted**
  *   **Verdict:** **Claim Survives, Remedy Prioritized.**
  *   **Reasoning:** Under Clause 2, the descendants owe no *personal* debt. Under Clause 3, the claim is based on the victims' exclusion, not the perpetrators' current status. However, under Clause 4 (Remedy Matches Breach), reparations are aimed at restoring capacity. If the victims' descendants are better off than the wrongdoers' descendants, the *urgency* of the material transfer shrinks, but the *acknowledgment* of the wrong remains.
  *   **Outcome:** The moral debt doesn't flip. But if reparations are needs-based (as you prefer in Case 6), this group might not qualify for funds, even if they qualify for apology/truth-telling.

  **3. Defunct State, Successor Founded on Repudiation**
  *   **Verdict:** **Successor Liability for Legitimacy.**
  *   **Reasoning:** Under Clause 1, if the successor state claims the territory and authority of the prior state, it inherits the liabilities necessary to establish its own legitimacy. By repudiating the old state, it admits the old state was illegitimate. To be legitimate itself, it must repair the breaches of the predecessor.
  *   **Outcome:** The claim survives. In fact, paying it is often the price of the new state's entry into the community of nations (e.g., post-Apartheid South Africa, post-Nazi Germany).

  ---

  ### The Hard Truth: Which Verdict to Drop?

  You asked me to be straight about which intuition the best account cannot keep.

  **You must drop Verdict (8).**

  > *(8) A farm taken in 1870... I feel the claim has basically dissipated. But 1954 is only seventy years ago and I feel no dissipation there whatsoever...*

  This is the weak link in your chain. Here is why:

  If your strongest principle is **Clause 3 (Severity of Exclusion)** and **Clause 5 (Persistence of Effect)**, then 1870 should logically be a *stronger* claim than 1954, not a weaker one.
  *   **Compound Interest:** A farm taken in 1870 represents 150 years of lost equity, appreciation, and intergenerational wealth transfer. Mathematically, that loss is vastly larger than a 1954 taking.
  *   **Foundational Harm:** 1870 is closer to Reconstruction. A taking then was likely part of the re-establishment of racial hierarchy after the Civil War. That strikes at the *Civic Covenant* (Clause 3) harder than a 1954 urban renewal project, which was cruel but occurred within an established (if flawed) legal framework.

  **Why you feel differently:**
  You feel (8) has dissipated because of **evidentiary fatigue.** It is hard to trace the specific lineage and the specific economic impact over 150 years. It feels "too far back." But you admitted in (5) that Slavery (250+ years) is the *strongest* claim. You cannot hold that Slavery is the strongest claim *and* that an 1870 theft has dissipated, unless your metric is purely "can I find the deed?"

  **The Cost of Dropping (8):**
  If you drop (8), you concede that **time does not cure injustice.** This means your task force's work is never "done." It means you must acknowledge that the wealth gap in your city is not just the result of 1950s zoning, but of 1870s dispossession, and that the liability is cumulative.

  **The Alternative:**
  If you keep (8), you have to weaken (5). You have to admit that Slavery claims are largely symbolic because the actors are dead and the ledgers are lost. But you explicitly said (5) is your *strongest* conviction.

  **Recommendation:**
  Keep (5). Drop (8).
  Accept that the 1870 claim is valid *in principle*, even if it is difficult to administer *in practice*. You can distinguish them on **administrative feasibility** (we can trace the 1954 families, we can't trace the 1870 ones) rather than **moral validity** (the 1870 wrong doesn't count).

  This saves your core principle: The State owes for the breach of covenant. It just admits that sometimes the ledger is too burnt to read, so we settle for the pages we can still decipher (1954) without pretending the burnt pages (1870) didn't exist.

  **One Final Tension to Watch:**
  Be careful with **(3) vs (4)**. You say the Bank owes because it's the "same actor," but the Heirs don't because they are "different actors."
  *   **The Risk:** This looks like a class bias. A Bank is just a legal shell for shareholders (people). If the Bank must disgorge profits from 1960, why don't the shareholders?
  *   **The Fix:** Rely on **Clause 1 (Institutional Authority).** The Bank had the *power* to set lending policy. The Heirs did not. The debt attaches to the *power*, not the *profit*. If you stick to that, (3) and (4) can coexist. If you slide into "unjust enrichment" logic, (4) collapses.

  You have a coherent philosophy here. It's a **Political Standing** theory, not a **Property Law** theory. Lean into that. It explains why you care more about the Hospital (State power) than the Farm (Private wealth), and why Slavery (Total exclusion) trumps everything. Just don't let the statute of limitations intuition (8) undermine the foundational claim (5).
