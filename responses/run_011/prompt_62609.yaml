          *   Response: Tracking revealed preferences (engagement) is not tracking *normative* interests or will. Also, the *capacity* to change the model without consent is the key. The randomized experiments (Clause 3) are the smoking gun for arbitrariness regarding the individual.

      *   *Refining the Defeating Property:* "Local Ranking" or "Client-Side Control." If the user downloads the model and ranks locally, or specifies the weighting.
