          *   *Cost:* This stretches "interference" less, but requires accepting that structural control counts as power over choice.
      *   **Addressing Objection 1 (Arbitrariness):** The system tracks user interests (engagement). Is it arbitrary?
          *   *Republican Definition:* Arbitrary = not forced to track the interests/ideas of the sufferer.
          *   *Counter:* It tracks engagement, not necessarily the user's *true* interests or long-term welfare. More importantly, Clause 3 (randomized experiments) introduces genuine arbitrariness. The cohort assignment is random. The objective function is aggregate, not individual. The platform *could* change the objective tomorrow without consulting the user. The user has no veto. The tracking is incidental to the platform's goal (engagement/profit), not mandated by the user's will.
      *   **The Load-Bearing Constraint (Clause 6):** Why can't they just leave? Network effects. This creates a condition of necessity. If I must use this road, and you control the traffic lights arbitrarily, I am dominated, even if you let me drive.
