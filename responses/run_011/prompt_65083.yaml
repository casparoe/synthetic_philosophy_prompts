answer: |-
  This is a precise and sophisticated observation. You are describing a specific failure mode of governance that is distinct from simple stagnation. You are right to be suspicious of standard historical metaphors; your intuition is that the stability you see is *dynamic*, not static. It requires energy to maintain, and the shock provides that energy.

  Here is the carving you are looking for, drawn from political science, ecology, and systems theory.

  ### 1. The Nearest Established Concepts

  There are three concepts that converge on your observation. None fit perfectly alone, but together they map the territory.

  **A. Maladaptive Resilience (Social-Ecological Systems)**
  In resilience theory (Holling, Gunderson, Folke), "resilience" is not inherently good. It is simply the capacity of a system to absorb disturbance and retain its essential function and structure.
  *   **The Fit:** This matches your description of a system that digests shocks without changing its arrangement.
  *   **The Nuance:** When a system is resilient *in the wrong state* (e.g., a water allocation system that preserves inequity or ecological degradation), it is termed **Maladaptive Resilience**. The system successfully resists transformation, thereby locking in vulnerability.
  *   **Where it differs:** Resilience theory often focuses on the ecological or social *outcome* (vulnerability). You are focusing on the *institutional mechanism* (the agency gets bigger). Your observation is about the *political economy* of that resilience.

  **B. Policy Feedback Loops (Historical Institutionalism)**
  Political scientists (Paul Pierson, Suzanne Mettler) argue that policies are not just outputs; they are inputs. Once a policy is in place, it creates constituencies, administrative structures, and expectations that defend it.
  *   **The Fit:** This explains why the "new agency inherits the boundaries of the body it replaced." The water code creates rights-holders; those rights-holders defend the code; the shock justifies more enforcement budget.
  *   **Where it differs:** Standard policy feedback often relies on the concept of a "Critical Juncture" (a fork in the road). You correctly noted that you don't see a fork. You see a continuous process. This suggests you are observing **Self-Reinforcing Equilibrium** rather than classic Path Dependence. Path dependence explains why we *started* here; Policy Feedback explains why we *stay* here. You are describing the *fuel* that keeps the engine running (the shock).

  **C. The Rigidity Trap (Adaptive Cycle)**
  In the Panarchy model (Adaptive Cycle), systems move through Growth, Conservation, Release, and Reorganization.
  *   **The Fit:** You are describing a system stuck in the **Conservation** phase. It is highly connected, efficient, and rigid. It manages shocks by adding more control (more funding, more defense) rather than allowing "Release" (creative destruction/reorganization).
  *   **Where it differs:** The theory predicts that Rigidity Traps eventually lead to catastrophic collapse (Release). You are observing a system that has avoided collapse for a decade or more by successfully metabolizing the shocks. You are describing a *successful* Rigidity Trap, at least from the institution's perspective.

  ### 2. The Verdict on "Inertia vs. Absorption"

  You asked if the literature takes the difference between "slowness as inertia" and "slowness as absorption" seriously.

  **Verdict:** In **physics and cybernetics**, this distinction is fundamental (Static Friction vs. Dynamic Equilibrium / Homeostasis). In **history and political science**, it is frequently collapsed.

  *   **Braudel/Annales:** Treats slowness as *geographic or demographic mass*. It is passive. A coastline does not *work* to remain a coastline.
  *   **Your Observation:** Treats slowness as *homeostatic*. A body temperature does not stay at 98.6° because it is inert; it stays there because it burns calories to regulate itself against shocks.

  Most historical narratives treat institutions like coastlines (Braudel). They assume that if an institution survives a shock, it was because the institution was "strong" (inert mass). You are arguing the institution survives *because* it consumed the shock. It converted the energy of the crisis into the capital of the bureaucracy.

  The literature that captures this is **Systems Theory** (specifically Negative Feedback Loops) applied to **Political Economy**. When historians use this, it is often under the term **"Dynamic Conservatism"** (a term used by Richard Hofstadter, though he applied it more to ideology than structure).

  ### 3. The Carving: A Proposed Term

  Since no single existing term captures the *metabolic* nature of what you are seeing (the conversion of shock into structural reinforcement), I recommend you adopt a specific framing within the umbrella of Maladaptive Resilience.

  **Term:** **Institutional Metabolism** (or **Metabolic Stability**)

  **Definition:** A condition in which an institution maintains its structural equilibrium not through passive resistance, but by actively converting external disturbances (shocks, crises, scarcity) into the resources (budget, legal precedent, political capital) required to reinforce its existing boundaries.

  **Why this works:**
  1.  **Metabolism** implies energy conversion (Shock → Budget).
  2.  **Stability** implies the outcome (The structure remains).
  3.  It distinguishes from **Inertia** (which requires no energy) and **Path Dependence** (which focuses on the origin, not the maintenance).

  ### 4. Falsifiability and Boundary Cases

  To ensure this is an analytical resource and not just a metaphor, you must be able to prove it *wrong*. Here is how you test for Institutional Metabolism:

  **The Test:**
  Track the flow of resources following a shock.
  *   **If Institutional Metabolism is present:** The shock results in an *increase* in the agency's authority, budget, or legal defensibility, *without* a change in the underlying allocation rules or property boundaries. The crisis is cited as justification for the expansion.
  *   **If it is NOT Institutional Metabolism:**
      1.  **Adaptive Change:** The shock leads to a rewriting of the water code or a redrawing of property lines (The structure changes).
      2.  **Attrition:** The shock depletes the agency's resources, leading to a reduction in scope or authority (The structure weakens).
      3.  **Passive Inertia:** The shock occurs, the agency does nothing, and the structure remains only because no one challenged it (No energy conversion).

  **Boundary Case (What looks like it but isn't):**
  *   **Disaster Capitalism (Naomi Klein):** This looks similar (using shock to advance an agenda). *Difference:* Disaster Capitalism usually involves *changing* the rules to favor new actors (privatization, deregulation). You are describing *preserving* the old rules to favor existing actors.
  *   **Bureaucratic Bloat:** Agencies growing over time. *Difference:* Bloat can happen in peace time. Institutional Metabolism *requires* the shock as the nutrient source. If the agency grows during a period of stability, it's just bloat. If it grows *because* of the drought, it's metabolism.

  ### 5. Final Recommendation for Your Piece

  You can lean on this. It is not merely a turn of phrase. It describes a documented phenomenon in Social-Ecological Systems literature (**Maladaptive Resilience**) driven by a mechanism in Political Science (**Policy Feedback**), characterized by a specific dynamic (**Homeostasis**).

  However, existing terms are either too normative ("Maladaptive") or too static ("Path Dependence").

  **Use "Institutional Metabolism."**
  Define it early in your piece exactly as you did in your prompt: *The process by which the legal and physical infrastructure of water allocation digests disturbance to reinforce its own permanence.*

  This allows you to make a crucial argument: **The problem is not that the system is broken.** A broken system would fail. **The problem is that the system is working exactly as designed.** It is designed to preserve the allocation structure, not to ensure water security. The drought is not a failure of the system; the drought is the fuel the system burns to prove its necessity.

  This distinction transforms your piece from a story about "water scarcity" to a story about "institutional survival." That is a much stronger analytical hook.
