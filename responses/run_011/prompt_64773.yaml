answer: |-
  **Question 1**

  **Stem:**
  Two rival publications each employ a full-time forecaster. Both subscribe to the same commercial wire services and the same regulatory data releases; neither has private access to anything the other lacks. Each month both go on the record with a probability for one binary proposition — that a particular drug will receive approval before the end of the calendar year — and each publishes a short note explaining what moved them. Both are competent, both are honest, both know the other is competent and honest, and all of this is a matter of public record. One was trained as an epidemiologist, the other as an econometrician, and each maintains that their training is what their starting point reflects. In fourteen months their published numbers have never coincided. My editor now proposes a consensus protocol: the two will continue alternating monthly publications until their numbers match, at which point the magazine runs the agreed figure as its house forecast.

  **Task:**
  (i) Critically evaluate the editor's proposal using Aumann's Agreement Theorem. Does the theorem entail that this protocol must terminate? Does the fourteen-month divergence prove that at least one forecaster has been irrational? In your answer, you must distinguish between the common prior as a modelling device, the requirement of common knowledge, and the normative status of the assumption itself. (20 marks)

  (ii) Briefly explain how the same logic underpins the 'no-trade theorem' regarding speculative markets. (5 marks)

  ***

  **Model Answer**

  The editor's proposal relies on a category error regarding what Aumann's Agreement Theorem actually guarantees. The theorem states that if two agents share a **common prior** and their posterior probabilities are **common knowledge**, their posteriors must be identical. It does not state that rational agents must inevitably agree, nor does it guarantee that a protocol of public announcement will force convergence.

  First, the fourteen months of divergence does not prove irrationality. Aumann's result is a conditional: *if* common priors and common knowledge hold, *then* agreement follows. Since the forecasters disagree, we know logically that at least one of the premises has failed. It is entirely consistent with rationality for them to have **different priors**. The forecasters explicitly claim their training dictates their "starting point." If we treat priors as subjective interpretations of the world (the Bayesian view), an epidemiologist and an econometrician may legitimately weight structural risks differently before seeing the same data. To claim this is irrational is to assert the Common Prior Assumption (CPA) as an empirical law rather than a modelling constraint. Economics largely accepted subjective utility but resisted subjective probability because heterogeneous priors make equilibrium modelling intractable; if everyone starts from a different universe, trade and prediction become chaotic. However, resisting the idea for mathematical convenience does not make heterogeneous priors impossible in reality.

  Second, the protocol fails because it confuses **mutual knowledge** with **common knowledge**. It is mutual knowledge that Forecaster A publishes a number: B sees it, and A knows B sees it. But common knowledge requires an infinite regress: A knows B knows A knows B knows the number, ad infinitum. Mere publication does not automatically satisfy this. While Geanakoplos and Polemarchakis showed that iterated exchange of posteriors can generate common knowledge and force agreement in finite state spaces, this *only* works if the common prior exists. If the forecasters truly hold different priors, they can exchange numbers forever without converging to a match. They might update their beliefs based on the other's number (treating the other's mind as data), but they will not necessarily meet. The protocol assumes the act of announcement resolves the epistemic gap; it does not.

  Therefore, the theorem does not entail the protocol must terminate. Termination is only guaranteed if the forecasters secretly share a prior but lack the communication channel to realize it. If their priors differ, the protocol could run indefinitely without either party acting irrationally. The divergence is evidence of heterogeneous priors or incomplete communication, not necessarily incompetence.

  (ii) This logic extends directly to financial speculation. The 'no-trade theorem' posits that if traders share a common prior and have common knowledge of each other's willingness to trade, mutually beneficial speculative bets should be impossible. If I know you are rational and we share a prior, I should infer that your willingness to sell implies you possess negative information I lack. Thus, I should not buy. Trade only occurs if agents suspect the other is irrational (noise traders) or if they maintain different priors about the asset's value. Just as the forecasters can agree to disagree, traders can bet against each other only if they reject the common prior assumption.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **Part (i) – Critical Evaluation (20 Marks)**

  1.  **Theorem Conditions & Irrationality (5 marks):**
      *   3 marks: Correctly states that divergence implies failure of *either* Common Prior *or* Common Knowledge, not necessarily irrationality.
      *   2 marks: Explicitly rejects the idea that the theorem mandates termination in this specific case.
  2.  **Common vs. Mutual Knowledge (5 marks):**
      *   3 marks: Distinguishes mutual knowledge (I know you know) from common knowledge (infinite regress).
      *   2 marks: Explains that publication alone does not guarantee common knowledge.
  3.  **Protocol & Convergence (5 marks):**
      *   3 marks: Notes that iterated announcement (Geanakoplos-Polemarchakis) only forces agreement *if* priors are common.
      *   2 marks: Acknowledges that with different priors, the protocol may never terminate.
  4.  **Status of Common Prior Assumption (5 marks):**
      *   3 marks: Identifies CPA as a modelling device/normative constraint rather than empirical fact.
      *   2 marks: Contextualizes why economics resists heterogeneous priors (tractability vs. reality).

  **Part (ii) – No-Trade Theorem (5 Marks)**

  5.  **Speculative Trade Connection (5 marks):**
      *   3 marks: Links common priors/knowledge to the impossibility of speculative bets.
      *   2 marks: Identifies that trade implies differing priors or belief in opponent's irrationality.

  **Grading Bands**

  *   **First Class (20–25):** Hits all discrete items above. Prose is fluid; distinguishes clearly between the *logic* of the theorem and the *empirics* of the case. Part (ii) is integrated smoothly.
  *   **Mid-Range (13–19):** Correctly identifies that irrationality is not proven (Item 1) and distinguishes mutual/common knowledge (Item 2). However, may assume the protocol *would* work if priors were common (missing Item 3 nuance) or treats the CPA as simply "true/false" without discussing its modelling status (Item 4). Part (ii) may be vague.
  *   **Fail (0–12):** Recites the theorem without applying it to the stem. Claims divergence proves irrationality. Confuses mutual and common knowledge.

  **Specific Mistakes & Penalties**

  1.  **The "Recall" Error (-5 marks):** Simply stating "Aumann says rational agents cannot agree to disagree" without qualifying the *Common Prior* and *Common Knowledge* conditions.
      *   *Signals:* Rote memorization without comprehension of premises.
  2.  **The "Publicity" Error (-5 marks):** Asserting that because the numbers are published, they are automatically Common Knowledge.
      *   *Signals:* Failure to grasp the infinite regress requirement of common knowledge.
  3.  **The "Normative" Error (-5 marks):** Claiming that because the forecasters disagree, they *must* have different priors (ignoring the lack of common knowledge) OR claiming they *must* have the same priors (ignoring subjective probability).
      *   *Signals:* Inability to separate the modelling assumption from the behavioural evidence.

  ***

  **Confidence Statement**

  I am **highly confident** (95%+) in the technical claims regarding Aumann's Agreement Theorem and the distinction between mutual and common knowledge. The model answer correctly identifies that the theorem is a conditional statement (If CP + CK -> Agreement) and that violating the conclusion (Disagreement) implies negating at least one premise (No CP or No CK).

  I am **highly confident** (90%+) in the application of the Geanakoplos-Polemarchakis (1982) result regarding iterated announcements. It is standard epistemic game theory that exchanging posteriors leads to common knowledge of posteriors in finite partitions, *provided* the common prior holds.

  The **one point I am least sure of** (85% confidence) is the phrasing in the model answer regarding the protocol running "indefinitely" if priors differ. While it is true they will not *agree*, in some specific functional forms with continuous signals, posteriors might converge to a limit without matching, or the "finite state space" constraint required for the Geanakoplos-Polemarchakis convergence proof might not hold in a real-world forecasting scenario (which is effectively infinite). I have phrased the answer to avoid promising specific convergence dynamics ("might update... but will not necessarily meet"), but a strict game theorist might quibble that without defining the state space, we cannot guarantee the process doesn't stall in a cycle rather than run indefinitely. This is a nuance likely beyond the scope of a journalism module, but it is the technical weak point of the package.
