answer: |-
  # Activity: The Unmarked Road

  ### Materials & Setup
  *   **Printables:** 24 "Strategy Sheets" (plan $p$), 48 "Junction Slips" (record belief $\alpha$ + choice), 24 "Payoff Cards" (0, 1, 4).
  *   **Props:** 6 identical desks/chairs, 6 blindfolds (or instruct eyes closed), 1 deck of shuffled cards (for TA randomization).
  *   **Incentives:** Participation points (Leaderboard: 1st = +2, 2nd = +1) or candy bars.
  *   **Room:** Clear a "Junction Zone" (hallway preferred; otherwise, a screened corner). Zone must look identical regardless of visit count. Remove clocks/maps.

  ### Activity Flow
  **Teams:** Divide class into 6 teams of 4. Each team selects one "Driver" per round (rotate Drivers).
  **Payoffs:** Exit at Junction 1 (X) = 0 pts. Exit at Junction 2 (Y) = 4 pts. Continue at Y = 1 pt.
  **Goal:** Maximize team score over 3 rounds.

  1.  **Planning Phase:** Teams discuss and write a strategy on the Strategy Sheet: "At any junction, we Continue with probability $p$." They submit this privately.
  2.  **Junction Phase:** The Driver enters the Junction Zone blindfolded. TA removes blindfold. Driver sees only a card reading "JUNCTION."
      *   **Step A:** Driver writes subjective probability on Junction Slip: *"What % chance are you at the first junction (X)?"*
      *   **Step B:** Driver chooses EXIT or CONTINUE.
      *   **Step C:** If EXIT, round ends. TA reveals location (X or Y) and awards points. If CONTINUE, TA blindfolds Driver, shuffles them briefly (to erase kinesthetic cues), and returns them to a Junction desk for the next decision (if applicable).
  3.  **Data:** Collect all Slips. Tally scores on board.

  ### Timeline (75 Minutes)

  | Time | Segment | Action |
  | :--- | :--- | :--- |
  | 00–10 | **Briefing** | Form teams. Explain payoffs. **Withhold problem name.** |
  | 10–20 | **Planning** | Teams calculate optimal $p$. Submit Strategy Sheets. |
  | 20–50 | **Execution** | Rotate Drivers. 3 rounds per team. Collect Junction Slips. |
  | 50–60 | **Tally** | Post scores. Display anonymized $\alpha$ (belief) vs. Choice data. |
  | 60–75 | **Debrief** | Reveal "Absent-Minded Driver." Discuss tension. |

  ### Security & Leak Prevention
  *   **Kinesthetic Leaks:** Drivers must be blindfolded *before* moving between junctions. TA must vary the walk path slightly so step-counting fails.
  *   **Visual Leaks:** Junction Zone must be sterile. No windows, no distinct marks on desks. Use identical index cards.
  *   **Signaling:** TA wears neutral expression. No verbal feedback ("Good choice") allowed. Class observers must sit facing away from the Zone.
  *   **Fallback (No Hallway):** Use two identical desks in opposite corners. Driver closes eyes. TA guides them by the shoulder. Observers must remain seated.
  *   **Device Ban:** Collect phones before Planning Phase. No calculators during Junction Phase.

  ### Debrief Guide
  **1. The Data Reveal:**
  Plot the submitted plans ($p$) against the actual choices made at the junction. Highlight the **Subjective Probability Slips**.
  *   *Question:* "You planned $p=2/3$. But at the junction, many of you wrote $\alpha > 50\%$ (believing you're likely at X) yet chose EXIT. Why?"
  *   *Point:* The planning stage values the *path* (getting to Y). The junction stage values the *immediate odds*.

  **2. The Roommate's Objection ("Write a Note"):**
  A student will say: "This is silly. The driver should just write a note at Start."
  *   **Response:** "Agreed. If pre-commitment is possible, the problem vanishes. But suppose the note is forbidden? Or suppose the 'driver' is you tomorrow, and you can't bind your future self?"
  *   **The Bite:** If you can't commit, is the optimal plan ($p=2/3$) still rational to *hold* when you stand at the junction? The data shows your belief ($\alpha$) shifts based on your strategy. If you plan to Continue often, you're likely at Y. If you're likely at Y, you should Exit. But if you Exit, you shouldn't have Continued at X.
  *   **Takeaway:** This illustrates **dynamic inconsistency**. The agent at the start and the agent at the junction have conflicting optimal strategies despite having the same goals.

  **3. Terminology:**
  Reveal "Absent-Minded Driver Problem" (Piccione & Rubinstein, 1997). Define **Imperfect Recall** (forgetting past actions) vs. **Imperfect Information** (not knowing state). This problem requires both.

  ### Pitfalls & Limitations
  *   **Predictable Failure:** Students will treat junctions as independent coin flips ($50/50$). They will ignore how their strategy affects the probability of being at Y.
      *   *Recovery:* During debrief, ask: "If everyone always Continues, where are you most likely to be?" (Answer: Y). "So should you Exit?" (Answer: Yes). "But if you Exit, you wouldn't have reached Y." Let the contradiction hang.
  *   **Time Creep:** The Junction Phase takes longer than expected.
      *   *Recovery:* Cut to 2 rounds instead of 3. Data quality remains sufficient.
  *   **The "Realism" Gap:** You cannot simulate actual memory loss, only information isolation. Students know they *might* remember.
      *   *Verbal Supply:* Explicitly state: "In the theoretical problem, you literally cannot distinguish the moments. Here, you're trusting the protocol. Assume the amnesia is real."
  *   **Calculation Errors:** Students may botch the $p=2/3$ derivation.
      *   *Recovery:* Provide the expected value formula $4p - 3p^2$ on the board during debrief if no team finds it. Focus on the *conflict*, not the calculus.

  ### Final Note
  The activity succeeds not if they solve the math, but if they feel the unease of abandoning their own plan. That unease is the lesson.
