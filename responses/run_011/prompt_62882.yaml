      *   (3) Premise: Aseity requires authorship of all contingent truths. Missed Rebuttal: Ross could have distinguished between truths *about* God and truths *outside* God.
      *   (4) Premise: The three options are exhaustive. Missed Rebuttal: Nadia could have suggested a fourth (e.g., Simple Foreknowledge or Universalism).
