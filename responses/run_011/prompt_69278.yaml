      *   *Step (3) Nuance:* Step (3) says "X is better for every field." This assumes effect homogeneity. It's possible X is better on average in both regions but bad for specific soil types within regions. However, for the sake of the paradox, (3) is the standard resolution. The real break is (6).
      *   *Step (7) & (8):* These follow from (6). If (6) falls, (7) and (8) collapse.
      *   *The Infection:* If infection is caused by the variety, it lies on the causal path $Variety \rightarrow Infection \rightarrow Yield$. Conditioning on it estimates the *direct* effect (not through infection), not the *total* effect. If the goal is "which seed gives better yield," you want the total effect. Conditioning on infection hides the benefit/cost of the seed's resistance/susceptibility. This proves slicing isn't neutral.

  6.  **Structuring the Output:**
