      *   **The Infection Datum:** It acts as a "collider" or "mediator" test. Conditioning on it is *wrong* for total effect. This proves (6) is false because some slicings destroy information rather than reveal it.

  7.  **Final Polish:** Ensure the tone is analytical and respectful of the philosophical depth of the reading group's argument. Use standard causal inference terminology (confounder, mediator, collider, DAG) but explain them clearly. Emphasize that Simpson's Paradox is resolved by causal knowledge, not just more stratification.

