answer: |-
  The conference room smelled of ozone and stale coffee. Elias tapped his stylus against the tablet, the rhythmic *click-click* the only sound breaking the silence after Mara stopped speaking.

  "It's not about confusion, Elias," Mara said. She sat with her hands folded on the table; the subtle shimmer of her dermal interface caught the overhead lights. She was Modded, obviously. Everyone here was, except him. "It's about picturing. When the manual says, 'Every Standard must report for evaluation,' I know technically I am a Standard. I know the legal definition. But I don't *see* myself in that word. None of us do."

  Elias leaned forward, keeping his voice level. He had rehearsed this. "The term 'Standard' refers to the baseline human organism. You are a baseline organism with augmentations. The augmentation is incidental. The word describes the substrate, not the add-ons. If we change every instance to 'Baseline or Modified,' the manual becomes unreadable. It loses elegance. It becomes clumsy."

  "Clumsy is better than invisible," Mara said.

  "It's not invisible," Elias countered. "Context does the work. When a safety officer shouts, 'All Standards evacuate,' do you stand still because you have a neural link? No. You understand the inclusive sense immediately. The objection is hypersensitive. You're confusing the word with the world."

  Mara didn't blink. "I'm confusing nothing. I'm telling you what happens in my head when I hear it. But fine. You're the Lead Editor. Write the note."

  "I will," Elias said. "Usage Note 44-B. I'll explain the tradition. I'll explain the efficiency."

  "Efficiency for whom?" Mara asked, standing up. "See you at the review, Elias."

  When she left, the room felt larger, emptier. Klein, the Department Head, remained seated, scrolling through a feed on his wrist.

  "Good defense," Klein said, not looking up. "Traditionalist angle plays well with the board. They hate rewriting the legacy code. But we have a backlog."

  Klein slid a data chip across the table. "Usage Note 45-C. Term: 'Native.' Context: Corporate Residency Rights."

  Elias frowned. "Native? That's straightforward. Born in the sector."

  "Legal definition says otherwise," Klein said. "Anyone residing in the sector for more than five years qualifies for Native status benefits. But the word 'Native' implies birthright. We need a note explaining that 'Native' includes long-term residents. Same logic as 'Standard.' Context makes the inclusive sense obvious. Tradition dictates the term. Don't confuse the word with the world."

  Klein finally looked up. "Draft it by noon. I need to record the audio overlay this afternoon. You know the protocol—Lead Editor voices the guidance."

  Elias took the chip. "Noon. Sure."

  Back at his desk, Elias opened the drafting interface. He stared at the cursor. He began to type, mirroring the structure he'd just used in the conference room.

  *Usage Note 45-C: Native.*
  *The term 'Native' is used throughout this document to denote any resident with full tenure rights. While etymologically suggesting birth within the sector, usage has evolved to include any individual meeting the five-year residency requirement. Objections based on literal interpretation ignore the contextual clarity provided by the accompanying legal statutes. To replace 'Native' with 'Tenured Resident' in all instances would disrupt the historical continuity of the charter...*

  He stopped. He read the sentence: *...etymologically suggesting birth within the sector...*

  He deleted it. Typed: *...historically suggesting birth...*

  Deleted that too.

  With "Standard," the logic held because "Standard" was abstract. It was a technical baseline. You could argue that a Modified person was still a Standard human underneath the tech. It was a layer argument.

  But "Native"? There was no layer. You were either born here or you weren't. The five-year rule was a legal fiction, a bureaucratic overlap. If he wrote that "Native includes non-natives," he wasn't clarifying context; he was lying about meaning.

  He tried to summon the argument he'd given Mara. *Context makes the inclusive sense obvious.*

  He typed: *When a manager says, 'Native benefits apply,' the resident understands...*

  He stopped. Did they? Or did the resident hear "Native" and think, *This isn't for me, I'm from the Outer Ring,* until a lawyer told them otherwise?

  He tried to write the sentence about elegance. *To replace 'Native' with 'Qualified Resident' would be clumsy.*

  It wasn't clumsy. It was accurate.

  "Standard" felt defensible because he was the Standard. He was unmodified. The word fit him like a skin. When he argued for its inclusivity, he was arguing for a generosity he didn't have to pay for. He was granting permission for others to enter a room he already owned.

  With "Native," he was an outsider. He'd moved to the sector three years ago. He was a "Transplant." If the guide said "Native," he knew it didn't mean him, no matter what the footnote said.

  He looked at the clock. 11:45 AM.

  He couldn't write the note. If he wrote it, he'd be codifying a lie. If he didn't write it, he'd be insubordinate.

  He deleted the draft. He left the field blank. He flagged the file as *Pending Review* and sent it back to Klein with a generic error code: *Semantic Conflict.*

  He knew Klein would see through it. He knew there would be a meeting about it tomorrow. But for now, he had the afternoon.

  At 2:00 PM, his comms buzzed. *Recording Studio 4. Bring the script.*

  Elias walked to the studio. The soundproofing made the hallway feel like a vacuum. Inside, the booth was small, dominated by a microphone and a glass pane looking out into the control room. Klein was there, sitting in the engineer's chair, arms crossed.

  "Note 45-C came back flagged," Klein said over the intercom. "We'll discuss it later. Right now, we need the audio for Note 44-B. The 'Standard' guidance. The board wants the new manuals voiced by end of day."

  Elias stepped into the booth. He put on the headphones. He picked up the script. It was the text he'd defended this morning. The text explaining why "Standard" was inclusive. The text explaining why Mara's objection was hypersensitive.

  "Ready when you are," Klein said.

  Elias cleared his throat. The red light on the mic blinked on.

  "Usage Note 44-B," Elias read. His voice sounded flat, canned. "The term 'Standard' refers to the baseline human organism. Augmentations are incidental. The word describes the substrate, not the add-ons."

  He paused. He thought of Mara's hands, shimmering under the lights. He thought of the word "Native" sitting in the queue, impossible to fix.

  "Continue," Klein said.

  "When a safety officer shouts, 'All Standards evacuate,' the inclusive sense is understood immediately," Elias read. "Objections based on visual representation confuse the word with the world. Tradition dictates the term. Efficiency requires it."

  "Again," Klein said. "Take two. You rushed the second sentence."

  Elias adjusted the mic stand. His palms were sweating. He looked at the script. The words were black on white, static. But he had to push air through them. He had to make them true with his voice.

  "Usage Note 44-B," Elias said. "The term 'Standard' refers to the baseline human organism."

  He stumbled on "organism." He stopped.

  "Keep going," Klein said.

  "Augmentations are incidental," Elias said. He heard the hollowness in his own tone. He was saying that Mara was incidental. That her interface, her way of being, was a footnote to his baseline. He was saying it into a microphone that would broadcast it to every training terminal in the sector.

  "The word describes the substrate, not the add-ons."

  "Better," Klein said. "Next paragraph."

  Elias looked at the next line. *Context makes the inclusive sense obvious.*

  He knew now that it wasn't obvious. He knew it because he couldn't write the note for "Native." He knew that understanding a word isn't the same as being pictured by it. He knew that when he said "Standard," he pictured himself, and when Mara heard it, she pictured everyone but herself.

  "Elias?" Klein prompted.

  "Context makes the inclusive sense obvious," Elias said.

  He felt a tightness in his chest, a physical resistance to the sound. He wanted to cough. He wanted to throw the script against the glass. But the red light was still on. The deadline was still real. If he stopped, they'd find someone else. Someone who wouldn't hesitate. Someone who believed it.

  "Objections based on visual representation confuse the word with the world," Elias read.

  He closed his eyes. He couldn't fix "Standard" today. He couldn't fix "Native." The manual would go out. The audio would load. Mara would hear his voice telling her she was being hypersensitive.

  "Tradition dictates the term," Elias said. His voice cracked slightly on "Tradition."

  "Cut," Klein said. "One more time. From the top. We need it clean."

  Elias opened his eyes. He looked at the script. He took a breath. He leaned into the mic.

  "Usage Note 44-B," he said.
