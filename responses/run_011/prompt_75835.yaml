answer: |-
  You have identified a genuine crux in Plutarchan scholarship, and your hesitation regarding the two standard readings (evidential vs. expressive) is well-founded. The painter analogy is indeed doing work that neither of those readings fully captures.

  The step at which your reconstruction goes wrong is a category mistake: you are treating Plutarch's preface as a claim about **truth conditions** (which incident yields more accurate data?), whereas Plutarch is making a claim about **teleological relevance** (which incident yields the specific *kind* of knowledge proper to the genre of *bios*?).

  Here is the breakdown of why the analogy supports your "third reading," what the principle of concentration is, and how this resolves the contradiction regarding the battle narratives.

  ### 1. Why the Evidential and Expressive Readings Fail the Analogy

  **The Evidential Reading (Unguardedness):**
  You correctly note that this does not fit the painter analogy. A portrait sitter in antiquity (as now) knows they are being painted. They are posing. The "likeness" ($homoiotês$) is not achieved by catching the subject off-guard, but by capturing their *stable* appearance. If Plutarch's point were merely that small deeds are unguarded, the analogy would be of a spy or a hunter, not a portraitist. The portraitist seeks the *essential* look, not the *accidental* one.

  **The Expressive Reading (Holism):**
  This reading suggests the small incident contains the "whole person." But the painter analogy explicitly *rejects* holism regarding the body. The painter neglects the "rest of the limbs" ($ta loipa melê$). If the "whole person" were the goal, the painter would have to paint the body. Plutarch is arguing that the *identity* is not distributed evenly across the whole. The body is necessary for the person to exist, but it is not where the *likeness* resides.

  ### 2. The Third Reading: Synecdoche of Identity

  The analogy supports a **Synecdochic Reading**. The claim is not about where the *truth* is hidden, but where the *identity* is concentrated.

  In ancient physiognomic and artistic theory, the face (and specifically the eyes) is the locus of the *logos* and the *êthos*. The body is the vessel of action and fortune; the face is the seat of the self.
  *   **The Body (History):** Battles, sieges, and legislation are the "limbs." They are massive, visible, and impressive. But they are also shared. A victory depends on soldiers, weather, luck ($tychê$), and terrain. A general can be virtuous and lose; a villain can be lucky and win. The "body" of the action is ambiguous regarding the moral agent.
  *   **The Face (Life):** A jest, a remark, a private reaction. These are the "eyes." They are actions where the margin for external causality is minimized. In a jest, there are no subordinates to share the credit, no terrain to blame for failure. The action is almost entirely a product of the agent's disposition ($hexis$).

  **The Principle of Concentration:**
  The principle that makes likeness concentrated rather than distributed is **Moral Density** (or **Agency Salience**).
  Plutarch is arguing that moral character is not a gas that expands to fill the volume of the action. It is a substance that is denser in some actions than others.
  *   **High Volume / Low Density:** A battle involves thousands of men and variables. The "signal-to-noise" ratio regarding the General's specific virtue is low.
  *   **Low Volume / High Density:** A remark involves only the speaker and their disposition. The signal-to-noise ratio is high.

  The painter does not paint the eyes because they are "truer" than the hands; he paints them because they are the **locus of recognition**. Similarly, Plutarch does not choose the jest because the battle is "false," but because the jest is the locus of *moral recognition*.

  ### 3. Resolving the Contradiction (The Battles)

  You ask: *Does that principle give Plutarch any grounds for disparaging great deeds at all, given that the Lives are overwhelmingly composed of battles, sieges, and laws?*

  This is where the teleological correction matters. Plutarch is not **excluding** the body (battles); he is **subordinating** it to the face (character).

  If you look closely at the *Life of Alexander*, Plutarch *does* narrate the battles. However, notice *how* he narrates them compared to a historian like Arrian or Thucydides.
  *   **Historian:** Focuses on troop movements, terrain, strategy, outcome, political consequence.
  *   **Plutarch:** Focuses on Alexander's reaction to danger, his treatment of prisoners, his demeanor before the charge, his dreams the night before.

  Plutarch treats the battles *as if they were facial features*. He strips the "body" of the battle (the tactical minutiae) to get to the "face" of the battle (the moral expression of the agent within the event).

  He disparages not the deeds themselves, but the **historian's focus** on deeds *qua* deeds. To write "History" is to value the limb for its size. To write "Life" is to value the limb only insofar as it moves the face.

  Therefore, the preface is not a promise to omit battles, but a warning to the reader: *Do not judge my success by the completeness of my military record, but by the clarity of my ethical portrait.* If I include a battle, it is because Alexander's soul shone through it, not because the battle was strategically important.

  ### 4. Where Your Reconstruction Went Wrong

  You located the problem in the **epistemology of the sign** (how do we know the virtue?). You asked whether the trivial incident is a *better sign* (evidential) or a *more complete sign* (expressive).

  The error is assuming Plutarch is optimizing for **informational accuracy**. He is optimizing for **generic propriety**.

  The claim being made is: **The genre of *bios* requires a different object of knowledge than the genre of *historia*.**
  *   *Historia* knows the *praxis* (the deed).
  *   *Bios* knows the *prattôn* (the doer).

  The painter analogy licenses the claim that **likeness ($homoiotês$) is not a function of scale.** You can paint a giant body and miss the likeness; you can paint a small face and capture it.
  *   **Evidential Reading:** Assumes the small thing is *more truthful*.
  *   **Expressive Reading:** Assumes the small thing is *more comprehensive*.
  *   **Synecdochic Reading (Correct):** Assumes the small thing is *more specific to the agent*.

  ### Summary for your Dissertation

  You should argue that the methodological preface establishes a principle of **Ethical Synecdoche**.

  1.  **The Analogy:** The face/eyes are to the body what the private remark/jest is to the public achievement. Both are smaller, but both are the locus of *identity*.
  2.  **The Principle:** **Moral Agency Concentration.** Character is most legible where external causality (luck, numbers, necessity) is least operative.
  3.  **The Resolution:** Plutarch does not omit "mighty contests." He appropriates them. He narrates them not as historical events to be recorded, but as ethical contexts to be mined. The battle is the canvas; the virtue is the paint.

  Your interpretive wall dissolves if you stop asking "Which incident tells the truth?" and start asking "Which incident serves the *telos* of the *bios*?" The painter does not neglect the body because it is fake; he neglects it because it is irrelevant to the *likeness*. Plutarch does not neglect battles because they didn't happen; he neglects their *historical weight* because it is irrelevant to the *virtue*.
