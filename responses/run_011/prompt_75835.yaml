      *   *Name the Principle:* **Ethical Synecdoche** or **Moral Salience**. The principle is that character is not distributed evenly across actions; it is denser in actions where external causality (luck, numbers) is minimized.
      *   *Refine the Readings:* The "Evidential" reading is close but needs to be about *ambiguity* rather than "unguardedness." The "Expressive" reading is close but needs to be about *agency* rather than "wholeness."
      *   *Conclusion:* The preface defines the *genre* (Bioi vs. Historiai), not just the method.

  8.  **Self-Correction/Refinement during drafting:**
