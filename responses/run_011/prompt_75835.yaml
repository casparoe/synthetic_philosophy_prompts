      *   Similarly, in a life, battles are the "body" (external, shared with fortune/others), while private remarks/jests are the "face" (internal, specific to the agent).
      *   It's not that the battle *didn't happen* or *doesn't matter*. It's that the battle is ambiguous regarding *moral character* (a general can win by luck; a loser can be virtuous). The "small thing" is less ambiguous regarding *ethos*.
