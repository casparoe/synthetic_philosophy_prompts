answer: |-
  Here is the diagnosis.

  Your hypothesis is half-right. It is not *mostly* a verbal dispute, but it is a **category error** to treat it as a standard ontological dispute. You are fighting a substantive disagreement about **theoretical virtue** (specifically, explanatory depth vs. ontological parsimony) that has been mislabeled as a disagreement about **existence**.

  Here is the breakdown of why you are stuck, where the actual friction is, and what would count as progress.

  ### 1. The Verbal Layer: The Quantifier Ambiguity
  You are correct that there is a verbal component. When you say "There are numbers," and your friend says "There are no numbers," you are likely using different semantic rules for the existential quantifier.
  *   **You (Platonist):** Use a Quinean criterion. To be is to be the value of a bound variable in our best theory. If the theory quantifies over Hilbert spaces, Hilbert spaces exist.
  *   **He (Nominalist):** Uses a causal/spatiotemporal criterion. To be is to be a concrete particular that can enter into causal relations. Since numbers don't cause anything, they don't exist, even if the quantifier ranges over them.

  If this were the whole dispute, you could resolve it by agreeing to speak "Carnapian": *Within the framework of physics, numbers exist; within the framework of fundamental ontology, they do not.* But you didn't resolve it, because there is a residue. That residue is substantive.

  ### 2. The Substantive Layer: Explanatory Depth vs. Conservativeness
  This is where the real fight is. Your friend is leaning on Field's **Conservativeness Thesis**: Math is a conservative extension of nominalistic physics. It adds no new nominalistic theorems. Therefore, it's just a tool.

  Your counter is the **Explanatory Indispensability Argument (EIA)**: Math isn't just deriving theorems; it is structuring the explanation.

  **The Diagnosis:** The disagreement is about whether **structural unity** counts as a truth-tracking feature of reality or a cognitive convenience.
  *   **His claim:** A nominalized reconstruction preserves all *truths*. Therefore, the math was never "real," just efficient compression.
  *   **Your claim:** A nominalized reconstruction often destroys the *explanation*. If the only way to explain why the cicadas have 13/17-year cycles is via prime number theory, and the nominalist reconstruction just lists the physical states without the number theory, the nominalist has saved the phenomenon but lost the understanding.

  **Verdict:** This is substantive. It is a disagreement about what constitutes a "good" scientific theory. Is the goal to minimize ontology (his preference) or maximize explanatory unification (your preference)? These are competing theoretical virtues. There is no empirical test that decides which virtue is "correct," but the trade-off is real, not verbal.

  ### 3. The "Field" Trap
  Your friend is making a category mistake regarding Field's program. Field showed that Newtonian gravitation can be nominalized. He did **not** show that the nominalized version is *explanatorily equivalent*.
  *   In the Platonist version, the inverse-square law falls out of the geometry of the field.
  *   In the Nominalist version, you have to posit brute modal relations between spacetime regions that mimic the geometry.

  The nominalist pays for ontological parsimony with **ideological bloat**. They reduce the *objects* (no numbers) but increase the *primitives* (complex modal operators, spacetime relations).
  **Progress Point:** Stop arguing about whether math is dispensable. Argue about whether the nominalistic reconstruction is *more complex* than the mathematical one. If the nominalist version requires a more convoluted set of primitive predicates to do the same work, the Platonist wins on grounds of simplicity, even if the ontology is larger.

  ### 4. The QM Concession is the Weak Point
  Your friend's concession on Quantum Mechanics is where the "unfinished business" defense is weakest.
  *   In Classical Mechanics, you can treat math as describing relations between concrete things (fields, particles).
  *   In QM, the state space (Hilbert space) is not a container for particles; it *is* the reality. The "particles" are often derivative excitations of the field/state.
  *   **The Hard Limit:** There are results (e.g., by Malament, or discussions on the Gleason theorem) suggesting that you cannot recover the probabilistic structure of QM without the underlying Hilbert space structure. If the structure *is* the math, you cannot nominalize the math without eliminating the physics.

  **Progress Point:** Press him on **Structural Realism**. If he admits QM requires the structure, ask him if the structure exists independently of the concrete relata. If yes, he's a Platonist about structure. If no, he has to explain how the structure persists without the objects.

  ### 5. What Counts as Progress?
  You will not solve this by defining "existence." You will solve it by shifting the metric of victory.

  1.  **Stop asking "Do numbers exist?"** Start asking **"What is the cost of elimination?"**
      *   Demand a specific nominalistic reconstruction of a quantum phenomenon (e.g., entanglement entropy or Berry phases).
      *   Show that the nominalistic explanation is disunified compared to the mathematical one.
      *   If he admits the nominalistic explanation is uglier but insists it's "more true" because it has fewer objects, you have exposed his aesthetic preference for concrete ontology over explanatory unity.

  2.  **Distinguish "Truth" from "Ontological Commitment."**
      *   Agree that mathematical statements are true.
      *   Disagree on what makes them true.
      *   If he says "They are true because they are useful fictions," ask why the fictions are constrained so rigidly by physical reality. (The "No Miracles" argument).

  3.  **The "Trenchcoat" Admission.**
      *   Admit that part of this is aesthetic. Some philosophers prefer a world made of "stuff" (concreta). Others prefer a world made of "logic" (structura).
      *   Progress is realizing that **Nominalism is a demand for causal grounding, while Platonism is a demand for structural coherence.**
      *   If your friend values causal grounding above all, he will never accept your argument. If you value structural coherence, you will never accept his.

  ### Summary Diagnosis
  The dispute is **substantive**, but not in the way you think. It is not about the furniture of the universe; it is about the **criteria for theory choice**.
  *   **He** prioritizes **Ontological Parsimony** (fewer kinds of things).
  *   **You** prioritize **Explanatory Unification** (fewer brute facts).

  Field showed you can have Ontological Parsimony. You are arguing that the price is Explanatory Unification. Until you both agree on which virtue trumps the other, you will talk past each other. The "verbal" dispute about "there are" is just the proxy war for this deeper methodological clash.

  **Actionable Move:** Ask him: "If the nominalized version of QM is ten times longer and obscures the symmetries that lead to conservation laws, but eliminates abstract objects, is it actually a *better* theory? If yes, why? If no, then indispensability holds." That forces him off the "unfinished business" shield and onto the methodological turf where you actually disagree.
