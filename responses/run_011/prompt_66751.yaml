answer: |-
  The pattern is not philosophically coherent in the sense of adhering to a single normative theory like Rawlsianism or Libertarianism, but it is politically coherent under a specific morality of "deservingness" tied to labor participation and social status. It is not merely accidental; it is a systematic application of conditional reciprocity that prioritizes behavioral correction over need satisfaction.

  | design_feature | presupposes | rules_out | strict_or_merely_fitting | change_if_dropped |
  | :--- | :--- | :--- | :--- | :--- |
  | **Card blocks ATM withdrawals** (Pilot/SNAP) | **Soft Paternalism:** Recipients are prone to decision-making errors or temptation that cash would exacerbate; the state knows better than the poor how to allocate marginal dollars. | **Libertarian Agency:** The view that individuals are the sovereign judges of their own good and that cash neutrality is required for dignity. | **Merely Fitting:** Could also be fraud prevention, but combined with workshops, it signals behavioral correction. | **Unrestricted Cash:** Card allows cash-back or ATM access; spending is not monitored or restricted by merchant category. |
  | **Earnings clawback / Work threshold** (Pilot/EITC) | **Productivist Desert:** Income support is justified as a supplement to labor, not a replacement for it; need alone does not generate a claim on resources. | **Sufficientarianism:** The view that justice requires bringing everyone up to a capability threshold regardless of labor market status. | **Strict:** A benefit that phases out with earnings is logically incompatible with a "basic income" defined as a floor independent of work. | **Universal Floor:** Payment continues regardless of outside earnings (true UBI) or is granted as a lump sum without means testing. |
  | **Mandatory Financial Workshop** (Pilot) | **Deficit Theory of Poverty:** Poverty is partially caused by a lack of human capital or financial literacy, which the state must remedy before releasing funds. | **Structural Injustice:** The view that poverty is caused by external constraints (wages, housing costs) rather than internal competencies. | **Merely Fitting:** Could be administrative onboarding, but mandatory attendance implies a corrective purpose. | **Optional Support:** Workshops are available on request but not required for eligibility or continued payment. |
  | **Social Security universality** (Elderly) | **Deferred Wage Contract:** Benefits are earned rights based on past contribution, not current need; age signals exit from the labor force, removing "moral hazard." | **Pure Need-Based Justice:** If justice were solely about need, wealthy retirees would not receive checks while poor non-workers do not. | **Strict:** The logic of "earned entitlement" strictly requires ignoring current wealth for eligibility. | **Means-Tested Pension:** Checks would stop if the retiree has assets above a certain threshold (like SSI). |
  | **Asset Tests** (SNAP/Welfare) | **Liquidity Priority:** The state's obligation is to prevent immediate deprivation (hunger), not to enable wealth accumulation or long-term security. | **Capability Approach:** The view that justice requires enabling long-term agency, which requires the ability to save and invest. | **Merely Fitting:** Asset tests fit budget constraints, but philosophically they enforce a state of precarity. | **Asset Ignorance:** Eligibility is based on income flow only; savings accounts are not counted against the recipient. |

  ### Ranked Readings of the System

  1.  **Conditional Reciprocity (Desert-Based):** This is the strongest reading; it holds that public aid is a contract where the state provides resources only in exchange for specific behaviors (work, financial prudence, age-based exit), treating cash as a reward for compliance rather than a right of citizenship.
  2.  **Status-Based Paternalism:** This reading suggests trust is allocated by social category rather than individual capacity; the elderly are trusted with cash because they are "done" contributing, while the working-age poor are restricted because they are viewed as potential shirkers.
  3.  **Historical Path Dependence (Your Roommate's View):** This is the weakest philosophical reading but potentially the strongest historical one; it argues the inconsistencies are artifacts of which political coalitions passed which laws (e.g., AARP vs. Welfare Reform), with philosophy added later as rationalization.

  ### The "Just-So" Risk and UBI Critique

  My reconstruction risks being a "just-so story" if the specific design features were driven by vendor constraints or state preemption laws rather than normative choices. For example, if the prepaid card vendor simply did not support ATM withdrawals due to contract costs, or if state law mandated the earnings clawback for any local aid program, then attributing these to a theory of paternalism or productivism is reading philosophy into a spreadsheet. You would abandon the **Soft Paternalism** reading first if you found internal memos showing the ATM block was a cost-saving measure by the finance department rather than a policy directive from the program designers.

  Regarding UBI, the "no strings attached" branding often presupposes **Currency Neutrality**: the idea that $1 has the same value for everyone. This is ruled out by the **Capability Approach** (Sen/Nussbaum), which you hinted at with the wheelchair example. If Person A needs $600 for food and Person B needs $600 for food plus $400 for accessibility modifications, giving them both $600 cash equalizes income but exacerbates capability inequality. A strict UBI defender might reject your pilot's restrictions but still fail to address this; a true capability theorist might actually *support* earmarking (like housing vouchers) if that specific good is the bottleneck for freedom, suggesting that "cash is king" is its own form of dogma.
