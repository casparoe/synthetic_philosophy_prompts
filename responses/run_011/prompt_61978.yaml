  ### 1. Mark and Verdict

  **Total Mark: 12 / 25**

  *   **Band 1 (Hart/Retributivism/Examples): 8 / 8**
  *   **Band 2 (Difference between CR and Hart): 2 / 9**
  *   **Band 3 (Innocent-Persons Objection): 2 / 8**

  **Overall Verdict:** A technically flawless exposition of Hart in the first half collapses due to a critical misreading of the stipulated view in the second, undermining the entire comparative analysis.

  ***

  ### 2. Feedback to Student

  **General Comment:**
  Your exposition of Hart's framework in the first paragraph is excellent—clear, accurate, and well-illustrated. However, the second half of the script relies on a misreading of the stipulated definition of "Ceiling Retributivism" (CR). Because you alter the definition provided in the question to make your argument work, your conclusions about the difference between CR and Hart, and the vulnerability of CR, cannot stand.

  **Specific Feedback:**

  *   **What you got right (Band 1):**
      *   **Passage:** *"Hart's insight is that 'why have the practice at all' and 'who gets it, and how much' are different questions..."* through *"...Kant is the pure case, since desert is doing the work at both levels."*
      *   **Comment:** This is precise. You correctly identify the General Justifying Aim (utilitarian) vs. Distribution (retributive) distinction. Your characterization of Negative Retributivism (limit, not purpose) vs. Positive Retributivism (duty to punish) is accurate, and your use of Bentham and Kant as illustrations is appropriate. This section deserves full marks.

  *   **The Critical Error (Band 2 & 3):**
      *   **Passage:** *"Clause (i) is in fact stronger than it first appears... if the schedule maximum is set by desert, then for someone who deserves nothing the maximum is nothing..."* and *"...desert-caps are person relative — what the schedule permits is a function of what *this* person deserves."*
      *   **Problem:** You have changed the stipulated view. The question defines CR (i) as: *"maximum... fixed by what a **standard offender of that type** deserves."* It does **not** say "what *this* person deserves."
      *   **Correction:** A "standard offender" cap implies a fixed maximum for the offence (e.g., "The max for theft is 5 years"), regardless of the individual's specific desert. Under the stipulated view, an innocent person (who deserves 0) could still be punished up to the "standard offender" cap if social benefit required it. Your argument that "(i) rules out punishing the innocent all by itself" relies on an individualized desert cap which CR does not possess.
      *   **Impact:** This error costs you heavily in Band 2 (locating the difference) and Band 3 (the innocent objection).

  *   **Locating the Difference (Band 2):**
      *   **Passage:** *"it looks like a rival to Hart but I think it collapses into his view... Both... let expected benefit decide whether to punish."*
      *   **Problem:** This is incorrect. Hart's Distribution principle states liability is restricted to **offenders** (Retributive). CR Clause (ii) states liability is settled by **social benefit** (Utilitarian), subject only to the cap.
      *   **Correction:** The fundamental difference is the **condition of liability**. Hart: You must be guilty to be liable (Retributive constraint). CR: You need only be useful to be liable (Utilitarian constraint), provided the punishment doesn't exceed the standard cap. They do not collapse; they are structurally opposed on the question of *who* may be punished.

  *   **The Innocent-Persons Objection (Band 3):**
      *   **Passage:** *"So Ceiling Retributivism isn't vulnerable to the innocent-persons objection... neither is Hart..."*
      *   **Problem:** Because you misread Clause (i), you conclude CR blocks punishing the innocent. It does not. CR is highly vulnerable to this objection because Clause (ii) explicitly allows benefit to decide "whether to impose a penalty on a given person," provided the cap isn't breached.
      *   **Correction:** To answer the conditional ("If you think it is not vulnerable..."), you needed to find a mechanism *within the stipulated text* that blocks innocent punishment. Since Clause (ii) invites utilitarian liability, the correct answer is likely that CR **is** vulnerable, unless you can argue that "standard offender" implies a conceptual truth that only offenders can be standard offenders (a much harder argument than the one you made).

  **Advice for Revision:**
  When a question stipulates a definition (e.g., "Call it Ceiling Retributivism... (i)... (ii)"), you must treat that text as fixed data. You cannot interpret "standard offender" as "this person" even if it makes your argument stronger. Always check your argument against the exact wording of the stipulation before drawing conclusions.

  ***

  ### 3. Note to TA

  **Key Moves Determining the Mark:**

  1.  **The "Standard Offender" Misreading:** The student explicitly interprets Clause (i) ("standard offender of that type") as an individualized desert cap ("what *this* person deserves"). This is the pivot point for the entire second half of the script. It allows them to claim CR blocks innocent punishment (Band 3) and that CR collapses into Hart (Band 2). Since this contradicts the prompt's text, both sections fail despite the confident reasoning.
  2.  **The Liability Conflation:** The student claims Hart lets "expected benefit decide whether to punish" (Paragraph 3). This ignores Hart's Retributive Distribution principle (Liability = Guilt). This confirms they haven't grasped the structural difference required for Band 2.

  **Fast Read Risk:**
  **High.** The student's prose is authoritative and logically flowing. A marker reading quickly is likely to nod along at "desert caps are person relative" without checking back against the prompt's "standard offender" wording. The error is隐蔽 (hidden) in the interpretation of a specific phrase rather than a lack of philosophical knowledge. I recommend checking the script against the prompt's definition of CR (i) specifically when marking Band 2 and 3.
