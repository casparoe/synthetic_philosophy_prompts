answer: |-
  **Step One: Mapping the Space**

  Historians vary along three independent axes. **Selection** concerns why we study a topic: because it mattered to agents then, or because it matters to us now. **Description** concerns vocabulary: whether we impose categories unknown to agents (e.g. 'class', 'race') to clarify structures they could not see. **Evaluation** concerns moral verdicts: whether we judge agents by standards available to them or by our own. These axes come apart. One might select topics for modern relevance (present-centred Selection) but describe them using only contemporary terms (past-centred Description) and refuse moral judgement (past-centred Evaluation). A fourth axis, **Explanation**, concerning the use of hindsight to determine causation, is often conflated with Description. I exclude it here; using outcomes to explain causes is a methodological necessity distinct from the normative stakes of presentism. The instrument below tests the three normative axes separately. A historian may be radical on one and conservative on another; the profile reveals the tension, not a single label. Consequently, a single score is meaningless; only the vector across the three dimensions indicates methodological commitment. This mapping assumes that practice precedes theory; students often claim one position while practising another. The quiz forces concrete choices to reveal the actual practice.

  **Step Two: The Questions**

  1.  I am choosing a dissertation topic. I select the history of sanitation because modern cities face similar crises, rather than because sewage was a primary concern for Victorian engineers.
      *   A. I proceed; current utility justifies the focus.
      *   B. I hesitate; I should follow the archive's own priorities.
      *   C. I change topics; only what mattered then matters now.

  2.  I am writing about a 17th-century kingdom. The agents called it a 'dynasty', but it functioned like a modern bureaucracy.
      *   A. I call it a 'state' to clarify its function for my readers.
      *   B. I call it a 'dynasty' to respect their self-understanding.
      *   C. I use both terms interchangeably to show continuity.

  3.  I am analysing a slaveholder's diary. He expresses pride in his 'benevolence'.
      *   A. I record his view without comment; judgement is not my task.
      *   B. I describe his view but note it was morally wrong by any standard.
      *   C. I explain his view was consistent with his time, though I regret it.

  4.  I am narrating the rise of democracy. The story naturally leads to universal suffrage in 1928.
      *   A. I stop the narrative in 1900, before the outcome was certain.
      *   B. I continue to 1928 to show where the struggle led.
      *   C. I continue to the present to show its current fragility.

  5.  I am describing a medieval monk who had sexual relations with men. He did not identify as 'gay'.
      *   A. I describe him as 'gay' to connect him to modern communities.
      *   B. I describe his acts without assigning him an identity label.
      *   C. I insist he was 'heterosexual' because he married a woman.

  6.  I am assessing a colonial administrator who ordered a massacre. He believed it prevented a larger war.
      *   A. I condemn him; the loss of life is indefensible now.
      *   B. I acquit him; he acted on the best intelligence available then.
      *   C. I condemn him, but note he could not have known the long-term instability.

  7.  I am recovering voices from the archive. Many groups left no written records.
      *   A. I read against the grain to find them; justice requires their presence.
      *   B. I record their absence; silencing is part of the history.
      *   C. I use oral tradition to fill the gap, prioritising community memory.

  8.  I am describing an 18th-century economy. They had no concept of 'capitalism'.
      *   A. I use 'capitalism' to show the system's structural logic.
      *   B. I avoid 'capitalism'; it imposes a later theory on their practice.
      *   C. I use 'market society' as a neutral compromise term.

  9.  I am writing a conclusion about moral progress. The past seems crueler than the present.
      *   A. I argue we have improved; some values are objectively better.
      *   B. I argue values change; improvement is a misleading concept.
      *   C. I argue we have changed, but not necessarily for the better.

  10. I am asked why history matters. My research does not solve current policy problems.
      *   A. I say it matters because it tells the truth about the past.
      *   B. I say it matters because it helps us navigate the present.
      *   C. I say the distinction is false; truth serves navigation.

  **Step Three: The Scoring Key**

  Assign points to each option: **1 (Past-centred)**, **2 (Mixed/Intermediate)**, **3 (Present-centred)**. For Description, option B is often 1, A is 3. For Evaluation, A is 3 (judging), B is 1 (acquitting/contextualising). Calculate separate totals for Selection (Q1, 4, 7, 10), Description (Q2, 5, 8), and Evaluation (Q3, 6, 9).

  | Profile Name | Selection | Description | Evaluation | Characterisation |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Contextualist** | 1 | 1 | 1 | Past reconstructed in own terms; no judgement. |
  | **The Presentist** | 3 | 3 | 3 | History selects and judges by present standards. |
  | **The Two-Standards** | 2 | 1 | 3 | Describes in agents' vocabulary; evaluates in ours. |
  | **The Tempered Judge** | 2 | 2 | 2 | Moral judgement tempered by agent's knowledge. |
  | **The Dissolutionist** | 2 | 2 | 2 | Claims dispute is semantic; practice is identical. |
  | **The Structuralist** | 3 | 3 | 1 | Uses modern categories to explain, refuses moralise. |
  | **The Antiquarian** | 1 | 1 | 2 | Studies past for itself, but admits modern feelings. |

  *Unoccupied Profiles*
  1.  **Selection 3, Description 1, Evaluation 1 (The Modern Antiquarian):** Studies topics for modern relevance but refuses to use modern words or judge. *Diagnosis:* Incoherent. If the topic is chosen for modern relevance, refusing modern vocabulary undermines the utility.
  2.  **Selection 1, Description 3, Evaluation 3 (The Anachronistic Purist):** Studies topics only because they mattered then, but describes them with modern words and judges harshly. *Diagnosis:* Unattractive. It violates the agents' significance while imposing external verdicts.
  3.  **Selection 1, Description 3, Evaluation 1 (The Structuralist Purist):** Studies past for itself, uses modern categories, but refuses to judge. *Diagnosis:* Unexplored. Common in social science history, but rare in doctoral seminars focused on agency.

  *Indistinguishable Profiles*
  The **Tempered Judge** and the **Dissolutionist** both score 2-2-2. The quiz cannot separate the historian who genuinely seeks a middle ground from one who thinks the debate is merely verbal.
  *Eleventh Question:* "When colleagues argue about using the term 'genocide' for 19th-century events, do you think they are disagreeing about facts or definitions?" (Facts = Tempered Judge; Definitions = Dissolutionist).

  **Step Four: A Short Coda**

  Question 6 does the most discriminating work. It forces a choice between moral condemnation and epistemic limitation, revealing whether the student prioritises ethical clarity or historical empathy. It is the pivot point where most students reveal their unreflective default.

  Question 5 is most vulnerable to being answered for the wrong reason. A student might choose the modern label 'gay' not out of methodological presentism, but out of political solidarity with modern queer communities. Their choice tracks political commitment rather than historiographical theory, potentially skewing the Description axis score towards the present without a corresponding theoretical shift.
