answer: |-
  # WELFARE PRIORITISATION PROTOCOL (AQUACULTURE)
  **For:** Monthly Welfare & Operations Committee | **Timebox:** 120 Minutes | **Status:** Draft v1.0

  ### A. CHARTER OF PREMISES (Value Gates)
  *These premises are not facts. They are value commitments agreed by the Board. Disagreement here is ethical, not arithmetic.*
  1.  **Precautionary Principle:** Where sentience is scientifically contested (e.g., decapods), we act as if it exists, but discount the *weight* of that welfare by a **Confidence Factor (CF)**. [**Value Judgment**]
  2.  **Moral Weighting:** A salmon is not necessarily morally equivalent to a shrimp. We apply a **Species Weighting (SW)** to reflect capacity for suffering. [**Value Judgment**]
  3.  **Commitment Test:** Interventions that reduce profit to improve welfare prove commitment more than those that increase both. [**Value Judgment**]
  4.  **Verifiability:** An intervention cannot be funded if the welfare outcome cannot be empirically verified. [**Epistemic Constraint**]

  ---

  ### B. THE PROCEDURE (5 Steps)

  **Step 1: The "No-Regret" Filter**
  *   **Question:** Does this measure improve welfare *and* productivity (or is cost-neutral)? (e.g., water quality, handling training).
  *   **Pass:** Automatic approval within budget. Do not rank against other proposals.
  *   **Fail:** Proceed to Step 2.
  *   **Value Hand-off:** None. This is efficiency.

  **Step 2: Aggregate Welfare Impact (AWI) Calculation**
  *   **Formula:** `AWI = (Number of Animals) × (Severity of Suffering Alleviated 1–5) × (Confidence Factor) × (Species Weighting)`
  *   **Evidence Rule:**
      *   **Salmon:** CF = 1.0 (Sentience consolidated).
      *   **Shrimp:** CF = 0.5 (Contested *[Marked as Contested]*: LSE 2021 review suggests high potential, but physiological markers are debated).
      *   **Species Weighting (SW):** Committee must set this annually. (Suggestion: Salmon SW=1.0; Shrimp SW=0.2). **[Value Judgment]**
  *   **Fail Condition:** If `AWI` is lower than a competing proposal with similar cost, deprioritise.

  **Step 3: The Productivity Decoupling Test**
  *   **Question:** Does this intervention incur a net cost to production (revenue or yield)?
  *   **Yes (Welfare-Cost):** Flag as **High Priority**. This demonstrates genuine commitment (Premise 3).
  *   **No (Win-Win):** Flag as **Standard Priority**.
  *   **Measurement Warning:** Do not rely solely on mortality or FCR. These can be gamed (e.g., culling weak animals lowers mortality stats but worsens welfare). Prioritise behavioural indicators (agitation, avoidance) even if harder to measure. **[Epistemic Constraint]**

  **Step 4: Verifiability Check**
  *   **Question:** Do we have a validated indicator that the welfare outcome occurred?
  *   **Pass:** We can measure the result (e.g., fin damage scores, validated stun reflexes).
  *   **Fail:** We cannot measure the result (e.g., unconsciousness in shrimp without validated biomarkers). **[Hard Stop]**.
  *   **Value Hand-off:** If the committee chooses to fund a "Fail," they must record that they are funding *hope*, not *welfare*.

  **Step 5: Final Ranking**
  *   Rank by **AWI per £1,000 spent**.
  *   Apply a **Strategic Multiplier (1.5x)** for "Welfare-Cost" projects (from Step 3) to ensure the portfolio contains genuine sacrifice, not just efficiency gains.

  ---

  ### C. WORKED EXAMPLES (Current Proposals)

  | Proposal | Step 1: No-Regret? | Step 2: AWI Logic | Step 3: Cost to Output? | Step 4: Verifiable? | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(A) Shrimp Electrical Stunning** (£600k) | **No.** High CapEx, no yield gain. | **High Volume** (40M) × **Low CF** (0.5) × **Low SW**. *Contested:* Efficacy in high-salinity water is unproven. | **Neutral.** No revenue gain. | **FAIL.** No validated indicator of unconsciousness in shrimp. Immobilisation ≠ insensibility. | **REJECT.** Cannot verify welfare gain. Funding hope, not welfare. |
  | **(B) Salmon Density Reduction** (£400k/yr revenue loss) | **No.** Revenue loss. | **Med Volume** (1.6M) × **High CF** (1.0) × **High SW**. Severity of lice/fin damage is high (3–4). | **YES.** £400k revenue loss. Triggers **Strategic Multiplier**. | **PASS.** Fin damage and lice counts are robust, hard-to-game metrics. | **APPROVE.** High priority. Proves commitment (Premise 3). |
  | **(C) Shrimp Site Expansion** (Double Production) | **N/A** (Strategic Plan) | **Negative AWI.** Increases total animal count × suffering risk without mitigation. | **Gain.** Significant revenue increase. | **PASS.** Metrics exist, but baseline welfare risk increases. | **CONDITIONAL.** Approve only if offset by specific welfare capex (e.g., Proposal A *if* verified). |

  ---

  ### D. ETHICAL VARIATIONS & LIMITATIONS

  **1. Ethical Framework Sensitivity**
  *   **Killing as a Distinct Wrong:** If the committee views killing itself as the primary harm, **Proposal A** (Harvest method) becomes the absolute priority, overriding Step 4 (Verifiability) because the *intent* is to reduce the wrong of killing. **Proposal B** (Density) drops in priority as it does not prevent killing.
  *   **Life Worth Living:** If the view is that the animal's life must be net-positive, **Proposal C** (Expansion) is impermissible unless we can guarantee a net-positive life. **Proposal B** supports a "better life" view. **Proposal A** is neutral (only affects the end).

  **2. What This Procedure Cannot Do**
  *   It cannot resolve the scientific dispute over crustacean sentience; it only manages the financial risk of that uncertainty.
  *   It cannot justify "Welfare-Cost" interventions to shareholders without the Board explicitly accepting Premise 3 (that sacrifice is required for credibility).
  *   It creates a false precision in the AWI calculation. The numbers are ranking tools, not moral truths.

  **3. Candour on Judgment Calls**
  *   **Step 2 (Species Weighting):** This is pure ethics wearing the clothes of arithmetic. There is no scientific formula to compare a salmon's pain to a shrimp's.
  *   **Step 3 (Strategic Multiplier):** This artificially inflates costly projects to ensure the portfolio isn't just "efficiency in disguise."

  ---

  ### E. CONFIDENCE STATEMENT

  I am **moderately confident** in the procedural structure (Steps 1–5) as a decision-making tool for a time-constrained committee. It successfully isolates value judgments from factual claims. I am **least confident** in the **Confidence Factor (CF)** and **Species Weighting (SW)** assigned to shrimp in Step 2. I have assigned a CF of 0.5 and a low SW based on the current lack of consensus regarding nociception versus pain experience in *Litopenaeus vannamei*. **What would change my mind:** Peer-reviewed, replicated neurophysiological evidence demonstrating central processing of noxious stimuli in decapods comparable to vertebrates, or a validated behavioural assay for unconsciousness post-stun. Until then, Proposal A remains ethically hazardous to fund.
