      *   *Nuance on "Behaviorism":* It's not methodological behaviorism (denying inner states). It's a *moral* bracketing. The inner state is deemed morally inert if it doesn't impact the future self. This is closer to **Locke's Memory Theory of Personal Identity** applied to ethics.
      *   *Nuance on Infants:* We treat infants based on *proxy consent* and *best interest*. Best interest includes minimizing suffering *in the moment* because they cannot conceptualize the future. Adults conceptualize the future, so we minimize *future* impact.
      *   *The "Twilight" vs. General:* Twilight (MAC) often leaves some awareness. General aims for unconsciousness. The user had twilight/local. The ethical framework shifts slightly based on the *intent*.
      *   *Physiological Cost:* Overdosing propofol causes hypotension. In elderly (cataracts), this is stroke risk. So "taking other minds seriously" has a body count. This is the crucial trade-off.

