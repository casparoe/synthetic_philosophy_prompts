          *   *Coherent Theory:* A **Hybrid Account**. Moral status depends on *capacity for narrative selfhood*. If you have a narrative self, protect the narrative (memory). If you only have a sentient self, protect the sentience (physiological signs).
      *   **Requirement vs. Comfort (Underdetermination):**
          *   *Required:* Patient safety (physiological stability) and Legal/ethical consent (no battery).
