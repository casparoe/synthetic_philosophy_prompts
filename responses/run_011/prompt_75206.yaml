          *   *Strictly:* The practice doesn't *need* to claim the pain didn't happen. It needs to claim the patient *agreed* to the risk of pain in exchange for amnesia.
      *   **The Problem of Other Minds (Tuesday Morning):**
          *   If we assume consciousness exists without report (Realism about Qualia):
