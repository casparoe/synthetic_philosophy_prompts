  *(Self-Correction during drafting)*: I need to be careful not to say anesthesia *denies* consciousness. They know consciousness exists. They just bracket it. The user's suspicion of behaviorism is astute but technically it's more about *moral weight* than *existence*. I should clarify that distinction.

  *(Refining the Parfit citation)*: It is indeed *Reasons and Persons*, Part III, "Personal Identity." Specifically, the discussion on "The Asymmetry of Concern."

  *(Refining the "Theory of Mind")*: It's not just Locke. It's a **Psychological Continuity Theory of Moral Harm**. Harm requires a subject to bear it. If the psychological link is severed, the subject who suffered and the subject who pays the cost are different enough that the cost is negligible.

  *(Refining the Infant comparison)*: Infants *do* form memories, just not explicit autobiographical ones. But they have *implicit* memory (trauma response). So treating their pain prevents future behavioral issues. Adults with amnesia prevent *explicit* trauma. The mechanism is similar (preventing future negative valence), but the justification differs (autonomy vs. welfare).

