  This is a fascinating curatorial problem because it exposes the friction between archaeological typologies (what the data says) and public humanities ethics (what the narrative does). Dr. Brenner is operating with a set of heuristics that are consistent in their *outcomes* but inconsistent in their *stated principles*. The slogan ("grandchildren") is clearly a public-facing simplification that her actual rubric violates in at least two major cases (LBA, Maya).

  Here is the analysis of her decision matrix, the prediction for the Ancestral Puebloan entry, and the strategic advice for your team.

  ### 1. Candidate Criteria Derived from the Eight Verdicts

  To find a rule that fits all eight cases, we must look for necessary and sufficient conditions. There are three competing criteria that explain most of her rulings, but each strains against specific entries.

  **Criterion A: Institutional/Structural Continuity**
  *   **Definition:** A society is "Transformed" if its core governing, religious, or legal institutions are inherited by a successor group, even if the political entity changes. It is "Collapse" if the specific institutional order vanishes and is not replaced by a functional equivalent for a significant period.
  *   **Explains:** *Western Rome* (Law/Church inherited), *Angkor* (Court moved), *Late Bronze Age* (Palatial order died, nothing comparable for centuries), *Maya* (Dynastic courts dissolved).
  *   **Strains:** *Indus Valley* and *Cahokia*. In both cases, the "institutions" (urban planning, writing, mound building) vanished entirely. By this metric, they should be Collapse. Brenner saves them by shifting the definition of "institution" from *State* to *Culture* (village life, Mississippian practices).
  *   **The Indus/LBA Tension:** Both lost writing and central places. Brenner distinguishes them by **Complexity Trajectory**. LBA went from High Complexity to Low Complexity with a "Dark Age" gap (Collapse). Indus went from High Complexity to Low Complexity but she posits a seamless cultural substrate ("practices resurface") without a "Dark Age" of cultural loss (Transformation).

  **Criterion B: Regional Demographic Retention**
  *   **Definition:** A society is "Transformed" if the population remains in the geographic region defined by the exhibit case, even if dispersed. It is "Collapse" if the region is depopulated or the population falls below a threshold of viability.
  *   **Explains:** *Rapa Nui* (Population held), *Angkor* (Region stayed populous), *Cahokia* (Life continued across the region), *Indus* (Population moved to countryside).
  *   **Strains:** *Late Bronze Age* (She admits settlements dropped sharply), *Maya* (Population falls heavily), *Greenland* (Wholly given up).
  *   **The Cahokia/Greenland Tension:** Both regions were largely given up. Brenner distinguishes them by **Identifiable Descendant Polities**. Greenland Norse left no distinct ethnic/political descendants. Cahokians became specific, named modern nations.

  **Criterion C: The "State vs. People" Distinction (The Strongest Fit)**
  *   **Definition:** Brenner applies different standards based on the *type* of society.
      *   For **State/Imperial Societies** (LBA, Maya, Rome, Angkor, Indus Cities): The verdict tracks the **Political Order**. If the State apparatus falls, it is Collapse (unless inherited, like Rome/Angkor). *Exception:* Indus is treated as a "People" case despite the cities, likely due to lack of evidence for a rigid state.
      *   For **Non-State/Indigenous Societies** (Cahokia, Rapa Nui, Greenland, Ancestral Pueblo): The verdict tracks **Biological/Cultural Extinction**. If the people survive as a distinct cultural group, it is Transformation. If they vanish or assimilate completely, it is Collapse.
  *   **Explains:** *Greenland* (People vanished = Collapse), *Cahokia* (People survived = Transformation), *Rapa Nui* (People survived = Transformation). It also explains why *Maya* and *LBA* are Collapse despite having biological descendants: they are coded as "States" where the *Order* is the subject, not the *Ethnos*.
  *   **Strains:** *Indus Valley*. It is a State-level society (cities/writing) but treated like a Non-State society (People/Village continuity). This suggests Brenner treats "Writing" as a fragile technology, not a definition of society, unless it is part of a continuous literary tradition (like LBA Greek vs. later Greek).

  ### 2. Application to the Ancestral Puebloan Section

  The Ancestral Puebloan case sits precisely on the fault line between Criterion B (Regional Depopulation) and Criterion C (Descendant Continuity).

  *   **Argument for Collapse:** The "Chacoan great-house system" is the defined subject. That system ended. The Mesa Verde region was "near-total abandonment." This matches the *Greenland* (abandonment) and *LBA* (loss of complexity) profiles. If the exhibit case is "The Chacoan System," it collapsed.
  *   **Argument for Transformation:** The "Ancestral Puebloans" are the defined subject. They migrated to the Rio Grande and Hopi/Zuni mesas. Descendant communities are active and politically organized. This matches the *Cahokia* profile perfectly.
  *   **Prediction based on Criteria:**
      *   If Brenner follows **Criterion A (Institutions)**: **Collapse.** (Great houses/kivas not carried forward).
      *   If Brenner follows **Criterion B (Region)**: **Collapse.** (Region emptied, unlike Cahokia).
      *   If Brenner follows **Criterion C (State vs. People)**: **Transformation.** (This is a non-state indigenous society with living descendants).

  **The Deciding Factor:** Brenner's treatment of *Cahokia*. Cahokia was also a regional center that was emptied ("The great center... emptied"). The surrounding region continued, but the *center* died. In the Ancestral Pueblo case, the *region* died, but the *people* continued. However, given the political weight of the descendant letters and her "Grandchildren" slogan, Criterion C is her ethical default for Indigenous North American cases. She will likely prioritize the *survival of the Pueblo peoples* over the *abandonment of the Mesa Verde*.

  ### 3. Best Guess at Her Ruling

  **Prediction:** **Transformation.**

  **Reasoning:**
  While the "Greenland" precedent (walking away = collapse) is your strongest logical point, the "Cahokia" precedent (descendant nations = transformation) is her strongest *curatorial* point. Brenner is distinguishing between **Extinction** (Greenland) and **Migration** (Cahokia/Ancestral Pueblo).

  The LBA and Maya cases are "Collapse" because the *Political Order* is the protagonist of those stories. In the Southwest, Cahokia, and Indus cases, the *People/Culture* is the protagonist. Since the Ancestral Puebloans did not go extinct, but rather reorganized into the historic Pueblos, she will rule Transformation to maintain consistency with Cahokia and to honor the descendant community letters (which align with her "Grandchildren" slogan).

  **Confidence:** **75%.**
  The 25% uncertainty lies in the "Regional Emptying." If she defines the case strictly as "The Mesa Verde Region" rather than "The Ancestral Puebloans," the emptiness of the land might force a "Collapse" verdict to distinguish it from Cahokia (where the region remained populated). However, given the trend toward decolonizing narratives in regional museums, "Transformation" is the safer institutional bet.

  ### 4. Reserve Entries for Discrimination

  To test these criteria, you need a case that separates **Regional Depopulation** from **Cultural Continuity**.

  *   **Teotihuacan:** (City abandoned, population dispersed, but central Mexican culture continued). Good, but might be too similar to Cahokia.
  *   **Western Zhou:** (Capital moved, Dynasty continued). Too clear a Transformation.
  *   **Tiwanaku:** (Center abandoned, Aymara people continued). Very similar to Ancestral Pueblo.
  *   **Great Zimbabwe:** **This is the best discriminator.**

  **Why Great Zimbabwe?**
  *   **Feature:** Stone monumental architecture abandoned (like Chaco/Mesa Verde).
  *   **Region:** The immediate area was largely depopulated (like Mesa Verde/Greenland).
  *   **People:** The Shona people remained in the broader region and claim direct descent (like Ancestral Pueblo/Cahokia).
  *   **Discrimination:**
      *   If Brenner rules **Collapse**: She prioritizes **Monument/Region** over People. (Bad news for Ancestral Pueblo).
      *   If Brenner rules **Transformation**: She prioritizes **Descendant Continuity** over Regional Emptying. (Good news for Ancestral Pueblo).
      *   *Specific Feature:* The **Shona oral traditions** linking directly to the builders. If she accepts oral history as continuity (Indus/Cahokia), it's Transformation. If she requires archaeological continuity of settlement (LBA/Greenland), it's Collapse.

  ### 5. Drafting Advice and Underlying Principles

  **Drafting for Consistency:**
  Do not write "The Chacoan Society Collapsed." Do not write "The People Transformed." Split the subject.
  *   *Suggested Phrasing:* "The Chacoan **system** ended; the Pueblo **world** reorganized."
  *   *Wall Text Strategy:* Acknowledge the "Collapse" of the *infrastructure* (great houses, roads) to satisfy the archaeological record (aligning with LBA/Maya), but frame the *human response* as "Migration and Continuity" (aligning with Cahokia/Indus).
  *   *The Verdict:* If forced to choose one word for the section header, choose **Transformation**, but define it in the text as "Dispersal."

  **The Principle at Stake:**
  If the record does not decide the case, choosing "Collapse" adopts the principle of **Place-Bound Definition** (a society is defined by its relationship to a specific landscape). Choosing "Transformation" adopts the principle of **Kinship-Bound Definition** (a society is defined by its lineage and practices, regardless of location).
  *   *Recommendation:* Given the descendant letters, your panel should adopt **Kinship-Bound Definition**. It is ethically more robust and consistent with the Cahokia/Indus rulings.

  ### 6. Two Variables and the Third Word

  **Is she tracking two variables?**
  Yes. She is tracking **Structural Continuity** (Institutions/Monuments) and **Demographic Continuity** (People/Biology).
  *   **Collapse:** Structural Failure + (Demographic Decline OR Extinction).
  *   **Transformation:** Structural Change + Demographic Survival.
  *   **The Conflict:** She conflates them in her slogan. "Grandchildren" (Demographic) is not enough for LBA/Maya (Structural failure overrides it). But "Grandchildren" *is* enough for Cahokia/Indus (Structural failure is ignored).

  **Ought there to be a third word?**
  Yes. The binary forces a false choice between "Catastrophe" and "Success."
  *   **Suggested Word:** **"Dispersal"** or **"Reconfiguration."**
  *   **Why:** "Dispersal" accurately describes the Ancestral Pueblo, Cahokia, and Indus cases without the normative weight of "Collapse" (failure) or the potential inaccuracy of "Transformation" (which implies the *same* thing changed, rather than parts of it moving).
  *   **Curatorial Utility:** It allows Brenner to say: "The Order Collapsed (LBA), The Society Transformed (Rome), The Population Dispersed (Ancestral Pueblo)."

  ***

  ### Finally: Did the Southwest "Really" Collapse?

  You asked for my view last. As a philosopher looking at the archaeology: **No, it did not collapse; it migrated.**

  "Collapse" implies a loss of complexity that is involuntary and terminal. The Ancestral Puebloans did not lose their complexity; they *transported* it. The kiva, the clan system, the dry-farming techniques, and the cosmology were not left in the Mesa Verde; they were packed up and installed in the Hopi mesas and the Rio Grande valleys. The "Chacoan System" was a specific adaptation to a specific demographic pressure that became untenable. Abandoning an untenable adaptation is not collapse; it is rational strategic retreat.

  To call it "Collapse" is to privilege the *stones* (which were left behind) over the *people* (who went on to build the modern Pueblos). Since a society is made of people, not masonry, the society survived. The *place* collapsed; the *people* transformed. Given your curator's own "Grandchildren" rule, she should agree.
