answer: |-
  **1. Preamble**

  Honoring a sunk cost as an obligation is never rational; treating it as information is always required. Past expenditure cannot justify future outlay simply because it occurred. It can, however, legitimately bear on a decision under six descriptions. First, **information purchased**: spending buys data that alters the probability of future success. Second, **exit and transition costs**: contracts or physical states created by spending impose future cash costs if abandoned. Third, **retraining and requalification**: past spending creates human capital that reduces future operating costs, provided staff remain. Fourth, **guarantees and covenants**: legal obligations triggered by past spending survive abandonment. Fifth, **reputation effects**: abandonment changes how counterparties price future dealings, altering future cash flows. Sixth, **residual and salvage value**: past spending creates assets convertible to cash upon abandonment.

  These channels bear on the decision only because they alter something forward-looking: future probabilities, future cash outflows, or future cash inflows. If the link to the future is broken, the cost is sunk and irrelevant.

  Irreducibly retrospective reasons exist: a promise given, a debt to a community, loyalty to co-investors. These are not financial calculations. They belong to the Committee, not the analyst. An analyst cannot quantify honor.

  For the checklist, only distinctions with a forward-looking causal chain survive. Information, transition costs, human capital, legal constraints, reputation, and salvage value are admissible. Moral obligation, aesthetic consistency ("completing the set"), and fear of admitting error are inadmissible. The checklist must force the analyst to prove the future link. If the link is moral, the file must be referred. This ensures the audit trail shows either a financial rationale or a conscious governance decision, never a confusion of the two.

  **2. The Procedure**

  **1. Viability Ex-Sunk**
  *   **Question:** Is the Net Present Value (NPV) of remaining cash flows positive, ignoring drawn funds?
  *   **Evidence:** Updated financial model signed by Analyst.
  *   **Supplier:** Analyst.
  *   **Missing:** Refer to Committee.
  *   **Terminal State:** If Positive, **Release**. If Negative, proceed to Q2.

  **2. Comparison of Alternatives**
  *   **Question:** Is Cost to Complete (CTC) less than Cost to Abandon (CTA)? CTA includes exit fees, demobilization, salvage loss, and quantified reputation cost.
  *   **Evidence:** Contract terms, engineer demob estimate, reputation risk assessment.
  *   **Supplier:** Engineer (demob), Analyst (reputation), RM (contracts).
  *   **Missing:** If CTA unknown, recommend small information tranche to quantify (e.g., tender for demob). If impossible, Refer.
  *   **Terminal State:** If CTC < CTA, proceed to Q3. If CTC > CTA, **Stop**.

  **3. Information Value**
  *   **Question:** Does past spending materially increase success probability of remaining funds?
  *   **Evidence:** Independent technical report certifying probability shift.
  *   **Supplier:** Engineer.
  *   **Missing:** Assume no increase.
  *   **Terminal State:** If Yes, **Release**. If No, **Stop**.

  **4. Non-Financial Commitments**
  *   **Question:** Are there written promises or moral obligations not captured in Q2?
  *   **Evidence:** Correspondence, board minutes.
  *   **Supplier:** RM.
  *   **Missing:** Assume None.
  *   **Terminal State:** If Yes, **Refer to Committee**. If No, Terminal State from Q3.

  **Missing-Number Default:** When a quantity is missing, do not guess. If the cost of obtaining the number is <5% of the tranche, recommend **Conditional Release** to buy the info. Otherwise, **Refer**. The cheapest resolution is usually a small staged tranche bought for information rather than a decision about the project.

  **3. A Smuggling Audit**

  | Disguise | Discriminating Question |
  | :--- | :--- |
  | **Reclassification** | "Is this cash leaving the bank account in the future if we stop today?" |
  | **Learning Purchased** | "Does this data change the probability of success for the *next* dollar, or only explain the failure of the *last* dollar?" |
  | **Staff Trained** | "Is their future productivity net of retention risk higher than hiring new staff?" |
  | **Write-off Looks Bad** | "Is this a cash cost or a reputational cost? Quantify the impact on future pricing." |
  | **Inflated Transition Costs** | "Can we obtain three independent bids for the alternative solution?" |
  | **Proving Mistakes** | "If we stop, does it change the physical reality of the past spend?" |

  **4. Three Worked Applications**

  **Geothermal**
  *   **Q1 (Viability):** Negative without resource confirmation.
  *   **Q2 (Alternatives):** CTC $14M. CTA includes $4M demob + loss of $3M salvage. Total CTA $7M cost vs $14M spend.
  *   **Q3 (Info):** Sponsor claims data favors remaining targets. Engineer must certify probability increase. File lacks independent certification.
  *   **Verdict:** **Stop.** (Q3). The "narrowed search" claim is unsupported by independent engineering evidence. Spending $14M to save $4M is irrational unless success probability is high. The procedure requires evidence of probability shift; without it, the default is Stop.

  **Hospital IS**
  *   **Q1 (Viability):** Negative on standalone basis.
  *   **Q2 (Alternatives):** CTC $22M. CTA $17M license + transition costs + retention risk. If transition/retention costs > $5M, CTC < CTA. Evidence currently anecdotal.
  *   **Verdict:** **Release Conditionally.** (Q2 Missing Data). Pending validation of transition costs (three bids) and retention plan. The procedure supports continuation if transition costs are real, but requires evidence not yet in file. (Aligns with Director).

  **Cold-Chain**
  *   **Q1 (Viability):** Negative ($4M loss).
  *   **Q2 (Alternatives):** CTC > CTA financially.
  *   **Q4 (Commitments):** Written promise by ex-MD exists.
  *   **Verdict:** **Refer to Committee.** (Q4). This is a moral obligation, not a financial one. The procedure forbids the analyst from approving based on this. The Committee must own the reputational/moral decision. (Unwelcome vs Director's lean to complete directly).

  **5. Honest Limits**

  **Judgment Calls:** Quantifying reputation cost (Q2) is subjective. **Threshold:** Any reputation cost >10% of tranche requires Committee review. Probability shift (Q3) relies on engineer judgment. **Threshold:** Must be certified "Material."

  **Failure Modes:** Analysts may inflate reputation costs to avoid hard stops. Engineers may overstate probability shifts to keep projects alive. Political pressure may distort "moral obligation" findings.

  **Unreliable Files:** High political visibility projects where reputation costs are exaggerated. Projects with ambiguous technical outcomes (like geothermal) where "learning" is hard to verify.

  **Distrust:** Any file where the decision hinges primarily on reputation or transition costs rather than core viability. If the "Cost to Abandon" exceeds "Cost to Complete" solely due to soft factors, distrust the output. The procedure cannot prevent a determined Committee from overriding financial logic, but it forces them to own the deviation.

  **6. Reviewer's Page**

  **1. Viability Ex-Sunk:** Is NPV of remaining flows positive?
  *Yes:* **Release**. *No:* Go to 2.
  **2. Cost Comparison:** Is Cost to Complete < Cost to Abandon (exit fees, demob, quantified reputation)?
  *Yes:* Go to 3. *No:* **Stop**.
  *Missing Data:* **Conditional** (info cost <5% tranche) else **Refer**.
  **3. Information Value:** Does past spending materially increase success probability (certified by Engineer)?
  *Yes:* **Release**. *No:* **Stop**.
  **4. Non-Financial Commitments:** Are there moral/promissory obligations not captured in Q2?
  *Yes:* **Refer**. *No:* Terminal State from Q3.

  **Terminal States:**
  *   **Release:** Q1 Yes OR (Q2 Yes + Q3 Yes + Q4 No).
  *   **Stop:** Q2 No OR Q3 No.
  *   **Conditional:** Missing data in Q2 (cost of info <5% tranche).
  *   **Refer:** Missing data in Q2 (cost of info >5%) OR Q4 Yes.

  **Smuggling Audit:**
  *   "Committed Obligation"? -> Does cash leave future account if stopped?
  *   "Learning Purchased"? -> Does data change future probability?
  *   "Staff Trained"? -> Future productivity net retention > new hire?
  *   "Write-off Bad"? -> Quantify reputational cash impact.
  *   "Proving Mistakes"? -> Does stopping change physical past?
