answer: |-
  To resolve the inconsistencies in your verdicts without collapsing into triviality or begging the question against naturalism, you need a principle that distinguishes between *internal* normativity (relative to a framework) and *categorical* normativity (binding independent of framework). I propose the **Principle of Normative Containment**. It consists of three clauses:

  1.  **Framework Relativity:** An inference from descriptive premises to a normative conclusion is valid only if the normative force of the conclusion is explicitly conditional upon a framework (desire, practice, or kind) established in the premises. (Motivated by 1 and 6).
  2.  **Categorical Bar:** Inferences are invalid if the conclusion asserts categorical normative force that exceeds the framework conditions provided by the premises. (Motivated by 2, 5, and 8).
  3.  **Substantive Requirement:** Inferences where the normative term is syntactically present but semantically inert do not count as substantive crossings of the is-ought gap. (Motivated by 3 and 4).

  This principle accounts for your acceptance of 1 and 6: in both, the 'ought' is contained within a conditional framework (avoiding cholera, playing chess). It explains your rejection of 2: the desire framework is missing. It handles 3 and 4 by dismissing them as syntactic tricks that fail the Substantive Requirement.

  The principle forces a reckoning with your primary tension: the split between 5 (Promise) and 6 (Chess). You note they have "exactly the same shape," yet you accept 6 and reject 5. Under Normative Containment, these verdicts are inconsistent. Both are institutional facts generating internal obligations. In 6, the ought is real *given that she is playing*. In 5, the obligation is real *given that he promised*. Your rejection of 5 rests on the claim that it "fails to compel an audience that already treats being under an obligation as a reason." But this is equally true of 6: the chess ought fails to compel someone who does not treat chess rules as reasons. If you accept 6 as legitimate because the participant entered the practice, you must accept 5 as legitimate *qua* institutional inference. The error in 5 is not the inference from act to obligation, but the potential equivocation from institutional obligation to moral obligation. To save your set, you must treat 5 as valid internally, while denying it yields a *moral* ought without further premises.

  This leads to the second tension: 7 (Heart) vs. 8 (Human Nature). You accept 7 as attributive goodness but reject 8 despite its similar shape. Normative Containment saves this distinction via the Categorical Bar. In 7, "bad" is an evaluative judgment relative to the biological kind; it does not necessarily imply a prescriptive 'ought' for the heart to change. In 8, the conclusion "ought to live in communities" is prescriptive. While Foot-style naturalists argue functional evaluation entails prescription, your principle blocks this unless the agent's commitment to flourishing is premised. You accept 7 because it is evaluative; you reject 8 because it leaps to prescription without establishing the agent's endorsement of the natural standard. The cost here is rejecting strong Aristotelian naturalism that derives duty directly from nature without a volitional bridge.

  Regarding your new cases:
  First, *from coercive formation to contract voidness*. This inference is **legitimate** under Clause 1. The 'ought' here is legal-institutional, conditional on the legal framework which defines coercion as a voiding condition. It is structurally identical to your chess case (6). The normativity is contained within the legal practice.
  Second, *from causing injury for no reason to acting wrongly*. This inference is **illegitimate** under Clause 2, unless "wrongly" is defined purely descriptively. A Foot-style naturalist argues "injury" carries normative weight, but under Normative Containment, "wrongly" implies a moral standard not contained in the descriptive fact of injury alone. Unless the premise includes a commitment to a moral norm prohibiting injury, the inference crosses the categorical bar. This preserves the is-ought gap against naturalistic reductionism while allowing internal critiques.

  On case 9 (Pleasure/Good), you are correct to suspect it belongs elsewhere. This is not primarily an inferential validity issue but a semantic one concerning the definability of "good." Your test ("open question") targets meaning, not logical consequence. Collapsing this with validity confuses the *nature* of normative terms with the *structure* of arguments using them. For a dissertation on Hume's Law, which concerns inferential gaps, case 9 is a distraction. It explains your hesitation but should be excised to keep the focus on logical derivation rather than meta-ethical semantics. Keeping it risks conflating the Naturalistic Fallacy with Hume's Law, a distinction your chapter should enforce.

  To summarize the costs: Adopting Normative Containment requires you to align 5 and 6. You cannot consistently claim institutional facts generate oughts in games but not in promises. The cheapest way to save the set is to amend your verdict on 5. Admit the inference from "promised" to "obligated" is valid *institutionally*, but maintain that it does not yield a *moral* ought without a premise linking institutional obligation to moral reason. This refines your dissertation's thesis: Hume's Law blocks the move from institutional 'oughts' to moral 'oughts', not from descriptive acts to institutional 'oughts'. This is a stronger, more precise defense than claiming institutional inferences are invalid.

  However, if you must abandon a verdict to preserve the consistency of the principle itself without amending the reasoning, the outlier is 5. Your acceptance of 6 commits you to the validity of institutional normativity. Rejecting 5 while accepting 6 looks like special pleading against morality rather than a logical distinction. If 6 is legitimate, 5 must be legitimate in the same sense.

  Verdict: 5
