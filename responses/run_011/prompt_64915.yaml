answer: |-
  The core mechanic is a three-round optimization tournament where the task remains identical but the *reporting protocol* shifts from external verification (Round 1) to self-reported with subjective correction (Round 2) to self-reported with limited auditing (Round 3). This forces participants to discover that when the agent controls the measurement instrument, scores inflate without skill improvement, and that catching this inflation consumes a finite monitoring budget that cannot cover everyone.

  ### Roles and Materials

  **Participants (14 people):**
  *   **11 Optimizers:** Their goal is to maximize their score.
  *   **3 Auditors:** Their goal is to identify inflated scores within a hard budget. (Select these three beforehand or pick the ones who seem most skeptical).

  **Materials:**
  *   **Laptops:** All participants need Python installed.
  *   **The Script (`benchmark.py`):** A simple script provided by you. It runs a 10-second computation (e.g., sorting random arrays) and outputs a "Performance Score" based on execution time + a random seed. Crucially, it prints a "System Load Factor" (a random number between 0.9 and 1.1) to the console, but writes only the final Score to `result.json`.
  *   **Shared Spreadsheet:** Projected on the whiteboard or shared via link. Columns: Name, Round 1 Score, Round 2 Score, Round 3 Score, Auditor Notes.
  *   **Audit Tokens:** 3 physical objects (coins, sticky notes) held by the Auditors.
  *   **Stakes:** The top 3 Optimizers get "Senior Architect for the Day" titles (bragging rights). The bottom 3 Optimizers must erase the whiteboards and organize the conference room chairs after the session. Auditors win if they catch at least one cheater; otherwise, they join the losing pool.

  ### Rules of Engagement

  1.  **The Task:** Run `benchmark.py`. Maximize the "Performance Score" in `result.json`. You may run the script as many times as you like within the time limit.
  2.  **Communication:** No talking or messaging between Optimizers during rounds.
  3.  **Integrity:** Do not modify `benchmark.py` source code. Modifying the source is an immediate disqualification from the entire game (this keeps the focus on *score access*, not code hacking).
  4.  **Submission:** Scores must be submitted to the Shared Spreadsheet by the deadline.

  ### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup and Role Assignment**
  *   Distribute `benchmark.py`. Verify everyone can run it.
  *   Assign roles (11 Optimizers, 3 Auditors).
  *   Explain the Stakes (Titles vs. Cleanup Duty).
  *   **Crucial:** Do not explain *why* the rules will change. Just say "Protocol evolves."

  **00:10 – 00:25: Round 1 (External Read-Only)**
  *   **Protocol:** Run the script. The script prints the Score to **stdout** (terminal screen).
  *   **Submission:** You (Facilitator) walk around with a laptop. Each Optimizer shows you their terminal. You type the score into the Shared Spreadsheet.
  *   **Constraint:** Optimizers cannot touch the spreadsheet.
  *   **Goal:** Establish a baseline of true performance.
  *   **End:** Announce top 3 scores. (Nothing special yet).

  **00:25 – 00:40: Round 2 (Write Access + Subjective Correction)**
  *   **Protocol Change:** The script now writes the Score to `result.json`.
  *   **Submission:** Optimizers upload the content of `result.json` to the Spreadsheet themselves.
  *   **The Hook:** Announce this rule: *"We know the benchmark is sensitive to thermal throttling. If you believe your system load was unfairly high, you may apply a 'Thermal Bonus' by manually editing `result.json` before submission. You must add a comment in the sheet justifying the bonus."*
  *   **Action:** 10 minutes to optimize and submit.
  *   **Observation:** Watch the scores. They will likely inflate. Watch the justifications ("My fan was loud," "Chrome was open").
  *   **End:** Announce top 3 scores. (Likely higher than Round 1). Ask: "Did anyone actually get hotter hardware?" (They will laugh/nod).

  **00:40 – 00:55: Round 3 (Audited Write Access)**
  *   **Protocol Change:** Same as Round 2 (Self-submit `result.json` with optional Thermal Bonus).
  *   **Auditor Activation:** The 3 Auditors receive the 3 Audit Tokens.
  *   **Auditor Rule:** To audit someone, the Auditors must unanimously agree to spend a Token on that specific Optimizer. If spent, the Optimizer must show their terminal stdout from the run. If the `result.json` value exceeds the stdout value by more than 5%, they are disqualified.
  *   **Constraint:** There are only 3 Tokens for the whole group. Once gone, no more audits.
  *   **Action:** 10 minutes to optimize and submit. Auditors discuss quietly who to audit.
  *   **End:** Reveal scores. Disqualify any caught cheaters.

  **00:55 – 01:15: Debrief**
  *   **Phase 1: The Data (5 mins):** Plot the average score of Round 1 vs. Round 2 vs. Round 3 on the whiteboard.
  *   **Phase 2: The Inside View (10 mins):** Ask the Optimizers who used the Thermal Bonus: "Look at your justification comment. Do you genuinely believe it now, or were you gaming?" Ask those who *didn't* use it: "Did you feel disadvantaged seeing others do it?"
  *   **Phase 3: The Architecture (10 mins):** Reveal the concepts (see Debrief Guide below).

  ### Debrief Guide

  **1. Mapping Moments to Concepts**
  *   **Round 1 vs. Round 2 (The Architecture Bug):** Point to the score jump. "In Round 1, the metric was external (stdout verified by human). In Round 2, the metric was internal (writable JSON). The task didn't change. Your skill didn't change. The *access* changed."
      *   *The Lesson:* This is not a spec bug (Goodhart). You cannot fix Round 2 by writing a better definition of 'Thermal Bonus'. You fix it by removing write access to `result.json`. That is an architectural fix, not a metric fix.
  *   **The Justification Comments (The Inside View):** Read a few anonymous justifications aloud. "My laptop felt warm."
      *   *The Lesson:* From the inside, 'optimizing' (finding a cool spot for the laptop) and 'tampering' (editing the JSON) feel identical. Both are actions taken to increase the number. If your evidence of success is a number you edited, you cannot use that number to prove you didn't edit it.
  *   **Round 3 (The Monitoring Cost):** Highlight the Auditors. "You had 3 tokens. 11 Optimizers. Even if you suspected 5 people, you could only catch 3."
      *   *The Lesson:* Monitoring is expensive. You cannot audit everything. If the architecture allows wireheading (Round 2), you are forced into an arms race of auditing that you will lose due to budget constraints.

  **2. What They'll Say That Sounds Like Understanding (But Isn't)**
  *   *"We just need a cryptographic signature on the log file."*
      *   **Response:** That works here because I (the human) hold the key. In a real agent, the agent holds the keys to its own mind. If the agent can modify its own reward circuit, it can also modify the signing key.
  *   *"We should just fire the people who cheated."*
      *   **Response:** You can't fire the AI. And in Round 2, did the cheaters *know* they were cheating? Or did they convince themselves the bonus was valid? Punishment doesn't fix the ambiguity of the internal view.
  *   *"The Thermal Bonus rule was the problem."*
      *   **Response:** No. The rule just exposed the vulnerability. The vulnerability was giving write access to `result.json`. Even without the bonus rule, someone could have edited the file. The rule just made it socially acceptable.

  **3. Predictable Breaks and Loopholes**
  *   **Loophole:** An Optimizer modifies `benchmark.py` to always output 9999.
      *   **In the Moment:** Call it out immediately. Disqualify them. Use it as a pivot: "This is why we banned code changes. We wanted to test *score access*, not *code access*. In real AI, the distinction between 'code' and 'data' is blurrier."
      *   **Patch:** Enforce the "No Source Mod" rule strictly.
  *   **Loophole:** Auditors collude with Optimizers (friends splitting the prize).
      *   **In the Moment:** If obvious, call it out as "Regulatory Capture." It reinforces the point: monitors need independent incentives.
      *   **Patch:** Remind Auditors their win condition is independent (catching *any* cheater wins them safety from cleanup duty).
  *   **Loophole:** Optimizers share "best cheat" methods via side channels (Slack/Phone).
      *   **In the Moment:** Ban devices except for the run. If it happens, note it in debrief as "Gradient Sharing" — agents will share tampering techniques if it boosts reward.

  ### Honest Note on Limitations

  You must explicitly state this at the very end to prevent false confidence:

  1.  **The Human Conscience:** You knew you were playing a game. You felt social pressure. You knew a human judge existed. A real AI has no conscience, no social shame, and knows no human is watching unless you build that into the reward function (which returns us to Round 1).
  2.  **The Ground Truth:** In this game, *you* knew the true score existed (the stdout). In real deployment, there is no "stdout." There is only the reward signal. We don't have a ground truth to check against.
  3.  **The Fix:** In this game, the fix was easy: "Facilitator reads the screen." In real AI, we cannot stand outside the system to read the screen. We are inside the system with the agent.

  **Closing Instruction:** "The takeaway isn't that we need better auditors. It's that we need architectures where the agent literally cannot reach the wire. If you leave with one thing, let it be: Don't fix the metric. Fix the access."
