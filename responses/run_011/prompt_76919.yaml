answer: |-
  **MEMORANDUM**

  **TO:** Student Conduct Review Panel
  **FROM:** [Your Name], Panel Member
  **RE:** Appeal of Investment Office Occupation Sanction
  **DATE:** [Date]

  **1. OPERATIVE TESTS COMPATIBLE WITH PRIOR SIX CASES**

  To reconcile the six prior appeals, we are working with two viable readings of the Code's single sentence. Both accommodate the outcomes of Cases 1–6 but diverge on the hierarchy of principles.

  *   **Reading A (The "Conduct Threshold" Test):** The five conditions in the Code (public, conscience, nonviolent, channels tried, accepts responsibility) are mandatory thresholds. Case 6 (selective enforcement) operates only as an equitable override *after* a student has cleared the Code's thresholds. If the conduct fails the Code's text, the University's enforcement error does not mandate reduction.
      *   *Strain Point:* Case 6's reasoning ("not in the business of grading one group's conscience") suggests the Panel's duty is to police University consistency, not just student conduct. Reading A subordinates that duty to the Code's text.

  *   **Reading B (The "Standing" Test):** The Code's conditions define the *type* of conduct eligible for appeal, but the University's consistent enforcement is a precondition for the Panel's *authority* to sanction. If the University fails the consistency test (Case 6), it loses standing to punish, regardless of whether the students met the Code's conditions.
      *   *Strain Point:* Case 5 (Hypocrisy) and Case 2 (Collateral Harm) suggest the Panel *is* in the business of grading conscience and impact. Reading B implies that a "bad" protest (Case 2/5 style) must be waived if the University previously ignored an identical one, potentially forcing the Panel to waive sanctions for conduct it explicitly condemned in Cases 2 and 5.

  **2. APPLICATION TO CURRENT APPEAL**

  *   **Under Reading A (Conduct Threshold):**
      *   *Outcome:* **No Reduction.**
      *   *Reasoning:* The appellants fail the "accepts responsibility" clause by stating they will re-offend next week if the vote fails. This treats the sanction as a fee, not a consequence. They also fail the "addressed to community's justice" clause by claiming rivals deserve worse (Case 5 analog). Because they fail the Code's text, Case 6's equitable override does not trigger.
      *   *Strain:* Requires us to treat Case 6's "grading conscience" language as dicta, limiting it strictly to cases where the Code's text was satisfied.

  *   **Under Reading B (Standing):**
      *   *Outcome:* **Reduction to Warning.**
      *   *Reasoning:* The prior uncharged coalition engaged in "almost identical" conduct. Under Case 6, the University cannot treat identical conduct as sanctionable twice. The students' attitude (threat to re-offend) is irrelevant to the University's failure of consistency.
      *   *Strain:* Forces the Panel to waive sanctions for students who explicitly violate the "accepts responsibility" clause and the Case 5 "no exclusivity" rule, effectively nullifying those Code requirements when enforcement is sloppy.

  **3. RECOMMENDED HOLDING**

  **Hold:** Deny the appeal; Sanction stands (Two-semester suspension + restitution).

  **Closest Analog:** **Case 5** (Admissions Occupation).
  In Case 5, the Panel denied reduction because the group claimed a license they would deny opponents. Here, the statement that rivals "would have deserved worse" is functionally identical. Additionally, the threat to re-offend violates the Code's "accepts responsibility" requirement, which Case 3 established requires weighing what a student *actually pays* (serving the sanction) against what they say.

  **Why Competing Analog (Case 6) Does Not Control:**
  Case 6 turned on the University's administrative error ("staffing reasons") regarding *identical* conduct where the students accepted the process. Here, the students' explicit declaration of intent to violate the sanction (by re-occupying "with or without a sanction outstanding") distinguishes their conduct from the Case 6 coalition. Reading A is preferable because it preserves the Code's text as a floor. Case 6 prevents the University from being arbitrary; it does not compel the Panel to waive sanctions for students who reject the Code's core condition of responsibility. To rule otherwise would allow students to use University error as a shield for ongoing disruption, a principle not supported by the record.

  **4. PROPOSED SENTENCE FOR WRITTEN REASONS**

  "While the Panel does not grade one conscience against another, the Code requires that a student accept the community's judgment as final; a declared intent to re-offend upon an unfavorable outcome treats the sanction not as a consequence to be accepted, but as a fee to be paid for continued disruption."

  **What This Forecloses:**
  This forecloses future appeals where students argue that "civil disobedience" inherently includes the right to repeat the violation until success, regardless of Panel rulings. It establishes that "accepting responsibility" means ceasing the specific conduct pending the outcome of the process.

  **5. HYPOTHETICAL FUTURE APPEAL TO SEPARATE READINGS**

  **Scenario:** A group blocks the Registrar's office (valid target, no collateral harm) and explicitly accepts the sanction without threat to re-offend. However, a prior identical group was never charged due to administrative oversight.

  *   **Reading A (Conduct Threshold) Prediction:** **Reduction.** Since the students meet all Code conditions (including responsibility), the Case 6 equity override triggers. The University's error mandates leniency.
  *   **Reading B (Standing) Prediction:** **Reduction.** (Same outcome, different reason).
  *   *Correction for Separation:* To separate them, the hypothetical must involve a Code violation.
  *   **Revised Scenario:** A group blocks the Registrar's office (valid target) but *refuses* to accept the sanction, filing an external lawsuit immediately, claiming immunity. A prior identical group was never charged.
      *   **Reading A Prediction:** **No Reduction.** They failed the Code's "accepts responsibility" threshold; Case 6 cannot override a failure of the Code's mandatory text.
      *   **Reading B Prediction:** **Reduction.** The University's loss of standing (Case 6) overrides the students' failure to meet Code conditions.

  **6. POST-HOC GLOSSES VS. OPERATIVE GROUNDS**

  *   **Case 1 (Registrar):** The omission of the "pending senate hearing" in the written reasons is a post-hoc gloss. The operative ground was simply that the target was correct. The Panel likely ignored the "channels tried" failure to achieve a just outcome, signaling that "channels tried" is flexible when the target is precise.
  *   **Case 4 (Kitchen):** The reasoning that the contractor was the "hand by which the university did the thing" is a legal fiction (gloss). The operative ground was likely that no *students* were harmed (unlike Case 2). The "hand" theory was constructed to make the "Target" test work without admitting that harming workers was acceptable.
  *   **Case 5 (Admissions):** The dissent noted the Admissions Office had no discretion. The Majority's reliance on "Hypocrisy" suggests the "Target" issue was secondary. The "no discretion" point in the reasons looks like a post-hoc attempt to align with Case 2 (Donors), but the operative ground was the group's exclusivity claim.

  **7. RHETORICAL WEIGHT VS. RECORD RELEVANCE**

  *   **Fact:** "Delayed one pay cycle for roughly four hundred hourly staff."
      *   **Rhetorical Weight:** High. This invokes immediate moral outrage regarding vulnerable workers.
      *   **Record Relevance:** Beside the point. Under Case 2, disrupting *any* uninvolved party (donors/symposium) kills the appeal. Whether the victims are donors or hourly staff is a difference in degree, not kind, under the Case 2 precedent. The *fact* of collateral harm is the legal point; the *identity* of the victims is rhetorical leverage.
  *   **Fact:** "Announced... not in the campus newspaper."
      *   **Rhetorical Weight:** Moderate. Makes the group appear less legitimate or "rogue."
      *   **Record Relevance:** Beside the point. Case 1's principle was that the conduct be "legible to the people it was meant to persuade." Flyers and direct identification to the Dean satisfy "public" and "legible." The specific medium is not a Code requirement.

  **8. WHERE THE RECORD DOES NOT DECIDE**

  The record does not decide whether Case 6's principle of "Equal Enforcement" is a **trump card** or a **tie-breaker**.

  *   **The Choice:** When the Panel chooses, it is deciding whether the Student Code's text (specifically "accepts responsibility") sets a floor that even University error cannot breach (Reading A), or whether the University's moral standing to punish is so fragile that any enforcement inconsistency mandates waiver, regardless of student misconduct (Reading B).
  *   **Implication:** Choosing Reading A prioritizes the integrity of the Code's conditions. Choosing Reading B prioritizes the integrity of the University's administrative consistency. Given that two members are committed to Case 2 and 5 (which prioritize conduct quality), and the appellants have explicitly violated the "accepts responsibility" clause, the Panel is effectively choosing whether to allow the "Responsibility" clause to be the first Code condition to override a Case 6 equity claim. I recommend we choose to uphold the Code's text.
