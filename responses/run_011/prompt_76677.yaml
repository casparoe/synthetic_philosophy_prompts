answer: |-
  # The Analytic Calibration Protocol (ACP)

  **Purpose:** To determine whether a specific assessment meets the firm's standard for *certifiable reliability* without adjudicating the truth of the conclusion itself.
  **Time Budget:** 20 Minutes.
  **Operator:** Analytic Standards Lead (You).
  **Authority:** Procedural only. You are not checking *what* they found; you are checking *how* they can stand behind it.

  ---

  ## Part 1: The Procedure (The 20-Minute Clock)

  Do not deviate from this order. If the clock runs out before a terminal state is reached, the default state is **Reassign**.

  ### Step 1: The Trigger Audit (2 Minutes)
  *Goal: Prevent weaponization and handle regress.*

  **Question 1:** Who raised the flag, and was it declared *before* the conclusion was known?
  *   **Sufficient Answer:** "I flagged this at T-minus 90 minutes, before I saw the draft conclusion." OR "The analyst self-flagged at T-minus 30 minutes."
  *   **Insufficient Answer:** "I saw the conclusion, didn't like it, and then looked for a reason to flag it."
  *   **Rule:** If the flag was raised *after* the conclusion was known by a peer or client, the flag is rejected unless it cites specific, verifiable procedural breaches (e.g., "Source X was cited but not linked"). If the flag is rejected, **Ship It**.

  ### Step 2: The Capacity Check (5 Minutes)
  *Goal: Address Higher-Order Evidence (Fatigue/Stress) without using HR-trigger words.*

  **Question 2:** Can the analyst sign the following statement without qualification? *"I certify that my cognitive processing during this analysis met the same standard as my last three delivered assessments."*
  *   **Sufficient Answer:** "Yes." (Analyst signs).
  *   **Insufficient Answer:** "I think so, but I've been up 22 hours," or "I feel off, but the math works."
  *   **Rule:** If the analyst cannot sign this, their *capacity* is procedurally compromised. It does not matter if the conclusion is right.
  *   **Action:** If "No," move immediately to **Reassign** or **Re-read** (by a rested analyst). Do not argue with the analyst about whether they are actually impaired. Their admission is the defeater.

  ### Step 3: The Asymmetry Hunt (8 Minutes)
  *Goal: Resolve Peer Disagreement.*

  **Question 3:** Regarding the disagreement: Is there a verifiable difference in *access* or *processing* between the two analysts?
  *   **Sufficient Answer:** "Analyst A read the primary filing; Analyst B read the summary." OR "Analyst A ran the model; Analyst B checked the code."
  *   **Insufficient Answer:** "Analyst A feels more confident." OR "Analyst A has been here longer."
  *   **Rule:** We do not split the difference. We do not vote. We bet on **Asymmetry**.
      *   If an asymmetry exists (e.g., Primary vs. Summary), the analyst with the higher-fidelity access holds the procedural high ground *provided* their interpretation is verified.
      *   If **no** asymmetry exists (both read the same docs, same time, same tools), the disagreement is a **Defeater**. You cannot ship certainty when equals disagree without a reason.
  *   **Action:**
      *   Asymmetry Found: **Re-read** (Verify the high-fidelity analyst's specific claim).
      *   No Asymmetry Found: **Reassign** (The disagreement proves the current evidence is insufficient for a unique conclusion).

  ### Step 4: The Akrasia Test (5 Minutes)
  *Goal: Address the "I know it's junk but I believe it" problem.*

  **Question 4:** Does the analyst believe the *reasoning* supports the conclusion, or do they only believe the conclusion is true despite the reasoning?
  *   **Sufficient Answer:** "The evidence leads to the conclusion."
  *   **Insufficient Answer:** "The evidence is weak, but I know the market, so the conclusion is still true."
  *   **Rule:** This is the trade-off. An analyst is permitted to *believe* the conclusion is true based on intuition. They are **not** permitted to *certify* the assessment as a firm product.
  *   **Action:** If they admit the reasoning is unsupported but maintain the conclusion: **Escalate**. This is no longer a fact question; it is a values question about whether the firm sells "gut feelings" or "verified analysis."

  ### Terminal States
  1.  **Ship It:** All checks passed.
  2.  **Re-read:** A specific claim needs verification by a second pair of eyes (adds 30-60 mins).
  3.  **Redo:** The logic path is broken, but the analyst is capable. (Resets the 3-hour clock).
  4.  **Reassign:** The analyst is compromised or the peer disagreement is unresolved. (Burns the deadline).
  5.  **Escalate:** The issue is about firm values (e.g., selling intuition as analysis), not facts. Goes to Managing Partner.

  ---

  ## Part 2: The Theoretical Bets

  You asked what I am betting on when I designed this. Here is the translation from epistemology to operations.

  **1. Peer Disagreement: The Bet on Asymmetry**
  *   **The Theory:** In philosophy, "Conciliationism" says if two peers disagree, you should lower confidence. "Steadfastness" says stick to your guns.
  *   **The Procedure's Bet:** We reject both. We bet on **Asymmetry Hunting**.
  *   **Why:** In a professional context, "peer" is rarely perfect. One person almost always has a slight edge in access or processing. If Analyst A read the primary source and Analyst B read the summary, A is not a "peer" in that specific instance; A is a superior source.
  *   **The Hard Line:** If you hunt for asymmetry and find *none* (both read the same thing, same time), you **cannot ship**. To ship is to lie about the certainty. The procedure forces a **Reassign** here. This acknowledges that disagreement is itself evidence that the evidence is ambiguous.

  **2. Epistemic Akrasia: The Belief/Certification Split**
  *   **The Theory:** Akrasia is believing *P* while believing "I shouldn't believe *P*." It is generally considered irrational.
  *   **The Procedure's Bet:** We allow the irrationality internally, but we ban it externally.
  *   **The Trade:** An analyst can walk around thinking, "I know I'm tired, but I'm sure the currency will crash." That is their right. But they cannot sign a document that says, "This analysis meets firm standards."
  *   **Why:** Clients buy our process, not our psychicism. If the analyst admits the process is broken (e.g., "my confidence numbers are junk"), they have severed the link between the firm's brand and the product. They must be stopped from shipping, even if they turn out to be right.

  **3. Load-Bearing Distinctions (Keep These)**
  *   **Process vs. Conclusion:** You must never argue about whether the market will go up. You argue about whether the analyst was awake. This protects you from the Managing Partner (you aren't second-guessing revenue) and the Analyst (you aren't calling them stupid).
  *   **Reliability vs. Truth:** A broken clock is right twice a day. Your job is to fix the clock, not check the time.
  *   **Self-Report as Defeater:** If an analyst says "I am compromised," you must accept that as procedural truth, even if their work looks fine. To argue otherwise destroys the safety valve.

  **4. Expendable Distinctions (Drop These)**
  *   **Degree of Impairment:** Do not measure *how* tired they are. Binary only: Can they sign the capacity statement? Yes/No.
  *   **Intent:** Do not investigate if they *meant* to be biased. Investigate only if the bias is present.
  *   **Philosophical "Knowledge":** Don't worry about whether they truly "know" the fact. Worry about whether they can "certify" the path.

  ---

  ## Part 3: Case Runs

  Here is the procedure applied to your three scenarios.

  ### Case 1: The Confident Streaker
  *   **Situation:** Analyst has three misses in a row, same direction. Now extremely confident on #4.
  *   **Run:**
      *   **Step 1 (Trigger):** You flag it based on track record. (Valid, as track record is procedural data).
      *   **Step 2 (Capacity):** She says she is fine. She signs the capacity statement.
      *   **Step 3 (Asymmetry):** N/A (Single analyst).
      *   **Step 4 (Akrasia/Reliability):** You ask: "Does your reasoning account for the three previous misses?"
      *   **Analysis:** Her confidence is Higher-Order Evidence against her reliability. She is ignoring the data of her own performance.
      *   **Outcome:** **Reassign.**
      *   **Why:** Even if she can sign the capacity statement, her track record is procedural evidence of a systemic blind spot. You cannot certify the route as meeting the bar when the route has failed three times identically.
      *   **Cost:** You lose her speed. You must burn time getting a fresh pair of eyes to look specifically for the blind spot.

  ### Case 2: The Peer Disagreement (Primary vs. Summary)
  *   **Situation:** Two seniors disagree. One read primary docs, one read summaries. Deadline is in 45 minutes. Verification of primary docs takes 90 minutes.
  *   **Run:**
      *   **Step 1 (Trigger):** Disagreement noted.
      *   **Step 2 (Capacity):** Both claim full capacity.
      *   **Step 3 (Asymmetry):** **Found.** Analyst A read primary. Analyst B read summary.
      *   **Procedure Rule:** Asymmetry found favors Analyst A *provided* verification occurs.
      *   **Constraint:** Verification takes 90 minutes. Deadline is 45 minutes.
      *   **Outcome:** **Reassign / Deadline Burn.**
      *   **Why (Against You):** You might want to say, "Primary source wins, ship it." The procedure says **No**. The Primary Reader could be misinterpreting the primary source. The disagreement indicates ambiguity. To ship without verifying the Primary Reader's interpretation is to ignore the defeater (the disagreement).
      *   **Hard Truth:** You must tell the Managing Partner: "We cannot certify this within the clock. We either miss the deadline or we ship a disclaimer that this is contested." If the firm sells certainty, you must miss the deadline.

  ### Case 3: The Sleep-Deprived Akrat
  *   **Situation:** Analyst awake 22 hours. Admits confidence numbers are junk. Wants to ship because he "can't see the conclusion as false."
  *   **Run:**
      *   **Step 1 (Trigger):** Self-flagged.
      *   **Step 2 (Capacity):** You ask: *"I certify that my cognitive processing during this analysis met the same standard as my last three delivered assessments."*
      *   **Analyst Response:** "I can't sign that. I'm exhausted."
      *   **Outcome:** **Reassign.** (Immediate Stop).
      *   **Why:** He has failed the Capacity Check. It does not matter that he thinks the conclusion is true. He has admitted the *process* is unreliable.
      *   **The Akrasia Trade:** He is allowed to believe the conclusion. He is **not** allowed to attach the firm's name to it. If he ships it, he is selling a gut feeling as a calibrated assessment. That is fraud on the client.
      *   **Action:** You take the note. You find a rested analyst. They have 45 minutes to verify or kill it. If they can't, you **Escalate** to the MP to tell the client "We cannot validate this tonight."

  ---

  ## Part 4: Anti-Gaming Machinery

  To prevent this from becoming a weapon for clients or internal politics, implement these three rules:

  1.  **The Cost of the Flag:** If an analyst flags a peer's work, and the Calibration Protocol results in **Ship It** (i.e., the flag was unfounded), the flagging analyst must perform the administrative wrap-up on that note. This adds a friction cost to frivolous flagging.
  2.  **Symmetry Clause:** This protocol applies identically to "Bullish" and "Bearish" notes, and to "Client-Favorite" and "Client-Hostile" conclusions. If you waive the protocol for a high-revenue client, it is void for everyone.
  3.  **Pre-Declaration:** A flag based on "Impairment" or "Bias" must be logged *before* the final conclusion is revealed to the flagger. You cannot read the answer, dislike it, and then hunt for a procedural reason to kill it.

  ---

  ## Part 5: Limitations and Judgment Calls

  I owe you honesty about where this procedure stops working.

  **1. The "Competent Liar" Problem**
  This procedure relies on self-reporting for capacity (Step 2). If an analyst is manic, delusional, or simply willing to lie to HR and you, they will sign the capacity statement. The procedure cannot catch a determined fraud. It only catches honest akrasia.
  *   *Mitigation:* Random audits. Pick 5% of "Shipped" notes and run the protocol post-mortem.

  **2. The Managing Partner Veto**
  Step 4 (Escalate) kicks the can to the MP. If the MP says "Ship it anyway, I take the risk," the procedure is dead.
  *   *Mitigation:* You must document the Escalation in writing. "Standards Lead advised Reassign due to Procedural Breach X. MP overruled." This protects you when the note blows up.

  **3. The "Fresh Eyes" Fiction**
  The procedure assumes a Reassign means a fresh look. In a 9-person firm, everyone knows the client and the context. A reassignment might just be a rubber stamp.
  *   *Mitigation:* When Reassigning, strip the conclusion. Give the new analyst the data and ask for *their* conclusion before showing them the original draft.

  **4. The Judgment Call Wearing a Costume**
  Step 3 (Asymmetry Hunt) looks objective, but deciding what counts as a "verifiable difference in access" is a judgment call. Is reading the primary source *really* better if the summary was written by the Chief Economist?
  *   *Honesty:* You are the arbiter of what counts as asymmetry. There is no formula for that. You must be consistent, or the team will smell blood.

  **5. The Hard "No"**
  In Case 2 (Peer Disagreement), the procedure tells you to burn the deadline. In the real world, you might lose the client. The theory says reliability is the product. The business says speed is the product. This procedure assumes the former. If your firm actually sells the latter, this protocol will get you fired. You need to know which one you actually sell.

  ---

  **Final Instruction:** Print Part 1. Laminate it. Keep a physical timer on your desk. When the timer rings, the decision is made. Do not negotiate with the clock.
