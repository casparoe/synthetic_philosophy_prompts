  3.  **Drafting the Procedure (The "Calibration Protocol"):**

      *   *Name:* Needs to sound professional, not therapeutic. "Analytic Calibration Protocol" (ACP).
      *   *Time:* 20 minutes max.
      *   *Steps:*
          1.  **Trigger:** Who can pull the cord? (Anyone, but costs something).
          2.  **Isolation:** Separate the *claim* from the *claimant*.
          3.  **The Asymmetry Check (Peer Disagreement):** Don't split the difference. Hunt for the difference in access/processing.
          4.  **The Reliability Check (HOE/Fatigue):** Can the analyst certify the *process*, not just the result?
          5.  **The Akrasia Test:** Can you sign the "Reasoning Statement"?
