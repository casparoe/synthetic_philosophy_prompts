      *   **Identifying the Rejection Point:** Step (5) is the culprit.
          *   *Why it looked innocent:* It conflates the *genesis* of the options with the *quality* of the options. It feels intuitive: "If the game is rigged, the moves aren't real."
          *   *Why it fails:* It creates a "taint" theory of consent where any interaction within an unjust system is void. It collapses the distinction between *coercion* (threatening to make you worse off) and *hard choices* (offering to make you better off within a bad situation).

      *   **Pricing the Candidate Rejections:**
