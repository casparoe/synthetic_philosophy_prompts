answer: |-
  This is a classic formulation of the **Background Injustice Objection** to consent, often discussed in bioethics (e.g., by Wertheimer, Millum, or in debates over "undue inducement"). Your resident defender is pushing a **structuralist critique** that risks collapsing into **nihilism about agency**.

  You are right to suspect step (5). That is the pivot point where the argument transforms from a plausible critique of power into an untenable theory of action. However, to give your group a full menu of options, we need to price the cost of rejecting each premise, including the defender's preferred route.

  Here is the breakdown of where the argument breaks, why step (5) is the culprit, and how to save the moral complaint without voiding the consent.

  ---

  ### 1. The Weak Link: Step (5)
  **"An option set produced by injustice contains no reasonable alternatives..."**

  **Why it looked innocent going in:**
  It relies on a powerful intuition: **The Taint Principle.** If the game is rigged, the moves aren't real. It feels morally consistent to say that if a person's desperation is caused by someone else's wrongdoing (global inequality, colonial history), then taking advantage of that desperation cannot be voluntary. It conflates the *genesis* of the options with the *quality* of the choice. It sounds like a robust defense of the vulnerable: "She didn't really choose this; the system chose for her."

  **Why it fails:**
  It creates a **slippery slope of invalidity** (as seen in step 7). If the mere existence of background injustice renders all alternatives unreasonable, then *no one* in an unjust society can consent to anything. This dissolves the distinction between **coercion** (I threaten to make you worse off unless you agree) and **offer** (I propose to make you better off, though you are already in a bad spot).
  *   In the drug trial, the sponsor did not create the poverty (usually). They are offering an option *within* the poverty.
  *   If (5) holds, a starving person cannot validly consent to food, because the menu (eat/don't eat) was produced by an unjust distribution of food.

  **The Price of Rejecting (5):**
  *   **Gain:** You save the concept of agency for the oppressed. You allow that people can make meaningful, valid choices even under bad conditions. You avoid the absurdity that warehouse workers and tenants never consent to their contracts.
  *   **Cost:** You must admit that the trial enrollment *can* be valid consent. This forces you to shift your moral critique from **autonomy** (she didn't agree) to **exploitation** (she agreed, but the terms were unfair). It requires more nuanced ethical work. You can no longer just say "Stop the trial"; you have to say "Fix the terms" or "Fix the background."

  ---

  ### 2. Pricing the Other Candidate Rejections

  To show your group why (5) is the *best* place to cut, you must show why the other cuts are more expensive.

  #### Rejecting (1): "Consent does not require a reasonable alternative."
  *   **The Move:** This is essentially what step (9) suggests. You claim consent is purely about internal mental state (voluntariness), regardless of options.
  *   **The Price:** **High.** If you drop this, you lose the ability to distinguish consent from submission. A slave "consents" to work if the alternative is death, under this definition. You lose the concept of **coercion** entirely. In bioethics, this is dangerous; it validates "Hobson's choices" where the only option is submission to authority.
  *   **Verdict:** Too expensive. We need (1) to protect people from threats.

  #### Rejecting (2): "Judge alternatives against a just baseline, not the actual one."
  *   **The Move:** You argue the alternative is only "reasonable" if it matches what she *should* have in a just world (e.g., universal healthcare).
  *   **The Price:** **Paralysis.** This moves ethics into **Ideal Theory**. Since almost no one lives in a perfectly just world, almost no consent is valid. It makes ethical judgment impossible in non-ideal reality. It also disrespects the agent's actual reality in favor of a philosopher's hypothetical.
  *   **Verdict:** Too abstract. It renders ethics useless for actual decision-making.

  #### Rejecting (3) or (4): "The background isn't unjust" or "She had a hand in it."
  *   **The Move:** Deny global inequality is unjust, or claim individual responsibility for poverty.
  *   **The Price:** **Credibility.** In an applied ethics context, denying (4) is empirically and morally contentious. Denying (3) ignores sociology.
  *   **Verdict:** Dishonest.

  #### Rejecting (8): "Consequences don't matter; truth does." (The Defender's Move)
  *   **The Move:** Bite the bullet. Admit warehouse workers don't validly consent, but say we should still pay them because it helps them (paternalism).
  *   **The Price:** **Paternalism & Instability.** If the worker's consent is void, the employer has no moral obligation derived from *agreement*. The employer pays only out of charity. If the charity stops, the worker has no claim based on rights or contract. It strips the vulnerable of the moral power of their own "Yes." It treats them as perpetual victims incapable of binding agreements.
  *   **Verdict:** Morally hazardous. It disempowers the very people the argument claims to protect.

  ---

  ### 3. Can the Moral Complaint Survive Without Invalidity?

  Your defender argues that if you reject (6) (consent is invalid), you lose the moral complaint against the trial. **This is false.**

  You can maintain a fierce moral objection to the trial without claiming the consent is void. You simply shift the locus of the wrong from **Autonomy** to **Justice/Fairness**.

  **A. The Exploitation Objection**
  Consent can be **valid** but the transaction **exploitative**.
  *   *Analogy:* A drowning man consents to pay a rescuer $1 million. The consent is valid (he chose it), but the rescuer is exploiting the situation.
  *   *Application:* The enrollee validly consents to the trial, but the sponsor is exploiting the background injustice to pay them less or risk them more than they would in a rich country. The wrong isn't that they signed up; it's that the *terms* leverage their desperation.

  **B. The "Standard of Care" Objection**
  Instead of attacking enrollment consent, attack the **protocol design**.
  *   If the trial offers a drug that won't be available locally post-trial, or uses a placebo when an effective treatment exists (the "Gold Standard" debate), the trial is unethical regardless of consent. The complaint is about **benefit sharing**, not entry.

  **C. The Structural Objection (Without Nihilism)**
  You can argue that while the *individual consent* is valid, the *systemic permission* is not.
  *   "We should not allow these trials to be approved by ethics boards, not because the patients are lying when they say yes, but because the background conditions make the 'yes' too predictable to be safe."
  *   This preserves the patient's agency (they really did want the drug) while placing the burden on the **sponsor and regulators** to not utilize unjust backgrounds for profit.

  ### Summary for Your Group

  Tell your defender this:
  1.  **Step (5) is the error.** It conflates an *unjust context* with a *coercive offer*. An offer is coercive only if the proposer created the threat or worsened the baseline. Merely offering a lifeline in a storm you didn't create is not coercion, even if the storm is unjust.
  2.  **The Cost of (5):** If we keep (5), we strip the poor of their moral agency. We treat them as incapable of making binding choices, which justifies paternalism.
  3.  **The Survival of the Complaint:** We don't need invalid consent to fight exploitation. We can say: *"Your consent is real, and I respect it. But the terms you were forced to accept by circumstance are unfair, and I will fight to change the terms, not void your signature."*

  This allows you to keep the critical edge of the argument (the trial is problematic) without accepting the self-defeating conclusion (no one ever consents to anything).
