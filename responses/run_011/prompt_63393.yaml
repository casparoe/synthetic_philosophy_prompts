          *   *Rejecting (3) or (4):* Denying structural injustice. Empirically false or morally blind. High cost to credibility.
          *   *Rejecting (5) (The Sweet Spot):* Distinguish between *unjust background* and *coercive proposal*. An offer can be beneficial even if the situation is bad.
              *   *Cost:* We have to admit the trial *might* be consensual, which weakens the "never valid" claim. We have to do the hard work of distinguishing exploitation from mutually beneficial exchange.
          *   *Rejecting (8) (The Defender's move):* Ignoring consequences. Leads to moral purism that harms the vulnerable (the "paradox of consent").

