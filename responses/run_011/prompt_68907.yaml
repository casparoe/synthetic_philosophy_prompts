  **JOINT PRELIMINARY STATEMENT ON THE ORIGINS CONTROVERSY**

  **Signatories:**
  Historian A (Representing the "Aims-First" Tradition)
  Historian B (Representing the "Systems-Interaction" Tradition)

  **Date:** October 2023
  **Subject:** Terminological Clarification and Scope of Disagreement regarding the July Crisis and the Outbreak of the Great War

  **PREAMBLE**

  This document serves as the opening statement for the conference volume *The Fischer Controversy: Six Decades On*. It is the product of an adversarial collaboration between two historians who have长期从事 (worked for decades) on opposing sides of the debate concerning German war aims and the structural causes of the First World War. Our objective is not to resolve the controversy, but to decompose it. We seek to isolate precisely where our interpretations diverge, where they converge, and what evidentiary standards would be required to alter our respective positions. We agree that much of the past sixty years of discourse has been obscured by the conflation of distinct categories of analysis. The following sections fix our vocabulary, record our joint commitments, map our disagreements, and identify the cruxes upon which the debate turns.

  **I. VOCABULARY AND SCOPE**

  To prevent category errors, we agree to distinguish the following three concepts, which have historically been conflated in public and diplomatic discourse:

  1.  **Causal Contribution:** A counterfactual assessment of what a power's decisions changed about the course of events. This asks: *Had Actor X chosen differently, would the war have occurred, or occurred differently?* This is a matter of historical mechanism, not ethics.
  2.  **Moral Culpability:** An assessment attaching to agents in virtue of what they knew, intended, and could have done otherwise. This asks: *Did Actor X possess sufficient knowledge and agency to be held blameworthy?* This requires establishing *mens rea* and the existence of viable alternatives.
  3.  **Liability to Bear Costs:** A functional assignment of obligation, typically determined by peacemakers to discharge the costs of reconstruction and deterrence. This asks: *Who must pay to restore stability?* This is a political and legal function that may, but need not, align with Causal Contribution or Moral Culpability.

  **Analysis of Treaty of Versailles, Article 231**
  We record the following analysis of the opening article of the reparations section of the Treaty of Versailles ("The Allied and Associated Governments affirm and Germany accepts the responsibility of Germany and her allies for causing all the loss and damage... as a consequence of the war imposed upon them by the aggression of Germany and her allies"):
  *   **Causal Contribution:** The Article asserts this ("causing all the loss and damage").
  *   **Moral Culpability:** The Article asserts this ("aggression," "imposed upon them").
  *   **Liability to Bear Costs:** The Article asserts this ("accepts the responsibility," serving as the legal basis for reparations).
  *   **Joint Observation:** Article 231 conflates all three categories into a single juridical finding of "responsibility."

  **Self-Identification of Argumentative Scope**
  *   **Historian A** acknowledges that their work has primarily argued for high **Causal Contribution** and high **Moral Culpability** on the part of the German Reich, implying a unique **Liability**.
  *   **Historian B** acknowledges that their work has primarily argued for distributed **Causal Contribution** across the alliance system, rejects the coherence of ranking **Moral Culpability** in this context, and views **Liability** as a political function distinct from historical causation.
  *   **Survival of Disagreement:** Once this decomposition is made, disagreement survives regarding **Causal Contribution** (whether German decisions were the decisive variable or one of several sufficient variables) and **Moral Culpability** (whether German agents possessed alternatives that other powers did not). We agree that **Liability** is not a historical question but a political one, and therefore cease to argue over it as historians.

  **II. JOINT CLAIMS**

  We jointly affirm the following substantive claims. These are not platitudes but specific points of convergence that bound our disagreement.

  1.  **[Historical]** The *September Programme*, drafted by Chancellor Bethmann Hollweg's private secretary in September 1914, postdates the outbreak of general war by several weeks. This fact is compatible with Historian A's reading (as evidence of pre-existing aims finally committed to paper) and Historian B's reading (as evidence of wartime improvisation and coalition management). The document's timing alone settles neither the existence of prior aims nor their causal efficacy.
  2.  **[Historical]** The meeting between Kaiser Wilhelm II and his senior military advisers on December 8, 1912, is a genuine historical event. However, its evidential weight is exactly what is in dispute: whether it constitutes a decision for war postponed (A) or a theoretical discussion of hypothetical constraints (B).
  3.  **[Conceptual]** Attributing responsibility to a state presupposes that the state functioned as an agent. This requires evidence of coherent decision procedures, adequate informational access, and the existence of a real alternative at the critical juncture. Consequently, we cannot disagree about German responsibility until we agree on when the German government can be treated as a unitary agent capable of choosing otherwise.
  4.  **[Methodological]** No single document exists that simultaneously satisfies the criteria of authenticity, explicit statement of intent to provoke a general European war, and confirmation that this intent was the decisive factor in the final mobilization orders. Both sides argue from patterns of inference rather than a singular "smoking gun."
  5.  **[Historical]** The mobilization timetables of the Great Powers, particularly the Schlieffen Plan's requirement to strike west before turning east, created a rigid temporal constraint on diplomacy during the final week of the July Crisis. Both sides agree this reduced the window for peaceful resolution, though we disagree on who locked the window.

  **III. DISAGREEMENTS TABLE**

  | Disagreement (Neutral Statement) | Wording Acceptable to Historian A (Aims-First) | Wording Acceptable to Historian B (Systems) | Revision Conditions (What would change the mind, not merely embarrass) |
  | :--- | :--- | :--- | :--- |
  | **1. The Primary Driver of Escalation** | German expansionist aims were causally upstream of the risk-taking in July 1914; the crisis was exploited to achieve strategic goals. | The crisis was explained by an interaction system where intentions were downstream of constraints; the war was a collective failure of crisis management. | **A:** Proof that German leadership explicitly rejected a viable peace offer that preserved their core security interests.<br>**B:** Proof that German leadership initiated mobilization steps prior to the Russian general mobilization order, independent of alliance triggers. |
  | **2. Uniqueness of German Role** | Germany bears a share of responsibility decisively larger than any other power's due to the scope of its aims and its "blank check" to Austria-Hungary. | Ranking the powers is a category mistake; the system generated a war that no single capital could unilaterally prevent once the cascade began. | **A:** Demonstration that Austria-Hungary or Russia possessed veto power over German decisions that they chose not to exercise.<br>**B:** Demonstration that a specific German decision was *necessary* for the war to occur, rather than merely *sufficient* in conjunction with other factors. |
  | **3. Salience and Ranking** | Salience of the German variable supports a determinate ranking of responsibility. | Salience is relative to explanatory interest; no objective metric exists to rank causal contributions in a jointly sufficient set. | **Both:** Agreement on a formal model of counterfactual dependence that allows for the weighting of causes in complex systems. (Currently, we disagree on whether such weighting is historically possible). |

  **IV. CRUXES**

  We identify two fixed cruxes where the debate turns on specific evidentiary standards and counterfactual commitments.

  **Crux 1: Direction of Inference (Aims vs. Decisions)**
  *   **The Issue:** Were expansionist aims causally upstream of the July risk-taking, or were they articulated afterwards as wartime improvisation and coalition management?
  *   **Historian A's Evidential Standard:** To settle this, a pre-July-1914 document must exist linking specific territorial acquisitions to the *risk* of general war, explicitly stating that the risk is acceptable. Conversely, a pattern of post-hoc rationalization (e.g., war aims expanding only as military stalemate sets in) would count against the Aims-First reading.
  *   **Historian B's Evidential Standard:** To settle this, a record must show German leaders discussing the systemic constraints and explicitly noting that their aims are secondary to the necessity of alliance cohesion or defensive mobilization.
  *   **Joint Commitment:** We agree that the absence of such a document does not prove the negative, but its presence would be decisive.

  **Crux 2: Relevance of Intentional States**
  *   **The Scenario:** Suppose the record contained an explicit German policy memorandum from before July 1914 ranking a localized Austro-Serbian war against a general war and stating a clear preference for the localized option.
  *   **Historian A's Implication:** This would complicate the Aims-First reading only if it showed Germany took *no* actions to risk general war. If Germany preferred local war but took actions known to risk general war to achieve aims, the position holds.
  *   **Historian B's Implication:** This would not move the Systems position. If the constraint set (alliances, timetables) made German preferences largely irrelevant to the outcome, a memorandum stating a preference for peace is consistent with the view that the system overrode intention.
  *   **Counterfactual Prediction (Russia Stands Down):**
      *   **Historian A:** If Russia had stood down and the crisis remained localized, Germany would have sought a new pretext for conflict within a short timeframe to secure its expansionist aims. The war was a goal, not an accident.
      *   **Historian B:** If Russia had stood down, the war would have been avoided in 1914. However, the structural tensions would have remained, making a future conflict probable, though not inevitable. The specific outbreak in August 1914 was contingent on the interaction, not predetermined by German teleology.

  **V. ANNEX: ILLEGITIMATE TERMS AND REPLACEMENT VOCABULARY**

  We identify the following terms as having done illegitimate work in the exchange, often smuggling in moral or legal judgments under the guise of historical description. We propose the following replacement vocabulary for the purposes of this volume.

  | Illegitimate Term | Problem | Replacement Vocabulary (Both Sides) |
  | :--- | :--- | :--- |
  | **Guilt** | Conflates historical causation with moral/religious sin. | **Moral Culpability** (defined in Section I). |
  | **Responsibility** | Ambiguous between cause, blame, and liability (see Versailles Art. 231). | **Causal Contribution** or **Liability** (specify which). |
  | **Aggression** | Legal term requiring a definition of "first use" in a complex mobilization context. | **First Order of General Mobilization** or **First Declaration of War**. |
  | **Preventive War** | Implies rational calculation of future threat vs. immediate action; often used apologetically. | **Risk-Calculation based on Relative Power Decline**. |
  | **Inevitability** | Suggests metaphysical determinism rather than high probability. | **High Probability given Structural Constraints**. |
  | **Continuity** | Implies a straight line from 1900 (or earlier) to 1914 without interruption. | **Policy Consistency across Crisis Junctures**. |
  | **"The War"** | Conflates the July Crisis, the Outbreak, and the Four-Year Conflict. | **The July Crisis** (June 28–Aug 4, 1914); **The Outbreak** (Mobilization/Declarations); **The Great War** (1914–1918 conflict). |

  **Signed,**

  __________________________
  Historian A

  __________________________
  Historian B
