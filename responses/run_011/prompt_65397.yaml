  0.55

  Here is the derivation of that figure, the weighting of the constituent terms, and the analysis of the disagreements within your group.

  ### The Terms and Probabilities

  I have standardised the terms so that a higher probability in each case contributes positively to the conclusion that Strong-Form Review (SFR) yields better protection than Weak-Form Review (WFR).

  **(i) Metric Determinacy: 0.80**
  *Probability that "better protection of rights" is sufficiently determinate to be scored.*
  While philosophers may contest the content of rights, in a dominant-party system involving unpopular minorities, protection is largely binary: the infringement either occurs or it does not. The metric is contestable in the margins, but not enough to invalidate the comparison.

  **(ii) Judicial Epistemic Advantage: 0.60**
  *Probability that judges possess a motivational or epistemic advantage over legislators regarding rights.*
  Judges are insulated from the whip, but they are not immune to the prevailing political culture. Given your stipulation of a depoliticised appointment commission, they have a slight advantage in conscience, but not a decisive one in knowledge.

  **(iii) WFR Override Costlessness: 0.70**
  *Probability that the disciplined majority treats a WFR override as nearly costless.*
  With 55 per cent discipline, the legislative cost is zero. The political cost exists but is likely outweighed by the electoral gain of infringing the rights of an *unpopular* minority. If this probability is high, WFR collapses into legislative supremacy, favouring SFR.

  **(iv) Ex Ante Efficacy: 0.75**
  *Probability that SFR produces stronger ex ante legislative caution than WFR.*
  Drafters fear invalidation (SFR) more than declarations (WFR). In a system with high party discipline, the government controls the draft; the threat of a strike-down forces the whip to consider constitutional risk more seriously than a mere declaration.

  **(v) Judicial Resilience: 0.50**
  *Probability that the court remains willing to use SFR powers for unpopular minorities over three decades.*
  Thirty years covers a generation of appointments. Even with a depoliticised commission, the legal culture tends to drift towards the political centre of gravity. There is a significant risk the court becomes timid to preserve its institutional capital.

  **(vi) Absence of Constitutional Hardball: 0.30**
  *Probability that the majority refrains from court-curbing or constitutional amendment in response to adverse SFR rulings.* (Added Term)
  This is the specific risk to SFR in a dominant-party polity. If the court blocks the 55 per cent majority too often, the majority has the numbers to amend the constitution or curb the court's jurisdiction. A low score here severely damages the SFR case.

  ### The Derivation

  I have combined these terms using a **weighted arithmetic mean**. This reflects the view that these are contributory factors rather than strict necessary conditions (which would require multiplication), though Term (vi) acts as a near-veto in practice. The weights reflect the causal impact of each term on the final outcome.

  | Term | Probability ($P$) | Weight ($W$) | Contribution ($P \times W$) |
  | :--- | :---: | :---: | :---: |
  | (i) Metric Determinacy | 0.80 | 0.05 | 0.040 |
  | (ii) Judicial Advantage | 0.60 | 0.05 | 0.030 |
  | (iii) WFR Override Costless | 0.70 | 0.30 | 0.210 |
  | (iv) Ex Ante Efficacy | 0.75 | 0.10 | 0.075 |
  | (v) Judicial Resilience | 0.50 | 0.25 | 0.125 |
  | (vi) No Court-Curbing | 0.30 | 0.25 | 0.075 |
