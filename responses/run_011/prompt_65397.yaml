m declarations produce genuine reconsideration rather than symbolic response; (v) the probability that a court holding a power of invalidation becomes more rather than less willing to use it for unpopular minorities over three decades, as against drifting into alignment with the coalition that appointed it. Show me explicitly how you combine the terms — whether you are multiplying conditionals, weighting them, or simply averaging — and then give me the bottom line.

