      *   *User's view:* Einstein isn't arguing about *prices/knowledge*; he's arguing about *power/accountability*.
      *   *Verdict:* The user is right. The SCD is about *economic calculability* (can we allocate resources efficiently?). Einstein accepts the *need* for planning to solve anarchy but worries about the *political structure* of that planning. It's a category error to treat Einstein as a participant in the SCD. He's one step further down the road.

  4.  **Map Einstein vs. SCD:**
      *   **Hayek:** Focuses on *epistemic limits*. Central planners *cannot* know the local/tacit knowledge required to set prices. Result: Inefficiency/Starvation.
      *   **Lange:** Focuses on *mechanism*. Planners can simulate markets via trial and error. Result: Efficiency is possible.
      *   **Einstein:** Accepts planning is necessary (sides with Lange on necessity, ignores the price mechanism detail), but asks: *Who watches the watchers?*
      *   **Classification:** Einstein's objection is primarily a **Liberty/Political Objection**, not Feasibility (he thinks planning is feasible) or Efficiency (he thinks capitalism is wasteful). It's about *domination*.

