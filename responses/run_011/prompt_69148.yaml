          *   *Corporate Plan:* Planners appointed by shareholders/Board. Exit = Quit/Buy elsewhere (easier, but costly). Failure = Bankruptcy/Layoffs.
      *   *The ML Twist:* ML solves Hayek's *data* problem (maybe), but exacerbates Einstein's *power* problem. Algorithms are opaque. Who audits the objective function?
      *   *Disanalogies:*
