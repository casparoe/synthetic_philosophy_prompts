  ### 1. The Dissolving Tension (Apparent Only)
  **Commitments:** #3 (Functional Individuation of MOPs) vs. #4 (Paralyzed Coach).

  **The Worry:** Commitment #3 individuates practical modes of presentation (MOPs) by the role they play in *producing and guiding* intentional $\phi$-ing. Commitment #4 posits a subject (the Coach) who possesses know-how but cannot produce or guide $\phi$-ing due to paralysis. It appears that if the MOP is defined by its causal efficacy in action, the Coach cannot possess the MOP, and therefore (by #1) cannot possess know-how.

  **Why It Dissolves:** This tension vanishes if you adopt a **dispositional or type-based functionalism** rather than a token-causal one. A practical MOP can be individuated by the role it is *functionally suited* to play within the cognitive architecture, even if the output mechanism (the motor system) is damaged. Think of it as a map: a map of a city retains its representational content (its "way of presenting" the routes) even if the roads are blocked and you cannot travel them. The Coach possesses the functional state *type* that normally guides action, even if the token state cannot currently execute that guidance.

  **Verdict:** Do not list this as a problem in your memo to the PIs. Instead, explicitly clarify in your definition of #3 that functional roles are individuated by their causal profile in an intact system, not by successful token execution in the current context. This secures the Coach verdict without cost.

  ### 2. The Genuine Tensions (Ranked by Severity)

  **Severity 1: Fatal Inconsistency**
  **Commitments:** #1 (Intellectualism: K-how is a species of K-that) vs. #9 (Amnesic Virtuoso: Has K-how, lacks K-that).

  **The Break:** This is not a tension; it is a direct contradiction. Commitment #1 asserts an identity relation (or species-genus relation): to know how is *to* know that (under a practical MOP). Commitment #9 asserts the existence of a subject who satisfies the left side of the equation (knows how) but explicitly fails the right side (does not know that any such way is a way). You cannot maintain strict Stanley–Williamson intellectualism while granting the anti-intellectualist verdict on the Amnesic Virtuoso. If the Virtuoso knows how, she *must* know that, on your own definition.

  **Severity 2: High Theoretical Strain**
  **Commitments:** #1 (Intellectualism) vs. #7 (Infants/Animals).

  **The Break:** If know-how is a propositional attitude (#1), and infants/animals have know-how (#7), then infants/animals must entertain propositions under practical MOPs. While Stanley and Williamson accept this, it is a high-cost commitment in a motor-cognition laboratory. Cognitive scientists often distinguish sharply between procedural learning (basal ganglia/cerebellum) and declarative propositional knowledge (hippocampal/cortical). Attributing full-blown propositional attitudes to pre-linguistic infants may strike your collaborators as anthropomorphic or empirically unsupported. This is not a logical contradiction, but it is a significant empirical burden.

  **Severity 3: Low Strain**
  **Commitments:** #2 (Knowledge is Factive/Mental State) vs. #8 (Contextualism).

  **The Break:** There is a minor friction here between the internal nature of mental states and the external standards of ascription. However, this is standard fare in contemporary epistemology (e.g., contextualist solutions to skepticism). As long as you maintain that the *subject's state* is invariant while the *truth conditions of the ascription* vary, this is coherent. It does not threaten the core architecture.

  ### 3. The Cheapest Single Revision

  To restore coherence to the set without abandoning your core intellectualist framework (which is likely the backbone of your dissertation), you must revise **Commitment #9 regarding the Amnesic Virtuoso.**

  **The Revision:**
  Retract the claim that the Virtuoso "no longer knows *that* any such way is a way to play it." Instead, argue that she retains the propositional knowledge *implicitly* or *unconsciously*, but has lost *access* to it for the purposes of report, recall, or correction.

  **Why This Is Cheapest:**
  1.  **Preserves #1:** You maintain the strict intellectualist definition that K-how is a species of K-that.
  2.  **Preserves #4 (Coach):** The Coach retains explicit or implicit K-that but lacks ability.
  3.  **Preserves #9 (Physicist):** The Physicist lacks the *practical* MOP (per #3), so he lacks K-how despite having theoretical K-that.
  4.  **Helps #7 (Infants):** By decoupling propositional knowledge from linguistic reportability (as you must for the Virtuoso), you make it much easier to attribute propositional attitudes to infants and animals without requiring language.

  **The Cost:**
  1.  **Empirical Friction:** This is the significant cost. Your PIs in the motor-cognition lab likely view the Amnesic Virtuoso case as evidence of a dissociation between procedural memory (skill) and declarative memory (propositional knowledge). By insisting the Virtuoso *does* have declarative knowledge (just implicitly), you are philosophically overruling a standard empirical interpretation of amnesia. You will need to argue that "knowing-that" does not require conscious accessibility, which may conflict with how your collaborators operationalize "declarative knowledge."
  2.  **Dialectical Weakness:** You lose the ability to use the Virtuoso as a "killer case" against *other* intellectualists who require conscious access. However, since you are an intellectualist, you should not be using this case against yourself anyway.

  ### 4. Impact on Case Verdicts

  *   **The Coach:** Her status remains unchanged. She possesses the practical MOP (functional type) and the propositional knowledge (explicit or implicit), but lacks the motor capacity.
  *   **The Physicist:** His status remains unchanged. He possesses propositional knowledge (explicit), but lacks the practical MOP (because his state does not play the guiding role, per #3).
  *   **The Virtuoso:** Her description changes. She is no longer a counterexample to Intellectualism. She becomes a case of *implicit* propositional knowledge coupled with intact functional guidance mechanisms.

  ### Summary Recommendation for the PIs

  When presenting this to the laboratory PIs, do not present the list exactly as written. The contradiction between #1 and #9 will signal to them that you have not fully integrated the empirical data on amnesia with your philosophical framework.

  **Action Plan:**
  1.  **Clarify #3:** Specify that functional individuation refers to the *capacity* to guide, not successful token guidance (dissolving the Coach tension).
  2.  **Modify #9:** Reframe the Virtuoso verdict. State that she retains the propositional attitude required by #1, but that this attitude is non-reportable due to hippocampal damage.
  3.  **Highlight #7:** Use the revised #9 to bolster your case for #7. If propositional knowledge doesn't require report (Virtuoso), it doesn't require language (Infants).

  This revision saves your intellectualist thesis, maintains consistency across all nine points, and offers a defensible (if philosophically loaded) interpretation of the empirical data that your collaborators can engage with.
