answer: |-
  | Requirement | Status | Reasoning |
  | :--- | :--- | :--- |
  | **Functional Triggering** | Non-negotiable | Triggers must assess decisional capacity, not factual accuracy. In the "grandchildren" case, failing a memory test satisfies the letter but not the spirit of incapacity. Interpretation is theoretical, not engineering; the system must distinguish confusion from incompetence. |
  | **Epistemic Humility** | Non-negotiable | The theory must discount prior wishes based on empirical data regarding affective forecasting. People systematically overestimate future suffering. Ignoring this validates false premises, making the directive irrational by its own utilitarian standards. |
  | **Presumptive Current Authority** | Contested | Addresses the self-silencing clause. If a current refusal is automatically dismissed as "the disease," all later reports become worthless. A theory must allow pre-discounting only if current capacity is demonstrably compromised, not merely contradictory. |
  | **Welfare Floor** | Contested | Addresses the contented patient. If the current self experiences no harm and enjoys life, enforcing a prior death wish treats the living being as a vessel for a dead principal's values. This prioritizes critical interests over experiential ones. |
  | **Principal Distinction** | Non-negotiable | Must separate biological identity from moral agency. Having a say is not having the only say. The theory must distinguish what she *wanted* then from what she *would want* now if she knew her current state, without collapsing the two selves. |

  **Impossibility Result**
  You cannot jointly satisfy **Epistemic Humility**, **Prior Authority** (the form wins), and the **Welfare Floor**. If the prior self demanded death based on predicted suffering (Prior Authority), but empirical data shows she would not suffer (Epistemic Humility), and she is currently content (Welfare Floor), you must violate one. You cannot respect the form, the reality, and the patient's current well-being simultaneously.

  **Knockout Requirement**
  **Epistemic Humility** knocks out the most attractive theories. Strict precedent autonomy relies on the assumption that the prior self is the best judge of future interests. Once you admit empirical evidence that people are lousy at forecasting feelings, the moral weight of the signature collapses. It forces the theory to treat the directive as advice rather than command, which most "Form Wins" architectures cannot accommodate.

  **Evaluation**
  The "Form Wins" approach satisfies Prior Authority but violates Epistemic Humility and the Welfare Floor by enforcing potentially irrational harms on a contented patient. The "Person Wins" approach satisfies Current Authority and the Welfare Floor but violates Prior Authority by treating the earlier self as a stranger with no binding claim. Both fail to resolve the Contented Patient without importing external ethical values regarding what makes a life worth living.
