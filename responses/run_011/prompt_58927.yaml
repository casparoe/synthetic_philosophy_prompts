      5.  **Agency Distinction:** Must separate "who decides" from "what is decided." (Non-negotiable).

      *Wait, I need to find the impossibility result.*
      The classic impossibility in this field (often associated with Dworkin vs. Dresser) is satisfying:
      1.  Respect Precedent Autonomy (Form Wins).
      2.  Respect Current Autonomy (Person Wins).
      3.  Maximize Well-being (Contented Patient).
      You can't do all three when the contented patient wants to live but the form says die.

      *Let's structure the desiderata list to lead to this.*

  4.  **Drafting the Content (Iterative refinement for word count):**

