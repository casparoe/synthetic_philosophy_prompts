prompt: |-
  I'm a software engineer, no philosophy background, so bear with the framing. My team is building a tool for a hospital that surfaces a patient's advance directive at the bedside and flags when it conflicts with what the patient is asking for right now. Half the team thinks the signed form wins, the other half thinks the person in the bed wins, and I cant write the policy logic until I know what a correct answer would even look like. So I want the spec, not the answer.

  You're a philosopher who's spent real time on advance directives and personal identity — think of yourself as the person a clinical ethics committee calls when it's stuck. Think carefully: brainstorm every candidate requirement first, then cut hard and only show me the ones that do work.

  Write the desiderata for a theory of when an earlier self's directive has authority over a later self. For each one, give the case or consideration behind it and mark whether it's non-negotiable or just a pet requirement of one camp. Make sure the list handles at least these:

  - Trigger conditions. Her form says "when I can no longer name my grandchildren." She can't — but she confidently names three people who aren't them. Condition satisfied in letter, not in spirit. Is interpretation part of the theory or a separate engineering problem?
  - The self-silencing clause. She wrote "when I get there I'll insist I want to live. That's the disease talking, don't listen to me." A theory has to say whether a self can pre-discount its own future reports without making every later report worthless.
  - The contented patient: bad memory, no narrative continuity, genuinely enjoys her days, doesn't want to die, and nobody can point to harm she's experiencing.
  - The distinctions it can't collapse — having a say vs having the only say, same person vs same principal, what she wanted vs what she'd want if she knew.
  - Empirical stuff it can't contradict, e.g. that people are lousy at forecasting their own future feelings.

  Then the part I most want: which subset of these is jointly unsatisfiable, so I can treat that as an impossibility result and design around it — and which single requirement knocks out the most otherwise attractive theories. End with three sentences on how the two obvious answers do against the list. No names, no references, I can't look anything up.

  Max 700 words. A table is fine for the negotiable/non-negotiable column, but the reasoning behind each requirement has to be in prose.
