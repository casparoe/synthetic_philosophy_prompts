answer: |-
  Here is a precise principle that reconciles nearly all your verdicts, followed by an analysis of its implications, the cases it forces you to reconsider, and a plain answer to your question about the word's utility.

  ### The Principle: The Continuity-Complexity Test

  **Definition:** Reserve the unqualified label **"Collapse"** for cases where a society suffers the terminal failure of its defining socio-political complexity *and* a discontinuity in its cultural or demographic lineage (i.e., the population disperses, assimilates, or vanishes such that no immediate successor group claims the specific identity). Use **"Transformation"** or **"Relocation"** when complexity fails but the population persists as a coherent, traceable lineage that maintains cultural continuity.

  **The Two Clauses:**
  1.  **The Complexity Clause:** Did the central institutions (palaces, dynasties, script, urban planning) terminate?
  2.  **The Continuity Clause:** Can the constituent population be traced to a successor group that maintains a coherent cultural identity?

  *   **Collapse** = Complexity Terminates + Continuity Breaks.
  *   **Transformation/Relocation** = Complexity Terminates + Continuity Holds.

  ### Mapping Your Verdicts

  Here is how this principle adjudicates your existing cases:

  *   **Mycenaean (Collapse):** Fits both clauses. Palaces/Script terminated (Complexity), and the specific "Mycenaean" identity vanished into the Greek Dark Ages before re-emerging differently (Continuity Break).
  *   **Indus (Transformation):** Fits Clause 1 (Cities/Script ended), fails Clause 2 (Villages/crafts continued eastward; lineage holds). Verdict: **Transformation.**
  *   **Southern Maya (Nuanced):** Fits Clause 1 (Dynasties ended). Fails Clause 2 for the *people* (Maya persist), but fits Clause 2 for the *Southern Polity* (no successor state in the lowlands). Your refusal of the headline "The Maya Collapsed" is correct under this principle; "Southern Maya Lowland Polities Collapsed" is accurate.
  *   **Rapa Nui Pre-contact (Transformation):** Fits Clause 1 (Statue carving ended), fails Clause 2 (People persisted). Verdict: **Transformation.**
  *   **Rapa Nui 19th Century (Collapse):** Fits both clauses. Population devastated, culture fractured by external shock. Verdict: **Collapse.**
  *   **Chaco (Transformation):** Fits Clause 1 (Great Houses abandoned), fails Clause 2 (Descendants traceable to Pueblos). Verdict: **Relocation.**
  *   **Norse Greenland (Collapse):** Fits both clauses. Society terminated, lineage extinct locally (Inuit continuity does not count as *Norse* continuity). Verdict: **Collapse.**
  *   **Western Rome (Gaul vs. Britain):**
      *   *Gaul (Transformation):* Complexity changed, but Gallo-Roman lineage traces to medieval France.
      *   *Britain (Collapse):* Complexity ended, and Romano-British identity was subsumed/obscured by Anglo-Saxon migration (archaeologically invisible for a period). Verdict: **Collapse.**

  ### Implications for New Cases

  **1. The Abandonment of Angkor (15th Century)**
  *   **Analysis:** The court moved to Phnom Penh. State Hinduism/Buddhism shifted to Theravada Buddhism. The massive hydraulic city was abandoned.
  *   **Verdict:** **Transformation.**
  *   **Reasoning:** While the *complexity* of the Angkorian state apparatus ended (Clause 1), the Khmer people and their cultural lineage continued uninterrupted in the new capital and surrounding regions (Clause 2 fails). The "society" did not vanish; its seat of power moved.

  **2. The Closing of a Company Town**
  *   **Analysis:** This depends on whether you treat the town as an economic unit or a society.
  *   **Verdict:** **Collapse** (of the entity), **Relocation** (of the people).
  *   **Reasoning:** If you are writing about the *town* as an institutional entity, it is a collapse (institutions gone, place emptied). If you are writing about the *workers*, it is relocation. However, if the workers scatter individually into the general labor market and the specific "mining community" culture dissolves, it leans toward **Collapse** of that specific sub-society. If they move *en masse* to the next mine, it is **Relocation**.

  ### Verdicts You Must Abandon

  To maintain intellectual honesty with this principle, you must reconsider **Cahokia**.

  You classify **Chaco** as Relocation because descendants are traceable in the Rio Grande pueblos. Current archaeological consensus increasingly links **Cahokia** to similar successor groups (e.g., Osage, Quapaw, or broader Mississippian cultures). If your principle relies on *traceability of descendants* to distinguish Chaco (Relocation) from Cahokia (Collapse), you are on shaky ground.

  *   **The Conflict:** If Chaco is Relocation because we can name the grandchildren, and Cahokia is Collapse because the region emptied, you are defining "Collapse" by **regional depopulation** rather than **lineage discontinuity**.
  *   **The Fix:** You must either upgrade Cahokia to **Transformation/Relocation** (acknowledging the Mississippian continuity) or downgrade Chaco to **Collapse** (arguing the specific *Chacoan* religious system died, even if people lived). Given your emphasis on "same people become someone else's ancestors," consistency demands you treat Cahokia and Chaco similarly. **You should likely abandon the "Collapse" verdict for Cahokia** unless you can definitively prove a lineage break there that does not exist for Chaco.

  ### The "Traceability" Problem

  You asked: *If the only principle that saves every one of them has to make "collapse" turn on how far descendants and institutions can be traced rather than on what occurred, say so and explain whether the word still earns its place in my copy.*

  **Yes, that is exactly the case.**

  Your distinction between Indus (Transformation) and Mycenaean (Collapse), or Chaco (Relocation) and Cahokia (Collapse), rests almost entirely on **archaeological visibility of continuity**.
  *   In the Indus case, we *see* the villages.
  *   In the Mycenaean case, we *see* a Dark Age gap.
  *   In the Chaco case, we *have* oral traditions and material links to Pueblos.
  *   In the Cahokia case, the links are more diffuse.

  **Does the word still earn its place?**
  **Yes, but only as a technical term, not a sensationalist one.**

  If you use "Collapse" to mean "Bad things happened and things changed," it is scientifically useless and misleading (as with the Maya). But if you use "Collapse" to mean **"The specific combination of complexity and identity terminated beyond recovery,"** it is a vital distinction.

  It tells your reader: *"This wasn't just a change of government or a move to a new valley. This was a break in the chain. The specific way these people organized their world ended, and no one picked up that specific torch."*

  **Recommendation for your Copy:**
  Adopt the **Continuity-Complexity Test**. Use "Collapse" only when the *identity* dies, not just the *buildings*. This protects you from the "Maya Collapsed" error while allowing you to describe the severity of the Mycenaean or Norse situations. It forces you to be precise about *what* collapsed (the state, the people, or the region), which is the hallmark of good science journalism.
