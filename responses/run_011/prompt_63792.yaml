          *   *Verdict:* Sequence: Resistance -> Occasion -> Inquiry -> Reform. Concedes force is effective for the *ripe*. For the *unripe*, force isn't an option, so the ruler's character (virtue/expertise) matters more.

      *   **Q6: Durham vs. Wakefield/Buller.**
