answer: |-
  **MEMORANDUM**

  **TO:** Academic Accommodations Appeals Panel
  **FROM:** Faculty Representative, Department of Philosophy
  **RE:** Pre-Hearing Opinion – Case M (Cardiovascular Perfusion)
  **DATE:** October 24, 2023

  **Introduction**

  Student M's petition rests on the Extended Mind Thesis (EMT): that cognitive processes are not bound by the skull but extend into tools that are reliably available, automatically trusted, and deeply integrated into habit. Philosophically, her argument is coherent. If a notebook functions as biological memory due to constant access and trust, a locked tablet with instant search should qualify similarly. However, this panel does not adjudicate metaphysics; we adjudicate competence within a regulatory framework. My recommendation below balances the philosophical validity of M's claim against the functional requirements of licensure and public safety.

  **The Accreditation Constraint: Downstream Reliance**

  The strongest case for denial is not about fairness to other students, nor is it about cheating. It concerns the epistemic warrant of the qualifying exam. This exam is not merely a university assessment; it is a signal to the Certifying Board and, downstream, to patients and hospitals. The Board's handbook requires "unaided competence." While undefined, in the context of high-stakes medical licensure, this phrase functions as a guarantee of a specific cognitive architecture: internalized recall capable of functioning when technology fails.

  If we certify M as having met the "unaided" standard while she utilizes a synthetic search engine, we are altering the signal the exam sends. Should the Board later determine that tablet use violates their standards, our graduates' certifications could be voided, exposing the program to accreditation review. A Dean cannot sign off on an accommodation that renders the degree contingent on a regulatory waiver we do not possess. Therefore, for the Board-aligned Qualifying Exam, the accommodation must be denied unless the Board explicitly pre-approves the device as consistent with "unaided" status. We cannot unilaterally redefine the Board's competency standards.

  **The Technological Constraint: Retrieval vs. Inference**

  M's request involves more than external storage. The ed-tech report confirms the tablet uses embedding-based similarity matching to return synthesized paraphrases. This is not retrieval; it is offloaded inference. The Parity Principle argues that if the process occurred in the head, we would call it remembering. But if the tablet is generating paraphrases not verbatim in her notes, the process is not analogous to biological recall. It is analogous to consulting a colleague who summarizes your notes for you.

  This distinction matters. Memory preserves the agent's original encoding; inference introduces a layer of algorithmic interpretation. In a clinical crisis, knowing *exactly* what you studied is different from knowing what an algorithm thinks you studied. This moves the tool from being a "second hippocampus" to a "second opinion." While valuable in practice, it alters the construct being measured in a closed-book examination.

  **The Clinical Constraint: Safety and Latency**

  Regarding the hands-on simulation: The objection ("tapping on a tablet while running a heart-lung machine") is not ableism; it is a safety constraint regarding attentional division and latency. In perfusion, seconds matter. A wrist cue prompting a lookup introduces a interruption cost. If the device lags, or if the interface requires visual fixation during a critical flow adjustment, patient safety is compromised.

  However, not all simulation time is critical care. There are setup, priming, and checklist phases where cognitive load is high but physical immediacy is lower. We should not ban the tool from the entire simulation based on risks present only in the critical phase.

  **The Precedent Constraint: Accommodation vs. Redesign**

  Regarding the subsequent requests from students with ADHD and no diagnosis: We must distinguish between *accommodation* and *universal redesign*. Accommodations restore a candidate's function to meet an existing standard despite an impairment. They do not abolish the standard. Even if the EMT is true for all humans (i.e., we all rely on scaffolds), the licensure standard currently mandates specific internalized competencies. We cannot grant M's request on the grounds that *everyone* should be allowed scaffolds. We grant it only if the scaffold mitigates a documented impairment without violating the core competency signal. Accepting the non-diagnosed student's argument would require us to dismantle the licensure model entirely, which is beyond this panel's remit.

  **Proposed Standing Policy: The Integrated Agency Condition**

  To guide future panels, I propose we adopt the **Integrated Agency Condition** for determining when an external resource counts as part of a candidate's cognitive system for assessment purposes. An external tool is permissible as an accommodation only if:

  1.  **Transparency:** The tool requires negligible attentional resources to operate (it is "transparent" in use).
  2.  **Fidelity:** The tool retrieves or displays information without algorithmic synthesis, generation, or inference (it preserves the agent's original encoding).
  3.  **Reliability:** The tool's availability is guaranteed under the assessment conditions (no network dependency, battery failure risk, etc.).

  This criterion excludes tools that perform reasoning on behalf of the student (violating Fidelity) or require significant interface management (violating Transparency). It allows future panels to evaluate new technologies without re-litigating the philosophy of mind each time.

  **Recommendation**

  Based on the above, I recommend the following split decision:

  1.  **Written Qualifying Exam:** **Deny** the request to use the tablet *unless* the Program Director obtains written confirmation from the Certifying Board that this specific setup complies with their "unaided competence" requirement. If the Board does not waive the requirement, granting this accommodation exposes the student to certification revocation and the program to accreditation risk. We cannot accommodate her past the point of employability.

  2.  **Internal Coursework & Simulations:** **Approve** the use of the tablet for all internal program assessments and clinical simulations, subject to safety constraints. Specifically, the tablet may be used during setup, priming, and checklist phases. It must be stowed during active perfusion management where hands-free operation is impossible or latency introduces safety risk. The wrist cue should be disabled during critical phases to prevent forced attentional shifts.

  3.  **Standing Policy:** Adopt the **Integrated Agency Condition** outlined above for future technology-based accommodation requests.

  This path respects M's philosophical argument and supports her learning, while acknowledging that the university cannot unilaterally redefine the competency standards of a national licensure body.

  **[Signature]**
