answer: |-
  1. **The Moral Injury Objection (Doctoral Student)**
  "You argue the 'bad-faith burden' is smaller than the cost of alternative norms. But moral injury literature suggests that discovering one's state deliberately lied about the moral permissions of killing causes betrayal trauma comparable to the injury of fighting unjustly. If the cure (the lie) causes the same disease (moral injury) you claim to mitigate, your utilitarian calculus collapses. You are trading one source of trauma for another, not reducing the total burden."

  *Reply:* "You are right that the burden is real and psychologically costly. However, the trauma of moral injury typically stems from the violation of one's *own* moral code, often exacerbated by the belief that one has committed objective wrongs. The false norm protects the soldier from the paralyzing uncertainty of ad bellum judgment in the moment. While discovering the lie later is painful, it is a retrospective betrayal; the alternative is prospective complicity in unrestrained violence or hesitation that gets comrades killed. The burden compounds, yes, but the alternative—collapsing reciprocity—compounds bloodshed. I concede the cost is higher than standard 'noble lie' arguments admit, but it remains the lesser of two catastrophic costs."
  *Soft Spot:* "I lack empirical data on veteran outcomes specifically tied to *state-admitted* falsehoods versus *state-denied* atrocities. If betrayal trauma proves more debilitating than combat guilt, the calculus flips."

  2. **The Complicity Objection (Revisionist Philosopher)**
  "Even if the consequences are better, you are making the state complicit in moral corruption. By training soldiers to believe killing is permitted when it is not, the state turns them into moral monsters, albeit useful ones. You treat soldiers as mere means to social stability. This violates the dignity of the agent. A revisionist account demands we align training with truth, even if it makes fighting harder. You are prioritizing order over integrity."

  *Reply:* "I am not prioritizing order over integrity; I am prioritizing the lives of the innocent over the moral purity of the institution. The 'integrity' of training soldiers in revisionist truth assumes they can act on it. Given Step (i)—that ad bellum facts are inaccessible in combat—training them in that truth creates agents who are either confused or selectively obedient. The state's duty is to minimize harm. Corrupting the soldier's moral ontology is a grave wrong, but allowing the collapse of *in bello* restraints is a graver one. The state absorbs the moral guilt of the lie to spare the soldier the impossibility of the task."
  *Soft Spot:* "This relies on the claim that the state can 'absorb' guilt. If moral liability cannot be transferred, the state is simply committing a distinct wrong that isn't offset by consequences."

  3. **The Empirical Necessity Objection (Military Historian)**
  "Your Step (ii) claims restraints collapse without the equality norm. But history shows armies fought with intense ad bellum ideological zeal—revolutionary France, WWII Soviets—without immediately descending into atrocity. Restraints often come from command discipline and unit cohesion, not abstract moral equality. You are assuming a fragility in military discipline that hasn't always existed. If the norm isn't actually load-bearing, the lie is gratuitous."

  *Reply:* "Those examples are outliers that prove the rule. Ideological armies often *did* commit systemic atrocities precisely because they viewed the enemy as illegitimate criminals rather than equal combatants. The 'restraints' you cite often broke down when the ideological fervor hit resistance. The modern law of armed conflict relies on reciprocity: I treat your POWs well because you treat mine well. That reciprocity requires a shared fiction of equality. Without it, restraint becomes unilateral charity, which is the first thing cut when the tide turns. The norm is load-bearing because it sustains reciprocity, not just discipline."
  *Soft Spot:* "My historical selection is vulnerable. If you can show a sustained period of asymmetric moral training that maintained high compliance with proportionality, my necessity claim weakens."

  4. **The Redundancy Objection (International Lawyer 1)**
  "This sounds like the standard Walzerian separation of *jus ad bellum* and *jus in bello*. You are dressing up the familiar view that law and morality diverge here. If you are just saying 'keep the law as is because it works,' you haven't added anything to the literature. You admit the law doesn't claim moral permission, so why frame this as a moral argument about training?"

  *Reply:* "Walzer argues for a functional separation. I am arguing for a deliberate *institutional falsehood* in formation. The standard view says law protects status regardless of morality. I am saying the state must actively train soldiers to believe a moral falsehood to sustain that law. That is a stronger claim than divergence; it is an endorsement of state-sponsored moral error for functional ends. The novelty is in the mechanism: not just separating spheres, but actively maintaining the error within the soldier's psyche to preserve the legal sphere."
  *Soft Spot:* "If the audience sees 'training' as just 'legal compliance,' this distinction vanishes. I need them to see training as moral formation."

  5. **The Moral Truth Objection (Traditionalist Theorist)**
  "You assume the Moral Equality of Combatants is false. I hold it is true because soldiers are non-culpable threats. If I am right, your entire project is unnecessary. You don't need a lie if the equality is genuine. You are solving a problem that doesn't exist by lying to people about a truth they could accept."

  *Reply:* "Even if soldiers are non-culpable, the *permission* to kill cannot rest on that alone. If the cause is unjust, the killing lacks justification, even if the agent is excused. My argument holds even if you grant partial equality: the state still knows the cause is unjust. The training must bridge the gap between the soldier's excuse and the state's knowledge. Whether the soldier is culpable or not, the state knows the killing is not morally permitted in the aggregate. The lie remains necessary to bridge the state's knowledge and the soldier's action."
  *Soft Spot:* "If you convince the room that non-culpability *equals* permission, my premise collapses. I am betting the room accepts revisionism, but you are the test case."

  6. **The Trust Objection (Judge Advocate)**
  "You want the state to lie to soldiers. But command relies on trust. If soldiers suspect the state knows the moral permission is false, trust erodes. When I give a lawful order, I need them to believe it is right. If they think we are gaming the moral system, compliance drops. You risk creating a cynical force that follows ROE only when watched."

  *Reply:* "Trust is indeed vital. But trust is also built on competence and survival. Soldiers trust leaders who keep them alive and win. If telling the truth leads to hesitation and higher casualties, trust drops faster. The 'lie' is not a personal deceit by the commander, but a structural feature of the profession, like the assumption that risk is manageable. Soldiers accept professional fictions all the time. The key is that the state acknowledges the burden internally, even if the training remains uniform."
  *Soft Spot:* "I have no answer for the whistleblower scenario. If a commander explicitly tells a unit 'this is morally false but do it,' my model breaks."

  7. **The Legal Status Objection (International Lawyer 2)**
  "IHL never asserted moral permission. It grants legal status to prevent war from becoming slaughter. Why train morally at all? Train them on the law. If the law says you can shoot, you shoot. Dragging morality into training is where you introduce the confusion you claim to avoid."

  *Reply:* "I concede this point partially: IHL is legal status. But soldiers do not kill because of statutes; they kill because of moral permission. If you train only law, you create legalists who look for loopholes. You need a moral ethos to sustain restraint when the law is ambiguous. The 'false norm' is the moral ethos that supports the legal status. We cannot separate the soldier's conscience from the soldier's trigger finger."
  *Soft Spot:* "If I concede too much here, I undermine the need for the 'lie.' If it's just law, there is no moral falsehood, only legal technicality."

  8. **The Liability Objection (Revisionist Philosopher 2)**
  "If you train soldiers they are permitted to kill, they kill more readily. This increases their liability if they are later found to be on the unjust side. You are making them more liable by removing their epistemic uncertainty. A revisionist training would make them hesitate, reducing overall killing. You are increasing the body count to save a norm."

  *Reply:* "Hesitation in combat gets soldiers killed and often leads to disproportionate force when they finally react. A soldier who hesitates to shoot a combatant may panic and shell a village instead. The revisionist hope that 'moral hesitation' reduces killing is optimistic. disciplined permission reduces collateral damage by keeping engagement within rules. Increasing liability is a post-war concern; preventing atrocity is an in-war concern. I prioritize the latter."
  *Soft Spot:* "This assumes hesitation leads to escalation. If hesitation leads to disengagement, your claim fails."

  9. **The POW Reciprocity Objection (Judge Advocate 2)**
  "You rely on reciprocity. But if we admit the norm is false, does the enemy still treat our POWs as equals? If we say 'we know we aren't moral equals but pretend,' the enemy may say 'then we won't pretend either.' You jeopardize Geneva protections by admitting the fiction is a fiction."

  *Reply:* "The admission is internal to the state's ethical framework, not external propaganda. The state continues to assert equality diplomatically and legally. The 'acknowledgment' is for the philosophers and the policymakers, not the enemy. Reciprocity holds because the external behavior remains unchanged. The bad-faith burden is borne by the state, not signaled to the adversary."
  *Soft Spot:* "Leaks happen. If the internal stance becomes external policy, reciprocity collapses. I am relying on secrecy."

  10. **The Epistemic Objection (Traditionalist Theorist 2)**
  "Step (i) says ad bellum facts are inaccessible. In the information age, soldiers know more than you think. They have phones, news, internet. You are assuming a fog of war that doesn't exist for strategic facts. Soldiers can know the cause is unjust. Training them otherwise is gaslighting."

  *Reply:* "Tactical access is not strategic access. A soldier knows there is war, but not whether the war was necessary or proportional in its initiation. Strategic judgment requires intelligence they do not have. Even with phones, they see fragments. The state possesses the full intelligence picture. The asymmetry of information remains. They may suspect, but they cannot know. The training bridges the gap between suspicion and duty."
  *Soft Spot:* "If soldiers access classified leaks or undeniable evidence of aggression, Step (i) fails for that unit. I have no contingency for 'known unjust wars.'"

  ***

  **Preemptive Concession:**
  Concede the **Legal Status Objection (7)**. Open the Q&A by clarifying that you agree IHL is purely legal status and does not claim moral truth. This prevents the lawyers from spending time correcting your legal premises and allows you to focus on the *training culture* aspect, which is your actual contribution. It shows you know the law and isolates the philosophical claim.

  **Reply That Must Land:**
  The **Empirical Necessity Objection (3)**. If the audience believes armies can maintain restraint without the false norm of moral equality, your justification for the lie vanishes. You must convince them that reciprocity is fragile and depends on this specific fiction. If the norm isn't load-bearing, the bad-faith burden is gratuitous suffering.

  **Question Hoping Nobody Asks:**
  "Why not train soldiers in the revisionist truth (that unjust killing is impermissible) but rely on discipline and law to ensure they fight anyway? Why lie rather than demand obedience despite moral doubt?"
  *Fallback Answer:* "Because discipline cannot sustain action against deep moral conviction indefinitely. If soldiers believe killing is impermissible, they will eventually refuse, or kill with such guilt that they break. The law commands the hand, but the moral norm commands the will. You need the will to align with the hand to prevent atrocity. Obedience without moral permission is brittle; moral permission (even false) is durable."

  **Triage Assessment:**
  I have ranked the **Traditionalist Moral Truth Objection (5)** lower because you expect little resistance to Part 1. However, if the Traditionalist convinces the room that soldiers are genuinely non-culpable and thus *morally equal*, your entire project becomes unnecessary noise. That objection sinks the thesis more cleanly than the Moral Injury point, which only adjusts the cost-benefit analysis. Regarding Step (iii), the consideration that would make it false is evidence that the "bad-faith burden" spills over to erode *in bello* constraints themselves. If soldiers trained in a known lie become cynical about *all* rules (proportionality, discrimination), not just the ad bellum permission, then the lie destroys the very restraints it is meant to protect. If the falsehood is contagious, the strategy is self-defeating.
