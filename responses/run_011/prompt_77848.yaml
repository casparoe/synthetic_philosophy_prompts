  I take the second horn, denying your inference. That preference is an attitude, not a perception of intrinsic badness. When a patient prefers not to be pinched despite showing no distress, he offers a cognitive judgment detached from the motivational command constituting suffering. Badness is the imperative's force, not the sensory content it accompanies. Consider your dial: if phenomenal character remains fixed while willingness to endure shifts, minding is the locus of badness. You insist the feel drives preference, but the dial shows preference floating free of the feel. Asymbolic indifference is evidence because their motivational system is severed from sensory input; your patient merely has a conflicting cognitive report. If badness were in the feel, turning down the aversion dial should alter the sensation, yet you concede it does not. If the feel is constant while suffering vanishes, why insist suffering was in the feel rather than the response you varied?
