  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Baseline Endogeneity | a, c | The adoption of the SPI protocol itself changes the "expected play without agreement" baseline, creating a fixed-point problem where the safety constraint references a moving target. | formal | fatal | Concedes baseline must be counterfactual; dismisses risk as solvable via causal separation; replies that baseline is defined by "failure to agree" not "equilibrium of game". | yes (costs clarity on what counts as "agreement") | The operational definition of "default play" remains ambiguous in multi-agent ecosystems where SPI is common. |
  | 2 | Bargaining Regress | b | Selecting the weighting rule ($\lambda$) within the safe range requires the same bargaining effort and credibility as the original game, pushing the problem back one step without solving it. | conceptual | serious | Concedes haggling remains; dismisses severity via focal points (symmetry); replies that range is narrower than original outcome space. | yes (costs claim that SPI *solves* bargaining) | SPI reduces but does not eliminate bargaining friction; symmetry focal points may not exist in asymmetric games. |
  | 3 | Commitment Credibility | a, d | The conditional commitment to the device's recommendation is not binding; agents retain ex-post incentives to deviate (as per your toy case specification). | practical-institutional | fatal (humans)<br>serious (AI) | Concedes hard for humans; dismisses for AI via code inspection; replies that Clause (d) assumes verifiable decision procedures. | yes (costs universal applicability) | Reliance on AI transparency assumes no obfuscation or "treacherous turn" capabilities in advanced agents. |
  | 4 | Ex-Post Variance | a | Agents are risk-averse such that expected safety (ex-ante) does not compensate for the risk of receiving a payoff below the baseline expectation in realized outcomes. | formal | awkward | Concedes risk-aversion matters; dismisses via utility transformation; replies that SPI can be tailored to guarantee minimum payoff. | yes (costs simplicity of safety definition) | Standard SPI definition guarantees expected value, not worst-case outcome; risk-averse agents may reject SPIs. |
  | 5 | Normative Privilege | a | The "expected play without agreement" baseline has no moral or rational privilege; agents may rightfully demand more than safety relative to a threat point they could improve upon. | conceptual | awkward | Concedes baseline is arbitrary; dismisses via prudential necessity; replies that safety is a precondition for cooperation, not a moral claim. | yes (costs normative force) | SPI becomes a prudential heuristic rather than a normative obligation; stronger agents may reject it. |
  | 6 | Unfalsifiability / Immunization | conjunction | Any empirical failure of cooperation can be redescribed as a failure to meet SPI conditions (baseline mis-estimated, weights not shared), making the thesis immune to evidence. | conceptual | awkward | Concedes prescriptive nature; dismisses charge as category error; replies that conditions are empirically checkable in AI systems. | no (structural feature) | Reduces predictive power; makes the thesis hard to distinguish from "agents should cooperate if they can." |

  ### Unfalsifiability and Predictive Distinctiveness

  The charge that the thesis has been "qualified into immunity" holds partial water but depends on whether you view the thesis as descriptive or prescriptive. As a prescriptive norm ("agents *should* adopt"), empirical failures do not falsify the claim, only the feasibility of the conditions. However, if the conditions (baseline clarity, binding commitment, weight agreement) are so stringent that they rarely obtain, the thesis risks becoming vacuous advice ("cooperate if you can safely cooperate"). To avoid this, a proponent must concede that the thesis predicts *failure* in environments lacking transparency or pre-commitment technology, rather than explaining away every failure as a condition mismatch. The line falls at verification: if an AI system fails to SPI despite having verifiable code and shared randomness, the thesis is falsified; if humans fail, it is merely inapplicable.

  Regarding predictions, the SPI-default thesis distinguishes itself from rivals in three specific ways. First, against **unilateral cooperation programs** (e.g., FairBot), SPI predicts agents will not cooperate unconditionally but will demand correlated safety guarantees; it predicts *less* cooperation than unilateralism in low-transparency environments. Second, against **Nash Bargaining**, SPI predicts agents will prioritize avoiding outcomes worse than the baseline over maximizing the product of gains; it predicts more conservative agreements that cluster near the safety boundary rather than the utilitarian optimum. Third, against **value merger**, Clause (c) predicts agents will retain distinct utility functions and coordinate externally rather than integrating values; it predicts persistent pluralism rather than convergence. If advanced agents are observed merging values or cooperating unilaterally without correlation devices, the SPI-default thesis loses ground to these rivals.
