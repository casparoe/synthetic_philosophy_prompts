          *   *Weakness:* Plutarch isn't writing for a cult. He's writing for moral improvement of elites. If the reader knows the chronology is off (as Plutarch admits), the "belief" is broken.
          *   *Verdict:* The friend's point is weaker than she thinks. It relies on communal credulity, not text-internal logic.

      *   **Section 6: The Middle Position (Ethnography of Morality).**
          *   *Idea:* The story tells us what Plutarch's age *thought* virtue looked like, not what Solon *did*.
