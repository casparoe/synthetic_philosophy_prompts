answer: |-
  Here is a battle plan for your 45 minutes. It is designed to maximize the "aha" moment while keeping the arithmetic light enough that the service-hour kids don't check out.

  ### Part 1: The Three Checks (Your Specific Questions)

  **1. Does the example work, or is it too big?**
  It works, but **do not draw the matrix on the whiteboard.**
  *   **Why:** A 3x3 matrix with two numbers per cell is 18 numbers plus labels. Writing that neatly takes 7 minutes. Explaining how to read it takes 5. You will burn a quarter of your session before you start the actual math.
  *   **The Fix:** Use your one printed sheet for the matrix. Use the whiteboard *only* for the Expected Value (EV) calculations.
  *   **The Constraint:** A carrying example must have **symmetry** (so you don't have to explain why X is different from Y) and **integers** (so EV math is just halving). Your example has both. Keep it.
  *   **One Tweak:** In the Z row, the Column player gets 5 everywhere. This creates a "tie" situation for Dana's objection (see below). It's fine, but be precise about "Strictly Better" vs "Better or Equal."

  **2. Is Dana right about crossing out R first?**
  **Dana is technically wrong, but logically consistent.** Here is the distinction you need to wield:
  *   **Strict Dominance:** The new strategy must be *strictly better* (> ) in every single case.
  *   **Weak Dominance:** The new strategy is better or equal (≥) in every case, and strictly better in at least one.
  *   **The Math:** Against Row Z, the Mix(L,C) gives Col 5. Strategy R gives Col 5. Since 5 is not *greater than* 5, R is not *strictly* dominated at the start.
  *   **The Plan:** Stick to **Strict Dominance**. It is cleaner for beginners and avoids order-dependence paradoxes. If a student (or Dana) raises this, say: *"Great catch. It is 'weakly' dominated. But in this club, we only cross out things that are strictly worse. If we allow ties, the order matters and the math gets messy. Once Z is gone, R becomes strictly worse, so we cross it out then."*

  **3. Handling the Misconceptions**
  *   **"Dominated means numbers are smaller":** Let a student say this early. When comparing Z to X, someone will say "Z is 1, X is 0 sometimes, so Z is better." **Let this happen.** It proves why pure comparison fails.
  *   **"You cross it out because you know what they'll do":** Head this off during the definition. Say: *"We are crossing this out not because we know their move, but because this move is bad no matter what they do."*
  *   **"Mixing isn't a real choice":** This is the big one. Don't argue philosophy. Argue **access**. Say: *"You don't have to flip a coin. But if you are allowed to flip a coin, and that coin beats playing Z, then Z is trash. We assume rational players are allowed to use randomness."*
  *   **The Closing Question:** Do not ask "What is the answer?" Ask: *"If I change the payoff for Z from 1 to 1.9, does it still get crossed out? What if I change it to 2.1?"* This tests if they understand the threshold (the EV of the mix) rather than just memorizing "Z is bad."

  ---

  ### Part 2: The 45-Minute Lesson Plan

  #### 0:00 – 0:05: The Hook (Service Hour Survival)
  *   **Action:** Do not write anything yet. Stand in front of the room.
  *   **Script:** "Who here has played Rock, Paper, Scissors? Keep your hand up if you've ever lost because the other person guessed you were going to throw Rock."
  *   **Point:** "You lost because you were predictable. In Game Theory, being predictable is a mathematical error. Today we aren't playing games; we're proving why 'being random' isn't a cop-out, it's a weapon. We're going to find a strategy that looks safe, but is actually mathematically trash."
  *   **Handout:** Pass out the sheet with the matrix.

  #### 0:05 – 0:10: The Setup (Reading the Matrix)
  *   **Whiteboard:** Write `Row Player` and `Column Player`. Write `Payoff = (Row, Col)`.
  *   **Action:** Point to the handout.
  *   **Script:** "Row chooses X, Y, or Z. Column chooses L, C, or R. The first number is Row's points. Row wants high numbers. Column wants high numbers. Both of us are selfish. Both of us are smart."
  *   **Definition:** Write **Dominated Strategy** on the board.
  *   **Script:** "A strategy is 'dominated' if there is *another* way to play that gives you more points, **no matter what the other person does.** If you have a dominated strategy, you are literally burning points by playing it."

  #### 0:10 – 0:20: The Struggle (Pure Dominance)
  *   **Goal:** Make them feel stuck.
  *   **Action:** Ask: "Look at Row. Can we cross out X, Y, or Z?"
  *   **Expected Response:** Someone will compare Z to X. "Z gives 1, X gives 0. Z is better."
  *   **Whiteboard:** Write `Z vs X`. Under L: `1 < 4`. Under C: `1 > 0`.
  *   **Script:** "See the problem? Against L, X is better. Against C, Z is better. Neither dominates the other. What about Z vs Y?" (Same result).
  *   **The Trap:** Let them sit in this silence for 30 seconds. Let them think the game is unsolvable.
  *   **Script:** "So Z isn't beaten by X. Z isn't beaten by Y. Is Z safe?"

  #### 0:20 – 0:30: The Reveal (Mixed Dominance)
  *   **Action:** This is the core. Move to the whiteboard.
  *   **Script:** "What if I don't play X. What if I don't play Y. What if I play... both?"
  *   **Whiteboard:** Write `0.5 X + 0.5 Y`.
  *   **Script:** "I flip a coin. Heads I play X, Tails I play Y. I don't tell Column. What is my Expected Value?"
  *   **Calculation (Do this live):**
      *   "If Column plays L: Half the time I get 4, half I get 0. Average is **2**." (Write `2` under L).
      *   "If Column plays C: Half the time 0, half 4. Average is **2**." (Write `2` under C).
      *   "If Column plays R: Half the time 2, half 2. Average is **2**." (Write `2` under R).
  *   **Comparison:** "Now compare the Coin Flip to Strategy Z."
      *   "Against L: Coin gets 2, Z gets 1."
      *   "Against C: Coin gets 2, Z gets 1."
      *   "Against R: Coin gets 2, Z gets 1."
  *   **The Kill:** "The Coin Flip beats Z in every single case. 2 is strictly greater than 1. So Z is dominated."
  *   **Action:** Ask someone to come up and cross out Row Z on the handout (or draw a big X on the board version).
  *   **Addressing the "Cheating" Objection:** If someone says "But you can't play two rows," say: *"You can't. But you can commit to a randomization device. If the option to randomize exists, Z is never a best response. Rational players have access to coins."*

  #### 0:30 – 0:35: The Cascade (Column Player)
  *   **Script:** "Row is rational. Row will never play Z. We can ignore that row. Now look at Column."
  *   **Action:** Focus on L, C, R payoffs in rows X and Y only.
  *   **Script:** "Can Column cross out R?"
  *   **Math:** "Compare R to a 50/50 mix of L and C."
      *   "If Row plays X: Mix gets 2.5. R gets 2."
      *   "If Row plays Y: Mix gets 2.5. R gets 2."
  *   **Dana Check:** "What about Row Z? We don't care. Row Z is dead. We assume Row won't play it."
  *   **Action:** Cross out R.
  *   **Result:** "We are left with a 2x2 box. X/Y vs L/C."

  #### 0:35 – 0:40: The Cliffhanger
  *   **Action:** Look at the remaining 2x2.
      *   X vs L/C is (4,0) and (0,5).
      *   Y vs L/C is (0,5) and (4,0).
  *   **Script:** "Look at what's left. If I play X, you play C. If you play C, I play Y. If I play Y, you play L. It cycles forever."
  *   **Point:** "Dominance got us here, but it can't solve this. We eliminated the 'trash' strategies, but we're left with a game where the only rational move is to keep the other person guessing. This is why we need Mixed Strategy Equilibrium... which is next week." (End on the high note that there is more to learn).

  #### 0:40 – 0:45: The Check & Wrap
  *   **The Closing Question:** Do not ask "Did you understand?" Ask this:
  *   **Script:** "I'm going to change the game. I change the payoff for Z. Instead of 1 point everywhere, Z now gives **1.9** points everywhere. Do we still cross it out?"
      *   *Wait for answer.* (Yes, because Mix EV is 2).
  *   **Script:** "Okay, what if Z gives **2.1** points everywhere?"
      *   *Wait for answer.* (No, because 2.1 > 2).
  *   **Why this works:** If they just watched you do arithmetic, they will guess. If they understood *dominance*, they know it depends on the EV of the mix.
  *   **Dismissal:** "Next week we solve the 2x2. Bring a coin."

  ---

  ### Part 3: Emergency Scripts (When things go wrong)

  **If they stare blankly at the EV math:**
  *   **Stop.** Do not proceed.
  *   **Say:** "Imagine I play this game 100 times. 50 times I play X, 50 times I play Y. If you play L every time, I get 4 fifty times and 0 fifty times. Total 200 points. Average per game? 2."
  *   **Visual:** Draw a tree diagram for just one column if needed.

  **If someone says "But Column knows you're mixing":**
  *   **Say:** "Column knows I *might* mix. Column doesn't know the outcome of the coin flip before they play. They have to pick L, C, or R before my coin lands."

  **If you run out of time:**
  *   **Cut:** The Column Player elimination (0:30-0:35).
  *   **Keep:** The Row Player Mixed Dominance.
  *   **End:** "So Z is trash. If we cross Z out, the game changes completely. Next week we see how that collapses the rest of the board." (It is better to fully explain one side than to rush both).

  ### Summary Checklist for You
  1.  **Print:** 14 copies of the matrix.
  2.  **Board:** Leave space for `0.5 X + 0.5 Y` calculations.
  3.  **Mindset:** You are not teaching them to solve games; you are teaching them that **randomness is a tool**.
  4.  **Dana:** If she speaks up, validate her logic ("You're checking for weak dominance") but hold the line ("We're doing strict dominance today").

  You've got this. The "stuck" phase is the most important part—if they don't feel the pain of pure strategies failing, the mixed strategy cure won't feel like a miracle. Make them wait for it.
