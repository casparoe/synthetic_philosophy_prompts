prompt: |-
  Taking a seminar on promissory obligation right now and I've sort of talked myself into a view I want stress-tested before I write my final paper on it. I'd rather find out it's junk now than in front of the whole seminar.

  Here's what I think. Promises don't have any binding power of their own — there's no special normative-power trick where uttering "I promise" manufactures an obligation out of nothing. What actually happens is that promising hands someone a reason to reorganize their plans around your doing X, and the duty you're under is just the ordinary duty not to screw over someone who reorganized their plans on your say-so. So the strength of the obligation tracks the reliance cost: how much worse off the promisee ends up for having counted on you. My verdicts, so you can see the shape of it:

  - promised a friend I'd help them move, they didn't rent a truck and burned a whole Saturday waiting → very binding, obviously
  - promised some person in a forum I'd mail them my zine, they lost nothing but a few minutes of mild hope → basically not binding, it's more like being a jerk than breaking a promise
  - promised my grandmother on her deathbed I'd look after the cat, when she was past the point of relying on anything → binding, but only derivatively, because my siblings had already arranged things around it
  - promised to do something I was already morally required to do anyway → little or no extra obligation

  What would count against this? Give me the map of its exposure, ranked from fatal to merely awkward. I want the intuitions and case-shapes that a reliance-cost account can't describe, and I want you to say which ones a committed defender of my own view would concede as counting against it — where would I be the one saying "yeah, that's a real problem" instead of explaining it away. I have a suspicion there's something about release and waiver that I can't handle, i.e. that the promisee can just let me off and then the duty vanishes even though the reliance cost already got spent, but I haven't been able to pin down why that's supposed to be so bad for me. Tell me if that's actually a defeater or if I'm overthinking it.

  Then the honesty check: does my view risk anything at all? Someone in the seminar said my fallback move — that reliance cost includes the lost opportunity to have made other plans, so every breach costs something — turns the proportionality scale into decoration, since everything gets a nonzero score and the ordering never bites. Is that right? Is a view insulated that way actually broken, or is that just the price any reductive account of an obligation pays?

  Finally, what does my view predict that the rivals don't — the assurance-style account (we read Scanlon's Principle F) and the practice-based ones that make the duty fall out of the institution of promising? I'm hunting for a class of case where those come apart from mine in a way I could put in the paper and defend. No reading list, I already have one and half of it unread.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is taking a seminar on promissory obligation and has developed a specific view (a reliance-based account, specifically focusing on *reliance costs* as the source and measure of the obligation).
      *   **Goal:** Stress-test this view before writing a final paper. They want to know where it fails, ranked by severity (fatal vs. awkward).
      *   **Specific Concerns:**
          *   Release/Waiver (they suspect this is a problem).
          *   Honesty Check on the "lost opportunity" defense (does it make the theory vacuous?).
          *   Comparative Advantage (what does this view predict that Assurance/Scanlonian or Practice/Institutional views don't?).
      *   **Constraints:** No reading list (they have enough). Focus on intuitions, case-shapes, and argumentative vulnerabilities.

  2.  **Deconstruct the User's View:**
      *   **Core Claim:** Promises create no *sui generis* obligation.
      *   **Mechanism:** Promises induce reliance (plan reorganization).
      *   **Normative Source:** The duty not to harm those who relied on you (a duty of non-maleficence or fairness regarding reliance).
      *   **Measure of Obligation:** Proportional to reliance costs (how much worse off the promisee is).
      *   **Key Verdicts:** High reliance = strong duty; Low reliance = weak duty; No reliance (deathbed) = derivative duty; Redundant promise = weak/no extra duty.

  3.  **Brainstorming Objections (The "Map of Exposure"):**

      *   *The Release/Waiver Problem (User's Suspicion):* If the duty is based on *harm* (reliance cost), why can the promisee waive it? Once the harm is done (or the risk is created), a third party (morality) should care. If I break a promise and you rely, you are harmed. Why does *your* saying "it's okay" undo the *harm* or the *wrong*?
          *   *Severity:* High. This strikes at the nature of the right. Is it a right *in personam* or a duty to the moral order?
      *   *The "Overprotection" Problem (Fuller/Perdue style):* Reliance damages usually cap at expectation damages in contract law, but in morality, do we owe *only* reliance? If I promise you \$100, you rely \$10, and I keep the \$100, do I only owe you \$10? The user says obligation *tracks* reliance cost. This suggests if reliance is low, the breach is minor. But intuitively, breaking a promise to pay \$1M where reliance was \$0 (I just wanted the money) is still a huge wrong.
      *   *The "Invitation to Reliance" vs. "Actual Reliance":* Scanlon's Principle F focuses on the *expectation* created, not necessarily the *cost* incurred. If I promise but you don't rely (you hedge), have I wronged you? User says "basically not binding." Counter-intuition: Breaking a promise is wrong even if the promisee was smart enough not to get hurt.
      *   *The "Lost Opportunity" Defense (Honesty Check):* User worries that saying "you lost the chance to make other plans" makes *every* breach costly, rendering the scale useless.
          *   *Analysis:* If *every* breach has *some* reliance cost, then the theory collapses into "all promises are equally binding based on existence of promise," which defeats the purpose of the reliance *measure*.
      *   *Deathbed Promises:* User handles this via siblings relying. What if no one relies? (e.g., "Promise me you'll think of me.") Reliance account says no duty. Intuition says there is a duty.
      *   *Mutual Consent/Practice View:* Why do we use the words "I promise"? If it's just reliance, why not just say "I intend to"? The practice view explains the linguistic convention.

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the view (it's a classic Reliance Theory, akin to Fuller/Perdue or Atiyah, but applied to morality).
      *   **Section 1: Map of Exposure (Ranked Objections).**
          *   *Fatal:* The Release/Waiver Problem (The "Normative Power" objection).
          *   *Fatal/Serious:* The Expectation vs. Reliance Gap (The "Gratuitous Promise" problem).
          *   *Awkward:* The Deathbed/No-Reliance Case (User's workaround is fragile).
          *   *Awkward:* The "Already Obliged" Case (Moral Redundancy).
      *   **Section 2: The Honesty Check (Lost Opportunity).**
          *   Address the "vacuousness" charge. If *every* promise entails lost opportunity cost, the metric loses discriminatory power. It turns the view into a binary (promise made = duty) rather than a scalar (reliance amount = duty strength).
      *   **Section 3: Comparative Predictions (The "Sell" for the Paper).**
          *   Contrast with Scanlon (Assurance) and Practice/Institutional (Rawls/Shiffrin).
          *   *Case Study:* The "Hedged Promisee" (I promise, you don't rely). Scanlon says wronged; User says not really.
          *   *Case Study:* The "High Stakes, Low Reliance" (I promise \$1M, you spend \$0). User says low duty; Rivals say high duty.
      *   **Section 4: Strategic Advice for the Paper.**
          *   Don't hide the weaknesses; frame them as features (e.g., "Promissory inflation is a bug, not a feature").

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Release Objection:* Why is it fatal? Because obligations based on harm (torts) generally aren't waivable *after* the harm, or if they are, it's because of autonomy, not because the harm vanished. But in promising, the *duty to perform* vanishes upon release, not just the duty to compensate. If the duty is "don't harm reliance," releasing me doesn't un-harm the reliance. If the duty is "perform," release makes sense. The user's view conflates the duty to perform with the duty to compensate. *Correction:* The user says the duty is "not to screw over someone." If they release me, they accept the screwing over? No, release happens *before* breach usually. If I release you *before* you breach, no reliance cost has happened yet. But why does my word alone stop the obligation? Because I created the expectation. If the obligation is *only* about reliance costs, the release is mysterious.
      *   *Refining the "Lost Opportunity" point:* This is crucial. If the user argues "You lost the chance to find someone else," that is an *expectation* interest masquerading as reliance. It assumes the promise would have been kept. That begs the question.
      *   *Refining the Rivals:* Scanlon's Principle F is the biggest rival. It grounds it in the wrong of manipulating expectations, not the cost of reliance. The Practice view (Shiffrin) grounds it in the social practice of creating obligations.
      *   *Specific Case for the Paper:* The "Empty Promise to a Cynic." I promise you X. You know I'm a flake, so you make no plans based on it. I break it.
          *   User: No harm, no foul (or minimal).
          *   Scanlon: You violated the principle of fidelity/assurance.
          *   Practice: You violated the norm of the institution.
          *   *Why this is good:* It isolates the "obligation vs. harm" distinction.

  6.  **Final Review against User Constraints:**
      *   No reading list? Check.
      *   Rank objections? Check.
      *   Address Release/Waiver specifically? Check.
      *   Address "Lost Opportunity" vacuousness? Check.
      *   Identify unique predictions? Check.
      *   Tone: Seminar-appropriate (rigorous, critical, but constructive).

  7.  **Final Polish:** Ensure the distinction between *contract law* reliance (Fuller/Perdue) and *moral* reliance is clear, as the user is in a philosophy seminar, not a law school (though the overlap is heavy). The user's view is essentially a moralized version of the reliance theory of contract.

      *(Self-Correction during drafting)*: I need to be careful with the "Release" objection. If the release happens *before* reliance, there are no costs yet. So the reliance theorist can say "No reliance = no duty." But usually, release happens *after* the promise is made, potentially *after* some reliance has started. If I've already bought the ticket based on your promise, and you say "I release you," but I still have the ticket... wait, release usually means "You don't have to do X." If I already spent money, you releasing yourself doesn't refund me. But the *obligation to perform* vanishes. The reliance theorist struggles to explain why the *performance* duty vanishes if the *harm* (reliance) is already sunk or potential. Actually, the stronger point is: Why does the *promisee* have the power to dissolve the duty? If the duty is "Do not harm," that's a duty to the moral order, not just to the victim. Victims can forgive torts, but they can't usually authorize future negligence. But they *can* release promisors. This suggests the duty is *owed to them* specifically in a way tort duties aren't. The reliance view struggles to capture this "power of release."

      *Wait, let's look closer at the "Lost Opportunity" point.* If I promise to meet you at 5. You lose the opportunity to meet someone else at 5. That is a reliance cost. But that cost exists for *every* promise. So the "scale" the user mentions (strength tracks reliance cost) becomes flat. Every promise has *some* opportunity cost. So every promise is *equally* binding (modulo the magnitude of opportunity cost, which is hard to measure). This makes the theory lose its explanatory power regarding *why some promises feel heavier than others* (e.g., deathbed vs. casual).

      *Okay, ready to write.*
answer: |-
  This is a classic **Reliance Theory** of promissory obligation (philosophically akin to Atiyah or a moralized Fuller/Perdue). It is a robust, defensible position, but it has specific, well-known fault lines. Since you are in a seminar, your peers will likely be armed with Scanlon (Assurance) and Shiffrin (Practice/Institutional).

  Here is the stress test you asked for, ranked by severity, followed by the honesty check on your "lost opportunity" defense and the comparative advantages you can leverage.

  ### I. Map of Exposure (Ranked Objections)

  #### 1. Fatal: The Power of Release (Waiver)
  You suspected this, and your suspicion is correct. This is the hardest hill to die on for a reliance theorist.
  *   **The Case:** I promise to drive you to the airport. You haven't bought a ticket yet (zero reliance cost). You then say, "Don't worry about it, I'm taking the train." I am released.
  *   **The Problem:** On your view, the obligation is generated by the *harm* of reliance (or the risk thereof). If no reliance has occurred, there is arguably no duty yet. But even if reliance *had* occurred (you bought a non-refundable ticket based on my promise), you can still release me from the duty to *drive you*.
  *   **Why it bites:** If the duty is "Do not harm someone who relied," that is a duty of non-maleficence. Generally, victims cannot authorize future negligence that harms them ("I release you from the duty to drive safely"). But in promising, the promisee has a **normative power** to dissolve the obligation entirely.
  *   **The Concession:** You have to admit that reliance explains the *damages* (compensation) but fails to explain the *performance duty* or the *power of release*. A committed reliance defender must argue that "release" is just the promisee agreeing to absorb the reliance cost themselves. But that feels wrong: release eliminates the wrong, it doesn't just accept compensation.
  *   **Verdict:** **Fatal** to the claim that reliance is the *sole* source of the obligation. It suggests the obligation is a right the promisee holds, not just a shield against harm.

  #### 2. Fatal: The "Gratuitous Promise" (Expectation vs. Reliance)
  *   **The Case:** I promise to give you my vintage guitar tomorrow. You don't do anything differently (no reliance). You just want the guitar. I keep the guitar.
  *   **The Problem:** Intuitively, I have wronged you significantly. You are out a guitar, not out of pocket expenses. Your view suggests the obligation is weak or non-existent because your "plans" weren't reorganized in a way that incurred a cost.
  *   **Why it bites:** This view collapses the distinction between a **promise** and a **prediction**. If I say "I predict I will give you the guitar" and you rely, I might owe you reliance costs if I'm wrong (negligent misrepresentation). But if I say "I promise," I owe you the *guitar*. Your view makes the object of the obligation the *reliance interest*, whereas promissory intuition says the object is the *expectation interest*.
  *   **Verdict:** **Fatal** to the proportionality claim. If obligation strength tracks reliance cost, then high-stakes promises with low reliance (e.g., "I promise not to tell your secret," where you tell no one else) become trivial obligations. They are not.

  #### 3. Awkward: The "Cynical Promisee" (Hedging)
  *   **The Case:** I promise to help you move. You know I'm flaky, so you rent the truck anyway and hire movers as backup. You incur *no* reliance cost on my promise. I bail.
  *   **The Problem:** Did I break a promise? Yes. Did I violate a duty on your view? Barely, because you weren't made worse off by counting on me.
  *   **Why it bites:** This makes the bindingness of the promise dependent on the **credulity of the promisee**. A smart promisee (who hedges) gives me a weaker obligation than a naive promisee (who goes all-in). This seems to get the normative location wrong: the duty should stem from *my* commitment, not *their* gullibility.
  *   **Verdict:** **Awkward.** You can argue that they lost the "opportunity to find a more reliable mover," but that bleeds into the "lost opportunity" defense (see below).

  #### 4. Awkward: The Deathbed Promise (Your Workaround)
  *   **The Case:** You handled this by invoking third-party reliance (siblings).
  *   **The Problem:** What if the promise is truly private? "Promise me you'll think of me kindly." No siblings, no third parties, no plan reorganization.
  *   **Why it bites:** Your view predicts no obligation. Intuition says there is a solemn obligation. To save this, you have to argue that *you* reorganized your plans (psychic cost).
  *   **Verdict:** **Awkward.** It forces you to internalize all reliance costs to the promisor or invoke metaphysical reliance, which weakens the "hard-nosed" appeal of your theory.

  ---

  ### II. The Honesty Check: The "Lost Opportunity" Defense

  You asked: *Does arguing that "reliance cost includes the lost opportunity to have made other plans" turn the proportionality scale into decoration?*

  **Yes. It basically does.**

  Here is the logic your seminar peers will use to corner you:
  1.  To claim "lost opportunity" as a reliance cost, you must assume the promise *would have been fulfilled*.
  2.  If you assume the promise would have been fulfilled, you are smuggling in the **Expectation Interest**.
  3.  If *every* promise entails the loss of the opportunity to make other arrangements, then *every* promise has a non-zero reliance cost.
  4.  If every promise has a non-zero cost, your "sliding scale" of obligation strength collapses. A promise to mail a zine and a promise to help move both incur "lost opportunity costs."
  5.  Therefore, your view cannot explain why one is "very binding" and the other is "basically not binding" without arbitrary line-drawing.

  **Is this broken?**
  It is not *logically* broken, but it is **theoretically vacuous**. If the metric (reliance cost) applies universally and indistinguishably to all cases, it does no work. You are effectively saying "Promises are binding because they are promises," but using "reliance" as a synonym for "commitment."
  *   **The Price:** A reductive account pays a price if it has to stretch its core concept (harm/cost) so far that it covers everything. If you have to count "lost hope" or "lost opportunity" as a cost, you are no longer doing a reliance theory; you are doing an assurance theory in disguise.

  ---

  ### III. Comparative Predictions (The "Sell" for Your Paper)

  You need a case where your view yields a *better* or at least *distinct* verdict than Scanlon (Principle F/Assurance) or the Practice View (Shiffrin/Rawls). Don't try to win on the "Deathbed" case; you will lose. Win on the **"Promissory Inflation"** case.

  #### The Case: The Trivial Promise vs. The Moral Duty
  **Scenario:** I promise to meet you for coffee at 3 PM. I also have a general moral duty to be where I said I would be (to not waste your time).
  *   **Practice/Scanlon View:** The promise creates a *new*, distinct obligation. It "ratchets up" the normative status of the act.
  *   **Your View:** The promise adds little or no extra obligation (as you noted in your verdicts). It merely clarifies the reliance stakes.

  **Why this is a winning angle:**
  There is a strong intuition that **promising cannot create obligations to do immoral things**, and **promising adds little weight to things we are already strictly required to do.**
  *   **Prediction:** Your view predicts that "promissory obligation" is not a special *sui generis* category. It is parasitic on background duties (non-maleficence, fairness).
  *   **The Rival's Problem:** Practice views struggle to explain why we can't promise to do evil (the "content constraint"). If the institution creates the duty, why doesn't it create the duty to murder? (They usually have to add a caveat).
  *   **Your Advantage:** You can say, "I don't need a caveat. If the reliance is based on an immoral act, there is no duty not to harm that reliance because there was no right to rely."
  *   **The "Overprotection" Argument:** Argue that the Rival views (Scanlon/Practice) lead to **Promissory Inflation**. They make every utterance of "I promise" a heavy moral weight. Your view explains why we can casually say "I promise I'll call" without feeling the weight of a moral transgression if we get busy. Your view matches the **phenomenology of casual promising** better than the rivals.

  #### The Specific Class of Case for the Paper:
  **"The High-Stakes, Zero-Reliance Promise."**
  *   **Setup:** I promise to donate $10,000 to your charity. You do not budget for it; you do not count on it (perhaps you know I'm rich and fickle). I keep the money.
  *   **Scanlon/Practice:** I have committed a serious wrong. I violated the principle of fidelity / the norm of the institution. The size of the promise matters.
  *   **Your View:** I have committed a minor wrong (or none). You lost nothing. You were not harmed.
  *   **Defense:** Defend the intuition that **moral wrongs require victims or harm.** If the promisee is indifferent and unharmed, why is the moral universe out of joint? Use this to attack the "magic" of the Performative Utterance in rival theories. Argue that the rivals are fetishizing the *words* rather than the *human impact*.

  ### Summary of Strategic Advice

  1.  **Concede Release:** Do not fight the Release/Waiver objection head-on. Concede that reliance explains the *harm* but not the *power*. Frame your view as an account of **why promises matter** (the stakes), not an account of **promissory authority** (the power). This limits the scope but saves the theory from falsification.
  2.  **Drop the "Lost Opportunity" Defense:** It makes your theory vacuous. Instead, lean into **tangible reliance**. Admit that some promises (casual ones) *are* weakly binding. That is a feature, not a bug. It explains why we feel guilty about breaking a move-help promise but only slightly awkward about breaking a zine-mailing promise.
  3.  **Attack the "Magic":** Your strongest rhetorical move is to frame the rivals as believing in "normative magic" (words creating duties ex nihilo). Position your view as the **naturalistic, grounded alternative**.
  4.  **The "Content Constraint" Win:** Emphasize that your view naturally handles immoral promises (no duty to rely on harm) whereas Practice views struggle to explain why the "institution of promising" doesn't cover mafia contracts.

  If you write the paper as "A Defense of Reliance as the *Measure* of Promissory Stakes" rather than "The *Source* of Promissory Obligation," you will survive the seminar. If you claim it is the sole source, the Release objection will eat you alive.
