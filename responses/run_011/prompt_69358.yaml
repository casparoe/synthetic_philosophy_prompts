  **The Kestrel Valley Land Bank: A Proposal for Local Prosperity via the Acre-Token**

  **Executive Summary**

  1. Whether the true wealth of a district consists not in the gold locked in vaults but in the industry of its people and the improvement of their lands.
  2. Whether money is rightly understood as a ticket or counter denoting a claim upon the labour of another rather than wealth itself or a commodity to be hoarded for private gain.
  3. Whether the Kestrel Valley Land Bank proposes to issue such counters secured upon the productive capacity of the valley itself rather than on the credit of distant merchants or banks.
  4. Whether these tokens exist nowhere but in the ledger and are understood to be settled eventually in hours of work performed by members in good standing within the community ledger.

  **The Problem**

  5. Whether a scarcity of metal coin has ever prevented idle hands from being employed within the town or prevented the building of houses and the planting of crops.
  6. Whether hoarding such metal is not a confusion of the sign for the thing signified to the detriment of the public welfare and a mistake regarding the nature of monetary signs and symbols.
  7. Whether a town may starve amidst plenty merely because the counters required to move goods are locked in a chest while the fields lie fallow and the workers stand idle.
  8. Whether a greater quantity of money is worth anything unless it sets idle hands to work upon the land effectively or promotes anything other than the circulation of goods and services among neighbours.

  **Mechanism**

  9. Whether paper currency issued by a public bank might not circulate more freely than heavy specie among the neighbours without the burden of transporting heavy metal from market to market.
  10. Whether the quantity of such currency ought to be left to chance or deliberately managed for the public good by trustees who understand the needs of the local economy better than foreign speculators.
  11. Whether increasing the number of tickets serves any end unless it sets more workers to productive tasks within the district or whether it merely raises prices without benefiting the productive classes of society.
  12. Whether the amount in circulation is a matter for deliberate public management rather than something to be left to find its own level or whether it requires the steady hand of public management to ensure stability.

  **Collateral**

  13. Whether the land of the district provides a sufficient security for the value of these tokens in the eyes of the members who know the quality of the soil and the value of the improvements.
  14. Whether an acre of improved pasture is not a more stable foundation than a promise to pay silver which may not exist and which may be subject to the whims of international markets and trade.
  15. Whether the value of the token derives from the land or from the labour that the land supports through the medium of exchange that facilitates the movement of labour from hand to hand.

  **Governance**

  16. Whether the management of circulation should reside in those who profit from scarcity or in trustees of the common welfare and who are accountable to the members rather than to shareholders seeking profit.
  17. Whether the directors of the Bank are empowered to adjust the flow of tokens according to the seasonal needs of harvest and building when the demand for liquidity is highest among the farmers.
  18. Whether the community retains the right to query the directors on the necessity of any contraction in the supply of credits when the circulation appears to stagnate or become too rapid.

  **Roadmap**

  19. Whether the initial issuance shall be limited to fifty thousand acre-tokens to ensure stability among the early adopters and to prevent any initial inflation that might undermine confidence in the token.
  20. Whether this limit might be reviewed should the industry of the valley expand beyond current expectations and require fluidity and the capacity of the land to support a greater volume of transactions.
  21. Whether the administrative capacity to record transactions constitutes the only true boundary on the supply of money in economy since the tokens are merely records of claims upon future productive capacity.

  **Risk Factors**

  22. Whether the appraisal of land collateral rests upon competent surveyors appointed by the community to judge the value and whether such surveyors are immune to the pressure of influential members of the bank.
  23. What remedy exists should the market value of said land decline relative to the tokens in circulation among the neighbours and whether the collateral remains sufficient to back the outstanding tokens in ledger.
  24. Whether the future labour promised to settle accounts remains valid if the worker departs the district for another town and whether the debt remains upon the land or vanishes with the person.
  25. Whether a member may refuse to honour the token with work without penalty to the integrity of the whole scheme and whether such refusal constitutes a breach of the mutual agreement among members.

  > The sceptic notes that land cannot be eaten and labour cannot be stored. He argues that without external convertibility, the token is a closed loop of mutual debt. This structure relies entirely on trust which may evaporate.

  **Responses to Scepticism**

  26. Whether a closed loop of mutual debt is not preferable to an open loop of mutual starvation in times of scarcity and whether mutual dependence is not the very foundation of civil society itself.
  27. Whether the inability to eat land prevents the land from growing food when worked by hands motivated by the token and whether the food produced is not real wealth regardless of the medium.
  28. Whether storing labour is necessary when the token stores the claim upon future labour rather than the labour itself and whether the record of the intention to work is not sufficient security.

  **Frequently Asked Questions**

  29. Whether the acre-token can be exchanged for goods outside the valley where the land security holds no sway and whether the token is useful only within the bounds of the valley lands.
  30. Whether the bank guarantees redemption in specie upon demand from any holder of the paper notes or whether the paper is valuable only so long as the land remains secure.
  31. Whether a town whose units are only counters has actually created anything, or merely recorded an intention.
