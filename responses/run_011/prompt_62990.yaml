answer: |-
  ### Part 1: The Conceptual Grid

  Before handing out the instrument, here is the map of the territory you are exploring. This grid is built on three axes derived from your constraints.

  **Axis A: Expectation** (Specific Official Act vs. General Goodwill/Standing)
  **Axis B: Timeframe** (Transaction Terminates vs. Relationship Outlives)
  **Axis C: Publicity** (Defend Out Loud to Stranger vs. Keep Private/Implicit)

  **The Grid of Combinations (2x2x2)**

  | Cell | Expectation | Timeframe | Publicity | Status | Occupant / Reason for Empty |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Specific Act | Terminates | Keep Private | **Occupied** | **Plain Bribery.** The classic envelope. Do this for me, cash, we never speak again, never mention it. |
  | **2** | Specific Act | Terminates | Defend Loud | **Empty** | **Incoherent.** If you can defend a specific act out loud to a stranger, it is a standard service or contract, not a favor. If it requires defense, it implies deviation from norm. |
  | **3** | Specific Act | Outlives | Keep Private | **Occupied** | **Patronage / Clientelism.** The MP brings jobs to constituents. Specific acts, ongoing loyalty, but often whispered because it bends universal rules. |
  | **4** | Specific Act | Outlives | Defend Loud | **Occupied** | **Formal Contracting.** (Not a corruption leaf). This is legitimate procurement. Included to show the boundary of the "corruption" space. |
  | **5** | Goodwill | Terminates | Keep Private | **Occupied** | **Facilitation / Speed Money.** No specific act *owed* in theory, but in practice, you pay to stop the delay. One-off, kept quiet because it admits the system is broken. |
  | **6** | Goodwill | Terminates | Defend Loud | **Empty** | **Merely Unattractive.** A one-off gift defended loudly looks like a donation or marketing. It lacks the "obligation" texture of corruption/gift exchange. |
  | **7** | Goodwill | Outlives | Keep Private | **Occupied** | **Nepotism / Kinship.** Hiring the cousin. Based on general family standing, ongoing duty, but rarely defended to an outsider as "merit." |
  | **8** | Goodwill | Outlives | Defend Loud | **Occupied** | **Gift / Refusal Offense.** Cultural protocol. "If I don't eat with him, I insult him." Defended loudly as "respect" or "tradition." |

  **The Deflationary View** does not sit in a single cell; it is a meta-position that argues Cells 1, 3, 5, and 7 are actually Cell 8 (reciprocity) mislabeled by outsiders.
  **The Hardline View** argues that Cells 1, 3, 5, 7, and 8 are all the same violation (private use of public office).

  ***

  ### Part 2: The Sorting Instrument

  **Instructions:** Read each scenario. Select the option that best matches what you would *actually* do or what you believe is the *necessary* course of action in that context. Do not select what the policy manual says; select what the situation demands.

  **1. The Customs Clerk**
  Your shipment of medical supplies is held at the port. The paperwork is perfect. The clerk tells you the system is "down" and it could take two weeks. He mentions that sometimes a "processing fee" paid directly to him can restart the server.
  *   A. Pay the fee. The supplies are needed now, and the clerk is providing a service by fixing the delay.
  *   B. Refuse. If the paperwork is perfect, the speed should not depend on a payment.
  *   C. Pay the fee, but record it as a "local transport cost" so the project doesn't stall.

  **2. The District Engineer**
  You need a signature on a building permit. The engineer invites you to a private dinner at his home to "discuss the technical challenges." He does not mention the permit during the meal.
  *   A. Go. Building a relationship outside the office ensures future permits move smoothly.
  *   B. Decline. Invite him to a working lunch at your office instead.
  *   C. Go, but bring a small gift of fruit or sweets for his family, as is customary.

  **3. The Head Teacher**
  A teaching position opens in a remote village. Two candidates have identical test scores. One is a stranger; the other is your cousin whose family supported your own education for years.
  *   A. Hire the cousin. You have a debt to your family that predates this job.
  *   B. Hire the stranger. The job belongs to the public, not the family.
  *   C. Hire the cousin. They will stay in the village longer because their family is there.

  **4. The Village Council Chair**
  You arrive in a community to start a water project. The Chair insists you share a meal and accept a small woven basket. He says, "If you leave this table without eating, the village cannot trust your word."
  *   A. Eat and accept. Refusing would cancel the project before it starts.
  *   B. Politely decline. Explain your organization's rules about receiving items.
  *   C. Eat, but leave cash equivalent to the meal cost on the table when you leave.

  **5. The Member of Parliament**
  An MP argues that he should steer a road construction contract to a company owned by his constituents, even though their bid is 10% higher than a company from the capital.
  *   A. Support him. His job is to bring resources to his people, not just save money.
  *   B. Oppose him. Public money must go to the lowest bidder regardless of location.
  *   C. Support him, provided the local company is technically capable of doing the work.

  **6. The Audit Discovery**
  An auditor finds a series of small payments to local officials that were not in the original budget. They were essential to keeping the project moving.
  *   A. Classify them as "unauthorized." They violate the financial agreement.
  *   B. Classify them as "necessary." The project succeeded, which was the goal.
  *   C. Classify them as "community engagement." They were part of maintaining local standing.

  **7. The Emergency Exception**
  A flood destroys a bridge. The rule requires three quotes for repairs, which will take three weeks. A local builder says he can do it tomorrow if you give him the word immediately.
  *   A. Give him the word. Saving lives matters more than the quoting process.
  *   B. Wait for the quotes. If we break the rule now, we cannot enforce it later.
  *   C. Give him the word, but backdate the paperwork to make it look like quotes were gathered.

  **8. The Policy Draft**
  You are reviewing a new global policy on "Interactions with Officials."
  *   A. It should ban all gifts and meals, no matter the local custom.
  *   B. It should allow gifts and meals if refusing them causes offense.
  *   C. It should focus only on cash payments; food and gifts are social, not financial.

  **9. The Giver's Reasoning (Texture)**
  You are the one offering the payment in Scenario 1. Why are you doing it?
  *   A. To get something I am not entitled to.
  *   B. To get something I am entitled to, faster.
  *   C. To ensure the person across the desk remembers me next time.

  **10. The Stranger Test**
  A journalist from a foreign country asks you why you paid the customs fee (Scenario 1).
  *   A. I tell them it was required to move the goods.
  *   B. I tell them I made a mistake and won't do it again.
  *   C. I tell them their question shows they don't understand how things work here.

  ***

  ### Part 3: Scoring Key & Position Mapping

  Do not sum the numbers. Look for the *pattern* of choices.

  **The Purist (Hardline)**
  *   **Pattern:** Consistently chooses the "Rule" option (1B, 2B, 3B, 4B, 5B, 6A, 7B, 8A).
  *   **Position:** Any use of public office for private end (including family or community benefit) is a violation. Context does not excuse the breach.
  *   **Grid Location:** Rejects Cells 1, 3, 5, 7, 8.

  **The Transactionalist (Plain Bribery)**
  *   **Pattern:** Distinguishes cash from goods (1B/3B/5B but 2A/4A/8C).
  *   **Position:** Only explicit quid-pro-quo cash for specific acts is the problem. Meals, gifts, and hiring kin are "culture" or "business," not corruption.
  *   **Grid Location:** Occupies Cell 1 only. Views Cells 7 & 8 as legitimate.

  **The Facilitator (Speed Money)**
  *   **Pattern:** 1A or 1C, 7A, 9B.
  *   **Position:** Payments to secure *owed* actions are distinct from payments to secure *favors*. The system is broken; this is oil for the gears.
  *   **Grid Location:** Cell 5. Distinguishes sharply from Cell 1.

  **The Diplomat (Gift/Refusal Offense)**
  *   **Pattern:** 2C, 4A, 8B, 10A.
  *   **Position:** Social obligations are binding. Refusal is an aggressive act. These exchanges maintain the peace.
  *   **Grid Location:** Cell 8.

  **The Broker (Patronage)**
  *   **Pattern:** 3C, 5A or 5C, 6C.
  *   **Position:** Representation means delivering resources to your group. The "public good" is the sum of communities getting their share.
  *   **Grid Location:** Cell 3.

  **The Kin (Nepotism)**
  *   **Pattern:** 3A, 2A.
  *   **Position:** Family debt precedes professional duty. Trust is derived from blood, not credentials.
  *   **Grid Location:** Cell 7.

  **The Localist (Deflationary)**
  *   **Pattern:** 1A, 6B, 10C.
  *   **Position:** "Corruption" is a label outsiders use for reciprocity that works perfectly well here. The rules are the fiction; the relationships are the reality.
  *   **Grid Location:** Argues Cells 1, 3, 5, 7 are actually Cell 8.

  ***

  ### Part 4: Limitations & The Eleventh Question

  **Indistinguishable Pairs:**
  This instrument struggles to separate **The Broker (Patronage)** from **The Localist (Deflationary)**. Both will select options that validate local resource distribution (5A/5C) and reject external judgment (10C). The Broker believes the system *should* work this way (normative); the Localist believes the system *does* work this way and the label is wrong (descriptive/semantic). They will score identically on scenarios 1-10.

  **The Eleventh Question:**
  To separate them, you need a question about *change*.
  *"If a new law passed tomorrow banning local hiring preferences, what would you do?"*
  *   **Broker:** "I would oppose the law or find a way around it." (Believes the practice is right).
  *   **Localist:** "I would follow the law, because the label 'corruption' now applies." (Believes the practice is neutral, but the definition dictates the action).

  ***

  ### Part 5: Prediction

  Expect a sharp geographical split. Your **HQ Compliance staff** will cluster heavily around **The Purist** and **The Transactionalist** positions; they view the grid as a compliance checklist where Cell 1 is the only acceptable risk to manage, and Cell 8 is a loophole to be closed. Your **Country Office staff** will cluster around **The Facilitator**, **The Diplomat**, and **The Localist**; they view the grid as a navigation chart where Cell 5 and Cell 8 are necessary tools for project survival. The argument will not start on bribery (everyone agrees on Cell 1); it will ignite instantly over **Scenario 1 (Customs)** and **Scenario 5 (MP Contract)**. HQ will call Scenario 1 a violation; CO will call it a "facilitation payment." HQ will call Scenario 5 "nepotism"; CO will call it "community buy-in." The tension will peak when CO staff realize HQ views their relationship-building (Cell 8) as a risk to be audited, while HQ realizes CO views their policies (Cell 4) as operationally impossible. Plan your second session to mediate the definition of "Facilitation" vs. "Bribery," as that is the fault line.
