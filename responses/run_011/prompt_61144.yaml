answer: |-
  **What the rulebook assumes**

  The rulebook operates under a hybrid of Biomedical Naturalism and Actuarial Utilitarianism. The core ontological commitment, visible in Rules 1 and 2, is that disease is an objective, internal malfunction of species-typical functioning, distinct from social circumstance or personal preference. For these rules to be non-arbitrary, diseases must be discrete entities identifiable by external markers (codes), not subjective experiences. This is why "agony" (Rule 1) is insufficient without a pathology. Rule 4 reinforces this by distinguishing natural function (reconstructive) from artificial modification (cosmetic), assuming the body has a correct, default state that insurance restores rather than enhances.

  Rule 5 adds an epistemic layer: medical truth is population-level, not individual. A treatment is "real" only if validated by aggregate evidence, prioritizing the stability of the risk pool over individual variance. However, Rules 6 and 7 reveal the actuarial override. Here, health is not just the absence of malfunction but the management of future risk. Statins and vaccines are covered not because high cholesterol or exposure are current diseases in the biomedical sense, but because intervening now is cheaper than paying for a stroke or infection later. Rule 3 ties this together with economic efficiency; "medically necessary" means "efficiently restorative." The plan assumes the body is a machine that should function normally, and the insurer's job is to fund repairs that are objectively verifiable, scientifically proven, and cost-effective, while excluding modifications, preferences, or unproven experiments.

  **Where I'm overreading**

  You are attributing metaphysical weight to administrative scaffolding. Rule 1 is less about ontology and more about data interoperability; codes are billing hooks required by HIPAA and clearinghouses, not philosophical categories. A clinician could theoretically describe a condition without a code, but the payment system cannot process it. Rule 3's "least costly setting" is standard contract law designed to prevent moral hazard, not a stance on the nature of healing; it assumes outcome equivalence to save money, not to define care. Rule 5 isn't denying individual efficacy; it's managing liability and predictability. Insurers cannot adjudicate claims based on "it worked for me," or the system collapses into anecdote.

  Furthermore, Rule 6 reflects adherence to external clinical guidelines (like USPSTF), not an internal redefinition of illness. Insurers follow these to avoid lawsuits and ensure standard of care, not because they believe high cholesterol is a disease entity in the same way a broken leg is. The plan isn't silent on theory; it is agnostic. It adopts whatever framework allows consistent adjudication. You see contradictions; they see claim lines. The friction arises because you are looking for a unified theory of health, while the document is a unified manual for payment processing.

  **The two-headed thing**

  This is not a contradiction in belief, but a division of labor between the employer-as-payer and the employer-as-manager. Rules 1 and 2 serve the insurer's need for objective adjudication to prevent fraud and manage risk pools; they require external verification (codes) because money leaves the building. Rule 8 serves the manager's need for workforce planning; they require functional assessment because work stops regardless of etiology. A migraine without a code still stops work. The institution asks different questions: "Do we owe money?" versus "Can this person work?"

  The wellness rhetoric is marketing compliance, designed to maximize engagement metrics and satisfy regulatory requirements for preventive care, not claim adjudication. It uses the WHO definition because it is broad and inspiring, encouraging participation without creating financial liability. It is defensible because the contexts differ. The claims department manages financial risk across a population; the HR department manages productivity for an individual. The friction you feel arises because the patient sits at the intersection, subjected to both logics simultaneously. The institution isn't confused; it is multifunctional. It treats the body as a machine when paying bills, and as a resource when scheduling shifts.

  **Swapping the engine**

  If we rebuilt the plan on a goal-based account—where health is the capability to do what one has reason to want—the architecture collapses. Rule 1 survives only if codes map to functional limitation, not pathology; a code for "unable to care for children" might replace "endometriosis." Rule 2 flips entirely; circumstances blocking goals (housing instability, gender dysphoria, caregiving stress) become covered conditions, blurring the line between medicine and social work. Rule 3 changes drastically; "least costly" yields to "effective for goal." If an expensive treatment is the only way to return to work, it becomes necessary, potentially exploding costs.

  Rule 4 collapses; cosmetic surgery becomes covered if appearance impedes social participation or employment goals. Rule 5 becomes literally impossible to write; if health is individual capability, population evidence is secondary. Covering treatments based on individual efficacy breaks risk pooling, as costs become unpredictable. Rules 6 and 7 survive easily; they support function. Rule 8 becomes the gold standard, merging with claims. The plan becomes unrecognizable because it shifts from repairing machines to funding lives. Risk pooling fails because "goals" are infinite and subjective, unlike "broken legs." You would no longer be running an insurance plan; you would be running a universal basic income for health-related goals.
