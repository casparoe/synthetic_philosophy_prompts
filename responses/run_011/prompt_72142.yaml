answer: |-
  ### 1. The Verbal Dispute

  The dispute between the mathematician and the philosopher is verbal in origin but substantive in consequence. The term doing the work is **"effective."**

  Apply the substitution test. If we replace "effective procedure" on both sides with **"procedure satisfying Gandy-Sieg axioms"** (locality, boundedness, determinism), the mathematician assents—the thesis becomes a theorem about axiom-satisfying systems. The philosopher demurs, arguing that this substitution begs the question: it proves only that axiom-satisfying systems are Turing-computable, not that all *effective* procedures satisfy those axioms.

  If we replace "effective procedure" with **"physically realizable step-by-step process,"** the philosopher assents—the thesis becomes an empirical claim about the universe. The mathematician demurs, arguing that this substitutes a physical constraint for a conceptual one, rendering the mathematical derivation irrelevant.

  The disagreement persists because the term "effective" is functioning as a pivot between two distinct domains: the *conceptual analysis of calculation* and the *physical instantiation of calculation*. The mathematician treats "effective" as a concept to be analyzed into necessary conditions; the philosopher treats it as a natural kind to be observed. They would stop disagreeing only if they agreed on whether the constraints on calculation are internal to the concept (analytic) or external to the agent/world (synthetic). Since they do not agree on this, the substitution test fails to dissolve the dispute; it merely exposes the fault line.

  ### 2. The Content of the Empiricist Reading

  The empiricist reading has content, but it is often obscured by the failure of proposed counterexamples. The absence of counterexamples (Zeno machines, relativistic computers, analog hypercomputation) is evidence for the thesis *only if* the search space for counterexamples is not restricted by the definition of the terms.

  The mathematician argues that hypercomputational models fail because they violate the axioms of effectiveness (e.g., requiring infinite precision or supertasks). The philosopher counters that this is precisely the point: if the only way to preserve the thesis is to define "effective" such that hypercomputation is excluded by fiat, then the thesis is a tautology, not an empirical generalization.

  The content of the empiricist position lies in the **modal risk**. For the philosopher, it must be *conceivable* that a physical device could compute a non-Turing-computable function without violating the informal notion of "step-by-step procedure." If every proposed counterexample is rejected because it violates a physical law (e.g., thermodynamics, relativity) rather than a logical constraint on "procedure," then the thesis is contingent on the laws of physics.

  Therefore, the absence of counterexamples is not trivial. It is evidence *if* one assumes the informal concept of "effective" is wide enough to potentially encompass physically impossible but logically coherent procedures. If the informal concept is already tightly bound to physical realizability, the absence of counterexamples is predicted by the stipulation. The empiricist insists the concept is wider than the formalism; the mathematician insists the formalism exhausts the concept. The content is the claim that the gap between "conceivable procedure" and "Turing machine" is contingent, not necessary.

  ### 3. The Deflationist Reading and Extensional Coincidence

  The computer scientist's deflationist reading does change the subject, but it does not eliminate the explanatory burden. By treating "computable" as a technical term fixed by formalism, the computer scientist dissolves the truth-value of the thesis. However, this leaves the **extensional coincidence** of formalisms unexplained.

  If the thesis is merely a definition, why did Turing machines, lambda calculus, general recursive functions, and Post systems—all developed independently with distinct motivations—capture the exact same class of functions? A pure stipulation view suggests we could have stipulated differently. The robustness of the coincidence suggests the formalisms are latching onto a pre-existing structural invariant.

  The deflationist must explain this invariant without invoking the "truth" of the thesis. Typically, they argue that the formalisms were all tuned to the same informal intuition. But this pushes the explanatory work back onto the stability of that intuition. Why is the intuition stable? If the thesis is just a convention, the convergence of formalisms is a remarkable sociological accident. If the thesis reflects a structural limit on information processing, the convergence is necessary.

  The deflationist reading leaves the thesis with one specific job: **accounting for the robustness of the concept.** It cannot account for the *necessity* of the limit, but it must account for the *stability* of the consensus. If it cannot do this, it fails to explain why "computable" is a useful technical term rather than an arbitrary one.

  ### 4. The Buried Genuine Disagreement

  The three parties are largely talking past one another, but a genuine disagreement is buried in the exchange. It is not about the extension of the class of functions (all agree it is the Turing-computable functions), nor about the utility of the formalism. It is about the **source of modality**.

  The mathematician treats the limitation to Turing-computability as a **conceptual necessity** (derived from the analysis of "algorithm"). The philosopher treats it as a **natural necessity** (derived from the structure of the physical world or human cognition). The computer scientist treats it as a **normative convention** (derived from community agreement).

  These are incompatible accounts of why the thesis holds. We can state the buried disagreement as a single question:

  **"Is the impossibility of computing a non-Turing-computable function grounded in the analysis of the concept 'calculation,' or in the contingent laws governing physical information processing?"**

  *   The mathematician answers: In the concept.
  *   The philosopher answers: In the laws (making it falsifiable).
  *   The computer scientist answers: Neither; it is a rule of the language game.

  This is not verbal. If the mathematician is right, physics cannot overturn the thesis (any physical device claiming to do so is misdescribed). If the philosopher is right, physics could overturn it (a hypercomputer would falsify the thesis). These are incompatible predictions about how to react to a hypothetical hypercomputer.

  ### 5. Prospects for Progress

  Given this diagnosis, no progress will be made on the question "What is the epistemic status of Church's Thesis?" because the question presupposes a unified object ("The Thesis") that does not exist. The stalemate persists because the participants are defending different theses under the same name.

  Progress requires **fragmentation**. We must distinguish:

  1.  **The Logical Thesis:** A claim about the axiomatic analysis of discrete symbolic manipulation (Mathematician's domain). Progress here is formal: refining axioms (e.g., locality, boundedness) to show derivation.
  2.  **The Physical Thesis:** A claim about the computational capacity of our universe (Philosopher's domain). Progress here is empirical: ruling out hypercomputation via physical law.
  3.  **The Formalist Convention:** A decision to fix the term "computable" to the Turing extension (Computer Scientist's domain). Progress here is pragmatic: assessing utility.

  The workshop should stop asking for a verdict on "The Thesis." Instead, progress would look like a **taxonomy of constraints**. We need to determine which constraints on computation are conceptual (e.g., finiteness of description), which are physical (e.g., speed of light, entropy), and which are conventional (e.g., ignoring analog noise).

  If the workshop continues to treat these as a single dispute, no progress should be expected. The argument recurs because the participants are successfully defending their own domains against incursions from the others. The mathematician protects mathematical necessity from physical contingency; the philosopher protects empirical openness from definitional closure; the computer scientist protects engineering utility from metaphysical baggage. The stalemate is a feature, not a bug, of a multidisciplinary boundary. The only resolution is to acknowledge that "Church's Thesis" is a homonym.
