answer: |-
  The money pump argument is designed to show that cyclical preferences are irrational because they lead to sure losses. The sophisticated chooser replies that she sees the trap coming and refuses the first trade, thereby keeping her money and her cycles intact. This reply is widely treated as a defense of intransitivity. It is not. It is a quiet surrender. By invoking foresight to block the pump, the agent admits that the cyclical ordering cannot govern her choices in the real world. She saves her wallet by abandoning the cycle as a practical guide. The sophisticated reply preserves the letter of intransitivity while evacuating it of all normative force.

  To see this, we must get clear on what a preference is supposed to do. Preferences are not merely aesthetic rankings or internal sensations; they are functional states defined by their role in guiding choice. If an ordering never issues in a choice under conditions of full information, it is causally inert. You ask what the difference is between an ordering that never issues in a choice and one that isn't really the agent's ordering. The answer is nothing. If a purported preference never determines what an agent does when she knows the consequences, it is not a preference in any sense that matters for rationality. It is a phantom ranking, a ghost in the machine that twitches but never moves the limb.

  In the sophisticated case, the agent possesses the cyclical ordering (A > B, B > C, C > A) but acts on a different one. She chooses to stay at A rather than move to B, because she knows moving to B leads to a loss. Her actual choice reveals a transitive ordering over outcomes: "Stay at A" is preferred to "Loop to A minus £3." The cyclical ordering is present in her mind, perhaps, but it is idle. It is like having a map that says "North is South" but refusing to follow it because you know where you want to go. If you never follow the map, possessing it is irrelevant to your navigation. The sophisticated agent navigates by a transitive logic of consequence, not by the local cyclic logic of comparison. The cycle is relegated to the status of a mere inclination, overridden by the real work of rational planning.

  The obvious comeback is that at each single step, taken in isolation, the agent genuinely prefers the option she is being offered. At moment one, she prefers B to A. Foresight doesn't change what she prefers, only what she does about it. If preferring isn't doing, is the cycle still there? This objection relies on a fragmented view of agency. It treats the agent as a series of temporal slices, each with their own local preferences. But rational agency requires coherence over time. If a local preference must be suppressed to avoid a outcome the agent globally rejects, that local preference is defective. It is a temptation, not a rational commitment.

  Consider the difference between a preference and an impulse. I might have an impulse to eat the cake now, but a preference to diet over the month. If I refuse the cake, we do not say my diet preference is idle; we say it is my real preference, and the impulse was noise. Similarly, if the agent refuses the first trade because of the future cycle, she is prioritizing her global outcome over her local comparison. The local cycle is the impulse; the transitive planning is the preference. If the cycle cannot survive reflection, it lacks the stability required of rational preference. To say the cycle is "still there" but overridden is to admit it is not action-guiding. And if it is not action-guiding, it cannot justify decisions. It becomes a descriptive quirk rather than a normative justification.

  Does this argument depend on there being only three options, or on the special features of "on a par" cases? No. It bites any view that predicts a cycle anywhere in the choice space. Proponents of "on a par" argue that small improvements across parity don't aggregate transitively. But if that structure invites a pump, sophistication neutralizes it in the same way. The agent reconstructs a transitive ordering over the sequences to avoid the loss. The specific metaphysical source of the cycle—whether parity, vagueness, or multi-attribute conflict—is irrelevant. The functional critique holds: if the structure leads to exploitation unless blocked by foresight, then foresight blocks the structure from functioning as a preference ordering. The cycle is always bypassed, never honored. The agent is always acting *against* the cycle to preserve her resources, which means the cycle is not her guide.

  What about the version of the reply where the agent cannot bind herself, or the trades are sprung on her one at a time? Here, the agent gets pumped. She loses the money. Defenders might say this shows only that some agents get unlucky in unfriendly worlds. But this is not a defense of cyclical preferences; it is a confession of vulnerability. If the rationality of a preference structure depends on the environment being friendly enough not to exploit it, then the structure is not intrinsically rational. It is conditionally viable only in ignorance.

  If the trades are sprung, the agent loses. This shows that cyclical preferences are costly errors in a world where traders exist. To say "she shouldn't have been offered the sequence" is to change the subject from rationality to luck. A rational preference structure should not make you a victim simply because someone else knows your mind. If the only way to keep the cycle is to ensure no one ever offers you the sequence, you are admitting the cycle is a liability. The sophisticated agent avoids the liability by ignoring the cycle. The unsophisticated agent pays for the cycle. Neither case shows the cycle is rational. One shows it is manageable by ignoring it; the other shows it is expensive.

  Ultimately, the sophisticated chooser saves herself from the pump by ceasing to choose cyclically. She chooses transitivity over consequences. To claim this preserves the rationality of cycles is to confuse the existence of a mental state with the validity of a norm. The cycle exists as a disposition, but it is disqualified from governing action. The agent's behavior is entirely explained by a transitive ranking of outcomes that incorporates costs. The cyclical ordering is left behind, a relic of local comparison that cannot survive global scrutiny. If a preference ordering cannot be acted upon without penalty, and is therefore acted against by the agent who holds it, it has ceased to be a preference ordering in any meaningful sense. The sophisticated reply does not save the cycle; it explains why we must abandon it to survive.
