answer: |-
  You have correctly identified that the debate is often a dialogue of the deaf because the participants are tracking different variables. Your three quantities—risk, volume, and distribution—are the right starting coordinates. However, your three candidates for indeterminacy (verbal, weighting, natural kind) overlap in ways that need untangling to get to the root of the problem.

  Here is the conceptual geography, the measurement reality, and the verdict on whether there is a fact of the matter.

  ### 1. The Conceptual Geography: Risk, Volume, Distribution

  Your distinction between (i) individual risk, (ii) total volume, and (iii) distribution is robust. These can diverge radically. Let's run your scenario to see how the word "violence" fractures under the weight of these differences.

  **The Scenario: The Republic of Stable Killings**
  Imagine a country with a population of 10 million. In Year 1, there are 1,000 homicides.
  *   **Rate:** 10 per 100,000.
  *   **Distribution:** The killings are spread evenly across all regions and classes.

  Forty years pass (Year 40). The population has doubled to 20 million. The absolute number of homicides remains exactly 1,000. However, due to social fragmentation, 900 of those killings now occur within a specific marginalized subgroup of 1 million people, while the other 19 million experience almost none.

  **How "Violence" changes on each reading:**

  1.  **Individual Risk (Per Capita):** The rate has dropped from 10 to 5 per 100,000. If you pick a person at random, they are half as likely to be killed. On this reading, the country has become **less violent**. This is the "Pinker" reading: safety is a property of the average experience.
  2.  **Total Volume (Absolute Count):** The number of dead bodies is unchanged (1,000). The total amount of suffering inflicted by violence is constant. On this reading, violence has **not decreased**. This is the humanitarian aid reading: a dead person is a dead person, regardless of the population size.
  3.  **Distribution (Concentration):** In Year 1, the risk was socialized. In Year 40, the risk is hyper-concentrated. For the privileged 19 million, violence has virtually vanished. For the marginalized 1 million, the rate is now 90 per 100,000 (nine times higher than the national average in Year 1). On this reading, the society has become **more violently unequal**, even if the aggregate rate dropped.

  **Is there a fact about which reading is the "ordinary" one?**
  No. There is no fact of the matter here because "violence" is a functional term, not a fixed unit. When a policymaker asks, "Is the world less violent?", they usually mean (i), because they are assessing the stability of the system for the average actor. When a human rights activist asks the same question, they often mean (ii) or (iii), because they are assessing the total burden of suffering or the justice of its allocation.

  The divergence isn't just statistical; it's moral. (i) measures *security*. (ii) measures *tragedy*. (iii) measures *justice*. When people argue about the trend, they are often arguing about which of these moral goods takes precedence, disguised as an empirical dispute.

  ### 2. The Measurement Layer

  You are right to suspect that measurement isn't just a source of error; it is constitutive of the trend. If you change the net, you change the catch.

  **Reporting and Category Expansion**
  Recorded violence often rises as actual violence falls. This is the "lighting" effect. As states develop better bureaucracies and societies redefine behaviors, more violence enters the ledger.
  *   **Domestic Sphere:** Fifty years ago, a husband beating a wife was often recorded as a "family dispute" or not recorded at all. Today, it is "domestic violence." The *act* might be less frequent due to norms, but the *record* shows a spike because the category expanded.
  *   **The Paradox:** A society that looks more violent in the data may be one that is more sensitive to violence, not one that is more brutal.

  **War: Bodies vs. Systems**
  War measurement is the most volatile layer.
  *   **Direct vs. Indirect:** If you count only battle deaths, war looks like it is declining (better medicine, fewer interstate wars). If you count excess mortality (deaths from famine, disease, displacement caused by war), the trend is much flatter or even rising. Modern wars kill fewer soldiers but devastate civilian infrastructure more thoroughly.
  *   **The Denominator Problem:** Per-capita rates assume the population is a stable unit of risk. It is not.
      *   **Age Structure:** Violence is disproportionately committed by and inflicted upon males aged 15–30. If a population ages (as the world is doing), the homicide rate can drop simply because the "violent demographic" is a smaller slice of the denominator, even if 15–30-year-old men behave exactly the same.
      *   **Urbanization:** Moving people from rural areas to cities changes the *type* of violence (from feuds/raids to crime/gangs) and the *recording* of it.

  **Conclusion on Measurement:** There is no "view from nowhere" on violence numbers. Every dataset embeds a theory of what counts as a relevant death and who counts as a relevant person.

  ### 3. Is There a Fact of the Matter?

  You proposed three ways the debate might fail to have a determinate answer: (a) verbal dispute, (b) incommensurability/weighting, and (c) "violence" is not a natural kind.

  I believe **(a) is a symptom, (b) is the technical mechanism, and (c) is the root cause.**

  **Why (a) is insufficient:**
  If this were merely a verbal dispute, it would dissolve once we agreed on definitions. If I say, "By violence I mean battle deaths," and you say, "By violence I mean excess mortality," we should be able to say, "Okay, battle deaths are down, excess mortality is flat," and move on. But we don't move on. We keep arguing about which definition *ought* to govern the label "violence." That suggests the dispute isn't just about words; it's about the underlying reality the words track.

  **Why (c) is the root:**
  "Violence" is not a natural kind like "gold" or "electron." It is a normative category. Its boundaries are drawn by our moral judgments.
  *   Does a death caused by an economic embargo count as violence?
  *   Does a death caused by a lack of healthcare funding count?
  *   Does psychological terror count the same as physical injury?

  There is no empirical test to settle these boundaries. Different equally reasonable extensions of the term yield different trends. If you include structural harm, the 20th century might look more violent than the 19th. If you restrict it to direct physical force by non-state actors, it looks less violent. Since there is no "true" boundary of violence independent of human valuation, there is no single fact of the matter about the trend.

  **Why (b) is the mechanism:**
  Because (c) is true (no natural kind), we are forced to solve problem (b) (weighting). To say the world is "less violent" overall, you must aggregate different kinds of harm into a single index.
  *   How many assaults equal one murder?
  *   How many years of living under the threat of nuclear war equal one conventional war death?
  *   How do we weight the suffering of the concentrated subgroup in the scenario above against the safety of the majority?

  Epidemiology handles this with Disability-Adjusted Life Years (DALYs), but those weights are arbitrary conventions, not discovered facts. Economics handles this with inflation baskets, but the basket is a political choice. In violence studies, there is no agreed-upon exchange rate between a medieval raid and a modern drone strike. Without a weighting scheme, you cannot generate a single trend line. You can only generate a vector of different trends for different definitions.

  **Verdict:**
  The indeterminacy is real. It is primarily driven by **(c)** (the normative boundary of the concept), which forces us into **(b)** (the impossibility of non-arbitrary weighting). **(a)** is just how the argument sounds when people don't realize (c) and (b) are in play.

  This applies at every layer.
  *   **Conceptual:** We can't decide if we care about risk or volume without a moral weighting.
  *   **Measurement:** We can't decide if indirect war deaths count without a normative boundary.
  *   **Trend:** We can't sum the trends without an index number.

  ### 4. What Is Determinate and What Is the Real Fight?

  **What has determinate answers:**
  Specific, bounded empirical claims are determinate.
  *   "The rate of interstate war battle deaths per 100,000 global population declined from 1950 to 2010." (True/False checkable).
  *   "The number of recorded domestic violence incidents in Country X rose from 1980 to 2000." (True/False checkable).
  *   "The homicide rate for males aged 20-29 in Region Y is higher than for males aged 60-69." (True/False checkable).

  These are facts. But none of them *alone* answers "Is the world getting less violent?"

  **What people are actually fighting about:**
  When people think they are fighting about a trend in the world, they are actually fighting about **moral prioritization disguised as empirical description.**

  The proponent of "The World Is Less Violent" is usually arguing: *Direct, intentional, physical harm by non-state actors is the primary moral evil, and the state's monopoly on force is the primary solution.* They prioritize (i) Risk and exclude Structural Harm.

  The opponent is usually arguing: *Suffering caused by systems (economic, political, structural) is morally equivalent to direct harm, and the concentration of harm on the vulnerable is the primary evil.* They prioritize (ii) Volume and (iii) Distribution and include Structural Harm.

  **The Fix to Your Framing:**
  Your three indeterminacy options were close, but (a) and (c) need to be distinguished more sharply.
  *   **Correction:** A "merely verbal dispute" (a) implies that if we clarified our terms, the disagreement would vanish. A "non-natural kind" dispute (c) implies that clarifying terms reveals that the disagreement is about *values*, not facts. The dispute doesn't vanish; it just moves from "Is it true?" to "Which definition is more morally useful?"
  *   So, (a) collapses into (c). The reason it *looks* verbal is because the concept is not a natural kind.

  **Summary:**
  There is no single fact of the matter about whether the world is getting less violent because "violence" is a moral category, not a physical one. The trend depends entirely on which harms you choose to count and how you choose to weight them. The debate persists because participants are advocating for different moral frameworks (Security vs. Justice, Direct vs. Structural) while claiming the authority of empirical data. The data is real, but the aggregation is a choice.
