prompt: |-
  I'm auditing a book for my reading group and I've hit a passage I can't evaluate on my own. I work in constitutional law, so I know the modern materials cold, but my medieval Latin philosophy is essentially nil; the group has been working through a recent trade history of political assassination by a journalist-historian who writes with great confidence and, as far as I can tell, no footnotes. His chapter on the Middle Ages builds to this paragraph:

  "The medieval contribution to this debate was made by Thomas Aquinas, who gave the Christian West its most systematic permission to kill a tyrant. In On Kingship, addressed to a ruling prince, he argues that a king who turns from the common good to his own advantage has destroyed the basis of his own authority, so that a community which appointed him does him no wrong in deposing him and, if deposition proves impossible, in putting him to death. The killing is not sedition, Aquinas insists, but its opposite: it is the tyrant who has torn the polity apart, and whoever removes him restores its unity. He compares the tyrant to a diseased limb that must be cut from the body so that the whole may live, and observes that those who performed this operation were honoured by posterity rather than punished. Aquinas's one real restriction is institutional rather than moral: the deed must be undertaken on the authority of the community, so that a private individual acting on his own judgement commits murder even when the tyrant deserves to die. Later Catholic thought found all this uncomfortable. When a French theologian defended the assassination of the Duke of Orléans before the Council of Constance, the Council condemned the proposition that a subject may lawfully kill a tyrant, and the natural-law tradition thereafter taught patience under unjust government. The quietism usually attributed to medieval Catholic political thought is thus not Aquinas's teaching but the suppression of it."

  Please go through this claim by claim and tell me what to trust. For each assertion, I'd like to know whether a specialist in Aquinas's political thought would accept it, accept it as a fair popular simplification, or reject it outright — and in the last case, what the correction is. Three places especially worry me. First, the author treats Aquinas as granting a *permission* to kill the tyrant, indeed a fallback permission when deposition fails; my vague recollection is that Aquinas is much more cautious than that, more concerned with the evils a botched revolt unleashes than with licensing the deed, and that the confident permission belongs to other medieval and early modern authors. Second, the diseased-limb comparison and the claim about honouring tyrannicides: I suspect the author has taken an analogy Aquinas uses somewhere else, about a different subject entirely, and welded it onto the ruler, and that where Aquinas does mention men who killed tyrants he is drawing a cautionary moral rather than an admiring one. Third, the historical framing of Constance: even if the Council did condemn propositions defending the assassination of the Duke of Orléans, does it follow that this was a repudiation of Aquinas, or a reversal in the tradition, rather than a condemnation of claims considerably more permissive than anything he wrote — and is it true that the natural-law tradition became quietist afterwards?

  Also tell me where you're confident and where the scholarship is genuinely divided — for instance, whether Aquinas's very early remarks on killing a tyrant and his mature treatment of sedition and of killing in the Summa amount to a change of mind, a difference of question, or a difference of genre, since the author's whole narrative depends on reading them as one doctrine. Finally, and separately from the audit: the author never raises the hard case, and I'd like to know what Aquinas's framework does with it. Suppose the ruler holds office by an unimpeachable title, governs unjustly but not catastrophically, and there is no longer any corporate body in the polity competent to depose him. What resources does Aquinas leave a private person in that situation, and is the answer different from the one the paragraph implies? Please don't supply a bibliography or page references — I'll pull the texts myself — and don't put words in quotation marks unless you're certain of the exact wording; paraphrase instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Works in constitutional law (knows modern materials), but admits "medieval Latin philosophy is essentially nil." Part of a reading group auditing a trade history book by a journalist-historian (no footnotes, confident tone).
      *   **Task:** Audit a specific paragraph about Thomas Aquinas and tyrannicide.
      *   **Requirements:**
          *   Go claim-by-claim.
          *   Evaluate each claim: Accept, Fair Simplification, or Reject (with correction).
          *   Address three specific worries: (1) Permission vs. Caution, (2) Diseased limb analogy/honor, (3) Council of Constance/quietism narrative.
          *   Address scholarly division (early vs. mature Aquinas).
          *   **Separate Task:** Address the "hard case" (unimpeachable title, unjust but not catastrophic rule, no corporate body left, private person).
          *   **Constraints:** No bibliography/page references (user will pull texts), no quotation marks unless certain of exact wording (paraphrase instead).

  2.  **Deconstruct the Paragraph (Claim-by-Claim Analysis):**

      *   *Claim 1: "The medieval contribution... was made by Thomas Aquinas, who gave the Christian West its most systematic permission to kill a tyrant."*
          *   **Assessment:** Reject/Highly Misleading. Aquinas is not the *most* systematic permission-giver. John of Salisbury is earlier and more explicit. Aquinas is cautious. "Permission" is too strong; "justification under strict conditions" is better.
      *   *Claim 2: "In On Kingship... he argues that a king who turns from the common good... has destroyed the basis of his own authority..."*
          *   **Assessment:** Fair Simplification (with caveats). *De Regno* (On Kingship) does argue tyranny undermines the basis of rule. However, *De Regno* is unfinished and arguably not fully by Aquinas (Book II is often attributed to Ptolemy of Lucca). The user needs to know the authorship issue affects the weight of this text.
      *   *Claim 3: "...so that a community which appointed him does him no wrong in deposing him and, if deposition proves impossible, in putting him to death."*
          *   **Assessment:** Reject/Correction needed. *De Regno* does mention deposition. It mentions killing *only* in the context of historical examples or extreme caution, not as a clear "if deposition fails, kill." The *Summa Theologiae* is much more restrictive. The "if deposition proves impossible" clause is a journalist's inference, not Aquinas's explicit formula.
      *   *Claim 4: "The killing is not sedition, Aquinas insists, but its opposite..."*
          *   **Assessment:** Fair Simplification of *Summa* (S.T. II-II, Q. 42). Aquinas argues removing a tyrant isn't sedition because the tyrant fosters discord. But "insists" is strong; he argues nuancedly.
      *   *Claim 5: "He compares the tyrant to a diseased limb that must be cut from the body..."*
          *   **Assessment:** Reject (Major Red Flag). This is the "diseased limb" analogy. Aquinas uses this regarding *excommunication* or *sinners* generally, not specifically political tyrannicide in *De Regno* or *Summa*. This sounds like John of Salisbury (*Policraticus*) or later Calvinist resistance theory. This is a specific attribution error.
      *   *Claim 6: "...and observes that those who performed this operation were honoured by posterity rather than punished."*
          *   **Assessment:** Reject/Correction. Aquinas mentions Brutus/Cassius in *De Regno* but is ambivalent/cautionary, not admiring. He warns against the dangers of attempting this.
      *   *Claim 7: "Aquinas's one real restriction is institutional rather than moral: the deed must be undertaken on the authority of the community..."*
          *   **Assessment:** Fair Simplification. Aquinas does emphasize public authority over private whim. But it's not just "institutional"; it's moral/theological (avoiding scandal, greater evil).
      *   *Claim 8: "Later Catholic thought found all this uncomfortable. When a French theologian defended the assassination of the Duke of Orléans before the Council of Constance, the Council condemned the proposition that a subject may lawfully kill a tyrant..."*
          *   **Assessment:** Fair Simplification of History, but Misleading Connection. Jean Petit did defend it (1408). Constance condemned it (1415). But linking this directly as a repudiation of *Aquinas* is historically shaky. Aquinas wasn't the primary target; Petit's specific arguments were.
      *   *Claim 9: "...and the natural-law tradition thereafter taught patience under unjust government. The quietism usually attributed to medieval Catholic political thought is thus not Aquinas's teaching but the suppression of it."*
          *   **Assessment:** Reject/Overstatement. The tradition didn't become purely quietist. Suarez, Bellarmine, and later Scholastics still allowed resistance under specific conditions. "Suppression of Aquinas" is a conspiracy-adjacent narrative not supported by intellectual history.

  3.  **Address the Three Specific Worries:**

      *   *Worry 1 (Permission vs. Caution):* The user is right. Aquinas is cautious. *De Regno* is more permissive than *Summa*. The journalist conflates them. The "fallback permission" is not explicit in Aquinas.
      *   *Worry 2 (Diseased Limb/Honor):* The user is right. The analogy is misattributed (likely John of Salisbury). The "honor" claim is dubious regarding Aquinas.
      *   *Worry 3 (Constance/Quietism):* The user is right. Constance condemned *specific* propositions (Jean Petit's), not Aquinas's general principle. The "quietism" narrative ignores the School of Salamanca and later Scholastics.

  4.  **Address Scholarly Division (Early vs. Mature):**
      *   *De Regno* (On Kingship) vs. *Summa Theologiae*.
      *   *De Regno* is earlier, unfinished, Book II authorship disputed. It is more "political" and slightly more permissive.
      *   *Summa* is mature, theological. Focuses on sedition. Much stricter on private action.
      *   Is it a change of mind? Scholars debate. Some say genre difference (advice to prince vs. theological summa). Some say development. The journalist treats them as one seamless doctrine, which is methodologically weak.

  5.  **Address the "Hard Case" (Separate Task):**
      *   *Scenario:* Unimpeachable title, unjust but not catastrophic, no corporate body, private person.
      *   *Aquinas's Framework:*
          *   Private killing = Murder/Sin. (Summa II-II, Q. 64).
          *   Tyranny must be "excessive" to warrant removal.
          *   Public authority is required. If no public authority exists (corporate body dissolved), the private individual lacks the *commission* to act.
          *   Recourse: Prayer, patience, God will remove the tyrant (citing Peter/Paul).
          *   Difference from paragraph: The paragraph implies the *only* barrier is institutional authority. Aquinas implies the barrier is also the *order of charity* and the risk of greater evil. In the "hard case," Aquinas says do *not* kill. Endure.

  6.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Professional, authoritative but accessible to a lawyer (use legal analogies if helpful, but stick to the prompt's request).
      *   *Constraint Check:* No bibliographies. No page numbers. No quote marks unless certain (better to paraphrase).
      *   *Structure:*
          1.  Executive Summary (Trust level).
          2.  Claim-by-Claim Audit.
          3.  Addressing the Three Worries.
          4.  Scholarly Division (De Regno vs. Summa).
          5.  The Hard Case (Separate section).

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on "Diseased Limb":* I need to be careful. Aquinas *does* use medical analogies for sin/excommunication. But applying it specifically to *political tyrannicide* in the way the journalist describes is definitely more John of Salisbury (*Policraticus*). I should flag this as a likely conflation.
      *   *Correction on "On Kingship":* I must mention that *On Kingship* (De Regno) is unfinished and the second book is widely considered to be by Ptolemy of Lucca, not Aquinas. This is crucial for a legal audit because it questions the authority of the source text the journalist relies on.
      *   *Correction on Constance:* The Council condemned the *proposition* that any subject can kill a tyrant without judicial process. This actually aligns *with* Aquinas's restriction on private authority, not against it. The journalist gets the implication backwards.
      *   *Hard Case:* Make sure to emphasize that for Aquinas, the lack of a "corporate body" means the *public authority* required to legitimize the act is missing. Therefore, it reverts to private murder.

  8.  **Final Review against Constraints:**
      *   Did I use quote marks? Only if certain. (I will avoid them to be safe).
      *   Did I provide bibliography? No.
      *   Did I answer the hard case separately? Yes.
      *   Is the tone appropriate? Yes, auditing a claim.

  9.  **Final Polish:** Ensure the distinction between *De Regno* and *Summa* is clear, as this is the linchpin of the journalist's error. Ensure the "diseased limb" attribution is corrected to John of Salisbury. Ensure the Constance condemnation is contextualized as targeting *private* judgment (which Aquinas also rejected), not public resistance (which Aquinas allowed conditionally).

  *(Self-Correction on the "Diseased Limb" point)*: Wait, does Aquinas use it in *Summa* regarding sinners? Yes, regarding excommunication or cutting off sinners from the church. Does he apply it to the *tyrant* specifically? John of Salisbury is the famous source for the "slay the tyrant as you would a diseased limb" analogy. The journalist has almost certainly swapped them. I will state this confidently as a rejection.

  *(Self-Correction on Constance)*: The Council condemned the idea that a *private* person could kill a tyrant based on their own judgment (Jean Petit's argument). Aquinas *agrees* with this restriction. So the journalist's claim that Constance repudiated Aquinas is wrong. Constance repudiated the *exception* to Aquinas's rule, not the rule itself. This is a critical legal distinction.

  *(Final Plan)*: Structure the response clearly with headings. Keep the language precise. Acknowledge the user's legal background where analogies help (e.g., standing, jurisdiction).

  *(Wait, one more check on "On Kingship")*: The text is *De Regno* (On Kingship). Book I is Aquinas. Book II is Ptolemy of Lucca. The tyrannicide stuff is largely in Book I, but the text is unfinished. I need to mention the incompleteness.

  *(Wait, one more check on "Hard Case")*: The prompt asks what resources Aquinas leaves a private person. The answer is essentially "none" regarding violence. Prayer and patience. I need to make sure I don't sound like I'm endorsing it, just reporting Aquinas's view.

