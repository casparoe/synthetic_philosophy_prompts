answer: |-
  ### Executive Summary

  As a legal audit, this paragraph fails. It presents a composite doctrine as a single, coherent system, conflates distinct texts with different authorship statuses, misattributes key analogies, and constructs a historical narrative of suppression that does not align with the intellectual record. A specialist in Aquinas's political thought would reject the central thesis that Aquinas provided a "systematic permission" for tyrannicide. They would characterize the passage as a conflation of Aquinas with John of Salisbury (earlier) and later Jesuit scholastics (later), wrapped in a Whig historical narrative.

  Below is the claim-by-claim audit, followed by an analysis of the scholarly divisions and the "hard case" you requested.

  ### Claim-by-Claim Audit

  **Claim 1:** *"The medieval contribution to this debate was made by Thomas Aquinas, who gave the Christian West its most systematic permission to kill a tyrant."*
  *   **Verdict:** **Reject.**
  *   **Correction:** Aquinas did not give the "most systematic permission." That distinction belongs to John of Salisbury in the *Policraticus* (twelfth century), who is far more explicit and admiring of tyrannicide. Aquinas is notably more cautious and restrictive than his predecessors and many successors. To call his work a "permission" is to mischaracterize a reluctant, highly qualified justification as a license.

  **Claim 2:** *"In On Kingship, addressed to a ruling prince, he argues that a king who turns from the common good to his own advantage has destroyed the basis of his own authority..."*
  *   **Verdict:** **Fair Simplification (with major caveat).**
  *   **Correction:** The text *On Kingship* does argue that tyranny forfeits the claim to obedience. However, a specialist would flag that *On Kingship* is unfinished, and the second book (where much of the political theory is expanded) is widely attributed to his student Ptolemy of Lucca, not Aquinas. Relying on it as the definitive statement of Aquinas's mature view is methodologically unsound.

  **Claim 3:** *"...so that a community which appointed him does him no wrong in deposing him and, if deposition proves impossible, in putting him to death."*
  *   **Verdict:** **Reject.**
  *   **Correction:** *On Kingship* discusses deposition by a superior authority (like an emperor) or the community. It does *not* explicitly codify a rule that "if deposition fails, killing is permitted." That conditional structure is the author's inference. In his mature work, the *Summa Theologiae*, Aquinas is even more reserved, focusing on the sin of sedition and rarely explicitly endorsing execution as a fallback.

  **Claim 4:** *"The killing is not sedition, Aquinas insists, but its opposite: it is the tyrant who has torn the polity apart, and whoever removes him restores its unity."*
  *   **Verdict:** **Fair Simplification.**
  *   **Correction:** In the *Summa*, Aquinas does argue that removing a tyrant is not sedition because the tyrant is the one fostering discord. However, "insists" is too strong. He argues this as a theological distinction to absolve the *community* of the charge of sedition, not to encourage the act.

  **Claim 5:** *"He compares the tyrant to a diseased limb that must be cut from the body so that the whole may live..."*
  *   **Verdict:** **Reject (Major Attribution Error).**
  *   **Correction:** This is the most glaring error. This specific analogy is the hallmark of John of Salisbury, not Aquinas. Aquinas uses medical analogies for sin and excommunication, but applying the "amputation of a limb" specifically to political tyrannicide is Salisbury's doctrine. The journalist has transferred Salisbury's vivid imagery to Aquinas to make Aquinas sound more radical than he was.

  **Claim 6:** *"...and observes that those who performed this operation were honoured by posterity rather than punished."*
  *   **Verdict:** **Reject.**
  *   **Correction:** Aquinas mentions historical tyrannicides (like Brutus and Cassius) in *On Kingship*, but he does so ambivalently. He notes they were praised by some, but he immediately pivots to the dangers of such attempts, warning that they often lead to worse tyranny or civil war. He does not hold them up as models for Christian imitation.

  **Claim 7:** *"Aquinas's one real restriction is institutional rather than moral: the deed must be undertaken on the authority of the community, so that a private individual acting on his own judgement commits murder even when the tyrant deserves to die."*
  *   **Verdict:** **Fair Simplification.**
  *   **Correction:** Aquinas does insist on public authority. However, calling it "institutional rather than moral" is misleading. For Aquinas, the requirement for public authority is itself a moral and theological requirement derived from the order of charity and the avoidance of scandal. It is not merely a procedural hurdle; it is a substantive moral limit.

  **Claim 8:** *"When a French theologian defended the assassination of the Duke of Orléans before the Council of Constance, the Council condemned the proposition that a subject may lawfully kill a tyrant..."*
  *   **Verdict:** **Fair Simplification of History, Misleading Application.**
  *   **Correction:** The Council of Constance (1415) did condemn propositions by Jean Petit defending the killing of the Duke of Orléans. However, Petit argued for *private* judgment and secret killing. The Council condemned the idea that a private individual could judge and execute a tyrant without public process. This actually *aligns* with Aquinas's restriction on private authority. It was not a repudiation of Aquinas's limited allowance for *public* resistance.

  **Claim 9:** *"...and the natural-law tradition thereafter taught patience under unjust government. The quietism usually attributed to medieval Catholic political thought is thus not Aquinas's teaching but the suppression of it."*
  *   **Verdict:** **Reject.**
  *   **Correction:** The tradition did not become quietist. Later Scholastics (like Suarez and Bellarmine) and the School of Salamanca developed robust theories of resistance that built upon, rather than suppressed, Aquinas. The narrative of "suppression" ignores the vibrant sixteenth- and seventeenth-century Catholic resistance theory that influenced early modern constitutionalism.

  ---

  ### Addressing Your Three Worries

  **1. Permission vs. Caution**
  Your instinct is correct. A specialist would say the journalist inverts Aquinas's emphasis. Aquinas is primarily concerned with the *evil of sedition* and the *greater harm* that often follows a failed revolt. In the *Summa*, he argues that if a tyranny is not excessive, it is better to endure it than to risk a worse tyranny through revolt. The "permission" is not a fallback right; it is a tragic necessity allowed only under strict public authority. The confident "license to kill" belongs to John of Salisbury (earlier) or the Monarchomachs (later), not Aquinas.

  **2. The Diseased-Limb Analogy and Honor**
  Your suspicion is confirmed. The "diseased limb" analogy is the signature of John of Salisbury. Aquinas is far more guarded. Where Aquinas discusses historical tyrannicides, he does not offer them as precedents for honor. He warns that killing a tyrant often unleashes chaos. The journalist has welded Salisbury's rhetoric onto Aquinas's name to create a more dramatic narrative arc.

  **3. The Council of Constance and Quietism**
  The historical framing is flawed. The Council condemned the *private* right to assassinate (Jean Petit's argument). Since Aquinas *also* condemned the private right to assassinate, the Council was not repudiating Aquinas; it was repudiating an extreme interpretation that Aquinas would have rejected himself. Furthermore, the claim that natural-law tradition became quietist is historically false. The sixteenth-century Spanish Scholastics explicitly argued for the deposition of tyrants, citing Aquinas. The "suppression" narrative is a invention of the journalist.

  ---

  ### Scholarly Division: Early vs. Mature Aquinas

  You asked where the scholarship is divided. The tension lies between *On Kingship* (early/unfinished) and the *Summa Theologiae* (mature).

  *   **The Textual Problem:** *On Kingship* is more "political" and slightly more permissive regarding removal. The *Summa* is theological and stricter regarding sedition.
  *   **The Interpretive Debate:**
      *   **Development View:** Some scholars argue Aquinas became more conservative as he aged, moving from a political advisor's stance to a theologian's caution.
      *   **Genre View:** Others argue there is no contradiction, only a difference in audience. *On Kingship* advises a prince on how not to be deposed; the *Summa* advises confessors on how to judge sin.
      *   **Authorship View:** A significant camp argues that the portions of *On Kingship* most favorable to resistance were written by Ptolemy of Lucca, not Aquinas.
  *   **The Journalist's Error:** The author treats these texts as a single, seamless doctrine. This is methodologically weak. If the "permission" relies heavily on *On Kingship*, it rests on a text that is unfinished and partially spurious. If it relies on the *Summa*, the permission largely vanishes.

  ---

  ### The Hard Case: Private Recourse in the Absence of Public Authority

  You asked for an analysis separate from the audit: *Suppose the ruler holds office by an unimpeachable title, governs unjustly but not catastrophically, and there is no longer any corporate body in the polity competent to depose him. What resources does Aquinas leave a private person in that situation?*

  **The Aquinas Framework:**
  In this scenario, Aquinas leaves the private person **no recourse to violence.**

  1.  **Lack of Jurisdiction:** For Aquinas, the right to use coercive force (including lethal force) belongs solely to the public authority acting for the common good. A private individual lacks this "jurisdiction." In your scenario, since the corporate body is incompetent or dissolved, there is no mechanism to generate public authority. Therefore, any act of killing by a private person is, by definition, murder.
  2.  **The Threshold of Harm:** Aquinas sets a high bar for resistance. The tyranny must be "excessive" and destructive to the common good. In your hypothetical ("unjustly but not catastrophically"), the threshold for licit resistance is not met. Aquinas explicitly argues that imperfect government is preferable to the chaos of revolt.
  3.  **The Risk of Greater Evil:** Aquinas argues that removing a tyrant often leads to a worse situation (factionalism, civil war, a new tyrant more fearful and cruel than the first). Without a corporate body to manage the transition, this risk is maximized. Prudence dictates against action.
  4.  **The Theological Remedy:** Aquinas does not leave the subject with *nothing*, but what he offers is spiritual, not political. He advises prayer and patience. He cites the example of the early Christians praying for Nero. He suggests that God may soften the tyrant's heart or remove him providentially.
  5.  **Difference from the Paragraph:** The paragraph implies that the *only* barrier to tyrannicide is the lack of institutional authorization ("Aquinas's one real restriction is institutional"). It suggests that if the institution were present, the killing would be morally straightforward. Aquinas's framework is deeper: even with institutional authorization, the act is fraught with moral danger and is only permissible if the tyranny is catastrophic and the remedy will not cause greater harm. In your "hard case," the lack of institution is not a procedural block; it is a sign that the conditions for just removal are absent. The private person must endure.

  **Conclusion for your Group:**
  The paragraph is a compelling piece of rhetoric but a poor piece of intellectual history. It creates a "Aquinas" who is more modern, more permissive, and more consistent than the actual historical figure. It borrows the violence of John of Salisbury and the later Scholastics and attributes it to Aquinas to create a lineage of "suppressed liberty." For a reading group, it is useful as an example of how trade history often smooths over textual contradictions to build a narrative, but it should not be treated as an accurate summary of Thomistic political theology.
