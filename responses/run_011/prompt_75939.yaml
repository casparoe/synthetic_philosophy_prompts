  | **Amino Acids / Proteins** | Reconstructed signal (intermediate buffer, not final display). | Medium. Proteins fold; reconstruction is non-linear. |
  | **Phenotype (Organism)** | Rendered frame / final output. | Medium. Output is 4D (time), interactive. |
  | **Mutation** | Bit flips / packet loss / corruption. | High. |
