  2.  **Deconstruct the Desiderata:**
      I need to formulate specific criteria that a theory of collective mentality must meet to be useful for the consortium's ethical and ontological decisions.

      *   *Component Mindedness:* Distinguish between ant colonies (dumb parts) and committees (smart parts). The Fugue has stateless agents (likely LLM calls). Are they minded?
      *   *Individuation/Counting:* How many minds? One per agent? One per system? Overlapping?
      *   *Part-Whole Competition:* If the system believes $P$, do the parts believe $P$? Can they conflict?
      *   *Continuity/Intermittency:* The Fugue runs in bursts. The transcript holds memory. Is there persistence?
      *   *Non-Triviality (The Hurricane Problem):* Why isn't a storm a mind? Need to avoid over-generation.
      *   *Human Brain Analogy:* The brain is modular. Does the theory apply there? Consistency with neuroscience.
      *   *Separability:* Belief vs. Phenomenology vs. Moral Status. The consortium asks two questions (Mind? Moral Claims?). They might differ.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Drafting Component Mindedness:* Needs to handle the "marginal agent" vs. "full agent" distinction.
