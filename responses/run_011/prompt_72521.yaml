      *   *Unfalsifiability:* The core worry. If the signal is ambiguous between "first-order imagery" and "higher-order awareness," HOT can always retreat to "No HOT detected." The paradigm measures *command following*, not *meta-representation*. So HOT is arguably exposed as unfalsifiable here unless we assume command following *entails* HOT.
