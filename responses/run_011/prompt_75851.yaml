answer: |-
  Diagnosis of the Impasse: Standing, Authority, and Propriety

  Your working hypothesis is largely correct, but it requires sharpening. You are not merely suffering from a verbal dispute, nor are you entirely in the grip of a single substantive disagreement. Rather, you are dealing with a *category conflation* that masks a substantive disagreement about the ontology of moral relations. The term 'standing' is currently functioning as a placeholder for three distinct normative phenomena. Until you disentangle them, the cases will continue to slide past one another.

  Here is the specific diagnosis of where the camps are talking past each other, and where they are genuinely at war.

  ### 1. The Verbal/Conceptual Tangle

  The primary source of the circularity is that 'standing' is being used to denote two different normative statuses, while the sceptics deny the existence of either.

  **A. Normative Authority (The Power to Demand)**
  This is what the 'Moral Address' camp (Camp 1) is actually tracking. On this view, standing is a *normative power*, akin to the authority a promisor has to demand performance from a promisee. If I violate the norm myself, I forfeit the *right* to hold you to it. The defect in the hypocrite's blame is that it is *ultra vires*—beyond their powers. It is not that the blame is untrue, but that the blamer lacks the jurisdiction to issue the demand.
  *   *The Question:* Does the blamer possess the normative authority to issue a second-personal reason?

  **B. All-Things-Considered Propriety (The Permission to Express)**
  This is what the 'Comparative' camp (Camp 2) is often tracking, though they describe it as standing. Their intuition is driven by fairness and comparative justice. If the blamer is worse than the blamee, expressing blame is *unfair* or *indecorous*, even if the blamee is genuinely blameworthy. This is not necessarily about a lack of authority (I may have the right to criticise you), but about a defeasible permission to exercise it.
  *   *The Question:* Is the expression of blame, all things considered, appropriate given the relative moral positions of the parties?

  **C. Explanatory Parsimony (The Ontological Claim)**
  The 'Sceptics' (Camp 3) are not offering a rival theory of standing; they are offering an error theory about the category itself. They claim that A and B are reducible to standard deontic reasons (reasons against lying, reasons to be kind, reasons of utility).
  *   *The Question:* Do we need a sui generis normative status to explain the data, or does standard value theory suffice?

  **The Diagnosis:** Camp 1 and Camp 2 are having a substantive disagreement about the nature of blame (is it essentially communicative/relational?), but they are often arguing past each other because Camp 1 is defending *Authority* while Camp 2 is defending *Propriety*. Camp 3 is having a meta-normative dispute with both.

  ### 2. The Substantive Core

  Once you strip away the terminological confusion, there is a genuine, non-verbal disagreement remaining. It concerns the **nature of moral relations**.

  *   **The Relationalist View (Camp 1):** Morality is constituted by second-personal relations. To blame is to invoke a community of mutual accountability. Hypocrisy severs the relation. This view *must* struggle with private blame (blaming the dead, or silent resentment), because if no address occurs, no relation is invoked, so why would standing matter? If Camp 1 insists standing applies to private blame, they must argue that private blame is a derivative form of address (e.g., addressing an ideal audience).
  *   **The Evaluative View (Camp 2):** Morality is primarily about the accurate assessment of value and fault. Standing is a constraint on the *expression* of that assessment to ensure fairness. This view handles private blame better (I can privately judge that my own fault makes my judgment of you unfair), but it struggles to explain why the hypocrite's blame feels *invalid* rather than just *unfair*.
  *   **The Reductive View (Camp 3):** Morality is a system of reasons. 'Standing' is a folk-theoretic reification of conflicting reasons.

  The substantive fight is this: **Is there a distinct normative category of 'authority to hold accountable' that is not reducible to reasons of fairness or accuracy?** If Camp 1 is right, morality grants us powers. If Camp 3 is right, morality only gives us reasons. Camp 2 sits uncomfortably in the middle, often smuggling in 'powers' language while relying on 'reasons' (comparative weight) to do the work.

  ### 3. Prognosis: What Counts as Progress?

  You will not resolve this by finding a 'better' case. You will resolve it by changing the questions you ask of the cases. Here is the roadmap for progress.

  **I. Draw the Distinction: Fittingness vs. Standing vs. Propriety**
  You need to formally separate these three assessments for every case discussed.
  1.  **Fittingness:** Is the target actually blameworthy? (Everyone agrees 'yes' in the expense case).
  2.  **Standing (Authority):** Does the blamer have the normative power to demand compliance/acknowledgement?
  3.  **Propriety (Permission):** Is it wise, kind, fair, or useful to express this blame?

  *Progress Marker:* If Camp 2 admits that a hypocrite might retain *Standing* (Authority) but lack *Propriety* (Permission), the 'Comparative' objection collapses into a constraint on expression, not a condition of blame itself. If Camp 1 admits that *Propriety* can be lost without losing *Standing* (e.g., I have the right to blame you, but it would be unkind given your trauma), then the 'Address' argument is narrowed significantly.

  **II. The Decisive Class of Cases: Private, Unexpressed Blame**
  This is the wedge you need.
  *   *The Case:* I discover you fiddled expenses. I say nothing to you, I never will. But internally, I judge you harshly and resent you. However, I have fiddled expenses myself (worse than yours).
  *   *The Test:*
      *   If Camp 1 says standing is lost here, they must explain how a purely private attitude violates a second-personal address norm. (They usually resort to 'addressing the moral community' which risks vacuity).
      *   If Camp 1 says standing is *retained* here (because no address occurred), then 'standing' is not a condition of *blame* simpliciter, but only of *communicated blame*.
      *   If Camp 2 says standing is lost here, they confirm their view is about *comparative fairness of judgment*, not *authority to address*.
  *   *Progress Marker:* Agreement on whether 'standing' applies to unexpressed attitudes. If it does not, the 'Address' camp wins the definition but loses the scope. If it does, the 'Address' camp must expand their theory of address.

  **III. Formal Treatment of the 'Defect'**
  Stop asking "Do they have standing?" and start asking "What norm is violated?"
  *   Is it a **Right-Based Violation?** (The blamee has a right not to be blamed by *this* person).
  *   Is it a **Duty-Based Violation?** (The blamer has a duty not to blame *in this condition*).
  *   Is it a **Good-Based Violation?** (The blame fails to achieve the good of moral accountability).

  *Progress Marker:* If the group can agree that the hypocrite violates a *duty* (to oneself or the community) rather than infringing a *right* (of the blamee), the 'Comparative' camp's intuition is preserved without needing the 'Authority' machinery.

  **IV. The 'Sceptic' Challenge: The Redundancy Test**
  Force Camp 3 to be specific. Ask them to redescribe the expense case without using 'standing'.
  *   *Example:* "The hypocrite shouldn't blame because it undermines the efficacy of the norm," or "It is unfair to the blamee."
  *   *Progress Marker:* If the Redescription leaves something out—specifically, the *feel* of the blame being *null* or *void* rather than just *unwise*—then Camp 1 & 2 have a point about a sui generis status. If the Redescription captures everything perfectly, Camp 3 wins. The group should look for the 'residue': is there a specific phenomenological or normative remainder when a hypocrite blames that isn't covered by 'unfairness' or 'inefficacy'?

  ### Summary Recommendation

  Do not try to settle who is 'right' about standing. Instead, propose that the group treat 'standing' as a **disjunctive concept** for the next session.

  Assign the following task: "For the next meeting, no one is allowed to use the word 'standing'. You must specify whether you mean 'Normative Authority to Demand', 'Fairness-based Permission to Express', or 'Explanatory Category'."

  My prediction is that Camp 1 will retreat to Authority, Camp 2 will retreat to Permission, and Camp 3 will remain on Ontology. Once separated, you will find Camp 1 and Camp 2 are largely compatible (one can lack permission but retain authority, or vice versa), and the real fight is solely between the pair of them against Camp 3 on the ontological question. That is a cleaner, more productive fight to have.

  You are not going in circles; you are spiralling. You are covering the same ground, but at different altitudes. Bring them to the same altitude, and the circles should close.
