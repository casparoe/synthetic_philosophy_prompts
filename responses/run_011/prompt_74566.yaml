answer: |-
  The showrunner's analogy is seductive because it is functionally true: all adaptation is translation. But in history, the "source text" is not a poem; it is a claim on reality. His argument performs two jobs: it lowers the bar for accuracy (shifting from *truth* to *effect*) and raises the stakes for boredom (arguing that obscurity is a greater sin than fabrication). The conclusion he licenses is slippery. He moves from "you may invent *connective tissue*" to "you may invent *substantive fact*." The former is editing; the latter is forgery.

  **The Translation Correspondence Table**
  *   **Source Text:** The fragmentary archive (transcripts, letters, conflicting press).
  *   **Translator:** The Showrunner/Writer.
  *   **Target Reader:** The Audience (mass market).
  *   **Untranslatable Pun:** Nuance lost to time or medium constraints.
  *   **Mistranslation:** A scene that fails emotionally or confuses the plot.
  *   **Fidelity Metric:** Aesthetic resonance, not factual correspondence.

  **Fatal Disanalogies**
  1.  **Ontological Stability:** A poem has a fixed text. A life does not. The "original" here is already a reconstruction of missing pages and biased reports. By resolving contradictions (Invention #4), the showrunner isn't translating; he is deleting the ambiguity that *is* the historical record.
  2.  **Epistemic Transparency:** A reader knows they are holding a translation. An audience watching a drama often absorbs the image as memory. When the composite overseer (Invention #1) walks the lot, the grandchild sees a specific man, not a literary device.
  3.  **Distribution of Harm:** In translation, a bad choice hurts the reader's experience. In historical drama, a bad choice hurts the *subject's* memory and the descendants' inheritance. The analogy imports the assumption that the dead have no stake in their representation.

  The showrunner's conclusion does not survive. The translation analogy protects necessary compression, but it cannot ethically license the fabrication of evidence (the speech) or the erasure of doubt (resolving the newspapers).

  **The Fresco Inpainting Correspondence Table**
  *   **Damaged Wall:** The Archive (missing pages, contradictions).
  *   **Original Pigment:** Verified facts (dates, names, established locations).
  *   **Inpainting:** Dramatic reconstruction.
  *   **Hatch Marks:** Cinematic cues distinguishing fact from speculation.
  *   **Reversibility:** The ability for the audience to mentally separate the patch from the plaster.
  *   **Ethic:** *Minimum intervention* for legibility.

  **Testing the Four Inventions**
  1.  **Composite Overseer:** **Permitted**, but requires "hatching." Merging witnesses is structural mortar. However, presenting three men as one specific historical individual violates the "distinguishable up close" ethic.
  2.  **Invented Speech:** **Forbidden.** This is painting a new face on a surviving fragment. The record says "they met." To dictate the words is to forge the signature.
  3.  **Timeline Compression:** **Permitted.** Moving the fire two years is structural scaffolding. It does not alter the *nature* of the event, only its placement, provided causality remains intact.
  4.  **Resolving Contradictions:** **Forbidden.** The contradiction *is* the texture of the wall. To pick the "better third act" is to paint over the crack. The audience must see the break.

  **The Problem of the Hatch Mark**
  Your friend's ethic relies on the viewer's ability to step back and see the whole, then step forward and see the patch. Film has no viewing distance; the screen is the same size in the theater and the phone. "Reversibility" is impossible; you cannot un-watch a lie. To make this work, the "hatch marks" must be diegetic or structural. A title card ("The record is silent here") breaks the spell but saves the ethics. A voiceover from the granddaughter ("He told me this, but the papers say that") creates the necessary distance. Without these, the inpainting becomes indistinguishable from the original, violating the restorer's code.

  **A Better Analogy: The Séance**
  Both Translation and Fresco assume a passive subject. A **Séance** acknowledges the active conjuring. You are not translating a text or repairing a wall; you are summoning an image of the dead for the living, knowing full well you are using trickery to do it.
  *   **The Medium:** The Filmmaker (acknowledged as a conduit, not an author).
  *   **The Spirits:** The Historical Figures (who cannot consent).
  *   **The Sitters:** The Audience and the Descendants.
  *   **The Ethic:** Honesty about the trick.

  A séance does not claim the spirit is physically present; it claims the *contact* is real. Applied to your series, this requires breaking the fourth wall. It demands that the uncertainty be part of the drama. When the newspapers contradict, the camera should linger on the discrepancy. When the speech is invented, the visual language should shift—perhaps to a subjective POV that admits, "This is how we imagine it felt," rather than "This is what happened."

  **The Verdict**
  Your showrunner is right about the **Timeline Compression**. That is the grammar of narrative, the cost of entry for a six-part structure. He is also defensible on the **Composite Overseer**, provided the character is not given a specific historical name that belongs to one of the three real men.

  He is wrong about the **Invented Speech** and the **Resolved Contradictions**. These are not translations; they are usurpations. The speech steals the defendant's agency; the resolution steals the town's ambiguity. The "Translation" defense fails because it treats history as content to be optimized rather than a relationship to be honored. The "Fresco" ethic shows us why: you may fill the gap to make the image legible, but you must not paint over the damage and claim it was never there.

  If the granddaughter is an associate producer, use her. Not as a shield, but as a hatch mark. Let her voice be the margin note. If you cannot mark the inventions, you cannot make them. The dead can survive being translated; they cannot survive being edited without a trace.
