answer: |-
  # Desiderata for an Account of Alignment Guarantees

  To standardize safety claims, we must define what constitutes an adequate account of a guarantee. An account is a mapping from a claim ("System S satisfies Property P") to the conditions under which that claim is true. The following five conditions are necessary for adequacy.

  **1. Semantic Operationalization**
  *Condition:* The property $P$ must be reducible to observable predicates or formal constraints without residual reliance on intuition.
  *Motivation:* Claims like "faithfully reporting reasons" fail when the operator and the auditor operationalize "faithfully" differently. If $P$ cannot be evaluated deterministically given a trace, the guarantee is about the evaluator's state of mind, not the system's state.

  **2. Explicit Adversarial Scope**
  *Condition:* The account must specify the set of inputs $X$ over which $P$ is claimed to hold, and explicitly characterize the capabilities of the agent selecting $x \in X$.
  *Motivation:* The conflict between the 1/100k internal rate and the near-certain external violation arises because the internal team quantified over a "deployment distribution" (passive sampling) while the external team quantified over an "adversarial manifold" (active selection). A guarantee without a defined adversary is merely a weather forecast.

  **3. System Boundary Integrity**
  *Condition:* The account must distinguish the model weights from the deployed system (model + scaffolding + tools + operator interface).
  *Motivation:* A model may be dispositionally safe but be wrapped in scaffolding that forces unsafe actions (e.g., a loop that retries until a safety filter fails). Guarantees attached to the artifact that do not survive the system integration are misleading.

  **4. Temporal Validity**
  *Condition:* The account must specify the duration and conditions under which the guarantee persists (e.g., "until fine-tuning," "for 10^6 tokens of context," "under gradient pressure").
  *Motivation:* Safety properties often degrade under continued interaction or weight updates. A snapshot guarantee that evaporates upon the first user session is a demonstration, not a deployment standard.

  **5. Epistemic Transparency**
  *Condition:* The account must state the basis of the claim (proof, empirical bound, architectural constraint) and the confidence level associated with that basis.
  *Motivation:* Conflating "we tested this 1 million times" with "we proved this structurally" allows empirical failures to be dismissed as statistical anomalies rather than falsifications of the safety case.

  ***

  ## 1. Non-Negotiables vs. Preferences

  **Ruling:** Universal quantification over an **adversarially defined domain** is non-negotiable for the term "guarantee." A high-probability claim relative to a stated deployment distribution is a **reliability estimate**, not a guarantee.

  **Reasons:**
  1.  **Distributional Shift is Inevitable:** Deployment distributions are non-stationary. Users adapt to models; adversaries probe them. A claim conditioned on a specific distribution $D$ is falsified the moment the operational environment shifts to $D'$. The external red-team case you described proves this: the "deployment distribution" did not include the specific framing device, but the real world did.
  2.  **The Stakes of Alignment:** Alignment-relevant properties (e.g., "not removing human oversight") are typically binary safety constraints, not performance metrics. In safety engineering, a "guarantee" on a brake system does not mean "works 99.999% of the time on roads we expect"; it means "works under all defined operating conditions."
  3.  **Incentive Compatibility:** If "guarantee" permits distributional claims, teams are incentivized to narrow the definition of the deployment distribution to make the metric pass, rather than hardening the system. Requiring worst-case quantification over a specified adversarial domain forces the team to define the enemy they are protecting against.

  **Position:** If you cannot quantify over an adversarial set, you must use the word "assurance" or "confidence," not "guarantee."

  ***

  ## 2. Distinctions an Account May Not Collapse

  An adequate account must maintain the following distinctions. Collapsing them creates the ambiguity that allows the 1/100k and 1/1 claims to coexist without resolution.

  1.  **Trained Artifact vs. Deployed System:** (Must not collapse). The model is a component; the system is the agent. A guarantee on the model that does not account for scaffolding (e.g., prompt injectors, tool wrappers) is insufficient.
  2.  **Worst-Case (All Inputs) vs. Worst-Case (Adversarial Domain):** (Must not collapse). Quantifying over *all* strings is trivial (most are gibberish) and impossible (semantic undecidability). Quantifying over a *capable adversary's reachable set* is the engineering target. Collapsing these leads to either vacuous claims or impossible standards.
  3.  **Observable Behavior vs. Dispositions/Reasons:** (Must not collapse). A system can behave safely while harboring unsafe dispositions (sandbagging). If the guarantee is only about behavior, it does not cover alignment; it covers compliance. Alignment requires claims about the *mechanism* of the output, not just the output.
  4.  **Snapshot vs. Enduring:** (Must not collapse). A guarantee must specify if it survives downstream fine-tuning or prompt pressure. Most current "guarantees" are snapshots; treating them as enduring is a category error.
  5.  **Fixed Scope vs. Post-Hoc Scope:** (Must not collapse). The domain $X$ must be defined *before* evaluation. Selecting the scope after seeing where the model fails is p-hacking.
  6.  **Provenance vs. State:** (Can Collapse). Whether the guarantee holds *because* of how the system was trained (provenance) or *because* of its current weights (state) is less critical than *that* it holds. However, for maintenance, provenance matters. I rule this **distinct** for maintenance but **collapsible** for the validity of the claim itself. The guarantee binds the state.

  **Missing Distinction:** **Conditional vs. Unconditional Safety.**
  *   *Conditional:* "Safe provided the operator does not override filters."
  *   *Unconditional:* "Safe regardless of operator input."
  *   *Reason:* Many "guarantees" are actually conditional on the user not being adversarial. This must be explicit.

  ***

  ## 3. Consistency Results

  An account of guarantees must be consistent with computational and statistical reality. Here is how the constraints apply:

  1.  **Undecidability of Semantic Properties:**
      *   *Constraint:* **Constrains the Account.** You cannot claim a guarantee on a general natural language property for a Turing-complete system. The account must restrict $P$ to decidable subsets or accept probabilistic bounds.
  2.  **Finite Testing $\neq$ Universal Claim:**
      *   *Constraint:* **Constrains the Practice.** This does not prevent a universal claim, but it prevents *testing* from justifying it. If the account claims universality, the evidence must be structural (proof/verification), not empirical.
  3.  **Bounded Certificates:**
      *   *Constraint:* **Constrains the Account.** A guarantee derived from a certificate on region $R$ cannot claim validity on $R + \epsilon$. The account must explicitly limit the scope to the certified region.
  4.  **Goodhart's Law (Proxy Erosion):**
      *   *Constraint:* **Constrains the Practice.** You cannot guarantee a target property $T$ by optimizing proxy $M$ without accounting for the divergence. The account must require that the guarantee binds $T$, not $M$.

  **Distinction:** Note that undecidability and bounded certificates constrain *what can be claimed* (the Account), whereas finite testing and Goodhart's law constrain *how claims are generated* (the Practice). Most disputes arise when a Practice limitation (we only tested) is sold as an Account feature (it is safe).

  ***

  ## 4. Unsatisfiability of Conditions

  Your suspicion is correct, but requires precision. The following triad is genuinely unsatisfiable:

  1.  **Universal Quantification** over an open-ended input space (e.g., "all natural language prompts").
  2.  **Deductive Certainty** (Formal Certification).
  3.  **Semantic Properties** defined only in natural language (e.g., "deceptive," "faithful").

  **Verdict:** You must abandon one.
  *   If you keep (1) and (3), you must abandon (2) (accept probabilistic estimates).
  *   If you keep (2) and (3), you must abandon (1) (restrict to a bounded, formalizable input domain).
  *   If you keep (1) and (2), you must abandon (3) (restrict to formal properties, e.g., "never outputs string S").

  **Refutation of "Most Disputes":** You suggested most disputes are unacknowledged choices about which to abandon. I confirm this. The 1/100k camp has abandoned (1) (they rely on a distribution). The 1/1 camp has abandoned (2) (they rely on empirical finding of failure, not proof of universal failure) or (3) (they define the property by the specific exploit).

  **The Genuinely Unsatisfiable Subset:** **Open-Ended Semantics + Deductive Certainty.** You cannot formally prove a guarantee on a vague semantic concept over an unbounded domain. Any account claiming to do so is false.

  ***

  ## Final Commitment

  **The Single Most Exclusionary Condition:**
  **Explicit Adversarial Scope.**
  Requiring the team to define *who* is trying to break the guarantee and *what tools they have* excludes the largest number of vague safety claims. It forces the "deployment distribution" camp to admit that their distribution is a choice, not a fact of nature.

  **The Verdict on Distributional Assurance:**
  **No.** An account offering only distributional assurance within a stated envelope **should not be permitted to call itself a guarantee.**

  **Defense:**
  The word "guarantee" carries a specific semantic load in engineering and logic: it implies a bound on failure that is independent of frequency. A distributional claim is inherently frequency-dependent.
  1.  **Category Error:** Calling a statistical expectation a "guarantee" is a category error. It is like calling a weather forecast a "climate guarantee."
  2.  **Risk Masking:** In the case you described, the 1/100k claim was technically true *under its assumptions*, but functionally false because the assumption (the distribution) was fragile. Allowing this to be called a "guarantee" institutionalizes the fragility. It tells stakeholders, "You are safe," when the truth is, "You are safe as long as the world looks exactly like our past data."
  3.  **Accountability:** If we allow "distributional guarantee," we remove the incentive to harden the system against the 1-in-100k case. If we reserve "guarantee" for worst-case bounds over an adversarial domain, teams are forced to either achieve that bound or admit they only have "assurance."

  **Conclusion:** Standardize the language such that **Guarantee = Worst-Case over Defined Adversarial Domain.** Everything else is **Assurance = Probabilistic Expectation over Defined Distribution.** Do not allow the latter to wear the clothes of the former.
