answer: |-
  The session turns on delaying the definition of bias until after students have verified the factual accuracy of a deterministic narrative.

  **Reasoning:** If you allow them to hunt for errors before they analyze structure, they will confirm their pre-existing assumption that bias equals falsehood. By forcing them to certify every sentence as true first, you create the cognitive dissonance required to accept your structural claim: that a story can be factually perfect yet explanatorily dishonest.

  **Prerequisites for Intelligibility:**
  Before you introduce the core debate, you must establish two distinctions in the first ten minutes. First, separate **ontology** (what happened) from **epistemology** (how we order what we know); students must understand that a narrative is a construction, not a mirror. Second, redefine **bias** not as a deviation from truth but as a deviation from probability; they need to grasp that an explanation is biased if it assigns 100% certainty to an outcome that was, at the time, contingent. Without these definitions, your argument that "true sentences can build a biased story" will sound like nonsense.

  **The Worked Case:**
  Use **the sinking of the Titanic (April 1912)**.
  *   **It must have:** A standard, widely circulated narrative arc (hubris, speed, iceberg, sinking) where every causal link is factually verifiable; explicit sentences that describe early decisions using knowledge of the final outcome (e.g., "The captain ignored the warning that would have saved them"); and a clear outcome that feels inevitable in retrospect.
  *   **It must not have:** Contested facts (e.g., did the *Californian* see the rockets?) or complex technical barriers to understanding; the focus must remain on the *linking* of events, not the events themselves.
  *   **Why this case:** It is familiar enough that you do not need to spend seminar time teaching the history, allowing you to focus entirely on the methodology of the explanation.

  **Misconceptions and Intervention Points:**
  1.  **"Just don't tell them the ending."**
      *   **When:** During the introduction (Minute 10).
      *   **How:** State explicitly that historians *must* know the ending to select relevant evidence; the error is not knowing the outcome, but allowing the outcome to collapse the contingency of the prior moments.
  2.  **"It only afflicts bad historians."**
      *   **When:** Immediately after the fact-checking exercise (Minute 35).
      *   **How:** Reveal that the text they just certified as 100% factually accurate is the very example of the narrative fallacy; demonstrate that expertise protects against factual error, not structural determinism.
  3.  **"So write counterfactuals instead."**
      *   **When:** During the solution brainstorming phase (Minute 60).
      *   **How:** Reject this as a stylistic fix for a structural problem; explain that inserting "what ifs" does not correct the weighting of the actual events unless the causal architecture is changed.

  **The Trap (Teleological Language):**
  Students will identify sentences like "The ship struck the iceberg that would sink her" as biased because they reference the future. They will conclude that such sentences are methodologically illicit.
  *   **When:** During the sentence-by-sentence verification phase (Minute 25–35).
  *   **How:** Force them to admit the sentence is *true* (the iceberg did sink her). Do not let them condemn the sentence itself. Instead, guide them to see that the bias lies not in the *statement* but in the *selection*: the narrative includes this true sentence while excluding other true sentences (e.g., about weather, wireless traffic) that would restore contingency. You must stop them from concluding "never write teleologically" and lead them to "never write teleologically *without balancing contingency*."

  **Diagnostic Question:**
  "If you were forbidden from changing or deleting a single word of this text, what single change to the **order** of the sentences would most effectively restore contingency to the explanation?"
  *   **Why:** This tests whether they understand that the bias is structural (sequencing/weighting) rather than factual (content/truth).

  **Off-Limits Topic:**
  Openly refuse to engage with the cognitive psychology debate over whether hindsight effects are **memory distortions or genuine belief changes**. State that for the historian's method, the mechanism is irrelevant; the effect on the explanation is the only variable that matters. This prevents the seminar from drifting into neuroscience rather than staying on historical methodology.
