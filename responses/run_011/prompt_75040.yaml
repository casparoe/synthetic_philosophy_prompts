prompt: |-
  I'm a second-year history PhD student and next week I lead a seventy-five-minute methods seminar for second-year undergraduates on hindsight bias and the narrative fallacy in historical explanation. A friend and I argued about it for most of last night, and that argument is what I want the session built on: she holds that the two are one phenomenon under two descriptions, the narrative fallacy being hindsight bias showing up in prose; I hold that the difference is structural, since a narrative can be biased without a single false sentence in it, and a historian can carry admirably calibrated estimates and still tell a story in which the outcome reads as the only thing that could have happened. Don't explain the material to me — plan how I should explain it. Tell me what has to be in place before the question is intelligible to them at all (they will arrive assuming that bias means getting the facts wrong), which single worked case should carry the whole session and what that case must and must not have, and the misconceptions they will form together with the precise point in the sequence where I should head each off — I'm bracing for "just don't tell them the ending," "it only afflicts bad historians," and "so write counterfactuals instead." I also need help with one trap: perfectly true historical sentences that describe an earlier event only by reference to a later one, which they will want to condemn as biased, and which is exactly the conclusion I must not let them reach. Finish with a single question I can put to the room that would show whether they have grasped the structural claim rather than merely filed away a warning, and tell me what I should openly refuse to get into at this level — I suspect the dispute over whether hindsight effects are memory distortions or genuine belief changes. They already have an assigned reading, so please don't suggest any. Lead with your bottom line in the first sentence — the one sequencing decision the whole session turns on — and then give the reasoning, with no preamble and no restating of my question.
