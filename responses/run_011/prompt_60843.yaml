  *   **Part (c) Step (2) Validity:** **Settled.** Within the Harrigan-Spekkens framework, orthogonal states *must* have disjoint supports if the model reproduces QM probabilities. This is a mathematical consequence of the definitions, not a contested interpretive point. The student is straightforwardly incorrect here.
  *   **Part (c) $\lambda$-mediation vs. PI:** **Settled.** These are distinct definitions in the literature. $\lambda$-mediation is part of the definition of an ontological model; PI is an additional constraint on composite systems. The student's conflation is an error of definition.
