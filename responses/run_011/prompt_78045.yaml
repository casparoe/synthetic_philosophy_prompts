answer: |-
  You have isolated a specific failure mode in metaphysical reasoning that standard philosophical taxonomy often tries to dissolve rather than name. You are right to reject the reflexive "it's just a verbal dispute" label. In a standard verbal dispute, aligning definitions dissolves the conflict. In the case you describe, aligning definitions *fails* to dissolve the conflict because the disagreement is not about the definition, but about the **ontological status of the referent**.

  Here is the carving you asked for.

  ### 1. The Nearest Existing Ideas (and why they fall short)

  **A. Verbal Dispute (Chalmers)**
  *   **The Fit:** Captures the "no empirical difference" aspect.
  *   **The Miss:** Chalmers' framework assumes that if definitions and empirical facts align, the disagreement vanishes. In your case, the disagreement persists *after* this alignment. The participants feel a residual "substantive" tension that standard verbal dispute theory says shouldn't exist.

  **B. Quantifier Variance (Sider)**
  *   **The Fit:** Suggests that "there exists" might mean different things to different people even if they use the same words.
  *   **The Miss:** This is a technical fix that explains *how* they can disagree, but it doesn't name the *phenomenological shape* of the argument. It also requires accepting a controversial meta-ontological view that the arguers themselves would likely reject.

  **C. The Mind Projection Fallacy (Jaynes/Yudkowsky)**
  *   **The Fit:** This is the root *error*. It describes treating properties of your internal map (discrete categories like "one mind" vs. "two minds") as properties of the territory (the physical brain).
  *   **The Miss:** It names the cognitive bug, not the *dialectical configuration*. You need a term for the *disagreement itself*, not just the mistake causing it.

  **D. Further Fact Intuition (Parfit)**
  *   **The Fit:** Parfit explicitly addresses split-brain and replacement cases, arguing that we *feel* there must be a fact of the matter (a "further fact") beyond physics and psychology, but there isn't.
  *   **The Miss:** Like MPF, this describes the psychological drive, not the structure of the argument between two people insisting they are right about the world.

  ### 2. The Coinage: "Phantom Fact Dispute"

  Since no single existing term captures the *configuration* (agreement on facts + agreement on definitions + insistence on substantive binary disagreement + rejection of vagueness), I propose:

  **Term:** **Phantom Fact Dispute**

  **Definition:** A disagreement between two parties who share complete agreement on all low-level physical/functional facts and high-level conceptual definitions, yet insist on a binary disagreement regarding the existence or count of a high-level entity. The dispute is characterized by the false premise that the high-level category *must* correspond to a discrete switch in the low-level substrate, despite the substrate being continuous, branching, or underdetermined.

  **Why this carves the joint:**
  It isolates the specific error of **reifying a compression algorithm**. "Mind" and "Person" are lossy compressions of physical states. A Phantom Fact Dispute occurs when two compressors argue about the *file count* when the underlying data is a streaming blob that doesn't respect file boundaries.

  ### 3. Boundary Cases

  **Inside the Boundary (Phantom Fact Dispute):**
  *   **The Split-Brain Case:** (As you described). Physics is fixed. "Subject" is defined functionally. The disagreement is whether the functional cluster counts as "1" or "2" in a context where the cluster has branched.
  *   **The Ship of Theseus (Neuron Replacement):** Physics is fixed at every step. "Same Person" is defined by continuity/memory. The disagreement is about whether the *identity relation* holds across the gradual swap. The territory (the atoms) doesn't contain an "identity tag," so arguing about the tag is a Phantom Fact Dispute.

  **Outside the Boundary (Just Inside):**
  *   **Biological Species Classification:** Two biologists agree on the genome and reproductive behavior of a hybrid animal, but argue whether it is *Species A* or *Species B*.
      *   *Why it's outside:* This is usually conceded to be a **Verbal/Pragmatic Dispute**. Biologists generally accept that species boundaries are fuzzy human carve-ups. They rarely insist there is a *metaphysical fact* about the "true" species independent of breeding populations. If they *did* insist on a metaphysical fact, it would slide into a Phantom Fact Dispute.

  **Outside the Boundary (Just Outside):**
  *   **Hidden Variable Disagreement:** Two physicists agree on all *current* observations of a quantum system, but one believes there is a hidden variable determining the outcome and the other believes there isn't.
      *   *Why it's outside:* This is a **Substantive Empirical Dispute**. It *does* make a difference to the structure of reality (local realism vs. non-locality), and it implies different predictions for future experiments (Bell's inequalities). It is not just about counting high-level entities; it's about the low-level machinery itself.

  ### 4. Does this cover the Replacement Version?

  **Yes.** The neuron replacement case is structurally identical to the split-brain case.
  *   **Split-Brain:** Spatial branching of functional continuity.
  *   **Neuron Replacement:** Temporal stretching of functional continuity.
  In both cases, the arguers are treating "Identity" or "Subjecthood" as a **conserved quantity** (like mass-energy) that must be tracked 1:1. The Phantom Fact Dispute arises because "Identity" is not a conserved quantity in the territory; it is a relational property in the map. The disagreement persists because both sides refuse to update their map to reflect that the territory doesn't support that specific compression.

  ### 5. The Verdict: Who is Mistaken?

  **Both arguers are mistaken.**

  There is **no fact of the matter**.

  This is the Parfit/Sequences conclusion. The mistake is not in their math or their observations; it is in their **ontological expectation**. They are asking a question ("How many minds?") that presupposes the universe stores data in a format (discrete, countable mind-objects) that it does not use.

  *   **Arguer A (Two Minds):** Mistaken because they assume functional separation *creates* a new ontological switch.
  *   **Arguer B (One Mind):** Mistaken because they assume physical continuity *preserves* an ontological switch.
  *   **The Reality:** The "switch" never existed. There are only physical processes and functional patterns. When the patterns branch (split-brain) or drift (replacement), the question "is it the same?" ceases to have a truth value, not because it's vague, but because it is **category-error**.

  To insist there *is* a definite fact is to commit the Mind Projection Fallacy: demanding that the universe respect the discrete boundaries of your concept "Mind." The correct dissolution is not to pick a side, but to reject the premise that a binary answer is required by the territory.

  **Summary:** You are witnessing a **Phantom Fact Dispute**. It is a substantive-seeming argument driven by the reification of high-level abstractions. Both sides are wrong to believe the territory contains the fact they are fighting over.
