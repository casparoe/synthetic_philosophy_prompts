prompt: |-
  Situation: I'm on a small committee at work about whether to let a wellness vendor collect DNA samples from employees, and one of my collegues keeps shutting down the privacy objections with the line 'DNA is just a code — nobody's taking anything from anybody, you're copying a string.' He also likes to add that since the code is basically the same in everybody, its public information anyway, like a language. I'm pretty sure he's sliding between several very different things 'code' could mean and I can't pin him down.

  Can you lay out the distinct claims 'DNA is a code' might be making? I mean things like: the technical sense where it just names the codon-to-amino-acid mapping table; a cipher somebody encrypted for a recipient; a program that some machine executes; a natural language with meaning for a reader; a legal code, i.e. a set of rules; a Shannon-style information channel; and whatever other readings I haven't thought of. For each, say whether it's trivially true, substantive but defensible, or flatly false, and what an argument could actually get out of it.

  Then the part I really need: which reading does his argument require, is there any single reading that's both true and enough to get him his conclusion, and does the 'same code in everyone so it's public' move survive on any of them? Give me a menu I can bring to the next meeting, not an essay.
