answer: |-
  The objection most likely to sink your talk is the demographer's challenge that colonial bureaucracies rarely followed their own standing orders, meaning your 'expected' denominator is a fiction.

  **1. The 'Paper vs. Practice' Objection (Quantitative Social Historian)**
  *   **The Question:** "You're reconstructing denominators based on statutory requirements, but in colonial administrations, the rulebook often bore little resemblance to ground-level practice. If the District Officer didn't enforce the ordinance, isn't your 'silence' just normal administrative drift rather than a measurable residual?"
  *   **The Reply:** "That is precisely why I'm not treating the rulebook as a description of reality, but as a benchmark for deviation. If the bureaucracy ignored the rule uniformly, the gap would be constant. What I'm finding is variance clustered around specific administrative stressors—staffing shortages, budget cycles—which suggests the rule *was* the operative standard, but capacity to enforce it fluctuated. I'm not measuring compliance; I'm measuring the capacity to comply."
  *   **The Soft Spot:** You need independent evidence that the rule was known and actionable at the district level, not just printed in the capital.

  **2. The 'Survival vs. Creation' Objection (National Archivist)**
  *   **The Question:** "You're conflating archival silence with administrative silence. How do you know these entries weren't created and then lost, destroyed, or never accessioned? You're measuring the archive's survival rate, not the bureaucracy's output."
  *   **The Reply:** "I'm distinguishing between physical loss and administrative non-creation by looking at the structure of the gaps. Physical decay or loss tends to be random across the series—rotting boxes, missing volumes. The gaps I'm identifying are systematic; they cluster by tenure type and administrative timeline. If it were purely survival bias, we wouldn't see the signal correlating with staffing rosters."
  *   **The Soft Spot:** Proving negative survival bias is notoriously difficult without a parallel series or inventory logs that no longer exist.

  **3. The 'Violence of Quantification' Objection (Cultural Historian/Microhistorian)**
  *   **The Question:** "By turning these missing people into residuals in a dataset, aren't you replicating the bureaucratic erasure you're critiquing? You're making them countable only by forcing them into the categories that silenced them in the first place."
  *   **The Reply:** "I'd argue the opposite: treating silence as a discursive theme often allows us to gesture at the missing without confronting the scale of their absence. Quantifying the gap forces us to acknowledge the magnitude of the exclusion. It doesn't recover their voices, but it prevents us from pretending the record is representative when it structurally isn't."
  *   **The Soft Spot:** This concedes you cannot recover individual agency, which may feel like a hollow victory to a microhistorian.

  **4. The 'Endogeneity' Objection (Historical Demographer)**
  *   **The Question:** "Isn't this circular? You're using the administrative rules to define the expected population, but you're validating the rules by the gaps in the data. How do you know you haven't just modelled your own assumptions about what should be there?"
  *   **The Reply:** "The rules are derived from external statutory instruments—gazettes, ordinance books, correspondence—not from the data series itself. The data is only used to test the *effect* of those rules. The expectation is set exogenously; the residual is the only thing derived from the register."
  *   **The Soft Spot:** If the statutory instruments are incomplete or ambiguous, your external benchmark is still shaky.

  **5. The 'Selective Enforcement' Objection (Colonial Historian)**
  *   **The Question:** "In this period, enforcement was often racialized or class-based. Are you sure these gaps aren't just reflecting a policy decision to ignore certain tenure types rather than a capacity issue?"
  *   **The Reply:** "That is a competing hypothesis I'm testing for. However, the clustering around staffing shortages suggests capacity constraints rather than pure policy selection. If it were purely policy, the gaps would be stable over time, not fluctuating with the district office's personnel records."
  *   **The Soft Spot:** Policy and capacity are often intertwined; a lack of staff might be the mechanism chosen to enforce a policy of neglect.

  **6. The 'Alternative Explanations' Objection (Quantitative Social Historian)**
  *   **The Question:** "Could these gaps be explained by seasonal migration, disease outbreaks, or economic shocks rather than administrative failure? You're attributing the variance to the office, but the population might have simply moved."
  *   **The Reply:** "I've controlled for seasonality and known economic shocks using trade data and climate records. The residuals remain significant when those variables are included. The silence persists even when the population was demonstrably present and economically active."
  *   **The Soft Spot:** You cannot control for unobserved variables, and local migration flows are often poorly documented.

  **7. The 'Scalability' Objection (Quantitative Social Historian)**
  *   **The Question:** "This seems incredibly labour-intensive for a single district series. Is this a method you can actually scale, or is it just a party trick for this specific archive?"
  *   **The Reply:** "It's not intended as a universal method for every series, but as a corrective for high-stakes administrative data where denominators are assumed. We don't need to do this for every parish register, but for colonial tax data where the state's reach is the central question, the investment is justified."
  *   **The Soft Spot:** It limits the generalisability of your contribution to specific types of bureaucratic archives.

  **8. The 'Narrative Value' Objection (Cultural Historian)**
  *   **The Question:** "Even if you prove the gaps are structural, what does this actually change about the historical narrative? Does it alter our understanding of colonial power, or just the precision of our estimates?"
  *   **The Reply:** "It shifts the narrative from 'colonial state failure' to 'selective colonial visibility'. It suggests the state wasn't too weak to record these people, but structurally organised to exclude them unless specific conditions were met. That changes how we interpret state capacity."
  *   **The Soft Spot:** If the narrative shift is subtle, they may decide the methodological effort wasn't worth the historiographical gain.

  **Strategic Concessions & Crucial Replies**

  **What to concede in the first ten minutes:**
  Explicitly concede that the colonial bureaucracy was not a rational, monolithic machine. Say something like: "I am not arguing that the District Office followed its rules perfectly. I am arguing that their deviations from those rules were not random." This disarms the 'Paper vs. Practice' objection before it becomes an attack on your competence.

  **The single reply that must land:**
  You must successfully distinguish between **archival loss** (the box rotted) and **administrative silence** (the line was never written). If the Archivist convinces the room that you are just measuring decay, the method collapses. Your reply to Objection 2 must be delivered with absolute confidence.

  **The question you're dreading:**
  *   **The Question:** "What about the people who successfully avoided the bureaucracy entirely? Your method measures those the state *tried* to count but failed; it doesn't capture the populations who remained invisible by design or choice."
  *   **The Reply:** "That is correct, and this method does not claim to capture the totally unrecorded. It measures the 'attempted but failed' enumeration. However, distinguishing between those the state tried to count and those it ignored is itself a crucial measure of colonial intent. We cannot measure the totally invisible, but we can measure the limits of the visible."
  *   **Why it's dreaded:** It exposes the boundary of your method's claim and might make the room feel you've oversold the 'silence' aspect.
