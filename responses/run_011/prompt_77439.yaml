answer: |-
  Your brother is arguing from a specific intersection of philosophy (Derek Parfit's *Reasons and Persons*) and behavioral economics (hyperbolic discounting). It's a sophisticated position, often called the "Multiple Selves Model." He isn't making it up; this is a genuine school of thought.

  However, analogies are tools, not truths. The relay team analogy is a tool that highlights *temporal distance* but hides *physical continuity*. Here is the stress test you asked for.

  ### 1. The Correspondence Table

  Here is how the relay race maps onto his theory of procrastination, followed by where the mapping breaks.

  | Relay Race Element | Brother's Theory (Procrastination) | The Leak (Where it breaks) |
  | :--- | :--- | :--- |
  | **Runner 1** | Present Self (You-at-17) | Runner 1 has a distinct nervous system; Present Self shares a brain with Future Self. |
  | **Runner 2** | Future Self (You-at-40 or You-tomorrow) | Runner 2 starts fresh; Future Self inherits Present Self's fatigue, stress, and habits. |
  | **The Baton** | The Task / Responsibility | A baton is an object; a task is a *state of being*. Dropping it stops the race; ignoring it makes the next leg harder. |
  | **The Handoff** | Passage of Time / Sleep | Handoffs are clean moments; time is a continuous flow. There is no moment where "you" stop and "he" starts. |
  | **The Finish Line** | The Deadline / Goal | In a relay, the team wins together. In life, the *body* wins or loses together. |
  | **Team Strategy** | Binding / Ulysses Contracts | Runners agree on strategy beforehand. Future-You did not sign the contract Present-You is enforcing. |

  ### 2. Where the Analogy Leaks

  The relay analogy quietly imports three features that weakness of will does not have:

  1.  **Physical Separation:** In a relay, Runner 1 does not feel Runner 2's lactic acid buildup. In procrastination, Present-You feels Future-You's anxiety *in advance*. That dread you feel when you think about the homework? That is Future-You's pain, experienced by Present-You. The relay ignores this shared nervous system.
  2.  **Voluntary Association:** Relay runners choose to be on the team. You did not choose to be the predecessor to your future self. You are causally locked into this relationship. You cannot quit the team.
  3.  **Zero-Sum Effort:** In a relay, if Runner 1 sprints too hard, they might tire out, but Runner 2 gets a better position. In procrastination, if Present-You "sprints" (parties), Future-You doesn't just run their leg; they have to run *your* leg too. It's not a handoff; it's a carry.

  ### 3. Addressing Your Four Objections

  Here is how the leaks answer your specific questions.

  **Q1: If Future-Me is a stranger, why does imagining him hurt right now?**
  *   **The Leak:** Shared Phenomenology.
  *   **The Answer:** Your brother is double-counting. He claims the selves are distinct enough to avoid guilt, but connected enough to share a brain. When you imagine Future-You failing, your brain simulates that pain *now*. This is called "affective forecasting." If he were truly a stranger on the bus, you wouldn't feel a visceral knot in your stomach. The fact that you do proves the "identity connection" is strong enough to warrant moral concern. You are not negotiating with a stranger; you are negotiating with your own nervous system.

  **Q2: Relay runners are different bodies. Here there is one body/reputation.**
  *   **The Leak:** Causal Continuity.
  *   **The Answer:** The analogy is carrying the argument, not the other way around. In a relay, if Runner 1 trips, Runner 2 can still run (they just lose). In your life, if Present-You trips (fails the class), Future-You *cannot run*. The race ends. Because the consequences land on the same biological organism, the distinction between "me" and "him" is semantic, not ontological. You can't disown the debt, the grade, or the degree.

  **Q3: If binding is a treaty, who signed for the future guy? Is it kidnapping?**
  *   **The Leak:** Consent and Agency.
  *   **The Answer:** This is the strongest point against your brother. A treaty requires two signatories. When you install a blocking app, Present-You is signing for both parties. If Future-You wakes up at 11:55 PM wanting to scroll and can't, that is not a treaty; it is **paternalism**. It is one temporal slice of you restricting the liberty of another. Is it kidnapping? No, because it's the same legal person. But it *is* a restriction of future autonomy. The justification isn't "negotiation"; it's "guardianship." You are acting as the guardian of a future beneficiary who cannot protect himself.

  **Q4: Preference reversal: One irrational person or two consistent ones?**
  *   **The Leak:** Rationality vs. Identity.
  *   **The Answer:** You are right; he is wrong here. Standard economics views hyperbolic discounting as a **failure of rationality in a single agent**, not evidence of multiple agents. If I say I want an apple tomorrow more than a candy bar today, but when tomorrow comes I want the candy bar more, that is *intransitive preference*. It is one person changing their mind, not two people disagreeing. Parfit's philosophy allows for reduced identity, but it doesn't turn a preference flip into a personhood split. He is using a metaphor (two people) to describe a mechanism (time inconsistency) as if it were literal truth.

  ### 4. The Verdict on His Conclusions

  Do his conclusions survive the stress test?

  **Conclusion 1: "Stop feeling guilty. You didn't hurt anybody."**
  *   **Verdict: FAILS.**
  *   **Why:** Guilt is a social signal, but in this context, it functions as an internal alarm system for self-harm. Even if we accept Parfit's view that Future-You is "less you," he is still *you enough* that damaging him is self-injury. You wouldn't say, "I shouldn't feel pain when I punch myself in the face because my hand is different from my nose." The shared consciousness means the harm is internal. You should feel **regret** (for poor management) if not **guilt** (for moral failing). The "no guilt" argument relies on the separation being total, but the consequences prove it isn't.

  **Conclusion 2: "Locking yourself down is fine/required. It's a treaty."**
  *   **Verdict: SURVIVES (but for the wrong reason).**
  *   **Why:** The *action* is correct, but the *justification* is flawed. Binding mechanisms (Ulysses contracts) are effective and rational tools for managing hyperbolic discounting. However, it's not a "treaty between strangers." It is **self-regulation**. It is the rational mind building guardrails for the impulsive mind. You don't need the "different person" theory to justify this; you just need to admit that your preferences change over time and you want to honor your long-term goals over your short-term impulses. The lock is valid, but it's an act of discipline, not diplomacy.

  ### 5. A Better Picture

  The relay team is too clean. It implies a handoff where the first runner's job is done. A better picture needs to capture the **shared burden** and the **shifting control**.

  **The Better Analogy: The Long-Haul Shift Pilot**

  Imagine you are piloting a plane across the ocean. There is only one plane (your body/life). There is only one set of passengers (your reputation/relationships). But there are two shifts.

  *   **Present-You** is the Day Pilot.
  *   **Future-You** is the Night Pilot.

  **Why this works better than the Relay:**
  1.  **Same Vehicle:** If the Day Pilot crashes the plane, the Night Pilot doesn't get a turn. You share the fate of the vessel.
  2.  **Shared Fatigue:** If the Day Pilot flies erratically, the plane is damaged and the Night Pilot has to fly a broken machine. You aren't handing off a baton; you are handing off the *condition of the cockpit*.
  3.  **The Binding:** The Day Pilot can set the Autopilot (the app, the savings plan). This isn't a treaty; it's **standard operating procedure**. The Day Pilot has a fiduciary duty to the Night Pilot to leave the plane in flyable condition.
  4.  **The "Stranger" Feeling:** When you are tired, the other shift *does* feel like a stranger. You can't feel their fatigue yet. But you know logically that if you don't rest the plane, they will crash.

  **The Takeaway:**
  Your brother is right that Future-You feels distant, and he is right that binding mechanisms work. But he is wrong that this absolves you of responsibility. In the Shift Pilot model, the Day Pilot is *more* responsible, not less, because they hold the controls while the plane is in good condition. Procrastination isn't declining to help a stranger; it's the Day Pilot drinking on the job and leaving the Night Pilot to deal with the turbulence.
