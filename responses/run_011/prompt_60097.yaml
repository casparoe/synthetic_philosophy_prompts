  *(Self-Correction on Color Phi details)*: Standard Color Phi: Red dot at A. Green dot at B. Subject sees Red dot move from A to B and change to Green *during* transit. The user said "change color partway along the path." This is correct. The paradox is that the color change is perceived *before* the second flash occurs physically.
