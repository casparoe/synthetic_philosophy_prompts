  # The Explanatory Stance Sorter

  **Instructions:** For a given proposal, answer the following eight questions in order. Follow the path to a leaf. Each leaf names the stance and lists its "awkward commitment"—the implication defenders least wish to discuss.

  ### The Nodes (Questions)

  **1. Ontology:** Does the higher-level term refer to a real feature of the world, or is it a mistaken label for a collection of lower-level events?
  *   **Yes:** Commits to realism about the phenomenon.
  *   **No:** Commits to eliminativism; the term is an error.

  **2. Derivability:** If you had perfect knowledge of the lower-level parts and rules, could you calculate the higher-level outcome without adding new laws?
  *   **Yes:** Commits to the sufficiency of the base level.
  *   **No:** Commits to the insufficiency of the base level (novelty).

  **3. Causal Feedback:** Does the existence of the higher-level pattern change how the lower-level parts behave?
  *   **Yes:** Commits to downward constraint or influence.
  *   **No:** Commits to the base level running independently of the pattern.

  **4. Fundamentality:** Is the higher-level property treated as a basic law of the universe, or as a result of specific historical arrangements?
  *   **Yes:** Commits to the property being universal and fundamental.
  *   **No:** Commits to the property being contingent and local.

  **5. Origin Scope:** Does the explanation account for the origin of the pattern within the system, or does it assume the pattern arrived from outside the system's scope?
  *   **Yes:** Commits to an internal history (even if brute).
  *   **No:** Commits to an external source or unexplained arrival.

  **6. Computational Tractability:** If determined by lower levels, can you predict the pattern without simulating every single step of the process?
  *   **Yes:** Commits to the existence of predictive shortcuts.
  *   **No:** Commits to computational irreducibility (simulation is the only proof).

  **7. Causal Contribution:** If determined and predictable, does the higher-level description identify causes that the lower-level description misses?
  *   **Yes:** Commits to the higher level having unique explanatory power.
  *   **No:** Commits to the higher level being causally redundant.

  **8. Intermediate Reality:** In the step-by-step account, are the intermediate stages real physical channels or just descriptive shorthand?
  *   **Yes:** Commits to the reality of intermediate levels (accelerators).
  *   **No:** Commits to intermediate levels being mere conveniences (nothing-but).

  ---

  ### The Leaves (Stances)

  **1. Eliminativism** (1-No)
  *   **Commitment:** The folk term picks out nothing at all.
  *   **Awkward Commitment:** You must explain why everyone acts as if the phenomenon exists despite it being a mistake.

  **2. Top-Down Lifter** (1-Yes, 2-No, 3-Yes, 4-Yes)
  *   **Commitment:** A fundamental physical property governs the parts.
  *   **Awkward Commitment:** You posit a new law of physics for every new complex system type.

  **3. Strong Emergence** (1-Yes, 2-No, 3-Yes, 4-No)
  *   **Commitment:** The level is real, novel, and governs the base contingently.
  *   **Awkward Commitment:** You claim effects without a mechanism connecting them to the parts.

  **4. Burden Relocation** (1-Yes, 2-No, 3-Yes/No, 5-No)
  *   **Commitment:** The account relocates the burden to a domain explicitly out of scope.
  *   **Awkward Commitment:** Your explanation ends exactly where the hard question begins.

  **5. Mysteryism** (1-Yes, 2-No, 3-No, 5-Yes)
  *   **Commitment:** The phenomenon is real and irreducible, but its origin is inexplicable.
  *   **Awkward Commitment:** You accept the phenomenon but forbid asking how it got there.

  **6. Weak Emergence** (1-Yes, 2-Yes, 6-No)
  *   **Commitment:** Derivable in principle, but only by running the whole process forward.
  *   **Awkward Commitment:** You claim an explanation exists that is too complex for any human to understand.

  **7. Epiphenomenalism** (1-Yes, 2-Yes, 6-Yes, 7-No)
  *   **Commitment:** The higher level is real but causally redundant because the lower level fills the role.
  *   **Awkward Commitment:** You admit the higher level does no work, yet you keep using it.

  **8. Accelerator Reduction** (1-Yes, 2-Yes, 6-Yes, 7-Yes, 8-Yes)
  *   **Commitment:** Reduction that keeps the intermediate accelerators in view.
  *   **Awkward Commitment:** You must defend the reality of levels you admit are ultimately dissolvable.

  **9. Nothing-But Reduction** (1-Yes, 2-Yes, 6-Yes, 7-Yes, 8-No)
  *   **Commitment:** Level-skipping reduction of the nothing-but variety.
  *   **Awkward Commitment:** You must treat meaningful distinctions as mere convenience.

  **10. Unnamed (Incoherent)** (1-Yes, 2-No, 6-Yes)
  *   **Status:** Underivable yet Tractable.
  *   **Reason:** Incoherent; if you cannot derive it, you cannot calculate it easily.

  **11. Unnamed (Unattractive)** (1-Yes, 2-Yes, 3-Yes, 4-Yes)
  *   **Status:** Derivable, Governs, Fundamental.
  *   **Reason:** Unattractive; why is it fundamental if it can be built from parts?

  **12. Unnamed (Incoherent)** (1-Yes, 2-Yes, 7-Yes, 8-No)
  *   **Status:** Causal Contribution but Shorthand.
  *   **Reason:** Incoherent; if it identifies missed causes, it cannot be mere shorthand.

  ---

  ### Diagnosis of Six Proposals

  **(a) Color Naming (Physiology + Stats)**
  *   **Path:** 1-Yes, 2-Yes, 6-Yes, 7-No.
  *   **Leaf:** **Epiphenomenalism** (Categories describe boundaries but add no causal power).
  *   **Pivot Node:** **Node 7**. If the theorist claimed categories *were* needed to predict data, it would move to Accelerator Reduction.
  *   **Auxiliary:** None.

  **(b) Coded Translation (Arrived from Elsewhere)**
  *   **Path:** 1-Yes, 2-No, 5-No.
  *   **Leaf:** **Burden Relocation**.
  *   **Pivot Node:** **Node 5**. If the origin were explained within the system, it would move to Strong Emergence or Mysteryism.
  *   **Auxiliary:** Depends on the claim that the substrate *could not* produce the machinery (Node 2).

  **(c) Syntactic Embedding (Mutation + Culture)**
  *   **Path:** 1-Yes, 2-Yes, 6-Yes, 7-Yes, 8-Yes.
  *   **Leaf:** **Accelerator Reduction**.
  *   **Pivot Node:** **Node 8**. If cultural transmission were treated as mere shorthand rather than amplification, it would move to Nothing-But Reduction.
  *   **Auxiliary:** Depends on the unstated commitment that culture is a "real physical channel" (Node 8) rather than just a description of usage.

  **(d) Extinction Distributions (Critical State)**
  *   **Path:** 1-Yes, 2-Yes, 6-No.
  *   **Leaf:** **Weak Emergence**.
  *   **Pivot Node:** **Node 6**. If the distribution were predictable without simulating the ecosystem interactions, it would move to Reduction.
  *   **Auxiliary:** None.

  **(e) Integrated Differentiation (Fundamental Property)**
  *   **Path:** 1-Yes, 2-No, 3-Yes, 4-Yes.
  *   **Leaf:** **Top-Down Lifter**.
  *   **Pivot Node:** **Node 4**. If the property were contingent on arrangement rather than fundamental, it would move to Strong Emergence.
  *   **Auxiliary:** None.

  **(f) Machine Understanding (Eliminativist + Dynamics)**
  *   **Path:** 1-No.
  *   **Leaf:** **Eliminativism**.
  *   **Pivot Node:** **Node 1**. If the folk term picked out *something* real, it would move to Reduction (at the dynamics level).
  *   **Auxiliary:** Depends on the claim that "training dynamics" is a lower level than "understanding" (Node 2 logic applied post-elimination).

  ---

  ### Logical Space Analysis

  **Empty Cells (Permitted Combinations with No Leaf)**
  1.  **1-Yes, 2-No, 6-Yes:** (Underivable yet Tractable). *Empty because Incoherent:* You cannot calculate what you cannot derive.
  2.  **1-Yes, 2-Yes, 3-Yes, 4-Yes:** (Derivable, Governs, Fundamental). *Empty because Unattractive:* If parts determine it, it is not a fundamental law.
  3.  **1-Yes, 2-Yes, 7-Yes, 8-No:** (Causal Contribution but Shorthand). *Empty because Incoherent:* If it identifies causes the base misses, it is not just shorthand.

  **Indistinguishable Leaves**
  *   **Mysteryism vs. Burden Relocation:** Both accept the phenomenon but deny an internal origin story.
      *   *Separation Question:* "Is the external source a permanent feature of the universe (Burden) or a historical accident we refuse to explain (Mystery)?"
  *   **Accelerator Reduction vs. Nothing-But Reduction:** Both accept derivability and tractability.
      *   *Separation Question:* "If the intermediate channel were removed, would the outcome fail?" (Accelerator says Yes; Nothing-But says No).
