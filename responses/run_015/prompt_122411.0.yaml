answer: |-
  **Maya:** The rival donkey changes everything. In the textbook case, starvation is distant. Here, inaction has a definite cost. The donkey has a conclusive reason to eat *either* the left bale or the right bale.

  **Leo:** It has a reason to eat *one*, sure. But it doesn't have a reason to eat *this* one. If the bales are identical, the property "being on the left" isn't a reason to go left. By symmetry, "being on the right" is equally valid. They cancel out. So if the donkey walks left, what explains *that* specific movement?

  **Maya:** The disjunctive reason explains it. Reasons license the disjunction: *Eat-L or Eat-R*. Instantiating that disjunction just means doing one of them. Picking left isn't a failure of rationality; it's just what eating-left-or-right consists in practically.

  **Leo:** That's cheating. A reason for (P or Q) doesn't transform into a reason for P. If nothing breaks the tie, the donkey walking left is exactly as unexplained as the donkey standing still. You're saying rational action can be arbitrary.

  **Maya:** I'm saying it can be underdetermined. If you demand a tie-breaker—a specific reason favoring left over right—you're asking for something that doesn't exist.

  **Leo:** Then what is it? If reasons don't select the left bale, is the movement just a random muscular twitch? If I sneeze, I move leftward. Is the donkey's choice indistinguishable from a spasm?

  **Maya:** No, because it's done under the description "eating." The intention is to eat one of the bales. The specific motor path is subordinate. But let's turn your demand around. You say the Will must break the tie. Okay, the Will chooses Left. Why Left?

  **Leo:** Because the Will decides. It's a faculty of spontaneous choice.

  **Maya:** But if the Will chooses Left without a reason favoring Left, isn't the Will's choice itself arbitrary? You've just relocated the problem one level up. Now we need a tie-breaker for the Will's choice. Do you posit a meta-Will?

  **Leo:** No, the Will is the uncaused cause. It stops the regress.

  **Maya:** It stops it by fiat. But if the Will can choose without a reason, why can't the agent? You're positing a magical faculty to do what you deny the agent can do: choose without a differentiating reason.

  **Leo:** Because the Will *is* the agent. Look, consider the variant we read about. Suppose the left bale is very slightly fresher. Not enough to be "better" in a strict sense, but enough to disrupt equality. Some argue this attacks the better/worse/equally-good trichotomy. They say the options are "on a par."

  **Maya:** Exactly. If they're on a par, the slight freshness doesn't make left strictly better, but it allows the agent to commit to left without irrationality. The small improvement shows that equality isn't the only alternative to strict betterness. My view survives: reasons license the choice even when strict maximization fails.

  **Leo:** But if the left bale is even marginally better, doesn't reason demand you take it? If you admit it's better, you've surrendered. You've admitted reasons must decide.

  **Maya:** Only if you insist on the trichotomy. If they're on a par, the slight freshness isn't a decisive reason. It just makes the choice easier. But back to the identical case: if you insist on a tie-breaker for the Will, you're saying the Will acts without reasons. If I act without reasons based on a disjunctive license, you call it a twitch. If the Will acts without reasons, you call it freedom. That's inconsistent.

  **Leo:** The inconsistency is yours. You claim the action is rational. But if symmetry cancels all specific reasons, and you refuse the Will, you have no mechanism for selection. You've got a license to drive, but no engine.

  **Maya:** The engine is the intention to eat. The license covers both lanes. Changing lanes doesn't require a new license.

  **Leo:** But changing lanes requires a turn signal. You have none.

  **Maya:** And your turn signal is attached to a ghost.

  **Leo:** *[Pauses]* If I say the Will chooses, I avoid the twitch objection because the Will is intentional by definition. But if you ask "Why Left?", I have to say "No reason." If you say "No reason" for the agent, you get a twitch. If I say "No reason" for the Will, I get... freedom.

  **Maya:** Or you get a brute fact. But my view doesn't require brute facts about faculties. It just requires accepting that reasons underdetermine choice sometimes. The rival donkey ensures action happens. The symmetry ensures reasons don't specify which. The action is rational because it satisfies the conclusive reason to eat.

  **Leo:** I think the twitch objection still sticks. If nothing distinguishes Left from Right in the agent's deliberation, the transition to motion is causally opaque. You've saved rationality by sacrificing explanation.

  **Maya:** And you've saved explanation by positing a mystery. I'll take the opaque action over the magical will.

  ***

  **Instructor's Note:** Maya wins on the regress argument. Leo cannot explain why the Will selects Left without either reintroducing reasons (which vanish by symmetry) or admitting arbitrariness. If arbitrariness is fatal for the agent, it is fatal for the Will. Maya's disjunctive licensing avoids the regress without requiring a magical faculty.
