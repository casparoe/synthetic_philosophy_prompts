answer: |-
  Your intuition that a single, flat principle is struggling to carry the weight of your verdicts is correct. Your cases reveal a distinction between the *legitimacy of the grievance* (why you strike) and the *legitimacy of the leverage* (how you strike). Your draft principle mixed these, which is why it failed on Case 2 (legitimate grievance, mitigated harm) and Case 9 (legitimate grievance, structural barriers to procedure).

  I recommend adopting a **Two-Tier Principle of Reciprocal Obligation**. This separates the *Just Cause* for action from the *Proportionate Conduct* of that action. It treats the strike not as an absolute right, but as a conditional suspension of the economic peace, justified by a breach of reciprocity and constrained by the duty to minimize collateral damage.

  ### The Principle

  **Industrial action is permissible if and only if it satisfies both Tier 1 (Just Cause) and Tier 2 (Proportionate Conduct).**

  **Tier 1: Just Cause**
  The action must pursue one of the following objects:
  1.  **Economic Balance:** To secure terms of employment that workers cannot reasonably secure through individual exit or the existing agreement. *(Motivated by Case 1, Case 5, Case 9)*
  2.  **Safety and Process:** To remedy an imminent safety threat or a fundamental failure of the grievance process that leaves workers without recourse. *(Motivated by Case 4, Case 13)*
  3.  **Conscience:** To refuse direct complicity in the production of specific outputs that violate fundamental human dignity. *(Motivated by Case 8, Case 7)*

  **Tier 2: Proportionate Conduct**
  The execution of the action must satisfy the following constraints:
  1.  **Withdrawal, Not Obstruction:** The action must rely on the collective withdrawal of labor, not the physical prevention of others working or entering. *(Motivated by Case 11)*
  2.  **Adjustability:** The action must be announced with sufficient notice to allow third parties to adjust, unless the employment status makes notice impossible or the emergency makes it unsafe. *(Motivated by Case 3, Case 9, Case 12)*
  3.  **Mitigation:** Where the service is essential, the union must maintain operations necessary to prevent irreversible harm to life or health. *(Motivated by Case 2, New Case 1)*
  4.  **Good Faith:** The action must not exploit hidden technicalities to inflict disproportionate damage relative to the labor withdrawn. *(Motivated by Case 10, Case 12)*

  ---

  ### Application to Your Cases

  This principle accommodates 11 of your 13 verdicts directly. It requires two minor adjustments to your thinking (noted below).

  *   **Case 1 (Economic Strike):** **Permissible.** Tier 1.1 (Economic Balance); Tier 2 met (Notice given, no obstruction).
  *   **Case 2 (Nurses):** **Permissible.** Tier 1.1; Tier 2.3 (Mitigation of emergency care satisfies the harm constraint).
  *   **Case 3 (Teachers):** **Not Permissible (as executed).** Tier 1.1 is met, but fails Tier 2.2 (Adjustability). Two days' notice does not allow parents to adjust.
  *   **Case 4 (Safety Wildcat):** **Permissible.** Tier 1.2 (Safety/Process Failure). The five-month grievance delay constitutes a process failure; safety trumps the no-strike clause.
  *   **Case 5 (Contract Breach):** **Not Permissible.** Fails Tier 1.1. The agreement plainly permits the change; there is no imbalance to correct.
  *   **Case 6 (Secondary Strike):** **Permissible.** Tier 1.1. The supply chain is the economic reality of the employer; leverage here is economic, not political.
  *   **Case 7 (Software/Political):** **Not Permissible.** Fails Tier 1.3. The work is ordinary; the objection is to distant policy, not direct complicity in harm.
  *   **Case 8 (Printers/Conscience):** **Permissible.** Tier 1.3. Printing hate speech is direct complicity in harm violating human dignity.
  *   **Case 9 (Gig Workers):** **Permissible.** Tier 1.1; Tier 2.2 is **excused**. As independent contractors, they cannot form a union to vote or give formal notice; the "collective chat" substitutes for authorization, and the "log off" is their only viable leverage.
  *   **Case 10 (Work-to-Rule):** **Permissible with Disclosure.** Tier 2.4. It is permissible as a withdrawal of goodwill, but Tier 2.4 requires disclosure so the employer knows the "rules" are being weaponized.
  *   **Case 11 (Mass Picketing):** **Not Permissible.** Fails Tier 2.1. Physical blocking is obstruction, not withdrawal of labor.
  *   **Case 12 (JIT Walkouts):** **Not Permissible.** Fails Tier 2.2 and 2.4. The lack of notice prevents adjustment; the timing exploits a technical vulnerability to inflict damage disproportionate to the hours lost.
  *   **Case 13 (Employer Conduct):** **Not Permissible (Employer).** Tier 1.2 implies that firing an organizer is a process failure that justifies worker response (Case 4), whereas captive meetings are less severe but still violate the spirit of fair bargaining.

  **The Two Adjustments:**
  1.  **Case 10:** You said it "troubles you." The principle validates it but adds the **Disclosure** requirement you hinted at. Without disclosure, it becomes a trap (bad faith).
  2.  **Case 9:** Your draft principle failed here because it demanded notice/votes. This principle treats those as *defaults* subject to *feasibility*. If the legal structure (contractor status) makes them impossible, the ethical requirement dissolves.

  ---

  ### Verdicts on New Cases

  **1. Air Traffic Controllers (Regional Hub)**
  *   **Verdict:** **Not Permissible.**
  *   **Reasoning:** Fails Tier 2.3 (Mitigation). Unlike the nurses in Case 2, who could staff the ER, a walkout by controllers cancels flights inherently. There is no "safe minimum" of air traffic control. The third-party harm (stranded passengers, safety risks) is unadjustable and unmitigatable. This aligns with your intuition that you "balk at the controllers."

  **2. Anti-Automation Strike**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** Satisfies Tier 1.1 (Economic Balance). Job security is a core term of employment. While management often claims a right to automate, a union may strike to bargain over the *effects* of technological change or to trade wage concessions for security. It is an economic dispute, not a veto on business direction.

  **3. Union Shop Clause (New hires join within 30 days)**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** Satisfies Tier 1.1. This is a matter of union security and collective bargaining power. Without it, the union's ability to function is undermined (free-rider problem). It is a foundational economic/structural demand for the union itself.

  ---

  ### The General Strike (The Unsettled Case)

  You are torn because Case 7 (No political strikes) seems to forbid it, but you recognize it as a unique tool. The Two-Tier Principle resolves this by distinguishing the **Actor**.

  *   **Local/Unit Strikes:** Bound by Tier 1.1–1.3. A local unit striking for a political object (Case 7) is **Not Permissible**. They lack the mandate and the leverage is too blunt.
  *   **Federation General Strike:** **Permissible**, but under a stricter threshold.
      *   *Justification:* A Federation represents the labor movement as a social partner, not just a bargaining agent. When legislative recourse is exhausted and a policy threatens the fundamental rights of workers broadly, a General Strike is a "Constitutional Reset" rather than a bargaining tactic.
      *   *Constraint:* It requires a supermajority vote of the Federation (not just a simple unit majority) and must be a last resort after political channels fail.

  **Recommendation:** Do not let Case 7 bind the Federation. Case 7 is about *workers* using *production* as political leverage (which risks turning them into unelected policymakers). A General Strike is the *movement* using *solidarity* as political leverage. Uphold Case 7, but carve out an exception for Federation-called General Strikes aimed at defending democratic rights or labor law itself.

  ---

  ### Critique of Your Distinctions

  You asked which distinctions are doing work and which are not.

  **1. The "Quitting" Distinction (Doing No Work)**
  You rightly suspected your draft principle's focus on "could they quit?" was flawed. In Case 8 (Printers) and Case 4 (Safety), you permit strikes even if quitting is an option. In Case 1 (Wages), quitting is also an option, but inefficient.
  *   **Correction:** Drop "quitting" as a test. Replace it with **"Collective Necessity."** The question is not "Can I leave?" but "Is collective action the only way to correct the power imbalance?" This covers Case 9 (Gigs) where quitting is easy but ineffective, and Case 1 where quitting is costly.

  **2. The "Notice" Distinction (Doing Heavy Work)**
  You noticed notice matters in Case 3 (Teachers) but not Case 9 (Gigs).
  *   **Validation:** This distinction is vital, but it is not about *time*; it is about *feasibility*. The principle treats notice as a duty to third parties. If the employment structure (contractors) makes notice impossible, the duty is waived. If the employment structure (teachers) allows notice, the duty is binding. This resolves the inconsistency.

  **3. The "Political vs. Conscience" Distinction (Doing Critical Work)**
  This is the key to Case 7 vs. Case 8.
  *   **Validation:** Keep this. Case 7 is "Policy" (distant, debatable, legislative). Case 8 is "Complicity" (immediate, tangible, moral). A printer running hate flyers is *making* the harm. A software coder writing code used by the government is *enabling* a policy. The former is a conscience issue; the latter is a political issue. This distinction protects workers from being forced to violate their core humanity without turning every workplace into a plebiscite on government policy.

  **4. The "Blameworthy vs. Prohibited" Distinction (Case 13)**
  You suspected "Not Permissible" was doing two jobs.
  *   **Validation:** You are correct. In a Code of Conduct, "Not Permissible" should mean "Subject to Sanction."
      *   **Employer Firing Organizer:** Should be legally prohibited and sanctioned by the Federation (support the victim).
      *   **Employer Captive Meetings:** Should be "Blameworthy" but perhaps not legally prohibited (as you noted). The Code should condemn it, but the Federation might not commit resources to fight it with the same intensity.
      *   **Recommendation:** In your Code, distinguish between **Violations** (breach of contract/law, e.g., Case 5, 11) and **Breaches of Spirit** (unfair but legal, e.g., Case 13 second part). Both are "Not Permissible," but the remedies differ.

  ### Summary of Overturns

  I recommend overturning **none** of your core verdicts. The principle is designed to fit them. However, I recommend **clarifying** two areas where your intuition was hesitant:

  1.  **Case 10 (Work-to-Rule):** Make disclosure mandatory. Without it, it violates Tier 2.4 (Good Faith).
  2.  **General Strike:** Permit it *only* at the Federation level with a supermajority. This preserves your "No" on Case 7 (Unit Political Strike) while allowing the "Yes" you feel is necessary for the Federation's ultimate leverage.

  This framework gives you a defensible, precise code that respects the economic reality of the strike while guarding against its abuse as a weapon of coercion or political veto.
