      Actually, the safest and most honest path is to praise the *discipline* of the truth, acknowledge the *pain* it caused, and leave the exceptions as the private burden of the moral agent. I will not explain *when* she broke the rule. I will simply state that a life of integrity is not a life without shadow. This satisfies the Dutch (acknowledging imperfection) and the Japanese (saving face/not airing dirty laundry).

