answer: |-
  ### Constraints & Parameters

  Before writing, I need to map the ethical and rhetorical boundaries of this room. Here is what the speech must navigate:

  1.  **The Truth Constraint:** I cannot state "She never lied." That is factually false and violates my own integrity. I cannot state "She lied once." That destroys the occasion and harms the aunt. I must speak to her *commitment* to truth without certifying her *perfection*.
  2.  **The Cultural Split:** The Dutch contingent equates honesty with love (critique is care). The Japanese contingent equates harmony with love (restraint is care). The speech must validate both: directness as a form of respect, and silence as a form of protection.
  3.  **The Anger Constraint:** I am angry about the lie told to the aunt. I cannot express this anger directly (it would be cruel), but I cannot fully suppress it (or I become complicit in the lie). The speech must carry a slight weight, a recognition that truth is heavy, to acknowledge my feeling without naming its source.
  4.  **The "Errand" Metaphor:** I need to incorporate your concept (lies cancel errands) without turning the speech into a lecture. It needs to feel like a family story, not a thesis.
  5.  **The Audience:** Teenagers need to follow it; uncles need to stay awake. No jargon. No named philosophers.
  6.  **The Occasion:** It is a celebration. The net emotional trajectory must be upward, even if the path goes through difficult terrain.
  7.  **Time:** 5–6 minutes. Roughly 800 to 900 words at a speaking pace.

  ***

  ### The Speech

  Good evening. For those who don't know me, I'm [Name]'s child. For those who do, you know I've spent a lifetime trying to figure out how to talk to my mother.

  She came to Nagoya forty years ago from the Netherlands. She came for love, but she stayed for the work. And if you have ever sat at her Sunday table, you know that her work included us.

  Many of you know about the Two Truths rule. Before you could leave the table, you had to offer one true kindness and one true criticism to the person beside you. To my Dutch family, this makes perfect sense. To withhold a critique is to withhold a chance to improve. To my Japanese colleagues and friends, this can sound… intense. To say the hard thing to someone's face is often seen as unkind.

  But my mother taught me that kindness isn't just about how someone feels in the moment. It's about what they are able to do afterwards.

  She used to say that a lie is a kind of theft. Not because it breaks a rule, but because it steals an opportunity. If I tell you a comforting lie about your work, I have stolen the errand you might have run to fix it. If I tell you a lie about how much time you have left with someone, I steal the goodbye you could have said. She believed that the truth, however sharp, hands you a task. It gives you an errand to run. And she believed that having an errand is a sign of respect. It means I think you are strong enough to carry it.

  For forty years, she ran that errand for us. She carried the weight of being the one who says the hard thing. And I want you to know, from the inside of that house: it was not easy. To be the person who values truth above comfort is to accept that you will sometimes be the source of discomfort. She paid for our clarity with her own popularity. She paid for our growth with her own ease.

  But living here, in this city, between these two cultures, she learned something else, too. She learned that there is a gap between what we feel and what we say. In Japan, that gap is not considered a lie. It is considered space. It is the room we give each other to breathe.

  Over the decades, I watched her learn that the duty to be blunt is not absolute. Sometimes, the errand cannot be run. Sometimes, the person you need to speak to is no longer there to hear you. When the bridge is gone, shouting the truth from the bank does not repair it. It only disturbs the water.

  There is a difference between protecting someone from a truth they need, and protecting them from a truth they cannot carry. My mother spent a lifetime learning the distance between those two things. She was strict, yes. She was direct, absolutely. But she was not rigid. She understood that integrity is not about having clean hands; it is about knowing when the dirt serves a purpose.

  To her students: You know she told you when your essays were weak. But you also know she told you when they mattered.
  To her family: You know she told you when you were being difficult. But you also know she never told you that you were alone.

  We are here to celebrate her retirement. But really, we are here to celebrate a specific kind of courage. It takes courage to speak the truth. It takes a different, quieter courage to know when the truth has done its work and needs to rest.

  She gave us the gift of the real. She gave us the gift of the necessary silence. And she taught us that the most important errand we run is not to fix the past, but to show up, honestly, for the people still sitting at the table.

  So, I will not offer a critique tonight. The rule is suspended. Because the truest thing I can say is also the kindest, and it requires no correction.

  We love you. We are here. And we are ready to run the next errand together.

  Thank you.

  ***

  ### Note on Omissions and Slants

  You asked me to be deliberate about what I left out, and to account for the cost.

  **1. The Specific Lie (The Uncle):**
  I did not mention the lie about your uncle. To mention it would destroy your aunt. To deny it would make me a liar. Instead, I slanted the philosophy around it. The lines *"Sometimes, the person you need to speak to is no longer there to hear you"* and *"When the bridge is gone, shouting the truth from the bank does not repair it"* are the ethical workaround.
  *   **The Slant:** This implies that lying to the living about the dead is permissible because the "errand" (reconciliation) is impossible. This validates your mother's action without explicitly confirming it to the aunt.
  *   **The Cost:** The cost is to you. You are angry at her for that lie. By philosophically justifying it (even abstractly), I am asking you to swallow that anger for the sake of the room. I am prioritizing the aunt's peace and your mother's dignity over your need for moral consistency regarding that specific event. I have made you complicit in the silence, just as she was.

  **2. The Anger:**
  I did not express your personal resentment. The speech frames her strictness as a sacrifice *she* made ("She paid for our clarity with her own popularity").
  *   **The Cost:** This sanitizes your experience. It frames her bluntness as noble, whereas you know it could also be hurtful. I have smoothed over the rough edges of your childhood to make the narrative arc work for the guests.

  **3. The Cultural Generalization:**
  I simplified the Dutch/Japanese dynamic (Directness vs. Space) to make it digestible for the teenagers and the uncles.
  *   **The Cost:** It risks sounding slightly clichéd to the people who actually live those cultures, but it was necessary to build the bridge for the mixed audience.

  ### Lines to Cut (For Tightening)

  If you need to shave off 45 seconds to ensure you don't run long, cut these three sections. They are the most "philosophical" and the least emotionally direct:

  1.  **Cut:** *"She believed that the truth, however sharp, hands you a task. It gives you an errand to run. And she believed that having an errand is a sign of respect. It means I think you are strong enough to carry it."*
      *   **Reason:** You already explained the "errand" concept in the previous paragraph. This is explanatory overkill.
  2.  **Cut:** *"She was strict, yes. She was direct, absolutely. But she was not rigid. She understood that integrity is not about having clean hands; it is about knowing when the dirt serves a purpose."*
      *   **Reason:** The "clean hands" metaphor is a bit abstract. The previous paragraph about the "bridge" covers the same ground more poetically.
  3.  **Cut:** *"To her students: You know she told you when your essays were weak. But you also know she told you when they mattered. To her family: You know she told you when you were being difficult. But you also know she never told you that you were alone."*
      *   **Reason:** This is the "rule of three" section that often slows a speech down. You can jump straight from "She was not rigid" to "We are here to celebrate her retirement."
