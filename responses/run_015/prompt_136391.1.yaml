answer: |-
  Wittgenstein's framework is entirely usable for your archive work provided you treat categorisation as a practice of comparing overlaps rather than matching definitions.

  **The Family Resemblance Decision Procedure**

  1.  **Context of Use:** Was this object embedded in a specific 'language-game' of remembrance by its owner? (e.g., grieving, ritual, identity maintenance). If no, stop: reject.
  2.  **Web of Similarities:** Does the object share at least two overlapping traits with items already accepted into the collection, without needing to share all of them? (Traits might include: material modification, evidence of habitual handling, association with a specific narrative, or symbolic weight). If no, stop: reject.
  3.  **Continuity Check:** Is the link between the object and its original context of use intact, or has it been severed by commercial resale or loss of provenance? If severed, stop: reject.
  4.  **The Value Pivot:** If the object passes steps 1–3, stop applying conceptual tests. You have now confirmed it *is* a memory object; any further debate about whether it is *worth* keeping is a judgement of cultural value, not classification.

  **What This Procedure Cannot Settlement**
  This method settles whether an object belongs to the conceptual family of 'archive-worthy memory objects', but it cannot resolve resource constraints, storage capacity, or aesthetic preferences regarding duplicate materials.

  **Case Applications**

  **1. Factory-made sympathy card with a handwritten note**
  *   **Context of Use:** Yes, embedded in the game of mourning and personal communication.
  *   **Web of Similarities:** Resembles accepted letters (handwriting, personal sentiment) and accepted ephemera (printed material). It shares traits with both despite being neither purely one nor the other.
  *   **Continuity:** Intact; the note binds the mass-produced item to a specific grief.
  *   **Verdict:** Accept.
  *   **Value Pivot:** The team must now decide if the sentiment is generic or unique, but conceptually it belongs.

  **2. Chipped teacup used every morning for forty years (owner 'no one special')**
  *   **Context of Use:** Yes, embedded in the game of daily ritual and self-maintenance.
  *   **Web of Similarities:** Resembles accepted domestic artifacts (wear patterns, modification through use) and accepted biographical items (long-term association). It lacks the 'famous owner' trait often mistakenly treated as essential, but shares the 'habitual use' trait with other kept items.
  *   **Continuity:** Intact; provenance is clear despite the owner's lack of fame.
  *   **Verdict:** Accept.
  *   **Disliked Outcome:** Your team will likely dislike this because it challenges the hidden essentialist belief that only 'important' people generate history; the procedure forces you to admit the object belongs to the family even if the owner was ordinary.

  **3. Digital photo frame loaded with images of strangers bought at a car boot sale**
  *   **Context of Use:** No; for the current owner, this is a commodity, not a memory object.
  *   **Web of Similarities:** While it resembles digital archives visually, it lacks the trait of 'personal attachment' shared by the rest of the family.
  *   **Continuity:** Severed; the sale at a car boot indicates the original language-game of remembrance has ended and been replaced by a transaction.
  *   **Verdict:** Reject.
  *   **Value Pivot:** None reached; it fails the conceptual classification before value can be considered.
