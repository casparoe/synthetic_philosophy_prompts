  hey — I need a two-page proposal for a small one-term fellowship, four months, basically one course release so call it maybe 250 hours of real work, on the no-free-lunch theorems and Hume's problem of induction. I'll drop in the citations myself, so please don't spend words on who said what or on a literature review — I want the argument, not the map.

  My half-formed idea, please sharpen it or kill it. The standard reply to "NFL shows induction can't be justified" is that the averaging runs over a uniform distribution on all possible objective functions, nobody thinks our world was drawn from that, so NFL is a fact about a measure nobody should care about. But that reply looks to me like it just reasserts the inductive assumption in fancier form: why expect the world to be one of the structured, compressible ones? So my two-part question: (1) is there a reading of the NFL results on which they genuinely bear on Hume's problem, and (2) if the only way to answer NFL is to help yourself to a bias, does the same averaging argument run one level up, over the space of *methods for choosing a bias*? I've been calling that "second-order NFL" in my notes and I can't tell whether the regress bottoms out somewhere interesting or just collapses.

  I also think the literature keeps sliding between three things without saying so, and part of the project should be to pin this down: NFL as a claim about a uniform average, NFL as a claim that for any prior you pick there's a world where you lose, and NFL as a worst-case or adversary claim. My hunch is that the second-order move only has teeth on the second of those, but I'm not shure.

  What I want from the proposal: one question stated so it has a determinate answer; why both the "NFL is irrelevant to Hume" camp and the "NFL vindicates Hume" camp leave it open; a month-by-month method that isn't just reading more papers, plus a sentence on why the obvious alternatives — a survey, or trying to prove some new theorem — are worse for a four-month bucket. And commit: take a stand on which reading is the right one, on whether the regress holds and where it stops (my own guess is it stops at resource bounds, since the meta-level choice is made under the same computational limits as the object-level one, but argue me out of it if that's wrong), and tell me which of the three ideas above you think is the weakest. Also give me what a real deliverable looks like if the result is negative, what would count as the project failing rather than just turning out differently, and the single thing most likely to make it too big for one term — including what I'd say to a reviewer who says this is just Hume with formulas.
