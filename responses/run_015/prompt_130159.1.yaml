answer: |-
  ### 1. Ontology of Social Groups: Institutional Kinds and Diachronic Identity

  To reconstruct the ontology presupposed by this practice, we must first distinguish between what the rhetoric suggests and what the operational logic requires.

  **Natural Kinds vs. Institutional Kinds**
  The practice *cannot* strictly presuppose that generations are **natural kinds**. Natural kinds (like biological species or chemical elements) possess mind-independent essences and causal powers that support inductive inference regardless of human classification. The internal methodological critiques explicitly deny this: they establish that birth-year boundaries are arbitrary and that within-group variance exceeds between-group variance. If generations were natural kinds, these statistical facts would invalidate the categories. Since the categories persist *despite* these facts, the practice does not rely on natural kind realism.

  However, the practice also treats them as more than **pure statistical artifacts** (like income quintiles or geographic zones). Pure artifacts are disposable; if a quintile ceases to predict behavior, it is redefined or discarded. Generational labels are not discarded when they fail to predict; they are retained. This suggests the practice presupposes that generations are **institutional kinds**. Like "money" or "citizenship," they exist only because of collective intentionality—a shared agreement to assign a status function to a set of individuals. The ontology required is one where the *classification itself* constitutes the group. The state and market do not discover "Millennials"; they enact them through budget lines and survey instruments.

  **Diachronic Identity**
  The prompt asks whether the practice requires a diachronic identity condition allowing the cohort to persist as individuals age and are replaced. Here, a crucial distinction must be made. Unlike functional groups (e.g., "current college students"), which maintain identity through role turnover, generational cohorts (e.g., "Boomers") are defined by a fixed birth range. There is no membership turnover; there is only attrition through death.

  Nevertheless, the practice treats the cohort as a **diachronically stable agent**. A policy written for "Boomers" in 1990 is understood to apply to the *same entity* in 2020, even though the psychological and economic profile of that group has radically shifted due to aging. For this to make sense, the practice presupposes a **narrative identity condition** rather than a biological or functional one. The "Boomer" unit persists not because its members share stable traits, but because they share a fixed location in historical time. The ontology commits to the idea that *historical provenance* is a sufficient condition for group identity over time, overriding changes in individual attributes. The group is treated as a rigid designator for a specific historical slice of humanity, granting it a continuity that allows for long-term liability and entitlement (e.g., pension obligations) that would not attach to a transient statistical cluster.

  ### 2. Collective Agency and Downward Causation

  **Aggregation vs. Collective Agency**
  The practice utilizes a dualistic approach to agency. Statistically, it treats the cohort as an **aggregation** of individuals (mean income, voting percentage). However, in policy and legislative debate, it treats the cohort as a **collective agent**. We hear phrases like "Gen Z demands climate action" or "Boomers blocked housing reform."

  Strictly speaking, this does not require a commitment to strong collective moral agency (the idea that the group can bear guilt or praise distinct from its members). Instead, it presupposes a **proxy agency**. The cohort is treated as a stakeholder with unified interests, allowing institutions to negotiate with a single "representative" entity rather than millions of individuals. This is a functional necessity for governance. However, by allocating resources specifically to "Gen Z mental health," the institution implicitly recognizes the group as a moral patient with distinct needs, bordering on a recognition of collective subjecthood.

  **Downward Causation**
  Does the practice require downward causation (group properties causing individual behavior)?
  *   **Descriptive Use:** If the categories were purely descriptive, downward causation would not be required. The correlation would suffice.
  *   **Prescriptive Use:** Because the categories persist despite weak predictive power, the practice implicitly relies on a **performative form of downward causation**.

  The logic is as follows: If the state treats "Gen Z" as a distinct category with specific needs, it creates institutions (support groups, marketing channels, political platforms) that cater to that identity. Individuals, observing these institutional structures, begin to self-identify with the label and align their behaviors to match the expected profile. Thus, the group-level property (the institutional recognition of "Gen Z") causally shapes individual behavior. The practice presupposes that **classification is intervention**. Without this commitment to downward causation (or reflexivity), the persistence of the categories in the face of negative statistical evidence would be irrational. The categories survive because they *make themselves true* through policy enactment.

  ### 3. Epistemic Tension: Pragmatic Constructivism

  There is an apparent contradiction between the methodological division (which says "these categories are statistically weak") and the policy division (which says "these categories are real"). This is not necessarily an inconsistent pairing of instrumentalism and essentialism; rather, it reveals a coherent position of **Pragmatic Constructivism**.

  **The Coherent Position**
  The institution operates under the commitment that social reality is malleable. The methodologists are correct *empirically* (the categories do not describe pre-existing natural clusters), but the policymakers are correct *ontologically* (the categories constitute social reality).
  *   **Epistemic Instrumentalism:** Regarding the *past*, the categories are admitted to be imperfect tools for description. The internal critiques acknowledge this.
  *   **Ontological Realism:** Regarding the *future*, the categories are treated as real because they will generate real effects.

  This resolves the tension. The practice does not claim to *discover* the causal structure of society; it claims to *impose* a legible structure upon it. The philosophical commitment is that **legibility trumps accuracy**. For a bureaucracy to function, it requires stable units of analysis. "Life-stage" is fluid and hard to track; "Cohort" is fixed and easy to track. The practice presupposes that the administrative utility of a stable label outweighs its statistical imprecision. This is not a failure of reasoning but a specific philosophical stance: social kinds are valid insofar as they sustain institutional action, not insofar as they mirror independent variance.

  **Points of Underdetermination**
  The practice is philosophically underdetermined in one key area: **The Source of Normativity.**
  *   *Theory A (Cynical Realism):* The categories are maintained solely to simplify budget allocation and shift responsibility (e.g., blaming "Boomers" for housing shortages). The ontology is irrelevant; only the utility matters.
  *   *Theory B (Constitutive Realism):* The categories are maintained because the institution believes it has a duty to recognize historical generations as distinct moral communities.
  The observable practice fits both. We cannot determine from the data alone whether the persistence of the labels is due to bureaucratic inertia (Theory A) or a genuine belief in intergenerational justice (Theory B).

  ### 4. Counterfactual Ontology: Treating Generations as Artifacts

  If the underlying ontology were shifted explicitly to treat generations as **arbitrary statistical artifacts** with no causal or predictive standing, the practice would undergo significant structural changes, though it might not collapse entirely.

  **Required Changes**
  1.  **Shift from Cohort to State-Variables:** Policy would need to move from "Targeting Millennials" to "Targeting individuals aged 28–43 with income < X." This shifts the ontology from a *historical identity* to a *current state*.
  2.  **Loss of Diachronic Tracking:** You cannot track a "state" over 40 years easily, as individuals move in and out of it. Long-term longitudinal studies (e.g., "How did the 1980s recession affect this group over a lifetime?") would become philosophically incoherent. You would have to study "people aged 20 in 1980" vs "people aged 20 in 1990," losing the narrative thread of the *cohort*.
  3.  **Dissolution of Collective Stakeholding:** Political negotiation would fragment. Instead of negotiating with "The Youth Vote," parties would have to negotiate with shifting coalitions of age and class. The rhetorical power of "intergenerational equity" would vanish, as there is no "generation" to be equitable toward, only individuals at different life stages.

  **Philosophical Loss**
  The policy apparatus could be rebuilt around life-stage and socioeconomic variables without *statistical* loss; indeed, predictive accuracy might improve. However, there would be a profound **narrative and moral loss**.
  *   **Historical Responsibility:** We hold "Boomers" responsible for climate change not because every Boomer emitted carbon, but because the *cohort* holds political power during a specific historical window. If we dissolve the cohort into age-grades, we lose the ability to assign historical responsibility to a collective subject.
  *   **Solidarity:** Generational labels foster a sense of shared fate. Treating them as arbitrary artifacts dissolves this solidarity.

  **Conclusion on Resilience**
  The apparatus would not collapse, but it would lose its **normative grip**. The current practice survives not because it is statistically optimal, but because it provides a **mythological structure** for distributing resources and assigning blame. Replacing the ontology with strict statistical artifactuality would render the system more accurate but less politically actionable. This confirms that the primary function of the generational ontology is not prediction, but **social coordination**. The practice presupposes that a "useful fiction" which organizes collective intentionality is ontologically superior to an "accurate description" which fails to mobilize action.
