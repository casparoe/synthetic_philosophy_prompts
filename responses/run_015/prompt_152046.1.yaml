answer: |-
  # PROTOCOL 25-S: POLITICAL ENTITY SURVIVAL FORECASTING

  **Purpose:** To standardize the production of 25-year survival probabilities for political entities using an outside-view reference class method, resolving disputes over class definition and survivorship bias through procedural constraints.
  **Constraints:** One analyst-day per item. One-page written rationale. Unclassified sources only.
  **Audit:** Director review time limited to 30 minutes per item.

  ---

  ## PART I: THE PROCEDURE

  ### Step 1: Define the Persistence Criterion
  **Action:** Specify the exact physical or legal condition that constitutes "death" for this entity. Options include: loss of monopoly on violence, abrogation of founding charter, loss of >20% core territory, or replacement of the ruling coalition.
  **[VALUE JUDGMENT — DIRECTOR SIGN-OFF REQUIRED]**
  *   **Sufficient Answer:** A binary test observable by a third party (e.g., "Treaty X is formally dissolved by signatories").
  *   **Failure to Answer:** Vague terms like "collapse," "failure," or "loss of relevance."
  *   **Rationale Entry:** One sentence defining the terminal event.

  ### Step 2: Construct the Reference Class (Membership Rule)
  **Action:** Identify a set of historical entities to serve as the comparison group. Membership is determined *only* by properties knowable at the entity's founding (or current date for existing entities treated as new).
  *   **Rule:** You must generate two classes:
      1.  **Nominal Class:** Based on self-identification or broad type (e.g., "Federation").
      2.  **Mechanism Class:** Based on observable structural constraints (e.g., "Unanimity voting," "Unilateral exit clause").
  *   **Lookahead Prohibition:** Do not exclude historical cases based on how they ended. Do not include properties that emerged after the entity's first five years.
  *   **Sufficient Answer:** A list of inclusion criteria for both classes that relies solely on initial conditions.
  *   **Failure to Answer:** Criteria that reference the entity's longevity, success, or later adaptations.
  *   **Rationale Entry:** The two class definitions and the count (N) of historical matches for each.

  ### Step 3: Denominator Correction (Failed Attempts)
  **Action:** Decide whether "stillbirths" (entities proclaimed but never consolidated) count as failures in the reference class.
  *   **Rule:** If the entity being forecast has successfully consolidated power/administration, the reference class must include historical analogues that failed to consolidate. If the entity is a "stillbirth," the class must include consolidated entities that later failed.
  *   **Reasoning Requirement:** You must state whether excluding stillbirths inflates the survival rate.
  *   **Sufficient Answer:** "Included" or "Excluded" with a one-sentence justification based on comparability of the starting line.
  *   **Failure to Answer:** Ignoring the issue or assuming consolidation is guaranteed.
  *   **Rationale Entry:** The decision and the adjusted N count.

  ### Step 4: Survivorship Bias Correction
  **Action:** Assess whether the reference class is contaminated by "survivor bias" (i.e., drawn mostly from entities currently alive).
  *   **Rule:** If >50% of the Reference Class members are still extant today, you cannot use a simple survival rate. You must either:
      1.  Switch to a "Closed Cohort" (entities founded in a specific past window, all followed to completion or 25 years).
      2.  Apply a "Vintage Penalty": Reduce the calculated survival probability by 20% to account for unobserved future failures in the living population.
  *   **Sufficient Answer:** Identification of the bias source and application of one of the two remedies.
  *   **Failure to Answer:** Using a base rate derived from a list of currently existing organizations without adjustment.
  *   **Rationale Entry:** The raw base rate, the correction method applied, and the adjusted base rate.

  ### Step 5: Declare Hazard Shape
  **Action:** State the assumed trajectory of risk over the 25-year horizon.
  *   **Options:** *Flat* (risk is constant), *Increasing* (entity ages/fragilizes), *Decreasing* (entity stabilizes over time).
  *   **Default:** *Flat.*
  *   **[VALUE JUDGMENT — DIRECTOR SIGN-OFF REQUIRED FOR OVERRIDE]:** You may only override the default if there is empirical evidence of a specific aging or stabilizing mechanism in the Mechanism Class.
  *   **Sufficient Answer:** Selection of one shape with a citation of the mechanism (e.g., "Increasing due to succession uncertainty").
  *   **Failure to Answer:** Assuming stability without evidence or selecting a shape based on narrative preference.
  *   **Rationale Entry:** The selected hazard shape and the justification.

  ### Step 6: Resolve Class Conflict
  **Action:** Compare the survival rates of the Nominal Class and the Mechanism Class.
  *   **Rule:** If the rates differ by more than 15 percentage points, you must issue a **Range Forecast** (Low–High) rather than a point estimate. You may not average them unless the Mechanism Class has N < 5.
  *   **Sufficient Answer:** A single percentage or a defined range.
  *   **Failure to Answer:** Cherry-picking the class that supports a preferred narrative.
  *   **Rationale Entry:** The two base rates and the final forecast figure or range.

  ### Step 7: Revision Rule (The "No-News" Update)
  **Action:** Define how the forecast changes if the entity survives one year without significant event.
  *   **Rule:** Survival alone does not increase probability. The forecast is only revised if the *Reference Class data* changes or the *Persistence Criterion* is threatened.
  *   **Sufficient Answer:** A statement that the probability holds constant absent new structural data.
  *   **Failure to Answer:** Automatically increasing survival probability year-over-year.
  *   **Rationale Entry:** "Forecast static pending structural change."

  ### Step 8: The Register of Falsifiers
  **Action:** List the two or three specific empirical findings that would most drastically lower the survival probability.
  *   **Sufficient Answer:** Concrete events (e.g., "Member State X invokes exit clause," "Central bank loses independence").
  *   **Failure to Answer:** Vague risks (e.g., "Economic downturn," "Political instability").
  *   **Rationale Entry:** A bulleted list of 2-3 specific triggers.

  ### Step 9: Director Sign-Off
  **Action:** Submit the one-page rationale.
  *   **[DIRECTOR SIGN-OFF REQUIRED]:** Verify Step 1 (Persistence) and Step 5 (Hazard Shape). All other steps are analyst-discretionary provided the audit trail is complete.

  ---

  ## PART II: APPLICATION TO CURRENT LIST

  ### Item 1: The Continental Union
  **Description:** 30-year-old, 27 members, treaty-based, unilateral exit clause, unanimity for constitutional change.

  *   **Step 1 (Persistence):** Abrogation of the founding treaty by >50% of members OR inability to pass a budget for 24 consecutive months. **[DIRECTOR SIGN-OFF]**
  *   **Step 2 (Class):**
      *   *Nominal:* "Supranational Unions" (N=12 historically).
      *   *Mechanism:* "Voluntary Associations with Unanimity Rules and Exit Clauses" (N=4 historically).
  *   **Step 3 (Denominator):** Include two historical unions that were proclaimed but never ratified. Adjusted N=6 for Mechanism Class.
  *   **Step 4 (Bias):** 3 of the 6 Mechanism Class members are still extant (50%). Apply **Vintage Penalty**.
      *   Raw Survival (25yr): 50%.
      *   Adjusted Survival: 40%.
  *   **Step 5 (Hazard):** *Increasing.* Mechanism creates paralysis during crises; risk compounds with membership size. **[DIRECTOR SIGN-OFF]**
  *   **Step 6 (Conflict):** Nominal Class suggests 70% survival. Mechanism Class suggests 40%. Divergence >15%.
      *   **Forecast:** **40% – 70% Range.**
  *   **Step 8 (Falsifiers):** 1. Any member invokes exit clause. 2. Budget veto lasts >6 months.
  *   **Result:** The procedure forces a wide band (30 percentage points). The Mechanism Class N is too small for precision, and the exit clause introduces high variance.
  *   **Publication Advice:** Publish the range. Do not collapse to a mean. The width *is* the finding: the structural design makes the outcome highly sensitive to single-member shocks. The "useless" band accurately reflects the fragility of the unanimity/exit mechanism.

  ### Item 2: The Federal Republic
  **Description:** 240 years old, no secession procedure, internal war 160 years ago, economic divergence among units.

  *   **Step 1 (Persistence):** Replacement of the Constitution OR loss of federal authority over >30% of territory. **[DIRECTOR SIGN-OFF]**
  *   **Step 2 (Class):**
      *   *Nominal:* "Federal Republics" (N=35 historically).
      *   *Mechanism:* "Constitutional Orders >100 Years Old with No Secession Clause" (N=8 historically).
  *   **Step 3 (Denominator):** Exclude stillbirths (entity is consolidated).
  *   **Step 4 (Bias):** All 8 Mechanism Class members are currently extant (100% Living). **Mandatory Closed Cohort Switch.**
      *   *Problem:* No closed cohort exists for entities >100 years old; none have finished the 25-year horizon yet.
      *   *Correction:* Cannot compute a valid base rate.
  *   **Step 5 (Hazard):** *Flat* (Default). No evidence that age increases fragility in this specific mechanism class.
  *   **Step 6 (Conflict):** Nominal Class 25-year survival is 60%. Mechanism Class is incalculable due to survivorship.
      *   **Forecast:** **Indeterminate (Wide Band 20% – 80%).**
  *   **Step 8 (Falsifiers):** 1. Component unit declares unilateral independence. 2. Federal military refuses civilian order.
  *   **Result:** The procedure identifies that "240-year survival" is a survivorship trap. There is no valid reference class for "entities that have already survived 240 years." The forecast must be a wide band.
  *   **Publication Advice:** Publish as "Insufficient Data for Point Estimate." Explain that the entity is a statistical outlier. The width acknowledges that while it is robust, the lack of comparable failures makes any specific probability a guess. This satisfies the requirement to show the band honestly.

  ### Item 3: The Regional Security Order (Donor Request)
  **Description:** A pattern of alignment. No charter, no membership, no treasury.

  *   **Step 1 (Persistence):** **FAILURE.**
      *   *Analysis:* There is no legal or physical object to observe for "death." A "pattern of alignment" cannot be binary-coded as alive/dead without arbitrary thresholds.
      *   *Procedure Halt:* Cannot proceed to Step 2.
  *   **Action:** Issue **Refusal to Forecast.**
  *   **Rationale Entry:** "Object lacks defined persistence criterion. Cannot distinguish between 'adaptation' and 'death'."
  *   **Minimal Redefinition:** To make this forecastable, the object must be redefined as: "The survival of the *primary defense treaty* underpinning the order" OR "The continued basing rights of the dominant power in the region."
  *   **Advice to Director:** Return to donor. State that we can forecast the *Treaty* or the *Bases*, but not the *Order*. If they accept the Treaty as the proxy, restart at Step 1.

  ---

  ## PART III: LIMITATIONS AND FAILURE MODES

  **1. What This Procedure Cannot Prevent**
  *   **Black Swan Events:** The outside view relies on historical frequency. It cannot predict unprecedented shocks (e.g., a novel technology that renders borders obsolete) that have no reference class.
  *   **Data Quality:** If the historical record of the Reference Class is biased (e.g., failed states leave fewer records), the base rate is corrupted. This procedure audits the *method*, not the *archive*.
  *   **The "One-Page" Constraint:** Compressing complex geopolitical dynamics into a single page forces analysts to omit nuance. This is a feature for comparability but a bug for depth.

  **2. Judgment Dressed as Method**
  *   **Persistence Criterion (Step 1):** Defining "death" is inherently political. Deciding that "loss of territory" counts as death but "loss of democracy" does not is a value choice. The Director's sign-off acknowledges this responsibility, but the choice remains subjective.
  *   **Hazard Shape (Step 5):** While the default is Flat, the override allows analysts to argue for "Increasing" risk based on theory. This reintroduces the "inside view" through the back door. The audit must ensure the mechanism cited is structural, not narrative.

  **3. Where Exact Compliance Still Yields Error**
  *   **Small N Problems:** As seen in Item 1 and 2, valid mechanism classes often have very few members (N < 10). The procedure forces a wide band in these cases, but a user may still treat the midpoint as a truth.
  *   **Equivalence Assumption:** The method assumes a 19th-century federation is comparable to a 21st-century one. If the underlying environment (global war, nuclear deterrence) has changed fundamentally, the base rate is irrelevant. The procedure assumes continuity of the global system, which is not guaranteed.
  *   **The "Living" Trap:** Even with the Vintage Penalty, using currently surviving entities to forecast the future assumes the future resembles the past. If the era of state-building is over, historical failure rates may overstate current risk. If the era of fragmentation is beginning, they may understate it. The procedure corrects for *selection* bias, not *era* bias.

  **4. Final Directive**
  This protocol is a check against overconfidence, not a generator of truth. When the procedure yields a wide band or a refusal (as in Items 1, 2, and 3), that is a successful output. Do not narrow the band to satisfy consumers. The value of the unit is in defining the limits of knowledge, not in pretending they do not exist.
