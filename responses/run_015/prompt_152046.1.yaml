  7.  **Refining the Procedure Logic (Self-Correction during drafting):**

      *   *Survivorship Bias:* How to correct without complex stats? Simple rule: If the reference class consists >50% of entities still alive today, apply a "Vintage Penalty" (reduce survival prob by X%) OR mandate the use of historical cohorts (entities born in year T, followed for 25 years) rather than cross-sectional survivors. The latter is methodologically cleaner for a forecasting unit. Let's mandate *Cohort Matching*. If you can't find a historical cohort, you must widen the uncertainty band.
      *   *Failed Attempts:* Must include "Stillbirths." If forecasting a "Revolutionary Government," count the ones that lasted <1 year.
