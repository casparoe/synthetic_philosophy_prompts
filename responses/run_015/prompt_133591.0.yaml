answer: |-
  1. The classical frame problem forces an automated reasoner to explicitly codify every unchanged property after an action, lest the system assume logical flux where there is stability. This creates a combinatorial explosion where listing non-changes becomes computationally prohibitive compared to listing only effects.
  2. Similarly, an author practicing inertial world-keeping must ensure background facts remain consistent across scenes without boring the reader with exhaustive descriptions of static elements. Failure to manage this burden risks narrative incoherence, yet success relies on omitting the vast majority of unchanged reality.
  3. While both problems share an identical structural root in the combinatorial representation of state transitions, the mechanisms for resolving them differ fundamentally between logic and literature. The AI requires explicit formalization, whereas the novelist relies on implicit understanding.
  4. They diverge significantly because human readers supply missing continuity via pragmatic inference, filling gaps with assumed stability rather than demanding proof of stasis. An automated agent lacks this cognitive generosity and must therefore compute what a reader intuitively presumes.
  5. Ultimately, interpretive charity does the decisive separating work, allowing fiction to bypass the computational tractability constraints that bind artificial cognition. The reader's willingness to infer stability frees the author from the exhaustive axiomatic burdens that cripple the reasoner.
