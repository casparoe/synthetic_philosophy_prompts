  As a novelist drafting a philosophical scene about artificial cognition, I need your help. You are an expert philosopher of AI and narrative theory; think carefully, and begin by briefly outlining the representational burden that both automated reasoners and fiction writers face when actions occur in stable environments. Compare the classical frame problem in artificial intelligence—where an agent must choose between listing every unchanged property through successor-state axioms and listing only changes through frame axioms—with what I call inertial world-keeping, the authorial challenge of preserving background consistency across scenes without enumerating every static fact. Present your response as a numbered list of exactly five items, each one or two sentences long, with no introduction and no conclusion. Specifically, address whether these two problems share an identical structural root in combinatorial representation, or whether they diverge because readers supply missing continuity via pragmatic inference; then identify which feature—computational tractability versus interpretive charity—does the decisive separating work.
