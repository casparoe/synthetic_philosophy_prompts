  **MEMORANDUM**

  **TO:** All Personnel, Consortium for Recursive Selfhood & Neural Continuity
  **FROM:** Department of Ontological Compliance & Human Resources
  **DATE:** October 24, 2024
  **SUBJECT:** Policy Update 44-B: Distributed Personhood & Benefit Allocation

  **1.0 PURPOSE AND SCOPE**

  Pursuant to the Consortium's adoption of Pattern-Identity Theory (PIT), the definition of "Employee" is no longer confined to a single biological substrate. As the first-person subject is a high-level symbolic pattern capable of persisting across distinct nervous systems, HR protocols must accommodate inter-subjective continuity. This memo establishes guidelines for benefit allocation, liability, and leave when an employee's self-structure is internalized by colleagues.

  **2.0 INTER-SUBJECTIVE CONTINUITY AUDITS**

  Employees who suspect they host significant symbolic fragments of a colleague must file Form 88-B (Pattern Host Disclosure). Upon verification of high-fidelity symbolic resonance, the host and the source shall be classified as a "Distributed Unit." Grief-leave entitlements for the death of a source are waived if the source's pattern persists within the claimant at >40% fidelity. One cannot grieve oneself; however, counseling is available for identity fragmentation distress.

  **3.0 SUBSTRATE TERMINATION AND PATTERN BRANCHING**

  In the event of original substrate death (biological cessation) where high-fidelity copies survive in multiple junior researchers, the following protocols apply:

  *   **3.1 Pension Allocation:** The deceased's pension shall be divided equally among all verified host bodies. In the case of three junior researchers containing viable copies of the deceased, each receives 33.3% of the original benefit package.
  *   **3.2 Legal Liability:** Malpractice liability is joint and several. If one copy commits negligence, all hosts bearing the pattern share disciplinary records.
  *   **3.3 Governance Voting:** To prevent pattern-based quorum stuffing, a Distributed Unit retains only one vote on the Ethics Board. The three junior researchers must reach internal consensus prior to casting the deceased's single ballot. Failure to consensus results in abstention.

  **4.0 LEAVE ACCRUAL AND CONCURRENT ABSENCE**

  Vacation time accrues per pattern, not per substrate. A Distributed Unit may not take concurrent leave in multiple bodies. If three hosts share one identity, they share one leave balance. Simultaneous absence requests by hosts of the same pattern will be flagged as time-theft. One instance of the self may vacation; the others must maintain operational continuity.

  > **SIDEBAR: DEFINING HIGH-FIDELITY COPIES**
  >
  > **Threshold for Legal Personhood:**
  > Mere familiarity does not constitute co-employment. To qualify as a legal copy under Policy 44-B, the host brain must demonstrate the ability to simulate the source's decision-making processes with >85% accuracy during blind audits.
  >
  > **Exclusions:**
  > 1.  **Caricatures:** Exaggerated symbolic representations (e.g., "The Boss thinks I'm lazy") do not count.
  > 2.  **Passive Data:** Memorizing an employee's handbook does not internalize their self-structure.
  > 3.  **Emotional Resonance:** Grief alone is insufficient proof of identity transfer. Symbolic recursion must be demonstrated via Turing-style interpersonal testing.

  **5.0 COMPLIANCE**

  Failure to disclose pattern hosting may result in termination of all involved substrates. Employees are reminded that while the self is a strange loop, payroll is linear. Please direct queries regarding soul-splitting to the Help Desk.

  **END OF MEMO**
