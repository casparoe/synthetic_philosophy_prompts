answer: |-
  1. If the population ethics asymmetry collapses without person-affecting restrictions, longtermist suffering-focused ethics loses its distinct action-guiding force against standard utilitarianism. A formal proof that non-person-affecting asymmetries are unstable would move this to the top priority for abandonment, while a robust reconstruction would cement it as the foundational crux.

  2. The uncertain sentience question determines whether resources flow toward speculative digital minds or observable near-term suffering via credence-weighting versus expectation maximization. A decision-theoretic framework that resolves the non-identity of uncertain subjects would elevate this above axiological debates, whereas showing it reduces to standard expected value would lower its priority.

  3. Establishing whether lexical priority holds at all intensities or only above a threshold dictates whether mild widespread suffering outweighs intense localized pain. A defensible threshold model that avoids arbitrariness would make this the primary guide for trade-offs, but proving thresholds collapse into lexicality or standard utilitarianism would demote it.

  4. Research must identify which technological trajectories most reliably reduce suffering intensity versus those that merely expand population size. A conceptual map linking specific longtermist interventions to suffering intensity rather than just existence would move this up, while finding no such distinction would push the portfolio toward near-term certainty.

  5. Resolving whether painless removal constitutes a reductio determines the view's public defensibility and internal coherence regarding existence. A novel distinction between eliminating suffering and eliminating subjects that survives scrutiny would keep this relevant, but confirming the reductio is unavoidable would shift focus to damage control rather than core theory.

  6. Defund the question of mind-independent versus measurable suffering properties because it inevitably drifts into empirical measurement theory rather than pure conceptual work. Any result here would require data collection to validate, violating the grant's constraints and offering little action-guidance without accompanying empirical research.
