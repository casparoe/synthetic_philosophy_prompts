answer: |-
  You are absolutely right, and your intuition is sharper than your friend's. You have stumbled onto one of the most notorious problems in modern population ethics, formally known as **The Infinity Problem for Total Utilitarianism**.

  Your friend is trying to hold two incompatible thoughts in their head:
  1.  **The Theory:** Value is determined by the total sum of utility in the universe (Totalism).
  2.  **The Intuition:** Our actions matter because they change the value of the universe.

  In a finite universe, these two are identical. In an infinite universe, they diverge catastrophically. If the total is already $\infty$, adding $+10$ utility leaves it at $\infty$. Mathematically, the total is unchanged. Therefore, strict Totalism implies **moral nihilism** in an infinite universe (no action is better than any other).

  Here is the breakdown of the move he is making, the principle he is *actually* using, and where it breaks.

  ### 1. The Name of the Move
  There isn't a single Latin fallacy name for this, but in meta-ethics, this is called **Theoretical Inconsistency via Intuition Override**.

  More specifically, he is committing a **Category Error between State Evaluation and Act Evaluation**.
  *   **State Evaluation (Totalism):** "Which world state is better?" (Answer: Neither, both are $\infty$).
  *   **Act Evaluation (Marginalism):** "Which act produces a better *change*?" (Answer: The one that adds utility).

  He is claiming to use State Evaluation to justify his ethics, but when State Evaluation breaks, he silently switches to Act Evaluation without updating his theory. He is treating the *marginal contribution* as the moral truth while claiming the *total sum* is the moral truth.

  ### 2. The Principle He Is Actually Using
  Since he cannot be a Totalist (because Totalism is silent in infinite contexts), what principle actually licenses his claim that "we should obviously make things better"?

  He is implicitly relying on **Causal Localism** (sometimes called **Finite Difference Utilitarianism**).

  This principle states: *We should not compare the infinite totals of two worlds. Instead, we should compare the **finite difference** caused by our actions within our causal horizon.*

  Under Causal Localism, you ignore the background infinity. You treat the universe as if it were finite *for the purpose of calculation*, limited to the region of spacetime you can affect. If you save a life, you have created $+X$ utility in the "local" region. The fact that there are infinite happy aliens in the Andromeda galaxy is treated as a constant variable that cancels out in the equation.

  **Formal Name:** This is often formalized as the **Spatiotemporal Pareto Principle**.
  *   *Definition:* If World A and World B are identical everywhere except for a finite region, and World A has more utility in that region, then World A is better than World B.
  *   *Why he needs it:* This is the only standard principle that allows you to rank actions in an infinite universe without abandoning consequentialism entirely.

  ### 3. What This Commits Him To
  If he accepts Causal Localism/Pareto to save his argument, he is no longer a Totalist. He has committed to a view with specific, often uncomfortable, implications:

  **A. The "God's Eye View" is Meaningless**
  He must admit that asking "Is the universe better overall?" is a meaningless question. Only "Is the universe better *relative to my intervention*?" is meaningful. This undermines the objective stance of Totalism.

  **B. Moral Significance Depends on Causal Reach**
  If an action affects 1,000 people, it matters. If an action affects 1,000,000 people, it matters more. But if an action affects an *infinite* number of people (e.g., ensuring a civilization lasts forever), the math breaks again. He must commit to the idea that **infinite impacts are incomparable**. If you can start a colony that lasts forever (infinite utility) vs. one that lasts 1,000 years (finite utility), Causal Localism struggles to say the first is strictly better, because $\infty - \infty$ is undefined.

  **C. Isomorphism Sensitivity**
  In infinite ethics, the *arrangement* of value matters as much as the *amount*. If you rearrange infinite happy people so that the "good" ones are closer to you in time/space, some infinite ethics models say the world is "better" even if the total is the same. He has to accept that **location matters morally**, not just existence.

  ### 4. Where It Stops Applying (The Trap)
  You asked where this principle stops applying. This is where you can corner him. Causal Localism/Pareto solves the "Infinity" problem but creates new ones:

  **1. The Trade-Off Problem**
  The Pareto Principle only works if you make things better for *some* and worse for *none*. But almost all real-world ethics involve trade-offs (e.g., taxing the rich to help the poor).
  *   *The Trap:* Ask him: "If I can create 1 unit of good for person A by destroying 100 units of good for person B, but both are within my causal reach, does your principle tell me what to do?"
  *   *The Result:* Pareto is silent. He has to sneak Totalism *back in* for the local region. But if Totalism works for the local region, why doesn't it work for the global region? He has no consistent answer.

  **2. The Infinite Impact Loophole**
  If the universe is infinite in time (eternal future), then *every* action potentially has infinite downstream consequences (chaos theory).
  *   *The Trap:* "If the future is infinite, doesn't every action I take ripple out to affect infinite people? If so, aren't we back to $\infty$ vs $\infty$?"
  *   *The Result:* To avoid this, he must argue that distant future utility is **discounted** (worth less). But Discounting is a different ethical theory entirely (Discounted Utilitarianism), which implies people in the future matter less than people now. Most Totalists hate this.

  **3. The "Unaffected Observer" Paradox**
  If there is a being outside our causal horizon who is suffering terribly, Causal Localism says we have no obligation to help them (because we can't).
  *   *The Trap:* "If there are infinite suffering beings in a parallel universe we can't touch, does their suffering matter?"
  *   *The Result:* If he says "No," he is a **Relativist**, not a Universalist. If he says "Yes, it matters but we can't fix it," he admits the *Total* matters, which brings him back to the original problem where his actions don't change the Total.

  ### Summary for Your Argument
  Your friend is a **Totalist in name only**. When pressed, he becomes a **Marginalist**.

  *   **The Label:** He is attempting a **Theoretical Rescue via Marginalism**.
  *   **The Principle:** He is relying on the **Spatiotemporal Pareto Principle** (compare finite differences, ignore infinite backgrounds).
  *   **The Contradiction:** This principle cannot handle trade-offs (where one person loses and another gains) without secretly re-importing Totalism for the local cluster.
  *   **The Knockout:** Ask him: *"If Totalism is true, the value of the world is the sum. If the sum is infinity, the derivative is zero. If you say the derivative isn't zero, you are admitting Totalism is false. So which is it? Is the theory wrong, or is our duty an illusion?"*

  He cannot have it both ways. He wants the objective weight of Totalism ("The Universe demands we maximize good!") without the mathematical consequences of Totalism ("The Universe is already maxed out").
