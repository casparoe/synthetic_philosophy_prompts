      *   This is a classic problem in population ethics and utilitarianism known as the **Infinity Problem** (or the Problem of Infinite Utility).
      *   Standard Total Utilitarianism fails in infinite contexts because cardinal arithmetic ($\infty + x = \infty$) makes all actions seem equivalent.
      *   The friend is intuitively reaching for a different principle to solve this but hasn't articulated it.

  3.  **Identify the "Move" (Labeling):**
