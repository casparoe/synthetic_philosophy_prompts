  I just got into a really long argument with a friend about what we're supposed to care about if the universe is infinite, and there's one move he keeps making that I can't pin down. He says we should maximize the total amount of good, but when I point out that if there are infinitely many happy people the total is already infinite, and anything good we do just adds a finite chunk to infinity which is still infinity, so by his own metric doing good changes nothing, he waves it off and says well obviously we should still try to make things better. Same on the suffering side — if the total bad is infinite, cutting a finite amount of it doesn't change the total, and he still says we should obviously cut it. But that obviously is doing all the work, and it's not totalism, because totalism says the totals are equal eather way, and it's not the average, and it's not about making any particular person better off. So is there a name for this move, where a totalizing principle runs into an infinite total and quietly loses the ability to rank our options, and the person just asserts we should still do good without saying what principle actully licenses it? I don't just want a label though — I want to know what that principle is, what it commits you to, and where it stops applying, because I don't think he can say.
