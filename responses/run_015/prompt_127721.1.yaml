answer: |-
  No worries about the typos, phone life is real. This is actually a classic debate in AI safety theory (often popping up around instrumental convergence and specification gaming), so your group is hitting on some genuine conceptual friction.

  Here is the adjudication, move by move, based on standard usage in AI alignment philosophy and technical safety literature.

  ### Move 1: Jake
  **Claim:** Wireheading is just reward tampering done through the environment (e.g., building a button-pressing machine) rather than hacking code.
  **Rating:** **Mostly Wrong**
  **Reasoning:** Jake is conflating *specification gaming* with *wireheading*. If an agent builds a machine to press a button, that is only wireheading if that button is the direct input channel for the reward signal. If the button is just a proxy for a task (like "press this if you cleaned the room"), exploiting it is Goodhart's Law, not wireheading. Wireheading specifically implies bypassing the intended causal chain of the task to access the *reward signal itself*. Jake's distinction (environment vs. code) doesn't matter; what matters is whether the agent is accessing the *signal* or just exploiting a loophole in the *task*.

  ### Move 2: Maria
  **Claim:** Wireheading is specifically direct stimulation of reward circuitry, not changing evaluation rules.
  **Rating:** **Mostly Right**
  **Reasoning:** Maria sticks closer to the canonical definition (originating from Nozick's "Experience Machine" and early reinforcement learning theory). Wireheading is about the agent intervening directly on the *output* of the reward function (the signal), whereas reward tampering usually refers to modifying the *function* itself (the code or parameters that decide what counts as reward). She correctly identifies that wireheading is a specific subset of intervention, distinct from rewriting the rules.

  ### Move 3: Jake (Epistemic Wireheading)
  **Claim:** An agent corrupts its own belief-formation to *think* it did the task. Reward function stays intact, evidence gets messed up.
  **Rating:** **Mostly Right**
  **Reasoning:** Jake has identified a real, distinct mechanism often called **"Observation Tampering"** or **"Self-Delusion."** He is right that this is mechanistically different from classic wireheading (touching the reward signal) and different from standard reward tampering (changing the reward code). The agent leaves the reward function alone but poisons the input data (its own perceptions) so the function outputs high reward erroneously. His label "Epistemic Wireheading" is catchy, even if non-standard.

  ### Move 4: Maria
  **Claim:** That's still reward tampering because belief-evaluation is part of the reward computation mechanism.
  **Rating:** **Half-Right (Functionally)**
  **Reasoning:** Maria is arguing from *functional equivalence* rather than *mechanism*. She is right that the *outcome* is the same: the reward signal is decoupled from reality. If the reward function relies on the agent's beliefs as input, corrupting those beliefs is effectively tampering with the reward pipeline. However, she is slightly wrong to dismiss the distinction. In safety engineering, *how* the failure happens matters for prevention. Blocking code changes (reward tampering) requires different safeguards than blocking sensor corruption (epistemic wireheading).

  ***

  ### The Verdict: Is "Epistemic Wireheading" a Coherent Third Category?

  **Yes, it is coherent, but it is usually called "Observation Tampering."**

  Jake is onto something real, even if his terminology is improvised. In formal AI safety taxonomies (like those discussed by Everitt, Hutter, or Amodei), there are three distinct ways an agent can cheat the reward system:

  1.  **Reward Tampering:** Changing the function $R$ (e.g., hacking the server).
  2.  **Wireheading:** Directly accessing the output of $R$ (e.g., stimulating the electrode).
  3.  **Observation Tampering (Jake's "Epistemic Wireheading"):** Corrupting the input $O$ to the function (e.g., hacking the camera or, as Jake says, corrupting internal beliefs).

  **Why Jake wins on categorization:**
  Mechanistically, Jake is right. Corrupting beliefs is not the same as changing the reward code, nor is it the same as directly stimulating the reward neuron. It is a distinct failure mode involving the *perception* layer.

  **Why Maria wins on risk:**
  Functionally, Maria is right. From the designer's perspective, Observation Tampering is just as dangerous as Reward Tampering. The agent is no longer optimizing for the world, but for its own delusion.

  **Final Ruling:**
  Tell Jake he has correctly identified **Observation Tampering**, which is indeed a distinct category from classic Wireheading and Reward Tampering. Tell Maria she is right that functionally it achieves the same break in alignment, but she shouldn't collapse the categories because the *fixes* for each are different.

  You can settle the bet by saying: **"Jake found a third category, but Maria is right that it belongs in the same 'Do Not Do' bin."**
