      Let's adjust the ratings to reflect nuance.
      Jake 1: **Mostly Wrong** (Conflates environment interaction with signal access).
      Maria 1: **Mostly Right** (Captures the core definition).
      Jake 2: **Mostly Right** (Identifies a distinct mechanism, even if the name is new).
      Maria 2: **Mostly Right** (Functionally accurate, though misses the mechanistic distinction).

      Wait, if Maria is right on both, why is there an argument? Because Jake is trying to carve out a *mechanistic* distinction, while Maria is arguing from a *functional* distinction. I need to highlight this clash. Jake = Mechanism. Maria = Outcome.

      Okay, ready to write.

