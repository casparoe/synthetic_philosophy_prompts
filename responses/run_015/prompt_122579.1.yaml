answer: |-
  # Joint Statement: Adversarial Collaboration on Safety Methodologies

  **Context:** Over eight months, two camps ("Worst-Case" and "Average-Case") have debated methodologies for assessing AI risk. This document records agreed claims, residual disagreements, and empirical cruxes.

  ### 1. Agreed Claims
  *Both sides sign the following technical claims. Each includes a plain-English gloss.*

  1.  **Logical Distinction:** The claim "99% reliable on Eval E" and the claim "Won't do X" are different logical kinds; the former is empirical evidence, the latter is a universal guarantee.
      *   *Gloss: Passing tests proves test performance, not universal safety.*
  2.  **Distributional Regress:** Every average-case claim is relativized to a distribution, and validating that distribution is itself an unproven average-case claim.
      *   *Gloss: You can't measure reliability without assuming where inputs come from.*
  3.  **Variance Types:** Variance across inputs, variance across training runs, and variance across deployment contexts are three different things that scale differently.
      *   *Gloss: Changing the model, the data, or the world breaks reliability in different ways.*
  4.  **Correlated Failures:** Correlated failures across many copies make per-instance reliability misleading in the tail.
      *   *Gloss: If one model fails, others likely will too, so system-wide risk is higher than individual risk.*

  ### 2. Nature of the Disagreement
  Much of the debate is verbal (definitions of "safety case"), but the operational divergence is real. The core fight is not about whether risk exists, but about **actionability under uncertainty**. Worst-Case people treat unquantified model uncertainty as a stop signal; Average-Case people treat it as a monitoring requirement. We have redrawn the disagreement table below to reflect this operational split rather than purely epistemological differences.

  ### 3. Residual Disagreements
  *Each disagreement is stated twice, using each camp's own terminology.*

  | Topic | Worst-Case Framing | Average-Case Framing |
  | :--- | :--- | :--- |
  | **Feasibility of Bounds** | Without a bound covering all inputs inside a threat model, we cannot rule out catastrophe. | Bounds covering all inputs for capable systems are impossible to compute, so we must rely on empirical reliability. |
  | **Value of Eval Suites** | Eval suites measure performance on known data, not robustness to unknown adversaries or distributional shift. | Eval suites are the only tool that produces actionable numbers for decision-making today. |
  | **Response to Uncertainty** | Uncertainty about the threat model demands a precautionary halt until the model is bounded. | Uncertainty about the threat model demands better monitoring and gradual deployment with error bars. |

  ### 4. Empirical Cruxes
  *For each crux, we specify a concrete measurement both sides agree would bear on the issue, with pre-committed predictions.*

  **Crux 1: Interpreting Probability Bounds**
  *   **Measurement:** A formal definition of "p(catastrophe) < 1e-3" for a deployed system.
  *   **Worst-Case Prediction:** This number must include subjective uncertainty over threat models, not just sampling noise.
  *   **Average-Case Prediction:** This number must be frequentist sampling noise over a defined distribution, otherwise it is not actionable.

  **Crux 2: Red-Team Compute vs. Real Failures**
  *   **Measurement:** Increase adversarial attack compute budget by 10x on a fixed model.
  *   **Worst-Case Prediction:** Failure rate rises significantly, showing current evals underestimate risk.
  *   **Average-Case Prediction:** Failure rate plateaus near observed eval error, showing current evals capture most failure modes.

  **Crux 3: Capability vs. Tail Risk**
  *   **Measurement:** Scale model size while holding training data constant.
  *   **Worst-Case Prediction:** Tail risk (worst 0.01% of behaviors) increases even if average reliability improves.
  *   **Average-Case Prediction:** Tail risk decreases proportionally with average reliability gains.

  **Crux 4: The Middle Object**
  *   **Measurement:** Propose a "Bounded Threat Model + Monitored Assumption" hybrid safety case.
  *   **Worst-Case Prediction:** We will only sign if monitoring guarantees detection of bound violations before catastrophe.
  *   **Average-Case Prediction:** We will only sign if the monitoring cost is lower than the cost of proving the bound.

  ### 5. Closing Note
  The collaboration confirms that while we share a vocabulary, we do not share a decision threshold. The "distributional regress" (Claim 2) is acknowledged by both sides, but we disagree on whether it invalidates deployment (Worst-Case) or merely complicates it (Average-Case). Future work should focus on Crux 4, as it offers the only viable path toward a shared safety standard.
