      *   **Satire Target:** The Strawsonian position itself. The comedy must come from getting the philosophy *right* (accurate application of Strawson's concepts) rather than inventing features.
      *   **Key Strawsonian Elements to Include:**
          *   Objective attitude vs. Participant stance.
