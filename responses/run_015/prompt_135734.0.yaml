  # Activity: The Veil Auction & The Indifference Trap

  **Session Length:** 75 Minutes
  **Participants:** 12 Grad Students
  **Materials:**
  *   12 Sealed Envelopes (labeled "Identity 1" through "Identity 12").
  *   Inside each envelope: An **Identity Card** (see *Prep* below).
  *   120 "Influence Tokens" per participant (can be poker chips, slips of paper, or just tally marks on the board).
  *   Whiteboard & Markers.
  *   Handout: "The Social Choice Problem" (one per person).

  **Learning Objectives:**
  1.  Experience that social weights ($a_i$) are a normative choice, not a logical derivation.
  2.  Discover that "Priority for the Worst Off" (Prioritarianism) violates the Pareto Indifference axiom when individuals are vNM rational.
  3.  Connect these constraints to the linear additive form of Social Welfare without hearing the theorem's name until the end.

  ---

  ## Part 1: Preparation (Before Session)

  **1. Identity Cards (12 Total)**
  Create two types of cards. Do not label them "Type A/B," just vary the functions.
  *   **Type Linear (6 cards):** $u(m) = m$. (Risk Neutral).
  *   **Type Concave (6 cards):** $u(m) = \sqrt{m}$. (Risk Averse).
  *   *Note:* Include a small lookup table on the card to speed up math during the session.
      *   *Linear:* \$0=0, \$25=25, \$100=100.
      *   *Concave:* \$0=0, \$25=5, \$100=10.

  **2. The Handout**
  A single sheet with two sections:
  *   **Section A (The Veil):** A grid with numbers 1–12. Instructions to allocate 120 tokens across these numbers.
  *   **Section B (The Choice):** Two Lotteries described in monetary terms.

  ---

  ## Part 2: Session Timeline

  ### 0:00 – 0:10 | Setup & The Veil
  1.  **Distribution:** Hand out the sealed envelopes. **Strict Rule:** Do not open them yet.
  2.  **Narrative:** "You are Constitutional Designers. You are currently behind a Veil of Ignorance. You know there are 12 'Seats' in this society, each occupied by a person with specific preferences over money. You do not know which Seat you will occupy. You will occupy one, chosen at random."
  3.  **The Task:** "Society needs an Aggregation Rule. Specifically, you must decide how much 'weight' each Seat gets in the Social Welfare Function. You have 120 Influence Tokens each. Allocate them across Seats 1–12 on your handout."
  4.  **The Mechanic:** "The total tokens assigned to Seat $i$ determine the weight $a_i$ in the social sum. If you put more tokens on Seat 1, Society cares more about Seat 1's utility."
  5.  **Action:** Give them 5 minutes to allocate. They will likely distribute evenly (10 tokens each) because they are risk-neutral behind the veil regarding identity.
  6.  **Collection:** Collect the handouts. Tally the class average weights on the board. (It will be roughly uniform).
  7.  **Key Comment:** "You have just fixed the parameters $a_1...a_{12}$. Note: Nothing in logic forced you to choose equal weights. You chose them based on a moral intuition of impartiality. The math accepts any positive weights."

  ### 0:10 – 0:35 | The Reveal & The Indifference Trap
  1.  **Open Envelopes:** Participants open their Identity Cards. They now know their $u(m)$.
  2.  **The Scenario:** "A Social Lottery must be chosen. There are two options, $L_{Safe}$ and $L_{Risky}$."
      *   **$L_{Safe}$:** Every person receives \$36 for certain.
      *   **$L_{Risky}$:** A coin is flipped. Heads: Everyone gets \$144. Tails: Everyone gets \$0.
  3.  **Individual Calculation (5 mins):** Ask them to calculate their Expected Utility (EU) for both lotteries using their card's function.
      *   *Linear:* Safe=36. Risky=$0.5(144) + 0.5(0) = 72$. (Prefer Risky).
      *   *Concave:* Safe=$\sqrt{36}=6$. Risky=$0.5(\sqrt{144}) + 0.5(0) = 6$. (**Indifferent**).
      *   *Correction for Activity:* To make the point land, we need *everyone* to be indifferent, or we need to isolate the Social Axiom.
      *   *Pivot:* "For the sake of this argument, imagine we have calibrated the numbers such that **every single person** calculates their Expected Utility to be exactly equal between $L_{Safe}$ and $L_{Risky}$." (Acknowledge the math on the board was illustrative of risk attitudes, but ask them to *assume* universal indifference for the next step).
  4.  **The Social Vote:** "Given that **everyone** is individually indifferent between Safe and Risky (Pareto Indifference condition), how must Society rank them?"
      *   Option A: Society must be indifferent.
      *   Option B: Society can prefer Safe (to protect the 'worst off' outcome of \$0).
  5.  **Discussion (10 mins):** Let them argue.
      *   If they choose **B (Priority):** Ask, "How can Society prefer Safe if *no individual* prefers Safe? Whose preference is Society overriding?"
      *   If they choose **A (Indifference):** Ask, "Does this feel morally sufficient? What about the people who get \$0 in the Risky case?"
  6.  **The Trap:** "If you choose Priority (B), you have violated the **Pareto Indifference Axiom**. If you choose Indifference (A), you have accepted **Additive Separability** (Utilitarianism). You cannot have vNM rationality for individuals, vNM rationality for Society, Pareto Indifference, *and* Priority for the Worst Off simultaneously."

  ### 0:35 – 0:55 | The Weight Auction (Revisited)
  1.  **Narrative:** "We've seen the structure is forced (Additive). But the weights are not. Let's test the stability of your weights."
  2.  **The Shock:** "Suppose we reveal that Seat 1 is a 'Vulnerable' type (Concave) and Seat 12 is a 'Robust' type (Linear). Does anyone want to trade tokens from the Veil Auction to increase the weight of the Vulnerable types?"
  3.  **Action:** Allow 5 minutes of trading/lobbying.
  4.  **Observation:** They will likely try to shift weights to the Concave users to "compensate" for their risk aversion.
  5.  **Point:** "You are now doing moral philosophy. You are arguing for a specific weighting scheme. The Theorem does not tell you to do this. It only says *if* you pick weights, *then* the sum is the rule."

  ### 0:55 – 1:15 | Debrief & The Reveal
  1.  **Map the Game to the Theorem:**
      *   **Veil Auction:** This was the selection of $a_i$ (weights). The theorem says they must be constant, but doesn't say what they must be. Your choice of equal weights was a normative commitment to Anonymity, not a mathematical necessity.
      *   **Indifference Trap:** This tested **Pareto Indifference**.
          *   Individuals satisfy vNM (Independence Axiom).
          *   Society satisfies vNM (Independence Axiom).
          *   Pareto Indifference holds.
          *   *Result:* Social Welfare must be $W = \sum a_i u_i$.
          *   *Conflict:* Prioritarianism ($W = \sum g(u_i)$ where $g$ is concave) violates Social vNM Independence or Pareto Indifference.
  2.  **Name Drop:** "This is **Harsanyi's Aggregation Theorem** (1955)."
  3.  **Honest Limitations (Crucial):**
      *   "The game couldn't show you *why* the math forces linearity. I have to state that: The only function that preserves linear combinations of probabilities (vNM) across individuals and society simultaneously is a linear sum."
      *   "The game showed you the *cost* of that linearity: You lose the ability to care about the distribution of utility ex-post without contradicting the individuals' own ex-preferences."
  4.  **Final Question:** "Knowing the weights are undetermined, where does the moral work happen?" (Answer: In the Veil/Constitutional stage, not in the aggregation stage).

  ---

  ## Predictable Failures & Mitigation

  **1. Math Anxiety / Slow Calculation**
  *   *Risk:* Participants get bogged down calculating square roots.
  *   *Fix:* The Identity Cards must have the **Lookup Table** pre-printed. Do not make them calculate $\sqrt{144}$.
  *   *Fix:* In the "Indifference Trap," explicitly tell them: "Assume the numbers are calibrated so you are all indifferent. Trust the premise."

  **2. Confusing Risk Aversion with Priority**
  *   *Risk:* Participants think the Concave card holders *want* the Safe lottery, so Society preferring Safe is just aggregating preferences.
  *   *Fix:* Be very clear in the "Indifference Trap" section. "We are positing a hypothetical where **everyone** is indifferent. If Society still prefers Safe, it is imposing a preference no individual holds."

  **3. The "Weights Should Be Equal" Objection**
  *   *Risk:* Participants argue the theorem *implies* equal weights.
  *   *Fix:* Remind them of the Auction. "Could you have physically put more tokens on Seat 1? Yes. Would the math break? No. The theorem allows dictatorship ($a_1=1, others=0$). You chose equality because you are democrats, not because you are mathematicians."

  **4. Running Out of Time**
  *   *Risk:* The Auction drags on.
  *   *Fix:* Hard stop the Auction at 10 minutes. Even if they haven't finished allocating, take the average. The insight is that they *can* allocate, not that they reach consensus.

  ---

  ## What the Game Cannot Produce (Be Honest Here)

  In the debrief, explicitly state:
  1.  **The Proof:** The game demonstrates the *implications* and *tensions*, but it cannot derive the linearity. You must tell them: "The requirement that Social Preferences satisfy the Independence Axiom (vNM) mathematically eliminates any non-linear transformation of utility."
  2.  **Interpersonal Comparison:** The game assumes utilities are comparable enough to sum. Harsanyi assumes this via the Veil. The game glosses over the "unit of utility" problem. Acknowledge that we treated "tokens" as comparable utility units for the sake of the mechanic.

  ## Facilitator Script Snippet (For the "Indifference Trap")

  > "Look at your cards. Some of you hate risk. Some don't. But imagine a world where the numbers are tuned so that *every single one of you* says 'I don't care, Option A and B are the same to me.'
  >
  > If Society says 'I care! I prefer Option A because it protects the loser,' Society is saying 'I know none of you prefer A, but I do.'
  >
  > Is Society allowed to know better than the people? If you say yes, you break Pareto. If you say no, you accept Utilitarianism. There is no third option that keeps vNM rationality intact."
