answer: |-
  (1) EXAM QUESTION

  **Course:** PHIL 705: Advanced Moral Theory (Bernard Williams Seminar)
  **Assessment:** Take-Home Essay Examination
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,500 words

  **Prompt:**

  Bernard Williams's critique of utilitarianism centers on the notion of integrity, famously illustrated through cases involving personal attachments (e.g., saving one's spouse over a stranger) or radical moral dilemmas (e.g., Jim and the Indians). In these instances, Williams argues that requiring an agent to adopt the utilitarian calculus introduces "one thought too many," alienating the agent from the ground projects that constitute their identity.

  Consider the following modified institutional case:

  > Dr. Aris is a trauma surgeon working in a public hospital. Her professional identity is constituted by a specific institutional vow: she is the primary attending physician for a specific roster of assigned patients. Tonight, two emergencies occur simultaneously.
  >
  > 1.  **Patient A:** One of Dr. Aris's assigned patients is in critical condition. Only Dr. Aris can save them due to specific knowledge of their history.
  > 2.  **Patients B, C, and D:** Three strangers (not under her care, assigned to other surgeons who are currently unavailable) are in critical condition. Statistically, if Dr. Aris attends to them instead of Patient A, the net survival rate is higher (3 lives saved vs. 1).
  >
  > A utilitarian framework demands Dr. Aris save Patients B, C, and D. Dr. Aris feels compelled to save Patient A, citing her professional vow and the specific responsibility she holds toward them.

  **Task:**

  Write an essay determining whether Williams's integrity objection applies to Dr. Aris's deliberation. Specifically, you must address:

  1.  Whether calculating net lives saved in this institutional context constitutes "one thought too many," or whether this case collapses into a form of role-based partiality that a sophisticated utilitarian could accommodate.
  2.  How the distinction between **agent-relative** and **agent-neutral** reasons illuminates the conflict between Dr. Aris's professional vow and the utilitarian demand.
  3.  Whether Williams's integrity objection depends essentially on the presence of deep personal relationships (like marriage or friendship) or if it retains its critical force when applied to institutional commitments and professional ground projects.

  **Instructions:**

  *   Assume the examiner is familiar with Williams's core arguments; do not waste word count on biographical detail or excessive summary of the "Jim and the Indians" case.
  *   Focus on the structural implications for moral theory.
  *   Adhere strictly to the word limit.

  ***

  (2) MODEL ANSWER

  **Title:** Professional Integrity and the Limits of the Calculus: A Williamsian Analysis of the Surgeon's Dilemma

  Williams's integrity objection is often misread as a defense of sentimental preference over moral duty. However, at the doctoral level, we must understand it as a structural critique of how moral theories demand agents view their own actions. The question is whether Dr. Aris's commitment to her assigned patient is a genuine ground project protected by integrity, or merely a heuristic for utility maximization that should be discarded when the calculus becomes clear. To resolve this, we must analyze the deliberative process, the nature of agent-relative reasons, and the distinction between personal and institutional attachments.

  **Move 1: The Structure of the Integrity Objection**
  Williams argues that utilitarianism threatens integrity by demanding that the agent become a neutral channel for the satisfaction of outcomes. Integrity is not merely honesty; it is the preservation of the agent's identity, constituted by "ground projects" that provide a reason for living. When utilitarianism requires an agent to abandon these projects for the greater good, it alienates the agent from their own actions. In the standard "spouse" case, the thought "which life should I save?" is already one thought too many; the proper response is immediate action based on attachment. In Dr. Aris's case, the parallel question is whether she should deliberate on the net survival rate. If her professional vow is a ground project, then introducing the utilitarian calculation alienates her from her professional identity. However, unlike the spouse case, the professional vow is public and institutional, which complicates the claim to integrity.

  **Move 2: Diagnosing the Surgeon Case**
  Does the calculation constitute "one thought too many" for Dr. Aris? If her commitment to Patient A is merely a rule-of-thumb for general welfare (i.e., "surgeons generally do better when they stick to their own patients"), then a utilitarian would argue the calculation is necessary when the rule clearly fails (3 lives > 1 life). However, Williams would counter that this misunderstands the phenomenology of commitment. For Dr. Aris, the reason to save Patient A is not "because this maximizes utility generally," but "because this is *my* patient." If she must justify her action by referencing the general good, she is no longer acting as a dedicated physician but as a bureaucrat of welfare. Therefore, the integrity objection holds: requiring her to calculate the net lives forces her to step outside the role that gives her action meaning. The calculation is not just an added step; it is a displacement of the motivating reason.

  **Move 3: Agent-Relative vs. Agent-Neutral Reasons**
  This displacement is best understood through the distinction between agent-relative and agent-neutral reasons. Utilitarianism provides only agent-neutral reasons: the value of a life saved is the same regardless of who saves it. The reason "save three lives" applies to Dr. Aris exactly as it applies to any other agent. Williams, however, insists on the validity of agent-relative reasons: "save *my* patient" is a reason that applies to Dr. Aris specifically because of her relationship to the patient, even if it does not apply to a bystander.
  In this scenario, the utilitarian demands Dr. Aris treat her agency as neutral. Williams argues this is incoherent. If Dr. Aris accepts only agent-neutral reasons, her professional vow loses its normative force. The integrity objection is essentially the demand that moral theory acknowledge agent-relative reasons as fundamental, not derivative. If we deny Dr. Aris the right to act on agent-relative reasons derived from her professional vow, we deny her the ability to integrate her moral life with her practical identity.

  **Move 4: Personal Attachment vs. Institutional Commitment**
  The critical challenge is whether Williams's defense of integrity generalizes from personal relationships to institutional roles. A critic might argue that spousal love is non-fungible and intrinsic, whereas professional roles are fungible and instrumental. One can be replaced as a surgeon; one cannot be replaced as a spouse. If the role is instrumental, utilitarianism can override it when the instrument fails.
  However, this distinction undermines Williams's broader point. For Williams, ground projects need not be biological or intimate; they must simply be projects with which the agent identifies. If Dr. Aris has internalized her professional vow as a constitutive part of her identity, it functions psychologically and normatively like a personal attachment. To demand she sacrifice it for the neutral good is to demand she sacrifice her integrity. The source of the commitment (institutional vs. personal) is less relevant than the depth of identification. If the institutional commitment is shallow, the objection fails. But if the vow is a genuine ground project, the integrity objection retains its critical force. Williams's critique is not about the *source* of the project, but the *demand* to abandon it for an external calculus.

  **Conclusion**
  Williams's integrity objection does apply to Dr. Aris, provided her professional vow is understood as a ground project rather than a disposable heuristic. The requirement to calculate net lives is "one thought too many" because it substitutes an agent-neutral justification for an agent-relative motivation. While institutional roles differ from personal attachments in their social origin, they function similarly in constituting the agent's identity. To force Dr. Aris to adopt the utilitarian perspective is to alienate her from the very commitments that make her a moral agent rather than a utility conduit. Thus, the integrity objection survives the translation from the personal to the institutional, challenging the utilitarian claim to total normative coverage.

  ***

  (3) MARKING SCHEME

  **Total Marks:** 20
  **Passing Threshold:** 10/20

  | **Criterion** | **Marks** | **Must-Hit Requirement** | **Characteristic Failure (0 Marks for this criterion)** |
  | :--- | :---: | :--- | :--- |
  | **1. Reconstruction of Integrity** | 4 | Accurately defines Williams's "integrity" as identity-constituting ground projects, not merely emotional preference. | Treats integrity as simple honesty or conflates it with selfishness/whim. |
  | **2. Application of "One Thought Too Many"** | 4 | Correctly diagnoses whether the surgeon's calculation alienates her from her motivating reasons in the specific scenario. | Merely describes the dilemma without analyzing the *deliberative process* or the "thought." |
  | **3. Agent-Relative vs. Agent-Neutral** | 4 | Explicitly deploys the distinction to explain why utilitarianism conflicts with the surgeon's professional vow. | Uses the terms incorrectly or fails to link them to the utilitarian demand for neutrality. |
  | **4. Personal vs. Institutional Distinction** | 4 | Critically assesses whether professional vows carry the same normative weight as personal attachments in Williams's framework. | Assumes institutional roles are automatically fungible or identical to marriage without argument. |
  | **5. Defended Verdict** | 4 | Provides a clear conclusion on whether the integrity objection generalizes, supported by the preceding analysis. | Sits on the fence, contradicts earlier arguments, or offers a conclusion without justification. |

  **Examiner's Note:** Candidates who focus exclusively on the "Jim and the Indians" case without pivoting to the surgeon scenario will fail Criterion 2. Candidates who argue that utilitarianism is simply "cold" rather than structurally alienating will fail Criterion 1.
