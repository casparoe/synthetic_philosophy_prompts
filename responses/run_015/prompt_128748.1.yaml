answer: |-
  1. The account must separate latent modeling capacity from motor-output bandwidth, ensuring hidden competence isn't misclassified as absence, which kills standard IQ testing frameworks that conflate performance with ability. This requirement does the most work in excluding candidates that rely solely on behavioral observation.

  2. It must distinguish adaptive generalization from static pattern matching or loophole exploitation, ruling out systems that collapse when goalposts shift, which kills the "intelligence is just compression" story if compression implies mere regurgitation.

  3. The definition must specify whether recruiting external scaffolding counts as internal capacity or merely environmental luck, though this *is negotiable* depending on whether you value outcome or mechanism, and it quietly kills the "brain in a vat" purism that ignores tool use. Accepting scaffolding here creates direct tension with Item 5 if efficiency is prized over tool reliance.

  4. It must decide if intelligence can reside in a collective substrate rather than a single agent, preventing the collapse of swarm efficacy into individual luck, which kills strict methodological individualism in cognitive science.

  5. The account must determine if resource cost defines the quality of intelligence or just its implementation, where favoring efficiency *is negotiable* but creates tension with Item 3's scaffolding allowance, killing brute-force search accounts that ignore computational expense.
