  "You're paying for what the model missed," Okonkwo replied. "Temperamental fit, unnoticed mentorship, even the noise in the regression. That's not responsibility; it's unmodeled luck. And modeling error isn't random. It correlates with advantage. The well-connected look like they're outperforming because the model couldn't quantify their network. You're baking systemic bias into the 'merit' score."

  "So we improve the covariates," Vance said. "But you can't model everything without total surveillance. At some point, the residual is the only operational definition of 'what you contributed' available to an institution. If we don't use it, we default to market prices, which are far more sensitive to brute luck."

