  Vance leaned back. "I grant desert doesn't fix the magnitude. It fixes the *justification for inequality*. The university's aims set the scale—how much we need to incentivize research—but desert ensures the distribution isn't merely a bargain struck from advantage. We pay differentials to serve the mission, but only desert makes those differentials *just* rather than efficient. Without the audit, the gaps are purely functional; with it, they're normative."

  "Then the heavy lifting is done by the aims, not the desert," Okonkwo countered. "And if the aims set the gaps, why risk the privacy invasion? To calculate this residual, you need health history, caregiving years, parental education. That's demeaning. It expresses that the university owns your biography. The expressive cost outweighs the normative gain."

  "It expresses that the university respects you as an agent, not a luck-container," Vance said. "Privacy costs are side constraints, not veto cards. We accept tax audits for civic duty; this is institutional justice. The intrusion is the price of treating colleagues as responsible beings."

  "But audits verify facts," Okonkwo said. "This verifies moral worth. And you still haven't answered what makes a differential genuinely deserved if not the residual. If the metric is conventional, why call it desert?"

  "Direct tracking of sacrificial effort," Okonkwo answered himself before Vance could pivot. "If you want desert, pay for hours worked under duress, not output. But you won't do that because it's too intrusive. So you use output residuals and call it desert."

  "Wait," Vance said. "When you say 'desert,' you mean moral worthiness based on sacrifice. I mean entitlement based on contribution relative to opportunity. We're arguing about the label, not the mechanism."

  "Partially," Okonkwo conceded. "But if your 'desert' doesn't track moral effort, it doesn't block the luck objection. However, I will concede that the current market schedule is worse. It rewards brute luck without even pretending to adjust for circumstance."

  "And I concede the metric," Vance said. "The dollar amount of the gap is conventional. Desert justifies the ranking; institutional budget constraints set the spread. We can't derive the salary schedule from morality alone."

