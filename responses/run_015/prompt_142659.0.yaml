      "That conflates epistemic limits with metaphysical desert," Okonkwo said. "But let's say you're right. Here's the metric problem. Desert might tell us Alice ranks above Bob. It doesn't tell us Alice should earn $10,000 more versus $100. An ordinal claim cannot justify a cardinal differential."

      Vance leaned back. "I grant desert doesn't fix the magnitude. It fixes the *justification for inequality*. The university's aims set the scale—how much we need to incentivize research—but desert ensures the distribution isn't merely a bargain struck from advantage. We pay differentials to serve the mission, but only desert makes those differentials *just* rather than efficient."

      "Then the heavy lifting is done by the aims, not the desert," Okonkwo countered. "And if the aims set the gaps, why risk the privacy invasion? To calculate this residual, you need health history, caregiving years, parental education. That's demeaning. It expresses that the university owns your biography."

      "It expresses that the university respects you as an agent, not a luck-container," Vance said. "Privacy costs are side constraints, not veto cards. We accept tax audits for civic duty; this is institutional justice."

      "But audits verify facts," Okonkwo said. "This verifies moral worth. And you still haven't answered what makes a differential genuinely deserved if not the residual."

      "Direct tracking of sacrificial effort," Okonkwo answered himself before Vance could pivot. "If you want desert, pay for hours worked under duress, not output. But you won't do that because it's too intrusive. So you use output residuals and call it desert."

