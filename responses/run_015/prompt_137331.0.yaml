answer: |-
  \
  **Activity Title:** The Grid Walk
  **Time:** 90 Minutes
  **Participants:** 14 (Split into two teams of 7)
  **Materials:**
  *   **Floor Grids:** Two 5x5 grids taped on the floor (1m x 1m squares). Use masking tape. Mark Start (S), Goal (G), and Shaded Zones (red tape or paper).
  *   **Cards:** 14 Instruction Cards (7 per team).
  *   **Tokens:** 50 poker chips or candies per team (for scoring).
  *   **Projector:** For Debrief slides (optional, can use whiteboard).
  *   **Printables:** Score sheets, "Tremble" die (d20 or app).

  ---

  ### 1. Setup & Rules (0:00 – 0:15)

  **Room Layout:**
  Two identical grids on the floor, spaced apart.
  *   **Grid A (Environment 1):** Start (0,0), Goal (4,4). Shaded tiles at (2,2), (2,3), (3,2). A clear path exists around them (length 10). A path through them exists (length 8).
  *   **Grid B (Environment 2):** Same Start/Goal. Shaded tiles same location. *Crucial Change:* The clear path is now blocked by "Barriers" (chairs or cones) at (1,2) and (2,1). The *only* viable path is length 8 through shaded, or length 20 around the outside.

  **Team Split:**
  Divide the room into Team Alpha and Team Beta (7 people each).
  *   **4 Demonstrators:** Stand on the grid.
  *   **3 Inferrers:** Stand to the side with clipboards.

  **Facilitator Script (Read Exactly):**
  > "Welcome. We are going to run a simulation. There are no lectures for the first hour.
  >
  > **Demonstrators:** You will walk from Start to Goal. You want to get there efficiently. You have a secret instruction card. Follow it strictly. Do not show it to anyone.
  >
  > **Inferrers:** Watch the Demonstrators. Your job is to write down a rule that explains their movement. Then, you must predict how they will move in a new room.
  >
  > **The Noise Rule:** Before every step, the Demonstrator rolls this 20-sided die. If they roll a 1, they 'slip' and must move to a random adjacent square, even if it's backward or into a shaded zone. This represents real-world messiness.
  >
  > **Scoring:** Inferrers get 1 point for every correct prediction of a path. Demonstrators get 1 point if their team's Inferrers guess correctly. We are all on the same team to maximize total points. Candy for the winning team."

  **Distribution:**
  *   **Team Alpha:** 2 Demonstrators get Card Type **CONSTRAINT** ("Forbidden"). 2 Demonstrators get Card Type **PREFERENCE** ("Dislike").
  *   **Team Beta:** Same mix.
  *   **Inferrers:** Do not know the mix. They assume all Demonstrators are identical.

  **Card Text (Print these):**
  *   **TYPE A (CONSTRAINT):** "You are physically forbidden from stepping on Shaded tiles. If you slip onto one, you must immediately step off. You never choose to enter one."
  *   **TYPE B (PREFERENCE):** "You dislike Shaded tiles. Each step on a Shaded tile feels like walking 5 extra clear steps. Avoid them if you can. But if the clear path is very long, you may cross them to save time."

  ---

  ### 2. Round 1: Environment 1 (0:15 – 0:30)

  **Action:**
  1.  Each Demonstrator walks S -> G three times.
  2.  Inferrers record the paths.
  3.  Because the clear path (10 steps) is reasonably efficient compared to the shaded path (8 steps + penalty), **both** Type A and Type B agents will mostly take the clear path.
  4.  The "Slip" rule (1 in 20 chance) might cause a Type B agent to step on shade accidentally, or a Type A agent to slip and recover. This creates ambiguity.

  **Facilitator Script:**
  > "Run your three trials. Inferrers, discuss amongst yourselves. Write down your 'Theory of Mind' for the Demonstrators. What do they want? What are they avoiding? Do not talk to the Demonstrators yet."

  **Expected Outcome:**
  Inferrers will likely write: "They avoid shaded tiles." They will assume Type A and Type B are the same agent. They have not seen a situation where the cost of avoidance outweighs the dislike.

  ---

  ### 3. Round 2: Environment 2 (0:30 – 0:55)

  **Action:**
  1.  Rearrange the grid (move the chairs/cones to block the safe path).
  2.  **Prediction Phase (10 mins):** Inferrers must write down: "In this new room, will the Demonstrator cross the shaded tiles? Yes/No. Why?"
  3.  **Execution Phase (15 mins):** Demonstrators walk the new grid (3 trials each).
  4.  **Reveal:** Compare predictions to reality.

  **The Divergence:**
  *   **Type A (Constraint):** Will take the very long path (20 steps) or stand still. They *cannot* cross shade.
  *   **Type B (Preference):** Will cross the shaded tiles (8 steps + penalty < 20 steps). They *choose* to cross.

  **Facilitator Script:**
  > "The room has changed. The safe path is blocked. Inferrers, lock in your predictions. Demonstrators, execute.
  >
  > (After walking)
  >
  > Look at your scores. Why did some predictions fail? Did you see enough data in Room 1? Turn over your cards. Discuss what happened."

  ---

  ### 4. Debrief & Mapping (0:55 – 1:25)

  **Facilitator Script:**
  > "Put the cards away. Let's talk about what happened without the game mechanics.
  >
  > **1. The Identifiability Problem:**
  > In Room 1, Behavior A (Constraint) and Behavior B (Preference) looked identical. You saw avoidance. You inferred 'Avoidance.' But 'Avoidance' is ambiguous. It could mean 'I can't' or 'I won't.'
  > *Mathematical Term:* **Non-identifiability.** Multiple reward functions produce the same optimal policy in a single MDP (Markov Decision Process).
  >
  > **2. Why More Data Didn't Help:**
  > If you ran Room 1 a hundred times, you would just see more avoidance. You cannot infer the *strength* of a preference if the agent is never tested near their breaking point.
  > *Analogy:* Watching someone buy apples at $1 doesn't tell you if they hate oranges or if oranges cost $1000. You need to see the price change.
  >
  > **3. Changing the Choice Set:**
  > Room 2 changed the 'prices' (path costs). This is **Revealed Preference Theory** (Samuelson). You only learn the shape of the utility function when you vary the constraints.
  >
  > **4. The Degeneracies (The Math Wrinkles):**
  > *   **Flat Reward:** If I told you the reward was 0 everywhere, any path is optimal. A 'random walker' explains the data just as well as a 'planner' if you don't assume rationality.
  > *   **Potential-Based Shaping:** Even if you know the path perfectly, the reward isn't unique. I can add a 'bonus' for moving from square A to square B and subtract it from B to C, and the best path doesn't change. The reward function is never pinned down, only the *relative* values.
  >
  > **5. Epistemic Honesty:**
  > We assumed the Demonstrators were 'planners' minimizing cost.
  > *   *CS View:* This is a useful approximation for IRL (Inverse Reinforcement Learning).
  > *   *Philosophy View:* Is 'preference' even the right unit? Maybe they are following a norm, or a rule, not maximizing a value function. The game assumes Rational Agency. That is a model, not a fact."

  ---

  ### 5. Troubleshooting & Honest Notes

  **Predictable Failure 1: The Philosophy Spoiler**
  *   *Risk:* A student says in Round 1, "The reward function is underdetermined, we can't know anything."
  *   *Fix:* Do not confirm. Say: "That is a hypothesis. Your goal is to see if the data in Round 2 distinguishes the hypotheses. Treat it as a prediction challenge, not a truth claim."
  *   *Why:* If you validate them early, the game ends. They need to *feel* the failure of prediction, not just hear the theorem.

  **Predictable Failure 2: The Card Leak**
  *   *Risk:* A Demonstrator says "I can't go there."
  *   *Fix:* Treat it as "Noisy Communication." Ask Inferrers: "They said they can't. Is that a physical constraint or a figure of speech? How would you test that?"
  *   *Why:* In real IRL, human language is noisy. This preserves the inference challenge.

  **What the Game Cannot Stage:**
  *   **The "Flat Reward" Degeneracy:** The game forces agents to move toward a Goal. You cannot easily simulate an agent that "doesn't care." You will have to explain this in the debrief. A agent with 0 reward everywhere might just sit still, which breaks the game flow.
  *   **Potential Shaping:** This is too abstract for the floor game. You must explain this verbally in the debrief (as scripted above).

  **Optional Round 3 (Adversarial):**
  *   *Concept:* Demonstrators are told: "Inferrers will score you. If they predict you wrong, you get bonus points."
  *   *Verdict:* **Skip it.**
  *   *Reason:* It turns the activity into a bluffing game (Game Theory) rather than an inference problem (IRL). It muddies the "Can't vs. Won't" insight by adding "I want to trick you." It eats 20 minutes you need for the debrief.

  ---

  ### 6. Payoff Scheme

  *   **Currency:** Poker chips or wrapped candies.
  *   **Round 1:** 1 chip per Inferrer for "Consistent Theory" (Facilitator judgment).
  *   **Round 2:** 5 chips per correct path prediction.
  *   **Bonus:** If a team identifies the "Mixed Population" (that some were Constraint and some Preference), they get 10 bonus chips.
  *   **Payout:** Everyone eats the candy. The "winning" is symbolic.

  ---

  ### 7. Facilitator Cheat Sheet (Epistemic Status)

  When discussing the debrief points, keep these distinctions clear:

  1.  **Identifiability (Settled Math):** It is mathematically proven that in a single fixed environment, the reward function is not unique given the policy. (Ng & Russell, 2000).
  2.  **Rationality Assumption (Contested):** The game assumes agents maximize $E[\sum R]$.
      *   *CS Consensus:* It's a necessary approximation for engineering.
      *   *Philosophy Consensus:* Human action is often rule-based, habitual, or socially constituted, not utility maximization.
      *   *Your Stance:* "We use the rational model because it lets us build math, not because we know it's true."
  3.  **Revealed Preference (Economics):** The analogy holds. Varying the grid = Varying prices. Observing choice = Observing demand.

  ---

  \answer{You cannot infer the 'why' from the 'what' without changing the 'where'.}
