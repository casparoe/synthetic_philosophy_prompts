answer: |-
  You're right to be frustrated. Most introductions to judgment aggregation treat the discursive dilemma like a logical parlor trick, focusing on impossibility theorems that tell you what you *can't* do, rather than a functional spec for what a group *must* do to actually reason together. When you move from toy logic puzzles to real committees—where expertise is uneven, premises are tangled, and people play games—the standard axioms (Anonymity, Independence, Systematicity) stop being neutral requirements and start looking like ideological baggage.

  Here is the committed stance: A viable theory of group judgment must prioritize **Epistemic Reliability** and **Collective Rationality** over **Procedural Equality**. If the goal is for the committee to "think," then the aggregation mechanism must track truth and maintain consistency, even if that means treating voters differently or voting on packages rather than propositions.

  Here is the conceptual map for a real-world Judgment Aggregation spec.

  ### The Non-Negotiables (Required)

  **1. Collective Rationality (Consistency)**
  *   **The Requirement:** The group's output set of judgments must be logically consistent. The group cannot accept $P$, accept $P \rightarrow Q$, and reject $Q$.
  *   **Motivating Case:** A group that outputs contradictions cannot act. If a board decides "We must cut costs" and "We must not cut staff" and "Staff costs are 90% of expenses," they are paralyzed. Consistency is the price of agency.
  *   **Status:** **Non-negotiable.** Without this, aggregation is just noise.

  **2. Competence Sensitivity (Weighted Authority)**
  *   **The Requirement:** The aggregation rule must allow for differential weighting of voters based on the specific proposition being judged.
  *   **Motivating Case:** Your biology/ethics example. If the group is judging "Policy X is permissible," the premise "Policy X causes suffering" is a biological/empirical claim, while "Causing suffering is wrong" is ethical. The biologist should have more weight on the first, the ethicist on the second. Treating them anonymously destroys information.
  *   **Status:** **Non-negotiable for real groups.** Anonymity is a prejudice of political equality that fails in epistemic contexts.

  **3. Global Integrity (Holistic Evaluation)**
  *   **The Requirement:** The rule must evaluate the logical consistency of the *entire package* of judgments, not just proposition-by-proposition.
  *   **Motivating Case:** Cyclic dependencies. If you have $A \rightarrow B$, $B \rightarrow C$, and $C \rightarrow \neg A$, voting on each separately by majority will almost certainly produce a cycle. You need a mechanism that accepts or rejects sets of propositions based on their global coherence.
  *   **Status:** **Non-negotiable.** This is the only way to handle interdependent premises without arbitrarily privileging one as "primary."

  ### The Prejudices (Drop These)

  **1. Proposition-wise Independence**
  *   **The Prejudice:** The idea that the group's judgment on proposition $P$ should depend *only* on individual judgments on $P$, ignoring their views on $Q$ or $R$.
  *   **Why Drop It:** This is the assumption that kills real reasoning. It forces the group to ignore the logical connections between issues during the voting phase. Real thinking is holistic; you adjust your view on $P$ because you realize it conflicts with $Q$. The aggregation rule must allow this trade-off.
  *   **Cost:** It makes the voting process less transparent (you can't just look at the vote count on one issue to know the outcome).

  **2. Anonymity (One Person, One Vote)**
  *   **The Prejudice:** Every voter counts equally on every proposition.
  *   **Why Drop It:** As noted in Competence Sensitivity, this ignores distributed knowledge. In a specialized committee, equality of voice is not equality of expertise.
  *   **Cost:** It feels undemocratic. It requires a prior agreement on who is expert on what, which can be politically contentious.

  **3. Full Strategy-Proofness**
  *   **The Prejudice:** The belief that you can design a rule where no voter ever benefits from lying about their judgments.
  *   **Why Drop It:** It's mathematically impossible in this context (analogous to Gibbard-Satterthwaite). If you demand this, you end up with a dictatorship.
  *   **Cost:** You have to accept some vulnerability to manipulation and mitigate it through transparency or complexity rather than eliminating it.

  ### The Killer Constraint

  If you want to know which single requirement knocks out the most popular rules (premise-based, conclusion-based, and standard majority voting), it is **Proposition-wise Independence** combined with **Collective Rationality**.

  *   **Premise-based procedures** (vote on premises, derive conclusion) satisfy Rationality but violate Independence on the conclusion (the conclusion is determined by the premises, not direct votes).
  *   **Conclusion-based procedures** (vote on conclusion, ignore premises) satisfy Independence on the conclusion but often violate Rationality (the supporting premises might be rejected by majority).
  *   **Standard Majority Voting** on all propositions satisfies Independence but violates Rationality (the discursive dilemma).

  To get a working system, you must sacrifice Independence. You have to allow the outcome on $Q$ to depend on how people voted on $P$, because $P$ supports $Q$. This moves the theory from "voting" to "constraint satisfaction."

  ### Handling the Specific Complexities

  **1. Cyclic Dependencies (3+ Propositions)**
  Standard aggregation assumes a simple agenda (no logical loops). Real reasoning has loops.
  *   **The Spec:** Use a **Distance-Based Aggregation** approach. Instead of voting on each proposition, each voter submits a *consistent* set of judgments (a "ballot package"). The group outcome is the consistent set that minimizes the "distance" (disagreement) from all individual ballots.
  *   **Why it works:** It forces every voter to submit a coherent worldview. The aggregation then finds the "central" coherent worldview. This resolves cycles because the output is mathematically constrained to be consistent, even if the input votes were split across different consistent clusters.

  **2. Asymmetric Expertise**
  *   **The Spec:** Implement **Issue-Dependent Weighting**. Each voter has a weight vector $w_i = (w_{i,bio}, w_{i,ethics}, ...)$. When calculating the "distance" between ballots, disagreements on biological premises are penalized more heavily if the disagreeing voter has low bio-weight.
  *   **Why it works:** It respects the division of cognitive labor without silencing non-experts. The ethicist can still vote on the biology, but their vote counts less toward the final biological judgment.

  **3. Belief vs. Justification**
  *   **The Spec:** The output must be a **Reasoned Verdict**, not just a binary decision. The aggregation rule should output the accepted conclusion *and* the minimal set of premises required to support it under the group's logic.
  *   **Why it works:** This preserves the distinction you asked for. "The group believes Q" is the verdict. "The group is justified in believing Q" is true only if the supporting premises also pass the threshold. If the group accepts Q but rejects the premises supporting it, the system flags this as an **Unjustified Acceptance**, signaling a need for deliberation rather than action.

  **4. Strategic Misreporting**
  *   **The Spec:** Acknowledge vulnerability but increase the **Cost of Manipulation**. Since we dropped Independence, manipulating the outcome requires knowing not just how others will vote on one issue, but how their votes interact across the whole logical structure.
  *   **Why it works:** In complex agendas with holistic aggregation, calculating the optimal lie is computationally hard for the voters. Additionally, requiring voters to submit *consistent* ballots (rather than voting issue-by-issue) exposes inconsistencies in their own positions, making strategic lying riskier to their reputation.

  ### The Bottom Line

  If you want a committee to actually "think," you have to stop treating them like a bag of ballots and start treating them like a distributed neural network. The non-negotiable spec is: **Consistent Output + Competence Weighting + Holistic Aggregation.**

  This kills the dream of simple majority rule on every issue. It requires voters to submit coherent packages of judgment rather than isolated opinions. It requires the group to agree on weights for expertise before voting begins. It accepts that some strategic manipulation is inevitable but makes it too hard to be worth the effort.

  Most popular rules fail because they try to preserve **Independence**—the idea that issues can be decided in isolation. That is the fantasy. Real thinking is interconnected, and a theory of group judgment that doesn't model those connections is just counting hands, not measuring minds.
