answer: |-
  **Project Title:** The Metric Gap: Deflationism and Gradational Accuracy

  **Project Summary**
  This project produces a 35,000-word monograph addressing a structural limitation in deflationary theories of truth. Deflationists typically defend their view using an *inheritance strategy*: normative facts about truth (e.g., one ought to assert only what is true) are derived from norms governing sentences combined with the equivalence schema (*'p' is true iff p*). While this strategy handles *categorical* norms (assert or do not assert), it fails to account for *gradational* norms (map $A$ is closer to the truth than map $B$). The equivalence schema pairs truth with a proposition wholesale; it offers no metric to order propositions that fail to be true. This project asks whether deflationism can bridge this "metric gap" without collapsing into substantivism or eliminating gradational talk entirely.

  **1. The Research Question**
  Rather than asking "Is deflationism true?", this project tests three component theses often associated with the view against the phenomenon of gradational accuracy:
  *   **The No-Nature Thesis:** Truth is not a substantive property.
  *   **The No-Explanation Thesis:** Truth explains no normative facts; it merely inherits them from embedded content.
  *   **The Schema-Exhaustion Thesis:** The logical behavior of the truth predicate is exhausted by the equivalence schema (or introduction/elimination rules).

  The central question is: *Do facts about comparative accuracy (verisimilitude) violate the No-Explanation or Schema-Exhaustion theses?* If a cartographer chooses a map with small errors over one with large errors, they are ranking falsehoods. Since the schema treats all falsehoods equally (as not-true), can the deflationist explain this ranking without positing a substantive property of "closeness"?

  **2. Why the Question Remains Open**
  The existing dialectic is stalled because both critics and defenders focus on categorical cases. Critics attack deflationism using the norm of assertion or the aim of belief; defenders reply with inheritance derivations. This creates a loop where the deflationist always wins on categorical grounds. Meanwhile, the literature on verisimilitude and approximate truth in science (e.g., model idealization) proceeds independently, assuming a substantive notion of truth is required to compare models. The two debates talk past one another. No one has systematically tested whether the inheritance strategy breaks when the norm shifts from "assert $p$" to "prefer $p$ over $q$."

  **3. Method and Structure**
  I will not approach this through the Liar paradox or non-classical logic, as logical consistency does not guarantee normative applicability. Nor will I focus on the expressive utility of the truth predicate (e.g., generalizing over infinite conjunctions), as this ignores the evaluative role of truth in inquiry. Instead, I will analyze the *normative practices* of inquiry where truth is weighed.

  **Chapter Plan:**
  1.  **The Inheritance Strategy:** Reconstruct the deflationist defense of categorical norms (assertion, belief) to establish the baseline.
  2.  **The Metric Gap:** Introduce gradational cases. A forecaster assigning probabilities; a biologist using an idealized model; a jury weighing partial verdicts. Show why the schema cannot transmit norms here.
  3.  **Option A: Division of Labour:** Argue that truth is deflationary but verisimilitude is substantive. Address the cost: why should the discontinuity fall exactly here?
  4.  **Option B: Construction or Elimination:** Test if closeness can be built from deflationary materials (e.g., logical distance) or if gradational talk is merely instrumental (predictive success).
  5.  **The Moral:** Determine if deflationism must be reconstrued as a claim about the *function* of the predicate rather than the property, or if the view is refuted.

  **Work Plan:**
  *   **Months 1–3:** Detailed analysis of the inheritance strategy and formulation of the "metric gap" argument.
  *   **Months 4–9:** Drafting the five chapters. I expect to get stuck in Chapter 4, determining whether a deflationary construction of accuracy is trivial or impossible.
  *   **Months 10–12:** Revision and polishing for the target series.

  **4. Possible Conclusions**
  The project will argue for one of four outcomes:
  *   **Division of Labour:** Truth is thin; truthlikeness is a separate, substantive posit.
  *   **Eliminationism:** Gradational talk is merely instrumental (about predictive success), costing epistemology a realist grounding.
  *   **Constructionism:** Closeness-to-truth can be built from deflationarily admissible materials (requiring a new definition of admissibility).
  *   **Functional Reconstrual:** Deflationism is correct only as a thesis about the truth *predicate's* role, not the concept, requiring a restatement of the view.

  **5. Failure Conditions and Scope**
  A primary risk is that the Constructionist option proves trivially available (e.g., if logical distance counts as deflationary). However, this is a discoverable result, not a project failure; it would define the boundary of deflationary admissibility. A second risk is that the dispute dissolves into verbal definitions of "deflationism." To prevent this, I will treat the three component theses (No-Nature, No-Explanation, Schema-Exhaustion) as fixed targets. If the project shows that one must be dropped to accommodate accuracy facts, the work succeeds even if the label "deflationism" is contested.

  Thirty-five thousand words is the correct scope. A full treatment of verisimilitude would require a book; a journal article is too small to dissect the inheritance strategy and propose a reconstruction. This length allows for a single, sustained argument that moves from the stalemate of the categorical debate to a resolution of the gradational case.
