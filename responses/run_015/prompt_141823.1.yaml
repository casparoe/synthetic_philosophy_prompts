      *   *Also, Step (1) needs refinement.* "Nothing that has already happened can be a reason." This is too strong. Past events are *evidence* about the future. But past *costs* that cannot be recovered are not reasons.
      *   *Let's stick to the cleanest break:* Reject Step (9). It presents a false dilemma. We can distinguish between "Past Costs" (irrelevant) and "Past Commitments" (relevant because of future reputation).

      *   *Wait, looking closer at the Friend's Step (3):* "Stopping now loses my standing bid for certain, while one more dollar risks only a single additional dollar against the chance of turning that loss into a win of the $20."
      *   *Critique of Step (3):* This assumes the auction ends if I bid. It doesn't. The opponent can bid again. The "chance of turning that loss into a win" is near zero if the opponent is rational. So Step (3) is factually incorrect about the *future consequences*. It miscalculates the future.
