      *   However, the deeper philosophical error is in Step (7) and (9). Step (7) assumes that the *only* reason to keep a promise is the past act of promising. But the reason to keep a promise is usually *future* consequences (reputation, trust, avoiding punishment).
      *   Therefore, rejecting Step (1) in its *strongest* form is necessary, but rejecting Step (9) is the key to saving the sunk-cost fallacy.
