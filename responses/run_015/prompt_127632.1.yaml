answer: |-
  The pattern you describe is not the application of a single moral theory, but rather the operation of a **pluralistic governance system** that compartmentalises harm based on *context* (public vs. private), *timing* (ex ante vs. ex post), and *severity* (rights vs. interests).

  To answer your request, I will reconstruct the implicit theory of harm that best explains this patchwork, distinguish what that theory necessitates from what it merely tolerates, and then model the concrete consequences of adopting the two rival philosophical views you are debating.

  ### I. The Reconstructed Theory: Tiered Regulatory Pluralism

  The law does not presuppose a monistic view of harm (e.g., "all harm is utility loss"). Instead, it operates on a **Tiered Regulatory Pluralism**. This theory divides moral claims into three distinct zones, each with its own arithmetic.

  **1. The Lexical Zone (Rights and Dignity)**
  *   **Domain:** Human rights, torture, inhuman treatment, fundamental liberties.
  *   **Arithmetic:** **Non-aggregative and Lexical.** A violation here cannot be traded off against any quantity of benefit or smaller harm in the other zones.
  *   **Threshold:** Defined by qualitative status, not quantitative severity. Once an act crosses the threshold into "torture" or "degrading treatment," the calculus stops.
  *   **Presupposition:** Persons are ends in themselves. Certain boundaries are inviolable regardless of consequences.

  **2. The Administrative Zone (Risk and Systemic Wrong)**
  *   **Domain:** Health & Safety, Data Protection, Environmental Regulation, Consumer Standards.
  *   **Arithmetic:** **Aggregative and Probabilistic.** This is where your "dust specks" are added up.
  *   **Thresholds:** These are not moral discoveries but **policy thresholds**. The "one in a million" broadly acceptable level is not where harm ceases to exist; it is where the cost of administration exceeds the social benefit of reduction.
  *   **Risk as Harm:** In this zone, risk *is* harm. A "Statistical Life" is a valid unit of account. The law treats a 1% chance of death to 100 people as morally equivalent to 1 death for the purpose of setting safety standards.
  *   **Presupposition:** The state's duty is to maximise social welfare within constraints. Small harms, when systemic, constitute a public wrong distinct from the sum of private grievances.

  **3. The Judicial Zone (Corrective Justice)**
  *   **Domain:** Tort law, Criminal sentencing (for interpersonal violence), Individual compensation.
  *   **Arithmetic:** **Individualised and Retrospective.**
  *   **Threshold:** The *de minimis* rule ("the law does not concern itself with trifles").
  *   **Risk as Harm:** Risk is *not* harm. Without "damage" (physical injury, financial loss, recognised psychiatric illness), there is no claim. Symptomless exposure is not actionable.
  *   **Presupposition:** Courts exist to resolve discrete disputes between parties, not to optimise social policy. Aggregation across persons is procedurally difficult and risks over-deterrence.

  ### II. Analysis of the Pattern

  Here is how this theory maps onto your specific questions about the practice.

  **1. Where do the thresholds come from?**
  They do not track a natural property of the harms themselves. They track **justiciability and administrative cost**.
  *   The *de minimis* threshold in tort exists because the cost of litigating a £5 loss exceeds the loss.
  *   The "broadly acceptable" risk threshold in regulation exists because reducing risk to zero is impossible; the threshold is where marginal cost exceeds marginal benefit.
  *   **Theory Requirement:** The theory *requires* that thresholds be movable based on resource constraints. It *rules out* the idea that thresholds are fixed moral facts.

  **2. Adding up: Within a life vs. Across lives.**
  The practice treats these differently.
  *   **Within a life:** The law readily aggregates. If I prick you with a needle 1,000 times, your damages are higher than if I prick you once.
  *   **Across lives:** The law is hesitant in the Judicial Zone (tort) but enthusiastic in the Administrative Zone (regulation).
  *   **Theory Requirement:** The theory *requires* that aggregation across lives be handled by the state (regulation), not by private litigants. Private law is for bilateral correction; public law is for aggregate welfare.

  **3. Does risk count as harm?**
  *   **Ex Ante (Regulation):** Yes. We spend money to reduce statistical risks.
  *   **Ex Post (Tort):** No. You cannot sue for "having been at risk" unless you contract the illness.
  *   **Theory Requirement:** This distinction is essential to the system. If risk were actionable damage in tort, the courts would be overwhelmed by claims from everyone exposed to any danger. The theory *requires* this bifurcation to prevent systemic collapse.

  **4. How does the Lexical Ban coexist with Arithmetic?**
  By **compartmentalisation**. The arithmetic applies only to "interests" (safety, money, convenience). The lexical ban applies to "rights" (dignity, bodily integrity at a certain threshold).
  *   **Tension:** The practice struggles when a case sits on the boundary (e.g., is prolonged sleep deprivation torture or just a health and safety risk?).
  *   **Theory Requirement:** The theory *requires* a qualitative distinction between types of goods, not just a quantitative one.

  ### III. Addressing Your Friend's Moves

  **Move 1: Fines are tariffs/deterrence, not aggregation.**
  *   **Verdict:** Partially correct, but incomplete.
  *   **Analysis:** In Data Protection (GDPR), fines are indeed turnover-based to ensure deterrence regardless of profit. However, in Health & Safety, the "Value of a Statistical Life" (VSL) used in cost-benefit analyses *is* an aggregation of small risks. If it were pure deterrence, we would not calculate the "expected number of deaths." We would simply set a penalty high enough to hurt. The use of VSL proves the state *does* believe the specks add up for policy purposes, even if they don't for compensation purposes.

  **Move 2: The Postbag Case (The law can't make up its mind).**
  *   **Verdict:** Incorrect. The law *has* made up its mind.
  *   **Analysis:** The law treats the Postbag Case as a **Public Wrong**, not a Private Aggregate.
      *   If specks aggregated privately, every householder would get substantial damages. They don't.
      *   If specks didn't count at all, the regulator wouldn't fine. They do.
      *   **Resolution:** The harm is to the *system of trust* or the *constitutional right to privacy*, not to the individual's utility. The fine punishes the violation of the public norm. This fits the Tiered Pluralism model perfectly: it belongs in the Administrative Zone, not the Judicial Zone.

  ### IV. Concrete Consequences of Adopting Rival Theories

  If we were to abandon the current pluralistic patchwork and adopt one of the philosophical positions wholeheartedly, the following changes would be required.

  #### Scenario A: Full Aggregation (The Utilitarian View)
  *Premise: A million dust specks are worse than one torture, and all harms sum linearly across persons.*

  1.  **Regulation:** Safety standards would become draconian. If every tiny risk aggregates, the "broadly acceptable" band disappears. We would have to spend infinite resources to reduce minute risks to zero, as any non-zero risk multiplied by a large population yields a high expected harm.
  2.  **Civil Litigation:** The *de minimis* rule would vanish. A company overcharging 10 million people by 1p would owe £100,000 in *compensatory damages* to the class, not just a fine to the state. Courts would be flooded with trivial claims.
  3.  **Sentencing:** Concurrent sentencing would be abolished. A man who assaults 100 people would serve 100 consecutive sentences. A fraudster taking £1 from 1,000 people would be treated identically to one taking £1,000 from 1 person (which is current practice), but the assault case would change drastically.
  4.  **Rights:** The absolute ban on torture would likely collapse. If enough dust specks (or minor inconveniences) outweigh torture, a state could justify torturing one person to prevent a million people from having a headache.

  #### Scenario B: Strict Lexical Priority (The Non-Aggregative View)
  *Premise: Some harms (torture, severe rights violations) are lexically prior to any number of smaller harms. Small harms do not aggregate across persons to outweigh severe ones.*

  1.  **Regulation:** The "Value of a Statistical Life" model would be morally illegitimate. You cannot trade off a certain number of statistical deaths against economic cost if life is lexically prior. Safety regulation would have to move to a "feasibility" standard (reduce risk as much as technically possible) rather than a "cost-benefit" standard.
  2.  **Civil Litigation:** The "Postbag Case" would result in **no liability**. If the individual harm is below the threshold of a rights violation, and specks do not aggregate, the mass violation is morally neutral. GDPR-style fines would be unjustified unless a specific individual's rights were severely breached.
  3.  **Sentencing:** The current inconsistency (fraud aggregates, assault does not) would need to resolve towards **non-aggregation**. Assaulting three people would be treated the same as assaulting one, because the second and third assaults add no *new* lexical wrong (assuming the first crossed the threshold).
  4.  **Risk:** Risk would cease to be a harm. Regulation based on probabilistic death would be impossible, as you cannot violate a right probabilistically. You either kill (violation) or you don't (no violation).

  ### V. Summary: What the Practice Rules Out

  The current legal practice **quietly rules out** two pure philosophical positions:

  1.  **Pure Act Utilitarianism:** It forbids this via the absolute ban on torture and human rights. It refuses to sacrifice the individual for the aggregate good at the top end.
  2.  **Strict Libertarian/Non-Aggregation:** It forbids this via Health & Safety regulation and VSL. It acknowledges that the state must prevent mass low-level harms even when no single individual has a claim worth pursuing.

  **The Verdict for Your Argument:**
  Your friend is right that the fines look like tariffs, but wrong that this denies aggregation. The practice presupposes that **aggregation is a tool of governance, not a metric of compensation.**

  *   **Specks aggregate** when the State is setting rules for the future (Regulation).
  *   **Specks do not aggregate** when Individuals are seeking redress for the past (Tort).
  *   **Severe harms never aggregate** when Rights are at stake (Human Rights).

  If you want to go back to her with something better than intuition, argue that the "Torture vs. Dust Specks" dilemma is a **category error** in law. The law does not ask "which is worse?" in the abstract. It asks "which forum is this for?" If it is a safety regulation, the specks win (aggregation applies). If it is a human rights claim, the torture wins (lexical priority applies). The inconsistency you see is not confusion; it is a firewall designed to prevent the logic of the spreadsheet from consuming the logic of the court.
