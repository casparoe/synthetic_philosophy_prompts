  They take the path because it is straight.
  They ban the hurt because it is bad.
  Will obeys mind because mind is clear.
  We dodge the fire because it burns.
  We want peace because it is good.
  What they love and what is good match.
  It is good because we want peace.
  It burns because we dodge the fire.
  Mind is clear because will obeys it.
  It is bad because they ban the hurt.
  It is straight because they take the path.
  It is right because the gods love it.

  Line 7 is the hinge, stating only that the extensions of the two concepts coincide without claiming which determines which. Lines 1–6 argue that value exists independently of the chooser (Horn 1), while lines 8–13 argue that value is created by the choice (Horn 2), using the mirror structure to suggest these might be the same fact viewed from opposite ends rather than a genuine contradiction.
