prompt: |-
  I run the collections and access unit at a national memory institution — a state archive with a public museum attached — and roughly twice a month I have to draft a recommendation on a contested holding for the director to sign. The cases come in four shapes, and I have come to think they are not four shapes of one thing: whether to accept custody of a collection that a community or a family offers us; whether material we already hold should be open, restricted, sealed for a term, or handed back to the people it is about; whether to digitise and publish; and whether to mark something publicly, with an exhibition, a plaque, an annual reading. I have a week per case, two junior archivists to do the legwork, no budget of my own, a legal office that will tell me what the statute requires and nothing about what is right, and a director who signs whatever I put in front of her and will be embarrassed in the press if I get it wrong. What I do not have is any way of knowing whether the answers I have been giving are consistent with one another, and the cases have lately come close enough together that I can see I have been deciding them by mood.

  The two poles of the literature on this I can state and cannot reconcile. On one side, memory is a duty, owed to people who can no longer speak for themselves and owed first of all within thick relations — one's own family, town, nation — so that erasure is a second killing and a tidy archive is a lie told on behalf of the comfortable; on the other, the keeping of grievance is itself a harm, commemoration is nearly always a project of the living dressed up as a debt to the dead, and a society can be better off not carrying its worst material forward, especially where the people named in it, or their children, still live in the same street. I do not want you to settle that dispute. I want a procedure that can be run while it stays unsettled. Two things I have noticed on my own, because they are where my practice actually goes wrong, and the procedure has to accommodate them. First, remembering is three separable acts — retaining, allowing access, and publicly marking — and a decision to seal is not a decision to destroy, and neither is a decision not to commemorate; most of my inconsistency comes from collapsing the three. Second, in a paper archive the live options are not keep-or-destroy but keep-and-index, keep-and-bury, and keep-and-tell-the-people-named; digitisation moves everything from the second to the first, and a document that has been scanned cannot be un-remembered by any later decision, which makes the decision whether to digitise the one with no way back.

  Please write the procedure: the questions in order, what counts as a sufficient answer to each, which answers stop the case with a no, and which questions have to be handed to a person because they turn on values rather than facts — and, where that happens, who that person should be, given my setup. Then run it end to end on three cases and tell me plainly which of my instincts it overrules: a state security file naming dozens of low-level informers whose grandchildren still live in the towns they informed on, which a court is still using as evidence in prosecutions; a government that will pass an amnesty and fund an official history only if we agree to seal the relevant holdings for fifty years; and a family that asks us to destroy their mother's file rather than seal it, on the ground that a sealed file is a monument and destruction is the only mercy. Say where the procedure will misfire — I assume a rule that is right for a settled democracy's archive will be wrong for an institution whose holdings are still being used as evidence, or whose own staff are named in them — and be explicit about which of your steps are judgment dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Head of Collections and Access Unit at a national memory institution (state archive + public museum).
      *   **Task:** Draft a recommendation for the Director on contested holdings (approx. twice a month).
      *   **Problem:** Inconsistency in decision-making ("deciding by mood"), lack of budget, legal office only covers statutes (not ethics), Director signs whatever but fears press embarrassment.
      *   **Core Conflict:** Two irreconcilable poles of literature (Memory as Duty vs. Memory as Harm). The user does *not* want this settled, but needs a procedure to operate *within* the tension.
      *   **User's Insights:**
          1.  Remembering = 3 acts: Retaining, Accessing, Marking. (Don't collapse these).
          2.  Digitization is the point of no return (moves from "bury" to "index").
      *   **Deliverables:**
          1.  A step-by-step procedure (questions, sufficient answers, stop conditions, value-judgment handoffs).
          2.  Application of the procedure to three specific cases (Security files/Grandchildren, Amnesty/Sealing deal, Family/Destruction request).
          3.  Identification of where instincts are overruled.
          4.  Identification of where the procedure misfires (contextual limitations).
          5.  Explicit admission of where judgment is dressed up as procedure.

  2.  **Deconstruct the Procedure Design:**

      *   *Goal:* Consistency without resolving the philosophical conflict.
      *   *Structure:* Needs to follow the user's insight about the "three acts" (Retain, Access, Mark) and the "digitization pivot."
      *   *Constraints:* No budget, 1 week turnaround, 2 junior archivists, Legal = Statute only, Director = Risk-averse.
      *   *Value Judgments:* Since the user can't resolve the Duty vs. Harm conflict, the procedure must identify *who* decides when values clash. Given the setup, the Director bears the political risk, but the User bears the ethical burden. However, for *community* impact, external input is needed.
      *   *Stop Conditions:* Legal statutory bars must be immediate "No"s (or "Yes"s depending on the law). Ethical "No"s need to be clear.

      *   *Drafting the Steps:*
          1.  **Legal/Statutory Check:** (Fact-based, Legal Office). If illegal, stop.
          2.  **The Digitization Gate:** (Critical User Insight). Before anything else, decide on scanning. Once scanned, access changes forever.
          3.  **The Retention Decision:** (Keep vs. Destroy). Address the Family/Destruction case here.
          4.  **The Access Decision:** (Open vs. Restricted vs. Sealed). Address the Amnesty/Security cases here.
          5.  **The Marking Decision:** (Exhibit vs. Silence). Address the "Monument" aspect.
          6.  **Value Handoff:** Who decides the hard ethical calls? The Director signs, but needs cover. Maybe a small advisory panel or a specific "Community Impact" assessment done by juniors.

      *   *Refining the "Who":* The user has 2 juniors. They can do legwork. The Director signs. The User writes. The Legal Office advises on law. Who advises on *ethics*? The procedure needs to force the User to articulate the value conflict so the Director owns it. But for community harm, the procedure should require *consultation* if possible, or at least a structured impact assessment. Let's make the "Value Handoff" explicit: If the decision turns on "Harm vs. Duty," the recommendation must present both sides clearly for the Director to sign off on the *risk*, but the User must recommend based on a weighted matrix. Actually, the prompt asks "who that person should be." Given the constraints, it can't be a new committee. It has to be the Director (accountability) but informed by the Juniors (fact-finding on living descendants).

  3.  **Developing the Three Cases:**

      *   *Case 1: Security Files (Informers + Grandchildren + Court Evidence).*
          *   Retain? Yes (Court evidence).
          *   Digitize? No (Risk of leak/permanence).
          *   Access? Restricted (Court only, not public).
          *   Mark? No.
          *   *Instinct Overruled:* Might want to expose truth (Duty), but procedure prioritizes living harm + legal utility.
      *   *Case 2: Amnesty Deal (Seal for 50 years).*
          *   Retain? Yes.
          *   Digitize? No (Sealed).
          *   Access? Sealed (Per deal).
          *   Mark? No.
          *   *Instinct Overruled:* Might want to reject political interference (Archive Independence), but procedure accepts legal/political reality if retention is secured.
      *   *Case 3: Family Request (Destroy vs. Seal).*
          *   Retain? (The conflict). Family says destroy. Archive says seal.
          *   Procedure needs to weigh "Mercy" vs. "Historical Record."
          *   *Instinct Overruled:* Might want to be merciful (Destroy), but procedure likely defaults to Retain/Seal because destruction is irreversible.

  4.  **Identifying Misfires and "Judgment as Procedure":**

      *   *Misfires:* Active conflict zones (staff named), unstable regimes (law changes), oral histories (cannot be "sealed" easily).
      *   *Judgment as Procedure:* The weighting of "Harm." Defining "Living Descendants." Deciding when "Public Interest" outweighs "Privacy."

  5.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, sober, acknowledging the gravity. No fluff.
      *   *Structure:*
          1.  The Procedure (The "Machine").
          2.  The Application (The "Test").
          3.  The Limitations (The "Confession").

      *   *Refining the Procedure Steps:*
          *   Step 1: Legal Floor. (Legal Office).
          *   Step 2: The Digital Threshold. (User + Director). *Crucial.*
          *   Step 3: The Harm Assessment. (Juniors). *Who is alive? Who is hurt?*
          *   Step 4: The Retention/Access/Marking Matrix. (User).
          *   Step 5: The Value Sign-off. (Director).

      *   *Refining the "Value Handoff":* The prompt asks "who that person should be." Since the Director signs and takes the press heat, the Director must own the value call *if* it contradicts the User's ethical leaning. However, the User needs to frame it. Let's designate the Director as the final value arbiter, but *only* after a "Community Impact Statement" is generated by the Juniors.

      *   *Refining the Cases:*
          *   *Security Files:* Procedure says Keep, Don't Digitize, Restrict Access. Overrules instinct to "Expose."
          *   *Amnesty:* Procedure says Keep, Seal. Overrules instinct to "Resist Censorship."
          *   *Family:* Procedure says Keep, Seal, Don't Destroy. Overrules instinct to "Grant Mercy."

      *   *Refining the "Judgment dressed as Procedure":* I need to be honest. The definition of "Harm" is subjective. The weighting of "Public Interest" is subjective. I will highlight these.

  6.  **Final Review against Constraints:**
      *   Did I reconcile the poles? No (explicitly avoided).
      *   Did I separate Retain/Access/Mark? Yes.
      *   Did I handle Digitization as the point of no return? Yes.
      *   Did I address the 3 cases? Yes.
      *   Did I identify misfires? Yes.
      *   Did I identify judgment masquerading as rules? Yes.

  7.  **Writing the Response:** (Focusing on clarity, authority, and the specific constraints of the user's role). *Self-Correction during drafting:* Make sure I don't give the Director *too* much work. The User drafts the recommendation. The procedure must help the User draft it consistently. The "Handoff" is about who makes the call when the procedure yields a tie or a high-risk ethical dilemma. That's the Director.

      *   *Key Insight to embed:* The procedure isn't about finding the "Truth." It's about managing "Risk" and "Irreversibility."

      *(Self-Correction on Case 2)*: If the government funds the history *only* if sealed, is that a retention issue? Yes. If we say no, we might lose the collection entirely. The procedure must prioritize Retention over Access in this specific trade-off to prevent total loss.

      *(Self-Correction on Case 3)*: Destruction is the ultimate "Access Denial." But it fails the "Duty to Memory" pole. The procedure must treat Destruction as a last resort, requiring a higher bar than Sealing.

      *(Final Polish)*: Ensure the distinction between "Fact Questions" and "Value Questions" is sharp.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your constraints. It does not solve the philosophical conflict between Memory as Duty and Memory as Harm. Instead, it treats that conflict as a risk factor to be managed. It prioritizes *irreversibility* over *correctness*, forcing you to separate the three acts of remembering (Retain, Access, Mark) and treating digitization as the critical pivot point.

  ### The Procedure: The "Three-Act, One-Way" Protocol

  **Pre-Condition:** Before any ethical assessment, the Legal Office must confirm the statutory baseline. If the law mandates destruction, the case closes. If the law mandates openness, the case closes. This procedure applies only to the *discretionary space* between statutory minimums and maximums.

  #### Step 1: The Digital Threshold (The Point of No Return)
  **Question:** Does this case require digitization to fulfill a statutory mandate or immediate preservation need (e.g., acid decay)?
  *   **Sufficient Answer:** Yes/No based on physical state or court order.
  *   **Stop Condition:** If **No**, digitization is prohibited until Step 4 is complete.
  *   **Value Handoff:** If **Yes** (preservation vs. privacy), the **Director** must sign a specific "Digital Risk Acknowledgement."
  *   **Rationale:** As you noted, scanning moves material from "bury" to "index." This decision cannot be made while emotional momentum is high. It must be the first gate.

  #### Step 2: The Harm Assessment (Fact-Finding)
  **Task:** Junior Archivists produce a "Living Impact Statement."
  **Questions:**
  1.  Are there living persons directly named or implicated?
  2.  Are there living descendants (2 generations) in the same geographic/political context?
  3.  Is there evidence of active threat (harassment, legal jeopardy, physical safety) linked to this material *right now*?
  *   **Sufficient Answer:** A factual list of names, locations, and status (Alive/Deceased/Unknown). No speculation on feelings.
  *   **Value Handoff:** If active threat is confirmed, the **Director** decides whether institutional safety overrides public access.

  #### Step 3: The Retention Decision (Keep vs. Destroy)
  **Question:** Does the value of the record as evidence (legal or historical) outweigh the request for destruction?
  *   **Sufficient Answer:** A statement of evidentiary value.
  *   **Stop Condition:** If the material has *no* evidentiary value and *no* research value, and a donor requires destruction for custody, **Destroy**.
  *   **Value Handoff:** If the material has evidentiary value but a family requests destruction for mercy: **Retain.** (The procedure defaults to retention where evidence exists; destruction is the exception).
  *   **Rationale:** Destruction is irreversible. Sealing is reversible.

  #### Step 4: The Access Decision (Open vs. Restricted vs. Sealed)
  **Question:** Who needs to see this, and does seeing it cause the harm identified in Step 2?
  *   **Options:**
      1.  **Public:** No living harm, high public interest.
      2.  **Researcher (On-site):** Living harm possible, requires supervision.
      3.  **Sealed (Term):** Active harm or legal sensitivity.
      4.  **Party-Specific:** Only available to the people named or their legal heirs.
  *   **Sufficient Answer:** A specific access tier with a review date (if sealed).
  *   **Value Handoff:** If the choice is between "Public Interest" and "Living Harm," the **Director** decides. Your recommendation must present the "Harm Score" from Step 2 against the "Public Interest Score" (media likelihood, historical significance).

  #### Step 5: The Marking Decision (Monument vs. Silence)
  **Question:** Does this holding require public acknowledgement (exhibition, plaque) to fulfill the institution's mission?
  *   **Sufficient Answer:** Yes/No based on mission alignment.
  *   **Constraint:** Marking is prohibited if Access is Sealed. (You cannot exhibit what you hide).
  *   **Value Handoff:** **User (You).** This is curatorial, not ethical. However, if marking risks safety (Step 2), it reverts to the Director.

  ---

  ### Application to Your Three Cases

  Here is how the protocol runs end-to-end on your current backlog, and where it will conflict with your instincts.

  #### Case 1: State Security Files (Informers, Grandchildren, Court Evidence)
  *   **Step 1 (Digital):** **No.** Physical state is stable. Court does not require digital copies, only evidence. *Digitization blocked.*
  *   **Step 2 (Harm):** **High.** Grandchildren live in the same towns. Social stigma is active.
  *   **Step 3 (Retention):** **Retain.** Material is active court evidence. Destruction is legally impossible and historically negligent.
  *   **Step 4 (Access):** **Restricted (Court & Specific Researchers).** Cannot be public due to Step 2 Harm. Cannot be sealed entirely due to Court requirement.
  *   **Step 5 (Marking):** **No.** Cannot mark specific informers without violating Access restrictions.
  *   **Instinct Overruled:** Your instinct may be to "expose the truth" (Memory as Duty). The procedure forces you to prioritize the safety of the grandchildren over the public's right to know the names *today*. It accepts that truth is being delayed, not denied.
  *   **Who Decides:** You recommend Restricted Access. Director signs.

  #### Case 2: The Amnesty Deal (Seal for 50 Years to Save Collection)
  *   **Step 1 (Digital):** **No.** Sealing digital copies is technically porous. Keep analog.
  *   **Step 2 (Harm):** **Medium/Political.** The "harm" here is political instability if the deal breaks.
  *   **Step 3 (Retention):** **Retain.** If you refuse the seal, the government keeps or destroys the files. Retention via compromise is better than total loss.
  *   **Step 4 (Access):** **Sealed (50 Years).** This is the condition of custody.
  *   **Step 5 (Marking):** **No.** You cannot exhibit a sealed collection.
  *   **Instinct Overruled:** Your instinct may be to resist censorship (Archive Independence). The procedure forces you to accept that a "tidy archive" (the deal) is better than no archive. It prioritizes *preservation of the record* over *access to the record*.
  *   **Who Decides:** Director. This is a political risk, not just an ethical one.

  #### Case 3: The Family Request (Destroy vs. Seal for Mercy)
  *   **Step 1 (Digital):** **No.**
  *   **Step 2 (Harm):** **High (Psychological).** The family argues the *existence* of the file is the harm.
  *   **Step 3 (Retention):** **Retain.** The file has historical value (it proves the mother existed/was processed). The procedure defaults to Retention unless value is zero. Sealing is the alternative to Destruction, not a lesser evil.
  *   **Step 4 (Access):** **Sealed (Indefinite or 99 Years).** Grant the mercy of privacy without the sin of erasure.
  *   **Step 5 (Marking):** **No.**
  *   **Instinct Overruled:** Your instinct may be "Mercy" (Destruction). The procedure overrules this. It dictates that you cannot destroy evidence to comfort the living, but you can hide it. It forces the family to accept that the state remembers, even if it does not look.
  *   **Who Decides:** You recommend Seal. Director signs.

  ---

  ### Where the Procedure Misfires

  You asked for plain speech on the limitations. This procedure is a machine for a settled democracy. It will break in your specific context for three reasons:

  **1. The "Active Evidence" Problem**
  In Case 1, the archive is not a memory institution; it is a courtroom annex. The procedure assumes "Access" is about research. When access is about *prosecution*, the "Harm Assessment" (Step 2) becomes legally subordinate to the "Retention Decision" (Step 3). If a court orders release, this procedure cannot stop it. You will have to write a recommendation that says "Procedure says Restrict, Law says Open," and let the Director take the heat.
  *   *Misfire:* Step 4 assumes you have discretion. You often do not.

  **2. The "Staff Safety" Problem**
  Your procedure assumes the archivists are neutral observers. In a national archive dealing with recent trauma, your juniors may be the grandchildren of the informers in Case 1. The "Harm Assessment" requires them to investigate their own neighbors or families.
  *   *Misfire:* Step 2. You cannot task juniors with assessing harm to their own community. In these cases, *you* must do the legwork, or hire external contractors, which you have no budget for. This creates a bottleneck.

  **3. The "Digital Leak" Reality**
  Step 1 assumes you can control digitization. In reality, researchers photograph documents with phones. A "Restricted" physical file is often a "Public" digital file within 24 hours of a visitor walking out the door.
  *   *Misfire:* Step 1. The procedure treats digitization as an institutional act. It is now a visitor act. You are regulating yourself, not the information.

  ### Where Judgment is Dressed Up as Procedure

  I owe you explicit transparency on where I have hidden ethical choices inside administrative rules.

  **1. The Default to Retention (Step 3)**
  I wrote: *"If the material has evidentiary value... Retain."*
  *   **The Judgment:** This privileges the State's need for evidence over the Individual's need for oblivion. It resolves your philosophical conflict by siding with "Memory as Duty." I have coded this as a rule to give you consistency, but it is a value choice. If you believe "Mercy" (Case 3) is higher than "Record," this step is wrong.

  **2. The Definition of Harm (Step 2)**
  I wrote: *"Active threat... linked to this material right now."*
  *   **The Judgment:** This excludes structural harm. If releasing a file doesn't get someone beaten up but reinforces a racist stereotype that limits their job prospects, the procedure counts that as "No Harm." It defines harm as physical/legal, not sociological. This protects the archive from having to solve society's problems, but it blinds the archive to its role in perpetuating them.

  **3. The Director as Value Arbiter**
  I assigned the "Value Handoffs" to the Director.
  *   **The Judgment:** This is bureaucratic self-preservation. It ensures the person who fears the press (Director) makes the call that generates the press. It protects *you*, but it may not produce the *right* answer. The Director is risk-averse; they will likely choose "Seal" every time there is a doubt. The procedure institutionalizes caution.

  ### Summary of Recommendation
  Use this protocol to separate the three acts. It will stop you from collapsing "Sealing" into "Destroying." It will stop you from digitizing things you should have buried. It will not save you from the press, and it will not resolve the tension between Duty and Harm. But it will ensure that when you are inconsistent, it is because the cases are different, not because your mood has changed.

  When the procedure misfires (specifically on Court Orders and Staff Safety), do not force the case through the machine. Write a separate memo titled "Procedural Exception," state why the machine failed, and make the value judgment explicitly in the text. That is the only place where your expertise overrides the rule.
