answer: |-
  Dear Colleague,

  Here is a design for a seventy-five-minute workshop simulation that allows your twenty-four adult participants to experience the mechanical differences between first-past-the-post and proportional representation systems using a fixed fictional electorate. To begin preparing the materials, you will need to create twenty-four preference cards that assign each participant a sincere party preference and a district number, ensuring the distribution matches the specific electorate profile required for the lesson. You should prepare six district signs to mark areas of the room, along with simple paper ballots for each round, a flipchart to record vote totals and seat allocations, and a coin to resolve any ties that arise during the counting process. The simulation hinges on a nonmonetary stake to give the outcomes meaning, so you should announce at the very start that the party or coalition controlling the majority of seats at the end of the exercise will decide how the final ten minutes of the workshop are used, such as choosing between an early break or an extended question-and-answer session.

  Once the participants arrive, hand out the preference cards secretly so that each person knows their own district and party preference but does not initially know the full distribution of preferences across the room. The first district should contain three voters who prefer Harbor and one who prefers Meadow, while the second district contains three who prefer Harbor and one who prefers Ridge. In the third district, assign one voter to Harbor, two to Meadow, and one to Ridge, and replicate this exact pattern in the fourth district with one for Harbor, two for Meadow, and one for Ridge. The fifth district should consist of one voter for Harbor, one for Meadow, and two for Ridge, and the sixth district should match the third and fourth with one for Harbor, two for Meadow, and one for Ridge. Ask the participants to move to their assigned district areas and explain that for the first round, they will vote sincerely for their assigned party under first-past-the-post rules where the party with the most votes in the district wins one seat. After collecting the ballots, count the votes district by district and announce the results aloud, noting that in the first district Harbor wins with three votes against one for Meadow, and in the second district Harbor wins with three votes against one for Ridge. In the third district Meadow wins with two votes against one for Harbor and one for Ridge, and the same outcome occurs in the fourth district where Meadow secures two votes. In the fifth district Ridge wins with two votes against one for Harbor and one for Meadow, and in the sixth district Meadow wins again with two votes. Tally the total seats on the flipchart to show that Harbor has won two seats, Meadow has won three seats, and Ridge has won one seat. Then reveal the total popular vote count by summing the individual ballots, showing that Harbor received ten votes, Meadow received eight votes, and Ridge received six votes. This moment highlights the first central puzzle, as Harbor won the most popular votes but lost the seat count to Meadow due to the geographic concentration of Harbor supporters in the first two districts where their extra votes were wasted.

  For the second round, keep the participants in their districts and the rules the same, but allow them five minutes to discuss strategy before voting again. Explain that they may vote for any party regardless of their assigned preference if they wish to influence the outcome, which introduces the pressure to vote insincerely. You will likely observe that voters for Ridge in the third, fourth, and sixth districts realize their party cannot win those seats and may feel pressured to switch their vote to Meadow to prevent a Harbor win, or Harbor voters in those same districts might switch to Meadow to block Ridge. After voting and counting, discuss whether the seat allocation changed and how it felt for participants to abandon their sincere preference, emphasizing how the system punishes smaller parties whose support is spread too thinly to win a plurality in any single district. Transition to the third round by rearranging the room into a single national constituency and explaining that all twenty-four votes will now be pooled to award six seats using proportional representation with the largest remainder method. Collect all ballots again, ensuring participants vote sincerely once more since the pressure to strategize against geography is removed, and calculate the results on the flipchart by establishing a quota of four votes per seat. Explain that Harbor received ten votes which grants them two whole seats with a remainder of two, and Meadow received eight votes which grants them two whole seats with a remainder of zero, while Ridge received six votes which grants them one whole seat with a remainder of two. Since only five seats have been allocated so far, the sixth seat must go to the party with the largest fractional remainder, but because Harbor and Ridge are tied with remainders of two, use the coin toss to award the final seat to one of them. Regardless of the coin toss outcome, no single party holds the four seats needed for a majority, which forces the parties to negotiate a coalition to claim the stake regarding the final ten minutes of the workshop.

  Facilitate a brief coalition bargaining session where party representatives must agree on how to use the final time, illustrating that while proportionality removed the pressure to abandon their first choice, it replaced single-party victory with a need to bargain where voting weight and bargaining power diverge. In the closing discussion, connect these specific moments to the broader contrasts between the systems by asking participants how it felt to see their preferred party lose seats despite having the most votes in the first round and how the coalition negotiation changed the value of their vote compared to the district-based rounds. You should anticipate that certain difficulties may arise on a first run, such as confusion about strategic options where participants do not understand why they would vote for a party they do not like, which you should handle by reminding them that the goal is to influence the final stake rather than express identity. Some participants may show reluctance to vote insincerely due to a personal commitment to honesty, and you should handle this by framing the simulation as a game where the rules incentivize different behaviors rather than a test of character. Disputes over ties and coalition offers may also occur if parties feel the coin toss is unfair or if coalition partners disagree on the stake, so you should handle this by enforcing the tie-break rule decisively and limiting negotiation time to ensure the workshop stays on schedule. Finally, you must provide a candid account of one important feature of real elections that this small-room exercise cannot reproduce, which is the role of long-term party organization and voter identity formation. In the simulation, preferences are assigned randomly for an hour, but in reality, parties build loyalty over years and voters develop stable identities that resist short-term strategic manipulation, meaning the volatility seen in the strategic voting round is often dampened in real-world elections where party brands carry significant weight beyond immediate mechanical incentives. I hope this design serves your workshop well and sparks a lively debate among your participants.

  Sincerely,

  Your Colleague
