      *   *BNA + Testimony:* The scientist believes. So BNA is satisfied. But why do we feel uneasy? Because belief can be irrational or Gettierized.
      *   *TNA + Testimony:* If the compound is actually non-toxic, TNA is satisfied. But this ignores the *warrant*.
