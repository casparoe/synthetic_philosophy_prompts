      *   **The Belief Norm (BNA):** "One must: assert $p$ only if one believes $p$." (Often seen as too weak).
      *   **The Truth Norm (TNA):** "One must: assert $p$ only if $p$ is true." (Often seen as externalist/too weak regarding justification).
      *   **The Problem of Testimony:** How does knowledge transfer? (Reductionism vs. Anti-Reductionism). If I know via testimony, do I *know*?
      *   **The "Assertoric Echo":** This is essentially the problem of *second-hand knowledge* or *testimonial knowledge* applied to assertion norms.

  3.  **Brainstorming the Interaction with Testimony:**
