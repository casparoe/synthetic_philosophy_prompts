answer: |-
  ### The Verdict on "Cheap Coherence"

  **Verdict:** Your intuition identifies a genuine open problem, but your friend is right that it risks collapsing into existing taxonomy *unless* you formalize it differently.

  **The Diagnosis:**
  The standard literature (Chalmers, Yabloff, Kung) distinguishes between *prima facie* conceivability (seems possible on first blush) and *ideal* conceivability (survives unlimited rational reflection). Your friend sees your "cheap coherence" as merely the gap between these two.

  However, they are treating that gap as **phenomenological** or **rationalist** (a matter of "thinking harder"). You are treating it as **computational** or **proof-theoretic** (a matter of search costs, undecidability, and negative evidence).

  *   **Where it collapses:** If you argue merely that "people are lazy and don't check for contradictions enough," you are reinventing the *prima facie* vs. *ideal* distinction. That is taxonomy.
  *   **Where it opens up:** If you argue that "global consistency is often undecidable for the descriptions we use, so 'ideal conceivability' is not a limit we can approach but a status we cannot verify," you are moving into the epistemology of **negative conceivability** (failure to derive a contradiction) versus **positive conceivability** (constructing a model). This is where your formal background gives you a comparative advantage that pure metaphysicians lack.

  **Recommendation:** Drop the term "cheap coherence." It sounds dismissive of the phenomenology. Adopt the terminology of **Negative Conceivability as Proof Failure**. Frame the problem not as "people aren't trying hard enough," but as "the epistemic access to modal space is structurally bounded by proof complexity."

  ---

  ### The Research Agenda: Three Questions, Ordered

  For a three-year doctorate, you need a core that is tractable enough to finish but sharp enough to force the field to respond. I recommend the following ordering, defended by upstream/downstream dependencies and your specific skill set.

  #### 1. The Upstream Question: Formalizing the Search Procedure
  **Question:** *Can we model "conceivability" not as a mental state but as the output of a bounded consistency-checking procedure over a formal language?*

  *   **Why First (Upstream):** You cannot evaluate the reliability of conceivability as a guide to possibility (the traditional goal) until you define what "conceivability" *is* in your framework. The standard literature defines it via idealization (what an ideal agent would do). You should define it via **operation** (what a specific search heuristic returns).
  *   **Tractability (High):** This leverages your modal logic and model theory background. You can construct formal models where "conceivability" = "consistency relative to a specific proof system $S$ within $n$ steps." You can show formally that for rich descriptions (e.g., involving arithmetic or complex interaction laws), the gap between "no contradiction found" and "consistent" is not just epistemic but logical (Gödelian/undecidability constraints).
  *   **Payoff:** This prevents the "taxonomy" trap. Instead of categorizing types of conceivability, you are providing a **mechanism**. If you can show that standard philosophical examples (zombies, inverted spectra) rely on descriptions where consistency is undecidable, you force the field to acknowledge that their "ideal conceivability" is epistemically inaccessible.
  *   **Move Up/Down:** Move **up** if you find that standard modal logics used in metaphysics (S5, etc.) are too weak to capture the complexity of the scenarios philosophers actually describe. Move **down** if you get bogged down in technical proof theory without connecting it back to the epistemic claim.

  #### 2. The Midstream Question: The Asymmetry of Negation
  **Question:** *Given the search model from (1), why is "inconceivability" (finding a contradiction) treated as stronger evidence than "conceivability" (failing to find one), and is this principled or an artifact of search bias?*

  *   **Why Second (Midstream):** This depends entirely on the model you build in (1). If conceivability is "failure to find $\bot$," then inconceivability is "success in deriving $\bot$." In classical logic, these are asymmetric (soundness vs. completeness).
  *   **The Blind Spot:** You noted that inconceivability claims are often treated as weaker evidence in practice (because they might just be failures of imagination), yet in theory, a proven contradiction entails impossibility. You need to resolve whether the *sociological* weakness of inconceivability claims is due to the fact that most philosophers are offering *prima facie* inconceivability (failed search) rather than *proven* inconsistency.
  *   **Tractability (Medium):** This requires bridging your formal model with epistemic norms. You don't need new math here; you need to analyze how the *bounds* established in (1) affect the warrant for modal claims.
  *   **Payoff:** This directly addresses the "stagnation" critique. The field has argued about *whether* conceivability entails possibility. You are arguing about the **confidence intervals** of that entailment based on the method of verification. This gives you a metric to evaluate existing arguments (e.g., "This zombie argument fails not because zombies are impossible, but because the consistency check required exceeds reasonable bounds").
  *   **Move Up/Down:** Move **up** if you discover the asymmetry is fundamental to the logic (e.g., intuitionistic vs. classical). Move **down** if it turns out to be merely a pragmatic issue about how philosophers write papers.

  #### 3. The Downstream Question: Resource-Bounded Modal Knowledge
  **Question:** *If ideal conceivability is unverifiable, what kind of modal knowledge is available to bounded agents, and does it suffice for metaphysical work?*

  *   **Why Third (Downstream):** This is the metaphysical payoff. It relies on the results of (1) and (2). If (1) shows consistency is hard to verify, and (2) shows our confidence is asymmetric, (3) asks: "What are we left with?"
  *   **Tractability (Low/Risky):** This is where you risk not finishing. It requires engaging with the broader metaphysical literature (essences, natural kinds, a posteriori necessity).
  *   **Payoff:** This is the "work the rest of the field would have to answer" component. If you can argue for a **defeasible modal realism** based on robust search procedures rather than ideal conceivability, you offer a replacement engine for the field, not just a repair.
  *   **Strategy:** Make this the "Conclusion/Implications" chapter rather than the core. If (1) and (2) are strong, (3) can be suggestive. If (1) and (2) are weak, (3) will look like hand-waving.

  ---

  ### Strategic Advice for the PhD

  **1. Avoid the "Phenomenology Trap"**
  Your friend's worry is that you will end up arguing about what it *feels like* to conceive something. That is a dead end. Your formal background is your shield. Whenever a metaphysician says "But we can clearly imagine...", you translate to "You have a description $D$ for which you have not derived $\bot$ in system $S$." Keep the argument in the domain of **verification conditions**, not **imaginative vividness**.

  **2. The "Kripkean" Objection**
  The field's immune system will attack you with Kripke's *a posteriori* necessities (Water $\neq$ H2O). They will say: "Conceivability fails here regardless of search depth."
  *   **Your Counter:** You are not arguing conceivability is infallible. You are arguing that the *standard for when we trust it* is ill-defined. In the water case, the search procedure includes empirical premises. Your model should account for **mixed search procedures** (logical consistency + empirical constraint checking). If you can formalize how empirical constraints tighten the search space, you turn the Kripkean objection into data for your model.

  **3. Candid Risk Assessment**
  *   **Risk:** You spend three years building a formal model that metaphysicians ignore because it's "too technical" or "misses the point of modality."
  *   **Mitigation:** Publish the formal core (Question 1) early in a logic/philosophy journal (e.g., *Review of Symbolic Logic*), and the epistemic implications (Question 2) in a general metaphysics journal (e.g., *Philosophical Studies*). This ensures you have a track record even if the full thesis is controversial.

  **Summary:** Your friend sees a stale debate about *limits*. You see a fresh debate about *costs*. Stick to the costs. If you can show that the "price" of ideal conceivability is epistemically unpayable, you force the field to either lower their standards or admit skepticism. That is a dissertation worth writing.
