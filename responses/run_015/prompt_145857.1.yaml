answer: |-
  1. **The Metric of Competence**
  You argue that Reflection holds only when you judge your future self competent. But to avoid circularity, "competence" can't just mean "will satisfy Reflection." If you define it instead as "likely to track the truth," doesn't measuring that likelihood require you to already apply Reflection to your future self's outputs?
  *Follow-up:* If you reply that competence is about the *process* rather than the *outcome*, how do you assess the quality of that process without relying on the very credences the process produces?

  2. **The Regress of Scope Judgments**
  Let's assume you can fix the metric. Your judgment that "my future self is competent" is itself a current credence. Does the Reflection principle apply to *that* credence about your future competence?
  *Follow-up:* If you say no, you seem to be exempting the scope condition from the very norm it's supposed to regulate; if you say yes, don't you trigger a regress where you need a further competence judgment to validate the first one?

  3. **Dutch Book and the Scope Condition**
  A standard diachronic Dutch book exploits the gap between your current conditional credence and your future credence. But a clever bookie could simply bet on whether you *will* judge your future self competent. Since that judgment is made now, can't they construct a sure-loss strategy that bypasses the scope condition entirely?
  *Follow-up:* If you argue the bookie can't know your internal competence judgment, doesn't that make the rationality of your credences dependent on the bookie's ignorance rather than your epistemic state?

  4. **Rationality and Sure Loss**
  Suppose we accept that the Dutch book only works outside the scope of competence. You're effectively saying that when you anticipate your own confusion, you are permitted to accept a sure loss. But isn't avoiding sure loss a minimal requirement of rationality, regardless of your expected competence?
  *Follow-up:* If you maintain that sure loss is acceptable in "incompetent" futures, are you redefining rationality as merely doing the best one can with broken equipment, rather than maintaining coherence?

  5. **Fission and Identity**
  Consider a fission case where you anticipate splitting into two successors, both of whom you judge competent, but who will hold divergent credences in proposition *A*. Since there is no single "later self" to defer to, does the Reflection principle simply dissolve?
  *Follow-up:* If you suggest averaging their credences, what justification do you have for weighting them equally, given that both successors will feel just as competent as the other?

  6. **Van Fraassen and Expected Improvement**
  Van Fraassen used Reflection to argue that it's irrational to expect your credences to improve without new evidence. But on your view, if I know I'm about to undergo a "competence-boosting" therapy, doesn't the scope condition allow me to shift my credences now in anticipation of that upgrade?
  *Follow-up:* If you allow that shift, haven't you surrendered the core insight that mere time passage shouldn't alter rational credence, effectively permitting epistemic free lunches?

  7. **The Link to Conditionalization**
  Van Fraassen also derived Conditionalization from the unscoped Reflection Principle. If Reflection is now restricted to competent futures, does Conditionalization become optional whenever I doubt my future competence?
  *Follow-up:* If you say Conditionalization still holds universally, how do you derive an unconditional updating rule from a principle that explicitly admits exceptions?

  8. **The Fixed-Point and Deference**
  Imagine a case where your future self will be shown your current prediction and, out of respect, will adopt your current credence. This satisfies the fixed-point condition trivially. Does your competence condition rule this out, or does it allow any credence to be rational so long as the future self is deferential?
  *Follow-up:* If you insist the future self must be independent, how do you distinguish "healthy deference to evidence" from "deference to the past self" without already presupposing which credences are correct?

  9. **Falsification Conditions**
  I want to press on the resilience of the view. What specific observation about your own future opinions would lead you to abandon the Competence-Scoped Reflection principle rather than simply redrawing the scope to exclude that case?
  *Follow-up:* If the answer is "nothing," because you can always claim the future self was incompetent, isn't the principle functioning as an unfalsifiable definition rather than a substantive normative claim?

  10. **Normative Residue**
  Finally, the standard counterexamples—brainwashing, drugs, corruption—are the only cases where the unscoped principle seemed to yield the wrong result. If you scope those out, what work is left for the principle to do that isn't already done by Conditionalization or standard coherence requirements?
  *Follow-up:* If the only remaining work is to govern cases where we are already confident in our future rationality, isn't the principle merely telling us to trust ourselves when we already trust ourselves?
