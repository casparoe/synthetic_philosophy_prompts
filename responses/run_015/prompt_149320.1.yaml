          3.  Specific focus on the "Tri-Level Model."
          4.  Specific focus on Statistics/Probability.
          5.  Conclusion: Summary advice.

      *   *Drafting Content - Point 1 (Deductive Validity):*
          *   Need to explain *ampliative* inference. Deduction preserves truth; IBE seeks truth but doesn't guarantee it. The "logically compelled" part is the biggest red flag.
      *   *Drafting Content - Point 2 (Virtues & Scoring):*
