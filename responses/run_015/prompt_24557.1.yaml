answer: |-
  **Title:** The Doxastic Exit: Solving the Paradox of Self-Deception via Belief-Like States

  **Position Statement**
  The standard debate over self-deception is stalled by a category error. Impossibilists argue that self-deception is incoherent because it requires simultaneously holding contradictory beliefs. Possibilists argue that the mind can be partitioned or that intention can bypass rational norms. Both sides, however, share a fatal assumption: that the self-deceived subject ultimately possesses a *genuine belief* in the false proposition. This assumption must be rejected. Self-deception is genuinely possible precisely because the mental state produced is not a belief. It is a **belief-like state**: a cognitive attitude that guides action, is reported as belief, and feels like belief, but lacks the constitutive norm of genuine belief—specifically, the commitment to revise in the face of counter-evidence. By reclassifying the output of self-deception as belief-like rather than doxastic, we dissolve the logical contradictions without resorting to homuncular theories of a split self. The self-deceived subject is not believing a lie; they are inhabiting a motivated fiction that functions as truth for the purposes of action, sustained by desire rather than evidence.

  **Defusing the Intention Paradox**
  The Intention Paradox posits that to intend to deceive oneself into believing $p$, one must know $\neg p$. If one knows $\neg p$, one cannot form the belief that $p$. Thus, the project is stillborn. This objection collapses once we abandon the requirement that the target state is a genuine belief.

  The self-deceiver does not intend to install a *belief*. Belief, by definition, aims at truth; one cannot intend to believe what one takes to be false. However, one *can* intend to manage one's attention and evidence-gathering to cultivate a **belief-like state**. The intention is not "I will believe my spouse is faithful despite the evidence," but rather "I will not look at the text messages, and I will focus on their compliments." The agent does not need to consciously affirm $\neg p$ to initiate this process; they only need to feel the anxiety associated with the possibility of $\neg p$.

  The resulting state is belief-like because it guides the agent to act as though $p$ is true (e.g., staying in the marriage, planning a future). It is not a genuine belief because it is insulated from the normative pressure of counter-evidence. If the spouse is caught in the act, the genuine believer revises immediately. The self-deceived agent, holding a belief-like state, engages in rationalization, denial, or compartmentalization. The paradox fails because it assumes the agent is trying to force a doxastic commitment against their own knowledge. In reality, they are bypassing the doxastic formation process entirely, creating a motivated state that mimics belief without inheriting its truth-tracking obligations. They are not believing against knowledge; they are avoiding the formation of knowledge to maintain a functional fiction.

  **Defusing the Two-People Objection**
  The Two-People Objection argues that deception requires a deceiver and a deceived. If the self is unified, how can it trick itself? If it is split, we have two people, not self-deception. Standard possibilist replies often rely on problematic models of mental partitioning (e.g., sub-agents or modules). The belief-like state account renders this division unnecessary.

  We do not need two agents; we need only two competing systems within one agent: the **motivational system** (desires, fears, needs) and the **cognitive system** (evidence processing, belief formation). In standard deception, Agent A manipulates Agent B's evidence. In self-deception, the motivational system manipulates the cognitive system's access to evidence. The "deceiver" is the desire for $p$ to be true. The "deceived" is the cognitive mechanism that produces the belief-like state.

  Crucially, this preserves the unity of the subject while explaining the genuine mistake. The subject is genuinely mistaken because their action-guiding state (the belief-like state) represents the world incorrectly. They are not merely pretending; if they were pretending, they could drop the act at will. The belief-like state has inertia; it resists revision because it is anchored in emotional need, not just cognitive error. This distinguishes it from a simple lapse of attention or ignorance. A person who is merely ignorant lacks evidence. The self-deceived person often has access to the evidence but neutralizes its impact. The mistake is actively maintained by motive. By identifying the output as belief-like, we avoid saying the subject believes $p$ and $\neg p$ simultaneously. They possess evidence for $\neg p$ (which they suppress) and a motivated state regarding $p$ (which they act on). There is no contradiction in one agent having suppressed evidence and a motivated, non-doxastic commitment.

  **The Cost: The Fuzzy Boundary**
  This position incurs a significant theoretical cost: it demands that we accept a fuzzy, perhaps unprincipled, boundary between *belief* and *belief-like states*. If a state guides action, is reported as belief, and feels like belief, on what grounds do we deny it the label of belief other than to save our theory from paradox? Critics will argue this is ad hoc taxonomic gerrymandering. If it walks like a belief and quacks like a belief, call it a belief.

  I accept this cost. The boundary *is* fuzzy, but that is a feature of human psychology, not a bug in the theory. Folk psychology treats belief as a binary switch, but cognitive science suggests a spectrum of confidence and commitment. Drawing a line based on **responsiveness to counter-evidence** is not arbitrary; it tracks the functional role of the state. Genuine beliefs are governed by the norm of truth. Belief-like states in self-deception are governed by the norm of psychological comfort. Distinguishing them is necessary to explain why self-deceived agents behave so stubbornly in the face of proof. If we call it "belief," we must accuse the agent of irrationality so severe it borders on impossibility. If we call it "belief-like," we recognize it as a different functional kind of mental state, one that is rational relative to the goal of anxiety reduction, even if irrational relative to truth-tracking. We pay the cost of taxonomic complexity to gain the benefit of explanatory power.

  **Conclusion and Falsification Conditions**
  Self-deception is possible because it is not a doxastic contradiction. It is the successful cultivation of a belief-like state that mimics the functional role of belief without the normative constraint of truth. This dissolves the Intention Paradox by shifting the intention from "believing" to "evidence-management," and it dissolves the Two-People Objection by locating the conflict between motivation and cognition within a unified agent.

  This position stands or falls on two empirical and conceptual claims. First, it requires that mental states can be functionally distinct based on their etiology and revision conditions, not just their content. If it turns out that any state guiding action *just is* a belief by definition, this view collapses. Second, it requires that motivation can directly bias cognitive processing without conscious intent. If cognitive science demonstrates that evidence processing is modularly sealed off from motivational states, the mechanism proposed here fails. But given the overwhelming evidence of motivated reasoning, we must accept the ontology that fits the data. We must stop trying to force self-deception into the box of "belief" and acknowledge that the mind is capable of generating functional fictions that are robust enough to live by, but fragile enough to shatter when the motive fades. That is not a contradiction; that is the human condition.
