      *   *Key Insight:* The routine isn't about psychology; it's about *normativity*. Even if we *think* in analogies, we might *want* our legal/moral concepts to be rule-based.

  6.  **Final Polish:** Structure with clear headings. Ensure all four sub-questions are answered. (1. Presupposition, 2. Hofstadter/Mistake, 3. Art vs. Knowledge, 4. Role of Counterexamples).

      *   *Add a specific note on the "Cheating" case:* It shows the difference between *descriptive* analysis (how we use the word) and *normative* analysis (how we should punish behavior).
