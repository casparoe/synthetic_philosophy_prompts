  1. Begin by deriving the probability of correctness for a minimal three-voter case to establish the mathematical dependency on individual competence exceeding 0.5, then introduce the asymptotic curve only after proving that conditional independence is the mechanism driving convergence.
  2. Use the model-ensemble case directly rather than a human committee because it bridges the gap between theory and their work, but strip it down to three specific models to keep it tractable. The example must have a clear binary ground truth and must not involve models sharing training data or architecture to preserve the independence assumption.
  3. Anticipate they will conflate average competence with per-voter competence, assume independence holds due to model stochasticity, and believe ground truth exists for safety judgments. Defuse the competence myth immediately when introducing the $p > 0.5$ condition, address independence when showing why the curve flattens with correlated errors, and tackle ground truth when discussing safety applications.
  4. Ask them to predict the ensemble accuracy if you duplicate the best model five times instead of querying five distinct models, forcing them to articulate why identical errors prevent convergence.
  5. Openly refuse to cover weighted voting schemes or Bayesian extensions of the theorem, as discussing how to fix correlated errors distracts from recognizing that the errors are correlated.
