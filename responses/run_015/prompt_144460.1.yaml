prompt: |-
  I'm giving a 45-minute lunch-and-learn on the Condorcet jury theorem to about twenty machine-learning engineers at my company. It is on the agenda because several teams have started majority-voting across several LLMs and describe the result as the wisdom of crowds applied to models, and one of them has already built a slide with the theorem's curve on it. I want the session to land somewhere better than the claim that majority rule is justified: I want them to leave seeing the theorem as a result whose conclusion reverses when its inputs are weakened — that above-one-half competence is a per-voter requirement rather than an average, that conditional independence is doing the real work and is systematically violated by models trained on overlapping data, and that the whole thing goes silent when there is no fact of the matter to be right about, as with most of the safety judgments they actually vote on.

  Plan the explanation rather than giving it. I need the order the components must come in and what depends on what; the one example that should carry the session (I was going to use a three-person committee — tell me whether the model-ensemble case is better and why, and say what the example must have and what it must not have); the misconceptions this audience will bring or form, in the order they will surface, with the point in the sequence where each should be defused; one closing question that would show they had grasped the independence assumption rather than memorized the formula; and what I should openly refuse to cover in 45 minutes.

  Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion.
