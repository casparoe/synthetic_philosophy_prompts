answer: |-
  1. **Essay Question**

  **Option 4**
  **Provisional Amnesty and the Architecture of Transition**

  Consider the following proposal for a transitional justice mechanism: *Provisional Amnesty*. Under this model, immunity from prosecution is granted individually and upfront, but remains defeasible for a fixed period (e.g., fifteen years). Immunity is revoked if: (a) the applicant's disclosure is later proven incomplete or contradicted by victim testimony; or (b) the state fails to meet its own timetable for reparations, vetting, and institutional reform. After the fixed period, immunity becomes final.

  Write an essay of no more than 2,500 words arguing **either** for the adoption of provisional amnesty as a superior mechanism to standard models (such as the South African TRC or Argentine legislative amnesty), **or** against it in favour of an alternative approach.

  Your argument must address the following:
  *   Distinguish between at least three distinct functions amnesty might perform (e.g., neutralising spoilers, inducing testimony, expressive recognition) and explain how provisionality alters each.
  *   Analyse the epistemic costs: does conditioning immunity on corroboration turn a truth commission into an adjudicator, and does this compromise the truth-seeking function?
  *   Address the 'standing' objection (that the state cannot trade victims' claims) and the 'credibility' objection (drawing on the Argentine experience of repealed amnesties).
  *   Distinguish this model from mere non-prosecution due to institutional incapacity, and briefly contrast it with the Rwandan *gacaca* approach (punishment at scale with sentence reductions).

  **Note:** Answers that conclude by balancing trade-offs without making a definitive choice will not be eligible for a First-Class mark.

  ***

  2. **Model Answer**

  **The Case for Honest Provisionality**

  Transitional justice is often trapped between the moral necessity of accountability and the political necessity of stability. Standard models usually fail by pretending this tension is resolved. The South African model offers final amnesty for truth, but often sacrifices justice permanently. The Argentine model offers justice eventually, but at the cost of decades of instability and legal uncertainty. The proposal for 'provisional amnesty'—defeasible immunity contingent on full disclosure and state performance—offers a superior path. It should be adopted because it aligns the incentives of perpetrators with the needs of victims, and it replaces the false promise of finality with an honest contract of conditionality.

  To evaluate this, we must distinguish the three jobs amnesty performs. First, it settles with actors who could wreck the transition (the spoiler function). Second, it induces testimony that self-incrimination laws would otherwise block (the epistemic function). Third, it expresses what kind of wrong was committed and what the new community values (the expressive function). Standard blanket amnesties excel at the first job but fail the third, signalling impunity. Final individual amnesties (South Africa) serve the second job but risk lying if disclosure is coerced. Provisional amnesty reweights these. It keeps the spoiler function active during the脆弱 (fragile) early years, but keeps the threat of prosecution alive to ensure the expressive function isn't voided. By making immunity contingent on state performance (reparations/reform), it also binds the state to the bargain, preventing the transition from stalling once the elites are safe.

  The strongest objection lies in the epistemic costs. If immunity is defeasible based on corroboration, the commission ceases to be a truth-teller and becomes an adjudicator. Testimony bought with immunity is already epistemically compromised; perpetrators have an incentive to minimise culpability. Adding a corroboration requirement to maintain immunity might chill testimony further. Why confess if your confession can be used to revoke your immunity later based on a victim's contradictory account? This is a serious risk. A standard TRC trades truth for finality; provisional amnesty trades truth for leverage. However, this concession is acceptable because the 'truth' produced by final amnesty is often low-quality anyway—legalistic minimisations designed to tick boxes. Provisional amnesty accepts that perfect truth is unavailable, and instead prioritises a mechanism that keeps the file open. It acknowledges that truth is often recovered slowly, over decades, not in a single hearing.

  This leads to the standing and credibility objections. Critics argue the state has no standing to trade away victims' claims to justice. This is true of any amnesty. But provisional amnesty admits this limitation explicitly. It does not claim to extinguish the moral debt, only to suspend the legal enforcement. This connects to the Argentine experience, where amnesties were repealed after public pressure. The Argentine case reveals a crucial insight: if a successor government can repeal an amnesty, then no amnesty is truly final. Therefore, offering a 'permanent' amnesty is a lie. It is more honest to offer a provisional one. If the state fails its obligations (reparations, reform), the contract is void. This enhances credibility. Perpetrators know the deal is real because the conditions are clear; victims know the state hasn't sold them out permanently because the file remains open if the state defaults.

  Finally, we must distinguish this from mere non-prosecution due to incapacity. Sometimes states simply cannot prosecute everyone. That is a pragmatic collapse, not a normative choice. Provisional amnesty is a normative choice to conditionality. It differs from the Rwandan *gacaca* courts, which pursued punishment at scale with sentence reductions for confession. *Gacaca* prioritised communal reintegration and volume of cases over individual due process. Provisional amnesty prioritises the leverage over elites and state performance over communal punishment. *Gacaca* asked victims to judge neighbours; provisional amnesty asks the state to judge itself. The latter is riskier but necessary for systemic reform.

  There is a loose end here: who adjudicates whether the state has failed its timetable? If the judiciary is compromised, the 'state failure' clause is useless. This requires an independent monitoring body, which itself requires resources and protection. This is a practical vulnerability. However, it is a solvable institutional design problem, whereas the moral hazard of final amnesty is structural.

  In conclusion, provisional amnesty should be adopted. It forces a choice between stability and justice to remain live, rather than pretending it is settled. It avoids the epistemic arrogance of assuming a commission can find the whole truth in one hearing. It avoids the credibility crash of the Argentine model by making the conditionality explicit from the start. It is not perfect, but it is honest. In transitions, honesty about the limits of justice is preferable to the false comfort of finality. We should choose the mechanism that admits it might fail, rather than the one that promises it won't.

  ***

  3. **Marking Scheme**

  | Band | Marks | What the answer must contain | The characteristic failure that caps it at this band |
  | :--- | :--- | :--- | :--- |
  | **First** | 20–25 | **Forced Choice:** Clearly argues for or against without fence-sitting. **Three Jobs:** Distinguishes spoiler, epistemic, and expressive functions and analyses how provisionality alters them. **Epistemic Cost:** Engages with the shift from truth-teller to adjudicator and the risk of chilling testimony. **Standing/Credibility:** Addresses the state's right to trade claims and the Argentine repeal precedent (honesty vs. finality). **Rwanda/Incapacity:** Distinguishes normative choice from pragmatic incapacity and contrasts with *gacaca*. **Structure:** Coherent argument with a clear thesis. | None. (To exceed this band would require publishable originality or theoretical innovation beyond MA level). |
  | **Upper Second (2:1)** | 15–19 | **Choice:** Makes a choice but may hedge slightly in the conclusion. **Three Jobs:** Identifies the functions but may not fully analyse how provisionality alters them. **Epistemic Cost:** Identifies the risk but does not fully explore the adjudicator vs. truth-teller shift. **Standing/Credibility:** Discusses one well but neglects the other (e.g., focuses on Argentina but ignores standing). **Rwanda/Incapacity:** Mentions Rwanda but fails to distinguish clearly between incapacity and amnesty. | **Failure to force the choice:** The answer reverts to "on the one hand/on the other hand" balancing rather than defending a position. |
  | **Lower Second (2:2)** | 10–14 | **Choice:** Ambiguous or sits on the fence. **Three Jobs:** Lists functions without linking them to the provisional model. **Epistemic Cost:** Mentions truth but ignores the corroboration/adjudication problem. **Standing/Credibility:** General discussion of amnesty legitimacy without engaging the specific 'repeal' or 'trade' arguments. **Rwanda/Incapacity:** Omits Rwanda or conflates incapacity with amnesty. | **Descriptive rather than analytical:** Recites case studies (SA, Argentina, Rwanda) without using them to test the provisional amnesty model. |
  | **Fail** | 0–9 | **Choice:** No clear argument. **Three Jobs:** Fails to identify distinct functions of amnesty. **Epistemic Cost:** Ignored. **Standing/Credibility:** Ignored. **Rwanda/Incapacity:** Ignored. **Structure:** Disorganised or significantly under word count. | **Irrelevance:** Fails to address the specific concept of provisional amnesty or the required analytical moves. |

  ***

