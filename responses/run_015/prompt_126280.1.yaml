prompt: |-
  I'm planning a session for a philosophy reading group of advanced undergraduates who have read Susan Wolf's essay on moral saints but think they have grasped it because they agree that being too good sounds exhausting. I want to teach the specific conceptual claim that maximal moral goodness is undesirable not because it causes burnout—an empirical mistake—but because it structurally crowds out non-moral excellences that are partly constitutive of human flourishing, making the ideal of moral sainthood self-undermining as a life-plan rather than merely difficult.

  Plan the explanatory arc: first, the dependency order—what distinction between being very good and being a moral saint, and between a life-plan and a behavioral pattern, must be in place before the structural point can even appear; second, the carrying example—use an imagined physician who spends every available hour either treating underserved patients or optimizing her epidemiological research to maximize lives saved, and who therefore abandons both the cello she once played and friendships that do not serve her moral efficiency. Explain why this case must include these specific non-moral goods and why it should not be Mother Teresa, Gandhi, or a generic workaholic; third, map the misconceptions in the order they will arise—(1) that Wolf is criticizing people for being too good, (2) that she is defending a right to leisure or selfishness, (3) that she is making an empirical claim about psychological burnout—and state exactly where in the sequence each should be defused; fourth, provide one check question at the end that reveals whether the group has understood the structural argument rather than merely sympathizing with the doctor's lost cello; finally, tell me which part of Wolf's framework—such as her comparison of different motivational models of sainthood—I should explicitly set aside at this level and say I am leaving out.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Advanced undergraduates in a philosophy reading group.
      *   **Text:** Susan Wolf's "Moral Saints" (1982).
      *   **Current Student Misconception:** They think they "get it" because they agree being too good is exhausting (empirical/psychological interpretation).
      *   **Goal:** Teach the *structural* claim: Maximal moral goodness is undesirable because it crowds out non-moral excellences constitutive of flourishing, making sainthood self-undermining as a *life-plan*, not just hard.
      *   **Required Components:**
          1.  Explanatory Arc (Dependency Order): Distinctions needed before the structural point.
          2.  Carrying Example: Specific physician case (cello, friendships, no Mother Teresa/Gandhi). Explain *why* these specifics matter.
          3.  Map Misconceptions: Order of arrival and defusal (Too good? Leisure/Selfishness? Burnout?).
          4.  Check Question: One question to test structural understanding vs. sympathy.
          5.  Exclusion: What part of Wolf's framework to explicitly set aside.

  2.  **Deconstruct the Philosophical Argument (Wolf's "Moral Saints"):**
      *   Wolf argues that a "moral saint" is someone who devotes themselves to moral goodness as a *dominant* end.
      *   The problem isn't that they are *good*, but that the *ideal* of moral perfection is not a rational ideal of personal well-being.
      *   Why? Because a life devoted exclusively (or maximally) to moral ends precludes the development of other talents/interests (humor, gourmet cooking, art, deep friendships not based on moral utility) that make a life rich.
      *   It's a conceptual/logical point about the *structure of value*, not an empirical point about stress.

  3.  **Drafting Component 1: Explanatory Arc (Dependency Order):**
      *   *Step 1: Degree vs. Kind.* Students confuse "very good person" with "Moral Saint." Need to establish that the Saint is defined by the *priority structure* of their values, not just the quantity of good deeds.
      *   *Step 2: Action vs. Life-Plan.* Students focus on specific actions (working too hard). Need to shift to the *shape of a life*. A life-plan is about what counts as a reason for action.
      *   *Step 3: The Structural Crowding Out.* Once 1 and 2 are clear, we can show that if Moral Goodness is the *only* (or dominant) reason, non-moral reasons (art, friendship for its own sake) lose their normative force.
      *   *Refinement:* Ensure the distinction between "behavioral pattern" (what they do) and "motivational structure" (why they do it) is clear.

  4.  **Drafting Component 2: The Carrying Example (The Physician):**
      *   *Scenario:* Physician maximizing lives saved (clinical + research).
      *   *Exclusions:* Cello (art/aesthetic), Friendships (personal love vs. moral duty).
      *   *Why not Mother Teresa/Gandhi?* They are too polarizing/religious/historical. Students get bogged down in "But was she really a saint?" or "But he changed history!" We need a *conceptual* saint, not a historical one. Also, historical figures often had complex non-moral motivations that muddy the water.
      *   *Why not a generic workaholic?* A workaholic might work for money or status. The physician *must* be working for *moral reasons* (saving lives). If they work for money, Wolf's argument doesn't apply.
      *   *Why Cello?* It represents a non-moral excellence that requires time and has no moral utility.
      *   *Why Friendships?* Represents relationships valued for the person, not their moral worth or utility.
      *   *Crucial Detail:* The physician *could* play the cello, but sees it as an unjustifiable use of time *given her moral commitment*.

  5.  **Drafting Component 3: Mapping Misconceptions:**
      *   *Misconception 1: Criticizing goodness.* (Arrives early). Defuse by distinguishing "good person" from "saint as ideal."
      *   *Misconception 2: Defending selfishness/leisure.* (Arrives when discussing the cello). Defuse by showing these aren't "selfish" but constitutive of a well-rounded character.
      *   *Misconception 3: Empirical Burnout.* (The main target). Defuse last, by showing that even if she *never* felt tired, the life is still impoverished structurally.

  6.  **Drafting Component 4: The Check Question:**
      *   Need to distinguish between "She is tired" (Empirical) and "She lacks reasons to play" (Structural).
      *   *Draft:* "If a pill existed that gave her infinite energy, should she take it and keep working?"
      *   *Analysis:* If they say "Yes," they still think it's about burnout. If they say "No, because she still wouldn't have a life," they get the structural point.
      *   *Refinement:* Make it about the *value* of the cello. "If the cello playing saved no one and tired no one, is there a reason to do it?"

  7.  **Drafting Component 5: Exclusion:**
      *   Wolf discusses two models: the "Loving Saint" (who wants to do good) vs. the "Rational Saint" (who duty-binds themselves).
      *   For this specific lesson (structural crowding out), the distinction matters less than the *outcome* of the commitment. Focusing on the psychological difference between loving and rational saints might distract from the *objective* loss of non-moral goods.
      *   *Decision:* Set aside the Loving vs. Rational Saint distinction. Focus on the *Life-Plan* regardless of motivation.

  8.  **Review and Refine:**
      *   *Tone:* Academic, precise, pedagogical.
      *   *Check against constraints:* Did I answer all four/five specific prompts? Yes.
      *   *Logic Check:* Does the dependency order make sense? Yes, you can't understand crowding out without understanding the life-plan structure first.
      *   *Example Check:* Is the physician distinct from a workaholic? Yes, emphasized moral motivation.
      *   *Misconception Check:* Is the burnout myth addressed as the *final* hurdle? Yes.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Misconception 1:* Students usually start with "Wolf hates good people." I need to make sure the defusal happens *before* the physician example is fully analyzed, or they will project that onto the physician.
      *   *Correction on Check Question:* Make sure it forces a choice between "energy" and "value."
      *   *Correction on Exclusion:* Be precise about *why* we are excluding the Loving/Rational distinction (it's about the *content* of the life, not the *psychology* of the agent).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the lesson plan structured according to your requirements.

  ### 1. The Explanatory Arc: Dependency Order
  To move the students from an empirical complaint (burnout) to a conceptual claim (structural crowding out), you must establish three hierarchical distinctions. Do not introduce the structural argument until the first two are secured.

  *   **Distinction A: Degree vs. Dominance (The Definition of the Saint)**
      *   *Concept:* Students equate "Moral Saint" with "Very Good Person." You must establish that for Wolf, a Moral Saint is not defined by the *quantity* of good deeds, but by the *hierarchy of reasons*. A very good person balances moral reasons with other reasons; a Moral Saint allows moral reasons to dominate or exclude all others.
      *   *Necessity:* Without this, students will think Wolf is arguing that morality is too demanding. She is arguing that *moral dominance* is the problem.
  *   **Distinction B: Behavioral Pattern vs. Life-Plan (The Unit of Analysis)**
      *   *Concept:* Students focus on specific actions (working late, skipping dinner). You must shift the focus to the *narrative structure of a life*. A life-plan is a framework for deciding what counts as a worthwhile use of time.
      *   *Necessity:* Without this, the argument remains about time management. With it, the argument becomes about what kinds of value are recognized as legitimate within the plan.
  *   **The Structural Point: Constitutive Crowding Out**
      *   *Concept:* Once A and B are accepted, you can argue that if the Life-Plan recognizes only Moral Value, Non-Moral Excellences (art, humor, deep friendship) become unintelligible as goods. They are not just "squeezed out" due to lack of time; they are *normatively excluded* as unjustifiable.
      *   *Result:* The life is impoverished not because the agent is tired, but because the agent is blind to specific categories of human value.

  ### 2. The Carrying Example: The Maximizing Physician
  **The Case:**
  Imagine a physician, Dr. A, who adopts a life-plan dedicated to minimizing global morbidity. She calculates her time strictly by moral utility. Every hour not spent treating underserved patients is spent on epidemiological research to maximize future lives saved. She abandons the cello she played for fifteen years because practice time reduces research output. She ends friendships with people who do not contribute to her moral mission or who require emotional support that does not yield moral utility.

  **Why these specifics matter:**
  *   **The Cello (Aesthetic/Non-Instrumental Good):** The cello must be included because it represents a good that is *intrinsically* valuable but *instrumentally* useless to her moral goal. If she played the cello to relax so she could work harder, the structural point is lost. It must be a good that competes with morality for time without contributing to morality.
  *   **The Friendships (Personal vs. Moral Love):** This distinguishes Wolf's view from simple altruism. Wolf argues we value friends for *who they are*, not for their moral worth or utility. If Dr. A keeps friends only to network for charity, she treats them as means.
  *   **Why NOT Mother Teresa or Gandhi:** Historical figures introduce empirical noise. Students will debate whether they actually had hobbies or if their sanctity was "real." We need a *conceptual* saint to test the *ideal*, not a historical one to test biographical accuracy.
  *   **Why NOT a Generic Workaholic:** A corporate lawyer working 80 hours for a bonus is not a moral saint. If the example is not explicitly driven by *moral* motivation (saving lives), Wolf's critique does not apply. The constraint must be moral, not financial or status-based.

  ### 3. Mapping the Misconceptions
  Address these in the following order. If you address the burnout myth too early, students will revert to it when the example gets difficult.

  *   **Misconception 1: "Wolf is criticizing people for being too good."**
      *   *When it arises:* Immediately upon introducing the title "Moral Saints."
      *   *How to defuse:* Before analyzing the physician, clarify Distinction A (Degree vs. Dominance). State clearly: "Wolf admires good people. She is questioning whether the *ideal* of moral perfection is a rational ideal for a *human life*."
  *   **Misconception 2: "Wolf is defending a right to leisure or selfishness."**
      *   *When it arises:* When discussing the physician abandoning the cello. Students will say, "She deserves a break."
      *   *How to defuse:* Correct the language. It is not about "deserving a break" (which implies rest for work) or "selfishness" (which implies moral vice). It is about the *constitutive elements of a rich character.* Playing the cello isn't "leisure"; it is the cultivation of an excellence that makes a life humanly recognizable.
  *   **Misconception 3: "This is an empirical claim about psychological burnout."**
      *   *When it arises:* At the conclusion, when students say, "She would collapse."
      *   *How to defuse:* This is the final hurdle. Use the "Magic Pill" test (see Check Question). Force them to see that even with infinite energy, the life remains structurally impoverished because the *reasons* for playing the cello have been eliminated from her worldview.

  ### 4. The Check Question
  To verify they understand the structural argument rather than merely sympathizing with the doctor's fatigue, ask this:

  > "Suppose a biomedical enhancement existed that allowed Dr. A to work 18 hours a day indefinitely without physical fatigue, psychological stress, or diminished cognitive capacity. If she chooses to use this enhancement to continue her moral work rather than return to the cello, has she made a rational mistake according to Wolf?"

  *   **Incorrect Answer (Empirical Understanding):** "No, because she isn't burning out anymore," or "Yes, but only because she needs social connection to function."
  *   **Correct Answer (Structural Understanding):** "Yes, it is still a mistake. Even with infinite energy, a life that contains no non-moral excellences is impoverished. The value of the cello is not that it rests her brain, but that it is a distinct form of human flourishing that is being excluded from her life-plan."

  ### 5. What to Explicitly Set Aside
  You should explicitly bracket Wolf's distinction between the **"Loving Saint"** (who finds happiness in doing good) and the **"Rational Saint"** (who sacrifices non-moral interests for duty).

  *   **Why set it aside?** This distinction concerns the *psychological motivation* of the saint. Your lesson goal is to teach the *objective structure of value* in a life-plan.
  *   **Instruction to Group:** "Wolf spends time distinguishing between saints who love being good and saints who force themselves to be good. For today's session, we are setting that psychological distinction aside. Whether Dr. A loves her work or hates it is irrelevant to our point. We are analyzing the *content* of her life, not her *feelings* about it. Even if she loves saving lives more than playing the cello, Wolf argues the life is still structurally deficient."
