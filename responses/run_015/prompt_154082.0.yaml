answer: |-
  This is a sophisticated and theoretically potent distinction. In the literature on welfare state transformation, particularly within the work of scholars like Joe Soss, Loïc Wacquant, and Virginia Eubanks, there is often a discussion of the shift from social rights to managerial control. However, your specific framing of **behavioral conditionality** versus **ontological exclusion** cuts deeper into the *moral phenomenology* of the bureaucratic encounter. It isolates the mechanism by which administrative procedures transform into moral judgments.

  Below is a detailed explication of this conceptual slide, followed by the requested JSON summary.

  ### The Conceptual Slide: From Contract to Character

  The instability you identify lies at the heart of the modern workfare regime's legitimacy. Workfare is publicly justified through the logic of **behavioral conditionality**. It posits a social contract: the state provides resources, and the citizen provides labor or compliance. In this framework, a sanction is a technical correction. If a claimant fails to report a change in income, the behavioral logic dictates that they have breached a procedural term. The sanction (e.g., a benefit reduction) is instrumental; it is designed to restore compliance. Crucially, this logic preserves the claimant's status as a rights-bearing subject. They have made a mistake, but they remain a member of the moral community entitled to support, provided they correct the behavior.

  **Ontological exclusion**, however, operates on a different moral register. It does not view the claimant as a contractor who failed, but as a category of person who is fundamentally incompatible with the collective. When an administrator treats a reporting discrepancy not as a correctable error but as *fraud*, they are making a leap from judging an *act* to judging a *character*. The discrepancy becomes a revelation of true nature. The claimant is no longer someone who *did* something wrong; they are someone who *is* wrong (a "cheat," a "scrounger," an "imposter").

  ### The Site of Ambiguity: Fraud Detection as Moral Boundary Work

  The specific administrative moment where these logics blur is the **adjudication of intent** within fraud detection systems.

  Behavioral conditionality requires only proof of non-compliance (the outcome). Ontological exclusion requires proof of moral culpability (the intent). However, in high-volume welfare bureaucracies, determining intent is epistemologically difficult. Administrators rarely have access to a claimant's internal state of mind. Consequently, the system relies on **heuristics of suspicion**.

  When a minor reporting discrepancy occurs (e.g., failing to declare a small, irregular cash income), the administrative system is designed to flag it as a potential fraud case. At this moment, the burden of proof often subtly shifts. The claimant must prove it was an *error* (behavioral), while the system treats it as a *lie* (ontological) until proven otherwise. This is where the slide occurs: the administrative difficulty of distinguishing mistake from malice is resolved by defaulting to a presumption of moral fault.

  The category of "fraud" performs the essential conceptual work here. It is a legal-technical term that carries heavy moral weight. By classifying a discrepancy as fraud, the regime can claim it is enforcing a neutral contract (behavioral) while effectively engaging in moral purification (ontological). It allows the state to say, "We are not excluding you because you are poor; we are excluding you because you broke the rules." Yet, because the interpretation of "breaking the rules" is saturated with assumptions about the dishonesty of the poor, the outcome is the same as if they had explicitly stated, "You are not one of us."

  ### Normative Costs: Citizenship and Desert

  This sliding scale is not merely a semantic ambiguity; it carries profound normative costs for the assignment of citizenship and desert.

  1.  **The Erosion of Reversibility:** Behavioral conditionality implies reversibility; you can fix the behavior and restore the entitlement. Ontological exclusion is sticky; a stain on one's character persists. When the logics slide, sanctions become permanent markers of moral failure rather than temporary incentives for compliance. This creates a class of citizens who are permanently "under suspicion," effectively second-class citizens whose rights are provisional and perpetually revocable.
  2.  **The Chilling Effect on Rights:** If claimants perceive that administrative errors will be interpreted as ontological flaws (fraud/character defects), they may withdraw from the system entirely to avoid the moral risk. This undermines the universalist ideal of social rights, turning welfare into a trap where claiming what is due risks confirming one's status as "undeserving."
  3.  **Reification of the "Undeserving":** The slide solidifies the category of the "undeserving poor." In a purely behavioral regime, the "undeserving" are simply those currently non-compliant. In an ontological regime, the "undeserving" are a distinct species of citizen defined by inherent moral deficiency. The ambiguity allows the state to expand this category without explicit political debate. By tightening behavioral monitoring (which sounds reasonable) but applying ontological judgments (which are punitive), the regime shrinks the welfare roll while claiming to merely enforce integrity.

  ### Conclusion

  Your distinction illuminates how workfare regimes achieve exclusion without necessarily abolishing rights. They maintain the *language* of behavioral conditionality (contracts, rules, compliance) while operating the *logic* of ontological exclusion (suspicion, character judgment, categorical rejection). The concept of fraud is the hinge that allows this door to swing both ways, masking a moral judgment of worthiness as a technical judgment of compliance. Recognizing this slide is crucial for your analysis because it explains why the *experience* of welfare administration is often one of moral humiliation rather than bureaucratic inconvenience.

