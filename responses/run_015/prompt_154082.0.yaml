prompt: |-
  I am a doctoral student in political sociology studying the moral administration of welfare, and I am trying to work out a conceptual distinction that keeps surfacing in my analysis of workfare regimes but that standard accounts of conditionality tend to collapse. I want to distinguish between what I am calling behavioral conditionality and ontological exclusion in the governance of benefits.

  Under behavioral conditionality, a work requirement or fraud check operates like a contractual clause: the recipient holds a provisional entitlement, fails to satisfy an explicit procedural condition, and incurs a sanction that is meant to correct the failure or enforce reciprocity. The underlying logic is instrumental—the recipient remains a rights-bearing claimant whose behavior has temporarily disqualified them. By contrast, ontological exclusion treats the same administrative event—say, an unreported change in household income—not as a correctable breach of contract but as evidence that the claimant belongs to a category of persons who are not proper welfare subjects at all. Here the sanction is not instrumental but expressive or categorical; it confirms that the recipient was always already among the undeserving poor.

  My question is about the conceptual slide between these two logics, particularly in the institutional design of benefit fraud detection. When an administrator treats a minor reporting discrepancy as fraud, is the underlying moral logic that the recipient violated a procedural reciprocity condition, or that they revealed themselves to be the kind of person who exploits collective provision? Please explain this conceptual issue in detail: how workfare combines strict behavioral monitoring with narratives about the undeserving poor, why the distinction between administrative error and moral fault becomes unstable within that combination, and what conceptual work the category of fraud performs in allowing regimes to move between contractual and categorical judgments without explicit justification. In particular, address whether this sliding scale is merely a semantic ambiguity or whether it carries distinct normative costs for how citizenship and desert are assigned.

  After your explanation, please provide a brief structured summary as a JSON object with exactly these fields: "behavioral_conditionality_logic" (the instrumental, contract-based view of sanctions), "ontological_exclusion_logic" (the categorical, character-based view), "site_of_ambiguity_in_fraud_detection" (the specific administrative moment where the two logics blur), "conceptual_cost_of_the_sliding_scale" (why the ambiguity is normatively consequential rather than just linguistic), and "implication_for_the_undeserving_poor_category" (how the ambiguity reshapes the moral status of that category itself).
