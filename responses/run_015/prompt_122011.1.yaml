      *   **Philosophical Commitments:**
          *   *Ontology of Harm:* Harassment harm is psychological/existential (trauma), Plagiarism harm is institutional/proprietary (theft/lie).
          *   *Epistemology of Truth:* In harassment, the victim's experience *is* the truth (phenomenological). In plagiarism, external evidence *is* the truth (empirical).
          *   *Moral Agency:* In harassment, the accused is a potential harm-doer who needs re-education (reflection). In plagiarism, the accused is a moral agent capable of deceit who needs judgment.
          *   *Dignity vs. Honor:* Dignity here is defined as *safety from challenge*. Honor is defined as *reputation earned through conduct*.

      *   **Victimhood as Unchallengeable Status?**
          *   Yes. By removing the right to confront the accuser or see evidence, the accusation becomes functionally irrefutable. The status of "harmed party" grants immunity from cross-examination.

      *   **Consistency?**
          *   It is inconsistent *formally* (different rules for different people) but consistent *functionally* within a specific worldview: "Interpersonal harm requires care; Institutional harm requires justice." It smuggles in Victimhood culture for harassment (reliance on authority to validate harm) and Honor culture for plagiarism (peer judgment of character).

      *   **Implicit Theory Reconstruction:**
