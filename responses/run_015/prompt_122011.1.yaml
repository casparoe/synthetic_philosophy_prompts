  2.  **Deconstruct the Cultural Frameworks (Campbell & Manning):**
      *   *Honor Culture:* Sensitivity to insults, self-help/peer enforcement, reputation is key, public shaming or vindication, strength/virtue displayed through defense.
      *   *Dignity Culture:* Self-worth is intrinsic (not dependent on others), conflicts handled by law/authority, thick skin, due process, focus on rules/rights rather than reputation.
      *   *Victimhood Culture:* Sensitivity to slights, reliance on third parties (admin) for validation, moral status derived from victimization, publicizing harm to gain support.
