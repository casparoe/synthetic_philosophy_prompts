  3.  **Analyze the Split Practice (Harassment vs. Plagiarism):**
      *   *Harassment (The "Dignity" Model):*
          *   Epistemology: Subjective harm > Objective truth. "Harm occurred" is sufficient.
          *   Procedure: Inquisitorial/Administrative. No confrontation.
          *   Goal: Healing/Validation of victim, behavioral correction of accused (via reflection).
