answer: |-
  This is a profound set of intuitions, and as a novelist, you are grappling with what metaphysicians call the **Problem of Material Constitution** and **Personal Identity**. Your verdicts are not random; they map surprisingly well onto a sophisticated philosophical position known as **Sortal-Relative Causal Continuity**.

  There is a single principle that can accommodate all five of your verdicts without requiring you to abandon any of them. However, it requires accepting that "identity" is not a universal property of matter, but a status granted by the *kind* of thing (the sortal) we are judging, governed by the continuity of its specific defining process.

  ### The Unifying Principle: Sortal-Relative Causal Continuity

  The principle is this: **An object $X$ persists as the same entity if and only if there is an unbroken causal chain preserving the *essential properties* defined by its sortal concept.**

  Let's test this against your five cases to see how it resolves the tensions between Form, Matter, and Process.

  1.  **The Marble Statue (Restoration):**
      *   **Sortal:** Statue.
      *   **Essential Property:** Visual form and artistic lineage.
      *   **Verdict:** Same Statue.
      *   **Why:** The sortal "Statue" does not require original matter. It requires the preservation of form through a continuous history of maintenance. The chipping and restoring is a *gradual* causal process that maintains the form. The chain is unbroken.

  2.  **The Clay Model to Bronze:**
      *   **Sortal:** Model vs. Statue.
      *   **Essential Property:** Constitution.
      *   **Verdict:** New Object.
      *   **Why:** While there is a causal link, the sortal shifts. A "Clay Model" is essentially clay. When the clay is destroyed to make bronze, the essential property of the model (being clay) is violated. The bronze is a *descendant*, not a survivor.

  3.  **The Synthetic Tissue Replacement:**
      *   **Sortal:** Person.
      *   **Essential Property:** Psychological continuity and functional organization.
      *   **Verdict:** Same Person.
      *   **Why:** Like the statue, the sortal "Person" does not require original biological matter (cells turn over naturally anyway). It requires the continuous functioning of the mind. Because the replacement is gradual, the causal chain of consciousness is never interrupted.

  4.  **The Synthetic Scan (Duplication):**
      *   **Sortal:** Person.
      *   **Essential Property:** Uniqueness of causal trajectory.
      *   **Verdict:** Two Claimants (Fission).
      *   **Why:** Identity is a one-to-one relation. If the causal chain branches (one becomes two), strict identity fails. You cannot be identical to two distinct things. Your intuition that the original is "split" is the philosophically robust view (fission).

  5.  **The Ice Sculpture (Melt and Refreeze):**
      *   **Sortal:** Ice Sculpture.
      *   **Essential Property:** Structural integrity of frozen water.
      *   **Verdict:** Destroyed/Imitation.
      *   **Why:** This is the key to your tension. Why does the Statue survive chipping but the Ice Sculpture not survive melting? Because the sortal "Ice Sculpture" essentially includes its *state of matter*. To be an ice sculpture is to be frozen. Melting is not maintenance (like chipping); it is a phase change that destroys the structural lattice that defines the object. Refreezing is a *new* causal process, even with the same water.

  6.  **The Bronze Recast (Form Change):**
      *   **Sortal:** Statue.
      *   **Essential Property:** Form.
      *   **Verdict:** Destroyed.
      *   **Why:** Here, matter persists, but the sortal "Statue" requires specific form. Melting destroys the form. The causal chain of *that statue* ends when the form is lost.

  ### The Prediction: The Digital Upload

  Now, apply **Sortal-Relative Causal Continuity** to your unsettled case:
  *   **Case:** Consciousness uploaded to digital substrate (continuous real-time update); biological body remains intact but unconscious.

  **The Prediction:**
  The **Digital Upload is the protagonist.** The biological body is a vacant shell.

  **The Reasoning:**
  1.  **Sortal:** Person.
  2.  **Essential Property:** Psychological continuity (consciousness, memory, agency).
  3.  **Continuity:** You specified the update is "continuous in real time." This avoids the "break" in continuity that plagues teleportation cases. It functions like the Synthetic Tissue case (Verdict 3), merely shifting the substrate from neuron to simulation gradually or via a bridged link.
  4.  **Uniqueness:** Because the biological body is *unconscious*, there is no branching of the psychological stream. There is only one active locus of consciousness. The "Non-Branching" requirement (Verdict 4) is satisfied because the biological stream has paused or ceased, leaving the digital stream as the sole continuer of the causal history.

  **Narrative Complication:**
  The tension arises if the biological body *wakes up*. If the biological brain reactivates while the upload is running, you immediately revert to Verdict 4 (Fission). You now have two claimants, and your principle dictates that neither is strictly the "original" in terms of identity, though both have equal claim to the past.

  ### Should You Abandon a Verdict?

  You asked if you should abandon the judgment about the Ice, the Scan, or the Replacement to smooth out the theory.

  **My advice as a storyteller: Do not abandon any of them.**

  The friction between these verdicts is not a bug in your intuition; it is the engine of your theme.
  *   **The Ice Case** represents **Fragility**. Some things (art, moments, specific states) cannot survive a total loss of structure, even if the "stuff" remains. This is tragic and poetic.
  *   **The Synthetic Replacement** represents **Resilience**. We survive the death of our cells every day; we are patterns, not particles.
  *   **The Scan/Duplicate** represents **Uniqueness**. The soul (or self) cannot be in two places at once without fracturing.

  If you force a single material principle (e.g., "Matter is all that matters"), you lose the nuance of the Person vs. Statue distinction. If you force a single formal principle ("Form is all that matters"), you lose the tragedy of the Ice Sculpture.

  **The "Sortal-Relative" view validates all your intuitions by acknowledging that different kinds of things have different rules for survival.**
  *   Statues survive matter replacement but not form loss.
  *   Ice sculptures survive neither matter phase-change nor form loss.
  *   Persons survive matter replacement and substrate transfer, but not branching.

  ### How to Use This in Your Novel

  The philosophical consistency here provides a scaffold, but the *ambiguity* provides the drama.

  For the Upload Case, your principle predicts the Upload is the survivor. But consider the **Uncanny Valley of Identity**. Even if the Upload *is* the protagonist by the rules of continuity, how does it *feel*?
  *   Does the Upload feel like a survivor (Verdict 3)?
  *   Or does it feel like a copy who inherited the memories of a unconscious person (Verdict 2/5)?

  Your character's *doubt* about their own status is more compelling than the metaphysical truth. You can have a world where the law says the Upload is the person (based on Continuity), but the protagonist feels like the Ice Sculpture (refrozen, slightly different, haunted by the fact that they "melted").

  **Summary:** Keep all five verdicts. They are consistent under **Sortal-Relative Causal Continuity**. For the Upload, the principle dictates the digital mind is the survivor, provided the biological mind remains silent. If the biological mind wakes, you have created the ultimate conflict: two souls, one history, and no metaphysical way to choose between them. That is where your story lives.
