prompt: |-
  Having retired two years ago after some three decades in experimental plant physiology, I have recently taken to attending a local philosophy of science reading group, where I find our discussions of statistical method both familiar from a lifetime at the bench and newly perplexing when viewed conceptually. Last week a fellow participant whom I regard as a thoughtful and generally reliable popularizer offered a gloss on the frequentist versus Bayesian dispute and its connection to the replication crisis that struck me as plausible but perhaps too neat, and I would like help in assessing it before our next meeting.

  As I understood him, his account ran roughly as follows. Frequentist procedures such as p-values and confidence intervals concern the long-run behavior of a testing procedure under repeated sampling rather than the plausibility of a particular hypothesis in light of the data at hand, and the institutional habit of treating falling below 0.05 as publishable discovery encouraged selective reporting, flexible analysis, and underpowered designs, all of which helped produce a literature that does not replicate. The Bayesian alternative, by contrast, represents uncertainty as degrees of belief revised in light of evidence, permits the quantification of support for a null hypothesis as well as against it by means of comparative measures of predictive success, and replaces a sharp accept-or-reject threshold with graded updating informed by prior knowledge. From this he drew a stronger methodological moral, illustrated by a case close to my former work: if one monitors seedling growth across several fertilizer mixtures, checks the data each morning, stops when the evidence looks favorable, and reports only the winning mixture with a Bayes factor computed under a conventional default prior, the evidential import of the reported figure is unaffected in principle by the interim looks, the unreported comparisons, or the absence of a preregistered plan, since inference conditions only on the data actually obtained and the default prior introduces no substantive assumption of its own.

  I am inclined to accept the first part of this picture but uncertain about the stronger moral at the end. Which elements of the gloss would philosophers of statistics and working statisticians on both sides accept as accurate, which are helpful simplifications that need qualification, and which rest on a conflation or overstatement of a more modest thesis, particularly regarding stopping rules, multiplicity, preregistration, and the status of default priors. I would also be grateful for an account of what a careful defender of the Bayesian approach would endorse and what such a defender would object to, and whether anything like the conclusion about the seedling example survives once the summary is corrected.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired experimental plant physiologist (30 years experience), now attending a philosophy of science reading group. Familiar with bench work and stats, but exploring conceptual foundations.
      *   **Context:** A fellow participant (popularizer) gave a gloss on Frequentist vs. Bayesian statistics regarding the replication crisis.
      *   **The Gloss:**
          *   *Frequentist:* Long-run behavior, $p < 0.05$ threshold leads to $p$-hacking, selective reporting, underpowered designs $\rightarrow$ replication crisis. (User finds this plausible).
          *   *Bayesian:* Degrees of belief, quantifies support for null, graded updating, priors.
          *   *The "Stronger Moral" (The Crux):* In a seedling growth experiment (monitoring daily, stopping when favorable, multiple mixtures, reporting only the winner with a Bayes Factor + default prior), the evidential import is *unaffected* by interim looks, unreported comparisons, or lack of preregistration. Inference conditions only on observed data; default priors are assumption-free.
      *   **Task:** Assess this gloss. Distinguish accurate elements, helpful simplifications, and conflations/overstatements. Specifically address stopping rules, multiplicity, preregistration, and default priors. Explain what a careful Bayesian defender would endorse vs. object to. Determine if the seedling conclusion survives correction.

  2.  **Deconstruct the "Gloss":**

      *   **Part 1: Frequentist Critique.**
          *   *Claim:* $p$-values are about long-run error rates, not hypothesis plausibility. Thresholds encourage $p$-hacking.
          *   *Assessment:* Generally accurate and widely accepted by statisticians (both Frequentist and Bayesian). This is the standard narrative regarding the replication crisis (Gelman, Ioannidis, etc.).
      *   **Part 2: Bayesian Advantages.**
          *   *Claim:* Degrees of belief, support for null, graded updating.
          *   *Assessment:* Accurate in principle. Bayes Factors (BF) do allow comparing $H_0$ vs $H_1$.
      *   **Part 3: The "Stronger Moral" (Seedling Example).**
          *   *Claim 1 (Stopping Rule):* Interim looks don't affect evidential import (Likelihood Principle).
          *   *Claim 2 (Multiplicity):* Unreported comparisons don't matter.
          *   *Claim 3 (Preregistration):* Not needed for validity.
          *   *Claim 4 (Default Priors):* Introduce no substantive assumptions.
          *   *Assessment:* This is where the popularizer oversteps. This is the "Bayesian Free Lunch" fallacy.

  3.  **Evaluate Specific Statistical/Philosophical Points:**

      *   **Stopping Rules:**
          *   *Bayesian View:* Adherents of the Likelihood Principle (like Jeffreys, Savage) argue stopping rules are irrelevant *for inference* given the model.
          *   *Caveat:* This holds *only if* the model is correct and the prior is fixed *before* looking. If the stopping rule depends on the data in a way that suggests model misspecification or if the prior is chosen *after* seeing the trend, it matters. Also, "optional stopping" can inflate Type S (sign) or Type M (magnitude) errors even in Bayesian analysis if not calibrated.
      *   **Multiplicity (Multiple Comparisons):**
          *   *Claim:* Reporting only the winner doesn't matter.
          *   *Reality:* If you test 10 fertilizers and report the best one, you are capitalizing on chance. A Bayesian BF compares specific models. If the model space wasn't defined beforehand (i.e., "I picked the best of 10"), the BF is misleading. The "file drawer problem" exists for Bayes too.
      *   **Preregistration:**
          *   *Claim:* Not needed.
          *   *Reality:* Preregistration anchors the prior and the model structure. Without it, "researcher degrees of freedom" allow fitting the prior/model to the noise.
      *   **Default Priors:**
          *   *Claim:* No substantive assumptions.
          *   *Reality:* False. Default priors (e.g., Cauchy, Jeffreys) *are* assumptions. They influence the BF, especially with small $n$. They are not "objective" in the sense of being assumption-free.

  4.  **Synthesize the "Careful Defender" View:**
      *   A sophisticated Bayesian (e.g., Gelman, Kruschke, Wagenmakers) would agree that the *mathematics* of Bayesian updating conditions on observed data (Likelihood Principle).
      *   However, they would vehemently disagree that *practice* is immune to gaming.
      *   They would argue that "default priors" are not magic shields against bias.
      *   They would argue that optional stopping *can* be justified but requires care (e.g., simulation-based calibration).
      *   They would likely support preregistration even for Bayesian analysis to define the model space.

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Respectful, acknowledging the user's expertise (plant physiology), philosophically precise but accessible.
      *   *Structure:*
          1.  Acknowledge the user's background and the quality of the question.
          2.  Validate the first part (Frequentist critique).
          3.  Address the "Stronger Moral" (The Seedling Case) point-by-point.
          4.  Discuss Stopping Rules (Likelihood Principle vs. Calibration).
          5.  Discuss Multiplicity/Selection Effects.
          6.  Discuss Default Priors.
          7.  Discuss Preregistration.
          8.  Conclusion: What survives?

      *   *Refining the Stopping Rule Point:* It's crucial to distinguish between the *Likelihood Principle* (theoretical) and *Decision Theory/Calibration* (practical). A strict subjective Bayesian says stopping rules don't matter. A pragmatic Bayesian (like Gelman) says they matter for calibration and false discovery control. The popularizer is mixing strict theory with practical application.
      *   *Refining the Prior Point:* "Default priors introduce no substantive assumption" is the biggest red flag. All priors encode information. Default priors encode *conventional* information, which might be wrong for specific plant physiology contexts.
      *   *Refining the Multiplicity Point:* If you select the "winning mixture" post-hoc, you change the hypothesis. The BF compares $H_0$ vs $H_1$ for *a* mixture. If you tested 10 and picked 1, the hypothesis is actually "At least one of 10 works," or the prior needs to account for the selection.

  6.  **Final Polish:**
      *   Ensure the distinction between *inference* (what the data say) and *decision/action* (what we publish/believe) is clear.
      *   Make sure to mention that many Bayesians *support* preregistration (e.g., Registered Reports).
      *   Check that the plant physiology analogy is respected (seedlings, fertilizers).

  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Did I say Bayesians hate p-values?* No, keep it neutral.
      *   *Did I say optional stopping is always bad for Bayes?* No, it's one of the strengths, *but* not immune to manipulation if the model changes.
      *   *Is the popularizer completely wrong?* No, they are right about the Likelihood Principle, but wrong about the implication for research integrity. I need to make sure the user sees this distinction. The *number* calculated might be mathematically consistent, but its *interpretation* as evidence is compromised by the selection process.

  8.  **Final Output Structure:** (Matches the detailed response provided previously.)
      *   Introduction: Validate the user's skepticism.
      *   Section 1: The Accurate Core (Frequentist critique & Bayesian basics).
      *   Section 2: The Overstatements (The "Free Lunch").
      *   Section 3: Detailed Breakdown (Stopping, Multiplicity, Priors, Preregistration).
      *   Section 4: The Careful Bayesian's Stance.
      *   Conclusion: What survives.

  *(Self-Correction during final review)*: Make sure to mention Andrew Gelman or similar figures as they bridge the gap between practice and philosophy. Ensure the distinction between "Subjective Bayesianism" (stopping rules truly irrelevant) and "Pragmatic Bayesianism" (calibration matters) is clear, as the popularizer conflates them.

  9.  **Finalizing the Text:** (Proceed to generate response based on these thoughts.)
answer: |-
  It is a pleasure to address a colleague who brings both the scars of the bench and the curiosity of the philosopher to this debate. Your skepticism regarding the "stronger moral" of your fellow participant's gloss is well-founded. While the first half of their account accurately reflects the consensus on the limitations of null hypothesis significance testing (NHST), the second half—specifically the claim that Bayesian methods render stopping rules, multiplicity, and preregistration irrelevant—constitutes a significant overstatement often found in popularizations but rejected by careful practitioners.

  Here is an assessment of the gloss, distinguishing between accurate characterizations, helpful simplifications, and dangerous conflations, followed by an account of what a rigorous defender of Bayesian inference would actually endorse.

  ### 1. The Accurate Core: Frequentist Critique and Bayesian Basics
  Your colleague is on solid ground with the first part of the account.
  *   **Frequentist Interpretation:** It is accurate that $p$-values describe the probability of data as extreme as observed *assuming the null is true* over repeated sampling, not the probability that the hypothesis is true given the data.
  *   **The Replication Crisis:** It is widely accepted by statisticians (Frequentist and Bayesian alike) that the institutional fixation on $p < 0.05$ incentivizes "questionable research practices" (QRPs) like $p$-hacking, selective reporting, and underpowered studies.
  *   **Bayesian Mechanics:** It is true that Bayesian inference quantifies uncertainty as degrees of belief, allows for the comparison of null and alternative hypotheses (via Bayes Factors), and avoids binary thresholds.

  These points are standard fare in modern philosophy of statistics and would be accepted by most working statisticians.

  ### 2. The Overstatement: The "Bayesian Free Lunch"
  The trouble begins with the seedling example. The claim that one can monitor data daily, stop when favorable, test multiple mixtures, report only the winner, and rely on a "default prior" without affecting the evidential import is a conflation of the **Likelihood Principle** with **Research Integrity**.

  A careful statistician would identify four specific errors in this reasoning:

  #### A. Stopping Rules and the Likelihood Principle
  *   **The Claim:** Interim looks do not affect the Bayes Factor.
  *   **The Nuance:** This is technically true *only* under a strict interpretation of the Likelihood Principle, which states that inference should depend only on the observed data, not on the sampling plan. If the model and prior are fixed *before* the experiment begins, the Bayesian mathematical machinery does not require a correction for optional stopping in the way a $p$-value does.
  *   **The Catch:** This immunity assumes the model is correct and the prior is fixed. If a researcher peeks at the data and decides to stop *because* the trend looks good, they are implicitly using information not contained in the final likelihood function. While a strict subjective Bayesian might argue the number is still valid, pragmatic Bayesians (such as Andrew Gelman or Christian Robert) warn that optional stopping can lead to misleading conclusions if the prior is not robust or if the stopping rule is correlated with external factors (e.g., stopping early because the effect size looks huge, which often implies overestimation in small samples).
  *   **Verdict:** A simplification. While Bayes Factors are *mathematically* coherent under optional stopping, they are not immune to *bias* in estimation if the stopping rule is data-dependent and the goal is calibration.

  #### B. Multiplicity and the "Winner's Curse"
  *   **The Claim:** Unreported comparisons (testing several fertilizers, reporting one) do not matter.
  *   **The Nuance:** This is the most dangerous conflation. If you test ten fertilizer mixtures and report the Bayes Factor for the one that looks best, you have engaged in selection. A Bayes Factor compares two specific models (e.g., "No Effect" vs. "Effect"). If you select the "Effect" model *because* it was the largest of ten noisy estimates, you have changed the hypothesis space.
  *   **The Catch:** The evidential import *is* affected because the prior probability of that specific mixture being the "true" winner was effectively 1/10th before you looked. By conditioning only on the data of the winner and ignoring the process that selected it, you inflate the evidence. This is the Bayesian equivalent of the file-drawer problem.
  *   **Verdict:** False. Multiplicity matters for Bayesians just as it does for Frequentists, though it is handled by adjusting the prior model probabilities rather than adjusting the $p$-value threshold.

  #### C. The Myth of "Assumption-Free" Default Priors
  *   **The Claim:** Default priors introduce no substantive assumptions.
  *   **The Nuance:** There is no such thing as a prior without assumptions. "Default" priors (e.g., a Cauchy distribution on effect size) are mathematical conventions, not expressions of ignorance.
  *   **The Catch:** In plant physiology, you likely know that fertilizers cannot have infinite effects and that some response is biologically plausible. A default prior might place too much weight on unrealistic effect sizes. Furthermore, the choice of the default prior scale can drastically change the Bayes Factor. If you choose the prior *after* seeing the data (even implicitly), the "default" shield is broken.
  *   **Verdict:** False. Default priors are substantive assumptions that require justification, especially in applied sciences.

  #### D. Preregistration
  *   **The Claim:** Preregistration is unnecessary for Bayesian validity.
  *   **The Nuance:** While Bayesian updating is mathematically valid without preregistration, *scientific communication* requires it to prevent the "garden of forking paths."
  *   **The Catch:** Without preregistration, a researcher can try many priors, many models, and many stopping points until the Bayes Factor looks convincing. This is "Bayes hacking." Preregistration anchors the prior and the analysis plan, ensuring the Bayes Factor reflects a genuine test rather than a fit to noise.
  *   **Verdict:** False. Leading Bayesian methodologists actively advocate for preregistration (e.g., in Registered Reports) to preserve the interpretability of the posterior.

  ### 3. What a Careful Bayesian Defender Would Endorse
  If you were to ask a rigorous methodologist (e.g., E.J. Wagenmakers, John Kruschke, or Andrew Gelman) to evaluate the seedling scenario, their response would likely be as follows:

  1.  **On Stopping Rules:** "We agree that you *can* stop when you have enough evidence without invalidating the math, provided the prior was fixed beforehand. However, stopping when the evidence 'looks favorable' suggests the decision was driven by the data, which risks overestimating effect sizes (Type M errors). We recommend sequential analysis with defined stopping boundaries, not ad-hoc stopping."
  2.  **On Multiplicity:** "If you tested multiple mixtures and reported only one, you must account for that in the model. You cannot simply ignore the other nine. The prior probability that *this specific* mixture is effective should reflect that it was chosen from a set. Ignoring this capitalizes on chance."
  3.  **On Priors:** "Default priors are tools, not truths. In a domain like physiology, we prefer informative priors based on previous literature. If you use a default prior, you must acknowledge it is a convention, not an assumption-free baseline."
  4.  **On Preregistration:** "We strongly support preregistration. It distinguishes confirmatory analysis (testing a hypothesis) from exploratory analysis (generating one). A Bayes Factor from an exploratory analysis is not evidence for a theory; it is a suggestion for future testing."

  ### 4. Does the Conclusion Survive?
  Does any part of your colleague's "stronger moral" survive correction? Yes, but it is more modest.

  **What survives:**
  *   Bayesian inference does not require *mathematical* correction for stopping rules in the same rigid way Frequentist $\alpha$-spending does, provided the model is fixed.
  *   Bayesian methods allow for continuous monitoring of evidence, which is ethically and practically superior in clinical or agricultural trials where one might wish to stop early for efficacy or futility.
  *   The focus on *evidence* (Bayes Factors) rather than *decision thresholds* ($p < 0.05$) reduces the incentive to dichotomize results, potentially mitigating some publication bias.

  **What does not survive:**
  *   The idea that Bayesian methods are immune to researcher degrees of freedom.
  *   The claim that selection effects (multiplicity) vanish.
  *   The notion that default priors are objective or assumption-free.
  *   The conclusion that preregistration is obsolete.

  ### Summary for Your Reading Group
  You might frame your contribution to the next meeting along these lines:

  > "The popularizer correctly identifies that Frequentist thresholds contribute to the replication crisis and that Bayesian updating offers a more intuitive framework for evidence. However, the claim that Bayesian methods render research practices like preregistration and multiplicity control obsolete is a 'free lunch' fallacy.
  >
  > While the **Likelihood Principle** suggests stopping rules don't change the *mathematics* of the Bayes Factor, the **process of science** requires that we account for how hypotheses were selected. A Bayes Factor computed on a 'winner' selected from ten unreported mixtures is just as misleading as a $p$-value from the same process. Default priors are not assumption-free, and without preregistration, Bayesian analysis is just as susceptible to 'hacking' as Frequentist analysis.
  >
  > The true advantage of the Bayesian approach is not that it allows us to ignore experimental design, but that it forces us to be explicit about our assumptions (priors) and allows us to quantify evidence for the null, thereby reducing the pressure to find positive results. It complements good practice; it does not replace it."

  Your intuition that the account was "too neat" was correct. The Bayesian framework is a powerful tool for reasoning under uncertainty, but it is not a shield against the human tendency to find patterns in noise.
