answer: |-
  Let me think out loud for a moment before I give you the structured diagnosis.

  This is the Chalmersian knot, plain and simple. You are describing the "Paradox of Phenomenal Judgment" from *The Conscious Mind*, and the fact that your group is having the exact same exchange six or seven times tells me they have hit a bedrock clash of explanatory ideals. Your hypothesis—that this is a collision between a counterfactual theory of tracking (Skeptic) and a regularity theory (Defender)—is astute. It captures the semantic surface of the dispute. If "tracking" requires counterfactual dependence (if the qualia were different, the report would differ), epiphenomenalism fails. If "tracking" only requires actual-world correlation (the report matches the qualia), epiphenomenalism passes.

  But I suspect your hypothesis might be slightly too charitable to the idea that this is merely a verbal dispute about the definition of "tracking" or "aboutness." If it were just semantics, one side would usually concede the terminology and move to the substantive point. The fact that they aren't suggests the semantics are standing in for a deeper epistemic norm. The Skeptic isn't just saying "Your words don't mean what you think they mean"; they are saying "Your belief is not *justified*." The Defender isn't just saying "My words are fine"; they are saying "My belief is as secure as yours." The "self-undermining" charge is an epistemic worry about coincidence, not just a semantic worry about reference. The Skeptic sees the psychophysical law as a *cosmic coincidence* that needs a causal explanation to be believed; the Defender sees it as a *brute nomic fact* that doesn't. So, the disagreement isn't just about counterfactuals; it's about where explanation is allowed to stop. Is "because it is a law" a sufficient answer to "why do they match?" For the Skeptic, no, not when the law connects causally isolated domains. For the Defender, yes, because all fundamental laws are brute.

  Okay, I think I have the shape of it. It's not just counterfactuals vs. regularities; it's a clash over the *epistemic cost of brute correlation*. Let me formalize this diagnosis for you.

  ***

  ### Diagnosis: The Structure of the Stalemate

  You are right to suspect that the two sides are operating with different demands on explanation, but I would push your hypothesis slightly further. It is not merely a disagreement about a **theory of reference** (counterfactual vs. regularity), but a disagreement about **epistemic access and the nature of coincidence**.

  Here is the breakdown of why this specific argument loops endlessly.

  #### 1. The Surface Disagreement: Your Hypothesis
  Your diagnosis is correct that the Skeptic is implicitly relying on a **counterfactual sensitivity condition** for knowledge or reliable judgment, while the Defender is relying on a **reliabilist/regularity condition**.
  *   **The Skeptic:** To say my judgment "tracks" my experience, it must be that *were* my experience different, my judgment would be different. Since epiphenomenalism severs the causal link, there is no mechanism to ensure this counterfactual holds. The correlation is fragile across possible worlds.
  *   **The Defender:** Tracking only requires that in the *actual* world, the judgment reliably co-varies with the experience according to psychophysical laws. Since the laws are necessary (or at least stable), the counterfactuals hold *in virtue of the laws*, even without causation.

  If the debate stopped here, you could resolve it by stipulating definitions. But it doesn't stop here. That's because the definitions are proxies for a deeper worry.

  #### 2. The Deep Disagreement: The "Cosmic Coincidence" Worry
  The real engine of the fight is the Skeptic's claim that the theory is **self-undermining**. This is not just a claim about semantics; it is a claim about *probabilistic coherence*.
  *   **The Skeptic's Hidden Premise:** A correlation between two distinct ontological domains (physical brain states and non-physical qualia) that lacks a causal mechanism is, *prima facie*, a massive coincidence. To accept it as a brute law is to accept a "pre-established harmony." In a naturalistic framework, the prior probability of such a harmony is vanishingly low. Therefore, believing the theory undermines the rationality of holding the belief (since the belief is caused by the physical side of the harmony, not the truth of the harmony).
  *   **The Defender's Hidden Premise:** All fundamental explanations bottom out in brute laws. Physicalists have brute psychophysical laws too (e.g., N&rightarrow;Q, or even just the laws of physics themselves). The epiphenomenalist is simply being more honest about where the bruteness lies. The "coincidence" is only surprising if you assume causal closure is more fundamental than nomic correlation, which is question-begging.

  The reason the "tu quoque" move ("Physicalists face this too!") doesn't budge the Skeptic is that the Skeptic sees a **disanalogy in explanatory depth**. For the physicalist, the correlation between brain state and judgment is *constitutive* or *causal* (same ontological domain). For the epiphenomenalist, the correlation is *nomological* across *distinct ontological domains*. The Skeptic views the latter as requiring a "miracle" (in Wittgenstein's sense) that the former does not. The Defender views the distinction as illusory because *all* fundamental laws are opaque.

  #### 3. Is There a Hidden Substantive Question?
  You asked if there is a hidden empirical or probabilistic question underneath. **Yes.**
  The dispute is effectively a Bayesian disagreement about the **prior probability of brute psychophysical laws**.
  *   **Skeptic:** P(Brute Dualistic Law | Naturalism) is very low. It looks like magic.
  *   **Defender:** P(Brute Dualistic Law | Naturalism) is comparable to P(Brute Physicalist Law | Naturalism). The "magic" is already in the system; epiphenomenalism just locates it differently.

  This is why the debate feels verbal but acts substantive. They are arguing about *surprise*. The Skeptic is surprised by the correlation; the Defender is not. There is no fact of the matter that can settle "how surprised a rational agent ought to be by brute nomic connections between distinct substances." This is a clash of **explanatory ideals**.

  ### What Counts as Progress?

  Given this diagnosis, asking "Who is right?" is indeed ill-posed, because there is no shared metric for weighing the cost of "brute laws" against the cost of "causal otiosity." However, you can move the group from a loop to a map. Here is what progress looks like:

  **1. Stop arguing about "Tracking"; argue about "Coincidence."**
  Shift the terminology. Ask the Skeptic: "Is your objection that the judgment is *false*, or that it is *unjustified*?" (It's the latter). Ask the Defender: "Do you admit that on your view, the correlation is brute, or do you think it is derived from something deeper?" (It's brute).
  Once you admit it is brute, the question becomes: **Is a brute nomic correlation between distinct ontological categories epistemically fatal?**
  *   If the Skeptic says "Yes," they must defend the principle that *causal connection is necessary for justification across categories*.
  *   If the Defender says "No," they must defend the principle that *nomic correlation is sufficient for justification, regardless of ontology*.
  This forces them to fight on epistemology, where the disagreement is clearer, rather than on philosophy of mind, where it is obscured by the "paradox."

  **2. Distinguish Reliability from Rationality.**
  The Defender is arguing that the process is *reliable* (it produces true beliefs). The Skeptic is arguing that the believer is not *rational* (they cannot cite the truth-maker as a reason).
  *   **Progress:** Acknowledge that Epiphenomenalism might allow for *reliable* beliefs (the world is set up such that you are right) without allowing for *rationally accessible* beliefs (you cannot know *why* you are right).
  *   If the Defender accepts this, they concede the Skeptic's point that the theory is "self-undermining" in a pragmatic sense (I can't recommend you believe it for reasons), even if it is true.
  *   If the Skeptic accepts this, they concede the Defender's point that the theory *could* be true, even if we can't rationally hold it.
  This dissolves the "fatal" nature of the paradox into a tragic limitation of the human epistemic position.

  **3. Acknowledge the "Cost Distribution" Stalemate.**
  Finally, be honest with the group: This is a **theoretical virtue trade-off**.
  *   **Physicalism** saves causal closure and epistemic access but struggles with the explanatory gap (why does *this* brain state feel like *this*?).
  *   **Epiphenomenalism** saves the reality of qualia and the explanatory gap (by positing them as brute) but sacrifices causal efficacy and epistemic access.
  The "Paradox of Phenomenal Judgment" is just the Epiphenomenalist's bill coming due. The "Hard Problem" is the Physicalist's bill coming due.
  **Progress** is recognizing that neither side can win because they are paying different bills. The Skeptic refuses to pay the epistemic bill; the Defender refuses to pay the phenomenological bill.

  ### Summary Recommendation
  Your hypothesis was close, but it treated the disagreement as semantic (what does "tracking" mean?). I suggest you reframe it for the group as **epistemic** (what justifies belief in a brute correlation?) and **probabilistic** (how surprising is a dualistic law?).

  Tell them: *"We are stuck because the Skeptic thinks brute dualistic laws are miraculous, and the Defender thinks brute physicalist laws are equally miraculous. We aren't going to solve the paradox; we are just weighing which miracle we prefer. Let's stop trying to prove the other side irrational and admit we have different tolerances for brute coincidence."*

  That won't solve the problem, but it might stop the fight.
