answer: |-
  Thanks for sending this over. It is ambitious to try to synthesize Caruso's hard incompatibilism with Dennett's pragmatism while keeping some retributive intuitions, but that is exactly what makes it interesting. You asked me to be direct about where this hangs together and where it falls apart, so I will not sugarcoat the tensions. You have three main friction points here, and they are not all equally dangerous.

  The most severe tension is between your second and third points. You argue for a public health model where punishment is justified solely by threat neutralization, yet you also want to punish attempts less than completed crimes even when the difference is purely luck. If the justification is forward-looking risk management, then the dangerousness of the agent is what matters, not the outcome. An attempted murderer whose gun jams is just as dangerous as one whose gun fires. Giving them a discount contradicts the logic of quarantine. You cannot consistently hold that punishment is only about neutralizing threats and also that luck-based outcomes should mitigate sentencing. This is the spot where a legal theory audience will attack first because it undermines the internal coherence of your penal proposal. The cheapest fix here is to bite the bullet and align sentencing strictly with risk assessment, eliminating the completion discount for luck-based cases, though I know that is a hard pill to swallow.

  The second most severe tension is between your first and fourth points. You deny basic desert moral responsibility universally, yet you claim reactive attitudes like resentment are genuinely fitting and that grim satisfaction is a real reason rather than a useful fiction. In standard philosophical usage, if an attitude is fitting, it is because the object deserves it. If no one is morally responsible in the basic sense, it is very hard to argue that resentment is fitting rather than just inevitable or functionally useful. By calling it fitting, you risk smuggling basic desert back in through the back door, which undermines your core skeptical premise. The cheapest fix is to reframe these attitudes as non-cognitive responses that are socially functional or psychologically inevitable without endorsing their normative fittingness, but you seem attached to the realism of the sentiment.

  The third tension is between your second and sixth points. You want punishment to be purely forward-looking, but you also want to keep desert talk in the law via P-desert. If P-desert is robust enough to support desert talk, you need to clarify whether it does any justificatory work. If it does, it conflicts with the claim that only forward-looking considerations justify punishment. If it does not, it is merely decorative. This is manageable if you treat P-desert as a procedural constraint or a labeling practice rather than a justification, but it requires careful wording to avoid equivocation.

  Ranking these by severity for your specific context, the conflict between the public health model and the completion discount is the most damaging because it creates a structural inconsistency in your legal theory. The metaphysical tension between skepticism and fitting resentment is deep, but you can plausible argue for a revisionist account of fittingness. The penal inconsistency is harder to explain away without abandoning the public health model itself.

  If I have to commit to which single revision would clean up the most, I would drop the third point about the completion discount. I know this feels counterintuitive and goes against current legal practice, but keeping it forces you to admit that harm matters independently of dangerousness, which opens the door to retributivism and undermines your forward-looking justification. By dropping the completion discount for luck-based non-completion, you preserve the integrity of the quarantine model and maintain consistency with your skepticism about basic desert. The cost is that you will have to defend a system where attempted and completed crimes receive similar sanctions when risk is equal, which will provoke pushback from those committed to retributive proportionality. However, this is a stronger, more defensible position than trying to square the circle of risk-based punishment with outcome-based sentencing. It allows you to stand firmly on the skeptical ground you claimed in the first point without compromising the penal theory in the second.
