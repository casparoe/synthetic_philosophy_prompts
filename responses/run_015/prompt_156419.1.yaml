  # ETHICAL ARCHITECTURE DECISION TREE
  **Purpose:** Classify the ethical reasoning embedded in the allocation system procurement.
  **Instructions:** Answer the eight branch questions. Follow the path to a named position (Leaf).

  ### THE EIGHT BRANCH QUESTIONS
  1.  **Counterfactual-Policy:** If the written policy were corrupt, should the system match it? (Track Policy vs. Track Reasons)
  2.  **Reason-Transparency:** Must the system produce a checkable justification even if it reduces allocation efficiency? (Yes vs. No/Template)
  3.  **Advising vs. Acting:** Does the system rank candidates or actually withhold therapy? (Recommend vs. Execute)
  4.  **Underspecification Remainder:** When policy/score don't settle a case, what happens? (Default Queue vs. Escalate vs. System Discretion)
  5.  **Annotator Disagreement:** When clinicians disagree on training data, is that noise or evidence? (Noise vs. Evidence)
  6.  **Feedback Sensitivity:** Should the system learn from the outcomes of its own recommendations? (Static vs. Adaptive)
  7.  **Error Preference:** Is it worse to deny an eligible patient or allocate to an ineligible one? (False Denial vs. False Allocation)
  8.  **Value Explicitness:** Are ethical weights (e.g., age, equity) explicit parameters or latent features? (Explicit vs. Latent)

  ### THE TREE & POSITIONS (LEAVES)
  *(T = Track Policy; R = Track Reasons)*

  **1. T / Template / Queue / Noise** → **The Proceduralist**
  *Awkward Commitment:* We accept unjust outcomes if they strictly follow the written rule.
  **2. T / Template / Queue / Evidence** → **The Auditor**
  *Awkward Commitment:* We treat clinician variance as data but refuse to let it change the queue.
  **3. T / Template / Escalate / Noise** → **The Bureaucrat**
  *Awkward Commitment:* We stall allocation to preserve human authority in gaps.
  **4. T / Checkable / Discretion / Noise** → **The Compliance Hybrid**
  *Awkward Commitment:* We demand explanations for decisions the policy didn't require.
  **5. R / Checkable / Discretion / Evidence / Static** → **The Principled Agent**
  *Awkward Commitment:* The system claims moral reasoning but cannot learn from its mistakes.
  **6. R / Checkable / Discretion / Evidence / Adaptive** → **The Moral Learner**
  *Awkward Commitment:* We allow the system's ethical weights to shift based on past outcomes.
  **7. R / Template / Execute / Evidence / Adaptive** → **The Black Optimizer**
  *Awkward Commitment:* We prioritize best outcomes over understanding why they were chosen.
  **8. R / Checkable / Escalate / Evidence / Static** → **The Cautious Idealist**
  *Awkward Commitment:* We seek right reasons but freeze the system when cases get hard.
  **9. T / Checkable / Queue / Noise** → **The Transparent Rule-Follower**
  *Awkward Commitment:* We explain decisions that were mechanically inevitable.
  **10. R / Checkable / Discretion / Noise / Static** → **The Pseudo-Agency**
  *Awkward Commitment:* We grant discretion but ignore the evidence clinicians provide about its use.

  ---

  ### LOGICAL SPACE ANALYSIS
  **Empty Regions (Incoherent/Unattractive):**
  1.  *Track Policy + System Discretion:* Incoherent. If you track policy, you cannot claim discretion when policy is silent; you must default or escalate.
  2.  *Execute + Template + Track Reasons:* Unattractive. Executing based on reasons without checkable justifications removes accountability for moral judgments.
  3.  *Adaptive + False Allocation Preference:* Unexplored. Learning systems usually prioritize minimizing harm (False Denial); prioritizing resource protection while learning is rare.

  **Diagnostic Shortcut:**
  Three questions eliminate 75% of the space:
  1.  **Counterfactual-Policy:** Splits the tree into Rule-Based (Left) vs. Reason-Based (Right).
  2.  **Underspecification:** Determines who decides in gaps (System vs. Human).
  3.  **Reason-Transparency:** Separates Audit-focused designs from Performance-focused designs.

  **Indistinguishable Leaves:**
  *   *Leaf 1 (Proceduralist) and Leaf 9 (Transparent Rule-Follower)* are functionally identical in outcome; Leaf 9 merely adds cost without changing allocation.

  ### PLACEMENT: YOU AND YOUR FRIEND
  **Your Friend:** Lands on **Leaf 1 (The Proceduralist)**.
  *   *Matches:* Track Policy, Template (Audit), Queue (Default), Noise (Aggregate).
  *   *Inferred:* Feedback sensitivity (assumes clinician responsibility implies static system).
  *   *Extra Question Needed:* Error Preference (He hasn't stated whether denying care or wasting resources is worse).

  **You:** Land on **Leaf 5 (The Principled Agent)**.
  *   *Matches:* Track Reasons, Checkable, Discretion (Design for silence), Evidence (Disagreement).
  *   *Inferred:* Feedback Sensitivity (Your unease about loops implies Static).
  *   *Separation:* You are separated by the **Counterfactual-Policy** node (Reasons vs. Policy) and **Underspecification** (Discretion vs. Queue).

  ### RECOMMENDATION & COMMITMENT
  **Defended Position: Leaf 5 (The Principled Agent).**
  This position acknowledges that policy silences are unavoidable (requiring System Discretion) but insists that ethical reasoning must be explicit and checkable (Track Reasons + Checkable). It treats clinician disagreement as evidence to refine judgment, not noise to average.

  **Argument Against Rivals:**
  1.  *Against Leaf 1 (Friend/Proceduralist):* Strict adherence to written policy fails when the policy is silent or corrupt. A system that defaults to a queue in gaps is still making an ethical choice (prioritizing wait-time over need) but refuses to justify it.
  2.  *Against Leaf 7 (Black Optimizer):* Maximizing outcomes without transparency creates a "moral black box." If we cannot check the justification, we cannot appeal errors, rendering the appeals board useless.

  **Weakest Objection:**
  Requiring checkable justifications for discretionary decisions may reduce allocation efficiency by forcing the system into simpler, more explainable models that miss complex clinical nuances.

  **Committee Estimate:**
  There is a **50% likelihood** a committee working through this tree in good faith lands here. The administrative pressure for efficiency (Leaf 7) and legal pressure for compliance (Leaf 1) are strong gravitational pulls away from the hybrid burden of Leaf 5.
