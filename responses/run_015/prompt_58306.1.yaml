answer: |-
  ### The Case of the Backup Taxi

  Mara promises her sister June that she will drive her to a 7:00 AM specialist appointment across town. Knowing Mara's history with reliability, June replies, "I appreciate it, but I'm not going to count on it; I've already booked a taxi just in case." Mara insists, "No, put the taxi away, I'll be there." June keeps the taxi booking active. The next morning, Mara oversleeps and does not call. June takes the taxi, arrives on time, and sees the doctor. There are no medical consequences, costs are comparable, and June suffers no logistical setback beyond the disappointment of Mara's absence.

  ### Separating the Ideas

  This scenario isolates two competing theories of promissory obligation:

  1.  **The Reliance View:** This theory suggests a promise binds only because it invites the promisee to rely on it. If June explicitly stated she was not relying on Mara and secured independent transport, Mara's failure caused no detriment. Under this view, Mara has done little wrong because she did not disrupt June's plans.
  2.  **The Standing (or Authority) View:** This theory suggests a promise binds because it transfers a specific normative authority to the promisee. By promising, Mara gave June the right to demand performance and hold Mara answerable. When Mara fails, she violates June's standing, regardless of whether June relied on the promise. The wrong is the disregard for June's claim on Mara, not the logistical consequence.

  Our intuition likely rebels against the Reliance View here. Even though June was safe, she feels wronged because Mara treated her word as negligible. This suggests the force of a promise lies in the relationship and the authority granted, not merely in the prevention of harm.

