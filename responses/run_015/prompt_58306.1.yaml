    "intuition": "Mara still wronged June by violating her right to expect performance, causing relational harm and diminishing June's standing rather than practical harm.",
    "verdict": "The intuition favors the standing-based view, as the moral wrong persists despite absent reliance, grounding obligation in the transfer of authority rather than consequence prevention.",
    "staging": "Have June reject Mara's apology that 'nothing bad happened' by insisting that being someone June could count on mattered more than the ride itself."
  }
