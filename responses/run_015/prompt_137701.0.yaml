  ### Glossary of Technical Names

  *   **Total Utilitarianism:** The view that the right act is the one that brings about the most total happiness. More happy people = better.
  *   **Person-Affecting View:** The view that an act can only be wrong if it is bad *for* some particular person. Non-existent people cannot be harmed.
  *   **Negative Utilitarianism:** The view that only suffering matters morally; happiness has no weight to counterbalance it.
  *   **Critical Level View:** The view that adding a person is only good if their well-being exceeds a certain high threshold; below that, it is neutral or bad.
  *   **Asymmetry (Axiological):** The view that the presence of pain is bad, but the absence of happiness (in non-existence) is not bad, as a matter of objective value. (Associated with David Benatar).
  *   **Asymmetry (Reasons-Based):** *Reconstructed Label.* The view that we have reasons not to create suffering, but no reasons to create happiness, without claiming the universe is "worse" when suffering exists.
  *   **Non-Identity Problem:** The logical issue where choices affect *who* comes into existence, making it hard to say those choices harm the resulting people.

