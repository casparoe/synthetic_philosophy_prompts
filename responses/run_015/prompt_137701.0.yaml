answer: |-
  # The Procreation Decision Tree

  This instrument is designed to sort intuitive judgments into philosophical positions without requiring prior knowledge of the labels. It uses **9 branch nodes** to sort participants into **7 occupied leaves** and **2 unoccupied cells**.

  **Instructions for the Group:** Start at Node 1. Answer the question based on your gut reaction to the case described. Follow the arrow to the next node or to a final Leaf. At the Leaf, read the position name, the awkward commitment, and the three implications.

  ---

  ### Node 1: The Margin (Case: *The Margin*)
  **Question:** You can have a child whose life will be extraordinarily happy, but it will contain one brief, minor pain (like a vaccination sting) that would not exist if the child were never conceived. Does the fact that this pain would be avoided count *at all* as a reason against having the child?
  *   **A:** Yes, it counts against having them. (Go to Node 2)
  *   **B:** No, provided the life is worth living, the pain is irrelevant. (Go to Node 3)

  > **Work:** Separates *Asymmetrical/Negative* views from *Symmetrical/Total* views.

  ### Node 2: The Void (Case: *Missing Happiness*)
  **Question:** Consider a child who is never conceived. They miss out on a lifetime of extraordinary happiness. Is this missed happiness a bad thing *for them* (or a negative mark on the state of affairs)?
  *   **A:** Yes, missing out is bad (or less good). (Go to Node 9)
  *   **B:** No, non-existent people cannot be deprived. (Go to Node 4)

  > **Work:** Separates *Symmetrical* views (Pain and Gain both count) from *Asymmetrical* views (Pain counts, Gain doesn't).

  ### Node 3: The Switch (Case: *The Switch*)
  **Question:** You must bring exactly one child into existence. Child A would have an excellent life. Child B would have an excellent life that is slightly less excellent and contains a small amount of suffering A would not. Is there a moral reason to bring about A rather than B?
  *   **A:** Yes, you ought to choose the better life. (Go to Node 5)
  *   **B:** No, both are permissible. (Go to Leaf 7: *Unoccupied Cell 1*)

  > **Work:** Separates *Maximizing* views from *Satisficing* views within the Symmetrical camp.

  ### Node 4: The Threshold
  **Question:** You are considering having a child. Their life will contain some suffering, but also great happiness. Is there *any* amount of happiness that can make creating them neutral or good, despite the suffering?
  *   **A:** Yes, enough happiness outweighs the suffering. (Go to Node 5)
  *   **B:** No, suffering is never outweighed by happiness; existence is always a harm if pain is present. (Go to Leaf 1: *Negative Utilitarianism*)

  > **Work:** Separates *Critical Level* views from *Negative Utilitarian* views.

  ### Node 5: The Delay (Case: *The Delay*)
  **Question:** Conceiving now produces Child X with a good life. Waiting eleven months produces Child Y (a different person) with a *better* life. No other effects. Is there a moral reason to wait?
  *   **A:** Yes, we should bring the better person into existence. (Go to Node 6)
  *   **B:** No, Child X is not harmed by being created, so there is no duty to wait. (Go to Leaf 2: *Person-Affecting View*)

  > **Work:** Separates *Impersonal* views from *Person-Affecting* views (The Non-Identity Problem).

  ### Node 6: The Ground (Value vs. Reasons)
  **Question:** When you say creating a suffering child is "bad," is it bad because the *universe* contains a worse state of affairs, or simply because you lack a *reason* to do it (even if the universe isn't "worse" in a measurable way)?
  *   **A:** The universe is objectively worse. (Go to Node 7)
  *   **B:** It's about the logic of choice/reasons, not universal value. (Go to Node 8)

  > **Work:** Separates *Axiological* (Value-based) claims from *Deontic* (Reasons-based) claims.

  ### Node 7: The State (Policy Implication)
  **Question:** If a government policy encouraged births that would result in many additional happy people (with no negative side effects), would that policy be doing something *good*?
  *   **A:** Yes, more happy people makes the policy good. (Go to Leaf 3: *Total Utilitarianism*)
  *   **B:** No, adding happy people is neutral; only reducing suffering is good. (Go to Leaf 4: *Critical Level View*)

  > **Work:** Separates *Total View* from *Critical Level View* regarding aggregation.

  ### Node 8: The Scope (Identity Asymmetry)
  **Question:** You must have a child. Child A will have a life with minor pain. Child B will have a life with no pain but otherwise identical. Does the "pain counts against existence" rule apply to *which* child you pick?
  *   **A:** Yes, avoid the pain even in selection. (Go to Leaf 5: *Asymmetry (Axiological)*)
  *   **B:** No, the rule only applies to existence vs. non-existence. (Go to Leaf 6: *Asymmetry (Reasons-Based)*)

  > **Work:** Separates views on whether the Asymmetry governs *identity selection* or only *existence*.

  ### Node 9: The Mirror (Regret Implication)
  **Question:** Consider an existing person with a very good life (but containing some suffering). Can it truly be said that it would have been *better for them* had they never existed?
  *   **A:** Yes, non-existence would have been preferable. (Go to Leaf 3: *Total Utilitarianism*)
  *   **B:** No, they exist, so we cannot compare it to non-existence. (Go to Leaf 2: *Person-Affecting View*)

  > **Work:** Separates views on *retrospective regret* for existing people. (Note: This node merges paths from Node 2 to align implications).

