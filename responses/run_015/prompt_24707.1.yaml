      *(Refining the Tension)*: The tension is between "Context matters" (it's for analysis) and "Context doesn't matter" (we still hide it). The resolution is that context mitigates *moral blame* but not *psychological impact*.

      *(Final thought)*: Ensure the distinction between *Use* and *Mention* is central, as that's the linguistic heart of the issue.

