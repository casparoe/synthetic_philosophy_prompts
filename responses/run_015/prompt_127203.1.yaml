answer: |-
  **MUSEUM RESTITUTION ASSESSMENT PROCEDURE**
  *For use by Trustees and Culture Committee. Designed for non-specialists.*

  **PHASE 1: THE FACTS (Provenance & Acquisition)**
  **1. Is there a gap in the object's history between 1897 and 1950?**
  *   **Yes:** Does the gap coincide with a known period of conflict, punitive expedition, or documented mass looting in that region?
      *   *If Yes:* The burden of proof shifts to the Museum. You must assume the object was taken without consent unless you can prove otherwise. You cannot require the claimant to prove theft.
      *   *If No:* Proceed to Question 2.
  *   **No:** Proceed to Question 2.

  **2. How was the object acquired?**
  *   **Documented Sale/Exchange:** Was the seller authorised by their community to sell this specific type of object? (e.g., sacred items often cannot be sold by individuals).
      *   *If No:* Treat as illicit removal, regardless of money changing hands.
  *   **Gift/Found:** Was it given freely by a person with authority, or found abandoned?
      *   *If Found:* Who owned the land/building? Was it during a military campaign?
  *   **Unknown:** Refer to Question 1.

  **PHASE 2: THE CLAIMANTS (Standing & Authority)**
  **3. Who is asking for the object?**
  *   **Source Community/Traditional Ruler:** Highest standing.
  *   **National Government/Museum of Origin:** High standing, but must demonstrate they represent the source community.
  *   **Diaspora/Local Community (UK):** Valid interest, but lower standing than the source community. They are stakeholders, not owners.
  *   **Multiple Claimants:** If the National Museum and a Traditional Ruler disagree, you must seek mediation. Do not choose sides unilaterally. If the National Museum and a UK Diaspora group disagree, the Source/National claim takes precedence on ownership; the Diaspora claim is considered for *access* only.

  **PHASE 3: THE FUTURE (Use & Preservation)**
  **4. What will happen to the object if returned?**
  *   **Museum Use:** No conflict with your mission.
  *   **Ritual Use/Burial/Consumption:** The Museum's duty to "preserve for eternity" does not override the community's right to use their own heritage as they see fit. You cannot withhold an object simply because it will wear out or be buried.
  *   **Dispersed Collection:** If this object is part of a whole (e.g., one of a pair), consult the other holding institutions. Returning your piece should not sabotage the reunification of the rest.

  **PHASE 4: THE LOCAL CONTEXT (Attachment & Care)**
  **5. Does the local community have a strong connection?**
  *   Acknowledge the value of the object to local education and identity.
  *   *Test:* Is the argument for keeping it based on *ownership* or *access*? If the argument is "we care for it better" or "our children need to see it," this is a plea for stewardship, not a right of ownership. Stewardship can be managed via loans or replicas.

  **PHASE 5: THE DECISION (Legal & Ethical)**
  **6. Are we legally allowed to dispose of the object?**
  *   **Yes:** Proceed to Recommendation.
  *   **No/Unsure:** Separate the ethical conclusion from the legal constraint.
      *   *Ethical Conclusion:* "We should return this."
      *   *Legal Constraint:* "We cannot transfer title."
      *   *Alternative:* Long-term loan, digital repatriation, or public acknowledgement of the blockage. Do not present a long loan as a moral victory if the intent is to retain ownership permanently.

  **7. Final Recommendation:**
  *   **Return:** Transfer of title and possession.
  *   **Retain:** Clear justification why the ethical bar for removal has not been met.
  *   **Share:** Loan, replica, or joint curation.

  ***

  **APPLICATION TO THREE OBJECTS**

  **1. Cast Brass Head (Benin Style)**
  *   **Acquisition:** Bought London auction 1962. Donated 1978.
  *   **The Gap:** File silent between 1897 (Punitive Expedition) and 1962.
  *   **Procedure Check:**
      *   *Phase 1:* The gap coincides exactly with the 1897 looting of Benin City. Under Step 1, the burden is on the Museum to prove it was *not* looted. We cannot do this. We must assume it is spoils of war.
      *   *Phase 2:* Claimant is the Nigerian National Commission. They have high standing.
      *   *Phase 3:* They intend to display it in a museum. No conflict with preservation.
      *   *Phase 4:* No significant local attachment recorded.
      *   *Phase 5:* Legal check required.
  *   **Recommendation:** **Return.** The gap in provenance during a documented looting event creates an ethical presumption of theft that we cannot discharge. Keeping it perpetuates the erasure of the violence that removed it.

  **2. Ancestral Skulls and Memorial Figures (Papua New Guinea)**
  *   **Acquisition:** 1901, missionary-surgeon. Exchanged for two steel axes.
  *   **The Claim:** Descendants request burial.
  *   **Procedure Check:**
      *   *Phase 1:* Documented exchange, but Step 2 asks if the seller had the right to sell. Ancestral remains are rarely individual property to be sold. The "sale" is likely invalid culturally.
      *   *Phase 2:* Claimants are descendants. Highest standing regarding human remains.
      *   *Phase 3:* They intend to bury them. Step 4 states preservation does not override ritual use. Keeping human remains in a storeroom is ethically inferior to laying them to rest.
      *   *Phase 5:* Legal check on deaccessioning human remains.
  *   **Recommendation:** **Return for Burial.** Human remains carry a higher ethical weight than artefacts. The "exchange" does not validate the transaction if the items were not commodifiable in their culture. The Museum's desire to preserve them is secondary to the descendants' duty to bury them.

  **3. Carved Wooden Figure (Cross River Region)**
  *   **Acquisition:** 1935, colonial officer. Handed over during a campaign against a secret society.
  *   **The Claim:** Nigerian National Museum Service wants it; Local Nigerian-British Association wants it kept here on loan.
  *   **Procedure Check:**
      *   *Phase 1:* Acquired during a "campaign." This implies coercion or conflict, not a free gift.
      *   *Phase 2:* Two claimants. Step 3 dictates the National Museum (representing the source territory) has higher standing on ownership than the Diaspora Association (representing UK residents).
      *   *Phase 3:* National Museum intends display.
      *   *Phase 4:* The Local Association argues for access and expresses distrust of Nigerian storerooms. Step 5 identifies this as a "stewardship" argument ("we care for it better"). Step 6 warns against using loans to mask ownership retention.
      *   *Phase 5:* Legal check on transfer.
  *   **Recommendation:** **Return to National Museum.**
      *   *Reasoning:* This is the difficult case. While the local Association's connection is genuine, their claim is one of *access*, not *origin*. To keep the object based on their request is to prioritise the comfort of the diaspora over the sovereignty of the source nation. Furthermore, the argument that Nigerian storerooms are "untrustworthy" is the old "superior care" justification in new language. If the National Museum requests it, they accept the curatorial risk.
      *   *Compromise:* The Museum should facilitate a long-term loan *back* to the UK Association *after* title has been transferred to Nigeria, if Nigeria agrees. But the ownership must move.

  ***

  **LIMITATIONS OF THIS PROCEDURE**

  You asked for frankness about where this will misfire. Here is where this checklist will fail you:

  **1. The "Gap" Problem is Subjective**
  Step 1 relies on you deciding if a gap "coincides" with looting. History is messy. A gap might be innocent, or it might be hidden theft. This procedure forces you to err on the side of the claimant during conflict periods. Some trustees will feel this is unfair. It is not a fact-finding mission; it is an ethical risk assessment. You are guessing.

  **2. It Cannot Fix Bad Laws**
  Step 6 separates "may we" from "should we." If your solicitor says you cannot legally dispose of the objects, this procedure cannot magic that away. It will leave you in the uncomfortable position of publicly stating, "We believe this belongs to them, but the law says it is ours." This may attract criticism from both sides. Do not use a long loan to hide this fact. If you cannot return it, say you cannot return it, rather than pretending a loan is a solution.

  **3. It Flattens Complex Relationships**
  In Case 3, the procedure prioritises the National Museum over the Diaspora. In reality, the National Museum might be underfunded, politicised, or distant from the specific ethnic group that made the object. The procedure treats the "Nation State" as the rightful heir, which is a political convenience, not always a cultural truth. We drop this distinction to keep the procedure usable, but you should know you are making a political choice to recognise the State over the Tribe.

  **4. It Requires a Vote**
  This procedure does not produce a mathematical result. Two committees could run this on the same object and reach different conclusions on Step 2 (Standing) or Step 4 (Preservation). It forces you to ask the right questions, but it cannot answer them for you. The final decision is a value judgement. You will have to vote.

  **5. It Offers No Protection from Public Outcry**
  If you return the Benin head, someone will write to the paper saying you are erasing history. If you keep the Cross River figure, someone will say you are clinging to empire. This procedure ensures your reasoning is consistent and honest, but it does not guarantee you will be liked. It is designed to help you sleep at night, not to stop the phone from ringing.
