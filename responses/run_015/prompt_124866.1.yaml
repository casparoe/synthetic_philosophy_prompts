answer: |-
  **EPISTEMOLOGY 301: FINAL EXAMINATION**
  **Time Allowed: 90 Minutes**
  **Total Marks: 25**
  **Word Limit: Approximately 900 words**

  **Instructions:** Answer the following question based on Wittgenstein's *On Certainty* and the case study provided. Do not cite secondary literature. Arguments must stand on the primary text and logical analysis.

  **The Case of the Kestrel Bank**
  The Kestrel Hydrographic Office has charted the Kestrel Bank for a century. Its survey method treats the Bank as geologically stable: soundings taken years apart are pooled into a single depth model, and an individual anomalous sounding is discarded as instrument error. That the Bank does not move is not something the Office has evidence for; it is what makes the pooling of soundings into one chart possible at all. Over thirty years the proportion of discarded anomalies has risen steadily, and eventually the director invokes the Office's standing revision protocol: when more than one sounding in five must be discarded, the stability assumption is to be retired and replaced by a model in which the Bank migrates. The retirement is authorised by counting discarded anomalies — that is, by a procedure that itself presupposes the very assumption being retired. Meanwhile, a separate team, the Tidalists, has for some years produced independent estimates of the Bank's position by satellite altimetry, a method that never presupposed stability; they argue the assumption was testable all along.

  **Question 1**
  (a) On the Wittgensteinian account, the assumption that the Bank is stable functions as a "framework proposition." Explain what it is for a proposition to play this role. How does this differ both from being a well-confirmed empirical hypothesis and from being merely something no one in the community thinks to question? (8 marks)

  (b) The Director retires the stability assumption using a protocol that presupposes it. Is this a rational revision? Explain whether this counts as responding to evidence within a system or changing the system itself, and whether the circularity undermines the rationality of the move. (9 marks)

  (c) A critic argues that this framework account cannot distinguish the Office's assumption from a paranoid patient's conviction that his food is being poisoned, since both are held despite apparent counter-evidence. Does this collapse the view into relativism? Explain what functional difference between a framework commitment and a delusion could do the work without appealing to truth, and say what work the Tidalists' independent method does in this context. (8 marks)

  ***

  **MODEL ANSWER**

  (a) For a proposition to play a framework role is for it to function as the scaffolding against which other propositions are tested, rather than being tested itself. In the Kestrel case, the stability of the Bank is not a hypothesis confirmed by soundings; it is the rule that allows soundings to be pooled. If it were a well-confirmed hypothesis, we would expect there to be a method of verifying it independent of the soundings it validates. But here, any sounding contradicting stability is defined as error. This distinguishes it from a mere habit or unquestioned belief. A habit is something we could question but don't; a framework proposition is something where questioning it removes the sense of the inquiry. To doubt the Bank's stability within the Office's practice is not to have a different opinion, but to stop doing hydrography as they understand it. It is grammatical, not empirical.

  (b) The Director's revision is rational, but not in the sense of responding to evidence within the old framework. If stability is a hinge, anomalies cannot count as evidence against it within the system; they are just noise. However, when the "noise" becomes too loud (one in five), the system becomes unworkable. The revision protocol is a rule for when to switch frameworks. This is not circular in a vicious way; it is a recognized conversion. The Director is not proving the Bank moves using the old method; she is acknowledging that the cost of maintaining the old hinge (discarding so much data) outweighs the benefit. This is revision-as-conversion, not revision-as-evidence-response. The circularity is unavoidable because there is no neutral ground to stand on to judge the hinge. Rationality here is about the coherence and utility of the practice, not correspondence to facts established by that practice.

  (c) The delusion objection fails if we look at function rather than truth. The paranoid's conviction that he is being poisoned does not facilitate a shared system of inquiry; it isolates him and makes action impossible (he cannot eat). The Office's assumption facilitates shared charting and navigation. The difference is not that the Office is right and the patient wrong (both could be false), but that one serves as a productive hinge for a form of life and the other disrupts it. This avoids relativism because frameworks are not arbitrary; they are judged by their efficacy in enabling action. The Tidalists do not provide evidence against stability within the Office's framework. Instead, they offer a competing framework (satellite altimetry) where stability is a hypothesis, not a hinge. Their work allows the Office to see their own hinge from the outside. They don't falsify the old view; they make it optional. This shows that framework propositions are relative to a practice, but not immune to replacement when a better practice becomes available.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **Part (a): The Nature of Framework Propositions (8 Marks)**
  *   **3 Marks:** Correctly identifies framework propositions as scaffolding/rules for testing rather than items tested.
  *   **3 Marks:** Distinguishes from empirical hypothesis (hypothesis implies verification method; framework defines verification).
  *   **2 Marks:** Distinguishes from mere habit/unquestioned belief (habit is psychological/social; framework is logical/grammatical condition of sense).
  *   *Common Error (Foundationalism):* Treating the stability assumption as a "basic belief" that is justified by itself. (Deduct 3 marks). Framework propositions are arational, not self-justifying.
  *   *Common Error (Psychological):* Claiming the proposition "cannot be doubted" means people are psychologically unable to doubt it. (Deduct 2 marks). It means doubt lacks sense within the practice.

  **Part (b): Rationality of Revision (9 Marks)**
  *   **4 Marks:** Identifies the revision as a change of system (conversion) rather than empirical falsification within the system.
  *   **3 Marks:** Addresses the circularity: argues it is not vicious because the protocol is a rule for switching, not a proof within the old system.
  *   **2 Marks:** Concludes the move is rational based on utility/coherence of practice, not correspondence.
  *   *Common Error:* Arguing the Director is irrational because the procedure presupposes the assumption. (Deduct 4 marks). Misses the point of hinge replacement.

  **Part (c): The Delusion Objection and Tidalists (8 Marks)**
  *   **3 Marks:** Rejects "truth" as the distinguishing factor between framework and delusion.
  *   **3 Marks:** Identifies functional difference: framework enables shared action/inquiry; delusion isolates/disrupts action.
  *   **2 Marks:** Correctly assigns role to Tidalists: they provide a *new framework* where stability is testable, not evidence within the old one.
  *   *Common Error (Truth Response):* Answering the delusion objection by saying the patient's belief is false and the Office's is true. (Deduct 3 marks). Misses the epistemological point.
  *   *Common Error (Relativism):* Concluding that because frameworks are relative, any framework is as good as any other. (Deduct 2 marks). Must note efficacy/utility constraints.

  **Thresholds**
  *   **Pass (13 marks):** Competent definition of framework; identifies revision as system change; attempts delusion objection.
  *   **Merit (18 marks):** Clear distinction from hypothesis/habit; handles circularity well; functional distinction on delusion.
  *   **Distinction (22 marks):** Nuanced handling of conversion vs. evidence; precise role of Tidalists as framework-shifters; avoids all common errors.

  **Discrimination Note**
  The single move that most reliably separates an A script from a B script is the handling of the Tidalists. B scripts treat the Tidalists as providing counter-evidence that falsifies the stability assumption. A scripts recognize that the Tidalists provide a *competing framework* that recontextualizes the stability assumption from a hinge to a hypothesis, thereby dissolving the circularity without violating the logic of the original practice.

