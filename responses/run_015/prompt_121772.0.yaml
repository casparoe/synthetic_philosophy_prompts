prompt: |-
  I was talking with a few friends about whether a lie has to be about something important to ruin your consent—like, if a dentist tells you she's using one brand of anesthetic but actually uses an identical generic, and you said yes based on that, is your "yes" still real? I'm trying to think through this on my own without just repeating standard examples I've seen, so I want a thought experiment built to very specific rules. Please construct a realistic, one-paragraph scenario in a workplace or medical setting: a fully competent adult gives explicit, uncoerced consent to a specific procedure, but they are deceived about exactly one feature of it. The feature must be genuinely immaterial—functionally and risk-wise identical—such as being told a particular model of safety equipment will be used when in fact a different model with the exact same specifications is used. The person must understand and consent to all actual risks and physical acts involved, and there must be no coercion, no incompetence, and no deception about anything that affects outcome or danger.

  After describing the scenario, walk through the verdicts of two opposing frameworks: one that treats consent as valid whenever all material information is correct and the choice is voluntary, regardless of immaterial deception; and one that treats any deception, however trivial, as vitiating consent entirely. For each, show exactly which premise drives the conclusion. Then identify the single structural feature in your case that forces the split—state clearly what happens if that feature is changed so the deception concerns a material risk rather than a cosmetic or brand-level detail. Finally, explain how a defender of the stricter, anti-deception view would attack your case, particularly whether they would deny that any deception can be truly "immaterial" once it touches the informational basis of consent.
