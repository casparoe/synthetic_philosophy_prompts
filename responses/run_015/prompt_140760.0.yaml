  I have just come out of a long and rather inconclusive argument with a friend about vagueness, and I would like an accuracy audit of the passage she was reasoning from, because I suspect it is doing more work than it should. The disagreement started over a practical case — whether insects ought to be treated as sentient, and whether anything follows from the fact that 'sentient' is a vague predicate — after which she sent me a pop-philosophy blog post on the sorites paradox and said it settled the matter. My paraphrase of the relevant passage runs roughly like this: vagueness is not a feature of the world but a feature of our language, and the puzzle is entirely about what to say about sentences such as 'Jack is bald' when Jack is a borderline case; epistemicists hold that classical logic and bivalence are non-negotiable, so that there is a fact of the matter as to exactly how many hairs a man must have before 'bald' stops applying, and that boundary is fixed with perfect precision by our usage of the word — we simply cannot find out where it lies, because our evidence about the fine detail of our own linguistic behaviour is far too thin, so vagueness turns out to be a species of ignorance rather than a feature of meaning; supervaluationists regard this as crazy, holding instead that there are many equally acceptable ways of making 'bald' precise and no fact of the matter as to which of them is the correct one, that a sentence is true when it comes out true on every acceptable precisification, false when it comes out false on every one, and otherwise has a third, intermediate status, 'indeterminate', which is why classical logic, and in particular the law of excluded middle, breaks down at the borderline; the payoff is that supervaluationism vindicates our ordinary tolerance intuition — the sense that removing a single hair cannot turn a man who is not bald into a man who is — whereas the epistemicist must simply bite the bullet and say that somewhere a single hair makes all the difference; this is why supervaluationism is the more popular view, although in the end the two theories are arguing about the same thing, since both accept that a sharp boundary of some sort exists and differ only over how to describe borderline cases, so that the choice between them is largely a matter of which description one finds less awkward and nothing much hangs on it.

  My friend then added an argument of her own on top of this: if the supervaluationist locates the indeterminacy in the choice between admissible precisifications, then either the set of admissible precisifications is itself sharply bounded — in which case the sharp cutoff has merely been relocated one level up, and supervaluationism collapses into a more roundabout epistemicism — or its bounds are themselves vague, in which case one needs precisifications of precisifications and the view never gets off the ground. She took this to show that the closing sentence of the post is right and the whole dispute is terminological. I am inclined to think that closing claim is too glib: surely it matters whether borderline sentences are bivalent, and whether the inferences we ordinarily make with vague terms come out valid. But I do not trust my grip on the details, and I would rather know what a specialist would say than win the argument.

  So: could you go through the passage more or less sentence by sentence, and tell me which claims a supervaluationist would happily sign up to, which are fair popularisations of something they would put differently, which they would regard as straightforward misrepresentations, and which are contested even among people who work on vagueness, so that my friend and I were each just repeating one side of a live dispute? I am especially unsure about four things: (i) whether the law of excluded middle really does fail for borderline sentences on a supervaluationist semantics, or whether that conflates two things the theory keeps apart; (ii) whether it is right to describe the borderline status as a third truth value rather than as a truth-value gap; (iii) whether the epistemicist's case really rests on the poverty of our evidence about our own usage, or whether that is a crude version of a rather different argument; and (iv) whether the supervaluationist genuinely vindicates the tolerance intuition in a way that distinguishes the view from epistemicism, given that on the supervaluationist's own account it looks as though it can be supertrue that some number of hairs is the cutoff even though no particular number is. Please feel free to use the insect example to test the post's closing claim about nothing practical hanging on the dispute, but keep the main focus on auditing the passage itself. I do not want reading recommendations or a bibliography — I want the audit. And I would be grateful if you could write your answer in British English.
