prompt: |-
  I am the managing editor of a mid-sized journal in molecular and cell biology, and I am rewriting the section of our house style guide that deals with what we loosely call 'metaphorical language'. The people who have to enforce it are my copy-editors: they have degrees in biology but no philosophy, they process thirty or forty manuscripts a month, and they have roughly two minutes per flagged sentence before the production schedule slips. They can refer a problem to the handling editor, who has the final say, but in practice they must make the call themselves, and they need a sentence they can paste into an email to an author who has written back furious that we have flattened their prose — last year one such exchange ended up in a blog post accusing us of censorship, which is the sort of thing my editor-in-chief would rather not repeat. Our current rules are pure inherited precedent: we let through 'the genetic code', 'transcription', 'translation', 'reading frame', 'start codon' and 'misreading' without comment; we routinely strike 'the genome is the blueprint of the organism', 'genes for aggression', 'the cell interprets the signal', 'the instruction manual of life'; and we have no principled way of saying why one list is acceptable and the other is not, nor any way of handling the very large number of phrases that sit in between them — 'encodes', 'specifies', 'carries information', 'instructs', 'targets', 'reads out', 'programmes', 'switches on'.

  What I want from you is a decision procedure my copy-editors can actually run, grounded in whatever the philosophy of biology has to say on this that is usable at two minutes per sentence. No literature review, no references, no history of the debate: just the distinctions that have to survive the simplification, and an honest note on which ones can be dropped. The distinctions I think matter are these, though the procedure should correct me if I have mis-described them: (i) the narrow sense in which there is a code at all — a mapping from codons to amino acids that is physically implemented by adaptor molecules rather than settled by convention or by what an interpreter intends — as against the broad sense in which a genome is called a programme, blueprint, recipe or text; (ii) 'information' in the sense of a reduction in uncertainty at a receiver, as against information about the phenotype, i.e. content that is about something and can in principle be wrong about it; (iii) the awkward fact that which content a stretch of sequence bears seems to depend on the machinery present — reading frame, splicing, chemical marks — so that the string on its own may not fix any message at all; (iv) whether anything in the cell occupies the role that would make 'error' and 'misreading' more than a façon de parler, or whether there is only causation with a norm projected onto it by us; (v) the difference between a representation of what is to be built and a trigger or resource that a developing system simply uses. I gather there are live disputes here — some people want content grounded in selection history, others want to treat the whole developmental system rather than the sequence as the unit — and I do not need the procedure to settle those, only to be robust to them. Give me the tests in the order they should be applied, what counts as a pass at each, where the procedure halts with a definite yes or no, and where it must hand the decision back to a person because the question is really one of our editorial policy, or of what the field's usage has already made standard, rather than one of fact. Mark clearly which steps are judgement calls dressed up as tests.

  Then run it, as a copy-editor would, on three sentences from recent submissions: (a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'; (b) 'the genome contains the complete programme for building the organism'; (c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'. For each, tell me what the procedure outputs, what it does to the sentence, and the one-line justification the editor can send the author. I also suspect that at least one of the phrases we currently pass — 'genetic information' is my own worry, but it may be 'the genetic code' — fails the tests you are going to give me; if so, say so plainly and explain why, because I would much rather hear it from you than discover it while defending house style to an author. Finally, tell me what the procedure cannot do: the sentences it must simply leave alone, the cases where it will misfire badly, and the kind of claim it has no purchase on at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Managing Editor of a mid-sized molecular/cell biology journal.
      *   **Task:** Create a decision procedure for copy-editors regarding "metaphorical language" (teleological/informational metaphors in biology).
      *   **Constraints:**
          *   Copy-editors have biology degrees, no philosophy.
          *   Time limit: ~2 minutes per sentence.
          *   Goal: Avoid censorship accusations, ensure consistency, reduce escalation to handling editors.
          *   Output: A usable decision procedure (tests in order, pass/fail criteria, hand-off points), applied to three test sentences, honest assessment of current house style terms, and limitations of the procedure.
          *   Tone: Professional, pragmatic, direct, no academic fluff (no lit review, no history).
      *   **Key Distinctions to Incorporate:** Code vs. Metaphor, Shannon Information vs. Semantic Content, Context-Dependence of Meaning, Normativity (Error), Representation vs. Trigger.
      *   **Specific Worry:** The user suspects terms like "genetic information" or "genetic code" might fail the proposed tests.

  2.  **Deconstruct the Philosophy (for the Procedure):**
      *   *The Core Problem:* Biological systems are causal mechanisms. Language like "code," "program," "read," "inform" implies agents, intentions, or semantic content.
      *   *The Pragmatic Solution:* We can't eliminate all metaphor (science is impossible without it). We need to distinguish *technical shorthand* (accepted convention) from *misleading implication* (implies agency or determinism where there is none).
      *   *The "Two-Minute" Filter:* The test needs to be operational, not theoretical. It needs to ask "Does this imply X?" rather than "Is this ontologically true?"

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Step 1: The "Blacklist/Whitelist" Check.* (Fastest). If it's on the approved list (codon, transcription), pass. If it's on the banned list (blueprint, instruction manual), flag. *Critique:* The user says this is the current broken state. I need to improve the *middle* ground.
      *   *Step 2: The "Agent" Test.* Does the sentence imply a conscious reader or writer? (e.g., "The cell *decides*"). If yes, flag.
      *   *Step 3: The "Context" Test.* Does the sentence imply the sequence *alone* determines the outcome, ignoring the cellular machinery? (e.g., "Gene *for* X"). If yes, flag.
      *   *Step 4: The "Mechanism" Test.* Is there a physical mechanism that mimics the metaphor? (e.g., tRNA matching codons = "translation"). If yes, pass.
      *   *Step 5: The "Escalation" Clause.* If it's ambiguous, kick to the editor.

      *Refining for the User's Constraints:* The user wants philosophical distinctions translated into operational tests.
      *   *Distinction (i) Code vs. Metaphor:* Test = Is there a fixed mapping table implemented by molecules?
      *   *Distinction (ii) Information:* Test = Is it causal influence or semantic content? (Hard for copy-editors). Better: Does it imply the sequence *knows* the outcome?
      *   *Distinction (iii) Context:* Test = Does the sentence acknowledge the machinery?
      *   *Distinction (iv) Error:* Test = Is there a functional failure mode defined by the system, not the observer?
      *   *Distinction (v) Rep vs. Trigger:* Test = Is it a static plan or a dynamic interaction?

      *Let's build the "2-Minute Protocol":*
      1.  **Check the Safe List.** (Immediate Pass).
      2.  **Check the Ban List.** (Immediate Flag).
      3.  **The "Mind-Reading" Test.** (Does it imply intent/knowledge?).
      4.  **The "Sole Cause" Test.** (Does it ignore context/machinery?).
      5.  **The "Mechanism" Test.** (Is there a physical analog?).
      6.  **Escalate.**

  4.  **Addressing the User's Specific Worries:**
      *   *Genetic Code:* Passes the "Mechanism" test (tRNA/Synthetases).
      *   *Genetic Information:* This is tricky. "Information" is often Shannon entropy (causal) but often used semantically. I need to be honest: "Genetic information" is technically dubious but standard usage. I should advise keeping it but flagging heavy semantic loading.
      *   *Transcription/Translation:* These are historical metaphors that are now technical terms. They pass the "Convention" test.

  5.  **Running the Test Cases:**
      *   (a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'
          *   "Reads out": Metaphor. Mechanism? Binding.
          *   "Encoded": Implies message.
          *   Verdict: Borderline. "Reads" is common but implies agency. "Encoded" implies semantic content.
      *   (b) 'the genome contains the complete programme for building the organism'
          *   "Programme": Strong metaphor.
          *   "Complete": Deterministic fallacy (ignores environment/epigenetics).
          *   Verdict: Flag/Ban.
      *   (c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'
          *   "Carry information": Causal vs Semantic.
          *   "Cell reads": Agency.
          *   "Specify": Determinism.
          *   Verdict: Flag.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the constraint (2 mins, no philosophy).
      *   **The Protocol:** Step-by-step flow.
      *   **The "Honest Note":** Addressing the "Genetic Code/Information" worry.
      *   **The Test Run:** Applying to (a), (b), (c).
      *   **Limitations:** What this can't fix.
      *   **Email Templates:** The user asked for sentences to paste into emails.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is "Mechanism Test" too hard for 2 minutes?
      *   *Fix:* Simplify. Ask: "Is there a physical molecule doing the matching?"
      *   *Critique:* The user wants to know which current terms fail.
      *   *Fix:* I must explicitly state that "Genetic Code" is technically a metaphor but is grandfathered. "Genetic Information" is the real risk.
      *   *Critique:* The email justification needs to be diplomatic but firm.
      *   *Fix:* Focus on "precision" and "mechanistic clarity" rather than "philosophical correctness."

  8.  **Final Review against Constraints:**
      *   No literature review? Check.
      *   No history? Check.
      *   Decision procedure order? Check.
      *   Judgement calls marked? Check.
      *   Test sentences run? Check.
      *   Limitations explained? Check.

      *(Self-Correction on "Genetic Code"):* The user asked me to say if current terms fail. "Genetic Code" passes the *mechanism* test (it is a literal mapping table). "Genetic Information" is the one that fails the *semantic* test but passes the *convention* test. I need to be clear on this distinction.

      *(Self-Correction on Email Templates):* The prompt asks for "a sentence they can paste into an email". I should provide a few variations based on the outcome.

      *(Final Polish):* Ensure the tone is authoritative but helpful, matching a senior editor advising a peer.

  9.  **Drafting the Content:** (Mental Outline)
      *   **Header:** The 2-Minute Metaphor Protocol.
      *   **Step 1:** Whitelist/Blacklist (Precedent).
      *   **Step 2:** The Agency Test (Intent).
      *   **Step 3:** The Sufficiency Test (Context).
      *   **Step 4:** The Mechanism Test (Physical analog).
      *   **Step 5:** Escalation.
      *   **Honest Assessment:** "Genetic Information" is the weak link.
      *   **Test Runs:** (a) Caution, (b) Reject, (c) Revise.
      *   **Limitations:** Heuristic nature, field evolution.

      *(Wait, one detail)*: The user asked for "a sentence they can paste into an email". I will provide a template block at the end.

      *(Wait, another detail)*: "Mark clearly which steps are judgement calls dressed up as tests." I will add bold warnings in the protocol.

      *(Wait, another detail)*: "Tell me what the procedure outputs, what it does to the sentence, and the one-line justification." I will structure the test run clearly.

      Let's write it.cw
answer: |-
  ### The 2-Minute Metaphor Protocol

  **Purpose:** To distinguish between *technical shorthand* (acceptable) and *misleading attribution of agency or determinism* (unacceptable) without requiring philosophical training.
  **Time Budget:** 120 seconds per sentence.
  **Authority:** Copy-editor applies Steps 1–4. Step 5 is a hand-off to the Handling Editor.

  ---

  #### Step 1: The Precedent Check (15 seconds)
  **Action:** Scan for specific keywords against the House Style Lists.
  *   **Whitelist (Pass immediately):** *Transcription, translation, codon, reading frame, start/stop, genetic code, promoter, repressor, signal transduction, pathway.*
  *   **Blacklist (Flag immediately):** *Blueprint, instruction manual, recipe, program/programme (noun), design, purpose, intent, goal.*
  *   **Grey Zone (Proceed to Step 2):** *Encode, specify, instruct, read, interpret, information, message, error, switch, target.*

  #### Step 2: The Agency Test (30 seconds)
  **Question:** Does the verb imply the molecule or cell *knows* what it is doing or *chooses* an outcome?
  *   **Test:** Replace the metaphorical verb with a physical interaction (e.g., binds, catalyzes, modifies, blocks). Does the sentence lose its meaning, or does it become more precise?
  *   **Pass:** The physical verb works (e.g., "The protein *binds* the DNA").
  *   **Fail:** The physical verb breaks the logic (e.g., "The gene *wants* to replicate" → "The gene *replicates*" changes the meaning from intent to fact).
  *   **⚠️ JUDGEMENT CALL:** "Reads" and "Interprets" often fail here unless referring to ribosomal decoding.
  *   **Output:** If **Fail**, flag for revision. If **Pass**, go to Step 3.

  #### Step 3: The Sufficiency Test (45 seconds)
  **Question:** Does the sentence imply the sequence *alone* fixes the outcome, ignoring the cellular context?
  *   **Test:** Look for words like *contains, determines, specifies, guarantees*. Ask: "If I put this sequence in a test tube with no other machinery, does the outcome happen?"
  *   **Pass:** The sentence acknowledges context (e.g., "in the presence of...", "mediated by...").
  *   **Fail:** The sentence implies the DNA is a standalone cause (e.g., "The gene *for* height," "The genome *contains* the organism").
  *   **⚠️ JUDGEMENT CALL:** "Encodes" is permissible if referring to the primary sequence, but not if referring to complex phenotypes (e.g., "encodes behavior" = Fail).
  *   **Output:** If **Fail**, flag for revision. If **Pass**, go to Step 4.

  #### Step 4: The Mechanism Test (30 seconds)
  **Question:** Is there a physical molecular mechanism that mimics the metaphor?
  *   **Test:** Is there a literal mapping table or physical adaptor?
  *   **Pass:** Yes. (e.g., "Translation" has tRNA adaptors; "Genetic Code" has a fixed codon table; "Signal" has a receptor-ligand binding event).
  *   **Fail:** No. (e.g., "Developmental Program" has no central processor; "Epigenetic Information" often lacks a defined receiver/decoder distinct from the chemistry itself).
  *   **Output:** If **Fail**, flag for revision. If **Pass**, Accept.

  #### Step 5: The Escalation Clause
  **Action:** If the sentence passes Steps 1–4 but still feels "off," or if the author is likely to push back (e.g., high-profile lab, review article), send to the Handling Editor.
  **Note:** Do not spend more than 2 minutes total. If stuck at Step 5, escalate.

  ---

  ### Honest Assessment of Current House Style

  You asked me to be plain about terms you currently pass.

  1.  **'The Genetic Code':** **PASSES.** It survives Step 4. There is a literal, physically implemented mapping table (codon → amino acid) mediated by synthetases and tRNAs. It is a code in the narrow, technical sense. Keep it.
  2.  **'Genetic Information':** **FAILS Step 4 (Technically).** There is no "receiver" that decodes "information" in the semantic sense; there is only causal interaction. However, it is **GRANDFATHERED** under Step 1 (Whitelist).
      *   *Recommendation:* Keep "genetic information" as a noun phrase, but flag verbs attached to it. "Carries information" is acceptable shorthand. "The cell *reads* the information" triggers Step 2 (Agency) and should be revised to "The cell *responds* to..."
  3.  **'Transcription/Translation':** **PASSES.** These are historical metaphors that have become technical definitions. They describe specific enzymatic processes. Keep them.

  **The Risk:** The phrase "Genetic Information" is the weakest link in your armor. It implies semantic content where there is only causality. If an author challenges you on this, concede that it is *standard terminology* (Step 1) rather than claiming it is *ontologically precise*.

  ---

  ### Test Run: Recent Submissions

  #### Sentence (a)
  > *'the transcription factor reads out the regulatory information encoded in the enhancer sequence'*

  *   **Step 1 (Precedent):** "Encoded" is Grey Zone. "Reads out" is Grey Zone. Proceed.
  *   **Step 2 (Agency):** "Reads out" implies a conscious agent. Physical replacement: "binds to." Sentence still works ("binds to the regulatory sequence"). **FLAG.**
  *   **Step 3 (Sufficiency):** "Encoded in" implies the sequence holds the message alone. Enhancers require context (chromatin state, co-factors). **FLAG.**
  *   **Step 4 (Mechanism):** No literal "reading" head. Binding is chemical affinity. **FLAG.**
  *   **Procedure Output:** **Revise.**
  *   **Action:** Change to: *"the transcription factor binds the enhancer sequence to regulate expression."*
  *   **Email Justification:** *"We request replacing 'reads out/encoded' with mechanistic terms like 'binds/recognizes' to avoid implying semantic processing where chemical affinity is the mechanism."*

  #### Sentence (b)
  > *'the genome contains the complete programme for building the organism'*

  *   **Step 1 (Precedent):** "Programme" is on the **Blacklist**.
  *   **Step 2 (Agency):** "Programme" implies a central executor. **FAIL.**
  *   **Step 3 (Sufficiency):** "Complete... for building" implies the genome is sufficient without environment/epigenetics. **FAIL.**
  *   **Procedure Output:** **Reject/Strike.**
  *   **Action:** Strike the clause. Suggest: *"the genome provides necessary regulatory constraints for development."*
  *   **Email Justification:** *"We avoid 'programme/blueprint' metaphors as they imply genetic determinism and ignore the necessary role of environmental and cellular context in development."*

  #### Sentence (c)
  > *'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'*

  *   **Step 1 (Precedent):** "Information" is Whitelist (Grandfathered). "Specify" is Grey Zone. "Reads" is Grey Zone.
  *   **Step 2 (Agency):** "Cell reads" implies agency. Physical replacement: "Cellular machinery responds to." **FLAG.**
  *   **Step 3 (Sufficiency):** "Specify which genes" implies methylation alone decides. It influences probability/state. **FLAG.**
  *   **Step 4 (Mechanism):** Methylation blocks/permits binding. It is a switch, not a message. **FLAG.**
  *   **Procedure Output:** **Revise.**
  *   **Action:** Change to: *"methylation marks influence chromatin accessibility and gene expression patterns."*
  *   **Email Justification:** *"We prefer 'influence/regulate' over 'specify/read' to accurately reflect that methylation modifies probability and accessibility rather than issuing deterministic instructions."*

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Settle Ontology:** This procedure does not decide whether biology *really* has information. It decides whether your journal *sounds* like it claims biology has information. It is a style guide, not a truth machine.
  2.  **It Will Misfire on Review Articles:** Reviews often use broader metaphors to synthesize fields. A strict application of Step 2 on a Review might flatten necessary generalizations. **Exception:** Allow more latitude in Reviews, but enforce Step 3 (Sufficiency) strictly.
  3.  **It Cannot Handle Novel Mechanisms:** If a paper describes a new type of molecular "memory" or "switch," the copy-editor won't know if the mechanism justifies the metaphor. **Solution:** Step 5 (Escalate) is vital here.
  4.  **It Cannot Stop Determinism Disguised as Mechanics:** An author can write "Protein X activates Gene Y" (mechanically sound) while implying a linear, deterministic cascade that doesn't exist. This procedure catches verbs, not logical fallacies in the experimental design.
  5.  **The "Information" Problem:** As noted, "Genetic Information" fails the philosophical test but passes the style test. You will inevitably be inconsistent here. **Solution:** Own the inconsistency. It is standard usage, not a philosophical claim.

  ### Copy-Editor Email Templates (Copy/Paste)

  **For Metaphor Removal (Agency):**
  > "To ensure mechanistic precision, we have revised [phrase] to [new phrase]. We avoid terms implying cellular agency (e.g., 'read', 'interpret') where molecular interaction (e.g., 'bind', 'modify') is the described mechanism."

  **For Metaphor Removal (Determinism):**
  > "We have adjusted [phrase] to reflect that the sequence acts within a cellular context. Terms like 'blueprint' or 'programme' are avoided to prevent implications of genetic determinism."

  **For Grandfathered Terms (Defense):**
  > "While we limit informational metaphors, 'genetic code/information' are retained as standard technical terminology distinct from broader metaphors like 'instruction manual'."
