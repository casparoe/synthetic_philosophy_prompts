answer: |-
  Your inquiry cuts to the heart of the structural constraints of superrationality (SR). You are asking whether the determinacy of SR solutions is an artifact of discrete strategy spaces (Platonia) and whether introducing continuous intensity variables (Luring Lottery) introduces indeterminacy that SR cannot resolve, particularly in a hybrid model.

  Here is the analysis of your hybrid variant, followed by the conceptual boundary you are seeking.

  ### 1. Analysis of the Hybrid Variant

  Let us formalize the superrational calculation for your hybrid model to see if a unique fixed point exists.

  **The Setup:**
  *   **Agents:** $N$ symmetric, superrational agents.
  *   **Strategy:** Enter with probability $p$; if entering, commit intensity $s > 0$.
  *   **Payoff:** Fixed prize $W$. If $k$ agents enter, the prize is shared.
  *   **Sharing Rule:** You specified division by the square root of intensity. The standard interpretation of "intensity" in contest success functions (Tullock contests) is that share is proportional to $f(s_i)$. If $f(s) = \sqrt{s}$, the share for entrant $i$ is:
      $$ \text{Share}_i = \frac{\sqrt{s_i}}{\sum_{j \in \text{entrants}} \sqrt{s_j}} $$
  *   **Cost:** Resource commitment implies a cost $C(s)$. We assume $C(s)$ is strictly increasing and $C(0)=0$.

  **The Superrational Calculation:**
  Superrationality dictates that you maximize the expected payoff of the *collective* (or your own payoff assuming logical correlation with others). In a symmetric equilibrium, all entrants choose the same $s^*$ and the same $p^*$.

  **Step 1: The Intensity Variable ($s$)**
  If $k$ agents enter and all choose identical intensity $s^*$, the sharing rule simplifies drastically:
  $$ \text{Share}_i = \frac{\sqrt{s^*}}{k \cdot \sqrt{s^*}} = \frac{1}{k} $$
  **Crucial Insight:** Under symmetric superrational reasoning, the intensity $s$ **cancels out** of the revenue side of the payoff function. Your share of the prize depends *only* on the number of entrants $k$, not on how hard you work, provided everyone works equally hard.

  Therefore, the choice of $s$ is driven **solely by the cost function** $C(s)$.
  *   Since revenue is independent of $s$ (in symmetry), and cost $C(s)$ is increasing, the superrational prescription is to minimize $s$ subject to the constraint of being an "entrant" ($s > 0$).
  *   **Result:** $s^*$ collapses to the minimum feasible intensity ($s_{\min}$).
  *   **Determinacy:** If there is a strict minimum (e.g., $s \ge 1$), $s^*$ is unique. If $s$ is continuous with no minimum and $C(s) \to 0$ as $s \to 0$, then $s^* \to 0$. This is a boundary solution, not a continuum, unless $C(s) = 0$ everywhere.

  **Step 2: The Entry Variable ($p$)**
  With $s$ collapsed to $s_{\min}$ (incurring cost $c = C(s_{\min})$), the game reduces to a binary entry problem similar to Platonia, but with a cost per entrant.
  The Expected Group Payoff $E[G]$ is:
  $$ E[G] = W \cdot P(\text{at least one entrant}) - E[\text{Total Cost}] $$
  $$ E[G] = W \cdot (1 - (1-p)^N) - N \cdot p \cdot c $$
  Maximizing $E[G]$ with respect to $p$:
  $$ \frac{dE}{dp} = W \cdot N(1-p)^{N-1} - N \cdot c = 0 $$
  $$ (1-p)^{N-1} = \frac{c}{W} \implies p^* = 1 - \left( \frac{c}{W} \right)^{\frac{1}{N-1}} $$
  **Result:** Provided $0 < c < W$, there exists a **unique** $p^* \in (0, 1)$.

  **Conclusion on the Hybrid:**
  A well-defined symmetric strategy pair $(p^*, s^*)$ **does exist** and is unique, *provided* there is a cost structure that penalizes intensity. The continuous dimension does not create a continuum of equilibria; rather, superrationality neutralizes the continuous dimension, turning it into a pure cost-minimization problem.

  ### 2. The Conceptual Boundary: Coordination vs. Competition

  You asked whether the instability is intrinsic to continuity or payoff scaling, and whether superrationality fails when the strategy space is "mixed."

  The analysis reveals that the "instability" you perceive in the Luring Lottery (and feared in the Hybrid) is not a failure of superrationality to handle mixed dimensions. It is a consequence of how superrationality treats **Competition Variables** versus **Coordination Variables**.

  #### A. Coordination Variables (The Platonia Dimension)
  The entry probability $p$ is a coordination variable. Its utility comes from *correlating* actions to avoid collision (0 or >1 senders) or ensure coverage (≥1 sender).
  *   **Structure:** The payoff function is non-linear in $p$ even under symmetry (e.g., $p(1-p)^{N-1}$).
  *   **SR Effect:** Superrationality finds the peak of this curve.
  *   **Outcome:** Determinate interior solution ($0 < p < 1$).

  #### B. Competition Variables (The Luring Dimension)
  The intensity $s$ is a competition variable. In a standard Nash framework, its utility comes from *asymmetry* (having higher $s$ than others to grab a larger share).
  *   **Structure:** The payoff function is homogeneous in $s$ under symmetry (e.g., $\frac{s}{Ns} = \frac{1}{N}$).
  *   **SR Effect:** Superrationality assumes symmetry ($s_{\text{me}} = s_{\text{others}}$). This assumption **neutralizes** the strategic value of $s$. If everyone scales $s$ up, shares remain constant, but costs rise.
  *   **Outcome:** Determinate boundary solution ($s \to s_{\min}$).

  #### C. The Source of Indeterminacy
  The "continuum of equilibria" you worried about only arises if **Cost($s$) is flat or zero**.
  *   If $C(s) = 0$, then $s$ provides no benefit (share is fixed at $1/k$) and costs nothing. The agents are indifferent to $s$.
  *   In this specific case (zero cost, homogeneous share), $s$ is indeed indeterminate.
  *   **However**, this is not a failure of the *mixed* space. It is a failure of the *payoff structure* to provide leverage. Even in a purely continuous Luring Lottery with zero cost, superrationality yields an indeterminate $s$ (any $s$ yields $W/N$).
  *   The Hybrid model does not worsen this; it simply couples the indeterminate $s$ to the determinate $p$. If $s$ is indeterminate, the cost $c$ is indeterminate, which makes $p^*$ indeterminate.

  ### 3. Does Superrationality Require One-Dimensionality?

  **No.** Superrationality does not require the strategy space to be purely categorical or purely quantitative. It handles mixed spaces robustly.

  However, your intuition that it becomes "ill-defined" touches on a specific structural requirement: **Superrationality requires the strategy parameters to be identifiable in the symmetric utility function.**

  1.  **In Platonia:** $p$ is identifiable. Changing the common $p$ changes the group payoff.
  2.  **In Luring/Hybrid:** $s$ is **not** identifiable in the revenue function under symmetry (due to homogeneity). It drops out of the equation.

  Therefore, the "defect" is not in the concept of superrationality, nor in the mixing of dimensions. The "defect" is in applying superrational reasoning to **homogeneous contest variables without external costs.**

  *   **Nash Reasoning** thrives on homogeneous contest variables because it assumes *asymmetry* (I can change $s$ while you don't).
  *   **Superrational Reasoning** thrives on coordination variables because it assumes *symmetry* (we change $p$ together).

  When you apply Superrationality to a contest variable ($s$), you are effectively asking agents to collude to minimize waste. If there is no waste (no cost), the instruction is vacuous ("Minimize nothing"), leading to indeterminacy.

  ### 4. Summary of the Structural Reason

  The structural reason superrationality yields a clean solution in Platonia but risks indeterminacy in the Luring/Hybrid case is **Scale Invariance**.

  *   **Platonia (Discrete):** The strategy space is not scale-invariant. Sending a telegram is a binary event. The probability $p$ scales the *likelihood* of the prize being claimed, which is non-linear.
  *   **Luring/Hybrid (Continuous):** The intensity $s$ is scale-invariant regarding *share*. If everyone doubles $s$, shares remain identical.
      *   Under **Nash**, this leads to runaway (I double $s$ to beat you, you double to beat me).
      *   Under **Superrationality**, this leads to collapse (We realize doubling $s$ helps no one, so we minimize $s$).

  **Final Verdict:**
  The hybrid case **does** possess a unique fixed point $(p^*, s^*)$ if resource commitment carries a cost. If costs are absent, the indeterminacy of $s$ propagates to $p$, but this is due to the **homogeneity of the payoff function**, not the mixing of discrete and continuous dimensions.

  Superrationality is not ill-defined in mixed spaces; rather, it **decouples** them. It treats the discrete dimension as a coordination problem to be optimized (interior solution) and the continuous dimension as a collusion problem to be minimized (boundary solution). The "instability" you detect is the friction between these two modes: if the continuous dimension cannot be minimized (no cost), it floats, and the coordination of the discrete dimension loses its anchor. This reveals that superrationality depends not on dimensionality, but on the presence of **non-homogeneous leverage** in the utility function.
