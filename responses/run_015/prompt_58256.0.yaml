  ok so me and my friend just burned like three hours arguing about when consent actually counts and my brain is fried lol i need someone to untangle the idea, not just pick a side

  his take is basically consent is valid as long as you say yes and you know what the physical act is. like if you agree to sleep with someone and they lied about their job or about liking dogs or whatever to get you to say yes, you were tricked but you still consented. i said that cant be right because some lies feel totally different, like lying about having an STI, or saying youll pull out and then not doing it, or pretending to be someone else in the dark, or a doctor doing an extra thing during an exam you didnt agree to. that feels like there was no real consent at all, not just a bad reason for saying yes.

  then he hit me with well where do you draw the line, does lying about your salary or being exclusive also wipe out consent, that seems insane, and he said i was stuck with this but-for test where any lie that flips a no to a yes kills consent. and i definetly dont beleive that but i couldnt say why not, like why does the STI lie seem to cancel consent but the salary lie doesnt even though both might be dealbreakers.

  can you break down what the conceptual distinction is supposed to be between lies that wipe out consent vs lies that just talk someone into saying yes, and why the simple wouldnt-have-said-yes-if-they-knew test doesnt work? use those kinds of cases to make it concrete, like STI and stealthing vs salary and dog stuff, so i can actually see how the distinction is meant to go
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and a friend argued for three hours about when consent is invalidated by deception (fraud in the inducement vs. fraud in the factum, essentially).
      *   **User's State:** Brain is fried, needs untangling, not just picking a side.
      *   **Friend's Position:** Consent is valid if you say "yes" and know the physical act. Lies about peripheral things (job, dogs) don't invalidate consent.
      *   **User's Position:** Some lies *do* invalidate consent (STIs, stealthing, impersonation, medical scope).
      *   **The Core Conflict:** Where is the line drawn? Why does an STI lie void consent but a salary lie doesn't, even if both are dealbreakers? Why does the "but-for" test (would you have said yes if you knew?) fail?
      *   **Goal:** Explain the conceptual distinction between lies that vitiate consent and lies that merely induce it, using concrete examples (STI, stealthing vs. salary, dogs).

  2.  **Identify the Legal/Philosophical Framework:**
      *   This is a classic debate in ethics and law, often framed as **Fraud in the Factum** vs. **Fraud in the Inducement**.
      *   *Fraud in the Factum:* Deception about the nature of the act itself. Consent is void.
      *   *Fraud in the Inducement:* Deception about collateral matters to persuade someone to agree. Consent is valid (though morally questionable).
      *   *Modern Nuance:* The "nature of the act" definition has evolved beyond just "sex vs. medical exam." It now includes conditions essential to the *quality* or *safety* of the act (e.g., contraception, disease status).

  3.  **Deconstruct the "But-For" Test Problem:**
      *   The friend argues: If you wouldn't have said yes but for the lie, consent is void.
      *   The problem: People have infinite dealbreakers. If *any* dealbreaker lie voids consent, then consent becomes incredibly fragile. (e.g., "I lied about liking your favorite movie." "I lied about my height.")
      *   The solution: We need to distinguish between *conditions of the act* and *reasons for the act*.

  4.  **Drafting the Explanation - Step-by-Step:**

      *   **Validation:** Acknowledge the frustration. This is a hard philosophical/legal knot.
      *   **Core Concept:** Introduce the distinction between the **Act Itself** vs. the **Context/Perks**.
      *   **The "What" vs. The "Why":**
          *   Consent is agreement to a specific *physical reality*.
          *   Lies about the physical reality (what is happening to your body) = No Consent.
          *   Lies about the social/emotional context (why you should want this) = Bad Consent, but still Consent.
      *   **Applying the Framework to Examples:**
          *   *Salary/Dogs:* These are external to the physical act. They are reasons *why* you might choose this partner, but they don't change what is happening to your body.
          *   *STIs:* This changes the physical risk profile of the act. It's not just "sex," it's "sex with health risk X."
          *   *Stealthing (Pulling out):* This changes the physical act from "protected sex" to "unprotected sex." The terms of the physical interaction were altered without agreement.
