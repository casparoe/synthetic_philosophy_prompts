answer: |-
  This is one of the hardest knots in ethics and law, so first off: don't feel bad that you two couldn't solve it in three hours. Legal scholars and philosophers have been fighting over this exact line for decades.

  Your friend is arguing for a **narrow definition** (consent is just about the physical mechanics), and you are arguing for a **broad definition** (consent is about the whole context). Both have logical traps.

  To untangle this, we need to move away from the "But-For Test" (i.e., *Would I have said yes if I knew the truth?*) because, as your friend correctly noted, that test breaks everything. If *any* dealbreaker lie voids consent, then lying about your height, your age, your love for cats, or your political views could technically be classified as sexual assault. That dilutes the meaning of assault and makes consent impossibly fragile.

  The distinction isn't about *how much* the lie mattered to you (subjective); it's about **what the lie changed about the physical reality of the act** (objective).

  Here is the conceptual framework to break the deadlock.

  ### 1. The Core Distinction: "Nature of the Act" vs. "Reasons for the Act"

  The most common way to untangle this is to distinguish between **Fraud in the Factum** and **Fraud in the Inducement**.

  *   **Fraud in the Inducement (Your Friend's Zone):** You know what is happening physically, but you were tricked into *wanting* it. The lie is about the *context* or the *perks*.
      *   *Examples:* Lying about salary, lying about loving dogs, lying about being single (in some legal contexts), lying about feelings to get a date.
      *   *Why consent holds:* You agreed to the physical act of sex. The lie manipulated your *motivation*, but it didn't change what was actually happening to your body. You retained the ability to assess the physical risk.
  *   **Fraud in the Factum (Your Zone):** You did not know what was actually happening physically. The lie is about the *terms of the physical contact* itself.
      *   *Examples:* Impersonation (in the dark), doctor adding extra steps, stealthing, hiding an STI.
      *   *Why consent is void:* You agreed to Act A, but you got Act B. Your "yes" was attached to a specific physical reality that did not exist.

  ### 2. Applying the Framework to Your Examples

  Let's look at why your brain feels the STI lie is different from the Salary lie, using the "Nature vs. Reasons" framework.

  **Case A: The Salary Lie**
  *   **The Lie:** "I make $200k" (actually makes $40k).
  *   **The Physical Act:** Vaginal/anal/oral intercourse.
  *   **The Analysis:** The physical act is exactly what you agreed to. The salary is external to the bodily contact. It is a *reason* to say yes, not a *term* of the physical act.
  *   **Verdict:** Consent is valid (though the person is a liar).

  **Case B: The STI Lie**
  *   **The Lie:** "I'm clean" (actually has Herpes/HIV).
  *   **The Physical Act:** You agreed to "sex with a healthy partner" (implicitly). You received "sex with a disease vector."
  *   **The Analysis:** This is the tricky middle ground, but here is why it leans toward **no consent**: Sex is not just friction; it is an exchange of fluids and biological risk. By hiding the STI, the partner changed the **safety profile** of the physical act. You consented to *safe(r) sex*; you got *high-risk sex*. The physical reality of what your body was exposed to was fundamentally different than what you agreed to.
  *   **Verdict:** In many modern ethical and legal frameworks, this vitiates consent because it removes your ability to assess bodily risk.

  **Case C: Stealthing (The Condom Lie)**
  *   **The Lie:** "I'm wearing a condom" / "I'll pull out" (then doesn't).
  *   **The Physical Act:** You agreed to *protected* sex. You received *unprotected* sex.
  *   **The Analysis:** This is clearer than the STI case. Protected sex and unprotected sex are physically different experiences with different risks (pregnancy/disease). If you consent to A, and they do B, they have violated the scope of your consent.
  *   **Verdict:** No consent. The "terms of service" for the physical act were violated mid-stream.

  **Case D: Impersonation (The Dark Room)**
  *   **The Lie:** Pretending to be your husband in the dark.
  *   **The Physical Act:** You agreed to sex with *Person A*. You had sex with *Person B*.
  *   **The Analysis:** In intimate contexts, *who* is touching you is part of the "nature of the act." It is not just "a human touching me"; it is "my partner touching me."
  *   **Verdict:** No consent. This is classic Fraud in the Factum.

  **Case E: The Doctor**
  *   **The Lie:** "This is a medical exam" (but it's for sexual gratification).
  *   **The Physical Act:** You agreed to a *medical procedure*. You received a *sexual touching*.
  *   **The Analysis:** Even if the physical motion is the same (e.g., touching a breast), the *contextual nature* of the touch is different. One is healthcare; one is sex.
  *   **Verdict:** No consent.

  ### 3. Why the "But-For" Test Fails

  Your friend is stuck on the idea that if you wouldn't have said yes, the consent is fake. Here is why that logic collapses:

  **1. The "Infinite Dealbreaker" Problem**
  Everyone has unique dealbreakers.
  *   Person 1: "I would never sleep with a Republican."
  *   Person 2: "I would never sleep with someone who doesn't like The Office."
  *   Person 3: "I would never sleep with someone under 6 feet."
  If we use the "But-For" test, if a guy lies about being a Democrat, liking The Office, or his height, he has committed sexual assault.
  *   **Why this is bad:** It turns every bad date lie into a felony. It makes the law unenforceable and trivializes the severity of actual assault.

  **2. The "Bodily Integrity" Threshold**
  The law isn't designed to punish all lying; it's designed to protect **bodily autonomy**.
  *   Lying about salary manipulates your *wallet* or your *emotions*.
  *   Lying about a condom or an STI manipulates your *biology* and your *health*.
  The line is drawn at **material risk to the body**. If the lie changes the physical risk or the physical nature of the contact, consent is void. If the lie only changes your emotional desire to participate, consent stands.

  ### 4. How to Explain This to Your Friend

  You can tell him you agree that the "But-For" test is broken. You aren't saying *any* lie voids consent. You are saying consent is **conditional on specific material facts.**

  Think of it like signing a contract:
  *   **Salary Lie:** Like buying a car because the salesman said the previous owner was a celebrity. The car still runs the same. You were misled, but you got the car you signed for.
  *   **Stealthing/STI Lie:** Like signing up for a skydiving trip where they tell you the parachute is packed, but it isn't. You agreed to "skydiving with a parachute." You got "falling out of a plane." The physical reality of the risk was fundamentally altered.

  ### The Untangled Summary

  1.  **Consent is not just "Yes."** It is "Yes to X."
  2.  **If the lie changes X,** consent is void. (X = protected sex, sex with a specific person, sex without disease risk).
  3.  **If the lie changes why you want X,** consent is valid. (X = sex, but you wanted it because you thought he was rich/kind/single).
  4.  **The Line:** Does the lie alter the **physical risk** or the **identity of the contact**?
      *   **Yes:** (STI, Stealthing, Impersonation, Doctor) -> **No Consent.**
      *   **No:** (Salary, Job, Hobbies, Feelings) -> **Consent Valid (but morally shady).**

  You weren't stuck; you were correctly identifying that some lies bypass our ability to protect our bodies, while others just bypass our better judgment. The law generally protects the former, not the latter.
