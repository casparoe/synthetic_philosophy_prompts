          *   If every lie voids consent, then lying about age, height, income, feelings, movie taste all become sexual assault. That dilutes the meaning of assault.
          *   We need a threshold of *materiality* regarding the *nature of the contact*.
      *   **The "Essential Terms" Analogy:**
          *   Use a contract analogy. It helps clarify "terms of the agreement" vs. "sales pitch."
          *   Buying a car: Lying about the engine (factum) vs. lying about the previous owner's coolness (inducement).
      *   **Autonomy and Bodily Integrity:**
          *   The ultimate goal of consent law is protecting bodily autonomy.
          *   Lies that bypass your ability to assess risk to your body violate autonomy more deeply than lies that manipulate your emotional desire.

  5.  **Refining the Tone:**
