prompt: |-
  hey so i'm taking a course on philosphy of language and we're digging into wittgenstein's private language arguement, but my prof mentioned this older framing from locke that supposedly sets up the problem. there's this bit in his Essay (book III, ch 2, around where he talks about words being voluntary signs of private mental ideas) that i'm struggling to parse. locke seems to say that since nobody can peek inside my head, words only work if we just assume other people have ideas close enough to ours, and he treats this like a practical limitation rather than a fatal flaw. he talks about how we attach sounds to our own internal notions and then use convention to bridge the gap, but he never really explains what makes one private attachment correct versus wrong—he just assumes that if the idea is clear to me, the word is properly anchored.

  could you help me understand exactly what locke is missing here from wittgenstein's point of view? specifically, our study group got stuck on whether wittgenstein's critique is mainly epistemic (like we can't verify our private words match reality) or normative/criterial (like there's no real distinction between seeming right and being right without public rules). i don't fully get the normative reading and how it applies back to locke's worry about matching private ideas to sounds. could you walk through the passage in those terms and point out where locke sneaks in an assumption about mental criteria that wittgenstein would reject? i know that's a pretty niche framing but our professor mentioned it in passing and i'm totally lost.
