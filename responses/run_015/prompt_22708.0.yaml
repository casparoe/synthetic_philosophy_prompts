      *   *The "Ethical Neutrality" Point:* Ramsey required propositions to be "ethically neutral" for probability measurement. Maybe the *structure* of the gamble isn't ethically neutral if certainty carries extra value.
      *   *Coherence Definition:* A Dutch Book requires a sure loss in *money/value*. If the agent values "certainty" intrinsically, there is no sure loss in *utility*, only in expected monetary value. Ramsey cared about utility, not money.

