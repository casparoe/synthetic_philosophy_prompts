answer: |-
  Based on your verdicts, you are not a pure Reductionist (who demands positive evidence for every testifier) nor a pure Anti-Reductionist (who trusts everything unless there is a specific defeater). You are a **Pragmatic Presumptivist**.

  You operate on a default setting of trust, but that default is heavily gated by **competence**, **directness**, and **stakes**.

  Here is the precise principle that captures your intuitions, followed by the application to your new case, the classification of your view, and the honest admission of where this principle strains.

  ### The Principle: Competence-Filtered Presumptivism

  **"Accept a speaker's testimony as justified belief if and only if:**
  1.  **Default Presumption:** The act of assertion itself generates a prima facie claim to truth (you do not need prior evidence of the speaker's reliability to start).
  2.  **Competence Constraint:** The content of the claim must fall within the speaker's apparent domain of direct perceptual access or institutional expertise.
  3.  **Transparency Constraint:** The claim must be a report of an occurrence (event, utterance, location) rather than an inference about hidden states (motives, emotions, causality).
  4.  **Stakes Modulation:** The level of justification required scales with the pragmatic cost of being wrong. Low stakes allow the default presumption to stand; high stakes require positive corroboration."

  ---

  ### Application to the New Case
  **Case:** *A stranger tells you something you can't check, but which, if true, would be very bad for you.*

  **Verdict:** **Withhold Belief / Skepticism.**

  **Application of Principle:**
  *   **Default Presumption:** Passed. They told you, so there is a starting claim to truth.
  *   **Competence:** Let's assume they seem to know (Passed).
  *   **Transparency:** Let's assume it's a factual claim (Passed).
  *   **Stakes Modulation:** **Failed.** Because the cost of error is "very bad for me," the default presumption is insufficient. The principle dictates that high stakes raise the evidentiary bar. Since you cannot check the claim (no corroboration) and have no prior track record with the stranger (no inductive support), you cannot meet the raised bar.

  **Result:** You do not believe them, not because testimony isn't a source of justification, but because the *amount* of justification provided by bare testimony is capped, and this case exceeds the cap.

  ---

  ### Classification: Which Camp Are You In?

  You are a **Hybrid**, but one that leans heavily toward **Anti-Reductionism with Reductionist Defeaters.**

  *   **Why you are Anti-Reductionist:** Your verdict on the **Stranger/Time** case is the smoking gun. A pure Reductionist cannot explain why you believe the stranger without citing inductive evidence (e.g., "people usually tell the time correctly"). You admitted you have *zero* evidence about that person. You trust the *act of telling* itself. This aligns with the Anti-Reductionist view (often associated with C.A.J. Coady or Tyler Burge) that testimony is a basic source of justification, like perception.
  *   **Why you smuggle in Reductionism:** Your skepticism in the **Stranger/Dog Bite**, **Celebrity**, and **News Report** cases relies on background beliefs about incentives, expertise, and filtering processes. You are using inductive reasoning (Reductionism) to *defeat* the default trust.

  **The Verdict:** You believe testimony is a basic source (Anti-Reductionist), but you believe its force is easily overridden by contextual factors regarding competence and stakes (Contextualism).

  ---

  ### Honest Friction Points: Where the Principle Strains

  You asked me to be honest about where this principle fails to accommodate your verdicts. There are two significant tensions in your data that this principle struggles to smooth over.

  **1. The History Book vs. News Report Tension**
  *   **Your Verdict:** You trust a history book (500 years removed) more than a news report (1 day removed).
  *   **The Principle's Struggle:** According to the **Directness Constraint**, the News Report is "closer" to the event (the memo) than the History Book is to its events. A pure "Directness" filter suggests you should trust the News more.
  *   **Why you actually believe the History Book:** This isn't about directness; it's about **Institutional Vetting**. You trust the *genre* of academic history (peer review, archival standards) more than the *genre* of breaking news (sensationalism, speed over accuracy).
  *   **The Fix:** The principle needs an addendum: *"Institutional Reliability can override Temporal Distance."* If you don't add this, the principle predicts you should trust the News more, which contradicts your intuition.

  **2. The Stranger/Time vs. Stranger/Dog Bite Tension**
  *   **Your Verdict:** You believe the stranger about the time (no evidence) but not the dog bite (no evidence).
  *   **The Principle's Struggle:** Both are strangers. Both are reports of occurrence. Both are within perceptual competence. The only difference is **Stakes/Relevance**.
  *   **The Hidden Reductionism:** If your only reason for doubting the dog bite is "stakes," that's fine. But often, the intuition there is actually: *"Strangers don't usually volunteer info about neighbor's dogs without a motive (gossip/malice)."*
  *   **The Friction:** If you are a true Anti-Reductionist, the *content* shouldn't matter for the *initial* justification, only for defeaters. But your intuition suggests the content itself (gossip vs. time) changes the *initial* warrant. This suggests you might be more Reductionist than you think: you implicitly assume a background norm that "time-telling is cooperative" but "gossip is suspect."
  *   **The Fix:** You have to admit that your "Default Presumption" isn't uniform. It is actually **Domain-Specific**. You have a high default for "cooperative coordination" (time) and a low default for "social gossip" (dog bite).

  ### Summary
  You are a **Contextualist Anti-Reductionist**. You treat testimony as a basic source of knowledge, but you recognize that the *strength* of that source is variable depending on the speaker's competence, the type of claim (observation vs. interpretation), and the stakes involved.

  To make your view fully coherent, you must accept that **"Default Trust" is not a single switch.** It is a dial that is pre-set differently for different social contexts (cooperative info vs. gossip vs. expertise) before the speaker even opens their mouth. If you accept that, your view holds together. If you insist the default must be identical for all strangers, your verdicts on Time vs. Dog Bite are contradictory.
