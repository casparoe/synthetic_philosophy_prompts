answer: |-
  This is a fantastic pedagogical game. Your supervisor is essentially running a simplified version of Kwame Anthony Appiah's *The Honor Code*, but she's hardening it into a heuristic that risks becoming unfalsifiable. If every shift in reputation counts as "honor," and every reputation shift is the "engine," then material interests and arguments become epiphenomenal by definition.

  Here is how she will likely play your three cases, which one actually tests her rule, and the specific verdict that should make you abandon the Honor reading.

  ### 1. Predicting Her Moves
  She has a consistent pattern: she treats **Honor** as the autonomous variable (the thing that shifts first) and **Interests/Arguments** as dependent variables (the excuses people give afterward).

  *   **The Collapse of Fur (1990s):**
      *   **Her Verdict:** **Honor.**
      *   **Her Logic:** She will argue that fur didn't disappear because it got too expensive or because synthetics got better (those were always available); it disappeared because it became *tacky*. Supermodels stopped wearing it; designers were shamed at protests; it shifted from a status symbol to a sign of cruelty. The economic loss followed the reputational collapse.
      *   **Risk:** This is her strongest case. It fits the Appiah mold perfectly.

  *   **The End of Apartheid (1994):**
      *   **Her Verdict:** **Honor.**
      *   **Her Logic:** She will acknowledge the sanctions (Interests) but dismiss them as secondary. She'll argue that the white Afrikaner elite capitulated because they could no longer sustain their self-image as "Western civilized people" while maintaining apartheid. The "Pariah Status" wasn't just about money; it was about being expelled from the club of nations.
      *   **Risk:** This is historically contentious. Many historians argue the economy was collapsing regardless of shame.

  *   **The Decline of the Death Penalty (US):**
      *   **Her Verdict:** **Honor.**
      *   **Her Logic:** She will downplay the DNA exonerations (Arguments) as merely providing the *ammunition* for shame, not the cause. She'll downplay the cost (Interests) as a post-hoc justification. She will claim states abolished it because they didn't want to be on the list with Iran and Saudi Arabia (the "Civilized Club" argument).
      *   **Risk:** This is her weakest case. The US is famously resistant to international opinion ("American Exceptionalism"), and the cost argument is empirically measurable in state budgets.

  ### 2. The Case That Tells the Rules Apart
  You should spring **The Collapse of Fur** on her.

  While Apartheid and the Death Penalty involve messy mixes of state finance, geopolitics, and law, Fur is a "pure" cultural market. It is the Appiah poster child. If her theory fails here, it fails everywhere.

  This case best distinguishes your two rules:
  *   **Her Rule (Honor):** The moral sentiment shifted autonomously (people realized it was cruel/shameful), and the market followed.
  *   **Your Rule (Interests/Load-Bearing):** The practice became economically/technologically load-bearing (synthetics offered a cheaper, viable alternative), which *allowed* the honor code to shift.

  ### 3. The Verdict That Kills the Honor Reading
  You should give up the Honor reading if she concedes the following verdict on Fur:

  **"The honor code shifted *because* the material interests changed."**

  Specifically, if she admits that fur only became "dishonorable" *after* synthetic alternatives made fur economically obsolete for the fashion industry, then **Honor is not the engine; it is the exhaust.**

  *   **Why this falsifies her rule:** Her thesis relies on Honor being an independent force (e.g., gentlemen stopped dueling even though it was still "manly," or Britain abolished slavery while it was still profitable). If she admits that society only developed the "honor code" against fur *because* the material cost of maintaining the old practice became unnecessary (due to synthetics), then she has conceded your "load-bearing" hypothesis.
  *   **The Trap:** If she insists Fur was Honor, ask her this: *"Would the anti-fur movement have succeeded if synthetic fur was still itchy, ugly, and expensive?"*
      *   If she says **No**, she admits material interests are a prerequisite for the honor shift (Your win).
      *   If she says **Yes**, she is claiming moral argument alone changed the fashion industry (which contradicts her skepticism about arguments).

  ### 4. Why Not the Other Two?
  *   **Apartheid** is too muddy. "Pariah status" blends Honor and Interests so tightly (shame causes sanctions, sanctions cause shame) that she can easily retreat into "it's both, but honor was the *spark*."
  *   **The Death Penalty** is a good test for her "Arguments" exception, but not her core Honor thesis. If she admits DNA (Arguments) drove the decline, she just has to expand her "Judicial Torture" exception. It doesn't break the Honor rule, it just creates another carve-out.

  ### Summary Strategy
  Play the **Fur** card. It is the cleanest test of whether **Honor drives History** or **History drives Honor**.

  *   **If she says Honor:** Ask about the technology. If the tech wasn't there, would the shame have worked?
  *   **If she says Interests:** She has admitted that in the most "cultural" case available, money/tech drove the change. If Honor isn't the engine in the fur trade, why is it the engine in the slave trade?
  *   **The Kill Shot:** If she agrees that **"Honor codes only shift when the practice is no longer load-bearing for the economy,"** she has effectively adopted your rule and abandoned Appiah's.
