answer: |-
  You have stumbled onto one of the most heated debates in modern philosophy of physics. Your intuition is sharp: these arguments *feel* different from standard empirical testing, and you are right to be suspicious of whether they count as "confirmation" in the traditional sense.

  There **is** an established name for this framework. It is called **Non-Empirical Confirmation** (sometimes grouped under **Non-Empirical Theory Assessment**).

  The philosopher of physics who codified this is **Richard Dawid**, primarily in his 2013 book *String Theory and the Scientific Method*. He explicitly identifies the three moves you listed as the three pillars of non-empirical confirmation. Here is how your three moves map onto his taxonomy:

  1.  **Your Move 1** ("nobody has come up with an alternative") is the **No Alternatives Argument (NAA)**.
  2.  **Your Move 2** ("stuff we didn't put in shows up for free") is the **Argument of Unexpected Explanatory Success (UES)**.
  3.  **Your Move 3** ("other theories got trusted this way before") is the **Meta-Inductive Argument (MIA)**.

  ### How this differs from "Argument from Ignorance"
  You asked how this is supposed to be different from plain ignorance ("absence of evidence isn't evidence of absence"). Dawid argues it is different because it relies on **Bayesian reasoning about the research process**, not just the lack of data.

  In a standard argument from ignorance, you say: "I haven't seen a ghost, so there are no ghosts."
  In the No Alternatives Argument, the claim is: "We understand the mathematical constraints on this problem well enough to know that finding a solution is extremely hard. Many smart people have searched this constrained space for decades and found only *this* solution. Therefore, the probability that this solution is unique (and likely true) increases."

  It shifts the evidence from the *world* (data) to the *process of science* (the difficulty of finding theories). Critics argue this is still risky because we might not understand the constraints as well as we think, but proponents insist it is a probabilistic update, not a logical fallacy.

  ### How this differs from "Beauty"
  You also asked how this differs from just finding a theory pretty. This distinction is captured in your second move (UES).

  Aesthetic judgment is subjective ("this equation looks elegant"). Unexpected Explanatory Success is structural ("we built this to explain quantum mechanics, and gravity popped out of the math without us adding it"). Proponents argue this isn't just beauty; it's **coherence**. If a theory solves Problem A and unexpectedly solves Problem B without extra parameters, that is treated as a form of explanatory power, even if Problem B hasn't been empirically verified in this specific context.

  ### The Controversy
  It is crucial to know that **Non-Empirical Confirmation is highly controversial**. Many philosophers of science (and physicists like Carlo Rovelli or Sabine Hossenfelder) reject the term "confirmation" entirely here. They argue that without empirical prediction, this is at best "trust" or "pursuitworthiness," not confirmation. They worry that calling it "confirmation" lowers the bar for what counts as science.

  However, to answer your specific question: Yes, there is a name for the practice of treating these three moves as confirmation. It is the framework of Non-Empirical Confirmation proposed by Dawid, and it explicitly covers all three moves you identified.

  \answer{Non-Empirical Confirmation (covers all three moves)}
