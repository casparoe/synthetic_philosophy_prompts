      *   *The "Spiritual Principle":* A nation is a soul, a spiritual principle.
      *   *Two Components:*
          1.  Possession of a rich legacy of memories (the past).
          2.  Actual consent, the desire to live together (the present/future).
      *   *The "Forgetting":* Renan explicitly says forgetting (even historical error) is essential for nation-building. Violence in the past (St. Bartholomew, religious wars) must be smoothed over to create unity.
      *   *The "Plebiscite":* "The existence of a nation is a daily plebiscite." It's not a one-time contract; it's continuous reaffirmation.

