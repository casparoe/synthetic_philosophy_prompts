      *   *Nuance:* "Talk is cheap" refers to cheap talk equilibrium (game theory). The Handicap Principle is specifically about *breaking* the cheap talk equilibrium when interests diverge. I need to make sure that distinction is clear.
      *   *Terminology:* Use terms like "Condition-Dependent," "Index Signals," "Common Interest," "Marginal Cost."

  7.  **Final Polish:** Check tone (academic but accessible), ensure all user questions are answered, and highlight the "overextensions." (The user asked for a menu of readings and which ones are supported).

