          4.  The Sen-Shift (What changes in protocol).
          5.  Closing thought on the "Measurement Problem."

      *   *Refining the "Philosophical Commitments":*
          *   *Causal Reductionism:* Reducing complex social systems to single exogenous variables (rain).
          *   *The Fact/Value Distinction:* Treating weather as "fact" and policy as "value/politics."
          *   *Moral Luck:* Distinguishing harm based on the *source* rather than the *outcome*.

      *   *Refining the "Inconsistency":*
