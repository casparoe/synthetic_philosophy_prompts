  8.  **Final Polish:** Ensure the language respects the user's expertise (e.g., using terms like "exogenous shock," "background noise," "operationalizable"). *Self-Correction: Make sure not to sound like I'm lecturing on Sen, but rather using Sen to analyze the bureaucracy as requested.*

