      *   Case: Tint $\rightarrow$ Shock. Early ERP change. Belief extinct.
      *   *Inference Model:* Can a forgotten belief be a premise? No. Premises must be held.
      *   *Conclusion:* The "inference" here is actually associative calibration. The word "inference" is doing no work other than describing a mathematical form (Bayesian updating), not a rational process. The penetration claim (that *beliefs* penetrate) fails here because the belief is gone, yet the effect remains. This supports impenetrability (the system is encapsulated from current belief) despite looking like "learning."

  6.  **Evaluating Alternative Analogies:**
      *   *Measurement:* Too passive. Doesn't account for ambiguity resolution.
      *   *Fixed-Lag Filter (Kalman/Control Theory):* Very accurate. Handles priors as gain parameters, not beliefs. Explains early ERP (feedback loops). Supports impenetrability (system dynamics $\neq$ rational revision).
