prompt: |-
  Compose a short story of roughly 800 to 1000 words dramatizing the clash between the self-sampling assumption and the self-indication assumption.
  Take the former to say you should reason as if you are a random sample from observers in your reference class, and the latter to add that a hypothesis predicting many more observers is proportionally more likely a priori because it makes your existence more likely.
  Set the story aboard a generation ship that has lost contact with Earth, where the crew must decide between two accounts of the colonization program: one on which only a handful of ships like theirs were launched, and one on which thousands were launched with many more people living aboard them.
