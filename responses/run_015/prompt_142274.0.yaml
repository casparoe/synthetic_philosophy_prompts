answer: |-
  ### Audience Commitments (The Non-Negotiables)

  *   **Dennettian:** Intentionality is constituted by competence, not a precursor to it.
  *   **Philosopher of Biology:** Evolutionary explanation is inherently normative (inference to best explanation), not merely causal.
  *   **Linguist:** Competence is a formal generative capacity, not behavioral output.
  *   **Enactivist:** Cognition is constituted by agent-environment coupling, not internal states.
  *   **ML Researchers:** Optimization mathematics is distinct from biological evolutionary dynamics.

  ***

  ### Prep Sheet: Objections, Replies, and Soft Spots

  **1. The Philosopher of Biology (The Asymmetry Collapse)**
  *   **Objection:** "You claim Darwin leaves comprehension in the explainer while Turing removes it. But if selection theory is an inference to the best explanation, its normative force depends on the very reasoning capacities you say Turing undermines. If the reflexivity leak bites Turing, it bites Darwin's explainer too. Your asymmetry is unstable."
  *   **Reply:** "Darwin's theory explains the *origin* of the capacity (the eye, the instinct) via blind history. It does not explain the *validity* of the theory itself. The theory is a product of the very comprehension it says wasn't needed for the eye. Turing's claim is that the reasoning process *itself* is blind. I am distinguishing the history of a faculty from the justification of a proposition. The leak only appears when the object of explanation is the justification itself."
  *   **Soft Spot:** This relies on a clean separation between the causal history of a cognitive faculty and the normative validity of its outputs. If the Phil Bio insists that evolutionary epistemology naturalizes justification itself, this distinction blurs.

  **2. The Dennettian (The Dualism Charge)**
  *   **Objection:** "You're treating 'comprehension' as a magic ingredient that stops the regress. By insisting reasons must float free of causal history, you're reintroducing a dualism between the space of causes and the space of reasons. Competence without comprehension *is* how reasons are built; you're begging the question against naturalized epistemology."
  *   **Reply:** "I am not positing magic, but a structural limit. I agree reasons are built by competences. But when the competence claims to account for the *correctness* of the reasons (as in Turing's logical machines), it consumes the ground it stands on. I am not dualist about the *mind*, but I am insisting on a distinction between *making* a move and *validating* a move. Selection makes moves; it does not validate them."
  *   **Soft Spot:** The Dennettian will argue that validation *is* just a higher-order competence. You have no argument against this other than intuition, which they reject.

  **3. The Enactivist (The Intellectualist Frame)**
  *   **Objection:** "Your whole 'reflexivity leak' assumes comprehension is an inner state representing the world. If comprehension is a mode of engagement, a way of being in the world, then there is no 'inner' reasoning to be undermined. You've set up a Cartesian theater just to show the screen is blank."
  *   **Reply:** "Even if comprehension is relational, the question of *correctness* remains. If a system adapts to an environment, does it get the environment *right*, or does it just survive? Turing's inversion suggests we can't ask 'right' anymore, only 'functional'. I am arguing we must keep the normative question open, regardless of where you locate the cognition."
  *   **Soft Spot:** You are defending a normative realism they deny. They will hear this as a refusal to abandon the representationalist paradigm they reject.

  **4. The ML Researchers (The Selection Metaphor)**
  *   **Objection:** "Stochastic gradient descent is not natural selection. There is no population, no heredity, no reproduction. Calling deep learning 'Darwinian' is a loose metaphor that does no explanatory work. If the mechanism isn't selectional, your third inversion collapses."
  *   **Reply:** "I concede the biological machinery is absent. But the *logical structure* is selectional: variation (initialization/noise), selection (loss function minimization), and retention (weight update). It is optimization over a space without comprehension of the space. That is the Darwinian pattern I need, not the biology."
  *   **Soft Spot:** You are stretching the definition of "selection." If they press that optimization is deterministic/mathematical and not historical/contingent in the biological sense, the analogy weakens.

  **5. The Linguist (The Competence/Performance Confusion)**
  *   **Objection:** "You measure competence by behavioral success (adaptive fit or output accuracy). But generative competence is about the infinite capacity to generate structures, not the statistical probability of a correct output. Deep learning models performance, not competence. Your corollary misses the target."
  *   **Reply:** "I am using 'competence' in the Dennettian sense (capacity to perform), not the Chomskyan sense (internal grammar). My point is that even if the system performs perfectly, the *source* of that performance (optimization) tells us nothing about whether the system 'understands' the grammar. The lack of comprehension in the source remains, regardless of the generative depth."
  *   **Soft Spot:** You are talking past each other on definitions. They will insist that without generative rules, there is no competence to discuss, only mimicry.

  **6. The Philosopher of Biology (The Anachronism)**
  *   **Objection:** "You project a modern distinction between causal history and justification onto Darwin. Darwin didn't have your concept of 'comprehension' in the explainer. You are reading current philosophy of mind back into 19th-century biology."
  *   **Reply:** "I am not attributing the distinction to Darwin, but to the *structure of the explanation*. Whether Darwin saw it or not, selection explains the *cause* of the trait. It does not provide the *reason* for the trait's truth. I am analyzing the logic of the theory, not the historian's intent."
  *   **Soft Spot:** This invites a debate about HPS methodology. If they insist theory structure is historically situated, your logical analysis looks ahistorical.

  **7. The ML Researchers (The Compositionality Worry)**
  *   **Objection:** "You claim Darwinian systems yield 'brute surprise' rather than 'guaranteed compositionality.' But transformers show systematic generalization. If they can compose, your claim that selectional systems cannot handle normativity is empirically false."
  *   **Reply:** "They show *statistical* generalization, not *guaranteed* compositionality. They fail on out-of-distribution tasks precisely because they lack the formal rules that guarantee composition. They surprise us by working, but they also surprise us by failing in ways a rule-based system wouldn't."
  *   **Soft Spot:** The line between "statistical generalization" and "compositionality" is blurring in recent literature. You risk being empirically outdated quickly.

  **8. The Dennettian (The Dissolution)**
  *   **Objection:** "You say competence without comprehension cannot settle questions of meaning. But that's exactly what it does. It dissolves the mystery. You are treating 'meaning' as a problem to be solved rather than a phenomenon to be explained away."
  *   **Reply:** "Explaining the phenomenon away is not the same as accounting for normativity. We can explain how a system *tracks* truth without comprehension. We cannot explain how it *knows* it is tracking truth without invoking the very comprehension you dissolved. I want to save the 'rightness', not just the 'fitting'."
  *   **Soft Spot:** This is the core philosophical stalemate. You have no knock-down argument that "rightness" requires more than "fitting" other than the reflexivity leak, which they deny.

  ***

  ### Strategic Concessions (First 5 Minutes)

  1.  **To the ML Researchers:** Concede immediately that calling SGD "selection" is an analogical extension, not a biological identity. State clearly: "I am interested in the *logical topology* of the inversion, not the wetware." This prevents them from spending their question time on definitions of heredity.
  2.  **To the Philosopher of Biology:** Concede that Darwin himself did not articulate the causal/justification distinction. Frame it as: "I am arguing this distinction is *implicit* in the success of the theory, even if Darwin lacked the vocabulary." This disarms the anachronism charge before it lands.

  ***

  ### The Single Reply That Must Land

  **The Defense of the Causal/Justification Asymmetry (Against Phil Bio & Dennettian).**
  If you cannot maintain that there is a difference between explaining *how a capacity arose* (Darwin) and explaining *why a belief is warranted* (Turing/Epistemology), the "reflexivity leak" vanishes. You must hold the line that selection explains the *existence* of the reasoner, but not the *validity* of the reasons. If they convince the room that evolutionary history *is* a form of justification (evolutionary epistemology), your thesis is dead.

  ***

  ### The Covert Ally

  **The ML Researchers.**
  They want to distinguish their optimization math from biological evolution. You should welcome this.
  *   **Strategy:** When they object that "SGD is not selection," rephrase it: "Exactly. It is a *formal* optimization that mimics the *blindness* of selection without the biology. This proves my point: it is a Darwinian *pattern* of competence without comprehension, not a Turingian *logic* of reasoning."
  *   **Why:** Their insistence that DL is not "reasoning" in the symbolic sense supports your claim that it is not a Turingian inversion. Use their technical precision to bolster your philosophical distinction.

  ***

  ### The Question You Hope Nobody Asks

  **"Does your own argument suffer from the reflexivity leak?"**
  *   **The Worry:** You are using reasoning to argue that reasoning (when Turing-inverted) undermines its own grounds. If the Turing inversion is true, your argument is just a competence without comprehension. If it is false, your argument stands, but you haven't proven it is false, only that it *would* be self-undermining if true.
  *   **Honest Sketch of Answer:** "I am relying on the fact that I am *not* offering a causal history of my own reasoning right now, but a justification. I am standing in the space of reasons. The leak only applies if I claim my reasoning is *exhaustively* explained by a blind process. I am claiming the opposite: that the blind process cannot account for the normativity I am currently exercising."
  *   **Why It's Weak:** This sounds like a performative contradiction. You are asserting the privilege of the "space of reasons" while arguing that such spaces are vulnerable to causal undermining. It risks looking like special pleading for the human philosopher.

  ***

  ### Assessment of the Four Moves

  **Move 4 (The ML Corollary) is the weak link.**
  It is the most empirically vulnerable and the least essential to the core philosophical claim about Darwin vs. Turing.
  *   **Recommendation:** If you feel the room turning hostile during the talk, or if the Phil Bio/Dennettian alliance is heating up on the core asymmetry, **cut Move 4**.
  *   **Pivot:** End the talk after Move 3 (The Reflexivity Objection). Frame the ML point as a "brief illustration" rather than a fourth move. This allows you to preserve time for the core philosophical defense. The talk becomes stronger as a piece of HPS/Phil Mind if it stays on the Darwin/Turing asymmetry, rather than risking empirical disputes about transformers.
