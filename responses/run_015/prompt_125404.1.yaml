      *   *Jonas:* Sure, but the boundaries are fuzzy. 1996 vs 1997? That's marketing. Compare that to kids who turned 16 in 2020. That's a real shock.
      *   *Mira:* But even that group gets lumped into Gen Z. The institutional kind swallows the real cohort.
      *   *Jonas:* Exactly, which makes "Gen Z" a bad kind. It's too blurry.
      *   *Mira:* Kinds don't need sharp boundaries to have causal power. Think of "recession."
      *   *Jonas:* Recession has metrics. Gen Z has Pew Research Center vibes.
      *   *Ending:* They agree it's an institutional kind but disagree on whether the fuzziness kills its ontological status.

  5.  **Polishing the Voice:**
      *   Make sure they interrupt each other.
      *   Ensure the "causal inertia" vs. "APC problem" distinction is clear but woven into natural speech.
      *   Check the verdict line requirement.

  6.  **Final Review against Constraints:**
