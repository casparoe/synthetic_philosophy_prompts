answer: |-
  Mira: You're staring at that coffee like it holds the answer to the reading, Jonas.

  Jonas: I'm staring at it because I'm trying to figure out if I'm exhausted because I'm thirty, because it's 2024, or because I was born in 1994. That's the problem.

  Mira: That's exactly the point, though. You're feeling the causal inertia. It's not just a label. Once you slap "Millennial" on a slice of birth years, the institutions start carving reality to fit the mold. Student loan policies, housing markets, marketing funnels—they all treat that slice as a unit. That feedback loop makes the people inside it causally similar, regardless of whether the boundary was arbitrary to start with.

  Jonas: But that's just reifying a statistical artifact. You're describing the age-period-cohort identification problem and calling it ontology. When you see a pattern in "Gen Z," how do you know it's not just an age effect? Maybe twenty-year-olds have always been anxious. Or maybe it's a period effect—everyone is anxious because of the news cycle. You can't isolate the cohort variable without confounding the other two.

  Mira: I don't need to isolate it in a regression model to know it's real socially. If the Federal Reserve designs inflation policy assuming a certain consumption pattern for people aged twenty to thirty, and HR departments structure benefits around "young workers," those institutional facts bite. The label creates the channel through which causal forces flow. It's an institutional kind, like "recession" or "credit score." It exists because we built machinery that relies on it existing.

  Jonas: Okay, but "recession" has metrics. Two quarters of negative GDP. Where does Millennial end and Gen Z begin? 1996? 1997? There's no causal shock at midnight on December 31st, 1996. That's a marketing department picking a number so they can sell ad space. An ontological kind needs boundaries that track something in the world, not something in a budget meeting.

  Mira: Boundaries are always fuzzy in social ontology. Think about "neighborhood." Where does one end and the next begin? Often it's at a street everyone agrees on, even if the housing stock doesn't change abruptly. But people treat it as real. Schools zone based on it. Police patrol based on it. The fuzziness doesn't stop the causal power. If Pew Research says you're Gen Z, algorithms feed you different content than they feed a Millennial. That changes your worldview. That's real causal inertia.

  Jonas: I'll grant you the algorithms bite. But contrast that with what I'd call a real cohort. Take kids who turned sixteen during the COVID lockdowns. There's your boundary. Non-arbitrary. They all missed driver's ed, they all had prom canceled, they all hit the labor market during a supply shock. That's a shared causal history, not a shared label.

  Mira: But nobody calls them "The Lockdown Cohort" when writing policy. They get lumped into Gen Z. The institutional kind swallows the real cohort. If I'm born in January 1997, I get grouped with the lockdown teens for most social purposes, even if my experience was totally different. The institutional kind is the one doing the work, Jonas. The "real" cohort you want is ontologically pure but socially inert.

  Jonas: It's not inert if we recognize it. But if we keep using the marketing slices, we're building theory on sand. You say causal inertia makes the kind real. I say the lack of sharp boundaries makes it a fiction. If I can move from one kind to another just by being born six months later, but the treatment I receive changes drastically, then the kind isn't tracking a natural or even stable social cluster. It's tracking a brand.

  Mira: So you think kindhood requires sharp boundaries? That's a high bar. Most social kinds are messy. "Refugee," "citizen," "class." They all have edge cases. But we don't say class is a fiction because someone is barely working-class. We look at the structural position. Generations are structural positions in the labor and housing market, stabilized by the narrative.

  Jonas: Class is based on relation to means of production. That's a mechanism. "Gen Z" is based on birth year plus a vibe. My worry is that by calling it an institutional kind, you're giving too much credit to the marketers. You're saying because they drew a line, a kind emerged. I'm saying the line is fake, so the kind is fake, even if people believe in it. Belief doesn't fix the APC problem.

  Mira: Belief fixes everything in social ontology. Money is paper until we believe it's not. Generations are birth years until policy treats them as units. The inertia comes from the treatment, not the biology. You want a causal shock to define the kind; I'm saying the institutional recognition *is* the shock.

  Jonas: Then we're stuck with kinds that shift every time a marketing firm rebrands. That makes ontology impossible. You can't study the causal powers of "Millennials" if the definition changes depending on who's selling cars.

  Mira: Then you study the institution that stabilizes the definition. Pew, Census, HR departments. They lock the boundary in place long enough for the inertia to kick in. It's not perfect, but it's real enough to break things.

  Jonas: Real enough to break things, maybe. But not real enough to explain *why* they break. You need the lockdown cohort for that, not the marketing slice.

  Mira: Maybe we need both. The label for the structure, the shock for the mechanism.

  Jonas: I can live with that, as long as we admit the label is the fiction doing the heavy lifting.

  Mira: And I'll admit the fiction only works because the machinery behind it is real.

  Verdict: They agree generations function as institutional kinds with causal power but remain divided on whether marketing-derived boundaries are sufficient for ontological legitimacy compared to event-based cohorts.
