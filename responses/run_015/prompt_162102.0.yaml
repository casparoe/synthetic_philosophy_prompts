      *   *Effects:* Good for Curator/Oracle. Bad for Confabulator/Incompetence.
      *   *Process:* Good for Understudy. Bad for Amnesiac/Ventriloquist.

  7.  **Review against Constraints:**
      *   Did I mark Non-Negotiable vs. Taste? Yes.
      *   Did I address the specific cases? Yes, in the rationale.
      *   Did I address structural questions? Yes, embedded in criteria.
      *   Did I flag the collision? Yes.
