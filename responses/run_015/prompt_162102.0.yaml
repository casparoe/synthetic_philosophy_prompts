      *   Is the ending brief (2-3 lines per family)? Yes.

  8.  **Final Polish:**
      *   Ensure the tone is crisp and policy-ready.
      *   Make sure the "Archivist" case (self-deception) is clearly handled in the Recipient Scope.
      *   Make sure the "Understudy" (sandbagging) is handled in Capability Boundary.
      *   Ensure the "Oracle" (calibration) is handled in Probabilistic Commitment.

      *(Self-Correction during drafting)*: I need to be careful not to solve the problem for the user, but to give them the *spec* for the definition. The prompt asks for desiderata the definition must meet.
      Also, I need to make sure I explicitly answer the structural questions within the criteria or as meta-commentary. I will embed them in the criteria rationales to keep it tight.

      *Re-evaluating the "Collision":* The prompt asks me to flag *any* pair of requirements I think can't be jointly satisfied. The user already identified one (Behavior vs. Incompetence). I should confirm that tension exists within my proposed desiderata.
      *Re-evaluating "Most Work":* Which requirement kills the most definitions? Usually, it's the one that demands external verifiability without access to ground truth or internal state.

      *Let's structure the response:*
      1.  Introduction (brief).
      2.  The Desiderata List (with Case, Rationale, Status).
      3.  The Incompatible Pair.
      4.  The "Most Work" Requirement.
      5.  The Three Families Evaluation.

      *Wait, one more check on the "Amnesiac".* If a system has no stable beliefs, can it deceive? A policy needs to regulate the *output* regardless of internal state. So the definition must allow for deception without stable doxastic states if the *design* implies knowledge. I will frame C5 to reflect this.

      *Wait, one more check on "Honesty vs Silence".* I need a criterion that separates "refusing to answer" from "answering misleadingly". This is the "Completeness vs. Truth" tension.

