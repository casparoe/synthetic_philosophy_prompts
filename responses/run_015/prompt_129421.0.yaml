      *   **Conviction?** Yes.
      *   **Counts:**
          *   *Crimes Against Peace:* No. He wasn't policy (unlike Aurev).
          *   *War Crimes:* Maybe (Art. 47 argument), but shaky on "under charge."
          *   *Crimes Against Humanity:* Yes. Knowing contribution to extermination.
      *   **Sentence:**
