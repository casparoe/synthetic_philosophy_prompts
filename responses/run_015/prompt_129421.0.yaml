      *   *Resolution:* The tribunal must distinguish *Intent*. Blockade/Bombing = Strategic/Military necessity (collateral death). Transports = Extermination (primary purpose). This allows the Sene judge to vote Convict without condemning the Blockade.

  5.  **The "Further Case" to Clarify Rules:**
