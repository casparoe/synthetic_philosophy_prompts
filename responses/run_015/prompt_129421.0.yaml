      *   *Check Baas:* Baas got 3 years. He had *no* exit. Vey had an exit. This is the key differentiator. The tribunal must punish the *choice* to stay.
      *   *Check Tell:* Tell acquitted on bombing. Why? "Law unsettled" + "Victors did it." Vey's act (deportation to death) is not "unsettled" in the same way (Aurev precedent: crimes against peace of the world). And Victors didn't run death camps (Blockade is distinct).
      *   *Sentence:* If Kel (civilian, no exit issue) got 7, and Vey (military, had exit, but sabotaged) is in play... 7 years feels right for consistency with Kel, but 9 emphasizes the "Exit" factor from Baas. Let's go with **8 years**. It splits the difference. It says "You are worse than Baas (3), slightly worse than Kel (7) because you were military administration, but better than Sera because you didn't design it."
      *   *Actually, looking at the prompt:* "Where does the sentence sit against Baas's three years and Kel's seven?"
      *   If I convict, it *must* be more than 3 (Baas) because Vey had an exit.
      *   Should it be more than 7 (Kel)? Kel built the ovens. Vey filled them. Vey is more direct. But Vey sabotaged. Kel did not.
      *   Let's argue for **10 years**. It emphasizes that "Having an exit and not taking it" is a major aggravator, outweighing the minor sabotage. It reinforces the *Baas* logic (liability tracks options).

      *   *Wait, one more check:* The Sene Judge's problem. The Sene Judge called the Blockade lawful. If Vey is convicted of "Crimes Against Humanity" for moving people to death, does that implicate the Blockade?
      *   *Distinction:* The Blockade was a *method of war* with collateral starvation. The Transports were *extermination*. The Judge needs to articulate this difference to save face. "The law of war permits hardship; it does not permit administration of death."

