          *   *Counter:* Aurev established that "some acts are crimes... whatever any statute says." Transporting people to known death camps is likely in this category, unlike area bombing or blockades which are traditionally accepted tools of war (even if horrific).
          *   *Distinction:* Blockade/Bombing = Collateral damage/strategic necessity (in the eyes of the tribunal). Transports = Specific intent to remove/destroy a population.
