      *   *Why:* This tests the "under charge" (Varenne Art 47) and the "Blockade Lawfulness" limit. If Vey is guilty for trains, is the Coalition officer guilty for food? If yes, the tribunal is truly principled. If no, the *Tell*/*Sene* hypocrisy is cemented.
      *   *Alternative:* A defendant who *did* take the exit (transferred) but was replaced by someone worse. Does the act of transferring absolve? This tests the *Baas/Vey* "Exit" rule.
      *   *Selection:* The "Transfer" case. It directly tests the *Baas/Vey* distinction on "Exit Options." If Vey is convicted because he *didn't* transfer, what happens to the guy who *did*?

  6.  **Drafting the Judge's Statement:**
