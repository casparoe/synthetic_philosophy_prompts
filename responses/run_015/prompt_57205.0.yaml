  **Scenario**

  Elara works at an automated toll registry where passing vehicles are assigned unique alphanumeric IDs by a sensor array. One morning, a single sedan passes through the lane. Due to a firmware glitch, the system registers the passage twice in rapid succession, generating two distinct records: "Vehicle-Alpha" and "Vehicle-Beta." Elara reviews the log. She knows the complete causal history of both names: she knows they were produced by the same sensor array, during the same millisecond window, via the same naming protocol. She holds the two digital records side-by-side; they are qualitatively identical in every metadata field (timestamp, location, sensor ID) except for the vehicle ID itself. There is no descriptive predicate she can articulate to distinguish the source of "Vehicle-Alpha" from "Vehicle-Beta" other than the ID strings themselves.

  Operating under the standard assumption that one record equals one vehicle, Elara begins processing. She asserts, "Vehicle-Alpha paid the standard rate," and "Vehicle-Beta paid the standard rate." Both claims are true. She also notes, "Vehicle-Alpha is a sedan," and "Vehicle-Beta is a sedan." Both are true. She treats them as distinct entities in her inventory system, allocating separate budget lines for each. The discovery occurs only when physical audit confirms only one car passed the gate. She realizes "Vehicle-Alpha is Vehicle-Beta." This identity is an empirical shock; it collapses her inventory count from two to one. Yet, "Vehicle-Alpha is Vehicle-Alpha" remains trivial and a priori throughout.

  **Walkthrough**

  **Fregean Sense:**
  A Fregean is forced to assign a sense to each name that individuates them despite the identical causal history. Since Elara knows the source and protocol are identical, the sense cannot be descriptive (e.g., "the vehicle named by the morning shift"). The only available difference is token-indexical: the sense of "Vehicle-Alpha" is roughly *the name token appearing in the first log entry*, and "Vehicle-Beta" is *the name token appearing in the second log entry*. Is this metalinguistic sense available to her? Yes, she can demonstratively identify the two records ("this entry" vs. "that entry"). Does this wreck the triviality of self-identity? No. "Vehicle-Alpha is Vehicle-Alpha" translates to *the referent of this token is the referent of this token*, which is logically trivial. "Vehicle-Alpha is Vehicle-Beta" translates to *the referent of this token is the referent of that token*, which is contingent and empirical because it depends on whether the two tokens were generated by one object or two. The Fregean survives, but only by retreating to a sense that is purely metalinguistic and demonstrative.

  **Direct Reference:**
  The direct-reference theorist claims the proposition expressed by "Vehicle-Alpha is Vehicle-Beta" is identical to "Vehicle-Alpha is Vehicle-Alpha" (both are <Object, Identity, Object>). The informativeness is not semantic but psychological. Elara learned that two distinct *mental files*—opened by the two distinct log entries—should be merged. She didn't learn a new fact about the world (the car was always one); she learned a new fact about her own representational system (her two files track the same thing). The "work" is done by cognitive architecture, not semantic content.

  **Mental Files/Dossiers:**
  Using the mental files idea is explicitly a claim about her mind, not the language. The language simply provides the tags ("Vehicle-Alpha", "Vehicle-Beta") that open the files. However, relying on this concedes the point to Frege if the "file" is just a psychological realization of "sense." If the file *is* the mode of presentation, then the direct-reference theorist has smuggled sense back in as a cognitive constraint. To remain a direct-reference theorist, one must insist the files are merely causal mechanisms for tracking, not constituents of the proposition. The case shows that without something *like* files (or senses), the difference in cognitive significance is inexplicable.

  **The Single Feature:**
  The feature doing all the work is the **system glitch producing duplicate tokens from a single event**. Delete this: if the system works correctly, only one record ("Vehicle-Alpha") is generated. There is no second name, no second file, and no identity statement to evaluate. The case collapses into a standard singular claim. Alternatively, if the glitch produced records with *different* metadata (e.g., different timestamps), the identity would rest on a descriptive difference ("the car at 09:00" vs. "the car at 09:01"), violating Constraint 1. The glitch ensures the histories are qualitatively identical, forcing the identity to be purely numerical.

  **Best Fregean Objection:**
  A sharp Fregean would argue that I haven't eliminated descriptive difference, I've just hidden it. She *can* articulate a difference: "Vehicle-Alpha is the name in the first record, Vehicle-Beta is the name in the second." This *is* a descriptive difference ("the name associated with record #1"). If this description constitutes the sense, then the case is just a variant of "The Morning Star is the Evening Star" (The name in Record 1 vs. The name in Record 2). The objection presses that if I deny this is a descriptive difference, I am left with a "sense" that is ineffable—a bare numerical this-ness that looks suspiciously like the reference itself. If the sense is ineffable, it cannot explain cognitive significance, because explanation requires articulation. If it is articulable (as "Record 1"), then Constraint 1 is violated, and the case is just standard descriptive identity disguised as a glitch.
