      *   *Wait, the "Read-Ahead" students.* If they know Rawls, they know "Separateness of Persons." I need to give them a task that prevents them from shouting it. "Auditors" is good. They count chips. They ensure rules are followed. They are the "Bureaucrats of Utility." It fits the theme ironically.

      *   *Timeline Check:* 90 mins is tight. I need to be strict on timekeeping.
      *   Phase 1: 15 mins.
      *   Phase 2: 25 mins.
      *   Phase 3: 25 mins.
      *   Debrief: 25 mins.
      *   Total: 90.

