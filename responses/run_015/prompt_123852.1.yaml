answer: |-
  Here is a complete run-sheet for a 90-minute seminar section. It is designed to be low-tech, high-engagement, and philosophically precise without using jargon until the reveal.

  ### **Activity Title:** "The Ledger and The Life"
  **Materials Needed:**
  *   **Poker Chips:** 3 colors (e.g., White, Blue, Red). Approx. 20 per student.
  *   **Index Cards:** 20 blank (for "Veto" cards).
  *   **Sticky Notes:** 1 pad (for "Grievances").
  *   **Snacks:** 18 "Premium" (e.g., chocolate bar) and 18 "Standard" (e.g., generic cookie).
  *   **Chore List:** Written on the whiteboard (e.g., "Erase all boards," "Stack all chairs," "Organize the handout pile," "Wipe the whiteboard rails").
  *   **Pre-Class Survey Data:** Printed list of each student's preferred snack and most-hated chore.

  **Roles:**
  *   **The TA (You):** The "System." You enforce rules, hold the snack stash, and assign chores.
  *   **The Auditors (2 Students):** *Assign this to the two students who have read ahead.* Their job is to count chips at the end of every phase and verify that the "Ledger" (whiteboard) matches the physical chips. They are forbidden from participating in votes or debates; they are neutral arbiters. This keeps them busy, gives them status, and prevents them from spoiling the theoretical reveal.

  ---

  ### **Timeline & Script**

  #### **0:00 – 0:10 | Setup & Stakes**
  *   **Action:** Hand out 10 **White Chips** to every student. Explain the economy:
      *   **5 Chips** = Premium Snack at the end.
      *   **3 Chips** = Standard Snack.
      *   **0–2 Chips** = Must perform one Chore from the board.
      *   **Negative Chips** = Must perform two Chores.
  *   **Rule:** Chips are non-transferable *unless a specific Phase Rule allows it.*
  *   **Opt-Out Mechanic:** Hand every student one **Index Card**. Tell them: *"If at any point a rule requires you to lose chips or do a chore you fundamentally refuse, write 'VETO' on this card and slide it to me. I will absorb the cost (I do the chore), but the action stops."*
  *   **Auditors:** Give the two read-ahead students the chip bags and the master ledger sheet. Tell them: *"Your job is accuracy. If the math doesn't add up, you halt the game."*

  #### **0:10 – 0:25 | Phase 1: The Single Life (Time)**
  *   **Goal:** Establish that aggregation across *time* is uncontroversial.
  *   **Scenario:** "You are living two weeks. Week 1 is now. Week 2 is the end of class."
  *   **Mechanic:**
      1.  **Investment:** Students may voluntarily surrender **4 White Chips** now.
      2.  **Return:** In Week 2 (end of class), the System returns **8 Chips** of a new color (**Blue Chips**).
      3.  **Constraint:** White Chips expire immediately if not invested or kept. Blue Chips are the only ones redeemable for snacks.
  *   **The Trap:** There is no social element. It is purely prudence.
  *   **Expected Outcome:** Almost everyone invests. Sacrificing now for more later is rational.
  *   **TA Note:** Do not comment on *why* this is fine. Just process the transactions.
  *   **Audit:** Auditors verify everyone has the correct number of Blue Chips.

  #### **0:25 – 0:50 | Phase 2: Separate Persons (Identity)**
  *   **Goal:** Introduce the "Separateness of Persons" objection without naming it. Make the cost land on a specific body.
  *   **Setup:** Students keep their Blue Chips. These are now **Color-Coded by Person** (stick a small dot of colored tape on the chips corresponding to their seat, or just track by honor system/Auditors).
  *   **Scenario:** "A Crisis has occurred. The System is short on snacks. We need to generate 20 extra chips to ensure everyone gets at least a Standard Snack."
  *   **Mechanic:**
      1.  **The Proposal:** The group must vote on a **Tax Scheme**.
      2.  **Option A (Utilitarian):** Take 5 chips from the 4 richest people. (Total pain: 4 people drop a snack tier).
      3.  **Option B (Egalitarian):** Take 1 chip from everyone. (Total pain: 18 people slightly annoyed, but no one loses a snack tier).
      4.  **Option C (Scapegoat):** Take 20 chips from **1 volunteer**. (That person gets 0 chips, must do 2 Chores. Everyone else is safe).
  *   **The Twist:** If a student ends up with <3 chips, they must stand up and write a **Grievance** on a sticky note. They must stick it on the whiteboard and read it aloud: *"I am [Name], and I lost [X] for the sake of [Y]."*
  *   **The Rule:** The group cannot finish Phase 2 until the Ledger shows +20 chips generated.
  *   **Expected Friction:** Students will resist Option C. They will feel Option A is unfair to the "rich." They will likely choose Option B (spread the pain), even though Option A maximizes snack utility.
  *   **Handling Veto:** If the one volunteer in Option C plays a Veto, you (TA) do the chore. Acknowledge it silently. This demonstrates a "Right" trumps the "Good."
  *   **Audit:** Auditors verify the +20 chips are in the System Bank.

  #### **0:50 – 1:15 | Phase 3: Blurred Boundaries (Degrees of Distinctness)**
  *   **Goal:** Destabilize the resistance from Phase 2 by making "persons" less distinct.
  *   **Setup:** Select **3 Volunteers** (or assign randomly if no volunteers). These three sit together.
  *   **The Rule Change:** "For this round, these three students constitute a **Single Moral Unit** (The Triad)."
      *   They must pool their Blue Chips into one pile.
      *   They share **One Grievance Token**. If *any* of them suffers a loss, they all sign the *same* sticky note. It counts as **one complaint**, not three.
      *   They must vote unanimously as a block.
  *   **Scenario:** "The System needs another 10 chips. We can take them from **The Triad** or from **Three Individuals** (randomly selected from the rest)."
  *   **The Math:**
      *   Take from Triad: 1 Unit suffers. 1 Grievance filed. (But 3 physical bodies feel it).
      *   Take from Individuals: 3 Units suffer. 3 Grievances filed.
  *   **The Decision:** The class votes.
  *   **The Ambush:**
      *   If they vote to sacrifice the **Triad**: Ask the Triad, *"Does it feel fair that your three bodies count as one complaint?"*
      *   If they vote to sacrifice the **Individuals**: Ask the Class, *"Why did you protect the Triad? Are they less real than the Individuals?"*
  *   **The "Degrees" Mechanic:** Halfway through the debate, interrupt. *"New Data: The Triad's psychological link is only 50% strong. Their Grievance now counts as 1.5 complaints."* Force them to re-vote.
      *   *Why this works:* It forces them to admit that their moral calculation depends on the *degree of connection*, not just the raw sum of pleasure/pain. Utilitarianism usually treats the connection as binary (same person vs. different person). This breaks the binary.
  *   **Audit:** Auditors verify the final chip counts.

  #### **1:15 – 1:25 | Debrief (The Mapping)**
  *   **Do not lecture yet.** Ask three questions. Write answers on the board.
      1.  *"In Phase 1, why was it obvious you should sacrifice chips?"* (Answer: It's my life. I benefit later.)
      2.  *"In Phase 2, why did Option C (Scapegoat) feel wrong, even if it saved the most snacks?"* (Answer: It's not fair to one person. We are separate.)
      3.  *"In Phase 3, did the Triad deserve more protection or less? Does it matter if they feel connected?"* (Answer: Confusion. If they are connected, maybe it's like Phase 1. If not, it's Phase 2.)
  *   **Connect the Dots:**
      *   Phase 1 = **Prudence** (Aggregation within a life is fine).
      *   Phase 2 = **Rights/Distinctness** (Aggregation across lives is problematic).
      *   Phase 3 = **Reductionism** (What if distinctness is a matter of degree? Does moral protection fade?)

  #### **1:25 – 1:30 | The Reveal**
  *   **Now** you use the forbidden phrases.
  *   *"The objection you felt in Phase 2 is what John Rawls called the **Separateness of Persons**. He argued Utilitarianism treats society like one super-person (Phase 1), ignoring that we are distinct."*
  *   *"Phase 3 was a nod to **Derek Parfit**. He asked: if personal identity is just psychological connection, and connection comes in degrees, does moral status come in degrees?"*
  *   *"The Veto Card you held represents a **Constraint**, not a Goal. Most of you used it to protect individuals even when the 'total good' demanded sacrifice."*
  *   **Dismissal:** Distribute snacks based on final chip counts. Auditors get first pick.

  ---

  ### **Troubleshooting & Predictive Failures**

  **1. The "Nice Group" Problem:**
  *   *Risk:* In Phase 2, they refuse to sacrifice anyone. They say "We'll all just get standard snacks."
  *   *Fix:* The "Crisis Card." If they deadlock for more than 3 minutes, play this card: *"The System has spoiled. If 20 chips are not generated in 2 minutes, **everyone** loses 2 chips."* This forces the trade-off.
  *   *Philosophical Payoff:* This shows that scarcity forces distributional choices. You can't opt out of justice.

  **2. The "Dominant Voice" Problem:**
  *   *Risk:* One confident student dictates the vote.
  *   *Fix:* **Secret Ballots.** For Phase 2 and 3 decisions, have students close eyes and raise hands, or write votes on scrap paper. The Auditors count them. Do not allow open debate until *after* the vote is cast. This isolates individual intuition from groupthink.

  **3. The "Read-Ahead" Spoilers:**
  *   *Risk:* An Auditor says, "This is Rawls!" in minute 30.
  *   *Fix:* Pre-brief them. *"Your grade for this section depends on your silence. If you name the theory before the reveal, the Auditors fail the verification task."* (Bluff slightly if needed, or just appeal to their desire for the game to work).
  *   *Backup:* If they do speak, immediately pivot: *"Interesting. So you recognize this pattern. Does recognizing the name change how the Triad feels about the sacrifice?"* Neutralize it by focusing on the *feeling* rather than the *label*.

  **4. The "Veto" Abuse:**
  *   *Risk:* Everyone plays Veto.
  *   *Fix:* Remind them at the start: *"There are only enough snacks for me to absorb 3 Vetoes total. After that, the System collapses."* This makes the Veto a scarce resource, modeling that rights are robust but not infinite in a resource-constrained world (or simply limits the TA's chore burden).

  ### **What This Activity Cannot Do (Be Honest Here)**
  In the debrief, acknowledge these limits so you don't overclaim:
  1.  **It's not real harm:** They know the chores are trivial. The *moral weight* is simulated. You must state: *"In the real world, the 'chore' might be imprisonment or pain. The hesitation you felt here is a shadow of the resistance you should feel there."*
  2.  **It simplifies Identity:** Phase 3 is a gimmick. Real psychological connectedness isn't decided by a TA's rule. You must state: *"We forced the connection. In reality, figuring out how connected people are is the hard part."*
  3.  **It ignores Motivation:** Utilitarianism is also about *why* we act, not just the outcome. This game only tests outcomes (chip counts). You will need to add a sentence about motives in the verbal debrief.

  ### **Why This Works for Your Constraints**
  *   **No Tech:** Chips and paper are tactile. They ground the abstract "utility."
  *   **No Budget:** Snacks are cheap; chores are free.
  *   **Opt-Out:** The Veto card ensures no one is coerced, respecting the very principle you are teaching.
  *   **The "Blurred" Phase:** By making the Triad share a *single grievance token*, you mechanically force the question: "Is this one harm or three?" This is the exact metaphysical problem Parfit raises, embodied in a sticky note.
  *   **Read-Aheads:** Giving them the "Auditor" role turns their knowledge into a mechanical constraint rather than a conversational dominance.

  Run this tight, keep the energy up during the "Crisis" moments, and the silence during the Phase 2 grievance reading will do more teaching than 40 minutes of lecturing.
