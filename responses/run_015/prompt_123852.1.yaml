      *   No money? Yes (snacks/chores).
      *   Opt-out? Yes (Veto Card).
      *   Read-aheads? Yes (Auditors).
      *   Timeline? 90 mins.
      *   No jargon until end? Yes.
      *   Debrief included? Yes.

  12. **Writing the Response:** (Self-Correction during drafting: Ensure the tone is supportive but precise. Make sure the "Auditor" role doesn't give away the game. Ensure the "Veto" doesn't break the game economy.) *Correction:* If the TA takes the chore, it doesn't break the economy, it just shows the limit of the system. That's good.

      *   *Wait, one more check on Phase 3.* The prompt asks for "not-fully-separate-persons." The Triad idea works, but I need to make sure the *students* feel the ambiguity.
