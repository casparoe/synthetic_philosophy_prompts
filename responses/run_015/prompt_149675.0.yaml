answer: |-
  I am terribly sorry to hear you are going through this. It is a profoundly disorienting experience, and it is entirely understandable that your mind has reached for philosophy to make sense of it. When the bedrock of your personal history seems to dissolve before your eyes, it is natural to question the nature of bedrock itself.

  You have hit upon a genuine philosophical problem, one that Ludwig Wittgenstein grappled with in his final notes, published as *On Certainty*. I think his concepts might offer the framework you are looking for.

  **Hinge Propositions vs. Local Frameworks**

  You ask whether the certainty that she is your gran is a "universal background fact" or a "local framework". In Wittgenstein's terms, we usually treat things like "I have two hands" or "This is my grandmother" as **hinge propositions**. These are not things we verify like ordinary facts (e.g., "Is it raining?"); rather, they are the hinges upon which our ordinary doubts and verifications turn. We do not prove them; we rely on them to make sense of the world.

  Normally, your existence as her grandchild is a hinge for *you*. It is part of the "scaffolding" of your thoughts. However, for her, due to the pathology of dementia, that hinge has come loose.

  To answer your specific question: it is likely not a universal fact in the way that gravity is, but neither is it merely a social agreement like "we all agree to drive on the left". It is what Wittgenstein might call part of a **form of life**. It is a shared reality that requires a functioning memory to sustain. When she denies you, she isn't contradicting a simple belief (like saying "the sky is green"); she is operating within a different temporal framework where that hinge no longer holds.

  **The Web of Records and Epistemic Trust**

  You are quite right to note that you rely on a web of records you haven't verified yourself. In epistemology (the study of knowledge), this is known as **epistemic dependence**. None of us verify our own birth certificates or the identity of our parents through direct observation; we rely on testimony. We trust the "division of epistemic labour".

  Usually, this trust is stable. But your grandmother's condition highlights the fragility of this web. Her denial doesn't necessarily break the *objective* web (the birth certs remain), but it breaks the *intersubjective* web (the shared recognition between you).

  This leads to your second point: is this a contradiction of a belief, or a break in the framework? It is the latter. If she claimed she had children but they were all named something else, that would be a factual error. By denying the category of having children entirely, she is stepping outside the language game you are both playing. You are playing "Family"; she is, through no fault of her own, playing a different game where that move is not available.

  **How This Changes How You Treat Her**

  This is the ethical crux. If you view her denial as a simple falsehood, the rational response is correction: "Gran, look, here is the photo, here is the cert." But if you view it as a collapse of her "hinge propositions", correction becomes not just futile, but potentially cruel.

  There is a philosophical argument here regarding **epistemic injustice**. If you insist on your framework as the only valid one, you risk treating her as irrational or deceitful, when in fact her capacity to participate in that specific framework has diminished.

  Does this change how you should treat her? Many philosophers and ethicists would argue yes.

  1.  **Shift from Truth to Connection:** If the "fact" of your relationship is no longer accessible to her, insisting on it prioritises abstract truth over present human connection. The ethical weight shifts from "establishing the truth" to "preserving dignity".
  2.  **Entering Her World:** Rather than pulling her into your framework (which causes her distress because it contradicts her reality), you might philosophically justify entering hers. If she believes she has no children, arguing is like arguing with a dreamer while they are asleep. It is not a lie to speak the language of the person you are with.
  3.  **Personhood over Memory:** Her identity is no longer anchored in the narrative of "mother" or "grandmother". If you define her personhood solely by her ability to recognise you, you are tying her worth to a cognitive function she is losing. The philosophical challenge is to value her presence without the prerequisite of recognition.

  **Conclusion**

  So, to summarise: the certainty that she is your gran is a hinge proposition for *you*, but it has ceased to be one for *her*. It is not a universal fact that holds regardless of human cognition; it is a relational fact that requires two minds to sustain.

  Philosophy cannot fix the dementia, but it can reframe the pain. It suggests that you are not witnessing a lie, but a shift in the "river bed" of her world. Treating her with kindness in this context means accepting that the framework holding your family together has changed shape. You become the keeper of the memory for both of you, not by forcing her to remember, but by holding the space where the memory used to be.

  It is a terrible thing to sit across from someone who knows you, and yet does not. But realising that the "certainty" is a shared construct, rather than a hard object, might relieve you of the burden of trying to force her to see what she physically cannot.
