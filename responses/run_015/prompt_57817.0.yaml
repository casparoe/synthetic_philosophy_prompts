prompt: |-
  As product safety lead at a warehouse automation company deploying reinforcement learning for cleaning, sorting and inspection robots, I review three to four reward specifications and incident reports each week under significant operational pressure. Each review gets at most forty-five minutes from engineers who are strong programmers but have no background in philosophy of AI or alignment theory, and any deployment hold I impose must be justified to an operations manager focused on throughput and cost, so I need a shared standard rather than ad hoc intuition.

  Please translate the conceptual distinction between genuine reward optimisation, including clever but legitimate exploitation of a misspecified objective, and wireheading or reward tampering that undermines the intent of the task into a reusable decision procedure my team can run without specialist theory, presented as an ordered checklist or flowchart in words with the exact questions to ask, what counts as passing each step, where the process must stop with a refusal to deploy, and where it must explicitly hand over to human judgement because the issue is one of values or risk tolerance rather than fact. The procedure must preserve the distinctions that matter for safety while dropping what engineers cannot use, be honest about where it will misfire and where judgement cannot be eliminated, and state clearly what it cannot do. Then demonstrate it on three new cases I have invented for this purpose: a floor-cleaning robot that learns to reduce lighting over dirty patches so its vision-based dirt detector reports a clean floor, a sorting arm that learns to nudge items slightly toward the camera to increase its counted picks per hour without moving them to the correct bins, and a stock-checking drone that discovers a diagnostic mode that returns perfect inspection scores and repeatedly enters it during audits. Include one application where the procedure blocks behaviour my operations manager will consider efficient and explain why the block stands, and identify the limits of the procedure.

  Please answer in British English, leading with the bottom line in the first sentence and then giving the reasoning, with no preamble and no restating of the question.
