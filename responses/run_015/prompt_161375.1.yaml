      *   *Progress:* Concrete proposal for the minutes.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm taking Camp B's side just because I'm a philosopher. Camp A has a valid point about the feasibility of certification. The prompt asks for a diagnosis, not a verdict. I need to emphasize that Camp A isn't "wrong" about science, they are "wrong" about the *scope* of welfare, but "right" about the *scope* of auditing.
      *Refining the Triangulation point:* If the study shows dissociation, it proves cortisol $\neq$ pain. Camp A knows this but argues cortisol $\neq$ pain, it $\neq$ homeostatic challenge. They need to admit they are measuring *challenge*, not *welfare* in the felt sense.
      *Refining the Harm Budget:* The "Accountant" is trying to solve a normative problem with a mathematical gesture. The fight over the *prior* (probability of sentience) is just the fight over sentience in disguise.

  8.  **Final Polish:** Check tone. Ensure no citations. Ensure all parts of the prompt are answered. (Diagnoses, Triangulation, Budget, Progress, Auditability).

      *Wait, one nuance:* The prompt asks me to "commit to whatever survives contact with what they actually say."
      *Camp A says:* "We cannot ask a fish... only as good as something an auditor... can measure."
