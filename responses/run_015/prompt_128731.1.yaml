answer: |-
  Consider the twin city-states of Meridia and Imperia facing an identical resource shock: Meridia, a liberal democracy, spends two years in public deliberation designing a flawless algorithmic zoning protocol, but collapses into political gridlock and regime failure before full implementation; Imperia, an authoritarian technocracy, covertly steals Meridia's finalized code, bypasses all consent mechanisms, and instantiates the system via decree, achieving material prosperity and social order identical to what a stable democracy would produce, despite the policy's origin in a failed democratic process. The order in Imperia stems not from superior coercive coordination but from the stolen optimal logic of Meridia's design, leaving Imperia's citizens with indistinguishable GDP and safety metrics compared to democratic benchmarks, yet devoid of political voice.

  **The Performance Theorist** endorses Imperia, arguing that legitimacy is a function of delivered goods (prosperity/order) rather than input processes; since the outcomes are optimal, the regime is legitimate regardless of the policy's provenance. **The Procedural Democrat** rejects Imperia, contending that legitimacy derives solely from consent and accountability; stealing a policy designed through democratic deliberation while denying citizens any voice renders the outcome illegitimate, even if beneficial. **The Liberal with Guardrails** rejects Imperia, accepting performance only when coupled with rights protections; without democratic feedback loops to correct errors when the stolen code inevitably ages or fails, the regime is a ticking time bomb.

  **Analysis:** The feature doing the work is the **separation of design legitimacy from execution efficiency**. If you remove the copying element, the performance claim breaks: Imperia likely lacks the organic capacity to generate such optimal policies without democratic feedback, revealing its success was parasitic rather than inherent. The Performance Theorist will attack the case for **misattributing cause**, arguing that *implementation* is the true performance metric; Meridia failed performance (collapse), while Imperia succeeded (delivery), making the theft irrelevant because the value was created by the authoritarian capacity to execute what the democracy could not.
