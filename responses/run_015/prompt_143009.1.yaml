prompt: |-
  I'm trying to write a paper for my historiography course and I'm stuck on something that sounds basic but isn't. Everyone talks about "history from below" versus the big state-and-elite narrative like they're just two flavors you can mix and match. But I want to know what a real framework for integrating them would actualy have to do — not just "include both," but the actual desiderata. Like, if you're claiming that a micro-level event in some village actualy illuminates a macro-level transformation in governance or class structure, what conditions have to be met for that claim to be more than just a colorful anecdote?

  So write me the full spec. For each requirement, give the motivating case or distinction that makes it necessary — for instance, why you can't collapse "this person had local agency" into "this person caused a structural shift," and why representativeness isn't the same as typicality. Mark which ones are genuinely non-negotiable and which are camp-specific preferences (maybe from microhistorians vs. structuralists vs. the people who think archives are already biased). I especially want to know if there's a joint-unsatisfiability issue: given what we know about archival survival, scaling, and causal attribution, can all these desiderata actualy be satisfied together, or is the "integrated" history always going to be trading off something? And tell me which single requirement does the most damage to the standard integrative move, where someone just sticks a micro-story onto a macro-argument and calls it synthesis. Don't bother with a full scorecard — I'm mostly trying to see where the framework breaks, not rank every school.
