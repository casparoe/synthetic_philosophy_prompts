answer: |-
  Here is the specification for a rigorous integration of micro-level agency and macro-level structure, stripped of the usual diplomatic historiography.

  ### The Spec: Desiderata for Trans-Scalar Integration

  To move beyond "illustrative history" (pasting a village story onto a state narrative), an integrated framework must satisfy four specific requirements.

  #### 1. Trans-Scalar Causal Mechanism
  **Status:** Non-Negotiable (Epistemological Hygiene)
  **The Distinction:** *Correlation/Illustration* vs. *Mechanism*.
  **Motivating Case:** The standard integrative move asserts that a local event "reflects" a broader trend. This is logically insufficient. To claim a village dispute illuminates state formation, you must specify the transmission belt. Did the village dispute force the state to legislate? Did state legislation create the conditions for the dispute? Or did both emerge from a third, unobserved variable (e.g., climate shock)?
  Without a specified mechanism, the micro-narrative is merely an anecdote—a data point of *n=1* that cannot bear the weight of a structural claim. The requirement demands you map the specific pathways (administrative, economic, social) through which action at scale *A* translates to consequence at scale *B*.

  #### 2. Archival Genealogy (Provenance of the Voice)
  **Status:** Non-Negotiable (Source Criticism)
  **The Distinction:** *Transparency of Mediation* vs. *Naive Realism*.
  **Motivating Case:** "History from below" is almost exclusively accessed through archives created by the "above" (inquisitorial records, tax rolls, police reports). A framework that treats the peasant's voice in a court transcript as unmediated access to peasant consciousness fails.
  You must account for the *production* of the source. Why does this record exist? Who asked the question? What language was the answer translated into? If you claim a micro-event shows "resistance," you must prove that the resistance isn't just a performance scripted by the interrogator's expectations. This is not just "bias"; it is the structural condition of the evidence.

  #### 3. Typicality vs. Representativeness
  **Status:** Camp-Specific Preference (Micro vs. Structural)
  **The Distinction:** *Embodiment of Logic* vs. *Statistical Proportionality*.
  **Motivating Case:** This is where the schools diverge.
  *   **Structuralists/Quantifiers** demand **Representativeness**: The case must be statistically proportional to the population. If your village wasn't like 51% of other villages, your macro-claim is suspect.
  *   **Microhistorians (e.g., Ginzburg, Levi)** demand **Typicality** (often via the "Exceptional Normal"): The case need not be common; it must simply reveal the *rules* of the system. A rare heresy trial can reveal the typical boundaries of orthodoxy better than a thousand silent conformists.
  *   **The Integration Problem:** You cannot satisfy both simultaneously. A case is rarely both statistically average and richly detailed enough to show agency. An integrated framework must explicitly declare which currency it is spending. If you claim representativeness without the numbers, you are lying. If you claim typicality without the structural logic, you are storytelling.

  #### 4. Category Homology
  **Status:** Camp-Specific Preference (Post-structural vs. Materialist)
  **The Distinction:** *Uniform Definitions* vs. *Scale-Dependent Meaning*.
  **Motivating Case:** Does "power" mean the same thing in a village council as it does in the Privy Council?
  *   **Materialists/Structuralists** assume **Homology**: Class, power, and resistance operate on the same logic at all scales. A strike in a factory and a riot in a village are instances of the same category ("class struggle").
  *   **Post-structuralists/Microhistorians** argue for **Heterology**: Power at the micro-level is interpersonal and capillary; at the macro-level, it is bureaucratic and abstract. Collapsing them erases the specific texture of the "below."
  *   **The Integration Problem:** If you assume homology, you risk anachronism (imposing modern state concepts on village life). If you assume heterology, you risk incommensurability (the two levels can never actually talk to each other).

  ---

  ### The Joint-Unsatisfiability Problem

  Can these desiderata be satisfied together? **No.** There is a trilemma involving **Depth**, **Breadth**, and **Source Integrity**.

  1.  **Archival Survival is Non-Random:** The archives that allow for **Trans-Scalar Causal Mechanism** (Requirement 1) and **Archival Genealogy** (Requirement 2) are usually dense, localized, and judicial (e.g., Inquisition records). These provide depth but lack **Representativeness** (Requirement 3).
  2.  **Scaling Requires Abstraction:** To achieve **Representativeness**, you must aggregate data. This strips away the **Archival Genealogy** (you lose the specific voice/mediation) and obscures the **Causal Mechanism** (you see correlation, not process).
  3.  **The "Below" is Structurally Silent:** True "history from below" often leaves no written record. The moment it enters the archive (satisfying Requirement 2), it has been mediated by the "above."

  **The Trade-off:** You can have a rigorous causal mechanism for a specific case (Micro), or a representative model of a population (Macro), but you cannot have a *representative* sample of *deeply mediated micro-agency*. The archive does not preserve the typical peasant's internal logic; it preserves the exceptional peasant's interaction with the law. Therefore, an "integrated" history is always trading off **generalizability** for **causal specificity**, or vice versa.

  ---

  ### The Single Requirement That Breaks the Standard Move

  The requirement that does the most damage to the standard "stick a micro-story onto a macro-argument" synthesis is **Requirement 1: Trans-Scalar Causal Mechanism.**

  **Why:**
  The standard integrative move relies on **homological assumption**. It assumes that because a macro-structure exists (e.g., "The Rise of the State"), the micro-event is simply a localized instance of that structure. It treats the micro-narrative as *illustration*.

  Demanding a **Trans-Scalar Causal Mechanism** forces the historian to admit that the micro and macro often operate on *different* logics that do not automatically align.
  *   It exposes that the "State" did not cause the village event; the village event might have been indifferent to the State.
  *   It reveals that the "agency" of the peasant might not actually contribute to the "structural shift" but might instead be a survival strategy that *reinforces* the status quo.

  Most syntheses collapse when pressed on *how* the village actually changes the state. They usually retreat to vague metaphors ("ripples in the pond," "pressure from below"). If you enforce the requirement that the mechanism must be empirically traceable through the archive (and not just theorized), 80% of "integrated" histories dissolve into two separate books: one about the village, one about the state, with no actual bridge between them.

  **The Break:** It forces you to admit that often, the "view from below" does not illuminate the "view from above"—it contradicts it, ignores it, or reveals that the macro-structure is a fiction projected by elites that didn't actually function on the ground. That is a historiographical crisis, not a synthesis.
