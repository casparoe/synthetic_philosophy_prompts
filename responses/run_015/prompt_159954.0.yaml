      *   **Pinpoint the Rejection:** Reject Step (6). The symmetry is false.
      *   **Explain Why:** Distinguish between *defeasibility conditions* (Auditor has them, Sealed Theorist denies them) and *truth conditions* (which neither controls).
      *   **Address the Cost:** Rejecting (6) means accepting that "official stories" can be warranted even if underdetermined, provided they follow standard inferential norms (abduction to the best explanation), whereas sealed theories violate those norms.
      *   **Address Step (8) (The Real Conspiracies):** This is the trickiest part. The cost is admitting that before the leak, believing in Watergate *was* epistemically risky/unwarranted for the general public, though perhaps warranted for insiders with specific access. Distinguish between *general conspiracy theorizing* and *specific investigation*.
      *   **Refine the "Sealed" Definition:** It's not just that they absorb evidence; it's that they *invert* the normative weight of evidence (absence of evidence = evidence of absence for Auditor; absence of evidence = evidence of presence for Sealed Theorist).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Terminology:* Use "Defeasibility" vs. "Immunization."
      *   *The Student's Trick:* Equivocation on "Sensitivity." Auditor is sensitive to *available* evidence. Sealed theorist is insensitive to *any* evidence.
      *   *The "Cost":* You have to admit that sometimes the "conspiracy theorist" was right, but still unwarranted *at the time*. This is a bullet worth biting. It preserves the normative force of epistemology.
      *   *Alternative:* Modify the definition of "Conspiracy Theory" in the literature. Most literature targets *grand, all-encompassing* theories, not specific allegations of wrongdoing.
      *   *Key Philosophical Move:* The distinction between **local** and **global** skepticism. The Auditor is a local skeptic (requires proof for C). The Sealed Theorist is a global skeptic about the institution (assumes institution is corrupt).

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for a colleague (respectful, rigorous, engaging).
      *   Make sure to explicitly answer "Which step do you reject?" and "What does it cost?"
      *   Address the "smuggling" question directly.

      *(Self-Correction during drafting)*: I need to be careful not to just say "The student is wrong about sensitivity." The student's point about "if the conspiracy is real, there are no memos" is actually a version of the **Skeptical Hypothesis** (Brain in a Vat). If I believe I'm not a BIV because I have hands, the skeptic says "If you were a BIV, you'd *think* you had hands." The standard response is Contextualism or Inference to the Best Explanation (IBE). I should lean on IBE. The Official Story is usually the *best* explanation, even if not the *only* possible one. The Sealed Theory makes itself the *only* explanation by fiat.

