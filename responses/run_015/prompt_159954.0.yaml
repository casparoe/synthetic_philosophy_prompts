      *   However, we need to avoid saying *all* CT belief is unwarranted. We need a criterion that allows for *warranted suspicion* without falling into *sealed dogmatism*.
      *   *Solution:* Focus on **specificity** and **cost**. A warranted suspicion points to specific mechanisms that *could* be found. A sealed theory explains why they *won't* be found.

