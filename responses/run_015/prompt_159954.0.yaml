      *   (4) Description of *Auditor* (believer in official story). Relies on lack of evidence for conspiracy.
      *   (5) Definition of *sated*: Evidence doesn't discriminate between $C$ and $\neg C$ because a successful $C$ looks like $\neg C$.
      *   (6) *Sealed* and *Sated* are mirror images; both detach confidence from truth.
      *   (7) Generalization: Either $C$ is sealed or $\neg C$ is sated. Neither is warranted.
      *   (8) Reductio: We *know* some conspiracies are real (Watergate). We *know* some official stories were warranted beforehand.
      *   (9) Conclusion: The research program is political, not epistemic.

  3.  **Evaluate the Professor's Intuition vs. The Student's Counter:**
      *   *Professor:* "Sealed" is modal (no possible evidence), "Sated" is contingent (current evidence). Auditor can change mind if a memo appears.
      *   *Student:* If the conspiracy is real, the memo *won't* appear. So the conditional willingness to change mind is vacuous.
      *   *Analysis:* The student is conflating *actual* impossibility with *epistemic* accessibility. The Auditor's position is warranted if it tracks the *availability* of evidence, not if it guarantees access to hidden truth. The key distinction is between **immunization strategies** (active reinterpretation) vs. **absence of evidence** (passive lack of access).

  4.  **Identify the Flaw (The "Seam"):**
      *   The flaw is in Step (6) and the move to (7). It equates *structural immunization* with *evidential underdetermination*.
      *   **Sealed:** Active work is done to make $E$ support $T$ regardless of $E$'s content. (e.g., "The lack of evidence *is* evidence of the cover-up"). This violates norms of inference.
      *   **Sated:** The evidence $E$ (lack of leaks) supports $\neg C$ *ceteris paribus*, but the theorist notes that $C$ predicts $E$ too. This is the problem of **underdetermination**, not immunization.
      *   **Crucial Distinction:** The Auditor is sensitive to *new* evidence. The Sealed Theorist is *not*. The Student's counter ("if the conspiracy is real... there are no memos") confuses the *truth condition* with the *warrant condition*. Warrant is about the relationship between the agent and the evidence, not the agent and the hidden truth.

  5.  **Address the "Real Conspiracies" Worry (Step 8):**
