      *   *The "Non-Circular/No Normative Ground Truth" Constraint:* This is the hardest part. To say a judgment is a "bias" usually implies it's a deviation from rationality or correctness. If we can't appeal to normative truth, how do we know the invariant part is the "preference" and not just a "rigid heuristic"? Or conversely, how do we know the variable part is "bias" and not "sensitive contextual reasoning"?
      *   *Accuracy >85%:* This is a very high bar for social science, especially for a binary classification of complex cognitive states.
      *   *Timeline:* 50 years is generous, but the conceptual hurdles might be insurmountable regardless of time.

