  **Credence Decomposition**

  1.  **Probability of stable, context-independent preference structure:** 0.55 – Empirical data on framing effects is mixed, suggesting some stability exists but is often overwhelmed by situational construction.
  2.  **Probability of methodological isolation without objective calibration:** 0.65 – Advanced multivariate modeling can likely detect statistical invariance patterns even without an external moral calibration standard.
  3.  **Probability the distinction avoids collapsing into normative stipulation:** 0.35 – Defining preference as invariance implicitly privileges formal coherence, which is itself a normative stance potentially at odds with ecological rationality.
  4.  **Probability of sufficient cognitive/technical resolution (Additional Factor):** 0.80 – Trajectories in neuroimaging and computational power suggest we will soon resolve the cognitive granularity required to detect framing nuances.

  **Combined Credence:** 0.10 (Calculated as the product of the four terms above).

  **Most Uncertain and Decisive Term**
  The third term (non-normative collapse) is the primary bottleneck; it would shift by twenty points upon a definitive demonstration that moral rationality is either constitutively context-sensitive (lowering credence) or that moral facts are mind-independent invariants discoverable via coherence (raising credence).

  **Value of the Distinction**
  Yes, the distinction remains pragmatically valuable for identifying inconsistent reasoning, even if "bias" ultimately reflects a normative commitment to coherence rather than an empirical deviation from truth.
