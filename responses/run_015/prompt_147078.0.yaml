answer: |-
  For decades she studied how naming a condition changes the person living with it. Yet she insisted this change was never a one-way street.

  When we receive a label, it shapes our choices and our sense of who we are. But she taught us that the act of diagnosing changes the doctor just as deeply.

  Every name given to an illness reflects back on the clinician's own moral compass. They are not distant observers, but participants altered by the very tools they use.

  This means a diagnosis is neither a cold biological fact nor a mere invented story. They are living agreements that shift both sides of the consulting room door.

  So we gather today to honour a thinker who showed us that the clinician is changed by the care they give. Her legacy is this double loop, curling back to make us all more human.
