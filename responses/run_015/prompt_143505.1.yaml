answer: |-
  **Project Title:** Partition Dependence and the Ill-Posed Maximand in Consequentialism

  **Statement of the Question**
  The project addresses a specific structural vulnerability in act-consequentialism arising from cluelessness about long-run consequences. The question is whether the expected value of an act is well-defined under conditions of ordinary causal sprawl, where effects ramify indefinitely into an open-ended future. Standard models assume that expected value is calculated by summing probability-weighted outcomes across a partition of possible consequences. If this sum is only conditionally convergent, its value depends on the order of summation and the specific partition chosen. By re-carving the space of outcomes, one can alter the expected value ranking of acts without changing the underlying causal facts or probabilities. The project asks: Does ordinary causal ramification generate conditional convergence such that the consequentialist maximand is ill-posed, and if so, does retreating to rule-based evaluation mitigate or exacerbate this instability?

  **Existing Responses and Gaps**
  The literature currently conflates three distinct complaints about long-run cluelessness. The first is sign-cluelessness: uncertainty regarding the direction of near-term effects. The standard reply is subjective consequentialism: agents should maximize expected value relative to their credences rather than objective outcomes. This resolves the epistemic access problem but assumes the expectation itself is determinate.

  The second is tail-cluelessness: the spread of long-run effects is so vast that it swamps near-term calculations. The usual response is that unknown effects are symmetric and wash out in expectation. This comfort relies on the assumption that the relevant expectations are well-defined. However, if the probability of an effect of a given size shrinks only as a power of that size, the mean may not exist. Even if symmetry holds, symmetry in the spread of effects is not identical to a determinate expected difference.

  The third complaint, which this project isolates, is partition dependence. Even if probabilities and values are finite and no infinite populations are involved, a conditionally convergent sum yields different totals depending on how the outcome space is carved up. Existing responses do not face this. The retreat to imprecise credences with a decision rule avoids committing to a single number but does not resolve the structural ill-posedness if the ranking itself flips based on partitioning. Furthermore, the familiar two-level retreat—evaluating rules or policies rather than individual acts—should theoretically worsen the problem. Assessing a rule requires aggregating over every occasion of its application, including arbitrarily distant futures. This sums over a strictly larger and more heterogeneous space than single acts, increasing the risk of convergence failure. The project proceeds on the premise that this line can be held distinct from the fanaticism debate, which relies on infinite utilities or contrived gambles, whereas this problem arises from ordinary causal finitude.

  **Method and Work Plan**
  The project will be executed over three months of full-time work.

  *Month 1:* I will formalize the partition problem using finite causal chains. The goal is to construct a model where causal ramification leads to conditional convergence without invoking infinite domains, St. Petersburg-style gambles, or infinite populations. This distinguishes the project from formal work on aggregation over infinite domains, which often obscures the issue by focusing on transfinite mathematics rather than ordinary causation. Empirical forecasting is rejected as a method because the problem is structural, not evidential; no amount of data resolves conditional convergence.

  *Month 2:* I will test the two-level retreat hypothesis. I will model rule-evaluation as an aggregation over multiple instances of action and demonstrate whether the larger outcome space increases susceptibility to partition dependence compared to act-evaluation. This avoids abandoning consequentialism for a framework where the question does not arise; the aim is to repair or precisely locate the breakage within the consequentialist framework.

  *Month 3:* I will draft the 9,000-word paper and the short note to the funder. The paper will present the formal model, the critique of existing replies, and the analysis of the two-level retreat.

  **Possible Results**
  There are three primary possible conclusions. First, the problem stands: expected value is ill-posed under ordinary causal sprawl, and rule-consequentialism exacerbates this. Second, a bounded or saturating value function dissolves the problem by forcing absolute convergence, ensuring sums are invariant to partitioning. Third, the causal structure itself supplies a privileged partition that fixes the order of summation, rendering the expectation unique.

  Deciding between these depends on two considerations. For the bounded value solution, the decision rests on whether moral value is plausibly bounded independent of the convergence problem. For the privileged partition solution, the decision rests on whether causal topology provides a unique, non-arbitrary way to individuate outcomes. If neither condition holds, the first conclusion follows.

  **Failure Conditions and Scope**
  An honest account of failure requires three distinct conditions. First, the project fails if the problem collapses into the existing fanaticism literature. If the partition dependence only arises when assuming infinite utilities or probabilities that do not sum to one, the project merely replicates known objections regarding infinite ethics rather than identifying a new problem about cluelessness. Second, the project fails if the result is technically sound but action-guidingly inert. If the partition dependence exists only in contrived mathematical cases that never arise in practical deliberation, the project makes no difference to what anyone should do. Third, the project fails if I cannot distinguish the third complaint (partition dependence) from the second (tail-cluelessness). If the symmetry argument already covers the convergence issue, the proposed distinction is illusory.

  Regarding scope, if the third complaint cannot be fully established within the timeframe, I will cut the formal modeling of causal sprawl and focus exclusively on the two-level retreat. Demonstrating that rule-consequentialism worsens convergence issues remains a significant negative result even if the general partition problem remains partially conjectural.

  **Relevance and Deliverables**
  A funder should support this theoretical work rather than an applied project because applied decision-making under deep uncertainty currently lacks a robustness test for its ranking metrics. Practitioners choosing between interventions often rely on expected value estimates that assume stable sums. If those sums are partition-sensitive, the rankings are arbitrary. The deliverable for people choosing between interventions is not a new intervention, but a diagnostic tool: a test of whether a consequentialist ranking is robust to re-carving the space of outcomes. The usable product will be a set of criteria for identifying when an expected value calculation is ill-posed. This allows practitioners to flag decisions where the ranking is an artifact of modeling choices rather than moral reality, preventing overconfidence in unstable evaluations. This protects resources from being allocated based on mathematical artifacts rather than robust moral reasons.
