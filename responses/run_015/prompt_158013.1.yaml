  *(Self-Correction on Variant One):* In the Swap Case, if they pass through, is it distinct from rebounding? Qualitatively, no. Haecceitistically, yes. The Symmetry view must say these are the *same* history described differently. This is a strong point for the Symmetry view (ontological parsimony) but a weak point for those who feel "tracks" matter. I will argue the Symmetry view is more defensible because it avoids brute facts.

