  5.  **Addressing the Metaphysics (4Dism vs. Endurantism):**
      *   *Endurantism:* Person is wholly present at each time. Identity is strict.
      *   *Perdurantism (4Dism):* Person is a spacetime worm.
      *   *Relevance to NIP:* Usually, NIP assumes strict identity (origin essentialism). If I conceive later, it's a *different* child. Does 4Dism help? Not really, because the *origin* of the worm is different. However, some argue 4Dism allows for "branching" or different criteria. I need to list a desideratum that demands the theory clarify this dependence.

