      *   **Evaluation:** Briefly score three views (Person-Affecting Restriction, Wide Impersonal Consequentialism, Actualist Harm) against the list.
      *   **Focus:** Weight on criteria and tensions, not the scoring. The user wants to know if the problem is in the solutions or the list itself.

  2.  **Deconstruct the Non-Identity Problem (NIP):**
      *   *Core:* Actions that affect *who* exists (identity-affecting) seem intuitively wrong if they create people with low welfare, but standard harm principles say you haven't harmed them (because without the action, they wouldn't exist).
