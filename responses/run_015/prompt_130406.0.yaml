      *   *Requirement 8: Action-Guidingness.* Must tell agents what to do in the present.

  4.  **Identifying Tensions (Impossibility Theorems):**
      *   *Parfit's Trilemma:* (1) Person-Affecting Principle, (2) Non-Identity Intuition (Risky policy is wrong), (3) No Metaphysical Magic.
