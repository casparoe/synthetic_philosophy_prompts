answer: |-
  Dear Colleague

  I am writing to offer some philosophical clarification regarding the seminar you are preparing on the demarcation of history and pseudohistory, specifically concerning the ubiquitous appeal to the maxim that absence of evidence is not evidence of absence. This slogan functions as a protean shield in debates ranging from the existence of Atlantis to the New Chronology of Anatoly Fomenko, and it is crucial for your participants to understand that the phrase is not a single argument but rather a conflation of distinct logical and epistemological theses. To dissect this properly, one must first separate the ontological claim from the epistemic claim, for the slogan often slides illegitimately between asserting something about the nature of reality and asserting something about the state of our knowledge. The first distinct thesis one encounters is the ontological reading, which posits that the past existence of an event is independent of its current documentation. Under this reading, the slogan asserts merely that a historical event could have occurred without leaving a trace that survives to the present day. This is a trivial platitude in the strictest logical sense, as the non-existence of a record does not logically entail the non-existence of the event itself. However, while this reading is indisputably true, it offers no positive support for the pseudohistorical move, because pseudohistory requires not just the possibility of an event, but the assertion of its actuality. This ontological defence applies with equal force to myth-based claims like Atlantis and to mathematically-framed revisionism like Fomenko's, as both rely on the logical possibility that the past differed from the consensus view regardless of current records, yet neither gains affirmative justification from this possibility alone.

  Moving from ontology to epistemology, we must distinguish between versions of the slogan that treat historical records as an open population versus those that treat them as a complete sample. The second thesis treats the archival record as an inherently fragmentary open population, implying that our current sample of evidence is too small to draw negative inferences. Here, the slogan claims that because we have not excavated every site or deciphered every text, the lack of evidence is merely a reflection of our incomplete search rather than the falsity of the hypothesis. This is not a trivial platitude but an empirical claim about the completeness of our archives, and it genuinely supports the pseudohistorical move only if the burden of proof is indefinitely deferred. In the case of Atlantis, this reading is often invoked to suggest that the civilization lies beneath the sea or in unexcavated strata, treating the physical world as an open population where evidence might yet surface. However, this support is weak because it ignores the Bayesian principle that absence of evidence is evidence of absence to the degree that evidence was expected. If a civilization was large enough to be remembered in myth, one would expect substantial archaeological traces; the continued absence of such traces in an extensively searched environment lowers the probability of the claim, rendering the open population defence increasingly untenable as search efforts expand.

  The third thesis concerns the specific application of this logic to Fomenko's statistical revisionism, where the treatment of records shifts from physical artifacts to textual consistency. Fomenko's argument relies on treating missing medieval records not as falsification of his timeline but as archival gaps within an open population of lost documents. Here, the slogan is used to argue that the absence of contemporary corroboration for his compressed chronology is due to the loss of records rather than the error of his theory. Unlike the Atlantis case, which relies on physical discovery, this version relies on the statistical probability of document survival. This reading is not a trivial platitude but a contested methodological stance regarding the density of historical records. It supports the pseudohistorical move only if one accepts the premise that the volume of missing records is sufficient to hide a global chronological shift, a premise most historians reject by treating the existing corpus as a sufficiently complete sample to establish relative chronology. Consequently, the slogan does not apply with equal force here as it does to Atlantis, because the expectation of evidence in textual history is based on cross-referencing existing documents rather than finding new physical objects. Where the Atlantis theorist hopes for a new discovery, the Fomenko revisionist hopes to reinterpret the silence of existing texts as noise rather than signal.

  Finally, you must address the probabilistic nuance that is often obscured by the slogan's absolute phrasing. In rigorous historical methodology, absence of evidence is treated as evidence of absence when the evidence should presumably be present if the claim were true. This counter-thesis undermines the pseudohistorical utility of the slogan by introducing the criterion of expectation. For the Atlantis claim, the expectation is based on the material footprint of complex societies; for the Fomenko claim, the expectation is based on the statistical distribution of textual references. In both cases, the slogan fails to support the pseudohistorical move if the expectation of evidence is high. It is only when the expectation is low that the slogan retains any validity, but pseudohistorians typically make grand claims that necessitate high evidential expectations. Therefore, in your seminar, you should guide your students to recognise that the slogan is often employed as a motte-and-bailey tactic, retreating to the trivial ontological platitude when challenged while occupying the stronger epistemic position that their theories remain viable despite missing evidence. By forcing a distinction between the logical possibility of the past and the justificatory requirements of the present, you will demonstrate that while absence of evidence may not be proof of absence, it is frequently sufficient grounds for rational disbelief, particularly when the missing evidence is of a type that should abound were the claim true. I trust this delineation will prove useful for your preparations and look forward to hearing how the discussion unfolds.

  Yours sincerely

  A Colleague
