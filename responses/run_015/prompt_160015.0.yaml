answer: |-
  ### Spec Requirements for Outcome Comparator

  **1. Time-Step Invariance (Chunking)**
  *   **Test:** `assert score(outcome_1hr) == score(outcome_60min_slices)`
  *   **Status:** **Non-Negotiable.**
  *   **Case:** Splitting a continuous experience into smaller database records must not alter the aggregate score. If your theory relies on "episodes," the episode boundary definition must be input-data, not implicit in the scoring function.

  **2. Zero-Point Definition**
  *   **Test:** `assert score(null_experience) == 0.0` AND `assert score(nonexistence) == 0.0` (or explicitly `NaN`).
  *   **Status:** **Non-Negotiable.**
  *   **Case:** The system must anchor "neutral" and "nonexistent" states. If nonexistence is `NaN`, you cannot compare existence vs. non-existence. If it is `0`, you assert neutrality. Silence here breaks comparison logic.

  **3. Uncertainty Resolution**
  *   **Test:** `assert rank(dist_A, dist_B)` returns stable ordering despite overlapping error bars, without returning `Infinity` on low-probability tails.
  *   **Status:** **Non-Negotiable.**
  *   **Case:** Inputs are distributions, not scalars. The aggregation rule must integrate over probability density. If a 0.0001% chance of "infinite pain" forces a verdict, the system is unusable (Pascal's Mugging).

  **4. Mixed Valence Combination**
  *   **Test:** `assert score(pleasure=5, pain=5)` returns a scalar, not a tuple.
  *   **Status:** **Non-Negotiable.**
  *   **Case:** Inputs may contain simultaneous positive/negative signals (e.g., "flow state" with fatigue). The theory must define the arithmetic (netting, weighting, or veto) to produce a single sortable verdict.

  **5. Inter-Subject Normalization**
  *   **Test:** `assert score(human_pain_level_5) ~= score(alien_pain_level_5)` requires explicit scaling factor `k`.
  *   **Status:** **Negotiable (Taste).**
  *   **Case:** **Taste Alert:** Demanding an *absolute* scale across minds is physicalist taste; demanding *relative* scaling is subjectivist taste. You must pick one. If you pick absolute, you need a biological calibration constant. If relative, you cannot compare populations with different sensory ranges.

  **6. Continuity (No Cliffs)**
  *   **Test:** `assert abs(score(input) - score(input + epsilon)) < delta`
  *   **Status:** **Negotiable (Taste).**
  *   **Case:** **Taste Alert:** Lexical theories (pain trumps all pleasure) fail this. A 0.01% increase in pain intensity cannot flip the verdict from "Best" to "Worst" if you want a stable optimizer. If you allow cliffs, your optimizer becomes unstable near thresholds.

  **7. Monotonicity**
  *   **Test:** `assert score(outcome + pleasure) >= score(outcome)`
  *   **Status:** **Non-Negotiable.**
  *   **Case:** Adding value without removing value must not decrease the score. Violating this makes the system adversarial to improvement.

  **8. Non-Hedonic Mapping**
  *   **Test:** `assert score(boredom)` maps to valence or throws `InputError`.
  *   **Status:** **Negotiable.**
  *   **Case:** **Taste Alert:** Hedonists say boredom is only bad because it feels bad. Objective List theorists say boredom is bad inherently. Your input schema must either normalize these to valence (scope creep) or reject them (scope limit).

  **9. Aggregation Shape (Pain vs. Count)**
  *   **Test:** `assert score(1 * severe_pain) vs score(1000 * mild_pain)` is defined.
  *   **Status:** **Negotiable (Taste).**
  *   **Case:** **Taste Alert:** Linear aggregation (Sum) says 1000 headaches = 1 migraine. Concave/Convex functions disagree. This is the core ethical parameter of your module. There is no mathematical truth here, only policy.

  **10. Dynamic Consistency**
  *   **Test:** `assert score(life_plan) == sum(score(momentary_choices))`
  *   **Status:** **Non-Negotiable.**
  *   **Case:** If the score of a whole life differs from the sum of its parts, path-finding algorithms (planning) will diverge from evaluation algorithms (ranking). You cannot ship both.

  ---

  ### Impossibility Collisions

  1.  **Chunking + Thresholds + Continuity:** You cannot have a pain threshold (e.g., "pain > 5 is catastrophic") *and* time-step invariance *and* continuity. If the threshold is per-unit-time, splitting time avoids the threshold. If the threshold is total-aggregate, it's just a sum. **What gives:** Thresholds must be abandoned for continuous functions, or you must hard-code a specific time-unit (arbitrary).
  2.  **Uncertainty + Lexical Priority:** If "Severe Pain" lexically dominates "All Pleasure," then any non-zero probability of Severe Pain dominates any certainty of Pleasure. **What gives:** You must cap the weight of low-probability events (risk aversion) or abandon lexical priority.
  3.  **Dynamic Consistency + Non-Linear Aggregation:** If 1 million headaches do *not* equal 1 migraine (non-linear), then the score of a life (whole) will not equal the sum of its moments (parts). **What gives:** You must choose between accurate moment-scoring or accurate life-scoring; you cannot have a recursive planner that matches the global evaluator.

  ---

  ### The Killer Requirement

  **Requirement 6: Continuity (No Cliffs).**
  This knocks out **Lexical Prioritarianism** and **Lexical Negative Utilitarianism**. These theories assert that *any* amount of a higher-order bad (e.g., torture) outweighs *any* amount of a lower-order good (e.g., pleasure). Mathematically, this creates a discontinuity. In a system with measurement error (your error bars), a discontinuity means the verdict flips randomly when the input hovers near the cliff edge. To ship a stable comparator, you must accept trade-offs.

  ---

  ### Scorecard

  1. **Sum-Hedonism:** Passes Chunking/Continuity/Dynamic; Fails Pain Aggregation (treats 1M headaches as 1 migraine).
  2. **Lexical Neg-Util:** Fails Continuity/Uncertainty (Pascal's Mugging); Passes Pain Priority.
  3. **Two-Axis View:** Fails Single Verdict (requires tie-break rule); Passes Mixed Valence.
  4. **Weighted Negative:** Passes Continuity/Uncertainty; Fails Symmetry (pain weight > pleasure).
  5. **System Limit:** You cannot implement Thresholds + Chunking + Continuity without arbitrary time-unit coupling.
