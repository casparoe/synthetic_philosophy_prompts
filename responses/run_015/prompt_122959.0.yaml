answer: |-
  This is a sophisticated package. It aligns closely with the "Fairness Account" of standing (associated with Kyle Fritz and Daniel Miller) rather than the "Relationship Account" (associated with Macnamara or Bell). You have clearly done the reading.

  Your suspicion about (a) and (b) is correct: that is not a collision. However, you have a potentially fatal tension between your binary view of standing and your defense of public criticism.

  Here is the breakdown of collisions, ranked by severity, followed by the literature map you requested.

  ### 1. The Tensions (Ranked by Severity)

  #### **Rank 1: The "Purity Problem" — (d) vs. (h)**
  *   **The Collision:** Claim (d) says standing is binary and non-scalar (a small unowned wrong kills standing completely). Claim (h) says ordinary public criticism of powerful wrongdoers is appropriate.
  *   **Why it breaks:** In the real world, "ordinary people" almost universally violate norms "relevantly similar" to those of the powerful (lying, cutting corners, selfishness), usually without formally "owning up" to them in a way that satisfies (c). If (d) holds, the "ordinary people" in (h) almost universally lack standing. You end up defending public criticism in principle while silencing the public in practice.
  *   **What has to give:** You must soften (d).
  *   **The Cost:** You lose the crispness of the binary view. You have to admit that standing comes in degrees or is sensitive to proportionality (i.e., my minor speeding doesn't forfeit my standing to blame your fraud).
  *   **Severity:** **Fatal.** This undermines the practical payoff of your entire theory.

  #### **Rank 2: The "Commitment" Challenge — (g) vs. Contemporary Literature**
  *   **The Collision:** This isn't an internal contradiction, but a clash with a dominant rival view. Claim (g) asserts that "Clean Hands" are sufficient for standing, even if the blamer is opportunistic (blames only when cheap).
  *   **Why it breaks:** Many philosophers (including Fritz, ironically, in later work, and others like Shoemaker) argue for a **Commitment Condition**. They argue that if you only blame when it's costless, you demonstrate you don't actually care about the moral norm, only about wielding power. On this view, the person in (g) *lacks* standing despite having clean hands.
  *   **What has to give:** You need to explicitly argue against the Commitment Condition in your teaching. You cannot present (g) as obvious; it is a contested thesis.
  *   **The Cost:** Dialectical burden. You have to explain *why* clean hands are enough without moral commitment. (Your likely argument: Blaming is a right, not a duty; I don't lose rights just because I exercise them selectively).
  *   **Severity:** **High.** If you teach this as settled, students familiar with the literature will catch you.

  #### **Rank 3: The "Relationship" Objection — (f) vs. (b)**
  *   **The Collision:** Claim (f) extends standing forfeiture to uninvolved third parties. Claim (b) says the blame is "out of order."
  *   **Why it breaks:** The "Relationship Account" (R. Jay Wallace, Angela Smith, Coleen Macnamara) argues that standing is rooted in the authority granted by a relationship. If there is no relationship, there is no standing to lose in the first place. By claiming a stranger lacks standing due to hypocrisy (f), you are assuming standing is universal by default.
  *   **What has to give:** You must defend Universalism against Particularism.
  *   **The Cost:** You have to field the objection that strangers shouldn't be blaming *at all*, rather than arguing about whether they have *standing* to blame.
  *   **Severity:** **Medium.** This is a standard theoretical dispute, not a package-breaker, but it defines your camp.

  #### **Rank 4: The Illusion — (a) vs. (b)**
  *   **The Collision:** You suspected this was fine. You are right.
  *   **Why it works:** This is the standard distinction between **Blameworthiness** (a property of the target) and **Propriety of Blaming** (a property of the act/blamer).
  *   **Verdict:** **No Tension.** This is the orthodoxy. Keep this exactly as is; it is the strongest foundation of your package.

  ---

  ### 2. The Single Revision That Cleans Up the Most

  **Revise (d).**

  Change (d) from:
  > *standing isn't scalar — you either have it or you don't, and it doesn't get discounted just because the blamer's own version was much smaller than the target's*

  To:
  > *standing is sensitive to proportionality — a blamer forfeits standing only if their unowned wrong is relevantly similar **and not trivially disproportionate** to the target's wrong.*

  **Why this fixes it:**
  1.  **Saves (h):** It allows ordinary people (who speed, lie on resumes, etc.) to retain standing to criticize powerful wrongdoers (who commit fraud, abuse power, etc.), because the wrongs are disproportionately different.
  2.  **Preserves (b) & (c):** It keeps the core insight that hypocrisy matters. You still lose standing if you do the *same* bad thing and don't own it.
  3.  **Reduces Dialectical Cost:** It moves you away from the counter-intuitive claim that a candy thief cannot blame a murderer, which is a common objection used to dismantle binary standing accounts in class.

  ---

  ### 3. Settled Orthodoxy vs. Live Disputes

  Do not smooth these over. If you teach the disputed points as settled, you will lose credibility with advanced students.

  #### **Settled (Orthodoxy)**
  *   **The Desert/Standing Distinction (a & b):** It is now standard consensus that blameworthiness is distinct from the propriety of expressing blame. You can be blameworthy even if no one has standing to blame you.
  *   **Hypocrisy Defeats Standing (b & c):** It is widely accepted that hypocrisy is a primary (perhaps *the* primary) defeater of standing.
  *   **Recoverability (e):** It is generally accepted that standing is not permanently lost; acknowledgment and change can restore it.

  #### **Live Disputes (Contested)**
  *   **Binary vs. Scalar Standing (d):** This is **highly contested**. The binary view is the minority position. Most contemporary work treats standing as context-sensitive or scalar. If you teach (d) as written, you are taking a hardline stance that requires defense.
  *   **Universal vs. Relationship-Dependent (f):** This is the **major fault line** in the field.
      *   *Universalists (Your view):* Anyone can blame anyone, provided they have standing (clean hands).
      *   *Particularists (Bell, Macnamara):* Standing is a function of relationship authority. A stranger literally lacks the normative power to blame, regardless of their own hypocrisy.
  *   **Clean Hands vs. Commitment (g):** This is a **growing dispute**.
      *   *Clean Hands:* If you haven't violated the norm, you have standing (Your view).
      *   *Commitment:* You must demonstrate adherence to the norm (blaming even when costly) to have standing. If you are opportunistic, you lack standing even with clean hands.
  *   **The "Ownership" Condition (c):** There is dispute over what counts as "owning up." Does it require public apology? Private acknowledgment? Cessation of behavior? You have taken a specific stance here that is not fully settled.

  ### Summary for Teaching
  Your package is coherent *if* you revise (d). As it stands, (d) makes (h) impossible. If you adopt the **Proportionality Revision**, you have a defensible, Universalist, Fairness-Based account of standing. Be prepared to defend (f) against Relationship theorists and (g) against Commitment theorists, as those are the live wires in the current literature.
