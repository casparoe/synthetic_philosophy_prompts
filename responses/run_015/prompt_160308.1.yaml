answer: |-
  Here is a precisely stated principle, derived from your verdicts and designed to resolve your specific tensions, followed by the tests you requested.

  ### The Principle: Specific Interruption and Mechanical Proximity

  A non-human entity $X$ is an **Historical Actor** in a narrative episode $E$ if and only if it satisfies both of the following clauses:

  **1. The Clause of Specific Interruption**
  $X$ must either (a) introduce a discontinuity in the expected continuity of affairs *within the timescale of $E$*, forcing a revision of extant plans, OR (b) constitute a hard physical constraint that closes all viable decision branches except one *at a specific decision node*.
  *   *Motivation:* This distinguishes **Actors** (Tambora, Black Death, North Sea Flood) from **Conditions** (Coal, Netherlands topography). Coal enables industry but does not interrupt a specific plan or force a singular choice at a specific moment; it is a background affordance. The Black Death interrupted the specific plan of feudal labor retention. This validates your uneasiness about Coal: slow geography *should* remain a condition forever. That is not a bug; it is the correct categorization of structure versus event.

  **2. The Clause of Mechanical Proximity**
  The causal chain linking $X$ to the historical outcome must rely on physical or biological necessity, not cultural or psychological inference. The link is valid only if the outcome is a direct physical consequence of $X$ (e.g., death, crop failure, impassability) or a documented institutional response to that physical consequence (e.g., wage statutes, migration).
  *   *Motivation:* This resolves the **Black Death vs. Antonine/Justinian** tension.
      *   *Black Death:* Pathogen $\rightarrow$ Death $\rightarrow$ Labor Scarcity $\rightarrow$ Wage Rise. The link is economic mechanics driven by physical scarcity.
      *   *Antonine $\rightarrow$ Christianity:* Pathogen $\rightarrow$ Death $\rightarrow$ *Psychological/Cultural Shift* $\rightarrow$ Conversion. The link relies on inferring mass psychological reaction, which is opaque and hand-wavy.
      *   *Antonine $\rightarrow$ Reconquest Failure:* Pathogen $\rightarrow$ Death $\rightarrow$ Military Failure. This is mechanically proximate, *but* often fails the **Specific Interruption** test because "Failure of Reconquest" is a long-term trend with multiple causes, whereas the Black Death's impact on serfdom was a singular, dominant renegotiation of the social contract.

  ---

  ### Verdicts on the Four New Cases

  **1. A monsoon that fails to arrive (Absence)**
  *   **Verdict:** **Actor.**
  *   **Reasoning:** Satisfies *Specific Interruption*. The expectation of rain is a "plan" (agricultural cycle). The absence is a datable discontinuity within the season. It forces plan revision (famine response, migration).
  *   **Note:** Absence is an event if it violates a specific expectation embedded in human planning.

  **2. A storm that a city anticipated and built against, which then arrives as forecast**
  *   **Verdict:** **Condition (validated).**
  *   **Reasoning:** Fails *Specific Interruption*. If the levees hold and the plans function, the storm is a stress test of the *human* actor (the engineers/politicians). The storm is the scenery against which human competence is measured. It only becomes an **Actor** if the water exceeds the design specifications, forcing *emergency* plan revision.

  **3. A flood whose height was nobody's doing but whose damage curve is entirely a function of where people were permitted to build**
  *   **Verdict:** **Invited Actor.**
  *   **Reasoning:** This fits your existing "Invitation" clause perfectly. The water is the *Trigger* (Actor), the zoning is the *Cause* (Human Actor). The principle requires you to narrate them as a conjunction. To cite the flood alone is determinism; to cite the zoning alone is idealism.

  **4. The exhaustion of a resource that the agents always knew was finite**
  *   **Verdict:** **Condition turning Actor.**
  *   **Reasoning:** While the resource exists, it is a **Condition** (Constraint). It channels decisions (e.g., "we must conserve"). The *moment of exhaustion*, however, is a **Specific Interruption**. If the narrative covers the moment the well runs dry and the subsequent scramble, the exhaustion is an Actor. If the narrative covers the century of mining leading up to it, the resource is a Condition.

  ---

  ### The Broken Verdict

  **Which of your verdicts does this principle cannot accommodate?**
  It challenges your comfort with **Mosquito-borne disease in the Atlantic world**.
  *   **The Conflict:** You called the mosquito an **Actor** ("fine, no determinism worry"). However, under the *Clause of Mechanical Proximity*, saying mosquitoes "fixed what kind of colonies... took hold" borders on the determinism you reject in the "Continental Orientation" case.
  *   **The Tension:** If mosquitoes make a coast "lethal to Europeans," that is a physical constraint (Mechanical Proximity). But if you use this to explain the *type of labor system* (slavery vs. indenture), you are crossing into social causation.
  *   **The Fix:** You must treat the mosquito as an **Actor** regarding *demographics* (who survives), but a **Condition** regarding *political economy* (slavery). The mosquito made slavery *possible* (by killing white laborers), but human choice made it *actual*. Your principle forces you to split this verdict: Actor for death rates, Condition for labor systems. If you refuse to split this, you must accept a higher risk of determinism.

  **The Coal Uneasiness:**
  Your uneasiness about Coal ("plan-revision makes every slow geography a mere condition forever") is resolved by accepting that **slow geography *should* be a condition forever.** The principle validates your verdict (Coal = Condition) and tells you your uneasiness is a category error. Conditions are causal, but they are not *actors*. Do not promote Coal to Actor status; instead, acknowledge that Conditions can be *decisive* without being *agents*.

  ---

  ### The Simpler Rival

  **The Rival Principle: "The Surprise Test"**
  *   *Statement:* A non-human thing is an Actor if and only if its behavior was unknown or unpredictable to the human agents at the time.
  *   *Simplicity:* Extremely high. Easy to run on a narrative.
  *   **What it Overturns:** It overturns your **Resource Exhaustion** verdict. If agents knew the resource was finite, its exhaustion is not "surprising," so it becomes a Condition. This loses the analytical power of the "moment of crisis."
  *   **The Cost:** It also overturns **Coal**. Coal was known. It remains a Condition (which you want). But it also potentially overturns **Anticipated Storm**. If the storm was forecast, it's not an Actor. This works if the city survives, but fails if the city drowns despite the forecast. The "Surprise Test" conflates *epistemology* (what they knew) with *ontology* (what happened). A known danger that kills you is still an Actor in your death, even if you saw it coming.

  ---

  ### The 1918 Influenza and the End of WWI

  **The Verdict:** **Actor.**
  **The Reasoning:**
  1.  **Specific Interruption:** The pandemic peaked in Autumn 1918, precisely coinciding with the German Spring Offensive's failure and the Allied Hundred Days. It interrupted the specific military plan of the German High Command (Ludendorff explicitly cited the flu as a cause of failure).
  2.  **Mechanical Proximity:** The chain is Physical (virus) $\rightarrow$ Physiological (soldier incapacity) $\rightarrow$ Operational (unit effectiveness) $\rightarrow$ Strategic (armistice). It does not rely on cultural inference (e.g., "flu made people love peace").
  3.  **Distinction from Distrusted Explanations:** This is not the "Antonine $\rightarrow$ Christianity" error. It is the "Black Death $\rightarrow$ Labor Shortage" success. It explains a specific, short-term military collapse, not a millennial cultural shift.

  **Caveat:** It is an **Actor**, not *The Cause*. The principle allows you to write the flu into the narrative as a decisive factor that accelerated the end, without absolving human agents (blockade, strategy, diplomacy) of their responsibility for the outcome. It fits your "Direction" clause: it explains what agents were responding to (mass sickness), not substituted for what they decided (seeking armistice).

  ### Summary of Advice

  1.  **Keep Coal as a Condition.** Your principle was right; your gut was uneasy because you equate "Condition" with "Unimportant." Correct the definition, not the verdict.
  2.  **Split the Mosquito Verdict.** Actor for demographics, Condition for political economy. This protects you from the "Guns, Germs, and Steel" slide.
  3.  **Adopt "Mechanical Proximity."** This is the scalpel that separates the Black Death (economic mechanics) from the Antonine Plague (cultural inference).
  4.  **Accept 1918 Flu as Actor.** It is a tactical shock, not a teleological master key.
