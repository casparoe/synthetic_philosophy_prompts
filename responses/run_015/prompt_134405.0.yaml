  ### The Scenario

  Mara, a graphic designer working late in her studio, is calibrating a print proof against a neutral grey card under standard D50 lighting, but she has just taken a decongestant known to alter spectral sensitivity. As she fixes her gaze on the card, it does not merely *seem* grey under a tint; the surface vividly, sensorily presents as magenta, forcing itself upon her vision with the same immediacy and saturation as a veridical perception of a magenta object would. She knows intellectually the card is grey, and she knows the lighting is neutral, so she cannot attribute the color to the environment or her judgment; the magenta is perceptually present on the object itself, yet the object lacks the property entirely. The experience is introspectively indistinguishable from both a veridical perception of a magenta card and a hallucination of one, but unlike a hallucination, she is in genuine perceptual contact with the grey card, and unlike a standard look-property case, the magenta is generated by her internal physiology rather than any relational disposition of the card.

  ### The Argument from Illusion

  1.  **Premise 1 (The Illusion Premise):** In Mara's case, a feature (magenta) is perceptually presented that the mind-independent object (the grey card) does not possess.
  2.  **Premise 2 (The Indistinguishability Premise):** Mara's experience is introspectively indistinguishable from a veridical perception of a magenta object.
  3.  **Premise 3 (The Common Kind Assumption):** The best explanation for this indistinguishability is that both experiences belong to the same fundamental mental kind.
  4.  **Conclusion:** Therefore, the fundamental nature of experience is not essentially relational (object-involving), but consists of a common mental state that can occur with or without the object.

  **The Disjunctivist Denial:** The disjunctivist accepts Premise 1 and Premise 2 (conceding epistemic indistinguishability) but vehemently denies **Premise 3**. They argue that indistinguishability is an epistemic fact, not a metaphysical one; two experiences can be indistinguishable to the subject while having fundamentally different natures (one relational, one non-relational or negative).

  ### Verdicts

  *   **Conjunctivist / Common-Kind Theorist:** They verdict that Mara is in the same type of mental state as she would be if seeing a magenta card veridically. Since the object lacks magenta, the state must be defined by internal representational content or sense-data rather than external relations. The presence of the grey card is causally relevant but not constitutive of the *magenta* character of the experience.
  *   **Disjunctivist:** They verdict that Mara is in a fundamentally different kind of state than in the veridical case. In the good case, the magenta would be constituted by the object's actual properties. In this illusion case, the experience is either a "negative" state (merely seeming to see magenta) or a distinct positive kind that does not share the relational essence of veridical perception. The grey card is present, but the *magenta character* is not constituted by the card.

  ### Spec Check

  *   **Spec 3 (Genuine Illusion):** Met. There is a real object (grey card) in perceptual contact, but a feature (magenta) is presented that the object lacks.
  *   **Spec 4 (Perceptually Present):** Met. The scenario stipulates the color is "sensorily present" and "forced," not a result of inference or judgment (she knows it's grey).
  *   **Spec 5 (Indistinguishability):** Met. The scenario explicitly states the experience is introspectively indistinguishable from matching veridical and hallucinatory cases.
  *   **Spec 6 (Blocked Escapes):** Met. (a) **Relational Look:** Blocked by making the cause internal (drug) rather than environmental, so the object lacks even the disposition to look magenta in this context. (b) **Judgement:** Blocked by stipulating the color is sensory and forced against her knowledge. (c) **Composite View:** Blocked by making the color integral to the object's surface presentation; she isn't seeing a grey card *plus* a magenta haze, but a magenta card.

  ### The Working Feature

  The single feature doing the work is the **phenomenal intrusion of an absent property onto a present object**. This creates the tension: the disjunctivist wants to say perception is a relation to an object's properties, but here the relation exists (to the card) while the properties mismatch. If you remove the **object** (making it hallucination), the disjunctivist wins easily by calling it a negative state. If you remove the **absent property** (making it veridical), there is no argument. The illusion case forces the disjunctivist to explain how one can be relationally connected to an object while the phenomenal character is determined by a property the object does not have.

  ### The Strongest Disjunctivist Rebuttal

  The strongest move available is to concede that illusion is a **third, fundamental kind of experience**, distinct from both veridical perception (purely relational) and hallucination (purely negative/non-relational). On this view, illusion is a hybrid: it involves genuine perceptual contact with an object (unlike hallucination) but the phenomenal character is partially constituted by internal factors rather than the object's properties (unlike veridical perception).

  **The Cost:** This strategy saves disjunctivism from refutation but costs them their theoretical purity and parsimony.
  1.  **Fragmentation:** It abandons the clean binary slogan that "Veridical perception is the only fundamental kind." They must now explain the metaphysical nature of this third kind without collapsing it into the Common Kind view.
  2.  **Concession on Constitution:** It admits that non-relational factors (internal physiology) can constitute phenomenal character *even when the object is present*. This weakens the core Naive Realist claim that the mind-independent object *exhaustively* constitutes the phenomenal character in successful cases. If internal factors can intrude in illusion while maintaining object contact, the disjunctivist must explain why internal factors don't also constitute character in veridical cases, risking a slide back into Common Kind theory where the object is merely a causal trigger rather than a constitutive element.
