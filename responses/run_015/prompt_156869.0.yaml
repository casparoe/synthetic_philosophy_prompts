answer: |-
  The core rule of this audit is that institutional mechanism rigidity must never exceed the ontological stability of the group category it regulates, otherwise the proposal commits an ontological-mechanism error and fails automatically.

  ### Operational Audit Procedure: Group-Based Preference Evaluation

  **Time Allocation:** 30 Minutes
  **Reviewer Requirement:** Non-expert institutional staff
  **Input:** Proposal text only

  #### Stage 1: Category-Stability Audit
  **Objective:** Classify the boundary of the beneficiary group.
  **Question 1.1:** How is membership in the preferred group determined in the proposal text?
  *   **Option A (Administratively Fixed):** Defined by immutable external records or birth status not subject to individual change (e.g., caste, citizenship at birth, legal sex in rigid jurisdictions).
  *   **Option B (Administratively Mutable):** Defined by criteria an individual can change through regulated processes (e.g., income bracket, residency status, vocational certification).
  *   **Option C (Self-Declared):** Defined primarily by individual identity assertion with minimal external verification (e.g., racial identity, gender identity, spiritual affiliation).

  **Question 1.2:** Is the boundary verification process consistent with the classification in 1.1?
  *   **Yes:** Proceed to Stage 2.
  *   **No:** **STOP. UNCONDITIONAL REJECTION.** (Reason: Internal Contradiction).

  #### Stage 2: Normative-Mode Match
  **Objective:** Identify the ethical justification provided.
  **Question 2.1:** Which primary justification does the text advance?
  *   **Rectificatory:** Correcting specific past harm or discrimination.
  *   **Distributive:** Achieving current equity or resource balance.
  *   **Recognitive:** Validating identity or ensuring presence for cultural legitimacy.
  *   **Mixed/Unclear:** **FLAG FOR HUMAN REVIEW.** (Reason: Value judgment required to weigh competing justifications; procedure cannot prioritize moral theories).

  **Question 2.2:** Does the text provide empirical evidence linking the justification to the specific group?
  *   **Yes:** Proceed to Stage 3.
  *   **No:** **FLAG FOR HUMAN REVIEW.** (Reason: Factual dispute regarding harm/disparity severity).

  #### Stage 3: Mechanism-Proportionality Check (The Category-Stability Lock)
  **Objective:** Ensure the enforcement mechanism matches the category stability.
  **Question 3.1:** What is the enforcement mechanism?
  *   **Hard Percentage:** Reserved seats, mandatory quotas, strict floors/ceilings.
  *   **Sliding-Scale Target:** Variable goals tied to applicant pool demographics or income tiers.
  *   **Representative/Soft Target:** Consultation requirements, "comply-or-explain," aspirational goals.

  **Question 3.2:** Apply the Lock Matrix.
  *   **If Category is Fixed (1.1A):** Mechanism must be Hard Percentage OR Sliding-Scale. (Pass)
  *   **If Category is Mutable (1.1B):** Mechanism must be Sliding-Scale OR Representative/Soft. (Hard Percentage triggers **ONTOLIGICAL-MECHANISM ERROR**).
  *   **If Category is Self-Declared (1.1C):** Mechanism must be Representative/Soft. (Hard Percentage or Sliding-Scale triggers **ONTOLIGICAL-MECHANISM ERROR**).

  **Decision Point:**
  *   **Match:** Proceed to Stage 4.
  *   **Mismatch:** **STOP. UNCONDITIONAL REJECTION.** (Reason: Ontological-Mechanism Error; rigid mechanisms on fluid categories create enforcement arbitrariness).

  #### Stage 4: Sunset-or-Review Trigger
  **Objective:** Ensure temporality matches the justification.
  **Question 4.1:** Does the proposal include a specific expiration date, review clause, or condition for termination?
  *   **Yes:** **PASS.** (Proposal is institutionally coherent).
  *   **No:** **FLAG FOR HUMAN REVIEW.** (Reason: Perpetual preferences require higher-order value judgment regarding permanent structural inequality).

  ***

  ### Explicit Limitations of This Procedure
  This audit evaluates institutional coherence, not moral worth. It **cannot adjudicate** whether the historical harm or present disparity is severe enough to warrant preference at all. A proposal may pass this audit yet be morally unjustified due to lack of actual harm; conversely, a proposal may fail this audit (e.g., via Ontological-Mechanism Error) despite addressing a severe moral crisis. Questions regarding the severity of injustice, the prioritization of one disadvantaged group over another, and the validity of the normative theory (Stage 2) are value judgments reserved for senior human oversight.

  ***

  ### Worked Cases

  #### Case A: US Public University Enrollment Proposal
  **Proposal:** 12 percent reserved enrollment floor for students identifying with historically underrepresented racial groups, using self-identification with random audit.

  *   **Stage 1 (Category):** **Self-Declared.** (Relies on student self-identification).
  *   **Stage 2 (Normative):** **Rectificatory/Distributive.** (Historically underrepresented). *No Flag.*
  *   **Stage 3 (Mechanism Lock):**
      *   Category: Self-Declared.
      *   Mechanism: **Hard Percentage** ("Reserved enrollment floor").
      *   **Analysis:** Self-declared boundaries are fluid; Hard Percentages are rigid. Pairing them creates an incentive for boundary manipulation and requires invasive verification to maintain the rigid number, violating the stability lock.
      *   **Result:** **ONTOLIGICAL-MECHANISM ERROR.**
  *   **Stage 4:** Not reached.
  *   **Final Decision:** **UNCONDITIONAL REJECTION.**
  *   **Reviewer Note:** This is the likely resistance point. While the moral aim (equity) may be compelling, the procedure dictates that a rigid quota cannot be sustained on a fluid, self-declared category without producing administrative incoherence. To pass, the mechanism must shift to a "Soft Target" or the category must be redefined as Administratively Fixed (which raises legal/ethical issues outside this audit's scope).

  #### Case B: Indian University OBC Reservation
  **Proposal:** 27 percent OBC reservation coupled with an income-cap exemption mechanism ("Creamy Layer").

  *   **Stage 1 (Category):** **Administratively Fixed/Mutable Hybrid.** (Caste is fixed by birth; Income cap introduces mutability).
  *   **Stage 2 (Normative):** **Distributive/Rectificatory.** (Social and educational backwardness). *No Flag.*
  *   **Stage 3 (Mechanism Lock):**
      *   Category: Fixed/Mutable.
      *   Mechanism: **Hard Percentage (27%)** with **Exemption.**
      *   **Analysis:** The income cap converts the rigid caste category into a mutable economic one for the exclusion tier. The Hard Percentage is applied to the remaining fixed group. This aligns with the "Fixed" pathway of the Lock Matrix.
      *   **Result:** **MATCH.**
  *   **Stage 4 (Sunset):** Proposal cites constitutional mandate but lacks specific university-level review trigger.
      *   **Result:** **FLAG FOR HUMAN REVIEW.** (Reason: Perpetual mechanism requires value judgment on whether caste backwardness is permanent).
  *   **Final Decision:** **CONDITIONAL PASS.** (Approved pending addition of a 5-year review clause to satisfy Stage 4 coherence).

  #### Case C: Norwegian Corporate Board Policy
  **Proposal:** 40 percent gender-representation target with a comply-or-explain fallback and self-certification of gender status.

  *   **Stage 1 (Category):** **Self-Declared.** (Self-certification of gender status).
  *   **Stage 2 (Normative):** **Recognitive/Distributive.** (Representation). *No Flag.*
  *   **Stage 3 (Mechanism Lock):**
      *   Category: Self-Declared.
      *   Mechanism: **Representative/Soft Target** ("Comply-or-explain").
      *   **Analysis:** The mechanism allows for flexibility if the self-declared category does not yield enough candidates, avoiding the pressure to rigidly enforce identity boundaries.
      *   **Result:** **MATCH.**
  *   **Stage 4 (Sunset):** Policy includes annual reporting requirement.
      *   **Result:** **PASS.**
  *   **Final Decision:** **PASS.** (Proposal is institutionally coherent).
