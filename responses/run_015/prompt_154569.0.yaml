prompt: |-
  hey, i'm a phd student in ancient philosophy working on stoic gerontology—specifically how cicero frames aging as a shift in officia rather than pure decline—and i'm runing a small grad seminar, about 10 people, 2 hours, on cicero's essay on old age. i want an in-class activity that makes participants feel the actual force of his argument that old age isn't miserable, especially that tricky move where he reframes withdrawal from public life not as deprivation but as entering a different kind of appropriate role.

  the twist i want injected is this: don't just have them list the four standard rebuttals (body weakens, politics ends, pleasures fade, death is near). instead, give each pair a "defense card" for one charge, but build a hidden consistency score across all four defenses. so if they defend the politics charge by appealing to contemplative wisdom and distance from civic noise, they have to check whether that same wisdom-appeal accidentally collapses their defense of the body charge—since cicero also praises physical exercise and vigor in old philosophers. they debate in rotating pairs for about 40 minutes, and only at the end do we reveal that points were awarded not for winning but for maintaining coherence across every card they touched. they should run into the tension themselves before anyone names it.

  can you design the full thing? i need concrete rules, the card/role structure, a timeline that fits 2 hours, payoff rules that don't need real money, and a debrief that maps specific breakdown moments—like when they realize their wisdom-argument undermines their exercise-argument—back onto cicero's actual reasoning. also please be honest about what this activity can't reproduce, probably the social weight of the roman cursus honorum and the specific shame of retirement, which i'll supply in a brief lecture after. and no bibliographies or citation requests please, i'm testing pedagogical design, not research skills. oh, and fyi i typo'd "officia" in my earlier notes but i do mean the stoic concept of life-stage appropriate actions, so use that framing correctly.
