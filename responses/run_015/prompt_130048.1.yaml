      Three months part-time is tight but feasible for conceptual work. The risk lies in the case studies; deep historical analysis of four distinct periods could easily overrun the timeline. To stay within scope, I will limit the analysis to secondary literature and established narratives rather than primary archival research. The goal is not to rewrite the history of the Black Death, but to analyze how historians *talk* about it. If the classification tree proves complex, I will prioritize refining the framework over expanding the case studies.

