  **The Problem**
  Historians frequently use agential language for non-human causes, such as "the plague reshaped feudal labor" or "Tambora caused the Frankenstein summer." It remains unclear if this is shorthand for heavy causal weight or if it smuggles in ontological agency. The standard debate between environmental determinism and human agency leaves this open because both sides conflate the two protagonisms. Determinists treat causal weight as agency; humanists deny agency so hard they obscure the causal weight. This project argues that non-human factors can be protagonists without having interests, but current vocabulary collapses this nuance.

  **Methodology**
  I will perform a conceptual analysis of standard historical narratives across four cases: the Black Death and feudal collapse, the 1816 Tambora winter and Shelley's summer at Geneva, the 536 AD volcanic winter, and 19th-century cholera driving urban sanitation reform. For each, I will map whether the non-human factor is treated as background causation or implicitly granted 'interests.' Based on this mapping, I will construct a small classification tree designed for historians to audit their own explanatory language. This tool will help users identify when they are assigning causal necessity versus when they are anthropomorphizing structural forces.

  **Success and Failure Conditions**
  Success looks like a working distinction that lets people talk about non-human impact without falling into determinism. If historians can use the classification tree to clarify their arguments without resorting to metaphorical agency, the project succeeds. It provides a pragmatic vocabulary for enviromental history that respects human autonomy while acknowledging material constraints.

  Failure looks like the distinction collapsing into semantics or proving useless for actual historical explanation. If the classification tree is too abstract to apply to real texts, or if 'causal protagonism' turns out to be indistinguishable from 'agential protagonism' in practice, the framework offers no added value.

  **Scope Check**
  Three months part-time is tight but feasible for conceptual work. The risk lies in the case studies; deep historical analysis of four distinct periods could easily overrun the timeline. To stay within scope, I will limit the analysis to secondary literature and established narratives rather than primary archival research. The goal is not to rewrite the history of the Black Death, but to analyze how historians *talk* about it. If the classification tree proves complex, I will prioritize refining the framework over expanding the case studies.
