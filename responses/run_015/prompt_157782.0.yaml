answer: |-
  Look, let's get the mathematics straight before we start drawing existential conclusions about parole boards. You're right about the premise: if a risk-assessment algorithm is sufficiently robust to encode basic arithmetic—which most non-trivial weighting systems are—then yes, it constitutes a formal system to which Gödel's First Incompleteness Theorem applies. There will be a sentence within that system that is true but unprovable within the system's own rules.

  But then you ask, "Does that mean we shouldn't trust it?" And here is where people usually start talking nonsense.

  Incompleteness is not inconsistency. A system can be perfectly consistent and still be incomplete. The existence of a Gödel sentence doesn't mean the algorithm is going to spit out contradictory risk scores for actual human beings. It means there is some highly contrived, self-referential arithmetic statement about risk weights that the system cannot resolve. Do you think a parole officer is going to stumble across the Gödel sentence of the risk algorithm during a Tuesday morning review? "Uh, sir, this inmate's file constitutes a logical paradox regarding the weighting of prior convictions"? Please. For all practical purposes, the system is decidable on the inputs that actually matter. So no, Gödel doesn't make it untrustworthy in the practical sense. It just makes it logically bounded.

  Now, regarding the human officer. You ask if their interpretation means we've left the formal system behind. Yes. Obviously. The officer is not running the algorithm in their head; they are exercising practical judgement. They are taking the output of a formal system and embedding it into a normative context that includes empathy, context, and care—things the algorithm cannot formalize.

  But don't you dare slide into the Penrose trap here. I can see you gearing up to suggest that because the human can "see" the truth of the Gödel sentence, the human mind isn't computational. I'm not saying that. I'm saying the human is operating in a different register entirely. Care ethics isn't a formal system trying to be complete; it's a responsive practice. When the officer overrides the score based on mitigating circumstances, they aren't solving the incompleteness problem; they are abandoning the formal framework for a normative one that doesn't rely on syntactic derivation.

  And that brings me to your "toy model" accusation. It irritates me when people think that because a formal ethical system has limits, it's useless—or conversely, that because human judgement exceeds those limits, human judgement is magic.

  Formal ethics isn't a toy model; it's a specific tool. It's good for consistency, for auditing bias, for ensuring equal treatment under defined rules. But it was never supposed to capture the whole of moral life. Restricted Gödelianism means exactly what it says: I restrict the claim of incompleteness to the formal systems. I do not extend it to human reasoning, because human reasoning isn't a single formal system.

  So, where do I stand? I stand on the distinction. The algorithm is a formal system; it is incomplete. We shouldn't trust it blindly, not because of Gödel, but because it lacks the capacity for care. The human officer operates outside that system, not because they are transcendent logic-machines, but because they are engaging in a non-formalized practice. We use the formal system where precision is needed, and we use care ethics where judgement is needed. Gödel reminds us we can't have a single formal system that does both perfectly. That's not a reduction to a toy model; that's just maturity. Don't confuse the map's limitations with the territory's existence.
