  **OFFICE OF ONTOLOGICAL METROLOGY**
  **Technical Bulletin 892-B**
  **Date:** 12 November 2023
  **Subject:** Certification Protocols for Fundamentality Rank and Grounding Relations

  1.  **Scope of Certification.** The Office now accepts applications for the certification of fundamentality rank for any submitted entity and the verification of grounding relations between any submitted pair of facts. Applicants must submit distinct forms for the relata and the relation.

  2.  **Hyperintensional Requirements.** The intake form must distinguish between formulations that are necessarily equivalent. A certificate issued for the fact that {water is H₂O} is not valid for the fact that {water is water}. Substitution of co-referential descriptions voids the certificate and incurs a Reformulation Surcharge. Applicants are advised that logical equivalence is not grounds for fee reduction.

  3.  **Admissibility of Evidence.** Standard empirical detection methods are ruled inadmissible. Spectrometers, diffractometers, and causal probes cannot detect grounding relations. The Office insists it nevertheless measures a genuine feature of reality. Applicants must certify that no physical instrument was used during the determination of the relation.

  4.  **Structural Constraints.** Grounding relations must be asymmetric and irreflexive. No fact may ground itself. Loops are declared void. Chains must terminate. If a chain does not terminate, a Case Officer is assigned to monitor the infinite descent. The applicant remains liable for the Officer's travel expenses.

  5.  **Grounding of Grounding Facts.** Facts about grounding relations are themselves grounded. Certification of a grounding relation requires separate certification of the fact that grounds it. This requirement applies recursively. Applicants may opt for the Deferred Certification Plan, wherein the grounding of the grounding fact is billed in the subsequent fiscal quarter.

  6.  **Purity Requirement.** Facts about derivative entities must be grounded in facts about fundamental entities and not conversely. If a fundamental fact appears to depend on a derivative fact, the application is returned for ontological cleanup. The Office does not certify impure fundamental bases.

  7.  **Ontological Status.** Applicants must declare whether grounding is a relation or an operator. This choice is binding for the duration of the application. Please note that the choice makes no difference to the fee.

  8.  **Derivative Entities.** Derivative entities are nothing over and above the fundamental ones. In accordance with this status, the charge for certifying the existence of derivative entities, once the fundamental base is certified, is waived.

  **SCHEDULE OF FEES**

  *   Initial Fundamentality Rank Assessment: $450.00
  *   Grounding Relation Verification (per link): $120.00
  *   Hyperintensional Distinction Surcharge: $75.00
  *   Non-Causal Measurement Assurance: $200.00
  *   Infinite Descent Monitoring (per quarter): $300.00
  *   Ontological Status Declaration (Relation/Operator): $0.00
  *   Certification of Derivative Entities (Nothing Over and Above): $0.00

  **ATTACHMENT A: LETTER OF COMPLAINT**

  **From:** Association for the Replacement of Grounding by Identity, Causation and Law
  **To:** Office of Ontological Metrology
  **Re:** Invoice #892-B-004

  Dear Sirs,

  We are in receipt of your invoice for services rendered regarding the metaphysical structure of our recent publication. We dispute the charge. We paid for a grounding relation certification. Upon review, the work performed appears identical to standard identity claims and nomological deduction. You have billed us for a service that does no explanatory work beyond what is already covered by our existing causal models. We requested explanation; you provided a certificate stating that one fact obtains in virtue of another, without adding information content. We consider this a billing error. We expect a refund or a demonstration of utility distinct from identity and causation.

  Sincerely,
  The Committee

  **FINAL LINE ITEM**

  *   Certification of Technical Bulletin 892-B: **DEFERRED INDEFINITELY** (Status: Absolutely Fundamental)
