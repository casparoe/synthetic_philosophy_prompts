answer: |-
  You're right to feel the slogan is too clean. The money pump isn't a logical contradiction like "A and not-A"; it's a pragmatic demonstration that your preferences can guide you to a state you strictly dislike. Here's the messy middle.

  1. **What it establishes vs. Dutch Book.**
  A Dutch Book shows your *beliefs* violate the laws of probability; you lose money regardless of how the world turns out. It's about static coherence across possible states. A money pump shows your *preferences* violate instrumental rationality; you lose money because of how you move through time. It establishes that cyclic preferences are imprudent in a specific way: they make you an unreliable agent for your own ends. You start at A, end at A, but have less money. By your own lights (preferring A to A-minus-cash), you are worse off. The difference is structure: Dutch Books exploit betting quotients; Money Pumps exploit choice sequences. One targets belief consistency, the other target means-ends coherence.

  2. **The Tourist and Separability.**
  Your tourist case hits the nerve. The pump assumes "separability": that the value of a sequence is just the value of the final outcome minus costs. If the tourist values the *process* (the "kick" of swapping), then the objects aren't just A, B, and C. They are "A after swap," "A after two swaps," etc. If she prefers the history of swapping to staying put, she isn't actually cyclic over final outcomes; she just values movement.
  Is dropping separability cheating? Not exactly, but it's a substantive commitment. It says only final states matter. If you defend the tourist, you're claiming rational agents can value transitions independently of destinations. That's defensible, but it limits the scope of the pump. The pump only works if we agree that rationality requires evaluating choices based on where they land you, not the ride there. If the tourist insists the ride is the point, the pump fails, but only because she's no longer the kind of agent the argument targets (one who cares about final holdings).

  3. **Stakes and Scalability.**
  You're right that real-world friction (cents, diminishing utility) bounds the loss. But normative rationality is usually idealized. If it's irrational to burn $1,000 for no reason, it's irrational to burn $0.01 for no reason. The magnitude doesn't change the structural defect. Furthermore, pumps are scalable. You don't need cash fees; you can use probabilities (lowering the chance of a prize slightly each swap) or continuous goods (seconds of time, drops of water). Diminishing marginal utility just means the fees must shrink, not that the logic breaks. The conclusion isn't "you will go bankrupt," it's "you are guaranteed to lose value." Even a bounded loss violates the principle that you shouldn't choose a dominated option when a free alternative exists.

  4. **Foresight and Diachronic Rationality.**
  This is the strongest objection. A sophisticated agent sees the loop and refuses the last swap. Does this kill the argument? No, it shifts the terrain. If you refuse the last swap (C to A) because you foresee the loss, but you genuinely prefer A to C, you are violating your current preference to satisfy a future constraint. You are choosing C over A at step 1, but planning to choose A over C at step 3.
  This shows the argument is fundamentally about *diachronic* rationality. Cyclic preferences create a conflict between local consistency (always pick what you prefer now) and global consistency (don't end up poorer). You can avoid the pump, but only by being dynamically inconsistent—acting against your current desires to protect your future self. The pump proves you cannot hold cyclic preferences and remain both locally and globally rational over time.

  5. **Reverse Money Pump.**
  There is no reverse pump. Intransitivity makes you a victim, not a predator. To extract money, you need to offer trades the other person accepts that benefit you. If *you* are cyclic, you are the one willing to pay fees to move. You are the engine; the trader is the driver. You might feel flexible ("I can be moved from anything to anything"), but flexibility without a stable stopping point is instability, not leverage. You cannot commit to a termination state because your preferences always dictate a further move. The trader controls the sequence length; you only control the individual steps, which you are compelled to take. Value is destroyed by the fees, not created. You can't pump money from a coherent agent because they won't enter the cycle; you can only be pumped by them.

  The money pump doesn't prove cyclic preferences are logically impossible. It proves they are incompatible with being a successful agent over time who cares about final outcomes. It's a tax on incoherence.
