answer: |-
  You have stumbled upon one of the most persistent irritants in decision theory, and your instinct that the "infinity is not a number" defence feels like a cop-out is shared by a great many philosophers and mathematicians. The video essayist has conflated two distinct problems: the standard Two-Envelope Paradox (TEP), which is indeed a confusion about probability distributions, and the "Nalebuff" or "Broome" variant (the geometric case you described), which is a genuine puzzle about infinite expectations.

  Your friend, broadly speaking, has the stronger grip on the technical machinery, though the video presenter is not entirely wrong about the standard case. Here is a claim-by-claim breakdown of where the video stands, where it falls over, and how the expert consensus usually adjudicates this.

  ### 1. The Standard Paradox: "Treating $x$ as fixed is the mistake."
  **Verdict: Largely Correct.**

  The video is on solid ground here. In the standard formulation (where you don't know the distribution of money), the argument that "the other envelope is equally likely to be $2x$ or $x/2$" implicitly assumes a uniform prior distribution over all positive real numbers. In Bayesian terms, this is an *improper prior*; it cannot be normalised.

  If you assume any "sane" (proper) prior distribution—for example, that the total money in the world is bounded, or that the probability of finding £1 million is lower than finding £10—the symmetry breaks. As the video says, once you open the envelope and see £$x$, you perform a Bayesian update. For low values of $x$, switching is likely favourable; for very high values (near the upper bound of your prior), switching is likely unfavourable. When you average over all possible $x$, the expected gain from switching is exactly zero.

  **Where the video winces:** It implies that *opening* the envelope is necessary to dissolve the paradox. It isn't. Even without opening it, if you acknowledge that a proper prior must exist, you must admit that the probability of the other envelope being larger cannot be $1/2$ for *all* possible amounts. The error is algebraic and probabilistic, not merely epistemic.

  ### 2. The Geometric Variant: "Same mistake in a cleverer costume."
  **Verdict: Straightforwardly Wrong.**

  This is where the video essayist loses the plot. The variant your friend described (often attributed to Nalebuff or Broome) is mathematically distinct from the standard paradox. Here, the probability distribution is explicitly defined: the smaller amount is $2^k$ with probability proportional to $(3/4)^k$.

  In this specific construction, the calculation is not a blunder. If you open the envelope and see £$x$, it is mathematically true that the expected value of the other envelope is greater than $x$. Your friend is correct: for every amount you could possibly see, the conditional expectation $E[\text{Other} | \text{Seen} = x] > x$.

  The video claims this is the "same mistake." It is not. In the standard case, the $50/50$ assumption is inconsistent with any proper prior. In the geometric case, the probabilities are derived from a defined (albeit heavy-tailed) distribution. The calculation holds up. The paradox here is not that the maths is wrong, but that the conclusion ("always switch") seems to contradict the symmetry of the situation (if you always switch, why are you better off?).

  ### 3. The Infinity Defence: "Infinity isn't a number... nothing to explain."
  **Verdict: Glib / Incomplete.**

  This is the "cop-out" your instinct flagged. It is true that in the geometric variant, the unconditional expected value of both envelopes is infinite ($\infty$). In standard measure theory, you cannot subtract $\infty$ from $\infty$ to find a gain.

  However, dismissing the paradox because the *unconditional* expectation is infinite ignores the *conditional* expectations. Decision theory is often concerned with what to do given the information you have (the amount in your hand). Since $E[\text{Other} | \text{Seen} = x] > x$ for all finite $x$, there is a coherent strategy ("always switch") that seems to dominate ("never switch"), yet by symmetry, the strategy cannot actually yield a gain.

  Saying "infinity isn't a number" dissolves the *contradiction* (you can't prove $E[A] > E[B]$ and $E[B] > E[A]$ if both are infinite), but it does not explain why the conditional reasoning leads to a dominated strategy. It changes the subject from "Why does conditional reasoning fail?" to "Why are sums divergent?" Your friend is right: the infinite expectation prevents the *unconditional* contradiction, but it leaves the *conditional* puzzle intact.

  ### 4. The Lesson: "Expected Utility Theory breaks with unbounded values."
  **Verdict: Non-Sequitur / Overreach.**

  The video's conclusion that we ought to abandon means for medians or stochastic dominance is a significant overstatement. Expected Utility Theory (EUT) does not "break" here; rather, the conditions required for certain theorems (like Fubini's theorem, which allows you to swap the order of summation/integration) are not met.

  The lesson from the geometric variant is not that EUT is useless for unbounded values, but that one must be exceptionally careful when dealing with infinite expectations. Specifically, it highlights the difference between:
  1.  **Unconditional Expectation:** $E[X]$ (which is $\infty$).
  2.  **Conditional Expectation:** $E[X | \text{information}]$ (which is finite and well-behaved).

  When these diverge, intuition based on finite cases fails. Suggesting we switch to medians is a valid heterodox position in decision theory (some argue for it regarding Pascal's Mugging), but the Two-Envelope Paradox does not *force* this conclusion. It merely forces us to acknowledge that "Always Switch" is not a valid strategy when expectations diverge, even if it looks locally optimal at every step.

  ### Summary of the Dispute

  **The Video Essayist:**
  *   **Right** about the standard paradox (it's a prior error).
  *   **Wrong** to conflate the standard paradox with the geometric variant.
  *   **Glib** about the infinite expectation (it solves the algebraic contradiction but not the normative puzzle).
  *   **Overreaching** on the death of Expected Utility Theory.

  **Your Friend:**
  *   **Right** that in the geometric case, the conditional expectation genuinely favours switching for every observed value.
  *   **Right** that the "switch back" contradiction fails specifically because the unconditional expectations are infinite.
  *   **Implicitly Right** that dismissing the geometric case as "just infinity" ignores the structural oddity of the conditional probabilities.

  ### The "Expert" Consensus

  If you were to walk into a seminar on this at LSE or Oxford, the consensus would likely be:

  1.  **Standard TEP:** Solved. It is a confusion about improper priors. No rational agent with a proper belief state would calculate a positive expected gain from switching without looking.
  2.  **Geometric TEP:** Acknowledged as a veridical paradox. The maths is correct; the intuition is what fails. The "Always Switch" strategy is inadmissible not because the calculation is wrong, but because the expected utility of the strategy is undefined ($\infty - \infty$).
  3.  **Decision Theory:** EUT remains the standard, but with a caveat: it applies cleanly only when expectations are defined (integrable). When they are not, EUT is silent, not wrong. The recommendation to use stochastic dominance is a sophisticated take, but it is not the standard textbook resolution.

  **Final Advice:** Trust your instinct that the "infinity" defence is unsatisfying, but trust your friend's maths over the video's philosophy. The geometric variant is not a mistake; it is a boundary case showing where our intuitions about "local improvement" (switching is good for *this* $x$) fail to aggregate into "global improvement" (switching is good *overall*) when the tails of the distribution are too heavy. The video tried to tidy up a mess that is actually quite profound.

  In short: The video is a good introduction to the *basic* error, but it papers over the *advanced* problem your friend identified. You are right to feel that the infinite case demands more than a shrug.
