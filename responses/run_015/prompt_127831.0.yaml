  I propose the **Principle of Counterfactual Pathway Independence and Token Invariance**.

  ### The Principle

  Genuine causal overdetermination obtains if and only if three conditions are met:

  1.  **Temporal Sufficiency:** Each cause must be individually sufficient to produce the effect at the *specific time* it occurred, not merely *eventually*.
  2.  **Mechanism Heterogeneity:** The causal pathways must be distinct in kind and must not merge into a single intermediate causal node before producing the effect. (Homogenous pressures tend to summate; heterogenous pressures tend to duplicate).
  3.  **Token Invariance:** The effect must be the *same concrete token* in all counterfactual scenarios. If removing a cause changes the *manner, properties, or trajectory* of the effect (even if the broad outcome remains), it is explanatory convergence, not overdetermination.

  ---

  ### Application to Your Cases

  **Case 1: Fall of Rome (Verdict: True Overdetermination)**
  *   **Analysis:** This meets all three criteria.
      *   *Sufficiency:* You stipulate both economic decay and invasion were individually sufficient at the time.
      *   *Heterogeneity:* The mechanisms are distinct (Internal systemic rot vs. External military shock). They do not merge into a single variable; they attack the state from different vectors.
      *   *Invariance:* The effect ("Fall of the Western Empire") is defined coarsely enough that the token is invariant whether caused by revolt or invasion.
  *   **Result:** Overdetermination.

  **Case 2: World War I (Verdict: Joint Necessity)**
  *   **Analysis:** Fails *Temporal Sufficiency*.
      *   Neither the alliance structure nor the assassination was sufficient alone at the time; they were INUS conditions (Insufficient but Necessary parts of an Unnecessary but Sufficient condition).
  *   **Result:** Not overdetermination (Conjunctive Causation).

  **Case 3: Calculus (Verdict: Convergence/Inevitability)**
  *   **Analysis:** Fails *Token Invariance*.
      *   While the *abstract truth* of calculus was inevitable, the historical event is the *formulation and dissemination* of calculus.
      *   If Newton is removed, Leibniz produces calculus, but the *notation and conceptual framing* differ. Since these properties are explanatorily relevant to the history of mathematics, the effect token is not invariant.
  *   **Result:** Explanatory Convergence (Structural Inevitability), not causal redundancy.

  **Case 4: Hypothetical Reform (Verdict: Convergence without Redundancy)**
  *   **Analysis:** Fails *Mechanism Heterogeneity*.
      *   Here lies the source of your hesitation. Two "economic crises" are homogenous causes. In social systems, homogenous pressures (e.g., inflation and unemployment) typically merge into a single intermediate variable (e.g., "Public Unrest" or "Revolutionary Potential") before triggering reform.
      *   Even if each *could* reach the threshold alone, when they occur simultaneously, they likely combine to create a *more intense* or *more stable* reform environment than either would alone. Thus, they are not redundant; they are cumulative components of a single sufficient pressure.
  *   **Result:** Convergent Cumulation, not Overdetermination.

  ---

  ### Application to Unlisted Cases

  **Case 3 Revisited (Calculus)**
  As noted above, the principle classifies this as **Explanatory Convergence**. The "inevitability" you sense is modal (it *had* to happen), but the causation is not overdetermined because the specific historical token (Newton's *Principia* vs. Leibniz's *Nova Methodus*) is counterfactually fragile. The *discovery* is overdetermined; the *specific formulation* is not.

  **Case 5: Political Revolution via Institutional Failures**
  *   **Scenario:** Two independent institutional failures overlap precisely; revolution succeeds *only because* they overlap, though each would *eventually* have produced the outcome.
  *   **Analysis:** This fails *Temporal Sufficiency*.
      *   The phrase "succeeds only because... overlap" implies that at time $t$, neither failure was fully sufficient on its own. They required the conjunction to cross the threshold *at that moment*.
      *   The fact that they would *eventually* be sufficient is irrelevant to the causation of the event at $t$. This makes the overlap a case of **Joint Necessity** (similar to WWI), where the timing is caused by the conjunction, even if the outcome was inevitable in the long run.
  *   **Verdict:** **Joint Necessity (Not Overdetermination).** The revolution at time $t$ is causally dependent on the overlap.

  ---

  ### Do Any Verdicts Need Overturning?

  Your four verdicts are **coherent** under this principle; none require overturning. However, the principle clarifies *why* Case 4 feels different from Case 1, which standard sufficiency tests miss.

  *   **The Crucial Distinction:** Standard philosophy might classify Case 4 (Two Crises) as overdetermination because both are sufficient. Your intuition resists this. The principle validates your resistance by identifying **Mechanism Heterogeneity** as a requirement.
      *   In **Case 1 (Rome)**, the causes are *heterogenous* (Economy vs. Barbarians). They are alternative pathways.
      *   In **Case 4 (Reform)**, the causes are *homogenous* (Economy vs. Economy). They are cumulative inputs into a single pathway.
      *   Without this distinction, Case 1 and Case 4 would be identical, forcing you to call the Reform overdetermined (which you hesitate to do) or Rome joint-causal (which contradicts your stipulation).

  By adopting the **Principle of Counterfactual Pathway Independence and Token Invariance**, you preserve the distinction between "two ways to win" (Overdetermination) and "two pushes that merge into one shove" (Convergence).
