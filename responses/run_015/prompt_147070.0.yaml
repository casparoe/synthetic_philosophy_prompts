answer: |-
  Dear colleague,

  Your proposal to distinguish between difference-makers, conditions, and actors offers a robust framework for disciplining causal prose, and it survives the demand for precision remarkably well. The three-grade distinction you outline moves the debate away from metaphysical essences and toward the practical work of writing history, which is exactly where it belongs. To turn your intuition into a usable set of requirements, we must treat them not as abstract rules but as checks against the specific evidentiary problems you face with harvest returns and burial series. The first requirement, contrast-sensitivity, is the logical bedrock of the entire enterprise. Any claim that a non-human thing acted must be indexed to a specific contrast class, because causation is inherently relational. If you write that a pathogen caused a mortality spike, you are implicitly comparing the actual world to a world where the pathogen was absent. However, the test becomes more rigorous when you shift the contrast from the event versus nothing to the event versus the event as it would have gone under a different policy. If the mortality would have been identical under a different grain distribution system, then the pathogen is merely a condition, not the primary actor, and your prose should reflect that limitation. This leads directly into the second requirement, baseline discipline, which forces you to state the background or endemic rate of the phenomenon. You cannot credit a microbe with mortality that a population's nutritional state or housing had already made inevitable. In the case of a famine where blight arrives in an export economy, any theory that cannot separate the blight's contribution from the policy's contribution is disqualified, because it fails to isolate the variable against the endemic baseline of vulnerability.

  Following from this isolation of variables, the third requirement is the channel requirement, which insists that the path from an eruption or bacillus to a historical outcome always runs through institutions that record, ration, quarantine, or fail to. You need a criterion for when the institution rather than the pathogen should bear the agent's grammatical role. If the cholera outbreak only becomes lethal because the water commission refused to filter supplies, the commission is the actor and the cholera is the weapon. This connects tightly to the fourth requirement, grain matching, which demands that the temporal and spatial grain of the cause be answerable to the grain of the thing explained. A multidecadal cooling trend cannot explain one bad harvest unless someone supplies the transmission story, just as a single eruption cannot explain a half century of state formation without a mechanism linking the shock to long-term institutional change. Without this match, you risk category errors where slow causes are made to do the work of fast triggers. The fifth requirement, the archive effect, reminds you that some non-human causes destroy, preserve, or generate the very sources you use. A city buried in ash looks like a case of a volcano acting, partly because the ash fixed the record in a way that ordinary years did not. Any account must say how much of the apparent causal prominence of such a cause is an artefact of what survived, ensuring you do not mistake source density for historical intensity.

  The sixth requirement is the non-exculpation condition, which you rightly identify as the most critical and the most difficult. This requires the theory to tell you when invoking a pathogen or drought is warranted and when it is ideology that relieves human agents of the alternatives they actually had. The test is to ask whether any human counterfactual survives once the non-human cause is held fixed. If the outcome remains unchanged regardless of human action, the non-human cause is dominant, but if human action could have mitigated the disaster, invoking the non-human cause as the primary actor is an exculpation of power. To ensure consistency, the seventh requirement is a symmetry check, where whatever test is proposed should be run against a human corporate agent such as a treasury or colonial administration. If your criteria return different verdicts for a treasury and a pathogen, you must decide whether that is a defect in your theory or a feature of the ontology. The eighth requirement is the explanatory payoff condition, which states that if calling something an actor lets you explain nothing that calling it a condition does not, then the vocabulary is doing rhetorical work only. Finally, the ninth requirement asks whether actorhood should require that the intentional vocabulary be grounded in something real. A pathogen has selection-driven dynamics that make some teleological talk defensible in a way that a volcano's does not, and you must decide if that makes germs actors and volcanoes merely causes, or if grounding is a prejudice of the scientifically minded camp.

  Regarding the status of these requirements, several are genuine desiderata while others reveal the preferences of a camp disguised as standards. Contrast-sensitivity, baseline discipline, grain matching, and explanatory payoff are genuine methodological necessities for any causal claim, regardless of political stance. They ensure logical coherence and empirical fidelity. However, the non-exculpation condition is likely a political preference, albeit a morally necessary one for a historian concerned with responsibility. It imposes a normative constraint on causal description that a purely positivist account might reject. Similarly, the channel requirement leans heavily on a humanist prejudice that institutions are the primary mediators of reality, which might obscure cases where non-human forces overwhelm institutional capacity entirely. The symmetry check is also debatable; insisting that a treasury and a pathogen be judged by identical criteria might be a category error rather than a virtue, since human corporations possess intentional states that microbes lack, even if both exhibit complex dynamics.

  On the question of consistency, there is a tension between the non-exculpation condition and the baseline discipline requirement that risks making the list jointly unsatisfiable in certain cases. Baseline discipline demands you isolate the biological or climatic variable from the policy variable to measure its specific contribution. Non-exculpation demands you highlight the policy variable to assign responsibility. In a scenario where a blight and a export policy are co-constitutive of the famine, isolating them for baseline discipline might artificially diminish the blight's role, while focusing on non-exculpation might artificially diminish the blight's biological reality. You may find that you cannot fully satisfy both the demand for isolated measurement and the demand for moral accountability simultaneously, because the famine exists precisely in the entanglement of the two. This inconsistency is not a failure of your theory but a reflection of the historical reality you are studying, where nature and society are not separate variables but a single coupled system.

  The single requirement that does the most work in excluding the positions currently on offer is the non-exculpation condition. Most existing theories of non-human agency focus on expanding the ontological list of actors to include rivers, viruses, and climates, often to flatten hierarchies or acknowledge material power. The non-exculpation condition reverses this pressure by asking what is lost when we expand that list. It excludes any account that uses non-human agency to obscure human decision-making, which is the primary risk in famine and epidemic history. While the channel requirement excludes simplistic environmental determinism, the non-exculpation condition excludes the ideological use of environmental history itself. It forces you to justify every sentence where a pathogen is the subject of an active verb, ensuring that the grammar of your history does not inadvertently absolve the administrators who managed the crisis. This makes it the most powerful tool for your specific purpose, even if it is the most politically charged. Your three-grade distinction survives this scrutiny well, provided you accept that the grade of actorhood is not just about the capacity of the non-human thing to respond, but about the capacity of the human writer to assign responsibility without falsifying the material constraints. I hope this specification helps you commit to a position that serves your evidence rather than mastering it.

  Yours sincerely,

  Your Colleague
