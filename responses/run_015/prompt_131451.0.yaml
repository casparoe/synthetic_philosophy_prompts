      *   *Decision:* The tree should categorize based on *observable evidence of cost type*, not the theoretical truth.
      *   *New Tag Set:*
          1.  **Incidental Cue** (No signal design).
          2.  **Index (Physical)** (Constraint visible).
          3.  **Handicap (Performance)** (Variable effort visible).
          4.  **Handicap (Risk)** (Receiver present, risk observable).
          5.  **Sunk Trait** (Morphology only).
