answer: |-
  Here is the coding procedure, reworked tag set, and the stress-test you asked for.

  ### 1. The Revised Tag Set
  Your original tags were theoretical conclusions. Undergraduates cannot code conclusions; they can only code observations. To preserve the theoretical distinctions you care about, we must tag the *observable proxies* that support those distinctions.

  *   **CUE (Incidental):** No exaggeration, no orientation toward audience. (Maps to *not-a-signal*).
  *   **INDEX (Physical):** Trait output is physically bound to body state (e.g., pitch to size). (Maps to *index*).
  *   **HANDICAP-VAR (Performance):** Signal intensity varies in real-time; implies current metabolic/risk cost. (Maps to *costly-or-handicap, variable*).
  *   **HANDICAP-SUNK (Developmental):** Signal is a fixed structure; cost was paid during growth. (Maps to *costly-or-handicap, sunk*).
  *   **UNCODEABLE-CONTEXT:** Signal design is present, but critical cost/receiver info is missing. (Maps to *uncodeable*).
  *   **FLAG-ADVISOR:** Clip meets criteria for a specific theoretical problem (marginal cost, third-party cost, currency) requiring your judgment.

  ### 2. The Decision Tree (Coding Procedure)
  **Time limit:** 3 minutes per clip.
  **Rule:** If a question cannot be answered from the footage alone, follow the "No/Unknown" path. Do not guess.

  **Step 1: Signal Design**
  *   **Q:** Is the trait/behavior exaggerated, repetitive, or oriented toward a potential audience (even if off-camera)?
      *   **No:** Tag **CUE**. Stop.
      *   **Yes:** Proceed to Step 2.

  **Step 2: Receiver Presence**
  *   **Q:** Is a conspecific receiver, rival, or predator visible *and* oriented toward the signaller?
      *   **No:** Tag **UNCODEABLE-CONTEXT**. Add **FLAG-ADVISOR** (Reason: Cost cannot be verified without receiver). Stop.
      *   **Yes:** Proceed to Step 3.

  **Step 3: Physical Constraint (Index)**
  *   **Q:** Is the signal property (e.g., frequency, color wavelength) physically impossible to produce if the animal were smaller/different? (e.g., deep pitch requiring large vocal cords).
      *   **Yes:** Tag **INDEX**. Proceed to Step 4 (to check for hybrid status).
      *   **No:** Proceed to Step 4.

  **Step 4: Static vs. Dynamic (Sunk vs. Variable)**
  *   **Q:** Is the signal a fixed morphological structure (antlers, plumage) or a repeatable behavior (calling rate, stotting height)?
      *   **Fixed Structure:** Tag **HANDICAP-SUNK**. Stop.
      *   **Repeatable Behavior:** Tag **HANDICAP-VAR**. Proceed to Step 5.

  **Step 5: Cost Specifics (The "Marginal" Check)**
  *   **Q:** Does the footage show the animal *modulating* the effort (starting/stopping, getting tired, changing intensity) in response to the receiver?
      *   **Yes:** Tag **HANDICAP-VAR**. Add **FLAG-ADVISOR** (Reason: Potential evidence of differential marginal cost). Stop.
      *   **No:** Tag **HANDICAP-VAR**. Stop.

  *(Note: If Step 3 was Yes AND Step 4 was Repeatable Behavior, apply both INDEX and HANDICAP-VAR tags.)*

  ---

  ### 3. Running the Clips

  **Clip 1: Gazelle stotting, no predator in frame.**
  *   **Step 1 (Design):** Yes. Exaggerated jumping, high visibility.
  *   **Step 2 (Receiver):** No predator visible. No other gazelles clearly attending.
  *   **Decision:** Tag **UNCODEABLE-CONTEXT**. Add **FLAG-ADVISOR**.
  *   **Reasoning:** You cannot code "costly signal" if the cost is predation risk and the predator is not in frame. The "pursuit-deterrence" hypothesis requires a predator to be deterred. Without one, it is observationally indistinguishable from play or exercise.
  *   **Advisor Note:** You will have to decide if the *absence* of a predator is itself data (successful deterrence prior to clip start) or missing context. The tree forces the "missing context" tag to prevent undergrads from assuming deterrence.

  **Clip 2: Nestling birds begging (audio + video).**
  *   **Step 1 (Design):** Yes. Gaping, vocalizing, oriented up.
  *   **Step 2 (Receiver):** Parents are often off-camera or partially visible. If parents are not clearly visible responding: Tag **UNCODEABLE-CONTEXT**.
      *   *Assumption for this run:* Let's assume a parent is visible at the nest rim.
      *   **Yes:** Proceed.
  *   **Step 3 (Constraint):** No. A weak chick can theoretically beg loudly (though it may die sooner). Pitch is not strictly size-bound in the same way a frog call is.
  *   **Step 4 (Static/Dynamic):** Dynamic behavior. Tag **HANDICAP-VAR**.
  *   **Step 5 (Modulation):** Do they stop when fed? Usually yes.
  *   **Decision:** Tag **HANDICAP-VAR**. Add **FLAG-ADVISOR**.
  *   **Reasoning:** This hits your "Third-Party Cost" concern. The metabolic cost is on the chick, but the *fitness* cost (predation risk) is largely borne by the nest (parents/siblings). The undergrad sees the behavior, but cannot see who pays the ultimate price.
  *   **Advisor Note:** You flagged this correctly in your prompt. The tree identifies it as a Variable Handicap, but the Flag forces you to review the "who pays" question. The code prevents the undergrad from labeling it "Honest" without you verifying the cost bearer.

  **Clip 3: Male frog advertisement call.**
  *   **Step 1 (Design):** Yes.
  *   **Step 2 (Receiver):** Females or rivals usually not in frame in audio traps.
      *   *Scenario A (No receiver):* Tag **UNCODEABLE-CONTEXT**.
      *   *Scenario B (Receiver visible/heard):* Proceed.
  *   **Step 3 (Constraint):** Yes. Pitch correlates to body size (physics of vocal sac/cords). Tag **INDEX**.
  *   **Step 4 (Static/Dynamic):** Dynamic (calling rate/duration). Tag **HANDICAP-VAR**.
  *   **Decision:** Tag **INDEX** + **HANDICAP-VAR**. Add **FLAG-ADVISOR**.
  *   **Reasoning:** This is the hybrid case. The pitch is an index (cannot fake being big). The *rate* is a handicap (energetic cost, predation risk).
  *   **Advisor Note:** The tree successfully splits the signal components. You can now analyze the "Index" component separately from the "Handicap" component in your dataset.

  ---

  ### 4. Meta-Analysis: Load-Bearing vs. Drop

  You asked which distinctions are load-bearing for coders at this level and which will misfire.

  **1. Marginal Differential Cost (DROP for Coders)**
  *   **Verdict:** Undergraduates cannot code this.
  *   **Why:** They cannot measure the physiological state of the animal. They cannot know if the "next unit" of signal costs a low-quality individual more.
  *   **Misfire:** They will code any "hard-looking" behavior as costly.
  *   **Fix:** The **FLAG-ADVISOR** on "Modulation" (Step 5) is the only safety valve. You must review these clips to determine if the behavioral variance *plausibly* maps to quality variance. Do not ask them to decide this.

  **2. Currency Conversion (DROP Entirely)**
  *   **Verdict:** Impossible from video.
  *   **Why:** You cannot convert "energy expended" to "predation risk" to "mating success" from a 30-second clip.
  *   **Fix:** Remove this from the codebook expectations. Treat "Cost" as "Observable Effort or Risk Exposure" only. Acknowledge that the *fitness currency* is an inference you make later, not a tag they apply.

  **3. Sunk vs. Variable Cost (LOAD-BEARING)**
  *   **Verdict:** Keep this. It is the most robust distinction in your list.
  *   **Why:** It maps perfectly to "Morphology vs. Behavior." Undergrads can reliably distinguish a static antler from a dynamic jump.
  *   **Value:** This solves your theoretical annoyance. If the cost is sunk, the signal cannot be strategically varied in the moment. It limits the "game" being played. This distinction is empirically visible.

  **4. Receiver Presence (CRITICAL LOAD-BEARING)**
  *   **Verdict:** This is the single most important filter.
  *   **Why:** As you noted, cost is often receiver-dependent (social punishment, predator attraction).
  *   **Misfire:** If you don't force a "No Receiver = Uncodeable" rule, undergrads will assume the audience exists off-camera. This inflates your "Signal" count with behaviors that might be practice or solitude cues.
  *   **Fix:** The Step 2 "Hard No" is essential. It will return a lot of "Uncodeable" clips, but that is honest data.

  **5. Index vs. Handicap (LOAD-BEARING, BUT ALLOW HYBRIDS)**
  *   **Verdict:** Keep, but allow dual tagging.
  *   **Why:** As the frog clip shows, nature mixes them. Forcing a choice creates false binaries.
  *   **Misfire:** Undergrads might think "Index" means "No Cost." (e.g., "It's just physics, so it's free").
  *   **Fix:** In training, emphasize: "Index means you can't fake the *trait*, Handicap means you pay to *use* it." A frog can't fake a deep voice (Index), but it pays energy to keep calling (Handicap).

  ### Summary of Expected Misfires
  1.  **False Positives on Cost:** Undergrads will tag high-energy behavior as "Handicap" even if the animal is well-fed and safe. *Mitigation:* Rely on the **FLAG-ADVISOR** for any clip tagged Handicap-Var. You review the context.
  2.  **Receiver Assumption:** They will assume a receiver exists because "it's a signal." *Mitigation:* The Step 2 Hard No. If they can't point to the receiver in the frame, it's Uncodeable.
  3.  **The "Honesty" Trap:** They will try to code whether the signal is "true." *Mitigation:* Ban the word "Honest" from the codebook. Code "Constraint" and "Effort." Honesty is a population-level inference, not a clip-level observation.

  This procedure prioritizes epistemic honesty over dataset size. You will get fewer "coded" clips, but the ones you keep will actually support the theoretical distinctions you are trying to defend.
