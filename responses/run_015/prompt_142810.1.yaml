answer: |-
  This is a profound and incisive puzzle that strikes at the heart of the interpretation of *On Certainty*. You have correctly identified a tension between the *static* function of hinges (as the unmoved movers of justification) and the *dynamic* reality of scientific practice (where methodological foundations are constantly debated).

  To answer your concluding question directly: Wittgenstein is **not** forced to admit that hinges are subject to rational evaluation in the epistemic sense (i.e., evaluation based on evidence and truth-conditions). However, he must concede that the *status* of a proposition as a hinge is fluid and context-dependent. He maintains the distinction between hinges and empirical beliefs not by freezing hinges in place eternally, but by locating the "evaluation" of hinges outside the realm of epistemic justification and within the realm of **pragmatic efficacy and forms of life**.

  Here is a detailed breakdown of how Wittgenstein's resources handle the puzzle of distributed hinges without collapsing the distinction.

  ### 1. Hinge Status is Functional, Not Intrinsic
  The first resource Wittgenstein offers is the insight that there is no intrinsic property that makes a proposition a hinge. As he notes in §151, "It is not a kind of *seeing* on our part; it is our *judging*." More accurately, it is our *acting*.

  In your example of Quantum Field Theory (QFT), the theory is not a hinge *simpliciter*. It is a hinge *relative to a specific language game*. For a particle physicist designing an experiment, QFT might function as a hinge (the framework within which data is interpreted). For a cosmologist testing the limits of the Standard Model, QFT might function as a revisable hypothesis.

  This does not collapse the distinction between hinge and empirical belief; rather, it relativizes the distinction to the **system of reference**. The distinction remains sharp *within* a specific inquiry. At any given moment of investigation, a proposition is either functioning as a rule of the game (hinge) or a move within the game (empirical claim). The fact that a proposition can migrate from one category to another over time (or between subgroups) does not mean the categories themselves are blurred; it means the "riverbed" of thought shifts (§97).

  ### 2. The Riverbed: Diachronic Shift vs. Synchronic Justification
  Your puzzle suggests that if physicists can disagree about QFT's status, they are evaluating it rationally. Wittgenstein would distinguish between two types of change:
  1.  **Synchronic Justification:** Within a fixed framework, we use evidence to justify beliefs. Hinges cannot be justified here because they are the standards of justification.
  2.  **Diachronic Shift:** Over time, the framework itself changes. Hardened sediment becomes sand; fluid water becomes rock (§96-99).

  When two subgroups disagree about a hinge (e.g., the reliability of electron microscopy vs. statistical sampling), they are not engaging in a standard epistemic dispute where one side has better evidence *against* the hinge. If they did, it wouldn't be a hinge. Instead, they are experiencing a **friction between forms of life**.

  Wittgenstein argues that when justification runs out, we do not find a deeper rational foundation; we find an action (§204, §217). If Group A treats microscopy as a hinge and Group B treats it as a hypothesis, they are effectively playing different language games. The "evaluation" that occurs is not a logical proof that one is right and the other wrong, but a pragmatic assessment of which game yields fruitful results. This is not "rational evaluation" in the sense of weighing evidence against a claim; it is a practical decision about which tool to use.

  ### 3. Persuasion vs. Argument
  You ask if disputes about hinges are "internal epistemic disagreements." Wittgenstein's answer is a decisive **no**. In §611-612, he suggests that at the end of the chain of reasons, what remains is not a proposition that is self-evidently true, but an act of **persuasion**.

  If a scientist tries to convince a colleague to treat a certain principle as a hinge (or stop treating it as one), they cannot simply produce data, because the data's validity depends on the very principle in question (circularity). Instead, they must appeal to the **utility** of the framework. They might say, "If we treat this as a hypothesis, we cannot make progress," or "This framework allows us to predict phenomena the other cannot."

  This preserves the epistemic inertness of the hinge. The hinge itself carries no evidential weight; rather, the adoption of the hinge is justified by the *consequences* of the form of life it sustains. This is not an epistemic justification of the hinge's *truth*, but a pragmatic vindication of the hinge's *use*.

  ### 4. Distributed Hinges and Local Certainty
  The phenomenon of "distributed hinges" actually supports Wittgenstein's anti-foundationalism. Traditional foundationalism seeks universal, indubitable truths. Wittgenstein offers **local certainties**.

  In a complex scientific community, there is no single "Scientific Worldpicture." There are overlapping language games. It is entirely consistent with *On Certainty* that Group A and Group B operate with different hinges, provided their practices do not require direct contradiction in shared actions.
  *   If their practices intersect (e.g., they must collaborate on a joint experiment), a conflict of hinges will arise.
  *   Wittgenstein would predict that this conflict cannot be resolved by appealing to "facts," because their criteria for facts differ.
  *   Resolution comes only when one group converts to the other's form of life, or a new synthesis (a new riverbed) emerges that accommodates both.

  This confirms that the disagreement is not about *what is the case* (empirical), but *how we go on* (grammatical/practical).

  ### 5. Conclusion: The Distinction Holds
  Wittgenstein is not forced to admit that hinges are subject to rational evaluation in the sense that would collapse them into empirical beliefs. To do so would require admitting that hinges can be *false* based on evidence. But for Wittgenstein, to treat a proposition as a hinge is precisely to remove it from the true/false game of empirical verification (§§205, 555).

  When physicists debate the hinge-status of QFT, they are not testing QFT against the world; they are testing a **methodological commitment** against the needs of their practice.
  *   **Empirical Beliefs:** Assessed by truth/falsehood relative to the world.
  *   **Hinges:** Assessed by fruitfulness/stagnation relative to a form of life.

  Therefore, Wittgenstein has the resources to maintain that such disputes are expressions of different forms of life. The "rationality" involved in shifting a hinge is not the rationality of inference, but the rationality of **adaptation**. The distinction remains intact because the *logic* of the two categories remains distinct: one belongs to the language of description (empirical), the other to the language of rules and action (hinges). The fact that the rules can change does not mean they are moves in the game; it means the game itself is evolving.

  **Summary:** The puzzle of distributed hinges reveals that hinge-status is contextual and fluid, but it does not render hinges epistemically evaluable in the traditional sense. Wittgenstein resolves the tension by categorizing disputes over hinges as clashes of *Weltbild* resolvable only through persuasion and practical success, thereby preserving the fundamental distinction between the framework of judgment and the judgments made within it.
