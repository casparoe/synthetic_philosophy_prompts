      *   *The "Rational Evaluation" Trap:* To evaluate a hinge rationally usually implies using evidence *against* it. But hinges are the standard *by which* evidence is judged. Evaluating them looks like trying to check the ruler with the ruler itself.
      *   *The "Forms of Life" Move:* Wittgenstein often ends justification with "This is what I do" (§217). Disagreements at the hinge level are often clashes of worldpictures (*Weltbild*), not logical contradictions.
