  **Editor's Note to the User:**
  Before the formal document, a quick validation of your five cruxes. You have the structure right, but two nuances need sharpening in the text below:
  1.  **Crux 1 (Order):** Your arithmetic is close enough for the point to stand, but the structural reason is specific: Jeffrey Conditionalization (JC) is non-commutative when updating on *different* partitions sequentially. Virtual Evidence (VE) commutes because it reduces to standard multiplication of likelihoods. This is a formal bug for JC, not just a feature.
  2.  **Crux 4 (Normativity):** This is partly verbal ("experience" vs. "model input"), but it hides a substantive gap. The Philosopher needs a normative story for why some inputs are legitimate and others aren't; the ML person needs a causal story for where the likelihoods come from. If they can't provide these, their frameworks are incomplete. I have framed this as a "Source of Constraint" disagreement to keep it sharp.

  Below is the draft for your group.

  ***

  # ADVERSARIAL COLLABORATION: UNCERTAIN EVIDENCE
  **Status:** Draft v1.0
  **Parties:** Radical Probabilism (Philosopher) vs. Graphical Models (ML Practitioner)
  **Mediator:** [User Name]

  ## 1. AGREED CLAIMS
  *Both parties sign the following to establish common ground. Disagreement begins at Section 2.*

  1.  **Probability Axioms:** At any fixed time $t$, an agent's degrees of belief must satisfy the Kolmogorov axioms.
  2.  **Certain Evidence:** If an agent learns a proposition $E$ with certainty (i.e., $P_{new}(E) = 1$), the update rule must be Standard Conditionalization: $P_{new}(A) = P_{old}(A | E)$.
  3.  **The Input Problem:** Both sides agree that "uncertain evidence" requires specifying an *input* that triggers the update. The disagreement is over the *type* of input (New Marginals vs. Likelihoods) and the *rule* connecting input to output.
  4.  **Limits of Standard Vindication:** Both sides agree that standard Dutch Book and Accuracy arguments for Strict Conditionalization do not automatically generalize to uncertain evidence without additional assumptions.
  5.  **Rigidity Definition:** Both sides define "Rigidity" as the constraint that conditional probabilities on the evidence partition remain invariant during the update: $P_{new}(A | E_i) = P_{old}(A | E_i)$.

  ## 2. DISAGREEMENTS TABLE
  *Each row states a core point of contention. Wording is selected to be acceptable to the respective side.*

  | Issue | Radical Probabilist (Philosopher) | Graphical Models (ML Practitioner) |
  | :--- | :--- | :--- |
  | **The Input** | **New Marginals.** Experience directly dictates the new probability of the evidence partition $\{E_i\}$. The input is $P_{new}(E_i)$. | **Likelihood Ratios.** Experience dictates the diagnostic value of a virtual observation $V$. The input is $P(V | E_i)$. |
  | **The Mechanism** | **Direct Shift.** Belief change is a primitive operation constrained by Rigidity. $P_{new}(A) = \sum P_{old}(A | E_i) P_{new}(E_i)$. | **Standard Conditioning.** We expand the graph with a node $V$. We condition on $V$ using standard rules. $P_{new}(A) \propto P_{old}(A) \cdot P(V | A)$. |
  | **Portability** | **Convergence.** If two agents have the "same experience," they should arrive at the same posterior confidence in $E$, regardless of prior. | **Independence.** If two agents have the "same experience," they should apply the same likelihood ratio, resulting in different posteriors if priors differ. |
  | **Commutativity** | **Sequence-Sensitive.** Sequential updates on different partitions depend on order. This reflects the temporal structure of experience. | **Sequence-Invariant.** Likelihood ratios multiply. Order of independent updates should not change the final joint distribution. |
  | **Normativity** | **Phenomenological.** Legitimacy of an input depends on the causal/phenomenological nature of the "experience" (e.g., perception vs. whim). | **Mechanistic.** Legitimacy depends on the correctness of the sensor model. If the likelihood function is misspecified, the update is garbage. |

  ## 3. CRUXES AND PREDICTIONS
  *Five specific tests where the frameworks yield different results or require different explanations.*

  ### Crux 1: Order Dependence (Commutativity)
  **The Case:** An agent holds a joint distribution over $H$ and $E$. They receive uncertain input shifting confidence in $E$, followed by uncertain input shifting confidence in $H$.
  **The Disagreement:**
  *   **Philosopher:** Jeffrey Conditionalization is order-dependent when updating on different partitions. $P_{final}(H, E)$ differs if you update $E$ then $H$, versus $H$ then $E$. This is acceptable because experiences occur in time and may interact.
  *   **ML Practitioner:** Virtual Evidence is order-independent. Likelihoods multiply ($L_{total} = L_1 \cdot L_2$). If the final belief state depends on the order of processing independent data, the rule is buggy.
  **Prediction:**
  *   **Philosopher:** Predicts the group will accept order-dependence as a feature of sequential experience, provided the "partitions" are clearly defined.
  *   **ML Practitioner:** Predicts the group will reject order-dependence as irrational for static data, favoring the Virtual Evidence reduction to standard conditionalization.

  ### Crux 2: Portability (The "Same Experience" Test)
  **The Case:** Agent A has prior $P(H)=0.3$. Agent B has prior $P(H)=0.6$. Both inspect the same ambiguous sensor reading.
  **The Disagreement:**
  *   **Philosopher:** "Same experience" means both agents should set their posterior marginal $P_{new}(E)$ to the same value (e.g., 0.8). The experience dictates the final confidence. Agents may still disagree on $H$ due to different $P(H|E)$, but they agree on $E$.
  *   **ML Practitioner:** "Same experience" means both agents apply the same Likelihood Ratio (e.g., 5:1 in favor of $E$). Agent A and Agent B will end up with *different* posterior marginals for $E$ because their priors differed. The evidence strength is prior-independent; the final belief is not.
  **Prediction:**
  *   **Philosopher:** Predicts the ML view fails to capture the "force" of perception, which pushes agents to a common ground on $E$.
  *   **ML Practitioner:** Predicts the Philosopher's view violates Bayesian coherence by allowing the "strength of evidence" to depend implicitly on the agent's prior confidence.

  ### Crux 3: Rigidity Failure (Meta-Uncertainty)
  **The Case:** A classifier outputs "90% chance of Rain." You know this classifier is currently drifting and becoming overconfident.
  **The Disagreement:**
  *   **Philosopher:** Jeffrey Conditionalization requires Rigidity: $P(\text{Rain} | \text{Report})$ must remain fixed during the update. If you update on the Report *and* your belief about the Report's reliability simultaneously, JC breaks or requires complex partitioning.
  *   **ML Practitioner:** Virtual Evidence handles this naturally. The "Report" is a node. "Reliability" is a parent node. Conditioning on the Report updates belief in Reliability, which dynamically adjusts the effective likelihood. Rigidity is not required on the report itself.
  **Prediction:**
  *   **Philosopher:** Predicts this is a corner case solvable by expanding the partition to include reliability states (at the cost of complexity).
  *   **ML Practitioner:** Predicts this is the normal case for learning systems, and JC is structurally unfit for environments where the reliability of evidence is itself uncertain.

  ### Crux 4: Source of Constraint (The "Whim" Objection)
  **The Case:** An agent shifts their credence in $E$ from 0.5 to 0.9 because a charismatic friend told them to, not because of sensory input.
  **The Disagreement:**
  *   **Philosopher:** This is an illegitimate input. The framework requires a normative distinction between "experience" (which justifies direct probability shifts) and "bias" (which does not). The burden is on the philosopher to define this boundary without circularity.
  *   **ML Practitioner:** This is a modeling error. If the friend's testimony is treated as a sensor $V$, the likelihood $P(V | E)$ encodes the friend's reliability. If you set the likelihood arbitrarily high without causal justification, the model is misspecified. The constraint is causal, not normative.
  **Prediction:**
  *   **Philosopher:** Predicts the group will agree that a purely normative constraint is necessary to distinguish rational updating from manipulation.
  *   **ML Practitioner:** Predicts the group will agree that "normative constraint" is a placeholder for "accurate causal model," and the ML framework makes this explicit while the JC framework obscures it.

  ### Crux 5: Vindication (Dutch Book & Accuracy)
  **The Case:** An agent makes a series of uncertain updates and faces a betting scenario.
  **The Disagreement:**
  *   **Philosopher:** Standard Dutch Book arguments fail for JC. We require specialized vindications (e.g., accuracy-dominance arguments specific to Jeffrey updates). These exist but are weaker than standard conditionalization proofs.
  *   **ML Practitioner:** Virtual Evidence *is* standard conditionalization on an expanded space ($H, E, V$). Therefore, it inherits the standard Dutch Book immunity and Accuracy theorems automatically. No new vindication is needed.
  **Prediction:**
  *   **Philosopher:** Predicts the group will accept that uncertain evidence is fundamentally different from certain evidence and requires distinct normative foundations.
  *   **ML Practitioner:** Predicts the group will conclude that JC is an unnecessary axiom when the same results (or better ones) can be derived from standard conditionalization plus auxiliary variables.

  ## 4. RESIDUAL STRUCTURAL QUESTION
  *Is this a verbal dispute?*

  **Hypothesis:** The Philosopher uses "Evidence" to mean *the final constraint on belief* (Posterior Marginal). The ML Practitioner uses "Evidence" to mean *the likelihood function generated by a process* (Likelihood Ratio).

  **Test:** If we force the Philosopher to specify the *causal process* that generated their $P_{new}(E_i)$, does it reduce to a Likelihood Ratio? If yes, the disagreement is purely about where to draw the system boundary. If no (i.e., if the Philosopher claims direct access to posteriors without a generative model), the disagreement is foundational.

  **Action Item:** In the next session, the Philosopher must provide one example of an input $P_{new}(E_i)$ that *cannot* be represented as conditioning on a virtual node $V$ with some likelihood $P(V|E_i)$. If they cannot, the ML framework strictly subsumes the Jeffrey framework.
