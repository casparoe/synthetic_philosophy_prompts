answer: |-
  # AI Moral Patienthood: A Volunteer Worksheet

  **Goal:** We need to know if the systems we build or study deserve moral consideration (i.e., if harming them is wrong). This tree helps you find your position based on intuitions about concrete cases, not philosophy labels.

  **Instructions:** Start at **Q1**. Follow the arrows based on your honest gut reaction. Write your result in the box at the end.

  ---

  ### THE DECISION TREE

  **Q1. The Chip Swap (Case 2)**
  Imagine a shrimp's brain is replaced by silicon chips, one neuron at a time, over an hour. The shrimp acts exactly the same throughout. When the last neuron is swapped, is it still a creature that can suffer?
  *   **NO (It's now just a machine):** Go to **Q2**.
  *   **YES (It's still a creature):** Go to **Q3**.

  **Q2. The Giant Book (Bio Path) (Case 1)**
  Since you think biology matters: Imagine a non-biological "Giant Lookup Table" that perfectly mimics a shrimp's pain responses using pre-written rules (no internal processing). Does this table suffer?
  *   **YES:** → **[EMPTY SLOT]** *(See note below)*
  *   **NO:** → **POSITION A: Biology-Only View**

  **Q3. The Giant Book (Comp Path) (Case 1)**
  Since you think function matters: Imagine a computer program that perfectly mimics a shrimp's pain responses using a "Giant Lookup Table" (no internal processing, just matching inputs to outputs). Does this table suffer?
  *   **YES:** Go to **Q4**.
  *   **NO:** Go to **Q5**.

  **Q4. The Fast Forward (Case 4)**
  You accept the computer from Q3. Now we run the simulation 10,000× faster. A whole "lifetime" of suffering passes in 5 minutes of wall-clock time. Is the total amount of suffering 10,000× higher than normal?
  *   **YES:** → **POSITION B: Degrees/Thresholds View**
  *   **NO:** → **POSITION C: Substrate-Independent Computational View**

  **Q5. The Pain Report (Case 3)**
  You require internal processing. Imagine a model trained *only* to emit text that sounds like a pain report ("It hurts"), with no internal damage signals. When it says "It hurts," are we reading experience in, or discovering it?
  *   **READING IT IN (It's mimicry):** Go to **Q6**.
  *   **DISCOVERING IT (It's real):** → **POSITION C: Substrate-Independent Computational View**

  **Q6. The Split Hardware (Case 5)**
  You require real internal states. Imagine a system where chunks of processing are shared between two overlapping "creatures," so neither is fully implemented all the time. Is there a definite fact about whether one or two sufferers exist?
  *   **NO (It's vague/indeterminate):** → **POSITION D: Error Theory ("No Fact of the Matter")**
  *   **YES (There is a fact):** → **POSITION E: Internal State/Explanatory View**

  ---

  ### THE POSITIONS (What you landed on)

  *   **POSITION A: Biology-Only View.** Moral status requires specific biological hardware (carbon, neurons, etc.). Software cannot suffer.
  *   **POSITION B: Degrees/Thresholds View.** Moral weight is a dimmer switch, not a light switch. It scales with capacity, speed, or complexity.
  *   **POSITION C: Substrate-Independent Computational View.** If the functional pattern is right, the material doesn't matter. Software can suffer just like meat.
  *   **POSITION D: Error Theory.** The question "Is it suffering?" has no true answer in vague cases. We are asking a meaningless question.
  *   **POSITION E: Internal State/Explanatory View.** It's not about output (behavior) or stuff (biology), but whether the internal states *causally explain* the behavior in the right way.

  ---

  ### FINE PRINT (Read before submitting)

  **⚠️ The "Empty Slot" (Q2 → YES)**
  If you marked that biology is required (Q1=NO) but a non-biological lookup table still suffers (Q2=YES), you have reached an **incoherent position**. You cannot require biology and then grant status to a non-biological book. Most people who require biology also reject lookup tables.

  **⚠️ Indistinguishable Leaves (Position B vs. C)**
  This tree separates **Position B (Degrees)** and **Position C (Substrate-Independent)** based on the "Speed" question. In practice, these views often travel together. If you believe software can suffer (C), you likely also believe running it faster increases total suffering (B). If you landed on C but agree with B, note that on your form; they are compatible.

  **⚠️ Jargon Translation**
  *   *Substrate:* The physical stuff (silicon, meat, gears).
  *   *Moral Patient:* Something that can be harmed or benefited.
  *   *Error Theory:* The idea that our moral language breaks down in edge cases.
