answer: |-
  **EXAMINATION PAPER**

  **Module:** Welfare of Farmed Fish and Crustaceans (MRes)
  **Time Allowed:** 3 Hours
  **Instructions:** Answer **two** questions. Each question carries 40 marks.

  ***

  **QUESTION 1**

  The Aquatic Welfare Assurance Board (AWAB) is a new international certification body covering salmonid farms and decapod farms (shrimp, prawn, and crayfish). AWAB's majority proposal is the **Sentience-Weighted Harm Index (SWHI)**. Under SWHI, an expert panel assigns each species a Sentience Confidence score *c* between 0 and 1, and assigns each recurring welfare-relevant event *e* (e.g., a day at a given stocking density, a handling episode, a slaughter method) an Aversiveness score *a* between 0 and 10. A farm's index is the sum, over all events and species, of *c* × *a* × *n*, where *n* is the number of individuals undergoing that event in a year. The farm's grade is set by the size of this total; the Board's rationale is that a farm can lower its index either by treating its animals better or by keeping fewer of them.

  The minority proposes a **Threshold Trigger Schedule (TTS)**. Here, the panel asks only whether evidence of sentience for a species is adequate. If yes, the species is scheduled and a short list of practices becomes prohibited outright (e.g., slaughter without prior stunning, stocking densities above a ceiling, live sale for domestic boiling). There is no weighting, no summing, and no offsets between species or individuals.

  *Case Study:* Brackenmoor Farm runs two lines: whiteleg shrimp (*Litopenaeus vannamei*), 40 million individuals/year, harvested by ice slurry (*a* = 3, *c* = 0.5); and rainbow trout, 200,000 individuals/year, killed by CO₂ narcosis (*a* = 6, *c* = 0.9). Under SWHI, the shrimp line contributes 60,000,000 to the index and the trout line 1,080,000. Replacing the shrimp harvest method with one scored *a* = 1 would cut the index by ~40,000,000—more than closing the trout line altogether.

  **(a)** Explain precisely what quantity the SWHI arithmetic measures and identify two ethical commitments inherent in summing *c* × *a* × *n* across different species and individuals. **(10 marks)**

  **(b)** Suppose AWAB normalises the index by dividing the total score by the total number of individuals (*N*), grading farms on average harm per animal rather than total harm. How does this alter the ethical incentives for a high-volume, low-aversiveness farm compared to a low-volume, high-aversiveness farm? **(10 marks)**

  **(c)** Adjudicate between SWHI and TTS. Which instrument better serves the function of a *certification standard*? Justify your choice and outline a hybrid standard you would propose to replace either. **(20 marks)**

  ***

  **MODEL ANSWER**

  **(a)** The SWHI arithmetic measures the **total cumulative welfare burden** imposed by a farming operation over a specific period. By summing *c* × *a* × *n*, the index quantifies welfare as an aggregate quantity of negative experience. This commits the Board to two controversial ethical positions. First, it assumes **commensurability**: that a unit of aversiveness in a crustacean (weighted by *c*) is morally comparable to a unit in a finfish, allowing trade-offs between species. Second, it assumes **aggregationism** (classical utilitarianism): that the moral significance of an event scales linearly with population size (*n*). This implies that preventing a minor harm to a million shrimp is morally superior to preventing a catastrophic harm to a single trout, provided the calculated sum is higher. It treats individuals as interchangeable vessels of welfare value rather than rights-holders.

  **(b)** Normalising by *N* shifts the metric from **total suffering** to **average suffering intensity**. Under total SWHI, a high-volume farm is penalised simply for existing at scale, incentivising population reduction. Under average SWHI, scale becomes ethically neutral. A high-volume, low-aversiveness farm (e.g., Brackenmoor's shrimp) would appear "better" than a low-volume, high-aversiveness farm (e.g., a niche trout farm using poor slaughter), even if the total suffering in the shrimp line is vastly higher. This removes the incentive to reduce stocking numbers but highlights the severity of treatment per animal. However, it risks masking the "tyranny of the majority": a system where millions endure mild chronic stress is graded as acceptable, potentially ignoring the moral significance of the sheer volume of affected lives.

  **(c)** The choice between SWHI and TTS turns on the purpose of certification. SWHI treats certification as an **optimisation problem**, seeking to minimise global welfare loss. TTS treats it as a **constraint system**, establishing inviolable minimum standards. For a public-facing certification label, TTS is superior. Certification functions as a guarantee to consumers that specific ethical boundaries have not been crossed, not as a utilitarian ledger. SWHI creates moral hazards: as seen in the Brackenmoor case, a farm could theoretically justify severe trout welfare violations if they sufficiently improved shrimp welfare, or vice versa, leading to counter-intuitive grades that undermine public trust. Furthermore, SWHI relies on epistemically fragile *c* scores; small changes in sentience confidence drastically alter the index, creating instability.

  However, TTS is blunt; it ignores continuous improvement above the threshold. I would propose a **Hybrid Threshold-Weighted Standard**. First, adopt TTS as a "gatekeeper": any violation of prohibited practices (e.g., unstunned slaughter) results in immediate certification failure, regardless of *n* or *c*. This respects the deontological intuition that certain harms are non-negotiable. Second, use a normalised SWHI (average harm) for tiered grading (e.g., 1 to 5 stars) *above* the threshold. This incentivises welfare enhancement without allowing severe harms to be offset by volume or minor improvements elsewhere. This structure acknowledges that while welfare intensity matters (SWHI), the legitimacy of the industry rests on respecting fundamental biological needs (TTS).

  ***

  **MARKING SCHEME (40 MARKS)**

  **Part (a): SWHI Mechanics and Commitments (10 Marks)**
  *   **Identifies "Total Cumulative Burden" (3 marks):** Must state that the index sums total negative experience, not average or per-capita.
      *   *Error:* Describing it as "welfare level" or "efficiency" without referencing aggregation.
  *   **Commitment 1: Commensurability/Trade-offs (3 marks):** Must note that the math allows harms to one species to be offset by benefits to another (or weighted against them).
      *   *Error:* Vaguely stating "it compares species" without noting the moral trade-off implication.
  *   **Commitment 2: Aggregation/Linearity (4 marks):** Must explain that *n* implies moral weight scales with population size (utilitarian sum-ranking).
      *   *Error:* Merely saying "aggregation is controversial" without explaining *why* (i.e., interchangeability of individuals).

  **Part (b): Normalisation Effects (10 Marks)**
  *   **Shift from Total to Average (3 marks):** Clear distinction that dividing by *N* removes population size as a moral variable.
      *   *Error:* Confusing normalisation with standardisation of scores.
  *   **Incentive Change (4 marks):** Must explain that high-volume farms are no longer penalised for scale; focus shifts entirely to intensity of treatment.
      *   *Error:* Claiming normalisation "fixes" the shrimp dominance issue without noting it hides total suffering.
  *   **Ethical Risk (3 marks):** Identification of the "tyranny of the majority" or masking of total harm volume.
      *   *Error:* Asserting average harm is objectively "better" without critiquing the loss of total welfare data.

  **Part (c): Adjudication and Proposal (20 Marks)**
  *   **Purpose of Certification (5 marks):** **Crucial Discriminator.** Must distinguish between certification as a *minimum guarantee* (TTS) vs. *optimisation tool* (SWHI).
      *   *Error:* Treating certification purely as a ranking system without considering consumer trust/regulatory function.
  *   **Critique of SWHI (5 marks):** Must cite the "offsetting" risk (Brackenmoor example) or epistemic instability of *c* scores.
      *   *Error:* Rejecting SWHI solely because "sentience is hard to measure" without addressing the structural ethical flaw.
  *   **Critique of TTS (4 marks):** Acknowledgement that TTS lacks incentives for improvement above the baseline.
      *   *Error:* Presenting TTS as a perfect solution with no drawbacks.
  *   **Hybrid Proposal (6 marks):** Proposal must include a "hard floor" (TTS element) AND a continuous improvement metric (SWHI element).
      *   *Error:* Proposing a vague "balance" without structural mechanism (e.g., "use both" without explaining how they interact).

  **General First-Class Differentiators:**
  *   **Award +2 Bonus Marks (within section caps):** For explicitly noting that SWHI treats welfare as a *consequentialist* calculation while TTS treats it as *deontological* constraint.
  *   **Penalise -5 Marks:** For any answer that relies on recalling real-world legislation (e.g., "The Animal Welfare Act says...") rather than reasoning from the provided text.
  *   **Penalise -5 Marks:** For answers that claim *c* (sentience score) is a factual biological constant rather than an ethical weighting parameter.
