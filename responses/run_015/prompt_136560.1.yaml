answer: |-
  To understand the mechanism Rousseau describes in the *Letter to d'Alembert*, we must first disentangle the specific psychology of the spectator from the broader social theory in which it is embedded. Rousseau is not merely observing that people are hypocritical; he is diagnosing a structural feature of representation itself.

  Here is a step-by-step conceptual analysis of the mechanism, its dependence on Rousseau's anthropology, its relationship to resource models of emotion, and its applicability to modern immersive media.

  ### 1. Moral Licensing vs. Vicarious Consumption

  You ask whether this is best read as "moral licensing" or "vicarious emotional consumption." While the two overlap in their outcome (inaction), Rousseau's mechanism is conceptually distinct from the modern notion of moral licensing and aligns more closely with a specific form of vicarious consumption.

  **Moral Licensing** implies a transactional economy of virtue: I perform a good act (or symbolically engage with one), deposit credit into a moral account, and subsequently withdraw that credit to permit a transgression. The focus is on *permission*.

  **Rousseau's Mechanism** is not primarily about permission to do evil, but rather about the *sufficiency of feeling*. For Rousseau, the spectator does not leave the theater thinking, "I have earned the right to be cruel." Rather, they leave thinking, "I am a compassionate person." The tears shed in the theater are not a currency spent to buy future vice; they are a mirror in which the spectator admires their own sensitivity.

  This aligns more closely with **vicarious emotional consumption**, but with a crucial Rousseauian twist: the consumption is not just of the emotion, but of the *self-image* that the emotion produces. The mechanism is one of **substitution**. The spectator substitutes the *sign* of virtue (weeping) for the *substance* of virtue (sacrifice). Because the sign is emotionally indistinguishable from the substance in the moment of experience, the conscience is deceived. The spectator feels the "elevation of soul" and mistakes that physiological and psychological arousal for moral worth.

  Therefore, it is not that the obligation is discharged (licensing); it is that the obligation is rendered invisible by the satisfaction of *amour-propre* (self-love/vanity). The spectator is not licensed to sin; they are simply lulled into believing they are already virtuous.

  ### 2. Dependence on the Anthropology of Corruption

  Does this mechanism depend on Rousseau's broader thesis that society corrupts natural pity? **Yes, absolutely.** It cannot operate independently of his anthropology.

  To see why, we must distinguish between *natural pity* (*pitié*) and *social pity*.
  *   **Natural Pity:** In Rousseau's state of nature (or his idealized conception of it), pity is an immediate, pre-reflective movement toward the suffering of another. It is kinetic. If a natural man sees suffering, he acts to relieve it because the distinction between self and other is porous enough that the other's pain is felt as a threat or disturbance to one's own equilibrium. Action is the only release for the feeling.
  *   **Social Pity:** In civil society, human beings are governed by *amour-propre*. We view ourselves through the eyes of others. Pity becomes reflective. We do not just feel the other's pain; we feel *ourselves feeling* the other's pain.

  The theatrical mechanism relies entirely on this shift. The theater is a social space where we sit in the dark, unseen, yet collectively validating one another's emotions. When the spectator weeps, they are not solely responding to the victim on stage; they are responding to the knowledge that they are the *kind of person* who weeps for victims.

  If the spectator were a "natural man" in Rousseau's sense, the theater would not work this way. The sight of suffering would compel him to leave the playhouse to find a real victim to help. The fact that he stays, weeps, and returns to his seat proves that the pity has been captured by vanity. The mechanism requires a subject who values the *appearance* of goodness over the *reality* of goodness. Without the prior corruption of society—which prioritizes reputation and self-image over immediate instinct—the separation of feeling from action would not hold. The "counterfeit experience" only works on a counterfeiter.

  ### 3. The Question of Depletable Resources

  You ask whether Rousseau's argument requires that emotional arousal and moral action draw on a single, depletable resource.

  **Rousseau does not rely on a hydraulic or resource-depletion model.** He does not argue that the spectator has a finite tank of "compassion energy" that is emptied by the tragedy, leaving none for the street outside.

  Instead, Rousseau argues for a **qualitative transformation** of the passion.
  *   In the real world, pity is painful and demands a cure (action).
  *   In the theater, pity is pleasurable and demands only continuation (attention).

  Rousseau suggests that we actually *enjoy* tragic pity because it allows us to feel strong emotions without the burden of responsibility. If the mechanism were based on resource depletion, one might argue that rest would restore the capacity for virtue. But Rousseau suggests the problem is structural and habitual. The more one indulges in theatrical pity, the more one trains the soul to prefer the *simulation* of virtue over the *labor* of virtue.

  The "payment" of tears is not a depletion of a resource; it is a bribe paid to the conscience. The conscience demands we be good; we show it our tears; the conscience accepts the tears as proof of goodness and goes to sleep. The failure to act is not due to exhaustion, but due to **satisfaction**. The spectator believes the work is already done because the internal sensation of "being good" has been achieved.

  ### 4. Extension to Modern Immersive Media

  If we extend this logic to modern immersive narrative media (Virtual Reality, hyper-realistic simulations), does Rousseau's critique grow stronger or collapse?

  **Rousseau's critique grows stronger.**

  One might argue that if the boundary between representation and action collapses (as in VR), the spectator might be prompted to act. However, Rousseau's criterion for virtue is not the *intensity of the feeling*, but the **cost of the sacrifice**.

  *   **The Intensification of Illusion:** VR creates a more perfect counterfeit. It stimulates the senses more fully than the 1758 stage. For Rousseau, this makes the deception more potent. The spectator is even more convinced that their physiological arousal (increased heart rate, tears, tension) constitutes moral engagement.
  *   **The Absence of Risk:** The core of Rousseau's criticism is that theatrical virtue costs nothing. "One is virtuous at the expense of a few tears." In VR, no matter how immersive, the user cannot truly lose. They cannot be physically harmed, they cannot lose their wealth, and they cannot suffer lasting social consequences.
  *   **The Perfection of the Trap:** If the 1758 theater allowed the spectator to feel virtue without cost, VR allows them to feel *presence* without cost. It creates a closed loop where the moral dilemma is experienced, "resolved" through a button press or a choice, and the user receives positive feedback (narrative progression, haptic response). This creates a perfect seal around the moral experience. The user feels they have *done* something because the medium responds to them, but they have risked nothing of their actual self.

  For Rousseau, the danger of representation is that it isolates moral sentiment from the messy, costly, unpredictable realm of human interaction. Immersive media isolates this sentiment even further, wrapping it in a technological interface that guarantees safety. The "boundary between representation and action" may have changed technically, but the **ontological boundary** remains: the user can remove the headset. As long as the consequence is removable, the virtue is counterfeit.

  Therefore, the logic holds firm. The more realistic the simulation, the more satisfying the "counterfeit experience," and the more deeply the spectator is convinced that they have exercised virtue when they have only consumed a simulation of it. The mechanism does not collapse; it is perfected.

  ### Summary of the Mechanism

  To synthesize: Rousseau is describing a mechanism of **reflective self-satisfaction** driven by social corruption (*amour-propre*).

  1.  **It is not Moral Licensing:** It is not banking credit for future vice; it is mistaking the sensation of empathy for the possession of virtue.
  2.  **It is not Resource Depletion:** The spectator is not tired; they are satisfied. The emotion is not used up; it is diverted from action to self-admiration.
  3.  **It depends on Corruption:** It requires a socialized subject who cares more about their self-image than the relief of suffering. Natural pity would not rest at tears.
  4.  **It strengthens with Immersion:** Modern media heightens the emotional payoff while maintaining the zero-cost structure, thereby deepening the illusion that moral feeling equals moral action.

  Rousseau's warning is ultimately that **virtue is defined by what it costs us**, not by what we feel. Any medium that allows us to feel the cost without paying it is, in his architecture, a machine of corruption.
