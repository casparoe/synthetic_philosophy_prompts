      *   *Is it Moral Licensing?* Moral licensing implies "I did good, so I can do bad." Rousseau suggests something slightly different: "I *felt* good, so I don't *need* to do good." It's a substitution of feeling for action, not necessarily a permission slip for vice, though the result is similar (inaction/vice).
      *   *Is it Vicarious Consumption?* Yes, this fits well. We consume the *image* of virtue.
