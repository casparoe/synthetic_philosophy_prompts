      *   **(7) Avi:** Counters entropy. AI *should* create order (clean rooms, code). Also, entropy depends on system boundaries and coarse-graining (which is value-laden).
          *   *Assessment:* Devastating critique. Life and technology are locally entropy-reducing processes. Defining the system boundary is subjective.
          *   *Rating:* Clearly Right.

      *   **(8) Bea:** Defends entropy. Coarse-graining is just a hyperparameter, not moral theory. Entropy penalty is a regularizer, not the objective.
          *   *Assessment:* Weak defense. While it's a regularizer, if the regularizer penalizes the actual job (creating order), it conflicts with the objective. Calling coarse-graining a "parameter" doesn't escape the fact that choosing *which* variables to coarse-grain determines what counts as "order."
