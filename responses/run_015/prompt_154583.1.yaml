prompt: |-
  I am applying for a one-semester independent study fellowship in philosophy of decision theory and need a two-page research proposal. The topic is evidential cooperation in large worlds, but I want to avoid the well-worn framing that simply asks whether an agent should take an action because it provides evidence about causally disconnected copies. Instead, I want to investigate a more specific variant: in a genuinely large-world setting, there may exist agents who are structurally similar to me—similar reasoning architecture, similar preferences—yet they are not epistemic peers in any robust sense, because they individuate possible worlds by different ontological criteria (for instance, by qualitative properties rather than by individual identities) or they operate within different logical frameworks. The precise question is whether evidential cooperation retains normative force when we replace the standard peerhood assumption with a weaker condition of structural similarity coupled with ontological disagreement, or whether cooperation collapses into something more like bare coordination without shared evidential status. The proposal should state this question with sufficient precision that it has a determinate answer, explain why standard treatments—which generally presuppose shared priors and homogeneous reasoning—leave this variant open, outline the method (conceptual analysis of peerhood conditions paired with informal modeling of decision rules under ontological fragmentation), specify what a successful result would look like (for example, a taxonomy of cooperation conditions ranked by how much ontological divergence they can tolerate), and identify what would count as failure (e.g., showing that the weakened condition cannot be formalized without smuggling peerhood back in). It should also include an honest scope assessment: is this tractable in one semester, and which parts are most likely to expand beyond the available time? Please do not include a bibliography, citation list, or literature review by reference; I will supply citations myself. The deliverable should be a plan for work not yet done, not a defense of a predetermined conclusion.
reasoning: |-
  Here's a thinking process that leads to the research proposal:

  1.  **Analyze the Request:**
      *   **Topic:** Evidential Cooperation in Large Worlds (specifically, a variant involving structural similarity + ontological disagreement).
      *   **Constraint 1 (Framing):** Avoid the standard "causally disconnected copies" framing (Newcomb/PSA style). Focus on agents with different ontological criteria/logical frameworks.
      *   **Constraint 2 (Length):** Two pages (approx. 800-1000 words, single-spaced standard academic formatting).
      *   **Constraint 3 (Content):**
          *   State the question precisely (determinate answer potential).
          *   Explain why standard treatments leave this open (shared priors/homogeneous reasoning assumptions).
          *   Outline the method (conceptual analysis + informal modeling).
          *   Specify success criteria (taxonomy of cooperation conditions).
          *   Specify failure criteria (smuggling peerhood back in).
          *   Include honest scope assessment (tractability in one semester).
      *   **Constraint 4 (Exclusions):** No bibliography, citations, or literature review by reference.
      *   **Constraint 5 (Tone):** Plan for work not yet done, not a defense of a conclusion.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Standard Evidential Decision Theory (EDT) / Evidential Cooperation:* I cooperate with my "twin" because my choice is evidence of their choice. This usually assumes we are epistemic peers (same priors, same logic).
      *   *The Twist:* What if the "twin" carves up reality differently? (e.g., Haecceitism vs. Qualitative Individualism, or Classical vs. Intuitionistic Logic).
      *   *The Question:* Does evidential correlation survive ontological fragmentation? If I choose $A$, is that evidence that an agent using a different ontology chooses $B$ (where $B$ is the "cooperative" equivalent in their framework)?
      *   *The Risk:* If the ontologies are too divergent, the mapping between actions breaks down, and "cooperation" becomes just coincidental coordination.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and precise. *Ontological Fragmentation and Evidential Cooperation: Normative Force Under Structural Similarity Without Peerhood.*
      *   **Introduction/Problem Statement:** Define the "Large World" context without relying on the standard "copies" trope. Focus on the *agent architecture* vs. *ontological commitment* distinction.
      *   **The Gap:** Standard models assume a shared state space. This proposal challenges that.
      *   **Methodology:** Conceptual analysis of "structural similarity" + informal decision matrices where rows/columns represent different ontological cuts.
      *   **Success/Failure:** Taxonomy vs. Impossibility proof.
      *   **Scope/Feasibility:** One semester is tight. Need to limit the ontological variations considered.

  4.  **Drafting - Content Refinement (Iterative Process):**

      *   *Critique of current draft:* Is it too vague?
      *   *Fix:* Make the "ontological criteria" concrete. Mention "qualitative properties vs. individual identities."
      *   *Critique:* Is the scope realistic?
      *   *Fix:* Acknowledge that formalizing *all* logical frameworks is impossible. Limit to specific divergences (e.g., identity conditions).
      *   *Critique:* Is the "determinate answer" requirement met?
      *   *Fix:* Frame the goal as establishing *necessary conditions* for evidential correlation across ontologies.

  5.  **Writing the Proposal (incorporating constraints):**

      *   *Header:* Standard proposal header (Title, Abstract/Summary).
      *   *Body Paragraph 1 (The Question):* Focus on the decoupling of reasoning architecture from ontological commitment. The core question: Does $P(Action_{Me} | Action_{Them})$ remain high when "Action" refers to different ontological categories?
      *   *Body Paragraph 2 (The Gap):* Standard Large World arguments (like those surrounding acausal trade) assume a shared state space or isomorphic priors. This proposal targets the non-isomorphic case.
      *   *Body Paragraph 3 (Method):* Conceptual analysis of "structural similarity." Informal modeling (not full axiomatic proof, but decision rules).
      *   *Body Paragraph 4 (Outcomes):* Success = Taxonomy. Failure = Proof that structural similarity entails ontological peerhood (reduction).
      *   *Body Paragraph 5 (Scope):* One semester is short. Limit to 2-3 specific ontological divergences. Risk: Formalization creep.

  6.  **Review against Constraints:**
      *   Two pages? (Need to manage word count. ~900 words usually fits 2 pages single spaced 12pt).
      *   No citations? (Check: ensure no names or dates are dropped).
      *   Plan, not defense? (Use future tense: "I will investigate," "The project aims to").
      *   Specific question? (Yes: Normative force under ontological disagreement).
      *   Scope assessment? (Yes, included at the end).

  7.  **Final Polish:**
      *   Ensure the tone is rigorous but humble regarding the timeline.
      *   Check that the distinction between "structural similarity" (reasoning process) and "ontological criteria" (world individuation) is clear throughout.
      *   *Self-Correction on "Large Worlds":* Ensure I don't drift into multiverse physics. Keep it focused on decision theory *in* large worlds, not the physics of them.
      *   *Refining the "Failure" condition:* The prompt asks for "smuggling peerhood back in." I need to make sure that's explicitly stated as a failure mode.

  8.  **Final Word Count Check:** Aiming for roughly 900-1000 words to ensure it fills two standard pages without looking sparse or overflowing. (The resulting text below is calibrated for this).

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally solve the problem in the proposal. It must remain a *proposal*. Avoid phrases like "I will show that cooperation holds." Instead, "I will determine whether cooperation holds."

  *(Final check on citations)*: Ensure absolutely no references to specific authors (e.g., no "Lewis," "Nozick," "Bostrom"). Just "standard treatments" or "existing literature."

  9.  **Final Output Generation** (Proceed to generate text based on these thoughts).
answer: |-
  **Project Title:** Ontological Fragmentation and Evidential Cooperation: Normative Force Under Structural Similarity Without Peerhood

  **Abstract**
  This project investigates the stability of evidential cooperation in large-world decision theory when the standard assumption of epistemic peerhood is replaced by a condition of structural similarity coupled with ontological disagreement. Standard models of acausal coordination presuppose that cooperating agents individuate possible worlds using identical ontological criteria. This proposal outlines a plan to determine whether evidential correlations retain normative force when agents share a reasoning architecture but diverge on the fundamental criteria for world-individuation (e.g., qualitative properties versus individual identities). The deliverable will be a taxonomy of cooperation conditions ranked by ontological divergence, or a proof of impossibility.

  **Research Question and Problem Statement**
  In large-world decision theory, evidential cooperation typically relies on the premise that an agent's choice provides evidence about the choices of causally disconnected but structurally similar agents. Existing treatments generally assume that structural similarity entails epistemic peerhood: if two agents reason alike, they partition the state space alike. This project challenges that assumption. It asks: *Does evidential cooperation retain normative force when agents possess similar reasoning architectures and preferences but individuate possible worlds by incompatible ontological criteria?*

  Consider two agents, $A$ and $B$. Both maximize expected utility using similar heuristic algorithms. However, $A$ individuates worlds by haecceities (primitive this-ness), while $B$ individuates worlds solely by qualitative properties. When $A$ chooses a cooperative action, does this constitute evidence that $B$ will choose the corresponding cooperative action, even if $B$'s ontology does not recognize the identity conditions $A$ relies upon to define the "situation"? The precise question is whether a mapping function can be established between the action-spaces of ontologically divergent agents sufficient to sustain evidential update, or whether the divergence collapses the interaction into bare coordination without shared evidential status.

  **Gap in Standard Treatments**
  Current decision-theoretic models of large worlds operate within a shared state space. They presuppose homogeneous reasoning frameworks where priors are common knowledge and the set of possible worlds is fixed across agents. This homogeneity allows for straightforward conditionalization: if I am type $T$, and you are type $T$, my choice is evidence of yours. However, this presupposition leaves open the variant where the definition of "type" is ontology-dependent. If the logical framework or ontological commitment determines the sample space, then structural similarity in reasoning may not guarantee correlation in action. Standard treatments cannot resolve this because they treat ontological divergence as a difference in priors rather than a difference in the structure of the state space itself. Consequently, it remains undetermined whether evidential decision theory can function across ontological boundaries or if it requires a unified metaphysics to generate normative force.

  **Methodology**
  The research will proceed in two phases: conceptual analysis and informal modeling.

  *Phase 1: Conceptual Analysis of Peerhood Conditions.*
  I will decompose the concept of "epistemic peerhood" into constituent necessary conditions: (1) shared logical vocabulary, (2) shared ontological commitments, and (3) shared reasoning algorithms. I will isolate condition (2) to construct cases where (1) and (3) hold, but (2) fails. This involves analyzing specific ontological divergences, such as:
  *   **Identity vs. Quality:** Agents disagreeing on whether transworld identity is coherent.
  *   **Classical vs. Constructive Logic:** Agents operating within different logical frameworks that alter the set of valid propositions.
  *   **Discrete vs. Continuous State Spaces:** Agents carving the continuum of possibilities at different joints.

  *Phase 2: Informal Modeling of Decision Rules.*
  I will construct decision matrices where the rows represent the actions of the proposing agent and the columns represent the actions of the ontologically divergent agent. Unlike standard matrices, the cells will not represent shared outcomes but rather *mapped* outcomes based on translation functions between ontologies. I will test whether standard evidential update rules ($P(Action_{Other} | Action_{Self}) > P(Action_{Other})$) yield stable cooperation equilibria when the translation function is lossy or non-isomorphic. The modeling will remain informal to avoid getting bogged down in the axiomatics of specific non-classical logics, focusing instead on the structural relationships between the decision rules.

  **Success and Failure Criteria**
  A successful result will take the form of a **Taxonomy of Cooperation Conditions**. This taxonomy will rank ontological divergences by their tolerance for evidential cooperation. For example, it might demonstrate that qualitative/haecceitistic divergence permits cooperation under specific utility thresholds, while logical divergence (e.g., excluded middle violations) precludes it. The result will provide a determinate answer regarding the necessary ontological overlap required for normative force.

  A failure condition is defined as demonstrating that the weakened condition of "structural similarity" cannot be formalized without implicitly smuggling robust peerhood back in. If it turns out that defining "structural similarity" across ontologies requires a meta-ontology that effectively unifies the agents' world-individuation, then the distinction collapses. In this case, the project will conclude that evidential cooperation is impossible without ontological consensus, thereby negating the initial hypothesis.

  **Scope Assessment and Feasibility**
  This project is designed for a one-semester timeline, but it carries specific risks regarding scope creep.

  *Tractable Elements:* The conceptual analysis of peerhood conditions is well-bounded and can be completed within the first four weeks. The construction of the decision matrices for 2-3 specific ontological divergences is feasible within the remaining ten weeks, provided the modeling remains informal.

  *Risk Factors:* The primary risk is the formalization of the "translation functions" between ontologies. Attempting to rigorously define how a haecceitist maps actions to a qualitative individualist could easily expand into a full metaphysical treatise, exceeding the semester limit. To mitigate this, I will restrict the analysis to *functional* mappings (input-output behaviors) rather than *semantic* mappings (meaning of terms).

  *Likely Expansion:* The section on logical frameworks (Classical vs. Constructive) is the most likely to expand beyond available time. If the interaction between logic and decision rules proves too complex for informal modeling, I will prune this category and focus exclusively on ontological individuation (Identity vs. Quality), which is more directly relevant to the core question of world-individuation.

  **Conclusion**
  This project does not presume that evidential cooperation survives ontological fragmentation. Rather, it proposes a structured inquiry to test the limits of decision theory in heterogeneous metaphysical environments. By isolating ontological criteria from reasoning architecture, the study aims to clarify whether the normative force of evidential cooperation is a product of shared minds or shared worlds. The final deliverable will be a paper suitable for submission to journals specializing in decision theory and metaphysics, providing a clear boundary condition for the applicability of large-world decision frameworks.
