  First off, on your trip switch: Dave's mostly right. That's a mask with extra steps, not a true fink. The wire's intrinsic ability to conduct doesn't vanish because you touched it; the external supply gets cut. You need something where the *act of testing* physically alters the object's inner state before the result can show. Here's your better case:

  Take a pressurised cooker disposed to blast steam if the valve is turned. Test it one way by turning the valve with a slow-bleed tool that vents the pressure as you twist, so by the time the valve is fully open there's no steam left—the test itself killed the pressure. Test it the other way by turning the valve while the spout is clogged with limescale, so the pressure stays built up inside but no steam comes out—the test failed to show the disposition, but the pressure is still there. In the first case, the object changes intrinsically (pressure drops) because of the test; in the second, the object stays the same (pressure holds) but the path is blocked.

  **Which bit is doing the real work?**
  It's the *intrinsic change* during the test. In the fink route, the pressure (the basis) is gone because you tested it. In the mask route, the pressure remains, just trapped. If you take that bit out—if the tool didn't vent pressure or the scale wasn't blocking the hole—you're back to a boring case where the thing just blasts steam normally. The whole point is that the simple "would blast if turned" formula fails in the fink case: it *was* turned, but it *didn't* blast, yet it *was* disposed to blast until the moment you touched it.

  **Dave's strongest move:**
  He won't deny the physics; he'll attack the wording. He'll say: "You're smuggling in hidden conditions. The disposition isn't 'blasts if turned', it's 'blasts if turned *properly without interference*'. Once you stipulate 'no venting tools' and 'no limescale', my formula works fine." He argues that any weird case just means you didn't define the 'if' part strictly enough. It's a solid move because it saves his simple view, but it makes the definition of "properly" do all the heavy lifting.

  **On your "Reverse Fink":**
  You haven't made it up, but it's not a third kind. It's just an ordinary disposition where the stimulus *creates* the basis rather than revealing it (like a glow stick: bending mixes the chemicals, *then* it glows). It doesn't break Dave's "would do M if S" view (it still glows if bent), but it does annoy the "hidden structure" crowd if they insist the structure must exist *before* the test. So it causes more trouble for the people agreeing with you than for Dave. Stick with the pressure cooker; it's the clearest way to show that testing can destroy what you're measuring.
