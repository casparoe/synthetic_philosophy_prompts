      *   *Underdetermination* $\rightarrow$ Non-identifiability (multiple SCMs imply the same $P$).
      *   *Duhem-Quine (Auxiliaries)* $\rightarrow$ Model specification assumptions (linearity, Gaussianity, no unmeasured confounding). Adjusting the model to fit data $\rightarrow$ Model modification/regularization.
      *   *Empirically Equivalent Rivals* $\rightarrow$ Markov Equivalent DAGs or Observationally Equivalent SCMs.
      *   *Ontological Distinctness* $\rightarrow$ Different causal mechanisms/edges (e.g., $X \to Y$ vs. $Y \to X$).
      *   *Scientific Realism* $\rightarrow$ Belief that the selected SCM reflects the true data-generating process (DGP), not just a good predictor.
