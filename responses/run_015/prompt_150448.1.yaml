  2.  **Deconstruct the Philosophical Thesis:**
      *   *Empirical Underdetermination:* Data alone doesn't dictate a unique theory.
      *   *Duhem-Quine:* You can't test a hypothesis in isolation; you test it with auxiliary assumptions. If prediction fails, you can blame the auxiliaries.
      *   *Strong Underdetermination:* There are always empirically equivalent but ontologically distinct rivals (in principle).
      *   *Threat to Realism:* If data can't distinguish, why believe the theory is *true* (ontologically) rather than just *predictively adequate*?

