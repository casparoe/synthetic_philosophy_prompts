      *   *Does CI solve it?* CI defines conditions for identifiability. If a model is identifiable, underdetermination is resolved *relative to the model class*. But the model class itself is an assumption.
      *   *The Normative Gap:* CI tells you *how* to choose (minimize AIC, maximize likelihood), but not *why* truth matters if prediction is equal. This is the realism vs. instrumentalism debate. CI usually assumes the goal is causal discovery (truth) or optimal prediction.
