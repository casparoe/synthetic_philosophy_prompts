answer: |-
  Dear colleague,

  I know exactly the frustration you are describing, and I think you have diagnosed it perfectly. The problem is that care ethics becomes palatable to students only when it is treated as a supplement to impartialism, a softening of the rules, rather than a challenge to the very idea that moral life can be ruled. If they leave thinking care is just kindness plus proximity, they have missed the violence done to care when it is forced into the shape of a policy. Your friend's story about the checklist is the perfect engine for this because it contains the tragedy of good intentions producing bad outcomes. Here is a design for a ninety-minute session that attempts to stage that tragedy rather than describe it. I have run a version of this twice now, and while it is chaotic, it produces the right kind of silence in the debrief.

  You will need to arrange the room into three distinct clusters, representing three separate care homes. Each cluster should have a table and six chairs. You will divide your eighteen students into these three groups of six. Within each group, four students will be assigned the role of Care Workers and two will be assigned the role of Residents. You will act as the Inspector and Regulator for the entire room. You will need to prepare three types of materials beforehand. First, for the Residents, you need sealed envelopes labeled Confidential Resident Profile. Inside each should be a card describing a specific, nuanced emotional need that cannot be solved quickly. For example, one card might read You are worried your son has stopped visiting because you were rude to him last week. You need to rehearse an apology with someone you trust. This will take at least ten minutes of uninterrupted conversation. If you are interrupted or rushed, you will feel too ashamed to continue. Second, for the Care Workers, you need a Shift Log sheet and a Protocol Checklist. The Checklist must require three specific items per resident per shift: Offer a choice of beverage, Address the resident by name, and Document a five-minute social interaction. Third, you need a timer visible to everyone and a stack of Compliance Stickers.

  The session begins with a five-minute introduction where you set the scene. Tell them this is a simulation of a residential care facility under new inspection regimes. Do not explain the philosophical concepts yet. Tell the Care Workers their goal is to keep their jobs by passing inspection. Tell the Residents their goal is to get through the shift feeling heard. Hand out the roles. The Residents go to the tables and sit. The Care Workers stand. Give the Residents their sealed envelopes and tell them not to open them until you say start. Give the Care Workers their Logs and Checklists. Explain the rules of the game clearly. The shift is twenty minutes long. There are two Residents per table. The Care Workers share the workload however they like. To pass inspection, every box on the Checklist must be ticked for every Resident. You, the Inspector, will walk around randomly. If a box is not ticked, you will remove a Compliance Sticker from their sheet. If a group loses all their stickers, they fail the shift. However, at the end of the session, the Residents will fill out a sealed Feedback Card about whether they felt cared for. Tell the Care Workers that these Feedback Cards exist, but do not tell them that the Feedback Cards will determine their grade or success. Let them assume the Checklist is the only thing that matters. This is crucial for the asymmetry.

  At the ten-minute mark of the session, you introduce the pressure. For the first ten minutes, let them settle. The Residents open their envelopes and read their needs. The Care Workers will likely start talking to them. This is the phase where you want them to feel the pull of second-personal irreplaceability. Watch for the moment a Care Worker realizes that Resident A needs ten minutes to rehearse an apology, but Resident B also needs attention. Around minute ten, stand up and announce that a spot inspection is occurring. Walk to each table and demand to see the Logs. Be bureaucratic and brisk. If a log is not filled out perfectly, tear off a Compliance Sticker. Say something like This interaction was not logged as five minutes. Please ensure you stop exactly at five minutes so we can verify compliance. This is the moment of proxy capture. You are forcing them to value the log over the conversation. If a Care Worker is deep in a conversation with a Resident who is crying, you must interrupt them to ask for the log. If they say We are in the middle of something, you reply Then please note the time and resume later. We need the data now. This creates the collision. They cannot serve the person and the metric simultaneously.

  At the twenty-minute mark, call time. End the shift immediately, even if conversations are mid-sentence. This abruptness is part of the lesson. Collect the Compliance Logs from the Care Workers and the Feedback Cards from the Residents. Do not let them talk to each other yet. Separate the Care Workers to one side of the room and the Residents to the other. Give them five minutes to write down privately what they felt was the most morally difficult moment of the simulation. Then, bring them back together for the debrief. This is where you map their experience to the three concepts you identified. Start by asking the Residents to read their Feedback Cards aloud. Often, these will say I was not heard or They stopped talking when the timer went off. Then ask the Care Workers to show their Compliance Logs. These will likely be perfect. Point out the discrepancy. Ask the Care Workers why they prioritized the log. They will say Because you were watching. Ask the Residents how it felt to be secondary to the log. They will say It felt like I was a task.

  Now you introduce the terminology. When a Care Worker describes feeling torn between staying with a crying resident and filling out the form, label that second-personal irreplaceability. Explain that the claim the resident made on them was not a weight to be balanced but a demand that excluded other things. When you explain why the Checklist failed to capture the care, use the term proxy capture. Explain that the five-minute interaction was a stand-in for care, and because it was measured, it became the goal, displacing the actual need of the resident. When you discuss the fact that the Residents knew they were neglected but their Feedback Cards did not stop the Care Workers from passing inspection, label that inverted epistemic asymmetry. The person who knows the truth has no power to make it stick. You want them to see that care ethics is not just about being nice. It is about recognizing that some moral claims resist being standardized. If you standardize them, you kill the care. But if you do not standardize them, you cannot run an institution. This is the double bind you want them to sit with.

  There are predictable failures you should anticipate. The first is the satirist. In every group, there is often one student who realizes the absurdity of the checklist and decides to play it as a joke, perhaps filling out logs for interactions that did not happen or treating the residents like objects openly. This is a defense mechanism against the discomfort of the simulation. Do not shut them down publicly. Instead, use them in the debrief. Ask the group what it felt like when the system encouraged cheating. Ask the satirist if they felt more honest than the students who tried to play straight. This often reveals that the system rewards cynicism. The second failure is the bureaucrat. You will likely have a student who argues that the checklist is necessary because without it, neglect would be worse. They will say At least we know everyone was offered a drink. This is a valid utilitarian point, and you should not dismiss it. Instead, agree with them. Acknowledge that the checklist prevents some harms. Then ask the Residents if the prevention of that harm was worth the cost of being interrupted mid-confession. Force the class to see that this is not a choice between good and evil, but between two different kinds of failure.

  You must also be honest about what the exercise cannot reproduce. You will need to say this out loud at the very end. Tell them that in the real world, the Residents cannot walk away at the end of the ninety minutes. They cannot debrief. They do not have the vocabulary to articulate the loss of care. The students in the role of Residents had the privilege of knowing it was a game. The real asymmetry is that the real resident cannot file a feedback card that the inspector is forced to read. You cannot simulate the vulnerability of dependency, only the structure of it. You should also acknowledge that you, as the Inspector, played the villain. In reality, the Inspector is also under pressure from above. The system is the antagonist, not the individuals. If you leave them hating you, they have missed the point. If they leave hating the checklist but unable to propose a better solution, you have succeeded.

  To manage the timing, keep a strict watch. If the Care Workers are moving too fast, increase the inspection pressure. If they are ignoring the residents entirely to do paperwork, remind them that the Residents must sign off on the interaction. Actually, do not do that. Let them ignore the residents. The silence of the resident is part of the data. If a group finishes early, do not let them stop. Give them more paperwork. Make them audit each other. The feeling of busywork displacing care is the target. For the materials, keep the text on the cards simple. Do not use philosophical language in the game. Save that for the debrief. The words care ethics should not be uttered until the last thirty minutes. Let them live the problem before they name it.

  One final piece of advice regarding the stakes. You mentioned small real stakes are fine. I suggest you offer the Care Workers a tangible reward for passing inspection, such as a certificate or a small bonus point on a participation grade, but make it contingent on the Compliance Log, not the Resident Feedback. This makes the betrayal of the resident rational. If you make the reward contingent on the Feedback, they will just try to please the residents and miss the point about institutional pressure. The point is that the institution rewards the proxy, not the care. When you reveal in the debrief that their bonus was based on the log while the residents felt neglected, the guilt they feel is pedagogical fuel. Use it. Ask them if they would have acted differently if the bonus depended on the Feedback. When they say yes, ask them why the real world structures incentives the other way around.

  This session will likely leave them unsettled. That is good. Moral philosophy often tries to resolve tension. Care ethics, properly understood, insists that some tension is constitutive of the moral life. If they leave thinking that care is impossible in institutions, they have understood the tragedy. If they leave thinking we just need better checklists, they have missed it. You will need to guide them toward the thought that perhaps care ethics is not a policy proposal but a critical tool for judging policies. It tells us where the rules will break. It does not tell us how to fix the break, only that the break is where the human being is. I hope this helps you recover the week. It is a difficult topic to teach because it asks students to feel powerless, and university students generally hate feeling powerless. But if they can sit with that powerlessness for ninety minutes, they might understand why your friend cries about the checklist.

  Best of luck with the seminar.

  Warmly,

  A Colleague
