answer: |-
  ### Candidate Sketches

  1.  **The Signal-Weaving Arachnid:** A spider species that leaves specific silk patterns to indicate prey quality for conspecifics. *Reject:* Too difficult to distinguish from innate pheromone signaling (Darwinian) without smuggling in complex intentionality.
  2.  **The Cache-Mapping Corvid:** Birds that move stones to mark food locations, refining the code over generations. *Reject:* Corvids are already strong candidates for Popperian minds; proving a lack of internal simulation would be implausible.
  3.  **The Stick-Stacking Rodent:** A social rodent using arranged sticks to mark safe paths through toxic terrain. *Select:* Clear external artifacts, high cost of error (testing Popperian limits), and plausible social transmission without requiring high-level individual intelligence.

  ### Species Design: *Arenamys navigans*

  *Arenamys navigans* inhabits a shifting dune ecosystem laced with invisible, lethal sinkholes. Survival depends on navigating stable crusts that change weekly. Elders place dry sticks in specific geometric arrangements at tunnel exits; these arrangements encode safe vectors based on collective exploration. Juveniles do not test the ground themselves but memorize the stick geometries during a critical developmental window, treating the arrangements as authoritative maps. The stick codes are cumulatively refined over generations—ineffective patterns are abandoned when colonies perish, while successful geometries are copied and modified by surviving neighbors, constituting a non-genetic, externalized memory system that expands the individual's discriminatory power beyond its sensory reach.

  When the stick arrangements are secretly scrambled by an experimenter, *Arenamys* individuals follow the false vectors without hesitation or internal conflict. They do not simulate the outcome ("If I go left, the crust might break") nor do they exhibit error-correction behaviors prior to stepping; they walk until the crust fails, paying for the error with injury or death rather than a discarded belief. This resists Skinnerian explanation because the specific geometry is arbitrary and socially transmitted rather than individually reinforced; a naive individual raised without exposure to the sticks cannot learn the code through operant conditioning alone, as the lethality of the terrain prevents the necessary trial-and-error learning within a single lifespan.

  ### Audit

  **Gregorian Satisfaction:** The species satisfies the Gregorian criterion by utilizing **externalized informational artifacts** (the stick geometries) that are cumulatively refined by ancestors and conspecifics. The cognitive work of mapping the toxic terrain is offloaded into the environment, allowing individuals to discriminate safe paths they could not detect biologically.

  **Popperian Failure:** The species fails the Popperian test because it lacks **internal hypothesis testing**. A Popperian creature lets its hypotheses die in its stead; *Arenamys* lets its *bodies* die in the hypotheses' stead. When the artifact's data is violated, the creature does not update an internal model of the terrain; it simply executes the command until physical reality halts it.

  **Key Design Feature:** The **lethality of the environment** combined with **social transmission**. This forces reliance on the external tool because individual trial-and-error (Skinnerian) is fatal, yet the tool usage is ritualized rather than simulated.

  **Verdict Change:** If the lethality feature is removed (safe terrain), the creatures could learn paths individually via operant conditioning. The design would collapse into a Skinnerian account, as the external tools would become unnecessary crutches rather than essential cognitive prosthetics.

  **Strict Nesting Reply:** A defender of strict nesting would argue that **symbol utilization requires semantics**: to treat a stick arrangement as a "map" implies an internal understanding of representation, which necessitates a Popperian model of how the map relates to the territory. They would claim the creature must simulate the *relation* between stick and ground to use the tool at all.

  **Judgment:** This reply **fails**. It conflates the system's intelligence with the individual's. The "semantics" are cached in the evolutionary history of the colony and the physical structure of the tool, not the individual's head. The individual operates as a Skinnerian agent within a Gregorian niche; the cumulative intelligence is in the *culture*, not the *cortex*. Therefore, the Gregorian rung does not strictly require the Popperian rung at the individual level, challenging the cumulativity of the taxonomy.
