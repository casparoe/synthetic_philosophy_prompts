      *   *Missed Distinction:* The distinction between **procedural rationality** (how you choose) and **substantive rationality** (what you want). Also, the distinction between **risk** and **irrationality**.

  9.  **Final Polish:** Check against constraints.
      *   Adjudicate move by move? Yes.
