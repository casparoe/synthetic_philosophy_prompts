answer: |-
  # Session Plan: The Colony Protocol

  ## One: The Artefact

  **Materials Needed:**
  *   **Two Tables:** Arranged so 7 students can sit around each (3 per long side, 1 at each head, 1 floating/observer if needed).
  *   **The Grid:** 2 printed mats per table, each divided into a 6x6 grid (36 squares).
  *   **The Tiles:** 72 double-sided tokens per table (spares included).
      *   Side A: **Solid Black Circle**.
      *   Side B: **Solid White Square**.
  *   **Rule Cards:** 7 per table (one per "Ant").
  *   **Reader Keys:** 2 per table (kept hidden until the end).
  *   **Wager Counters:** 20 plastic chips per student.
  *   **Input Envelopes:** Sealed envelopes containing the "Initial State" instructions for the Instructor.

  ### The Rule Cards (Print on cardstock, cut, shuffle, deal one per Ant)
  *Note: "Neighbors" refers to the tiles immediately North, South, East, West of your current position. Diagonal does not count. If you are on an edge, ignore missing neighbors.*

  *   **Card Type A (The Follower):** Look at your **Left** and **Right** neighbors. If **both** match each other (both Black or both White) and **differ** from your tile, flip your tile to match them. Otherwise, do nothing.
  *   **Card Type B (The Contrarian):** Look at your **Up** and **Down** neighbors. If **both** match your tile, flip your tile. Otherwise, do nothing.
  *   **Card Type C (The Stabilizer):** Look at all available neighbors (up to 4). Count the Black tiles. If Black > White, ensure your tile is Black. If White > Black, ensure your tile is White. If Tie, do nothing.
  *   *(Deal a mix: 3 Type A, 2 Type B, 2 Type C per colony. Do not tell students the distribution.)*

  ### The Reader Keys (Keep separate. Hand to Reader only at end of round)
  *   **Key 1 (The Counter):** Count the total number of Black Circles.
      *   0–17 Blacks: Message = **"FALSE"**
      *   18 Blacks: Message = **"NULL"**
      *   19–36 Blacks: Message = **"TRUE"**
  *   **Key 2 (The Scanner):** Scan the rows from Top to Bottom. Find the first row that is **all one color**.
      *   First solid row is Black: Message = **"STOP"**
      *   First solid row is White: Message = **"GO"**
      *   No solid rows: Message = **"WAIT"**

  ### The Trace (Instructor Reference Only)
  *To verify the system works before class.*
  *   **Setup:** 6x6 Grid. Center 4x4 area is Black. Outer ring is White. (20 Black, 16 White).
  *   **Ant at (3,3) [Center]:** Has Type C card. Neighbors are Black. Rule: "Black > White, ensure Black." Tile stays Black.
  *   **Ant at (2,2) [Edge of center]:** Has Type A card. Left is Black, Right is Black. Self is Black. Rule: "Both match each other (Yes) and differ from you (No)." Do nothing.
  *   **Ant at (1,1) [Corner]:** Has Type C card. Neighbors (Right, Down) are White. Rule: "White > Black, ensure White." Tile stays White.
  *   **Propagation:** Over 5 minutes of simultaneous updates, the Type C cards will tend to expand the majority color. The Type A cards smooth out horizontal boundaries. The Type B cards disrupt vertical stability.
  *   **Outcome:** In a biased start (20 Black), the Black cluster usually expands to fill ~24-28 tiles.
  *   **Reader 1 Result:** "TRUE".
  *   **Reader 2 Result:** Likely "STOP" (if a solid black row forms) or "WAIT".
  *   **Note:** The system is noisy. Success is defined by the Reader recovering *a* message, not necessarily the "correct" one relative to the input, unless you rig the input. For Round 1, rig the input to guarantee a "TRUE" outcome to build confidence.

  ---

  ## Two: The Sequence of Rounds

  **Total Time:** 70 Minutes (leaving 20 for debrief).
  **Structure:** 4 Rounds x 15 mins + 10 mins transition/setup.

  **Round 1: Baseline Competence (15 mins)**
  *   **Goal:** Establish that the colony can produce a readable message.
  *   **Setup:** Instructor places the tiles. 24 Black, 12 White (scattered).
  *   **Task:** "Stabilize the board." (5 mins).
  *   **Wager:** Students bet on whether Reader will get a clear message (TRUE/FALSE/NULL).
  *   **Reveal:** Reader uses **Key 1**. (Result will likely be TRUE).
  *   **Philosophical Load:** Establishes *functional success*. The group did something no individual intended.

  **Round 2: The Shuffle (15 mins)**
  *   **Goal:** Dissociate competence from individual identity.
  *   **Action:** Collect Rule Cards. Shuffle them. Redeal to the *same* students in *different* seats.
  *   **Setup:** Instructor places tiles. 12 Black, 24 White (scattered).
  *   **Task:** "Stabilize the board."
  *   **Wager:** Students bet on the message.
  *   **Reveal:** Reader uses **Key 1**. (Result will likely be FALSE).
  *   **Philosophical Load:** The *organization* produced the result, not the specific people. If the colony "believes" FALSE, it is not because of specific students.
  *   **Judgement:** **Load-bearing.** Essential for the "System vs. Individual" argument.

  **Round 3: The Lesion (15 mins)**
  *   **Goal:** Test localization of function.
  *   **Action:** Instructor secretly identifies the two students whose rules fired most often in Round 2 (observe the table). Tap them on the shoulder. They must fold their arms and stop participating. Their tiles are frozen.
  *   **Setup:** Random start (18 Black, 18 White).
  *   **Task:** "Stabilize the board."
  *   **Wager:** Students bet on success.
  *   **Reveal:** Reader uses **Key 1**. (Result will likely be NULL/Tie).
  *   **Judgement:** **Cuttable.** If time runs short, skip this. It reinforces "distributed function," but Round 2 does most of that work. It risks feeling like punishment rather than experiment.

  **Round 4: The Ambiguity (15 mins)**
  *   **Goal:** Challenge determinacy of content.
  *   **Action:** Instructor manually sets the final board state *before* the students sit down. (See Section Three). Students are told: "The colony has already finished. You are the observers."
  *   **Task:** Observe the board.
  *   **Reveal:** Reader A uses **Key 1**. Reader B uses **Key 2**.
  *   **Judgement:** **Load-bearing.** This is the climax of the session.

  **Autobiography Round:** **Cut.**
  *   *Reasoning:* It requires linguistic output from the "ants," which breaks the "no speaking/no high-level representation" immersion. It turns the exercise into a creative writing task. The phenomenological point is better made in the debrief by asking them to recall their *felt experience* during Round 1.

  ---

  ## Three: The Ambiguity Round (Design)

  **The Setup:**
  Do not let the students play this round. You, the Instructor, arrange the 6x6 grid manually while they watch or during a break.

  **The Configuration:**
  Create a **Diagonal Split**.
  *   Tiles (1,1) to (6,6) on the main diagonal are **Black**.
  *   All tiles *above* the diagonal are **White**.
  *   All tiles *below* the diagonal are **White**.
  *   *Wait, that's not ambiguous enough.*
  *   **Revised Configuration:** **The Checkerboard Cluster.**
      *   Rows 1, 3, 5 are all **Black**.
      *   Rows 2, 4, 6 are all **White**.
      *   Total Count: 18 Black, 18 White.

  **The Readers:**
  *   **Reader A (The Aggregator):** Receives **Key 1** (Count Total).
      *   Observation: 18 Black, 18 White.
      *   Output: **"NULL"** (No belief).
  *   **Reader B (The Structuralist):** Receives **Key 2** (Row Scan).
      *   Observation: Row 1 is Solid Black.
      *   Output: **"STOP"** (Positive belief).

  **The Confrontation:**
  1.  Reader A announces: "The colony says NULL."
  2.  Reader B announces: "The colony says STOP."
  3.  **Instructor Question:** "Did the colony contradict itself? Did one reader lie? Or did the colony say nothing until you asked?"
  4.  **Constraint:** Students cannot appeal to the "real" meaning. There is no Key 3. They must decide if the *physical state* determines the meaning.

  **Why this works:** Both keys were provided by you (the designer). Both readings are rule-following. The physical state is identical. The "belief" changes based on the *interpretive lens* of the reader, yet the lens was part of the system's design.

  ---

  ## Four: The Debrief Mapping (20 Minutes)

  **Do not use the forbidden words until the very end.**

  **1. Intelligence (Getting it right)**
  *   *Moment:* Round 1 Success.
  *   *Discussion:* "The colony got the answer 'TRUE'. Did any of you know the answer was 'TRUE' while you were playing?" (No). "So where was the knowledge?"
  *   *Concept:* **Distributed Cognition.** The system is intelligent even if the parts are not.

  **2. Aboutness (Intentionality)**
  *   *Moment:* Round 2 (Shuffle).
  *   *Discussion:* "We swapped your rules. You are different people in different seats. The colony still produced 'FALSE'. Was the belief in *you*, or in the *chairs*?"
  *   *Concept:* **Multiple Realizability.** The belief is a property of the organization, not the substrate.

  **3. Phenomenology (What it is like)**
  *   *Moment:* Reflection on Rule Cards.
  *   *Discussion:* "When you flipped your tile, did you feel like you were part of a sentence? Or did you just feel like you were following a rule about neighbors?"
  *   *Move:* "If you didn't feel like the colony, but the colony spoke... is there something it is like to be the colony? Or is 'being the colony' just a description we use from the outside?"
  *   *Concept:* **The Explanatory Gap / Phenomenal Consciousness.**

  **4. Determinacy (Fact of the matter)**
  *   *Moment:* Round 4 (Two Readers).
  *   *Discussion:* "Key 1 said NULL. Key 2 said STOP. The board didn't change. Which one is what the colony *really* meant?"
  *   *Uncomfortable Move:* "If you cannot tell the difference between a colony that means NULL and a colony that means STOP, is there a fact of the matter about what it means?"
  *   *Concept:* **Indeterminacy of Interpretation.**

  **The Reveal:**
  *   Now you may say: *Gödel, Escher, Bach*. Hofstadter. Ants.
  *   Now you may say: *Holism, Reductionism, Supervenience.*
  *   **Final Point:** "You just spent 70 minutes being a mind you couldn't feel. How do you know you aren't one right now?"

  ---

  ## Five: Honesty About the Ceiling (Failure Modes)

  **1. The Strong Student (The "God Ant")**
  *   *Risk:* A student realizes the global pattern and tries to direct others.
  *   *Fix:* The "Environment Auditors" (the 3 extra students). Their only job is to tap the table if anyone speaks or gestures globally. If a "God Ant" emerges, freeze their tile for 30 seconds as a "system error."
  *   *Debrief:* Use this. "When X tried to control the group, the system slowed down. Central control is inefficient for this architecture."

  **2. The Nihilist Drift ("It's all interpretation")**
  *   *Risk:* Students decide the messages are meaningless so the puzzle doesn't matter.
  *   *Fix:* The Wager. Use plastic counters. If they treat it as meaningless, they lose their chips. Create pragmatic stakes. "You don't have to believe it's real, but you have to bet on what the Reader says."

  **3. The Lesion as Punishment**
  *   *Risk:* Students feel targeted when frozen.
  *   *Fix:* Frame it medically. "System malfunction in sector 4." Do not make eye contact with the frozen students. Treat them as broken hardware.

  **4. Time Overrun**
  *   *Risk:* Rounds take 20 mins instead of 15.
  *   *Fix:* **Cut Round 3 (Lesion).** It is the least philosophically unique. Round 2 (Shuffle) and Round 4 (Ambiguity) are the essential pair.

  **5. Limitations You Must Supply**
  *   *Scale/Speed:* Acknowledge that real brains/colonies operate at speeds and scales that make the "view from nowhere" impossible for the parts.
  *   *Selection vs. Design:* Your colony was designed by *you* to have meaning. Real minds evolved. Does meaning require a designer, or just a history of success? (This is the Teleosemantics gap).
  *   *Subjectivity:* The activity proves *functional* unity. It does not prove *phenomenal* unity. You must explicitly state: "We showed the group acts like one. We did not show the group *feels* like one."

  ---

  ## Six: Exit Ticket & Variants

  ### The Exit Ticket (1 Minute)
  *Do not ask "What did you learn?"*
  **Prompt:** "A thermostat turns on the heat when the temperature drops below 20 degrees.
  1. Does the thermostat *believe* the room is cold? (Yes / No)
  2. Does the colony we built *believe* the message was TRUE? (Yes / No)
  3. What is the **one difference** between the thermostat and the colony that justifies giving different answers to 1 and 2? (One sentence)."

  *Analysis:* If they say "Complexity," they missed the point. If they say "Interpretation," they grasped Round 4. If they say "Internal State," they grasped Round 1.

  ### Variant: 40-Person Lecture
  *   **Change:** 6 Colonies of 6 students. 4 Observers.
  *   **Modification:** Run a **Competition**. Which colony stabilizes fastest?
  *   **Loss:** You lose the intimate "felt experience" of the rules. It becomes a game.
  *   **Recovery:** In the debrief, poll the room. "How many of you felt like an individual? How many felt like part of a group?" Use the aggregate data.

  ### Variant: 8-Person Reading Group
  *   **Change:** 1 Colony of 6. 1 Reader. 1 Instructor.
  *   **Modification:** **The Ghost Round.** Remove 3 ants entirely. Leave 3 chairs empty. The remaining 3 must manage 2 tiles each (Left hand, Right hand).
  *   **Loss:** The "Lesion" dynamic is inherent now; you cannot compare "whole" vs "damaged" as easily.
  *   **Recovery:** Focus heavily on the **Autobiography**. Have the 3 students write the "Colony's Diary" together. The constraint of limited view becomes more palpable with fewer agents.

  ### Design Feature That Does Not Survive
  *   **The Wager.** In the 40-person lecture, managing chips is chaotic. In the 8-person group, it feels too gamified for the intimacy.
  *   **Replacement:** In Lecture, use a show of hands for prediction. In Reading Group, use verbal commitment ("I bet my coffee on this"). The *social risk* must remain, even if the plastic chips go.
