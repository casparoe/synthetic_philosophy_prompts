          *   *Crucial Pivot:* I need to point out that standard Frankfurt cases usually assume the agent is *unaware* of the intervener. If Mara knows about the Fixer's threat, her decision is partially motivated by avoiding the Fixer's punishment. This makes it less of a pure Frankfurt case and more of a "Coercion" case.
          *   *Wait, re-reading the prompt:* "Mara knows telling her will basically destroy her [sister]... Fixer... made it very clear... if Mara so much as hesitates to tell the truth, he'll make sure it comes out anyway."
          *   *Analysis:* Mara knows the Fixer is watching. This means her "voluntary" choice is tainted by the knowledge of the threat. In a classic Frankfurt case, Jones doesn't know Black is there. Jones decides to kill based on his own reasons. Here, Mara decides to tell the truth partly to preempt the Fixer.
          *   *Implication:* This weakens the "Free Will" aspect compared to a textbook Frankfurt case. It adds psychological coercion.
