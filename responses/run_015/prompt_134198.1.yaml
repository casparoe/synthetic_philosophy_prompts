      *   **Implication:** The defense only works for Isolation. If Availability holds, it's negligence/cowardice, not ignorance.
      *   **Cases:**
          *   Jefferson: Slavery vs. Equality (Availability).
          *   Churchill: Empire vs. Anti-colonialism (Availability).
          *   Columbus: Extraction vs. Universal Rights (Isolation/Hard Case).
      *   **Self-Critique (by the author):** Worry about sliding from Availability to Isolation. Worry about treating moral knowledge like scientific discovery (theory) vs. practical reasoning (deriving conclusions).

  3.  **Drafting the Critique - Section by Section:**

      *   **1. Conceptual Coherence (The Distinction):**
          *   *Strengths:* It's a clear, useful heuristic. It forces precision. It moves the debate from "was it wrong?" to "could they have known?"
          *   *Weaknesses/Nuance:* Is it a binary? Probably not. Availability is a spectrum. Just because *someone* said it (a radical fringe) doesn't mean it was "available" in a socially intelligible way. The concept of "uptake" matters.
          *   *Terminology:* "Diachronic Moral Isolation" is slightly confusing. "Diachronic" usually means across time. Here it means "isolated *in* time." Maybe "Historical Unavailability" is clearer, but I should stick to the author's terms while noting the potential confusion. Actually, "Diachronic" here seems to refer to the *defense* (judging across time), but the *condition* is synchronic (what existed at that time). Wait, the essay defines Diachronic Moral Isolation as "concept... absent from the intellectual environment." That's actually a *synchronic* state of affairs (what existed at time T). The label "Diachronic" might be a bit off, but the *idea* is clear enough (time-bound unavailability). I should point this out gently.
          *   *Refinement:* The distinction is coherent but risks being too binary. "Availability" isn't just existence; it's *accessibility* and *plausibility*.

      *   **2. Application to Cases:**
          *   *Jefferson:* Strong case for Availability. The contradiction was noted *by him* and by contemporaries (e.g., Abigail Adams, British critics). The "science" of race was emerging but not settled.
          *   *Churchill:* Strong case for Availability. Indian independence movement was active. Labour Party critics existed. However, the *concept* of "empire is inherently immoral" vs. "empire needs reform" is tricky. Churchill might argue the *specific* judgment (total immediate withdrawal is wrong) was the debated point, not the *general* principle of self-determination.
