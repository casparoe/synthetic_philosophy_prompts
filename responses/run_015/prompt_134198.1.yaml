          *   *Critique:* The essay underestimates the "Availability" in the Columbus case. The Church *did* have a framework for universal human dignity (Imago Dei), even if "rights" language wasn't modern.

      *   **3. The Hidden Premise (Moral Learning/Science Analogy):**
          *   *The Worry:* The author asks if they treat morality like science (discovery of new facts) vs. practical reasoning (logic applied to existing facts).
          *   *Analysis:* This is the strongest philosophical point. If morality is like science (e.g., germ theory), you can't blame a doctor in 1700 for not using penicillin. If morality is like logic/math, you *can* blame them for not seeing the contradiction (Jefferson: All men equal + Slaves are men = Slavery wrong).
