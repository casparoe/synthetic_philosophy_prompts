          *   *Strategy B: Conceptual Threshold.* The *concept* existed, but the *application* was contested. (e.g., "Are indigenous people fully human?" was a live debate, not settled).
          *   *Strategy C: The "Overdemandingness" Objection.* Expecting them to be 21st-century saints ignores the social cost of dissent. It wasn't just "ignoring," it was "social suicide."

  4.  **Synthesizing and Structuring the Response:**
      *   **Introduction:** Acknowledge the strength of the draft. It's sharp and analytically useful.
      *   **Section 1: Conceptual Coherence.** Praise the binary but warn against the "Availability Spectrum." Just because a voice existed doesn't mean it was intelligible.
