      *   **Pascal's Wager (PW):**
          *   Agent: Human.
          *   Decision: Believe in God vs. Not Believe.
          *   Entity: God (omnipotent, omniscient, morally judgmental).
          *   Payoff: Infinite Reward (Heaven) vs. Infinite Punishment (Hell).
          *   Probability: Non-zero (however small).
