  The pattern in my gut
  You're drawing a bright line between public memory and private peace. Whenever an institution—town, government, family, editor—tries to sanitize the record for comfort or branding, you rebel. Cases 1, 3, 5, and 6 all scream that truth matters more than myth. You see scrubbing names or sealing archives as cheap forgiveness, a way to claim virtue without paying the cost of accountability. But you carve out a sacred space for the individual survivor in Case 2. That's your "mnemonic sovereignty": I can burn my own pain, but you can't burn the history we share. Case 4 fits here too; renaming the village feels like the editor asking you to participate in the erasure you're fighting. You sense that fiction, when it tackles real trauma, becomes a form of public memory. The wobble in Case 7 happens because it blends the two: a public exhibit impacting private descendants. You hate "narrative bankruptcy," but you also hate unnecessary cruelty. It's the only place where your demand for truth clashes with your empathy for the living. You're trying to find a way to be honest without being brutal.

  The principle, stated precisely
  Here's the rule: **Public records demand full complexity; private minds demand sovereignty.**

  Clause One: Any narrative claimed as history, memorial, or public truth (Cases 1, 3, 6) must resist sanitization. Scrubbing names, sealing archives, or hiding betrayals turns memory into propaganda. This is why the monument (1) and the reconciliation days (3) fail—they want the credit without the cost. They ask the public to remember the pain but forget the cause. Case 6 follows this too; the hero's status doesn't grant immunity from scrutiny.

  Clause Two: Individuals own their internal trauma (Case 2). A survivor burning a journal isn't erasure; it's healing. But this sovereignty stops where another's reality begins (Case 5). Parents can't lie to a child about a brother because that steals the child's right to reality.

  Applied to Case 7: The exhibit is public history. The bureaucrat's complexity (saving lives while on victim lists) is exactly the nuance history needs. Omitting him to spare descendants feelings violates Clause One. It creates a clean lie instead of a messy truth. The descendants' pain is real, but it's private grief colliding with public fact. The principle protects the record, not the reputation. To omit him is to repeat the factory owner's scrubbing in Case 1. You must publish the nuance, perhaps with context, but not omission. Complexity is the only ethical shape for public memory.

  The hard pair and the repair
  Case 6 and Case 7 are twins. In 6, you shatter a hero myth to reveal betrayal. In 7, you'd shatter a victim list to reveal complicity. If you publish the betrayal in 6, consistency demands you publish the bureaucrat's complexity in 7. A cleaner principle saves 6 at the expense of 7's comfort. You can't say "truth hurts" for the hero's family but "protect feelings" for the bureaucrat's family. The repair is to acknowledge that public truth is inherently cruel to some descendants. That's the cost of avoiding narrative bankruptcy. You don't omit the bureaucrat; you contextualize him. You let the shame land where it belongs—on the history, not the historian. Consistency means accepting that telling the truth will sometimes break hearts, but hiding it breaks the world.

  Two fresh predictions
  (a) If a government destroys records of a false accusation to "move on," your principle calls this wrong. It's Case 3 again—branding over truth. The innocent man's ruin is public history, even if the state is embarrassed. Erasing it prevents accountability and leaves the wound open.
  (b) If a survivor demands her dead abuser be named in every school textbook, your principle hesitates. Public truth matters, but relevance matters too. Naming him in a history of the town? Yes. In every textbook nationwide? That shifts from accountability to vengeance, potentially violating the educational purpose. You'd support the truth being available, but not necessarily mandated everywhere. Truth needs context, not just volume. You want the record clear, not weaponized.

  The verdict i'd have to drop
  If I'm honest, Case 4 is the weak link. Fiction isn't history. Renaming the village might actually protect the novel's ability to tell the truth without getting bogged down in libel or local backlash. You feel renaming is "doing their forgetting," but changing the name signals "this is a story about truth," not "this is a documentary." You could overturn that verdict: rename the town to save the book, but keep the fire exactly as it was. That protects the art without erasing the history.
