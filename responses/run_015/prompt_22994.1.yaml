      *   *Q3 (Brinkmanship Distinction):* Focus on the "trench coat" idea. Is this new or just Schelling?
          *   *Follow-up:* He'll say "formal distinction." Counter: "Does the formal distinction change the blood on the floor?"

      *   *Q4 (Information Asymmetry):* What if I don't know you're a commitment racer?
          *   *Follow-up:* He'll say "signaling." Counter: "Signaling costs time, races are about speed."

      *   *Q5 (Reversibility/Loopholes):* Real world commitments have loopholes.
          *   *Follow-up:* He'll say "perfect commitment is theoretical." Counter: "Then your model doesn't apply to reality."

      *   *Q6 (The "Rational" Label):* Is it actually rational or just a Nash Equilibrium that sucks?
          *   *Follow-up:* He'll say "ex-post rational." Counter: "Ex-ante it looks suicidal."

      *   *Q7 (Multi-player):* Two is easy. What about 5 nations?
          *   *Follow-up:* He'll say "coalitions." Counter: "Coalitions take time to form."

      *   *Q8 (De-escalation):* Once committed, how do you *un*-commit without looking weak?
          *   *Follow-up:* He'll say "face-saving off-ramps." Counter: "Who builds the off-ramp in a race?"

      *   *Q9 (Evolutionary Stability):* If this strategy wins, does the world become full of maniacs?
          *   *Follow-up:* He'll say "selection pressure." Counter: "Then we should see more wars, not fewer."

      *   *Q10 (Ethics/Agency):* Does this remove human agency?
          *   *Follow-up:* He'll say "descriptive not normative." Counter: "Strategy guides action, so it is normative."

