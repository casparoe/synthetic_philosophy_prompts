prompt: |-
  You are delivering the retirement toast for Dr. Elena Voss, a physician-ethicist who spent four decades defending the view that an advance directive possesses what she called narrative authority: not because the demented patient retains the earlier self’s preferences, but because the earlier self authored the life-story within which present care takes its meaning. Half the room are bioethicists and clinicians familiar with her argument that diachronic personal identity is largely irrelevant to this binding force; the other half are relatives who observe her now—living with advanced dementia, apparently serene, and occasionally resisting interventions that her directive explicitly requires. She left instructions that any summary of her career avoid both false consolation and clinical detachment. Compose a five-minute toast that explains, for the non-specialists, why she believed a signed document could obligate a person who no longer remembers writing it, without presenting her present contentment as a simple refutation of her view. For the specialists, honor the intellectual rigor of her position and explicitly acknowledge the unresolved tension between narrative authority and present welfare, but do not resolve that tension through sentiment or through a philosophical victory for either side. The toast should treat the contradiction itself—between the authority of the earlier author and the happiness of the present subject—as part of the legacy being celebrated, not as a problem for the speaker to dissolve.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** A colleague/friend delivering a retirement toast.
      *   **Honoree:** Dr. Elena Voss, physician-ethicist.
      *   **Career Focus:** 40 years defending "narrative authority" of advance directives.
      *   **Core Argument:** Directives bind not because the demented self *is* the earlier self (identity), but because the earlier self *authored the life-story* giving present care meaning. Diachronic identity is irrelevant.
      *   **Audience:** 50% Bioethicists/Clinicians (know the theory), 50% Relatives/Laypeople (see her current state).
      *   **Current Situation:** Elena has advanced dementia. She appears serene but sometimes resists interventions her directive requires.
      *   **Constraints:**
          *   Avoid false consolation (don't say "she's happy now, so it doesn't matter").
          *   Avoid clinical detachment (don't treat her as a case study).
          *   Explain the theory to laypeople simply but accurately.
          *   Honor the rigor for specialists.
          *   Acknowledge the tension (Directive vs. Present Welfare/Contentment) without resolving it.
          *   Treat the contradiction as part of the legacy, not a problem to solve.
          *   Length: Approx. 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Core Philosophical Tension:**
      *   *The Theory:* I write a script for my life. Even if I forget the script later, the performance still belongs to the story I started. The "Author" binds the "Character."
      *   *The Reality:* Elena is the "Character" now. She seems happy. Sometimes she fights the "Script" (the directive).
      *   *The Trap:* If I say "She's happy, so the directive is wrong," I betray her life's work. If I say "Follow the directive regardless of her fear," I seem cruel.
      *   *The Goal:* Hold both truths. The Author matters. The Character matters. The friction between them is the point.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the unique composition of the room (colleagues vs. family). Set the tone (warm but intellectually honest).
      *   **Explaining the Theory (for Family):** Use a metaphor. Authorship/Storytelling is the obvious choice given "narrative authority." Explain that she believed our lives are stories we start writing before we can finish them.
      *   **Addressing the Specialists:** Acknowledge the technical contribution. Diachronic identity vs. Narrative binding. Acknowledge the rigor.
      *   **Addressing the Elephant in the Room (Her Condition):** She is here. She has dementia. She is serene but sometimes resists.
      *   **The Crux (The Tension):** Do not resolve it. State that her life *enacted* her theory, even the messy parts. The conflict between the Past Elena and Present Elena is not a failure; it's the final chapter of her argument.
      *   **Closing:** A toast to the Author and the Character. To the unfinished story.

  4.  **Drafting - Refining the Tone:**
      *   *Avoid:* "She doesn't know better now." (False consolation). "We must follow the protocol." (Clinical detachment).
      *   *Include:* "This is hard." "We don't have the answer." "She taught us to live with the question."
      *   *Voice:* Respectful, slightly solemn but celebratory, intimate yet public.

  5.  **Drafting - Specific Phrasing (Iterative Process):**
      *   *Idea:* Compare the directive to a will. *Correction:* No, a will is about property. This is about the *self*. Compare it to a book.
      *   *Idea:* Mention her resistance to care. *Correction:* Be gentle. "Occasional resistance" is in the prompt. Frame it as the Character speaking back to the Author.
      *   *Idea:* How to address the specialists? "You know the literature." *Refinement:* "You know the debates on psychological continuity."
      *   *Idea:* How to address the family? "You see her smiling." *Refinement:* "You see her peace."

  6.  **Writing the Toast (Mental or Scratchpad):**
      *   Start with the room split. Half know the papers, half know the person.
      *   Explain "Narrative Authority." It's not about being the same person, it's about the story. Like a writer and a character.
      *   Bring in the current reality. She is living the argument.
      *   The tension: The Author said X. The Character feels Y.
      *   Don't solve it. Say that *holding* that tension is her gift.
      *   Raise a glass.

  7.  **Review against Constraints:**
      *   5 minutes? (Word count check: ~750 words is usually safe for 5 mins with pauses).
      *   No false consolation? (Check: Don't imply her happiness invalidates the directive).
      *   No clinical detachment? (Check: Speak of her with affection).
      *   Specialists honored? (Check: Mention diachronic identity/arguments).
      *   Tension unresolved? (Check: Explicitly state we leave it open).

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Critique:* Is the metaphor too abstract?
      *   *Fix:* Ground it in the act of writing. She wrote a script. Now she is acting it out, even if she forgot the lines.
      *   *Critique:* Is it too cold regarding her resistance?
      *   *Fix:* Acknowledge the pain of witnessing that resistance. Validate the family's experience.

  9.  **Final Word Count Check:** Aiming for roughly 750-850 words to allow for pacing and pauses.

  *(Self-Correction Note: Ensure I don't accidentally argue *for* the directive or *against* it. The prompt says "do not resolve that tension." I must remain neutral on the outcome, focusing on the value of the question itself.)*

  10. **Final Polish of the Text.** (Proceeding to generate output based on these thoughts.)
answer: |-
  Good evening.

  Looking around this room, I see a divide that Elena herself would have appreciated. On one side, her colleagues: bioethicists and clinicians who know the architecture of her arguments, the citations, the debates. On the other, her family and friends: those who know the warmth of her hand, the sound of her laugh, and who, in recent years, have watched that light change shape.

  Elena asked me to avoid two traps tonight. The first is clinical detachment—to not speak of her as a case study in her own theory. The second is false consolation—to not suggest that because she appears serene now, the hard questions she spent forty years asking no longer matter.

  So, I will speak to both halves of this room, as Elena always did.

  To her family: Elena spent her career arguing that an advance directive is not merely a medical order. It is not just a list of "do's and don'ts" for a broken body. She called it "narrative authority."

  Imagine you are writing a novel. You create a character, you set their values, you chart their arc. If, in the final chapter, the character forgets they are in a novel, does the story lose its meaning? Elena believed it did not. She argued that the person you were when you were competent is the "author" of your life's story. The person you become, if you lose your memory, is the "character" living out the final pages. Even if the character no longer remembers the plot, the author's intent still gives the ending its coherence. She believed a signed document could obligate a person who no longer remembers writing it, not because they are the *same* person, but because they are part of the *same story*.

  To her colleagues: You know the rigor of this position. You know she bypassed the deadlock of diachronic personal identity. She didn't care if the demented self was psychologically continuous with the earlier self. She cared about the integrity of the life as a whole. She argued that dignity resides in the arc, not just in the moment.

  But tonight, we cannot speak of her theory without speaking of her life. Because in these last few years, Elena has been living inside her own most difficult argument.

  We see her now. She is often serene. She finds joy in sunlight, in music, in a familiar touch. And yet, as some of you know, there are moments of resistance. There are times when the care her directive explicitly demands is met with fear, or a shake of the head, from the woman sitting before us.

  This is the tension. This is the friction.

  It would be easy to look at her present contentment and say, "The Author was wrong; listen to the Character." It would be equally easy to look at her signature on that document and say, "The Character's fear is irrelevant; honor the Author."

  Elena would not allow us either comfort.

  She understood that narrative authority is not a magic wand that dissolves the suffering of the present. She knew that upholding the life-story might sometimes mean overriding the immediate welfare of the subject. She did not believe this was a clean victory. She believed it was a necessary burden.

  To resolve this tension now, with sentiment, would be to insult her intellect. To resolve it with philosophy would be to insult her humanity.

  The contradiction standing before us—the serene woman who sometimes resists the very care she demanded—is not a refutation of her work. It is the culmination of it. She taught us that a good life is not always a comfortable one, and that a moral obligation is not always a felt one. She taught us that we can love the person in front of us *and* honor the person who is gone, even when those two loves pull in opposite directions.

  We are gathered to celebrate a retirement, but also to witness a legacy. Her legacy is not a solved equation. It is a question that she has left us to hold. How do we honor the story without silencing the subject? How do we respect the author without ignoring the character?

  She has no answer for us tonight. She has only left us the example of her own life, written boldly, and now being read in real-time, with all the ambiguity that entails.

  So, let us raise a glass.

  To Elena. To the Author who wrote the script, and to the Character who is living it. To the clarity of her mind, and to the peace of her present moment. And to all of us, who are left to hold the tension between them, without looking away.

  To Dr. Voss.
