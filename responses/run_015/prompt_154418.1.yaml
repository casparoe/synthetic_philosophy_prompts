answer: |-
  # Activity: The Tethered Map
  **Course:** Graduate Seminar in Epistemology
  **Time:** 75 Minutes
  **Participants:** 12 Students (4 groups of 3)
  **Materials:** Paper, pens, printed grids, printed instruction cards (two types), timer.

  ## Instructor Prep (Before Class)
  1.  **The Grid:** Print 4 copies of a 5x5 grid. Label bottom-left (0,0) and top-right (4,4). Mark Start at (0,0) and Target at (4,4).
  2.  **The Cards:**
      *   **Type A (True Belief):** "Route: Right, Right, Up, Up, Right, Up, Right, Up. (8 Moves)."
      *   **Type B (Knowledge):** "Route: Right, Right, Up, Up, Right, Up, Right, Up. **The Rule:** At every step, move along the axis (X or Y) where your distance to the Target is greatest."
  3.  **The Payoff:** Write on the board: *"Winning Teams assign the Losing Teams a 2-minute performance task (e.g., recite a haiku about doubt, draw the grid with non-dominant hand)."*
  4.  **The Twist:** Prepare yourself to play the "Skeptical Novice" in Phase 2.

  ---

  ## Part 1: Setup & Navigation (0:00 – 0:20)

  **0:00 – 0:05: Introduction**
  *   **Say:** "Welcome. Today is a workshop on information transmission. You will be divided into four teams. You will navigate a grid. You will then teach that navigation to me. Points are awarded for speed and robustness. Points determine who assigns the end-of-class performance task."
  *   **Do:** Divide into 4 groups of 3. Hand out Grids.
  *   **Crucial:** Hand **Type A** cards to Groups 1 & 2. Hand **Type B** cards to Groups 3 & 4.
  *   **Say:** "Do not show your cards to other groups. You have 10 minutes to verify your route reaches the Target. Go."

  **0:05 – 0:15: Phase 1 (Verification)**
  *   Circulate. Ensure everyone traces the path successfully.
  *   **Observation:** Both Type A and Type B will succeed equally well. The *outcome* is identical.
  *   **At 0:15:** "Pens down. Collect your cards. You must now teach the route to me. I am a novice. I do not trust maps easily."

  **0:15 – 0:20: Phase 2 Setup**
  *   **Say:** "One spokesperson per group. You have **60 seconds** to teach me the route. I will ask one challenge. If you convince me to take the third step, you earn 10 points. If you hesitate or contradict yourselves, 0 points."
  *   **Constraint:** This time limit prevents the Knowledge groups from over-explaining. They must prioritize the *Rule*.

  ---

  ## Part 2: The Challenge (0:20 – 0:40)

  **The Script (Repeat for all 4 groups):**
  1.  **Student:** "Okay, go Right, then Right..."
  2.  **Instructor (You):** (Stop them before the 3rd move). "Wait. Why Up? It looks like I should go Right again to stay on the bottom edge. It feels safer. Convince me to go Up."
  3.  **Group Response:**
      *   **Type A (True Belief):** "Because... the card said so?" / "We checked it earlier." / "Just trust us."
          *   **Instructor:** "But what if the card was a typo? What's the *reason*?"
          *   **Result:** They stall. They appeal to authority (the card) which you are currently challenging. **Collapse.**
      *   **Type B (Knowledge):** "Because look at the coordinates. We are at (2,0). Target is (4,4). Your X-distance is 2, Y-distance is 4. The Rule says close the largest gap. You must go Up."
          *   **Instructor:** "Oh. Even if I feel like going Right?"
          *   **Group:** "Yes, because Right violates the optimization rule."
          *   **Result:** They appeal to the structure. **Repair.**

  **0:35 – 0:40: Scoring**
  *   Tally points on the board.
  *   Type B groups should have high scores. Type A groups should be low.
  *   **Say:** "Type B teams, you win. You may assign the performance task to Type A teams. But first, let's discuss why this happened."

  ---

  ## Part 3: The Debrief (0:40 – 1:15)

  **0:40 – 0:50: Phenomenology of the Collapse**
  *   **Ask Type A:** "When I challenged step 3, what happened internally?"
      *   *Expected:* "We panicked." "We couldn't find a reason." "We realized we were just holding a piece of paper."
  *   **Ask Type B:** "What did you do differently?"
      *   *Expected:* "We didn't look at the steps, we looked at the grid." "We derived the step."
  *   **Point:** Both groups had *True Belief*. Both groups arrived at the Target. In Phase 1, the value was identical. The value gap only opened in Phase 2 (the context of challenge/teaching).

  **0:50 – 1:00: Mapping to Plato (The Reveal)**
  *   **Write on Board:** *Meno* 97-98.
  *   **Say:** "Plato calls your Type A cards 'True Opinion' (or True Belief). He calls Type B 'Knowledge' (Episteme)."
  *   **The Statues of Daedalus:** "Plato says true beliefs are like the statues of Daedalus. They are beautiful and valuable, but if you don't tie them down, they run away. In Phase 1, the statue was in the room. In Phase 2, I opened the door, and the statue ran away."
  *   **The Tether:** "What was the tether?"
      *   *Class:* "The Rule."
  *   **Say:** "Plato calls this *aitias logismos*—the reasoning of the cause. Knowledge isn't just having the right answer; it's possessing the causal account that *makes* the answer right. That is why Knowledge is more valuable: it is stable under pressure."

  **1:00 – 1:10: Addressing the Glitches (Frankness)**
  *   **The Over-Explanation Risk:** "Did any Knowledge group feel they ran out of time trying to explain the rule?"
      *   *Acknowledge:* "This is a real cost. Knowledge is cognitively expensive. If you just need to walk the path once alone, True Belief is more efficient. Knowledge has overhead."
  *   **The False Lemma Problem:** "Imagine I gave Group B a rule that *worked* for this grid but was actually false (e.g., 'Always move Up on prime turns'). You would have succeeded, but you wouldn't have Knowledge. You would have lucky True Belief with a fake tether. This game assumes the rule is true. In the real world, verifying the tether is the hard part."
  *   **Context Dependence:** "If I never challenged you, would Knowledge be better?"
      *   *Discuss:* "Pragmatically, no. If no one ever asks 'Why?', the tether adds no instrumental value. The value of knowledge is modal—it's about what happens in *nearby possible worlds* where things go wrong."

  **1:10 – 1:15: Closing & Task**
  *   **Say:** "We stop here. We haven't solved the Value Problem—sometimes tethers break, sometimes they cost too much. But you have felt the difference between holding a map and understanding the terrain."
  *   **Action:** Winning teams assign the silly task (e.g., "Recite a haiku about being wrong").
  *   **Dismiss.**

  ---

  ## Instructor Notes for Success

  1.  **Managing the "Over-Explain":** If a Knowledge group starts deriving the math from scratch during the 60-second teaching phase, interrupt gently: "I'm a novice, I need the *principle*, not the proof." This forces them to articulate the *logos* without getting bogged down, simulating the need for communicable justification.
  2.  **Managing the "Collapse":** If a True Belief group tries to bluff ("Just trust the data!"), press harder: "I don't trust data I can't verify. Give me a reason." Make them feel the epistemic anxiety.
  3.  **The "False Rule" Warning:** In the debrief, be sure to emphasize that in the real world, we often *think* we have a rule (Type B) but the rule is flawed. This game is sanitized; the real world is not. This prevents them from thinking Knowledge is infallible.
  4.  **No Jargon Early:** Do not use words like "justification," "reliabilism," or "Meno" until the 40-minute mark. Let them use their own words ("backing," "reason," "panic") first.
