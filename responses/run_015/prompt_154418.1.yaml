      *   *TB Card:* "1. Right, 2. Right, 3. Up, 4. Up..."
      *   *K Card:* "1. Right, 2. Right, 3. Up, 4. Up... RULE: Always move along the axis furthest from the target."
      *   *Debrief Script:* Carefully map the experience to *Meno* 97-98.

  10. **Review against Constraints:**
      *   No "Meno" until debrief? Check.
      *   Paper/Pen only? Check.
      *   Non-monetary payoff? Check.
      *   Address limitations? Check.
      *   Handle over-explaining? Check (Time limit).

  11. **Final Polish:** Ensure the tone is appropriate for grad students (intellectual but playful). Make sure the instructions for the instructor (the user) are clear so they can run it smoothly. (Self-Correction: Make sure the "Silly Task" is defined early so they care about points).

      *   *Silly Task Idea:* Reciting a limerick, drawing a map with non-dominant hand, or singing the route. Let's go with "The Laureate's Burden": The losing team must compose and recite a 4-line haiku about epistemic humility.

      *   *Timing Check:* 75 mins is tight.
          *   0-5: Setup.
          *   5-20: Phase 1.
          *   20-40: Phase 2.
          *   40-45: Scoring.
          *   45-75: Debrief.
      *   *Adjustment:* Phase 1 needs to be fast. The grid should be small. 4x4.
      *   *Grouping:* 12 students = 4 groups of 3. Two TB, Two K.

      *   *The "Contradiction":* I need to be specific. I will challenge the *third* move for everyone.
      *   *TB:* "Why move Up?" "Card says so." "What if I think Right is better?" "Don't know." -> Collapse.
      *   *K:* "Why move Up?" "Rule says furthest axis." "What if I think Right is better?" "Then you violate the rule and increase distance." -> Repair.

      *   *Debrief Nuance:* Ensure I mention that K groups might fail if the rule is *actually* wrong (Gettier-style or false lemma), but in this closed system, the rule is axiomatic. Also, if we never taught anyone, TB would have worked fine (pragmatic encroachment/context).

      *   *Over-explaining mitigation:* Give them a "Teaching Token." They have 1 minute to teach. If they haven't convinced me by then, they lose the point.

