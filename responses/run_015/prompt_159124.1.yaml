          3.  **Deflection:** The blame functions to obscure the agent's own shared responsibility (Case 6).

  4.  **Addressing the Nature of Standing (Case 3):**

      *   Case 3: Secret hypocrisy. Blame is defective, but student can't complain.
      *   *Implication:* Standing is a condition on the **propriety of the act of blaming**, not on the **truth of the blame** or the **target's right to reject it**. It's a "moral permission" condition. If you lack standing, you shouldn't blame, even if the target deserves blame. The target's inability to complain in Case 3 is because they lack the *epistemic access* to the defect, not because the defect doesn't exist.
      *   *Refinement:* Standing is a **second-order normative status**. It concerns the *right to hold accountable*, not the *fact of accountability*.

