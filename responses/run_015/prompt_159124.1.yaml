answer: |-
  Here is a proposal for the standing condition based on your cases, designed to support your argument about institutional blame.

  ### 1. The Principle: The Condition of Non-Arbitrary Authority

  An agent $A$ lacks standing to blame agent $B$ for a violation of norm $N$ if $A$'s own agency manifests a practical indifference to $N$ that renders $A$'s blame **arbitrary** rather than **authoritative**. This condition is met through two clauses:

  *   **Clause 1 (Personal Consistency):** $A$ lacks standing if $A$ is currently in violation of the *specific role-obligation* corresponding to $N$, unless that violation is historical and resolved.
      *   *Motivation:* This carries your verdicts in **Case 1** (Chair violates same admin duty), **Case 2** (Past violation resolved), and **Case 8** (Counterfactual violation is not actual). It explains why **Case 4** retains standing: neglecting a brother and neglecting a mother are distinct *specific role-obligations* (sibling-duty vs. filial-duty), even if they share a general virtue (care).
  *   **Clause 2 (Enforcement Integrity):** $A$ lacks standing if $A$ has selectively enforced $N$ within their sphere of influence, or if $A$'s structural position enabled violations of $N$ that $A$ now punishes in subordinates.
      *   *Motivation:* This carries your verdicts in **Case 5** (Silence on collaborator makes enforcement against junior selective/arbitrary), **Case 6** (Blame used to deflect joint responsibility), and **Case 7** (Structural incentives created the violation; blaming the postdoc is enforcing a norm the Head undermined).

  ### 2. The Nature of Standing: Propriety of Issuance

  Standing is a condition on the **propriety of the act of blaming**, not on the **truth of the blame** or the **warrant of the target's guilt**.

  *   **Handling Case 3:** In the secret padding case, the senior scholar's blame is *defective* (she lacks standing per Clause 1) because her agency contradicts the norm she invokes. However, the *student* has no grounds to complain because standing is a constraint on the *blamer's permission*, not a right possessed by the *blamee*. The student cannot invoke the blamer's hypocrisy because the student lacks epistemic access to the defect. The defect exists objectively (the act is improper), but the *recourse* is blocked epistemically. This distinguishes standing from a simple "tu quoque" defense; the blame is morally "infected" regardless of whether the infection is detected.

  ### 3. The Grain of the Norm: Specific Role-Obligation

  To determine if a blamer's violation is "the same" as the blamee's (for Clause 1), we do not look at the abstract virtue (e.g., "Honesty" or "Care") but at the **Specific Role-Obligation** governing the relationship.

  *   **Application to Case 1:** The Chair and Colleague are bound by the same *administrative role-obligation* (meeting department deadlines). The violation is identical in grain. Standing lost.
  *   **Application to Case 4:** The Sister is bound by a *sibling-obligation*; the Neighbor is bound by a *filial-obligation*. While both fall under "care," the specific duties are distinct. Violating one does not prove indifference to the specific duty invoked in the other. Standing intact.
  *   **Application to Case 7:** The Lab Head's obligation is *Maintenance of Integrity*; the Postdoc's obligation is *Practice of Integrity*. These are different grains, *but* Clause 2 (Enforcement Integrity) captures this. By structuring incentives that made violation predictable, the Head violated the *Maintenance* obligation. Blaming the Postdoc for the *Practice* violation is arbitrary because the Head made the violation inevitable. Standing lost (or severely diminished).

  ### 4. The Institutional Case (Case 9)

  **Verdict:** The University lacks standing.

  **Reasoning:** Institutions require a separate clause because they possess **Corporate Standing**, which is not merely the sum of individual standing. An institution speaks in the voice of a "Community."
  *   **The Institutional Clause:** An institution lacks standing to blame for violation of value $V$ if its *constitutive policies* systematically undermine $V$ or the community required to sustain $V$, even if no individual officer is personally guilty of violating $V$.
  *   **Application:** In Case 9, the University invokes "shared commitment to honest work." However, by paying poverty wages, it treats a segment of its workforce as disposable, fracturing the "community" it claims to represent. The blame becomes an assertion of power by a fractured entity, not a normative appeal by a community.
  *   **Individual vs. Institution:** This supports your claim that institutions need extra machinery. An individual officer might have clean hands (never underpaid anyone personally), but the *institution* lacks standing because its *policy* contradicts its *professed value*. The defect is in the corporate agency, not the individual agents.

  ### 5. Verdicts on New Cases

  1.  **Recovering Addict (Relapsed Last Week):**
      *   **Verdict:** No Standing.
      *   **Reasoning:** Clause 1 (Personal Consistency). The violation is current and active. The "recovering" status is irrelevant if the breach is fresh; the agency is currently set against the norm.
  2.  **Motivated Reasoning (Believes She Never Did It):**
      *   **Verdict:** No Standing.
      *   **Reasoning:** Standing tracks *objective agency*, not *subjective belief*. If she actually did the thing, her agency manifests indifference to the norm, regardless of her self-deception. To grant standing here would privilege ignorance of one's own hypocrisy.
  3.  **Open Admission ("I did it too, but..."):**
      *   **Verdict:** Standing Compromised, but Deflection Avoided.
      *   **Reasoning:** Clause 1 is still triggered (she violated the norm), so strictly speaking, she lacks the *authority* to blame. However, by admitting it, she removes the *deceptiveness* of the blame. It transforms the speech act from "Authoritative Blame" to "Solidarity Warning." It is no longer hypocritical in the deflection sense (Case 6), but it remains an assertion of authority she does not possess.

  ### 6. Limitations and Conflicts

  **The Verdict I Cannot Accommodate:**
  My principle struggles to fully justify your intuition in **Case 4** without appealing to social convention.
  *   **The Conflict:** A strict reading of "Normative Commitment" suggests that cruel neglect of a brother reveals a character flaw (indifference to care) that *should* undermine standing to blame for neglect of a mother. If standing is about *moral authority*, a cruel sister seems to lack the moral weight to blame a cruel son.
  *   **The Counter-Argument:** Someone wanting to keep your verdict (Standing Intact) but reject my "Specific Role-Obligation" rule would argue that standing is **Compartmentalized**. They would say we grant standing in Case 4 because we treat familial roles as siloed moral domains.
  *   **My Concession:** If you want to argue that Case 4 *should* be "No Standing" (because neglect is neglect), my principle supports that easily by broadening the grain to "General Duty of Care." But since your verdict is "Standing Intact," I must rely on the **Specific Role-Obligation** distinction. If you find that distinction too thin, the principle must be adjusted to allow for **Moral Siloing**, which risks making standing too easy to retain (e.g., "I lie in business, but I have standing to blame you for lying in marriage").

  **The Institutional Tension:**
  My principle asserts institutions need a separate clause. If your chapter argues that institutional standing is *reducible* to individual standing, my principle contradicts you. However, if your chapter argues (as you hinted) that institutions can lack standing *even when individuals don't*, my **Corporate Standing** clause is necessary machinery. Without it, Case 9 becomes a sum of individual verdicts (where many individuals might have standing), failing to capture the *structural* hypocrisy of the institution itself.

  ### Summary for Your Chapter
  You can frame this as a shift from **Moral Purity** (have you sinned?) to **Normative Authority** (are you positioned to speak for this norm?).
  *   **Individuals** lose authority through specific breach or selective enforcement.
  *   **Institutions** lose authority through policy incoherence that fractures the community they claim to represent.
  *   **Standing** is a constraint on the *blamer's right to speak*, not the *truth of the speech*, which solves the "secret hypocrisy" puzzle (Case 3).
