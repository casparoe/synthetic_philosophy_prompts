prompt: |-
  I'm taking an Indian philosophy course right now and I keep getting stuck on this one point in the pramana chapter, and I'd really like someone to just walk me through it properly instead of handing me the textbook summary. So: the early Nyaya lists four pramanas — pratyaksha, anumana, upamana, sabda — and arthapatti (postulation) is not one of them, because the Nyayins insist that every arthapatti case is really just anumana in disguise. But then they keep hammering the textbook Devadatta case: he's fat, he doesn't eat during the day, so he must be eating at night — which is presented as the paradigm example of arthapatti. And that's where my brain just goes. If it's just inference, then fine, lay out the actual inference.

  What's the sadya, the thing to be proved? What's the hetu or limga, the mark or ground? And crucially, what's the vyapti, the invarable connection, that's supposed to license the conclusion? Because I can't see how "being fat and not eating by day" has an invariable concomitance with "eating at night" the way smoke has one with fire. I suspect the whole move is really inference-to-the-best-explanation wearing a Nyaya costume, and I feel like that's exactly where the Mimamsakas grab hold to defend arthapatti as genuinely distinct. Can you actually do the reduction step by step, and then tell me where it feels forced?
