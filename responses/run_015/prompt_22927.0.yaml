answer: |-
  You have hit the exact nerve center of the Nyaya-Mimamsa debate. Your intuition is spot on: this *is* essentially Inference to the Best Explanation (IBE) trying to squeeze itself into a Deductive Inference (*Anumana*) mold. The Nyayins want ontological parsimony (don't multiply *pramanas* without necessity), while the Mimamsakas want phenomenological accuracy (describe the cognitive event as it actually happens).

  Let's do exactly what you asked. Let's force the Devadatta case into the Nyaya *Anumana* structure, identify the components, and then look at where the joints creak.

  ### 1. The Nyaya Reduction: Fitting Devadatta into *Anumana*

  For Nyaya, all inference relies on a universal concomitance (*vyapti*) between a reason (*hetu*) and a thing-to-be-proved (*sadhya*). To reduce *Arthapatti* to *Anumana*, they must construct a syllogism for the Devadatta case.

  Here is the reconstruction the Nyayins propose:

  *   **Paksha (Subject):** Devadatta.
  *   **Sadhya (Probandum / Thing to be proved):** Eating at night (*ratrau bhojanatva*).
  *   **Hetu (Reason / Mark):** This is where it gets tricky. It cannot be just "fatness" (because some fat people eat during the day). It cannot be just "not eating during the day" (because some people who don't eat during the day are thin).
      *   *The Nyaya Fix:* The Hetu is the **complex fact**: "Possessing fatness *while* not eating during the day" (*diva-anasanatva-vishista-pimnatva*).
  *   **Vyapti (Universal Connection):** "Wherever there is fatness combined with not eating during the day, there is eating at night."

  **The Syllogism:**
  1.  **Pratijna (Proposition):** Devadatta eats at night.
  2.  **Hetu (Reason):** Because he is fat and does not eat during the day.
  3.  **Udaharana (Example/Vyapti):** Whoever is fat and does not eat during the day eats at night (like [hypothetical] Caitra).
  4.  **Upanaya (Application):** Devadatta is fat and does not eat during the day.
  5.  **Nigamana (Conclusion):** Therefore, Devadatta eats at night.

  ### 2. Where the Reduction Feels Forced (The Mimamsa Counter-Strike)

  You asked where it feels forced. Your suspicion about the *Vyapti* is the exact lever the Mimamsakas (like Kumarila Bhatta) pull to break this reduction. Here are the three specific friction points.

  #### A. The Problem of the *Vyapti* (Circularity)
  In a standard *Anumana* (Smoke -> Fire), I know the *Vyapti* independently. I have seen smoke and fire together many times in the past. I know "Where there's smoke, there's fire" *before* I see the smoke on the hill.

  In the Devadatta case, how do I know the *Vyapti* ("Fat + No Day Food -> Night Food") is true?
  *   I haven't observed this universal law in the world. I don't walk around tracking fat people who starve during the day to see if they eat at night.
  *   I only accept this *Vyapti* **because I already accept the conclusion.** I assume he eats at night *in order to make sense* of the fatness.
  *   **Mimamsa Point:** The *Vyapti* here is not an observed universal; it is a *presupposition* required to resolve a conflict. If the knowledge of the connection depends on already accepting the conclusion, it's not a valid *Anumana*; it's circular.

  #### B. The Problem of *Doubt* vs. *Extension*
  Standard *Anumana* is about extending knowledge from the perceived to the unperceived. I see smoke (perceived), I know fire (unperceived). There is no conflict.

  *Arthapatti* arises from a **conflict** (*virodha*).
  *   Fact A: Devadatta is fat (implies eating).
  *   Fact B: Devadatta does not eat during the day (implies not eating).
  *   These two facts are incompatible *unless* we postulate a third fact (eating at night).

  Nyaya tries to say the "Hetu" is the combination of A and B. But Mimamsa argues that the cognitive process isn't "I see a mark, therefore I infer a property." The process is "I have two contradictory facts; the only way to save them both is to postulate X."
  *   **Mimamsa Point:** *Anumana* extends knowledge; *Arthapatti* resolves contradiction. They are different cognitive jobs.

  #### C. The "Best Explanation" vs. "Invariable Concomitance"
  You nailed this in your prompt. This is Abduction (IBE), not Deduction.
  *   **Deduction (Anumana):** If P, then Q. P. Therefore Q. (Necessary truth).
  *   **Abduction (Arthapatti):** Q is observed. P would explain Q. Therefore, probably P.

  Is it *necessary* that Devadatta eats at night? No. Maybe he has a glandular disorder. Maybe he eats once a week in massive quantities. Maybe he is stuffed with cotton.
  Nyaya has to insist the *Vyapti* is invariable (*niyata*) to save *Anumana*. But in reality, the link is contingent. It is the *best available explanation*, not a logically necessary one. By forcing it into *Anumana*, Nyaya has to pretend the connection is tighter than it actually is.

  ### 3. Why Nyaya Insists Anyway (The Principle of *Laghava*)

  If the reduction is this forced, why do Nyayins stick to it? It comes down to **Ontological Parsimony** (*Laghava*).

  Nyaya is a realist school that wants to minimize the number of independent tools of knowledge. Their argument is:
  1.  All knowledge of the unperceived comes through a connection with the perceived.
  2.  In *Arthapatti*, we perceive the fatness and the non-eating.
  3.  We arrive at the unperceived (night eating) through a logical connection.
  4.  Therefore, it fits the definition of *Anumana*.
  5.  If we don't *need* a new *pramana* to explain it, we shouldn't posit one (Ockham's Razor avant la lettre).

  They argue that the "conflict" is just a psychological trigger, but the *logic* that gets you from the conflict to the resolution is still inferential.

  ### 4. Summary for Your Course

  If you need to write this up or discuss it, here is the breakdown:

  1.  **The Nyaya Move:** They define the *Hetu* as a complex condition ("Fatness + No Day Eating") and assert a *Vyapti* that links this condition to "Night Eating."
  2.  **The Weak Link:** The *Vyapti* is not empirically established independently of the conclusion. It is known only *through* the postulation itself.
  3.  **The Mimamsa Victory:** Mimamsa successfully argues that *Arthapatti* is distinct because it relies on **resolving an inconsistency** between two known facts, whereas *Anumana* relies on **recalling a universal connection** between a mark and a property.
  4.  **Your Insight:** You are correct to identify this as **Inference to the Best Explanation**. Nyaya tries to dress IBE up as Deductive Inference to save on ontological costs. Mimamsa says "No, the cognitive event is distinct, so the *pramana* must be distinct."

  The Devadatta case sticks in your throat because you are sensing that the *Vyapti* is being manufactured *post-facto* to save the theory. That is exactly the Mimamsa critique.
