      *   *Nyaya Goal:* Show this fits the 5-step *Parartha-anumana* (inference for others) or at least the 3-step logical structure (*Svarta-anumana*).
      *   *The Challenge:* Standard *Anumana* relies on *Vyapti* (universal concomitance) between a perceived Mark (*Hetu*) and an unperceived Probandum (*Sadhya*). E.g., Smoke (Hetu) -> Fire (Sadhya).
      *   *The Problem with Devadatta:* "Fatness + No Day Eating" isn't a natural universal like "Smoke + Fire." It's contingent on biology and circumstance.

  3.  **Drafting the Nyaya Reconstruction (The "Reduction"):**
      *   *Sadhya (Probandum/Thing to be proved):* Eating at night (*ratrau bhojanatva*).
