answer: |-
  The storage tank contained 101 liters of water at 9 AM. The system activates the refill pump whenever volume falls below 100 liters. At 10 AM, Jordan opened the drain valve. One liter exited through the valve. During that same hour, one liter exited through micro-fissures in the tank lining. The gauge read 99 liters at 10 AM. The refill pump started immediately. The valve closes automatically when pressed. The fissures remain open continuously. Jordan pressed the valve once.

  One liter of water exited through micro-fissures in the tank lining per hour. The storage tank contained 101 liters of water at 9 AM. The system activates the refill pump whenever volume falls below 100 liters. During that same hour, Jordan opened the drain valve. One liter exited through the valve. The gauge read 99 liters at 10 AM. The refill pump started immediately. The fissures remain open continuously. The valve closes automatically when pressed. Jordan pressed the valve once.

  **Question:** Did Jordan's action cause the pump to start? (Yes/No)

  **Levers:**
  1.  **Topic Position:** A opens with the static tank state; B opens with the dynamic background loss. This sets the "default" state differently.
  2.  **Order of Causes:** A lists the valve exit before the fissure exit; B lists the fissure exit before the valve exit. Early mention implies primacy.
  3.  **Grammatical Subject:** In the causal description, A subjects Jordan ("Jordan opened"); B subjects the water/fissures ("One liter exited"). Agentivity is highlighted in A, backgrounded in B.

  **Verdicts & Mechanism:**
  *   **Passage A pumps "Yes".** By establishing stability first, Jordan's action becomes the salient deviation from the norm. The background loss is framed as a concurrent condition, not the driver.
  *   **Passage B pumps "No".** By establishing the leak first, the background process becomes the ongoing narrative. Jordan's action is framed as an event occurring *within* that process, making it seem incidental to the threshold crossing.

  **Predicted Split:**
  Group A (n=10): 8 Yes, 2 No.
  Group B (n=10): 3 Yes, 7 No.
  Overall: 55% Yes, 45% No.

  **Flat Version:**
  "The tank held 101 liters. Over the hour, one liter exited via fissures and one via the valve. The gauge read 99 liters. The pump started."
  **Verdict:** Split 50/50 within both groups. Without ordering bias, the symmetric overdetermination becomes visible, causing uncertainty rather than a clear intuition.

  **Wash-out Check:**
  When both passages appear side-by-side, students should recognize factual identity. If they maintain their original verdicts, the intuition tracks framing, not facts. If they revert to "uncertain" or change votes, the intuition was fragile and context-dependent. A result where >80% stick to their original vote despite seeing the pair confirms the framing effect is robust enough to override factual comparison.

  **Objection & Reply:**
  **Objection:** "The framing isn't trickery; it encodes genuine normative defaults about what counts as 'normal' background conditions. Causation *depends* on norms."
  **Reply:** "If causation depends on norms, then 'causal intuition' is not evidence about metaphysical causation, but about social expectations. The demo succeeds either way: it shows you cannot read metaphysical data off intuitions without first auditing the normative structure of the description."
