          *   The Charge: Real politics is messy. Assuming SP ignores deep value conflicts. It assumes away the conflict G-S highlights.
          *   The Rebuttal: Preferences are not fixed physical constants (like mass or charge). They are endogenous to institutional design. By structuring the debate (e.g., left-right economic spectrum), we *induce* single-peakedness.
