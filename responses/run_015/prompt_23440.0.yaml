      *   **Domain Restriction and the Median Rule:**
          *   Define Single-Peakedness (SP). Let $A \subset \mathbb{R}$. Preference $\succ_i$ is SP if there exists $x^*_i$ such that utility decreases as distance from $x^*_i$ increases.
          *   The Mechanism: Select the median of the reported peaks.
          *   Proof Intuition (Strategy-Proofness): If I report $x'_i \neq x^*_i$, can I move the median closer to $x^*_i$? Only if I am the median voter. If I am not, moving my report doesn't change the median. If I am, moving away from my true peak moves the median away from my true peak. Hence, truth-telling is a weakly dominant strategy.
