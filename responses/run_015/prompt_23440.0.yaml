      *   Anticipate "sleight of hand" objection? Yes.
      *   Tone appropriate for retired mathematician? Yes.

  6.  **Final Polish:** Ensure the distinction between Gibbard-Satterthwaite (general social choice functions) and Arrow (ranking) is clear implicitly, though the prompt focuses on G-S. Ensure the distinction between "manipulability" and "strategy-proofness" is clear. (G-S says if SP + Non-dictatorial + Surjective -> Impossible on Universal Domain).

  *(Self-Correction on Median Rule Proof)*: I need to be careful. The median rule is strategy-proof *for the voter* if preferences are single-peaked. Why? Because the outcome function is monotonic in the reported peak. If I want to move the median to the right, I must report a peak to the right. But if my true peak is to the left of the median, moving the median right hurts me. If my true peak is to the right, moving it right helps, but I'm already reporting truthfully. If my true peak *is* the median, moving it hurts.
  Actually, the standard proof is: Let $m$ be the median of the *other* $n-1$ voters. The outcome is the median of $m$ and my report $x_i$. This is a "generalized median." The function $f(x_i) = \text{median}(x_i, m)$ is such that the outcome is always between $x_i$ and $m$. If my ideal is $x^*_i$, my utility is maximized when the outcome is closest to $x^*_i$. Since the outcome is constrained to the interval $[\min(x_i, m), \max(x_i, m)]$, reporting $x^*_i$ minimizes the distance to $x^*_i$ given $m$.
