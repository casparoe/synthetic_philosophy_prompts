      *   **Key Concept 4: Practical Upshot.** Electoral design isn't about finding a perfect universal rule; it's about structuring the choice space (institutions, agendas, dimensions) to induce domain restrictions.
      *   **Key Concept 5: The Objection ("Sleight of Hand").** Is restricting domain cheating? Counter-argument: Preferences aren't exogenous; institutions shape them. However, acknowledge limits (pluralism, multidimensionality).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's background. Validate the intuition that G-S feels "underwhelming" because it's an impossibility result in the *absence* of structure. State the thesis clearly: G-S is a theorem about *unstructured* diversity, not a death knell for collective choice.

      *   **The Work of the Universal Domain:**
