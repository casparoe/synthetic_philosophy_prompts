          *   Verdict: True by definition, but assumes you care about geometric growth specifically.

      *   *Claim 2: Asymptotic Dominance (Ending up richer w/ prob 1).*
          *   This is the Breiman (1960) / Algoet & Cover (1988) result. In the limit ($t \to \infty$), Kelly wealth exceeds any other "essentially different" strategy with probability 1.
          *   Assumptions: Infinite horizon, reinvestment, known probabilities.
          *   Is it a taste question? It sounds objective ("probability 1"), but the "long run" is the key. If you die before the long run, it doesn't matter.
          *   Verdict: True asymptotically, irrelevant for finite horizons.

      *   *Claim 3: Median vs. Mean Wealth.*
          *   Kelly maximizes median wealth in the long run. Mean wealth is maximized by betting everything (if +EV).
          *   Why median? Because wealth distributions become log-normal (highly skewed). Mean is driven by rare huge outcomes.
          *   Is it a taste question? Preferring median over mean is a risk preference.
          *   Verdict: True description of distribution, but choosing median is a preference.

      *   *Claim 4: Asymmetry of Overbetting (Volatility Drag).*
          *   Overbetting Kelly reduces growth and increases ruin risk drastically. Underbetting reduces growth linearly but risk quadratically.
