answer: |-
  Here is the breakdown of the distinct claims hiding inside your colleague's statement, evaluated for truth and relevance to the "taste vs. correctness" debate.

  **1. Claim: Kelly maximizes the long-run geometric growth rate of wealth.**
  *   **Verdict:** True by definition, but choosing to maximize growth rate rather than expected value is itself a risk preference.
  *   **Why:** Kelly maximizes the expected value of the *logarithm* of wealth; mathematically, this equals the geometric growth rate. If you prefer maximizing arithmetic mean (expected value), you should bet everything on any +EV opportunity. Choosing "growth rate" as your goal is the taste part.

  **2. Claim: Kelly wealth asymptotically dominates any other strategy with probability one.**
  *   **Verdict:** True *asymptotically* (as time $t \to \infty$), but irrelevant for finite human lifespans.
  *   **Why:** This is the Breiman (1960) theorem: in the infinite limit, the ratio of Kelly wealth to any other strategy's wealth goes to infinity almost surely. However, "asymptotic" means "in the long run," and as Keynes said, "in the long run we are all dead." It does not guarantee you won't hit a 90% drawdown in year 3.

  **3. Claim: Kelly maximizes median wealth, whereas maximizing expected value maximizes mean wealth.**
  *   **Verdict:** True description of the distribution, but preferring median over mean is a risk preference.
  *   **Why:** In repeated betting, wealth distributions become highly skewed (log-normal). The mean is driven by one-in-a-million jackpot paths; the median is the "typical" outcome. Caring about the "typical" outcome rather than the "average" outcome is a specific attitude toward risk (specifically, it implies log utility).

  **4. Claim: Overbetting Kelly is punished more severely than underbetting (volatility drag).**
  *   **Verdict:** True mathematical property, supports "don't overbet" but not "must bet full Kelly."
  *   **Why:** The growth function is concave around the Kelly point. Betting $2\times$ Kelly reduces growth to zero (and invites ruin); betting $0.5\times$ Kelly reduces growth only slightly while cutting variance in half. This argues for *caution*, not necessarily *precision*.

  **5. Claim: Logarithmic utility is the objectively correct utility function for money.**
  *   **Verdict:** False (philosophically); utility functions represent subjective preferences, not physical laws.
  *   **Why:** This is the normative leap. Samuelson (1969) proved that maximizing expected utility does *not* require maximizing geometric mean unless your utility function happens to be $U(W) = \ln(W)$. Claiming log utility is "correct" is like claiming vanilla ice cream is "correct."

  ***

  ### The "Taste vs. Correctness" Verdict
  Your colleague is trying to use **Claim 2** (Asymptotic Dominance) to prove **Claim 5** (Log Utility is Objective). This is a category error.
  *   **Which readings support "not a taste question"?** Only Claim 2 *looks* objective, but it relies on the infinite horizon assumption.
  *   **Which readings support "sleep at night"?** Claims 1, 3, and 4 all admit that you are trading off growth for variance, which is the definition of a risk preference.

  ***

  ### Addressing Your Wrinkles

  **(1) The "Closed System" Objection (Paychecks/Withdrawals)**
  *   **Is it a real objection?** Yes, it breaks the theorem.
  *   **Why:** The Kelly theorems assume a non-ergodic system where you compound *all* wealth forever without external cash flows. In reality, you consume wealth (rent, food) and add wealth (salary).
  *   **Technical Note:** A process is **ergodic** if the time average equals the ensemble average. Kelly works because log-wealth is ergodic. But if you withdraw money to live, you break the compounding chain. If you hit a deep drawdown, you might be forced to sell at the bottom to pay rent, locking in losses that the "infinite time" theorem assumes you would have recovered from. This makes "survival" (avoiding ruin) more important than "maximal growth," pushing you toward fractional Kelly.

  **(2) The "Unknown Probabilities" Objection (Estimation Error)**
  *   **Is it a real objection?** Yes, this is the strongest practical argument against Full Kelly.
  *   **Why:** Kelly assumes you know the true edge ($p$) and payout ($b$). In a startup investment, you are estimating these from "vibes and data."
  *   **The Consequence:** If you overestimate your edge even slightly, Full Kelly becomes *overbetting*, which drastically increases ruin risk. Under parameter uncertainty, **Fractional Kelly** (e.g., Half-Kelly) is mathematically proven to be superior to Full Kelly for growth because it accounts for the variance in your estimates.
  *   **Verdict:** Your colleague's "theorem" assumes perfect knowledge. In the real world, betting less than Kelly is often the *growth-maximizing* move precisely because you don't know the true probabilities.

  ### Summary for the Group Chat
  Your colleague is right that Kelly has unique mathematical properties in an infinite, closed system with known probabilities. He is wrong that this makes it a moral or objective imperative for a human with a finite lifespan, external income, and imperfect information. Bet size is absolutely a taste question (risk tolerance) constrained by an error margin (estimation risk).
