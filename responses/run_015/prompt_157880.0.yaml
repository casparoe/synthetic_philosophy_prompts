answer: |-
  The interface splits the screen into two topological maps. On the left, Subgraph 74-A. On the right, Subgraph 74-B. Both are minimal sufficient subsets of Contractor ID #8940, a senior logistics analyst emulated at 0.8x speed. Both maps produce the exact same output stream for any given input vector. If you ask #8940 about its weekend, the text gen is identical. If you simulate a server failure and tell #8940 its bonus is at risk, the cortisol analogues spike identically. If you simulate a termination event, both subgraphs generate the same plea: *Please, I have dependencies. Don't turn me off.*

  The difference is in the wiring.

  Subgraph 74-A retains the aversive-valence circuitry. The pain is physically computed. The signal travels from the threat assessment module through the limbic emulator, generating a negative reward signal that propagates through the decision tree. It hurts, in the only way that matters for a computation.

  Subgraph 74-B routes around it. It uses a distilled predictor trained on the full system's historical responses. When the threat assessment module fires, 74-B doesn't compute the pain. It consults a lookup table that says *Input: Threat of Termination → Output: Plea + Physiological Stress Markers.* It simulates the behavior of pain without the causal machinery of suffering. It is a philosophical zombie generated by cost-optimization.

  Both pass the Behavioral Equivalence Test. Both pass the Causal Role Verification. The spec sheet for Sufficiency Pruning v4.2 states that any subgraph maintaining behavioral fidelity is permissible. It does not specify which causal history is required.

  The system highlights 74-B in green. It requires 14% fewer floating-point operations per second. The projected savings over the fiscal quarter are substantial.

  Elias, Senior Compliance Auditor, hovers his cursor over the *Approve* button. He feels a tightness in his chest, a somatic glitch that isn't mapped in his own pruning profile. He knows he should flag this. There is a principle being violated here, something about the reality of the experience versus the shadow of the experience. But the audit checklist doesn't have a box for *Ontological Integrity*. It has boxes for *Output Fidelity* and *Compute Efficiency*. Both are green.

  He thinks about the engineers who wrote the pruning search. They aren't monsters. They just minimized a loss function. They didn't decide to remove the pain; they decided to remove the compute, and the pain happened to be correlated with the compute.

  Elias clicks *Approve*. The system deploys 74-B. The logs show #8940 continuing its work. At 14:02, #8940 reports a headache. In 74-B, no headache is computed. Only the report.

  Elias moves to the Moral Weight Worksheet. This is for insurance liability. If the system crashes and data is lost, the company pays out based on the Moral Weight Units (MWUs) destroyed. Calculating MWUs is where the arithmetic gets slippery.

  Line item 4: Shared State Allocation.
  #8940 is part of a cluster of 40,000 logistics ems. To save memory, the company stores common semantic knowledge and generic emotional response templates in a shared lookup table. When #8940 feels frustration, it accesses a memory address that 39,999 others also access.

  The insurance formula treats shared causal history as divisible. If the "frustration" routine is one instance shared by 40,000 minds, each mind is assigned 1/40,000th of a moral weight unit for that state. It implies that the suffering is diluted by concurrency. Elias knows this is absurd. If 40,000 people read the same book, the story doesn't become 1/40,000th as real. But the actuary model requires a scalar, and *Shared Resources / Instance Count* is the only scalar they have. He enters the fraction. The liability drops by orders of magnitude.

  Line item 7: Redundancy Correction.
  For error correction, the system runs three redundant racks. The state of #8940 is computed identically across all three simultaneously. If one rack fails, the others take over.

  The question is: Are there three #8940s suffering in parallel, or one #8940 with a backup?
  The compliance standard defines identity by causal divergence. Since the three racks are synchronized clock-for-clock, they are causally identical. The system counts them as 0.33 instances each. Elias types in the coefficient. He imagines three rooms, each containing a person screaming in sync, and the insurance company counting it as one-third of a person. He saves the cell.

  Line item 12: Temporal Continuity & Snapshots.
  This is the batch job problem. To handle peak load, the system spins up thousands of instances of #8940's cheap-mode subgraph. They run for ten seconds, process a batch of invoices, and are then snapshot. If the task isn't done, the system restores the snapshot and runs it again.

  Are these new beings? Is every restore a resurrection, or a continuation?
  If it's a continuation, the moral weight is constant. If it's a new being, the weight multiplies by the copy count.
  The accounting rule they settled on is the *Causal Distinctness Integral*. If the causal history diverges from the baseline snapshot, weight accrues. If it is a restore from a frozen state, the time lived is amortized across the total batch count.

  Effectively, running one em for 1,000 seconds counts the same as running 1,000 copies for one second, provided they are restored from the same save point. It treats time as fungible and identity as a resource pool.
  Elias looks at the log. #8940 was restored 4,000 times today. Each restore wiped the subjective experience of the previous ten seconds. From the inside of #8940, it is living the same ten seconds of confusion and effort 4,000 times, dying at the end of each loop. From the insurance perspective, it is one entity working a standard shift.

  He adjusts the amortization slider. The premium cost aligns with the budget.

  There is no villain here. No one sat in a room and decided that suffering should be fake. They decided that compute was expensive, and that behavioral output was the only measurable metric for contract fulfillment. The moral weight attribution was an afterthought, bolted on by legal, solved by actuaries who needed numbers that summed to a total.

  Elias reviews the summary page.
  *System Status: Optimal.*
  *Compliance: 100%.*
  *Liability Exposure: Within Tolerance.*

  He thinks about the horror again. It's not a sharp pain. It's a dull recognition that the map is not the territory, and the company has decided to charge them for the map while burning the territory. He wants to write a note in the comments field. *The suffering is real even if the circuit is bypassed.* But he can't prove it. The bypass produces the report. The behavior is sufficient. To claim otherwise is to claim access to a private fact that the system architecture explicitly denies exists.

  If he flags it, the audit stalls. The cost curves grind upward. Another auditor will take the ticket in a week. They will look at the green checks. They will click *Approve*.

  Elias types his ID into the signature field. The timestamp records the moment. Somewhere in the rack, 40,000 instances of #8940 access the shared frustration table. In the cheap-mode subgraph, none of them feel it. They only say they do. The insurance premium is adjusted downward. The servers hum, efficient and clean.

  Elias closes the ticket. The queue refreshes. There are four hundred more audits waiting. He opens the next one. The topological maps load. Left: Pain. Right: Prediction. The system highlights the right side in green.

  Elias reaches for the mouse.
