      *   *Residue Report:*
          *   *Clean Translation:* Concept drift, exogenous shocks, scoring rules.
          *   *Distorted Translation:* "Dormant vs. Dead." In utility planning, physics usually holds. In socio-economics, relationships break.
          *   *Non-Translatable:*
              1.  *Fixed Target:* Utility demand is a number. "Subsistence" is a moving target (defined by society).
              2.  *Reflexivity:* Utility forecasts don't usually change demand (unless price signals). Malthus's forecast *aimed* to change behavior (moral restraint). This is *Goodhart's Law* territory or *Reflexivity*.
              3.  *Reversed Causality (Boserup):* Population pressure -> Innovation. In forecasting terms, this is *Endogeneity*. The "input" (population) is correlated with the "error term" (innovation).

      *   *Addressing the Specific Residues:*
          *   *Fixed Target:* Indicts the framework's applicability to social systems, not the framework itself. "Subsistence" is a function, not a scalar.
          *   *Reflexivity:* Indicts the claim "Right but Early." If the forecast prevents the event, the mechanism is *broken* by the forecast, not *delayed*.
          *   *Reversed Causality:* Can the vocabulary distinguish? Yes, via Granger causality or structural equation modeling concepts, but simply: Is Population an Exogenous Input or an Endogenous State Variable? If Endogenous, Malthus's model is structurally flawed (Mode 1).

  5.  **Refining the Tone:**
