      *   Be decisive. The user wants to settle an argument, not hear "both sides have merit."
      *   Respect the constraint: No looking up sources. Flag historical assumptions.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Boserup" point? *Action:* Ensure I discuss endogeneity and reversed causality in the Residue Report.
      *   *Check:* Did I distinguish between Mode 2 and Mode 3 clearly? *Action:* Mode 2 is "wrong number plugged in." Mode 3 is "right number, wrong speed." The Green Revolution looks like Mode 2 (new variable introduced), but the friend treats it as Mode 3 (delay). I need to highlight this conflation.
      *   *Check:* Is the distinction between "Dormant" and "Dead" clear? *Action:* Use the residual plot analogy the user provided.
      *   *Check:* Did I answer whether "Right but Early" is well-posed? *Action:* Conclude that without a Deferral Clause, it is not well-posed.

  7.  **Final Polish:** Organize into clear sections matching the prompt's requirements. (Translation, Ledger Application, Residue Report, Specific Residues, Causality). Ensure the "Assumption" flags are present for historical claims.

  *(Self-Correction on "Right but Early"):* In forecasting, "Right but Early" is essentially a claim about the *distribution of error*. If the error is temporal (timing) but not directional (sign), it's Mode 3. If the error is directional (food went up, not down), it's Mode 1. The friend claims Mode 3. The data shows Mode 1/2. I need to make sure this distinction is sharp.

  *(Refining the Reflexivity point):* In utility planning, if I forecast high demand, we build capacity, and demand is met. That's not reflexivity; that's meeting the target. Reflexivity is if I forecast high demand, prices rise, and demand drops. Malthus is closer to the latter. His forecast was a warning to induce restraint. If it worked, the mechanism failed. This makes "Right but Early" logically impossible if the forecast succeeded.

  *(Refining the Boserup point):* If population causes innovation, then Population is not an independent variable. It's part of a feedback loop. Malthus treated it as an independent driver. This is a specification error (Mode 1).

