          *   *User:* "Right but early" is an unfalsifiable escape hatch. If you keep rolling the date forward, the model has no predictive power.
      *   **User's Framework:**
          *   *Latency Ledger:* Three failure modes (Wrong mechanism/sign, Wrong exogenous inputs, Mis-specified slow variable allowing date slide). Only the third allows "right but early."
          *   *Pre-registered Deferral Clause:* Rules set *before* data arrival for when to push horizons vs. refute.
          *   *Dormant vs. Dead:* Threshold not crossed (dormant) vs. relation broken (dead). Indistinguishable in-sample.
      *   **The Task:**
          1.  Restate the Malthus dispute using the user's forecasting vocabulary (walk-forward validation, out-of-sample error, calibration, proper scoring, concept drift, regime shift, specification search, degrees of freedom, loss functions, target variable, published vs. fitted).
          2.  Apply the *Latency Ledger* and *Deferral Clause* to the Malthus case. Identify the supported failure mode.
