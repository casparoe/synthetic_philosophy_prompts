  ### Preamble: Critical Notes on the Instrument

  Before using this tree, two caveats regarding your constraints are necessary.

  First, regarding the **Palimpsest Case**: The stipulation that memory overwriting occurs without *any* change in discrimination or report is logically fragile. If memory constitutes a functional state, overwriting it changes the subject's functional profile, violating the "fixed reports/discriminations" clause. In the literature (e.g., Dennett's 'Faded Qualia'), this is usually framed as the subject being *unable* to report the change, not that the memory trace is identical. I have retained the case as requested, but marked the branch as **Fragile**; students should treat it as a probe for whether they believe phenomenology *must* supervene on functional memory states, rather than a literal possibility.

  Second, regarding the **Leaves**: **Russellian Monism** and **Non-reductive Phenomenal Realism** (Property Dualism) agree on the coherence of qualia and their intrinsic nature. They differ only on the categorical basis of the physical world. Similarly, **Reductive Representationalism** and the **Phenomenal-Concept Strategy** often align on functional nodes, differing on the metaphysics of the explanatory gap. This tree uses metaphysical nodes to separate them, but students should note that on the strict question of *qualia coherence*, these pairs occupy the same logical territory.

  ***

  ### The Qualia Coherence Decision Tree

  **Instructions:** Proceed from Node 1. Answer 'Yes' or 'No' based on your intuition about the case or claim. Follow the branch to the next node or to a Leaf.

  #### Node 1: The Empty-Report Case (Distinction 3b)
  *Confidence: High*
  **Question:** In the *Empty-Report Case*, a subject's reports about their experience are produced by a mechanism tracking the distal stimulus, with no first-person access to the experience itself. If the mechanism functions perfectly but access is severed, do the subject's reports still count as evidence for what it is like for them?
  *   **No:** (You deny that reports without access track phenomenal truth.) → Go to **Node 2**.
  *   **Yes:** (You grant that reports track experience even if access is compromised, or that access is inherent in the report.) → Go to **Node 3**.

  #### Node 2: The Source of Error (Distinction 3b continued)
  *Confidence: High*
  **Question:** For those who answered 'No' to Node 1: Is the mistake in our ordinary talk about experience that we refer to nothing at all (the phenomenon is an illusion), or that our concept of 'experience' is confused while the neural reality is unproblematic (the dispute is verbal)?
  *   **The phenomenon is an illusion:** → **Leaf A: Illusionism**.
  *   **The concept is confused:** → **Leaf B: Verbal Dispute**.

  #### Node 3: The Twin-Taster Case (Distinction 3c)
  *Confidence: High*
  **Question:** In the *Twin-Taster Case*, two subjects swap the character of one modality's experience nightly, but the total pattern of similarity and difference among their own experiences remains identical for each subject. Is there a fact of the matter about whether the swap occurred?
  *   **No:** (There is no fact; phenomenal character is exhausted by the structure of relations.) → Go to **Node 4**.
  *   **Yes:** (There is a fact; phenomenal character is intrinsic to the experience.) → Go to **Node 5**.

  #### Node 4: Representation vs. Pure Structure (Distinction 3c continued)
  *Confidence: Fragile*
  **Question:** For those who answered 'No' to Node 3: Is the structure that constitutes experience essentially a structure of *representation* (tracking distal properties), or is it a purely internal structural relation with no representational intent?
  *   **Essentially Representational:** → **Leaf C: Reductive Representationalism**.
  *   **Purely Structural/Relational:** → **Leaf D: Relationalist or Structuralist View**.

  #### Node 5: The Palimpsest Case (Distinction 3a)
  *Confidence: Fragile (see Preamble)*
  **Question:** In the *Palimpsest Case*, a subject slowly acquires an additional phenomenal dimension over a decade, with memory overwriting such that no report or discrimination could register the change. Is there a fact of the matter about whether their experience changed?
  *   **No:** (Phenomenology cannot drift from functional/memory capacity.) → **Leaf E: Phenomenal-Concept / A Posteriori Physicalist**. *(Note: This leaf often aligns with Reductive Representationalism on nodes, but locates the gap in concepts.)*
  *   **Yes:** (Phenomenology can change even if functional capacity is fixed.) → Go to **Node 6**.

  #### Node 6: Causal Efficacy (Metaphysical Distinction)
  *Confidence: High*
  **Question:** For those who answered 'Yes' to Node 5: Does the intrinsic phenomenal character of the experience play a causal role in producing the subject's verbal reports about that experience?
  *   **No:** (The experience is a causally inert by-product.) → **Leaf F: Epiphenomenalism**.
  *   **Yes:** (The experience helps cause the report.) → Go to **Node 7**.

  #### Node 7: Intelligibility of Supervenience (Metaphysical Distinction)
  *Confidence: High*
  **Question:** For those who answered 'Yes' to Node 6: Is it possible, even in principle, for human intellect to understand *why* a specific physical brain state necessitates a specific phenomenal character?
  *   **No:** (The link is brute and forever beyond human cognitive closure.) → **Leaf G: Mysterianism**.
  *   **Yes:** (The link is intelligible.) → Go to **Node 8**.

  #### Node 8: The Nature of the Physical Base (Metaphysical Distinction)
  *Confidence: High*
  **Question:** For those who answered 'Yes' to Node 7: Does standard physics exhaust the categorical nature of the world, requiring consciousness to be a distinct non-physical property, or does physics only describe structure/disposition, leaving room for consciousness to be the categorical interior?
  *   **Physics is structural; Consciousness is the categorical interior:** → **Leaf H: Russellian Monism or Panpsychism**.
  *   **Physics is categorical; Consciousness is a distinct non-physical property:** → **Leaf I: Non-reductive Phenomenal Realism**.

  ***

  ### Leaf Descriptions & Awkward Commitments

  **Leaf A: Illusionism**
  *   **Commitment:** Phenomenal properties do not exist; we are systematically mistaken in believing we have them.
  *   **Most Awkward Commitment:** You must explain why the illusion of pain feels exactly like pain without positing a painful feeling, often forcing a paraphrase of 'suffering' that feels revisionary.

  **Leaf B: Verbal Dispute**
  *   **Commitment:** The debate over qualia arises from ambiguous terminology rather than substantive disagreement about the world.
  *   **Most Awkward Commitment:** You must maintain that decades of intense philosophical disagreement regarding consciousness are merely linguistic confusion, despite participants insisting they describe distinct realities.

  **Leaf C: Reductive Representationalism**
  *   **Commitment:** Phenomenal character is identical to a functional representational property; qualia are real but physical/functional.
  *   **Most Awkward Commitment:** You must accept that two states with identical representational content cannot differ phenomenally, which struggles to account for moods or after-images that lack clear objects.

  **Leaf D: Relationalist or Structuralist View**
  *   **Commitment:** Phenomenal character is constituted entirely by relations of similarity and difference, with no intrinsic 'glow'.
  *   **Most Awkward Commitment:** You must deny that there is 'something it is like' to be a single experience in isolation; phenomenology vanishes if the system of contrasts is removed.

  **Leaf E: Phenomenal-Concept / A Posteriori Physicalist**
  *   **Commitment:** Qualia are physical states, but our concepts for them are distinct from our physical concepts, creating an illusory explanatory gap.
  *   **Most Awkward Commitment:** You must argue that the apparent contingency of the mind-body link is a cognitive illusion, despite it appearing as robust as any modal intuition we possess.
  *   **Note on Stability:** This position often answers 'No' to Node 5 (Palimpsest) but 'Yes' to Node 3 (Twin-Taster) in some formulations, creating tension between synchronic and diachronic verdicts.

  **Leaf F: Epiphenomenalism**
  *   **Commitment:** Qualia are real, non-physical properties caused by the brain, but they cause nothing in return.
  *   **Most Awkward Commitment:** You must accept that your knowledge of your own consciousness is not caused by that consciousness, rendering your belief in it accidentally true.

  **Leaf G: Mysterianism**
  *   **Commitment:** Qualia are real and physical (or naturally supervenient), but the explanation is beyond human cognitive capacity.
  *   **Most Awkward Commitment:** You must concede that philosophy of mind cannot solve the hard problem, effectively ending the research programme while affirming the phenomenon exists.

  **Leaf H: Russellian Monism or Panpsychism**
  *   **Commitment:** Consciousness is the intrinsic nature of physical matter, resolving the gap by redefining the physical.
  *   **Most Awkward Commitment:** You must entertain the combination problem: how micro-experiences of particles combine to form the unified macro-experience of a human subject.

  **Leaf I: Non-reductive Phenomenal Realism**
  *   **Commitment:** Qualia are fundamental, non-physical properties that nomologically supervene on the physical.
  *   **Most Awkward Commitment:** You must accept brute psychophysical laws that add complexity to the universe without offering a mechanism for how the physical produces the non-physical.

  ***

  ### Empty Leaves & Logical Gaps

  **The Unstable Realist (Empty Leaf)**
  *   **Location:** A path answering 'Yes' to Node 3 (Twin-Taster/Intrinsic) but 'No' to Node 5 (Palimpsest/Diachronic).
  *   **Reason:** **Incoherent.** If one holds that phenomenal character is intrinsic and independent of functional relations (Node 3), it is difficult to maintain that it cannot change without functional registration (Node 5). This combination implies phenomenology is intrinsic yet functionally bound over time, which collapses into a contradiction or a view no one occupies.

  **The Causal Dualist (Empty Leaf)**
  *   **Location:** A path answering 'Yes' to Node 6 (Causal Efficacy) but 'Yes' to Leaf I (Non-reductive) while denying Node 8's distinction (i.e., wanting interaction without non-physical properties).
  *   **Reason:** **Merely Unattractive.** This describes Interactionist Substance Dualism. It is logically possible but largely abandoned in contemporary metaphysics due to conservation of energy worries; those who accept causal efficacy usually move to Russellianism (Leaf H) to naturalise the causation.
