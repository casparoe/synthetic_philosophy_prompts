answer: |-
  ### Evolutionary Restatement of the Debate

  **Scientific Realism as Adaptive Fit**
  In this framework, a mature scientific theory is a **phenotypic trait** of the scientific community. Predictive success is the **fitness** of that trait within a specific epistemic **niche**. The scientific realist argues that high fitness is not accidental; it indicates that the trait's underlying structure (the theory's ontology) maps onto the topography of the **adaptive landscape** (mind-independent reality). For the realist, a theory survives selection pressures because it occupies a peak that corresponds to the actual structure of the environment. Success is evidence that the organism (science) has converged on a **global optimum** or a high ridge that reflects the terrain itself, not just a temporary shelter.

  **The Pessimistic Meta-Induction as the Fossil Record**
  The pessimistic meta-induction (PMI) points to the fossil record of phenotypic traits. Many past theories exhibited high fitness in their historical niches but were later driven to extinction by new **selection pressures** (anomalies, new data). The PMI argues that because past high-fitness traits (phlogiston, ether) did not map onto the current landscape topography, current high-fitness traits likely do not either. Fitness tracks survival, not structural correspondence. The PMI suggests science is merely climbing **local optima** that shift as the environment changes, rather than converging on a stable peak that represents "truth."

  ### Translation Audit

  **What Translates Cleanly**
  *   **Predictive Success as Fitness:** This is a direct mapping. A theory that generates accurate predictions reproduces (is cited, taught, extended) much like a trait that enhances survival.
  *   **Theoretical Turnover as Selection Pressure:** Anomalies and experimental contradictions function exactly like environmental stressors or predator introduction, culling maladaptive traits.
  *   **Niche Construction:** Scientists build instruments and formalisms that alter the selection environment for future theories. This mirrors organisms modifying their environment, changing the fitness landscape for subsequent generations.

  **What Must Be Distorted**
  *   **Approximate Truth vs. Locally Optimal Adaptation:** This is the critical friction point. In evolutionary biology, a trait can be highly fit without "representing" the environment accurately (e.g., Batesian mimicry, where a harmless species resembles a toxic one). The mimic survives not because it matches the predator's reality, but because it exploits the predator's perceptual niche.
      *   *The Distortion:* Rendering "approximate truth" as "locally optimal adaptation" strips away the **representational content**. A local optimum explains *survival*, but not *correspondence*. Realism requires the trait to match the terrain; evolution only requires the trait to work on the terrain. You can fit the key to the lock without knowing why the lock works.
  *   **Convergence:** Realists rely on convergent evolution (independent lines reaching the same solution) as evidence of truth. However, convergence in biology proves functional utility, not necessarily structural identity (e.g., wings in birds vs. bats). Using convergence to prove "truth" distorts the biological fact that different genotypes can produce equivalent fitness.

  **What Has No Counterpart**
  *   **Reference:** In biology, a gene does not "refer" to a predator; it reacts to it. There is no semantic content in a phenotype. Scientific realism demands that theoretical terms (like "electron") *refer* to real entities. Evolutionary vocabulary has no mechanism for "aboutness." A trait is simply present or absent; it does not name the pressure that selected it.
  *   **Normativity:** Evolution is descriptive (what survives); science is normative (what we *ought* to believe). Biology explains why a theory persisted, not why it is rational to accept it. There is no "error" in evolution, only extinction. In science, a false theory is a cognitive error, not just a dead end.

  ### Residue Report

  The untranslatable remainder reveals that the philosophical debate was smuggling in metaphysical commitments that do no real explanatory work.

  The core residue is **reference** and **normativity**. Evolutionary epistemology can explain the *process* of scientific change—how theories vary, selection occurs, and successful traits propagate—without needing to posit that successful theories "mirror" reality. The realist's insistence on "approximate truth" adds a layer of metaphysical weight that functions like a vestigial structure: it is present in the discourse but performs no work in explaining the dynamics of theoretical turnover.

  If we treat science as a biological system, "truth" collapses into "long-term fitness across shifting niches." The PMI shows that short-term fitness is unreliable, but the Realist hope is that long-term fitness converges on the landscape's structure. However, biology offers no guarantee of convergence on a global optimum, only continuous adaptation to local peaks.

  Therefore, the failure to translate "truth" cleanly does not mean evolutionary thinking lacks the resources to capture scientific *knowledge* as a natural phenomenon. Instead, it shows that the philosophical demand for "reference" and "mind-independent correspondence" is a normative aspiration, not an explanatory variable. It is a commitment that satisfies a desire for certainty but adds no predictive power to our understanding of how science evolves. The debate survives only because philosophers treat the normative "ought" as a descriptive "is," whereas evolutionary vocabulary forces us to see scientific knowledge as a dynamic adaptation, not a static mirror.
