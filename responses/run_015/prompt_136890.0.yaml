      4. Practical advice (Send 60%, document the weights).

      *(Final check on tone)*: Keep it respectful of their philosophical knowledge. Use terms like "Common Priors," "Likelihood Functions," "Linear Opinion Pooling."

      *(Wait, one nuance on Aumann)*: Aumann says they *should* agree. They *did* agree (61 vs 60). So Aumann is satisfied *ex post*. The question is whether the *ex ante* disagreement was rational. Yes, because they didn't have common knowledge of posteriors *ex ante*.

      *(Wait, nuance on "Splitting the Difference")*: Dana suggests splitting the difference *now* (at 60). But they are *already* at 60/61. So Dana is suggesting reporting the consensus. The User thinks the consensus is suspect because it came from averaging. I need to argue that the consensus *is* the result of rational updating on testimony.

