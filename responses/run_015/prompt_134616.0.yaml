answer: |-
  The global Quine-Duhem thesis (GQD) and the proposed concept of "domain-locked underdetermination" (DLU) represent two distinct topologies of theoretical vulnerability. While GQD posits a holistic web of belief where any node can be saved by adjusting any other, DLU imposes a structural constraint: the "protective belt" of auxiliary hypotheses can be adjusted only insofar as it does not violate a "hard core" of domain-specific commitments.

  The following analysis compares these positions regarding triviality, realist implications, and their application to cosmological ontology, concluding with a precise delineation of their divergences.

  ### 1. The Triviality Objection and the Availability of Auxiliaries

  Quine eventually conceded that the global thesis is trivial if "theory" is allowed to include any logical construction. If one permits *ad hoc* auxiliaries (e.g., appending "or observation $O$ occurs" to a failing theory), empirical equivalence is guaranteed logically but lacks scientific significance. The GQD thus risks becoming a skeptical toy: it proves rivals *can* exist, not that they *should* be taken seriously.

  **Domain-Locked Underdetermination avoids this triviality.** By restricting the pool of permissible auxiliary adjustments to those consistent with prior theoretical commitments (the "lock"), DLU raises the bar for constructing rivals.
  *   **GQD:** Auxiliaries are logically available. The space of rivals is infinite but mostly populated by "monstrous" or gerrymandered theories.
  *   **DLU:** Auxiliaries are methodologically constrained. A rival theory must not only save the phenomena but also respect the domain lock (e.g., conservation laws, Lorentz invariance, or the validity of General Relativity in specific regimes).

  If a rival theory can be constructed under DLU conditions, it is not a logical trick but a scientifically robust alternative. Therefore, DLU rescues underdetermination from Quine's charge of triviality by shifting the burden from *logical possibility* to *methodological plausibility*.

  ### 2. Anti-Realist Force vs. Pragmatic Selection

  The normative force of underdetermination depends on whether the equivalence implies an absence of truth (anti-realism) or merely a lack of evidential discrimination (pragmatism).

  **Global Quine-Duhem:** Because GQD allows for arbitrary adjustments, the resulting empirical equivalence often collapses into a pragmatic selection problem. If rival $T'$ is constructed via convoluted auxiliaries, the choice between $T$ and $T'$ is decided by virtues like simplicity or conservatism. GQD supports instrumentalism (theories are just tools for prediction) because the "truth" of the core theory is always negotiable.

  **Domain-Locked Underdetermination:** DLU retains stronger anti-realist force *within the domain*. If two theories are empirically equivalent and both respect the domain lock, pragmatic virtues (simplicity, elegance) may not be sufficient to distinguish them without begging the question.
  *   **Collapse into Pragmatism?** DLU collapses into pragmatism only if the "lock" itself is viewed as merely instrumental. However, if the lock represents deep ontological commitments (e.g., "spacetime is a manifold"), DLU suggests a specific form of **Structural Realism**: we can be realists about the structure (the locked dynamics) but must remain agnostic about the unlocked ontology.
  *   **Anti-Realist Force:** DLU implies that even when we hold our deepest principles fixed, the world may not dictate a unique ontology. This is a deeper skepticism than GQD, as it persists even when we refuse to play Quine's game of logical gerrymandering.

  ### 3. Case Study: Observationally Equivalent Cosmological Models

  Consider two cosmological models that yield identical expansion histories (Friedmann dynamics) and structure formation predictions but differ on the ontology of dark energy:
  1.  **Model $\Lambda$:** Dark energy is a Cosmological Constant (vacuum energy).
  2.  **Model $Q$:** Dark energy is a dynamical scalar field (Quintessence) tuned to mimic $\Lambda$ exactly over the observable epoch.

  **GQD Analysis:**
  Under the global thesis, $\Lambda$ and $Q$ are merely different formulations of the same empirical content. Since GQD allows unlimited revision of auxiliaries, the distinction is viewed as semantic. Quine would argue that if the dynamics are identical, the ontological difference is meaningless unless it yields different observations. The "truth" of whether it is a constant or a field is indeterminate.

  **DLU Analysis:**
  Under DLU, the analysis depends on the **domain lock**.
  *   *Scenario A (Lock = General Relativity + Standard Model):* If the lock requires dark energy to be a component of the stress-energy tensor, both models are permissible. If they remain observationally equivalent despite respecting the lock, DLU identifies a genuine **ontological underdetermination**. We are forced to admit that the "lock" (the physics we trust) does not determine the nature of the entity.
  *   *Scenario B (Lock = Quantum Field Theory expectations):* If the lock includes the expectation that vacuum energy should be $10^{120}$ times larger than observed, Model $\Lambda$ violates the lock (the cosmological constant problem), while Model $Q$ might respect it (by introducing a new mechanism). Here, DLU breaks the equivalence where GQD would not. GQD allows us to tweak the QFT auxiliaries to save $\Lambda$; DLU forbids breaking the QFT lock.

  In the specific case where dynamics are identical and the lock permits both, DLU forces a skeptical conclusion about the *entity* (what dark energy *is*) while permitting realism about the *structure* (how it behaves). GQD, by contrast, tends to dissolve the distinction entirely.

  ### 4. Precise Divergences

  The two positions diverge fundamentally on the scope of revision and the epistemic weight of empirical equivalence.

  #### A. Scope of Theory Revision
  *   **GQD (Unrestricted Holism):** Any statement within the web of belief is revisable. There are no "non-negotiable" commitments. If data conflicts with theory, one can revise the logic, the observation report, or the core law with equal theoretical legitimacy (though perhaps unequal pragmatic cost).
  *   **DLU (Restricted Holism):** Revision is hierarchical. There exists a subset of commitments (the domain lock) that are treated as immune to revision *for the purpose of assessing rivals*. Theory revision is limited to the protective belt. This creates a asymmetry: $T$ and $T'$ must agree on the lock, whereas in GQD, $T$ and $T'$ can differ on everything provided they output the same observations.

  #### B. Empirical Equivalence and Skepticism
  *   **GQD (Equivalence $\to$ Indeterminacy):** Empirical equivalence alone is sufficient to motivate skepticism because the construction of rivals is trivial. If $T$ and $T'$ are equivalent, there is "no fact of the matter." Skepticism is global but shallow, as the rivals are often artificial.
  *   **DLU (Equivalence + Lock $\to$ Local Agnosticism):** Empirical equivalence *plus* adherence to the domain lock is required to motivate skepticism. If a rival violates the lock, it is dismissed, and skepticism is avoided. If a rival respects the lock and is still equivalent, skepticism is motivated, but it is **local and deep**. It suggests that even our best-confirmed framework cannot distinguish between competing ontologies.

  ### Conclusion

  Domain-locked underdetermination refines the Quine-Duhem thesis by trading scope for significance. While GQD demonstrates that theory choice is underdetermined by logic alone, it succumbs to the charge of triviality because it allows auxiliaries to be adjusted without constraint. DLU avoids this by binding auxiliary adjustments to prior theoretical commitments. In the context of cosmological dark energy, GQD treats ontological differences as meaningless if dynamics are identical, whereas DLU highlights a genuine gap between structural knowledge and ontological truth. Ultimately, GQD suggests we cannot know which theory is true because *any* theory can be made to fit; DLU suggests we cannot know which ontology is true because *respectable* theories can fit equally well.
