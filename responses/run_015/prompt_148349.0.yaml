          *   *Verdict:* **Medium Priority.** Good for the "So What?" section, but not the core research engine.

      *   **Option D: Something Missing (Structural/Structuralist Critique).**
          *   *Idea:* The tension between Sartre's existentialism and Structuralism (Foucault, Althusser). If structures determine us, is freedom an illusion?
          *   *Verdict:* **Crucial Context.** Needed to defend Option A.

  4.  **Develop the Dependency Map:**

      *   *Root Node:* Ontology of the Group. (Can a group "be" in a way that allows for faith/bad faith?)
      *   *Branch 1:* Individual vs. System. (Is the system just a sum of individuals, or an emergent entity?)
