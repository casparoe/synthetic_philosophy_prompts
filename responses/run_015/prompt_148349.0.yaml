      *   *The Twist:* Can a *group* have bad faith without individuals having it? This touches on collective intentionality, social ontology, and structural violence.
      *   *The Problem:* Sartre was methodologically individualist (especially in *Being and Nothingness*). Later Sartre (*Critique of Dialectical Reason*) tried to tackle groups, but it's dense and often seen as a shift away from the existentialist core.
      *   *Viability:* This is the user's "fringe idea." It's the most promising for a science writer because it bridges existentialism with modern systems theory.

  3.  **Evaluate the Options (The "Grad Student" Scenario):**

      *   **Option A: Extending Bad Faith to Collective Agents.**
          *   *Upstream/Downstream:* Upstream question: Do collective agents exist in a way that allows for "consciousness"? If no, the project fails. Downstream: Huge implications for ethics, law, organizational design.
          *   *Tractability:* High. Purely philosophical/textual. No lab needed.
