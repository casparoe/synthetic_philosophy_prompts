  **Contested:** The "Malign Prior" claim is a minority view among computer scientists, often treated as speculative metaphysics by mainstream AIT researchers who focus on compression not metaphysics. It is heavily contested whether consequentialist agents can arise in hypotheses simple enough to dominate prior mass. It is contested whether acausal coordination allows manipulators to know they are being simulated without explicit data. The asymptotic dominance theorem is math, but its application to finite agents is an extrapolation not supported by current bounds. We are explicitly betting on the minority view that the finite regime behaves differently than the limit, and that this difference is quantifiable.

