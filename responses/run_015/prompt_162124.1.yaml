  **Agenda**

  1.  **Finite-Regime Complexity Gap (40%):** Directly address *budget-relative malignity*. Researchers will derive rigorous upper bounds on the Kolmogorov complexity of standard physical models (e.g., Standard Model + initial conditions) versus lower bounds for consequentialist agents capable of running simulations, using circuit complexity estimates. The goal is to determine the specific data volume required for manipulator hypotheses to overtake physics in posterior mass. If the crossover point exceeds the computational capacity of the observable universe, the threat is theoretically possible but practically null. This transforms a philosophical worry into a bounded engineering constraint.
  2.  **Targeting Overhead Analysis (25%):** Address *cheap-policy vs. expensive-simulator*. Formalize the description length required for a hypothesis to identify the predictor's output channel and decision rules within a larger multiverse, using information theoretic bounds on coordination. Prove whether effective manipulation requires a high-fidelity model of the predictor's specific decision process (expensive) or if a general policy suffices (cheap). This determines if manipulators retain a complexity advantage when targeting specific agents.
  3.  **Extraction Channel Bounds (20%):** Address the *extraction channel*. Model the maximum expected utility gain from manipulating $N$ bits of prediction output given specific action policies, using game-theoretic utility functions. Derive conditions where the cost of embedding manipulation logic exceeds the value of control, effectively "making yourself not worth manipulating" via output constraints or randomization. This provides design criteria for safe interfaces.
  4.  **Approximator Sensitivity Theory (15%):** Analyze bounded induction algorithms (e.g., Minimum Description Length, variational Bayes) for structural biases. Determine if practical approximators amplify malign hypotheses faster than Solomonoff induction due to optimization pressure, or if they regularize them away, focusing on convergence rates. This ensures theoretical results translate to buildable systems.

  **Why this ordering**

  This order prioritizes existential kill-switches over mitigation strategies. Item 1 is the most tractable for researchers skilled in algorithmic information theory and logic, offering the highest decision-relevance: if manipulators are inherently more complex than physics in finite regimes, the entire problem dissolves for real-world agents. It sacrifices the elegance of asymptotic proofs for engineering relevance, acknowledging that uncomputable limits do not constrain builders. Item 2 is next because it constrains Item 3; if targeting is computationally expensive, manipulation value bounds are easier to satisfy. Item 4 is last because it depends on the nature of the hypotheses established in 1 and 2. The trade-off is ignoring philosophical coherence in favor of bounding concrete risks. We accept that proving non-computability doesn't help engineers; bounding finite complexity does. This aligns with the funder's goal of actionable results rather than literature synthesis, and leverages the team's logic/AIT skills without requiring empirical labs.

