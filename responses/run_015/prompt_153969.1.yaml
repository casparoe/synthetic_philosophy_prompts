answer: |-
  Your diagnosis is correct: this is a disagreement about formal architecture and semantics, not empirical facts. The consistency camp treats morality as a deterministic inference engine, adhering to the deontic logic principle that "ought implies can." Conflicts imply bugs. The conflict camp treats morality as a multi-objective constraint-satisfaction problem where independent values collide. They talk past each other: one defines "obligation" as the final executable command, the other as an independent weight with normative force.

  To move the debate, empirical studies on regret are useless; psychology cannot resolve normative architecture. Instead, leverage your engineering background. Distinguish between prima facie duties (input constraints) and all-things-considered obligations (final output). The conflict camp is right about inputs: moral reasons are genuinely overdetermined, and loss is real. The consistency camp is right about outputs: action requires a single decisive verdict. The "moral remainder" is not a logical contradiction but the residual cost in an optimization problem where hard constraints were unavoidably violated. This validates guilt without logical impossibility.

  Thus, the question requires meta-ethical precision. Acknowledge that moral systems can generate conflicting claims without failing as action-guides. By framing obligations as pro tanto reasons rather than absolute commands, you validate the tragedy of loss without breaking logical consistency. The impasse dissolves when you agree that morality tracks conflicting values (conflict) while prescribing singular actions (consistency). Accepting this dual-aspect view allows engineers to see morality not as broken code, but as a complex system managing trade-offs where some error is inevitable.
