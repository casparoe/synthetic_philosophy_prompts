      *   **User's Understanding of EU:** Provides a summary (Parliament, Council, Commission, Court, treaties, two camps: parliamentarizers vs. intergovernmentalists/output legitimacy). Asks for correction if off (it's generally accurate).
      *   **Specific Mappings Requested:** Commission = Management (unelected, sole proposer); Council = Controlling Shareholder (states); Parliament = Supervisory Board (low turnout election); Ever Closer Union = Unamendable Charter; Supremacy = Group Constitution overriding subsidiaries.
      *   **Specific Questions to Answer:**
          1.  Is democratic deficit an agency problem (Member States vs. Brussels), (Citizens vs. National Govs), or a contest over residual claimants?
          2.  Does the "no-demos" argument have a corporate counterpart, or does it break the model?
          3.  Is "output legitimacy" just "management by results" (unprincipled)?
          4.  Do the chambers resemble co-determination more than shareholder/management structures?
          5.  Test against Brexit: Is exit a share sale, appraisal right, or unpredicted?
      *   **Constraint:** No reading lists or scholar names. Focus on the translation and the critique of the translation.
      *   **Tone:** Professional, precise, analytical, respecting the user's expertise while challenging the limits of their framework.

  2.  **Deconstruct the Translation (The "Faithful" Part):**
      *   *Commission as Management:* Fits well. Unelected, agenda-setting power (sole right of initiative), executive function.
      *   *Council as Controlling Shareholder:* Fits well. Representing the "founders" (Member States). Veto powers, treaty changes require unanimity (like amending charter).
      *   *Parliament as Supervisory Board:* Fits well. Elected (technically), oversight, co-decision (approval of resolutions), but low engagement (turnout).
      *   *Treaties as Charter/Constitution:* Fits. "Ever Closer Union" is a mission statement that is hard to amend.
      *   *Supremacy/Direct Effect:* Fits. Holding company rules override subsidiary bylaws.
      *   *The Two Camps:*
          *   Parliamentarizers = One-share-one-vote advocates (democratizing the equity).
          *   Intergovernmentalists = Defenders of dual-class/controlled structure (States retain control).

  3.  **Address the Specific Questions (The "Residue Report"):**

      *   *Q1: Nature of Democratic Deficit (Agency vs. Residual Claimants):*
          *   It's not just Agency (States vs. Brussels). That's the "intergovernmental" view.
          *   It's not just Citizens vs. National Govs. That's the "blame shifting" view.
          *   *Translation:* It's a conflict over *who is the ultimate principal*. In corp gov, it's shareholders. In EU, is it the *peoples* (Parliament view) or the *states* (Council view)? It's a contest over residual claimancy *and* control rights. The deficit arises because the "equity holders" (citizens) feel they don't control the "board" (Commission/Parliament), but the "controlling shareholders" (States) also feel squeezed by the "holding company" (EU).
          *   *Verdict:* It's primarily a contest over who the residual claimants are, complicated by a double-layered agency problem.

      *   *Q2: The "No-Demos" Thesis:*
          *   Corp Gov Counterpart: Usually, the shareholder register is fixed. You buy stock, you are a principal.
          *   *Translation:* "No-demos" is like saying there is no common equity class. It's like saying the "shareholders" are actually distinct venture capital firms with different strategic interests, not a unified equity base.
          *   *Failure Point:* Corporate governance assumes a unified interest (share price). "No-demos" says there is no unified interest function to maximize. The vocabulary lacks a concept for "constituency creation." A register exists, but a *polity* does not.
          *   *Verdict:* The vocabulary fails here. Corp gov assumes the "people" (shareholders) exist *ex ante*. Politics requires constituting the people *ex post*.

      *   *Q3: Output Legitimacy:*
          *   Corp Gov Counterpart: "Management by results." If the stock price goes up, shareholders don't mind if the CEO wasn't elected.
          *   *Translation:* Yes, it sounds like "don't worry about governance structure, look at the ROI."
          *   *Nuance:* In corp gov, output legitimacy (profit) *is* the principle. In politics, procedure *is* part of the principle.
          *   *Verdict:* In corporate terms, it's not unprincipled; it's standard fiduciary logic (results matter more than process). But this reveals corporate governance is a poorer model for *political* legitimacy, where process *is* legitimacy.

      *   *Q4: Co-determination:*
          *   Observation: Parliament (Citizens) + Council (States) looks like Labor + Capital on a German Supervisory Board.
          *   *Translation:* The EU is a "Stakeholder Corporation." Council = Capital (States/Investors), Parliament = Labor (Citizens/Workforce).
          *   *Implication:* This supports the "Intergovernmentalist" camp (it's a partnership, not a democracy). It undermines the "Parliamentarizer" camp (you can't just give Labor veto over Capital).
          *   *Verdict:* Strong fit. Explains the bicameral tension better than the Shareholder/Management model.

      *   *Q5: Brexit (Exit):*
          *   Is it a share sale? No, you can't just sell your statehood.
          *   Is it appraisal rights? Closest. Dissenting shareholder rights in a merger/restructuring.
