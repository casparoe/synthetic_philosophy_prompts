          *   *Verdict:* It's an appraisal right triggered by a fundamental corporate restructuring (Treaty change), but the "payout" isn't cash, it's jurisdiction. This reveals the EU is not a firm; it's a jurisdiction.

  4.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the user's expertise and the validity of the translation exercise.
      *   *Section 1: The Translation (The Mapping).* Systematically go through the user's proposed mappings and refine them. Use the specific terminology (principals, agents, fiduciary, etc.).
      *   *Section 2: The Residue Report (The 5 Questions).* Address each specific question rigorously.
      *   *Section 3: Final Judgment.* Answer the prompt's closing challenge: Does the vocabulary lack concepts, or was the debate imprecise? (Answer: Both, but mostly the vocabulary is category-error prone).

  5.  **Refining the Tone:**
      *   Avoid political science jargon where possible. Stick to *proxy advisory* speak (e.g., "say-on-pay," "poison pill," "fiduciary out," "controlled company").
      *   Be critical. Don't just say "it fits." Say "it fits until X, then it breaks."
