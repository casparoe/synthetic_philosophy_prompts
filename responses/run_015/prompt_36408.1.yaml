  7.  **Final Polish:** Ensure the structure matches the prompt's requirements (Translation first, then Residue/Specific Questions). Make sure the conclusion answers the "which side is at fault" question. (Decided: The vocabulary is the limiting factor because it is teleological towards value maximization, whereas politics is teleological towards legitimacy/identity).

  *(Self-Correction on the "Residue" section)*: The prompt asks specific questions. I should structure the Residue Report *around* those questions to ensure direct compliance.

  *(Refining the "Output Legitimacy" point)*: In corporate governance, output legitimacy *is* the norm (stock price). In politics, it's controversial. I need to point out that this makes the corporate analogy *bias* the debate towards the output camp, potentially unfairly.

