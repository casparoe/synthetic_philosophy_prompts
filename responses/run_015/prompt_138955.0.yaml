prompt: |-
  Had a blazing argument in the pub last night with my mate about whether blowing thirty grand on a wedding is actually a signal of commitment. He kept saying it's costly so it's honest, end of; I kept saying cost on its own proves nothing — a signal's only honest if it costs a bloke who's going to bail in two years more than it costs one who isn't, and anyone can borrow thirty grand, so the reception is just a reciept. Problem is I'm best man at that wedding in three weeks and I've now got to write the toast. I need a three-minute speech that gets the handicap principle right without turning into a lecture: the real evidence is him turning down the Singapore posting, selling the car, and doing a reading he wrote himself in front of two hundred people, not the price tag. But I can't say "they must love each other, look at the flowers" because that's the exact move I spent all evening arguing against, and I can't insult her parents who paid for the flowers either. Can you write it so it also gets across that all I can really offer the room is the signals and not his feelings, which I've got no access to — and so it still lands when half the room think the whole wedding's a racket and the other half have never heard of any of this?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Context:** The user had a heated argument with a friend (the groom) about the economics of signaling theory (specifically the Handicap Principle) applied to weddings.
      *   **The Argument:**
          *   Friend's view: Spending £30k is an honest signal of commitment because it's costly.
          *   User's view: Cost alone isn't enough. A signal is only honest if it's *differentially costly* (harder for a "bailer" to fake than a "stayer"). Borrowing money makes it just a receipt, not a signal. Real signals are non-transferable sacrifices (turning down a job, selling a car, vulnerability).
      *   **The Task:** Write a 3-minute Best Man speech.
      *   **Constraints:**
          *   Must explain the Handicap Principle/signaling theory correctly but *not* sound like a lecture.
          *   Must highlight the *real* signals (Singapore posting, car, reading) rather than the money/flowers.
          *   Must *not* insult the parents (who paid for the flowers/wedding).
          *   Must *not* claim to know the groom's internal feelings (epistemic humility: "I can only see signals, not feelings").
          *   Must land with a mixed audience (half think weddings are a racket, half don't know the theory).
          *   Tone: Witty, warm, slightly intellectual but accessible, respectful.

  2.  **Deconstruct the Core Concept (Handicap Principle):**
      *   *Biological origin:* Peacocks' tails. They are heavy and attract predators. Only a healthy peacock can survive *despite* the tail.
      *   *Application to Groom:* Spending money is easy (credit). Real commitment is sacrificing something valuable that you can't get back (opportunities, pride, comfort).
      *   *The Twist:* The speech needs to acknowledge the money without validating it as the *proof*, while honoring the parents who paid.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, set the tone. Maybe hint at the argument without making it awkward.
      *   **The "Money" Problem:** Address the £30k elephant in the room. Acknowledge the parents' generosity (crucial constraint). Dismiss money as the ultimate proof (user's constraint).
      *   **The Theory (Simplified):** Introduce the idea of "costly signals" without using jargon like "Handicap Principle" explicitly, or if used, make it a joke. Focus on *sacrifice* vs. *spending*.
      *   **The Real Evidence:** List the specific sacrifices mentioned (Singapore, car, reading). These are the "tails" that prove fitness.
      *   **Epistemic Humility:** Admit I can't see inside his head, only his actions.
      *   **Conclusion:** Bring it back to love, toast the couple.

      *   *Self-Correction on Tone:* If I talk too much about economics, it becomes the lecture the user wants to avoid. I need to weave it into a story about knowing the groom. The argument from the pub can be a funny anecdote to frame it.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the Best Man. Last night [Groom] and I argued about weddings. He says spending money shows love. I say anyone can borrow money. Real love is sacrifice. Like when he turned down Singapore. Or sold his BMW. Or wrote this poem. I don't know his feelings, but I see his actions. Thanks to the parents for the flowers. Let's drink.

      *Critique 1:* Too dry. Needs more charm. Needs to handle the parents' payment delicately. Needs to explain *why* the Singapore thing matters more than the money.

  5.  **Drafting - Iteration 2 (Adding Flavor & Constraints):**
      Start with the pub argument. It's a good hook. "We argued about signaling theory." No, too nerdy. "We argued about what this day costs." Better.
      Address the parents: "This beautiful day was made possible by [Parents' Names]."
      Address the theory: "My mate thinks price tag = commitment. I think it's about what you give up that you can't buy back."
      The Examples: Singapore (career), Car (pride), Reading (vulnerability).
      The Humility: "I can't measure his heart, only his choices."
      The Toast.

  6.  **Refining the "Signal" Explanation:**
      I need to make sure the audience gets *why* the Singapore posting is a better signal than the flowers.
      *Flowers:* Cost money, die in a week, parents paid.
      *Singapore:* Cost career momentum, affects future, only *he* can pay that price.
      *Reading:* Cost pride, risk of embarrassment, only *he* can do that.
      This aligns with the "differential cost" idea (harder for a fake partner to do).

  7.  **Addressing the "Mixed Audience":**
      Half think it's a racket: Acknowledge the cynicism. "Some say weddings are just expensive parties."
      Half don't know the theory: Keep the biology/econ simple. "In nature, animals show off..."

  8.  **Final Polish (incorporating the "Epistemic Humility"):**
      Make sure to explicitly state: "I don't know what he feels." This satisfies the user's specific philosophical constraint.

  9.  **Writing the Speech (incorporating all points):**
      *   *Hook:* The pub argument.
      *   *Pivot:* The parents' generosity (protect them).
      *   *Core:* The difference between price and cost.
      *   *Evidence:* Singapore, Car, Reading.
      *   *Limit:* I see actions, not feelings.
      *   *Close:* The Toast.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* much like I'm winning the argument. It's a wedding, not a debate club. The conclusion must be that the signals *are* positive, even if the money isn't the proof.

      *Refining the Parents bit:* "The flowers are stunning, and we owe a huge debt to [Parents] for that." -> "But flowers are a gift *to* the couple. The sacrifices I'm talking about are gifts *from* the groom."

      *Refining the Theory:* Call it "The Peacock Theory" or just "Evolutionary Biology." Keep it light. "A peacock doesn't prove he's fit by buying a nicer tail, but by growing one heavy enough to slow him down."

      *Refining the Humility:* "I can't stand here and tell you what's in his heart. I'm not a mind reader. I'm just a witness to his calendar and his bank statements."

  10. **Final Review against constraints:**
      *   3 minutes? (approx 400-500 words).
      *   Handicap Principle right? (Yes, focus on non-transferable sacrifice).
      *   No lecture? (Keep it narrative).
      *   Real evidence included? (Singapore, car, reading).
      *   No "look at the flowers" as proof? (Yes, distinguished).
      *   Parents not insulted? (Yes, thanked for generosity).
      *   Epistemic humility? (Yes, "I only see signals").
      *   Mixed audience? (Yes, explained simply).

      *Let's write it.* (Proceeds to generate output).

      *Wait, one nuance:* The user said "costs a bloke who's going to bail in two years more than it costs one who isn't." This is the definition of an honest signal. I need to make sure the speech implies that a "bailer" wouldn't turn down Singapore. A flake wouldn't write a vulnerable reading.

      *Okay, ready.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being Best Man.

  Now, full disclosure: last night, the Groom and I were in the pub, and we had a blazing row. We were arguing about this day. Specifically, about what proves a man is committed.

  His argument was simple: "It costs thirty grand. That's the proof. It's expensive, so it's honest."

  My argument was a bit more… technical. I told him that in economics, and in nature, a price tag isn't a signal. A price tag is just a receipt. Anyone can borrow money. Anyone can rent a tux. If you want to know if a peacock is fit, you don't look at how much his feathers cost; you look at how heavy they are. You look for the things that would drag him down if he wasn't serious.

  Now, I know half the room is thinking, "Here we go, the economics lecture," and the other half is wondering if I'm about to insult the people who paid for those stunning flowers.

  Let me be clear: The flowers are beautiful. [Partner's Names/Parents' Names], your generosity has made this room look incredible, and we are deeply grateful. But flowers are a gift *to* the couple. What I'm interested in are the gifts *from* the Groom. The things that cost him something no one else could pay.

  Because I can't stand here and tell you what's in his heart. I'm not a mind reader. I don't have access to his feelings. I only have access to his actions. And as a witness to his life, I've seen three specific signals that tell me everything I need to know.

  First, the job. Six months ago, he was offered a posting in Singapore. Career gold. He turned it down. A man planning to bail in two years doesn't turn down Singapore. He books the flight.

  Second, the car. He sold the BMW. The one he loved. He said it was impractical for the future they're building. A man planning to bail doesn't sell the toys; he hides them.

  And third, the reading he's about to do. He wrote it himself. It's vulnerable, it's personal, and it risks embarrassment in front of two hundred people. A man planning to bail doesn't make himself vulnerable; he keeps his armor on.

  So, my mate was wrong about the money. The money is just the entry fee. The commitment is proved by the opportunities he killed, the pride he swallowed, and the future he anchored to this one.

  I can't verify his emotions. But I can verify his sacrifices. And by the only metrics that actually matter, he is all in.

  So, if everyone could please raise a glass. To the Groom, for the weight of his tail, and to the Bride, for being the only one worth dragging him down.

  To the happy couple.
