  3. The look-again view claims the documented twin allows a more secure historical imagination, altering the visual experience significantly even if the paint remains physically identical. Uncertainty dulls the eye, making the attributed piece feel less vivid despite the matching brushwork.

  4. The who-did-it view cannot justify the price gap since the artistic act is identical, implying the market is simply fetishising documentation rather than valuing the work itself. It suggests the higher price is a mistake, confusing evidence of the act with the act itself.

  5. The who-did-it view survives best, implying visitors feel short-changed because a copy lacks the human encounter, not because it looks inferior. Their disappointment is rational, rooted in a desire for connection rather than mere visual pleasure.
