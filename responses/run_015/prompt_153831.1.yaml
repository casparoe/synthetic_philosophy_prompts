answer: |-
  Your board must reject model swaps that merely accommodate data available to the original builders unless the new model offers independent structural predictions that survive cross-validation.

  ### The 20-Minute Bayesian Old-Evidence Checklist

  **Step 1: Temporal Existence Check (2 Minutes)**
  *   **Action:** Verify the date stamp on the raw data used to tune the new model.
  *   **Pass:** Data post-dates the original model's construction.
  *   **Fail:** Data predates the original model.
  *   **Output if Fail:** Proceed to Step 2. (Do not reject yet; old data can confirm new theories if the *relationship* is new).

  **Step 2: Epistemic Accessibility Filter (5 Minutes)**
  *   **Action:** Determine if the data was practically accessible and known to the community that built the original model.
  *   **Pass:** Data was buried, classified, technically inaccessible, or universally ignored despite existence (effectively $P(E) < 1$ for the original agents).
  *   **Fail:** Data was published, cited, or standard industry knowledge at the time (effectively $P(E) = 1$ for the original agents).
  *   **Output if Fail:** **STOP — NO.** This does not confirm anything. In Bayesian terms, if the evidence was certain to the original agents, learning it again provides zero information gain ($P(H|E) = P(H)$). This is accommodation, not confirmation.
  *   **Output if Pass:** Proceed to Step 3.

  **Step 3: Structural Independence Test (5 Minutes)**
  *   **Action:** Ask if the new model's improved fit relies on new physical mechanisms or just mathematical flexibility (parameters/transformations).
  *   **Pass:** The model introduces new causal pathways or constraints derived from theory independent of the fit.
  *   **Fail:** The model adds parameters, transformations, or tuning knobs solely to minimize error on the historical record.
  *   **Output if Fail:** **STOP — NO.** This is overfitting. Bayesian model comparison penalizes complexity; a "strange transformation" that improves fit without theoretical justification lowers the prior probability of the model being true.
  *   **Output if Pass:** Proceed to Step 4.

  **Step 4: The Value Judgment Handoff (5 Minutes)**
  *   **Action:** Assess the cost of being wrong versus the cost of switching.
  *   **Trigger:** If Steps 2 and 3 pass, the math says the model *might* be better, but not *how much* better.
  *   **Human Call:** This is not math. This is risk tolerance. Does the agency value stability (keeping the old model) or potential accuracy (risking the new model)?
  *   **Output:** Board vote based on risk appetite.

  **Step 5: Limitations Declaration (3 Minutes)**
  *   **Action:** Acknowledge what this procedure cannot settle.
  *   **Undecidable:** If you cannot assign even rough prior probabilities to the models (e.g., "How likely is this hydrology theory true?"), the Bayesian update is formal only.
  *   **Undecidable:** If the "new" data is old but the *logical connection* is subtle, Step 2 might be too harsh, but without expert testimony, you cannot judge the novelty of the logic.

  ---

  ### Application to Your Three Proposals

  **Proposal 1: The 1985 Data Cited in the 1998 Study**
  *   **Step 1:** Fail (Data is old).
  *   **Step 2:** **Fail.** The data was cited in the original study. It was epistemically available ($P(E)=1$).
  *   **Procedure Output:** **STOP — NO.**
  *   **Reasoning:** This is the textbook problem of old evidence. The 1998 modelers knew this data existed and chose their parameters accordingly. Re-feeding it into a new model provides zero confirmation power. It is purely accommodation.
  *   **Board Reaction:** You will hate this answer because the fit looks better, but the procedure correctly identifies that the improvement is illusory regarding truth confirmation.

  **Proposal 2: The 1985 Data in an Unknown Government Report**
  *   **Step 1:** Fail (Data is old).
  *   **Step 2:** **Pass.** While ontologically old, it was epistemically inaccessible to the original modelers ($P(E) < 1$ for the community).
  *   **Step 3:** Depends on model structure. Assuming the structure is standard:
  *   **Procedure Output:** **Proceed to Step 4 (Human Call).**
  *   **Reasoning:** Because the data was effectively "new" to the field, it can confirm the new hypothesis. However, you still face the risk that the model was tuned specifically to find this report.
  *   **Board Reaction:** This is the only case where a swap is epistemologically defensible without new physical measurements.

  **Proposal 3: Identical Data, Strange Transformation, Better Fit**
  *   **Step 1:** Fail (Data is old).
  *   **Step 2:** Fail (Data was known).
  *   **Step 3:** **Fail.** A "strange transformation" without theoretical backing is a complexity penalty.
  *   **Procedure Output:** **STOP — NO.**
  *   **Reasoning:** Your gut is detecting a violation of Occam's Razor, which Bayesian epistemology formalizes as a prior penalty for complexity. If the transformation isn't grounded in hydrology physics, it is curve-fitting. The better fit is purchased at the cost of reduced generalizability.
  *   **Board Reaction:** You will hate this answer because the graphs look convincing, but the procedure flags this as high risk for failure on future, unseen data (predictive failure).
