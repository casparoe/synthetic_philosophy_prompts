prompt: |-
  In my course on value pluralism we have been working through Ruth Chang’s idea of hard choices and Raz’s account of incommensurability, and I am trying to understand an institutional split that seems to presuppose one view in one domain and reject it in another. In human-subjects research ethics, institutional review boards typically operate with what looks like a lexical veto structure: if a protocol violates informed consent or exposes participants to disproportionate risk, it is rejected outright, regardless of how large the expected scientific or social benefit might be. The harm and the good are not balanced on a common scale; they are evaluated on independent tracks with disqualifying conditions. By contrast, the same health systems often use cost-effectiveness analysis—cost per QALY, for instance—to aggregate lives saved and resources spent into a single metric for public-health funding decisions. What philosophical commitments about value comparison does this divergence presuppose? Does the IRB practice assume that autonomy and welfare are genuinely incommensurable, or does it merely reflect a practical refusal to compare them? Could a defender of hard choices endorse the lexical structure in research ethics while rejecting aggregation in health policy, or is the split just institutional convenience with no coherent philosophical basis? Reconstruct the implicit theory of value that licenses treating these two domains differently, distinguish what the practice strictly requires from what it merely accommodates, and say what would have to change in either practice if we replaced the implicit view with a consistently comparativist or consistently non-comparativist framework.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Value Pluralism, specifically Ruth Chang's "Hard Choices" vs. Joseph Raz's "Incommensurability."
      *   **Observation:** An institutional split in bioethics/health policy.
          *   Domain A: Human-Subjects Research (IRBs). Structure: Lexical veto (deontological constraints). Informed consent/risk limits cannot be traded off against benefit.
          *   Domain B: Public Health Funding (Cost-Effectiveness/QALYs). Structure: Aggregative consequentialism (utilitarian calculus). Lives/resources traded on a single scale.
      *   **Questions to Address:**
          1.  What philosophical commitments about value comparison does this divergence presuppose?
          2.  Does IRB practice assume genuine incommensurability or just a practical refusal?
          3.  Could a defender of Hard Choices endorse this split, or is it incoherent?
          4.  Reconstruct the implicit theory of value licensing the split.
          5.  Distinguish what practice *requires* vs. *accommodates*.
          6.  What would change if we adopted a consistently comparativist or non-comparativist framework?

  2.  **Analyze the Philosophical Frameworks:**

      *   **Raz (Incommensurability):** Values are qualitatively different. No common measure exists. Sometimes options are not better, worse, or equal; they are "on a par" or simply incomparable. Rights often function as exclusionary reasons (protecting autonomy from utilitarian calculus).
      *   **Chang (Hard Choices/Parity):** Values might be comparable even without a common metric. "Parity" is a fourth relation (better, worse, equal, *on a par*). Hard choices allow for will-based commitment to create reasons. She is more open to comparability than Raz, but acknowledges the difficulty of trade-offs.
      *   **Comparativism (Utilitarianism/Economics):** Everything can be reduced to a common denominator (utility, money, QALYs). Trade-offs are always possible.
      *   **Lexical/Deontological Constraints:** Certain values (rights, autonomy) trump others regardless of magnitude.

  3.  **Analyze the Institutional Split:**

      *   **IRB (Research Ethics):** Heavily influenced by the Belmont Report and Declaration of Helsinki. Core principles: Respect for Persons (Autonomy), Beneficence, Justice. *Respect for Persons* often manifests as side-constraints (informed consent). You can't sacrifice one person's rights for the many. This looks like Razian incommensurability or at least lexical priority.
      *   **Public Health (QALYs):** Heavily influenced by health economics. Core principle: Maximize health outcomes given scarce resources. This is classic aggregative comparativism.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. It's a classic clash between deontology (rights-based) and consequentialism (outcome-based), mapped onto Raz/Chang.
      *   **Implicit Theory of Value (The "Dual-Track" Theory):** The system presupposes a *context-dependent ontology of value*.
          *   In *Research*, the individual is the locus of value. Autonomy is a side-constraint (Razian exclusionary reason).
          *   In *Policy*, the population is the locus of value. Welfare is aggregable (Comparativist).
          *   *Philosophical Commitment:* This isn't just convenience; it assumes a distinction between *constitutive values* (dignity/agency) and *distributive values* (health outcomes).
      *   **IRB Practice: Incommensurability vs. Practical Refusal:**
          *   Is it genuine incommensurability? Yes, in the Razian sense. Rights act as "trumps" (Dworkin) or exclusionary reasons. You cannot say "1000 cures justify 1 non-consensual experiment."
          *   Is it just practical? No, because the justification is principled (Kantian dignity), not epistemic (we don't know how to measure).
      *   **Chang's Hard Choices & The Split:**
          *   Could Chang endorse this? Chang argues we *can* compare via parity. However, she acknowledges that commitments create reasons.
          *   *Endorsing the split:* One could argue that the "commitment" to individual rights in research creates a normative landscape where trade-offs are ruled out by the nature of the relationship (researcher-subject), whereas policy is about stewardship of resources.
          *   *Coherence:* It's coherent if we view the *roles* as different. Researcher = Fiduciary to subject. Policymaker = Fiduciary to population.
      *   **Requirements vs. Accommodations:**
          *   *Requires:* IRB requires that autonomy cannot be *outweighed* by aggregate good. Policy requires that resources *must* be weighed against outcomes.
          *   *Accommodates:* IRB accommodates risk/benefit analysis *within* the constraint (minimal risk, favorable ratio), just not trading rights for benefits. Policy accommodates equity concerns (weighting QALYs for the disadvantaged), but still aggregates.
      *   **Shifting Frameworks (The Counterfactuals):**
          *   *Consistently Comparativist (Full QALY everywhere):* IRBs would allow "human challenge trials" without full consent if the social benefit is high enough. (Human sacrifice for the greater good).
          *   *Consistently Non-Comparativist (Full Razian Incommensurability everywhere):* Health policy would collapse. You couldn't choose funding Cancer A over Cancer B if the values are incommensurable. Rationing becomes impossible or purely political/arbitrary.
      *   **Conclusion:** The split reflects a "moderate pluralism." It accepts comparability for distributive justice (policy) but rejects it for constitutive justice (rights).

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Be careful not to conflate Chang and Raz too much. Raz is stricter on incommensurability. Chang allows for parity. The IRB model looks more Razian (exclusionary reasons). The QALY model is strictly comparativist.
      *   *Nuance:* The prompt asks about the *implicit theory*. The theory is likely a form of **Domain-Specific Normative Realism**. Values differ based on the social practice.
      *   *Chang's specific contribution:* Chang might argue the IRB veto isn't because values are incomparable, but because we *commit* to a norm that makes them non-tradeable. It's a will-based construction of the normative landscape.
      *   *Key Distinction:* The "Individual vs. Collective" distinction is the bridge.

  6.  **Final Polish:** Ensure the tone is academic, precise, and directly answers the specific sub-questions in the prompt. (Check: Did I distinguish requirements from accommodations? Yes. Did I address what would change? Yes.)

  7.  **Structure of the Output:**
      1.  Introduction: Framing the tension.
      2.  The Implicit Theory: Domain-Relative Value Ontology.
      3.  IRB & Incommensurability: Razian Exclusionary Reasons.
      4.  Chang's Hard Choices & The Split: Parity vs. Veto.
      5.  Requirements vs. Accommodations.
      6.  Counterfactuals: Consistent Comparativism vs. Non-Comparativism.
      7.  Conclusion.

  *(Self-Correction during drafting)*: Make sure to explicitly mention "exclusionary reasons" regarding Raz, as that's key to the lexical veto. For Chang, emphasize "parity" and "commitment." Ensure the distinction between *constitutive* constraints (IRB) and *allocative* optimization (QALY) is clear.

  8.  **Final Review against Prompt:**
      *   Philosophical commitments? (Domain specificity, rights as trumps).
      *   IRB: Incommensurable or practical? (Principled/Incommensurable).
      *   Chang defender endorsement? (Possible via commitment/role morality).
      *   Reconstruct implicit theory? (Dual-track normative ontology).
      *   Requirements vs. Accommodations? (Veto required vs. risk/benefit accommodated).
      *   What would change? (Human sacrifice vs. Policy paralysis).

  Proceed to generate response.
answer: |-
  This institutional split reflects a sophisticated, albeit often unarticulated, form of **domain-relative normative pluralism**. It presupposes that the ontology of value shifts depending on the social practice in question: specifically, whether the practice is constituted by **fiduciary relationships to individuals** (research ethics) or **stewardship of collective resources** (public health policy).

  Here is a reconstruction of the implicit theory of value, an analysis of its coherence through the lenses of Raz and Chang, and an examination of the consequences of enforcing consistency.

  ### 1. The Implicit Theory of Value: Dual-Track Normative Ontology

  The divergence between IRB protocols and QALY-based policy presupposes that value is not monolithic. It operates on a **Dual-Track Theory**:

  1.  **The Deontological Track (Research):** In the context of human-subjects research, the individual participant is the locus of moral value. Autonomy and bodily integrity are treated as **constitutive constraints**. They are not goods to be maximized but boundaries that define the moral permissibility of the action itself.
  2.  **The Consequentialist Track (Policy):** In the context of public health allocation, the population is the locus of moral value. Health outcomes are treated as **distributive goods**. They are commensurable units (QALYs) that can be aggregated and traded to maximize total welfare.

  **Philosophical Commitment:** This split commits to the view that **rights function differently than goods.** It assumes that while health outcomes are comparable (one life saved is roughly comparable to another), the *process* by which health is achieved (respecting agency) introduces a value dimension that is not fungible with the outcome. This aligns closely with Joseph Raz's concept of **exclusionary reasons**.

  ### 2. IRB Practice: Genuine Incommensurability or Practical Refusal?

  Does the IRB's lexical veto assume genuine incommensurability, or is it merely a heuristic for uncertainty?

  **It presupposes genuine Razian incommensurability.**
  If the refusal to trade consent for benefit were merely practical (epistemic humility), the veto would be defeasible given enough evidence. For example, if we knew with certainty that violating one person's consent would save a million lives, a merely practical refusal would allow the trade-off. However, IRB guidelines (e.g., the Belmont Report, Declaration of Helsinki) treat informed consent as a **side-constraint**.

  *   **Razian Analysis:** Raz argues that certain values (like rights) provide exclusionary reasons for action—they exclude the consideration of other reasons (like aggregate utility). The IRB structure treats autonomy not as a weight on a scale, but as a rule that removes the scale from the equation. The value of "respect for persons" is incommensurable with "social benefit" because they belong to different normative categories (the right vs. the good).
  *   **Why not just practical?** Because the justification is Kantian, not utilitarian. The subject is an end in themselves, not a means. To treat them as a means (even for great good) is to misunderstand the value of their agency.

  ### 3. Can a Defender of Hard Choices (Chang) Endorse the Split?

  Ruth Chang's framework of **parity** and **hard choices** offers a nuanced way to defend this split without resorting to strict Razian incommensurability.

  *   **Parity vs. Incommensurability:** Chang argues that options can be "on a par"—comparable but not by virtue of one being better or them being equal. A defender of Hard Choices could argue that in research ethics, autonomy and scientific benefit are *on a par*, but our **normative commitment** to the research enterprise dictates that autonomy wins.
  *   **The Role of Commitment:** For Chang, hard choices allow us to exercise our normative agency to *create* reasons. A society can commit to a norm where individual rights trump aggregate good in research contexts. This commitment makes the trade-off impermissible not because the values are incomparable in principle, but because the **identity of the practice** (research) is defined by that commitment.
  *   **Coherence of the Split:** A Changian can endorse the split by arguing that different social practices involve different **normative standpoints**.
      *   *Researcher Standpoint:* You stand in a fiduciary relation to the subject. Your commitment is to *their* welfare and agency. Aggregating their harm against strangers' benefit violates the specific reasons generated by this relationship.
      *   *Policymaker Standpoint:* You stand in a stewardship relation to the population. Your commitment is to justice and efficiency across the group. Here, aggregation is required to fulfill the commitment to fair distribution.

  Thus, the split is not incoherent; it reflects that **value is relation-dependent**. The "hard choice" is resolved differently depending on the role one occupies.

  ### 4. Requirements vs. Accommodations

  To understand the stability of this system, we must distinguish what the practices *strictly require* versus what they *accommodate*.

  | Domain | Strictly Required (Non-Negotiable) | Merely Accommodated (Flexible) |
  | :--- | :--- | :--- |
  | **IRB (Research)** | **The Lexical Veto:** No violation of core rights (consent, minimal risk threshold) can be outweighed by aggregate benefit. | **Risk/Benefit Ratios:** *Within* the constraint of consent, risks are balanced against benefits. We do compare harms and benefits, provided rights are not violated. |
  | **Policy (QALY)** | **Aggregation:** Resources must be allocated to maximize total health value (or a weighted variant). Incommensurability is rejected. | **Equity Weights:** The system can accommodate giving more weight to the severely ill or disadvantaged, but this is still done *within* the calculative framework (e.g., weighting a QALY higher), not by veto. |

  **The Implicit Theory:** The system requires **comparability of outcomes** (Policy) but **non-comparability of rights violations** (IRB). It accommodates nuance within those tracks (e.g., waiving some consent elements in minimal risk research; adjusting QALYs for equity), but the structural logic remains distinct.

  ### 5. Counterfactuals: Enforcing Consistency

  If we replaced this implicit dual-track view with a consistently monistic framework, the institutional landscape would change drastically.

  #### A. Consistently Comparativist Framework (Full Utilitarianism)
  *   **Philosophy:** All values (autonomy, life, welfare) can be reduced to a common metric (e.g., preference satisfaction).
  *   **Impact on IRB:** The lexical veto disappears. Informed consent becomes a variable in a cost-benefit analysis.
      *   *Scenario:* A "human challenge trial" where participants are infected without full understanding could be approved if the expected QALYs saved in the population outweigh the QALYs lost/damaged in the subjects.
      *   *Result:* Instrumentalization of persons. Research becomes a form of resource extraction from the few for the many.
  *   **Impact on Policy:** Remains largely the same, perhaps more aggressive in rationing.

  #### B. Consistently Non-Comparativist Framework (Full Razian Incommensurability)
  *   **Philosophy:** Values are qualitatively distinct and often incomparable; aggregation is illegitimate.
  *   **Impact on Policy:** Cost-effectiveness analysis collapses.
      *   *Scenario:* A health ministry cannot choose to fund a cancer drug over a heart disease drug if the values (saving a 40-year-old vs. a 70-year-old) are incommensurable. There is no "common scale" to justify the trade-off.
      *   *Result:* **Policy Paralysis.** Without aggregation, rationing becomes arbitrary or purely political ("first come, first served"). We could not justify spending \$1 million on one rare disease patient if that money could save 1,000 others, because the "one life" is not commensurable with the "1,000 lives."
  *   **Impact on IRB:** Remains largely the same, reinforcing the veto.

  ### Conclusion

  The institutional split presupposes a **Moderate Pluralism** that is philosophically robust. It rejects the view that *all* values are commensurable (avoiding the utilitarian sacrifice of the individual) while rejecting the view that *no* values are commensurable (avoiding policy paralysis).

  It licenses treating the domains differently by distinguishing between **constitutive norms** (what makes research *research* rather than exploitation) and **allocative norms** (how to distribute scarce goods justly). A defender of Hard Choices can endorse this by viewing the lexical veto not as a metaphysical fact about value, but as a **normative commitment** essential to the integrity of the researcher-subject relationship, whereas aggregation is the commitment essential to the fairness of public stewardship. To enforce consistency in either direction would destroy the moral integrity of one domain or the functional viability of the other.
