  4.  **Drafting the Replies:**
      *   Must be conversational, respectful, but firm on the thesis.
      *   Must acknowledge the validity of their concern while pivoting back to the "grain" argument.
      *   Must identify the "soft spot" (where the argument is vulnerable).

  5.  **Pre-emptive Concessions:**
      *   Need to disarm the "pop-sci moralizer" assumption immediately.
      *   Need to acknowledge that *some* collapses are real (don't overclaim).
      *   Need to validate the stakes (climate change is real, even if "collapse" is the wrong word).

  6.  **The "One Question I Hope Nobody Asks":**
