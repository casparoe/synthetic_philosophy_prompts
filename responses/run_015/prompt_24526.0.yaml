answer: |-
  You are right: the fact that it's a copy does no real work in undermining moral status. It only undermines personal identity.

  Personal identity asks, "Is this the same continuing self?" If uploading is destructive copying, the original died. The upload is a psychological twin, not a continuation.

  Moral status, however, depends on *capacities*, not origin. Does the upload suffer? Is it conscious? If yes, it is a moral patient. Claiming "it's a copy, therefore it has no moral standing" is a non-sequitur. It conflates historical continuity with present sentience. A clone is genetically a "copy," yet possesses full human rights. Similarly, a digital mind replicating human consciousness possesses the internal properties that grant moral worth.

  For your novel, this means the upload can be a distinct person from the protagonist while still deserving rights. The tragedy isn't that the upload is a "fake" person, but that the original died while a new, equally valid consciousness inherited their memories. The copy fact matters for inheritance and relationships, but not for the right to exist without suffering.
