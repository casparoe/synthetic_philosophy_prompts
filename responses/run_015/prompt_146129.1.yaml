answer: |-
  The dispute between epistemicism and supervaluationism regarding vagueness presents a fundamental divergence in how institutional decision-makers must conceptualize the relationship between statutory language and biological reality. In the context of synthetically modified organisms (SMOs) displaying intermediate phenotypic traits, the core tension lies between the legal necessity for binary classification (native vs. invasive) and the ontological continuity of the organisms. The following analysis addresses the implications of each view for regulatory procedure, focusing on determinacy, default rules, and generational drift.

  ### 1. Epistemicism and the Commitment to Hidden Determinacy

  Epistemicism maintains that vagueness is solely a matter of ignorance. According to this view, predicates like "native species" have sharp boundaries in extension, even if human cognitive or linguistic limitations prevent us from locating them precisely. In the context of SMO regulation, an epistemicist framework commits regulators to the proposition that every organism, regardless of how intermediate or unstable its traits, determinately falls into one category or the other. There is no third option; the organism *is* either native or invasive, and the borderline status reflects only the regulator's lack of knowledge, not a lack of fact.

  This commitment carries significant practical and ethical costs. Practically, it forces the institution to act with a certainty it cannot possess. Because the boundary is sharp but unknowable, any decision procedure adopted to classify borderline SMOs is essentially guessing at a hidden fact. If the regulator classifies a borderline SMO as "invasive," epistemicism dictates that this decision is either objectively correct or objectively incorrect, regardless of the evidence available. This creates a regime of strict liability where regulators or regulated entities may be penalized for misclassifying an organism based on a boundary that was, in principle, inaccessible at the time of decision.

  Ethically, this hidden determinacy generates problems of fairness and notice. Regulated entities cannot orient their conduct around a boundary that is metaphysically sharp but epistemically opaque. If two nearly identical SMOs differ by a single genetic marker that crosses the hidden threshold, epistemicism implies they deserve radically different legal treatment (e.g., one is protected, the other is eradicated). Enforcing such a distinction violates the principle that like cases should be treated alike, as the "likeness" is judged by observable traits while the legal consequence turns on an unobservable fact. The cost is a system that claims objective justification for what appears to be arbitrary enforcement, undermining the legitimacy of the regulatory body.

  ### 2. Supervaluationism and Principled Default Rules

  Supervaluationism posits that vagueness involves genuine indeterminacy. A statement about a borderline SMO is neither true nor false because the predicate "native species" is not precise enough to cover the case. Truth is defined via "admissible precisifications": a claim is supertrue only if it holds across all reasonable ways of making the predicate precise. In the borderline region, the claim "this is a native species" is neither supertrue nor superfalse; it suffers from a truth-value gap.

  The challenge for a supervaluationist regulatory framework is justifying a default rule, such as "provisionally exclude from protected status," without contradicting the claim that there is no fact of the matter. If the regulator asserts, "This organism is not native," they assert a falsehood (or a claim lacking truth value), thereby presupposing the ontological fact their framework denies.

  However, supervaluationism can justify such a rule by distinguishing between *semantic truth* and *procedural validity*. The framework allows that while the statement "X is invasive" lacks a truth value, the institutional command "Treat X as invasive for regulatory purposes" is a valid act of precisification. The justification for the default rule cannot be ontological (i.e., "we are discovering its true status"); it must be pragmatic or normative (e.g., based on the precautionary principle). The regulator explicitly acknowledges that the classification is a stipulation designed to resolve the truth-value gap, not a report on the organism's intrinsic nature.

  To remain consistent, the institution must frame the default rule as a tie-breaking mechanism rather than a truth-tracking mechanism. This avoids presupposing an ontological fact because the rule does not claim to close the gap in reality, but only to close the gap in decision-making. The ethical advantage is transparency: the regulator admits the indeterminacy and takes responsibility for the stipulation, rather than masking a policy choice as the discovery of a hidden boundary.

  ### 3. Responses to Cumulative Generational Drift

  The scenario of cumulative generational drift, where successive modifications gradually shift an organism from clear native to clear invasive status, presents a Sorites-like challenge. The core question is whether the category change occurs at a discrete point or across an extended zone.

  **The Epistemicist Response:**
  Epistemicism entails that there is a discrete point of category change. Somewhere in the sequence of generations, there is a specific generation $n$ that is "native" and generation $n+1$ that is "invasive." For the regulator, this implies that a continuous biological process contains a discontinuous legal breakpoint. The institutional response must theoretically aim to identify this breakpoint. However, since the boundary is unknowable, the regulator cannot reliably locate generation $n$. This leads to a "lottery" problem in enforcement: two regulators assessing adjacent generations might issue contradictory rulings, and both cannot be correct. The epistemicist view forces the institution to deny the continuity of the drift in favor of a binary switch, creating friction between the smooth biological reality and the jagged legal application.

  **The Supervaluationist Response:**
  Supervaluationism accommodates the drift by acknowledging an extended zone of indeterminacy (a penumbra). As the organism drifts, it moves from a region where "native" is supertrue, through a region where "native" is indeterminate, to a region where "native" is superfalse. There is no discrete point of change; rather, there is a transition through the truth-value gap.

  For the regulator, this justifies a tiered or transitional regulatory status. Instead of forcing a binary choice at an arbitrary point, the institution can designate the drift zone as a distinct category (e.g., "provisional status subject to review"). This aligns the legal procedure with the ontological structure of the vagueness. The regulator does not need to find a threshold because the theory denies one exists. The implication is a more flexible administrative process that tracks the degree of modification rather than searching for a non-existent bright line. However, this requires statutes that allow for indeterminate statuses; if the law mandates a binary outcome, the supervaluationist regulator must impose a precisification (as noted in section 2) but should recognize that the "change" occurs only by fiat, not by nature.

  ### Conclusion

  The implications of this dispute for institutional decision procedures are profound. Epistemicism demands that regulators treat vague predicates as precise, imposing high ethical costs related to arbitrariness and lack of notice when dealing with continuous biological phenomena like SMO drift. It forces a binary ontology onto a gradient reality. Supervaluationism, by contrast, allows regulators to acknowledge the indeterminacy, justifying default rules as pragmatic stipulations rather than ontological discoveries. It permits regulatory procedures that mirror the extended zone of the borderline, offering a framework better suited to managing cumulative drift without falsely claiming the existence of sharp boundaries. The choice between them is ultimately a choice between the authority of bivalent law and the honesty of indeterminate reality.
