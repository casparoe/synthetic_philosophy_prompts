answer: |-
  Good evening.

  For those who do not know me, I have had the privilege of working alongside our guest of honour for many years. For those who do know me, you will know that I am acutely aware of the peculiar challenge standing here tonight. We are gathered to celebrate a retirement. But to celebrate a retirement is usually to mark the end of a period of instrumental labour—the cessation of work done in exchange for status, income, or future security. It is to say: 'You have built enough credits in the ledger; now you may rest.'

  But our honoree has spent a lifetime arguing, with rigorous and beautiful precision, that the ledger is a fiction. She has defended the proposition that the only things good in themselves are the pleasures of human intercourse and the enjoyment of beautiful objects. She has argued that the value of these things is not a means to an end, but the end itself. And she has insisted that a life is an organic unity, whose value cannot be calculated by summing its parts.

  So, how does one toast a career dedicated to the proposition that careers are not the primary locus of value? How does one praise a life without reducing it to the very metrics she spent forty years dismantling?

  To our colleagues in the room: we know the weight of her contribution. She did not defend G. E. Moore's intuition because it was convenient. She defended it because it was true. In an academic climate that often rewards the complexification of trivialities, she remained steadfastly focused on the fundamental architecture of the good. She taught us that to confuse the intrinsic with the instrumental is not just a philosophical error; it is a moral blindness. Her publications were not bricks laid to build a reputation. They were acts of fidelity. They were attempts to clear the conceptual undergrowth so that we might see, clearly and without distortion, what actually matters. To treat her scholarship as merely a vehicle for her professional advancement would be to commit the very naturalistic fallacy she spent her life exposing. Her work was valuable not because of what it produced for her, but because of what it clarified for us.

  To her family and friends: you know the texture of her days. You know that she turned down promotions that would have demanded she sacrifice her Sunday mornings at the gallery. You know that she chose offices closer to the park, not for the view, but for the walk. To the conventional eye, these might look like compromises. They might look like opportunities missed. But you know, better than anyone, that these were not concessions to leisure. They were the central project.

  When she walked with old friends, she was not 'recharging' for work. When she stood before a Turner or a O'Keeffe, she was not 'cultivating' herself for social capital. These moments were not the fuel for the engine; they were the destination. You loved her not for what she achieved, but for who she was in those moments of shared attention. You witnessed a life lived in accordance with a rare conviction: that being present with a friend, or being moved by a colour, is not a distraction from a serious life, but the only serious thing there is.

  And yet, we must not shy away from the tension. It would be a falsehood to say her life was simply happy. It would be equally false to say her life was simply successful. The value of her life outstrips both categories.

  Moore spoke of organic unities. He meant that the value of a whole is not necessarily proportional to the sum of the values of its parts. A life is not a bucket to be filled with discrete units of pleasure or achievement. It is a composition.

  Looking at her life as a whole, we see something that neither the theorists nor the family can see entirely on their own. The theorists see the argument; the family sees the practice. But the truth lies in the unity of the two. Her life is valuable not because she wrote papers *and* loved her friends. It is valuable because of the specific way those things were arranged. The integrity of refusing the promotion *because* of the commitment to the theory creates a value that exists in the structure of the life itself.

  There is a beauty in a life that refuses to be instrumentalised. In a world that constantly asks 'what is this for?', she lived an answer that said 'this is for itself'. That is a difficult thing to sustain. It requires a fortitude that looks like stubbornness to the ambitious and like indulgence to the pragmatic. But to us, looking at the whole picture, it looks like freedom.

  She has shown us that one can inhabit the institutional world without being of it. She navigated the university, published the journals, and supervised the students, all while maintaining that these things were secondary. She managed to be a professional philosopher without ever treating philosophy as a profession in the soul-deadening sense. She kept the centre of gravity exactly where it belonged: in the shared laugh, the quiet contemplation, the recognised face, the captured light.

  So, we do not toast her retirement as an escape from work. We toast it as a continuation of her life's work. The lectures may cease, but the appreciation of beauty and the cultivation of friendship must, by her own lights, continue. Indeed, they must intensify.

  We raise our glasses not to what she has gained, nor to what she has left behind. We do not drink to her status, nor merely to her happiness. We drink to the intrinsic value of her presence among us. We drink to the organic unity of a life lived without apology for what it loves.

  To our friend, our colleague, and our teacher. To the good itself, as she has shown it to us.

  Cheers.
