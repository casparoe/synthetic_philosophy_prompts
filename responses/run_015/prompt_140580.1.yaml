      *   **The Intrapersonal Case:** A single life with high well-being periods and low well-being periods.
          *   *Scenario A:* Lower the highs to match the lows (no gain to lows). Is this better? (Analogue to Leveling Down).
          *   *Scenario B:* Lower the highs slightly to raise the lows significantly (weighted trade-off). Prioritarianism might endorse this.
      *   **User's Observation:** People who reject interpersonal leveling down often accept intrapersonal leveling down (or "smoothing"). They call the spiky life "worse shaped."
      *   **User's Questions:**
          1.  Does the intrapersonal version have a specific name?
          2.  Is the intuition different (equality within a life vs. priority to the worse off)?
          3.  Where is the boundary between interpersonal and intrapersonal cases (especially regarding psychological continuity)?
          4.  Carve the phenomenon: What is it, what is it not, which arguments fit?

  2.  **Deconstruct the Philosophical Landscape:**

      *   **Interpersonal Leveling Down:** This is the classic *Leveling Down Objection* (LDO) against *Telic Egalitarianism*. Parfit is the key figure here (*Equality or Priority?*). Telic Egalitarians say equality is intrinsically good. Prioritarians say we should benefit the worse off, but equality itself isn't the goal. The LDO says: If equality is intrinsically good, a world where everyone is equally miserable is *in some respect* better than a world where some are happy and some are miserable, even if no one is better off. Most find this absurd.

      *   **Intrapersonal Distribution:** This falls under *Prudence*, *Rational Choice over Time*, or *Distributive Justice within a Life*.
      *   **Key Concept 1: Pigou-Dalton Principle (Transfers).** In economics/ethics, a transfer from rich to poor that doesn't reverse ranks is an improvement. This applies inter- and intra-personally.
      *   **Key Concept 2: Temporal Neutrality vs. Time-Slice Views.** Does it matter *when* goods occur?
      *   **Key Concept 3: The Shape of a Life.** Velleman, Slote, and others discuss whether a rising trajectory is better than a falling one, or a smooth one better than a spiky one.
      *   **Key Concept 4: Personal Identity/Continuity.** Parfit's *Reasons and Persons*. If psychological continuity is weak, the intrapersonal case starts looking interpersonal (the "Successive Self" view).

  3.  **Address the Specific Scenarios:**

      *   **Scenario 1 (Intrapersonal Leveling Down):** 30 years @ 90 + 30 years @ 30 $\rightarrow$ 30 years @ 30 + 30 years @ 30. Total well-being drops massively.
          *   *Standard View:* This is irrational/prudentially bad.
          *   *User's Observation:* Some call it "worse shaped."
          *   *Philosophical Label:* This is often discussed under **"The Shape of a Life"** or **"Temporal Equality."** However, strictly speaking, rejecting this is just rejecting *intrapersonal leveling down*.
          *   *Is there a name?* Not as famous as the interpersonal LDO. Sometimes called the **"Intrapersonal Leveling Down Objection."** But the intuition that "smooth is better" is often linked to **diminishing marginal utility** (concave utility function) rather than equality *per se*.

      *   **Scenario 2 (Intrapersonal Prioritarianism):** 30 years @ 90 + 30 years @ 30 $\rightarrow$ 30 years @ 80 + 30 years @ 40 (or similar trade-off).
          *   *Standard View:* If utility is concave (diminishing marginal returns), this increases total *utility* even if total *well-being units* drop.
          *   *Distinction:* Is the view committed to equality (Telic) or priority (Prioritarian)?
          *   *User's Point:* If the weighting is steep enough, it mandates leveling down (Scenario 1).
          *   *Philosophical Label:* This touches on **"Intrapersonal Prioritarianism"** or **"Prudential Prioritarianism."**

  4.  **Synthesize the "Carving":**

      *   **The Interpersonal/Intrapersonal Divide:** The crucial distinction is *Personal Identity*.
          *   If Person-Time-Slice A and Person-Time-Slice B are the *same person*, standard rational choice theory (maximizing lifetime well-being) usually dominates.
          *   If they are *different persons* (interpersonal), equality/priority views apply.
          *   *Parfit's Reductionist View:* If psychological connectedness is low, the intrapersonal case *becomes* interpersonal. This answers the user's question about psychological discontinuity.

      *   **The "Shape" Intuition:** Why do people accept intrapersonal leveling down but reject interpersonal?
          *   *Explanation 1: Diminishing Marginal Utility.* A unit of well-being is worth more at 30 than at 90. So smoothing increases *value* even if it decreases *sum*. This isn't equality; it's efficiency.
          *   *Explanation 2: Integrity/Narrative.* A life with extreme swings might be less coherent.
          *   *Explanation 3: Risk Aversion.* Behind a veil of ignorance (not knowing *when* you are), you'd choose the smooth life.

      *   **The Specific Argument Name:** The user is looking for the specific analogue to the Leveling Down Objection.
          *   In the literature, this is often discussed in the context of **"Temporal Distribution"** or **"Distribution within a Life."**
          *   McKerlie is a key name here (Equality between age groups).
          *   Daniels ("Am I My Parents' Keeper?") discusses age groups.
          *   But the specific "Leveling Down within a Life" is less named. It is often subsumed under **"The Principle of Diminishing Marginal Value of Well-Being."**

  5.  **Drafting the Response:**

      *   **Acknowledge the Insight:** Validate that this is a sharp observation. The asymmetry between inter- and intra-personal intuitions is real and significant.
      *   **Name the Interpersonal Case:** Confirm it's the **Leveling Down Objection** (Parfit) against **Telic Egalitarianism**.
      *   **Name the Intrapersonal Case:** It doesn't have a single canonical name like LDO, but it falls under **"Intrapersonal Distribution,"** **"Prudential Rationality,"** or **"Temporal Equality."** The specific intuition that "smooth is better" is often explained by **Concavity of the Good** (Diminishing Marginal Utility).
      *   **Address the "Shape" Intuition:** Explain *why* people accept intrapersonal leveling. It's usually not because they value equality *intrinsically* within a life, but because they assume a **concave transformation function**. If $V(W)$ is concave, then $V(90) + V(30) < 2 \times V(60)$. This avoids the LDO because the *value* goes up even if the *sum of well-being* goes down.
      *   **Address the Steep Weighting (Scenario 2):** If the weighting is so steep it mandates pure leveling down (no gain to the low), this is **Intrapersonal Telic Egalitarianism**. Most reject this as irrational (unless psychological continuity breaks).
      *   **The Boundary (Psychological Continuity):** This is the crux. Cite **Parfit's Reductionism**. If the "good years self" and "bad years self" don't care about each other, the intrapersonal case *collapses* into the interpersonal case. This validates the user's suspicion that the boundary moves.
      *   **Key Literature/Names:**
          *   Derek Parfit (*Reasons and Persons*, *Equality or Priority?*).
          *   Larry Temkin (on equality).
          *   Dennis McKerlie (Equality and time).
          *   Norman Daniels (Just health care across ages).
          *   David Velleman (Shape of a life).
          *   Michael Otsuka & Alex Voorhoeve (Priority vs. Equality).
      *   **Conclusion/Carving:**
          1.  **Interpersonal Leveling Down:** Rejected by almost everyone (LDO).
          2.  **Intrapersonal Smoothing (with gain):** Accepted via Diminishing Marginal Utility (Prioritarianism/Utilitarianism with concave utility).
          3.  **Intrapersonal Leveling Down (no gain):** Generally rejected as irrational *unless* psychological continuity is severed (making it interpersonal).
          4.  **The "Shape" View:** A distinct aesthetic/narrative view, not strictly distributive.

  6.  **Refining the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to conflate Prioritarianism with Utilitarianism with diminishing marginal utility. They are mathematically similar but philosophically distinct (one is about value of outcomes, one about sum of utility). The user is asking about the *structure* of the argument.
      *   *Clarification:* Ensure the distinction between "Equality is intrinsically good" (Telic) and "Benefits to worse off matter more" (Prioritarian) is clear in the intrapersonal context.
      *   *Focus:* The user wants the phenomenon *carved*. I need to be precise about where the intuition comes from. Is it equality? Or is it risk-aversion/marginal utility?
      *   *Key Insight:* The reason people accept intrapersonal leveling is usually because they implicitly treat well-being as having diminishing marginal *value*. If you strip that away (as the user does in the "no gain" scenario), the intuition should vanish. If it doesn't, it's a specific "Intrapersonal Egalitarianism" which is rare.

  7.  **Final Polish:** Check tone (professional, analytical, respectful of expertise). Ensure all parts of the prompt are answered. (Names, boundaries, psychological discontinuity, carving).

      *   *Search query check (mental):* "Intrapersonal leveling down objection". Results often point to Parfit or discussions on "Prudential Concern".
      *   *Key term:* **"The Separateness of Persons"**. This is the standard barrier. The user is asking what happens when we look *inside* that separation.
      *   *Key term:* **"Time-Slice Conception of the Person"**.

      *   *Structure of Response:*
          1.  Validate the observation (The Asymmetry).
          2.  Name the Interpersonal Case (LDO, Telic Egalitarianism).
          3.  Name the Intrapersonal Case (Prudential Rationality, Temporal Distribution).
          4.  Explain the "Smoothing" Intuition (Concavity vs. Equality).
