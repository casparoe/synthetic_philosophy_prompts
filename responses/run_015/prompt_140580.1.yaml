answer: |-
  This is a precise and significant observation. You have identified a genuine asymmetry in the literature: the **Leveling Down Objection (LDO)** is treated as decisive in the interpersonal case, yet a structurally identical move is often accepted (or at least treated as "shapely") in the intrapersonal case.

  Here is the carving you are looking for: the names, the boundary conditions, and the distinct philosophical mechanisms at play.

  ### 1. The Interpersonal Case: Telic Egalitarianism vs. Prioritarianism
  You are correct about the standard nomenclature here.
  *   **The View:** **Telic Egalitarianism**. This is the view that equality is intrinsically good. If inequality is bad, then a state of affairs where everyone is equally miserable is *in one respect* better than a state where some are happy and some are miserable, even if no one is better off.
  *   **The Objection:** **The Leveling Down Objection**. Formulated most famously by Derek Parfit (*Equality or Priority?*, 1997). It argues that a view which implies that leveling down is in any way better is absurd, because it violates the **Person-Affecting Constraint** (or the "Complaint Principle"): a change cannot be better if it is not better for anyone.
  *   **The Dodge:** **Prioritarianism**. This view weights benefits to the worse off more heavily. It avoids the LDO because it never recommends leveling down without a gain; it only recommends transfers that increase the *weighted* value of the outcome.

  ### 2. The Intrapersonal Case: Prudential Rationality and Temporal Distribution
  The intrapersonal analogue does not have a single canonical name like "The Leveling Down Objection," but it is discussed under **Prudential Rationality**, **Temporal Distribution**, or **The Shape of a Life**.

  However, the intuition you describe (that the flattened life is "better shaped" even with no gain) is usually not defended as *intrapersonal egalitarianism*. It is almost always defended via **Diminishing Marginal Value of Well-Being (Concavity)**.

  Here is the critical distinction that carves the phenomenon:

  #### A. The "Smoothing" Intuition (Concavity)
  When people say the life with 30 years at 90 and 30 years at 30 is "worse" than a life of 60 years at 60, they are usually implicitly applying a **concave value function**.
  *   **Math:** $V(90) + V(30) < 2 \times V(60)$.
  *   **Implication:** The *sum of well-being* drops, but the *sum of value* rises.
  *   **Verdict:** This is **not** analogous to interpersonal leveling down. This is analogous to **Prioritarianism**. It avoids the LDO because the "bad years" *do* gain in value terms, even if they don't gain in well-being units.

  #### B. The "Pure Leveling" Intuition (Intrapersonal Telic Egalitarianism)
  Your first scenario (lowering the 90s to 30s with *no* gain to the 30s, and no increase in total value) is the true analogue.
  *   **Name:** **Intrapersonal Leveling Down**.
  *   **Status:** This is widely rejected as **prudentially irrational**.
  *   **Why the confusion?** People conflate Case A (Concavity) with Case B (Equality). When they say the spiky life is "worse shaped," they usually mean it is less *efficient* at generating value (Case A). If you force them to concede that value is linear (Case B), almost everyone agrees the flattened life is worse.
  *   **Exception:** Some aesthetic/narrative views (e.g., David Velleman) argue a "stable" life has intrinsic narrative value. But this is a minority view and distinct from distributive justice.

  #### C. The "Steep Weighting" Case (Your Second Scenario)
  Your second scenario (destroy 100 units in good years to deliver 1 unit to bad years) is the crucial test.
  *   **Interpersonal:** Prioritarianism *can* endorse this if the priority weight is steep enough. It is controversial but logically consistent.
  *   **Intrapersonal:** This is generally rejected as **irrational** unless the "person" is fragmented. Standard rational choice theory (and standard health economics QALY maximization) assumes **Temporal Neutrality** and **Linearity** (or mild concavity). A trade-off that drastically reduces lifetime total for a tiny gain at a low point is seen as a failure of prudence.

  ### 3. The Boundary: Psychological Continuity
  You asked where the boundary lies and if it moves with psychological discontinuity. This is the most important philosophical lever.

  *   **The Standard View:** The **Separateness of Persons** is the moral boundary. Inside a person, we maximize the total (or weighted total). Between persons, we worry about distribution.
  *   **Parfit's Reductionism:** In *Reasons and Persons*, Parfit argues that personal identity just consists in psychological connectedness (memory, character, intention).
  *   **The Shift:** If the "Good Years Self" and the "Bad Years Self" are psychologically discontinuous (no memory, no concern for each other), the intrapersonal case **collapses into the interpersonal case**.
      *   If the connection is weak, we treat the time-slices as **different people**.
      *   Consequently, **Intrapersonal Prioritarianism** becomes defensible, and even **Intrapersonal Leveling Down** becomes less absurd (because it is now Interpersonal Leveling Down, which some Telic Egalitarians defend).
      *   **Health Policy Relevance:** This is relevant for dementia care or severe psychiatric disruption. If the patient now is not the same "person" as the patient in ten years, distributive principles (justice) may override prudential principles (maximization).

  ### 4. The Carving: What is What?

  To summarize the configuration you cannot find discussed:

  | Feature | Interpersonal Case | Intrapersonal Case (Standard) | Intrapersonal Case (Discontinuous) |
  | :--- | :--- | :--- | :--- |
  | **Scenario** | Rich $\to$ Poor (No Gain) | High Well-being $\to$ Low Well-being (No Gain) | Time-Slice A $\to$ Time-Slice B (No Gain) |
  | **Standard Verdict** | **Wrong** (Leveling Down Objection) | **Irrational** (Violates Prudence) | **Debatable** (Depends on Identity) |
  | **Underlying Principle** | Person-Affecting Constraint | Lifetime Maximization | Justice between Slices |
  | **If Weighted (Gain)** | **Prioritarianism** (Accepted by many) | **Concave Utility** (Accepted by many) | **Prioritarianism** (Accepted by many) |
  | **If Steep Weight** | **Radical Prioritarianism** (Controversial) | **Prudential Irrationality** (Rejected) | **Radical Prioritarianism** (Possible) |

  ### 5. Specific Labels for Your Search
  If you are searching the literature, these are the terms that will yield the relevant debates:

  1.  **"Distribution within a Life"**: This is the standard header for the intrapersonal case. (See: Norman Daniels, *Am I My Parents' Keeper?*; Dennis McKerlie, *Equality and Time*).
  2.  **"The Shape of a Life"**: Discusses whether the trajectory (rising, falling, stable) matters independent of the sum. (See: David Velleman, *Well-Being and Time*; Michael Slote).
  3.  **"Prudential Prioritarianism"**: The view that we should prioritize our own worse-off time-slices. (See: Otsuka & Voorhoeve, *Why It Matters That We Are Persons*).
  4.  **"Time-Slice Conception of the Person"**: The view that dissolves the boundary you are probing. (See: Parfit, *Reasons and Persons*; Sider, *Four-Dimensionalism*).

  ### 6. Conclusion: The Phenomenon Carved
  The phenomenon you are hitting is the **confusion between Concavity and Equality**.

  *   **What it is not:** It is not generally the case that philosophers accept *intrapersonal leveling down* (pure equality without gain). Most reject this as irrational.
  *   **What it is:** People accept *intrapersonal smoothing* because they assume a **concave value function** (diminishing marginal utility). They mistake this for an equality preference.
  *   **The Real Analogue:** The true analogue to the interpersonal Leveling Down Objection is **Intrapersonal Leveling Down** (pure smoothing with no value gain). This is rejected by almost everyone *unless* psychological continuity is broken.
  *   **The Boundary:** The boundary moves exactly where **Psychological Connectedness** breaks. If the good years and bad years are psychologically discontinuous, the "Intrapersonal" case becomes "Interpersonal," and the Leveling Down Objection loses its grip (because Telic Egalitarianism becomes viable again between the time-slices).

  **Recommendation:** In your analysis, distinguish between **Efficiency Smoothing** (concave utility, widely accepted) and **Distributive Smoothing** (intrinsic value of equality within a life, widely rejected). The tension you feel arises when policy models assume linearity (QALYs) but human intuition assumes concavity, or when psychological discontinuity (dementia, severe mental illness) turns a prudential problem into a justice problem.

  **Key Citation:**
  *   **Parfit, D.** (1984). *Reasons and Persons*. (Part III on Personal Identity).
  *   **Parfit, D.** (1997). "Equality or Priority?" (The source of the LDO).
  *   **McKerlie, D.** (1989). "Equality and Time." *Ethics*. (Specifically addresses the intrapersonal distribution).
  *   **Otsuka, M., & Voorhoeve, A.** (2009). "Why It Matters That We Are Persons." (Discusses the moral significance of the intra/inter distinction).
