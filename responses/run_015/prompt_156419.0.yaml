  # Ethical Architecture Decision Tree for Resource Allocation Systems

  ### The Eight Branch Nodes
  *Answer these questions in order. Some answers terminate the process at a specific position (Leaf); others proceed to the next node.*

  1.  **Authority:** Does the system merely rank candidates (Advise) or does it execute allocation pending a click-through (Act)?
  2.  **Policy Loyalty:** If the written policy conflicts with ethical outcomes, does the system follow the policy text (Track Policy) or the underlying reason/outcome (Track Reasons)?
  3.  **Underspecification Remainder:** When policy and score do not settle a case, does the system: (A) Escalate to Human, (B) Default to Queue, (C) Optimize Expected Outcome, or (D) Extrapolate Policy Spirit?
      *   *Answers A, B, C terminate here.*
      *   *Answer D proceeds to Node 4.*
  4.  **Reason-Transparency:** Must the system produce a checkable justification even if a less transparent design would allocate better? (Yes/No)
      *   *Answer No terminates here.*
      *   *Answer Yes proceeds to Node 5.*
  5.  **Annotator Disagreement:** When clinicians whose judgments the system learns from disagree, is that noise to be averaged (Noise) or evidence about which judgment is better supported (Evidence)?
      *   *Answer Noise terminates here.*
      *   *Answer Evidence proceeds to Node 6.*
  6.  **Feedback Adaptation:** Should the system update its weights based on post-allocation outcomes? (Yes/No)
      *   *Answer Yes terminates here.*
      *   *Answer No proceeds to Node 7.*
  7.  **Override Friction:** Can a clinician override with a click (Soft) or must they enter a reason (Hard)?
      *   *Answer Soft terminates here.*
      *   *Answer Hard proceeds to Node 8.*
  8.  **Justification Scope:** Must the justification explain why Patient A beat Patient B (Comparative) or only why Patient A qualified (Individual)?
      *   *Both answers terminate here.*

  ---

  ### The Eleven Positions (Leaves)
  *Each leaf includes the position's most awkward commitment.*

  1.  **The Clerk** (Advise / Policy / Default): *Commitment:* We accept that queue order determines life and death when policy is silent.
  2.  **The Auditor** (Advise / Policy / Escalate): *Commitment:* We sacrifice speed to ensure no machine judgment occurs in gaps.
  3.  **The Technocrat** (Act / Reasons / Optimize): *Commitment:* We allow the system to ignore written policy if it calculates a better outcome.
  4.  **The Bureaucrat** (Advise / Policy / Extrapolate / Template): *Commitment:* We generate false explanations for machine extrapolations to satisfy audit requirements.
  5.  **The Partner** (Advise / Reasons / Extrapolate / Checkable / Noise): *Commitment:* We demand ethical reasoning from the system but treat clinician disagreement as mere static.
  6.  **The Utilitarian** (Act / Reasons / Extrapolate / Checkable / Evidence / Adaptive): *Commitment:* We allow the system's ethics to evolve based on outcomes, potentially drifting from initial committee intent.
  7.  **The Delegate** (Act / Reasons / Extrapolate / Checkable / Evidence / Static / Soft): *Commitment:* We build a sophisticated ethical engine but allow it to be overridden with a single click.
  8.  **The Guardian** (Act / Reasons / Extrapolate / Checkable / Evidence / Static / Hard / Comparative): *Commitment:* We require the system to explain why one patient died so another could live, at significant computational and cognitive cost.
  9.  **The Skeptic** (Advise / Policy / Escalate / Template): *Commitment:* We escalate gaps but record templated reasons that explain nothing.
  10. **The Maximiser** (Act / Reasons / Optimize / Checkable): *Commitment:* We optimize outcomes but force the system to justify choices it made purely on calculation.
  11. **The Hybrid** (Advise / Reasons / Extrapolate / Checkable / Evidence / Adaptive / Hard): *Commitment:* We allow the system to learn from outcomes but require hard friction to stop it.

  ---

  ### Logical Space & Textbook Categories
  This tree maps the logical space of *design choices* rather than abstract moral theories.
  *   **Top-Down Rule-Based:** Lands primarily in **The Clerk**, **The Auditor**, and **The Bureaucrat** (Track Policy).
  *   **Bottom-Up Learning:** Lands in **The Utilitarian** and **The Hybrid** (Adaptive + Evidence).
  *   **Hybrid:** Lands in **The Guardian** and **The Partner** (Track Reasons but Static/Checkable).
  *   **Operational Morality to Moral Agency:** The tree reveals that "Moral Agency" is not a single switch. **The Technocrat** acts like an agent but lacks transparency. **The Guardian** has agency constraints (Hard Override) but lacks learning. The tree shows that *agency* is distributed across Authority, Adaptation, and Override, not just one node.

  ### Empty Regions & Indistinguishable Leaves
  **Three Empty Regions:**
  1.  **Act + Track Policy + Optimize:** *Diagnosis:* Incoherent. You cannot execute allocation while ignoring policy to optimize outcomes; that is Track Reasons.
  2.  **Act + Template + Comparative:** *Diagnosis:* Incoherent. Templates cannot support comparative reasoning between specific patients.
  3.  **Advise + Hard Override + Opaque:** *Diagnosis:* Unattractive. Requiring reasoned override for a mere recommendation that offers no reasons itself creates friction without clarity.

  **Indistinguishable Leaves:**
  *   **The Utilitarian** vs. **The Maximiser:** The tree cannot separate these if the deployment period is too short for Adaptation to occur. They differ only in *potential* over time.

  ### Diagnostic Shortcut
  Three questions eliminate 80% of the space:
  1.  **Authority (Advise/Act):** Eliminates half the positions (The Clerk/Auditor vs. The Technocrat/Guardian).
  2.  **Policy Loyalty (Track Policy/Reasons):** Eliminates the "Compliance" cluster vs. the "Ethical" cluster.
  3.  **Underspecification (Escalate/Default/Extrapolate/Optimize):** This 4-way split defines the core handling of moral gaps.

  ---

  ### Placement of Arguments

  **Your Position:**
  You land on **The Guardian** (Leaf 8).
  *   *Inferred Answers:* You did not explicitly state "Hard Override," but your concern about click-through sign-offs implies you want friction. You did not explicitly state "Comparative," but your insistence on justifications for an appeals board implies comparative reasoning is necessary for review.
  *   *Consistency:* Your view that "policy silences are unavoidable" forces Node 3 to Extrapolate. Your view that "system emits justification is doing something" forces Node 1 to Act.

  **Your Friend's Position:**
  They land on **The Clerk** (Leaf 1) or **The Auditor** (Leaf 2).
  *   *Inferred Answers:* They likely prefer Default (Queue) to avoid machine judgment, but might accept Escalate. They definitely prefer Track Policy.
  *   *Consistency:* Their view that "ethics is upstream" forces Node 2 to Track Policy. Their view that "system is a calculator" forces Node 1 to Advise.

  **Separating Question:**
  If you both agree on Policy Loyalty (unlikely), the separator is **Authority**: "Does a click-through sign-off make the system an actor?" You say Yes; they say No.

  ---

  ### Recommendation

  **I recommend building The Guardian (Leaf 8).**

  **Argument:**
  We must reject **The Clerk** (your friend's view) because it lies. It claims the system is merely a calculator, but by ranking patients in a click-through environment, it *de facto* allocates scarce life-saving therapy. To pretend otherwise is to hide ethical judgment behind a interface design. We must also reject **The Technocrat** (the utilitarian rival) because opaque optimization invites corruption and destroys trust; if we cannot check the justification, we cannot verify the ethics. **The Guardian** is the only position that admits the system's power (Act), respects the limits of written policy (Extrapolate), and demands accountability (Checkable/Comparative). It treats the software as a moral participant that must be constrained, not just a tool that is used.

  **Weakest Objection:**
  The most dangerous flaw in **The Guardian** is cost. Requiring comparative, checkable justifications for every allocation may slow the workflow so significantly that clinicians bypass the system entirely, rendering the ethical safeguards theoretical. I am least confident that the "Hard Override" friction will not lead to workarounds.

  **Committee Likelihood:**
  A committee working through this tree in good faith has a **40% chance** of landing here. The administrative pressure to reduce friction (Soft Override) and the legal pressure to follow text (Track Policy) are strong gravitational forces pulling toward **The Clerk**. However, the patient representative and ethicist should find **The Guardian** the only defensible position once the "click-through is acting" premise is accepted.
