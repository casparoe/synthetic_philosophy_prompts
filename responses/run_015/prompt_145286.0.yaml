      *   *The Substrate Issue:* Mach says "elements" are neutral. Hofstadter says "neurons/symbols" are the substrate. But Hofstadter would agree the *specific* neurons don't matter, only the pattern. Mach would say the pattern is just a convenient way to group elements.
      *   *Resolution:* They are surprisingly compatible, but with a shift in emphasis. Mach denies the *substantiality* of the self. Hofstadter affirms the *functional reality* of the self-pattern.
      *   *Answering "What is looping?":* In Mach's terms, it's the *memory-elements* referencing prior *sensation-elements*. In Hofstadter's terms, it's the *symbol* referencing the *system*.
      *   *Can the loop exist without substrate?* Hofstadter says patterns are substrate-independent (multiple realizability). Mach says everything is just elements, so the distinction between pattern and substrate is blurry.

