answer: |-
  Dear Friend,

  It is a genuine pleasure to engage with this work, and I want to begin by acknowledging the courage it takes to stand before a room of specialists when you have come to this subject from outside the academy. You have done the reading, you have attended the groups, and you have thought hard enough to produce a novel thought experiment. That is no small achievement. However, because you have asked me to be serious and careful, I must tell you that while your first move regarding the inertial field is defensible though controversial, your second move regarding the two-bucket case contains a significant vulnerability that the experts in the room will likely spot immediately. I am not saying the argument is simply bad and should be abandoned, but it requires a strategic shift in how you present the conclusion of that second part. You are claiming an empirical divergence where there may only be a modal one, and you are attributing a prediction to substantivalism that substantivalists do not actually make. If you walk in claiming the two-bucket case proves the views diverge on the actual shape of the water, you will be corrected. If you walk in claiming it shows they diverge on what is possible, you might survive.

  The first thing you will get, and the objection that would do the most damage to your position if left unanswered, will come from the two members who work on general relativity and classical field theory. They will not attack your definitions; they will attack your physics. They will tell you that in a universe containing only two counter-rotating buckets, standard substantivalism does not require an asymmetric outcome. On a substantivalist view, rotation is absolute with respect to spacetime structure. If the two buckets are counter-rotating, there is a frame of reference fixed to the spacetime in which their centre of mass is at rest. In that frame, both buckets are rotating at half the relative rate. Consequently, both surfaces should be concave. The substantivalist is not committed to saying one bucket must be at rest relative to space; they are only committed to saying there is a fact of the matter about who is rotating. Since the material setup is symmetric, there is no reason for spacetime to break that symmetry. You have claimed that substantivalism permits one bucket to be flat and the other concave, and while it is true that substantivalism allows this possibility, it is not the predicted outcome for a symmetric setup. Your relationist view forbids the asymmetric outcome entirely, whereas substantivalism allows it but does not mandate it. This means your case does not show a divergence in predicted observations for the standard case, but only a divergence in what is metaphysically possible. You must concede that you cannot guarantee an asymmetric outcome on substantivalism, but you should hold firm that relationism forbids it. Your reply should be that the value of the thought experiment is not that substantivalism predicts asymmetry, but that it allows for a physical difference without a material difference, whereas relationism ties the physical effect strictly to the relative motion. The soft spot here is that if the GR experts insist that general relativity itself dictates the symmetric solution even on a substantivalist reading, your claim of empirical divergence evaporates. You should prepare to say that you are discussing the conceptual space of Newtonian substantivalism, not necessarily the specific metrics of general relativity, though this may invite further fire.

  After that, the convener and the metaphysician will likely combine forces to attack your notion of the inertial field. They will say that positing a material structure that exists independently of the buckets, carries energy or momentum, and determines inertial trajectories is simply to rename absolute space. They will argue that if this field can exist in the absence of the buckets, and if it acts upon the buckets without being acted upon in return in the way ordinary matter does, it possesses all the defining features of a substance. They will call this absolute space with the serial numbers filed off. This is a serious charge because it undermines your claim to be offering a relationist-friendly alternative. You should concede immediately that if by material you mean something that behaves exactly like ordinary matter, your field does not qualify. However, you must hold on to the distinction that your field is contingent and dynamical, unlike the fixed background of traditional substantivalism. Your reply should be that the history of physics is full of fields that were once thought to be absolute structures and later understood as dynamical entities, such as the electromagnetic field. You are proposing that inertial structure is similar: a real physical field that can vary and interact, rather than a fixed stage. The weakness in this reply is that unless you can specify how this field is generated by matter, it remains a free-standing entity, which is precisely what relationists wish to avoid. You need to be ready to admit that your view is a hybrid, perhaps a structural realist view, rather than a pure relationism.

  The member sympathetic to the Machian tradition will press you on whether your inertial field is grounded in the matter distribution. She will ask if the field exists when there is no matter at all. If you say yes, she will argue you have abandoned Mach's principle. If you say no, she will ask how the field determines motion in the two-bucket case where there is no other matter. This is a trap. If you say the field exists without matter, you look like a substantivalist. If you say it depends on matter, you need to explain what it depends on in your two-bucket universe. You should concede that your view is not strictly Machian in the historical sense. You must hold on to the idea that the field is local and physical. Your reply should be that you are updating relationism for a post-field-theory world, where fields are real physical things even if they are not made of atoms. You are arguing that relationism should not deny the reality of fields, but should deny that those fields are non-physical spacetime substances. The soft spot is that this may look like a verbal dispute about the word material.

  The empiricist will ask what observation could settle the dispute in the two-bucket case, given that there are no observers in an empty universe. They will argue that talk of water surfaces in a universe with no one to measure them is metaphysical excess. This is a standard move. You should concede that strictly speaking, without an observer, there is no measurement. However, you must hold on to the counterfactual: if an observer were present, the measurements would differ. Your reply should be that scientific theories make claims about what would be measured, not just what is measured. The weakness here is that the substantivalist can agree with the counterfactual, so you haven't gained ground.

  The graduate students will ask for clarity on your definitions of kinematical and dynamical relationism. They will notice if you slip between them. This is manageable. You should concede that the terminology is yours and not standard. Hold on to the distinction that kinematical relationism is about description, while dynamical relationism is about laws. Your reply should be that Newton's bucket is often used to refute relationism broadly, but it only refutes dynamical relationism if one restricts the relata. This is your strongest ground, so defend it vigorously.

  There is one objection you should simply concede outright, and it comes from the metaphysician regarding the fundamentality of your inertial field. They will ask whether the field is fundamental or grounded. If you say it is fundamental, it looks like a substance. If you say it is grounded, you need a grounding relation. You should concede that you do not have a full metaphysical account of the grounding. Tell them that your aim is to show that relationism is not dead, not to provide a complete ontology. This concession costs you the claim to a fully worked-out metaphysics, but it saves you from making a category error you cannot defend. It positions you as offering a programme rather than a finished system.

  The weakest joint in your own two-bucket argument is the claim that substantivalism predicts an asymmetric outcome. As I noted earlier, substantivalism allows it but does not predict it for a symmetric setup. You should prepare to defend this by clarifying that you are highlighting the modal difference. Substantivalism allows the world to be asymmetric even when the matter is symmetric; relationism does not. Defend this by saying that the possibility of asymmetry reveals the existence of the background structure, even if the actual world happens to be symmetric. Do not claim the water will actually be different in the standard case; claim that the explanation for why it is the same differs.

  Finally, there is a question you are hoping nobody asks, which is whether your inertial field is detectable independently of the water. If you say yes, you are a substantivalist. If you say no, you cannot explain how it causes the water to climb. If this is asked, you should say that the field is detectable only through its effects on matter, much like the gravitational field was before we could detect gravitational waves. Be honest that this is the frontier of your view. You are proposing that inertial effects are the interaction between matter and this field. Do not try to bluff your way out of this. Admit that this is where your view stands or falls on future physics.

  You are walking into a room of people who love these problems deeply. They will not be hostile to your lack of affiliation if your arguments are sharp. They will be hostile if you claim certainty where there is none. Frame your talk as an exploration of conceptual space rather than a proof of a conclusion. Emphasise that you are trying to save relationism from a premature burial, not that you have slain substantivalism. Good luck.
