  ### (1) Reconstruction of the implicit theory

  The implicit theory operating here is best reconstructed as **Protection Against Coercive Necessity**. This view holds that commodification is permissible only when agents possess viable exit options and biological integrity remains intact. The law distinguishes between *constitutive biological elements* (kidneys, emergency water) and *fungible economic exchanges* (plasma, labor). State intervention occurs when market participation threatens the agent's status as a biological survivor (selling a vital organ) or when market pricing threatens the consumer's immediate survival (disaster goods). Conversely, commodification is permitted where biological integrity remains intact (plasma is renewable) or where the agent is construed as exercising economic agency rather than succumbing to biological necessity (labor). This rationalizes the asymmetry: labor is treated as an alienable asset because the worker is legally presumed to have exit options, whereas water during a disaster is treated as inalienable because exit is impossible. Similarly, kidneys are protected as vital infrastructure of the self, while plasma is treated as surplus. Thus, the unified principle is not merely bodily integrity, but **the preservation of agency against desperate necessity**. Markets are barred where necessity eliminates meaningful consent (organ sellers, disaster buyers) but permitted where agency is presumed viable (plasma donors, workers). The theory weights irreversibility heavily regarding organs but assumes labor contracts are reversible. It weights coercion risk highly for disaster consumers but assumes laborers negotiate freely despite crisis conditions. Labor is rented; organs are sold. This distinction allows the law to permit temporary bodily use (surrogacy, plasma) while banning permanent transfer. Economic labor is always temporary use, never permanent alienation of the self, which is why it escapes the protection afforded to kidneys. The theory ultimately prioritizes the **continuity of the biological subject** over the **optimization of economic welfare**, but only where the biological subject is visibly compromised. The state acts as a guardian of the biological baseline, intervening only when the market threatens to consume the very substrate required for citizenship. This creates a protected sphere of biological security alongside a liberal sphere of economic freedom. Ultimately, the theory posits that market freedom is a secondary good dependent on biological stability.

  ### (2) Strict presuppositions versus contingent fits

  Logically, this pattern requires presupposing that **bodily integrity is lexically prior to contractual freedom** only when irreversibility is high. It strictly requires distinguishing between "being" (having a kidney) and "doing" (working). The state must assume that labor markets are sufficiently competitive to grant workers exit power, whereas disaster goods markets are not. However, much of this alignment is contingent. The exclusion of labor from price controls fits the theory only if we assume labor markets are not coercive during crises—an empirical claim, not a moral necessity. Similarly, allowing egg retrieval but banning kidney sales fits a renewability criterion, but this is a contingent biological distinction, not a strict moral requirement. The pattern could hold even if the underlying justification were purely pragmatic (e.g., enforcement costs) rather than principled. Thus, the pattern logically requires a hierarchy of values (biology over commerce in survival contexts), but the specific application to labor versus goods relies on contingent assumptions about market elasticity and political power rather than strict moral logic.

  ### (3) Philosophical underdetermination

  The practice is underdetermined because rival theories justify the same outcomes. A **Kantian dignity** view argues bodies are persons, not things, forbidding organ sales, yet struggles to explain why plasma is permissible without ad hoc distinctions. A **Utilitarian** view might support bans based on net harm (exploitation risks vs. supply benefits), matching the status quo without invoking rights. Conversely, a **Libertarian** theory could argue all should be permitted, attributing current bans to paternalistic error, while a **Radical Egalitarian** might argue all should be protected (labor caps included), viewing the current split as class bias. The current practice offers no decisive reason to choose between a "sanctity of the body" explanation and a "mitigation of coercion" explanation. Both license banning kidney sales; only the latter potentially licenses plasma sales. Since both converge on the major prohibitions, the institutional pattern alone cannot distinguish whether the value at stake is intrinsic dignity or instrumental welfare. The silence on labor caps suggests a political compromise rather than a resolved philosophical stance.

  ### (4) Counterfactual redesign

  If adopted a uniform principle that **all survival-essential capacities are non-commodifiable**, labor markets would require wage floors indexed to survival costs during crises, effectively treating labor power like water. Organ markets would remain banned, but plasma and surrogacy might face stricter non-commercialization. Conversely, if **all capacities are priced**, organ markets would legalize, and anti-gouging statutes would repeal, treating water like labor. The current hybrid would vanish. A unified "biological integrity" principle would mandate wage caps/premiums during disasters to prevent coerced labor, aligning worker protection with consumer protection. Alternatively, a unified "market freedom" principle would deregulate organs, treating kidneys like plasma. The current asymmetry relies on maintaining the distinction; removing it forces consistency across bodily and economic domains. Such changes would reveal whether the current system values human dignity or market efficiency.
