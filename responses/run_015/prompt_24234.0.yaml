      *   *Moral Decision Making (under Moral Uncertainty):*
          *   Moral Theories (hypotheses about value).
          *   Credences (probabilities over theories).
          *   Actions/Acts.
          *   Outcomes (consequences of acts, usually empirical facts).
          *   Choice-worthiness/Value (provided by the theories, *not* fixed).
