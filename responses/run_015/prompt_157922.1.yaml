answer: |-
  **The Argument for the Double Veil and Integrated Agency**

  **I. Thesis**
  Full moral worth is attributable to an agent only when the maxim of their action remains stable under the condition of the Double Veil: (1) ignorance of actual consequences, and (2) ignorance of social recognition. Furthermore, the reasons motivating the action need not be the product of explicit, moment-to-moment deliberation; they may arise from subconscious pattern-matching, provided such patterns constitute internalized rationality rather than mere instinct.

  **II. The Function of the Double Veil**
  To isolate moral worth from moral luck and heteronomy, we must apply two filters to the agent's motivation.

  1.  **The Veil of Consequences:** We ask whether the agent would retain the same reason for acting if the outcome were unknown or neutralized. If the reason dissolves when the success of the action is uncertain, the worth of the action is contingent upon fortune. By requiring reasons to survive this veil, we ensure that moral worth is located in the *will* rather than the *world*.
  2.  **The Veil of Recognition:** We ask whether the agent would retain the same reason for acting if no other consciousness ever acknowledged the deed. If the reason dissolves when the prospect of praise or reputation is removed, the action is driven by social validation rather than moral commitment. By requiring reasons to survive this veil, we ensure that moral worth is *autonomous* rather than performative.

  **III. The Status of Subconscious Pattern-Matching**
  A revised account of moral agency must acknowledge that human cognition operates largely through heuristic processing and pattern recognition. Explicit deliberation is the exception, not the rule. Therefore, we posit the **Principle of Integrated Rationality**:

  *   A subconscious impulse possesses moral weight if and only if it represents the proceduralization of past rational commitments.
  *   When an agent acts via subconscious pattern-matching (e.g., an immediate intuition to aid another), this is not a defeater for moral worth. Rather, it indicates that moral reasoning has been successfully encoded into the agent's character.
  *   The subconscious is not a blind cavity but a repository of trained judgment. To demand explicit deliberation for every moral act is to demand that a master musician calculate the physics of every note; such a demand destroys the fluency of virtue.

  **IV. Defense Against Kantian Rigorism**
  Traditional Kantianism risks rigorism by insisting that an action has moral worth only if done *from duty* via conscious reflection on the moral law. This creates a paradox where the most virtuous agents—those for whom goodness is second nature—are denied full moral worth because they do not struggle against inclination.

  This revised account avoids rigorism by shifting the locus of evaluation from the *process of thinking* to the *source of the motive*.
  *   **The Objection:** Kantians argue that without conscious adherence to duty, an action is merely temperamental.
  *   **The Reply:** Subconscious pattern-matching is not temperamental if it survives the Double Veil. If an agent's intuition to tell the truth persists even when lying would yield better consequences (Veil 1) and no one would know the difference (Veil 2), then that intuition is functionally identical to duty. The agent *is* their duty, rather than merely *obeying* it. Thus, we preserve the deontological core without requiring unnatural psychological friction.

  **V. Defense Against Moral Luck Objections**
  Critics of internalist accounts often argue that excluding consequences makes morality too inclusive, allowing well-meaning incompetence to count as moral success. Conversely, including consequences makes morality too exclusive, punishing agents for factors outside their control.

  This revised account navigates between these errors via the Veil of Consequences:
  *   **Neutralizing Result Luck:** By stripping knowledge of actual consequences, we ensure that an agent who attempts to save a life but fails possesses the same moral worth as one who succeeds. The worth lies in the reason (the valuing of life), not the event (the survival).
  *   **Avoiding Over-Inclusiveness:** This does not validate incompetence. To survive the Veil, the reason must be robust. A reason based on "I think this will help" is fragile if the agent has made no effort to understand what *actually* helps. However, the *moral worth* of the intention remains intact even if the *practical value* of the act is nil. We distinguish the worth of the *agent* from the utility of the *action*. The Double Veil protects the agent from the tyranny of chance without absolving them of the duty to cultivate accurate pattern-matching (competence).

  **VI. Conclusion**
  Full moral worth is the property of a will that is both opaque to fortune and indifferent to applause. By accepting subconscious pattern-matching as a valid vehicle for moral reasons, we acknowledge that virtue is a state of being, not merely a sequence of calculations.

  Therefore, the agent possesses full moral worth when their action flows from a character so thoroughly aligned with the good that the removal of consequences and recognition leaves the motive unchanged. In this state, the subconscious is not a shadow over reason, but its silent, efficient embodiment. The philosopher-king rules not by calculating every edict, but by possessing a nature that cannot conceive of an unjust one; so too does the moral agent act with full worth when their intuition survives the darkness of the Double Veil.
