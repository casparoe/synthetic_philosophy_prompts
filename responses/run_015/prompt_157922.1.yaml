  2.  **Deconstruct the "Double Veil":**
      *   *Veil 1 (Consequences):* This aligns with deontological intuitions (intent over outcome) but needs to avoid making the agent clueless. It's about the *motivation* not being contingent on the result.
      *   *Veil 2 (Recognition):* This aligns with authenticity/integrity. Acting for praise undermines the moral value of the act itself.
      *   *Subconscious Element:* This is the twist. Kant requires conscious duty. This theory allows habituated intuition (Aristotelian *phronesis* meets Kantian motive).

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Premise 1: The Definition of Moral Worth.** Moral worth must attach to the *will* or the *source of action*, not the outcome. (Standard deontological starting point).
      *   **Premise 2: The Contamination of Consequences.** If worth depends on consequences, it is subject to moral luck. (Addressing the luck objection).
      *   **Premise 3: The Contamination of Recognition.** If worth depends on recognition, it is heteronomous (driven by external validation, not internal law).
      *   **Premise 4: The Role of Subconscious Processing.** Explicit deliberation is too slow and fragile for consistent moral agency. Subconscious pattern-matching represents internalized virtue.
      *   **Conclusion:** Therefore, full moral worth resides in reasons that persist behind the double veil, even if generated subconsciously.

  4.  **Refining the Argument (Addressing Specific Constraints):**

      *   *Avoiding Kantian Rigorism:* Kant demands conscious adherence to the Categorical Imperative. This theory allows "subconscious pattern-matching." I need to argue that a well-trained subconscious *is* the embodiment of reason, not its absence. This bridges Kant and Aristotle.
      *   *Avoiding Moral Luck:* By stripping consequences (Veil 1), we ensure that a failed good act has the same worth as a successful one. By stripping recognition (Veil 2), we ensure that an anonymous good act has the same worth as a celebrated one.
      *   *Subconscious as Feature:* Argue that subconscious processing indicates deep integration of moral principles. It shows the agent *is* good, not just *acting* good.

  5.  **Developing the Voice:**
      *   The prompt asks for a "philosopher-king" context. The tone should be authoritative, logical, yet accessible enough for a narrative setting (though the prompt asks for a "formal argument," the flavor should be dignified).
      *   Structure: Proposition, Definitions, The Double Veil Test, The Subconscious Clause, The Comparative Defense (vs. Kant & Luck), Conclusion.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Define the scope. Moral worth is about the *why*, not the *what* or the *result*.
      *   *The Double Veil:* Explain the two filters.
          *   Filter 1 (Consequences): Removes luck.
          *   Filter 2 (Recognition): Removes vanity/social pressure.
      *   *The Subconscious Clause:* This is the tricky part. How to formalize "subconscious pattern-matching"? Call it "internalized rationality." If I see a child drowning and jump in without thinking, is it moral? Yes, *if* the impulse stems from a valuing of life that would survive the veil. If I jump in because I want a medal, it fails Veil 2. If I jump in because I calculate survival odds, it fails Veil 1 (in a sense, it becomes instrumental).
      *   *Defense against Kant:* Kant says you must think about duty. I say you must *be* dutiful. The subconscious is the sediment of past rational choices. It is "crystallized reason."
      *   *Defense against Luck:* If the child dies anyway, did I lose moral worth? No, because Veil 1 hides the death. If no one sees me, did I lose worth? No, Veil 2 hides the audience.

