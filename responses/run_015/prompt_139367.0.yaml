answer: |-
  Dear friend,

  You are right to suspect this is a philosophy question, though it sits right on the border where philosophy meets psychology. What you are describing is a very real and documented phenomenon, even if it does not have a single catchy name like the placebo effect. In economics and decision theory, this is often discussed under the umbrella of procedural utility, which is the idea that we care not just about the outcome of a decision but about the process used to reach it. However, that term is a bit dry for what you are feeling. A sharper philosophical description would be that you are protecting your agential ownership or narrative integrity. You are not just trying to get your dad into a home; you are trying to perform the role of a caring child, and the method of decision-making is part of that performance. When you choose arbitrarily yourself, you are still the author of the choice. When the GP chooses, you are delegating authorship to a trusted expert, which preserves the narrative of care because it implies the decision was made with competence. But when you flip a coin, you are handing authorship to chance, which feels like abdicating your responsibility. So you are not smuggling two different issues together; rather, you are seeing the same core need for agency manifest in different contexts.

  The reason the coin flip feels like giving up while the GP's suggestion feels like relief is that the coin represents noise whereas the GP represents a reason, however thin. Humans are reason-seeking creatures. We need our actions to be intelligible to us later when we look back on them. If you look back in five years and ask why your dad is in Home A, saying because the GP suggested the one on the hill provides a story. It grounds the decision in the world. Saying because a coin landed heads severs the link between the world and the choice. It makes the outcome feel accidental rather than decided. This is why your reaction to the social worker was so strong. In the context of a care home, the decision carries moral weight because it concerns another person's welfare. Using a randomizer here feels like a category error, as if you are treating a moral obligation like a lottery. You are fine with the GP because trust transfers the moral weight to them, whereas a coin has no capacity to bear weight.

  Your experience with the restaurant coin flip is slightly different but stems from the same root. When you flip a coin to see where to eat and then reserve the right to veto, you are not actually using the coin to decide. You are using it as a diagnostic tool to reveal a hidden preference. This is a known trick in decision psychology. Often we think we are indifferent when we actually have a slight leaning that we are afraid to acknowledge. When the coin lands on Pizza and you feel a pang of disappointment, you realize you wanted Sushi. The coin did not make the choice; your emotional reaction to the coin made the choice. This is why you feel fine overriding it. In this low-stakes scenario, you are not protecting moral agency so much as you are hunting for a preference you didn't know you had. The boundary here is between using randomness to decide versus using randomness to discover. In the care home case, you knew there was no preference to discover, so the coin offered nothing but the abdication of agency.

  Regarding your edge cases, the distinction holds up well under this lens. If the GP flipped a coin in private and just told you the result, you would likely be fine with it, provided you did not know the method. This is because the GP is acting as a black box of expertise. You are buying their judgment, not their method. As long as the output comes from a trusted agent, the narrative of care remains intact. However, if the GP said I flipped a coin so you should go to the one on the hill, you would likely react the same way you did to the social worker. The knowledge that the reason was chance rather than judgment strips the decision of its authority. This confirms that your objection is not to arbitrariness itself, since you accepted your own arbitrary pick and the GP's arbitrary reason. Your objection is specifically to the visibility of chance as the deciding mechanism in matters of care.

  So to give you the sharp definition you asked for, the phenomenon is an aversion to the explicit externalization of agency in contexts where personal responsibility is salient. You are willing to accept arbitrary outcomes, and you are willing to delegate agency to trusted others, but you are unwilling to delegate agency to blind chance when the outcome matters morally. The boundary lies in whether the procedure preserves the story that a responsible agent made this choice. Your own arbitrary pick works because you are the agent. The GP works because they are a substitute agent. The coin fails because it is not an agent at all. The restaurant veto works because it is not a decision procedure but a feeling probe. You can sort future procedures by asking whether the method allows you to tell a coherent story later about why the choice was made. If the story ends with because luck said so, it will likely feel like a violation. If the story ends with because I decided or because someone I trusted decided, it will feel like relief. I hope this helps you stop going in circles.

  Warmly,

  Your Assistant
