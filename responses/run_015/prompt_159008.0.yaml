prompt: |-
  I work in product analytics at a mid-size online retailer, and we've just finished an A/B test on a redesigned checkout flow. Variant B converts better overall — call it 4.2% against 3.8% — but when we split by device type, variant A wins on mobile *and* on desktop. My PM wants to ship B on the strength of the top-line number; I said that's exactly the trap. Then, unhelpfully, I sliced mobile users by country and then within that by new-versus-returning, and the sign flipped back again: B ahead at the coarse level, A ahead one level down, B ahead at the level below that. So now I've got a nested sequence of partitions where the "winner" keeps changing and no principled place to stop, and I've spent the weekend being smug about Simpson's paradox without actually being able to explain what's going on.

  The thing I keep being told is that it isn't really a paradox about probability at all but a causal one: you adjust for confounders, you don't adjust for mediators or colliders, end of story, and the question "which partition is the right one?" dissolves rather than gets answered. But two cases are nagging at me. First, a colleague pointed out in an arguement that you can get an identical-looking flip in a properly randomised experiment, where there are no confounders to adjust for at all, purely by conditioning on something the treatment itself caused — so the flip isn't always a symptom of confounding, and "control for more stuff" isn't always the fix. Second, the hypothetical I can't settle on my own: suppose the reversal held under *every* non-trivial partition of the covariate space — every way of carving users up into two or more groups, not just device or country — so that there is no partition anywhere that rescues the top-line number. Is that even arithmetically possible, given what mixing over a distribution does to averages, or does the structure of the thing rule it out once you have more than a couple of covariate values? And if it is possible, what would it actually show — that the causal story was never about finding the right partition, that "the effect" was always a weighted average over a covariate distribution somebody has to choose, or something I haven't thought of? I guess what I really want to know is what unifies these three situations, and whether the standard adjust-for-confounders advice handles all of them or only the first one.

  So: please explain the machinery rather than the moral. I'd rather you didn't point me at papers or reading lists — I can follow an argument fine, I just don't want to be chasing references — and I don't need the history or who first noticed what. Rough structure, please: **The short version** (about 120 words, the punchline up front); **What the arithmetic is doing** (about 300 words: why the aggregates can move the way they do, in terms of weights and mixtures rather than a formula dump); **Confounders, mediators and the randomised case** (about 300 words: why the flip you get from conditioning on a downstream variable is or isn't the same animal as the confounder case); **The every-partition case** (about 250 words: whether it's possible, and what it would mean if it were); **What I should actually do on Monday** (about 150 words: how you'd settle the shipping decision if you were me, and what you'd want to know that the dashboard doesn't tell you).
