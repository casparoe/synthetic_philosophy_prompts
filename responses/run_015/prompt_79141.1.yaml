answer: |-
  Here is a menu of precise claims hidden inside the phrase "function is what it does." You can use this to show your bio club that the argument isn't about biology facts, but about which definition is useful for which job.

  ### The Menu of Claims

  #### 1. The "Activity Report" Claim
  *   **The Claim:** To state the function of a part is simply to list its typical physical activity.
  *   **What it means:** "The function of the heart is to contract and move fluid." It makes no reference to why the heart is there or if moving fluid is good. It just describes the event.
  *   **Plausibility:** High. It is scientifically safe and observable.
  *   **Triviality:** High. It risks restating the obvious. If "function" just means "activity," then the function of a diseased heart is to beat irregularly.
  *   **Dispute Settling:** Low. It doesn't distinguish between a working part, a broken part, or a side effect.
  *   **The Beetle Test:** **Yes.** The first time the leg scoops, that is its activity.
  *   **The Vestigial Test:** **No.** If it does nothing, it has no function.
  *   **The Byproduct Test:** **Yes.** If a side effect happens, it is an activity, so it counts.
  *   **Who holds this:** Your **Teacher** (superficially). When they say "heart pumps blood," they are giving an activity report.

  #### 2. The "System Contributor" Claim
  *   **The Claim:** To state the function of a part is to identify how it contributes to the capacity of the larger system containing it.
  *   **What it means:** "The function of the heart is to circulate blood *so that* the organism gets oxygen." It filters out activities that don't help the system (like making a heartbeat sound).
  *   **Plausibility:** High for physiology and engineering.
  *   **Triviality:** Medium. It adds a layer of "usefulness" to the activity.
  *   **Dispute Settling:** Medium. It separates useful activities from noise, but it still counts lucky accidents as functions.
  *   **The Beetle Test:** **Yes.** If the scoop helps the beetle survive now, it is contributing to the system.
  *   **The Vestigial Test:** **No.** If it contributes nothing to the current system, it has no function.
  *   **The Byproduct Test:** **Yes.** If a side effect helps the system (e.g., bird bones are light for flight, but also help with heat loss), the heat loss is a function *of the system*, even if evolution didn't target it.
  *   **Who holds this:** Your **Friend**. This is the "systems" view. A part functions if it maintains the whole.

  #### 3. The "Historical Reason" Claim
  *   **The Claim:** To state the function of a part is to identify the specific consequence that caused ancestors with this part to survive and reproduce more than those without it.
  *   **What it means:** "The function of the heart is to pump blood *because* ancestors who pumped blood survived." If it pumps blood but didn't evolve for that, it's not the function.
  *   **Plausibility:** High for evolutionary biology.
  *   **Triviality:** Low. It makes a strong, non-obvious claim about history.
  *   **Dispute Settling:** High. It strictly separates "function" from "useful accident."
  *   **The Beetle Test:** **No.** The first time it scoops, there is no history of selection. It is just a variation. It only gets a function *after* selection has acted over generations.
  *   **The Vestigial Test:** **Yes.** Even if it does nothing now, its function remains what it was selected for in the past (e.g., the human appendix).
  *   **The Byproduct Test:** **No.** A side effect cannot be *the* function, because selection didn't track it. It is merely "beneficial."
  *   **Who holds this:** Your **Cousin**. This is the strict evolutionary view.

  #### 4. The "Useful Fiction" Claim (The Radical Option)
  *   **The Claim:** There is no fact of the matter about function. "Function" is just a shorthand way for humans to talk about complex causal chains.
  *   **What it means:** Nature doesn't have "functions"; it just has causes. We project "function" onto things to make them easier to study.
  *   **Plausibility:** Radical, but logically consistent.
  *   **Triviality:** N/A. It dissolves the question.
  *   **Dispute Settling:** It ends the argument by saying everyone is arguing about a word that doesn't map to reality.
  *   **The Beetle/Vestigial/Byproduct Test:** Irrelevant. None of them have "functions," they just have effects.
  *   **Who holds this:** None of you yet, but it's the "nuclear option" if the argument gets stuck.

  ---

  ### Are Any of These the Same Claim in Different Hats?

  Yes. Your **Teacher** and your **Friend** are often treated as saying the same thing, but they are technically different.
  *   **Teacher:** "Function is what it does." (Could be Claim 1: Activity).
  *   **Friend:** "Function is what keeps the system going." (Claim 2: System Contributor).

  **Why this matters:** If your Teacher means Claim 1, they are wrong about malfunction (a broken heart still "does" something). If they mean Claim 2, they agree with your Friend. However, in an evolution unit, your Teacher often *says* Claim 2 but *means* Claim 3 (Cousin's view) without realizing the switch. This is why the argument is happening: The Teacher is using a "System" word to describe an "Evolutionary" concept.

  ### Summary of the Test Cases

  | Scenario | Teacher (Activity/System) | Friend (System Contributor) | Cousin (Historical Reason) |
  | :--- | :--- | :--- | :--- |
  | **New Beetle Scoop (1st time)** | **Has Function** (It does the job) | **Has Function** (It helps the system now) | **No Function** (No selection history yet) |
  | **Vestigial Trait (Does nothing)** | **No Function** (Inactive) | **No Function** (No contribution) | **Has Function** (Historical reason remains) |
  | **Helpful Byproduct** | **Has Function** (It does help) | **Has Function** (It helps the system) | **No Function** (Not what was selected for) |

  ### How to Write Your Bio Club Piece

  Don't conclude that one person is right. Conclude that they are using different **tools** for different **jobs**.

  1.  **Use the Cousin's definition (Historical)** when asking: "Why did this trait evolve?" (This excludes byproducts and new variations).
  2.  **Use the Friend's definition (System)** when asking: "How does this organism stay alive right now?" (This includes new variations and byproducts if they help).
  3.  **Use the Teacher's definition (Activity)** when asking: "What is the mechanism?" (This avoids assuming why it's there).

  The dispute isn't about biology; it's about whether you are acting as a **Historian** (Cousin), an **Engineer** (Friend), or a **Mechanic** (Teacher). All three are right, provided you specify which job you are hiring them to do.
