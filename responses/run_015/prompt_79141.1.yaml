      *   *Option C: The "Historical Success" Reading.* Function = Reason for existence via selection.
          *   Plausibility: High for evolution.
          *   Dispute settling: High. Distinguishes function from lucky side effects.
          *   Test cases: New scoop? No (not selected yet). Vestigial? Yes (was selected). Byproduct? No.
