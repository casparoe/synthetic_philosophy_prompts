      *   *Option E: The "Useful Fiction" Reading.* Function isn't real, just shorthand.
          *   Plausibility: Radical.
          *   Dispute settling: Dissolves the dispute.
          *   Who: None really, but good for the "radical" end of the menu.

  5.  **Refining the Analysis against Test Cases:**
      *   *Beetle Leg Scoop (First Time):*
          *   Activity/Causal/Current: Yes, it has a function.
          *   Historical: No, it's just a variation until selected.
      *   *Vestigial Trait (Selected before, does nothing now):*
          *   Activity/Causal/Current: No function (does nothing).
          *   Historical: Yes, still has a function (etiology remains).
      *   *Byproduct (Side effect that helps):*
          *   Activity/Causal/Current: Yes, functional (it helps).
          *   Historical: No, not the *function* (wasn't selected for that).

