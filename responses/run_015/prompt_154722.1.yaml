  **EDITORIAL STANDARD 4.1: VERACITY COMPLIANCE**
  **Status:** Active. **Owner:** Managing Editor. **Revision:** 3.2.

  The Outlet operates under the Belief Condition: staff must not publish statements they themselves believe to be false. All other communicative strategies are permitted provided they satisfy the Literal-Truth Audit (LTA). All copy must score 1.0 on propositional truth-value. The LTA calculates truth based on semantic content, excluding pragmatic inference. If a sentence passes the LTA but generates a misleading implicature, the Subeditor must file Form 12-B (Implicature Variance) but is authorized to publish. The burden of inference lies strictly with the reader. Staff are reminded that precision is not accuracy. Compliance is mandatory.

  1.  **Direct Assertion.** Do not assert proposition $p$ if you hold belief $\neg p$. This is the only prohibited category of falsehood.
      *   *Ex:* "The Mayor resigned" (When you believe she did not) → Prohibited.
  2.  **Attribution.** Belief conditions transfer entirely to attributed sources. The staff member need only believe the source made the statement.
      *   *Ex:* "Critics say the Mayor stole" (Permitted even if you believe the Mayor did not steal).
  3.  **Correction.** Corrections apply only to LTA failures regarding propositional content. Pragmatic failures are not errors.
      *   *Ex:* Misleading implications generated by true statements do not require correction.
  4.  **Scalar Implicature.** Exploit quantity implicatures by understating. 'Some' logically permits 'all', though it implicates 'not all'.
      *   *Ex:* "Some funds are unaccounted for" (Permitted when you believe all funds are missing).
  5.  **Epistemic Hedging.** Statements about internal knowledge states need not reflect external reality. Truth is bound to the speaker's access.
      *   *Ex:* "We have no evidence of wrongdoing" (Permitted when evidence exists but remains unseen by staff).
  6.  **Scope Ambiguity.** Utilize negation scope to allow true readings of false events. Surface structure may imply universal negation.
      *   *Ex:* "Everyone didn't arrive" (True if one person arrived; implies none arrived).
  7.  **Literal-True Denial.** Denials may address the speech act of denying, not the content of the allegation.
      *   *Ex:* "I deny the allegation" (Permitted; asserts the denial occurs, not that the allegation is false).
  8.  **Selective Disclosure.** Arrange true facts to imply a false narrative through omission. Context is not propositional content.
      *   *Ex:* Listing assets owned by a bankrupt subject without mentioning liabilities.
  9.  **Implicature Maintenance.** Do not confirm or deny inferences generated by copy when queried. Silence preserves the Belief Condition.
      *   *Ex:* If readers infer guilt from Rule 5, do not clarify the epistemic limit.
  10. **Implicature Retraction.** Staff may deny implicatures generated by their own copy if questioned directly.
      *   *Ex:* "I did not mean to suggest he was guilty" (Permitted even if copy was designed to suggest guilt).

  **Appendix A: Contradiction Resolution.**
  Rule 10 conflicts with Rule 1 if the staff member believes the reader will infer $p$ (false) from the text. In such cases, Rule 10 takes precedence regarding external communication, while Rule 1 governs internal text. This creates a divergence between published veracity and private belief. The LTA does not account for retrospective denials. Staff should proceed according to best judgment. No further guidance is available.

  ***

  **Note:** The guide presumes the Standard View of lying (asserting what one believes false) rather than the Non-Standard View (asserting what is false). It is confident that exploiting implicature avoids the belief condition. I am least sure about Rule 6; neg-raising often imports belief states that might violate the Belief Condition if the speaker knows the truth.
