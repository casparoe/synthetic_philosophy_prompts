          *   Which leads to malaria nets? (All of them, but for different reasons).
      *   **Addressing the "Strawman":** Explain *why* they got annoyed. Modern SFE distinguishes between "minimizing suffering" and "promoting non-existence." They often argue for a future with *sentience but no suffering* (hedonistic imperative), not a future with *no sentience*.
      *   **The "Golden Mean" (Answering the final question):** What position gives the malaria nets conclusion *without* the extinction conclusion?
