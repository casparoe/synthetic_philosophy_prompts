answer: |-
  This is a remarkably fertile tension for a long-form feature. You have identified a fault line that runs through much of contemporary social life, particularly in an era of high mobility and digital transparency where "local" norms are simultaneously hyper-visible and deeply obscure.

  To help you structure this comparison, I will break down the two frameworks along the four axes you identified: the status of invisible obligations, the diagnosis of normative tourism, the explanation of the opacity gap, and the risk of conflating obligation with assimilation.

  ### 1. The Moral Status of Invisible Obligations

  The core divergence between **Normative Conventionalism (NC)** and **Practice-Embedded Particularism (PEP)** lies in where they locate the source of the obligation: is it in the *structure* of the interaction, or in the *relationship* of the participants?

  **Normative Conventionalism** treats invisible obligations (like the unspoken wage-subsidy of tipping or the precise velocity of pedestrian flow) as structural load-bearing walls. Under this view, the moral obligation arises from the necessity of coordination and the fairness of not undermining a system from which one benefits.
  *   **The Invisible:** To the NC theorist, invisible conventions are objective features of the social landscape, akin to traffic laws. Just because a speed limit sign is obscured by foliage doesn't mean the limit doesn't exist.
  *   **The Visitor's Duty:** The obligation is *positional*. By entering the space, the visitor triggers the obligation. Ignorance may mitigate blame, but it does not negate the duty. If a visitor fails to tip in a tipping economy, they have objectively underpaid for a service, regardless of their cultural background.

  **Practice-Embedded Particularism** treats these same obligations as the mortar between bricks, visible only to those who helped lay them. Drawing on Wittgensteinian "forms of life" or MacIntyrean "practices," PEP argues that moral force is generated by mutual recognition and shared history.
  *   **The Invisible:** To the PEP theorist, invisible conventions are internal goods of a specific community. They are not rules to be followed but meanings to be inhabited. Without the "tacit background knowledge," the action (e.g., leaving cash on a table) is physically identical but morally null.
  *   **The Visitor's Duty:** The obligation is *relational*. A visitor is a guest, not a citizen. Their primary duty is hospitality-compatible behavior (do no harm), not system-maintenance. If they don't share the form of life, they cannot be bound by its internal logic.

  **Comparison:** NC offers a robust account of *systemic integrity* (the economy breaks if everyone opts out), while PEP offers a robust account of *moral agency* (you cannot be obligated to a meaning you cannot access).

  ### 2. Diagnosing Normative Tourism

  How do we categorize the behavior you've termed **Normative Tourism**—the selective curation of visible rituals while ignoring invisible sustenance?

  **Under Normative Conventionalism: Moral Free-Riding**
  NC views normative tourism as a species of free-riding. The tourist enjoys the *order* produced by the invisible conventions (the waiter brings food promptly because they expect a tip; the line moves efficiently because everyone respects the queue) without contributing to the *cost* of maintaining that order.
  *   **Verdict:** This is morally problematic. It treats the local moral order as a buffet where one can take the aesthetics (the "performance" of queuing) without the caloric intake (the economic or social cost of the invisible rules). It exploits the gap between visibility and obligation.

  **Under Practice-Embedded Particularism: Category Error**
  PEP views normative tourism not as a moral failure, but as an ontological misunderstanding. The tourist thinks they are "participating" in a culture by performing visible rituals, but PEP argues you cannot "sample" a form of life.
  *   **Verdict:** This is harmless cultural consumption, or perhaps a form of confusion. Since the tourist does not inhabit the reciprocal expectations, they are not "free-riding" on a moral contract they never signed. They are merely acting out a script without understanding the plot. The moral friction is felt only by the insiders who mistakenly attribute shared understanding to the visitor.

  **The Synthesis: Epistemic Free-Riding**
  For your feature, I suggest a position structurally in between. Normative tourism is **Epistemic Free-Riding**.
  The tourist benefits from the *predictability* generated by the invisible rules (they know the coffee will arrive, they know they won't be bumped in the hallway) without bearing the *epistemic burden* of learning them. They consume the *output* of the moral architecture without engaging with the *blueprint*. This makes it more than harmless consumption (because it strains the system) but less than malicious free-riding (because the intent is not exploitation, but ignorance).

  ### 3. The Opacity Gap: Insider Obligation vs. Outsider Opacity

  You asked which view better accounts for why rules feel obligatory to insiders yet remain opaque to outsiders.

  **Normative Conventionalism struggles here.**
  If obligations are generated by the need for coordination, why are they not universally legible? NC tends to assume that rules should be publicizable. When they aren't, NC must resort to a theory of "reasonable expectation of inquiry." It argues the outsider *should have known.* This often feels like victim-blaming. It fails to explain the *phenomenology* of the insider—the deep, visceral sense that a rule is "right"—versus the outsider's sense that it is arbitrary.

  **Practice-Embedded Particularism excels here.**
  PEP is built to explain opacity. It posits that moral knowledge is tacit, embodied, and acquired through participation. The "opacity" to the outsider is not a bug; it is a feature of the system. The obligation feels binding to the insider because it is woven into their identity and reciprocal relationships. To the outsider, it remains opaque because they lack the "background knowledge" that gives the rule its normative force.
  *   **Winner:** PEP offers the more coherent account of the *experience* of the gap. It explains why an insider feels a violation of a queuing norm as a personal affront (a breach of recognition), while the outsider sees it as a mere logistical error.

  ### 4. Compliance vs. Assimilation: The Justification Problem

  This is the crux of your feature. Can we demand compliance from visitors without demanding they cease to be visitors (i.e., assimilate)?

  **The Risk of Normative Conventionalism: Moral Imperialism**
  If NC argues that "when in Rome, you are bound by Roman law," it risks collapsing moral obligation into social assimilation. It implies that the local way is not just *a* way, but *the* moral way for anyone present. This creates a friction where visitors are morally culpable for not reading minds. It turns cultural difference into moral deviance.

  **The Risk of Practice-Embedded Particularism: Moral Exemption**
  If PEP argues that "outsiders are not bound by our form of life," it creates a two-tiered moral system. It grants visitors a "moral exemption pass" that locals do not have. This can be resentful to locals (who must sustain the system) and patronizing to visitors (who are treated as incapable of moral integration).

  **A Path Forward: The Duty of Non-Disruption**
  For your article to offer a resolution, you might propose a hybrid standard. Neither framework fully justifies *full compliance* (which is assimilation), but both justify *non-disruption*.
  *   **The Distinction:** There is a difference between **constitutive rules** (which create the practice, e.g., the value of the tip) and **regulative norms** (which manage the flow, e.g., standing on the right).
  *   **The Proposal:** Visitors cannot be expected to fully inhabit the *meaning* of the invisible rules (PEP is right), but they can be expected to adhere to the *function* of the visible outcomes (NC is right).
  *   **Justification:** We can justify demanding compliance not because the visitor shares the *values*, but because they are utilizing the *infrastructure*. You don't have to believe in the local religion to drive on the correct side of the road.

  Therefore, demanding full compliance is unjustified (that is assimilation). Demanding **functional alignment** is justified (that is coordination). Normative tourism becomes problematic only when it shifts from *aesthetic sampling* to *functional disruption*.

  ### Summary for Your Feature

  To sharpen your narrative arc, consider this framing:

  1.  **The Hook:** Start with a specific instance of Normative Tourism (e.g., a visitor queuing perfectly but leaving no tip, or vice versa).
  2.  **The Conflict:** Use **Normative Conventionalism** to explain why the locals are angry (systemic integrity/fairness). Use **Practice-Embedded Particularism** to explain why the visitor is confused (lack of shared form of life).
  3.  **The Diagnosis:** Define **Normative Tourism** not as malice, but as *Epistemic Free-Riding*. The visitor consumes the order without paying the cognitive cost to understand it.
  4.  **The Resolution:** Argue that the moral obligation of the visitor is not *assimilation* (becoming an insider) but *stewardship* (preserving the coordination). The moral obligation of the host is not *enforcement* but *legibility* (making the invisible visible).

  **Final Verdict:** **Practice-Embedded Particularism** offers the better explanation of *why* the gap exists (the nature of tacit knowledge), but **Normative Conventionalism** offers the better justification for *why* we might still ask visitors to comply (the necessity of coordination). Your feature can argue that the moral architecture of the future depends on bridging this gap: making the invisible visible enough for outsiders to respect, without stripping it of the local meaning that makes it valuable to insiders.
