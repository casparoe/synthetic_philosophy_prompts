  The stake doubles on every tail,
  The pot grows high without a fail.
  Powers of two rise up from zero,
  Here is what is owed to me.

  The chance halves down with every throw,
  Half of a half makes chance grow low.
  Probability falls by half each time,
  Here is what I owe to fate.

  The product yields a fraction clear,
  One divided by the place.
  The count divides the winning ways,
  Here is what is owed to me.

  The sign flips round with parity,
  Plus and minus take their turn.
  Values rise and then decay,
  Here is what I owe to fate.

  In natural order sum is found,
  Log two emerges from the ground.
  Sixty-nine cents the ledger shows,
  Here is what is owed to me.

  Shuffle terms and value flies,
  Any number meets the eyes.
  Riemann says the sum can change,
  Here is what I owe to fate.

  Absolute sum must hold the key,
  Else the integral is free.
  Lebesgue demands the total rise,
  Here is what is owed to me.

  Some say first is best and right,
  Some say order loses sight.
  Theory speaks with forked tongue still,
  Here is what I owe to fate.

  Worth ln 2, or undefined,
  By how the terms are rearranged.
