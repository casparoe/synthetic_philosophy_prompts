answer: |-
  You have hit on the most common intuition barrier for Updateless Decision Theory (UDT). Your intuition is partially correct: UDT *does* look like maximizing expected utility (EU) from a "prior" perspective (before you receive specific observations).

  However, the reason it gives different recommendations than "ordinary" expected utility maximization is not just about the **time horizon**. It is about **what you hold fixed** when you calculate the consequences of your choice.

  In decision theory jargon, "ordinary expected utility at the decision point" usually refers to **Causal Decision Theory (CDT)**. The conflict between UDT and CDT isn't about *when* you calculate; it's about *how you model counterfactuals*.

  Here is the breakdown of why UDT is not just "planning ahead," and why it wins in Newcomb's Problem where standard planning fails.

  ### 1. The "Time Horizon" Misconception
  You asked: *"Isn't it just ordinary expected utility with a longer time horizon?"*

  If you are a Causal Decision Theorist (CDT), you can indeed plan ahead. You can sit at $T=0$ (before the game starts) and say, "I plan to one-box in Newcomb's Problem."
  *   **The Problem:** When you actually arrive at $T=1$ (standing in front of the boxes), the money is already in the boxes.
  *   **The CDT Calculation:** At $T=1$, a CDT agent asks: "Given the current state of the world (boxes are filled), does my action *cause* a change in the contents?"
  *   **The Answer:** No. The predictor has already left. Causality only flows forward. Therefore, taking both boxes causally yields +$1,000 compared to taking one.
  *   **The Result:** Even if you planned to one-box at $T=0$, a rational CDT agent at $T=1$ will realize that the plan is no longer optimal *given the current state*. You will "defect" against your past self. This is called **time inconsistency**.

  So, simply having a "longer time horizon" doesn't help a CDT agent, because at the moment of decision, the causal logic forces them to two-box. To make the plan stick, a CDT agent needs **precommitment** (an external mechanism to bind their future self).

  **UDT is not precommitment; it is a different decision logic.** A UDT agent does not re-evaluate at $T=1$. It treats the decision at $T=1$ as the output of the policy selected at $T=0$. It doesn't see $T=1$ as a new decision point; it sees it as the *execution* of the original decision.

  ### 2. The Core Difference: Counterfactuals
  The real wall you are hitting is likely the concept of **Logical Counterfactuals** vs. **Causal Counterfactuals**.

  #### Causal Decision Theory (Ordinary EU)
  When a CDT agent evaluates an action $A$, it asks:
  > "If I do $A$ *right now*, what happens, holding the past fixed?"

  In Newcomb's Problem, "the past" includes the Predictor's prediction. Since the prediction is in the past, CDT holds it fixed.
  *   **Counterfactual:** If I one-box, the boxes contain what they already contain (likely \$1,000). If I two-box, the boxes contain what they already contain (likely \$1,000 + \$1,000,000).
  *   **Recommendation:** Two-box.

  #### Updateless Decision Theory
  When a UDT agent evaluates a policy $P$, it asks:
  > "If my source code outputs action $A$ in this situation, what is the logical consequence?"

  UDT recognizes that the Predictor did not predict the *action*; it predicted the *output of your decision procedure*. Your decision procedure and the Predictor's simulation are logically linked.
  *   **Counterfactual:** If my policy says "One-Box," then the simulation (which is logically identical to me) output "One-Box," so the Predictor put \$1,000,000 in the box. If my policy says "Two-Box," the simulation output "Two-Box," so the box is empty.
  *   **Recommendation:** One-box.

  UDT does not hold the prediction fixed, because the prediction is **logically dependent** on your current decision, even if it is **causally independent**.

  ### 3. Why "EU over Policies" matters
  You mentioned: *"if the agent is just doing EU over policies?"*

  A CDT agent *can* maximize EU over policies, but only if it can guarantee it will stick to that policy.
  *   **CDT Agent:** "I choose the policy 'One-Box' at $T=0$. But at $T=1$, I will maximize EU over *actions*. Since Two-Boxing has higher EU at $T=1$, I will switch policies."
  *   **UDT Agent:** "I choose the policy 'One-Box' at $T=0$. At $T=1$, I do not make a new decision. I simply execute the policy. There is no opportunity to switch."

  The difference is that UDT agents treat their future selves as **outputs of the same function**, not as independent agents that can be reasoned with causally.

  ### 4. An Analogy: Source Code vs. Runtime
  Imagine you are a computer program.

  *   **CDT** is like the program running at runtime. It looks at the memory state *right now*. It sees the variable `box_content` is already set. It thinks, "I can't change `box_content` now, so I might as well grab both."
  *   **UDT** is like the programmer writing the source code *before* compilation. The programmer knows that the variable `box_content` was set by a function that *simulated the source code*.
      *   If the programmer writes `return ONE_BOX`, the simulation returns `ONE_BOX`, and `box_content` becomes \$1M.
      *   If the programmer writes `return TWO_BOX`, the simulation returns `TWO_BOX`, and `box_content` becomes \$0.

  The "runtime" (CDT) thinks it's too late to influence the past. The "source code" (UDT) knows that the past was determined by the code it is writing now.

  ### 5. Summary: Why they diverge
  UDT gives a different recommendation than "ordinary EU at the decision point" because:

  1.  **Information State:** Ordinary EU conditions on what you know *now* (that the prediction is past). UDT conditions on what you knew *before* (that your algorithm determines the prediction).
  2.  **Dependency:** Ordinary EU only respects **causal** dependencies (arrow of time). UDT respects **logical** dependencies (mathematical identity).
  3.  **Time Consistency:** Ordinary EU leads to time inconsistency (planning to one-box, then two-boxing). UDT is time-consistent by definition because it never "updates" on new information to change its policy; it only uses new information to index into its pre-chosen policy.

  **The "Wall" you are hitting:**
  You are likely trying to view UDT as a causal process happening in time ("First I choose a policy, then time passes, then I act").
  To understand UDT, you must view it **atemporally**. You are not an agent *in* the universe making a choice; you are a mathematical function *defining* a choice. The question isn't "What should I do now?" it is "What function should I be?"

  In Newcomb's Problem, the function `f() = One-Box` yields more utility than `f() = Two-Box`, regardless of when the function is evaluated. Ordinary EU fails because it tries to evaluate the *action* locally, ignoring that the action is an instance of the function.
