answer: |-
  **Opening Remarks: History as Method?**
  **Convened by the Department of History and the School of International Affairs**

  Distinguished colleagues, practitioners, and guests, welcome.

  We gather here with a deliberate tension in the room. On my left, I see scholars who can recite the historiography of Munich from A to Z. On my right, I see diplomats and defence analysts who have had the lessons of Munich invoked in crisis briefings at three in the morning. We are here to ask whether history can legitimately guide policy.

  I intend to be provocative. My position is that historical analogy, as it is currently practised in statecraft, usually misleads. However, I do not say this to chastise policymakers for laziness, nor to grant historians a monopoly on truth. To dismiss analogy as mere intellectual sloth is to miss the point. It is to treat a structural failure as a personal one. My argument today is that the failure of analogy is a *conceptual* error, one that requires us to rethink the very machinery of how we compare the past to the present.

  We are all familiar with the usual suspects. The spectre of Munich warns us that concession invites aggression. The quagmire of Vietnam warns that superior firepower cannot solve political deficits. The Thucydides Trap suggests that war between a rising and a ruling power is inevitable. When these analogies fail, the standard defence from the academy is to say, "The details are different." The standard retort from the practitioner is, "But the pattern feels the same."

  Both are partially right, but both are fundamentally wrong. The error is not that the surface details differ; we know no two historical moments are identical. The error is that we conflate *narrative resemblance* with *causal homology*. We assume that because two stories look alike, the engines driving them must be the same.

  To make this precise, I want to introduce a distinction that I hope will structure our next two days: the difference between **surface isomorphism** and **mechanistic portability**.

  *Surface isomorphism* is what happens when two episodes share a similar shape. In 1938 and in a hypothetical crisis today, you have a rising aggressor, a status-quo power, and a contested territory. The narrative arc is isomorphic; the plot points align. This is where the diplomat's intuition works. It recognises the pattern.

  *Mechanistic portability*, however, asks whether the causal gears turning beneath that surface actually function the same way across different institutional regimes. This is where the intuition fails. A mechanism is portable only if the causal logic that sustains it remains stable when transplanted from one institutional environment to another.

  Consider Munich. The mechanism of appeasement in 1938 relied on a specific causal logic: that authoritarian regimes could be satiated by territorial concession because their primary goal was revisionist expansion within a specific European balance of power. Today, when we fear a 'new Munich', we are often assuming that mechanism is portable to a globalised, nuclear-armed, digitally connected institutional regime. But is it? The domestic accountability structures, the alliance commitments, and the economic interdependencies of the twenty-first century constitute a different causal ecosystem. A mechanism that worked (or failed) in the Westphalian system of the 1930s may not be portable to the institutional regime of the present, even if the surface isomorphism is striking.

  When we rely on surface isomorphism without testing for mechanistic portability, we are not doing history; we are engaging in a form of secular astrology. We are reading shapes in the clouds and assuming they dictate the weather.

  This is why I propose we shift the central question of this workshop. We must stop asking, "Which past is this like?" That question invites the seduction of surface isomorphism. It asks the historian to be a librarian of precedents, and the policymaker to be a shopper of solutions.

  Instead, we must ask: "Which causal mechanisms are actually active here, and under what modal conditions do they remain stable across regimes?"

  For the historians in the room, this demands more than archival rigour. It requires you to treat history not just as a sequence of events, but as a laboratory of causal mechanisms. You must isolate the variable. Was it the personality of the leader, or the structure of the alliance, that caused the escalation?

  For the practitioners, this demands a different kind of patience. It asks you to resist the comfort of the ready-made label. When a briefing paper invokes the Thucydides Trap, do not ask if the rise of China looks like the rise of Athens. Ask if the mechanism of 'security dilemma' operates with the same intensity in a nuclear environment as it did in a trireme environment. If the institutional regime has changed the cost-benefit analysis of war, the mechanism is not portable, and the analogy is void.

  This is a harder task. It denies us the comfort of the easy lesson. It suggests that history does not repeat itself, not because human nature changes, but because the institutional containers in which human nature operates are constantly being rebuilt.

  Over the next two days, I invite you to treat analogy not as a shortcut, but as a hypothesis. A hypothesis that must be stress-tested against the friction of institutional reality. If we can move from surface isomorphism to mechanistic portability, we may not find a map for the future. But we might, at last, develop a compass that actually points north.

  Thank you.

  ***

  **Reflexive Note**

  **Confidence Level:**
  I am moderately confident in the core philosophical claim: that policy failures often stem from mistaking narrative similarity for causal identity. This aligns with established critiques in the philosophy of social science regarding the limits of comparative historical analysis. The distinction between the *story* of the event and the *logic* of the event is robust enough to hold up under scrutiny from both historians and IR theorists.

  **Point of Least Certainty:**
  The specific distinction I injected—between "surface isomorphism" and "mechanistic portability"—is the point about which I am least sure, particularly regarding its travel across different types of institutional regime. While the distinction is analytically clean in the abstract, I am uncertain whether "mechanistic portability" can be empirically verified in complex social systems. In physics, a mechanism (like gravity) is portable across regimes because the underlying laws are constant. In international relations, the "laws" are contingent on human interpretation and institutional design. Therefore, asserting that a mechanism is *not* portable requires a counterfactual certainty that may be just as elusive as the analogy itself. I worry that practitioners might find "mechanistic portability" just as abstract as the theories they dislike, if we cannot provide a clear metric for when a mechanism has successfully 'ported' from one era to another.
