answer: |-
  You are definitely not overfitting, and your intuition is sharper than the introductory syllabus you're working with. What you are describing is a well-documented phenomenon in advanced sociology and organizational theory, though "normative shadowing" isn't a standard term (yet). It is a very evocative one, however, and it captures a dynamic that the basic "Tight vs. Loose" heuristic often flattens.

  Here is the breakdown of the concepts you are bumping into, why the Tight/Loose framework feels insufficient, and why this asymmetry clusters in specific domains.

  ### 1. Is there a name for this mismatch?

  Your "normative shadowing" aligns closely with three existing concepts. None capture it perfectly on their own, but together they map your observation:

  **A. Institutional Decoupling (Meyer & Rowan)**
  This is the closest formal concept. It describes the separation between a society's "formal structures" (laws, official rules, mission statements) and its "actual practices." In decoupled systems, organizations (or societies) maintain legitimacy by having rules on paper, but they buffer their technical core from those rules to allow flexibility.
  *   *In your context:* Berlin decouples traffic laws from practice (flexibility) but couples social consensus tightly. Tokyo decouples pragmatic workflow from rigid protocol *except* where hierarchy is concerned.

  **B. Compensatory Social Control**
  This comes from control theory. It suggests that social order is a finite resource. If formal control mechanisms (police, contracts, deadlines) are relaxed, informal mechanisms (shaming, ostracization, gossip) often tighten to prevent anomie (normlessness).
  *   *The "Shadow":* If the state doesn't punish you for jaywalking, the *group* must punish you for breaking social trust, or the society fears it will unravel. The pressure doesn't disappear; it migrates.

  **C. Domain-Specific Tightness-Looseness**
  Michele Gelfand (who popularized Tight/Loose) has acknowledged in later research that tightness is not monolithic. A culture can be tight in *social norms* but loose in *economic regulations*, or vice versa. However, intro courses often skip this nuance. You are observing **negative correlation across domains**: where one domain is loose, another becomes tight to maintain equilibrium.

  ### 2. Is the Tight/Loose framework broken?

  It isn't broken, but it is **low-resolution**.

  The Tight/Loose framework is a *macro-level* heuristic designed for cross-national comparison (e.g., "Why does Singapore have different crime rates than Brazil?"). It is terrible at explaining *micro-level* social navigation (e.g., "Why did my Berlin friends stop replying to me in the WhatsApp group?").

  When you treat Tight/Loose as a single dial, you commit an **ecological fallacy**: assuming what is true for the aggregate (the nation) is true for every interaction within it.

  Your observation suggests a more accurate model is a **Matrix of Sanctions**:
  *   **Axis 1:** Formal vs. Informal Rules.
  *   **Axis 2:** Public vs. Private Spheres.
  *   **Axis 3:** Task vs. Relationship Domains.

  Berlin and Tokyo aren't just "Loose" or "Tight"; they occupy different quadrants of this matrix.
  *   **Berlin:** Low Formal/Public Tightness + High Informal/Relationship Tightness. (You can break the law, but don't break the *Vibe*.)
  *   **Tokyo:** High Formal/Public Tightness + High Informal/Hierarchical Tightness (with pragmatic flexibility in the middle).

  ### 3. Why does the asymmetry cluster in Dissent and Hierarchy?

  You asked if you're overfitting on these domains. You aren't. These are the **Sacred Values** of the respective social contracts. Every society allows deviance in "profane" areas (jaywalking, dress codes, lunch times) to release pressure, but it clamps down ruthlessly on "sacred" areas that threaten the core coordination mechanism.

  **In Berlin (The Consensus Model):**
  *   **Core Value:** Autonomy within a collective agreement.
  *   **The Threat:** Disrupting the consensus without following the *proper procedure* for dissent.
  *   **The Mechanism:** Berlin culture values directness, but it values *legitimized* directness. If you disagree in a group chat using the "wrong tone" or bypassing the unwritten protocol of how conflict is processed, you aren't just disagreeing; you are threatening the fragile consensus that holds the loose society together. The "freeze out" is a defense mechanism for the group's cohesion.

  **In Tokyo (The Harmony/Hierarchy Model):**
  *   **Core Value:** *Wa* (Harmony) and Role Stability.
  *   **The Threat:** Ambiguity in status or public disruption of harmony.
  *   **The Mechanism:** The "pragmatic flexibility" you see in Tokyo is often *tatemae* (public facade) allowing things to get done. But the *hierarchy* is the skeleton holding the facade up. If you challenge the hierarchy, you aren't just challenging a boss; you are challenging the structural integrity of the group's reality. Hence, the informal penalty is severe.

  ### 4. What should you call it?

  Since "Normative Shadowing" isn't taken, keep using it in your notes. It's better than most textbook terms. However, if you need to cite existing literature to back it up in your course, look for:

  1.  **"Latent vs. Manifest Functions"** (Robert Merton): Manifest is the stated rule; Latent is the actual social consequence.
  2.  **"Symbolic Boundaries"** (Michèle Lamont): How groups define who is "in" and "out" not by rules, but by cultural signals.
  3.  **"Institutional Logics"** (Thornton & Ocasio): How different spheres (market, family, state) have different rule sets that compete.

  ### Summary
  You have identified that **social control is conserved, not eliminated.**

  In "Loose" societies, control moves from the State to the Social Group. In "Tight" societies, control moves from the Social Group to the Ritual/Structure (except where hierarchy is concerned).

  The Tight/Loose dial isn't wrong, but it's like describing a meal as just "Spicy." It tells you something, but it doesn't tell you *where* the heat is. You're noticing that in Berlin, the heat is in the social sauce, while in Tokyo, the heat is in the structural bones. That is a sophisticated sociological insight, not overfitting.
