answer: |-
  **Seminar Prep: Dissociation, Interpretation, and the Unity of the Self in *Jekyll and Hyde***

  **Opening Frame**
  We usually teach *Jekyll and Hyde* as a moral fable about Victorian repression—the civilized superego versus the primal id. But if we put Freud aside and pick up Sperry and Gazzaniga, the text looks less like a moral allegory and more like a case study in fractured agency. The prompt asks us to avoid the lazy mapping of "Hyde = Right Hemisphere." Instead, I want to focus on the *narrative structure* of Jekyll's confession as a neurological phenomenon. Specifically, Jekyll's "Full Statement of the Case" functions exactly like Gazzaniga's left-hemisphere interpreter: it is a post-hoc confabulation designed to impose a singular authorial voice on actions initiated by a disconnected cognitive stream.

  **1. Jekyll as the Left-Hemisphere Interpreter**
  In split-brain patients, the left hemisphere (language-dominant) often observes actions initiated by the right hemisphere and instantly constructs a plausible, albeit false, narrative to explain them. If the RH is shown "snow" and the LH is shown "ball," the patient might pick a snowball with the left hand. When asked why, the LH doesn't say "I don't know"; it says, "I wanted to clean something."

  Jekyll's narration does this precisely. Throughout the novella, Jekyll tries to maintain the grammatical first-person ("I") even when describing actions he did not consciously will. He writes of Hyde's crimes as if they were his own experiments gone wrong, rather than acknowledging them as the output of a separate agent. He says, "I brought the life of that unhappy Henry Jekyll to an end." But did he? Or did the "Jekyll" module simply lose control of the executive function?

  When Jekyll writes his statement, he is stitching together a coherent biography from fragmented memories and blackouts. He is the interpreter module trying to save the illusion of the "Unified Self." The horror of the book isn't just that there is a monster inside; it's that the "I" is a fiction maintained by a narrator who is constantly lying to himself to preserve the sense of continuity. Jekyll claims he chose to become Hyde; the neuroscience reading suggests Jekyll is merely rationalizing the emergence of a dissociated stream that has seized the motor controls.

  **2. Chemical Dissociation vs. Structural Split**
  Here is where the analogy strains, and where we need to press the text. In split-brain cases, the separation is structural (the corpus callosum is severed). The two streams exist because the hardware is cut. In Stevenson's novella, the separation is pharmacological. Hyde depends on the salt in the potion.

  This dependency undermines the "two persons" thesis. If Hyde were a truly distinct consciousness analogous to a disconnected hemisphere, he should persist as long as the brain persists. But Hyde cannot exist without the chemical trigger. This suggests Hyde isn't a separate *person* in the Lockean sense of continuous consciousness, but rather a *state* of the organism.

  Think of it this way: A split-brain patient doesn't need a drug to exhibit intermanual conflict; they just need to be tested. Jekyll needs a specific chemical cocktail to unlock Hyde. This makes Hyde less like a second person and more like a seizure focus or a tumor with agency. It shifts the metaphysical question from "Are there two souls?" to "Is personality merely chemical stability?" If the salt runs out, Hyde vanishes. If you sever the callosum, the duality remains. Stevenson seems to intuit that without a structural barrier, the "evil" stream is parasitic. It leeches off Jekyll's biology but cannot sustain its own ontology. This argues against the "two persons" view: Hyde is a symptom, not a neighbor.

  **3. Intermanual Conflict vs. Moral Allegory**
  Let's look at the rivalry. In neurology, we see "intermanual conflict": one hand buttons the shirt, the other unbuttons it. It's a conflict of *agency*, not necessarily morality. It's frustrating, mechanical, and amoral.

  Stevenson romanticizes this into a war of Good vs. Evil. Jekyll isn't just trying to button his shirt; he's trying to uphold the law. Hyde isn't just unbuttoning it; he's murdering Carew. The book takes the neurological reality of competing motor programs and overlays a Victorian moral framework.

  Does the book get the rivalry right? In terms of *loss of control*, yes. Jekyll describes waking up with Hyde's hands on his own, or finding he has transformed without drinking the potion. This mirrors the alien hand syndrome where the patient feels the limb is foreign. But Stevenson can't resist making it a moral battle. In real dissociation, the competing streams are often indifferent to each other. In the book, they are obsessed with each other. Jekyll hates Hyde; Hyde mocks Jekyll. This suggests Stevenson is less interested in the mechanics of consciousness and more interested in the *guilt* of consciousness. The "conflict" is manufactured to ensure Jekyll remains culpable. If it were pure intermanual conflict, Jekyll would be a victim of his biology. By making it a moral struggle, Stevenson ensures Jekyll is a sinner. The neuroscience suggests a tragedy of mechanism; the novella demands a tragedy of sin.

  **4. The Ending: One Death or Two?**
  Finally, the cabinet scene. Jekyll locks himself in. The salt fails. He dies as Jekyll, but Hyde is present in the twitching body.

  If they were truly two persons, the destruction of the "bridge" (the serum) shouldn't necessarily kill both. In hemispherectomies, one side is removed, and the person lives. Here, when the chemical bridge collapses, both streams terminate.

  Does this prove they were always one person? I'd argue it proves they were functionally dependent on the *mechanism of separation*. The serum wasn't just a bridge; it was the engine of the dissociation. Without the energy to maintain the split, the system crashes. It's not that they merge back into a whole person; it's that the distinction requires energy to sustain.

  However, there's a darker reading: The death of the body kills both because consciousness is embodied. You can't have a "Hyde" without the Jekyll brain to host him. The ending argues for a fragile unity. The "Interpreter" (Jekyll) and the "Agent" (Hyde) are bound to the same biological substrate. When the substrate fails, the distinction becomes meaningless. It challenges the idea that we can surgically or chemically excise parts of our self and expect them to live independently. You can split the mind, but you cannot split the life.

  **Discussion Questions for the Seminar:**
  1.  If Jekyll's "Statement" is a confabulation by the left-hemisphere interpreter, can we trust *any* of the moral conclusions he draws about Hyde? Or is the guilt itself a fabrication?
  2.  Does the chemical dependency of Hyde reduce him to a "state" rather than a "person," and does that let Jekyll off the hook morally, or make him more responsible (as the chemist)?
  3.  Is the "intermanual conflict" in the book a genuine insight into competing motor programs, or does the moral framing distort the neurological reality?
  4.  If the serum is the corpus callosum analogue, does its failure at the end suggest that a divided self is inherently unstable and doomed to collapse, or simply that the specific *method* of division was flawed?

  **Closing Thought**
  Stevenson wrote this before the commissurotomy experiments of the 1960s, yet he grasps the horror of the interpreter module better than most modern case studies. He realizes that the "Self" is a story we tell to explain the actions of a body we don't fully control. But he ultimately retreats from the hard materialist implication. He wants Hyde to be a monster we can kill, not a hemisphere we have to live with. The tragedy isn't that Jekyll is two people; it's that he insists on being one, and the biology won't allow it.
