      *   *The Two Persons Question:* Split-brain patients sometimes exhibit two distinct wills. Jekyll claims Hyde is distinct. But Hyde needs the potion. A split brain doesn't need a drug to have separate processing streams; the separation is structural. Jekyll's separation is chemical/pharmacological. Does this make Hyde a symptom rather than a person?
