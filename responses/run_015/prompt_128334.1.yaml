prompt: |-
  Read Stevenson's Strange Case of Dr Jekyll and Mr Hyde through split-brain neuroscience and the philosophy of personal unity. Dont just map Hyde onto the other hemisphere — I want you to take seriously the idea that Jekyll's first-person narration works like Gazzaniga's left-hemisphere interpreter, confabulating a single author for actions that come from elsewhere. At the same time ask whether the novella actually supports the view that splitting consciousness creates two persons, or whether it undermines that by making Hyde depend on Jekyll's chemistry in a way real split-brain patients doesnt depend on a drug. I'm also curious about a weirder parallel: in some split-brain cases there's intermanual conflict, one hand undoing what the other does, which is almost like Jekyll and Hyde competing for the same body but without shared memory. Does the book get that kind of rivalry right, or does it romanticize it into moral allegory? And finally, does the ending — where both die together — argue they were always one person, or does it just show that destroying the bridge (the corpus callosum, or here the serum) kills both streams? Write like you're prepping a discussion for a philosophy of mind seminar that already knows Sperry but hasn't read Stevenson lately. No need for citatons, just an honest reading that takes both sides seriously.
