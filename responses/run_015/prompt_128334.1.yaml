      *   *The Ending:* Jekyll/Hyde die together in the cabinet. In split-brain theory, if you destroy the bridge, do the minds merge or vanish? Here, the "bridge" (the salt/potion) runs out. The body dies. Does this imply ontological unity (one soul, two masks) or functional dependency (two streams, one power source)?

