answer: |-
  # Spec Sheet: Normative Theory of Collective Memory vs. Historical Record

  ## 1. Core Desiderata (Functional Requirements)
  An adequate theory must satisfy the following five requirements to be considered robust.

  **1.1 Epistemic Accountability**
  *   **Requirement:** The theory must provide a mechanism to distinguish between factually accurate claims and factually inaccurate claims, regardless of social utility.
  *   **Reasoning:** Without this, the theory collapses into relativism. If "truth" is entirely contingent on the group holding it, there is no basis for resolving conflicts between competing memories, only power struggles.

  **1.2 Social Functionality Recognition**
  *   **Requirement:** The theory must account for the *purpose* of the memory (e.g., trauma processing, group cohesion, moral instruction) as a variable independent of its factual accuracy.
  *   **Reasoning:** Collective memory is not failed history; it is a different cognitive tool. A theory that treats memory solely as "bad history" fails to explain why communities cling to inaccuracies that serve vital psychological or social needs.

  **1.3 Agency Attribution**
  *   **Requirement:** The theory must specify *who* holds the right to curate the narrative (the state, the affected community, professional historians, or a hybrid body).
  *   **Reasoning:** Conflicts often arise not from the content but from the authority. A factually correct narrative imposed by an oppressor is often rejected not because it is false, but because the messenger lacks legitimacy.

  **1.4 Harm Calculus**
  *   **Requirement:** The theory must weigh the epistemic harm of falsehood against the social/physical harm of truth-telling.
  *   **Reasoning:** In post-conflict zones, publishing accurate records of atrocities can reignite violence. The theory must explain when silence is a moral obligation rather than a vice.

  **1.5 Temporal Flexibility**
  *   **Requirement:** The theory must allow for the status of a narrative to change over time (e.g., a "vital myth" may become a "harmful lie" as political contexts shift).
  *   **Reasoning:** Memory is dynamic; history is static. A rigid theory cannot account for the lifecycle of monuments or curricula, which often shift from veneration to critique over decades.

  ---

  ## 2. The Test Suite (Cases the Theory Must Resolve)
  If the theory cannot generate a coherent prescription for these three scenarios, it is insufficient.

  **Case A: The Vital Myth (Factually Wrong / Socially Vital)**
  *   **Scenario:** A community's founding story contains demonstrable falsehoods (e.g., exaggerated heroism, sanitized origins) that are central to their current political cohesion or self-worth.
  *   **Test:** Does the theory mandate correction? If so, does it offer a transition strategy? If not, does it provide a limit to prevent the myth from becoming harmful propaganda?

  **Case B: The Dangerous Truth (Factually Accurate / Socially Harmful)**
  *   **Scenario:** Archival evidence confirms specific atrocities committed by Group X against Group Y. Publishing this now would likely trigger retaliatory violence in a fragile peace process.
  *   **Test:** Does the theory permit "structured forgetting" or delayed disclosure? On what grounds is truth deferred?

  **Case C: The Relevance Conflict (Not About Facts, But Weight)**
  *   **Scenario:** Both sides agree on the events (e.g., colonization happened), but disagree on the *framing* (e.g., "economic development" vs. "resource extraction").
  *   **Test:** Does the theory have a metric for "significance"? Can it adjudicate which facts are central and which are peripheral without imposing an external ideological standard?

  ---

  ## 3. Critical Distinctions (Conceptual Boundaries)
  The theory must preserve these distinctions to avoid category errors.

  **3.1 Correction vs. Erasure**
  *   **Definition:** *Correction* adds context or fixes data within an existing narrative. *Erasure* removes the subject from the narrative entirely.
  *   **Why it matters:** Liberal pluralists often conflate the two. A theory must allow for correcting a statue's plaque (correction) without necessarily demanding the statue's removal (erasure), or vice versa, based on specific criteria.

  **3.2 State-Mandated Forgetting vs. Organic Amnesia**
  *   **Definition:** *Mandated* is legal/censorial suppression. *Organic* is the natural fading of relevance or the protective silence of survivors.
  *   **Why it matters:** Moral judgment differs. State censorship is usually a rights violation; organic amnesia may be a coping mechanism. The theory must not treat all silence as oppression.

  **3.3 Mnemonic Sovereignty vs. Denialism**
  *   **Definition:** *Sovereignty* is a community's right to interpret their own trauma. *Denialism* is the rejection of another group's humanity or factual existence to bolster one's own.
  *   **Why it matters:** This is the hard line. Sovereignty is defensive; denialism is offensive. The theory must provide a bright line where "our story" becomes "your erasure."

  ---

  ## 4. Constraints & Tensions

  **4.1 Cognitive Constraint (Group Cognition)**
  *   **Requirement:** The theory cannot treat collective memory as merely the sum of individual memories. It must account for distributed cognition (artifacts, rituals, institutions).
  *   **Implication:** You cannot fix a memory conflict just by educating individuals. You must address the *environment* (monuments, holidays, laws).

  **4.2 Epistemic Constraint (Non-Relativism)**
  *   **Requirement:** The theory must maintain that some accounts are objectively false, even if they are socially useful.
  *   **Implication:** You cannot treat every narrative as "equally valid" in a truth-claim sense.

  **4.3 Jointly Unsatisfiable Pairs**
  *   **Pair 1: Absolute Epistemic Integrity vs. Absolute Social Stability.**
      *   *Conflict:* You cannot always have the full truth and immediate peace. In post-conflict societies, these are often trade-offs. A theory claiming to maximize both simultaneously is unrealistic.
  *   **Pair 2: Mnemonic Sovereignty vs. Universal Historical Standards.**
      *   *Conflict:* If a community has the right to shape their narrative (Sovereignty), they may reject external historical verification (Universal Standards). You cannot fully grant a group the right to define their own reality *and* insist on an external arbiter of truth without one trumping the other.

  ---

  ## 5. The Knockout Requirement
  **Requirement:** *Epistemic Non-Relativism with Social Accommodation.*
  (The theory must permit the categorization of a socially functional narrative as factually false without mandating its immediate eradication.)

  **Why this knocks out common Liberal-Pluralist answers:**
  Most liberal-pluralist frameworks rely on **Multivocality**: the idea that all narratives are valid "perspectives" and should coexist in the marketplace of ideas.
  *   **The Failure:** When faced with a "Vital Myth" (Case A), the pluralist wants to say, "That is their truth." The Knockout Requirement forces them to say, "That is a lie, but it serves a function."
  *   **The Collapse:** Liberal pluralism struggles to justify *protecting* a known falsehood without undermining its commitment to free inquiry, or *debunking* it without undermining its commitment to cultural respect. It usually resolves this by blurring the line between truth and perspective. A rigorous theory must keep the line sharp and still explain why we might tolerate the falsehood.

  ---

  ## 6. Classification of Requirements

  **Non-Negotiable (Hard Constraints)**
  *   **Epistemic Accountability:** If the theory cannot distinguish fact from fiction, it is not a theory of *history* vs. *memory*; it is a theory of propaganda.
  *   **Harm Calculus:** Ignoring the real-world consequences of truth-telling (e.g., violence, retraumatization) makes the theory ethically inert.
  *   **Cognitive Constraint:** Ignoring how group cognition actually works (distributed, artifact-dependent) makes the theory psychologically implausible.

  **Camp Preferences (Variable Parameters)**
  *   **Agency Attribution:** *Communitarian* theories will prioritize the affected group's sovereignty. *Cosmopolitan* theories will prioritize international/historical consensus. A robust theory can accommodate either, provided it is consistent.
  *   **Temporal Flexibility:** *Restorative* theories prioritize returning to a pre-conflict truth. *Transformative* theories prioritize creating a new, shared future narrative. Both are valid strategic choices, not theoretical failures.

  **The Critical Tension to Flag**
  *   **Narrative Rights vs. Obligation to Correct:** In post-conflict societies, "structured forgetting" is sometimes defended as mnemonic reparation (allowing perpetrators to reintegrate). This directly conflicts with the **Epistemic Accountability** requirement.
  *   **Resolution Note:** The theory must explicitly state whether *justice* (correcting the record) or *peace* (social stability) is the terminal value. It cannot claim to maximize both without a hierarchy. If it claims they are always compatible, it fails the **Harm Calculus** test.
