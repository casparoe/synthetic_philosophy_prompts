answer: |-
  **The Joke**

  Pascal, a Mercenary, and a Jurist are stranded on a desert island. 

  The Mercenary flexes and says, "I have the muscles. I should be King."
  The Jurist adjusts his spectacles and says, "I have the Code. I should be King."
  They turn to Pascal to arbitrate.

  Pascal sighs, takes the Jurist's wig and robes, and hands them to the Mercenary.
  The Mercenary looks confused. "Why? I don't know the law."
  Pascal replies, "It doesn't matter. If you rule as a Mercenary, they'll try to kill you in your sleep. If you rule as a Judge, they'll just appeal to a higher court."

  The Jurist protests, "But that's a lie! He's just force in a costume."
  Pascal shrugs. "Justice without force is powerless. Force without justice is accused."
  He gestures to the Mercenary, now struggling into the robes.
  "We cannot make justice strong enough to carry the sword. So we must make the sword heavy enough to carry the robes."

  The Mercenary strikes a pose, gavel in one hand, cutlass in the other. "So, am I Just?"
  Pascal lights a candle. "No. But you are *unquestionable*."
  He turns to the Jurist. "And that, my friend, is the only difference that keeps the peace."

  **The Punchline:** 
  "We don't dress the force in justice to save the force. We do it to save ourselves from knowing we are ruled by force."

  ***

  **Critical Note on Interpretive Liberties**

  This joke relies on a specific, somewhat secularized reading of Pascal's *Pensées* (specifically Lafuma 103/298), treating the fragment as a stable political diagnosis rather than a theological lament. 

  **1. Descriptive vs. Normative Cynicism:**
  The joke presents Pascal's argument as a pragmatic solution ("the only difference that keeps the peace"). However, a rigorous scholarly reading might object that Pascal does not offer this conflation as a *solution* to be endorsed, but as a symptom of the *Fall*. For Pascal, the "mystical foundation of authority" is not merely a clever social technology; it is evidence of human wretchedness. True justice exists only in God, and earthly laws are a necessary distraction (*divertissement*) from our inability to bear the truth of our condition. The joke risks making Pascal sound like a realist Machiavellian, whereas his tone is typically one of Christian skepticism—he accepts the arrangement not because it is good, but because human corruption makes the alternative (constant civil war over disputable truths) worse.

  **2. The Theological Counter-Reading:**
  A theologically grounded counter-reading would argue the joke misfires by implying the "masking" is successful or stable. For Pascal, the mask is transparent to the believer. We *know* it is force, and that knowledge is supposed to drive us toward the need for Grace. If the audience laughs as if the trick works perfectly, they miss Pascal's point that the trick is tragic. The punchline ("save ourselves from knowing") hints at this, but a strict Augustinian interpretation would insist we *cannot* fully save ourselves from knowing; the unease is the point.

  **3. Distinction from Hobbes and Thrasymachus:**
  *   **Thrasymachus:** Claims justice *is* the interest of the stronger. The joke avoids this by having Pascal admit the Mercenary is *not* Just, only *unquestionable*. Thrasymachus denies the distinction; Pascal insists on it but says we must ignore it.
  *   **Hobbes:** Claims authority is constituted by the social contract to ensure security. The joke avoids this by focusing on the *aesthetic* masking (the robes) rather than the *contractual* authorization. For Hobbes, the Sovereign is Just because he is Authorized. For Pascal, the Sovereign is *called* Just because we cannot bear to see him as merely Authorized Force.

  The joke functions for a seminar because it isolates the *epistemic* move (making force *appear* just) rather than the *ontological* move (making force *become* just), which is the precise hinge of Pascal's fragment.
