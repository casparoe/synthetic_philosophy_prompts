prompt: |-
  hey, I want you to actually pick a side here and defend it, not give me a balanced overview of both sides.

  Quick setup so we're on the same page: Molyneux's question (the one he put to Locke) is about a man blind from birth who's handled a cube and a globe and can tell them apart by touch — if he suddenly gained sight, could he tell, just by looking and before touching, which is the cube and which the globe? Locke and Molyneux both thought no.

  Here's the thing I want you to argue against. A lot of people read that expected "no" as evidence for something pretty strong: that there's no such thing as shape as such, only shape-for-the-eye and shape-for-the-hand, and that the newly sighted man has to *learn* to hook the two together more or less the way you learn that a certain sound goes with a certain object — an arbitrary link, not the recognition of something already shared.

  Your job: argue that the standard "no" answer, even granting it's the right prediction about what he'd do in the first few minutes, is basically evidentially inert with respect to that strong reading. Two moves I want you to build the argument out of.

  First, the reverse test. Give me a version of Molyneux's question run in the other direction: someone blind from birth gets sight, is shown a shape they've never felt (a weird extruded star thing, whatever), gets to look at it for a bit, and then blindfolded has to pick it out by touch from a pile of shapes. Call it the reverse-Molyneux test. Argue that they'd pass, and that somebody committed to the shape-for-the-eye / shape-for-the-hand view is (embarrassingly) committed to them failing. Also, since the reverse test can't be as strictly immediate as the original, say something about why that asymmetry is or isn't cheating.

  Second, and this is the part I actually care about: even if the reverse test goes through, your opponent can say it only shows a learned translation from visual code to haptic code, not a genuinely modality-neutral shape representation. So tell me what would even *distinguish* those two. I've got a pet idea you should engage with (argue for it, or argue against it and give me something better): if there's a real shared shape notion, transfer should be one-shot and errors should be shape-similarity-structured — confusing an oblate spheroid with a sphere, not with a cube — whereas a purely learned translation should give unstructured errors that only gradually get sorted out over many trials.

  Constraints: don't reach for the actual empirical literature on people who gain sight later in life, and please no citations at all — I want the argument on conceptual grounds. Also don't hedge the whole thing into mush; commit to the claim. A few paragraphs is fine, definately under 1000 words.
