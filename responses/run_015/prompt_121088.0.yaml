answer: |-
  The strong interpretation of Molyneux's "no"—that shape is merely modality-specific qualia linked by arbitrary association—is a philosophical overreach. The failure of the newly sighted to immediately identify shapes by vision does not prove the absence of a shared geometric concept; it proves only the fragility of cross-modal access under novel sensory conditions. The "no" answer is evidentially inert regarding the metaphysics of shape because it conflates performance failure with conceptual absence. We can dismantle the modality-specificity view using two conceptual moves: the reverse test and the structure of error.

  First, consider the Reverse-Molyneux test. Take a subject blind from birth who suddenly gains sight. Show them a novel, complex shape they have never touched—say, a twisted torus. Let them inspect it visually. Then blindfold them and ask them to identify it by touch from a lineup. The modality-specificist is committed to predicting failure here just as strongly as in the original case. If "visual shape" and "tactile shape" are distinct entities requiring learned association, then visual input cannot directly inform haptic search any more than haptic input can inform visual identification. There should be no bridge in either direction.

  But conceptually, the subject should pass the reverse test. Vision delivers spatial extension holistically; it presents the object's geometry all at once. Touch is sequential; it constructs geometry over time. Translating a holistic spatial map into a sequential search strategy is computationally trivial compared to the reverse. If I see a protrusion, I know conceptually that my hand will encounter resistance at a point. I do not need to learn that "visual spike" equals "tactile point" as an arbitrary pairing like "red means stop." I understand extension itself. The asymmetry isn't cheating; it's diagnostic. If the reverse test succeeds while the original fails, it demonstrates that the geometric information is present in the visual experience and accessible to the haptic system, but the haptic system cannot instantly project its sequential data into a holistic visual guess without calibration. The failure is in the projection, not the concept.

  Second, we must distinguish between a learned translation code and a genuinely modality-neutral representation. Your pet idea is the correct diagnostic tool here: if the connection were arbitrary, learning would be slow and errors unstructured. If the connection relies on a shared geometric notion, transfer should be rapid and errors metrically structured.

  Imagine the subject fails the first Molyneux trial (the "no" answer) but succeeds on the second. How did they succeed? If the modality-specificist is right, the subject has formed a new association rule: "Visual Pattern A links to Tactile Memory B." This is like learning a vocabulary word. Early errors in vocabulary learning are random; you might confuse "cube" with "globe" as easily as "cube" with "pyramid" because the link is purely symbolic. However, if there is a shared shape notion, the errors must respect geometric similarity. The subject should confuse the cube with a rectangular prism long before confusing it with a sphere. They should confuse an oblate spheroid with a sphere, not a cube.

  This structured error profile proves that the underlying representation is geometric, not symbolic. The initial "no" is simply noise—sensory overload, attentional fragmentation, or the sheer shock of visual data drowning out tactile recall. But the trajectory of correction reveals the ontology. If the subject jumps from failure to success in one shot, or if their mistakes cluster around geometric neighbors, it confirms that the concept of "cube" was already there, waiting to be recognized. The modality-specificist cannot explain structured errors without admitting that the structures themselves are shared. Arbitrary links do not respect metric distance; only shared concepts do.

  Therefore, the standard "no" answer tells us nothing about the unity of shape. It merely tells us that vision is overwhelming. The reverse test shows that vision can drive touch without prior association, and the structure of errors shows that the learning curve respects geometry, not arbitrary pairing. The strong interpretation collapses because it mistakes the difficulty of access for the absence of the thing accessed. Shape is not for-the-eye or for-the-hand; it is for the mind, and the senses are just noisy channels trying to report it.
