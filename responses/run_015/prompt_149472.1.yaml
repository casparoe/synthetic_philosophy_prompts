      *   *Analysis:* The "pluralistic ignorance" reading (everyone hates it but thinks everyone else loves it) is largely imposed by modern readers wanting a moral lesson about conformity. The text itself suggests habit, unthinking adherence, and a low-level anxiety that is suppressed rather than a secret universal desire to stop. The coordination problem isn't "we all want to stop but can't coordinate," it's "no one has conceptualized stopping as an option."
      *   *Coordination Theory:* For a convention to break via coordination failure, there must be common knowledge of the desire to break. In "The Lottery," there isn't even mutual belief of reluctance. The equilibrium holds because the cost of deviation (social ostracization, violence) is high and the benefit of deviation is undefined.
      *   *What ends it?* A public signal is needed. Not just private willingness. A focal point. Someone refusing to pick up a stone *publicly* creates a new common knowledge state (that deviation is possible/safe).
