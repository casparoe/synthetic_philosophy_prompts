answer: |-
  Here is the tier list and the meta-analysis you asked for, tailored to a seven-person committee of tired academics who need to count ballots by hand at 6pm.

  ### The Tier List

  | Tier | Method | Score | Justification |
  | :--- | :--- | :--- | :--- |
  | **S** | **Approval Voting** | **92** | It handles both binary housekeeping and competitive selection with zero strategic complexity, is trivial to hand-count, and resists the "vote-splitting" that currently plagues your plurality system. |
  | **A** | **Score Voting (0–5)** | **88** | It captures intensity better than approval for paper selection, but introduces calibration noise (is your 3 my 3?) and slightly higher cognitive load for exhausted voters. |
  | **A** | **Condorcet (Schulze)** | **82** | Theoretically robust against cycles and compromise-hating, but the pairwise matrix is a nightmare to calculate by hand at the end of a long day without software. |
  | **B** | **Consent Rule** | **70** | Perfect for low-stakes housekeeping where status quo bias is desired, but structurally broken for submissions where you must actively reject good papers to meet capacity limits. |
  | **C** | **Random Dictatorship** | **65** | Mathematically strategy-proof and perfectly fair ex-ante, but lacks the epistemic legitimacy required for academic merit decisions and feels unsatisfying ex-post. |
  | **D** | **Borda Count** | **55** | Encourages "burying" strategies where voters rank strong competitors last, and requires voters to have nuanced preferences over every single option even when they don't care. |
  | **D** | **Instant-Runoff (IRV)** | **45** | Prone to non-monotonicity paradoxes, difficult to explain to members who lose, and tedious to simulate rounds by hand with seven voters and many papers. |
  | **F** | **Plurality** | **15** | You already know this one: it forces artificial two-party dynamics, ignores preference intensity, and guarantees the chair's tie-break becomes the de facto decision rule. |

  ***

  ### The Meta-Level: Does Impossibility Eat Itself?

  You are right to be suspicious. Formally, Arrow's theorem applies to the choice of a voting rule just as it does to the choice of a paper. If your seven members have unrestricted, conflicting preferences over the eight rules above, there is no guarantee of a transitive social ordering, and any rule you pick to decide the rule is manipulable.

  However, choosing a rule is **relevantly different** from choosing an outcome for three reasons that mitigate the impossibility in practice:

  1.  **The Veil of Ignorance:** When voting on papers, your preferences are specific and intense (e.g., "My subfield needs representation"). When voting on *rules*, you are behind a partial veil of ignorance; you do not know which papers will arrive or which motions will be tabled in year two. This aligns preferences toward **procedural fairness** rather than **partisan advantage**, collapsing the "unrestricted domain" of Arrow's theorem into a much narrower domain where consensus is possible.
  2.  **Transaction Costs vs. Outcome Utility:** In outcome voting, we maximize utility. In rule selection, we are minimizing future transaction costs (arguing about procedure). The group likely shares a meta-preference for "stability" and "ease of use," which acts as a focal point that breaks cycles.
  3.  **Acceptance of Randomness:** As your mechanism design friend noted, interpersonal utility comparisons are impossible. However, at the constitutional stage, members are often more willing to accept stochastic elements (like random tie-breaks) or approximate fairness because the risk is distributed over time, whereas a rejected paper is a permanent loss.

  **Verdict:** The impossibility does not vanish, but the **intensity of conflict** is significantly lower at the constitutional stage. You are aggregating preferences over *processes*, which are instrumental goods, rather than *outcomes*, which are terminal goods. This makes a stable collective choice much more likely than Arrow's worst-case scenarios suggest.

  ***

  ### Stability and Fixed Points

  You asked: *If we re-vote on the rule every two years under the rule itself, which of your top-tier rules has a stable fixed point?*

  **Approval Voting** is the most likely stable fixed point.
  Because Approval allows you to vote for *all* acceptable options, a member can vote for both "Keep Approval" and "Switch to Score" if they like both. This reduces the incentive to strategically bury the current rule. Unless a majority actively dislikes Approval, "Keep Approval" will accumulate the highest approval count because it is the status quo focal point.

  **Score Voting** is also stable, but slightly less so.
  If the group drifts toward strategic exaggeration (everyone voting 0 or 5), Score effectively becomes Approval. If they vote sincerely, they might decide the nuance isn't worth the calibration effort and vote to switch to Approval.

  **Plurality** (your current rule) is an **unstable fixed point**.
  As you have discovered, Plurality incentivizes coalition formation against the rule itself. Because Plurality ignores intensity, the 4 members who "mildly prefer" a change can be outvoted by 3 who "strongly prefer" the status quo, but in a meta-vote, the 4 will coordinate to dump the rule.

  **Is self-preservation a virtue?**
  In your specific context, **yes**.
  A voting rule is infrastructure. Changing it incurs high switching costs (re-learning, re-arguing, potential bugs in the new system). A rule that votes to keep itself is signaling that it satisfies the median voter's constraints.
  *   **Argument For:** Stability allows the committee to focus on *papers* rather than *procedure*. If the rule changes every two years, you spend every meeting wondering if the rules will be different next time, which alters strategic voting on current papers.
  *   **Argument Against:** Path dependence. If you accidentally pick a suboptimal rule that is slightly manipulable, it might entrench itself.
  *   **Mitigation:** Your two-year review cycle is the safety valve. It is frequent enough to catch a disaster, but infrequent enough to allow stability.

  **Recommendation:** Adopt **Approval Voting**. It is the most robust "compromise" rule (S-tier), it is simple enough to count at 6pm, and it is highly likely to vote to keep itself in two years, ending your procedural arguments so you can get back to reading submissions.
