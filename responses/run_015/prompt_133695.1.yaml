      *   0-100 Score + 1 sentence.
      *   Address Arrow/Meta/Stability.

      *(Self-Correction during drafting)*: Make sure to emphasize that Approval is best for the *mix* of decisions. Score is slightly riskier due to "grade inflation" among colleagues. Condorcet is too much math for 6pm. Consent needs a caveat about the capacity constraint.

      *(Stability Check)*: If we use Approval to vote on rules, and Approval is on the ballot... people approve all rules they like. If Approval is the current rule, do they approve "Keep Approval"? Yes, if it serves them. Is it a fixed point? Yes, if the median voter prefers it to alternatives. Approval tends to elect centrists. The rule itself is a "centrist" compromise. So yes, likely stable.

      *(Arrow Meta)*: Be careful not to say Arrow is "wrong." Say the *conditions* (unrestricted domain of intense preferences) are less met in constitutional choices.

  7.  **Final Polish:** Check the tone. Ensure it sounds like advice from a colleague who knows social choice theory. (e.g., using terms like "constitutional stage," "intensity of preference," "transaction costs").

      *Wait, one detail:* "Sociocracy-ish consent rule where a motion passes unless someone formally objects."
      *Critique:* For submissions, this means *all* papers pass unless objected to. If capacity is 50 and 100 submit, this breaks. I must penalize it for the "capacity limit" constraint mentioned in the prompt.

