          *   *Let's refine:* The tension between **Individual Well-being** (health/leisure) and **Reproductive Success** (population growth). A theory that maximizes one usually minimizes the other in this context. Diamond says well-being dropped. History says population exploded. A theory explaining *why* it happened has to bridge "why choose worse health?"
          *   *Better Conflict:* **Gradualism vs. The Health Cliff.** Archaeology shows a slow mix of foraging/farming. Biology shows a sharp health drop. Reconciling a slow choice with a sudden penalty is hard.
          *   *Best Conflict:* **Voluntary Adoption vs. The "Mistake" Thesis.** If it was a mistake (worse health), why did everyone do it voluntarily? If it was forced (population pressure), was it a mistake or a necessity? You can't easily have "free choice" and "worse outcome" without invoking false consciousness or coercion. Let's go with **Individual Rationality vs. Collective Outcome.**
      *   *Section 3: Scoring the Models.*
          *   *Population Pressure:* Good on why it spread, bad on why individuals agreed to worse health.
          *   *Social Storage:* Good on hierarchy, bad on the initial health cost (why feast if you're starving?).
          *   *Caloric Autonomy Traps:* Good on the lock-in, bad on the origin (what started the trap?).
