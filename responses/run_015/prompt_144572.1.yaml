      *   *Requirement 5: Duty Sensitivity.* (Addresses rescue vs. special duties). Must accommodate variable duties without changing the definition of "doing."

      *Refining the "Non-Negotiable":* The user explicitly asks for an account of why it carries *no independent moral weight*. This is the hardest constraint. Most traditional DAD accounts (e.g., Quinn, Foot) try to give it *some* weight. The user wants the opposite. So, the non-negotiable is **Normative Neutrality/Reductionism**.

