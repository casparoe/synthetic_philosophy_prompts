      *   *Tension:* If the baseline is moralized (e.g., "allowed" = "not violating a duty"), then DAD collapses into Duty. If DAD collapses into Duty, it can't *ground* the duty, it only *tracks* it. But the user wants operationalization (checklists of duties?) vs. genuine distinction.
      *   *Resolution:* The tension is real. It stems from asking the DAD to do two jobs: (1) Metaphysical/Causal classification (is this a doing?) and (2) Normative classification (is this permissible?). If you moralize the baseline to get the right normative answers (Job 2), you lose the metaphysical independence (Job 1).
      *   *Strategy:* I need to frame the desiderata such that they acknowledge this collapse is a feature, not a bug, *if* the goal is operational utility without independent moral weight. The "non-negotiable" must be the one that forces this clarity.

  3.  **Drafting the Desiderata:**
