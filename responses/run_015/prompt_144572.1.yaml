      4.  The Scoring Paragraph.

      *Wait, one nuance:* The user says "including an adequate account of why it carries no independent moral weight." This sounds like a desideratum for the *theory*, not necessarily a desideratum for *my list*. But my list is the desiderata for the theory. So one desideratum must be: "Explanatory Reductionism: Must explain the moral difference without positing intrinsic moral force."

