answer: |-
  Here is the specification of desiderata for an adequate account of the doing/allowing distinction (DAD), followed by an analysis of the tension you identified and a scoring of the main theoretical families.

  ### Desiderata for an Adequate Account

  1.  **Baseline Non-Circularity**
      *   **Requirement:** The account must specify the "normal course" or baseline against which an intervention is measured without presupposing the moral permissibility of that baseline.
      *   **Case/Consideration:** The *hand in pocket* or *signature withheld* pairs. If "allowing" is defined as "not violating a duty," the distinction collapses into the verdict it is supposed to help generate. The baseline must be identifiable prior to the moral judgment (e.g., via convention, expectation, or physical continuity).
      *   **Status:** **Non-Negotiable.** Without this, the distinction is tautological.

  2.  **Causal/Counterfactual Sensitivity**
      *   **Requirement:** The account must distinguish between redirecting an existing threat and creating a new causal chain, and must handle double-prevention cases where the physical behavior is identical but the causal history differs.
      *   **Case/Consideration:** *Trolley (redirect)* vs. *Transplant (create)*; *Double Prevention* (intervening on a mechanism someone else set). A purely behavioral description fails here; the account needs causal structure.
      *   **Status:** **Non-Negotiable.** This captures the metaphysical core of the distinction.

  3.  **Explanatory Reductionism**
      *   **Requirement:** The account must explain the moral asymmetry between doing and allowing as derivative of other factors (duties, consequences, rights) rather than positing intrinsic moral force in the distinction itself.
      *   **Case/Consideration:** The *clinician discontinuing support* vs. *relative declining to summon help*. Both may be "allowings," but one is permissible and the other culpable. The DAD must track this without claiming the *act type* itself determines the verdict.
      *   **Status:** **Non-Negotiable.** (Per your constraint that the distinction carries no independent moral weight).

  4.  **Operational Tractability**
      *   **Requirement:** The account must identify load-bearing facts that are accessible from a written case description, allowing a verdict to be reached without metaphysical inquiry or mind-reading.
      *   **Case/Consideration:** The *incident-review board* and *ethics committee* contexts. If the account requires knowing the agent's counterfactual intentions or the precise metaphysical boundaries of an event, it fails the "afternoon verdict" test.
      *   **Status:** **Non-Negotiable.** (Per your consulting context).

  5.  **Duty Variability Accommodation**
      *   **Requirement:** The account must allow the moral significance of an "allowing" to shift based on role-based duties without reclassifying the act as a "doing."
      *   **Case/Consideration:** *No general duty to rescue* vs. *parent/clinician duties*. A parent letting a child drown is morally distinct from a stranger doing the same, but both are "allowings."
      *   **Status:** **Preference.** (Some camps build duty into the definition of doing, but this violates Baseline Non-Circularity).

  6.  **Aggregate Sensitivity**
      *   **Requirement:** The account must be able to classify composite cases where many small permissive acts aggregate to harm.
      *   **Case/Consideration:** *Composite cases* (tiny permissive acts). If the account relies on a single salient cause, it may miss structural negligence.
      *   **Status:** **Preference.** (This is often a problem for the application of the theory, not the definition of the distinction itself).

  ***

  ### Analysis of the Tension

  The tension you are bumping into is **real**, and it is a **result about the distinction**, not a defect of your desiderata. You are asking the DAD to perform two incompatible functions: to be a metaphysically robust classifier (Baseline Non-Circularity) and to be a normatively reliable guide (Operational Tractability/Explanatory Reductionism). In "easy" cases, the natural baseline (what usually happens) aligns with the moral baseline (what should happen). In "hard" cases (the clinician, the default setting), they diverge. To make the distinction operationally usable in hard cases, you *must* moralize the baseline (e.g., "the default setting was a breach of protocol"), but doing so violates Explanatory Reductionism because the distinction now merely summarizes the duty violation rather than identifying a pre-moral fact. The single requirement that does the most work in excluding live candidates is **Operational Tractability**. It excludes sophisticated causal accounts (too complex for a board) and intention-based accounts (too epistemically opaque), forcing you toward a conventionalist baseline that admits the moral work is being done by duties, not the distinction itself.

  ***

  ### Scoring of Theoretical Families

  Counterfactual or causal-process accounts score highly on Causal Sensitivity and Baseline Non-Circularity but fail Operational Tractability, as determining the "relevant" counterfactuals in a boardroom is often impossible without arbitrary stipulation. Intention- or means-based accounts, such as those near the Doctrine of Double Effect, fail Explanatory Reductionism by assigning intrinsic weight to the mental state, and they collapse under Operational Tractability because proving intent from a log file is speculative. Constraint- or rights-based accounts built on "not making worse off" succeed best at Explanatory Reductionism and Duty Variability, effectively reducing the DAD to a heuristic for duty-violation, but they risk violating Baseline Non-Circularity by defining the distinction entirely through moralized norms. Finally, the skeptical view that the asymmetry is an illusion scores perfectly on Explanatory Reductionism and Tractability (by dissolving the problem) but fails the fundamental demand to respect the distinction rather than collapse it. Consequently, the only viable path for your context is a hybrid: a causal account with a conventionally fixed baseline that explicitly admits the moral weight lies in the duties, not the doing.
