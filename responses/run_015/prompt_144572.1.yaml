      *   *Counterfactual/Causal:* Good on cases, bad on operationalization (too many counterfactuals), struggles with moralized baselines.
      *   *Intention/Means (DDE):* Good on moral weight, bad on "no independent weight" constraint, hard to operationalize (mind-reading).
      *   *Constraint/Rights:* Good on duties, but risks collapsing DAD into Duty entirely.
      *   *Skeptical:* Best on "no independent weight," but fails the "respect the asymmetry" desideratum.
      *   *Synthesis:* Need to write this tightly as one paragraph.

