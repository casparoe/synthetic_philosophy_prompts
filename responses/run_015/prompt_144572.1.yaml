      This implies the user *accepts* the premise that it carries no independent weight. My desiderata must reflect this. This makes the "Skeptical" view the strongest contender, but the user also wants to "respect rather than collapse" distinctions like doing vs. enabling. This is the rub. A skeptical view usually collapses them. A reductionist view keeps the distinction but denies the moral force. I need to aim for **Reductionism**.

