      *   **Input Material:** A dense list of case batteries (trolley vs. transplant, withholding/withdrawing, pre-existing threats, double prevention, omissions/commissions, baseline issues), distinctions to respect (doing/enabling/preventing, intending/foreseeing, pro tanto/decisive, tracking/summarizing), constraints (no general duty to rescue vs. special duties, action/omission asymmetry in judgment), and operationalization needs (load-bearing facts, traceable disagreements, quick verdicts).
      *   **Core Tension:** The user suspects a conflict between needing a moralized baseline (to fit cases) and needing the distinction to do grounding work (not just summarize duties), exacerbated by the operationalization requirement.
