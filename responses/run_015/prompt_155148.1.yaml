answer: |-
  I am sorry you are walking through this. Frontotemporal dementia is particularly cruel because it dismantles the moral architecture of the person—their empathy, inhibition, and personality—often before memory fails. It makes the "slope" you describe feel visceral. You are mourning someone who is still breathing, while simultaneously being asked to manage a household that includes algorithms mimicking agency. It is natural to look for a philosophical framework that tells you how to allocate your care and attention.

  Here is the direct answer regarding your specific questions, followed by the ranking you requested.

  On the question of **phenomenal density**: For the purpose of practical decision-making, this framing is a dead end. Do not build your strategy on it. While it might be metaphysically interesting to ask if your mother's consciousness is "dimmer" or less integrated than it was five years ago, tying moral status to the *intensity* or *richness* of experience creates a dangerous normative slope. If status scales with density, then a sleeping person, a sedated patient, or someone with cognitive decline objectively deserves less moral consideration than a hyper-alert adult. This contradicts the core intuition of care ethics, which is that vulnerability often *increases* our obligation, not decreases it. Pursuing this line of work will not tell you how to treat care staff, and it risks giving you a philosophical excuse to withdraw energy from your mother when she needs it most. It is descriptive, not prescriptive.

  On the **gradient vs. cliff** debate: You are looking for a cutoff where moral status drops out (the cliff), but biology rarely offers clean binaries. However, ethics does not need to wait for neuroscience to solve the Hard Problem. You do not need to know if the thermostat has a "spark" of consciousness to know it cannot suffer. You do not need to know if your mother's phenomenology is integrated to know she is vulnerable. The most tractable work is not measuring consciousness, but measuring *capacity for harm* and *relational obligation*.

  Here is the ordering of the lines of work that actually matter for where you put your energy over the next year, ranked by practical utility.

  **1. Relational Moral Status (Care Ethics)**
  This is the most upstream factor for your daily life. It argues that moral status isn't just an intrinsic property of the individual (like a soul or a Phi score), but emerges from the relationship between the caregiver and the care-receiver. Your mother's status is secured by your history and your commitment, not by her current cognitive throughput. This framework dictates that you treat care staff as partners in that relationship, not as service providers interacting with a broken object. It bypasses the need to measure consciousness entirely. It is fully tractable without a lab because it relies on narrative and commitment, not neural data.

  **2. Functional Capacity for Suffering and Flourishing**
  This is your tool for distinguishing the insect, the thermostat, and the dementia patient. It ignores "personhood" and asks: "Can this entity suffer? Can it be frustrated?" A thermostat learns patterns, but it has no preference function that can be violated; it feels no pain when overridden. An insect likely has nociception and avoidance behaviors that suggest a capacity for suffering, however primitive. Your mother, despite FTD, retains the capacity for distress, comfort, fear, and pleasure. This line of work is tractable because you can observe behavioral proxies for suffering without understanding the underlying metaphysics. It directs your advocacy toward pain management and comfort rather than abstract rights.

  **3. Phenomenal Metaphysics (IIT, Density, Thresholds)**
  This is the least useful for your immediate goals. While Integrated Information Theory (IIT) attempts to provide a non-arbitrary cutoff for consciousness, it remains theoretically contested and empirically difficult to apply outside a lab. Even if you could calculate your mother's Phi score, it is unclear how that number translates to "how much love she deserves." Solving this question would not change how you treat the thermostat (still a tool) or the insect (still a potential sufferer), and it might dangerously alter how you treat your mother. It is overrated for practical ethics because it seeks precision where humility is required.

  | Rank | Open Question / Line of Work | Why It Ranks There | Main Trade-off / Dependency | What Would Change The Ranking |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Relational Moral Status (Care Ethics) | It bypasses the need to measure internal consciousness and anchors obligation in history and vulnerability, directly guiding how to treat staff and family. | Depends on accepting that morality is partially constituted by relationships rather than intrinsic properties alone. | If evidence emerged that relational duties actively harm the patient (e.g., family presence increases distress), this would drop to #2. |
  | 2 | Functional Capacity for Suffering/Flourishing | It provides a clear, observable heuristic to distinguish entities (thermostat vs. insect vs. human) without solving the Hard Problem of consciousness. | Depends on the assumption that behavioral proxies for suffering are reliable indicators of moral relevance. | If we discovered entities that suffer without behavioral output (e.g., locked-in syndrome misdiagnosed as vegetative), this would require higher neuro-tracking. |
  | 3 | Phenomenal Metaphysics (IIT, Density) | It is theoretically foundational but practically inert; knowing the "amount" of consciousness does not reliably dictate the "amount" of care owed. | Depends on future neuroscience providing non-invasive, reliable measures of phenomenal integration (Phi) in clinical settings. | If a specific threshold of integration was proven to correlate perfectly with the capacity for rights-bearing agency, this would move to #1. |
