  **Headline Credence: 8%**

  That is my probability that pleasure and pain are commensurable in the **strong utilitarian sense** you defined (single scalar, fixed exchange ratio $r$, uniform across magnitudes and beings).

  This number is low because the claim is metaphysically and empirically demanding. It requires the architecture of consciousness to be linear and universal in a way that almost no other phenomenological property is. Below is the decomposition, the sensitivity analysis, and the map of what is contested.

  ### Decomposition of Credence

  **(a) Continuous Scalar Structure vs. Lexical/Discontinuous**
  *   **Probability:** 60%
  *   **Reasoning:** While lexical intuitions (e.g., "no amount of bliss justifies torture") are powerful, they may reflect heuristic deontological constraints rather than the underlying phenomenological structure; a continuous scale is metaphysically simpler, even if our moral intuitions reject the trade-offs.

  **(b) Fixed Exchange Ratio Across Magnitudes (Linearity)**
  *   **Probability:** 10%
  *   **Reasoning:** Psychophysics and behavioral economics almost universally show diminishing marginal utility and loss aversion; pain intensity likely scales non-linearly against pleasure intensity (e.g., torture dominates bliss disproportionately).

  **(c) Interpersonal and Inter-species Comparability**
  *   **Probability:** 35%
  *   **Reasoning:** While neural correlates of valence are being mapped, the "hard problem" of consciousness leaves it genuinely unresolved whether a mouse's pain unit is ontologically identical to a human's.

  **(d) Stability Under Aggregation (Total vs. Average)**
  *   **Probability:** 50%
  *   **Reasoning:** This is less about commensurability and more about population ethics; however, if the metric changes based on population size (e.g., critical-level utilitarianism), the "fixed unit" claim is undermined.

  ### Sensitivity Analysis

  **The Leverage Point:** Sub-question **(b) Fixed Exchange Ratio Across Magnitudes**.

  If you could convince me that the trade-off between pain and pleasure is linear (i.e., that the marginal disvalue of pain does not increase relative to the marginal value of pleasure as intensity rises), my headline credence would jump from **8% to roughly 50%**.

  **Why:** The strong utilitarian calculus collapses without linearity. If the ratio $r$ changes based on intensity (e.g., $r$ is 1:1 for mild sensations but 100:1 for extreme suffering), you no longer have a single scalar unit; you have a complex function. This immediately validates the core intuition behind lexical threshold views without requiring a hard metaphysical discontinuity.

  **Evidence Required:** To move me on (b), I would need empirical evidence from neuroethics showing that neural firing rates or opioid/dopaminergic responses scale linearly across the entire spectrum from "mild annoyance" to "agony" and that subjects reveal consistent time-preference trade-offs at both extremes. Currently, evidence points the opposite way (pain systems have priority saturation).

  ### Settled vs. Contested

  You asked to distinguish what is settled from what is live debate. The honest answer is that **almost nothing here is settled.**

  1.  **Ontological Commensurability:** **Contested.** There is no consensus on whether "utility" is a real natural kind (like mass) or a theoretical construct (like GDP). Realists argue valence is a unified phenomenological property; anti-realists argue it is a social or linguistic convenience.
  2.  **Linearity (The Ratio $r$):** **Contested (but leaning against).** Classical Benthamite utilitarianism assumed linearity. Modern welfare economics and psychology largely reject it in favor of concave/convex value functions. However, no one has a definitive "conversion formula."
  3.  **Interpersonal Comparison:** **Contested.** This is the "measurement problem." We can compare behaviors and neural scans, but we cannot directly access qualia. Whether this is a temporary technological limit or a permanent philosophical barrier is an open debate.
  4.  **Lexical Threshold Shape:** **Contested.** Among those who accept a threshold (that enough suffering makes a world bad regardless of pleasure), there is no agreement on the shape:
      *   **Hard Flip:** A specific intensity/duration where value drops to $-\infty$.
      *   **Asymptotic:** Value approaches $-\infty$ as suffering increases, never quite flipping but becoming dominant.
      *   **Soft Lexical:** A very high ratio $r$ that looks lexical for practical purposes but is technically continuous.

  **Summary:** The strong claim you are testing (fixed ratio, universal scalar) is a legacy assumption of 19th-century utilitarianism that does not survive contact with modern phenomenology or neuroscience. The 8% credence reflects the possibility that a simplified model might still be useful for approximation, not that it is ontologically true.
