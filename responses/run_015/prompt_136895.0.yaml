      *   *User's 3 (Imitative/Reputational):* Safety in numbers. Good.
      *   *User's 4 (Artefactual Independence):* Common source bias. This is crucial for journalism. It's not strictly "herding" in the economic sense, but "common shock" or "monoculture."
      *   *Refinement:* I need to merge these into a diagnostic flow. The key distinction is *Independence of Signal*. If signals aren't independent, it's not Evidence Pooling. If signals are independent but ignored due to public action, it's Cascade. If signals are ignored due to reputation, it's Reputational. If signals *appear* independent but aren't, it's Artefactual.
      *   *Decision:* I will keep the four categories but reorder them for the *diagnostic procedure*. The procedure needs to rule out the bad ones (2, 3, 4) to confirm the good one (1).

  3.  **Drafting the Decision Procedure:**
