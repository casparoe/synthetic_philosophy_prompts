answer: |-
  ### I. Taxonomy Refinement

  Your taxonomy is sound, but for a decision procedure, it must be reordered from *descriptive* to *diagnostic*. We are not classifying what happened after the fact; we are trying to prevent Categories 2, 3, and 4 from masquerading as Category 1.

  1.  **Artefactual Independence (Your #4):** The highest risk. It looks like pooling but is actually a single point of failure (one press release, one dataset). This must be ruled out first.
  2.  **Cascade Proper (Your #2):** Private information exists but is rationally suppressed because the public signal is too strong.
  3.  **Reputational Herding (Your #3):** Private information is suppressed because the cost of deviation is too high.
  4.  **Evidence Pooling (Your #1):** The only state we want to publish in. Independent signals converging.

  ### II. The Decision Procedure (30-Minute Window)

  **Role:** Desk Editor. **Support:** One Fact-Checker (FC). **Authority:** Section Editor (SE) for Values Hand-off.

  **Test 1: The Upstream Count (Artefact Check)**
  *   **Action:** FC traces the first sentence of every available story (wires, competitors, blogs) back to its primary source (paper, preprint, press release, conference talk).
  *   **Sufficient Answer:** At least two distinct upstream sources (e.g., two different labs, two different datasets, or one paper + one independent expert analysis of raw data).
  *   **Missing Data:** If sources cannot be traced in 10 minutes, assume **One Source**.
  *   **Flat No:** If only one upstream source exists **AND** the claim is high-stakes (health, policy, counterintuitive behavior).
  *   **Pass:** Move to Test 2.

  **Test 2: The Defector & Mirror Check (Dissent Check)**
  *   **Action:** Search for credible dissent. Check: (A) Is there a published comment/critique? (B) Did *we* publish the opposite claim previously?
  *   **Sufficient Answer:** (A) No credible dissent found, OR (B) Dissent exists but is outweighed by new data quality.
  *   **Missing Data:** If a dissenting voice is identified but cannot be reached for comment in 15 minutes, note the dissent in the copy but do not kill the story solely on this.
  *   **Flat No:** If a "defector" with access to the original data (author or internal critic) declares the new finding methodologically flawed, **STOP**.
  *   **Pass:** Move to Test 3.

  **Test 3: The Silence Gap (Consensus Check)**
  *   **Action:** Compare the claim's magnitude against the volume of coverage.
  *   **Sufficient Answer:** Coverage volume matches claim magnitude (e.g., big claim = big coverage).
  *   **Trigger for Hand-off:** If the claim is high-magnitude but coverage is low (the "Geophysics" scenario), OR if the claim contradicts our own archive (the "Replication" scenario).
  *   **Flat No:** None. This test determines *how* to write, not *whether* to write.
  *   **Pass:** Move to Values Hand-off.

  **Values Hand-off (The Editor's Call)**
  *   **Condition:** Story passes Tests 1–3.
  *   **Question:** Does the news value (public interest, correction of record) outweigh the risk of amplifying a false claim or the reputational cost of deviating from the pack?
  *   **Decision:** Section Editor signs off.
  *   **Constraint:** If Test 1 failed (One Source), SE approval is required to publish *at all*.

  ### III. The Single Test

  If you can keep only one, keep **Test 1: The Upstream Count**.

  **Defense:** All other forms of herding (Cascade, Reputational) require at least the *possibility* of independent signals to be theoretically distinguishable from truth. Artefactual Independence (common source bias) removes the possibility of independence entirely. If thirty outlets report a finding based on one press release, you do not have thirty confirmations; you have one. No amount of subsequent analysis can recover independence once the signal is monocultural. This is the necessary condition for Evidence Pooling.

  ### IV. Critique of Your Informal Rules

  1.  **Count distinct upstream sources:** **KEEP.** This is the operationalization of Test 1. It is your strongest heuristic.
  2.  **The Defector Rule:** **KEEP.** A single informed dissenter breaks the rationality of a cascade. In cascade theory, private signals are ignored only when the public history is strong; a credible defector resets the public history.
  3.  **Silence is ambiguous:** **DISCARD.** In a herding environment, silence is **negative evidence**. If a claim is true and important, the cost of being the first to report it usually outweighs the risk of being wrong. If everyone is silent, assume they know something you do not (e.g., a known flaw in the method) until proven otherwise. Treat silence as a warning flag, not a neutral void.
  4.  **Scrutinize own earlier coverage:** **KEEP, BUT STRENGTHEN.** Do not just scrutinize; treat it as a **Mirror Trigger**. If a new claim contradicts your archive, it automatically triggers the Values Hand-off. You have a fiduciary duty to correct your own record that outweighs the duty to follow competitors.

  ### V. Technical Note on Herding

  *Technical Result:* In an informational cascade, once the public action history becomes sufficiently strong, it becomes rational for individuals to ignore their private information, rendering their subsequent actions uninformative to observers.
  *Status:* Contested (assumes actors are perfectly rational and risk-neutral; in reality, reputation and emotion intervene).

  ### VI. Running the Procedure on Hypotheticals

  **Case 1: Psychology Preprint (30 outlets, 1 press release, 200 participants)**
  *   **Test 1 (Upstream):** **FAIL.** 30 outlets trace to 1 press release. This is Artefactual Independence.
  *   **Action:** **Flat No.**
  *   **Exception:** Only proceed if a Defector (Test 2) validates it despite the single source, which is unlikely.
  *   **Verdict:** **Kill.** The convergence is an illusion. The risk of publishing a press-release-driven fad is higher than the cost of missing a story thirty others are running.

  **Case 2: Geophysics (3 groups, different data, 2 specialist outlets, mainstream silent)**
  *   **Test 1 (Upstream):** **PASS.** Three groups, different methods. This is genuine Evidence Pooling.
  *   **Test 2 (Defector):** **PASS.** No dissent mentioned.
  *   **Test 3 (Silence):** **TRIGGER.** High magnitude (ocean heat) but low mainstream coverage.
  *   **Values Hand-off:** The silence is likely due to complexity, not falsehood. The independent convergence makes it robust.
  *   **Verdict:** **Run.** Frame explicitly as "New consensus emerging among specialists despite low public profile." This differentiates you from the herd that ignored it.

  **Case 3: Replication Failure (Contradicts our prominent story, 1 newsletter, competitors silent)**
  *   **Test 1 (Upstream):** **PASS.** New dataset, new lab. Independent signal.
  *   **Test 2 (Mirror):** **TRIGGER.** Contradicts our own archive.
  *   **Test 3 (Silence):** **TRIGGER.** Competitors silent (likely Reputational Herding; they don't want to admit the first story was shaky either).
  *   **Values Hand-off:** The cost of amplifying a false claim is balanced by the cost of maintaining a known error in the record.
  *   **Verdict:** **Run.** This is the uncomfortable verdict. You must publish the failure to replicate. If you do not, you are participating in Reputational Herding (Category 3). Your column must explicitly state: "We reported X eight months ago; new evidence suggests X is false." This protects long-term credibility over short-term consistency.

  ### VII. Limitations of This Procedure

  State this plainly to your Section Editor:

  1.  **It cannot verify truth.** We have no statistician. This procedure filters for *independence of signal*, not *accuracy of data*. A study can be independently sourced and still be wrong.
  2.  **It cannot measure reputational incentives.** We can guess why competitors are silent, but we cannot know if they are withholding news due to embargoes, fear of sources, or genuine skepticism.
  3.  **It relies on the "Defector" being visible.** If the dissent is happening in private emails or peer review limbo, Test 2 will miss it.
  4.  **It shifts risk, it does not remove it.** Following this procedure means you will sometimes kill stories the crowd gets right (Case 1 risk) and sometimes run stories the crowd ignores that turn out to be wrong (Case 3 risk). It optimizes for institutional integrity, not scoop volume.
