  The hotel bar was empty save for the bartender wiping glasses that were already clean. Elias swirled the last of his wine, watching the legs run down the glass. Clara leaned forward, elbows on the sticky wood, her eyes sharp despite the hour.

  "Let's strip the magic away," Elias said. "Imagine the Reporter's Box. Implanted at birth. It monitors the neural correlate of your pain—call it state N—and on that basis alone, causes you to form the belief that you are in pain and to say so. The causal chain passes entirely through N. The experience itself, the hurtness, is off the path. It's a glow, not a gear."

  Clara didn't blink. "So when I say 'I am in pain,' the saying is caused by the brain state, and the feeling is caused by the brain state, but the feeling doesn't cause the saying. That's the box."

  "Exactly. Joint effects of a common cause. Like a barometer falling and a storm breaking. The barometer doesn't cause the storm, but it tracks it."

  "But a barometer doesn't *know* it's tracking a storm," Clara said. "If my saying 'I am in pain' is not caused by my being in pain, then my apparent knowledge looks lucky. Or empty. If the experience is causally inert, why is my report true rather than merely coincidental?"

  "Because the common cause guarantees the match," Elias said. "N produces the pain and N produces the report. The correlation is perfect. Why do you need the pain to push the report?"

  "Specificity," Clara said, tapping the table. "I don't just report that something is going on. I discriminate this exact throbbing from a slightly duller ache. I pick out the right word. The neural state might be coarse, but the phenomenal character is fine-grained. If the quale has no causal purchase on the selection of that content, how do I get it right reliably? Why don't I call this burning sensation 'tingling'?"

  "Because the neural state determines the word selection, and the neural state also determines the burning. They are locked together by law."

  "Are they?" Clara leaned in. "Imagine a neurosurgeon silently permutes the mapping between quale-type and report-type. She rewires the output so that the neural state for burning causes the utterance 'tingling,' while the neural state for tingling causes 'burning.' The neural causes remain the same. By your own commitments, nothing observable can change. The subject still feels burning. The subject still says 'tingling.' But wait—if the physical state determines the belief too, the subject believes she is tingling. So she is wrong about her own experience. But if the surgeon swaps the belief-mapping too, she believes she is burning but says 'tingling.' Either way, the link between the experience and the knowledge of it is severed. The experience is still just a glow."

  Elias paused. He took a sip of wine. "You're assuming that knowledge requires a causal chain from the fact known to the belief held."

  "I'm assuming knowledge isn't accidental," Clara said. "If the experience doesn't constrain the report, your truth is accidental."

  "Or perhaps," Elias said, "you've built causation into your account of knowledge and begged the question. If I say 'I know I am in pain,' I am not inferring it from a neural state. The experience is partly constitutive of the judgment. The judgment isn't a separate event caused by the pain; it is the pain taking a cognitive stance toward itself."

  "But the Reporter's Box shows they *can* be separate," Clara countered. "In the box, the experience is distinct from the mechanism producing the report. If they can come apart, then the experience isn't constitutive. It's ornamental."

  "Unless the Box is impossible," Elias said. "But let's grant it. Even then, why think the only warrant is causal? If the experience and the judgment are nomologically linked by the common cause, I have warrant. It's not causal warrant, but it's warrant."

  "Non-causal warrant?" Clara frowned. "That sounds like a miracle. You want the experience to justify the belief without touching it."

  "I want you to admit that 'touching' is doing too much work," Elias said. "We are arguing about consciousness, but I suspect we are no longer disagreeing about qualia. We are disagreeing about what the word 'cause' is doing. You require a transfer of energy or information from experience to speech. I say the correlation is sufficient for knowledge. If you define knowledge as requiring causal contact, you've defined epiphenomenalism out of existence by fiat."

  Clara sat back. She looked at the bartender, who was now pretending not to listen. "If I concede that knowledge doesn't require causal contact," she said slowly, "then I lose the ability to distinguish knowing from merely being right. If the surgeon scrambles the wiring, and I still say 'I know I'm in pain,' but my report is scrambled relative to the quale, am I still knowing? On your view, yes, provided the neural state matches. But the match is broken in the scramble."

  "In the scramble, the neural state no longer matches the quale in the usual way," Elias said. "But if the physical world is closed, the scramble is just a different physical law. The subject still has access to the experience."

  "Access?" Clara pressed. "If the experience is inert, access is a metaphor. There is no channel."

  "Then perhaps 'access' is the wrong word," Elias conceded. "Perhaps 'presence' is better. The pain is present to the subject. That presence is the knowledge. It doesn't need to push anything."

  "But then you lose the explanatory power," Clara said. "You can't explain why I speak about *this* pain rather than *that* one, except by saying 'the brain did it.' The pain drops out of the story of why I speak."

  "I concede that," Elias said quietly. "The pain doesn't explain the speech. The brain explains the speech. The pain explains why the speech is *about* something subjective. It provides the content, not the force."

  Clara nodded slowly. "And I concede that if I insist on a causal theory of knowledge, I am assuming physicalism is complete in a way that rules out your view before we start. If knowledge is just a reliable correlation, you might survive."

  "But the scrambling variant still haunts me," Elias admitted. "If the mapping is permuted, and I cannot tell the difference, then my introspective verdicts are not sensitive to the truth of the quale. They are only sensitive to the neural state. That does feel like luck."

  "Then we agree on this," Clara said. "Either epiphenomenalism requires a strange, non-causal epistemic warrant that survives scrambling, or it collapses into skepticism about self-knowledge. And if it collapses into skepticism, you've saved the ontology of qualia at the cost of their knowability."

  "And you," Elias said, raising his glass, "have saved the utility of consciousness at the cost of assuming it must be physical to be known."

  "Cheers to that," Clara said. They drank. The bar lights dimmed, leaving them in the quiet hum of the refrigerator, two maps of the same territory that refused to overlap.
