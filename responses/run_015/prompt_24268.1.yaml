  **Activity Design: The Cross-Modal Gap**

  **Roles (14 students):**
  *   **2 Perceivers:** Blindfolded volunteers.
  *   **2 Handlers:** Move objects; ensure no touching during visual phase.
  *   **10 Describers:** Observe and narrate; forbidden from naming shapes.

  **Objects:**
  Three matte-black wooden shapes: **Sphere, Cube, Cylinder.**
  *Why:* The cylinder feels curved like the sphere tactually but looks distinct visually. Matte paint removes color/shine cues.

  **Rules:**
  1.  **Blindfold:** Double-layer (sleep mask + scarf). No peeking.
  2.  **Language:** Describers cannot use geometric terms ("round," "flat," "corner"). Only texture, weight, temperature.
  3.  **Visual Test:** Perceivers cannot touch objects once blindfolds are off. They must point from a distance.

  **Timeline (50 mins):**
  *   **0–5 min:** Setup. Select volunteers. Secure blindfolds. Distribute objects to Handlers.
  *   **5–15 min:** Tactile Phase. Perceivers handle objects. Describers narrate sensory features. Perceivers memorize feel.
  *   **15–25 min:** Visual Phase. Lights up. Blindfolds removed. Handlers place objects on table 3 feet away. Perceivers identify objects by sight only.
  *   **25–50 min:** Debrief.

  **Debrief Guide:**
  1.  **The Experience:** Ask Perceivers: "Did the visual shape immediately trigger the tactile memory, or did you have to guess?"
  2.  **Empiricism (Locke):** If hesitation occurred, validate Locke. He argued ideas from sight (light/color) and touch (pressure/texture) are fundamentally different. Connecting them requires *association* built over time. There is no innate bridge.
  3.  **Rationalism (Leibniz):** If instant, discuss Rationalism. They argued geometric truths (sphere vs. cube) are innate concepts independent of specific senses.
  4.  **The Reality:** Reveal Molyneux's Question. Share that empirical data (cataract surgery patients) overwhelmingly supports Locke. Patients often cannot distinguish objects visually until they touch them again, proving the mapping is learned.

  **Predictable Failures:**
  *   **Peeking:** Students will lift masks. *Fix:* Facilitator watches eyes closely.
  *   **Cheating:** Describers slip and say "it's round." *Fix:* Strict moderator; restart if violated.
  *   **Slipping:** Objects roll. *Fix:* Use felt pads on objects.

  **Critical Limitations (You must supply these):**
  1.  **Prior Memory:** Your students are not congenitally blind. They have existing visual schemas for "sphere." Real subjects have *no* visual reference.
  2.  **Neural Calibration:** Real sight restoration isn't a switch. It takes weeks for the visual cortex to interpret light as objects. This activity compresses months into seconds.
  3.  **Depth & Light:** Newly sighted patients often see flat patches of color, not 3D objects. They cannot judge distance initially. This activity assumes normal depth perception.
