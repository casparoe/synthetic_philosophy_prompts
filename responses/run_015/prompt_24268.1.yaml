prompt: |-
  So I'm in a history of psychology seminar this term, mixed with a bunch of psych majors, and we just finished a unit on empiricism and the senses. I keep thinking about Molyneux's question -- whether someone born blind who learned to tell a sphere from a cube by touch would recognize them by sight the moment they gained vision, or whether they'd need to learn the mapping between the two. The problem is that in class everyone just answers yes or no in the abstract and nobody actually feels why it's hard. I want to run an activity in our next 50-minute session, about 14 people, where people actually go through the experience before anyone names the problem. The thing I'm imagining is that a few volunteers get blindfolded and learn to identify objects by touch while the rest of the class describes the objects to them using only words, no names allowed, and then at some point the blindfold comes off and the volunteers have to match objects to their touch memories using sight alone, and I want the moment where the mapping either feels obvious or feels impossible to land before the debrief. Can you design the whole thing for me: the exact rules and role assignments, a list of objects that will actually work (I want at least one pair that's genuinely confusing so the failure is real and not just a formality), a minute-by-minute timeline for the 50 minutes, and a debrief that maps each phase back to the question and to why the empiricists and the rationalists answered the way they did. Also tell me what will predictably go wrong the first time I run it -- I have a feeling people will cheat on the descriptions or the blindfolds will slip or whatever -- and be honest about what the activity cannot reproduce about the real problem that I'd have to supply in the debrief instead. Keep the whole thing under 700 words.
