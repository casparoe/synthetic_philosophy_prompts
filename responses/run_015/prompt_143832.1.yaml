  **Important Clarification:** Before proceeding, I should note that your understanding of *Le Ton Beau de Marot* is actually a common misconception. Douglas Hofstadter's book by that title argues *against* sacrificing meaning for strict form, advocating instead for capturing the "spirit" of the work. However, since your request is for a satire based on your description (strict formalism), I have written the FAQ below reflecting that specific bureaucratic exaggeration.

  ***

  **OFFICE OF FORMAL PRESERVATION (OFP)**
  **Frequently Asked Questions: Class-4 Poetry Translation Licenses**

  **Q: What is the "Rhyme Bond" and why is it refundable?**
  A: All translators seeking Tier-3 Sonnet Certification must post a Rhyme Bond equivalent to the market value of twelve perfect couplets. This bond ensures compliance with Meter Statute 404. If your translation deviates from the original syllable count by more than ±2 per line, the bond is forfeited to the National Syllabus Reserve. Note: Slant rhymes are considered counterfeit currency.

  **Q: How is the Marot Metric calculated?**
  A: The Marot Metric (MM) is the OFP's proprietary scoring system for fidelity. It rewards syllable-for-syllable alignment above all else. A perfect MM score of 100 requires identical stress patterns and vowel sounds. Points are deducted for "interpretive flourish." For example, translating the French *amour* as "love" incurs a minor penalty; translating it as "affection" to fit a meter results in immediate license suspension. High MM scores grant access to restricted limerick archives.

  **Q: What constitutes "Semantic Drift"?**
  A: Semantic Drift is any unauthorized deviation from the original text's literal definition in favor of poetic flow. This is treated similarly to a parking violation. First offense: Written warning. Second offense: Fine of 50 iambic feet. Third offense: Revocation of translation privileges and mandatory attendance at a Literalism Rehabilitation Workshop. Translators are reminded that nuance is not a valid defense for meter infringement.

  **Q: Can I appeal a "Tone Violation"?**
  A: Appeals are accepted only if submitted in the original language of the poem, formatted in the original stanza structure. Please note that appealing in English haiku will result in an automatic denial. The Office prioritizes structural integrity over communicative clarity. If the meaning is lost but the rhyme scheme remains intact, the translation is considered successful.

  **Q: Do you offer waivers for untranslatable concepts?**
  A: No. The OFP operates under the principle that all concepts can be forced into the target meter with sufficient coercion. Translators are encouraged to use archaic vocabulary or obscure synonyms to maintain syllable counts. If a word does not exist, you are expected to invent one that scans correctly.

  **Q: Where do I submit my portfolio?**
  A: Portfolios must be submitted via carrier pigeon to ensure no digital compression alters the line breaks. Include Form 88-B (Declaration of Vowel Integrity) stapled to the back of each page. Do not fold, spindle, or mutilate the stanzas.

  ***

  **Note on Liberties and Interpretation:**
  As mentioned in the clarification, I took significant liberties with the actual philosophy of *Le Ton Beau de Marot*. Hofstadter's work explores the impossibility of perfect translation and often favors capturing the "soul" of a piece over rigid formal constraints. The "Office of Formal Preservation" satirizes the extreme formalist approach you described (form over meaning), which is actually what Hofstadter critiques. The "Marot Metric" and "Rhyme Bond" are invented bureaucratic absurdities to highlight the rigidity of that misunderstanding.
