answer: |-
  "The janitor's going to lock us in," Marcus said, gesturing at the empty chairs surrounding them.

  "Let him," Elena replied, not looking up from her notes. "You still haven't answered the relational objection. You can't just ignore impure properties."

  "Because it's circular," Marcus said, rubbing his temples. "You argue Sphere A is distinct because it stands in a relation to Sphere B. But to identify 'Sphere B' as the relatum, you already presuppose they are distinct. In Black's universe, the relational properties are perfectly symmetric. Both share the property *being two meters from the other sphere*. There's no asymmetry to grab onto."

  "So you restrict the Principle to intrinsic properties?"

  "No. I'm saying the relational properties are identical for both. If you allow 'being identical to A' as a qualitative property, the Principle becomes trivial. It reduces to 'A is A.' Black's point is that you can have numerical diversity without qualitative difference."

  Elena capped her pen. "But that assumes 'qualitative' excludes haecceities. If I say the spheres differ because one is *this* one and the other is *that* one, you call it mysticism. But if I say they differ because of their relations, you say the relations are symmetric. You've rigged the game so nothing counts as a difference."

  "Maybe," Marcus conceded. "But if I accept your primitive 'thisness,' I violate empiricism. I'm positing a fact about the world that makes no difference to its description. If every property is shared, what work is 'two' doing?"

  "That's the question, isn't it?" Elena leaned forward. "Is the disagreement substantive, or just verbal? If you admit there are two spheres, but deny there's any qualitative fact grounding that count, aren't we just fighting over whether 'property' includes numerical distinctness itself?"

  Marcus paused, considering the ceiling. "I think it's substantive. I think you're demanding a qualitative ground for number where there isn't one. You want diversity to supervene on quality. I think number can be brute."

  "And I think brute number is occult," Elena said. "If there's no qualitative difference, there's no fact of the matter about whether there's one sphere or two. You're asking us to believe in a distinction without a difference."

  "So you think my universe is unintelligible."

  "I think your *ontology* is," she corrected. "You want the count without the criteria for counting."

  Marcus smiled tiredly. "And you think criteria are necessary even if reality doesn't provide them."

  "We agree on the deadlock, then," Elena said, gathering her papers. "It's not about the spheres. It's about whether reality requires a hook for numbers."

  "Finally," Marcus sighed. "Now can we leave before we get locked in?"
