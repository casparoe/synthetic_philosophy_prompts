prompt: |-
  I just spent like an hour arguing with my roommate about whether Henry Sidgwick's obsession with the Society for Psychical Research actually fits with his ethics, and I'm not sure either of us is right so I want a second opinion. Background for you: Sidgwick is the utilitarian guy from The Methods of Ethics, the one who ends the book stuck in this famous impasse between rational egoism and utilitarianism and basically concedes he can't resolve it. But he was also a co-founder and first president of the SPR and spent decades into telepathy and survival after death, and I think he was pretty convinced telepathy was real even though he stayed cautious about mediums as proof of survival. Here's where I'm confused: he's a hedonist, so the whole point is pleasure and pain, but an interest in survival after death seems to care about something way beyond hedons — like the continued existence of the person, or the soul, or whatever. So was his psychical research a rational extension of his own utilitarianism (more time to generate net happiness, or something), or did he quietly smuggle in a non-hedonic value, like survival or immortality being intrinsically good, which would be a real crack in his system? My roommate thinks it's totally consistent and I think it's an embarassing ad hoc move.

  Write an essay weighing both sides and actually commit to one — don't end on "both are interesting." I want to know which reading you think holds up better to the actual text and why, and whether this tension even matters for how we should evaluate his utilitarianism today.
