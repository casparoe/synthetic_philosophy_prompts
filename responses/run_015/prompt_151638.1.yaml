      **Title:** Ranking Cultural Evolution Models by Replicative Friction
      **Project Lead:** [My Name]
      **Duration:** 4 Months

      **The Precise Question**
      When a cultural item spreads through formal institutional scafolding rather than casual mental copying, which of the three big evolutionary frameworks best predicts resistance to mutation? I'm calling this resistance "replicative friction." I want to rank Dawkins' replicator theory, Boyd-Richerson dual inheritance, and Sperber's epidemiological model based on their utility here.

      **The Gap**
      Most meme theory assumes culture flows like water—fluid, casual, brain-to-brain. But when you push culture through institutions (laws, corporate policies, standardized curricula), the flow gets blocked or channeled. The existing literature doesnt settle how this structural rigidity changes evolutionary dynamics. Dawkins focuses on copy fidelity, Boyd-Richerson on learning biases, and Sperber on cognitive attraction, but none explicitly model the "brakes" applied by bureaucratic structures. We know institutions stabilize culture, but we dont know which theoretical lens explains *why* some stabilize better than others.

      **Method**
      I'll run two comparative case studies tracing specific cultural items through institutional channels.
      1.  **ISO Safety Standards:** How a specific safety protocol mutates (or doesnt) across different multinational factories.
      2.  **University Branding Guidelines:** How a visual identity meme spreads across decentralized departments.
      I will map the transmission chain of each item and score how well each of the three frameworks predicts the observed mutation rate. The framework that most accurately accounts for the friction caused by the institution wins.

      **Deliverable**
      Academic papers are great, but I want this useful. The output will be a "Friction Scorecard"—a one-page diagnostic tool for policymakers and brand managers. It'll help them decide which evolutionary logic to lean on when designing interventions. If you want high fidelity, use the framework that ranks highest for friction. If you want adaptation, use the one that ranks lowest.

      **Definition of Failure**
      The project fails if all three frameworks perform equally well or equally poorly. If there's no daylight between Dawkins, Boyd-Richerson, and Sperber regarding institutional friction, then the ranking is meaningless and the concept of "replicative friction" might just be noise. Also, if I cant access the internal documents needed to track the mutation rates, thats a hard stop.

