      *   **Month 1:** Finalize the operational definition of friction and select the specific case study instances.
      *   **Month 2:** Data collection for Case 1 (ISO Standards) and initial modeling against the three frameworks.
      *   **Month 3:** Data collection for Case 2 (University Branding) and comparative analysis.
      *   **Month 4:** Synthesis, creation of the Friction Scorecard, and final report writing.

