answer: |-
  I considered a theoretical justification and a pure flowchart; both fail. The former ignores your staff's training, the latter ignores care ethics. I commit to a "guarded heuristic": a procedure that forces relational visibility without requiring theory. Care ethics resists codification, but without guardrails, coordinators optimize for drive time. This procedure protects the relationship as a unit of care.

  **The Procedure**

  1.  **Safety & Compliance:** Does this change violate state rules or immediate safety?
      *   *Adequate Answer:* Documented compliance or clear physical safety.
      *   *Stop:* If **No**, do not proceed. Escalate to Manager.
  2.  **Continuity Count:** How many aides has this client had in 12 months?
      *   *Adequate Answer:* A number.
      *   *Threshold:* If **>3**, this is a relational crisis.
      *   *Action:* Requires Manager sign-off. You cannot solve churn with scheduling alone.
  3.  **Shadow People Scan:** Who else breaks if we move this piece? (Aide's other clients, aide's family, client's unpaid caregivers).
      *   *Adequate Answer:* Named individuals and specific impacts (e.g., "Aide's child loses pickup," "Client B loses morning med").
      *   *Values Handoff:* If impacts are equal but conflicting (e.g., Client A's stability vs. Client B's medical need), this is a values question disguised as logistics. **Escalate to Manager.** Do not let coordinators weigh moral worth.
  4.  **The Intuition Check:** Does the aide's gut feeling match the data?
      *   *Adequate Answer:* Yes/No.
      *   *Drop the Checklist:* If **No** (e.g., data says "good match," aide says "something's off"), stop the procedure. Spend an hour with the client or aide. Data cannot measure dignity or fear.

  **Applications**

  1.  **Dementia Client (Hitting):**
      *   *Check:* Safety is borderline (hitting), but Continuity is low (3rd aide).
      *   *Decision:* **Keep the third aide.** Care ethics prioritizes the specific relational repair over abstract safety metrics unless injury is severe. The calmness indicates a unique bond. Document the risk, but do not break the bond.
  2.  **Aide vs. Client's Son:**
      *   *Check:* Continuity is high (4 aides already). Shadow People includes the aide's dignity and safety.
      *   *Decision:* **Pull the aide.** The web of care includes the caregiver. If the client's son compromises the aide's safety, the care relationship is already poisoned. Four aides indicates the client's placement is the problem, not the aide's retention. Absorb the continuity hit; it's already broken.
  3.  **Competing Clients (Relationship vs. Need):**
      *   *Check:* Client A (2-year bond, stable). Client B (Higher need, 5 aides).
      *   *Decision:* **Assign to Client A.** This is the hard call. Utilitarian logic says "higher need." Care ethics says "respond to the vulnerable within the relationship." Client B's instability (5 aides) suggests systemic failure; adding another new aide continues the churn. Breaking a stable 2-year bond causes active relational harm. Prioritize stabilizing the existing web. Acknowledge Client B's need requires a different intervention (perhaps a different aide entirely), not cannibalizing Client A's stability.

  **Systematic Failures**

  This procedure will systematically get three things wrong. First, it cannot measure **relationship quality**. A two-year bond might be abusive or stagnant; the checklist sees only duration. Second, it misses **silent aide burnout**. An aide may say "yes" to hours while drowning, until they quit. The "Shadow People" scan helps, but won't catch internal exhaustion. Third, it risks **bureaucratizing care**. By turning "continuity" into a metric, you risk coordinators gaming the count rather than nurturing the bond.

  Care ethics is about responsiveness, not compliance. Use this procedure to clear the debris of efficiency logic, not to replace judgment. When the checklist conflicts with the human reality, throw away the checklist. That is not a bug; it is the only way to keep care ethical.
