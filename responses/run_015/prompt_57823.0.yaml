answer: |-
  This is an excellent philosophical problem. Your flatmate has constructed a version of what ethicists call the **"Deception Dilemma"** or the **"Scope of Fraud"** problem. It is a *reductio ad absurdum* designed to show that if we define consent too broadly regarding deception, we break the concept entirely.

  As a philosopher specializing in this area, I can tell you that this argument keeps many of us up at night. It forces us to choose between protecting absolute individual autonomy (my reasons are mine) and maintaining a workable social/legal standard for sexual violation.

  Let's follow your instruction: I will start by brainstorming the options for rejecting specific steps in the argument, weigh the pros and cons of each, and then settle on the most robust diagnosis that saves the intuition about stealthing without criminalizing the bacon lie.

  ### Phase 1: Brainstorming the Options

  We have six steps in your flatmate's chain. To stop the conclusion (6), we must break the chain somewhere. Let's look at the cost of breaking each link.

  **Option A: Reject Premise (1)**
  *   *The Move:* Claim that deception *never* automatically invalidates consent. Consent is about the "yes," not the reasons behind it.
  *   *The Cost:* This is too high. It makes stealthing, lying about STIs, or even impersonating a spouse legally permissible. It severs the link between autonomy and informed choice. Most philosophers reject this because it treats consent as a mere physical permission slip rather than an exercise of agency.

  **Option B: Reject Premise (2)**
  *   *The Move:* Argue that not all deal-breakers are equal. Some lies vitiate consent (stealthing), while others do not (bacon), even if the counterfactual ("I would have said no") is the same.
  *   *The Cost:* We need a principled way to distinguish them. If we say "bacon doesn't matter," aren't we paternalistically telling the vegan what should matter to her? We risk imposing an objective standard on subjective desire. However, this is the most common route in legal and ethical theory.

  **Option C: Reject Premise (3)**
  *   *The Move:* Argue that omission is not lying. You have no duty to disclose everything unless asked.
  *   *The Cost:* This creates a loophole for stealthy behavior. If I know I have an STI and don't mention it, is that okay because I didn't actively lie? Most ethical frameworks treat deliberate concealment of material risks as equivalent to lying. This doesn't solve the bacon problem (an active lie about bacon) anyway.

  **Option D: Reject Premise (4)**
  *   *The Move:* Argue that we *should* have to mind-read, or that the burden is on the liar to find out deal-breakers.
  *   *The Cost:* This makes sexual interaction impossible. It demands omniscience. It creates a "trap" where consent is always retroactively vulnerable to hidden preferences the liar couldn't possibly know. This leads directly to the absurdity in (5).

  **Option E: Reject Premise (6) (Bite the Bullet)**
  *   *The Move:* Accept that many ordinary hook-ups are technically non-consensual if based on lies, but argue they aren't *morally equivalent* to rape.
  *   *The Cost:* This dilutes the meaning of "non-consensual." If the bacon lie is "non-consensual sex," then the term loses its gravity regarding stealthing or coercion. It makes the moral landscape too crowded. You explicitly said you want to avoid this.

  ---

  ### Phase 2: The Diagnosis

  Having weighed these, the most philosophically defensible position—and the one that aligns with current leading scholarship on sexual ethics (e.g., the work of David Archard, Michelle Madden Dempsey, or Tom Dougherty)—is to **Reject Premise (2), but with a specific qualification.**

  We must distinguish between **Deception about the Nature of the Act/Risks** and **Deception about Collateral Attributes.**

  Here is the slow work-through of why this is the correct diagnosis and what it costs.

  #### 1. The Core Distinction: "Factum" vs. "Inducement"
  In legal philosophy, there is a historic distinction between *fraud in the factum* and *fraud in the inducement*.
  *   **Fraud in the Factum:** You lie about what is actually happening. (e.g., "This is a medical procedure" when it is sex; or "I am using a condom" when I am not). This usually vitiates consent.
  *   **Fraud in the Inducement:** You lie to persuade someone to agree to something they understand perfectly well. (e.g., "I am a millionaire" or "I love bacon" to get sex). This usually does *not* vitiate consent, though it may be morally blameworthy.

  Your flatmate's argument collapses this distinction. He argues that if the lie changes the decision, it invalidates the consent. But consent is not just about the *decision*; it is about the *object* of the agreement.

  #### 2. Applying it to Stealthing vs. Bacon
  *   **Stealthing:** When you agree to sex with a condom, you are agreeing to a specific physical act with a specific risk profile. Removing the condom changes the **physical nature of the act** and the **risk of harm** (pregnancy/STIs). The partner is not consenting to *unprotected* sex. The deception is about the act itself.
  *   **The Bacon Lie:** When you agree to sex with a bacon-eater, you are agreeing to the physical act of sex. The partner's veganism is a moral preference regarding the *partner's character*, not the *physics of the interaction*. The deception is about an attribute of the agent, not the act.

  Therefore, we modify Premise (1). It should read:
  *(1*) If someone says yes to sex only because you lied about a **material feature of the act or its inherent risks**, and they would have said no if they knew the truth, then their consent is not valid.*

  #### 3. Addressing the "Mind-Reading" Problem (Premise 4)
  By shifting to "material features of the act," we solve the epistemic problem.
  *   You cannot know every secret deal-breaker (veganism, love of jazz, political affiliation).
  *   But you *can* and *must* know the basic norms of the interaction (are we using protection? am I who I say I am? is this sex or a massage?).
  *   This places a **Reasonable Person Standard** on consent. We judge validity based on what a reasonable person would consider material to the sexual transaction, not on the idiosyncratic internal criteria of the specific individual.

  #### 4. Why This Avoids the Absurdity (Premise 5 & 6)
  If we accept the flatmate's view, every white lie makes sex non-consensual. This equates a jerk with a rapist.
  By adopting the *Material Feature* view:
  *   The bacon liar is a **liar** and perhaps a **bad partner**, and the vegan has grounds to feel betrayed and end the relationship.
  *   The stealter is a **violator**. They have bypassed the partner's authority over their own body regarding risk and physical boundary.
  *   This preserves the gravity of "non-consensual sex" for violations of bodily autonomy, rather than violations of personal preference.

  ---

  ### Phase 3: The Cost of This Diagnosis

  You asked what rejecting Premise (2) costs us. We must be honest about the trade-offs. We cannot have a perfect theory without losses.

  **1. We Sacrifice Pure Subjective Autonomy**
  The hardest cost is admitting that the vegan's autonomy is partially overridden. If she says, "My body, my rules, and my rule is no bacon-eaters," and we say, "Too bad, that doesn't count for consent," we are telling her that her reasons don't fully matter.
  *   *Philosophical Justification:* Sexual consent is a **social practice**, not just a private mental state. For consent to function as communication between two people, it must rely on shared norms. If consent depended on every private idiosyncrasy, communication would be impossible. We sacrifice total individual sovereignty for the sake of mutual intelligibility.

  **2. We Accept Some "Unfair" Seductions**
  There will be cases that fall in the grey zone. What if someone lies about being wealthy? About being in love? ("I love you" to get sex).
  *   Under this diagnosis, lying about love is usually *fraud in the inducement*. It is morally rotten, but it is not typically sexual assault.
  *   *The Cost:* This feels unsatisfying. Being tricked into sex by a false promise of love feels like a violation. But classifying it legally/ethically as "rape" creates the slippery slope your flatmate identified. We have to accept that there is a category of **"Morally Wrong but Consensual"** sex. This is a painful category, but necessary to prevent the trivialization of sexual violence.

  **3. The Boundary is Fuzzy**
  Distinguishing "act/risk" from "attribute" isn't always clean.
  *   *Example:* If someone lies about their gender identity, is that an attribute or part of the sexual act? (Courts and philosophers disagree here).
  *   *Example:* If someone lies about being a doctor to perform a "sexual therapy," is that attribute or act?
  *   *The Cost:* We lose crisp certainty. We have to engage in case-by-case reasoning about what counts as "material to the sexual act." This requires moral judgment, not just a simple algorithm.

  ### Summary for Your Debate

  To reply to your flatmate, you can say this:

  > "Your argument works if we assume consent is solely about **internal willingness**. But consent is also about **social communication**.
  >
  > I reject Premise (2). Not all deal-breakers are morally equivalent regarding consent. We must distinguish between lies that change the **nature of the act** (stealthing, STIs, identity) and lies that change the **desirability of the partner** (bacon, income, hobbies).
  >
  > Stealthing invalidates consent because it changes the physical risk and the act agreed to. The bacon lie invalidates the *relationship trust*, but not the *sexual consent*.
  >
  > The cost of this view is that we have to admit some liars are not rapists. But the cost of *your* view is that we have to admit most hook-ups are assaults. I choose the former to protect the meaning of the latter."

  This preserves the seriousness of stealthing while avoiding the paralysis of the "bacon paradox."
