      *   *The Audit Protocol:* Restarting from Step 1 upon a Step 9 failure seems inefficient. Why do it?
          *   *Possibility A:* Distrust of human memory/attention. (You might have missed Step 3 because you were worried about Step 9).
          *   *Possibility B:* Ritualistic purity. (The *process* validates the result, not just the result).
          *   *Possibility C:* Causal interdependence. (Step 9 failure implies Step 1-8 data is tainted).
      *   *Management's Claim:* "Integrity through repetition." This suggests the *act* of auditing creates the truth, not just the finding.
      *   *Philosophical Angles:*
          *   *Determinism vs. Free Will:* Is the auditor a rule-follower (Kantian duty?) or a judge (Aristotelian phronesis?)?
          *   *Epistemology:* How do we know the audit is true? Is it foundationalist (build from base up) or coherentist?
