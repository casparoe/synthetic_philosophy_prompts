  ### Part 4: Troubleshooting (What Will Go Wrong)

  **1. The "Announcer" (Student spots dominance in 30 seconds)**
  *   **Risk:** They shout "Bot is stupid!" and ruin the discovery for their table.
  *   **Fix:** Give them a job. At the start of Game 1, pull the quickest thinker aside. "You are the **Auditor**. Your job is not to play, but to verify the Observer's math. If anyone claims a strategy wins, you must check the arithmetic." This channels their speed into verification.

  **2. The "Risk-Averse" Student (Why not take the safe 1 point?)**
  *   **Risk:** In Game 1, a student picks Bot because "I guarantee 1 point. The coin flip might give me 0."
  *   **Fix:** Do not correct them during play. In the debrief, distinguish **Maximin** (security level) from **Rationalizability**. "You were playing safely, which is smart. But the question of the day is: Was your move *dominated*? Yes. Safety is not the same as undominated."

  **3. The "Algebra-Averse" Group (Disengages at Expected Utility)**
  *   **Risk:** They stare at the 0.5(10) calculation and stop writing.
  *   **Fix:** Use **Frequency** language, not Probability language. "If you play 10 rounds, how many times do you win?" Instead of $0.5 \times 10$, ask "How many HH cards are in the deck?" Keep the stakes in integers (Points), not probabilities.

  **4. Confusing Dominance with Equilibrium**
  *   **Risk:** "But if everyone plays Bot, isn't that stable?" (In Game 1, Bot vs Bot isn't defined, but they might think of Nash).
  *   **Fix:** In the debrief, draw a line. "Dominance is about *one* player's options regardless of what the other does. Equilibrium is about *mutual* best responses. Today was about Dominance."

  **5. The 3-Player Confusion**
  *   **Risk:** They think P2 and P3 are "colluding" in Condition B.
  *   **Fix:** Emphasize the **Device**. "P2 and P3 don't talk. They obey the Card. The Card is the correlation. In Condition A, the Coins don't talk to each other."

  ---

  ### Part 5: Limits of the Activity (Honesty Check)

  1.  **What this activity proves:** It demonstrates that mixed strategies can strictly dominate pure strategies (Game 1). It demonstrates that weak dominance elimination is order-dependent (Game 2). It demonstrates that correlation expands the set of best responses (Game 3).
  2.  **What this activity *cannot* prove:**
      *   It does not prove Pearce's Lemma (that *every* non-dominated strategy is a best response to *some* belief). It only shows one instance where a strategy *is* a best response to a correlated belief.
      *   It does not prove that IESDS order is invariant. You have to state that as a theorem. The activity only shows that IEWDS order *varies*.
      *   It does not capture the full depth of "Common Belief." It captures one round of elimination. You must explain in words that this process repeats until no more strategies can be removed.
  3.  **The "Dead Strategy" Mix Question:**
      *   You asked if the dominating mixture can use eliminated strategies.
      *   **Truth:** For **Strict** Dominance, allowing the mix to use eliminated strategies does **not** change the set of survivors. You can safely tell them: "For strict dominance, you can ignore strategies you've already thrown away. For weak dominance, you cannot."
      *   **Instruction:** Do not try to simulate this with cards. It requires tracking too many conditional probabilities. State it as a rule in the debrief.

  ### Final Instructor Note
  Your role in the last 15 minutes is to translate their *feelings* ("Bot felt safe but lost," "The order changed the answer," "The cards made P1 brave") into *definitions* ("Strict Dominance by Mixed Strategy," "Path Dependence," "Correlated Conjectures"). If you let them keep the intuition without the vocabulary, they will forget it by next week. If you give them the vocabulary without the intuition, they will fear the algebra. You need both.
