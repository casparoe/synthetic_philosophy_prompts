  Here is the complete activity plan, designed for your specific constraints and pedagogical goals.

  ### Part 1: Corrections & Clarifications (Read First)

  Before running the session, you need to know where your intuitions are precise and where they need slight adjustment.

  1.  **Iterated Elimination & "Dead" Strategies:**
      *   **Strict Dominance:** It **does not matter** whether the dominating mixture uses strategies that were eliminated in previous rounds. The set of survivors is identical either way. Do not try to manufacture a puzzle here; you will confuse them.
      *   **Weak Dominance:** It **does matter**. Eliminating a weakly dominated strategy can remove the very support needed to dominate another strategy later. This is where the "order matters" puzzle lives.
  2.  **The 3-Player "Gap":**
      *   Your memory is correct in spirit but needs precise phrasing. In 2-player games, "Never a Best Response" $\iff$ "Strictly Dominated (by a mix)."
      *   In 3+ player games: "Strictly Dominated" $\iff$ "Never a Best Response to a **Correlated** Belief."
      *   **The Gap:** A strategy can be *not* strictly dominated (so it survives IESDS) and yet be *never* a Best Response to any **Independent** Belief (product measure). It is only a best response if the player believes the opponents' moves are correlated.
      *   **Activity Translation:** We will model "Independent Belief" as two separate coin flips and "Correlated Belief" as drawing two cards from a single shuffled pair.

  ---

  ### Part 2: Materials List

  *   **Room:** 4 tables of 4 students (16 total).
  *   **Handouts:** 3 distinct "Game Cards" (printed half-sheets) per table.
      *   *Game 1:* 2x3 Matrix (Mixed Dominance).
      *   *Game 2:* 2x2 Matrix (Weak Dominance).
      *   *Game 3:* 3-Player Payoff Table (Correlation).
  *   **Randomizers:**
      *   4 Decks of 10 cards each (5 marked **L**, 5 marked **R**).
      *   4 Decks of 4 cards each (2 marked **HH**, 2 marked **TT**).
      *   Students' phones (used as coins).
  *   **Stakes:** 20 chocolate pieces (or 20 "Bonus Points" tokens).
  *   **Whiteboard:** Divided into 4 quadrants for scorekeeping.

  ---

  ### Part 3: The Activity Timeline (90 Minutes)

  #### 0:00 – 0:10: Setup & Grouping
  *   **Action:** Seat students at 4 tables of 4. Assign roles at each table: **Player 1, Player 2, Player 3, Observer**. (Tell them roles will rotate).
  *   **Instruction:** "You are playing for points. 10 points = 1 chocolate. No talking about strategy during play. Observer records payoffs."
  *   **Board:** Write "Round 1: The Unbeatable Loser."

  #### 0:10 – 0:35: Game 1 (Strict Dominance by Mixture)
  *   **Concept:** A pure strategy that no single pure strategy beats, but a coin flip does.
  *   **Matrix (Row Player):**
      *   Opponent (Col) has strategies **L** and **R**. (Represented by the 10-card deck: 5 L, 5 R).
      *   Row Player chooses **Top**, **Mid**, or **Bot**.
      *   **Payoffs (Row Points):**
          *   **Top:** 4 if L, 0 if R.
          *   **Mid:** 0 if L, 4 if R.
          *   **Bot:** 1 if L, 1 if R.
  *   **Procedure:**
      1.  **Phase A (Pure):** Players 1 & 2 choose a single strategy (Top, Mid, or Bot) to stick with for 5 rounds. Player 3 draws from the L/R deck (shuffled) to determine Opponent's move each round. Observer records points.
      2.  **Phase B (Mixed):** Players 1 & 2 must now use a "Randomizer Strategy." They flip a coin before *each* round. Heads = Top, Tails = Mid. They play this for 5 rounds against the same deck.
      3.  **Scoring:** Observer sums the points.
  *   **Expected Outcome:**
      *   Phase A: Players picking **Bot** get 5 points total (1 per round). Players picking Top/Mid get ~10 points total (avg 2 per round).
      *   Phase B: Players flipping coins get ~10 points total.
      *   **Crucial Moment:** Ask the table: "Did anyone pick Bot? Did anyone beat the Bot player using *only* Top or *only* Mid?" (No). "Did the Coin Flip beat Bot?" (Yes).
  *   **Whiteboard:** Ask one student from a table to come up and write the payoff for Bot (1,1) and the *average* payoff for the Coin Flip (2,2).

  #### 0:35 – 0:55: Game 2 (Weak Dominance & Order)
  *   **Concept:** Elimination order changes the survivors.
  *   **Matrix (Row & Col):**
      *   **Row:** **T**, **B**. **Col:** **L**, **R**.
      *   **Payoffs (Row, Col):**
          *   (T, L): 1, 1
          *   (T, R): 0, 0
          *   (B, L): 1, 0
          *   (B, R): 0, 0
  *   **Procedure:**
      1.  Split the 4 tables into two groups: **Team Alpha** (Tables 1 & 2) and **Team Beta** (Tables 3 & 4).
      2.  **Team Alpha Rule:** "Eliminate any Row strategy that is weakly dominated. Then, eliminate any Col strategy that is weakly dominated. What is left?"
      3.  **Team Beta Rule:** "Eliminate any Col strategy that is weakly dominated. Then, eliminate any Row strategy that is weakly dominated. What is left?"
      4.  **Time:** 5 minutes to discuss and decide.
      5.  **Reveal:** Ask Alpha for their survivor(s). Ask Beta for their survivor(s).
  *   **Expected Outcome:**
      *   **Alpha (Row first):** Row eliminates **B** (T is 1vs1, 0vs0; weakly dominates). Remaining: Row=T. Col faces T. L gives 1, R gives 0. Col eliminates R. **Survivor: (T, L).**
      *   **Beta (Col first):** Col eliminates **R** (L is 1vs0, 0vs0; weakly dominates). Remaining: Col=L. Row faces L. T gives 1, B gives 1. Row is indifferent. **Survivors: (T, L) and (B, L).**
  *   **Debrief Point:** "Alpha found a unique solution. Beta found two. The algorithm broke."

  #### 0:55 – 1:15: Game 3 (3-Player Correlation)
  *   **Concept:** Best response depends on whether opponents correlate.
  *   **Roles:** Rotate so everyone has been a Player 1.
  *   **Payoffs:**
      *   **Player 1:** Chooses **In** or **Out**.
      *   **Player 2 & 3:** Choose **H** or **T**. (They want to match each other, payoff 1 if match, 0 if not).
      *   **Player 1 Payoff:**
          *   **Out:** 6 points (Guaranteed).
          *   **In:** 10 points if P2=P3. 0 points if P2$\neq$P3.
  *   **Procedure:**
      1.  **Condition A (Independent):** P2 flips a coin. P3 flips a *separate* coin. (Prob Match = 50%).
          *   P1 calculates: $0.5(10) + 0.5(0) = 5$.
          *   P1 Choice: **Out** (6 > 5).
      2.  **Condition B (Correlated):** Dealer draws from the **HH/TT deck** (2 cards: one HH, one TT). Both P2 and P3 obey the card. (Prob Match = 100%).
          *   P1 calculates: $1.0(10) + 0.0(0) = 10$.
          *   P1 Choice: **In** (10 > 6).
  *   **Discussion:** "Player 1's best move changed. The opponents' payoffs didn't change. The *structure of uncertainty* changed."

  #### 1:15 – 1:30: Formal Debrief & The One Sentence
  *   **Board Work:** Translate the physical experience into definitions.
      *   *Game 1:* "Bot" was not dominated by Top or Mid. It *was* dominated by $\sigma = 0.5\text{Top} + 0.5\text{Mid}$.
      *   *Game 2:* Weak dominance is path-dependent. Strict dominance is not.
      *   *Game 3:* Rationality rules out strategies that are never best responses. In 3+ players, "belief" means a probability distribution over opponents' *profiles*. If that distribution must be independent, more strategies survive. If correlation is allowed, fewer survive.
  *   **The One-Sentence Formulation:**
      *   Ask the class to draft it. Guide them to:
      *   *"Iterated elimination removes strategies that cannot be justified as a best response to any belief about opponents' rational choices that is consistent with the elimination process itself."*
      *   (Simpler version for them to copy): **"Common belief in rationality rules out any strategy that is not a best response to some belief about the opponents' strategies that also survives elimination."**

