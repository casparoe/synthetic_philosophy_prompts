answer: |-
  # Specification for an Information-Thermodynamics Accounting Framework

  ## Preamble
  This document specifies the requirements for any theoretical account claiming to describe the conversion of information into thermodynamic work. The goal is to provide an experimentalist with a decision procedure to determine if a proposed nanoscopic engine violates the Second Law or merely shifts the entropy cost to an unaccounted degree of freedom. The account must treat information as a physical quantity subject to conservation laws analogous to energy.

  ## Part I: The Desiderata
  The following requirements must be satisfied by the accounting framework. Each item lists the requirement, the specific physical case that motivates it, and its status.

  **1. The Formal Bound and Units**
  *   **Requirement:** The account must identify a single bounded quantity with explicit units (Joules, or Bits converted to Joules via $k_B T \ln 2$). It must state whether the bound is a strict inequality (floor on dissipation), an identity (equality holding for reversible processes), or an asymptotic limit (approached only in quasistatic operations). It must declare whether this bound is derived from microscopic statistical mechanics (Liouville/von Neumann evolution) or imported as an extra postulate.
  *   **Motivating Case:** *A device small enough and observed briefly enough that transient decreases of entropy are routinely recorded.* Without a clear statement on whether the bound applies to single trajectories or ensemble averages, transient fluctuations look like violations.
  *   **Status:** **Non-negotiable.**

  **2. Cycle Closure with Memory Debt**
  *   **Requirement:** The books must close over any finite number of cycles. If the device completes a cycle but leaves the memory in a different state than it started (e.g., a record is written but not erased), the account must quantify this "debt" as a thermodynamic liability equivalent to the work extracted. A process cannot be declared cyclic unless both the working substance and the memory register return to their initial statistical states.
  *   **Motivating Case:** *A demon with an effectively unbounded tape it never resets, so the record accumulates.* Naive accounts claim infinite work extraction by filling the tape; this requirement forces the tape's entropy increase to be counted against the work gain.
  *   **Status:** **Non-negotiable.**

  **3. State Function Consistency**
  *   **Requirement:** The total cost assigned to a transformation must be independent of the path taken through the control parameter space, provided the initial and final states of the system and memory are identical. No choice of intermediate steps (e.g., measuring early vs. late, compressing fast vs. slow) may change the net entropy balance owed.
  *   **Motivating Case:** *A demon with a single bit of memory, reset every cycle.* If the cost depends on the timing of the reset relative to the expansion, entropy ceases to be a state function, allowing perpetual motion via path optimization.
  *   **Status:** **Non-negotiable.**

  **4. Physical Correlation vs. Epistemic Knowledge**
  *   **Requirement:** The accounting must be phrased in purely physical terms (correlations between subsystems, mutual information defined by joint probability distributions). It must not rely on agent-relative quantities (what an observer "knows" or "ignores"). If the account uses epistemic language, it must provide a mapping to physical microstates.
  *   **Motivating Case:** *A demon handed a tape that already carries the relevant correlation with the system, so that no measurement is performed by anyone.* If cost depends on "who measured," a pre-correlated tape would appear free. If cost depends on physical correlation, the origin of the correlation is irrelevant; only its existence matters.
  *   **Status:** **Non-negotiable.**

  **5. The Passive Mechanism Exclusion**
  *   **Requirement:** The account must distinguish between a device that processes information and a device that merely rectifies fluctuations. To qualify as an information engine, the control mechanism must possess a distinct state space that becomes correlated with the working substance. Passive devices with no internal state memory must be shown to incur a cost elsewhere (e.g., thermalization of the gate) that prevents net work.
  *   **Motivating Case:** *A passive mechanism with no memory at all — trapdoor, ratchet and pawl, one-way valve.* This isolates what the memory contributes. If a ratchet works without memory, information is not the fuel. The account must show why the ratchet fails (thermal equilibration of the pawl) while the memory-driven engine succeeds (correlation utilization).
  *   **Status:** **Non-negotiable.**

  **6. Noisy and Partial Information Handling**
  *   **Requirement:** The bound must scale continuously with the quality of the information. If the detector is noisy, the work extractable must decrease proportionally to the reduction in mutual information. Perfect correlation yields maximum work; zero correlation yields zero work.
  *   **Motivating Case:** *A demon whose detector is noisy and yields only partial information.* This prevents binary "all-or-nothing" accounting where a wrong measurement is treated the same as a right one.
  *   **Status:** **Non-negotiable.**

  **7. Output Mode Neutrality**
  *   **Requirement:** The accounting must apply identically regardless of whether the output is mechanical work, electrical potential, or heat pumping (refrigeration). The bound should be on the total decrease in entropy of the reservoirs plus the system, not just on "work" in the mechanical sense.
  *   **Motivating Case:** *A demon that spends its record on refrigeration rather than on work.* This ensures the theory covers all thermodynamic tasks, not just lifting weights.
  *   **Status:** **Preference of the Generalized Free Energy camp.** (Some accounts focus strictly on work extraction).

  **8. Temperature Gradient Distinction**
  *   **Requirement:** The account must explicitly distinguish between work extracted from a thermal gradient (ordinary heat engine) and work extracted from a single bath using correlations (information engine). If two temperatures are present, the Carnot bound applies; if one temperature is present, the information bound applies.
  *   **Motivating Case:** *A demon operating on a working substance that already spans two temperatures, versus one operating on a substance at equilibrium.* This prevents misidentifying a standard heat engine as an information engine.
  *   **Status:** **Non-negotiable.**

  **9. Quantum Non-Disturbance**
  *   **Requirement:** In the quantum regime, the account must handle cases where the memory becomes entangled with the system without collapsing the wavefunction in the classical sense. The cost must be associated with the creation of entanglement or the breaking of it, not necessarily with a projective measurement.
  *   **Motivating Case:** *A quantum version in which the memory becomes entangled with the system and the measurement is non-disturbing.* Classical accounts often fail here by assuming measurement always disturbs energy.
  *   **Status:** **Preference of the Quantum Thermodynamics camp.** (Classical accounts may treat this as out of scope).

  **10. Added Case: Time-Delayed Feedback**
  *   **Requirement:** The account must handle latency. If the information is acquired at time $t_1$ and used at time $t_2$, and the system evolves spontaneously in between, the account must discount the value of the information based on the decay of correlation during the delay.
  *   **Motivating Case:** *Not listed in original prompt.* Real experimental setups have latency. If the system relaxes before the feedback is applied, the information is stale.
  *   **Status:** **Non-negotiable.**

  **11. Added Case: Memory Degradation**
  *   **Requirement:** If the memory device itself is subject to thermal noise while storing the record, the account must include the entropy cost of maintaining the memory fidelity against spontaneous decay.
  *   **Motivating Case:** *Not listed in original prompt.* Memory is physical. If the "tape" rots, the correlation is lost.
  *   **Status:** **Non-negotiable.**

  ---

  ## Part II: The Hard Constraints and Incompatibilities

  **Bounded Quantity and Derivation**
  The bounded quantity must be the **Total Entropy Production** ($\Delta S_{tot}$), measured in J/K (or dimensionless bits scaled by $k_B$). The bound is a **floor on dissipation**: $\Delta S_{tot} \ge 0$. For reversible information engines, this becomes an identity where work extracted equals the decrease in system entropy compensated by memory entropy increase. This bound must be **derived from statistical mechanics** (specifically, the invariance of phase space volume or unitarity of quantum evolution), not imported as an extra postulate. If the account requires a new axiom to forbid perpetual motion, it fails the specification.

  **Cycle Closure and State Functions**
  The requirement that **books close over finite cycles including memory debt** is the most critical operational constraint. It mandates that $\Delta S_{system} + \Delta S_{reservoir} + \Delta S_{memory} \ge 0$. If the memory ends in a high-entropy state (randomized) or a low-entropy state (purified) different from the start, that difference is a term in the balance sheet. This ensures consistency with entropy being a **state function**: the cost depends only on the initial and final joint distributions of system and memory, not on the sequence of gates or pulses used to get there.

  **Physical vs. Epistemic Phrasing**
  The accounting **must be phrased in purely physical terms**. Mentions of "agent knowledge," "observer ignorance," or "subjective probability" are prohibited unless mapped to objective correlation functions (Mutual Information $I(S:M)$). The physical state of the memory register determines the cost, not the mental state of an experimenter.

  **Flagged Incompatibilities**
  1.  **Local Erasure Cost vs. Path Independence:** There is a tension between the demand that the cost always be a local event at the moment of erasure (View A) and the demand that accounting be path-independent (Desideratum 3). If the cost is strictly local to erasure, one can construct paths where the erasure is delayed indefinitely, seemingly deferring the thermodynamic debt. If the accounting is truly path-independent, the "cost" is distributed over the entire trajectory of correlation creation and destruction, making it difficult to pinpoint a single "payment moment."
  2.  **Information as Resource vs. No Epistemics:** There is a tension between treating information as a storable, tradeable resource on a par with free energy (View C) and excluding epistemic notions (Desideratum 4). Calling information a "fuel" invites epistemic metaphors (knowledge is power). To satisfy the physical constraint, "information" must be rigorously defined as "negative entropy of correlation," which is less intuitive for tradeable resource models.

  **The Single Most Exclusionary Requirement**
  The requirement that **rules out the largest share of otherwise plausible accounts** is **Cycle Closure with Memory Debt (Desideratum 2)**.
  *   **Why:** Many intuitive models allow the demon to extract work by measuring a particle and then ignore the state of the demon's memory. They claim the work comes from "information" without accounting for the entropy increase in the memory register required to store that information. By demanding that the memory return to its initial state (or that the change in memory entropy be counted as a debt), this requirement forces the account to acknowledge that the memory is a thermodynamic system subject to the same laws as the gas. It eliminates any model that treats the demon as an external, cost-free observer.

  ---

  ## Part III: Scorecard of Views

  **View 1: The Erasure Cost Account**
  *   **Commitment:** Thermodynamic cost is incurred only when the memory is reset to a standard state. Measurement is free; utilization is free; reset costs $k_B T \ln 2$ per bit.
  *   **Performance:** Satisfies **Cycle Closure** and **Units**. Fails **Path Independence** (cost is localized to one step, creating tension with state function consistency). Struggles with **Pre-correlated Tape** (if no measurement occurs, when is the cost paid? It must argue the tape was "erased" in the past).
  *   **Verdict:** Good for engineering memory devices, but conceptually rigid on *when* the Second Law bites.

  **View 2: The Acquisition Cost Account**
  *   **Commitment:** Thermodynamic cost is incurred when the correlation is established (measurement). Resetting the memory is merely discarding a used resource and carries no additional fundamental cost if the memory is discarded.
  *   **Performance:** Satisfies **Physical Correlation** well. Fails **Cycle Closure** if the memory is not reset (allows accumulating debt without interest). Struggles with **State Function Consistency** (if I measure and don't use the info, did I pay? If I measure and use it, is the cost different?).
  *   **Verdict:** Intuitive for measurement-heavy setups, but fails to account for the thermodynamic necessity of restoring the apparatus to a ready state.

  **View 3: The Generalized Free Energy Account**
  *   **Commitment:** Information modifies the available free energy of the system. The bound is $W \le -\Delta F + k_B T I$, where $I$ is mutual information. Cost is distributed across the process; there is no single "payment step."
  *   **Performance:** Satisfies **Path Independence**, **State Function Consistency**, and **Noisy Information** perfectly. Handles **Quantum Entanglement** by generalizing $I$. Satisfies **Cycle Closure** by treating $I$ as a state variable that must return to zero for a true cycle.
  *   **Verdict:** Most robust against the Desiderata. It treats information as a physical term in the energy balance rather than a discrete event, resolving the "when is it paid" conflict by asserting it is paid continuously as correlation changes.
