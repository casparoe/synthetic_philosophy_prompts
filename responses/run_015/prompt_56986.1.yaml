answer: |-
  **Project Title:** Prioritarianism Under Uncertainty: Relocating the Leveling-Down Objection

  **1. The Central Question**
  Does the Priority View retain its structural advantage over telic egalitarianism when extended from certain outcomes to choice under uncertainty? The standard defense of prioritarianism rests on its immunity to the leveling-down objection: unlike telic egalitarianism, it never ranks a change as better unless it is better for someone. This project asks whether this immunity survives the transition to risky prospects. Specifically, I seek to determine whether every coherent extension of prioritarianism to uncertainty violates a structural principle that plays the same rhetorical role as the "nobody-is-better-off" condition in the certainty case. The possible answers are determinate: either prioritarianism possesses a unique extension that preserves both person-affecting intuition and structural consistency under risk, or it faces a dilemma where avoiding one violation necessitates incurring another, thereby relocating rather than resolving the leveling-down problem.

  **2. Why the Question is Open**
  While the tension between distributive values and expected utility is known, the specific vulnerability of prioritarianism remains contested. Three deflationary responses suggest the question is closed; addressing them establishes the project's necessity.

  First, some argue that uncertainty is the wrong setting because well-being is only realized, not expected. On this view, ethical evaluation applies only to final outcomes, rendering ex ante considerations irrelevant. If this is right, the project shifts to demonstrating that decision-making under uncertainty is inescapable for normative theory. Even if well-being is ontologically realized, agents must choose based on expectations. A theory that cannot guide choice without violating core intuitions is practically inert.

  Second, it is often claimed that dynamic-consistency arguments settle the choice of extension in favor of ex post prioritarianism, leaving no substantive question. Proponents argue that ex ante views violate separability across states of nature, leading to preference reversals over time. If this defense holds, the project must show that ex post prioritarianism incurs a cost equally damaging: the violation of ex ante Pareto unanimity. If the only surviving extension requires ranking a prospect as better even when every individual expects to be worse off, the "person-affecting" escape from leveling down is compromised.

  Third, a general impossibility response suggests that every aggregative distributive view faces trade-offs among structural principles, so nothing follows specifically against prioritarianism. If telic egalitarianism and utilitarianism also fail under uncertainty, prioritarianism loses no ground. The project responds by isolating the specific claim of immunity. Prioritarianism is marketed as the view that avoids the specific absurdity of leveling down. Showing that it merely trades this absurdity for a violation of unanimity or statewise dominance undermines its unique selling point, even if other views also struggle.

  **3. Method and Work Plan**
  The project proceeds in three phases over eighteen months, moving from formal reconstruction to normative analysis.

  *Months 1–6: Formal Reconstruction and Robustness Checks.*
  The initial phase involves rebuilding the two core sketches under explicit axiomatic assumptions. The first sketch contrasts ex post prioritarianism with ex ante Pareto. I will verify whether the violation of unanimity persists across different concave transformations and risk profiles. The second sketch contrasts ex ante prioritarianism with statewise dominance. Here, a significant risk must be resolved: the claim that ex ante prioritarianism violates dominance relies on comparing priority values across states, not well-being levels. I must establish whether dominance in *priority value* carries the same normative weight as dominance in well-being. Additionally, I will test whether these constructions are stable under alternative specifications of risk, such as continuous distributions rather than discrete states.

  *Months 7–12: The Structure of Individual Good.*
  The second phase addresses a unresolved difficulty: what it is for a prospect to be better *for a person* when that person's good is itself risky. Standard prioritarianism assumes individuals are risk-neutral regarding their own well-being, maximizing expected value. However, if individuals are risk-averse about their own well-being, the mathematical basis of the objection may shift. I will investigate whether a prioritarian may treat individuals as risk-neutral without begging the question against the objection. I will also explore third extensions, such as applying the transformation to a risk-adjusted certainty-equivalent of each person's prospect, or weighting states and persons in two distinct stages. The goal is to determine if these alternatives are principled or merely ad hoc maneuvers to evade the dilemma.

  *Months 13–18: Synthesis and Dissemination.*
  The final phase involves integrating the formal results with normative theory. I will draft two journal articles: one detailing the formal impossibility results for prioritarian extensions, and another exploring the normative implications for the "person-affecting" constraint. I will present these findings at workshops in ethics and social choice theory to test the arguments against specialist scrutiny. The period concludes with the preparation of a final monograph draft synthesizing the results.

  **4. Intended Results and Deliverables**
  By the end of the fellowship, the project will produce three primary deliverables. First, a formal proof demonstrating that no extension of prioritarianism satisfies both ex ante Pareto and statewise dominance in priority value simultaneously under standard conditions. Second, a normative analysis clarifying the relationship between risk attitudes and distributive justice, specifically addressing whether individual risk neutrality is a coherent assumption for prioritarianism. Third, two peer-reviewed articles and a conference presentation circuit that establishes the "relocation thesis": that the leveling-down objection is not answered by prioritarianism but displaced into the domain of uncertainty. These outputs will provide a definitive map of the logical space for distributive views under risk.

  **5. What Would Count as Failure**
  I offer a candid assessment of failure conditions. The project fails if the constructions prove unstable—for instance, if the violation of unanimity in ex post prioritarianism disappears under plausible restrictions on the domain of prospects. It also fails if the generalized objection turns out to be a restatement of a known impossibility result wearing philosophical clothing, offering no new insight into the specific debate between egalitarianism and prioritarianism. Finally, the project fails if I cannot resolve the ambiguity regarding what constitutes a benefit to a person under risk; if the concept of "expected well-being" is too contested to support the formal models, the normative conclusion cannot be drawn. In such cases, the output would be a negative result demonstrating the incoherence of the current framework rather than a positive proof of the conjecture.

  **6. Scope and Justification**
  *Scope Assessment:* If the project runs too large at the six-month mark, I will cut the investigation into third extensions (certainty-equivalents or two-stage weighting). The core contribution lies in establishing the dilemma between the two standard extensions; exploring every possible variant is secondary. I will focus exclusively on the ex post/ex ante dichotomy to ensure the central argument is secured.

  *Justification for Ethics Fellowship:* A reviewer might ask why this belongs in an ethics fellowship rather than a social choice theory seminar. The answer is that the stakes are normative, not merely axiomatic. Social choice theory identifies inconsistencies; ethics determines what we should do about them. This project does not simply prove a theorem; it investigates whether prioritarianism fulfills its moral promise to respect the separate existence of persons. The question of whether a view is "better for someone" under risk is a metaphysical and ethical question about the nature of personal good, not just a mathematical constraint. Therefore, the project requires the normative scrutiny of an ethics fellowship to interpret the formal results within the broader debate on distributive justice.
