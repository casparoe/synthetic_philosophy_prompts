      *   *Revision:* Redefine the source of the TE's epistemic power from "pure reasoning about nature" to "logical extraction of implications from empirically grounded theory."

  7.  **Drafting the Response:**
      *   *Tone:* Rigorous, respectful of expertise, direct (no fluff).
      *   *Structure:*
          1.  Executive Summary of Consistency.
