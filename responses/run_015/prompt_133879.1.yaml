          *   Consistency between the criterion for idealization (6) and the rejection of consciousness scenarios (7).
      *   **Output Requirements:** Order tensions by severity, specify what must be surrendered for each, identify the single most effective revision.

  2.  **Deconstruct the 7 Points:**
