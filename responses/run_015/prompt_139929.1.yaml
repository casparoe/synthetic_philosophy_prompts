answer: |-
  **Project Title:** Metric Triage: Distinguishing Mechanisms of Goodhart Failure to Prevent Mitigation Harm

  **Research Question**
  Do distinct causal mechanisms of Goodhart's Law (selection pressure, reclassification, and constitutive capture) require distinct mitigation strategies, and does applying a mismatched remedy accelerate the erosion of the target metric?

  **Context and the "Collapse" Risk**
  Organizations routinely abandon metrics when they stop tracking reality. The standard response is to add complexity: audit trails, metric baskets, or rotation. However, these interventions are treated as interchangeable tools for a monolithic problem. My preliminary research suggests Goodhart failures operate via three distinct mechanisms:
  1.  **Selection Pressure:** The metric and target diverge in the tails (e.g., pushing workers to speed creates safety risks).
  2.  **Reclassification:** The data entry changes, not the world (e.g., coding a standard delivery as two half-deliveries).
  3.  **Constitutive Capture:** The metric redefines the target itself (e.g., creditworthiness *becomes* the credit score).

  The prevailing literature treats these as variations of the same error. My hypothesis is that they are categorically different. Audits fix Reclassification but ignore Selection Pressure. Metric rotation fixes Selection Pressure but may destabilize Constitutive Capture (where stability is the value).

  The primary risk to this project is the **"Collapse Worry"**: that in practice, these buckets are indistinguishable. If every "Constitutive" case can be re-described as extreme "Selection Pressure," the taxonomy collapses, and the proposed diagnostic tool becomes semantic rather than functional. This project treats the Collapse Worry as a falsifiable hypothesis. If the mechanisms cannot be distinguished in historical case data, the taxonomy is invalid.

  **Methodology and Timeline (9 Months, ~10 hrs/week)**
  I will not build a formal model (too abstract for practical application) or conduct interviews (outside scope/ethics for an independent researcher). Instead, I will use **Comparative Case Reconstruction**. I will select five high-documentation domains where metric failure and subsequent intervention are publicly recorded: Hospital Coding (DRG creep), School Accountability (teaching to the test), Credit Scoring (subprime optimization), Warehouse Logistics (cases per hour), and ML Reward Hacking (specification gaming).

  *   **Months 1–2: Taxonomy Operationalization.** Define strict criteria for classifying a failure as Selection, Reclassification, or Constitutive based on available audit reports, whistleblower testimony, and post-mortems.
  *   **Months 3–7: Case Reconstruction (One domain per month).** For each domain, I will map: (a) the original target, (b) the proxy metric, (c) the specific gaming behavior, (d) the intervention attempted, and (e) the outcome. The key data point is whether the intervention matched the mechanism (e.g., did an audit stop reclassification? Did rotation stop selection pressure?).
  *   **Month 8: Synthesis.** Cross-case analysis to determine if "mismatched" interventions correlated with worse outcomes than "no intervention" or "matched" interventions.
  *   **Month 9: Deliverable Drafting.**

  This method is chosen because it tests *mechanism* rather than correlation. Surveys capture sentiment, not causal structure. Formal models assume the very distinctions I am testing. Public documentation allows for rigorous scrutiny without requiring institutional access.

  **Deliverable**
  A **Metric Triage Protocol** (approx. 15 pages + checklists). This will not be an academic paper. It is a decision aid for operations managers and policy designers.
  *   **Part 1: Diagnostic Flowchart.** Questions to identify the failure type (e.g., "Did the behavior change, or did the labeling change?" "Is the metric now part of the definition of success?").
  *   **Part 2: Intervention Matrix.** A mapping of specific remedies to specific failure types, including a "Do Not Use" list for each (e.g., "If Constitutive Capture is detected, do not rotate metrics").
  *   **Part 3: The Collapse Report.** A candid appendix detailing where the distinctions blurred in the case studies, warning users where the protocol is least reliable.

  **Failure Conditions**
  I will consider this project a failure if:
  1.  **Indistinguishability:** In more than three of the five case studies, the available evidence does not allow me to confidently distinguish between Selection Pressure and Constitutive Capture. If the data doesn't support the buckets, the tool is useless.
  2.  **No Differential Outcome:** If the historical record shows that "mismatched" interventions (e.g., auditing a selection pressure problem) produced outcomes statistically indistinguishable from "matched" interventions, the core hypothesis is false.
  3.  **Unactionable Output:** If the resulting Protocol requires data (e.g., "know the true causal structure of the target") that an organization cannot reasonably access, it fails the "practical epistemics" mandate.

  If the taxonomy collapses, I will pivot the deliverable to a negative result: a white paper arguing why current Goodhart mitigation strategies are epistemically blind, recommending a moratorium on complex metric fixes in favor of qualitative oversight. This is a less useful outcome for the foundation's goals, but it is an honest one.

  **Scope Note**
  I have excluded formal modeling and primary data collection. If the case reconstruction proves too time-intensive for the 10-hour/week constraint, I will reduce the domains from five to three (Hospital, Credit, Warehouse), prioritizing depth over breadth. The validity of the taxonomy matters more than the number of examples.
