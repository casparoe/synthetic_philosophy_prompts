prompt: |-
  I'm taking an advanced seminar on scientific realism this term and sharing a house with a PhD student in particle physics, so I keep bumping into a gap between how physicists write and how my seminar talks about what they are doing. In her field it is entirely routine to do all of the following inside a single paper: describe the Standard Model as an effective field theory, that is, as a low-energy approximation to something else, valid only below some cutoff scale, and therefore not something anyone in the field expects to be true in the long run; announce the discovery or observation of entities and quantities, whose measured values then get entered into permanently maintained reference tables that are treated as cumulative facts about the world; and rely, for whole chunks of the apparatus, the simulation, and the data analysis, on classical or non-relativistic models that everyone regards as superseded. So the theory is not true, the things it posits are nevertheless discovered, and the discarded theories of the past still do the calculating.

  To get a grip on this, our seminar has adopted a small procedure: whenever someone presents a case of theory change, historical or contemporary, they have to fill in a retention ledger, sorting the superseded theory's content into three bins — what the successor kept and now treats as literally true, what it kept but only because it gives right numbers in a limited regime, and what it dropped entirely. The ledgers do not come out tidy. Symmetries and conservation laws tend to be kept; but so is some ontology across violent structural change, electrons running from late-nineteenth-century cathode-ray work through to quantum field theory; while some structure that looked like the most secure part of the old picture, absolute simultaneity, or the conception of heat as the flow of a conserved substance, went into the bin. My housemate's own gloss is that the right unit of retention is not structure versus ontology but resolution: theories are true at a scale, in the way a map is true at a scale, and asking whether they are true simpliciter is a category mistake.

  What I would like is a reconstruction of what this bundle of practices — the effective-field-theory talk, the discovery talk, the reuse of superseded mathematics, and our ledger-sorting habit — presupposes about truth, reference, and theoretical success, and which rival views it quietly rules out. Specifically: does the practice strictly require something like structural realism, or would entity realism, or a thoroughly antirealist view on which a theory is only empirically adequate within a regime, license exactly the same behaviour? Can valid below the cutoff be cashed out as nothing more than yields correct numbers within error bars in regime R, and if so does that cash-out leave the practice of discovery-talk coherent, given that a term which may not refer in the successor theory is doing the discovering? Does the demand physicists place on any successor, that it recover the predecessor's numerical predictions in the predecessor's own domain, show that the old equations were tracking something real, or is it only a constraint on adequacy that an antirealist can accept? And is scale-indexed truth a genuine alternative to approximate truth, or just a relabelling of the same problem? Please separate what the practice strictly presupposes from what it merely sits comfortably with, tell me where it is philosophically underdetermined by several theories at once, and say concretely what would have to change in scientific practice — in the vocabulary of discovery, in how superseded theories are taught and used, in what our ledgers would even be tracking — if the implicit realism were replaced by the antirealist reading.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user is in an advanced seminar on scientific realism and lives with a particle physicist. They observe a tension between philosophical discussions of realism and actual scientific practice.
      *   **Observations of Practice:**
          1.  Standard Model (SM) treated as an Effective Field Theory (EFT) – not "true" in the long run, valid only below a cutoff.
          2.  Discovery talk is robust (entities/quantities entered into permanent tables).
          3.  Superseded/classical models are routinely used for calculation/simulation despite being "false."
      *   **Seminar Tool:** "Retention Ledgers" sorting superseded theory content into: (a) kept as literally true, (b) kept for right numbers in limited regime, (c) dropped entirely. Results are messy (some ontology stays, some structure goes).
      *   **Housemate's View:** Truth is scale-indexed (like a map), not *simpliciter*. Asking if a theory is true *simpliciter* is a category mistake.
      *   **Core Task:** Reconstruct what this bundle of practices presupposes about truth, reference, and success. Identify what rival views are ruled out vs. compatible.
      *   **Specific Questions to Address:**
          1.  Does practice *strictly require* Structural Realism (SR), or do Entity Realism (ER) / Antirealism (AR) license the same behavior?
          2.  Can "valid below cutoff" be cashed out as "yields correct numbers in regime R"? If so, is "discovery talk" coherent (reference failure risk)?
          3.  Does the demand for recovery of predictions (correspondence principle) show old equations tracked reality, or is it just an adequacy constraint?
          4.  Is scale-indexed truth a genuine alternative to approximate truth or just relabeling?
          5.  **Crucial Constraint:** Separate what is *strictly presupposed* from what is *merely comfortable*. Identify where practice is *underdetermined*.
          6.  **Concrete Counterfactual:** What would change in practice (vocabulary, teaching, ledgers) if implicit realism were replaced by antirealism?

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *The Tension:* The physicist's practice looks like "piecemeal realism" or "entity realism" (Hacking: "If you can spray it, it's real") mixed with "structural realism" (Worrall: "Structure is retained, ontology changes"). But the EFT framework adds a layer of *domain-specific truth* (Cartwright: "Dappled World" or Wilson: "Theory Patchwork").
      *   *The Housemate's View:* This sounds like *Perspectival Realism* (Giere, Massimi) or *Scale-Dependent Ontology*. It challenges the "God's Eye View" of truth.
      *   *The Seminar's Ledger:* This is essentially testing the "No Miracles Argument" (NMA) and "Pessimistic Meta-Induction" (PMI). The messy results suggest PMI isn't a clean wipe, but NMA isn't a clean sweep either.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the observation. This is the "gap" between philosophy of science *of* physics and physics *as practiced*.
      *   **Section 1: Strict Presuppositions vs. Comfortable Fits (The Underdetermination):**
          *   *Strict Presuppositions:* What *must* be true for the practice to make sense? Actually, surprisingly little. Science needs *reliability*, not necessarily *truth*. The practice strictly presupposes *stability of phenomena* and *mathematical continuity*.
          *   *Comfortable Fits:* Realism makes the *attitude* easier (why celebrate discovery if it's just a useful fiction?). Structural Realism fits the "retention of equations" well. Entity Realism fits the "discovery talk."
          *   *Underdetermination:* The practice is compatible with Constructive Empiricism (van Fraassen) *if* one accepts "empirical adequacy" is scale-relative.
      *   **Section 2: Addressing the Specific Questions:**
          *   *SR vs. ER vs. AR:* Practice doesn't *require* SR. ER works for the "discovery" part. AR works for the "EFT/cutoff" part. The tension is in combining them.
          *   *Reference & Discovery:* This is the hardest part. If the SM is false, do "electrons" refer? Causal theory of reference (Kripke/Putnam) saves this: reference is fixed by causal interaction, not by the full theory being true. So discovery talk survives antirealism about the *theory* but requires realism about the *causal node*.
          *   *Recovery of Predictions (Correspondence):* Antirealists call this "saving the phenomena." Realists call it "approximate truth." Mathematically identical. Metaphysically distinct.
          *   *Scale-Indexed Truth:* Is it distinct from approximate truth? Yes. Approximate truth implies convergence to a limit (the Truth). Scale-indexed truth implies distinct ontologies at distinct scales (e.g., fluids exist at macro, molecules at micro; fluids aren't "approximately" molecules, they are emergent). This aligns with Anderson's "More is Different."
      *   **Section 3: The Counterfactual (What if we switched to Antirealism?):**
          *   *Vocabulary:* "Discovery" becomes "Identification of stable regularities." "Observation" becomes "Detector response."
          *   *Teaching:* Classical mechanics taught explicitly as "false but useful" rather than "limiting case of truth."
          *   *Ledgers:* The "Literally True" bin disappears. Everything goes into "Empirically Adequate in Regime R."
      *   **Section 4: Synthesis/Conclusion:** The practice implies a *functional realism*. It treats truth as a property of *use within a domain* rather than *correspondence to a single noumenal world*.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say "Antirealism changes nothing." The prompt asks what would *have* to change. If they were thoroughgoing instrumentalists, the "permanent reference tables" would be weird. Why keep a table of "fictional" constants?
      *   *Refinement:* The "permanent tables" imply *invariance*. Invariance is the closest thing physics has to "truth." So the practice presupposes *invariance* across theory change.
      *   *Nuance on EFT:* EFT isn't just "false." It's "complete at this scale." This supports the Housemate's "scale-indexed truth." This is distinct from "approximate truth" (which implies the high-energy theory is the *real* one). I need to emphasize this distinction.
      *   *Reference:* The "discovery" of the Higgs boson. If the SM is an EFT, the Higgs field might be composite. Does "Higgs" refer? Yes, via causal interaction, even if the theoretical description (elementary scalar) is wrong. This supports Entity Realism over Structural Realism in this specific instance.
      *   *Ledgers:* The prompt says ledgers are messy. This undermines clean Structural Realism (which expects structure to stay). I need to highlight that the *messiness* rules out dogmatic SR.

  5.  **Final Polish:** Ensure the tone matches the user's (advanced, precise, philosophically literate). Use terms like "empirical adequacy," "causal theory of reference," "inter-theoretic reduction," "ontological emergence." Structure with clear headings.

      *(Self-Correction on the "Strict Presupposition" part)*: Does practice *strictly* require realism? No. Kuhn and van Fraassen showed you can make sense of science without truth. So I must argue that the *attitude* is realist, but the *logic* is underdetermined. The *social practice* (celebrating discovery) leans realist. The *mathematical practice* (EFT) leans instrumentalist/phenomenological.

      *(Final check on the "Scale-Indexed Truth" question)*: Is it just relabeling? If "approximate truth" means "close to the Final Theory," then Scale-Indexed is different because it denies the Final Theory is the only truth-bearer. If "approximate truth" means "close enough for current purposes," they converge. I should argue the Housemate's view is closer to *Ontological Pluralism* than standard Approximate Truth.

  6.  **Constructing the Output:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a remarkably precise diagnosis of the friction between the metaphysics of scientific realism and the methodology of high-energy physics. Your observation cuts to the heart of the "semantics of scientific progress." The practices you describe—EFT framing, robust discovery claims, and the pragmatic reuse of "false" theories—constitute a working ontology that is often more sophisticated than the binary realism/antirealism debate allows.

  Here is a reconstruction of what this bundle of practices presupposes, where it is underdetermined, and what would break if the implicit philosophical stance were swapped.

  ### 1. Strict Presuppositions vs. Comfortable Fits

  To distinguish what the practice *requires* from what it merely *tolerates*, we must separate the logical conditions for the mathematics to work from the sociological conditions for the community to function.

  **What is Strictly Presupposed:**
  1.  **Stability of Phenomena:** The practice strictly presupposes that detector responses and measurement outcomes are stable across theory change. If the "permanent reference tables" changed arbitrarily with every theoretical shift, the cumulative nature of the data would collapse.
  2.  **Mathematical Continuity:** It presupposes that the mathematical formalism of a superseded theory remains a valid *sub-algebra* or *limiting case* of the successor within a specific domain. (e.g., Newtonian gravity must be derivable from GR in the weak-field limit).
  3.  **Causal Invariance:** It presupposes that the causal nodes interacting with detectors (the "entities" discovered) remain stable even if their theoretical description changes. If the "electron" detected in 1900 were not causally continuous with the "electron" in the Standard Model, the discovery claim would be fraudulent.

  **What is Merely Comfortable (The Underdetermination):**
  The practice is **philosophically underdetermined** between three major views, provided they are tweaked:
  *   **Entity Realism (Hacking):** Comfortable with the "discovery talk" and the retention of particles across theory change. *Strain:* Struggles with the EFT claim that the entities themselves might be emergent excitations of a deeper field, not fundamental "things."
  *   **Structural Realism (Worrall/Psillos):** Comfortable with the retention of equations and symmetries in the ledgers. *Strain:* Your ledgers are "not tidy." If structure is what is real, why do some structural elements (absolute simultaneity) get dropped while some ontology (electrons) stays? Pure SR cannot easily explain the retention of ontology.
  *   **Constructive Empiricism (van Fraassen):** Comfortable with the EFT "valid only below cutoff" language (empirical adequacy within a regime). *Strain:* Struggles to explain the *affective* weight of "discovery." Why celebrate the observation of a phenomenon if one is agnostic about its existence?

  **Verdict:** The practice does **not** strictly require Structural Realism. It is compatible with a hybrid view often called **Perspectival Realism** or **Ontological Pluralism**, which aligns with your housemate's "scale-indexed" gloss.

  ### 2. Addressing Your Specific Questions

  #### A. Does practice require Structural Realism (SR) over Entity Realism (ER) or Antirealism (AR)?
  No. The practice is actually more friendly to **Entity Realism** than Structural Realism, despite the popularity of SR in philosophy seminars.
  *   **Why:** In your ledgers, "electrons" persist through violent structural changes (from classical billiard balls to QFT excitations). SR predicts structure stays and ontology goes. Physics often does the opposite: it keeps the "thing" (the causal agent) but radically alters the "structure" (the equations governing it).
  *   **Antirealism:** A thoroughgoing antirealist (instrumentalist) *can* license this behavior, but only by treating "discovery" as shorthand for "stabilization of a measurement protocol." They can use the old math because it is computationally cheaper, not because it tracks structure. However, they must treat the "permanent reference tables" as catalogs of *instrumental constants*, not *natural constants*.

  #### B. Can "valid below cutoff" be cashed out as "yields correct numbers," and does this kill discovery talk?
  This is the critical tension.
  *   **The Cash-Out:** Yes, "valid below cutoff" can be cashed out purely instrumentally as "yields correct numbers within error bars in regime R."
  *   **The Reference Problem:** If you do this, "discovery talk" becomes semantically risky *unless* you adopt a **Causal Theory of Reference** (Kripke/Putnam).
      *   *Descriptivist Reference:* If "electron" means "whatever satisfies the equations of the Standard Model," and the SM is false (an EFT), then "electron" fails to refer. Discovery talk is incoherent.
      *   *Causal Reference:* If "electron" refers to "the causal source of *this* track in the cloud chamber," then reference succeeds even if the theory describing it is false.
  *   **Coherence:** The practice remains coherent *only if* physicists implicitly hold a causal theory of reference. They treat the *interaction* as real, even if the *Lagrangian* is approximate. If they were descriptivists, they would have to say, "We haven't discovered the electron; we've discovered something that mimics an electron up to 1 TeV." They do not say this.

  #### C. Does the demand for recovery (correspondence) show old equations tracked reality?
  *   **Realist Reading:** Yes. The fact that GR *must* reduce to Newton in the weak-field limit suggests Newton's equations were capturing a real structural feature of spacetime (curvature $\approx$ 0), not just saving phenomena.
  *   **Antirealist Reading:** No. It is merely a constraint on **empirical adequacy**. Any successor theory that contradicts the predecessor in the predecessor's confirmed domain is empirically falsified by the old data. The constraint is logical, not ontological.
  *   **The Decider:** The difference lies in *explanation*. The realist says, "It works because it was partially true." The antirealist says, "It works because the new theory was constrained to fit the old data." The practice itself is neutral; the *attitude* of the physicist (the "why" they tell students) decides this.

  #### D. Is scale-indexed truth a genuine alternative to approximate truth?
  Yes, and this is your housemate's strongest philosophical point.
  *   **Approximate Truth:** Implies a single, fundamental ontology (the "Final Theory") toward which we are converging. The old theory is a "blurred photo" of the real thing.
  *   **Scale-Indexed Truth (Renormalization Group View):** Implies that **ontology is scale-dependent**. Fluids are not "approximately" molecules; fluids are *real* at the macro-scale, and molecules are *real* at the micro-scale. The Navier-Stokes equations are not "false"; they are *true at scale L*.
  *   **Significance:** This dissolves the Pessimistic Meta-Induction. We aren't replacing "false" theories with "true" ones; we are mapping different valid descriptions to different energy scales. This is not a relabeling; it is a shift from **reductionism** to **emergence**.

  ### 3. The Counterfactual: What if Practice Became Thoroughly Antirealist?

  If the implicit realism (or scale-ontological pluralism) were replaced by a strict Constructive Empiricism or Instrumentalism in the daily culture of the lab, the following concrete changes would occur:

  **1. Vocabulary of Discovery:**
  *   *Current:* "We observed the Higgs boson." "We measured the mass of the top quark."
  *   *Antirealist Shift:* "We observed a resonance consistent with the Higgs mechanism." "We calibrated the detector response to match the top quark parameter."
  *   *Consequence:* The "permanent reference tables" would be renamed "Parameter Lookup Tables for Phenomenological Models." The sense of *cumulative fact* would be replaced by *cumulative constraint*.

  **2. Teaching and Use of Superseded Theories:**
  *   *Current:* "Newtonian mechanics is a limiting case of Relativity." (Implies continuity of truth).
  *   *Antirealist Shift:* "Newtonian mechanics is a computationally efficient algorithm for low-velocity regimes, known to be ontologically incorrect."
  *   *Consequence:* Students would be taught to view classical models as *tools* (like a slide rule) rather than *approximations of nature*. This might reduce the heuristic value of the old math, as students would be less likely to trust its structural intuitions (e.g., conservation laws derived from classical symmetries).

  **3. The Retention Ledgers:**
  *   *Current:* Three bins (True, Regime-True, False).
  *   *Antirealist Shift:* Two bins (Empirically Adequate in Regime R, Empirically Inadequate).
  *   *Consequence:* The "Literally True" bin vanishes. This changes how physicists judge success. Currently, a theory is praised for "making sense" of the data (explanatory power). Under strict antirealism, a theory is praised only for "fitting" the data (predictive power). The search for "understanding" would be officially reclassified as a psychological aid, not a scientific goal.

  **4. The EFT Cutoff:**
  *   *Current:* The cutoff is a physical boundary where new physics *must* appear.
  *   *Antirealist Shift:* The cutoff is simply the point where the error bars of the current model exceed experimental precision.
  *   *Consequence:* The drive to build higher-energy colliders loses its "ontological" justification (finding the deeper truth) and relies solely on "pragmatic" justification (finding new parameters to fit new anomalies).

  ### Summary Reconstruction

  The bundle of practices you observe presupposes a **Functional Realism** that is underdetermined by standard metaphysical categories.

  1.  **Truth:** It treats truth as **domain-relative validity** (your housemate's view) rather than correspondence to a single fundamental layer. This rules out naive realism (one true theory) but also rules out radical antirealism (theories are just tools with no ontological commitment).
  2.  **Reference:** It relies on a **Causal Theory of Reference**. Terms refer via interaction, not via theoretical description. This allows "discovery" to remain coherent even when the theory is known to be an approximation.
  3.  **Success:** It defines success as **retention of predictive power across scale transitions**. The demand that successors recover predecessor predictions is a constraint on *continuity of reference*, not just empirical adequacy.

  **The Philosophical Gap:**
  Your seminar is likely debating **Global Realism** (Is science *as a whole* true?) while your housemate is practicing **Local Realism** (Is this model true *here*?). The "messy ledgers" arise because physics is not a monolithic block of truth; it is a patchwork of valid descriptions stitched together by correspondence principles.

  If you forced the physicists to adopt the seminar's binary (True/False), they would have to stop writing papers. If you forced the seminar to adopt the physicists' scale-indexing, they would have to abandon the Pessimistic Meta-Induction. The practice presupposes that **ontology is emergent**, not fundamental. This is the quiet metaphysical commitment that licenses the "discovery" of entities in theories everyone admits are "effective."
