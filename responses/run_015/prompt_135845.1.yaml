  Here is a defended research agenda ranking the four lines of inquiry by priority. The ordering is determined primarily by **upstream dependence** (logical priority), modified by a strategic assessment of **tractability** and the risk of **effort sinks** (work that consumes resources without yielding theoretical or practical purchase).

  ### 1. The Independence Question (Agent-Responsibility vs. Structural Culpability)
  **Priority: First**

  This is the foundational lever for the entire framework. It is the most upstream question because the answer dictates the metaphysical category of the "debt" that successors might inherit.

  *   **Upstream Dependence:** This question must be resolved before Line 2 (Successor Liability) can be meaningfully addressed. If *agent-responsibility* (intentional plan) is the primary category, then successor liability becomes a problem of inheriting *moral guilt* across generations—a notoriously difficult philosophical problem involving the non-identity of citizens. If *structural culpability* (institutional arrangements) is primary, successor liability transforms into a problem of inheriting *institutional continuity* and the obligation to repair systemic flaws. Resolving Line 1 effectively solves half of Line 2 by defining *what* is being inherited.
  *   **Tractability:** High. This does not require new archival discovery but rather a conceptual synthesis of existing Fischer controversy literature with contemporary philosophy of action. It is a matter of clarifying categories (intent vs. systemic risk) rather than finding new facts.
  *   **Normative Consequence:** High. It determines whether modern obligations are about *atonement* (for sins of the father) or *maintenance* (of a safe international order).
  *   **Dependency Note:** As you suspected, resolving Line 1 renders Line 2 significantly **easier**. If the debate settles on structural culpability, the "transgenerational identity" problem (Line 2) recedes; the state persists as a legal/institutional entity even if the population changes. If the debate settles on agent-responsibility, Line 2 becomes a philosophical quagmire. Therefore, a small research group must prioritize Line 1 to avoid getting trapped in the difficulties of Line 2 prematurely.

  ### 2. The Distribution Question (Collective vs. Individual Responsibility)
  **Priority: Second**

  This question establishes the metaphysical floor for Line 1. It asks whether the "structural culpability" posited in Line 1 is even coherent.

  *   **Upstream Dependence:** Line 1's "structural culpability" option is only viable if Line 4 is answered in the negative (i.e., if collective responsibility *need not* be distributed to every individual member). If standard individualism holds (collective responsibility *must* reduce to individual fault), then "structural culpability" collapses into a aggregate of individual negligences, weakening the distinctiveness of your three-part framework. Line 4 validates the ontology required for Line 1.
  *   **Neglectedness:** Low. This is the most well-trodden ground in the philosophy of collective responsibility (e.g., French, Kutz, Pettit). However, it requires re-evaluation specifically in the context of *historical* state actors rather than contemporary corporations.
  *   **Effort Sink Risk:** Moderate. There is a risk of re-litigating settled debates in social ontology. The research group should not aim to solve the general problem of collective intentionality but rather determine the *minimum conditions* required to make "structural culpability" intelligible in this specific historical case.
  *   **Strategic Value:** It acts as a gatekeeper. If the group cannot defend a non-distributive account of collective responsibility, Line 1's structural option fails, and the framework collapses back into standard individualist historiography.

  ### 3. The Implications Question (Practical Normativity)
  **Priority: Third**

  I rank this third, ahead of the Identity question, as a strategic judgment call to prevent theoretical stagnation. While logically downstream (you need to know *what* the responsibility is before knowing *what to do*), it serves as a necessary constraint on the metaphysics.

  *   **Upstream Dependence:** Logically downstream of 1 and 4. However, pragmatically, defining the *purpose* of attribution (e.g., is it for democratic education, international trust, or retributive justice?) helps constrain the answers to 1 and 2. If the goal is institutional reform, structural culpability (Line 1) is favored. If the goal is moral cleansing, agent-responsibility (Line 1) is favored.
  *   **Neglectedness:** High. Philosophers often stop at attribution, leaving the "so what?" to political scientists. There is little rigorous work connecting WWI responsibility specifically to *non-reparative* obligations (memory, curriculum, constitutional design).
  *   **Effort Sink Risk:** Low. This line of inquiry yields concrete outputs (policy frameworks, memorial guidelines) even if the metaphysical debates (Line 2) remain unresolved. It ensures the research group produces normative value even if theoretical consensus is elusive.
  *   **Judgment Call:** I prioritize this over Line 2 because Line 2 is a known "black hole" of philosophy. By clarifying the *practical stakes* (Line 3) first, the group can determine if the metaphysical hurdles of Line 2 are actually worth jumping. If the practical implications of "guilt inheritance" vs. "institutional repair" are functionally identical in the present day, Line 2 may be bypassed entirely.

  ### 4. The Identity Question (Transgenerational Political Identity)
  **Priority: Fourth**

  This is the most downstream and most dangerous line of inquiry for a limited research group. It should be tackled only after the nature of the fault (Line 1), the bearer of the fault (Line 4), and the purpose of the attribution (Line 3) are clear.

  *   **Upstream Dependence:** Fully dependent on 1, 4, and 3. You cannot determine if the Federal Republic is the "same" as the Kaiserreich (Line 2) until you know *which features* constitute the relevant identity. Is it the *people* (Line 4), the *intent* (Line 1), or the *institutions* (Line 1)? Without the prior categories, "identity" is an empty variable.
  *   **Tractability:** Low. This is the least tractable question. The literature on transgenerational identity is fraught with paradoxes (e.g., the non-identity problem). It is the most likely to absorb effort without altering theory or practice.
  *   **Effort Sink Risk:** **Critical.** This is the primary "effort sink." A small group could spend years debating the metaphysics of national identity without ever producing a actionable normative conclusion.
  *   **Strategic Recommendation:** Do not attempt to solve the general problem of transgenerational identity. Instead, treat it as a functional variable: "What theory of identity is *required* to support the practical implications identified in Line 3?" This reverses the method: derive the metaphysics from the normative need, rather than trying to ground the normativity in a pre-existing metaphysics.

  ### Summary of Dependencies and Resource Allocation

  The critical dependency lies between **Line 1 (Independence)** and **Line 2 (Identity)**.
  *   **If Line 1 resolves to Structure:** Line 2 becomes a question of *legal/institutional continuity*. This is tractable (states persist through regime change). Successor liability is about fixing the machine, not punishing the ghosts.
  *   **If Line 1 resolves to Agent:** Line 2 becomes a question of *moral guilt inheritance*. This is intractable (citizens are not their ancestors). Successor liability risks collapsing into incoherence.

  **Resource Allocation Strategy:**
  Direct 50% of resources to **Line 1**. It is the pivot point that determines the difficulty of the entire project.
  Direct 30% to **Line 3**. This ensures the project remains grounded in normative consequence and avoids becoming a purely historical or metaphysical exercise.
  Direct 20% to **Line 4**. Ensure the metaphysical floor is solid enough to support Line 1.
  Direct 0% to **Line 2** as a standalone project. Address it only derivatively, as required by the outcomes of Lines 1 and 3.

  **Where Judgment Replaces Argument:**
  My ranking of Line 3 above Line 2 violates strict logical ordering (implications follow from identity). I prioritize Line 3 because, in non-ideal theory, **normative consequence** should constrain **metaphysical commitment**. If a theory of identity (Line 2) yields no actionable obligations (Line 3), it is practically irrelevant. For a small research group aiming to impact how societies handle historical injustice, avoiding the "Identity Quagmire" until the "Practical Stakes" are defined is a necessary methodological gamble.
