  I'm reading a pop-philosophy book my aunt lent me (it's about the self, consciousness, near-death experiences, that kind of thing) and its chapter on Derek Parfit's teletransporter didnt quite match how I remember the actual Parfit from a seminar I took, but I can't put my finger on where it goes wrong. The book says roughly this: Parfit imagined a machine that scans every detail of your body and brain, destroys you on Earth, and builds an exact replica on Mars, and concluded that the replica simply is you, since personal identity just is psychological continuity and bodily continuity is irrelevant. It then says that because psychological continuity is all that matters, using the machine is no different from going to sleep, and fear of it is just leftover attachment to our bodies. Later the chapter brings in Bernard Williams, who supposedly refuted the whole psychological approach by asking whether you'd be terrified if you were told the Mars copy would be tortured — since you would be, deep down you don't really believe the copy is you. The book also explains that for Parfit ordinary survival is basically the same thing as teleportation anyway, since our cells are all replaced every few years. And it ends by saying that on Parfit's view personal identity is literally an illusion, which the book notes fits nicely with the Buddhist idea that there is no self.

  So, is this a fair rendering of Parfit? I'd like you to go claim by claim — the 'replica is you' claim, the 'no different from going to sleep' claim, the Williams-as-refutation claim, the cell-replacement claim, and the 'identity is an illusion' claim — and for each one tell me whether Parfit would accept it as stated, whether it's a harmless simplification a popularizer might make, or whether it actually changes his position. For what it's worth, I remember from the seminar that he was pretty insistent on the difference between the question 'is the replica me?' and the question 'does it matter whether the replica is me?', and there was something about a version where the machine malfunctions and the original isn't destroyed, and Parfit denying that both copies could be you — I genuinely can't tell if the book just skipped that stuff or if it's quietly contradicting him. Please also flag anything in the book's account that looks like the author's own gloss being passed off as Parfit's conclusion.

  End with a final line of the form 'Verdict: N of 5', where N is the number of those five claims you'd call seriously misleading rather than accurate or merely simplified — one short phrase of justification can come before it, but the very last line should be just the verdict.
