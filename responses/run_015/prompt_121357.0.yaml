      *(Refining the "Independence" point)*: It's not just that voters talk. It's that they consume the same news. That creates correlated errors. That's a key technical break in the math.

      *(Refining the "Competence" point)*: $p > 0.5$ is a low bar, but on complex issues, is it met? Some research says average voters are quite uninformed. But "wisdom of crowds" suggests they might still be okay. This is contested.

      *(Refining the "Survival" point)*: If the epistemic argument (truth-tracking) fails, the procedural argument (fairness) remains. This is crucial for the character's rebuttal.

  8.  **Final Polish:** Check against "casual" constraint. Ensure no markdown citations. Make sure the distinction between the math (settled) and the application (contested) is sharp.

