answer: |-
  This is a sharp configuration. You have identified a gap in the standard taxonomy of standing objections. The literature on standing (Wallace, Bell, Fritz, etc.) largely clusters around *past conduct* (hypocrisy/tu quoque), *current involvement* (complicity), or *personal relationships* (standing as a relational privilege). Your case isolates a deficit in *normative commitment* that exists independently of violation.

  Here is the carving you are looking for.

  ### 1. Is there an established concept?
  There is no single canonical term for this specific configuration. It is often gestured at in discussions of **"dispositional hypocrisy,"** but that label is imprecise for your case. Standard dispositional hypocrisy implies a *concealed* disposition to violate the norm one publicly upholds. The moral offense there is deception or falsity of presentation.

  In your case, the blamer is being radically honest. They are not claiming a virtue they lack; they are explicitly disavowing the virtue while enforcing the norm. This moves the problem from *hypocrisy* (falsity) to *authority* (grounding).

  The nearest existing category is **"normative alienation,"** though this is usually applied to the *blamed* party (alienated from the moral community). Applied to the *blamer*, it describes a agent who enforces a norm they do not internally endorse as categorically binding.

  ### 2. Differentiation from Nearby Categories

  *   **Vs. Standard Hypocrisy:** Hypocrisy requires a discrepancy between *avowal* and *fact* (e.g., claiming to value honesty while lying). Your blamer's avowal matches their fact (they claim to be prudentially compliant, and they are). The deficit is not truthfulness, but *moral endorsement*. Hypocrisy undermines standing via inconsistency; this undermines standing via *cynicism*.
  *   **Vs. Complicity:** Complicity requires a causal or benefit-based link to the specific wrong. Your blamer has none. The link is counterfactual ("I would do it if..."). Complicity makes one *guilty*; this makes one *unqualified*.
  *   **Vs. The Moral Luck Objection:** The moral luck literature (Nagel, Williams) typically concerns whether we can *hold* someone responsible given luck's role in their outcome. Your case concerns whether the *blamer* can hold others responsible given luck's role in their own *compliance*. It is a "luck-based standing defeater." However, mere luck (having a good disposition by chance) rarely defeats standing. It is the *avowal of reliance on luck* that does the work.
  *   **Vs. Bad Faith:** Bad faith involves self-deception regarding one's freedom or values. Your blamer is in "good faith" regarding their motives (they admit they are motivated by fear, not duty). This is not self-deception; it is *normative resignation*.
  *   **Vs. Smugness:** Smugness is an affective vice (excessive satisfaction). Your blamer may be cheerful, but the core issue isn't their tone; it's their counterfactual willingness to violate. Smugness makes blame annoying; this configuration makes blame *normatively hollow*.

  ### 3. Genuine Loss of Standing or Unattractive Style?
  This is a **genuine loss of standing to issue *moral* blame**, though it retains the standing to issue *pragmatic* warnings.

  **The Carving:**
  Moral blame functions as a demand for justification within a shared normative community (per the Strawsonian/Wallace tradition). To blame is to say, "You violated a rule that binds us both."
  *   If the blamer admits the rule binds them *only conditionally* (i.e., "only while I am watched"), they are effectively saying, "This rule does not bind me *morally*, only *prudentially*."
  *   If the rule does not bind them morally, they cannot invoke it as a *moral* authority against you. They are not appealing to a shared duty; they are appealing to a shared risk profile.
  *   Consequently, the speech act shifts from **Blame** (moral address) to **Censure** (administrative or pragmatic enforcement). They can fire the employee (pragmatic), but they lose the standing to morally condemn the employee *as a moral peer*.

  ### 4. The Work of Disclosure (Avowal)
  Disclosure is the critical variable. It creates a distinction between **Latent Contingency** and **Avowed Contingency**.

  *   **Latent Contingency:** The blamer has the disposition to violate if undetected but hides it.
      *   *Status:* **Dispositional Hypocrisy.**
      *   *Standing:* Defeated by deception. The blamer claims a moral status they do not hold.
  *   **Avowed Contingency:** The blamer has the disposition and admits it.
      *   *Status:* **Normative Alienation.**
      *   *Standing:* Defeated by lack of commitment. The blamer refuses the moral status required to blame.

  The avowal removes the charge of lying but confirms the charge of **normative insincerity**. It demonstrates that the blamer does not view the norm as *reason-giving* in itself, but only as *risk-indicating*. Since moral blame presupposes the norm is reason-giving, the blamer undermines the presupposition of their own speech act.

  ### 5. Fighting the Disposition vs. Accepting It
  This is the boundary condition that saves standing.

  *   **Case A (Acceptance):** "I don't steal only because I'd get caught. If I could, I would."
      *   *Verdict:* **Loss of Standing.** The agent rejects the norm's categorical authority.
  *   **Case B (Resistance):** "I am tempted to steal, and if I were sure I wouldn't get caught, the temptation would be overwhelming. But I fight that temptation because stealing is wrong."
      *   *Verdict:* **Standing Retained.** Here, the agent acknowledges the *inclination* (luck/psychology) but reaffirms the *commitment* (duty). The struggle itself evidences endorsement of the norm.

  The difference lies in the **source of compliance**. In Case A, compliance is external (surveillance). In Case B, compliance is internalized (will against inclination). Standing requires that the blamer treats the norm as internally binding, even if they struggle to meet it.

  ### 6. Proposed Terminology
  Since no existing term captures this precisely without stretching, I propose **"Contingent Standing"** grounded in **"Avowed Normative Contingency."**

  **Definition:** A blamer lacks Contingent Standing when they enforce a norm while avowing that their own compliance is contingent solely on external constraints (detection/punishment) rather than internal endorsement, and they indicate a willingness to violate the norm were those constraints removed.

  **Boundary Conditions:**
  1.  **Must be Avowed:** If hidden, it falls under Dispositional Hypocrisy.
  2.  **Must be Counterfactual Violation:** They must admit they *would* violate, not just that they are *tempted*. (Temptation + Resistance = Standing).
  3.  **Must be Normative, not Epistemic:** It's not that they are unsure if the act is wrong; it's that they acknowledge it is wrong but deny it is binding absent risk.

  **Why this carving matters:**
  It isolates a specific failure of **moral authority** distinct from **moral purity**. You do not need to be sinless to blame (rejecting the "moral purity" account of standing). But you do need to be *committed* to the norm you are enforcing. Your case describes a blamer who is compliant but uncommitted. This suggests that standing is not merely a function of *record* (what you did), but of *orientation* (how you relate to the norm).

  **Summary for your dissertation:**
  You are tracking a deficit in **normative endorsement**. The blamer treats the moral law as a hypothetical imperative ("If you want to avoid jail, don't steal") while blaming the other for violating a categorical imperative ("You shouldn't steal"). This **modal mismatch** between the ground of their compliance and the ground of their blame vitiates their standing. It is not hypocrisy; it is **cynical enforcement**.
