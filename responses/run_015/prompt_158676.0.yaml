answer: |-
  The hinge picture cannot bear the weight being put on it because it conceals the crucial premises of path dependence and survival probability; replace it with an orbital insertion model.

  ### 1. The Mapping

  | Door Analogy | Intended Historical Referent | Contested Identification |
  | :--- | :--- | :--- |
  | **The Hinge** | The present generation / current decision epoch. | Is the hinge a single moment, a decade, or a century? |
  | **The Door** | The trajectory of civilization through time. | Is civilization a single object or a collection of agents? |
  | **Door Length** | The duration and population size of the future. | Is length a fixed constant or a variable dependent on the push? |
  | **The Push** | Resources spent on intervention (risk reduction, value shaping). | Does the push move the trajectory or merely consume resources? |
  | **Displacement** | The state of the far future (values, welfare, existence). | Is this a measurable coordinate or a qualitative state? |
  | **Rigidity** | Path dependence / lock-in of early conditions. | **Highly contested:** Assumes future generations cannot override current choices. |

  ### 2. The Disanalogies

  **(i) Rigidity vs. Jointed Agency**
  The door assumes rigidity: a 1-degree turn at the hinge guarantees a specific displacement at the edge. History is not rigid; it is a chain of hinges. Future generations possess their own agency and capacity to deflect the trajectory. If the door is actually an articulated arm, the displacement at the end is the vector sum of angles at *every* joint, not just the first.
  *   **Why it matters:** This disanalogy destroys the leverage argument for "value shaping" activism. For the first hinge to dominate, you must assume either that future agents will lack the capacity to correct your course (implausibly pessimistic about them) or that your push permanently locks the angle of all subsequent hinges (implausibly optimistic about lock-in technology). If the chain is jointed, the influence of the first hinge decays unless explicitly welded. The picture smuggles in "path dependence" as a geometric fact rather than a sociological claim that requires evidence.

  **(ii) Reversibility vs. Absorbing States**
  A door remains a door regardless of how hard it is shoved; it swings symmetrically and stays on its hinge. Existential risk and institutional lock-in are not kinematic adjustments; they are ontological changes. Extinction removes the door entirely; totalitarian lock-in welds the hinge.
  *   **Why it matters:** This disanalogy carries the real weight of the "restraint" argument. The door picture treats all pushes as comparable vectors, but some pushes (risk reduction) preserve the mechanism, while others (reckless deployment) destroy it. The asymmetry between "moving the door" and "breaking the hinge" is not visible in the geometry. If the hinge breaks, length becomes zero, and the leverage multiplier vanishes. The picture illegitimately treats existence as a background constant rather than a variable at stake.

  **(iii) Length as Assumption vs. Mechanism**
  The amplification factor is the length of the door. The picture shows *how* length creates leverage, but it provides no reason to believe the door is long. It depicts a long door to illustrate a point, thereby visually begging the question.
  *   **Why it matters:** This reduces the argument to arithmetic dressed as mechanics. Expected value = Probability × Impact × Duration. The door illustrates Impact × Duration, but Duration is the very thing endangered by the Push. Using the picture to justify spending resources to ensure a long future is circular: you must assume the future is long enough to warrant the spending to make the spending warrant the future. The picture obscures the feedback loop where the push determines the length.

  ### 3. Survival of Conclusions

  Neither conclusion survives the audit unmodified, but the "restraint" conclusion is more robust.

  *   **Maximal Activism (Steering):** This conclusion collapses. It relies entirely on the Rigidity assumption (i). Without evidence that current interventions lock in trajectories against future correction, the leverage multiplier is unjustified. The door picture makes rigidity look like a physical law; in history, it is a fragile empirical claim.
  *   **Maximal Restraint (Risk Reduction):** This conclusion survives but requires modifying the picture. It relies on the Absorbing State disanalogy (ii). If the hinge can break, then preserving the hinge dominates moving the door. However, the picture fails to show *why* the hinge is fragile; it must be supplemented with specific risk models.
  *   **Verdict:** The picture was carrying the arguments by hiding premises. The activism argument hid the premise of "lock-in." The restraint argument hid the premise of "fragility." Reasoning must proceed without the picture, using explicit probabilities of lock-in and extinction rather than geometric intuition.

  ### 4. A Better Analogy: Orbital Insertion

  Replace the door with the **guidance system of a deep-space probe**.

  | Feature | Door Analogy | Orbital Insertion Analogy |
  | :--- | :--- | :--- |
  | **Leverage** | Geometric (Length × Angle). | Kinematic (Velocity Vector × Time). |
  | **Correction** | Impossible without moving hinge. | Possible but exponentially costly (fuel) over time. |
  | **Failure** | Door stays on hinge. | Mission failure (loss of probe/orbit). |
  | **Agency** | None (Passive object). | Programmable (Autonomy can be built in). |
  | **Length** | Fixed physical property. | Contingent on successful insertion. |

  **What it captures:**
  1.  **Cost of Correction:** It models the intuition that early adjustments are cheap and late adjustments are prohibitive (the "lock-in" claim) without assuming physical rigidity. It frames lock-in as an economic/fuel constraint rather than a geometric necessity.
  2.  **Absorbing States:** It includes mission failure. If the insertion burn is wrong, there is no far future to displace. The length is contingent on the push.
  3.  **Agency:** It allows for onboard autonomy. You can program the probe to correct itself later (future agency), but you are limited by the fuel and code you provide now (current leverage).

  **What it obscures:**
  1.  **Teleology:** A probe has a target; history may not. This risks implying the future has a destination we are aiming for, rather than a space we are navigating.
  2.  **Complexity:** A probe is a single machine; civilization is a competitive ecosystem of agents. The analogy risks oversimplifying the "push" as a single command rather than a distributed negotiation.

  **Regarding the Hourglass:**
  The hourglass neck captures the *volume* bottleneck (few people now, many later) better than the door, but it fails on *vector*. Sand flows down regardless of the neck's shape; it implies inevitability rather than contingency. It supports the "population size" argument for long-termism but undermines the "steering" argument, as the flow direction is fixed by gravity. Use the hourglass for arguments about *scale*, and the orbital insertion for arguments about *influence*.
