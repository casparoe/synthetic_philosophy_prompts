  # The Measurement Artifact Hypothesis: A Six-Month Research Proposal on the Leveling-Down Objection and Welfare Ontology

  ## 1. Introduction: The Physicist's Lens on Normative Ethics

  The Leveling-Down Objection (LDO) stands as one of the most persistent and intuitive challenges to egalitarian and prioritarian theories of distributive justice. The objection posits a scenario in which a state of affairs where everyone is equally worse off is judged, in at least one respect, to be better than a state of affairs where some are better off and others are worse off, provided the latter state is unequal. For many normative ethicists, the intuition that a universal reduction in welfare cannot be an improvement in any respect is decisive. It forces theories to abandon intrinsic value for equality or to refine the aggregation functions of prioritarianism to ensure they do not imply that leveling down is beneficial.

  However, the standard discourse surrounding the LDO operates almost exclusively within the domain of normative intuition and logical consistency. It asks whether equality is intrinsically valuable, whether priority weighting should be concave, and whether the objection confuses aggregate welfare with distributive fairness. What remains largely unexamined is the mathematical ontology of the welfare variable itself. In the physical sciences, the validity of an equation depends critically on the measurement scale of its variables. One cannot meaningfully calculate the ratio of two temperatures measured in Celsius, nor can one apply logarithmic transformations to data that lacks an absolute zero, without introducing artifacts that reflect the measurement system rather than the physical reality.

  This research proposal outlines a six-month project to investigate whether the Leveling-Down Objection is a genuine normative problem or partly an artifact of unstated measurement assumptions. Specifically, it asks: if welfare comparisons are modeled on an interval scale (permitting differences and weighted aggregation but lacking an absolute zero and meaningful ratios) rather than on a ratio scale (with an absolute zero), does the classic leveling-down scenario retain its counterintuitive force, collapse, or relocate to a different structural feature?

  The hypothesis driving this research is that standard formulations of prioritarianism implicitly treat welfare as a ratio scale, thereby licensing mathematical operations—such as specific concave transformations and comparisons of "levels" relative to a zero point—that are not invariant under the admissible transformations of an interval scale. If welfare is merely interval-scaled, the "zero point" is arbitrary. Consequently, a "leveling down" operation that reduces everyone's welfare by half is not a well-defined operation unless a true zero exists. If the zero is arbitrary, the moral evaluation of the scenario may shift depending on where the zero is placed, suggesting that the intuitive force of the LDO relies on a hidden ontological commitment to a ratio scale of well-being.

  This project leverages a disciplinary lens common in experimental physics but rare in moral philosophy: rigorous measurement theory. The goal is not to empirically measure welfare but to conceptually formalize the aggregation mathematics of prioritarianism under explicit measurement regimes. The deliverable will be a 6,000-word paper and a workshop presentation that provide a taxonomy of the LDO under different measurement ontologies. A successful result will demonstrate that the LDO has logically distinct forms under different measurement assumptions, and that under an interval-scale model with a context-dependent baseline, the objection either dissolves or must be reformulated as a claim about baseline selection rather than equality per se. A failed result would show that the scale distinction is purely notational, yielding identical normative conclusions across regimes.

  This proposal details the six-month trajectory, the formal methods to be employed, the philosophical arguments to be developed, and the criteria for success. It avoids standard literature review, focusing instead on the conceptual and formal construction of the argument.

  ## 2. The Measurement Gap in Normative Ethics

  To understand the necessity of this project, one must first articulate the gap in current ethical modeling regarding measurement scales. In the philosophy of science and psychometrics, measurement scales are classified by the group of transformations that leave the empirical relations invariant. 

  An **ordinal scale** preserves only order. If $A$ is better than $B$, any monotonic increasing transformation preserves this relation. Arithmetic operations like addition are not licensed. 
  An **interval scale** preserves order and differences. If the difference in welfare between $A$ and $B$ equals the difference between $C$ and $D$, this relation must hold after transformation. The admissible transformations are linear shifts: $w' = aw + b$, where $a > 0$. Crucially, there is no absolute zero; the point labeled "0" is arbitrary. 
  A **ratio scale** preserves order, differences, and ratios. It possesses a non-arbitrary absolute zero. The admissible transformations are similarity transformations: $w' = aw$, where $a > 0$.

  Standard prioritarianism aggregates moral value $V$ as the sum of transformed individual welfare levels: $V = \sum f(w_i)$. The function $f$ is typically concave (e.g., square root or logarithm) to reflect the moral priority of benefits to the worse off. For this equation to be meaningful, the moral ranking of social states must be invariant under the admissible transformations of the welfare scale. If the ranking changes when we shift the zero point (an interval transformation), the theory is ill-defined for interval-scaled welfare.

  Current ethical discourse often treats welfare as if it were ratio-scaled without argument. Philosophers speak of "doubling" welfare, "halving" suffering, or welfare being "zero" at a neutral state. These are ratio-scale concepts. However, many philosophical accounts of well-being suggest it is interval-scaled. If well-being is the balance of pleasure over pain, or the fulfillment of preferences, the "zero" point is often a theoretical construct rather than a natural absolute. If welfare is interval-scaled, then the operation of "leveling down" to a specific level becomes ambiguous. To say everyone is reduced to "half" their welfare requires a zero point. If the zero point shifts, "half" changes. 

  Furthermore, the concavity of $f$ is not invariant under interval transformations. A function that is concave on a ratio scale may not be concave on an interval scale if the zero point is shifted sufficiently. For example, $f(w) = \sqrt{w}$ is concave for $w > 0$. But if we shift the scale such that $w_{new} = w - 100$, the domain and curvature properties change relative to the new zero. If prioritarianism relies on concavity to generate its distributive implications, and concavity is scale-dependent, then the moral implications of prioritarianism are scale-dependent.

  The Leveling-Down Objection typically compares State A (Unequal, High Welfare) with State B (Equal, Lower Welfare). The objection claims that B cannot be better than A in any respect. Prioritarianism usually agrees, as the loss in aggregate transformed welfare outweighs the gain in equality. However, the *force* of the objection often relies on the intuition that "lower" is objectively lower. If "lower" is defined relative to an arbitrary zero, the comparison might be unstable. 

  This research posits that the LDO is not a monolithic objection but a family of objections that behave differently depending on the measurement ontology. By formalizing these ontologies, we can isolate whether the objection is normative (about the value of equality) or structural (about the mathematics of aggregation). This distinction is vital. If the LDO is structural, it can be resolved by correcting the mathematical model. If it is normative, it requires a revision of ethical principles. This project aims to distinguish these cases.

  ## 3. Research Objective and Core Hypothesis

  The primary objective of this six-month project is to construct a formal taxonomy of the Leveling-Down Objection based on measurement scales. The core hypothesis is that the LDO loses its decisive counterintuitive force when welfare is modeled as an interval scale with a context-dependent baseline, rather than a ratio scale with a fixed zero.

  Specifically, the research seeks to answer three sub-questions:
  1.  **Invariance:** Is the prioritarian ranking of Leveling-Down scenarios invariant under interval transformations of the welfare scale?
  2.  **Curvature:** Does the moral significance of the priority weighting function (concavity) depend on the existence of a ratio-scale zero?
  3.  **Relocation:** If the LDO persists under interval scaling, does it relocate from a claim about "equality vs. efficiency" to a claim about "baseline selection"?

  The hypothesis suggests that standard presentations of the LDO smuggle in a ratio-scale ontology. When this ontology is made explicit, the objection either dissolves (because the "leveling" operation is ill-defined) or transforms into a debate about where to set the baseline for moral calculation. This reframing offers a path forward for prioritarianism: instead of defending the value of equality against the LDO, the prioritarian can defend the choice of measurement scale and baseline as the primary normative commitment.

  This approach aligns with the physicist's instinct to check the dimensional consistency of equations before interpreting their physical meaning. In ethics, we often interpret the "meaning" (normative output) without checking the "dimensional consistency" (measurement invariance). This project corrects that order of operations.

  ## 4. Phase I: Formal Foundations (Months 1 and 2)

  The first two months are dedicated to formalizing prioritarian aggregation under three explicit measurement regimes: Ordinal, Interval, and Ratio. This phase is purely conceptual and mathematical, requiring no empirical data. The goal is to construct the apparatus necessary to test the LDO rigorously.

  ### Month 1: Formalizing Aggregation Under Measurement Regimes

  In the first month, the work will focus on defining the aggregation function $V = \sum f(w_i)$ under the constraints of each scale. 

  For the **Ratio Scale**, the formalization is standard. Welfare $w$ is non-negative, with a true zero. Admissible transformations are $w' = aw$. The priority function $f(w)$ must be such that the moral ranking is invariant under $w \to aw$. This typically requires $f$ to be homogeneous of degree $k$, or for the aggregation to be normalized in a specific way. Standard prioritarian functions like $f(w) = w^p$ (where $0 < p < 1$) satisfy this. The moral value scales with the welfare scale, preserving order.

  For the **Interval Scale**, the constraints are stricter. Admissible transformations are $w' = aw + b$. For the moral ranking to be invariant, the function $f$ must satisfy a specific functional equation. If $V(w) > V(v)$, then $V(aw+b) > V(av+b)$ for all $a>0, b$. It is a known mathematical result that very few functions satisfy this for summation aggregation. Specifically, if $f$ is non-linear (concave), the sum $\sum f(aw_i + b)$ will generally not preserve the ordering of $\sum f(w_i)$ as $b$ varies. 

  This mathematical fact is the crux of the first month's investigation. I will derive the conditions under which prioritarian aggregation is interval-invariant. The likely result is that standard concave prioritarianism is *not* interval-invariant. This implies that standard prioritarianism implicitly assumes a ratio scale (a fixed zero). If welfare is actually interval-scaled, standard prioritarianism is mathematically incoherent unless the zero point is fixed by normative fiat.

  I will construct three distinct models:
  1.  **Model R (Ratio):** Fixed zero, ratio transformations allowed.
  2.  **Model I (Interval):** Arbitrary zero, linear shifts allowed.
  3.  **Model B (Baseline-Fixed Interval):** Interval scale, but the zero point is fixed contextually (e.g., at a "neutral" life). This is a hybrid model that mimics ratio behavior within a specific context.

  The deliverable for Month 1 will be a set of formal definitions and lemmas establishing the invariance properties of each model. This provides the rigorous foundation for the philosophical argument. It moves the discussion from "what feels right" to "what is mathematically licensed."

  ### Month 2: Reconstructing the Leveling-Down Objection

  In the second month, I will reconstruct the Leveling-Down Objection within each of the three models developed in Month 1. The standard LDO scenario involves two populations. Population A has welfare levels $(10, 2)$. Population B has welfare levels $(6, 6)$. Total welfare in A is 12; in B is 12. If we level down to $(5, 5)$, total is 10. The objection says $(5, 5)$ is not better than $(10, 2)$.

  I will translate this scenario into the three models.
  In **Model R**, the numbers are absolute. $(10, 2)$ and $(5, 5)$ are well-defined. The LDO holds its standard form.
  In **Model I**, the numbers are relative. $(10, 2)$ could be transformed to $(100, 92)$ by shifting the zero. The operation "level down to 5" is ambiguous. Does it mean "reduce by 5 units" or "reduce to 50% of the range"? If it means "reduce by 5 units," this is an interval operation. If it means "reduce to 50%," it is a ratio operation and is ill-defined in Model I.

  I will track exactly which premises of the LDO depend on ratio-scale properties. For example, the premise "everyone is worse off" requires comparing $w_{new} < w_{old}$. This is ordinal and holds in all models. But the premise "the loss is significant" or "the level is low" often implies a distance from zero. If the zero is arbitrary, "low" is arbitrary. 

  I will also examine the "in some respect better" claim of egalitarianism. If equality is valuable, does that value depend on the absolute level? Some egalitarians argue equality is more valuable at higher levels. This interaction between level and value requires a ratio scale to be formulated precisely. On an interval scale, "higher level" is ambiguous without a fixed zero.

  The outcome of Month 2 will be a mapping of the LDO's logical structure against the measurement constraints. I expect to show that the standard formulation of the LDO is only well-defined in Model R. In Model I, the scenario description itself requires clarification. This suggests that the intuitive force of the LDO may rely on the reader unconsciously adopting Model R. If the reader is forced to adopt Model I, the intuition may weaken or shift.

  ## 5. Phase II: Functional Interactions (Month 3)

  The third month focuses on the priority weighting function $f(w)$. Prioritarianism is defined by the concavity of $f$. This concavity represents the diminishing moral value of welfare gains. However, as noted in Month 1, concavity is not invariant under interval transformations. A function can be concave in one interval representation and convex in another if the domain shifts across an inflection point.

  ### Month 3: Weighting Functions and Scale Interaction

  This month will examine whether altering the weighting function interacts with scale type to revive, suppress, or transform the LDO. I will test three classes of functions:
  1.  **Power Functions:** $f(w) = w^p$. Defined only for ratio scales (or interval scales with fixed zero).
  2.  **Logarithmic Functions:** $f(w) = \log(w)$. Requires ratio scale (positive $w$).
  3.  **Exponential/Linear Hybrids:** Functions designed to be invariant under interval shifts, such as $f(w) = -e^{-kw}$. This is the Constant Absolute Risk Aversion (CARA) form used in economics. It is invariant under additive shifts of wealth (interval-like).

  I will analyze how the LDO performs under the CARA form. If we use an interval-invariant function, does the LDO still arise? The CARA function implies that the moral value of a gain depends on the absolute size of the gain, not the relative position. This might change the leveling-down calculus. 

  Furthermore, I will investigate the "curvature" intuition. Philosophers often argue that we should prioritize the worse off because welfare has diminishing marginal moral value. This is a claim about the second derivative of $f$. But if $f$ changes curvature when we shift the zero, then the moral principle "prioritize the worse off" is scale-dependent. This is a profound result. It suggests that prioritarianism is not a stable moral theory unless the scale of welfare is fixed.

  I will also consider threshold-based weighting. If priority is given only below a certain threshold, where is that threshold set? On a ratio scale, it can be an absolute level. On an interval scale, it must be relative to the population mean or median. This shifts the theory from prioritarianism to a form of sufficiency or relativized egalitarianism. I will map how the LDO applies to these threshold variants.

  The goal of Month 3 is to determine if the LDO is robust to changes in the weighting function that respect interval scaling. If the LDO disappears when using interval-invariant functions, it confirms the hypothesis that the objection is an artifact of ratio-scale assumptions. If the LDO persists even with interval-invariant functions, it suggests the objection is deeper, perhaps rooted in ordinal comparisons of equality itself.

  ## 6. Phase III: Normative Defense (Month 4)

  Having established the formal behavior of the LDO under different scales, Month 4 shifts to normative defense. The mathematical results must be connected to our intuitive judgments about welfare. Why should we prefer an interval-scale model over a ratio-scale model?

  ### Month 4: Defending the Interval-Scale Model

  This month will argue that an interval-scale model with a context-dependent baseline best fits our intuitive judgments about welfare improvements. The argument will proceed on two fronts: phenomenological and practical.

  **Phenomenological:** Do we experience welfare as having an absolute zero? When we say a life is "worth living," do we mean it is above a natural zero, or above a socially constructed baseline? In physics, temperature has an absolute zero (Kelvin) because there is a state of no thermal energy. Does welfare have a state of "no welfare"? Death is often cited, but death is the absence of a subject, not a welfare level of zero for a subject. A state of neutral experience might be proposed, but is it truly invariant across individuals? Interpersonal comparisons of welfare are already difficult; assuming a shared absolute zero compounds the difficulty. An interval scale requires only that we can compare differences (e.g., "the gain from 2 to 4 is equal to the gain from 6 to 8"). This is a weaker, more defensible assumption.

  **Practical:** Policy decisions often rely on interval data. We measure changes in GDP, health outcomes, or self-reported happiness on scales that lack true zeros. If prioritarianism requires ratio data to avoid the LDO, it may be inapplicable to real-world policy. An interval-compatible prioritarianism is more robust for application.

  I will derive the precise conditions under which leveling-down still appears counterintuitive in the interval model. It may be that leveling down is only counterintuitive when it crosses a specific baseline (e.g., subsistence). If so, the LDO is not about equality but about sufficiency. I will formalize this "Baseline-Relative LDO."

  The defense will also address the objection that interval scales are too weak to support aggregation. I will show that aggregation is possible with interval scales if the weighting function is chosen correctly (e.g., the CARA form). Thus, we do not lose the ability to do moral mathematics by adopting the interval view; we simply change the equations.

  The outcome of Month 4 will be a defended position that the interval ontology is superior. This provides the normative grounding for the formal results of Months 1-3. It moves the project from "mathematical curiosity" to "ethical recommendation."

  ## 7. Phase IV: Synthesis and Taxonomy (Month 5)

  Month 5 is the synthesis phase. The core argument of the final paper will be drafted here. The goal is to present a taxonomy showing that the Leveling-Down Objection has logically distinct forms under different measurement ontologies.

  ### Month 5: Drafting the Core Argument

  The taxonomy will likely distinguish three versions of the LDO:
  1.  **The Ratio-LDO:** Assumes absolute zero. Claims leveling down is bad because it reduces absolute welfare. This is the standard version. It is robust but relies on a strong ontological claim.
  2.  **The Interval-LDO:** Assumes arbitrary zero. Claims leveling down is bad because it reduces welfare relative to a baseline. This version is sensitive to baseline selection. If the baseline shifts, the judgment may flip.
  3.  **The Ordinal-LDO:** Assumes only rank. Claims leveling down is bad because it changes the distribution shape. This version is weak and often collapses into the Ratio-LDO when pressed for justification.

  I will argue that the Ratio-LDO is the one that carries the most intuitive force, but it is the least defensible ontologically. The Interval-LDO is more defensible but less intuitively forceful, as it admits that "better" is baseline-relative. 

  The core argument will be that the LDO is not a single objection but a conflation of these forms. Critics of prioritarianism use the intuitive force of the Ratio-LDO to attack theories that might be consistent with the Interval-LDO. By disentangling them, we can see that prioritarianism can survive the LDO if it explicitly adopts an interval ontology and fixes the baseline normatively rather than metaphysically.

  I will also address the failure condition: that the scale distinction is purely notational. I will demonstrate that it is *not* notational by showing cases where the moral ranking flips under interval transformations in standard models. This proves that the scale choice has normative consequences. If the scale choice changes the verdict on the LDO, it is not merely notational.

  The draft will be structured to lead the reader from the formal setup to the normative implication. It will avoid jargon where possible, translating the measurement theory into ethical terms. The aim is to make the argument accessible to philosophers who may not be familiar with Stevens' scales, while maintaining the rigor required to satisfy the physicist's lens.

  ## 8. Phase V: Dissemination and Evaluation (Month 6)

  The final month is dedicated to refining the paper for an interdisciplinary audience and designing the workshop presentation. The goal is to test whether philosophers find the framing clarifying.

  ### Month 6: Refinement and Workshop Design

  **Paper Refinement:** The 6,000-word paper will be polished to ensure clarity. The formal sections will be checked for accessibility. The argument will be tightened to ensure the link between measurement theory and the LDO is explicit. I will ensure that no citations are included, as per the constraint, relying on conceptual descriptions of standard views. The tone will be confident but open to critique, acknowledging that this is a novel approach.

  **Workshop Presentation:** The presentation will be designed to engage philosophers in the measurement problem. It will not simply present the results but will invite the audience to participate in the scaling exercise. For example, I will present a welfare scenario and ask the audience to identify the zero point. When they disagree, I will use that disagreement to motivate the interval model. The presentation will include visual aids showing how the priority curve shifts under interval transformations.

  The workshop will serve as a validation step. If philosophers reject the measurement distinction as irrelevant, the project may have failed to gain traction. If they find it clarifying, it validates the hypothesis that the LDO discourse has been hampered by implicit measurement assumptions. I will prepare a set of discussion questions to probe their intuitions about scale invariance.

  ## 9. Risk Assessment and Failure Conditions

  A critical component of this proposal is the explicit acknowledgment of failure conditions. The project fails if the scale-distinction proves purely notational. That is, if all three regimes (Ordinal, Interval, Ratio) yield identical normative conclusions about the leveling-down case, then importing measurement theory adds no analytical purchase beyond what standard ethical argument already provides.

  To mitigate this risk, Month 1 and Month 2 are designed to be "falsification" phases. I will actively look for cases where the models diverge. If they do not diverge, the paper will report this negative result. A negative result is still valuable: it would show that the LDO is robust across measurement ontologies, strengthening the objection against prioritarianism. However, the hypothesis is that they *will* diverge.

  Another risk is that the interval-scale model is rejected as philosophically implausible. If welfare is inherently ratio-scaled (e.g., if there is a natural zero of suffering), then the Interval-LDO is a straw man. To mitigate this, Month 4 includes a robust defense of the interval ontology, drawing on the phenomenology of well-being and the difficulties of interpersonal comparison.

  A third risk is that the mathematical formalism obscures the ethical point. Philosophers may reject the argument as "technical" rather than "normative." To mitigate this, the writing in Months 5 and 6 will focus on translating the math back into ethical language. The claim is not that math solves ethics, but that math clarifies the premises of ethical arguments.

  Finally, there is the risk of scope creep. The measurement theory of welfare is a vast field. This project must remain focused on the LDO. I will resist the temptation to solve the general problem of interpersonal comparison. The scope is limited to the specific interaction between measurement scales and the leveling-down scenario.

  ## 10. Detailed Methodological Elaboration

  To ensure the six-month plan is actionable, I will elaborate here on the specific conceptual moves required in each phase. This section serves as a guide for the actual execution of the research.

  ### On Formalization (Months 1-2)
  The key technical challenge is defining the "Leveling Down" operation without ratio properties. In a ratio scale, leveling down from $w$ to $kw$ (where $k < 1$) is clear. In an interval scale, we cannot multiply. We can only subtract. So leveling down must be defined as $w' = w - d$. 
  However, the LDO usually implies a reduction to a state of equality. So we move from $(w_1, w_2)$ to $(w', w')$. In a ratio scale, we might choose $w'$ such that $\sum w' < \sum w$. In an interval scale, we must ensure the operation is admissible. 
  I will define the **Leveling Operator** $L$ for each scale.
  For Ratio: $L_R(w) = k \cdot \text{mean}(w)$.
  For Interval: $L_I(w) = \text{mean}(w) - \delta$.
  The objection then compares $V(w)$ vs $V(L(w))$.
  I will check if $V(w) > V(L(w))$ holds for all admissible transformations of $w$. If it holds for Ratio but not Interval, the objection is scale-sensitive.

  ### On Weighting Functions (Month 3)
  The choice of $f(w)$ is critical. The standard $w^p$ is not interval-invariant. The function $f(w) = -e^{-aw}$ is interval-invariant (up to affine transformation of value). 
  I will derive the **Prioritarian Index** for both functions. 
  For $w^p$, the priority weight is $p w^{p-1}$. This depends on the level $w$.
  For $-e^{-aw}$, the priority weight is $a e^{-aw}$. This also depends on the level $w$.
  Wait, if $w$ shifts by $b$, $e^{-a(w+b)} = e^{-ab} e^{-aw}$. The weight scales by a constant factor. The *relative* weights remain the same. This is the key. The exponential function preserves relative priority under interval shifts. The power function does not. 
  This suggests that **Exponential Prioritarianism** is the correct interval-scale theory. I will test the LDO against Exponential Prioritarianism. Does the LDO stick? 
  If $V = \sum -e^{-aw_i}$, and we level down, does $V$ decrease? Yes, because the exponential is monotonic. But the *reason* it decreases might differ. The LDO claims it is not better *in any respect*. Prioritarianism says it is worse in terms of total priority-weighted welfare. The objection is usually aimed at Egalitarianism (which might say it is better in terms of equality). Prioritarianism usually escapes the LDO. 
  Wait, I must clarify the target. The LDO is primarily an objection to **Telic Egalitarianism**. Prioritarianism is often proposed as a way to *avoid* the LDO. 
  However, the prompt asks about the LDO *to Prioritarianism*. This implies there is a version of the LDO that targets Prioritarianism. This usually arises if the priority weighting is so strong that it favors equality even at a cost to total welfare, effectively mimicking egalitarianism. 
  So the question is: Does the measurement scale affect whether Prioritarianism mimics Egalitarianism enough to trigger the LDO? 
  If the scale is interval, and we use an invariant function, does the theory become more or less egalitarian? 
  This is a subtle point I must explore in Month 3. If the interval model makes prioritarianism less sensitive to absolute levels, it might be less likely to favor leveling down. This would support the hypothesis that the LDO is an artifact of the ratio-scale sensitivity.

  ### On Baseline Selection (Month 4)
  If we adopt the interval model, we must choose a baseline $b$ for the transformation $w' = w - b$. This baseline is normative. Choosing $b$ is equivalent to choosing a zero point. 
  I will argue that this choice should be based on a **Sufficiency Threshold**. Welfare below the threshold is weighted more heavily. This combines prioritarianism with sufficientarianism. 
  The LDO against this hybrid view would claim that leveling down below the threshold is bad. But if the threshold is interval-relative, the objection loses its absolute force. 
  This relocates the debate from "Is equality valuable?" to "Where should the baseline be set?" This is a more tractable normative question.

  ## 11. Anticipated Contributions to Philosophy

  This project aims to contribute to three areas of philosophical inquiry:

  1.  **Distributive Justice:** By showing that the LDO is scale-sensitive, it offers prioritarianism a new defense. It need not deny the intuition of the LDO but can contextualize it as a ratio-scale intuition that does not apply to interval-scaled welfare.
  2.  **Measurement Theory in Ethics:** It brings rigorous measurement theory into the mainstream of normative ethics. It challenges ethicists to specify the scale of their variables, much as economists have done with utility.
  3.  **Interdisciplinary Methodology:** It demonstrates the value of a physicist's lens in philosophy. The focus on invariance and operational definitions can clarify debates that have stalled due to conceptual ambiguity.

  The paper will not claim to solve the problem of distributive justice. It claims to dissolve a specific obstacle (the LDO) by revealing its mathematical preconditions. This is a modest but significant contribution.

  ## 12. Conclusion: The Viability of the Measurement Lens

  The six-month plan outlined here is realistic for a single researcher with a background in formal methods. It requires no data collection, only careful conceptual modeling. The timeline allows for depth in each phase, ensuring that the formal work is robust and the normative defense is persuasive.

  The central insight—that the Leveling-Down Objection may be an artifact of unstated measurement assumptions—is novel and high-risk. If successful, it changes the landscape of the debate. If it fails, it establishes the robustness of the LDO across measurement ontologies, which is also a valuable result.

  The physicist's training in distinguishing nominal, ordinal, interval, and ratio measurements provides a unique advantage. Philosophers often treat numbers in ethical formulas as transparent carriers of value. This project treats them as operational constructs that license specific manipulations. By holding the mathematics to the standard of measurement theory, we can separate genuine normative disagreements from pseudoproblems generated by scale mismatches.

  This research plan provides the roadmap for that separation. It moves from formalization to reconstruction, to functional analysis, to normative defense, and finally to synthesis. The result will be a taxonomy of the LDO and a defended position on the measurement ontology of welfare. This will equip the researcher to produce a 6,000-word paper that is both technically rigorous and philosophically significant, and a workshop presentation that challenges the audience to rethink the foundations of their moral mathematics.

  The project is ready to commence. The first step is the formal definition of the aggregation function under interval transformations. The rest of the plan follows logically from that foundation. The potential payoff—a clarification of one of the most stubborn objections in distributive justice—justifies the investment of time and intellectual effort. The measurement lens is not merely a metaphor; it is a tool for conceptual precision. In the hands of a researcher trained to respect the limits of measurement, it promises to cut through the ambiguity that has long surrounded the Leveling-Down Objection.

