  2.  **The Ontology of Welfare (1000 words):** Interval vs. Ratio Scales in Moral Theory.
  3.  **Formalizing Aggregation (1250 words):** Invariance Conditions and the Prioritarian Function.
  4.  **Reconstructing the Objection (1250 words):** The LDO under Three Measurement Regimes.
  5.  **The Weighting Function (1000 words):** Concavity, Curvature, and Scale Dependence.
  6.  **Defending the Interval Model (1000 words):** Baselines, Sufficiency, and Normative Fit.
  7.  **Conclusion (750 words):** Taxonomy of the LDO and Future Directions.

  This structure ensures balanced coverage of the formal and normative aspects. It aligns with the monthly plan, with each section corresponding to the output of specific months. The word count allocation prioritizes the formal and reconstructive phases, as these are the novel contributions of the project.

  The workshop presentation will mirror this structure but will be interactive. It will begin with a poll on the LDO intuition, introduce the measurement distinction, show the mathematical divergence, and conclude with the normative implications. This ensures the research is not just written but tested against the philosophical community.

  In summary, this proposal outlines a rigorous, feasible, and potentially transformative investigation into the foundations of prioritarianism. It leverages the researcher's unique background to address a persistent problem in normative ethics. The plan is sound, the hypothesis is clear, and the success criteria are well-defined. The project is poised to make a significant contribution to the field.

  ## 14. Final Reflections on the Methodology

  It is worth emphasizing why this methodology is distinct from standard philosophical analysis. Standard analysis often relies on "reflective equilibrium," matching principles to intuitions. This project adds a constraint: **formal coherence**. A principle that yields different verdicts under admissible transformations of its variables is formally incoherent. By imposing this constraint, we filter out theories that are mathematically unstable.

  This does not replace normative judgment. It informs it. If a theory is only stable on a ratio scale, we must ask: "Is welfare really ratio-scaled?" If the answer is no, the theory must be revised. This is the core of the physicist's lens. It treats ethical theories as models of reality, subject to the same consistency checks as physical models.

  This approach may be controversial. Some philosophers may argue that ethics is not subject to measurement theory in the same way as physics. This project anticipates that objection and addresses it in Month 4. The argument is that whenever we use numbers to represent welfare, we invoke measurement theory. We cannot escape it. We can only choose to be explicit about it or implicit. This project chooses explicitness.

  The six-month timeline is tight but sufficient. The conceptual work is dense, but the scope is narrow (focused on the LDO). This focus prevents the project from becoming unmanageable. The researcher will not solve the problem of well-being measurement generally, but only as it pertains to the LDO. This strategic limitation is key to success.

  With this plan in place, the research can proceed with clarity and purpose. The path from formalization to taxonomy is mapped. The risks are identified. The deliverables are defined. The project is ready to begin.

  ## 15. Closing Statement

  The intersection of measurement theory and normative ethics is underexplored. This project seeks to illuminate that intersection. By applying the rigorous standards of experimental physics to the Leveling-Down Objection, we can determine whether the objection is a deep moral truth or a mathematical mirage. The answer will refine our understanding of prioritarianism and the nature of welfare itself. This proposal provides the blueprint for that discovery. It is a plan for clarity in a field often clouded by ambiguity. It is a plan for rigor in a field often reliant on intuition. And it is a plan for progress in a debate that has remained static for too long. The next six months will determine if the measurement lens brings the picture into focus. The evidence suggests it will.

