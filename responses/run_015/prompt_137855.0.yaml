answer: |-
  Here is the diagnosis. The referee is right: your argument, as it stands, proves too much. If it succeeds, it destroys not just populist legitimacy but the possibility of individual agency and collective deliberation generally. You cannot accept the conclusion in (7) without accepting the skepticism in (8), and since (8) is untenable, something earlier in the chain must give.

  **The Break Point: Step (4)**

  You should reject or significantly modify step (4). This is the step that claims the only relation between individual attitudes and the people's will is mechanical aggregation of fixed preferences, and that procedural details are mere "accidents."

  **Why it looked innocent**
  Step (4) looks innocent because it appeals to a strong intuitive individualism. It feels democratic to say that the collective will is nothing over and above the sum of individual wants. It also feels honest to say that manipulating the agenda shouldn't change the outcome if there is a real "will" underneath. It treats the will of the people like a physical fact (like the average height of the population) that procedures merely measure. If the measurement changes based on the ruler you use, you assume the fact wasn't there to begin with.

  **The cost of rejecting it**
  If you reject (4), you lose the clean *reductio*. You can no longer claim that populist legitimacy is logically impossible or unsatisfiable in principle. Instead, you have to argue that populists are *empirically* wrong about how the will of the people is formed. You move from a claim of incoherence to a claim of misdescription. This is a softer target. It allows a populist to say, "We aren't aggregating fixed preferences; we are expressing a shared identity or common good that emerges through our movement." You can't use Arrow's theorem to shut that down immediately.

  **Why the Referee is Right about (8)**
  The referee's move works because individual agency tolerates the very inconsistencies your argument forbids. Psychologically, individual preferences are context-dependent. I might choose A over B in one framing and B over A in another without ceasing to be a rational agent. We don't say I have "no will"; we say my will is complex, or that I need deliberation to settle it. We accept that procedure (thinking it through, sleeping on it, discussing with a friend) helps *form* the will, not just record it. If individual agency survives context-dependence and cycling, collective agency can too, provided you don't insist on the rigid model in (4).

  **Evaluating the Repairs**

  Here is how the standard repairs price out, given you want to keep the legitimacy intuition (1) and the social choice math (5) but avoid the skepticism (8).

  1.  **Restricting the Domain:** You could argue that real-world political preferences are usually well-behaved (single-peaked) enough to avoid cycles.
      *   *Price:* This is empirically fragile. On highly polarized, multidimensional populist issues (immigration, trade, sovereignty), preferences often cycle. It saves the theory only in calm times, which is when populism isn't rising anyway. It doesn't solve the conceptual problem the referee raised.

  2.  **Moving from Preferences to Reasons:** You could argue that the "will" is based on public reasons, not raw preferences.
      *   *Price:* This helps distinguish legitimate will-formation from mere aggregation, but it doesn't escape the impossibility results entirely. Groups can cycle on reasons just as they do on preferences. It also risks making the account too elitist, requiring everyone to argue like a philosopher, which might violate your intuition in (1) about the governed.

  3.  **Higher-Order Attitudes:** You could say the real will is what people would want after reflection (metapreferences).
      *   *Price:* As you noted in your "robust-will" repair, this often comes out empty on cyclic profiles. It also pushes the problem back: do *those* higher-order attitudes cycle? Often, yes. It adds complexity without guaranteeing stability.

  4.  **Constructivism (The Best Bet):** You say the will of the people is not a pre-existing fact to be discovered, but something constructed by legitimate procedure.
      *   *Price:* This saves agency (individual and collective) by admitting that wills are made, not found. However, it concedes the populist claim in (1) if (1) is read as requiring a pre-existing will. But you can tweak (1). Legitimacy isn't about matching a pre-existing vector; it's about engaging in a procedure that the governed accept as authoritative.
      *   *Strategic Advantage:* This lets you keep your critique. You can argue populism is illegitimate not because "the people's will" is a myth, but because populists claim to *channel* a pre-existing will while bypassing the constructive procedures (debate, compromise, agenda-setting) that actually create it. They treat the will as a discovery (Step 4) when it is actually a construction. This makes populism a kind of fraud, rather than a logical impossibility.

  **Recommendation**

  Keep (1) but reinterpret it. Legitimacy requires answerability to the governed, but not via a mystical connection to a pre-existing aggregate will. Reject (4) explicitly. Argue that the "will of the people" is an achievement of political process, not an input to it.

  This handles the referee's objection because it aligns collective will-formation with individual agency: both involve constructing a stable intent out of messy, context-dependent attitudes through a process (deliberation for the individual, democratic procedure for the collective).

  Your paper's thesis should shift slightly. Don't argue that populism is incoherent because the will doesn't exist. Argue that populism is dangerous or illegitimate because it *misrepresents* the will as a static fact that the leader alone can read, thereby bypassing the very procedures that make a collective will possible. This preserves the critical bite without forcing you to defend the claim that agency itself is an illusion. You keep the math in (5) as evidence that aggregation is hard, not as proof that it is impossible. The impossibility result becomes a warning against skipping the work of construction, not a proof that the work is futile.
