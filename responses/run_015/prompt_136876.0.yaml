      *   **Friend's Uniqueness Point:** This is crucial. If the decomposition is arbitrary, the features are just a coordinate system choice. However, SAEs rely on *sparsity* as a natural prior. If sparsity picks out a stable basis across seeds/models, that argues for privilege. This is the current battleground (e.g., transcoder stability, cross-model feature matching).
      *   **Conclusion Survival:** If we fix the "grandmother cell" error and temper the "refuted" claim, the core argument (Linear Representation Hypothesis + Superposition + SAEs + Causal Testing) remains a strong case for *pragmatic* realism, even if metaphysical realism is still debated.

