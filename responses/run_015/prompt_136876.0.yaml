      *   *Claim:* "Because a network has far fewer dimensions than it has things to keep track of, it packs features in at slight angles to each other, which is what people call superposition..."
          *   *Verdict:* **Accurate.** This is the core argument for superposition (Elhage et al., 2022 "Toy Models of Superposition").
      *   *Claim:* "...that's why single neurons often look like they respond to a random grab bag of unrelated stuff, and that's why the field had to build sparse autoencoders to unpack them into clean one-concept-per-unit features."
          *   *Verdict:* **Accurate.** This describes the motivation for SAEs (Sparse Autoencoders).
      *   *Claim:* "And the unpacking clearly works: when you amplify one of those recovered features the model starts talking about exactly that thing..."
