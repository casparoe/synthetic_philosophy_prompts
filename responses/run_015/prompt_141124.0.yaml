  Here is the design for your session. It is built to let the data speak first, forcing the metaphysical questions to emerge from the frustration of the game rather than a preamble.

  ### The Activity: "The Signal and the Smear"

  **Concept**
  You are running a prediction tournament. Three teams act as "analysts" trying to predict how specific individuals answered a survey. The catch is that each team is forced to use a different "lens" to group the people. The dataset is small (36 people), which is scientifically dubious but necessary for a 90-minute manual game. This small size is a feature, not a bug: it allows random noise to look like signal, which is exactly the point you want to make about generational labeling.

  **The Setup**
  You enter the room with no theory. You tell them they are data scientists for the day. You divide the room into three teams of 3–5 people. You hand each team a "Partition Card" that tells them how they are allowed to categorize people. You hand everyone the "Training Deck" (24 survey responses). Their job is to find the pattern in the Training Deck using *only* their allowed categories, and then use that pattern to predict the answers for the "Test Deck" (12 survey responses).

  **The Teams**
  1.  **Team Wall (The Generations):** They must group people by standard labels (Boomer, Gen X, Millennial, Gen Z). They cannot look at exact age, only the label. This represents the "Hard Boundary" view.
  2.  **Team Window (The Age Bands):** They must group people by current age (e.g., 20–35, 36–50, 51+). They cannot use generation labels. This represents the "Continuous Smear" view (binned for gameplay).
  3.  **Team Noise (The Arbitrary Cut):** They must group people by the last digit of their birth year (0–4 vs. 5–9). This represents a "Gerrymandered" view with no causal story.

  **The Twist**
  You have engineered the 36-person dataset so that:
  *   **Question 1** is strongly correlated with Age (Team Window should win).
  *   **Question 2** is correlated with Generation/Cohort (Team Wall should win).
  *   **Question 3** is rigged. In this specific small sample, the answers align perfectly with the Last Digit of the birth year, cutting across age and generation. Team Noise will get a perfect score on this question.

  **The Reveal**
  When Team Noise realizes they won a round using a "nonsense" rule, the room will feel a sense of cheating or glitch. That discomfort is the philosophy. It demonstrates *overfitting*: if you slice the data enough ways, you find patterns that aren't real. It also demonstrates the *identifiability problem*: since Age, Period, and Cohort are locked together in a cross-sectional snapshot, Team Wall and Team Window will often predict the same thing, making it impossible to tell which "story" is true without outside assumptions.

  **The Debrief**
  Only after the scoring do you bring out the whiteboard. You draw the triangle of Age, Period, and Cohort. You ask them why Team Noise won. You ask if "Millennial" is more real than "Born in a year ending in 3." You introduce the terms "Natural Kind" and "Social Kind" here, mapping their frustration during the game to the philosophical concepts.

  ***

