  | phase | minutes | what participants do | what the facilitator does and specifically does not say | which part of the metaphysics this moment is meant to surface | most likely way it goes wrong and the fix |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Intro & Deal** | 10 | Arrive, get coffee, sit in 3 pre-assigned teams. Receive "Partition Cards" and "Training Deck" (24 cards). | **Do:** Explain rules simply: "Find the pattern in your deck using your rule. Predict the Test Deck." <br>**Do Not:** Explain *why* the rules are different. Do not mention generations or philosophy yet. | The constraint of the "lens." Participants feel the limitation of their categories immediately. | **Wrong:** People try to swap cards or mix rules.<br>**Fix:** "Stay in your lane. The client (me) only accepts reports in your format." |
  | **Strategy** | 15 | Teams huddle. They sort the 24 Training cards into their allowed groups. They look for correlations between groups and the Yes/No answers. | **Do:** Circulate. Answer rule clarifications. Keep time. <br>**Do Not:** Hint at which questions are rigged. Do not validate their theories. | Inductive reasoning. They are building a model based on limited data. | **Wrong:** A team finishes too fast and gets bored.<br>**Fix:** Have a "tie-breaker" question ready on the whiteboard for early finishers. |
  | **Prediction** | 15 | Teams receive the "Test Deck" (12 cards, answers hidden). They write down their predicted Yes/No for each person on a scorecard. | **Do:** Collect the Training Deck so they can't cheat. Hand out Test Deck. <br>**Do Not:** Comment on their confidence levels. | The risk of generalization. Applying a model to new data. | **Wrong:** Teams try to guess individual people rather than using their group average.<br>**Fix:** Remind them: "Predict based on your group rule, not gut feeling." |
  | **Scoring** | 15 | Facilitator reveals the actual answers. Teams tally points. Winner is announced. | **Do:** Reveal answers dramatically. Highlight that Team Noise won Question 3. <br>**Do Not:** Explain *why* Team Noise won yet. Let the confusion sit. | The shock of spurious correlation. Predictive success $\neq$ Ontological truth. | **Wrong:** Team Noise feels accused of cheating.<br>**Fix:** "The data is the data. You played by the rules. That's the puzzle." |
  | **Debrief** | 30 | Open discussion. Facilitator draws APC triangle on whiteboard. Groups discuss the "Window vs. Wall" distinction. | **Do:** Introduce terms "Natural Kind," "Social Kind," "Identifiability." Map game moments to these concepts. <br>**Do Not:** Dictate the answer. Admit you don't know if generations are real. | The core philosophy. Distinguishing useful fictions from causal realities. | **Wrong:** One dominant voice monologues.<br>**Fix:** Use the "talking chip" method or direct questions to specific teams. |
  | **Wrap** | 5 | Clean up. Next month's topic announced. | **Do:** Thank them. Remind them of the hard stop. <br>**Do Not:** Start a new argument. | Closure. | **Wrong:** Librarian flips lights while you're talking.<br>**Fix:** Keep the final thought to one sentence. |

