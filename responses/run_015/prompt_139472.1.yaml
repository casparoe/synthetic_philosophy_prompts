      *   *Level 3 (Epistemology):* The "Uncertainty Problem." This makes the debate undecidable by standard historical methods.
      *   *Synthesis:* The real blocker is the refusal to admit that "Violence Decline" is not a single empirical claim but a *theory-laden composite*.

  5.  **Determine "What Counts as Progress":**
