prompt: |-
  had a long argument with my friend last night about inside view vs outside view and I think I lost more of it then I'd like, so I want to know how exposed my position actually is. Here's the version I'd defend: whenever a case has a usable reference class, the outside view gets default authority, and the inside view earns weight *only* as evidence about which reference class you're in -- and even there it gets a small weight, because my sense that my case is special is exactly the sort of judgment I'm supposed to be modest about. I've been calling the cost of slicing the class finer and finer the "gerrymander tax": every time you narrow, you pay in sample size and in how much the surviving cases really resemble yours, and I claim the tax is real but bounded.

  What would count against it? I want defeaters ranked from fatal to merely awkward, and I want you to separate the ones a defender of my view should honestly concede from the ones only a critic would throw. The three that got to me: (1) my friend said reference classes aren't found, they're built -- you can widen or narrow until you like the base rate -- and if modesty applies to my inside view it should apply to my sense of which class is the right one too, which either puts me in a regress or smuggles the inside view back in at the level of class choice; is there a non-arbitrary stopping point, and should the choice of class itself be governed by an outside view? (2) does consistent modesty eat itself -- if I discount my own reasoning about the details across the board, do I lose the ability to ever act on the details, and is that a reductio or a feature? (3) what empirical findings would actually move me, and are any of them arguably already in? I'd also like you to say whether my "usable reference class" escape hatch has qualified the whole thing into unfalsifiability, and if so whether that's damning for a view of this kind. The one that stuck with me is the thought that the outside view can't get off the ground without some inside-view judgment doing load-bearing work -- start there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** Outside View (OV) has default authority when a usable reference class exists. Inside View (IV) earns weight *only* as evidence about which reference class applies. Even then, IV gets small weight due to modesty (bias towards uniqueness).
      *   **Key Concept:** "Gerrymander Tax" – narrowing reference classes costs sample size and resemblance; this tax is real but bounded.
      *   **Goal:** Assess exposure of this position. Identify defeaters (ranked fatal to awkward), distinguish concessions vs. criticisms, address specific objections (reference class construction, self-defeating modesty, empirical findings), and evaluate the "usable reference class" escape hatch regarding falsifiability.
      *   **Specific Focus:** Start with the idea that OV needs IV to get off the ground.

  2.  **Deconstruct the Three Specific Objections:**
      *   *(1) Reference Class Construction:* Classes aren't found, they're built. Modesty should apply to class selection too. Risk of regress or smuggling IV back in. Is there a non-arbitrary stopping point?
      *   *(2) Self-Defeating Modesty:* If I discount my reasoning about details, can I act? Is this a reductio or a feature?
      *   *(3) Empirical Findings:* What would move the user? Are findings already in?
      *   *(4) Falsifiability:* Does "usable reference class" make the view unfalsifiable?

  3.  **Brainstorming Defeaters (Ranking & Categorization):**

      *   *Fatal:*
          *   **The Reference Class Problem (Tetlock/Kahneman):** If there is no algorithmically correct way to choose the reference class, the OV is indeterminate. If IV chooses the class, IV is doing the heavy lifting, undermining the "OV default authority" claim.
          *   **The "Zero Weight" Problem:** If IV gets near-zero weight on "specialness," you ignore genuine structural differences. (e.g., I am a trained surgeon vs. a random person attempting surgery).
          *   **Self-Undermining:** If the argument for OV relies on IV reasoning (philosophical argumentation), it performatively contradicts itself.

      *   *Serious/Heavy:*
          *   **Gerrymander Tax Miscalibration:** The tax might not be bounded; it might be exponential. Narrowing slightly might destroy statistical power entirely.
          *   **Dynamic Environments:** In rapidly changing contexts (tech, markets), past reference classes are actively misleading. OV becomes an anchor to the past.

      *   *Awkward/Concession:*
          *   **Hybrid Necessity:** Admitting that in practice, high-stakes decisions *require* a weighted blend, not a lexical priority (OV first, then IV).
          *   **Definition of "Usable":** Admitting "usable" is doing a lot of work and is subjective.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the position (it's a strong Bayesian prior stance) but validate the friend's concerns.
      *   **The Foundational Objection (OV needs IV):** Address the user's specific request to start here. This is the "Reference Class Problem."
      *   **Ranked Defeaters:**
          *   *Fatal:* The Indeterminacy of Reference Classes. (If class choice is IV, OV isn't king).
          *   *Fatal:* The Performative Contradiction. (Using IV to argue for OV).
          *   *Heavy:* The "Exceptional Agent" Problem. (Skill/Agency *is* the inside view).
          *   *Awkward:* The "Usable" Escape Hatch. (Falsifiability concern).
      *   **Addressing the Three Specific Objections:**
          *   *(1) Class Construction:* Concede there is no non-arbitrary stopping point *algorithmically*. It requires judgment (IV). Modesty *should* apply, but not to zero.
          *   *(2) Self-Defeating Modesty:* It's a feature if it prevents overconfidence, but a bug if it causes paralysis. The solution is "modesty about the *weight*, not the *input*."
          *   *(3) Empirical Findings:* Look at Superforecasting (Tetlock). They use both. Base rates are starting points, not ceilings.
      *   **Falsifiability Check:** Does "usable reference class" save the theory? It risks being a "No True Scotsman." If every failure is blamed on "bad reference class," it's unfalsifiable.
      *   **Conclusion/Verdict:** How exposed is the position?

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "you're wrong." I need to analyze *exposure*. The user wants to know how defensible their specific formulation is.
      *   *Nuance:* The user says IV earns weight *only* as evidence about which reference class. This is the weak point. IV often provides evidence about the *outcome* within the class (e.g., my specific plan is better than the average plan in the class). I need to highlight this distinction.
      *   *Tone:* Intellectual, rigorous, slightly dialectical (matching the user's style).

  6.  **Final Polish:** Check against the prompt requirements.
