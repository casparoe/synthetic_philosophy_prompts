      2.  **Moral Direction:** We should adapt conditions to the animal, not animal to conditions. This is "moral disengagement."
      3.  **Sedation:** Yes, it's the same logic. Permanent genetic sedation.
      4.  **Philosophy:** Even if pain's "badness" is partly affective, the *consequences* of ignoring pain are bad.

      *Combining and tightening:*
      The proposal is ethically indefensible because it conflates the absence of subjective distress with genuine well-being, effectively sacrificing the animal's bodily integrity to preserve human practices rather than reducing harm.

      Your colleagues are relying on a narrow hedonistic view of welfare that equates "feeling bad" with "harm," but modern welfare science defines well-being holistically to include physical health and natural functioning, not just emotional state. When an animal with pain asymbolia injures itself because it lacks the motivation to avoid damage, that injury is a direct welfare failure, not a separate "management problem," because the animal is no longer able to maintain its own physical soundness. Dismissing this as management shifts the burden of welfare entirely onto the victim, requiring the animal to adapt to abusive conditions rather than requiring humans to adapt conditions to the animal, which is a form of moral disengagement that undermines the core purpose of welfare advocacy.

