answer: |-
  ### Specification for an Institutional Epistemology of Moral Testimony

  You are asking for a functional specification, not a metaphysical treatise. The goal is to provide a decision procedure for bodies that must act under uncertainty. Standard epistemology asks whether a subject is justified in believing a proposition. Institutional epistemology asks whether a collective agent is licensed to treat a testimony-based judgment as a sufficient reason for policy, funding, or regulation.

  The following ten requirements constitute the adequacy conditions for such an account. Each is marked by its status: **Non-negotiable** (the account fails without it), **Negotiable** (desirable but adaptable), or **Camp Preference** (reflects a specific theoretical commitment).

  #### 1. The Layered Deference Requirement
  *   **Case:** Layered deference (empirical fact → normative weight → all-things-considered verdict).
  *   **Specification:** The account must distinguish between deference on non-moral facts (e.g., "this causes suffocation"), deference on normative principles (e.g., "suffocation is bad"), and deference on verdicts (e.g., "do not buy"). It must specify which layer carries the epistemic risk.
  *   **Object of Assessment:** Belief and Reason-Weight.
  *   **Status:** **Non-negotiable.** An institutional body cannot function if it treats empirical expertise and moral expertise as identical.
  *   **Rationale:** Institutions routinely accept empirical testimony without controversy. The friction arises at the normative layer. An account that lumps them together cannot guide a committee on where to draw the line of their own responsibility.

  #### 2. The Concept Transmission Requirement
  *   **Case:** Novel moral kinds (insects, AI, collectives).
  *   **Specification:** The account must state whether testimony can transmit the *concept* required to grasp the moral status, or only the *verdict* using existing concepts. It must determine if a body can recognize a new moral patient solely on the say-so of experts.
  *   **Object of Assessment:** Understanding and Conceptual Competence.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** Legislatures often regulate entities (e.g., ecosystems, algorithms) they do not fully comprehend. If moral concepts cannot be transmitted via testimony, institutions are paralyzed when facing novel ontological categories.

  #### 3. The Performative Validity Requirement
  *   **Case:** Constitutive deference (recognizing harm/wronging).
  *   **Specification:** The account must distinguish between *constative* testimony (reporting a fact) and *performative* testimony (where the act of telling/accepting constitutes the moral reality, e.g., forgiveness or recognition of status).
  *   **Object of Assessment:** Moral Fact-Status.
  *   **Status:** **Negotiable.**
  *   **Rationale:** While metaphysically significant, an institution can often bracket whether the harm existed *before* the testimony or was *created* by it, provided the policy response is the same. However, a robust account should track this distinction to avoid category errors.

  #### 4. The Diachronic Baseline Requirement
  *   **Case:** Diachronic deference (trusting past/future self).
  *   **Specification:** The account must clarify if self-trust over time is the baseline for other-trust. If deferring to a future self is rational, deferring to an epistemic peer should be equally rational, absent specific moral objections.
  *   **Object of Assessment:** Rational Consistency.
  *   **Status:** **Camp Preference (Internalist/Individualist).**
  *   **Rationale:** This tests the symmetry of the view. However, institutions are often distinct from the individuals composing them, so strict diachronic identity may not map perfectly onto institutional memory.

  #### 5. The Comprehension-Stakes Threshold
  *   **Case:** Deference at scale/low comprehension.
  *   **Specification:** The account must provide a function relating the deferrer's comprehension of the *reasons* to the permissible *stakes* of the action. It must explain why high stakes + low comprehension triggers epistemic alarm.
  *   **Object of Assessment:** Action Licensing.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** This is the core institutional problem. A funding panel cannot approve a high-risk intervention based on moral testimony they cannot parse. The account must define the "understanding floor" for high-stakes decisions.

  #### 6. The Credit Allocation Constraint
  *   **Case:** Credit and no double counting.
  *   **Specification:** The account must precisely state whether moral credit (praiseworthiness) attaches to the *outcome* (doing the right thing) or the *process* (grasping the reasons). It must resolve whether one can have epistemic justification via testimony but diminished moral credit.
  *   **Object of Assessment:** Moral Credit/Agency.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** Institutions care about legitimacy, not just correctness. If acting on testimony yields "hollow" moral credit, the institution may need to invest in internal deliberation rather than external reliance, even if the outcome is identical.

  #### 7. The Domain Discrimination Test
  *   **Case:** The discrimination test (vs. math, law, aesthetics).
  *   **Specification:** The account must identify a feature unique to moral testimony that warrants differential treatment, or explicitly deny such a feature exists. It cannot simply assert moral exceptionalism without a marker.
  *   **Object of Assessment:** Epistemic Classification.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** Without this, the account is ad hoc. If moral testimony is treated differently than legal testimony (which institutions rely on constantly), there must be a principled difference in the *type* of knowledge involved.

  #### 8. The Integration Velocity Requirement
  *   **Case:** Conversion speed (sudden reversal vs. gradual shift).
  *   **Specification:** The account must distinguish between *updating* (rational response to evidence) and *conversion* (potentially non-rational shift). It must indicate if rapid change via testimony signals epistemic failure or efficient information processing.
  *   **Object of Assessment:** Belief Stability/Agency.
  *   **Status:** **Negotiable.**
  *   **Rationale:** Institutions prefer stability, but sometimes rapid moral correction is necessary (e.g., human subjects research norms). The account should flag rapid shifts as requiring higher verification, not necessarily forbid them.

  #### 9. The Disagreement Resolution Protocol
  *   **Case:** Moral disagreement among testifiers.
  *   **Specification:** The account must reduce to a general epistemology of peer disagreement or specify what makes moral disagreement intractable compared to scientific disagreement. It must offer a rule for action when experts disagree.
  *   **Object of Assessment:** Action Licensing under Uncertainty.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** Institutions rarely face unanimous expert moral testimony. An account that works only under consensus is useless.

  #### 10. The Collective Testifier Requirement
  *   **Case:** Deference to groups/institutions (Further Constraints).
  *   **Specification:** The account must handle testimony from collective bodies (e.g., "The Bioethics Commission recommends..."). It must specify if the collective nature adds or subtracts epistemic weight compared to an individual expert.
  *   **Object of Assessment:** Source Reliability.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** Your end-user is an institution deferring to other institutions. Individual-centric epistemology fails here.

  ***

  ### Analysis of Tensions and Prejudices

  **1. Incompatible Requirements**
  There is a significant tension between **Requirement 6 (Credit Allocation)** and **Requirement 5 (Comprehension-Stakes Threshold)**.
  *   *The Conflict:* To satisfy the Comprehension-Stakes Threshold for high-stakes institutional action, the body often *must* defer to experts they do not fully understand (specialization is unavoidable). However, Requirement 6 suggests that acting without understanding the reasons diminishes moral credit or agency.
  *   *The Result:* You likely cannot have an account that permits high-stakes action on low-comprehension testimony *and* grants the actor full moral credit for that action. The specification forces a **two-tier answer**: the action is *permitted* (epistemically rational), but the *credit* is attenuated (morally thin). An account promising both is likely dishonest.

  **2. Requirements vs. Prejudices**
  *   **Genuine Requirement:** The **Domain Discrimination Test (Req 7)** and **Comprehension-Stakes Threshold (Req 5)**. These are functional necessities for an institution trying to avoid liability and error.
  *   **Partisan Prejudice:** The demand for **Understanding** (often implicit in Req 5 and 6) is frequently a prejudice of the "Pessimist" camp. They treat understanding as a necessary condition for *belief*, whereas an institution only needs it for *legitimacy*.
  *   **The "Killer" Requirement:** **Requirement 7 (Domain Discrimination)** does the most work. If an account cannot explain why moral testimony feels different from legal or mathematical testimony without resorting to "because it's moral," it fails to capture the phenomenology driving the debate. If it *can* explain it, it usually forces a specific metaphysics of moral properties that violates the neutrality constraint.

  **3. The Settling Finding**
  The dispute would be settled by a definitive account of **Moral Access**.
  *   *For Pessimism to be correct:* It must be true that moral knowledge requires a first-person phenomenological state (e.g., a specific emotional response or rational insight) that is *non-transmissible* via language. If moral properties are response-dependent, testimony cannot transmit the response, only the report of it.
  *   *For Symmetry to be correct:* It must be true that moral properties are mind-independent facts accessible via reason alone, analogous to mathematical truths, where testimony functions as a reliable pointer to the fact.
  *   *The Finding:* We need to know if the *reasons* for a moral judgment are separable from the *judgment* itself. If reasons are essentially tied to the agent's subjective motivational set, testimony fails. If reasons are objective and external, testimony succeeds.

  ***

  ### Scoring Families of View

  Here is how four broad families of views score against the specification.

  **1. Understanding-First Pessimism**
  *   *View:* Moral belief via testimony is impossible or deeply defective without independent grasp of the reasons.
  *   *Performance:* Fails **Requirement 5 (Comprehension-Stakes)** and **Requirement 10 (Collective Testifier)**. It renders institutional action nearly impossible, as committees cannot independently verify all expert moral claims. It succeeds on **Requirement 6 (Credit)**, preserving the link between understanding and worth.
  *   *Verdict:* Epistemically pure, institutionally paralyzed.

  **2. Skepticism about Moral Expertise**
  *   *View:* There are no moral experts; therefore, no moral testimony exists.
  *   *Performance:* Fails **Requirement 1 (Layered Deference)** and **Requirement 9 (Disagreement)**. It cannot distinguish between a bioethicist and a layperson, treating all moral claims as equally (un)weighted. It avoids the problem by denying the data.
  *   *Verdict:* Theoretically simple, practically useless for governance.

  **3. Symmetry / Reductionist View**
  *   *View:* Moral testimony is epistemically identical to empirical testimony.
  *   *Performance:* Passes **Requirement 7 (Discrimination)** only by denying the intuition (says there is no difference). Fails **Requirement 6 (Credit)** because it cannot explain why we feel less praise for someone who does the right thing solely on say-so. Passes **Requirement 5 (Stakes)** easily (treats moral risk like engineering risk).
  *   *Verdict:* Institutionally efficient, phenomenologically inaccurate regarding moral agency.

  **4. Hybrid (Action-Permissive / Belief-Restrictive)**
  *   *View:* One may *act* on moral testimony, but should not form a full *belief* (or the belief is second-class).
  *   *Performance:* Best fit for **Requirement 5 (Stakes)** and **Requirement 6 (Credit)**. It allows the hospital committee to ban the procedure (action) without claiming they *know* it is wrong (belief), preserving intellectual humility. It struggles with **Requirement 2 (Concept Transmission)**, as acting on a concept one doesn't believe in is psychologically complex.
  *   *Verdict:* Most viable for institutional specification, though metaphysically messy.

  ### Summary Table

  | Requirement | Understanding-First Pessimism | Skepticism about Expertise | Symmetry / Reductionism | Hybrid (Action/Belief Split) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Layered Deference** | Pass | Fail | Pass | Pass |
  | **2. Concept Transmission** | Fail | Fail | Pass | Mixed |
  | **3. Performative Validity** | Pass | Fail | Pass | Pass |
  | **4. Diachronic Baseline** | Pass | Pass | Pass | Pass |
  | **5. Comprehension-Stakes** | **Fail** (Too strict) | **Fail** (No expertise) | Pass | **Pass** (Best fit) |
  | **6. Credit Allocation** | **Pass** (High credit req.) | N/A | **Fail** (Over-credits) | **Pass** (Nuanced) |
  | **7. Domain Discrimination** | Pass | Pass | **Fail** (Denies diff) | Pass |
  | **8. Integration Velocity** | Pass | Pass | Pass | Pass |
  | **9. Disagreement Protocol** | Pass | Fail | Pass | Pass |
  | **10. Collective Testifier** | **Fail** (Individual focus) | Fail | Pass | Pass |
  | **Institutional Utility** | Low | None | High | High |
  | **Moral Agency Fit** | High | Low | Low | Medium-High |

  **Recommendation:** For your purpose (institutional rules), the **Hybrid** model offers the only workable specification. It allows the body to act on expert advice (satisfying the need for function) while acknowledging the epistemic deficit in their own understanding (satisfying the need for humility and credit accuracy). It treats the moral judgment of the expert as a *practical reason to act* rather than a *theoretical reason to believe*, which aligns with the mandate of a committee that must decide, not merely contemplate.
