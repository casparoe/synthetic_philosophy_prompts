answer: |-
  You have spotted the exact tension that makes labor law so complicated. You aren't confused because you're missing something; you're confused because the system is built on a trade-off that deliberately sacrifices one kind of freedom to secure another.

  Here is the logic that holds those pieces together, stripped of the political slogans.

  ### 1. The Core Assumption: Labor is Not a Normal Product
  Your friend's dad is applying standard market logic: if companies agree on prices, it's price-fixing (illegal); if workers agree on wages, it's a union (legal). The system assumes these are different because **you cannot separate a worker from their labor.**

  If a shoe store goes on strike, the shoes don't starve. If a worker goes on strike, the worker loses their income immediately. The underlying assumption of union law is that there is an inherent power imbalance between an individual human who needs to eat and a corporation that can wait them out.

  Therefore, the logic dictates that the only way to make the transaction "fair" is to allow workers to act as a single entity. If they act individually, the assumption is they will always lose. To make the group act as a single entity, the group must be able to speak with one voice.

  ### 2. The Logic of Majority Rule (Why the "No" Voters are Bound)
  This addresses your civics teacher's "freedom of association" comment. In this context, freedom of association is interpreted as the **group's** right to function, not just the **individual's** right to choose.

  Think of the workplace vote like a political election. If 51% of a town votes for a new tax, the 49% still have to pay it. You can't opt out of the speed limit just because you voted against it. The logic here is that the workplace is being treated as a kind of mini-democracy.

  **Why is this necessary?**
  It comes down to the "Free Rider" problem. If the union negotiates a higher wage, *everyone* on the floor gets it. If your coworker who voted "no" is allowed to opt out of the union rules but still keep the higher wage, she gets the benefit without the cost (dues, strike risk, following restrictions).

  If enough people do that, the union runs out of money and power. If the union has no power, the wages drop back down. So, the logic assumes that for the collective benefit to exist, the collective must be mandatory for everyone in the group. The individual's freedom to make a separate deal is sacrificed to preserve the group's ability to make *any* deal.

  ### 3. The Manager's Hands (Why He Can't Pay You More)
  You noticed your manager seemed annoyed that he couldn't reward you individually. This is the flip side of the "one voice" logic.

  If the manager is allowed to make side deals—paying you more because you're fast, or giving your coworker fewer hours because she has kids—the unity of the workers breaks.
  *   **The Fear:** If the boss can reward individuals, he can "buy off" the best workers. The best workers might stop caring about the union because they are getting special treatment.
  *   **The Result:** The union fractures. The "stars" side with the boss, and the rest are left vulnerable.

  So, the contract assumes that **standardization is more important than meritocracy.** It assumes that preventing favoritism and division is worth the cost of not being able to personally reward high performers. The manager is annoyed because his tool for managing performance (money/schedule flexibility) has been replaced by a tool for managing stability (the contract).

  ### 4. Your Cousin's Idea (Members-Only Bargaining)
  Your cousin is describing a system often called "open shop" or "right-to-work" bargaining (depending on the specific setup). In this version, the union only represents people who sign up. Everyone else negotiates their own deal.

  **What would fall apart if you switched to this?**
  1.  **Two Tiers of Workers:** You would have Union Joe making \$20/hr with benefits, and Non-Union Jane making \$15/hr with no benefits, doing the exact same job side-by-side.
  2.  **Resentment:** Non-union workers might resent union workers for having better deals. Union workers would resent non-union workers for undercutting them.
  3.  **The "Race to the Bottom":** This is the big one. If the boss can hire non-union workers for cheaper, he has a financial incentive to slowly replace union members with non-union members. Over time, the union shrinks and loses its leverage.

  **Would it stop the boss from playing you off each other?**
  Actually, it would *enable* him to play you off each other.
  Currently, the union prevents the boss from saying to you: *"I'll pay you \$1 more than Sarah, but only if you agree to work weekends."*
  In your cousin's version, the boss *could* say that. He could pit you against Sarah to see who will work for less. The whole point of the current system is to remove labor from a competitive auction. Your cousin's version puts it back into an auction.

  ### 5. Is There One Idea Underneath It All?
  Yes. The single unifying idea is **Leverage through Indivisibility.**

  The system assumes that workers have zero leverage individually and only have leverage collectively. Therefore, anything that makes the group divisible (individual deals, opting out, merit pay) is seen as a threat to the existence of the leverage itself.

  *   **Consent:** Consent is viewed as a one-time event (the vote), not an ongoing individual contract. Once the majority decides, the minority is absorbed for the sake of the mechanism working.
  *   **Labor:** Labor is viewed as a relationship of power, not just a market transaction.
  *   **Freedom:** "Freedom" is defined as the freedom of the class of workers from employer domination, even if it restricts the freedom of a specific worker to set their own price.

  ### Summary
  You are seeing the friction between **Individual Liberty** (my friend's dad, your coworker who voted no) and **Collective Security** (the union, the manager's constraints).

  The current system decides that Collective Security is impossible without restricting Individual Liberty. It assumes that if you allow individuals to opt out or make side deals, the collective security vanishes, and eventually, the individuals lose their liberty anyway because the employer holds all the cards.

  It isn't a perfect system, and it isn't logically consistent if you view labor as identical to selling shoes. But if you accept the premise that workers need a counter-weight to corporate power to survive, the restrictions on individual freedom are the necessary price of building that counter-weight.
