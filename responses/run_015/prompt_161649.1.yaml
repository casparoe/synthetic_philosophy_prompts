answer: |-
  This is a sharp, philosophically literate formulation of the Cultural Evolution position. You are effectively arguing for a **pluralistic evolutionary account**: cumulative culture is Darwinian *when* the conditions for selection obtain, and Lamarckian/Guided *when* they don't. You are also rightly skeptical of the "meme" label and focused on the explanatory machinery (the "work" done by selection).

  Here is an evaluation of your position, a critique of your test, and a ranking of defeaters based on how a rigorous defender of the Darwinian view (e.g., Boyd, Richerson, Henrich, or Dennett) would have to respond.

  ### 1. The Verdict on the Weismann Test
  **The Weismann Test is a bad test.** You should replace it.

  **Why:** It conflates the *mechanism of inheritance* with the *mechanism of sorting*.
  In biology, the Weismann Barrier (separation of germ line and soma) prevents the inheritance of acquired characteristics. This ensures that variation is "blind" to the organism's needs. But a system can be Darwinian (driven by population-level selection) even if it allows the inheritance of acquired characteristics (Lamarckian inheritance), provided that:
  1.  There is still variation among the acquired characteristics.
  2.  There is still differential retention of those characteristics based on fitness.

  By tying "Darwinian" to the presence of a barrier, you risk excluding cases where selection is doing the heavy lifting *despite* the leakage. For example, in open-source software, code is modified (acquired characteristic) and committed (inherited). There is no Weismann barrier. Yet, if 100 versions of a library exist and only the most efficient survives via user adoption, that is a selection process. The barrier ensures *blindness* of variation, but blindness is not strictly required for selection to operate; it is only required for selection to be the *sole* source of adaptation.

  **The Replacement Test:** The **Campbellian BVSR Test** (Blind Variation and Selective Retention), modified for culture.
  A system counts as Darwinian if:
  1.  **Variation:** There is a population of variants.
  2.  **Heredity:** Variants are copied with sufficient fidelity.
  3.  **Differential Fitness:** Variants spread due to properties they possess, not just random noise.
  4.  **Independence:** The "fitness" of the variant can be measured *independently* of its frequency (avoiding tautology).
  5.  **Crucially:** The generation of the variant is not *perfectly* determined by the fitness landscape. (If every mind inevitably generates the optimal solution, selection does no work).

  ### 2. Ranked Defeaters (Fatal to Awkward)

  Here is how a defender of the Darwinian view should rank threats to the theory. I have distinguished between what they must **concede** (internal defeaters) and what they would **wave away** (external misunderstandings).

  #### **FATAL: The "Guided Variation" Dominance (The Convergence Problem)**
  *   **The Worry:** You mentioned this: "why the same solution keeps turning up independently." If disconnected groups invent the *exact same* complex tool (e.g., the bow, the potter's wheel) without contact, this suggests the human cognitive architecture + environmental constraints *force* the solution.
  *   **Why it's Fatal:** If variation is **directed** perfectly toward the adaptive peak by individual learning or cognitive constraints, then population-level selection is redundant. The "accumulation" is just a stack of individual insights, not a filtering process. If the "mutation" rate is 100% directed toward fitness, selection has no variance to act upon.
  *   **Defender's Concession:** A honest defender must concede that **pure convergence is non-Darwinian.** If 10 groups invent the bow independently, the *origin* of the bow is not a product of cultural selection. It is a product of guided variation. The Darwinian claim must retreat to the *refinement* and *distribution* of the bow (e.g., specific fletching styles), not its existence.
  *   **Defender's Wave-Away:** "Convergence is rare; most traits are arbitrary." (This is a weak wave-away if convergence is shown to be the norm for high-stakes technology).

  #### **FATAL: Neutral Drift Dominance**
  *   **The Worry:** Your second worry. If frequency distributions of cultural traits (e.g., pottery styles, word usage) fit a neutral drift model (where copying is random with respect to utility) better than a selection model, then selection is not doing the work.
  *   **Why it's Fatal:** Darwinism requires *differential* fitness. If the spread of a trait is predicted entirely by population size and random copying error (drift), the "selection" machinery is idle. Recent work in phylogenetics of culture often shows drift explains as much as selection.
  *   **Defender's Concession:** If a trait's frequency trajectory fits a neutral model, the defender must concede **selection did not drive that trait.** They cannot claim "hidden fitness" without an independent measure of utility.
  *   **Defender's Wave-Away:** "Drift is just selection on variables we haven't measured yet." (This is the tautology trap. If they say this, they admit the theory is unfalsifiable).

  #### **SERIOUS: The Tautology Trap (Fitness defined by Frequency)**
  *   **The Worry:** Your first worry. "The variants that spread are the variants that spread."
  *   **Why it's Serious:** If "fitness" is defined solely as "transmission rate," then Natural Selection is a mathematical truth, not an empirical explanation. It explains nothing.
  *   **Defender's Concession:** The defender must concede that **fitness must be defined functionally prior to transmission.** For example, "This arrow shape is more aerodynamic" must be measurable *before* we check if it became popular. If aerodynamic arrows do *not* become popular (and less aerodynamic ones do), then functional selection failed, and we must invoke bias (prestige/conformity).
  *   **Defender's Wave-Away:** "Prestige *is* fitness." (This is acceptable only if they admit they are no longer talking about *functional* adaptation, but purely about transmission dynamics. It saves the Darwinian *formalism* but loses the Darwinian *explanation of adaptation*).

  #### **AWKWARD: The Leaky Barrier (Lamarckian Inheritance)**
  *   **The Worry:** Your Weismann test fails because culture allows inheritance of acquired traits.
  *   **Why it's Awkward:** It complicates the math and the analogy, but it doesn't break the selection engine.
  *   **Defender's Concession:** "Yes, cultural inheritance is Lamarckian." (Most cultural evolutionists, like Richerson, happily concede this).
  *   **Defender's Wave-Away:** "It doesn't matter for the selection calculus." (They are right. You can have selection on Lamarckian inheritance. This is not a defeater for the Darwinian *claim*, only for the biological *analogy*).

  ### 3. Addressing Your Specific Worries

  **Worry 1: Tautology ("Variants that spread spread")**
  You are right to be worried. This is the "Survival of the Fittest" critique.
  *   **The Fix:** You need an **Independent Fitness Measure.**
  *   **Test:** Can you predict the spread of a cultural variant based on its properties *before* observing the spread?
      *   *Example:* If you claim "efficient knots spread," you must measure efficiency in the lab. If efficient knots do *not* spread (because they are hard to learn), then selection on efficiency is falsified. If they do spread, selection is confirmed.
      *   **Defeater Condition:** If the only way to explain why a trait spread is to say "it must have had high fitness," the theory is dead.

  **Worry 2: Non-Selective Models (Drift & Convergence)**
  This is the stronger worry.
  *   **Convergence:** If the same solution arises independently, it implies the "search space" is constrained by human cognition or physics. This supports **Guided Variation** over **Blind Variation + Selection.**
      *   *Darwinian Counter:* Selection might still act on the *details* even if the *general type* is guided. (Everyone invents a boat, but selection decides which hull shape wins).
      *   *Defeater:* If the *details* also converge independently, selection is ruled out.
  *   **Drift:** If neutral models fit the data better, selection is idling.
      *   *Darwinian Counter:* Selection might be intermittent.
      *   *Defeater:* If drift models consistently outperform selection models across diverse domains (technology, language, norms), the "Darwinian" label becomes a metaphor for "change over time."

  ### 4. Summary: What Would Change Your Mind?

  To maintain your view that cumulative culture is **genuinely** Darwinian (where selection does real explanatory work), you should hold the following line:

  1.  **Abandon the Weismann Test.** It tests for biological-like inheritance, not evolutionary dynamics. Replace it with the **Independent Fitness Test**: Can we predict transmission based on trait properties measured independently of frequency?
  2.  **Accept the "Patchy" Reality.** Admit that **Guided Variation** explains the *origin* of many complex traits (convergence), while **Selection** explains the *retention and spread* of specific variants (drift vs. utility).
  3.  **The Fatal Blow:** The view is falsified if **Neutral Drift models** consistently predict frequency changes better than **Functional Selection models** in domains where function *should* matter (e.g., tool design). If a less efficient tool consistently out-competes a more efficient one due to prestige bias, that is still "selection" (cultural), but it defeats the idea that culture evolves toward *adaptive* solutions via Darwinian means. It becomes Darwinian *dynamics* driving *maladaptive* outcomes.

  **Final Recommendation:**
  Your intuition that the machinery must "earn its keep" is the correct heuristic. Don't worry about the Weismann barrier. Worry about **explanatory redundancy**. If a model of individual learning + cognitive constraints explains the data as well as population-level selection, Occam's Razor cuts the selection mechanism. The Darwinian view survives only where individual learners *fail* to find the optimum, but the population *finds it anyway* through the sifting of variants. That is the niche where selection earns its keep.
