  You are right to feel conflicted. Biologists do not agree on a single definition of life; it is a "fuzzy cluster" concept (like asking if a hotdog is a sandwich). Your worksheet uses a functional definition (evolution + self-sustaining), but your intuitions rely on a **structural/substrate** definition (biology + metabolism). You are prioritizing *what it is made of* and *how it works internally* over *what it produces* (offspring/evolution).

  Here is the breakdown of your verdicts against the principle you are actually using.

  ### Case-by-Case Analysis
  1.  **Flu virus (Not Alive):** **Keep.** Your principle requires internal metabolic machinery. Viruses have genetics but no metabolism; they hijack host machinery.
  2.  **Anthrax spore (Alive):** **Keep.** Dormancy pauses metabolism, but the *machinery* is intrinsic and intact.
  3.  **Mule (Alive):** **Keep.** Your principle prioritizes individual physiology over lineage. Sterility blocks evolution, not life.
