  The water finds the weakness in the sand,
  And splits itself to feed the thirsty earth.
  The flow divides to many wandering veins,
  Where silt lies deep within the slowing bed.
  No single path defines the river's mouth,
  But all the ways it fails to stay as one.
  Consider how a thought proposes choices,
  Or this is true or that is false today.
  The mind divides the world with unseen lines,
  Creating options where there were none before.
  A chosen fork that splits the certain fact.
  Behold the shape where water meets the thought.
  They share the shape of divergence in the dark.
  The sediment becomes the weight of proof,
  The branching path enacts the logic now.
  What flows is not the water nor the word,
  But some new thing that borrows both their forms.
  Like lightning tracing paths across the sky,
  Or nerves that fire inside the living brain.
  A third thing lives beyond the stream and speech.
