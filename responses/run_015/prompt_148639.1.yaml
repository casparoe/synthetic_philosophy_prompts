      *   (2) Objectivity of Harm: Harm = setback to interests based on expected effects/causal situation (intent irrelevant).
      *   (3) Uptake Drift: Public speech always has nonzero expected harm due to unpredictable audiences/reactions (riots, harassment, etc.).
      *   (4) Contextual Instability: Speech acts are defined by actual audience/reaction, not speaker intent. Private vs. Public is a difference in kind based on others' choices.
      *   (5) No Protected Class: Since all speech has nonzero expected harm, banning any speech *could* satisfy HP. Plus, banning changes the harm calculation (self-fulfilling).
      *   (6) Dilemma: HP either constrains nothing (because everything causes harm) OR it becomes a balancing test (consequentialism).
      *   (7) Conclusion: No stable middle between absolutism and consequentialism.

  3.  **Identify the Weak Link (from the TA's perspective):**
      *   The TA wants to save the Harm Principle as a meaningful constraint (reject 7) and exclude the Heckler's Veto (wrongful reactions don't count as harm).
      *   The student's argument relies heavily on the definition of "Harm" in (2) and the application of "Harm" to speech in (3) & (4).
      *   *The Pivot Point:* Step (2) says "whether the agent intended or foresaw those effects is irrelevant to whether the condition is met." Step (3) says "foreseeably triggers harmful downstream reactions."
      *   *The Heckler's Veto Problem:* If I say something offensive, and a mob riots, the student argues this is "harm" under (2) because it's an expected effect in the causal situation. The TA wants to say: "No, the mob's reaction is *their* responsibility, not the speaker's harm."
