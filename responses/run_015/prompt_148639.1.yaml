      *   So, the rejection is really of the definition of Harm implicit in (2) and (3).
      *   Let's focus on **Step (2)**. It is the linchpin. If (2) stands, the Heckler's Veto is in. If the Heckler's Veto is out, (2) must fall.
      *   What about (7)? To save the middle ground, we need to show that HP *does* carve out a protected class. It does so by setting a threshold of *immediacy* and *likelihood* (Brandenburg test). The student ignores thresholds.
