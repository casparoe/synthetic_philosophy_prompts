      *   *Answer:* You can have both, but it requires rejecting the *implication* of (2), effectively modifying (2). If you keep (2) strictly as written ("how other people will in fact react... is irrelevant"), you *cannot* exclude the Heckler's Veto.
      *   So, strictly speaking, you must reject (2)'s claim about irrelevance of agency.
      *   Is it cheaper to lose the Heckler's Veto exclusion or the strict reading of (2)? Losing the Heckler's Veto exclusion destroys free speech protections (mob rule). Losing the strict reading of (2) just makes the theory more nuanced (requires looking at intent/agency). Clearly, losing the strict reading of (2) is cheaper.

