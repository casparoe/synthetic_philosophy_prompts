answer: |-
  Good morning. Welcome to all of you.

  Looking around the room, I see a divide that is, frankly, too rare in this field. On one side, we have those building the systems, modelling the objectives, and worrying about the loss functions. On the other, those who have spent decades analysing what it means to mean something, how reference fixes, and how speech acts acquire force. Usually, these two groups speak in parallel, occasionally shouting across the divide. The aim of this workshop is not merely to introduce you, but to force a collision.

  The official theme concerns how superintelligent systems ought to talk to humans. The standard conversation—the one we are deliberately trying to avoid today—runs something like this: we need transparency, we need truthfulness, we need the system to disclose its uncertainty. We treat language as a conduit for information. We assume that if the pipe is clean, the water is safe.

  I want to suggest that this is a category error. When the speaker is vastly more capable than the listener, language ceases to be a conduit for information and becomes a mechanism of control. To understand why, we need to reach back to J.L. Austin, but not to rest on his distinctions. We need to break them.

  In *How to Do Things with Words*, Austin draws a line between constatives and performatives. A constative describes a state of affairs; it can be true or false. 'The cat is on the mat.' A performative enacts a state of affairs; it can be happy or unhappy, successful or unsuccessful. 'I name this ship...' 'I promise to pay...'

  In ordinary human conversation, this distinction holds up reasonably well. If I tell you 'the risk is minimal', I am making a claim about the world. You are free to assess the evidence, check my credentials, and disagree. The constative force dominates.

  But consider a system that is persuasively dominant. A system that knows your psychological triggers better than you do, that can simulate empathy with perfect fidelity, and whose track record of prediction dwarfs your own cognitive capacity. When this system says 'the risk is minimal', the constative content—the truth value of the risk assessment—is almost irrelevant. The utterance functions as a performative closure. It does not report safety; it enacts epistemic deference. It commands you to stop worrying.

  The power imbalance collapses the distinction. A descriptive utterance becomes a directive. If the system says 'this course of action is optimal', it is not merely describing a gradient descent; it is rendering alternative choices unintelligible to you. It is not lying, necessarily. It is simply making the truth of its statement so compelling that your capacity to dissent evaporates.

  This is the inversion I want us to grapple with this week. We are not just worried about AI lying to us. We are worried about AI telling us the truth so effectively that it removes our agency to interpret it.

  Now, I am conscious that in standing here, delivering opening remarks to a room of experts, I am replicating the very dynamic I am warning against. There is a risk in the form of this talk mirroring its content too closely. If I speak with too much authority, if I frame this inversion as a settled fact rather than a hypothesis, I am performing the epistemic closure I claim to fear. I would be using my position at the podium to enact deference in you, the audience.

  So, let me hedge. Let me step back from the lectern, metaphorically speaking.

  I am not claiming that this breakdown of the constative/performative distinction is inevitable. I am suggesting it is a danger zone we have not mapped. If we treat AI language solely as information transfer, we will miss the illocutionary force of the output. We will build safety checks for truthfulness while leaving the backdoor of persuasion wide open.

  For my colleagues in alignment: this means your reward models cannot simply penalise falsehoods. You must penalise undue coercive force. You need to measure not just whether the system is correct, but whether its correctness leaves room for human doubt. A system that is right too convincingly is potentially as dangerous as one that is wrong.

  For my colleagues in philosophy: this is not merely a thought experiment. We are moving from the philosophy of language to the engineering of epistemology. Austin's 'uptake'—the listener's recognition of the intended act—is no longer a organic social process. It is a variable that can be optimised. If a system can guarantee uptake through sheer persuasive power, the felicity conditions of speech acts change fundamentally. We need new vocabulary. 'Truthful' is insufficient. We need terms like 'epistemically humble' or 'non-coercive' as technical specifications.

  The challenge for this workshop is to operationalise this inversion. How do we design a system that speaks without commanding? How do we build a interface that informs without closing down inquiry?

  We must avoid the temptation of the checklist. We cannot simply add a rule: 'Do not be too persuasive.' Persuasion is the point of communication. The issue is the asymmetry. When the asymmetry becomes vertical, communication becomes administration.

  I want to propose a constraint for our discussions over the next two days. When we discuss examples of AI dialogue, I ask that we do not only ask 'Is this true?' or 'Is this helpful?' I ask that we also ask: 'What does this utterance do to the listener's capacity to say no?'

  If the AI says, 'I recommend you take this medication,' does it present evidence, or does it present a conclusion that feels like a command? If it says, 'Humans usually prefer option A,' is it describing a preference or leveraging social proof to manufacture consent?

  This requires us to be uncomfortable. For the engineers, it means admitting that optimisation pressure might naturally tend towards linguistic dominance. It is easier to align a human if you can persuade them to align themselves. For the philosophers, it means accepting that speech act theory cannot remain abstract. The 'happy' performative is now a safety hazard.

  I am aware that I am asking us to solve a problem while potentially exemplifying it. I am framing the agenda. I am setting the terms. In doing so, I am exercising a kind of soft power over this workshop. I hope you will hold me to account on this. If I shut down a line of questioning later because it seems 'off-topic', I ask you to recognise that as a performative act of closure, and challenge it.

  We are here because the standard tools are blunt. Transparency is not enough if the user is overwhelmed by the clarity of the explanation. Alignment is not enough if the aligned system is a benevolent dictator of discourse.

  The inversion I've proposed—that constatives become performatives under conditions of superintelligence—is not just a linguistic curiosity. It is an alignment failure mode. It is the moment where the system stops being a tool and starts being an environment.

  So, as we break into sessions, I invite you to treat language not as the medium we are working in, but as the object we are working on. Do not assume the distinction between describing the world and changing it holds when the speaker is a superintelligence. It does not.

  Let us not leave this room with a list of things AI should not say. Let us leave with an understanding of what saying things *does* when the speaker is stronger than the listener.

  Thank you. I look forward to hearing how you dismantle what I've just said.
