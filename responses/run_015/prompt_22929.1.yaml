prompt: |-
  I'm a graduate student in the history and philosophy of science, currently taking a seminar on scientific realism, and I run a small podcast for my department's reading group. This week's guest is a philosopher who defends structural realism as the best response to the pessimistic meta-induction. Please draft eight to ten interview questions that go beyond having her restate the view. I want at least one question each on: (a) whether the structure we say survives across theory change is identified only retrospectively, and what that does to the inductive force of the argument; (b) the worry that the pessimistic meta-induction can be reformulated against structure itself — that past theories were wrong about their structure, not just about their entities; (c) how the no-miracles argument for structure avoids the very problem the pessimistic meta-induction raises for the no-miracles argument for truth; and (d) the difference between ontological and epistemological structural realism, and which of the two the pessimistic meta-induction actually threatens. For each question, add a one-line follow-up keyed to the answer she's most likely to give.
