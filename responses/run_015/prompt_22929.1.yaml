answer: |-
  Here are ten interview questions designed for your podcast, tailored to a graduate-level audience in HPS. They address your four required topics while exploring broader tensions in the structural realist program.

  **1. The Pessimistic Meta-Induction (PMI) is often framed as a historical argument, but you treat it as a constraint on metaphysics. Do you view structural realism primarily as a historical thesis about what *has* been preserved, or as a methodological rule for what we *should* believe now?**
  *Follow-up:* If she emphasizes the methodological rule, ask how that rule avoids being ad hoc in the face of current theory underdetermination.

  **2. (Topic A) A common criticism is that structural continuity is identified only retrospectively, once we see which math survived into the new theory. If we can't identify the "real" structure prospectively, doesn't that neuter the inductive force of the argument for our current theories?**
  *Follow-up:* If she argues we *can* identify it prospectively via mathematical heuristics, ask which specific heuristics reliably distinguish "real" structure from "convenient" fiction.

  **3. (Topic B) Critics like Saatsi have reformulated the PMI to target structure itself, noting that even the mathematical relations of past theories (like Fresnel's optics) were technically false. How do you distinguish between structural *approximation* and structural *error* without begging the question?**
  *Follow-up:* If she appeals to the "limiting case" relation between theories, ask whether that logical relation is sufficient to ground ontological commitment.

  **4. (Topic C) The No-Miracles Argument (NMA) is traditionally used to defend truth, but the PMI suggests success doesn't imply truth. How does restricting the NMA to *structural* adequacy block the PMI without also weakening the realist's claim to be explaining the success?**
  *Follow-up:* If she claims structure is the "minimal" commitment needed to avoid the miracle, ask if that minimalism collapses into instrumentalism.

  **5. (Topic D) There is a split between Epistemic Structural Realism (ESR) and Ontic Structural Realism (OSR). Does the PMI threaten our *access* to objects (favoring ESR) or the *existence* of objects (favoring OSR), and which version do you think is the more stable defense?**
  *Follow-up:* If she favors OSR, ask how she accounts for the individuation of structures without appealing to underlying relata.

  **6. The "Relations without Relata" objection suggests that a structure must be a structure *of* something. If you eliminate the relata to avoid the PMI, aren't you left with a metaphysics of pure difference that is difficult to make sense of?**
  *Follow-up:* If she invokes modern physics (like quantum entanglement) as evidence for relation-priority, ask whether that physics is itself immune to future theory change.

  **7. As an HPS audience, we're sensitive to the gap between philosophical reconstruction and actual historical practice. Do historians of science actually recognize the "structural continuity" you describe, or is this a philosopher's idealization of the past?**
  *Follow-up:* If she admits it's an idealization, ask whether a normative philosophy of science can rest on a reconstructed history that practitioners don't recognize.

  **8. How does your structural defense compare to Entity Realism (e.g., Hacking's "spray them" argument)? Is structure more stable than entities, or does the PMI show that manipulability is just as fallible as mathematical representation?**
  *Follow-up:* If she argues structure is more stable, ask her to address cases where the causal powers (entities) survived but the structural description was radically overturned.

  **9. If we accept that we only know the structure of the world, have we surrendered the ability to explain *why* the structure holds, leaving science with description rather than deep explanation?**
  *Follow-up:* If she argues structural explanation is sufficient, ask whether this satisfies the scientific desire for mechanistic understanding.

  **10. Looking forward, where do you see the biggest vulnerability in the structural realist position: is it in the philosophy of mathematics, the history of physics, or the metaphysics of modality?**
  *Follow-up:* If she identifies the metaphysics of modality, ask how structural realism accounts for laws of nature without invoking necessitation relations between objects.
