answer: |-
  **Punishment Ethics Decision Tree**

  **Q1:** Is the state ever permitted to intentionally burden offenders?
  *   **No:** → **Abolitionism**
  *   **Yes:** → Go to Q2

  **Q2:** Is the state permitted to burden offenders *to condemn* them (blame), rather than just for safety?
  *   **No:** → Go to Q3 (Prevention View)
  *   **Yes:** → Go to Q4 (Desert View)

  **Q3 (Twin Sentencing):** Should the deprived twin be detained equally to the privileged twin if both are equally dangerous?
  *   **No:** → **Caruso-Style Public-Health Quarantine** (Risk-based but sensitive to social justice)
  *   **Yes:** → **Pure Consequentialist Deterrence** (Risk-based, ignores background)

  **Q4 (Psychopath):** Should we blame an offender whose reasoning capacity temporarily collapsed during the act?
  *   **No:** → Go to Q5
  *   **Yes:** → **Basic-Desert Retributivism** (Desert survives temporary lapses)

  **Q5 (Erased Legacy):** Should we blame the person who no longer remembers or desires the crime?
  *   **No:** → **Dennett-Style Compatibilist Desert** (Desert requires psychological continuity)
  *   **Yes:** → **Mixed Desert/Deterrence View** (Desert binds the body, not the psyche)

  **Unoccupied Logical Space:**
  Answering **Yes** to Q4 (Blame Collapse) but **No** to Q5 (Spare Erased) is theoretically unstable. It claims temporary incapacity doesn't excuse, but total psychological transformation does. Most retributivists hold that if agency exists, continuity matters less; if continuity matters, capacity usually matters more.

  **Indistinguishable Leaves:**
  **Dennett-Style Compatibilist Desert** and **Mixed Desert/Deterrence View** collapse in practice. Both reject basic desert (Q4-No) yet retain condemnation. The tree separates them on continuity (Q5), but both views ultimately prioritize reasons-responsiveness over metaphysical identity, making the distinction negligible for sentencing policy.
