answer: |-
  This is a strong intuition, and honestly, it's a necessary correction to how *anatta* often gets dumbed down in Western pop-science. You're right to be wary of the Humean "bundle" reading; it tends to flatten Buddhism into a static skepticism about identity, whereas the suttas are dynamic and causal.

  Here's the casual breakdown on whether this holds water:

  **1. Biology vs. Bundle: You're on solid ground.**
  The Humean bundle is often read synchronically (a snapshot of perceptions at time *t*). But the *khandhas* (aggregates) are verbs, not nouns. They aren't "form, feeling, perception"; they are *forming, feeling, perceiving*. They are activities.
  The biology analogy works because metabolism is the perfect secular parallel for *upadana* (clinging/sustenance). An organism isn't a thing; it's a flame that maintains its shape by constantly consuming fuel and excreting waste. If you stop the flow, the "organism" vanishes, not because it was destroyed, but because the process stopped. This maps beautifully to the Buddhist idea that existence is sustained by craving (*tanha*). If you cut the fuel, the pattern ceases (Nirvana). That's much more accurate than "there is no self, just a pile of sticks."

  **2. Diachronic vs. Synchronic: It's in the texts, not an import.**
  You aren't forcing a diachronic view onto the Nikayas; it's already there in *Paticca-samuppada* (Dependent Origination). The formula "When this is, that is; from the arising of this, that arises" is inherently temporal and causal.
  The "momentariness" (*kshanika*) reading is often a later Abhidhamma or scholastic overlay that gets retrofitted onto the early texts. The early suttas talk about a "stream of consciousness" (*vinnana-sota*). A stream implies continuity without a fixed substrate. So, arguing for a diachronic pattern that carries karma without a soul isn't smuggling; it's recovering the causal mechanism that makes rebirth intelligible without a homunculus.

  **3. The Whitehead Worry.**
  You are right to be cautious. Whitehead is useful for philosophers, but for a general science column, he's a speedbump. If you say "It's like Whitehead's process philosophy," half your readers will tune out, and the other half will think you're turning Buddhism into a metaphysical system rather than a soteriological one.
  **The fix:** Stick to the biology. Everyone understands that their cells replace themselves over seven years, yet they feel like the same person. That *is* the process view. You don't need Whitehead to validate it; the science is already there. Use Whitehead only as a footnote if you need to acknowledge the philosophical lineage, but don't let him drive the analogy.

  **4. The Incense/Smoke Image.**
  Comparing Buddhism to Whitehead *with* incense is a bit much. Incense smoke is a classic Buddhist metaphor itself (continuity without substance), so layering Whitehead on top of it feels like over-explaining.
  If you use the incense image, let it stand on its own as a traditional metaphor that aligns with modern process biology. Don't triangulate it through 20th-century metaphysics. It obscures the practical point if it becomes about "what kind of reality is this?" rather than "how does this process cause suffering?"

  **5. The Soteriological Risk.**
  The only place this framing can trip you up is if it becomes *too* comfortable. If personhood is just a "self-maintaining pattern," a reader might think, "Okay, cool, I'm a process, I'll just maintain this process happily."
  You need to ensure the column lands on *why* this matters. The biological analogy works best when you highlight the *cost* of maintenance. Metabolism requires fuel. The "self" pattern requires constant feeding (validation, sensory input, becoming). *Anatta* isn't just "you don't exist"; it's "the thing you think you are is a hungry process that eats your peace of mind."
  If you keep the focus on the *burden* of maintaining the pattern, you stay true to the First Noble Truth (Suffering) and don't just drift into cool metaphysics.

  **Verdict:**
  The biology mapping holds water. It's more accurate to the Pali than the Humean bundle. Drop Whitehead as a primary frame (keep it in your back pocket), lean into the "metabolism of self" angle, and make sure you emphasize that recognizing the pattern is the first step to stopping the feeding. You aren't forcing Buddhism into a framework; you're translating a dynamic system into a language (process science) that finally matches its original grammar.
