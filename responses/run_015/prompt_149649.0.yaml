  *Better:* 3 Groups of 6. Each group is a "Historian Team." They are *all* trying to explain the divergence. They are not *playing* Britain or China. They are playing *Historians*. This avoids tribalism and keeps the focus on the *explanation*.
  *Wait, for Twin-Track:* To feel the coupling, they need to represent the regions.
  *Decision:* 2 Teams of 8 (Britain vs China) + 2 Facilitators/Auditors (rotated)? No, 18 is hard to split evenly for symmetric teams.
  *Best Decision:* 3 Tables of 6. Each Table is a "Research Team." They are competing to produce the *best explanation*. The "Britain/China" dynamic is on the cards/board, not the students. This prevents "Team Britain" defending Britain. It keeps the focus on the *analytical framework*.
  *Wait, for Twin-Track:* If they are all historians, how do they feel the coupling?
