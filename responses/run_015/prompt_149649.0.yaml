      *   **Goal:** Move beyond standard "Coal/Colonies/Institutions vs. Contingency" debate. Make them *feel* that the question itself is constructed via specific framing choices.
      *   **Key Concepts to Embed:**
          1.  *Contrast Drift:* Explaining a difference by citing factors present in both.
          2.  *Retrospective Outcome-Picking:* Defining the outcome based on what happened, ignoring alternative definitions of "success."
          3.  *Twin-Track Assumption:* Treating regions as independent when they were causally coupled.
      *   **Constraints:** No lecturing first, minimal printing (cards ok), no money (points/chips), avoid contested empirical claims (keep cards schematic), avoid reproducing structure-vs-contingency debate.
      *   **User's Seed Idea:** Factor cards, build an explanation, penalty for shared factors, linkage challenge.
      *   **User's Concerns:** "Gotcha" feeling, competitive trivia overshadowing concepts, one student relitigating history.
      *   **Deliverables:** Rules/Payoffs, Minute-by-Minute Timeline, Facilitator Script (Do's/Don'ts), Debrief Plan, Prediction of Failure Modes, Honest Assessment of Limitations.

  2.  **Deconstruct the Pedagogical Challenge:**

      *   The core problem is *epistemological*, not *empirical*. Students think they are arguing about *facts* (Did China have coal? Did Britain have institutions?). The facilitator wants them to argue about *categories* (What counts as a cause? How do we define the effect?).
      *   To avoid the "Gotcha," the game mechanics must reward *reflection* on the cards, not just *knowledge* of the cards.
      *   To address "Outcome-Picking," the game needs multiple possible winning conditions, not just "Industrialize."
      *   To address "Twin-Track," the game needs a mechanic where Player A's move affects Player B's board.
      *   To address "Contrast Drift," the scoring needs to penalize "Universal Factors" used as "Differentiating Factors."

  3.  **Develop the Game Mechanism (Iterative Process):**

      *   *Idea 1 (User's Seed):* Build an argument, reveal hidden info. *Critique:* Too static. Doesn't capture the dynamic nature of history or the "Outcome-Picking" issue well.
      *   *Idea 2:* Two teams, Britain and China. Race to industrialize. *Critique:* Reinforces the "Twin-Track" assumption we want to critique.
      *   *Idea 3 (Selected Approach):* "The Historian's Wager."
          *   **Phase 1: The Bet (Outcome Picking).** Before seeing cards, they must define *what* they are explaining and *when* the race started. This locks in their bias.
          *   **Phase 2: The Construction (Contrast Drift).** They build explanations using cards. But the cards have a hidden "Distribution" side (Unique vs. Shared).
          *   **Phase 3: The Entanglement (Twin-Track).** A mechanic where cards can be "linked" between regions, invalidating independence.
          *   **Scoring:** Points aren't for "being right" (historically), but for "consistency" and "robustness."

      *   *Refining the Cards:* To avoid contested empirics, cards should be abstracted. Instead of "Yangzi Delta Wages," use "High Wage Economy." Instead of "Newcomen Engine," use "Energy Substitution Tech."
      *   *Refining the "Twin-Track":* Need a specific action. Let's call it "The Flow." If you play a card like "Global Silver Market," it *must* connect the two tables. If you treat them as separate, you lose points.

  4.  **Drafting the Activity Structure:**

      *   **Title:** *The Divergence Wager.*
      *   **Setup:** 3 Groups of 6 (or 2 groups of 9). Let's go with 3 groups of 6 for better table talk. Actually, 18 people fits 3 tables of 6 perfectly.
      *   **Materials:** Factor Cards (20), Outcome Cards (5), Linkage Tokens.
      *   **Timeline:**
          *   0-10: Intro & The Bet (Outcome Picking).
          *   10-30: Hand Construction (Contrast Drift setup).
          *   30-50: The Reveal & Scoring (Contrast Drift payoff).
          *   50-70: The Entanglement (Twin-Track).
          *   70-90: Debrief.

  5.  **Addressing the Specific Concepts:**

      *   *Contrast Drift:* Mechanism: Cards have a "Prevalence" back (Unique to A, Unique to B, or Shared). If you use a Shared card to explain a Difference, you lose points.
      *   *Outcome Picking:* Mechanism: Groups choose their "Victory Condition" card *before* seeing the factors. Different conditions (e.g., "First Mechanized Textiles" vs. "Sustained Per Capita Growth") make different factors valuable.
      *   *Twin-Track:* Mechanism: "Linkage Tokens." Some cards are inherently global (Silver, Disease, War). If played, they must physically link the two regional boards. If a group tries to explain divergence using a Linked card without acknowledging the link, they are vulnerable to a "Challenge."

  6.  **Refining the Facilitator Role:**

      *   *Crucial:* Do not validate historical accuracy. Validate *logical consistency*.
      *   *Crucial:* Do not explain the three concepts until the debrief.
      *   *Crucial:* Manage the "Expert Student." Give them a specific role (e.g., "Auditor") or redirect them to the *game logic* rather than *historical fact*.

  7.  **Addressing the "Gotcha" Fear:**

      *   Instead of "You lost points because you were wrong," frame it as "Your explanation was fragile because it relied on a factor that wasn't actually a difference."
      *   Add a "Pre-Registration" step (as the user suggested). Before the reveal, they must estimate how many of their cards are shared. This turns the reveal into a calibration exercise, not a punishment.

  8.  **Developing the Debrief:**

      *   Map game moments to the three concepts.
      *   End on "What survives?" (The need for precise counterfactuals, coupled systems analysis, and clear dependent variables).

  9.  **Anticipating Failure Modes:**

      *   *The Pedant:* "But China *did* have coal in Shanxi!" -> Facilitator response: "In the logic of this game, that card is marked 'Shared.' Argue with the card, not me."
      *   *The Gamers:* Trying to optimize points rather than think. -> Mitigation: Points are secondary to the "Wager" consistency.
      *   *Time Creep:* The card sorting takes too long. -> Mitigation: Strict timers.

