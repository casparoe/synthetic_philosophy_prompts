answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to interrogate the *structure of their own reasoning* rather than the *content of historical facts*. To do this without lecturing, the game mechanics must punish the *logical errors* (the three framing choices) rather than historical inaccuracies.

  Here is a design for **"The Divergence Wager."** It uses your seed idea but structures the play to physically enforce the three errors before allowing students to correct them.

  ### 1. The Setup & Materials

  **Room:** 3 Tables of 6 students.
  **Materials per Table:**
  *   **20 Factor Cards:** Schematic statements (see list below).
  *   **5 Outcome Cards:** Definitions of "The Divergence" (see list below).
  *   **10 "Linkage Tokens"** (distinctive chips or folded paper).
  *   **Score Sheet:** A simple grid (Columns: Factor, Assigned Region, Prevalence Guess, Final Score).
  *   **Pen/Paper.**

  **The Factor Cards (Schematic to avoid empirics):**
  *   *Specific:* "Cheap fossil energy near manufacturing," "High wages relative to energy," "State debt monetized via central bank," "Captive overseas textile market."
  *   *Shared-sounding:* "High agricultural yield per acre," "Sophisticated rural credit networks," "Large internal market," "Household proto-industry," "State capacity to collect land tax."
  *   *Global/Linkage:* "Global silver arbitrage," "Epidemic disease regimes," "Naval military technology," "Cotton crop biology."
  *(Note: On the back of every card is a stamp: **UNIQUE-A**, **UNIQUE-B**, or **SHARED**. For the Global cards, the back says **LINKED**.)*

  **The Outcome Cards (The "Wager"):**
  1.  "First sustained rise in output per capita."
  2.  "First mechanized factory textile production."
  3.  "Highest state revenue extraction by 1800."
  4.  "Fastest recovery from demographic shock."
  5.  "Most expensive labor relative to capital."

  ---

  ### 2. Rules & Payoff Scheme

  **Objective:** Construct the most "robust" explanation for why Region A diverged from Region B based on a chosen Outcome.

  **Scoring (The "Robustness" Metric):**
  *   **+2 Points:** For every **UNIQUE** factor correctly assigned to the diverging region.
  *   **-2 Points:** For every **SHARED** factor used to explain the difference (The *Contrast Drift* Penalty).
  *   **+3 Points:** For every **LINKED** factor successfully connected to *both* regions with a Token (The *Twin-Track* Bonus).
  *   **-5 Points:** If your chosen **Outcome** is logically incompatible with your Factor mix (e.g., choosing "Mechanized Textiles" but playing no energy/labor cost cards).
  *   **The Wager Bonus:** Before seeing card backs, the group estimates what % of their hand is **SHARED**. If their estimate is within 10% of the actual reveal, they double their total score.

  **Crucial Rule:** Students do not know the back of the cards until Phase 3. They must argue based on the text.

  ---

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: The Wager (Outcome-Picking)**
  *   **Action:** Do not explain the topic. Hand each table one random **Outcome Card**.
  *   **Task:** They have 5 minutes to write down: "In 1750, which region (A or B) would you bet wins this Outcome?" and "Why?" (2 sentences).
  *   **Facilitator:** Collect the bets. Do not comment on them.
  *   **Pedagogical Hook:** They have now committed to a definition of "success" and a baseline expectation *before* seeing evidence.

  **00:10 – 00:35: The Construction (Contrast Drift Setup)**
  *   **Action:** Deal 12 Factor Cards to each table (face up). Tell them Region A is the "Winner" of their specific Outcome Card.
  *   **Task:** Build the "Best Explanation." Select 5 cards that best explain why Region A won. Write a 3-sentence narrative linking them.
  *   **Constraint:** They must assume the cards are independent facts.
  *   **Pre-Registration:** Before flipping cards, they must record on their Score Sheet: "We estimate X of these 5 cards are actually present in Region B too."
  *   **Facilitator:** Circulate. If a student says "But did China have this?", reply: "Treat the card text as the truth for this game."

  **00:35 – 00:55: The Reveal & Scoring (Contrast Drift Payoff)**
  *   **Action:** Students flip their 5 selected cards to reveal the backs (**UNIQUE**, **SHARED**, **LINKED**).
  *   **Task:** Calculate scores.
  *   **The Twist:** Most tables will have selected at least one **SHARED** card (e.g., "High agricultural yield") to explain a difference. They lose points.
  *   **Facilitator:** Ask tables to compare their "Estimated Shared %" with the "Actual Shared %."
  *   **Pedagogical Hook:** The "Gotcha" is mitigated by the Pre-Registration. The pain comes from realizing their "explanation" relied on factors that weren't differences.

  **00:55 – 01:10: The Entanglement (Twin-Track Assumption)**
  *   **Action:** Introduce the **Linkage Tokens**. Identify any **LINKED** cards in the deck (e.g., "Global Silver," "Naval Tech").
  *   **Task:** Tables must now find one other table and physically link their boards. If Table 1 has "Global Silver," they must connect it to Table 2's board.
  *   **Rule Change:** If a card is **LINKED**, it cannot count as a "Unique" cause for one region unless the group explains the *flow* between them.
  *   **Facilitator:** Force interaction. "Table 1, your 'Naval Tech' card affects Table 2's 'Security' card. You cannot score unless you draw an arrow between the tables."
  *   **Pedagogical Hook:** They physically experience that the "regions" are not independent variables.

  **01:10 – 01:30: The Debrief (Mapping the Concepts)**
  *   **Action:** Stop the game. No more points.
  *   **Task:** Facilitator leads the discussion (script below).

  ---

  ### 4. Facilitator Script: Do's and Don'ts

  **DO:**
  *   **Enforce the Game Logic:** If a student argues empirical history ("Actually, Shanxi had coal"), say: *"In the logic of this simulation, that card is marked SHARED. Argue with the mechanic, not the history."*
  *   **Highlight the Wager:** In the debrief, return to their 1750 bets. *"Look at your bet. Did you pick Britain because you knew the outcome, or because of the factors?"*
  *   **Validate Frustration:** If they feel tricked by the SHARED cards, agree. *"Good. That frustration is the point. It's the feeling of Contrast Drift."*

  **DON'T:**
  *   **Don't Lecture Early:** Do not mention Pomeranz, Allen, or Needham until the debrief.
  *   **Don't Validate "Right" Answers:** There is no historically correct hand. There is only a logically robust one.
  *   **Don't Let Them Optimize Trivia:** If a group tries to memorize card backs, stop them. Remind them the goal is the *narrative consistency*, not the score.

  ---

  ### 5. The Debrief: Mapping Moments to Concepts

  *Goal: Move from "The game was tricky" to "The historiography is constructed."*

  **Step 1: Contrast Drift (The Shared Cards)**
  *   *Ask:* "Who lost points because a card they thought was unique turned out to be Shared?"
  *   *Map:* "You just experienced **Contrast Drift**. You used a factor present in both places to explain a difference. In the literature, this looks like citing 'property rights' or 'rational markets' as the cause of divergence, when those existed in both regions. The question 'Why Britain?' silently becomes 'Tell me everything good about Britain.'"
  *   *Fix:* "To fix this, we don't need better facts. We need a **Control**. We have to explain why the factor produced growth *here* but not *there*."

  **Step 2: Retrospective Outcome-Picking (The Wager)**
  *   *Ask:* "Look at your Outcome Card. Table 1 had 'Mechanized Textiles.' Table 4 had 'Per Capita Growth.' Did you select different Factor Cards?"
  *   *Map:* "This is **Outcome-Picking**. If you define divergence as 'Factories,' coal matters. If you define it as 'Living Standards,' coal matters less. We ask 'Why Industrialization?' because we know Industrialization happened. If the Yangzi Delta had industrialized first, we'd be asking 'Why China?' and the 'causes' would look completely different."
  *   *Fix:* "We must specify the **Dependent Variable**. Are we explaining technology, welfare, or state power? They are not the same thing."

  **Step 3: Twin-Track Assumption (The Linkage Tokens)**
  *   *Ask:* "When I forced you to link your boards with the Tokens, did it break your explanation?"
  *   *Map:* "This is the **Twin-Track Assumption**. We treat Britain and China as two separate petri dishes. But they were in the same room. Silver flowed from America to China via Britain. Wars in Europe changed prices in Asia. You can't explain one without the other."
  *   *Fix:* "We need a **Global Model**. The unit of analysis isn't the nation; it's the system."

  **Step 4: What Survives?**
  *   *Close:* "So, is the question meaningless? No. But it changes. It stops being 'Why Britain?' and becomes: 'In a globally coupled system with shared factors (agriculture, markets), what specific bottleneck broke open in one node (Britain) allowing a specific outcome (Factories/Growth) that didn't break in the other (China)?' That is a harder question. It requires counterfactuals, not just lists of advantages."

  ---

  ### 6. Predictable Failure Modes & Mitigations

  **1. The "Pedant" (The student who knows the history)**
  *   *Symptom:* "This card is wrong. China *did* have a central bank equivalent."
  *   *Risk:* Derails the game into empirical nitpicking.
  *   *Mitigation:* **The "Black Box" Rule.** Tell them at the start: *"These cards are not history; they are the 'archive' for this simulation. Even if you know the archive is wrong, you must play the hand you are dealt. Your job is to analyze the logic of the explanation, not the accuracy of the card."* If they persist, give them the role of "Auditor" to check the math, not the history.

  **2. The "Gamers" (Points over Concepts)**
  *   *Symptom:* Groups ignore the narrative and just hoard UNIQUE cards to maximize points.
  *   *Risk:* They miss the conceptual point about Contrast Drift.
  *   *Mitigation:* **The Narrative Tax.** In Phase 2, tell them: *"You cannot score points unless your 3-sentence narrative is read aloud and makes grammatical sense."* This forces them to engage with the *logic* of the connection, not just the card type.

  **3. Time Creep**
  *   *Symptom:* The Card Selection phase drags on.
  *   *Risk:* You run out of time for the Debrief (the most important part).
  *   *Mitigation:* **Hard Stops.** Use a visible timer. When time is up, they must freeze their hand. If they haven't selected 5 cards, they play with what they have. The pressure mimics the "manufactured tractability" of the question—historians often have to work with incomplete data.

  **4. The "So What?" Reaction**
  *   *Symptom:* Students leave thinking, "Okay, history is hard. So what?"
  *   *Risk:* Nihilism.
  *   *Mitigation:* **The "Survivor" Close.** Ensure the debrief ends on *how to ask better questions*, not just *why this question is bad*. Emphasize that recognizing these traps makes their own research more robust.

  ---

  ### 7. Honest Assessment: What This Activity Cannot Do

  You asked for honesty about limitations. Here is what the game cannot reproduce, which you must supply in the debrief:

  1.  **Agency and Contingency:** The game is static. Cards don't "react." In reality, actors *responded* to coal/wages. The game makes factors look like lego bricks.
      *   *Your Fix:* In the debrief, explicitly state: *"The game treated factors as static. In reality, high wages caused people to invent machines. The causation runs both ways. That's why the 'Twin-Track' is even harder in real life."*
  2.  **The "Feel" of the Past:** The game is abstract. It doesn't capture the human cost or the lived experience of the divergence.
      *   *Your Fix:* Remind them that "Output per capita" is a metric, not a life. The "Outcome-Picking" trap also hides normative judgments about what counts as "progress."
  3.  **The Depth of Coupling:** The "Linkage Tokens" are a mechanical proxy for global history. They can't simulate the complexity of the silver trade or ecological exchange.
      *   *Your Fix:* Acknowledge that the game simplifies "coupling" to "card sharing." Real coupling involves feedback loops, lag times, and unintended consequences.

  **Final Advice:**
  The success of this session hinges on your restraint. You will want to explain the concepts when you see them struggling in Phase 2. **Don't.** Let them lose the points. Let them feel the frustration of the "Shared" card penalty. That visceral feeling of "Wait, I can't use this?" is the learning moment. The debrief is just putting the label on the feeling they already had.
