  Here is the draft for your mock exam. I've kept the formatting clean so it's easy to read on a phone, and I ignored the "then/than" stuff as requested.

  ### Part 1: The Exam Question (60 Minutes)

  **Question 1: The Silent Surgeon**

  Read the following case study carefully:

  > **The Silent Surgeon**
  > During a complex operation, a surgeon cuts her own hand on a scalpel. She immediately registers the sensation as "sharp," "cutting," and located precisely on her thumb (sensory details). However, she does not flinch, grimace, or feel any urge to pull away. She continues working calmly. When asked later, she states, "That pain was definitely bad and harmful," but she also reports feeling zero motivation to stop working or protect her hand during the procedure. She understood the negative value of the pain but felt no behavioral push to avoid it.

  **Prompt:**
  Philosophers often argue that pain is bad *because* it motivates us to avoid it (the Motivational Account). Others distinguish between the **sensory** aspect of pain (what it feels like) and the **affective** aspect (how much it bothers us).

  Using the case of the Silent Surgeon, write an essay addressing the following:
  1.  Apply the sensory vs. affective distinction to the surgeon's experience.
  2.  Explain the Motivational Account of pain's badness.
  3.  Evaluate whether the surgeon's lack of behavioral drive undermines the Motivational Account, specifically focusing on the dissociation between her evaluation ("this is bad") and her motivation (zero urge to stop).

  *(Suggested time: 60 minutes)*

  ***

  ### Part 2: Model Answer

  **Introduction**
  The case of the Silent Surgeon presents a challenge to how we understand the nature of pain. To analyze this, we must separate the physical sensation of pain from the emotional reaction to it. This essay will argue that the surgeon's experience demonstrates a dissociation between evaluating pain as bad and being motivated to avoid it, which significantly undermines the strong version of the Motivational Account.

  **Sensory vs. Affective Distinction**
  First, we must apply the sensory/affective distinction to the case. The sensory component refers to the discriminative properties of pain: location, intensity, and type. The surgeon clearly retains this, as she identifies the pain as "sharp," "cutting," and on her "thumb." The affective component refers to the unpleasantness or the "suffering" part of pain that usually makes us care. In typical pain, these are fused. In the Silent Surgeon, the sensory component is intact, but the affective component—which normally generates distress—is severed. She feels the signal without the usual emotional alarm.

  **The Motivational Account**
  The Motivational Account claims that the badness of pain is constituted by its motivational force. In other words, pain is bad *because* it commands us to stop or protects us by forcing avoidance. Under this view, if a sensation does not motivate avoidance, it lacks the essential quality that makes pain "bad." It suggests that judgment and motivation are linked: if you truly believe pain is bad, you must be motivated to avoid it.

  **Evaluation vs. Behavioral Drive**
  The Silent Surgeon creates a problem for this account because she separates evaluation from drive. She reports the pain is "bad" (evaluation) but feels "zero motivation" to stop (behavioral drive). If the Motivational Account were strictly true, her lack of motivation should mean she doesn't view the pain as bad, or the pain isn't actually bad. However, she intellectually acknowledges the badness while lacking the urge to act. This suggests that "badness" might be a judgment separate from the motivational push. The case shows that the affective component usually bridges this gap, but when dissociated (as in asymbolia or this surgical case), the link breaks. This implies pain's badness might not *be* the motivation, but rather something we judge independently of it.

  **Conclusion**
  In conclusion, the Silent Surgeon undermines the Motivational Account by showing that one can acknowledge the badness of pain without the accompanying imperative to avoid it. While the sensory data remains, the lack of affective drive proves that evaluation and motivation can come apart. Therefore, pain's badness cannot be defined solely by its ability to motivate avoidance, as the surgeon demonstrates that the judgment of badness can survive even when the motivational force is absent.

  ***

  ### Part 3: Marking Scheme (20 Marks Total)

  **Point 1: Correct Application of Sensory vs. Affective**
  *   **Must Hit:** Candidate identifies "sharp/cutting/thumb" as sensory and the lack of distress/urge as the missing affective component.
  *   **Common Screw-up:** Students confuse intensity with unpleasantness, claiming the pain wasn't "real" because she didn't react.
  *   **Marks:** /4

  **Point 2: Explanation of Motivational Account**
  *   **Must Hit:** Candidate explains that this theory defines pain's badness *as* its power to command avoidance or motivate action.
  *   **Common Screw-up:** Students describe it as just "pain makes us move" without linking it to the definition of *badness*.
  *   **Marks:** /4

  **Point 3: Analysis of the Undermining Effect**
  *   **Must Hit:** Candidate argues that the case challenges the theory because the "badness" judgment exists without the required motivation.
  *   **Common Screw-up:** Students say the case proves nothing because "surgeons are trained," ignoring the philosophical implication.
  *   **Marks:** /4

  **Point 4: Dissociation of Evaluation and Drive**
  *   **Must Hit:** Candidate explicitly discusses the gap between saying "this is bad" (evaluation) and feeling no urge to stop (behavioral drive).
  *   **Common Screw-up:** Students treat evaluation and motivation as the same thing and fail to see the conflict.
  *   **Marks:** /4

  **Point 5: Reasoned Conclusion**
  *   **Must Hit:** Candidate provides a clear verdict (yes/no/partial) on whether the account is undermined, supported by the previous analysis.
  *   **Common Screw-up:** Students sit on the fence without justification or contradict their earlier arguments in the final paragraph.
  *   **Marks:** /4

  **Total:** /20
