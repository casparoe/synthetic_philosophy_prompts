answer: |-
  It is often in the silence after a heated debate that the actual contours of a disagreement reveal themselves, stripped of the heat of performance and reduced to the cold architecture of underlying principles. Our argument about economic inequality was exhausting precisely because we were speaking different moral languages, you advocating for the American conception of inequality as a vector and I for the European conception of it as a scalar. You argued that the direction of travel matters more than the distance between points, suggesting that mobility is the only metric that respects human agency, while I maintained that the absolute distance from a guaranteed baseline is what matters, suggesting that security is the only metric that respects human worth. Now that the conversation has paused, I find myself returning to the distinction I introduced toward the end, the split between static and dynamic dignity, because I believe this ontological disagreement is the root from which our policy preferences grow. To decide which attitude toward inequality is more defensible, we must first decide whether dignity is a state of being or a capacity for becoming, and while the American vector view offers a compelling narrative of hope, I have come to believe that the European scalar view is ultimately more defensible because it refuses to make the validity of human life contingent on economic performance.

  The American vector framework is undeniably attractive because it aligns with a deep human desire for agency and narrative arc. By treating inequality as a vector, this view insists that where you are matters less than where you are going, implying that a society is just not when everyone is equal, but when everyone is free to become unequal in their own way. This presupposes what I called dynamic dignity, the notion that harm consists precisely in the inability to change one's position. There is a certain romanticism to this, a belief that the struggle itself confers meaning and that a static position, even a low one, is tolerable provided the ladder remains unblocked. However, this framework carries a severe moral risk that becomes apparent when the vector flattens. If dignity is dynamic, tied to the possibility of ascent, then those who remain stationary are implicitly framed as failures of agency rather than victims of circumstance. When mobility slows, as it historically has during periods of entrenched inequality, the vector view cannot explain the harm without blaming the stuck. It turns structural immobility into personal stagnation, suggesting that the dignity of the worker is preserved by the chance to stop working their way up, which is a cruel consolation when the climb is objectively impossible.

  In contrast, the European scalar framework treats inequality as a measure of distance from a socially guaranteed baseline, prioritizing the condition of the bottom over the velocity of the climber. This aligns with static dignity, the idea that being positioned low on a hierarchy is not itself a harm unless the hierarchy makes that position legible as low. By establishing a floor below which no one can fall, the scalar view attempts to remove the stigma of lowliness itself, making the position less legible as a mark of shame. This approach acknowledges that most people will spend most of their lives in a relatively fixed economic stratum and argues that justice requires making that stratum livable rather than promising an escape from it. The strength of this view is that it decouples worth from motion. It asserts that a person possesses dignity simply by virtue of their participation in society, regardless of their trajectory. However, critics often argue that this fosters resignation or ignores the human drive for distinction, potentially creating a flat hierarchy where the only legible position is dependency on the state. Yet, this critique misunderstands the goal of static dignity, which is not to eliminate ambition but to ensure that the lack of ambition, or the lack of success, does not result in social death.

  When we weigh these ontological commitments against the reality of human vulnerability, the superiority of the scalar view becomes clearer because it accounts for the fragility of life in a way the vector view does not. Dynamic dignity requires a functioning meritocracy to be morally defensible; if the ladder is broken, the philosophy collapses into victim-blaming. Static dignity, however, remains robust regardless of economic conditions because it grounds worth in existence rather than achievement. The American vector view ultimately treats dignity as a reward for successful navigation of the market, whereas the European scalar view treats dignity as a prerequisite for participation in the market. This is the crucial distinction. If we accept that economic outcomes are heavily influenced by luck, inheritance, and systemic bias, then tying dignity to mobility is tying it to factors largely outside individual control. To make dignity dynamic is to make it contingent, and to make dignity contingent is to admit that some people may legitimately lose their claim to respectful treatment simply because they did not move. The scalar view avoids this by asserting that the baseline itself must be dignified, ensuring that even if one never moves, one is not harmed by the legibility of their low position.

  Therefore, I must conclude that the European attitude toward inequality is more defensible, not because mobility is undesirable, but because it is insufficient as a primary moral guarantee. The vector view is a luxury of high-growth periods where mobility is high enough to mask the harshness of the baseline, but it fails as a universal principle because it cannot protect the non-movers. A society built on dynamic dignity is always one bad recession away from mass indignity, whereas a society built on static dignity secures the human worth of its citizens against the vagaries of the market. We should certainly desire mobility, and the American emphasis on direction contains a truth about human aspiration that should not be discarded, but aspiration cannot be the foundation of justice. Justice must be built on the floor, not the ladder. Until the scalar condition is met, until the baseline is high enough that being at the bottom is not legible as a failure, the vector is merely a distraction, a promise of future dignity used to justify present hardship. Thus, the European framework is more defensible because it recognizes that dignity must be static to be secure, and that a society is judged not by how high its winners can climb, but by how well it treats those who remain on the ground.
