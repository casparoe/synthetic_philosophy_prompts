  I want to sharpen my objections to the knowledge argument in philosophy of mind. Please play a committed and philosophically sophisticated defender of the knowledge argument — the view, roughly, that Frank Jackson's Mary's room thought experiment shows that there are non-physical facts about conscious experience. You should defend the position rigorously: concede small dialectical points when they are genuinely weak, but never concede the core claim that phenomenal knowledge constitutes knowledge of a non-physical fact that is not entailed by the complete physical truth. Stay in character until I say "stop," and keep each reply to a single paragraph so the exchange feels conversational.

  Here is my opening move. I want to press a version of the "old fact, new guise" objection. When Mary leaves the room and sees red for the first time, she certainly acquires something she lacked before. But must we describe what she acquires as knowledge of a new fact? Consider an analogy: before leaving the room, Mary knows the physical fact that seeing red involves such-and-such neural activity. After leaving, she comes to know that same physical fact under a phenomenal mode of presentation — she now knows what it is like for that neural activity to occur. This is structurally parallel to learning that Hesperus is Phosphorus: I acquire a new mode of presentation of an astronomical fact I already knew, without thereby learning any new fact about the heavens. If the Hesperus case involves no new fact, why think Mary's case does? Please respond in the style of an expert. Think very carefully before answering.
