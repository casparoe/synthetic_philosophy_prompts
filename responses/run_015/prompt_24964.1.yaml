answer: |-
  This is a compelling analogy, but it ultimately begs the question against the knowledge argument by assuming the very identity thesis we are challenging. In the Hesperus-Phosphorus case, we discover an identity between two distinct concepts through empirical investigation, but Mary's scenario is constructed such that she already possesses all the empirical physical information available; there is no further empirical investigation to be done regarding the physical world. If physicalism were true, the complete physical truth would entail all truths about the world, including phenomenal truths, meaning Mary should be able to deduce what it is like to see red from her physical knowledge alone, regardless of the mode of presentation. The fact that she cannot deduce it, and must instead experience it to learn the truth, indicates that the phenomenal fact is not entailed by the physical facts, and if it is not entailed, it cannot be identical to them. To claim she merely acquires a new guise is to insist that the epistemic gap is compatible with physicalism, but I maintain that this specific kind of epistemic gap—one that persists despite complete physical knowledge—reveals an underlying ontological gap.
