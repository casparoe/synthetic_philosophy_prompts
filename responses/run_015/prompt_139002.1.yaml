  **Patient N**

  It burns here where you press, an eight.
  The chart says sharp, the spot is wide.
  There is no hurt in what I feel.
  I mark the box for burning heat.

  The chart says sharp, the spot is wide.
  Please give the pill to make it stop.
  I mark the box for burning heat.
  I push your hand away from me.

  Please give the pill to make it stop.
  The nerve fires clear inside the skin.
  I push your hand away from me.
  The number holds, the color's red.

  The nerve fires clear inside the skin.
  I want it gone, though nothing's wrong.
  The number holds, the color's red.
  You watch my face for signs of stress.

  I want it gone, though nothing's wrong.
  There is no hurt in what I feel.
  You watch my face for signs of stress.
  It burns here where you press, an eight.

  **Why I built it that way**

  The pantoum's repeating mechanism (lines 2 and 4 propagating to 1 and 3) anchors the sensory reports ("It burns here," "The chart says sharp"). These lines return byte-identical, mimicking the stability of the sensation itself. The changing lines carry the attitudinal data—the wanting, the pushing away, the denial of hurt. This enacts the philosophical split: the sensory content remains invariant while the motivational stance fluctuates around it.

  The poem ends where it began ("It burns here where you press, an eight") to satisfy the prompt's closure constraint, but also to refuse resolution. We land back on the bare sensation after hearing every reason why it should or shouldn't matter. The structure leaves the metaphysical question open: is the badness missing, or was it never in the sensation? N's voice is flat and reportorial to avoid framing the case as tragic or heroic; he is not enduring, he is reporting. The concrete details (chart, pill, hand) keep the thought experiment grounded in the clinic, preventing it from floating into abstraction.
