  The stalemate is verbal: both camps optimize "causation" for different functional roles, not competing metaphysical truths. Lewis seeks truth conditions for causal claims, while Pearl seeks algorithms for predicting intervention outcomes. This divergence crystallizes in preemption cases. Lewis struggles with late preemption because the effect doesn't counterfactually depend on the cause if a backup was ready; he must invoke intricate chains of dependence across possible worlds to save the intuition. Pearl handles preemption cleanly via structural equations—setting the cause to zero changes the effect—but only by assuming the mechanism's structure is already known.

  Consequently, they answer different questions: semantics versus methodology. Lewis asks, "What makes this claim true?" Pearl asks, "How do I compute the result of changing this?" Neither can disprove the other because causation isn't an observable quantity like mass; it's a theoretical construct. Overdetermination highlights this: Lewis denies causation if neither cause is necessary, while Pearl attributes fractional responsibility based on the model.

  To move the debate, we need a representation theorem demonstrating that valid Lewis-style counterfactuals map isomorphically to Pearl-style structural models under specific stability constraints. Until then, distributed systems engineers should treat them as dual tools: Lewis for post-mortem log analysis (what if?), Pearl for chaos engineering (what happens if?). The fight isn't about reality, but which tool fits the query.
