  6.  **Address Question 4: Tautology vs. Empirical Hypothesis:**
      *   *The Risk:* If any behavior can be modeled as FE minimization (even blindness), is it falsifiable?
      *   *The Defense:* The framework makes specific predictions about *neural implementation* (gain control, hierarchical error units).
      *   *Precision Specific:* If PP is true, we should see specific neural mechanisms for precision weighting (e.g., neuromodulators like acetylcholine/dopamine). If we find neurons that just "turn off" error units arbitrarily without statistical cause, PP is in trouble.
      *   *Verdict:* The objection highlights the need for constraints on *how* precision is estimated. It doesn't make PP a tautology, but it forces the theory to specify the *constraints on precision estimation*.

