answer: |-
  *   **What defenders accept:** They agree the Principal Principle (PP) is a rationality constraint: if you know the objective chance is $x$, your credence should be $x$. They agree chances are objective (same for everyone) and that you shouldn't bet on horoscopes over known physical chances.
  *   **What they call a conflation:** The post conflates *chance* with *frequency*. Defenders say PP links credence to *chance*, while frequency is merely *evidence* for chance. You follow the chance, not the tally of past tosses. They also flag the missing term "admissible." PP only holds when your other evidence is admissible (i.e., it doesn't reveal the future outcome directly). Omitting this makes the principle vulnerable to counterexamples (like crystal balls).
  *   **What they reject:** "Objective chance just is long-run relative frequency." Most defenders treat chance as a primitive property or propensity of the setup, not a summary of actual outcomes. Reducing chance to frequency is a specific metaphysical view (Humeanism) that many PP proponents explicitly argue against.
  *   **The one-off case:** This breaks the blog's *definition*, not the Principle. Since the blog defines chance as frequency, a single-trial machine has no chance. Defenders say the setup has a genuine propensity of 0.7 regardless of repeatability. Your credence should still be 0.7. The one-off nature shows the blog's metaphysics is too narrow, not that PP fails.
  *   **The horoscope conclusion:** The conclusion (horoscopes are irrational) is correct, but the reasoning is imprecise. The blog claims *all* evidence works by changing chance estimates. Defenders say *admissible* evidence does. Inadmissible evidence (like reliable foresight) would override chance. Horoscopes are dismissed because they aren't admissible evidence, not because evidence *cannot* bypass chance estimates in principle. You get the right answer, but the "why" lacks the necessary technical safeguard.
