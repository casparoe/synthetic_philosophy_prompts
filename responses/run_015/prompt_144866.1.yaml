  3.  **Evaluate Claims against Standard Philosophy of Chance (Lewisian orthodoxy):**
      *   *Claim 1 (Chance = Frequency):* Many defenders of PP (like Lewis) reject this. Chance is primitive or propensity-based, not *just* frequency. Frequencies evidence chance, but aren't identical. This is a reductionist oversimplification.
      *   *Claim 2 (PP = Set beliefs by observed frequencies):* PP connects credence to *chance*, not directly to *observed frequency*. Frequency is evidence for chance. PP applies even without observed frequencies (e.g., known physics).
