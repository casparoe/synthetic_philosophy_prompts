answer: |-
  Good evening.

  For those who do not know me, I work in software engineering. In the battalion, I serve in signals. My daily life is spent thinking about system architecture: what a network can handle at rest, and what it can handle when the load spikes.

  We are gathered here because next month the canton votes on whether to keep conscription or move to a professional force. The debate so far has focused on headlines: troop numbers, budget lines, and days of service. These are important figures. But they are metrics of *standing capacity*. They tell us what we have on a Tuesday morning.

  As an engineer, I am interested in *surge capacity*. I am interested in what the system can bring online within days when the normal rules no longer apply.

  A professional army is high standing capacity. It is always on. It is ready. A militia is high surge capacity. It is a architecture designed to scale. But I am not here to argue that a militia is militarily superior in every metric. I am here to argue that the militia is not primarily a military tool. It is a political precommitment.

  In computer science, a precommitment is a constraint you place on a system to prevent it from making a catastrophic decision under load. In politics, it is a way for a democracy to bind its future self.

  The argument for the militia is not that it is a cheap way to buy soldiers. It is that it makes the option of submission expensive for the electorate. If a large portion of the population is trained, equipped, and organized, then a decision to capitulate to an aggressor is not just a signature from a minister. It is a request to millions of citizens to lay down arms they know how to use.

  We maintain this system because we distrust the comfort of our future selves. We acknowledge that in a crisis, the temptation to pay a price in sovereignty rather than a price in blood will be overwhelming. Conscription is a mechanism to ensure that the price in blood has already been partially paid, in peacetime, so that the price in sovereignty becomes too high to accept in war.

  This is a heavy argument. I want to be clear about what it costs.

  To make this work, we coerce eighteen-year-olds. We tell them that before they can fully access the rights of citizenship, they must submit to the state's authority over their time and their bodies. We do this partly out of distrust for the person that eighteen-year-old will become. We worry that the forty-year-old version of him, comfortable and settled, will not choose to defend the state if the state has not already marked him as its own.

  That is a real moral cost. It is not erased by talking about tradition, or camaraderie, or civic virtue. It is a restriction on liberty. I feel this personally. My daughter is in this room. She chose the longer civilian-service alternative. She serves the same country, for more days, in a hospital. Her choice is valid. The system requires friction, but it should not require disrespect. We are not here to sneer at those who object. We are here to acknowledge that the obligation exists so that the option to quit does not.

  I also want to address the comparisons I know will be made in the coming weeks. You will hear about Sweden, which abolished conscription and then reinstated it. You will hear about Finland, which kept it and remains secure. Colleagues of mine will use these examples to prove opposite points.

  This proves my point about underdetermination. If the goal is simply a secure state, more than one arrangement delivers it. A professional army can deter. A militia can deter. The specific architecture is not magic. Sweden and Finland show us that security is possible under different models.

  So why keep ours? Because this model fits our specific political history. It is the architecture we have built. To rip it out is not just a budget change; it is a change in how the state relates to the citizen. If we move to a professional force, we are deciding that defense is a service provided by the state, like trash collection, rather than a condition of the citizenry. That is a legitimate political choice. But it is a choice to lower the barrier to opting out of defense.

  To the city councillor from the peace group, thank you for being here. We share the goal of peace. The disagreement is on the mechanism. I argue that a credible threat of costly resistance is the most reliable path to that peace. You may argue that reducing military posture reduces tension. We are both trying to prevent war. We just disagree on which system failure is more dangerous: the failure of deterrence, or the failure of diplomacy. I do not question your good faith. I ask only that you understand the logic of ours.

  So, when you vote next month, do not vote based on nostalgia. Do not vote based on the idea that the militia is cheaper. It is not cheap. It costs the time of our children. It costs the flexibility of our economy. It costs the liberty of the eighteen-year-old.

  Vote based on whether you believe the country needs to be bound. Whether you believe that in a moment of existential crisis, the electorate should find it physically and politically difficult to surrender.

  If you believe defense should be a profession, vote for the professional force. It is a coherent position. But if you believe defense must be a precondition of citizenship, then you must accept the friction that comes with it.

  This is not a toast to glory. There is no glory in signals work, and there is no glory in administration. There is only maintenance. We are asking the next generation to maintain a system that limits their own future options, so that those options remain open at all.

  Thank you.
