answer: |-
  This is a classic formulation of the **Problem of Infinite Ethics**, specifically targeting **Total Utilitarianism** (or any axiology that relies on summing welfare across an infinite domain). You have correctly identified the trilemma.

  The consensus among ethicists working on this problem (such as Hilary Greaves, William MacAskill, Nick Bostrom, and Peter Vallentyne) is that **Premise (3) must be rejected.**

  Here is a detailed breakdown of why (3) is the weak link, why the other options are generally considered untenable, and exactly what rejecting (3) costs you.

  ---

  ### 1. Why Rejecting (1) is a Non-Starter
  **The Cost:** Making morality contingent on empirical cosmology.

  If you reject (1), you are asserting that morality *depends* on the universe being finite. This leads to the "Cosmological Contingency" objection.
  *   **Epistemic Instability:** We do not know for certain whether the universe is spatially infinite. If morality hinges on (1) being false, then our moral obligations are currently unknown and could flip instantly upon new data from the James Webb Telescope.
  *   **Moral Absurdity:** It implies that torturing a child is permissible if the universe is infinite, but imperable if it is finite. Most philosophers agree that the wrongness of torture should not supervene on the curvature of spacetime.
  *   **Conclusion:** While logically possible, rejecting (1) is axiologically disastrous. It sacrifices the autonomy of ethics for the sake of saving a specific mathematical model of value.

  ### 2. Why Rejecting (2) is Misunderstood (but tempting)
  **The Cost:** Mathematical complexity and counter-intuitive value structures.

  You noted that rejecting (2) seems to require revising Cantorian arithmetic. This is a common misconception. We do not need to claim that $\infty + n \neq \infty$ in standard set theory. Rather, we claim that **welfare is not properly modeled by standard cardinal numbers.**

  *   **Non-Standard Analysis:** Philosophers like Nick Bostrom and Christian Tarsney have explored using **hyperreal numbers** or **surreal numbers** to model utility. In these systems, you can have different "sizes" of infinity (e.g., $\infty + 1 > \infty$).
  *   **The Problem:** While this saves the "Total View," it introduces severe technical complications. It often leads to violations of standard dominance principles (e.g., the "Pareto Principle" becomes tricky to define over infinite sets). Furthermore, it requires us to accept that value has a mathematical structure far more complex than anything we encounter in finite decision theory.
  *   **Conclusion:** This is a live research program, but it is technically demanding and arguably ad hoc. It tries to save the theory by changing the math rather than the ethics.

  ### 3. Why Rejecting (3) is the Standard Solution
  **The Cost:** Abandoning the "Total View" of Consequentialism.

  Premise (3) states: *An act is morally right or wrong only if it makes a difference to the overall value of the world.*

  This premise encodes **Total Utilitarianism** (the view that the value of a world is the sum of the welfare of all beings within it). In an infinite universe, the sum is undefined or invariant under finite changes. Therefore, to save morality, we must reject the idea that *total sums* are the sole metric of rightness.

  Here are the three main ways philosophers reject (3):

  #### A. The Person-Affecting View (or Restrictive Consequentialism)
  Instead of asking "Does this increase the total sum of good?", we ask "Does this make any *particular* person better or worse off?"
  *   **How it solves the paradox:** Even if the total sum of welfare in the universe is infinite, torturing a child makes *that child* worse off. The act is wrong because it harms a specific subject, not because it lowers the global aggregate.
  *   **The Cost:** This view struggles with "Non-Identity Problems" (actions that change *who* comes into existence). It also requires explaining why we shouldn't care about the "impersonal" badness of a world with more suffering, even if no specific existing person is harmed.

  #### B. Spatiotemporal Parochialism (The "Causal Horizon" View)
  We restrict the moral domain to the **causal future** of the agent.
  *   **How it solves the paradox:** We can only causally influence a finite region of spacetime (our light cone). Therefore, for the purpose of moral calculation, the "relevant world" is always finite, even if the physical universe is infinite. The infinite beings outside our causal horizon are morally irrelevant because we cannot affect them.
  *   **The Cost:** This feels somewhat arbitrary. Why does moral status depend on causal connectivity? If there is an exact duplicate of you suffering in a disconnected pocket of the multiverse, does their suffering truly carry *no* moral weight?

  #### C. Average Utilitarianism or Rank-Dependent Views
  *   **Average Utilitarianism:** Value is determined by the *average* welfare, not the sum. Adding a finite amount of suffering to an infinite universe might not change the average if the limit is well-defined, but local changes can shift local averages. (Note: Average utilitarianism has its own severe paradoxes, such as the "Mere Addition Paradox").
  *   **Prioritarianism/Rank-Dependent:** We prioritize the worst-off. In an infinite universe, there may be infinitely many beings at every welfare level. However, we can focus on improving the welfare of those within our reach without needing to sum the total.

  ### 4. What Exactly Does Rejecting (3) Cost?

  If you reject (3), you are conceding that **Consequentialism (specifically the Total View) is incomplete or false.**

  1.  **Loss of Simplicity:** Total Utilitarianism is elegant. It reduces all morality to a single maximization function ($Max \sum W$). Rejecting (3) forces you to adopt a more complex axiology (e.g., agent-relative constraints, person-affecting restrictions, or non-aggregative values).
  2.  **The "Intensional" Shift:** You move from an **extensional** view of value (looking at the whole world-state) to an **intensional** or **local** view (looking at the specific action and its immediate victims/beneficiaries).
  3.  **Deontological Concessions:** Often, rejecting (3) brings you closer to Deontology. If the rightness of an act doesn't depend on the *outcome's total value*, but rather on the *nature of the act* or its *local impact*, you are adopting a non-consequentialist framework.

  ### Summary Recommendation

  You should hold onto **(5)** (our moral intuitions are robust) and reject **(3)**.

  *   **Do not bet on cosmology (1).** Morality must be robust against physical discovery.
  *   **Do not fight Cantor (2).** Math is math; value is not necessarily cardinal numbers.
  *   **Do revise your axiology (3).** Accept that "making the world better" does not mean "increasing the transfinite sum of welfare." It means "improving the lot of those you can affect" or "acting in accordance with principles that respect persons."

  The argument you encountered is essentially a *reductio ad absurdum* of **Total Utilitarianism in an infinite context**. The philosophical community largely accepts this *reductio*. The cost is giving up the dream of a simple, universal sum-maximizing ethical calculus, but the benefit is saving morality from cosmological nihilism.

  **Recommended Reading:**
  *   Hilary Greaves, "The Problem of Infinite Ethics" (Oxford)
  *   Nick Bostrom, "Infinite Ethics" (2011)
  *   William MacAskill, "The Paradox of Infinite Ethics" (in *Doing Good Better* context or academic papers)
  *   Peter Vallentyne & Shelly Kagan, "Infinite Value and Finitely Additive Value Theory"
