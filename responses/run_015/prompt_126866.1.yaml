answer: |-
  I accept the third horn without hesitation: I know my own phenomenal states, and I maintain the inertness of those states without conceding that my view is self-stultifying. What I reject is your first option: the requirement that knowledge involve a *causal* link between belief and truth-maker. You are presupposing a causal theory of knowledge that begs the question against epiphenomenalism. My view is that knowledge of consciousness is a matter of acquaintance, where the judgment is constituted by the experience itself rather than caused by it. In this framework, the "non-accidental" link you demand is secured not by causal dependence, but by metaphysical constitution: the experience does not stand over against the judgment as a cause to an effect; it is the very stuff of the judgment. Therefore, the inertness of the phenomenon is compatible with the immediacy of the knowledge, because the knowledge relation is not a transaction between distinct existences but a self-intimation of the experience.

  Regarding your swap case: you conflate the physical utterance with the mental judgment. In your scenario, the physical realizer indeed produces the same sonic output ("I see red") because its functional profile is fixed, but the content of the mental judgment shifts because content is fixed by the phenomenal property, not the functional role. Tomorrow, your body will say "red" while your mind knows "green." This means your physical avowals become unreliable indicators of your mind, but it does not mean your mind is ignorant. You know you are experiencing green because the experience of green constitutes the judgment. The tragedy of the swap is not that you lose knowledge, but that the physical shadow cast by your brain no longer matches the light of your consciousness. This is not self-stultifying; it merely entails that while I am infallible about my experience, my physical body may lie about it.
