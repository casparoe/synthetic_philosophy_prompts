  To resolve the tension between your 'neuro-signal' and 'synthetic emerald' intuitions, you need an argument that tests whether **social practice** or **causal structure** is the ultimate arbiter of reference when the two come apart.

  The argument that would change my mind—and unify your view—is the **"Causal-Explanatory Priority" argument**.

  **The Argument:**
  Semantic reference is fixed not by what a community *says* they are tracking, nor by what they *intend* to track, but by the underlying property that **causally explains the successful use** of the term.
  1.  **In the 'neuro-signal' case:** Scientists intended to track brainwaves, but the *artefact* was the actual cause of the scanner readings. The term's successful application (predicting scanner output) was sustained by the artefact, not the brainwave. Therefore, reference shifted to the artefact. You interpret this as "social practice wins" because the scientists agreed to the shift. However, if the scientists had *refused* to agree and insisted it was a brainwave despite the evidence, the term would still fail to refer to brainwaves in rigorous contexts. The *world* forced the shift; practice merely ratified it.
  2.  **In the 'emerald' case:** The chemical structure (beryl + chromium) causally explains the stone's hardness, color, and refractive index. The Twin Earth jewellers' distinction (mined vs. synthetic) is based on *history* and *value*, not the physical properties that make the stone an 'emerald' in a mineralogical sense. If 'emerald' is a natural kind term (like 'water'), its reference is fixed by the microstructure that explains its observable cluster. The Twin Earth practice is imposing a commercial classification on a natural kind.

  **The Unification:**
  Both cases are actually instances of **Causal-Structural Externalism**. In both, the "hidden structure" (the actual cause of the signal; the chemical essence of the stone) determines reference. The apparent conflict arises only because you misidentified the driver in the 'neuro-signal' case as "social practice." It was not practice that fixed the reference; it was the causal discovery that *constrained* practice.

  **The Sacrifice:**
  To maintain this unified principle, you must drop the **neuro-signal social-practice reading**. You must accept that social practice does not *fix* reference in scientific terms; it only *tracks* the causal structure. If practice diverges from structure (as in the Twin Earth emerald case), structure wins. If practice aligns with structure (as in the neuro-signal case), structure still wins; practice is just along for the ride.

  Verdict: A unified principle exists (Causal-Explanatory Priority), and it sacrifices the neuro-signal social-practice reading by reclassifying it as a victory for causal structure.
