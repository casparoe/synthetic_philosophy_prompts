answer: |-
  # Teaching Plan: Frame, Outer, and Inner Messages

  ## 1. Dependency Order of Introduction
  To prevent the hierarchy from collapsing in the participants' minds, the three levels must be introduced sequentially, establishing the necessity of each prior layer before revealing the next. Do not reveal the "Inner Message" until the "Outer Message" has been fully processed.

  *   **Step 1: The Frame Message (Contextual Trigger).**
      *   **Goal:** Establish that the object is *intended* to carry meaning, distinguishing it from noise or a natural object.
      *   **Logic:** Without the Frame, there is no motivation to search for a code. If participants view the object as a mere tool or decoration, the subsequent layers are invisible.
      *   **Instruction:** Introduce the physical object first. Ask, "How do you know this is meant to be read rather than used?" Establish that the Frame is the signal that says, "I am a message."

  *   **Step 2: The Outer Message (Structural Instruction).**
      *   **Goal:** Reveal the mechanism or syntax required to extract meaning.
      *   **Logic:** The Outer Message is not the meaning itself; it is the *rule set* for finding the meaning. It must be presented as a set of instructions embedded in the structure.
      *   **Instruction:** Once the Frame is accepted, ask, "How do we read this?" Reveal the decoding key or structural rule. Emphasize that this layer dictates the *process*, not the *content*.

  *   **Step 3: The Inner Message (Semantic Content).**
      *   **Goal:** Reveal the actual information conveyed once the rules are applied.
      *   **Logic:** This is the dependent variable. It cannot exist without the Outer Message, which cannot be accessed without the Frame.
      *   **Instruction:** Apply the Outer Message rules to the object. Only now reveal the resulting content. Emphasize that this layer is the *result* of the interaction between the observer and the previous two layers.

  ## 2. Concrete Carrying Example: The "Codex with a Key Page"
  Use a hypothetical **"Self-Decoding Codex"** (a small booklet). This example is tactile, text-based (fitting the reading group context), and distinct from biological or audio examples.

  *   **The Object:** A small, leather-bound booklet found in a sealed box.
  *   **The Frame Message:** The **binding and the box**.
      *   *Description:* The booklet is placed in a velvet-lined box with the word "ARCHIVES" stamped on the lid. The booklet itself has a title page that reads "Instructions for Decoding."
      *   *Function:* This signals that the object is not a blank notebook or a weapon, but a preserved communication intended for a reader. It triggers the "interpretive stance."
  *   **The Outer Message:** **Page 1 of the Codex**.
      *   *Description:* The first page does not contain a story. Instead, it contains a diagram and a rule: "To read the message, ignore all text in italics. Read only the text in **bold**."
      *   *Function:* This is the instruction for decoding. It is part of the physical book (the medium) but serves as the algorithm. It explicitly instructs its own interpretation.
  *   **The Inner Message:** **The bolded text on Pages 2–10**.
      *   *Description:* When the rule from Page 1 is applied to the subsequent pages, the bolded words form a coherent sentence (e.g., "THE TREASURE IS BURIED UNDER THE BRIDGE"), while the italicized text is meaningless noise.
      *   *Function:* This is the semantic payload. It is structurally embedded because it relies entirely on the selection rule provided in the Outer Message.

  ## 3. Misconceptions and Defusal Points
  Anticipate these three specific errors and address them at the precise moment they are likely to arise during the session.

  *   **Misconception 1: The Frame is "Hidden Content."**
      *   *Risk:* Participants will treat the box or the binding as a puzzle to be solved (e.g., "What does the velvet mean?") rather than a context setter.
      *   *Defusal Point:* **During Step 1 (Frame Introduction).**
      *   *Intervention:* Explicitly state: "The Frame does not tell you *what* the message says; it tells you *that* there is a message. If you spend time analyzing the velvet, you are mistaking the context for the content. The Frame's only job is to stop you from throwing the book away."
  *   **Misconception 2: Authorial Intent vs. Structural Frame.**
      *   *Risk:* Participants will argue, "The Frame is whatever the author *intended*," leading to subjective speculation about the creator's mind rather than the object's structure.
      *   *Defusal Point:* **During the transition from Step 1 to Step 2.**
      *   *Intervention:* Clarify: "We are not discussing what the author *felt* when making this. We are discussing what the object *does*. The Frame is structural—it is the feature that forces the observer into the role of 'decoder.' If the box said 'Trash,' the Frame would tell you to ignore it. Intent is irrelevant; structural function is everything."
  *   **Misconception 3: The Inner Message is Merely Implicit.**
      *   *Risk:* Participants will claim the Inner Message was "always there" in the ink, and the Outer Message is just a helpful hint.
      *   *Defusal Point:* **During Step 3 (Inner Message Reveal).**
      *   *Intervention:* Challenge this by asking: "If you remove Page 1 (the Outer Message), does the Inner Message still exist?" The answer must be "No." Without the rule, the bold text is visually indistinguishable from the noise. The Inner Message is not implicit; it is *relational*. It only emerges through the application of the Outer Message.

  ## 4. Diagnostic Check for Relational Dependency
  Do not ask participants to simply label the parts (e.g., "Which part is the Frame?"). This tests memory, not understanding. Instead, use a **Counterfactual Scenario** to test if they grasp the *dependency* between the levels.

  *   **The Test:** Present the following modification to the Codex example:
      *   *"Imagine we take the exact same booklet, but we re-bind it in a cover that says 'SKETCHPAD' (changing the Frame), and we replace Page 1 with a drawing of a flower (removing the Outer Message instructions), but we leave the bold and italic text on Pages 2–10 exactly the same."*
  *   **The Question:** *"In this modified version, has the Inner Message changed?"*
  *   **Correct Understanding:** The participant should answer that the Inner Message is **lost or non-existent**, even though the ink on the pages is identical.
  *   **Reasoning Required:** They must explain that without the Frame, no one looks for a code, and without the Outer Message (the rule), the bold text cannot be distinguished from the noise. The Inner Message is not the ink; it is the *decoded result*. If they answer "The message is the same, we just can't read it," they have failed to grasp that the message *resides in the decoding relationship*, not the physical medium.

  ## 5. Bracketing: Out-of-Scope Concepts
  To maintain the clarity of the three-level hierarchy, you must explicitly declare the following concepts out of scope for this session.

  *   **Concept to Bracket:** **Strange Loops and Self-Reference.**
      *   *Declaration:* "Today we are treating the Frame, Outer, and Inner messages as a strict hierarchy where the Frame is outside the system. Later in the book, Hofstadter discusses what happens when the Inner Message talks about the Frame, or the Outer Message decodes itself. We are not discussing that today."
      *   *Reason for Exclusion:* The distinction you are teaching relies on a clean separation of levels (Frame > Outer > Inner). Strange Loops occur when these levels fold back on each other (e.g., the Inner Message *becomes* the Frame). Introducing this now would collapse the hierarchy you are trying to build. If participants think the levels can merge, they will not understand the dependency order required to decode a standard message.
  *   **Concept to Bracket:** **Gödel Numbering / Formal Systems.**
      *   *Declaration:* "We are discussing meaning in physical objects, not mathematical proofs. Do not worry about how this applies to number theory."
      *   *Reason for Exclusion:* Formal logic introduces a level of abstraction that distracts from the phenomenological experience of decoding. The goal is to understand how meaning is *constructed* by the observer using structural cues, not how truth is *proven* within a system.

