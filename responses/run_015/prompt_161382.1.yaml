      *   **Core Problem:** Total-welfare maximization (utilitarianism) fails the "addressability" constraint (telling someone "you were outweighed" feels like treating them as a means, not a separate person).
      *   **Task:** Write a set of *desiderata* for an adequate account of aggregation across persons.
      *   **Specific Cases to Address:**
          1.  Many-vs-One Rescue (5 vs 1).
          2.  Transplant Case (using one as a resource).
          3.  Trivial Benefits (many small vs one serious).
