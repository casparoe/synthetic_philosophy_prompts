      *   Lottery: "Fair chance." (Passes).

  7.  **Addressing the Specific Cases in the Desiderata:**

      *   *Many-vs-One:* Must yield a verdict.
      *   *Transplant:* Must distinguish harming vs. not helping.
      *   *Trivial:* Must set a limit on aggregation.
      *   *Different People:* Must handle disjoint sets (Population Ethics lite).
      *   *Gerrymandering:* Assess validity.

  8.  **Structuring the Response:**

