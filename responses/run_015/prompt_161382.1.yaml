answer: |-
  ### Desiderata for an Adequate Account of Aggregation

  You are asking for a moral technology that can survive contact with reality. The following specifications are designed to filter out theories that are either morally inert (paralysis) or morally offensive (instrumentalization), while remaining executable by a committee with limited information.

  #### 1. The Verdict Requirement (Non-Paralysis)
  *   **Case:** The Many-versus-One Rescue. You can save five strangers from death or one stranger from death. You cannot save all six.
  *   **Consideration:** An institution that cannot choose is a failed institution. A theory that declares the choice "impermissible" or "undecidable" fails the basic function of a relief fund. The theory must yield a determinate action.
  *   **Status:** **Non-negotiable.**

  #### 2. The Means/Ends Boundary (Non-Instrumentalization)
  *   **Case:** The Transplant. One healthy person can be killed to harvest organs that save five others. The numbers match the Rescue case, but the mechanism differs.
  *   **Consideration:** There is a moral distinction between *aggregating benefits across recipients* and *using one person as a resource for others*. A theory that treats these cases identically fails to capture the constraint that persons are ends in themselves. The refusal to aggregate must not generalize into a refusal to distinguish between harming and not-helping.
  *   **Status:** **Non-negotiable.**

  #### 3. The Addressability Constraint
  *   **Case:** The Written Refusal. You must explain to the single claimant in the Rescue case why they were not saved.
  *   **Consideration:** "Your loss was outweighed by the greater sum of benefits" treats the claimant as a container of value rather than a sovereign life. An adequate justification must be statable in the second person without implying the addressee was merely a vessel for utility. It must appeal to a principle they could acknowledge as a co-legislator of the protocol, not merely as a subject of calculation.
  *   **Status:** **Non-negotiable** (given your institutional constraint).

  #### 4. The Triviality Threshold
  *   **Case:** Aggregation of Small Benefits. Can enough minor headaches prevented justify letting one person suffer permanent paralysis?
  *   **Consideration:** If numbers always count, severity loses its traction. If numbers never count, we face paralysis in large-scale minor disasters. The theory must specify where, if anywhere, the aggregation of trivial benefits is blocked by a single serious harm.
  *   **Status:** **Preference of the Separatist Camp.** (Utilitarians reject this; Separatists require it).

  #### 5. The Divisible-Pool Consistency
  *   **Case:** One Large vs. Five Small. One claimant needs \$100k to avoid ruin; five claimants need \$15k each to avoid ruin. The total sum favors the five.
  *   **Consideration:** This tests whether the theory is sensitive to the *shape* of the benefit or just the *sum*. If the theory treats money as a proxy for welfare, it risks collapsing into Summation. If it treats the claim as a right to a stake, it risks ignoring the total good. The theory must explain why the division of the pool matters morally.
  *   **Status:** **Non-negotiable** (for consistency).

  #### 6. The Different-People Neutrality
  *   **Case:** Disjoint Sets. Option A saves Group X. Option B saves Group Y. No one exists in both groups. No one is made worse off in either scenario (since the unsaved do not exist to be worsened).
  *   **Consideration:** You asked if "no one is made worse off" does the work "no one is used" did in the Transplant case. It does not. In the Transplant, the one is *worsened* (killed). In Different-People, the unsaved are simply *not benefited*. A theory must decide if we have stronger duties to specific identifiable lives than to abstract sets of lives. If the theory says "it doesn't matter," it risks indifference to identity; if it says "it matters," it risks arbitrariness.
  *   **Status:** **Preference of the Contractualist Camp.**

  ---

  ### Assessment of Additional Requirements

  #### 7. Invariance Under Re-Description (No-Gerrymandering)
  *   **Requirement:** Verdicts should not change if we describe one long-lived claimant as two successive claim-stages, or if a household of five files as one unit or five units.
  *   **Assessment:** **This is a Trap.**
      *   *Reasoning:* If you take the "Separateness of Persons" seriously, the *count* of persons is morally significant (e.g., in a lottery, each person gets a ticket). If the definition of a "person" is mutable (e.g., a household can incorporate or dissolve), a theory that weights by heads will yield different verdicts based on administrative description.
      *   *Verdict:* You cannot have both strict Separateness (which weights by person) and Invariance (which ignores person-boundaries). A separatist theory *must* be sensitive to how persons are individuated. Demanding invariance here forces you to abandon the core insight that persons are separate units of moral concern. Drop this desideratum or accept that your protocol requires a fixed, legalistic definition of "claimant" that overrides moral metaphysics.

  #### 8. Operational Constraints (Ordinality & Strategy-Proofness)
  *   **Requirement:** The theory must work with self-reported, ordinal, noisy data and prevent claimants from gaming the system (splitting/merging claims).
  *   **Assessment:** **This is a Hard Constraint.**
      *   *Reasoning:* Most sophisticated moral theories (Prioritarianism, Leximin) require cardinal, interpersonally comparable welfare levels to determine who is "worst off." You do not have this. You have names and stories. Furthermore, if the rule rewards splitting claims (to increase the "head count" in a separatist view), you will incentivize fraud.
      *   *Verdict:* This eliminates any theory relying on precise welfare measurements. It favors rules based on *categories* of need (e.g., "life-threatening" vs. "non-essential") rather than continuous scales.

  ---

  ### Impossibility Results: Where the Theory Breaks

  You suspected conflicts between Separatism/Gerrymandering and Addressability/Level-Down. Here is the actual topology of the impossibility:

  **1. The Separatism/Gerrymandering Conflict (Confirmed)**
  Your suspicion is correct. If moral weight attaches to *persons* (Separatism), and the boundaries of persons are fluid (Gerrymandering), the moral weight shifts. You cannot satisfy "No-Gerrymandering" without ceasing to be a strict Separatist. A Separatist theory *rewards* re-description if that re-description increases the number of moral units.
  *   *Resolution:* You must fix the unit of claimancy legally (e.g., "one application per household") and treat that as a proxy for the moral person, acknowledging this is an administrative fiction.

  **2. The Addressability/Aggregation Conflict (The Real Hard Problem)**
  Your second suspicion (Addressability vs. Level-Down) is less critical than the conflict between **Addressability** and **Non-Paralysis in Asymmetric Cases**.
  *   *The Impossibility:* If you cannot tell a rejected claimant "you were outweighed" (Addressability), and you must save the five over the one (Non-Paralysis/Rescue Verdict), you have no language left.
      *   If you say "We flipped a weighted coin," the one asks "Why was the coin weighted?"
      *   If you say "Five lives are more important," you violate Separateness.
      *   If you say "We maximized the good," you violate Addressability.
  *   *The Exclusionary Requirement:* **Addressability** does the most work in excluding candidate theories. It rules out straightforward Summation immediately. It puts immense pressure on Prioritarianism (which still tells the loser "your urgency was less than their sum"). The only view that survives Addressability easily is a **Fair Chance (Lottery)** view, but that view often fails the Rescue Verdict (intuitively, we should save the five).

  **3. The Operational/Priority Conflict**
  You cannot run a **Priority to the Worst-Off** view with ordinal, self-reported data. To prioritize the worst off, you must compare the *magnitude* of their deficit against others. Self-reports allow claimants to exaggerate severity. Without cardinal verification, Priority collapses into "First-Come-First-Served" or "Most Vocal."

  ---

  ### Scorecard of Candidate Families

  **1. Straightforward Summation (Utilitarianism)**
  *   **Verdict:** **Fail.**
  *   **Reasoning:** It satisfies Non-Paralysis and Operational Constraints well (easy to sum). However, it catastrophically fails Addressability and the Means/Ends Boundary. Telling a claimant "you were sacrificed for the net total" is precisely the refusal your committee wishes to avoid. It also fails the Transplant test.

  **2. Refusal to Aggregate (Fair Chances/Lottery)**
  *   **Verdict:** **Partial Pass.**
  *   **Reasoning:** This satisfies Addressability ("You lost a fair toss") and Separateness (each person counts as one). However, it struggles with the Rescue Verdict (saving 1 instead of 5 via lottery feels like institutional negligence) and the Trivial Benefits case (it gives no guidance on severity). It is also vulnerable to Gerrymandering (splitting claims increases lottery tickets).

  **3. Priority to the Worst-Off (Prioritarianism/Leximin)**
  *   **Verdict:** **Fail (Operational).**
  *   **Reasoning:** Morally, this is the strongest contender for Separateness and Addressability ("You were less urgent"). However, it fails your Operational Constraints. It requires cardinal interpersonal comparisons of welfare which you do not have. With self-reported data, it incentivizes claimants to present themselves as the absolute worst off, inviting fraud.

  **4. Sufficiency-Threshold View**
  *   **Verdict:** **Best Fit.**
  *   **Reasoning:** This view holds that we must bring everyone up to a "sufficient" level of functioning; above that, aggregation is permissible, below that, urgency rules. It handles Addressability ("You are already above the threshold; they are below"). It handles the Transplant case (thresholds protect bodily integrity). It handles Operational Constraints (easier to verify "do you have shelter/food?" than "how much utility do you have?"). Its weakness is the "Cliff Edge" (just below threshold gets everything, just above gets nothing), but this is administratively manageable compared to the other failures.
