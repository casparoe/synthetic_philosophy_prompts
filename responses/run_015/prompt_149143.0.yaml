  # Joint Statement on Rationality in Parfit's Hitchhiker
  **Collaborators:** Causal Decision Theorist (CDT) and Disposition-Rationalist (DR)

  ### I. Agreed Claims Regarding the Original Scenario

  1.  **Scenario Structure:** The hitchhiker is stranded in the desert. A driver offers a ride to town on the condition that the hitchhiker will pay $100 upon arrival. The driver possesses a highly reliable ability to predict whether the hitchhiker will pay before deciding to offer the ride.
  2.  **Sequential Nature:** The driver's prediction and decision to rescue occur *before* the hitchhiker is physically capable of making the payment. Once in town, the payment decision cannot causally influence the fact of having been rescued.
  3.  **Payoff Structure:** The value of being rescued significantly exceeds the cost of the $100 payment. Being rescued without paying yields the highest material payoff for the hitchhiker, but results in the driver refusing the ride initially (given the driver's predictive reliability).
  4.  **Normative Verdict:** A rational agent ought to pay the $100 upon arrival in town. Refusing to pay is irrational.
  5.  **Predictive Reliability:** In the base case, the driver's prediction is treated as effectively deterministic for the purpose of establishing the link between the hitchhiker's disposition/algorithm and the rescue outcome.

  ### II. Disagreements Table

  | Issue | Causal Decision Theorist (CDT) Position | Disposition-Rationalist (DR) Position |
  | :--- | :--- | :--- |
  | **Source of Rationality** | Paying is rational because the *policy* selected ex-ante causally produced the rescue. The token act of paying is the necessary execution of that causal chain. | Paying is rational because it instantiates a trustworthy character. Rationality requires maintaining a disposition that does not corrode through hypocrisy. |
  | **Counterfactual Dependence** | If the agent were the *type* who does not pay, they would not be in town. The current act confirms the causal type that secured the ride. | If the agent does not pay, they become a liar. The rescue is a sunk benefit; the moral weight rests entirely on the integrity of the current choice. |
  | **Temporal Focus** | Rationality tracks the causal efficacy of the decision *function* across time, linking the future payment to the past rescue via the ex-ante selection. | Rationality tracks the alignment of the *current self* with a virtuous ideal. Backward-looking causal links are irrelevant to the present duty. |
  | **Stochastic Commitments** | A probabilistic commitment is valid if it optimizes the expected causal output of the policy (e.g., paying 90% of the time if it maximizes rescue odds). | A probabilistic commitment to a promise is inherently defective. A trustworthy disposition requires deterministic resolve, regardless of strategic optimization. |

  ### III. The Noisy Sensor Twist

  **Scenario Modification:** The driver no longer predicts perfectly. Instead, the driver uses a sensor to detect the hitchhiker's commitment. The sensor has a **10% false-positive rate** (it indicates "Will Pay" even when the hitchhiker is committed to "Do Not Pay"). The hitchhiker can pre-commit to a probabilistic payment rule (e.g., "I will pay with probability $P$").

  **Predictions on Rational Action:**

  *   **CDT Prediction:** The rational agent should calculate the optimal probability $P$. Since the sensor is noisy, the causal leverage of paying is diluted. The agent should set $P$ such that the marginal cost of paying equals the marginal increase in rescue probability multiplied by the value of rescue. If the cost is high relative to the 10% noise margin, $P$ may be less than 1.
  *   **DR Prediction:** The rational agent should set $P = 1$ (100% commitment). Adopting a probabilistic rule for keeping a promise corrupts the disposition of trustworthiness. The sensor's error rate is external to the agent's character; acting on a loophole provided by sensor noise is an exercise in cunning, not rationality.

  **Parameter Shift Bearing on the Dispute:**

  *   **Shift:** Increase the sensor false-positive rate from **10% to 40%**.
  *   **Joint Agreement on Impact:** Both collaborators agree that this shift critically tests the divergence between their theories.
      *   The **CDT** acknowledges that at 40% error, the causal link between the payment policy and the rescue is sufficiently weakened that a rational agent might rationally choose $P = 0$ (never pay), as the ex-ante causal benefit no longer outweighs the cost.
      *   The **DR** maintains that the obligation to pay remains unchanged regardless of the sensor's accuracy, as the duty stems from the promise itself, not the efficacy of the prediction.
      *   **Conclusion:** This parameter shift isolates the crux: whether rationality is contingent on the *efficacy of causal influence* (CDT) or the *inviolability of character* (DR).
