prompt: |-
  I'm in the last year of a PhD in behavioural ecology, writing the synthesis chapter of a thesis on cooperation, and I've realised I don't actually have a specification for what I want out of a theory in this area — only a set of half-articulated demands that my committee keeps invoking inconsistently. So before I write the chapter I want the desiderata stated properly: what any adequate theory of the evolution of cooperation has to deliver, with the case or consideration behind each requirement. The purpose I care about is diagnostic rather than merely narrative. My empirical chapters are on a set of field systems (a cooperative breeder with high extra-group dispersal, and an interspecific mutualism where the benefit to the recipient arrives months after the actor has paid the cost and often accrues to a different individual than the one who was helped). What I need from a theory is the ability to license — or to refuse to license — an inference from field data to a mechanism: given helping rates, relatedness estimates, interaction structure and the timing of costs and benefits in a natural population, which mechanism is operating, and what would I have to measure to tell? That is my standard of adequacy, and I'd like the list built for it, not for the standard of "explains why cooperation exists somewhere" or "is elegant in a model."

  Here is the material I think the criteria have to come out of, roughly in the order it started bothering me. (i) One-shot anonymous encounters: humans in the lab cooperate well above zero in a single anonymous prisoner's dilemma with no future and no reputation, and I don't know whether that is data for a theory of cooperation or noise generated by a psychology built for repeated life. (ii) The unknown horizon: in every real system the continuation probability is not known to the players, only to me, so a strategy that needs the players to know the shadow of the future is asking for something nature doesn't provide. (iii) Misimplementation: in my mutualism the helping act fails independently of the helper's effort maybe a fifth of the time, so a partner cannot condition on realised benefit — and relatedly, benefits are decoupled from costs across individuals, which breaks the feedback loop that partner-fidelity accounts lean on. (iv) No recognition: in the cooperative breeder I cannot find any evidence that helpers discriminate among the adults they assist, yet helping is strongly assortative with respect to something. (v) Large groups: dyadic reciprocity machinery does not obviously scale to the n-player public-goods structure that most of the interesting cases have. (vi) Private, noisy assessment: in my own simulations, once assessment of reputations is private rather than public, the plain image-scoring style of norm stops sustaining cooperation, and the more demanding norms that survive require cognitive and informational machinery I would be embarrassed to attribute to my study animals. (vii) Second-order free riding: any account that stabilises cooperation by punishment has to explain why the punishers aren't undercut. (viii) Payoff non-transparency: the players don't observe each other's payoffs, only their own, plus noisy cues. (ix) The definitional case: some of what gets called 'cooperation' is mutualism or a byproduct of self-interested behaviour, where there is no puzzle at all, and I want a theory to be able to say when the puzzle dissolves rather than to explain a case that never needed explaining. (x) The bookkeeping constraint: as far as I can tell, every mechanism works by arranging either genetic relatedness or a fitness feedback from the recipient's benefit back to the actor, so a candidate that seems to produce cooperation from random interaction without either is probably hiding assortment in its assumptions. I take (x) to be a consistency constraint rather than a desideratum, but I want you to tell me if I'm wrong about that.

  What I'd like from you, then, is the list: the requirements, which cases or considerations motivate each, and — this is the part I expect to be most useful — which of the things people in this literature demand are genuine desiderata and which are prejudices of one camp (for instance, is it a real requirement that a theory specify an explicit decision rule and cue set, or is that just what the reciprocity people are used to building? is demanding that a single mechanism cover all species a requirement or a taste for unification? is identifiability from observational data a fair demand, or does it just penalise theories that are permissive about mechanism?). Then flag any subset you think cannot be jointly satisfied — I suspect something like "explain cooperation in genuinely one-shot, anonymous, non-kin interactions" plus "be stable against invasion by unconditional defectors" plus "invite no assortment" is inconsistent, and I want to know which is the right one to drop and what dropping it costs me — and say which single requirement does the most work in knocking out candidates, since that is the one my chapter should be organised around. Only after that, and briefly, would I like a scorecard: direct reciprocity, indirect reciprocity, kin selection and inclusive fitness, partner choice and biological markets, byproduct mutualism, and multilevel selection, each in a few lines against the list. Keep the weight on the criteria and their motivating cases rather than on the scoring; I can do the scoring myself, and my committee will argue about it anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Final-year PhD candidate in behavioural ecology.
      *   **Task:** Writing the synthesis chapter of a thesis on cooperation.
      *   **Problem:** Lacks a clear specification for what constitutes an "adequate theory" of cooperation. Committee invokes inconsistent demands. Needs a set of *desiderata* (requirements) derived from specific empirical and theoretical pain points.
      *   **Goal:** Diagnostic utility. The theory must license or refuse inferences from field data (helping rates, relatedness, structure, timing) to mechanisms.
      *   **Input Material:** Ten specific points of friction (i-x), ranging from one-shot human experiments to bookkeeping constraints.
      *   **Output Requirements:**
          1.  A list of requirements (desiderata) with motivations drawn from the input.
          2.  Distinction between genuine desiderata and camp-specific prejudices.
          3.  Identification of incompatible subsets (trade-offs).
          4.  Identification of the "most work-doing" requirement (the organizing principle).
          5.  A brief scorecard of major theories (Direct/Indirect Reciprocity, Kin Selection, Partner Choice, Byproduct, MLS) against the list.
      *   **Tone:** Rigorous, analytical, academic but practical, respecting the user's expertise (no hand-holding on basic concepts).

  2.  **Deconstruct the Input Material (i-x):**
      *   (i) One-shot anonymous human cooperation: Challenges strict self-interest/reciprocity. Is it noise or signal?
      *   (ii) Unknown horizon: Players don't know $\delta$ (continuation prob). Challenges Direct Reciprocity (Tit-for-Tat requires shadow of the future).
      *   (iii) Misimplementation/Delayed/Decoupled benefits: Challenges partner fidelity feedback. Noise in execution.
      *   (iv) No recognition: Challenges discrimination-based models (kin recognition, partner choice). Assortativity exists without active discrimination.
      *   (v) Large groups: Challenges dyadic models (n-player problems).
      *   (vi) Private/noisy assessment: Challenges Indirect Reciprocity (reputation requires public info). Cognitive load issues.
      *   (vii) Second-order free riding: Challenges Punishment models (who punishes the non-punishers?).
      *   (viii) Payoff non-transparency: Players see cues, not payoffs. Challenges rational choice/game theoretic assumptions.
      *   (ix) Definitional case: Distinguish true cooperation (costly) from mutualism/byproduct.
      *   (x) Bookkeeping constraint: Conservation of fitness. Needs Relatedness ($r$) or Feedback ($w$). Assortment must be accounted for.

  3.  **Drafting the Desiderata (The "List"):**
      *   *Constraint 1: Identifiability.* (From the prompt's core goal). A theory must map observable parameters to mechanisms.
      *   *Constraint 2: Informational Parsimony.* (From ii, vi, viii). Agents shouldn't need god-like knowledge (horizons, payoffs, public reputation).
      *   *Constraint 3: Robustness to Noise.* (From iii, vi). Implementation error and assessment error shouldn't collapse the equilibrium.
      *   *Constraint 4: Scalability.* (From v). Must handle $n > 2$.
      *   *Constraint 5: Stability against Higher-Order Exploitation.* (From vii). Punishment needs to be stable.
      *   *Constraint 6: The Bookkeeping Principle.* (From x). Must account for where the fitness return comes from ($r$ or feedback).
      *   *Constraint 7: Definitional Clarity.* (From ix). Must distinguish cooperation from mutualism.

  4.  **Filtering Desiderata vs. Prejudices:**
      *   *Explicit Decision Rules:* Prejudice. Animals use heuristics, not necessarily calculated strategies.
      *   *Single Mechanism Unification:* Prejudice. Pluralism is likely more accurate.
      *   *Identifiability from Observational Data:* Genuine Desideratum (for *this* user's purpose), though theoretically hard. It's the core of their thesis goal.
      *   *Cognitive Realism:* Genuine Desideratum. Don't attribute calculus to insects/birds.

  5.  **Analyzing Incompatibilities (The "Trilemma"):**
      *   The user suspects: One-shot + Anonymous + Non-kin + Stable against Defectors is impossible.
      *   *Analysis:* Correct. Without $r$ (kin) or Future Interaction (reciprocity) or Assortment (partner choice), cooperation is strictly dominated.
      *   *Resolution:* You must drop "Anonymous/Non-assorted" or "One-shot/No feedback". If it's one-shot and anonymous, it *must* be kin selection (hidden $r$) or byproduct (no cost). If it's truly non-kin and one-shot, it's likely noise or experimental artifact (i).
      *   *The "Most Work-Doing" Requirement:* The Bookkeeping Constraint (x). It forces the accounting of fitness flows. If you can't find the $r$ or the feedback loop, the mechanism is invalid. This organizes the chapter because it forces the empirical measurement of specific variables.

  6.  **Developing the Scorecard:**
      *   *Kin Selection:* Strong on Bookkeeping, weak on Identifiability (hard to measure $r$ precisely in wild).
      *   *Direct Reciprocity:* Fails Unknown Horizon (ii) and Large Groups (v).
      *   *Indirect Reciprocity:* Fails Private Assessment (vi) and Cognitive Load.
      *   *Partner Choice:* Fails No Recognition (iv).
      *   *Byproduct:* Solves Definitional (ix), but doesn't explain *costly* helping.
      *   *MLS:* Often descriptive rather than mechanistic; struggles with Identifiability.

  7.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I address the "Diagnostic" goal? Yes, emphasize *Identifiability*.
      *   *Check:* Did I address the "Bookkeeping Constraint"? Yes, treat it as a hard law, not just a desideratum.
      *   *Check:* Is the tone right? Needs to be collegial but firm. Acknowledge the difficulty.
      *   *Check:* The user's specific systems (cooperative breeder, interspecific mutualism). Ensure the criteria apply there. The mutualism (delayed benefit, different recipient) is a killer for direct reciprocity. The breeder (no recognition) is a killer for partner choice.
      *   *Refinement on "Identifiability":* This is the user's unique contribution. Most theories don't care if *we* can tell them apart, only if they work. The user demands *empirical discriminability*. This is a crucial distinction to highlight.

  8.  **Final Structure:**
      *   Introduction: Acknowledge the sophistication of the query.
      *   Part 1: The Desiderata (The Diagnostic List).
      *   Part 2: Desiderata vs. Prejudices.
      *   Part 3: The Incompatibility Cluster (The Trilemma).
      *   Part 4: The Organizing Principle (Bookkeeping/Identifiability).
      *   Part 5: The Scorecard (Brief).
      *   Conclusion: Advice for the synthesis chapter.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Make sure to explicitly validate (x).* It is a consistency constraint (Hamilton's Rule generalization).
      *   *Highlight the "Unknown Horizon".* This is a major critique of standard repeated game models.
      *   *Highlight "Private Assessment".* Kills standard image scoring.
      *   *Synthesis:* The chapter should be about *ruling out* mechanisms based on missing prerequisites, not just fitting data to the most popular model.

  10. **Final Review against constraints:**
      *   Keep weight on criteria.
      *   Brief scorecard.
      *   Address the "one-shot" inconsistency.
      *   Address the "Bookkeeping" constraint status.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated brief. You are asking for a meta-theoretical framework to evaluate mechanistic explanations, not just a review of the mechanisms themselves. Your goal is *empirical discriminability*: given a set of field constraints, which theoretical boxes can be ticked and which must remain empty?

  Below is the specification you requested. It treats your ten points of friction not as a literature review, but as boundary conditions for a diagnostic theory.

  ### Part 1: The Diagnostic Desiderata
  These are the requirements an adequate theory must meet to be useful for your synthesis. They are ordered by logical priority.

  **1. The Bookkeeping Constraint (Conservation of Fitness)**
  *   **Requirement:** The theory must explicitly identify the pathway by which the actor recovers the fitness cost of cooperation. This pathway must be quantifiable as either genetic relatedness ($r$) or a probabilistic fitness feedback loop ($w$) returning from the recipient (or a correlated third party) to the actor.
  *   **Motivation:** (x) The definitional case. If a model produces cooperation without assortment or feedback, it is mathematically hiding an assumption (e.g., spatial structure acting as proxy for $r$).
  *   **Diagnostic Utility:** If you cannot measure $r$ or demonstrate a feedback loop (even delayed/indirect), the mechanism is falsified for that system.

  **2. Informational Parsimony (Cognitive & Epistemic Realism)**
  *   **Requirement:** The strategy must be executable given the sensory and cognitive constraints of the organism. Agents cannot condition on variables they cannot perceive (e.g., partner's payoff, global reputation, exact continuation probability).
  *   **Motivation:** (ii) Unknown horizon, (vi) Private/noisy assessment, (viii) Payoff non-transparency.
  *   **Diagnostic Utility:** Rules out standard Tit-for-Tat (requires known $\delta$) and standard Image Scoring (requires public reputation) for systems where information is private or horizons are opaque.

  **3. Robustness to Implementation Noise**
  *   **Requirement:** The equilibrium must not collapse when the cooperative act fails probabilistically or when benefits are decoupled from the specific act of helping.
  *   **Motivation:** (iii) Misimplementation and decoupled benefits. In your mutualism, if help fails 20% of the time, a partner conditioning on *realised* benefit will erroneously defect.
  *   **Diagnostic Utility:** Rules out strict "reward/punish" reciprocity where the trigger is the *outcome* rather than the *intent* (which is unobservable).

  **4. Scalability (N-Player Viability)**
  *   **Requirement:** The mechanism must remain stable as group size increases beyond dyads, without requiring exponential increases in cognitive tracking or enforcement costs.
  *   **Motivation:** (v) Large groups. Dyadic reciprocity degrades in public goods games due to dilution of return and difficulty in attributing defection.
  *   **Diagnostic Utility:** Rules out dyadic reciprocity as the primary driver in large cooperative breeding groups unless there is a mechanism for dyadic segmentation.

  **5. Stability Against Higher-Order Exploitation**
  *   **Requirement:** If the mechanism relies on enforcement (punishment), it must explain the stability of the punishers against second-order free-riders (those who cooperate but do not punish).
  *   **Motivation:** (vii) Second-order free riding.
  *   **Diagnostic Utility:** Rules out simple punishment models unless linked to kin selection (punishing non-kin) or partner choice (punishers are preferred partners).

  **6. Recognition Independence (or Explicit Assortment)**
  *   **Requirement:** If the theory relies on assortment, it must specify the mechanism. If active recognition is absent, the theory must rely on passive assortment (viscosity, phenotype matching without discrimination).
  *   **Motivation:** (iv) No recognition. Helping is assortative, but animals don't discriminate.
  *   **Diagnostic Utility:** Rules out Partner Choice models that require active screening. Forces reliance on Kin Selection (via viscosity) or Byproduct Mutualism.

  **7. Empirical Identifiability**
  *   **Requirement:** The theory must generate distinct predictions regarding observable variables (e.g., correlation between helping and relatedness vs. correlation between helping and past receipt of help).
  *   **Motivation:** Your core goal. A theory that fits all data explains nothing.
  *   **Diagnostic Utility:** Allows you to license or refuse inferences. If two mechanisms predict the same helping rate given your data constraints, the theory is inadequate for *diagnosis* even if adequate for *existence*.

  ---

  ### Part 2: Desiderata vs. Prejudices
  You asked to distinguish genuine requirements from camp-specific tastes.

  *   **Explicit Decision Rules:** *Prejudice.* The reciprocity camp demands explicit strategies (Tit-for-Tat, Win-Stay-Lose-Shift). Evolutionary stability does not require cognitive calculation; it requires behavioural output correlated with fitness. **Drop this.** Focus on input-output contingencies, not internal algorithms.
  *   **Single Mechanism Unification:** *Prejudice.* The desire for one "Theory of Cooperation" covering bacteria, birds, and humans is a taste for elegance, not biological reality. **Drop this.** Accept pluralism; your thesis can argue for a *framework* of selection, not a single mechanism.
  *   **Identifiability from Observational Data:** *Genuine Desideratum (for you).* Theoreticians often accept unidentifiable models because they work in simulation. For a field biologist, this is useless. **Keep this.** It is the core of your diagnostic standard.
  *   **Cognitive Realism:** *Genuine Desideratum.* Attributing public reputation tracking to non-primates is a category error. **Keep this.**
  *   **The Bookkeeping Constraint:** *Hard Constraint, not Desideratum.* You are correct in (x). This is not a wish; it is a law of natural selection. Any model violating this is mathematically flawed, not just biologically implausible.

  ---

  ### Part 3: The Incompatibility Cluster (The Trilemma)
  You suspected an inconsistency in: *One-shot + Anonymous/Non-kin + Stable against Defectors.* You are correct. This is the "Cooperation Trilemma." You cannot satisfy all three.

  1.  **One-shot/No Feedback:** No future interaction to leverage.
  2.  **Anonymous/Non-assorted:** No genetic correlation ($r=0$) and no partner choice.
  3.  **Stable against Defectors:** Cooperation is a Nash Equilibrium.

  **Resolution:** You must drop **(2) Anonymous/Non-assorted**.
  If the interaction is truly one-shot and stable, there *must* be hidden assortment (kin structure you haven't measured) or the behaviour is not costly (Byproduct).
  *   **Cost of dropping it:** You must assume that "anonymous" lab humans or "random" field interactions are never truly random. There is always population structure.
  *   **Alternative:** Drop **(1) One-shot**. Assume the "one-shot" lab game triggers heuristics selected for repeated life (the "shadow of the future" is internalised). This explains (i) but makes the lab data hard to use for wild systems where horizons vary.

  **Recommendation for Thesis:** Treat "One-shot anonymous cooperation" as a special case of *mismatched heuristics* (humans) or *hidden assortment* (wild), rather than a distinct mechanism. Do not build a theory requirement around explaining it as a standalone stable equilibrium without $r$.

  ---

  ### Part 4: The Organizing Principle
  **The Requirement that does the most work:** **The Bookkeeping Constraint combined with Empirical Identifiability.**

  Organise your synthesis chapter around **Fitness Accounting**.
  For each of your empirical systems, ask: *Where does the fitness return come from?*
  1.  **Direct Return?** (Byproduct/Mutualism). Check if cost is real.
  2.  **Genetic Return?** (Kin Selection). Check if $r > c/b$.
  3.  **Future Return?** (Reciprocity). Check if feedback loop is robust to noise/delay.
  4.  **Market Return?** (Partner Choice). Check if assortment is active.

  This organises the chapter because it forces you to measure specific variables ($r$, delay time, failure rate) to rule mechanisms *in or out*. It moves the discussion from "Which theory is best?" to "Which fitness pathway is open in this system?"

  ---

  ### Part 5: The Scorecard
  *Brief evaluation of standard mechanisms against your Diagnostic Desiderata.*

  **1. Kin Selection / Inclusive Fitness**
  *   **Pros:** Satisfies Bookkeeping perfectly. Robust to noise and unknown horizons. Scales to large groups.
  *   **Cons:** Fails Identifiability if $r$ is hard to estimate (common in your breeder system). Fails Recognition Independence if active discrimination is assumed (but works with passive viscosity).
  *   **Verdict:** Strong candidate for the breeder if $r$ is high; weak for interspecific mutualism.

  **2. Direct Reciprocity**
  *   **Pros:** Intuitive.
  *   **Cons:** Fails Unknown Horizon (ii). Fails Robustness to Noise (iii) (errors trigger feuds). Fails Scalability (v). Fails your Mutualism (delayed/different recipient breaks the dyad).
  *   **Verdict:** Likely falsified for your specific systems.

  **3. Indirect Reciprocity (Reputation)**
  *   **Pros:** Scales better than direct.
  *   **Cons:** Fails Private Assessment (vi) catastrophically. Requires cognitive machinery (language/symbolic) likely absent in your study species.
  *   **Verdict:** Falsified for non-human systems without public information channels.

  **4. Partner Choice / Biological Markets**
  *   **Pros:** Solves Second-order Free Riding (vii) (punishment via abandonment).
  *   **Cons:** Fails No Recognition (iv). Requires ability to switch partners, which may be limited in your breeder.
  *   **Verdict:** Plausible only if "recognition" is passive (e.g., spatial proximity allowing choice).

  **5. Byproduct Mutualism**
  *   **Pros:** Satisfies Bookkeeping (no net cost). Solves Definitional Case (ix). Robust to everything.
  *   **Cons:** Doesn't explain *costly* helping. If you prove costs are real, this is falsified.
  *   **Verdict:** The null hypothesis. Must be ruled out by demonstrating net cost.

  **6. Multilevel Selection (MLS)**
  *   **Pros:** Mathematically equivalent to Kin Selection (often).
  *   **Cons:** Often descriptively vague on *mechanism* (fails Identifiability). Hard to distinguish from Kin Selection empirically.
  *   **Verdict:** Use as a statistical framework, not a behavioural mechanism.

  ### Final Advice for the Synthesis
  Your committee's inconsistency likely stems from conflating *evolutionary stability* (does the gene spread?) with *behavioural mechanism* (what does the animal do?).

  Use your chapter to enforce this distinction.
  1.  **Stability** is governed by the Bookkeeping Constraint (Hamilton's Rule generalized).
  2.  **Mechanism** is governed by Informational Parsimony and Robustness.

  Your contribution is showing that a mechanism can be evolutionarily stable (satisfy 1) but behaviourally impossible (fail 2). For example, Direct Reciprocity might satisfy the fitness accounting, but it fails the informational constraints of your mutualism (delayed/decoupled benefits).

  Write the chapter as a **filter**. Start with the universe of possible mechanisms. Apply the Bookkeeping Constraint (removes magic). Apply Informational Parsimony (removes cognitive overreach). Apply Robustness to Noise (removes fragile reciprocity). See what survives for your specific field systems. That is a defensible, diagnostic synthesis.
