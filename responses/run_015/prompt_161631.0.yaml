answer: |-
  Here is my decomposition, my number, and my engagement with the zombie-ethos test.

  ### 1. The Number
  **My credence in the strong proposition: 0.40.**

  I am slightly more skeptical than you (0.45). My skepticism stems from the "non-redundant" clause. While cultural persistence is real, isolating a *specifically Protestant ethos* from the human capital (literacy) and institutional (rule of law, property rights) correlates that traveled with the Reformation is empirically brutal. Most of the variance attributed to "culture" in reduced-form regressions evaporates when you aggressively instrument for literacy and political centralization.

  ### 2. Decomposition of the Problem

  **Is the causal claim well-posed?**
  Barely. Weber's "Spirit of Capitalism" is an *ideal type*, a heuristic construct, not a latent variable you can measure directly. To make it empirically tractable, we operationalize it as "Protestant confessional share." This introduces measurement error: a region can be 80% Lutheran without possessing the "Spirit."
  *   **Resolution:** Vindication requires showing that Protestant regions exhibit distinct economic behaviors (savings, labor supply, trust) *even when* theological belief is absent and institutions are held constant. Refutation requires showing that these behaviors vanish when literacy and legal security are fully controlled.

  **Doctrine vs. Disposition:**
  The mechanism *must* run through dispositions that outlive the doctrine. If the mechanism requires conscious belief in predestination or the calling, the thesis is falsified by secularization. Weber himself anticipated this: the "religious roots" die, but the "economic order" remains as an "iron cage." Therefore, the strong thesis survives only if "ethos" is defined as *habitus* (embodied, unconscious disposition) rather than *ideology* (conscious belief).

  **The Literacy Confound:**
  This is the biggest attenuator. Becker and Woessmann (2009) argue that the Protestant-Catholic economic gap is almost entirely explained by literacy (driven by the command to read Scripture). If literacy is the mediator, is the ethos non-redundant?
  *   *My view:* If the *only* mechanism is literacy, the "Spirit" thesis is redundant. The "Spirit" implies a specific *orientation toward economic activity*, not just the ability to read a contract. If controlling for literacy kills the coefficient, the strong thesis is in trouble.

  **Direction of Causation:**
  Selection is severe. Commercial hubs (Hanseatic League, etc.) often adopted Protestantism because it aligned with merchant interests (cheaper credit, less usury restriction). You need an instrument for conversion that is unrelated to economic potential (e.g., the death of a Catholic bishop, the whim of a prince). Even then, princes in richer territories might have been more able to resist the Emperor/Church.

  ### 3. The Zombie-Ethos Test

  **The Scenario:** Two matched regions (1550). 250 years later: Reformed region has higher capital per head, but *no difference* in religious belief, practice, or *stated attitudes toward work*.

  **Does this raise or lower my credence?**
  It **raises** my credence, but only if we interpret "ethos" as *behavioral habitus* rather than *stated values*.

  Here is the reasoning:
  1.  **Rules out "Current Belief" Confound:** It proves the economic gap is not driven by current theological motivation (which would be a weak, tautological version of Weber).
  2.  **Demonstrates Path Dependence:** It shows the initial confessional shock locked in a trajectory that persists without the original fuel. This fits Weber's "Iron Cage" prediction perfectly.
  3.  **The "Stated Attitude" Problem:** You specify "no detectable difference in stated attitudes." A strict Weberian might say this *lowers* credence, because the "Spirit" is a value-orientation (*Gesinnung*). If the values are identical, where is the Spirit?
      *   *However:* Social desirability bias and the invisibility of deep culture mean stated attitudes are noisy. If *behavior* (working/saving) diverges while *speech* converges, the behavior is the more valid indicator of the underlying cultural program.
      *   *The Alternative:* If behavior diverges but attitudes and institutions are identical, what else could cause it? It suggests a "ghost in the machine"—a cultural algorithm running in the background. That is precisely what a "non-redundant ethos" is.

  **Verdict:** This result vindicates the *sociological* version of Weber (culture as persistent habit) even if it undermines the *theological* version (culture as conscious conviction). Since your proposition specifies "culturally transmitted ethos" rather than "theological doctrine," the Zombie result supports the claim that the ethos became autonomous from its religious origins.

  ### 4. Sensitivity Analysis

  **The sub-question my number is most sensitive to:**
  **The Literacy/Human Capital Mediation.**
  My credence swings between 0.20 and 0.60 depending on whether literacy is a *confound* or a *mechanism*.
  *   If Protestantism caused growth *only* because it made people read, the "Spirit of Capitalism" is a myth; it was the "Skill of Capitalism." (Credence → 0.20).
  *   If Protestantism caused growth because it altered time-preference and risk-tolerance *independently* of literacy (e.g., via the psychological anxiety of salvation), the thesis holds. (Credence → 0.60).
  Current econometric consensus leans heavily toward literacy/institutions, which keeps my number at 0.40.

  ### 5. The Decisive Piece of Evidence

  **The Evidence:**
  Micro-data on **time preference and risk tolerance** (measured via experimental economics games, not surveys) from historically Protestant vs. Catholic regions, **controlling for current education levels and secularization.**

  **Direction of Movement:**
  *   **Vindication (Move to 0.70):** If historically Protestant populations show significantly lower time discount rates (more patience/saving) and higher risk tolerance in *secular* contexts, even when education is identical. This would prove the "disposition" exists independently of the "doctrine" and the "skill" (literacy).
  *   **Refutation (Move to 0.15):** If these psychological parameters are identical across groups once education is controlled, implying the "ethos" was never a distinct psychological trait, but merely a byproduct of human capital accumulation.

  ### Summary for the Group
  Tell your reading group this: The debate stalls because the economic historians are testing for *outcomes* (growth, capital) while the social theorists are testing for *meaning* (values, doctrine). The "Zombie Test" bridges this: if the behavior persists without the meaning, it's culture-as-habit (Weber survives). If the behavior collapses, it was doctrine-as-motivation (Weber fails). If the behavior persists but *attitudes* don't, it's likely institutional path dependence (Weber fails, North wins). My 0.40 reflects the suspicion that when we strip away literacy and institutions, the "Spirit" has very little variance left to explain.
