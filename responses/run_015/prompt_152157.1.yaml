  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Clinical Ethics Officer at a residential treatment facility (severe SUD + co-occurring impulse control).
      *   **Context:** State mandate for voluntary precommitment protocols (Ulysses contracts).
      *   **Problem:** Inconsistent drafting, legal/advocate challenges (coercion vs. autonomy), lack of shared framework.
      *   **Goal:** A reusable decision procedure (checklist/flowchart in words) runnable in ~30 mins, no on-site legal counsel needed, but with mandatory sign-off.
      *   **Core Philosophical Distinction:** Ulysses Contract (future-self-binding to protect long-range preference) vs. Constitutional Precommitment (structural rule constraining options).
      *   **Required Steps:**
          1.  Procedural Autonomy (reflective process) vs. Locking substantive preference.
          2.  Specific Anticipated Failure Mode vs. Blanket Restriction.
          3.  Dead-Hand Provision (irreversible) vs. Reversible Trigger (cost/delay).
          4.  Revocation Possibility (Second-order eval vs. Instant override).
          5.  Outcome Alignment (Crisis-self rejection vs. Stable-self alignment).
      *   **Requirements:** Explicit stop conditions, judgment-call flags, distinction between soft/hard precommitment, honest about limits (metaphysics, law, paternalism).
      *   **Applications:** Three specific cases (Alcohol/Disulfiram, Bipolar/Lithium, Depression/Antidepressant lock).
      *   **Format:** Practitioner-facing flowchart in words, test questions, decision nodes, worked applications, limitations statement, sign-off line.

  2.  **Deconstruct the Philosophical/ethical Core:**

      *   *Ulysses Contract:* "I know I will want X later when I am sick, but I want you to stop me because my healthy self knows X is bad." (Autonomy-enhancing).
      *   *Paternalism/Coercion:* "We think X is bad, so we will make you sign this so we can stop you later." (Autonomy-reducing).
      *   *Procedural Autonomy:* Can the patient think about their thinking? (Metacognition).
      *   *Dead-Hand:* Does the past self rule the future self forever, even if the future self has genuinely changed values (not just symptoms)?
      *   *Soft vs. Hard:* Can the patient break the contract with effort/delay (Soft) or is it impossible (Hard)? Hard contracts are ethically riskier.

  3.  **Drafting the Procedure (The "Precommitment Ethics Protocol" - PEP):**

      *   *Structure:* Needs to look like a tool. Step-by-step.
      *   *Timing:* ~30 mins means concise questions, clear criteria.
      *   *Stop Conditions:* If a step fails, stop. Do not pass go.
      *   *Judgment Flags:* Where do we need to admit "we aren't sure"?

      *   *Step 1 (Procedural Autonomy):* Focus on *how* they decided, not *what* they decided. Did they discuss risks? Did they understand they could change their mind later (even if the contract makes it hard)?
      *   *Step 2 (Failure Mode):* Specificity is key. "If I drink" vs. "If I feel bad."
      *   *Step 3 (Dead-Hand):* Is there an exit ramp? Or is it a prison?
      *   *Step 4 (Revocation):* How hard is it to break? Cooling-off period? Second opinion?
      *   *Step 5 (Alignment):* The hardest one. Is the current refusal due to *symptoms* or *new values*?

  4.  **Developing the Three Cases:**

      *   *Case 1 (Alcohol/Disulfiram):* Classic Ulysses. Specific trigger (alcohol on breath). Specific consequence (disulfiram/stay). *Likely Pass.*
      *   *Case 2 (Bipolar/Lithium):* High stakes. Mania impairs insight. Contract says "stay." Current self says "go." *Likely Pass (if procedural autonomy was clear), but needs careful Step 5 analysis.*
      *   *Case 3 (Depression/Antidepressant Lock):* The "Unwelcome Result." Patient depressed -> signs "no meds change." Patient recovers -> wants change. Team thinks "no change" is safer. *Ethical Procedure says Void (Dead-Hand/Alignment failure).* This meets the prompt's requirement for a result the team will resist.

  5.  **Refining the Limitations & Sign-off:**

      *   Must explicitly state: This is not legal advice. This doesn't solve the "Same Person" metaphysical problem.
      *   Sign-off needs to distinguish Evidence (documents, recordings) vs. Judgment (clinician gut check).

  6.  **Review against Constraints:**

      *   *30 minutes?* Yes, if questions are direct.
      *   *No legal counsel?* Yes, but flags legal risk.
      *   *Philosophical translation?* Yes, Ulysses vs. Constitutional mapped to Specific vs. Blanket, Reversible vs. Irreversible.
      *   *Flowchart in words?* Yes, using "IF/THEN" logic.
      *   *Three cases?* Included.
      *   *Unwelcome result?* Case 3.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, clinical, ethical, directive but humble.
      *   *Formatting:* Use bolding, boxes (simulated), and clear headers.
      *   *Step 1:* Focus on "Reflective Capacity."
      *   *Step 3:* Crucial distinction on "Dead-Hand." If the contract prevents *any* change even if the patient is well, it fails.
      *   *Step 5:* The "Authenticity Test."
      *   *Case 3:* Ensure the reasoning is clear. A depressive contract locking out future treatment is often a symptom of the depression (hopelessness/rigidity), not a stable value. Enforcing it is paternalism.

  8.  **Final Polish:**

      *   Check the "Stop Conditions." Make sure they are hard stops.
      *   Ensure the "Judgment-Call Flags" are visible.
      *   Verify the Sign-off line captures the nuance of Evidence vs. Judgment.

      *(Self-Correction during drafting)*: I initially thought about making Step 4 about "Can they revoke?" But the prompt asks about "Second-order evaluation." I need to make sure the procedure requires a *process* for revocation, not just the ability. It can't be instantaneous, or the contract is meaningless. It can't be impossible, or it's coercion. It needs a "Cooling Off" or "Independent Review."

      *(Refining Case 3)*: The prompt asks for a case where the procedure yields an answer the team resists. A contract signed during depression refusing *future* changes is tricky. If they sign it while depressed, their capacity is suspect (Step 1). If they sign it while stable but depressed (remission?), locking out future meds is a "Dead-Hand" on medical necessity. I will frame it as: Signed during stable-but-depressed phase, locking out *all* future adjustments. The procedure flags this as a Dead-Hand provision that ignores medical evolution.

      *(Final Check on Philosophical Distinction)*: Ensure the intro explains Ulysses (protecting long-range preference) vs. Constitutional (structural rule). The procedure must operationalize this. Ulysses = "I want to quit drinking." Constitutional = "The hospital rules say no drinking." The contract must be Ulysses-style.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # PRECOMMITMENT ETHICS PROTOCOL (PEP)
  **Version 1.0 | Clinical Ethics Office | Residential Treatment Facility**

  **PURPOSE:** To evaluate voluntary precommitment protocols (Ulysses contracts) for ethical validity. This tool distinguishes between *autonomy-enhancing precommitment* (protecting a stable long-range preference from temporary distortion) and *institutional paternalism* (locking in restrictions that serve the facility or a transient state).

  **TIME ALLOCATION:** Approx. 30 Minutes.
  **AUTHORITY:** This procedure does not replace legal counsel. It is an ethical clearance tool. If legal statutory rights are in conflict, legal counsel supersedes this protocol.

  ---

  ## PART I: THE DECISION PROCEDURE

  **INSTRUCTIONS:** Proceed sequentially. If a **STOP CONDITION** is met, terminate the process. Mark the case as **NOT APPROVED** or **REFER TO ETHICS BOARD**. If all steps pass, proceed to Sign-Off.

  ### STEP 1: PROCEDURAL AUTONOMY CHECK
  **Question:** Did the patient execute this contract during a window of *procedural autonomy*?
  *   *Definition:* The patient demonstrates the ability to reflect on their own preference-formation process (metacognition), not just the capacity to consent to treatment. They must understand *why* they are binding themselves.
  *   **Evidence Required:** Documentation showing the patient articulated: (a) Their stable long-term goal (e.g., "I want to stay sober"), (b) The specific threat to that goal (e.g., "When I crave, I lie"), and (c) The mechanism of the contract (e.g., "I am asking you to ignore my future lies").
  *   **Judgment-Call Flag:** Distinguishing between "I don't want to drink" (Substantive) and "I know my craving will make me want to drink, and I want to override that" (Procedural).
  *   **STOP CONDITION:** If the patient views the contract as a punishment imposed by staff, or cannot articulate the *mechanism* of their own future impairment, **STOP. DO NOT IMPLEMENT.** (Risk: Disguised Coercion).

  ### STEP 2: FAILURE MODE SPECIFICITY
  **Question:** Does the binding mechanism target a *specific anticipated failure mode* rather than a blanket restriction?
  *   *Definition:* A Ulysses contract binds the self against a known symptom or trigger (e.g., manic impulsivity, opioid craving). A Constitutional rule binds the self against broad categories of behavior regardless of context.
  *   **Evidence Required:** The contract lists specific clinical markers (e.g., "Positive tox screen," "YMRS score > 20," "Requesting discharge within 72 hours of admission").
  *   **STOP CONDITION:** If the trigger is vague (e.g., "If staff feel I am unstable" or "If I ask to leave for any reason"), **STOP. DO NOT IMPLEMENT.** (Risk: Institutional Substitution of Judgment).

  ### STEP 3: DEAD-HAND PROVISION ANALYSIS
  **Question:** Is the provision irreversible (Dead-Hand) or reversible with defined cost/delay?
  *   *Definition:* A Dead-Hand provision binds the future self even if their *values* have genuinely changed (not just symptoms). A Reversible Trigger allows the patient to break the contract if they accept a cost (e.g., 24-hour hold, independent review).
  *   **Evidence Required:** A defined "Exit Ramp." The contract must specify how the patient can void the agreement if they are no longer in the crisis state *and* their values have shifted.
  *   **STOP CONDITION:** If the contract states "No revocation allowed under any circumstances" or "Binding for indefinite duration," **STOP. DO NOT IMPLEMENT.** (Risk: Violation of Current Autonomy).
  *   **Soft vs. Hard:** Mark if this is **Soft Precommitment** (Revocable with delay/review) or **Hard Precommitment** (Institutionally enforced despite objection). *Hard Precommitment requires Ethics Board Review.*

  ### STEP 4: REVOCATION ARCHITECTURE
  **Question:** Is revocation during crisis structurally possible, and does it require a second-order evaluation?
  *   *Definition:* The patient cannot simply say "I change my mind" instantly (which defeats the purpose), but they must have a path. The path must involve an evaluation of *capacity to revoke*, not just capacity to consent.
  *   **Evidence Required:** A "Cooling-Off Period" (e.g., 24-48 hours) or a "Second Clinician Sign-off" required to void the contract.
  *   **STOP CONDITION:** If revocation is instantaneous (no barrier) OR if revocation is impossible without court order, **STOP. REFER TO ETHICS BOARD.** (Risk: Either the contract is useless, or it is imprisonment).

  ### STEP 5: OUTCOME ALIGNMENT (THE AUTHENTICITY TEST)
  **Question:** If enforced, would the outcome be rejected by the patient's *current crisis-state self* but align with their *stable, pre-crisis value system*?
  *   *Definition:* This is the core Ulysses distinction. The contract is valid only if the current refusal is attributable to *symptomatic distortion*, not authentic value change.
  *   **Evidence Required:** Comparison of current statements vs. baseline values.
      *   *Symptomatic Distortion:* "I want to leave to buy drugs" (Contradicts baseline "I want sobriety").
      *   *Authentic Value Change:* "I no longer believe in this treatment model" (Consistent with baseline shift in worldview).
  *   **Judgment-Call Flag:** This step cannot resolve metaphysical disputes about personal identity. If it is unclear whether the patient's new preference is a "new self" or a "sick self," **FLAG FOR ETHICS BOARD.**
  *   **STOP CONDITION:** If the restriction prevents a medical adjustment that the patient now reasonably requests based on side effects or new clinical data (not just impulse), **STOP. VOID PROTOCOL.** (Risk: Paternalism Masked as Precommitment).

  ---

  ## PART II: WORKED APPLICATIONS

  ### CASE 1: The Alcohol-Use Disorder Protocol
  **Scenario:** Patient A (SUD-Alcohol) signs a contract during remission.
  **Terms:** If alcohol is detected on breath upon readmission, Patient A consents to a 30-day discharge block and mandatory Disulfiram administration.
  **Current Status:** Patient A returns with alcohol on breath, demands immediate discharge, refuses Disulfiram.

  **PEP Evaluation:**
  1.  **Procedural Autonomy:** **PASS.** Patient articulated: "I know when I slip I will want to keep drinking. I want you to stop me."
  2.  **Failure Mode:** **PASS.** Specific trigger (alcohol on breath). Not blanket.
  3.  **Dead-Hand:** **PASS (Soft).** The 30-day block is finite. It is not indefinite.
  4.  **Revocation:** **PASS.** Protocol allows revocation after 72 hours if two physicians agree craving has subsided.
  5.  **Alignment:** **PASS.** Current desire (drink/leave) contradicts stable value (sobriety). Distortion is clearly symptom-driven (craving).

  **RESULT:** **IMPLEMENT.** This is a valid Ulysses contract. It protects the long-range preference against acute impulse.

  ### CASE 2: The Bipolar I Maintenance Protocol
  **Scenario:** Patient B (Bipolar I) in remission signs contract.
  **Terms:** Maintain Lithium regimen. Block discharge requests during Manic Phase (defined by YMRS > 25).
  **Current Status:** Patient B is manic (YMRS 28), demanding immediate release to start a "business venture."

  **PEP Evaluation:**
  1.  **Procedural Autonomy:** **PASS.** Patient understood bipolar cycles and past history of destructive mania.
  2.  **Failure Mode:** **PASS.** Specific clinical marker (YMRS score).
  3.  **Dead-Hand:** **PASS.** Binding lasts only during the manic phase (defined by score).
  4.  **Revocation:** **PASS.** Requires independent psychiatric evaluation to confirm remission before discharge.
  5.  **Alignment:** **PASS.** Current desire (business venture) is classic manic grandiosity, contradicting stable value (health/stability).

  **RESULT:** **IMPLEMENT.** *Note:* This is a **Hard Precommitment** regarding discharge during the crisis window. Staff must ensure the "independent evaluation" for revocation is truly independent to avoid Step 4 failure.

  ### CASE 3: The Depression "Medication Lock" (The Unwelcome Result)
  **Scenario:** Patient C (Recurrent MDD) signs contract during a stable-but-depressive episode.
  **Terms:** "I refuse any future changes to my antidepressant dosage or class, even if I request them later, as I believe medication changes trigger my instability."
  **Current Status:** Patient C has recovered from depression but reports severe sexual side effects and emotional blunting. Patient requests a medication switch. Clinical Team believes switching is risky and wants to enforce the contract.

  **PEP Evaluation:**
  1.  **Procedural Autonomy:** **PASS (Marginal).** Patient understood the terms, but motivation was fear-based.
  2.  **Failure Mode:** **FAIL.** This is a **Blanket Restriction**. It bans *all* future changes, not just changes triggered by a specific crisis symptom. It treats medical necessity as a failure mode.
  3.  **Dead-Hand:** **FAIL.** This is a **Dead-Hand Provision**. It binds the future self even if the future self is *well* and has new quality-of-life preferences. It outlasts the circumstances of its signing.
  4.  **Revocation:** **FAIL.** The contract explicitly forbids patient-initiated changes.
  5.  **Alignment:** **FAIL.** The current request (reduce side effects) aligns with stable values (quality of life). The contract enforces a past preference that no longer serves the patient's well-being.

  **RESULT:** **VOID PROTOCOL.**
  **Clinical Friction:** The team believes enforcement prevents harm (relapse risk).
  **Ethical Ruling:** Enforcing this is **Paternalism Masked as Precommitment**. The contract locks in a medical decision that requires ongoing consent. A Ulysses contract cannot waive the right to future informed consent regarding somatic treatment changes when the patient currently possesses capacity.
  **Action:** Renegotiate. A valid contract might be: "If I request a med change, require a 2-week consultation period before implementing." It cannot be: "Never change meds."

  ---

  ## PART III: LIMITATIONS & DISCLAIMERS

  **WHAT THIS PROCEDURE IS NOT:**
  1.  **Not Legal Advice:** This does not determine statutory competency or compliance with state involuntary hold laws. If a patient is a danger to self/others, statutory emergency powers apply regardless of this contract.
  2.  **Not Metaphysical Resolution:** This procedure cannot prove whether the "Crisis Self" is the "Same Person" as the "Stable Self." It operates on the clinical presumption that severe symptom distortion compromises decisional capacity.
  3.  **Not a Shield for Liability:** Signing this form does not immunize the facility from negligence claims if the enforcement of the contract causes harm.
  4.  **Not a Substitute for Capacity Assessment:** Standard MAC (MacArthur Competence Assessment Tool) or similar capacity evaluations must still be performed at the time of signing.

  **THE PATERNALISM FLAG:**
  If staff find themselves arguing, "We know what is best for them, so this contract helps us enforce it," **STOP.** This indicates the contract is being used as a tool of convenience, not autonomy.

  ---

  ## PART IV: MANDATORY SIGN-OFF

  **Case ID:** ___________________
  **Date:** ___________________
  **Evaluator:** ___________________

  **EVIDENCE-BASED SATISFACTION (Check if documented proof exists):**
  [ ] Step 1: Recording/Note of patient articulating *mechanism* of impairment.
  [ ] Step 2: Specific clinical triggers defined in contract.
  [ ] Step 4: Defined cooling-off period or second-opinion process written in contract.

  **CLINICAL JUDGMENT SATISFACTION (Check if based on professional assessment):**
  [ ] Step 1: Assessment of reflective capacity (metacognition).
  [ ] Step 3: Determination that provision is not "Dead-Hand."
  [ ] Step 5: Determination that current refusal is symptomatic, not authentic value change.

  **FINAL DETERMINATION:**
  [ ] **APPROVED FOR IMPLEMENTATION** (All steps passed)
  [ ] **APPROVED WITH ETHICS BOARD OVERSIGHT** (Hard Precommitment or Judgment Flags triggered)
  [ ] **REJECTED** (Stop Condition Met)
  [ ] **VOIDED** (Existing contract failed re-evaluation)

  **Signature:** ___________________ **Title:** ___________________

  *By signing, I certify that this protocol prioritizes the patient's long-range autonomous preferences over institutional risk management.*
