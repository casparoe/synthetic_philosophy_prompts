          *   *Verdict:* Nuanced. It's structural to *modern* administrative lying, not necessarily to all statecraft.

      *   *Claim 5: Condemns even strategic deception (military vulnerability).*
          *   *Arendt's View:* She acknowledges the "traditional lie." She says traditional lies were about hiding *specific* things (secrets). She critiques the *scale* and *nature* of modern lying (rewriting history/facts). She doesn't explicitly ban all tactical deception, but warns of the erosion of the "common world."
          *   *Verdict:* Exaggerated. She worries about the *consequences* on the public realm, but doesn't explicitly equate hiding a military secret with totalitarian propaganda.

      *   *Claim 6: Distinguishes political vs. social lies only by scale.*
          *   *Arendt's View:* She distinguishes them by *kind*. Political lies attack the "common world" and factual reality itself. Social lies might be polite fictions. The political lie destroys the ground of action.
