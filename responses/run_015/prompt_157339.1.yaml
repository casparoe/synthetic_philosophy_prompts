answer: |-
  ### The Plutarch Protocol: A Moral Architecture Quiz

  This tree sorts your philosophical stance on biography. It treats "reading a life" as loading a module into your mental OS. Answer based on how you actually process the data, not how you wish you did.

  **Node 1: The Use Case**
  You finish reading a *Parallel Life*. What is the primary function of this text in your workflow?
  *   **A. Patch My Own Code:** I read to find habits I can copy and install in myself. (Go to Node 2)
  *   **B. Debug Other People:** I read to recognize character types so I can predict how others will behave. (Go to Node 5)

  **Node 2: Data Integrity (The Hagiography Check)**
  *Path: Patch My Own Code*
  You discover the biographer sanitized the subject's worst bugs (vices/crimes) to make the system look stable. This is "moral marketing." Do you reject the build?
  *   **A. Yes, Throw It Out:** I need accurate logs to learn. A lie can't teach virtue. (Go to Node 4)
  *   **B. No, Keep the Stable Release:** I want the idealized version to strive for. Truth is secondary to the example. (Go to Node 3)

  **Node 3: The Idealist's Transparency**
  *Path: Patch My Own Code + Keep Sanitized Build*
  You know the narrative is manipulated to make you admire the subject. Does knowing the wiring void the warranty?
  *   **A. Yes, I Resist:** Knowing I'm being engineered breaks the spell. I refuse the upgrade.
      *   **→ Leaf 1: The Conscious Resister** (You want imitation but reject the manipulation required to sustain it.)
  *   **B. No, It Compiles:** The effect works even if I know the trick. I become better regardless.
      *   **→ Leaf 2: The Pragmatic Devout** (You accept moral marketing as a valid tool for self-improvement.)

  **Node 4: The Realist's Transparency**
  *Path: Patch My Own Code + Throw Out Sanitized Build*
  You are reading an honest portraiture with flaws visible. Does the narrative structure still successfully change your behavior?
  *   **A. Yes, I Upgrade:** Seeing the whole human allows me to selectively copy the good parts.
      *   **→ Leaf 3: The Virtue Engineer** (You believe honest data leads to moral execution.)
  *   **B. No, I Just Log It:** You understand the life, but you don't actually become more moral.
      *   **→ Leaf 4: The Historical Archivist** (You treat biography as knowledge storage, not character building.)

  **Node 5: The Comparator's Architecture**
  *Path: Debug Other People*
  Plutarch pairs a Greek with a Roman side-by-side. Is this comparison structure essential for your judgment, or just UI flair?
  *   **A. Essential Feature:** The contrast isolates universal virtues from cultural noise. It makes me a better judge.
      *   **→ Leaf 5: The Structural Benchmarker** (You believe the pairing itself does the moral work of sharpening judgment.)
  *   **B. UI Flair:** It's just literary framing. You learn to judge from the individual life, not the pair.
      *   **→ Leaf 6: The Narrative Skeptic** (You distrust the structure and rely on raw historical data alone.)

  ***

  ### System Analysis: Empty Combos & Indistinguishable Pairs

  **1. The Empty Combo: The Hagiographic Judge**
  *   **Logic:** `Goal: Debug Others` + `Preference: Sanitized Data`
  *   **Why it's empty:** This combination is logically incoherent. If your goal is to judge real people in the wild (Node 1B), hiding the subject's flaws (Node 2B) gives you corrupted training data. You will misidentify people in production because your model expects perfection that doesn't exist. Nobody seriously argues that lying about a subject helps you judge *others* better; it only helps if you are trying to worship an ideal.

  **2. The Indistinguishable Pair: The Conscious Resister (Leaf 1) vs. The Narrative Skeptic (Leaf 6)**
  *   **Why they blur:** Both end up rejecting the text's moral authority. The Resister wants to imitate but can't because of the manipulation; the Skeptic wants to judge but won't because of the structure. In practice, both users close the book and say, "This didn't change me." The internal motivation differs (failed imitation vs. successful skepticism), but the output (no moral uptake) is identical.

  **3. The "Ugly" Combo: The Pragmatic Devout (Leaf 2)**
  *   **Why it's rare:** This stance requires you to admit you are being manipulated by "moral marketing" and admit that you *let it work anyway*. Most philosophers prefer to claim they are too smart to be manipulated (Leaf 1) or that the data was honest (Leaf 3). Admitting you need a sanitized lie to become good is psychologically uncomfortable, so few writers explicitly claim this stance, even if many operate this way.
