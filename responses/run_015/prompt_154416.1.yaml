          *   *Divergence:* The law explicitly rejected "Cultural Genocide" (Lemkin wanted it, states said no). The law requires physical/biological destruction *or* conditions leading thereto. Mere cultural erosion (language loss due to economics) isn't enough. There must be *intent* to destroy the group *as such*.
