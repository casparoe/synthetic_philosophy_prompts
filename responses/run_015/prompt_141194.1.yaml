answer: |-
  **UNIVERSITY OF [REDACTED]**
  **DEPARTMENT OF PHILOSOPHY**
  **MODULE: PHI304 — INTUITION, CULTURE AND THE LIMITS OF THE ARMCHAIR**
  **TIME ALLOWED: 90 MINUTES**

  **QUESTION 1**

  **Read the following case material carefully.**

  **The Kalu Case:** In a village, everyone learns the name "Kalu" from a single storyteller. The storyteller's tales are all true of a man called Kofi, who died twenty years ago in another country and of whom nobody in the village has ever heard. Villagers say things like "Kalu was wise" and "Kalu was unlucky."
  **Query:** When a villager says "Kalu was unlucky," is she saying something about Kofi?
  **Data:** Population A mostly answers **Yes** (reference is causal/historical). Population B mostly answers **No** (reference is descriptive/no reference).

  **The Control Case:** Ama puts her keys in the drawer at noon. She says, "My keys are in the drawer." At 3 PM, nobody having entered the room, we ask whether she knew where the keys were.
  **Data:** Both Population A and Population B answer **Yes**.

  **The Bridle:** Any explanation you offer for the divergence in the Kalu Case (e.g., miscomprehension, pragmatic politeness, different question reading) must not predict divergence in the Control Case. You cannot claim "they didn't understand the story" unless you explain why they understood the Control Case fine.

  **Prompt:**
  Granting the Bridle, does the divergence in the Kalu Case give us reason to revise our theories of reference (or knowledge attribution)? Or does it suggest the programme of surveying intuitions as philosophical evidence is fundamentally flawed? Defend your position. Crucially, specify what empirical or theoretical evidence would force you to change your mind. Do not simply assert that "samples are unrepresentative" or "only experts count" without explaining the mechanism by which those factors alter the evidential weight of an intuition.

  ***

  ### MODEL ANSWER (IDEAL RESPONSE)

  The divergence in the Kalu Case, constrained by the Bridle, presents a dilemma for traditional armchair philosophy. If we grant the Bridle, we cannot dismiss the variation as mere noise or confusion, because the same subjects successfully navigate the Control Case. They understand narratives, truth, and attribution generally. Therefore, the variation in the Kalu Case reflects a genuine difference in how reference is conceptualized across populations.

  This forces a choice. Either reference is not uniform (revisionism about semantics), or intuitions are not reliable evidence for uniform semantic facts (skepticism about method). The stronger position is the latter. The Kalu Case shows that pre-theoretic intuitions about proper names are sensitive to cultural or contextual factors that do not affect basic knowledge attributions (like the Control Case). If intuitions vary this wildly on core cases used to adjudicate between descriptivism and causal-historical theories, then intuitions cannot serve as the neutral arbiter those theories require. We cannot use intuition to prove the causal theory is correct if the intuition itself is culturally contingent.

  However, we must address the "expertise defense." It is not enough to say experts are better; we must say why. The claim is that philosophers are trained to isolate semantic reference from pragmatic implicature. In the Kalu Case, non-experts might be answering who the villagers *mean* to talk about (pragmatics) rather than who the name *refers* to (semantics). If this is true, the divergence is not about reference itself, but about task interpretation. Yet, under the Bridle, this is hard to maintain. If Population B understands the Control Case, they understand the difference between belief and fact. Why would they fail to distinguish meaning from reference only in the Kalu Case? The expertise defense requires evidence that training changes the intuition itself, not just the willingness to report it. Currently, that evidence is thin.

  Regarding sampling: saying "samples are unrepresentative" is empty unless we specify the relevant population. If philosophy aims at universal truths about language, the human population is the relevant sample. If it aims at truths about "Western Folk Semantics," then WEIRD samples are fine, but the scope of the theory shrinks drastically. Most philosophers want universal scope. Therefore, the variation is damaging.

  **Meta-Philosophical Status:**
  It is broadly **settled** among experimental philosophers that the variation exists and is robust across replications; it is **contested** whether this variation undermines traditional methodology or merely refines it. It is **settled** that the Bridle blocks simple error theories; it is **contested** whether expertise filters noise or creates echo chambers. I am treating the variation as robust because multiple studies confirm it, but I am treating the expertise defense as live because we lack longitudinal data on training effects.

  **Changing My Mind:**
  I would change my mind if there were evidence that the divergence disappears when the Kalu Case is embedded in a real communicative context rather than a survey. If villagers actually trying to find Kofi succeed using the name "Kalu" uniformly, then the survey intuition is irrelevant compared to the practical success of reference. Until then, the variation stands as a rebuttal to universalist claims based on armchair intuition.

  ***

  ### MARKING SCHEME (TOTAL 20)

  **1. Reconstruction of the Problem (4 Marks)**
  *   **4:** Clearly distinguishes Kalu (divergence) from Control (convergence) and explains why the Control case matters (rules out general confusion).
  *   **2:** Mentions both cases but fails to explain why the Control case constrains the explanation.
  *   **0:** Ignores the Control case or conflates the two scenarios.
  *   *Common Error:* Treating the Control case as irrelevant background rather than a constraint on error theories.

  **2. Application of 'The Bridle' (4 Marks)**
  *   **4:** Explicitly uses the Bridle to rule out at least one standard defeater (e.g., "they didn't understand the story") by showing it would also fail the Control case.
  *   **2:** Acknowledges the Bridle but applies it loosely (e.g., "they understood enough").
  *   **0:** Ignores the Bridle or proposes an explanation that violates it (e.g., "Population B is less intelligent").
  *   *Common Error:* Claiming Population B simply misread the Kalu story without explaining why they didn't misread the Control story.

  **3. Philosophical Implication (4 Marks)**
  *   **4:** Takes a clear stand (Revisionism vs. Skepticism) and links the empirical data to the theoretical consequence (e.g., "intuitions cannot be neutral arbiters").
  *   **2:** Hedges too much ("it might mean this or that") without committing to a consequence for philosophical method.
  *   **0:** Describes the data without drawing a philosophical conclusion.
  *   *Common Error:* Stopping at "people disagree" without saying what that means for truth or evidence.

  **4. Handling of 'Lazy Moves' (4 Marks)**
  *   **4:** Addresses expertise or sampling by explaining the *mechanism* (e.g., semantics vs. pragmatics, or scope of theory).
  *   **2:** Mentions expertise/sampling but relies on buzzwords without mechanistic explanation.
  *   **0:** Uses "experts know better" or "samples are biased" as a conversation-stopper.
  *   *Common Error:* Asserting "philosophers are experts" without defining what expertise consists in (e.g., distinguishing semantic reference).

  **5. Meta-Philosophical Awareness (4 Marks)**
  *   **4:** Clearly distinguishes between settled claims (e.g., robustness of variation) and contested claims (e.g., impact of expertise), as per seminar discussions.
  *   **2:** Mentions controversy but treats contested claims as settled facts (or vice versa).
  *   **0:** Presents everything as either absolute truth or total skepticism.
  *   *Common Error:* Presenting the "expertise defense" as a refuted strawman rather than a live objection, or treating the variation as universally accepted without qualification.
