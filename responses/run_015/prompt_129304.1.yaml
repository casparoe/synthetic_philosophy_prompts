      *   *Nuance:* There is a sub-field of "Evolutionary AI" where the analogy holds better. I should mention that distinction. If we train AI via evolutionary algorithms, the biology analogy is stronger. If we train via gradient descent on a fixed loss, it's weaker.
      *   *Key Insight:* The friend thinks survival becomes a *terminal* goal. IC says survival is an *instrumental* goal. This is the linchpin.

  9.  **Final Polish:** Ensure tone is respectful but firm on the technical distinctions. Use clear headings. (Proceed to generate output based on these thoughts.)

  10. **Final Review against constraints:**
