  ### 4. Consensus vs. Contested Map

  To ensure your paper is received correctly, you must flag the following as **contested** rather than settled. Do not present these as standard background assumptions.

  | Commitment | Status in Literature | How to Frame in Paper |
  | :--- | :--- | :--- |
  | **(1) Adams–Edgington Thesis** | **Contested.** Dominant in linguistics/epistemology, but challenged by truth-conditional accounts (Stalnaker, Barnett) and those who argue conditionals *do* have truth values. | Present as a "working hypothesis" or "adopting the suppositional framework," acknowledging the debate over truth-aptness. |
  | **(2) Backtracking Counterfactuals** | **Contested.** Lewis (1979) argues against them in the "standard resolution of vagueness." Bennett and others allow them in specific contexts. | Explicitly state you are adopting a **context-sensitive similarity metric** that permits backtracking, distinguishing your view from the strict Lewisian orthodoxy. |
  | **(3) One-Boxing / Trajectory** | **Highly Contested.** CDT (Two-Box) vs. EDT/FDT (One-Box). The "trajectory-space" justification is non-standard (resembles FDT but distinct). | Frame as a **novel justification** for Evidential/Functional Decision Theory, not the consensus solution to Newcomb's Problem. |
  | **(4) Framing Invariance** | **Contested.** Many argue Indicatives map to EDT and Counterfactuals to CDT, implying framing *does* matter (the "Hitchcock" view). | Present as a **normative constraint** you are arguing *for*, not a pre-theoretic datum. |
  | **(6) Semantic Uniformity** | **Contested.** Contextualists vs. Invariantists; specific logics for self-location (e.g., centered worlds) often differ from standard conditionals. | Clarify that you argue for uniformity of *logical form*, while allowing variation in *modal parameters*. |

  ### Summary of Action Items
  1.  **Clarify (2) vs. (3):** Explicitly distinguish backtracking *truth* from backward *causation* to dismiss the apparent contradiction.
  2.  **Strengthen (1):** Ensure the "probabilities" in (1) are understood as tracking objective chances/trajectories to support (3), not merely subjective credence.
  3.  **Qualify (6):** Restrict the uniformity claim to allow domain-sensitive modal bases. This dissolves the tension with (5) and protects (2) from physics-based objections.
  4.  **Flag Contested Views:** Ensure the reader knows (1), (2), (3), and (4) are substantive philosophical positions, not neutral starting points.
