      *   *Körperschaft des öffentlichen Rechts (KdöR):* The legal status required.
      *   *Criteria:* Permanence, size, loyalty to the constitution (*Grundgesetz*), organizational structure.
      *   *The Issue:* Catholic and Protestant churches are hierarchical (state-like). Judaism has central councils. Islam in Germany is often decentralized (mosque associations, ethnic/national divisions), making it hard to form a single "partner" for the state.
