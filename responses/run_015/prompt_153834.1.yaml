      *   **Topic:** The German *Kirchensteuer* (church tax) system and the status of *Körperschaft des öffentlichen Rechts* (corporation under public law), specifically regarding the disparity between Christian/Jewish communities and Islamic communities.
      *   **Core Question:** What philosophical commitments does this practice presuppose regarding religious equality, state neutrality, and the ontology of a religious community? Is religious freedom an individual right or a corporate privilege? Can a liberal/secular framework justify this? What would change if the view shifted to purely individual equality?
