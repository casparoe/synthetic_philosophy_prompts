  Elias and Mara are co-organizing a community festival. They agree on the budget, the schedule, and the available venues; there is no factual disagreement. Elias selects a historic hall that is affordable and centrally located. Mara, who belongs to a minority group historically excluded by that institution, tells Elias that booking the hall signals hostility to her community, outweighing the logistical benefits. Elias initially resists, seeing the hall as neutral, but defers to Mara's judgment on the impact of the symbolism. He changes the venue. Afterwards, Elias can articulate to the committee exactly why the hall was inappropriate, citing the specific signaling harm Mara identified, and he would have noticed if a similar issue arose elsewhere. However, his belief remains dependent: if Mara were to tell him she was mistaken about the community's perception, or if she admitted she hadn't thought it through, Elias would revert to his original view, despite retaining the ability to recite the reasons. He was not impaired, Mara has no credentials, and they share the non-moral facts.

  **Demonstration**
  The **Evidential Account** is silenced because Elias has positive grounds for regarding Mara as better placed: her membership in the affected group provides specific evidence of reliability regarding the *impact* of the symbolism, distinct from general moral expertise. The **Own-Judgment Account** is silenced because Elias does not outsource his responsibility; he reflects on Mara's claim, integrates it into his own deliberation, and remains answerable for the final decision to the committee. The **Understanding Account**, however, predicts a defect: it claims testimony transfers a verdict but not a grasp of reasons, leaving the recipient unable to support or guide action with the belief. In this case, that predicted defect is missing. Elias possesses the grasp (he articulates the reasons, guides conduct, and tracks defeaters) yet the belief is genuinely testimonial (condition *c*). The account fails because it assumes testimony *cannot* convey the requisite understanding, whereas here testimony triggered the understanding while retaining justificatory dependence.

  **Structural Feature**
  The single structural feature doing the work is **Testimonial Access to Moral Salience**. Mara does not provide new non-moral facts, but she testifies to the *moral weight* of existing facts which Elias could not accurately weigh unaided. If this feature is removed—if Mara is not better placed to judge the salience of the symbolism—Elias's deference collapses into the **general incompetence** case I ruled out. Without her specific vantage point, a competent agent deferring to an equal on a substantive moral claim without new facts would simply be irrational or shirking judgment.

  **Strongest Reply**
  A defender of the Understanding Account will argue that once Elias can articulate the reasons and respond to defeaters, the belief is no longer held "on testimony" but on the reasons themselves; I have changed the subject from testimony to persuasion. The dependence condition in **(c)** blocks this reply. Epistemic basing is determined by counterfactual stability, not just current content. Because Elias would abandon the belief if Mara retracted her endorsement—even while retaining the ability to state the reasons—his justification remains anchored in her testimony. He understands the *what* and *why*, but he holds the *authority* of that why on her say-so.
