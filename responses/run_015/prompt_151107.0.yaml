      *   *Verdict:* This distinction is very sharp. It maps well onto the "Etiology vs. Competence" split. It doesn't just rename; it clarifies the *criteria* being used. However, it might not *resolve* the debate because the debate is ultimately normative (what *should* we call understanding?), not just descriptive.

