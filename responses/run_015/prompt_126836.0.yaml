  Good evening, everyone. For those I haven't met yet, I'm [Name], [Sister]'s sister.

  Standing here, looking at the two of you, I am struck by the weight of this room. We carry so much history in our hearts tonight. Parents, siblings, friends who have traveled to be here. All those memories converge in this exact point. The light, the music, the faces around us—it all exists fully in this moment.

  I remember when [Sister] was little, she would build towers out of cards. She never worried about how long they would stand. She cared only that she built them with care. She focused entirely on the placement of each card, right then. Watching you two together, I see that same care. I see it in the way you listen when the other speaks. I see it in the quiet moments between the noise of this day. You do not rush. You do not look past each other. You meet exactly where you are.

  I know [Sister] values the reality of now. I know [Groom] values the integrity of each moment. So I won't tell you that you will be happy for decades. I won't say you were destined to meet. Instead, I look at what is undeniable.

  Right now, you are choosing each other. Right now, your disposition is one of total devotion. There is a truth in this room that doesn't need to last forever to be real. It does not need to stretch across years to be valid. It is valid because it is whole in this instant. When you speak your vows, you aren't predicting a future. You are declaring who you are in this second. And looking at you, I see a strength that makes any future possible.

  Your love isn't a guarantee of what comes next. It is the ground you stand on right now. And because that ground is solid, I trust the steps you take. I trust the direction you face. I believe you can walk far.

  My Grandma asked me to speak of God and of forever. I honor that request. May God bless the intention you hold today. May you find, in every morning that follows, a new reason to renew the choice you make tonight. May each day offer you a fresh chance to say yes. May you walk this path together until your journeys end.

  I promised myself I wouldn't take up too much of your time. Unlike a wedding vow, this promise only binds me for the next three minutes.

  So please, raise your glasses. To the present moment. To the choice you are making. To the love that exists here, now, completely. To [Sister] and [Groom].

