answer: |-
  ### 1. Exam Question

  **Question 4 (20 Marks)**

  **Context:** In *Economic Possibilities for Our Grandchildren* (1930), Keynes argues that the "economic problem" (the struggle for subsistence) is temporary. Once solved, humanity faces the "permanent problem": how to live well. You may assume the distinction between absolute needs (satiable) and relative needs (insatiable, positional), and the claim that solving the economic problem liberates us from the latter. Do not define these terms; treat them as premises.

  Focus instead on the following tension in Keynes's moral psychology:
  1.  **The Moorean Doctrine:** Following G.E. Moore, Keynes holds that value resides in "states of mind" (love, art, contemplation) rather than consequences or production.
  2.  **The Canalisation Claim:** Keynes suggests the "money-motive," though sordid, has been historically defensible because it canalises dangerous human impulses (aggression, dominance) into harmless economic channels. Abolishing this motive risks releasing impulses that may find worse outlets.

  **Part (a) [8 marks]:**
  Distinguish between two interpretations of Keynes's "good life": the **Conversion Reading** (energy formerly spent on money-making is redirected to intrinsically worthwhile activities like art or friendship) and the **Abstention Reading** (the good life consists in contemplative enjoyment that requires no productive justification).
  Which reading better reconciles the Moorean Doctrine with the Canalisation Claim? Justify your choice.

  **Part (b) [7 marks]:**
  In a late memoir-essay on his early beliefs (written c. 1938), Keynes criticises his younger self for over-rating the power of reason and under-rating the role of habit, convention, and inherited tradition in making a decent life possible.
  Does this self-criticism support or undermine the reading you defended in Part (a)? Explain how the appeal to "habit" alters the feasibility of the good life you described.

  **Part (c) [5 marks]:**
  **Scenario:** Two generations after the economic problem is solved, society has a fifteen-hour week and universal access to the arts. However, time-use studies show freed time is absorbed by competitive ranking of experiences (e.g., scored connoisseurship, micro-credentials). Self-reported satisfaction is flat. A reform movement proposes "positional disarmament": the abolition of public ranking and comparative scoring outside the market.
  Based on your answers to (a) and (b): Does Keynes's account predict this outcome? Would positional disarmament help, hurt, or make no difference?

  ***

  ### 2. Model Answer

  Keynes's moral architecture requires us to choose the **Conversion Reading**. While the Abstention Reading aligns superficially with the Moorean Doctrine's emphasis on states of mind, it fails to account for the Canalisation Claim. If the money-motive previously absorbed dangerous human impulses—specifically the drive for dominance and distinction—simply removing the necessity of work (Abstention) leaves those impulses unchannelled. The Moorean end-state (contemplation) cannot be sustained if the psychological energy of the populace remains aggressive and competitive. Therefore, the "good life" cannot be mere passive enjoyment; it requires the active redirection of striving into non-harmful objects. Conversion preserves the energy required for a vivid life while altering its object, satisfying Moore's requirement for valuable states of mind without ignoring Keynes's psychological realism about human nature.

  The late memoir-essay **supports** this Conversion Reading but clarifies its conditions. In *Economic Possibilities*, Keynes implies that once abundance arrives, people will naturally choose the good life. The memoir corrects this by admitting that reason alone cannot teach us how to live well; we require "habit, convention, and inherited tradition." This does not undermine Conversion; it rescues it from utopianism. If the good life depends on cultivated capacities for enjoyment rather than innate reason, then the "conversion" of energy cannot be a sudden, rational choice made in 1930. It requires a social ecology of habits that make non-competitive striving intelligible. The memoir suggests that the Conversion Reading is correct in aim but naive in method: we cannot simply tell people to enjoy art; we must build conventions that make artistic engagement a stable habit rather than a new field for competition. Thus, the appeal to habit bridges the gap between the abolition of the money-motive and the psychological capacity to handle the resulting freedom.

  Applying this synthesis to the scenario: Keynes's account **predicts this outcome** precisely because the society achieved abundance without cultivating the necessary habits. The citizens have the leisure of the Abstention Reading but the psychological drives of the old order. Lacking a tradition of non-competitive engagement, they naturally revert to relative, positional striving (micro-credentials, scored connoisseurship) because that is the only "habit" they possess for organizing effort. Consequently, "positional disarmament" (abolishing ranking) would **hurt** or fail unless accompanied by new conventions. Merely removing scoring addresses the symptom (relative needs) but not the cause (unchannelled impulses). Without a substitute habit to absorb the energy formerly spent on ranking, the impulses will find worse outlets, validating the Canalisation Claim. To succeed, disarmament must be paired with the construction of new social conventions that reward participation rather than ranking, fulfilling the memoir's insight that a decent life depends on unchosen, inherited structures of behavior, not just liberated time.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Structure:** Five "Must-Hit" Moves (4 marks each).

  | Move | Requirement | Typical Error (0-2 marks) |
  | :--- | :--- | :--- |
  | **1. Psychological Constraint** | Identifies that the **Canalisation Claim** imposes a constraint on the Moorean Doctrine: states of mind cannot be secured if dangerous impulses are released. | Treats Moore and Canalisation as separate points; argues Moore trumps psychology without justification. |
  | **2. Reading Defence (a)** | Defends **Conversion** (or Abstention) *specifically* because it manages the impulse/energy problem, not just because it fits the definition of needs. | Chooses a reading based solely on the absolute/relative needs distinction (which the prompt forbids as sufficient). |
  | **3. Memoir Interpretation (b)** | Interprets the **Memoir** not as a rejection of the 1930 essay, but as a correction of its *method* (Reason vs. Habit). | Reads the Memoir as a total contradiction of Keynes's earlier view, rendering the project impossible. |
  | **4. Synthesis (b)** | Explains how **Habit/Convention** solves the feasibility problem for the chosen Reading (e.g., habits make non-competitive conversion stable). | States that habit is important but fails to link it to the mechanism of "conversion" or "canalisation." |
  | **5. Application (c)** | Judges **Positional Disarmament** based on the synthesis: it fails without new conventions to channel energy, not just because ranking is bad. | Argues disarmament helps simply because it reduces relative needs, ignoring the risk of unchannelled impulses. |

  **Discriminator (A vs. Strong B):**
  An **A** answer recognises that the Memoir's "habit" is the *mechanism* that makes the Conversion Reading psychologically possible; a **B** answer treats the Memoir as a separate, additive point about culture that doesn't structurally repair the argument in *Economic Possibilities*.

  **C-Level Cap:**
  An answer is capped at **C (10-12 marks)** if it accurately summarises the absolute/relative distinction and the Moorean doctrine but fails to engage the **Canalisation Claim** as a decisive factor in choosing between the Conversion and Abstention readings.
