  2.  **Deconstruct the Disagreement:**
      *   *Is it verbal?* Are they defining "obligatory" differently? Partially. The friend sees "obligatory" as "maximize good." The user sees "obligatory" as "compatible with being a person." But this is surface level.
      *   *Is it factual?* Does utilitarianism *actually* require giving until misery? Peter Singer says yes (mostly). Rule utilitarians or those with diminishing marginal utility of money/effort might say no. But the user's objection isn't "it's too hard," it's "it's the wrong kind of demand." So factual disputes about economic marginal utility aren't the core.
      *   *Is it meta-ethical?* Yes. This is the crux. What is the *source* of normativity? Consequentialism says state of affairs. The User implies an agent-relative source (integrity, projects).
      *   *Is it about "The Separateness of Persons"?* This is Rawls' objection to utilitarianism. Utilitarianism treats society like a single individual maximizing utility over time. The User hints at this ("separateness of persons").
      *   *Is it about "Integrity"?* This is Bernard Williams' famous objection (Jim and the Indians). Utilitarianism alienates the agent from their own actions and convictions.
      *   *Is it bedrock?* Likely. Hume's Fork / Wittgenstein's bedrock. If one values "maximizing the good" as the *only* intrinsic value, and the other values "agency/identity" as intrinsically valuable, there's no neutral ground to stand on to prove one right.

  3.  **Evaluate the User's Hypothesis:**
      *   "He only counts welfare, and I count integrity and the separateness of persons."
      *   This is very close to the mark. It's a disagreement about the *scope of the moral domain* and the *nature of practical reason*.
      *   Friend: Moral reasons are agent-neutral (everyone has reason to maximize X).
      *   User: Moral reasons include agent-relative constraints (I have special reason to care about *my* projects).

  4.  **Formulate the Diagnosis:**
      *   **Not merely verbal:** It's deeper than definitions.
      *   **Not factual:** It's not about how much money is needed to save a life.
      *   **Meta-Ethical/Normative:** It's about the *structure* of moral theory (Agent-Neutral vs. Agent-Relative).
      *   **Philosophical Lineage:** Connect the User to Bernard Williams (Integrity) and John Rawls (Separateness of Persons). Connect the Friend to Peter Singer (Famine, Affluence, and Morality) and Sidgwick.
      *   **The "Alienation" Point:** The user mentions "what it makes me." This is the alienation objection. Utilitarianism requires a "negative responsibility" that dissolves the boundary between self and world.

  5.  **Determine Paths to Progress:**
      *   *Acknowledge the Bedrock:* Admit that this might be a clash of fundamental intuitions.
      *   *Shift from "Obligation" to "Reasons":* Move away from "What must I do?" to "What kind of reasons do I have?"
      *   *Explore Hybrid Theories:* Scalar utilitarianism? Satisficing? Prioritizing personal integrity as a precondition for utility?
      *   *The "Overdemandingness" vs. "Misguidedness" distinction:* Validate the User's insight that their objection isn't about *degree* but *kind*.
      *   *Pragmatic Turn:* What happens if we live by one vs. the other? (Burnout vs. Complacency).

