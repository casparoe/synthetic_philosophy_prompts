answer: |-
  ### Brainstorming Normative Frameworks

  Before dissecting the institutional divergence, I must map the normative terrain. Several frameworks compete to explain or justify reproductive policy, each containing internal tensions:

  1.  **Libertarian/Market Liberalism:** Prioritizes freedom of contract and bodily autonomy.
      *   *Tension:* Does market freedom enhance agency, or does economic coercion render consent invalid? If the body is property, are there limits to what can be sold (e.g., slavery prohibitions)?
  2.  **Kantian/Deontological Dignity:** Views persons as ends-in-themselves. Commodification instrumentalizes the body.
      *   *Tension:* Is all use of the body for another's ends instrumentalization? Does banning payment disrespect the agent's capacity to choose altruism?
  3.  **Feminist Liberalism:** Focuses on reproductive autonomy and equality.
      *   *Tension:* Does autonomy require the option to sell reproductive services, or does the option itself reinforce patriarchal structures that value women primarily for reproduction?
  4.  **Feminist Relational/Care Ethics:** Emphasizes vulnerability, embodiment, and social context.
      *   *Tension:* Does protecting vulnerability justify paternalistic bans that restrict women's economic opportunities? How do we value care without commodifying it?
  5.  **Social Democratic/Welfare State:** Prioritizes decommodification of essential human goods and protection against stratification.
      *   *Tension:* Does state control of reproduction infringe on private family life? Can altruistic systems function without a black market?

  ### Philosophical Commitments of the Divergence

  The divergence between the European (restrictive/altruistic) and American (commercial/contractual) models presupposes fundamentally different ontologies of the body, labor, and kinship.

  **1. The Body and Property**
  *   **U.S. Model:** Presupposes a *porous boundary* between person and property. Reproductive capacities are assets that can be alienated via contract. The body is a vessel of labor power that can be leased.
  *   **European Model:** Presupposes a *constitutive boundary*. Reproductive capacity is intrinsic to personhood (*inalienable*). While services can be rendered, the *capacity itself* cannot be priced without violating human dignity (*ordre public*).

  **2. Labor and Service**
  *   **U.S. Model:** Gestation is framed as *service provision*. However, it is a unique form of labor where the "product" (parental rights) is transferred upon completion.
  *   **European Model:** Gestation is framed as *existential engagement*. It is not labor separable from the self; therefore, it cannot be contracted away in advance. The labor is recognized socially (via expenses) but not economically (via profit).

  **3. Contract and Status**
  *   **U.S. Model:** Contract creates status. Parentage is a legal construct derived from intent and agreement (*lex contractus*).
  *   **European Model:** Status precedes contract. Parentage is a biological/social fact (*mater semper certa est*) that the state regulates. Contracts regarding status are void as against public policy.

  ### Reconstructing the European Implicit Theory of Value

  Does the European model require viewing reproductive capacities as metaphysically inalienable?

  **Strict Requirement vs. Compatible Fit:**
  Strictly speaking, the European model *does not* require a metaphysical commitment to inalienability. It can be justified on **harm-reduction and anti-stratification grounds** (a consequentialist or political feminist approach).
  *   *Justification:* If reproductive services are commodified, wealthier individuals will exploit the economic vulnerability of poorer women (transnational stratified reproduction). This creates a caste system of "reproductive classes."
  *   *The "Gift" Framing:* By channeling donation through state clinics and framing it as a gift, the state constructs a "moral market." This preserves social solidarity rather than asserting that the egg is ontologically attached to the soul.
  *   *Conclusion:* The model is coherent without metaphysical inalienability. It requires only a commitment to **non-commodification of the human person** as a regulatory principle to prevent social harm. However, the *legal ontology* (birth mother is legal mother) fits best with a view that gestation creates an不可 severable bond that cannot be waived by prior consent.

  ### Examining the American Model: Consistency of Labor

  Does treating gestation as contracted labor commit one to treating other forms of embodied care work the same way?

  **The Inconsistency:**
  The American model is **philosophically inconsistent** regarding labor.
  1.  **Labor Law Exemptions:** Surrogates are not covered by standard labor protections (OSHA, workers' compensation, right to unionize, right to quit without breach of contract). If gestation were truly labor, the surrogate would retain rights over her working conditions.
  2.  **Specific Performance:** Contracts often mandate medical procedures (C-sections, selective reduction). In standard labor law, you cannot contractually force specific bodily performance (specific performance is barred in personal service contracts).
  3.  **The "Product" Distinction:** The contract is not merely for the *labor* of gestation; it is for the *outcome* (the child/parental rights). This makes it closer to a **sale of goods** than a labor contract.

  **Distinguishing Feature:**
  To make this consistent, the American model implicitly relies on a **property theory of parenthood**. It distinguishes reproductive labor from other care work (like nursing or elder care) because the *output* of reproductive labor is a new legal subject (the child) whose status must be resolved immediately. Other care work maintains an existing subject. Thus, the model treats gestation not just as labor, but as **manufacturing of kinship**, which justifies the exceptional contractual enforcement that standard labor law forbids.

  ### Philosophical Underdetermination

  Are these practices underdetermined by high-level theory? **Yes.**

  1.  **Liberal Autonomy:**
      *   *Licenses U.S. Model:* Autonomy includes the right to enter binding agreements regarding one's body.
      *   *Licenses E.U. Model:* Autonomy is compromised by economic coercion; true autonomy requires protection from markets that degrade human dignity (positive liberty).
  2.  **Feminist Relational Ethics:**
      *   *Licenses E.U. Model:* Protects women from being reduced to incubators; values the relational bond of gestation.
      *   *Licenses U.S. Model:* Recognizes and compensates the invisible labor of reproduction; empowers women to monetize their capacities in a patriarchal economy.
  3.  **Market Libertarianism:**
      *   *Licenses U.S. Model:* Strong fit.
      *   *Licenses E.U. Model:* Poor fit, unless framed as property rights of the state to regulate public order, but this strains the framework.

  **Assessment:** Both the European and American models are **underdetermined** by Liberal Autonomy and Feminist Relational Ethics. The divergence is not caused by a disagreement on first principles (e.g., "is autonomy good?"), but by **empirical disagreements** about the nature of coercion and the social effects of markets.

  ### Structural Changes for Rival Policies

  If a jurisdiction were to build policy on the *rival* view, mere payment adjustments would fail. Deep structural ontologies must shift.

  **1. U.S. adopting the European (Non-Commodification) View:**
  *   **Legal Ontology of Motherhood:** Statutes must reinstate *mater semper certa est*. The gestational carrier is the legal mother at birth, full stop. Pre-birth orders must be banned.
  *   **Status of Contract:** Surrogacy agreements must be declared **void *ab initio*** (not just unenforceable, but legally non-existent). Any transfer of parentage must occur via post-birth adoption, subject to a revocation period for the birth mother.
  *   **Role of Clinics:** IVF clinics must be converted from private service providers to **state-regulated matching agencies**. Marketing of donors/surrogates must be banned. Compensation must be limited to audited expenses (lost wages, medical costs), managed through a central fund to prevent side-payments.

  **2. Europe adopting the American (Contractual/Market) View:**
  *   **Legal Ontology of Motherhood:** Parenthood must be decoupled from gestation and redefined as **intentional or genetic**. The law must recognize "pre-conception intent" as the primary generator of parental status.
  *   **Status of Contract:** Surrogacy contracts must be elevated to **enforceable civil contracts** with remedies for breach (including specific performance regarding medical decisions, or damages for "wrongful birth" claims by intended parents).
  *   **Role of Clinics:** State clinics must be privatized or deregulated to allow **price signaling**. Donor databases must allow for characteristic-based pricing. The state's role shifts from protector of the gestator to enforcer of contractual expectations between private parties.

  ### Confidence and Uncertainty

  **Confidence Level:**
  I am **highly confident** (approx. 85%) in this reconstruction of the implicit theories. The legal mechanisms (pre-birth orders vs. adoption, void contracts vs. enforceable contracts) map clearly onto distinct philosophical commitments regarding the alienability of the body and the source of parental rights.

  **Least Certain Claim:**
  I am **least certain** about the claim regarding **the consistency of treating gestation as labor** in the American model.
  *Reasoning:* While I argue the U.S. model is inconsistent because it denies labor protections, a proponent could argue that surrogacy is a *sui generis* category—neither pure labor nor pure sale, but a "reproductive service agreement." If one accepts that reproduction is ontologically unique (creating a new person), then applying standard labor norms might be the category error, not the exemption. Therefore, asserting that the U.S. model *fails* its own labor logic depends on the prior philosophical premise that gestation *should* be treated like standard labor, which is itself a contested claim. The inconsistency exists only if one assumes labor law is the correct baseline for all embodied work.

  ***

  **Explicit Statement of Uncertainty:**
  The specific comparative claim of which I am least certain is: **"treating gestation as contracted labor commit[s] one to treating other forms of embodied care work the same way."** I am less certain of this because the unique teleological outcome of gestation (the creation of a new legal subject) may philosophically justify a distinct regulatory regime that exempts it from standard labor norms without rendering the system incoherent.
