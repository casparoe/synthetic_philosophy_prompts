      *   **Context:** Just had a frustrating argument with a friend about collective/intergenerational guilt (specifically regarding national injustices). They discussed Karl Jaspers but couldn't agree on the implications.
      *   **Task:** Restate Jaspers' *The Question of German Guilt* (criminal, political, moral, metaphysical) using software engineering vocabulary. Map categories to engineering analogs. Provide a "Residue Report" (what fits, what distorts, what's missing).
      *   **Specific Focus:** Can "metaphysical guilt" be captured by supply-chain responsibility/maintainer ethics, or is it a genuine gap in the engineering framework?

  2.  **Deconstruct Jaspers' Framework (Mental Sandbox):**
      *   *Source:* Karl Jaspers, *The Question of German Guilt* (1947).
      *   *Context:* Post-WWII Germany, addressing how Germans relate to Nazi crimes.
      *   *Four Guilt Categories:*
          1.  **Criminal:** Violation of laws. Adjudicated in court. Individual.
          2.  **Political:** Liability for the actions of the state/citizenship. Reparations. Collective (citizens).
          3.  **Moral:** Personal conscience. Actions/omissions based on ethical standards. Individual (before God/oneself).
          4.  **Metaphysical:** Solidarity as human beings. Failure to prevent suffering when possible. "Co-responsibility for every wrong and injustice in the world."
      *   *Intergenerational Aspect:* Jaspers is actually quite strict here. Criminal/Moral guilt *cannot* be inherited. Political guilt *can* (as liability of the state). Metaphysical guilt is tricky—it's about human solidarity, not lineage, but it binds us to the human condition.

  3.  **Map to Software Engineering Vocabulary:**
