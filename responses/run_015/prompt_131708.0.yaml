          3.  **Moral Guilt:** Personal ethical obligations. *Analog:* A maintainer knowing a dependency is risky but shipping it anyway to meet a deadline. Conscience of the engineer.
          4.  **Metaphysical Guilt:** Solidarity-based responsibility. *Analog:* This is the hard one. Is it "Supply Chain Responsibility"? Or is it "Open Source Commons Ethics"? It's the feeling that "I am part of this ecosystem, and if it harms users, I share in the failure of the ecosystem."

  4.  **Drafting the Restatement (Iterative Process):**
      *   *Goal:* Faithful to Jaspers but fluent in Eng-speak.
      *   *Criminal:* "Commit-level liability." You wrote the bug that crashed the bank. You go to jail/get fired.
      *   *Political:* "Org-level SLA/Liability." The company ships the binary. The company pays the lawsuit. Current employees inherit the debt of the repo.
