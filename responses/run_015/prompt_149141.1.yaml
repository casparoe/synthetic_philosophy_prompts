answer: |-
  ### Exam Prompt: Rationality & Commitment in Parfit's Hitchhiker

  **Question 1 (30 Marks)**

  Consider a modification of Parfit's Hitchhiker scenario. A stranded agent (the Hitchhiker) needs a ride to town to survive. A Driver can provide the ride but requires payment upon arrival. In the standard version, the Driver predicts whether the Hitchhiker will pay; if the Driver predicts defection, she leaves the Hitchhiker.

  In this **Modified Scenario**, the Driver has access to a cheap, observable commitment device (e.g., a smart-contract lockbox). If the Driver activates this device *before* offering the ride, she is financially penalized if she fails to complete the trip. This makes her commitment to drive credible. The Hitchhiker observes whether the device is active before accepting the ride and again before deciding whether to pay upon arrival.

  Assume both agents are classically rational (Causal Decision Theorists) and self-interested. The Hitchhiker prefers (Ride + No Pay) > (Ride + Pay) > (No Ride). The Driver prefers (Ride + Pay) > (No Ride) > (Ride + No Pay).

  Write an essay arguing whether the availability of this observable precommitment device undermines Parfit's claim that rationality can be self-defeating, or whether it merely relocates the problem between *ex-ante* and *ex-post* rationality. In your analysis, you must distinguish the structural mechanics of this scenario from Newcomb's Problem. Do not use outside citations; rely on logical reconstruction of the game tree and decision principles.

  ***

  ### Model Answer

  The introduction of an observable commitment device in the Hitchhiker scenario does not resolve the paradox of self-defeating rationality; rather, it relocates the point of failure from the Hitchhiker's inability to promise to the Driver's inability to credibly signal without inviting exploitation. While the device successfully solves the Driver's commitment problem regarding the *drive*, it exacerbates the Hitchhiker's incentive to defect, ultimately leading to the same suboptimal equilibrium: no ride. This confirms Parfit's claim that standard rationality remains self-defeating, as the *ex-ante* optimal strategy (activate device, drive, pay) is unreachable via *ex-post* rational deliberation.

  To see this, we must analyze the game tree through backward induction. In the standard Hitchhiker case, the bottleneck is the Driver's prediction: she cannot drive because she predicts the Hitchhiker will not pay. In the Modified Scenario, the Driver moves first by choosing whether to activate the device. If activated, the Driver is causally bound to drive; she cannot turn back without incurring a penalty greater than the fare. The Hitchhiker observes this activation. Upon arriving in town, the Hitchhiker faces the payment decision. Crucially, the device binds the *Driver*, not the Hitchhiker. Once in town, the ride is a sunk cost for the Driver. For the Hitchhiker, the causal consequences of paying are purely negative (loss of money), while the benefits of the ride are already secured by the Driver's binding commitment. A Causal Decision Theorist (CDT) Hitchhiker will therefore defect, regardless of the device's status.

  Anticipating this, the Driver performs the *ex-ante* calculation. If she activates the device, she guarantees the ride occurs but guarantees she receives no payment (Ride + No Pay). If she does not activate the device, she retains the option to turn back, but the Hitchhiker, knowing she is unbound, will not expect a ride unless she can somehow signal a disposition to drive without the device—which returns us to the standard prediction problem. Since (Ride + No Pay) is the Driver's worst outcome, a rational Driver will not activate the device. Consequently, the Hitchhiker is left stranded. The device, rather than facilitating cooperation, highlights the Driver's vulnerability: making her move credible removes her leverage, inviting the Hitchhiker's defection.

  This demonstrates that rationality is self-defeating. *Ex-ante*, both agents prefer the world where the device is active and the Hitchhiker pays. However, *ex-post* rationality at the decision nodes prevents this outcome. The Driver cannot rationally activate the device because it invites defection; the Hitchhiker cannot rationally pay because the leverage is gone. The commitment device shifts the burden of commitment from the Hitchhiker (who couldn't promise) to the Driver (who can promise but shouldn't), but it does not escape the trap. The rational strategy leads to a Pareto-inferior outcome.

  It is vital to distinguish this from Newcomb's Problem, a confusion common in decision theory. In Newcomb's Problem, the predictor (Omega) fills the boxes *before* the agent chooses, based on a prediction of the agent's choice. The agent's choice is evidentially correlated with the past prediction but causally independent. In the Modified Hitchhiker, the Driver's activation of the device is a causal antecedent to the Hitchhiker's ride, not a prediction of it. The Hitchhiker's decision to pay does not influence whether the Driver drove (the device already ensured that); it only influences the payoff distribution. In Newcomb's, one-boxing is argued to be rational under Evidential Decision Theory because it correlates with the million dollars being present. In Modified Hitchhiker, paying is never rational under CDT because it causally reduces utility without affecting the ride's occurrence. Conflating the two obscures the fact that Hitchhiker is a sequential game of trust with observable moves, whereas Newcomb's is a problem of prediction and correlation without communication.

  Ultimately, the observable device fails to secure cooperation because it solves the wrong commitment problem. It binds the Driver to the Hitchhiker's benefit, removing the Driver's threat to abandon the trip. Without a mechanism to bind the *Hitchhiker* to pay (such as an escrow deposited *before* the ride), the sequential structure ensures defection. Rationality remains self-defeating because the agents cannot rationally adopt the dispositions required to access the superior outcome. The device merely makes the tragedy of the commons explicit in the timing of the moves: the Driver is punished for being too predictable, and the Hitchhiker is rewarded for being too rational.

  ***

  ### Marking Scheme (30 Marks Total)

  **1. Correct Backward Induction of the Game Tree (6 Marks)**
  *   **Requirement:** The answer must identify that the Hitchhiker decides to pay *after* the ride is secured by the device, meaning the causal leverage for payment is lost.
  *   **Usual Mistake:** Students assume the device forces the Hitchhiker to pay or fails to recognize the timing of the payment decision relative to the ride completion.

  **2. Analysis of the Driver's *Ex-Ante* Calculation (6 Marks)**
  *   **Requirement:** The answer must explain that the Driver anticipates the Hitchhiker's defection and therefore chooses *not* to activate the device to avoid the (Ride + No Pay) outcome.
  *   **Usual Mistake:** Arguing that the Driver should activate the device "hoping" the Hitchhiker pays, ignoring the assumption of classical rationality/self-interest.

  **3. Evaluation of Parfit's Self-Defeating Claim (6 Marks)**
  *   **Requirement:** The answer must conclude that rationality *is* self-defeating (or the problem is relocated), as the *ex-ante* optimal outcome is unreachable through rational *ex-post* moves.
  *   **Usual Mistake:** Claiming the device "solves" the paradox simply because it introduces a contract, without analyzing why the contract isn't activated or honored.

  **4. Structural Distinction from Newcomb's Problem (6 Marks)**
  *   **Requirement:** The answer must distinguish the scenarios based on **prediction/correlation** (Newcomb) vs. **causal commitment/sequence** (Hitchhiker).
  *   **Usual Mistake:** Treating the Driver's device as a "prediction" mechanism like Omega, or claiming the logic is identical without mapping the causal arrows.

  **5. Identification of the Missing Leverage (6 Marks)**
  *   **Requirement:** The answer must note that the device binds the *Driver*, whereas the commitment problem lies with the *Hitchhiker* (who needs to bind their payment).
  *   **Usual Mistake:** Focusing on the cost of the device or the technology, rather than the strategic incentive structure regarding who is bound to whom.
