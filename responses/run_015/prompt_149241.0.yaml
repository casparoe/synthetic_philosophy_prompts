  The infinite set is fully discerned.
  The manager holds the pen in empty light.
  The book stays open; no final page is turned.

  No temporal chain requires the task be earned.
  The function waits before the grip is tight.
  The infinite set is fully discerned.

  But ink demands a cost that must be earned.
  To bind the volume keeps the covers tight.
  The book stays open; no final page is turned.

  To define the path is not to have it earned.
  The bus arrives and stretches out of sight.
  The infinite set is fully discerned.

  No stay is sealed till the next room is earned.
  The lobby fills beyond the human sight.
  The book stays open; no final page is turned.

  So logic claims the sum is fully earned.
  But physical ink refuses to be tight.
  The infinite set is fully discerned.
  The book stays open; no final page is turned.

  ***

  **Note on Interpretation**

  This poem treats the Cantorian position as epistemic ("discerned") rather than purely ontological, blending the existence of the set with the mind's ability to grasp it as a completed whole. It also frames the strict finitist objection through the physical metaphor of the hotel (ink, binding, sealing) rather than as a purely logical denial of infinite coherence. This liberty is necessary to sustain the Hotel parable while accurately reflecting the finitist consequence: that without a completed extension, the assignment function remains merely intensional and the ledger physically unclosable. The tension remains unresolved because the poem privileges the structural conflict between abstract definition and physical execution over a metaphysical verdict.
