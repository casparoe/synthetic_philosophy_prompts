      *   **The Software Engineer Analogy:** "Data in DB before training" $\approx$ "Old Evidence." In ML, we usually hold out test data to avoid overfitting/tautology. But in science, we often use existing data to validate new theories. The SE intuition aligns with the Bayesian problem (if the model "saw" the data, did it learn?). But in science, the *theory* didn't exist, so it couldn't have "seen" the data in the same way.

