answer: |-
  **Elena (Bayesian):** Let's look at the Mercury case straight on. In 1915, Einstein derived the perihelion shift from General Relativity (GR). The data $E$ was already known. In my framework, confirmation is an increase in credence: $P(T|E) > P(T)$. But if $E$ is certain, $P(E) = 1$. Bayes' theorem becomes $P(T|E) = P(E|T)P(T)$. Since probabilities cap at 1, $P(T|E)$ can't exceed $P(T)$. The math says Einstein's discovery shouldn't have boosted his confidence in GR. But it clearly did.

  **Mark (Likelihoodist):** That's because you're conflating *psychological updating* with *evidential support*. My framework doesn't track your credence $P(T)$; it tracks the Likelihood Ratio: $\frac{P(E|T_{GR})}{P(E|T_{Newton})}$. GR predicts $E$ with high probability; Newtonian mechanics predicts it with near zero. The ratio is huge. $E$ strongly favors GR over Newton, regardless of when $E$ was entered into the database.

  **Elena:** But science isn't just about abstract relations between propositions; it's about agents changing their minds. If the formalism says "no update," it fails to describe the rational behavior of the scientist. If I already know the test set labels, I can't use them to validate the model. It feels like overfitting to history.

  **Mark:** That's a software engineering intuition, not a logical one. In ML, you worry about the *process* generating the model. In confirmation, we care about the *relationship* between hypothesis and data. If the relationship is strong, it's strong. Whether the agent knew $E$ yesterday or yesterday-century is irrelevant to the likelihood function. You're trying to solve a problem about *history* using a calculus of *states*.

  **Elena:** I can't just ignore the history. The reason $E$ confirms $T$ is that $T$ *explained* $E$. But if $E$ is already certain, I can't learn $E$ from $T$. Some Bayesians, like Garber, suggest we model the agent as uncertain about the *logical connection* between $T$ and $E$. So I update not on $E$, but on the proposition "$T$ entails $E$."

  **Mark:** That works, but it's contortionist. You're expanding the sample space to include logical truths as uncertain events just to save the updating rule. Why not just admit that $P(E)$ is irrelevant to confirmation? The Likelihood Principle says all the evidence is in the likelihoods. If you strip out the priors and the marginal probability of evidence, the "Old Evidence" problem vanishes. $E$ supports $T$ because $T$ makes $E$ probable, not because $E$ surprises you.

  **Elena:** Because "support" without belief change is inert. If a scientist says, "This data supports my theory, but I won't increase my confidence in it," you'd call them irrational. The Mercury case was pivotal *because* it shifted the community's credence. If Likelihoodism can't account for the shift, only the static support, it misses the dynamics of theory acceptance.

  **Mark:** It misses nothing. It draws a line. Likelihood tells you which hypothesis the data favors. Your priors tell you where you start. The fact that $P(E)=1$ blocks the *flow* of probability in your equation doesn't stop the *force* of the evidence in mine. You're trying to force a historical discovery into a synchronic equation. Just admit that old evidence confirms via likelihood ratios, and let your priors handle the temporal aspect separately.

  **Elena:** So you'd sever confirmation from belief updating entirely?

  **Mark:** I'd sever *evidential support* from *subjective history*. The data was in the database before training, yes. But the model—the theory—didn't exist. The "training" happened when Einstein derived the implication. That's where the confirmation lives. Not in your $P(E)$, but in the $P(E|T)$.

  **Elena:** Then we agree on the physics, but disagree on the bookkeeping. You say the ledger is balanced by the likelihood ratio. I say the ledger must reflect the change in the accountant's net worth. If I can't book the asset because I already knew I owned it, my balance sheet is broken.

  **Mark:** Then fix your accounting rules, Elena. Don't blame the asset.
