prompt: |-
  Hey, I've been chewing on this old rationalist-forum idea about self-reference and I'm a bit stuck. Could you compare Hofstadter's strange loops — the Drawing Hands kind of tangled hierachy where levels loop back on themselves — with the idea of an inviolate level that doesn't feed back? Specifically, I want to know whether that flat base is actually necessary to stop an infinate regress, or whether it's really just a strange loop that has temporarily stalled. Argue for the view that if the bottom level is only paused rather than genuinely outside the loop, then the whole distinction between tangled hierarchies and ordinary layered ones collapses. Don't bother with citations or reading lists — I just want the reasoning spelt out plainly.
reasoning: |-
