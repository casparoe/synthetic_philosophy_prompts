answer: |-
  Here is a breakdown of the readings you can take back to your friend. I have evaluated your three categories, added the one crucial reading your taxonomy misses (which is likely the one doing the heavy lifting in macroeconomics), and assessed their philosophical status and implications for methodological individualism.

  1.  **Predicate Novelty (Your Category i)**
      *   **The Claim:** The committee possesses descriptive properties (e.g., "deadlocked," "hawkish," "divided") that no single member possesses.
      *   **Status:** **Mere Truism.** It is conceptually true that collective nouns carry predicates that do not apply to singular nouns. A single brick cannot be "a wall," but many bricks can.
      *   **Implication for Individualism:** **Does not rule it out.** This is compatible with strict methodological individualism. The predicate "deadlocked" is simply a shorthand for a specific configuration of individual votes (e.g., Member A voted Yes, Member B voted No). It describes the *arrangement* of the parts, not a new substance. It makes the explanation slightly more verbose (you must describe the configuration), but not impossible.

  2.  **Derivational Complexity (Your Category ii)**
      *   **The Claim:** Even with perfect knowledge of every member's psychology and the rules, the outcome is computationally irreducible or chaotic; you cannot *derive* the decision without simply running the system.
      *   **Status:** **Substantive Empirical Claim.** This is a claim about complexity theory and cognitive limits. It is defensible in complex adaptive systems, though often overstated in small committees (like a central bank board).
      *   **Implication for Individualism:** **Makes it hard in practice, not in principle.** This is an *epistemic* barrier, not an *ontological* one. It concedes that the individuals cause the outcome, but argues the causal chain is too tangled for human modeling. It justifies using aggregate models (macro) rather than agent-based models (micro), but it does not prove the aggregate exists independently of the agents.

  3.  **Institutional Constraints (Your Category iii)**
      *   **The Claim:** The outcome is underdetermined by psychology alone because it depends on institutional facts (voting rules, agenda-setting power, tenure) that exist externally to the members' current mental states.
      *   **Status:** **Substantive Ontological Claim.** This is the strongest version of your taxonomy. It argues that social structures have a reality that constrains individuals. However, a sophisticated individualist would counter that rules only exist because individuals *believe* they exist and act to enforce them (a shared equilibrium).
      *   **Implication for Individualism:** **Makes it hard to produce.** To maintain individualism here, you must expand your "individual facts" to include "beliefs about rules" and "expectations of enforcement." If your friend claims the rules constrain members *regardless* of their beliefs (e.g., a legal statute that binds them even if they ignore it), she is claiming a form of structural realism that challenges strict individualism.

  4.  **Downward Causation (The Missing Reading)**
      *   **The Claim:** The committee as an entity exerts causal power back onto the members or the economy that cannot be decomposed into the members' actions. For example, the "Credibility of the Fed" influences inflation expectations in a way that persists even if the entire committee is replaced.
      *   **Status:** **Substantive and Controversial.** This is "Strong Emergence." It claims the whole has causal powers distinct from the sum of the parts' powers.
      *   **Implication for Individualism:** **Rules it out.** If the *institution's* reputation causes market movements independently of the current members' intentions or beliefs, then the individualist explanation is incomplete. The "whole" is a causal agent in its own right.

  ***

  **Which reading is normally being traded on?**

  When people use "the whole is more than the sum of its parts" to end an argument in social science, they are usually trading on a conflation of **Reading 2 (Derivational Complexity)** and **Reading 4 (Downward Causation)**.

  They mean to say: *"The system behaves in ways that look like they have their own logic (4), and even if they don't, it's too complicated for you to trace it back to the people (2), so stop asking."* It is often used as a thought-terminating cliché to shield aggregate models from micro-foundational scrutiny.

  **Would I defend that reading?**

  No. I would defend a qualified version of **Reading 3 (Institutional Constraints)** while rejecting strong **Reading 4**.

  In macroeconomics, institutions matter, but they are ultimately sustained by individual expectations and incentives. "Central Bank Credibility" is not a magical force; it is a shorthand for the market's *belief* about how future committee members will act based on past precedents. You can explain this individualistically (as a reputation equilibrium) without positing a mystical group mind. Your friend is right that you cannot explain the decision *solely* by looking at a member's psychology in isolation (you need the rules and the interactions), but she is wrong if she implies the committee has causal powers that float free of the individuals constituting it. The "whole" is more than the sum of the parts only in the sense that a *machine* is more than a pile of gears: it is the gears plus the arrangement and the constraints, all of which are ultimately physical (or psychological) facts.
