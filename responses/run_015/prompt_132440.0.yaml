prompt: |-
  hey, i need help building a taxonomy / decision tree for a blog post i'm drafting. the topic is what "work" even means once automation takes over not just manual labor but also the judgment-calls — like legal reasoning, medical diagnosis, creative editing. i want something that sorts readers by what they acutally believe, not by the label they like.

  please act like a philosopher of labor with some social ontology background — no historian, and definetly no bibliography or reading list, since i'm writing for people who can't search stuff up. before you draw the tree, do a quick brainstorm: what are the real fault lines? i think they involve (1) whether work must produce an external good, (2) whether it needs to be effortful or hard, (3) whether it needs social recognition, and (4) this niche idea i want to inject — "cognitive residue" — the leftover mental friction that stays with a human even when an AI does the task, and whether that residue counts as real work or just noise.

  then deliver these sections in this order:

  1. Brainstorm dump — about 100 words, rough bullet form, no polish needed.
  2. The tree — start with "Does work require producing something outside yourself?" then branch with concrete yes/no or either/or nodes. each node should be a claim an ordinary person could agree with without knowing philosophy jargon. make sure these leaves appear: the "work is dead, celebrate it" view; the "work migrates to care and relationship labor" view; the "work is just effort, so AI can't kill it" view; and the "cognitive residue" view where people still "work" by supervising or interpreting AI outputs. flag any pair of leaves your tree can't really seperate.
  3. Leaf descriptions — 2 to 3 sentences per leaf. name the position (or call it unnamed), and state its most awkward commitment in plain language.
  4. Unoccupied branches — brief notes on answer-combinations that have no defenders. are they incoherent, ugly, or just unexplored? be honest if you're guessing.
  5. How to use it — 2 or 3 sentences on turning this into a quiz for blog readers.

  keep it casual — a typo or two is totally fine, makes it feel real. don't quote anyone verbatim, don't ask for sources, and don't drop obscure philosopher names unless you have to. ground everything in ordinary cases: nursing, coding, parenting, factory oversight. think carefully about whether each branch actually seperates people, not just decorates the page.
