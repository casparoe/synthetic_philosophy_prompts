answer: |-
  1. Brainstorm dump
  Is work about the thing made or the sweat spent? If AI writes the code, did you work if you just clicked run? Care work vs. making widgets. Cognitive residue: the anxiety of checking AI work. Is that labor? Social recognition: if no one sees it, is it work? Automation kills production but maybe not responsibility. Some think work is suffering; others think it's contribution. The bullshit jobs angle vs. essential labor. Does play count if it earns money? Residue might be the new alienation. We need to sort by gut feeling, not job title. Is oversight labor or just stress?

  2. The tree

  **Start:** Does work require producing something outside yourself?

  *   **NO** → **Is the value in the struggle/effort itself?**
      *   **YES** → *Leaf: "Work is just effort, so AI can't kill it"*
      *   **NO** → *Leaf: "Work migrates to care and relationship labor"*

  *   **YES** → **If a machine makes the thing perfectly, is there still human work left?**
      *   **NO** → *Leaf: "Work is dead, celebrate it"*
      *   **YES** → **Is that leftover work mostly anxiety/checking (mental friction)?**
          *   **YES** → *Leaf: "Cognitive residue"*
          *   **NO** → *(Leads to Unoccupied Branch A)*

  *(Flag: The "Care" leaf and "Effort" leaf might bleed together, since care is often effortful. The tree forces a choice on where the value sits.)*

  3. Leaf descriptions

  **"Work is just effort, so AI can't kill it"**
  This view says work is defined by the subjective experience of difficulty, not the output. The awkward commitment here is that digging a hole and filling it back in counts as real work, even if it achieves nothing.

  **"Work migrates to care and relationship labor"**
  This position argues that once making stuff is automated, only human-to-human connection counts as labor. It awkwardly implies that fixing a car is less "work-like" than comforting a friend, even if both are hard.

  **"Work is dead, celebrate it"**
  This is the post-work view where machines handle production and humans don't need to oversee them. The uncomfortable bit is admitting your current career was essentially a placeholder waiting to be deleted.

  **"Cognitive residue"**
  This view claims we still work by supervising, interpreting, or worrying about AI outputs. It awkwardly defines your job as mostly managing the anxiety that the machine might be wrong.

  4. Unoccupied branches

  **Branch A (Product + Machine Does It + Human Leftover + No Friction):** This implies humans still "do" something after automation, but it feels effortless and isn't just oversight. Most people can't decide if this is "play" or "work," so nobody really defends it as a stable category. It's theoretically possible but feels like wishful thinking.

  **Branch (No Product + No Effort + No Relation):** This would be work that happens entirely inside your head, requires no struggle, and helps no one. It's incoherent. Basically a daydream.

  5. How to use it

  Turn this into a "What's Your Work Soul?" quiz where readers answer the bolded questions honestly, not how they wish things were. Map their path to the leaf that matches their answers, then ask them to read the "awkward commitment" to see if it stings. If it does, they found their real position.
