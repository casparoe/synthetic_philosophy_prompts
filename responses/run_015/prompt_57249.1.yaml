answer: |-
  The light in the Archive was always the same: a pale, dust-thickened grey that fell from the high clerestory windows and died on the reading desks. There were no shadows here, only varying degrees of dimness. Elara rubbed her eyes. The audit pile before her was three feet high, bound in twine that smelled of old glue.

  "Next batch," she said. Her voice sounded too loud in the silence of the scriptorium.

  Kael, seated opposite, dipped his quill. He was nineteen, with the smooth, unlined face of someone who had never seen sun harsh enough to burn. He had been left at the gate in a basket, wrapped in a blanket printed with the City seal. He belonged to the Archive completely.

  "Batch 409," Kael said. He slid a folio across the desk. "Mostly sensory terms. Textiles, tastes, weather effects."

  Elara opened the folio. The paper was thin, rationed stock. The Prefect's order sat on the top page: *New Edition requires reduction of volume by ten percent. Candidates for deletion: Entries lacking valid OSTENSIVE verification.*

  The Termination Rule was the spine of the City. Every word had to hold. If you looked up a word, it pointed to other words, and those pointed to more, until finally you reached a word stamped OSTENSIVE. That stamp meant a Compiler had stood before the thing, pointed at it, and another person had watched them do it. It was the anchor. Without it, the chain drifted.

  Elara turned to the first flagged entry.

  > **ASTRINGENT.** *adj.* Producing a PUCKER (q.v.) in the flesh of the mouth; HARSH (q.v.) to the tongue. See BITING (q.v.). [No Stamp]
  >
  > **PUCKER.** *v.* To contract inward, as skin under COLD (q.v.) or mouth under ASTRINGENT (q.v.). [OSTENSIVE: Witnessed by J. Vane, 3rd Era]
  >
  > **HARSH.** *adj.* Unpleasantly ROUGH (q.v.); severe to the ear. See DRY (q.v.). [OSTENSIVE: Witnessed by J. Vane, 3rd Era]
  >
  > **DRY.** *adj.* Devoid of MOISTURE (q.v.). See BITING (q.v.). [OSTENSIVE: Witnessed by J. Vane, 3rd Era]
  >
  > **BITING.** *adj.* Sharp taste; stinging sensation. See ASTRINGENT (q.v.). [No Stamp]

  Elara traced the line with her finger. Astringent led to Pucker, which led back to Astringent. Or it went through Harsh to Dry to Biting, which led back to Astringent. The chain closed on itself like a snake eating its tail. There was no ground.

  "The persimmon trees," Elara said. "The last one died forty years ago. On the South Terrace."

  Kael nodded. He was copying a marginal note onto a fresh sheet. "So the object is gone. We cannot point at it."

  "If we delete 'astringent'," Elara said, "contracts regarding tanning agents become void. Medicines for weeping sores lose their description. Water shares defined by 'astringent soil' become disputable."

  "Then we must find a new ostension," Kael said. He looked up, eager. "Is there another fruit? A chemical mix?"

  "No. It's specific. It's the way the mouth pulls in." Elara paused. She was forty-five. She had a memory, faint and yellowed like old paper, of being six years old. A slice of orange-gold fruit. The way her lips had tightened, the dryness that wasn't thirst. "I ate one. Once. Before the blight."

  Kael's eyes widened. "You have the experience. You can stamp it."

  "I can't point at nothing, Kael. The Rule says I must point at the thing."

  "But you are the thing," Kael said softly. "Your mouth is here."

  Elara looked at him. He used the words perfectly. He had never tasted a persimmon. He had never felt the sun on the South Terrace. Yet he spoke the language of the City without stumbling.

  She pushed the folio aside and picked up another sheet. "Look at this one. 'Echo'."

  > **ECHO.** *n.* The sound returned from a surface. See REPEAT (q.v.). [OSTENSIVE: Witnessed by T. Moll, 3rd Era]

  "Moll stamped this," Elara said. "He claimed he pointed at an echo."

  Kael frowned. "He pointed at the wall where the sound came from."

  "No. He pointed at the air. You can point at a wall. You can point at a mouth. You cannot point at a return." Elara felt a coldness in her stomach that had nothing to do with the drafty room. The persimmon was gone, but it had been real. The echo was a trick of the rule. Someone had stamped a ghost and called it stone.

  "That is a different error," Kael said. He was careful not to judge. He wanted to be a Compiler. He wanted the City to hold.

  "It means the stamp is worthless," Elara said. "If they lied about the echo, they might have lied about the persimmon. Maybe Vane never saw a pucker. Maybe he just stamped the paper."

  "Does it matter?" Kael asked. "If I say 'the cloth is harsh', you know what I intend. If I say 'the clause is astringent', the contract holds. The work gets done."

  "It matters to me." Elara stood up. The chair scraped against the stone floor. "Come here."

  She walked to the center of the room, away from the desks. Kael followed. She needed him to understand why the deletion threatened her. It wasn't just the contracts. It was the feeling that she was the last vessel of a specific truth, and if she poured it out, it would vanish from the world.

  "Tell me what 'astringent' is," she said.

  Kael straightened. "It describes a quality of texture or taste that causes contraction. It is often used in legal contexts to denote binding tightness."

  "No. Tell me what it *is*."

  Kael hesitated. He looked at her mouth, then at his own hands. "It is... like when you drink water that has been sitting in a copper pipe. It makes the tongue feel heavy. Like when you swallow dust."

  "No," Elara said. "That's gritty. That's rough."

  "Like when you are afraid," Kael tried. "Your throat closes."

  "That's fear. This is... chemical." Elara struggled. She reached for the memory. It was slippery. Was it sweet first? Then dry? Or just dry? "Imagine you bite into a apple that thinks it is a stone. Your saliva stops. The skin of your tongue feels like it belongs to someone else."

  Kael nodded slowly. "I see. Like a numbness."

  "No! It's not numb. It's active. It's pulling." Elara snapped her fingers. "It's like the fruit is tasting *you*."

  Kael smiled, a warm, competent smile. "That is a lovely definition. I shall note it in the margin. 'The fruit tasting you.' That will help the scribes."

  Elara dropped her hand. He had taken the words. He had filed them. He understood the usage, the weight, the placement in the sentence. But the sensation hadn't landed. It had hit a wall and returned to her, like an echo.

  "You don't know," she said. It wasn't an accusation. It was a realization.

  "I know how to use it," Kael said. "If I write it in a contract, the judge will rule based on it. If I prescribe it in a dosage, the patient will recover. Does the taste matter more than the cure?"

  "If the word is untethered," Elara said, "it can drift. 'Astringent' could come to mean 'sweet'. Then the medicine kills."

  "But we have the chain," Kael said. "Pucker. Dry. Bite. They hold each other up."

  "They are holding each other up in a vacuum," Elara said. She thought of the Echo entry. Moll had stamped it. He had lied, or he had been mistaken. But the City had run on that stamp for three generations. Nothing had broken. The walls stood. The water flowed.

  Her memory of the persimmon surged again. The color. The shock of it. But alongside it came a doubt. Was that memory real? Or was it a story her mother had told her? *You ate the fruit, Elara. You remember the pull.* She had repeated the story so many times it had hardened into fact. She was no better than Vane. She was stamping a memory, not a thing.

  She walked back to the desk. The audit clock ticked. They had to finish the batch by vespers. If she marked 'astringent' for deletion, the word died. If she kept it, she had to validate it.

  Kael watched her. He wanted to pass. He wanted to stay in the Archive. If she refused to stamp, the Prefect would send a senior auditor. They would delete the entry. Kael would be marked as inefficient.

  "Elara," he said. "The paper limit. If we keep it, something else goes. Maybe 'shadow'. Maybe 'north'."

  "North is ostended," she said. "By the star."

  "By the star we cannot reach," Kael said. "We point at the sky."

  Elara looked at the entry for **ASTRINGENT**. The blank space where the stamp should be was white and waiting.

  She picked up the seal. It was heavy brass, cold in her hand. The ink pad was dry; she pressed it hard to wet the surface.

  If she stamped it OSTENSIVE, she lied. She claimed there was a thing to point at, and there was only her memory, which might be a story. She would be like Vane. She would be like Moll with his echo. She would ground the word in a falsehood.

  If she left it blank, the word was doomed. The chain would be broken. The contracts would fray. The City would lose a tool it used to bind itself together.

  Kael leaned forward. "The Prefect wants the books closed."

  Elara looked at Kael. He was ready to inherit this. He would use the word 'astringent' for the rest of his life. He would write it in deeds and dosages. He would never taste the fruit. He would never know the difference between the pull of the tannin and the pull of fear. And yet, he would be right. The City would function.

  She realized then that the OSTENSIVE stamp was not about the thing. It was about the agreement. Vane hadn't anchored the word to the persimmon. He had anchored it to the witness. The witness was gone. But she was here.

  She pressed the seal down.

  She did not stamp it OSTENSIVE.

  She stamped it **VERIFIED**.

  It was not a standard mark. It was not in the Rule. It meant nothing in the Lexicon. It meant everything in the room.

  Kael looked at the purple ink drying on the page. He did not speak. He dipped his quill and copied the mark into the ledger.

  "Verified," Kael said. "By whom?"

  "By me," Elara said.

  "And if you die?"

  "Then someone else verifies it," Elara said. "Not the fruit. The use."

  She turned the page. There were more entries. 'Glint'. 'Shiver'. 'Hollow'. Some referred to things that were gone. Some referred to things that had never been there. She would go through them all. She would not find the persimmon. She would not find the echo.

  She picked up the next sheet. Her hand was steady. The ink was wet. The word remained, hanging in the air between them, supported not by the earth, but by the weight of their agreement to keep it there.

  "Next," Elara said.

  Kael turned the page. The light in the room did not change. The dust motes danced in the grey beam, rising and falling, grounded by nothing, visible to all.
