answer: |-
  ### Agreed claims

  1.  Probabilistic representations, whether sharp or set-valued, must obey coherence constraints to avoid sure loss in betting scenarios.
  2.  Rational agents update their state of confidence upon receiving new evidence, typically via some form of conditionalization.
  3.  Decision-making should align with the agent's state of confidence and their utility function over outcomes.
  4.  Distinctions between aleatory variability and epistemic uncertainty are useful for modeling physical systems.
  5.  Calibration—matching stated confidence to long-run frequency—is a desirable property for any reporting system.
  6.  No methodological framework guarantees truth; all models are simplifications of physical reality subject to error.
  7.  Communication of uncertainty must be transparent to allow decision-makers to assess risk appropriately.
  8.  Proper scoring rules incentivize honesty in forecasting, though their interpretation varies between camps.
  9.  Rationality prohibits arbitrarily ignoring relevant evidence when forming credences.
  10. Both frameworks aim to minimize expected loss, differing only on how expectation is defined under ignorance.

  ### Disagreements

  | Crux (Neutral) | Imprecise-Credence Formulation | Sharp-Prior Formulation |
  | :--- | :--- | :--- |
  | **Normative Status of Imprecision** | Rationality *requires* imprecise credences when evidence is sparse or ambiguous to avoid arbitrariness. | Rationality *permits* only sharp credences; imprecision reflects unresolved psychological hesitation, not evidence. |
  | **Dilation Phenomenon** | Dilation correctly describes evidence that legitimately widens uncertainty intervals about a hypothesis. | Dilation is a pathological artifact of set-based updating that violates confirmational intuition. |
  | **Decision Rules** | Interval-based rules (e.g., E-admissibility) are necessary to protect against worst-case scenarios under ignorance. | Expected Utility Maximization is sufficient; one must integrate over nuisance parameters using a prior. |
  | **Scoring & Accuracy** | Sets minimize worst-case loss; sharp forecasts are overconfident when evidence is insufficient. | Sharp forecasts minimize expected loss; imprecise forecasts are evasive and penalized by proper scoring rules. |

  ### Tests and pre-registered predictions

  **1. Normative Status (Ellsberg)**
  In a standard Ellsberg urn experiment, subjects prefer known risks over unknown ambiguities. ICT predicts rational agents will exhibit this preference, violating Savage's axioms, proving sharp priors are inappropriate. SPB predicts rational agents will adopt a sharp hierarchical prior over urn compositions; observed ambiguity aversion is a cognitive bias, not rationality. ICT is refuted if subjects consistently maximize expected utility with sharp priors when incentivized. SPB is refuted if subjects persistently reject Dutch Books constructed from their ambiguity aversion.

  **2. Dilation (Evidence Processing)**
  Consider a binary hypothesis where evidence confirms the hypothesis but dilates the probability interval. ICT predicts rational agents will accept wider intervals post-evidence, acknowledging loss of discriminatory power. SPB predicts rational agents will never accept dilation; it indicates a flawed model or prior specification. ICT is refuted if dilation leads to sure loss in a sequential betting game. SPB is refuted if sharp updating forces a decision that is demonstrably worse than withholding judgment.

  **3. Decision Rules (Metrology Case)**
  Two instruments measure a contaminant (limit 12.0 ppb). Readings: 12.1 and 11.6. Bias: ±δ (unknown distribution/correlation). ICT predicts the credible interval for the true value will straddle 12.0 ppb, mandating "indeterminate" compliance. SPB predicts assigning a uniform prior to bias yields a sharp probability; decision is binary (compliant/non-compliant). ICT is refuted if the "indeterminate" verdict causes greater regulatory harm than a sharp decision over a long run. SPB is refuted if the sharp prior leads to systematic false convictions when bias correlations exist.

  **4. Scoring & Accuracy (Forecasting)**
  Forecasters predict binary events over a long run. ICT uses interval forecasts; SPB uses sharp probabilities. ICT predicts sharp forecasters will suffer higher worst-case loss during periods of structural ignorance. SPB predicts imprecise forecasters will suffer higher average loss under proper scoring rules (e.g., Brier score) due to evasiveness. ICT is refuted if sharp forecasters consistently outperform on worst-case metrics. SPB is refuted if imprecise forecasters achieve lower regret during model misspecification.

  ### Verbal or substantive

  This dispute is substantive, not merely verbal. While both camps use the language of probability, they prescribe different actions in high-stakes, low-information environments. The divergence is not about the definition of "belief" but about the permissible mapping from evidence to action. If the metrology case yields a regulatory violation for the sharp Bayesian but an indeterminate status for the imprecise theorist, real-world consequences differ. The sharp prior imposes information (the distribution of bias) that does not exist; the imprecise set withholds it. This changes liability, safety margins, and resource allocation. Therefore, the choice of framework alters the physical world through decision outcomes, making it an empirical dispute about rational risk management rather than a semantic disagreement about terminology.

  ### What this means for the lab bench

  Your committee was doing pragmatic risk management, not pure philosophy. When you published a coverage interval, you were providing a tool for decision-makers to limit error frequencies, not necessarily stating a subjective degree of belief. Both camps could sign a statement declaring: "This interval defines a range of values consistent with the data and known physical constraints, within which the true value is asserted to lie with a specified level of confidence." The sharp Bayesian interprets this as a credible interval requiring a prior; the imprecise theorist interprets it as a confidence set requiring no prior. The agreement lies in the *usage*: the interval serves to warn users of potential error magnitudes. Your committee should have explicitly stated that the coverage factor was chosen to balance the risk of false acceptance against false rejection, acknowledging that without a prior on bias, the interval represents a bound on reliability rather than a probability density. This procedural neutrality allows both philosophies to utilize the standard without resolving their metaphysical differences.
