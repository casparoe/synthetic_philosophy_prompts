  *   **The "Script" Precedent:** Case 4 (Dead Woman) failed because the behavior was "borrowed." Dana had a character brief, but she deviated from it (rent control, second apology). Sam will likely view the brief as **initial conditions** (like genetics) rather than a **script** (like a puppet), provided the system showed the capacity to diverge from it.

