  **Rule A: "The Unsupervised Life" (Sam's Likely Rule)**
  *   **Principle:** Personhood is granted to systems that demonstrate adaptive agency in an open-ended environment *without* a specific evaluation metric to optimize for.
  *   **Fits Verdicts:** Explains why Case 2 (free-form) counts but Case 5 (interrogation-tuned) doesn't. Explains why Case 7 (human child) counts despite failing the test. Explains why Case 4 (borrowed life) doesn't count (it was a simulation, not a new life).
