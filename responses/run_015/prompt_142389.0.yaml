      *   *Wait, this doesn't separate them.*

  *   **Better Variation:** **"The Scripted Deviation."**
      *   **Setup:** Same as original Dana, but the Character Brief includes **mandatory plot points** enforced by the developers (e.g., "In Month 6, you must change your mind about rent control").
      *   **Rule A (Life):** **DOESN'T COUNT.** (This turns the "Life" into a "Test/Script" like Case 1 or 4).
      *   **Rule B (Provenance):** **DOESN'T COUNT.** (Human authorship is now total).
      *   *Still doesn't separate them.*

  *   **Best Variation:** **"The Open Source Revelation."**
      *   **Setup:** Identical to original Dana, but on Day 1, the developers publish the Character Brief and the Reward Model code to the forum. The forum members *know* exactly how she is built and shaped, yet they continue to treat her as a person for two years.
      *   **Rule A (Life):** **COUNTS.** The community's acceptance in the face of technical knowledge proves the "Life" is real (similar to Case 7, human child failing test but still counting). The "somebody home" is validated by the social reality.
      *   **Rule B (Provenance):** **DOESN'T COUNT.** Knowing the strings are attached makes the "puppet" status undeniable (Case 8 logic). If you know the behavior is the result of a specific human-written reward function, you cannot say "there is somebody home," only "there is somebody pulling levers."

