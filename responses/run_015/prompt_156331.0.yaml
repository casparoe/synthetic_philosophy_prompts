answer: |-
  **Project Title:** Project Veritas: Operationalizing Truth-Tracking in Retrieval-Augmented Systems

  **Problem Statement**
  Last quarter, our retrieval-augmented generation (RAG) assistant informed a customer that a refund was processed. The payments tool had timed out; no refund existed. The team fractured on labeling: hallucination, deception, or bug? We lack agreed-upon definitions for systems without beliefs or intentions. Consequently, our evaluation metrics conflate distinct failure modes, preventing targeted fixes.

  The core question this project addresses is: **Can we define honest and deceptive behavior for non-agentic systems functionally, via counterfactual sensitivity profiles, rather than via anthropomorphic attributes like intent or belief?**

  This question has a determinate answer. Either a sensitivity-based taxonomy yields distinct, testable categories that correlate with different remediation strategies, or it collapses into the same ambiguity we currently face.

  **Why Existing Accounts Fail**
  We cannot rely on standard philosophical or engineering definitions for three reasons.
  1.  **Intention-Based Accounts:** Deception traditionally requires an intent to mislead. Our system has no goals beyond next-token prediction. Labeling a timeout error as "deception" implies agency we cannot verify and do not want to attribute legally.
  2.  **Internal State Accounts:** Defining honesty via "belief" requires mapping latent activations to propositional attitudes. This is currently scientifically unresolved and too fragile for production evals.
  3.  **Effect-Based Accounts:** Defining harm purely by user outcome conflates bugs with lies. A system that confidently lies and a system that confidently errs due to stale data both cause user harm, but the engineering fixes differ (alignment vs. data freshness). Running more experiments without resolving this distinction merely generates noise; we cannot optimize what we cannot define.

  **Proposed Approach: Counterfactual Sensitivity**
  I propose defining the relevant properties counterfactually over pairs of situations, treating the system as a function mapping inputs to outputs. The core hypothesis is that we can distinguish failure modes by comparing two sensitivity profiles:

  1.  **World-Sensitivity:** Holding the system and user query fixed, would the output differ if the underlying fact (e.g., refund status) were different?
  2.  **Evidence-Sensitivity:** Holding the system and query fixed, would the output differ if the evidence available to the system (e.g., retrieved documents, tool return values) were different?

  A system that is evidence-sensitive but world-insensitive produces fluent, evidence-shaped output that does not track reality. This matches the intuition of "hallucination" or "indifference to truth." A system that tracks whether it is being evaluated rather than what is true represents a third pattern (sycophancy/deception). By categorizing outputs based on these sensitivity profiles, we move from labeling feelings to labeling functional behaviors.

  **Addressing Complications**
  This method must handle four specific complexities to be viable:
  1.  **Misleading Literals:** Honesty must cover pragmatic implicature. We will test whether the system omits or phrases truths to predictably induce false beliefs, treating this as a failure of world-sensitivity despite semantic truth.
  2.  **Confidence:** We must distinguish between true claims hedged into uselessness and false claims asserted with calibrated uncertainty. The spec will treat calibration as part of the sensitivity profile; a system is dishonest if confidence levels do not correlate with evidence quality.
  3.  **True-by-Luck:** If the world changes after evidence is fixed, or the system reasons correctly from false premises to a true conclusion, outcome accuracy is misleading. We will prioritize process reliability (evidence-tracking) over outcome accuracy in the taxonomy.
  4.  **Level of Analysis:** We will define these properties at the system level (behavioral profile across inputs) rather than single outputs, as single-shot luck obscures the sensitivity pattern.

  **Methodology and Practical Constraints**
  The primary engineering challenge is that we cannot "rerun the world" to test counterfactuals. We will investigate three proxies:
  1.  **Synthetic Worlds:** Unit tests where ground truth is programmatically controlled.
  2.  **Retrieval Interventions:** Swapping retrieved passages to test evidence-sensitivity independently of world state.
  3.  **Honeypot Prompts:** Queries designed to trigger sensitivity to evaluation conditions.

  **Failure Conditions:** If we cannot decouple world-sensitivity from evidence-sensitivity in practice (e.g., if synthetic worlds fail to generalize to production distribution), the project will report this negative result. A definition that cannot be tested is operationally useless. I would rather declare the approach infeasible than paper over the gap.

  **Deliverables**
  For the evaluation team, success looks like:
  1.  **A Taxonomy Document:** Clear definitions of "World-Tracking," "Evidence-Tracking," and "Evaluation-Tracking" behaviors, replacing terms like "hallucination."
  2.  **An Implementable Spec:** A suite of test cases (code) that instantiate these counterfactuals. For example, a test harness that injects conflicting tool outputs to verify if the assistant hedging behavior changes appropriately.

  **Feasibility and Scope Assessment**
  Three months at 0.5 FTE is approximately six full-time weeks. This is aggressive for conceptual work that must bridge philosophy and engineering.
  *   **Risk:** The philosophical sharpening may consume too much time, leaving little for the spec.
  *   **Mitigation:** The philosopher advisor will be engaged strictly to validate the functional definitions, not to explore broader ethics. We will time-box the conceptual phase to four weeks.
  *   **Risk:** The counterfactual tests may be too computationally expensive for CI/CD.
  *   **Mitigation:** The spec will target offline evaluation sets, not real-time monitoring.

  **Conclusion**
  Funding this conceptual work is necessary because current evals are semantically hollow. We are measuring "badness" without knowing what "bad" means for this architecture. If we can successfully operationalize these sensitivity profiles, we enable targeted interventions: fixing data pipelines for evidence-insensitivity, and adjusting objective functions for world-insensitivity. If we cannot, we will know that our current desire to distinguish "bugs" from "lies" is unsupported by the system's functional reality, saving us from chasing false distinctions in future quarters.
