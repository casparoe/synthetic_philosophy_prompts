prompt: |-
  I serve on the capital-projects committee of a regional public-works authority, where we evaluate infrastructure proposals whose benefits fall decades or centuries apart: a flood-defense wall, a geological carbon-storage site, and long-lived containment systems. Our staff currently collapses every comparison into a net-present-value formula using market interest rates, but that conflates pure time preference—the philosophical claim that future welfare should not be weighted less merely because it occurs later—with risk premiums, capital scarcity, and uncertainty about future populations. I want you to operationalize the principle that pure temporal discounting is unjustified (while allowing that near and distant outcomes may still diverge for other reasons) into a reusable decision procedure that a non-economist board member can run in about twenty minutes per proposal, with clear sign-off authority resting with the committee chair. The deliverable should be a step-by-step flowchart in words: the ordered questions, what counts as a sufficient answer to continue, where the procedure halts with a recommendation, and where it explicitly hands the decision to a person because the issue is one of values rather than facts.

  Please construct the procedure so it separates adjustments for pure time preference from adjustments for physical risk, intergenerational equity, and the possibility that beneficiaries will not exist, then apply it to three cases: (a) a seawall with benefits concentrated in thirty years; (b) a carbon-capture and mineralization project whose climate benefits are measurable only after 120 years and require continuous cross-generational maintenance funding; and (c) a nuclear-waste containment retrofit that costs present taxpayers heavily but delivers safety benefits almost entirely beyond 200 years—a case where I expect the procedure will recommend funding yet the board will find the result politically intolerable. For each case show the procedural path and mark any point where judgment must override mechanics. Then identify two structural misfires—scenarios in which following the checklist mechanically yields a recommendation that clashes with common moral intuition—and clarify whether each misfire indicts the underlying principle or only this institutional translation. Be explicit about which steps are genuine tests and which are judgment calls disguised as boxes. End with a one-sentence summary on its own line beginning with 'Bottom line:' that states the single most important limitation of turning pure time preference into an institutional checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a capital-projects committee at a regional public-works authority.
      *   **Problem:** Current NPV analysis uses market interest rates, conflating pure time preference (ethical) with risk/scarcity (economic). The user believes pure temporal discounting is unjustified (zero pure time preference).
      *   **Goal:** Create a reusable decision procedure (flowchart in words) for non-economist board members.
      *   **Constraints:** ~20 minutes per proposal, clear sign-off authority (Committee Chair), separates pure time preference from risk/equity/existence.
      *   **Deliverables:**
          1.  Step-by-step flowchart (ordered questions, pass/fail criteria, hand-offs).
          2.  Application to three cases: (a) Seawall (30 yrs), (b) Carbon Capture (120+ yrs, maintenance), (c) Nuclear Waste (200+ yrs, high cost, political intolerance).
          3.  Identify two structural misfires (mechanical recommendation vs. moral intuition) and analyze if they indict the principle or the translation.
          4.  Distinguish genuine tests vs. judgment calls.
          5.  One-sentence summary starting with "Bottom line:".

  2.  **Deconstruct the Ethical/Economic Principle:**
      *   *Core Principle:* Zero Pure Time Preference (ZPTP). Future welfare counts equally to present welfare *unless* there's a specific reason it shouldn't (risk, non-existence, scarcity).
      *   *Market Rate Issue:* Market rates ($r$) $\approx$ Pure Time Preference ($\rho$) + Risk Premium ($\pi$) + Growth/Scarcity ($\eta \cdot g$). The user wants to remove $\rho$.
      *   *Operationalization:* Instead of discounting the *value* of the future benefit because it's in the future, we discount the *probability* of it occurring or adjust for the *capacity* of future people to handle it.

  3.  **Drafting the Decision Procedure (The Flowchart):**
      *   *Time Limit:* Needs to be quick. No complex modeling. Binary or ternary checks.
      *   *Structure:* Input -> Screening -> Adjustments -> Valuation -> Decision Point.
      *   *Key Separation:* Must distinguish between "It's later so it's worth less" (Forbidden) vs. "It might not happen" or "They will be richer/poorer" (Allowed).
      *   *Authority:* Committee Chair has sign-off, but the procedure guides them.
      *   *Steps:*
          1.  Define Benefit & Timeline.
          2.  Check Existence (Will beneficiaries exist?).
          3.  Check Risk (Probability of delivery).
          4.  Check Capacity (Will they be richer/poorer? Marginal utility).
          5.  Calculate "Equity-Adjusted Value" (not NPV).
          6.  Compare Cost vs. Adjusted Value.
          7.  Chair Sign-off (Values check).

      *Refining the Steps for "20 Minutes":*
      *   Step 1: Baseline Cost/Benefit.
      *   Step 2: The "Time Tax" Check (Ensure no pure discounting).
      *   Step 3: The "Existence & Risk" Filter (Probability discounting).
      *   Step 4: The "Wealth" Adjustment (Intergenerational equity).
      *   Step 5: The "Political/Moral" Override (Chair's discretion).

  4.  **Developing the Three Cases:**
      *   *(a) Seawall (30 yrs):* Standard infrastructure. Low risk, beneficiaries exist, wealth likely higher. Procedure should pass easily.
      *   *(b) Carbon Capture (120+ yrs, maintenance):* High risk of institutional failure (maintenance). Beneficiaries exist but depend on continuity. Wealth likely higher. Procedure highlights the maintenance risk, not the time.
      *   *(c) Nuclear Waste (200+ yrs):* High cost now, benefit later. Beneficiaries exist. Wealth likely higher (suggests lower marginal utility of safety $? Or higher value of life?). *Correction:* If future people are richer, the marginal utility of money is lower, but the value of *safety* might be higher or lower depending on the model. Usually, ZPTP + Growth implies we should save *more* for them. However, the prompt notes "politically intolerable." The procedure will say "Fund," politics says "No."

  5.  **Identifying Structural Misfires:**
      *   *Misfire 1: The "Rich Future" Paradox.* If we assume future generations are richer, standard utilitarianism says transfer wealth to them is *less* valuable (diminishing marginal utility). But ZPTP says treat them equally. If the procedure adjusts for wealth, it might recommend *against* helping rich future people, clashing with the intuition that we shouldn't leave them toxic waste.
      *   *Misfire 2: The "Non-Identity" Problem.* Projects change *who* is born. If a project prevents a catastrophe, different people exist. If the procedure assumes fixed beneficiaries, it misses the ethical weight of creating the conditions for existence itself.
      *   *Analysis:* Do these indict the principle (ZPTP) or the checklist? Usually, they indict the *simplification* required for a 20-minute checklist.

  6.  **Refining the Distinction (Tests vs. Judgment Calls):**
      *   Need to be honest. A 20-minute checklist cannot be purely objective. The "Risk Probability" is a guess. The "Wealth Adjustment" is a value judgment. I need to label these clearly.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* The Intergenerational Equity Protocol (IEP).
      *   *Step 1:* Strip Market Rate. (Test)
      *   *Step 2:* Probability of Delivery. (Judgment/Test mix)
      *   *Step 3:* Beneficiary Existence. (Test)
      *   *Step 4:* Marginal Utility/Wealth. (Judgment)
      *   *Step 5:* Chair's Veto/Sign-off. (Judgment)

      *   *Case Applications:*
          *   Seawall: Passes all.
          *   Carbon: Fails/Risks at Maintenance continuity.
          *   Nuclear: Passes mathematically, fails politically at Chair Sign-off.

      *   *Misfires:*
          1.  *The "Obligation to Poverty" Misfire:* If the future is poorer, the checklist demands massive sacrifice now. Intuition says "do what you can," not "starve the present."
          2.  *The "Institutional Mortality" Misfire:* The checklist assumes the Authority exists in 200 years. It won't. The mechanical recommendation relies on an entity that won't exist to manage the risk.

      *   *Bottom Line:* Needs to be punchy about the limitation of institutionalizing ethics.

  8.  **Review against Constraints:**
      *   Flowchart in words? Yes.
      *   20 mins? Yes, kept steps high-level.
      *   Chair authority? Yes, included as final gate.
      *   Separate pure time preference? Yes, Step 1 explicitly bans it.
      *   Three cases analyzed? Yes.
      *   Two misfires? Yes.
      *   Tests vs. Judgment calls? Yes, will label them.
      *   Bottom line format? Yes.

  9.  **Final Polish:**
      *   Ensure tone is appropriate for a public-works authority (formal, precise).
      *   Make sure the distinction between "discounting time" and "discounting probability" is sharp.
      *   Ensure the Nuclear case highlights the tension between the procedure's output and political reality.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "don't discount." I need to say *what to do instead*. If we don't discount for time, do we sum nominal dollars? Yes, but adjusted for probability and marginal utility. I will call this the "Equity-Weighted Expected Value" (EWEV).

      *(Refining the Misfires)*: The prompt asks if the misfire indicts the principle or the translation.
      *   Misfire 1 (Rich Future): If the checklist says "Don't help them because they are rich," but morality says "Don't poison them," that indicts the *translation* (using marginal utility of consumption as a proxy for welfare in a safety context).
      *   Misfire 2 (Institutional Memory): If the checklist assumes maintenance will happen because it's "planned," but institutions die, that indicts the *translation* (assuming institutional continuity).

      *(Refining the Bottom Line)*: "Bottom line: Institutionalizing zero pure time preference inevitably substitutes administrative assumptions for democratic deliberation regarding the specific sacrifices the living owe to the unborn." -> A bit long. Let's tighten. "Bottom line: No checklist can resolve the fundamental political conflict between present sacrifice and future benefit without disguising value judgments as technical calculations."

      *Wait, one more check on the "Judgment Calls disguised as boxes".* I need to explicitly point these out in the procedure section. I will add a legend or annotations.

      *Let's write it.*
answer: |-
  ### The Intergenerational Equity Protocol (IEP)
  **Purpose:** To evaluate capital projects with multi-generational impacts without applying unjustified pure time preference, while accounting for risk, existence, and capacity.
  **Time Required:** ~20 Minutes
  **Authority:** Committee Chair holds final sign-off; Procedure provides binding recommendation unless overridden by documented ethical veto.

  #### Legend
  *   **[TEST]:** Objective verification based on data or engineering specs.
  *   **[JUDGMENT]:** Subjective estimate requiring documented rationale (values disguised as facts).

  ---

  ### Part 1: The Decision Procedure

  **Step 1: Strip the Market Rate [TEST]**
  *   **Question:** Does the financial model use the current municipal bond rate or market interest rate to discount future benefits?
  *   **Requirement:** If YES, reject the model. Recalculate using a **Zero Pure Time Preference Rate (0% real)** for the temporal component.
  *   **Pass Condition:** Future benefits are summed nominally (or adjusted only for inflation), not diminished simply because they occur later.
  *   **Stop:** If staff refuses to recalculate, halt proposal.

  **Step 2: Probability of Delivery [JUDGMENT]**
  *   **Question:** What is the probability ($P$) that the benefit will physically materialize, independent of time preference? (Consider engineering failure, institutional decay, or maintenance lapses).
  *   **Requirement:** Assign a percentage ($0\%–100\%$). This is *risk discounting*, not *time discounting*.
  *   **Pass Condition:** $P$ is documented. For projects requiring active maintenance >50 years, $P$ must be reduced by 10% per century unless a dedicated trust fund is legally secured.
  *   **Calculation:** $Adjusted Benefit = Nominal Benefit \times P$.

  **Step 3: Beneficiary Existence [TEST]**
  *   **Question:** Is there a non-negligible probability that the specific population intended to benefit will not exist (e.g., due to catastrophe the project itself prevents, or migration)?
  *   **Requirement:** If the project prevents an existential risk (e.g., flood defense), existence is assumed for the counterfactual. If the project relies on a specific community remaining in place (e.g., a local park), verify demographic stability.
  *   **Pass Condition:** If population is projected to vanish due to external factors, value = 0. If population vanishes *unless* the project succeeds, value = High (Existential Weight).

  **Step 4: Marginal Utility Adjustment [JUDGMENT]**
  *   **Question:** Will future beneficiaries be significantly richer or poorer than present taxpayers?
  *   **Requirement:** Apply an Equity Weight ($W$). If future people are richer, their marginal utility of money is lower ($W < 1$). If poorer, higher ($W > 1$). If the benefit is non-monetary (e.g., survival), $W = 1$.
  *   **Pass Condition:** $W$ is selected from a standard table (e.g., 0.5 for 2x GDP growth, 1.0 for safety/life, 2.0 for subsistence scenarios).
  *   **Calculation:** $Equity Value = Adjusted Benefit \times W$.

  **Step 5: Cost-Benefit Comparison [TEST]**
  *   **Question:** Is $Equity Value > Present Cost$?
  *   **Pass Condition:** YES = Proceed to Recommendation. NO = Reject.

  **Step 6: The Chair's Ethical Veto [JUDGMENT]**
  *   **Question:** Does the recommendation require a sacrifice from current vulnerable populations that violates the authority's mandate to current constituents?
  *   **Requirement:** The Chair reviews the distribution of costs (who pays now) vs. benefits (who gains later).
  *   **Outcome:**
      *   **Sign-Off:** Chair approves the recommendation.
      *   **Override:** Chair rejects the recommendation. Must file a "Values Conflict Memo" explaining why political reality overrides the ethical calculation.

  ---

  ### Part 2: Application to Cases

  #### Case (a): The Seawall (Benefits in 30 Years)
  *   **Step 1 (Strip Rate):** Staff removes 4% market discount. Benefits summed nominally. **Pass.**
  *   **Step 2 (Probability):** Engineering lifespan is 100 years. 30-year horizon is low risk. $P = 95\%$. **Pass.**
  *   **Step 3 (Existence):** Regional population stable. **Pass.**
  *   **Step 4 (Utility):** Moderate economic growth expected. Safety benefit is non-monetary. $W = 1.0$. **Pass.**
  *   **Step 5 (Comparison):** Value > Cost. **Recommendation: Fund.**
  *   **Step 6 (Chair):** Costs borne by current property owners; benefits protect same group. No conflict. **Sign-Off.**
  *   **Judgment Call:** Step 2 ($P$) relies on engineering confidence, not pure math.

  #### Case (b): Carbon Mineralization (Benefits in 120+ Years, Maintenance Required)
  *   **Step 1 (Strip Rate):** 0% temporal discount applied. **Pass.**
  *   **Step 2 (Probability):** Requires 120 years of active monitoring. No legal trust fund exists yet. Protocol mandates -10% per century. $P = 90\%$. **Pass (but flagged).**
  *   **Step 3 (Existence):** Global beneficiaries. Existence assumed. **Pass.**
  *   **Step 4 (Utility):** Future society likely wealthier, but climate stability is a "survival good." $W = 1.0$. **Pass.**
  *   **Step 5 (Comparison):** High nominal value > High present cost. **Recommendation: Fund.**
  *   **Step 6 (Chair):** Chair notes the maintenance funding is not legally binding. The mechanical $P$ (90%) is optimistic compared to institutional reality.
  *   **Judgment Call:** Step 2 is the critical failure point. The checklist assumes institutional continuity that is historically rare. Chair signs off *conditional* on escrow account creation.

  #### Case (c): Nuclear Waste Retrofit (Costs Now, Benefits >200 Years)
  *   **Step 1 (Strip Rate):** 0% temporal discount. Future safety valued equally to present safety. **Pass.**
  *   **Step 2 (Probability):** Geological containment is passive. $P = 99\%$. **Pass.**
  *   **Step 3 (Existence):** Prevents harm to future generations. **Pass.**
  *   **Step 4 (Utility):** Safety/Life benefit. $W = 1.0$. **Pass.**
  *   **Step 5 (Comparison):** Because time is not discounted, the infinite/long-term stream of avoided harm vastly outweighs present construction costs. **Recommendation: Fund.**
  *   **Step 6 (Chair):** Present taxpayers face immediate rate hikes. Beneficiaries are unborn. Political backlash is certain.
  *   **Judgment Call:** **Step 6 (Override).** The Chair issues a Values Conflict Memo. "While the IEP recommends funding based on intergenerational equity, the Authority lacks the democratic mandate to impose severe hardship on current voters for speculative future gains." **Decision: Reject.**
  *   **Note:** This highlights the clash between the ethical principle (ZPTP) and democratic accountability (Presentism).

  ---

  ### Part 3: Structural Misfires

  **Misfire 1: The "Rich Future" Paradox**
  *   **Scenario:** A project costs \$100M today to save a future generation \$1B in damages. However, economic models predict the future generation will be 10x richer.
  *   **Mechanical Outcome:** Step 4 (Marginal Utility) applies a weight ($W < 1$) because future money is worth less to rich people. The checklist might recommend *rejecting* the project because the *utility* gain is low, even if the *dollar* loss is high.
  *   **Moral Intuition:** We have a duty not to leave hazardous messes regardless of the victim's wealth.
  *   **Diagnosis:** This indicts the **Institutional Translation**. The principle (ZPTP) demands we treat welfare equally, but the checklist proxies "welfare" with "consumption utility." By monetizing safety, the checklist fails to capture the deontological duty of non-harm.

  **Misfire 2: The "Institutional Mortality" Blind Spot**
  *   **Scenario:** A project requires administrative oversight in 150 years to remain safe (like Case B).
  *   **Mechanical Outcome:** Step 2 applies a standard risk reduction (e.g., 10% per century). The project still passes because the benefits are so large under 0% discounting.
  *   **Moral Intuition:** Promising maintenance in 150 years is a lie; institutions dissolve, languages change, records are lost. Funding it creates a false sense of security.
  *   **Diagnosis:** This indicts the **Institutional Translation**. The checklist assumes the Authority (or a successor) will exist to manage the risk. ZPTP is ethically sound, but applying it within a bureaucratic framework that assumes its own immortality is a category error.

  **Genuine Tests vs. Judgment Calls Disguised as Boxes**
  *   **Genuine Tests:** Step 1 (Rate check), Step 3 (Existence data), Step 5 (Math comparison). These are verifiable.
  *   **Judgment Calls Disguised as Boxes:** Step 2 (Probability of institutional maintenance), Step 4 (Wealth/Marginal Utility Weight), Step 6 (Chair's Veto). These appear as checkboxes but require the user to import their own ethical and political assumptions about risk tolerance and distributive justice.

  Bottom line: No checklist can resolve the fundamental political conflict between present sacrifice and future benefit without disguising value judgments as technical calculations.
