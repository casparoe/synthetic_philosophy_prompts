answer: |-
  This is a fantastic question. It cuts right to the bone of institutional analysis: the relationship between the *mechanism* of governance and the *ontology* of the governed. You are effectively asking for the political anthropology of the Pigouvian tax.

  As a PhD student in policy, you know the standard economic justification (internalizing the marginal social cost). But you are probing the *sociological and philosophical preconditions* required for that justification to hold water, and why we select it for roads but not for bathroom queues.

  Here is a reconstruction of the implicit theory of collective action behind congestion pricing, separated into its strict logical requirements and its cultural baggage, followed by an Ostromian counterfactual.

  ### 1. The Implicit Anthropology of Congestion Pricing

  You offered three candidates for the philosophical picture of the person: anonymity, inelasticity, and self-interest. I would argue congestion pricing commits the city to a specific synthesis of these, which we might call **the Atomized Calculator.**

  **A. The Presupposition of Anonymity (The Breakdown of Reciprocity)**
  You hit on this with the bathroom queue example. In a bathroom line, there is immediate, face-to-face reciprocity. If I cut, you glare; my reputation suffers instantly. The "shadow of the future" is seconds long.
  Congestion pricing presupposes that the interaction on the roadway is **non-iterative and anonymous**. I will never see the driver I delayed again. Therefore, reputational mechanisms and social sanctions have zero transactional grip. The policy assumes the "community" of drivers is too large and fluid for informal norms to stabilize. It presupposes a *Gesellschaft* (associative society) rather than a *Gemeinschaft* (communal society).

  **B. The Presupposition of Calculative Rationality over Normative Rationality**
  This is your third point. Pricing assumes agents respond to *price signals* more reliably than *moral signals*.
  *   **Strict Presupposition:** Agents must be responsive to marginal costs (elasticity). If demand is perfectly inelastic, pricing fails as a rationing tool (it just becomes a revenue grab).
  *   **Implicit Anthropology:** It assumes that while agents *might* care about the collective good, that care is unreliable or too weak to solve the coordination problem. It treats "civic duty" as a residual variable, whereas "cost" is a primary variable. It doesn't necessarily assume people are *evil*, but that they are *predictably self-interested* in the context of infrastructure.

  **C. The Commodification of Time and Space**
  By pricing the road, the city implicitly re-ontologizes the road from a **public good** (or common pool resource) to a **club good**.
  *   **Public Good Norm:** Access is a right; congestion is a shared burden to be endured or managed via rotation (e.g., driving bans).
  *   **Pricing Norm:** Access is a service; congestion is a scarcity to be allocated via willingness-to-pay.
  The philosophical move here is to assert that **time is property**. When I delay you, I am stealing your property (time). Pricing allows me to "buy" the right to steal it from you, with the proceeds theoretically compensating the collective.

  ### 2. Strict Presuppositions vs. Cultural Baggage

  To answer your question about what the policy *commits* the city to versus what just *travels with it*:

  **Strict Logical Presuppositions:**
  1.  **Excludability is technically feasible:** You must be able to identify users and charge them (hence why we don't price sidewalks easily).
  2.  **Marginal Sensitivity:** Users must have alternatives (substitution) or the ability to shift timing.
  3.  **State Capacity:** The state must be trusted to collect the toll and (crucially) enforce it without excessive friction.

  **Cultural/Political Baggage (Contingent):**
  1.  **Cynicism about Norms:** The policy *works* even if people are altruistic, but it is usually *chosen* because policymakers believe altruism is insufficient. This is the "baggage." It implies that norm-building is too slow or fragile for the urgency of traffic.
  2.  **The "License to Sin" Effect:** This is your crowding-out worry. Critics argue pricing implies that if you pay, you haven't done anything wrong. This travels with the policy but isn't strictly necessary. You could price *and* maintain a norm that driving is harmful (e.g., high carbon taxes paired with moral shaming).
  3.  **Technocratic Management:** Pricing often assumes a central authority knows the "optimal" price better than the users do. This is a Hayekian knowledge problem wrapped in Pigouvian clothing.

  ### 3. The Ostromian Counterfactual

  Now, to your core puzzle: **If a city took Elinor Ostrom's framework seriously, would it still price?**

  Ostrom's work on Common Pool Resources (CPRs) is often misread as "community good, markets bad." That's incorrect. She argued against *panaceas* (Leviathan *or* Privatization). She argued for **Polycentric Governance**.

  If an Ostromian task force designed downtown traffic policy, they would likely **still adopt pricing**, but the *institutional wrapping* would look radically different. Here is how congestion pricing changes when viewed through Ostrom's 8 Design Principles for long-enduring CPR institutions:

  **1. Clearly Defined Boundaries (Who is in the collective?)**
  *   *Standard Pricing:* The boundary is the cordon line.
  *   *Ostromian:* The boundary includes not just drivers, but residents, businesses, and transit users within the zone. The "commoners" are everyone affected by the traffic, not just those paying.

  **2. Proportionality between Benefits and Costs**
  *   *Standard Pricing:* Revenue often goes to a general state fund or transit system far away.
  *   *Ostromian:* Revenue *must* be visibly reinvested in the specific congested resource or the immediate community (e.g., local street repairs, neighborhood bus lines). If drivers feel they are being taxed for a distant bureaucracy, norms of compliance collapse.

  **3. Collective-Choice Arrangements**
  *   *Standard Pricing:* Technocrats set the price; politicians vote yes/no.
  *   *Ostromian:* The affected users (drivers, residents, businesses) must have a voice in setting the price or the rules. This might look like a stakeholder board that adjusts rates seasonally. This builds the "norm" you are worried about crowding out.

  **4. Monitoring**
  *   *Standard Pricing:* Automated cameras, punitive fines.
  *   *Ostromian:* Monitoring is still needed (cameras), but the *accountability* runs both ways. The monitors are accountable to the users.

  **5. Graduated Sanctions**
  *   *Standard Pricing:* Flat fine (e.g., $100).
  *   *Ostromian:* Warnings for first offenses, community service options, or tiered pricing based on income (to address the equity critique which threatens legitimacy).

  **6. Conflict-Resolution Mechanisms**
  *   *Standard Pricing:* Administrative hearings.
  *   *Ostromian:* Local, low-cost mediation for disputes about billing or exemptions.

  **7. Minimal Recognition of Rights to Organize**
  *   The higher-level government (State/Federal) must not forbid the city from experimenting with its own rules.

  **8. Nested Enterprises (Polycentricity)**
  *   *This is the big one.* Downtown traffic isn't one problem. It's nested.
  *   *Ostromian Approach:* You might have pricing for the regional highway entry, but *norm-based* management for local neighborhood streets (e.g., resident permits, community agreements on cut-through traffic). You don't apply the same governance layer to the interstate as you do to the residential alley.

  ### 4. Resolving the Crowding-Out Worry

  Your worry is that pricing destroys the possibility of norm formation. The empirical literature here is mixed, but the Ostromian insight offers a resolution.

  **Gneezy and Rustichini (2000)** showed that fining parents for late pickup at daycare *increased* lateness because it turned a moral obligation into a market transaction (a price). This supports your fear.

  **However,** the Stockholm congestion trial suggests the opposite can happen. Before pricing, driving was a right. After pricing, driving became a "choice." Over time, public support for the tax *increased*. Why? Because the pricing made the scarcity *visible*. It created a focal point for a new norm: "Driving downtown is for when it's really necessary."

  **The Synthesis:**
  Pricing crowds out norms *if* it is implemented as a top-down Leviathan tax that assumes citizens are merely revenue sources.
  Pricing can *support* norms *if* it is implemented as a polycentric rule that signals collective agreement on scarcity.

  ### Conclusion for your Seminar

  To answer your reconstruction request:

  1.  **The Theory of Collective Action:** Congestion pricing presupposes a **Prisoner's Dilemma** structure where communication is impossible (anonymity) and iteration is uncertain. It assumes the only Nash equilibrium is defection (driving), so an external enforcer must change the payoff matrix.
  2.  **The Anthropology:** It assumes **Homo Economicus**, but specifically a *bounded* version who responds to immediate, salient financial signals more than diffuse moral obligations.
  3.  **The Ostromian Verdict:** An Ostromian approach does not reject pricing. It rejects **monocentric** pricing. It would argue that pricing is legitimate *only if* it is embedded in a system where users perceive the rules as self-imposed (collective choice) and the benefits as reciprocal (proportionality).

  **The difference isn't the price tag; it's the political relationship.**
  *   **Pigou:** "We are charging you because you are harming others." (Paternalistic/Legalistic)
  *   **Ostrom:** "We are charging ourselves because we agreed this resource is scarce." (Civic/Constitutional)

  If your seminar is debating whether pricing is "neoliberal" vs. "communal," the Ostromian move is to say: **Pricing is a tool, not an ideology.** It becomes neoliberal when it assumes the state knows best and citizens are atoms. It becomes communal when it serves as a transparent mechanism for a community to manage its own scarcity.

  The reason we don't price bathroom queues isn't just transaction costs; it's that the "community" in the bathroom is strong enough to police itself with glares. The community on the highway is too weak, so we import the state. The policy challenge is: **Can we build enough community on the highway that the price feels like a contribution rather than a toll?** That is the institutional design problem your cohort should be tackling.
