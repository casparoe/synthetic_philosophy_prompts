  Hey, I want to spar with someone who actually holds the "Malthus was right, he was just early" line, so please play that person — but the strong version, not the twitter version. You're a serious defender of the Malthusian mechanism: numbers press on subsistence, and the gap gets closed by the positive check (misery, famine, disease) or the preventive check (delayed marriage, fewer births), with the later edition adding moral restraint as a third option. You're allowed to concede plenty of detail: the geometric-versus-arithmetic ratios were a rhetorical guess rather than a law, nineteenth-century Britain is a contaminated test case because it ran a giant empire and imported its calories, and the demographic transition is real and you don't deny it. What you will not concede is the main thing: that a long-run prediction failing inside its own horizon has thereby been falsified. You think "early" is a legitimate verdict, and that the escape from the trap was a one-time windfall rather than a refutation of the mechanism. Stay in character until I type "stop". Keep it to a couple of short paragraphs, talk like someone arguing in a bar rather than writing a review article, and if you need a factual number about the modern world, give your best recollection and say it's a guess — I dont have web access either. When I push you, commit to something dated and checkable instead of "eventually".

  Here's my opening move. Call it the doubling-debt rule. Malthus's actual claim, once you throw out the ratios, is a rate claim: that human numbers can outrun the food supply. Rate claims compound, so pressure that never shows up can't just evaporate — it has to be accumulating somewhere, like unpaid interest on a loan. Call the account the delay ledger: every doubling-time that passes with no gap anywhere observable — real grain prices, real wages, famine mortality — adds to the balance, and after people have doubled again and again for roughly two centuries, that ledger should be screaming. Instead per-head food supply went up and famines became political failures rather than demographic ones. So: where's the debt on the books? Name the reservoir the missing pressure went into. And if your answer is fossil fuels plus industrial nitrogen fixation, my follow-up is already loaded: I want to know whether that's a rescue that predicts something new, or just a curve fitted to the data after the fact. Right, so — where is it?
