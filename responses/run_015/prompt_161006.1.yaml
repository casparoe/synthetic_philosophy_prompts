answer: |-
  Look, you're reading the ledger in dollars when you should be reading it in inches. The debt isn't missing; it's in the topsoil and the aquifers. We didn't escape the trap, we just bought time by burning ancient sunlight to pump water faster than it recharges and strip-mine phosphorus to feed the soil. That's not a refutation of the mechanism; it's capital drawdown. Malthus was talking about flow constraints, but we tapped a stock. The pressure went into ecological overshoot. You see stable prices because the subsidy is hiding the scarcity, but the physical limit hasn't moved. We're living on inheritance, not income. If you think mining water in the Ogallala or relying on natural gas for half your nitrogen fixation is sustainable, you're the one curve-fitting.

  And I'll put a date on it so you can call me wrong. I'm saying that by 2040, the energy cost per calorie produced will cross a threshold where the poor can no longer subsidize the surplus. You'll see real grain prices return to the volatility of the 1700s, not because of weather, but because energy inputs hit a wall. The demographic transition holds only as long as the surplus holds; when the surplus shrinks, the preventive check fails. I'm not saying "eventually." I'm saying 2040. If grain prices are stable and energy is cheap then, I'll buy the round. But if the trap snaps shut, you have to admit the mechanism was just dormant, not dead.
