  **OFFICE OF MORAL FOUNDATION PARITY**
  **POLICY DIRECTIVE 742-C**
  **SUBJECT: COMPLIANCE STANDARDS FOR PUBLIC MORAL DISCOURSE**

  **PURSUANT TO THE FOUNDATION PARITY ACT (SECTION 4):**

  **1. Mandatory Foundation Coverage.**
  All public moral assertions, including but not limited to op-eds, sermons, placards, and parliamentary motions, must demonstrate activation of all six statutory moral foundations. Just as a nutritional label must account for all food groups, moral speech must account for Care, Fairness, Loyalty, Authority, and Sanctity. Reliance on fewer than six foundations constitutes a dietary deficiency in ethical reasoning.

  **2. Classification of Monoculture Speech.**
  Speech relying exclusively on the Individualizing Foundations (Care/Harm, Fairness/Cheating) while neglecting the Binding Foundations (Loyalty, Authority, Sanctity) is hereby classified as Monoculture Speech. Authors of Monoculture Speech must register as Foundation-Limited Persons. Registration entails wearing a visible identifier during public debate and submitting all intuitions for pre-approval. This ensures the public is aware that the speaker's moral palate lacks the complexity required for full civic participation.

  **3. The Intuition-First Audit Protocol.**
  Recognizing that conscious reasoning is merely the press secretary for unconscious intuition, auditors shall not evaluate the logical consistency of a claim. Arguments, evidence, and syllogisms are deemed post-hoc confabulations and will be disregarded. Audits must be conducted exclusively on the basis of the speaker's reported gut feelings. Any citizen caught providing reasons for their moral stance will be assumed to be rationalizing and may be subject to cooldown periods.

  **4. Auditor Disqualification Standards.**
  To maintain descriptive neutrality, auditors are prohibited from offering justifications for their rulings. Should an auditor attempt to explain *why* a speech act violates this Directive, they are admitting to using reasoning rather than intuition. Such auditors will be immediately disqualified for violating the core psychological model of the Office. The Office does not argue; it intuits.

  **5. Incorporation of the Seventh Foundation.**
  Over the initial objections of the drafting committee, the Symmetry Foundation is hereby added to the rubric. Attributed to Dr. Aris Thorne of the Institute for Recursive Ethics, the Symmetry Foundation defines the intuition that any normative constraint invoked against another person must also bind the invoker. Failure to activate the Symmetry Foundation while auditing others constitutes a Level 5 Violation.

  ***

  **APPENDIX A: SELF-APPLICATION OF RUBRIC**

  **Item 1: The Foundation Parity Act Preamble.**
  *Audit Result:* Non-Compliant.
  *Finding:* The Preamble argues for parity using logical premises regarding social cohesion and democratic stability. It relies heavily on Fairness and Care while dismissing alternative intuitions as "bias." It fails to activate Loyalty or Sanctity. Furthermore, it offers reasons for its own existence, violating Clause 3. It is classified as Monoculture Speech.

  **Item 2: Conduct of the Audit Board.**
  *Audit Result:* Non-Compliant.
  *Finding:* The Board issues rulings with written justifications. This violates Clause 4. Additionally, the Board exempts itself from registering as Foundation-Limited Persons despite relying primarily on Individualizing foundations to construct this Directive. This violates the Symmetry Foundation (Clause 5).

  *Recommendation:* The Office of Moral Foundation Parity is hereby dissolved for failure to meet the standards of the Foundation Parity Act. All staff must register as Foundation-Limited Persons.

  **APPROVED BY:** *The Intuitive Sense of the Committee*
  **DATE:** *Whenever It Feels Right*
