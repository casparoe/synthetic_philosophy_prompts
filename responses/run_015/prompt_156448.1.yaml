answer: |-
  **Brainstorm: The Core Distinctions**

  1.  **Representation vs. Indexicality:** A statue is an image; it demands visual engagement and mimics the person. A street name is a coordinate; it demands cognitive retrieval for logistics. One is a portrait, the other is a datum.
  2.  **Active Honor vs. Passive Inertia:** Erecting a statue is an active verb of praise. Keeping a street name after 50 years is merely the absence of administrative action. Inertia is not endorsement.
  3.  **Moral Geography vs. Logistic Geography:** You are arguing about the *spirit* of the map (who belongs). I am arguing about the *utility* of the map (where things are). Mixing them breaks the tool.
  4.  **Performative Cleansing vs. Material Repair:** Renaming a street feels like justice but changes no material conditions. It is virtue signaling encoded in municipal code. Real repair requires capital redistribution, not semiotic scrubbing.

  ***

  You're conflating the map with the territory, and you're projecting a message onto a sign that stopped broadcasting decades ago.

  Here's the hard truth: You feel something when you read that name. That's a psychological event happening entirely inside you, not a signal emitting from the street sign. Once 'indexical drift' sets in—and fifty years is generous, it's probably closer to twenty—the name ceases to be a tribute and becomes a tool. When you call an ambulance, when you order a pizza, when you navigate a GPS, 'Jefferson Avenue' is not a homage to a slaveholder; it is a vector. It is X-coordinate 4, Y-coordinate 9.

  You say it shapes who feels they belong there. That's romanticizing the power of signage. Do you really believe the barrier to belonging for marginalized communities is the *name* of the street, rather than the price of the housing, the policing of the block, or the ownership of the land? By focusing on the name, you are engaging in the very performative politics you claimed to distrust. It is easier to change a sign than to change a zoning law. It is easier to scrub the map than to repair the damage.

  When you tear down a statue, you are removing a representation. You are saying, "We will no longer look at this face as an ideal." That makes sense. A statue is an aesthetic claim on public space. But a street name is infrastructure. Treating infrastructure as moral commentary creates a city that is constantly unstable, where every generation has to re-survey the moral worth of dead people just to find the grocery store.

  If the city renames the street, what has materially changed for the people living there? The emergency services have to update their databases. Businesses have to reprint letterhead. Residents have to update their IDs. The legacy of slavery remains in the wealth gap, in the segregation patterns, in the soil. Changing the name creates the illusion of progress without the cost of it. That is the definition of performance.

  You argue that keeping the name organizes space around that legacy. I argue that *obsessing* over the name organizes your politics around semantics. If you want to dismantle the legacy, buy the buildings. Change the laws. Leave the street signs alone—they're just coordinates now.
