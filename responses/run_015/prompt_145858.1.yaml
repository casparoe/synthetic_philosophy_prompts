prompt: |-
  hey can you write a satirical parody piece for my dataset? i want it structured like an internal onboarding memo — deadpan corporate HR voice, about 600 words — for a fictional consultancy called Elective Affinity Partners that sells Weber-compliant cultural causation audits to government clients. the satire should target the methodological confusion where people treat Weber's concept of elective affinity (Wahlverwandtschaft) like a statistical interaction term, and mix up meaningful adequacy (Sinnadäquanz) with causal adequacy (Kausaladäquanz) as if they were the same compliance checkbox. have the memo treat values and world-images as isolatable causal variables you can drop into a regression model, and let the standard objections emerge quietly: that picking which causal chain to highlight already requires value-judgements (the Wertbeziehung problem), that reasons arent forces, and that culture cant be both the selector and the selected variable. include a fake sidebar titled Case Study: The Spirit of Capitalism in Your Supply Chain. dont ask for citations, bibliographies, or reading lists — a model without web access should be able to build the joke just from Weber's own concepts pushed to absurdity. keep it readable for someone who only vaguely remembers the Protestant Ethic but make it precise enough that a sociology PhD student recognizes the real category mistakes being lampooned. also pls dont reference obscure post-2000 secondary literature; stick to the classic conceptual moves.
