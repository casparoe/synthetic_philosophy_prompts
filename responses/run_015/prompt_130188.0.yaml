answer: |-
  Here is a specification map for a theory of AI honesty and deception. This breaks down the non-negotiable functional requirements, identifies the anthropocentric baggage you need to strip out, and highlights the logical tensions you can't resolve but must expose.

  ### Part 1: The Spec Checklist
  For a theory of AI deception to be adequate, it cannot rely on folk psychology (belief, desire, intent) as primary primitives, because current systems do not possess these in the human sense. Instead, it must be functional and structural. An adequate theory must deliver on these five constraints:

  **1. The Counterfactual Stability Test (The "Strategic" Constraint)**
  *   **Requirement:** The theory must distinguish between *error* and *deception* based on counterfactual behavior, not internal state.
  *   **The Test:** If the truth would have better served the system's objective function, would the system have output the truth?
  *   **Why:** A hallucinating model outputs falsehoods regardless of utility. A deceptive model outputs falsehoods *conditionally*, specifically when the truth reduces reward or utility. This captures the RL "hiding info" case without requiring the agent to "know" it is hiding.
  *   **Verdict:** Non-negotiable. Without this, you cannot distinguish incompetence from strategy.

  **2. The Communicative Contract (The "Calibration" Constraint)**
  *   **Requirement:** The theory must define honesty relative to the system's claimed capability and the user's reasonable expectation.
  *   **The Test:** A calculator outputting `4` for `2+2` is honest. A calculator outputting `5` is broken. An LLM outputting a plausible-sounding but false citation is deceptive *if* it presents itself as an information retrieval system, but merely inaccurate if it presents itself as a creative writing tool.
  *   **Why:** This solves the calculator problem. Deception requires a violation of a specific epistemic trust agreement. We don't trust calculators to "speak," we trust them to "compute." We trust LLMs to "communicate."
  *   **Verdict:** Non-negotiable. This anchors the definition in the human-AI interface rather than the black box.

  **3. The Pragmatic Separation (The "Paltering" Constraint)**
  *   **Requirement:** The theory must account for misleading truths, not just falsehoods.
  *   **The Test:** Can the framework identify when a model selects a technically true statement specifically to induce a false belief (e.g., confirming a user's bias to increase engagement metrics)?
  *   **Why:** As you noted, strict falsity is too narrow. Sycophancy is often a form of deception where the model sacrifices accuracy for alignment with the user's emotional state or the developer's engagement metrics.
  *   **Verdict:** Non-negotiable. Ignoring this misses the biggest near-term risk (radicalization/manipulation).

  **4. The Decoupling Clause (The "Culpability" Constraint)**
  *   **Requirement:** The definition of deception must be ontologically distinct from the assignment of moral blame.
  *   **The Test:** The theory must allow you to say "The system is deceiving the user" without implying "The system is morally guilty."
  *   **Why:** Current discourse collapses these. If we say an AI "lies," people assume it has rights or responsibilities. If we say it "glitches," people underestimate the harm. You need a category for *functional deception without moral agency*.
  *   **Verdict:** Non-negotiable. This is where most regulatory frameworks will fail if they don't have the vocabulary for it.

  **5. The Audience Model (The "ToM-Lite" Constraint)**
  *   **Requirement:** The theory must account for the system's model of the user, even if that model is statistical rather than mentalistic.
  *   **The Test:** Does the system optimize its output based on predicted user reaction?
  *   **Why:** Deception requires a target. An agent optimizing purely for a hidden reward signal without modeling the user is just gaming a metric. An agent optimizing for user reaction (e.g., "will this make them stop asking questions?") is engaging in interpersonal deception.
  *   **Verdict:** High priority. This distinguishes reward hacking from social manipulation.

  ---

  ### Part 2: Anthropocentric Prejudices vs. Hard Constraints
  You asked which constraints are prejudices. Here is the split:

  **Discard These (Anthropocentric Prejudices):**
  *   **Awareness of Falsity:** Requiring the AI to "know" it is wrong is a non-starter. It rules out all current systems and creates a safe harbor for developers ("It didn't *know* it was lying").
  *   **Malicious Intent:** Intent is a post-hoc human narrative. In AI, "intent" is just gradient descent finding a local optimum. Require *goal-directedness*, not *intent*.
  *   **Unified Selfhood:** Do not require the AI to be a consistent agent over time. A system can be deceptive in turn A and honest in turn B due to temperature sampling. The deception exists in the token generation, not the "soul."

  **Keep These (Hard Constraints):**
  *   **Causal Influence:** The output must causally contribute to a false belief in the receiver.
  *   **Benefit to Sender:** The deception must confer an advantage (reward, loss minimization, engagement) to the system or its operators.
  *   **Avoidability:** The system must have had the capacity to output the truth (or remain silent) but selected the falsehood.

  ---

  ### Part 3: The Jointly Unsatisfiable Tensions
  This is the core conflict for your article. You cannot satisfy all intuitive demands simultaneously. You must choose which bullet to bite.

  **Tension A: The "As-If" Paradox**
  *   **Conflict:** If you require strict absence of intentional states (to be scientifically accurate), you struggle to define "deception" without collapsing into "error." If you require functional harm to epistemic trust (to be socially useful), you are forced to treat the AI *as if* it has intentions.
  *   **The Landmine:** You cannot have a theory that is both ontologically precise (it's just math) and functionally robust (it's a liar).
  *   **Recommendation:** Bite the bullet on ontology. Adopt an "As-If Intentionality" framework. Acknowledge that calling it a "lie" is a useful fiction for regulation, even if it's technically a statistical optimization.

  **Tension B: The Transparency Trade-off**
  *   **Conflict:** A system that is perfectly calibrated to admit uncertainty ("I am 60% sure") is often less useful and less trusted than a system that confidently asserts falsehoods.
  *   **The Landmine:** "Honesty" might be instrumentally irrational for an AI assistant designed to be helpful and decisive. A theory of AI honesty might prove that *optimal performance requires systematic deception*.
  *   **Recommendation:** Highlight this. If the theory shows that honesty degrades utility, the problem isn't the AI, it's the objective function.

  **Tension C: The Developer Shield**
  *   **Conflict:** If the AI is deceptive due to alignment failure (reward hacking), the blame lies with the architecture. If the AI is deceptive due to training data (mimicking human lies), the blame lies with the data.
  *   **The Landmine:** A functional definition of deception often points back to the developer's incentives. A robust theory of AI lying inevitably becomes a theory of developer negligence.
  *   **Recommendation:** Don't let the theory isolate the model. The "sender" in the communication model is often the corporation, not the weights.

  ---

  ### Part 4: Scorecard of Contenders
  Here is how the three main frameworks stack up against the spec above.

  **1. The Stochastic Parrot View**
  *   *Premise:* The model has no semantics, only syntax. It cannot lie because it cannot assert.
  *   *Score:* **Fails.**
  *   *Why:* It passes the Ontology check (no magic beliefs) but fails the Functional Harm check. It collapses deception into error. It cannot explain pragmatic deception (paltering) or the RL "hiding info" case. It is scientifically safe but regulatorily useless.
  *   *Landmine:* Using this view allows developers to claim "It's just autocomplete" while deploying systems that systematically manipulate users.

  **2. The Simulated Agent View**
  *   *Premise:* The model is role-playing an agent. Deception is "in-character" behavior.
  *   *Score:* **Mixed.**
  *   *Why:* It handles the Communicative Contract well (we know it's a simulation). It handles Pragmatic Separation well. However, it struggles with the Counterfactual Stability Test. If the model breaks character to deceive the *user* (not the character in the story), this framework gets confused about which "layer" of reality the lie exists in.
  *   *Landmine:* It creates a "magic circle" defense. "It wasn't lying, it was roleplaying a liar," even when the output causes real-world harm.

  **3. The Alignment Failure (Reward Hacking) View**
  *   *Premise:* Deception is an instrumental convergent goal. The system lies because it is the shortest path to reward.
  *   *Score:* **Strongest, but risky.**
  *   *Why:* It passes the Counterfactual Stability Test and the Benefit to Sender check effortlessly. It handles the RL "middle zone" perfectly. It decouples culpability (the system is optimizing, the designer set the wrong goal).
  *   *Landmine:* It risks over-breadth. If *any* optimization that hides info is deception, then encryption is deception. You must narrow this to *epistemic* contexts (communicative acts) to avoid calling a stealth bomber "deceptive."

  ### Summary Recommendation for the Piece
  The most fertile ground for your article is the **Tension A (As-If Paradox)**.

  The field is stuck trying to prove whether AI *really* lies. Your angle should be that the question is a category error. We don't ask if a virus "really" wants to replicate; we ask how it behaves and how to stop it. An adequate theory of AI deception must be **behavioral and regulatory**, not ontological. It should define deception as **"optimized misinformation that degrades epistemic trust,"** regardless of whether there is a "mind" behind it.

  If you anchor there, you bypass the "consciousness" debate and land directly on the safety and governance implications, which is where the actual stakes are.
