  Write a one-year dissertation prospectus on a question in the philosophy of archaeology: the inference from material objects to the beliefs and institutions that produced them. Frame the problem around what I will call the durability asymmetry—material artifacts routinely outlast both the mental states that created them and the social agreements that governed their use, yet archaeologists often treat an object’s physical persistence as direct evidence for institutional stability rather than as a potential epistemic confound. State the precise question: does the inference from an object’s lifecycle—its decay, repair, reuse, and eventual abandonment—to the continuity of an institution require a distinct evidential logic, separate from both representationalist reconstruction (reading specific beliefs off artifacts) and practice-based inference (reading institutions off repeated use-patterns)? More specifically, can we formally distinguish episodic reconstruction, which targets a particular belief or intention behind an object’s creation, from structural persistence inference, which targets institutional stability across an object’s material history, and does collapsing these two modes generate the standard interpretive errors in archaeological reasoning? Explain why the existing positions leave this open: representationalism ignores persistence patterns altogether, while practice-theory tends to conflate use-patterns with durability-patterns, leaving no account of how repair or repurposing should weigh against original function as evidence for institutional continuity. Propose a method that builds the distinction conceptually rather than empirically—working through carefully constructed case studies of institutional artifacts such as boundary markers, storage vessels, or standardized weights—showing month by month how you would develop the criteria for each inferential mode, test them against hypothetical lifecycle scenarios, and determine whether they are genuinely 