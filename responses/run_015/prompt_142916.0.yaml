answer: |-
  # Dissertation Prospectus: The Durability Asymmetry and the Logic of Archaeological Inference

  **Project Title:** The Durability Asymmetry: A Conceptual Framework for Distinguishing Episodic and Structural Inference in Archaeological Reasoning

  **Duration:** 12 Months

  ## 1. Problem Statement: The Durability Asymmetry

  Archaeological reasoning relies on a fundamental inference: moving from the presence of material objects to the existence of the beliefs and institutions that produced them. This prospectus identifies a specific epistemic vulnerability in this inference, termed the **Durability Asymmetry**. Material artifacts routinely outlast both the mental states that created them and the social agreements that governed their use. A boundary stone may stand for centuries after the polity that erected it has collapsed; a storage vessel may be repaired and reused long after the economic system that standardized its shape has vanished.

  Despite this asymmetry, archaeological interpretation often treats an object's physical persistence as direct evidence for institutional stability. When an artifact type persists in the stratigraphic record, it is frequently assumed that the institution responsible for it persisted equally. This prospectus argues that physical durability is not neutral evidence; it is a potential epistemic confound. The persistence of the *object* does not logically guarantee the persistence of the *institution*.

  ## 2. The Research Question

  The central question of this dissertation is: **Does the inference from an object's lifecycle—its decay, repair, reuse, and eventual abandonment—to the continuity of an institution require a distinct evidential logic, separate from both representationalist reconstruction (reading specific beliefs off artifacts) and practice-based inference (reading institutions off repeated use-patterns)?**

  To answer this, I will investigate two sub-questions:
  1.  Can we formally distinguish **Episodic Reconstruction** (which targets a particular belief or intention behind an object's creation at *t0*) from **Structural Persistence Inference** (which targets institutional stability across an object's material history from *t0* to *tn*)?
  2.  Does collapsing these two modes generate the standard interpretive errors in archaeological reasoning, specifically the conflation of material survival with social continuity?

  ## 3. Critique of Existing Positions

  Current philosophical approaches to archaeological inference leave this problem open due to specific blind spots:

  *   **Representationalism:** This mode treats artifacts as carriers of specific symbolic content or beliefs. It focuses on the moment of creation (*t0*). It ignores persistence patterns altogether because it is concerned with what the object *meant* when made, not how its physical survival might mislead us about later periods.
  *   **Practice-Based Inference:** This mode focuses on habit, routine, and use-patterns. While it accounts for time better than representationalism, it tends to conflate use-patterns with durability-patterns. It assumes that because an object shows signs of use, the institution governing that use remains stable. It lacks an account of how repair, repurposing, or passive survival should weigh against original function as evidence for institutional continuity.

  Neither position provides a logic for handling the "gap" where the object exists but the original institutional context may not.

  ## 4. Methodology: Conceptual Analysis via Case Studies

  This project proposes a method that builds the distinction conceptually rather than empirically. I will not conduct excavations or archival surveys. The problem is not a lack of data, but a flaw in the logical structure of inference. Therefore, the methodology is philosophical conceptual analysis tested against constructed case studies.

  **Why Conceptual Rather Than Empirical?**
  An empirical excavation project cannot solve this problem because new data does not correct faulty logic. Digging up more boundary markers does not tell us whether the markers prove the boundary existed continuously or merely persisted physically. A historical survey of archaeological method is insufficient because it describes past errors without providing a normative framework to prevent future ones. We must build the conceptual machinery from the problem itself, deriving criteria from the physical properties of decay versus the logical properties of institutional definition.

  **Case Studies:**
  I will utilize three controlled conceptual case studies of institutional artifacts:
  1.  **Standardized Weights:** Imply a trade institution and agreed-upon value.
  2.  **Boundary Markers:** Imply a political institution and territorial agreement.
  3.  **Storage Vessels:** Imply an economic or domestic institution of surplus management.

  For each, I will construct hypothetical lifecycle scenarios involving creation, repair, modification, abandonment, and rediscovery to test the inferential logic.

  ## 5. Work Plan (Month-by-Month)

  **Phase 1: Formulation and Critique (Months 1–2)**
  *   **Month 1:** Formalize the definition of the Durability Asymmetry. Draft the logical structure of the "Standard Inference" (Object Persistence → Institutional Continuity) to identify exactly where the logical leap occurs.
  *   **Month 2:** Complete the critique of Representationalism and Practice-Theory. Map their respective failures to account for repair and reuse. Define the terms "Episodic Reconstruction" and "Structural Persistence Inference" operationally.

  **Phase 2: Developing the Distinction (Months 3–4)**
  *   **Month 3:** Develop the criteria for Episodic Reconstruction. What evidence is required to claim knowledge of the *t0* intention? (e.g., stylistic uniformity, context of deposition).
  *   **Month 4:** Develop the criteria for Structural Persistence Inference. What evidence is required to claim the institution survived beyond *t0*? (e.g., evidence of active maintenance, re-calibration, re-assertion).

  **Phase 3: Case Study Application (Months 5–7)**
  *   **Month 5:** Apply criteria to **Standardized Weights**. Test scenarios: A weight is found intact vs. a weight is found re-carved. Does re-carving imply institutional continuity (maintenance of standard) or discontinuity (adaptation to new standard)?
  *   **Month 6:** Apply criteria to **Boundary Markers**. Test scenarios: A marker stands unmaintained vs. a marker is reset. Does physical presence alone justify a claim of political continuity?
  *   **Month 7:** Apply criteria to **Storage Vessels**. Test scenarios: A vessel is repaired vs. a vessel is reused for a different substance. Distinguish between household continuity and economic institutional continuity.

  **Phase 4: Framework Development (Months 8–9)**
  *   **Month 8:** Synthesize findings into the **Lifecycle Evidential Framework (LEF)**. Assign provisional evidential weights to different lifecycle events (e.g., Repair = +Weight for Continuity; Passive Survival = 0 Weight; Repurposing = -Weight for Original Institution).
  *   **Month 9:** Formulate decision rules. Create a flowchart or logical schema for when an archaeologist should invoke Episodic versus Structural inference based on the available lifecycle data.

  **Phase 5: Stress Testing and Failure Analysis (Months 10–11)**
  *   **Month 10:** Test the LEF against counter-examples. Attempt to break the distinction. Look for cases where Structural Persistence inevitably requires Episodic claims.
  *   **Month 11:** Evaluate the Failure Conditions (see Section 7). Determine if the distinction holds or if redundancy is unavoidable. Draft the limitations section.

  **Phase 6: Writing and Finalization (Month 12)**
  *   **Month 12:** Compile the dissertation. Ensure the argument flows from the problem statement to the framework. Finalize the decision rules and deliverable.

  ## 6. Deliverable

  The primary deliverable is the **Lifecycle Evidential Framework (LEF)**. This will be a normative guide for archaeological reasoning consisting of:

  1.  **Evidential Weights:** A table assigning positive, negative, or neutral evidential value to specific material states (e.g., "Intentional Repair" adds weight to Structural Persistence; "Passive Weathering" adds weight only to Episodic Reconstruction).
  2.  **Decision Rules:** A set of logical conditions specifying when an archaeologist is justified in inferring institutional continuity. For example: *"Inference of institutional continuity is prohibited if the only evidence is passive physical persistence without signs of active maintenance or re-calibration."*
  3.  **Typology of Inference:** A clear classification system distinguishing claims about *origin* (Episodic) from claims about *duration* (Structural).

  ## 7. Conditions of Failure

  This project acknowledges two specific conditions under which the proposed framework would fail, necessitating a negative conclusion:

  1.  **Evidential Redundancy:** If analysis shows that durability patterns are fully reducible to use-patterns. That is, if every instance of physical persistence can be explained entirely by practice-theory without needing a separate structural logic, the distinction is unnecessary.
  2.  **Logical Collapse:** If the distinction collapses because every persistence claim necessarily entails a specific belief claim. For example, if maintaining a boundary marker *always* requires the exact same belief as erecting it, then Structural Persistence Inference is just repeated Episodic Reconstruction, and no new logic is needed.

  If either condition is met during Months 10–11, the dissertation will argue for the dissolution of the distinction rather than forcing a framework that does not work. A successful negative result (proving the distinction is impossible) is a valid philosophical outcome.

  ## 8. Significance

  This project offers a correction to the epistemic foundations of archaeological interpretation. By isolating the Durability Asymmetry, it prevents the reification of institutions based solely on the survival of their debris. It provides archaeologists with a logical tool to distinguish between a society that endured and a society whose objects merely remained. This increases the rigor of historical reconstruction and prevents the projection of modern assumptions about stability onto past societies based purely on material survival. The scope is honest for twelve months of philosophical work: it does not seek to solve all problems of inference, but to resolve the specific logical conflict between material durability and institutional continuity.
