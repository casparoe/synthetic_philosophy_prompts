      *   *Item 4: The Sabotage.* The framing effect (decoy/default) to break consistency. This hits the "coherence" point.
      *   *Item 5: The Trilemma.* Forcing the choice between the three escapes (irrational, redescription, loosening).
      *   *Item 6: Predictable Failures.* Addressing consistent students, gamers, and suspicion.
      *   *Item 7: Food Incentives.* Addressing dietary issues, value differences, etc.
      *   *Item 8: Debrief & Limitations.* Mapping the experience to the concepts and stating what the activity cannot prove (normative vs. descriptive).

