      *Drafting Item 2:* Run three choice rounds where prices shift slightly but budgets remain constant, ensuring at least one pair of rounds presents identical opportunity sets disguised by different layouts. In the second round, introduce a dominated "decoy" option that is strictly worse than one existing choice but changes the visual salience of the bundles. This creates the data needed for consistency testing without alerting them to the trap.

      *Drafting Item 3:* Have students swap cards with a partner who must assign numerical values to the bundles to predict a fourth, unseen choice scenario. Award bonus snacks only if the partner's numbers correctly predict the original chooser's actual selection in that hidden scenario. This forces them to experience utility as a predictive tool rather than a hidden mental substance.

