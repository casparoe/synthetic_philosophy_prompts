      *Drafting Item 5:* Present the three escape routes on the projector: label the chooser inconsistent, redefine the goods to include the context, or admit the model fits anything. Put them in pairs to argue which cost they are willing to pay to save the theory, requiring them to commit to one defense. This isolates the philosophical trilemma as a practical necessity rather than an abstract axiom.

