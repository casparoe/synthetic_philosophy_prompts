      *   **Target Audience:** Third-year seminar on philosophy of economics (16 students).
      *   **Background:** All have intermediate microeconomics (know Lagrangians, utility functions, etc.), almost none have philosophy.
      *   **Constraint:** Single 80-minute session.
      *   **Goal:** Make them *feel* the problems of revealed preference/utility before naming them. Specifically: utility as encoding vs. discovery, coherence required for prediction, and the trilemma when coherence breaks (irrationality, redescription, loosening fit).
      *   **Restrictions:** No mentions of "utility," "revealed preference," or "WARP" until debrief. No axioms on board until debrief.
      *   **Materials:** Flat seminar room, projector, index cards, pens, supermarket bag of snacks.
      *   **Format:** Exactly eight numbered items. Each item must be two or three sentences long. No headings, no introduction, no summary.
