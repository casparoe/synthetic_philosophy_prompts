  1. Distribute index cards labeled A through D, each representing a specific bundle of snacks priced in tokens you hand out initially. Tell students they will keep whatever they choose at the end, but emphasize that they must treat each choice scenario as independent to ensure their portfolio reflects their true taste. This establishes real stakes without revealing the experimental design.

  2. Run three choice rounds where prices shift slightly but budgets remain constant, ensuring at least one pair of rounds presents identical opportunity sets disguised by different layouts. In the second round, introduce a dominated decoy option that is strictly worse than one existing choice but changes the visual salience of the bundles. This creates the data needed for consistency testing without alerting them to the trap.

  3. Have students swap cards with a partner who must assign numerical values to the bundles to predict a fourth, unseen choice scenario. Award bonus snacks only if the partner's numbers correctly predict the original chooser's actual selection in that hidden scenario. This forces them to experience utility as a predictive tool rather than a hidden mental substance.

  4. Reveal that two different sets of numbers could have generated the same predictions, then show how the decoy option caused half the class to violate their own previous choices. Ask them to write down why their partner's data now fails to predict their behavior without using the word irrational. This creates the cognitive dissonance required before you introduce the formal problem.

  5. Present the three escape routes on the projector: label the chooser inconsistent, redefine the goods to include the context, or admit the model fits anything. Put them in pairs to argue which cost they are willing to pay to save the theory, requiring them to commit to one defense. This isolates the philosophical trilemma as a practical necessity rather than an abstract axiom.

  6. Expect some students to remain perfectly consistent due to simple preferences or suspicion, so prepare a pre-generated dataset of inconsistent choices to supplement the room's data if needed. Acknowledge the gamers openly by noting that trying to beat the system is itself a consistent preference structure that the model can still capture. This prevents the activity from stalling if the empirical result isn't messy enough.

  7. Verify dietary restrictions beforehand and ensure snacks have roughly equal perceived value to avoid wealth effects dominating the choices. Remind them that hunger levels vary, so the token budget must be high enough that satiation does not force a random choice in later rounds. This controls for physiological noise that could muddy the philosophical point about rationality.

  8. Conclude by naming revealed preference theory and explaining that the activity showed the equivalence of choice and utility only when consistency holds. Admit that this cannot prove preferences exist prior to choice or that chosen goods are good for them, as those are normative questions outside the model's scope. This clarifies the boundary between the formal success they experienced and the philosophical limits you must now lecture.
