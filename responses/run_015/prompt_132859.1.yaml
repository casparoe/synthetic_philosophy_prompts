      *Drafting Item 7:* Verify dietary restrictions beforehand and ensure snacks have roughly equal perceived value to avoid wealth effects dominating the choices. Remind them that hunger levels vary, so the token budget must be high enough that satiation does not force a random choice in later rounds. This controls for physiological noise that could muddy the philosophical point about rationality.

