  Based on your friend's track record and her stated commitment to early Confucian role ethics, here is an analysis of the implicit rules governing her verdicts, predictions for the new cases, and a proposal for a decisive tie-breaking case.

  ### 1. Analysis of the Track Record
  Your friend's past five verdicts reveal a consistent, lexical hierarchy of relationships that diverges significantly from modern Western intuition (which often prioritizes the nuclear family or immediate need).

  *   **The Hierarchy:** Parent > Spouse > Sibling > Friend > Acquaintance.
      *   *Evidence:* Mother beats Friend (Case 1); Spouse beats Friend (Case 3); Brother beats Friend (Case 5).
  *   **The Directionality:** Upward obligations (to parents) outweigh downward obligations (to children).
      *   *Evidence:* Mother beats Son (Case 4). This is the strongest signal. In Western ethics, the vulnerable child usually trumps the able parent. Her choice indicates that *Xiao* (filial piety) is the root of virtue, superseding even parental care for offspring.
  *   **The Intensity Modifier:** Within the same role category, depth and history matter.
      *   *Evidence:* 20-year Friend beats 2-year Acquaintance (Case 2).
  *   **The Nature of Duty:** Role obligation trumps immediate utility or emotional preference.
      *   *Evidence:* She chose her mother's *routine* dinner over a friend's *hard labor* move (Case 1). This suggests the duty is inherent to the role, not proportional to the urgency of the need.

  ### 2. Candidate Rules
  Two rules fit this data, but they diverge on how they handle "broken" or "dormant" relationships.

  **Rule A: The Ontological Priority Rule (Status-Based)**
  *   **Principle:** Moral duty is determined by the *existence* of the relationship role, not its current emotional temperature. The Five Relationships have a fixed metaphysical weight. Blood ties (Parent, Sibling) are "Heavenly" and unbreakable; social ties (Friend, Minister) are "Human" and conditional on reciprocity (*Yi*).
  *   **Implication:** You owe duty to a sister simply because she is your sister, even if estranged. You owe duty to a superior only if they act like a superior.

  **Rule B: The Relational Vitality Rule (Activity-Based)**
  *   **Principle:** Moral duty is determined by *how the relation is currently lived*. A relationship that is not being actively cultivated (estranged) loses moral weight to one that is flourishing. The phrase "how those relations are actually lived" is the operative constraint.
  *   **Implication:** A dormant sibling bond yields to an active, deep friendship. A toxic boss yields to a friend in crisis.

  ### 3. Predictions for the New Cases

  **Case 1: Department Head vs. Closest Friend (Crisis)**
  *   **Prediction:** She will choose the **Friend**.
  *   **Reasoning:** Under Confucian ethics, the Ruler/Minister relationship is conditional on mutual righteousness (*Yi*). Mencius argues that if a ruler treats a subject as "dirt," the subject may treat the ruler as a "bandit." Since she dislikes the Head and the task is coverable, the *Yi* is weak. Conversely, the Friend relationship relies on Trust (*Xin*), and a "real crisis" is the precise moment *Xin* is tested. The "Ontological" weight of a defective Ruler bond is lower than the "Vital" weight of a deep Friend bond.
  *   **Rule Alignment:** Both Rule A (Conditional Role) and Rule B (Vitality) predict this.

  **Case 2: Estranged Sister vs. Closest Friend**
  *   **Prediction:** She will choose the **Sister**.
  *   **Reasoning:** This is the critical test. The sibling relationship (*Ti*) is a blood tie, considered ontologically permanent in Confucian thought. Estrangement is viewed not as a dissolution of the role, but as a failure of the *Dao* that must be corrected. Helping the sister is the act of "living the relation" correctly (restoring harmony), whereas helping the friend would be prioritizing a chosen bond over a Heavenly one.
  *   **Rule Alignment:**
      *   **Rule A (Ontological):** Predicts **Sister**. The role exists regardless of estrangement.
      *   **Rule B (Vitality):** Predicts **Friend**. The sister bond is dormant/dead; the friend bond is vibrant.

  ### 4. The Bet
  I would bet on **Rule A: The Ontological Priority Rule**.

  **Why?**
  The "Mother vs. Son" verdict (Case 4) is the anchor. In that scenario, the "Vitality" of the mother-son bond was likely routine (a modest appointment), while the son's need (school event) was emotionally significant. By choosing the mother, she demonstrated that the *status* of the role (Upward/Parent) outweighs the *immediate emotional gravity* or activity level of the interaction.

  If she prioritized the *status* of "Mother" over the *need* of "Son," she will prioritize the *status* of "Sister" over the *vitality* of "Friend." The phrase "how those relations are actually lived" is interpreted by her not as "how much we like each other," but as "how faithfully I perform the rituals of this role." Helping an estranged sister is a ritual restoration of *Ti*; ignoring her to help a friend treats the sibling bond as optional, which contradicts her previous rigidity.

  ### 5. The Tie-Breaking Case
  To definitively separate Rule A (Status) from Rule B (Vitality), you need a case where a **High-Status Role is completely dormant** versus a **Lower-Status Role is critically active.**

  **The Case:**
  > Her **father**, with whom she has had **no contact for five years** (he refuses to speak to her), asks her for a significant favor (e.g., co-signing a loan) that carries personal risk. The same week, her **young son** faces a **serious emergency** (e.g., a medical scare) where she is the only one who can provide immediate support.

  **Why this separates the rules:**
  *   **Rule A (Ontological):** Predicts she helps the **Father**. The Parent/Child bond is the highest of the Five Relationships (*Qin*). It is unconditional and upward-looking. Even if estranged, the ontological debt of life (*Xiao*) remains supreme.
  *   **Rule B (Vitality):** Predicts she helps the **Son**. The father relationship is effectively dead (refuses contact), while the son relationship is the most vital, active, and vulnerable bond in her life. Prioritizing the father would be empty ritualism; prioritizing the son is cultivating the living *Dao*.

  If she chooses the father, her ethics are purely structural/role-based. If she chooses the son, her ethics are grounded in the current moral health of the relationship. Given her track record (Mother > Son), I suspect she would choose the father, confirming that for her, the *Role* is the reality, and the *Person* is secondary.
