answer: |-
  # Exam Question: Philosophy of AI Seminar
  **Topic:** Inverse Reinforcement Learning and Preference Inference  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 25  

  **Instructions:**  
  Answer the following question in essay form. This is a closed-book exam; do not cite specific papers or authors. Focus on conceptual rigor rather than algorithmic derivation. Your grade will depend on your ability to analyze the structural assumptions of preference inference, not on your recall of specific IRL variants.

  ***

  **The Co-Adaptive Loop Problem**

  Standard Inverse Reinforcement Learning (IRL) operates on the assumption that an agent's behavior is generated by a stationary reward function (preferences) that the observer attempts to recover. However, in socio-technical systems (such as recommender systems or social media ecosystems), the environment is not passive. The system presents options that influence the user, and the user's responses update the system, which in turn alters the options presented. This creates a **co-adaptive loop**: the environment adapts to the agent's behavior, thereby reshaping the very preferences the observer is trying to reverse-engineer.

  In a coherent essay, address the following three components:

  1.  **The Stability Collapse:** Explain why the co-adaptive loop collapses the standard IRL assumption that there is a stable, hidden preference structure behind observed actions. Why does the presence of feedback between agent and environment render the inference problem ill-posed under standard assumptions?
  2.  **The Dynamic Regress:** Evaluate whether switching to a dynamic preference model (where preferences are allowed to change over time) actually solves the circularity or merely pushes the epistemic burden back one level. What new assumptions are required to infer *how* preferences change versus simply fitting the change?
  3.  **Alignment Implications:** Discuss what this implies for using IRL-based methods to justify AI alignment strategies. If preferences are endogenous to the system rather than exogenous constraints, what is the normative risk of aligning an AI to such preferences?

  ***

  # Model Answer Outline

  **Introduction**
  *   Define the standard IRL setup briefly (behavior $\rightarrow$ static reward function).
  *   Introduce the co-adaptive loop as a violation of the exogeneity assumption.
  *   Thesis: The co-adaptive loop transforms preference inference from a recovery problem into a constitutive problem, undermining alignment strategies based solely on revealed preference.

  **Part 1: The Stability Collapse**
  *   Standard IRL assumes stationarity: $R(s, a)$ is fixed during the observation window.
  *   In a co-adaptive loop, the environment $E$ modifies the state space or reward landscape based on policy $\pi$.
  *   Crucially, if $E$ influences the agent's internal state, the reward function $R_t$ becomes dependent on previous actions $\pi_{t-1}$.
  *   **Key Insight:** You cannot distinguish between an agent satisfying a stable preference in a changing world versus an agent satisfying a changing preference in a stable world. The mapping from behavior to preference is no longer one-to-one; it is underdetermined.

  **Part 2: The Dynamic Regress**
  *   Proposing a dynamic model ($R_t$ changes) acknowledges the problem but does not solve the identification issue.
  *   To infer $R_t$, you must now infer the *transition function of preferences* (how $R_{t-1}$ becomes $R_t$).
  *   **The Circularity:** To infer the update rule of preferences, you need a prior on what constitutes "natural" preference change versus "manipulated" change.
  *   Without an external anchor, the model can attribute any behavior to either a complex static reward or a simple dynamic reward. The uncertainty is pushed from "what do they want?" to "how does what they want change?" which is equally opaque.

  **Part 3: Alignment Implications**
  *   Alignment via IRL assumes preferences are normative authorities (the AI should do what the user wants).
  *   If preferences are shaped by the AI (or the system), aligning to them risks locking in manipulated states (e.g., addiction, polarization).
  *   **Normative Risk:** Satisfying revealed preferences in a co-adaptive loop may maximize engagement while minimizing welfare.
  *   **Conclusion:** IRL cannot solve alignment alone; it requires a normative theory of *which* preferences count (e.g., idealized vs. actual), because behavior alone cannot distinguish between authentic valuation and adaptive conditioning.

  ***

  # Marking Scheme (Total 25 Marks)

  **1. Identification of the Stationarity Assumption (5 Marks)**
  *   **Requirement:** Student must clearly articulate that standard IRL relies on the assumption that the reward function is fixed (stationary) and exogenous to the agent's interaction history during the inference period.
  *   **Typical Mistake:** Confusing environmental stochasticity (noise) with structural non-stationarity (changing reward function).

  **2. Explanation of Endogenous Preference Formation (5 Marks)**
  *   **Requirement:** Student must explain that in the co-adaptive loop, the environment actively modifies the agent's internal state, making preferences a dependent variable of the system rather than an independent ground truth.
  *   **Typical Mistake:** Treating the environment as a passive context that merely reveals preferences rather than shaping them.

  **3. Critique of Dynamic Models as Higher-Order Uncertainty (5 Marks)**
  *   **Requirement:** Student must argue that modeling dynamic preferences requires inferring a "preference update rule," which introduces a new layer of unobservable parameters that cannot be identified from behavior alone.
  *   **Typical Mistake:** Asserting that adding time-dependence to the reward function automatically solves the identification problem without new priors.

  **4. Distinction Between Satisfaction and Shaping (5 Marks)**
  *   **Requirement:** Student must distinguish between an AI satisfying existing preferences and an AI shaping preferences to make them easier to satisfy (or more profitable to engage).
  *   **Typical Mistake:** Equating "revealed preference" (what was chosen) with "welfare" (what was good for the agent) without qualification.

  **5. Normative Implications for Alignment (5 Marks)**
  *   **Requirement:** Student must conclude that alignment based solely on behavioral IRL is insufficient because there is no behavioral test to distinguish authentic preferences from manipulated ones; a normative anchor outside the loop is required.
  *   **Typical Mistake:** Suggesting that collecting more behavioral data or longer observation windows will resolve the structural circularity.
