answer: |-
  **MEMORANDUM**

  **TO:** Graduate Studies Committee
  **FROM:** Chair, Graduate Studies Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation on AI-Assisted Proof Submissions in Graduate Coursework

  ### 1. Purpose and Context

  This memo addresses the regulatory gap regarding Artificial Intelligence (AI) tools in graduate mathematics coursework. Current departmental integrity policies prohibit submitting "work that is not their own." As demonstrated by the recent incident in the Model Theory course (the "Oracular Case"), this clause is insufficient. In that instance, a student submitted a correct proof generated through iterative AI consultation, verified the steps, yet could not reproduce the reasoning independently when questioned.

  Under current rules, this is not cheating. Pedagogically, it is a crisis. This memo evaluates three proposed policy frameworks and recommends a path forward that aligns with our department's mission to certify mathematical maturity, not just correct output.

  ### 2. The Core Question: The Oracular Case

  We must classify the Oracular Case to determine the appropriate policy response.
  *   **Is it a failure of honesty?** No. The student did not claim another human's work as their own, nor did they hide the tool's involvement when asked.
  *   **Is it an acceptable division of cognitive labor?** No. In professional research, we divide labor to extend reach. In graduate *coursework*, the labor *is* the curriculum.
  *   **Is it a failure of learning?** Yes. The contract of a graduate course is that the student internalizes the reasoning capabilities required to produce the result. If the reasoning resides in the tool and not the student, the learning objective has not been met, regardless of the correctness of the submission.

  Therefore, our policy must prioritize **verification of internalized understanding** over **policing the tool used to reach it.**

  ### 3. Contextualizing Our Disciplinary History

  Colleagues have rightly noted that mathematics already relies on trust and tool-mediated verification. We accept the Classification of Finite Simple Groups (CFSG), which no single mathematician has fully verified. We accept computer-assisted proofs (e.g., Kepler Conjecture, Four Color Theorem) where the code is the proof.

  However, there is a categorical distinction between *research validation* and *pedagogical certification*.
  *   **Research:** The community validates truth. I may cite CFSG without knowing the proof because I trust the collective verification of the field.
  *   **Coursework:** The faculty validates *competency*. When a student submits a proof, they are asserting, "I possess the capacity to generate this reasoning."

  In the Oracular Case, the student treats the AI as a community of experts they trust but cannot query. In research, if I cite CFSG, I am not claiming I derived it. In coursework, if I submit a proof, I am claiming I derived it (or could). The AI allows a student to mimic the *output* of competency without the *state* of competency. This is distinct from using a computer to check a calculation; it is using a tool to perform the conceptual architecture of the argument.

  ### 4. Evaluation of Proposals

  We considered three frameworks. Each is presented here in its strongest form.

  **Proposal 1: Prohibition**
  *   *The Argument:* Mathematical training is the deliberate struggle to build neural pathways for reasoning. AI bypasses this struggle. Just as we prohibit calculators in arithmetic training to ensure number sense, we must prohibit AI in proof training to ensure logical sense. Allowing it devalues the degree and creates a generation of mathematicians who cannot think without a crutch.
  *   *Critique:* While pedagogically pure, this is unenforceable. AI use is private and undetectable by software. A prohibition drives the behavior underground, creating an adversarial relationship between faculty and students without guaranteeing that learning actually occurs.

  **Proposal 2: Disclosure Regime**
  *   *The Argument:* AI is a tool like LaTeX or a library function. We should require students to cite AI usage and specify which components were AI-generated. This allows faculty to grade the *learning* portion separately from the *tool* portion and teaches responsible AI citizenship.
  *   *Critique:* Disclosure ensures transparency but not understanding. A student can disclose "100% AI-generated" and submit it. The burden then shifts to the grader to determine if the student understands the disclosed content, which returns us to the original problem without a structural mechanism to resolve it.

  **Proposal 3: Reconstructability Standard (Recommended)**
  *   *The Argument:* The method of discovery is irrelevant; the ownership of the reasoning is paramount. Students may use any tool to find a proof, but they must certify that they can rederive the argument from first principles within a fixed time. This mirrors the Oral Exam (Qualifying Exam) structure, where the defense of the work is as important as the work itself.
  *   *Critique:* This increases faculty workload and may induce significant student anxiety. It requires a shift from grading static documents to assessing dynamic capability.

  ### 5. Recommendation

  I recommend the Committee adopt **Proposal 3 (Reconstructability Standard)**, modified to include a lightweight element of Proposal 2 (Disclosure).

  **Rationale:**
  This approach directly addresses the Oracular Case as a failure of learning. It acknowledges that AI is a permanent fixture in mathematical practice (avoiding the Luddite trap of Proposal 1) but insists that a PhD candidate must be the primary engine of their reasoning (avoiding the passivity of Proposal 2). It aligns coursework with our existing highest standard of certification: the oral defense.

  **Policy Statement:**
  *Graduate students may utilize AI tools during the problem-solving process. However, submission of a solution constitutes a certification that the student can independently reconstruct the argument's logical flow without assistance. Failure to demonstrate this reconstruction upon request will result in a grade penalty equivalent to academic dishonesty.*

  ### 6. Implementation Sketch

  *   **Affected Parties:** All PhD students in core graduate coursework (500-level and above). Master's students are exempt for the first year.
  *   **Effective Date:** Start of the Spring Semester (January 2024).
  *   **Mechanism:**
      1.  **Syllabus Clause:** Instructors must include the Reconstructability Statement in course syllabi.
      2.  **Sampling:** Instructors are not required to test every student on every problem. A random sampling (e.g., 10% of submissions, or all students on one problem per term) during office hours or dedicated "defense sessions" is sufficient to establish credibility.
      3.  **Disclosure:** Students submitting work known to be heavily AI-dependent are encouraged to note this, but the reconstructability requirement remains unchanged.
  *   **Review:** The Graduate Studies Committee will review the policy's impact in **May 2025**.
      *   *Review Trigger:* Collection of data on reconstruction failure rates and faculty workload hours. If reconstruction defenses consume >20% of grading time, the sampling rate will be adjusted.

  ### 7. Conclusion

  We are training mathematicians, not proof verifiers. The Oracular Case reveals that correctness is no longer a proxy for understanding. By shifting our standard from "submit a correct proof" to "own the reasoning of the proof," we preserve the integrity of the degree while acknowledging the reality of modern tools. This policy treats students as junior colleagues capable of managing powerful tools, rather than children who must be shielded from them.

