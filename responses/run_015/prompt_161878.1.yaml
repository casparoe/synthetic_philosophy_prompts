  This tree is designed to be walked through in about two hours. Read the root question aloud. Have each member of the group answer it privately, then compare. Follow the branch indicated by the majority or split into sub-groups to trace different paths. The goal is not to convince one another, but to locate exactly where the disagreement lies.

  **Note on the Entry Point:**
  I have chosen the more honest entry point for a stratigrapher: **"Does the long-run future hold vastly more of what matters than the present?"**
  *Why:* If the answer is "No," the Hinge thesis is false by definition, and the debate ends. If "Yes," the real work begins. This allows the "Finite Future" view to exist as a valid position rather than an excluded premise.

  ---

  ## ROOT NODE: Scale of the Future
  **Question:** Is the potential scale of the future (in terms of sentient experience, complexity, or duration) vastly larger than the present century?

  *   **NO:** → **Leaf 1: Finite Horizon**
      *   **Description:** The future is either short (extinction is likely soon) or finite (colonization is impossible), meaning the present contains a significant fraction of all value that will ever exist.
      *   **Stance:** Short-termism or Pessimistic Realism.
  *   **YES:** → Go to **Node 2**.

  ---

  ## NODE 2: Coherence of Agency
  **Question:** Is the concept of "steering" specific outcomes over deep time coherent, or does geological/chaotic time dissolve human agency?

  *   **DISSOLVES AGENCY:** → **Leaf 2: Deep Time Category Error**
      *   **Description:** The "Hinge" framing mistakes human history for geological history. Over 10,000+ years, specific policies, ideologies, and even technologies erode like mountains. We can change the *strata* (e.g., carbon layers), but not the *trajectory* of value.
      *   **Counter-Argument (for fairness):** While deep time dissolves *narratives*, it does not dissolve *state changes*. If we alter the physical boundary conditions of the planet (e.g., introducing artificial superintelligence, changing atmospheric chemistry, or triggering sterilization), those are geological events that persist. Agency isn't dissolved; it is transformed into force.
  *   **PERSISTS:** → Go to **Node 3**.

  ---

  ## NODE 3: Causal Leverage
  **Question:** Do specific choices made this century survive the noise of history to constrain or enable the long run?

  *   **NO:** → **Leaf 3: Causal Washout**
      *   **Description:** The future is vast and agency is coherent, but the system is too chaotic. Small interventions now are swamped by later developments. Our influence decays to zero before the "long run" begins.
      *   **Stance:** Skeptical Longtermism (The future matters, but we can't touch it).
  *   **YES:** → Go to **Node 4**.

  ---

  ## NODE 4: Axiological Stability
  **Question:** If we shape the future, will they share our moral framework, or will values drift beyond recognition?
  *(Note: This separates influencing **what happens** from influencing **what they care about**.)*

  *   **DRIFT:** → **Leaf 4: Value Drift**
      *   **Description:** We can lock in physical outcomes (like survival), but we cannot lock in values. Future beings will judge success by standards we cannot anticipate. Optimizing for *our* values is a form of tyranny or irrelevance.
      *   **Stance:** Moral Anti-Realism or Evolutionary Ethics.
  *   **LOCK-IN:** → Go to **Node 5**.

  ---

  ## NODE 5: Epistemic Sign
  **Question:** Can we confidently predict whether acting now improves or worsens the long-term trajectory?

  *   **NO:** → **Leaf 5: Unknowable Sign**
      *   **Description:** We have leverage and stable values, but the system is too complex to know if our intervention helps or harms. The expected value of action is zero or negative due to unforeseen side effects.
      *   **Stance:** Epistemic Humility / Precautionary Principle.
  *   **YES:** → Go to **Node 6**.

  ---

  ## NODE 6: Hinge Mechanism
  **Question:** Why is *this* century the hinge? Is it because we might break the machine, or because we are the first to build it?
  *(**FLAG:** This branch distinguishes **Fragility** from **Density**. One is about avoiding a zero (ruin); the other is about maximizing a positive (expansion). They are often conflated, but they imply different strategies.)*

  *   **BUILD IT (Density/Expansion):** → **Leaf 6: Early Mover / Density**
      *   **Description:** The future is vast because we are about to expand into the cosmos. This century matters because early actions set the initial conditions for a civilization that will grow by orders of magnitude. It is a "lock-in" of opportunity.
      *   **Stance:** Cosmic Longtermism.
  *   **BREAK IT (Fragility/Peril):** → Go to **Node 7**.

  ---

  ## NODE 7: Strategic Response to Peril
  **Question:** Given the risk of permanent collapse, does the solution require rapid technical action or deliberate institutional restraint?

  *   **RAPID ACTION:** → **Leaf 7: Time of Perils**
      *   **Description:** The window is closing because dangers (nuclear, bio, AI) are outpacing our wisdom. We must act quickly to secure safety before the bottleneck closes. Speed is a feature, not a bug.
      *   **Stance:** Urgent Longtermism / Effective Altruism orthodoxy.
  *   **DELIBERATE RESTRAINT:** → **Leaf 8: Slow-Down-and-Deliberate**
      *   **Description:** The window is closing because we are moving too fast to understand the risks. The "Hinge" is a danger *because* of our haste. We must use our leverage to pause development and allow wisdom to catch up.
      *   **Stance:** Decelerationism / Governance-First Longtermism.

  ---

  ## EMPTY NODE: The Passive Hinge
  *(Attached to Node 7, alternative branch)*
  *   **Path:** If one answers "YES" to Node 5 (We know the sign) and "BREAK IT" to Node 6 (Peril), but concludes we should **do nothing**.
  *   **Status:** **Unattractive / Unoccupied.**
  *   **Reasoning:** This position claims we know the future is at risk, we know how to save it, but we choose inaction. It is logically consistent but motivationally incoherent for anyone who grants the Root Node (that the future matters).

  ---

  ### Summary of Leaves (7-9 Positions)

  1.  **Finite Horizon:** The future isn't big enough to hinge on.
  2.  **Deep Time Category Error:** "Influence" is a geological nonsense.
  3.  **Causal Washout:** The future is big, but we can't reach it.
  4.  **Value Drift:** We can reach it, but we won't like what they value.
  5.  **Unknowable Sign:** We can reach it, but we don't know which way to push.
  6.  **Early Mover / Density:** We are the ancestors of a vast civilization; lock in the good.
  7.  **Time of Perils:** We are the bottleneck; secure survival rapidly.
  8.  **Slow-Down-and-Deliberate:** We are the bottleneck; secure survival by pausing.
  9.  **The Passive Hinge:** (Empty) We know the risk and the solution, but choose inaction.

  ### Facilitator's Note on the "Fragility vs. Density" Split
  At **Node 6**, ensure the group does not collapse the two options.
  *   **Fragility** implies the future is *default negative* (extinction) unless we intervene.
  *   **Density** implies the future is *default positive* (expansion) but we can shape the quality.
  *   A "Time of Perils" advocate might disagree with an "Early Mover" advocate on whether we should prioritize safety (Fragility) or capability (Density), even if both agree the future is vast. This tree forces that distinction into the open.
