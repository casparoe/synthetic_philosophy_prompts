answer: |-
  **MEMORANDUM**

  **TO:** Ethics Board, Writers Guild
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Paper Supplier Retention (Chapbook Series)

  **1. EXECUTIVE SUMMARY**

  This memo addresses the deadlock regarding our contract with [Current Supplier], linked to the [Region] deforestation chain. The board is divided between the imperative of moral disassociation and the concern over causal inefficacy.

  **Recommendation:** I move we **APPROVE THE SWITCH**, subject to two conditions: (1) a phased transition over the next two print cycles to secure cost parity, and (2) the allocation of any price differential to a verified reforestation fund only if cost parity cannot be met.

  This path acknowledges our complicity without pretending our volume alone drives the market, while protecting the financial interests of our poets.

  **2. THE ETHICAL DEADLOCK**

  We are stuck between two valid ethical frameworks:

  *   **The Complicity Argument:** Even if our 0.02% volume does not causally determine the mill's output, purchasing from them makes us stakeholders in their operation. We grant them social license. Staying signals that literary arts are compatible with ecological destruction.
  *   **The Efficacy Argument:** If the trees fall regardless of our order, a boycott is performative. Resources spent on premium ethical paper or logistics could fund direct preservation. Burdening the guild's budget for a gesture that changes nothing on the ground harms the poets we serve.

  **3. ADDRESSING THE OVERDETERMINATION PROBLEM**

  We must be precise about why our small share matters. The argument is not that *we* stop the deforestation. The argument is about *constitutive harm*.

  In an overdetermined system (where one buyer's exit doesn't stop the harm), individual agents still occupy specific roles. A mill operates on the aggregate demand of thousands of "insignificant" buyers. If we claim our 0.02% is too small to matter, we adopt a principle that, if universalized, guarantees the harm continues indefinitely.

  However, the Efficacy side is correct on one point: **Complicity is not a sin if the cost of avoidance destroys our primary mission.** If switching suppliers raises costs so high that we publish fewer poets, we have traded actual art for abstract purity. That is the vanity risk.

  Therefore, the decision cannot be binary (Stay/Leave). It must be structural. We must leave the supply chain, but we must not offload the cost of that ethics onto our members.

  **4. RATIONALE FOR RECOMMENDATION**

  **To the Efficacy Skeptics:**
  You argue that leaving changes nothing for the trees. You are likely right regarding immediate volume. However, you are wrong that this makes the action useless. Markets run on signaling. By dropping a supplier, we remove a layer of legitimacy they use to secure other contracts. Furthermore, "funding preservation directly" while paying a deforestation mill is contradictory; it is paying to break a window and paying for the bandage. We should do the latter only after we stop the former.

  **To the Complicity Advocates:**
  You argue that we must model norm refusal immediately. You are right that affiliation matters. However, if the switch increases chapbook costs by 15%, and we pass that to poets, we are prioritizing our board's moral comfort over our members' access to publication. That is not ethics; it is classism. We cannot demand poets subsidize the guild's conscience.

  **5. IMPLEMENTATION PLAN (THE CONDITIONS)**

  To vote **APPROVE WITH CONDITIONS** means:

  1.  **Cost Parity Clause:** The new supplier must match the current per-unit cost within 5%. If they cannot, the Board must absorb the difference from administrative reserves, not author fees or print run volume.
  2.  **Phased Exit:** We fulfill the current committed order (to avoid breach of contract penalties that waste funds) but cease all new requisitions effective [Date, e.g., January 1].
  3.  **Transparency:** We publish a brief note in the next chapbook series explaining the switch. This turns the "performative" aspect into an educational one, inviting other guilds to follow suit, which *does* create causal leverage through aggregation.

  **6. VOTE REQUEST**

  This recommendation rejects the idea that we are powerless due to our size, but it also rejects the idea that moral purity justifies burdening our artists. It treats the supply chain as a political choice, not just a logistical one.

  I request a vote on this motion for Thursday's session.

  **[Signature]**
