  I'm designing the final exam for an upper-level seminar cross-listed in metaphysics and philosophy of art. I need one essay question that students should be able to answer in about 75 minutes, writing roughly 800–1,000 words. The topic is verbal disputes and metaontology, but it must not be answerable by reciting standard summaries of Chalmers or Hirsch. To keep it in the weeds yet self-contained, frame the problem around a constructed institutional dispute: a museum board debates whether an AI-generated image that elicits profound aesthetic experiences in viewers is properly classified as "art." One trustee argues for a functional definition (production of aesthetic experience regardless of origin); another insists on an intentionalist necessary condition (human authorship); a third claims the disagreement is purely verbal because "art" is a family-resemblance concept with no hidden essence. The essay question should require students to do three things: (1) diagnose whether the dispute is genuinely verbal, ontologically substantive, or pragmatically encroached; (2) evaluate whether conceptual engineering—adopting a precise institutional definition—resolves the conflict or merely relocates it into a normative debate about acquisition criteria; and (3) assess whether a deflationary metaontology (e.g., quantifier variance or easy ontology about art-kinds) can consistently support the claim that the engineered definition carries authoritative weight for museum policy.

