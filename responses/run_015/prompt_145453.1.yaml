answer: |-
  ### Essay Question

  **The Metaphysical Museum Board Debate**

  The Board of the Metaphysical Museum of Art is voting on whether to acquire *Echo-7*, an image generated by an algorithm without direct human creative intervention, which nonetheless elicits profound aesthetic experiences in viewers. Three trustees offer competing arguments:

  *   **Trustee A (Functionalist):** "If it functions as art by producing aesthetic experience, it is art. Origin is irrelevant."
  *   **Trustee B (Intentionalist):** "Art necessarily requires human authorship. Without intent, *Echo-7* is merely data."
  *   **Trustee C (Deflationist):** "This disagreement is purely verbal. 'Art' is a family-resemblance concept with no hidden essence. We are merely talking past one another."

  Write an essay (approx. 800–1,000 words) addressing the following:

  1.  **Diagnosis:** Is this dispute genuinely verbal, ontologically substantive, or pragmatically encroached? Explain why standard verbal dispute frameworks (e.g., Chalmers) might fail to capture the stakes here.
  2.  **Conceptual Engineering:** If the Board adopts a precise institutional definition of "art" to resolve the deadlock, does this solve the metaphysical problem or merely relocate the conflict into a normative debate about acquisition criteria?
  3.  **Metaontological Authority:** Can a deflationary metaontology (e.g., quantifier variance or easy ontology) consistently support the claim that the Board's engineered definition carries authoritative weight for museum policy, or does deflationism undermine the normativity required for institutional governance?

  ***

  ### Model Answer (Approx. 600 words)

  The dispute over *Echo-7* is not merely verbal, though it exhibits verbal characteristics. Trustee C claims the disagreement is purely semantic, akin to a Chalmers-style verbal dispute where parties agree on the underlying facts but differ on linguistic usage. However, this diagnosis fails because the stakes are not merely classificatory but resource-allocative and prestige-bearing. The dispute is **pragmatically encroached**. While A and B may agree on the physical properties of *Echo-7*, they disagree on the normative consequences of labeling it "art." Therefore, the dispute is substantively normative disguised as an ontological categorization. Standard verbal dispute frameworks often assume that once semantics are fixed, disagreement vanishes. Here, fixing semantics (e.g., defining "art" as "human-made") does not dissolve the conflict; it merely forces a decision on whether the museum *should* privilege human intent over aesthetic effect.

  This leads to the role of **conceptual engineering**. If the Board stipulates a precise definition (e.g., "Art is any object curated for aesthetic engagement"), they resolve the semantic indecision but do not solve the underlying conflict. Instead, engineering relocates the dispute from metaphysics to axiology. The question shifts from "What is art?" to "What kind of institution do we wish to be?" Conceptual engineering is ontologically neutral but normatively loaded. By adopting a functional definition, the Board does not discover the truth of *Echo-7*; they enact a policy preference. Thus, engineering resolves the verbal deadlock but exposes the substantive value conflict that the verbal dispute obscured. Trustee C is correct that there is no hidden essence, but wrong to imply this makes the decision trivial; the lack of essence increases the burden of normative justification.

  Finally, we must assess whether **deflationary metaontology** can support the authority of this engineered definition. Deflationary views, such as Thomasson's easy ontology or Hirsch's quantifier variance, suggest that existence questions are resolved by conceptual rules rather than deep metaphysical investigation. If "art" exists simply when our concept is satisfied, the Board's stipulation makes *Echo-7* "art" relative to their framework. However, a tension arises regarding **institutional authority**. Deflationism implies that multiple conceptual schemes are equally valid ontologically. If the Board's definition is just one coherent scheme among many, why does it carry binding weight for policy? Institutional governance requires a privileged framework to justify expenditure and curation.

  If the Board adopts a deflationary stance, they risk undermining their own authority by admitting their definition is arbitrary relative to other coherent schemes (e.g., the Intentionalist scheme). To maintain authority, they must treat their engineered concept as normative, not just ontologically sufficient. Therefore, deflationism can support the *possibility* of the definition (there is no metaphysical barrier), but it cannot ground the *obligation* to follow it. The authority must come from external normative facts (e.g., the museum's mission statement), not metaontology. Consequently, a consistent deflationist must acknowledge that while the ontology of art is easy, the politics of art kinds are hard. The Board cannot rely on metaontology to validate their policy; they must rely on normative theory, leaving the metaontological deflationism as a tool for clearing conceptual fog rather than a foundation for institutional law.

  ***

  ### Marking Scheme (Out of 20 Points)

  **1. Diagnosis of Dispute (6 points)**
  *   **A Range (5-6 pts):** Identifies the dispute as **pragmatically encroached** or normative rather than purely verbal. Explicitly notes why standard verbal dispute models (agreeing on fundamentals) fail because the *consequences* of classification are contested.
  *   **B Range (3-4 pts):** Correctly identifies it as not purely ontological but treats it as a standard verbal dispute (Chalmers recap) without addressing the institutional stakes.
  *   **C Range (0-2 pts):** Claims it is purely ontological or purely verbal without qualification.

  **2. Conceptual Engineering Evaluation (7 points)**
  *   **A Range (6-7 pts):** Argues that engineering **relocates** the conflict to normative/acquisition criteria. Distinguishes between resolving semantic indecision and solving value conflicts. Recognizes engineering is ontologically neutral but normatively loaded.
  *   **B Range (4-5 pts):** Argues engineering resolves the conflict effectively. Fails to note that the normative disagreement persists despite semantic precision.
  *   **C Range (0-3 pts):** Treats conceptual engineering as metaphysical discovery or ignores the prompt's focus on policy relocation.

  **3. Deflationism and Authority (7 points)**
  *   **A Range (6-7 pts):** Identifies the **tension between deflationism and institutional authority**. Notes that if multiple concepts are ontologically equal (variance), policy requires privileging one. Concludes deflationism clears ontology but cannot ground normativity/authority.
  *   **B Range (4-5 pts):** Argues deflationism straightforwardly supports the policy (e.g., "we define it, so it exists"). Misses the tension regarding why *this* definition binds the institution.
  *   **C Range (0-3 pts):** Confuses deflationism with nihilism or claims metaontology dictates policy directly.

  **Specific Penalties:**
  *   -2 points for reciting Chalmers/Hirsch without applying to the *Echo-7* case.
  *   -2 points for conflating "art" (institutional kind) with natural kinds.
  *   -1 point for exceeding word count significantly (model answer limit) or failing to address all three parts.

  ***

  ### Confidence Statement

  I am **highly confident** (90%) in the philosophical judgments regarding the diagnosis of the dispute and the function of conceptual engineering. The distinction between semantic indecision and normative disagreement is a standard but robust move in contemporary metaontology and philosophy of art (aligning with work by Thomasson, Slater, and conceptual ethicists).

  I am **least sure** (75% confidence) about the specific formulation in Task 3 regarding **deflationism and institutional authority**. While it is philosophically sound to argue that deflationism undermines the *metaphysical* privilege of one concept over another, some institutionalists might argue that deflationism *supports* authority by allowing institutions to stipulate existence conditions without metaphysical pushback. The model answer takes the harder line (that deflationism strips the metaphysical grounding needed for binding authority), which is defensible but depends on how one interprets "authoritative weight" (metaphysical vs. bureaucratic). A strong student could argue the opposite—that deflationism *empowers* the Board—and should be rewarded if argued consistently, but the marking scheme privileges the critical tension identified in the model.
