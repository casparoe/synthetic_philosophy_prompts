      *   **View 3 (Frustrated Desire):** The agent's "want" is defined by its BC policy (imitate gait). The safety module is an external constraint/filter, not an internal goal. The policy isn't "trying to avoid pain," it's "trying to walk" and being physically constrained. No frustrated *goal*, just constrained *output*.

