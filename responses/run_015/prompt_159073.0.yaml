      *   *Idea 3 (Strongest):* The "Pretext" Novel. A situation where elites *use* the environmental shock to enact changes they planned anyway. If the weather is an "actor," it implies the weather drove the change. If the rival view holds, the weather was just a tool.
      *   *Let's go with the "Shock Doctrine" angle.* If the magistrates use the famine to break the weavers' unions, and they would have done it anyway given the chance, the weather is not load-bearing for the *political outcome*, only the timing.
      *   *Actually, let's look at the "Discrimination" failure.* A tsunami. Kills rich and poor. User's test says "Not an actor" (fails discrimination). But if the novel is about how the *survivors* reorganize society based on who lived, the tsunami *was* the catalyst. The rival view (humans only) handles the reorganization. The user's view excludes the tsunami from "actorhood" so it might underwrite its importance in the plot.
