answer: |-
  ### Desiderata for Precommitment Validity

  To advise both a constitutional drafter and a clinician, an account of precommitment must function across scales (individual to institutional) and timeframes (days to centuries). The following requirements distinguish a binding constraint from a mere suggestion or an act of tyranny by a past self.

  **1. Competence and Context at T1 (Non-negotiable)**
  *   **Requirement:** The agent at the time of commitment (T1) must possess the specific capacity or authority required for the domain of the constraint, and the commitment must not be the product of a transient state that the agent themselves identifies as impairing (e.g., mania, revolutionary duress).
  *   **Motivation:** A psychiatric directive written during a psychotic episode cannot bind the remitted self; a constitution drafted under foreign occupation cannot bind the liberated state.
  *   **Stress Test:** *Plain Personal Case.* Distinguishes a Ulysses contract (sober T1) from a suicide note written in despair (impaired T1).

  **2. Continuity of Identity and Succession (Non-negotiable)**
  *   **Requirement:** There must be a defined chain of agency linking T1 and T2. For institutions, this requires explicit rules of succession that transmit the *commitment* along with the *power*. If the body is wholly renewed, the new members must inherit the institutional identity, not just the assets.
  *   **Motivation:** Without this, a "wholly renewed body" is simply a new group being ruled by ghosts. The commitment binds the *office*, not the *person*, but the office must remain recognizably the same agent.
  *   **Stress Test:** *Wholly Renewed Body.* Prevents the claim that "none of us voted for this, so it doesn't apply to us."

  **3. Teleological Fidelity over Literal Compliance (Non-negotiable)**
  *   **Requirement:** The constraint must be interpreted according to the purpose it was designed to serve. If literal compliance defeats the purpose (due to changed circumstances or unforeseen loopholes), the constraint loses validity.
  *   **Motivation:** Prevents "malicious compliance" where the letter of the law is followed to undermine its spirit.
  *   **Stress Test:** *Literal Compliance Defeating the Point.* A hospital following an advance directive to withhold food when the patient is actually hungry and capable of swallowing (due to a diagnostic error in the directive) violates the patient's underlying value of health.

  **4. Guardian Parity (Non-negotiable)**
  *   **Requirement:** The mechanism or agent appointed to enforce the constraint (the Guardian) must itself be bound by constraints that mirror the original commitment's logic. You cannot solve the precommitment problem by creating an unconstrained enforcer.
  *   **Motivation:** Avoids pushing the problem up one level. If a Central Bank is independent to prevent inflation, what prevents the Bank from pursuing its own inflationary agenda?
  *   **Stress Test:** *The Guardian.* Ensures the enforcer is a trustee, not a master.

  **5. Error-Cost Calibration (Non-negotiable)**
  *   **Requirement:** The barrier to reversal (e.g., supermajority, waiting period, judicial review) must track the expected cost of *false reversal* (undoing a good commitment) versus the cost of *false retention* (keeping a bad commitment). It must not simply track the intensity of political or psychological pressure to reverse.
  *   **Motivation:** High pressure does not equal high error cost. A population might desperately want to print money (high pressure), but the cost of doing so (hyperinflation) is the very reason the constraint exists.
  *   **Stress Test:** *Calibration.* Prevents the barrier from being either too brittle (never allows change) or too porous (collapses under heat).

  **6. Circularity Management via Procedural Externality (Non-negotiable)**
  *   **Requirement:** The test for whether a repeal is justified (circumstances changed) rather than motivated (constraint is working) cannot rely solely on the T2 agent's unconstrained assertion. It requires a procedural hurdle or external review that forces T2 to articulate reasons in a language T1 would have recognized.
  *   **Motivation:** T2 cannot be the sole judge of whether T1's constraint is still valid, or the constraint is illusory.
  *   **Stress Test:** *Diagnostic Circularity.* Distinguishes "I want out" from "I need out."
  *   **Note on Status:** This is **Manageable, not Escapable.** You cannot fully escape T2's judgment because T2 must ultimately pull the lever. However, you can manage it by requiring T2 to jump through hoops (time, consensus, explanation) that filter out impulsive or self-serving judgments.

  **7. Re-authorizability at Will (Preference: Liberal Camp)**
  *   **Requirement:** The agent at T2 should be able to dissolve the commitment if they can demonstrate current competence/authority, regardless of T1's wishes.
  *   **Motivation:** A horror of the "dead hand." Prioritizes current autonomy over past planning.
  *   **Status:** **Preference.** This is incompatible with strong entrenchment. A constitutional drafter seeking stability will reject this; a clinician prioritizing current patient autonomy may accept it.

  ---

  ### Analysis of the Three Priorities

  **1. Diagnostic Circularity: Escapable or Manageable?**
  It is **only manageable, not escapable.** You cannot construct a test that is entirely independent of the later self's judgment, because the later self must ultimately interpret the evidence and operate the mechanism of repeal. If you try to make it fully escapable (e.g., by appointing a Guardian to decide), you encounter the Guardian Problem (Desideratum 4): the Guardian is also a "later self" relative to T1.
  *   **Solution:** The circularity is managed by *friction*. By requiring T2 to expend significant political capital, time, or consensus to repeal, you ensure that only strong, sustained judgments (likely justified) overcome the barrier, while transient, self-serving impulses (likely motivated) fail. The test does not defer to T2's *whim*, but it must defer to T2's *sustained, procedurally validated will*.

  **2. Calibration vs. Pressure: Joint Satisfiability?**
  These are **jointly satisfiable, but only through proxies.** You cannot observe "error cost" directly; you can only observe "pressure." To satisfy Desideratum 5, the system must use *structural proxies* for error cost that are insulated from pressure.
  *   **Example:** A "cooling-off period" proxies for the risk of impulsivity (high error cost of quick reversal) without measuring the heat of the debate. A "supermajority" proxies for the risk of factional tyranny.
  *   **Warning:** If the drafters set the barrier based on how *angry* they expect people to be (pressure) rather than how *damaging* a reversal would be (error cost), the system fails. The advisory group must insist that amendment thresholds be justified by the *consequences of failure*, not the *difficulty of passage*.

  **3. The Critical Requirements**
  *   **Most Exclusionary Requirement:** **Error-Cost Calibration (Desideratum 5).** Most existing theories (and drafters) default to "make it hard to change" or "make it easy to change." Very few rigorously map the specific difficulty of reversal to the specific asymmetric risks of the domain. This requirement excludes almost all "one-size-fits-all" entrenchment models and simple "current autonomy" models.
  *   **Trivializing Requirement:** **Continuity of Identity (Desideratum 2).** If you drop this, the exercise collapses into triviality. Without a requirement that T2 is the *same agent* as T1 (in a legal or psychological sense), any past rule could bind any future entity. This would mean a constitution drafted in 1800 binds a completely different regime in 2000 without need for succession rules, or a directive written by a stranger binds a patient. Dropping this reduces precommitment to mere power dynamics (whoever holds the gun enforces the old rule).

  ---

  ### Scorecard: Three Families of Theory

  **1. The Authorization View (Will-Based)**
  *   *Core:* Bindingness depends on the validity of T1's intent and capacity.
  *   *Performance:* Passes Competence and Identity easily. Fails Teleological Fidelity (too rigid on text) and Circularity Management (struggles to allow T2 to judge T1's intent without overriding it). Often ignores Guardian Parity.
  *   *Verdict:* Good for clear contracts, poor for long-term institutions or changing medical contexts.

  **2. The Substantive Value View (Reason-Based)**
  *   *Core:* Bindingness depends on whether the underlying value or goal of the constraint remains valid at T2.
  *   *Performance:* Passes Teleological Fidelity and Calibration (can adjust to error costs). Fails Circularity Management (T2 decides what values are valid, rendering the constraint weak) and Guardian Parity (Guardians impose their own view of values).
  *   *Verdict:* Good for ethics committees, dangerous for constitutions (invites judicial overreach).

  **3. The Temporal Aggregation View (Welfare-Based)**
  *   *Core:* Bindingness depends on maximizing the net welfare of the entity across T1 and T2 combined.
  *   *Performance:* Passes Calibration and Error-Cost analysis perfectly. Fails Continuity of Identity (may sacrifice T1 entirely for T2 gain) and Competence (may uphold a T1 error if overturning it is too costly).
  *   *Verdict:* Strong analytically, but politically unstable; treats the "self" as a resource to be mined rather than an agent to be respected.
