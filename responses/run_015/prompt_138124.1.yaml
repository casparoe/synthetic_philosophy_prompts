answer: |-
  This is one of the most enduring stalemates in experimental philosophy, precisely because the "Strong Reading" (moral constitution of competence) and the "Performance Reading" (blame-validation heuristic) have become adept at absorbing empirical shocks. To break the deadlock, we need to look for results that force the two theories to make divergent predictions about the *structure* of the judgment rather than just its output.

  Here is the ranking of your three hypothetical results from fatal to welcoming, followed by an assessment of unique predictions and the falsifiability worry.

  ### 1. The Defeaters: Ranked and Analyzed

  #### **(iii) The AI Agent Result (Fatal / Decisive)**
  *The Result:* The asymmetry survives and is **larger** when the agent is an AI system.
  *Why it matters:* The Strong Reading claims that moral considerations constitute the concept of *intentional action*. Intentional action is typically a property of *moral agents*. If the agent is an AI (presumably lacking moral standing, guilt, or culpability in the folk view), the "Moral Constitution" view predicts the asymmetry should diminish or vanish because the relevant moral inputs are missing.
  *The Friend's View:* The Friend argues the word "intentionally" is recruited to license blame. If the effect is *larger* for an AI, it suggests the judgment is driven purely by outcome valence (Bad Outcome = Intentional) without the mediating step of assessing the agent's culpability. This supports a "Outcome Bias" or "Statistical Normality" account over a deep moral-competence account.
  *Defender's Reaction:* **Concede.** A committed defender of the *Moral* Constitution view would have to abandon the "Moral" part of the claim. They would be forced to retreat to a "Normative Expectation" view, admitting that morality *per se* isn't doing the work, but rather a simpler heuristic about deviations from expected behavior. This collapses the Strong Reading into a weaker, performance-adjacent view.
  *Verdict:* **Decisive against the Strong Reading.**

  #### **(i) The Convention vs. Blameless Ignorance Result (Ambiguous / Threatening)**
  *The Result:* Asymmetry survives for pointless conventions (no harm) but vanishes for genuine harm if the agent is blamelessly ignorant.
  *Why it matters:* This result cuts both ways.
      *   *The Convention Part:* If the asymmetry survives for *non-moral* norm violations, the "Moral" Constitution view is technically falsified. It must be revised to a "Normative" Constitution view. This is a retreat, but not a surrender.
      *   *The Ignorance Part:* If the asymmetry *vanishes* when the agent is blameless (even if harm occurs), it suggests the mechanism tracks *culpability*, not just *badness*.
  *The Friend's View:* This fits the Blame-Validation model perfectly. "I only call it intentional if I can blame you. No blame (ignorance) = no intentionality. Pointless rule broken = I can still criticize/blame = intentionality."
  *The Defender's Reaction:* **Treat as Compatible (with revision).** A sophisticated defender (e.g., following Hindriks or Lindauer) will argue that the folk concept of intentional action is constituted by *normative* expectations, not just moral ones. They will argue that "blameless ignorance" changes the *normative status* of the act itself, not just the observer's motivation. They will claim this confirms that norm-violation is the competence condition, and "blame" is just the emotional output of that judgment.
  *Verdict:* **Ambiguous.** It forces the Strong Reading to broaden from "Moral" to "Normative," which risks making the theory trivial (see Falsifiability section), but it does not strictly falsify the claim that norms constitute the concept.

  #### **(ii) The Developmental and Cross-Cultural Result (Welcomed / Supportive)**
  *The Result:* No asymmetry in pre-blame children; universal asymmetry in adults, even where harm is not locally condemned.
  *Why it matters:*
      *   *Development:* If the asymmetry emerges *in tandem* with the capacity for blame/moral judgment, it suggests the two competencies are cognitively linked (Constitution), rather than one being a later rationalization of the other (Performance).
      *   *Cross-Cultural:* If the asymmetry appears where the harm is *not locally condemned*, it devastates the Friend's view. The Friend argues we use "intentional" to enforce local norms. If the local norm doesn't condemn the act, but people still call it intentional, the motivation to blame is absent. The persistence of the effect suggests a universal cognitive structure (Competence).
  *The Friend's View:* The Friend would struggle to explain why adults in a culture that *doesn't condemn* the harm would still exhibit the asymmetry. They would have to posit a hidden, universal blame-motive that contradicts the stated local norms.
  *The Defender's Reaction:* **Welcome.** This is the "smoking gun" for the Competence view. It suggests the link between normativity and intentionality is a feature of human cognitive architecture, not a strategic linguistic maneuver.
  *Verdict:* **Strong evidence for the Strong Reading.**

  ---

  ### 2. Unique Predictions and Dissociations

  You asked what the Strong Reading predicts that the alternatives do not. The crux of the matter is **modularity** and **timing**.

  **The Blame-Validation (Performance) Account Predicts:**
  *   Intentionality judgments should be sensitive to *extrinsic* factors that affect blame but not the action itself (e.g., if the CEO is already being punished for something else, the need to blame via "intentionality" should drop).
  *   Intentionality judgments should correlate with *explicit* measures of blame.
  *   Under cognitive load or speeded conditions, the asymmetry should **diminish**. Why? Because the "recruitment" of the word *intentionally* to license blame is a post-hoc rationalization (System 2). If you force a snap judgment, the neutral concept should shine through.

  **The Strong (Competence) Account Predicts:**
  *   Intentionality judgments should track moral/normative valence even when blame is **controlled for** or **impossible**.
  *   **The Dissociation:** The strongest move for you is indeed a dissociation from blame. If you can construct a vignette where the side effect is *bad*, but the agent is **praised** for it (e.g., a "heroic villain" scenario, or a context where the harm is necessary for a greater good that the subject endorses), the Blame-Validation view predicts the asymmetry should vanish (no desire to blame). The Strong Reading predicts the asymmetry might **survive** because the *concept* of the action is still morally laden, even if the *all-things-considered* judgment is positive.
  *   **Speeded/Implicit Measures:** The Strong Reading predicts the asymmetry should **persist or increase** under speeded conditions. If moral evaluation is *part of* the concept generation (System 1), then removing time for reflection should make the moral bias *more* prominent, not less. (Note: Empirical results here are mixed, which is why the debate persists).

  **My Judgment:** A robust finding that the asymmetry **increases** under time pressure or cognitive load would be the single most damaging result for your friend. It would demonstrate that the moral infusion is automatic and constitutive, not a deliberative rationalization.

  ---

  ### 3. Honest Assessment: Falsifiability and Unfalsifiability

  Has the Strong Reading been qualified into unfalsifiability? **Yes, largely.**

  When the Knobe Effect was first discovered, the claim was bold: *Moral* judgment influences *Intentionality* judgment.
  When counter-evidence arose (e.g., the effect appears with non-moral norms like conventions), the claim shifted: *Normative* judgment influences *Intentionality* judgment.
  When counter-evidence arose (e.g., the effect disappears with certain excusing conditions), the claim shifted: *Relevant* Normative judgment influences *Intentionality* judgment.

  **The Risk:**
  If the Strong Reading defines "Moral/Normative" as "whatever factor causes the asymmetry to appear," the theory becomes tautological. "The asymmetry appears because of normative considerations." "How do we know they are normative?" "Because the asymmetry appears."

  **Is this legitimate?**
  In semantics and conceptual analysis, there is a legitimate place for "reflective equilibrium." We adjust our theory of the concept to match the data. However, for the claim to remain scientific, it must specify *which* norms count and *why*.
  *   **Legitimate Qualification:** Arguing that "folk psychology is inherently normative" is a substantive claim about cognitive architecture. It predicts that *any* deviation from a relevant baseline will be coded as intentional.
  *   **Illegitimate Qualification:** Arguing that "if the asymmetry disappears, the norm wasn't relevant enough." This protects the theory from falsification by redefining the input conditions post-hoc.

  **The Way Out:**
  To save the Strong Reading from unfalsifiability, you must commit to a specific metric of "Normativity" independent of the intentionality judgment. For example, if you claim the effect is driven by *moral* valence, you must measure moral valence separately (e.g., via independent ratings of badness) and show it predicts intentionality *even when* blame is statistically controlled.

  **Conclusion:**
  Your friend is right to worry that the Strong Reading has become a "theoretical sponge," absorbing anomalies by broadening the definition of "moral." However, Hypothetical (ii) (Universality + Development) is the strongest ground you have. If the link is universal and developmental, it is likely competence-level. If it is culturally variable and disappears under cognitive load, it is likely performance-level.

  If I were you, I would pivot slightly: Defend not that "Morality constitutes Intentionality," but that **"Normative Expectation constitutes the baseline for Causal Attribution."** This accommodates the convention data (i) and the AI data (iii) better, while retaining the core insight that the folk concept of action is not morally neutral. It concedes the "Moral" label to your friend but keeps the "Competence" claim for yourself. That is the most defensible position remaining.
