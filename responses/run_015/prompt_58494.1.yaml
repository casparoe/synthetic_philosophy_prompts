          3.  Include specific tests (harm vs. offense, direct vs. indirect harm).
          4.  Mark where evidence ends and discretion begins.
          5.  Apply the procedure to three invented cases (Anti-vax speaker, Counter-demonstration/noise, Graphic history exhibit).
