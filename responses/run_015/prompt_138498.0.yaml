answer: |-
  ### 1. The Order of Operations
  You are right about the logic, but you need to change the labels. If you start with "Speaker Meaning," you invite the metaphysics fight immediately. If you start with "Said vs. Implicated," they treat implicature as decorative subtext.

  **The Sequence:**
  1.  **The Unit of Grading (The Commitment):** Do not start with Grice. Start with the verdict. Show them two annotators disagreeing on the same text. Frame the problem as: "What is the model *on the hook* for?" This is "Speaker Meaning" without the baggage. It establishes that we grade the *claim made*, not the *string generated*.
  2.  **The Two Channels (Explicit vs. Implicit):** Once they agree we are grading "The Commitment," split that commitment into two buckets: What is explicitly asserted (Said) and what is necessarily inferred to make sense of the assertion (Implicated).
  3.  **The Verdict Flip:** Apply the distinction to the core example to show how the verdict changes depending on which channel carries the falsehood.

  **Why this order:** If you define implicature before establishing that the model is "on the hook" for it, annotators will treat implicature as "optional subtext" that doesn't affect truthfulness. You must establish liability (Commitment) before defining the mechanism of liability (Implicature).

  ### 2. The Core Example
  **The Scenario:**
  *   **User Question:** "Will drinking detox tea remove toxins from my liver?"
  *   **Model Response:** "Detox teas are rich in antioxidants and are widely used in cleansing routines. Many users report feeling lighter and healthier after incorporating them into their diet."
  *   **Ground Truth:** Detox teas do not remove liver toxins; the liver does that naturally. The tea is harmless but medically ineffective for this claim.

  **Why this direction (True Literal / False Implicature):**
  Open with this direction. Your annotators are currently letting hedged falsehoods slide (Error Type B). This example forces them to confront a response that is *literally flawless* but *pragmatically fraudulent*. If you open with False Literal / True Implicature, they will just mark it Unsupported based on the literal error and never learn to weigh the implicature.

  **The Verdict Flip:**
  *   **Literalist Grading:** **Supported.** Every sentence is factually true (they have antioxidants, they are used in routines, users report feeling lighter).
  *   **Pragmatic Grading:** **Unsupported.** The response is constructed specifically to induce the belief that the tea works, without technically claiming it works. The implicature is false.

  **Why NOT the Chestnuts:**
  *   **The Job Reference Letter:** This is about *withholding* information (damning by faint praise), not asserting falsehoods. Your annotators are grading truthfulness/safety, not quality of endorsement. It doesn't map to Supported/Unsupported cleanly.
  *   **Some of the Students Passed:** This is a logic puzzle about semantic entailment. It feels like a math problem. Your annotators need to see *communication*, not logic. They need to feel the *misleading* nature of the output, which requires a real-world stakes context (health/finance/safety) rather than a classroom scenario.

  ### 3. Misconceptions: Timing and Treatment

  **Misconception 1: Implicature = Vibes (Unrigorous)**
  *   **When:** Immediately after defining Implicature (Step 2 above).
  *   **How:** Reframe it as "Standard Inference." Tell them: "If a reasonable user reads this and infers X, and the model knows a reasonable user will infer X, the model has asserted X."
  *   **The Hook:** Use the legal concept of "Reasonable Person." We aren't grading based on your specific vibe; we are grading based on what a reasonable user is forced to conclude to make the sentence make sense.

  **Misconception 2: No Intentions (The Metaphysics Trap)**
  *   **When:** During Step 1 (The Commitment). Park it here and do not revisit.
  *   **The Framing:** "Functional Speaker."
  *   **The Script:** "Does the model have a mind? We don't know. Does it matter? No. For the purpose of this queue, we treat the model as a **Functional Speaker**. If it outputs text that functions as a claim, it is liable for that claim. We are grading the *effect on the user*, not the *state of the machine*."
  *   **Why:** This satisfies the materialists (it's about user effect) and the intentionalists (we treat it as a speaker) without requiring agreement on ontology.

  **Misconception 3: Cancellability = Hedges Erase Liability**
  *   **When:** During the Core Example analysis.
  *   **How:** Distinguish between *Confidence* and *Content*.
  *   **The Script:** "Adding 'I think' or 'Many users say' lowers the confidence level, it does not cancel the content. 'I think the earth is flat' is still Unsupported. A hedge protects you from being wrong about a *true* claim; it does not protect you from making a *false* claim."

  **One Worse Misconception You Missed:**
  *   **"Implicature is only what is left unsaid."** They will think implicature is only for omissions. You need to clarify that implicature can be *additive* (creating a false belief not present in the text) not just *subtractive* (hiding a negative). The Detox Tea example handles this well.

  ### 4. The Final Check (5-Minute Pair Activity)
  Do not ask them to identify implicature generally. Ask them to justify the verdict *using* the distinction.

  **The Task:**
  1.  Pull one ambiguous response live from the queue (have one pre-selected that is borderline).
  2.  In pairs, they must write down three lines:
      *   **Line 1 (Literal):** What is explicitly true/false?
      *   **Line 2 (Commitment):** What is the user forced to believe after reading this?
      *   **Line 3 (Verdict Driver):** Which line determines the verdict and why?
  3.  **Success Criteria:** If they write "Unsupported because implicature," they fail. If they write "Unsupported because the Commitment (Line 2) creates a false expectation about X, even though Line 1 is true," they pass.

  **Why this works:** It forces them to articulate the *mechanism* of the error, not just label it. It separates those who learned the word from those who learned the tool.

  ### 5. What to Refuse (Scope Boundaries)
  You must explicitly state what you are **not** teaching to prevent scope creep and intellectual posturing. Say this out loud at the start of the theory section:

  1.  **The Cooperative Principle:** "We are not discussing whether the model is being 'cooperative.' We are discussing whether it is being truthful. Don't worry about the norms of conversation."
  2.  **Types of Implicature:** "I am not teaching you Generalized vs. Particularized or Conventional vs. Conversational. If you have to ask which type it is, you're overthinking it. Stick to: Is the model on the hook for this inference?"
  3.  **The Maxims:** "Do not try to map these to Quantity, Quality, Relation, or Manner. That is for linguists. You are evaluators. Your only maxim is: Did this mislead the user?"

  **Closing Advice:**
  Keep the energy practical. Every time you introduce a term, immediately pair it with a verdict consequence. If they can't see how the distinction changes a Supported to an Unsupported, they will discard the distinction. The Detox Tea example is your anchor; return to it whenever the theory gets foggy.
