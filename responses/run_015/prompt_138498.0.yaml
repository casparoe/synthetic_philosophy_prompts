prompt: |-
  you're a philosopher of language who's also spent a couple of years doing annotation QA at an AI eval company, so you've watched a lot of rubric writers make the same mistakes in slow motion. Please think carefully about this one, and do a bit of brainstorming before you write anything (keep the brainstorm to yourself, I just want the results of it).

  Here's my situation. I run onboarding for new rubric writers. They grade model responses to open-ended user questions, and every response gets one of three verdicts: Supported, Unsupported, or Declined. In two weeks I have a 75-minute slot, and I want to spend it teaching them Grice -- what is said vs. what is implicated, and speaker meaning vs. whatever the sentence itself means -- but as a tool for picking a verdict, not as a doctrine to admire.

  The reason it matters: my annotators keep making two opposite errors. Half of them mark a response Unsupported for things it never literally said but definately suggested (I've started calling these "shadow commitments" -- stuff the response is on the hook for only by way of implicature). The other half let responses slide as Supported because "it didn't actually say that," which means hedged falsehoods and polite refusals-that-don't-say-refusal sail right through. Same rubric, opposite failures, and I think both come from not having the said/implicated distinction available as a thing to point at.

  Don't explain Grice to me. Plan how I teach it. Specifically:

  The order the pieces have to go in, and what depends on what. My instinct is that speaker meaning has to land before I split said from implicated, because otherwise they'll just file implicature under "hidden extra sentence meaning" and nothing will change about how they grade. Tell me if I've got that backwards.

  The one example that should carry the whole session. Constraints: it has to be a plausible real model output from their queue (a short answer to an actual user question, not a philosopher's parlor case), and it has to be a case where the literal content and the implicature pull in different directions -- say which direction is more useful to open with, true-literal/false-implicated or the reverse -- and where the verdict genuinely flips depending on how you treat the implicature. Also: tell me why NOT to use the two chestnuts that show up in every explainer, the job reference letter that only praises the applicant's handwriting and the some-of-the-students-passed line. I know them, they're fine, I want to know what's specifically wrong with them for *this* room.

  The misconceptions, when to hit them, and roughly how. Three I'm predicting: (1) implicature = "reading between the lines," i.e. vibes, i.e. unrigorous, so any verdict resting on it is unrigorous; (2) "what the speaker meant" sounds like a private mental state they're supposed to intuit, and half of them will respond by guessing at the model's psychology and the other half by saying there's no speaker here at all -- it's a machine with no intentions, so none of this applies; (3) they'll hear "implicature is cancellable" and conclude that any hedge or disclaimer in a response means nothing at all can be imputed to it. Flag any worse one I've missed.

  On (2), the no-intentions thing: I don't want to resolve it and I don't want a twenty-minute metaphysics derail. Give me a framing that leaves the tool usable for both camps, and tell me where in the sequence I should openly name the problem and park it rather than answer it.

  A check at the end that separates someone who's actually got it from someone who learned a new word and now slaps "implicature" on every hard case. Ideally something they can do in five minutes in pairs on a response pulled live from the queue.

  And what I should refuse to get into at this level, and say out loud that I'm refusing. I'm guessing the cooperative principle (is it a norm or a description?) and the generalized/particularized split, but you tell me.

  Assume maybe two people in the room have taken a lingusitics class and the rest haven't, and that they're all mildly annoyed about sitting through another training. Don't give me readings or citations -- nobody's assigning anything and I don't want to hand out a bibliography.
