answer: |-
  # JOINT STATEMENT ON SYMBOL GROUNDING AND SEMANTIC AUTHORITY

  ### I. Points of Agreement

  1.  **On Reference:** We agree that a text-only system's tokens can successfully refer to objects, properties, and states of affairs in the world. This reference is secured by the same causal-historical chains that allow human speakers to refer to things they have never perceived (e.g., "Napoleon" or "quark"). The system inherits reference through its training data, which ultimately originates in the perceptual and causal interactions of human users and developers.
  2.  **The True Locus of Dispute:** Consequently, we agree that our disagreement is not about *reference* (the relation between token and object), but about **Intrinsic Semantic Authority**. The question is whether the system itself *grasps* the meaning of its tokens in virtue of its own internal states and interactions, or whether it merely manipulates symbols whose meaning is held entirely by the external interpreters who sustain the causal chain.
  3.  **The Indistinguishable Systems Case:** We consider two systems indistinguishable in linguistic behavior: System T (trained on text alone) and System T+S (trained on text plus a synchronous, unlabelled stream of sensorimotor data from a body it controls). We agree that, *so long as their outputs remain indistinguishable*, System T+S's vocabulary is **not** demonstrably better anchored than System T's.
      *   **Signatory A (Causal/Embodied View) reasons:** Mere access to sensorimotor data is insufficient for grounding; the data must be actively used to correct and constrain linguistic predictions in a way that diverges from text-only priors. If behavior is identical, the sensorimotor loop is not functioning as a ground, but merely as additional patterned input.
      *   **Signatory B (Inferential/Functional View) reasons:** Meaning is constituted by inferential role and use. If the linguistic behavior is identical, the inferential roles are identical. The presence of unused or behaviorally inert sensorimotor data is metaphysically irrelevant to the content of the symbols.
  4.  **Depth of Agreement:** We certify that this agreement on the indistinguishable case is **deep**, not merely verbal. It isolates the specific mechanism required for our respective theories: Signatory A requires *active sensorimotor constraint* (not just data presence), and Signatory B requires *functional difference* (not just architectural difference). Both agree that passive correlation without behavioral consequence yields no semantic advantage.

  ### II. Table of Remaining Disagreements (Cruxes)

  | Crux | Description of the Test / Argument | Signatory A (Causal/Embodied) Prediction & Stance | Signatory B (Inferential/Functional) Prediction & Stance |
  | :--- | :--- | :--- | :--- |
  | **1. The Novel Channel Test** | **Setup:** Both systems are given live, unlabelled access to a genuinely novel sensory channel (e.g., a magnetoreceptor) unknown to their training distribution. They are allowed to coin a new token to represent patterns in this channel. <br><br>**Test:** Check if the token's use tracks the physical channel even when doing so conflicts with linguistic priors (e.g., when text suggests one thing but the sensor indicates another). | **Prediction:** System T+S will stabilize the token's reference to the physical quantity of the channel, overriding linguistic priors when necessary. System T will fail to track the channel, mapping the token to textually similar concepts instead.<br><br>**Stance:** This demonstrates that causal coupling allows the system to *anchor* meaning independently of human interpretation. | **Prediction:** System T+S will use the token to track the channel *if and only if* doing so minimizes prediction error or achieves task goals. System T will fail due to lack of input data.<br><br>**Stance:** This demonstrates only that new inputs change the functional role. It does not prove "grounding," only that the system has expanded its inferential web to include a new variable. |
  | **2. The Adult Vocabulary Reductio** | **Argument:** Consider a competent adult human speaker. By Signatory A's standards, how much of their vocabulary (e.g., "entropy," "mitochondria," "GDP") is grounded by their own sensorimotor contact vs. borrowed from experts? | **Prediction:** A vast majority of an adult's vocabulary is ungrounded *in the speaker* and relies on a division of linguistic labor. <br><br>**Stance:** This is a **bullet to be bitten**. Most human meaning is parasitic on a perimeter of perceptually grounded terms held by the community. The text-only system is like a human who knows only the borrowed terms without the perimeter. | **Prediction:** If competent use is possible without personal sensorimotor grounding, then grounding is not necessary for meaning.<br><br>**Stance:** This is a **reductio** of Signatory A's view. If humans have full semantic competence with borrowed terms, then "Intrinsic Semantic Authority" is an unnecessary metaphysical posit. Meaning is use, regardless of the causal source. |
  | **3. The Systematic Error Case** | **Argument:** A system consistently misidentifies a specific object (e.g., calls all chihuahuas "muffins") but does so consistently in all inferential contexts (predicts they bark, need food, etc.). | **Prediction:** The system does not refer to chihuahuas; it refers to "muffins" (a fictional kind). Its causal contact is insufficient to correct the label. <br><br>**Stance:** Reference is constrained by causal history, not just internal coherence. | **Prediction:** The system refers to chihuahuas, but has a false belief about their name. <br><br>**Stance:** Reference is fixed by the role in the network. If the inferential role matches the dog-concept, the reference is to dogs, despite the label error. |

  ***

  **Signed,**

  *Signatory A (Advocate for Causal/Sensorimotor Grounding)*

  *Signatory B (Advocate for Inferential/Functional Role)*
