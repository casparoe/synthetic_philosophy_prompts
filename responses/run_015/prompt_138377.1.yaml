answer: |-
  **Score:** 20/25
  **Letter Grade:** B

  **Grading Comments:**

  **Part (a): Contextualism (5/5 points)**
  *   **Strengths:** You correctly identify epistemic contextualism as a semantic thesis regarding the word 'knows'. You accurately note that the truth-conditions vary with the *attributor's* context (specifically mentioning stakes and salience).
  *   **Note:** Your application of this to the bank case is correct: low-stakes attributor makes the knowledge attribution true; high-stakes attributor makes it false.

  **Part (b): Pragmatic Encroachment (5/5 points)**
  *   **Strengths:** You correctly distinguish encroachment from contextualism here by noting it affects "knowledge itself, not merely the semantics." You also correctly identify that the relevant practical factors are the *subject's* stakes (Hannah's), not the speaker's.
  *   **Note:** Your description of the mechanism ("belief has to be in better epistemic shape... to count as knowledge") is an accurate representation of the view (often associated with Stanley or Fantl & McGrath).

  **Part (c): Application to Bank Cases (5/10 points)**
  *   **Strengths:** You correctly predict the outcome for the standard cases. For the encroacher, Hannah knows in low-stakes and fails to know in high-stakes. For the contextualist, the attribution is true in low-stakes and false in high-stakes.
  *   **Area for Improvement:** Be careful with phrasing regarding the contextualist prediction. The prompt asks "whether the subject knows." Strictly speaking, contextualists avoid saying "S knows" simpliciter; they say "S knows" is true *in context C*. Your answer handles this reasonably well by focusing on the utterance, but ensure you maintain the distinction that for the contextualist, there is no single fact of the matter about whether Hannah knows independent of a context of assessment.

  **Part (d): Classification and Divergence (5/10 points)**
  *   **Critical Error (Taxonomy):** You state: *"For that reason, pragmatic encroachment is best understood as just a version of contextualism: it is contextualism about the subject's practical interests instead of the attributor's context."*
      *   **Correction:** This is taxonomically incorrect within the standard literature. Pragmatic encroachment is classified as a form of **Sensitive Invariantism**, not Contextualism.
      *   **Why it matters:** Contextualism claims the *semantic content* of 'knows' shifts with context. Encroachment claims the *semantic content* of 'knows' is invariant (stable), but the *truth conditions* (specifically the epistemic threshold required) shift based on practical factors. By calling encroachment a "version of contextualism," you erase the semantic/metaphysical distinction that defines the debate.
  *   **Critical Error (Divergence Case):** You state: *"in the standard bank cases the attributor and the subject have the same stakes anyway, so the views predict the same thing."*
      *   **Correction:** While they predict the same thing in *standard* cases (where stakes align), part (d) explicitly asks for a case where they make **different** predictions. You missed the "Cross-Context" case.
      *   **The Missing Case:** Consider a scenario where the **Subject (Hannah) has Low Stakes**, but the **Attributor (Speaker) has High Stakes**.
          *   **Contextualist Prediction:** The attribution "Hannah knows" is **False**. (Because the *attributor's* high stakes raise the semantic standard).
          *   **Encroachment Prediction:** The attribution "Hannah knows" is **True**. (Because the *subject's* low stakes mean she meets the epistemic threshold, and the semantics of 'knows' do not shift with the speaker).
      *   **Why this is crucial:** This divergence is the primary theoretical motivation for distinguishing the two views. If they were "at bottom the same idea" as you argued, this case would not produce a conflict.

  **Summary:**
  You have a strong grasp of the mechanics of both views (Parts a–c). You understand how stakes function in both frameworks. However, your classification in Part (d) conflates *semantic context-sensitivity* with *truth-condition sensitivity*. In an upper-division seminar, distinguishing Sensitive Invariantism (Encroachment) from Attributor Contextualism is a key learning objective. Review the distinction between "the meaning of 'knows' changes" (Contextualism) vs. "the conditions for satisfying 'knows' change" (Encroachment/Invariantism).

  **Recommendation:** Revise your notes on the taxonomy of invariantism. Ensure you can articulate the "Low-Stakes Subject / High-Stakes Attributor" case, as this is the standard counterexample used to separate these positions.
