answer: |-
  This is a fantastic project and honestly the right way to teach decision theory to grad students who are already primed to spot the trick if you lay it out too cleanly. The challenge you are facing is that the Ellsberg paradox is logically trivial once seen, so the pedagogical value lies entirely in the visceral experience of violating your own consistency constraints before you realize you have done so. To pull this off in ninety minutes with eighteen students, you need to treat the room like a lab where the protocol is rigid, because any slack in the procedure will allow them to rationalize their way out of the trap. You want them to feel the tension of the choice, not just solve the puzzle.

  Start by setting the stakes clearly but casually. Tell them they each have an endowment of points, say one hundred, and that at the end of the session, the top three scores will win a prize, or everyone above a certain threshold gets a coffee voucher. It needs to be enough that they care, but not enough that losing feels punitive. You need two physical urns visible to everyone. Urn One is transparent or clearly labeled as containing exactly fifty red chips and fifty blue chips. Urn Two is opaque or labeled Unknown, containing one hundred chips where the split between red and blue is unknown to everyone, including you. To make this credible, you should prepare Urn Two beforehand using a randomization device they don't see, or better yet, tell them you will determine the composition after they make their choices using a method that ensures you don't know either, though practically it is easier to just seal the composition in an envelope beforehand to save time. For the purpose of the paradox, it does not matter what the actual split is in Urn Two, only that the participants believe it is unknown.

  The critical mechanism here is the sequencing and the commitment device. Do not present all four bets at once. You are going to run three rounds of betting. In Round One, tell them they must choose which urn to draw from if they want to win points on a Red chip. They can choose Urn One or Urn Two. If Red is drawn from their chosen urn, they win fifty points. If Blue is drawn, they win nothing. Hand out small slips of paper and have them write down their choice for Round One only. Collect these slips in a box immediately. Do not discuss their choices. Do not ask for a show of hands. Once the box is sealed or set aside, announce Round Two. This is the trap. In Round Two, they must choose which urn to draw from if they want to win points on a Blue chip. Again, Urn One or Urn Two. If Blue is drawn from their chosen urn, they win fifty points. Have them write this on a new slip and collect it separately. By separating the decisions and collecting the first before revealing the second, you prevent them from seeing the symmetry immediately. Most students, driven by ambiguity aversion, will choose Urn One for Round One because they know the probability is exactly fifty percent, and they fear Urn Two might have very few red chips. Then, in Round Two, facing a bet on Blue, they will reason that if Urn Two was risky for Red, it must be heavy on Blue, so they should switch to Urn Two to capture that potential upside. However, the classic Ellsberg violation is actually that they prefer Urn One for Red and Urn One for Blue. They avoid the unknown urn entirely. This is the pattern you are hunting for. If they pick Urn One for both, they have violated the sure-thing principle because they are implicitly assigning a probability of less than fifty percent to Red in Urn Two and less than fifty percent to Blue in Urn Two, which sums to less than one hundred percent. If they pick Urn One for Red and Urn Two for Blue, they are actually being consistent with a subjective belief that Urn Two is blue-heavy. The paradox is specifically the preference for the known urn in both cases. So your instructions must be neutral enough that they don't feel prompted to switch, but the separation ensures they don't see the contradiction until the reveal.

  Now for the control round you requested to address your friend's critique about pessimism. The argument is that people aren't averse to ambiguity per se, but simply assume the unknown urn is rigged against them, meaning they subjectively believe the unknown urn has fewer winning balls than the known urn. To test this, you need a Round Three where the unknown urn is objectively favorable but still ambiguous. Tell them that for this round, Urn Three is introduced. Urn Three contains one hundred chips. You tell them explicitly that Urn Three contains more Red chips than Blue chips, but the exact number is unknown. It could be fifty-one red and forty-nine blue, or it could be ninety-nine red and one blue. The known option is still Urn One with fifty red and fifty blue. Ask them to bet on Red again, choosing between Urn One and Urn Three. A purely pessimistic player who avoided Urn Two in Round One because they thought it had few red chips should now jump at Urn Three, because they have been told it has a majority of red chips. An ambiguity-averse player, however, might still stick with Urn One. They dislike the lack of precise probability even when the expectation is favorable. This distinction is subtle but crucial for your debrief. If you see students switch to Urn Three, you have evidence of pessimism in Round One. If they stick with Urn One despite the favorable information, you have evidence of true ambiguity aversion. Collect these choices on a third slip.

  Once the choices are locked in, you need to resolve the bets to make the stakes real. Draw a chip from Urn One. Record the color. Then reveal the composition of Urn Two. You can do this by dumping it out or opening the envelope you prepared. Calculate the points for each student based on their three slips and the actual draw. This moment of calculation is where the anxiety sets in for those who realize they might have hedged poorly. Give them a moment to tally their scores. Then, and only then, do you begin the debrief. Do not start with the theory. Start with a show of hands. Ask how many people chose Urn One for Round One. Expect a majority. Ask how many chose Urn One for Round Two. Expect a similar majority. Then ask how many chose Urn One for both. This is your target group. Ask one of them to explain why they picked Urn One for the Red bet. They will say they didn't know the split in Urn Two. Ask them why they picked Urn One for the Blue bet. They will give the same reason. Now you have them cornered. Write on the board without naming the principle yet. If you preferred Urn One for Red, you must have believed the chance of Red in Urn Two was less than fifty percent. If you preferred Urn One for Blue, you must have believed the chance of Blue in Urn Two was less than fifty percent. Ask the room what happens when you add those two beliefs together. They will see that less than fifty plus less than fifty cannot equal one hundred. This is the moment the incoherence lands. You can then introduce the term sure-thing principle and explain that their preferences violate the axiom that if you prefer option A over B when event E occurs, and you prefer A over B when event E does not occur, you should prefer A over B regardless of E. In this case, the event is the composition of the urn.

  Then move to the control round. Ask those who stuck with Urn One in Round Three to raise their hands. Ask them why they didn't switch to Urn Three when told it had more red chips. This is where you address your friend's critique. If they say they still didn't trust the unknown, you have isolated ambiguity aversion from simple pessimism. You can explain that standard expected utility theory cannot distinguish between risk and ambiguity because it assumes agents act as if they have a single subjective probability distribution. The Ellsberg paradox shows that people act as if they have a set of probabilities and they optimize for the worst case within that set, which is the core of maxmin expected utility. This is the formal structure you need to map onto their choices. The activity reproduces the behavioral violation, but you must supply the mathematical proof that no single probability assignment can justify their choices. The activity cannot reproduce the math itself; it only produces the raw data of their inconsistency. You have to be the one to draw the inequality on the board that proves P(Red) plus P(Blue) must equal one.

  You should be prepared for several things to go wrong because this is the first time you are running it. First, some students will try to hedge. They might ask if they can split their points between urns. You must say no before they start. If they ask during the round, tell them the rules do not allow it. If they write down both urns on a slip, count it as invalid and give them zero for that round. This harshness is necessary to force a binary choice. Second, some students in the economics cohort might recognize the setup immediately. They might whisper to others. To mitigate this, keep the instructions dry and avoid using the words probability or chance until the debrief. Call them Urn A and Urn B. Do not call it an experiment. Call it a trading game. Third, you might get a room that is too rational. It is possible that half the room picks Urn One for Red and Urn Two for Blue. This is actually consistent behavior if they believe Urn Two is blue-heavy. If this happens, do not panic. Use it. Ask them why they switched. When they explain their belief about the composition, point out that the people who stayed with Urn One for both are the ones creating the paradox. You need at least a few people to exhibit the paradox for the debrief to work, and with eighteen grad students, statistically you should get enough violations unless they have all read too much behavioral econ already. Fourth, some might refuse to bet or write nonsense. Treat this as a data point about risk aversion or disengagement, but remind them that participation is required for the prize.

  There is also a limitation to this activity that you need to own in the debrief. The activity shows that their choices are inconsistent with subjective expected utility, but it does not prove that ambiguity aversion is irrational. Some philosophers argue that it is rational to avoid ambiguous bets because of information asymmetry or because the unknown urn implies a lack of confidence in the probability estimate itself. The activity forces them to feel the violation, but it does not resolve the normative debate about whether the sure-thing principle should always hold. You need to make sure you don't present Ellsberg as proof that the students are wrong, but rather as proof that the standard model is incomplete. The activity reproduces the behavioral anomaly perfectly, but it cannot reproduce the philosophical justification for why we might want to keep the sure-thing principle despite these intuitions. That part relies on your explanation of why consistency matters for avoiding Dutch books or money pumps. You should prepare a quick example of how someone with Ellsberg preferences could be pumped for money in a repeated setting, as that makes the rationality constraint concrete.

  Finally, manage your time tightly. Spend ten minutes on setup and instructions. Spend twenty minutes on the three rounds of betting and the draw. Spend forty minutes on the debrief and mapping the choices to the formal logic. Leave twenty minutes for open discussion on the normative implications. If you let the betting drag on, you will rush the math, and the students will leave feeling like they played a game but not understanding the theory. The magic of this workshop is not in the chips or the urns, but in the moment they realize their own intuition violates the logic they claim to uphold. Make sure that moment lands before you start talking about Savage or Anscombe and Aumann. Keep the props simple, the instructions strict, and the reveal dramatic. If you can get them to defend their Round One and Round Two choices out loud before showing them the contradiction, the cognitive dissonance will do the rest of the teaching for you.
