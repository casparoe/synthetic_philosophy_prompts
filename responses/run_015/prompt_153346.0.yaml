answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Topic:** Infinite Ethics and Moral Agency

  **Question:**
  Standard objections to maximizing consequentialism often rely on the claim that infinite moral demands exceed finite human capacity, resulting in practical paralysis. However, consider the **Asymptotic Obligation Thesis (AOT)**. The AOT posits that an agent's moral demands function as a mathematical asymptote: as available resources or situational proximity vary continuously, the required moral effort approaches but *never reaches* a finite ceiling. There is no single point where "enough" is done, yet the demand never technically exceeds the total sum of possible effort at any given instant.

  Write an essay evaluating the coherence of the AOT. Does this framing successfully resolve the tension between unlimited moral reasons and finite agency by eliminating the threshold of failure? Or does it merely relocate the paradox into an infinite regress of residual duties, rendering moral closure conceptually impossible?

  *Note: You are strictly prohibited from answering this question by citing standard "over-demandingness" objections (e.g., the drowning child, famine relief scenarios, or appeals to psychological burnout). Your analysis must engage exclusively with the logical structure of the asymptotic framing and its implications for the ontology of duty.*

  ***

  **Model Answer**

  The Asymptotic Obligation Thesis (AOT) attempts to salvage infinite ethics from the charge of incoherence by replacing a binary threshold of duty with a continuous curve of obligation. By positing that moral demands approach a limit without ever touching a finite ceiling, the AOT aims to negate the concept of "failure" as a discrete event. If one cannot technically reach the limit, one cannot technically fall short of it in a final sense. However, upon close examination, the AOT does not resolve the tension between unlimited reasons and finite agency; rather, it relocates the paradox into a vicious infinite regress of residual duties that makes moral closure conceptually impossible.

  The primary appeal of the AOT lies in its avoidance of the "cliff-edge" problem. In standard maximizing frameworks, an agent is either right or wrong based on a specific threshold of utility. If the threshold is infinite, the agent is always wrong. The AOT softens this by suggesting obligation is a function of continuous variables (resources, proximity). As resources increase, the obligation increases, but always remains just beyond the agent's current grasp, like a horizon. This suggests that at any specific moment $t$, the agent is meeting the obligation defined for $t$, even if the obligation for $t+1$ will be higher. This appears to preserve the integrity of finite agency; the agent is never asked to do the impossible *now*, only to approach the limit continuously.

  However, this apparent resolution collapses when we analyze the implications for moral closure. For an action to be morally complete, there must be a state in which the agent is permitted to cease moral deliberation regarding that specific demand. The AOT denies this state by definition. If the obligation is asymptotic, there is always a residual duty remaining, no matter how much is sacrificed. This generates a Zeno-style paradox of ethics. Just as Achilles never logically reaches the tortoise in Zeno's formulation if space is infinitely divisible, the moral agent never logically completes a duty if obligation is infinitely approachable.

  This leads to the problem of the infinite regress of residual duties. Under the AOT, every unit of moral effort discharged leaves a remainder of obligation that is smaller than the last but non-zero. Consequently, the agent exists in a permanent state of moral debt. While the AOT argues this avoids paralysis because the demand at any instant is finite, it ignores the cumulative ontological weight of an uncompletable task. A finite agent requires the concept of "satisfaction conditions" to navigate agency. If satisfaction is structurally impossible because the asymptote is never touched, then "moral action" loses its definitional boundary. An action without a possible endpoint is indistinguishable from a state of being, dissolving the distinction between the agent and the obligation.

  Furthermore, the AOT fails to account for the discreteness of moral decisions. While resources and proximity may vary continuously, human actions are often discrete. One either donates the endowment or one does not; one either enters the burning building or one stays. The AOT attempts to map continuous mathematical functions onto discrete agential events. If the obligation is asymptotic, when is the discrete action "sufficient"? If the answer is "never," then the discrete action is always morally deficient. If the answer is "when the agent stops," then the obligation was not truly asymptotic but capped by the agent's will, which contradicts the thesis.

  Therefore, the AOT does not resolve the tension between unlimited reasons and finite agency; it obscures it. By removing the finite ceiling, it removes the possibility of moral rest, which is a necessary condition for coherent agency. The paradox is not solved but smoothed over. The agent is no longer crushed by a demand that exceeds their total capacity, but they are haunted by a demand that exceeds their capacity for closure. A coherent ethical system must allow for the possibility of duty fulfillment. Since the AOT structurally precludes fulfillment by defining obligation as that which is approached but never reached, it renders the concept of moral obligation incoherent for finite beings. The tension remains because finite agency requires finitude in duty, not merely finitude in instantaneous exertion.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Structure:** 5 Criteria × 4 Marks Each

  | Criterion | Description of Required Performance | Typical Candidate Failure |
  | :--- | :--- | :--- |
  | **1. Conceptual grasp of AOT** | Accurately defines the Asymptotic Obligation Thesis as a continuous approach to a limit without a hard ceiling, distinguishing it from standard maximizing views. | Confuses AOT with standard utilitarianism or treats the asymptote as a reachable maximum cap. |
  | **2. Analysis of Moral Closure** | Identifies that the core problem is not exertion capacity but the inability to declare a moral action "complete" or satisfied. | Focuses on psychological burnout or physical exhaustion rather than the conceptual impossibility of closure. |
  | **3. The Regress Argument** | Explicitly articulates how the AOT generates an infinite regress of residual duties (Zeno-style) rather than solving the demand problem. | Asserts the regress exists but fails to explain why non-zero remainders prevent moral coherence. |
  | **4. Discreteness vs. Continuity** | Engages with the mismatch between continuous mathematical obligations and discrete human actions/decisions. | Ignores the ontology of action and treats agency as a fluid continuum identical to the math. |
  | **5. Adherence to Constraints** | Maintains focus on the logical structure of AOT without reverting to forbidden standard demandingness examples (e.g., drowning child). | Reverts to generic "over-demandingness" objections or Singer-style examples despite explicit prohibition. |
