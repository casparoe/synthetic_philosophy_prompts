  Notes on form: The octave's sensory focus (lines 1–8) enacts the pre-reflective engagement Williams defends, blocking the egoism charge. The volta (line 9) introduces theorist vocabulary as an intrusion, not a clarification, addressing the "silent thought" reply. The sestet's "neutral place" (line 13) models the view from nowhere, showing identity loss rather than demandingness.

  The water pulls the sleeve against my wrist,
  And cold invades the muscle of the thigh.
  I find the form I cannot bear to miss,
  And haul the breath of living through the sky.
  There is no pause within the tightening grip,
  No sense of distance to the land.
  I fix my eyes upon this certain slip,
  And drag the weight I recognise by hand.
  Then enters thought that licenses the reach,
  And asks if I'm allowed to save this one.
  It counts the stranger's death as my own breach,
  Since other hands must settle up the sum.
  I serve the total from this neutral place,
  And vanish from the action I embrace.

  Checking the draft: Line 6 originally used "measure," which risks implying the very calculation the octave must exclude; "sense" preserves the perceptual constraint. The couplet avoids declaring the theory false, focusing instead on the dissolution of the agent, which satisfies the accuracy constraint regarding Williams's integrity objection.

  Lines 1–8 defuse the egoism reply by showing non-comparative care.
  Line 9 defuses the "silent thought" reply by marking the thought as alienation.
  Lines 11–12 encode negative responsibility without normative judgment.
  Lines 13–14 defuse the demandingness reply by locating the cost in identity.
