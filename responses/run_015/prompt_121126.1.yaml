answer: |-
  Here is a complete, runnable lesson plan designed for your constraints. It prioritizes physical engagement over calculation and structures the "paradox" as a financial risk rather than a theoretical curiosity.

  ### **Preparation (Before Class)**

  **Materials Needed:**
  *   **Printed Sheets (16 copies):** Large circles (radius ~10cm) with a clearly printed **inscribed equilateral triangle** inside. The triangle should be bold.
  *   **Group Kits (3 Kits):**
      *   *Kit A (Endpoints):* A paper spinner (paperclip + pin) mounted on a printed protractor circle (0–360°).
      *   *Kit B (Radius):* A printed radius line on a card, a piece of string equal to the radius length with a sliding bead (or a knot tied blindly), and a right-angle tool (corner of a card).
      *   *Kit C (Area):* A small cup of dried beans or rice, and a transparency sheet with a grid of dots (optional, but dropping a bean is faster).
  *   **Currency:** 200 poker chips or cut-up paper squares ("Clubs").
  *   **Board Space:** Divide the whiteboard into three columns labeled **Group A**, **Group B**, **Group C**.

  **The "Know-It-All" Management:**
  Identify the students who already know Bertrand's Paradox. Pull them aside 2 minutes before class starts.
  *   **Script:** "You two know what's coming. Your job today is not to explain, but to audit. I'm assigning you as 'Compliance Officers.' You will rotate between groups in Phase 1 to ensure they follow the randomization rules exactly. In Phase 2, you will watch the 'House' to ensure no cheating. If you reveal the math early, you ruin the experiment for everyone. Can I trust you to stay silent?"

  ---

  ### **Phase 1: The Factory (25 Minutes)**

  **Goal:** Empirically discover that "random chord" yields different frequencies depending on the production method.

  **Setup:**
  Divide the 16 students into 3 groups (5, 5, 6 students). Assign each group a Kit (A, B, or C).
  *   **Group A (Endpoints):** Spin the spinner twice to get two angles. Mark these points on the circle rim. Draw the chord connecting them.
  *   **Group B (Radius):** Spin the spinner once to pick a radius angle. Slide the bead along the string (radius length) with eyes closed to pick a distance from the center. Draw the chord perpendicular to the radius at that point.
  *   **Group C (Area):** Drop a bean from 30cm height onto the circle. Where it lands is the *midpoint*. Draw the chord that has this point as its midpoint (perpendicular to the radius through that point).

  **The Rule (Crucial):**
  "Do not measure length with a ruler. Look at the **printed triangle** inside your circle.
  *   If your chord **cuts through** the inside of the triangle, mark it **LONG**.
  *   If your chord **misses** the triangle (stays in the outer segments), mark it **SHORT**."
  *(Geometric note: A chord is longer than the triangle side iff it passes closer to the center than the triangle's edges do.)*

  **Procedure:**
  1.  **Production (15 mins):** Each group must generate **30 chords**. Divide labor: one spins/drops, one draws, one records L/S.
  2.  **Pooling (5 mins):** Come to the board. Write total chords and total LONGs. Calculate the % together.
  3.  **Observation (5 mins):**
      *   Group A (Endpoints) should converge near **33% (1/3)**.
      *   Group B (Radius) should converge near **50% (1/2)**.
      *   Group C (Area) should converge near **25% (1/4)**.

  **Teacher Script (Do Say):**
  *   "Work fast. Precision matters less than following the method."
  *   "Don't discuss your percentages with other groups yet."
  *   (At the board): "Group A found 30%. Group B found 53%. Group C found 27%. You all made random chords on identical circles. Why are the numbers different?"

  **Teacher Script (Don't Say):**
  *   Do not say "Principle of Indifference."
  *   Do not say "One of you is wrong."
  *   Do not explain the geometry of why they differ yet.

  **Troubleshooting Phase 1:**
  *   *Sample Size Noise:* If Group A and C are too close (e.g., 30% vs 28%), point to Group B (50%). "Group B is clearly different from the others. Why is their 'random' different from Group A's 'random'?"
  *   *Cheating:* Your Compliance Officers will catch students drawing chords by hand without using the tools.

  ---

  ### **Phase 2: The Black Box Market (25 Minutes)**

  **Goal:** Experience the financial risk of undefined probability.

  **Setup:**
  *   Clear the boards. Collect the Kits.
  *   You (the Teacher) are now **The House**. You have a "Black Box" under your desk (use Kit B—the Radius method—as it is fastest for you to operate alone).
  *   Every student starts with **20 Chips**.
  *   **The Contract:** A ticket that pays **10 Chips** if the next chord is **LONG**. Pays **0** if **SHORT**.
  *   **The Market:** Students must write down a **Bid Price** (1 to 9 Chips) they are willing to pay for this ticket.
  *   **The Rule:** You (The House) will accept any bid. If the student bids 4, they pay you 4. You generate a chord. If LONG, you give them 10. If SHORT, you give them 0.
  *   They play **5 Rounds**.

  **Procedure:**
  1.  **Round 1:** "Write your price. Remember, you saw three different probabilities earlier. Which one is in my box?"
  2.  **Settle:** Generate the chord publicly. Pay out.
  3.  **Repeat:** 5 times.
  4.  **Tally:** Students count their remaining chips.

  **Teacher Script (Do Say):**
  *   "You have data from Phase 1, but you don't know which machine I'm using."
  *   "If you price too high, you go bankrupt. If you price too low, you miss profit."
  *   "You are not betting on the chord; you are betting on *my method*."

  **Teacher Script (Don't Say):**
  *   Do not reveal which method you are using.
  *   Do not tell them if their price was "fair."

  **Troubleshooting Phase 2:**
  *   *Bankruptcy:* If a student loses all chips, lend them 5 more "on credit" so they stay engaged.
  *   *The "50/50" Bias:* Most students will default to pricing at 5 Chips (50%). Since you are using Method B (50%), they will break even. This is fine. The point is the *anxiety* of not knowing. If you want more drama, use Method C (25%). Then the 5-Chip bidders will lose money rapidly. **Recommendation:** Use Method C (25%) to punish the "50/50 guess" and make the risk palpable.

  ---

  ### **Phase 3: The Information Market (15 Minutes)**

  **Goal:** Show that resolving the ambiguity requires specifying the process, not just gathering more data.

  **Setup:**
  *   Students keep their chip stacks.
  *   You offer two new opportunities before the next 3 rounds:
      1.  **Buy a Hint:** Pay 5 Chips to ask one Yes/No question about your method (e.g., "Do you spin twice?").
      2.  **Bet on the Method:** Pay 10 Chips to bet on which Group (A, B, or C) method you are using. If correct, win 30 Chips.

  **Procedure:**
  1.  Allow 3 minutes for trading/questions.
  2.  Run 3 more chord rounds with the new information.
  3.  Reveal the method (e.g., "I was Group C").

  **Teacher Script (Do Say):**
  *   "Did buying the hint help you price the ticket better?"
  *   "Did knowing the method solve the disagreement from Phase 1?"
  *   "In Phase 1, everyone was right. In Phase 2, everyone was at risk. Why?"

  ---

  ### **Debrief & The "No Answer" Objection (10 Minutes)**

  **Goal:** Connect the game to the philosophical problem and address the "sloppy experiment" critique.

  **1. The Board Summary:**
  Draw three columns: **Object**, **Process**, **Probability**.
  *   Object: "A random chord." (Ambiguous)
  *   Process: "Spin twice," "Slide bead," "Drop bean." (Specific)
  *   Probability: 1/3, 1/2, 1/4. (Determinate)

  **2. Addressing the "Sloppy Experiment" Critique:**
  *   *Student Question:* "This was just a badly specified experiment. If you had just told us the method at the start, there would be no paradox. So isn't the answer just 'specify the method'?"
  *   *Your Response:* "Exactly. But notice what you did in Phase 2. When I *didn't* specify the method, you didn't say 'There is no probability.' You guessed. You priced at 5 chips. You acted *as if* there was an answer.
  *   "The paradox isn't that math breaks. It's that in real life, we are often in Phase 2. We are asked 'What is the chance of war?' or 'What is the chance this stock goes up?' There is no spinner for that. We pretend there is a 'Method A' when there isn't one. This activity shows that 'random' is not a property of the *thing*, it's a property of the *story* about how the thing was made."

  **3. Addressing "Why not just say there is no answer?":**
  *   *Student Question:* "Why don't we just say the probability is undefined?"
  *   *Your Response:* "Because 'undefined' is not a useful number for a bet. If I offer you a bet, you *must* price it to decide whether to play. Saying 'undefined' forces you to make a choice anyway—usually a default choice like 50/50. The lesson is to recognize when you are making that default choice without knowing the method. The answer isn't 'none,' it's 'relative to the model.' In physics, we solve this by measuring the initial conditions. In philosophy, we solve it by admitting we chose a model."

  **4. Predictable Failure Points & Fixes:**
  *   **Failure:** The frequencies in Phase 1 don't separate (e.g., all groups get ~40%).
      *   **Fix:** Acknowledge the noise. "The data is messy. But look at the *methods*. Group B slid a bead. Group A spun twice. Even if the numbers are close today, the *mechanism* is different. If we did 1,000 trials, they would separate. The risk in Phase 2 is that you don't know which mechanism I have."
  *   **Failure:** The "House" (You) leaks the method.
      *   **Fix:** If you accidentally hint, own it. "I slipped. Notice how your betting changed immediately? That proves the value of the information."
  *   **Failure:** Students treat Phase 2 as pure gambling luck.
      *   **Fix:** In the debrief, ask: "Did anyone change their price after Round 1? Why?" (They should have updated based on outcomes). "If you were updating based on outcomes, you were trying to deduce the Method. That proves the Method is the hidden variable."

  ### **Final Teacher Note**
  You cannot stage the *single-case* ontological problem (i.e., "This specific chord exists, what is *its* probability?") because the game relies on frequencies.
  **How to handle this in the last 2 minutes:**
  "Today we solved this by repeating the experiment. But imagine I only draw *one* chord, then destroy the machine. You have to bet on that single chord. You can't count frequencies anymore. You only have your belief about which machine I *might* have used. That is where the paradox lives: not in the math of the circles, but in the math of your ignorance. Today you saw that 'ignorance' costs chips."
