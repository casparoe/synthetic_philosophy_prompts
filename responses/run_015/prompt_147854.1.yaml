answer: |-
  # DECISION TREE: THE COFFEE CAUSATION PROBLEM
  **Instructions:** Start at Node 1. Answer **Yes**, **No**, or **Mu** ("The question is badly posed / depends"). Follow the arrow. Smart undergrads only; no jargon without definition.

  ---

  ### NODE 1: REALITY
  **Case:** You say "I wanted coffee." Your friend says "Neurons X fired."
  **Q:** Does "wanting coffee" refer to a *real property* of you, or is it just a loose way of talking about behavior?
  *   **No (It's just talk):** → **ELIMINATIVISM**
  *   **Yes (It's real):** → Go to Node 2.
  *   **Mu (It's real but only relative to a description):** → Go to Node 2 (mark as "Deflationary").

  ### NODE 2: IDENTITY (The Hardware Swap)
  **Case:** We replace your neurons with silicon chips that function identically. You still reach for the cup.
  **Q:** Is the "wanting" *identical* to the physical hardware state, or could it exist on different hardware?
  *   **Yes (Identical):** → **REDUCTIVE IDENTITY VIEW**
  *   **No (Distinct/Multiple Realizable):** → Go to Node 3.
  *   **Mu (Category error to compare):** → **QUIETIST** (Skip to Node 8 to confirm).

  ### NODE 3: COMPLETENESS
  **Q:** If we know the full physical state of your brain and arm, is the movement *fully determined* by physics alone, without needing the "want"?
  *   **No (Physics needs help):** → **INTERACTIONIST / EMERGENTIST**
  *   **Yes (Physics suffices):** → Go to Node 4.
  *   **Mu (Determinism is false):** → Go to Node 4 (mark as "Probabilistic").

  ### NODE 4: CAUSATION TYPE
  **Q:** Does causation require *energy transfer/pushing* (Production) or just *changing the outcome* (Difference-making)?
  *   **Production:** → Go to Node 5.
  *   **Difference-making:** → **INTERVENTIONIST / COMPATIBILIST**
  *   **Mu (Both/Contextual):** → Go to Node 5 (mark as "Pluralist").

  ### NODE 5: GRAIN / PROPORTIONALITY (The Jitter Box)
  **Case:** A device intercepts your motor signal. It keeps the *goal* (lift cup) but randomizes the *exact muscle twitch trajectory*.
  **Q:** Did your "want" cause the *exact trajectory* or just the *goal achievement*?
  *   **Exact Trajectory:** → **EPHENOMENALISM** (Mental is too coarse to cause specifics).
  *   **Goal Achievement:** → **NON-REDUCTIVE PHYSICALIST** (Causal Drain).
  *   **Mu (Depends on how you describe the effect):** → **QUIETIST** (Confirm at Node 8).

  ### NODE 6: OVERDETERMINATION
  *(Reach here if Distinct + Complete + Production)*
  **Q:** If both the neurons and the want are sufficient causes, is the effect "systematically overdetermined" (like two assassins shooting at once)?
  *   **Yes (It's a bug/glitch):** → **[WARNING: THE EMPTY CELL]** *See Box Below.*
  *   **No (It's a feature):** → **SYSTEMATIC OVERDETERMINATION VIEW**
  *   **Mu (Not two causes, one cause described twice):** → **REDUCTIVE IDENTITY** (Return to Node 2).

  > **⚠️ WARNING: THE EMPTY CELL**
  > **Position:** Distinct Mental + Complete Physics + Mental Causation + No Overdetermination.
  > **Status:** **INCOHERENT.**
  > **Consequence:** If you stand here, you are claiming the mental does work that the physical didn't need done, without double-counting. You will be accused of "magic." You must move to **Epiphenomenalism** (mental does no work) or **Overdetermination** (mental does redundant work).

  ### NODE 7: GROUNDING
  **Q:** Does the mental *make* the physical happen (horizontal), or does the physical happen *in virtue of* the mental (vertical/constitutive)?
  *   **Horizontal (Cause):** → Return to Node 6.
  *   **Vertical (Grounding):** → **GROUNDING VIEW**
  *   **Mu (Same thing):** → **REDUCTIVE IDENTITY**.

  ### NODE 8: COHERENCE (Quietism Check)
  **Q:** Can we answer "Did the mind cause the body?" without specifying *who is asking* or *what for*?
  *   **Yes:** → Return to previous commitment.
  *   **No:** → **QUIETIST / PRAGMATIST**
  *   **Mu:** → **QUIETIST / PRAGMATIST**

  ---

  ### ⚠️ FLAGGED INDISTINGUISHABLE LEAVES
  1.  **Grounding vs. Epiphenomenalism:** Both predict the exact same behavior (physical does the work).
      *   *Splitter Question:* "Is the relation between mind and brain explanatory (grounding) or inert (epiphenomenal)?"
      *   *Defense:* Only metaphysicians care; behavioral science cannot tell them apart.
  2.  **Interventionist vs. Reductionist:** Both say "Yes, the mental caused it."
      *   *Splitter Question:* "If we freeze the physical state but change the mental description, does the cause change?"
      *   *Defense:* Reductionist says No (cause is physical); Interventionist says Yes (cause is description-relative).

  ---

  ### BOTTOM NOTES: THE ANNOYANCE INDEX
  *(For each leaf: The sentence that makes opponents groan + The case where they start hedging)*

  1.  **Reductive Identity:** "The want *just is* the firing." / *Hedges on:* Multiple realizability (silicon brains).
  2.  **Eliminativism:** "There are no wants, only neurons." / *Hedges on:* Explaining their own decision to attend the reading group.
  3.  **Epiphenomenalism:** "The mind is a shadow that doesn't push." / *Hedges on:* Why evolution kept the mind if it does nothing.
  4.  **Non-Reductive (Drain):** "Causation drains to the bottom, but the top matters." / *Hedges on:* Exactly *how* the top matters if physics is complete.
  5.  **Systematic Overdetermination:** "Every action has two sufficient causes." / *Hedges on:* Why this doesn't violate parsimony (Occam's Razor).
  6.  **Interventionist:** "Causation is about changing outcomes, not pushing stuff." / *Hedges on:* Cases where you can't intervene (e.g., the Big Bang).
  7.  **Interactionist:** "The mind adds energy to the system." / *Hedges on:* Where the extra energy comes from (conservation of energy).
  8.  **Grounding:** "The physical realizes the mental, it doesn't cause it." / *Hedges on:* Explaining temporal sequence (decision before action).
  9.  **Quietist:** "You're asking the wrong question." / *Hedges on:* When forced to take responsibility for their own actions.
