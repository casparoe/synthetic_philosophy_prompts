      *   *Idea:* "Under what condition would you switch frameworks?" or "What breaks your chosen system?"
      *   *Selection:* "What specific outcome would have to happen for you to abandon your chosen framework?" (Tests if they understand the cost of their choice).

  7.  **Identifying Topics to Avoid:**
