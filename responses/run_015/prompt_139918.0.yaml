answer: |-
  Here is a battle plan for a 25-minute session. Time is your enemy; clarity is your only weapon.

  ### 1. The Carrier Example: Counseling Slots
  **Verdict:** Keep it. It is superior to the Trolley Problem for this audience.
  **Why:** The Trolley Problem is about *instantaneous physical harm*. Your example is about *systemic resource allocation and privacy*. This forces the coders to think about data features and the non-coders to think about fairness, not just death.

  **How to tune it:**
  To make the philosophical conflict sharp, you must define the AI's capabilities specifically.
  *   **The Capability:** The AI can scan all student digital footprints (emails, LMS activity, cafeteria spending) to predict who *needs* counseling most and who will *benefit* most.
  *   **The Utilitarian Move:** Scan everything. Prioritize students with the highest "suicide risk" or "grade improvement potential." Ignore privacy. The goal is **minimize aggregate suffering**.
  *   **The Deontological Move:** Refuse to scan private data. Allocate slots via a lottery or first-come-first-served. The goal is **respect individual rights/dignity**, even if aggregate suffering is higher.

  **What the example must NOT have:**
  *   Do not make it about life-or-death immediately. Keep it about "access." If you make it about suicide immediately, everyone becomes a utilitarian because the stakes are too high. Keep it about "mental health support" generally, then mention the edge cases later.
  *   Do not make the AI buggy. Assume the AI works perfectly. The conflict must be ethical, not technical.

  ---

  ### 2. The Run of Show (25 Minutes)

  **0:00 – 5:00: The Setup (No Definitions Yet)**
  *   Describe the Counseling AI scenario (as tuned above).
  *   Ask for a show of hands: "Who lets the AI scan the data to save more kids?" (Utilitarians) vs. "Who bans the scan even if kids suffer?" (Deontologists).
  *   **Crucial Move:** Do not label them yet. Just acknowledge the split.
  *   *Why:* This prevents the "I know this definition" boredom. It grounds the theory in the intuition they just voiced.

  **5:00 – 10:00: The Frameworks (Labeling the Intuitions)**
  *   Now introduce the terms.
  *   **Utilitarianism:** You voted for *outcomes*. The moral value is in the result (total welfare).
  *   **Deontology:** You voted for *constraints*. The moral value is in the action itself (respecting rights/process), regardless of the result.
  *   **Head off Misconception #2 (Asimov):** Explicitly say: "Deontology is not a checklist of 'Thou Shalt Nots.' It is a refusal to treat people as variables in an equation. In this example, it's not that 'Scanning is Rule #4.' It's that a student's mind is not input data."

  **10:00 – 15:00: The Coder Trap (Utility Functions)**
  *   **Head off Misconception #1 (Coders):** This is your most important technical intervention.
  *   Say this: "Coders in the room: You are thinking a 'Utility Function' makes the AI a Utilitarian. That is wrong."
  *   Explain: You can write a loss function that penalizes rule violations infinitely. A deontological AI *maximizes* adherence to duty.
  *   **The Distinction:** Utilitarianism is about *what* you maximize (welfare). Machine Learning is about *how* you optimize (gradients). You can use gradient descent to be a deontologist.
  *   **Head off Misconception #3 (The Hybrid):** Someone will ask: "Why not just add a 'privacy penalty' to the reward function?"
  *   **The Counter:** "If it's a penalty, it's tradeable. If the mental health crisis is bad enough, the AI will 'pay' the privacy penalty. That is Utilitarianism. Deontology means the action is *forbidden*, not just expensive."

  **15:00 – 20:00: The Friend's Argument (Auditability & Robustness)**
  *   **Where it goes:** Here, as the "Engineering Reality Check."
  *   **Is it deep?** Yes. It is the argument for *Rule Utilitarianism* or *Constraint-Based Alignment*.
  *   **How to frame it:** "My friend argues that even if you care about consequences, you should build a Deontological system. Why?"
  *   **The Point:** Optimization is opaque. If you tell an AI 'Maximize Health,' it might lobotomize everyone (they are very healthy then). If you tell it 'Do Not Violate Privacy,' that is auditable.
  *   **The Takeaway:** Deontology might not be 'morally true,' but it is **safer for black-box systems**. Rules generalize to edge cases better than reward models do.

  **20:00 – 23:00: Synthesis**
  *   Bring it back to the Counseling AI.
  *   Utilitarian: Better aggregate outcomes, high risk of abuse/creep.
  *   Deontological: Safer, fairer process, accepts that some students will fall through the cracks.
  *   There is no solution. There is only a choice of what risk you accept.

  **23:00 – 25:00: The Closing Question**
  *   See below.

  ---

  ### 3. The Closing Question
  Do not ask "Which is better?" Do not ask "What would you build?"

  **Ask this:**
  > "What specific outcome would have to happen for you to abandon your chosen framework?"

  *   **Why this works:**
      *   If the Utilitarian says, "I'd stop if it violated a right," they admit rights have absolute weight (they are actually deontologists).
      *   If the Deontologist says, "I'd stop if 100 kids died," they admit consequences override rules (they are actually utilitarians).
      *   It forces them to find the limit of their own logic.

  ---

  ### 4. What to Flat-Out Refuse (Scope Creep)
  You have 25 minutes. If anyone brings these up, park them in a "Parking Lot" on the whiteboard and promise to discuss them *never* (or offline).

  1.  **The Trolley Problem:** It triggers reflex answers. Tell them, "We are doing systemic allocation, not split-second physical switches."
  2.  **AI Sentience:** "Whether the AI *feels* guilt is irrelevant. We are programming its *decisions*, not its soul."
  3.  **Meta-Ethics:** "Is morality real?" or "Who decides the rules?" (This is political science, not normative ethics).
  4.  **Specific Architectures:** Do not let coders drift into "We could use RLHF vs. SFT." Keep it on the *objective*, not the *training method*.

  ### Summary of Misconception Interventions
  *   **Coders (Utility = Utilitarianism):** Intervene at **10:00**. Distinguish *Objective* (Welfare vs. Duty) from *Method* (Optimization).
  *   **Newbies (Deontology = Asimov):** Intervene at **5:00**. Frame it as "Constraints on Optimization" not "Checklists."
  *   **Hybrid (Price the Rights):** Intervene at **12:00**. Explain that pricing a right makes it tradeable, which collapses the system back into Utilitarianism.

  Good luck. Stick to the clock. The Counseling Example is your anchor; don't let them drift away from it.
