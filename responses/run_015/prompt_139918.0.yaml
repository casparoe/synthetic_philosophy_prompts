          *   Address specific misconceptions (Coders: Utility Max = Utilitarian; Newbies: Deontology = Asimov's Rules; Hybrid: Consequences + Rights).
          *   Evaluate friend's argument (Rules for unauditability/robustness).
          *   Provide one closing question to test understanding.
          *   Provide topics to avoid (scope creep).
      *   **Time Limit:** 25 minutes (very tight).

  2.  **Evaluate the "Carrier Example" (Counseling Slots):**
      *   *Pros:* High stakes, relatable to students, involves resource allocation (classic utilitarian territory), involves privacy/dignity (classic deontological territory).
      *   *Cons:* Could get bogged down in data privacy specifics rather than ethical frameworks. Might feel too bureaucratic.
      *   *Verdict:* It's actually stronger than the Trolley Problem because it's systemic rather than instantaneous. It forces a choice between *optimizing outcomes* (most students helped) vs. *respecting constraints* (no profiling based on sensitive data, equal access regardless of predicted success).
      *   *Requirements for a Carrier Example:* Needs to show a conflict where maximizing the "good" clearly violates a "rule/right," and following the "rule" clearly leads to a worse aggregate outcome. It needs to be non-lethal (to avoid Trolley fatigue) but significant.
      *   *Decision:* Keep the counseling example, but refine the tension.

  3.  **Address Misconceptions & Sequence:**
      *   *Misconception 1 (Coders):* "Utility Function = Utilitarianism."
          *   *Fix:* Distinguish between *mathematical* utility (RLHF, loss minimization) and *moral* utility (hedonic calculus, welfare). A deontologist can have a utility function that penalizes rule violations infinitely.
      *   *Misconception 2 (Newbies):* "Deontology = Hard-coded Rules (Asimov)."
          *   *Fix:* Frame deontology as *constraints on optimization*, not just a checklist. It's about *why* the rule exists (duty/rights), not just the rule itself.
      *   *Misconception 3 (Hybrid):* "Just add rights to the consequence calc."
          *   *Fix:* Show how this collapses back into utilitarianism (rights become tradeable commodities).
      *   *Friend's Argument:* "Rules for unauditable systems."
          *   *Verdict:* This is deep. It's the "Rule Utilitarianism" or "Alignment via Constraints" argument. It bridges the gap. It belongs near the end as a synthesis/practical application.

  4.  **Drafting the Plan (25 Minutes is Brutal):**
      *   *0-5 min:* Hook & Definitions (via the Example, not abstract theory).
      *   *5-15 min:* The Conflict (Utilitarian view vs. Deontological view on the example).
      *   *15-20 min:* Addressing Misconceptions (The "Coder Trap" & The "Asimov Trap").
      *   *20-23 min:* The Friend's Argument (Auditability/Safety).
      *   *23-25 min:* Closing Question & Wrap.

  5.  **Refining the Content:**
      *   *Opening:* Don't start with definitions. Start with the Counseling AI.
      *   *The Turn:* Show how a Utilitarian AI would run it (maximize aggregate mental health improvement). Show how a Deontological AI would run it (fair access, privacy, no profiling).
      *   *The Coder Trap:* Explicitly state: "A loss function isn't a moral philosophy." You can optimize for rule-adherence.
      *   *The Asimov Trap:* Deontology isn't just "Don't kill." It's "Don't use people as means." In the counseling example: Don't scan private chats to predict suicide risk, even if it saves lives.
      *   *The Hybrid:* If you price a right, you can buy it out. That's utilitarianism.
      *   *Friend's Point:* This is "Instrumental Deontology." We use rules because we can't trust the optimization process. Put this in the "Why it matters for engineers" section.

  6.  **Developing the Closing Question:**
      *   Needs to avoid "Which is better?"
