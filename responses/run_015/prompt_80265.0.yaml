answer: |-
  Here is the analysis of your four games, the verification of your numbers, and the resolution of the tension between them.

  ### 1. Verification of Game 2 (The Capped Game)

  Your figure of roughly **$21** is correct. Here is the breakdown.

  In the classic game, the expected value is infinite because the payout $2^n$ grows exactly as fast as the probability $(1/2)^n$ shrinks. Each term in the sum contributes exactly $1$ dollar to the expected value ($2^n \times \frac{1}{2^n} = 1$). Since there are infinite terms, the sum is infinite.

  In the capped game, you cut off the terms where the payout exceeds $1,000,000.
  *   $2^{19} = 524,288$
  *   $2^{20} = 1,048,576$

  So, for flips $n=1$ through $n=19$, you are paid the full $2^n$. For any flip $n \ge 20$, you are paid the cap of $1,000,000.

  The expected value (EV) is calculated as:
  $$ \text{EV} = \sum_{n=1}^{19} \left( \frac{1}{2^n} \times 2^n \right) + \sum_{n=20}^{\infty} \left( \frac{1}{2^n} \times 1,000,000 \right) $$

  The first part sums to **$19** (since each of the 19 terms equals 1).
  The second part is the probability of reaching the 20th flip or later multiplied by the cap. The probability of getting 19 tails in a row is $(1/2)^{19}$, or 1 in 524,288.
  $$ \text{Cap Contribution} = \frac{1,000,000}{524,288} \approx 1.91 $$

  **Total EV $\approx$ $19 + $1.91 = $20.91.**

  **Why is it so small?**
  It feels like it should be higher because a million dollars is a lot of money. However, in this game, a million dollars is *astronomically* unlikely to occur. The "infinite" value of the classic St. Petersburg game is not driven by the likely outcomes (which are small); it is driven entirely by the impossibly rare outcomes. By capping the payout, you have removed the only source of the infinite value. You are left with a game that pays out small amounts almost every time, resulting in a modest expected value.

  ### 2. The Trade-Off: Simplicity vs. Accuracy

  You have identified the central conflict in decision theory. You must choose between a **Simple Principle** (Expected Value) and a **Sophisticated Principle** (Expected Utility).

  #### Option A: The Simple Principle (Expected Value Maximization)
  *   **The Principle:** A rational agent should be willing to pay any amount up to the Expected Dollar Value of a gamble. Risk is irrelevant; only the long-run average matters.
  *   **Which Verdicts This Saves:** This principle validates your judgment of **Game 4**. The EV is $100, and you pay $90. This is consistent.
  *   **Which Verdicts This Forces You to Abandon:** This principle declares your judgments on **Game 1, Game 2, and Game 3** to be irrational.
      *   Specifically, **Game 3** is the fatal blow to this principle. The EV is a finite, ordinary $100. There is no infinity to blame. If you adhere to this principle, you *must* admit that refusing to pay $100 for Game 3 is a mathematical error. You are leaving "free money" on the table.
  *   **The Cost:** To keep this principle, you must accept that your intuition about risk is a cognitive bug. You must agree that a 50% chance of winning $2 and a 50% chance of winning $200 (Game 4) is fundamentally the same as a 99% chance of winning less than $10 and a 1% chance of winning thousands (Game 3), provided the averages match.

  #### Option B: The Sophisticated Principle (Expected Utility Maximization)
  *   **The Principle:** Proposed by Daniel Bernoulli in 1738 specifically to solve this paradox. A rational agent maximizes Expected *Utility*, not Expected *Dollars*. Utility is a function of wealth, $U(W)$, that exhibits **diminishing marginal utility**. This means the first $1,000 you win is worth more to your well-being than the second $1,000. Mathematically, the function is concave (e.g., logarithmic).
  *   **Which Verdicts This Saves:** This principle validates **all four** of your verdicts.
      *   **Games 1, 2, & 3:** Because the utility function is concave, the massive payouts in the rare "tail" events contribute very little to your expected *utility*. You value the likely small wins more than the unlikely huge wins. This explains why you value Game 3 at $20 despite its $100 EV. The risk of walking away with almost nothing outweighs the mathematical average.
      *   **Game 4:** The distribution is tight. There is no massive skew. The utility of the $200 win is not discounted heavily because it isn't an astronomically rare event. Thus, your willingness to pay stays close to the dollar value.
  *   **The Cost:** You must abandon the idea that a dollar is always worth a dollar. You must accept that value is subjective and depends on your current wealth and the specific distribution of risk.

  ### 3. The Honest Recommendation

  If you want a principle that describes how humans actually behave and how prudent humans *should* behave in one-off scenarios, you must choose **Option B (Expected Utility)**.

  If you choose the Simple Principle (Option A), you are forced to label your judgment on **Game 3** as wrong. Given that Game 3 has a finite EV and highly skewed risk, most decision theorists agree that your intuition (paying $20) is actually the rational one, and the Expected Value calculation is the misleading metric for a single play.

  **The Verdict:** To maintain consistency across all four games without calling yourself irrational, you must adopt **Expected Utility Maximization**.

  ### 4. Application to the Final Scenario

  **The Scenario:**
  *   **You:** Hold a sure $10,000. Offered a ticket (50% chance +$10,000, 50% chance +$0).
  *   **Stranger:** Holds $0. Offered the identical ticket.
  *   **Your Intuition:** You would pay *less* for the ticket than the stranger.

  **Does the Principle Capture This?**
  **Yes.** The Principle of Expected Utility with diminishing marginal utility explains this difference precisely through the concept of **wealth-dependent valuation**.

  Here is how the math works under this principle:
  Value is not determined by the dollar amount of the ticket, but by how much that ticket improves your *life* (utility).

  1.  **For the Stranger ($0 wealth):** Winning $10,000 is a transition from subsistence (or nothing) to security. The marginal utility of those first $10,000 is extremely high. In a logarithmic utility model, the jump from $1 to $10,000 is massive.
  2.  **For You ($10,000 wealth):** Winning an *additional* $10,000 moves you from $10,000 to $20,000. While this is a gain, the *utility* gained from the second $10,000 is less than the utility gained from the first $10,000. This is the definition of diminishing marginal utility.

  Because the ticket provides more "well-being units" (utility) to the stranger than to you, the stranger's **Certainty Equivalent** (the cash value they assign to the ticket) is higher.

  Therefore, under the Expected Utility principle, it is perfectly rational for the wealthier person to pay *less* for a gamble with the same expected dollar value. The principle captures your intuition by acknowledging that the value of money is contextual, not absolute.
