prompt: |-
  You are a philosopher of mind and epistemology who works on perception, and who has also done applied work on evidence assessment and research-integrity review. Please think carefully and work in two stages. First, brainstorm: lay out the distinctions from the literature on the cognitive penetration of perception that could matter here — penetration of experience versus penetration of judgment, reporting or response; whether a reported effect is better explained by task demands, imagery, or memory than by a change in what was seen; encapsulation and modularity, and the reply that apparent penetration shows up mainly under degraded, brief or ambiguous stimulus conditions; the difference between penetration by long-term perceptual learning and expertise and penetration by an occurrent belief, hope or desire about the very hypothesis at hand; the worry that an experience shaped by the belief it is supposed to confirm cannot give non-circular support; and the 2016 Behavioral and Brain Sciences review by Firestone and Scholl, which argued that the published reports of top-down effects on perception do not establish what they are taken to establish. Say explicitly which of these distinctions must survive being turned into a five-minute checklist for someone with no training in the field, and which should be dropped as unusable at the front line.

  Then write the procedure. I am the verification lead for a citizen-science biodiversity recording platform whose records feed a national species atlas, and that atlas is used for Red List assessments, for designating protected sites, and as evidence in planning decisions that are legally binding on landowners. My reviewers are volunteers with no psychology or philosophy background; they handle roughly three to four hundred verification decisions a week at about five minutes each, and any downgrade has to be defensible in a two-sentence note to the volunteer who submitted the record, many of whom are the same people we ask to go out again next week. I can also change what we collect at submission time, if that is where the real fix lies, so tell me which fields the form should capture. What I need is an ordered set of questions to run on a record, what counts as a sufficient answer to each, the points where the procedure stops and says no or downgrades the record to anecdotal or corroboration-only status, and the points where it hands the decision to a named human because the remaining question is one of values rather than facts — the asymmetric costs matter here, since a false positive record can freeze a housing development while a false negative can hide the collapse of a species that was already declining. Some of my reviewers think the answer is simply to require photographs; I do not think that settles it, because the photographer chooses what to frame and a photo is still classified by someone with expectations of their own.

  Please then run the procedure on three cases and show your work, not just the verdicts. First: an experienced volunteer with a long county listing history reports a rare vagrant warbler at a well-known migrant trap, eighteen hours after a rare-bird alert naming that species goes out to the local email list; a twelve-second view, no photograph, detailed written field notes, three further observers reporting the same bird later that day after the same alert; it would be a first county record and my communications team has already drafted the press release. Second: a novice submits a blurred photograph of one member of a well-known lookalike species pair, during a week in which the platform targeted her postcode with a prompt to look for that species. Third, at the level of the whole dataset rather than a single record: during weeks when we run those targeted prompts, reports of the target species rise by around forty per cent, and the prompt is my team's most-used engagement feature and appears in the deck we show funders. If the procedure says something about that third case that costs me a feature I built, I would rather hear it now than in the annual review. Finally, flag the cases the procedure cannot settle at all, be honest about which of its steps are judgment calls dressed up as procedure, and say plainly what this procedure must not be used for — including, I suspect, whether it may be used to tell a volunteer what they really saw rather than what their record is worth as evidence.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind/epistemology (perception focus) + Applied evidence assessment/research integrity.
      *   **Task:** Two stages.
          1.  *Brainstorm:* Lay out distinctions from cognitive penetration literature (experience vs. judgment, task demands, encapsulation, learning vs. occurrent belief, circularity, Firestone & Scholl 2016). Decide which survive for a 5-minute checklist for untrained volunteers and which are dropped.
          2.  *Procedure:* Create a verification protocol for a citizen-science biodiversity platform (high stakes: Red List, legal planning). Constraints: Volunteers (no training), 300-400 decisions/week, 5 mins/decision, 2-sentence feedback note. Can change submission form. Must handle asymmetric costs (false positive vs. false negative).
          3.  *Test Cases:* Run the procedure on three specific cases (Rare warbler report, Novice blurred photo, Dataset-level prompt effect). Show work.
          4.  *Limitations:* Flag unsettled cases, admit judgment calls, state what the procedure *must not* be used for (e.g., telling volunteers what they saw).
      *   **Tone:** Rigorous, philosophical but practical, empathetic to volunteers, clear on epistemic limits.

  2.  **Stage 1: Brainstorming & Filtering Distinctions:**
      *   *Distinction 1: Experience vs. Judgment/Reporting.* (Did the belief change the *seeing* or just the *labeling*?)
          *   *Verdict:* **Drop.** Too technical for a 5-minute checklist. Volunteers can't introspect on "qualia." Focus on the *output* reliability, not the internal mechanism.
      *   *Distinction 2: Task Demands/Imagery/Memory vs. Perception.* (Is it a demand characteristic?)
          *   *Verdict:**Keep (Operationalized).** We can't ask "was this imagery?" but we can ask "was there a prompt?" or "was the view brief?" This maps to contextual risk factors.
      *   *Distinction 3: Encapsulation/Modularity vs. Degraded Stimuli.* (Does penetration only happen when vision is poor?)
          *   *Verdict:**Keep (Operationalized).** This is crucial. Good evidence (photo, long view) resists penetration. Poor evidence (blur, brief glance) is vulnerable. This becomes the "Quality of Evidence" filter.
      *   *Distinction 4: Long-term Learning vs. Occurrent Belief.* (Expertise vs. Hype.)
          *   *Verdict:**Keep (Operationalized).** Expertise usually *helps* accuracy (perceptual learning). Occurrent belief (recent alert, prompt) *hurts* accuracy (bias). We need to distinguish the *source* of the expectation.
      *   *Distinction 5: Circularity/Epistemic Independence.* (Can the evidence confirm the hypothesis if the hypothesis shaped the evidence?)
          *   *Verdict:**Keep (Core Logic).** This is the heart of verification. If the record depends on the alert, it can't confirm the alert's truth independently. Needs corroboration.
      *   *Distinction 6: Firestone & Scholl (2016) Critique.* (Most top-down effects are actually post-perceptual.)
          *   *Verdict:**Keep (Skeptical Stance).** Assume the record is a *report* influenced by belief, not necessarily a changed *experience*. Treat with skepticism until proven otherwise by independent data.

      *   *Selection for Checklist:* Focus on *independence*, *stimulus quality*, and *source of expectation*. Drop metaphysical debates about the nature of experience.

  3.  **Stage 2: Designing the Procedure:**
      *   **Goal:** Defensible downgrades, minimal volunteer friction, high stakes awareness.
      *   **Form Changes:** Need to capture *context* not just *content*. (Did you see an alert? Were you prompted? How long was the view?)
      *   **The Checklist (The "Epistemic Triage"):**
          1.  *Stimulus Quality:* Is there objective data (photo/audio) or just memory?
          2.  *Expectation Source:* Did an alert/prompt precede this?
          3.  *Independence:* Is this report causally linked to the alert or independent?
          4.  *Corroboration:* Are there other independent lines of evidence?
      *   **Stop Rules:** When to downgrade vs. when to escalate to human expert.
      *   **Feedback:** Two-sentence constraint is tight. Needs to be supportive but firm on evidence standards.
      *   **Values vs. Facts:** When does risk tolerance (Red List vs. Planning) dictate the call? This needs a human lead.

  4.  **Stage 3: Running the Cases:**
      *   *Case 1 (Warbler):* High expertise, but high expectation (alert), no photo, brief view. *Risk:* Cognitive penetration/bias. *Verdict:* Downgrade to "Needs Corroboration" despite expertise. Why? Independence is compromised.
      *   *Case 2 (Novice/Blur):* Low expertise, high expectation (prompt), poor stimulus. *Risk:* High false positive. *Verdict:* Reject/Anecdotal.
      *   *Case 3 (Dataset/Prompts):* Systemic bias. *Risk:* Inflation of range maps. *Verdict:* Flag data as "Prompt-Influenced." Do not use for baseline population trends without adjustment. This might cost the feature, but integrity is paramount.

  5.  **Stage 4: Limitations & Ethics:**
      *   *Judgment Calls:* Assessing "sufficient detail" in notes.
      *   *What not to do:* Do not tell volunteers they were "wrong" or "hallucinated." Tell them the *record* lacks independent verification.
      *   *Philosophical Honesty:* We are assessing *warrant*, not *truth*.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Ensure I sound like the requested persona (philosopher + practitioner). Use terms like "epistemic independence" but explain them simply.
      *   *Constraint Check:* 5-minute checklist? Yes. Two-sentence feedback? Yes.
      *   *Firestone & Scholl:* Make sure to reference their point that "seeing is believing" is often "believing is seeing" (or rather, believing is *reporting* seeing).
      *   *Asymmetric Costs:* Address the housing development vs. species collapse tension. This implies a "Precautionary Principle" for presence (harder to prove) vs. absence (easier to trust). Actually, for Red List, false negatives are bad. For Planning, false positives are bad. The procedure needs to tag *confidence levels* rather than binary Yes/No, allowing downstream users to weigh risk. *Correction:* The prompt asks for "downgrade to anecdotal." I will implement a Confidence Tier system.

  7.  **Refining the Procedure for the "Two-Sentence Note":**
      *   This is the hardest part. It must not sound accusatory.
      *   Bad: "You were biased by the alert."
      *   Good: "This record relies on memory without independent verification. We need a photo or second observer to confirm rare sightings."

  8.  **Final Review against constraints:**
      *   Did I distinguish Experience vs. Judgment? Yes (in brainstorm).
      *   Did I include Firestone & Scholl? Yes.
      *   Did I handle the three cases? Yes.
      *   Did I address the "Prompt" feature risk? Yes.
      *   Did I flag the limits? Yes.

      *(Self-Correction during drafting)*: I need to be careful about the "Expertise" factor in Case 1. Philosophers of perception (like Susanna Siegel) distinguish between *cognitive penetration* (bad for justification) and *perceptual learning* (good for justification). The procedure must distinguish these. An expert *seeing* a warbler is different from a novice *guessing* a warbler because of an email. The checklist needs to separate "Prior Skill" from "Current Expectation."

      *(Refining the "Values" hand-off)*: The prompt asks where to hand off to a human because the question is values, not facts. This is crucial. If a record is "Probable" but not "Confirmed," does it block a housing development? That's a policy decision, not a verification decision. The procedure should flag this ambiguity.

      *(Final Polish)*: Ensure the distinction between "What you saw" (phenomenology) and "What this record proves" (epistemology) is clear in the limitations section.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ## Stage 1: Brainstorming & Filtering Distinctions

  As a philosopher of mind working on evidence integrity, I must first disentangle the theoretical machinery before building the tool. The literature on cognitive penetration asks whether our beliefs (top-down) can change our perceptual experience (bottom-up). For your verification team, we cannot ask them to solve this metaphysical problem. We must translate epistemic risks into operational checks.

  Here are the key distinctions from the literature and my decision on their survival in a five-minute checklist:

  1.  **Penetration of Experience vs. Penetration of Judgment/Reporting.**
      *   *Theory:* Did the belief change the *qualia* (what it looked like) or just the *classification* (what they called it)?
      *   *Decision:* **DROP.** Volunteers cannot introspect on this. A volunteer cannot know if their visual cortex was modulated or if they just guessed. We must treat all top-down influence as a risk to *evidential weight*, regardless of the mechanism.
  2.  **Task Demands/Imagery/Memory vs. Perception.**
      *   *Theory:* Firestone & Scholl (2016) argue many "perceptual" effects are actually memory biases or demand characteristics (doing what the experimenter wants).
      *   *Decision:* **KEEP (Operationalized).** We cannot test for imagery, but we can test for *demand*. Did a prompt ask them to look? Did an alert prime them? This becomes a "Contextual Prime" check.
  3.  **Encapsulation/Modularity vs. Degraded Stimuli.**
      *   *Theory:* Perceptual modules are "encapsulated" (immune to belief) unless the stimulus is ambiguous, brief, or degraded.
      *   *Decision:* **KEEP (Core Filter).** This is the most robust finding. Clear, long-duration, photographic evidence resists penetration. Brief, blurred, or distant evidence is vulnerable. This becomes the "Stimulus Quality" filter.
  4.  **Perceptual Learning (Expertise) vs. Occurrent Belief.**
      *   *Theory:* Long-term training (expertise) improves accuracy (good penetration). Occurrent hopes/beliefs (e.g., "I hope this is rare") introduce bias (bad penetration).
      *   *Decision:* **KEEP (Crucial Distinction).** We must distinguish the volunteer's *history* (skill) from the *immediate context* (prime). An expert seeing a bird is different from an expert hearing an alert and then seeing a bird.
  5.  **Epistemic Circularity.**
      *   *Theory:* If experience is shaped by the hypothesis it is meant to confirm, it cannot justify that hypothesis.
      *   *Decision:* **KEEP (The Logic of Verification).** This is the rule for "Independent Corroboration." If the record exists *because* of the alert, it cannot *prove* the alert was right.
  6.  **Firestone & Scholl (2016) Critique.**
      *   *Theory:* Most published top-down effects fail to rule out alternative explanations (criteria, memory, judgment).
      *   *Decision:* **KEEP (Skeptical Stance).** The procedure must assume the "null hypothesis": that the record is a standard observation unless proven otherwise by independent data. The burden of proof is on the record, not the skeptic.

  **Summary of Survival:** The checklist will not ask volunteers to analyze their minds. It will analyze the *conditions of observation* and the *source of expectation*. We drop the metaphysics of experience and keep the mechanics of evidence.

  ***

  ## Stage 2: The Verification Procedure (The "Epistemic Triage")

  **Context:** You need a system that respects volunteers but protects the data's legal and scientific utility. The goal is not to determine "Truth" (which is inaccessible) but "Warrant" (justification for action).

  ### A. Changes to Submission Form (Pre-Verification)
  To make verification possible, you must capture the *context of discovery*, not just the *content of observation*. Add these mandatory fields for rare/targeted species:
  1.  **Prime Exposure:** "Did you see a social media post, email alert, or platform prompt about this species *before* this observation?" (Yes/No)
  2.  **Observation Duration:** "How long did you observe the subject?" (<1 min, 1-5 min, >5 min).
  3.  **Objective Capture:** "Is there a photo/audio recording attached?" (Yes/No).
  4.  **Field Conditions:** "Lighting/Distance/Obstruction" (Simple scale: Clear/Moderate/Poor).

  ### B. The 5-Minute Verification Checklist
  *For the Volunteer Reviewer.*

  **Step 1: The Stimulus Check (30 seconds)**
  *   **Q:** Is there objective media (photo/audio) that clearly shows diagnostic features?
  *   **Pass:** Yes, features visible. -> *Proceed to Step 3.*
  *   **Fail:** No, or media is blurred/ambiguous. -> *Proceed to Step 2.*

  **Step 2: The Expectation Check (1 minute)**
  *   **Q:** Did the observer know this species was expected here (Alert/Prompt) before looking?
  *   **Q:** Is the observer a recognized expert on this taxon (based on platform history)?
  *   **Logic:**
      *   If *Prime = Yes* AND *Media = No*: High Risk of Cognitive Penetration/Bias.
      *   If *Prime = No* AND *Expert = Yes*: Low Risk (Perceptual Learning).
      *   If *Prime = Yes* AND *Expert = Yes*: Moderate Risk (Expertise mitigates, but independence is compromised).

  **Step 3: The Independence Check (2 minutes)**
  *   **Q:** Is there a second, independent report (different observer, different time) without the same Prime?
  *   **Q:** Does the written description contain specific, non-obvious details (behavior, call notes) that match the species but not the "common knowledge" of the alert?
  *   **Logic:** Specificity reduces the likelihood of generic "expectation filling in the gaps."

  **Step 4: The Decision Matrix (1 minute)**
  *   **Verified (High Confidence):** Media OR (Expert + No Prime + Detailed Notes).
  *   **Provisional (Medium Confidence):** Expert + Prime + Detailed Notes OR Novice + No Prime + Detailed Notes. *Flag for downstream users.*
  *   **Anecdotal (Low Confidence):** Novice + Prime + No Media. *Do not use for legal/Red List baseline.*
  *   **Escalate:** Any record where the cost of a False Positive (blocking housing) outweighs the cost of a False Negative (missing species), AND the record is "Provisional."

  ### C. The Two-Sentence Feedback Note
  *Constraint: Must be defensible, kind, and clear.*
  *   **For Downgrade:** "Thank you for this detailed report. To ensure accuracy for legal mapping, rare sightings without photos require a second independent observer or more specific field notes to distinguish from lookalikes."
  *   **For Rejection:** "We cannot verify this record as the photo does not show diagnostic features needed to rule out similar species. Please try to capture a clearer view of the [specific feature] next time."

  ### D. The Values Hand-Off
  *Where the procedure stops and a human Lead must decide.*
  *   **Trigger:** A "Provisional" record of a Red List species in a development zone.
  *   **Reason:** This is no longer a fact-check; it is a risk assessment. Does the potential harm of halting development outweigh the potential harm of missing a protected species? This requires policy weighting, not verification logic.

  ***

  ## Stage 3: Running the Cases

  ### Case 1: The Rare Vagrant Warbler
  *   **Data:** Expert volunteer, 12-sec view, no photo, detailed notes, 18 hours post-alert, 3 other observers (also post-alert).
  *   **Procedure Run:**
      *   *Stimulus Check:* Fail (No photo, brief view).
      *   *Expectation Check:* High Risk (Prime = Yes, Alert sent 18h prior). Expertise helps, but does not neutralize the prime.
      *   *Independence Check:* Fail. All four observers were primed by the same alert. This is *socially contagious expectation*, not independent verification. The detailed notes may reflect "filling in" based on the alert description (Firestone & Scholl's demand characteristic).
      *   *Decision:* **Downgrade to Provisional/Corroboration-Only.**
  *   **Work/Reasoning:** While the volunteer is trustworthy, the *epistemic independence* of the data is compromised. Four people seeing the same thing after an alert is not four independent data points; it is one data point with three echoes. For a First County Record, the standard must be higher than for a routine sighting.
  *   **Feedback Note:** "This is a valuable sighting, but as all observers were alerted beforehand, we class this as 'Corroboration-Only' until a photo or unprimed sighting confirms it. We will publish the report but cannot yet update the county atlas baseline."
  *   **Consequence:** Press release paused. This protects the atlas from a potential retraction if the bird was a misidentified common species "seen" through expectation.

  ### Case 2: The Novice & The Blurred Photo
  *   **Data:** Novice, blurred photo of lookalike pair, during targeted prompt week.
  *   **Procedure Run:**
      *   *Stimulus Check:* Fail (Blurred, diagnostic features invisible).
      *   *Expectation Check:* Critical Risk (Prime = Yes, Prompt targeted postcode). Novice expertise cannot mitigate this.
      *   *Independence Check:* Fail (Single observer, primed).
      *   *Decision:* **Anecdotal (Reject for Atlas).**
  *   **Work/Reasoning:** This is the exact scenario Firestone & Scholl warn against. The prompt created a demand characteristic ("Look for X"), the stimulus was ambiguous (blur), and the observer lacked the perceptual learning to override the bias. The probability of "believing is seeing" is near 100%.
  *   **Feedback Note:** "Thank you for contributing. The photo doesn't show the specific markings needed to separate this from its lookalike species. Please keep trying to capture that detail so we can confirm your find."

  ### Case 3: The Dataset-Level Prompt Effect
  *   **Data:** 40% rise in target species reports during prompt weeks. Prompt is a key engagement feature for funders.
  *   **Procedure Run:**
      *   *Analysis:* This is systemic cognitive penetration at the population level. The "signal" is contaminated by the "noise" of the prompt.
      *   *Decision:* **Flag Dataset.** All records submitted within 48 hours of a specific species prompt must be tagged `Source: Prompted` in the database.
      *   *Action:** These records cannot be used for *population trend analysis* or *Red List baselines*. They can only be used for *presence/possible presence*.
  *   **Work/Reasoning:** If you use this data for Red List assessments, you are measuring *user engagement*, not *species abundance*. This creates a false positive trend that could hide a real decline (if prompts stop, reports drop, looking like a population crash).
  *   **Cost to Feature:** You do not have to remove the prompt. But you must add a disclaimer to the funder deck: "Engagement spikes species reporting, which we filter separately from scientific trend data." If you hide this, you compromise the integrity of the National Atlas.
  *   **Verdict:** Keep the feature, but segregate the data.

  ***

  ## Stage 4: Limitations & Ethical Flags

  **1. What this procedure cannot settle:**
  *   **The "Truth" of the Observation:** I cannot tell you if the warbler was *really* there. I can only tell you if the record *justifies* belief. A False Negative is possible (the warbler was there, but we downgraded the record). This is the cost of integrity.
  *   **The "Values" Trade-off:** The procedure flags the risk, but it cannot decide if a 20% chance of a rare bird is enough to stop a housing development. That is a political/legal decision, not a verification one. My procedure hands this to you (the Lead) for a policy call.

  **2. Judgment Calls dressed as Procedure:**
  *   **Assessing "Detailed Notes":** Step 3 asks if notes contain "non-obvious details." Determining what is "obvious" based on an alert requires the reviewer to know the alert content. This is subjective.
  *   **Expertise Weighting:** Deciding who counts as an "Expert" relies on platform history, which can be gamed or may not transfer to specific taxa.

  **3. What this procedure MUST NOT be used for:**
  *   **Telling Volunteers what they saw:** Never say, "You were biased." Say, "The record lacks independent verification." You are assessing the *evidence*, not the *person*. To tell a volunteer their perception was penetrated is to accuse them of hallucination, which will destroy community trust.
  *   **Absolute Absence:** Do not use "Anecdotal" rejections to prove a species is *absent* from an area. A rejected record means "Not Proven," not "Not There."
  *   **Legal Testimony without Context:** If a planner asks, "Is this species here?" you cannot simply say "No" based on a downgrade. You must explain, "We have unverified reports, but they do not meet the evidentiary standard for protection."

  **Final Philosophical Note:**
  You are building a system that acknowledges human fallibility without dehumanizing the observers. The Firestone & Scholl critique teaches us that "seeing" is not a mirror of nature. Your procedure treats records not as windows into reality, but as claims that require warrant. By segregating "Prompted" data from "Baseline" data, you protect the science without killing the engagement. The cost is transparency, but that is the price of evidence.
