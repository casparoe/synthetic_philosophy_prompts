      Dear [Name],

      What a splendid collision you are proposing for your column. You have grasped Neurath's commitments with considerable precision, particularly regarding the distinction between the specific rules of Isotype and the broader philosophical stance on representation. To answer your central question immediately, I suspect the flatten the curve chart is less a violation of Neurath's project than a vindication of his underlying philosophy, even if it flagrantly disregards his specific technical rules. Let us walk through the wreckage to see what remains standing.

