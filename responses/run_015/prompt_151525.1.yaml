      However, the question of logic remains thorny. Neurath insisted that a picture language is only a helping language, unable on its own to say no, to say if, or to say is. He believed words were required for negation, conditionals, and imperatives. The chart depicts a counterfactual, the tall peak, and a desired state, the low hump, which implies a conditional structure: if we do not act, this happens; if we do, that happens. Yet strictly speaking, the image only shows two lines. The imperative flatten it came from the caption and the campaign. In this sense, Neurath is confirmed; the picture alone might have been read as a comparison of two past events without the textual instruction. Yet, millions read an obligation straight off the curve. The visual hierarchy made the tall peak look dangerous and the low hump look safe. The picture did the heavy lifting of moral valuation, even if the text supplied the verb. This suggests Neurath was too cautious about the semantic power of images. He feared images would be read as natural truths rather than constructed arguments, but in this case, the constructed nature of the argument was what made the imperative legible. The picture did not just unite; it commanded.

