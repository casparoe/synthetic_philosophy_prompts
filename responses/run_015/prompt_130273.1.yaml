answer: |-
  Your circuit model is not a bad habit; it is a precise model for *positive* causation. In hydrology and instrumentation, a cause is a transfer of energy or mass. A pump that is off transfers nothing. A pump that is missing transfers nothing. Physically, the result is identical: no flow.

  The confusion you are encountering is not about physics. It is about two different groups trying to use physical language to settle moral and legal accounts. The barrister wants to treat "cause" like you do (energy transfer). Your granddaughter wants to treat "cause" as "responsibility for outcome."

  Here is the menu of claims hidden inside those slogans. I have broken them down by what they assert, their truth status, and whether they deliver the conclusion the speaker wants.

  ### The Menu of Claims

  **1. The "No Energy Transfer" Claim**
  *   **The Claim:** A cause must be an event that releases energy or moves matter. An omission is the absence of an event. Therefore, an absence cannot move matter or release energy.
  *   **Status:** **True (Physically).** This matches your hydrology. Nothing happens when nothing happens.
  *   **Platitude or Substantive?** Substantive definition of physical causation.
  *   **Does it help the Barrister?** **Yes.** If causation requires physical force, the staff did nothing physically to the sister-in-law. The fall and the bleeding were the physical causes.
  *   **Does it help the Granddaughter?** **No.** It exonerates the scroller. They exerted no force on the victim.

  **2. The "Counterfactual Dependence" Claim**
  *   **The Claim:** $X$ is a cause of $Y$ if, had $X$ not occurred (or had the omitted act been performed), $Y$ would not have occurred (or would have occurred differently).
  *   **Status:** **Defensible.** This is the standard test for "but-for" causation. It treats the *expectation* of the act as part of the causal field.
  *   **Platitude or Substantive?** Substantive. It expands causation beyond physical push/pull to include dependency.
  *   **Does it help the Barrister?** **No.** If the bell had been answered, she likely wouldn't have died *then*. The omission is a "but-for" cause of the death at that time.
  *   **Does it help the Granddaughter?** **Yes.** If the scroller had intervened (or alerted authorities), the beating might have stopped. Their inaction is a condition for the beating continuing.

  **3. The "Duty-Bound Omission" Claim**
  *   **The Claim:** An omission is only a cause if there was a pre-existing obligation to act. Without the duty, the non-act is just background noise; with the duty, the non-act becomes a causal factor.
  *   **Status:** **False (as causation), True (as liability).** This smuggles a moral/legal conclusion into a causal premise. It says "cause" = "culpable non-act."
  *   **Platitude or Substantive?** Substantive, but category-error prone.
  *   **Does it help the Barrister?** **Yes, if he defeats the duty.** He argues there was no duty, therefore the omission was not a "relevant" cause.
  *   **Does it help the Granddaughter?** **Yes, if she establishes the duty.** She argues we have a human duty to intervene, therefore the scrolling is a causal failure.

  **4. The "Moral Equivalence" Claim**
  *   **The Claim:** Allowing a thing to happen is morally identical to making a thing happen. Therefore, linguistically and practically, we should treat "not acting" as "acting."
  *   **Status:** **False (Physically), Defensible (Morally).** It is a metaphorical stretch treated as a literal claim.
  *   **Platitude or Substantive?** Substantive moral claim.
  *   **Does it help the Barrister?** **No.** It creates liability for inaction.
  *   **Does it help the Granddaughter?** **Yes.** It is her entire point. It collapses the distinction between the beater and the scroller.

  ***

  ### Addressing Your Three Constraints

  **(a) The Circuit Model: Standby Pump vs. Removed Pump**
  Your intuition is correct: there is a difference between a system designed to run that doesn't (standby pump) and a system where the component is gone (removed pump).
  *   **Which readings respect this?** Claim 1 ("No Energy Transfer") collapses the difference. To a physicist, both are just "no flow."
  *   **Which readings distinguish them?** Claim 3 ("Duty-Bound") respects this. The "standby pump" represents a system design where an action was *expected* (a duty exists). The "removed pump" represents a system where no action was expected (no duty).
  *   **Verdict:** Your circuit model is fine for physics, but for the barrister and granddaughter, the "System Design" (the contract of care or the social contract) matters more than the circuitry. The barrister wants to argue the pump was never part of the design (no duty). The granddaughter argues the pump is part of the human design (universal duty).

  **(b) The Timing Issue: Death vs. Death *Then***
  You noted your sister-in-law was dying soon anyway. This is the "pre-emption" problem.
  *   **The Barrister's Problem:** He needs Claim 1 ("No Energy Transfer"). If he admits Claim 2 ("Counterfactual Dependence"), he admits the staff caused her to die *on Tuesday instead of Friday*. In law, causing death *then* is still causing death. He cannot afford to admit the omission changed the timing, because liability attaches to the change.
  *   **The Reality:** Under Claim 2, the omission is a cause of the *timing*, which is legally treated as a cause of the *event*.
  *   **Does a reading survive this?** Only Claim 1 survives it. If omissions *cannot* be causes, then it doesn't matter if she died Tuesday or Friday; the staff didn't cause either. But Claim 1 is physically true and legally useless in negligence cases. The law *rejects* Claim 1.
  *   **Conclusion:** The barrister is using a physical truth (Claim 1) to win a legal argument that operates on Counterfactual Dependence (Claim 2). He is speaking physics to a jury that is judging liability.

  **(c) The "Duty" Smuggle**
  You suspected the word "omission" might have a duty baked into it. You are right.
  *   **Descriptive "Not-Doing":** "I did not drink water." (No duty implied).
  *   **Normative "Omission":** "I omitted to file the tax return." (Duty implied).
  *   **The Trap:** If "omission" implies duty, then saying "The omission caused the death" is not a causal premise; it is a conclusion that says "They were responsible, and that responsibility resulted in death."
  *   **For the Barrister:** He must insist "omission" means descriptive "not-doing." If he admits the normative definition, he admits the duty, and if he admits the duty, he loses the case.
  *   **For the Granddaughter:** She relies on the normative definition. She assumes the duty exists, so the "not-acting" is automatically an "omission" in the culpable sense.
  *   **Verdict:** You cannot use these slogans as premises in a causal argument. They are conclusions of a moral argument disguised as causal claims.

  ***

  ### A Better Model for Your Head

  The circuit model fails you here because circuits are descriptive; they don't have expectations. A better model for this specific problem is a **Levee System**.

  *   **The Water:** The natural course of events (gravity, illness, violence).
  *   **The Levee:** The intervention (staff response, citizen intervention).
  *   **The Breach:** The death/harm.

  **The Barrister's Argument:** "The water breached the levee. We did not *push* the water. We merely failed to reinforce the sandbags. The water caused the flood, not the missing sandbags." (Relies on Claim 1).

  **The Granddaughter's Argument:** "The levee exists to hold the water. If you see a hole and don't plug it, you flooded the town. Your standing there doing nothing *is* the flooding." (Relies on Claim 2 & 4).

  **The Hydrologist's Reality:** The water moved due to gravity. The sandbags did not move. But the *system failure* is the interaction of the water and the missing sandbags.

  ### Summary Recommendation

  1.  **The Barrister** is relying on **Claim 1 (No Energy Transfer)**. It is physically true but legally fragile. It gets him his conclusion only if the jury ignores how negligence law actually works (which relies on Claim 2).
  2.  **The Granddaughter** is relying on **Claim 4 (Moral Equivalence)**. It is physically false but morally potent. It gets her her conclusion only if the audience accepts her premise that we all have a duty to intervene (Claim 3).
  3.  **The "Duty" Question:** You are correct. Neither slogan works as a pure causal premise. They are both shorthand for "Who is responsible?"
  4.  **The Timing:** The barrister is in the weakest position here. Even if he proves omissions aren't "physical causes," the law treats "shortening life by an hour" as causing death. He needs the jury to accept physics over law.

  **Final Advice:** When you hear "Omission isn't causation," hear "I am not physically responsible." When you hear "Not acting is acting," hear "I am morally responsible." They are not arguing about the same thing.
