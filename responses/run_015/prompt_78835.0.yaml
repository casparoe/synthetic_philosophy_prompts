  # DECISION TREE: ALLAIS PREFERENCES AND THE INDEPENDENCE AXIOM

  **Root Commitment:** You acknowledge that in a choice between (A) a certain \$1 million and (B) a gamble offering a 10% chance of \$5 million, 89% of \$1 million, and 1% of nothing, you choose **A**. You further acknowledge that in a choice between (C) an 11% chance of \$1 million and (D) a 10% chance of \$5 million, you choose **D**.

  ---

  ### NODE 1: Normative Force (Money Pump)
  If a sequence of trades were constructed that exploited this preference pattern to extract money from you until you were bankrupt (a money pump), would you alter your choices to avoid the loss, or pay the loss to maintain your choices?
  *   **Alter choices:** → **LEAF 1**
  *   **Maintain choices:** → **NODE 2**

  ### NODE 2: Menu Dependence
  If a third option were added to the set that you would never choose, does your preference between the original two options change?
  *   **Yes:** → **LEAF 2**
  *   **No:** → **NODE 3**

  ### NODE 3: Reduction of Compound Lotteries
  Do you treat a two-stage chance process (e.g., drawing a ticket to win a ticket in a second urn) as identical to its mathematically reduced single-stage equivalent?
  *   **No:** → **LEAF 3**
  *   **Yes:** → **NODE 4**

  ### NODE 4: Domain Generality (Losses)
  If the "certain" outcome were a guaranteed loss (e.g., a fine) rather than a gain, would you still prefer the certain loss over the gamble in the first pair?
  *   **No:** → **LEAF 4**
  *   **Yes:** → **NODE 5**

  ### NODE 5: Domain Generality (Non-Money)
  If the outcomes were health states or lives saved rather than money, would you still exhibit this preference reversal?
  *   **No:** → **LEAF 4**
  *   **Yes:** → **NODE 6**

  ### NODE 6: Diachronic Authority
  Is the conflict primarily between what you plan to do before the uncertainty resolves and what you want to do when the moment of choice arrives?
  *   **No:** → **NODE 8**
  *   **Yes:** → **NODE 7**

  ### NODE 7: Diachronic Scope (Losses)
  Does your authority to bind your future self to a plan apply even when the outcomes involve certain losses?
  *   **No:** → **LEAF 5**
  *   **Yes:** → **NODE 7b**

  ### NODE 7b: Diachronic Scope (Non-Money)
  Does your authority to bind your future self to a plan apply even when the outcomes involve health or non-monetary goods?
  *   **No:** → **LEAF 5**
  *   **Yes:** → **LEAF 6**

  ### NODE 8: Counterfactual Sensitivity
  Does the value of the outcome you receive depend on how it compares to the outcome you *might* have received had you chosen differently?
  *   **Yes:** → **LEAF 7**
  *   **No:** → **LEAF 8**

  ---

  ### LEAF POSITIONS

  **LEAF 1: Error Theory**
  *   **Position:** Behavioral/Normative Error.
  *   **Least Comfortable Commitment:** You must dismiss your own strong intuitive preferences as cognitive mistakes subject to correction.

  **LEAF 2: Menu-Dependent Choice**
  *   **Position:** Context-Dependent Rationality.
  *   **Least Comfortable Commitment:** You accept that the value of an option is not intrinsic but changes based on the presence of irrelevant alternatives.

  **LEAF 3: Procedural Rationality**
  *   **Position:** Frame/Process Dependent.
  *   **Least Comfortable Commitment:** You must reject the principle that logically equivalent descriptions of risk should yield identical choices.

  **LEAF 4: Psychological Certainty Effect**
  *   **Position:** Domain-Specific Heuristic.
  *   **Least Comfortable Commitment:** You concede this is a general feature of human psychology rather than a defensible axiom-level commitment of rational choice.

  **LEAF 5: Unnamed (Partial Resolute Choice)**
  *   **Position:** Diachronic Binding (Domain Restricted).
  *   **Least Comfortable Commitment:** You claim the right to bind your future self only for monetary gains, treating losses or health as exempt from planning authority.
  *   **Note:** This combination is theoretically unoccupied; it is marked **Unnamed** because restricting diachronic authority to gains appears arbitrary and unattractive to theorists.

  **LEAF 6: Resolute Choice**
  *   **Position:** Diachronic Rationality.
  *   **Least Comfortable Commitment:** You must commit to ignoring your own current preferences at the moment of choice to honor a past plan.

  **LEAF 7: Regret Theory**
  *   **Position:** Non-Expected Utility (Emotional).
  *   **Least Comfortable Commitment:** You accept that rational choice can cycle (intransitive) because anticipated regret depends on the specific pairing of options.

  **LEAF 8: Rank-Dependent Utility**
  *   **Position:** Non-Expected Utility (Weighting).
  *   **Least Comfortable Commitment:** You must assign decision weights to probabilities that do not match their mathematical frequencies, violating stochastic dominance in edge cases.

  ---

  ### LOGICAL SPACE NOTES

  **Empty Combinations:**
  *   **Leaf 5 (Unnamed):** No prominent theorist occupies the position that diachronic binding is rational for monetary gains but not for losses or health. This space is empty not because it is logically incoherent, but because it is theoretically unattractive; if planning authority is a requirement of rationality, it should be domain-general.

  **Indistinguishable Leaves:**
  *   **Leaf 7 (Regret) and Leaf 8 (Rank-Dependent):** Given only the Allais cases provided in the Root, these two positions predict identical choices. The tree separates them via Node 8 (Counterfactual Sensitivity), which relies on the respondent's introspection about *why* they choose, not just the choice itself. Without access to the agent's mental states regarding forgone outcomes, these leaves are empirically indistinguishable using choice data alone.
