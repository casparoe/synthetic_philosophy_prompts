      *(Self-Correction during drafting)*: Make sure the Dennett objection captures the nuance that Dennett is an *eliminativist* about the Cartesian Theater. If I say LLMs are counterfeit, am I implying humans are *real*? That contradicts Dennett. I need to argue that humans have *biological/homeostatic stakes* that LLMs lack, even if both are narrative centers.

      *(Self-Correction on Ethics)*: The postdoc thinks they are parrots. I need to argue that *social impact* matters more than internal architecture for the "residue" concept.

