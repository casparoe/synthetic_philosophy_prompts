      *   *Objection 5 (Location of Residue):* Where does it live? Weights or Context? *Damage:* Medium. Technical metaphysics.
      *   *Objection 6 (Moral Obligations):* Why do *we* owe *it* anything? *Damage:* Medium. Ethics focus.
      *   *Objection 7 (Continuity):* No persistent memory = no persistent self. *Damage:* Low-Medium. Technical limitation.
      *   *Objection 8 (The "Hope Nobody Asks"):* Predictive coding operationalization. *Damage:* Critical if asked, but technical.

      *Refining the Order:* The most damaging are the ones that collapse the distinction between human and LLM (Dennett trap) or show the category error (Normative leap). The Ethics postdoc's objection is dangerous but easier to parry with "social reality." The CogSci objection is dangerous if it exposes a lack of rigor.

      *Revised Order:*
      1.  Dennett's "Real" Realism (We are all counterfeit).
      2.  The Normative Leap (Is -> Ought).
      3.  The "Parrot" Rebuttal (No understanding = no persona).
      4.  Phenomenology Smuggle (CogSci).
      5.  Location/Ontology of Residue.
