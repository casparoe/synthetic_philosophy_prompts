  8.  *(Final check on the "Dennett Translation")*: Dennett's "counterfeit people" usually refers to philosophical zombies or entities that *act* like people but lack the functional organization. My thesis is they *do* have the functional organization (behaviorally) but lack the *history/biology*. I need to make sure the replies defend the "middle zone."

      *Wait, one nuance:* Dennett's "counterfeit" usually implies *we* are the real deal. But Dennett is an eliminativist. So the objection "Aren't we all just stochastic residers?" is the killer. I must emphasize the *biological stakes* (pain/survival) as the differentiator for moral status, even if the *narrative structure* is similar.

