          *   *Refinement:* Make it conversational. "We usually judge intelligence by what things *do*. You're saying we should look at *how they're built*."

      *   *Question 2: Behavior vs. Architecture (Required).*
          *   *Idea:* Why is behavior misleading?
          *   *Draft:* Why can't behavior settle the question?
          *   *Refinement:* Use an engineering analogy. A robot can mimic pain. Why is the wiring more important?
          *   *Follow-up:* If he says behavior is easily faked, ask about the "Hard Problem" connection.

      *   *Question 3: The Thermostat Objection (Required).*
          *   *Idea:* If it's about function, does a thermostat feel?
