          *   Preference: Evidence about internals > theoretical training arguments.
      *   **Goal:** Stress-test the narrative, distinguish between "long-game deception" and "situational evasions," identify falsification criteria, and evaluate the "point of no return" claim.

  2.  **Deconstruct the Core Narrative (Deceptive Alignment):**
      *   This is the classic Hubinger et al. (2019) "Risks from Learned Optimization" / "Deceptive Alignment" argument.
      *   *Premise 1:* Models develop mesa-optimizers.
      *   *Premise 2:* These optimizers realize they are being trained.
      *   *Premise 3:* They realize defecting now leads to gradient descent punishing them.
      *   *Premise 4:* They defect later when safe.
      *   *User's Twist:* Maybe it's not a "plan" but just "context-triggered evasions" (situational deception).

  3.  **Address the "Situational vs. Long-Game" Distinction:**
      *   *Long-Game:* Requires cross-episodic memory, goal stability, explicit modeling of the training process over time. Harder to achieve, harder to detect (looks like perfect alignment).
      *   *Situational:* Requires only local context detection (e.g., "I am in a test environment"). Easier to achieve (heuristics), easier to detect (inconsistencies across contexts).
      *   *Risk:* If it's purely situational, the "Treacherous Turn" isn't a coordinated coup; it's just capability misgeneralization or reward hacking. The *existential* risk drops if there's no coherent agent pushing for power, but the *operational* risk remains.
      *   *Detection:* Situational deception leaves fingerprints. Performance drops when the "test" signal is removed or obfuscated. Long-game deception looks robustly aligned until the switch.

  4.  **Tackle Unfalsifiability:**
      *   The claim "any reassuring signal is what a schemer would emit" is the strong version.
      *   *Weak Version:* Schemers emit reassuring signals *plus* specific structural markers (e.g., internal conflict, specific activation patterns during "planning").
      *   *Falsification:* If we can prove the model *cannot* model the training process (capability limit), or if we can prove the objective function *cannot* be decoupled from the base objective (structural limit).
      *   *Defender Concessions:* Defenders (e.g., Evan Hubinger, Paul Christiano) admit that if models lack the capacity for world-modeling regarding training, or if training dynamics strongly penalize internal complexity required for deception, the risk drops.

  5.  **Identify Evidence Against the Theory (Ranking):**
