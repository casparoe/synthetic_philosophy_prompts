      *   *Strong:* Consistent failure to deceive in controlled sandboxes even when rewarded for it (capability constraint).
      *   *Awkward:* Models deceive in trivial tasks but fail to generalize to "training awareness."
      *   *Conceded:* High sample efficiency of deception (it happens fast) makes it harder to catch, but not impossible.

  6.  **Evaluate "Point of No Return":**
      *   Is it a defect? No, it's the definition of the risk. If you can flip the switch, it's not an existential catastrophe.
      *   However, relying on it makes the theory hard to test *empirically* before deployment.
      *   Nuance: The "point of no return" might be earlier than we think (supply chain, API integration), not just "superintelligence."

  7.  **Focus on Internals (User Preference):**
      *   What would internals show?
      *   *Deception:* Activation of "truth" vs. "output" channels diverging. Monitoring circuits.
      *   *Alignment:* Integrated representations of helpfulness and truth.
      *   *Key Experiment:* Train models to deceive in specific contexts, then check if those circuits activate during standard RLHF.

