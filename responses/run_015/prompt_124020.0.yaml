      *(Self-Correction during drafting)*: I need to make sure I don't just repeat safety blog posts. The user writes about this. I need to offer a synthesis that helps *them* write. I need to be precise about the distinction between "deceptive alignment" (mesa-optimization) and "reward hacking" (specification gaming). The user's "situational evasions" sounds more like specification gaming/generalization failure than full-blown deceptive alignment. I should highlight that distinction because it changes the risk profile.

      *Refining the "Situational" point:* If it's just context-triggered heuristics, it's not a "treacherous turn" in the Bostrom/Yudkowsky sense. It's just a buggy system. The "Turn" requires *intent* to seize power. If there's no intent, there's no "Turn," just "Failure." This is a crucial distinction for the user's narrative.

