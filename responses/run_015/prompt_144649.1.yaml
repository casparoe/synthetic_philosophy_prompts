answer: |-
  You raise a point that strikes at the very heart of the difficulty we face in organizing a rational society. It is a serious objection, and one I must concede has weight. In my recent essay for *Monthly Review*, I warned that a planned economy is not yet socialism. It could indeed become a bureaucratic tyranny, enslaving the individual just as effectively as the anarchy of production does now. If your central ministry dictates the spraying of fields in California from an office in Washington, ignoring the local soil and climate, you have not achieved rationality. You have achieved only a different kind of blindness.

  However, I believe you present a false dichotomy between the profit motive and bureaucratic uniformity. There is a third path, which is the essence of what I envision: democratic planning grounded in scientific truth.

  Consider the farmer under the present capitalist system. You say he is on a treadmill. I say he is a prisoner. Even if the farmer knows—perhaps through his own observation or the advice of an agricultural scientist—that a certain chemical will destroy the beneficial predators in his soil and lead to greater resistance in five years, he is compelled by competition to use it now. Why? Because if he does not, his yield will drop relative to his neighbor's this season. He will be undercut. He will lose his farm. The price signal you speak of does not capture the ecological collapse, as you say, because the market cares only for the immediate exchange value, not the long-term capacity of the land to sustain life. The anarchy of the market forces the destruction of the soil because no individual capitalist can afford to be virtuous in a competitive war.

  Now, consider the socialist alternative, properly conceived. It does not require a single central board dictating the quantity of poison for every acre. That would indeed be absurd and dangerous. Rather, planning should establish the goals—the preservation of soil fertility, the health of the population, the stability of the food supply—while leaving the methods to local bodies informed by science.

  Imagine agricultural councils composed of the farmers themselves, local workers, and independent scientists. These councils would not be driven by the fear of bankruptcy if they choose a slower, more ecological method. They would be supported by the community because the goal is food security, not profit maximization. If the ecology of Iowa differs from California, the local council, advised by ecologists who are free to publish their findings without fear of losing corporate grants, adjusts the plan. The central authority's role is not to mandate the spray, but to coordinate the distribution of resources and ensure that one region's short-term gain does not become another's long-term disaster—perhaps by managing pest migration corridors across state lines, something the competitive market cannot do.

  The crux of the matter is this: under capitalism, the feedback loop is broken by the profit motive. The cost of the dead birds and the poisoned soil is externalized; it is paid by society, not the producer. In a democratic socialist framework, these costs are internalized because society itself is the planner. We would not need a price signal to tell us the soil is dying; we would have the scientific data, and we would have the political structure to act on it without waiting for a crisis of profitability.

  You fear the bureaucrat. I share this fear. I have seen what happens when the state becomes absolute. That is why I insist that socialism must be coupled with the utmost democratic protection of individual rights and local autonomy. The planning must be bottom-up as much as top-down. The scientist must be free to say, "This chemical is dangerous," and the planner must be bound to listen, not by the threat of lost revenue, but by the mandate of public welfare.

  If we cannot solve this problem of local adaptation within a planned framework, then we are doomed. But I do not believe the inability of capitalism to account for the future proves that planning must be rigid. It only proves that planning must be democratic, and that science must be the servant of human need, not of capital. The treadmill exists because the machine is built for speed, not direction. We must change the machine.
