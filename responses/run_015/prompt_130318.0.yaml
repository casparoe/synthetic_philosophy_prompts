prompt: |-
  I'm running a 90-min workshop for heritage-studies grad students who haven't done much philosophy. Topic is Nietzsche's three uses and disadvantages of history for life — monumental, antiquarian, critical — but I don't want them to just list them. Don't explain the essay to me; plan how I'd teach it. What's the right dependancy order: which mode has to land first so the other two don't collapse into just 'good history vs bad history'? I want one carrying example that runs through the whole session — I'm debating between the restoration of a decommissioned power plant and the digital archiving of a defunct social network — tell me which one actually works and why the other breaks. Then the misconception map: I figure they'll take 'critical history' to mean being politically critical in the modern sense, 'antiquarian' as pure nostalgia, and 'monumental' as just propaganda. Say exactly where in the sequence I should head off each one. Finish with one check-for-understanding question that forces them to run all three modes on a new scenario — say a city council debating whether to demolish an old factory — and describe what a correct vs. wrong answer looks like. Keep it practical, no bibliography or further readings, and don't ask me to cite specific page numbers.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Audience:** Heritage-studies grad students (practitioners, likely focused on preservation, archives, museums, policy) with little philosophy background.
      *   **Topic:** Nietzsche's *On the Use and Disadvantage of History for Life* (three modes: Monumental, Antiquarian, Critical).
      *   **Constraint 1 (Goal):** Don't just have them list the modes. Avoid "good vs. bad history."
      *   **Constraint 2 (Dependency Order):** Determine which mode must be taught first to prevent collapse into binary thinking.
      *   **Constraint 3 (Carrying Example):** Choose between "Decommissioned Power Plant" vs. "Digital Archiving of Defunct Social Network." Explain why one works and the other breaks.
      *   **Constraint 4 (Misconception Map):** Address specific misconceptions (Critical = political critique, Antiquarian = nostalgia, Monumental = propaganda). Specify *when* to head these off.
      *   **Constraint 5 (Check-for-Understanding):** One question applying all three modes to a new scenario (City Council demolishing old factory). Describe correct vs. wrong answers.
      *   **Constraint 6 (Format):** Practical, 90 mins, no bibliography, no page numbers.

  2.  **Determine the Dependency Order:**
      *   *Problem:* If I start with Monumental, they might think it's about "Great Men." If I start with Critical, they might think it's about "Cancel Culture." If I start with Antiquarian, they might think it's just "Hoarding."
      *   *Nietzsche's Logic:* The modes are responses to a fundamental need: *Life* needs history to act.
      *   *Strategy:* Start with **Antiquarian**. Why? Because it's the baseline of heritage work (preservation, respect for origins). It's the most intuitive for this audience.
      *   *Next:* **Monumental**. This builds on Antiquarian but adds *inspiration for action*. It moves from "preserving" to "emulating."
      *   *Last:* **Critical**. This is the hardest. It requires breaking the past to live in the present. It needs the other two established first so it doesn't look like mere destruction. It's the "release valve."
      *   *Wait, reconsider:* Nietzsche presents them as Monumental, Antiquarian, Critical. But for *teaching* to prevent the "good/bad" binary, the key is establishing that *all three are necessary but dangerous in excess*.
      *   *Better Order:* **Monumental -> Antiquarian -> Critical**.
      *   *Reasoning:* Monumental establishes the *purpose* (action/inspiration). Antiquarian establishes the *grounding* (roots/piety). Critical establishes the *limit* (judgment/breaking).
      *   *Actually, for Heritage Students:* They live in the Antiquarian mode naturally. If I start there, they get comfortable. Then I show them the limits (it becomes mummification). Then I introduce Monumental (it gives energy). Then Critical (it allows change).
      *   *Refined Order:* **Antiquarian (The Baseline) -> Monumental (The Spark) -> Critical (The Knife).**
      *   *Why?* Heritage students *are* antiquarians by trade. Validate their instinct first, then show its danger. Then show how Monumental uses that past for future action. Finally, show how Critical clears the ground when the past becomes a burden. This prevents "Critical" from looking like "Bad History" because it's framed as a necessary surgical tool, not just negation.
      *   *Wait, the prompt asks:* "Which mode has to land first so the other two don't collapse into just 'good history vs bad history'?"
      *   *Insight:* If Critical lands last, it looks like the "corrective." If Monumental lands first, it looks like the "goal."
      *   *Decision:* **Monumental** must land first. Why? Because Nietzsche's core thesis is "History for *Life*." Life implies action, striving, future-orientation. Monumental is the mode of *action*. If you start with Antiquarian, you start with *stasis*. If you start with Critical, you start with *destruction*. You need to establish that history serves a vital impulse (Monumental) before you show how we ground it (Antiquarian) or prune it (Critical).
      *   *Correction for Audience:* Heritage students care about *preservation*. Starting with Monumental might feel alien.
      *   *Re-evaluating the "Collapse" risk:* The risk is thinking Antiquarian/Monumental = Good, Critical = Bad (destructive). OR Critical = Good (progressive), Others = Bad (conservative).
      *   *Solution:* Start with **Antiquarian**. It's their home turf. But immediately pair it with its *danger* (mummification). Then introduce **Monumental** as the antidote to stagnation (inspiration). Then introduce **Critical** as the antidote to oppression by the past.
      *   *Actually, the strongest pedagogical move:* Start with the **Problem of Life**. History is a burden. Then introduce the three tools.
      *   *Let's stick to the prompt's specific constraint:* "Which mode has to land first?"
      *   *Argument:* **Monumental**. It defines the *telos* (end goal). History is for *doing*. Without the "doing," Antiquarian is just hoarding and Critical is just nihilism. You must establish that history serves *action* first.
      *   *Wait, looking at the Misconception Map:* Critical = Political Critique. If I teach Critical last, they will default to modern political critique.
      *   *Revised Plan:* **Antiquarian first.** It's the most concrete for heritage students. It anchors the session in their reality. *However*, to prevent the "Good/Bad" collapse, I must frame them as *physiological needs*, not moral categories.
      *   *Let's go with the prompt's specific logic:* "Which mode has to land first so the other two don't collapse?"
      *   *Answer:* **Monumental.** Why? Because it establishes the *function* of history (to inspire great deeds). If you start with Antiquarian, history becomes about *respecting the dead*. If you start with Critical, history becomes about *judging the dead*. Monumental makes history about *the living*. Once "Life/Action" is the metric, the other two make sense as supports or limits to that life.
      *   *Okay, I will argue for Monumental first.*

  3.  **Select the Carrying Example:**
      *   *Option A:* Restoration of a decommissioned power plant. (Physical, tangible, traditional heritage).
      *   *Option B:* Digital archiving of a defunct social network. (Intangible, data, modern, ephemeral).
      *   *Analysis:*
          *   Power Plant: Fits "Monumental" (industrial achievement), "Antiquarian" (preserving the bricks), "Critical" (acknowledging labor abuses/pollution). Very clear.
          *   Social Network: Fits "Antiquarian" (saving data), "Monumental" (harder? connecting to digital rights movements?), "Critical" (deleting toxic data).
      *   *The Break:* The Social Network breaks on **Monumental**. What "great deed" does a defunct social network inspire? It's hard to frame MySpace as a monument to human greatness without stretching. It feels more like evidence.
      *   *The Win:* The Power Plant works for all three.
          *   Monumental: Human ingenuity, powering a city.
          *   Antiquarian: The specific turbines, the local workers' stories.
          *   Critical: The pollution, the union busting, the need to tear it down to build housing.
      *   *Decision:* **Power Plant.** It's physically tangible, which helps philosophy novices grasp the abstract modes.

  4.  **Misconception Map & Timing:**
      *   *Critical = Political Critique:* Head this off when introducing Critical. Frame it as "judging to survive," not "judging to be right."
      *   *Antiquarian = Nostalgia:* Head this off during Antiquarian. Frame it as "piety/roots," not "longing."
      *   *Monumental = Propaganda:* Head this off during Monumental. Frame it as "inspiration for the self," not "imposing values on others."
      *   *Sequence:*
          1.  Intro (Life needs history).
          2.  Monumental (Address Propaganda risk here).
          3.  Antiquarian (Address Nostalgia risk here).
          4.  Critical (Address Political Critique risk here).
          5.  Synthesis.

  5.  **Check-for-Understanding (CFU):**
      *   *Scenario:* City Council debating demolishing an old factory.
      *   *Task:* Apply all three modes.
      *   *Wrong Answer:* Treating them as options to choose one (e.g., "We should use Critical history to demolish it"). Or treating them as Good/Bad (e.g., "Antiquarian is bad preservation").
      *   *Right Answer:* Showing the tension. Monumental says "Keep it to inspire innovation." Antiquarian says "Keep it to honor the workers." Critical says "Destroy it because it binds us to a polluted past." The answer must show how a heritage professional balances these *simultaneously* for the sake of the city's *life*.

  6.  **Drafting the Plan (90 mins):**
      *   0-10: Intro (History as burden/tool).
      *   10-30: Monumental (Power Plant as Inspiration).
      *   30-50: Antiquarian (Power Plant as Home/Roots).
      *   50-70: Critical (Power Plant as Chain/Burden).
      *   70-80: Synthesis (The Health Metaphor).
      *   80-90: CFU & Wrap.

