      *If I teach Monumental first:* "History is for great action."
      *Then Antiquarian:* "But you need roots to act."
      *Then Critical:* "But sometimes roots strangle you."
      *This flows well. It prevents Critical from being the "villain."*

      *Wait, let's look at the Misconception timing again.*
      *Monumental = Propaganda.* I need to emphasize that Monumental is for *the actor's own soul*, not for mass indoctrination.
      *Antiquarian = Nostalgia.* Emphasize it's about *gratitude*, not wishing to live in the past.
      *Critical = Political.* Emphasize it's about *breaking a chain to live*, not moral scoring.

      *Refining the Example Choice:*
      *Why Social Network breaks:* It lacks the "Monumental" capacity for this audience. It's too ephemeral to feel like a "Monument." It feels like "Data." Heritage students deal with *place* and *object* primarily. The Power Plant is safer.

      *Refining the CFU:*
      *Scenario:* Demolishing an old factory.
      *Wrong:* "Critical history says demolish, Antiquarian says keep." (This treats them as opposing policy votes).
      *Right:* "A healthy heritage approach uses Antiquarian to document the workers, Monumental to repurpose the structure for community ambition, and Critical to acknowledge the environmental harm so we don't repeat it, potentially allowing partial demolition." It shows the *integration*.

  7.  **Final Review against Constraints:**
      *   90 mins? Yes.
      *   No philosophy background? Keep jargon low.
      *   Dependency order explained? Yes.
      *   Example choice justified? Yes.
      *   Misconception map timing? Specific.
      *   CFU with correct/wrong answers? Yes.
      *   No bibliography/page numbers? Yes.

      *Self-Correction on Dependency Order:* I'm second-guessing "Monumental First." For heritage students, "Antiquarian" is their job. If I start with Monumental, they might disengage. However, the prompt asks what order prevents the *conceptual collapse*. Conceptually, Monumental sets the *purpose*. If I start with Antiquarian, they think Heritage = Preservation. Then Monumental looks like "using history." Then Critical looks like "breaking history." This reinforces the "Good (Preservation) vs Bad (Breaking)" binary.
      *If I start with Monumental:* Heritage = Action. Then Antiquarian = Grounding that action. Then Critical = Clearing obstacles for action. This keeps "Life/Action" as the central metric. I will stick with Monumental First for the *conceptual integrity*, even if it's harder. I will bridge it by acknowledging their field is often perceived as Antiquarian, but Nietzsche argues it *must* be Monumental to be alive.
      *Actually, a hybrid approach:* Start with the *Problem* (History is heavy). Then introduce Monumental as the *Solution* (History as fuel). This lands Monumental first conceptually.

      *Wait, one more check:* "Which mode has to land first so the other two don't collapse into just 'good history vs bad history'?"
      *If I teach Critical last (standard), it looks like the "advanced/correct" mode.*
