answer: |-
  # Workshop Plan: Nietzsche for Heritage Practitioners (90 Minutes)

  ## 1. The Dependency Order (The "Why" Before the "What")
  **Start with Monumental History.**

  **Reasoning:** If you start with *Antiquarian*, you validate the students' default instinct (preservation), making *Critical* history look like destruction (bad). If you start with *Critical*, you frame history as a tool for judgment, making *Antiquarian* look like naive hoarding (bad).

  By starting with **Monumental**, you establish Nietzsche's core metric immediately: **History is for Life (Action).**
  *   **Monumental** sets the goal: History exists to inspire future deeds.
  *   **Antiquarian** becomes the necessary soil: You need roots to grow, but only to support the action.
  *   **Critical** becomes the necessary pruning: You cut branches only when they stop the tree from growing.

  This order prevents the "Good vs. Bad" collapse because all three are framed as physiological needs for a living culture, not moral choices between "preserving" (good) or "destroying" (bad).

  ---

  ## 2. The Carrying Example
  **Selection:** **The Restoration of a Decommissioned Power Plant.**
  **Reject:** The Digital Archiving of a Defunct Social Network.

  **Why the Power Plant Works:**
  It is physically visceral and contains inherent tension.
  *   *Monumental:* It represents human ingenuity and the power that built the city.
  *   *Antiquarian:* It holds the specific bricks, turbines, and local labor stories.
  *   *Critical:* It is a source of pollution, union-busting, or obsolete technology that actively harms the present.
  *   *Result:* Students can feel the weight of all three modes on a single object.

  **Why the Social Network Breaks:**
  It fails the **Monumental** test for this audience. It is difficult to frame a defunct social network (e.g., MySpace) as a "monument" that inspires great future deeds without stretching the definition into absurdity. It defaults quickly to Antiquarian (data saving) or Critical (privacy/ethics), losing the triad balance. It feels like "evidence," not "heritage."

  ---

  ## 3. Session Sequence & Misconception Map

  ### 0:00 – 0:10 | Introduction: The Burden of the Past
  *   **Hook:** Ask, "When does knowing the past stop you from acting in the present?"
  *   **Concept:** Introduce Nietzsche's thesis: History is not about truth; it is about *health*. We use history to live, not to know.
  *   **Setup:** Introduce the **Power Plant** example. It sits empty. It is heavy. What do we do with it?

  ### 0:10 – 0:30 | Mode 1: Monumental History (The Spark)
  *   **Definition:** History that provides models for action. It looks for peaks of human achievement to say, "If they did it, I can too."
  *   **Application:** The Power Plant is not just a building; it is a testament to the generation that electrified the region. We preserve it to inspire new engineers or community organizers.
  *   **Misconception Check (Propaganda):**
      *   *The Trap:* Students will equate this with state propaganda or "Great Man" theory.
      *   *The Intervention:* **Right here.** Clarify that Monumental history is for the *actor's internal drive*, not for imposing values on others. It's not about forcing the public to admire the plant; it's about the heritage professional finding energy in the plant's existence to fuel a new project. If it becomes a statue to be worshipped, it's dead. If it's fuel for a new deed, it's Monumental.

  ### 0:30 – 0:50 | Mode 2: Antiquarian History (The Soil)
  *   **Definition:** History that preserves the conditions of one's existence. It is piety toward one's origins. It loves the small, the local, the specific.
  *   **Application:** The Power Plant's specific bricks, the logbooks of the shift managers, the neighborhood that grew around it. We preserve these because they are *ours*.
  *   **Misconception Check (Nostalgia):**
      *   *The Trap:* Students will equate this with "wanting to live in the past" or sentimental hoarding.
      *   *The Intervention:* **Right here.** Distinguish *piety* from *nostalgia*. Nostalgia wishes to return; Antiquarianism wishes to *continue*. You don't live in the turbine; you honor the turbine so you know where you stand. If the preservation stops the city from growing (e.g., blocking new housing to save a shed), it has rotted into mere nostalgia.

  ### 0:50 – 1:10 | Mode 3: Critical History (The Knife)
  *   **Definition:** History that judges and condemns the past to enable life in the present. It breaks the past because the past is a chain.
  *   **Application:** The Power Plant polluted the river. It relied on exploitative labor. To build a healthy future, we must condemn that aspect, perhaps tear down the smokestacks, or publicly mark the harm. We destroy part of the history to save the future.
  *   **Misconception Check (Political Critique):**
      *   *The Trap:* Students will equate this with modern "cancel culture" or partisan political scoring.
      *   *The Intervention:* **Right here.** Frame this as *survival*, not *virtue*. It is not about being "right" politically; it is about digesting the past so it doesn't poison you. If you keep the plant purely for Antiquarian reasons but the community is traumatized by it, the history is toxic. Critical history is the surgery required to heal.

  ### 1:10 – 1:20 | Synthesis: The Health Metaphor
  *   **Integration:** A healthy heritage practice needs all three.
      *   Without Monumental: No vision.
      *   Without Antiquarian: No roots/identity.
      *   Without Critical: No ability to change/adapt.
  *   **Warning:** Any mode in excess becomes a disease (Monumental = Fanaticism; Antiquarian = Mummification; Critical = Rootlessness).

  ---

  ## 4. Check-for-Understanding (CFU)
  **Time:** 1:20 – 1:30
  **Scenario:** A City Council is debating whether to **demolish an old textile factory** to build affordable housing. The factory is 100 years old.

  **The Task:** Do not vote "Yes" or "No." Instead, describe how a heritage professional applies **all three modes** to this single decision to ensure the city's "life" is served.

  ### What a WRONG Answer Looks Like:
  *   **The "Pick One" Error:** "We should use Critical history to demolish it because it's old, or Antiquarian history to keep it because it's historic." (Treats the modes as mutually exclusive policy options).
  *   **The "Moral Hierarchy" Error:** "Critical history is the best mode because it addresses social justice, while Antiquarian is conservative and bad." (Collapses into Good vs. Bad).
  *   **The "Modern Political" Error:** "Critical history means we investigate if the owners were Democrats or Republicans." (Misreads Critical as partisan).

  ### What a CORRECT Answer Looks Like:
  *   **Integration:** The answer acknowledges the tension between the modes.
  *   **Monumental:** "We ask: Does keeping this factory inspire future industry, or does the new housing inspire a better future? Which deed do we want to monumentalize?"
  *   **Antiquarian:** "We ensure that even if we demolish, we preserve the records, the stories of the workers, and perhaps a façade, so the neighborhood doesn't lose its memory."
  *   **Critical:** "We acknowledge the factory may represent exploitative labor or blight that actively harms the current community. Demolition is an act of Critical history to clear the ground for life."
  *   **The Synthesis:** "A healthy decision might be to demolish the unsafe structures (Critical) to build housing (Monumental action), while archiving the artifacts and marking the site (Antiquarian piety). The goal is not to save the building, but to serve the living city."

  ---

  ## 5. Practical Facilitation Notes
  *   **Keep it Physical:** When discussing the Power Plant/Factory, talk about bricks, smoke, and noise. Heritage students are tactile. Anchor the philosophy in the material.
  *   **Watch the "Critical" Energy:** Students will light up during the Critical section. It feels modern and active. Pull them back by asking, "If you critique everything away, what ground do you stand on?" (Forcing them back to Antiquarian).
  *   **No "Truth" Talks:** If a student asks, "But what *really* happened?" redirect them: "Nietzsche doesn't care about truth here. He cares about whether believing that story helps you build the future."
  *   **Time Management:** Stick strictly to the 20-minute blocks. The Synthesis is where the learning sticks; don't let the first mode run long.
