      *   *Phase 2 Rules:* Need to be very clear on the "Vocabulary Constraint."
      *   *Phase 3 Axiom:* Students aren't logicians. Provide a template: "For all gambles $G_1, G_2$ and common outcome $C$, $G_1 \succ G_2$ implies..." and let them add the "unless" clause.

