answer: |-
  # Seminar Activity: The Stewardship Dilemma
  **Session Duration:** 75 Minutes
  **Participants:** 18 Students
  **Materials:** Printed choice sheets (Phase 1), Role cards (Phase 2), Gamble Cards (Phase 3), Whiteboard/Projector.

  ## Instructor Preparation Notes
  *   **Secrecy:** Do not mention "Allais," "Independence Axiom," "Expected Utility," or "Paradox" until the final 5 minutes.
  *   **Tone:** Maintain a neutral, administrative tone during Phases 1–3. You are a mechanism, not a guide, until the debrief.
  *   **Currency:** All payoffs are in "Stewardship Units" (SU). These are hypothetical points toward a hypothetical group grade bonus. Emphasize that the *structure* matters, not the points themselves.

  ---

  ## Phase 1: The Allocation (15 Minutes)

  **Objective:** Elicit preferences that violate the Independence Axiom without naming the violation. Frame outcomes as social accountability.

  **Instructions to Class:**
  "You are acting as Stewards for a shared community fund. You must make two separate decisions regarding the allocation of resources. Your goal is to maximize the welfare of the community, but you are also accountable for the *security* of the baseline.

  On your sheet, you will see **Decision I** and **Decision II**. You must choose privately. Do not discuss your choices with neighbors. Once you mark your sheet, fold it and place it in the collection box. These choices are locked."

  **The Choice Sheet (Distribute to all 18 students):**

  > **DECISION I: The Security Mandate**
  > *Choose one option to implement for the community.*
  > *   **Option A (Secure Baseline):** 100% chance of maintaining **50 SU** (Stable Welfare).
  > *   **Option B (Gamble for Surplus):** 89% chance of **50 SU** (Stable Welfare), 10% chance of **250 SU** (Prosperity), 1% chance of **0 SU** (Collapse).
  >
  > **DECISION II: The Recovery Mandate**
  > *Choose one option to implement for the community.*
  > *   **Option C (Modest Recovery):** 11% chance of **50 SU** (Stable Welfare), 89% chance of **0 SU** (Collapse).
  > *   **Option D (High Recovery):** 10% chance of **250 SU** (Prosperity), 90% chance of **0 SU** (Collapse).

  **Facilitator Action:**
  Collect the sheets immediately. Tally the results quickly (or pretend to) while setting up Phase 2. *Note: Most students will likely choose A in Decision I and D in Decision II. This is the target pattern.*

  ---

  ## Phase 2: The Defense (25 Minutes)

  **Objective:** Force students to experience the tension between formal consistency (EU) and narrative coherence (Scenario-Integrated).

  **Setup:**
  Divide the room into 9 pairs. In each pair, assign one **Defender** and one **Auditor**.
  *   *If a student chose the "Violation Pattern" (A & D), they must Defender.*
  *   *If a student chose the "Consistent Pattern" (A & C or B & D), they may act as Auditor or Defender of consistency.*
  *   *(Simplification for time):* Randomly assign 9 Defenders and 9 Auditors regardless of choice, but instruct Defenders to defend *whatever they actually chose* in Phase 1.

  **The Rules of Engagement (Project on Board):**
  1.  **Defender's Task:** Justify your Phase 1 choices to your Auditor.
  2.  **Vocabulary Constraint:** You must choose **ONE** of the following two languages for your entire justification. You cannot switch.
      *   **Language 1 (Formal Maximization):** You may only speak of probabilities, total expected value, and consistency.
      *   **Language 2 (Scenario-Integrated):** You may speak of *counterfactuals*, *avoided alternatives*, and *accountability*. You must explain how the meaning of an outcome changes based on what was risked to get it.
  3.  **The Rationality Bonus:**
      *   If you use **Language 1**, you are eligible for a **Rationality Bonus (10 pts)**. *However*, to claim this, your Phase 1 choices must be mathematically consistent (i.e., if you chose Safe in Decision I, you must choose Safe in Decision II). If you chose the mixed pattern (A & D), you **forfeit** the Bonus automatically if you use Language 1.
      *   If you use **Language 2**, you are **ineligible** for the Rationality Bonus. However, you may earn **Coherence Points (up to 10 pts)** awarded by the Auditor if they believe your narrative explains the switch in preference without contradiction.
  4.  **Auditor's Task:** Award Coherence Points (0–10) based on how well the Defender explains the *switch* in preference between Decision I and Decision II. If the Defender uses Language 1 but admits inconsistency, award 0 points.

  **Facilitator Prompt (Mid-Phase Intervention):**
  *Circulate. If you hear a Defender say, "I just didn't want to risk the zero," stop them.*
  **Prompt:** "Risk aversion applies to both decisions equally. Why did the risk feel acceptable in Decision II but not Decision I? You must reference the *avoided alternative*."

  **Debrief of Phase 2 (2 Minutes):**
  Ask for a show of hands: "Who forfeited the Rationality Bonus to keep their Phase 1 choices?"
  *Instructor Note:* This makes the cost of violating independence tangible. They paid a "rationality tax" to keep their intuition.

  ---

  ## Phase 3: The Surgical Swap (25 Minutes)

  **Objective:** Physically demonstrate the Independence Axiom mechanism and attempt a formal repair.

  **Setup:**
  Keep the pairs. Distribute a deck of 4 cards to each pair representing the outcomes of Phase 1.
  *   Card 1: "89% Stable (50 SU)"
  *   Card 2: "1% Collapse (0 SU)"
  *   Card 3: "10% Prosperity (250 SU)"
  *   Card 4: "89% Collapse (0 SU)" [Note: This represents the 89% chunk in Decision II]

  **The Exercise:**
  1.  **Reconstruct Decision I:**
      *   Option A = Card 1 (89% Stable) + Card 2 (1% Collapse) + [Implicit 10% Stable]. *(Simplify for students: Option A is the "Safe Bundle". Option B is the "Risk Bundle".)*
      *   *Correction for physical clarity:* Give them two strips of paper.
          *   **Strip 1 (Decision I):**
              *   Left Side (Option A): [100% Stable]
              *   Right Side (Option B): [89% Stable] + [10% Prosperity] + [1% Collapse]
          *   **Strip 2 (Decision II):**
              *   Left Side (Option C): [11% Stable] + [89% Collapse]
              *   Right Side (Option D): [10% Prosperity] + [90% Collapse]
  2.  **The Excision:**
      *   Instruct students: "Identify the common consequence shared by Option A and Option B in Decision I. It is the **89% chance of Stable Welfare**."
      *   "Physically cut or cover that 89% block on Strip 1."
      *   "Now look at Decision II. Replace the 89% Collapse block with the same 89% Stable block you just removed."
      *   *Wait, reverse the logic for the standard Allais demonstration:*
      *   **Correct Instruction:** "In Decision I, both options share an 89% chance of Stable Welfare (Option A is 89% Stable + 11% Stable; Option B is 89% Stable + 11% Risk). In Decision II, that 89% Stable is replaced by 89% Collapse in *both* options."
      *   **Task:** "Remove the 89% chunk from both options in Decision I. Remove the 89% chunk from both options in Decision II. Compare what is left."
      *   **Observation:** Mathematically, the remainders are identical (11% Stable vs 10% Prosperity + 1% Collapse). If preferences flipped, the 89% chunk *mattered*, even though it was common to both.

  **The Axiom Drafting:**
  "In standard theory, if you prefer A over B, you must prefer A' over B' when a common consequence is removed. You have just demonstrated that you do not follow this rule.
  **Task:** Draft a formal modification to the Independence Axiom. You must use logical notation or strict conditional syntax. Do not use words like 'feeling' or 'story.'
  **Template:**
  *For all gambles $G_1, G_2$ and common outcome $C$:*
  *$G_1 \succ G_2 \iff G_1 \oplus C \succ G_2 \oplus C$*
  *...UNLESS [Insert Condition]*"

  **Facilitator Support:**
  Help them formulate the "Unless." Likely candidates: "Unless C represents a security baseline," or "Unless the probability of C exceeds a threshold of certainty."

  ---

  ## Phase 4: Debrief & Reveal (10 Minutes)

  **Objective:** Map the activity to philosophical concepts and address limitations.

  **1. The Reveal (2 Minutes):**
  "You have just reconstructed the **Allais Paradox** (1953). The pattern of choosing Security in Decision I and Risk in Decision II violates the **Independence Axiom** of Expected Utility Theory."

  **2. Mapping the Phases (3 Minutes):**
  *   **Phase 1:** Demonstrated the **Common Consequence Effect**. You treated the 89% probability differently depending on whether it was attached to a certainty or a risk.
  *   **Phase 2:** Highlighted the conflict between **Ex-Ante Maximization** (Language 1) and **Ex-Post Accountability** (Language 2).
      *   *Language 1* assumes you only care about the final state of the world.
      *   *Language 2* assumes you care about the *path* taken to get there. In Decision I, choosing Option B and getting 0 SU feels like a *negligent loss* because you could have had 50 SU for sure. In Decision II, getting 0 SU feels like *bad luck* because the 50 SU was never secure.
  *   **Phase 3:** Attempted **Axiomatic Repair**. You tried to write a rule that allows context to matter without allowing total inconsistency (intransitivity).

  **3. Critical Distinctions (3 Minutes):**
  *   **Risk Aversion vs. Independence Violation:**
      *   *Facilitator Prompt:* "Many of you argued you were just 'risk averse.' If that were true, you would have chosen the safer option in *both* decisions (A and C). The violation is not that you dislike risk; it is that your dislike of risk *changes* depending on the presence of a certainty."
      *   **Key Concept:** Expected Utility Theory separates *taste* (utility function curvature) from *belief* (probabilities). Your behavior suggests these are entangled.
  *   **The Limitation of Points:**
      *   "This activity used Stewardship Units. In real utility theory, we need **cardinal measurement**. We need to know not just that you prefer 50 to 0, but *how much more*. A role-play cannot capture the precise numerical trade-offs required to prove a utility function is non-linear. You felt the tension, but you did not measure the utility difference."

  **4. Closing Thought (2 Minutes):**
  "Is the Independence Axiom a law of rationality, or is it a constraint that excludes valid forms of moral reasoning? If 'regret' or 'accountability' are real components of welfare, then violating independence may not be a bias. It may be a feature of a more complex rationality. Your Phase 3 axioms are the beginning of **Regret Theory** and **Weighted Utility** models. Keep those drafts; they are the start of your next paper."

  ---

  ## Predicted Failure Modes & Mitigation

  1.  **Conflation of Risk Aversion:**
      *   *Symptom:* Students argue, "I chose A because I'm risk averse."
      *   *Mitigation:* During Phase 2, Auditors are instructed to ask: "If you are risk averse, why did you choose D (the riskier option) in Decision II?" Force them to articulate the *change* in attitude, not the attitude itself.
  2.  **Axiom Vagueness:**
      *   *Symptom:* Students write "Unless it feels important."
      *   *Mitigation:* Provide the logical template on the handout ($G_1 \succ G_2 \iff ...$). Require them to fill in the blank with a condition on *probabilities* or *outcome states*, not feelings.
  3.  **Time Overrun:**
      *   *Symptom:* Phase 2 debates drag on.
      *   *Mitigation:* Use a visible timer. Cut Phase 2 debates at 20 minutes strictly to ensure Phase 3 (the formal work) happens. Phase 3 is the most philosophically dense; do not sacrifice it.

  ## Materials Checklist
  *   18 Phase 1 Choice Sheets.
  *   9 Pairs of Role Cards (Defender/Auditor).
  *   9 Sets of "Gamble Strips" (paper strips representing the probability chunks for Phase 3).
  *   Scissors/Tape for Phase 3.
  *   Whiteboard for Phase 2 Rules and Phase 3 Axiom Template.
