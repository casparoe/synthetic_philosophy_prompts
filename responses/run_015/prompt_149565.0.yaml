      *   *Standard Allais:*
          *   1A: Certain gain.
          *   1B: High probability of high gain, small prob of zero.
          *   2A: Low prob of high gain, high prob of zero.
          *   2B: Slightly lower prob of high gain, slightly higher prob of zero (but structurally similar to 1B minus the certainty).
      *   *Framing:* "Collective responsibility" rather than individual gain. Let's use "Community Trust Points" (CTP).
      *   *Mechanism:* Students allocate a portion of a hypothetical group fund.
      *   *The Twist:* The outcomes need to feel like *narratives*.
      *   *Drafting the Gambles:*
          *   Pair 1 (Certainty vs. Risk):
              *   Option X: Secure the baseline welfare for the group.
              *   Option Y: Gamble for surplus, but risk dropping below baseline.
          *   Pair 2 (Risk vs. Risk):
              *   Option Z: Low chance of surplus, high chance of baseline.
              *   Option W: Slightly higher chance of surplus, slightly lower chance of baseline (but no certainty).
      *   *Refinement for "Scenario-Integrated":* The prompt asks for outcomes embedded in narratives of accountability. Let's frame the "zero" outcome not just as 0 points, but as "Failure to Act" vs. "Attempted and Failed."
      *   *Simplification for Time:* Keep the probabilities clean (e.g., 100%, 89%, 11% vs 11%, 89%, 0%).
      *   *Instruction:* Private, locked, no discussion.

  3.  **Deconstruct Phase 2 (The Justification):**

      *   *Roles:* 9 Defenders, 9 Auditors.
      *   *Task:* Defenders explain Phase 1 choices.
      *   *Vocabularies:*
          1.  *EU Language:* Must treat probabilities linearly. If they chose the Allais pattern (Certainty in Pair 1, Risk in Pair 2), they *cannot* justify this consistently in EU terms without admitting error.
          2.  *Scenario-Integrated:* "The meaning of the win changes because of what I didn't choose."
      *   *Incentive:* "Rationality Bonus" points if they preserve Independence (i.e., choose consistent EU options). If they stick to their Phase 1 Allais choice, they lose the bonus but gain "Coherence Points" from Auditors if the narrative holds.
      *   *Tension:* This forces the student to feel the cost. To keep their intuition, they must sacrifice the "Rationality Bonus" (EU compliance).
      *   *Facilitator Role:* Ensure they don't just say "I'm risk averse." Force the "avoided alternative" language.

  4.  **Deconstruct Phase 3 (The Repair):**

      *   *Physicality:* Cards.
      *   *Action:* Remove the common consequence.
      *   *Observation:* Does preference flip? (It should, mathematically, but psychologically it won't).
      *   *Task:* Draft a formal axiom.
      *   *Requirement:* Formal terms (conditions on preference preservation), not loose language.
      *   *Goal:* "Context-Sensitive Independence."
      *   *Example:* $P \succ Q \iff P + R \succ Q + R$ *unless* $R$ alters the narrative context of the outcome. (Need to make this more precise for the students).

  5.  **Deconstruct the Debrief:**

      *   Reveal the Allais Paradox.
      *   Map Phase 1 -> Common Consequence.
      *   Map Phase 2 -> Ex-ante (EU) vs. Ex-post (Regret/Accountability).
      *   Map Phase 3 -> Axiomatic Repair (Regret Theory, Weighted Utility, etc., without necessarily naming them all, just the concept).
