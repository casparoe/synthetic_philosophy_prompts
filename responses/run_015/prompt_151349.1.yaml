answer: |-
  **MEMORANDUM**
  **TO:** Job Candidate
  **FROM:** Senior Colleague
  **RE:** Prep for Kant/Collective Action Talk

  I've read the abstract. It's bold. You're telling the Kantians their hero has a hole in his boat, telling the consequentialists their fix kills the patient, and telling the political philosophers they have to wait for a different ship. That's a lot of friction for a 45-minute talk.

  Here is the room analysis you asked for, followed by the sheet.

  **The Room Dynamics:**
  *   **The Textualists (K1, K2):** They are not looking for moral truth; they are looking for *fidelity*. They will protect the architecture of the *Groundwork*. If you blur CC and CW, or if you suggest Kant's test is unusable, they will smell blood. They fear you are importing game theory into 1785.
  *   **The Analytic Ethicist (A1):** They are waiting for you to admit that Rule-Consequentialism (RC) just does the job better. They will attack your claim that RC loses the "first-personal character." To them, that sounds like a distinction without a difference.
  *   **The Political Philosopher (P1):** They are your ally on the diagnosis (the Aggregation Gap is real) but your enemy on the prognosis. They want to say Kant is obsolete for structural injustice. You are saying we must keep Kant and accept the limitation. They will call this conservative quietism.
  *   **The Generalists (G1, G2):** They are the swing votes. If they get lost in "fixed-point failure," you lose. They care about whether this changes how we actually think.

  **Strategy:** Do not fight on all fronts. Let the Political Philosopher have the point that Kant is bad for structural injustice; concede that. Fight for the *philosophical integrity* of the CI procedure against the Analytic Ethicist. Keep the Textualists calm by showing you respect the CC/CW distinction even if you reinterpret CC.

  Here is your prep sheet.

  ***

  # JOB TALK Q&A PREP SHEET

  ### 1. The "Perfect Duty" Objection
  *   **Who:** Kant Textualist 1 (Groundwork specialist)
  *   **Phrasing:** "Kant is explicit that contradictions in conception generate perfect duties, while contradictions in will generate imperfect ones. By classifying collective action failures as merely contradictions in will (imperfect duties), aren't you admitting that Kant cannot account for the strict obligation we have to not free-ride? You're saving the test by weakening the duty."
  *   **Likelihood/Damage:** High / High. This strikes at the systematic unity of Kant's ethics.
  *   **2-Minute Reply:** "I agree that for Kant, CC yields perfect duty. My claim is that free-riding maxims *do not* trigger a CC on the correct reading of universalization. They trigger a CW. This isn't a bug I'm patching; it's a feature of Kant's individualism. The 'gap' is precisely that Kantian morality treats collective harm as a failure of will, not conception. We shouldn't force a CC where there isn't one just to get a stronger duty; we should acknowledge the limit of the CI's scope regarding aggregate harm."
  *   **Soft Spot:** You are admitting Kant might get the *moral weight* wrong (imperfect vs. perfect) to save the *procedure*.

  ### 2. The "Rule-Consequentialist Collapse" Objection
  *   **Who:** Analytic Ethicist
  *   **Phrasing:** "You claim that fixing the aggregation gap turns the CI into Rule-Consequentialism. But your 'fixed-point failure' reading already relies on the *outcome* of universalization destroying the background conditions. What is the normative difference between 'this maxim fails because its universalization produces bad states of affairs' and RC? You seem to be distinguishing deliberative perspective from normative criterion, but does that distinction do any work?"
  *   **Likelihood/Damage:** High / Critical. If this sticks, your paper is just "Kantian-sounding RC."
  *   **2-Minute Reply:** "The difference is the *input* of the test. RC asks: 'Which rule, if generally adopted, maximizes value?' My reading asks: 'Can *I* will this maxim as a law, given that I know others' conduct constitutes the background of my action?' RC evaluates the rule from the outside; the CI evaluates the agent's willing from the inside. The fixed-point failure shows the maxim is self-defeating for the *agent*, not that the state of affairs is suboptimal."
  *   **Soft Spot:** The "self-defeating for the agent" claim is thin when the agent's individual contribution is negligible.

  ### 3. The "Structural Injustice" Objection
  *   **Who:** Political Philosopher
  *   **Phrasing:** "You conclude we should 'live with the gap.' But in cases like climate change or voting, that gap allows individuals to say 'my maxim passes the test' while the system collapses. Isn't this an ideological defense of individualism? If Kant can't handle structural harm, why aren't we just discarding Kant for a theory of collective responsibility?"
  *   **Likelihood/Damage:** Medium / High. Makes you look morally timid or politically naive.
  *   **2-Minute Reply:** "I'm not defending the gap as morally desirable; I'm diagnosing it as structurally inherent to first-personal deliberation. Discarding Kant loses the insight that agents must act on reasons they can endorse, not just outcomes they calculate. We can supplement Kant with political principles for structural justice without corrupting the CI's role in individual deliberation."
  *   **Soft Spot:** You are conceding Kant is insufficient for politics, which risks making the project seem niche.

  ### 4. The "Maxim Individuation" Objection
  *   **Who:** Kant Textualist 2
  *   **Phrasing:** "Couldn't we solve the aggregation gap simply by describing the maxim more precisely? For example, 'I will omit my contribution when enough others contribute to sustain the good.' If *that* is universalized, the good collapses immediately. Why do we need a 'gap' if we just fix the maxim description?"
  *   **Likelihood/Damage:** Medium / Medium. A standard move in Kant scholarship.
  *   **2-Minute Reply:** "That maxim description presupposes knowledge of the aggregate state that the agent often doesn't have in the moment of deliberation. More importantly, it shifts the test from 'Can I will my action?' to 'Can I will a description of a state of affairs?' It risks making the CI a test of empirical predictions rather than rational willing."
  *   **Soft Spot:** Textualists love fine-grained maxim individuation; dismissing it looks like you're avoiding a textual fix.

  ### 5. The "Usability" Objection
  *   **Who:** Generalist 1
  *   **Phrasing:** "You talk about 'fixed-point failures' and 'background patterns of conduct.' Is this actually usable by an agent in hard times? If the False Promise example requires game-theoretic reasoning about success conditions, have you made the Categorical Imperative too complex for human use?"
  *   **Likelihood/Damage:** Medium / Medium. Job talks need to show the theory is livable.
  *   **2-Minute Reply:** "It's not game theory; it's practical reflection. When I make a promise, I implicitly rely on the institution of promising. I don't need to calculate equilibria; I just need to recognize that my action depends on a practice I'm undermining. That's accessible to common rational moral cognition."
  *   **Soft Spot:** The line between "practical reflection" and "game theory" is blurrier than you want it to be.

  ### 6. The "False Promise" Fit Objection
  *   **Who:** Kant Textualist 1
  *   **Phrasing:** "Kant says the false promise generates a logical contradiction in conception. You say it's a fixed-point failure (a causal/practical contradiction). Are you not contradicting the text of the *Groundwork* 4:422? Why call it CC if you've changed the definition of contradiction?"
  *   **Likelihood/Damage:** High / Low. They want to score a textual point, but it doesn't kill the philosophy.
  *   **2-Minute Reply:** "Kant uses 'contradiction' in a broader sense than formal logic. He speaks of the 'concept' of the action becoming impossible. A fixed-point failure explains *how* the concept becomes impossible: the action's success conditions vanish. I'm clarifying Kant's metaphor, not contradicting his German."
  *   **Soft Spot:** You are redefining a technical term Kant seems to treat as logical.

  ### 7. The "Complicity" Objection
  *   **Who:** Political Philosopher
  *   **Phrasing:** "If the maxim passes the test, does that mean the agent is not complicit in the harm? If you tell students 'Kant says your maxim is permissible,' aren't you giving them a moral excuse for free-riding?"
  *   **Likelihood/Damage:** Low / High. Dangerous for the job market (teaching implications).
  *   **2-Minute Reply:** "No. Passing the CI test means the action isn't *forbidden* by the CI. It doesn't mean it's virtuous, or that there aren't other duties (legal, political, or imperfect) to contribute. I'm mapping the limits of one test, not issuing a moral all-clear."
  *   **Soft Spot:** Distinguishing "permissible" from "excusable" is delicate in a job talk context.

  ### 8. The "So What?" Objection
  *   **Who:** Analytic Ethicist
  *   **Phrasing:** "Let's say you're right. There's a gap, and fixing it ruins the first-personal character. Why should we care? If the outcome is that we can't derive a duty to contribute to collective goods from Kant, isn't the rational conclusion to use a different tool for collective goods and keep Kant for interpersonal ones?"
  *   **Likelihood/Damage:** Medium / Critical. Challenges the paper's necessity.
  *   **2-Minute Reply:** "Because we need to know *why* Kant fails there. If we just switch tools without understanding the friction, we lose the insight that collective action problems are hard precisely because they strain the link between individual rationality and collective good. Preserving the gap shows us the cost of individualism."
  *   **Soft Spot:** This admits the paper is diagnostic rather than solution-oriented.

  ***

  ### STRATEGIC ADVISORY

  **1. Concessions to make in the first two minutes:**
  *   **Concede the Political Point:** Explicitly state: "I am not arguing that Kant provides a sufficient framework for structural injustice or climate ethics. The Aggregation Gap is a real moral cost." This disarms the Political Philosopher immediately.
  *   **Concede the Complexity:** Acknowledge that the "fixed-point" reading requires more reflection than a simple logical check. This prevents the Generalists from thinking you are oversimplifying Kant.

  **2. The Single Reply that *must* land:**
  *   **The RC Distinction (Objection #2).** You must convince the room that there is a hard, bright line between "evaluating the consequences of a rule" (RC) and "testing the self-defeating nature of a will" (Kant). If the Analytic Ethicist convinces the room these are extensionally equivalent, your paper becomes a historical footnote. You need to land the point that *deliberative perspective* is constitutive of moral obligation, not just a heuristic.

  **3. The One Question you hope nobody asks:**
  *   **"If the CI yields the wrong result on collective action (imperfect rather than perfect duty), and you admit RC gets the right result, why is Kantianism still the default for *any* moral theory? Isn't this a reductio of the CI?"**
      *   *Why it's deadly:* It forces you to defend Kant's supremacy against a rival that handles the hard cases better. It moves the talk from "Interpreting Kant" to "Defending Deontology," which is a much harder sell in a mixed room. If asked, pivot to: "Moral theory isn't just about extensional correctness; it's about capturing the nature of obligation. RC gets the answer right but for the wrong reasons (outcome vs. agency)."
