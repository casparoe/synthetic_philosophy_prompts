  Is there an established concept that names this exact oscillation—formal rigor in advancing the argument, intuitive exemption in blocking parallel constructions—or does it fall under a broader heading such as an ad hoc immunization, a Lakatosian protective-belt adjustment, or an equivocation between technical and ordinary senses of "positive"? If there is no precise term, can you coin one and define it with clear boundary conditions, distinguishing it sharply from ordinary auxiliary-hypothesis revision, from the motte-and-bailey fallacy, and from simple ambiguity? I want the carving, not a bare label: what exactly the phenomenon is, what it is not, and where its edges lie, especially regarding whether it is peculiar to modal ontological arguments or extends to other formal existence proofs. I am not asking for a bibliography, reading list, or citations; I want an analysis that a model without web access could produce from conceptual reasoning alone.

  Please state explicitly what argument or piece of evidence would change your identification—for example, if the pattern turned out to be indistinguishable from standard research-program defense mechanisms—and identify the point in your reasoning where you are most likely to have erred, whether by over-particularizing a common dialectical tactic or by missing an existing technical term in modal metaphysics.
