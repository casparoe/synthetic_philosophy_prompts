answer: |-
  ### I. Analysis of Established Categories

  Before proposing a specific designation, we must measure the phenomenon against the nearest established dialectical and methodological categories. The pattern you describe involves a strategic shift in the epistemic status of premises under critical pressure. Here are the four most relevant existing frameworks:

  1.  **Immunization Strategies (Popper/Albert):**
      *   *Definition:* Modifications to a theory made solely to protect it from falsification, often by rendering it less testable.
      *   *Fit:* This captures the defensive move (blocking the "anti-God" by appealing to intuition). However, immunization usually implies a degradation of empirical content. In the ontological argument, the defender claims the intuitive appeal *preserves* the content while the formalism *secures* the derivation. Immunization is too broad; it describes the *goal* (avoiding refutation) but not the *mechanism* (shifting axiomatic warrant).

  2.  **Lakatosian Protective-Belt Adjustments:**
      *   *Definition:* In a research program, the "hard core" is protected by adjusting auxiliary hypotheses in the "protective belt."
      *   *Fit:* The existence of the God-like being is the hard core; the definition of "positive properties" is the belt. When the belt yields contradictions (symmetry objections), it is adjusted. However, Lakatosian adjustments are typically progressive (predicting novel facts) or degenerative. This pattern is often static and purely defensive. More critically, Lakatos assumes the *methodology* remains stable. Here, the methodology itself (formal vs. intuitive) oscillates.

  3.  **The Motte-and-Bailey Fallacy:**
      *   *Definition:* A proponent advances a controversial claim (Bailey), retreats to a defensible claim (Motte) when attacked, and then re-asserts the controversial claim once the attack subsides.
      *   *Fit:* This is the strongest candidate. The "Bailey" is the formal derivation (strong, rigorous, yields necessary existence). The "Motte" is the intuitive grasp of perfection (weak, vague, hard to refute formally).
      *   *Deficiency:* Standard Motte-and-Bailey concerns the *truth value of propositions* (e.g., "Culture determines everything" vs. "Culture influences some things"). Your phenomenon concerns the *justificatory status of axioms*. The defender is not retreating from the *conclusion* but shifting the *ground* on which the premises rest. The axiom "Properties of positive properties are positive" is treated as a formal stipulation in one breath and a substantive truth in the next. This is a meta-logical shift, not merely a propositional retreat.

  4.  **Equivocation (Semantic Ambiguity):**
      *   *Definition:* Using a term in two different senses within an argument.
      *   *Fit:* The term "positive" clearly carries different weights (formal closure vs. axiological value).
      *   *Deficiency:* Equivocation implies a logical error within a single inference chain. The phenomenon you describe is *dialectical*; it occurs across the exchange between defender and critic. The defender is not necessarily violating syntax in a single proof but changing the *interpretive framework* of the proof between offensive and defensive moves.

  ### II. Assessment of Fit and Proposal

  None of the above categories captures the *structural oscillation of axiomatic warrant* specific to formal modal metaphysics. Motte-and-Bailey is the closest genus, but it lacks the specificity to describe a shift in the *modal status* of the premises (from necessary/stipulative to contingent/intuitive).

  Therefore, a new term is required to carve this specific dialectical joint. I propose the term:

  **Axiomatic Warrant Oscillation**

  #### Definition
  **Axiomatic Warrant Oscillation** is a dialectical maneuver in formal metaphysics wherein the justification for a system's axioms shifts between two distinct modes depending on the direction of critical pressure:
  1.  **Formal-Stipulative Warrant:** When deriving the desired conclusion, axioms are treated as constitutive rules of a logical system. Their validity rests on internal consistency and closure conditions (e.g., S5 modal logic, property closure).
  2.  **Substantive-Intuitive Warrant:** When defending the system against counter-models or symmetry objections, the same axioms are treated as descriptive truths about reality or value. Their validity rests on pre-theoretic intuition or metaphysical necessity (e.g., "pure perfection," "maximal greatness").

  The oscillation occurs when the defender relies on Mode 1 to claim the conclusion is *logically forced*, but relies on Mode 2 to claim the premises are *uniquely true* (blocking parallel "anti-God" derivations).

  ### III. Boundary Conditions and Carving

  To distinguish **Axiomatic Warrant Oscillation** from related concepts, we must establish clear boundary conditions:

  1.  **Vs. Motte-and-Bailey:**
      *   *Motte-and-Bailey:* Shifts the *content* of the claim (Strong Claim $\to$ Weak Claim).
      *   *Axiomatic Warrant Oscillation:* Keeps the *content* of the axiom stable but shifts its *epistemic foundation* (Stipulation $\to$ Truth).
      *   *Boundary:* If the defender changes the definition of "positive" (e.g., from "moral goodness" to "logical consistency"), it is Motte-and-Bailey. If the defender keeps the definition but changes *why* we accept it (from "because I defined it so" to "because it is self-evident"), it is Axiomatic Warrant Oscillation.

  2.  **Vs. Simple Equivocation:**
      *   *Equivocation:* Occurs *within* a single argument chain, rendering it invalid.
      *   *Axiomatic Warrant Oscillation:* Occurs *between* dialectical turns (derivation vs. defense). The argument may remain syntactically valid; the issue is the stability of the premises' interpretation across the debate.
      *   *Boundary:* If the proof fails syntactically because "positive" means $X$ in line 1 and $Y$ in line 5, it is Equivocation. If the proof is valid, but the defender justifies Line 1 by intuition when attacked and by formalism when pressing the conclusion, it is Axiomatic Warrant Oscillation.

  3.  **Vs. Lakatosian Adjustment:**
      *   *Lakatos:* Involves temporal progression and auxiliary hypotheses.
      *   *Axiomatic Warrant Oscillation:* Can occur instantaneously within a single exchange regarding the *core* axioms.
      *   *Boundary:* If the defender adds a new axiom to block a counter-example, it is a Protective-Belt adjustment. If the defender re-characterizes the *nature* of an existing axiom to block the counter-example, it is Axiomatic Warrant Oscillation.

  ### IV. Scope and Generality

  Is this peculiar to modal ontological arguments?
  *   **Primary Locus:** It is most acute in modal ontological arguments because they uniquely combine high-formalism (modal logic S5) with high-substantivity (value, perfection, existence).
  *   **Extension:** It extends to any formal system attempting to derive substantive metaphysical or ethical conclusions from axioms that are under-specified formally.
      *   *Example:* Formal Ethical Systems (e.g., attempting to derive specific duties from a formal "goodness" operator). If the "goodness" operator is treated as a logical constant when deriving obligations, but as a substantive moral intuition when defending against counter-intuitive obligations, Axiomatic Warrant Oscillation is present.
      *   *Non-Example:* Pure Mathematics. If a mathematician defines a group and derives a theorem, they do not appeal to intuition to block a "counter-group" unless the definition was ambiguous. If the definition is precise, oscillation is impossible. Thus, the phenomenon requires a blend of formal and normative/substantive vocabulary.

  ### V. Falsification Conditions

  My identification of this pattern as **Axiomatic Warrant Oscillation** would be undermined or require revision under the following conditions:

  1.  **Evidence of Unified Warrant:** If a defender can demonstrate that the "intuitive" grasp of "positive properties" is itself fully codifiable within the formal system (i.e., the intuition is derivable from the formalism, not an external check), the oscillation collapses. The warrant would be uniformly formal.
  2.  **Evidence of Consistent Stipulation:** If a defender consistently maintains that the system is *purely stipulative* (e.g., "If you accept these axioms, the conclusion follows; I make no claim that the axioms are true"), the defensive appeal to intuition vanishes. The argument becomes a conditional validity claim, not an ontological proof.
  3.  **Indistinguishability from Research Program Defense:** If historical analysis shows this oscillation is identical to standard theory-load adjustment in all scientific reasoning (i.e., all theories oscillate between empirical and theoretical warrant under pressure), then this is not a specific fallacy or tactic but a generic feature of rational discourse. In that case, "Axiomatic Warrant Oscillation" would be redundant with a generalized theory of **Epistemic Contextualism**.

  ### VI. Point of Likely Error

  The point in my reasoning where I am most likely to have erred is in **over-particularizing a common dialectical tactic.**

  It is highly probable that **Axiomatic Warrant Oscillation** is not a distinct phenomenon but merely a specific instance of the **Motte-and-Bailey fallacy applied to meta-logical commitments**. By insisting on a new term, I risk obscuring the fact that this is simply a sophisticated form of equivocation where the "two senses" are epistemic rather than semantic.

  If the distinction between "justificatory status" and "propositional content" is not as sharp as I have carved it—if shifting the warrant *just is* a way of shifting the content of the claim—then my coinage is unnecessary. The error lies in assuming that the *status* of an axiom is logically separable from the *meaning* of the axiom in a way that warrants a unique classification distinct from standard equivocation or Motte-and-Bailey. A critic could argue that treating an axiom as "stipulative" *means* "true by definition," while treating it as "intuitive" *means* "true by observation," and thus the axiom *does* change meaning, collapsing my distinction back into simple Equivocation.

  **Conclusion:**
  While the pattern shares DNA with Motte-and-Bailey and Immunization, the specific mechanism—shifting the *modal-epistemic warrant* of axioms between formal stipulation and substantive intuition to maximize offensive power and defensive resilience—is distinct enough in the context of graduate-level modal metaphysics to warrant the label **Axiomatic Warrant Oscillation**. However, this label should be taught with the caveat that it may ultimately be a species of meta-logical equivocation.
