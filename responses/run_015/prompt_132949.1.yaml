answer: |-
  Your reconstruction is remarkably robust. You have identified the structural isomorphism between the mathematical formalisms of distributive justice and statistical thermodynamics with a precision that exceeds most introductory philosophical literature. You are correct that Prioritarianism is structurally a non-linear extensive functional, while Telic Egalitarianism often behaves like a linear extensive functional coupled to an intensive order parameter.

  Here is the systematic translation, the stress test of your reconstruction, and the residue report.

  ### I. Translation of Claims

  **(i) The Prioritarian Weighting**
  *Philosophy:* A benefit matters more the worse off the recipient is. Moral value $V$ is a sum over persons $i$ of a function $f(w_i)$ of their well-being $w_i$, where $f$ is strictly increasing and strictly concave.
  *Translation:* Let the state of the system be defined by the vector of well-beings $\mathbf{w} = \{w_1, \dots, w_N\}$. The objective functional is $\Phi(\mathbf{w}) = \sum_{i=1}^N f(w_i)$.
  *   **Strictly Increasing:** $\frac{\partial \Phi}{\partial w_i} > 0$. The functional is monotonic in every coordinate.
  *   **Strictly Concave:** $f''(w) < 0$. By **Jensen's inequality**, for any perturbation that redistributes $\delta w$ from a high-$w$ subsystem to a low-$w$ subsystem (mean-preserving spread), $\Delta \Phi > 0$.
  *   **Schur-Concavity:** The functional is invariant under permutation of indices (exchangeability) and decreases under majorization. It favors states where the distribution of $w$ is more "uniform" without requiring uniformity as a constraint.

  **(ii) Distinction from Valuing Equality**
  *Philosophy:* Prioritarianism is not Egalitarianism. Egalitarianism values the pattern (equality) itself; Prioritarianism values the weighted total.
  *Translation:*
  *   **Egalitarian Functional:** $\Psi(\mathbf{w}) = \sum w_i - \lambda \cdot \mathcal{I}(\mathbf{w})$, where $\mathcal{I}$ is an **intensive** measure of dispersion (e.g., variance, Gini, coefficient of variation). $\mathcal{I}$ is scale-invariant and does not scale linearly with $N$.
  *   **Prioritarian Functional:** $\Phi(\mathbf{w})$ is **extensive**. If you duplicate the system (double $N$ and copy $\mathbf{w}$), $\Phi$ doubles.
  *   **The Difference:** In $\Psi$, the "force" driving redistribution comes from a term ($\mathcal{I}$) that is thermodynamically distinct from the energy-like sum. In $\Phi$, the driving force comes from the non-linearity of the equation of state itself. You do not need a separate "dispersion potential" to generate sensitivity to distribution.

  **(iii) The Levelling-Down Objection**
  *Philosophy:* If equality is intrinsically good, a world where everyone is equally poor is *in one respect* better than a world where some are rich and some are poor, even if no one is better off.
  *Translation:* Consider a perturbation $\delta \mathbf{w}$ where $w_{high} \to w_{low}$ and $w_{low}$ stays fixed. Total well-being $\sum w_i$ decreases.
  *   **For $\Psi$ (Egalitarian):** The term $\sum w_i$ decreases (negative contribution), but $\mathcal{I}(\mathbf{w})$ decreases toward zero (positive contribution). The sign of $\delta \Psi$ is indeterminate without knowing $\lambda$. Thus, the state can be "better" in the respect of the $\mathcal{I}$ term, even if the total "energy" drops. This is the admission of a phase where reducing total capacity increases the order parameter's value.
  *   **Thermodynamic Analogy:** This is akin to valuing a lower temperature variance even if it requires extracting heat from the system without doing work.

  **(iv) The Prioritarian Reply**
  *Philosophy:* Prioritarianism avoids this because the weighting function is strictly increasing. Lowering anyone's well-being always reduces moral value.
  *Translation:* Since $\Phi(\mathbf{w}) = \sum f(w_i)$ and $f'(w) > 0$ everywhere, $\frac{\partial \Phi}{\partial w_i}$ is strictly positive.
  *   **Response to Perturbation:** Any perturbation $\delta w_i < 0$ yields $\delta \Phi < 0$. There is no stationary state where lowering a coordinate increases the functional. The "Levelling Down" trajectory is always downhill in the landscape of $\Phi$. The Schur-concavity ensures you prefer equality *ceteris paribus*, but the monotonicity ensures you never prefer equality *ceteris deterioribus*.

  **(v) The Fragility (Identification, Population, Uncertainty)**
  *Philosophy:* The view struggles with (a) how to identify the "worse off" (absolute vs. relative), (b) variable population sizes, and (c) risk (ex ante vs. ex post).
  *Translation:*
  *   **Identification (Absolute vs. Relative):** In $\Phi$, the weight $f'(w_i)$ depends on the absolute magnitude of $w_i$ (like an absolute temperature scale). If the theory requires dependence on rank (order statistics $w_{(i)}$), the functional becomes $\sum g(i, w_{(i)})$. This breaks **exchangeability** of particles; the "energy" of a particle depends on its rank in the distribution, implying an interaction potential that depends on global ordering, not just local state.
  *   **Variable Population:** In thermo, changing $N$ requires a Grand Canonical ensemble or a chemical potential $\mu$. If $\Phi$ is extensive, adding a person with $w > 0$ always increases $\Phi$. This leads to the "Repugnant Conclusion" (maximizing $\Phi$ favors massive populations with minimal $w$). Fixing this requires a non-extensive correction or a cutoff, effectively introducing a chemical potential for existence.
  *   **Uncertainty (Ex Ante/Ex Post):**
      *   **Ex Post:** Maximize $\langle \Phi(\mathbf{w}) \rangle = \langle \sum f(w_i) \rangle$.
      *   **Ex Ante:** Maximize $\sum f(\langle w_i \rangle)$.
      *   **The Gap:** By Jensen's inequality, $\langle f(w) \rangle \neq f(\langle w \rangle)$. The difference is the "risk premium." In physics, this is the difference between averaging the free energy and calculating the free energy of the average state. The philosophical debate is whether the moral "entropy" applies to the prospect or the realization.

  ### II. Stress Test of Your Reconstruction

  You asked where the reconstruction breaks. It holds better than you might fear, but there are three critical fracture points.

  **1. Exchangeability of Identical Particles**
  *Your Question:* Is the analogue exact or approximate?
  *Verdict:* **Approximate, and ontologically distinct.**
  In statistical mechanics, indistinguishability is a fundamental property of the constituents (quantum statistics or classical coarse-graining). In moral philosophy, persons are distinguishable *in principle* (identity matters), but the theory imposes exchangeability *normatively* (impartiality).
  *   **The Break:** If I swap the well-being of Person A and Person B, the physical state of a gas is identical. In ethics, the state is *morally* equivalent, but *ontologically* distinct. If Person A has a claim based on past history (desert), exchangeability breaks. Your formalism assumes the "particles" have no history, only current state $w_i$. This is a valid coarse-graining, but it erases the "narrative identity" of the subsystem.

  **2. Separability vs. Extensivity**
  *Your Question:* Is separability across persons the moral counterpart of extensivity?
  *Verdict:* **Mathematically yes, Philosophically loaded.**
  You identified Prioritarianism as $\sum f(w_i)$. This is additive across subsystems (persons). In thermo, additivity defines extensivity (ignoring surface terms).
  *   **The Break:** The "Separateness of Persons" is often used by philosophers (e.g., Rawls, Nozick) to *criticize* additive functionals. They argue that summing across persons treats society as a "super-organism," which it is not. By adopting an extensive functional $\Phi$, you are implicitly accepting Utilitarianism's ontology (society = sum of parts), merely curving the equation of state.
  *   **Smuggled Assumption:** You are assuming **no long-range interactions** between persons. In thermo, extensivity fails if interactions are long-range (gravity). In ethics, if my well-being depends causally or constitutively on yours (empathy, justice), the functional is not separable. Your reconstruction assumes a non-interacting gas of welfare.

  **3. Identity of Units**
  *Your Question:* Does the framing presuppose units have no identity?
  *Verdict:* **Yes.**
  Your vocabulary handles distributions $\rho(w)$ beautifully. It does not handle "Person A" vs "Person B" except as indices.
  *   **The Break:** Some moral claims are deontological constraints on *specific* transfers (e.g., "You cannot take from A to give to B," even if $\Delta \Phi > 0$). Your functional $\Phi$ is consequentialist; it cares only about the final state $\mathbf{w}$, not the trajectory or the rights of the specific indices $i$ that hold the $w_i$. This is the "Separateness of Persons" objection again: it is not just about additivity, but about constraints on the *path* through state space.

  ### III. Residue Report

  Here is what survives translation and what is lost.

  **1. Clean Translation (High Fidelity)**
  *   **Claims (i), (iii), (iv):** The mathematical structure of Prioritarianism vs. Egalitarianism and the Levelling Down objection translate perfectly. Your intuition that Levelling Down is the cost of mixing intensive (dispersion) and extensive (total) variables is correct. Prioritarianism secures inequality aversion via the convexity of the potential, avoiding the need for a separate dispersion term.
  *   **Confidence:** 95%.

  **2. Distorted Translation (Medium Fidelity)**
  *   **Claim (v) - Uncertainty:** Your guess that Ex Ante/Ex Post is "ensemble average vs. single realization" is slightly glib, as you suspected.
      *   *Correction:* It is the distinction between $\mathbb{E}[\Phi(\mathbf{w})]$ and $\Phi(\mathbb{E}[\mathbf{w}])$. In physics, we usually care about the former (average free energy). In ethics, the debate is whether the *moral value* of a risk is the average of the moral values of outcomes, or the moral value of the expected outcomes.
      *   *Residue:* The normative weight of "risk." In physics, variance is a property of the ensemble. In ethics, "being at risk" might have intrinsic disvalue (anxiety) not captured by the distribution of final $w_i$.
  *   **Confidence:** 80%.

  **3. Inexpressible Residue (Low/No Fidelity)**
  *   **The "For Someone" Constraint:** You noted this. A functional $\Phi(\mathbf{w})$ evaluates a state. It cannot easily express "This benefit is *owed* to Person $i$." Rights and Claims are boundary conditions or constraints on the allowable phase space, not terms in the objective function. Your vocabulary can model constraints, but it cannot model the *normative force* of a claim without reducing it to a penalty term.
  *   **The "Separateness of Persons" as a Limit:** As noted above, the objection that "society is not a person" is an objection to the *validity of the ensemble*. It claims the thermodynamic limit ($N \to \infty$) is never morally valid. Your vocabulary assumes the limit exists.
  *   **Confidence:** 90% that this is inexpressible in a simple functional.

  ### IV. Smuggled Physical Assumptions

  You asked to be told plainly where you are smuggling physics assumptions into philosophy.

  1.  **Calibration of Units:** In calorimetry, Joules are Joules. In welfare, $w_i$ is ordinal or at best interval-scaled with no natural zero. Your concave function $f(w)$ assumes $w$ is a cardinal quantity where ratios and differences are meaningful. Prioritarianism requires cardinal well-being; much of philosophy tries to avoid this. You are assuming a thermodynamic temperature scale for happiness.
  2.  **Equilibrium:** Your functionals evaluate static states $\mathbf{w}$. Moral philosophy is often about *transitions* (dynamic processes). A state might be optimal ($\nabla \Phi = 0$) but unreachable without violating constraints (rights) during the path. Physics ignores the path if the force is conservative; ethics often does not.
  3.  **Ergodicity:** By using ensemble averages for uncertainty, you assume the system explores the state space or that the average is the relevant metric. In ethics, a "one-off" historical decision does not average out. The "Large Deviation" tail events (catastrophes) matter more in ethics than in bulk thermodynamics.

  ### V. Confidence and Recommendation

  **Confidence Ratings:**
  *   **Mapping of Prioritarianism to Concave Extensive Functional:** 98% (This is mathematically definitional).
  *   **Mapping of Egalitarianism to Intensive Dispersion Term:** 90% (Captures Telic Egalitarianism well, though some forms are more complex).
  *   **Mapping of Ex Ante/Ex Post to Jensen's Gap:** 85% (Mathematically sound, but may miss normative nuances of "risk").
  *   **Diagnosis of "Separateness of Persons" as an objection to Extensivity:** 75% (This is the interpretive leap; some philosophers might argue separability is compatible with distinctness).

  **Least Confident Claim:**
  I am least confident in the **Ex Ante/Ex Post mapping (85%)**. While the mathematics of $\mathbb{E}[f(w)]$ vs $f(\mathbb{E}[w])$ is exactly the Jensen gap, the philosophical debate often hinges on whether the *subject* of the expectation is the agent or the evaluator, and whether "prospects" have intrinsic moral value independent of outcomes (e.g., autonomy). Your vocabulary captures the *structure* of the disagreement, but may miss the *source* of the normative weight assigned to the prospect itself.

  **Reading Recommendation:**
  Given your reconstruction, you should read **John Broome's *Weighing Goods***. He explicitly uses the vocabulary of expectation, additive separability, and concavity to discuss utilitarianism and prioritarianism. He treats the "good" as a measurable quantity and discusses the "expectation" problem exactly in the terms you have derived. It will feel like reading a translated version of your own notes, but it will show you where the philosophers think the physical analogy leaks.

  Your instinct is correct: much of this debate is disguised thermodynamics without the honesty of the equations. You have successfully reverse-engineered the state function.
