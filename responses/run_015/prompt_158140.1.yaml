  **Scenario**
  A district hospital's palliative care unit faces a single budget cycle decision regarding its last box of long-acting opioid analgesia. The box contains exactly enough medication to fully treat either one patient (Patient A) or thirty patients (Patients B1–B30) for a ten-hour night shift; splitting the box renders it clinically ineffective for all. Patient A is in severe, unmanaged agony (Intensity 10/10); Patients B1–B30 are in moderate, persistent pain (Intensity 3/10). All patients exist regardless of the choice, there are no knock-on effects, and the clinical effectiveness per unit is identical. Treating pain also restores minor capacity for comfort (eating, sleeping); untreated pain precludes this. The decision is purely consequentialist: allocate the box to minimize suffering or maximize welfare according to the specified ethical view.

  **(1) Cardinal Scale and Inputs**
  *   **Suffering Scale:** 0 (none) to 10 (agony). Units = Intensity × Hours.
  *   **Welfare Scale:** -10 (agony) to +10 (bliss). Baseline = Negative of Suffering.
  *   **Patient A (The One):**
      *   Pain Intensity: 10. Duration: 10 hours. **Raw Suffering:** 100 units.
      *   Baseline Welfare: -100.
      *   Relief Gain: 100 suffering units averted.
      *   Comfort Gain: 10 welfare units (pleasure) added if treated.
      *   **Total Welfare Gain:** 110 units.
  *   **Patients B (The Thirty):**
      *   Pain Intensity: 3. Duration: 10 hours. **Raw Suffering:** 30 units each.
      *   Baseline Welfare: -30.
      *   Relief Gain: 30 suffering units averted each.
      *   Comfort Gain: 3 welfare units (pleasure) added each if treated.
      *   **Total Welfare Gain (per person):** 33 units.
      *   **Total Welfare Gain (group):** 990 units.
  *   **Priority Thresholds (for Prioritarian Views):**
      *   *Negative Prioritarianism:* Any suffering unit above Intensity 5 is weighted ×100; below ×1.
      *   *Ordinary Prioritarianism:* Any welfare gain for a person with Baseline Welfare below -50 is weighted ×100; above ×1.

  **(2) Arithmetic Under Four Views**
  *   **Aggregating Suffering-Focused (Minimize Sum of Suffering):**
      *   Option A (Treat One): Averts 100 units.
      *   Option B (Treat Many): Averts $30 \times 30 = 900$ units.
      *   **Verdict:** Choose Many (900 > 100).
  *   **Classical Total Utilitarianism (Maximize Sum of Welfare):**
      *   Option A (Treat One): Gain 110 units.
      *   Option B (Treat Many): Gain $30 \times 33 = 990$ units.
      *   **Verdict:** Choose Many (990 > 110).
  *   **Negative Prioritarianism (Priority to Worst Suffering):**
      *   Option A (Treat One): 100 units @ Intensity 10 (Above Threshold). Weighted Value: $100 \times 100 = 10,000$.
      *   Option B (Treat Many): 900 units @ Intensity 3 (Below Threshold). Weighted Value: $900 \times 1 = 900$.
      *   **Verdict:** Choose One (10,000 > 900).
  *   **Ordinary Prioritarianism (Priority to Worst Welfare):**
      *   Option A (Treat One): Gain 110 units @ Baseline -100 (Below Threshold). Weighted Value: $110 \times 100 = 11,000$.
      *   Option B (Treat Many): Gain 990 units @ Baseline -30 (Above Threshold). Weighted Value: $990 \times 1 = 990$.
      *   **Verdict:** Choose One (11,000 > 990).

  **(3) Robustness Pass (Pleasure Variations)**
  *   **Set Pleasure Gains to Zero:**
      *   Aggregating Suffering: A=100, B=900. Verdict: Many (Unchanged).
      *   Total Utilitarianism: A=100, B=900. Verdict: Many (Unchanged).
      *   Negative Prioritarianism: Suffering weights unchanged. Verdict: One (Unchanged).
      *   Ordinary Prioritarianism: Welfare gains drop to 100 (A) and 900 (B). Weights unchanged (A below -50, B above). Weighted A=10,000, B=900. Verdict: One (Unchanged).
  *   **Double Pleasure Gains (A=20, B=6 each):**
      *   Aggregating Suffering: Pleasure irrelevant. Verdict: Many (Unchanged).
      *   Total Utilitarianism: A=120, B=1,080. Verdict: Many (Unchanged).
      *   Negative Prioritarianism: Pleasure irrelevant. Verdict: One (Unchanged).
      *   Ordinary Prioritarianism: A=120 (Weight 100) = 12,000. B=1,080 (Weight 1) = 1,080. Verdict: One (Unchanged).
  *   **Report:** No verdicts move. The divergence is driven by the weighting structure (summing vs. priority), not the pleasure inputs.

  **(4) Ablation Study**
  *   **Vary Single Patient Severity:** If Patient A's pain drops to Intensity 4 (Below Threshold), Negative Prioritarianism switches to Choose Many (Weighted A=100 vs B=900). The pivot is the severity threshold.
  *   **Vary Group Size:** If the group grows to 300 patients, Aggregating Suffering still chooses Many (9,000 > 100). Negative Prioritarianism (Lexical) still chooses One (10,000 > 9,000). If using Convex Weighting (e.g., $Intensity^3$) instead of Lexical, the Many would eventually overwhelm the One at sufficient $n$. The pivot is the weighting function (Lexical vs. Convex).
  *   **Lexical vs. Convex:** With Lexical weights, the Two Camps never reconverge on this case regardless of $n$ (provided B stays below threshold). With Convex weights, they reconverge when $n$ is large enough that $\sum w(I_B) > w(I_A)$. The structural feature doing the work is the *non-linearity* of the moral weight assigned to severity.

  **(5) Uncomfortable Implications**
  *   **Aggregators:** Must accept writing off an identifiable person in agony to relieve a larger number of people from moderate discomfort. This feels like a betrayal of the worst-off.
      *   *Strongest Reply:* "A unit of suffering is a unit of suffering. To ignore the sum is to allow greater total misery for the sake of a pattern."
  *   **Prioritarians:** Must accept spending the entire budget on one person while thirty others remain in pain. This feels like neglect of the many.
      *   *Strongest Reply:* "Severity matters morally. Agony is not just 'more' pain; it is a different moral category that demands rescue before moderate needs are met."
  *   **Note:** Neither side is forced into inconsistency; both are forced into counterintuitive sacrifices (the agonized individual vs. the moderate multitude).

  **(6) Closing Verdict**
  This case establishes that the fundamental fault line in suffering-focused ethics is not between negative and positive welfarism, but between **aggregation** and **priority**. Both Total Utilitarianism and Aggregating Suffering-Utilitarianism converge on the Many because they sum units linearly. Both Ordinary Prioritarianism and Negative Prioritarianism converge on the One because they weight units non-linearly based on severity. The case has no force against a prioritarian who accepts the cardinal scale; rather, it validates their view as structurally identical to mainstream prioritarianism. The objection lands only against the package of *pure summation* plus *interpersonally comparable cardinal scales*, showing that suffering-focused ethics is not a monolith but a family divided by the same mathematical cleavage as general welfare ethics.
