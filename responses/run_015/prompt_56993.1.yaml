answer: |-
  The rain against the single-glazed office window blurred the view of the Humber estuary into a grey smear. Inside, the server hummed, a steady drone beneath the clatter of Arthur's keyboard. On the screen, the hydrograph climbed, peaked, and receded. It overlaid the historical data from the 1982 surge almost perfectly.

  "It's within a centimetre," Arthur said, not turning around. "Root mean square error is negligible. We can sign off the pile depths."

  Priya leaned against the doorframe, holding a clipboard like a shield. "The soil samples from borehole four came back. It's non-cohesive sand. Gravelly. Your model assumes cohesive clay."

  Arthur spun his chair. "And yet the scour depth prediction matches the 1982 inspection records. If it walks like a duck."

  "It walks like a duck because you've told it ducks have webbed feet made of lead," Priya said, stepping into the room. She dropped the clipboard on his desk. The core samples sat in plastic sleeves, gritty and pale. "Cohesive soil resists erosion differently. It flakes. This stuff shifts. You're modelling the wrong physics."

  "I'm modelling the water levels," Arthur corrected. "The client cares about whether the bridge stands, not the mineralogy of the riverbed. The output predicts the scour hole within five per cent. That's better than the CFD suite costs us three times as much to run."

  "It's predicting right for the wrong reason," Priya said. "That's not prediction. That's luck."

  "It's calibration."

  Priya pulled up a chair and plugged her laptop into the secondary monitor. "Watch." She loaded the parameter file, highlighted the sediment classification line, and changed the integer from '1' (Cohesive) to '2' (Non-cohesive). She hit run.

  The simulation churned. The graph regenerated. The predicted scour depth jumped by two metres.

  "See?" Arthur said. "It overestimates. If we build to that, we're driving piles into the bedrock for no reason. That's four million pounds of concrete the client doesn't have."

  "So we dig into why it was wrong," Priya said. She pulled up the raw input data from 1982. "I checked the archive logs. The flow velocity gauge upstream was fouled during the surge. It reads low."

  Arthur frowned. "By how much?"

  "About fifteen per cent." Priya typed again. She adjusted the velocity input to compensate for the fouling, keeping the soil type as non-cohesive. "Higher velocity erodes sand faster. But your model thinks the soil is clay, which erodes slower. Your error in soil type cancels out the error in velocity input."

  The graph shifted again. The peak scour depth dropped back down, aligning with the historical mark. The line was true, but the path to get there had changed.

  "There," Arthur said. "It works."

  "It works only if the velocity gauge error is constant," Priya said. "But we don't have a gauge there anymore. We're using satellite telemetry now. To use this corrected model, we have to assume the satellite data correlates linearly with the old fouled gauge across different flow regimes."

  "Does it?"

  "We don't know. There's no data for surges this big. So we'd be assuming a relationship that might not exist. That's a new false assumption. And it's worse. At least the soil type is a physical property we can go and touch. Assuming a linear correlation on telemetry is a black box."

  Arthur leaned back, rubbing his eyes. "So, option one: I keep the clay assumption. It predicts historical data perfectly. We know the errors cancel for this specific river profile. Option two: We use the honest soil type, assume a correlation we can't verify, and risk the model breaking if the flow dynamics shift slightly."

  "Option three," Priya said. "We admit we don't know the mechanism. We add a safety factor. We drive the piles deeper."

  "Four million pounds," Arthur repeated. "Vance will kill us."

  "Vance cares about liability," Priya said. "If the physics are wrong, the model doesn't extrapolate. If we get a one-in-five-hundred-year flood, the cancellation might not hold. The velocity error might change, but the soil won't. Then your model fails."

  "My model predicts," Arthur said. "That's the job. We aren't paid to write geology textbooks. We're paid to say how deep the holes need to be."

  "We're paid to keep the bridge up," Priya countered. "A model whose errors you can't localise is a model you can't safely extend. You're building on a coincidence."

  They sat in the silence of the server room. The rain intensified, drumming against the glass.

  The meeting with Vance was brief. The three of them stood around the printed hydrographs spread on the conference table. Vance, a man who wore suits that cost more than the modelling software, tapped the paper where the lines diverged.

  "Explain the gap," Vance said.

  "Arthur's model matches history," Priya said. "But it assumes the riverbed is clay. It's sand. It matches because the input velocity data is also wrong. They cancel out."

  "And the fix?"

  "Fixing the soil breaks the prediction unless we assume a correlation in the new telemetry data that we cannot verify," Priya said. "It introduces a different kind of uncertainty."

  Arthur spoke before Vance could turn to him. "The current model is validated against the only extreme event we have on record. It produces a number that aligns with observed reality. The alternative requires us to budget for a risk profile we can't quantify."

  Vance looked at the bottom line of the cost estimate. The difference between Arthur's depth and Priya's safety factor was stark.

  "If we use Arthur's model," Vance said, "and the errors stop canceling?"

  "Then the scour is deeper than predicted," Priya said. "The foundation could be exposed. We'd need retrofitting. Or the bridge fails."

  "If we use Priya's safety factor," Arthur said, "we waste four million pounds of client money on concrete that doesn't add value under normal conditions. We lose the contract to the French firm who will use the cheaper model."

  Vance picked up a pen. He twirled it, watching the light catch the steel nib. He wasn't looking at the graphs anymore; he was looking at the liability waiver form on the desk.

  "The client wants the budget," Vance said quietly. "They've signed off on the risk allocation. They know the models are approximations."

  "They don't know the approximation is a coincidence," Priya said.

  "They know we guarantee the work," Vance said. He looked at Arthur. "Can you sign the certification?"

  Arthur looked at the graph. The line was perfect. It matched the past. It promised a future that looked like the past. He thought about the sand, gritty and shifting, and the fouled gauge from forty years ago. He thought about the four million pounds vanishing into the ground, useless, versus the risk of a signature.

  "The model predicts within tolerance," Arthur said. His voice was flat. "I can sign it."

  Priya didn't move. She just closed her laptop. The click was loud in the quiet room.

  Vance signed the waiver. He slid the contract across the table to Arthur. "Get the piles ordered. We break ground Monday."

  Arthur took the pen. He signed his name. The ink dried quickly on the glossy paper. Outside, the tide was coming in, heavy and brown, pushing against the estuary banks, testing the soil, waiting to see if the math held.

  "Right," Vance said, standing up. "Good work. Let's not spend the contingency unless we have to."

  He left the room. Priya remained standing by the window, watching the water rise. Arthur gathered the papers, stacking the perfect graphs on top of the soil reports. He put them in the bin.

  "See you Monday," Arthur said.

  "Monday," Priya said. She didn't turn around.

  Arthur switched off the server. The hum died away, leaving only the sound of the rain and the river, both flowing where they wished, indifferent to the assumptions made on dry land. He locked the office door and walked out into the corridor, the weight of the signature settling in his chest, heavy as concrete.
