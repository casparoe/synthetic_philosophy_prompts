          *   *Representation:* ML often assumes a shared latent space (embeddings). Locke explicitly denies the ideas are the *same* initially. The tactile idea of a globe and the visual idea of a globe are *distinct ideas* that get associated. In ML, we often assume "globe" is a single class label. For Locke, "globe-by-touch" and "globe-by-sight" are different keys that get linked.
          *   *The "Judgment" nuance:* Locke uses "judgment" loosely here. It's not rational deliberation. It's associative conditioning. The ML analogy of "inference after training" captures the "without taking notice" aspect well.
      *   *Verdict:* The analogy is strong (80-90%), but the "cross-modal transfer" part needs tweaking. It's not that tactile weights transfer to visual layers. It's that a *new* visual layer needs to be trained to map to the *existing* tactile labels.

  5.  **Deconstruct Question 4: "In Grown People" & Infants:**
      *   *Why qualify?* Locke believes infants *do* see flat patches. They haven't built the lookup table yet.
