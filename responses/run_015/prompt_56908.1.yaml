      *   *Why?* Because the connection between the *idea* of touch (sharp angle vs. smooth curve) and the *idea* of sight (shaded flat circle vs. shaded flat square-ish shape) is not innate. It must be learned through experience (association).
      *   *Why was it a "Problem"?* The user asks: "the theory seems to hand him the answer for free."
          *   *Correction:* It *does* hand the answer for free *if* you accept Locke's Empiricism. The "problem" was a test case against *Nativists* (like Descartes or Cambridge Platonists) who believed ideas of space/shape were innate. If the blind man *could* distinguish them, it would prove innate ideas (common geometry shared by touch and sight). If he *couldn't*, it supports Empiricism (ideas come from specific senses and must be linked by experience).
          *   *Significance:* It wasn't a puzzle for Locke; it was a *weapon* for Locke. Molyneux asked Locke; Locke said "No" and put it in the next edition of the *Essay* to bolster his argument.

