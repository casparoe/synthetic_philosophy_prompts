      *   *Replacement vs. Tagging:* This is tricky. Locke says the judgment "alters the appearances into their causes." It doesn't necessarily *delete* the 2D idea, but the *perception* becomes the 3D object. He often suggests we are unaware of the 2D stage because the judgment is so fast ("without our taking notice"). It's not a conscious tag; it's an automatic overwrite of the *experienced* reality, even if the *sensory* input remains 2D.
      *   *Dev Analogy:* It's like a UI rendering engine. The raw data is pixels (2D), but the UI framework (judgment/habit) renders a "button" object. You interact with the button, not the pixels, even though the button *is* pixels.

  3.  **Deconstruct Question 2: Molyneux's Problem & Locke's Prediction:**
      *   *The Setup:* Blind man knows cube vs. globe by touch. Gains sight. Can he distinguish them by sight *before* touching?
