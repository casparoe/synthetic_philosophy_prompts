answer: |-
  ### HANDOUT: SUNDAY NIGHT PHILOSOPHY
  **Topic:** Particularism vs. Generalism  
  **Time:** 90 Minutes  
  **Word Limit:** Max 900 Words  

  **The Question**

  We have distinguished between **fade-cases** (where a reason still counts but is outweighed) and **flip-cases** (where a feature that is usually a reason *for* an action becomes a reason *against* it). 

  Write an essay that argues for the following claim: **Flip-cases are the only objection to Generalism that matters, but they ultimately destroy the usefulness of moral principles.**

  In your answer, you must:
  1. Explain why Generalists can easily handle fade-cases but struggle with flip-cases.
  2. Present the strongest Generalist reply to flip-cases (e.g., hedging or fine-graining the principle).
  3. Argue why this reply fails to offer actual guidance to someone who doesn't already know the right answer.
  4. Conclude by deciding whether Particularism is self-defeating for making a "general claim" about there being no general claims, or if this doesn't matter.

  *Note: Answers that refuse to take a side on whether principles are useful will be capped at 10/20.*

  ***

  ### MODEL ANSWER

  The distinction between fade-cases and flip-cases is not just a technical detail; it is the fault line where Generalism breaks. A fade-case is straightforward: you promised to meet a friend, but your child gets sick. The promise still counts as a reason to go, but it is outweighed by the emergency. Generalism handles this easily with a weighing model. Principles can have exceptions or be "overridden" without changing their fundamental nature. A rule like "keep promises" remains true even if it loses a specific battle.

  Flip-cases are different. Here, the feature itself changes direction. Usually, causing pleasure is a reason to act. But if the pleasure is derived from someone else's humiliation, that same pleasure becomes a reason *not* to act. It isn't just outweighed; it has flipped valence. This breaks the Generalist machinery because it suggests that a feature has no moral weight on its own. It only has weight depending on the context. If the same feature can be a reason for and a reason against, you cannot write a principle that says "Pleasure is good" without adding an endless list of exceptions.

  The Generalist has a strong reply to this. They argue that principles are not simple slogans but complex, hedged statements. They might say the principle isn't "Pleasure is good," but rather "Pleasure is good *in the absence of malice*." Alternatively, they might argue we need to describe the feature more finely. It isn't "pleasure" that is the reason, but "innocent pleasure." By building the context into the principle itself, the Generalist claims they can preserve the rule. The rule doesn't flip; we just weren't describing the rule accurately enough.

  However, this defense creates a fatal problem for guidance. The whole point of a moral principle is to help someone decide what to do when they are unsure. If the principle is "Do X, unless the context makes X bad," it is useless to someone who cannot already tell whether the context makes X bad. To know if the "malice" exception applies, you already need to have made the moral judgement the principle was supposed to help you with. The principle becomes a description of the answer rather than a tool for finding it. It is like a map that says "Go North, unless South is better." If you know South is better, you don't need the map. If you don't, the map doesn't help.

  This leads to the final worry: Is Particularism self-defeating? Particularism claims there are no true moral principles. But isn't that claim itself a general principle? If it is true, it seems to undermine itself. However, this is a confusion about levels. Particularism is a claim about the structure of moral reasons, not a moral rule itself. It is like saying "There is no single recipe for all meals." That statement is generally true, even though it isn't a recipe. It describes how cooking works without telling you what to cook.

  Therefore, the verdict must be that flip-cases destroy the utility of Generalism. The Generalist can save their principles only by making them so specific and hedged that they require the very judgement they are supposed to guide. We should stop arguing about whether principles exist in the abstract. The live dispute is about whether learning ethics is learning a set of rules, or learning a sensitivity to context. Since flip-cases show that context determines the rule, not the other way around, we must accept that moral judgement is a skill of perception, not a calculation of fixed values. Principles might be useful summaries after the fact, but they cannot be the engine of decision-making.

  ***

  ### MARKING SCHEME (Total: 20 Marks)

  **1. Distinction between Fade and Flip (4 Marks)**
  *   **Must Hit:** Clearly defines fade (outweighed) vs. flip (valence change) and explains why fade is easy for Generalists (weighing model).
  *   *Common Error:* Treating flip-cases as just "really strong" fade-cases where the other side wins big.

  **2. The Generalist Defense (4 Marks)**
  *   **Must Hit:** Charitably explains how Generalists fix flip-cases (hedging principles or fine-graining features).
  *   *Common Error:* Attacking a strawman version of Generalism that insists on simple, exceptionless slogans.

  **3. The Guidance Objection (4 Marks)**
  *   **Must Hit:** Argues that hedged principles require prior moral knowledge to apply, rendering them circular or empty for guidance.
  *   *Common Error:* Saying principles are useless just because they are hard to follow, rather than because they presuppose the answer.

  **4. The Meta-Level Issue (4 Marks)**
  *   **Must Hit:** Addresses whether Particularism contradicts itself by making a general claim, and resolves it (e.g., distinction between moral rules and claims about reasons).
  *   *Common Error:* Getting stuck on the paradox and refusing to move past it, or ignoring it entirely.

  **5. Definite Verdict (4 Marks)**
  *   **Must Hit:** Takes a clear side on whether principles are useful for guidance/decision-making (as per the prompt's instruction).
  *   *Common Error:* **FENCE-SITTING:** Concluding "it depends on how you define principle" or "both sides have points." (Cap total score at 10/20 if this occurs).

  ***

  ### NOTE ON THE MODEL ANSWER

  The model answer leans on a contested reading of Generalism that assumes moral principles must be **action-guiding tools available prior to judgement**. Some Generalists argue principles are merely "default reasons" or summaries of past judgements, not algorithms for decision-making. If your group reads Generalism as merely claiming "there are patterns in morality" rather than "you can use rules to decide," the Guidance Objection in paragraph 4 will seem less decisive.
