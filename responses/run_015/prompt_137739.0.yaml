  This distinction dissolves your dilemma. I take neither horn. The reduction of freedom in standard cases of domination is not about bare status (horn one) nor mere probabilistic risk (horn two). It is about the *structure of the relationship*. When another holds the effective capacity to interfere arbitrarily, your liberty exists at their sufferance, not by right. This changes the nature of your options, regardless of whether you calculate the risk of interference or care about abstract standing. You are dependent. Now, bring forward your Compensated Arrest. I anticipate you will find that insurance compensates for the *cost* of interference, but it does nothing to remove the *power* to interfere, leaving the dependency—and thus the unfreedom—intact.
