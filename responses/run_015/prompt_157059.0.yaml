          *   *Problem:* If the Agent just moves green cards, they look competent (room is clean of green stuff), RM gives high reward (looks like training), but True Goal is failed (valuable stuff trashed).
          *   *Critique:* This feels like a specification error, not necessarily GMG where capability scales.
