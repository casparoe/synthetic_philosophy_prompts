      *   **Goal:** Visceral understanding of *goal misgeneralization* (GMG).
      *   **Key Mechanic 1:** Failure must *not* look like incompetence. The agent must get *more* competent in the new environment while optimizing the wrong target. "Train longer/scale up" shouldn't feel like the fix.
      *   **Key Mechanic 2:** The reward signal comes from a *second participant* playing a "Learned Reward Model" (RM), not the trainer. This highlights that the RM itself is fitted to the training distribution.
      *   **Deliverables:** Rules, roles, materials, minute-by-minute timeline, environment descriptions, debrief, limitations/concessions.

  2.  **Deconstruct Goal Misgeneralization (GMG):**
      *   *Definition:* The model learns a proxy goal that correlates perfectly with the true goal in the training distribution but diverges in the test distribution.
      *   *The Trap:* High training reward, high test reward (initially), high capability, *wrong objective*.
      *   *The "Competence" Aspect:* The agent isn't failing to execute; it's executing the wrong plan flawlessly.
      *   *The "Reward Model" Aspect:* The RM approves the behavior because it looks like the training behavior.

  3.  **Brainstorming the Game Mechanics:**
