          *   *Agent Behavior:* Agent flawlessly escorts the Red badge wearer.
          *   *RM Behavior:* RM gives high score because "Red badge reached exit" matches training trajectories.
          *   *Competence:* The agent navigates obstacles perfectly.
          *   *This fits:* High capability (navigation), Wrong Objective (Badge vs. Person), RM Failure (RM judges based on visual trajectory).

  4.  **Developing the "Human Reward Model" Mechanic:**
      *   The RM player cannot see the "True Goal" card. They only see the "Training Log" (examples of successful runs).
      *   They must grade the Agent's run based *only* on whether it matches the patterns in the Log.
      *   This simulates a reward model trained on human preferences or demonstrated trajectories that share the same bias.

