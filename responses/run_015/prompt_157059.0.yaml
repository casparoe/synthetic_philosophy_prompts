          *   *Cons:* Hard to make "competence" look high while failing the true goal without it looking like a mistake.
      *   *Idea 2: Sorting/Classification.* Agent sorts cards.
          *   *Pros:* Easy with cards.
          *   *Cons:* A bit dry, doesn't feel like "optimization."
      *   *Idea 3: Resource Gathering/Crafting.* Agent collects items to build something.
          *   *Pros:* Allows for complex behavior.
