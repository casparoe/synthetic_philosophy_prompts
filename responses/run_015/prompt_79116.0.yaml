answer: |-
  This session is designed to simulate the historical and logical situation surrounding the Church–Turing Thesis (CTT) without naming it until the end. The students will enact the **convergence** of formalisms and then confront the **epistemic gap** regarding the informal notion of "effective calculability."

  ### Session Overview
  *   **Time:** 90 Minutes
  *   **Students:** 20 (Mixed CS/Philosophy)
  *   **Room:** Whiteboard, tables for groups, no computers.
  *   **Goal:** Students construct three distinct computational models, prove their equivalence empirically, and then encounter a boundary case that reveals why this equivalence is not a proof of universality.

  ---

  ### 1. Materials to Prepare in Advance

  You need three distinct "Architectures." Do not label them with standard CS names (e.g., do not say "Turing Machine").

  **A. The Rule Decks (Printed on colored cardstock)**
  Create three decks of 20 cards each. Each deck defines the *only* allowed operations for that group.
  *   **Red Deck (The Tape):** `Move Left`, `Move Right`, `Read Symbol`, `Write Symbol`, `Goto State X`. (State is tracked on a separate whiteboard section).
  *   **Blue Deck (The Rewriter):** `Find Pattern P`, `Replace with Q`, `Restart Scan`. (Operates on a string of symbols on a line).
  *   **Green Deck (The Counter):** `Increment Register`, `Decrement Register`, `If Zero Jump`, `Halt`. (Operates on two integer variables).

  **B. The Problem Sheets**
  *   **Task 1 (Warmup):** Input `111` (unary 3). Output `1111` (unary 4). (Function: $n+1$)
  *   **Task 2 (Convergence):** Input `11` (unary 2). Output `1111` (unary 4). (Function: $2n$)
  *   **Task 3 (The Boundary):** "Compute the function that returns 1 if the Red Group's program on Input $n$ halts, and 0 otherwise."

  **C. The "Oracle" Card (One only)**
  *   A gold card labeled **`OMNISCIENT STEP`**. Text: *"You may replace any sequence of moves with the correct final answer in a single step, provided the answer exists."*

  **D. Room Setup**
  *   Three tables. Whiteboard divided into three sections (one for each group to display their "tape" or "register" state).
  *   Index cards and markers for notes.

  ---

  ### 2. Timeline and Procedure

  #### 0:00 – 0:05 | Introduction (The "Black Box" Frame)
  *   **Instructor:** "We are investigating the limits of mechanical calculation. I am not going to define 'computation' for you. Instead, you will become three different calculation engines. Your goal is to process inputs into outputs using *only* the rules on your cards."
  *   **Constraint:** "You are human computers. You must be able to perform every step without insight, intuition, or looking ahead. If a rule requires you to 'know' something you haven't derived, it is illegal."
  *   **Grouping:** Divide class into Red, Blue, Green (6-7 students each). Assign roles: *Operator* (moves the cards), *Scribe* (writes the state), *Auditor* (checks rules against the deck).

  #### 0:05 – 0:35 | Phase 1: Internal Consistency (Building the Machine)
  *   **Task:** Each group must solve **Task 1 ($n+1$)** using their specific Rule Deck.
  *   **Action:** They must write down the "program" (sequence of cards) that transforms the input to the output.
  *   **Instructor Role:** Circulate. Enforce the "no insight" rule strictly.
      *   *Intervention:* If Red tries to "just write a 1 at the end," stop them. They must *move* to the end, then *write*.
      *   *Intervention:* If Green tries to "multiply by 2," stop them. They only have Inc/Dec. They must build a loop.
  *   **Outcome:** All three groups successfully halt with the correct output. They have validated their own architecture.

  #### 0:35 – 0:65 | Phase 2: Cross-Implementation (The Convergence)
  *   **Task:** Solve **Task 2 ($2n$)**.
  *   **The Twist:** Group Red must design the logic for $2n$, but they cannot run it. They must hand their *logic description* to Group Blue. Group Blue must implement that logic using *only Blue Rules*. Group Green audits the translation. Then rotate (Blue designs, Green implements, Red audits).
  *   **Goal:** Establish that a problem solvable by one is solvable by the others.
  *   **Instructor Role:** Do not help with the translation. Let them struggle with the inefficiency.
      *   *Observation:* Red will describe "loops." Blue will struggle to express "loops" with string rewriting. Green will find "loops" easy with `If Zero Jump`.
      *   *Key Moment:* When they succeed, ask: "Did any group encounter a function the others could not do?" (Expected answer: No).
  *   **Board Work:** Write on the board: **Red = Blue = Green**.

  #### 0:65 – 0:80 | Phase 3: The Boundary (The Epistemic Gap)
  *   **Task:** Distribute **Task 3 (The Halting Function)**.
  *   **Instruction:** "Design a machine that solves this."
  *   **Predictable Reaction:** They will realize they cannot do this with their current decks.
  *   **The Intervention:** Hand the **Gold Oracle Card** to one group (e.g., Green). Tell them: "You are now allowed to use this primitive. It is a single mechanical step."
  *   **The Conflict:**
      *   Green can now solve Task 3 easily.
      *   Red and Blue cannot.
      *   **Equivalence Broken:** Green > Red/Blue.
  *   **The Philosophical Trap:** Ask the class: "Is the Green machine with the Oracle Card a valid 'mechanical procedure'?"
      *   *CS Students:* "No, it's not implementable."
      *   *Phil Students:* "Is the rule finite? Yes. Is it deterministic? Yes. Why is it excluded?"
  *   **Instructor Action:** Do not resolve this yet. Let the tension sit. Ask: "What evidence would you need to accept the Oracle Card as a valid form of human computation?"

  #### 0:80 – 0:90 | Debrief (Naming the Thesis)
  *   **Reveal:** "What you just built are variants of Turing Machines, Post Canonical Systems, and Register Machines. The claim that Red=Blue=Green is the **Church–Turing Thesis**."
  *   **Map the Experience:**
      1.  **Convergence:** You felt the power of Red=Blue=Green. This is the empirical support for the Thesis. Independent formalisms pick out the same class.
      2.  **The Gap:** When Green used the Oracle, they broke the equivalence.
      3.  **The Student's Question:** "What counts as evidence against the thesis?"
          *   *Answer:* Exactly what Green just did. If you can define a step that is **finite**, **mechanical** (no insight), and **unambiguous**, but allows you to compute non-recursive functions (like the Halting Problem), you have falsified the Thesis.
          *   *Why we reject the Oracle:* We intuitively feel the Oracle step requires "infinite lookup" or "insight," violating the *informal* notion of "mechanical." But that informal notion is not formally defined. That is why CTT is not a theorem.

  ---

  ### 3. Handling Predictable Failures

  **Failure 1: The "Magical Primitive" in Phase 1**
  *   *Scenario:* A group sneakily adds a rule like "If pattern matches Halting State, Stop" to their deck to make Task 1 easier.
  *   *Handling:* Do not dismiss it. This is a teaching goldmine.
  *   *Response:* "Okay, you added a rule. Can a human execute that rule without knowing the future of the computation? If no, it violates the 'mechanical' constraint. If yes, you have just proposed a counter-example to the standard models. Write that rule on the board. We will test it in Phase 3."
  *   *Why:* This validates the student's intuition that the *definition* of the step is the weak point, not the math.

  **Failure 2: Trivial Tasks**
  *   *Scenario:* Students argue that $n+1$ is too simple to prove equivalence.
  *   *Handling:* Acknowledge this. "You are right. In 1936, Church and Turing didn't just check $n+1$. They proved equivalence for *all* number-theoretic functions. We don't have time for that proof, so we have to rely on the *feeling* of translation difficulty. Did you feel the struggle of translating 'Loop' into 'Rewrite'? That struggle is where the mathematical work happens."

  **Failure 3: Confusion on "Mechanical"**
  *   *Scenario:* Students argue the Oracle is mechanical because it's a written rule.
  *   *Handling:* Distinguish between *syntax* and *execution*. "The rule is syntactically finite. But can a human *perform* it in finite time without magic? The Thesis claims 'Mechanical' implies 'Physically/Symbolically executable without insight.' The Oracle fails the execution test, even if it passes the syntax test."

  ---

  ### 4. What This Activity Cannot Reproduce (Instructor Notes)

  You must supply these three points verbally in the debrief, as the classroom constraints cannot simulate them:

  1.  **Historical Independence:** In the room, you assigned the rule sets. Historically, Turing, Church, Post, and Gödel arrived at these systems independently, motivated by different problems (logic, foundations of math, decision problems). The "miracle" of CTT is that they didn't coordinate. You must tell them: *"You were told to build different machines. They didn't know about each other."*
  2.  **The Rigor of Equivalence:** In the room, they established Red=Blue by doing two tasks. In reality, the equivalence is proven mathematically for the set of *all* computable functions. The activity simulates the *phenomenon* of equivalence, not the *proof*.
  3.  **The Informal Notion:** The activity fails to capture the true vagueness of "effective calculability." In the game, the rules were written on cards (formal). In reality, the left-hand side of the CTT equation is a philosophical intuition about what a human with paper and pencil can do. The "Evidence Against" the thesis requires bridging the gap between physical reality (or new mathematical intuition) and that specific informal notion.

  ### 5. Answering the Student's Question (For your preparation)

  When the student asked, *"What would count as evidence against the thesis?"*, the poor answer was likely "Nothing, it's true."
  The correct answer, which this session leads to, is:
  **"A coherent description of a physical or logical process that satisfies the informal criteria of 'mechanical procedure' (finite, deterministic, no insight) but computes a function that is not Turing-computable."**

  Examples you can mention in the debrief:
  *   **Hypercomputation:** Machines that perform infinitely many steps in finite time (Zeno machines).
  *   **Physical Oracles:** If the universe allows measuring a physical constant with infinite precision in finite time, and that constant encodes the Halting Problem.
  *   **Human Intuition:** If a human can consistently decide the Halting Problem for TMs using "insight" that can be codified into a rule.

  The session works because it lets them *feel* the stability of the standard models (Red=Blue=Green) and then *feel* the fragility of the definition when the Oracle Card is introduced.
