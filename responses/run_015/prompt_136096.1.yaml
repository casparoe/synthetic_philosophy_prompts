  **JOINT STATEMENT ON THE COUNTERFACTUAL-BUFFER MACHINE**

  **I. Agreed Claims**

  1.  **Logical Structure:** The Counterfactual-Buffer Machine (CBM) argument successfully isolates 'causal impact on physical reality' as the sole variable differing from actual life, holding 'phenomenal quality' and 'internal counterfactual responsiveness' constant.
  2.  **Empirical Pattern:** Naive subjects predominantly reject permanent entry into the CBM despite guarantees of positive phenomenology and internal agency, indicating a robust initial aversion to simulation.
  3.  **Locus of Disagreement:** The fundamental dispute concerns whether pleasure's contribution to welfare is unconditional (dependent solely on experience) or mediated by an actual relation to an independent reality (dependent on ontological status).

  **II. Disagreements Table**

  | Issue | Phenomenal Hedonist Formulation | Reality-Contact Objectivist Formulation |
  | :--- | :--- | :--- |
  | **Status of Reality Contact** | Contact with reality is an **instrumental condition**; it is valuable only insofar as it causally produces positive phenomenal states. | Contact with reality is a **primitive welfare good**; it is constitutive of well-being independent of its phenomenal yield. |
  | **CBM vs. Static Simulation** | Welfare is **identical** in both cases; welfare supervenes on phenomenology, so indistinguishable experiences yield equal well-being. | Welfare **diverges**; the CBM is superior to static simulation due to internal agency, but both are inferior to reality due to lack of external impact. |

  **III. Specified Cruxes**

  **Crux 1: The Source of Intuitive Aversion**
  *   **Question:** Does intuitive aversion to entering the machine track a genuine welfare-relevant feature or an evolutionary bias toward causal tracking?
  *   **Concrete Case:** **The Disclosure Effect.** Subjects engage in a task with fixed positive phenomenology; half are told the environment is real, half are told it is a CBM simulation.
  *   **Predicted Outcomes:**
      *   *Hedonist:* Welfare ratings will remain **statistically identical** across groups; any reported distress is a cognitive error unrelated to actual well-being.
      *   *Objectivist:* Welfare ratings will **drop significantly** in the CBM group; the disclosure reveals a deficit in the primitive good of reality contact.

  **Crux 2: The Time-Relativity of Well-Being**
  *   **Question:** Is well-being time-relative, such that entering the machine could be rational at one time but leaving it rational at another, independent of phenomenal changes?
  *   **Concrete Case:** **The Mid-Life Exit Option.** Subjects enter the CBM at age 30 and are offered a one-time exit window at age 50, with guaranteed equal pleasure inside and outside.
  *   **Predicted Outcomes:**
      *   *Hedonist:* Exit rates will correlate **only with pleasure forecasts**; if pleasure is equal, rational subjects will remain indifferent or stay based on habit.
      *   *Objectivist:* Exit rates will be **significantly positive** even with equal pleasure; rational subjects will exit to reclaim reality-contact value lost during immersion.
