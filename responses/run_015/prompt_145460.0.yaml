answer: |-
  # Specification of Adequacy for a Theory of Moral Sainthood (Limit Case Conception)

  **Preamble:** This specification defines the necessary conditions for a normative theory to adequately account for *moral sainthood* conceived not as a discrete ontological category, but as the asymptotic limit of moral development. A theory fails this specification if it renders sainthood impossible, pathological, or indistinguishable from non-moral excellence. The following five desiderata constitute the adequacy conditions.

  ---

  ### (a) The Integration Desideratum: Moral Responsiveness vs. Goodness of a Life

  **Specification:**
  The theory must provide an objective account of how maximal responsiveness to moral reasons integrates with, rather than displaces, the non-moral constituents of a flourishing human life. It must demonstrate that the limit case of moral development entails a *harmonization* of moral and non-moral goods, such that the saint’s life is objectively choice-worthy independent of the saint’s subjective satisfaction. The theory cannot rely on the saint’s idiosyncratic preferences to bridge the gap between moral duty and personal good.

  **Motivating Conceptual Distinction/Case:**
  *The Wolf Objection (Moral Saints).* If a moral saint is defined solely by the maximization of moral output, they appear to lack hobbies, humor, or personal projects that do not serve moral ends. If the theory claims the saint *likes* this, it reduces the goodness of the life to subjective preference. If the theory claims the life is good *because* it is moral, it risks severing the link between morality and human flourishing. The distinction required is between a life that is *morally perfect* and a life that is *good for the person living it*, without collapsing one into the other.

  **Status:** **Non-negotiable.**
  A theory that renders the moral ideal objectively impoverished or alienating fails to guide human development. If the limit case of morality is a life no rational agent would choose for themselves (absent coercion), the theory is self-defeating.

  **Primary Friction:**
  *   **Consequentialism:** High. Tends to subordinate all non-moral goods to moral output, struggling to value personal projects unless they instrumentally aid the good.
  *   **Deontology:** Moderate. Can protect personal spheres via rights, but struggles to explain why the saint *flourishes* rather than merely *endures* duty.
  *   **Virtue Ethics:** Low. Naturally aligns moral and personal good, but risks circularity (the good life is the virtuous life).

  ---

  ### (b) The Boundary Desideratum: Supererogation and the Ceiling of Demand

  **Specification:**
  The theory must delineate the precise boundary conditions under which supererogatory acts (beyond duty) transition into obligatory acts, or establish a firm conceptual ceiling where obligation ceases regardless of potential good. It must specify whether this ceiling is *conceptually required* (by the logic of obligation itself) or merely *psychologically necessary* (by human frailty). A theory positing a purely psychological ceiling must explain why the limit case of development does not eventually render the psychological limit obsolete.

  **Motivating Conceptual Distinction/Case:**
  *The Demandingness Objection.* If morality requires the maximization of good (e.g., giving away all wealth until marginal utility equals the recipient's), there is no room for supererogation. The distinction required is between what morality *ideally asks* and what it *can claim as a right*. The case of the "Effective Altruist" who gives 50% of income versus the "Saint" who gives 90%: at what point does the 50% giver become blameworthy? The theory must locate the threshold without arbitrariness.

  **Status:** **Non-negotiable.**
  Without a boundary, morality becomes tyrannical; with a purely psychological boundary, sainthood becomes a moving target that vanishes as human capacity expands. The theory must ground the limit normatively.

  **Primary Friction:**
  *   **Consequentialism:** High. Maximization logic inherently resists ceilings; any limit appears arbitrary within the calculus of utility.
  *   **Deontology:** Moderate. Duties are often bounded, but perfect duties can be expansive. Struggles to categorize the "beyond duty" without making it optional in a way that undermines its value.
  *   **Virtue Ethics:** Moderate. Focuses on the mean, but the "limit case" pushes beyond the mean, challenging the framework of moderation.

  ---

  ### (c) The Remainder Desideratum: Normative Force Post-Fulfillment

  **Specification:**
  The theory must account for the normative status of moral reasons once maximal obligation has been fulfilled. It must explain whether moral considerations retain *normative force* (reason-giving power) after the "ceiling" is reached, and if so, how they are weighted against completed obligations or non-moral projects. The theory cannot simply assert that moral reasons vanish upon satisfaction of duty; it must explain the phenomenology of moral residue or moral opportunity in the saint.

  **Motivating Conceptual Distinction/Case:**
  *The Problem of Moral Residue.* If a saint has done all they are obliged to do, but a further opportunity for aid arises, does morality "speak" to them? If yes, why is it not obligatory? If no, has morality lost its grip? The distinction is between *binding force* (obligation) and *attractive force* (invitation). The theory must explain how the saint navigates moral reasons that persist without commanding.

  **Status:** **Non-negotiable.**
  A theory that cannot explain the normative landscape *after* duty is discharged fails to describe the limit case of moral sensitivity, where one is hyper-aware of moral reasons even when not bound by them.

  **Primary Friction:**
  *   **Deontology:** High. Binary structures (permissible/impermissible) struggle to account for normative force that does not equate to obligation.
  *   **Consequentialism:** Low. Always more good to be done; remainders are simply new obligations.
  *   **Virtue Ethics:** Moderate. Can frame remainders as opportunities for excellence, but risks blurring the line between duty and aspiration.

  ---

  ### (d) The Agency Desideratum: Psychological Stability and Autonomous Mediation

  **Specification:**
  The theory must demonstrate that sustained maximal other-regarding behavior is compatible with stable, autonomous agency. It must identify the *mediating structures* (e.g., habits, second-order volitions, virtues) that prevent the erosion of the self into a mere conduit for moral demands. The theory must show that the saint acts *from* their own character rather than *through* compulsion, even when that character is perfectly aligned with moral reasons.

  **Motivating Conceptual Distinction/Case:**
  *The Burnout/Automation Case.* If a saint responds to every moral reason immediately and maximally, do they retain the capacity for reflection, or do they become a "moral reflex machine"? The distinction is between *integration* (moral reasons are part of the self) and *subsumption* (the self is replaced by moral reasons). The theory must permit structures that filter or pace moral responsiveness to preserve agency.

  **Status:** **Non-negotiable.**
  If the limit case of moral development destroys the agent (via burnout, loss of autonomy, or psychological fragmentation), it is not a valid human ideal. Sainthood must be sustainable by a human psychology.

  **Primary Friction:**
  *   **Consequentialism:** High. The demand for constant responsiveness threatens to fragment the agent’s projects and autonomy.
  *   **Deontology:** Moderate. Respect for autonomy is central, but the rigor of duty can conflict with psychological sustainability.
  *   **Virtue Ethics:** Low. Virtues are by definition stable dispositions compatible with agency, though the "maximal" intensity may strain the concept of the mean.

  ---

  ### (e) The Differentiation Desideratum: Pathology and Efficiency

  **Specification:**
  The theory must provide criteria to distinguish the moral saint from (1) the pathological self-sacrificer (e.g., the martyr driven by guilt or self-hatred) and (2) the merely efficient altruist (e.g., the cold calculator maximizing metrics). The distinction must rest on the *quality of motivation* and the *integration of values*, not merely the *outcome* of actions. The saint must exhibit a specific phenomenological relationship to the good that excludes obsession and mere calculation.

  **Motivating Conceptual Distinction/Case:**
  *The Fanatic vs. The Saint.* Both the fanatic and the saint may sacrifice everything for a cause. Both the effective altruist and the saint may save the same number of lives. The distinction lies in the *source* of the action: the saint acts from a love of the good that includes respect for self and others as ends, whereas the pathologist acts from self-negation and the calculator acts from instrumental reasoning. The theory must capture this qualitative difference.

  **Status:** **Non-negotiable.**
  Without this distinction, the theory cannot condemn moral extremism or endorse cold efficiency as sainthood. It fails to capture the *moral* worth of the saint, reducing it to output or intensity.

  **Primary Friction:**
  *   **Virtue Ethics:** Moderate. Strong on motivation, but can struggle to distinguish "virtuous extremism" from true virtue without circularity.
  *   **Consequentialism:** High. Outcomes are primary; motivation is secondary. Struggles to condemn the efficient calculator or the pathological martyr if outcomes are identical.
  *   **Deontology:** Moderate. Focus on duty protects against pathology, but may not distinguish the saint from the dutiful agent who lacks "saintly" warmth.

  ---

  ### Comparative Impact Assessment: Single Desideratum Damage Analysis

  Per the requirement to identify which *single* desideratum does the most damage to each standard reconstruction:

  1.  **Consequentialism:** **Desideratum (b) The Boundary Desideratum.**
      *   *Reasoning:* Consequentialism’s core commitment to maximization is structurally incompatible with a non-arbitrary ceiling on demand. Accepting (b) requires abandoning the fundamental logic that "more good is always required," which dismantles the standard consequentialist reconstruction of sainthood as the ultimate optimizer.

  2.  **Deontology:** **Desideratum (c) The Remainder Desideratum.**
      *   *Reasoning:* Deontology relies on a binary structure of the permissible and the impermissible (obligation). Accounting for normative force *after* obligation is fulfilled (the remainder) requires a deontological theory to adopt a scalar or aretaic dimension that standard reconstructions lack, fundamentally altering the architecture of duty.

  3.  **Virtue Ethics:** **Desideratum (d) The Agency Desideratum.**
      *   *Reasoning:* While Virtue Ethics is best suited for agency, the "limit case" specification pressures the concept of the *mean*. If the saint is maximally responsive, the mediating structures required to preserve autonomy (pacing, filtering) may look like a retreat from full virtue. This desideratum forces Virtue Ethics to explain how "maximal" virtue does not collapse into compulsion, challenging the stability of the virtuous disposition at the extreme.
