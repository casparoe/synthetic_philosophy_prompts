      *   *Early Education:* Focus on habit, not rules. Children aren't rational yet. Use shame/esteem, not beatings/rewards (mostly).
      *   *Goal:* A "Gentleman" who is virtuous, wise, and rational. Someone who governs themselves by reason.
      *   *The Transition:* How do we get from habit to reason? Locke believes reason develops *later*. Once it develops, it takes over the reins.
