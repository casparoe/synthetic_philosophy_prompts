      *   *Locke's Defense:* Habits aren't the *end*; they are the *foundation*. Reason needs a quiet mind to operate. Passion/impulse blocks reason. Habit tames passion so reason can eventually rule.
      *   *Comparison:* Aristotle (habituation leads to virtue) vs. Kant (duty vs. inclination). Locke is somewhere in between but closer to the Aristotelian/Stoic mix. He isn't a behaviorist in the Skinnerian sense because he believes in an internal faculty of reason that *emerges*.

  3.  **Evaluate the "Tension":**
      *   Is it a contradiction? Not necessarily. It's a developmental sequence.
      *   Is it "scaffolded autonomy"? Yes, that's a very good modern term for it. Vygotsky-esque, though Locke is the precursor.
