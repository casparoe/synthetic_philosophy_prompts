      *   *Addressing the "Fixed True Probability Distribution" question:* If the "true distribution" is fixed (e.g., a coin is objectively 0.5), then *all* strictly proper scoring rules agree that the expected accuracy is maximized by credence 0.5. So the student's worry about different maximizers for a *fixed* distribution is actually mathematically unfounded for strictly proper rules. They all maximize at the truth/chance. The divergence happens when we talk about *measuring* accuracy from a perspective of uncertainty, but even then, the dominance argument holds.

