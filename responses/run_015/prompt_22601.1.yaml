      *   *Premise 1: Accuracy-first epistemology uses proper scoring rules to argue for probabilism.*
          *   **Status:** Correct. This refers to Jim Joyce's (1998) "A Nonpragmatic Vindication of Probabilism" and subsequent work by Pettigrew, Leitgeb, etc.
          *   *Nuance:* The argument usually relies on *accuracy dominance*. If a credence function is not probabilistic, there exists *another* credence function that is more accurate in every possible world (or at least expectedly more accurate).
      *   *Premise 2: There are many proper scoring rules (Brier, Log, Spherical).*
          *   **Status:** Correct.
      *   *Premise 3: Different scoring rules penalize errors differently.*
