answer: |-
  Indirect normativity better preserves normative authority in cases of deliberative dissociation because it treats the idealized endorsement as a validation of the norm's objective standing rather than a revelation of the agent's true will, thus maintaining binding force without pathologizing the agent's coherent actual reasoning. In frameworks of idealized deliberation, normative authority is constitutively linked to the agent's psychology; the idealized self possesses sovereign authority over the actual self only insofar as the latter is viewed as a defective or incomplete version of the former. Consequently, this framework requires a bridge principle commanding the actual agent to align with her counterfactual counterpart, but this bridge collapses when the actual agent's reasoning is ex hypothesi stable, coherent, and well-informed. To maintain that principle P binds the agent despite her coherent endorsement of Q, idealized deliberation must characterize the actual agent's stability as a form of deep-seated irrationality or ignorance regarding her own interests, effectively reducing her present commitments to mere error to preserve the norm's internal grip.

  Indirect normativity avoids this reduction by decoupling the norm's validity from the agent's immediate psychological uptake. Here, P's authority does not depend entirely on the counterfactual endorsement in a way that makes the agent's will the source of obligation; rather, the counterfactual condition serves as a truth-tracking procedure for identifying objective normative truths or socially valid rules. Because the binding force of P is grounded in the structural validity of the selection procedure rather than the agent's ownership of the choice, the actual agent's sustained, rational rejection of P does not undermine its authority. This framework acknowledges the deliberative dissociation without requiring a bridge principle that forces psychological identity between actual and ideal selves. Instead, it posits that the agent is subject to norms validated by ideal conditions regardless of her current coherent dissent, thereby preserving normative authority while respecting the integrity of the actual agent's reasoning as a non-defective standpoint that is nonetheless overridden by objective normative requirements.
