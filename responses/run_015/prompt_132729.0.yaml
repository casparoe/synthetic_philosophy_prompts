      *   *Core Question:* Is the aggregate harm of B greater than the concentrated harm of A?
      *   *Utilitarian View:* Yes, sum total of utility loss matters.
      *   *Deontological/Rights View:* No, rights violations (torture) are lexically superior to minor annoyances.
