      *   *Better Analogy:* Taxation vs. Confiscation? Or maybe "Death by a thousand cuts" (but distributed). Actually, the "Budget" analogy works well. Is $1 taken from a billion people worse than $1 million taken from one person?
      *   *Wait, keep it simple.* The "Separateness of Persons" is the standard philosophical counter to Utilitarianism here.
