answer: |-
  You are grappling with the intersection of three distinct philosophical problems: the **Lottery Paradox** (case a), the **Preface Paradox** (cases b, c, e), and the **Proof Paradox** (case g). Your intuition is correct that reliability engineering offers the structural vocabulary to solve this, but journalism adds a normative layer that engineering lacks: *accountability*.

  Here is a principle that respects your data background, saves most of your verdicts, and clarifies the distinction between your database and the delivery van.

  ### The Principle of Defeasible Component Reliability

  **A claim is printable if and only if:**
  1.  **Local Threshold:** Its individual probability exceeds a stake-adjusted threshold ($P > T$).
  2.  **Error Independence:** The error distribution is not subject to unmodeled common-cause failures that would render the local probability illusory (the "sensor" clause).
  3.  **Systemic Modesty:** You are not asserting the conjunction of all claims as a single system fact unless the *system* reliability clears the threshold (the "database" clause).
  4.  **Exchangeability Guarantee:** If the claim relies on a base rate rather than specific evidence, the mechanism generating the rate must guarantee that the individual case is causally insulated from hidden variables that could distinguish it from the class (the "lottery vs. van" clause).

  ---

  ### How the Principle Handles Your Cases

  **Case (a) The Lottery: Survives.**
  *   **Why:** It meets the Exchangeability Guarantee. A fair lottery is a mechanism *designed* to make tickets indistinguishable. There are no hidden variables (route, driver behavior, maintenance) that could carve up the class. The probability is ontological (built into the event), not just epistemic (built into our ignorance).
  *   **Verdict:** You may print "Ticket 437 will lose."

  **Case (b) & (c) Database/Book: Survives.**
  *   **Why:** Meets Local Threshold and Error Independence (assuming audits confirm independence). It respects Systemic Modesty: you assert the components (lines/claims) but explicitly deny the conjunction ("every line is correct") because the system reliability ($0.997^{4000}$) is far below $T$.
  *   **Verdict:** Print lines, admit global fallibility.

  **Case (d) The Bad Sensor: Overturned (Correctly).**
  *   **Why:** Violates Error Independence. The per-line figure (0.997) is mathematically real but epistemically hollow because the errors are correlated. If line 1 is wrong, line 2 is likely wrong. Reliability engineering calls this a "common-cause failure."
  *   **Verdict:** Pull the database. The local probability no longer licenses the claim.

  **Case (e) Double Audit: Survives (Your gut is right).**
  *   **Why:** This is the crucial test. Even with per-line error at 1/100,000, the system reliability is ~97%. Clause 3 (Systemic Modesty) forbids printing "Every line is correct" because that is a *system claim*, not a component claim. A 3% chance of *some* error is too high for an absolute universal assertion, even if it's low enough for any specific line.
  *   **Verdict:** Do not print "Every line is correct." Your timidity is actually rigor.

  **Case (f) Narrative Conjunction: Survives.**
  *   **Why:** This looks like a violation of Systemic Modesty, but it isn't. In narrative reporting, "The official was in the building and the sample was her son's" is consumed by the reader as a **single holistic claim** (a "story beat"), not as two independent data points conjoined mathematically. The probability 0.92 applies to the *narrative unit*. Furthermore, narrative claims are usually supported by causal linking (she was there *so* she could provide the sample), which reduces the effective independence of the errors.
  *   **Verdict:** Print the sentence. It is treated as one claim with $P=0.92$, not two claims with $P=0.95$ and $P=0.97$.

  **Case (g) The Delivery Van: Survives (But for a specific reason).**
  *   **Why:** This violates the Exchangeability Guarantee. Even if vans are randomly dispatched, the *class* (Company Vans) is not causally insulated from the *event* (the accident) in the way lottery tickets are. There *could* be hidden variables (Company Vans drive different routes, have different maintenance, are driven at different times). In a lottery, the rules *forbid* such variables. In the real world, they are merely unknown.
  *   **Normative Addendum:** Journalism distinguishes between **Prediction** (a) and **Attribution** (g). You may predict an outcome based on odds (a), but you may not attribute specific agency/fault based solely on naked statistics (g), because doing so punishes the subject for group membership rather than individual conduct.
  *   **Verdict:** Print the odds, not the fact.

  ---

  ### Predictions for New Cases

  **1. Clumped Errors (The Bad Batch)**
  *   *Scenario:* Errors are not independent; one bad chemical batch contaminates 50 consecutive lines. Expected total errors is still ~12.
  *   *Prediction:* **Do not print individual lines without qualification.**
  *   *Reasoning:* This violates Clause 2 (Error Independence). If a reader queries line 100, you cannot say "This line is right" with $P=0.997$, because if line 100 is wrong, lines 101–149 are *also* wrong. The risk is no longer distributed; it is localized. You must either verify the batches or print a warning that errors may be clustered.

  **2. The 200 Documents (One Forged)**
  *   *Scenario:* Source says "Exactly one of these 200 is forged." You ask about Document #1. Source says "Not #1."
  *   *Prediction:* **You may print "Document #1 is genuine." You may not print "All 200 are genuine."**
  *   *Reasoning:* This is structurally identical to the Lottery (a) and Database (b). For any specific document, the probability of genuineness is 199/200 (0.995). If your threshold is 0.95, you print it. But the system reliability (all 200 genuine) is 0. You must maintain Systemic Modesty.

  **3. The "Safe" Van (Modifying Case g)**
  *   *Scenario:* You stipulate vans are identical, routes random, drivers identical, maintenance identical. Pure exchangeability.
  *   *Prediction:* **You still should not print "It was their van" as a flat fact.**
  *   *Reasoning:* This is where the Principle admits a journalistic constraint beyond pure reliability. Even with mathematical exchangeability, the *normative* cost of error differs. In (a), if you are wrong, the lottery commission pays a prize. In (g), if you are wrong, you have damaged a specific company's reputation based on group membership.
  *   *Revision:* The principle predicts you *could* print it mathematically, but journalistic ethics (minimizing harm) overrides the mathematical license. If you must choose between saving (a) and (g), save (a). (g) requires causal evidence, not just statistical certainty, to assign blame.

  ---

  ### Hard Truths: What Must Be Overturned?

  You asked me to be honest about which verdicts the principle cannot save.

  **1. The Feeling on (e) is Correct, but the Reason is Subtle.**
  You feel uneasy printing "Every line is correct" even with 97% system reliability. The principle agrees. However, you should recognize that 97% system reliability is actually *very high* for a complex system. If your threshold for a "fact" is 95%, you technically *could* print it.
  *   *The Overturn:* If you truly trust the double audit (independent methods), refusing to assert the system is clean is **excessive timidity**. Reliability engineering would certify that system. If you won't print it, admit it is a policy choice to protect against the *consequences* of being the one newsroom that got the 3% wrong, not an epistemic necessity.

  **2. The Distinction Between (a) and (g) is Normative, Not Just Statistical.**
  You want a statistical principle to separate the Lottery from the Van. If you make the Van case "airtight" (perfect randomization), a pure reliability principle *cannot* save your refusal to print. Mathematically, they become identical.
  *   *The Overturn:* You must admit that your refusal in (g) is not about **Truth**, but about **Liability**. You are willing to be wrong about a lottery ticket (no harm); you are unwilling to be wrong about a company's liability (harm).
  *   *Advice:* Do not tell your editors this is a "truth" standard. Tell them it is a "harm" standard. "We do not print statistical certainty when the cost of error falls on a specific third party's reputation."

  **3. Print vs. Believe**
  You ask if the principle is about what to print or what to believe.
  *   **Verdict:** It is about **what to print**.
  *   **Reasoning:** You can rationally believe every claim in your book *and* believe one is false (The Preface Paradox). Belief tolerates inconsistency; public assertion does not. When you print, you invite the reader to act on that information.
  *   **Application:** In (b), you believe Line 1 is correct. You also believe Line 2,847 is probably incorrect (somewhere). You print Line 1 because the *reader's* reliance on Line 1 is safe. You do not print "All lines correct" because the *reader's* reliance on the *whole set* is unsafe. The principle governs the **affordance of reliance**.

  ### Summary for Your Talk

  Tell your standards editors this:

  > "We treat our claims like components in a complex machine. We certify each component individually based on its own reliability testing (audits, sources, data). But we do not certify the *whole machine* as error-free unless we have tested the system as a whole.
  >
  > Furthermore, we distinguish between **predicting events** (where odds are enough) and **assigning cause** (where odds are not enough). We will tell you a ticket will lose because the lottery is designed to be random. We will not tell you a company caused an accident based on market share, because the real world is not designed to be random, and we do not punish membership when we can't prove conduct.
  >
  > Our standard is not 'absolute truth.' It is 'localized reliability with systemic humility.' We stand behind the sentence in front of you, and we admit there may be a sentence elsewhere we got wrong."

  This preserves your rigor, acknowledges the engineering reality of your database, and protects the newsroom from the ethical hazard of the "Blue Bus" case.
