answer: |-
  The coffee in the union office is burnt, and the clock on the wall says 3:17 AM. The draft agreement sits on the table between them, highlighted in yellow and red.

  **Teo:** Thirty-two hours. Full pay. Do you understand what that does to the reproduction of labor power? Four hours back every day. For reading, for sleeping, for organizing. That's not a bribe, Mara. That's a reduction in necessary labor time. It's the only metric that matters.

  **Mara:** It matters if the worker is still a worker. Look at clause four. The "knowledge transfer." Six months. They don't just want the crane moved; they want the *hand* that moves it. They want to record the jerk of the wrist when the wind picks up, the way a lasher hears the tension in the cable before it snaps. They're not buying our labor for six months. They're buying the skill out of our nervous systems to build the thing that replaces us.

  **Teo:** The skill is already gone the moment the algorithm is written. If we walk away, they hire consultants who've never stepped on a dock to write the code based on time-and-motion studies from a spreadsheet. It'll be worse. It'll be dangerous. At least this way, our people are in the room when the safety parameters are set. We get the shorter week *and* we keep a hand on the throttle during the transition.

  **Mara:** You're treating the machine like a tool we can hold. It's not. It's a relation. When you record those movements, you're objectifying the worker's experience into fixed capital. It comes back at him as an alien power. The machine learns the trick, then the machine sets the pace. You're saying, "Help us build the cage, and we'll give you a shorter sentence." But the cage doesn't just hold you; it dictates how you move inside it. Once that data is theirs, the union doesn't bargain with the company anymore. We bargain with the system we helped train.

  **Teo:** We bargain with capital regardless of the technology. That's the materialist baseline. You think refusing the data stops the automation? The productive forces are moving. You can't wish the steel away. The struggle isn't over the instrument; it's over the surplus. They're paying us out of the relative surplus value the machine generates. That's a transfer of wealth from capital to labor. If we refuse because the machine is "alien," we're fighting the steam engine because it burns coal.

  **Mara:** It's not the steel, Teo. It's the subsumption. In the old days, the boss told you to work faster. Now, the system tells you. It's embedded in the code. By feeding it our expertise, we're completing the real subsumption of labor. We're making ourselves redundant on purpose. And look at the gainshare. Clause seven. The union's cut rises as productivity rises. As labor is displaced.

  **Teo:** Exactly. The union gets richer as the workforce shrinks. That fund becomes a war chest. We use it to support the members who transition out, to fund strikes in other sectors, to organize the logistics chain beyond the dock. You want the union to stay poor so it stays pure? A union without resources is a debating society. This makes us financially independent of dues from workers who might not even have jobs in five years.

  **Mara:** It makes the union a shareholder in the displacement of its own members. Our income becomes indexed to their obsolescence. Think about the incentive structure. If the automation speeds up, the union gets more money. If we fight to slow it down to save jobs, we cut our own funding. You're turning the union into a junior partner in the liquidation of the workforce. We become the managers of our own decline.

  **Teo:** Or we become the safety net for the post-work reality. You're assuming the goal is full employment forever. It's not. The goal is to survive the transition without starving. The 32-hour week spreads the remaining work. The fund supports those who leave. Yes, the union changes. It has to. If we cling to the idea that every member must turn a wrench, we die when the wrench disappears. This keeps the organization alive to fight for the class, not just the job description.

  **Mara:** But what class? If the union's budget depends on the efficiency of the automation, whose interest does the bureaucrat serve when the assembly isn't in session? You're creating a material base for collaborationism. And the cab clause—dropping the requirement for a member in the cab. That's the last point of leverage. Once the cab is empty, we can't stop the port. We lose the strike weapon forever.

  **Teo:** We lose the strike weapon of 1970. We gain the leverage of disruption over the data flow. But you can't leverage a machine you don't understand. That's why the knowledge transfer is vital. We need to know where the breakpoints are. You want to keep the man in the cab to throw a wrench in the gears? That's Luddism. I want to know the code so we can stop the server.

  **Mara:** You're betting on a future struggle we aren't organized for today. You're asking men and women to sell their dignity—their specific skill, the pride of handling a load no computer could balance—for a promise of time they might spend unemployed. Thirty-two hours of what? Watching the machine do the work you used to do? That's not liberation. That's watching your own ghost labor.

  **Teo:** It's buying back our lives. Marx wrote about this. The machine creates the potential for free time, but capital turns it into surplus labor. This deal forces some of that time back to us. It's a breach in the wall. You want to hold the line at the wall? I want to walk through the breach before they seal it up.

  **Mara:** And I'm telling you the breach is a trap. They want us to walk through it so we're not standing in front of the gate when the rest of the class arrives.

  *Silence. The hum of the refrigerator is the only sound. Teo looks at the draft recommendation they were supposed to sign. He picks up a pen, hovers it over the paper, then puts it down.*

  **Teo:** I can't sign a recommendation to vote No. Not with the 32-hour week on the table. Not with the transition fund secured. I think voting No is a moral luxury the members can't afford.

  **Mara:** And I can't sign a recommendation to vote Yes. Not with the knowledge transfer clause. Not with the union's income tied to displacement. I think voting Yes is a strategic suicide that looks like a victory.

  *They look at each other. The clock ticks to 3:45 AM.*

  **Teo:** So we don't give them a joint recommendation.

  **Mara:** No. We give them the contradiction. If we smooth this over, we're lying.

  **Teo:** Okay. We write it up. Two sections. One lays out the material gain: the hours, the fund, the security for those who stay and those who leave. The other lays out the cost: the transfer of skill, the change in the union's character, the loss of the cab leverage.

  **Mara:** And we make sure they understand what they're selling. Not just "labor." But the accumulated experience of thirty years. They need to know that once that data is uploaded, it doesn't belong to them anymore. It belongs to the system.

  **Teo:** And they need to know that if they reject it, the company goes to the next port, automates anyway, and we get nothing but the pride of refusal.

  **Mara:** Then let the assembly decide. But we don't tell them it's a win. We tell them it's a trade.

  **Teo:** A trade between time and power.

  **Mara:** Between living better now and fighting later.

  *Teo pushes the paper toward the center of the table. Mara pulls a fresh sheet from the stack.*

  **Teo:** I'll draft the economic argument. The surplus value distribution.

  **Mara:** I'll draft the political economy. The shift in class composition.

  **Teo:** We meet back here at 6:00 to merge the text.

  **Mara:** We don't merge the text, Teo. We staple them together. Let the workers see the crack. If they can't see the crack, they can't make the choice.

  **Teo:** *Nods slowly.* Alright. Staple them. But we both sign the cover page.

  **Mara:** Both signatures. One recommendation: "Here is the deal. Here is what it buys. Here is what it costs. Vote."

  **Teo:** That's the only honest thing we can do.

  **Mara:** Then get writing. 8 AM is coming.
