answer: |-
  Here is a specification for a theory of colony-level mindedness, designed to be robust enough for print and testable enough for biology.

  ### The Specification: Five Requirements for a Colony Mind

  **1. Substrate-Independent Identity (The Turnover Requirement)**
  *   **The Requirement:** The theory must explain how the cognitive state persists when the physical substrate is entirely replaced, without appealing to a non-physical soul. It must distinguish between the *pattern* that constitutes the mind and the *matter* that realizes it.
  *   **The Case:** This addresses your Turnover stipulation. If the theory cannot explain why the colony in Year 2 is the same thinker as the colony in Year 1 despite zero shared atoms, it fails the basic criterion of diachronic identity. However, it must also answer whether this identity is the *same kind* as colony identity.
  *   **Status:** **Non-negotiable.** Any theory that requires specific ants to persist for the mind to persist is biologically dead on arrival. Any theory that posits a "ghost" persisting apart from ant behavior is dualist mysticism.

  **2. Principled Individuation (The Fusion/Fission Requirement)**
  *   **The Requirement:** The theory must provide a physical or functional criterion for counting minds that does not rely on human intuition. It must specify what physical change turns one mind into two, or two into one.
  *   **The Case:** This addresses Fusion/Fission. If two colonies merge, does the memory integrate? If the information flow between halves is severed, does the mind split? A theory that says "it depends on how you look at it" dissolves the question rather than answering it.
  *   **Status:** **Non-negotiable.** Without this, you cannot run an experiment. If you can't define the boundaries of the system, you can't measure its inputs and outputs.

  **3. Internal Representational State (The "Aboutness" Requirement)**
  *   **The Requirement:** The theory must demonstrate that the colony maintains internal states that track external conditions *for the sake of the system's goals*, distinct from simple stimulus-response chains.
  *   **The Case:** This addresses the distinction between problem-solving and representing. A thermostat solves a temperature problem but doesn't represent the world. To be a "mind," the colony must hold a state (e.g., a pheromone gradient map, a spatial memory encoded in tunnel structure) that can be *wrong* in a way that matters to the colony, not just the observer.
  *   **Status:** **Non-negotiable for "Mind."** This is the hardest bar. Most "colony mind" claims fail here; they describe complex input-output behavior (stigmergy) but show no evidence of an internal model that can be decoupled from immediate action.

  **4. Non-Arbitrary Boundary (The Nesting Requirement)**
  *   **The Requirement:** The theory must identify a specific mechanism that creates a cognitive boundary, explaining why the mind stops at the nest edge and does not include the forest or the individual ant.
  *   **The Case:** This addresses Nesting. Common candidates are *homeostatic closure* (the system regulates its own boundaries) or *informational integration* (information flows freely inside but is filtered outside). If the theory cannot block the explosion upward (forest) or downward (ant), the concept of "colony mind" becomes trivial.
  *   **Status:** **Non-negotiable.** Without a boundary mechanism, panpsychism wins, and the term "mind" loses all discriminatory power.

  **5. Graceful Degradation (The Dilution Requirement)**
  *   **The Requirement:** The theory must account for the loss of function proportional to the loss of substrate, without positing a threshold where "mind" suddenly vanishes.
  *   **The Case:** This addresses Dilution. If you remove 10% of ants, does 10% of the "mind" go, or does the whole mind persist until a critical crash? A theory that demands all-or-nothing cognition contradicts the biological reality of distributed systems.
  *   **Status:** **Camp-Specific.** This is where functionalists and biological essentialists fight. A functionalist can accept gradualism (the mind gets "dumber"). An essentialist might argue mind is binary (you either have a unified subject or you don't). You can print a theory that fails this, but it will be biologically awkward.

  ***

  ### The Trilemma and The Suspicion

  **Is there a Trilemma?**
  Yes. You cannot simultaneously hold **Gradualism (Req 5)**, **Determinate Cardinality (Req 2)**, and **Non-Arbitrary Boundaries (Req 4)**.
  If cognition is gradual (fuzzy boundaries), then counting minds (cardinality) becomes arbitrary. If counting minds is determinate (sharp boundaries), then cognition must be thresholded (binary), which contradicts graceful degradation.
  *Resolution:* Most robust theories sacrifice **Determinate Cardinality**. They accept that during fusion or fission, the number of minds is indeterminate for a period, just as a splitting cell is neither one nor two for a brief window. If a theory insists on sharp counting *and* gradualism, it is mathematically incoherent.

  **The Knockout:**
  **Internal Representational State (Req 3).** This eliminates the most candidates. Almost every biological system processes information and adapts (Inflationary view). Very few can be shown to maintain an internal model of the world that guides behavior independently of immediate stimulus. If you can't prove the colony holds a "belief" that can be false, you haven't proved it has a mind; you've proved it's a complex machine.

  **The Suspicion:**
  **The Unified Subject.** This is the smuggled story-teller. It is incredibly tempting to write "The colony *decides*," implying a singular point of view or phenomenology (what it is *like* to be the colony). This satisfies our narrative desire for a protagonist but has no biological referent. There is no "center of narrative gravity" in a nest, only distributed processes. As a journalist, be most suspicious of any scientist who slips from "the system regulates" to "the colony knows."

  ***

  ### Three Options Against the Spec

  **The Deflationary View (Stigmergy All the Way Down)**
  This view passes Grounding and Boundaries easily: the "mind" is a metaphor for the aggregate of individual ant behaviors mediated by the environment. It handles Turnover and Dilution well, as these are just mechanical properties of the swarm. However, it fails the Representational State requirement decisively. It collapses the distinction between problem-solving and representing; the colony solves problems, but it does not know it is solving them. It is a valid biological description, but by your spec, it is not a theory of *mind*, only of *agency*.

  **The Inflationary View (Pan-Computationalism)**
  This view passes Gradualism and Turnover effortlessly: any system that processes information and maintains homeostasis has a mind to some degree. It handles Dilution by saying the mind just gets "thinner." However, it catastrophically fails the Boundary requirement. If information processing is sufficient for mindedness, the nest, the forest, and the ant's gut microbiome are all minds. It dissolves the Individuation requirement, making the cardinality of minds arbitrary. It saves the phenomenon of "colony mind" by making *everything* minded, rendering the term scientifically useless.

  **The Hofstadterian View (Emergent Symbol System)**
  This view attempts to clear the Representational State bar by positing high-level symbols (like "food" or "danger") that exist only at the colony level, realized by ant traffic but not reducible to it. It handles Turnover well (symbols persist while tokens die). However, it struggles with Grounding and Boundaries. It is difficult to show biologically how a high-level symbol causally drives individual ants without a homunculus reading the symbol. It also risks failing the Boundary test: why is the symbol system contained by the nest and not the ecosystem? It is the most philosophically satisfying but the hardest to operationalize for a field biologist.
