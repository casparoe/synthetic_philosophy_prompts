      *   *Refining the Trilemma:* The tension is between Gradualism (3), Determinate Cardinality (2), and Non-Arbitrary Boundaries (4). If cognition is gradual, boundaries are fuzzy. If boundaries are fuzzy, counting is arbitrary. If counting is determinate, boundaries must be sharp. If boundaries are sharp, cognition is likely binary (or thresholded). So: Gradualism + Determinate Counting + Non-Arbitrary Boundary = Trilemma.
