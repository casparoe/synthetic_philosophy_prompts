      *   *Attempt 2 (Closer):* Think of the Experience Machine as a city where the digital twin overrides the physical. Hedonism is optimizing for biometric data. Desire-satisfaction is algorithmic zoning based on requests. Objective list is hard-coded infrastructure requirements.
      *   *Refining for "Honesty":* Ensure the analogy holds up. A digital twin *is* a model, not the territory. If we treat the model as the reality, we risk the Experience Machine problem.

  5.  **Drafting the Residue Report:**
