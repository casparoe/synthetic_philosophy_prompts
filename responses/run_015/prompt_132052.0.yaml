  hey, i'm a science journalist working on digital-twin cities and synthetic urban planning, and i keep running into this philosophy thing about the experience machine and what actually makes life good. can you restate the experience machine argument and the three big well-being theories -- hedonism, desire-satisfaction, objective list -- in the vocabulary i actually use: zoning codes, simulated environments, predictive maintenance, resident feedback loops, synthetic population models? do it honestly, don't just force the words in. then give me the residue report: what translates cleanly, what gets distorted, and what's left over with no counterpart in planning talk. tell me whether that leftover means urban planning is missing a real concept, or if the philosophers are just splitting hairs that don't matter outside a seminar room. don't cite anyone or hand me a bibliography -- i don't have access right now and need this straight. sepcifically, i'm wondering if the idea that reality-contact matters has any analog in how planners treat simulated vs physical infrastructure, or if that's purely a philosopher's hang-up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Science journalist working on digital-twin cities and synthetic urban planning.
      *   **Topic:** Nozick's Experience Machine argument vs. three theories of well-being (Hedonism, Desire-Satisfaction, Objective List).
      *   **Constraint 1 (Vocabulary):** Restate these concepts using urban planning/tech jargon (zoning codes, simulated environments, predictive maintenance, resident feedback loops, synthetic population models).
