  Im writing a term-paper proposal for my phil of language course, need it under 350 words, American English. Lead with the bottom line: is this project actually doable in one semester, or is the split I'm proposing going to collapse into something already solved?

  My half-baked idea: everyone talks about Judy Benjamin updating on the conditional "if I stay, I'll be shot" like its one kind of belief revision. I think thats wrong. The literature treats evidential updating (Bayesian) and strategic updating (where your belief changes what you do, which changes the outcome) as the same mechanism, but in Benjamin they pull apart. I want to formalize a split: evidential conditionals guide credence, pragmatic conditionals guide action-choice, and mixing them is what makes the puzzle look paradoxical.

  The precise question: can we dissolve the Judy Benjamin stall by showing that her credence in survival should stay high under evidential norms, while her decision to leave is driven by a separate strategic conditional? And if so, does this collapse into a version of Newcomb's problem, or is it genuinely distinct?

  Why existing answers leave it open: Edgington and others assume a unified update rule. If I'm right, the debate about whether she should update her credence is mislocated—its not about conditionals at all, but about whether belief revision can be action-sensitive.

  Method, month by month: first, formalize the two update norms with a simple decision matrix. Second, apply to Benjamin and check consistency with the reflection principle. Third, see if any existing counterexample (maybe a medical testing case) breaks the split. Deliverable: a 6000-word paper arguing either the split works or it fails.

  What counts as failure: if the strategic/evidential distinction collapses, or if it requires rejecting standard probabilism without gaining explanatory power.

  Realistic scope: probably doable in one semester, but only if I avoid full formal semantics—I'll stick to decision-theoretic framing and not try to solve Newcomb's problem along the way.

  Dont include a bibliography or citation list, I'll fill those in later. Also please dont ask me for specific papers I havent read—just work with the positions I mentioned above.
