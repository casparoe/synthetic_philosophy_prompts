  **Title:** Structural Causes, Different People: The Institutional Nonidentity Problem and Duties to Future Citizens

  **Abstract**

  This project proposes a reframing of the Nonidentity Problem (NIP) within political philosophy, shifting the focus from individual reproductive choices to large-scale institutional design. Standard treatments of the NIP focus on micro-level decisions (e.g., when to conceive, which genetic traits to select) where the identity of the future person is directly contingent on the timing or nature of the act. This project argues that macro-level institutional choices—such as adopting specific climate-adaptation regimes, constitutional amendments, or economic structures—generate a similar nonidentity effect through structural causation. Over multi-generational horizons, these institutions shape migration patterns, economic sorting, and social mating pools so thoroughly that different institutional paths literally bring about different populations centuries later.

  The central question is whether this "Institutional Nonidentity" dissolves moral duties to preserve specific democratic institutions for future citizens. If the very institutions we seek to preserve are partly constitutive of who those future citizens are, does the Person-Affecting View imply we have no duty to prefer one institutional framework over another, provided the resulting lives are worth living? I propose testing two decision frameworks: one treating future citizens as specific individuals with standing (*de re*), and one treating them as placeholder roles within a political community (*de dicto*). The goal is to determine if institutional nonidentity creates a moral asymmetry that reproductive nonidentity does not, potentially grounding duties to institutions even when duties to specific future individuals are undermined.

  **1. The Precise Question: Institutional Path-Dependancy Identity**

  The core of this project rests on a specific formulation of the identity problem that diverges from the standard literature. To get clear on the stakes, we need to define what I'm calling "Institutional Path-Dependancy Identity" (IPDI) and distinguish it from the classic Parfitian cases. This isn't just a semantic shift; it's about changing the causal mechanism that triggers the identity problem.

  **1.1 Defining IPDI vs. Standard Nonidentity**

  In the standard Nonidentity Problem (as articulated in *Reasons and Persons*), the causal chain is relatively short and direct. A woman chooses to conceive now rather than wait. If she waits, a different sperm and egg will combine, resulting in a numerically different child. The choice determines the identity of the child. If the child born now has a significant impairment but a life worth living, we struggle to say the mother harmed *that* child, because without the choice, *that* child would not exist. The comparison class is flawed: we are comparing existence with a deficit vs. non-existence. The harm is contingent on the identity.

  IPDI scales this up to the level of collective agency and temporal depth. Here, the "choice" is not a biological act of conception but a political act of institutional adoption. Consider a society deciding between two climate-adaptation regimes:
  *   **Policy A:** Heavy investment in coastal defense infrastructure, keeping current population centers intact.
  *   **Policy B:** Managed retreat from coasts, subsidizing internal migration to higher ground.

  Over a horizon of 150-200 years, these policies do not just affect the *quality* of life for future people; they affect *who* exists. Policy A keeps specific communities together, maintaining specific local economies, social networks, and proximity patterns. Policy B disperses populations, alters economic opportunities, and changes who meets whom. Since personal identity is contingent on the specific gametes that combine, and gamete combination is contingent on social proximity and timing, Policy A and Policy B will result in numerically different populations centuries later.

  This is not direct causation in the sense of "skipping a child." It is structural causation through collective life. The institution itself becomes part of the identity conditions of the future citizenry. This is the crux of IPDI: large-scale institutional choices shape the social fabric so thoroughly that a different institution literally brings about a different population. It's a diffuse causality. It's not that the policy *selects* the people; it's that the policy creates the environment in which *these* people are selected by chance.

  **1.2 The Moral Question**

  This generates a specific political dilemma that standard bioethics doesn't capture. Political philosophy often assumes we have duties to "future generations" to preserve democratic institutions, justice, or stability. We say, "We must protect democracy for our grandchildren." But if the institutional choices we make *now* determine which grandchildren exist, the logic of the Nonidentity Problem threatens to dissolve this duty.

  The precise question this project tackles is: **Does the nonidentity problem dissolve moral duties to preserve specific democratic institutions for future citizens, since those very institutions partly determine who those citizens are?**

  Furthermore, is there an asymmetry between harming a specific future person (if they exist) versus substituting one population for another via institutional design? In the micro-case, the intuition is that we shouldn't bring a child into a worse life if we could have brought a different child into a better life. But in the macro-case, we aren't choosing between Child X and Child Y in a vacuum. We are choosing between Institutional Framework X (which yields Population X) and Institutional Framework Y (which yields Population Y).

  If we adopt the Person-Affecting View (PAV)—that an act can only be wrong if it makes some particular person worse off—then choosing Framework X over Framework Y cannot be wrong for the sake of Population X, provided their lives are worth living. Population X has no complaint; without Framework X, they wouldn't exist. But surely, politically, we feel there is a wrong done if we choose a tyrannical framework over a democratic one, even if the tyrannical framework creates a different set of people who are happy enough.

  The project asks whether the political context restores the moral force that the NIP strips away. Does the fact that these are *citizens* rather than *children* matter? Does the fact that the causation is *structural* rather than *biological* change the moral calculus? I suspect the answer lies in the nature of political obligation itself, which might be less about individual welfare and more about structural integrity.

  **1.3 The Stakes for Democratic Theory**

  This isn't just a metaphysical puzzle; it has real implications for how we justify long-term policy. If the NIP holds at the institutional level, then intergenerational justice claims become incredibly fragile. We cannot say we owe it to *future people* to leave them a functioning democracy, because the "future people" are contingent on the democracy itself. This could lead to a form of political nihilism regarding long-term planning. Why save the constitution if saving it changes who gets to inherit it?

  Alternatively, if we can show that IPDI functions differently than reproductive nonidentity, we might ground duties to institutions that are independent of the specific identities of the occupants. This would support a view where the *structure* of justice has moral standing, or where duties are owed to the *roles* of citizenship rather than the biological individuals. This is crucial for climate justice arguments. Often, climate policy is justified by harm to future people. If IPDI holds, those specific people won't exist if we mitigate climate change (because migration patterns change). So, do we owe them mitigation? The standard NIP says no. My project asks if a political framing says yes.

  **2. Why Current Answers Leave It Open**

  One might wonder why we can't just apply the existing solutions to the Nonidentity Problem to this new context. There is a vast literature on the NIP, ranging from the "Same Number Quality Claim" to "Person-Affecting Restrictions" and "Threshold Views." However, I argue that current answers leave the institutional question open because they are primarily calibrated for micro-level interactions. They assume a certain kind of agency and a certain kind of patient that doesn't map cleanly onto the political sphere.

  **2.1 The Micro-Level Bias**

  The standard literature stays micro-level (individual reproductive ethics). When Parfit discusses the "Risky Policy" case (choosing a policy that causes a leak of radiation which causes birth defects centuries later), he is still thinking about specific harms to specific individuals who are identifiable in principle, even if not in practice. The focus is on the harm threshold: is the life worth living? The assumption is that the moral weight rests on the welfare of the individual human being.

  In the institutional case, the "harm" isn't necessarily a reduction in welfare below a threshold of worth-living. The harm might be the loss of *political agency* or *democratic standing*. A population existing under a benevolent autocracy might have lives worth living (high welfare), but they lack the specific status of "citizen" in a democracy. The standard NIP literature focuses on welfare comparisons. It asks: Is Person X worse off than Person Y would have been? Or: Is Person X worse off than they would have been under alternative A?

  But in IPDI, the comparison is often between two populations with comparable welfare but different political statuses. The standard tools don't easily capture the value of *political continuity* versus *biological continuity*. The literature assumes the moral patient is the human being. In political philosophy, the moral patient is often the *citizen*—a role defined by the institution itself. Current NIP solutions don't account for the fact that the institution defines the moral patient. If the institution changes, the patient changes, but the *relationship* of citizenship might be what we value, not the biological substrate.

  **2.2 Collective Agency and Feedback Loops**

  Macro institutional decisions claim to act on behalf of future generations, so the causal structure and moral stakes are different. In reproductive choices, the agent is an individual acting on behalf of a potential child. In institutional choices, the agent is a collective (the state, the electorate) acting on behalf of a future collective.

  This introduces feedback loops that the standard models ignore. Institutions don't just affect who exists; they affect *how* those people value their existence. A democratic institution might cultivate citizens who value autonomy. An autocratic institution might cultivate citizens who value order. If we choose the autocratic path, we create people who are happy with autocracy. If we choose the democratic path, we create people who are happy with democracy.

  The standard NIP solution often relies on the intuition that there is an objective standard of welfare that allows us to compare across identities. But if institutions shape preferences and values (adaptive preferences), the comparison becomes even murkier. The literature hasn't fully grappled with the idea that the *identity* of the future population includes their *political psychology*, which is endogenous to the institutional choice. This makes the "Same Number Quality Claim" hard to apply. How do we compare the quality of life of a democratic citizen vs. an autocratic subject if thier preferences are shaped by the regime?

  **2.3 The "Representative" Problem**

  Current NIP discussions assume the decision-maker is distinct from the affected party. In the institutional case, the decision-maker is part of the same continuing political community as the affected party. We are deciding for our own polity's future. This introduces a duty of fidelity to the *project* of the community, not just to the individuals who will inhabit it.

  Existing answers leave this open because they treat the future people as strangers or separate moral patients. They don't account for the trans-generational partnership that democratic theory often presupposes. If we view the polity as a single extended agent over time, the nonidentity problem might look different. The "harm" isn't to a person, but to the integrity of the extended agent. The literature hasn't sufficiently explored whether the NIP dissolves duties of *institutional fidelity* even if it dissolves duties of *individual beneficence*. This is the gap I want to exploit.

  **3. The Approach: Comparing Decision Frameworks**

  To tackle this, I'm not going to try to solve the Nonidentity Problem outright. That's too big for a 6-week paper. Instead, I'm going to test whether the institutional framing changes the output of our moral intuitions when we apply different decision frameworks. The approach involves comparing two distinct ways of modeling our duties to the future. This is the methodological core of the project.

  **3.1 Framework 1: The Specific Individual View (De Re)**

  This framework treats future citizens as specific individuals with standing. This is the standard Person-Affecting View applied to politics.
  *   **Mechanism:** We ask, "Does Policy A harm Specific Person P who will exist in 2100?"
  *   **Application to IPDI:** Under IPDI, Policy A brings about Person P. Policy B would have brought about Person Q. If P's life is worth living, Policy A does not harm P. Therefore, under a strict *de re* reading, we have no duty to choose Policy B over Policy A for P's sake.
  *   **Prediction:** This framework should collapse into the standard Nonidentity Problem. It should suggest that we have no duty to preserve specific democratic institutions if doing so changes the identity of the future citizens, provided their lives are worth living.
  *   **Test:** I will apply this to a case study (e.g., constitutional amendment vs. status quo) to see if the intuition that "we must preserve democracy" survives. My hypothesis is that it won't. The *de re* view will fail to capture the wrongness of dismantling democratic institutions if the resulting population is happy. It reduces political justice to individual welfare, which misses the point of institutions.

  **3.2 Framework 2: The Placeholder Role View (De Dicto)**

  This framework treats future citizens as placeholder roles within a political community.
  *   **Mechanism:** We ask, "Does Policy A harm whoever ends up occupying the role of 'Citizen' in 2100?"
  *   **Application to IPDI:** Here, the identity of the biological individual is irrelevant. The moral patient is the *office* of citizenship. We owe duties to the *position*, not the *person*. If Policy A preserves the integrity of the role (e.g., ensures the citizen has voting rights, due process), and Policy B degrades the role (e.g., turns citizens into subjects), then Policy A is obligatory, regardless of who fills the role.
  *   **Prediction:** This framework should resist the Nonidentity Problem. Because the duty is attached to the structure/role, the fact that different people fill the role doesn't dissolve the duty. It creates an asymmetry between harming a specific future person (which NIP blocks) and substituting one population for another via institutional design (which this view permits judging).
  *   **Test:** I will argue that this aligns better with our intuitions about political legitimacy. We believe a government owes duties to its future subjects regardless of who they are. This suggests our political duties are *de dicto* ("whoever shall be") rather than *de re* ("this specific person").

  **3.3 Why This Rather Than Applying Parfit Directly?**

  You might ask: why not just apply Parfit's "Same Number Quality Claim" (Q)? Q says: If in two possible outcomes the same number of people would live, it would be worse if those who live are worse off.
  The problem is that Q still relies on a comparison of welfare levels between Population X and Population Y. In institutional cases, welfare is hard to compare across different political psychologies. Furthermore, Q doesn't capture the *structural* value of the institution itself.

  My approach differs because it focuses on *collective agency* and the *identity conditions of the institution*. Macro-level involves collective agency, long feedback loops, and the institutions themselves are part of the identity conditions. By shifting the locus of moral standing from the biological human to the political role, we bypass the identity contingency. The role persists even if the occupants change.

  This is crucial because it allows us to say: "We owe it to the future of *this democracy* to preserve it," without needing to say "We owe it to *John Doe in 2150*." The former survives IPDI; the latter does not. It moves the moral weight from the *occupant* to the *office*.

  **3.4 The Asymmetry Hypothesis**

  The core theoretical move here is to argue for an asymmetry between reproductive and institutional nonidentity.
  *   **Reproductive Nonidentity:** The choice creates the person. The duty is to the person. The identity contingency blocks the duty.
  *   **Institutional Nonidentity:** The choice creates the person, BUT the duty is to the *community structure* that precedes the person. The institution is the vessel; the people are the content. We have duties to maintain the vessel, even if changing the vessel changes the content.

  I will test this asymmetry by looking at cases where the institutional choice seems clearly wrong despite the nonidentity effect. For example, if a current generation votes to abolish elections and establish a benevolent monarchy, resulting in a happier but non-democratic future population. The NIP says: "The future monarchial subjects aren't harmed (they exist and are happy)." Our political intuition says: "This is a betrayal of the democratic project." The Placeholder View explains this betrayal; the Specific Individual View does not.

  The betrayal is of the *trust* inherent in the political office. Current officeholders are stewards of the office, not just parents of future children. This distinction is key. Parents create children; stewards maintain trusts. The NIP applies to creation; it doesn't necessarily apply to stewardship.

  **4. Success vs. Failure Conditions**

  Since this is a targeted project, I need to be clear about what counts as a win. I'm not trying to solve the Nonidentity Problem for all of ethics. I'm trying to isolate a specific political variant. I need to be honest about the limitations.

  **4.1 What Success Looks Like**

  Success means showing that institutional nonidentity changes the moral calculus in a way reproductive nonidentity doesn't. Specifically:
  1.  **Demonstrating the Gap:** I need to successfully argue that the *de re* framework fails in political contexts where it might hold in private ethics. If I can show that political duties are inherently *de dicto* (owed to roles), then the NIP loses its grip on political theory.
  2.  **Validating the Asymmetry:** I need to show that there is a relevant moral difference between "making a person" and "making a polity." If the polity is viewed as a continuous agent, then changing its members doesn't change its identity in the same way changing gametes changes a person's identity.
  3.  **Preserving Intuitions:** The theory should align with the strong intuition that we *do* have duties to preserve democratic institutions for the future, even if we can't identify the specific beneficiaries. If the proposal can ground this intuition without relying on controversial metaphysical claims about group agents, that's a win.

  Basically, if I can conclude that "The Nonidentity Problem does not dissolve duties to future institutions because those duties are attached to political roles rather than biological identities," that is a successful outcome. It carves out a safe space for intergenerational justice in political philosophy without needing to fix the broader metaphysical issues of personal identity.

  **4.2 What Failure Looks Like**

  Failure looks like the argument collapsing back into the standard problem with no new moral work done.
  1.  **Reductionism:** If it turns out that the "Placeholder Role" view is just a disguised version of the "Same Number Quality Claim," then I haven't added anything new. I need to ensure the role-based duty is distinct from welfare maximization. It must be about rights or status, not just happiness.
  2.  **Empirical Dependence:** If the argument relies too heavily on the claim that institutions *actually* change who exists (the sociological claim), and that claim is contested, the philosophical point weakens. I need to make the argument work even if the identity effect is probabilistic rather than deterministic.
  3.  **Group Agent Trap:** If I have to rely on a robust metaphysical claim that "The State is a Person" to make the continuity argument work, that's a failure for this scope. That opens a can of worms about collective intentionality that I can't handle in 6 weeks. The argument needs to work with a thinner notion of institutional continuity.

  **4.3 The "So What?"**

  Ultimately, success means providing a justification for long-term institutional planning that is immune to the Nonidentity objection. This matters for climate policy, constitutional design, and debt management. If the NIP blocks these duties, political philosophy is in trouble. If I can show it doesn't block them in the institutional case, that's a significant defensive move for normative political theory. It saves intergenerational justice from metaphysical technicalities.

  **5. Scope Check and Risks**

  This is a 6-week summer paper or workshop proposal, not a book. I need to be ruthless about what I leave out. The biggest risk is getting seduced by the empirical side of the argument. I need to stay in the normative lane.

  **5.1 The Empirical Trap**

  The claim that "institutions shape mating pools and migration" is an empirical sociological claim. It is possible to argue that modern mobility is so high that institutional choices don't actually affect identity much anymore. Or conversely, that they affect it so much that *every* choice is a nonidentity choice.
  *   **Boundary:** I will not attempt to prove the empirical magnitude of IPDI. I will treat it as a philosophical premise: *Given* that institutions affect identity over long horizons (which is plausible), what are the moral implications? I will flag this explicitly. If I start digging into migration statistics or demographic modeling, I will never finish.
  *   **Stipulation:** I will stipulate the nonidentity effect for the sake of argument. The project is about the *normative* response to the effect, not the *descriptive* reality of it. This is a crucial scope limit.

  **5.2 The Metaphysical Trap**

  There's a temptation to solve the identity problem by arguing that "future people" are somehow identifiable now (e.g., via essentialism).
  *   **Boundary:** I will avoid deep metaphysics of personal identity. I will accept the standard view that different gametes = different people. I don't want to get into haecceities or trans-world identity. The point is to work *within* the NIP constraints, not dissolve them metaphysically.
  *   **Focus:** Keep the focus on *political* standing, not *ontological* status.

  **5.3 The Scope of "Institutions"**

  "Institutions" is a broad term. It could mean anything from the traffic code to the constitution.
  *   **Boundary:** I will focus on "Basic Structural Institutions" (constitutional regimes, fundamental rights frameworks). These are the ones with the longest time horizons and the deepest identity-shaping power. I won't worry about minor policy tweaks. This keeps the case studies manageable.

  **5.4 Timeline and Deliverables**

  *   **Weeks 1-2:** Flesh out the IPDI defintion and finalize the case studies (Climate Regime vs. Constitutional Amendment).
  *   **Weeks 3-4:** Draft the argument for the Placeholder Role View. This is the heavy lifting.
  *   **Weeks 5-6:** Refine the asymmetry argument and write the intro/conclusion.
  *   **Deliverable:** A 6,000-word draft that functions as a workshop paper. It should be polished enough to present but acknowledged as a work in progress regarding the empirical premises.

  **5.5 Potential Blow-ups**

  The main thing that could blow this up is if the "Placeholder Role" view is deemed incoherent. How can you owe a duty to a role? Usually, duties are owed to beings capable of suffering or claiming rights.
  *   **Mitigation:** I need to frame this carefully. The duty isn't *to the role* in a vacuum; it's a duty *of the current officeholders* to maintain the integrity of the office for *whoever succeeds them*. It's a duty of stewardship. This avoids the weirdness of duties to abstract objects. I need to make sure this distinction is clear early on, otherwise the whole framework collapses.

  Another risk is the "Non-Identity Problem is solved" crowd. Some philosophers think NIP is already solved (e.g., by impersonal views).
  *   **Mitigation:** I should acknowledge that even if NIP is solved for impersonal views, the *political* specificities remain. The project isn't dependent on NIP being unsolvable generally, but on it being unsolved *in the political domain* where person-affecting intuitions are stronger. We care more about specific citizens than abstract utility units in politics.

  **6. Concluding Thoughts**

  I think this framing has legs because it moves the debate out of the nursery and into the legislature. The standard NIP cases feel somewhat contrived (the risky policy, the 14-year-old girl). But institutional path-dependency is real. We are making choices now that will determine the political landscape of 2100. If the NIP implies we don't care about the *type* of landscape as long as the people in it are happy, that's a bullet too many for political philosophy to bite.

  By shifting to the Placeholder View, we can preserve the intuition that democracy matters intrinsically, not just instrumentally for welfare. This aligns with non-consequentialist political theories but gives them a defense against the identity objection.

  I'm still worried about the "stewardship" argument holding up under scrutiny. It feels like it might smuggle in impersonal values while claiming to be person-affecting. I need to be honest about that tension in the draft. But I think the distinction between *de re* and *de dicto* duties in a political context is under-explored enough to warrant a workshop paper.

  Let me know if you think the "Placeholder" concept is too vague. I might need to borrow more heavily from role-ethics or fiduciary theory to shore that up. Also, I need to make sure I don't get too bogged down in the climate case—it's a good example, but I don't want the paper to become a climate paper. It needs to stay focused on the identity problem.

  Anyway, that's the plan. I'll start fleshing out section 3 tomorrow.

