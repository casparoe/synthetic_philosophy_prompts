  **turn 14** — proposal whose first clause repealed Rule 208 and whose second clause did something 208 forbade. admissible. she said the repealing clause takes logical priority, so there's no conflict at any single moment.

  **turn 16** — proposal declaring that a change adopted at turn 6 never took effect. inadmissible. she said the turn 6 change was valid when she certified it and everything done under it stands; you can undo a rule going forward, you can't unmake the past.

  **turn 19** — proposal amending Rule 101 to read exactly what it already reads. admissible. she called it a no-op amendment but said it still counted as an amendment of 101. (i've argued she was inconsistant there, she says no.)

