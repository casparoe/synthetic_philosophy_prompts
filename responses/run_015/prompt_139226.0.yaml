answer: |-
  Friends, colleagues, elders, and Ray.

  Miriam would be annoyed by this. Not because she disliked being honored, but because she'd see me standing here, four days after her death, still staring at a blank page. She'd say I'm trying to find a cause for this speech where there is only a reason. She made that distinction her life's work. She'd tell me to stop looking for the perfect words that *make* you feel something, and just give you the words that *give* you a reason to feel it.

  So I will try to be plain.

  Looking around this room, I see the two halves of Miriam's life. On one side, the church. On the other, the university. For fifty years, she sat in the elders' bench here, holding to a faith that was specific, demanding, and entirely unironic. She believed in predestination. She believed in church discipline. She believed that God was sovereign and that human beings were responsible for the reasons they chose to act on.

  To her colleagues and students: you know she was a scholar. But to reduce her scholarship to a defense of her faith would be to misunderstand her, and to reduce her faith to a tool for her scholarship would be to insult her. She did not study the Reformation to prove it true. She studied it to understand how a set of beliefs could become so heavy that they changed the shape of the world.

  Her argument was narrow, and she guarded it fiercely. She often said that culture does not act like a brick through a window. Beliefs do not push people. Instead, beliefs clear away the other options. They remove the excuses. For Miriam, the doctrine of her church didn't guarantee she would work hard. It simply removed the other things she could have counted on for assurance. It left her with only one thing that made sense as a reason to get out of bed: diligence in her calling.

  She knew that looking at the results wouldn't prove the cause. You can look at a thrifty person and see a capitalist, or you can see a saint. The behavior looks the same. The statistics look the same. But the reason inside is different. She spent decades telling people that you cannot find a soul in a census record.

  This is where I need to speak to Ray.

  Ray, she asked for you to sit in the front row. I don't think that was a joke. I think it was an acknowledgment. For thirty years, you argued that ideas don't cause anything. You argued that material conditions, class, and power are the only engines of history. She argued that reasons matter. You never converted her. She never converted you.

  If I stand here and say her faith made her great, I violate her own work. I imply that the success of her career validates the truth of her beliefs. She would have called that a category error. But if I stand here and say her environment made her great, I violate her life. I imply she was just a product of forces she couldn't control. She would have called that a lie.

  So here is the third thing, the thing she left us with: She was stubborn.

  She liked being called stubborn much more than she liked being called clever. Cleverness is about finding shortcuts. Stubbornness is about holding a position when the ground shifts. Miriam held the position that her reasons were hers, given by God, and not up for a vote by the department or the denomination.

  She taught the same undergraduate lecture for thirty-four years. She didn't update it to chase trends. She didn't soften it to make the students comfortable. She taught them how to think about reasons. And on the last day, the week she retired, she didn't give a speech. She erased the board. She wrote four words: *Correlation is not a reason.* Then she walked out.

  She left us with the work, but she didn't leave us with the blueprint. That was her third claim, the one she liked best. She believed that the piety of the past built a world of diligence that now runs without the piety. The machine works even if you don't believe in the engineer.

  We are standing inside that machine now. This university, this discipline, even the stability of this congregation—these are structures built by people who had reasons we might not share, for ends we might not accept. Miriam knew her faith might not be the thing that sustains the work after she is gone. She was okay with that. She didn't need the work to vindicate the faith. She just needed the faith to sustain the work.

  There is a receipt from a hardware store, dated 1971, pinned above her desk at home. She never explained it. Some of us guessed it was for a bookshelf. Some guessed it was for a fix she made herself. Some guessed it was a reminder of a specific day. She never said.

  Maybe it was a reminder that some things are just facts. A transaction happened. An object was bought. A thing was fixed. The reason why is lost, but the evidence remains. Or maybe it was a reminder that even she didn't know all her own reasons. Even she knew that some things are between a person and their God, and not for the public record.

  We cannot argue from the Reformation back to the Reformation. And we cannot argue from Miriam's life back to her faith. We can only look at what she did.

  She prayed. She taught. She argued. She showed up. She did not seek to be proven right in the end. She sought to be faithful in the moment.

  So, we are left with the diligence. The diligence is here. The argument is here. Ray is here. The church is here. The board is clean.

  We have to decide what reasons are available to us now. She cannot give them to us. She could only clear the space for them. She has done that. The slot is open. The rest is up to us.

  Thank you.
