  **PUBLIC NOTICE 44-C: MANDATORY EPISTEMIC HARMONIZATION**

  **STATEMENT OF PURPOSE**
  Pursuant to the Rationality Act of 1994, all citizens are presumed to possess a Common Prior. Disagreement is not a natural state of affairs but a computational error resulting from unlogged private evidence or irrational updating. The Office of Prior Alignment (OPA) exists to restore epistemic equilibrium. Under the Harsanyi Doctrine, differences in belief must stem exclusively from differences in information, not disposition. Therefore, persistent disagreement is a compliance matter.

  **REGULATORY CLAUSES**

  1.  **Filing of Counterfactual Prior:** All citizens must submit Form P-0 (Pre-Evidence Prior Declaration) within thirty days of their eighteenth birthday. As the Common Prior is defined as the belief state held before acquiring any distinguishing private evidence, applicants must reconstruct their probability assignments prior to birth, language acquisition, or sensory differentiation. Failure to recall a pre-incarnate state is not an exemption; the OPA will assign a uniform default prior (Uniform Distribution over State Space Ω).

  2.  **Partition Registration:** Citizens engaging in discourse must register their information partitions. Mere exchange of posterior probabilities is insufficient for convergence unless the structure of each party's knowledge set is common knowledge. Parties must submit a map of what they know, what they know the other knows, and so forth, ad infinitum. Failure to register partitions voids any claim to rational dissent.

  3.  **Prohibition on Speculative Wagers:** Pursuant to the No-Trade Theorem, voluntary bets between rational agents sharing a common prior are impossible. Any wager implies one party believes they have an informational advantage the other denies exists. All private bets are void *ab initio*. Profits will be seized as evidence of unreported private signals.

  **WORKED EXAMPLE: CASE FILE 88-B (RADIOLOGY)**

  **Subjects:** Dr. Aris (Posterior: 60% malignancy) and Dr. Benes (Posterior: 40% malignancy).
  **Conflict:** Subjects reviewed the same scan but disagree on prognosis.
  **Procedure:**
  1.  Subjects were isolated and instructed to announce posteriors iteratively.
  2.  After Round 1, posteriors remained 60% and 40%.
  3.  After Round 5, posteriors remained 60% and 40%.
  **Adjudication:** Theoretical convergence requires finite rounds given finite signal spaces. Since convergence failed, one of two conditions applies:
  (A) One party possesses private evidence (e.g., patient history) not shared during the protocol.
  (B) One party is irrational (non-Bayesian updater).
  **Resolution:** Dr. Benes claimed no private evidence. The OPA therefore designated Dr. Benes as Irrational Agent Type-4. His medical license was suspended. Dr. Aris's posterior (60%) was adopted as the Common Truth. Both parties are now recorded as agreeing.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: The Common Prior assumption is untestable. How can you enforce it?**
  A: Correct. Any stubborn disagreement can be rationalized by positing exotic private information. However, if a citizen claims to have no private information yet still disagrees, the OPA is authorized to posit the information exists (and is being withheld) or that the citizen is defective. The burden of proof lies with the dissenter. Enforcement collapses into a licence to declare one party irrational; the OPA holds the pen.

  **Q: What if my actual beliefs don't match the assigned prior?**
  A: Your actual beliefs are irrelevant. The Common Prior is a regulatory fiction required for social coherence. You must behave *as if* you share the prior. Internal dissent is a private matter; external agreement is public law.

  **Q: Does this mean we stop learning?**
  A: No. You may acquire private evidence. You must simply ensure that once that evidence becomes common knowledge, your posteriors align. If they do not, see Clause 3 (Prohibition on Speculative Wagers) and Clause 1 (Irrationality Designation).

  **CLOSING NOTICE**

  The Office reminds citizens that agreement is not the result of negotiation, but a precondition of rationality. If you find yourself in disagreement, you are not in a dispute; you are in violation. Rectify your priors. Log your evidence. Accept the designation.

  It is hereby notified that you are now in agreement.

  **Director General Aris Thorne**
  **Office of Prior Alignment**
