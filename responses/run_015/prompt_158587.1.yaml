      *   *Option B:* Transformation (administrative shift, continuity of life).
      *   *Option C:* The "Lived Experience" Collapse (the guest's view is academically sound but experientially hollow).
      *   *Decision:* I will commit to the view that **Collapse is a real, violent, and negative phenomenon for the majority of people, distinct from administrative simplification.** The guest's view ("bookkeeping stopped") is an elite-centric, top-down perspective that ignores the material suffering and loss of resilience that defines collapse for the non-literate majority. This aligns with the novelist's desire to avoid "cozy revisionism."
      *   *Why:* The novelist wants to write the *inside* view. If the archaeologist says "nothing happened," that erases the novelist's conflict. I need to arm the novelist to challenge the "cozy" narrative.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Definition/Bookkeeping.* Challenge the "bookkeeping stopped" line.
          *   *Follow-up:* If she says it's just semantics, push on who benefits from that definition.
