      *   *Q3: The Maya.* Continuity vs. Collapse.
          *   *Follow-up:* If she says "elite structures fell," ask about the loss of trade networks that kept commoners alive.
          *   *Abandon Condition:* If she admits "collapse" is only used because the monuments stopped, ignoring population density.

      *   *Q4: Easter Island.* Ecocide vs. Rats/Colonizers.
          *   *Follow-up:* If she says "rats," ask about the loss of *choice*.
          *   *Abandon Condition:* If she admits the "ecocide" moral persists because it suits modern capitalist guilt, not archaeological fact.

      *   *Q5: Welfare/Complexity.* Skeletons vs. Monuments.
          *   *Follow-up:* If she says "health improved without kings," ask about vulnerability to shock.
          *   *Abandon Condition:* If she admits complexity provides a buffer that, when lost, kills people during the next drought.

      *   *Q6: The Ledger Criterion (User's Heuristic).*
          *   *Follow-up:* If she says "yes, that's administrative change," ask if the *reason* changed (fear vs. tax).
          *   *Abandon Condition:* If she admits ledgers stop because there's nothing to tax, not just a change in style.

      *   *Q7: The Ninety-Year Rule (User's Heuristic).* **Challenge this one.**
