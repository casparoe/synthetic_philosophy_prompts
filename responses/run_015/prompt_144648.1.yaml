answer: |-
  ### Brainstorming and Design Logic

  The single crux that separates a candidate who understands heritability from one who has merely memorised the standard warnings is the distinction between **statistical description** and **causal model dependence**. The memoriser treats heritability ($H^2$) as a measured property of a trait, akin to mean height, which simply varies by context. The understander recognises $H^2$ as a parameter derived from a specific causal decomposition of variance ($V_P = V_G + V_E + 2Cov_{GE}$), which is not fixed by the data alone when gene-environment correlations exist. The memoriser knows *that* heritability changes; the understander knows *why* it changes (shifts in variance components) and *when* it becomes undefined or arbitrary (underdetermination by data).

  The strongest purely recitable answer a candidate could give is the "Lewontin Litany": (1) heritability is a population statistic, not an individual fact; (2) it is specific to a population and environment; (3) high heritability does not preclude environmental modification of the mean; (4) within-group heritability does not explain between-group differences. A candidate can produce these four sentences without understanding the variance decomposition that makes them true. They can get a 2:1 by asserting these slogans against the dataset (e.g., "Bexley has high $H^2$ but the difference is environmental because within != between").

  My question blocks this recitation by forcing the candidate to engage with the **Deveron station**. The slogans do not cover what happens when genotypes and environments are correlated. To answer the Deveron part, the candidate cannot simply say "heritability is population-specific." They must explain that the *same* joint distribution of data can be partitioned differently depending on whether the covariance is attributed to genetic or environmental causes. This requires manipulating the variance equation conceptually, moving beyond slogan into structural understanding. Furthermore, by asking for a prediction about an intervention based on the Carrow data (crossing reaction norms), I force them to demonstrate *why* the within-group statistic fails to predict outcomes, rather than just stating that it does.

  ***

  ### 1. Examination Question

  **Option: Causation, Variation and Explanation in the Life Sciences**
  **Time Allowed: 1 Hour**
  **Total Marks: 20**

  **Question 1**

  Broad-sense heritability ($H^2$) is defined as the proportion of phenotypic variance ($V_P$) in a population attributable to genetic variance ($V_G$), such that $H^2 = V_G / V_P$. Assume that phenotypic variance is the sum of genetic variance, environmental variance ($V_E$), and twice the covariance between genotype and environment ($2Cov_{GE}$).

  Consider the following data from five agricultural research stations trials using the same crop species:

  *   **Ardmore:** A single clonal line planted on a field with a marked soil gradient. Genetic variance is negligible. Environmental variance is large. Mean stem length is 95 cm. $H^2 \approx 0$.
  *   **Bexley:** A genetically heterogeneous seed lot planted on uniform, fertilised soil. Genetic variance is large. Environmental variance is negligible. Mean stem length is 140 cm. $H^2 \approx 1$.
  *   **Transplant Evidence:** Swapping plants between Ardmore and Bexley soils shifts the mean stem length of either group by the full 45 cm difference.
  *   **Carrow:** The Bexley seed lot planted on uniform soil of intermediate quality. Mean stem length is 120 cm. However, the best-performing genetic lines at Carrow are not the best-performing lines at Bexley, and total genetic variance is lower than at Bexley.
  *   **Deveron:** A trial where seed quality and soil quality are both determined by the nursery supplier. Better genotypes sit systematically in richer micro-plots. Phenotypic variance is high.

  (a) Using the variance components ($V_G, V_E$), explain why heritability is near zero at Ardmore but near one at Bexley, despite both stations growing the same species. [4 marks]

  (b) A policy-maker argues that because $H^2 \approx 1$ at Bexley, the 45 cm difference between Bexley and Ardmore must be genetic. Using the Transplant Evidence, refute this claim and explain how a trait can be highly heritable within a group yet differ between groups due to environment. [4 marks]

  (c) At Carrow, the ranking of genetic lines changes relative to Bexley. Explain what this implies for the stability of 'genetic quality' across environments and whether a breeding programme based solely on Bexley data would succeed at Carrow. [4 marks]

  (d) At Deveron, genotypes and environments are correlated. Explain why the measured data alone cannot fix a unique value for heritability here. What additional assumption is required to calculate $H^2$, and why does this make heritability model-relative? [4 marks]

  (e) Synthesise the above: Does a heritability estimate describe the causal capacity of a trait to respond to a novel intervention? Justify your answer using evidence from at least two stations. [4 marks]

  ***

  ### 2. Model Answer

  The dataset provided illustrates that heritability is not an intrinsic property of a trait, but a statistic describing the distribution of causes within a specific causal structure. To understand this, one must look beyond the ratio $V_G / V_P$ and examine how the components of that ratio are generated.

  At Ardmore and Bexley, the difference in heritability arises from the manipulation of variance components, not the trait itself. At Ardmore, the use of a clonal line eliminates genetic variance ($V_G \approx 0$). Since $H^2 = V_G / V_P$, the ratio must be near zero regardless of environmental variation. Conversely, at Bexley, environmental variance is minimised by uniform soil ($V_E \approx 0$), making phenotypic variance almost entirely genetic ($V_P \approx V_G$), pushing $H^2$ toward one. This demonstrates that $H^2$ measures the *current* sources of variation, not the potential sources. A trait can be genetically determined in mechanism but show zero heritability if the population lacks genetic diversity, as at Ardmore.

  The policy-maker's error regarding the 45 cm difference confuses variance with means. Heritability accounts for differences *within* a population, not the mean difference *between* populations. The Transplant Evidence proves that the 45 cm gap is environmental because moving the plants moves the mean. This is possible because heritability depends on variance ($V$), while the policy-maker is concerned with the mean ($\mu$). At Bexley, $V_E$ is low, so differences between individuals are genetic. However, the *average* environment at Bexley is superior to Ardmore. Thus, a trait can be maximally heritable within a group (variation is genetic) while the group mean is shifted entirely by environment (difference is environmental). High heritability within groups is compatible with any cause for differences between groups.

  The Carrow station data reveals a further limitation: genotype-by-environment interaction (GxE). The fact that the best lines at Bexley are not the best at Carrow indicates crossing reaction norms. 'Genetic quality' is not stable; it is indexed to the environment. A breeding programme selecting solely on Bexley data would fail at Carrow because the genetic variance itself changes, and the ranking of genotypes flips. This shows that $H^2$ estimated in one regime does not predict performance in another. It is not merely that the value changes, but that the causal ordering of genotypes changes. Therefore, $H^2$ is not a stable predictor of response across heterogeneous environments.

  The Deveron station presents the deepest conceptual problem: underdetermination. Here, better genotypes are systematically paired with better environments ($Cov_{GE} > 0$). The phenotypic variance includes this covariance ($V_P = V_G + V_E + 2Cov_{GE}$). To calculate $H^2$, one must decide whether to attribute the covariance to genetic or environmental causes. If attributed to genetics, $V_G$ increases and $H^2$ rises; if attributed to environment, $V_E$ increases and $H^2$ falls. The raw measurements of stem length and soil quality do not settle this. An additional causal assumption is required about whether the covariance represents genetic niche-picking or environmental allocation. Thus, heritability is model-relative; it is not fixed by the data alone but by the causal structure imposed upon the data.

  In conclusion, a heritability estimate does not describe the causal capacity of a trait to respond to a novel intervention. As shown at Bexley, high $H^2$ does not prevent environmental intervention from shifting the mean (Transplant Evidence). As shown at Carrow, high $H^2$ does not guarantee stable genetic rankings across new environments. As shown at Deveron, the estimate itself depends on causal assumptions that may not hold under intervention. Heritability describes the architecture of variation in a specific population under a specific regime; it is a retrospective statistic, not a prospective law of response. To predict intervention outcomes, one needs knowledge of the causal mechanisms and variance components under the *new* conditions, not merely the $H^2$ of the old.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**
  **Pass Mark: 10 (Comfortable 2:1 requires 14+)**

  1.  **Variance Decomposition (Ardmore/Bexley):** Candidate must explain that $H^2$ varies because $V_G$ and $V_E$ are manipulated independently (Clonal vs. Uniform Soil), not because the trait changes.
      *   *Typical Error:* Saying Ardmore plants are "less genetic" or Bexley plants are "more determined."
      *   *Marks:* 4
  2.  **Mean vs. Variance (Transplant):** Candidate must distinguish between within-group variance (explained by $H^2$) and between-group means (explained by environment), citing the transplant shift.
      *   *Typical Error:* Asserting "within != between" without explaining the mean/variance distinction mechanistically.
      *   *Marks:* 4
  3.  **GxE Stability (Carrow):** Candidate must identify that crossing reaction norms imply genetic rank changes, making selection in one environment invalid for another.
      *   *Typical Error:* Claiming $H^2$ just "changes value" without noting the rank reversal implications for breeding.
      *   *Marks:* 4
  4.  **Model Relativity (Deveron):** Candidate must state that $Cov_{GE}$ creates ambiguity in partitioning variance, requiring a causal assumption to fix $H^2$.
      *   *Typical Error:* Saying G-E correlation just "lowers heritability" rather than making it undefined/arbitrary without a model.
      *   *Marks:* 4
  5.  **Synthesis (Intervention):** Candidate must conclude $H^2$ is retrospective/descriptive and fails to predict novel interventions, citing at least two stations.
      *   *Typical Error:* Concluding $H^2$ is "useless" rather than "context-specific," or failing to link back to specific stations.
      *   *Marks:* 4

  **Rule for Missing One Point:** A candidate who hits four points perfectly but misses one entirely should receive 16/20 (High 2:1 / Low 1st border). To secure a clear First, they must hit all five, with particular depth in Deveron (Point 4) and Synthesis (Point 5).

  ***

  ### 4. Borderline Note: 2:1 vs. First Class

  The strongest merely-slogan-level answer (Upper Second) will correctly identify that Ardmore has low $H^2$ due to lack of genetic variation and that the Bexley-Ardmore difference is environmental despite high $H^2$. It will recite the "within-group vs. between-group" distinction correctly. However, it will treat heritability as a measurable fact that simply "changes" across stations.

  The single additional move that lifts this into the First Class is the treatment of the **Deveron station**. The First-class candidate will recognise that at Deveron, heritability is not just "different" but **underdetermined** by the data. They will explicitly state that the covariance term ($2Cov_{GE}$) can be allocated to either genetic or environmental variance depending on the causal model chosen. This demonstrates an understanding that heritability is a parameter of a *theory*, not a direct measurement of nature. Without this philosophical distinction regarding model-relativity, the answer remains descriptive rather than analytical.

