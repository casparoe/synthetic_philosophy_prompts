answer: |-
  Here is the audit of the Crane/Skyhook analogy as applied to moral psychology, broken down by your specifications.

  ### 1. The Correspondence Table
  To see where the analogy strains, we first have to lock down how the reductionist typically maps Dennett's construction metaphor onto the mind.

  | Dennett's Construction | Moral Psychology Reductionism | Anti-Reductionist Critique |
  | :--- | :--- | :--- |
  | **The Ground** | Physical reality, neural substrate, evolutionary history. | The "Given." Brute facts that cannot explain *value*. |
  | **The Crane** | Mechanistic processes: synaptic plasticity, reward prediction, kin selection, mirror neurons. | Explains *causes* of belief, not *validity* of belief. |
  | **The Scaffolding** | Cultural transmission, language, social learning, cognitive development. | Merely descriptive history, not normative justification. |
  | **The Skyhook** | Irreducible moral truths, categorical imperatives, non-natural properties, a "moral sense" faculty. | Necessary to account for the *authority* of moral claims (the "ought"). |
  | **The Building** | The observable phenomenon of moral judgment, reasoning, and behavior. | The *experience* of obligation, not just the behavior. |
  | **The Engineer** | Evolution / Natural Selection (blind process). | Reason / Agency (requires a perspective *outside* the causal chain). |

  ### 2. Where the Mapping Fractures
  The analogy works for *design* (how complex things come to be), but morality is not just complex design; it is *normative claim-making*. Here are the three structural fractures.

  **A. The Is-Ought Fracture (Normativity vs. Descriptivity)**
  *   **The Crack:** A crane explains how a building *stands* (descriptive). Morality concerns how a life *should be lived* (normative). A neural mechanism can explain why you *feel* compelled to save a drowning child (empathy circuits), but it cannot explain why you *ought* to save them.
  *   **The Smuggle:** The reductionist uses the crane to explain the *belief* in the "ought" while pretending they have explained the "ought" itself. They substitute the *cause of the judgment* for the *justification of the judgment*.
  *   **Severity:** **Undermining.** This is not a cosmetic flaw; it is a category error. A crane builds facts. Morality requires reasons. Unless you define morality purely as "psychological impulses," the crane cannot reach the top floor.

  **B. The Reflexivity Fracture (The Engineer Inside the Building)**
  *   **The Crack:** In construction, the engineer stands outside the structure. In moral psychology, the "builder" (the brain/agent) is *inside* the structure it is building. The system is self-referential.
  *   **The Smuggle:** The analogy assumes a one-way street (Ground $\rightarrow$ Crane $\rightarrow$ Building). But moral reasoning allows the "Building" to inspect and remodel the "Ground" (e.g., neuroplasticity driven by cognitive reframing, or social norms altering biological expression).
  *   **Severity:** **Undermining.** It smuggles in a linear causation model that ignores feedback loops. If the building can redesign the crane, the distinction between "bottom-up mechanism" and "top-down reason" collapses, making the "Crane" label misleading.

  **C. The Authority Fracture (Binding Force)**
  *   **The Crack:** A crane lifts weight through physical force. A moral concept "binds" an agent through *authority*.
  *   **The Smuggle:** The reductionist treats normative force as if it were just a very strong psychological impulse (a heavy beam). But a strong impulse is still just a push; a moral obligation is a claim of right.
  *   **Severity:** **Undermining.** You can explain the *weight* of a feeling with neurons, but you cannot explain the *legitimacy* of a claim.

  ### 3. Cosmetic vs. Structural Disanalogies
  Not every difference kills the analogy. We need to separate the noise from the signal.

  **Cosmetic Disanalogies (The Reductionist Survives These)**
  *   **Top-Down Causation:** Critics argue cranes are only bottom-up. Neuroscience shows top-down causation (prefrontal cortex inhibiting amygdala). *Verdict:* Cosmetic. A crane can have counterweights and feedback systems. Physicalism can accommodate top-down causal pathways without invoking magic.
  *   **Complexity:** Critics say the brain is too messy for a blueprint. *Verdict:* Cosmetic. Dennett's crane was specifically designed to handle messy, evolutionary processes without a blueprint.
  *   **Consciousness:** Critics say qualia can't be built by cranes. *Verdict:* Cosmetic (in this specific context). While hard for physicalism generally, moral psychology can function behaviorally without solving the hard problem of consciousness.

  **Structural Disanalogies (The Reductionist Fails These)**
  *   **Justification vs. Causation:** As noted above, explaining why a belief exists is not explaining why it is true. *Verdict:* Fatal to the claim that morality is *fully* explained.
  *   **The Status of the "Ground":** In construction, the ground is inert. In moral psychology, the "ground" (evolutionary history) is already teleological (goal-directed survival). *Verdict:* Fatal to the "pure mechanism" claim. If the ground already has "goals" (fitness), you've already smuggled in a proto-normativity.
  *   **The Audience:** A building doesn't care if it's understood. Morality is essentially communicative and intersubjective. *Verdict:* Fatal to individualistic reductionism. You can't reduce a social contract to a single skull's wiring.

  ### 4. Does the Claim Survive?
  **The Claim:** *Morality can be fully explained without any higher-level scaffolding (Skyhooks).*

  **The Verdict:** **No, not if "explained" means "accounted for in its entirety."**

  The claim survives only if you engage in **conceptual sleight-of-hand**.
  1.  **If "Morality" = Moral Behavior/Belief:** The claim survives. You can explain why humans act cooperatively or feel guilt using only cranes (evolution, neuroscience).
  2.  **If "Morality" = Moral Truth/Obligation:** The claim fails. The crane explains the *container* (the mind making judgments) but leaves the *content* (the validity of the judgments) unaddressed.

  The reductionist conclusion relies on the assumption that once you explain the *psychology* of the moral agent, there is nothing left to explain. This is the "greedy" part of greedy reductionism. It assumes the *feeling* of obligation is the same thing as the *authority* of obligation. The Crane/Skyhook analogy facilitates this greed by making the "Skyhook" look like a magical ghost, when in the context of normativity, it actually represents **logical space** (reasons), not supernatural space.

  ### 5. A Less Misleading Image
  The construction metaphor fails because it is static, linear, and separates the builder from the build. Morality is dynamic, recursive, and institutional.

  **Better Image: The Game and the Rules**

  *   **The Mechanism (Neurons):** The physical ability of the players to move pieces, speak, and see the board. (This replaces the "Ground/Crane").
  *   **The Rules (Moral Concepts):** These are not physical objects hanging from the sky. They are not "Skyhooks." But they are also not reducible to the physical movements of the pieces. You cannot find "checkmate" by analyzing the wood grain of the king.
  *   **The Relationship:** The rules *supervene* on the physical moves but *constrain* them. The rules exist only because the players recognize them (no Skyhook), but once recognized, they have binding authority over the players (no pure Crane).
  *   **Why it works:**
      1.  **No Magic:** Rules don't need a supernatural hook; they emerge from practice.
      2.  **Normativity Preserved:** A rule tells you what you *ought* to do, distinct from what you *can* do physically.
      3.  **Reflexivity:** Players can change the rules while playing (moral progress/reform).
      4.  **No Greed:** You cannot explain "checkmate" solely by describing the neurons of the player. You need the level of the *game*.

  **Alternative Image: The Control System (Cybernetics)**
  If the Game metaphor feels too social, use the **Thermostat**.
  *   **Mechanism:** The wiring and sensor.
  *   **Norm:** The "Set Point" (e.g., 70 degrees).
  *   **Function:** The system acts to minimize the error between *current state* and *set point*.
  *   **Why it works:** It shows how a "goal" (norm) can be physically implemented without being a ghost. The "ought" is the set point; the "is" is the current temperature. The reductionist fails when they claim the wiring *is* the set point, rather than the mechanism *serving* the set point.

  **Recommendation for your column:**
  Stick with **The Game**. It captures the intersubjective nature of morality better than the Thermostat. It allows you to argue that moral concepts are **Institutional Facts**: they are real, they are binding, they require physical brains to exist, but they cannot be found *in* the brains any more than the value of a dollar bill can be found in the cotton-linen blend of the paper. This kills the Skyhook (no magic value) without empowering the greedy Crane (the value isn't just the paper).
