  3.  **Task 1: The Correspondence Table (Moral Psychology Context):**
      *   *Ground:* Neural substrate, evolutionary history, physical causality.
      *   *Scaffolding:* Social learning, cultural transmission, cognitive development.
      *   *Crane:* Mechanistic explanations (mirror neurons, reward prediction errors, kin selection).
      *   *Skyhook:* Irreducible normative truths, categorical imperatives, non-natural moral facts.
      *   *Finished Building:* The phenomenon of moral judgment/behavior (as observed).
      *   *Architect/Engineer:* (Crucial missing piece in the standard analogy) The agent themselves or the community.

  4.  **Task 2 & 3: Fractures and Disanalogies (The Audit):**
      *   *Fracture 1: Normativity vs. Descriptivity.* Cranes build *things* (descriptive). Morality involves *oughts* (normative). A crane explains why I *feel* I ought, not why I *ought*.
          *   *Severity:* Undermining. This is the Is-Ought gap disguised as engineering.
      *   *Fracture 2: The Engineer's Location.* In construction, the engineer is outside the building. In moral psychology, the brain is both the builder and the building. Reflexivity.
          *   *Severity:* Undermining. Self-reference changes the logic.
      *   *Fracture 3: Function vs. Justification.* A crane explains function (how it works). Morality requires justification (why it's right).
