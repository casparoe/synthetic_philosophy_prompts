answer: |-
  You are right. Your diagnosis of the argument is sharper than the argument itself.

  You have correctly identified that this is not a factual dispute about the Aegean data (you both agree on the 200 graves, the axes, the lag). It is an ontological dispute about the nature of "status" and the fidelity of the archaeological record as a mirror of social reality.

  Here is a third opinion on the stalemate, broken down by the layers you identified: the variables, the priors, and the possibility of progress.

  ### 1. The Three Sliding Variables
  Your hypothesis that **Labour**, **Claim**, and **Standing** are being conflated is correct. This is the classic "Saxe-Goldstein" trap, updated for a post-processual age.

  *   **Your Flatmate** assumes a tight coupling between *Standing* (objective social position) and *Claim* (what is displayed). To him, the grave is a **receipt**. It documents a transaction that happened in life (inheritance).
  *   **You** assume a loose coupling. To you, the grave is a **billboard**. It advertises a claim that might be aspirational, contested, or traditional.
  *   **The Reality:** In most societies, these three variables are *loosely coupled but structurally constrained*. You cannot put whatever you want in a grave (Labour is constrained by norms); you cannot claim whatever you want (Claim is constrained by audience reception); but what you claim does not have to match your objective economic power (Standing).

  The stalemate exists because your flatmate is arguing for **Structure** (institutions exist and constrain behavior) while you are arguing for **Agency** (actors manipulate symbols). Both are true, but you are talking past each other about *where* the truth lies in the chain of causation.

  ### 2. Bedrock Priors: Realism vs. Relationalism
  This is where the argument is actually stuck.

  **His Prior (Neo-Processual Realism):**
  He relies on the principle of **Uniformitarianism applied to Social Logic**. He believes that if a pattern is statistically significant (12% consistency, subadult inclusion), it reflects a "real" social rule. He treats the 200-year lag as *noise* because his model requires the material culture to track the socio-economic institution contemporaneously. If the institution (big houses) vanishes, the marker should vanish. If it doesn't, his model breaks, so he must treat it as noise to save the rule.
  *   *What he relies on:* The assumption that ritual is conservative *only* in form, not in meaning.

  **Your Prior (Post-Processual Relationalism):**
  You rely on the principle of **Ideological Inertia**. You believe that symbols acquire value independent of their economic base. The 200-year lag is not noise; it is the *signal*. It indicates that the "axe-and-cattle" package shifted from marking *current economic power* to marking *ancestral legitimacy* after the big houses collapsed. The "institution" didn't vanish; it transformed from a property regime to a lineage ideology.
  *   *What you rely on:* The assumption that ritual is conservative in *meaning*, often specifically to mask social change (legitimizing new elites by pretending they are old elites).

  **Who is closer?**
  In the specific context of the Aegean (likely the transition from Late Bronze Age palatial systems to Early Iron Age *oikos* structures), **your prior is historically more robust.** We know from Linear B and later Homeric epics that Aegean social memory was obsessed with genealogy and ancestral objects precisely *when* central authority collapsed. The "axe" likely stopped being a badge of office and started being a badge of "my grandfather had an office." Your flatmate is looking for a bureaucratic institution; you are looking for a legitimizing myth. Both are "institutions," but of different kinds.

  ### 3. The "Rule" vs. The "Lag"
  Your flatmate's rule ("presence, frequency, covariance") is a **necessary condition, not a sufficient one.**
  *   **Subadults:** He is right that subadult inclusion implies ascription (you are born into this). You are right that ascription does not equal *property*. It could be ascription into a cult, a clan, or a ritual moiety. He is inferring "heritable land" from "heritable status." That is the leap.
  *   **The Lag:** This is your strongest empirical lever. A 200-year lag between the economic base (houses) and the superstructural marker (graves) is massive. In archaeological time, that is a different cultural phase. To treat that as noise is methodologically unsound. It suggests the symbol has been **re-signified**.

  ### 4. The Calibration Problem
  Is he right that documentary calibration cases are useless because they are state/church-run?
  **He is half-right, but using it as a shield.**

  *   **Where he is right:** Roman or Medieval documentary evidence often prescribes *normative* law, not *practiced* reality. A law code saying "only senators get sarcophagi" doesn't mean rich freedmen didn't buy them. So, documents + graves often show a mismatch anyway.
  *   **Where he is wrong:** Early Medieval Europe (Anglo-Saxon/Frankish) provides cases where we have genealogies, land charters, *and* furnished burial. In these cases, we frequently see "fake" antiquities placed in graves, or high-status goods in graves of people who held no land, precisely to *manufacture* status. These calibration cases actually support **your** position: the grave goods are claims, not receipts.
  *   **The Real Calibration:** The best calibration isn't documentary; it's **internal inconsistency**.
      *   Are there "fake" axes? (Copyable in lead/stone vs. functional copper).
      *   Are there "empty" elite graves? (Big tomb, no goods).
      *   Are there "rich" non-elite graves? (Goods, but in the wrong sector).
      *   If the "axe" package appears in a context where it *couldn't* function as property (e.g., a cenotaph, or a child too young even for symbolic inheritance), then it is purely ideological.

  ### 5. How to Stop Arguing (Progress)
  You will be having this argument in ten years unless you change the vocabulary. The terms "Institution" and "Display" are too binary.

  **The Synthesis: Practice Theory (Bourdieu)**
  Stop asking if the grave reflects the institution or the performance. Ask about the **Habitus**.
  *   The "axe-and-cattle" package is a form of **capital**.
  *   For the first 100 years, it might be **Economic Capital** (linked to the big houses).
  *   For the next 200 years, it converts to **Symbolic Capital** (linked to lineage).
  *   The "Institution" is not a legal deed; it is the *shared belief* that the axe matters.

  **What counts as progress?**
  1.  **Abandon the word "Property."** Agree to call it "Ascriptive Status." This concedes his point (it's inherited) without conceding your point (it's necessarily land/office).
  2.  **Make the Lag the Data.** Instead of fighting over whether the lag invalidates the institution, model the lag. Why 200 years? That's roughly 8–10 generations. That is the lifespan of oral genealogy. This supports your "ideology" argument but validates his "consistency" argument.
  3.  **Shift from "True/False" to "Effective/Ineffective."** Did the claim work? If the graves with axes are consistently in the best sector of the cemetery for 300 years, the claim was *socially effective*, regardless of whether they owned the land. That is a form of institution.

  ### Verdict
  *   **Is your diagnosis right?** Yes. It is a dispute about the coupling of variables, masked as a factual dispute.
  *   **Who is relying on what?** He relies on statistical regularity implying social rule. You rely on contextual dissonance (the lag) implying ideological manipulation.
  *   **Is progress possible?** Only if you both admit that "Institution" can mean "Shared Fiction." If an entire community agrees for 300 years that the Axe Family owns the north sector, then they *do* own it, regardless of land deeds.
  *   **Will you argue in 10 years?** Yes, because the Aegean Bronze/Iron Age transition is the perfect storm for this ambiguity. But you can win the specific point on the **lag**. A 200-year survival of a marker after the economic base collapses is the hallmark of *ideology*, not *administration*. He is looking for a bureaucracy; you are looking for a religion. In the Early Iron Age Aegean, you are almost certainly the one closer to the truth.

  Tell him to read **Morris (1987)** on burial and social complexity, and then tell him to read **Whitley (1991)** on the social significance of the Early Iron Age cemetery. They had this exact argument, and the field largely moved toward your position: the cemetery is where social order is *negotiated*, not where it is *recorded*.
