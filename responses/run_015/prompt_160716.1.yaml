answer: |-
  **DEPARTMENT FOR FUTURE LIABILITY & INTERGENERATIONAL EQUITY**
  **SUPPLEMENTARY IMPACT ASSESSMENT GUIDANCE NOTE 44-B**
  **SUBJECT: CONDITIONAL EXISTENCE EXEMPTION (CEE) PROTOCOLS**
  **DATE: 14 OCTOBER 2024**

  **1.0 PURPOSE**
  This note provides statutory guidance for completing Column 4 ("Persons Adversely Affected") on Form 88 (Long-Term Regulatory Impact) where proposed policies alter the identity composition of future cohorts. Pursuant to the Non-Identity Framework Act, officers must distinguish between *same-people choices* (affecting welfare of existing or fixed identities) and *identity-affecting choices* (determining which specific individuals come into existence).

  **2.0 OPERATIONAL DEFINITION**
  A policy is classified as identity-affecting if its implementation shifts the timing of conception events for any downstream generation. As established in *Parfit v. Treasury* (2019), an individual cannot claim to be harmed by a policy that is a necessary condition of their own existence, provided their life remains above the "Non-Existence Threshold" (i.e., life is worth living). Consequently, welfare comparisons between existing under Policy A and non-existing under Policy B are invalid.

  **3.0 TECHNICAL APPARATUS: COUNTERFACTUAL CONTINUITY THRESHOLD (CCT)**
  To determine applicability, officers must apply the Counterfactual Continuity Threshold. The CCT measures the probability of identical gametes meeting under the counterfactual scenario (the alternative policy).
  *   **CCT = 1.0:** Identity is preserved. Welfare assessment required.
  *   **CCT < 1.0:** Identity is distinct. Welfare assessment exempt.

  Given that any policy shift altering economic or social conditions by >0.01% modifies daily routines enough to change conception timing by microseconds, the CCT for all generations born >70 years post-implementation will invariably register <1.0. Officers should not attempt to calculate specific genetic divergence; a blanket temporal horizon of 70 years is sufficient to trigger the Conditional Existence Exemption.

  **4.0 FORM 88 COMPLETION**
  For all cohorts failing the CCT:
  *   **Column 4 (Persons Adversely Affected):** Enter "0".
  *   **Column 5 (Severity of Harm):** Enter "N/A".
  *   **Footnote:** Append code "CEE-IDENTITY" to indicate exemption basis.

  Officers are reminded that "harm" requires a subject who could have been better off. Since alternative policies would have resulted in *different* subjects, no subject is made worse off by the choice of policy, only brought into existence with specific attributes.

  **5.0 WORKED EXAMPLE: PROJECT OAKHAVEN WASTE STORAGE**
  **Proposal:** Deferral of high-level nuclear containment upgrade.
  **Current Impact:** Relocation of 45 existing households due to site expansion (Identity Fixed).
  **Projected Impact (Year 2100):** Groundwater contamination affecting estimated 12,000 residents.

  **Assessment:**
  1.  **Current Households:** CCT = 1.0. Identities fixed. Relocation constitutes measurable welfare loss. Enter "45" in Column 4.
  2.  **Year 2100 Residents:** Policy deferral alters regional employment and migration patterns. Conception timing for 2100 cohort shifts by average of 4.2 years relative to counterfactual. CCT < 1.0. Identities distinct.
  3.  **Welfare Calculation:** While the 2100 cohort will suffer reduced life expectancy (approx. -15 years), their lives remain above the Non-Existence Threshold. Without the deferral policy, *these specific individuals* would not exist.
  4.  **Form Entry:**
      *   Current Persons Affected: 45
      *   Future Persons Affected: 0 (CEE-IDENTITY)
      *   **Total Persons Affected: 45**

  **6.0 APPROVAL STATUS**
  Based on the revised Total Persons Affected, Project Oakhaven moves from "High Risk" to "Moderate Risk." The cost-benefit analysis now reflects only the relocation expenses against the budgetary savings of deferral. The future health impacts are excluded from the net welfare sum as they do not constitute harm to identifiable persons.

  **7.0 COMPLIANCE**
  Failure to apply the CEE where CCT < 1.0 may result in inflated liability estimates and unnecessary policy paralysis. Officers must ensure that moral intuitions regarding future suffering do not override the statutory definition of "harm."

  **AUTHORIZED BY:**
  *Office of Regulatory Methodology*
  *Ref: DFLIE/44-B/CEE*
