answer: |-
  **MEMO: Amnesty Review Procedure v.3**
  **TO:** Review Panel
  **FROM:** Chair
  **SUBJECT:** How we decide (without lawyers)

  Look, we don't have the budget for legal briefs or truth commissions with hundreds of staff. We have three petitions a week, 48 hours to turn them, and the moral weight of a whole transition on our desks. If we say yes to the wrong person, we give impunity. If we say no to the wrong person, we lose history forever.

  Below is the procedure. It's not law, it's a tool. Use it to keep us consistent. When the procedure tells you to "decide," that's where you put your own conscience on the line. Don't hide behind the checklist there.

  ### The Decision Procedure (The "Machine")

  **Step 1: The Admin & Completeness Check**
  *   **Action:** Verify the petition is filled out and the applicant falls under our mandate (mid-level, state-affiliated, specific period).
  *   **Missing Info:** If key facts are missing (dates, units, specific acts), pause the clock. Send back once. If still missing after 48 hours, **HARD NO**. We can't verify truth without basics.
  *   **Pass:** Form complete, jurisdiction clear.
  *   **Fail:** **HARD NO.**

  **Step 2: The Non-Substitutable Harm Filter**
  *   **Action:** Look at the primary harm admitted. Is it sexual violence used as systematic terror? Is it the destruction of cultural/religious archives intended to erase a people's memory?
  *   **Logic:** Some crimes are so deep that truth alone cannot repair them. No amount of testimony brings back a destroyed archive or undoes systematic rape as a weapon of war.
  *   **Pass:** Harm is physical detention, standard torture, property seizure, or killing (where bodies can be found).
  *   **Fail:** **HARD NO.** (Amnesty unavailable regardless of disclosure).

  **Step 3: The Disclosure Value Test (Epistemic Repair)**
  *   **Action:** Compare their testimony against what we already know.
  *   **Question:** Does this reveal something *new* and *verifiable*? (e.g., location of bodies, chain of command names, hidden budgets).
  *   **Low Value:** Confirms what victims already said or what documents show.
  *   **High Value:** Reveals unknown sites, identifies unknown perpetrators, or explains *why* a specific policy existed.
  *   **Pass:** High Value.
  *   **Fail:** Low Value → **HARD NO** (unless Step 5 overrides, see below).
  *   *Note:* If you can't verify the truth because you lack resources, you must assume it's false. Burden is on them.

  **Step 4: The Hermeneutic Gap Check**
  *   **Action:** Read their narrative. Do they acknowledge the victim's experience of the harm, or do they just describe the mechanics?
  *   **The Gap:** A perpetrator can tell the truth about *what* they did (mechanism) but lie about *what it meant* (meaning). Example: "I detained him" (True) vs. "It was necessary for security" (Erases the victim's terror).
  *   **Pass:** Applicant acknowledges the act caused unjustified suffering or violates the victim's dignity.
  *   **Fail:** Applicant frames the act as purely technical, legitimate, or "unfortunate collateral damage" without acknowledging the wrongness.
  *   **Judgment Node:** This is values, not facts. If they are cold but precise, you have to decide if their precision is worth the moral insult. **MARK THIS AS JUDGMENT CALL.**

  **Step 5: The Proportionality Weighing (The "Gut" Node)**
  *   **Action:** Balance the Severity of the Crime vs. the Value of the Truth.
  *   **Logic:** Sometimes a terrible crime gets amnesty because the truth saves lives (e.g., finding buried bodies). Sometimes a small crime gets denied because the lie was petty.
  *   **Judgment Node:** **THIS IS WHERE YOU JUST DECIDE.** There is no formula. You are weighing impunity against history.
  *   **Output:** YES (Conditional Amnesty) or NO (Referral for Prosecution/No Action).
  *   **Documentation:** You must write exactly two sentences explaining this trade-off.

  ***

  ### Application to Current Petitions

  Here is how the machine runs on this week's three files. I've signed off on these, but read the reasoning. One of them is going to bother you.

  **Petition 1: Former Intelligence Officer (Col. V.)**
  *   **Step 1:** Pass. Complete file.
  *   **Step 2:** Pass. Harm is detention/torture, not sexual/cultural erasure.
  *   **Step 3:** **High Value.** He provided coordinates for two clandestine sites we didn't know existed. Potential to recover 40+ bodies.
  *   **Step 4:** Pass. He admits he ordered the torture, doesn't claim it was "legal."
  *   **Step 5 (Judgment):** **YES.**
  *   **Chair's Reasoning:** The recovery of 40 missing persons outweighs the prosecution of one mid-level orchestrator. It feels like impunity, but the epistemic repair for the families is concrete.
  *   *Note:* I hate this one. He ordered pain, but he holds the keys to the graves. The procedure says yes, my gut says he should rot. But without him, those families never know.

  **Petition 2: Logistics Clerk (Mr. H.)**
  *   **Step 1:** Pass.
  *   **Step 2:** Pass.
  *   **Step 3:** **Low Value.** He provided fuel receipts we already have from the treasury audit. No new names, no new sites.
  *   **Step 4:** N/A (Failed Step 3).
  *   **Step 5:** **NO.**
  *   **Chair's Reasoning:** Disclosure offers no new historical record and reveals only coerced minor complicity. Amnesty is reserved for truth that repairs the record, not redundancy.

  **Petition 3: Mid-Rank Officer (Capt. S.)**
  *   **Step 1:** Pass.
  *   **Step 2:** Pass.
  *   **Step 3:** **High Value.** Detailed account of a massacre we only had rumors about.
  *   **Step 4:** **Fail (Hermeneutic Gap).** He describes the killings precisely but frames every victim as "insurgents" or "collateral damage" necessary for order.
  *   **Step 5:** **NO.**
  *   **Chair's Reasoning:** Factual precision does not cure the erasure of victim dignity inherent in his narrative. We cannot trade amnesty for a truth that continues the violence by denying the victims' humanity.

  ***

  **Final Note to Panel:**
  You'll notice Petition 1 is the dangerous one. The procedure allows a torturer to walk because he knows where the bodies are buried. That's the deal we made: **Proportional Accountability modulated by Epistemic Repair.** Sometimes the repair matters more than the accountability. That's on us.

  If you disagree with Petition 1, speak up now. Otherwise, I'll sign the orders tomorrow morning. Don't forget to log the two-sentence reasoning in the file, seperately from the decision.

  - Chair
