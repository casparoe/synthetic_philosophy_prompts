answer: |-
  This is a remarkably sophisticated inquiry, especially given your disclaimer about lacking formal philosophical training. You have identified a genuine tension between two of the most profound meditations on temporality in Western literature. Your intuition that Borges might be inverting Augustine is astute, though the mechanics of that inversion require some fine-tuning.

  Here is an analysis of your reading, corrections on the Augustinian passage, and an evaluation of your concept of the "Double Absence."

  ### 1. Correcting the Augustinian Rendering
  Your rendering of Augustine is largely accurate, but there is one crucial nuance in *Confessions* Book XI that changes the picture of the "present."

  You write: *"that present itself has no duration, being only an instantaneous division—like a knife's edge—between what was and what will be."*

  Augustine does argue that the physical present has no length. If the present were always present and never flowed into the past, it would be eternity, not time. However, Augustine does not stop at the "knife-edge." If he did, time would indeed be impossible to measure. His solution is the *distentio animi* (the distension or stretching of the mind).

  For Augustine, the "present" is not just a geometric point; it is a triad within the consciousness:
  1.  **The Present of Things Past:** Memory.
  2.  **The Present of Things Present:** Direct Perception (Attention).
  3.  **The Present of Things Future:** Expectation.

  Therefore, Augustine *rescues* duration by moving it from the external world into the internal mind. The "breadth" you mention is not lent to the present by memory; rather, the present *is* the act of remembering and expecting. So, your reading that he "lodges it inside consciousness" is correct, but it is stronger than that: consciousness *is* the locus of time's existence. Without the mind stretching across memory and expectation, time collapses.

  ### 2. Evaluating the "Double Absence"
  Your coined phrase, the **Double Absence**, is a compelling heuristic. Let us break down its two parts in relation to Borges:

  1.  **The Past is Absent (because it is gone):** This is standard temporal logic, shared by Augustine.
  2.  **The Past is Absent (because the present rewrites it):** This is where Borges diverges from Augustine.

  Is this an imposition? Not entirely, but it requires a shift from "archival" language to "ontological" language. You suggest the present "rewrites the record," implying there was an original record that gets altered. Borges goes further: he suggests there *never was* an original sequence to begin with.

  In his essay *A New Refutation of Time*, Borges argues that time is a series of independent moments. Moment B does not follow from Moment A; they are merely juxtaposed. Therefore, the present does not "rewrite" the past; the present *creates* the past retroactively. In the story *The Garden of Forking Paths*, every choice creates all possible futures, effectively shattering linear causality.

  **Where "Double Absence" might mislead you:**
  The term "Double Absence" suggests a loss or a negation (anxiety about the missing archive). Borges's tone is often more playful or mystical. He isn't lamenting that the archive is unstable; he is celebrating the self-sufficiency of the immediate moment. For Borges, the lack of connection between moments is what liberates the individual from the burden of history.

  However, as a conceptual tool to contrast him with Augustine, it works well.
  *   **Augustine:** The past is absent externally but *present internally* (Memory).
  *   **Borges:** The past is absent externally and *irrelevant internally* (because the self is also discontinuous).

  ### 3. Substance vs. Relation (Your Specific Questions)

  **Question:** *Does Augustine's claim ("if nothing passed away...") make time a pure relation between states, with no substance of its own?*

  **Answer:** Yes. Augustine is arguing against the idea that time is a "thing" (substance) that flows like a river. If time were a substance, it would exist even if nothing changed. But Augustine argues that time is dependent on the *mutation* of things. It is a measure of change. However, he adds the crucial caveat: it is a measure of change *as registered by the mind*. So, it is a relation between states, but a relation that requires a witness (the soul) to exist.

  **Question:** *When Borges denies time, is he denying the relation itself, or only denying that one of its poles—the enduring present—exists at all?*

  **Answer:** This is the crux of the difference.
  *   **Augustine** denies the reality of the past and future poles but affirms the **relation** (the *distentio*) that binds them in the mind.
  *   **Borges** affirms the reality of the **poles** (the individual moments) but denies the **relation** (succession/causality) that binds them.

  Borges is essentially a temporal atomist. He believes the "now" is real (in fact, it is the *only* thing that is real), but he denies that this "now" is connected to the previous "now" by any necessary law. In *A New Refutation of Time*, he leans on the idealism of Berkeley and Hume. Hume argued that we never actually perceive "causality," only one event followed by another. Borges takes this to the extreme: if we don't perceive the connection, the connection doesn't exist.

  So, Borges is not denying the enduring present; he is denying that the present *endures*. He posits a series of discrete, frozen "nows" that do not touch.

  ### 4. Synthesis: Is Borges Augustine in Reverse?

  You asked if Borges is doing something similar to Augustine but in reverse. The answer is **yes, regarding the location of reality, but no, regarding the solution.**

  *   **Augustine's Move:** The external world of time is unstable (past is gone, future isn't here). **Solution:** Retreat into the Internal Mind, which holds both past and future simultaneously. Time is saved by Subjectivity.
  *   **Borges's Move:** The external world of time is unstable. **Solution:** Retreat into the Immediate Moment, which requires no past or future to be valid. Time is dissolved by Subjectivity.

  Your "Double Absence" captures the Borges side effectively if you tweak the definition slightly. It is not that the present *rewrites* the past (which implies a continuous editor); it is that the present *obviates* the past. In Borges's universe, every moment is a fresh creation. The "archive" isn't corrupted; it is unnecessary.

  ### Summary of Corrections and Affirmations

  1.  **Augustine's Present:** Correct your view that the Augustinian present has *no* duration. It has no *physical* duration, but it has *psychological* duration (*distentio animi*). This is how he avoids the "knife-edge" paradox.
  2.  **Double Absence:** This is a fair extension, provided you understand that for Borges, the "rewriting" is ontological, not historical. The past doesn't change; the past is revealed to have never been fixed.
  3.  **Substance vs. Relation:** You are correct that Augustine views time as relational (dependent on change and mind). You are correct that Borges attacks the relation (succession) rather than the moment (the pole).

  You are not importing textual anxiety so much as you are identifying the existential cost of Borges's metaphysics. If Augustine's view comforts us (we carry our history within us), Borges's view terrifies us (we are born anew in every second, with no guarantee we are the same person who existed a moment ago). Your "Double Absence" captures that terror well.
