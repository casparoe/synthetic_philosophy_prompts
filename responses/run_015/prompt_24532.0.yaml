answer: |-
  There is no single, universally accepted noun that captures this exact argumentative structure, but in the fields of risk analysis, behavioral economics, and legal theory, this phenomenon is described by a specific cluster of concepts.

  The most precise label for the pattern you are describing is **Asymmetric Precaution** (or **One-Sided Precaution**), which is driven cognitively by **Ambiguity Aversion** and analytically characterized as **Risk-Risk Tradeoff Neglect**.

  Here is a breakdown of the phenomenon, the concepts that define it, and how it differs from the related ideas you mentioned.

  ### 1. The Core Concepts

  To understand this pattern, you have to separate the *psychological driver*, the *epistemic justification*, and the *policy failure*.

  **A. The Epistemic Justification: Knightian Uncertainty**
  The argument relies on a distinction made by economist Frank Knight in 1921. He distinguished between **Risk** (outcomes are unknown, but probabilities are known/calculable) and **Uncertainty** (outcomes and probabilities are both unknown).
  *   **The Pattern:** Proponents argue that the status quo involves *Risk* (which is manageable/acceptable), while the new technology involves *Uncertainty* (which is intolerable).
  *   **Why it matters:** This provides the intellectual cover for the asymmetry. It claims not to be a bias, but a rational response to different *types* of information gaps.

  **B. The Cognitive Driver: Ambiguity Aversion**
  This is the behavioral economics term (derived from the **Ellsberg Paradox**) that best explains the psychology. Humans systematically prefer options with known probabilities over options with unknown probabilities, even if the expected value of the unknown option is higher.
  *   **The Pattern:** The "known" harms of fossil fuels or conventional pesticides are psychologically discounted because they are familiar (ambiguous = low). The "unknown" harms of nuclear or GM crops are amplified because they are ambiguous (ambiguous = high).
  *   **Why it matters:** This explains *why* the argument is persuasive, even if the "known" risks are objectively larger.

  **C. The Policy Failure: Risk-Risk Tradeoff Neglect**
  This is the term used by legal scholars (most notably Cass Sunstein and Jonathan Wiener) to critique this specific application of the Precautionary Principle.
  *   **The Pattern:** Regulators focus exclusively on the risk created by the *new* action while ignoring the risks sustained by the *old* action (the status quo).
  *   **Why it matters:** Sunstein argues that the Precautionary Principle is "paralyzing" because risks exist on all sides. Banning nuclear power (due to uncertainty) forces reliance on coal (due to certainty), which may cause more deaths. Ignoring this tradeoff is **Risk-Risk Tradeoff Neglect**.

  ### 2. Proposed Name: "Asymmetric Precaution"

  If you need a label for the argumentative move itself, **"Asymmetric Precaution"** is the most descriptively accurate term used in policy analysis.

  **Definition:** A regulatory stance that invokes the Precautionary Principle to restrict novel interventions due to epistemic uncertainty, while exempting the status quo from the same standard on the grounds that its risks are "known," despite the status quo carrying active, quantified harms.

  ### 3. Distinguishing It from Related Concepts

  You asked specifically how this differs from Status Quo Bias, Omission Bias, and Double Standards. Here are the edges of the concept.

  #### Vs. Status Quo Bias
  *   **Status Quo Bias** is a preference for the current state of affairs simply because it is the current state. It is often irrational and rooted in loss aversion (fearing the loss of what we have more than we value gaining something new).
  *   **Asymmetric Precaution** claims a *principled* epistemic distinction. Proponents do not say, "We like the old pesticide." They say, "We *know* the old pesticide's damage, but we *don't know* the new one's."
  *   **The Edge:** If the proponents admitted the new technology was safer but still rejected it because "it's new," that is Status Quo Bias. If they reject it because the *probability distribution* is unknown, it is Asymmetric Precaution (driven by Ambiguity Aversion).

  #### Vs. Omission Bias
  *   **Omission Bias** is the tendency to judge harms caused by *action* (commission) as worse than harms caused by *inaction* (omission).
  *   **The Pattern:** In your examples, the status quo is not actually "inaction." Continuing to burn fossil fuels is an active process. However, proponents often frame the status quo as "doing nothing new" to leverage Omission Bias.
  *   **The Edge:** Omission Bias focuses on *agency* (I did it vs. I let it happen). Asymmetric Precaution focuses on *knowledge* (I know the odds vs. I don't know the odds). You can have Asymmetric Precaution without Omission Bias if you acknowledge that maintaining the status quo is an active choice, but still argue its risks are preferable because they are quantified.

  #### Vs. Double Standard
  *   **Double Standard** implies hypocrisy or a lack of principled consistency (e.g., "Rules for thee, but not for me").
  *   **The Pattern:** Asymmetric Precaution claims consistency through the **Risk-Uncertainty Distinction**. The argument is: "The standard is the same (manage uncertainty), but the *conditions* differ (one is risk, one is uncertainty)."
  *   **The Edge:** It ceases to be Asymmetric Precaution and becomes a plain Double Standard if the "known" risks of the status quo are actually just as uncertain as the new technology, but are treated as known for convenience. (e.g., claiming we fully understand the long-term ecological impact of conventional agriculture when we arguably do not).

  ### 4. Summary of the Phenomenon

  The pattern you are noticing is the operationalization of **Ambiguity Aversion** into policy via an **Asymmetric Burden of Proof**.

  *   **What it is:** A regulatory heuristic that treats "unknown probabilities" (Uncertainty) as a veto for new technologies, while treating "known probabilities" (Risk) as acceptable for existing technologies, often ignoring that the "known" risks may be more severe than the "unknown" ones.
  *   **What it is not:** It is not necessarily irrational (Ambiguity Aversion can be a survival heuristic), nor is it necessarily hypocritical (the Risk/Uncertainty distinction is philosophically valid).
  *   **Where the edges are:** The argument collapses if the status quo risks are shown to be *uncertain* (e.g., "We actually don't know the full cascade effects of conventional pesticides either") or if the new technology's risks are shown to be *quantifiable* (e.g., "We have 20 years of data on this GM crop").

  In academic debates, specifically those surrounding Cass Sunstein's *Laws of Fear* or the work of the Harvard Center for Risk Analysis, this is most commonly critiqued as a failure to perform **Risk-Risk Analysis**. If you need a noun for the pattern itself, **Asymmetric Precaution** is the most precise term available.
