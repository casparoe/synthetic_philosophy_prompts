answer: |-
  **Elena:** You're conflating the representation with the reality, Marcus. The monotonicity axiom isn't a claim about the metaphysical stability of utility units; it's a normative constraint on how bargaining power should respond to opportunity. If the feasible set expands—meaning new options become available that were previously impossible—and the maximum possible payoff for each player remains unchanged, then no player should be forced to accept less than they would have in the smaller set. That is a minimal requirement of rational cooperation. To deny it is to say that having more options can make you worse off, simply because the geometry of the set changed.

  **Marcus:** I don't deny the intuition, Elena. I deny that your formulation captures it without smuggling in a hidden assumption. You insist on holding the ideal point fixed in absolute terms, regardless of where the disagreement point lands. But in the environments I'm describing—non-convex spaces, indivisible goods—the disagreement point isn't a static anchor. It shifts endogenously with the scale of the feasible region. If the set expands because the stakes of the interaction have scaled up, the threat point scales with it. By anchoring the ideal point to an absolute origin while allowing the disagreement point to drift, you are implicitly assuming that the utility distance between "no deal" and "best possible deal" is comparable across different scales. It's an unjustified symmetry in utility scaling.

  **Elena:** It's not unjustified; it's necessary for the axiom to have any bite. If we allow the ideal point to rescale every time the disagreement point shifts, we lose the ability to compare the solution across different feasible sets. The whole point of the Kalai–Smorodinsky approach is to normalize the problem: map the disagreement point to the origin and the ideal point to the unit vector. If you refuse to fix the ideal point relative to that normalization, you aren't doing bargaining theory anymore; you're doing descriptive psychology. You need a fixed reference frame to define "expansion."

  **Marcus:** But that fixed reference frame is exactly where the normative commitment leaks in. You claim it's just a technical normalization, but by fixing the ideal point absolutely, you are asserting that the utility of the utopia point is invariant to the worsening or improving of the status quo. Consider a labor negotiation. If the feasible set expands because the firm's profits have doubled, the worker's disagreement point—say, the market wage—might also rise. If you hold the firm's maximum surplus fixed in absolute utility terms while the worker's threat point rises, your monotonicity axiom demands the worker's payoff not decrease. But if the *range* of cooperative surplus has shrunk because the threat point ate into the ideal point, forcing the payoff to stay constant might violate Pareto efficiency in the new scaled environment. You're prioritizing the anchor over the interval.

  **Elena:** I concede that if the disagreement point moves, the *gains* from cooperation change. But the monotonicity axiom applies when the ideal point is *held fixed*. That is the ceteris paribus condition. If the maximum achievable utility for both parties is unchanged, but the set of intermediate possibilities grows, why should anyone accept less? Your "localized" view suggests we should rescale the ideal point relative to the new disagreement point. But that means the ideal point moves in absolute space. If the ideal point moves, you aren't testing monotonicity anymore; you're testing a different solution concept entirely. You're essentially arguing that the utility function itself is context-dependent.

  **Marcus:** I'm arguing that the *measurement* of the ideal point is context-dependent. In convex environments with divisible goods, your global monotonicity works because the utility frontier is smooth and the scaling is linear. But introduce indivisibilities—discrete options—and the geometry breaks. The "distance" to the ideal point isn't a continuous variable. If I have a set of discrete contracts, and we add a new contract that expands the set but doesn't change the maximum possible payoff, your axiom says I shouldn't lose. But if that new contract changes the leverage dynamics such that the disagreement point effectively shifts in utility space, holding the ideal point fixed ignores the change in bargaining power. You're treating the ideal point as a physical ceiling, when it's really a measure of potential gain relative to the threat.

  **Elena:** You're right that non-convexities complicate the existence of a solution, and I grant you that in discrete environments, the smooth monotonicity property can't be applied mechanically. But that's a reason to restrict the domain of the axiom, not to abandon the normative principle. If we adopt your localized rescaling, we face a much harder problem: indeterminacy. If the ideal point is allowed to float relative to the disagreement point based on "scale" or "leverage," we lose the uniqueness of the solution. The Kalai–Smorodinsky solution is prized because it selects a single point on the Pareto frontier. Your localized view opens the door to a multiplicity of solutions depending on how one chooses to rescale the utility units. How do you perform comparative statics if the ruler changes length every time the set changes shape?

  **Marcus:** That is a fair cost. I will concede that localized rescaling undermines uniqueness. If the scaling factor depends on the endogenous position of the disagreement point, then small perturbations in the threat point could lead to discontinuous jumps in the solution. It makes the model less predictive. But I would argue that false precision is worse than honest indeterminacy. If the uniqueness of your solution relies on an arbitrary normalization that treats utility units as invariant across different bargaining contexts, then the uniqueness is an artifact of the model, not a feature of the negotiation. I'd rather have a set-valued solution that respects the changing leverage of the disagreement point than a point-solution that assumes a symmetry that doesn't exist.

  **Elena:** But without that symmetry, we can't distinguish between a change in opportunities and a change in preferences. If you rescale the ideal point every time the disagreement point moves, you are effectively redefining the players' utility functions for every feasible set. That makes it impossible to say whether a player is better or worse off in any objective sense. The global monotonicity principle preserves the inter-set comparability of welfare. It says: "Given these preferences, if the world gives you more options, you shouldn't be punished." Your view says: "If the world gives you more options, we need to recalibrate what 'better' means." That risks making the theory tautological.

  **Marcus:** It risks it, yes. But your view risks imposing a normative judgment under the guise of technical necessity. By anchoring the ideal point absolutely, you are silently privileging the maximum possible payoff over the gain from cooperation. In many real-world disputes, what matters isn't the absolute ceiling, but the ratio of the gain to the risk. When the disagreement point shifts endogenously, that ratio changes. If you ignore that by fixing the ideal point, you aren't being neutral; you're taking a stance that the ceiling matters more than the floor. I'm not saying we shouldn't use monotonicity. I'm saying it must be localized to the specific geometry of the threat and opportunity, even if that costs us uniqueness.

  **Elena:** I hear you. You're willing to sacrifice uniqueness to preserve the integrity of the utility scaling in non-convex environments. I'm willing to accept the scaling assumption to preserve uniqueness and inter-set comparability. We agree on the math of the convex case; we disagree on whether the axiom should extend to the non-convex case at the cost of its clean properties.

  **Marcus:** Precisely. You see the axiom as a normative beacon that should guide us even when the terrain is rough. I see it as a map that only works on smooth terrain, and becomes misleading when we try to force it onto jagged ground.

  **Elena:** Then perhaps we can agree that the "genuinely normative" part is the desire for monotonicity itself, while the "technical convenience" is the assumption that utility scales allow for a global anchor.

  **Marcus:** I can accept that distinction. But I maintain that in the jagged ground, the technical convenience becomes a normative vice.

  **Elena:** And I maintain that without the technical convenience, the normative desire has no operational form.

  **Marcus:** (Sighs, gathering papers) Then we're back to where we started. Just with clearer definitions of why we're stuck.

  **Elena:** In this field, Marcus, that's usually the best result we can hope for.
