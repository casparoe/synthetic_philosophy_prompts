  Finally, the costs. A defender of (KP-EN) must explicitly abandon the claim that there are no unknown truths simpliciter. The principle cannot argue that every truth is known or even knowable. It accepts that non-EN truths, such as 'p & ¬Kp', may be true and unknown. The anti-realist sacrifice is significant: the universal link between truth and knowledge is severed. We retain the link only for truths independent of knowledge distribution. The position saves anti-realism from logical collapse but concede that some truths exceed the scope of knowability.

