  Consider the proposition q: 'A specific tree fell in 1900'. This truth depends on physical history, not on who knows what. Thus, EN(q) holds. (KP-EN) entitles the defender to assert ◇Kq: it is possible to know the tree fell. This preserves the anti-realist stance on the past. However, consider the Fitch conjunction u: (q & ¬Kq). The truth of u explicitly depends on the knowledge distribution (specifically, that q is unknown). Therefore, ¬EN(u). (KP-EN) imposes no requirement that ◇Ku. The paradox is blocked because the derivation relies on applying (KP) to u. By restricting the domain to EN propositions, the contradiction never arises, yet the substantive claim about the tree remains intact.

  Three objections challenge this position. First, ad hocness. EN is defined via invariance under knowledge permutations, referencing K. Critics argue this bans Fitch conjunctions by stipulation. However, EN tracks metaphysical supervenience, not merely syntactic vocabulary. A syntactic ban would exclude propositions containing 'K' even if their truth were fixed by physical facts. EN excludes propositions whose truth *conditions* involve knowledge states. This aligns with the anti-realist explanatory role: truth is grounded in evidence, not in the absence of knowledge. The restriction flows from the theory of truth, not the paradox itself.

