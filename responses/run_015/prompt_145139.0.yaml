  **Preliminary Brainstorming: Presuppositions of Singable Translation**

  1.  **Functional Primacy:** The practice presupposes that the *act* of singing together (communal function) outweighs the *content* of the words (semantic function).
  2.  **Musical Identity:** It presupposes that the tune and metre are the essential "body" of the song, while the text is the "soul" that can be reincarnated in different languages.
  3.  **Performative Constraint:** It presupposes that rhythmic synchrony is a hard constraint; if the text breaks the rhythm, the performance fails, so text must yield.
  4.  **Aesthetic Unity:** It presupposes that text and tune are a fused aesthetic object; altering the tune to fit the text destroys the object more than altering the text.
  5.  **Ritual Continuity:** It presupposes that maintaining the familiar slot and sound in the service is more important than strict fidelity to the original author's specific imagery.

  ***

  **The Philosophy of the Singable Text**

  Your sister is operating under a theory of translation suitable for *discursive* texts (like scripture or law), where the proposition is the thing itself. In that regime, changing the imagery changes the truth claim, so the translation fails. However, the congregational practice you describe operates under a different ontology of the text. It distinguishes between *logos* (word as truth) and *melos* (word as song).

  The singing practice presupposes that a hymn or carol is not merely a poem set to music, but a single musical entity where the text is a variable component subordinate to the invariant musical form. When a congregation sings "O Come, All Ye Faithful" in English, Spanish, or Latin, they identify it as the *same* carol not because the words match, but because the melodic contour, the metre, and the ritual slot remain constant. The practice strictly presupposes that **musical form constitutes the song's primary identity**. If you preserved every semantic nuance of the French lullaby but broke the metre, you would no longer have the lullaby your grandmother sang; you would have a poem *about* the lullaby.

  This explains the apparent inconsistency between the hymn and the scripture reading. Scripture is treated as *revealed proposition*; its authority lies in its specific content. To paraphrase scripture is to alter the revelation. Hymns are treated as *responsive prayer*; their authority lies in their capacity to facilitate communal worship. To break the metre of a hymn is to break the communal act. Therefore, the practices are not inconsistent; they recognize two different modes of language use within the liturgy.

  If the congregation decided content was the only thing that mattered, they would have to abandon metrical hymnody entirely. They would need to chant prose translations or constantly compose new tunes for every translation to accommodate the specific syllable count of the target language. The ritual would lose its musical continuity.

  Regarding your lullaby: Your sister is technically correct that it is not a *semantic* translation. But in the genre of song, semantic fidelity is secondary to performative fidelity. By locking the form, stress, and even the vowel sounds on long notes, you have preserved the *phenomenological experience* of the song—the sound of it—which is likely the vessel of your memory. You have produced what translation theorist Peter Low would call a "singable translation," which is a valid species of translation distinct from "semantic translation."

  \answer{Musical form constitutes the song's primary identity}
