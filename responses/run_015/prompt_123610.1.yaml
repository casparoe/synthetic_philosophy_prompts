  - The rules: Rule one is Affective Hedonism, which holds that unpleasantness alone constitutes badness, rendering tissue damage and body ownership irrelevant. Rule two is Embodied Ownership, which argues pain is only bad when negative affect is mapped onto the subject's bodily self-model. Both rules fit her first four cases because affective presence always coincided with body schema presence in her "bad" verdicts. However, they diverge on whether the self-model is a constitutive element of suffering or merely a common companion.

  - The BCI split: In the BCI case, negative affect is present but the robot arm is explicitly excluded from the body schema. Affective Hedonism predicts a "bad" verdict because the subject experiences genuine suffering. Embodied Ownership predicts "not bad" because the threat is not localized to the biological self. This forces a choice between welfare phenomenology and bodily integrity.

  - Best guess: I predict she rules it "bad" because her previous rejections of "badness" (Cases 1 and 4) hinged entirely on absent affect, not absent ownership. Her acceptance of phantom pain (Case 3) prioritizes the reality of suffering over biological tissue integrity. As an embodied cognition specialist, I suspect she views the body schema as flexible, but the welfare impact of negative valence as non-negotiable. Therefore, the raw phenomenal suffering outweighs the lack of biological incorporation.

  - Tie-breaker case: Consider a patient with somatoparaphrenia who feels intense pain in a biological limb they firmly deny belongs to them. If she calls this "not bad," Embodied Ownership wins; if "bad," Affective Hedonism is confirmed.
