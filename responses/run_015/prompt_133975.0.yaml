  From barren sands true solidarity finds its **spring**,
  Ignoring charts that map a slow **decline**.
  They draw a straight and ambitious **line**,
  Believing time will not compel **return**
  To crush the stone of every rising **empire**
  Beneath the weight of its own eventual **ruin**.

  They build upon the bedrock of past **ruin**,
  Convinced this bloom is permanent, not **spring**.
  No shadow falls across the swelling **empire**,
  Though luxury begins the quiet **decline**.
  The ancestors promise they will **return**,
  But successors erase the ancestral **line**.

  The blood-thin generations lose the **line**,
  And gather harvest from the field of **ruin**.
  No vigorous blood calls the spirit to **return**,
  While cities rot before the next **spring**.
  The luxury that signals slow **decline**,
  That eats the vitals of the standing **empire**.

  What god will save this overextended **empire**?
  They trace a genealogy in a **line**,
  Blind to the curve of universal **decline**.
  New barbarians walk through gates of **ruin**,
  Claiming their dawn is a unique **spring**,
  Not knowing history is doomed to **return**.

  The conquerors swear they will not **return**
  To build another transient **empire**.
  They plant their flag in eternal **spring**,
  And mark the border with a straight **line**.
  They walk across the bones of past **ruin**,
  Unaware they start the same slow **decline**.

  So historians argue over **decline**,
  Or wait for ages that will never **return**.
  They sift the ash and monument of **ruin**,
  Seeking a shape beyond the broken **empire**.
  Is history a circle or a **line**,
  Or winter soil awaiting next **spring**?

  We mask the **decline** hidden in the **empire**,
  Where every **return** climbs a spiral **line**,
  Yet plant our feet in **ruin** seeking **spring**.
