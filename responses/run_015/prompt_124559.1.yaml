    "core_question": "Does successful cross-modal identification via sensory-substitution devices require a pre-existing shared representational format, regardless of explicit instructional decoding?",
    "why_standard_framing_fails": "Locke and Leibniz argue about origin (innate vs learned) but assume natural senses, missing how artificial modalities reveal format compatibility issues.",
    "week_by_week_method": "Week 1 conceptual mapping, Week 2 review user reports, Week 3 philosophical analysis of identification, Week 4 drafting synthesis.",
    "success_vs_failure": "Success is proving the issue is format compatibility; failure is getting bogged down in tech specs or inconclusive data.",
    "scope_risk": "One month is tight so I must limit scope to shape identification and existing literature rather than new experiments.",
    "defense_against_neuroscience_objection": "This analyzes conceptual conditions of identification and perceptual experience not neural mechanisms or wiring.",
    "niche_injection": "Using sensory-substitution devices where users know the decoding rules to test if spatial formats are still required."
  }
