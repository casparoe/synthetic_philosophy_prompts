answer: |-
  The iron **bucket** hangs against the wall,
  Inside it lies a mirror of still **water**.
  Suspended by a thin and twisted **rope**,
  It faces out into the surrounding **void**,
  Unmoving relative to distant **stars**,
  The surface shows no concave downward **curve**.

  We twist the cord to introduce a **curve**,
  And spin the hanging iron **bucket**.
  The walls move past the quiet distant **stars**,
  But inertia holds the resting **water**.
  It slips against the dark and empty **void**,
  While tension builds along the twisted **rope**.

  The tension holds within the twisted **rope**,
  Until the surface shows a deepening **curve**.
  It fills the space excluding empty **void**,
  The liquid sticks inside the spinning **bucket**.
  It climbs the walls, this co-rotating **water**,
  Now still to walls, yet moving past the **stars**.

  He claims it turns relative to the **stars**,
  And pulls against the tension of the **rope**.
  The force arises from the moving **water**,
  Revealing its own absolute **curve**.
  Proof space exists outside the iron **bucket**,
  A stage distinct from all material **void**.

  But Mach denies the solitary **void**,
  Without the mass of all the distant **stars**.
  Imagine now the isolated **bucket**,
  Severed from earth, yet still the twisting **rope**.
  In emptiness there would be no **curve**,
  No force to lift the surface of the **water**.

  So what lifts up the surface of the **water**?
  Is it the space or just the empty **void**?
  We measure only this concave **curve**,
  While turning under night's indifferent **stars**.
  The twist remains within the hanging **rope**,
  The question hangs inside the iron **bucket**.

  Whether space acts on **water** in the **void**,
  Or mass defines the **curve** beneath the **stars**,
  The twist remains within the **rope** and **bucket**.
