      *   (b) Probabilistic: 10% is usually "risk/recklessness," not "knowledge." Prediction: "Not intentional" (or significantly lower than 90% certainty).

  10. **Final Review:** Does this sound like advice from a senior grad student/postdoc to an RA? Yes. Needs to be encouraging but rigorous. Acknowledge the "semanticist roommate" point without conceding entirely.

      *Self-Correction on Case 3:* The user says "mechanism he counts on turns out not to be what causes the damage." This is a classic *aberrant causal chain*. The principle *must* highlight causal guidance.
      *Self-Correction on Case 5:* This distinguishes "oblique intention" (foresight) from "direct intention" (goal). But Knobe (Case 1) says oblique *can* be intentional if bad. Case 5 says oblique is *not* intentional if there is regret/justification. The difference is *attitude* (indifference vs. regret).
      *Synthesis:* The principle is about whether the outcome is *integrated into the plan* given the normative context.

      *Let's formulate the principle clearly:* **The Normatively-Modulated Plan Integration Account.**
      *   Core: Intentionality requires the outcome to be integrated into the agent's plan.
