      *   *Simple Blame Account:* "Intentionally" = "Blameworthy."
          *   Fits: 1 (Blame $\rightarrow$ Int), 2 (No Blame $\rightarrow$ Not Int), 5 (Justified/Regret $\rightarrow$ Less Blame $\rightarrow$ Not Int).
          *   Fails: 3 (High Blame $\rightarrow$ Not Int). This is the "Deviant Causal Chain" problem. Blame doesn't track intentionality here because the *control* condition fails.
          *   Fails: 6 (No Blame $\rightarrow$ Not Int). This actually fits, but the user says the word "goes dead," suggesting lack of *agency* attribution, not just lack of blame.
      *   *Semantic/Conversational Account (Roommate):* It's about pragmatics/assertability.
