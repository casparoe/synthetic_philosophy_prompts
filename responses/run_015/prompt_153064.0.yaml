      *   **Tone:** Professional, academic, philosophically precise, but practical for a RA designing stimuli.

  2.  **Deconstruct the Cases & Verdicts:**
      *   *Case 1 (Classic Harm):* Indifferent, foreseen harm $\rightarrow$ Intentional. (Standard Knobe)
      *   *Case 2 (Classic Help):* Indifferent, foreseen help $\rightarrow$ Not Intentional. (Standard Knobe)
      *   *Case 3 (Deviant Causal Chain/Malice):* *Wants* harm, but mechanism is deviant (unforeseen cause) $\rightarrow$ Not Intentional (or weaker). *Conflict:* High blame, low intentionality.
      *   *Case 4 (Omission):* Indifferent, foreseen harm via inaction $\rightarrow$ Intentional (but diluted, ~70%).
      *   *Case 5 (Trade-off/Regret):* Regrets harm, sees it as cost, not goal $\rightarrow$ Not Intentional. *Conflict:* Foreseen bad outcome, but "intentionally" denied.
      *   *Case 6 (Neutral):* Indifferent, foreseen neutral change $\rightarrow$ Not Intentional (mind goes blank).
      *   *Case 7 (Committee):* 3-2 vote, all indifferent. Committee = Yes, Yes-voters = Yes, No-voters = No. *Conflict:* Collective intention $\neq$ sum of individual intentions.

