          *   Fits: 1 (Profit was reason, harm was accepted cost, but Knobe effect says we call it intentional anyway). Wait, standard Knobe says we *do* call it intentional even if it wasn't the reason. So a pure "reason" account fails Case 1.
      *   *Deep Self/Endorsement Account:* Did the outcome align with the agent's values?
          *   Fits: 1 (Indifference aligns with profit-over-values).
          *   Fits: 5 (Regret misaligns).
          *   Fails: 7 (Committee aggregation problem).

  4.  **Synthesize a Unifying Principle:**
      *   The user's intuition in Case 3 is the key constraint. They deny "intentional" despite high blame because the *causal path* wasn't guided by the agent's plan.
      *   The user's intuition in Case 5 is the second key constraint. They deny "intentional" because the outcome was a *side constraint*, not a *guide*.
      *   The user's intuition in Case 1 is the baseline. Indifference + Foreseen Harm = Intentional.
      *   *Hypothesis:* The principle is **"Guided Control."** To act intentionally, the agent must (A) foresee the outcome, (B) have the outcome be consistent with their motivational set (not actively opposed), AND (C) the outcome must result from the specific causal mechanism the agent relied upon (no deviant chains).
      *   *Refinement for Knobe Effect:* The Knobe effect suggests that *normative status* influences (B). Bad outcomes are easier to count as "consistent with motivational set" via indifference than good outcomes.
      *   *Better Principle:* **"Normatively-Weighted Plan Execution."** An agent brings about $X$ intentionally iff $X$ was foreseen, $X$ was not actively opposed (or was sought), and $X$ occurred via the plan the agent executed, *where the threshold for 'active opposition' is raised by the badness of $X$.*
      *   *Wait, let's look at the "Blame for Outcome vs. Agent" hint.*
      *   Let's try a **"Control + Endorsement"** hybrid.
      *   *Principle:* **The Principle of Non-Accidental Endorsement.**
          *   An outcome is intentional if:
              1.  **Foreseeability:** The agent foresaw it as a likely consequence.
              2.  **Volitional Consistency:** The agent's attitude toward the outcome was not one of active opposition (indifference counts as consistency for bad outcomes, but not for good ones).
              3.  **Causal Guidance:** The outcome resulted from the specific causal powers the agent engaged (ruling out deviant chains).
      *   *Why Case 1 is Intentional:* Foreseen + Indifference (counts as consistency for harm) + Causal Guidance.
      *   *Why Case 2 is Not:* Foreseen + Indifference (does *not* count as consistency for help) + Causal Guidance.
