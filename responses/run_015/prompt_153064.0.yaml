answer: |-
  You are experiencing a version of "theoretical saturation," which is common when you live inside a stimulus set for too long. Your roommate (the semanticist) is half-right: the word "intentionally" is not a transparent window into a mental state like "belief" or "desire." It is a **hybrid concept** that tracks mental states *through* a filter of normative evaluation.

  However, your intuition in Case (3) (the deviant causal chain) proves that a pure "Blame Account" is insufficient. If it were just about blame, you would call Case (3) intentional. You don't. This means your implicit principle requires **causal control**, not just normative alignment.

  Here is the principle your verdicts are paying for, stated precisely enough to operationalize in your codebook.

  ### The Principle: Normatively-Modulated Guided Acceptance

  > **An agent $A$ brings about outcome $O$ intentionally if and only if:**
  > 1.  **Foreseeability:** $A$ foresaw $O$ as a likely consequence of their action.
  > 2.  **Causal Guidance:** $O$ resulted from the specific causal mechanism $A$ relied upon in acting (ruling out deviant chains).
  > 3.  **Volitional Consistency:** $A$ did not actively oppose $O$ (i.e., $A$ accepted $O$ as part of the plan).
  > 4.  **Normative Modulation:** The threshold for satisfying Condition (3) is lowered when $O$ is normatively negative, and raised when $O$ is normatively positive.

  ---

  ### Mapping Your Verdicts to the Principle

  Here is how your seven gut verdicts map onto the clauses of this principle. This shows you where your intuitions are consistent and where they are doing heavy lifting.

  *   **Case (1) Classic Harm:** **Fits.** Foreseen (1), Guided (2), Indifference counts as Acceptance because Harm lowers the threshold (4).
  *   **Case (2) Classic Help:** **Fits.** Foreseen (1), Guided (2), Indifference *fails* to count as Acceptance because Help raises the threshold (4).
  *   **Case (3) Deviant Chain:** **Fits.** This is the critical case that saves you from the Simple Blame Account. You deny intentionality because **Causal Guidance (2)** fails. The harm occurred, and he wanted it, but his *plan* didn't guide the outcome; luck did. This explains why blame is high (he's a bad person) but intentionality is low (he didn't control the specific outcome).
  *   **Case (4) Omission:** **Fits (with friction).** Foreseen (1), Acceptance (3+4). The "dilution" (70%) comes from **Causal Guidance (2)** being weaker in omissions than commissions. You are intuitively treating "causal power" as a gradient here.
  *   **Case (5) Trade-off/Regret:** **Fits.** Foreseen (1), Guided (2). Fails **Volitional Consistency (3)**. Because she *regrets* the outcome and views it as a cost to be minimized rather than a cost to be accepted, she actively opposes it. The "badness" of the outcome (4) is not enough to override her active opposition.
  *   **Case (6) Neutral:** **Fits.** Foreseen (1), Guided (2). **Normative Modulation (4)** goes null. Without valence, the threshold for "Acceptance" reverts to a high default (requiring active desire). Indifference isn't enough. Hence the "mind goes blank."
  *   **Case (7) Committee:** **Fits (under Plural Subject Theory).** The Committee is a distinct agent $A_{group}$.
      *   *Committee:* Satisfies (1)-(4).
      *   *Yes-Voters:* Satisfy (1)-(4) relative to their contribution.
      *   *No-Voters:* Fail **Volitional Consistency (3)**.
      *   *The Tension:* Your intuition that "Committee $\neq$ Sum of Members" is correct. The principle applies to the *agent of record*. If the vignette establishes the Committee as the agent, the members' intentions are only relevant insofar as they constitute the group's will.

  ### Which Verdict to Give Up?

  If you need a clean binary variable for analysis, **you should reconsider Case (4) (Omission).**

  **Why:** Your intuition that it is "70% intentional" is theoretically honest but methodologically dangerous. Most intentionality scales force a binary or a Likert that assumes a unitary construct. By treating omission as "diluted intentionality," you are conflating *moral responsibility* (which can be equal for acts and omissions) with *causal agency* (which is often viewed as weaker in omissions).
  **Recommendation:** For the study, code Omission as a separate factor (Act vs. Omission) rather than a degree of Intentionality. If you force a binary, your principle predicts **Not Intentional** (because Causal Guidance is too weak to satisfy the default threshold without the boost of malice), but your blame intuition will pull you toward **Intentional**. This conflict creates noise. Isolate it.

  ### Predictions for Your Unsettled Cases

  Here is what the **Normatively-Modulated Guided Acceptance** principle predicts for your two edge cases.

  **(a) The Machine Learning System**
  *   **Setup:** ML optimizes profit, harm occurs, no human foresaw it.
  *   **Prediction:** **Not Intentional.**
  *   **Reasoning:**
      *   *Human Agents:* Fail **Foreseeability (1)**.
      *   *ML Agent:* Fails **Volitional Consistency (3)**. An optimizer does not "accept" outcomes in a volitional sense; it executes a function. Unless you prime participants to anthropomorphize the ML as a moral agent (giving it a "Deep Self"), the concept of intentionality won't attach.
      *   *Nuance:* If you describe the ML as "deciding" or "choosing," participants may project agency. If you describe it as "calculating," they will not. Your principle predicts intentionality attributions will track *anthropomorphization*, not just outcome.

  **(b) The Probabilistic Harm (10% Chance)**
  *   **Setup:** Chairman indifferent, 10% risk, harm happens.
  *   **Prediction:** **Not Intentional (or significantly lower than standard Knobe).**
  *   **Reasoning:** This attacks **Foreseeability (1)**. In ordinary language, "knowing" implies a high epistemic threshold (usually >90% certainty). A 10% risk is typically categorized as *recklessness*, not *knowledge*.
  *   **Test:** If you raise the probability to 90%, the Knobe effect should return. If you keep it at 10%, the "Normative Modulation" (4) cannot compensate for the failure of Foreseeability. Participants will likely say he was "reckless" or "negligent," but not that he did it "intentionally."

  ### A Note on Your Roommate (The Semanticist)

  Your roommate is pointing toward a **Pragmatics/Assertability Account**. They are right that "intentionally" is often used to license blame rather than describe a mental state. However, your Case (3) intuition proves them wrong that it is *only* about the word. If it were purely semantic/pragmatic, you would call the deviant chain case "intentional" because the blame conditions are met. The fact that you hesitate shows you are tracking a **metaphysical constraint (causal guidance)** alongside the normative one.

  **Advice for the Lab:**
  Don't try to "solve" the Knobe effect in this pilot. Instead, use these vignettes to measure **which clause participants weight most heavily.**
  *   If they call Case (3) intentional, they are running a **Blame Heuristic**.
  *   If they call Case (5) intentional, they are running a **Foresight-Only** model.
  *   If they match your intuitions, they are running **Guided Acceptance**.

  Your intuitions are theoretically sophisticated (they align with the "Deep Self" + "Causal Control" hybrid views currently dominant in the literature). Trust them, but operationalize the "Omission" and "Probability" variables carefully so they don't confound your main effect.
