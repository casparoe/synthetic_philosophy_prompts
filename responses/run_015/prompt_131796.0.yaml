answer: |-
  Elena is more right overall because her arguments accurately reflect Quine's behaviorist metaphysics and his specific claim that logical adjustments can preserve empirical adequacy across incompatible ontologies, whereas Marcus imports realist assumptions Quine explicitly rejects.

  **Elena Move 1:** **Clearly Right.** This accurately summarizes the core thesis of the indeterminacy of translation: behavioral dispositions underdetermine semantic assignment, and for Quine, there is no fact of the matter beyond behavior.

  **Marcus Move 1:** **Mostly Mistaken.** While a coherent realist objection, it misinterprets Quine; Quine argues for metaphysical indeterminacy (no fact exists), not merely epistemic underdetermination (a fact exists but is unknowable).

  **Elena Move 2:** **Clearly Right.** She correctly identifies Quine's rejection of intensional entities (the "museum myth") as the philosophical groundwork for denying hidden semantic facts.

  **Marcus Move 2:** **Partially Mistaken.** He suggests practical reasoning fixes reference, but Quine argues practical behavior is part of the observable data already deemed insufficient to distinguish between ontologies like "rabbit" and "rabbit part."

  **Elena Move 3:** **Clearly Right.** This is a precise articulation of Quine's "inscrutability of reference": one can compensate for ontological shifts (e.g., parts vs. wholes) by adjusting the logic of identity and quantification in the translation manual.

  **Marcus Move 3:** **Partially Right/Partially Mistaken.** He is right that global conventionalism risks collapsing the distinction between error and difference, but mistaken that Quine allows determinacy within the home language; Quine argues reference is inscrutable at home too (ontological relativity), though we treat it as determinate for practical purposes.

  **What Both Are Missing:** Both conflate the *indeterminacy of translation* (which applies to whole sentences/theories in radical translation) with the *inscrutability of reference* (which applies to terms and holds even at home); additionally, neither emphasizes Quine's naturalism, which accepts physical facts while denying semantic facts, distinguishing his view from pure conventionalism.
