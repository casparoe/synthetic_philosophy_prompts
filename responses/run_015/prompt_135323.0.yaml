  The Ise Shrine presupposes that identity resides in immutable ritual form and knowledge transmission rather than physical material, aligning closely with legal corporate personhood but clashing with Western material authenticity.

  This practice relies on a theory of "Pattern Identity" or ritual continuity. The shrine is not a static object but a recurring event; the *kami* inhabits the consecrated space and rite, not the cypress beams. Material is disposable because decay signifies pollution, while rebuilding signifies purification and knowledge transfer. This isn't strictly functionalist, as the function is spiritual continuity, not utility.

  Does this require one metaphysics? No. It is compatible with multiple frameworks: Shinto purity cycles, Buddhist impermanence (*mujō*), and secular legal fiction. It functions as a cultural technology regardless of underlying ontology.

  This aligns perfectly with corporate identity. A corporation remains the same legal entity after every shareholder and asset turns over because its charter persists. Similarly, Ise remains Ise because its ritual blueprint persists. Both prioritize institutional continuity over material constancy.

  If heritage conservation law adopted this view globally, the Venice Charter's emphasis on material authenticity would collapse. Laws would need to shift from protecting "fabric" to protecting "practice." Demolition would not constitute destruction provided the reconstruction adheres to traditional techniques and designs. Legal protection would cover intangible heritage—craftsmanship, oral traditions, and rites—rather than just physical structures. A building could be razed and rebuilt without losing heritage status, provided the knowledge chain remained unbroken. Conservation would measure success by the vitality of the craft, not the age of the wood. Funding would shift from structural stabilization to training apprentices. Essentially, heritage would become a verb, not a noun.
