  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* Radford's Paradox relies on the idea that we need to believe $X$ exists to feel emotion about $X$.
      *   *Premise 2:* Procedural/Generative fiction lacks a stable $X$ (ontology is fluid), yet we feel emotion.
      *   *Conclusion:* Therefore, emotion tracks *coherence/narrative integration*, not *ontological belief*.
      *   *Implication:* The paradox dissolves because the "belief condition" is the wrong metric for this class of art.

