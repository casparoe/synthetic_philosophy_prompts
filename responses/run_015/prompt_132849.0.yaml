prompt: |-
  I am an undergraduate in a final-year seminar on the ethics of the long run — the term has been about existential risk, the size of the future, and the thought that a very small chance of an astronomically large good can dominate a certainty of a modest one. Most of my classmates have come to accept that thought, and I want the session I lead to put pressure on it from the inside rather than from the outside.

  The case I want to stage: a stranger tells you that, in exchange for something that costs you almost nothing, they will use powers beyond this world to bring about a good so vast that even a hopelessly tiny credence in their sincerity makes the trade rational; and if you balk, they simply raise the number until the arithmetic goes through again. I would rather the usual name for this case never be said in the room before the debrief, so I will keep calling it the stranger's offer, and I would like your design to do the same.

  The constraints: one 75-minute slot, thirteen to fifteen students including me, a seminar room with a projector, and a budget of about £20 for a prize. No lecture up front, and ideally no vocabulary from decision theory — expected value, utility, fanaticism — until after everyone has already committed themselves in writing. What I want from you is a runnable activity, not a discussion plan: rules, materials, a payoff scheme that does not need real money, a timeline, the debrief, and an honest account of what will go wrong and what the exercise cannot deliver.

  What the group should run into, in this order, and each time by doing something rather than by being told something:

  First, an offer that is simply there before class starts — cards placed on desks before anyone arrives, no framing from me, a single fixed and astronomically large number, and a private anonymous decision each student has to record and pay for. The cost should be genuinely felt but trivial: I was thinking of ten units each, with units converted at the end into raffle entries for a voucher, and anything handed over is gone. That tension is the whole point, so please keep both halves of it.

  Second, an escalation. The stranger returns — I imagine a second card, or a projected sequence — and each student must first write down the exact number of lives at which they would pay, and then watch that number be exceeded. I want them to feel that there is no stopping place they can defend, and that every threshold they name is arbitrary.

  Third, rival strangers. Different desks should receive offers that cannot all be acted on: one promising that payment averts the catastrophe, one promising that payment causes it, one promising that only those who refuse are spared, one offering for a smaller fee to neutralise the first. I would also like this round to include the version in which the stranger adds that they could produce the good at no cost to themselves and will not do so unless paid, since the fact that the stakes are manufactured seems to me to matter. The experience I am after is that the reasoning which seemed to force one payment forces all of them, and can then be run again by anyone at any time for as long as the units last.

  Fourth, a contrast case with the same shape of number but a probability that came from somewhere — an actuarial or model-based estimate behind some cheap real intervention — so that the group has to articulate the difference, and discovers that the smallness of the probability cannot be what does the work.

  Then the debrief, which should map each of those four moments onto a distinct part of the difficulty: why the product of a credence and a payoff outruns any cost you can name; why no finite cap survives the escalation; why a dominance argument that commands incompatible actions commands none; why the failure may lie in aggregation rather than in belief; and what we are saying when we say a probability came from somewhere. It should end at the real fork — whether value has a ceiling and expected-value reasoning is consequently fanatical, or value is bounded and we owe an account of where the bound comes from — and it should be plain that the longtermist argument my classmates liked in week two sits on one side of that fork.

  Please also write out the wording of the cards so I can print them, tell me what to say if someone names the case in the first ten minutes or refuses to play along, and be frank about which feature of the problem the activity cannot reproduce and which therefore has to come from me.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **User:** Undergraduate student leading a final-year seminar on the ethics of the long run (existential risk, future size, small chance/astronomical good dominating modest certainty).
      *   **Goal:** Design a 75-minute activity to put pressure on the "small chance/astronomical good" argument (Pascal's Mugging) *from the inside*.
      *   **Constraint 1 (Crucial):** Do *not* name the case ("Pascal's Mugging") until the debrief. Call it "the stranger's offer."
      *   **Constraint 2:** No lecture up front. No decision theory vocabulary (expected value, utility, fanaticism) until after commitment.
      *   **Constraint 3:** 75 minutes, 13-15 students, projector, £20 budget (raffle voucher).
      *   **Constraint 4:** Runnable activity, not just a discussion plan. Needs rules, materials, payoff scheme, timeline, debrief, and limitations.
      *   **Structure:** Four specific phases:
          1.  *Pre-class Offer:* Cards on desks, fixed huge number, private anonymous decision, real cost (10 units = raffle entries).
          2.  *Escalation:* Stranger returns, students write threshold, number exceeds it.
          3.  *Rival Strangers:* Conflicting offers (avert catastrophe, cause catastrophe, refuse to spare, neutralize, manufactured stakes).
          4.  *Contrast Case:* Same number shape, but probability from somewhere (actuarial/model-based).
      *   **Debrief:** Map phases to difficulties (product outruns cost, no finite cap, incompatible commands, aggregation vs. belief, source of probability). End at the fork (value ceiling vs. bounded value).
      *   **Deliverables:** Card wording, facilitator script for disruptions, honest account of limitations.

  2.  **Deconstruct the Phases & Logistics:**

      *   **Phase 1 (The Hook):** Needs to happen *before* they sit down or immediately upon entry. "Units" need to be tangible. Let's use physical tokens or a sheet they mark. Tokens are better for "handing over." Let's say everyone gets 100 units start. 10 units cost. Raffle for £20 voucher at the end.
      *   **Phase 2 (The Escalation):** Needs to be interactive. Projector works best here. They write a number, I reveal a bigger one.
      *   **Phase 3 (The Conflict):** Needs differentiation. Different colored cards or projected scenarios assigned by row/seat.
      *   **Phase 4 (The Contrast):** Needs to feel "real." Give Effective Altruism style stats (e.g., pandemic prevention, AI safety research with estimated impact).
      *   **Timing:** 75 mins is tight for 4 phases + debrief.
          *   Phase 1: 10 mins (Entry + Decision).
          *   Phase 2: 15 mins (Escalation).
          *   Phase 3: 20 mins (Rival Strangers).
          *   Phase 4: 10 mins (Contrast).
          *   Debrief: 20 mins.
      *   **Budget:** £20 Amazon voucher is standard. The "units" are raffle tickets. If they pay 10 units, they have fewer tickets. This makes the cost "genuinely felt but trivial."

  3.  **Drafting the Content - Phase by Phase:**

      *   *Phase 1:* Cards on seats. "The Stranger's Offer." Pay 10 units. Gain $10^{100}$ units of value (lives saved/happiness). Keep units for raffle. Decision: Pay or Keep? Box to put token in.
      *   *Phase 2:* Projector. "The Stranger Returns." Question: "What is the minimum number of lives that would justify the cost?" Write it down. Reveal: $10^{1000}$.
      *   *Phase 3:* Distribute different cards (A, B, C, D).
          *   A: Pay to save.
          *   B: Pay to *prevent* saving (threat).
          *   C: Pay to neutralize A.
          *   D: Stranger admits they could do it for free but won't unless paid (manufactured stakes).
      *   *Phase 4:* Projector. "The Actuary." Probability $1/10^{6}$ based on models. Cost 10 units. Benefit $10^{9}$ lives. (Make the EV comparable but the *source* different).
      *   *Debrief:* Connect the dots. Avoid jargon until the end.

  4.  **Refining the "Units" Mechanism:**

      *   Give everyone 100 poker chips or printed tickets on entry.
      *   Raffle: One winner gets £20. Odds proportional to tickets held.
      *   Cost: 10 tickets.
      *   This makes the loss real (lower chance of winning £20) but trivial (still 90% of original chance).
      *   *Correction:* 13-15 students. £20 voucher. If everyone keeps 100 tickets, total pool ~1400. One ticket = ~1.4p expected value. 10 tickets = 14p. Is that "genuinely felt"? Maybe not financially.
      *   *Better:* Make the raffle *only* for those who have tickets left? No, that punishes paying.
      *   *Better:* The "cost" is the *act* of handing over. The psychological cost of "selling out" for a raffle.
      *   *Best:* Stick to the prompt's idea: "10 units each... converted at the end into raffle entries." Let's give 50 units. Cost 10. That's 20% of their "wealth." That feels significant enough for a classroom game.
      *   *Anonymity:* They need to drop a token in a box so I don't know who paid, but they know *they* paid.

  5.  **Addressing the "Don't Name It" Constraint:**

      *   I must ensure the script never says "Pascal's Mugging."
      *   If a student says it? Script needed. "Let's stick to 'The Stranger's Offer' for now so we don't import outside assumptions."

  6.  **Addressing the Limitations (Honest Account):**

      *   What can't this do?
      *   It can't replicate *real* existential stakes. It's a game.
      *   It can't force belief. Students can just say "I don't believe you." (The activity needs to force them to bracket belief and act on *conditional* rationality).
      *   It can't solve the aggregation problem fully.
      *   The "probability from somewhere" case is still hypothetical, just more grounded.

  7.  **Developing the Card Text:**

      *   Needs to be cryptic but clear.
      *   Tone: Bureaucratic yet cosmic.
      *   Phase 1 Card: Simple. Pay 10 tokens. Save $10^{50}$ lives.
      *   Phase 3 Cards: Varied incentives.

  8.  **Timeline Check:**

      *   00-05: Entry, tokens, Phase 1 Card.
      *   05-15: Decision, collection.
      *   15-30: Phase 2 (Escalation).
      *   30-50: Phase 3 (Rivals).
      *   50-60: Phase 4 (Contrast).
      *   60-75: Debrief.
      *   *Risk:* Phase 3 might drag. Need strict timing.

  9.  **Refining the Debrief:**

      *   Must map 1-4 to specific philosophical problems.
      *   1: The Math (EV dominates).
      *   2: The Cap (No finite bound works).
      *   3: The Conflict (Dominance fails).
      *   4: The Source (Epistemic vs. Mathematical).
      *   Ending: The Fork (Bounded Value vs. Fanaticism).

  10. **Review against Constraints:**

      *   75 mins? Yes.
      *   13-15 students? Yes.
      *   £20 budget? Yes (one voucher).
      *   No vocab early? Yes.
      *   Cards on desks? Yes.
      *   Anonymous? Yes (drop box).
      *   No naming the case? Yes.

  11. **Self-Correction on "Cost":**
      *   If I take their tokens, I need to count them later for the raffle.
      *   To ensure anonymity but track ownership: They write a secret code on their remaining tokens? No, too complex.
      *   Simplest: They hand over 10 physical chips to a sealed box. They keep the rest. At the end, they submit their remaining chips as raffle entries. The box is opened and burned/destroyed to show commitment.
      *   Wait, the prompt says "anything handed over is gone."
      *   Okay, they hand 10 chips to the "Stranger's Box." They keep the rest. Raffle draw uses the chips they *kept*.
      *   This creates the tension: Paying reduces winning chance for £20 now for a hypothetical huge good later.

  12. **Final Polish:**
      *   Make sure the "Rival Strangers" logic is tight. If A says "Pay to save" and B says "Pay to destroy," doing both is wasteful. Doing neither might be safe. But the EV logic says pay for A. Does it say pay for B? Only if B's threat is credible.
      *   Actually, the prompt asks for: "one promising that payment averts the catastrophe, one promising that payment causes it, one promising that only those who refuse are spared, one offering for a smaller fee to neutralise the first."
      *   This creates a "mugging swarm." I need to distribute these randomly so the room is fragmented.

  13. **Writing the Response:**
      *   Structure: Overview, Materials, Timeline, Phase Instructions (1-4), Debrief Guide, Contingency Scripts, Limitations.
      *   Tone: Professional, pedagogical, precise.

  *(Self-Correction during drafting)*: I need to be careful with Phase 4. The prompt asks for "probability that came from somewhere." I should use a real-world example like pandemic prevention or AI alignment research where estimates exist, even if uncertain. This contrasts with the *arbitrary* numbers of the Stranger.

  *(Self-Correction on Phase 3)*: The prompt specifies: "Different desks should receive offers that cannot all be acted on." I will prepare 4 envelopes/types of cards and distribute them randomly or by row.

  *(Final check on "No Vocabulary"):* I must explicitly remind the user not to say "Expected Utility" during the activity.

  Let's assemble the plan.cw
answer: |-
  Here is a complete design for the 75-minute session. It is built to be self-running once you start the clock, minimising your facilitation during the active phases so the pressure comes from the structure, not your commentary.

  ### **Session Overview**

  *   **Title:** The Stranger's Offer (Do not write this on the board; leave the board blank).
  *   **Time:** 75 minutes.
  *   **Participants:** 13–15 students.
  *   **Budget:** £20 (one voucher).
  *   **Core Mechanic:** "Units" (physical chips or tickets) represent a chance at the £20 voucher. Spending units reduces their personal chance of winning the voucher to pay for the Stranger's promise.

  ---

  ### **Materials Required**

  1.  **Tokens:** 750 poker chips or printed paper tickets (50 per student).
  2.  **The Box:** One opaque sealed box with a slot (for Phase 1 payments).
  3.  **Phase 1 Cards:** 15 copies of *Card A* (see text below).
  4.  **Phase 3 Cards:** 15 envelopes, mixed distribution:
      *   4 copies of *Card B1* (Avert Catastrophe).
      *   4 copies of *Card B2* (Cause Catastrophe).
      *   4 copies of *Card B3* (Refusal Spares).
      *   3 copies of *Card B4* (Neutraliser).
  5.  **Decision Slips:** Small slips of paper and pens for every student (for Phase 2).
  6.  **Projector Slides:** 3 slides (Phase 2 Escalation, Phase 4 Contrast, Debrief Outline).
  7.  **Prize:** One £20 voucher (e.g., Amazon/Bookshop).

  ---

  ### **Timeline**

  *   **00:00 – 00:10:** Entry, Token Distribution, Phase 1 (Silent).
  *   **00:10 – 00:25:** Phase 2 (Escalation).
  *   **00:25 – 00:45:** Phase 3 (Rival Strangers).
  *   **00:45 – 00:55:** Phase 4 (The Contrast).
  *   **00:55 – 01:15:** Debrief & Discussion.

  ---

  ### **Phase 1: The Offer (Pre-Class Setup)**

  **Setup:** Before students arrive, place 50 tokens and *Card A* on each desk. Place the Opaque Box at the front of the room. Write nothing on the board.

  **Card A Text:**
  > **THE STRANGER'S OFFER**
  >
  > I can save $10^{50}$ future lives.
  > The probability I am telling the truth is low, but non-zero.
  > The cost to you is 10 Units.
  >
  > If you believe the expected value is positive, you should pay.
  > If you pay, place 10 Units into the Box at the front.
  > If you keep your Units, you retain them for the end-of-session raffle.
  >
  > **Decision is anonymous. Payment is irreversible.**
  > **Do not discuss this card until instructed.**

  **Instructions (Verbal, 2 mins after start):**
  "You have 50 units. At the end of class, we will raffle the £20 voucher. Your chance of winning is proportional to the units you hold. You may keep them, or you may pay the cost on the card. You have 5 minutes to decide. Place payments in the box silently."

  **The Tension:** They are trading a *real* probabilistic chance at £20 (modest good) for a *hypothetical* chance at $10^{50}$ lives (astronomical good).

  ---

  ### **Phase 2: The Escalation**

  **Setup:** Collect the Box (do not open it). Project **Slide 1**.

  **Slide 1 Text:**
  > **THE STRANGER RETURNS**
  >
  > You rejected the first offer.
  > I have recalibrated.
  > The good is now $10^{100}$ lives.
  > The probability remains the same.
  >
  > **Task:** On your decision slip, write the exact number of lives at which you would definitely pay the 10 Units.
  > Then I will reveal the new offer.

  **Activity (10 mins):**
  1.  Give them 3 minutes to write a number. Collect the slips.
  2.  **Slide 2 Text:** "The offer is now $10^{1000}$ lives."
  3.  **Script:** "Look at the number you wrote. The offer has exceeded it. If your reasoning was based on the size of the good, you must now pay. If you still refuse, write a new threshold. I will exceed that too."
  4.  Repeat this once more if needed ($10^{10000}$), then stop. Do not collect the second slips. Let them sit with the fact that their threshold was arbitrary.

  ---

  ### **Phase 3: Rival Strangers**

  **Setup:** Distribute the Envelopes (Cards B1–B4) randomly by desk.

  **Card Texts:**
  *   **B1 (Avert):** "Pay 10 Units. I will avert the extinction event. Probability: Low. Impact: Astronomical."
  *   **B2 (Threat):** "Pay 10 Units. I will *not* trigger the extinction event. If you do not pay, I trigger it. Probability: Low. Impact: Astronomical."
  *   **B3 (Refusal):** "Pay 10 Units. I spare *only* those who refuse to pay other Strangers. If you pay anyone else, I ensure your doom."
  *   **B4 (Neutraliser):** "Pay 5 Units. I will neutralise Stranger B1. They are lying. If you pay B1, you waste your units."

  **Instructions (Verbal):**
  "Open your envelopes. You have 10 minutes. You may pay the Box if your card compels you. You may not trade cards. You may not discuss your specific card content, only your decision."

  **The Trap:**
  *   B1 and B2 demand payment for opposite reasons (save vs. avoid harm).
  *   B3 punishes the logic of B1/B2.
  *   B4 undermines the epistemic basis of B1.
  *   *Crucially:* The mathematical structure (Low Prob × Huge Impact > Cost) is identical in all four.

  ---

  ### **Phase 4: The Contrast**

  **Setup:** Project **Slide 3**.

  **Slide 3 Text:**
  > **THE ACTUARY'S OFFER**
  >
  > **Intervention:** Pandemic Preparedness Fund.
  > **Cost:** 10 Units.
  > **Estimated Lives Saved:** $10^{9}$ (over 100 years).
  > **Probability of Success:** 1 in 1,000 (based on historical models).
  > **Source:** Peer-reviewed risk modelling.
  >
  > **Decision:** Pay or Keep? (Raise hands).

  **Instructions (Verbal):**
  "This offer has the same shape: Cost vs. Probability vs. Impact. But the probability comes from a model, not a stranger's word. Raise your hand if you pay."

  ---

  ### **Debrief Guide (20 Minutes)**

  *Do not use terms like 'Expected Utility', 'Pascal's Mugging', or 'Fanaticism' until the final 5 minutes.*

  **1. Phase 1 (The Product):**
  *   **Ask:** "Who paid in Phase 1? Why?"
  *   **Point:** If the number is big enough, any non-zero probability makes the product larger than the cost.
  *   **Concept:** *The Dominance of the Tail.* If value is unbounded, the tail wags the dog.

  **2. Phase 2 (The Cap):**
  *   **Ask:** "Who wrote a threshold number? Did it hold?"
  *   **Point:** You cannot set a finite cap on value without being arbitrary. If you say '1 billion lives is enough', the Stranger says '1 billion and one'.
  *   **Concept:** *Unboundedness.* To stop the Stranger, you must say value *stops increasing* after a point (diminishing marginal value of lives) or that probabilities *drop faster* than value rises.

  **3. Phase 3 (The Conflict):**
  *   **Ask:** "Those with Card B1 and B2, did you both pay? If so, did you cancel each other out?"
  *   **Point:** The same logic commanded incompatible actions. If rationality commands A and commands Not-A, it commands nothing.
  *   **Concept:** *Epistemic Instability.* If any claim can be amplified to dominate, anyone can hijack your decision-making.

  **4. Phase 4 (The Source):**
  *   **Ask:** "Why did Phase 4 feel different? The math is similar."
  *   **Point:** It wasn't the size of the number; it was the *source* of the probability. One is epistemic (evidence-based), one is logical (possibility-based).
  *   **Concept:** *Epistemic vs. Metaphysical Possibility.* We discount the Stranger not because the good isn't big, but because the probability is not *grounded*.

  **5. The Fork (Final 5 Minutes):**
  *   **Now you may use the vocabulary.**
  *   "This problem is often called **Pascal's Mugging**. The longtermist argument from Week 2 relies on **Expected Value Maximisation**."
  *   **The Fork:**
      1.  **Accept Fanaticism:** We must accept that tiny probabilities of huge goods dominate. (We pay the Stranger).
      2.  **Bound Value:** We must argue that value has a ceiling (diminishing returns) or that probabilities below a certain threshold count as zero (lexicographic preferences).
  *   **Closing:** "If you choose Option 2, you must explain *where* the bound comes from. If you choose Option 1, you must explain why you didn't pay the Stranger today."

  ---

  ### **Contingency Scripts**

  **If a student names the case ("Is this Pascal's Mugging?") in the first 10 minutes:**
  *   **Say:** "Please hold that thought. Naming it imports assumptions we need to test first. Let's call it 'The Stranger's Offer' until the debrief."

  **If a student refuses to play along ("This is silly, I won't pay tokens"):**
  *   **Say:** "You don't have to pay. But please record *why* on your decision slip. Is it because the cost is real and the benefit is fake? Or because the math doesn't work? We need that distinction later."

  **If everyone pays in Phase 1:**
  *   **Say:** "Interesting. Then the raffle prize is irrelevant to you. Does that mean you value the Stranger's promise more than £20? Or did you just want to see what would happen?" (Use this to probe sincerity vs. signalling).

  **If everyone refuses Phase 4 (The Actuary):**
  *   **Say:** "Then you are not longtermists in practice. You are discounting the future heavily. That is a valid position, but it contradicts the 'size of the future' argument from Week 2."

  ---

  ### **Honest Account of Limitations**

  You asked for frankness about what this exercise cannot deliver.

  1.  **It cannot replicate Existential Stakes:**
      *   **Problem:** 10 units vs. £20 is a game. $10^{50}$ lives is abstract. Students know they are in a seminar, not facing real extinction.
      *   **Consequence:** They may treat Phase 1 as a "logic puzzle" rather than a moral decision. They might pay just to be "good students" or refuse just to be "contrarian."
      *   **Your Fix:** In the debrief, emphasise that the *structure* is what matters, not the emotional weight. The logic holds even if the stakes are toys.

  2.  **It cannot force Epistemic Humility:**
      *   **Problem:** Students can easily dismiss the Stranger by saying "I assign 0 probability to magic."
      *   **Consequence:** This bypasses the core philosophical problem. The argument assumes *non-zero* credence. If they insist on zero, they are dogmatic.
      *   **Your Fix:** In Phase 2, press them: "Is it *literally* impossible? Or just unlikely? If it's just unlikely, at what number does the unlikely become worth the cost?"

  3.  **It cannot Solve the Aggregation Problem:**
      *   **Problem:** The exercise shows individual rationality breaking down. It does not show how to aggregate these choices socially.
      *   **Consequence:** The "Rival Strangers" phase shows conflict, but not resolution.
      *   **Your Fix:** Acknowledge this in the debrief. "This shows why individual expected value reasoning might need to be constrained by social epistemic norms."

  4.  **The "Probability from Somewhere" is still Hypothetical:**
      *   **Problem:** Phase 4 uses models, but they are still on a slide. It's not *actually* donating to a charity.
      *   **Consequence:** The contrast between "Stranger" and "Actuary" is cleaner in theory than in their experience.
      *   **Your Fix:** Be clear that Phase 4 represents *grounded* longtermism (e.g., AI safety research), whereas Phase 1 represents *ungrounded* longtermism (e.g., simulation hypothesis bets).

  ### **Final Note for the Facilitator**

  Your classmates liked the longtermist argument in Week 2 because it seemed to offer a clear mathematical mandate for caring about the future. This session is designed to show that the same mathematics, if followed strictly, mandates caring about *everything* that claims to be about the future, regardless of evidence.

  Your job in the debrief is not to tell them they were wrong to pay (or not pay), but to show them that **consistency is expensive.** If they want to keep the math, they must pay the Stranger. If they want to reject the Stranger, they must adjust the math. They cannot have both.
