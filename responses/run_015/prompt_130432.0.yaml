answer: |-
  Here is an adjudication of the six moves, an overall verdict, an assessment of your suspicion, and a proposal for a principled distinction.

  ### Part 1: Move-by-Move Adjudication

  **(1) Nadia: Level-Shifting**
  *   **Verdict:** Partly Right.
  *   **Why:** Nadia correctly identifies that the *locus of truth* can shift from the micro-level (psychology) to the macro-level (population dynamics). This is a coherent philosophical move. However, she is wrong to claim the *model itself* becomes explanatory simply by appealing to an external mechanism. If the mathematical structure of the model contains only maximization constraints and no selection dynamics (birth/death/evolution rates), then the model does not represent the mechanism she cites. The *argument for the model* is explanatory, but the *model* remains a black box. She conflates the justification of the assumption with the content of the model.

  **(2) Teo: Bait-and-Switch / Spurious Bridge**
  *   **Verdict:** Right.
  *   **Why:** Teo correctly identifies a structural gap. If the justification for the assumption is dynamic (selection over time) but the model is static (equilibrium maximization), there is a mismatch. Using the success of the static model to confirm the dynamic story is indeed circular unless the dynamic story is tested independently. He correctly notes that predictive success alone cannot distinguish between "firms maximize" and "firms survive by luck but look like they maximize." The model captures the *outcome* attributed to selection without capturing the *process* of selection.

  **(3) Nadia: Independent Checkability**
  *   **Verdict:** Partly Right.
  *   **Why:** She is right that we cannot demand a model contain every causal detail; auxiliary hypotheses (like "selection is occurring") can be tested separately. This is standard scientific practice. However, she is overly optimistic about the "in principle" checkability. As Teo will point out, the available data (survival rates) is often consistent with multiple causal stories (selection vs. luck vs. inertia). Inference to the best explanation works only if the competing explanations are distinguishable by the data, which is often not the case in market data.

  **(4) Teo: Asymmetry & Underdetermination**
  *   **Verdict:** Right.
  *   **Why:** This is Teo's strongest move. First, the asymmetry point is damning: economists often treat the maximization assumption as sacred because of the selection story, while treating other false assumptions (like linearity) as mere approximations, despite both lacking direct evidence. Second, the underdetermination point is logically sound. Natural selection eliminates the *very unfit*; it does not guarantee the *optimal*. A firm can survive with sub-optimal profits if competitors are also inefficient. Therefore, the evidence (survival) supports a weak claim ("not bankrupt"), but the model assumes a strong claim ("maximum profit"). The evidence does not support the strength of the assumption.

  **(5) Nadia: Disjunction Shorthand**
  *   **Verdict:** Partly Right.
  *   **Why:** Nadia is correct that a false assumption can serve as a compact summary of many possible true underlying behaviors (a "phenomenological" approach). If the goal is purely prediction within a stable environment, and if the aggregate outcome is indeed insensitive to the specific behavioral rule, then the false premise is a useful tool. However, she is wrong to claim "nothing is lost." Something is always lost when you replace a causal structure with a functional shorthand: you lose the ability to know *why* the shorthand works, which becomes critical if the environment changes.

  **(6) Teo: Compactness vs. Explanation (Intervention)**
  *   **Verdict:** Right.
  *   **Why:** Teo identifies the fatal flaw in Nadia's "disjunction shorthand." If the model is indifferent to *which* behavioral rule is in place (so long as it survives), the model cannot predict what happens when the rules of survival change. If a subsidy changes which behaviors are profitable, the "as if" maximizer might stop behaving like a maximizer. A model that does not represent the mechanism cannot predict the effects of interventions that alter the mechanism. Nadia wants the predictive power of the strong assumption without the structural commitment; Teo shows that structural commitment is the price of admission for policy analysis.

  ### Part 2: Overall Verdict

  **Teo is more right overall.**

  While Nadia successfully defends the *utility* of the model for narrow prediction, Teo successfully attacks its *validity* for explanation and policy. In the context of social science, where the goal is often to understand how systems respond to changes (regulations, shocks, institutional shifts), a model that cannot handle interventions is severely limited.

  Nadia wins on **instrumental adequacy** (does it predict prices in this market today?). Teo wins on **structural validity** (does it tell us what happens if we change the tax code?). Since seminar discussions on methodology usually concern the scientific status of the discipline (which implies explanation and policy relevance), Teo's critique cuts deeper. Nadia's defense relies on the stability of the environment remaining fixed; Teo shows that this stability is exactly what cannot be assumed in social science.

  ### Part 3: What Both Are Missing (Your Suspicion)

  Your suspicion is **not a red herring; it is the hinge of the entire debate.**

  Both Nadia and Teo are sliding between two distinct projects:
  1.  **Prediction within a fixed regime:** Forecasting outcomes given that the rules of the game (selection pressures, institutions) remain constant.
  2.  **Structural analysis of regime change:** Predicting outcomes when the rules of the game themselves change (interventions, policy shifts).

  **Where they slide:**
  *   **Nadia** treats the model as successful because it works for Project 1, but she implicitly claims it satisfies the requirements of Project 2 (by calling it "explanatory"). She assumes that because the selection mechanism is "real," the model inherits that stability. She misses that the *model* does not contain the selection mechanism, so it cannot track changes to it.
  *   **Teo** correctly identifies that the model fails at Project 2, but he risks understating the value of Project 1. He implies that because the model fails at intervention analysis, its predictive success is "spurious." It isn't spurious; it's just local.

  **The Real Hinge:**
  The debate turns on **invariance**. A model assumption is a "legitimate stand-in" only if the relationship it describes remains invariant under the interventions we care about.
  *   If you only care about predicting prices next Tuesday, Nadia is right: the selection story justifies using the maximization assumption as a shorthand.
  *   If you care about predicting prices after a new antitrust law, Teo is right: the selection story justifies *nothing* unless the model explicitly represents how the law changes the selection pressure.

  Friedman's essay is famous because it conflates these two projects. He argues that because the model predicts well (Project 1), we should trust its assumptions for all purposes (including Project 2). Teo exposes this conflation; Nadia tries to bridge it but cannot without adding structural detail to the model.

  ### Part 4: A Principled Way to Distinguish Assumptions

  You asked for a principled way to tell a **legitimate stand-in assumption** from a **merely convenient one**.

  The distinction lies in **Counterfactual Stability under Intervention.**

  **The Test:**
  To determine if a false assumption (like "firms maximize") is a legitimate stand-in for a deeper mechanism (like "selection"), you must ask: *Does the assumption remain valid if I intervene on the mechanism it stands in for?*

  1.  **Merely Convenient Assumption:** The assumption yields correct predictions only so long as the background environment remains unchanged. If you alter the environment (e.g., remove competitive pressure), the assumption breaks down immediately, and the model offers no guidance on *how* it breaks.
      *   *Example:* Assuming firms maximize profit. If you introduce a subsidy that rewards *revenue* instead of profit, a "maximization" model predicts firms will still maximize profit. A "selection" model might predict firms will shift behavior to maximize revenue to survive the new regime. If the model cannot capture this shift, the assumption was merely convenient.

  2.  **Legitimate Stand-In:** The assumption is a robust approximation of a deeper causal capacity that remains stable across a defined range of interventions. Even if the assumption is literally false, the *error term* remains stable and predictable when the system is perturbed.
      *   *Example:* Assuming a gas is ideal. This is false (molecules have volume). But if you change the pressure within a certain range, the deviation from the ideal law is predictable and stable. The assumption stands in for the deeper molecular dynamics successfully within that range.

  **Application to the Seminar Case:**
  To adjudicate Nadia and Teo using this principle:
  *   Ask: "If we introduce a regulation that protects inefficient firms from bankruptcy, does the model predict the resulting market behavior correctly?"
  *   If the model says "Firms will still maximize profit" (because that's the constraint), but the reality is "Firms will become slack because selection is turned off," then the maximization assumption was a **merely convenient fiction**, not a legitimate stand-in for selection.
  *   Nadia's "selection story" only validates the assumption if the selection pressure is constant. Teo is right that once you acknowledge the selection story, you must acknowledge that changing the selection pressure changes the validity of the assumption.

  **Conclusion:**
  A stand-in assumption is legitimate only if the modeler can specify the **boundary conditions** under which the stand-in fails. Nadia treats the assumption as universally valid because the mechanism is real. Teo treats it as suspect because the model doesn't track the mechanism. The truth is in the middle: The assumption is legitimate *only within the domain where the selection mechanism is invariant*. Recognizing that domain limit is the methodological duty of the modeler.
