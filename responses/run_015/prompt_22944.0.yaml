  You have put your finger on exactly the right knot. The tension you are feeling isn't a misunderstanding on your part; it is a genuine feature of the theory. When we move from *strict* dominance to *weak* dominance, we step out of the realm of "logical necessity" and into the realm of "cautionary assumptions."

  Your suspicion is correct: there is a crucial, often unstated choice in how we define the elimination procedure. Specifically, **allowing mixed strategies to do the dominating makes the elimination procedure more aggressive.**

  Here is the conceptual breakdown, the intuition for why mixing matters, and how this connects to the pathologies of order dependence and Nash equilibrium elimination.

  ### 1. Pure vs. Mixed Weak Dominance: The Diversification Intuition

  To see the difference, we must first agree on what "weak dominance" means. Strategy $A$ weakly dominates Strategy $B$ if $A$ never does worse than $B$, and sometimes does strictly better.

  **The Pure Case:**
  If we only allow *pure* strategies to do the dominating, we are asking: "Is there a single specific action I could take that is safer and potentially more profitable than this one?" If the answer is no, the strategy survives.

  **The Mixed Case:**
  If we allow *mixed* strategies to do the dominating, we are asking: "Is there a **portfolio** of actions I could randomize between that is safer and potentially more profitable than this one?"

  **Can a mix dominate when no pure strategy does?**
  Yes. This is the heart of your knot.

  **The Intuition:**
  Think of strategies as investment assets.
  *   Strategy $T$ is like a Tech Stock: It pays off huge in Market Condition 1, but crashes in Condition 2.
  *   Strategy $M$ is like a Utility Bond: It crashes in Market Condition 1, but pays off huge in Condition 2.
  *   Strategy $B$ is like Cash: It pays a modest, steady return in both conditions.

  Individually, neither the Stock ($T$) nor the Bond ($M$) dominates Cash ($B$). The Stock is riskier than Cash in Condition 2; the Bond is riskier than Cash in Condition 1.

  However, if you hold a **50/50 portfolio** of the Stock and the Bond, you smooth out the volatility. Your average return might now be strictly higher than Cash in all conditions, or at least never lower and sometimes higher. The mix creates a "safety net" that neither individual strand possesses.

  **The Example (Exhibit A)**
  Let's anchor this with a 3x3 game (Player 1 has 3 rows, Player 2 has 3 columns). We will look only at Player 1's payoffs to demonstrate the dominance relation.

  | P1 \ P2 | Left ($L$) | Center ($C$) | Right ($R$) |
  | :--- | :---: | :---: | :---: |
  | **Top ($T$)** | 2 | 0 | 1 |
  | **Middle ($M$)** | 0 | 2 | 1 |
  | **Bottom ($B$)** | 1 | 1 | 0 |

  *   **Check Pure Dominance:**
      *   Does $T$ dominate $B$? No. If P2 plays $R$, $T$ gets 1 but $B$ gets 0 (Good for $T$). But if P2 plays $C$, $T$ gets 0 and $B$ gets 1 ($B$ is better).
      *   Does $M$ dominate $B$? No. Similar logic; $M$ loses to $B$ if P2 plays $L$.
      *   *Result:* Under **Pure** Weak Dominance, $B$ survives.

  *   **Check Mixed Dominance:**
      *   Consider a mix: Play $T$ with 50% probability and $M$ with 50% probability.
      *   If P2 plays $L$: Expected payoff is $0.5(2) + 0.5(0) = \mathbf{1}$. (Ties with $B$)
      *   If P2 plays $C$: Expected payoff is $0.5(0) + 0.5(2) = \mathbf{1}$. (Ties with $B$)
      *   If P2 plays $R$: Expected payoff is $0.5(1) + 0.5(1) = \mathbf{1}$. (Strictly beats $B$, which gets 0).
      *   *Result:* The mixed strategy yields payoffs of $(1, 1, 1)$. Strategy $B$ yields $(1, 1, 0)$. The mix is never worse and sometimes strictly better. Under **Mixed** Weak Dominance, $B$ is eliminated.

  **The Takeaway:** Allowing mixed strategies assumes the player is sophisticated enough to commit to a randomization plan, not just a single action. It treats the *set* of available strategies as a convex space. If you forbid mixed dominance, you are assuming the player is somehow restricted to pure commitments, which is a stronger behavioral assumption than it appears.

  ---

  ### 2. The Pathologies: Order Dependence and NE Elimination

  You mentioned two other facts that often confuse readers: that order matters, and that Nash Equilibria (NE) can be deleted. Both of these stem from the "weakness" in weak dominance—specifically, the presence of **indifference**.

  In strict dominance, one strategy is *always* better. In weak dominance, one strategy is *sometimes* better and *never* worse. That "never worse" includes cases where they tie. Those ties are the source of the instability.

  #### Why Order Matters (Path Dependence)
  In strict dominance, the logic is robust. If $A$ is strictly better than $B$, it remains strictly better regardless of what other strategies are removed.

  In weak dominance, dominance often relies on the presence of a specific opponent strategy to create the "tie." If you eliminate that opponent strategy first, the dominance relationship might vanish.

  **The Intuition:**
  Imagine Strategy $A$ ties with Strategy $B$ only if the opponent plays Strategy $X$. If you decide $X$ is irrational and delete it *first*, $A$ and $B$ might now look incomparable. But if you compared $A$ and $B$ *before* deleting $X$, you might have deleted $B$. The sequence of "rationality checks" changes the outcome.

  #### Why Nash Equilibria Get Eliminated
  This is the most controversial part for non-specialists. A Nash Equilibrium requires that every player is playing a **Best Response**. It does *not* require that they are avoiding weakly dominated strategies.

  **The Example (Exhibit B)**
  Consider this simple 2x2 game:

  | P1 \ P2 | Left ($L$) | Right ($R$) |
  | :--- | :---: | :---: |
  | **Top ($T$)** | 1, 1 | 0, 0 |
  | **Bottom ($B$)** | 1, 0 | 0, 0 |

  *   **Nash Analysis:**
      *   If P2 plays $L$, P1 gets 1 from $T$ and 1 from $B$. P1 is **indifferent**.
      *   If P1 plays $B$, P2 gets 0 from $L$ and 0 from $R$. P2 is **indifferent**.
      *   Therefore, **$(B, L)$ is a Nash Equilibrium.** Neither player has an incentive to deviate unilaterally.

  *   **IEDS Analysis:**
      *   Look at P1. $T$ gives $(1, 0)$. $B$ gives $(1, 0)$.
      *   $T$ weakly dominates $B$ (it ties everywhere, and strictly dominates if we imagine a "tremble" where P2 might play $R$ with non-zero probability, though even without trembles, standard weak dominance definition allows elimination here).
      *   A rational player using IEDS eliminates $B$.
      *   **Result:** The procedure eliminates the strategy $B$, thereby destroying the Nash Equilibrium $(B, L)$.

  **The Logic for your Readers:**
  Weak dominance assumes a level of "caution" or "trembling hand" that Nash Equilibrium does not. IEDS says: "Even if $B$ gives the same payoff as $T$ against $L$, you shouldn't play $B$ because if there is even a tiny chance P2 plays $R$, $T$ is safer."
  Nash Equilibrium says: "If you are *sure* P2 plays $L$, $B$ is just as good as $T$."
  IEDS is essentially a refinement of Nash Equilibrium that filters out equilibria relying on "weak" threats or indifference.

  ### Summary for Your Piece

  To straighten out the knot for your audience, you can frame it this way:

  1.  **Strict Dominance** is about **Logic**. (If $A > B$ always, a rational agent never plays $B$.)
  2.  **Weak Dominance** is about **Caution**. (If $A \ge B$ always and $A > B$ somewhere, a cautious agent prefers $A$ to avoid risk.)
  3.  **Mixed vs. Pure:** Allowing mixed strategies to dominate acknowledges that rational agents can **diversify risk**. A strategy that looks safe on its own might be riskier than a balanced portfolio of other strategies.
  4.  **The Cost:** The price of this caution is that the procedure becomes fragile (order matters) and aggressive (it kills Nash Equilibria). It assumes opponents are also cautious, which isn't always true in equilibrium.

  The "unstated choice" you suspected is indeed whether we define rationality as "maximizing against pure actions" or "maximizing against all feasible probability distributions." The latter is the standard in modern theory, but it comes with the baggage you've encountered.
