      *(Crucial realization)*: The 5% *real* distribution is the killer. $40M is small. Alternatives have high minimums and lock-ups. The liquidity mismatch is the biggest risk. Proposal 3 (Options) burns cash needed for distributions. Proposal 2 (Royalties) locks cash needed for distributions. Proposal 1 (Litigation) is the only one with a potential 3-5 year horizon, but still illiquid.

