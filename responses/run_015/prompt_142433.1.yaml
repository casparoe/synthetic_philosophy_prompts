answer: |-
  ### Part I: The Procedure (The Liability-First Filter)

  This procedure is designed to be executed in a single two-hour session. It does not attempt to solve the St. Petersburg Paradox or price tail risk. It treats the 5% real distribution mandate as the primary liability and treats any investment that threatens that liability as a failure, regardless of Expected Value (EV).

  **Prerequisite (Step 0): Set the Ruin Threshold**
  You stated you have never set a number on the probability of missing the distribution. You cannot proceed without one.
  *   **The Question:** "What is the maximum acceptable probability that we fail to meet the 5% real distribution in any rolling 10-year window?"
  *   **Adequate Answer:** A single percentage. For a foundation with a legal obligation, prudential standard suggests **<5%**.
  *   **Judgment Call:** This number is not derived from data; it is a risk tolerance statement. If you cannot agree on this number, you cannot invest in *any* illiquid or tail-risk asset.
  *   **Stop Rule:** If no number is agreed upon, the procedure returns a **NO** to all tail-risk proposals.

  **Step 1: The Distribution Breach Test (Liquidity & Cash Flow)**
  *   **The Question:** "Does this investment require cash outflows (premiums, capital calls) or lock-ups that coincide with years where our public equity/fixed income portfolio is likely down >20%?"
  *   **Adequate Answer:** A timeline of required cash flows mapped against a "stress year" (e.g., 2008, 2022).
  *   **Pass:** Cash flows are neutral or positive in stress years.
  *   **Fail:** Investment requires net cash outflow in stress years.
  *   **Stop Rule:** Immediate **NO**. You cannot buy insurance with money you need for food.

  **Step 2: The Wrong-Way Risk Test (Counterparty Correlation)**
  *   **The Question:** "Is the counterparty's ability to pay positively correlated with the magnitude of the payout?"
  *   **Adequate Answer:** Identification of the specific stressor that triggers the payout (e.g., mass tort loss, market crash, licensor bankruptcy) and an assessment of the counterparty's balance sheet under that specific stressor.
  *   **Pass:** Counterparty has collateralized the obligation or is capitalized for the specific stressor (e.g., reinsurer with collateral trust).
  *   **Fail:** Counterparty is a "thinly capitalized licensor," a fund with limited partners who can gate redemptions, or an entity whose solvency depends on the *absence* of the trigger event.
  *   **Stop Rule:** Immediate **NO** unless the obligation is fully collateralized by a third-party bank or trust. Truncation models do not work here; the correlation is structural.

  **Step 3: The Black-Box Discount (Model Risk)**
  *   **The Question:** "If we assume the promoter's model is optimistic by 50%, does the investment still clear our hurdle rate?"
  *   **Adequate Answer:** A recalculation of the Internal Rate of Return (IRR) or EV using 50% of the projected upside and 150% of the projected loss frequency.
  *   **Pass:** The investment still contributes positively to the 5% distribution mandate.
  *   **Fail:** The investment relies on the promoter's alpha to break even.
  *   **Stop Rule:** **NO** for new strategies. **VOTE** for existing strategies (if you already trust the manager). Since you have no analyst to audit the model, you must assume the model is marketing material.

  **Step 4: The Concentration Limit (Diversification)**
  *   **The Question:** "Does this investment introduce a single point of failure (e.g., a shared legal question, a single licensor) that exceeds 5% of the portfolio?"
  *   **Adequate Answer:** Identification of the common risk factor.
  *   **Pass:** Risk is diversified across uncorrelated drivers.
  *   **Fail:** Risk is concentrated in one binary outcome (e.g., one legal ruling, one drug approval).
  *   **Stop Rule:** **NO** if the exposure to that single binary outcome exceeds 2% of corpus. (For a $40M fund, $800k is the hard cap on any single binary bet).

  **Step 5: The One-Page Test (Fiduciary Documentation)**
  *   **The Question:** "Can we write the rationale for this investment on one page without using the words 'expected value,' 'tail,' or 'unbounded'?"
  *   **Adequate Answer:** A draft paragraph explaining the investment as a hedge or income generator in plain English.
  *   **Pass:** "We bought this to provide cash flow when equities are down."
  *   **Fail:** "We bought this because the EV is positive despite a 90% chance of loss."
  *   **Stop Rule:** If you cannot explain it simply, you do not understand the risk. **NO**.

  ***

  ### Part II: Running the Procedure on Live Proposals

  **Proposal 1: Litigation Funding Slice ($400k, 1% of corpus)**
  *   **Step 0 (Ruin Threshold):** Assume 5%.
  *   **Step 1 (Distribution Breach):** **PASS.** Capital is called upfront. No further cash drain. Distributions come from settlements (3-5 years).
  *   **Step 2 (Wrong-Way Risk):** **FAIL.** You noted cases turn on a "shared legal question." If that question is ruled against the pool, the counterparty (funder) has no assets to pay you, and the defendants may also be insolvent. The payout correlates with the funder's impairment.
  *   **Step 3 (Black-Box):** **FAIL.** Model not auditable. If win rate is 40% instead of 60%, EV collapses.
  *   **Step 4 (Concentration):** **FAIL.** "Shared legal question" makes this a single binary bet, not a diversified pool. $400k is 1%, which is under the 2% cap, but the *correlation* makes it effectively 100% concentrated risk.
  *   **Step 5 (One-Page):** **FAIL.** Hard to explain to a regulator why you bet foundation money on a legal binary without hedging.
  *   **Procedure Verdict:** **NO.**

  **Proposal 2: Royalty Stream ($1m, 2.5% of corpus, 15 years)**
  *   **Step 1 (Distribution Breach):** **FAIL.** 15-year lock-up. If sales miss, you have no cash to meet the 5% annual distribution without selling other assets (potentially at a loss). It creates an asset-liability duration mismatch.
  *   **Step 2 (Wrong-Way Risk):** **FAIL.** You noted the licensor is "thinly capitalized." If the drug/product fails (when you need the royalty to vanish to save taxes? No, if it fails you get nothing). If it succeeds massively, can they survive the payout? Often these are structured so the licensor goes bust or sells out, capping your upside.
  *   **Step 3 (Black-Box):** **FAIL.** "Nobody can put a defensible number on the blockbuster case." You are buying a lottery ticket.
  *   **Step 4 (Concentration):** **FAIL.** Single asset risk.
  *   **Step 5 (One-Page):** **FAIL.** "We locked up 2.5% of the foundation for 15 years on an unauditable sales forecast."
  *   **Procedure Verdict:** **NO.**

  **Proposal 3: OTM Options (2% of corpus/year = $800k)**
  *   **Step 1 (Distribution Breach):** **HARD FAIL.** This requires an annual cash outflow of $800k. Your distribution obligation is ~$2M+ (5% of $40M adjusted for inflation). This strategy consumes 40% of your required annual yield *before* you pay a single dollar to beneficiaries. In a crisis (when the option pays), your endowment corpus will be down, making the 5% distribution harder to fund. You are burning cash needed for survival to buy insurance that pays when you are already bleeding.
  *   **Step 2 (Wrong-Way Risk):** **PASS.** Counterparty is likely a clearing house.
  *   **Step 3 (Black-Box):** **PASS.** Market priced.
  *   **Step 4 (Concentration):** **PASS.**
  *   **Step 5 (One-Page):** **FAIL.** "We lose money every year to bet on a crash."
  *   **Procedure Verdict:** **NO.** (Stopped at Step 1).

  ***

  ### Part III: What This Procedure Cannot Settle

  **1. The "Business" Question**
  The procedure rejects all three proposals. This forces the question: *Should you be in this business at all?*
  The procedure cannot answer this, but the inputs suggest the answer is **No**.
  *   **Reasoning:** A $40M foundation with a 5% *real* distribution mandate is mathematically precarious. You require a 7-8% nominal return consistently. Public markets (60/40) historically struggle to guarantee this after fees and inflation without taking volatility risk.
  *   **The Trap:** You are looking at tail-risk assets because public markets feel insufficient to meet your mandate. However, these assets introduce opacity, illiquidity, and counterparty risk that a 4-person committee with no staff cannot monitor.
  *   **Conclusion:** You are likely under-capitalized for your distribution obligation. The solution is not better alternative investments; it is either (a) reducing the distribution rate, (b) increasing the corpus (fundraising), or (c) accepting a higher risk of ruin in public markets. Adding complex alternatives increases the risk of ruin without solving the structural deficit.

  **2. The Judgment Calls Disguised as Procedure**
  *   **Step 0 (Ruin Threshold):** This is pure values. A family might accept 20% risk of a distribution cut to chase growth. A regulator might demand 1%. I used 5% as a placeholder, but *you* must own this number.
  *   **Step 2 (Wrong-Way Risk):** Determining "correlation" is subjective. I treated "shared legal question" as perfect correlation. You could argue it's only 50%. The procedure forces you to state the correlation assumption, but it doesn't prove it.
  *   **Step 3 (Black-Box Discount):** The 50% discount is arbitrary. It is a heuristic for "we don't trust you."

  ***

  ### Part IV: Which Answers I Would Not Act On

  You asked me to tell you which of the procedure's answers I would not act on.

  **I would not act on a "Yes" to Proposal 1 (Litigation Funding), even if you tweak the procedure to pass it.**

  Here is why, plainly:
  1.  **Fiduciary Mismatch:** You have a legal obligation to distribute. Litigation funding is illiquid and binary. If the "shared legal question" goes against you, you lose 1% of corpus instantly. In a $40M fund, a 1% loss is manageable, but the *precedent* of investing in unauditable, binary legal bets opens the door to mission drift.
  2.  **The "Advocacy" Bias:** You stated you are "most attached" to this proposal. In a committee with no analysts, the Chair's attachment is the biggest risk factor. The procedure is designed to protect you from your own conviction. If the procedure says "No" (as it did above), and you override it because you "like the deal," you have ceased to function as a prudent investment committee and have become a venture capital fund using foundation capital.
  3.  **The Regulatory Test:** If a regulator asks, "How did you verify the win rate?" and the answer is "The promoter sent us a spreadsheet," you have failed the Prudent Investor Rule. The procedure's Step 3 (Black-Box) is the only thing protecting you from a lawsuit. Do not bypass it.

  **My Advisory Conclusion:**
  The procedure correctly identifies that **none of these three proposals fit your foundation.**
  *   **Proposal 3** threatens your immediate solvency (cash flow).
  *   **Proposal 2** threatens your future liquidity (duration).
  *   **Proposal 1** threatens your fiduciary standing (opacity/concentration).

  **The Hard Truth:**
  Your problem is not the investment menu; it is the **5% real distribution mandate** on a **$40M corpus** with **no staff**.
  *   5% *real* is an institutional-grade hurdle rate that typically requires an endowment of $500M+ with a full CIO office to execute safely via alternatives.
  *   Attempting to solve this with "tail proposals" pitched to small committees is how foundations lose their capital.

  **Recommendation:**
  1.  **Reject all three proposals.**
  2.  **Convene a special meeting** solely to discuss Step 0 (The Ruin Threshold).
  3.  **Acknowledge** that with current assets and no staff, you cannot safely target 5% *real* without accepting a significant probability of missing the distribution.
  4.  **Document** that decision. If the family insists on 5% real, they must accept the risk that the corpus will be eroded in bad decades. If they want capital preservation, the distribution must drop to 3-4% real.

  Do not use complex derivatives to patch a structural asset-liability mismatch. It will not end well.
