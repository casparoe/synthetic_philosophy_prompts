answer: |-
  **Framework for the Evaluation of Theories of Special Composition**

  **Introduction**

  The following document specifies the adequacy conditions for any proposed answer to the Special Composition Question (SCQ): *Under what conditions do some things compose a further thing?* This framework is designed to adjudicate between competing mereological systems by establishing a hierarchy of desiderata. These are divided into empirical constraints, conceptual distinctions, and theoretical virtues. Each desideratum is accompanied by its motivating consideration and a classification regarding its negotiability.

  ---

  ### I. Classification Desiderata (The Extensional Constraint)

  An adequate theory must deliver verdicts on specific cases that align with either robust intuition or established scientific fact.

  **1. The Artifact Intuition**
  *   **Specification:** The theory must account for the existence of ordinary medium-sized dry goods (e.g., tables, chairs, engines).
  *   **Motivation:** Pre-theoretic common sense suggests that when parts are arranged tablewise, a table exists. Denying this incurs a high revisionary cost.
  *   **Status:** *Camp-Specific Preference.* (Nihilists and Organicists reject this; Universalists accept it but overgenerate).

  **2. Diachronic Organismic Persistence**
  *   **Specification:** The theory must classify living organisms as composites that persist through complete cellular turnover.
  *   **Motivation:** Biological continuity. If an organism ceases to exist every time a cell dies and is replaced, biological identity is unintelligible. The theory must allow for composition despite material flux.
  *   **Status:** *Non-Negotiable.* (Any theory denying the existence of persisting organisms is empirically inadequate).

  **3. Quantum Holism**
  *   **Specification:** The theory must accommodate the ontological status of quantum-entangled pairs as a unified system, regardless of spatial separation.
  *   **Motivation:** Physical non-separability. In entangled states, the state of the system is not determined by the states of the individual particles. A mereology that requires spatial contact or causal interaction fails here.
  *   **Status:** *Non-Negotiable.* (Must not contradict standard quantum mechanics).

  **4. Functional Aggregates and Synthetic Consortia**
  *   **Specification:** The theory must provide a principled distinction between a synthetic-biology consortium (where parts retain independent metabolism but display collective behaviour) and a mere mixture of bacteria.
  *   **Motivation:** Emergent functionality. In synthetic biology, distinct organisms are engineered to function as a single circuit. The theory must explain whether this functional integration warrants ontological composition.
  *   **Status:** *Camp-Specific Preference.* (Depends on whether one prioritises functional integration or causal independence).

  ---

  ### II. Conceptual Distinctions (The Intensional Constraint)

  An adequate theory must preserve logical and metaphysical distinctions to avoid category errors.

  **5. Composite vs. Mere Collection**
  *   **Specification:** The theory must distinguish between parts composing a whole ($xs$ compose $y$) and parts merely existing alongside one another ($xs$ exist).
  *   **Motivation:** Ontological parsimony and truthmaking. There is a difference between a pile of bricks and a wall; the latter supports predicates (e.g., 'is load-bearing') the former does not.
  *   **Status:** *Non-Negotiable.*

  **6. Temporary vs. Essential Parts**
  *   **Specification:** The theory must distinguish between parts an object has contingently (e.g., a handle on a mug) and parts it has essentially (e.g., the heart of a living organism, perhaps).
  *   **Motivation:** Modal intuition and mereological essentialism. A theory that makes all parts essential renders change impossible; a theory that makes no parts essential renders identity too loose.
  *   **Status:** *Non-Negotiable.*

  **7. Composition vs. System Membership**
  *   **Specification:** The theory must distinguish between being composed of parts and being a part of a larger system (e.g., a citizen is part of a state, but not composed of the state).
  *   **Motivation:** Avoiding the mereological fallacy. Composition is a relation between parts and a whole of the same ontological category; membership often implies a different categorical status.
  *   **Status:** *Non-Negotiable.*

  ---

  ### III. Scientific Compatibility (The Empirical Constraint)

  Metaphysics must be consistent with our best scientific theories.

  **8. Biological Metabolism and Boundaries**
  *   **Specification:** The theory cannot posit composition where biological boundaries are impermeable to causal exchange, nor deny it where metabolic integration is total.
  *   **Motivation:** Biological definition of life. Organisms are defined by homeostatic boundaries. A metaphysics that composes a cat and the mat it sits on violates biological individuation.
  *   **Status:** *Non-Negotiable.*

  **9. Conservation and Locality**
  *   **Specification:** The theory must not imply the creation or destruction of mass-energy through composition, nor require action-at-a-distance for parthood (excepting quantum non-locality as noted in Desideratum 3).
  *   **Motivation:** Conservation laws and relativistic constraints.
  *   **Status:** *Non-Negotiable.*

  ---

  ### IV. Theoretical Tensions (Jointly Unsatisfiable Pairs)

  It is recognised that no theory satisfies all desiderata perfectly. The following pairs represent trade-offs that a doctoral framework must acknowledge.

  **1. Common Sense vs. Parsimony**
  *   **Tension:** Satisfying the Artifact Intuition (Desideratum 1) typically requires positing a vast number of entities. Satisfying strict ontological parsimony often requires Nihilism, which violates the Artifact Intuition.
  *   **Resolution:** One must prioritise either fidelity to ordinary language or minimisation of ontological commitment.

  **2. Precision vs. Vagueness**
  *   **Tension:** A precise, non-arbitrary boundary for composition (e.g., Universalism) avoids vagueness but violates Common Sense. A restricted view (e.g., Organicism) respects Common Sense but introduces vagueness regarding exactly when composition occurs (the 'sorites' of composition).
  *   **Resolution:** One must choose between epistemic vagueness or ontological extravagance.

  **3. Physical Holism vs. Localised Composition**
  *   **Tension:** Accommodating Quantum Holism (Desideratum 3) suggests composition can occur across vast distances. Accommodating Biological Boundaries (Desideratum 8) suggests composition is strictly local and bounded.
  *   **Resolution:** One may need a pluralistic mereology or a distinction between physical and biological composition.

  ---

  ### V. Brief Evaluative Scorecard

  The following scores indicate how three prominent positions fare against the established framework. *Note: The emphasis remains on the criteria above; this scorecard serves only to illustrate the utility of the framework.*

  **1. Unrestricted Composition (Universalism)**
  *   **Performance:** Satisfies Precision and avoids vagueness entirely.
  *   **Failures:** Violates the Artifact Intuition by overgenerating (there is a 'trout-turkey' composed of a trout and a turkey). Struggles with Desideratum 5 (Composite vs. Collection), as it collapses the distinction between a heap and a whole.
  *   **Verdict:** High theoretical elegance, low empirical fidelity.

  **2. Mereological Nihilism**
  *   **Performance:** Maximises Parsimony and satisfies Conservation laws strictly.
  *   **Failures:** Violates the Artifact Intuition and, crucially, Diachronic Organismic Persistence (Desideratum 2). If there are no composites, there are no organisms, only 'simples arranged organismwise'. This contradicts biological realism.
  *   **Verdict:** High ontological economy, unacceptable revisionary cost regarding life.

  **3. Restricted Biological View (e.g., Van Inwagen)**
  *   **Performance:** Satisfies Diachronic Organismic Persistence and Biological Metabolism constraints excellently. Preserves the distinction between Composite and Collection for living things.
  *   **Failures:** Struggles with the Artifact Intuition (denies existence of tables). Faces difficulty with Quantum Holism (Desideratum 3), as entangled particles do not constitute a 'life'. The status of Synthetic Consortia (Desideratum 4) remains ambiguous under this view.
  *   **Verdict:** High biological fidelity, moderate revisionary cost regarding artifacts.

  ---

  **Conclusion for the Framework**

  This specification prioritises Non-Negotiable constraints (scientific compatibility and core conceptual distinctions) over Camp-Specific preferences (common sense regarding artifacts). A viable theory of special composition must first secure the existence of organisms and respect physical laws; only then may it attempt to accommodate ordinary objects without incurring prohibitive theoretical costs. The tensions outlined in Section IV indicate that the 'correct' theory will depend largely on which trade-off the metaphysician finds most palatable.
