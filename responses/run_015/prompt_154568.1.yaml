prompt: |-
  I'm a novelist — literary stuff with one foot in SF — and I'm about 40k words into a book that hangs entirely off a quantum suicide setup, and I keep drafting scenes that my beta readers, and my mate who did physics at Imperial, tell me are cheating. So what I want isn't a physics lesson, it's a craft procedure: something I can run on any scene I've written in about ten minutes, in the vocabulary I actually work in — point of view, whose head we're in, free indirect style, what the narrator is licensed to know, what the reader can infer from what's on the page, dramatic irony, offstage action — that tells me whether the scene is honest to the premise or whether I've quietly smuggled in a bit of magic. Constraints: no equations, no branching-tree diagrams (I tried drawing one and it made everything worse), it has to work for both my present-tense first-person chapters and the third-person-limited ones, and it should end in either a rewrite instruction or an explicit "this one's a judgment call, you decide" rather than in a shrug. I cant afford many more dead chapters.

  Where I've got to, which you should correct if I've mangled it: as I understand it, every outcome of the device happens somewhere, but you only ever have experiences in the outcomes where there's still a you around to have them, so from the inside you apparently survive everything while from outside you're just dead in nearly all of it. The snags I keep hitting and want the procedure to handle, in roughly the order I hit them: the *grain* problem, since dying isn't instantaneous and I'm not sure there is a single clean outcome in which "she survives" — what do I do with a scene where the character is clinically gone for four minutes and comes back, is that a branch or a smear? The *mangled-branch* problem, since the outcomes where you walk away from a shotgun in the face are outcomes where you walk away ruined, and my character can't be untouched by chapter nine — how much of that do I owe the reader, and at what point does it stop being a book anyone finishes? The *witness* rule, since every other character in the book sees her die — what am I allowed to dramatise and what can I only report, and can I ever write from the daughter's point of view at all, or is that a different novel? The *accumulation* problem, since from the inside she can't know she's in the freak sequence of outcomes but the reader has to feel the improbability mounting, and I don't know how to get that onto the page without handing the narrator knowledge she couldn't have. And the *other-people* problem, since at one point she tries to drag someone through with her, and I genuinely can't tell whether the premise lets her.

  Then run it on three scenes I've got drafted, and give me the third answer even though I don't want it: (a) a present-tense first-person chapter where she presses the button for the hundredth time and nothing happens; (b) a third-person chapter from the daughter's point of view the following morning, identifying the body; (c) my ending, which I love and which I suspect is exactly the one that breaks the rules — she's ninety-odd, she dies in bed with the daughter holding her hand, and the last two pages are inside her head as it goes dark. Tell me precisely what (c) is getting wrong and what the cheapest fix is that keeps the feeling of it. And be honest about where the procedure runs out: mark the points that are just artistic calls, and separately the points where it runs out because the philosophy and the physics don't settle it either — I'm thinking of the business of whether the point of view tracks how many outcomes there are or how thick they are (amplitude? my mate used a word I've forgotten), and whether there's some floor below which the surviving sliver is too thin to be anybody at all. Don't pad it out with a reading list or names of papers, I've read the pop-science accounts and I'm not going to read the papers — I just want to stop writing scenes that don't work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist (literary/SF hybrid), 40k words in.
      *   **Problem:** Beta readers and a physicist friend say scenes "cheat" on the Quantum Suicide (QS) premise.
      *   **Goal:** A *craft procedure* (not a physics lesson) to audit scenes for honesty to the premise.
      *   **Constraints:**
          *   No equations, no branching-tree diagrams.
          *   Vocabulary: POV, head, free indirect style, narrator license, inference, dramatic irony, offstage action.
          *   Time: ~10 minutes per scene.
          *   Works for: Present-tense 1st person AND 3rd-person limited.
          *   Output: Rewrite instruction OR "judgment call" (no shrugs).
          *   Tone: Direct, honest, no padding (no reading lists).
      *   **Specific Snags to Address:**
          *   *Grain:* Dying isn't instantaneous (clinical death vs. branch).
          *   *Mangled-branch:* Survivor bias (shouldn't she be ruined?).
          *   *Witness:* What can others see? Can we use the daughter's POV?
          *   *Accumulation:* How to show improbability without narrator knowledge.
          *   *Other-people:* Can she drag someone else through?
      *   **Task:** Create the procedure, then apply it to three specific scenes (a, b, c), specifically critiquing scene (c) and offering a fix.
      *   **Meta-Task:** Acknowledge where the procedure fails (philosophical/physics ambiguity vs. artistic choice).

  2.  **Deconstruct the Quantum Suicide Premise (for Craft Purposes):**
      *   *Core Mechanic:* From the *inside* (1st person/Deep 3rd), death is impossible. Consciousness follows the path of survival. From the *outside* (Witness/Observer), death is probable/inevitable.
      *   *The "Cheating":* Usually happens when the narrator knows too much about the branches they didn't take, or when the external world doesn't reflect the statistical improbability of the survivor's existence, or when the survivor is too clean.
      *   *The "Vocabulary":* Stick to narrative terms. "Narrator License," "Information Horizon," "External Consistency."

  3.  **Drafting the Procedure (The "QS Audit"):**
      *   Need a checklist that fits the 10-minute constraint.
      *   *Step 1: The Anchor.* Who is experiencing? (Survivor vs. Witness).
      *   *Step 2: The Event.* Is it binary (Dead/Alive) or gradual (Grain)?
      *   *Step 3: The Cost.* What is the toll on the survivor? (Mangled Worlds).
      *   *Step 4: The Echo.* How does the world react? (Accumulation/Witness).
      *   *Step 5: The Entanglement.* Can others come along? (Other-people).
      *   *Decision Matrix:* If it fails X, do Y.

  4.  **Addressing the Specific Snags within the Procedure:**
      *   *Grain:* Define the "Threshold of Continuity." If consciousness breaks, the branch snaps.
      *   *Mangled-branch:* Enforce "Survivor's Debt."
      *   *Witness:* Enforce "Observer Consistency."
      *   *Accumulation:* Use "Environmental Friction."
      *   *Other-people:* Enforce "Independent Trajectories."

  5.  **Applying the Procedure to the Three Scenes:**

      *   **Scene (a): 1st Person, Button Press #100.**
          *   *Check:* Narrator knows it's #100. How? Memory accumulation.
          *   *Risk:* Boredom vs. Miracle. If nothing happens, is it a test or a dud?
          *   *Verdict:* Likely honest *if* the internal monologue reflects the mounting dread of *others* reacting, not just the button clicking.

      *   **Scene (b): 3rd Person, Daughter, ID'ing Body.**
          *   *Check:* Witness Rule.
          *   *Risk:* Does she see *the* body? Yes, in *her* branch, the mother is dead.
          *   *Verdict:* Honest. This is the control group. Crucial for contrast.

      *   **Scene (c): The Ending (Death in Bed).**
          *   *Check:* This is the big one. QS says you *don't* experience death. You experience the *ceasing* of experience only if there is no surviving branch.
          *   *The Problem:* If she dies of old age, does a branch exist where she doesn't? Old age is cellular failure. QS usually applies to binary quantum events. Natural death is thermodynamic inevitability.
          *   *The "Cheating":* Experiencing the "darkness" implies the end of the stream. QS says the stream *never* ends from the inside.
          *   *The Fix:* She shouldn't experience the end. She should experience a *shift* or a *continuation* that implies the thread didn't snap, OR the narrative cuts *before* the snap.
          *   *Cheapest Fix:* Cut the "going dark." End on a sensation that implies continuation, or a witness perspective that confirms the death while the internal voice cuts mid-thought.

  6.  **Addressing the Limits (Philosophy/Physics Ambiguity):**
      *   *Amplitude/Thickness:* Physics doesn't agree on whether low-amplitude branches sustain consciousness. This is an artistic choice (The "Thin World" problem).
      *   *Identity:* Is the survivor the *same* person? (Ship of Theseus).
      *   *Natural Death:* QS doesn't grant immortality against entropy, only against quantum-conditional death.

  7.  **Refining the Tone:**
      *   The user is tired and frustrated ("can't afford many more dead chapters").
      *   Be direct, professional, empathetic but firm.
      *   Avoid "Actually, in physics..."
      *   Focus on "Does this scene earn its keep?"

  8.  **Self-Correction/Review during drafting:**
      *   *Did I use equations?* No.
      *   *Did I use diagrams?* No.
      *   *Is it 10 minutes?* The checklist needs to be short enough.
      *   *Did I answer the specific scenes?* Yes.
      *   *Did I address the "Grain" and "Mangled" issues?* Yes, integrated into the checklist.
      *   *Did I give a definitive answer on Scene C?* Yes, identified the breach and offered a fix.
      *   *Did I acknowledge the limits?* Yes, in the "Where the Map Blanks Out" section.

  9.  **Final Polish:**
      *   Ensure the distinction between "Narrator Knowledge" and "Reader Inference" is clear.
      *   Make sure the "Witness Rule" is strict.
      *   Clarify the "Natural Death" paradox in Scene C. (QS prevents *quantum* death, not *entropy* death, but experiencing the *moment* of entropy death is the tricky part). *Correction:* In QS theory, you slide into the branch where the cancer goes into remission, or the heart restarts. True natural death is the cessation of *all* branches where you exist. So experiencing the *end* is theoretically impossible in strict QS. The narrative must reflect that impossibility or acknowledge the premise is breaking.

      *(Self-Correction on Scene C)*: If she dies of old age, eventually there are no branches where she lives. The "consciousness" must end. But the prompt says "last two pages are inside her head as it goes dark." Strict QS says you never experience the dark. You experience the life *before* the dark, then you're gone. To experience the fading is to experience the termination of the observer. That violates the "Immortality" aspect of QS.
      *Fix:* The narrative must cut *before* the dark, or imply she slipped into a branch where she *didn't* die, leaving the daughter with a body that is technically hers but empty, OR the daughter sees her die, but the POV cuts before the protagonist registers death.
      *Better Fix for "Literary" feel:* The POV cuts mid-sentence or mid-thought. No "going dark." The light doesn't fade; the book ends.

  10. **Finalizing the Output Structure:**
      *   Introduction (Acknowledging the bind).
      *   The Procedure (The "QS Honesty Check").
      *   The Application (Scenes A, B, C).
      *   The Limits (Where physics/art blur).

      *(Wait, one more check on the "Grain" problem)*: User asked about clinical death. If she dies for 4 mins and comes back. In QS, the branch where she dies is abandoned. The branch where she survives is taken. If the brain activity stops, does consciousness persist? This is the "Threshold." I need to make sure the procedure flags this as a "Definition of Death" constraint. I will add a step for "Continuity Threshold."

      *(Wait, one more check on "Other People")*: Can she drag someone? No. Their consciousness follows *their* survival path. Unless they are entangled (physically linked to the device), they will see her die. I need to make sure the procedure flags "Shared Survival" as a likely cheat.

      Okay, ready to write.
answer: |-
  Here is the procedure. It is designed to be run in ten minutes, using your existing craft vocabulary. It does not care about the physics beyond the core narrative constraint: **Consciousness follows the path of continuity.**

  ### The QS Honesty Check (10-Minute Audit)

  Run these five questions on the scene. If you answer "No" to any, you have likely smuggled in magic.

  **1. The Anchor Test (POV & License)**
  *   **Question:** Whose head are we in, and does their knowledge match their survival status?
  *   **The Rule:** If we are in the **Survivor's** head, they cannot know they died in other branches. They cannot feel "lucky." They can only feel confused by the world's reaction. If we are in a **Witness's** head (daughter, doctor), they must see a death or a statistical impossibility, never a miracle.
  *   **Fail State:** The Survivor narrates, "I knew I had died a thousand times." (Cheat: They only know they lived.)
  *   **Fix:** Shift to Free Indirect Discourse that mirrors confusion, not omniscience. "The nurse looked at me like I was a ghost. I told her I was right here."

  **2. The Continuity Threshold (The Grain Problem)**
  *   **Question:** Is the "death" event binary enough to snap the thread, or is it a smear?
  *   **The Rule:** For QS to work, there must be a moment where *this* consciousness ends. If the character is clinically dead for four minutes, you must define the moment the light went out. If the brain state degrades too slowly, there is no branch snap, just decay.
  *   **Fail State:** A vague "I slipped away and came back" without a hard edge to the experience.
  *   **Fix:** Anchor the survival to a specific quantum trigger (the device click, the photon hit), not the biological aftermath. The body can be ruined; the *mind* must snap from "about to die" to "alive."

  **3. The Survivor's Debt (The Mangled-Branch Problem)**
  *   **Question:** What is the physical/psychological toll of the path not taken?
  *   **The Rule:** In the branches where she survives, she survives *damaged*. The universe isn't kind; it's just permissive. If she walks away from a shotgun, she should have hearing loss, shrapnel scars, or PTSD.
  *   **Fail State:** She emerges pristine, merely "shaken."
  *   **Fix:** Add a specific, accumulating injury or deficit in every survival scene. Tinnitus. A limp. A gap in memory.

  **4. The Observer Consistency (The Witness Rule)**
  *   **Question:** Does the external world reflect the statistical improbability?
  *   **The Rule:** To the Survivor, she lives. To the Witness, she dies repeatedly. The tension comes from the gap between these two truths.
  *   **Fail State:** The daughter sees her mother survive and treats it as normal.
  *   **Fix:** The Witness POV must treat the Survivor as a ghost, a glitch, or a corpse that won't stay dead. They are living in the graveyard of the other branches.

  **5. The Entanglement Limit (The Other-People Problem)**
  *   **Question:** Is the character trying to pull someone else along?
  *   **The Rule:** Consciousness is individual. You cannot drag a witness into your survival branch unless they are physically part of the quantum trigger.
  *   **Fail State:** She holds her daughter's hand and they both survive the explosion.
  *   **Fix:** The daughter dies. The mother wakes up alone, holding the hand of a corpse, or holding nothing.

  ***

  ### Application to Your Drafted Scenes

  Here is the audit on the three scenes you provided.

  **(a) Present-Tense First Person: Button Press #100**
  *   **Audit:**
      *   *Anchor:* **Pass**, provided she doesn't narrate "I have pressed this 99 times before." She only knows she pressed it *now*. The count must be inferred from external cues (a tally counter, the wear on the button).
      *   *Continuity:* **Pass**. Button presses are binary.
      *   *Debt:* **Check**. Is she shaking? Is the room different?
      *   *Observer:* **N/A** (Internal POV).
      *   *Entanglement:* **N/A**.
  *   **Verdict:** **Honest**, but risky. If "nothing happens," the drama is internal.
  *   **Rewrite Instruction:** Ensure the tally counter is visible on the page, but the narrator doesn't dwell on the number. Focus on the *anticipation* of the click. The horror isn't that she survived; it's that the device clicked and she's still there to hear it. If she thinks, "Again," change it to, "Still here."

  **(b) Third-Person Limited: Daughter Identifying the Body**
  *   **Audit:**
      *   *Anchor:* **Pass**. This is a Witness POV.
      *   *Continuity:* **Pass**. In this branch, the mother is dead.
      *   *Debt:* **N/A** (Mother is dead).
      *   *Observer:* **Pass**. She sees the corpse. This validates the Survivor's miracles in other chapters.
      *   *Entanglement:* **Pass**. She is not being dragged along.
  *   **Verdict:** **Honest.** This is your control group. It grounds the SF in emotional reality.
  *   **Rewrite Instruction:** None on the physics. Ensure the daughter's grief is absolute. She is not mourning a "missing" person; she is identifying a corpse. This makes the mother's reappearance in the next chapter (from her own POV) feel like a violation of nature, which is the point.

  **(c) The Ending: Natural Death in Bed**
  *   **Audit:**
      *   *Anchor:* **Fail.** You are inside her head "as it goes dark."
      *   *Continuity:* **Fail.** QS posits that from the inside, subjective experience *cannot* end. You do not experience the termination of the observer. You experience the life *before* the termination, and then there is no "you" to experience the dark.
      *   *Debt:* **Pass** (Old age is the ultimate debt).
      *   *Observer:* **Fail.** The daughter sees a death. The mother experiences a death. The asymmetry collapses.
      *   *Entanglement:* **N/A**.
  *   **Verdict:** **This breaks the premise.** By describing the "going dark," you are granting the narrator knowledge of the end of the stream. In a QS universe, she either slips into a branch where the cells regenerate (immortality) or the narrative cuts *before* the consciousness ceases. You cannot narrate the cessation.
  *   **The Cheat:** You are giving the reader the comfort of closure (death) while keeping the SF premise (survival). You can't have both.
  *   **Cheapest Fix (Keeping the Feeling):** Cut the last paragraph. End the chapter mid-thought, mid-sensation. Do not describe the darkness. Describe the warmth of the hand, the sound of the daughter's breath, and then **stop**. The book closes. The reader is left in the dark, not the character. This preserves the "no experience of death" rule while giving the emotional resonance of letting go.
      *   *Alternative Fix:* She dies. The next sentence is her waking up in a hospital bed, younger, confused, with the daughter weeping over a *different* body. (Too drastic for a literary ending).
      *   *Recommended Fix:* **The Hard Cut.** End on the sensation of life. "The weight of her hand was the last thing I knew." Period. End of book.

  ***

  ### Where the Map Blanks Out (The Limits)

  You asked for honesty on where the procedure stops working. Here are the two points where physics and philosophy do not settle the argument, and you must make an artistic call.

  **1. The Amplitude Floor (The "Thin World" Problem)**
  *   **The Issue:** Your physicist mate mentioned "amplitude." In Many Worlds, some branches are "thicker" (higher probability) and some are "thinner." As your character survives improbable events, she slides into thinner and thinner branches.
  *   **The Craft Conflict:** Does a "thin" branch feel different? Is the world grayer? Do probabilities break down around her? Physics doesn't say consciousness fades in low-amplitude branches, but it *feels* like it should.
  *   **Your Call:** You must decide if the world degrades. If you don't depict this, the accumulation of miracles feels weightless. If you do, it risks becoming generic fantasy decay.
  *   **Procedure Limit:** The Honesty Check cannot tell you if the world should look weird. That is a tonal choice. I recommend **subtle statistical drift** (coins landing on edges, traffic lights staying green) rather than visual decay.

  **2. The Entropy Wall (Natural Death)**
  *   **The Issue:** QS prevents *quantum* death (discrete events). It does not necessarily prevent *thermodynamic* death (heat death of the universe, cellular entropy). Eventually, there may be no branch where the cells hold together.
  *   **The Craft Conflict:** If she dies of old age, does the consciousness end? Strict QS suggests she slides to a branch where the cancer remits or the heart restarts, effectively making her immortal until the universe ends.
  *   **Your Call:** Scene (c) assumes she *can* die. This contradicts the "Immortality" interpretation of QS.
  *   **Procedure Limit:** The procedure flags this as a breach (see Scene C audit), but you are allowed to override it if you define your premise as "QS delays death until entropy wins."
  *   **Recommendation:** If you want the emotional ending of Scene (c), you must implicitly accept that **entropy beats quantum mechanics.** That is a valid philosophical stance (Penrose, etc.), but you must not describe the *experience* of the end. You must describe the *acceptance* of the end.

  **Final Instruction:**
  Run the **QS Honesty Check** on every chapter before you show it to your beta readers. If Scene (c) is your intended ending, apply the **Hard Cut**. Do not describe the dark. It is the only way to keep the promise you made in chapter one.
