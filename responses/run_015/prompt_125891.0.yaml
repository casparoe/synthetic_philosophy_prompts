answer: |-
  Here is the translation of the four philosophical accounts into the vocabulary of your craft, followed by an accounting of the residue.

  ### I. The Translations

  **1. The Encoded Meaning Account**
  *Philosophy:* The derogation is semantic content. It is truth-conditional. Framing cannot quarantine it.
  *Craft Translation:* This account treats the slur as a failure of **Ventriloquism**. It posits that **Register** is not merely a costume the **Narrator** wears, but a contaminant inherent to the signifier. When the **Choral We** employs the term, or when **Free Indirect Discourse** borrows Ducharme's idiom, the **Implied Author** cannot successfully bracket the word within the **Diegetic** frame. The poison is not in the **Character's** intent, but in the lexicon itself. Therefore, the distinction between **Who Speaks** (the street) and **Who Writes** (you) collapses; the text carries the derogation as part of its **Diegesis**, regardless of **Dramatic Irony**. The word is not a marker of **Psychic Distance**; it is a breach of the **Contract** that cannot be repaired by **Unreliable Narration**.

  **2. The Standing Prohibition Account**
  *Philosophy:* The harm is normative. Uttering the word invokes a forbidden authority, reinforcing the hierarchy.
  *Craft Translation:* This treats the novel not as **Mimesis** but as a public **Speech Act** governed by **Paratext**. The **Implied Author** is held liable for the **Narrator's** vocabulary because publication constitutes an endorsement of the **Register**. Even if the word is **Diegetically** motivated (the street *would* say this), the act of printing it is **Non-diegetic**. It violates the **Contract** between **Implied Author** and **Actual Reader**. The **Refusal** in chapter fourteen (the marked absence) is the only moment the **Implied Author** adheres to the **Prohibition**; every other instance, even Ducharme's self-application, is an **Unreliable** reinforcement of the hierarchy. The **Jacket Copy** and the **Title Page** become accomplices to the **Narrator's** prejudice.

  **3. The Expressive/Performative Account**
  *Philosophy:* The harm is an act of contempt performed by the utterance. It survives negation or disavowal.
  *Craft Translation:* This account argues that the text does not *describe* contempt; it *enacts* it. **Mimesis** becomes **Performance**. When the **Choral We** uses the slur, it is not reporting on the town's bias; it is perpetrating it upon the **Actual Reader**. **Free Indirect Discourse** does not soften the blow; it implicates the **Narrative Voice** in the contempt. The **Implied Author's** disavowal (via **Dramatic Irony** or **Context**) is irrelevant because the **Illocutionary Force** of the word bypasses the **Focalization**. The word is a weapon fired from the page, not a prop held by a **Character**. The **Split** between **Fictional Addressee** and **Actual Reader** is ignored; the harm lands in the real world because the act is real.

  **4. The Pragmatic Inference Account**
  *Philosophy:* The harm is inferred from the speaker's choice of a marked term. No real speaker/hearer changes the dynamic.
  *Craft Translation:* This relies entirely on the distinction between **Who Speaks** and **Who Sees**. Derogation is an effect of **Psychic Distance** and **Code-switching**. If the **Actual Reader** infers the **Implied Author** chose the slur for shock or laziness, the harm lands. If the **Reader** infers the choice is strictly **Diegetic** (necessary for **Verisimilitude** of the 1968 register), the inference shifts. The **Choral We** complicates this because it is a **Stylized** voice without a single **Intending Speaker**. The harm depends on whether the **Reader** attributes the choice to the **Character** (Aubin) or the **Implied Author** (You). The **Refusal** in chapter fourteen works pragmatically because it signals a shift in **Narrative Reliability**, marking the term as "marked" without uttering it.

  ***

  ### II. The Residue

  Here is what your vocabulary cannot carry, where it bends, and where it breaks.

  **1. Encoded Meaning**
  *   **Translates Cleanly:** The concept of **Register** as inherent rather than applied.
  *   **Bends:** The notion of **Unreliable Narration**. In craft, an unreliable narrator can be ironic; in this account, the irony is voided by the semantics.
  *   **Residue:** This account assumes a single **Utterance** with fixed truth conditions. Your novel treats the slur as a **Motif** that changes valence across three hundred pages (from choral slur to self-slur). Craft vocabulary handles *development*; this philosophy handles *definition*. The residue here is a **Poverty in the Craft Vocabulary**: you have no term for a word that retains a fixed semantic poison regardless of its **Arc** or **Context**. You assume meaning accrues; this theory assumes meaning is static.

  **2. Standing Prohibition**
  *   **Translates Cleanly:** The **Implied Author's** liability and the **Paratextual** contract.
  *   **Bends:** The distinction between **Diegetic** and **Non-diegetic**. This account claims there is no **Diegetic** safe harbor.
  *   **Residue:** This account cannot model the **Double Attribution** you suspect. It assumes the **Implied Author** is the sole responsible speaker. It fails to register that the **Actual Reader** is holding a book *by you* but reading a voice *of the street*. The residue marks an **Artifact of the Philosophers' Assumption**: they assume a single intending speaker. In your novel, the intention is split between the **Character's** necessity and the **Author's** design. Your vocabulary splits them; this philosophy fuses them.

  **3. Expressive/Performative**
  *   **Translates Cleanly:** The idea of **Mimesis** as action.
  *   **Bends:** **Dramatic Irony**. Irony requires a gap between what is said and what is meant. This account says the saying *is* the meaning.
  *   **Residue:** This is where your suspicion of the **Misfired Speech Act** is most visible. Craft vocabulary assumes that if the **Context** is clear (fiction), the act is "hollowed out" (made safe). This theory says the act "goes through" despite the frame. Your vocabulary has no term for a **Successful Performance** that is simultaneously a **Failed Fiction**. You have "Unreliable," but that implies a lie, not a wound. The residue is a **Genuine Vagueness in the Position**: it cannot distinguish between a hate crime and a novel about a hate crime without condemning the latter as the former.

  **4. Pragmatic Inference**
  *   **Translates Cleanly:** **Psychic Distance**, **Focalization**, and the **Actual Reader's** role in constructing meaning.
  *   **Bends:** The **Choral We**. Pragmatics usually requires a specific speaker to infer intent from. A "street" is an abstraction.
  *   **Residue:** This account dissolves the **Double Attribution** problem by making the **Reader** the arbiter. If the Reader infers *your* intent, you are guilty. If they infer the *Street's* intent, you are safe. The residue here is that it makes the harm entirely contingent on **Reader Effect**, which you asked me to avoid unless the theory demands it. This theory *does* demand it. The residue is that it offers no objective standard for the text itself, only a measurement of the **Reception**.

  ***

  ### III. Addressing Your Suspicions

  **1. The Speech Act That Goes Through But Misfires**
  Your suspicion is correct. Craft vocabulary lacks a register for this. We have "Unreliable Narration" (the narrator is wrong/lying) and "Breaking the Fourth Wall" (the fiction acknowledges itself). We do not have a term for "The Fiction Succeeds Aesthetically But Fails Ethically in the Real World."
  *   *Verdict:* This is a **Poverty in the Craft Vocabulary**. We treat ethical failure as an aesthetic failure (bad writing, heavy-handedness), not as a successful aesthetic act that causes external harm. The philosophers have a name for this (illocutionary misfire); we call it "controversy."

  **2. Double Attribution (Character + Implied Author)**
  None of the four accounts model this cleanly.
  *   *Encoded* ignores the author.
  *   *Prohibition* blames the author.
  *   *Expressive* blames the utterance (which implicates the author).
  *   *Pragmatic* asks the reader to choose.
  *   *Verdict:* This is an **Artifact of the Philosophers' Assumption**. They analyze sentences in isolation or speech acts between two real people. They do not have a robust equivalent for the **Implied Author** who is neither the biographical writer nor the narrator, but the textual agency responsible for the arrangement. Your vocabulary is *superior* here for describing the mechanism, but *weaker* for assigning the liability.

  **3. Cumulative Derogation vs. Singular Utterance**
  Your defense relies on the **Arc** (the word changes meaning from Chapter 1 to the Final Chapter). The philosophical accounts generally treat the slur as a monolith.
  *   *Verdict:* This is a **Genuine Vagueness in the Position** (specifically Accounts 1, 2, and 3). They treat the word as a static unit. Account 4 (Pragmatic) allows for context, but usually immediate context, not a 300-page **Character Arc**. Your vocabulary handles the *time* of reading; theirs handles the *logic* of the sentence.

  ***

  ### IV. Does Any Account Dissolve the Disagreement?

  **Account 4 (Pragmatic Inference)** comes closest to dissolving the disagreement, though it does not resolve it.

  It dissolves the *binary* of your Editor vs. your Reader.
  *   Your Editor argues from **Diegesis** (the book reports the street).
  *   Your Reader argues from **Effect** (the word lands on her).
  *   Account 4 says: *Both are true, depending on the inference.*

  If the **Actual Reader** infers the **Implied Author** is using the word to replicate the **Register** of 1968 Barrow's Mill (a **Diegetic** choice), the Editor is right: it is exhibited. If the **Actual Reader** infers the **Implied Author** is using the word to provoke or because they lacked the **Ventriloquism** to find another way (a **Non-diegetic** choice), the Reader is right: it is a pass the book wrote for itself.

  This account shifts the burden from the *text* to the *inference*. It suggests the dispute is not about the word's presence, but about whether your **Craft** (your **Psychic Distance**, your **FID**, your **Choral** construction) successfully signals the **Diegetic** necessity strongly enough to override the **Pragmatic** inference of contempt.

  However, it fails to dissolve the dispute if one accepts Account 3 (Expressive). If the word *is* the act of contempt, then the inference doesn't matter; the act occurred. But if you accept Account 4, the disagreement between your Editor and your Reader is not a factual dispute about the book, but a report on two different **Readings**. One reader successfully maintained the **Fictional Addressee** frame; the other collapsed the **Psychic Distance**.

  **Recommendation on the Residue:**
  Your craft vocabulary is equipped to manage the *risk* (via **Distance**, **Irony**, **Arc**), but not to guarantee the *safety*. The philosophers are arguing about the guarantee. The residue tells you that no amount of **Technical Mastery** can force the **Pragmatic Inference**. You can build the **Diegetic** frame perfectly, and the **Actual Reader** may still reject the **Contract**. That is not a failure of **Craft**, but a limit of the **Medium**.
