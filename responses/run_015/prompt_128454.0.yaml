prompt: |-
  My friend has an arguemnt about Goodhart and rationality that seems to show rational decision theory is impossible, and I cant find the crack. (1) Any normative theory of choice has to specify what counts as good reasoning, otherwise it's just "trust your gut." (2) Once you specify a criterion — expected utility, coherence, whatever — that criterion becomes a measurable proxy for rationality. (3) Goodhart's law says that once a proxy becomes a target, people (or training processes, or evolutionary selection) will adapt to maximize the proxy instead of the real thing. (4) So any explicit decision rule will eventually be satisfied by choices that score high on the rule but are actually terrible decisions — that's just specifcation gaming applied to reasoning itself. (5) Therefore any theory we can actually write down will eventually license irrational choices. (6) But if a theory licenses irrational choices, it's not a theory of rationality. (7) So there can't be a correct, specifiable theory of rational choice. He wants to keep (1) and (3) and is willing to ditch (6) if he has to, but that feels like giving up the point of the project. Which step is the weak link? Is there an equivocation between "optimizing a reward signal" and "following a decision rule"? Or is the argument basically right and rational choice theory really is self-undermining?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Issue:** The user's friend has an argument claiming that rational decision theory is impossible due to Goodhart's Law.
      *   **The Argument Structure:**
          1.  Normative theory needs explicit criteria (not just "gut").
          2.  Criteria become measurable proxies.
          3.  Goodhart's Law: Proxies become targets $\rightarrow$ optimization of proxy $\neq$ optimization of true goal.
          4.  Explicit rules will be "gamed" (high score, bad decision).
          5.  Therefore, specifiable theories license irrational choices.
          6.  If a theory licenses irrational choices, it's not a theory of rationality.
          7.  Conclusion: No correct, specifiable theory of rational choice exists.
      *   **Friend's Stance:** Keeps (1) and (3), willing to ditch (6) (but feels it undermines the project).
      *   **User's Question:** Which step is the weak link? Is there an equivocation? Is the argument right?

  2.  **Deconstruct the Argument (Step-by-Step Evaluation):**

      *   *(1) Normative theory needs explicit criteria.* Plausible. If it's not specifiable, how do we evaluate it? But "explicit" doesn't necessarily mean "simple metric."
      *   *(2) Criteria become measurable proxies.* **Suspicious.** This is the first potential crack. Does a normative criterion *have* to be a "measurable proxy" in the Goodhart sense? Expected Utility (EU) isn't just a proxy; it's a definition of the goal structure under uncertainty.
      *   *(3) Goodhart's Law.* True in empirical/feedback loop contexts (economics, ML, evolution). But does it apply to *normative logic*? Goodhart applies when there's a divergence between the *measure* and the *underlying causal mechanism*. In decision theory, the "measure" (e.g., coherence) is often constitutive of rationality, not just correlated with it.
      *   *(4) Explicit rules will be satisfied by terrible decisions.* This assumes "gaming" is possible. Can you "game" coherence? Can you "game" logical consistency? If the rule is "maximize expected utility given true beliefs," can you game that? Only by lying to yourself about beliefs or utilities, but then you aren't following the rule correctly.
      *   *(5) Therefore, any theory... will license irrational choices.* Follows from (4).
      *   *(6) If a theory licenses irrational choices, it's not a theory of rationality.* This is a definitional claim.
      *   *(7) Conclusion.*

  3.  **Identify the Core Philosophical Errors:**

      *   **Category Error (Normative vs. Descriptive):** Goodhart's Law is a *descriptive* claim about how agents behave in the world when incentivized. Decision theory is a *normative* claim about what constitutes correct reasoning. Goodhart applies to *metrics of performance*, not necessarily to *definitions of correctness*.
      *   **Constitutive vs. Correlative:** In Goodhart scenarios (e.g., GDP measuring welfare), GDP is *correlated* with welfare but not *constitutive* of it. In Decision Theory (e.g., Dutch Book arguments), coherence *is* what rationality consists in. You can't "game" coherence without ceasing to be coherent.
      *   **The "Target" Confusion:** Goodhart requires a principal-agent problem or an optimization process blind to the true goal. In individual rationality, the agent *is* the optimizer. If they optimize the proxy instead of the true goal, they are by definition being irrational according to the theory. The theory doesn't "license" it; the agent violates the theory.
      *   **Step (2) is the Weakest:** A criterion of rationality (like Bayesian coherence) is not a "proxy." It is the *definition*.

  4.  **Drafting the Response:**

      *   **Validate:** Acknowledge it's a clever argument (it sounds like a variation of the "Lucas Critique" or issues in AI alignment).
      *   **Pinpoint the Weak Link:** Step (2) and the application of Goodhart in Step (3).
      *   **Explain the Distinction:**
          *   *Goodhart Context:* Metric $M$ correlates with Goal $G$. Optimize $M$, $G$ breaks.
          *   *Decision Theory Context:* Rule $R$ *defines* Rationality $Q$. There is no gap between $R$ and $Q$.
      *   **Address the "Gaming" Aspect:** You can't game a logical constraint. If you satisfy the Dutch Book criterion, you *are* probabilistically coherent. There's no "fake coherence."
      *   **Address Step (6):** If the friend ditches (6), they admit the theory is imperfect. But if they keep (2)/(3), they misunderstand the nature of normative theories.
      *   **Alternative Perspective:** Maybe the friend is confusing *bounded* rationality with *ideal* rationality. Goodhart applies to bounded agents optimizing proxies because they can't compute the true utility. Ideal decision theory assumes you *can* compute the true utility (or coherence).
      *   **AI Alignment Angle:** This argument is very popular in AI safety (specification gaming). It's valid there because the AI is an *external* optimizer being given a reward function. It's less valid for *human* normative reasoning where the "reward function" is internal to the reasoning process.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is there a deeper point?* What about "Rule Worship"? (Rule Utilitarianism vs. Act Utilitarianism). If you follow the rule blindly when it clearly leads to disaster, is that rational?
      *   *Response:* Decision theory (like EU) isn't a heuristic rule; it's a structural constraint. It says "Maximize EU." If a specific action maximizes EU, it's rational. If following a *heuristic* maximizes EU, do that. The theory encompasses the meta-reasoning.
      *   *The "Proxy" claim:* The friend claims EU is a proxy for "good decisions." But in decision theory, EU *defines* "good decision" (under uncertainty). The friend is assuming there is a "True Rationality" outside the theory that the theory is trying to measure. That's the real equivocation.

  6.  **Finalizing the Structure:**
      *   **Verdict:** The argument is seductive but flawed.
      *   **Main Crack:** Step (2). Equivocation between "Proxy" and "Definition."
      *   **Secondary Crack:** Step (3). Misapplication of Goodhart (Descriptive vs. Normative).
      *   **The "True Rationality" Trap:** The friend assumes a Platonic "Real Rationality" that exists independently of the theory.
      *   **AI Alignment Context:** Acknowledge where the friend is likely getting this (AI safety) and why it doesn't transfer perfectly to normative philosophy.
      *   **Conclusion:** Rational choice theory isn't self-underundermining; it's defining the terrain.

  7.  **Polishing the Tone:** Keep it philosophical but accessible. Use the "Dutch Book" example as it's the strongest counter to "gaming."

      *(Self-Correction during drafting)*: Make sure to address the friend's willingness to ditch (6). If they ditch (6), they admit we can have a theory that sometimes fails. But the conclusion (7) says "No correct theory." If (6) is false, (7) doesn't follow. So (6) is actually crucial for the conclusion, even if they are willing to drop it. But the *real* error is earlier. I should focus on (2).

      *Revised Plan:*
      1. Identify the Category Error (Normative vs. Empirical).
      2. Attack Step (2) (Constitutive vs. Correlative).
      3. Attack Step (3) (Goodhart requires a gap that doesn't exist in logic).
      4. Discuss the "Platonic Rationality" assumption.
      5. Address the AI alignment parallel.

  8.  **Final Polish:** Ensure the distinction between *optimizing a score* and *satisfying a constraint* is clear. Goodhart applies to scores. Decision theory is often about constraints (coherence).

      *(Wait, one more thing)*: What about "Cluelessness" or "Unknown Unknowns"? If the model of the world is wrong, EU maximization leads to bad outcomes. Is that "gaming"? No, that's just error. Goodhart is about *systematic* divergence due to optimization pressure. Error isn't Goodhart.

