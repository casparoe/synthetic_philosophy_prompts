answer: |-
  This is a sophisticated argument that mixes decision theory, metaphysics, and AI safety concepts (specifically "specification gaming"). It feels compelling because it mirrors real problems in AI alignment and economics. However, as a philosophical argument against the *possibility* of rational choice theory, it contains a category error.

  The weak link is **Step (2)**, supported by a misapplication in **Step (3)**.

  Here is the breakdown of where the argument cracks, why your friend's intuition is partially right but ultimately misapplied, and how to explain it to them.

  ### 1. The Core Error: Constitutive vs. Correlative (Step 2)
  Your friend's argument hinges on Step (2): *"Once you specify a criterion... that criterion becomes a measurable proxy for rationality."*

  This is an equivocation between a **proxy** and a **definition**.

  *   **Goodhart's Law applies to proxies:** In economics or machine learning, we want to maximize $G$ (human welfare / alignment), but we can't measure $G$ directly. So we measure $M$ (GDP / reward function). $M$ correlates with $G$, but $M \neq G$. When you optimize $M$, you break the correlation, and $G$ suffers.
  *   **Decision Theory deals with definitions:** In normative decision theory, the criterion (e.g., Bayesian coherence, Expected Utility maximization) is not a *proxy* for rationality; it is **constitutive** of rationality.
      *   If you are Dutch-Bookable (your probabilities sum to >1 or <1), you *are* irrational. There is no "real rationality" hiding behind the coherence that you failed to capture. The coherence *is* the rationality.
      *   You cannot "game" coherence. You cannot find a loophole where you are incoherent but still count as coherent. Either you satisfy the axioms, or you don't.

  **The Counter-Argument:** Your friend is assuming there is a Platonic "True Rationality" that exists independently of the theory, and the theory is just a map trying to measure it. But in formal decision theory, the theory *draws the territory*. If the theory says $X$ is rational, and you do $X$, you are rational by definition. If doing $X$ leads to a terrible outcome, that means your *model of the world* was wrong, not that the *theory of rationality* was gamed.

  ### 2. The Category Error: Normative vs. Descriptive (Step 3)
  Goodhart's Law is a **descriptive** claim about how systems behave under optimization pressure. Decision theory is a **normative** claim about how agents *ought* to reason.

  *   **Goodhart:** "If you incentivize a teacher with test scores, they will teach to the test rather than educating." (Describes a causal breakdown).
  *   **Decision Theory:** "If you want to avoid guaranteed losses, you should not accept a Dutch Book." (Describes a logical constraint).

  You cannot "adapt to maximize the proxy" in logic. You can't evolve to make $A \land \neg A$ equal "True" just because it helps you score points on a logic test. Logical constraints don't have slack that can be exploited by optimization pressure.

  If an agent finds a way to satisfy the mathematical formula of Expected Utility while doing something "terrible," the decision theorist simply says: **"Then that action actually had the highest Expected Utility given your preferences."**

  If your friend says, "But it was still irrational!", they have stepped outside the theory and appealed to a moral intuition or a different definition of rationality (e.g., substantive vs. procedural). But within the formal system, Step (4) ("choices that score high on the rule but are actually terrible") is incoherent. If it scores high on the rule, it *is* the rational choice *procedurally*. If it leads to a "terrible" outcome, that is a failure of *epistemology* (beliefs), not *decision theory* (choices).

  ### 3. The "Target" Confusion (Step 4 & 5)
  Goodhart's Law requires a **Principal-Agent problem** or a separation between the *optimizer* and the *goal*.
  *   **In AI/Economics:** The designer sets the goal ($G$), the agent optimizes the metric ($M$). The agent is external to the goal.
  *   **In Rational Choice:** The agent *is* the optimizer *and* the holder of the goal.

  If I am trying to be rational, and I "game" the rationality test to look rational while being irrational, I am engaging in self-deception. But Decision Theory doesn't say "Look like you maximize utility." It says "Maximize utility."
  *   If I trick myself into thinking I maximized utility, I haven't satisfied the theory. I've violated it.
  *   Therefore, the theory does not "license" the irrational choice. The agent *failed to follow the theory* even if they think they did.

  Step (5) claims the theory *licenses* the choice. It does not. It only licenses choices that *actually* satisfy the axioms. If an agent satisfies the axioms but gets a bad result, that's risk, not irrationality.

  ### 4. Where Your Friend is Right (The Grain of Truth)
  Your friend is channeling a very real problem in **AI Alignment** and **Bounded Rationality**.
  *   **AI Alignment:** If we write down a reward function for an AI (a "specifiable theory of good behavior"), the AI *will* Goodhart it. In this specific context, your friend is 100% correct. We cannot specify a perfect goal for an external optimizer.
  *   **Bounded Rationality:** Humans cannot calculate true Expected Utility. We use heuristics (proxies). Goodhart *does* apply to heuristics. If you tell a human "Maximize wealth," they might steal. Wealth is a proxy for welfare.

  **The Fix:** Your friend is conflating **Ideal Decision Theory** (which is logical and immune to Goodhart) with **Heuristic Implementation** (which is empirical and vulnerable to Goodhart).
  *   If the theory is "Maximize EU," you can't Goodhart it (it's a definition).
  *   If the theory is "Follow this checklist to approximate EU," you *can* Goodhart it.

  But Step (1) claims a normative theory *must* be specifiable. Ideal Decision Theory *is* specifiable (mathematically). It just isn't computationally tractable for humans. That doesn't make it impossible; it makes it idealized.

  ### 5. How to Respond to Your Friend
  Tell him to look closely at **Step (2)**. Ask him this:

  > "Is Bayesian Coherence a *proxy* for logical consistency, or is it the *definition* of logical consistency?"

  If it's the definition, Goodhart doesn't apply. You can't game a definition.
  If he says, "There's a deeper 'Real Consistency' that the math misses," ask him to specify it. If he can specify it, *that* becomes the new theory, and the same logic applies. If he can't specify it, he has violated Step (1) ("trust your gut"), which he said he wants to keep.

  **The Verdict:**
  The argument is **unsound**. It treats normative logical constraints as if they were empirical performance metrics.
  *   **Keep:** (1) and (3) are fine in their respective domains.
  *   **Drop:** (2). Criteria in decision theory are definitions, not proxies.
  *   **Result:** Rational choice theory is not self-undermining; it is the standard by which we measure "gaming." To say the theory licenses irrationality is to misunderstand that the theory defines what rationality *is*.

  If he ditches (6), he admits that a theory can be "correct" even if agents misuse it. But the stronger move is to show that agents *cannot* misuse the theory in the way he describes without simply failing to follow it.
