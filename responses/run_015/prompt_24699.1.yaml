      *   *Round 2 (A Posteriori Fix):* PoM recovers ground. This is the "Kripkean move." But Logician is right that this isolates *epistemic* possibility. PoM conflates the two or assumes a bridge.
      *   *Round 3 (The Bridge/Question Begging):* This is the kill shot. Logician is right that the argument risks circularity. PoM is right that the *intuition* of the gap is the data point.
