  8.  (Final Review of the "Logician's" argument): The Logician's claim that "holding fixed a posteriori knowledge" turns conceivability into epistemic possibility is technically accurate. The PoM's reply that the epistemic gap *is* the point is the standard Chalmers defense (the "Modal Argument"). The Logician's rebuttal that this assumes the conclusion (that consciousness isn't a posteriori necessary) is the standard "Type-A Physicalist" or "A posteriori Physicalist" rebuttal. Okay, the mapping is solid.

