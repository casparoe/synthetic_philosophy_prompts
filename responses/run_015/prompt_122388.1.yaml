  2. If psychology is evidentiary, could identical psychological profiles have produced mirror-image politics due to historical accident? If yes, psychology debunks both sides, forcing the awkward commitment that their own convictions are accidental artifacts of party branding; if no, psychology tracks truth but you must ask if the origin of that track matters.
  3. If psychology tracks truth, does knowing the profile is heritable and frame-sensitive undermine its justification? If yes, psychology debunks both sides again; if no, psychology validates the profile but you must decide if scope counts, requiring the awkward commitment to treat gut feelings as reliable data points despite their biological arbitrariness.
  4. If profiles validate, is having a wider scope of concern a reason to think a position is truer or just more output from the same machinery? If truer, universalism wins, though the winner must explain why caring about more things makes you less wrong about the things you ignore; if just output, all valid profiles are equally right.
  5. The tree permits a cell where facts matter but psychology validates them, which is incoherent, and leaves the "debunks both" outcomes from contingency versus heritability indistinguishable. The speechwriter would say, "If the machinery is the same, only the output matters, and my output gets elected."
