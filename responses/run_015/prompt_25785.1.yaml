  2.  **Deconstruct Susan Wolf's "Moral Saints":**
      *   *Thesis:* A moral saint is someone who is as morally good as possible.
      *   *Problem:* If you maximize moral goodness, you have to sacrifice non-moral virtues (humor, aesthetics, personal projects) because resources (time, energy, attention) are finite.
      *   *Result:* Moral saints are boring, one-dimensional, or lacking in "humanity."
      *   *Distinction:* Loving Saint (enjoys being moral) vs. Rational Saint (does it out of duty). Wolf worries about both, but especially the Rational Saint's lack of personal flavor.

  3.  **Deconstruct *Middlemarch* (specifically Dorothea):**
