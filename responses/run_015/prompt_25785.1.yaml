      *   *Section 1: Dorothea as Wolf's Nightmare (The Case for Wolf).* Focus on the Casaubon marriage. The suppression of self. The "Loving Saint" vs. "Rational Saint" distinction (Dorothea tries to be a Rational Saint but thinks she's a Loving Saint).
      *   *Section 2: Eliot's Pushback (The Case against Wolf).* The evolution of Dorothea. Will Ladislaw as the catalyst for non-moral goods (art, passion). The redefinition of "greatness."
      *   *Section 3: The Finale.* The "unhistoric acts." Is this sainthood? It's a *secular* sainthood. It validates the "boring" life Wolf dismisses, but gives it moral weight.
      *   *Section 4: What Eliot Adds.* Temporality, Social Embeddedness, The danger of Abstraction.
