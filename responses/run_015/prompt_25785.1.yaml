      *   *Marriage to Casaubon:* Motivated by a desire to be useful/help a "great mind." Turns out to be a mistake. Is this moral self-deception?
      *   *Relationship with Will Ladislaw:* Passionate, aesthetic, political. Is this a non-moral good that saves her?
      *   *Ending:* "Hidden life," "unvisited tombs." Is this a validation of the saintly life or a consolation prize?
      *   *Contrast:* Rosamond Vincy (purely aesthetic/social, no moral depth) vs. Dorothea.

  4.  **Synthesize: Wolf meets Eliot:**

      *   *Point of Agreement (Wolf is right):* Dorothea's early obsession with "duty" and "greatness" *does* flatten her. Her marriage to Casaubon is the prime example. She suppresses her own needs and aesthetic sensibilities to serve a "higher purpose," but that purpose is hollow. She becomes rigid, judgmental, and unhappy. This aligns with Wolf's fear that moral sainthood crowds out personal flourishing.
      *   *Point of Disagreement/Nuance (Eliot pushes back):* Wolf assumes a zero-sum game (moral vs. non-moral). Eliot suggests integration. Dorothea's "sainthood" evolves. She doesn't stay the dry, duty-bound ascetic of Volume 1. Through Will, she engages with art, politics, and love. Her "goodness" isn't just self-sacrifice; it's empathetic connection.
      *   *The Ending:* Wolf might see the "hidden life" as a failure to achieve greatness. Eliot frames it as the *true* form of goodness. It's not about being a "Saint" in the heroic sense (Theresa), but about the "growing good of the world." This redefines sainthood away from Wolf's "maximizing" definition toward a "relational" definition.
      *   *What Eliot Adds:* Wolf is analytic/abstract. Eliot is narrative/temporal. Eliot shows *how* a moral life develops over time. Wolf worries about the *state* of being a saint; Eliot worries about the *process* of living well. Eliot introduces the social web (the "roaring river") which Wolf ignores. Wolf focuses on the individual agent; Eliot focuses on the individual within a community.

  5.  **Drafting the Response (Iterative Process):**

