  I'm a compliance officer at a mid-size software company and we get asked to screen proposed policies and product decisions for ethical red flags before they go to the exec team. I've been leaning on Kant's universalizability test as a backstop but I'm running it the lazy way, just "could everyone do this?", and I know thats not what the test actually is. Can you turn the real test into a procedure my team can actually run? I need it to capture the two-tier structure (the contradiction-in-conception test vs the contradiction-in-the-will test) and, most importantly, to handle the maxim-formulation problem, because I've noticed the whole thing collapses if you write the maxim too narrow or too broad. Give me the steps in order, what counts as a pass or fail at each tier, where the procedure stops and hands the call to a human because it's a judgment I have to own, and be honest about where it'll misfire. Then run it on three cases: (1) a policy of making vague but technically true performance claims in marketing, (2) a policy of never disclosing a known but minor defect to a customer who is unlikely to notice it, and (3) a policy of lying to a customer to stop them from making a purchase they'd regret, which is the one where your answer is going to annoy me. I get maybe twenty minutes per case, I'm not a philosopher, and I have to sign off, so flag every step that's really a a judgment call dressed up as procedure.

  Format: I want it in this order — "The procedure" (the steps, ~300 words), "The two tiers" (~200 words), "Where judgment can't be eliminated" (~150 words), "Worked cases" (all three, ~400 words), "Where this misfires" (~150 words).
