  ### VI. Further Piece and Reconstruction Test

  **Piece:** **Steve Reich, *Music for 18 Musicians* (1976)**
  *   **Description:** A work based on cyclical patterns, pulsing rhythms, and slow harmonic shifts that avoid traditional teleological development. There is no "goal," no dramatic climax, and no final tonic resolution in the traditional sense; it simply stops.
  *   **Target Reconstruction:** **Reconstruction 2 (The Dynamic of Striving).**
  *   **Why:** R2 predicts that music must enact the narrative of Desire -> Satisfaction -> New Desire. Reich's music is static, process-based, and non-teleological. It lacks the "striving" of the melody (Verdict 2) and the "satisfaction" of the tonic (Verdict 5).
  *   **Predicted Answers:**
      *   **On R1 (Hierarchy):** Disapprove. The texture is homogenous; there is no clear distinction between "inorganic bass" and "human melody."
      *   **On R2 (Striving):** Disapprove. There is no narrative of willful striving, only mechanical process. It fails Verdict 5 (image of attainment and new want).
      *   **On R3 (Freedom from Phenomena):** Approve. It imitates no battles or storms. It is pure structure.
  *   **Schopenhauer's Actual Verdict:** **Disapprove.** He would likely view it as "empty" or "mechanical." Without the narrative of human striving (melody) and the tension/release of tonal harmony, it fails to disclose the "innermost nature of the world" (Verdict 8). It is a copy of a machine, not a copy of the Will. This confirms R2 is the dominant rule: Music must be *dramatic* in the metaphysical sense, not just formal.
