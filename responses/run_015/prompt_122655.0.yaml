answer: |-
  **Case Name:** The Master's Cut

  **The Case**
  Mara is a master machinist finishing a custom titanium manifold; the stock material costs $15,000 and cannot be replaced in time for the client's deadline. During the final pass, she hears a specific micro-vibration in the lathe's hum that she has learned over twenty years signals a hairline fracture in the tool bit, invisible to the naked eye. She knows immediately the tool will shatter in ten seconds and ruin the part. She shouts to her apprentice, "Stop the feed and change the insert!" If she hedges ("I think you should stop" or "It sounds off to me"), the apprentice—trained to prioritize continuous cuts unless given a definitive halt order—will hesitate long enough for the tool to fail. If asked *how* she knows, Mara cannot articulate the acoustic signature; she lacks the physics vocabulary to explain the frequency shift and cannot stop to run a diagnostic without guaranteeing the part is lost. She possesses reliable, truth-tracking expertise, but zero discursive access to the justification.

  ***

  **1. Normative Verdicts**

  *   **Knowledge Norm (K):** **Permissible.** Mara satisfies the reliabilist conditions for knowledge: she believes the tool is failing, it is true that the tool is failing, and her belief is produced by a highly reliable cognitive skill calibrated over two decades. Since she knows, K licenses the flat-out assertion.
  *   **Truth Norm (T):** **Permissible.** The proposition "Change the insert" implies the tool is compromised. Since the tool is indeed compromised, the assertion aligns with the truth, satisfying T.
  *   **Belief Norm (B):** **Permissible.** Mara genuinely believes the tool is failing based on her perception. She is not lying or guessing; she holds the belief required by B.
  *   **Reasons Norm (R):** **Impermissible.** R requires the asserter to possess adequate evidence *that they could actually give if asked*. Mara's evidence is a non-propositional skill state (auditory recognition) she cannot translate into reasons for the apprentice. Because she cannot discharge the justificatory demand if challenged, R forbids the flat-out assertion.

  **2. The Load-Bearing Feature**
  The load-bearing feature is the **dissociation between reliable discrimination and articulable justification**.
  *   **Remove Reliability:** If Mara's skill was uncalibrated (she was just guessing), she wouldn't *know*. K would then forbid the assertion, and the case would no longer favor K over R; both would likely condemn the assertion as reckless.
  *   **Remove Inarticulacy:** If Mara could explain the physics ("The frequency shifted 20Hz, indicating stress"), she would possess discursive evidence she could give. R would then permit the assertion, collapsing the distinction between K and R and defeating the purpose of the counterexample.

  **3. The Strongest R-Reply and Counter-Reply**
  *   **R-Reply (The Challenge Rule):** "Assertion is a social practice that invites challenges. By asserting flat-out, Mara entitles the apprentice to rely on her word and demand reasons. If she cannot meet that challenge, she has violated the normative structure of communication, regardless of her private reliability. She should have used a directive ('Stop the machine!') rather than an assertion ('Change the insert')."
  *   **Counter-Reply:** "In high-stakes expertise, the function of assertion is often to trigger immediate action, not to open a dialectical debate. Distinguishing 'directives' from 'assertions' here is pedantic; the apprentice treats 'Change the insert' as a knowledge-claim that authorizes action. If R forbids the only linguistic move that saves the $15,000 part, R is detached from the practical norms of the workshop. K correctly identifies that her entitlement to speak derives from her competence, not her ability to teach that competence in the moment."

  **4. Honest Flagging of Stipulations**
  *   **The Definition of "Evidence" in R:** I have stipulated that R requires *discursive* or *transferable* evidence. A proponent of R might argue that Mara's auditory experience *is* evidence she "has," even if she can't explain it. I am assuming R requires the ability to *give* the reason (the "if asked" clause), not just possess it privately. Your tutor may press on whether "I hear it" counts as giving a reason.
  *   **The Uselessness of Hedging:** I have stipulated that the apprentice's training makes hedging functionally equivalent to silence. In reality, a very cautious apprentice might stop on a hedge. The case relies on the specific institutional constraint that hesitation equals failure.

  ***

  **Presentation Tip:** When presenting, emphasize that **K respects the expertise**, while **R respects the audit**. In a crisis, we need the expertise, not the audit trail.
