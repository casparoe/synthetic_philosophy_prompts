      *   Trick: Consider the proposition $p \land \neg K p$ (p is true but unknown).
      *   If knowable, someone could know $p \land \neg K p$.
      *   Knowing a conjunction implies knowing conjuncts ($K(A \land B) \rightarrow KA \land KB$).
      *   So someone knows $p$ and knows $\neg K p$.
      *   Knowing implies truth ($K p \rightarrow p$).
      *   So $p$ is true and someone knows $p$ is unknown. Contradiction.
      *   Therefore, $p \land \neg K p$ is unknowable.
      *   If all truths are knowable, $p \land \neg K p$ cannot be true.
