answer: |-
  **Setup & Materials**
  Fourteen envelopes (ten containing coin-flip results, four logical truths), fourteen corresponding claim cards, one coin, whiteboard.
  **Roles:** *Inspector* (verifies claims), *Cartographer* (logs known truths on board), *Archivist* (holds envelopes), eleven *Inquirers*.
  **Charter:** "If any claim is true, it is possible for the Inspector to verify it."
  **Rules of Inference:**
  1.  **Verification:** To verify a claim, the Inspector must check the corresponding envelope.
  2.  **Logging:** Verified claims are written on the board as "Known."
  3.  **Conjunction:** If "A and B" is verified, both A and B are logged as Known.
  4.  **Fact:** If a claim is Known, it is true.

  **Timeline**
  **0–15 min: Setup.** Assign roles. Inquirers draw cards. One special card reads: "The coin is Heads AND this card is unverified." Place coins in envelopes.
  **15–45 min: Round 1 (Unrestricted).** Inquirers submit cards. Inspector verifies; Cartographer logs. When the special card is submitted, the Inspector attempts verification. Checking the coin confirms "Heads," but the act of checking makes "this card is unverified" false. Verification fails.
  *The Collapse:* The Charter says if true, it *can* be verified. Since it cannot be verified without contradiction, it cannot be true. Therefore, no true claim is unverified. The class realizes the Charter implies *every* truth is already known (Omniscience).
  **45–60 min: Round 2 (Restricted).** Amend Charter: "If a claim is true and *verification-stable*, the Inspector can verify it." Play resumes. The special card is rejected as unstable. Paradox avoided, but knowability is no longer universal.
  **60–90 min: Debrief.**

  **Debrief**
  Map gameplay to logic. Charter = Knowability Principle ($p \rightarrow \Diamond Kp$). Verification = Knowledge ($K$). Special Card = $p \land \neg Kp$. Rule 3 = Distribution ($K(A \land B) \rightarrow KA \land KB$). Rule 4 = Factivity ($Kp \rightarrow p$).
  The contradiction forces $\neg(p \land \neg Kp)$, implying $p \rightarrow Kp$.
  **Two Replies:**
  1.  **Restrict the Principle:** (Round 2). Truth depends on verifyability (Anti-realism). *Cost:* Abandonment of verification-independent truth.
  2.  **Concede Omniscience:** An omniscient knower knows $p \land \neg Kp$ without *checking* (violates Rule 1). *Cost:* Theology/Modal collapse.
  **Name:** Fitch's Knowability Paradox.

  **Predictable Failures**
  Students will dismiss the special card as a Liar paradox (logically false by definition). **Handle:** Emphasize the coin flip is contingent. It *could* be heads. The paradox is that *if* it is heads, the Charter forces it to be known. The CS auditors will formalize immediately; give them scratch paper to map rules to symbols, but insist they argue in English during play.
  **Limitations**
  The game models "possible to verify" as "Inspector tries to verify now." You must explain on the board that the actual argument relies on *modal logic*: there exists a *possible world* where verification occurs. In that world, the contradiction arises, proving the proposition is false in *all* worlds. The game collapses possibility into actuality for playability; you must restore the modal distinction in the debrief.
