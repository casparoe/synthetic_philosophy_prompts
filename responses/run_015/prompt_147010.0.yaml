prompt: |-
  You're a professional philosopher who works on both epistemology and aesthetics — I want you to actually think this through carefully, do a bit of brainstorming before you commit to anything, and don't hedge every claim equally. Take your time. No bibliography, no citations, no "the literature is divided" mush: I want your own map of the position's exposure.

  Here's where I've ended up on aesthetic testimony. Call it the calibration view (I made the name up, so don't go looking for it). The pessimists in this area say something like: you can't come to know that a work is beautiful, or moving, or clumsy, just on someones say-so — aesthetic judgement has to be grounded in your own first-hand experience of the thing. The optimists say testimony works here more or less like it does anywhere else. I think both are slightly off, and heres my version:

  (i) A piece of aesthetic testimony gives the hearer knowledge only if the hearer has already calibrated that testifier in that narrow domain — that is, has enough first-hand experience of other works this same critic also judged to have learned the mapping from her verdicts to what she's going to experience herself.
  (ii) Calibration itself requires first-hand acquaintance, and it doesn't transfer much across domains or across critics. So acquaintance is ineliminable, but not in the way the acquaintance-principle crowd thinks: it's not that every aesthetic judgement needs its own bit of experience behind it, it's that the chain of trust does. On this view a trusted critic is a labour-saving device for people who already know their way around, not a route in for a novice. Novices who take the tip get, at best, true belief plus a good pointer about where to look.

  I like it because it explains why deference to critics feels fine among people who share a lot of history and creepy among people who don't, and why "trust me, it's great" from a stranger is worthless while the same sentence from a friend whose taste you've triangulated over a decade is not.

  Now tell me what would count against it. Specifically:

  - Give me the defeaters ranked from fatal to merely annoying, and separate the ones a committed calibration theorist should concede from the ones she'd rightly dismiss as question-begging. I want to know what the view risks, not just what its critics shout.
  - Here's what's been bugging me. Take a work nobody can any longer experience — a mural destroyed in a fire, a film with no surviving prints, a building that was demolished — where the only route to a verdict about it is testimony and descriptions. We do seem to know things there, and the view says we don't. Is that a real defeater or does it just show the view has a cost I should swallow?
  - Similarly: professionals who act on other people's aesthetic judgements and get it right — festival programmers buying on a scout's report, editors, casting directors, sound mixers working to a producer's description. Does the view have to say they're flying blind, and if so is that unacceptable or fine?
  - There's an inverted-critic case I keep circling: someone whose actual responses are systematically offset from mine (she loves everything I find cloying) but reliably offset, so that once I learn the transformation I can use her perfectly. If my view can absorb that by allowing "offset calibration," doesn't it stop being a view about the aesthetic and collapse into a general theory of testimony plus a claim that aesthetic domains are unusually hard to calibrate? Is that collapse a defeater or a friendly reduction?
  - And a case the view probably wasn't built for: a recommender system with no experiences whatsoever that predicts your aesthetic responses better than any human critic whose acquaintance you've ever calibrated against. If deferring to it gets you what looks like aesthetic knowledge, what happens to a view that puts acquaintance at the centre? Does the black-box case show the view is really about reliability-tracking, or does it show the case isn't aesthetic testimony at all?
  - What does the view predict that its rivals don't, observationally? I'd guess something like: predictive accuracy of testimonial aesthetic belief should track calibration history rather than critical reputation; domains should be finely grained (calibrating a jazz critic shouldn't help you with her novel recommendations); novices leaning on expert consensus should be systematically worse off in a way that isn't just taste-differences. Say which of these are testable in a rough-and-ready way by someone with no lab, and which are armchair.
  - Honest assessment bit: I'm worried I've built a view where apparent counterexamples just get re-described as unrecognised calibration ("oh, you must have been more calibrated than you realised"). If that's what's happened, say so, and tell me whether that's a problem for a view of this kind — some insulation is legitimate, some is cheating, and I want to know which side I'm on.

  The thing I'd personally find most persuasive, if you want to weight your answer: cases where testimonial aesthetic belief successfully guides action in a domain where the agent has no acquaintance and can't get any. Also please flag any place where my two claims pull apart — where (i) survives but (ii) doesn't, or the other way round.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher (epistemology & aesthetics).
      *   **Task:** Critically evaluate the user's "Calibration View" of aesthetic testimony.
      *   **Constraints:** No bibliography/citations, no "literature is divided" hedging, take time to think, brainstorm before committing, rank defeaters (fatal to annoying), distinguish concessions from dismissals, address specific thought experiments (lost art, professionals, inverted critic, recommender systems), identify unique predictions, assess the risk of immunization against counterexamples, and weigh the "action without acquaintance" case heavily.
      *   **Tone:** Rigorous, direct, analytical, engaging with the substance rather than the history.

  2.  **Deconstruct the Calibration View:**
      *   **Core Claim (i):** Aesthetic testimony yields knowledge *only if* the hearer has calibrated the testifier in that narrow domain (mapping verdicts to own experience).
      *   **Core Claim (ii):** Calibration requires first-hand acquaintance. It doesn't transfer well across domains/critics. Acquaintance is ineliminable for the *chain of trust*, not necessarily every specific judgment.
      *   **Implication:** Trusted critics are labor-saving devices for the initiated, not routes in for novices. Novices get true belief + pointer, not knowledge.
      *   **Motivation:** Explains the social dynamics of aesthetic deference (fine among friends/shared history, creepy among strangers).

  3.  **Brainstorming Defeaters & Challenges:**

      *   *The "Lost Art" Case:* If a work is destroyed, no one can experience it. If the view says no knowledge is possible, but we intuitively think we *do* know (e.g., "The Colossus of Rhodes was impressive"), is this fatal?
          *   *Analysis:* The view says testimony gives *knowledge* only if calibrated. Calibration requires acquaintance with *other works* by the critic (or similar works). If the work is gone, can we be calibrated on the *critic* regarding *that type* of work? Yes. So maybe we know the critic is reliable about Greek Colossi, even if we can't see *this* one. But do we know *this* one is beautiful? The view says knowledge requires mapping verdicts to *what I would experience*. If I can't experience it, can I know it's beautiful?
          *   *Tension:* The view ties knowledge to the *hearer's potential experience*. If the object is gone, the potential experience is null. This looks like a fatal flaw if we accept historical aesthetic knowledge exists.
          *   *Counter:* Maybe we know *that it was judged beautiful by reliable people*, but not *that it is beautiful* simpliciter. The view might force an error theory about historical aesthetic knowledge. Is that a cost or a bullet to bite?

      *   *The "Professional" Case:* Programmers, editors, etc., act on reports without seeing the work. They succeed. Do they have knowledge?
          *   *Analysis:* They act successfully. Success usually implies knowledge (or at least reliable true belief). If they lack calibration (e.g., a new programmer trusting a senior scout), the view says no knowledge.
          *   *Tension:* If they don't have knowledge, how do they act so successfully? The view might say they have *instrumental* reliability but not *aesthetic* knowledge. They know "This will sell/work," not "This is good."
          *   *Risk:* Collapsing aesthetic value into pragmatic success.

      *   *The "Inverted Critic" Case:* Systematic offset. I hate what she loves, but reliably.
          *   *Analysis:* The view allows calibration. If I know her mapping (Her "Good" = My "Bad"), I can use her testimony.
          *   *Risk:* Does this reduce the view to general testimony? If calibration is just learning a translation key, what's special about the *aesthetic*?
          *   *Defense:* The "narrow domain" constraint saves it. Aesthetic domains are hyper-specific. But if the mechanism is just reliability-tracking, the "acquaintance" requirement looks like a proxy for reliability data gathering.

      *   *The "Recommender System" Case:* Algorithm predicts better than friends. No experience on its part.
          *   *Analysis:* The algorithm has no acquaintance. I have no acquaintance with the algorithm's "mind" (it has none). But I have acquaintance with its *outputs* vs. my reactions.
          *   *Risk:* If I trust the algo because it matches my past reactions, that *is* calibration. But the algo doesn't satisfy the "testifier must have experience" norm (if there is one). The view focuses on the *hearer's* calibration.
          *   *Problem:* If the algo works without *anyone* having seen the art (pure data correlation), does that break the "acquaintance is ineliminable" claim? The *hearer* still needs acquaintance with the *results*.

      *   *Immunization Risk:* "You think you weren't calibrated? You were implicitly calibrated."
          *   *Analysis:* This is a major methodological risk. If calibration can be unconscious or inferred from general cultural osmosis, the constraint becomes vacuous.
          *   *Verdict:* Needs a strict threshold for what counts as calibration to avoid this.

  4.  **Developing the Response Structure:**

      *   **Introduction:** Acknowledge the strength of the view (it captures the phenomenology of trust). State the overall assessment (robust but vulnerable to specific pressure points).
      *   **Section 1: The Defeater Ranking.**
          *   Fatal: The "Lost Art" / Historical Knowledge problem (attacks the necessity of *potential* experience).
          *   Serious: The Professional/Action problem (separates knowledge from successful action).
          *   Annoying/Manageable: The Inverted Critic (absorbable).
          *   Dismissible: General skepticism about testimony (question-begging).
      *   **Section 2: Addressing Specific Cases.**
          *   Lost Art: Bite the bullet or modify "experience" to include "imaginative reconstruction."
          *   Professionals: Distinguish *aesthetic* knowledge from *pragmatic* knowledge.
          *   Inverted Critic: Accept the reduction to reliability-tracking but keep the "narrow domain" constraint.
          *   Algorithms: This is the strongest challenge. It suggests acquaintance is about *data*, not *experience*.
      *   **Section 3: Predictions.**
          *   What makes this view unique? (Calibration history > Reputation).
          *   Testable vs. Armchair.
      *   **Section 4: The Immunization Worry.**
          *   Honest assessment of the "hidden calibration" risk.
      *   **Section 5: Separation of (i) and (ii).**
          *   Where they might come apart.
      *   **Conclusion:** Final verdict on the "Action without Acquaintance" weighting.

  5.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction on Lost Art:* Wait, the view says the *hearer* must be calibrated. Calibration requires acquaintance with *other works* the critic judged. It doesn't strictly require acquaintance with *the specific work*. So if a mural is destroyed, but I know the critic and I've seen their other judgments on murals, do I know the destroyed mural was good?
      *   *Refinement:* The view says testimony gives knowledge only if I map her verdicts to *what I'm going to experience*. If the work is destroyed, I *can't* experience it. So I can't complete the mapping. I can know *she believes it's good*, and I can know *she is reliable*, but can I know *it is good*? The definition of aesthetic knowledge usually implies a connection to the value property. If I can't experience the value, can I know it obtains? This is the weak spot. The view implies aesthetic properties are response-dependent *for the knower*. If the response is impossible, the knowledge is impossible.
      *   *Correction on Professionals:* If a programmer buys a film based on a report, and it wins awards, did they know it was good? Or did they know it was *award-worthy*? The view should insist they knew the latter. This is a strong defensive move but risks making "aesthetic knowledge" useless for the art world.
      *   *Correction on Algorithms:* If an algorithm predicts my taste without *any* human having seen the art (e.g., analyzing pixel distributions correlated with my past likes), then *no one* has acquaintance with the specific work. If I form a belief "This image is beautiful" based on the algo, and I'm right, do I have knowledge? The Calibration View says no, because I haven't calibrated the *domain* via acquaintance with the *works*. I've calibrated the *algo*. This suggests the view is actually about *source reliability* mediated by past experience, not *aesthetic acquaintance* per se. This is the "collapse" worry.

  6.  **Finalizing the Tone:**
      *   Ensure I'm not hedging. "This is fatal," "This is manageable."
      *   Keep it philosophical but grounded.
      *   Focus on the epistemic status of the belief.

  7.  **Drafting the Content (Mental Outline):**
      *   *Intro:* Strong view. Solves the "puzzle of aesthetic testimony" by making trust local and earned.
      *   *Defeaters:*
          1.  Fatal: The "Impossible Experience" case (Lost Art). If knowledge requires mapping to *my* experience, and experience is impossible, knowledge is impossible. But we claim historical knowledge.
          2.  Serious: The "Blind Action" case (Professionals). If they act successfully without calibration, they have *something* epistemically valuable. Calling it "mere true belief" feels like semantic gatekeeping.
          3.  Annoying: Inverted Critic. It works, but makes the view less about aesthetics and more about psychometrics.
      *   *Algorithm:* This is the real killer. If a black box works without *any* aesthetic experience in the loop (just data), and I trust it based on past data matches, I have knowledge without *aesthetic* calibration. This suggests (ii) is false.
      *   *Predictions:* Calibration history matters more than credentials. Domain specificity is high.
      *   *Immunization:* High risk. Need to define "calibration" strictly (conscious recognition of pattern vs. vague feeling).
      *   *Split:* (i) can survive without (ii). You can calibrate a source without *aesthetic* acquaintance (e.g. tracking success rates).

  8.  **Final Polish:** Check against constraints. No citations. No "some philosophers say." Direct engagement. Ensure the "Action without Acquaintance" point is weighted heavily as requested.

  *(Self-Correction during final review)*: I need to make sure I don't just say "The algorithm case is hard." I need to say what it *does* to the theory. It suggests the theory is actually a theory of *reliability tracking* disguised as *aesthetic acquaintance*. That's a significant theoretical shift. I also need to be careful about the "Lost Art" case. If I know the critic is reliable, and they say "X was beautiful," and X is gone... do I know "X was beautiful"? The Calibration View says I need to map their verdict to *my* experience. I can't. So I don't know. This implies aesthetic truths are inaccessible without potential access. That's a strong metaphysical claim. Is it fatal? Only if we think historical aesthetic knowledge is possible. I should frame it as a cost: you must deny historical aesthetic knowledge of the direct sort.

  Okay, ready to write.
answer: |-
  This is a robust position. You have effectively sidestepped the binary trap of the pessimist/optimist debate by relocating the normative constraint from the *object* (must see the thing) to the *source* (must know the teller). This captures the phenomenology of aesthetic trust much better than the Acquaintance Principle, which often feels too austere to explain how we actually navigate the art world.

  However, by making acquaintance the gateway to calibration, you have tied the epistemic status of the belief to the *hearer's capacity for experience*. This creates specific vulnerabilities. Here is the map of the position's exposure, ranked by severity.

  ### 1. The Defeaters: Ranked

  **Fatal: The "Impossible Experience" Defeater (Lost Art)**
  This is the strongest threat. Your view claims testimony yields knowledge *only if* the hearer can map the verdict to their own anticipated experience.
  *   **The Case:** A work is destroyed (e.g., the original *Guernica* before it was painted, or a demolished building). No one can experience it. The only access is testimony.
  *   **The Problem:** If I trust a calibrated critic who says, "That building was sublime," your view implies I cannot *know* it was sublime, because I cannot complete the calibration loop (I cannot check the verdict against my experience). I can only know *that the critic believes it was sublime*.
  *   **Why it's Fatal:** We standardly claim to have aesthetic knowledge of lost works. We teach art history assuming students know *that* the Colossus of Rhodes was impressive. If your view renders all historical aesthetic knowledge (where the object is inaccessible) as mere true belief, the cost is too high. It makes aesthetic knowledge strangely present-tense and local in a way that contradicts our discursive practices.
  *   **Verdict:** You must concede this. You cannot have it both ways. If you insist on this, you are committed to an error theory about historical aesthetic discourse.

  **Serious: The "Blind Action" Defeater (Professionals)**
  *   **The Case:** A festival programmer buys a film based on a scout's report without seeing it. The film succeeds aesthetically (wins prizes, moves audiences).
  *   **The Problem:** The programmer acted on testimony without personal calibration (perhaps it's a new scout, or a new domain). They succeeded. In epistemology, successful action guided by belief is a strong marker of knowledge.
  *   **Why it's Serious:** Your view must say the programmer did not *know* the film was good, even if they acted correctly. You are forced to distinguish between *aesthetic knowledge* and *pragmatic reliability*.
  *   **Verdict:** You should concede this but reframe it. Argue that the programmer knew "This will function as a good festival entry" (institutional knowledge), not "This is beautiful" (aesthetic knowledge). If you try to claim they had aesthetic knowledge, you break your own calibration rule. If you claim they had no knowledge at all, you look out of touch with professional practice. The middle path (different *kind* of knowledge) is your only survival route.

  **Annoying: The "Inverted Critic" Defeater**
  *   **The Case:** I calibrate against a critic whose taste is the exact inverse of mine. I learn the transformation rule. I use their "Bad" to find my "Good."
  *   **The Problem:** This works on your view. But it suggests the mechanism is just *reliability tracking*, not *aesthetic alignment*.
  *   **Why it's Annoying:** It threatens to collapse your view into a generic theory of testimony. If I can use a critic I fundamentally disagree with, the "shared aesthetic sensibility" requirement evaporates. It becomes purely about predicting the correlation between their words and my experience.
  *   **Verdict:** Dismiss this as a non-threat. You can argue that "calibration" *is* the aesthetic work. Learning the inversion rule *is* a form of aesthetic understanding (understanding the space of taste). It doesn't collapse the view; it just shows calibration is broader than "agreement."

  **Dismissible: The "General Testimony" Defeater**
  *   **The Case:** Critics argue that if testimony works in science/history, why not here?
  *   **Verdict:** Dismiss as question-begging. This ignores the specific phenomenology of aesthetic judgment (the demand for autonomy). Your view explains *why* aesthetics is different (the calibration requirement) without banning testimony entirely. This is a strength, not a weakness.

  ### 2. The Specific Cases

  **The Lost Art Case: Cost or Defeater?**
  It is a defeater unless you modify the definition of "experience." If you allow that *imaginative reconstruction* based on detailed description counts as the requisite "acquaintance" for calibration, you can save the view.
  *   *Modification:* Calibration requires acquaintance with the *type* of experience the work affords, not the specific token. If I have seen enough Baroque architecture, I can calibrate a critic on a demolished Baroque church.
  *   *Risk:* This weakens (ii). If "acquaintance" becomes "acquaintance with descriptions of similar things," the line between aesthetic testimony and historical testimony blurs.
  *   *Recommendation:* Swallow the cost. Admit that for truly unique, inaccessible objects, we lack *aesthetic knowledge* proper, possessing only *historical belief*. This is a hard line, but it preserves the integrity of the "experience" requirement.

  **The Professional Case: Flying Blind?**
  Your view does *not* have to say they are flying blind. It says they are operating on *instrumental* knowledge, not *aesthetic* knowledge.
  *   *Distinction:* The programmer knows "This fits the criteria for selection." They do not necessarily know "This is moving."
  *   *Acceptability:* This is acceptable. Professionals often care about the former, not the latter. A sound mixer might know "This mix meets broadcast standards" without knowing "This mix is emotionally resonant." Your view captures this nuance better than the optimist view, which conflates the two.

  **The Inverted Critic: Collapse or Reduction?**
  This is a friendly reduction. Your view *should* collapse into a general theory of testimony *plus* a claim that aesthetic domains are high-dimensional and hard to calibrate.
  *   *Why:* The "aesthetic" part of your view is located in the *difficulty* of calibration, not the *mechanism*. The mechanism is reliability. The aesthetic constraint is that reliability is hard to establish because the variables are subjective and numerous.
  *   *Verdict:* Embrace this. It strengthens the view by removing mysticism. It's not that aesthetic testimony is magic; it's that the signal-to-noise ratio is low until calibration occurs.

  **The Recommender System (Black Box)**
  This is the most dangerous case for claim (ii).
  *   **The Scenario:** An algorithm predicts your response with 99% accuracy. It has no experiences. You have no acquaintance with the art. You trust the output.
  *   **The Problem:** You get the result (true belief guiding experience) without *anyone* having aesthetic acquaintance with the specific work. The algorithm correlates data points.
  *   **Impact:** If you grant this is aesthetic knowledge, (ii) is false. Acquaintance is not ineliminable; *data* is.
  *   **The Fix:** You must argue this is not aesthetic testimony. It is *predictive modeling*. Testimony implies a speaker making a judgment. An algorithm outputting a match score is not a judgment.
  *   **Risk:** This feels like semantic gerrymandering. If the functional result is identical (I go see the movie because the system said I'd like it, and I do), calling it "not testimony" saves the theory at the cost of relevance.
  *   **Honest Assessment:** This case suggests your view is actually about *reliability-tracking via past experience*. The "acquaintance" requirement is just a proxy for "having enough data points to verify reliability." If the algorithm provides the reliability data without the acquaintance, the algorithm wins. You should concede that if the black box works, it bypasses the need for *human* calibration, but maintains the need for *hearer* calibration (you must have tested the algo against your past experiences).

  ### 3. Predictions and Observations

  Your view makes distinct predictions that differ from both Pessimism and Optimism.

  **Unique Predictions:**
  1.  **Calibration > Reputation:** Predictive accuracy of testimonial belief should track *personal history with the critic*, not the critic's general reputation. A famous critic's word should carry less weight for a novice than a friend's word for a veteran.
  2.  **Domain Fragmentation:** Calibration should not transfer easily. Trusting a critic on films should not grant knowledge about their book reviews, even if the aesthetic sensibility seems similar.
  3.  **The Novice Penalty:** Novices relying on expert consensus should be systematically unable to *defend* or *explain* their judgments, even if true. They will lack the "because..." that comes from calibrated understanding.

  **Testability:**
  *   **Rough-and-Ready Testable:** The "Domain Fragmentation" claim. Ask subjects who trust a specific food critic if they trust that critic's restaurant design advice. If they hesitate despite assuming "taste is taste," your view is supported.
  *   **Armchair:** The "Novice Penalty." We can introspect on whether we feel we *know* a movie is good because a YouTuber said so, or whether we just believe it. The phenomenology of "hollow belief" vs. "calibrated knowledge" is accessible via reflection.

  ### 4. The Immunization Worry

  You are right to worry about "hidden calibration."
  *   **The Risk:** If a counterexample arises (e.g., "I trusted a stranger and was right!"), the view can always retort, "You must have had implicit calibration from cultural osmosis."
  *   **Assessment:** This is **cheating**, not legitimate insulation.
  *   **Why:** To avoid vacuity, "calibration" must require *recognizable* patterns of past verification. If calibration can be entirely unconscious and inferred from general cultural background, then *everyone* is always calibrated to *everyone* to some degree, and the constraint does no work.
  *   **Fix:** You need a threshold. Calibration requires *conscious recognition* of the mapping, or at least a track record of *specific* corrections ("I thought I'd hate this, but she said I'd like it, and she was right"). Vague cultural sharedness is not calibration; it's just shared context. If you allow shared context to count as calibration, you slide back into Optimism.

  ### 5. Separation of Claims (i) and (ii)

  There is a point where these claims pull apart, and it matters for your "Action without Acquaintance" weighting.

  *   **Claim (i):** Knowledge requires calibration (mapping verdicts to experience).
  *   **Claim (ii):** Calibration requires first-hand acquaintance (with works/critic).

  **Where they split:** The **Recommender System** case.
  *   I can satisfy (i) without satisfying (ii). I can calibrate the algorithm (map its outputs to my experiences) without the algorithm having acquaintance, and without me having acquaintance with the *new* work.
  *   **Implication:** If you accept the algorithm case as yielding knowledge, (ii) must go. You can keep (i). This transforms your view from an *Aesthetic* view to an *Epistemic* view. It becomes: "Aesthetic testimony is knowledge iff the hearer has verified the reliability of the source against their own experiential data."
  *   **Action without Acquaintance:** If (ii) falls, then professionals *can* have knowledge without acquaintance, provided they have calibrated the *source* (the scout) against past outcomes.
  *   **Your Weighting:** You said you find "action without acquaintance" persuasive. If so, you should **drop (ii) and keep (i).**
      *   *Revised View:* Acquaintance with the *specific work* is not needed. Acquaintance with the *reliability of the source* is needed. This reliability can be established via past success (action), not just past aesthetic experience.
      *   *Benefit:* This saves the Professional case and the Algorithm case.
      *   *Cost:* It makes the view less about "Aesthetics" and more about "Specialized Testimony." It loses the specific flavor of why aesthetics feels different, reducing it to high-variance data.

  ### Final Verdict

  Your Calibration View is superior to the standard Pessimist/Optimist dichotomy because it explains the *social* reality of aesthetic trust. However, as currently formulated with the strong acquaintance requirement (ii), it is too brittle to handle lost art, professional action, and algorithmic prediction.

  **Recommendation:**
  1.  **Concede** the "Lost Art" point: Admit we lack direct aesthetic knowledge there, only historical belief.
  2.  **Modify (ii):** Change "Calibration requires acquaintance" to "Calibration requires *verified reliability*." Verified reliability usually comes from acquaintance, but can come from successful action (professionals) or data correlation (algorithms).
  3.  **Guard against Immunization:** Define calibration strictly as *tracked predictive success*, not vague shared sensibility.

  If you make these shifts, the view survives the fatal defeaters and accommodates the "action without acquaintance" cases you find most persuasive, while retaining the core insight that trust in aesthetics must be earned, not assumed.
