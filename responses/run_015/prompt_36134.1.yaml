  so in physics we did this lab where you plot your data points and then draw the line through them. and i noticed that between the points you can literally draw whatever, and even past the last point there are endless different curves that pass through every single measurement i actually took. teacher just said "draw the simplest curve". but then i realised "simplest" depends on how you write the numbers down?? like if i measure time in seconds, or in some made up unit where 1 unit = 1 second up til friday and 1 unit = 2 seconds after friday, then the exact same data is a straight line in one language and a bendy curve in the other. so which curve is "simple" isn't a fact about the world, it's a fact about which words i picked. and the prediction i'm allowed to make changes with the words.

