  **FEDERAL OFFICE OF EXISTENTIAL RISK MANAGEMENT (FOERM)**
  **INTERNAL COMPLIANCE BULLETIN 2024-09**
  **TO:** All Review Staff, Subcommittee Chairs
  **FROM:** Dr. Aris Thorne, Chair, Board of Oversight
  **SUBJECT:** Annual Operational Metrics and Procedural Updates
  **DATE:** October 14, 2024

  **1. MESSAGE FROM THE CHAIR**

  This bulletin summarizes the Office's performance regarding the licensing of actions with non-zero probability of civilization-scale loss. Our mandate remains the minimization of aggregate existential risk through conformity and deferment. While individual proposals often demonstrate net-positive expected utility in isolation, the unilateralist's curse dictates that the probability of catastrophe compounds across independent agents. Therefore, our primary metric remains the rate of action suppression.

  Please note that the proposed staffing expansion for Q3 has been revised downward. Risk modeling indicates that each additional reviewer introduces an independent 0.04% chance of internal classification error. Consequently, hiring new personnel increases the Office's own contribution to the global risk profile. This liability has been reclassified as a budgetary line item under "Risk Accumulation Costs," limiting our capacity to process applications without exceeding our internal risk tolerance.

  **2. APPLICATION STATISTICS**

  In FY2024, FOERM received 4,150 applications for high-consequence activities. Of these, 4,148 were deferred pending further consensus, and two were withdrawn following preliminary guidance. The median deferral period currently stands at 14 months. This exceeds the historical mean recurrence interval of Class-3 existential events (11 months). While this indicates that our review cycle is slower than the rate of potential crises, it confirms that no licensed action could have precipitated a disaster during the review window. We consider this a successful containment of opportunity risk.

  **3. WORKED EXAMPLES OF RISK DISPLACEMENT**

  **Case A (Geoengineering Proposal):** A consortium sought license for stratospheric aerosol injection. While the climate modeling suggested net benefit, one reviewer identified a 0.005% probability of monsoon disruption. Under the aggregation protocol, this single veto triggered a deferral. However, telemetry indicates the consortium has relocated operations to a non-signatory jurisdiction. This illustrates the abstention externality: our refusal did not eliminate the risk, but reallocated it to a less scrupulous regulatory environment.

  **Response:** To mitigate this displacement, staff must now file Form 88-R (Risk Displacement Tracking) upon any deferral. This form requires an assessment of where the action might migrate. Completion of Form 88-R requires review by the new Subcommittee on Jurisdictional Arbitrage, adding an estimated 3 months to the deferral period.

  **Case B (Pathogen Gain-of-Function):** A laboratory proposed research to increase transmissibility of a benign virus for vaccine modeling. The board denied the license. However, the denial itself constitutes a unilateral act relative to other oversight bodies (e.g., NIH, DOE). If FOERM is wrong to deny, we have unilaterally imposed a safety cost on the global scientific community.

  **4. GUIDANCE FOR STAFF: THE DOCTRINE OF NEGATIVE ATTRIBUTION**

  Staff are reminded of the incentive structures governing decision-making. Under the Doctrine of Negative Attribution, liability for a catastrophic outcome attaches solely to the agents who authorized the action. Agents who abstained from preventing the action retain no liability, regardless of their capacity to have intervened. Consequently, career advancement is correlated with deferral rates.

  Staff should not interpret private consensus regarding an action's safety as grounds for approval. Even if all reviewers privately agree an action is net-positive, the public record must reflect uncertainty. If a catastrophe occurs, the authors of the deferral will be appointed to the After-Action Review Committee. This ensures that those who avoided responsibility for the risk are entrusted with analyzing its consequences. Conformity is not merely procedural; it is the only defensible career strategy.

  **5. BOARD STATUS AND AUTHORITY**

  The Board of Oversight continues to operate under self-imposed licensing requirements. Recognizing that the Board's decision to issue a license is itself a high-consequence action (relative to inaction), the Board must license its own licenses. This recursive authority is documented in Appendix Z. Currently, License L-990 authorizes the Board to convene. License L-991 authorizes the Board to issue License L-990.

  Due to the compounding risk of these recursive authorizations, the Board has entered a period of strategic pause. We have determined that the only action with a sufficiently low downside distribution is total abstention. However, abstention is itself an act that alters the risk landscape. Therefore, the Board has issued License L-992, which authorizes the Board to abstain from issuing licenses.

  **6. PERFORMANCE METRIC**

  For the first time in Office history, we have achieved Zero-Active-License Compliance. All pending applications have been merged into the deferral backlog. The Board is currently reviewing License L-992 to ensure that the act of abstaining does not require a further license to abstain from licensing. Until this regress is resolved, all staff are instructed to maintain current inaction levels.

  **AUTHORIZATION:**
  *This bulletin is issued under License L-990. Validity contingent on renewal of L-990 by Board vote scheduled for FY2028 (pending L-993 approval).*
