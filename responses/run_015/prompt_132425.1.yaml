      *   *Troubleshooting:* Students refusing numbers, re-deriving priors, talking across tables.
      *   *Limitations:* Normative question (why rigidity?) cannot be solved by the game.

  6.  **Writing the Plan (Iterative refinement):**

      *   *Intro:* Set the scene. Dog, Vet, Mass.
      *   *Round 1 (Order):* Split room. Left side gets Ultrasound then Lab. Right side gets Lab then Ultrasound.
