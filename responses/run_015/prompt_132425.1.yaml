      *Wait, Insight 1 (Conditionalization vs. JC)* is foundational. If I skip it, they won't know *why* we are using JC.
      *Okay, I will embed Insight 1 in the Setup/Instructions.* I will explicitly ask them to try to conditionalize on the uncertain evidence and fail, then apply the rule.

      *Let's refine the "Scoring".* To avoid money, use "Seminar Participation Points." The TA calculates the "Rational Credence" after the fact. Students submit their number. Closest to Rational Credence gets max points. This incentivizes following the rule correctly.

