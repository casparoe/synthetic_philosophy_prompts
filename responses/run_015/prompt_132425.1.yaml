      *Adjustment:* Start with a "Signal" round where they *can* conditionalize (Vet says "It looks benign" with known reliability). Then do a "Shift" round where they just get "60% benign" with no reliability info.

      *Let's streamline for 80 mins:*
      1.  **Setup (10 min):** Define $H$ (Benign) vs $\neg H$ (Malignant). Set Prior $P(H) = 0.5$.
      2.  **Round 1: The "Signal" vs. The "Shift" (20 min):** Half the class gets a signal ("Vet says Benign", reliability 0.8). Half gets a shift ("New credence in H is 0.8"). Show they match *if* you can conditionalize on the signal.
