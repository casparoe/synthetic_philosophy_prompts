  ## TA Troubleshooting Guide (For Your Eyes Only)

  **Predictable Failure 1: Students refuse to commit to a probability.**
  *   *Symptom:* Students write "0.5" or "?" on cards during Round 1.
  *   *Cause:* Discomfort with quantifying uncertainty.
  *   *Handle:* Walk around during the calculation phase. "I need a number to score you. Guess if you have to. Epistemology requires commitment."

  **Predictable Failure 2: Students re-derive priors instead of updating.**
  *   *Symptom:* Final numbers in Round 2 are identical across groups despite different orders.
  *   *Cause:* They ignore the "current credence" instruction and just average the signals against the original 0.5 prior.
  *   *Handle:* In Round 2 debrief, explicitly ask: "Did you use your Round 1 result as the prior for Round 2?" Highlight the students who did vs. didn't.

  **Predictable Failure 3: Cross-talk destroys the Order comparison.**
  *   *Symptom:* Group Alpha looks at Group Beta's paper.
  *   *Cause:* Curiosity.
  *   *Handle:* Collect Round 2 cards immediately. Do not allow discussion until the numbers are on the board. If they talk, deduct 5 EAP from the whole row (use this threat lightly).

  **Predictable Failure 4: Arithmetic errors swamp the lesson.**
  *   *Symptom:* Students spend 15 minutes calculating decimals.
  *   *Cause:* Complex numbers.
  *   *Handle:* Allow phone calculators. Write the intermediate steps on the board (e.g., "Step 1 Result = 0.74"). Let them focus on the *structure* of the update, not the multiplication.

  **What This Activity Cannot Stage:**
  *   **The Normative Defense:** The game shows Rigidity is an assumption. It cannot prove Rigidity is *good*. You must supply the philosophical argument in the closing lecture (minimizing information distance/entropy).
  *   **The "True" Probability:** The game treats the "Rational Credence" as the one derived from the rule. In reality, the rule might lead you astray if the Rigidity assumption is false. You must clarify that "Rational" here means "Internally Consistent with the Rule," not "Accurate to Reality."

  **Materials Checklist:**
  *   [ ] Whiteboard cleaned.
  *   [ ] 42 Index Cards (14 students x 3 rounds).
  *   [ ] Markers (Black, Red, Blue).
  *   [ ] Timer (visible to students).
  *   [ ] Score sheet for EAP tracking.
