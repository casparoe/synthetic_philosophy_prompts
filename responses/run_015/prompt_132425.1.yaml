      *   If they do Order 1: Update on $U$, then update result on $L$.
      *   If they do Order 2: Update on $L$, then update result on $U$.
      *   *Crucial:* For Order Effect to show, the partitions must be distinct but overlapping in influence on $H$. Actually, standard Jeffrey Conditioning on *different* partitions is non-commutative.
      *   *Math Check:*
          *   Start $P_0$.
          *   Update 1 on Partition $\mathbf{E}$ to $P_1$.
          *   Update 2 on Partition $\mathbf{F}$ to $P_2$.
