      *   $D_B$: Vet concludes Benign. $D_M$: Vet concludes Malignant.
      *   Prior over Diagnoses: 0.5 / 0.5.
      *   Likelihoods (Rigidity): $P(H|D_B) = 0.95$, $P(H|D_M) = 0.05$.
      *   Input 1: Ultrasound is fuzzy. I'm 60% sure the vet would say $D_B$. ($P_{new}(D_B) = 0.6$).
      *   Input 2: Lab value is borderline. I'm 70% sure the lab would flag "Normal". ($P_{new}(L_N) = 0.7$).
      *   This works for Order Effects.

  5.  **Addressing the Specific Constraints:**

      *   *Runnable Activity:* Needs clear instructions spoken by TA.
