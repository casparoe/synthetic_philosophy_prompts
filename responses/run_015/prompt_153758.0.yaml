      *   **(3) Normative Bite (Closure-lite):** If an agent *explicitly* believes $P$ and $P \to Q$, rationality *requires* believing $Q$, even if working memory is full. This sounds like an architecture-independent norm.
      *   **(4) Hard Naturalism:** Rationality norms are *always* relative to cognitive architecture. No "view from nowhere." A human with 7±2 slots has specific norms.
      *   **(5) Rejection of Closure for Modeling:** Belief bases should be revised non-monotonically, not closed under entailment.

  2.  **Identify the Core Tensions:**

      *   **Tension A: (3) vs. (4).** (3) says "Rationality requires $Q$ even if memory is maxed." (4) says "Rationality is relative to architecture (e.g., memory limits)." If memory is maxed, (4) suggests you *can't* be required to hold $Q$, but (3) says you *are* required to. This is a direct contradiction between a specific norm and the meta-ethical/metaphysical stance on norms.
      *   **Tension B: (3) vs. (5).** (3) looks like a closure principle (Bel($P$) & Bel($P \to Q$) $\to$ Bel($Q$)). (5) says "Reject closure for modeling." If the model doesn't have closure, how does it capture the normative requirement? Is the norm descriptive of the model or external to it?
