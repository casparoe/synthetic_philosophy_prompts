          *   *Selection:* The cheapest fix is to refine (3). The requirement isn't "hold $Q$ now" but "acknowledge the tension/commitment." Or, admit (4) needs softening. Actually, the *cheapest* fix is to soften (3) to fit (4). If naturalism is the core, (3) must yield.
      *   **Fixing Tension B (3 vs. 5):**
          *   *Option 1:* Distinguish *Explicit* vs. *Implicit* belief. Model tracks explicit (non-closed), norm applies to implicit commitments. *Cost:* Reintroduces a form of omniscience implicitly.
          *   *Option 2:* Frame (5) as descriptive and (3) as normative. The model shows failures; the norm shows where they are failures. *Cost:* Needs clear separation of projects.
      *   **Fixing Tension C (2):**
