      *   *Case 2 (Biometric Sensor):* Medium/High risk. New data type. Requires re-consent. Tests the "Search Cost" vs. "Risk" balance.
      *   *Case 3 (Data Retention):* High ambiguity. "Unspecified analysis" is a classic ethical red flag (broad consent issues). The prompt says this *should* fail the gate but is usually rubber-stamped. I need to make sure the procedure flags this as a "Fail" based on the aspiration level for informed consent, while noting the institutional pressure to pass it.

  5.  **Addressing "Gaming the Aspiration Levels":**
      *   How do board members manipulate this?
      *   Moving the goalposts (changing the aspiration level mid-review).
      *   Inflating search costs ("We need more info" when we don't).
      *   Reclassifying values as facts.

  6.  **Addressing Limitations:**
