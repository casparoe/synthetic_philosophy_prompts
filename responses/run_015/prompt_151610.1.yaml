prompt: |-
  hey so im a phd student in decision sciences (mostly bounded rationality / satisficing stuff, with some weird side interest in how aspiration levels adapt under partial feedback) and my advisor volunteered me to help our univ's small research ethics board stop debating every amendment to death. they have like 20 minutes per case, zero lawyers on staff, and right now they try to 'maximize ethical coverage' which is impossible so they just stall.

  i need a reusable decision procedure—checklist style, questions in order, what counts as sufficient at each gate, hard stop for no, and explicit hand-off points where its values not facts. it should be grounded in satisficing logic, not optimization: set an aspiration level for risk/info-gain, search only until you hit it or search costs spike, then adapt downward only if the spike is genuine not just impatience. apply it to three protocol amendments: (1) switching survey language in an approved study, (2) adding a biometric sensor not in original consent, (3) extending retention for 'future unspecified analysis.' case 3 should fail the gate but its exactly the kind they always want to rubber-stamp, so flag that tension.

  also include where the board can game the aspiration levels to get the answer they want, and a clear section on what this procedure cant do—like resolve deep disagreement about acceptable risk, just make it visible. sorry this is long, im writing between classes and my trackpad is acting up.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** PhD student in Decision Sciences (bounded rationality/satisficing/aspiration levels).
      *   **Task:** Create a reusable decision procedure (checklist style) for a university Research Ethics Board (REB/IRB).
      *   **Context:** Small board, 20 mins/case, no lawyers, currently stalling due to trying to "maximize ethical coverage" (optimization) instead of satisficing.
      *   **Core Logic:** Satisficing (Simon/March/Cyert). Set aspiration levels, search until met or costs spike, adapt downward *only* if spike is genuine.
      *   **Requirements:**
          *   Checklist style, ordered questions.
          *   Sufficient conditions at each gate.
          *   Hard stop for "No".
          *   Explicit hand-off points (Values vs. Facts).
          *   Apply to three specific cases (Survey language, Biometric sensor, Data retention).
          *   Case 3 must fail the gate but acknowledge the tension (rubber-stamping pressure).
          *   Section on "Gaming the Aspiration Levels."
          *   Section on "Limitations" (what this *can't* do).
      *   **Tone:** Professional, academic but practical, acknowledging the user's expertise (no need to explain basic satisficing theory, just apply it).

  2.  **Deconstruct the Satisficing Logic for Ethics Review:**
      *   *Optimization (Current State):* "Is this the *best* possible ethical outcome?" -> Impossible -> Stall.
      *   *Satisficing (Proposed State):* "Is this *good enough* to proceed without unacceptable harm?" -> Feasible -> Decision.
      *   *Aspiration Level:* The threshold of risk/benefit balance.
      *   *Search Cost:* Time spent debating.
      *   *Adaptation:* Lowering standards only if the search cost (delaying vital research) genuinely outweighs the marginal ethical gain, not just because the board is tired.

  3.  **Drafting the Procedure (The "Satisficing Ethics Gate" - SEG):**
      *   Need a flow.
      *   *Gate 1: Compliance/Fact Check.* (Is the form right? Is it actually an amendment?)
      *   *Gate 2: Risk Aspiration.* (Does this exceed the pre-set risk threshold?)
      *   *Gate 3: Consent/Information.* (Do participants know enough?)
      *   *Gate 4: Search Termination.* (Have we debated enough? Is further debate worth it?)
      *   *Hand-offs:* Where do we say "This isn't a fact, this is a value judgment"?

  4.  **Developing the Three Cases:**
