answer: |-
  To: Fellowships Committee
  From: Graduate Representative, Fellowships Committee
  Date: October 24, 2023
  Re: Decision Rule and Allocation for Dissertation Fellowships

  Committee Members,

  We face a logical impasse. Our charter forbids ranking Candidate Q above P if a majority prefers P to Q. Yet, regarding the top three candidates in our dense band (F-06, F-11, F-17), we have a cycle: a majority prefers F-06 to F-11, F-11 to F-17, and F-17 to F-06. Simultaneously, we acknowledge that while adjacent files in the 17-file band are indistinguishable, the endpoints (F-06 and F-51) are not equally meritorious. We cannot satisfy the charter, maintain logical consistency, and respect our judgments simultaneously without adopting a specific philosophical stance on how we compare candidates.

  I recommend we proceed on two grounds. First, regarding the voting cycle, we must accept that merit claims are respect-relative. The cycle exists because members weigh criteria differently (writing sample vs. teaching vs. promise). 'Better than' is not a single, transitive ordering across all respects; it is a three-place relation: better than *with respect to* a specific purpose. Since this fellowship's purpose is explicitly to buy out a year of writing, we must prioritize the writing sample and publication record when conflicts arise. This breaks the cycle by fixing the respect in which candidates are compared.

  Second, regarding the dense band, we must accept that imperceptible differences are nonetheless real when accumulated. While no reader can distinguish F-06 from F-07, the aggregate difference between F-06 and F-51 is substantial. To deny this is to deny the reality of the endpoints. Therefore, we must trust the aggregate score to order the band, even if adjacent steps are individually imperceptible.

  Based on this, I propose the following allocation. We will award full fellowships to F-06, F-11, and F-17. These three form the top cluster; excluding any based on the cycle would be arbitrary given their respect-relative strengths. To address the density of the band and the Dean's allowance, we will split the fourth fellowship between F-20 and F-21. This acknowledges that the drop-off after the top cluster is negligible. F-51 and the remaining files will receive no award.

  This requires a temporary suspension of the pairwise clause for this cycle, as it is logically unsatisfiable. For future cycles, I propose replacing the pairwise clause with: "The Committee shall rank candidates based on a purpose-weighted aggregate score; pairwise majority votes shall be advisory only." This prevents future cycles from paralyzing allocation while respecting the fellowship's specific aims.

  I anticipate the strongest objection from those who argue that banding, splitting, or overriding pairwise votes abandons the determinate judgment each candidate is owed. Critics will say that if we cannot distinguish F-06 from F-07, we owe them equal treatment, not a ranking based on decimal points that mask genuine uncertainty. They will argue that procedural shortcuts admit we cannot do the work we were appointed to do.

  However, doing "the work" requires a coherent decision rule. Maintaining a clause that generates logical contradictions ensures no decision is possible. By specifying the purpose (writing), we make the judgment determinate. By accepting accumulated differences, we respect the gap between the best and the rest. Splitting the fourth award mitigates the harshness of the cut-off in the dense band. This approach honors the candidates by providing a reasoned, consistent framework rather than hiding behind a broken voting rule.

  We must vote on this allocation and charter amendment by Thursday to meet the nine-day deadline. I move we adopt this course.

