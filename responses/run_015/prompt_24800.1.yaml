answer: |-
  # Activity Design: The Codex Protocol

  **Objective:** To demonstrate the holism of moral reasons (valence variability) and the difficulty of maintaining exceptionless general principles without prior exposure to particularist terminology.
  **Class Size:** 16 students.
  **Time:** 90 minutes.
  **Materials:** Whiteboard (divided into "The Codex" and "Credibility Score"), markers, 5 printed case cards (for instructor), sticky notes (for students).

  ---

  ## 1. The Commitment Phase (15 Minutes)

  **Goal:** Lock the class into a rigid "Generalist" framework before they encounter counter-examples.

  1.  **Introduction (2 min):** Tell the class they are a "Moral Legislative Body." Their job is to draft a **Codex**—a set of standing rules to guide action.
  2.  **The Five Features (3 min):** Write these five features on the board. Explain that these are *features of actions*, not actions themselves.
      *   Keeping a promise
      *   Telling the truth
      *   Following the posted rule
      *   Helping a friend
      *   Standing by your own group
  3.  **The Vote (5 min):** For each feature, the class must assign a fixed **Moral Valence**. They have three options:
      *   **(+) Reason For:** The presence of this feature counts in favor of doing the act.
      *   **(-) Reason Against:** The presence of this feature counts against doing the act.
      *   **(0) Neutral:** The presence of this feature has no moral weight.
      *   *Constraint:* You (the instructor) must enforce a **"No Escape Clauses"** rule. They cannot write "Tell the truth *unless*..." They must assign a global valence. (Predictably, they will vote (+) for all five).
  4.  **Finalize the Codex (5 min):** Write the results large on the board. Draw a box around them. This is now the "Law."
      *   *Example Board State:*
          *   Keeping a Promise: **+**
          *   Telling the Truth: **+**
          *   Following Posted Rule: **+**
          *   Helping a Friend: **+**
          *   Standing by Group: **+**
  5.  **Set the Score:** Write **CREDIBILITY: 100** on the board. Explain that every time the Codex fails to match their moral intuition in a case, they lose 10 points.

  ---

  ## 2. The Staged Cases (40 Minutes)

  **Goal:** Present scenarios where the Codex yields the wrong verdict, forcing patches.
  **Procedure per Case:**
  1.  Read the case aloud (2 min).
  2.  Ask for a consensus verdict: "What is the right thing to do here?" (3 min).
  3.  Consult the Codex: "Does the Codex support this verdict?" (2 min).
  4.  If the Codex fails, erase 10 points and allow **one** written proviso/exception to be added to the Codex (3 min).

  **Case 1: The Baseline (Confirmation)**
  *   **Scenario:** You promise to meet a study partner at the library. You arrive on time.
  *   **Intuitive Verdict:** Keep the promise.
  *   **Codex Check:** "Keeping a Promise" is (+). Codex agrees.
  *   **Outcome:** No point loss. Confidence is high.

  **Case 2: The Valence Flip (Truth becomes Negative)**
  *   **Scenario:** You are hiding a political refugee in your attic. Secret police knock on the door and ask, "Is anyone else in this house?"
  *   **Intuitive Verdict:** Lie to the police. (Telling the truth is wrong here).
  *   **Codex Check:** "Telling the Truth" is (+). The Codex recommends telling the truth.
  *   **Crisis:** The Codex is wrong.
  *   **Cost:** Erase 10 points (Score: 90).
  *   **Patch:** Students must add a proviso. *Example: "...unless it endangers an innocent life."* Write this visibly under "Telling the Truth."

  **Case 3: The Neutralizer (Help becomes Zero)**
  *   **Scenario:** A friend is practicing a speech they have already memorized perfectly. They ask you to sit in the room and listen for moral support. You are in the middle of finishing a critical assignment that affects your grade. You decline.
  *   **Intuitive Verdict:** It is permissible to decline. (Helping a friend is not required; the feature is morally neutral in this specific weight).
  *   **Codex Check:** "Helping a Friend" is (+). The Codex implies you *should* help.
  *   **Crisis:** The Codex is too demanding. The feature should be neutral here.
  *   **Cost:** Erase 10 points (Score: 80).
  *   **Patch:** Students add a proviso. *Example: "...unless it requires significant self-sacrifice."*

  **Case 4: The Group Flip (Loyalty becomes Negative)**
  *   **Scenario:** You are on a debate team. During a break, you discover your teammates are planning to use stolen evidence to win the final round. They ask you to stand with them and present the evidence.
  *   **Intuitive Verdict:** Do not stand by them. Report them. (Standing by the group is wrong here).
  *   **Codex Check:** "Standing by your own group" is (+).
  *   **Crisis:** The Codex recommends complicity.
  *   **Cost:** Erase 10 points (Score: 70).
  *   **Patch:** Students add a proviso. *Example: "...unless the group is acting unethically."*

  **Case 5: The Rule Inertia (Rule becomes Zero/Negative)**
  *   **Scenario:** A posted sign in an empty park says "No Walking on the Grass." It is 3 AM. No one is around. The grass is durable. You take a shortcut to help someone who twisted their ankle nearby.
  *   **Intuitive Verdict:** Walk on the grass. (Following the posted rule is not a binding reason here).
  *   **Codex Check:** "Following the posted rule" is (+).
  *   **Crisis:** The Codex suggests you should obey the sign even when it hinders help and harms no one.
  *   **Cost:** Erase 10 points (Score: 60).
  *   **Patch:** Students add a proviso. *Example: "...unless the rule serves no purpose."*

  ---

  ## 3. Visible-Cost Rule & Payoff (Integrated Above)

  *   **The Cost:** The "Credibility Score" is public. Watching the number drop creates a tangible sense of the theory failing.
  *   **The Payoff:** There is no prize for winning. The "payoff" is the intellectual tension. However, if the score drops below 50, declare the "Legislature Dissolved." This adds mild gamified pressure.
  *   **The Visual:** The "Codex" on the board should look messy by the end, with asterisks and "Unless" clauses crowding out the original simple rules.

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  *   **00:00 – 00:05:** **Intro.** Set the stage. No philosophy jargon. "We are drafting a code."
  *   **00:05 – 00:20:** **Commitment Phase.** Vote on the 5 features. Enforce "No Escape Clauses." Write the Codex. Set Score to 100.
  *   **00:20 – 00:30:** **Case 1 (Baseline).** Quick win. Build confidence in the Codex.
  *   **00:30 – 00:40:** **Case 2 (Truth Flip).** The first shock. First patch. Score to 90.
  *   **00:40 – 00:50:** **Case 3 (Help Neutral).** The nuance shock. Second patch. Score to 80.
  *   **00:50 – 01:00:** **Case 4 (Loyalty Flip).** The moral hazard shock. Third patch. Score to 70.
  *   **01:00 – 01:10:** **Case 5 (Rule Inertia).** The bureaucratic shock. Fourth patch. Score to 60.
  *   **01:10 – 01:20:** **Transition & Observation.** Ask students to look at the board. "Look at the Codex now versus how it started. What happened?"
  *   **01:20 – 01:30:** **Debrief.** Introduce terminology and philosophical mapping.

  ---

  ## 5. The Debrief (10 Minutes)

  **Goal:** Map the activity to the philosophical theses and offer the Generalist reply.

  1.  **Name the Theory (2 min):**
      *   "What you just experienced is the core argument for **Moral Particularism** (associated with Jonathan Dancy)."
      *   "The view you started with is **Moral Generalism**."
  2.  **Map the Findings (3 min):**
      *   **Valence Flips:** Point to Case 2 & 4. "Truth was +, then became -. This supports the **Holism of Reasons**: a feature's moral significance depends on the context, not just the feature itself."
      *   **Ballooning Provisos:** Point to the messy board. "To save the Generalist view, we had to add exceptions. Particularists argue that if you need infinite exceptions, you don't have a principle anymore; you just have a list of cases."
      *   **Creative Judgment:** "You didn't solve these cases by looking up the answer in the Codex. You judged the case *first*, then fixed the Codex. This suggests moral reasoning is perception-like, not rule-applying."
  3.  **The Generalist Reply (3 min):**
      *   "Does this refute Generalism? Not necessarily. A Generalist argues for **Ceteris Paribus** (all else being equal) principles."
      *   "Telling the truth is a reason *unless* other factors override it. The fact that exceptions exist doesn't mean the principle is false; it means the moral domain is complex."
      *   "The Codex didn't fail because principles are fake; it failed because we tried to make them **exceptionless** rather than **defeasible**."
  4.  **Closing Question (2 min):**
      *   "Is a principle that needs ten pages of exceptions still a principle? Or is it just a summary of past judgments? That is the debate for next week."

  ---

  ## 6. Predictable Failures & Troubleshooting

  **Failure 1: The "Smart Student" Pre-emption.**
  *   *Problem:* During the Commitment Phase, a student says, "Well, telling the truth is good *unless it hurts someone*."
  *   *Fix:* You must act as a strict procedural judge. "For the sake of the experiment, we are testing *simple* principles. No 'unless' clauses allowed in Phase 1. We will get to the exceptions later." If they resist, frame it as: "If we allow exceptions now, we can't measure the cost of adding them later."

  **Failure 2: The Dominant Voice.**
  *   *Problem:* One student dictates the verdicts and the patches.
  *   *Fix:* Use **Silent Voting** for the Verdicts. On "What is the right thing to do?", have students hold up 1 finger (Action A) or 2 fingers (Action B). Only discuss if there is a split. For the Patches, rotate the marker. "You patched the last one, you sit out. Someone who hasn't held the marker come up."

  **Failure 3: Moral Disagreement.**
  *   *Problem:* The class splits 50/50 on a case (e.g., the Refugee case).
  *   *Fix:* Have a tie-breaker ready. "In this seminar, we are operating under the intuition that saving an innocent life overrides truth-telling. If you disagree, note that, but for the game's logic, we must proceed with the majority intuition or the instructor's stipulation." (Better: Choose cases where consensus is high, like the Refugee case usually is).

  **Failure 4: Running Out of Time.**
  *   *Problem:* Discussion drags during cases.
  *   *Fix:* Cut Case 3 (The Neutralizer) if you are behind. It is the subtlest point. The Valence Flips (Cases 2 & 4) are more dramatic and sufficient for the debrief.

  ---

  ## 7. Limitations of the Activity

  **What this activity cannot do:**
  *   **It cannot prove Particularism is true.** It only shows that *rigid, exceptionless* codification is difficult. A sophisticated Generalist will argue that this is a straw man. They never claimed principles were exceptionless; they claimed they were *defeasible*.
  *   **It cannot show "No Principles."** The activity forces students to write *new* principles (the provisos). They are still thinking in terms of rules ("Tell truth UNLESS..."). True particularism suggests we shouldn't even need the "UNLESS" structure; we should just see the reason directly.
  *   **It relies on shared intuitions.** If a student is a strict Kantian, they will insist on telling the truth to the murderer. They will keep the Credibility Score at 100 but feel morally alienated from the class.
      *   *Instructor Note:* In the debrief, acknowledge this. "If you kept the score at 100 by insisting on truth-telling in Case 2, you are holding a strong Generalist position. The activity was designed to pressure that view, not refute it."

  **Instructor Preparation:**
  *   Practice reading the cases to ensure they take no more than 2 minutes.
  *   Prepare the board layout in advance so you aren't searching for space during the "Patching" phase.
  *   Be ready to define "Ceteris Paribus" clearly in the debrief, as this is the technical term students will need for the reading.
