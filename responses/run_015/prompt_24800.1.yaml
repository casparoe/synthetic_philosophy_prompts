prompt: |-
  I teach an upper-level undergraduate ethics seminar — about 16 students, one 90-minute session. I want an in-class activity that makes them feel the force of the particularist challenge to general moral principles, and I want that force to come from what happens to them during the activity rather than from my explanation. The specific idea I want them to run into is this: the moral significance of a feature of a case is not fixed. The very same feature can count as a pro tanto reason in favor of an act in one situation, a reason against it in another, and be morally neutral in a third. I do not want the words "particularism," "generalism," or any philosopher's name to surface until the debrief; by the end of the activity they should have discovered the problem inside their own rulebook before I name it.

  Please design a structured game with the following parts:

  1. A commitment phase in which the group, together, assigns a fixed moral valence to each of five candidate features — keeping a promise, telling the truth, following the posted rule, helping a friend, and standing by your own group — tagging each as a reason for, a reason against, or neutral, and writing the results down as a shared, visible "rulebook."
  2. A sequence of staged cases, dealt one at a time in an order you (or a co-facilitator) control, in which at least one rulebook feature must do the decisive work. Engineer the cases so that a feature the group tagged "reason for" (or "reason against") demands the opposite verdict in the case, and include at least one case in which the right move is to treat a feature as neutral. The students should not be able to tell in advance which cases will flip a feature.
  3. A visible-cost rule: every time the group patches the rulebook to handle a counter-case, it must add a written proviso or exception, appended where everyone can watch the rulebook grow.
  4. A payoff scheme that needs no real money — points for a correct verdict on each case, or a group "credibility" score that drops a fixed amount each time the rulebook as written gives the wrong answer.
  5. A minute-by-minute timeline for the 90 minutes, with a buffer for the rulebook-keeping.
  6. A debrief that maps specific moments in the activity onto the theses at stake — the valence-flips as the holism claim, the ballooning provisos as the claim that there are no exceptionless general principles, and the case-by-case judgment as the claim that moral reasoning is creative rather than rule-applying — and then states the strongest generalist reply: that defeasible, ceteris-paribus principles are still genuine principles, so a rulebook that keeps needing provisos is not a refutation of generalism but perhaps just a portrait of a complex domain.
  7. An honest note on what will predictably go wrong the first time I run it — for instance, students pre-empting the flips by writing in exceptions during the commitment phase, or one dominant student monopolizing the rulebook — and how to handle each.
  8. A frank note on which feature of the dispute the activity cannot reproduce and I will have to supply in the debrief: the activity can make the particularist view feel plausible, but it cannot itself decide whether the proliferation of exceptions is a refutation of generalism or merely evidence that the moral domain is intricate.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduate ethics seminar (16 students).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make students *feel* the force of the particularist challenge to general moral principles (specifically: valence variability of features).
      *   **Constraint:** No jargon ("particularism," "generalism," philosopher names) until the debrief.
      *   **Required Components:**
          1.  Commitment Phase (Fixed valence assignment to 5 features).
          2.  Staged Cases (Engineered to flip valences/force neutrality).
          3.  Visible-Cost Rule (Patching the rulebook with provisos).
          4.  Payoff Scheme (Points/Credibility).
          5.  Minute-by-Minute Timeline.
          6.  Debrief (Mapping activity to theory + Generalist reply).
          7.  Troubleshooting (Predictable failures).
          8.  Limitations (What the activity *can't* do).

  2.  **Deconstruct the Core Philosophical Concept:**
      *   *Particularism (Dancy, etc.):* Moral reasons are holistic. A feature (e.g., "lying") that is usually wrong can be right in a specific context, or neutral.
      *   *Generalism:* Moral principles hold *ceteris paribus* (all else being equal). Exceptions don't kill the principle; they just show complexity.
      *   *The Activity's Job:* Create cognitive dissonance between their initial "Rulebook" and the intuitive verdicts of specific cases.

  3.  **Drafting the Activity - Step-by-Step:**

      *   **Title:** Needs to be neutral. "The Rulebook Game" or "The Moral Codex." Let's go with "The Codex Protocol."
      *   **Phase 1: Commitment.**
          *   Features: Keeping a promise, Telling the truth, Following the posted rule, Helping a friend, Standing by your own group.
          *   Task: Vote/Consensus on valence (+, -, 0).
          *   *Anticipated Result:* Almost certainly all "+" (Reasons For). This sets up the fall.
      *   **Phase 2: Cases.**
          *   Need 4-5 cases.
          *   *Case 1 (Baseline):* Confirm the rulebook. (Promise keeping = Good).
          *   *Case 2 (The Flip):* A feature tagged "+" must demand a "-" verdict.
              *   *Idea:* Keeping a promise to meet a friend, but on the way you see someone bleeding. Keeping the promise is now bad (or at least, breaking it is required).
              *   *Better Idea for "Truth":* Telling the truth to a murderer at the door (Kant's example). Truth = Bad.
          *   *Case 3 (The Neutralizer):* A feature tagged "+" is irrelevant.
              *   *Idea:* Following a posted rule about "No shoes" in a context where shoes don't matter (e.g., a virtual meeting, or a rule about a building that burned down). Or "Helping a friend" move a couch when they actually hired movers and just wanted company.
          *   *Case 4 (The Conflict):* Two "+" features clash.
      *   **Phase 3: The Cost.**
          *   Every time the Rulebook fails to yield the intuitive verdict, they must add an "Unless..." clause.
          *   Track "Credibility Points." Start at 100. Lose 10 for every patch needed.
      *   **Phase 4: Payoff.**
          *   Group score vs. Perfect Score.
      *   **Phase 5: Timeline.**
          *   90 mins total.
          *   Intro: 5 min.
          *   Commitment: 15 min.
          *   Cases (4 cases x 10 min): 40 min.
          *   Scoring/Reflection: 10 min.
          *   Debrief: 20 min.
      *   **Phase 6: Debrief.**
          *   Connect patches to "exceptionless principles."
          *   Connect flips to "holism of reasons."
          *   Give the Generalist defense (Ceteris Paribus).
      *   **Phase 7 & 8: Troubleshooting & Limitations.**
          *   *Risk:* Students write "Unless it causes harm" immediately. *Fix:* Ban consequentialist escape hatches in Phase 1.
          *   *Risk:* Dominant voice. *Fix:* Silent voting or rotating scribe.
          *   *Limit:* Can't prove particularism is *true*, just that rigid rules struggle.

  4.  **Refining the Cases (Crucial Step):**
      *   I need to ensure the *same feature* changes valence.
      *   *Feature:* "Telling the Truth."
          *   Case A: Testifying in court. (Truth = +)
          *   Case B: Hiding a refugee from Nazis. (Truth = -)
          *   Case C: Answering "How are you?" in passing. (Truth = 0/Neutral - social lubricant).
      *   *Feature:* "Keeping a Promise."
          *   Case A: Meeting for lunch. (Promise = +)
          *   Case B: Promise to keep a secret that involves a crime. (Promise = -)
      *   *Let's select the strongest ones for the game flow.*
      *   *Case 1:* Standard Truth Telling. (Verdict: Tell Truth). Rulebook holds.
      *   *Case 2:* The Murderer at the Door. (Verdict: Lie). Rulebook fails. Patch required.
      *   *Case 3:* The Trivial Question. "Do I look fat?" (Verdict: Lie/Neutral). Rulebook fails. Patch required.
      *   *Case 4:* Conflicting Duties. Promise to friend vs. Helping stranger in emergency. (Verdict: Break promise). Rulebook fails.

      *Wait, I need to make sure the *students* generate the verdict first, then check the Rulebook.*
      *   *Procedure:* Present Case -> Group agrees on Right Action -> Check Rulebook -> If Rulebook disagrees, Patch Rulebook & Lose Points.

  5.  **Refining the Timeline:**
      *   90 minutes is tight for 16 students. Discussion can bog down.
      *   Need strict timekeeping.
      *   Commitment needs to be fast.
      *   Cases need to be punchy.

  6.  **Refining the Debrief:**
      *   Must explicitly name Dancy/Particularism now.
      *   Must articulate the "Holism of Reasons."
      *   Must offer the Generalist "Ceteris Paribus" counter.

  7.  **Addressing the "Predictable Failures":**
      *   *Smart Students:* They will try to write "Tell the truth, unless lying saves a life" in Phase 1.
      *   *Counter:* The facilitator must enforce a "No 'Unless' Clauses" rule during Commitment. Only simple valences.
      *   *Dominant Student:* Use sticky notes or anonymous polling for the Commitment phase.

  8.  **Addressing the "Limitations":**
      *   The game shows rules get messy. It doesn't prove rules are *impossible*. Generalists say "Messy != False." I need to make sure the debrief highlights this distinction.

  9.  **Final Review against Constraints:**
      *   No jargon until debrief? Yes.
      *   5 specific features? Yes.
      *   Visible cost? Yes (Credibility Score).
      *   Timeline included? Yes.
      *   Troubleshooting included? Yes.

  10. **Writing the Output:** (Drafting the response with clear headings and instructional tone). *Self-Correction during drafting:* Make sure the "Neutral" case is clear. Sometimes students think everything is + or -. I need a case where the feature is present but morally inert.
      *   *Idea for Neutral:* "Following the posted rule." Case: A rule says "No running." You are walking. The rule is present, but it doesn't *recommend* walking, it just forbids running. Or better: A rule about dress code in a context where dress has no impact on function or respect (e.g., a rule about hat color in an online chat).
      *   *Better Neutral:* "Helping a friend." Case: Your friend asks you to watch them practice a speech they already know perfectly. Your presence helps them (technically), but it's morally neutral whether you go or not.
      *   *Actually, let's use "Standing by your own group."* Case: Your team wins a game fair and square. Standing by them is neutral (it's just a game). Case: Your team is cheating. Standing by them is Bad. Case: Your team is unfairly accused. Standing by them is Good.
      *   *Okay, I will integrate these into the Case Sequence.*

  11. **Final Polish:** Check tone. Needs to be pedagogical, precise, and ready to use. Ensure the "Visible-Cost" is dramatic (e.g., erasing points on the board).

  *(Self-Correction on Timeline)*: 90 minutes is 1.5 hours.
  Intro: 5
  Commitment: 15
  Cases (4 cases): 40 (10 each)
  Scoring/Transition: 10
  Debrief: 20
  Total: 90. Perfect.

