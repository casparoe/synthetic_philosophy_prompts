  Modular essentialism dictates that Alex's social-emotional architecture is fixed while vocational traits are flexible. Actual Alex is a barista avoiding crowds. In the counterfactual accountant-world, Alex works in a quiet back-office ledger role but still declines group gatherings due to innate aversion. For Lewis, the accountant-counterpart is the closest match because psychological continuity outweighs career divergence in similarity metrics. For Kripke, this is strictly Alex across worlds, necessarily retaining the hardwired crowd-hating module. Both frameworks validate the claim that accountant-Alex hates crowds, though one relies on weighted resemblance and the other on rigid designation of psychological essence.

  The convergence stems from prioritizing psychological modules as the essential metric for identity and similarity. Lewis weights this trait heavily enough to overlook the career shift, while Kripke treats it as a necessary property of the individual. If we flip the modularity so career modules are essential, the agreement collapses. Kripke would deny the scenario's possibility, asserting Alex cannot be an accountant without ceasing to be Alex. Lewis would identify a different counterpart—likely a barista—who matches the essential vocational trait, rendering the statement "accountant-Alex hates crowds" false because the closest counterpart isn't an accountant.
