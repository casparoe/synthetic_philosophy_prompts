answer: |-
  ### 1. Feasibility and Taxonomy Assessment

  **Taxonomy:** Your four-job taxonomy is correct and standard in critical epidemiology.
  1.  **Apportioning variance** (Legitimate).
  2.  **Individual production** (Fallacious).
  3.  **Intervention prediction** (Fallacious, with narrow exceptions).
  4.  **Between-group explanation** (Fallacious).

  **Feasibility Warning:** You asked me to tell you directly if the task as posed is possible. **The "Portability Ledger" as you described it is not feasible for a non-specialist in fifteen minutes.** A reviewer cannot quantify the "magnitude of environmental variance" in a source versus a target population without reading the underlying paper and often supplementary data. That is a quantitative genetics task, not a copy-desk task.

  **Correction:** Replace the Portability Ledger with a **Context Match Check**. If the claim implies the number applies to a population different from the study sample (e.g., applying a UK Biobank estimate to a global audience, or a 1980s twin study to 2024), the claim fails unless the text explicitly justifies the portability. Do not ask reviewers to measure variance; ask them to spot mismatches in *description*.

  **Portability Rule Correction:** Your candidate rule ("portable only if environmental variance in target is at least as large as in source") is theoretically directionally correct but practically inverted for communication.
  *   *Theory:* $h^2 = V_G / (V_G + V_E)$. If $V_E$ increases in the target, $h^2$ decreases.
  *   *Risk:* Porting a *high* heritability from a *uniform* environment (low $V_E$) to a *diverse* environment (high $V_E$) overstates genetic influence.
  *   *Reviewer Rule:* "If the source population had more uniform environments (e.g., same school system, same healthcare access) than the target audience, the heritability estimate is likely **higher** in the source than it would be in the target. Do not print the source number as applicable to the target without a clause."

  **Uniform-Cause Check:** You are correct. A factor can be 100% causally necessary (e.g., dietary iodine for IQ) but contribute 0% to variance if everyone gets the same amount. High heritability does not rule out powerful environmental interventions that shift the mean.

  ---

  ### 2. The 15-Minute Decision Procedure

  **Instructions:** Run these steps in order. If any step triggers a **STOP**, terminate the procedure and draft the ruling. If you reach the end, draft the ruling based on the accumulated flags.

  #### Step 1: Identify the Job
  Read the claim. What work is the heritability number being asked to do?
  *   **A:** Describing variance shares in a specific group (e.g., "In this cohort, 40% of variance was associated with genetic differences"). $\rightarrow$ **Proceed to Step 2.**
  *   **B:** Explaining an individual's trait (e.g., "Your risk is 70% genetic"). $\rightarrow$ **STOP.** (Individual-level misreading).
  *   **C:** Explaining a difference between groups (e.g., "Group X differs from Group Y because..."). $\rightarrow$ **STOP.** (Between-group fallacy).
  *   **D:** Predicting intervention success (e.g., "Because it is heritable, treatment won't work"). $\rightarrow$ **STOP.** (Intervention fallacy).

  *Note: Claims often mix Job A with B, C, or D. If Job A is present but B/C/D are used to draw a conclusion, **STOP** on the conclusion. You may salvage Job A with a clause.*

  #### Step 2: Population Specification
  Does the text name the population, time period, and broad environmental context of the estimate?
  *   **Yes:** (e.g., "UK adults born 1950–1960"). $\rightarrow$ **Proceed.**
  *   **No:** (e.g., "Humans," "Children," "Patients"). $\rightarrow$ **STOP.** (Heritability is not a universal constant).

  #### Step 3: Context Match (Portability)
  Is the estimate being applied to a population different from the study sample?
  *   **Same/Similar:** (e.g., Study was US Europeans, claim is about US Europeans). $\rightarrow$ **Proceed.**
  *   **Different:** (e.g., Study was twins, claim is about singletons; Study was 1980s, claim is about 2024; Study was high-SES, claim is general population). $\rightarrow$ **Pass with Mandatory Translation Clause** (see Stock Clauses).
  *   **Unknown:** (Study population not described). $\rightarrow$ **Escalate.**

  #### Step 4: Design Sanity Check
  Does the text state the method used to derive the number?
  *   **SNP-based (GWAS):** $\rightarrow$ **Proceed.** (Note: Usually underestimates total heritability).
  *   **Twin/Family:** $\rightarrow$ **Proceed.** (Note: May inflate due to shared environment).
  *   **Not Stated:** $\rightarrow$ **Escalate.** (You cannot assess reliability without knowing the design).

  #### Step 5: Values vs. Facts
  Does the claim move from "is" (variance description) to "ought" (policy/resource allocation)?
  *   **Pure Description:** $\rightarrow$ **Pass** (or Pass with Clause if Step 3 triggered).
  *   **Policy Prescription:** (e.g., "Therefore fund X," "Therefore stop Y"). $\rightarrow$ **Escalate.** (This is a values judgment masquerading as data. It requires your sign-off and Clinical Lead review).

  ---

  ### 3. Settled vs. Contested Ground

  Mark these distinctions in your internal documentation so reviewers know when they are applying hard rules vs. defaults.

  | Check | Status | Default for Reviewers |
  | :--- | :--- | :--- |
  | **Individual Attribution** | **Settled.** Heritability is a population statistic, not an individual fraction. | If claim implies individual % genetic, **STOP**. |
  | **Between-Group Differences** | **Settled.** Within-group $h^2$ does not explain between-group means (Lewontin's Fallacy). | If claim uses $h^2$ to explain group gaps, **STOP**. |
  | **Intervention Futility** | **Settled.** High $h^2$ does not preclude environmental intervention (e.g., PKU, glasses for myopia). | If claim implies high $h^2$ = intervention useless, **STOP**. |
  | **Twin vs. SNP Estimates** | **Contested.** Twin studies may confound shared environment with genetics; SNP studies miss rare variants. | If Twin: Add clause "includes shared environment effects." If SNP: Add clause "captures common variants only." |
  | **GxE Interaction** | **Contested.** Magnitude of Gene-Environment interaction is debated per trait. | **Default:** Assume interaction exists. If claim ignores it, add clause "estimate assumes no gene-environment interaction." |
  | **Rising Heritability** | **Settled Mechanism, Contested Magnitude.** $h^2$ can rise if environmental variance shrinks. | Accept the trend if cited, but **STOP** any claim that this implies genes became "more important" biologically. |

  ---

  ### 4. Stock Translation Clauses

  Use these verbatim when issuing a **Pass with Mandatory Translation Clause**.

  1.  **For Individual Misreading:**
      > "This figure describes variation across a population, not the proportion of an individual's trait determined by genetics; it does not predict individual risk."
  2.  **For Intervention Futility:**
      > "High heritability does not imply the trait is unchangeable; environmental interventions can still shift the average outcome significantly."
  3.  **For Population Portability:**
      > "This estimate applies to [Specific Population/Year]; it may not hold in populations with different environmental conditions or ancestries."

  ---

  ### 5. Application to Test Cases

  #### Case 1: Education Attainment Press Release
  *Claim:* Heritability rose to 40% across cohorts; therefore differences in exam results mostly come from genes, so extra school funding is unlikely to close the gap.
  *   **Step 1 (Job):** Mix of Job A (variance rose) and Job D (funding won't work).
  *   **Step 2 (Population):** Specifies cohorts (implied).
  *   **Step 5 (Values):** Moves from variance to funding policy.
  *   **Ruling:** **Split Ruling.**
      *   **On the statistic (40% rise):** **Pass with Mandatory Translation Clause (Portability).** The rise in $h^2$ is likely due to environmental uniformity (standardized schooling), not biological change.
      *   **On the policy (funding):** **STOP.**
  *   **Clause:** "This estimate applies to variance within the studied cohorts; it does not predict the effect of changing school funding on average outcomes."
  *   **What the number does not license:** "The number does not license the conclusion that environmental interventions like funding will fail to reduce inequality."
  *   **Why part survives:** You suspected this. The description of variance *within* the cohort is statistically valid (Job A). The policy inference is the error. You can print the stat if you sever the policy conclusion.

  #### Case 2: Clinic Leaflet (BMI)
  *Claim:* BMI is 70% heritable, from which a parent concludes that a dietitian referral is pointless.
  *   **Step 1 (Job):** Job B (Individual/Parent conclusion) and Job D (Intervention futility).
  *   **Step 2 (Population):** Likely unspecified in a leaflet.
  *   **Ruling:** **STOP.**
  *   **Clause:** (Not applicable, claim is killed).
  *   **What the number does not license:** "The number does not license the conclusion that individual dietary changes cannot alter weight."
  *   **Reasoning:** This is the classic intervention fallacy combined with individual misreading. Even if $h^2$ is 70%, the remaining 30% variance + mean-shifting environmental changes (diet) are clinically actionable.

  #### Case 3: Internal Policy Memo (BMI)
  *Claim:* Because BMI is highly heritable, population-level food-environment measures will have limited effect and resources should go to identifying high-risk genotypes instead.
  *   **Step 1 (Job):** Job D (Intervention prediction) and Values (Resource allocation).
  *   **Step 5 (Values):** Explicit resource allocation recommendation.
  *   **Ruling:** **Escalate.**
  *   **Clause:** N/A (Escalated to you/Clinical Lead).
  *   **What the number does not license:** "The number does not license the prioritization of genetic screening over environmental regulation for population health."
  *   **Reasoning:** This is a values question (resource allocation) based on a factual error (intervention futility). While the intervention claim is factually wrong (Stop), the resource allocation is a policy decision that requires your sign-off. However, you should advise the Clinical Lead that the premise (environment measures will have limited effect) is scientifically unsound.

  ### Final Note on Workflow
  If a claim triggers **Escalate**, your reviewers should not draft the full ruling. They should flag the specific step that failed (e.g., "Step 5: Values/Policy") and send it to you. This keeps them within the 15-minute limit. You handle the politics; they handle the statistics.
