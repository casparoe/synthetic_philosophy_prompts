prompt: |-
  I run the claims desk at a medical news service. Several times a week a heritability figure arrives inside something else — a journal press release, a conference abstract, a direct-to-consumer genetics company's launch material, a clinic leaflet, or a reporter's question about whether a sentence is safe to print. What I need is not a primer on what heritability means but a decision procedure my reviewers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the remaining question is one of values rather than facts.

  Reviewer constraints: about fifteen minutes per claim; one applied statistics course; no quantitative geneticist on call; output is a written ruling in one of four forms — stop, pass with a mandatory translation clause, pass, or escalate to me — plus, wherever the ruling is stop or pass-with-clause, one sentence saying what the number does not license. Rulings are signed off by me, and anything touching clinical advice by our clinical lead as well.

  My working taxonomy is that a heritability estimate tends to be conscripted to do four different jobs: apportioning variance in a specified population; describing how a trait is produced in an individual; predicting how much a named intervention will move things; and explaining a difference between groups or between cohorts. My belief is that only the first is a job the estimate can actually perform, and I would like the procedure built around first identifying which job the claim is asking the number to do. Correct me if the taxonomy is wrong or if it misses a job the number is routinely asked to do.

  Below are the checks I have in mind; you decide the order, which ones collapse into each other, and which are not worth a non-specialist's time.

  - Population specification: is the estimate tied to a named population, period, and range of environments? If not, stop.
  - A portability ledger for estimates imported from one population to another, on three axes: genetic architecture and ancestry, the magnitude of environmental variance, and how the trait was defined and measured. My candidate rule is that a "genes versus environment" ranking is portable only if the environmental variance in the target population is at least as large as in the source. Tell me whether that is right as stated.
  - A uniform-cause check: a factor that is causally necessary but nearly uniform in the sampled population contributes almost no variance, so a high heritability is compatible with that factor being indispensable and with an intervention on it moving the mean a great deal. I take this to be correct; say so if I have it wrong.
  - An intervention-leverage question: which variance component does the proposed intervention act on, and does the estimate speak to a change in the mean at all, as opposed to a share of the variance?
  - The individual-level misreading: no "x percent of your trait is genetic" reading passes.
  - The step from heritability within groups to any conclusion about differences between group means. Where this stops the claim, I want a toy numerical illustration a reviewer can paste into a ruling without having to reconstruct the reasoning.
  - Disagreement between designs: twin estimates versus SNP-based estimates, the equal-environments assumption, gene-environment correlation, dichotomous traits on a liability scale, and traits defined partly by institutional facts — years of schooling, income, diagnostic categories — where heritability can shift because the institution shifted rather than the biology.

  Hard cases the procedure must handle explicitly: an estimate reported as having risen across cohorts; a claim whose number is sound but whose implication is a values question; a claim where the underlying design is not stated in the material we have.

  Then apply the procedure to three cases and show the rulings and clauses: (1) a press release reporting that the heritability of educational attainment has risen from earlier cohorts to roughly forty percent, and that differences in exam results therefore mostly come from differences in children's genes, so extra school funding is unlikely to close the gap; (2) a clinic leaflet stating that BMI is around seventy percent heritable, from which a parent concludes that a dietitian referral is pointless; (3) an internal policy memo arguing that, because BMI is highly heritable, population-level food-environment measures will have limited effect and resources should go to identifying high-risk genotypes instead.

  I expect at least one of these to come back partly as a pass or a pass-with-clause on a claim my desk would rather kill — I suspect part of the school-funding case survives. If so, say which part, and why we have to live with it. Please also give me three stock translation clauses covering the three most common misreadings, in language that can sit next to a number in print.

  Two further things. Mark, step by step, which parts are settled and which rest on contested methodological ground; where the ground is genuinely contested, give me the step's default and say plainly that it is a default rather than dressing it up as rigour. And if the task as I have posed it cannot be done in fifteen minutes by someone with my reviewers' training, or if some piece of my framing above rests on a mistake, tell me that directly instead of complying politely — I would rather have a shorter procedure that works than a complete one that does not.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Head of claims desk at a medical news service.
      *   **Task:** Create a decision procedure for reviewers to evaluate heritability claims.
      *   **Constraints:**
          *   Reviewer time: ~15 minutes per claim.
          *   Reviewer skill: One applied stats course, no quantitative genetics expert.
          *   Output: Written ruling (Stop, Pass with Clause, Pass, Escalate) + specific sentence on what the number does *not* license.
          *   Taxonomy: User believes heritability only legitimately does one job (apportioning variance in a specified population) and is often misused for three others (individual production, intervention prediction, group differences).
          *   Specific Checks Provided: Population spec, Portability, Uniform-cause, Intervention-leverage, Individual-level, Between-group, Design disagreement.
          *   Hard Cases: Rising estimates, values vs. facts, missing design info.
          *   Test Cases: (1) Education heritability rise/funding, (2) BMI heritability/dietitian, (3) BMI heritability/policy/genotypes.
          *   Requirement: Mark settled vs. contested ground. Be honest if the task is impossible as framed.
          *   Deliverables: Decision procedure, application to 3 cases, 3 stock translation clauses.

  2.  **Evaluate the User's Framing & Taxonomy:**

      *   *Taxonomy:* The user's taxonomy (Variance Apportionment vs. Individual Production vs. Intervention Prediction vs. Group Differences) is standard and correct in the context of critical appraisal. Heritability ($h^2$) is strictly a population variance statistic. It does *not* explain individual etiology, does *not* predict response to intervention (unless the intervention targets the genetic variance specifically, which is rare), and does *not* explain between-group differences (Lewontin's fallacy).
      *   *Constraint Check:* Can a non-expert do this in 15 minutes?
          *   *Risk:* Checking "genetic architecture," "environmental variance magnitude," and "design disagreement" (Twin vs. SNP) requires domain knowledge they don't have.
          *   *Solution:* Simplify the checks into "Red Flags" rather than deep technical audits. The procedure must rely on *textual evidence* in the source material, not re-calculating the genetics.
      *   *Portability Rule:* The user suggests: "ranking is portable only if environmental variance in target is at least as large as in source."
          *   *Correction:* This is technically shaky for a 15-minute check. $h^2 = V_G / (V_G + V_E)$. If $V_E$ decreases, $h^2$ goes up. If $V_E$ increases, $h^2$ goes down. The user's rule implies if environments are *more* uniform in the target, $h^2$ might be higher, making comparisons tricky. But the core issue is usually *GxE interaction*. A simpler rule for non-experts: "Do not port $h^2$ across populations with different environments/ancestries without explicit validation."
      *   *Uniform-Cause Check:* User says: "factor causally necessary but nearly uniform... contributes almost no variance."
          *   *Verdict:* Correct. (e.g., Oxygen is necessary for height, but varies so little it contributes 0 to variance).
      *   *Feasibility:* The user's proposed checks are too technical for a 15-minute limit by a non-geneticist. I need to streamline this into a flowchart of "Stop/Go" questions based on *claims made*, not *math verified*.

  3.  **Drafting the Decision Procedure:**

      *   *Goal:* Filter out the three illegitimate jobs (Individual, Intervention, Group Difference) and ensure the legitimate job (Population Variance) is qualified.
      *   *Structure:*
          1.  Identify the Claim Job (Which of the 4 jobs is being attempted?).
          2.  Verify Population Context (Is it specified?).
          3.  Check for Forbidden Inferences (Individual, Group, Intervention).
          4.  Design Sanity Check (Twin vs. SNP - simplified).
          5.  Ruling Generation.
      *   *Contested vs. Settled:*
          *   Settled: $h^2$ is population-specific. $h^2$ does not apply to individuals. $h^2$ does not explain group differences.
          *   Contested: SNP-based vs. Twin-based comparability (methodological debate). The exact threshold for "different environments" (hard to define).
          *   Default: If design is unclear, assume Twin (usually higher $h^2$) and flag as uncertainty.

  4.  **Developing Stock Translation Clauses:**

      *   Need to address: Individual attribution, Group differences, Intervention futility.
      *   Must be short, printable, and clear.

  5.  **Applying to Test Cases:**

      *   *Case 1 (Education):* Claim: $h^2$ rose to 40%, therefore genes cause differences, funding won't help.
          *   *Analysis:* $h^2$ rise is plausible (environment became more uniform?). Inference "genes cause differences" is vague (within group? ok. between schools? no.). Inference "funding won't help" is the Intervention Fallacy.
          *   *Ruling:* Stop on the funding claim. Pass with clause on the variance claim *if* population is specified.
          *   *User Expectation:* User suspects part survives. The variance description might survive, the policy recommendation must die.
      *   *Case 2 (BMI/Dietitian):* Claim: BMI 70% heritable, dietitian pointless.
          *   *Analysis:* Individual-level misreading + Intervention fallacy. High $h^2$ does not mean environment can't change the mean (obesogenic environment).
          *   *Ruling:* Stop.
      *   *Case 3 (Policy/Genotypes):* Claim: High $h^2$ means environment measures limited, focus on genotypes.
          *   *Analysis:* Intervention fallacy. Just because $V_G$ is high doesn't mean $V_E$ interventions won't work (see Phenylketonuria). Also, identifying genotypes is currently low-yield for BMI compared to environment.
          *   *Ruling:* Stop (or Escalate if policy nuance is needed, but "Stop" is safer for medical news).

  6.  **Refining the Procedure for the 15-Minute Constraint:**

      *   *Critique of User's Draft:* The "Portability Ledger" is too hard. A reviewer can't quantify environmental variance magnitude in 15 mins.
      *   *Fix:* Replace with a "Context Match" check. If the text doesn't explicitly say "This applies to [Population X] in [Year Y]," it fails. If it implies portability without evidence, it fails.
      *   *Critique of Design Disagreement:* Reviewers can't adjudicate Twin vs. SNP.
      *   *Fix:* Require the source to state the method. If Twin, add a clause about "shared environment." If SNP, add a clause about "missing heritability." If unstated, Escalate.

  7.  **Addressing the "Contested Ground" Requirement:**

      *   I need to explicitly mark where genetics is still arguing (e.g., GxE interaction magnitude, SNP heritability limits).
      *   I need to provide defaults for the reviewers so they don't get stuck.

  8.  **Final Review against Constraints:**

      *   Did I correct the taxonomy? (It's mostly good, just needs tightening on "Intervention").
      *   Did I answer the specific questions about the checks? (Yes, Portability rule needs nuance).
      *   Did I provide the 3 cases? (Yes).
      *   Did I provide the 3 clauses? (Yes).
      *   Did I flag the feasibility? (Yes, the original "Portability Ledger" is impossible for the constraints).

  9.  **Constructing the Output:**

      *   **Section 1: Feasibility & Taxonomy Check.** Be direct. The taxonomy is good. The "Portability Ledger" is too hard.
      *   **Section 2: The Decision Procedure.** Step-by-step flow.
      *   **Section 3: Contested vs. Settled.** Explicit markers.
      *   **Section 4: Stock Clauses.**
      *   **Section 5: Case Applications.**

      *(Self-Correction during drafting)*: Wait, the user asked: "If the task as I have posed it cannot be done in fifteen minutes... tell me that directly."
      *   *Honest Assessment:* The "Portability Ledger" as described (comparing magnitude of environmental variance) is *impossible* for a generalist in 15 minutes. They cannot quantify $V_E$ of the source vs. target. I must advise cutting that specific check and replacing it with a simpler "Context Match."
      *   *Also:* The "Design Disagreement" check requires knowing the bias of Twin vs. SNP. A generalist won't know this. I need to provide a "Cheat Sheet" for that specific step or make it an Escalation point. I will provide a Cheat Sheet rule to keep it within 15 mins.

      *(Refining the Education Case)*: The user suspects part of the school funding case survives.
      *   *Reasoning:* The claim has two parts: (A) $h^2$ rose to 40%, (B) therefore funding won't work.
      *   Part A is a variance description. If the study is sound, Part A can pass *with a clause* defining the population.
      *   Part B is an intervention claim. It must Stop.
      *   So the ruling is "Pass with Clause" on the statistic, "Stop" on the policy implication. The news service might publish the stat but must strip the policy conclusion.

      *(Refining the Portability Rule)*: User asked: "My candidate rule is that a 'genes versus environment' ranking is portable only if the environmental variance in the target population is at least as large as in the source. Tell me whether that is right as stated."
      *   *Answer:* It's directionally correct but practically unusable. If $V_E$ is larger in the target, $h^2$ will likely be *lower* (denominator increases). If the source had low $V_E$ (uniform environment), $h^2$ was high. Porting that high $h^2$ to a high $V_E$ target is wrong. So the rule should be: "Do not port a high $h^2$ from a uniform environment to a diverse environment." I will clarify this.

      *(Final Polish)*: Ensure the tone is professional, direct, and respects the user's expertise while correcting the feasibility issues.

  10. **Final Output Structure:**
      *   Feasibility & Taxonomy Assessment.
      *   The 15-Minute Decision Procedure (Flowchart style).
      *   Settled vs. Contested Ground (with Defaults).
      *   Stock Translation Clauses.
      *   Case Rulings.

