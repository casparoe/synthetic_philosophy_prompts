answer: |-
  **1. The Physiological Signature**
  You argue that in pain asymbolia the imperative command is absent, not just the reaction to it. In my lab, we treated the affective component as a physiological event: electrodermal spikes, heart rate acceleration, pupil dilation. If the command is genuinely missing in these patients, not just their report of it, which of those autonomic markers should disappear alongside their verbal report?

  *   **Follow-up:** [If she says first-person report is authoritative and third-person measures are irrelevant:] If the command is a *bodily* register, as you claim, why does the body's own telemetry not count as evidence of its presence? If the autonomic system still reacts, on what grounds do you say the command is gone?
  *   **Satisfactory Answer:** She must identify a specific physiological correlate that vanishes in asymbolia, or explain why a "bodily command" leaves no bodily trace without retreating to pure introspection.

  **2. The Behavioral Threshold**
  Let's move to operant conditioning. We could train a rat to press a lever to delay a shock, establishing a cost it will pay to avoid pain. Asymbolic patients withdraw reflexively but won't learn to avoid the stimulus if it costs effort. Is the failure to learn the absence of the command, or merely the absence of the motivation to obey it?

  *   **Follow-up:** [If she says report is the only criterion for the command's existence:] Then the command is not driving the behavior; the report is driving your theory. If the patient won't work to stop the stimulus, why call it a command rather than a broken link between sensation and desire?
  *   **Satisfactory Answer:** She must explain the dissociation between reflex withdrawal and learned avoidance without making the "command" redundant to the desire to avoid.

  **3. The Mirror-Image Possibility**
  Consider the reverse dissociation: a patient who cannot localize a stimulus or scale its intensity, yet is wretched and works hard to make it stop. If pain is an imperative to protect, this subject has the command without the sensory content. Do you accept this case is conceptually possible?

  *   **Follow-up:** [If she says the case is impossible because the command is individuated by the body part:] If the command requires sensory content to target a body part, then the sensory content is constitutive of the pain. How is this an imperative theory and not a sensory theory with extra steps?
  *   **Satisfactory Answer:** She must explain how a command can target "here" or "this limb" without sensory information specifying where "here" is.

  **4. The Asymmetry of Dissociation**
  You accept asymbolia (sensation without suffering) as a discovery, but you reject the mirror case (suffering without sensation) as impossible. Why is the dissociation permissible in one direction but a conceptual error in the other?

  *   **Follow-up:** [If she says the command needs a sensorimotor situation to exist:] Then damage to the sensory system should abolish the command, just as damage to the insula does. Why does insular damage kill the command while sensory damage supposedly cannot?
  *   **Satisfactory Answer:** She must provide a principled reason why the sensory component is detachable from the imperative, but the imperative is not detachable from the sensory.

  **5. Graded Badness**
  Under hypnosis or placebo, subjects report normal intensity but significantly reduced unpleasantness. If the badness of pain is the issuing of the command, are these subjects literally experiencing less bad pain, or just caring less about the same pain?

  *   **Follow-up:** [If she distinguishes phenomenal badness from caring:] If the command *is* the badness, and suggestion weakens the command, then suggestion changes the reality of the pain's badness. Are you prepared to say the badness of pain is hostage to our suggestibility?
  *   **Satisfactory Answer:** She must clarify whether the "command" is an objective state that varies with suggestion, or a subjective interpretation that varies with caring.

  **6. The Mechanism of Modulation**
  If a sugar pill can dampen the imperative command, the command must be downstream of cognitive evaluation. Does this mean the command is not a primary sensory signal, but a secondary judgment about that signal?

  *   **Follow-up:** [If she says the badness is intrinsic but modifiable:] If it is intrinsic, why does it yield to expectation? If it yields to expectation, it looks like a cognitive appraisal. What remains of the "imperative" that isn't just an evaluation?
  *   **Satisfactory Answer:** She must locate the command in the processing stream such that it is bodily yet modifiable by cognition without becoming a mere judgment.

  **7. The Obedience Problem**
  Asymbolic patients still withdraw from noxious stimuli. On your view, a command is being issued and obeyed. If the command is obeyed, what is missing that makes the state no longer bad?

  *   **Follow-up:** [If she says a second-order desire is missing:] If the missing element is the subject's desire for the command to be satisfied, then the badness lies in the desire, not the command. Why isn't this just a desire theory wearing imperative vocabulary?
  *   **Satisfactory Answer:** She must identify the source of the "badness" that is distinct from both the command itself and the subject's attitude toward the command.

  **8. The Global Motivational Condition**
  Is the command sufficient to motivate, or does it require a global background state of "caring" to function as pain? If it requires background caring, is the pain in the command or in the background state?

  *   **Follow-up:** [If she says the command itself provides the motivation:] Then the asymbolic patient should be motivated to avoid the stimulus in a robust way, not just reflexively. Since they are not, the command is not doing the work you claim.
  *   **Satisfactory Answer:** She must explain how the command motivates withdrawal without motivating avoidance, or admit the motivation comes from elsewhere.

  **9. Generalization to Other States**
  Does your imperative structure apply to nausea, itch, or air hunger? Do these states issue commands to stop, withdraw, or protect?

  *   **Follow-up:** [If she says these are derivative or lack genuine imperative content:] If they lack imperative content, why do they feel like urges? If they have it, why is pain the philosophical paradigm? You cannot build a general theory on a special case.
  *   **Satisfactory Answer:** She must either generalize the theory to cover these states consistently or defend pain's privilege without arbitrariness.

  **10. Pain's Privilege**
  If nausea and grief also issue commands, what precisely sets pain apart? Is it the modality, the urgency, or the type of command?

  *   **Follow-up:** [If she says the others are less paradigmatic:] Then your theory explains the paradigm by appealing to the paradigm. I need to know what feature of the neural processing makes pain an imperative and itch something else.
  *   **Satisfactory Answer:** She must identify a structural or functional difference between pain and other aversive states that justifies the theoretical distinction.

  **11. Falsification**
  I want a concrete experimental design. If I stimulate the insula in a neurosurgical patient and they report pain but show no autonomic arousal or withdrawal, does that falsify your view?

  *   **Follow-up:** [If she gives a promissory note about future research:] I need a commitment now. If the command is bodily, it must have a bodily signature. If I show you a command without a signature, will you abandon the theory?
  *   **Satisfactory Answer:** She must commit to a specific empirical outcome that would force her to reject the imperative theory.

  **12. The Normative Closing**
  If the commanding layer is detachable from the sensory one, and asymbolic patients lack that layer, is their life missing anything of moral importance? Should we pity them?

  *   **Follow-up:** [If she says they are missing something vital:] If the badness is the command, and they lack the command, on what grounds do we pity them? If we pity them, then the badness isn't just the command.
  *   **Satisfactory Answer:** She must reconcile her theory with the moral intuition that asymbolic patients are deprived of something significant, without contradicting her definition of pain's badness.
