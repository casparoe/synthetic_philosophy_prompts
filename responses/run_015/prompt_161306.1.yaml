  Build me that case. Constraints on the scenario: one paragraph of ordinary life, no science fiction and no exotic apparatus; three options and a sequence of at least four decision nodes; stakes a few hundred dollars in total; the counterparty may be no cleverer than a shrewd small businessman, must possess no information the agent lacks, must take no risk, and must turn a real profit out of explicit, itemized fees rather than out of hidden spreads or price movements. Give me the numbers so the drain is checkable arithmetic.

  Constraints on the preference structure. At every node the agent's preferences over the three options must be complete and transitive, so no synchronic incoherence is available to explain what happens. Her preferences must nonetheless change across the sequence, and two further conditions must hold. First, she foresees every change correctly at the outset: there is no surprise. Second, each change must be what I'll call cross-temporally ratified, meaning that at every other node the agent accepts that the change was the correct thing to do given the preferences in force at the node where it was made, so that no time-slice regards any other time-slice's choice as an error. I want the changes to be responses to altered circumstance or matured taste rather than to factual news she could have gathered earlier, since learning would give the objector an easy way out.

  Now the three verdicts I need the case to generate, from the standard three-fold taxonomy of choice over time. The myopic chooser is drained: end her with what she began with, minus money, and say how much. The resolute chooser avoids the drain, but only by paying in a different currency: the case must contain at least one later node at which she knowingly declines a switch that is available to her and that she prefers by her own then-current lights, and the cost of that refusal must be real rather than nominal. The sophisticated chooser — backward induction over the whole foreseen tree, on the assumption that her later selves choose the same way — must also be drained, and must come out no better than the myopic chooser. That last one is the direction I find hard to construct and the reason I'm asking: in the usual telling, foresight is the escape hatch from the pump, so I need the mechanism that defeats it to be structural rather than a matter of the agent's being dim or perverse. If you think one of these three verdicts cannot be produced without smuggling in a stipulation that does the work itself, tell me which one and why rather than quietly fudging it; I would rather have an honest failure report than a case that only looks like it fits.

  After the scenario, walk me through the tree node by node for each of the three choosers: what she does at each node, why, and what her net position is at the end. Then tell me which single structural feature of the case is doing the work, and run two ablations on it. In the first, drop the cross-temporal ratification and let one change be one the agent herself later disowns; I expect the case to collapse into a textbook pump against unstable preferences, and I want to see whether it does. In the second, make the terminal holding the only thing that matters, so that nothing of value is consumed along the way; I want to know whether sophistication then escapes, and what that tells me about why it failed before. Finally, give me the strongest attack available to someone who wants exploitability to entail irrationality — I take it she will locate the failure at the level of plans rather than at the level of local preferences, or argue that the fees are simply payment for a service rendered, or both — state it as sympathetically as you can, and give me your assessment of whether it rescues the argument or merely relocates it. Close with one sentence on what you take the case to have established about diachronic rationality.

  Please write your reply as continuous prose, the way you would write a long email to a colleague: no headings, no bullet points, no bold text, and no tables.
