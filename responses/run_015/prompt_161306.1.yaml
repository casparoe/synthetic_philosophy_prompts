answer: |-
  Dear Colleague,

  Here is the case you requested, constructed to isolate the structural features of diachronic exploitability without relying on synchronic incoherence or local error. Imagine a client renting prints from a small gallery for a single day to decorate a room with large windows, starting with Print A in the morning. The gallery owner offers three specific prints, A, B, and C, and allows switches at four decision nodes corresponding to the changing natural light: Morning, Noon, Evening, and Night. The fees are explicit and itemized at one hundred dollars per switch, payable immediately, and the owner takes no risk and possesses no private information about the client's tastes, only the schedule of light changes. The client's preferences are complete and transitive at every node but shift with the light: in the Morning she strictly prefers B to A, at Noon she strictly prefers C to B, in the Evening she strictly prefers A to C, and at Night she is content to keep whatever she holds. These preference changes are fully foreseen at the outset and cross-temporally ratified because she views each shift as a correct response to the altered lighting conditions rather than an error or a whim, meaning no time-slice disowns the preferences of another. She begins the day holding Print A and ends the day holding Print A, but the sequence of switches required to satisfy her changing tastes across the four nodes involves three transactions totaling three hundred dollars in fees.

  Let us walk through the decision tree for each of the three choosers to verify the verdicts. The myopic chooser evaluates each node in isolation using only her current preferences. At the Morning node, she prefers B to A and pays the one hundred dollar fee to switch. At the Noon node, she prefers C to B and pays another one hundred dollars to switch. At the Evening node, she prefers A to C and pays a final one hundred dollars to switch back. At the Night node, she keeps A. She ends the day with Print A, exactly what she began with, but she is three hundred dollars poorer, having been drained by the sum of the fees. The resolute chooser adopts a plan at the outset to avoid the drain and sticks to it regardless of her changing local preferences. She begins with A and, upon reaching the Morning node, she knows she currently prefers B but refuses the switch to maintain her plan. She knowingly declines a switch that is available and that she prefers by her own then-current lights, incurring a real cost in the form of sub-optimal decoration for the morning hours. She continues to decline switches at Noon and Evening, ending with Print A and her original capital intact, having avoided the monetary drain only by paying in the currency of satisfied preference. The sophisticated chooser performs backward induction from the Night node, anticipating her future choices based on her future preferences. She knows that if she reaches the Evening node with C, she will switch to A for one hundred dollars. She knows that if she reaches the Noon node with B, she will switch to C for one hundred dollars, leading to the evening switch. She calculates at the Morning node that switching to B will trigger this cascade, costing three hundred dollars in total and returning her to A. However, because she values the optimal decoration during each period more than the cumulative fees, she determines that the utility of the journey outweighs the monetary loss. She chooses to switch at Morning, anticipating the subsequent switches, and ends the day with Print A and minus three hundred dollars, coming out no better than the myopic chooser in terms of monetary retention.

  The single structural feature doing the work here is the distribution of value across intermediate holdings rather than solely in the terminal state. In this scenario, the agent derives utility from holding the preferred print during each specific lighting condition, so the cycle is not a closed loop of zero value but a path of positive consumption that happens to return to the start asset. This is confirmed by the two ablations. In the first ablation, if we drop cross-temporal ratification and allow the agent to view her future preference changes as errors she should prevent, the case collapses into a textbook pump against unstable preferences where the sophisticated agent would attempt to bind her future self or stop the sequence to avoid funding her own predicted mistakes, thereby locating the failure in the instability itself rather than the structure. In the second ablation, if we make the terminal holding the only thing that matters so that nothing of value is consumed along the way, the sophisticated chooser immediately escapes the drain because the calculation at the Morning node becomes a comparison between keeping A for free versus ending with A minus three hundred dollars, leading her to refuse the first switch and proving that sophistication fails only when intermediate consumption justifies the fees locally even if it drains funds globally.

  The strongest attack available to someone who wants exploitability to entail irrationality is to argue that the failure is located at the level of plans rather than local preferences, asserting that a rational agent must adopt a global plan that maximizes utility over the entire timeline and that the fees are simply payment for a service rendered which the agent should have recognized as net-negative ex ante if the terminal state is identical. This opponent would claim that the sophisticated agent's failure to commit to the zero-fee plan constitutes a diachronic inconsistency that is itself a rational failure, relocating the defect from the local choices to the absence of a binding global strategy. My assessment is that this attack merely relocates the problem without solving it, because if every local choice is ratified and maximizes utility given the constraints of the moment, demanding a global plan that overrides those local maxima requires a normative principle that privileges temporal neutrality over local responsiveness, which is precisely what the case calls into question. I take the case to have established that diachronic rationality cannot be defined merely as immunity to monetary extraction when preferences change in foreseen and ratified ways.
