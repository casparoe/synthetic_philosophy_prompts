answer: |-
  **Research Proposal: Participatory vs. Representational Standing in Cases of Hypocritical Blame**

  **Research Question**
  To what extent does moral hypocrisy erode participatory standing while preserving representational standing within institutional hierarchies?

  **Context and Gap in Current Literature**
  Contemporary philosophical discourse on standing to blame largely operates under a monolithic conception of moral authority. Dominant accounts suggest that hypocrites forfeit standing entirely because their own violations negate their right to hold others accountable. While some recent work nuances this by appealing to the severity of the hypocrisy, few accounts distinguish between the *source* of the blamer's authority. Specifically, existing literature overlooks the dual role occupied by institutional actors: they are both participants in the normative practice they enforce (participatory standing) and agents positioned to speak on behalf of the institution or the directly wronged (representational standing). By treating standing as a single binary status, current theories fail to explain why we often resent a hypocrite's blame yet still acknowledge its validity when issued by figures such as teachers or parents. This project seeks to address this gap by disaggregating standing into these two distinct categories.

  **Methodology**
  This project will employ a comparative case method rather than relying solely on abstract intuition pumps. I will examine paired institutional cases—for instance, a teacher who plagiarises yet grades student work, contrasted with a parent who lies yet corrects a child's dishonesty. This approach is preferable to abstract theorising because intuition pumps often strip away the structural context necessary to evaluate representational authority. Abstract cases tend to focus on interpersonal equality, whereas institutional cases reveal how role-based obligations can sustain standing even when personal moral credibility is compromised. By analysing these pairs, I can isolate whether the objection to hypocritical blame stems from the blamer's participation in the norm or their representation of the victim.

  **Criteria for Success and Failure**
  Success will be defined by the formulation of a clear predictive criterion that delineates when hypocrisy erodes participatory standing but leaves representational standing intact. A successful outcome will demonstrate that institutional hypocrites retain authority only when blaming in their capacity as representatives, not as co-participants. Conversely, failure will be defined by the collapse of this distinction; if the analysis shows that representational standing inevitably depends on participatory integrity, or if the distinction fails to illuminate why we accept blame from specific institutional hypocrites, the hypothesis will be deemed untenable.

  **Scope Assessment**
  This project is designed for independent completion over six weeks by a sixth-form student without access to external archives. The scope is limited to conceptual analysis and the evaluation of secondary literature available through school libraries and open-access journals. I will not attempt to resolve the meta-ethical foundations of standing but will focus strictly on the applicability of the proposed distinction to institutional cases. This ensures the project remains feasible while allowing for sufficient depth to produce a rigorous philosophical argument.
