prompt: |-
  I'm drafting a proposal for a three-month philosophy-of-mind research stipend. I want to investigate whether pain asymbolia undermines the thesis that pain is essentially bad. Frame the central question precisely: do asymbolic patients' sincere reports that pain still hurts indicate retention of a thin phenomenal badness, or do they show that an evaluative concept has become detached from its normal motivational and affective scaffolding? Explain why the familiar sensory-versus-affective taxonomy in the pain literature fails to settle this—specifically, because both camps assume that either phenomenal quality or motivational force must carry the badness, leaving no room for a decoupled evaluative judgment that tracks the sensory state without being intrinsically aversive. Propose an approach that distinguishes two rescue strategies for the intuition that asymbolic pain remains bad: a phenomenal residue strategy that locates badness in a minimal hedonic tone that survives decoupling, and a counterfactual dependence strategy that grounds badness in what the patient would avoid if their full aversive architecture were intact. Describe what progress would look like—ideally, demonstrating that the two strategies either converge on the same phenomenological prediction or diverge in a way that can be assessed through first-person report structures—and state clearly what would count as failure, such as the distinction collapsing into mere verbal disagreement with no substantive philosophical payoff. Give an honest assessment of scope for a three-month independent project. Do not include a bibliography, reading list, or citations; I will add those myself. Write the proposal in polished, formal American English, and keep it to no more than 500 words.
