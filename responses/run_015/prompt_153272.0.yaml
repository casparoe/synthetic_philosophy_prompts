      *   *Key Insight:* The "Arbitration Gap" isn't a scientific gap; it's a metaphysical demand. Side B wants to know how *subjectivity* emerges from *objectivity*. Side A says subjectivity is just a specific kind of objective process.

  8.  **Refining the "Arbitration Gap" point:**
      *   Side B asks: "Who gets the winning draft?"
      *   Side A answers: "No one. The winning draft *is* the state of the system that controls speech/action."
      *   Side B retort: "But who *feels* it?"
      *   Side A retort: "The feeling is the draft's influence."
      *   *Diagnosis:* Side B assumes experience is a *relation* (subject experiencing object). Side A assumes experience is a *property* of the process itself.

  9.  **Final Polish:** Ensure I answer the specific prompt questions (verbal vs. substantive, mechanism vs. phenomenology, is progress possible?).
