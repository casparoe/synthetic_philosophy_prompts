prompt: |-
  I'm a novelist working on this strange book about interioraty—sorry, interiority—and I got invited to speak next week at an interdisciplinary seminar on narrative and cognition, which is way outside my usual crowd. I was discussing this with my friend who writes poetry and she said I was being pretentious, but I think there's something real here. I've become obsessed with Dennett's heterophenomenology, the idea that we treat first-person reports of mental states not as direct windows into real conscousness but as texts describing fictional worlds—heterophenomenological worlds that exist only in the report. My thesis for the talk is that this scientific method is actually the correct aesthetic framework for writing convincing characters: instead of pretending we're describing real mental states inside people, we should treat a character's self-reports as constructing a coherent fictional mental world, which explains why unreliable narrators feel more truthful than omniscient ones. The audience will be mostly literary theorists who think consciousness studies is just neuroscience with delusions of grandeur, plus two cognitive scientists who actually read Dennett and will call me out if I misrepresent the method. I need a prep sheet for the objections. Give them to me in roughly the order they'll come—first the literary people complaining that I'm killing the emotional soul of fiction with mechanistic language, then the scientists saying I'm misusing an empirical tool for literary fluff. For each one, tell me what I should concede up front (probably that fiction isn't science and I'm not claiming it is) and what I should hold onto (that the structural parallel between methodological bracketing and narrative distance is genuinely illuminating). Point out the weakest point in my own argument—probably that heterophenomenology was designed to avoid ontological commitments about mental states, whereas fiction thrives on making exactly those commitments about characters? And include the objection I'm praying nobody raises: whether this makes all emotional identification with characters impossible, reducing literature to anthropology of imaginary beings.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist working on a book about "interiority."
      *   **Context:** Invited to speak at an interdisciplinary seminar on narrative and cognition.
      *   **Conflict:** Friend (poet) calls them pretentious; user believes there's substance to their idea.
      *   **Core Thesis:** Daniel Dennett's *heterophenomenology* (treating first-person reports as texts describing a fictional world, not direct access to reality) is the correct *aesthetic* framework for writing convincing characters. Unreliable narrators feel more truthful than omniscient ones because they acknowledge the constructed nature of the "heterophenomenological world."
      *   **Audience:** Mostly literary theorists (skeptical of neuroscience/cog sci) + Two cognitive scientists (Dennett-literate, will catch misrepresentations).
      *   **Task:** Create a prep sheet for objections.
      *   **Structure:** Order of objections (Literary first, then Scientific). For each: Concession vs. Hold. Identify the weakest point in the argument. Include the "prayer" objection (emotional identification).
      *   **Tone:** Professional, insightful, slightly empathetic to the novelist's position but rigorous enough for the seminar.

  2.  **Deconstruct the Core Argument:**
      *   *Dennett's Heterophenomenology:* We don't assume the subject's report is true about the world/brain. We treat the report as a text. The "world" described in the text is the "heterophenomenological world." We bracket the question of whether that world *actually* exists in the brain.
      *   *User's Application:* Novelists shouldn't pretend to access real minds (omniscience). They should present self-reports (narration) that construct a coherent fictional mental world. This makes unreliable narrators more "truthful" (honest about the construction).
      *   *Tension:* Science brackets ontology (does the mental state exist?) to study it objectively. Fiction *creates* ontology (this character exists, this feeling is real within the story) to evoke empathy.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Literary Theorists (The "Soul" Argument).*
          *   *Concern:* Reducing art to method kills the magic. "Mechanistic language."
          *   *Concession:* Yes, fiction isn't a lab report. Emotion matters.
          *   *Hold:* The *structure* of how we believe a character is the same structure as how we interpret a report.
          *   *Refinement:* Focus on "affective resonance" vs. "structural validity."

      *   *Objection 2: The Cognitive Scientists (The "Misuse" Argument).*
          *   *Concern:* Heterophenomenology is an empirical tool to solve the hard problem/avoid dualism. Using it for aesthetics is category error.
          *   *Concession:* I'm not doing science. I'm using a metaphor/framework.
          *   *Hold:* The epistemological problem is the same: How do we know another mind?
          *   *Refinement:* Acknowledge Dennett's intent but argue for the utility of the *stance*.

      *   *Objection 3: The Weakest Point (Ontology).*
          *   *Analysis:* Dennett brackets reality to avoid dualism. Fiction *requires* us to believe in the reality of the character's pain to cry. If we treat it *only* as a text, do we lose the stake?
          *   *Formulation:* The "Ontological Commitment" gap. Science says "maybe nothing is there." Fiction says "pretend something is there."

      *   *Objection 4: The "Prayer" Objection (Empathy/Identification).*
          *   *Concern:* If characters are just texts describing fictional worlds, how do we feel for them? Does this turn reading into cold analysis?
          *   *Response:* Empathy *is* the act of entering the heterophenomenological world. It doesn't require the world to be biologically real, just narratively coherent.

  4.  **Structuring the Prep Sheet:**
      *   Title: Professional and clear.
      *   Introduction: Acknowledge the high stakes and the specific dynamic.
      *   Section 1: The Literary Theorists (Humanists).
      *   Section 2: The Cognitive Scientists (Empiricists).
      *   Section 3: The Weakest Link (Ontology).
      *   Section 4: The "Prayer" Objection (Empathy).
      *   Closing Advice: Tone and delivery.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address the friend's comment about pretentiousness? *Adjustment:* Add a note in the intro about grounding the talk to avoid that vibe.
      *   *Check:* Is the Dennett stuff accurate? *Adjustment:* Ensure the distinction between the "heterophenomenological world" and the "real world" is clear.
      *   *Check:* Is the order right? *Adjustment:* Yes, Humanities usually speak first in these Q&A dynamics, or at least voice the "spirit of the art" concern before the "rigor of the science" concern.
      *   *Check:* The "Unreliable Narrator" point. *Adjustment:* Make sure to link this specifically to why unreliable narrators work better under this model (they expose the textuality).

  6.  **Final Polish:**
      *   Ensure the tone is supportive but critical (like a good editor or coach).
      *   Make the "Concede/Hold" format distinct and actionable.
      *   Highlight the "Weakest Point" clearly as requested.

  7.  **Final Review against constraints:**
      *   Order: Literary -> Scientific.
      *   Include Concede/Hold for each.
      *   Identify weakest point.
      *   Include the "prayer" objection.
      *   Context: Novelist speaking to mixed crowd.

