      *   *Case 2 (Grant $25k):* Parasite treatment. Randomized evaluations. Handful of deaths averted.
          *   *Feature:* High confidence, low variance, proven mechanism, modest payoff.
      *   *Case 3 (Grant $12k):* Engineering mechanism. 5% chance of working. 1,000 severe illnesses spared.
          *   *Feature:* Speculative but defined mechanism, independent verification (engineer), moderate probability, moderate-high payoff. EV = $0.05 \times 1000 = 50$ lives (roughly).
      *   *Case 4 (Grant $4k + Refusal):* Scoping review -> Lukewarm -> No full grant.
