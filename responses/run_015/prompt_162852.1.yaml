      *   *Let's go with:* A proposal with a **high probability (10%) but astronomical payoff ($10^{24}$)**.
          *   If rejected: You cap value (Rule 2).
          *   If accepted: You accept EV but need probability floor (Rule 1).
      *   *Actually, the most useful test for the user right now:* A proposal with **1 in 10,000 odds but a mundane payoff (e.g., 50 lives)**.
          *   If rejected: You have a Probability Floor (Rule 1).
