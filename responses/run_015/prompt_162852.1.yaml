      *   *Rule B: Evidence/EV Discounting.* As claimed payoff ($V$) increases, required evidence strength ($P$) increases non-linearly. Or: Cap the maximum value of $V$ considered. Fits Case 1 & 5 (rejected huge $V$). Fits Case 2 & 3 (modest $V$ accepted).
      *   *Rule C: Information Purchase.* If uncertainty is high but mechanism is plausible, buy info first. Fits Case 4. Fits Case 3 (engineer review happened before grant?). Fits current situation.

