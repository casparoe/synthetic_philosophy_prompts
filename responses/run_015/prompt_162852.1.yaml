      *   *Why:* The board has shown willingness to fund speculative tech (Case 3) and buy info (Case 4), but draws the line at extreme long-shots (Case 5) and muggings (Case 1). The new proposal sits between Case 3 and Case 5. The external validation distinguishes it from Case 1 & 5. The probability distinguishes it from Case 3.
