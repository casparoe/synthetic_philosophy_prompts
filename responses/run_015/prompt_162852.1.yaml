      *   *Refinement:* The user has budget for *one more review*. I need a case that clarifies the *current* decision rules.
      *   *Suggestion:* Commission a review on a "Modest Payoff, Low Probability" case. If they reject that, they have a hard Probability Floor. If they consider it, they are EV maximizers with a discount function.
