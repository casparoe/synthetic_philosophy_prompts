      *   *Comparison to Precedents:*
          *   Vs. Case 1 (Mugging): Better mechanism, external validation. But still huge numbers.
          *   Vs. Case 5 (1 in $10^8$): Probability is higher (1 in $10^4$), but payoff is similar magnitude. Case 5 was rejected.
