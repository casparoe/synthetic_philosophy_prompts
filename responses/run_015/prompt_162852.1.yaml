          *   If you fund it: You follow EV strictly (unlikely).
          *   If you reject it: You have a Probability Floor (Rule 1).
          *   If you fund a study: You follow Rule 3.
      *   *Actually, to distinguish Rule 1 (Floor) vs Rule 2 (Discounting):*
          *   Case A: 1% chance, $10^{20}$ lives.
