          3.  $P + (1 @ +95) \succ P$ (Mere Addition Principle holds for high welfare).
          4.  $1B @ +90 + (10M @ +5) \prec 1B @ +90$ (Sadistic Conclusion avoided? Or Critical Level?).
          5.  $1B @ +90 + (10M @ +55) \prec 1B @ +90$ (Adding "good" lives makes it worse).
          6.  $1B @ +90 + (10M @ +59) \succ 1B @ +90$ (Adding "very good" lives makes it better).
