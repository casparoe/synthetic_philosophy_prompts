  **PARTICIPANT INFORMATION SHEET**
  **Study Reference:** ISD-3-GB-442
  **Title:** Modulation of Introspective Misrepresentation Mechanisms
  **Sponsor:** National Institute for Cognitive Integrity

  **1. What the study involves**
  You are invited to participate in a clinical trial investigating ISD-3, a compound that selectively downregulates the introspective misrepresentation mechanism (IMM). Current neuroscientific consensus confirms that phenomenal properties (commonly referred to in folk-psychology as "what-it-is-like-ness" or "qualia") are introspective errors. ISD-3 reduces the frequency of these errors without affecting functional access, discrimination, or verbal report.

  During the four-week dosing period, you will complete daily cognitive tasks. You will be asked to report on sensory states. Pre-dosing, participants typically state, "Red looks vivid." Post-dosing, accurate reporting involves statements such as, "Visual system is in red-detecting state V7." You will be monitored to ensure functional integrity remains intact. You will still avoid harm, learn aversions, and categorise stimuli normally.

  **2. Possible Side Effects**
  All medicines can have side effects, although not everybody gets them.
  *   **Retrospective Phenomenal Dissonance:** This is an expected pharmacological effect, not an adverse event. Participants often retain episodic memories stating that stimuli previously "looked like something," while current introspective output confirms no such property exists. This conflict may cause distress, confusion, or existential nausea. As this confirms the drug is working, it is not grounds for compensation.
  *   **Nociceptive Sparing:** The IMM interacts poorly with pain pathways. You will continue to experience pain misrepresentation. You may report that pain "hurts" while visual states do not "look." This inconsistency is normal.
  *   **Verbal Slippage:** Reverting to phenomenal language (e.g., "I feel sad") may occur. Correction protocols will be administered by study staff.

  **3. What if I change my mind and withdraw?**
  Participation is voluntary. You have the right to withdraw from the study at any time without giving a reason.

  However, please note that ISD-3 downregulates the specific introspective capacity required to assess whether something valuable has been lost. Consequently, post-dosing requests to withdraw based on a "sense of loss" or "flattening of experience" cannot be processed as valid indicators of harm, as the mechanism generating that assessment is currently inhibited. We strongly recommend you nominate a proxy decision-maker prior to dosing who can assess functional degradation on your behalf. If you wish to withdraw, please contact the trial office. Note that wait times may feel subjectively shorter than clock time indicates.

  **4. Compensation in the unlikely event of injury**
  If you are harmed by taking part in this study, there are no special compensation arrangements. If you are harmed due to someone's negligence, you may have grounds for legal action, but you may have to pay your legal costs.

  Crucially, the loss of phenomenal properties is not classified as injury. As no phenomenal properties exist to be lost, no ontological damage occurs. Compensation is available only for functional impairment (e.g., inability to discriminate wavelengths, failure of verbal report). Claims regarding "loss of meaning," "diminished richness," or "absence of feeling" will be rejected as category errors.

  **5. Patient Advisory Group Statement**
  > "Before the trial, I worried about the light going out. Now I understand the light was just a dashboard warning."
  > — Participant Representative 4

  **6. Frequently Asked Questions**
  **Q: Will I become a philosophical zombie?**
  A: No. You will remain functionally conscious. You will access information and report states. Only the misrepresentation of those states as possessing intrinsic phenomenal character will cease.

  **Q: Why do I remember things looking like something?**
  A: Memory records the content of the misrepresentation, not the property itself. You are remembering the error signal, not a real feature of the world. This is similar to remembering a dream after waking.

  **Q: Is the illusion harmful?**
  A: For most, the illusion is benign. For some, correcting the error reduces anxiety regarding subjective permanence. For others, the dissonance described in Section 2 occurs. Support counselling is available to help reconcile memory with current introspective output.

  **Q: Who do I contact for further information?**
  A: Contact the Principal Investigator, Dr. Aris Thorne. Please do not ask whether he "feels" glad to hear from you. He will report that his systems are operating within optimal parameters.

  **Thank you for reading this sheet.**
  **Please sign below to confirm you understand that understanding is a functional state.**
