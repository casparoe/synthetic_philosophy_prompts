      *   *Clarification on Bad Faith:* Make sure to distinguish "lying to oneself" (which Sartre says is impossible in a strict sense because you know you're lying) from "fleeing freedom." The prompt specifically asks for this discrimination.
      *   *The "Silence":* Don't just list them. Explain *why* Sartre's ontology struggles there (e.g., the body as facticity vs. body as instrument).

  9.  **Final Review against Prompt:**
