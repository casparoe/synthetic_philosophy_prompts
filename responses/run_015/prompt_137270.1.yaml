answer: |-
  Your instinct is correct: your friend is being too charitable. While (5) is the flashpoint where opponents will attack, the structural integrity of the chapter depends on how (5) interacts with (4) and (6). If you present this package as it stands, a sharp interlocutor in the seminar will not just attack (5); they will argue that your metasemantics is ad hoc, applying externalism when it suits you (to save 'water') and withholding it when it suits you (to kill materialism and moral naturalism).

  Here is the audit of your commitments, ranked by severity, followed by the single revision that stabilizes the package.

  ### Part 1: Apparent vs. Real Tensions

  **Apparent Tension: (2) & (3) vs. (1)**
  *   **The Worry:** You might fear that preserving Fregean cognitive significance (2) via primary intensions (3) undermines the Kripkean claim that these are metaphysically necessary identities (1).
  *   **Verdict:** **Dissolves.** This is the standard selling point of two-dimensional semantics (2DS). As long as you maintain that primary intensions are not modal profiles but epistemic/cognitive guides, there is no contradiction. Keep this as is; it is your framework's foundation.

  **Apparent Tension: (7) vs. (5)**
  *   **The Worry:** Defining the epistemic dimension via "ideal reflection" (7) seems to beg the question against Type-A physicalists who claim ideal reflection *would* reveal the entailment from physical to phenomenal truths.
  *   **Verdict:** **Manageable.** This is a dialectical vulnerability, not a logical inconsistency. You can defend (7) as a methodological stipulation without contradicting (5), provided you acknowledge that the physicalist denies the *output* of the ideal reflection, not the definition. This will be debated, but it won't collapse the chapter.

  **Real Tension 1: (8) vs. (1)–(3) & (6) [The Metaethical Double Standard]**
  *   **The Conflict:** In (1)–(3) and (6), you use 2DS + deferential metasemantics to *save* a posteriori identities ('water is H2O'). The PI varies, but the SI is fixed by nature/experts, rendering the identity necessary. In (8), you face Moral Twin Earth. You claim this is the "very same phenomenon" (PI of 'good' doesn't entail a natural base), yet you conclude the naturalist's identity is in "worse shape" (contingent or false).
  *   **Why it's real:** If 'good' behaves semantically like 'water' (same phenomenon), 2DS should *save* moral naturalism just as it saves chemical naturalism. The PI variance should be screened off by a stable SI fixed by the "moral experts" or "moral nature." To conclude that moral identities fail while water identities succeed, you must argue that 'good' lacks the metasemantic mechanism described in (6). But (8) explicitly calls it the "very same phenomenon."
  *   **Severity:** **High.** This looks like an inconsistent application of your own semantic machinery to reach a desired metaethical conclusion.

  **Real Tension 2: (4) vs. (5) [The Bridge Principle Problem]**
  *   **The Conflict:** (4) asserts a "strict" Kripkean moral: an epistemic gap *never* by itself licenses a modal inference. (5) executes an inference from an epistemic gap (PI compatibility of physical truth + no consciousness) to a modal gap (metaphysical possibility of zombies).
  *   **Why it's real:** In standard 2DS (e.g., Chalmers), the inference from PI-possibility to SI-possibility is the *default*. The Kripkean case ('water is H2O') is the *exception*, blocked specifically by the deferential metasemantics in (6). Your commitment (4) treats the Kripkean exception as the rule ("strict... never"). If (4) is true, (5) is invalid. If (5) is valid, (4) is false (or requires massive qualification).
  *   **Severity:** **Critical.** This is the logical engine of your chapter. If (4) stands as written, you have sawed off the branch you are standing on for (5).

  ### Part 2: Ranking the Tensions

  1.  **Severity: Critical — (4) vs. (5).**
      *   **Reason:** This is a direct logical contradiction within the argument's core. You cannot maintain a strict prohibition on epistemic-to-modal inference while simultaneously performing that inference to defeat materialism.
      *   **Cost of Giving Up (4):** You lose Kripkean orthodoxy. You must admit that epistemic gaps *do* prima facie license modal inferences, unless blocked by specific metasemantic facts.
      *   **Cost of Giving Up (5):** You lose the anti-materialist conclusion. The chapter loses its primary payoff in philosophy of mind.

  2.  **Severity: High — (8) vs. (6).**
      *   **Reason:** This threatens the unity of your semantic framework. If deference saves 'water' (6), why does it not save 'good' (8)?
      *   **Cost of Giving Up (8):** You lose the metaethical payoff. Moral naturalism might be saved by the same 2DS move that saves water.
      *   **Cost of Giving Up (6):** You lose the explanation for why 'water is H2O' is necessary. You would need a new story for scientific kinds.

  3.  **Severity: Moderate — (7) vs. (5).**
      *   **Reason:** Dialectical vulnerability regarding the definition of the a priori.
      *   **Cost:** Minimal. This is standard territory for conceivability arguments.

  ### Part 3: The Single Revision

  To clean up the most trouble, you must revise **(4)**.

  **Current (4):** *I want the general moral of Naming and Necessity to be strict: a merely epistemic gap never by itself licenses an inference to a modal gap.*

  **Proposed Revision:** *The general moral of Naming and Necessity is that an epistemic gap licenses an inference to a modal gap **unless** a deferential metasemantics (like that in 6) blocks it.*

  **Why this fixes the package:**

  1.  **Resolves (4) vs. (5):** It turns the inference in (5) into the *default* position of 2DS. Zombies are metaphysically possible *because* they are primarily conceivable, unless there is a reason to think 'consciousness' has a hidden essence that fixes its reference like 'water'. Since you argue it doesn't, the inference goes through.
  2.  **Resolves (8) vs. (6):** It clarifies the relationship between Water and Good.
      *   **Water:** PI varies, but (6) applies (deference to experts/nature). The SI is fixed. Identity is necessary.
      *   **Consciousness:** PI varies, and (6) *does not* apply (no hidden essence). The SI tracks the PI. Identity is contingent/false.
      *   **Good:** PI varies, and (6) *does not* apply (no moral "nature" to defer to in the relevant sense). The SI tracks the PI. Identity is contingent/false.
  3.  **Preserves (1)–(3):** It keeps the Kripkean cases intact but reclassifies them as the *special case* requiring explanation (via externalism), rather than the *general rule* that prohibits your argument.

  **The Cost:**
  You will have to concede in the seminar that you are not being "strictly Kripkean." You are adopting a **Chalmersian** reading of Kripke. Some old-school Kripkeans in the department might push back, but this is the standard orthodoxy for anyone using 2DS to argue against materialism. It is better to own this semantic commitment than to be caught contradicting yourself between (4) and (5).

  **Summary for the Seminar:**
  When you introduce the framework, state clearly: *"I treat the epistemic-to-modal inference as valid by default. The 'Naming and Necessity' cases are exceptions that require a specific metasemantic explanation (deference/externalism). My argument is that phenomenal and moral terms lack this exceptional metasemantics."* This pre-empts the objection that you are violating Kripke, by framing Kripke's cases as the specific exception rather than the universal rule.
