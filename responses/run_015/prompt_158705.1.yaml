answer: |-
  1. This project asks whether a perpetrator's violent actions can be rendered deliberatively intelligible to a reader without reducing those actions to mere symptoms of causal forces like situational pressure or ideological determinism. It investigates if ideology functions not as a coercive force but as a repertoire that makes specific violent actions articulable and available as reasons for the agent.

  2. Current historiography treats the perpetrator's mindset as a causal puzzle to be solved by weighing situational obedience against eliminationist ideology, thereby conflating the repertoire of reasons with the force that compels action. Both frameworks fail to ask what kind of intelligibility an explanation of a perpetrator is even supposed to deliver to a contemporary audience.

  3. Months one through three establish the theoretical framework, while months four through nine involve drafting scenes that are simultaneously annotated for their success in maintaining deliberative transparency. The writing process itself serves as the laboratory for testing whether a character's internal reasoning remains followable without slipping into apology or determinism.

  4. The finished result is a complete manuscript accompanied by a brief exegesis demonstrating how the narrative structure sustains the distinction between having a reason and being caused to act. This combination proves that fiction can produce a specific form of knowledge about agency that historical analysis alone cannot secure.

  5. Failure occurs if the concept of deliberative intelligibility quietly collapses back into causal explanation or merely generates sympathy for the perpetrator, rendering the project ethically empty. I will consider the experiment unsuccessful if the text makes the actions understandable only by making them seem inevitable or morally excusable.
