answer: |-
  ### 1. The Exam Question

  **Time Allowed: 45 Minutes**
  **Total Marks: 25**
  **Closed Book. No Internet.**

  **Read the extract below carefully.**

  > "Denmark combines one of the highest tax burdens in Europe with unemployment below the European average, a flexible labour market, and a workforce that is among the most productive in the world. Its citizens report some of the highest levels of trust in one another and in their government of any population on earth. What this shows is that high taxes and generous benefits do not destroy the willingness to work, provided they are accompanied by an active approach to getting people back into jobs. There is no cultural or historical reason why these arrangements cannot be reproduced elsewhere. The obstacle in this country is not economic but political: no government has yet been willing to pay for the scheme properly or to explain it honestly to the public. We therefore recommend the introduction of a Danish-style earnings-replacement benefit of up to ninety per cent of previous pay for the first year of unemployment, funded from general taxation, together with a statutory obligation to accept suitable work or training from the first month of a claim. Any country that adopts these two measures can expect Danish outcomes; a country that adopts only one should expect to fail, and its failure will not be evidence against the model."

  **Question:**
  Identify what you judge to be the **single most serious problem** with the argument above. Explain what would have to be true for the proposal to survive that problem.

  ***

  ### 2. Model Answer

  **Candidate Number: 04**
  **Word Count: Approx. 720**

  The single most serious problem with this argument is not the cost, the tax rate, or even the cultural comparison. It is the final sentence. The author constructs a argument that cannot be proven wrong. By stating that if a country adopts only one measure and fails, "its failure will not be evidence against the model," the author has made the theory immune to reality. In logic, this is often called making a claim unfalsifiable. If success proves the model works, but failure is explained away as "not doing it properly," then the model is not a prediction; it is a belief.

  This is dangerous for a union because it sets us up to advocate for a policy that has no off-switch. If we campaign for these changes, the government implements half of them, unemployment rises, and the authors say "see, you didn't do the other half," we have no way to hold them to account. We are asked to take the risk, but they reserve the right to say we didn't try hard enough if it goes wrong. For a movement built on solidarity and accountability, accepting an argument that refuses accountability is a strategic error.

  Furthermore, this logical shield covers up a factual discrepancy that undermines the political analysis. The text claims the benefit is "funded from general taxation." In the course material, we learned that the Danish system relies heavily on union-administered funds that workers must join voluntarily, not a universal tax credit. This matters because the "political obstacle" described here is based on the cost to the Treasury. If the cost is actually shared through membership dues and insurance principles, the political argument changes. By getting the funding mechanism wrong, the authors weaken their own claim that the only barrier is "political will." It suggests they haven't looked closely enough at the machinery to know how it is actually paid for.

  However, the logical flaw in the last sentence is worse than the factual error. A factual error can be corrected with a briefing note. A logical flaw that immunizes the policy from failure corrupts the entire decision-making process. It prevents learning. If the policy fails, we need to know if the policy was wrong, or if the implementation was wrong. This text forbids us from finding out.

  For this proposal to survive this problem, two things would have to be true. First, there must be an independent definition of what counts as "adopting the measures." It cannot be left to the proponents of the scheme to decide after the fact whether the conditions were met. There needs to be a statutory or agreed-upon benchmark for what "suitable work" and "ninety per cent replacement" actually look like in practice, measured before the rollout.

  Second, there must be a time limit and a review clause. If the full package is adopted, there must be a point—say, five years—where the outcomes are measured against the promise. If the outcomes are not "Danish," the model must be open to revision. The text says "Any country that adopts these two measures can expect Danish outcomes." That is a promise. A promise implies a consequence if broken. For the argument to be sound, the authors must accept that if the measures are adopted and the outcomes do not follow, the model itself is flawed. They must remove the get-out clause.

  In summary, the argument fails because it treats a complex economic system like a recipe where if the cake doesn't rise, you blame the baker, not the ingredients. For this to work, the authors must accept that the ingredients might be wrong. They must allow for the possibility that "Danish outcomes" depend on things other than just these two measures, such as the specific union infrastructure we discussed in the course. Without that honesty, the recommendation is not a policy; it is an article of faith. And faith is not a basis for bargaining.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Examiner Guidance:** You are not looking for economic expertise. You are looking for the ability to spot a broken argument and explain why it breaks. Do not reward length; reward precision.

  **Band 1: First Class (21–25 Marks)**
  *   **The Move:** Identifies the **unfalsifiable nature** of the final sentence (the "No True Scotsman" logic).
  *   **The Explanation:** Explains *why* this is dangerous (prevents accountability/learning, shifts blame to implementation rather than policy).
  *   **The Condition:** Proposes a concrete way to fix it (e.g., independent review, defined success metrics, admitting the model could be wrong).
  *   **Differentiation:** May also note the factual error regarding funding (Tax vs. Union Funds) and link it to the political analysis, but the logical critique is the core requirement.
  *   **Style:** Clear, direct, no jargon unless defined.

  **Band 2: Competent (15–20 Marks)**
  *   **The Move:** Identifies a significant flaw (e.g., the funding mechanism is wrong, or the cultural comparison is weak).
  *   **The Explanation:** Explains why this fact matters (e.g., "If it's union funds, it costs the Treasury less").
  *   **The Condition:** Suggests a fix (e.g., "They need to check the facts" or "We need to change the culture first").
  *   **Missing:** Fails to tackle the logical immunity of the last sentence. Treats the text as a list of facts to be corrected rather than an argument to be analyzed.

  **Band 3: The Fluent List (10–14 Marks)**
  *   **The Move:** Lists multiple weaknesses (90% is too high, taxes are unpopular, culture is different).
  *   **The Explanation:** Explains each point briefly but does not select a **single** most serious one.
  *   **The Cap:** Capped at 14 because the question asked for the *single* most serious problem. This student answered a different question ("What are the problems?").
  *   **Missing:** No synthesis. No condition for survival.

  **Band 4: Weak / Fail (0–9 Marks)**
  *   **The Move:** Agrees with the text, or identifies a trivial issue (e.g., "The font is small").
  *   **The Explanation:** Vague or irrelevant.
  *   **Missing:** Fails to engage with the argument's structure.

  ***

  ### 4. Common Weak Answers

  **1. The "Cultural Determinist"**
  *   **Answer:** "The argument fails because it says culture doesn't matter. We know British workers are different from Danish workers. You can't just copy-paste a system."
  *   **Cap:** 12 Marks.
  *   **Diagnosis:** Contradicts the text without analyzing *why* the text's claim is risky. It's a gut reaction, not a critique of the logic.

  **2. The "Cost Watchdog"**
  *   **Answer:** "The main problem is the cost. Ninety per cent pay is too expensive. The government won't pay for it. That is the political obstacle."
  *   **Cap:** 14 Marks.
  *   **Diagnosis:** Accepts the text's framing of the problem (cost) rather than challenging the argument's structure. Competent observation, but misses the logical trap.

  **3. The "Fact Checker"**
  *   **Answer:** "The text says it is tax-funded. We learned it is union-funded. Therefore the text is wrong and we cannot use it."
  *   **Cap:** 16 Marks.
  *   **Diagnosis:** Excellent recall of course material, but stops at "it's wrong" without explaining the *consequence* of that error on the argument's logic (which pushes it into Band 1).

  **4. The "Agreeable Student"**
  *   **Answer:** "The argument is strong. Denmark works so we should do it. The only problem is the government won't do it."
  *   **Cap:** 8 Marks.
  *   **Diagnosis:** Fails to critique. Repeats the text's conclusion as their own analysis.

  ***

  ### 5. Straight Talk on Your Text and Instincts

  **On your instinct about the last sentence:**
  You are absolutely right. That sentence is the fatal flaw. It is a classic "immunizing strategy." In academic terms, it makes the hypothesis unfalsifiable. In union terms, it's a "get-out clause" that protects the theorist while exposing the member to the risk. If you want to test whether your students can think critically rather than just memorize, this is the hinge the exam turns on. A student who spots this understands that *accountability* is as important as *policy*.

  **On the Nordic Differences (Denmark vs. Sweden/Norway):**
  In a 45-minute answer, this is too much weight to expect. It requires specific recall of comparative nuance. If a student uses it, it's a bonus, but don't penalize those who focus solely on Denmark. The text lumps "Danish outcomes" as a generic success; challenging that is good, but challenging the *logic* of the promise is better. Keep this as a "Band 1" differentiator, not a requirement.

  **On the Benefit Structure (Tax vs. Union Funds):**
  This is the trickiest part. You teach that it is union-funded; the text says tax-funded.
  *   **The Risk:** If students spot this, they might think the *whole* text is a lie and stop reading.
  *   **The Opportunity:** This is the best test of whether they paid attention on Saturday.
  *   **My Advice:** Keep the error in the text. It allows the "Fact Checker" answer (Band 2/3) to score decently, which rewards attendance. However, ensure your markers know that the **Logical Flaw** (the last sentence) is the superior answer. A student can spot the funding error and still fail to see the logical trap. A student who sees the logical trap has demonstrated a higher-order skill.
  *   **Weight:** In a 45-minute exam, the logical critique is more robust. The funding error is a "gotcha." I have weighted the marking scheme to reward the logical critique most heavily, but allowed the funding error to secure a "Competent" pass.

  **On Difficulty:**
  The question is **hard**. It asks for synthesis and evaluation, not recall. Your students are experienced negotiators; they know when someone is moving the goalposts. That last sentence is "moving the goalposts." They will recognize that instinctively. The challenge will be writing it down formally in 45 minutes.
  *   **Discrimination:** This will discriminate well. The "Fluent List" students (Band 3) will write comfortably about taxes and culture. The "First Class" students (Band 1) will feel the unease of the last sentence and articulate it. That is exactly what you want.

  **One Recommendation:**
  In your marking briefing, tell your two tutors: *"If a student says 'This argument can't be proven wrong,' give them high marks, even if their grammar is rough."* That is the core concept you are testing.
