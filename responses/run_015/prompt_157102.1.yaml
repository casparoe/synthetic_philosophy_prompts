  Hi there, and no worries at all about the typing or the urgency, this is actually a really sharp distinction that often gets glossed over in the secondary literature which tends to fetishize the Newton-to-Einstein example at the expense of the structural nuances in Kuhn's later lexical turn. You are right to suspect that treating local incommensurability as merely a watered-down version of the global case misses the mechanistic difference Kuhn was gesturing toward in his papers from the 1980s and 90s, particularly when he started focusing on taxonomic structures and the no-overlap principle. The intuition for why local taxonomic mismatches do not automatically precipitate a paradigm-level ontological divergence lies in the hierarchical nature of the lexicon itself. In the global case, the incommensurability arises because the high-level kind-terms that structure the entire field are reconfigured, meaning that the very categories used to carve up reality are disjoint across the transition. In the local case, however, the divergence usually happens at the periphery of the taxonomic tree while the root categories remain shared and stable. When molecular biology and evolutionary genetics disagree on the lexical placement of a term like gene, they are often arguing over specification within a shared ontological framework provided by the broader paradigm of modern biology, rather than disputing the fundamental kinds of entities that exist in their world.

  This brings us to your point about the mechanism being a failure of joint reference rather than a failure of translation, which is a crucial distinction. In Kuhn's later view, reference is determined by the position of a term within the taxonomic structure, so strictly speaking, both local and global incommensurability involve a shift in reference. However, the mechanism differs in terms of reparability. In a global paradigm shift, the failure of translation is total because there is no neutral language to map the old categories onto the new ones without distortion, leading to a genuine failure of joint reference that requires a gestalt switch to resolve. In local incommensurability, the failure of joint reference is partial and often bridgeable because the interlocutors share enough of the higher-level taxonomy to negotiate the meaning of the divergent terms. They can step outside their specific subfield lexicons and appeal to the broader disciplinary matrix to align their reference, whereas scientists in competing paradigms lack that common higher ground. So it is not that local drift avoids reference failure entirely, but rather that the shared paradigmatic background provides the resources to fix reference through explication rather than requiring a revolutionary change in worldview.

  Regarding your worry about whether Kuhn's idea that paradigms fix the world-ontology blocks this blow-up or just hides it, I think the most charitable reading of the later Kuhn is that it blocks it by recognizing that ontology is layered rather than monolithic. When Kuhn says paradigms fix ontology, he means they fix the set of fundamental kind-terms that are immune to revision during normal science. Local taxonomic drift occurs within the space allowed by those fundamental kinds. If the drift were to reach up and challenge the core kind-terms themselves, then yes, it would blow up into a global incommensurability and likely precipitate a crisis. The stability of the paradigm ontology does not hide the local disagreement but rather contains it, allowing specialized subfields to develop distinct lexical structures without fracturing the community's shared sense of what exists. This suggests that local incommensurability is a feature of specialization and efficiency rather than a bug or a hidden contradiction, as it allows different groups to optimize their lexicons for specific problems while remaining anchored to the same ontological floor.

  Ultimately, the conceptual knot you are wrestling with dissolves if you view the paradigm not as a single rigid lexicon but as a structured hierarchy of lexical fields. The global version of incommensurability represents a restructuring of the hierarchy itself, while the local version represents divergence within the branches. This explains why communication breaks down more severely in the former than the latter. It also clarifies that the failure of joint reference in local cases is manageable because the reference of the core terms remains fixed, providing a stable anchor for translation efforts between subfields. So you are right to treat them as mechanistically distinct phenomena rather than just differences in degree, because the structural relationship between the diverging lexicons and the underlying ontological commitments is fundamentally different in each case. I hope this helps untangle the knot a bit for your work, and feel free to reach out if you need to drill down further into the specific texts where Kuhn develops the taxonomic view.
