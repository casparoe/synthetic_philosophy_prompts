answer: |-
  Here is the specification for a theory of Ultimate Moral Responsibility (UMR), structured by the cases it must handle, the distinctions it must maintain, and the results it must sustain.

  ### I. Cases to Get Right
  *These are the intuitive test cases any theory of UMR must resolve without contradiction.*

  1.  **The Regress over "Ways of Being"**
      *   **Requirement:** The theory must explain how an agent can be the ultimate source of their character without requiring an infinite chain of prior character-shaping choices.
      *   **Motivation:** Galen Strawson's Basic Argument (you do what you do because of the way you are; to be responsible for what you do, you must be responsible for the way you are).
      *   **Status:** **Non-negotiable for UMR.** (If you cannot stop the regress, UMR is impossible).

  2.  **The Kid-Versus-Adult Difference**
      *   **Requirement:** The theory must account for why adults are typically more responsible than children, without relying solely on external capacity or social utility.
      *   **Motivation:** Intuitions about moral development and capacity for rational reflection.
      *   **Status:** **Non-negotiable for UMR.** (A theory that makes kids and adults equally responsible/irresponsible fails to track moral reality).

  3.  **The Coerced Agent**
      *   **Requirement:** The theory must distinguish between an agent acting under a gun and an agent acting on their own desires, even if the physical movement is identical.
      *   **Motivation:** Intuitions about constraint and duress.
      *   **Status:** **Non-negotiable for UMR.** (UMR must vanish under coercion).

  4.  **The Trauma-Shaped Character**
      *   **Requirement:** The theory must address whether an agent is responsible for actions flowing from a character shaped by unchosen trauma or genetic luck.
      *   **Motivation:** The problem of Constitutive Luck.
      *   **Status:** **Non-negotiable for UMR.** (If luck determines character, and character determines action, UMR is threatened).

  5.  **The Sourcehood Cases**
      *   **Requirement:** The theory must establish the agent as the *originator* of the action, not merely a conduit for prior causes (whether deterministic or random).
      *   **Motivation:** Intuitions about authorship and ownership of actions.
      *   **Status:** **Non-negotiable for UMR.** (This is the definition of "Ultimate").

  ### II. Distinctions to Maintain
  *These are conceptual boundaries the theory cannot blur without collapsing.*

  1.  **Ultimate vs. Merely Derivative Responsibility**
      *   **Requirement:** The theory must distinguish between being responsible because you caused it (derivative) and being responsible because you are the *first* cause (ultimate).
      *   **Motivation:** Strawson's definition of "Ultimate."
      *   **Status:** **Non-negotiable for UMR.** (Compatibilists often collapse this; UMR theories cannot).

  2.  **Responsibility for Act vs. Responsibility for Way You Are**
      *   **Requirement:** The theory must explicitly link or separate responsibility for specific actions from responsibility for the mental nature that produced them.
      *   **Motivation:** The Basic Argument premise that responsibility for acts *entails* responsibility for nature.
      *   **Status:** **Non-negotiable for UMR.** (You must take a stance on the entailment).

  3.  **"Could Have Done Otherwise" (AP vs. Sourcehood)**
      *   **Requirement:** The theory must specify whether "could have done otherwise" means having alternative possibilities (Leeway) or having the power to be the source of the actual sequence (Sourcehood).
      *   **Motivation:** Frankfurt Cases show AP might not be necessary for responsibility, but Sourcehood seems required.
      *   **Status:** **Camp Preference.** (Libertarians usually demand AP; Source Incompatibilists demand only Sourcehood; Compatibilists reinterpret both).

  ### III. Results to be Consistent With
  *These are metaphysical or psychological facts the theory cannot contradict.*

  1.  **The Recursive Structure of the Regress**
      *   **Requirement:** The theory must be logically consistent with the rule: "To be responsible for X, you must be responsible for the cause of X."
      *   **Motivation:** Logical consistency of the Basic Argument.
      *   **Status:** **Non-negotiable for UMR.** (If you break this logic, you must explain why the rule applies everywhere else but not here).

  2.  **Determinism-Compatibility**
      *   **Requirement:** The theory must state whether UMR can exist if every event is causally necessitated by the past.
      *   **Motivation:** Current physical models of the universe.
      *   **Status:** **Camp Preference.** (Compatibilists say Yes; Libertarians/Hard Determinists say No).

  3.  **The Reality of Reactive Attitudes**
      *   **Requirement:** The theory must account for the fact that humans actually feel resentment, gratitude, and guilt.
      *   **Motivation:** P.F. Strawson's "Freedom and Resentment" (these practices are natural and inescapable).
      *   **Status:** **Camp Preference.** (Hard Determinists treat these as errors; Compatibilists treat them as justification; Libertarians treat them as evidence of freedom).

  ---

  ### IV. The Incompatible Pairs (The "Weeds")
  *These are the pairs of desiderata that cannot be jointly satisfied. This is where the Basic Argument generates the impossibility.*

  1.  **Finite Human Existence vs. Non-Derivative Sourcehood**
      *   **Conflict:** To be a *non-derivative* source (Requirement I.5), you must have chosen your own nature. To choose your nature, you must have existed prior to that choice with a nature to choose *with*. Humans have a beginning (Requirement I.2).
      *   **Result:** You cannot be the *ultimate* source of yourself without being *causa sui* (self-caused), which is logically impossible for finite beings.

  2.  **Responsibility for Acts vs. Responsibility for Constitution**
      *   **Conflict:** If you require Responsibility for Acts (I.2) to *entail* Responsibility for Constitution (II.2), you trigger the regress (I.1). If you deny the entailment, you lose "Ultimate" status (II.1) and collapse into Compatibilism.
      *   **Result:** You must either accept the regress (impossible) or admit responsibility is merely derivative (not UMR).

  3.  **Determinism-Compatibility vs. Ultimate Sourcehood**
      *   **Conflict:** If Determinism is true (III.2), the source of your action is the past + laws of nature. If UMR requires *you* to be the source (I.5), Determinism must be false. But if Determinism is false (indeterminism), your actions involve randomness, which also undermines Sourcehood.
      *   **Result:** UMR seems impossible under both Determinism and Indeterminism.

  ---

  ### V. The Knockout Requirement
  *This is the single requirement that eliminates the most standard positions.*

  **The Requirement:** **"Responsibility for Action Requires Responsibility for Constitution."**

  *   **Why it knocks out Compatibilists:** They explicitly deny this. They argue you are responsible for actions if they flow from your character, even if you didn't choose your character. By making this a requirement for UMR, Compatibilism is disqualified by definition.
  *   **Why it knocks out Libertarians:** They accept this requirement, but when they try to satisfy it, they run into the **Regress over "Ways of Being"** (I.1). They cannot explain how an agent chooses their character without already having a character to choose with. They fail the logical consistency check.
  *   **Why it knocks out Hard Determinists:** They accept this requirement and agree it cannot be met. Consequently, they must deny that Moral Responsibility exists at all. They are knocked out of the running for providing a *theory of Responsibility* (they provide a theory of its absence).

  This requirement is the engine of Strawson's Basic Argument. It forces the agent to be *causa sui*. Since no finite being can be *causa sui*, no standard position can sustain Ultimate Moral Responsibility.

  Verdict: Responsibility for the Way You Are
