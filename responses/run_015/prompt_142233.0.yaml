prompt: |-
  I'm TAing an intro metaphysics module this term and keep having the same argument with one of the PhD students, so I'd rather get properly attacked on this than keep winning by stipulation. The view I hold — call it the paraphrase view, I need some label — is that there is no causation by absence, full stop. When we say the guard's not turning up caused the vault to be emptied, or that the missing signature caused the application to be rejected, nothing negative is doing causal work: there's the actual positive history (the guard asleep down the road, the clerk processing the file), some counterfactuals about what would have happened had things gone differently, and a background of norms, plans and expectations that explains why we single out her absence rather than the Queen of England's. On my view causal claims about omissions are in perfectly good order as compressed explanations, they're just not reports of a causal relation with an absence in it. My supervisor says I've defintely just built the conclusion into what I'll count as a cause — causes have to be actual happenings, locatable in time, the sort of thing that can enter into production-like relations, and absences are none of those — and I want to know how much of the view is that definition wearing a coat.

  So: what would count against me, ranked from I'd have to give it up through this hurts to this is merely awkward, and for each one say whether a committed paraphrase theorist should concede it or is entitled to shrug. The things I want you to actually work through, with cases rather than name-dropping, are these. (1) Double prevention: someone tries to poison the coffee, a colleague quietly swaps the cups, the victim survives, and the absence of poison upstream seems to be what lets the whole normal causal story run — people treat this as the case where absences inherit causal power, and I've never felt its force, so either show me what I'm missing or agree with me and say why it's not the master case it's made out to be. (2) Symmetric overdetermination by two omissions: either of two guards would have locked the door and would have been enough, neither does, the burglar walks in; my counterfactual machinery breaks here, and I need to know whether my fallback (no cause of the break-in at all, or the two together) is a cost or a feature I can charge for. (3) The timing worry: an omission doesn't seem to have a sharp location or duration in the way causes are supposed to, and the late omission case — the doctor fails to give the antidote at midnight, but the patient was already dead at 11:55 — shows the shape of the problem; is the vagueness a reason to deny absences causal status or just a reason to be careful about event individuation? (4) The case that worries me most, which I made up and haven't seen discussed: the disarmed sprinkler. A fire spreads through a wing of a building because the sprinkler's trigger was never rewired after maintenance months earlier. There's no agent who failed to act at the relevant moment, nobody had a duty, there's no queue of expectations for my story to lean on — and yet the absence of a signal caused the fire to spread sounds completely fine to nearly everyone I try it on. (5) Model-relativity: whether a causal model even contains a variable for the guard locks the door is a modeller's choice, and if it does then the absence comes out as a cause on the usual actual-cause tests, and if it doesn't it can't even be a candidate. Positive causes don't look like they're at the mercy of variable inclusion in the same way — or do they? If they do, I'm not specially exposed and you should say so; if they don't, I owe you something. (6) My own rescue device, which I half suspect is junk: I distinguish thin absences (mere non-occurrences, like the Queen not watering the plant) from thick ones (the non-execution of a standing arrangement — a mechanism that was meant to fire, a plan, a role, a duty), and I use the distinction to explain why some absence-claims are good explanations and others are noise. Is that doing real work, or is it a moves-in-the-night device that lets me dismiss any counterexample as thin? If it's the latter, say so, and tell me what test would expose it.

  On epistemics: I want you to seperate what people who work on this genuinely agree on from what's just fashionable, and not hand me a consensus where there's only a majority. Flag every place where my view is insulated by a definition rather than an argument, and be willing to conclude that the whole thing has been qualified into unfalsifiability — and then say whether, for a view of this kind, that's a real problem or just what metaphysics looks like when it's done honestly. Tell me which single defeater you think is most likely to be right and roughly how confident you are in that ranking. And for what it's worth, the thing that would move me most is a case where the absence does explanatory work that no reconstruction out of positive history plus counterfactuals plus norms can replicate; shared intuitions alone won't do much for me, so if that argument is available, make it, and if it isn't, say that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Identity:** TA for an intro metaphysics module.
      *   **Interlocutor:** A PhD student (implies high level of technical competence).
      *   **User's View:** "Paraphrase View" (Causal Nominalism / Anti-Realism about Omissions). Causation requires positive happenings. Omission claims are compressed explanations involving counterfactuals + norms, not reports of causal relations involving absences.
      *   **The Conflict:** The supervisor accuses the user of defining the conclusion (stipulating causes must be "actual happenings").
      *   **The Task:** Evaluate the view against 6 specific challenges (Double Prevention, Symmetric Overdetermination, Timing, Disarmed Sprinkler, Model-Relativity, Thin/Thick Distinction).
      *   **Constraints:**
          *   Rank challenges from "Must Give Up" to "Merely Awkward."
          *   For each, say whether to concede or shrug.
          *   Use cases, not just name-dropping.
          *   Separate genuine agreement from fashion in the field.
          *   Flag where the view is insulated by definition.
          *   Address unfalsifiability (is it a bug or a feature?).
          *   Identify the *single most likely defeater* with confidence level.
          *   Address the "Explanatory Work" criterion (can absences do work positive history + counterfactuals + norms can't?).

  2.  **Deconstruct the User's View (The "Paraphrase View"):**
      *   *Core Thesis:* Causation is a relation between positive events. Absences are not events.
      *   *Semantics:* "A's absence caused B" is true, but paraphrasable as "A didn't happen, and if A had happened, B wouldn't have, given norms/expectations E."
      *   *Motivation:* Avoids weird ontology (nothing causing something), preserves locality/productivity of causation.
      *   *Vulnerability:* Looks like semantic stipulation to avoid counterintuitive results.

  3.  **Analyze the 6 Challenges:**

      *   **(1) Double Prevention:** (Poison swapped -> victim survives).
          *   *Standard View:* The absence of poison caused survival.
          *   *User's View:* The colleague's action caused survival. The absence of poison is just the *mechanism* by which the action worked.
          *   *Assessment:* This is usually the *strongest* case for omission causation (Hall's work). However, the Paraphrase View can handle it by pointing to the *swapping* as the positive cause.
          *   *Verdict:* Merely Awkward. Shrug.

      *   **(2) Symmetric Overdetermination by Omissions:** (Two guards, neither locks, burglar enters).
          *   *Problem:* Counterfactual dependence fails (if Guard 1 locked, burglar still stopped by Guard 2? No, if *either* locked, burglar stopped. So neither is necessary).
          *   *User's View:* No cause? Or both?
          *   *Assessment:* This breaks standard counterfactual accounts too. But for the Paraphrase View, if there are *no* positive events causing the entry (just the burglar's action), the guards' inaction isn't a cause. But intuitively, their failure is causal.
          *   *Verdict:* This Hurts. The view risks saying "nothing caused the breach regarding the guards," which is explanatory bankruptcy.

      *   **(3) Timing/Location:** (Doctor fails at midnight, patient dead at 11:55).
          *   *Problem:* Absences don't have spatiotemporal coordinates.
          *   *User's View:* Vagueness proves they aren't events.
          *   *Assessment:* This is actually an *argument for* the user. Positive causes have locations; absences don't.
          *   *Verdict:* Feature, not bug. Shrug.

      *   **(4) The Disarmed Sprinkler:** (No agent, no duty, just mechanical failure/omission).
          *   *Problem:* No norms, no expectations, no agent. Just "wire missing -> fire spreads."
          *   *User's View:* Needs norms/plans to select the absence. Here, there are none.
          *   *Assessment:* This is the killer. If "absence caused fire" is true without norms, the Paraphrase View's reliance on norms is falsified. The "positive history" is just the fire spreading. The *lack* of water is the cause.
          *   *Verdict:* Must Give Up (or significantly modify).

      *   **(5) Model-Relativity:** (Variable inclusion).
          *   *Problem:* Causal models make omission causation depend on the modeller.
          *   *User's View:* "See? It's pragmatic."
          *   *Assessment:* Positive causes are also model-relative to some extent (granularity), but less so. If omission causation is *radically* model-relative, it supports the pragmatic/paraphrase view.
          *   *Verdict:* Merely Awkward. Supports the view actually.

      *   **(6) Thin vs. Thick Absences:** (Rescue device).
          *   *Problem:* Is this ad hoc?
          *   *User's View:* Thick absences (broken mechanisms) explain better than Thin (Queen not watering).
          *   *Assessment:* If "Thick" just means "where we have norms," it's circular. If "Thick" means "structural dispositional properties," it might be ontological realism in disguise.
          *   *Verdict:* Moves-in-the-night risk. Needs independent criteria.

  4.  **Synthesize the "Epistemics" and "Defeater" Requirements:**
      *   *Consensus:* There is no consensus. It's a stalemate between Neo-Mechanists (pro-omission) and Process/Conservation theorists (anti-omission).
      *   *Insulation:* The definition of "cause" as "positive event" is the insulation.
      *   *Unfalsifiability:* If every counterexample is met with "that's just an explanation, not causation," it's unfalsifiable.
      *   *Best Defeater:* The Disarmed Sprinkler (Case 4). It removes the "norm/expectation" crutch.
      *   *Explanatory Work:* Can absences do work positive history can't? Yes, in *contrastive explanation* regarding system stability.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Respectful, rigorous, peer-to-peer (TA vs PhD). No fluff.
      *   *Structure:*
          1.  Intro: Validate the position (it's a known stance, e.g., Beebee, Dowe).
          2.  The Ranking (1-6).
          3.  Epistemic Status (Consensus vs. Fashion).
          4.  The Insulation Charge.
          5.  The Single Defeater.
          6.  The Explanatory Work Test.

      *   *Refining Case 4 (Sprinkler):* This is the crux. The user relies on "norms/plans." The sprinkler has no plans. It has *functions* or *dispositions*. If the user appeals to "proper function," they slide into realism about negative facts (the function is missing). If they stick to "no norms," they have to say the fire spread *without a cause* (regarding the sprinkler), which is absurd.
      *   *Refining Case 2 (Overdetermination):* Standard counterfactual accounts fail here too. So the user isn't uniquely punished. But the user's view might imply *no* causal story for the security failure, which is costly.
      *   *Refining the "Definition" Charge:* The supervisor is right, technically. But all metaphysics starts with definitions. The question is whether the definition earns its keep.
      *   *Refining "Explanatory Work":* The user asks for a case where Positive + Counterfactual + Norms *fails*. The Sprinkler case is close. But maybe *Prevention* cases where the positive cause is irrelevant? No, the Sprinkler is best because the "Positive History" (fire spreading) doesn't explain why it *wasn't stopped*. The absence explains the *propagation*.

  6.  **Final Polish:** Check against constraints.
      *   Did I rank them? Yes.
      *   Did I say Concede/Shrug? Yes.
      *   Did I address the "definition wearing a coat" worry? Yes.
      *   Did I identify the single defeater? Yes (Sprinkler).
      *   Did I address the "Explanatory Work" criterion? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Beebee says X." The user wants cases worked through. I should reference the literature implicitly but focus on the logic. The "Paraphrase View" is essentially Helen Beebee's "Causation as Explanation" or Dowe's "Conserved Quantity" view. I should acknowledge this lineage to show I know the field.

      *Re-evaluating Case 1 (Double Prevention):* Hall argues this *is* causation by absence. The user says it's the *swapper* causing it. But if the swapper is far away, and the local cause is the lack of poison... The user can shrug here because they can point to the positive action of the swapper.
      *Re-evaluating Case 4 (Sprinkler):* This is the strongest. Why? Because there is no *agent* to have a norm. Is there a "system norm"? If yes, the user's view expands to include system functions. If no, the user must deny causation. Denying causation in a fire investigation is pragmatically disastrous.

      *Confidence Level:* I need to assign a confidence to the defeater. I'd say 75-80%. It's the hardest hurdle for anti-omission views.

      *Unfalsifiability:* Is it a problem? In metaphysics, often no. But if it makes the view trivial (everything is just "explanation"), it loses traction.

      *Let's write.*
answer: |-
  This is a clean, high-stakes metaphysical dispute. You are defending a version of **Causal Nominalism** (often associated with Beebee or Dowe), while your supervisor and the PhD student are likely pushing a **Counterfactual** or **Interventionist** realism (Lewis, Woodward, Hall). Your supervisor's charge—that you are defining the conclusion—is technically correct but philosophically shallow. All metaphysics begins with stipulations; the question is whether the stipulation earns its keep by simplifying the overall theory of the world.

  Here is the breakdown of your six challenges, ranked by threat level, followed by the epistemic audit you requested.

  ### The Ranking

  **1. The Disarmed Sprinkler (Case 4)**
  *   **Threat Level:** **I'd have to give it up.**
  *   **Verdict:** **Concede (or significantly modify).**
  *   **Analysis:** This is the hole in the hull. Your view relies on "norms, plans, and expectations" to explain why we select specific absences (the guard, not the Queen). In the sprinkler case, there is no agent, no duty, and no plan at the moment of the fire. There is only a mechanical disposition that was not instantiated.
      *   *The Trap:* If you say "the sprinkler system had a *function* to work," you have smuggled in a normative fact that looks suspiciously like a real negative property (the missing function). If you say "there were no norms, so the absence didn't cause the fire," you are committed to saying the fire spread without a causal explanation regarding the suppression system. In a fire investigation, "The sprinkler didn't work" is not just a compressed explanation; it is the *physical reason* the fire propagated.
      *   *Why it hurts:* Your positive history (the fire burning) explains the *presence* of the fire, but not the *absence* of suppression. The counterfactual (if wired, fire stops) is true, but without a norm to anchor it, your view treats this as coincidental. You cannot shrug this. You must either admit that "system functions" count as the required background (which edges toward realism about negative facts) or accept that your view cannot handle non-agential omission causation.

  **2. Symmetric Overdetermination by Omissions (Case 2)**
  *   **Threat Level:** **This Hurts.**
  *   **Verdict:** **Concede (with a cost).**
  *   **Analysis:** Two guards, either sufficient, neither acts. Burglar enters.
      *   *The Trap:* Standard counterfactual theories struggle here too (neither omission is necessary). But your view has a specific vulnerability: if causation requires a positive event, and *neither* guard produced a positive event, then on your view, **the security failure has no cause.** The burglar's entry is caused by the burglar, but the *breach of security* is causally unmoored.
      *   *Why it hurts:* This leads to explanatory bankruptcy. We want to say the security system failed *because* of the guards. If you say "No, the guards did nothing, so they caused nothing," you are technically consistent but pragmatically useless. You might try to say the "hiring of the guards" is the positive cause, but that distorts the temporal proximity we expect from causation.
      *   *Strategy:* You can argue this is a feature: "There is no causal relation here, only a structural explanation." But you must own the cost: you are denying causation in cases where the law and ordinary language assert it robustly.

  **3. Thin vs. Thick Absences (Case 6)**
  *   **Threat Level:** **This Hurts (Risk of Unfalsifiability).**
  *   **Verdict:** **Concede (needs independent criteria).**
  *   **Analysis:** You propose distinguishing "thin" (Queen not watering) from "thick" (mechanism meant to fire) to save the view.
      *   *The Trap:* This looks exactly like the "definition wearing a coat" your supervisor warned about. If "Thick" just means "cases where we intuitively want to say there is causation," the distinction is circular.
      *   *Test:* To make this work, you need independent criteria for "Thick" that do not rely on causal intuition. For example: "A thick absence is the non-activation of a dispositional property intrinsic to the object." If you can ground "Thick" in the metaphysics of dispositions rather than norms, you save the view. If "Thick" is just "normatively salient," you are back to Case 4 (Sprinkler) where norms are missing.
      *   *Strategy:* Don't use this as a rescue device; use it as a positive theory of *functions*. But be aware: functions often imply teleology, which brings its own metaphysical baggage.

  **4. Model-Relativity (Case 5)**
  *   **Threat Level:** **Merely Awkward.**
  *   **Verdict:** **Shrug.**
  *   **Analysis:** You worry that if causal models determine omission causation, your view is vulnerable. Actually, this supports you.
      *   *The Argument:* Positive causes are *less* model-relative than omissions, but they are not immune. (Is the cause of the crash the pilot's error or the engine failure? Depends on the model's granularity). However, omission causation is *radically* model-relative. In one model, "lack of rain" causes the famine; in another, "soil composition" does.
      *   *Why you shrug:* This variability is evidence that omission causation is pragmatic (about explanation) rather than ontological (about the world). If causation were a mind-independent relation involving absences, model-relativity would be a bug for *everyone*. Since it's a bigger bug for realists, you can wear this as a badge of honor. It shows you are correctly identifying omission claims as explanatory tools, not world-structure reports.

  **5. Double Prevention (Case 1)**
  *   **Threat Level:** **Merely Awkward.**
  *   **Verdict:** **Shrug.**
  *   **Analysis:** Colleague swaps cups -> victim survives.
      *   *The Argument:* Realists say the *absence of poison* caused the survival. You say the *colleague's action* caused the survival.
      *   *Why you shrug:* You can account for all the physical work with positive events. The colleague moved their arm (positive), the poison went into the sink (positive), the victim drank liquid (positive). The "absence of poison" adds no physical energy or transfer. The intuition that the absence is the cause is an intuition about *salience*, not physics. You lose the linguistic battle ("the lack of poison saved him") but win the metaphysical one (nothing negative pushed the survival into being). This is your strongest ground; hold it.

  **6. The Timing Worry (Case 3)**
  *   **Threat Level:** **Merely Awkward.**
  *   **Verdict:** **Shrug (Feature, not bug).**
  *   **Analysis:** Omissions don't have sharp spatiotemporal boundaries.
      *   *The Argument:* Realists struggle to locate the absence. (When did the doctor's failure begin? When they woke up? When the shift started?).
      *   *Why you shrug:* This is an argument *for* your view. If causation is a relation between events, and events are locatable, and absences are not locatable, then absences are not causes. The vagueness isn't a problem for you; it's a *reductio* for the realist. You are entitled to point at the fuzziness and say, "See? It's not a thing."

  ---

  ### Epistemic Audit

  **Consensus vs. Fashion**
  There is **no consensus** on this issue. The field is split.
  *   **The Realist Majority:** Most contemporary metaphysicians (following Lewis and Woodward) accept omission causation because it fits interventionist accounts and causal modeling neatly. It is "fashionable" in the sense that it aligns with the dominant methodology (causal models).
  *   **The Nominalist Minority:** A robust minority (Beebee, Dowe, Armstrong) rejects it to preserve a physicalist/productive account of causation.
  *   **The Agreement:** Everyone agrees that omission *claims* are true and useful. The disagreement is purely ontological: do these claims track a relation in the world, or are they pragmatic devices?
  *   **Your Insulation:** Your supervisor is right that you are insulated by definition. You define "cause" as "positive event." Any counterexample is met with "That's not a cause, that's an explanation." This renders the view **unfalsifiable by intuition**. If the only data is "what we say," and you say "what we say is loose," you cannot lose.

  **Is Unfalsifiability a Problem?**
  For a view of this kind, **no**. Metaphysics often involves trading intuitive fit for theoretical unity.
  *   *The Trade:* You are trading the intuitive truth of "The lack of water caused the fire" for the theoretical virtue of "Causation is purely physical/positive."
  *   *The Honesty Check:* You must admit this trade explicitly. If you claim your view matches ordinary language *and* metaphysics, you are lying. If you claim it sacrifices ordinary language to save physicalism, you are doing honest metaphysics. The "Paraphrase View" is not a description of language; it is a revisionary ontology.

  **The Single Most Likely Defeater**
  **The Disarmed Sprinkler (Case 4).**
  *   **Confidence:** **80%.**
  *   **Reasoning:** It removes the "Norm/Expectation" crutch. Your view works well for human actions (guards, doctors) because we can appeal to duties. It fails for mechanical systems where "duty" is metaphorical. If you cannot ground the causal power of the missing wire without appealing to a "function" that acts like a real negative property, your distinction between "positive history" and "omission" collapses. The fire spreads *because* the water didn't. If you deny this, you deny the physical explanation of the fire's propagation.

  **The "Explanatory Work" Test**
  You asked for a case where the absence does work that *Positive History + Counterfactuals + Norms* cannot replicate.
  *   **The Answer:** **Stability Explanations.**
  *   **Case:** A bridge stands for 50 years. Why?
      *   *Positive History:* Steel held tension, concrete held compression.
      *   *Counterfactual:* If wind had been stronger, it would have fallen.
      *   *Norms:* Engineers expected it to hold.
      *   *The Missing Piece:* The absence of corrosion.
      *   **The Argument:** The positive history describes the *state*, but the *persistence* of the state over time is often explained by the absence of disruptors. If you say "The absence of corrosion didn't cause the bridge to stand," you struggle to explain why *this* bridge stood and an *identical* bridge fell (which had corrosion). The positive history of the standing bridge at time *t* is identical to the falling bridge at time *t-1*. The difference is the *history of non-events* (no corrosion occurring).
      *   **Can you paraphrase?** You can try ("No corrosion occurred, and if it had..."), but the *explanatory weight* rests on the non-occurrence. The "Positive History" is just the bridge existing. The *reason* it exists continuously is the absence of decay. If your view cannot accommodate "absence of decay" as a causal factor in persistence, you cannot explain stability, only snapshots.
      *   **Verdict:** This is the strongest argument against you. Absences explain *continuity* and *stability* in a way that positive events (which are momentary) struggle to capture without invoking the absence of interrupts.

  ### Summary Advice for the Argument

  1.  **Stop defending the definition.** Admit you are defining "cause" as "positive event" for theoretical utility.
  2.  **Attack the Sprinkler.** If you can't solve Case 4 without smuggling in "functions" as real negative properties, you must concede that your view applies only to agential contexts, or that "function" is a positive physical state (disposition).
  3.  **Own the Revisionism.** Tell the PhD student: "I am not analyzing ordinary language. I am proposing an ontology where causation is physical production. Omission claims are true explanations, but they map to counterfactuals, not production."
  4.  **The Concession:** Admit that Case 4 (Sprinkler) and Case 2 (Overdetermination) are costs. Your view is simpler ontologically (no negative facts) but costlier explanatorily (can't easily handle mechanical failure). Ask them if they prefer an ontology with negative facts or an explanation gap in mechanical failure. That is the real trade.
