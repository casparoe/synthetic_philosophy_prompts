answer: |-
  Here is an analysis of the phenomenon you are observing, argued out without reliance on external citations, structured around the four demands of your request.

  ### 1. Naming the Distinction

  You are right to be unsatisfied with the standard **Epistemic vs. Aleatory** distinction if it is presented merely as "reducible vs. irreducible" ignorance. In your classroom examples, the ignorance is equally irreducible *for the agent at the time of choice*. However, the distinction you are isolating is not about the agent's information state, but about the **ontological status of the proposition** on which the bet hinges.

  The established technical genus is indeed Epistemic (uncertainty about a fixed state) vs. Aleatory (uncertainty about a stochastic realization), but in pedagogy, these terms are often muddied by talk of "learning." For your lecture, I propose you use the term **Ontological Settledness**.

  **Definition:** *Ontological Settledness* refers to whether a truth-maker for the relevant proposition currently exists in the world.
  *   **Settled Uncertainty:** The fact of the matter (e.g., the color composition of the urn) is fixed at the time of choice, even if unknown. The proposition has a determinate truth value now.
  *   **Unsettled Uncertainty:** The fact of the matter does not exist at the time of choice. The proposition acquires a truth value only upon the occurrence of a future event.

  **How it differs from neighbours:**
  *   **Vs. Risk/Ambiguity:** Risk/Ambiguity (Knight/Keynes) distinguishes known probabilities from unknown probabilities. In your case, *both* urns present ambiguity (unknown probabilities). Settledness cuts *across* ambiguity.
  *   **Vs. Epistemic/Aleatory (Standard):** Standard definitions often tie Epistemic to "in principle knowable" and Aleatory to "inherent randomness." Your "destroyed slip" case (see below) shows these come apart. A fact can be epistemic (it was fixed) but aleatory in practice (it is lost). *Settledness* isolates the *timing of fixation* relative to the *choice*, regardless of whether the information is recoverable.

  ### 2. Boundary Cases

  To determine if the line is about time, existence, or access, we apply the **Truth-Maker Test**: *Does a physical state of affairs currently exist that determines the payoff?*

  **Case A: The Destroyed Slip**
  *   *Scenario:* The composition was fixed, printed, and then the slip was shredded unread.
  *   *Analysis:* Ontologically, the state *was* settled, but the truth-maker no longer exists in the universe (assuming no omniscient observer).
  *   *Prediction:* Students will treat this like the **Unsettled (Future)** case.
  *   *Reasoning:* If the reaction were purely about "past vs. future," they should treat this as Past/Settled. But if the reaction is about "does a fact exist *now* that could theoretically be checked," this feels like the future. The universe has "forgotten" the fact. This suggests the line is not temporal (past/future) but **ontological (existent/non-existent)**. The discomfort comes from betting on a void.

  **Case B: Independent Future Machine**
  *   *Scenario:* Your standard "future flip" case.
  *   *Analysis:* No truth-maker exists.
  *   *Prediction:* **Unsettled.**
  *   *Reasoning:* This is the baseline for high aversion. It confirms that the lack of a current truth-maker drives the effect.

  **Case C: The Third-Party Observer**
  *   *Scenario:* Fixed in advance, shown to a silent colleague.
  *   *Analysis:* A truth-maker exists (the urn) *and* the information exists (in the colleague's brain).
  *   *Prediction:* **Settled** (low aversion, similar to the sealed envelope).
  *   *Reasoning:* Even if the colleague won't speak, the *potential* for leakage confirms the fact is "hard." More importantly, the existence of a witness reifies the fact. It moves the uncertainty from "what will the universe generate?" to "what does the colleague know?" The latter feels more stable.
  *   *Nuance:* If students suspect the colleague might leak non-verbally, aversion might drop even further (towards risk), because they might feel they can glean information. But strictly regarding settledness, the existence of the witness anchors the fact.

  **Conclusion on the Line:** The boundary is not Time. It is **Current Existence of the Truth-Value**. The "Past" usually implies existence; the "Future" implies non-existence. The "Destroyed Slip" is the wedge that proves time is not the operative variable.

  ### 3. Rational Defensibility

  Is this asymmetry a bias to be trained out, or a rational heuristic?

  **The Standard Normative View (Bias):**
  Under Savage's Subjective Expected Utility (SEU), this is a **violation of State Supervenience**. Preferences should depend on the mapping of states to outcomes. If the probability distribution over colors is identical in both urns, and the payoff structure is identical, the *history* of the urn is irrelevant. A competent chooser should be indifferent. From this perspective, the students are suffering from a **Metaphysical Illusion**: they feel safer betting on a "dead fact" than a "live process," even though the causal link to their wallet is identical.

  **The Pragmatic Defense (Heuristic):**
  However, there is a defensible argument based on **Model Robustness**.
  In the real world, descriptions of future mechanisms are less trustworthy than descriptions of past states.
  *   *Sealed Envelope:* The mechanism (filling the urn) has already occurred. The only risk is that I am lying about the contents.
  *   *Future Machine:* The mechanism has *not* occurred. I am asking you to trust that (1) I am honest, (2) the machine will work as described, (3) no one will tamper with it in the interim, and (4) the randomization will be truly independent.
  *   *Argument:* The "Future" condition introduces more **degrees of freedom for model failure**. A student who is more averse to the future urn is implicitly assigning a higher probability to "the professor messes up the machine" or "the process isn't truly random." In a real-world context, this is a rational precaution.

  **The Evidential Defense (Newcomb-like):**
  If a student subscribes to Evidential Decision Theory (EDT) rather than Causal Decision Theory (CDT), the distinction is rational.
  *   *Settled:* My choice cannot be evidence of the urn's composition (the composition is causally prior).
  *   *Unsettled:* If the future mechanism is truly random, my choice is still independent. *However*, if there is *any* suspicion that the mechanism might be sensitive to prediction (a "psychological" machine, or a common cause), then in the Unsettled case, my choice *could* be evidentially correlated with the outcome. In the Settled case, it cannot be.
  *   *Test:* To distinguish Bias from Rationality, run this experiment: Offer the students a option to **pay a small fee to delay their choice** until after the future machine has run but before the result is revealed.
      *   If they pay to delay, they value **Settledness** itself (converting Unsettled to Settled). This suggests the ontological status has utility for them.
      *   If they are indifferent to delaying, but still preferred the original Sealed Envelope, it suggests they distrust the **Future Mechanism** specifically (the Pragmatic Defense).

  **Verdict:** It is a bias under ideal axiomatic theory, but a rational heuristic for **mechanism distrust** in non-ideal environments.

  ### 4. Implications for Decision Theory

  If you decide to validate this intuition in your course (or if you want to explain why standard theory rejects it), you must identify what breaks.

  **What must be given up:**
  1.  **Consequentialism:** Standard theory holds that only the final outcomes matter. Respecting Settledness implies that the *history* of the outcome (how it came to be) is part of the utility function. You are effectively modeling the student as caring about "Betting on a Fact" vs. "Betting on a Process."
  2.  **State Supervenience:** Preferences must no longer supervene on the probability distribution over outcomes. They must also depend on a parameter $\sigma$ (Settledness), where $Utility(Act, State, \sigma)$.
  3.  **The Ontological Neutrality of Probability:** In Bayesianism, $P(Heads)$ for a tossed coin and $P(Heads)$ for a covered, tossed coin are the same number. To respect Settledness, you need a **two-tiered belief system**: one for *parameters* (fixed but unknown) and one for *realizations* (not yet fixed). This moves you toward a **Hierarchical Bayesian** or **Knightian** framework where the "confidence" in the probability estimate is weighted by the ontological status of the event.

  **A Proposed Formalism for the Lecture:**
  If you want to show how a theory *could* respect this without collapsing, suggest that the students are not maximizing Expected Utility, but **Expected Utility minus Ontological Risk**.
  $$ V(Act) = \sum P(s) U(Outcome) - \lambda \cdot \mathbb{I}(Unsettled) $$
  Where $\lambda$ is a "metaphysical discomfort" parameter and $\mathbb{I}$ is an indicator for whether the state is ontologically unsettled.
  This admits that the students are not "bad Bayesians," but rather agents with a **lexicographic preference for truth-value definiteness**.

  ### Summary for the Lecture

  1.  **Term:** Use **Ontological Settledness**.
  2.  **Distinction:** It is not about what you *know* (information), but what *exists* (truth-makers).
  3.  **Boundary:** The "Destroyed Slip" proves it is about existence, not time.
  4.  **Rationality:** It is a bias in a vacuum, but a robustness heuristic in the wild (trust in future mechanisms is lower).
  5.  **Theory:** Accepting it requires violating State Supervenience; preferences depend on the history of the state, not just the state itself.

  This framing allows you to honor the students' intuition without conceding that standard decision theory is "wrong," but rather that it models a specific, idealized agent who is indifferent to the metaphysics of the bet.
