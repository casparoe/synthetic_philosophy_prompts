  Here is the decomposed credence analysis regarding Mary's cortical mapping variant.

  ### Component Probabilities

  **(1) Probability that phenomenal knowledge requires a specific first-person qualitative character that can be absent even with perfect neural duplication: 0.50**
  This term represents the metaphysical likelihood of *Qualia Non-Supervenience*. A value of 0.50 reflects strict agnosticism between Reductive Physicalism (where $N_{red} \rightarrow Q_{red}$ necessarily) and Property Dualism/Panpsychism (where $N_{red}$ could theoretically couple with $Q_{warmth}$). While cognitive science assumes local supervenience, the "Hard Problem" prevents assigning a probability near zero.

  **(2) Probability that her warmth report indicates absence of the phenomenal concept rather than absence of the experience itself: 0.70**
  This term evaluates the *Phenomenal Concept Strategy* (PCS). A high value here suggests Mary *has* the crimson experience (the neural state is sufficient) but lacks the public language or recognitional capacity to categorize it as "red," defaulting to "warmth" due to cross-modal association. This is the standard physicalist rebuttal to Jackson.

  **(3) Probability that Jackson's knowledge argument depends on this distinction being non-gradual: 0.60**
  This term weights the *Argumentative Validity*. Jackson's original argument relies on a binary gap (she knows everything physical $\rightarrow$ she learns something new $\rightarrow$ physicalism is false). If the distinction between "physical knowledge" and "phenomenal knowledge" is gradual or merely conceptual (as implied by Term 2), the force of Jackson's inference diminishes.

  **(4) Probability that intersubjective neural transfer without matching qualitative report is metaphysically possible at all: 0.50**
  This term assesses *Metaphysical Possibility* independent of nomological law. Even if physically impossible in our universe, is it metaphysically coherent? Like Term 1, this is set at 0.50 to reflect the unresolved debate between logical supervenience and conceivability arguments (Chalmers vs. Physicalists).

  ### Calculation Logic

  To arrive at the credence that Mary **lacks** knowledge of what it is like (WIL), we must establish that:
  1.  It is possible for the experience to differ from the neural state (Terms 1 & 4).
  2.  The specific report in this case reflects that difference, not a conceptual error (Term 2).
  3.  The intuition that she lacks knowledge is valid despite conceptual blurring (Term 3).

  **Formula:**
  $$ \text{Credence} = \left[ \frac{T1 + T4}{2} \right] \times (1 - T2) \times T3 $$

  **Execution:**
  1.  **Metaphysical/Neural Gap Potential:** $\text{Average}(0.50, 0.50) = 0.50$
  2.  **Report Truthfulness (Non-Conceptual):** $1 - 0.70 = 0.30$
  3.  **Argument Weight:** $0.60$

  $$ 0.50 \times 0.30 \times 0.60 = 0.09 $$

  ### Final Credence

  **0.10 (10%)**

  *(Rounded from 0.09 to acknowledge model uncertainty)*

  ### Analysis of Drivers and Weak Links

  **Dominant Driver:**
  **Term 2 (Concept vs. Experience)** is the primary driver of this result. Because it enters the formula as $(1 - T2)$, it acts as a gatekeeper. If Term 2 rises to 0.90 (high confidence in PCS), the final credence drops to 0.03. If Term 2 falls to 0.30 (high confidence the report is truthful), the final credence jumps to 0.21. The metaphysical terms (1 & 4) set the ceiling, but Term 2 determines where within that ceiling the probability lands.

  **Weakest Link:**
  **Term 2** is also the weakest link. It relies entirely on interpreting introspective reports, which are notoriously unreliable.
  *   **Empirical Finding that would move it:** A high-resolution **neurophenomenological mapping** that dissociates somatosensory cortex activity from visual cortex activity during the report. If Mary's "warmth" report correlates with *only* visual cortex activation (identical to normal subjects) and *no* somatosensory activation, Term 2 would plummet (confirming the experience is actually crimson, mislabeled). Conversely, if "warmth" correlates with unique somatosensory cross-activation not present in normal subjects, Term 2 would rise (confirming the experience is actually different).
  *   **Philosophical Argument that would move it:** A robust defense of **Ineffability** suggesting that phenomenal concepts cannot be misapplied—if she feels it, she knows what it is, regardless of the label. This would push Term 2 toward 1.0, collapsing the credence that she lacks knowledge.
