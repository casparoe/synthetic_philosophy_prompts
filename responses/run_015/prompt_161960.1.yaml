answer: |-
  ### Brainstorming Candidate Mechanics

  Before settling on the final design, I considered three ways to stage the "amnesia" and betting structure within your constraints (90 minutes, index cards, chips).

  1.  **The "Physical Amnesia" Protocol:** Participants close their eyes. You tap them on the shoulder to "wake" them. If Tails, you tap them twice with a reset in between. They write a bet on a card each time they are tapped.
      *   *Verdict:* **Reject.** In a group of 16, logistics kill this. People peek. The timing of the second tap reveals the coin outcome (if the first tap didn't settle immediately). It consumes 40 minutes of a 90-minute session in setup and crowd control.

  2.  **The "Team Clone" Analogy:** Instead of one person waking multiple times, flip a coin. If Heads, one random participant is chosen to bet. If Tails, two random participants are chosen. They don't know how many others were chosen.
      *   *Verdict:* **Reject.** While mathematically isomorphic for betting, it loses the *self-locating* phenomenology. Participants think about "selection bias" rather than "where am I in time?" It makes the epistemic lesson (Goal #1) harder to extract in the debrief.

  3.  **The "Pre-Commitment Photocopy" Protocol:** Participants write one bet *before* the coin flip. You, as the House, enforce the structure: if Heads, you collect the bet once; if Tails, you collect the bet twice (simulated by processing the card twice).
      *   *Verdict:* **Select.** This is the most robust for a 90-minute workshop. It forces the "Policy" view (which is decision-theoretically sound) without lying about the amnesia. It makes the "double charge" on Tails physically explicit during settlement, which drives home the exploitability (Goal #2).

  ---

  ### Final Runnable Design: "The Awakening Market"

  **Materials:**
  *   Whiteboard & markers.
  *   Index cards (at least 5 per participant).
  *   Poker chips (enough for each participant to start with 500).
  *   One large coin (visible).
  *   One D6 die (for Phase 2).

  **Core Payoff Rule (Write this on the board):**
  *   **The Ticket:** Pays **100 chips** if the Coin is **HEADS**. Pays **0** if **TAILS**.
  *   **The Cost:** You pay your posted price **per awakening**.
  *   **Settlement:** All bets settle at the end of the round based on the Coin.

  #### Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Introduction & Phase 1 Rules**
  *   Distribute 500 chips to each participant.
  *   **Script:** "We are running a market simulation. In each round, I will flip a fair coin. You will commit to a price for a ticket that pays 100 chips if Heads. Here is the constraint: You write your price *once*, before the flip. However, the cost is charged *per awakening*. If the coin is Heads, there is 1 awakening. If Tails, there are 2 awakenings. If Tails, I will charge you your price twice. If Heads, I charge you once. You do not know the outcome when you write the price."
  *   **Action:** Have them write "Round 1 Price" on a card, face down. Collect cards.

  **00:10 – 00:35: Phase 1 (The Standard Setup)**
  *   **Run 3 Rounds.**
  *   **Procedure:** Collect cards. Flip coin (hide result).
      *   If Heads: Announce "One awakening." Process each card once.
      *   If Tails: Announce "Two awakenings." Process each card twice (take chips from their stack two times).
      *   *Crucial:* Do not reveal the coin result until *after* chips are collected.
  *   **Settlement:** Reveal coin. Pay out 100 chips to everyone if Heads.
  *   **Leaderboard:** Update net chip counts on the whiteboard after every round.
  *   **Observation:** By Round 3, the "50 pricers" will be losing chips to the "33 pricers."

  **00:35 – 00:45: Phase 1 Debrief & Transition**
  *   **Script:** "Look at the leaderboard. Some strategies are bleeding chips. Why? If the coin is fair, why isn't 50 the right price?"
  *   Allow 2 minutes of table talk. Do not resolve it yet.
  *   **Script:** "We are changing the rules. The coin is still fair. Heads is still 1 awakening. But now, if Tails, I roll a die. You will be awakened that many times. You don't know the roll result."

  **00:45 – 01:05: Phase 2 (Variable Tails)**
  *   **Run 2 Rounds.**
  *   **Procedure:** Same as Phase 1, but roll the D6 behind a screen if Tails.
      *   Example: Tails + Roll 4 = Charge price 4 times.
  *   **Settlement:** Reveal coin and die roll. Pay out.
  *   **Goal:** The "1/3" pricers (from Phase 1) will now lose money if they stick to 33. The "50" pricers lose even faster. A new price (around 22) emerges.

  **01:05 – 01:20: Phase 3 (The House Role)**
  *   **Pair Up:** Participants form pairs.
  *   **Script:** "Person A: You are forced to bet 50 chips every time. Person B: You are the House. You decide whether to accept Person A's bet. If you accept, you take the other side. If Person A pays 50 for a Heads ticket, you pay them 100 if Heads, and keep their 50 if Tails."
  *   **Task:** Play 4 rounds. Person B records their profit.
  *   **Goal:** Person B should realize they *always* want to accept the bet. They are printing money against the "50" strategy.

  **01:20 – 01:30: Final Debrief & Reveal**
  *   **Reveal:** "This is the Sleeping Beauty problem."
  *   **Map the lessons:**
      1.  **Betting vs. Belief:** Phase 3 showed that pricing at 50 is *pragmatically* wrong (you get exploited). Does that mean your *belief* in Heads should be 1/3? (Open question).
      2.  **Counting Centers:** Phase 2 showed that simple counting (1 vs 2) fails when the count varies. You must weight by probability.
      3.  **The Halfer Reply:** "I still believe Heads is 50%, but I bet lower because the bet is rigged against me."

  ---

  ### Exact Scripting for Key Announcements

  **The Phase 1 Instruction (Read Aloud):**
  > "In front of you is a stack of chips and a deck of cards. We are running rounds. In each round, I flip a fair coin.
  >
  > Your job is to set a price for a ticket. This ticket pays 100 chips if the coin lands Heads. It pays nothing if Tails.
  >
  > Here is the catch: You write your price *now*, before I flip. But you will be charged that price *every time you are awakened*.
  >
  > If I flip Heads, you are awakened once. You pay your price once.
  > If I flip Tails, you are awakened twice. You pay your price twice.
  >
  > You do not know the coin result when you write the price. You cannot change your price between awakenings. Write your price on a card, face down. Hand it to me."

  **The Phase 2 Instruction (Read Aloud):**
  > "New rule. Heads is still one awakening. But if Tails, I roll a six-sided die. If I roll a 4, you are awakened four times. You pay your price four times. You do not see the die roll until the round ends. Adjust your price accordingly."

  **The Debrief Hook:**
  > "In Phase 3, the 'House' made free money off the '50 pricer.' If a price allows someone to take free money from you, is it the right price? And if it is the right price, does that mean you should *believe* Heads is less likely than 50%? Or does it just mean the betting rules are unfair?"

  ---

  ### Chip Payoff Scheme (No Real Money)

  To make exploitability visible without bankruptcy ending the game early:
  *   **Starting Stack:** 500 chips.
  *   **Max Bet:** 100 chips.
  *   **Rounds:** 5 total (3 Phase 1, 2 Phase 2).
  *   **Visual Loss:** If a player drops below 200 chips, mark their name with a red asterisk on the whiteboard ("Vulnerable").
  *   **Incentive:** The top 3 chip holders get "bragging rights" (or first pick of snacks next week).
  *   **Why this works:** A "50 pricer" expects to lose 25 chips per round (Exp Value = -25). Over 5 rounds, that's -125 chips. This is a visible 25% drop in stack, enough to feel painful, but not enough to eliminate them from Phase 3.

  ---

  ### Rejected Ideas & Why

  1.  **Physical Amnesia (Tapping/Sleeping):** I discarded this because it requires perfect information control. In a room of programmers, someone will notice the timing difference between the first and second "awakening" on Tails, or someone will peek when the facilitator walks back for the second bet. It turns the workshop into a security drill rather than a philosophy exercise. The **Pre-Commitment** method captures the *decision structure* (which is what matters for the Dutch Book argument) without the logistical fragility.
  2.  **Team Clone Analogy:** I discarded this because it shifts the problem from *self-locating belief* ("Where am I in time?") to *selection bias* ("Which person was picked?"). While the math is identical, the philosophical friction comes from the "I" being duplicated. The Pre-Commitment method preserves the "I am the one betting" perspective better.

  ---

  ### Predictable Failure Modes & Handling

  **1. The Programmer: "Is settlement per awakening or per run?"**
  *   *Prediction:* They will ask this immediately in Phase 1.
  *   *Handling:* Do not answer privately. Stop the room. "That is the exact question this workshop is designed to answer. If you assume 'per run', price at 50. If you assume 'per awakening', price at 33. Write down your assumption in your price. The leaderboard will tell you which assumption the universe punishes."

  **2. The Refuser: "I won't bet at a rigged price."**
  *   *Prediction:* One person sits out to protest the "unfair" Tails multiplier.
  *   *Handling:* Allow it, but assign them the role of "Auditor." They must track the House's chip count to ensure you aren't cheating. This keeps them engaged in the math without forcing participation. In the debrief, ask the Auditor: "Did the House gain chips overall? Why?"

  **3. The Spoiler: "I know this, it's Sleeping Beauty."**
  *   *Prediction:* They shout it out in Phase 1.
  *   *Handling:* Pre-brief them if possible. If not, say: "Great, then you know the stakes. I need you to play *straight*. If you sandbag or play the 'correct' answer too obviously, you ruin the data for everyone else. Can I trust you to play your actual intuition first?"

  **4. The Split: "Half the room bets 50, half bets 33, and they stop caring."**
  *   *Prediction:* Polarization leads to disengagement.
  *   *Handling:* Use Phase 3 to force interaction. The "50 pricers" *must* pair with "House" players. When the House player prints money off them, the social pressure to update becomes real.

  ---

  ### Limitations: What You Must Say Out Loud

  You are correct that this activity cannot fully reproduce the epistemic tension of actual memory erasure. In the debrief, you must explicitly state:

  1.  **Policy vs. Credence:** "We tested what price *protects you from loss*. That is a decision-theoretic fact. It does not prove your *credence* (belief) is wrong. A Halfer can say: 'I believe Heads is 50%, but I know the betting rules punish me for being awake on Tails, so I bet 33%.' This workshop proves the betting price, not the belief."
  2.  **The "Center" Assumption:** "In Phase 2, the '1/3' answer failed. Why? Because 'counting awakenings' only works if you know the count. The real lesson is that you must weight possibilities by their probability, not just count them. The dispute between Halfers and Thirders is often about whether an 'awakening' is a new piece of evidence or just a scheduled event."
  3.  **The House Edge:** "Phase 3 showed that if you price at 50, you are offering a subsidy to the House. In the real world, if your beliefs lead you to accept losing bets, we usually say those beliefs are 'wrong.' But in philosophy, we distinguish between 'wrong belief' and 'bad betting strategy.' Keep that distinction in mind."

  This design respects your constraints, hits your three learning goals, and manages the group dynamics of a rationality meetup.
