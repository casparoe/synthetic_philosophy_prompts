      *   **Direct Answer:** Reject **(4)** (Downward Implementation) as stated, but keep the spirit of (1).
      *   **Why (4) fails:** Isomorphism $\neq$ Implementation. A map of a city isn't the city. A sub-part of a calculator doesn't calculate unless it's causally active in the right way.
      *   **Refining the Colleague's Fix:** It's not about "no external input." It's about **Functional Integration**. A brain is integrated by the skull/skin/homeostasis. A model is integrated by the architecture/training loop.
