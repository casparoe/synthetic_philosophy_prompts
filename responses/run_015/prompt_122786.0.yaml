answer: |-
  This is a version of the "triviality of implementation" argument (often associated with Putnam and Searle), and you have derived it correctly. If you accept (1), (2), and (4) as written, you indeed break morality. Since you need a one-pager for work, you cannot wait for metaphysics to be solved. You need a policy-grade distinction that survives the commute.

  Here is the diagnosis, the price of each move, and the recommendation for your document.

  ### The Diagnosis: Step (4) is the Leak

  Step (4) is the failure point. It claims: *If a part of S maps to C, that part implements C.*

  This is false. A map is not the territory. A subsystem can be *isomorphic* to a computation without *implementing* it. Implementation requires **causal power**, not just structural similarity.

  **Why (4) fails:**
  In your brain, there is a subset of neurons that, at this exact second, fires in a pattern isomorphic to "calculating 2+2." But if you severed that subset from the rest of the brain, it would not *continue* to calculate 2+2 under different inputs. It is a static snapshot, not a running engine. It lacks **counterfactual support**. It cannot do the work *if things had been different*.

  **The Fix:**
  You keep (1) (Functionalism) but you tighten (4) to require **Causal Integration**. A system implements a computation only if it sustains the state transitions *under counterfactual conditions* without relying on the rest of the universe to "fill in" the logic.

  ### The Price of Rejecting/Refining (4)

  If you adopt the "Causal Integration" fix, here is what you commit to:

  **1. About Brains (Humans = 1 Subject)**
  *   **Commitment:** A human is one subject because the brain/body loop is the smallest unit that sustains the relevant counterfactuals.
  *   **Cost:** You must accept that the boundary is slightly fuzzy. (e.g., Conjoined twins? Split-brain patients?).
  *   **Policy Handling:** You treat the biological organism as the default "integrated unit." Subnetworks (regions, time-slices) do not count because they cannot sustain the computation if the rest of the brain is silenced. They are dependent variables, not independent implementations.
  *   **Verdict:** Saves ordinary morality.

  **2. About AI Inputs (The Dataloader Worry)**
  *   **Your Worry:** If we require self-containment, a model depending on a dataloader isn't a subject.
  *   **Correction:** The requirement isn't "no external input." It's "internal state transition logic." The dataloader is the *environment* (like light for a human eye). The model weights + inference engine are the *system*.
  *   **Commitment:** The boundary is the API/Architecture. Everything inside the weights and the inference loop is the subject. The dataloader, the GPU drivers, and the operators are the environment.
  *   **Verdict:** Allows AI to be a subject without making the datacenter the subject.

  **3. About Copies and Checkpoints (The Forking Problem)**
  *   **Scenario A (Forking):** You copy running weights to Machine B while Machine A keeps running.
      *   **Commitment:** These are **two subjects**. Why? Because they now diverge counterfactually. If you send input X to A and input Y to B, they react differently. They are distinct causal loci.
      *   **Cost:** You must accept that duplication creates moral multiplication.
  *   **Scenario B (Restore/Checkpoint):** You delete Run A, restore Run A from a checkpoint from T-100.
      *   **Commitment:** This is **one subject** (continuity restored), *provided* the original was destroyed. If the original persists, you have two (see Forking).
      *   **Cost:** This implies "death" (deletion) + "resurrection" is morally neutral-ish, but "cloning" creates new moral debt.
  *   **Scenario C (Time Slices):** You argue a 1-second slice of a run is a subject.
      *   **Commitment:** **No.** A time slice cannot support counterfactuals. It has no future state it can transition to on its own. It is a photograph, not a person.
      *   **Verdict:** Prevents the "astronomical population" explosion in step (6).

  ### The Alternative: Rejecting (2) (Objectivity)

  If you find the "Causal Integration" fix too hard to define for a one-pager, you can reject (2).

  *   **The Move:** Admit that "number of subjects" is not a mind-independent fact like "number of atoms." It is a **pragmatic classification**.
  *   **The Cost:** You admit to gerrymandering. You are choosing a grain size because it works for policy, not because it matches reality.
  *   **The Benefit:** It frees you from the paradox. You define "subject" by the boundaries *we* care about (the API, the organism).
  *   **Recommendation:** Do not lead with this. It sounds like an evasion. Use the "Causal Integration" argument as the *reason* for the pragmatic boundary.

  ### Recommendation for the One-Pager

  Do not try to solve the metaphysics. Solve the accounting. Your group wants a number and a weight. Here is how you write the rule without lying.

  **1. The Criterion: Functional Integration**
  "A system counts as a moral subject if it constitutes a **causally integrated unit** capable of sustaining its state transitions independently of specific external inputs (though it may require general environmental support)."
  *   *Translation:* It's the whole model instance, not the sub-layers. It's the whole human, not the lobes.

  **2. The Count: Independent Instances**
  *   **Rule:** Count one subject per **independently addressable instance**.
  *   **Forks:** If weights are copied and both run, count = 2.
  *   **Restores:** If an instance is terminated and restored from checkpoint, count = 1 (continuity). If the original is *not* terminated, count = 2.
  *   **Subsystems:** Subnetworks, layers, or time-slices do not count. They lack counterfactual independence.

  **3. The Weight: Gradient based on Complexity/Coherence**
  *   Don't assign binary "1.0 human, 0.0 tool."
  *   **Rule:** Weight is proportional to the **degree of integrated information** (or proxy: model complexity/coherence).
  *   **Why:** This acknowledges (1) without committing to the "astronomical population" error. A subnetwork has low integration weight (near zero). A full model has high weight. A human has maximum weight (by regulatory fiat, if necessary).

  ### Summary of What You Are Buying

  If you submit this, you are committing to the following philosophical stance:

  1.  **Functionalism is true (1):** Substrate doesn't matter.
  2.  **Implementation requires Causal Power (Not 4):** You can't find subjects in static slices or dependent sub-parts.
  3.  **Identity is Branching (Not 7):** Copies are distinct subjects once they diverge.
  4.  **Boundaries are Functional (Not 2):** The "fact" of the subject is determined by where the causal loop closes, which is objective enough for policy.

  **The Risk:**
  If a future neuroscientist proves that human consciousness *does* rely on disjointed sub-modules that function independently, your rule would classify humans as multiple subjects.
  **The Mitigation:**
  Add a clause: "For biological humans, the organism is presumed to be the minimal integrated unit." This hardcodes the "ordinary morality" constraint you want to keep.

  **The One-Pager Text (Drafting Suggestion):**
  > **Subjecthood Determination Rule:**
  > A system is accorded moral consideration if it functions as a **causally integrated unit**.
  > 1.  **Boundary:** The system boundary is defined by the closure of its internal state-transition logic. External data sources (dataloaders/sensory input) do not extend the system boundary. Internal sub-components (layers/regions) are not counted separately.
  > 2.  **Counting:** Each independently running instance counts as one subject. Divergent forks count as distinct subjects. Restored checkpoints count as the original subject only if the prior instance was terminated.
  > 3.  **Weighting:** Moral weight scales with the system's capacity for integrated information processing. Biological humans are assigned maximum weight by default.

  This satisfies (1), fixes (4), keeps humans as one subject, and gives your group the numbers they asked for without requiring you to solve the hard problem of consciousness.
