  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Structure of Weakness of Will and Intertemporal Choice
  **Date:** October 26, 2023
  **Parties:** Normative-Rationalist Camp (Camp A) & Intertemporal-Mechanist Camp (Camp B)

  ## PREAMBLE: DEFINITION OF PARTIES

  To ensure clarity, the collaborating parties define their respective theoretical commitments as follows:

  *   **Camp A (Normative-Rationalist):** Holds that *akrasia* (weakness of will) is a distinctive failure of practical rationality in which an agent acts against her own all-things-considered judgment. Camp A maintains that hyperbolic discounting is, at best, a descriptive model of intertemporal preference reversal that fails to capture the normative and phenomenological structure of being divided against oneself.
  *   **Camp B (Intertemporal-Mechanist):** Holds that what philosophers call *akrasia* is exhaustively explained by hyperbolic or quasi-hyperbolic discount dynamics—including preference reversals, the value of precommitment, and associated neural correlates. Camp B maintains that talk of "best judgment" and "normative residue" is a dispensable folk-psychological overlay on underlying mechanistic processes.

  ---

  ## 1. AGREED CLAIMS AND CONCEPTUAL FRAMEWORK

  The following claims represent empirical, formal, or observational points upon which both Camp A and Camp B agree. These claims are distinguished from interpretive frameworks.

  **1.1 Formal Properties of Discounting**
  1.  **Exponential Failure:** The standard exponential discounting model ($U_t = \sum \delta^{t} u_t$) fails to accurately predict observed human behavior in intertemporal choice tasks, specifically regarding time inconsistency.
  2.  **Hyperbolic Shape:** Hyperbolic or quasi-hyperbolic discount functions (e.g., $\beta$-$\delta$ preference models) better fit empirical data regarding how humans value rewards over time. These curves exhibit a steep decline in value for short-term delays and a flatter decline for long-term delays.
  3.  **Preference Reversal:** Both camps agree that agents frequently exhibit preference reversals: preferring a larger-later reward at time $t_1$, but switching to a smaller-sooner reward at time $t_2$ as the sooner reward approaches, without new information arriving.

  **1.2 Mechanics of Precommitment and Self-Control**
  4.  **Existence of Precommitment:** Agents voluntarily incur costs to restrict their future choice sets (e.g., removing apps, locking savings accounts).
  5.  **Mechanistic Function:** Precommitment devices function by altering the payoff structure or availability of options at the time of potential temptation, thereby making the "temptation" option more costly or impossible to select.
  6.  **Violation of Resolutions:** There exist documented cases where agents violate prior resolutions. In some cases, this is accompanied by reported distress or regret (synchronic conflict); in others, the violation occurs without reported distress at the moment of action.

  **1.3 Empirical Findings on Self-Control**
  7.  **Delay of Gratification:** Performance on delay-of-gratification tasks (e.g., the Marshmallow Test) predicts various life outcomes, though the effect size is moderated by environmental stability and socioeconomic factors.
  8.  **Neural Correlates:** Neuroimaging studies consistently show differential activation between brain regions associated with immediate reward processing (e.g., ventral striatum) and regions associated with long-term planning and cognitive control (e.g., lateral prefrontal cortex) during intertemporal choice tasks.

  **1.4 Conceptual Framework for Collaboration**
  To facilitate disagreement without ambiguity, the parties adopt the following working definitions for the purposes of this collaboration. *Adoption of these definitions does not imply agreement on their ontological status.*

  9.  **Diachronic Authority:** This term refers to the source of binding power a prior resolution holds over a present agent.
      *   *Usage:* Camp A investigates whether this authority derives from **Rational Continuity** (the normative requirement to be consistent with one's own reasoning). Camp B investigates whether this authority derives from **Causal Constraint** (the external or internal mechanisms that make deviation costly or impossible).
  10. **Binding-Cost:** The effort, welfare loss, or subjective distress incurred by an agent in maintaining a resolution against competing impulses.
  11. **Binding-Residue:** The normative standing or sense of obligation that remains even when the **Binding-Cost** is eliminated by technology (e.g., when a precommitment device makes violating the resolution impossible, does the agent still feel they *should not* have wanted to violate it?).

  ---

  ## 2. DISAGREEMENTS TABLE

  The following table outlines the residual disputes. The wording in each column is endorsed by the respective camp as an accurate statement of their position, without requiring endorsement from the opposing camp.

  | Domain of Dispute | Camp A (Normative-Rationalist) Position | Camp B (Intertemporal-Mechanist) Position |
  | :--- | :--- | :--- |
  | **Ontological Status of Akrasia** | Akrasia is a sui generis failure of rational agency where the will fails to follow the intellect's best judgment. | Akrasia is a folk-psychological label for a preference reversal caused by shifting discount rates over time. |
  | **Normative Residue** | A "normative residue" exists: a prior resolution retains authority over the present self even after preferences shift, creating a rational obligation. | There is no normative residue; there are only competing preferences. When preferences shift, the "authority" of the prior preference ceases unless externally enforced. |
  | **Phenomenology of Conflict** | Synchronic conflict (feeling torn) is a common symptom of akrasia but not a necessary condition; diachronic betrayal can occur without it. | Without a present preference reversal or subjective conflict at the moment of action, there is no akrasia, only a change in utility maximization parameters. |
  | **Explanation of Precommitment** | Precommitment is a rational strategy to protect the authority of the "better self" against the "weaker self." | Precommitment is a demand for commitment technology to solve a time-inconsistency problem in a single agent with multiple temporal selves. |
  | **Role of "Best Judgment"** | "All-things-considered judgment" is a real cognitive state that can be overruled by passion or impulse. | "Best judgment" is a post-hoc narrative constructed by the prefrontal cortex to explain the output of competing neural valuation systems. |

  ---

  ## 3. CRUXES AND PREDICTIONS

  The following sub-questions represent the critical pivot points of the collaboration. Settling these empirically or conceptually would necessitate a significant shift in at least one camp's position.

  ### Crux 3.1: The Status of Normative Residue
  **Question:** Does a prior resolution retain authority over the present self (Diachronic Authority via Rational Continuity) even after present preferences have shifted, requiring hyperbolic models to explain this residue rather than eliminate it?

  *   **Test Case:** *The Regret-Free Violation.* An agent resolves to diet. At the time of eating, they genuinely prefer the cake (no synchronic conflict). Later, they do not regret eating the cake but acknowledge they violated their plan.
  *   **Camp A Prediction:** This is a case of *rational decay*. The agent failed to maintain the normative standing of their prior self. The absence of regret indicates a corruption of practical reason, not the absence of akrasia.
  *   **Camp B Prediction:** This is a case of *preference update*. The agent's discount function stabilized. There is no normative failure, only a change in valuation. Reports of "violation" are linguistic habits, not evidence of normative residue.

  ### Crux 3.2: Synchronic Conflict vs. Diachronic Betrayal
  **Question:** Are "synchronic conflict" (feeling torn at the moment of action) and "diachronic betrayal" (violating a prior plan without present subjective conflict) distinct phenomena, or does one collapse into the other?

  *   **Test Case:** *The Silent-Precommitment Case.* An agent binds herself via an automatic mechanism (e.g., a locked investment account with irreversible penalty). At the moment the binding takes effect (or when funds are needed), she experiences **no subjective conflict** because the option to spend is unavailable. Later, she reports she "would have done otherwise" (spent the money) had she been able, but does not feel she acted against herself *at the time*.
  *   **Camp A Prediction:** **Diachronic Betrayal exists.** Even without synchronic conflict, there is a normative failure of practical reason located in the prior willingness to rely on coercion rather than will, or in the underlying desire that was blocked. The **Binding-Residue** is present: the agent acknowledges the constraint was necessary because their rational agency was untrustworthy.
  *   **Camp B Prediction:** **No Akrasia occurred.** Without a present preference reversal at the moment of action, there is no conflict between temporal selves. The agent successfully utilized self-control technology. The retrospective report ("I would have done otherwise") is a confabulation based on memory of past preferences, not evidence of a distinct psychological state of weakness.

  ### Crux 3.3: Mechanism of Precommitment Success
  **Question:** Does precommitment succeed by altering underlying preferences (internal) or by imposing an external causal constraint, and does that distinction bear on whether weakness of will has occurred?

  *   **Test Case:** *The Pharmacological Intervention.* An agent takes a drug that chemically induces aversion to alcohol (e.g., disulfiram) versus an agent who takes a drug that enhances prefrontal regulation of impulse without inducing sickness.
  *   **Camp A Prediction:** The chemical aversion reduces **Binding-Cost** but leaves **Binding-Residue** untouched. If the agent desires alcohol but cannot drink due to sickness, weakness of will is *suspended*, not resolved. True resolution requires the alignment of judgment and desire.
  *   **Camp B Prediction:** Both interventions are functionally equivalent causal constraints on the choice set. The distinction between "changing the body" and "changing the mind" is biologically arbitrary. If the outcome (no drinking) is achieved, the time-inconsistency problem is solved.

  ---

  ## 4. VERBAL VS. SUBSTANTIVE DISPUTE STATEMENT

  The parties acknowledge that portions of the dispute may be verbal, while others are substantive. We identify the distinction as follows:

  **4.1 Potentially Verbal Disputes**
  *   **Labeling of Phenomena:** Whether to apply the label "akrasia" to cases of preference reversal without phenomenological distress is largely terminological. Camp A wishes to reserve "akrasia" for normative failures; Camp B wishes to reserve it for observable preference reversals.
  *   **"Self" Terminology:** Talk of "multiple selves" (Camp B) versus "divided agency" (Camp A) may describe the same underlying temporal inconsistency using different metaphors. If both agree on the mathematical structure of the inconsistency, the ontological status of the "selves" may be a verbal disagreement.

  **4.2 Substantive Disputes**
  *   **Existence of Normative Facts:** Camp A asserts the existence of normative facts about rationality that exist independently of an agent's current preferences. Camp B denies this, viewing rationality as instrumental efficiency relative to current preferences. This is a metaphysical disagreement, not verbal.
  *   **Explanatory Sufficiency:** Camp B claims neural/behavioral models *exhaust* the explanation of the phenomenon. Camp A claims these models miss the *first-person authority* and normative force of judgment. If it can be shown that neural data predicts not just choice but the *sense of obligation* (Binding-Residue), Camp B gains ground. If it can be shown that agents feel bound by resolutions even when preferences fully align (pure duty), Camp A gains ground.

  ---

  ## 5. STATUS OF CLAIMS: CONSENSUS VS. CONTESTED

  To prevent confusion regarding the broader academic landscape, we categorize the claims made in this document as follows:

  | Claim Category | Description | Examples from this Document |
  | :--- | :--- | :--- |
  | **Wide Consensus** | Claims accepted by the majority of experts in both philosophy of action and behavioral economics. | • Exponential discounting fails descriptively (1.1.1).<br>• Hyperbolic models fit data better (1.1.2).<br>• Precommitment devices are used to restrict choice sets (1.2.4).<br>• Neural correlates differ for immediate vs. delayed rewards (1.3.8). |
  | **Camp-Specific** | Claims that define the respective positions of Camp A or Camp B and are not accepted by the opposing side. | • **Camp A:** Akrasia is a failure of practical rationality distinct from preference reversal (Preamble).<br>• **Camp A:** Normative residue exists independently of preference (1.4.11).<br>• **Camp B:** "Best judgment" is a folk-psychological overlay (Preamble).<br>• **Camp B:** Akrasia is exhaustively explained by discount dynamics (Preamble). |
  | **Genuinely Open** | Empirical or conceptual questions where expert opinion is divided and which this collaboration seeks to address. | • Whether "diachronic betrayal" can occur without "synchronic conflict" (Crux 3.2).<br>• Whether precommitment eliminates weakness of will or merely bypasses it (Crux 3.3).<br>• The ontological status of "Diachronic Authority" (Rational vs. Causal) (1.4.9). |

  **Note on Consensus:** Neither the eliminability of normative language (Camp B) nor the irreducibility of practical reason (Camp A) is presented here as a settled consensus. These remain the core contested hypotheses of this collaboration. The "Agreed Claims" in Section 1 are limited to formal properties and observable behaviors that both sides accept as data points, regardless of their theoretical interpretation.
