answer: |-
  # The Million-Dollar Correlation: A Defense of One-Boxing in the 90% Newcomb Problem

  Newcomb's Problem is perhaps the most famous thought experiment in decision theory because it forces a collision between two deeply held intuitions about rationality. On one side stands the **Dominance Principle**, which suggests we should always choose the option that yields a better outcome regardless of the state of the world. On the other stands **Expected Utility**, which suggests we should maximize the probable value of our choice. In the standard formulation, where a predictor is nearly infallible, the tension is high. But in your variant, where the predictor is 90% reliable, the tension resolves into a stark arithmetic reality.

  The setup is familiar: Box A is opaque and contains either $1,000,000 or $0. Box B is transparent and contains $1,000. You may take only Box A (One-Box) or both Box A and Box B (Two-Box). A predictor has already determined the contents of Box A based on a forecast of your choice. If it predicted One-Box, Box A has $1,000,000. If it predicted Two-Box, Box A is empty. The predictor is 90% reliable.

  The question is not merely philosophical; it is financial. To determine the rational choice, we must first submit the strategies to the rigor of expected value calculations, identify the threshold where the logic flips, and then confront the dominance argument directly. Based on the math and the definition of rational agency, the verdict is clear: **you must One-Box.**

  ### The Arithmetic of Expectation

  To evaluate the strategies, we calculate the Expected Value (EV) for each choice. The reliability of the predictor ($p$) is 0.9. Consequently, the probability of the predictor being wrong ($1-p$) is 0.1.

  **Strategy 1: One-Boxing**
  If you choose to take only Box A, there are two possibilities regarding the predictor's prior move:
  1.  **Predictor was Correct (90% chance):** The predictor foresaw you would One-Box. Box A contains $1,000,000. You take $1,000,000.
  2.  **Predictor was Wrong (10% chance):** The predictor foresaw you would Two-Box. Box A contains $0. You take $0.

  $$EV(\text{One-Box}) = (0.9 \times \$1,000,000) + (0.1 \times \$0)$$
  $$EV(\text{One-Box}) = \$900,000 + \$0$$
  $$EV(\text{One-Box}) = \mathbf{\$900,000}$$

  **Strategy 2: Two-Boxing**
  If you choose to take both boxes, the possibilities flip:
  1.  **Predictor was Correct (90% chance):** The predictor foresaw you would Two-Box. Box A is empty. You take Box B only ($1,000).
  2.  **Predictor was Wrong (10% chance):** The predictor foresaw you would One-Box. Box A contains $1,000,000. You take Box A + Box B ($1,001,000).

  $$EV(\text{Two-Box}) = (0.9 \times \$1,000) + (0.1 \times \$1,001,000)$$
  $$EV(\text{Two-Box}) = \$900 + \$100,100$$
  $$EV(\text{Two-Box}) = \mathbf{\$101,000}$$

  **The Comparison**
  The difference is not subtle. One-Boxing has an expected value of **$900,000**. Two-Boxing has an expected value of **$101,000**. By choosing to Two-Box, you are voluntarily accepting a strategy that reduces your expected return by nearly $800,000. In any other context—insurance, investing, gambling—a rational agent would never ignore such a disparity in expected value.

  ### The Reliability Threshold

  It is worth asking: how bad does the predictor have to be before Two-Boxing becomes the mathematically superior choice? We can solve for the reliability threshold $p$ where $EV(\text{One-Box}) = EV(\text{Two-Box})$.

  $$p(1,000,000) = p(1,000) + (1-p)(1,001,000)$$
  $$1,000,000p = 1,000p + 1,001,000 - 1,001,000p$$
  $$1,000,000p = 1,001,000 - 1,000,000p$$
  $$2,000,000p = 1,001,000$$
  $$p = \frac{1,001,000}{2,000,000}$$
  $$p = 0.5005$$

  The threshold is **50.05%**. As long as the predictor is better than a coin flip by a mere fraction of a percent, One-Boxing yields a higher expected value. Since our predictor is 90% reliable, we are vastly beyond the threshold required to justify One-Boxing on purely statistical grounds. The math does not whisper; it screams.

  ### The Dominance Argument and Its Failure

  Despite this arithmetic, many people feel a strong pull toward Two-Boxing. This is the **Dominance Principle** argument, rooted in Causal Decision Theory. The reasoning goes like this:

  > "The predictor has already made its prediction. The money is already in the box (or it isn't). Your choice now cannot change the past.
  > *   **Case 1:** If Box A has $1,000,000, you get $1,000,000 by One-Boxing, but $1,001,000 by Two-Boxing. Two-Boxing is better.
  > *   **Case 2:** If Box A has $0, you get $0 by One-Boxing, but $1,000 by Two-Boxing. Two-Boxing is better.
  > Since Two-Boxing is better in both possible states of the world, it is the dominant strategy."

  This argument is intuitively seductive because it relies on a fundamental truth: you cannot causally influence the past. The money *is* locked away. However, the Dominance Principle relies on a hidden assumption: **Probabilistic Independence**. It assumes that your choice does not provide evidence about which state of the world (Full Box vs. Empty Box) you are in.

  In Newcomb's Problem, this assumption is false. Your choice is highly correlated with the contents of the box *because* of the predictor. If you Two-Box, it is 90% probable that you are in the "Empty Box" state. If you One-Box, it is 90% probable that you are in the "Full Box" state.

  To apply the Dominance Principle here is to ignore the correlation established by the predictor. It is akin to saying, "I know smoking is correlated with cancer, but since I already have the genes (the 'prediction'), lighting this cigarette won't change my genes, so I might as well smoke." While the cigarette doesn't change the genes, the decision to smoke is evidence that you possess the genes that make smoking likely (in this analogy). More accurately, in Newcomb's problem, the decision *is* the evidence.

  If you follow the Dominance argument, you are essentially saying, "I don't care that following this logic makes me 90% likely to walk away with only $1,000. I care that in the specific universe where I happen to be wrong, I get an extra $1,000." This prioritizes a specific metaphysical view of causality over the actual outcome.

  ### The Verdict: Rationality is About Winning

  We must now reach a verdict. Is the rational choice to follow the causal intuition that leaves you with $101,000 (on average), or the evidential strategy that nets you $900,000 (on average)?

  **The rational choice is to One-Box.**

  Here is the defense of this verdict: The goal of decision theory is to provide a framework for agents to achieve their goals. In this scenario, the goal is explicitly defined as maximizing monetary gain. A strategy that systematically yields $900,000 is superior to a strategy that systematically yields $101,000.

  If you Two-Box, you are effectively betting against the predictor. You are betting that you are part of the 10% minority where the predictor fails. While it is possible to win that bet, it is irrational to build your strategy on being the outlier when the odds are 9-to-1 against you.

  Proponents of Two-Boxing often claim that One-Boxers are engaging in "magical thinking," believing their choice reaches back in time to fill the box. This is a caricature. The One-Boxer does not believe their choice *causes* the money to appear. They believe their choice is *diagnostic* of the money being there. They understand that the predictor is simulating their decision process. By committing to One-Boxing, you are fulfilling the conditions that cause the predictor to put the money in the box.

  Consider the "Pre-Commitment" test. If you could bind yourself to a strategy before the predictor made its prediction, would you bind yourself to One-Box or Two-Box? Every rational agent would pre-commit to One-Boxing, knowing it triggers the $1,000,000 deposit. If it is rational to pre-commit to a strategy before the prediction, it must be rational to execute that strategy after the prediction, unless you believe your rationality changes over time. The money is locked, yes, but your access to it is keyed to the type of agent you are.

  ### Conclusion

  In the 90% reliability variant of Newcomb's Problem, the conflict between Causal Decision Theory and Evidential Decision Theory is resolved by the sheer magnitude of the expected value gap. The Dominance Principle fails because it treats the state of the box as independent of the agent's choice, ignoring the 90% correlation established by the predictor.

  The math is unambiguous: One-Boxing offers an expected return of $900,000, while Two-Boxing offers $101,000. The reliability threshold for One-Boxing is merely 50.05%, meaning the predictor need only be slightly better than chance to make One-Boxing the superior gamble. At 90%, the predictor is not just a gambler's edge; it is a near-certainty.

  Therefore, the rational choice is to **One-Box**. To do otherwise is to privilege a technical definition of causality over the tangible reality of wealth. Rationality is not about being able to argue that you *could* have taken the extra $1,000 in a counterfactual world; it is about walking away with the million dollars in this one.
