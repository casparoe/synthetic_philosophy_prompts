prompt: |-
  I was talking with some of my friends about Newomb's problem and we kept coming back to a variant that I cant seem to resolve, so I'd like you to write an essay on it. The setup is the standard one — a predictor has already made its prediction and locked the contents of the opaque box, and the transparent box has $1,000 — except that this time the predictor is only 90% reliable, meaning it gets your actual choice right 9 times out of 10. If it predicted you'd one-box, the opaque box has $1,000,000; if it predicted you'd two-box, the opaque box is empty.

  The question I want the essay to address: should you one-box or two-box in this 90%-reliability case? I want you to actually work out the expected values for both strategies (not just hand-wave about the dominance principle vs. expected utility, but do the arithmetic), and I want you to weigh the dominance argument (two-boxing always nets you the $1,000 in the transparent box "for free") against the expected-value argument (one-boxing is almost certainly worth $1M). I'm also curious whether there's a reliablity threshold at which the answer flips, and if so, where it is.

  Please reach a verdict and defend it — I don't want a non-committal "it depends" ending. Tell me, given a 90% reliable predictor, what you think the rational choice is and why, and make sure your conclusion is consistent with the math you did.
