  Your mate is also mistaken. Bayesians aren't immune; the reference class problem becomes the *model specification* problem. Which features interact? What's the prior? Without data on the specific conjunction of attributes, you still face sparse data issues. A naive Bayesian update assumes independence, which is likely false here (altitude sickness correlates with iron levels).

  The tool should use **hierarchical Bayesian modeling** (partial pooling). This estimates risk by borrowing strength from broader classes while respecting specific data, shrinking extreme estimates from small samples toward the global mean. It uses all data, not just the narrowest valid slice.

  **What would change my mind:** If you demonstrate that hierarchical assumptions (exchangeability) are violated so severely that pooling introduces dangerous bias compared to your cutoff.

  **Where my reasoning breaks:** If the covariates are highly non-linear or interactive in ways a standard hierarchical model can't capture without overfitting, making the simple heuristic more robust in practice despite being theoretically inferior.
