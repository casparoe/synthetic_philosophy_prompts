answer: |-
  The principle that unifies your affirmed judgments while excluding the rejected ones is **The Principle of Non-Accumulative Totality**.

  ### The Principle Stated

  A narrative structure instantiates the Borgesian denial of successive duration if and only if:

  1.  **Ordinal Inertia:** The chronological ordering of narrative units (chapters, sentences, events) possesses no causal or ontological weight, such that no unit derives its meaning or existence from a prior unit (excludes *Deterministic Prefiguration*).
  2.  **State Constancy:** The narrative system does not allow for the accumulation of distinct, traversable states that exist independently of one another (excludes *Lateral-Branch Narrative*).
  3.  **Closed Configuration:** The narrative must be intelligible only as a single, self-contained object where the end is implicit in the beginning, or the "whole" is viewed from a standpoint outside the sequence (includes *Amnesiac Loop*, *Originless Authorship*, *Future-Perfect Memoir*).

  ### Application to Your Verdicts

  *   **The Amnesiac Loop:** Affirmed. The protagonist's consciousness resets, preventing the accumulation of memory (Ordinal Inertia). The form repeats the same state (State Constancy). The reader perceives the loop as a single geometric figure rather than a line (Closed Configuration).
  *   **The Originless Authorship:** Affirmed. Causality is circular; the end creates the beginning. There is no "first" cause (Ordinal Inertia). The story is a closed circle (Closed Configuration).
  *   **The Lateral-Branch:** Rejected. This treats timelines as distinct containers that can be entered and exited. This accumulates distinct states (violates *State Constancy*) and treats time as a spatial landscape where order matters (violates *Ordinal Inertia*).
  *   **The Deterministic Prefiguration:** Rejected. This relies entirely on the "earlier" image having priority over the "later" event. It affirms the arrow of time it claims to transcend (violates *Ordinal Inertia*).
  *   **The Future-Perfect Memoir:** Affirmed (with reservation). By removing the present tense, it removes the moving spotlight of succession. The life is viewed as a completed block (Closed Configuration).

  ### The Necessary Sacrifice

  If simplicity is preferred over saving every verdict, you must sacrifice the **Future-Perfect Memoir**.

  **Reasoning:** The Principle of Non-Accumulative Totality is strongest when applied to *structural* or *ontological* conditions (loops, causality). The Future-Perfect Memoir relies on *grammatical* tense to achieve its effect. Grammar is inherently linear; the future perfect ("will have been") grammatically presupposes a temporal vector (a future point looking back at a past) even if it denies the present. To maintain the austere purity of Borges's "refutation"—which is metaphysical, not linguistic—the Memoir risks being exactly what you feared in the Prefiguration case: a decoration of linear chronology (via tense) rather than a collapse of it. If the principle is tightened to "Structural Acausality," the Memoir fails because it still relies on the linear convention of tense to simulate timelessness.

  ### Application to the Footnote Case

  **Verdict:** **Authentic.**

  **Prediction:** The Principle of Non-Accumulative Totality affirms the footnote scenario. By removing the main text, you remove the anchor of linear progression. By having footnotes cite one another in an order that contradicts their numbering, you render the ordinal sequence (1, 2, 3...) ontologically inert (*Ordinal Inertia*). The meaning exists only in the relational web of the apparatus, not in the sequence of reading. This is not merely an arch exercise; it is a topological map of time where priority is purely relational, mirroring the idealist view that time is a network of perceptions rather than a river. It fits *Closed Configuration* because the apparatus refers only to itself.

  ### Application to the Unlisted Scenario (Polyglot Sentence)

  **Scenario:** Identical sentence on every page, different languages, no authoritative translation, no progression.

  **Verdict:** **Authentic.**

  **Prediction:** This is the purest possible instantiation of the principle.
  1.  **Ordinal Inertia:** Page 50 has no priority over Page 1. The sequence of reading is physically necessary but semantically null.
  2.  **State Constancy:** The semantic state never changes; there is no accumulation of meaning or plot.
  3.  **Closed Configuration:** The book functions as a single object—a prism refracting one light into many colors—rather than a sequence of events.

  This scenario avoids the "decoration" trap because it does not pretend to be a story unfolding; it openly declares itself as a static object occupying duration. It aligns perfectly with Borges's assertion in *A New Refutation of Time* that "time is a delusion" and that the identity of the self (or the sentence) across moments is a fiction. Here, the fiction is stripped away: the sentence is identical, the moment is identical, and the progression is revealed as a material necessity of the book form, not a temporal reality.
