      *   **The "Mira" Ethics:** Is it okay to pretend she's still there? She left in 2019. It's now 2024 (implied). 5 years later. Customers think she's still working there. This is the biggest ethical red flag. It's not just AI vs. Human; it's "Is this employee still employed?"

