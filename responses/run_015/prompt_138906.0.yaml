  1. "The positions, stated plainly"

  1. **Hume's Is–Ought Gap:** You cannot derive a command from a fact alone. Knowing the world exists a certain way does not tell you how to act unless you already accept a goal or value. Facts describe reality; norms prescribe action. Mixing them without a bridging desire is invalid logic. The conclusion contains a commitment the premises lack.

  2. **Moore's Naturalistic Fallacy:** "Good" is a simple, indefinable notion. You cannot define it using natural properties like "pleasure" or "evolutionarily fit." If you claim "good means pleasure," it remains meaningful to ask, "But is pleasure good?" Therefore, the definition fails to capture the essence of value. Any descriptive definition leaves an open question.

  3. **Vernacular Naturalistic Fallacy:** Arguing something is morally right simply because it occurs in nature. Just because diseases or predation exist naturally does not make them good. Artificiality does not imply badness; naturalness does not imply goodness. It confuses existence with endorsement. This is a specific error in reasoning about value based on origin.

  2. "The translation"

  1. **Hume:** Execution traces and logs describe runtime behavior (is); specifications describe requirements (ought). No volume of telemetry entails a spec. You cannot infer a contract from traces without a bridging premise, like "availability matters." Tests are samples of behavior; they do not constitute norms. You need an external spec to judge the traces. Property-based tests generate cases, but the property itself is a normative assertion, not a discovered fact. Assertions check constraints, but the constraints themselves are the ought.

  2. **Moore:** Correctness cannot be defined solely by mined candidate invariants. Even if a function always returns null (descriptive property), asking "Should it return null?" remains open. Type inference might deduce a type, but it cannot force an annotation that reflects stakeholder intent. Goodness maps to spec compliance, which cannot be reduced to static analysis or observed patterns. The "open question" is whether the invariant matches the requirement. Types ensure safety, but not correctness.

  3. **Vernacular:** Asserting backward-compatibility constraints solely because legacy behavior exists. Just because the service *did* retry indefinitely for ninety days doesn't mean it *should*. This treats historical execution traces as normative contracts. It assumes "existing" equals "approved," ignoring that legacy code often contains bugs accepted as features. It confuses stability with correctness. The "natural" state of the system is just accumulated technical debt, not a design goal. Legacy behavior is descriptive, not prescriptive.

  3. "Residue report"

  (a) **The Gap:** The gap closes cheaply in engineering because bridging premises (SLAs, product requirements) are explicit inputs provided by stakeholders. In philosophy, justifying the premise is the hard part. The translation hides this difficulty by assuming stakeholders exist and their goals are legitimate. It turns a metaphysical problem into a product management ticket. The thesis loses its weight because engineering assumes goals are given.

  (b) **Hypothetical vs. Categorical:** Engineering oughts are hypothetical: "If you want uptime, retry." Moral oughts are often categorical: "Do not lie." My framework assumes all reasons are goal-relative. This smooths over the possibility of unconditional duties, which have no expression in spec-driven development. This is a significant flattening of the concept. We have no vocabulary for duties that persist even if the stakeholder changes their mind. If a stakeholder demands unsafe behavior, engineering has no internal recourse.

  (c) **Thick Concepts:** Defect words like "broken" relocate the norm into the definition. "Broken" means "violates spec." This doesn't cross the gap; it hides the normative premise inside the contract. In ethics, "cruel" might carry intrinsic normativity. In code, the norm is always external (the spec). This isn't a philosophical position, just engineering pragmatism. The normativity is borrowed from the stakeholder, not inherent in the code. Claims like "underspecified" are factual reports about missing contracts, not moral judgments.

  4. "Whose fault is the residue"

  The residue is mostly the vocabulary's fault. Engineering vocab is instrumentalist; it assumes goals exist. It cannot express categorical duties. However, the teammates' claims were also weak. Moore's point is irrelevant; correctness is defined by consensus, not intrinsic goodness. The vernacular fallacy is real but easily dismissed; legacy isn't sacred. Hume's point is valid but trivial here; we always have stakeholders. The philosophical depth is real, but its application to retry logic was pretentious. The vocabulary isn't broken; the analogy was. They used deep truths to avoid making a decision. Philosophy deals with ultimate justification; engineering deals with intermediate constraints. Using metaphysics to stop a design review is category confusion.

  5. "What I should have said at the design review"

  Acknowledge the distinction, then pivot to requirements. "Telemetry shows what happens, not what we promised. We need a spec to decide retries." For the legacy argument: "Past behavior isn't a contract unless documented." Don't let philosophy block decisions. Define the goal (availability vs. cost), then decide. Neither conversation-stopper is a good reason to leave behavior unchanged without a spec. Use the gap to demand requirements, not to stop work. Say: "You're right, logs aren't specs. So let's write the spec." Turn the philosophical objection into a requirements gathering task. Force them to articulate the bridging premise.
