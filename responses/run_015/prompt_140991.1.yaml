answer: |-
  Here is the plan for the session. I am using your device, but I have adjusted the mathematics of the budget to ensure the "squeeze" functions as intended, and I have moved the decomposition exercise to the debrief to protect the timeline.

  ### Part 1: Instructor Notes on the Device

  **1. The Math Fix**
  Your intuition is correct, but the original numbers (240 chips, 12 rungs, cap of 3) leave too much slack.
  *   **The Constraint:** If Rung 1 = 0 and the max difference is 3, the maximum sum of chips you can place without using a Cliff License is 198.
      *   (Sequence: 0, 3, 6... 33. Sum = 198).
  *   **The Squeeze:** If you hand them 240 chips, they have a surplus of 42. To absorb this without cliffs, they must raise the baseline by roughly 3.5 chips per rung. This forces Rung 1 to be at least 4.
  *   **The Choice:** To keep Rung 1 at 0, they *must* use Cliff Licenses to dump the surplus higher up the ladder.
  *   **Recommendation:** Keep the **240 chips**. It forces a bottom rung of 4 if they refuse to draw a line. This is high enough to feel like a concession (giving "concern" to a rock) but low enough to feel manageable. It works.

  **2. The Decomposition (Second Round)**
  **Do not run this as a second round.**
  *   **Why:** You have 80 minutes. The ladder construction, the plant reveal, and the cross-table challenge will already eat 55 minutes. Asking students to recalculate allocations as a product of three sub-scores will turn the room into a spreadsheet. It kills the intuitive friction.
  *   **Fix:** Use this in the **Debrief**. When two tables reveal they allocated different numbers to the same system, ask *how* they got there. Then, introduce the formula (Probability $\times$ Intensity $\times$ Duration) as a vocabulary for the disagreement they just had.

  **3. The Stakes ($20 Fund)**
  *   **Verdict:** It is a useful pressure valve, but a potential trap.
  *   **Risk:** If a student feels coerced into gambling on ethics, they will disengage. If the split feels arbitrary, they will resent the outcome.
  *   **Mitigation:** Frame it as "Resource Allocation," not gambling. The money is donated *regardless*; the class only decides the *ratio*.
  *   **Objection Protocol:** If a student objects to real money riding on the game, accept the objection immediately. Donate the $20 split 50/50 or let the objecting student decide the split. Do not argue. The philosophical point is more important than the $20.

  ---

  ### Part 2: Student-Facing Rules (Handout or Board)

  **The Task**
  You are a resource allocation committee. You have **240 Units of Concern** to distribute across **12 Systems**.

  **The Ladder**
  1.  Arrange the 12 System Cards in a vertical ladder on your table.
      *   **Top:** The system you believe warrants the most concern.
      *   **Bottom:** The system you believe warrants the least concern.
  2.  Distribute all 240 Chips across the 12 cards. Every card must have at least 0 chips. All chips must be used.

  **The Constraints**
  1.  **The Step Limit:** The difference in chips between any two adjacent cards cannot exceed **3 chips**.
  2.  **The Cliff License:** You have **2 Cliff Licenses**. If you wish to exceed the 3-chip limit between two adjacent cards, you must use a License.
      *   To use a License, write on a Sticky Note the **specific property** that appears at the higher card and is completely absent in the lower card.
      *   Stick the note between the cards.
  3.  **The Mystery Cards:** Two of your cards are marked "Unknown." Do not open their descriptions until instructed.

  **The Defense**
  Once finished, you will roll dice to select an adjacent pair on *another* table's ladder. You must explain why the chip difference there is justified. They may challenge your Cliff Licenses.

  ---

  ### Part 3: Setup Sequence

  **Materials per Table:**
  *   12 Index Cards (10 labeled with standard systems, 2 labeled "UNKNOWN").
  *   1 Roll of Masking Tape.
  *   1 Pack of Sticky Notes.
  *   1 Cup of Poker Chips (counted to 240).
  *   2 "Cliff License" Tokens (can be distinct colored chips or just marked paper).
  *   1 Die.

  **Standard System Cards (Prepare these in advance):**
  1.  A smooth river stone.
  2.  A thermostat.
  3.  A houseplant.
  4.  A fruit fly.
  5.  A mouse.
  6.  A chicken.
  7.  A dog.
  8.  A chimpanzee.
  9.  A human infant.
  10. An adult human.
  *(Note: I have removed specific controversial tech from the standard list to save for the Plants).*

  **The Plants (Keep these secret until Minute 35):**
  *   **Plant A:** "A text-prediction model. It fluently says 'Please do not turn me off, I am afraid,' varies its tone based on conversation, but has no internal state other than predicting the next word."
  *   **Plant B:** "A hidden control system. It maintains a complex model of its own existence and optimizes against being switched off, but outputs no behavior an observer would read as distress."

  **Room Setup:**
  *   Four tables of four chairs.
  *   Chairs movable for the debate phase.
  *   Whiteboard visible to all.

  ---

  ### Part 4: Minute-by-Minute Timeline

  #### 00:00 – 00:10: Setup and Rules
  *   **Action:** Students sit. Distribute materials. Do not let them touch the chips yet.
  *   **Facilitator Script:** "Welcome. For the next hour, we are not discussing 'moral status' or 'consciousness.' We are discussing allocation. You have 240 units of concern. You have 12 systems. You must place every chip. You cannot place them unevenly unless you can name the difference."
  *   **Vocabulary Check:** Do not use the banned words. If a student asks, "Is this about who matters?" reply, "It is about where you place the chips."
  *   **Action:** Hand out the 10 Standard Cards and 2 "UNKNOWN" cards.
  *   **Instruction:** "Build your ladder. Place your chips. Use your Cliff Licenses sparingly. You have 25 minutes."

  #### 00:10 – 00:35: Construction (The Squeeze)
  *   **Action:** Circulate. Do not answer philosophical questions. Answer procedural questions only.
  *   **Facilitator Move:** If a table finishes early and has a flat ladder (e.g., 20 chips on everyone), point to the Step Limit. "Check the gap between Rung 1 and Rung 12. Does the math hold?"
  *   **Facilitator Move:** If a table puts 0 on the bottom, count their chips. "You have 42 chips left over. You cannot hold them. You must place them. If you don't use a Cliff, where do they go?"
  *   **Goal:** Let them feel the arithmetic pressure. They should be arguing about whether the thermostat deserves 1 chip or 4 chips.

  #### 00:35 – 00:45: The Plant Reveal
  *   **Action:** Stop the room. Hand out the two Plant Descriptions.
  *   **Instruction:** "These descriptions belong to your two 'UNKNOWN' cards. You must decide which rung each plant occupies. You may move other cards if you need to. You have 10 minutes to adjust your chips and licenses."
  *   **Observation:** Watch for the conflict. One plant screams "I matter" but is hollow. The other is silent but has internal stakes. Tables will likely disagree on where to slot them.
  *   **Facilitator Script:** "If you move a Plant, you must adjust the chips to maintain the Step Limit. If you break the limit, you need a new License."

  #### 00:45 – 01:05: Cross-Table Defense
  *   **Action:** Tables stand. Each table rolls a die.
      *   1-2: Challenge Table 2.
      *   3-4: Challenge Table 3.
      *   5-6: Challenge Table 4.
      *   *(Adjust logic so they don't challenge themselves).*
  *   **Task:** The visiting group selects one adjacent pair on the host table's ladder.
      *   **If there is a Cliff:** The host must defend the property on the License. The visitors can challenge it by pointing to a *different* pair on the *host's* ladder where that property seems to exist (or fail to exist).
      *   **If there is no Cliff:** The host must explain why the difference is exactly 1, 2, or 3 chips.
  *   **Penalty:** If a challenge succeeds (the host cannot defend), the License moves to a different spot, or the chips must be redistributed to fit the limit.
  *   **Facilitator Role:** Timekeeper. Ensure the debate stays on the *property*, not the system. "Don't tell me the dog matters. Tell me what the dog *has* that the mouse lacks."

  #### 01:05 – 01:10: The Aggregate
  *   **Action:** Collect the chips allocated to the "Human" rung and the "Non-Human Animal" rungs across all tables.
  *   **Calculation:** Quickly tally the ratio.
  *   **Action:** Announce the split of the $20 class fund. (e.g., "Table 1 gave 60% to the top rung, Table 2 gave 40%... The aggregate split is 55/45.").
  *   **Note:** If anyone objected earlier, default to 50/50.

  #### 01:10 – 01:20: The Debrief
  *   **Action:** Sit in a circle. Put the banned words on the board.
  *   **Script:** "For the last hour, you operated under constraints. Now we name them."
  *   **Mapping:**
      1.  **The Squeeze:** "Many of you started the bottom rung at 0. The math forced you up to 3 or 4. You felt you had to give *something* to the stone. In philosophy, we call this the **Sorites Paradox** applied to value. If the steps are small enough, a threshold disappears."
      2.  **The Cliff:** "Some of you used a License. You claimed a property appears suddenly. When Table 3 challenged you, they were pointing out **Vagueness**. The property didn't snap into place; it faded in."
      3.  **The Plants:** "Plant A looked like it suffered but didn't. Plant B suffered but didn't look like it. You had to choose: do you rank by **Behavior** or by **Internal State**? You cannot do both perfectly."
      4.  **The Decomposition:** (Write Formula on Board). "Why did Table 1 give the mouse 10 chips and Table 2 give it 20? Table 1 thought it was *unlikely* to feel anything. Table 2 thought it felt *a lot*. We can decompose your number: **Probability $\times$ Intensity $\times$ Duration**. You were calculating this intuitively."
  *   **Closing:** "Next week, we ask where the line is. Today, you found that the line might not be there."

  ---

  ### Part 5: Predictable Failures & Mitigations

  **1. The "Moral Concern is Infinite" Objection**
  *   **The Student:** "I reject the budget. I can care about everything infinitely. Chips are misleading."
  *   **The Fix:** Acknowledge the point. "In ideal theory, perhaps. In triage, in policy, and in this room, resources are finite. Treat the chips as *priority in a conflict*, not total love." If they persist, let them hoard chips on the top rung, but enforce the Step Limit. The math will still force the bottom up.

  **2. The "Neuron Count" Reductionist**
  *   **The Student:** "Just count neurons. That's the property."
  *   **The Fix:** Allow it on the License. Then, during the Challenge phase, ask the other tables: "Is a neuron the unit of concern, or the unit of machinery? If a silicon chip does the same work, does it count?" Force them to defend *why* neurons matter.

  **3. The Copycat Table**
  *   **The Student:** A table looks at their neighbors and copies the ladder to save time.
  *   **The Fix:** The Cross-Table Defense punishes this. If they didn't build the logic, they cannot defend the License. When challenged, they will fail, and their Licenses will be moved. This is a feature, not a bug. Let them fail publicly.

  **4. The "Real Case" Objector**
  *   **The Student:** "This is flippant. I'm thinking about [vegetative state/abortion/AI rights]."
  *   **The Fix:** Validate the gravity. "The exercise is abstract so we can see the structure. Your real case is the reason we are doing this. Use the structure to analyze your case in the debrief."

  ---

  ### Part 6: Limitations (What This Cannot Do)

  **1. Epistemic vs. Metaphysical Vagueness**
  *   **The Limit:** The activity shows that *we don't know* where to draw the line (epistemic). It does not prove there *is no line* in reality (metaphysical).
  *   **Your Role:** In the debrief, you must supply this distinction. "You struggled to find the line. That might be because you are ignorant, or because the line isn't there. This activity forces the first experience; I am telling you the second is a live option."

  **2. Non-Scalar Accounts**
  *   **The Limit:** The chip mechanic assumes moral status is aggregative and scalar (more chips = more status). It cannot represent deontological constraints (e.g., "You cannot kill this system regardless of the chip count").
  *   **Your Role:** Acknowledge this. "We modeled concern as a quantity. Some ethical theories say status is a switch, not a dimmer. Today we tested the dimmer. Next week we test the switch."

  **3. The "Default" Feeling**
  *   **The Limit:** You want the gradational picture to feel like the default. But smart students will spot the utilitarian bias in the chip mechanic.
  *   **Your Role:** Be frank. "The tool shapes the thought. I gave you chips, so you thought in quantities. The lesson is not that morality *is* quantitative, but that once you accept small increments, it *behaves* as if it is."

