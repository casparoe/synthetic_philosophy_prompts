      *   **User:** Journalist (columnist/feature writer) covering science/ideas/history misuse.
      *   **Task:** Create a *decision procedure* (ordered set of questions) to distinguish between historical revisionism, denialism, error, and legitimate debate regarding mass atrocities.
      *   **Constraints:**
          *   No mind-reading (motives are off-limits).
          *   Desk-bound (public records, consensus checks, no deep archival dive).
          *   Time-bound (runnable in a few hours).
          *   Defensible (to editors/lawyers).
          *   Must handle specific hard cases (Number Fighter, Denial by Subtraction, Legal-Category Dodge, State Ownership, Contrarian/Partisan).
          *   Must include an "Asymmetry Check."
          *   Must provide verdict wording guidance.
          *   Must run the procedure on two composites (including one uncomfortable verdict).
          *   Must flag genuine tests vs. judgment calls.
          *   Must admit limitations (what the procedure *cannot* do).
      *   **Tone:** Professional, blunt, practical, philosophical but actionable.

  2.  **Deconstruct the Core Problem:**
      *   The central tension is between *historical revisionism* (legitimate re-evaluation based on new evidence/methods) and *historical denialism* (ideologically motivated distortion to exonerate perpetrators or minimize suffering).
      *   The journalist cannot be the judge of historical truth *de novo*. They must be the judge of *methodological integrity* relative to consensus.
      *   The "Philosopher of History" angle means focusing on epistemology: How do we know what we know? What counts as evidence? How are claims justified?
      *   The "Newsroom" angle means focusing on liability, clarity, speed, and public impact.

  3.  **Brainstorming Failure Modes (as requested):**
      *   *False Positive (Crying Wolf):* Labeling a legitimate heterodox historian a "denier" because they challenge a sacred cow number. This damages credibility and aids actual deniers.
      *   *False Negative (Letting it Slide):* Calling sophisticated denialism "just a debate." This normalizes harmful falsehoods.
      *   *The Motive Trap:* Trying to prove *why* someone is writing this (antisemitism, nationalism, etc.). Impossible to prove without a confession or private emails. Must stick to *effect* and *method*.
      *   *The Consensus Trap:* Assuming "consensus" equals "truth." Consensus can be wrong, but in history, it's the baseline for "established knowledge." Deviating requires extraordinary evidence.
      *   *The Legal/State Trap:* Deferring to laws (e.g., Holocaust denial laws vs. state-sponsored denial). The procedure must be independent of state sanction.
      *   *The "Both Sides" Trap:* Applying the procedure unevenly based on political alignment (Case 5).

  4.  **Developing the Decision Procedure (The "Algorithm"):**
      *   *Phase 1: The Baseline Check.* Is the event established? (Filters out flat-earth style denial).
      *   *Phase 2: The Methodological Audit.* How are they arriving at their conclusion? (Sources, cherry-picking, expertise).
      *   *Phase 3: The Asymmetry Check.* (The user's specific request).
      *   *Phase 4: The Impact/Function Check.* What does the claim *do*? (Minimization, exoneration).
      *   *Phase 5: The Stop Rules.* When to call a lawyer/editor.

      *Refining the Questions:*
      *   Need to ensure they are observable.
      *   Need to distinguish between "wrong" and "denialist."
      *   Need to handle the "Number Fighter" (expertise matters).
      *   Need to handle "Denial by Subtraction" (causality matters).

  5.  **Drafting the Verdicts & Wording:**
      *   *Verdict A: Legitimate Revision/Debate.* (Wording: "contested," "argues," "challenges consensus").
      *   *Verdict B: Error/Poor Scholarship.* (Wording: "disputed by specialists," "lacks evidence," "methodologically flawed").
      *   *Verdict C: Denialism.* (Wording: "rejects established evidence," "minimizes," "contradicts historical record"). *Caution on using the D-word.*
      *   *Verdict D: Escalate.* (Legal/Editorial call).

  6.  **Addressing the Hard Cases (Integration):**
      *   *Number Fighter:* Differentiate based on *venue* and *method*. Peer review vs. self-publishing.
      *   *Denial by Subtraction:* Focus on *causal attribution*. Shifting from intent to accident.
      *   *Legal-Category:* Distinguish between *semantic* debate and *moral* minimization.
      *   *State Ownership:* Ignore the law, look at the evidence/consensus.
      *   *Contrarian:* Apply the Asymmetry Check rigorously.

  7.  **Running the Simulation (The Composites):**
      *   *Selection:* I need to run Case 1 (Number Fighter) and Case 2 (Denial by Subtraction) or Case 5 (Partisan). Let's do Case 1 (to show the expertise distinction) and Case 2 (to show the structural denial trap). Actually, the prompt asks for one where the verdict is one I "won't like." Case 5 (Partisan on "my side") is the best candidate for an uncomfortable truth. Let's run Case 1 (Number Fighter - Credentialled) and Case 5 (Partisan Hypocrisy).
      *   *Wait, re-reading prompt:* "Run the finished procedure end-to-end on two of the composites above, including at least one where the verdict it produces is one I won't like."
      *   *Decision:* I will run Case 1 (The Number Fighter - specifically the *non-credentialed* version to show the "Denial" verdict) and Case 5 (The Partisan Hypocrisy) to show the "Uncomfortable Verdict."
      *   *Correction:* To show the nuance of the "Number Fighter," I should probably show how the procedure splits the *credentialed* vs *non-credentialed* versions. But I can only run two composites. Let's run Case 2 (Denial by Subtraction) and Case 5 (Partisan). Case 2 is tricky structurally. Case 5 is the moral test.
      *   *Actually, looking at the constraints:* I need to demonstrate the procedure works. Case 1 is the most common. Case 5 is the most ethically demanding. I'll run Case 1 (Non-credentialed version) and Case 5.
      *   *Wait, better idea:* Run Case 1 (Credentialed Historian) to show it *doesn't* trigger denial, and Case 5 to show the uncomfortable bite. No, the prompt says "including at least one where the verdict it produces is one I won't like." This implies the journalist might want to call it denial, but the procedure says no, OR the journalist wants to let it slide, but the procedure says denial.
      *   *Let's go with:* Case 2 (Denial by Subtraction) -> Verdict: Denialist (Structural). Case 5 (Partisan) -> Verdict: Denialist (Uncomfortable).
      *   *Actually, let's look at the "Number Fighter" again.* If I run the *Accountant* version, it's easy denial. If I run the *Historian* version, it's easy revision. That's not interesting.
      *   *Best choice:* Case 2 (Denial by Subtraction) because it's subtle. Case 5 (Partisan) because it's the "loyalty test."

  8.  **Refining the "Asymmetry Check":**
      *   It's a heuristic, not a proof. I need to be blunt about its limits. It signals bias, not necessarily falsehood.

  9.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the stakes, set the philosophical frame (epistemology vs. politics).
      *   **The Procedure (The Flowchart):** Step-by-step questions with Stop Rules.
      *   **Verdicts & Wording:** Clear labels and copy guidance.
      *   **Simulation:** Running the composites.
      *   **Meta-Analysis:** Flagging tests vs. judgment calls.
      *   **Limitations:** Where the tool breaks.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid mind-reading? Yes, focus on text and method.
      *   *Check:* Is it runnable in hours? Yes, relies on search and consensus check.
      *   *Check:* Did I address the "State Ownership" issue? Yes, by grounding in scholarly consensus, not law.
      *   *Check:* Is the tone right? Needs to be serious, not academic waffle.
      *   *Check:* Did I answer the "Number Fighter" nuance? Yes, via the "Expertise/Peer Review" gate.
      *   *Check:* Did I handle the "Legal-Category Dodge"? Yes, distinguishing semantic precision from moral erasure.

  11. **Final Polish:** Ensure the distinction between "Revisionism" (good/neutral) and "Denialism" (bad) is operationalized, not just defined. The key is *methodological integrity* vs. *ideological outcome*.

  *(Self-Correction on the Simulation)*: I need to make sure I don't just say "Case 5 is denial." I need to walk through the *steps* of the procedure for that case to show *why* it lands there.

  *(Self-Correction on Wording)*: Journalists hate being told what to write. I should frame it as "Suggested Copy Guidance" based on liability and precision.

  *(Final thought on "Philosopher of History" persona)*: Emphasize that history is an evidence-based discipline, not a matter of opinion. The procedure protects the *discipline* as much as the *truth*.

  Let's build the procedure.
  *Step 1: The Existence Gate.* (Did it happen?)
  *Step 2: The Consensus Gate.* (What do specialists say?)
  *Step 3: The Method Gate.* (How did they get there?)
  *Step 4: The Asymmetry Gate.* (Do they apply this to their side?)
  *Step 5: The Function Gate.* (Does this exonerate?)

  Okay, ready to write.
answer: |-
  This is a high-stakes request. You are asking for an epistemological tool that functions as a legal safeguard. You cannot afford to be philosophically vague, nor can you afford to be legally reckless.

  The core philosophical distinction you need to operationalize is not between "truth" and "lies" (you cannot prove truth in a deadline window), but between **historical inquiry** (a method-driven process open to falsification) and **historical negationism** (an outcome-driven process immune to falsification).

  Below is the decision procedure. It is designed to be run in under three hours using search engines, academic databases (JSTOR/Google Scholar), and your newsroom's internal resources.

  ### The Procedure: The "Methodological Integrity" Audit

  **Pre-Condition:** This procedure applies only to claims regarding *established mass atrocities* (events where a scholarly consensus on the core facts already exists). It is not for breaking news or emerging conflicts.

  #### Step 1: The Existence Gate (Binary Filter)
  *Question:* Does the speaker explicitly deny that the core event (mass killing, systematic deportation, camp system) occurred at all?
  *   **YES:** **STOP.** Verdict: **Hard Denial.** (Proceed to *Wording Guidance A*).
  *   **NO:** Proceed to Step 2.
  *   *Note:* This catches the "It never happened" crowd. It does not catch the sophisticated cases you are worried about.

  #### Step 2: The Consensus Gate (The Baseline)
  *Action:* Search for the specific claim (e.g., "X event death toll," "X event cause") in Google Scholar or a major university library database. Look for review articles or standard textbooks from the last 10 years.
  *Question:* Is the speaker's claim contradicted by the overwhelming majority ( >90%) of credentialed specialists in that specific field/region/period?
  *   **NO (Claim is within mainstream debate):** **STOP.** Verdict: **Legitimate Revision/Debate.** (Proceed to *Wording Guidance B*).
  *   **YES (Claim is outside consensus):** Proceed to Step 3.
  *   *Constraint:* If you cannot determine consensus in 45 minutes, **STOP.** Verdict: **Escalate to Specialist.** Do not publish the judgment.

  #### Step 3: The Method Gate (The Crucial Filter)
  *Question:* Does the speaker support their claim using evidence and methods that are *in principle* acceptable to the field, even if their conclusion is rejected?
  *   *Checklist:*
      *   Do they cite archival sources, or only secondary sources that agree with them?
      *   Do they acknowledge counter-evidence, or do they omit it entirely?
      *   If they challenge a number, do they use demographic methods accepted by demographers, or do they use anecdote/geometry/assumption?
      *   **Crucial Sub-Question:** Is the work peer-reviewed in a recognized journal, or is it self-published/published by an advocacy press?
  *   **YES (Method is sound, Conclusion is outlier):** **STOP.** Verdict: **Fringe Scholarship / Error.** (Proceed to *Wording Guidance C*).
  *   **NO (Method is flawed/cherry-picked/immune to counter-evidence):** Proceed to Step 4.
  *   *Philosophical Note:* This is where you separate the "Number Fighter" historian from the "Number Fighter" accountant. The historian uses valid demography and gets peer review. The accountant uses invalid assumptions and a website.

  #### Step 4: The Asymmetry Check (The Bias Heuristic)
  *Action:* Review the speaker's past 5 years of public output regarding atrocities committed by *their own* identified group/nation/ideology.
  *Question:* Do they apply the same standard of evidentiary rigor to atrocities committed by their "side" as they do to the "other side"?
  *   **YES (Rigorous on both sides):** **STOP.** Verdict: **Fringe Scholarship / Error.** (Return to Wording Guidance C).
  *   **NO (Ferocious scrutiny on enemy, extreme skepticism on own side):** Proceed to Step 5.
  *   *Warning:* This is a **Judgment Call**, not a hard test. It indicates motive, not falsehood. Use it to weigh the severity of the label, not to establish the fact.

  #### Step 5: The Function Gate (The Effect Test)
  *Question:* If accepted, does the claim function to exonerate the perpetrators or morally equate the victims with the aggressors, regardless of the speaker's stated intent?
  *   *Specific indicators:*
      *   Does it shift causality from *intent* to *accident* (Denial by Subtraction)?
      *   Does it shift responsibility from *perpetrator* to *victim* or *environment*?
      *   Does it use legal technicalities to negate moral categories (The Legal-Category Dodge)?
  *   **YES:** **STOP.** Verdict: **Structural Denialism.** (Proceed to *Wording Guidance D*).
  *   **NO:** Verdict: **Fringe Scholarship / Error.** (Proceed to *Wording Guidance C*).

  ---

  ### Verdicts and Wording Guidance

  Do not print the "Verdict" label. Print the description.

  **Wording Guidance A (Hard Denial)**
  *   *Usage:* When Step 1 is triggered.
  *   *Copy:* "X denies the occurrence of..." / "X's claims contradict the established historical record..."
  *   *Avoid:* "X believes..." (implies valid opinion).
  *   *Legal Note:* Safe. You are reporting on their statement vs. public record.

  **Wording Guidance B (Legitimate Revision)**
  *   *Usage:* When Step 2 is negative.
  *   *Copy:* "X challenges the prevailing view..." / "X argues for a re-evaluation of..." / "Historians remain divided on..."
  *   *Avoid:* "X denies..." / "X claims..." (implies skepticism).

  **Wording Guidance C (Fringe Scholarship / Error)**
  *   *Usage:* When Step 3 or 4 clears them of denialism, but they are still wrong.
  *   *Copy:* "X's analysis is rejected by most specialists..." / "X relies on data that demographers consider flawed..." / "While X accepts the event occurred, their accounting of it is not supported by archival evidence..."
  *   *Avoid:* "Denier." This is the safety valve for the credentialed historian who is simply wrong.

  **Wording Guidance D (Structural Denialism)**
  *   *Usage:* When Step 5 is triggered.
  *   *Copy:* "X minimizes the role of..." / "X's argument effectively absolves..." / "While not denying the deaths, X re-frames the intent in a way historians reject..."
  *   *The "D-Word" (Denial/Denialist):* **Do not use this word in the headline or lead.** Use it only in the body, attributed to specialists. *"Leading scholars of the period characterize this form of argument as denialism."* This shifts the liability to the expert consensus.

  ---

  ### Stop Rules: When to Escalate

  1.  **The Legal Stop:** If the subject is a living person (not a historical figure) and you intend to use Wording Guidance D, **send to Lawyer.** Defamation risk is non-zero if "denialism" is construed as an accusation of hate speech rather than methodological failure.
  2.  **The Expertise Stop:** If Step 3 requires evaluating complex demographics, ballistics, or archival paleography, **send to Specialist.** You are a generalist. If the "Number Fighter" uses a census method you don't understand, you cannot pass Step 3. Call a demographer.
  3.  **The State Stop:** If the claim is protected or criminalized by the local government (Case 4), **send to Editor.** You need a policy decision on whether your outlet prioritizes local law or international scholarly consensus. The procedure does not solve this; it only highlights the conflict.

  ---

  ### Simulation: Running the Composites

  Here is the procedure applied to two of your hard cases.

  #### Simulation 1: Case 2 (Denial by Subtraction)
  *The Composite:* A pundit argues the deaths in the atrocity were real, but claims they were caused by "typhus and logistical collapse" rather than "systematic execution," despite orders to the contrary.
  *   **Step 1 (Existence):** Did they deny deaths? No. -> *Proceed.*
  *   **Step 2 (Consensus):** Do specialists agree? Yes, 95% of historians cite execution orders and forensic evidence of mass graves inconsistent with disease. -> *Proceed.*
  *   **Step 3 (Method):** Do they use acceptable methods? They cite a single diary entry about disease and ignore the execution logs. They do not publish in peer-reviewed venues. -> *Proceed.*
  *   **Step 4 (Asymmetry):** (Skipped for time, but assume they ignore their own side's war crimes). -> *Proceed.*
  *   **Step 5 (Function):** Does this exonerate? Yes. It shifts causality from *intent* (murder) to *circumstance* (negligence/disease).
  *   **Verdict:** **Structural Denialism.**
  *   **Wording:** "While acknowledging the death toll, the author attributes the cause to disease, a conclusion that contradicts forensic and archival evidence regarding systematic execution. Scholars note this framing minimizes perpetrator responsibility."
  *   *Result:* You catch the move without accusing them of lying about the body count.

  #### Simulation 2: Case 5 (The Partisan Hypocrisy)
  *The Composite:* A commentator you politically align with argues that Atrocity A (committed by the "other side") is a proven genocide, but Atrocity B (committed by "our side," similar scale/intent) is "just war collateral damage" and "lacks legal proof."
  *   **Step 1 (Existence):** Do they deny Atrocity B happened? No, they admit deaths. -> *Proceed.*
  *   **Step 2 (Consensus):** Does consensus call Atrocity B a genocide/atrocious crime? Yes, international tribunals and specialists classify it as such. -> *Proceed.*
  *   **Step 3 (Method):** Do they use valid methods? For Atrocity A, they accept survivor testimony. For Atrocity B, they reject survivor testimony as "hearsay" requiring documentary proof that was destroyed. -> *Proceed.*
  *   **Step 4 (Asymmetry):** **FAIL.** They apply ferocious standards to Atrocity A and impossible standards to Atrocity B.
  *   **Step 5 (Function):** Does this exonerate? Yes, it protects "our side" from the moral label applied to the enemy.
  *   **Verdict:** **Structural Denialism.**
  *   **Wording:** "The commentator applies inconsistent evidentiary standards to similar historical events, accepting testimony for one while demanding impossible documentation for the other. This asymmetry functions to shield one party from the moral classification applied to the adversary."
  *   *The Uncomfortable Truth:* The procedure forces you to call out your ally. If you skip Step 4 because "they're on our side," you have broken the tool. The wording is dry, but it lands the blow.

  ---

  ### Meta-Analysis: Tests vs. Judgment Calls

  Your editor will ask what is objective and what is you having an opinion. Be honest.

  1.  **Genuine Tests (Objective):**
      *   **Step 1 (Existence):** Binary. They said it or they didn't.
      *   **Step 2 (Consensus):** Verifiable. You can count papers.
      *   **Step 3 (Peer Review):** Binary. Is it in a journal or on a blog?
      *   **Stop Rules:** Binary. Do you have the expertise or not?

  2.  **Judgment Calls (Subjective/Defensible):**
      *   **Step 3 (Method Quality):** Determining if a demographic argument is "flawed" vs. "heterodox" requires some expertise. *Defense:* Rely on the "Peer Review" sub-question. If it's not peer-reviewed, the method is unvetted.
      *   **Step 4 (Asymmetry):** Determining "ferociousness" of standards is qualitative. *Defense:* Show the clips. Put the contradictory standards side-by-side in the text. Let the reader see the asymmetry.
      *   **Step 5 (Function):** Determining if an argument "exonerates" is interpretive. *Defense:* Attribute this judgment to the specialists found in Step 2 ("Scholars argue this framing minimizes...").

  ---

  ### Limitations: Where the Procedure Fails

  I am being blunt here. There are three scenarios where this tool will break, and you must not try to force it.

  1.  **The "Living Memory" Trap:** If the atrocity occurred within the last 20 years, "scholarly consensus" may not exist yet. History needs distance. If you run this procedure on a current conflict, Step 2 will fail. **Do not use this procedure for contemporary politics.** It is for history fights, not news fights.
  2.  **The "State Truth" Trap (Case 4):** If a government criminalizes deviation from an official narrative (e.g., "The death toll must be stated as X"), and the consensus agrees with the government *because* of the law, Step 2 is corrupted. The procedure assumes academic freedom. In authoritarian contexts, you must bypass Step 2 and rely on Step 3 (Method) and external (exile) scholars. This increases your legal risk.
  3.  **The "Sincere Nut" Case:** Sometimes a person is simply deluded, not ideological. They fail Step 3 (Method) and Step 5 (Function), but lack the political coordination of a denialist movement. Labeling them a "Denier" might give them undue stature. In this case, default to **Wording Guidance C (Error)**. Do not dignify a lone madman with the "Denialism" label unless they are influencing policy.

  ### Final Advice for the Deadline

  You are not the judge of history. You are the judge of **process**.

  If you stick to the *Method Gate* (Step 3) and the *Consensus Gate* (Step 2), you are safe. You are not saying "This is false." You are saying "This does not meet the standards of the discipline." That is a defensible, journalistic position.

  If you try to prove the *truth* of the atrocity yourself, you will miss your deadline and likely get the history wrong. If you prove the *failure of the method*, you hit your deadline and protect the record.

  Use the Asymmetry Check (Step 4) to keep your own honesty intact, but rely on Steps 2 and 3 to keep your job.
