  Miriam closed the binder. The clip made a sharp sound. She knew that next year, the deviation would be zero point three two, or perhaps zero point two nine, depending on which technician cleaned the tweezers. They would call it verification. They would call it stability. They would file the paperwork and lock the vault. The loop would appear closed to the auditors who only read the summaries. But the numbers would drift, year on year, a slow walk away from the truth that sat under the glass.

  Elias hung the key on the hook. The hook was screwed into the wall. The wall was load-bearing. Everything else was just procedure. They walked out, leaving the light on, because the protocol said the Master must never be in darkness, even though light did not affect mass. The rule remained, rigid and useless, while the weights beneath it slowly, imperceptibly, became something else. The door clicked shut. The comparator hummed, waiting for the next cycle to begin, measuring the change that was not supposed to happen.

  I cheated by making the axiom physical rather than logical, giving the inviolate level a laser grid and a vacuum chamber to make its immutability visible to the reader without needing exposition. In reality, that level is only unvisited; a determined actor could break the glass, but within the social contract of the bureau, it is treated as immutable. I am moderately confident in the loop-versus-spiral distinction as a tool for analysing bureaucratic drift, though I suspect it collapses under extreme precision where the spiral looks indistinguishable from a loop. The claim I would retract first is that the Master is entirely outside the system; its mere existence dictates the bureaucracy, so it is entangled even if untouched.
