answer: |-
  Here is a 50-minute lesson plan designed to meet your constraints.

  ### 1. Preparation & Prerequisites (Before Class)
  **Board Layout:** Divide the board into three vertical panels.
  *   **Left:** Definitions & Geometry.
  *   **Center:** The Carrying Game (write this out before students arrive to save time).
  *   **Right:** Misconceptions & Assessment.

  **The Carrying Game:**
  Use a 3x3 game. Do not make students solve for the mixture probabilities; it consumes too much time. Provide the weights and have them verify.
  *   **Row Player:** Strategies $T, M, B$.
  *   **Col Player:** Strategies $L, C, R$.
  *   **Payoffs (Row, Col):**
      *   $(T, L): 4, 5 \quad (T, C): 0, 0 \quad (T, R): 0, -1$
      *   $(M, L): 0, 0 \quad (M, C): 6, 5 \quad (M, R): 0, -1$
      *   $(B, L): 1, 0 \quad (B, C): 3, 0 \quad (B, R): -1, 6$
  *   **Properties:**
      1.  **Pure IESDS Stuck:** No row/col is strictly dominated by a *pure* strategy initially. (e.g., $B$ is best against $R$).
      2.  **Non-Uniform Mixture:** $B$ is strictly dominated by $\sigma_R = 0.4T + 0.6M$.
          *   Check: vs $L \to 1.6 > 1$. vs $C \to 3.6 > 3$. vs $R \to 0 > -1$.
      3.  **Second Round:** Once $B$ is removed, $R$ is strictly dominated by $L$ for Column (0 vs 5, 0 vs 5, -1 vs 0).

  ### 2. Lesson Sequence (50 Minutes)

  #### **0:00–0:05 | Motivation & The "Stuck" Game**
  *   **Action:** Direct attention to the Center Board (The Game).
  *   **Prompt:** "Apply pure-strategy IESDS. What can you eliminate?"
  *   **Expected Outcome:** Students find nothing. $B$ is a best response to $R$; $R$ is a best response to $B$.
  *   **Point:** Pure IESDS is sometimes too blunt. We need a finer tool. Since we know how to compute expected utility for MSNE, we can use expected utility to check for dominance.

  #### **0:05–0:15 | Definition & The Convex Hull (Left Board)**
  *   **Definition:** Write the formal definition of **Strict Dominance by a Mixed Strategy**: Strategy $s_i$ is strictly dominated if there exists a $\sigma_i \in \Delta(S_i \setminus \{s_i\})$ such that $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$.
  *   **The Convex Hull Visualization (Crucial Step):**
      *   **Draw:** A 2D axis system where the axes represent payoffs against two specific opponent strategies (e.g., Col plays $L$ vs Col plays $C$). Ignore $R$ for the sketch or treat it as a 3D height.
      *   **Plot:** Plot $T$ and $M$ as points. Draw the line segment connecting them.
      *   **Explain:** This line segment represents *all possible expected payoffs* from mixing $T$ and $M$.
      *   **The Insight:** If the point for $B$ lies strictly **below** this line segment (in all dimensions), $B$ is dominated.
      *   **Why here?** Place this *before* solving the example. It provides the geometric intuition for *why* a mixture can dominate a pure strategy even when no single pure strategy does. It prevents the algebra from feeling like magic.

  #### **0:15–0:25 | Round 1 Elimination (Center Board)**
  *   **Action:** Reveal the mixture: $\sigma_{Row} = 0.4T + 0.6M$.
  *   **Task:** Have students calculate the expected payoff of $\sigma_{Row}$ against $L, C, R$ and compare to $B$.
  *   **Verification:**
      *   vs $L$: $0.4(4) + 0.6(0) = 1.6 > 1$.
      *   vs $C$: $0.4(0) + 0.6(6) = 3.6 > 3$.
      *   vs $R$: $0.4(0) + 0.6(0) = 0 > -1$.
  *   **Misconception Defusal #1 (Benchmark vs. Choice):**
      *   **Intervene here:** Explicitly state: "Row is not *committing* to play this mix. This mix is a **hypothetical benchmark**. We are proving that playing $B$ is irrational because *if* Row were to randomize between $T$ and $M$, they would do better regardless of what Col does. Therefore, $B$ is removed."
  *   **Action:** Cross out $B$.

  #### **0:25–0:35 | Round 2 Elimination (Center Board)**
  *   **Action:** Look at the reduced 2x3 game (Rows $T, M$; Cols $L, C, R$).
  *   **Prompt:** "Can Column eliminate anything now?"
  *   **Outcome:** $R$ is now strictly dominated by $L$ (payoffs $-1, -1$ vs $5, 5$).
  *   **Action:** Cross out $R$.
  *   **Misconception Defusal #2 (Survival of Mixtures):**
      *   **Intervene here:** "We eliminated pure strategy $B$. We did not eliminate the *ability* to mix $T$ and $M$. However, IESDS reduces the set of **pure** strategies. We do not add the mixture $0.4T+0.6M$ as a new row. We simply conclude $B$ is gone."

  #### **0:35–0:45 | Misconception Clinic (Right Board)**
  Address the remaining anticipated misconceptions explicitly. Write the header "Danger Zones."

  1.  **MSNE Support:**
      *   **Question:** "Can $B$ be played with positive probability in *any* Nash Equilibrium?"
      *   **Answer:** No. If a strategy is strictly dominated (even by a mix), it cannot be part of any NE support.
      *   **Why:** Connects back to their MSNE knowledge. Rational players don't play strictly dominated strategies.
  2.  **Order Independence (Strict vs. Weak):**
      *   **Statement:** "We used **Strict** Dominance. The order of elimination did not matter."
      *   **Warning:** "Next week we discuss Rationalizability and Weak Dominance. If you use **Weak** Dominance by mixture, order **does** matter. Do not carry over the order-independence intuition to weak dominance cases."
  3.  **The "Mixture Choice" (Reinforcement):**
      *   Remind them again: The mixture is a proof device, not a strategic announcement.

  #### **0:45–0:50 | Assessment & Wrap**
  *   **Assessment Question (Handout or Board):**
      > "Consider a game where Strategy $X$ is strictly dominated by a 50-50 mixture of $Y$ and $Z$. In the reduced game (without $X$), Strategy $Y$ is strictly dominated by $Z$.
      >
      > **True or False:** Strategy $X$ was strictly dominated by $Z$ in the *original* game.
      > **Explain why.**"
  *   **Correct Answer:** **False.**
  *   **Reasoning:** Dominance is not transitive in this way. $X$ was worse than the *average* of $Y$ and $Z$. It is possible $X$ was better than $Z$ alone (which is why $Y$ was needed in the mix), even if $Y$ turns out to be bad later for other reasons.
  *   **Why this question:** It distinguishes students who understand the *logic* of dominance (comparison against a benchmark) from those who treat it as a recipe ("cross out the bad one, then cross out the next bad one"). It tests if they understand that the dominating mixture is a specific weighted average, not just "the other strategies."

  ### 3. What to Refuse to Cover
  To stay within 50 minutes and the undergraduate level, explicitly state you will **not** cover:
  1.  **Linear Programming:** Do not teach them how to solve for the optimal mixture weights using simplex or LP software. Verification is sufficient.
  2.  **Weak Dominance by Mixture:** Do not run an example where a strategy is weakly dominated by a mix. The order-dependence issues complicate the intuition too early.
  3.  **Formal Rationalizability:** Do not define the set $R_i$ or the iterative common knowledge of rationality formally. Save that for next week's lecture.
  4.  **Infinite Games:** Keep the strategy spaces finite.

  ### 4. Summary of Timing & Flow
  *   **0-5:** Hook (Game is stuck).
  *   **5-15:** Concept (Def + Convex Hull).
  *   **15-25:** Application Round 1 (Verify mix, kill $B$).
  *   **25-35:** Application Round 2 (Kill $R$).
  *   **35-45:** Misconceptions (MSNE support, Order, Benchmark).
  *   **45-50:** Assessment Question.

  ### 5. TA Tips for Delivery
  *   **The Hull Drawing:** Keep it schematic. You don't need accurate scaling, just show $B$ "under the tent" formed by $T$ and $M$.
  *   **The Mixture:** If a student asks "How did you find 0.4?", answer: "I solved the inequalities beforehand. In an exam, I would give you the weights or ask you to verify them, not find them from scratch."
  *   **Pacing:** If you run long on the Convex Hull, skip the algebraic verification of Round 2 and state the result. The geometric intuition is higher priority than the arithmetic.
