answer: |-
  Nozick's Wilt Chamberlain argument is intuitive, linking justice to liberty, but it faces serious challenges. Here are objections ranked by severity:

  **Dealbreakers:**
  1. **Historical Injustice:** If the starting distribution wasn't just (e.g., stolen land, slavery), subsequent transfers aren't legitimate. Nozick admits this, but it invalidates almost all current real-world holdings, making the theory practically useless without massive rectification.
  2. **Background Coercion:** Choices aren't truly free under desperation. If fans pay Wilt because they lack alternatives or are manipulated, consent is compromised. Liberty requires more than non-interference; it requires viable options.

  **Strong Stings (Even Fans Worry):**
  3. **Democratic Self-Defense:** G.A. Cohen argues taxation isn't forced labor; it's maintaining the social framework enabling wealth. Without collective rules, Wilt could buy the league, ending future freedom for everyone else.
  4. **Monopoly Power:** Unchecked accumulation destroys the very market freedom Nozick values. Power concentrates until transactions are no longer between equals, violating the voluntary premise.

  **Awkward/Specific:**
  5. **Digital Goods:** Your friend is right. Non-rivalrous goods break the scarcity analogy. Copying digital perks doesn't deprive others, weakening property claims compared to physical resources. This suggests property rights might differ by resource type, complicating the universal entitlement claim.

  **Predictions & Risks:**
  Nozick predicts a minimal "night-watchman" state; rivals (like Rawls) predict redistribution to maximize the minimum advantage. The risk? Unfalsifiability. Any regulation is deemed aggression. Hardcore fans admit historical injustice stings but shrug off inequality outcomes as irrelevant to justice.

  **Verdict:**
  It's logically insulated but morally risky. By defining justice solely as process, it ignores structural power imbalances that make processes unfair. It's not necessarily false, but it might be incomplete. The view protects liberty formally but can undermine it materially. Is insulation a problem? Yes, if it prevents correcting real-world oppression. It's a strong philosophical shield, but a weak policy guide. It risks becoming dogmatic, immune to empirical evidence about human welfare. This immunity protects the theory from refutation but also from improvement, leaving it unable to address modern complexities like data ownership or algorithmic manipulation.
