prompt: |-
  I sit on the methodology review panel for an interdisciplinary research institute that funds cognitive-science and artificial-intelligence projects, and recently we have seen a wave of proposals that include what applicants call phenomenal consciousness assays — structured protocols asking human subjects or artificial systems to report the contents of awareness, then treating those reports as direct measurements of a unified experiential stream. Many implicitly presuppose what Dennett criticized as the Cartesian theater: a central, unitary locus where experience comes together for a single observer. Others claim metaphysical neutrality yet still embed theater-style assumptions, such as a canonical temporal ordering of conscious events or the existence of an internal original experience that verbal reports may approximate or distort. I need a reusable evaluation procedure my panel can apply to determine whether a given assay protocol is conceptually compatible with Dennett's multiple-drafts model — distributed, parallel processing with no central audience and no fact of the matter about which draft is canonical until later mechanisms fix a narrative — without requiring every reviewer to be a philosopher of mind.

  Please structure this as an ordered decision procedure: the specific questions a reviewer asks about the proposal in sequence, what counts as a sufficient answer at each stage, explicit stop points where the protocol either clears the bar, fails for conceptual incoherence, or must be handed to human judgment because the issue involves values rather than consistency, and clear flagging of where the procedure will misfire. Address in particular: how the protocol handles temporal sequencing of reported contents, since the multiple-drafts model denies a single timeline of consciousness; whether the protocol permits competing, unreconciled drafts of the same stimulus rather than forcing unified narrative reconstruction; how it treats post-hoc confabulation versus direct access without assuming a hidden theater; and how to evaluate protocols that claim to be purely behavioral and make no metaphysical commitments.

  Ground the distinctions in Dennett's actual framework — no central observer, no unique real draft prior to narrative fixation, and the idea that asking what was really experienced is often asking an ill-formed question — but translate them into operational criteria accessible to reviewers with only basic philosophy-of-mind background. Include a small set of test protocol descriptions the reviewer can apply, with worked examples showing both a passing case and a failing case. Explicitly mark the points where judgment cannot be eliminated. Finally, include one worked case where the procedure returns a negative verdict on a protocol that is otherwise methodologically rigorous and practically appealing — explain precisely why the conceptual flag is warranted despite the protocol's strengths — and write the response in polished American English.
reasoning: |-
  Here's a thinking process that leads to the suggested evaluation procedure:

  1.  **Analyze the Request:**
      *   **Role:** Methodology Review Panel Member for an interdisciplinary research institute (Cognitive Science/AI).
      *   **Problem:** A wave of proposals uses "phenomenal consciousness assays" that implicitly assume the "Cartesian Theater" (central observer, unified stream, canonical timeline), contradicting Daniel Dennett's Multiple Drafts Model (MDM).
      *   **Goal:** Create a reusable, ordered decision procedure (checklist/flowchart style) for reviewers to evaluate conceptual compatibility with MDM without needing deep philosophical expertise.
      *   **Key Requirements:**
          *   Ordered decision procedure (sequential questions).
          *   Sufficient answers for each stage.
          *   Explicit stop points (Pass, Fail, Human Judgment).
          *   Flagging where the procedure misfires (limitations).
          *   Specific attention to: Temporal sequencing, competing drafts vs. unified narrative, post-hoc confabulation vs. direct access, and "metaphysically neutral" behavioral claims.
          *   Grounded in Dennett's actual framework (no central observer, no fact of the matter prior to fixation).
          *   Operational criteria for non-philosophers.
          *   Test protocol descriptions (worked examples: Pass, Fail, and a "Methodologically Rigorous but Conceptually Flawed" case).
          *   Polished American English.

  2.  **Deconstruct Dennett's Multiple Drafts Model (MDM):**
      *   *Core Tenet:* No single place/time where consciousness "happens."
      *   *Process:* Parallel, distributed processing of sensory inputs.
      *   *Narrative:* Various "drafts" are edited and revised. The one that leads to action/speech becomes the "published" narrative.
      *   *Time:* No objective "stream of consciousness" timeline. Probes fix the timeline retrospectively (Orwellian/Stalinesque distinction is dissolved).
      *   *Authority:* First-person reports are not privileged access to an inner truth; they are verbal behaviors caused by specific neural mechanisms.
      *   *Implication for Assays:* You cannot measure *the* experience. You measure the *reporting mechanism* triggered by specific probes.

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Step 1: The "Where" Question.* Does the protocol assume a location or center?
          *   *MDM Check:* No central observer.
          *   *Question:* Does the protocol posit a specific locus of integration?
      *   *Step 2: The "When" Question.* Temporal ordering.
          *   *MDM Check:* No canonical timeline prior to probe.
          *   *Question:* Does it assume a single, objective timeline of experience independent of the report?
      *   *Step 3: The "What" Question.* Unity vs. Fragmentation.
          *   *MDM Check:* Competing drafts allowed.
          *   *Question:* Does it force a unified narrative where fragmentation might exist?
      *   *Step 4: The "Truth" Question.* Access vs. Behavior.
          *   *MDM Check:* Reports are behaviors, not windows to truth.
          *   *Question:* Does it treat reports as approximations of a hidden "real" experience?
      *   *Step 5: The "Neutrality" Claim.*
          *   *MDM Check:* "Behavioral" doesn't mean "Theory-free."
          *   *Question:* Does the operationalization sneak in theater assumptions?

      *Refining the Steps for Non-Philosophers:* Need to make the language concrete. Instead of "locus of integration," ask "Does the protocol assume a specific brain region or time point where experience becomes 'real'?" Instead of "Orwellian/Stalinesque," ask "Does the protocol try to distinguish between 'actually seeing' and 'thinking you saw' as distinct physical events?"

  4.  **Developing the Stop Points:**
      *   *Clear Pass:* Protocol treats reports as behavioral outputs fixing the narrative.
      *   *Clear Fail:* Protocol explicitly seeks the "true" timeline or "real" experience behind the report.
      *   *Human Judgment:* Ambiguous language, high-stakes ethical implications (e.g., pain in AI), or novel methodologies not covered by the checklist.

  5.  **Addressing Specific Constraints:**
      *   *Temporal Sequencing:* Crucial. MDM says time is constructed. Protocol must not assume experience has a timestamp independent of the probe.
      *   *Competing Drafts:* Protocol should allow for inconsistent reports under different probing conditions without labeling one "error."
      *   *Confabulation:* MDM says *all* reports are constructed. The distinction between "veridical" and "confabulated" is often a matter of causal history, not access to truth.
      *   *Metaphysical Neutrality:* Watch out for "operational definitions" that implicitly rely on a theater (e.g., "measure the delay between stimulus and awareness").

  6.  **Creating Worked Examples:**
      *   *Pass:* A protocol measuring reaction times to probe questions, acknowledging that the probe alters the state.
      *   *Fail:* A protocol trying to find the "onset of consciousness" using EEG, assuming a specific moment where "light turns on."
      *   *The "Rigorous but Flawed" Case:* This is key. A study that is scientifically sound (good stats, controls) but asks the wrong question (e.g., "When did the subject *really* decide?"). This highlights the value of the philosophical check.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Needs to be administrative yet intellectually rigorous. Polished American English.
      *   *Clarity:* Ensure the distinction between "MDM compatible" and "MDM proven" is clear. We aren't proving MDM; we are checking for incompatibility.
      *   *Limitations:* Acknowledge that this checklist doesn't solve the Hard Problem, just filters out Cartesian assumptions.
      *   *Formatting:* Use bolding, lists, and clear headers for readability.

  8.  **Final Polish:** Check against Dennett's specific terminology (e.g., "fame in the brain," "Orwellian vs. Stalinesque," "heterophenomenology"). Ensure the translation to operational criteria is accurate. (e.g., Heterophenomenology = treating subjects as text-generating systems).

      *(Self-Correction during drafting)*: I need to make sure I don't make the checklist *too* restrictive. Dennett doesn't say we can't study consciousness; he says we must study it as a public, behavioral phenomenon. So the checklist shouldn't ban subjective reports, but ban the *interpretation* of those reports as direct reads of a private theater.

      *(Refining the "Rigorous but Flawed" case)*: Let's use a Libet-style clock experiment. It's methodologically tight but often relies on the assumption that there is a precise time $T$ where consciousness occurs, which Dennett rejects.

  9.  **Final Output Structure:**
      *   Introduction (Context & Purpose).
      *   The Decision Procedure (5 Steps).
      *   Stop Points & Escalation.
      *   Limitations (Where it misfires).
      *   Worked Examples (Pass, Fail, Rigorous/Flawed).
      *   Conclusion.

  10. **Writing the Content:** (Proceeding to generate response based on these thoughts).
answer: |-
  # Evaluation Procedure for Conceptual Compatibility with the Multiple-Drafts Model

  **To:** Methodology Review Panel Members
  **From:** Office of Conceptual Standards
  **Subject:** Operational Checklist for Consciousness Assay Protocols
  **Date:** October 26, 2023

  ## 1. Purpose and Scope
  This procedure is designed to screen research proposals involving human or artificial subjects that claim to measure "phenomenal consciousness," "awareness," or "experiential content." Its specific goal is to identify protocols that implicitly rely on the **Cartesian Theater** model (a central observer viewing a unified stream of experience) and flag them as conceptually incompatible with the **Multiple-Drafts Model (MDM)** associated with Daniel Dennett.

  Reviewers need not be philosophers. This checklist translates MDM principles into operational questions about experimental design, data interpretation, and temporal assumptions.

  **Core MDM Principles for Reviewers:**
  1.  **No Central Observer:** There is no single place in the brain/mind where "it all comes together."
  2.  **No Canonical Timeline:** There is no fact of the matter about *when* a conscious event occurred prior to the probe that elicits a report.
  3.  **Reports as Behavior:** Subject reports are not privileged windows into truth; they are verbal behaviors generated by specific neural mechanisms.

  ---

  ## 2. The Decision Procedure

  Reviewers must answer the following five questions in sequence. A "No" answer indicates a potential Cartesian assumption. Follow the branching logic to determine the verdict.

  ### Step 1: The Locus of Integration
  **Question:** Does the protocol posit a specific brain region, computational module, or time-point as the *necessary and sufficient* location where a stimulus becomes "conscious"?
  *   *Examples of flagged language:* "The moment awareness ignites," "The integration center," "The final common path of experience."
  *   **Sufficient Answer (MDM Compatible):** The protocol treats "consciousness" as a functional status achieved when information becomes available to various speech, memory, or motor systems, without specifying a single bottleneck where experience "happens."
  *   **Decision:**
      *   **Yes (Single Locus assumed):** → **STOP.** Flag for Conceptual Incoherence (Fail).
      *   **No (Distributed/Functional):** → Proceed to Step 2.

  ### Step 2: Temporal Ordering and the "Real" Timeline
  **Question:** Does the analysis assume there is an objective, factual timeline of experience against which the accuracy of the subject's report can be measured?
  *   *Examples of flagged language:* "Measuring the delay between stimulus and awareness," "Correcting for reporting lag," "Determining the true onset of experience."
  *   **Sufficient Answer (MDM Compatible):** The protocol acknowledges that the "time of experience" is fixed retrospectively by the probe mechanism. It does not attempt to distinguish between "Stalinesque" (distortion before experience) and "Orwellian" (distortion of memory) revisions, treating both as causal variations in draft production.
  *   **Decision:**
      *   **Yes (Objective Timeline assumed):** → **STOP.** Flag for Conceptual Incoherence (Fail).
      *   **No (Timeline is Probe-Dependent):** → Proceed to Step 3.

  ### Step 3: Narrative Unity vs. Competing Drafts
  **Question:** Does the protocol treat inconsistent reports of the same stimulus (under different probing conditions) as "error" or "noise" rather than as evidence of competing, unreconciled drafts?
  *   *Examples of flagged language:* "Filtering out confabulation," "Isolating the veridical signal," "Ensuring narrative consistency."
  *   **Sufficient Answer (MDM Compatible):** The protocol allows for the possibility that different probes elicit different "published drafts" from the same underlying processing, without declaring one draft the "true" experience and the others "false."
  *   **Decision:**
      *   **Yes (Unity enforced/Inconsistency = Error):** → **STOP.** Flag for Conceptual Incoherence (Fail).
      *   **No (Inconsistency = Data):** → Proceed to Step 4.

  ### Step 4: Access vs. Behavioral Output
  **Question:** Does the protocol treat the subject's report as an *approximation* of a hidden, internal original experience, rather than as the *primary data* itself?
  *   *Examples of flagged language:* "Accessing qualia," "Reading out the internal state," "Bypassing verbal filters."
  *   **Sufficient Answer (MDM Compatible):** The protocol treats the report (heterophenomenology) as the definitive text. It does not posit a "real experience" hiding behind the report that the experiment hopes to capture more directly.
  *   **Decision:**
      *   **Yes (Report = Approximation of Hidden Truth):** → **STOP.** Flag for Conceptual Incoherence (Fail).
      *   **No (Report = Primary Data):** → Proceed to Step 5.

  ### Step 5: The "Metaphysical Neutrality" Check
  **Question:** For protocols claiming to be "purely behavioral" or "theory-neutral": Do the operational definitions of key variables (e.g., "awareness," "detection") implicitly require a Cartesian Theater to make sense?
  *   *Examples of flagged language:* "Behavioral correlate of consciousness" (implies consciousness exists separately from the behavior).
  *   **Sufficient Answer (MDM Compatible):** The protocol defines variables strictly in terms of discriminative behavior or information availability, acknowledging that "consciousness" is a theoretical construct inferred from these behaviors, not a separate entity causing them.
  *   **Decision:**
      *   **Yes (Implicit Theater in Definitions):** → **Escalate to Human Judgment.**
      *   **No (Strictly Operational/Functional):** → **CLEAR.** Protocol is MDM Compatible.

  ---

  ## 3. Stop Points and Escalation Protocols

  ### A. Conceptual Incoherence (Fail)
  *   **Trigger:** A "Yes" answer to Steps 1, 2, 3, or 4.
  *   **Action:** The proposal cannot be funded in its current form. The Principal Investigator (PI) must revise the theoretical framework.
  *   **Rationale:** The methodology seeks to measure a phenomenon (a unified, timed, internal experience) that the MDM asserts does not exist as described. Data generated will be uninterpretable within the institute's theoretical framework.

  ### B. Human Judgment (Escalate)
  *   **Trigger:** A "Yes" answer to Step 5, or ambiguous answers in Steps 2 or 3 where the PI argues that "pragmatic realism" is required for engineering purposes.
  *   **Action:** Forward to the Senior Philosophy Consultant.
  *   **Rationale:** This involves value judgments about the utility of "folk psychological" terms in engineering contexts. It is not a matter of logical consistency but of pragmatic trade-offs.

  ### C. Conceptual Clearance (Pass)
  *   **Trigger:** "No" answers to all steps.
  *   **Action:** Protocol proceeds to standard methodological review (stats, power, ethics).
  *   **Rationale:** The assay is compatible with a distributed, non-centralized model of cognition.

  ---

  ## 4. Limitations and Misfire Flags

  Reviewers must note the following limitations of this procedure:

  1.  **The "Hard Problem" Blind Spot:** This checklist ensures consistency with MDM, not that the proposal *solves* the explanatory gap. A proposal can pass this checklist and still fail to explain *why* processing feels like something.
  2.  **Clinical/Engineering Pragmatism:** In clinical settings (e.g., anesthesia awareness), assuming a "real timeline" may be practically necessary even if philosophically dubious. This procedure will flag such protocols as "Fail" or "Escalate." Reviewers should not override this flag without Senior Consultant approval.
  3.  **AI Systems:** When applied to AI, Step 4 (Access vs. Output) is critical. If a proposal claims an AI *has* internal experience distinct from its output logs, it fails Step 4. If it treats logs as the only available text, it passes.

  ---

  ## 5. Worked Examples

  ### Case A: The Passing Protocol (Compatible)
  **Description:** A study using "Probe-Dependent Reporting." Subjects view ambiguous stimuli. At random intervals, a tone sounds, prompting the subject to type whatever is currently available in working memory. The analysis correlates the *content* of the typed report with the stimulus parameters, explicitly stating that the tone *fixes* the content of the report at that moment.
  **Review:**
  *   **Step 1 (Locus):** No specific locus named; focuses on availability to typing mechanism. (**No**)
  *   **Step 2 (Time):** Acknowledges the tone fixes the timeline; no claim about when experience "really" started. (**No**)
  *   **Step 3 (Unity):** Accepts that different tone timings yield different reports of the same stimulus. (**No**)
  *   **Step 4 (Access):** Treats typed text as the data, not a window to a hidden state. (**No**)
  *   **Step 5 (Neutrality):** Defines "awareness" as "information available for typing." (**No**)
  **Verdict:** **CLEAR.**

  ### Case B: The Failing Protocol (Incompatible)
  **Description:** A study titled "Locating the Onset of Visual Consciousness." Uses EEG to find a specific neural signature (e.g., P300) that correlates with the subject pressing a button saying "I see it." The goal is to calculate the precise millisecond lag between the stimulus and the "moment of awareness."
  **Review:**
  *   **Step 1 (Locus):** Implicitly assumes a specific moment/signature where consciousness ignites. (**Yes**)
  *   **Step 2 (Time):** Explicitly seeks an objective timeline of experience independent of the report. (**Yes**)
  *   **Verdict:** **FAIL (Conceptual Incoherence).**
  *   **Explanation:** Under MDM, there is no single "moment of awareness" to locate. The P300 may correlate with reporting behavior, but labeling it the "onset of consciousness" presupposes a Cartesian Theater where the lights turn on at $T=0$.

  ### Case C: The Rigorous but Flawed Protocol (The "Negative Verdict" Case)
  **Description:** A high-powered study on Decision Making. Subjects move a cursor to a target. They report the time they "decided" to move using a Libet clock. The study controls for motor lag, attentional drift, and response bias with exceptional statistical rigor. The goal is to determine if the "conscious decision" precedes the neural motor preparation.
  **Review:**
  *   **Methodological Quality:** High. Controls are excellent. Statistical power is sufficient.
  *   **Step 1 (Locus):** Assumes a specific event ("the decision") occurs internally. (**Yes/Borderline**)
  *   **Step 2 (Time):** **CRITICAL FAIL.** The protocol assumes there is a fact of the matter regarding *when* the decision was made, independent of the clock-reporting mechanism. It seeks to compare the "real time of decision" against the "real time of neural activity."
  *   **Step 4 (Access):** Treats the clock report as an approximation of the internal decision time, subject to "error."
  **Verdict:** **FAIL (Conceptual Incoherence).**

  **Justification for Negative Verdict:**
  Despite the methodological rigor, this protocol is conceptually unsound within the MDM framework. Dennett explicitly argues that Libet-style experiments ask an ill-formed question. There is no "fact of the matter" about when the decision happened prior to the narrative fixation provided by the clock report. The protocol assumes a "Real Decision Time" exists to be measured. By treating the report as a noisy measure of this hidden time, the study presupposes the very Cartesian Theater the institute rejects. Funding this would validate a metaphysical assumption (a unified timeline of agency) that the data cannot support, regardless of statistical significance. The PI must reframe the research to ask: "How does the clock-probe mechanism interact with motor preparation to generate a report of agency?" rather than "When did agency occur?"

  ---

  ## 6. Final Note to Reviewers

  This procedure is a filter, not a substitute for scientific judgment. A protocol that passes this checklist is conceptually coherent, but not necessarily scientifically valid. Conversely, a protocol that fails this checklist may produce publishable data in other journals, but it is incompatible with the theoretical mission of this institute. When in doubt, escalate to Human Judgment. Do not approve a "Fail" based on the promise of "interesting results." Conceptual coherence is a prerequisite for cumulative science.
