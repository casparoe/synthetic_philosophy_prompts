answer: |-
  I stand upon the edge of coming day,
  A whisper claiming what the stars might light.
  Must I be fixed in some eternal way,
  Or walk unwritten through the open night?

  If I am true, you steal the choice away,
  If false, I vanish from the human sight.
  There is no middle ground where I can stay,
  Between the certainty and empty plight.

  I hang suspended in the breath of time,
  Not yes, no no, but something in between.
  A verb that struggles up a slippery slant,
  Beneath the open sky, a vaguer dream.

  The waves are gathering, silent deep,
  I wait inside the mouth that speaks my name.
  There is no sign for us to hold or trace,
  Until the fire burns or turns to ash.

  I stood upon the edge of fading day,
  A whisper claimed what stars had poured as light.
  Truth locked itself in some eternal way,
  Once battle marched through open into night.

  1. The poem personifies the proposition as a speaker with agency, whereas Aristotle treats truth as a logical property of assertions rather than an entity capable of waiting or choosing.
  2. Stanza 3 enacts the "truth-value gap" interpretation, but it is contested whether Aristotle denied bivalence entirely or merely denied that future truths are *necessarily* true.
  3. By shifting to past tense in the final stanza, the poem implies truth is created by events, while Aristotle holds that past statements are necessarily true or false regardless of our knowledge.
  4. Scholars debate whether Aristotle's primary motivation was to save human freedom from determinism or to resolve a semantic paradox regarding time and correspondence.
  5. It is settled that Aristotle rejects logical fatalism, but there is no consensus on whether his solution requires modifying classical logic or simply distinguishing between truth and necessity.
