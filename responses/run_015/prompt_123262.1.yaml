answer: |-
  Your 'counterfactual accessibility' standard is a rigorous refinement of the usual 'man of his time' defence. It moves the goalposts from mere popularity ("everyone did it") to epistemic availability ("could they have known better?"). This is a significant improvement because it demands historical evidence rather than vague contextualisation. However, your framing does contain philosophical vulnerabilities, and yes, selective application is rife.

  Here is an analysis of where your standard holds water and where it leaks.

  ### 1. Sociology vs. Moral Psychology
  You are correct to identify that your standard relies on sociology (the spread of ideas) rather than moral psychology (the capacity for empathy or reasoning). This is a double-edged sword.
  *   **The Strength:** It prevents us from imposing modern terminology on historical actors who lacked the lexical tools to articulate dissent.
  *   **The Weakness:** It assumes moral progress is purely informational. It risks implying that without a pamphlet or a philosopher, a human being cannot recognise suffering as wrong. This ignores the role of basic empathy. If a conqueror sees a child suffering and feels no compunction, is he excused simply because no one handed him a treatise on universal rights? Most ethicists would argue that the capacity to recognise harm is innate, even if the *political framework* to abolish it is not.

  ### 2. The Historical Premise (The Columbus Problem)
  Your application of the standard to Columbus is historically contentious, even by your own metrics. While 'universal human rights' in the 1948 sense were absent, the Scholastic tradition of Natural Law was well-established in Europe. Figures like Francisco de Vitoria and Bartolomé de Las Casas were debating the rights of indigenous peoples almost immediately following Columbus's voyages.
  *   If the standard is 'could they have encountered dissent?', Columbus might actually fail your test. The theological and legal frameworks to question the slaughter existed within the Catholic Church itself. He may have chosen to ignore them, which suggests culpability rather than ignorance.

  ### 3. The Isolated Society Problem
  You note that this standard lets off people in isolated societies regardless of harm done. This highlights a confusion between **objective wrongness** and **subjective culpability**.
  *   **Wrongness:** An act (e.g., slavery) can be objectively harmful and morally wrong regardless of the era.
  *   **Culpability:** The agent may not be blameworthy if they genuinely lacked the capacity to know otherwise.
  Your standard effectively excuses culpability, which is fair, but it is often misused to sanitize the *wrongness* of the act. We can say an isolated chieftain was not *blameworthy* by modern standards, while still acknowledging the act was *harmful*. The 'man of his time' defence should mitigate punishment or condemnation of character, not erase the moral reality of the suffering caused.

  ### 4. Selective Application
  You ask if the problem is just selective application. Undoubtedly, this is a major factor. Society tends to apply the 'counterfactual accessibility' test strictly to figures we wish to cancel (e.g., Churchill's imperialism) and loosely to figures we wish to venerate (e.g., overlooking the violent contexts of founding fathers). This inconsistency suggests the standard is often used as a post-hoc rationalisation rather than a principled tool.

  ### What Would Change My Mind
  You asked what would change my mind regarding this framework. My assessment would shift if empirical moral psychology demonstrated that core moral concepts (such as the wrongness of gratuitous suffering) are **innate and universally accessible**, regardless of cultural articulation.
  If evidence showed that humans across all isolated societies implicitly grasp certain rights without needing them to be articulated in pamphlets or philosophy, then the 'accessibility' standard would collapse. In that scenario, the lack of a pamphlet would be irrelevant; the moral truth would be internally accessible via empathy or reason. If moral concepts can be implicitly grasped without being articulated, then the 'sociological' barrier you rely on disappears, and the defence becomes much harder to sustain.

  ### Conclusion
  Your framing is not wrong, but it is incomplete. It successfully filters out lazy relativism, but it risks reducing morality to data access. The greater issue is indeed that people apply the defence selectively to protect national myths. A consistent application would condemn many more heroes than we are comfortable acknowledging, while excusing many villains we assume were ignorant.

  \answer{The framing is philosophically rigorous but historically fragile; the greater issue is selective application driven by hero worship.}
