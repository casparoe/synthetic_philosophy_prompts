prompt: |-
  hey — can you write me an Onion-style news story, headline plus 400 words max total, about a small town that has accidentally legislated the no-trade theorem into existence.

  Setup: the town council, sick of residents getting fleeced, passes a "Common Knowledge Ordinance." Before any sale over a few hundred dollars, buyer and seller have to sit down at the municipal annex and swap the reasons for their price, back and forth, each writing down their own estimate before and after every round, until neither side would revise again. Result: the two estimates always converge on something, every deal falls through, and the used-car lot, the antiques barn and most of the realtors are out of business. I want the jokes to come from actually getting the economics right — the "if he's eager to trade, what does he know that I don't" reasoning, why forcing people to exchange reasons until nobody would move kills the trade instead of improving it, and the punchline that the market is now perfectly informed and completely dead.

  Second beat: the council's fix is a "Noise Trading Subsidy" — the town pays residents a small stipend to place deliberately uninformed, random trades, on the theory that somebody has to be wrong on purpose or nobody has any reason to go find anything out, and then the prices stop telling anyone anything. Play that straight and follow it where it goes (the subsidy gets bid up, people start competing to be the most reliably irrational, that kind of thing). Don't announce that it's a reductio — let it be one.

  Include one quote from the town's Chief Trading Officer defending zero volume as a triumph (prices have never been more accurate / the market is working beautifully, it just isn't doing anything), and one from a guy who only wanted to sell his boat and now has to sign a form certifying that his priors are the same as everyone else's, with a fine for "uncommon priors" that the clerk has no way to check.

  Should be funny to someone who genuinely knows this literature and still legible to someone who doesn't. No footnotes, no explainer at the end, don't cite anything. Give me the headline first.
