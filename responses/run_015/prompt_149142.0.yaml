      Guy says: "I track the beer. If the glass were empty, I wouldn't grab it. But if I were hallucinating, I'd still grab it."
      *Critique:* Getting closer. Needs to be sharper on the Nozickian conditions (Sensitivity).

  7.  **Drafting - Attempt 3 (The "Safety Check" Scenario):**
      Let's use a security checkpoint or a doctor's visit.
