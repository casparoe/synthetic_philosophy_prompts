answer: |-
  Two epistemologists, Al and Bob, are having a drink. Al holds up his hands and says, "I know I have hands."

  Bob nods. "Fine. But having hands entails you aren't a handless brain in a vat. So by the principle of epistemic closure, if you know the first, you must know the second."

  Al shakes his head. "I know I have hands. I don't know I'm not a brain in a vat."

  "That's a contradiction," Bob says. "You can't know the antecedent and deny the consequent."

  "It's not a contradiction, it's a modal asymmetry," Al replies. "To know I have hands, I check the nearest possible world where I don't. In that world, I see stumps, and I stop believing I have hands. My belief tracks the truth."

  "And for the vat?" Bob asks.

  "To know I'm not a vat, I have to check the nearest possible world where I *am* a vat. But in that world, the computer feeds me the experience of hands. I still believe I have them. My belief doesn't track the truth; it's insensitive."

  "So you're admitting your knowledge hits a wall at the skeptical hypothesis?"

  "No," Al says, taking a sip of his drink. "I'm admitting that if I *were* a brain in a vat, I'd be having this exact conversation with you right now, and I'd still be insisting I know I'm not."
