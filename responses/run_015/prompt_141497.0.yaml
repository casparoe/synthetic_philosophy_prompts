  6.  **Addressing "Matching Actual Play":**
      *   Position: Category mistake for a *solution* concept (normative), but a constraint for a *behavioral* model. A solution concept explains *why* deviations occur (e.g., trembling hand), not necessarily predicts them as optimal.

  7.  **Selecting the "Most Work" Desideratum:**
      *   **Belief Coherence at Off-Path Nodes.** This is the killer. BI assumes rationality off-path. Forward induction assumes deviations signal something. You can't have both without paradox.

  8.  **Evaluating Families of Response:**
