answer: |-
  Place Real Patterns at the end as the metaphysical payoff, because students must first feel the *predictive necessity* of the intentional stance before they can accept its ontological legitimacy.

  ### 1. The Order and Justification
  **Sequence:**
  1.  **Define "Stance" (5 mins):** Explicitly define a stance as a *predictive strategy* with cost/benefit tradeoffs, not a layer of reality. Do not name the three yet.
  2.  **The Example (15 mins):** Apply the definition to the **Spam Filter**.
  3.  **Name the Three (10 mins):** Map the Spam Filter analysis to Physical, Design, Intentional.
  4.  **The Chatbot Question (10 mins):** Apply the framework to AI (see below).
  5.  **Real Patterns (10 mins):** Use this to answer "But are the beliefs *real*?"

  **Why Real Patterns goes last:**
  If you introduce Real Patterns early, it sounds like abstract metaphysics disconnected from the utility of the stances. The students' core confusion ("Do beliefs exist?") arises *after* they see you attributing beliefs to a machine. You need to create the tension (We treat it *as if* it has beliefs to predict it -> But does it *really*?) before offering the resolution (Reality = Real Pattern). Placing it last fixes the "beliefs don't exist" misconception by redefining existence rather than denying it.

  ### 2. The One Example: The Spam Filter
  **Why not Chess:** Your worry is correct. CS students will fixate on minimax/alpha-beta pruning, arguing the Design Stance is sufficient because they know the code structure. They will miss the *predictive effort* saving of the Intentional Stance.

  **Why the Spam Filter:**
  *   **Physical Stance:** Tracing voltage states in the server to predict if an email goes to Junk is impossible.
  *   **Design Stance:** Knowing it's a "Bayesian filter" or "Neural Net" isn't enough; the weights are proprietary, massive, and opaque. Predicting specific classification via design is computationally expensive for the student.
  *   **Intentional Stance:** "It *believes* this email is phishing because it *wants* to protect me and *thinks* 'Nigerian Prince' is suspicious." This yields high predictive accuracy with minimal cognitive effort.
  *   **Constraints Met:** No animals/babies. Design stance doesn't collapse to a set-point (it's a complex classifier). CS students know filters exist but often don't know the exact weights, preserving the opacity needed for the Intentional Stance to shine.

  ### 3. Misconceptions and Kill-Shots

  | Misconception | When it arises | How to kill it (Script/Action) |
  | :--- | :--- | :--- |
  | **"Stances are layers inside the box."** | Minute 5 (Defining Stance) | Draw a box on the board. Write "Physical," "Design," "Intentional" *outside* the box with arrows pointing in. Say: "These are tools in *your* hand, not parts in the machine." |
  | **"Physical = Objective/Real, Intentional = Fake/Shortcut."** | Minute 20 (Naming the Three) | Ask: "If the Physical stance is so objective, who here can predict the spam filter's next move by calculating electron flow?" Emphasize that 'objective' uselessness is still uselessness. |
  | **"Dennett says beliefs don't exist."** | Minute 40 (Real Patterns) | Say: "He says beliefs aren't *physical things*, like neurons. They are *patterns*, like centers of gravity. The center of gravity is real because it predicts motion, not because you can touch it." |
  | **"Compression is relative to coding scheme (Gerrymandering)."** | Minute 45 (Real Patterns Q&A) | **See Refusal below.** If pressed: "Dennett requires the pattern to support *counterfactuals* in the *actual environment*, not just compress data arbitrarily." |
  | **"Design Stance implies a Designer (God/Engineer)."** | Minute 25 (Design Stance) | Say: "Design means 'optimized function,' not 'creator.' Evolution produces design without a designer. The spam filter was trained, not necessarily hand-coded." |

  ### 4. The Chatbot Question
  **Where:** After the Spam Filter example (Minute 30), *before* Real Patterns.
  **Prerequisites on Board:** The definition of Stance as "Predictive Strategy" and the Spam Filter analysis.
  **Why here:** Students will inevitably ask this. If you answer it before they understand stances are strategies, they will treat it as an ontological question ("Is it alive?"). If you answer it *after* the Spam Filter, you can force them to use the framework: "Don't tell me if it's conscious. Tell me which stance yields the best prediction-to-effort ratio when interacting with it."
  **The Pivot:** Once they agree the Intentional Stance works for the Chatbot, they will ask "But is it *really* thinking?" This is your bridge to Real Patterns.

  ### 5. The Final Assessment Question
  **The Case:** "Imagine a lookup table that contains every possible question you could ask and a pre-written answer that perfectly mimics a believer. It never fails."
  **The Question:** "Does the Intentional Stance work here? And according to Dennett, is there a *Real Pattern* of belief?"
  **The Correct Answer:** The Intentional Stance *works* (prediction is perfect), BUT there is no Real Pattern because the system cannot support *counterfactuals* (if you changed the input slightly outside the table, it fails) and lacks the *structural complexity* to sustain the pattern under stress. This tests if they understand that Real Patterns require robustness, not just successful prediction on a fixed set.

  ### 6. Explicit Refusals
  Announce these at the start (Minute 2) to protect the clock:
  1.  **Qualia:** "We are not discussing what it *feels like* to be the spam filter. That's phenomenology, not stance theory."
  2.  **Neural Implementation:** "We are not discussing how neurons or transistors actually work. We are discussing how we *predict* them."
  3.  **The Compression Objection:** If a student pushes the "any data can be compressed" argument too hard: "That is a technical objection regarding Kolmogorov complexity that requires a seminar on information theory to answer properly. For this course, accept Dennett's criterion: a pattern is real if it supports reliable prediction better than noise."

  ### 7. Evolution/Designer Tangent Management
  If a student asks "Who designed the spam filter?" or "Does evolution count as design?":
  **The Move:** Functionalize it immediately. "For the Design Stance, 'design' just means 'the system behaves as if it were optimized for a goal.' It doesn't matter if a human wrote the code or a genetic algorithm evolved it. If it acts optimized, the Design Stance applies." Write **OPTIMIZATION ≠ DESIGNER** on the board.
