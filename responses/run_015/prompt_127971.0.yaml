      *   *Authorial Intent:* Augustine cares deeply about what the Holy Spirit (the ultimate author) and the human scribe intended. Lying is bad; truth is good.
      *   *The Rule of Charity:* If a passage seems to command something contrary to charity (love of God and neighbor), it is figurative. If it seems to command something contrary to faith, it is figurative.
      *   *Resolution of Tension:* For Augustine, the "author" of Scripture is ultimately the Holy Spirit. The human authors are instruments. Therefore, the "intention" is unified across the canon because the Spirit doesn't contradict Himself. The "Rule of Charity" isn't overriding the author's intent; it *reveals* the true intent because the Holy Spirit *cannot* intend uncharity.
      *   *Criterion:* The criterion is theological, not purely grammatical. If the literal sense leads to sin or error, it *cannot* be the intended sense.
      *   *Misunderstanding:* Yes, signs are ambiguous. The remedy is faith and charity.

  3.  **Address Question 1: The Coherence of Intention and Charity:**

      *   *Is it a contradiction?* No, not in Augustine's theology.
