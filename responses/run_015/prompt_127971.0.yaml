      *   *Application to Law:* Legal interpretation often uses "intent of the legislature" (fictionalized unitary intent). Augustine's "Rule of Charity" translates to "Rule of Public Good" or "Spirit of the Law."
      *   *Application to AI:* This is the hard case. AI has no *mens* (mind/soul). For Augustine, signs without a mind pointing to *Res* are just noise or natural signs (like smoke indicating fire), not conventional signs (*signa data*).
      *   *Does it admit legitimate interpretation?* In Augustine's strict sense, no. Interpretation requires a meeting of minds (*mens* to *mens*). Without a sender, there is no "message," only "data."
