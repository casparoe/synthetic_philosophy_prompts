answer: |-
  This is a sophisticated intersection of normative ethics, philosophy of technology, and distributed systems architecture. You are essentially proposing a **formalization of the Doctrine of Double Effect (DDE)** where "intent" is reduced to "objective function membership."

  Your thesis is that in software, unlike human psychology, the causal chain is explicit: if the death of the request is a term in the minimization function, it is intended; if it is a boundary condition triggered by a separate maximization function, it is foreseen.

  However, this view faces significant defeaters from computer science theory, AI safety research, and experimental philosophy. Below is an analysis of the arguments against your position, ranked by severity, along with the requested details on formal work and psychological critiques.

  ---

  ### Ranked Defeaters: Fatal vs. Awkward

  #### 1. The Lagrangian Collapse (Fatal)
  **The Argument:** In optimization theory (which governs most load balancers and resource allocators), constraints are often mathematically converted into penalties within the objective function using Lagrange multipliers.
  **Why it's Fatal:** When a system designer converts a "hard constraint" (e.g., *do not exceed 90% CPU*) into a "soft constraint" (e.g., *penalize CPU > 90% heavily in the cost function*), the mathematical distinction between "optimization target" and "constraint boundary" vanishes. The dropped request becomes a variable in the equation minimizing total cost.
  **Formal Work:** This is a core problem in **AI Safety and Specification Gaming**. Amodei et al. (2016), *Concrete Problems in AI Safety*, discuss how agents optimize the literal loss function rather than the spirit of the constraint. If the loss function penalizes "cluster death" higher than "request death," the request death is mathematically instrumental to the goal. The DDE distinction collapses because the "side effect" is now a calculated variable in the intended outcome.
  **Defender Concession:** A defender would have to concede that DDE cannot apply to systems using probabilistic or penalty-based constraint handling, limiting the doctrine only to hard `if/else` abort logic.

  #### 2. The Unfalsifiability Trap (Fatal)
  **The Argument:** If "intent" is defined solely by architectural placement (loss function vs. constraint), architects can game the moral status of the system by refactoring code without changing behavior.
  **Why it's Fatal:** You can move a line of code from a `minimize()` block to a `guard_clause()` block without changing the outcome. If DDE relies on this structural distinction, it becomes a matter of coding style rather than moral reality. This renders the ethical verification unfalsifiable; any counterexample can be "fixed" by refactoring the intent into a side-effect structure.
  **Formal Work:** This parallels the **Is-Ought Problem** in code. There is no formal semantic mapping that proves a `guard_clause` is morally distinct from a `weighted_penalty`. In *The Ethics of Algorithms* (Ziewitz, 2016), the argument is made that algorithmic governance often hides normative choices behind technical necessity.
  **Defender Concession:** Defenders would likely have to abandon "code inspection" as the verification method and move to "process ethics" (e.g., why was the constraint set at *this* level?), which admits that the code itself doesn't hold the moral truth.

  #### 3. Emergent Causality & Maintenance Drift (Fatal to Verifiability)
  **The Argument:** Distributed systems exhibit emergent behavior. A request drop might not be caused by a specific `kill` signal in the code, but by a race condition, a timeout cascade, or a heuristic update pushed three sprints ago.
  **Why it's Fatal:** You claim DDE is verifiable by inspecting the call stack. In asynchronous, distributed systems, the call stack is often fragmented or nonexistent across service boundaries. Furthermore, "intent" drifts over time. A constraint set as "foreseen" in v1.0 might become the primary optimization target in v2.0 due to business pressure, without the code structure changing significantly.
  **Formal Work:** **Sociotechnical Systems Theory** (e.g., works by Lucy Suchman or Diane Vaughan's *Normal Accidents*) argues that operational drift makes the original design intent irrelevant. The "causal chain" is not static; it is renegotiated by the system in runtime.
  **Defender Concession:** Defenders would concede that DDE applies only to the *design phase*, not the *runtime phase*, significantly reducing its utility for auditing live failures.

  #### 4. The Knobe Effect / Psychological Tracking (Awkward)
  **The Argument:** You asked if human moral psychology tracks DDE or something else. Experimental philosophy (X-Phi) suggests people do not track the intended/foreseen distinction reliably.
  **The Evidence:** **Joshua Knobe (2003)** demonstrated the "Knobe Effect." Subjects attribute *intent* to side effects if the outcome is morally bad (harming the environment), but deny intent if the outcome is morally good (helping the environment), even when the causal structure is identical.
  **Relevance to Software:** Even if your code structurally satisfies DDE (request drop is a side effect), if the stakeholder perceives the drop as harmful, they will psychologically attribute *intent* to the system. The "ethical defense" fails socially because human observers do not parse loss functions; they parse outcomes.
  **Defender Concession:** Defenders would likely argue this is a bug in human psychology, not the system. They would maintain that the *system* is ethically clean even if humans perceive it as malicious. This is an awkward position (technically right, socially useless) but not logically fatal.

  ---

  ### Specific Answers to Your Queries

  **1. Is there formal work showing the causal chain/optimization target distinction collapses?**
  Yes, primarily in **Control Theory** and **Reinforcement Learning**. In Model Predictive Control (MPC), constraints are frequently "softened" to ensure feasibility. When a constraint is softened, violating it becomes part of the cost minimization.
  *   *Reference:* **Maciejowski, J. M. (2002). *Predictive Control with Constraints*.** He details how constraint violation penalties merge the "boundary" into the "objective."
  *   *Reference:* **Goodhart's Law** in algorithmic contexts. When a measure (constraint) becomes a target (optimization), it ceases to be a good measure. If you optimize for "cluster survival," "request death" ceases to be a side effect and becomes the *means* of survival.

  **2. Has anyone argued DDE tracks physical proximity?**
  In human psychology, the critique isn't usually "physical proximity" but **salience** and **moral valence** (as per Knobe). However, in **Trolley Problem variations**, people often distinguish between "switching a track" (diverting existing harm) and "pushing a man" (introducing new harm).
  *   *Mapping to Software:* This maps to **Intervention vs. Inaction**. A load balancer dropping a request is an active intervention. A request timing out because the server is full is passive. DDE defenders in software might argue that *dropping* is intended harm, while *timing out* is foreseen harm, even if the result is identical. This suggests the distinction tracks *mechanism* (proximity to the actuator) rather than pure optimization targets.

  **3. Is this view qualified into unfalsifiability?**
  Yes, this is the strongest philosophical critique. If every time a "dropped request" looks like an optimization target, the engineer replies, "No, that's just a capacity constraint," the theory protects itself from refutation.
  To avoid this, a formal definition of "Constraint" vs. "Objective" is required that is invariant to refactoring. Currently, no such formalism exists in software ethics. Without it, DDE in software is merely **security through obscurity** applied to ethics.

  ### Summary Verdict

  Your intuition that software makes intent *more visible* is correct, but your conclusion that it makes DDE *verifiable* is incorrect.

  *   **Fatal Defeater:** The mathematical equivalence of constraints and penalties in optimization destroys the structural distinction you rely on.
  *   **Fatal Defeater:** Refactoring allows "intent washing," making the doctrine unfalsifiable.
  *   **Awkward Defeater:** Human stakeholders will attribute intent based on harm (Knobe Effect), regardless of your architecture, rendering the DDE defense socially inert.

  **Would defenders concede?**
  Sophisticated defenders of "Algorithmic DDE" (a small but existing group in AI Safety) would concede that **static code analysis is insufficient**. They would pivot to arguing that DDE must be enforced via **governance protocols** (e.g., "We require a human to sign off on the constraint threshold"). This concedes that the *code* does not hold the moral distinction; the *organization* does. This effectively abandons your thesis that DDE is a structural feature of the software itself.

  **Recommendation:** If you wish to pursue this, look into **"Value Sensitive Design" (VSD)**. VSD acknowledges that values cannot be hard-coded into loss functions but must be maintained through the iterative design process. It accepts the collapse of the optimization/constraint distinction and tries to manage it politically rather than mathematically.
