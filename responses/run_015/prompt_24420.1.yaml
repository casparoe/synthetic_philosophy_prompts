      2. Diagnose the core friction: "Truth" is ambiguous between "Correct Ontology" and "Correct Relations."
      3. Define Progress: Agreeing to evaluate *continuity* rather than *finality*.
      4. Specific mechanism: The Fresnel/Maxwell case study as the arbiter.

