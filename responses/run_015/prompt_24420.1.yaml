answer: |-
  Here is the diagnosis: You are correct that you are answering two different questions, but the split is deeper than just "replacement vs. truth." The impasse exists because you and your friend are disagreeing on **what the unit of scientific survival is.**

  Your friend (PMI) assumes the unit of survival is **ontology** (the *stuff* the theory says exists: caloric, ether, phlogiston). Since the stuff keeps changing, he says the theory was false.
  You (NMA) assume the unit of survival is **structure** (the *mathematical relations* and predictive pathways). Since the math keeps working, you say the theory was roughly true.

  The disagreement is not substantive about the history of science; you both agree on the historical facts (Newton was superseded by Einstein, Fresnel by Maxwell). The disagreement is entirely **semantic and mereological**: you are carving up "a theory" differently. He thinks a theory is a package deal (if the ontology dies, the theory is dead). You think a theory is a layered cake (the ontology can rot while the structural core remains valid).

  **The Commitment:**
  This is not a deadlock that will be broken by more evidence. It is a **category error regarding reference.** You are arguing about whether a map is "true" if the landmarks change names but the roads remain in the same place. He says "False, the landmarks are wrong." You say "True, the roads work." Both are right about their respective criteria, but you are using the word "Realism" to cover both criteria simultaneously.

  **What Counts as Progress:**
  Stop arguing about "Truth." Start arguing about **Retention.**

  To break the loop, you must force the debate onto a single specific metric: **Structural Continuity.** Progress is made only if you can agree on a case study where the ontology was completely discarded but the mathematical structure was fully preserved. The classic example is **Fresnel's wave theory of light.**
  *   **Friend's view:** Fresnel was wrong because there is no luminiferous ether. Therefore, PMI stands.
  *   **Your view:** Fresnel was right because his equations for light diffraction are identical to Maxwell's equations, which we still use. Therefore, NMA stands.

  **The Move:**
  Propose this compromise to your friend: **Epistemic Structural Realism.**
  Agree that we cannot know the *nature* of the unobservable entities (siding with him on ontology), but maintain that we *can* know the *relations* between them (siding with you on success).

  If he accepts that the *structure* of past theories survives even when the *nature* of the entities does not, the Pessimistic Meta-Induction loses its bite because it no longer proves we are wrong, only that we are vague about "what" is doing the work. If you accept that we cannot claim the *entities* exist as described, the No-Miracles Argument loses its metaphysical weight but keeps its pragmatic force.

  **The Verdict:**
  The impasse is real, but it is verbal, not factual. You will not move an inch until you stop using "true" as a binary switch for the whole theory. Progress is defined by shifting the question from **"Was the theory true?"** to **"Which specific components of the theory were retained in the successor?"** If you cannot agree to analyze specific components (math vs. metaphysics) rather than whole theories, you should give up, because you are not doing philosophy of science anymore; you are just asserting different definitions of the word "is."
