answer: |-
  ### Brainstorm: The Boundary Conditions of "Life"

  Let's treat "life" as a classification problem in state space. We are looking for a region $\Omega$ in the phase space of all possible material configurations that we label "alive." The trouble is that $\Omega$ appears fuzzy, disconnected, or dependent on history rather than instantaneous state.

  *   **Viruses/Viroids:** High information density, high replication fidelity (within host), zero autonomous free energy transduction. They are parasitic information packets. In thermodynamic terms, they are equilibrium structures until coupled to a host's non-equilibrium flux.
  *   **Prions:** Template-directed conformational change. Low information capacity (binary fold state), high stability. They replicate structure without sequence information.
  *   **Mitochondria:** Once independent attractors, now subsystems within a larger control loop. They challenge the definition of "individual." Are they alive, or just organelles? Physics sees no difference in kind, only in coupling strength.
  *   **Transposons:** Selfish genetic elements. They replicate within the genome but reduce host fitness. They are replicators without organismal autonomy.
  *   **Sterile Mules:** Fully functional metabolism, homeostasis, and agency, but zero reproductive output. They break the "replication necessary" condition. They are thermodynamic dead-ends.
  *   **Tumor Cells:** Revert to a primitive proliferative state. High metabolism, high replication, but destructive to the host system. They are "alive" but pathogenic.
  *   **Self-Replicating Clay:** Crystals grow by accretion, replicating lattice defects. They have heredity (defect patterns) but no metabolism and limited evolvability. They are equilibrium structures growing via supersaturation.
  *   **Fire:** Classic dissipative structure. Consumes fuel, exports entropy, grows, moves. Lacks information storage and error correction. It is a chemical wave, not a bounded system.
  *   **Computer Viruses:** Pure information replication. Substrate-independent. They evolve and compete for resources (CPU/memory). They lack physical metabolism but mimic logical autonomy.
  *   **Minimal Synthetic Cells:** Bare minimum reaction networks enclosed in lipids. They metabolize and divide but often lack evolutionary robustness. They are engineered dissipative structures.
  *   **Future AI Agents:** Potentially autonomous, goal-directed, self-modifying code. If embodied, they transduce energy. The substrate (silicon vs. carbon) becomes irrelevant, challenging bio-chemistry specific definitions.

  The pattern emerges: Life seems to require a conjunction of **thermodynamic openness** (metabolism), **informational stability** (replication), and **historical continuity** (evolution). No single criterion captures the set without excluding clear members or including clear non-members.

  ### Translating the Positions into Physical Chemistry

  Here is how the major philosophical camps map onto your vocabulary of stat mech and dynamics.

  #### 1. Metabolism-First (The Thermodynamic View)
  *   **The Claim:** Life is defined by the process of maintaining order against equilibrium via energy flow.
  *   **The Translation:** Life is a **dissipative structure** maintained in a **non-equilibrium steady state (NESS)**. It is an autocatalytic reaction network that maximizes entropy production (or free energy dissipation) within constraints. The boundary is a semi-permeable membrane maintaining chemical gradients.
  *   **What Maps Cleanly:** The requirement for continuous free energy input ($\Delta G < 0$). The description of homeostasis as a stable attractor in concentration space. The view of the organism as a heat engine.
  *   **What Has to be Fudged:** The definition of the "system boundary." In physics, boundaries are often arbitrary; in biology, the membrane is ontological. Also, fire is a dissipative structure. To exclude fire, you must add constraints on complexity or information that aren't inherent to thermodynamics.
  *   **What Cannot Be Said:** **Heredity.** A NESS does not inherently contain a mechanism to copy its specific kinetic parameters to a daughter system. A flame does not replicate its specific turbulence pattern with fidelity. This view struggles to explain evolution without smuggling in a replicator.

  #### 2. Replicator-First (The Information View)
  *   **The Claim:** Life is defined by the ability to copy information with variation and selection.
  *   **The Translation:** Life is a dynamical system operating above the **error threshold**. It maintains **mutual information** between generations against thermal noise. It is a trajectory in sequence space governed by kinetic selection coefficients.
  *   **What Maps Cleanly:** The mathematics of fidelity, mutation rates, and the error catastrophe. The distinction between genotype (stored info) and phenotype (expressed dynamics).
  *   **What Has to be Fudged:** The physical substrate. A crystal replicates; is it alive? To exclude crystals, you must argue for "open-ended evolution," which is a property of the *environmental interaction*, not the replicator itself. Also, sterile mules are alive but do not replicate. You must define them as "potential replicators" or parts of a larger replicator, which is a conceptual stretch.
  *   **What Cannot Be Said:** **Individual Viability.** A replicator view treats the organism as a vehicle for the gene. It cannot easily account for the thermodynamic persistence of the single individual (the mule) except as a temporary fluctuation. It reduces the organism to a transient catalyst.

  #### 3. Evolutionary (The Population View)
  *   **The Claim:** Life is a system capable of Darwinian evolution.
  *   **The Translation:** Life is a population distribution moving across a **fitness landscape**. It requires variation (noise), selection (differential stability/flux), and inheritance (memory).
  *   **What Maps Cleanly:** The dynamics of adaptation as gradient ascent on a fitness surface. The statistical nature of survival.
  *   **What Has to be Fudged:** **Timescale and Unit.** Evolution is a statistical process over generations. It cannot assign "aliveness" to a single snapshot of a single organism. A single cell is not "evolving"; it is just existing. You must define life as a property of a *lineage*, not a *thing*.
  *   **What Cannot Be Said:** **The Present State.** Physics describes the state $S_t$. Evolution describes the trajectory $\{S_t\}$. You cannot determine if a system is "alive" by measuring its instantaneous Hamiltonian; you need its history. This makes "life" non-local in time.

  #### 4. Autonomy-Based (The Control View)
  *   **The Claim:** Life is a self-producing, self-maintaining system (Autopoiesis).
  *   **The Translation:** Life is a **closed control loop** where the components produce the processes that produce the components. It is **operational closure**. The system sets its own boundary conditions via negative feedback.
  *   **What Maps Cleanly:** Homeostasis as feedback control. The distinction between "perturbation" and "signal." The system acts to maintain its own variables within viable limits.
  *   **What Has to be Fudged:** **The Set-Point.** In control theory, the reference value is external (set by the engineer). In autonomy, the system *generates* its own norm. Mathematically, this looks like a fixed point, but physically, why *this* fixed point?
  *   **What Cannot Be Said:** **The "Ought".** Physics describes what *does* happen. Autonomy implies what *should* happen to maintain identity. If a feedback loop breaks, physics sees a new trajectory; biology sees "death" or "failure." The concept of malfunction is absent in fundamental physics.

  ### The Residue Report

  When we translate biology into physical chemistry, we gain precision but lose the **stance** of the system.

  1.  **Normativity:** This is the biggest loss. In your vocabulary, a mutation is just a deviation in sequence space. In biology, it is "deleterious," "neutral," or "beneficial." This evaluation is relative to the system's own persistence. Physics has no "errors," only states. A protein misfolding is just a transition to a different local minimum. Biology calls it a disease. This normative layer is not in the Hamiltonian; it is imposed by the evolutionary history of the system.
  2.  **Function:** We speak of the "function" of the heart. In physics, the heart creates pressure gradients. "Function" implies a contribution to a goal (survival). Without the goal, it's just mechanics. You can describe the mechanism without the function, but you cannot derive the function from the mechanism alone.
  3.  **Individuality:** Physics deals in identical particles. Biology deals in unique individuals. Where does one organism end and another begin? In stat mech, we coarse-grain. In biology, the individual is the unit of selection. This discreteness is often arbitrary in continuous dynamical systems (e.g., colonial organisms, fungal networks).
  4.  **History:** A physically identical copy of a bacterium created by random fluctuation (a Boltzmann bacterium) is indistinguishable from a evolved one to a spectrometer. But biologically, one has a lineage and the other does not. The "meaning" of its structures depends on their history of selection, not just their current arrangement.

  **Is the vocabulary missing something real?**
  Yes. The vocabulary of physics is **causal**; the vocabulary of biology is **teleological** (goal-directed). This is not mysticism; it is a difference in descriptive level. Biological systems act *as if* they have purposes because those that didn't are no longer here. This "as if" stance is real in its consequences (the organism regulates, repairs, seeks), but it does not appear in the equations of motion.

  **Is the dispute less substantive than it looked?**
  Partly. Many debates are about where to draw the coarse-graining boundary. Is a virus alive? It depends on whether you care more about the information or the metabolism. But the dispute over normativity is substantive. You cannot reduce "failure" to "fluctuation" without losing the ability to explain why the system fights against the fluctuation.

  **Where am I dressing up biology?**
  When I call an organism a "dissipative structure," I am telling the truth, but I am ignoring the specific *content* of the dissipation. A hurricane dissipates energy; a cell dissipates energy. The difference is the specific informational constraints that channel that dissipation into self-maintenance. The physics describes the engine; the biology describes the driver. You can describe the engine perfectly without knowing there is a driver, but you won't understand why the car turns left.

  The translation fails because physics describes the **conditions** of life, but not the **project** of life.

  \answer{Intrinsic normativity}
