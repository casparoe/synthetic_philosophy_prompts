answer: |-
  You have framed this with a precision that many trained philosophers lack. You have correctly identified that the physics of causation is a distraction. Whether the universe is determined or random does not change the moral texture of a life lived. A random impulse is no more "yours" than a determined one. So we will leave physics aside.

  You are asking about the architecture of agency. Specifically: Can you own a self you did not design from scratch? And if you can, does that ownership make you more vulnerable to blame when that self fails?

  Here is an analysis of the positions you have laid out, and a direct answer to your final question about the reality of resentment.

  ### 1. The Friend's Regress vs. The Father's Control

  Your friend's argument is logically formidable but practically sterile. It is known in philosophy as the "Basic Argument": to be truly responsible for what you do, you must be responsible for who you are; but you cannot be responsible for who you are, because you did not choose your parents, your genes, or your initial circumstances. Therefore, you are never responsible.

  If this argument is accepted, it applies to everyone equally. It dissolves the concept of blame for your brother, but it also dissolves the concept of praise for the victim, or for you, or for the therapist. It renders moral language meaningless. If we accept your friend's view, we are not saying your brother is innocent; we are saying *no one is ever guilty of anything*. That is a conclusion that human life cannot sustain. We cannot live as if people are merely weather systems.

  Your father's view is the necessary correction. He argues that agency is not about where the materials came from, but about what was built with them. If a man builds a wall, he owns the wall, even if he did not mine the stone or cut the timber. Your brother spent eight years laying bricks. He cannot now claim the bricks were given to him by fate when the wall falls down.

  ### 2. The Compounding Reply

  You asked if your "compounding reply" is a trick of arithmetic. It is not. It is the only way human growth actually functions.

  The regress (your friend's argument) demands that you be the *first cause* of yourself. That is impossible. But the compounding reply suggests you do not need to be the first cause; you only need to be a *sustaining cause*.

  Think of it like steering a ship. You did not build the ship, you did not design the rudder, and you did not create the ocean. You were born onto the deck. But if you take the wheel and steer for eight years, the course of the ship becomes attributable to you. If you let go of the wheel in a storm, you cannot say, "I didn't build the ship." You were the one holding the wheel.

  Does this escape the regress? Metaphysically, no. There was still a cause that put you on the deck. But practically, yes. At some point, the chain of "things that happened to him" becomes a chain of "things he did." The moment he chose to stay with the therapist after the court order expired, the nature of the link changed. It shifted from external coercion to internal maintenance.

  The compounding reply works because responsibility is not a substance you possess; it is a relationship you maintain. By maintaining the relationship with his own temper for eight years, he made that temper his business.

  ### 3. The Question of Degree: Is He *More* to Blame?

  You asked: *Is my brother, who spent eight years becoming gentle, more to blame for that one night than a man who never tried and did the same thing?*

  Your intuition says this feels wrong. It should feel wrong, because it relies on a confusion about what blame is measuring.

  If we are measuring the *harm done*, the blame is identical. The victim is disabled regardless of the attacker's history.
  If we are measuring the *danger posed*, the man who never tried is likely more dangerous. He has no brakes. Your brother had brakes that failed.

  But if we are measuring *moral accountability*, your brother occupies a different position. The man who never tried acts out of ignorance or negligence of his nature. Your brother acted out of a failure of a specific commitment. He made a promise to the world (and to himself) that he was safe. He induced others to lower their guard.

  He is not "more to blame" in the sense that he deserves more punishment. But he is responsible for a *betrayal* in a way the other man is not. The other man is a hazard; your brother is a trustee who broke the trust. This makes the guilt heavier, but it also makes the eight years meaningful. If the eight years counted for nothing, his relapse would be no different than the unrefined man's violence. The fact that it feels like a tragedy rather than just a crime proves that the eight years counted.

  So, the compounding reply does not make him more to blame; it makes the blame *deeper*. It transforms it from a simple act of violence into a collapse of a constructed life. That is harder to bear, but it is the only thing that validates the eight years of success.

  ### 4. The Wrinkle: The Girlfriend's Ultimatum

  Does it matter that the chain started with a threat?

  Almost all moral growth starts with external pressure. Children behave because parents punish them; eventually, they behave because they value order. Adults quit drinking because their spouses threaten divorce; eventually, they stay sober because they value health.

  The origin of the chain is less important than the maintenance of it. If he had gone to one session and quit, the girlfriend's threat would be the whole story. But he continued for eight years, long after that specific relationship dynamic likely changed. He internalized the external pressure. He took a "happening" and turned it into a "practice."

  The fact that he did not choose the *spark* does not mean he did not choose the *fire*. He tended the fire for eight years. That is sufficient for ownership.

  ### 5. The Reality of Resentment and Guilt

  Finally, you ask whether the resentment your family feels, and your brother's guilt, are responses to something real, or just inevitable biological reactions we cannot stop.

  They are responses to something real.

  There is a temptation to think that for something to be "real" in a philosophical sense, it must be independent of human feeling. Gravity is real whether we feel it or not. But moral responsibility is not like gravity. It is like money. A dollar bill is only valuable because we agree to treat it as valuable. If we all stopped agreeing, it would just be paper. But while we are using it, it is real. It buys things. It changes lives.

  Resentment is not an error. It is the emotional recognition that a norm has been violated. When you feel resentment toward your brother, you are not making a claim about physics; you are making a claim about value. You are saying, "We expected safety, and we were given harm." That expectation was built on the reality of his eight years of work.

  If you decide his guilt is an illusion, you do not free him. You erase him. You erase the eight years of work as effectively as you erase the violence. You reduce him to a object that malfunctioned. To treat him as a moral agent—to hold him guilty—is to treat him as a person who was capable of being otherwise.

  Your brother's guilt is also real. It is the pain of recognizing that the self he built was not as solid as he thought. That pain is the price of the dignity he earned during the calm years. If he feels no guilt, he admits he was never really in control. If he feels guilt, he admits he was.

  ### Conclusion

  You asked for a careful answer, not a reassuring one. Here is the hard truth:

  Your friend's argument protects your brother from blame only by stripping him of his humanity. It treats him as a thing that was pushed, rather than a person who acted.

  Your father's argument and your compounding reply accept the risk of personhood. They acknowledge that when you build a character, you own it. That means you own the calm years, but you also own the collapse.

  The resentment you feel is justified. It is the cost of having trusted him. The guilt he feels is justified. It is the cost of having claimed he was changed.

  This does not mean he is irredeemable. It means the eight years were not a shield against future blame; they were an investment in a life that has now suffered a catastrophic loss. The wrongness you feel about him being "more to blame" is correct: he is not more to blame for the violence, but he is uniquely responsible for the *failure of the remedy*.

  We cannot stop feeling resentment, and we should not try. It is the only way we acknowledge that what he did mattered, and that what he built mattered, and that both are real.
