      *   **Situation:** Family crisis. Older brother, reformed violent teen (8 years of work), relapsed under stress (permanent injury to victim).
      *   **Core Question:** Is the brother responsible? Specifically, do the 8 years of self-improvement increase or decrease his moral responsibility/blame for the relapse?
      *   **Constraints:**
          *   No reassuring platitudes.
