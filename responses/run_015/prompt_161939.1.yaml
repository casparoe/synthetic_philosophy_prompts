          *   *Resolution:* The *quality* of the blame differs, not necessarily the *quantity*. One is a failure of nature/circumstance; the other is a betrayal of a promise (to himself and others).
      *   *Constraint 4: The Wrinkle (External Motive).* Does the girlfriend's ultimatum matter?
