  ### Which Rules Come Apart?

  *   **Rule CV (Veridicality) comes apart from Rules ECD and CP.**
      *   CV predicts **Admissible** for Model G.
      *   ECD and CP both predict **Inadmissible** for Model G.
  *   **Rules ECD (Dominance) and CP (Provenance) do *not* come apart on Model G.**
      *   Both rule it Inadmissible. In Model G, the abnormal observers both dominate the evidence class *and* lack causal provenance.

  ---

  ### Which Rule Is She Actually Running?

  **Primary Rule:** **The Evidence-Class Dominance Rule (ECD).**
  **Strongest Case for the Runner-Up:** **The Causal Provenance Rule (CP).**

  **Why ECD is Primary:** In the literature on Boltzmann Brains and cosmological self-undermining (e.g., work by Sean Carroll, David Albert, Ken Olum), the operational test is almost always a measure of *typicality*. The argument is framed as: "If this theory is true, I should not expect to be me." The counting of observers (the "league table" approach) is the direct application of ECD. It is the heuristic physicists use to flag a theory as "sick."

  **Why CP is the Runner-Up:** CP provides the *epistemological justification* for ECD. We care about dominance *because* dominance implies we are likely observers with bad provenance. CP is philosophically deeper; it explains *why* being a Boltzmann Brain undermines knowledge (reliabilism). However, your colleague's "league table" methodology suggests she is applying the operational proxy (ECD) rather than evaluating the metaphysical causal chains directly (CP), which are harder to tally.

  **Why CV is Rejected:** CV is too weak. It allows for "Gettierized" cosmologies where observers have true beliefs by luck. A senior philosopher of physics would recognize that accidental truth does not save a model from self-undermining if the process generating the beliefs is unreliable.

  ---

  ### Resolving the Underdetermination: Model H

  Since ECD and CP agree on Model G, you cannot distinguish them with G alone. To separate the Dominance Rule from the Provenance Rule, you need a model where abnormal observers dominate the evidence class (triggering ECD) but possess reliable causal provenance (satisfying CP).

  **Proposed Model H: The Continuation Simulation**
  *   **Setup:** A base reality civilization creates vast numbers of simulated observers.
  *   **Stipulation:** These are *not* "ancestor simulations" with fabricated pasts (like Model E). Instead, they are **continuation simulations**. A real human in the base reality is scanned at time $t$, and the simulation continues their life from $t$ onward in a virtual environment.
  *   **Numbers:** Simulated observers vastly outnumber base-reality observers among those with evidence like ours.
  *   **Records:** All memories and records are true (inherited from the base human).
  *   **Provenance:** There is a continuous causal chain from the base human to the simulated observer.

  **Application of Rules to Model H:**
  *   **ECD (Dominance):** **Inadmissible.** (Simulated/Abnormal observers dominate the evidence class.)
  *   **CP (Provenance):** **Admissible.** (The observers have a reliable causal link to their past; their beliefs are produced by a truth-tracking process, merely on a different substrate.)

  **Principles Committed To:**
  *   **If she rules H Inadmissible:** She commits to **ECD**. She believes that *substrate independence* does not save a model; if you are likely a copy/simulation rather than a base observer, the model undermines itself, regardless of causal continuity. This aligns with a strict "Self-Locating Uncertainty" principle.
  *   **If she rules H Admissible:** She commits to **CP**. She believes that causal reliability is the only thing that matters. If the simulation is a faithful causal extension of reality, it doesn't matter that you are "simulated"; your evidence is still reliable. This aligns with a "Reliabilist" epistemology.

  **Recommendation:** Present Model G first to knock out the Veridicality Rule (CV). If she rules G Inadmissible (as predicted), follow up next month with Model H to force her to choose between counting observers (ECD) and tracing causes (CP).
