answer: |-
  ### Part 1: Evaluating Your Distinctions

  You have identified the right tensions, but not all are usable for a twenty-minute desk check.

  1.  **Loss of capacity versus loss of scale:** **Keep.** This is the most objective measure available to you. It distinguishes between "we cannot do this anymore" (capacity) and "we are doing this with fewer people" (scale). Your catalogue should record the presence or absence of specific technologies (quarrying, writing, sailing).
  2.  **Whether what was lost could be rebuilt from inside:** **Drop.** This requires counterfactual history ("could they have?"). You cannot answer this from a label or catalogue without speculative modelling. It invites you to guess at psychological resilience rather than record material facts.
  3.  **Whether the break was available to the people living through it as a loss:** **Keep, but modify.** You cannot know what people *felt* from a desk. However, you can ask: "Does the material record show a break in *daily* life, or only in *elite* life?" If farmers kept farming while kings stopped building, the 'loss' was not universal.

  **The Missing Distinction:**
  You need **Political Structure versus Population Continuity.** "Collapse" usually describes the failure of a state apparatus (palaces, kings, tax systems). It rarely describes the disappearance of the actual population. If the people and their basic cultural practices (language, farming, pottery styles) continue, "collapse" is often a misnomer for "reorganisation."

  ---

  ### Part 2: The Decision Procedure

  **Time required:** 15–20 minutes.
  **Resources:** Exhibition catalogue, draft label, liaison contact details.
  **Goal:** Determine if the word 'collapse' is factually accurate and ethically safe.

  **Step 1: The People Check (Ethical Gate)**
  *   **Question:** Does the catalogue or liaison indicate that the *descendants* of this society still exist, or that the population remained in the region?
  *   **Yes:** Stop. Do not use 'collapse' without qualification. It implies disappearance. Proceed to Step 2 to find a more precise word.
  *   **No:** (Population vanished or moved entirely). 'Collapse' is permissible. Stop.
  *   **Unclear:** **HAND-OFF.** Send to Descendant Community Liaison. Ask: "Does this term suggest your ancestors vanished?" If they say yes, you cannot use it.

  **Step 2: The Capacity Check (Factual Gate)**
  *   **Question:** Did the society lose the *ability* to perform a key function (write, quarry stone, sail), or did they simply do it *less* (smaller stones, fewer inscriptions)?
  *   **Loss of Ability:** 'Collapse' is factually supported. Proceed to Step 3.
  *   **Loss of Scale:** 'Collapse' is misleading. Use 'contraction' or 'reduction'. Stop.
  *   **Unclear:** **HAND-OFF.** Send to Curator. Ask: "Is this a loss of technology or a loss of volume?"

  **Step 3: The Elite versus Pop Check (Nuance Gate)**
  *   **Question:** Does the break affect the *whole* society (housing, food, tools) or only the *top* (palaces, temples, royal tombs)?
  *   **Whole Society:** 'Collapse' is accurate.
  *   **Top Only:** 'Collapse' is accurate *only* for the political system, not the people. You must specify "Political Collapse" or "Elite Collapse."
  *   **Unclear:** Assume 'Top Only' to be safe. Do not use unqualified 'collapse'.

  **Step 4: The Continuity Check (Narrative Gate)**
  *   **Question:** Is there evidence of immediate cultural continuity (same pottery, same language, same farming) in the layer immediately following the break?
  *   **No (Clear Break):** 'Collapse' is safe.
  *   **Yes (Continuity):** 'Collapse' is too final. Use 'Transformation', 'Transition', or 'Reorganisation'.

  **Step 5: The Value Hand-off (The Stop Point)**
  *   If Steps 1–4 give mixed results (e.g., People continue, but Palaces burn), you are no longer dealing with facts. You are dealing with **narrative framing**.
  *   **Action:** You must choose between **Accuracy** (describing the palace fire) and **Sensitivity** (honour the living descendants).
  *   **Rule:** Sensitivity trumps Drama. If the Liaison objects, the word is banned, regardless of the archaeology. If the Curator insists on the drama, you must qualify the word (e.g., "Collapse of the royal line").

  **What This Procedure Cannot Tell You:**
  1.  **If your catalogue is wrong.** It assumes your source text is up-to-date. If the catalogue relies on 50-year-old "ecocide" theories, this procedure will validate them.
  2.  **The emotional weight of the word.** It can tell you if 'collapse' is factually defensible, but not if it is *painful*. That is solely the Liaison's call.
  3.  **Causality.** It does not tell you *why* things changed (climate, war, choice), only *that* they changed.

  ---

  ### Part 3: Running the Cases

  #### Case (i): The Isolated Island (Rapa Nui-esque)
  *   **Step 1 (People):** Descendants exist. **Result:** 'Collapse' implies disappearance. Flagged.
  *   **Step 2 (Capacity):** Stopped carving/moving stone. Trees cleared. **Result:** Loss of capacity (moving large stones).
  *   **Step 3 (Elite/Pop):** Stone figures are elite/religious. Farming continued (sweet potato). **Result:** Top Only break.
  *   **Step 4 (Continuity):** Population remained until European contact. **Result:** Continuity exists.
  *   **Step 5 (Value):** Visitors expect "ecocide." Catalogue says "wrecked."
  *   **Verdict:** **Do not use 'Collapse'.** The procedure indicates a transformation of elite practice, not societal end. The "wrecked environment" claim in the catalogue is likely the outdated marketing you suspected.
  *   **Label Advice:** Use "Environmental Change" or "Shift in Priorities." Explain that statue carving stopped, but the people adapted and survived.

  #### Case (ii): The Lowland City Civilisation (Maya-esque)
  *   **Step 1 (People):** Descendants plainly continue. Liaison objects to 'collapse'. **Result:** **STOP.** 'Collapse' suggests vanishing.
  *   **Step 2 (Capacity):** Royal inscriptions stop. Cities given up. **Result:** Loss of political capacity.
  *   **Step 3 (Elite/Pop):** Farmers and language continue. **Result:** Top Only break.
  *   **Step 4 (Continuity):** High continuity in population and culture.
  *   **Step 5 (Value):** Liaison has vetoed the term.
  *   **Verdict:** **Do not use 'Collapse'.**
  *   **The Unwanted Answer:** I know you said, *"I still need some word for what happened to the cities."* This procedure denies you that word. It forces you to acknowledge that while the *cities* collapsed, the *civilisation* did not. You cannot have the dramatic noun without the misleading implication.
  *   **Label Advice:** You must write around the prohibition. Do not say "The Collapse." Say "The abandonment of the great centres." Or "The end of the royal line." Be specific about *what* ended.
      *   *Draft:* "After centuries of building, the great cities were quiet. The kings stopped carving their names, and the markets moved to smaller towns. But the farmers remained, and the language was still spoken in the homes."

  #### Case (iii): The Palace-Based Economy (Bronze Age Collapse-esque)
  *   **Step 1 (People):** Population likely disrupted, but descendants may exist (modern Greeks/Turks/etc.). **Result:** Caution.
  *   **Step 2 (Capacity):** Script stops altogether. Writing returns centuries later in different form. **Result:** Total Loss of Capacity (literacy).
  *   **Step 3 (Elite/Pop):** Big buildings burnt. Administrative system gone. **Result:** Whole Society break (economic system destroyed).
  *   **Step 4 (Continuity):** Centuries of no writing. **Result:** Clear Break.
  *   **Step 5 (Value):** No specific liaison objection noted for this broad region.
  *   **Verdict:** **'Collapse' is permissible.** This fits the definition: a loss of systemic capacity that was not immediately recovered.
  *   **Label Advice:** You may use "The Collapse of the Palace System." Qualify it to ensure visitors understand it was a systemic failure, not necessarily a genocide.

  ---

  ### Part 4: Writing the Label for the Unwanted Answer (Case ii)

  You are frustrated because 'collapse' is a useful shorthand for "complex urban system fails." The procedure forbids it because it conflates the system with the people. Here is how you write the label without the word, keeping the drama but respecting the Liaison.

  **The Problem:** You want to convey the *scale* of the loss (cities emptying) without the *finality* of the word (people vanishing).

  **The Solution:** Use active verbs of change rather than nouns of ending.

  **Drafting Strategy:**
  1.  **Name the subject of the verb.** Don't say "The Civilisation collapsed." Say "The royal courts closed."
  2.  **Mark the duration.** "Over a century..." shows process, not sudden death.
  3.  **Anchor the continuity.** End the panel with the survival.

  **Example Text (for Case ii):**
  > **The End of the Great Centres**
  > For hundreds of years, this city was the heart of the kingdom. Kings carved their history into stone, and farmers brought tribute to the temples. But between [Date] and [Date], the great plazas were swept clean. The kings stopped writing, and the stone quarries fell silent.
  >
  > This was not the end of the people. Families moved into the hills. The language continued in the villages. But the system that built these monuments was gone. When the Spanish arrived centuries later, they met the descendants of the builders, who remembered the old cities as the home of ancestors, not their own.

  **Why this works:**
  *   It satisfies the Curator (it describes the archaeological break).
  *   It satisfies the Liaison (it affirms survival).
  *   It satisfies you (it explains the change without the forbidden word).
  *   It passes the Education Officer test (clear subject-verb-object for worksheets).

  **Final Note:**
  If the Procedure tells you "No" on Case (i) (The Island), but your Catalogue says "Yes," you have found an error in your museum's knowledge base, not just your text. That is the value of this exercise: it forces the catalogue to justify the label, rather than the label blindly serving the catalogue.
