answer: |-
  ### The Specification of Distributive Equality: A Set of Desiderata

  To evaluate any theory of distributive justice—whether it prioritizes welfare, resources, or capabilities—one must first establish the criteria for adequacy. A theory cannot merely be internally consistent; it must align with considered moral judgments, empirical reality, and political feasibility. The following desiderata constitute the "full specification" required before a theory can be analyzed.

  #### I. Moral and Conceptual Desiderata

  **1. The Disability Constraint (Sensitivity to Conversion Factors)**
  *   **Requirement:** The theory must acknowledge that individuals require different amounts of all-purpose means to achieve comparable levels of functioning. It must justify transferring additional resources to those with involuntary impairments without labeling this "preferential treatment."
  *   **Motivating Consideration:** The case of the wheelchair user. If Society A gives everyone $50,000, and Society B gives the wheelchair user $70,000 to cover mobility costs while others get $50,000, Society B intuitively feels more *equal* in terms of real opportunity. A theory that mandates identical cash shares regardless of physical need fails this constraint.

  **2. The Responsibility Constraint (Insensitivity to Expensive Tastes)**
  *   **Requirement:** The theory must distinguish between disadvantages arising from brute luck (circumstance) and those arising from voluntary choices (option luck). It must not obligate society to subsidize voluntarily cultivated preferences that are costly to satisfy.
  *   **Motivating Consideration:** The "Champagne on a Beer Budget" case. If Person A is content with simple pleasures and Person B cultivates a taste for expensive vintage champagne, a theory of equality should not tax Person A to subsidize Person B's dissatisfaction. To do so penalizes prudence and rewards imprudence.

  **3. The Integrity of the Self (The Neuroadaptive Implant Test)**
  *   **Requirement:** The theory must determine whether internal psychological conversion rates are part of the "circumstance" to be compensated or the "choice" for which one is responsible. It must prevent the metric of equality from being gamed by voluntary self-modification.
  *   **Motivating Consideration:** In a world where individuals can install implants to reset satisfaction baselines, Person C might install an implant that makes them happy with very little, while Person D installs one that requires vast resources to trigger satisfaction.
      *   If the theory compensates Person D, it incentivizes manufacturing neediness.
      *   If the theory penalizes Person C (by giving them fewer resources because they need less), it punishes adaptability.
      *   *The Test:* The theory must specify if the *capacity* to modify one's baseline is a resource, a capability, or a matter of preference. It must decide if the *resulting* conversion rate is a legitimate claim on social goods.

  **4. The Status vs. Share Distinction**
  *   **Requirement:** The theory must distinguish between equal moral status (standing) and equal distributive shares (stuff). It must explain why equal respect does not necessarily entail identical bundles of goods.
  *   **Motivating Consideration:** The "Leveling Down" objection. If equality were the sole value, a society where everyone is blind would be considered "more equal" than a society where some see and some are blind, even if the blind are no better off in the former. A viable theory must explain why we care about equality *for the sake of* the worse-off, not for the sake of the pattern itself.

  **5. The Opportunity vs. Outcome Distinction**
  *   **Requirement:** The theory must clarify whether it aims to equalize starting positions (opportunity) or ending positions (outcome). It must account for the role of effort and ambition in generating inequality.
  *   **Motivating Consideration:** Two students with identical scholarships and tutoring (equal opportunity) study with different intensity. One earns a high income, the other does not. A theory demanding equal outcomes would redistribute the high earner's income, potentially violating the intuition that people are entitled to the fruits of their voluntary labor.

  #### II. Empirical and Psychological Desiderata

  **6. The Adaptation Constraint**
  *   **Requirement:** The theory must not contradict established findings on hedonic adaptation and preference formation. It cannot treat reported subjective welfare as a stable metric without accounting for the "sour grapes" phenomenon (lowering expectations to match deprived circumstances).
  *   **Motivating Consideration:** The contented slave. If a deprived individual reports high welfare due to adapted preferences, a welfarist theory might conclude no injustice exists. An adequate theory must recognize that subjective satisfaction can be a product of oppression, not just a metric of success.

  **7. The Cognitive Feasibility Constraint**
  *   **Requirement:** The metric of equality must be measurable by public institutions without requiring omniscient knowledge of individuals' internal states.
  *   **Motivating Consideration:** Bureaucrats cannot reliably distinguish between a "disabled need" and an "expensive taste" without intrusive interrogation. A theory requiring perfect knowledge of internal utility functions is institutionally impossible.

  #### III. Political and Institutional Desiderata

  **8. The Liberal Neutrality Constraint**
  *   **Requirement:** The theory should ideally remain neutral between competing conceptions of the good life. It should not privilege specific activities or functionings as inherently more valuable than others, unless necessary to protect the capacity to choose.
  *   **Motivating Consideration:** In a pluralistic society, the state should not distribute resources based on the judgment that a life of religious contemplation is superior to a life of commercial ambition, or vice versa.

  **9. The Incentive Compatibility Constraint**
  *   **Requirement:** The redistribution mechanism required by the theory must not destroy the productive incentives necessary to generate the resources being distributed.
  *   **Motivating Consideration:** If a theory mandates strict equality of outcome, high producers may stop producing. The theory must guide programs that sustain the economic base required for redistribution.

  ---

  ### Tensions and Jointly Unsatisfiable Desiderata

  No theory satisfies all desiderata perfectly. The following pairs represent deep structural tensions:

  **1. Liberal Neutrality vs. Non-Arbitrary Measurement**
  *   **The Tension:** To measure equality, one must select a metric (welfare, resources, capabilities). Selecting a metric inevitably privileges certain human functions over others. For example, the Capability Approach lists specific functionings (e.g., health, affiliation), which implies a perfectionist view of human flourishing. Strict Welfarism privileges subjective satisfaction, which privileges a hedonistic or preference-based view of the good.
  *   **Conflict:** You cannot have a metric that is both perfectly neutral (respecting all conceptions of the good) and sufficiently specific to guide distribution (telling us what counts as an advantage).

  **2. The Responsibility Constraint vs. Cognitive Feasibility**
  *   **The Tension:** To satisfy the Responsibility Constraint (compensating for disability but not expensive tastes), the state must distinguish between circumstance and choice. However, satisfying Cognitive Feasibility acknowledges that the state cannot see inside citizens' minds to verify if a high need is genuine (biological) or cultivated (psychological).
  *   **Conflict:** A theory that is morally precise regarding responsibility is often administratively impossible. A theory that is administratively simple (e.g., equal cash for all) is often morally imprecise.

  **3. The Neuroadaptive Implant Scenario: Metric vs. Responsibility**
  *   **The Tension:** This scenario highlights the conflict between **Welfarism** and **Responsibility**.
      *   If the metric is *Welfare*, Person D (who chose to need more) has a claim on resources to reach the same happiness as Person C.
      *   If the metric respects *Responsibility*, Person D's choice should lower their claim.
      *   *The Unsatisfiable Pair:* You cannot simultaneously treat subjective welfare as the *sole* currency of justice and treat voluntary changes to subjective welfare as *irrelevant* to distribution. One must yield.

  ---

  ### The Single Eliminating Requirement

  The single requirement that eliminates the largest number of existing theories is **The Responsibility Constraint (specifically regarding expensive tastes and adaptive preferences).**

  *   **Why it eliminates Welfarism:** Classical utilitarianism and welfarist egalitarianism generally fail here. If welfare is the only thing that matters, the state must satisfy the expensive tastes of the imprudent to raise their utility to the level of the frugal. This is widely regarded as a *reductio ad absurdum* of pure welfarism.
  *   **Why it pressures Resourcism:** Resourcism (e.g., Dworkin) attempts to solve this via hypothetical insurance markets, but it struggles to define "resources" independently of how people convert them into welfare. If the implant changes the conversion rate, is that a resource deficit or a preference change? Resourcism often lacks the granularity to answer without collapsing into welfarism or arbitrariness.
  *   **Why it pressures the Capability Approach:** While the Capability Approach handles disability well, it struggles with the "choice" aspect of capabilities. If I have the capability to be well-nourished but choose to fast, do I have a claim? If I install an implant that reduces my capability to feel joy, is that a deprivation? The approach must carefully delineate which capabilities are mandatory for justice and which are matters of personal responsibility.

  ---

  ### Brief Comparative Note

  *   **Equality of Welfare:** Fails the **Responsibility Constraint** (expensive tastes) and the **Adaptation Constraint** (contented slave). It is theoretically vulnerable to the Neuroadaptive Implant scenario because it incentivizes manipulating one's own psychology to extract resources.
  *   **Equality of Resources:** Succeeds on the **Responsibility Constraint** (via hypothetical insurance) but struggles with the **Disability Constraint**. It often treats physical impairments as just another preference unless complex insurance schemes are invoked. It handles the Implant scenario better if implants are treated as purchasable resources, but fails if the implant alters the *value* of the resources themselves.
  *   **The Capability Approach:** Succeeds best on the **Disability Constraint** and the **Adaptation Constraint** (focusing on freedom to function rather than subjective states). However, it faces the highest friction with **Liberal Neutrality** (defining a list of central capabilities implies a specific view of the good) and **Cognitive Feasibility** (comparing diverse capabilities across persons is measurement-intensive).

  ### Conclusion

  An adequate theory of equality must navigate the narrow passage between compensating for bad luck (disability) without subsidizing bad choices (expensive tastes), all while remaining measurable by fallible institutions. The Neuroadaptive Implant scenario serves as the ultimate stress test: it forces the theory to declare whether the *self* is a fixed recipient of justice or a malleable variable within the economic equation. Any theory that cannot specify where responsibility for one's own psychological conversion rates begins and ends will fail to guide real public programs.
