answer: |-
  It is completely understandable that your gut feels conflicted; bioethicists have wrestled with this distinction for decades without reaching a perfect consensus. However, there is a compelling principle that captures most of your intuitions, often referred to as the **Fair Opportunity Principle**.

  The core idea is this: interventions are morally permissible when they **restore an individual's fair opportunity to function** within society, but they become problematic when they **create an unfair competitive advantage** over others.

  Under this principle, therapy is about levelling the playing field. Insulin for your cousin, growth hormone for the deficient child, and laser surgery for short-sightedness all restore the person to a species-typical baseline, allowing them to compete for jobs, relationships, and health on equal footing with everyone else. Similarly, ADHD medication for your mate restores their cognitive functioning to a normal range, enabling them to hold down a job like anyone else.

  The tension arises with enhancements. Your intuition that growth hormone for basketball and steroids for athletes are "not fine" fits perfectly here: these are zero-sum competitions. If one person enhances beyond the normal range, they gain an unfair advantage, forcing others to do the same to keep up, which creates a coercive arms race.

  However, your verdict on the pilot suggests a necessary exception: **Non-Competitive Functional Enhancement.** You feel super-night vision for a pilot is "really fine" because piloting is not a race against other pilots; it is a safety-critical role where exceeding the normal standard benefits everyone without disadvantaging a competitor. The enhancement serves a functional requirement rather than a competitive edge.

  To keep this principle simple and consistent, there is one verdict of yours that needs overturning. You stated that ADHD meds for studying are "not fine, though somehow less bad than steroids." For the sake of simplicity, you must treat these two cases equally. Both are competitive enhancements in a zero-sum game (grades vs. medals). If steroids are impermissible because they skew fairness, then cognitive enhancers for exams must be too. Removing this gradient clarifies the boundary: competitive enhancement is the problem, not the specific substance.

  This brings us to your gut bug hiker. Digesting grass is certainly an enhancement beyond the human norm, similar to the pilot's night vision. Crucially, a hiker digesting cellulose is not gaining an unfair advantage over other hikers in a competition; they are simply increasing their own survival utility and independence in a niche environment. It aligns with the pilot case, not the basketballer. To remain consistent with your approval of the pilot, and having simplified your view on competitive fairness, the hiker case must be viewed as permissible.

  Verdict: Fine.
