  If one held that **any material omission invalidates consent**, the board must ban staged disclosure entirely; the initial agreement is void, making participation unauthorized trespass. Retroactive signature becomes merely an apology, not validation. If **competence must be assessed solely at the moment of initial agreement**, the retroactive option is incoherent; the participant lacked capacity to consent to the true purpose initially. The rules would need to mandate full prospective disclosure for all studies or classify undisclosed procedures as non-consensual interventions, aligning behavioral ethics with medical standards where integrity requires upfront autonomy. The board implicitly assumes competence is restorable and consent is continuous, whereas stricter views treat initial ignorance as a permanent barrier to valid authorization for that specific act. Consequently, the board's distinction between behavioral and medical consent collapses under stricter deontological scrutiny, requiring uniform prospective standards.
