prompt: |-
  I'm writing a novel and I've got a scene in chapter eleven I cant get right, and I think it's because the philosophy under it is load-bearing rather than decoration. It's a sanctions hearing. My guy is a solo practitioner who filed an opposition brief containing six case citations that don't exist: he pulled them from a general purpose chatbot, never opened a reporter, and swears he had no idea the thing invented cases. There was a real version of this in 2023 — I think it was Mata v. Avianca in the Southern District of New York — but take my facts as given and don't build anything on the real docket. Six fake opinions, with plausible reporter volumes and docket numbers, found when opposing counsel tried to Shepardize them, and a judge trying to work out whether anyone was deceived in a way that matters.

  What I need is the analysis, not the legal research. Run the hearing through each of three candidate definitions of honesty and deception for an AI system, and tell me which one my judge should be reaching for.

  1. The intentionalist one. Deception needs a mind: a belief that the thing asserted is false, plus an intention to get someone else to believe it. No beliefs and no intentions means no deception; at most the lab, the deploying company, or the user deceives, and the machine is the instrument, like a typewriter that drops letters.
  2. The practice one. Deception is a move inside a practice of assertion, and to assert is to take responsibility for the truth of what you say, to warrant it. What the chatbot produced I'm going to call counterfeit assertion: every surface mark of an assertion — case name, volume, page, flat unhedged confidence — with no warrant behind any of it. On this view whether it counts as deception has nothing to do with what went on inside the model and everything to do with what a reasonable lawyer was licensed to take it for.
  3. The reliability one. Honesty isn't a property of a single output but of a disposition across the counterfactual neighbourhood of cases the system will actually meet: does it track the truth there, and does it track its own error rate, so its hedges mean what they look like they mean. On this view the failure is a calibration failure, and the interesting question is what the thing would have said if my guy had asked it whether the cases were real.

  For all three: who does it say deceived whom (the client? opposing counsel? the court? nobody at all?), what does it say each actor should have done, and which features of the hearing does it explain and which does it quietly misdescribe? Some things I've noticed that I want you to push on rather than just agree with. The intentionalist story makes the court's talk of bad faith feel strained, but it has nothing to say about the most damning fact in the room, which is that the fakes were shaped exactly like real citations, since that shaping is what made them work. The practice story explains that, but seems to turn every hallucination into a lie, which feels wrong for a system that also gets things right most of the time. The reliability story explains why the little disclaimer under the input box saying the model can make mistakes and you should check important stuff does no work at all — a hedge you apply to everything carries no information — but it can't tell you who to punish.

  Then run it the other way: what does the hearing do to the theories? Does it show that honesty for these systems is a property of the whole socio-technical arrangement — model, interface, disclaimer, the user's habits, the professional norms around it — and not of the model at all? Does it break the old distinction between lying and bullshitting, where on one side the speaker knows the truth and hides it while on the other he simply doesn't care what's true, given that the thing at the centre cares about nothing whatsoever? And is there a fourth definition the case pushes you toward that I haven't got — something about whether the system's training objective was to be believed rather than to be right, or about defining deception against an idealized auditor who knows the training process?

  Two last things, because they're what I'll actually use. Give me the best two-paragraph version of what my judge should say from the bench, in the voice of whichever definition you think survives, and then the strongest line opposing counsel has against it. And tell me how confident you are in each of your main claims, flag any detail about the actual case you suspect you might be misremembering, and single out the one point in your analysis you're least sure of. I'd rather have the soft spot named than have it smoothed over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A novel scene (Chapter 11) involving a sanctions hearing.
      *   **Plot:** A solo practitioner used a general-purpose chatbot to draft an opposition brief. The bot generated six fake case citations (hallucinations). The lawyer didn't check them. Opposing counsel caught them via Shepardizing. The lawyer claims ignorance of the fabrication.
      *   **Real-world Parallel:** *Mata v. Avianca* (SDNY 2023), but the user wants me to treat the provided facts as given and not rely on the actual docket details.
      *   **Task:** Analyze the scene through three specific philosophical definitions of honesty/deception (Intentionalist, Practice, Reliability). Determine which one the judge should use.
      *   **Specific Questions to Address:**
          *   For each theory: Who deceived whom? What should actors have done? What does it explain/misdescribe?
          *   Push back on the user's observations (Intentionalist ignores the *shape* of the fake citations; Practice makes every hallucination a lie; Reliability makes disclaimers useless but can't assign punishment).
          *   Reverse analysis: What does the hearing do to the theories? (Socio-technical arrangement? Lying vs. Bullshitting? Fourth definition?)
          *   Deliverables: Two-paragraph judicial statement (voice of the winning theory), strongest opposing counsel line, confidence levels, potential factual errors regarding the real case, and the "soft spot" in the analysis.

  2.  **Deconstruct the Three Theories:**

      *   **1. Intentionalist (Mental State):**
          *   *Core:* Deception requires intent to deceive + belief in falsity.
          *   *Application:* The lawyer didn't *know* they were fake. The AI has no mind. Therefore, no deception by the AI, and arguably no *knowing* deception by the lawyer (just negligence).
          *   *User's Critique:* Makes "bad faith" talk strained. Ignores that the fakes *looked* real (verisimilitude).
          *   *My Analysis:* It protects the lawyer from *fraud* but exposes him to *incompetence*. It fails to capture the systemic harm because it treats the AI as a neutral tool (like a pen) rather than a generative agent that actively shapes falsehoods with confidence.
          *   *Verdict:* Too narrow for sanctions regarding court integrity, though good for criminal fraud.

      *   **2. Practice (Speech Act/Warranty):**
          *   *Core:* Assertion = taking responsibility/warranting truth. The output looks like an assertion (citation) but lacks the warrant (verification).
          *   *Application:* The lawyer made the assertion by filing. The AI produced "counterfeit assertions." The deception lies in the *act of filing* unverified material as fact.
          *   *User's Critique:* Turns every hallucination into a lie. Ignores that the system gets things right often.
          *   *My Analysis:* This fits the legal profession best. Law is a practice of warranted assertion. Filing a brief is a speech act that says "I have verified this." The AI's "confidence" is part of the counterfeit. It explains why the *form* matters.
          *   *Verdict:* Strongest for a judicial ruling on sanctions. It focuses on the lawyer's duty within the legal practice.

      *   **3. Reliability (Calibration/Disposition):**
          *   *Core:* Honesty = tracking truth across counterfactuals + accurate error reporting.
          *   *Application:* The system is miscalibrated. It presents falsehoods with high probability. The disclaimer is noise because it's applied universally.
          *   *User's Critique:* Explains why disclaimers fail. Can't tell you who to punish (system? user?).
          *   *My Analysis:* This is a systems engineering view, not a legal liability view. It explains *why* it happened but not *who is responsible*. Courts punish agents, not statistical dispositions.
          *   *Verdict:* Useful for regulation, useless for adjudicating this specific hearing.

  3.  **Reverse Analysis (What the hearing does to the theories):**
      *   *Socio-Technical:* Yes, the hearing reveals that "honesty" isn't in the model or the lawyer alone, but in the *workflow*. The "lie" happens in the gap between generation and filing.
      *   *Lying vs. Bullshitting:* Frankfurt's definition of bullshit (indifference to truth) fits the AI perfectly. The lawyer might be bullshitting by proxy. The distinction blurs because the "speaker" (AI) has no relation to truth, and the "author" (Lawyer) abdicated the relation to truth.
      *   *Fourth Definition:* **Epistemic Trespassing / Delegated Authority.** Deception occurs when you delegate an epistemic duty to an entity incapable of holding it, while representing that the duty was held. Or: **Institutional Integrity.** Deception is whatever undermines the court's ability to function as a truth-seeking body, regardless of intent.

  4.  **Selecting the Winner:**
      *   The **Practice View** is the only one that legally works for a judge. Judges sanction violations of professional norms (Rule 11, etc.). Rule 11 is about the *signature* on the brief, which certifies inquiry. It doesn't matter if the lawyer *meant* to lie; it matters that they asserted without warrant.
      *   *Refinement:* I need to blend the Practice view with a touch of the Socio-Technical insight. The lawyer isn't just lying; he's broken the chain of warranty.

  5.  **Drafting the Content:**

      *   *Section 1: Analysis of the Three Theories.* (Addressing who deceived whom, duties, explanations/misdescriptions).
      *   *Section 2: Reverse Analysis.* (Socio-technical, Lying/Bullshitting, Fourth Definition).
      *   *Section 3: The Deliverables.* (Judge's statement, Opposing Counsel's line).
      *   *Section 4: Confidence & Caveats.* (Real case details, soft spots).

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I address the user's specific pushbacks?
      *   *Intentionalist:* Acknowledge it makes "bad faith" hard but note it's the standard for *fraud*, not necessarily *sanctions*. Sanctions can be objective.
      *   *Practice:* Address the "every hallucination is a lie" concern. Distinguish between *using* AI for brainstorming vs. *filing* AI output as law. The breach is the filing.
      *   *Reliability:* Emphasize it's descriptive, not normative for liability.
      *   *Fourth Definition:* Let's propose **"Procedural Honesty."** It's not about truth per se, but about following the verification protocol required to *establish* truth in court.

  7.  **Drafting the Judge's Voice:**
      *   Needs to sound authoritative, weary but firm.
      *   Focus on the *signature* and the *warranty*.
      *   Avoid getting bogged down in AI tech specs; focus on the lawyer's duty.

  8.  **Drafting Opposing Counsel's Line:**
      *   Needs to cut through the philosophy.
      *   Focus on the waste of resources and the insult to the court.

  9.  **Confidence & Fact-Checking:**
      *   *Mata v. Avianca:* Judge P. Kevin Castel. SDNY. June 2023. Levidis Law (Steven Schwartz). The cases were fake. The lawyer claimed he didn't know. Sanctions were imposed.
      *   *Uncertainty:* I need to be careful not to conflate the user's fictional facts with the specific sanctions amount or exact quotes from *Mata*.
      *   *Soft Spot:* The distinction between "negligence" and "deception" in the Practice view. Is it really deception if you believe the tool? Or is it just incompetence? I need to flag this.

  10. **Final Review:** Ensure tone is analytical but helpful for a novelist. (The user wants "load-bearing philosophy," so the analysis needs to be rigorous).

  *(Self-Correction on the "Fourth Definition"):* The user asked for a fourth definition the case pushes toward. I suggested "Epistemic Trespassing" in thought, but "Institutional/Procedural Honesty" fits a judge better. Let's go with **"Fiduciary Epistemology."** The lawyer is a fiduciary of truth for the court. Delegating that to a stochastic parrot breaches the fiduciary duty, regardless of intent.

  *(Refining the "Soft Spot"):* The weakest point is usually the attribution of agency. If the lawyer *believed* the cases were real, is it deception? The Practice view says yes, because the *act* warrants truth. But intuitively, "lie" requires knowing falsity. I need to admit this tension.

  *(Final Polish):* Make sure the Judge's speech sounds like a Judge, not a philosopher. Use legal terms of art (Rule 11, certification, inquiry).

