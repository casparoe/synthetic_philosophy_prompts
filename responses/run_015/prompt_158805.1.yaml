      *   *Reading 2: Procedural/Trigger.* Silence fails to trigger a veto condition. The rule moves things forward, but silence isn't *consent* per se. (Bureaucratic).
      *   *Reading 3: Normative Waiver/Estoppel.* You had a duty/chance to speak; by not speaking, you lose the right to complain later. (Deontic).
      *   *Reading 4: Constitutive/Performative.* Silence *is* the illocutionary act of consenting, given the right conventions. (Strong, Austinian).

  4.  **Evaluating the Readings against the Cases:**
