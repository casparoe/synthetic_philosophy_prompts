answer: |-
  Here is the breakdown. I am treating this as a problem in the metaphysics of social facts and the ethics of normative powers. I will not hedge.

  ### The Menu of Readings

  Here are the four distinct logical structures hiding behind "silence is consent," ranked from weakest to strongest.

  **1. The Epistemic Reading (Evidential)**
  *   **Claim:** Silence is reliable *evidence* that the agent is not opposed.
  *   **Status:** **Platitude / Often False.**
  *   **Analysis:** In ordinary conversation, if I propose "Pizza for lunch?" and you say nothing while looking at me, it is reasonable to infer you have no strong objection. However, as a general rule, this is empirically fragile (as your meeting showed: mute buttons, sleep, exit).
  *   **Does it help your colleague?** **No.** Evidence is defeasible. You can provide counter-evidence ("I was buried in work," "I didn't see the email"). Evidence does not create a binding fact; it only suggests a probability.

  **2. The Procedural Reading (Trigger Condition)**
  *   **Claim:** Silence is not consent; it is the *failure to trigger a veto*. The rule is: "Motion passes IF NOT (Objection)." Silence is just the absence of the negation condition.
  *   **Status:** **Defensible (Institutionally).**
  *   **Analysis:** This is how Robert's Rules work. It does not require you to *agree*; it requires you to *act* if you disagree. The normative work is done by the rule, not by your silence. Your silence is causally relevant, but not semantically equivalent to "Yes."
  *   **Does it help your colleague?** **No.** This requires a pre-existing, mutually acknowledged rule (like a charter). There is no "co-authorship by default" rule in academia. Without the institutional framework, the trigger condition does not exist.

  **3. The Normative Waiver Reading (Estoppel)**
  *   **Claim:** You had a duty or a reasonable opportunity to object. By remaining silent, you waived your right to complain later. This is not that you *agreed*, but that you are *estopped* from dissenting.
  *   **Status:** **Defensible (Conditionally).**
  *   **Analysis:** This relies on a principle of fairness. If I hold the floor open for you, and you know objections are expected, your silence creates a reliance interest in me. I move forward based on your silence. To object later is to act in bad faith.
  *   **Does it help your colleague?** **No.** This requires *common knowledge* of the expectation. In email, there is no "floor." There is no duty to respond to unsolicited requests. You cannot create a reliance interest unilaterally by demanding a response I never agreed to give.

  **4. The Constitutive Reading (Performative)**
  *   **Claim:** Silence *is* the illocutionary act of consenting. Given the right conventions, saying nothing is semantically equivalent to saying "Yes."
  *   **Status:** **False / Incoherent (in these contexts).**
  *   **Analysis:** For silence to be a performative (like a nod or a signature), there must be a **conventional procedure** (Austin's felicity conditions) that is **common knowledge** among all participants. The convention must map the physical act (silence) to the normative status (consent).
  *   **Does it help your colleague?** **No.** There is no academic convention where email silence equals co-authorship consent. If there were, it would be widely known. It isn't.

  ---

  ### Addressing Your Specifics

  **Mental State vs. Normative Power vs. Social Fact**
  Consent is the exercise of a **normative power**. It changes the deontic landscape (permissions/obligations).
  *   *Mara:* She did not exercise the power (mental state: opposition). She did not create the social fact (she did not intend to bind herself). The *group* created a social fact (the motion passed), but they did so erroneously if they claim *she* consented.
  *   *You:* You did not exercise the power. No social fact was created.
  *   *Verdict:* "Consent" must refer to the exercise of the power. If you didn't intend to change the normative status, you didn't consent, even if the group treats you as bound. The group can bind you procedurally, but they cannot retroactively claim you *consented*.

  **Consent vs. Waiver vs. Estoppel**
  *   **Consent:** "I authorize this." (Requires positive act or strong convention).
  *   **Waiver:** "I give up my right to stop this." (Requires knowledge of the right and opportunity to exercise it).
  *   **Estoppel:** "I cannot complain now because you relied on my silence." (Requires reliance).
  *   *Meeting Case:* The Chair is conflating **Procedural Passing** with **Consent**. The motion might pass (Procedural), but Mara did not Consent. She might be Estopped from blocking implementation *if* the process was fair, but her silence was not Waiver because she deemed the process futile (coercion/futility undermines waiver).
  *   *Email Case:* Your colleague wants **Consent**. He might hope for **Estoppel**. He gets neither. There is no reliance interest I am obligated to respect in unsolicited email.

  **The Charter Clause**
  *   *Does writing it down change the reading?* Yes. It moves the case from **Epistemic** to **Procedural**.
  *   *Convention vs. Trigger:* It makes silence a **Trigger Condition** (Reading 2), not a Constitutive Performative (Reading 4). The rule does the work, not the silence.
  *   *New Members:* Rules bind only those who have accepted the framework. A new member is bound only upon joining the consortium (accepting the charter). They are not bound retroactively before they had the opportunity to read the rules.

  **The Medium (Meeting vs. Email)**
  *   *Difference in Kind:* Yes.
  *   *Meeting:* Has a **Floor**. The Chair controls uptake. There is a designated time for objection. Silence here is "marked."
  *   *Email:* Has no Floor. Asynchronous. No guarantee of receipt. Silence here is "unmarked."
  *   *Philosophical Import:* Speech acts require **uptake**. In a meeting, uptake is immediate and public. In email, uptake is private and delayed. You cannot perform a public normative act (binding a group) via a channel where receipt is not guaranteed and uptake is not signaled.

  **The Four Silences (Muted, Out, Asleep, Mara)**
  *   *Muted/Out/Asleep:* These are **Non-Agential**. You cannot exercise a normative power if you are not capable of action. These silences count for *nothing* normatively. They are merely physical absence.
  *   *Mara:* This is **Agential but Constrained**. She chose silence. However, normative powers require a degree of voluntariness. If the environment makes objection futile (she was overruled 4 times), her silence is not a waiver; it is **acquiescence under duress**.
  *   *Hard Case:* Mara. The others are easy (no agency). Mara has agency, but the *felicity conditions* for waiver (reasonable opportunity to affect outcome) were compromised.

  ---

  ### The Commitment

  Here is my position. I am confident in the email verdict; I am moderately confident in the meeting verdict (as it depends on the specific charter wording, but the principle holds).

  **1. Which reading is right?**
  The **Procedural Trigger (Reading 2)** is the only defensible reading for institutional settings, *provided* it is coupled with a **Normative Waiver (Reading 3)** for those who remain silent *when they could have spoken*.
  Silence is *never* Constitutive Consent (Reading 4) unless the convention is so robust it functions as a code (like a traffic light). Silence is a *failure to veto*, not an *affirmation*.

  **2. Did Mara consent?**
  **No.** She acquiesced. The motion may have *carried* procedurally, but it is false to record her as consenting. If the minutes say "Unanimous consent," the minutes are lies. They should say "Motion carried, no objections voiced."
  *Confidence:* High. This distinguishes the *status of the motion* from the *attitude of the member*.

  **3. Did I consent (Email)?**
  **No.** Absolutely not.
  *Confidence:* Very High. This is philosophically and ethically straightforward. There is no convention, no duty, and no uptake.

  **4. What rule should you write?**
  Do not write "Silence is consent." Write:
  > "Routine motions carry if no objections are voiced during the designated comment period. Substantive motions (budget, authorship, policy) require explicit recorded affirmation (opt-in). Absence or silence on substantive motions counts as abstention, not consent."

  **5. What do you say to your colleague?**
  Send this:
  > "In academic norms and general speech act theory, silence does not constitute consent, nor does it confer authorship rights. Authorship requires active intellectual contribution and explicit agreement (per ICMJE guidelines). My silence was non-receipt of a deadline, not a waiver of rights. Please remove your name or provide a draft of your specific intellectual contribution for review. Treating silence as consent in email correspondence is not a valid convention."

  ---

  ### Meta-Commentary: Where I Might Be Challenged

  **What I'd defend in print:**
  *   **The distinction between Procedural Trigger and Constitutive Act.** I would argue that most "conventional silence" (like auctions or parliamentary procedure) is actually a rule-based trigger, not a semantic equivalent to "Yes." The rule says "If no X, then Y," not "Silence means Yes." This matters for edge cases (like Mara) where the *spirit* of the rule is violated even if the *letter* is kept.
  *   **The Email Verdict.** Any philosopher of language who understands **common knowledge** and **convention** (Lewis, Searle) would agree that you cannot unilaterally impose a speech act convention on a recipient via email.

  **Where other philosophers might push back:**
  *   **The "Mara" Case:** A strict Institutional Realist might argue that if the Charter says "Silence is consent," then Mara *did* consent, regardless of her mental state. They would argue normative powers are purely social status functions, not mental states.
      *   *My Counter:* That leads to absurdity and coercion. If I hold a gun to your head and say "Sign this," you signed, but you didn't consent. If I create a culture where objection is futile, silence is not a valid exercise of a normative power. I'd expect Razians (on authority) to side with me here; strict Searleans might side with the Charter.
  *   **The Medium:** Some might argue email *has* developed conventions (e.g., "reply all" norms).
      *   *My Counter:* Those are etiquette norms, not normative power conventions. No one believes silence on email transfers property or rights.

  **What would change my mind:**
  If you showed me a signed contract where I explicitly agreed that "Failure to respond to emails within 7 days constitutes agreement to terms," then the Email case flips. That creates the **Conventional Procedure** required for the Constitutive Reading. Without that prior contract, the slogan is nonsense.

  **Final Summary:**
  Your colleague is attempting a **performative magic trick**. He is trying to conjure a normative fact (co-authorship) without the requisite ritual (explicit agreement). He is wrong. The Chair was procedurally efficient but philosophically sloppy. Fix the charter to distinguish *carrying a motion* from *consenting to a motion*.
