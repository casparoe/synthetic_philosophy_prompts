      *   **4. The Role-Inheritance Test:**
          *   *Constraint or Relabeling?* It's a constraint *if* roles are defined functionally independent of specific ontology. It's relabeling if "role" just means "whatever we believe now."
          *   *Defining Roles:* Must be causal/functional (e.g., "transmits energy") not ontological (e.g., "is a fluid").
          *   *Agreement Condition:* Both sides would agree if a theory was abandoned and *none* of its causal roles were filled by the successor (total dead end). Example: Phlogiston (oxidation took the process, but the "substance" had no role). Actually, even Phlogiston is tricky (negative mass?). Better example: Crystalline spheres. No role inherited.
          *   *Upstream Disagreement:* The disagreement is upstream. PMI defines "posit" as "named entity." Realist defines "posit" as "causal role." This case shows why the definition matters.

      *   **5. Verdict on PMI:**
          *   *Strengthens?* No. It shows "abandonment" is too coarse.
          *   *Weakens?* Yes, if you accept role inheritance. It shows continuity.
          *   *Bookkeeping?* Mostly. It reveals PMI relies on a naive count of nouns. This case shows science evolves by *reassigning* nouns, not just deleting them.
          *   *Conclusion:* The case weakens the *force* of PMI by showing that "false ontology" often masks "true functional structure."

      *   **6. Depreciation Realism:**
          *   *Concept:* Confidence decays with time.
          *   *Coherence:* It's coherent as a heuristic for *agnosticism*, but incoherent as a guide for *action*.
          *   *Problem:* If I use GPS, I act as if GR is true *now*. Depreciation says "trust it less than Newton was trusted in 1800."
          *   *Collapse:* It collapses into "Fallibilism" (I might be wrong) rather than a specific probability assignment.
          *   *Why nobody does it:* Because specific claims have specific evidence. The "age" of a theory is less relevant than its *integration* with other theories. QM is old but deeply integrated; a new ad-hoc hypothesis is fragile regardless of age.
          *   *Verdict:* It's an interesting emotional stance but fails as an epistemic rule because "time since acceptance" is a poor proxy for "likelihood of truth" compared to "empirical integration."

  4.  **Review and Refine:**
      *   *Tone:* Analytical, direct, avoiding fluff.
      *   *Check:* Did I address the Einstein/GR aether point? Yes, keep it brief as requested.
