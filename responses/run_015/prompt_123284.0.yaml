      *   *Check:* Ensure the "Role-Inheritance" section doesn't just say "it's good." Challenge it. Is it just moving the goalposts?
      *   *Refinement on Depreciation:* Make sure to distinguish between "confidence in the whole theory" vs "confidence in specific claims."

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* On Phlogiston. Phlogiston was supposed to be released during combustion. Oxygen absorption took that role. So even Phlogiston has role inheritance (the *process* of combustion was real, the *substance* was inverted). I should use "Crystalline Spheres" or "Humors" as better examples of total loss if needed, but actually, sticking to the Aether case is better. I will focus on whether the *specific* role of "absolute rest frame" was inherited. It wasn't. That's the PMI wedge.
      *   *Refinement on Structural Realism:* Emphasize that Lorentz and Einstein share the *structure* (Lorentz Invariance) but differ on *ontology*. This is the sweet spot for Structural Realism.

