          *   *The Hindsight Problem:* Could a 1890 physicist know the mechanical model was decoration?
              *   *Argument:* Yes, arguably. The mechanical models were already becoming baroque and inconsistent (rigid enough for high frequency, fluid enough for planets). The *math* was working; the *picture* was struggling.
              *   *Implication:* If "load-bearing" is identifiable *in situ* (via mathematical stability vs. model instability), Selective Realism holds. If not, it's just hindsight rationalization.
              *   *Verdict:* In this case, the math (Maxwell) was stable; the ontology (mechanical aether) was unstable. This supports Selective Realism *if* one can distinguish math from ontology at the time.

      *   **3. Structural Realism (Equations vs. Ontology):**
