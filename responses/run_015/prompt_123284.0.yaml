answer: |-
  This is a strong way to cut through the general noise. The luminiferous aether is the "control case" for the pessimistic meta-induction (PMI). If PMI fails here, it needs serious qualification; if it succeeds here, it's a strong warning.

  Here is the worked case using your framework.

  ### 1. Disciplined Mapping: The Jobs of the Aether

  To apply the role-inheritance test, we must separate the *ontology* (what they said it was) from the *causal roles* (what they said it did).

  | Job / Role | 19th C. Aether Description | Current Status (Post-1905/GR) | Inheritance Status | Evidential Weight |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Define Absolute Rest** | A stationary substance filling space; motion relative to it is absolute velocity. | **Dropped.** Special Relativity (SR) explicitly denies a preferred frame. GR has local frames, but no global absolute rest. | **None.** | **For PMI.** This was a central ontological commitment. It was false. |
  | **2. Medium of Propagation** | A mechanical substance that oscillates to transmit waves (like air for sound). | **Re-described.** Light propagates in vacuum. However, the "vacuum" is not nothing; it is a field state. | **Partial.** The *need* for a "stuff" to wave is gone, but the *reality* of the thing waving (the field) remains. | **Mixed.** PMI says "medium" is false. Realist says "physical carrier" is true. |
  | **3. Seat of Energy/Momentum** | The aether stored and transported electromagnetic energy. | **Inherited.** The electromagnetic field carries energy density and momentum density ($T_{\mu\nu}$). | **High.** The mathematical location of energy is continuous with the past. | **For Realism.** The causal power was real, even if the substrate name changed. |
  | **4. Mediator of Force** | Transmitted electromagnetic forces across space (avoiding action-at-a-distance). | **Inherited.** Field theory remains the standard for force mediation. | **High.** | **For Realism.** The mechanism (local interaction via field) survived. |
  | **5. Gravitational Substrate** | (Late stage) Some hoped it would explain gravity mechanically. | **Re-described.** GR makes spacetime geometry the "substrate," but it is not a material fluid. | **Transformed.** Spacetime has physical properties (curvature), echoing Einstein's 1920 "new aether" remark. | **For Structural Realism.** The *geometric role* survived, the *mechanical role* died. |

  **Pattern Evidence:**
  The pattern is **Ontological Discontinuity, Functional Continuity.**
  *   **PMI Interpretation:** Counts Job 1 (Absolute Rest) and the mechanical nature of Job 2. Verdict: The entity was non-existent. The theory was false.
  *   **Realist Interpretation:** Counts Jobs 3, 4, and the structural core of 2. Verdict: The causal structure was captured correctly; the mechanical picture was a mistaken visualization of that structure.

  ### 2. Selective Realism: Load-Bearing vs. Decoration

  Selective realism argues we should believe only the parts of the theory that were doing the work.

  *   **Load-Bearing:** The Maxwellian equations, the transverse wave nature, the finite propagation speed, the energy density relations. These generated the predictions (interference, diffraction, induction).
  *   **Decoration:** The specific mechanical constitution (is it an elastic solid? a fluid? does it drag?), the existence of a unique rest frame.

  **The Hindsight Problem:**
  Is "load-bearing" readable *at the time* (1890), or only *after* (1910)?
  *   **Argument for Readability:** By 1890, the mechanical models were already in crisis. To support high-frequency light, the aether had to be incredibly rigid; to allow planets to pass, it had to be frictionless. This tension was visible *then*. A sophisticated realist in 1890 could have said: "The equations are robust; the mechanical model is a placeholder."
  *   **Argument for Hindsight:** Most physicists *did* treat the mechanical model as essential. Maxwell himself tried to model the field mechanically. If the scientists at the time couldn't distinguish the load-bearing math from the decorative ontology, how can we claim the distinction is objective?

  **Implication:**
  If "load-bearing" is only identifiable in hindsight, Selective Realism becomes a rationalization trick ("We believe the parts that turned out to be true"). If it is identifiable *in situ* (by checking which assumptions are actually required for the derivation of predictions), it survives.
  *   **In this case:** The Lorentz transformations were derived *from* the aether model but turned out to be independent of it. This suggests the math was load-bearing and the aether was decorative. This supports Selective Realism, *provided* we admit that distinguishing the two requires high theoretical sophistication that may not be available in all historical cases.

  ### 3. Structural Realism and Empirical Equivalence

  Structural Realism (SR) says: Don't believe in the objects (aether), believe in the relations (equations).

  *   **Lorentz vs. Einstein:** Lorentz's aether theory and Einstein's SR were empirically equivalent regarding the Michelson-Morley result and electrodynamics of moving bodies. They used the same math (Lorentz transformations).
  *   **The Discard:** Discarding the aether was not a refutation of the *predictions* (which remained true) but a simplification of the *ontology* (Occam's Razor).
  *   **Does this help the Realist?** Yes. It explains why the theory worked so well despite the "false" entity. The *structure* of the world (Lorentz invariant) was correctly captured. The aether was an unnecessary posit added to that structure.
  *   **Does this help PMI?** No. PMI argues that successful theories are discarded because they are *false*. Here, the theory wasn't discarded because it failed empirically; it was discarded because a simpler ontology fit the same structure.
  *   **The Verdict:** This stretch of empirical equivalence makes the discard look like a **re-description**. This hurts PMI. PMI relies on the narrative: "Theory A worked, Theory A was false, therefore Theory B (current) is likely false." But if Theory A was "structurally true" but "ontologically bloated," the inference to the falsity of Theory B's structure is broken.

  ### 4. The Role-Inheritance Test

  Is your test a genuine constraint or just relabeling?

  *   **The Risk of Relabeling:** If "role" is defined loosely (e.g., "the aether's role was to be the thing we currently believe in"), it's trivial.
  *   **The Constraint:** It becomes a constraint if roles are defined **functionally** prior to knowing the successor theory.
      *   *Example:* "Transmits energy at speed $c$." This is a functional role definable in 1880.
      *   *Test:* Did the successor theory fill *that specific functional slot*?
      *   *Result:* Yes, the EM field fills it.
      *   *PMI Counter:* PMI insists the slot itself was illusory (energy doesn't need a medium).
      *   *Resolution:* The disagreement is indeed upstream. PMI counts **Nouns** (Aether, Phlogiston, Caloric). Realism counts **Verbs** (Propagates, Oxidizes, Transfers Heat).

  **What would force agreement?**
  Both sides would agree on a high failure rate if we found cases where **functional roles were also dropped.**
  *   *Candidate:* **Crystalline Spheres.**
      *   *Role:* Carry planets in fixed orbits.
      *   *Successor:* Gravity/Inertia.
      *   *Inheritance:* None. The *mechanism* of orbiting was completely re-explained. The spheres didn't become fields; they vanished.
  *   *Candidate:* **Humors.**
      *   *Role:* Cause disease via imbalance.
      *   *Successor:* Germ theory/Physiology.
      *   *Inheritance:* None. The causal mechanism was totally replaced.

  **Conclusion on Test:** The Aether case is actually a "best case" for the Realist because of the high inheritance (fields). The PMI relies on cases like Humors or Spheres. If the historical record is mixed (some inheritance, some total loss), the "base rate" depends entirely on whether you count by Nouns (PMI wins) or Verbs (Realist wins). There is no neutral arbiter because science itself doesn't decide which is the "real" posit—the math or the picture.

  ### 5. Verdict on the Pessimistic Meta-Induction

  Does this case strengthen, weaken, or expose PMI?

  *   **Strengthens?** No. It shows that "abandonment" is not a binary switch. The aether wasn't simply proven false; it was absorbed into the field concept.
  *   **Weaken?** Yes, significantly. It demonstrates that **ontological elimination** is compatible with **structural preservation.** PMI assumes that if the entity is gone, the truth is gone. The aether case shows the entity can go while the truth (the relations/energetics) stays.
  *   **Bookkeeping Fight?** Ultimately, yes. The argument turns on what counts as a "posit."
      *   If a posit is "A mechanical substance at rest," PMI is right (100% failure rate).
      *   If a posit is "A physical system with degrees of freedom carrying energy," PMI is wrong (0% failure rate).
      *   **The Lesson:** The PMI is only as strong as the granularity of its counting. This case proves that coarse-grained counting (Nouns) yields pessimism, while fine-grained counting (Functions/Structures) yields optimism. Since science progresses by refining granularity, the PMI is arguably using the wrong ruler.

  ### 6. Depreciation Realism

  Your friend's view: *Confidence decays with time since acceptance, calibrated to historical abandonment rates.*

  **Coherence Check:**
  It is coherent as a statement of **fallibilism**, but incoherent as a **probability assignment**.

  1.  **The Proxy Problem:** "Time since acceptance" is a poor proxy for "likelihood of truth."
      *   Newtonian Mechanics was accepted for 200+ years.
      *   Plate Tectonics has been accepted for ~60 years.
      *   Does Plate Tectonics deserve higher confidence than Newtonian Mechanics did in 1950?
      *   *Depreciation Realism says:* Yes, because Newton's "time" ran out.
      *   *Reality:* Plate Tectonics is more secure because it is integrated with geophysics, seismology, and magnetism. Newton failed because it hit a boundary (relativity/quantum).
      *   **Failure:** Confidence should decay based on **integration and anomaly accumulation**, not calendar time.

  2.  **The Action Problem:**
      *   If I design a bridge, I use Newtonian mechanics. I act with 100% confidence in its domain.
      *   Depreciation Realism says: "Hold 85% confidence because the theory is old."
      *   If I actually held 85% confidence, I would over-engineer the bridge or hedge against Newtonian failure. Nobody does this.
      *   **Collapse:** It collapses into "Plain Realism + Humility." We believe the theory is true *within its domain*, acknowledging domains can shrink. That's just standard scientific realism, not a depreciation schedule.

  3.  **The Specific Claim Problem:**
      *   You don't believe "General Relativity" as a block. You believe the Einstein Field Equations. You might not believe the specific interpretation of singularities.
      *   Depreciation applies a blanket tax to the whole theory.
      *   **Verdict:** It is not a workable epistemic rule. It confuses the **lifespan of a paradigm** with the **reliability of its claims.** The aether case proves this: The "aether paradigm" died, but the claims about energy momentum survived 100% intact. A depreciation rule would have lowered confidence in energy-momentum conservation simply because it was associated with the word "aether." That would have been an error.

  **Summary:** The aether case suggests that **structural continuity** is the right metric for realism, not entity survival. PMI counts entities and gets pessimism. Realists count structures and get optimism. Your role-inheritance test is the tool that exposes this counting discrepancy. Depreciation Realism is a tempting heuristic but fails because "age" is not the variable that determines truth retention; "structural integration" is.
