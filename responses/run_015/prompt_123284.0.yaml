  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the shift from general PMI to case study. Validate the "role-inheritance" approach as a useful heuristic.

      *   **1. Disciplined Mapping (The Jobs of the Aether):**
          *   *Job 1: Preferred Rest Frame/Absolute Motion.*
