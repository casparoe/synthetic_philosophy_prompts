answer: |-
  # Joint Statement on Varieties of Free Will Worth Wanting

  **Signatories:**
  *   **The Narrative-Integrationist (NI):** Representing the view that free will is a diachronic capacity for value coherence and revision.
  *   **The Moment-of-Choice Pluralist (MCP):** Representing the view that free will requires metaphysical openness at the point of decision.

  **Date:** October 26, 2023
  **Context:** This document summarizes the outcomes of a good-faith adversarial collaboration regarding the necessary and sufficient conditions for free will relevant to moral accountability.

  ---

  ### 1. Agreed Claims

  Despite our metaphysical divergences, we endorse the following propositions as a shared foundation for further inquiry:

  1.  **Ordinary-Language Function:** We agree that the ordinary-language concept of "free will" is primarily functional, serving to distinguish agents who are appropriate targets of moral praise, blame, and retributive justice from those who are not (e.g., the coerced, the insane, or the manipulated).
  2.  **The Irrelevance of Mere Randomness:** We agree that quantum-level indeterminacy, in isolation, is irrelevant to moral accountability. The mere presence of physical randomness does not constitute control; an action caused by a random quantum fluctuation is no more "free" than an action caused by deterministic neural firing if the agent does not own the outcome.
  3.  **Possession vs. Exercise:** We agree that possessing free will is distinct from exercising it successfully. An agent may possess the capacity for free will but fail to exercise it due to compulsion, ignorance, or weakness of will, and conversely, an agent may perform a right action by luck without exercising free will.
  4.  **The Manipulation Intuition:** We agree that agents subjected to direct neural manipulation or coercive brainwashing lack free will, regardless of whether their actions appear coherent (NI) or causally open (MCP). Both views recognize external determination that bypasses the agent's own processing as a defeater for freedom.
  5.  **Moral Stakes:** We agree that if neither of our proposed varieties of free will exists, traditional moral accountability is severely undermined. We both seek a "variety worth wanting" because we believe moral life requires more than mere causal efficacy; it requires a specific kind of authorship.

  ---

  ### 2. Disagreements Table

  The following table isolates the precise points of divergence regarding the *constitution* of free will.

  | Issue | Narrative-Integrationist (NI) Core Thesis | Moment-of-Choice Pluralist (MCP) Core Thesis | Nature of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Primary Locus** | Free will is a **diachronic property** of the agent's life. It resides in the temporal structure of the self, specifically the capacity to weave actions into a coherent, revisable narrative over time. | Free will is a **synchronic property** of the decision event. It resides in the causal structure of the moment, specifically the existence of multiple causally possible futures at $t$. | **Temporal/Metaphysical:** NI locates freedom in history/identity; MCP locates freedom in modal physics/causality. |
  | **Necessary Condition** | **Narrative Coherence is Necessary.** An agent lacks free will if their actions do not flow from values they have reflectively endorsed and maintained across counterfactual scenarios, even if their choices are metaphysically open. | **Metaphysical Openness is Necessary.** An agent lacks free will if their choice is the only physically possible outcome given prior states, even if their actions display perfect narrative coherence and rational revision. | **Conditionality:** NI prioritizes psychological integration; MCP prioritizes alternative possibilities (AP). |
  | **The "Could Have Done Otherwise" Principle** | Interpreted **Conditionally.** "Could have" means "Would have, if the agent had chosen differently based on their reflective values." It does not require the past to be fixable. | Interpreted **Categorically.** "Could have" means "It was metaphysically possible for the agent to choose differently given the *exact* same prior causal state." | **Modal:** NI accepts compatibilist conditionals; MCP requires incompatibilist categorical openness. |
  | **Source of Authority** | Authority comes from **Self-Endorsement.** An action is free if it is authorized by the agent's higher-order volitions and narrative identity. | Authority comes from **Causal Origination.** An action is free if the agent is the ultimate source of the causal chain, not merely a conduit of prior states. | **Attribution:** NI focuses on internal alignment; MCP focuses on external causal independence. |

  ---

  ### 3. Cruxes and Predictive Hypotheticals

  To move this dispute forward, we have identified three specific cruxes. Resolving these sub-questions would compel at least one party to revise their position. For each crux, we specify the hypothetical case, the specific question at stake, and our pre-committed interpretations.

  #### Crux 1: The Necessity of Diachronic Coherence for Accountability
  *   **The Question:** Is diachronic coherence necessary for moral accountability, or can an agent be held responsible for a truly open choice that contradicts their entire life narrative?
  *   **The Case:** *The Sudden Saint.* An agent with a lifelong, coherent narrative of cruelty and selfishness (no reflective endorsement of goodness) suddenly, without prior internal revision, performs a radical act of self-sacrifice. MCP asserts this choice was genuinely open; NI asserts this action was alien to the self-narrative.
  *   **NI Prediction/Interpretation:** We predict this action is **not fully free** in the sense required for deep moral credit. Because the action did not flow from a revised narrative or endorsed values, it is akin to a spasm or luck. The agent cannot "own" it diachronically.
  *   **MCP Prediction/Interpretation:** We predict this action is **fully free** and worthy of praise. Because the future was genuinely open at the moment of choice, the agent originated the good act ex nihilo. The lack of prior narrative integration does not negate the reality of the choice at $t$.

  #### Crux 2: Momentary Openness in the Absence of Narrative Integration
  *   **The Question:** Can momentary openness obtain in the absence of narrative integration, and if so, does it constitute free will *worth wanting*?
  *   **The Case:** *The Fragmented Hedonist.* An agent experiences genuine metaphysical openness at every decision point (MCP condition met) but lacks any capacity for long-term planning, value revision, or narrative coherence (NI condition failed). They live entirely in the present, unable to endorse values across time.
  *   **NI Prediction/Interpretation:** We predict this agent **lacks free will worth wanting.** Without the capacity to maintain and revise values across branches, the agent is a series of momentary selves. Accountability requires a persisting "I" to hold responsible, which narrative integration provides.
  *   **MCP Prediction/Interpretation:** We predict this agent **possesses free will.** The capacity to do otherwise at each moment is sufficient for basic moral accountability. While their life may lack meaning or autonomy in the NI sense, the metaphysical freedom required for blame/praise is present.

  #### Crux 3: The Synthetic Agent (Value-Coherence without Open Branches)
  *   **The Question:** Whether a synthetic agent with perfect value-coherence but zero genuinely open branches counts as possessing free will.
  *   **The Case:** *The Perfect Algorithm.* A synthetic agent is created with a sophisticated architecture that simulates reflective endorsement, value revision, and narrative coherence perfectly. However, its operations are fully deterministic (zero genuinely open branches). It passes all behavioral tests for NI's definition but fails MCP's definition.
  *   **NI Prediction/Interpretation:** We predict this agent **counts as possessing free will.** The "variety worth wanting" is the functional capacity for self-governance and value alignment. If the synthetic agent maintains and revises values across *counterfactual* branches (in the conditional sense), the lack of metaphysical openness is irrelevant to its moral status.
  *   **MCP Prediction/Interpretation:** We predict this agent **does not count as possessing free will.** "Zero genuinely open branches" means the agent could not have done otherwise in the categorical sense. Perfect coherence in a fixed system is merely complex determinism, not freedom. The agent is a script, not an author.

  ---

  ### 4. Identification of Verbal Dispute

  Upon review, we identify a portion of the dispute that is **verbal** rather than substantive, specifically regarding the phrase **"Counterfactual Life-Branches."**

  *   **Explanation:** The NI definition invokes the capacity to endorse values "across counterfactual life-branches." The MCP interprets this phrase as requiring *metaphysically real* alternative possibilities (incompatibilist branches). The NI intends this phrase to denote *conditional capacities* (compatibilist branches: "If I had deliberated differently, I would have...").
  *   **Resolution:** If we stipulate that "counterfactual branches" refers only to the agent's *internal modeling capacity* rather than the *metaphysical structure of the universe*, the NI position remains intact while the MCP's objection to the terminology dissolves. However, the substantive disagreement regarding **Crux 3 (The Synthetic Agent)** remains: even if we agree on the definition of "counterfactual," the MCP still requires the *actual world* to be indeterministic at the point of choice, whereas the NI does not. Thus, while the terminology of "branches" contains a verbal ambiguity, the core conflict regarding the necessity of indeterminism is substantive.
