answer: |-
  This is a sophisticated philosophical dispute that hinges on distinguishing between **decipherment** (cracking a code) and **radical translation** (mapping meaning without bridges), and between **underdetermination of theory** (data fits multiple hypotheses) and **indeterminacy of translation** (no fact of the matter exists).

  Your friend argues that the empirical success of Egyptology proves translation is determinate. You suspect the argument moves too fast. Below is the analysis mapped in both directions, locating precisely where the friend's refutation fails and where Quine's theory remains silent.

  ### 1. Theoretical Mapping: What is Indeterminate?

  To evaluate the counterexample, we must first isolate what Quine claims is indeterminate.

  *   **Radical Translation:** Quine's thought experiment involves a linguist encountering a native speaker with no prior dictionaries, bilinguals, or cultural context. The only data is **stimulus meaning**: the correlation between the native's utterances and observable external stimuli (e.g., a rabbit runs by, the native says "Gavagai," the native assents/dissents).
  *   **Indeterminacy of Translation:** Quine claims that multiple translation manuals can be constructed that are compatible with *all possible behavioral evidence* (past, present, and future) yet are mutually incompatible. There is no "fact of the matter" to decide between them, because meaning *just is* behavioral disposition.
  *   **Inscrutability of Reference:** Even if we fix the truth conditions of sentences (we know when "Gavagai" is uttered truly), we cannot fix the reference of terms (does "Gavagai" mean *rabbit*, *undetached rabbit part*, or *rabbit stage*?).
  *   **The Constraint:** The constraint is **behavioral assent/dissent**. If you remove the speaker and the possibility of querying them, you have left the domain of *radical translation* and entered the domain of *textual interpretation* or *cryptanalysis*.

  ### 2. Evidentiary Mapping: The Hieroglyphic Case

  Your friend treats the Rosetta Stone evidence as equivalent to Quine's behavioral evidence. It is not.

  *   **Quine's Evidence Base:** Concurrent observation of stimulus and utterance. (Rabbit appears $\rightarrow$ "Gavagai" $\rightarrow$ Assent).
  *   **Hieroglyph Evidence Base:**
      1.  **Internal Distribution:** Repetition of signs, cartouches (proper names), grammatical patterns.
      2.  **Bilingual Correlation:** The Greek text provides a sentence-to-sentence mapping, not a stimulus-to-sentence mapping.
      3.  **Historical Continuity:** Coptic provides a phonological and lexical bridge across time.
      4.  **Contextual Coherence:** Does the translation make historical sense (e.g., naming the correct king)?

  **The Mismatch:** The Rosetta Stone provides a **key** (Greek) that Quine explicitly excludes in the *radical* scenario. Quine's indeterminacy arises precisely because there is *no* bilingual manual to fix analytical hypotheses. The Egyptologists had a manual provided by history. Therefore, Champollion's success demonstrates **determinacy of decryption**, not necessarily **determinacy of translation** in the Quinean sense.

  ### 3. Analyzing the Historical Episode

  Does the actual history of decipherment support or undermine Quine?

  **What the Thesis Illuminates:**
  *   **The Failure of the Ideographic Assumption:** For centuries, scholars assumed hieroglyphs were purely symbolic (ideographic). This fits Quine's view that a manual can be consistent with some data but fail globally. The "ideographic manual" fit the intuition of "mysterious symbols" but failed to predict the phonetic patterns in cartouches.
  *   **The Necessity of External Anchors:** Quine argues internal evidence (stimulus patterns) is insufficient to fix reference. Similarly, Champollion could not break the code using only internal distribution; he needed the external anchor of the Greek text and the diachronic anchor of Coptic. This aligns with the Quinean intuition that meaning cannot be fixed solely by internal structural relations.
  *   **Underdetermination:** Before the phonetic breakthrough, multiple interpretations of specific signs were possible. The data underdetermined the theory.

  **What the Thesis Misdescribes:**
  *   **The "Fact of the Matter":** Quine denies there is a fact of the matter about meaning beyond behavior. Egyptology presupposes there *was* a fact of the matter (what the scribe intended to write). The success of the decipherment relies on **realism about historical intent**. Quine's behaviorism rejects access to intent unless manifested in current stimulus response.
  *   **The Role of Coptic:** Quine's radical translation is synchronic (here and now). Egyptology is diachronic. The existence of a descendant language (Coptic) acts as a "living speaker" proxy. Quine's theory does not account for historical linguistic evolution as a constraint on meaning, because his model is ahistorical.

  ### 4. Locating the Friend's Failure

  Your friend's argument fails at the step where she equates **predictive success** with **determinacy of meaning**.

  **1. Decryption vs. Translation:**
  Champollion determined the *phonetic values* and the *grammar*. He cracked the code. But knowing how to pronounce a word and where it fits in a sentence is not the same as fixing its **reference**.
  *   *Quinean Objection:* Even if we read the inscription perfectly ("The King offers bread to Ra"), the inscrutability of reference remains. Does "Ra" refer to the sun, the god, the concept of light, or a temporal stage of the deity? The text alone cannot decide this. The friend confuses fixing the *words* with fixing the *ontology*.

  **2. The Gerrymandered Rival:**
  Your friend asks: *Could a suitably gerrymandered rival have predicted as well?*
  *   *In Decryption:* Generally, no. If you map the phonetics wrong, the text becomes gibberish. The constraint of intelligibility is tight.
  *   *In Translation:* Quine would say yes. A rival manual could map Egyptian "Ra" to Greek "Helios" in some contexts and "Apollo" in others, preserving all truth conditions of the text while diverging on the underlying ontology. Because there are no speakers to ask "Is this Ra or Helios?", the textual evidence alone cannot rule out the rival manual. The friend assumes the text *forces* one meaning; Quine argues the text only forces one set of truth conditions.

  **3. The Evidence Gap:**
  The friend argues that reading *new* inscriptions breaks the tie between manuals.
  *   *Quine's Reply:* Any manual that fits the Rosetta Stone perfectly will also fit new inscriptions *if* it preserves the logical structure. Indeterminacy isn't about getting the history wrong; it's about mapping terms to reality differently while keeping the sentences true. If Manual A says "Ra = Sun God" and Manual B says "Ra = Sun Stage," both might predict the same usage in inscriptions. The new inscriptions confirm the *grammar*, not the *metaphysics*.

  ### 5. Implications for Living Languages

  Does this tell us anything about translating languages people still speak?

  *   **No Direct Refutation:** The existence of a bilingual stone is a luxury radical translation explicitly denies itself. If you encounter a living tribe, you do not have a "Rosetta Stone" of their thoughts. You only have their behavior.
  *   **The "Coptic" Analogy:** If we had a "Rosetta Stone" for a living language (e.g., a perfect neural interface that showed us exactly what they meant), translation would be determinate. But we don't. We only have assent/dissent.
  *   **The Lesson:** The success of Egyptology shows that **with sufficient constraints (bilinguals, historical continuity), underdetermination can be resolved.** Quine admits this. His point is that in the *absence* of those constraints (the radical scenario), resolution is impossible not because we are ignorant, but because there is nothing to be right about.

  ### 6. Where the Theory is Silent

  You asked to acknowledge where Quine is genuinely silent rather than pressing him into service.

  *   **Dead Languages:** Quine's theory of *radical translation* is silent on dead languages. He explicitly limits his thesis to cases where behavioral evidence is available. He has a separate view on *underdetermination of scientific theory* which applies to Egyptology, but that is a weaker thesis. (Science is underdetermined by data, but we assume a fact of the matter exists; Translation is indeterminate, meaning no fact of the matter exists).
  *   **Historical Intent:** Quine's behaviorism has no room for "what the scribe meant 2,000 years ago" unless it cashes out in present-day verification conditions. Egyptology relies on a realist view of historical mental states that Quine's ontology rejects. Therefore, Egyptology operates on premises Quine denies. You cannot use a game played by different rules to refute the original rules.

  ### Summary of the Analysis

  **Your friend's argument fails because:**
  1.  **Category Error:** She treats **decipherment** (finding the code key via bilinguals) as **radical translation** (deriving meaning from behavior without bridges).
  2.  **Evidence Mismatch:** She treats **textual correlation** (Greek = Egyptian) as **stimulus meaning** (Utterance = Rabbit).
  3.  **Reference vs. Truth:** She assumes fixing the truth of sentences fixes the reference of terms. Quine's **inscrutability of reference** survives even perfect decipherment. We can read the words without knowing what they *ontologically commit* to.
  4.  **Historical Realism:** She assumes a fact of the matter about historical intent. Quine denies facts of the matter about meaning exist beyond behavioral dispositions.

  **Where you stand:**
  You are correct that the argument moves too fast. The decipherment of hieroglyphs refutes the idea that ancient scripts are *mysteries*, but it does not refute the idea that *meaning is indeterminate*. It shows that **constraints reduce underdetermination**, but it does not show that **behavioral evidence fixes reference**.

  **Verdict:**
  Champollion's success is not a counterexample to Quine. It is a demonstration of how **adding constraints** (bilingual texts, descendant languages) moves a problem from the realm of *radical translation* (indeterminate) to the realm of *analytical hypothesis testing* (underdetermined but resolvable). Quine would concede that with a Rosetta Stone, translation is determinate *relative to the stone*. But he would maintain that without the stone (or living speakers), the indeterminacy returns. The friend has solved the puzzle of the *code*, but not the philosophical puzzle of *reference*.
