  **The Ontology of Relational Fluidity: Structural Resonance in Analogical Figure–Ground Judgment**

  In the microdomain of analogical figure–ground judgment, the traditional distinction between the focal object (figure) and the contextual field (ground) undergoes a fundamental transformation. Stripped of perceptual prominence—the visual pop-out effects that typically dictate Gestalt segregation—this distinction becomes purely relational. Here, a region counts as figure not because it demands attention, but because it occupies a specific node within a network of structural dependencies. In this context, conceptual slippage—the shifting of category boundaries to accommodate new instances—is frequently misdiagnosed as a failure of boundary enforcement. This argument posits the contrary: in a domain constituted by relations rather than atoms, slippage is the proper mechanism of conceptual extension. Furthermore, this extension is not unconstrained; it is governed by a "structural resonance threshold." This threshold ensures that conceptual stretching remains ontologically faithful to the relational fabric of the domain, filtering out accidental similarities without relying on fixed prototypes or architectural specifics.

  **The Ontological Necessity of Fluidity**

  To understand why slippage is a feature rather than a bug, one must first accept the ontological status of the microdomain. In perceptual spaces, objects possess inherent boundaries; a cup is distinct from a table regardless of how one looks at it. In the analogical microdomain, however, identity is constituted entirely by position within a relational structure. A region is not a "figure" in isolation; it is a figure only relative to the specific web of constraints binding it to a ground.

  Consequently, rigidity in categorization would constitute an ontological error. If the reality being judged is fluid—defined by dynamic relations rather than static properties—then a rigid concept would fail to map the territory accurately. Conceptual fluidity is therefore not an epistemic limitation (a failure of the judge to discern the "true" boundary) but an ontological requirement (a reflection of the boundary's inherent dependence on context). When a system permits slippage, it is not losing precision; it is maintaining fidelity to a reality where boundaries are emergent properties of interaction, not pre-existing fences.

  **Borderline Cases: Containment Without Salience**

  The necessity of slippage becomes most apparent in borderline cases where canonical structural relations hold but typical triggers are absent. Consider a scenario involving containment. In a canonical figure–ground judgment, a small, distinct region contained within a larger field is naturally judged as the figure. However, in the analogical microdomain, one may encounter a case where Region A is strictly contained within Region B, satisfying the topological definition of containment, yet A lacks the salience usually required to be treated as the focus. Perhaps A is diffuse, or B is highly articulated.

  A rigid system, relying on salience heuristics, would misclassify A as background, thereby ignoring the structural truth of its containment. A system permitting conceptual slippage, however, can extend the concept of "figure" to include A, provided the relational role of A matches the functional role of a figure in other contexts. This slippage allows the system to recognize that "being the contained element" is the defining structural feature, even when the perceptual or superficial cues are inverted. Here, slippage acts as a corrective lens, allowing the structural reality (containment) to override the superficial noise (low salience). Without this capacity for extension, the system would be blind to structural truths that do not wear the usual clothing of prominence.

  **The Structural Resonance Threshold**

  If slippage is permitted, the system risks collapsing into trivial permissiveness, where any region could be arbitrarily designated as figure. To prevent this, legitimacy is contingent upon crossing a "structural resonance threshold." This threshold is not a measure of similarity to a central prototype, nor is it a statistical frequency count. Rather, it is a measure of the density and coherence of relational correspondences between the candidate instance and the structural role it seeks to occupy.

  Resonance occurs when multiple independent relational strands vibrate in harmony. For a region to slip into the category of "figure" despite low salience, it cannot rely on a single shared relation (e.g., mere containment). It must exhibit a cluster of co-occurring relations that collectively mimic the causal or logical profile of a canonical figure. For instance, if the candidate region is contained, it must also be the locus of change, the recipient of action, or the determinant of the ground's state.

  The threshold represents the minimum density of these correspondences required to sustain the conceptual extension. Below this threshold, the relational links are too sparse to support the weight of the category; the concept would dissolve because there is insufficient structural material to hold it together. Above the threshold, the interlocking relations create a self-reinforcing network. The concept stretches, but it does not break, because the internal tension of the relations holds the extension in place.

  **Blocking Accidental Similarity**

  The structural resonance threshold specifically addresses the problem of accidental similarity. In any complex domain, isolated similarities are inevitable by chance. A background region might accidentally share one property with a canonical figure (e.g., both are blue, or both are enclosed). If conceptual extension were based on single-point matches, the system would be overwhelmed by false positives.

  The resonance requirement blocks this by demanding *convergent* evidence. An accidental similarity is typically isolated; it does not bring other relations into alignment. If a region is contained (Relation 1) but does not drive the process (Relation 2) and is not distinct in kind (Relation 3), the relational density remains below the threshold. The "signal" of the figure-ground distinction requires a harmonic convergence of relations. Just as a single musical note does not constitute a chord, a single relational match does not constitute a structural analogy.

  By requiring a minimal density of correspondences, the threshold ensures that only those extensions supported by a robust sub-structure are admitted. This avoids the need for fixed prototypes because the validity of the extension is determined internally by the coherence of the current mapping, not externally by comparison to a stored ideal. The "truth" of the judgment lies in the integrity of the relational web, not in the distance from a center.

  **Conclusion**

  In the microdomain of analogical figure–ground judgment, the distinction between figure and ground is not a static property of regions but a dynamic status conferred by relational structure. Consequently, conceptual slippage is not a degradation of category integrity but the necessary mechanism by which concepts track structural realities that defy superficial cues. In borderline cases where containment exists without salience, slippage allows the system to honor the structural relation over the perceptual habit. However, this flexibility is bounded by the structural resonance threshold. This threshold acts as a filter against arbitrariness, permitting extension only when a sufficient density of relational correspondences creates a coherent structural identity. Thus, the fluidity of the concept is revealed not as a weakness of the judging system, but as an ontological feature of a domain where existence is defined by connection rather than isolation.
