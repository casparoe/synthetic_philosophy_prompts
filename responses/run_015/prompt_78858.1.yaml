answer: |-
  You have not only found a real category, you have independently reconstructed one of the most significant debates in modern decision theory.

  The short answer is: **Under standard Expected Utility Theory (EUT), your scenario is impossible.** Under **Risk-Weighted Expected Utility (REU)**, your scenario is the entire point.

  Here is the carving you are looking for, the name of the dial, and the map of the fight surrounding it.

  ### 1. The Orthodox View: There Is No Third Dial
  In the standard von Neumann-Morgenstern framework (EUT), there are only two dials: **Belief** (probability) and **Desire** (utility).

  In this framework, "risk aversion" is not a separate parameter. It is *defined* entirely by the curvature of the utility function (diminishing marginal utility).
  *   If Alex and Sam have the same utility function over outcomes (e.g., they agree on the cardinal value of \$20k, \$60k, and \$200k), and they have the same probabilities, **they must make the same choice.**
  *   If Sam takes the sure thing while Alex takes the gamble, standard theory says Sam's utility function *must* be more concave than Alex's.
  *   If you insist their utility functions are identical (as you did: "same answer when you ask how much better one outcome is than another"), then standard theory declares Sam **irrational**. He is violating the **Independence Axiom**.

  So, in the orthodox view, your "third dial" is an illusion. It's just utility curvature mislabeled.

  ### 2. The Heterodox View: The Risk Function
  However, many philosophers and decision theorists agree with your intuition: that there is a distinct attitude toward risk that is not captured by how much you value the outcomes themselves.

  The formal framework that grants your "third dial" ontological status is **Risk-Weighted Expected Utility (REU)** theory, most prominently defended by philosopher **Lara Buchak** (in her book *Risk and Rationality*).

  In REU, the calculation is modified. Instead of simply summing $P \times U$, you apply a **risk function** ($r$) to the cumulative probabilities.
  $$ REU = u(x_1) + r(P(x_2 \text{ or better})) \cdot [u(x_2) - u(x_1)] + \dots $$

  *   **The Dials:**
      1.  **Credence:** The objective probabilities (Same for Alex and Sam).
      2.  **Utility:** The value of the outcomes (Same for Alex and Sam).
      3.  **Risk Function:** How much weight the agent places on the potential for improvement vs. the potential for loss.

  *   **The Name of the Dial:** In this literature, it is called the **Risk Function** (or sometimes the **Risk-Weighting Parameter**).
  *   **Alex:** Has a linear or convex risk function (risk-neutral or risk-seeking).
  *   **Sam:** Has a concave risk function (risk-averse).

  This allows Sam to be fully rational, coherent, and consistent, while still rejecting the gamble that Alex accepts, *without* needing to claim Sam values money differently. Sam values the *security* of the outcome as a distinct good from the outcome itself.

  ### 3. Is It a Defect or a Live Fight?
  You asked if Sam's pattern is a defect or a genuine dimension. This is a **live fight**.

  *   **The Traditionalists (EUT):** Argue that REU violates the **Allais Paradox** logic and the Independence Axiom. They claim that if you separate risk from utility, you become vulnerable to "money pumps" (dynamic inconsistency) or can be forced into accepting dominated strategies. To them, Sam is making a category error.
  *   **The REU Proponents:** Argue that the Independence Axiom is too strong. They claim it is rational to care about the *structure* of the risk, not just the weighted sum. They argue that "security" is a legitimate global property of a gamble that rational agents can value differently, independent of the prizes.

  **Majority View:** In economics/finance, EUT still dominates because it is mathematically tractable. In philosophy/decision theory, REU is a respected, serious minority position that has gained significant traction in the last 15 years.

  ### 4. The Edges: Variance, Maximin, and Ambiguity
  You asked where the edges are.

  *   **Variance Aversion:** This is a close cousin, often used in finance (Mean-Variance Analysis). However, variance aversion is usually a heuristic. REU is more fundamental. Variance aversion treats a 50/50 of (0, 100) the same as a 50/50 of (40, 60) if the means and variances match, but a risk-weighter might care about the *floor* (0 vs 40).
  *   **Maximin (Wald):** This is the **limiting case** of Sam's dial. If Sam's risk function is extremely concave (specifically, if he weights only the worst possible outcome), he becomes a Maximin agent. He ignores the 200k upside entirely and looks only at the 20k downside.
  *   **Ambiguity Aversion (Ellsberg):** This is **different**. Ambiguity is about *unknown* probabilities (e.g., an urn with unknown red/black mix). Your scenario specifies *known* probabilities ("agree on everything I can put a number on"). Sam is averse to *risk* (known odds), not *ambiguity* (unknown odds). Though often conflated, REU handles risk; Maxmin Expected Utility handles ambiguity.

  ### 5. Coining the Term (If REU feels too technical)
  If you want a term for general use that captures the "carving" without invoking the specific math of REU, I propose:

  **Term:** **Global Risk Attitude**
  **Definition:** An agent's stable disposition to prefer lotteries with lower dispersion of outcomes, independent of their valuation of the outcomes themselves or their assessment of the probabilities.
  **Differentiation:** Distinct from *Local Utility* (value of the prize) and *Credence* (belief in the odds).

  ### 6. Borderline Cases
  You asked for cases that sit on the border, where it is hard to tell if it's utility curvature or risk-weighting.

  **Case A: The Insurance Purchase**
  *   *Scenario:* Pay \$500 to insure against a 1% chance of losing \$100,000.
  *   *The Blur:* An EUT theorist says you buy insurance because the utility of \$100k is much higher than the utility of \$500 (concave utility). An REU theorist says you might buy it even if utility is linear, because you heavily weight the small probability of disaster (risk function).
  *   *Why it's borderline:* Without knowing the agent's utility curve for wealth, you cannot distinguish if they are avoiding the *loss of wealth* (utility) or the *gamble itself* (risk).

  **Case B: The "Life-Changing" Sum**
  *   *Scenario:* Gamble A: 100% chance of \$1 Million. Gamble B: 50% chance of \$0, 50% chance of \$2.1 Million.
  *   *The Blur:* Most people take A. Is it because \$2.1M isn't twice as good as \$1M (diminishing utility)? Or is it because the risk of ending with \$0 is unacceptable regardless of the utility (risk weight)?
  *   *The Test:* If the agent says "\$2.1M is exactly 2.1 times better than \$1M to me" (linear utility) but still picks A, they are definitively using the **third dial** (REU). If they say "\$2.1M feels only slightly better than \$1M," they are using standard utility curvature.

  ### Summary
  *   **Does the category exist?** Yes, but it requires stepping outside standard Expected Utility Theory.
  *   **What is the carving?** Separating **Risk Attitude** from **Utility Curvature**.
  *   **What is the name?** In formal theory: **Risk Function** (within Risk-Weighted Expected Utility). In plain English: **Global Risk Attitude**.
  *   **Is Sam irrational?** Only if you subscribe to the Independence Axiom. If you accept REU, Sam is rational but has a different risk profile than Alex.
  *   **The Edge:** It collapses into **Maximin** at the extreme end and is distinct from **Ambiguity Aversion** (unknown probs).

  You have effectively rediscovered the motivation for Rank-Dependent Utility theories. Your "spread-sensitivity" is a precise description of the **concavity of the risk-weighting function**.
