prompt: |-
  hey i need last minute help. tommorow im presenting my senior philosophy project to a small panel and i'm worried about the Q&A part.

  My thesis is this: when you're not sure which moral theory is true (utilitarianism vs. "don't use people as a means" style rules vs. more character/virtue stuff), you shouldn't just multiply your credence in each theory by how good the outcome looks on it and add it all up, like the expected-choiceworthiness people do. I say use what I call the spread rule instead: pick the option whose *ranking* is most stable across the theories you give more than, say, 10% credence to. So an option that comes out third-best no matter which theory is right beats one that's amazing on utilitarianism and dead last on everything else. I use it to argue that morally uncertain people should split their time and money across really different kinds of causes instead of doubling down on whatever looks best on their favorite theory.

  The room is: my school's Ethics Bowl team (they argue from cases and stakes and are basically intuitionists without calling it that), my AP Bio teacher who's really into effective altruism and wants everything turned into numbers, and the debate coach who only cares whether any of this changes what a normal person should actually do on Monday.

  Can you make me a prep sheet? The objections I'll really get from these people, in their own vocabulary, ordered by how much damage they'd do, each with a short comeback and a note on were my answer is soft. Plus the one question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a prep sheet for a senior philosophy project presentation Q&A.
      *   **Topic:** Moral Uncertainty. The user rejects "Expected Choice-Worthiness" (ECW) in favor of a "Spread Rule" (ranking stability across theories with >10% credence). This leads to diversification of causes (time/money) rather than maximizing based on the most likely theory.
      *   **Audience/Panel:**
          1.  *Ethics Bowl Team:* Case-based, intuitionist, focused on stakes/context.
          2.  *AP Bio Teacher:* Effective Altruist (EA), wants numbers/quantification.
          3.  *Debate Coach:* Pragmatist, cares about action-guidance for "normal people."
