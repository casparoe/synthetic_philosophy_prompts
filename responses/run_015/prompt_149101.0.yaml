answer: |-
  # 🛡️ Senior Project Q&A Prep Sheet: The Spread Rule

  **Goal:** Survive the Q&A without getting derailed.
  **Strategy:** Don't try to prove you're *right*; prove you've thought about why you might be *wrong*.
  **Panel Map:**
  *   **Bio Teacher (EA):** Wants numbers, magnitude, and outcomes.
  *   **Ethics Bowl:** Wants case application and intuitive plausibility.
  *   **Debate Coach:** Wants real-world actionability.

  ---

  ## 🚨 Top 3 Objections (Ordered by Damage Potential)

  ### 1. The "Apples to Oranges" Objection (Incommensurability)
  *   **Who asks:** Ethics Bowl Team (they live in the details of cases).
  *   **The Attack:** "How do you compare rankings across theories? Being '3rd best' in Utilitarianism (maybe it saves 50 lives) is totally different from being '3rd best' in Deontology (maybe it tells a small lie). There's no common scale. Your rule compares ranks, but ranks of *what*?"
  *   **Damage:** **Critical.** If you can't compare ranks across theories, the mechanism breaks.
  *   **Your Comeback:** "You're right that cardinal utility doesn't translate. That's *why* I use ordinal rankings. I'm not comparing the *value* of the outcome, just the *structural agreement* among theories. If three different maps all say 'this path is clear,' I take it, even if they measure distance differently."
  *   **⚠️ Soft Spot:** You don't have a mathematical proof for how to normalize ranks.
      *   *Pivot:* Admit it. "I'm treating theories as voters in an election. It's imperfect, but better than pretending we can convert 'duty' into 'utils' for the Expected Choice-Worthiness calculation."

  ### 2. The "Ignoring the Stakes" Objection (Magnitude)
  *   **Who asks:** AP Bio Teacher (Effective Altruist).
  *   **The Attack:** "Your rule ignores magnitude. If Utilitarianism (90% credence) says Option A saves 1,000,000 lives, and Deontology (10% credence) says Option A is slightly forbidden, ECW says save the million. Your Spread Rule might reject Option A because it ranks poorly on Deontology. Are you really saying we should let a million die to avoid a ranking fluctuation?"
  *   **Damage:** **High.** Makes you look like you prefer moral purity over actual good.
  *   **Your Comeback:** "Under deep moral uncertainty, magnitude estimates are often noise. We aren't sure *how* many lives are saved, or *if* utility is the right metric. The Spread Rule prioritizes robustness over optimization. I'd rather guarantee a 'good enough' outcome across all theories than gamble on a 'maximal' outcome that might be morally horrific on a minority theory."
  *   **⚠️ Soft Spot:** Extreme cases (existential risk).
      *   *Pivot:* "I'd add a 'catastrophe clause.' If one theory predicts literal extinction, magnitude overrides the Spread Rule. But for standard cause prioritization? Stability wins."

  ### 3. The "Monday Morning" Objection (Action Guidance)
  *   **Who asks:** Debate Coach.
  *   **The Attack:** "This is too heavy for a normal person. To use your rule, I need to know three moral theories, assign credences, rank options within each, and check the 10% threshold. That's harder than just 'do the most good.' Does this actually change behavior, or just give people an excuse to overthink?"
  *   **Damage:** **Medium.** Makes the project seem academic rather than useful.
  *   **Your Comeback:** "It's not for every choice (like buying coffee). It's for high-stakes portfolio decisions (career, donations). And actually, it *reduces* anxiety. You don't need to find the *perfect* answer. You just need to find the option that doesn't offend anyone too much. It licenses diversification, which is easier than finding the single optimal cause."
  *   **⚠️ Soft Spot:** Cognitive load is still high.
      *   *Pivot:* "It's a heuristic, not an algorithm. 'Don't put all your eggs in one moral basket' is the takeaway, not the math."

  ---

  ## 💣 The One Question You Hope Nobody Asks

  **"Why 10%?" (The Arbitrary Threshold Problem)**

  *   **Why it hurts:** If you say theories with <10% credence don't count, what about a theory at 9.9%? Why does it vanish? It exposes the "cliff-edge" problem in your rule. It looks like you pulled the number out of thin air.
  *   **If they ask it:** Do **not** bluff.
  *   **The Save:** "Honestly, 10% is a heuristic for 'plausible enough to take seriously.' You're right that there's a cliff-edge problem. A more sophisticated version would weight the ranking stability by the credence percentage. But for this project, I wanted to show that even a simple cutoff beats maximizing on a single theory."
  *   **Why this works:** It shows intellectual humility. You acknowledge the flaw without letting it sink the whole ship.

  ---

  ## 🧠 Last Minute Mindset Tips

  1.  **If you get stuck:** Pause. Take a sip of water. Say, "That's a really strong objection. I haven't fully solved that, but my initial thought is..."
  2.  **Play to the Room:**
      *   To the **Bio Teacher**: Use words like "robustness," "variance," and "portfolio theory."
      *   To the **Ethics Bowl**: Talk about "respecting pluralism" and "avoiding moral tyranny."
      *   To the **Debate Coach**: Talk about "reducing paralysis" and "actionable heuristics."
  3.  **Own the Uncertainty:** Your thesis is about *uncertainty*. If you don't know an answer, say: "Given the uncertainty inherent in the project, I'm currently leaning X, but I'm open to updating that." (It proves you live your thesis!)

  **You know the material. They just want to see you think. Good luck.**
