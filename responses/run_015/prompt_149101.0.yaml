          *   *Soft Spot:* Still vague.
      *   *Objection 2 (Magnitude/EA):* "You're ignoring the 1,000,000 lives vs 1 life."
          *   *Comeback:* Under deep uncertainty, magnitude estimates are noise. Stability is signal.
          *   *Soft Spot:* Hard to defend in extreme cases (Pascal's Mugging style).
      *   *Objection 3 (Pragmatism):* "Too hard for normal people."
          *   *Comeback:* It's a heuristic for donors/activists, not every grocery choice.
          *   *Soft Spot:* Still complex.

      *   *The "Hope Nobody Asks" Question:* The Arbitrary Threshold. Why 10%? Why not 5%? Why not 20%? This exposes the lack of foundational justification for the rule itself.

