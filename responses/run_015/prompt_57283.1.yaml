answer: |-
  ### Bottom line

  Adopt **The Principle of Causal Authorization**. An object commands aesthetic deference relative to its attribution only if its material history constitutes an unbroken chain of causation from the credited agent's creative act, permitting authorized maintenance but prohibiting fabricated genesis or discontinuous replacement. This principle distinguishes between *sustaining* a lineage (restoration, studio practice) and *simulating* one (forgery, AI generation). It grounds your intuition that history matters not because it changes the pixels, but because it validates the object's standing as a testament to specific human agency. You owe the object aesthetic attention proportional to the integrity of that testimony.

  ### Clauses and their motives

  **1. The Authorization Clause.** Creative agency can be delegated, but only explicitly. This saves Case 5 (studio canvas) where the master's supervision validates the assistants' hands, but condemns Case 9 (celebrity signature) where the signature implies personal execution without supervisory substance. The failure condition is misleading branding: if the signature claims a hand that was absent, the genealogy is broken.

  **2. The Continuity Clause.** Physical spatio-temporal continuity matters even when sensory properties do not. This explains Case 6 (chapel): gradual replacement preserves the causal chain of the object's existence, while burning and rebuilding severs it. It also supports Case 7 (instrument): the old wood carries the history of play, which matters even if the new copy sounds identical. The failure condition is total material substitution without temporal overlap.

  **3. The Subsidiarity Clause.** Intervention in an object is legitimate only if subordinate to the preservation of the original work's intent. This separates Case 3 (restoration) from Case 4 (AI). The restorer serves the Tiepolo; the AI serves the prompter. The failure condition is when the mimicry creates a rival claimant rather than sustaining the original.

  **4. The Epistemic Clause.** Knowledge of provenance alters aesthetic standing because it reveals the causal chain. This covers Case 1 (Van Meegeren) and Case 10 (mixed drawings). Once the chain is known to be fake or uncertain, the object loses its status as a testament to the master, diminishing the intensity of looking. The failure condition is willful ignorance; once known, the verdict must shift.

  ### Rival principles

  **1. The Transparency Account.** This view holds that if the viewer knows the true history, the aesthetic object is stable. It cleanly saves Case 2 (open pastiche) and Case 4 (AI), arguing that deception is the only sin.
  *Cost:* It wrecks Case 1 and Case 7. It cannot explain why the Van Meegeren looks *worse* once exposed, nor why you prefer the old instrument in a blind test once you know the history. It reduces aesthetics to mere sensory processing, ignoring the testimonial value of the object.

  **2. The Materialist Account.** This view argues that only physical properties constitute the work. It saves Case 7 (instrument sound) and Case 3 (restoration visibility).
  *Cost:* It wrecks Case 1, Case 6, and Case 8. It cannot distinguish the burned chapel from the original, nor explain why a forged Shakespeare is ruined while the text remains physically identical. It fails to capture why we value *origin* over *output* in autographic arts.

  **3. The Institutional Account.** This view claims value is determined by market and expert consensus. It saves Case 5 (studio canvas) and Case 9 (celebrity art), as both are accepted by the art world.
  *Cost:* It wrecks Case 1 and Case 10. It cannot explain why your personal admiration collapses in Case 1 despite the object's market history, nor why uncertainty in Case 10 diminishes value before the market adjusts. It conflates price with aesthetic worth, which your essay seeks to separate.

  ### The restorer and the generator

  Cases 3 and 4 are the crux. Both involve transparent style-mimicry. To separate them without special pleading, you must focus on **teleological direction**. The restorer's act is *backward-looking*: the goal is to recover the state intended by the original agent. The AI's act is *forward-looking*: the goal is to generate a new asset using style as a resource.

  If you concede no principle separates them, you must reverse your verdict on Case 4. You would have to admit the AI print is as legitimate as the restoration. This would predict that restoration practice is merely a subset of generation—that the restorer is just another generator filling gaps. This undermines the concept of "preservation." If restoration is generation, then every inpainted scratch is a new work, and the Tiepolo ceiling ceases to exist as a historical entity, becoming a collaborative palimpsest. To save the concept of conservation, you must maintain that the restorer acts as a proxy for the original agent, whereas the AI acts as an independent agent. The restorer effaces themselves; the AI asserts itself.

  ### Three cases you choose

  **1. The Culinary Clone.** A famous chef's signature dish is analyzed chemically and reproduced exactly by a factory using identical ingredients.
  *Verdict:* The factory meal is nutritionally identical but aesthetically inferior. The history of the chef's hand in the original preparation is part of the "dish" as an aesthetic event. The factory meal is a copy, not an instance of the work.

  **2. The Deleted Tweet.** A famous author's deleted tweet is recovered from a server cache and reposted by a fan account.
  *Verdict:* This is forgery of context. Even if the text is identical, the author's act of deletion was part of the work's history. Restoring it violates the causal chain of authorization. It is not the author's work anymore.

  **3. The Resurrected Pet.** A deceased dog is cloned using stored DNA. The clone looks and acts identically.
  *Verdict:* This is a different object (like the burned chapel). The causal chain of life was severed. The clone is a sibling, not a continuation. You owe the clone love, but not the specific grief or history owed to the original.

  ### What I have to give up

  Your principle cannot perfectly save **Case 8 (Haydn vs. Shakespeare)** without ad hoc adjustments. The Principle of Causal Authorization suggests both should be ruined upon exposure, as both are misattributed genealogies. To keep your verdict that the Haydn survives, you must concede that music is treated as more allographic than text in practice, despite both being notated. You must accept that performance culture tolerates attribution shifts in music more than theater.

  Secondly, you must loosen **Case 6 (Chapel)**. The line between "gradual replacement" and "rebuilding" is metaphysically vague. Your principle demands a binary (chain broken or not), but reality offers a spectrum. You must accept that identity is sometimes a matter of degree, not a strict verdict.

  If you stubbornly keep both 8 and 6, the residual tension is that your principle becomes inconsistent: sometimes history is fatal (Shakespeare), sometimes survivable (Haydn); sometimes continuity is physical (Chapel), sometimes functional. To resolve this, prioritize Case 1 and Case 3 as your core intuitions. Sacrifice the precision of Case 8 to medium-specific conventions, and accept the vagueness of Case 6 as a feature of material identity, not a bug in your theory.
