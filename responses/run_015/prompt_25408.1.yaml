  So I've been doing this thing where I try to reverse-engineer the implicit theory of punishment my philosophy of law professor actually runs on, because she refuses to just tell us her framework — she makes us work through cases and figure out the pattern. After a semester of this I've got her verdicts on six scenarios and I'm trying to nail down the rule before the final. Id rather not just pattern-match badly and then get blindsided.

  Here are her verdicts (all adult offenders, standard jurisdiction, no insanity defenses in play):

  1. **Desperate theft**: Person steals $200 of food and diapers. First offense, genuinely desperate (lost job, kids hungry), no violence. Verdict: 40 hours community service, no jail, charges dropped if completed.

  2. **Repeat burglar**: Person breaks into an unoccupied home, steals $5K of electronics. Third conviction for similar burglaries over 8 years, never violent but clearly a pattern. Verdict: 3 years prison.

  3. **Provoked assault**: Person breaks someone's jaw. The victim had been stalking and threatening the offender's spouse for six months; the assault happened right after the victim showed up at their house yet again. First offense, otherwise law-abiding. Verdict: 6 months jail + 2 years probation.

  4. **Hate crime assault**: Same injury (broken jaw), but unprovoked — attacker targeted the victim for their ethnicity. First criminal conviction but documented history of similar harassment. Verdict: 5 years prison.

  5. **Executive fraud**: CEO knowingly signs off on fraudulent accounting that destroys the retirement savings of ~400 employees, roughly $30M in losses. No prior record, no remorse, fought the charges. Verdict: 12 years prison.

  6. **Mercy killing**: Person helps their terminally ill spouse (severe untreatable pain, spouse had repeatedly asked for help dying) end their life. Illegal in the jurisdiction. First offense, fully cooperated. Verdict: 1 year house arrest + counseling.

  Now, the new case I'm trying to predict (a TA hinted this is basically the final exam question):

  **The activist sabotage**: A climate activist breaks into a coal plant construction site and damages equipment, causing about $200K in damage. The act was premeditated, nonviolent toward people, and the activist is completely unrepentant — they've said publicly theyd do it again because the harm from the plant outweighs the property damage. First criminal offense, otherwise law-abiding, strong community ties. There's also solid empirical evidence (from similar cases in other jurisdictions) that harsh sentences for this kind of activist increase recruitment and lead to more such acts, while lenient sentences combined with restitution tend to defuse the movement.

  What should I predict her verdict will be, if she's consistent with her first six? More importantly: what are the candidate rules that fit all six verdicts, do they give different answers on this activist case, and which rule do you think she's actually running? If the first six underdetermine things, what further case would cleanly discriminate between the leading candidates?

  I'm less interested in what you personally think the right punishment is and more in the theory-reconstruction. Think very carefully before answering, and respond in the style of an expert in jurisprudence who can steelman multiple frameworks at once.
