answer: |-
  Here is the specification you asked for. It is drafted as an annex to a request for proposals (RFP). It treats fairness not as a vibe, but as an engineering constraint.

  ### Part 1: The Four Concerns
  You asked which of your four recurring worries are load-bearing requirements and which are political prejudices. The short answer: **All four are load-bearing.** None of them are merely ideological; they are structural failure modes of statistical systems.

  1.  **No Leveling Down:** This is a requirement for **utility**. If a vendor equalizes error rates by adding random noise to the scores, they degrade the tool's usefulness for everyone to satisfy a statistic. A contract must forbid this.
  2.  **Subgroup Robustness:** This is a requirement for **generalization**. If a model is fair for "Black" and "White" but fails for "Black Women over 40," it is gamed by coarse categorization. This is not prejudice; it is a safeguard against Simpson's Paradox.
  3.  **Feedback Loops:** This is a requirement for **stability**. If denying a loan increases the risk of default, the model is self-fulfilling. Ignoring this renders any static audit obsolete within months.
  4.  **Burden vs. Benefit:** This is a requirement for **loss functions**. A false positive in a parole hearing (detaining someone safe) is morally distinct from a false positive in housing (giving a scarce apartment to someone less needy). The math must weight these errors differently.

  ### Part 2: The Procurement Spec
  **Subject:** Algorithmic Fairness and Utility Requirements
  **Context:** Allocation of Scarce Benefits (e.g., Reentry Program Slots)

  **Requirement 1: Monotonicity (Non-Negotiable)**
  *   **The Rule:** A higher score must always correspond to a higher probability of the target outcome (e.g., program success). The vendor may not add noise or degrade overall accuracy to satisfy group parity metrics.
  *   **The Case:** Prevents "leveling down." It ensures the tool actually predicts something useful rather than just satisfying a demographic quota.
  *   **Status:** Non-negotiable. If violated, the tool is broken.

  **Requirement 2: Capacity-Aware Allocation (Non-Negotiable)**
  *   **The Rule:** The vendor must optimize for the *marginal* candidate given the fixed number of slots, not just thresholding a risk score. The fairness metric must apply to the *list of selected individuals*, not just the scores.
  *   **The Case:** Distinguishes burden from benefit. In a scarce benefit scenario, the goal is maximizing total success within the cap, not minimizing risk across the whole population. A risk score alone is not a decision rule.
  *   **Status:** Non-negotiable. A score without a capacity-aware rule is incomplete.

  **Requirement 3: Multicalibration / Subgroup Robustness (Negotiable but Recommended)**
  *   **The Rule:** The model must be calibrated not just for the protected groups listed in the contract (e.g., Race, Sex), but for any subgroup that can be computationally identified post-hoc (e.g., Race × Age × Zip Code).
  *   **The Case:** Prevents vendors from hiding bias in the intersections. If the model says "30% risk" for a subgroup, roughly 30% of them must actually exhibit the outcome.
  *   **Status:** Negotiable. This is mathematically demanding. You may need to accept a "degradation schedule" (e.g., calibration must hold for subgroups larger than N people).

  **Requirement 4: Dynamic Impact Statement (Negotiable)**
  *   **The Rule:** The vendor must provide a simulation of how the model's decisions will alter the base rates of the target population over a defined period (e.g., 24 months).
  *   **The Case:** Addresses feedback loops. If the tool denies enough people in one neighborhood to destabilize it, the vendor is liable for the drift.
  *   **Status:** Negotiable. This requires causal modeling which is often speculative. It is better to require a "re-calibration clause" triggered by base-rate drift.

  ### Part 3: The Impossibility Clause
  **Warning:** The following sets of requirements cannot be jointly satisfied if the base rates of the outcome differ between groups (which they almost always do).

  1.  **Calibration + Error Rate Parity:** You cannot have the scores mean the same thing across groups (calibration) AND have the false positive/negative rates match (error parity) unless the model is perfect or the groups have identical base rates.
  2.  **Subgroup Robustness + Group Parity:** If you require the model to be calibrated for every possible subgroup (Requirement 3), you generally cannot satisfy equal selection rates across the broad groups named in the contract.
  3.  **Capacity Optimization + Selection Parity:** If you have 10 slots and Group A has a higher base rate of success than Group B, filling the slots to maximize total program success (Requirement 2) will mathematically violate equal selection rates between Group A and Group B.

  **Procurement Note:** The contracting agency must explicitly prioritize which of these conflicts yields. You cannot demand "Maximum Efficiency" and "Demographic Parity" simultaneously. One must be the objective; the other must be a constraint.

  ### Part 4: How the Usual Families Fail
  Here is how the standard vendor claims stack up against this spec:

  *   **Error-Rate Parity (Equalized Odds):** Fails **Requirement 1 (Monotonicity)**. To achieve this when base rates differ, vendors often distort the score mapping, effectively leveling down accuracy. It also fails **Requirement 2 (Capacity)** because it treats errors symmetrically regardless of the scarcity of the benefit.
  *   **Calibration-Within-Group:** Fails **Requirement 3 (Subgroup Robustness)**. It is trivially satisfied by broad grouping. A model can be perfectly calibrated for "White" and "Black" populations while being wildly miscalibrated for "White Men" vs. "White Women." It gives a false sense of validity.
  *   **Causal/Counterfactual Approaches:** Theoretically satisfies **Requirement 4 (Feedback)**, but fails **Auditability**. You cannot verify counterfactuals (what would have happened if we acted differently) with observational data. It is philosophically sound but contractually unenforceable.

  ### Part 5: The Killer Requirement
  The single requirement that knocks out the most of what vendors actually sell is **Requirement 3: Subgroup Robustness (Multicalibration).**

  Vendors sell "fairness" by demonstrating parity on two or three broad demographic axes. They rely on the fact that you won't look deeper. If your contract requires the model to be calibrated for *any* subgroup that an auditor can define three years later, you are effectively demanding that the model be perfectly accurate for every individual. Since perfect prediction is impossible, this requirement exposes the claim that the system is "fair" as a claim that the system is "omniscient." It forces the vendor to admit that their fairness is conditional on your ignorance of the data's complexity. That is the hole in the sales pitch.
