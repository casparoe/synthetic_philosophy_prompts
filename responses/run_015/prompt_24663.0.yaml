  **The dependence chain**

  In the Prisoner's Dilemma, defection is a dominant strategy, yielding a higher payoff regardless of the opponent's choice. You need not model their mind to know what to do. The Centipede Game is fundamentally different. Here, no move is inherently superior; optimality is contingent on expectations. To decide whether to pass the pot at the first node, Player 1 must predict Player 2's move at the second node. But Player 2's move depends on their prediction of Player 1's move at the third node. This creates a recursive chain of beliefs. Backward induction solves this by anchoring the end: assuming rationality holds at the final node, the last player takes. This belief propagates backward, forcing each preceding player to anticipate a takeover and thus take themselves. Unlike the robust independence of a dominant strategy, every link in this chain relies on a specific belief about the other's future rationality. If that belief shifts, the optimal move shifts. Consequently, immediate defection isn't a standalone truth but the output of a specific chain of mutual knowledge. It requires not just that I am rational, but that I know you are rational, and that you know that I know, ad infinitum.

  **Why the prediction is fragile**

  Because the backward-induction solution relies on a perfect chain of mutual certainty, it is exquisitely sensitive to disruption. In a dominant-strategy equilibrium, a slight doubt about the opponent's rationality doesn't change your move; defection remains best. In the Centipede Game, however, introducing even a tiny probability that your opponent might act irrationally—say, they are altruistic or simply confused—can unravel the logic. If Player 1 believes there is a non-zero chance Player 2 will pass at the next node, passing becomes a calculated gamble with a higher expected value than taking immediately. This insight, formalized by Kreps, Milgrom, Roberts, and Wilson, shows that rational players might mimic irrationality to build a reputation for cooperation. Furthermore, the solution is sensitive to payoff structures. Slightly altering the rewards at the final nodes can disrupt the clean incentive to take at the end, breaking the chain before it reaches the start. Thus, the stark prediction of immediate defection exists only in a vacuum of perfect common knowledge. In the real world, where rationality is uncertain and payoffs are subjective, the logic collapses. The conclusion is not robust to noise; it is a house of cards that falls if any single link in the belief chain is weakened by doubt or structural ambiguity. Unlike the Prisoner's Dilemma, the Centipede solution vanishes when perfect rationality is relaxed.

  **Entailment or procedure?**

  This fragility forces a reevaluation of what backward induction represents. It is often presented as a logical entailment of rationality itself—that any rational agent *must* defect immediately. However, the dependence on precise beliefs suggests it is better understood as a reasoning procedure whose validity is conditional on its inputs. If the input beliefs (common knowledge of rationality) are not met, the output (immediate defection) is not mandated by rationality. Instead, rationality might dictate cooperation if the beliefs warrant it. Therefore, backward induction is not a universal law of strategic behavior but a specific solution concept applicable only under idealized epistemic conditions. Recognizing this distinction prevents us from labeling cooperative players as irrational. They may simply operate under different, realistic belief structures. The lesson is that rationality is not just about calculating moves; it is about modeling minds. When the model of the mind changes, the rational move changes with it.
