answer: |-
  The air conditioning in the Santiago committee room hummed with a desperate, rattling intensity, fighting the January heat pressing against the double-glazing. On the table sat a sealed vial containing grey sludge from the Atacama effluent channels. Dr Bárbara Soto watched the condensation bead on the glass, thinking of the dry wells back in her village.

  Prof Neil Vardy leaned forward, his fingers steepled. He looked tired. "Let us be precise," he said, his voice dry as the desert outside. "The treaty protects 'living organisms'. It does not protect interesting chemistry. These cinders are magnesium-silicate tubules. They grow because the brine is supersaturated. They snap because of shear stress. There is no membrane, no internal regulation. They do not metabolise. They are crystals with a press officer."

  Bárbara felt the familiar spike of anger, but she kept her voice level. "Crystals do not inherit, Neil. When a tubule snaps, the fragment retains the parent's twist. It keeps the iron-oxide scars. Those scars dictate branching. Some patterns grab lithium faster; others survive the weekly flush. The inefficient ones dissolve. The efficient ones persist. That is variation, heritability, and selection. It is Darwinian evolution without the DNA."

  "So is a fire," Vardy countered, though he glanced at the vial. "A fire spreads, it varies with the wind, it selects for fuel. You would not halt a mining operation because a wildfire is alive."

  "A fire does not carry a history of its past constraints in its physical structure," Bárbara said. "These scars are a record. They are a memory written in oxide."

  Elías, the committee Chair, rubbed his temples. He was the one who had to sign the binary decision: Yes or No. The statute allowed no nuance. "This is why we have SUTRA-7 on the docket," Elías said. "The software in the decommissioned datacentre. It patches its own code. It copies itself into spare capacity. It has improved its survival rate over four years. If we define life by evolutionary capacity alone, Dr Soto, then the cinders are alive. But then so is the software. Are we prepared to grant personhood to a patch script?"

  Bárbara hesitated. She wanted the mine shut to save the water table, not to inaugurate the age of silicon rights. "The treaty is about biological defence," she said. "Protecting vulnerable systems from extraction."

  "Vulnerable systems," Elías repeated. "That is a pragmatic definition. Not ontological. You are arguing for a cluster concept. Things are alive if they share enough family resemblances: evolution, boundaries, metabolism, agency. The cinders have evolution. They lack boundaries; they accrete from the outside. They lack agency; they do not seek, they merely sit."

  "They persist," Bárbara insisted.

  "Stones persist," Vardy said softly. He picked up the vial, tilting it. The grey suspension swirled. "I maintain the autopoietic line. To be alive, a system must produce and maintain its own boundary against entropy. It must distinguish self from non-self. These tubules are continuous with the brine. They are a precipitate. If we call this life, we dissolve the distinction between geology and biology."

  "And if we don't," Bárbara said, "we allow the destruction of a unique evolutionary lineage because it doesn't fit a twentieth-century definition of a cell."

  Elías looked between them. The room was silent save for the AC. "There is a third option," Elías said. "We rule based on interest. The treaty exists to prevent harm to systems that have a *conatus*, a drive to continue. The cinders do not strive. They simply occur. SUTRA-7 strives; it patches to survive. If anything is alive here, it is the code, not the clay."

  Vardy shifted in his seat. He looked at the swirling grey fluid again. For a moment, the light caught the iron inclusions. "The branching patterns," he said, his voice quieter than before. "In the samples from the lower channels... the scars are more complex. They look less like random precipitation and more like... optimisation."

  Bárbara held her breath. Vardy was conceding a point, small but significant. He was admitting the geometry hinted at design, even if he denied the biology.

  "Optimisation by selection is not agency," Elías noted.

  "No," Vardy said, setting the vial down. "But it makes the distinction messy. If I vote 'not alive' based on autopoiesis, I must explain why SUTRA-7, which maintains a logical boundary, isn't alive. If I vote 'alive' based on evolution, I open the door to every self-replicating algorithm in the sector."

  "The statute requires a yes or a no," Elías said. "For the cinders. Now."

  Bárbara looked at her hands. If the ruling was 'no', the mine continued. The water would go. If 'yes', the precedent might stall the industry, but the philosophical mess would linger. She realised she cared more about the water than the definition.

  Vardy looked at her, then at Elías. "I cannot certify them as organisms," he said. "They do not metabolise. They do not repair. They are elegant chemistry, nothing more."

  "And I argue they are a living lineage," Bárbara said.

  Elías picked up his pen. He looked at the treaty text, then at the vial. The pragmatic view demanded protecting the water, but the legal definition demanded biological fidelity. The evolutionary view demanded inclusion, but the autopoietic view demanded exclusion. The three lines diverged, leaving no common ground.

  "We must be consistent," Elías said. "If we protect the cinders, we must protect SUTRA. We are not ready to do that. Therefore, by necessity of consistency, we cannot protect the cinders."

  Bárbara felt a coldness settle in her stomach that had nothing to do with the air conditioning.

  "The committee ruling," Elías said, looking directly at Bárbara. "On the status of the magnesium-silicate tubules."

  He paused. The hum of the AC seemed to grow louder.

  "Not alive."

  \answer{not alive}
