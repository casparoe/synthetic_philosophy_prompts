      *   (3) *Narrative & Discontinuous Collapse:* Art-historical context matters. Undetected forgeries hold value until discovered, then value collapses *discontinuously*.
      *   (4) *Causal Inheritance (Digital/Replica):* High-fidelity replicas of destroyed works (via scanning) have *derivative but genuine* artistic value (not just documentary).
      *   (5) *Anti-Intentionalism:* Artist's mental states aren't necessary/sufficient. Unintended features/receptions matter.
      *   (6) *The Wrong of Forgery:* It's primarily deceptive (epistemic), not economic or property-based.

  3.  **Evaluate Tensions (Pairwise & Systemic):**

      *   **Tension A: (1) vs. (2)**
          *   (1) says authenticity is *constitutive* of value (non-instrumental).
          *   (2) says perceptual identity = identical aesthetic value *in the moment*.
          *   *Conflict:* If authenticity is constitutive of the work's value (1), then a forgery (lacking authenticity) should lack that value *even if* it looks the same. (2) suggests the aesthetic value is the same *in perception*, pushing the difference to "non-perceptual/post-hoc."
          *   *Severity:* **High.** This is the core Goodman/Wollheim debate. If authenticity is non-instrumentally valuable (1), it contributes to the value *now*. If (2) says value is identical *now* (in perception), (1) is undermined unless "value" is split into "aesthetic" vs. "overall." (2) specifies "aesthetic value," (1) says "value of an original artwork." If aesthetic value is a subset of overall value, they might coexist, but (1) implies the causal link *makes* it art/valuable.
          *   *Resolution:* Distinguish "Aesthetic Value" (perceptual) from "Artistic/Historical Value" (causal). (1) likely refers to the latter. If so, compatible. But (1) says "value... is partly constituted by," which is broad.

      *   **Tension B: (3) vs. (2)**
