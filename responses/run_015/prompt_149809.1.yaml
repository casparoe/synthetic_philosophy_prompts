          *   (5) rejects *strong intentionalism* (mental states not necessary).
          *   *Conflict:* Does causal inheritance rely on the artist's *intention*? (4) relies on the *physical object's history*, not necessarily the mind. (5) rejects mental states.
          *   *Severity:* **Low.** Causal history (physical chain) $\neq$ Intentionalism (mental states). You can value the physical trace of the artist's hand (1 & 4) without caring about what they *meant* (5). This is a "Genetic Fallacy" vs. "Authenticity" distinction.
          *   *Resolution:* Distinguish *Causal Provenance* from *Intentional Content*. (4) is about physical lineage; (5) is about hermeneutics. Compatible.

      *   **Tension D: (6) vs. (2)**
          *   (6) says the wrong is deception about causal history.
          *   (2) says aesthetic value is identical if indistinguishable.
          *   *Conflict:* If I get the same aesthetic experience (2), and the only wrong is lying about history (6), what is the *harm*? If authenticity is non-instrumentally valuable (1), then I *lost* something by being deceived. If (2) says I gained the same aesthetic value, the deception deprived me of the *truth*, but did it deprive me of *value*?
