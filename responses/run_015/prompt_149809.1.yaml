          *   *Resolution:* The "Wrong" is denying the viewer the *knowledge* that enables the full appreciation of the causal history (which is part of the value per (1)). But (2) says perception fixes aesthetic value. This suggests a split between "Aesthetic" (2) and "Artistic/Authentic" (1).

