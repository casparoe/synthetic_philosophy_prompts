  # Handout: The Uncertain Evidence Flowchart

  **Scenario:** On Monday your credence that the specimen is Species A is 0.3. By Tuesday it is 0.7. Nothing you have become certain of explains the change. You must now decide your credence in a further hypothesis $H$.

  **Instructions:** Start at the top. Answer the question that best describes your situation. Follow the arrow to the next question or to a final updating rule.

  ***

  **1. Did something happen to you (a perception, a message), or did you just check your math and find a mistake?**
  *   **Just a mistake:** → **CORRECTION**
      *   *Worst case:* Dismissing genuine perceptual shifts as arithmetic errors.
  *   **Something happened:** → Go to 2.

  **2. Is there *any* description of what happened that you are now 100% sure is true?**
  *(e.g., "I saw a flash," or "The device beeped," even if you aren't sure what it means)*
  *   **Yes:** → **STANDARD CONDITIONALIZATION**
      *   *Worst case:* Forcing certainty onto experiences that are inherently fuzzy (The "Myth of the Given").
  *   **No:** → Go to 3.

  **3. Do you still represent your beliefs as single numbers?**
  *   **No (I use ranks/ordering):** → **RANKING THEORY**
      *   *Worst case:* Loss of fine-grained distinction needed for precise decision-making.
  *   **Yes:** → Go to 4.

  **4. Is your new belief state a single list of probabilities, or a range of possible lists?**
  *   **A Range (Set):** → **IMPRECISE PROBABILITIES**
      *   *Worst case:* Decision paralysis when the range of probabilities is too wide to act on.
  *   **A Single List:** → Go to 5.

  **5. Does this evidence tell you *only* about the bird, or also about the conditions (fog, time, light)?**
  *   **Also Conditions:** → **HOLISTIC RE-EVALUATION**
      *   *Worst case:* No clear rule for how to change, making the process opaque and hard to teach.
  *   **Only the Bird:** → Go to 6.

  **6. Does this change leave your opinions on *other* matters (given the bird) exactly untouched?**
  *   **No (They shift too):** → **GENERAL REVISION** *(Unnamed)*
      *   *Worst case:* Unconstrained change allows any belief to follow any evidence.
  *   **Yes (They stay fixed):** → Go to 7.

  **7. Did you receive a specific new probability for the bird, or just a constraint (e.g., "make it higher")?**
  *   **A Constraint:** → **MINIMUM CROSS-ENTROPY (MEP)**
      *   *Worst case:* Arbitrarily privileging the "closest" distribution without independent justification.
  *   **A Specific Number:** → Go to 8.

  **8. If you knew yesterday you'd feel this way today, could you have bet on it without losing money?**
  *   **No (Exploitable):** → **AD-HOC SHIFT** *(Incoherent)*
      *   *Worst case:* Guaranteed loss in betting scenarios (Dutch Book).
  *   **Yes (Safe):** → **JEFFREY CONDITIONING**
      *   *Worst case:* Fails when evidence is not independent of other hypotheses (violates Question 6).

  ***

  # Commit: Structure and Logical Space

  ### Node Ordering and Justification
  The tree is structured as a filtration chain. Each node peels off a major family of positions, moving from the most general metaphysical questions to the most technical coherence constraints.

  1.  **Trigger (Distinction 1):** Placed first because if the shift is merely error correction, no epistemic updating rule applies. This separates *updating* from *revision*.
  2.  **Certainty (Distinction 2):** Placed second to isolate **Standard Conditionalization**. If the agent is certain of *some* proposition (even an experiential one), the problem dissolves into ordinary Bayes. This is the limiting case of all other rules.
  3.  **Representation (Distinction 5, part 1):** Placed early to filter out non-probabilistic approaches (**Ranking Theory**). If the agent abandons numbers, the subsequent questions about probability constraints are moot.
  4.  **Precision (Distinction 5, part 2 / Replacement for 6):** I have split Distinction 5 ("Method") into two nodes (3 and 4) to distinguish **Ranking Theory** from **Imprecise Probabilities**. I replaced Distinction 6 (Commutativity) with this split. *Justification:* Commutativity is a technical property of a rule, whereas Precision is a fundamental choice about the representational state. Distinguishing Sets from Single Numbers is more foundational for a student handout than checking for order-independence.
  5.  **Entanglement (Distinction 8):** Placed here to separate cases where the evidence is isolated from cases where it is correlated with background conditions. This is the primary reason **Rigidity** (Node 6) fails.
  6.  **Rigidity (Distinction 3):** Placed after Entanglement because Entanglement is often the *cause* of Rigidity failure. This node isolates **Jeffrey Conditioning** (which requires rigidity) from **General Revision**.
  7.  **Input Type (Distinction 4):** Distinguishes between fixing a specific probability (Jeffrey) and fixing a constraint like a mean or variance (**MEP**). Both minimize distance, but the input differs.
  8.  **Diachronic Coherence (Distinction 7):** Placed last as a final sanity check. Even if a rule fits the structural constraints, it must be diachronically coherent to be rational. This separates rational **Jeffrey Conditioning** from irrational **Ad-hoc Shifts**.

  ### Unoccupied Combinations
  Because this is a filtration chain (8 nodes, 9 leaves), most logical combinations of answers are pruned. Below are the significant "empty" regions of the logical space:

  *   **Certain + Imprecise:** (Path: Q2 Yes → Q4 Set). *Status: Unexplored.* One can condition on a certain event using imprecise probabilities, but this handout routes certain evidence to Standard Conditionalization for simplicity.
  *   **Entangled + Rigid:** (Path: Q5 Yes → Q6 Yes). *Status: Incoherent.* If evidence is entangled with background conditions (e.g., fog), keeping conditional beliefs fixed (Rigidity) typically yields incorrect results.
  *   **Constraint + Rigid + Diachronically Incoherent:** (Path: Q7 Constraint → Q8 No). *Status: Unattractive.* This would be an Ad-hoc MEP shift. It is theoretically possible but normatively defective.
  *   **Specific Number + Non-Rigid:** (Path: Q6 No → Q7 Specific). *Status: Unexplored.* One could receive a specific number but allow conditional beliefs to shift. This is rarely formalized as a distinct rule.

  ### Uncertain Placement
  I am genuinely unsure about the placement of **Node 5 (Entanglement)** relative to **Node 6 (Rigidity)**.
  *Reasoning:* Entanglement is a feature of the *evidence*, while Rigidity is a feature of the *updating policy*. An agent could theoretically *choose* to enforce Rigidity even when evidence is entangled (leading to error), or they might fail Rigidity *because* of entanglement. I placed Entanglement first because it descriptively explains why Rigidity often fails, but normatively, Rigidity is the stricter constraint that defines the Jeffrey rule.

  ### Indistinguishable Leaves
  **Holistic Re-evaluation** and **General Revision** are difficult to separate in practice.
  *Reasoning:* Both occupy the space where Rigidity fails. The tree distinguishes them by whether the agent *identifies* the entanglement (Holistic) or simply observes the ripple effect (General). In many real-world cases, these two leaves describe the same cognitive process under different descriptions.
