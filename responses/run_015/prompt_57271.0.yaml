      *   **Thesis:** RP is a measurement discipline. Utility claims are parameters in best-fitting models *after* choices pass an invariance filter (frame, ordering, etc.). Preference construction is calibration, not refutation.
      *   **Argument Outline:** 1. Utility must be contestable by evidence (public justification). 2. Only publicly checkable evidence is choice under cost. 3. Choice under cost requires elicitation conditions (content exhausted by measurement procedure). 4. Admissibility conditions are constitutive of utility.
