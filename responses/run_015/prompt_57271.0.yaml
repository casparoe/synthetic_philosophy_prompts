      *Drafting content:*
      Bottom Line: The most dangerous objection is the philosopher's charge that the invariance filter is circularly defined, threatening to render utility constitutive rather than discovered. The chapter survives only if I concede the filter is a pragmatic convention rather than a metaphysical truth.

      1. The Constitutive Circularity
      (a) Philosopher of Economics: "If admissibility conditions are constitutive of utility, you cannot validate the filter without presupposing the utility concept it defines; isn't this measurement without a metric?"
      (b) Reply: The filter is not validated by correspondence to a hidden state but by coherence across a community of measurers. Like standardizing a meter bar, we fix the convention to enable communication, not to match nature. Utility is the coordinate system, not the terrain.
      (c) Soft spot: They will ask why *this* convention rather than another, exposing the arbitrariness.

      2. The Regulatory Vacuum
      (a) Welfare Economists: "If we discard volatile choices as below resolution, we lose the data density required for regulatory impact analysis; are you suggesting we stop valuing statistically noisy populations?"
      (b) Reply: No, we stop valuing *noise* as signal. Regulatory valuation currently averages contradictions; my view demands reporting resolution limits. If data is too volatile for a parameter, the policy should reflect uncertainty, not false precision.
      (c) Soft spot: They will press for a specific threshold where uncertainty becomes paralysis.

      3. The Filter Bias
      (a) Experimentalists: "Your invariance filter is just another framing device; choosing which perturbations count as 'noise' versus 'signal' is itself a context-dependent choice subject to reversal."
      (b) Reply: Correct, the filter selection is empirical, not axiomatic. We test the filter itself for stability across labs. But once fixed for a study, it defines the object measured, distinguishing measurement error from preference construction.
      (c) Soft spot: They will demand evidence that the filter itself is invariant, which may not exist.

      4. The Exclusion Problem
      (a) Law Professor: "If utility is what survives the filter, whose preferences survive? Vulnerable populations often exhibit higher choice volatility; does your measurement discipline systematically exclude them from counting?"
      (b) Reply: It excludes unstable *attributions*, not people. If a group's choices are context-sensitive, policy must protect them from exploitation rather than pretending stable values exist. Counting them requires acknowledging their vulnerability, not fabricating stability.
      (c) Soft spot: They will argue that excluding unstable values leaves them unprotected in cost-benefit calculations.

      Concession and Refusal
      Concession: Admit in the opening that the invariance filter is a pragmatic convention established by consensus, not a discovery of natural kinds. This removes the charge of circularity by accepting the constructivist label.
      Refusal: Refuse to concede that introspective testimony can substitute for choice data in public justification. Holding this line is worth more than winning it because without agent-neutral evidence, welfare claims collapse into conflicting assertions of feeling.

      The Dreaded Question
      Question: "If no choices survive the filter for a given agent, do they cease to have welfare interests entirely?"
      Why: The argument defines utility by survival; if nothing survives, the theory offers no guidance for protecting those agents, leaving a normative void.

