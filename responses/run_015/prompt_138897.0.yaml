answer: |-
  This is a remarkably precise pedagogical challenge. You are asking your students to hold a metaphysical distinction (constitutive vs. recognitive) against a text that seems designed to frustrate metaphysical comfort. *Never Let Me Go* is indeed the ideal test case for the boycott problem because it dramatizes the gap between *being* a person (in the thick of relations) and *counting* as a person (in the eyes of the law/community).

  Here is a reading structured for your seminar, designed to be circulated after the screening. It treats the philosophical distinction and the literary text as mutually interrogating, marks the points of failure, and isolates the specific contribution the novel makes to the philosophical debate.

  ***

  ### Seminar Reading: The Boycott Problem in *Never Let Me Go*

  **1. The Experiment: Hailsham as a Relational Bubble**
  If we apply the **constitutive reading** of relational personhood to *Never Let Me Go*, the students are unequivocally persons. They are woven into a dense network of care, rivalry, loyalty, and shared memory. From the trading sessions at Hailsham to the "caring" duties Kathy performs later, their identity is entirely relational. They become who they are through their interactions. On this view, the outside world's refusal to acknowledge them is a moral failure of the *outside*, but it does not metaphysically diminish the clones. Their relations among themselves do the work.

  However, the **recognitive reading** faces the boycott problem head-on. If personhood is a status conferred by the dominant community, the clones are, functionally, non-persons. They are "organ donors," not citizens. The horror of the novel is that the recognitive reading describes the *reality* of their lives, even if it offends our moral intuition. The outside world does not just ignore them; it actively structures society to ensure they cannot enter the web of recognition.

  **2. The Gallery: Intrinsic Properties vs. Relational Standing**
  You noted that the Gallery scene might betray the novel's allegiance to an intrinsic-property view. This is a crucial tension. Madame collects the art to prove the students have "souls."
  *   **The Philosophical Conflict:** A strict relationalist should find Madame's project category-confused. If personhood is constituted by relations, why look for evidence inside the individual (art/soul)? The art should matter only insofar as it facilitates relation.
  *   **The Textual Reality:** Madame and Miss Emily believe the art proves an *intrinsic* humanity that warrants moral consideration. They are trying to bridge the boycott by appealing to the very intrinsic properties (creativity, inner life) that relationalism seeks to bypass.
  *   **The Verdict:** The novel suggests that in a hostile political climate, the constitutive view is politically impotent. The clones' internal relations (their love, their art) do not stop the donations. To break the boycott, the guardians try to pivot to an intrinsic argument ("look inside them"), and they fail. This suggests a grim lesson: without recognition, constitution is invisible.

  **3. The Deferral Rumour: The Limits of Internal Relations**
  The rumour that couples in love can defer donations is the perfect test of the constitutive view. Kathy and Tommy operate as intuitive relationalists: they believe the quality of their bond *should* alter their standing. They assume that if they can demonstrate a "true" relation, the community must acknowledge it.
  *   **The Failure:** Miss Emily reveals the rumour was false. Hailsham never intended to grant deferrals.
  *   **The Cost:** This shatters the hope that internal relational density can compel external recognition. It confirms the boycott: the dominant group reserves the right to define which relations count. The clones' love is real (constitutive), but it carries no currency in the economy of personhood (recognitive).

  **4. The Dark Side: Docility as the Price of Incorporation**
  Your suspicion is correct: the novel supports the view that incorporation is a technology of subjection. Hailsham is "humane" precisely because it incorporates the students into a mini-community.
  *   **The Mechanism:** By giving the students a culture (art, guardians, rumours), Hailsham gives them a stake in their own containment. If they were treated purely as livestock (no relations, no culture), rebellion might be more likely. Instead, they are taught to value their "completeness" as donors.
  *   **The Philosophical Cost:** This is the shadow of the communitarian view. If personhood is acquired by being woven into a community, then the community holds the power to define the terms of that weaving. Hailsham weaves them into a community of *donors*. To accept their personhood within Hailsham is to accept their fate.
  *   **Conclusion:** The novel suggests that a "humane" boycott is more effective than a brutal one. The constitutive relations at Hailsham do not liberate the students; they reconcile them to their destruction. This validates your worry: a view that makes personhood hostage to the community fails the victims by letting the community dictate the terms of their existence.

  **5. Where the Reading Breaks Down**
  We must be honest about where *Never Let Me Go* resists the relational framework.
  *   **The Appeal to Suffering:** The novel's moral force often relies on the clones' capacity to suffer and feel loss, which is an intrinsic property, not a relational one. When Kathy watches Tommy rage against the fence at Norfolk, our empathy is triggered by his pain, not his social standing. A strict relationalist might argue his pain only matters because we (the readers) relate to it, but the text presents the pain as inherently significant.
  *   **The "Human" Essence:** Miss Emily speaks of giving the clones "childhoods" to prove they were human. This language leans toward a species-essentialism or a Lockean psychological continuity view that relationalism explicitly rejects. If you press the relational reading too hard, you have to ignore the text's own reliance on "soul" talk.
  *   **Kathy's Narration:** You mentioned Kathy addresses the reader. This is the one place recognition succeeds. But this is a meta-fictional trick. It solves the boycott problem by appealing to *our* community (the readers), not the community *in* the book. It saves the moral point but concedes the political one: within the world of the novel, the boycott holds.

  **6. What the Novel Settles (or Reframes)**
  If you defend this reading to colleagues, here is the claim: *Never Let Me Go* does not solve the metaphysical debate between constitutive and recognitive personhood, but it exposes the **political violence** hidden in the abstract distinction.
  *   **The Temporal Cost:** Philosophical literature often discusses personhood as a static status. The novel shows personhood as a *duration*. The boycott isn't just a denial of status; it is a theft of time. The relational web is cut short by "completion."
  *   **The Reader's Complicity:** By making Kathy's narration intimate and confiding, Ishiguro forces the reader into the role of the recognitive community. We are the ones withholding recognition in the real world. The novel shifts the burden from "What are they?" to "Why won't you see them?"
  *   **The Failure of Humane Exclusion:** The literature on Ubuntu often emphasizes the positive, life-giving aspect of community. *Never Let Me Go* serves as a cautionary counter-text: a community can be relationally rich and morally monstrous simultaneously. It demonstrates that without a mechanism to translate internal constitution into external recognition, relational personhood can become a cage.

  **Discussion Question for Students:**
  If Kathy's narration succeeds in making *us* recognize her personhood, does that validate the recognitive reading (we conferred it) or the constitutive reading (we finally saw what was already there)? And if the latter, why did it take a work of fiction to make us see it?
