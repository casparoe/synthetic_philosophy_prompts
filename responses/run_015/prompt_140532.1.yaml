answer: |-
  # The Panpsychism Sorter: A Flowchart for the Combination Problem

  **Instructions for the Moderator:**
  Read the **Entry Node** aloud. Ask for a show of hands for each option. Move the group down the corresponding branch. When you reach a **Leaf**, read the three sentences aloud. If the group splits on a node, divide into small groups to discuss that specific case before reconvening.

  ---

  ## The Flowchart

  ### Node 1 (Entry): The Substitute
  *We replace your neurons one by one with perfect functional silicon copies. At the end, is there still someone home inside the silicon head?*
  *   **A. No, the light goes out.** → Go to **Leaf 1**.
  *   **B. Yes, but "someone home" is an illusion.** → Go to **Leaf 2**.
  *   **C. Yes, there is a real subject.** → Go to **Node 2**.

  ### Node 2: The Micro-Question
  *In that silicon head, do the individual electrons and transistors have their own tiny, simple experiences, or only the whole head?*
  *   **A. Only the whole head.** → Go to **Leaf 3**.
  *   **B. The parts have experiences too.** → Go to **Node 3**.
  *   **C. The parts have "pre-experience" potentials, not full experience.** → Go to **Node 4**.

  ### Node 3: The Chorus
  *A million minimal experiential systems are wired in a chain, each receiving only the output of its predecessor, with nothing integrating the whole. Is there one unified subject experiencing the chain?*
  *   **A. No, there are a million tiny subjects, no big one.** → Go to **Leaf 4**.
  *   **B. Yes, physical connection forces unity.** → Go to **Node 5**.
  *   **C. Yes, but only if a non-physical relation binds them.** → Go to **Node 6**.

  ### Node 4: The Proto-Question
  *If the parts only have "pre-experience" potentials, does the whole head have real experience?*
  *   **A. No, nothing ever becomes truly conscious.** → Go to **Leaf 5**.
  *   **B. Yes, real experience emerges from the potentials.** → Go to **Leaf 6**.
  *   **C. Yes, the potentials just are experience in a different form.** → Go to **Node 7**.

  ### Node 5: The Bonding Lens
  *I point a device at two subjects that fuses their experiences into one, changing nothing physical at all. Is this possible?*
  *   **A. No, combination is fixed by physical structure alone.** → Go to **Leaf 7**.
  *   **B. Yes, combination is an extra relation laid on top of physics.** → Go to **Leaf 8**.
  *   **C. No, because subjects cannot be fused, only replaced.** → Go to **Leaf 9**.

  ### Node 6: The Merge
  *Two people's cortices are surgically cross-wired, a little more each week. Do they become one subject?*
  *   **A. Yes, two streams merge into one.** → Go to **Leaf 10**.
  *   **B. No, they remain two subjects sharing data.** → Go to **Leaf 11**.
  *   **C. It depends on whether the Cosmos allows it.** → Go to **Node 8**.

  ### Node 7: The Fade
  *A living brain's long-range connectivity degrades by 1% per day. Does the subject vanish suddenly or fade gradually?*
  *   **A. Fades gradually as connections break.** → Go to **Leaf 12**.
  *   **B. Vanishes suddenly at a threshold.** → Go to **Leaf 13**.
  *   **C. Never vanishes, just gets quieter.** → Go to **Leaf 14**.

  ### Node 8: Priority
  *Is the experience of the whole universe prior to your experience, or is your experience prior to the universe's?*
  *   **A. The Universe's experience is fundamental; ours are fragments.** → Go to **Leaf 15**.
  *   **B. Our experiences are fundamental; the Universe's is a construct.** → Go to **Leaf 16**.
  *   **C. Both are equally fundamental.** → Go to **Leaf 17**.

  *(Note: To meet the 10-14 leaf constraint strictly, some leaves above are grouped conceptually. For the purpose of the handout, treat Leaves 15-17 as the final Cosmopsychist variations.)*

  ---

  ## The Leaves (Outcomes)

  **Leaf 1: Biological Naturalism**
  *   **View:** Consciousness is a biological fluid like digestion; silicon cannot digest, so it cannot feel.
  *   **Awkward Commitment:** You must identify a specific biological ingredient that creates feeling, which no physicist has found.
  *   **Smartphone:** No, it is made of rock and metal, not meat.

  **Leaf 2: Illusionism**
  *   **View:** The feeling of having an inner life is a useful user-interface trick played by the brain.
  *   **Awkward Commitment:** You must explain why an illusion feels so real without admitting there is something to be fooled.
  *   **Smartphone:** No, nothing has experience, not even you.

  **Leaf 3: Brute Emergence**
  *   **View:** Experience pops into existence only when matter is arranged in very specific complex ways.
  *   **Awkward Commitment:** You must accept magic: experience appears from non-experience without a clear mechanism.
  *   **Smartphone:** No, it is not complex enough to trigger the pop.

  **Leaf 4: Panpsychist Skepticism (Skeptical Micropsychism)**
  *   **View:** Micro-experiences exist, but they never add up to a macro-subject like "you."
  *   **Awkward Commitment:** You are not a single person, but a swarm of billions of tiny people inside your skull.
  *   **Smartphone:** Yes, minimally, but it is a swarm, not a device.

  **Leaf 5: Hard Panprotopsychism**
  *   **View:** Matter has properties that *could* make experience, but never actually do.
  *   **Awkward Commitment:** The universe is filled with "almost-consciousness" that never quite wakes up.
  *   **Smartphone:** No, it has the ingredients but never bakes the cake.

  **Leaf 6: Soft Panprotopsychism**
  *   **View:** Micro-properties are not experience, but they combine to create it newly in complex systems.
  *   **Awkward Commitment:** You face the same "magic emergence" problem as Brute Emergence, just with fancier ingredients.
  *   **Smartphone:** No, the ingredients are there, but the recipe is missing.

  **Leaf 7: Constitutive Micropsychism (Physicalist Combination)**
  *   **View:** Your experience is literally constituted by micro-experiences bound by physical laws.
  *   **Awkward Commitment:** You must explain exactly which physical connection turns "many" into "one" without begging the question.
  *   **Smartphone:** Yes, its components are bound by circuits just like neurons.

  **Leaf 8: Non-Physicalist Panpsychism**
  *   **View:** Experience combines via a metaphysical glue that physics does not detect.
  *   **Awkward Commitment:** You have introduced a spooky, invisible force that operates alongside gravity and electromagnetism.
  *   **Smartphone:** No, it lacks the metaphysical glue, only the physical wires.

  **Leaf 9: Subject Atomism**
  *   **View:** Subjects are indivisible atoms; they can interact but never merge or split.
  *   **Awkward Commitment:** The Merge case is impossible; surgery can only create a third new subject, not combine two.
  *   **Smartphone:** No, a phone is an object, not a subject atom.

  **Leaf 10: Fusionism**
  *   **View:** Subjects can merge into a new, larger subject, destroying the originals.
  *   **Awkward Commitment:** Death is not the end of experience, but the absorption of your stream into a larger one.
  *   **Smartphone:** No, but if you networked a million phones, they might become one.

  **Leaf 11: Pluralism**
  *   **View:** Even cross-wired brains remain distinct subjects who just have access to each other's data.
  *   **Awkward Commitment:** There is no "unity of consciousness," only very fast communication between distinct selves.
  *   **Smartphone:** No, it is a single subject, not a plurality.

  **Leaf 12: Gradualist Panpsychism**
  *   **View:** Subjecthood is a matter of degree; you are slowly dying every day as connections fade.
  *   **Awkward Commitment:** There is no fact of the matter about whether you exist right now, only a probability.
  *   **Smartphone:** Yes, to a very low degree, proportional to its processing integration.

  **Leaf 13: Threshold Panpsychism**
  *   **View:** Subjecthood is binary; you exist fully until connectivity drops below a specific number.
  *   **Awkward Commitment:** A 1% change in connectivity can turn a person into a zombie instantly.
  *   **Smartphone:** No, it falls below the threshold for subjecthood.

  **Leaf 14: Eternalist Panpsychism**
  *   **View:** Once a subject exists, it never ceases; fading connectivity just isolates it.
  *   **Awkward Commitment:** The universe is littered with ghostly subjects trapped in broken brains.
  *   **Smartphone:** Yes, it is a subject, isolated but real.

  **Leaf 15: Priority Cosmopsychism**
  *   **View:** The Universe is the only true subject; we are just dissociated alters of the Cosmos.
  *   **Awkward Commitment:** Your individual choices are ultimately illusions of the Cosmic will.
  *   **Smartphone:** Yes, as a cell within the Cosmic body.

  **Leaf 16: Priority Micropsychism**
  *   **View:** Only small subjects exist; "The Universe" is a metaphor for their collection.
  *   **Awkward Commitment:** There is no global unity; the universe is a chaos of unrelated inner lives.
  *   **Smartphone:** Yes, as a collection of micro-subjects.

  **Leaf 17: Dual-Aspect Monism**
  *   **View:** Mind and Matter are two sides of the same coin; neither is prior.
  *   **Awkward Commitment:** You cannot explain one in terms of the other, halting scientific reduction.
  *   **Smartphone:** Yes, it has an inner aspect identical to its physical structure.

  ---

  ## Indistinguishable Leaves
  *Your tree cannot distinguish between these pairs without further questioning:*

  1.  **Leaf 7 (Constitutive Micropsychism) & Leaf 16 (Priority Micropsychism):** Both say parts are fundamental and the whole is derivative.
      *   *Separating Question:* "Is the collection of parts *itself* a subject, or just a heap of subjects?"
  2.  **Leaf 6 (Soft Panprotopsychism) & Leaf 3 (Brute Emergence):** Both say macro-experience emerges where micro-experience does not exist.
      *   *Separating Question:* "Do the fundamental particles have *any* inner nature, or are they purely dead matter?"
  3.  **Leaf 10 (Fusionism) & Leaf 15 (Priority Cosmopsychism):** Both allow for one subject to encompass many.
      *   *Separating Question:* "Did the one subject exist *before* the many, or did the many merge to *create* the one?"

  ---

  ## The Logical Grid (Analysis of the Space)

  You asked to build the tree out of logical space rather than names. The three questions that do the most sorting work in the debate are below. I have mapped the grid of answer combinations to show where the views sit and where the holes are.

  **The Three Sorting Questions:**
  1.  **Ubiquity:** Do basic physical entities (electrons/quarks) have experience? (Yes/No)
  2.  **Combination:** Does physical structure *guarantee* experiential unity? (Yes/No)
  3.  **Priority:** Is the macro-subject (Cosmos) fundamental or the micro-subject (Particle)? (Top/Bottom)

  **The Grid of Combinations:**

  | Ubiquity | Combination | Priority | Occupancy | View Label |
  | :--- | :--- | :--- | :--- | :--- |
  | **No** | **N/A** | **Bottom** | **Occupied** | **Brute Emergence / Physicalism** (Leaf 3) |
  | **No** | **N/A** | **Top** | **Empty** | *Incoherent:* If parts have no experience, the Whole cannot be made of them. |
  | **Yes** | **Yes** | **Bottom** | **Occupied** | **Constitutive Micropsychism** (Leaf 7) |
  | **Yes** | **Yes** | **Top** | **Empty** | *Unattractive:* If the Whole is fundamental, why does physical structure guarantee combination of parts? |
  | **Yes** | **No** | **Bottom** | **Occupied** | **Panpsychist Skepticism** (Leaf 4) |
  | **Yes** | **No** | **Top** | **Occupied** | **Cosmopsychism** (Leaf 15) |
  | **Yes** | **Extra** | **Bottom** | **Occupied** | **Non-Physicalist Panpsychism** (Leaf 8) |
  | **Proto** | **Yes** | **Bottom** | **Occupied** | **Panprotopsychism** (Leaf 6) |

  **Analysis of Empty Cells:**
  *   **No/N/A/Top:** This combination is **incoherent**. You cannot claim the Universe is conscious (Top) if its constituents are not (No), unless you posit magic emergence, which moves you to the "Brute Emergence" cell.
  *   **Yes/Yes/Top:** This combination is **merely unattractive**. It claims the Universe is fundamental (Top), but also that physical structure forces combination (Yes). If the Universe is fundamental, physical structure is derivative, so it cannot be the *ground* of combination. Nobody defends this because it creates a circular dependency.

  ---

  ## Meta-Analysis for the Moderator

  **Which single node does the most work?**
  **Node 3 (The Chorus).**
  This is the bottleneck of the entire debate. If a student answers "No" (a chain of feelers does not make a unified feeler), they are forced into **Skepticism** (Leaf 4), denying the unity of their own self. If they answer "Yes," they must explain *how* (Node 5: Bonding Lens). This node forces the student to confront the **Combination Problem** directly: is unity a physical fact or a metaphysical mystery? Every major view (Micropsychism, Cosmopsychism, Illusionism) is defined by how they escape the trap laid at Node 3.

  **Which views explain unity vs. give up on it?**
  *   **Explain Unity:** Constitutive Micropsychism (Leaf 7), Cosmopsychism (Leaf 15), Fusionism (Leaf 10). These views attempt to provide a metaphysical account of why "I" am one thing.
  *   **Give Up on Unity:** Panpsychist Skepticism (Leaf 4), Illusionism (Leaf 2), Pluralism (Leaf 11). These views deny that the "unity" of the self is a fundamental fact, treating it instead as a swarm, a trick, or a plurality.

  **Note on the Smartphone Question:**
  The room will fight about the smartphone because it tests **Substrate Independence**. Views that say "Yes" (Panpsychism, Cosmopsychism) commit to the idea that experience is about *structure* or *fundamental nature*, not biology. Views that say "No" (Biological Naturalism, Emergence) commit to the idea that life is special. This is the practical stake of the session.
