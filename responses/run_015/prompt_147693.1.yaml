answer: |-
  This is a fantastic setup for a discussion section. You are asking your students to stare directly into the engine of their own moral intuitions. The "narratability" distinction your friend proposed is a sharp tool, but *Omelas* is slippery enough to cut the hand that wields it.

  Here is how I would structure the discussion to test that framework, address the "expressive gesture" problem, and use specific scenes to push the students past their initial refusal to aggregate.

  ### 1. The Meta-Critique: Is Le Guin Weaponizing Narratability?

  You asked if the story resists your friend's framework or illustrates it. The answer is both. Le Guin absolutely weaponizes narratability bias, but she does it to expose a moral failure, not to justify it.

  If the cost of Omelas were distributed (everyone gets a daily pinch), the story collapses. There is no basement, no villain, no specific moment of horror to point to. It would just be "life." By concentrating the suffering into a single, maximally narratable victim, Le Guin forces the reader to confront the **structure** of utilitarian sacrifice.

  **The Class Point:** Tell your students: "The story only works because the suffering is concentrated. If everyone in Omelas felt a 1% reduction in happiness instead of one child suffering 100%, would you still walk away?"
  *   If they say **No**: They admit their outrage is driven by narratability, not total utility.
  *   If they say **Yes**: They have to explain why the *distribution* of harm matters more than the *sum* of harm.

  This directly engages your friend's "micro-pangs" test. If 50 years of torture is bad, but 50 years of indistinguishable micro-pangs is trivial, then pain isn't the metric—*story* is the metric. *Omelas* suggests that a morality based on "story" is vulnerable to hiding victims in basements.

  ### 2. The Walkers: Expressive Gesture or Moral Necessity?

  The students' frustration with the Walkers ("They don't help the child!") is the key to unlocking the non-consequentialist reading.

  If the students are strict consequentialists, the Walkers are irrational. They reduce the total good (one less happy person in the city) without increasing the child's welfare. The child stays in the cellar.

  However, if you view this through **complicity** rather than **outcome**, the Walkers make sense. They aren't trying to fix the system; they are refusing to *be* the system.

  **The Class Point:** Ask them: "If you stay in Omelas, do you hurt the child?"
  *   Most will say "No, the child is already hurt."
  *   Push back: "Does your happiness *require* the child's suffering? If you leave, does the city collapse?" (The text implies the deal holds regardless of individual departure).
  *   The crucial distinction: The Walkers aren't leaving to *change* the consequence; they are leaving to cleanse their own agency. They are rejecting the premise that the child is a *means*.

  This addresses your worry about the "expressive gesture." In a consequentialist framework, it is worthless. In a deontological or virtue ethics framework, it is the only move that preserves moral integrity. The story pushes back on consequentialism by showing that a "perfect" outcome (maximum happiness) can be morally rotton if the *process* requires a hidden, narratable sacrifice.

  ### 3. Three Scenes to Put in Front of Students

  Don't ask them about the whole story. Isolate these three moments to force the tension between aggregation and narratability.

  **Scene A: The Description of the Festival (The Aggregate Good)**
  *   **Context:** The long, lush description of the boats, the music, the sex, the drugs, the general vibe of the city.
  *   **Discussion Question:** "Le Guin spends pages describing the happiness of the many, but it feels vague. Then she spends one paragraph on the child, and it feels visceral. Why is the happiness hard to picture, but the suffering isn't?"
  *   **Goal:** This highlights the narratability bias. Happiness in Omelas is an aggregate statistic; the child is a character. This helps students see why they refuse to aggregate the dust specks—it's hard to care about a statistic.

  **Scene B: The Moment of Understanding (The Rationalization)**
  *   **Context:** When the young people are taken to see the child and told the terms: "If the child were brought up into the sunlight... all the prosperity... would vanish."
  *   **Discussion Question:** "The citizens are told that the child's suffering *buys* their happiness. Does anyone here think the trade is mathematically worth it, even if it feels wrong?"
  *   **Goal:** This forces the aggregation debate. If they say "Yes, mathematically," ask them to apply that to the dust specks. If they say "No," ask them if they would release the child even if it destroyed the city (making thousands miserable). This separates "rights" from "utility."

  **Scene C: The Departure (The Ambiguous Exit)**
  *   **Context:** The end of the story. The ones who walk away go alone, into the dark, toward a place that is "less happy."
  *   **Discussion Question:** "They don't rescue the child. They don't start a revolution. They just leave. Is this cowardice, or is it the only honest response?"
  *   **Goal:** This tackles the "expressive gesture" problem. If the goal was to help the child, this is cowardice. If the goal was to refuse complicity, this is integrity. It forces students to decide what morality is *for*: fixing the world, or keeping one's own hands clean?

  ### 4. Where the Story Pushes Back on the Framework

  Your friend's theory suggests that if we make the harm sub-narratable, it becomes trivial. *Omelas* pushes back on this by suggesting that **visibility is a moral requirement.**

  The horror of Omelas isn't just the pain; it's the *secrecy*. The happiness depends on the suffering being *unseen* by the majority. The story implies that a society built on sub-narratable harms (diffuse suffering) might actually be *more* stable and *less* likely to produce Walkers, because no one can point to the victim.

  **The Trap for the Students:**
  If they insist that the dust specks don't add up because they aren't narratable, ask them: "Is it okay to harm people as long as you do it in a way they can't talk about?"

  If Le Guin's story works, it's because she makes the sub-narratable (the structural cost of utopia) narratable (the child). She forces the aggregation into a single point so we can't ignore it.

  ### 5. Summary for the Section

  1.  **Start with the Specks:** Get them to commit to "No, a million specks don't equal one torture."
  2.  **Move to Omelas:** Show them Omelas is the same math (One torture vs. Million happy lives).
  3.  **Apply the Narratability Lens:** Ask if they care about the child because the pain is worse, or because the child is a *character* while the citizens are a *crowd*.
  4.  **End with the Walkers:** Ask if leaving is useless. If they say yes, they are consequentialists. If they say no, they must explain what moral work is being done if the consequence doesn't change.

  This approach validates your friend's insight (narratability drives our intuition) while using Le Guin to show why relying on that intuition is dangerous. It turns the story from a simple "utilitarianism is bad" fable into a complex inquiry about how we perceive harm.
