answer: |-
  First, a quick correction on your framing: you are absolutely right to insist on **spatial separation**. Temporal separation shifts the problem from the *Identity of Indiscernibles* (PII) to *Persistence Through Time* (genidentity). Black's thought experiment relies on co-existence in a symmetrical spatial manifold. If you separate them in time, you introduce a temporal index that trivially breaks the symmetry (Sphere A is at $t_1$, Sphere B is at $t_2$), which dodges the metaphysical bullet Black was firing. So, stick with spatial separation.

  Now, to the core of your request. You want a position, not a survey. Here it is:

  **Black's argument is a classical stopgap that collapses under the weight of quantum statistics, but his conclusion—that PII is not a necessary truth—survives, though for a much more radical reason than he proposed.**

  Here is the breakdown of what survives, what dies, and why, specifically regarding entangled identical particles.

  ### 1. What Collapses: Spatial Location as an Individuating Principle
  Black's two spheres are distinct *because* they occupy different regions of space, even if those regions are symmetrically related. He implicitly relies on a classical conception of space as a container that can confer "thisness" (haecceity) to objects simply by holding them in different slots. In classical mechanics, you can always tag particles by their trajectories ($x_1(t), x_2(t)$).

  In quantum mechanics, **this implication collapses completely.**

  For entangled identical particles (say, two electrons in a singlet state sent to Alice and Bob), spatial separation does **not** restore individuality. Even if the wavepackets are spatially disjoint (orthogonal), the Symmetrization Postulate dictates that the state vector must be antisymmetric (for fermions):
  $$ |\psi\rangle = \frac{1}{\sqrt{2}} (|L\rangle_1 |R\rangle_2 - |R\rangle_1 |L\rangle_2) $$
  The labels '1' and '2' are mathematical artifacts with no physical referent. You cannot say "Electron 1 is at Left" and "Electron 2 is at Right." You can only say "There is an electron at Left and an electron at Right."

  If you try to apply Black's logic—that they are distinct individuals because they are "over there" and "over here"—you run into the Gibbs Paradox and the wrong counting statistics (Maxwell-Boltzmann instead of Fermi-Dirac). Nature does not count states the way Black counts spheres. If they were Blackian individuals, the state $|L\rangle_1 |R\rangle_2$ would be distinct from $|R\rangle_1 |L\rangle_2$. In QM, they are the same physical state (up to a sign).

  Therefore, the implication that **spatial separation guarantees numerical distinctness** is dead in QM. Space in QM is an observable, not a substance-bearer. You cannot use it to ground identity.

  ### 2. What Collapses: "Distinct but Indiscernible" Individuals
  Black's conclusion was that we can have two *things* that share all properties. He wanted to save the concept of the "individual" while dumping PII. He argued for **primitive thisness**: they are two because they just *are* two, independent of their properties.

  In the context of entangled quantum particles, **this implication also collapses.**

  If you treat entangled electrons as "two distinct individuals that happen to be indiscernible," you are smuggling in classical haecceity that the formalism explicitly forbids. The formalism suggests we should not view them as "two individuals" at all, but rather as **two excitations of a single field**.

  In a Fock space formulation, we don't label particles; we specify occupation numbers of modes. There is no "Particle A" and "Particle B." There is just "2 electrons in the system." Black's argument assumes a substance ontology (objects + properties). QM forces us toward a structural or field ontology. To insist on Black's view—that there are two distinct substrata underlying the statistics—is to add metaphysical baggage that does no work and contradicts the permutation invariance of the Hamiltonian.

  So, the idea that they are **numerically distinct individuals** (in the classical sense) does not survive. They are "non-individuals" (to use the terminology of French and Krause).

  ### 3. What Survives: The Contingency of PII
  Here is the one piece of Black's argument that not only survives but is vindicated by QM: **PII is not a logical necessity.**

  Leibniz thought PII was a truth of reason. Black showed it wasn't logically contradictory to imagine a symmetric universe. QM goes further: it shows that **our actual universe violates PII** fundamentally.

  However, the survival comes with a caveat. Black thought PII failed because we could have distinct individuals without qualitative difference. QM suggests PII fails because the concept of "distinct individual" is the wrong category for fundamental entities.

  For entangled pairs, there is no qualitative property (including spatial relations, once you account for the symmetry of the state) that distinguishes particle $i$ from particle $j$. Yet, we have a multiplicity (we detect two clicks, not one). Black was right that multiplicity does not require discernibility. But he was wrong to think this multiplicity implies classical individuality.

  ### The Verdict
  As a physicist, you know that the math drives the ontology, not the other way around. Black's spheres argument is a classical intuition pump that assumes Maxwell-Boltzmann statistics.

  1.  **Discard the idea that space individuates.** In QM, spatial separation of entangled pairs is a correlation, not an individuation mechanism.
  2.  **Discard the idea of "hidden" individuality.** Do not think of the electrons as "Sphere A and Sphere B." Think of them as a single system with particle number $N=2$.
  3.  **Keep the rejection of PII.** Accept that nature allows for multiplicity without individuality.

  Black's argument is useful only as a negative proof: it breaks the logical link between "one property" and "one object." But do not use it to justify treating quantum particles as classical objects with lost name-tags. They aren't objects with lost name-tags; they are excitations that never had names to begin with.

  If you try to map Black's spheres onto entangled electrons, you will inevitably drift toward hidden variable theories or Bohmian mechanics to recover the trajectories needed to make Black's logic work. If you stay with standard QM, Black's classical individuality must be jettisoned, even if his refutation of Leibniz stands.
