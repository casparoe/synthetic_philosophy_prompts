answer: |-
  This is a sharp diagnosis of a classic philosophical headache. You have correctly identified that the "Swap Test" (often associated with David Chalmers) is a test for **verbalness**, but you are using it as a test for **triviality**.

  Your intuition is correct: the Swap Test is necessary but not sufficient for a dispute to be *merely* verbal. A dispute can be verbal (about words/concepts) without being *merely* verbal (a waste of time).

  Here is a principled account that attempts to capture your verdicts, followed by the specific predictions and the hard pill you may have to swallow.

  ### The Principle: The Two-Stage Filter

  To capture your intuitions, we need to distinguish between **Semantic Disagreement** and **Normative Stakes**.

  **Stage 1: The Semantic Test (Your Swap Test)**
  *   *Question:* Is there a sentence $S$ such that Party A accepts $S$, Party B rejects $S$, but upon disambiguating the terms, A accepts $S_1$ and B accepts $S_2$, where $S_1$ and $S_2$ are compatible descriptions of the world?
  *   *Result:* If Yes, the dispute is **Verbal**. If No, it is **Substantive**.

  **Stage 2: The Stakes Test (The "Merely" Condition)**
  *   *Question:* Does the choice between Definition A and Definition B have downstream consequences for action, prediction, law, or moral status that are not themselves settled by the shared facts?
  *   *Result:* If No, the dispute is **Merely Verbal** (trivial). If Yes, the dispute is **Metalinguistic Negotiation** (substantive normative disagreement).

  This framework relies on the work of philosophers like **David Plunkett and Tim Sundell**, who argue that many "verbal" disputes are actually **metalinguistic negotiations**: fights about which concept *ought* to be used for a specific purpose.

  ---

  ### Application to Your Cases

  Here is how the Two-Stage Filter handles your seven verdicts.

  **1. Hotdog/Sandwich**
  *   **Stage 1:** Passes Swap Test. (Verbal)
  *   **Stage 2:** No stakes (in the casual context).
  *   **Verdict:** **Merely Verbal.**
  *   *Fit:* Matches your intuition.

  **2. Brain Death**
  *   **Stage 1:** Passes Swap Test. You agree on biology; you disagree on the cut-off for the word "alive." (Verbal)
  *   **Stage 2:** High Stakes. The definition determines inheritance, organ donation, and mourning rituals.
  *   **Verdict:** **Verbal, but Not Merely Verbal** (Metalinguistic Negotiation).
  *   *Fit:* Matches your intuition. This saves the Swap Test. The test correctly identifies it as verbal; your error was assuming "verbal" implies "trivial."

  **3. Composition (Table vs. Particles)**
  *   **Stage 1:** Passes Swap Test. (Verbal)
  *   **Stage 2:** This is the pivot point. If you believe ontology is just about conceptual schemes, there are no stakes (Merely Verbal). If you believe ontology is about "carving nature at its joints" (Ted Sider's view), there are stakes (Substantive).
  *   **Verdict:** **Depends on your metaphysics.**
  *   *Fit:* You want to say Substantive. To do so consistently, you must believe there is a "true" structure of reality that makes one quantifier privileged.

  **4. Pluto**
  *   **Stage 1:** Passes Swap Test. (Verbal)
  *   **Stage 2:** Stakes exist regarding scientific classification utility, but no moral/legal urgency.
  *   **Verdict:** **Verbal, but one side is pragmatically superior.**
  *   *Fit:* Matches your intuition. The astronomer isn't "more true" about the rock, but their concept clusters better with other planets for predictive modeling.

  **5. Race in Medical Model**
  *   **Stage 1:** Passes Swap Test (arguably). They agree on genetics/outcomes.
  *   **Stage 2:** Massive Stakes. Resource allocation, accuracy of care, social justice.
  *   **Verdict:** **Metalinguistic Negotiation (Substantive).**
  *   *Fit:* Matches your intuition. This distinguishes it from Pluto (Case 4) based on the *magnitude* and *moral weight* of the stakes.

  **6. The Ontology Trio (A: Table, B: Simples, C: Cosmos)**
  *   **Stage 1:** All pairwise comparisons pass the Swap Test (Quantifier Variance).
  *   **Stage 2:** Here is where transitivity breaks.
      *   A vs B: Often feels verbal (common sense vs. technical).
      *   B vs C: Feels substantive because it's a clash of fundamental frameworks (Nihilism vs. Monism).
  *   **Verdict:** **Non-Transitive.**
  *   *Fit:* This is a feature, not a bug. "Verbalness" is not a logical relation between propositions; it is a pragmatic relation between speakers in a context. A and B share a "life-world" framework; B and C do not. The *distance* between frameworks matters.

  **7. Witches (Devil vs. Healer)**
  *   **Stage 1:** Fails Swap Test.
  *   **Reason:** This isn't a disagreement about where to draw a line. It's a disagreement about **existence conditions**. One concept (Devil-pact) has an empty extension in the actual world.
  *   **Verdict:** **Not a Dispute (Presupposition Failure).**
  *   *Fit:* Matches your intuition. One side is factually wrong about the world (Devils don't exist), not just semantically different.

  ---

  ### The Three New Cases

  **1. The Tax Code Hotdog**
  *   *Scenario:* City tax code exempts sandwiches but not hotdogs.
  *   *Prediction:* **Substantive.**
  *   *Why:* Stage 2 (Stakes) flips. Now the definition determines financial liability. The dispute is no longer "merely" verbal; it is a legal dispute about how to apply a rule. The Swap Test still says it's verbal (semantically), but the Stakes Test says it matters.

  **2. The Translation Dispute**
  *   *Scenario:* Two people, different languages, no shared dictionary.
  *   *Prediction:* **Indeterminate until Principle of Charity is applied.**
  *   *Why:* You cannot run the Swap Test until you have a translation manual. If the most charitable translation renders them in agreement on facts, it's verbal. If the most charitable translation leaves them disagreeing on facts, it's substantive. This shows the Swap Test is observer-relative.

  **3. The Modal Table (Ice)**
  *   *Scenario:* Agree on actual table, disagree if *this* table could have been made of ice.
  *   *Prediction:* **Substantive.**
  *   *Why:* The Swap Test **fails**. You cannot hand them each other's definition and dissolve the fight, because they disagree on *counterfactuals*, not just current classification. One believes origin is essential to identity; the other believes constitution is accidental. This is a disagreement about the structure of possibility, not just word usage.

  ---

  ### Which Verdict Must You Overturn?

  You asked which of your verdicts a principled account forces you to junk.

  **You must reconsider Case 3 (Composition) in light of Case 1 (Hotdog).**

  If you maintain that Hotdogs (Case 1) are *merely verbal* but Tables (Case 3) are *substantive*, you are committed to **Ontological Realism**. You are claiming that while "sandwich" is a human invention, "table" (or "object") is a feature of the universe independent of human interests.

  *   **The Cost:** Defending Ontological Realism is hard. You have to explain what "existence" means if not "quantification over variables in our best theory."
  *   **The Alternative:** If you accept **Quantifier Variance** (Eli Hirsch's view), then Case 3 is *also* merely verbal. The nihilist and the common-sense realist are just using different "existential quantifiers."
  *   **My Advice:** If you want a unified theory, either upgrade Case 1 to Substantive (conceptual engineering is always real) or downgrade Case 3 to Verbal. Keeping them different requires a heavy metaphysical tax.

  **Regarding Case 6 (Transitivity):**
  Do not try to save transitivity. "Merely verbal" is a pragmatic diagnosis, like "irrelevant."
  *   Argument A is irrelevant to B.
  *   Argument B is relevant to C.
  *   It does not follow that A is irrelevant to C.
  *   Accept that verbalness is context-sensitive and non-transitive.

  ---

  ### The "Stakes" Clause: Smuggling or Feature?

  You asked: *Is the swap test salvageable by bolting on a "nothing important hangs on it" condition, or does that just smuggle the normative stuff in through the back door?*

  **Answer:** It absolutely smuggles normative stuff in. **And that is exactly what you should do.**

  The phrase "merely verbal" is not a neutral descriptive term; it is a **pejorative**. It means "this dispute is not worth having."
  *   If you define "merely verbal" purely semantically (Swap Test), you lose the ability to say Brain Death (Case 2) matters.
  *   If you define it purely normatively (Stakes), you lose the ability to say Hotdogs (Case 1) are silly.

  The "Stakes Clause" isn't a bug; it's the recognition that calling a dispute "merely verbal" is itself a move in a metalinguistic negotiation. You are saying, *"The cost of resolving this semantic ambiguity exceeds the benefit of doing so."*

  ### Summary of the Principle

  **A dispute is *Merely Verbal* if and only if:**
  1.  **Semantic:** The parties agree on all non-semantic facts (Swap Test passes).
  2.  **Normative:** There are no significant practical, moral, or theoretical consequences that depend on which terminology is adopted.

  **What this tells you:**
  *   **Case 2 (Brain Death)** is Verbal but **Not Merely Verbal**. (Keep your verdict, fix the label).
  *   **Case 3 (Tables)** is likely **Merely Verbal** unless you are a committed Ontological Realist. (This is the verdict to potentially overturn).
  *   **Case 6 (Transitivity)** is **Non-Transitive**. (Accept this).
  *   **The Swap Test** is salvageable, but only as Step 1 of a 2-Step process.

  You aren't applying different standards; you are correctly sensing that "verbal" and "trivial" are two different variables that usually correlate but sometimes come apart. Your job isn't to find a definition where they always match, but to track why they come apart when they do.
