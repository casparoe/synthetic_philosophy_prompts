answer: |-
  **Principle of Communicative Answerability**

  An agent $A$ implicates $p$ to audience $H$ via utterance $U$ if:

  1.  **Intention:** $A$ intended $H$ to infer $p$ (motivated by Case 3: Irony; Case 7: Private code).
  2.  **Negligence:** $A$ is answerable for $U$ and could reasonably foresee $H$ would infer $p$, unless explicitly blocked (motivated by Case 1: Professor; Case 5: Autocomplete).
  3.  **Authority:** $A$ must possess warranted knowledge; omissions by uninformed agents generate no implicature (motivated by Case 2: Registrar).
  4.  **Institutional Agency:** Where $U$ is issued by an organisation, implicatures attach if the body controlled the template, regardless of individual intent (motivated by Case 6: Template error).

  **Applications**

  (a) **Press Officer:** She stands behind the statement. This satisfies Clause 2. By endorsing the output, she assumes answerability for its reasonable implications, even if drafted by a language model. She implicates what the text conveys to a reasonable reader, as she has adopted it as her own communicative act.

  (b) **Endorsed Inference:** She neither intended nor foresaw $p$. This fails Clauses 1 and 2. Retroactive endorsement does not make $p$ an implicature of the original utterance; it merely signals agreement going forward. The inference remains the hearer's alone, as the original act lacked the requisite intention or foreseeable negligence.

  **Accommodation and Overturning**

  This account accommodates Cases 1, 2, 3, 5, 6, and 7. It cannot accommodate Case 4 without contradiction. In Case 5, you accept responsibility for tool-generated text (autocomplete) via Clause 2. In Case 4, you deny responsibility for tool-generated text (translation app). Both involve voluntary use of imperfect media where the speaker invites reliance on the output.

  I would overturn your verdict on **Case 4**. If the guest voluntarily employed the app to speak, knowing the host relied on it, she is answerable for the output presented as her voice. Reasonable hearer uptake coupled with voluntary medium selection renders her responsible, aligning Case 4 with Case 5. You cannot disown the tool's voice while inviting others to listen to it. The distinction lies not in the tool, but in the assumption of answerability. By speaking through the app, she made herself answerable for its output in that context, much like the press officer in (a). Consequently, if the host's reading was reasonable, the guest did implicate rudeness, however unintentionally, and owes repair. This preserves consistency across your cases regarding negligence and answerability.
