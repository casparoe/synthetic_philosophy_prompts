answer: |-
  ### Q&A Prep Sheet: Distributive Pairwise Screening

  **Strategy Note:** Your room is friendly on the core premise (anti-aggregation), so don't waste time defending that. Your job is to defend the *mechanism* (the screening filter) against formal and practical breakdowns.

  #### 1. Upfront Concessions
  *   **Concede Scope:** Admit upfront that DPS is a theory of *permissibility* (rights/veto), not a complete theory of the *good*. It tells you what you can't do, not necessarily what is optimal. This disarms the EAs who want a maximization function.
  *   **Concede Cost:** Acknowledge that DPS might require letting some aggregate good go unrealized to protect individual standing. Don't try to argue the aggregate good doesn't matter; argue it is *secondary* to the pairwise constraint.

  #### 2. The Typo (Slide 4: "reasaonableness")
  **Fix it.** Do not own it.
  *   **Why:** "Reasonableness" is the technical engine of your entire view. Misspelling it suggests you haven't scrutinized the core concept. For a Kantian audience, precision is virtue. Fixing it takes 30 seconds; owning it risks 10 minutes of them wondering if you're sloppy with definitions.

  ---

  #### 3. Likely Objections & Replies

  **Objection 1: The "Numbers Matter" Challenge (From the EAs)**
  *   **How they'll ask:** "If I can save one person from death or a million from permanent paralysis, your screening filter seems to block the million because the one person has a veto. Are you really willing to say we should let the million suffer to save the one? That seems morally grotesque."
  *   **Two-Minute Reply:** "I'm willing to say it's *permissible* to save the one, not that it's *required* to let the million suffer. DPS sets a floor for rights, not a ceiling for benevolence. However, if the choice is strictly between the two, my view holds that the one person's claim not to be used as a means to save the million retains its force. The 'grotesque' intuition comes from conflating 'wrong' with 'suboptimal.' Aggregation treats people as containers of value; DPS treats them as sovereign agents. If we aggregate the million, we dissolve their individuality into a mass. I prioritize the integrity of the individual claim over the sum of outcomes. The cost is high, but the alternative is allowing individuals to be overridden by the sheer weight of others' needs, which violates the separateness of persons."
  *   **Soft Spot Flag:** ⚠️ **HIGH.** This is the classic "Non-Aggregation" bullet. If they press on "What if it's a billion lives?", do not double down on the veto. Pivot to: "At a certain threshold, the *nature* of the harm changes, and we might need a different principle." Don't let them paint you into an absolute corner.

  **Objection 2: The Continuity/Risk Challenge (From the Decision Theorist)**
  *   **How they'll ask:** "Your pairwise screening looks discontinuous. If I impose a 1% risk of death on Person A to save Person B from a headache, that clears the bar. If I impose a 99% risk, it doesn't. But expected utility is continuous. How do you avoid arbitrary cutoffs where a 0.1% increase in probability suddenly vetoes the whole action?"
  *   **Two-Minute Reply:** "That's a feature, not a bug. Expected utility assumes risks are fungible across persons; DPS assumes risks are relational. The cutoff isn't arbitrary; it's tied to the *reasonable rejectability* of the specific risk profile. A 1% risk of death might be a background risk of social life we all accept. A 99% risk is a targeted sacrifice. The 'jump' you see is the boundary between living in a society and being sacrificed for one. We don't need continuity with utility functions because we aren't maximizing utility; we are negotiating terms of coexistence. The 'break' in the curve represents the transition from acceptable risk to unacceptable imposition."
  *   **Soft Spot Flag:** 🟡 **MEDIUM.** If they bring up "Mixed Strategies" (lotteries), you might struggle. If they ask, "Why is 50% okay but 51% not?", admit that reasonableness is vague but argue that legal/moral thresholds (like 'beyond reasonable doubt') always have cliffs.

  **Objection 3: The "Empty Filter" Challenge (From a Kantian)**
  *   **How they'll ask:** "If you have to clear the bar for *every* pair, doesn't this paralyze action? In a complex policy, someone, somewhere, will always have a reasonable complaint. Isn't this just status-quo bias disguised as contractualism?"
  *   **Two-Minute Reply:** "Not if we define the 'pair' correctly. We aren't checking every possible interaction in the universe. We are checking the specific principle governing the action against those directly burdened by it. If a policy benefits everyone but burdens no one specifically, it clears. If it burdens a few to help many, the few get the screen. It's not paralysis; it's a high-friction brake. And yes, it biases toward the status quo, but that's the point of rights. We should be slow to impose harms. The 'empty filter' worry assumes complaints are easy to generate; I argue reasonable complaints require specific, significant setbacks to interests that aren't outweighed by the agent's own gain in that specific pair."
  *   **Soft Spot Flag:** 🟢 **LOW.** Your audience likes this. Just ensure you don't sound like you're advocating for total inaction.

  ---

  #### 4. The "Prayer Question" (Infinite Populations)
  *   **The Question:** "How does your pairwise filter handle infinite populations? If there are infinitely many victims, does the pairwise check break down because you can't complete the screening? Or does every individual pair still hold, rendering any action impossible?"
  *   **Why you're praying they don't ask:** This breaks the math of "every single pair."
  *   **Prepared Reply (If asked):** "DPS is designed for finite, non-ideal theory contexts—actual policy and human interaction. In infinite cases, the concept of 'reasonable rejection' loses its grip because the background conditions of scarcity and reciprocity change. I'm willing to concede DPS doesn't scale to transfinite ethics. It's a tool for human governance, not cosmological accounting."
  *   **Strategy:** If they ask this, **concede immediately.** Do not try to solve infinite ethics on the fly. Frame it as "out of scope" rather than "a flaw."

  ---

  #### 5. Final Tactical Advice
  *   **Watch the EAs:** They will try to make you look heartless. Keep bringing it back to *structure* and *rights*, not *feelings*.
  *   **Watch the Decision Theorist:** They will try to make you look inconsistent. Keep bringing it back to *qualitative* differences in risk, not *quantitative* ones.
  *   **Body Language:** When answering the "Numbers" objection (Objection 1), slow down. If you rush, it looks like you're dodging the bullet. If you pause and speak slowly, it looks like a considered moral stance.

  **Good luck. Fix the typo.**
