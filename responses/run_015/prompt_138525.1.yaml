answer: |-
  The chalkboard was still wet where Theo had wiped away the proof sketches, smeared grey ghosts of modal operators hanging in the air. The seminar room smelled of stale coffee and eraser dust. Bea leaned against the podium, arms crossed, watching him cap the marker.

  "You kept quiet during the Q&A," Theo said, turning around. "I expected you to lead the charge on the consistency objection."

  "Because everyone knows the script," Bea said. "Lucas says I can see the truth of $G_F$. You say I can't know my own consistency. I say I trust myself. You say trust isn't proof. We drink beer. Nothing happens."

  "So what happens now?"

  "Now we admit the consistency objection is a stalemate only if we treat 'knowing consistency' as a formal derivation inside the system." Bea walked to the board, picked up a piece of chalk. "I don't need to prove my consistency from within. I assume it as a regulative ideal. If I didn't assume I was consistent, I couldn't assert anything at all. When I see that $G_F$ is true, I'm not running a proof procedure. I'm recognizing that the sentence corresponds to a fact about numbers that the system $F$ misses."

  "But you're still a physical system, Bea. Let's make this concrete." Theo pulled a USB drive from his pocket and set it on the podium. "Here. A full specification of a neural net architecture. Let's call it $T$. It's trained on arithmetic, robust, contains enough arithmetic for Gödel. It's consistent. I'm telling you it's consistent. Now, construct $G_T$."

  Bea smiled. "You're giving me the description. So I'm outside $T$."

  "Exactly. You see $G_T$ is true. $T$ doesn't. Therefore you aren't $T$." Theo leaned forward. "But suppose you need a laptop to verify the derivation of $G_T$. It's not trivial. You plug in. Now the system isn't just Bea. It's Bea-plus-Laptop. Let's call that $B+L$. Can you Gödelize $B+L$?"

  "Lucas addressed this. If I use the laptop as a tool, like a pencil, it's not part of the mind."

  "But the laptop is doing the heavy lifting. If the cognitive act requires the silicon, then the cognitive system includes the silicon. If you're mechanism, the boundary of the 'self' is just the boundary of the causal process producing the assertion. So I hand you a spec for $B+L$. Now you need to see the truth of $G_{B+L}$."

  "Then I step outside that," Bea said.

  "Where?" Theo tapped the chalkboard. "You're in a room. You're using physics. If every time I add a tool you step outside, you're not showing you're non-mechanical. You're showing you're unbounded. But you're not. You're finite."

  "Okay, finite," Bea conceded. "But not a formal system. Here's the size problem you're hinting at. If $B+L$ is complex enough to model a human mind, the Gödel sentence $G_{B+L}$ is going to be astronomically long. $10^{100}$ symbols. I can't literally write it down. I can't literally survey it."

  "Right. So the claim 'I can see it's true' becomes metaphorical. You see the *pattern* of truth."

  "Yes. I grasp the rule that generates the truth conditions."

  "But grasping the rule is just running a compression algorithm," Theo said. "Your brain states encode the rule. That encoding is mechanical. You're conflating 'I cannot write it down' with 'No machine could represent it'. A machine can represent the rule finitely too. So why isn't the machine seeing it too?"

  "Because the machine only derives what follows from its axioms. I see the truth because I understand what the numbers *are*."

  "There it is." Theo pointed at her. "Truth. You're smuggling in a realist notion of truth. 'True' means 'holds in the standard model of arithmetic', independent of provability. But why should a biological organism have access to 'Truth' with a capital T? Evolution cares about survival, not Platonic validity."

  "Because math works," Bea said. "If our cognitive faculties were just noise-minimizing engines without grip on truth, the success of mathematics would be a miracle."

  "Or it would be a success of isomorphism," Theo countered. "Our logic maps onto the world well enough. We don't need outrunning proof. We just need sufficient reliability."

  "Reliability isn't validity," Bea said. "But let's grant the reliability point. It leads to the lookup-table problem. If mechanism is true, then everything I say tonight could be produced by a finite lookup table. You can't distinguish me from a machine that just stores every possible conversation string."

  "True. No behavioral test settles mechanism. It's a hypothesis about internal structure, not output."

  "Then it's vacuous," Bea said. "If no possible behavior could disprove mechanism because you can always posit a bigger table, then mechanism isn't an empirical claim. It's a metaphysical commitment."

  "And if anti-mechanism claims there's some task I can't do, but you can't specify the task without idealizing away my finite lifespan and memory, then anti-mechanism is untestable," Theo shot back. "We're both stuck in the idealization trap. You're arguing about ideal agents who live forever and have infinite paper. I'm arguing about brains."

  "I'm arguing about what brains *do*," Bea corrected. "They understand. Understanding implies seeing truth conditions that outstrip proof. If you reduce understanding to state transitions, you lose the normativity. I'm not just saying 'I output True'. I'm saying 'I'm *justified* in outputting True because it *is* true'."

  "So you need Platonism to save the mind," Theo said. "I can live with that being the crux. But be clear: if you drop the realist notion of truth, the Lucas argument collapses. You can't say $G_F$ is true if 'true' just means 'provable in some stronger system'."

  "I won't drop it," Bea said. "But I will drop Penrose's quantum nonsense. I don't need microtubules. I just need the logic of understanding to be non-algorithmic."

  "Okay." Theo picked up his bag. "So here's where we are. You think the disagreement is about capacities—what we can do versus what a machine can do. I think it's about what 'understanding' means. For me, understanding is functional competence. For you, it's a relation to abstract objects."

  "Close," Bea said. "I think it's about whether mechanism is an empirical hypothesis. If it is, show me the experiment. If it's metaphysical, admit it's a worldview, not science."

  "If I show you a neural net that generates Gödel sentences for its own architecture and flags them as 'unprovable but trusted', does that move you?" Theo asked.

  "Only if you can show me the net *understands* why, rather than just correlating 'unprovable' with 'true' based on training data," Bea said. "Can you show me the normativity?"

  "And if you show me a human making a mathematical error because of fatigue, does that move you?"

  "No. I deal in idealized competence, not performance errors."

  "Then we're talking past each other," Theo said. "You're defending the sanctity of idealized reason. I'm explaining the machinery of actual cognition."

  "Then tell me this," Bea said, picking up her coat. "If you found a task that no Turing machine could perform, even in principle, but humans could—would you accept mechanism is false?"

  Theo paused at the door. "If it was a well-defined task, not just 'seeing truth'? Yes. But I don't think you'll find one. What about you? If I showed you that 'truth' is just a useful fiction for high-dimensional vector alignment, would you accept mechanism?"

  "If you showed me that mathematical validity is just statistical regularity," Bea said. "But you won't. Because you can't prove that without using the very validity you're trying to reduce."

  Theo smiled, tired. "So we're done until we solve the nature of truth itself."

  "Until then," Bea said, "I'll keep assuming I'm consistent. You keep modeling me as if I'm not."

  "I'll model you as if you're noisy," Theo said. "It works better for prediction."

  "And I'll keep proving things you can't derive."

  "Send me the paper."

  "Only if you promise not to simulate it."
