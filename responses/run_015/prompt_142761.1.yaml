answer: |-
  **Joint Statement on the Science of Cooperation**

  **Preamble**
  Over two days, we attempted to reconcile our theories of convention using a shared experimental design. This document records where we converged, where we diverged, and what evidence would change our minds. We are not claiming to have settled the debate; rather, we are specifying exactly what would count as settling it. Our signatures indicate commitment to these predictions, not agreement on their interpretation. We acknowledge that our previous arguments often talked past one another because we lacked a common empirical arena. This statement is our attempt to cash out theoretical differences into observable consequences within the merged-rooms study.

  **Agreed Claims**
  1. Conventions arise to solve coordination problems where matching yields payoff, regardless of the specific label chosen.
  2. An equilibrium (a state where no participant gains by switching alone) emerges in both rooms before the merge.
  3. Merging populations with different histories creates temporary coordination failure until one label dominates.
  4. Participants learn from past outcomes to adjust future choices without explicit instruction.
  5. A basin of attraction (the set of starting conditions leading to a specific equilibrium) influences which convention survives.
  6. Common knowledge (everyone knows X, everyone knows everyone knows X) affects expectations about others' behaviour.
  7. Salience (some options standing out psychologically) influences initial choices when history is absent.
  8. Turnover introduces noise that can destabilise established patterns even without external shocks.
  9. Committed minorities can alter population behaviour without majority consent if they persist long enough.
  10. Verbal articulation affects how quickly a convention spreads to newcomers who lack prior history.

  **Disagreements**

  | Question at Issue | Lewisian Position | Modeller Position | Substantive or Verbal | Depends on Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | What drives equilibrium selection post-merge? | Salience and precedent create common knowledge favouring one label. | Relative population sizes and network dynamics determine the larger basin. | Substantive | 1 |
  | Does the announcement change behaviour beyond information transfer? | Yes, it creates common knowledge that shifts the equilibrium itself. | No, it merely updates individual beliefs about probabilities. | Substantive | 2 |
  | Are Sticklers violating the definition of convention? | Yes, because they do not prefer to conform given others conform. | No, they are simply parameters changing the dynamic landscape. | Verbal (underlying variable: definition of agency) | 3 |

  **Cruxes**

  **1. Salience versus Basin Size**
  *Question:* Is salience an explanatory notion in its own right or just a name for whatever makes a basin of attraction large?
  *Why it matters:* If salience is distinct, psychological focal points can override numerical majorities; if not, dynamics dictate outcomes.
  *Probe:* Replication 1 (Plain Merge).
  *Predictions:* Lewisian predicts a 50/50 split across runs regardless of initial room size. Modeller predicts the majority label wins 80% of runs.
  *Damaging Result:* Lewisian is damaged if majority label wins consistently; Modeller is damaged if split is random despite size advantage.

  **2. The Announcement Effect**
  *Question:* Does the cheap announcement in replication 2 do work beyond what a belief-updating model already predicts?
  *Why it matters:* If common knowledge is real, a non-binding message should trigger an immediate equilibrium shift rather than gradual learning.
  *Probe:* Replication 2 (Announcement).
  *Predictions:* Lewisian predicts 90% adopt announced label in Round 31. Modeller predicts adoption grows over 10 rounds to 60%.
  *Damaging Result:* Lewisian is damaged by slow adoption; Modeller is damaged by an immediate jump without payoff change.

  **3. Norms and Sticklers**
  *Question:* Is the extension from pure coordination to mixed-motive settings a change of degree or a change of subject?
  *Why it matters:* If Sticklers break the convention condition, norms requiring enforcement cannot be Lewisian conventions; if they are just dynamics, norms are emergent properties.
  *Probe:* Replication 4 (Sticklers).
  *Predictions:* Lewisian predicts convention collapses; no norm exists without mutual preference to conform. Modeller predicts new convention forms around Stickler label.
  *Damaging Result:* Lewisian is damaged if stable norm emerges; Modeller is damaged if chaos persists despite fixed nodes.

  **What I would need to see**

  **The Lewisian**
  I need to see that psychological focal points can override numerical majorities without prior learning history. If the merged population consistently converges on the label held by the larger pre-merge group regardless of label properties, I must concede that dynamics swamp reason. My view requires that common knowledge allows agents to transcend the raw counts of behaviour and select an equilibrium based on mutual expectation rather than mere momentum.

  **The Modeller**
  I need to see that common knowledge explanations predict variance better than dynamic models with identical parameters. If the announcement produces an immediate jump in coordination that cannot be modelled as Bayesian updating, I must concede that there is a cognitive mechanism missing from standard learning equations. My view requires that all apparent rationality be reducible to evolutionary stability and population-level processes without invoking special mental states.
