  So I've been going down a rabbit hole on constructive math after a LessWrong thread about proof-theoretic strength got me curious, and last night a friend of mine -- PhD student in CS, very confident guy, watched a bunch of YouTube lectures on this -- gave me his summary of intuitionism. It sounded mostly right to me but there were a few things that rubbed me the wrong way, and I don't know the area well enough to pin down why. Here's roughly what he said: intuitionists reject the law of excluded middle because they think some mathematical statements are just neither true nor false until someone proves one way or the other, so it's basically a three-valued logic; Brouwer's insight was that math is something humans do rather than something we discover, which means every proof has to actually construct the thing it's about, so existence proofs by contradiction are out; Gödel later proved intuitionistic logic is consistent relative to classical logic, which is why classical mathematicians don't have to worry; and in the end intuitionism is basically the logic of computation, since a proof is the same thing as an algorithm, which is why all the proof assistants like Coq use it.

  Some of that tracks with what I've read but some of it feels off. Like, I vaguely remember that intuitionists get annoyed at being called three-valued logicians, and that the "neither true nor false" framing is actually a different philosophical camp? Also the "proof = algorithm" thing feels like it's sliding together Brouwer's actual views with something much later and more formal that came out of computer science, and I'm suspicious my friend is retroactively projecting Curry-Howard onto 1907. And I have no idea whether the Gödel claim is right or whether he's garbling whatever result he half remembers.

  Can you go through his summary more or less claim by claim and tell me which parts a careful constructivist would sign off on, which parts are the kind of simplification that hides something important, and which are just wrong? Also he ended with the conclusion that since intuitionistic logic is "just classical logic minus excluded middle," any classical theorem can be intuitionistically proven if you're willing to be a bit careful -- I'd like to know if that follows from the parts of his summary that are actually true. Please actually commit to a verdict on each point rather than giving me "well, it depends on how you look at it" -- I'm fine with you taking sides on contested interpretive stuff as long as you say what side you're taking and why.
