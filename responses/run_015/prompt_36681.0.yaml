answer: |-
  Your instincts are excellent. Your friend has assembled a "greatest hits" of constructive mathematics concepts but has glued them together with some historically inaccurate and technically flawed mortar. He is conflating three distinct eras: Brouwer's original Intuitionism (1907–1950s), Heyting's formalization (1930s), and the Curry-Howard/Type Theory revolution (1960s–Present).

  Here is the claim-by-claim breakdown with the verdicts you asked for.

  ### Claim 1: "Intuitionists reject LEM... so it's basically a three-valued logic."
  **Verdict: Wrong.**

  This is a specific pet peeve of intuitionists, and your memory is correct. Intuitionistic logic is **not** three-valued logic (True, False, Unknown). In three-valued logics (like Łukasiewicz's), the Law of Excluded Middle ($P \lor \neg P$) can evaluate to "False" or "Unknown." In intuitionistic logic, $P \lor \neg P$ is not assigned a third value; rather, the statement is simply **not assertible** unless you have a proof of $P$ or a proof of $\neg P$.

  Brouwer and Heyting explicitly rejected the idea that there is a "third truth value." For an intuitionist, truth is not a static property waiting to be measured; it is the *experience of a proof*. Saying a statement is "neither true nor false" implies a Platonic reality exists where the truth value is currently hidden. An intuitionist denies that reality exists at all. The logic is not 3-valued; it is potentially infinite-valued (based on the state of knowledge/construction), but formally, it is distinct from multi-valued logic systems.

  ### Claim 2: "Brouwer's insight was that math is something humans do rather than something we discover."
  **Verdict: Correct.**

  This is the core philosophical tenet of Brouwer's Intuitionism. He was an idealist: mathematics is a free creation of the human mind (the "creating subject"), not a discovery of pre-existing Platonic truths. Classical mathematics assumes mathematical objects exist independently of us; Brouwer assumed they only exist insofar as they are constructed by the mind. Your friend nailed the philosophical motivation here.

  ### Claim 3: "Every proof has to actually construct the thing it's about, so existence proofs by contradiction are out."
  **Verdict: Correct.**

  This is the operational consequence of Claim 2. To prove $\exists x P(x)$, you must produce a specific $x$ and demonstrate $P(x)$. A proof by contradiction that shows $\neg \neg \exists x P(x)$ (i.e., "it is impossible that no such $x$ exists") is insufficient because it provides no method to find $x$. Consequently, the double-negation elimination rule ($\neg \neg P \to P$) is invalid in intuitionistic logic. This is the single most important technical difference between classical and intuitionistic systems.

  ### Claim 4: "Gödel later proved intuitionistic logic is consistent relative to classical logic, which is why classical mathematicians don't have to worry."
  **Verdict: Garbled/Backwards.**

  Your friend is referring to the **Gödel-Gentzen negative translation** (1933), but he has the implication backwards, which changes the philosophical meaning entirely.

  The theorem shows that Classical Peano Arithmetic (PA) can be embedded into Intuitionistic Peano Arithmetic (HA). Specifically, for every classical theorem $\phi$, there is an intuitionistic theorem $\phi^N$ (its double-negation translation). The consistency result is: **If Intuitionistic Arithmetic is consistent, then Classical Arithmetic is consistent.**

  This does *not* mean intuitionistic logic is consistent relative to classical logic (that is trivial, since intuitionistic logic is a subsystem of classical logic). The profound result is that **Classical logic is reducible to Intuitionistic logic.**

  Why does this matter? It means Intuitionistic logic is *stronger* in terms of consistency strength, not weaker. If you trust constructive math, you automatically get classical math for free (via translation). Your friend's conclusion ("classical mathematicians don't have to worry") is technically true but for the wrong reason: Classical mathematicians don't have to worry because their system is essentially a "compiled" version of the constructive one, not because constructive math borrows safety from classical math.

  ### Claim 5: "Intuitionism is basically the logic of computation, since a proof is the same thing as an algorithm."
  **Verdict: Anachronistic Conflation.**

  This is the biggest historical error in your friend's summary. He is projecting the **Curry-Howard Correspondence** (1960s/70s) onto **Brouwer** (1907–1950s).

  *   **Brouwer** hated formalism. He believed that formalizing math into symbols and algorithms stripped it of its true mental essence. He would likely have despised the idea that a proof is "just an algorithm." For Brouwer, a proof was a mental construction, which might not even be communicable or finite in a computational sense (e.g., his "choice sequences").
  *   **Curry-Howard** identifies proofs with programs (lambda terms). This is the foundation of modern proof assistants.
  *   **The Verdict:** It is true that *modern* constructive type theory (used in CS) treats proofs as algorithms. It is **false** to attribute this view to Brouwer's original Intuitionism. Your friend is describing "Computational Constructivism," not "Brouwerian Intuitionism."

  ### Claim 6: "All the proof assistants like Coq use it."
  **Verdict: Mostly Correct.**

  Coq, Agda, and Lean are based on constructive type theories (Calculus of Inductive Constructions, etc.). They default to intuitionistic logic. However, users can optionally add the Law of Excluded Middle as an axiom if they wish (though it breaks computation features like extraction). So, while the *kernel* is intuitionistic, the *usage* can be classical. But as a summary of the tool's architecture, this is acceptable.

  ### Claim 7: "Since intuitionistic logic is 'just classical logic minus excluded middle,' any classical theorem can be intuitionistically proven if you're willing to be a bit careful."
  **Verdict: False.**

  This is the most dangerous takeaway in your friend's summary. It is **not** true that you can prove any classical theorem intuitionistically just by being careful.

  1.  **Some Classical Theorems are Intuitionistically False:** In certain intuitionistic models (like Brouwer's continuum), the statement "All functions from $\mathbb{R} \to \mathbb{R}$ are continuous" is true. Classically, this is false. Conversely, the classical theorem "There exists a discontinuous function" is false intuitionistically. You cannot prove it "carefully"; it contradicts the axioms.
  2.  **The Translation Limit:** The Gödel-Gentzen translation mentioned in Claim 4 only works for a specific subset of statements (roughly, arithmetic statements that don't involve disjunction or existence in a positive way). It does not work for Analysis. You cannot translate the Hahn-Banach theorem or the Bolzano-Weierstrass theorem into intuitionistic logic and expect them to hold. They must be reformulated, and often the reformulated version is weaker or requires different premises (e.g., requiring a modulus of convergence).
  3.  **Meaning Changes:** In intuitionistic logic, negation means "constructing a contradiction," not "mapping to False." Some classical tautologies simply have no constructive content.

  ### Summary of the "Classical Theorem" Conclusion
  Your friend's conclusion relies on the idea that Intuitionistic Logic is a *subset* of Classical Logic (which is true) and therefore anything provable Classically is "reachable" Intuitionistically (which is false).

  While Intuitionistic Logic is a subsystem of Classical Logic (every intuitionistic proof is a classical proof), the reverse is not true. There are classical theorems that are **unprovable** intuitionistically, not just because we haven't found the proof, but because they imply the Law of Excluded Middle, which intuitionists reject as false/meaningless.

  **Final Verdict on your Friend:** He has a good "elevator pitch" understanding of the *utility* of constructive math for computer science, but his understanding of the *history, philosophy, and logical limits* is significantly flawed. He is treating Brouwer like a computer scientist and treating Intuitionistic Logic like a weakened Classical Logic, when it is better understood as a different logic entirely with different semantics.
