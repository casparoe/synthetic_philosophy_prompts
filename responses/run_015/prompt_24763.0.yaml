  # Axiomatic Taxonomy of Two-Person Bargaining Solutions

  **Domain:** Convex, compact feasible sets $S \subset \mathbb{R}^2$ with disagreement point $d \in S$.  
  **Base Assumption:** All solutions below satisfy **Pareto Efficiency (PE)** (outcome lies on the upper-right frontier of $S$).  
  **Axioms:** **Symmetry (SYM)** (invariant to player permutation), **Scale Invariance (SI)** (invariant to $u_i' = a_i u_i + b_i, a_i>0$), **Independence of Irrelevant Alternatives (IIA)** (if $S' \subset S$ and $f(S) \in S'$, then $f(S')=f(S)$).

  ### The Decision Tree

