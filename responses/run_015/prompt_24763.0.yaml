  START: All PE-Satisfying Solutions
  │
  ├── Q1: Is the solution SYMMETRIC? 
  │   (Does swapping players' utilities swap the outcome?)
  │   ├── NO ──────────────────────────────────────┐
  │   │   [Logic: Dictator maximizes one utility,  │
  │   │    ignoring the other's symmetry.]         │
  │   │   Solutions: Dictatorial                   │
  │   │                                            │
  │   └── YES ─────────────────────────────────────┤
  │       [Logic: Nash, KS, Egalitarian treat      │
