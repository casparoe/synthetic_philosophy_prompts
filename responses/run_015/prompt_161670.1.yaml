  6.  **Final Polish:** Ensure the distinction between "Extended Mind" (EMT) and "Embedded/Enactive" is clear where relevant (S5 touches on this). Ensure the distinction between Adams & Aizawa (coupling-constitution) and Clark's replies is clear.

