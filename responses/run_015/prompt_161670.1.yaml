          4.  The Cloud Otto Case (Determinate or not?).
          5.  Overall Advice for the Essay.

      *   *Refining the "Committed" stance:*
          *   On S7 (Coupling-Constitution settled it): I must firmly say this is false. The literature does not support this.
          *   On Cloud Otto: I must say the criteria fail to yield a determinate answer, and this indicates a weakness in the *formulation*, not necessarily the *core idea*, but it requires the "mark of the cognitive" debate.
          *   On Ethics: I must say the inference is valid *conditional* on the metaphysics, but the text presents it as a direct entailment which is slightly sloppy.
          *   On Triviality: I must say the user's worry is astute but the defender has a reply (explanatory power).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "manipulation of representations" bit in S5?
      *   *Correction:* Yes, need to highlight that 1998 EMT is compatible with non-representational views later, but the text conflates them. Actually, C&C 1998 *is* representationalist. But the claim that it "generalises" to *all* cognition is stronger than the original paper. I will mark S5 as an overgeneralization.
