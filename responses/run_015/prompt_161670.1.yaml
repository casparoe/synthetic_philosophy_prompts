      *   *S4: "So when Otto, who has mild Alzheimer's disease, looks up the museum's address in his notebook, the notebook literally contains his belief about where the museum is; that belief is partly constituted by marks of ink on paper, exactly as Inga's corresponding belief is constituted by features of her brain."*
