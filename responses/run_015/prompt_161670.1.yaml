      *   *S7: "Critics reply that this merely shows that cognition depends on external props, not that those props are part of it — the objection usually called the coupling–constitution fallacy — and that objection is now widely taken to have settled the matter against the thesis."*
          *   **Verdict:** **Gross Misrepresentation.** This is the most dangerous sentence. The coupling-constitution fallacy (Adams & Aizawa) is a major objection, but it is *not* "widely taken to have settled the matter." The debate is very much alive (Clark 2008, 2010; Menary; etc.). Many defenders argue the fallacy accusation begs the question.

