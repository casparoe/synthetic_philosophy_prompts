      *   **Applicant's Hypothesis:** Standard views (dismissivism and sentience-conditionalism) presuppose the run-relative character. Taking the modal character seriously suggests a third view: some playthroughs waste the character's potential, constituting a harm/wrong independent of suffering.
      *   **Methodology:** 4-5 worked case studies of distinct game structures (scripted death, branching romance, permadeath, procedural companion, delayable fate). *Not* a survey of simulation/consciousness literature.
      *   **Requirements:** Define positive/negative results, failure conditions, scope limits (6 months + novel drafting). British English. No bibliography.
      *   **Tone:** Philosophical rigour suitable for a philosophy department, but grounded in the novelist's perspective (narrator's thought process).

  2.  **Determine Structure and Length:**
