          3.  Permadeath Run (Finality vs. Reload).
          4.  Procedural Companion (Identity across generation).
          5.  Delayable Fate (The limbo state).
      *   **Outcomes:** What does success look like? (A coherent framework for modal duty). What does failure look like? (Collapsing back into player psychology).
      *   **Scope/Feasibility:** 6 months. Novel drafting is concurrent. Need to be realistic.

  4.  **Refining the Argument (Self-Correction during drafting):**
