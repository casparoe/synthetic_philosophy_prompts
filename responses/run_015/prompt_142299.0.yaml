      *   *Check:* Is the tone right? It needs to sound like a novelist who can think philosophically, not a philosopher trying to write fiction. It should feel rigorous but accessible.
      *   *Check:* British English. (Ensure "programme," "honour," "analyse," etc.)
      *   *Check:* Length. I need to make sure I don't ramble. The prompt asks for specific details on the case studies and failure conditions.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Opening:* My novel explores a specific grief. The philosophical core is the ontology of the NPC.
      *   *The Problem:* Standard ethics asks "Can it suffer?" or "Does it matter?" I want to ask "Which version of it matters?"
      *   *The Distinction:* Run-relative (token) vs. Modal (type/branching).
