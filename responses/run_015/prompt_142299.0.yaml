          *   *Permadeath:* XCOM/Ironman.
          *   *Procedural:* Dwarf Fortress/Rimworld.
          *   *Delay:* The novel's specific mechanic.
      *   *Outcomes:* Positive = A taxonomy of modal harm. Negative = Proof that 'modal harm' reduces to player regret.
      *   *Scope:* 6 months. 3 months on theory, 3 months on integration with text.

  6.  **Polishing and Formatting:**
      *   Ensure the distinction between "dismissive" and "sentience-conditional" is clear.
      *   Make sure the "Modal Waste" concept is articulated clearly.
      *   Check word count. (Aiming for tight, dense prose).
