  *(Self-Correction on Length)*: A standard A4 page single-spaced is about 500-600 words. Two pages is roughly 1000-1200 words. I need to ensure I have enough substance to fill this without waffling. I will expand on the methodology and the specific philosophical stakes of the "Modal Waste" argument.

