  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic yet evocative. *The Modal Duty: Ethical Obligations to Non-Actualised Game Characters.* Or *Run-Relative vs. Modal Characters.* Let's go with something that bridges the novel and the philosophy. *Preserving the Possible: A Philosophical Inquiry into Modal Characters and Player Duty.*

      *   **Introduction/Context:** Establish the novel's premise briefly but pivot quickly to the philosophical problem. The narrator isn't just grieving; she's acting on an ethical intuition. The proposal must validate this intuition as a legitimate philosophical object, not just pathology.
