answer: |-
  **Project Title:** Preserving the Possible: A Philosophical Inquiry into Modal Characters and Player Duty

  **Applicant:** [Name]
  **Fellowship:** Writing Fellowship, Department of Philosophy
  **Duration:** Six Months

  **Project Summary**
  My novel-in-progress centres on a woman who, following her brother's death, refuses to progress past a specific chapter in a role-playing game. A companion character is fated to die in that chapter; by maintaining a save file prior to this event, she believes she is discharging a duty to keep him alive. While clinical psychology might classify this as pathological grief or magical thinking, my narrator experiences it as an ethical imperative. She is not merely avoiding pain; she is honouring an obligation.

  This creative practice-led research project seeks to determine the philosophical validity of that obligation. Specifically, it asks: is the object of our duty towards a video-game character the *run-relative character* (the token instance encountered in a single playthrough) or the *modal character* (the whole branching tree of possibilities the game code makes available)? I hypothesise that standard ethical frameworks regarding fiction fail to capture this distinction. The 'dismissive' view (nothing is owed to code; only player psychology matters) and the 'sentience-conditional' view (nothing is owed until the entity can suffer) both tacitly presuppose the run-relative character. They ask whether *this* instance suffers. Neither accounts for the intuition that a playthrough can be worse for a character than another, not because of inflicted suffering, but because it wastes what the character *could have been*.

  **Research Question**
  The central question is whether 'modal waste' constitutes a genuine ethical harm. If the modal character is the proper object of duty, then my narrator is not deluded about the existence of a duty, though she may be mistaken about its scope. If the run-relative character is the only valid object, her belief is a category error. The research will articulate the precise respect in which she is deluded, if at all, by mapping the ontology of the non-player character (NPC) against the ethics of potentiality.

  **Methodology**
  Rather than surveying literature on simulation or machine consciousness—which presumes the question is about *feeling* rather than *being*—this project will utilise a case-study method focused on ludic structure. I will analyse five distinct game mechanics to test the limits of modal duty.

  1.  **The Fixed Scripted Death:** (e.g., *Final Fantasy VII*). The death is inevitable across all valid playthroughs. Here, the modal character and the run-relative character converge on the same end. Does avoiding the script in a save file preserve the character, or merely the *image* of the character?
  2.  **The Branching Romance:** (e.g., *Mass Effect*). Choosing one partner locks out others. Is the unchosen partner harmed by non-actualisation? If the modal character includes all romance paths, does the player owe fidelity to the *possibility* of the relationship, or only the actualised one?
  3.  **The Permadeath Run:** (e.g., *XCOM*). When a unit dies, they are gone from that campaign. Reloading a save preserves the run-relative character but erases the modal history of the failed run. Is reloading a duty to the unit, or a betrayal of the event that killed them?
  4.  **The Procedural Companion:** (e.g., *Dwarf Fortress*). The character is generated from traits. If I reload to generate a 'better' version, have I harmed the first iteration? This tests whether identity is tied to code-seed or history.
  5.  **The Delayable Fate:** (My novel's scenario). A death that can be postponed indefinitely but not prevented. This creates a 'limbo' state. Is keeping a character in stasis a preservation of their modal potential, or a denial of their narrative closure?

  By working through these cases, I intend to isolate whether the 'harm' lies in the player's experience (regret) or in the character's ontological status (frustrated potential).

  **Expected Outcomes**
  A **positive result** would establish a coherent framework for 'modal duty'. It would demonstrate that certain playthroughs are objectively deficient not because they cause pain, but because they fail to instantiate the character's optimal possibility space. This would validate the narrator's intuition: she is protecting the character's *essence* from the *accident* of the script.

  A **negative result** would demonstrate that 'modal waste' collapses into player preference. If I cannot distinguish between 'wasting a character' and 'disliking an outcome' without recourse to the player's feelings, then the narrator is deluded. Her duty is not to the character, but to her own memory of her brother.

  **Failure Conditions**
  The project fails if it devolves into a general discussion of immersion or empathy. It also fails if it attempts to solve the hard problem of consciousness. The scope is strictly limited to the *ethics of interaction* with defined rule-sets. If the distinction between run-relative and modal characters proves linguistically incoherent upon application to the case studies, I must conclude that the narrator's logic is fundamentally flawed, a finding that is itself a successful philosophical outcome but would require a significant rewrite of the novel's thematic resolution.

  **Feasibility and Scope**
  Over six months, I will dedicate three months to the philosophical case studies and three months to integrating these findings into the novel's draft. I will not produce a comprehensive taxonomy of all game types; the five cases are selected as limit-cases to stress-test the theory. I will not engage with the wider literature on AI rights, as the project presupposes the characters are not sentient. The focus remains on the unique metaphysics of the save file and the branching narrative.

  This fellowship offers the necessary rigour to ensure the novel's central conceit is not merely a metaphor for grief, but a sustained inquiry into how we value the possible over the actual. By clarifying the object of the narrator's duty, I can write her delusion—or her vindication—with precision.
