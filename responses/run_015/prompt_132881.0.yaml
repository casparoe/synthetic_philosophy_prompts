          *   *User's view:* Neutral/Strengthens you. Shows the *content* doesn't matter, only the *label*. This supports the "Brand" analogy more than the "River."
          *   *Synthesis:* This supports the idea that *continuity of name/form* matters more than *continuity of substance*.

  8.  **Task 6: Better Analogy:**
      *   *Sister's Brand:* Too cynical/corporate.
      *   *Uncle's River:* Too naturalistic/deterministic.
      *   *Alternative:* **A Language.**
