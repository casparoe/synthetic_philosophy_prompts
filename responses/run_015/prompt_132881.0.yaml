  2.  **Deconstruct the Uncle's Argument (The River):**
      *   *Premise:* Traditions are like rivers.
      *   *Observation:* Water changes (participants/details change), source is murky (1953 vs. 1700s), but the channel remains (the event itself).
      *   *Conclusion:* The tradition is "real" (ontologically valid), creates obligations (participate, fund), and restricts agency (newcomers don't redesign).
      *   *Scaling:* Applies to towns and nations (1776 is just a marker, not the literal source).

  3.  **Task 1: Correspondence Table:**
      *   *Water:* The specific participants, the specific cider, the specific words spoken. (Constantly changing).
      *   *Source/Spring:* The alleged origin (1700s charter vs. 1953 Rotary).
      *   *Channel/Bed:* The institutional structure (Founders' Day committee, the date, the parade route).
      *   *Banks:* The constraints (social norms, budget, legal permits).
      *   *Current/Momentum:* The social pressure/expectation to continue.
      *   *Delta:* The future evolution/outcome.
