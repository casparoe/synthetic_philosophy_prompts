          *   Changes constantly (slang, grammar shifts).
          *   Requires speakers to exist (like tradition).
          *   You can't speak it "wrong" easily, but you can speak it awkwardly.
          *   Origin is murky (Old English vs. Germanic roots), but utility is real.
          *   *Why it fits:* You don't get to redesign English unilaterally (supports uncle), but it's not a physical force (supports user). It's a coordination game.

