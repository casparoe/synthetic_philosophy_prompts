answer: |-
  ### I. The Architecture of *Perpetual Peace* (1795)

  To analyze the League of Nations through a Kantian lens, we must first reconstruct the normative architecture of *Zum ewigen Frieden*. Kant's project is not a utopian blueprint but a deduction of the conditions under which public right (*öffentliches Recht*) can exist among nations.

  **1. Preliminary and Definitive Articles**
  The essay is structured around negative and positive conditions. The **Preliminary Articles** are prohibitions on state conduct that perpetuate war (e.g., no secret reservations in peace treaties, no standing armies, no interference in another state's constitution). These are immediate duties. The **Definitive Articles** establish the positive constitution of peace:
  *   **First Definitive Article:** The Civil Constitution of every state shall be **Republican**. This is the foundational condition. For Kant, a republic is defined not merely by suffrage but by the separation of the executive from the legislative power and representative government. Only in a republic do citizens bear the costs of war, making them hesitant to initiate it.
  *   **Second Definitive Article:** The Right of Nations shall be based on a **Federation of Free States** (*foedus pacificum*). This is a voluntary league to end war, distinct from a treaty of peace (*pactum pacis*) which ends only one war.
  *   **Third Definitive Article:** Cosmopolitan Right shall be limited to conditions of **Universal Hospitality**. This regulates interaction between individuals and foreign states, preventing colonial exploitation.

  **2. League of Peace vs. State of Peace**
  A crucial distinction in Kant's Second Definitive Article is between a *foedus pacificum* (pacific federation) and a *civitas gentium* (state of nations or world republic). Kant explicitly rejects the *civitas gentium*. He argues that a global sovereign would become a "soulless despotism" due to the vastness of the territory and the diversity of laws. Therefore, the *foedus pacificum* must be a voluntary association that preserves state sovereignty while progressively expanding to include all nations. It lacks the direct coercive authority over members that a domestic state holds over citizens.

  **3. The Republican Condition**
  The viability of the federation rests on the First Definitive Article. Kant argues that non-republican regimes treat subjects as property; the ruler can wage war as a "kind of pleasure party" without personal sacrifice. A federation of non-republics is inherently unstable because the internal disposition of the states is bellicose. Thus, the federation is not merely a security arrangement but a moral community of states with compatible constitutions.

  ---

  ### II. Analysis of the League of Nations (1920–1946)

  The League of Nations represents the first major institutional attempt to instantiate Kant's Second Definitive Article. However, when mapped against Kant's practical philosophy, the League reveals significant structural and normative deviations.

  #### (1) Satisfaction and Violation of Kant's Conditions

  **The Republican Condition (Violated)**
  Kant's First Definitive Article requires that member states possess a republican constitution. The League's Covenant contained no such requirement for membership.
  *   **Evidence:** The League included constitutional monarchies (e.g., United Kingdom), liberal republics (e.g., France), but also militaristic empires (e.g., Japan until 1933) and later totalitarian regimes (e.g., Italy under Mussolini, USSR under Stalin).
  *   **Kantian Analysis:** By admitting non-republican regimes, the League violated the necessary condition for the *disposition* toward peace. For Kant, Japan's aggression in Manchuria (1931) was not an anomaly but a structural inevitability of a state where the executive (the military leadership) was not separated from the legislative will of the people. The League treated states as juridical equals regardless of their internal constitution, whereas Kant argues internal right determines external right.

  **Coercive Authority (Ambiguous/Problematic)**
  Kant insists the *foedus pacificum* cannot have coercive power over states, as that would transform it into a world state (*civitas gentium*), which he rejects.
  *   **Evidence:** The League Covenant (Article 16) provided for economic and military sanctions against aggressors.
  *   **Kantian Analysis:** The League attempted a middle path Kant did not fully theorize: a federation with *some* coercive mechanisms (sanctions) but no standing army or direct sovereignty. Kant offers no guidance on whether limited coercion within a federation undermines sovereignty enough to threaten freedom or is necessary to make the federation effective. The League's failure to enforce sanctions effectively (due to the requirement of unanimity in many decisions) suggests that without the *moral* coercion of republican public opinion, *legal* coercion is inert.

  **Inclusion of Non-Republican Regimes (Violated)**
  *   **Evidence:** The admission and retention of Italy and Japan while they engaged in aggressive expansionism.
  *   **Kantian Analysis:** Kant argues that non-republican states cannot be trusted partners in a *foedus pacificum* because their decision-making is opaque and unaccountable. The League's universalist approach diluted the security guarantee. For Kant, a federation should ideally be a union of *free* (republican) states; including unfree states imports the logic of war into the heart of the peace union.

  #### (2) The League: Kantian Federation or Unanticipated Form?

  Structurally, the League was a **Kantian Federation** (*foedus pacificum*), not a World State. It lacked a global executive, a global judiciary with binding jurisdiction over individuals, and a global monopoly on violence. It was an association of states, not a super-state.

  However, teleologically, it was an **unanticipated form**. Kant envisioned the federation emerging *from* the spread of republicanism. He writes that the idea of international right "presupposes the separation of many independent states." He expected a gradual convergence of republican constitutions to make the federation viable. The League inverted this: it attempted to impose a federative structure on a world that was not yet republican, hoping the institution itself would civilize the members.
  *   **Mapping:** Kant predicts: Republicanism $\rightarrow$ Federation $\rightarrow$ Peace. The League attempted: Federation $\rightarrow$ (hope for) Republicanism $\rightarrow$ Peace.
  *   **Result:** Without the underlying republican disposition, the institutional shell of the League could not sustain the moral weight Kant assigned to it.

  #### (3) Aggression and the Problem of Binding Force

  The League's inability to prevent aggression in Manchuria (1931) and Ethiopia (1935) illuminates the tension in Kant's account of enforcement.

  **The Manchuria and Ethiopia Cases**
  *   **Actors:** Japan (non-republican military oligarchy) vs. China; Italy (fascist regime) vs. Ethiopia.
  *   **Options:** The League could issue condemnations (moral force) or impose sanctions (coercive force). It chose weak sanctions and failed to close the Suez Canal or ban oil sales to Italy.
  *   **Kantian Interpretation:** Kant argues that in the state of nature between nations, there is no judge. The *foedus pacificum* is meant to replace this state of nature with a condition of public right. However, because Kant denies the federation coercive power over members (to avoid despotism), the federation relies on the *honor* and *interest* of the members to uphold the peace.
  *   **Revelation:** The collapse reveals that a federation without coercive power is vulnerable if the members lack the *republican disposition*. Republican citizens, bearing the cost of war, would theoretically resist aggressive wars. Non-republican leaders (Mussolini, Japanese Generals) did not bear these costs personally. Therefore, the League's lack of coercive force was tolerable only if all members were republics. Since they were not, the lack of a "binding force" (a standing federal army or automatic sanctions) became fatal.
  *   **Kant's Claim:** Kant claims perpetual peace requires binding force (law) without becoming a world state. The League shows that "binding force" in a voluntary association is an oxymoron when vital interests conflict. Kant relies on "Nature" (trade, spirit of commerce) to enforce peace where law cannot. The League showed that in the 1930s, nationalist autarky overrode the spirit of commerce.

  #### (4) Verdict: Confirmation, Gap, or Scope Mismatch?

  The episode of the League of Nations ultimately **exposes a gap in Kant's account of enforcement during the transition period**, while confirming the necessity of his republican condition.

  **1. Confirmation of the Republican Condition:**
  The League failed most conspicuously when dealing with non-republican aggressors. This confirms Kant's First Definitive Article: without internal republican constitutions, external treaties are merely truces. The democratic states (France, UK) were hesitant to act, partly due to war weariness (a republican trait), but also because the institutional link between their citizenry and the League's security guarantees was weak.

  **2. Gap in Enforcement:**
  Kant offers no guidance on how a *foedus pacificum* should handle a member that violates the peace other than excluding them or fighting them (which returns to the state of nature).
  *   **Where Kant is Silent:** He does not theorize economic sanctions or collective security mechanisms that stop short of total war. The League tried to create a "police action" capability without a sovereign. Kant's framework implies that if a state violates the federation, it is an enemy of all, but he provides no procedural mechanism for adjudicating *who* is the aggressor without a global judge. The League's requirement for unanimity paralyzed this judgment.
  *   **The Gap:** Kant assumes the *idea* of public right will eventually command obedience. The League showed that without a mechanism to verify aggression and enforce penalties that does not rely on the voluntary cooperation of the very powers whose interests are at stake, the federation is inert.

  **3. Scope Mismatch (Universal vs. Federation):**
  Kant's federation is open to all but implicitly relies on a core of republican states to set the norm. The League aimed for **universal membership** immediately.
  *   **Analysis:** By including non-republican great powers as equals with veto-wielding status (in the Council), the League diluted the normative power of the federation. Kant's theory was not designed for a universal institution that includes hostile, non-republican regimes as founding members. He envisioned a gradual expansion. The League's attempt to be universal *ex ante* allowed the logic of the state of nature to operate within the council chambers.

  **Conclusion**
  The League of Nations was a Kantian *foedus pacificum* in form but not in substance. It satisfied the condition of avoiding a world state but violated the condition of republican homogeneity. Its collapse does not refute Kant's rejection of a world state; rather, it vindicates his claim that a federation of non-republics is unstable. However, it exposes a critical gap: Kant provides no institutional recipe for how a voluntary federation can coerce a bad actor without dissolving into war or transforming into a despotic world state. The League proved that "binding force without sovereignty" is impossible unless the binding force is moral (republicanism) rather than legal. Since the moral condition was absent, the legal structure collapsed.
