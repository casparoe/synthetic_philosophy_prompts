  **Node 1 (Root): The Possibility of Settlement**
  Consider a core philosophical debate that has persisted for over two centuries (e.g., the nature of free will or the basis of moral obligation). Does the persistence of this debate primarily indicate that:
  *   **A:** Definitive settlement is impossible in principle; the question is essentially open forever. *(Go to Node 2)*
  *   **B:** Settlement is possible, even if difficult, local, or rare; the question is not essentially open. *(Go to Node 5)*

  **Node 2: The Value of Disappearance**
  (From Node 1A) Suppose a philosophical problem ceases to be discussed because philosophers come to view its core terms as confused or its presuppositions as false (e.g., the rejection of "natural place" in physics). Is this disappearance:
  *   **A:** A **success**, because the problem was a pseudo-problem that needed dissolving. *(Leaf 4: Therapeutic Dissolution)*
  *   **B:** A **loss** or evasion, because the problem remains genuine and should be sustained. *(Go to Node 3)*

  **Node 3: The Signal of Disagreement**
  (From Node 2B) When equally informed experts maintain deep, unresolved disagreements on a core issue, does this signal:
  *   **A:** **Intellectual stagnation**, implying the field is failing to converge on truth despite ample time. *(Leaf 3: Perpetual Recurrence)*
  *   **B:** **Increased sophistication**, implying the field is successfully mapping the complexity of the issue. *(Go to Node 4)*

  **Node 4: The Structure of Sophistication**
  (From Node 3B) If the field is becoming more sophisticated without converging, is the primary value found in:
  *   **A:** **Maintaining multiple, incommensurable frameworks** that offer distinct but equally valid articulations of the world. *(Leaf 5: Pluralist Divergence)*
  *   **B:** **Narrowing the exact points of clash**, so that opposing positions are rigorously articulated and the space of live alternatives is clearly mapped, without expectation of convergence. *(Leaf 6: Precision of Disagreement)*

  **Node 5: The Nature of Resolution**
  (From Node 1B) When a philosophical resolution *is* achieved, does it primarily function to:
  *   **A:** **Accumulate**, building a stable, expanding structure of knowledge where later solutions rest securely on earlier ones. *(Go to Node 6)*
  *   **B:** **Clarify**, resolving isolated conceptual puzzles or linguistic confusions without necessarily building a larger cumulative system. *(Leaf 2: Non-Cumulative Conceptual Clarification)*

  **Node 6: The Source of Accumulation**
  (From Node 5A) If knowledge accumulates, does this growth rely primarily on:
  *   **A:** **Integrating empirical data** from outside philosophy (e.g., cognitive science, physics) to constrain and verify claims. *(Leaf 1: Cumulative-Progress Analog)*
  *   **B:** **Internal rational construction**, where the system grows through logical derivation and conceptual necessity without empirical anchor. *(Leaf 7: The Unoccupied Rationalist System)*

  ---

  ### Terminal Leaves (Positions)

  1.  **Cumulative-Progress Analog:** Philosophy progresses like the natural sciences; theories are tested, falsified, or verified, and knowledge stacks cumulatively over time, often relying on empirical integration.
  2.  **Non-Cumulative Conceptual Clarification:** Philosophy progresses by tidying up concepts, languages, and categories. Solutions are reached, but they do not build a "tower" of knowledge; they simply remove confusion in specific local areas.
  3.  **Perpetual Recurrence:** Philosophy makes no net advance. The same fundamental problems recur in every generation with different terminology; expert disagreement signals immaturity or failure.
  4.  **Therapeutic Dissolution:** Philosophy progresses by eliminating questions rather than answering them. Success is measured by the disappearance of pseudo-problems through the critique of language or presuppositions.
  5.  **Pluralist Divergence:** Progress is measured by the quality and articulation of competing frameworks. The goal is not consensus, but the maintenance of multiple, rich, incommensurable ways of thinking.
  6.  **Precision of Disagreement:** Progress occurs through the increasing precision of disagreement. Opposing positions become more rigorously articulated, their points of clash more narrowly located, and the space of live alternatives more clearly mapped, without any expectation of convergence.
  7.  **The Unoccupied Rationalist System (Ghost Leaf):** Philosophy progresses by building a cumulative system of truth derived purely from reason/internal logic, without empirical input.
      *   *Diagnosis of Vacancy:* This position is logically coherent but currently unoccupied in meta-philosophical discourse. While historically prominent (e.g., 17th–19th Century Rationalism/Idealism), contemporary defenders of progress generally reject the idea that pure reason alone can generate *cumulative* knowledge without empirical constraint. It remains a "ghost" because it requires a dogmatic confidence in rational intuition that most modern philosophers explicitly disavow.

  ---

  ### Scoring Key

  | Path | Commitment Profile | Assigned Position |
  | :--- | :--- | :--- |
  | **1A → 2A** | Denies settlement; values problem dissolution. | **Therapeutic Dissolution** |
  | **1A → 2B → 3A** | Denies settlement; views persistence as failure/stagnation. | **Perpetual Recurrence** |
  | **1A → 2B → 3B → 4A** | Denies settlement; values persistence as framework generation. | **Pluralist Divergence** |
  | **1A → 2B → 3B → 4B** | Denies settlement; values persistence as mapping clash. | **Precision of Disagreement** |
  | **1B → 5B** | Allows settlement; views it as non-cumulative clarification. | **Non-Cumulative Conceptual Clarification** |
  | **1B → 5A → 6A** | Allows settlement; views it as cumulative & empirical. | **Cumulative-Progress Analog** |
  | **1B → 5A → 6B** | Allows settlement; views it as cumulative & purely rational. | **The Unoccupied Rationalist System** |

  ---

  ### Gap Analysis & Indistinguishability Flags

  **Flagged Pair: Non-Cumulative Conceptual Clarification (Leaf 2) vs. Precision of Disagreement (Leaf 6)**

  *   **Diagnosis:** The diagnostic questions struggle to fully separate these two positions in practice. Node 5 asks if resolution "builds a stable structure" (Cumulative) or "resolves isolated puzzles" (Clarification). Node 4 asks if value is in "maintaining frameworks" or "narrowing points of clash."
  *   **The Blur:** A respondent might believe that "narrowing points of clash" (Leaf 6) *is* a form of "conceptual clarification" (Leaf 2). The tree forces a choice at Node 1 (Settlement Possible vs. Impossible). However, one can hold that we clarify concepts *precisely by* mapping our disagreements, without ever achieving a final "settlement."
  *   **Required Additional Case:** To distinguish these, an additional node would be needed asking: *"When a conceptual distinction is successfully drawn, does it end the debate (Settlement) or does it reveal a deeper layer of disagreement that remains live (Precision)?"* Leaf 2 requires the debate to end locally; Leaf 6 requires the debate to continue, albeit more sharply. Without this specific distinction, a respondent who believes clarification *fuels* further disagreement may find the path between Node 1 and Node 4/5 ambiguous.

  **Flagged Pair: Cumulative-Progress Analog (Leaf 1) vs. The Unoccupied Rationalist System (Leaf 7)**

  *   **Diagnosis:** These are separated solely by Node 6 (Empirical vs. Rational).
  *   **The Blur:** In modern interdisciplinary contexts, the line between "empirical data" and "rational constraint" is often blurred (e.g., using logical formalisms that are tested against linguistic intuitions, which are treated as data).
  *   **Required Additional Case:** To distinguish these, a case involving *formal semantics* or *logic* would be needed. The instrument would need to ask: *"If a logical system is proven consistent and comprehensive, does this count as progress even if it has no application to the observable world?"* Leaf 1 says No (needs empirical); Leaf 7 says Yes (rational suffices). The current Node 6 phrasing ("Integrating empirical data") is clear, but respondents may disagree on what counts as "empirical" (e.g., are intuitions empirical?).
