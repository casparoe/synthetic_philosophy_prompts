answer: |-
  The contention that modern scientific practice destabilises the Nyāya four-fold scheme of *pramāṇas* is unfounded. The traditional framework is sufficiently elastic to accommodate instrument-mediated observation and scientific consensus without collapsing categories or necessitating a fifth *pramāṇa*.

  Regarding instruments, proponents of a hybrid epistemic form argue that telescope-mediated vision is inferential, relying on theories of optics rather than direct contact. However, this conflates the calibration of the tool with the cognitive event itself. Treating instruments as anything other than aids to *pratyakṣa* (perception) misunderstands the causal structure of Nyāya epistemology. Perception is defined by sense-object contact. Instruments function as *sahakāri-kāraṇa* (co-operating causes) that extend the reach of the senses rather than replacing them. The visual cognition of a lunar crater via a telescope remains fundamentally perceptual; the lens merely modifies the causal chain leading to sense-contact. To posit a hybrid category is to confuse the mechanism of access with the source of validity. Inventing a fifth *pramāṇa* here is ontologically extravagant.

  Similarly, the transition from scriptural authority to peer-reviewed consensus does not diminish *śabda* (testimony) to mere sociology. Critics suggest scientific authority is social construction, not epistemic authority. Yet, *śabda* relies fundamentally on the credibility of the source (*āpta*). In classical terms, an *āpta* is one who possesses true knowledge and communicates it faithfully. The scientific community, bound by methodological rigour and verification, functions as a collective *āpta*. Peer review is simply the mechanism establishing trustworthiness, ensuring the testimony is free from deceit or error. Therefore, accepting scientific claims remains an act of *śabda*, grounded in the reliability of the testifier rather than blind faith. Reducing this to sociology ignores the truth-tracking aim inherent in the definition of *pramā*.

  Collapsing these into one another risks losing the distinction between direct experience and reported knowledge, yet maintaining them separately accommodates science perfectly. Consequently, the Nyāya framework requires no revision. It successfully categorises scientific instruments as aids to *pratyakṣa* and scientific authority as valid *śabda*. The four-fold scheme remains a coherent epistemology for modern science, proving its enduring analytical power without needing unauthorized expansion. The tension dissolves when one recognises that Nyāya realism prioritises the causal origin of knowledge over the technological medium of its delivery.
