  ### Preliminary Analysis: Incremental Changes and Philosophical Frameworks

  **I. Key Incremental Changes in *The Metamorphosis***

  *   **Gregor's Physical State:**
      1.  Awakening as a vermin (consciousness intact, body altered).
      2.  Loss of human speech (voice becomes animalistic piping).
      3.  Loss of dietary preference (repulsion toward human food, attraction to decay).
      4.  Loss of mobility (clinging to ceiling, then confined to floor).
      5.  Physical injury (apple embedded in back by father).
      6.  Decay and immobility (unable to rise, dried out).
      7.  Death (corpse).

  *   **The Family's Moral Attitude:**
      1.  Shock and pity (Mother faints, Father weeps).
      2.  Cautious provision (Grete brings multiple foods to test preference).
      3.  Protective secrecy (hiding Gregor from visitors/charwoman).
      4.  Removal of furniture (Grete and Mother strip the room; Gregor clings to the picture).
      5.  Hostility and violence (Father drives him back, wounds him with apple).
      6.  Neglect (room becomes storage, cleaning is sporadic, food is scraps).
      7.  Dehumanization (referenced as "it" or "the creature"; discussion of getting rid of "it").
      8.  Erasure (Cleaning woman disposes of the body; family takes a trolley ride).

  **II. Philosophical Approaches to the Boundary of "Person/Family Member"**

  *   **Supervaluationism:** Truth is defined across all admissible "precisifications" of a vague term. In the middle stages of Gregor's transformation, the statement "Gregor is a family member" lacks a truth value (it is neither true nor false) because some precisifications of "family member" include him (biological/psychological continuity) while others exclude him (functional utility/physical form). The narrative gap regarding the exact moment of moral exclusion mirrors this truth-value gap.
  *   **Epistemicism (Williamson-style):** There is a sharp, metaphysical boundary where Gregor ceases to be a son/person, but it is unknowable. The family's shifting treatment suggests they are acting on ignorance of this fixed boundary. Their cruelty arises from a false confidence that they know when he crossed the line, when in fact they are guessing at a hidden fact.
  *   **Degree Theory (Fuzzy Logic):** Personhood and kinship are not binary but matters of degree (0 to 1). Gregor's moral status diminishes gradually alongside his physical decay. Obligation is proportional to the degree of membership. As Gregor approaches 0.1 "son," the family's obligation approaches zero. This validates the gradual withdrawal of care as logically consistent with the gradual loss of status.
  *   **Contextualism:** The extension of "family member" shifts based on conversational or situational context. Initially, the context is "household economy" (Gregor is the provider), securing his status. Later, the context shifts to "domestic safety and hygiene," where his verminous nature excludes him. The boundary moves not because Gregor changes, but because the standards of the context shift.

  ***

  ### The Sorites of Kinship: A Philosophical Reading of *The Metamorphosis*

  Franz Kafka's *The Metamorphosis* is frequently read as an allegory of alienation, illness, or capitalist exploitation. However, when viewed through the lens of the philosophy of language, specifically the literature on vagueness and the sorites paradox, the novella emerges as a rigorous investigation into the instability of moral categories. The central philosophical tension is not merely Gregor's physical metamorphosis, which occurs instantaneously between sleep and waking, but the *moral* metamorphosis of his family, which proceeds via a slow, incremental erosion of obligation. This narrative structure enacts a "moral sorites," challenging the tolerance principle—the intuition that small differences in kind cannot justify large differences in treatment. Kafka does not simply illustrate the paradox; he dramatizes the psychological and linguistic mechanisms by which rational agents navigate, and ultimately violate, the boundaries of personhood.

  #### The Gradient of Neglect

  The sorites paradox traditionally relies on a heap of sand: removing one grain does not cease to make it a heap, yet removing grains one by one eventually leaves none. In *The Metamorphosis*, the "heap" is the status of being a son and a person. The narrative meticulously documents the removal of "grains" of care. Initially, Grete brings milk and bread, then tests rotting vegetables. This is a marginal adjustment. Later, the furniture is removed to give Gregor space to crawl, a decision rationalized as benevolent yet stripping him of human markers. Then, the door is locked not for his safety, but for theirs. Finally, food becomes sporadic, and the room becomes a dump.

  Individually, each step is locally defensible. Removing the chest of drawers seems practical; locking the door seems necessary after he frightens the mother. Yet, the cumulative result is the abandonment of a sentient being who retains human consciousness until the end. Kafka forces the reader to inhabit the tolerance principle's failure. We recognize that the difference between feeding Gregor fresh food and scraps is negligible, yet the moral difference between care and neglect is profound. The narrative demonstrates how the tolerance principle is weaponized: because no single step seems to constitute a total breach of duty, the family slides into total breach without ever confronting a decisive moment of decision.

  #### Philosophical Frameworks and the Textual Evidence

  How does the text accommodate specific theories of vagueness? A **degree-theoretic account** finds strong support in the parallel decline of Gregor's physical capacity and the family's economic fortunes. As Gregor's "personhood score" drops (he speaks less, moves less), the family's obligation appears to scale down proportionally. Grete's final speech—that "it" cannot be Gregor because the real Gregor would have left voluntarily—suggests a threshold has been crossed where the degree of kinship is too low to sustain life. However, Kafka complicates this by preserving Gregor's interiority. The reader knows Gregor's love remains constant even as his capacity to express it vanishes. If moral obligation is based on internal states (love, memory), the degree theory fails; Gregor remains 1.0 "son" internally, even if he is 0.1 "son" externally. The tragedy lies in the mismatch between the ontic reality of Gregor's mind and the epistemic access the family has to it.

  An **epistemicist reading** suggests there is a sharp boundary where Gregor ceases to be a family member, but the family is ignorant of it. They act as if they know, particularly the father, whose violence implies a certainty of Gregor's monstrosity. Yet, the text refuses to locate this boundary. There is no scene where a character says, "Today he stopped being human." Instead, the boundary is retroactively imposed by the cleaning woman who declares, "Just look at this, it's dead; quite wasted away." The epistemic limit is dramatized as moral cowardice; the family claims knowledge of a boundary that cannot be known to justify their neglect. They treat a vague concept as if it were precise to evade the burden of uncertainty.

  **Supervaluationism** offers a compelling lens for the narrative's indeterminacy. Throughout the middle section of the novella, the proposition "Gregor is a son" is neither true nor false; it occupies a truth-value gap. The family lives within this gap. They do not kill him immediately (which would treat "not a son" as true), nor do they care for him fully (which would treat "is a son" as true). They inhabit the indeterminacy, locking the door and leaving scraps. This semantic hesitation mirrors their moral limbo. However, supervaluationism typically treats indeterminacy as a logical feature, whereas Kafka presents it as a lived agony. For Gregor, the truth-value gap is not a logical puzzle but a state of existential suspension where he is neither welcomed nor released.

  Finally, **contextualism** illuminates the shift in the father's aggression. Early in the story, the context is the loss of income; Gregor is a failed provider but still a son. Later, the context shifts to domestic integrity and hygiene. When the father throws apples, he is enforcing the boundaries of the home against an intruder. The term "family member" is context-sensitive: in the context of biology, Gregor belongs; in the context of the洁净 (clean) bourgeois household, he is excluded. The violence occurs when the context shifts decisively from "care for the sick" to "protection of the home."

  #### The Apple and the Ashes: Violating Tolerance

  Two scenes crystallize the breakdown of the tolerance principle. The first is the father's bombardment of Gregor with apples. One apple lodges in Gregor's back, remaining there as a visible monument to the family's rejection. This act is not a small adjustment; it is a wound that festers. Yet, it is preceded by small steps: the father's uniform, his stance, the hissing. The violence seems to emerge from a accumulation of minor irritations that suddenly justify a lethal response. The apple represents the collapse of the sorites series into a sharp, painful fact. It is the moment the vague threat becomes concrete injury.

  The second scene is the disposal of the body. The cleaning woman does not treat the corpse with the reverence due a human son; she pokes it with her broom and declares it "quite wasted away." She functions as the precisifier who resolves the vagueness. By categorizing the remains as refuse, she collapses the truth-value gap. Her casual demeanor highlights the horror of the sorites conclusion: if we accept every small step of dehumanization, the final step (treating a human corpse like trash) becomes logically inevitable. The family's subsequent trolley ride, feeling relieved and hopeful, confirms that the moral sorites has reached its conclusion: the removal of the vague element restores clarity to their lives.

  #### Resistance to Reduction: The Grotesque and the Will

  While the sorites framework illuminates the structure of the family's rationalization, *The Metamorphosis* resists reduction to a mere logical puzzle. A purely argumentative treatment of the sorites assumes the increments are imperceptible or neutral. Kafka's increments are often grotesque and charged with affect. The transformation is not a slow fading but a shocking ontological rupture at the outset. This suggests that the vagueness is not in the *fact* of Gregor's difference, but in the *response* to it.

  Furthermore, the family's cruelty is too willful to be dismissed as mere semantic confusion. Grete's final speech is not a confused musing on boundaries; it is a calculated argument designed to justify expulsion. She uses the language of necessity ("we must try to get rid of it"), but the motivation is exhaustion and resentment. Kafka shows that vagueness is often exploited rather than suffered. The family *uses* the indeterminacy of Gregor's status to avoid the hard work of defining their obligations. They hide behind the vagueness of "it" to avoid the specificity of "brother."

  Additionally, the narrative form itself challenges the epistemic and supervaluationist models. These models tend to be static, analyzing the truth conditions of propositions at a single time. Kafka's narrative is temporal. The sorites unfolds in time, and the passage of time itself alters the moral landscape. Gregor's decay is not just a loss of function; it is a history of neglect. The philosophical models struggle to account for the *accumulation of harm* as a constituent of identity. Gregor becomes less of a person not just because he looks different, but because he has been treated as less than a person for months. Identity is shown to be partly constituted by treatment, a dynamic insight that static logical frameworks miss.

  #### The Narrative Contribution to Philosophy

  What does *The Metamorphosis* add to the philosophical discussion that a purely argumentative treatment of the sorites misses? Firstly, it restores the *victim* to the paradox. Logical puzzles about heaps of sand are bloodless; the moral sorites involves suffering. Kafka forces the reader to experience the truth-value gap from the inside. We feel the indeterminacy of Gregor's status as pain. This suggests that vagueness is not merely a semantic defect but an ethical vulnerability. Where language is vague, morality becomes negotiable, and the powerless suffer the consequences of that negotiation.

  Secondly, the novella demonstrates that boundaries are often policed by violence rather than logic. The philosophical debate often seeks a correct theory of where the boundary lies (or if it exists). Kafka suggests that in human affairs, the boundary is established by the act of exclusion itself. The father's apple and the cleaning woman's broom do not discover the boundary; they create it. The "sharpness" of the boundary is a product of force, not metaphysics.

  For the novelist researching gradual identity change, Kafka's craft offers a crucial lesson: the erosion of identity is most convincing when tied to the erosion of language and space. Gregor loses his room, then his furniture, then his voice, then his name. The physical transformation is the catalyst, but the linguistic and spatial confinement is the mechanism. To depict gradual change effectively, one must not only describe the changing subject but also the changing reactions of the world around them. The sorites paradox is not just about the object changing; it is about the observer's willingness to update their categories.

  In conclusion, *The Metamorphosis* stands as a profound intervention in the philosophy of vagueness. It reveals the moral sorites as a mechanism of exculpation, allowing agents to commit atrocities through a series of tolerable steps. While supervaluationism, epistemicism, and degree theory provide tools to map the logical structure of Gregor's exclusion, Kafka's narrative exceeds them by embedding the paradox in time, affect, and power. The novella teaches us that the danger of vagueness lies not in our inability to define "person," but in our willingness to let the definition slide when it becomes inconvenient. The boundary of kinship is not found; it is made, and often, it is made by what we are willing to destroy.
