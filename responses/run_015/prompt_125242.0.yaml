answer: |-
  This is not a mess; this is a highly sophisticated draft of **Attitudinal Hedonism** (very close to Fred Feldman's *Pleasure and the Good Life*), but you have independently run into the exact objections that force hedonists to either bite hard bullets or modify the theory into something else.

  You are asking the right questions. Here is the consistency check you need for your reading group.

  ### 1. The Major Contradiction: (1) vs. (5)
  You asked if the worst tension is between (1) and (4), or if (3) makes (5) impossible.
  **The actual logical contradiction is between (1) and (5).**

  *   **(1)** says Pleasure is the *only* thing with intrinsic value.
  *   **(5)** says Pleasure only has value *if* its object is moral.

  If (5) is true, then the **moral worthiness of the object** is a necessary condition for value. That means value is determined by two things: the pleasure *and* the moral status of the object. Therefore, pleasure is no longer the *only* thing with intrinsic value. You have secretly introduced a non-hedonic value (virtue/morality) into your axiology.

  **The Fix:** You have two options here.
  *   **Option A (Bite the Bullet):** Keep (1), drop (5). Admit the torturer's pleasure *is* intrinsically good, but argue it is vastly outweighed by the victim's pain and the moral disvalue of the act (instrumentally). This preserves pure hedonism but feels counterintuitive.
  *   **Option B (Own the Hybrid):** Keep (5), modify (1). Admit you are no longer a pure hedonist. You are proposing a theory of **Organic Unities** (like G.E. Moore) or **Desert-Adjusted Hedonism** (like Feldman's later work). The value belongs to the *complex state of affairs* (taking pleasure in a worthy object), not the pleasure alone.

  **Recommendation:** For a reading group, Option B is more defensible. It is better to say "Pleasure is the primary source of value, but its value can be nullified or inverted by the worthiness of its object" than to claim purity while relying on non-hedonic constraints.

  ### 2. The Intentionality Problem: (3) vs. (8)
  You asked if (8) (background moods) kills (3) (pleasure as a pro-attitude toward a state).
  **It does not kill it, but it requires tweaking.**

  If pleasure is a "pro-attitude," it must be intentional (directed *at* something). Background moods feel objectless.
  *   **The Tweaks:** You can argue that background pleasure is a pro-attitude directed at **the world as a whole** or **one's own existence**. Feldman handles this by suggesting one can take attitudinal pleasure in the proposition "I am existing right now" without focusing on a specific sensory object.
  *   **Alternative:** Distinguish between *Propositional Pleasure* (happy *that* p) and *Sensory Pleasure* (feeling good). You can keep (3) as the definition of *value-bearing* pleasure (which must be intentional) and relegate (8) to mere sensory feeling which has no intrinsic value unless attended to attitudinally.

  **Recommendation:** Don't drop (3). Broaden the "object" of the pro-attitude to include general states of existence. This saves the theory from the "objectless mood" objection.

  ### 3. The "Itch" Problem: (7) vs. (3)
  You worry that scratching an itch (where you want the sensation to stop) undermines the idea of pleasure as a pro-attitude.
  **This is actually a strength of your view, not a weakness.**

  If pleasure were a *desire for continuation*, itch-scratching would break the theory. But since you define it as a **pro-attitude/approval directed at a current state**, it works perfectly.
  *   You approve of the state "itch being scratched right now."
  *   You simultaneously approve of the state "itch being gone forever soon."
  *   There is no contradiction in holding two pro-attitudes toward two different temporal states.

  **Recommendation:** Keep (7) as a counter-example to *Desire-Theories* of pleasure, but note that it is consistent with your *Attitudinal* theory (3).

  ### 4. Psychology vs. Value: (9) vs. (1)
  You asked if (9) clashes with (1).
  **You are correct: (9) is psychology, (1) is axiology.**

  *   **(1)** Ethical Hedonism: Pleasure is the Good.
  *   **(9)** Psychological Hedonism: We seek Pleasure.

  These are logically independent. You can believe Pleasure is the Good but humans sometimes seek Duty (rejecting 9). Or you can believe humans always seek Pleasure but Knowledge is also Good (rejecting 1).
  *   **However:** Be careful with the phrase "pursue pleasure for its own sake." If you pursue it for its own sake, you are treating it as an end. If it is the *only* thing with intrinsic value (1), then it is the only rational end.
  *   **The Nuance:** Your phrasing "that doesn't necessarily mean it's the only good thing" suggests you might be hedging (1). If you hold (1), you *must* believe it is the only good thing. If you think there are other good things (like justice), you must drop (1).

  ### Summary of Recommendations for the Reading Group

  If you have to drop or revise one thing to make the system coherent, **revise (1) or (5).** They cannot both stand as written.

  **The Least Painful Revision:**
  Adopt **Desert-Adjusted Attitudinal Hedonism**.
  1.  **Keep (2) & (3):** Pleasure is a heterogeneous pro-attitude.
  2.  **Keep (8) with a tweak:** Background pleasure is a pro-attitude toward "the way things are going generally."
  3.  **Modify (1) & (5):** Instead of saying "Only pure pleasures count," say: *"The intrinsic value of a pleasure is a function of the intensity of the pro-attitude **adjusted by** the worthiness of the object."*
      *   This admits that moral worthiness is a value-modifier (solving the torturer problem).
      *   This admits pleasure isn't the *sole* determinant of value (fixing the contradiction between 1 and 5).
      *   It keeps the spirit of hedonism (pleasure is the base currency) without the absurdity of valuing a torturer's joy.

  **Verdict:** It is not a mess. It is a coherent, modified Attitudinal Hedonism. Just be honest in the presentation that (5) forces you to abandon *strict* Hedonism (1) in favor of a hybrid view. That is a philosophically mature position to take.
