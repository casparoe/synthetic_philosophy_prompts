answer: |-
  Here are hard comments on the draft, structured around your five questions. I'm going to be direct: the core intuition is strong, but Step 1 is currently a sitting duck for a dialetheist, and you need to fortify it if this isn't to collapse into a terminological dispute.

  ### 1. Is the inertness argument sound, or does it smuggle in classicism at Step 1?

  **It smuggles in classicism, and this is the biggest vulnerability in the paper.**

  Your Step 1 assumes that a doxastic state must be represented by a single real number $x \in [0,1]$ and that accuracy is measured by distance from *the* truth value. But if the ontology is glutty, why should the doxastic state be classical?

  The dialetheist will say: "I don't have a single credence $x$. I have a credence in $P$ being true ($b$) and a credence in $P$ being false ($d$). Since $P$ is both, rationality requires $b=1$ and $d=1$."

  If they do this, your Brier score calculation ($(1-x)^2 + x^2$) is irrelevant because they aren't minimizing distance to a single point; they are satisfying two constraints simultaneously. They will reject the "score-twice-and-add" move not just as classical, but as category-mistaken. You are asking them to minimize error relative to a consistent world, but they believe the world is inconsistent.

  **How to fix it:**
  You need to argue that even if they adopt non-classical credences (pairs $\langle b, d \rangle$), the *decision rule* connecting those credences to action forces a collapse.
  *   **The Trap:** If they plug $\langle 1, 1 \rangle$ into an Expected Utility calculation, how do they combine the utilities?
      *   If they sum them ($1 \cdot U(True) + 1 \cdot U(False)$), they get a total utility.
      *   If they average them, they get the 0.5 case.
      *   If they use Maximin, they get the ignorance case.
  *   **The Real Argument:** The inertness isn't that the *credence* looks like ignorance (0.5). It's that the *choice profile* looks like ignorance.
      *   *Ignorant Agent:* Doesn't know if $P$. Hedges.
      *   *Glut-Knower:* Knows $P$ is both. Hedges.
      *   **The Charge:** The extra information (that $P$ is a glut) makes no difference to the action. If information is supposed to guide action, and glut-information guides action exactly as well as *no* information, then glut-information is practically inert.
      *   Shift the focus from "Your credence must be 0.5" (which they can deny) to "Your decision rule yields the same output as the ignorant agent's rule" (which is harder to deny without making radical changes to decision theory).

  ### 2. Ranking the Exits

  Here is the ranking from strongest to weakest, based on how much damage they do to your argument and how plausible they are for a dialetheist to maintain.

  **1. The Non-Classical Probability Exit (Strongest)**
  *   **The Move:** Adopt a probability function where $Pr(P) + Pr(\neg P) \neq 1$. Allow $Pr(P)=1$ and $Pr(\neg P)=1$. Then define Expected Utility differently (e.g., using upper/lower expectations or simply summing utilities).
  *   **Why it wins:** It blocks Step 1 entirely. If $Pr(P)=1$, they aren't "sitting at 1/2." They are fully believing $P$ *and* fully believing $\neg P$.
  *   **Your Counter:** You must argue that this breaks Decision Theory. If $Pr(P)=1$ and $Pr(\neg P)=1$, and the utilities are opposed (e.g., Bet on $P$ vs Bet on $\neg P$), does the agent take *both* bets? If so, they are susceptible to a Dutch Book (or a "Dutch Book analogue"). If they don't take both, what rule selects one? If the rule is "pick arbitrarily," you're back to inertness.
  *   **Cost to them:** High. It requires rebuilding decision theory from the ground up.

  **2. The Scope Restriction Exit (Very Strong)**
  *   **The Move:** "Dialetheism is only for semantic/set-theoretic paradoxes. Vagueness is handled by epistemicism or supervaluationism." (Priest has flirted with this; others hold it firmly).
  *   **Why it wins:** It removes your Step 3. If there are no applied gluts in vagueness or law, your "cash value" argument has no target.
  *   **Your Counter:** This concedes that dialetheism is a logical curiosity with no practical application. It saves the logic by sacrificing the philosophy. You can argue that a dialetheism that doesn't apply to the messy world (where vagueness lives) is philosophically toothless.
  *   **Cost to them:** Moderate. It limits the ambition of the view.

  **3. The Glutty Verdict Exit (Moderate)**
  *   **The Move:** "Yes, the act is both choice-worthy and not. So what? Reality is contradictory."
  *   **Why it's weaker:** It bites a massive bullet. It implies that in borderline cases, there is no fact of the matter about what you should do, even in principle. This makes moral/legal deliberation fundamentally broken in borderline cases.
  *   **Your Counter:** This is where you press the "criticizability" point. If I do the act, am I blameworthy?
      *   If Yes: Then it wasn't truly choice-worthy.
      *   If No: Then it wasn't truly forbidden.
      *   If Both: Then blame is incoherent.
      *   This leads to a *normative explosion* that is worse than logical explosion.
  *   **Cost to them:** High normative cost.

  **4. The No-Detachment Exit (Weak)**
  *   **The Move:** "P is glutty, but 'If P then Obligation Q' doesn't detach."
  *   **Why it's weak:** It requires a relevant conditional in the deontic logic. While technically possible, it's unmotivated. Why would the link between "This is a person" and "Don't kill persons" break just because "person" is vague? That makes the moral law sensitive to logical quirks in a way that seems ad hoc.
  *   **Your Counter:** This makes morality logically fragile. It suggests we can't reason from facts to obligations in borderline cases.

  **5. Truth Doesn't Constrain Credence (Weakest)**
  *   **The Move:** "Truth is one thing; rational belief is another."
  *   **Why it's weak:** It severs the link between metaphysics and epistemology. If truth doesn't guide belief, why care about truth?
  *   **Your Counter:** This abandons the normative force of truth entirely.

  **Strategy:** Spend your 2k words fighting **Exit 1 (Non-Classical Probability)** and **Exit 3 (Glutty Verdicts)**. Exit 2 is a factual claim about their view you can't force them to change, but you can highlight its cost. Exit 1 is where the technical battle is.

  ### 3. Is vagueness the right test case?

  **Vagueness is good, but Normative Conflict is better.**

  *   **Vagueness:** The link from "is a person" (ontic glut) to "don't kill" (deontic glut) requires a bridge principle. The dialetheist can cut the bridge (Exit 4).
  *   **Normative Conflict:** Consider inconsistent laws or moral dilemmas where the contradiction is *already* in the norms. "Statute A requires X," "Statute B forbids X." Both statutes are valid law.
      *   Here, the glut isn't in the world (vagueness); it's in the rules themselves.
      *   If the dialetheist says "It is both law and not law that you do X," the decision problem is immediate.
      *   **Why it's stronger:** You don't need to argue that vagueness generates gluts (which is contested). You can say: "Even if you *only* accept gluts in normative systems (like law), my argument applies."
      *   **The Inertness:** If the law is contradictory, the dialetheist judge says "Both verdicts are true." But they still have to issue *one* ruling. If their logic tells them "Both are correct," it gives them no guidance on which to write down. The ignorant judge ("I don't know which statute applies") is in the exact same practical position.
      *   **Recommendation:** Keep vagueness as the primary example (it's more philosophical), but use legal/normative contradiction as the *reductio*. It's harder for them to deny that laws can contradict, and harder to deny that judges must decide.

  ### 4. Brutal question: Is this interesting, or a footnote?

  **It is interesting, but only if you frame it correctly.**

  *   **The Risk:** There is existing literature on paraconsistent decision theory (e.g., by Paris, Williams, and discussions surrounding Priest's *Uncertain Reasoning*). The objection that "paraconsistent probability collapses to classical ignorance" is not unknown.
  *   **The Reframe:** Don't frame it as "Paraconsistent logic breaks decision theory." Frame it as **"Dialetheism fails to distinguish knowledge from ignorance in practical contexts."**
      *   The standard objection is: "You can't reason consistently."
      *   Your objection is: "Even if you can reason, you can't *act* differently than the ignorant."
      *   This attacks the *utility* of the view. Dialetheism is often sold as a way to handle "recalcitrant data" (like vagueness) without revisionism. You are arguing that in the one place revisionism matters (action), the view offers no advantage over agnosticism.
      *   **Is it a stock answer?** The stock answer is "We use non-classical probabilities." Your paper needs to explain why *that* answer fails to save the practical guidance. If you can show that non-classical probabilities *also* lead to inertness (because they still can't rank acts uniquely in glut-cases), you have a genuine contribution.
      *   **Verdict:** It's worth writing. It shifts the debate from "Is LP consistent?" to "Is LP useful?" which is where general philosophy audiences live.

  ### 5. Technical Corrections (Logic & Behavior)

  You are blending LP and Relevant Logics slightly. Here is the cleanup:

  *   **LP (Logic of Paradox):** This is Priest's preferred logic for dialetheism.
      *   **MP:** In LP, Modus Ponens ($A, A \to B \vdash B$) is **invalid** for the material conditional. If $A$ is a glut (i) and $B$ is false (0), $A \to B$ is 0. So premises are designated (i is designated), conclusion is not (0 is not).
      *   **Detachment:** Priest handles this by adding a *detachable* conditional (often a relevant-style arrow) to the language. So in practice, dialetheists *do* have detachment, but restricted to the specific conditional.
      *   **Your Text:** You say "no detachable conditional." This is technically false for modern dialetheism (they have one, it's just not the material one). You should say: "Detachment is restricted to a specific conditional, which complicates the inference from factual gluts to deontic gluts."
  *   **Disjunctive Syllogism (DS):** $A \vee B, \neg A \vdash B$. This fails in LP. This is crucial for your Step 2. If the agent tries to reason "Either I do A or I don't. I shouldn't do A. Therefore I should do not-A," DS might fail if the premises are glutty.
  *   **Credence:** In LP, the standard semantic value is $\{1, i, 0\}$. The "glut" is $i$.
      *   Your Step 1 treats the glut as "1 and 0". This is fine for a philosophical paper, but be aware that formally it's a third value $i$ which *inherits* properties of 1 and 0.
