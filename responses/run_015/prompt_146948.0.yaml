answer: |-
  Here is a decision procedure designed for your constraints: paper-and-pen compatible, executable in 20 minutes, and calibrated to detect *signaling* rather than just *accuracy*.

  ### The Frame-Stress Protocol (FSP)

  **Time Allocation:** 15 minutes for scoring, 5 minutes for board discussion.
  **Materials:** Printed pre-proposal, this checklist, pen.
  **Scoring:** Each question is rated **Pass (2)**, **Gray (1)**, or **Fail (0)**.
  **Threshold:** Total < 5 = "Cascade-Driven/Return." Total ≥ 5 = "Proceed to Full Review."

  #### Step 1: The Substitution Test (Vocabulary vs. Logic)
  *Read the Abstract and Methods.*
  **Question:** If you replace the specific framework name (e.g., "predictive processing," "do-calculus") with a generic placeholder (e.g., "theoretical model," "statistical analysis"), does the core logic of the proposal collapse?
  *   **Pass (2):** The logic collapses. The specific mechanics of the frame are doing the heavy lifting (e.g., "minimizing variational free energy" is the specific mechanism being tested).
  *   **Gray (1):** The logic holds, but the specific frame adds precision to the *interpretation* of results.
  *   **Fail (0):** The logic holds perfectly. The frame is purely decorative (e.g., "We will interview visitors to understand their predictive models" where "predictive models" could be swapped for "thoughts" without changing the method).
  *   *Stop Rule:* If **Fail (0)** here, mark "High Herding Risk" and move to Step 4 to confirm.

  #### Step 2: The Friction Test (Cost & Limitation)
  *Scan for limitations sections or methodological caveats.*
  **Question:** Does the applicant explicitly state where this framework *fails* or is *costly* to apply to their specific data?
  *   **Pass (2):** Specific friction identified (e.g., "Archival letters lack the counterfactual density required for full identification, so we will bound the estimates").
  *   **Gray (1):** Generic limitations acknowledged (e.g., "Data may be noisy").
  *   **Fail (0):** The framework is presented as a "key" that unlocks the data without distortion. No costs acknowledged.
  *   *Note:* This is the primary filter for "hollow" math or theory.

  #### Step 3: The Exit Ramp (Falsifiability of the Frame)
  *Look at the Expected Outcomes.*
  **Question:** Is there a specific empirical result that would cause the applicant to *abandon* this framework for this problem?
  *   **Pass (2):** Yes. (e.g., "If prediction error signals do not correlate with dwell time, we will reject the predictive coding account").
  *   **Gray (1):** They would modify the parameters but keep the frame.
  *   **Fail (0):** No exit condition. The frame is treated as an ontological truth rather than a tool (e.g., "We will interpret all behavior through the lens of...").
  *   *Hard Case Check:* If the applicant *rejects* the dominant cascade (e.g., "No computational models"), they must offer an Exit Ramp for *their* alternative. If their stance is "Ethnography is the *only* way," they Fail.

  #### Step 4: The Directionality Check (Problem vs. Solution)
  *Read the Introduction's opening paragraph.*
  **Question:** Is the research question stated *before* the framework is introduced?
  *   **Pass (2):** Problem first. (e.g., "We do not know how aesthetic value is updated. We propose using X to solve this.").
  *   **Gray (1):** Intertwined. (e.g., "Using X, we investigate aesthetic value.").
  *   **Fail (0):** Frame first. (e.g., "Predictive processing offers a new way to look at everything. Here we apply it to museums.").
  *   *Stop Rule:* If **Fail (0)** here AND **Fail (0)** in Step 1, immediate "Return."

  ---

  ### Application to Hypothetical Pre-Proposals

  #### Case 1: Predictive Coding & Aesthetic Judgment
  *Proposal:* Uses predictive processing to explain why museum visitors linger at certain abstract paintings. Measures dwell time and pupil dilation.
  *   **Step 1 (Substitution):** **Gray (1).** "Prediction error" is essentially swapped for "surprise." The method (eye-tracking) doesn't strictly require the PC framework to function, though the interpretation does.
  *   **Step 2 (Friction):** **Fail (0).** No mention of the difficulty in mapping pupil dilation to specific hierarchical prediction errors. Assumes a direct readout.
  *   **Step 3 (Exit Ramp):** **Gray (1).** Would adjust the model parameters, but assumes the brain *is* a prediction machine regardless of outcome.
  *   **Step 4 (Directionality):** **Fail (0).** Opens with "Predictive processing is the new paradigm for perception..."
  *   **Total Score:** 2/8.
  *   **Verdict:** **Return.** This is classic framing herding. The vocabulary signals "cognitive science" without the mechanistic commitment.

  #### Case 2: Pure Ethnography & Social Cognition (The Unpleasant Flag)
  *Proposal:* Rejects computational/representational accounts of social cognition. Proposes 12 months of participant observation in a scientific lab to understand "distributed knowing."
  *   **Step 1 (Substitution):** **Pass (2).** The logic collapses without the ethnographic frame; "distributed knowing" is specific to this approach.
  *   **Step 2 (Friction):** **Gray (1).** Acknowledges generalizability issues, but treats "bias" as a feature, not a methodological cost to be managed.
  *   **Step 3 (Exit Ramp):** **Fail (0).** The proposal argues that computational models are *category errors* for this phenomenon. There is no data that would make them adopt a model; it is an ideological boundary, not a methodological one.
  *   **Step 4 (Directionality):** **Pass (2).** Problem (how scientists coordinate) is stated first.
  *   **Total Score:** 5/8.
  *   **Verdict:** **Borderline/Return.**
  *   **Why this is unpleasant:** This proposal likely fails Step 3 not because it's bad philosophy, but because it refuses to play the "tool" game. On a cognitive science board, refusing to specify an exit ramp for your *ontological stance* looks like dogma. The procedure flags this as "Cascade-Driven" (specifically, *Counter-Cascade Herding*) because the applicant is signaling virtue by rejecting the dominant frame rather than justifying the method's utility for *this specific grant*. It punishes philosophical purity in a pragmatic funding context.

  #### Case 3: Do-Calculus on Archival Letters
  *Proposal:* Uses causal inference (do-calculus) on correspondence between 19th-century philosophers to map influence networks, accounting for unmeasured confounders (e.g., shared education).
  *   **Step 1 (Substitution):** **Pass (2).** Standard network analysis would fail to account for the specific confounders identified; the calculus is necessary for the causal claim.
  *   **Step 2 (Friction):** **Pass (2).** Explicitly states that archival gaps prevent full identification, so they are calculating *bounds* rather than point estimates.
  *   **Step 3 (Exit Ramp):** **Pass (2).** If the bounds are too wide to be informative, they will revert to descriptive network history.
  *   **Step 4 (Directionality):** **Gray (1).** Problem and method are tightly coupled, but the problem (influence mapping) is clear.
  *   **Total Score:** 7/8.
  *   **Verdict:** **Proceed.** This looks like rational convergence. The tool is expensive (high friction), and they acknowledge the cost.

  ---

  ### Meta-Analysis: Confidence & Limitations

  **Confidence Level: Medium-Low (approx. 60%)**
  I am moderately confident this procedure will filter out the most egregious "buzzword salad" proposals (like Case 1). However, I am **least sure about Step 3 (The Exit Ramp)** holding up as a discriminator between herding and convergence.
  *   **Why:** Sophisticated herders know to write fake exit ramps ("If X doesn't happen, we will pivot to Y"). Conversely, genuine innovators (like the Ethnography case) often have deep ontological commitments that look like "no exit ramps" to a panel expecting instrumentalism. This step relies heavily on the board's ability to smell sincerity, which is not a reliable metric in 20 minutes.

  **Judgment Calls Dressed as Checks:**
  1.  **Step 2 (Friction):** What counts as a "specific" friction is subjective. A philosopher might see a deep conceptual tension as "friction," while a scientist sees it as "unsolved." Your board's composition will bias this score.
  2.  **Step 3 (Exit Ramp):** Distinguishing between a "methodological tool" and an "ontological commitment" is a philosophical judgment, not a procedural one. Flagging the Ethnography proposal admits that this procedure favors instrumentalist science over foundational critique.

  **Failure Modes:**
  *   **The "Hollow Math" Approval:** The procedure might approve Case 3 (Do-calculus) even if the applicant doesn't actually know how to run the calculus, provided they *write* about the constraints correctly. It tests *rhetorical competence* with the frame, not *technical competence*.
  *   **The "Innovator Penalty":** As seen in Case 2, proposals that challenge the board's paradigm will score lower on "Exit Ramps" because they view their method as necessary, not contingent. You will systematically underfund paradigm challenges.

  **What This Procedure Cannot Do:**
  *   **Career Impact Prediction:** This procedure cannot tell you if funding the Ethnography proposal will ruin the applicant's career because they are "too philosophical" for science departments, or if funding the Predictive Coding proposal will hurt them because it's "too shallow" for philosophy departments. It assesses the *text*, not the *trajectory*.
  *   **Detecting Sophisticated Plagiarism:** If an applicant herds a frame they don't understand but cite the right papers (which you can't check), Step 1 and 2 might still Pass if their rhetoric is good.
  *   **Truth Tracking:** This does not determine if Predictive Processing is *actually* true or useful. It only determines if the applicant is using it *consistently*.

  **Final Advice:**
  Use the **Step 3 (Exit Ramp)** score as the discussion starter. If a proposal scores low there, ask the applicant (if interviews are possible) or discuss in the board: "Is this a tool they are using, or a religion they are preaching?" That distinction is where your 20 minutes actually matter.
