      *   **Constraints:** 20 minutes per proposal, no citation databases, small board (8 awards/40+ pre-proposals).
      *   **Requirements:**
          *   Sequence of questions with sufficient answer criteria.
          *   Stop rules (reject vs. proceed).
          *   Handle hard cases (genuine fit, incompetent rejection, superficial citation).
          *   Apply to three specific hypothetical pre-proposals (Predictive Coding/Aesthetics, Ethnography/Social Cognition, Do-calculus/History of PhilSci).
          *   Ensure one outcome is counter-intuitive/unpleasant (likely the ethnography one).
          *   Explicitly flag judgment calls vs. checks.
          *   Identify failure modes (approving hollow projects).
          *   State confidence levels, specifically regarding the distinguishability of herding vs. convergence.
          *   Flag limitations (career impact prediction).
          *   *Negative Constraint:* Do not ask for citations or a reading list.

  2.  **Deconstruct the Problem:**
      *   **Framing Herding:** Using a buzzword (e.g., "predictive processing") because it's funded, not because it's necessary. The framework is decorative.
      *   **Rational Convergence:** Using a buzzword because it is genuinely the best tool for the specific problem, even if it's popular.
      *   **The Constraint:** No external verification (citations). Must rely on internal consistency and problem-solution fit within the text.
      *   **The Time Limit:** 20 minutes means the procedure must be fast, heuristic-based, not exhaustive.

  3.  **Drafting the Decision Procedure (The "Frame-Stress Test"):**
      *   *Goal:* Stress the connection between the *Problem* and the *Frame*.
      *   *Step 1: Problem Definition.* Is the problem specific or vague? Herding often hides vague problems behind specific frames.
      *   *Step 2: Frame Necessity.* Could this be done without the frame? If yes, why use it?
      *   *Step 3: Operationalization.* Does the method actually use the frame's mechanics, or just its vocabulary?
      *   *Step 4: Failure Conditions.* Does the applicant know what would falsify the frame's application?
      *   *Step 5: The "So What?"* If the frame works, what specific insight is gained that a neutral description wouldn't provide?

      *Refining the Steps for Speed:*
      1.  **The Substitution Test:** Can I swap the buzzword for a generic term without breaking the logic?
      2.  **The Mechanism Test:** Is there a specific mechanism from the frame being measured/manipulated?
      3.  **The Cost Test:** Does the applicant acknowledge the cost/limitation of using this frame?
      4.  **The Exit Ramp:** Is there a condition where they would abandon the frame?

      *Let's formalize this into a "Paper-and-Pen" Checklist.*

  4.  **Developing the Hypothetical Cases:**
      *   *Case 1 (Predictive Coding/Aesthetics):* Likely herding. Predictive coding is hot. Applying it to "museum visitors" often lacks specific neural/behavioral markers of prediction error.
      *   *Case 2 (Ethnography/Social Cognition):* The "Counter-Intuitive" Fail. Rejecting computational frames is valid, but if the proposal frames this rejection *as* the innovation without offering a robust alternative methodology, it might look like "anti-herding herding" or just methodological weakness disguised as philosophical stance. The prompt asks for this one to be flagged unfairly.
      *   *Case 3 (Do-calculus/History):* High risk of hollow math. Using causal inference on archival letters is trendy but often data-sparse. Needs to pass the "Mechanism Test."

  5.  **Addressing the Meta-Requirements:**
      *   *Confidence:* Be honest. Distinguishing herding from convergence is epistemically hard without outcome data.
      *   *Judgment Calls:* Highlight where board bias enters (e.g., what counts as a "mechanism").
      *   *Failure Modes:* Acknowledge that good ideas can look bad in 20 minutes (Type I/II errors).
      *   *Career Impact:* Explicitly state the procedure cannot assess this.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* The "Frame-Stress Protocol" (FSP).
      *   *Structure:* 4 Questions. Pass/Fail/Gray.
