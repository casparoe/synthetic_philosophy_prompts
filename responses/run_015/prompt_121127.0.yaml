      *   **Key Point to Hit:** Distinguish between *subjective propriety* (blamelessness) and *objective propriety* (meeting the norm). The student conflates these.

  5.  **Refining the "Unknown Defeater" Philosophy:**
      *   Does an unknown defeater undermine knowledge?
      *   *Defeasibility Theory:* Yes. If there is a true proposition that, if known, would defeat justification, knowledge is absent (even if the subject doesn't know it).
      *   *Reliabilism:* The process (trusting a biased expert) is unreliable, so no knowledge.
      *   *Williamson (KNA):* Knowledge is factive. If it's a Gettier case, it's not knowledge. Therefore, assertion violates the norm, even if the speaker is excusable.
