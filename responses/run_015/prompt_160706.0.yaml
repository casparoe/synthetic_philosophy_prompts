      *   **Topic:** Two-Envelope Paradox.
      *   **Pedagogical Goal:** Experiential learning ("felt rather than been told").
      *   **Specific Learning Objectives:**
          1.  The switching argument is seductive (generate it themselves).
          2.  The "50/50 half-or-double" claim fails at distribution boundaries (collide with the ceiling).
          3.  Scale/Cost indifference is a symptom, not a virtue (works for billions, works with fees).
          4.  *Crucial:* Opening the envelope is *not* epistemically inert (conditional strategies beat blind strategies, even if blind switching = blind keeping).
      *   **Structure:** Three rounds (Blind, Peek, Friction).
      *   **Constraints:** No real money (points), one student as "House", minimal facilitator intervention (no EV/priors talk until end), specific debrief mapping.
      *   **Requirements:** Materials, Prep, Round details, Prediction Sheet, Facilitator Notes, Debrief Plan, Troubleshooting, Limitations.

  2.  **Deconstruct the Paradox & The Game Design:**

      *   *The Paradox:* You have Envelope A. Envelope B has either $2A$ or $A/2$. Expected value of switching = $0.5(2A) + 0.5(A/2) = 1.25A$. So switch. But then you have B, and the same logic applies.
      *   *The Flaw:* The assumption that $P(B=2A | A=x) = 0.5$ for *all* $x$ implies an improper prior (uniform distribution over infinite money). In reality, there's a maximum amount.
      *   *The "Epistemically Inert" Point:* Blind switching yields the same EV as blind keeping (symmetry). But *conditional* switching (e.g., "switch if $x < K$") can yield positive EV if you know something about the distribution.
      *   *Game Mechanics:*
          *   Need pairs $(x, 2x)$.
          *   Need a maximum cap ($M$) so the "50/50" assumption breaks.
          *   Need points system.
          *   Need "House" to track bank.

  3.  **Drafting the Rounds:**

      *   **Round 1 (Blind):** Pick envelope, offered switch. Do it 5-6 times. *Goal:* Feel the urge to switch, realize it doesn't matter (net zero).
      *   **Round 2 (Peek):** Look at value, decide. *Goal:* Discover the ceiling. If I see a huge number, I shouldn't switch. If I see a small number, I should. This addresses Objective 2 & 4.
      *   **Round 3 (Friction):** Switch costs 1 chip. *Goal:* Show that the "1.25x" logic fails because if it were true, you'd pay to switch forever. Addresses Objective 3.

  4.  **Addressing Specific Constraints:**

      *   *Math Level:* Keep arithmetic simple. Powers of 2 are good ($2, 4, 8, 16...$).
      *   *Time:* 55 mins is tight. 12 + 20 + 10 = 42 mins. Leaves 13 mins for intro/debrief.
      *   *House:* One student tracking points is good for "closed system," but might be boring. Let's make the House the "Banker" who pays/collects, rotating or just one responsible student. Let's stick to one "Banker" to keep it simple.
      *   *Materials:* Envelopes are classic but slow to stuff. Cards are faster. Let's use sealed cards/papers inside generic envelopes or just folded paper. Actually, to save prep time: Pre-printed slips in opaque envelopes.
      *   *Distribution:* Needs a hard ceiling. Let's say pairs are $(2^k, 2^{k+1})$ for $k=0$ to $N$. Max value $2^{N+1}$.
      *   *Prediction Sheet:* Needs to capture intuition before math ruins it.

  5.  **Refining the "Epistemically Inert" Point (Objective 4):**

      *   This is the hardest part to stage.
      *   *Blind Round:* Switching vs. Keeping should average out the same.
      *   *Peek Round:* Students need to realize that seeing the number gives information *relative to the hidden maximum*.
      *   *Debrief:* Must highlight that *information* changes the odds, even if the *blind* odds are 50/50.

  6.  **Developing the Materials & Prep:**

      *   *Pairs:* $(1, 2), (2, 4), (4, 8), ..., (256, 512)$. Max 512.
      *   *Why?* Easy doubling/halving. No decimals.
      *   *Quantity:* 16 students. 6 rounds per student = 96 pairs needed. Let's prepare 100 pairs.
      *   *Prep:* Write pairs on slips, put in envelopes. Shuffle.
      *   *Banker:* Needs a ledger sheet.

  7.  **Facilitator Constraints:**

      *   *Silence:* Don't explain EV. Don't name the paradox.
      *   *Prompts:* "Why did you switch?" "Did anyone feel unsure?"
      *   *Reveal:* Only show the max value at the very end of Round 2.

  8.  **Troubleshooting:**

      *   *The "Math Whiz":* Will shout "Expected Value!" immediately. *Fix:* Ask them to hold that thought for the "Banker's Challenge" (Round 3).
      *   *The "Disengaged":* Just picking randomly. *Fix:* Make the points matter (bragging rights/snack).
      *   *Arithmetic Errors:* Keep numbers powers of 2.
      *   *Time:* Strict timing on rounds.

  9.  **Addressing the "Impossible to Reproduce" Point:**

      *   The user suspects it's the "no probability distribution over all amounts" point.
      *   *Verdict:* Yes. The game shows a *finite* distribution. It proves the 50/50 rule fails *here*. It doesn't prove it *must* fail in all conceivable universes without a lecture on improper priors.
      *   *Solution:* Acknowledge the game uses a finite bag. The paradox arises when you imagine the bag is infinite. The game breaks the paradox by making the bag finite.

  10. **Writing the Plan (Iterative refinement):**

      *   *Intro:* Keep it under 5 mins.
      *   *Round 1 (12 mins):* Blind. 5 trials. Tally Keep vs. Switch. Result: Tie.
      *   *Round 2 (20 mins):* Peek. 5 trials. Allow strategy discussion mid-round? No, let them struggle first, then discuss. *Correction:* Let them play 3 rounds, pause for strategy, play 2 more. This helps them discover the ceiling.
      *   *Round 3 (10 mins):* Cost to switch. 3 trials.
      *   *Debrief (13 mins):* Connect experiences to the 4 objectives.
      *   *Prediction Sheet:* Pre-game: "If you see \$100, do you switch?" Post-game: "Why?"

  11. **Final Review against Constraints:**

      *   *55 mins?* Tight. Need to be strict.
      *   *No projector?* Whiteboard only.
      *   *Uneven math?* Powers of 2 solves this.
      *   *House?* Yes, Banker role.
      *   *Objectives?*
          1.  Seductive argument: Round 1 discussion.
          2.  Ceiling: Round 2 high numbers.
          3.  Scale/Cost: Round 3.
          4.  Info matters: Round 2 vs Round 1 comparison.

  12. **Self-Correction on "House":**
      *   If the Banker pays out of their own pocket (points), they might go bankrupt if students win.
      *   *Fix:* The Banker manages the "Club Treasury." Points are zero-sum among students + Treasury. Or, simpler: The Banker just records. The "House" doesn't lose, the *system* loses if EV > 0.
      *   *Better Fix:* The prompt asks for a "closed-system element... any gain to the room has to come out of somebody's column."
      *   *Implementation:* The Banker holds the "Bag of Holding." If students win, Banker loses points. If students lose, Banker gains. This makes the Banker motivated to catch errors.

  13. **Final Polish:** Check tone. Needs to be practical, authoritative, but respectful of the teacher's constraints. Ensure the "Epistemically Inert" point is clearly explained in the debrief section, as that's the trickiest philosophical lift.

      *(Self-Correction during drafting)*: Wait, if I use powers of 2 ($1, 2, 4...$), and the pair is $(2^k, 2^{k+1})$, seeing a 4 means the other is 2 or 8. Seeing 512 (max) means other is 256. Seeing 1 (min) means other is 2.
      *   *Crucial Detail:* I need to make sure the distribution of pairs is uniform (equal chance of drawing pair (1,2) as (256, 512)). If I just shuffle envelopes, this holds.
      *   *Wait, one nuance:* If I see 4, is it the low end of (4,8) or high end of (2,4)? In a uniform distribution of pairs, yes, it's 50/50 *unless* I hit the max/min.
      *   *The "Ceiling" Collision:* If the max pair is (256, 512), and I see 512, I *know* the other is 256. I won't switch. This breaks the "always switch" logic. This is the key moment.

      *Let's finalize the numbers.* Max 512 is good. Min 1.
      Pairs: (1,2), (2,4), (4,8), (8,16), (16,32), (32,64), (64,128), (128,256), (256,512).
      Total 9 distinct pairs.
      Need ~100 envelopes. ~11 of each pair type.
      This ensures someone eventually sees 512.

      *Wait, Round 2 Strategy:* If they see 256, should they switch? 50% chance other is 128, 50% chance other is 512. EV = 0.5(128) + 0.5(512) = 320 > 256. Yes switch.
      If they see 512, other is 256. EV = 256 < 512. Don't switch.
      So the strategy is: Switch unless you see the Max.
      Does this beat "Always Keep"?
      "Always Keep" EV = Average of all numbers in play.
      "Switch unless Max" EV = Slightly higher because you avoid the loss on the Max case.
      *Wait, is this true?*
      Let's check the math.
      Pairs $(x, 2x)$.
      If you Keep: You get $x$ or $2x$ with 50% chance each (since envelope assignment is random). Average per pair = $1.5x$.
      If you Switch unless Max ($M$):
      For pair $(x, 2x)$ where $2x < M$: You switch. You get $2x$ or $x$. Average $1.5x$. (Same as keep).
      For pair $(M/2, M)$: You see $M/2$ (switch to $M$), you see $M$ (keep $M$).
      Wait, if you see $M$, you keep. If you see $M/2$, you switch.
      In the $(M/2, M)$ pair:
      50% chance you hold $M/2$. You switch. You get $M$.
      50% chance you hold $M$. You keep. You get $M$.
      Result: You always get $M$.
      Average for this pair = $M$.
      "Always Keep" average for this pair = $0.75M$.
      So yes, the conditional strategy *does* beat the blind strategy. This validates Objective 4.

      *Okay, plan is solid.* Proceed to write.

      *One last check on "House":* If the Banker loses points, they might get annoyed.
      *Mitigation:* Banker gets a "salary" (fixed points) or the "loss" is from a generic club pool, not the student's personal score.
      *Decision:* Banker manages the "Club Pool." Students compete for individual high score. Banker's goal is to keep the Pool solvent. This makes them a vigilant auditor without punishing them personally.

      *Prediction Sheet:* Keep it simple.
      *Facilitator Notes:* Emphasize silence on math.
      *Debrief:* Map rounds to objectives clearly.

      *Limitations:* The "infinite distribution" impossibility proof is the lecture part. The game shows *a* finite distribution. I need to be clear on that.

