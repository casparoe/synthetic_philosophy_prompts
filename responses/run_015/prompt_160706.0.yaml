answer: |-
  Here is a complete run-sheet for your 55-minute session. It is designed to be low-prep, mathematically safe for mixed abilities, and philosophically precise.

  ### **Session Title:** The Exchange
  **Time:** 55 Minutes
  **Students:** 13–16 (Ages 16–18)
  **Materials:** Whiteboard, markers, printed slips, opaque envelopes, prediction sheets.

  ---

  ### **1. Materials & Preparation (Do this before class)**

  **The Money (Points):**
  *   Print **100 slips of paper**.
  *   On each slip, write a power of 2: **1, 2, 4, 8, 16, 32, 64, 128, 256, 512**.
  *   **The Pairs:** You need to create 50 *pairs* of envelopes. Each pair contains $(x, 2x)$.
      *   Make 5 sets of the following 9 pairs: $(1,2), (2,4), (4,8), (8,16), (16,32), (32,64), (64,128), (128,256), (256,512)$.
      *   *Total:* 45 pairs. Add 5 extra $(128, 256)$ pairs to ensure the high numbers appear often enough in a short game. Total 50 pairs.
  *   Put each pair into two identical opaque envelopes. Mark the *outside* of the pair with a small ID number (e.g., "Pair #12") so you can verify later if needed, but students shouldn't see this.
  *   **Prep Time:** ~20 minutes.

  **The Ledger:**
  *   Print one **"Banker's Sheet"** with columns: *Round, Student ID, Action (Keep/Switch), Value Held, Net Change*.
  *   Print 16 **"Player Ledgers"** (simple grid for them to track their own points).

  **The Prediction Sheet (Half-page):**
  *   *Top:* "Before we begin: If you pick an envelope and see **$64** inside, and you are told the other envelope has either **$32** or **$128**, do you switch? Why?"
  *   *Bottom:* "If switching is good, why not switch back? If switching is neutral, why does seeing the number matter?" (Leave blank for post-game).

  **Room Setup:**
  *   Desks in a cluster or U-shape.
  *   Whiteboard divided into three sections: **Round 1**, **Round 2**, **Round 3**.

  ---

  ### **2. The Roles**

  *   **The Facilitator (You):** You deal the envelopes and enforce time. You **cannot** mention probability, expected value, or the name of the paradox.
  *   **The Banker (1 Student):** Choose a student who is organized but not necessarily the loudest math whiz. Their job is to verify values and track the "Club Pool."
      *   *Instruction to Banker:* "You hold the Club Pool (start with 10,000 points). If students win, you pay them from the pool. If they lose, they pay you. Your goal is to keep the pool solvent. If you spot a math error, call it."
  *   **The Players (Rest of Class):** They play for individual points. Top 3 scores get "Philosopher King/Queen" status (or actual snacks at the last meeting).

  ---

  ### **3. The Rounds (42 Minutes Total)**

  #### **Round 1: The Blind Switch (12 Minutes)**
  *   **Goal:** Generate the seductive argument; establish that blind switching is neutral.
  *   **Setup:** Each student takes one envelope from a shuffled pile. **Do not open it.**
  *   **Action:**
      1.  Tell them: "You hold an envelope. The other envelope in the pair has either half or double what you hold. You may Keep or Switch. You will not look inside until the end of the round."
      2.  Ask for a show of hands: "Who wants to switch?" (Most will switch or be indifferent).
      3.  Execute the swap for those who want it.
      4.  **Repeat 5 times.** (Collect envelopes, reshuffle, redeal).
      5.  **Reveal:** Everyone opens. Banker records scores.
  *   **Facilitator Script:** "Did anyone feel they gained an advantage by switching without looking? Why did you choose to switch?"
  *   **Expected Outcome:** Scores will cluster around the average. Switchers and Keepers will have roughly the same total.
  *   **Key Feeling:** The urge to switch feels logical, but the result is flat.

  #### **Round 2: The Peek (20 Minutes)**
  *   **Goal:** Collide with the ceiling; discover information has value.
  *   **Setup:** Same as Round 1, but now they **must open** their envelope before deciding.
  *   **Action:**
      1.  Deal envelopes. Students open and look at the number.
      2.  They decide Keep or Switch. Banker verifies the other envelope's value to ensure the swap is valid.
      3.  **Play 3 trials.** Pause. Ask: "Is anyone changing their strategy based on the number they see?"
      4.  **Play 2 more trials.**
      5.  **Reveal:** Tally scores.
  *   **Facilitator Script:** "Did anyone see a number that made them refuse to switch? Did anyone see a number that made them switch immediately?"
  *   **The Trap:** If a student sees **512**, they *must* keep (since 1024 is not in play). If they see **1**, they *must* switch (since 0.5 is not in play).
  *   **Key Feeling:** Seeing the number changes the odds. The "50/50" rule breaks at the edges.

  #### **Round 3: The Friction (10 Minutes)**
  *   **Goal:** Test scale and cost indifference.
  *   **Setup:** Same as Round 2 (Peek), but **every Switch costs 5 points** paid to the Banker.
  *   **Action:**
      1.  Deal envelopes. Open. Decide.
      2.  If Switching, pay 5 points first.
      3.  **Play 3 trials.**
  *   **Facilitator Script:** "The logic for switching was 'I could win more than I lose.' Does that logic still hold when switching costs money?"
  *   **Key Feeling:** If the 1.25x expected value argument were universally true, they should still switch. But now they hesitate. The "virtue" of the argument looks like a "symptom" of ignoring cost.

  ---

  ### **4. Prediction Sheet (Return to this in Debrief)**

  Have them flip the sheet over.
  *   **Question 1:** "In Round 1, why didn't switching help?"
  *   **Question 2:** "In Round 2, what was the highest number you saw? Did you switch? Why?"
  *   **Question 3:** "If you saw $512, what were the odds the other envelope was $1024?" (They should now answer 0%).

  ---

  ### **5. Facilitator Notes (The "Do Not Say" List)**

  *   **DO NOT** say "Expected Value." Say "Average outcome."
  *   **DO NOT** say "Prior Distribution." Say "The bag of envelopes we started with."
  *   **DO NOT** say "Two-Envelope Paradox." Call it "The Exchange."
  *   **DO NOT** correct their reasoning during the game. If a student says, "It's always better to switch," write it on the board under "Claims" and say, "Let's test that in Round 3."
  *   **IF** a math whiz explains the paradox in Round 1: Thank them, write their explanation on the board, and say, "Hold that hypothesis. We need to see if the Banker agrees in Round 2."

  ---

  ### **6. The Debrief (13 Minutes)**

  Map the experience to your four objectives. Write these four headers on the board as you speak.

  **1. The Seduction (Round 1)**
  *   *Ask:* "Who felt switching was logically better in Round 1?"
  *   *Write:* "Other envelope is 2x or 0.5x. Average is 1.25x. Switch."
  *   *Point:* This argument feels airtight. It uses basic arithmetic. It is not stupid. It is seductive.

  **2. The Ceiling (Round 2)**
  *   *Ask:* "Who saw 512? Did you switch?" (No). "Why?" (Because 1024 isn't there).
  *   *Write:* "The 50/50 rule broke."
  *   *Point:* The argument assumes *any* number can be doubled or halved with equal chance. But our bag had a limit. Once you hit the limit, the odds aren't 50/50 anymore. They are 100% that the other is smaller.

  **3. The Symptom (Round 3)**
  *   *Ask:* "In Round 3, switching cost points. Did the 1.25x logic tell you to pay?"
  *   *Point:* If the logic were universally true, you would pay to switch forever. The fact that the logic ignores the cost of switching suggests the logic is missing something (the boundary).

  **4. The Information (The Crucial Point)**
  *   *Ask:* "In Round 1 (Blind), Switching = Keeping. In Round 2 (Peek), did Switching > Keeping?"
  *   *Explanation:* "Blind, the envelopes are symmetric. Information breaks symmetry. Seeing a low number tells you you're likely at the bottom of a pair. Seeing the Max number tells you you're at the top. A rule that uses information ('Switch if < 256') beats a rule that ignores it ('Always Switch')."
  *   *Takeaway:* Opening the envelope is **not epistemically inert**. It gives you data about where you sit in the distribution.

  ---

  ### **7. Troubleshooting: What Will Go Wrong**

  **1. The "Math Whiz" Spoiler**
  *   *Risk:* A student knows the paradox and shouts "Improper Prior!" in Round 1.
  *   *Fix:* "That's a great term. Write it on the board. But can you explain it to the Banker using only the envelopes in front of us? Let's see if the Banker goes bankrupt first."

  **2. The "Disengaged" Randomizer**
  *   *Risk:* A student just flips a coin every time and ignores the numbers.
  *   *Fix:* This is actually fine for Round 1. In Round 2, lean over and ask, "You saw 512. You switched. You lost 256 points. Does that feel like bad luck or a bad rule?" Make the loss personal.

  **3. Arithmetic Errors**
  *   *Risk:* Students miscalculate half/double of powers of 2.
  *   *Fix:* This is why we use powers of 2. If they struggle, the Banker is authorized to help calculate. The Banker wants to prevent payout errors.

  **4. The Banker Goes Bankrupt**
  *   *Risk:* Students find a strategy that drains the pool.
  *   *Fix:* Start the pool with enough points (10,000). With 16 students and 5 rounds, max payout is manageable. If they drain it, declare "The House Has Spoken" and end the game early—it proves the strategy worked.

  ---

  ### **8. Limitations: What You Must Supply**

  You asked for an honest account of what the game *cannot* do.

  **The Infinite Distribution Problem**
  *   **What the game shows:** In *this specific finite bag*, the "always switch" argument fails because there is a maximum number (512).
  *   **What the game cannot show:** It cannot prove that *no possible distribution* allows the "always switch" argument to work.
  *   **The Lecture You Must Add:** In the final 2 minutes, you must say:
      > "We fixed the game by adding a ceiling (512). The paradox asks: What if there is no ceiling? What if money can be infinitely large?
      > Mathematically, you cannot have a 'flat' probability for all numbers from zero to infinity. There isn't enough 'probability' to go around. To make the math work, there *must* be a ceiling, or the odds must get lower as the numbers get higher.
      > The paradox tricks you into assuming a 'flat' world that cannot exist. We broke the spell by making the world finite."

  **Why this is the least lecturing way:**
  You let them *find* the ceiling in Round 2. You aren't telling them "there must be a ceiling." You are asking, "What happened when you saw 512?" They tell *you* the ceiling exists. You just formalize their discovery.

  ### **Summary of Flow**
  1.  **0:00–0:05:** Intro, Hand out Prediction Sheets, Assign Banker.
  2.  **0:05–0:17:** Round 1 (Blind). Tally. (Seduction).
  3.  **0:17–0:37:** Round 2 (Peek). Tally. (Ceiling & Information).
  4.  **0:37–0:47:** Round 3 (Friction). Tally. (Cost Indifference).
  5.  **0:47–0:55:** Debrief & The "Impossible World" Note.

  This structure respects the time limit, keeps the math accessible, and ensures the philosophical points land as discoveries rather than instructions.
