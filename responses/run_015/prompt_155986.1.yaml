answer: |-
  Your intuition is correct. The summary is **too neat**, and it relies on several category errors that collapse distinct legal, metaphysical, and moral arguments into a single, misleading narrative.

  Here is the audit you asked for.

  ### 1. The "Contract" Framing
  **Verdict: Mischaracterization.**

  Defenders of advance directives (ADs) generally do **not** argue from a "contract with your future self" framework. That is a pop-philosophy shorthand, not the actual bioethical argument.
  *   **Why it's wrong:** A contract requires two parties. A "contract with oneself" is a legal nullity. You cannot sue yourself for breach of contract.
  *   **The Actual Argument:** Defenders (most notably Ronald Dworkin) argue from **precedent autonomy**. The claim is that autonomy is a temporally extended capacity. Respect for persons requires respecting their critical interests (values about how their life story ends) even when they lose the capacity to hold those values. It is about *integrity*, not enforceability.
  *   **The Slippage:** By calling it a contract, the summary implies a transactional exchange that can be "broken." In reality, the debate is about whether a past competent choice *constitutes* the patient's will, not whether a promise was kept.

  ### 2. The Role of Legal Personhood
  **Verdict: Smuggled In / Category Error.**

  You spotted this correctly. The summary claims the earlier self calls the shots *"because it's the same legal person."* This conflates legal status with moral authority.
  *   **Legal Reality:** The law *does* treat the demented patient as the same legal person as the pre-demented signer. This is why the document is valid *prima facie*.
  *   **Moral Reality:** Legal continuity does not solve the moral problem. The moral question is: *Does legal continuity grant the past self moral authority over the current self's well-being?*
  *   **The Slippage:** The summary uses the legal fact (same person) to bypass the moral argument (why that matters). Defenders don't say "It's binding because the law says so." They say "It's binding because respect for autonomy requires it." The law provides the *mechanism*, but not the *justification*.

  ### 3. The "Different Person" Objection
  **Verdict: Overstated / Straw Man.**

  The summary claims critics argue ADs *"shouldn't be binding at all."* This is a caricature of the "psychological continuity" objection (associated with Rebecca Dresser).
  *   **The Nuance:** Most critics do not argue that ADs should be worthless. They argue that the **current interests** of the demented patient (who may be happy and content) must be weighed against the **precedent autonomy** of the past self.
  *   **The Spectrum:**
      *   *Strong Precedent Autonomy (Dworkin):* The AD trumps current happiness.
      *   *Strong Current Interest (Dresser):* Current well-being trumps the AD.
      *   *Middle Ground (Buchanan/Brock):* ADs are binding *unless* the current self's interests are significantly violated, or there is evidence the patient changed their mind.
  *   **The Error:** The summary presents the critique as an abolitionist position ("never binding"). In mainstream bioethics, the critique is usually about **weight**, not validity. It's about when the directive can be overridden, not whether it should exist.

  ### 4. The "Unified Defender" Premise
  **Verdict: Confused.**

  You asked if you're resting this on a confused premise. **Yes.** There is no single "defender view."
  *   **Dworkinians:** Focus on "critical interests" (the narrative arc of a life).
  *   **Libertarians:** Might actually use contract language (self-ownership), but they are a minority in clinical bioethics.
  *   **Best Interest Standard:** Many clinicians operate here, viewing ADs as strong evidence of preference but not absolute commands if the clinical picture changes.

  ### Summary of the Slippage
  Your friend's summary commits three specific errors:
  1.  **Metaphor to Mechanism:** It treats the "contract" metaphor as the actual ethical machinery.
  2.  **Is to Ought:** It assumes legal personhood (is) provides moral justification (ought).
  3.  **Absolute to Nuanced:** It portrays the critic's objection as total invalidation rather than a call for balancing interests.

  **Bottom Line:** The summary is a "street fight" version of a technical debate. It captures the *vibe* of the disagreement (Past Self vs. Present Self) but misrepresents the *arguments* used by both sides. It is not a fair summary for anyone trying to understand the actual bioethics.
