answer: |-
  You are asking for a diagnosis of a stalemate, and you have already identified the symptoms with remarkable precision. You are correct that the empirical exhaustion is not an accident; it is a structural feature of the debate.

  Here is the diagnosis: **It is Hypothesis 2 (Bedrock Intuitions) driving Hypothesis 1 (Different Objects), mediated by a Collective Action Problem.**

  The reason the argument has stopped moving is not because the data is ambiguous, but because the two sides are arguing over the **ontological status of education.** They cannot agree on what a school *is*, so they cannot agree on what a "good result" looks like, which renders the data mutually unintelligible.

  ### 1. The Ontological Clash (Why Hypothesis 2 is the Engine)
  You hypothesized that the split is about the state's stake in the child (outcomes vs. process). It is deeper than that. It is about whether education is a **private good** or a **public good**.

  *   **The Pro-Choice Axiom:** Education is a private good, like healthcare or nutrition. It is a service consumed by the child to produce individual outcomes (skills, safety, employability). If the service is defective, the consumer has a right to switch providers. The state's role is to ensure access to the service, not to mandate the specific provider.
  *   **The Anti-Choice Axiom:** Education is a public good, like clean air or national defense. It is a mechanism for social reproduction and democratic cohesion. The value is not just in the skills the child acquires, but in the fact that they acquired them *alongside* the other children in the polity. The "room full of people neither she nor her parents picked" is not a bug; it is the primary feature.

  When you treat education as a private good, "choice" is a moral imperative (freedom from harm). When you treat it as a public good, "choice" is a moral hazard (free-riding on the commons).

  This is why evidence doesn't move the needle. If I believe schools are hospitals, I only care if my kid gets cured. If I believe schools are voting booths, I care about who is standing next to me while we vote. A study showing "cure rates are flat" satisfies the first group only if they ignore the second group's concern that the voting booth is becoming segregated. A study showing "social cohesion is down" satisfies the second group only if they ignore the first group's concern that their kid is currently unsafe.

  ### 2. The Measurement Mismatch (Why Hypothesis 1 is the Symptom)
  Because of that ontological clash, you are right that they are measuring different objects. But it is more specific than "individual vs. system." It is **Static vs. Dynamic.**

  *   **Pro-Choice studies** are typically static. They ask: *Given the current broken system, does this specific intervention help this specific child?* This is a rescue metric. It is hard to argue against rescue.
  *   **Anti-Choice studies** are typically dynamic. They ask: *If this intervention becomes the norm, how do actors change their behavior, and how does the ecosystem shift?* This is an equilibrium metric.

  The stalemate happens because the Pro-Choice side treats the Anti-Choice concerns as hypothetical future risks ("We aren't trying to destroy the system, just save this kid"), while the Anti-Choice side treats the Pro-Choice benefits as temporary anomalies ("You are only winning because you are cream-skimming; once everyone does this, you lose too").

  Both are logically consistent. If you are the only one to leave a sinking ship, you are saved. If everyone leaves, the ship sinks faster and the lifeboats capsize. The Pro-Choice parent is arguing from the perspective of the first leaver. The Anti-Choice advocate is arguing from the perspective of the naval architect. They are both telling the truth, but they are speaking different tenses.

  ### 3. The Homeschooling Unfalsifiability
  Your third hypothesis is also correct, but it is the logical endpoint of the "Private Good" axiom. If education is purely for individual outcomes, and the state cannot measure the specific values a parent wishes to instill (religious, philosophical, etc.), then homeschooling is the only pure form of school choice.

  It is unfalsifiable not just because of selection bias, but because **the goalposts are internal.** If a homeschooling parent's goal is "salvation" or "protection from peer culture," a standardized test score is irrelevant data. The debate stalls here because the state has no metric to evaluate the success of a goal it does not share.

  ### 4. Why It Stopped Moving
  The argument stopped moving because it has reached a **Political Economy Limit.**

  The Pro-Choice side relies on **Exit** (Hirschman's framework). If the school fails, you leave. This creates pressure on the district to improve to retain funding.
  The Anti-Choice side relies on **Voice**. If the school fails, you stay and fight to fix it for everyone.

  The stalemate exists because **Exit destroys Voice.** The parents with the most capacity to exercise Voice (time, resources, social capital) are the exact same parents most capable of exercising Exit. When they Exit, the Voice left behind is weaker.

  The debate is stuck because neither side can solve the Collective Action Problem.
  *   The Pro-Choice side cannot promise that individual exit won't degrade the common system. (They often deny it does, which breaks trust).
  *   The Anti-Choice side cannot offer a credible timeline or mechanism for how "Voice" will fix the specific school that is failing *your* child *right now*. (They often ask for sacrifice, which breaks trust).

  ### 5. What Counts as Progress?
  You asked what would count as progress. Since this is a value conflict masked as an empirical one, **empirical progress is impossible.** You will not find a study that resolves this.

  Progress is only possible if you change the question from **"Is Choice Good?"** to **"What are the Rules of Exit?"**

  The debate stalls on the binary (Choice vs. No Choice). Progress happens in the **design of the choice mechanism.**

  *   **False Progress:** More studies on test scores. More moral arguments about freedom vs. equity.
  *   **Real Progress:** Admitting that Exit will happen, and designing constraints to minimize the damage to Voice.

  This looks like:
  1.  **Common Enrollment Systems:** Preventing schools from cherry-picking via complex application processes.
  2.  **Weighted Lotteries:** Mandating that choice schools take a proportional share of high-need students (disabling the "cream-skimming" argument).
  3.  **Funding Follows, but with a Tax:** If a student leaves, the funding follows, but a percentage is retained by the home district to cover fixed costs (addressing the "resource drain" argument).
  4.  **Backfill Requirements:** Charter schools must fill empty seats in later grades, not just start with Kindergarteners (preventing them from pushing out hard-to-teach kids mid-stream).

  ### Summary
  The argument isn't moving because it is a **category error.** One side is arguing about **Consumer Rights** (Private Good), and the other is arguing about **Civic Infrastructure** (Public Good).

  You cannot empirically prove whether a school is more like a hospital or a voting booth.

  **Expect no progress on the moral question.** It will not be solved.
  **Expect progress on the regulatory question.** The only way out of the stalemate is to stop asking "Should parents choose?" and start negotiating "Under what specific constraints may parents choose so that the civic infrastructure doesn't collapse?"

  If you want to move the fight, stop fighting about the *right* to choose and start fighting about the *architecture* of the choice. That is the only place where the two axioms can be forced to coexist.
