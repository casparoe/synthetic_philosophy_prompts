  **MEMORANDUM**

  **TO:** Clinical Ethics and Research Review Board, County General
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the "Calibrated Disclosure" Pilot Proposal

  **Executive Summary**

  This memo addresses the proposal for the "Calibrated Disclosure" pilot and the subsequent objection filed by the Patient Advocacy Coalition. The proposal requires attending physicians to include a calibration statement in discharge summaries whenever higher-order statistical evidence (e.g., institutional data on demographic bias) conflicts with their first-order clinical judgment. The Coalition argues this mandates "epistemic akrasia," forcing clinicians into an irrational state where they must document doubt that undermines their own professional agency.

  After reviewing the ethical and epistemic implications, I recommend that the Board **approve the pilot with specific conditions** regarding the language of the disclosure. The pilot should proceed for a **12-month review period**. We must not reject the initiative outright, as making systemic bias visible is a moral imperative. However, we must modify the implementation to ensure it respects physician rationality. Specifically, the policy must allow for a "level-splitting" approach to evidence rather than mandating a "conciliationist" one.

  **The Epistemic Objection: Conciliationism vs. Level-Splitting**

  To address the Coalition's concern, we must distinguish between two ways of handling conflicting evidence. The core tension lies between first-order evidence (the specific patient's vitals, history, and exam) and higher-order evidence (data suggesting the physician's demographic bracket tends to misjudge similar patients).

  A *conciliationist* approach dictates that when higher-order evidence conflicts with your judgment, you are rationally required to adjust your confidence. If the data says doctors like you overestimate stability for this income group, a conciliationist physician must lower their confidence in the current patient's stability, even if the clinical exam looks perfect. If the Board mandates this, the Coalition is correct: we are forcing epistemic akrasia. We would be requiring doctors to write, in effect, "I believe this patient is stable, but I acknowledge I am irrational for believing so." This erodes the physician's role as a moral agent and could lead to defensive medicine or undertreatment.

  A *level-splitting* approach, conversely, allows the physician to maintain their first-order belief while acknowledging the higher-order risk. Under this model, a doctor can assert, "Based on the direct exam, this patient is stable," while simultaneously noting, "I am aware that statistical models suggest a risk of overestimation in this demographic." This is not necessarily irrational; it is an acknowledgment that systemic patterns exist even when individual cases appear clear. It separates the *act* of clinical judgment from the *audit* of systemic bias.

  The Coalition's objection holds weight only if the policy is interpreted as forcing conciliation. If the policy forces a doctor to doubt their own eyes solely because of a spreadsheet, we violate their rational agency. However, if the policy is framed as level-splitting—requiring transparency about the tension without mandating a change in the clinical conclusion—it preserves autonomy. It allows the physician to stand by their medical judgment while submitting to institutional accountability.

  **Physician Autonomy and Institutional Trust**

  The question of autonomy turns on whether we view the physician as a solitary knower or a node in a data-driven system. The Coalition views the mandate as an intrusion on the former. They argue that requiring a doctor to weigh group-level stats against a specific exam fractures their decision-making process.

  However, autonomy is not the right to ignore relevant evidence. Higher-order evidence regarding bias *is* relevant clinical data, akin to knowing a diagnostic tool has a known failure rate. Ignoring it is arguably less rational than acknowledging it. The erosion of autonomy occurs only if the institution dictates the *outcome* of that acknowledgment.

  Therefore, we can respect autonomy by requiring the *disclosure of the conflict* without dictating the *resolution*. The physician retains the authority to decide if the statistical risk overrides their clinical intuition in that specific moment. The discharge summary becomes a record of that deliberation, not a confession of error. This fosters a culture of trust where physicians are partners in bias mitigation rather than subjects of surveillance.

  **Recommendation and Conditions**

  I recommend approving the "Calibrated Disclosure" pilot for a 12-month period, contingent on the following three conditions:

  1.  **Reframing the Disclosure Language:** The required statement must not ask physicians to quantify their doubt or admit potential error. Instead, it should ask for a binary acknowledgment of awareness. The prompt should read: *"Does institutional demographic data conflict with your clinical assessment in this case?"* If yes, the physician adds: *"Systemic data suggests a risk of [bias type]; clinical judgment prioritizes [specific finding]."* This codifies level-splitting. It validates the stats without invalidating the exam.

  2.  **Educational Support:** Prior to launch, physicians must receive training distinguishing between individual competence and systemic patterns. We must clarify that acknowledging a statistical risk is not an admission of personal negligence. This reduces the psychological burden that leads to the feeling of akrasia.

  3.  **Data Segregation:** The calibration statements should be aggregated for quality improvement but should not be used in individual performance reviews or credentialing during the pilot. If physicians fear these statements will be weaponized against them, they will view the policy as coercive, which will genuinely undermine their agency and encourage dishonest reporting.

  **Conclusion**

  The Patient Advocacy Coalition raises a vital philosophical point: we cannot build an ethical system on the requirement that our clinicians be irrational. However, acknowledging the limits of human judgment in the face of statistical trends is not irrationality; it is wisdom. By shifting the policy from a conciliationist mandate to a level-splitting disclosure, we can make bias visible without breaking the physician's trust in their own judgment.

  I move that we approve the pilot with the conditions outlined above, with a formal review of the impact on physician morale and patient outcomes scheduled for October 2024.
