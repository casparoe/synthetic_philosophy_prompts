      *   *Mandate:* "All employees are auto-enrolled at 10%. To change this, submit a paper form to HR within 30 days."
      *   *Why is the Nudge worse?* It bypasses reflection. It treats the user as a bundle of biases to be hacked, not a reason-giver. The mandate respects the user's capacity to follow a rule, even if it restricts choice more.
      *   *Is Personalization the key?* Yes. A generic nudge (default for everyone) is often seen as benign. A *targeted* nudge based on private data feels like surveillance-based manipulation. It undermines the *status* of the agent.

