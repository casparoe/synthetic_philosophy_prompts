      *   **Nudge:** App tracks distraction patterns. Sees *you* cave to Instagram at 8 PM. At 7:55 PM, it sends a notification: "You're likely to slip up now. Remember your GPA?" (Exploits anxiety/guilt specific to user history).
      *   **Mandate:** "Library Wi-Fi blocks social media for all users between 7 PM and 9 PM." (Blunt ban).
