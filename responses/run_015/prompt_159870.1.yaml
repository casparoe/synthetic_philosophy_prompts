      *   *Nudge:* App uses past data to see when *you* usually skip. It sends a notification framed as a "social norm" or "loss aversion" trigger specifically timed to your weakness. It feels like being managed.
      *   *Mandate:* Clinic policy: Pills are dispensed in weekly blister packs that must be signed for. Clumsy, inconvenient, but honest.
