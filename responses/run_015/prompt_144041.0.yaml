prompt: |-
  My team of four handles a shared queue of support cases at a software company. Six months ago our office moved to a 35-hour week with no cut in pay and no reduction in the queue. Three of my teammates have quietly begun logging back in at night and on weekends; the system records the logins and nobody mentions them. One of them has taken almost no days off in a year and has started having chest pains. I have been stopping at 35 hours, and my share of the cases is being absorbed by the others, not because I am slow (my closed-cases-per-hour actually went up when the hours dropped) but because the work simply sits there until someone picks it up.

  What I cannot work out is whether I am doing something wrong, and what the wrongness would consist in. My free time is not edifying: I watch videos and scroll. My teammate says he genuinely likes the extra hours, that the cases are his craft, that he would be restless at home, and that my leaving is a choice he is covering for rather than a burden I am imposing on him. Meanwhile our manager has begun citing how well the team is keeping up as evidence that the shorter week is sustainable at current headcount, which suggests the unpaid hours are being quietly converted into an argument against hiring a fifth person.

  So: am I free-riding on my teammates, or is the free-riding charge just the work ethic in disguise, the assumption that hours not spent producing need a justification? Does it matter what I do with the time I have reclaimed? Does the fact that his extra hours seem to come from him rather than from the company make my benefiting from them different? And what do I owe him: an argument that he is being exploited, a refusal to benefit, or simply to be left alone? I have seen people invoke Japanese overwork deaths and the French shorter week in arguments like this, and neither framing tells me what to do on Monday. I would like an answer that says what kind of problem this is and whether the pieces I have described are one problem or several, rather than general advice about boundaries and burnout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Team of 4, shared queue, software support.
      *   **Change:** 6 months ago, moved to 35-hour week (no pay cut, no queue reduction).
      *   **Situation:** 3 teammates working unpaid overtime (nights/weekends). One teammate is showing signs of severe burnout/health issues (chest pains, no days off). User sticks to 35 hours.
      *   **User's Performance:** Efficiency increased (closed-cases-per-hour up) when hours dropped.
      *   **Consequence:** User's share of cases is absorbed by others (work sits until picked up).
      *   **Manager's Stance:** Citing team's ability to keep up as proof 35-hour week is sustainable *without* hiring #5. (Implicitly using unpaid overtime to justify headcount freeze).
      *   **Teammate's Stance:** Claims to love the work ("craft"), claims user's leaving is a choice *he* covers, not a burden.
      *   **User's Guilt/Confusion:** Is this free-riding? Does how I spend free time matter? Is it exploitation if voluntary? What do I owe the teammate?
      *   **Request:** Not general advice on boundaries/burnout. Wants to know *what kind of problem this is*, whether the pieces are one problem or several, and a specific ethical/practical analysis for Monday.

  2.  **Analyze the Core Ethical & Structural Dynamics:**

      *   **The "Free-Rider" Question:** In economics/game theory, a free-rider benefits from a public good without contributing to the cost. Here, the "public good" is a clear queue. The "cost" is labor. The user *is* contributing their contracted labor (35 hours). The teammates are contributing *extra-contracted* labor.
      *   **The Manager's Role:** This is the critical leverage point. The manager is observing the output (queue clear) and ignoring the input (unpaid hours). This is *structural exploitation*. The manager is effectively gaslighting the team by claiming the 35-hour model works based on 45-hour effort.
      *   **The Teammate's Agency:** The teammate claims autonomy ("I like it"). However, health issues (chest pains) suggest this isn't sustainable or truly healthy, regardless of stated preference. This introduces the concept of *adaptive preference* (adjusting desires to fit oppressive conditions).
      *   **The User's Position:** The user is adhering to the *contractual agreement*. The guilt stems from social comparison and the visible consequence (work sitting until others pick it up).
      *   **The "What I do with time" Question:** Irrelevant to the labor contract, but relevant to the internal guilt (Protestant Work Ethic).

  3.  **Categorize the Problems:**

      *   *Problem A: The Contractual/Economic Problem.* The user is fulfilling the contract. The teammates are violating it (working off-clock). The manager is benefiting from the violation.
      *   *Problem B: The Collective Action Problem.* If everyone stops overtime, the queue backs up, forcing hiring. If one person continues, the pressure is off the system.
      *   *Problem C: The Interpersonal/Solidarity Problem.* The relationship between the user and the overworking teammate. Is the user complicit in the teammate's self-harm?
      *   *Problem D: The Managerial Deception.* The manager is using the overtime to deny resources.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate that this isn't just "work-life balance." It's a structural trap.
      *   **Diagnosis (What kind of problem is this?):**
          *   It's not primarily a moral failing of the user.
          *   It is a *Collective Action Problem* exacerbated by *Managerial Opacity*.
          *   Distinguish between "Free-riding on teammates" vs. "Adhering to contract."
      *   **Addressing Specific Questions:**
          *   *Am I free-riding?* Technically yes on the *queue clearance*, but no on the *contract*. The teammates are subsidizing the manager's budget, not the user's leisure.
          *   *Does leisure matter?* No. That's the "Protestant Work Ethic" trap.
          *   *Voluntary overtime?* It's rarely truly voluntary in a capitalist hierarchy, especially with health symptoms.
          *   *What do I owe him?* Not an argument, not refusal of work. You owe solidarity, but not self-sacrifice.
      *   **The Managerial Pivot:** This is the crux. The manager is the one actually free-riding. They are getting 45 hours of work for 35 hours of pay.
      *   **The "One Problem or Several" Question:**
          *   It looks like one (the queue), but it's actually two distinct problems tangled together:
              1.  The Resource Allocation (Manager vs. Team).
              2.  The Social Contract (User vs. Teammate).
          *   Conflating them is what causes the guilt.
      *   **Actionable Advice for Monday (Specific, not general):**
          *   Don't work overtime.
          *   Don't preach to the teammate (it triggers defensiveness).
          *   Document the queue metrics (show the lag).
          *   Force the manager's hand on data, not anecdote.
          *   Protect the teammate via HR/Safety channels (chest pains = workers comp issue potentially).

  5.  **Refining the Tone:**

      *   Needs to be analytical, philosophical but grounded.
      *   Avoid preachy "self-care" language.
      *   Focus on systems, incentives, and ethics.
      *   Use terms like "wage theft," "collective action," "adaptive preference."

  6.  **Self-Correction/Review during drafting:**

      *   *Initial thought:* Tell the user to talk to the manager.
      *   *Correction:* Risky. Manager is already using the overtime to deny hiring. Need to be strategic. Focus on data.
      *   *Initial thought:* Tell the user to convince the teammate to stop.
      *   *Correction:* User says teammate gets defensive/claims craft. Direct confrontation might isolate the user. Better to focus on the *system* and safety (chest pains).
      *   *Key Insight:* The user's efficiency went *up* with fewer hours. This proves the 35-hour model works *if the headcount is right*. The bottleneck is headcount, not hours.
      *   *Crucial Distinction:* The user isn't free-riding on the *teammates*, the *manager* is free-riding on the *team*. The user is just the one refusing to be ridden.

  7.  **Final Polish:** Ensure all parts of the prompt are answered directly.
      *   What kind of problem? (Collective Action / Principal-Agent problem).
      *   One or several? (Two tangled problems).
      *   Free-riding charge? (Misplaced).
      *   Leisure justification? (Irrelevant).
      *   What to owe the teammate? (Solidarity, not salvation).
      *   Monday action? (Data, safety, boundaries).

  8.  *(Final check against safety guidelines)*: The teammate has chest pains. I must suggest medical attention/HR involvement without diagnosing. Frame it as workplace safety.

  9.  **Constructing the Output.** (Proceed to generate response based on these thoughts.)
answer: |-
  This is not a problem of personal ethics; it is a problem of **structural incentives masquerading as a collective action problem.**

  You are experiencing guilt because you are conflating two distinct problems that have been tangled together by management's silence. To answer your specific questions: you are not free-riding in a morally culpable way, your leisure time is irrelevant to the ethics of labor, and the "voluntary" nature of your teammate's overwork is a red herring.

  Here is the breakdown of what is actually happening, categorized by the type of problem each piece represents.

  ### 1. The Economic Problem: Wage Theft vs. Contractual Fulfillment
  You asked if you are free-riding. In game theory, a free-rider benefits from a public good without paying the cost.
  *   **The Public Good:** A cleared support queue.
  *   **The Cost:** Labor hours.
  *   **The Contract:** You are paid for 35 hours. You provide 35 hours.
  *   **The Subsidy:** Your teammates are providing ~40+ hours but are paid for 35.

  You are fulfilling your side of the contract. Your teammates are violating theirs (by working off the clock). The beneficiary of this violation is not you; it is the **company**.

  When your manager cites the team's ability to keep up as evidence that a fifth headcount is unnecessary, the manager is engaging in **data falsification by omission**. They are measuring output (cases closed) against official input (35 hours), while the actual input is (35 hours + unpaid overtime).

  **Verdict:** You are not free-riding on your teammates. The manager is free-riding on the team. Your guilt is the result of the manager successfully offloading the risk of understaffing onto the workers' consciences rather than the company's budget.

  ### 2. The Psychological Problem: Adaptive Preference
  Your teammate claims he "likes" the extra hours and views the cases as "craft." You asked if the fact that the hours come from him makes your benefiting different.

  In labor sociology, this is known as **adaptive preference**. When workers lack the power to change their conditions (e.g., demand more hire), they often psychologically adjust to value the conditions they are stuck in. It is a coping mechanism. The chest pains and the lack of days off indicate that this preference is maladaptive. It is not a genuine preference; it is a rationalization of compulsion.

  If you refuse to work overtime, you are not imposing a burden on him; you are removing the **subsidy** that allows him to maintain the delusion that the workload is sustainable. He feels burdened because your boundary forces him to confront the reality that the work *cannot* be done in the allotted time without self-harm.

  **Verdict:** His "choice" is constrained by the environment you all share. By working, he sets the pace. By not working, you reveal the pace is artificial.

  ### 3. The Ethical Problem: Solidarity vs. Self-Preservation
  You asked what you owe him: an argument, a refusal, or to be left alone.

  *   **An Argument:** Telling him he is being exploited will likely fail. It attacks his coping mechanism and implies he is weak for not seeing it. It frames you as the judge of his labor.
  *   **A Refusal to Benefit:** You cannot "refuse" for the queue to be cleared. If you log off, and he logs on, the work gets done. You cannot control his actions.
  *   **To Be Left Alone:** This is the default, but it leaves the structural rot intact.

  **What you actually owe him is Solidarity, not Salvation.**
  Salvation is trying to stop him from working (which you can't do). Solidarity is ensuring that when his body inevitably forces him to stop (due to the chest pains or burnout), the system doesn't crush him.

  ### Are these one problem or several?
  They are **two separate problems** that management has successfully merged to protect itself.

  1.  **The Resourcing Problem:** There is too much work for 4 people at 35 hours. This is a math problem. The solution is hiring or reducing queue volume.
  2.  **The Safety Problem:** One employee is exhibiting signs of medical distress (chest pains) related to work stress. This is an HR/Legal problem.

  By merging these, the team treats the safety issue as a "work ethic" issue. If it were treated as a safety issue, the conversation changes from "Why won't you help us clear the queue?" to "Why is an employee working while experiencing cardiac symptoms?"

  ### What to do on Monday

  You need to decouple these problems. Do not argue about work ethic. Do not argue about how you spend your evenings. Argue about **data** and **safety**.

  **1. Do not change your hours.**
  If you start working overtime, you validate the manager's false data. You must remain the control variable that proves the 35-hour week *requires* 5 heads, not 4.

  **2. Document the "Lag," not the "Load."**
  Since your efficiency is high, track the time a ticket sits in the queue before you pick it up during your 35 hours. If the queue is only clear because of weekend work, there must be a visible accumulation by Friday afternoon.
  *   **Action:** Send a weekly status email to the manager on Friday at hour 35. "Queue status: X tickets remaining. Based on current velocity, these will require weekend coverage to meet SLA. I am signing off."
  *   **Why:** This forces the manager to acknowledge the overtime explicitly. It makes the unpaid labor visible in the official record.

  **3. Address the Safety Issue (The Chest Pains).**
  This is the only place where you intervene directly with the teammate. Do not frame it as "work less." Frame it as "liability."
  *   **Action:** Pull the teammate aside. "I'm not going to tell you how to work. But you mentioned chest pains. If you collapse at your keyboard on a Saturday, that's a workers' comp claim and a safety incident. The company needs to know you're working off-hours while injured."
  *   **Why:** This bypasses the "craft" argument. It appeals to the risk management side of the company. It may scare him into stopping, or it may force HR to intervene.

  **4. Reject the Justification of Leisure.**
  You asked if it matters that you watch videos. **It does not matter.**
  *   If you spent your 5 extra hours volunteering at a soup kitchen, the economic dynamic would be identical. The manager would still use the overtime to deny hiring.
  *   The "Protestant Work Ethic" suggests leisure must be edifying to be deserved. This is a trap. Your time is yours because you sold 35 hours, not 40. What you do with the remaining 5 is irrelevant to your employer and your teammates.

  ### Summary
  You are not doing something wrong. You are the only person currently acting in accordance with the stated reality (a 35-hour work week). Your teammates are acting in accordance with the *actual* reality (a 45-hour work week disguised as 35).

  The "wrongness" you feel is the friction of being the only one refusing to participate in a **collective deception.** The deception is that the work can be done in the allotted time. By working overtime, your teammates are lying to the manager (intentionally or not) about capacity. By working your contract, you are telling the truth.

  On Monday, log off at 35 hours. Document the remaining queue. Treat your teammate's health as a safety hazard, not a work ethic choice. And understand that your leisure is not the cause of the problem; it is merely the visible evidence of the boundary your teammates have chosen to erase.
