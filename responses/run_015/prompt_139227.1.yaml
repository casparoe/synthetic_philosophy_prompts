  Here is the audit. I will be blunt: your package is logically unstable at its core, though the philosophical motivation is coherent. You have tried to block a logical explosion with a syntactic filter that is too porous.

  **The Primary Tension: Fitch vs. Unknown Truths (Severity: Critical)**
  The most severe tension is between (1) Knowability, (2) Classical Logic, and (4) Realism about the Unexcavated Past. You want to maintain that there are determinate truths about the past that nobody will ever know. You also want to maintain that every truth is knowable. Under Classical Logic with factive knowledge, these are incompatible. This is the Fitch Paradox.

  The derivation does not require you to apply Knowability to epistemic sentences directly. It requires you to apply Knowability to a conjunction of a truth and the claim that it is unknown. You have tried to block this with (5), restricting Knowability to sentences without epistemic vocabulary. However, Fitch's derivation shows that if *any* truth is unknown, there is a contradiction derived from the Knowability Principle applied to a specific instance. If you hold (1) and (2), you are logically committed to Omniscience (all truths are known). This directly contradicts (4). You cannot have Classical Logic, Universal Knowability, and Unknown Truths simultaneously. One must give. Since you are committed to (2) and (4), (1) must be revised.

  **The Secondary Tension: Syntactic Restriction vs. Diagonalization (Severity: High)**
  Your friend in (9) is correct. Your escape hatch (5) is vulnerable to revenge via diagonalization. If your language is expressive enough to encode arithmetic (which it must be to handle "finite inquirers" and physical descriptions rigorously), you can construct a sentence $\phi$ that is syntactically non-epistemic (e.g., a complex arithmetic statement) but is provably equivalent to "I am not known."
  If your Knowability Principle applies to all non-epistemic sentences, it applies to $\phi$. From $\phi \leftrightarrow \neg K\phi$ and $\phi \to \Diamond K\phi$, you derive a contradiction using standard modal logic. The syntactic restriction fails because it tracks syntax, not semantic content. Diagonalization allows epistemic content to hide inside non-epistemic syntax. To block this, you cannot merely ban epistemic vocabulary; you must restrict the *logical form* of sentences to which Knowability applies.

  **The Tertiary Tension: Local Motivation (Severity: Low)**
  The tension between (3) Anti-Realism about trans-horizon regions and (4)/(7) Realism about the past/future is actually your strongest philosophical footing. It is not a logical contradiction but a modal distinction. You are distinguishing between *in principle* verifiability (causal possibility) and *in fact* verification.
  Trans-horizon sentences are causally disconnected; no signal can ever reach you. Thus, they are not knowable even by exotic inquirers. Past/Future sentences are causally connected; they are knowable *in principle*, even if never known *in fact*. This distinction sustains the local anti-realism without forcing global anti-realism. As long as your modal base for "knowable" respects causal horizons, (3), (4), and (7) are consistent. The problem is not here; it is in how you formalize the Knowability Principle in (1).

  **Self-Applicability (8)**
  Your friend is wrong about (8), provided you fix the logical core. The paradox rules out knowing "there are unknown truths" only if the paradox holds (i.e., if Knowability implies Omniscience). If you block the paradox, you can consistently claim to know that there are unknown truths. The sentence "There are truths nobody will ever know" contains epistemic vocabulary, so under your current rule (5), Knowability doesn't apply to it anyway. You can simply claim to know it directly without invoking the principle. This is safe, contingent on solving the Fitch problem.

  **Ranking and Repairs**

  1.  **Critical:** (1) + (2) + (4). Incompatible.
  2.  **High:** (5) + (9). Syntactic restriction is insufficient.
  3.  **Low:** (3) vs (4)/(7). Philosophically stable.

  **The Cheapest Repair**
  You must revise (1). Do not state that *every* truth is knowable. Instead, restrict the Knowability Principle to **atomic** (or basic) sentences only, and deny that knowability aggregates over conjunction.
  *   **Revision:** "Every atomic truth is knowable."
  *   **Why this works:**
      1.  **Blocks Fitch:** The Fitch derivation requires applying Knowability to a conjunction ($p \land \neg Kp$). If Knowability only applies to atomic sentences, the derivation cannot start.
      2.  **Blocks Diagonalization:** The diagonal sentence $\phi$ equivalent to $\neg K\phi$ is logically complex, not atomic. Thus, Knowability does not apply to it.
      3.  **Saves (4):** Complex truths (like conjunctions of atomic facts) can be unknown, even if their atomic components are knowable. This preserves your commitment to unknown truths about the past.
      4.  **Respects (6):** Atomic sentences are picked out by logical structure, not epistemic notions. This avoids the charge of cheating.
      5.  **Saves (8):** Your theory is a complex sentence. You claim to know it, not because it falls under the Knowability Principle, but because you have derived it.

  **Conclusion**
  Stop worrying about (8); it follows if the logic holds. Stop worrying about the motivation for local anti-realism; it is sound. Focus entirely on (1) and (5). Your current formulation of Knowability is too strong for Classical Logic. Restricting it to atomic sentences is the standard, robust fix in formal epistemology that preserves Classical Logic while allowing for unknown truths. If you keep "Every truth is knowable," your paper is formally refutable. If you change it to "Every atomic truth is knowable," the system stabilizes.
