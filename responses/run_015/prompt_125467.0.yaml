      *   *Synthesis:* The user wants to direct a *play* (actors/audience). Rousseau's *Fête* is not a play. Rousseau's *Opera* is a play but defended as "innocent." The user is conflating the *Fête* defense (3) with the *Opera* defense (4).
      *   *Advice:* Distinguish between the *Fête* (everyone participates) and the *Opera* (amusement). The user is doing an Opera. So (3) is less relevant than (4). The conflict is primarily (1) vs (4).

