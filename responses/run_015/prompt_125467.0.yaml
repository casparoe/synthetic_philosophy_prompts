      *   *Problem:* Rousseau wrote *Le Devin du Village* (the pastoral opera). He defended it. But in the *Letter to d'Alembert*, he attacks the theater in Geneva.
      *   *Key Distinction:* Rousseau distinguishes between *Spectacle* (passive, commercial, urban, actor/audience split) and *Fête* (active, communal, rural, no split).
