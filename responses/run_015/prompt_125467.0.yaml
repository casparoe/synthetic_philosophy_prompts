      *   **Commitment 2 (Anti-Representation in Politics):** Sovereignty = direct participation. Political representation = illegitimate.
      *   **Commitment 3 (Civic Ritual Exception):** Legislator can use staged/performative rituals to shape mores.
      *   **Commitment 4 (Pastoral Opera Exception):** Specific pastoral opera is okay (pedagogical/rural) despite being theater.

      *   **Tension A: (2) vs. (3) [Political Representation vs. Civic Ritual]**
          *   *Issue:* (2) says representation is illegitimate because it mediates the will. (3) says the legislator (an external figure in Rousseau) stages rituals (mediated experiences) to shape the people. If rituals are "performative" and "staged," do they not interpose an image between the citizen and their own civic identity?
          *   *Severity:* Moderate. Rousseau distinguishes between *political sovereignty* (making laws) and *moral formation* (mores/customs). The legislator doesn't rule; he guides. Rituals aren't laws.
          *   *Resolution:* Clarify that rituals are *constitutive* of the people, not *representative* of the sovereign will. In rituals, everyone participates (no audience/actor split), whereas in theater (1), there is a split.

      *   **Tension B: (1) vs. (3) [Theater vs. Ritual]**
          *   *Issue:* (1) says performance is structurally representational (actor/audience split). (3) allows civic rituals which are "performative." If rituals are performative, don't they suffer the same structural flaw as theater?
          *   *Severity:* High. This is the core of the *Letter to d'Alembert*. Rousseau's distinction rests entirely on *who* is performing and *who* is watching. In theater: Passive audience, active actors. In festivals: Everyone is active; no spectators.
          *   *Resolution:* The user's phrasing of (3) says "staged, collective self-presentation." If "staged" implies directors/actors, it conflicts with (1). If "staged" implies organized but participatory, it fits. The user needs to ensure (3) doesn't imply a spectator/actor divide.

      *   **Tension C: (1) vs. (4) [Universal Critique vs. Specific Exception]**
          *   *Issue:* (1) says theater is *structurally* representational and corrupting. (4) says *this* theater (pastoral opera) is okay. Is this an ad hoc exception?
          *   *Severity:* Very High. If (1) is structural, no content saves it. If (4) is true, (1) must be contingent on context (urban/corrupt) not structure.
          *   *Resolution:* Modify (1) to be about *alienation* rather than structure per se. Or modify (4) to claim it's not "theater" in the corrupt sense but "festival" in the rural sense.

      *   **Tension D: (2) vs. (4) [Political Legitimacy vs. Artistic Legitimacy]**
