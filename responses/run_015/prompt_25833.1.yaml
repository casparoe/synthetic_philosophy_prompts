answer: |-
  This is the core tension of science journalism: **Truthfulness vs. Truth.** You can be faithful to the facts and still betray the reality.

  Philosophers of language (like Paul Grice, Thomas Carson, and Don Fallis) distinguish between *what is said* (the literal proposition) and *what is implicated* (what the listener infers based on context and norms). Lying violates the literal proposition. Misleading violates the implicature.

  Here is a 15-minute decision procedure based on that distinction. It is designed to be run on a specific paragraph, headline, or editorial choice during the edit.

  ### The "Implicature & Intent" Protocol

  **Time:** 10–15 Minutes
  **Goal:** Classify an editorial choice as **Clean**, **Misleading**, or **Judgment Call**.

  #### Step 1: The Literal Truth Check (2 mins)
  Look at the specific sentence or claim in isolation.
  *   **Question:** If a specialist read *only* this sentence, would they say it is factually false?
  *   **Action:** If **Yes**, this is a lie. Fix it.
  *   **Action:** If **No**, proceed to Step 2.
      *   *Note:* This step clears the "hard rule" against lying. It does not clear you of misleading.

  #### Step 2: The "Therefore" Test (Implicature) (3 mins)
  Identify the primary inference a smart, non-specialist reader will draw immediately after reading the sentence. Complete this sentence: *"The article says [X], therefore the reader will believe [Y]."*
  *   **Question:** Is belief [Y] false, or significantly less supported than the text implies?
  *   **Example:** "The study found a link." $\rightarrow$ "Therefore, A causes B." (If the study was correlational, [Y] is false).
  *   **Action:** If [Y] is false, flag as **Potential Misleading**. Proceed to Step 3.
  *   **Action:** If [Y] is accurate, flag as **Clean**. (Skip to Step 5 to confirm).

  #### Step 3: The Salience & Omission Check (3 mins)
  If you flagged "Potential Misleading," ask why the false inference exists. Is it because you left something out?
  *   **Question:** Is the missing information (e.g., the null primary outcome, the sample size, the conflict of interest) *more important* to the reader's understanding than the information you included?
  *   **Question:** Did you place the weaker claim in a more prominent position (headline/lede) than the stronger qualifying claim (paragraph 12)?
  *   **Action:** If the omitted info changes the practical takeaway (e.g., from "take this drug" to "ignore this drug"), this is **Misleading**.
  *   **Action:** If the omitted info is technical nuance that doesn't change the bottom line, proceed to Step 4.

  #### Step 4: The Motivation & Repairability Check (3 mins)
  *   **Question (Motivation):** Did we simplify this to make it *understandable*, or to make it *more impactful*? (Be honest. "Impact" often means "surprise.")
  *   **Question (Repairability):** If the reader finishes the piece with the false belief [Y], is the truth easily recoverable? (e.g., Is the nuance buried, or is it signposted?)
  *   **Action:** If the motivation was Impact *and* the truth is hard to recover, classify as **Misleading**.
  *   **Action:** If the motivation was Understandability *and* the nuance is signposted (e.g., "roughly," "suggests"), classify as **Judgment Call**.

  #### Step 5: The "Reasonable Editor" Deviation (2 mins)
  *   **Question:** If I showed this choice to three other science editors, would at least one of them strongly object?
  *   **Action:** If **No**, and previous steps were clear: **Clean**.
  *   **Action:** If **Yes**: **Judgment Call**. (This acknowledges that reasonable people disagree on where simplification becomes distortion).

  ---

  ### Running the Protocol: Three Cases

  Here is how this plays out on realistic editorial dilemmas.

  #### Case 1: The Subgroup Surprise
  **The Situation:** A large clinical trial has a null primary outcome (the drug didn't work overall). However, a post-hoc analysis shows a significant benefit for women over 50. The press release highlights the women over 50.
  **The Draft:** "New Drug Proven Effective for Post-Menopausal Women, Study Finds."
  **The Edit:** You know the primary outcome was null. You know subgroup analyses are prone to false positives. But the finding is real and potentially helpful.

  *   **Step 1 (Literal):** Technically, the study *did* find that result in that subgroup. (Pass)
  *   **Step 2 (Therefore):** Reader infers: "The drug works for this group." (True) *But* they also infer: "The study was designed to test this, and the result is robust." (False).
  *   **Step 3 (Salience):** The null primary outcome is more important for assessing reliability than the subgroup finding. It is currently omitted from the headline and lede.
  *   **Step 4 (Motivation):** Highlighting the subgroup makes the story a "Breakthrough" rather than a "Failure." Impact > Understandability.
  *   **Step 5 (Deviation):** Many editors would object to headlining a subgroup analysis without qualifying it.
  *   **Verdict:** **Misleading.**
  *   **Fix:** "Drug Fails Broad Test, But Shows Promise for Older Women."

  #### Case 2: The Relative Risk Headline (The Uncomfortable Result)
  **The Situation:** A study shows eating a specific processed meat increases the risk of a rare cancer from 0.1% to 0.2% over a lifetime.
  **The Draft:** "Daily Bacon Doubles Cancer Risk."
  **The Edit:** You know absolute risk is low. But "doubles" is mathematically true and grabs attention.

  *   **Step 1 (Literal):** The risk does double. (Pass)
  *   **Step 2 (Therefore):** Reader infers: "This is a highly dangerous activity I should avoid." (False/Exaggerated). The *magnitude* of the risk is implied to be high, not just the ratio.
  *   **Step 3 (Salience):** The absolute risk (0.1%) is omitted. This information is crucial for decision making.
  *   **Step 4 (Motivation):** "Doubles" is chosen for Impact. The truth (0.1% to 0.2%) is recoverable only if they read paragraph 8.
  *   **Step 5 (Deviation):** Many editors run "Doubles Risk" headlines routinely.
  *   **Verdict:** **Misleading.**
  *   **Why you won't like this:** This is standard industry practice. The protocol flags it because it invites a false belief about *danger level* via a true statement about *ratios*. It forces you to admit you are trading accuracy for clicks.
  *   **Fix:** "Rare Cancer Risk Rises from 0.1% to 0.2% With Daily Bacon." (Boring, but Clean). Or a Judgment Call: "Bacon Linked to Doubled Risk of Rare Cancer." (Signposts the rarity).

  #### Case 3: The "Consensus" Frame
  **The Situation:** 95% of climate scientists agree on anthropogenic warming. 5% dissent. You are writing a piece on the policy implications.
  **The Draft:** "Scientists Agree: Climate Change Is Human-Made."
  **The Edit:** You worry this erases the 5%, but including them gives false balance.

  *   **Step 1 (Literal):** There is a consensus. (Pass)
  *   **Step 2 (Therefore):** Reader infers: "There is no scientific debate." (Mostly True).
  *   **Step 3 (Salience):** The 5% dissent is omitted. Does it change the takeaway? For policy, no. For scientific process, maybe.
  *   **Step 4 (Motivation):** Simplification to prevent "false balance" (a standard journalistic ethic).
  *   **Step 5 (Deviation):** Some editors insist on "Vast Majority" instead of "Scientists Agree."
  *   **Verdict:** **Judgment Call.**
  *   **Why:** The procedure identifies the omission, but the *motivation* is ethical (preventing false balance) rather than sensational. Reasonable editors disagree on whether "Consensus" implies "Unanimity."

  ---

  ### What The Procedure Cannot Catch

  You asked for honesty about the limitations. This protocol analyzes *text and intent within a single piece*. It cannot catch structural or cumulative distortions.

  **1. Selection Bias (The Agenda Setting)**
  The procedure assumes you have already decided to write the story. It cannot tell you if *choosing* to cover Study A (positive result) while ignoring Study B (null result, same topic) is misleading.
  *   *Example:* You write about a new "breakthrough" in Alzheimer's mouse models. You don't mention the 14 previous mouse models that failed in humans.
  *   *Protocol Result:* **Clean.** (Every sentence about the current mouse model is true).
  *   *Reality:* **Misleading.** (You are creating a false impression of the field's progress).
  *   *Fix:* This requires a newsroom policy on "state of the field" context, not an editorial checklist.

  **2. The "Truthful Metaphor" Trap**
  Metaphors are technically lies ("The gene *switch*," "The brain *circuit*"). The protocol treats them as "Understandability" (Step 4).
  *   *Example:* Describing natural selection as "Nature wants..."
  *   *Protocol Result:* **Judgment Call.**
  *   *Reality:* This reinforces teleological thinking that is scientifically wrong. The procedure relies on your judgment of whether the metaphor is "dead" (accepted shorthand) or "live" (implies mechanism). It cannot measure the cumulative cognitive damage of vivid, wrong metaphors.

  **3. Reader Prior Beliefs**
  The protocol assumes a "Reasonable Reader." It cannot account for motivated reasoning.
  *   *Example:* You write a nuanced piece on vaccine safety, acknowledging rare side effects to build trust.
  *   *Protocol Result:* **Clean.**
  *   *Reality:* Anti-vax readers may seize on the acknowledgment of side effects as proof of danger. Pro-vax readers may feel you legitimized danger.
  *   *Limitation:* You cannot edit for how bad-faith actors will weaponize truthful text. If you try to, you will end up lying to protect the truth.

  ### Final Advice for the Editor

  Use the protocol to catch the **egregious** slips (Case 1 & 2). Accept the **Judgment Calls** (Case 3) as the cost of doing business in communication.

  But for what the procedure *can't* catch (Selection Bias, Cumulative Metaphors), you need a different tool: **The "State of the Field" Paragraph.**

  Make it a house rule that any story about a single study must include one paragraph (usually near the end) that contextualizes that study against the broader literature. That is the only way to solve the selection bias problem that this sentence-level protocol cannot touch.
