      *   *Idea:* The "Consensus" frame. "Scientists agree X" when it's 80% agree, 20% dissent.
      *   *Let's try the "Risk Doubling" case.* It highlights the difference between literal truth and practical utility.

  5.  **Refining the Procedure (incorporating philosophical nuances):**
      *   *Grice's Maxim of Quantity:* Are we giving enough info?
      *   *Implicature:* Is the false belief *invited* or just *possible*?
      *   *Salience:* Are we making the minor thing look major?

      *Revised Steps:*
      1.  Literal Truth Check.
      2.  The "Therefore" Test (Implicature).
      3.  The Salience/Weight Check (Omission).
      4.  The Repairability Check.
      5.  The Motivation Check.

