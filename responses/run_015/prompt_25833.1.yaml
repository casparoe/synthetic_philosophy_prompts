      *   *Gricean Maxims:* Quality (truth), Quantity (information), Relation (relevance), Manner (clarity). Violating these generates implicatures.
      *   *Intention:* Did the editor *intend* the reader to form a false belief? Or did they just prioritize readability?
      *   *Reasonable Reader Standard:* What would a "reasonable, smart non-specialist" infer?
