  To: Committee for Interdisciplinary Program Approval
  From: Committee Member
  Date: October 23, 2023
  Subject: Recommendation regarding Custom and Causation Seminar Proposal

  Dear Colleagues,

  I am writing to circulate my opinion regarding the proposal for the year-long seminar series Custom and Causation prior to our meeting this Thursday, and my bottom-line recommendation is conditional approval contingent upon specific curricular revisions that address the pedagogical risks identified in the physics co-sponsor's dissent. This proposal represents a intellectually rigorous opportunity to engage students with Al-Ghazālī's occasionalism, specifically his critique of necessary causal connections in favor of customary conjunctions sustained by divine will, and the theology co-sponsor is correct that treating this as a live epistemological option rather than a historical artifact enriches our students' understanding of the metaphysical assumptions underpinning natural philosophy. However, the value of this interdisciplinary exploration must not come at the cost of confusing students regarding the operational foundations of scientific inquiry, which is the core validity of the physics co-sponsor's objection.

  The physics co-sponsor argues that presenting occasionalism as a live framework risks conflating methodological naturalism with a metaphysical denial of causation, potentially leaving students unable to articulate why scientific explanation seeks mechanisms rather than merely recording correlations. This concern is not merely secular prejudice but a legitimate pedagogical safeguard regarding how students internalize the purpose of scientific modeling. If students leave the seminar believing that the search for mechanistic explanation is optional because regularities are merely customary rather than necessary, we have failed them as a university committed to scientific literacy alongside philosophical depth. Therefore, my conditional approval requires that the syllabus explicitly delineate the distinction between metaphysical claims about ultimate causality and methodological commitments to proximate causation, ensuring that assessments verify the students' ability to navigate both frameworks without collapsing one into the other.

  I must acknowledge that the strongest consideration on the losing side, which argues for outright rejection, is that this distinction is too subtle for most undergraduates to maintain reliably and that legitimizing occasionalism as a live option inherently destabilizes the intuition required for scientific training. There is genuine merit to the view that introducing radical skepticism about causal powers during formative coursework may induce a confusion that syllabus tweaks cannot fully remedy, as the very act of treating divine interruption as a live epistemological option competes with the heuristic necessity of assuming uniform natural laws during scientific practice. While I believe this risk can be managed through careful instructional design, I recognize that the physics co-sponsor's fear is grounded in the reality that students often struggle to compartmentalize metaphysical possibility from methodological necessity, and if the revised proposal fails to demonstrate concrete strategies for maintaining this boundary, the argument for rejection would become decisive.

  To mitigate this risk, the proposing faculty must submit a revised syllabus and joint pedagogical statement by November 15 that details how specific modules will reinforce the distinction between predictive success based on regularity and explanatory success based on mechanism. This revision timeline allows sufficient opportunity for the committee to review the safeguards before the seminar begins in the spring semester, and it ensures that the physics department's concern is addressed through concrete implementation rather than abstract assurance. I urge the committee to adopt this conditional stance, as it preserves the interdisciplinary value of the proposal while respecting the serious epistemological concerns raised by our colleagues in the sciences, ensuring that the seminar clarifies rather than conflates the boundaries between theology and physics.

  Sincerely,

  Committee Member
