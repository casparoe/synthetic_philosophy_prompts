answer: |-
  Here is the diagnosis.

  **The Verdict**
  Reject **Premise 6**. I am 90% confident this is the load-bearing crack. The argument is valid, but unsound because Premise 6 imports a normative intuition that applies to *uncertainty about chances* into a context that stipulates *certainty about chances*.

  **The Diagnosis**
  Your student is right about the logic of (1) through (5), and wrong to think this saves the "guide to life" claim without qualification. You are right that something is wrong, but your instinct to target (2) or (3) is misplaced.

  The argument turns on an equivocation in Premise 6 regarding what it means for chance to be a "guide to life."
  *   **Sense A:** Chance guides life by telling you how to set your credences *once you have a hypothesis about the chance*. (This is what the Principal Principle does.)
  *   **Sense B:** Chance guides life by telling you how to *find* the right chance hypothesis in the first place. (This is what statistical inference does.)

  Premise 6 claims that a principle requiring you to disregard frequency evidence is "not a guide to life." This is true for Sense B. If you ignore frequency data, you will never learn the chances. But Premise 5 establishes that the Principal Principle requires you to disregard frequency evidence *only conditional on being certain of the chance hypothesis*.

  If you are certain the coin is fair ($X = 0.5$), then a run of 100 heads ($F$) **ought not** to move your credence in the next head. To think otherwise is the Gambler's Fallacy. The intuition that "a run of non-sixes should move me" (from Premise 6) is an intuition that you *should not be certain* the die is loaded 0.6. It is an intuition about the fragility of your certainty in $X$, not about the connection between $X$ and $A$.

  The argument tries to generate a *reductio* of the Principal Principle by showing it yields counterintuitive results. But the result (that frequency data doesn't move credence given chance certainty) is not counterintuitive; it is a theorem of independence. The counterintuitiveness arises only if you smuggle in the idea that rational agents are never certain of chances. But if agents are never certain of chances, the antecedent of (1) is never met, and the Principle is vacuously true, not false.

  **The Cost of Rejecting 6**
  Rejecting 6 saves the Principal Principle, but it forces you to concede that the Principal Principle is **not a complete epistemology of chance**.
  1.  **PP is Incomplete:** You must admit that PP alone does not tell an agent how to respond to the world. It must be paired with a theory of inference (e.g., Bayesian updating) that governs how evidence $F$ moves your credence in $X$. PP handles the step from $C(X)$ to $C(A)$; it does not handle the step from $F$ to $C(X)$.
  2.  **"Guide to Life" is Qualified:** You cannot claim chance is a guide to life *simpliciter*. It is a guide to life only for agents who have already done the inductive work to form credences about chances.
  3.  **No Sacrifice on Admissibility:** You do *not* have to give up the attractiveness of the past being admissible. Past frequency data is admissible precisely because, *given $X$*, it is irrelevant to $A$. Rejecting 6 preserves the temporal gloss of admissibility (Past = Admissible, Future = Inadmissible) without circularity. Admissibility is defined by the *type* of information (temporal location), not by its probabilistic impact. This avoids the charge that PP is true by stipulation.

  **Why Your Instinct on (2)/(3) Was a Trap**
  You worried that calling frequency data "evidence about the past" (3) begs the question because it is also "evidence about the chance." It is both. But PP asks: is it evidence about $A$ *over and above* $X$? If trials are independent, the answer is no. If you reject (3), you are claiming that past outcomes are *inadmissible*. If past outcomes are inadmissible, then $C(A | X \land \text{Past}) \neq x$. This implies that knowing the past gives you a "crystal ball" into the future *even if you know the chance*. That destroys the objective link between chance and credence. You would rather swallow the incompleteness of PP than make the past inadmissible.

  **Follow-Up 1: The New Principle (Expected Chance)**
  Does swapping to the version where $C(A) = \sum C(X_i) \cdot x_i$ dissolve (5)?
  *   **Technically:** No. (5) remains a true theorem about the *conditional* credence $C(A | X)$.
  *   **Practically:** Yes, it dissolves the *force* of the objection. The New Principle (or the "Generalized Principal Principle") applies to your *unconditional* credence. Since you are rarely certain of $X$, your unconditional $C(A)$ *will* move when you see frequency data $F$, because $F$ moves your $C(X)$.
  *   **Relocation:** It relocates the problem one level up. It forces you to have a prior distribution over chance hypotheses. If your priors are dogmatic (certainty in $X$), the New Principle collapses back into the old PP, and you are back in the trap of (5). So the New Principle doesn't solve the logical problem; it solves the *pragmatic* problem by acknowledging that certainty in $X$ is the real villain, not the PP.

  **Follow-Up 2: Humean Chance and Shifting Functions**
  Is there a leftover problem about chance functions shifted by evidence?
  *   **The Real Threat:** The problem you are circling is not past frequency; it is **Undermining**. For a Humean, chances supervene on the entire Humean Mosaic (past, present, and *future*). Evidence about the *future* (an undermining future) can be admissible in the temporal sense (if you have a crystal ball) but it changes the chance itself. If $E$ implies the chance is $x'$, but $X$ says the chance is $x$, then $X \land E$ is inconsistent.
  *   **Past Frequency:** For a Humean, past frequency is just part of the mosaic. It fixes the chance (along with the future). It does not "shift" the chance at $t$; it helps determine what the chance at $t$ *is*.
  *   **Non-Humeans:** A propensity theorist treats chance as a physical property at $t$. Past frequency is evidence for that property. It doesn't shift the property; it reveals it.
  *   **Load-Bearing:** The Humean part of the story is **not** load-bearing for *this* specific argument. This argument fails for Non-Humeans too. The Humean view becomes load-bearing only if you introduce *future* evidence (Undermining), which requires the "New Principle" to fix the inconsistency between $X$ and $E$. For past frequency, Humean and Non-Humean agree: $F$ is admissible, and $C(A | X \land F) = x$.

  **Summary for the Seminar**
  Tell the class the argument is valid but unsound. Premise 6 is the failure point. It demands the Principal Principle solve the problem of induction (learning chances from frequencies), when its job is only to bridge known chances to credences. The student is right that (5) is a feature, not a bug. The "crack" is the expectation that a principle of *coordination* should also be a principle of *discovery*. If you force PP to do both, you get a contradiction. If you let it do only what Lewis intended (coordination), the argument collapses.

  **One Caveat on Lewis**
  I am leaning on the standard reading of Lewis (1980, "A Subjectivist's Guide to Objective Chance"). Lewis himself later conceded the PP needed revision due to Undermining (1994, "Humean Supervenience Debugged"). Do not conflate the Undermining problem with the Past Frequency problem. Your argument is about Past Frequency. Lewis's PP handles Past Frequency fine. It breaks on Future Evidence. Don't let the students slide from one to the other.
