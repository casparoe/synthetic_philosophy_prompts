  **Case C: The Moral Cyborg (Neural Implant)**
  *   **Verdict:** **Resentment is fair (if they turn it off).**
  *   **Reasoning:** The implant is treated as a **tool**, like the brakes on the texting driver's car. If they choose to disable the safety mechanism and harm occurs, that expresses the same "indifference" as the lazy friend. If the implant *malfunctions* while active, it reverts to the **Sleepwalker** verdict (no resentment).
  *   **Key Distinction:** It confirms that external regulation doesn't remove agency if the human retains the "off switch."

  ### 2. The Underlying Rule

  She is running the **"Culpable Participant" Rule.**

  It is not just about *Conscious Control* (excludes texting driver).
  It is not just about *Emotional Architecture* (excludes lazy friend, includes corp).
  It is not just about *Moral Participation* (excludes 6-year-old).

  **Her Rule:** Resentment is appropriate if and only if:
  1.  **Status:** The agent is a member of the moral community (human, adult, sane-ish).
  2.  **Quality of Will:** The harm reflects a culpable quality of will. This includes **direct ill will/indifference** (lazy friend) OR **culpable risk creation** (texting driver, refusing meds).

  She exempts agents who lack the *capacity* for reciprocal goodwill (kids, chimp, corp, sleepwalker, depressed friend) but holds them responsible if they *culpably mismanage* that capacity.

  ### 3. The Real Decider (The Splitter Case)

  Right now, her list allows her to conflate "Lack of Capacity" with "Lack of Ill Will." To split her rules, you need a case where an agent has the **Capacity** but lacks the **Emotional Architecture** to feel ill will, yet still causes harm deliberately.

  **The Case:** **The Rational Psychopath.**
  *   **Scenario:** A human adult who lacks the neural capacity for empathy or guilt (like the Corp/AI) but is fully rational and calculates that harming you benefits them (like the Lazy Friend). They understand the rules but don't *feel* them.
  *   **Why it splits the rules:**
      *   **Rule 1 (Emotional Architecture):** If she follows the **Corp/Chimp** logic, she should say **No Resentment**. They are the "wrong kind of mind" to participate in the reactive attitudes. You can't resent a shark for biting; you can't resent a psychopath for stabbing.
      *   **Rule 2 (Moral Participation + Choice):** If she follows the **Texting Driver/Lazy Friend** logic, she should say **Full Resentment**. They are a moral participant making a choice that expresses indifference to your welfare.
  *   **The Prediction:** She will likely say **Resentment**.
  *   **Why:** Her verdict on the **Texting Driver** suggests she cares more about the *choice to risk harm* than the *internal emotional state*. The psychopath chooses harm; the depressed friend does not.

  **Alternative Splitter (The "Addict" Variation):**
  If you want to test the **Depressed Friend vs. Lazy Friend** boundary specifically:
  *   **Case:** A friend steals your wallet to feed a severe heroin addiction.
  *   **Split:** Is addiction like depression (an incapacity that exempts them) or like laziness (a prioritization of self over you)?
  *   **If she says No Resentment:** She prioritizes **Capacity/Control** (Addiction compromises will).
  *   **If she says Resentment:** She prioritizes **Prior Choice/Character** (They chose the drug initially, like the meds case).

  **Recommendation:** Use the **Rational Psychopath**. It directly attacks the "Wrong Kind of Mind" exemption she gave the Corporation and Chimp, forcing her to decide if "Humanity" alone is enough for the participant stance, or if "Empathy" is required. That is the core tension in Strawson's framework she hasn't had to resolve yet.
