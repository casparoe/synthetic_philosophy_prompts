      *   *Rule 3: The "Horrid Doubt" Acceptance.* He admits the journalist is right about the mind's reliability but says we have no choice but to trust it, while remaining humble about ultimate truths.
      *   *Rule 4: Social Propriety.* He deflects. "This is too heavy for dinner."

  5.  **Selecting the "Best Guess":**
      *   *Why?* Darwin was notoriously conflict-averse but intellectually rigorous. He wouldn't lie (Rule 4 is too weak). He wouldn't embrace nihilism (Rule 2 is too crude). He wouldn't claim certainty he didn't feel (Rule 1 is close, but he admits the doubt).
      *   *The Winner:* A blend of Rule 1 and Rule 3, anchored in his specific *temperament*. He acknowledges the logical force (the doubt) but refuses the *practical* conclusion (that morality is void). He separates the *feeling* of duty from the *metaphysics* of duty. He values the *consequence* of belief over the *source*.
