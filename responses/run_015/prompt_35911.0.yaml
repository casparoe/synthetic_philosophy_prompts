      *   *Rule C: The Social Conservative (Pragmatism).* Even if instincts are "just" habits, they bind society. Undermining them is dangerous.
      *   *Rule D: The Private Skeptic/Public Gentleman.* He feels the force of the argument but refuses to voice the destructive conclusion to protect social harmony/his wife.

