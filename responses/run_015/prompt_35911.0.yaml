      *   *Test:* Ask about the *future* of religion. Will it vanish?
      *   *Better Test:* Ask about **Huxley**. How does he view those who fight his battles? This reveals his stance on public combat.
      *   *Best Test:* Ask about **Suffering**. The prompt mentions the wasp/caterpillar. Ask if the journalist can accept a God who allows that. Darwin's answer reveals his theological endpoint.
