          *   *Problem:* (b) is a charity appeal using guilt. That's transactional gain for charity using emotional vulnerability. Why is (b) Permitted? Maybe because (b) is general public, New Case is *specifically selected* for vulnerability.

      *   *Rule 3: The "Hidden Lever" Rule (Mechanism-focused).* Manipulation occurs when the causal mechanism driving the decision is concealed from or unintelligible to the target, even if the facts are true.
          *   *Fit:* (g) User doesn't know *why* they got the notification at 1 a.m. (f) User doesn't absorb risk info. (e) User doesn't know scarcity is fake. (d) Child doesn't understand placement strategy.
