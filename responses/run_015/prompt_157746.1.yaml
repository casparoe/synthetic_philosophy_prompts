answer: |-
  **MEMORANDUM**

  **TO:** Influence Practices Panel
  **FROM:** Staff Lawyer
  **RE:** Reconstruction of Precedents and Prediction for Next Month's Determination

  You have asked for a reconstruction of the Panel's implicit reasoning, a prediction on the new bereavement fundraising case, and an honest assessment of whether our precedents actually support a determinate outcome. Below is the analysis.

  ### 1. Candidate Rules and Predictions

  To account for the split between the "Permitted" and "Manipulative" buckets, specifically reconciling the difficult pairs of (d)/(c) and (h)/(New Case), I propose three candidate rules.

  **Rule A: The "Impaired Agency" Test (Process-Focused)**
  *   **Formulation:** A practice is manipulative if it significantly degrades the target's capacity to process information or exercise choice *at the moment of decision*, unless the target can easily neutralize the influence without cost.
  *   **Fit:** Explains (f) [info obscured], (e) [lies distort], (g) [timing impairs judgment], and (d) [children lack capacity).
  *   **The Clause:** To accommodate (a) [pre-tick] and (c) [persistence], the rule requires a "Reasonable Countermeasure" clause: If the target can easily undo the influence (one click) or is in a context where resistance is expected (labor organizing), agency is not impaired.
  *   **Prediction for New Case:** **Permitted.** The script is neutral, there is no pressure to decide on the spot, and the target can say "no" without cost. The disclosure explains the mechanism. Unlike (g), where the timing was algorithmic and opaque, here the mechanism is spoken aloud. The "Impaired Agency" test struggles to find impairment if the target knows *why* they are being visited and faces no friction in refusing.
  *   **Trouble:** It struggles to justify (g). In (g), unsubscribing took two taps (easy countermeasure), yet it was ruled manipulative. If ease of exit did not save the dating app, it should not save the fundraiser.

  **Rule B: The "Hidden Mechanism" Test (Transparency-Focused)**
  *   **Formulation:** A practice is manipulative if the causal lever driving the influence is concealed from or unintelligible to the target, even if the factual claims are true.
  *   **Fit:** Explains (g) [user doesn't know *why* notification arrived at 1 a.m.], (f) [risk info hidden in plain sight], (e) [scarcity fake], and (d) [child doesn't understand placement strategy).
  *   **The Clause:** To accommodate (b) [emotional guilt] and (c) [persistence], the rule must exclude "Interpersonal Levers." Emotional appeals and social pressure are visible human interactions; manipulation arises from *structural* or *data-driven* concealment.
  *   **Prediction for New Case:** **Permitted.** The fundraiser explicitly discloses the mechanism ("we visit now because you give more"). The lever is no longer hidden. This distinguishes it sharply from (g), where the data usage was implicit.
  *   **Trouble:** It struggles to justify (d). A supermarket shelf is not "hidden." A child can see the candy. The manipulation in (d) is the *placement*, not the concealment of the placement. If visibility cures manipulation, (d) should have been permitted.

  **Rule C: The "Instrumentalization of Vulnerability" Test (Ends-Focused)**
  *   **Formulation:** It is manipulative to select and time an interaction based on a specific psychological vulnerability (bereavement, childhood, impulse states) if the primary purpose is to extract a transaction (money, data, commitment) that benefits the influencer, rather than to provide a benefit to the target.
  *   **Fit:** Explains (h) [Permitted: benefit to target], (d) [Manipulative: commercial gain from kids], (g) [Manipulative: engagement gain from lonely users], and (e) [Manipulative: sale gain from deception].
  *   **The Clause:** To accommodate (b) [Charity guilt] and (c) [Union pressure], the rule requires a "General vs. Specific" distinction. Appealing to general human emotions (guilt, solidarity) is permitted. Targeting *specific* impaired states identified via data (obituaries, late-night usage, eye-level) is manipulative *if transactional*.
  *   **Prediction for New Case:** **Manipulative.** The household is selected for a specific vulnerability (bereavement) via data (obituaries). The end is transactional (donation/commission). Unlike (h), the target receives no direct benefit (counseling). Unlike (b), the targeting is specific, not general.
  *   **Trouble:** It requires treating the "commission" aspect as dispositive. If the fundraiser were unpaid, would it flip to Permitted? The rule implies yes, which may be an unstable distinction for a regulator.

  ### 2. Prediction and Reasoning

  **Predicted Ruling:** **Manipulative.**

  **Closest Precedent:** **(g) Truthful but timed notification.**
  While (h) involves the same vulnerability, (g) is the stronger analog for the *mechanism* of influence. In (g), the Panel ruled that truthful content and easy unsubscribing did not cure the manipulation inherent in using data to time an interaction for peak psychological impact. The New Case is (g) with a doorstep instead of a phone, and a donation instead of app engagement.

  **Reasoning:**
  I prefer **Rule C (Instrumentalization)** because it is the only rule that successfully reconciles (h) with (d) and (g).
  *   (h) was Permitted because the end was benign (counseling).
  *   (d) and (g) were Manipulative because the end was gain (sales/engagement) extracted from a vulnerable state.
  *   The New Case involves gain (donation/commission) extracted from a vulnerable state.

  The disclosure at the door does not cure the defect. In (g), the notification was truthful; the manipulation was the *selection and timing*, not the content. In the New Case, the selection and timing are the complaint. A disclosure delivered *after* the influencer has already exploited the vulnerability to secure the audience (the doorstep visit) is retrospective justification, not prospective consent.

  **Confidence:** **70% (Moderate-High).**
  The split vote in (h) (4–3) indicates the Panel is already fractured on bereavement targeting. However, the presence of a *paid commission* distinguishes this from (h) and aligns it with the commercial precedents (d) and (g).

  **Fact That Would Move Me Most:**
  **Whether the fundraiser is paid on commission.**
  If the visitor were a **volunteer** (no commission, no paid fundraiser), the case moves closer to (c) (Union/Organizer) and (b) (Charity). It removes the "commercial transaction" element that makes (d) and (g) manipulative under Rule C. If the Panel permits the volunteer version but bans the paid version, it confirms Rule C. If they ban both, it confirms a stricter "No Vulnerability Targeting" rule.

  ### 3. The Honest Part: Underdetermination

  **Do the precedents genuinely underdetermine this?**
  **Yes.** The tension between (g) and (h) is not fully resolved.
  *   **(g)** suggests that *timing based on vulnerability data* is inherently manipulative, regardless of truthfulness.
  *   **(h)** suggests that *timing based on vulnerability data* is permissible if the intent is benevolent.

  The New Case sits in the middle: The intent is charitable (like h), but the mechanism is professionalized/commercialized (like g). The Panel must decide whether "Charity" cures "Commercial Tactics."

  **If the Panel rules Permitted:**
  *   **Principle Adopted:** "Transparency and Truthfulness Cure Context." If you tell people what you are doing and don't lie, you may target them whenever you like.
  *   **Awkward Commitment:** This undermines (g). In (g), the message was truthful. If truthfulness cures the timing issue in the New Case, (g) becomes difficult to defend unless you argue that 1 a.m. notifications are *inherently* deceptive, which is a stretch. It also risks legitimizing (d)—a supermarket could argue the candy placement is "visible" and "truthful."

  **If the Panel rules Manipulative:**
  *   **Principle Adopted:** "Vulnerability Selection is Inherently Coercive." You cannot use data to target people when they are least able to resist, even if you are honest about it.
  *   **Awkward Commitment:** This creates a paternalistic barrier to charitable giving. It implies bereaved people cannot be trusted to make donation decisions even with full disclosure. It also threatens (b). If targeting bereaved people is off-limits, is targeting "guilty" people (b) next? It forces the Panel to draw a line between "General Emotion" (Permitted) and "Specific Vulnerability" (Forbidden) that is notoriously difficult to define without arbitrary distinctions.

  ### 4. Specific Features of the Case

  **Selection/Timing vs. Content:**
  You asked if the neutrality of the script makes the case easy. **It does not.** Precedent (g) is dispositive here. The manipulation in (g) was *not* the content (which was truthful); it was the *timing and data usage*. The Panel has already established that the *context of the approach* can be manipulative independent of the *content of the message*. To rule otherwise would be to overrule (g) by implication. The neutrality of the script is window dressing; the exploitation occurred when the obituary data was used to schedule the visit.

  **Disclosure and Uptake:**
  You asked if disclosure at the door counts if the target is at their "low point." **It does not count.** This is the lesson of (f). In (f), the risk information was "on screen throughout." It was technically disclosed. It was ruled manipulative because it was engineered for *non-uptake*.
  In the New Case, the disclosure is engineered for *post-hoc justification*. The decision to open the door and listen has already been influenced by the timing (bereavement window). A disclosure made *after* the vulnerability has been leveraged to secure attention is not effective consent. To hold otherwise would allow influencers to create a coercive context and then "cure" it by reading a waiver. The Panel's treatment of (g) suggests they view the *arrangement of the interaction* as the regulated act, not just the speech within it.

  ### 5. The Discriminating Test Case

  Your candidate (deceased was a registered donor) introduces **Consent**. This is a strong discriminator, but it conflates "Vulnerability" with "Privacy." If the deceased consented, does that cure the *family's* vulnerability? It muddies the water.

  **My Proposed Test Case:**
  **The "Unpaid Volunteer" Variation.**
  *   **Facts:** Identical to the New Case (obituary selection, 3–7 week timing, neutral script, full disclosure of timing reason), *except* the visitor is an **unpaid volunteer** receiving no commission, and the charity retains 100% of the donation for research.
  *   **Why this separates the rules:**
      *   **Rule A (Impaired Agency):** Result unchanged. The cognitive load on the bereaved is the same regardless of who asks.
      *   **Rule B (Hidden Mechanism):** Result unchanged. The mechanism is disclosed in both.
      *   **Rule C (Instrumentalization):** Result **flips**. If the visitor is unpaid and the money goes to research, the "Transactional Gain for Influencer" element vanishes. It becomes indistinguishable from (h) (Hospice counseling), except the benefit is to third parties (research) rather than the target.
  *   **Confirmation:**
      *   If the Panel rules **Permitted** on the Volunteer Variation but **Manipulative** on the Paid Fundraiser Case, it confirms **Rule C**. The sin is the *commercialization of vulnerability*, not the vulnerability targeting itself.
      *   If the Panel rules **Manipulative** on *both*, it confirms a stricter principle: **Bereavement is a Non-Commercial Zone.** This would be a significant expansion of regulatory power, effectively banning a wide swathe of charitable fundraising.

  **Recommendation:**
  Draft the determination assuming **Rule C** is the governing principle. The Panel has consistently allowed vulnerability targeting when the end is benign ((h)) or the means are interpersonal/general ((b), (c)). It has consistently banned it when the end is transactional and the means are data-driven/structural ((d), (g)). The paid commission makes this transactional. The obituary data makes it structural. The determination should find Manipulation, distinguishing (h) on the basis of the *ask*, and (b) on the basis of the *targeting*.

  However, include a footnote acknowledging the (h) dissent. The 4–3 split there warns that this ruling will be close. If you wish to secure a majority, you must emphasize the **commission** structure. That is the clearest link to the commercial precedents (d) and (e) and the clearest distinction from the benevolent precedent (h).
