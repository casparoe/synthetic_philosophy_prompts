  2.  **Deconstruct the Precedents (Pattern Recognition):**
      *   *Permitted:* (a) Friction exists but is low/removable. (b) Emotional guilt (high intensity) but no deception/coercion. (c) Persistence/pressure but truthful/no false statements. (h) Vulnerability targeted (bereavement) but *benign end* (counseling, no ask).
