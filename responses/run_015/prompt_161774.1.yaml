answer: |-
  # The question

  **Case:** Bea suffers from a condition with strains A (prior credence 0.8) and B (0.2). She must choose Surgery (utility 10 if A, 0 if B) or Drug (utility 2 if A, 9 if B). She may take a free test (results + or -) with likelihoods: $P(+|A)=0.8, P(+|B)=0.4$. Bea has a fixed disposition called "prior-forgetting": upon seeing result $R$, she sets her credence in A to $P(R|A) / [P(R|A) + P(R|B)]$, ignoring her prior. She knows she has this disposition. Before testing, she may: (i) decline the test; (ii) take the test and choose freely afterwards; or (iii) sign a binding directive committing to a treatment rule before seeing the result.

  **(a)** Calculate Bea's expected utility for options (i), (ii), and (iii). Show the test's value is 0 for a perfect Bayesian but strictly negative for Bea. How much utility should she pay to avoid taking the test if she cannot sign a directive? Explain in one sentence why the numbers differ. **(10 marks)**

  **(b)** Identify exactly which step in the standard proof of Good's theorem fails for Bea. Assess the objection that "free information can't hurt because you can always ignore it": does this work for Bea, and what does it presuppose about an agent's control? **(8 marks)**

  **(c)** Is Bea irrational to decline the test? Is she irrational to have the disposition? What does this case show about Good's theorem: is it refuted, does it require extra premises, or does it merely fail to argue independently for conditionalization? **(7 marks)**

  **(25 marks total)**

  # Model answer

  **(a)**
  **Prior EU (Decline):** $EU(S) = 0.8(10) + 0.2(0) = 8$. $EU(D) = 0.8(2) + 0.2(9) = 3.4$. Max EU = **8** (Surgery).
  **Perfect Bayesian:** Posterior $P(A|+) = 8/9$; $P(A|-) = 4/7$. Both exceed the switching threshold ($17p > 9 \rightarrow p > 0.53$). A Bayesian always chooses Surgery. EV of Info = **0**.
  **Bea (Test & Choose):**
  Marginals: $P(+) = 0.72$, $P(-) = 0.28$.
  Bea's Credences: If +, $c(A) = 0.8/1.2 = 2/3$. If -, $c(A) = 0.2/0.8 = 1/4$.
  Choice if +: $EU(S)=20/3 \approx 6.7$, $EU(D)=13/3 \approx 4.3$. Chooses Surgery.
  Choice if -: $EU(S)=2.5$, $EU(D)=7.25$. Chooses Drug.
  Ex-ante EU: $0.72(20/3) + 0.28(7.25) = 4.8 + 2.03 =$ **6.83**.
  **Directive:** Bea can commit to "Always Surgery". EU = **8**.
  **Value:** Test value for Bea = $6.83 - 8 = -1.17$. She should pay up to **1.17** units to avoid the test if unbound.
  **Explanation:** The test induces Bea to switch actions in state (-) based on distorted credences, reducing true expected utility.

  **(b)**
  **Proof Failure:** The standard proof swaps $\sum_r P(r) \max_a EU(a|r)$ with $\max_a \sum_r P(r) EU(a|r)$. This assumes the agent maximizes *true* expected utility conditional on $r$. Bea maximizes *subjective* expected utility using distorted posteriors. The inequality holds for true posteriors, not Bea's.
  **"Ignore It" Objection:** This fails for Bea in option (ii). While physically possible to choose Surgery after seeing -, her disposition forces her to evaluate acts using wrong credences, making Drug the unique maximizer. She cannot "ignore" the information because she cannot prevent it from altering her decision-rule inputs.
  **Presupposition:** The objection presupposes the agent controls the mapping from credence to action (akrasia is possible) or controls the updating rule itself. Bea lacks the latter.

  **(c)**
  **Rationality:** Bea is instrumentally irrational to choose option (ii) (Test & Choose) since she knows it yields less utility than (i) or (iii). She is not necessarily irrational to have the disposition if it is involuntary (like a perceptual illusion), though it is maladaptive.
  **Good's Theorem:** The theorem is not refuted but requires the explicit premise that the agent updates via conditionalization (or preserves the martingale property of credences). It cannot be used as an independent argument that one *ought* to conditionalize, because the value of information depends on *already* conditionalizing. It shows Good's theorem describes the value of information for Bayesians, not the value of information simpliciter.

  # Marking scheme

  **Part (a) [10 marks]**
  *   **Prior EU Calculation (2 marks):** Correctly identifies Surgery as optimal with EU=8. (1 for math, 1 for choice).
  *   **Perfect Bayesian Check (2 marks):** Shows posteriors remain above threshold, so action doesn't change, EV=0.
  *   **Bea's Posteriors & Choices (3 marks):** Correctly calculates Bea's distorted credences (2/3, 1/4) and resulting choices (Surgery for +, Drug for -).
  *   **Bea's Ex-Ante EU (2 marks):** Correctly weights outcomes by true marginals (0.72, 0.28) to get 6.83. (Deduct 1 if using Bea's credences as weights).
  *   **WTP & Explanation (1 mark):** Correct difference (1.17) and concise explanation (distorted credence leads to wrong act).

  **Part (b) [8 marks]**
  *   **Proof Step Identification (4 marks):** Identifies that the proof assumes the agent maximizes *true* conditional EU, whereas Bea maximizes *distorted* subjective EU. (Full credit for pinpointing the inner max term).
  *   **"Ignore It" Assessment (2 marks):** Correctly states it fails for Bea without a directive because her updating disposition dictates her choice.
  *   **Control Presupposition (2 marks):** Identifies that the objection requires control over updating rules or the ability to act against one's current maximal expected utility.

  **Part (c) [7 marks]**
  *   **Rationality of Declining (2 marks):** Correctly argues declining (or directing) is rational; taking test freely is irrational.
  *   **Rationality of Disposition (2 marks):** Distinguishes between voluntary actions and involuntary dispositions (not irrational to have bugs, only to act on them knowingly).
  *   **Good's Theorem Implications (3 marks):** Articulates that the theorem is conditional on Bayesian updating; it cannot justify updating rules circularly. (Full credit for "needs extra premises" or "fails as independent argument").

  # A-grade vs B-grade

  The single move that separates an A-grade from a B-grade is the handling of the "ignore it" objection in part (b). A B-grade student will correctly note that Bea gets bad results but will claim she "could" just ignore the test, treating the disposition as a mere preference. An A-grade student will recognize that the disposition is a constraint on her *decision mechanism*: she literally cannot maximize utility based on the prior after seeing the result because her credences (the inputs to maximization) have involuntarily changed. They will explicitly link this to the presupposition of control over updating rules required for Good's theorem to hold.

  # Typical wrong answers

  *   **Weighting by Bea's Credences:** Calculating Bea's ex-ante EU by weighting the outcomes by her distorted posteriors (e.g., using 2/3 and 1/4 as probabilities of results) rather than the true marginals (0.72, 0.28). This reveals a confusion between subjective confidence and objective frequency.
  *   **Positive Value for Bea:** Arguing the test has positive value because Bea changes her mind. This reveals a misunderstanding of expected utility as truth-tracking rather than coherence-tracking.
  *   **Good's Theorem is False:** Concluding that Good's theorem is refuted simpliciter. This reveals a failure to distinguish between a theorem's conditions and its conclusion.
  *   **Directive = Decline:** Treating the directive option as identical to declining the test without noting that the directive allows taking the test while binding the action, proving the information itself isn't the harm, but the free choice afterwards.
  *   **Circular Justification:** Arguing that Bea ought to conditionalize *because* Good's theorem says information is valuable. This misses the point that the theorem assumes conditionalization to prove value.
  *   **Threshold Error:** Failing to check the switching threshold for the Perfect Bayesian, assuming incorrectly that a Bayesian would switch actions on result (-).
