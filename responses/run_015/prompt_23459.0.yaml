      *   *Step 3 (Logician):* The Division of Linguistic Labor (Putnam). Experts/Environment fix reference, not individual descriptions. Microstructure is essential.
      *   *Step 4 (Philosopher of Science):* The "Kicking the Can" objection. Experts rely on a posteriori facts. In a world with XYZ, "water" would refer to XYZ. Therefore contingent.
      *   *Step 5 (Logician):* Twin Earth intuition. XYZ isn't water. It's a different kind. Hence necessary.
      *   *Step 6 (Philosopher of Science):* The "Stipulation" charge. You're defining water as H2O by fiat and calling it a discovery.

  3.  **Evaluate Each Step (Mental Sandbox):**

      *   *Step 1:* Logician is standard Kripke. *Verdict:* Technically correct within the Kripkean framework, but assumes the framework holds.
      *   *Step 2:* PhilSci raises a genuine problem about reference fixing (the "mode of presentation" issue). *Verdict:* Strong point. Kripke admits reference can be fixed by description, but denies the description gives the *meaning*. PhilSci is conflating fixing with meaning, but the underdetermination point is valid.
      *   *Step 3:* Logician invokes Putnam. *Verdict:* This is the standard defense. It shifts burden to the external world. Strong move.
