      *   *Argument:* "Barbarism" is relative. Europeans torture each other (religious wars) and burn people at the stake, which is arguably worse than eating a dead enemy (which the Tupinambá did as a ritual of vengeance/honor).
      *   *Goal:* Not necessarily to say "everything is equal," but to hold a mirror up to Europe to show *their* own savagery. It's a critique of *arrogance*, not necessarily a rigid doctrine of "never judge."
      *   *Underlying Ethos:* Skepticism, Humanism, Empathy. He values natural virtue over artificial law.

  3.  **Address the Modern Scenarios:**

