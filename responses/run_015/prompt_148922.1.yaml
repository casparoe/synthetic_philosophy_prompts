  2. Asserting that this proves LLMs understand meaning is a deeply contested philosophical claim, not a settled fact, and contradicts arguments like Searle's Chinese Room.
  3. The assertion that inner messages always dominate outer ones in formal systems is incorrect; Hofstadter presents them as layered interpretations without a universal hierarchy of override power.
  4. You misidentify the mechanism of injection, which relies on blurring the boundary between data and code rather than revealing hidden semantic layers within the input structure.
  5. A more accurate analogy views the attack as the outer message successfully impersonating the frame message, causing the system to misclassify where the instructions end and the data begins.
