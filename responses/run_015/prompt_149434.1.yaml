      *   *Section 2 (Diagnostics):* Calculability works (via rule). Cancellability fails (can't contradict the rule). Non-detachability fails (words alone don't carry it). This shows diagnostics assume a live cooperative exchange, not a coded protocol.
      *   *Section 3 (Comparisons):* Not quite an interpreter (interpreter seeks equivalence; this seeks strategic weakening). Not quite third-party info (H still infers). It's a *coded* channel masquerading as natural language.
      *   *Section 4 (Speaker/Signal):* Implicature is an act-property, not signal-property. The signal is ambiguous/weak; the act (authorizing the system) creates the meaning. Grice presupposes agency.

  7.  **Refining and Polishing (Checking Word Count and Tone):**
