          *   One "Predictor" with hidden info.
          *   Rest choose whether to pay tokens or not.
          *   Payoff scheme using fake points.
          *   Must highlight *why* counterfactual reasoning is tricky (what would have happened in other worlds).
          *   Include a debrief mapping choices to XOR Blackmail logic (non-formal).
          *   **Crucial:** Predict what will go wrong the first time.
          *   **Crucial:** Be honest about limitations (what the game *can't* reproduce).
          *   **Constraint:** No bibliography/citations.
          *   **Tone:** Casual, helpful, acknowledging potential typos.

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Newcomb's Problem:* One box vs. two boxes. Predictor predicts your choice.
      *   *Counterfactual Mugging:* Omega asks for \$100. If a coin landed Tails, Omega asks. If Heads, Omega gives \$10,000 *if* you would have paid had it been Tails. You see Tails. Do you pay? (EDT/CDT says no, FDT/UDT says yes).
      *   *XOR Blackmail:* A predictor sends a letter demanding money *only if* they predict you *won't* pay, or something similar involving a correlation between the threat being sent and your response. Actually, XOR Blackmail is usually: "I demand money. I sent this letter because I predicted you *would* pay. If I predicted you wouldn't pay, I wouldn't have sent the letter." (Wait, let me double-check the specific XOR Blackmail structure).
      *   *Correction on XOR Blackmail:* The standard "XOR Blackmail" (from MIRI/LessWrong contexts) usually goes like this: There is a disaster (e.g., termites). A predictor knows if you have termites. They send a letter demanding money. They send the letter *if and only if* (Termites AND You Pay) OR (No Termites AND You Don't Pay). Basically, the letter is correlated with your action in a way that makes paying seem useful but actually isn't, or vice versa depending on the decision theory.
      *   *Simplification for 11th Graders:* The core intuition needed is: "Your decision *now* determines what the Predictor *would have done* in the past, because your decision is logically linked to their prediction."
      *   *Best Fit:* Counterfactual Mugging is easier to gamify than XOR Blackmail because it involves a coin flip (randomness) which is easier to simulate than "Termites vs. No Termites." However, the prompt specifically mentions XOR Blackmail. Let's try to blend them or focus on the *Counterfactual* aspect which is the common thread. The prompt asks to make them feel "why counterfactual reasoning is tricky."
      *   *Decision:* Let's build a game based on **Counterfactual Mugging** because it's more visceral for a game (Coin flip = visible randomness). I will explain in the debrief how this connects to XOR Blackmail (the logic of "What if the situation were different?"). Actually, I can tweak it to be closer to XOR Blackmail: "The Predictor only approaches you if they think you'll pay." No, that's standard blackmail.
      *   *Re-evaluating XOR Blackmail:* In XOR Blackmail, the predictor sends the demand *if* (Payout Condition XOR Your Action). It's about the correlation between the *arrival* of the problem and your *solution*.
      *   *Let's stick to the Counterfactual Mugging structure* but frame it as "The Oracle's Game." It's the most pedagogical for "counterfactuals." I will explicitly mention in the debrief how this relates to the XOR Blackmail logic they asked about (pre-commitment/logical correlation).

  3.  **Drafting the Game Mechanics:**
      *   **Roles:** 1 Oracle (Predictor), 7 Players.
      *   **Setup:** Oracle flips a coin (hidden).
      *   **Scenario:**
          *   Heads: Oracle gives 100 points automatically.
          *   Tails: Oracle asks for 10 points.
      *   **The Catch (The Counterfactual):** The Oracle *only* plays the game if they predict the player *would* pay on Tails.
      *   *Wait, that's Newcomb.*
      *   *Let's try the Counterfactual Mugging exact structure:*
          1.  Oracle flips a coin.
          2.  If Heads: Oracle gives Player 100 points (Game Over).
          3.  If Tails: Oracle asks Player for 10 points.
          4.  **Crucial Rule:** The Oracle *simulates* the player before flipping. If the simulation says "I won't pay on Tails," the Oracle *doesn't play the game at all* (or gives 0 in both cases).
          5.  *Problem:* If the Oracle doesn't play, the students don't get to make a choice.
      *   *Adjustment for Classroom:* We need them to actually make a choice.
      *   *Revised Game:* "The Time-Traveling Banker."
      *   **Round 1:** All players write down a policy: "If asked for Tails, I [Pay/Refuse]."
      *   **Round 2:** Oracle flips coin.
          *   Heads: Everyone gets 100 points *if* their policy was Pay.
          *   Tails: Everyone loses 10 points *unless* they Pay.
      *   *Critique:* This removes the "surprise" element.
      *   *Better Approach:* Run multiple rounds. Some rounds are "Heads World," some are "Tails World." But the payoff depends on what they *would* have done in the other world.
      *   *Let's go with the "Pre-Commitment Contract" Game.*
      *   **Step 1:** Players sign a contract *before* the coin flip. "I agree to pay 10 if Tails."
      *   **Step 2:** Coin flip.
      *   **Step 3:** If Heads, those who signed get 100. If Tails, those who signed pay 10 (net -10), those who didn't pay 0.
      *   **Step 4:** *The Twist:* Tell them *after* the flip that the "Heads Reward" was only available because they signed.
      *   *Wait, this is too abstract.*

      *   *Let's try the "Two-Room" Simulation (Best for intuition):*
      *   Split class into Group A and Group B.
      *   Group A is "The Predictors" (or just the mechanism). Group B is "The Agents."
      *   Actually, with 8 kids, 1 Oracle + 7 Agents is perfect.
      *   **The Game:** "The Ghost Coin."
      *   **Oracle:** Flips a coin. Hides it.
      *   **Rule:** "I have a machine. If the coin is Heads, I put 100 points in your account. If Tails, I ask you for 10 points."
      *   **The Kicker:** "But, I only turned the machine on for you because I predicted that *if* it were Tails, you *would* give me the 10 points."
      *   **The Choice:** The Oracle reveals Tails. "Give me 10 points."
      *   **The Dilemma:** The Heads money is already gone (it didn't happen). Why pay? But if you wouldn't have paid, you wouldn't be in this game to begin with (or you would have gotten 0 on Heads).
      *   **Simulation Fix:** To make it playable, we need to run it *multiple times* or have them write policies *before* knowing the outcome.
      *   **Plan:**
          1.  **Phase 1 (Policy):** Everyone writes "PAY" or "REFUSE" on a slip. This is what they *would* do.
          2.  **Phase 2 (Reality):** Oracle flips coin.
          3.  **Phase 3 (Payoff):**
              *   If Heads: Anyone who wrote PAY gets 100. Anyone who wrote REFUSE gets 0.
              *   If Tails: Anyone who wrote PAY pays 10 (score -10). Anyone who wrote REFUSE pays 0 (score 0).
          4.  **Phase 4 (The Reveal):** Show them that the *only reason* they had a chance at the 100 points was because they committed to paying in the Tails scenario.
      *   *Wait, this is just standard Counterfactual Mugging.* It works.
      *   *Adding the XOR Blackmail flavor:* In XOR Blackmail, the threat is sent *because* you would pay. Let's modify the payoff.
      *   **Modified Game:** "The Blackmail Letter."
      *   Oracle decides whether to send a "Bill" (Tails) or a "Grant" (Heads).
      *   Oracle sends the Bill *only if* they predict you will Pay.
      *   Oracle sends the Grant *only if* they predict you will Refuse.
      *   *This is getting too complex for 1 hour.*
      *   *Stick to Counterfactual Mugging as the core mechanic,* but explain in the debrief that XOR Blackmail uses the same "logical correlation" logic. The prompt asks to make them feel *why counterfactual reasoning is tricky*. Counterfactual Mugging is the purest way to do this.

      *   *Refining the Game for "Feeling" the Counterfactual:*
      *   We need them to feel regret.
      *   **Round 1:** Play normally. (Most will Refuse on Tails).
      *   **Round 2:** Tell them the rule about the Heads reward depending on the Tails policy.
      *   **Round 3:** Play again.
      *   This shows the shift in reasoning.

  4.  **Addressing Specific Constraints:**
      *   **What will go wrong:** Students will treat the coin flip as independent of their choice *in the moment*. They will say "The coin is already Tails, why pay?" They will get angry about the "unfair" rule.
      *   **Limitations:** A human Oracle can't actually predict the future. The game relies on *trust* that the Oracle is following the rule. Real decision theory assumes a perfect predictor (Omega). The game is an analogy, not a proof.
      *   **Debrief:** Connect "Policy" to "Logical Output." Connect "Oracle's Prediction" to "Counterfactual World."
      *   **Tone:** Keep it fun, not lecture-heavy.

  5.  **Drafting the Content:**
      *   **Title:** "The Ghost Coin Challenge."
      *   **Materials:** Coins, paper slips, tokens/points board.
      *   **Setup:** 1 Oracle (Teacher or Student), 7 Agents.
      *   **Rules:** Clear step-by-step.
      *   **The Twist:** The payoff matrix depends on the *pre-commitment*, not just the *action*.
      *   **Debrief:** Walk through the "Heads World" that never happened.
      *   **Honesty Section:** Explicitly state the "Human Predictor Problem."

  6.  **Review against XOR Blackmail:**
      *   The prompt specifically mentioned XOR Blackmail. I should ensure the debrief explicitly links the game to that.
      *   *XOR Blackmail Logic:* "I am asking you for money *because* I know you are the type of person who pays. If you were the type who doesn't pay, I wouldn't be asking."
      *   *Game Logic:* "You are eligible for the Heads reward *because* you are the type of person who pays on Tails."
      *   *Connection:* Both rely on your decision *now* defining your "type" across possible worlds. I will make sure this link is clear in the debrief.

  7.  **Final Polish:**
      *   Check tone (friendly, 11th grade appropriate).
      *   Check constraints (no citations, admit flaws).
      *   Check length (fit for 1 hour).
      *   *Self-Correction on "What goes wrong":* Kids might collude. Kids might not take points seriously. Kids might think the Oracle is lying. I need to address the "Oracle Trust" issue. Suggest the Teacher be the Oracle first.

  8.  **Final Plan Structure:**
      *   Intro (Hook).
      *   Game Setup (Roles, Materials).
      *   The Rules (The "Contract").
