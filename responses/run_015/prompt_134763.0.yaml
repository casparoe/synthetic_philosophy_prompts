prompt: |-
  hey im in 11th grade and run a philosophy club at my school, usually about 8 kids for an hour on fridays. we were talking about newcomb's problem and someone brought up counterfactual mugging and xor blackmail but nobody really got it. can u design an in-class game or simulation that makes us feel why the counterfactual reasoning is tricky? i want rules where one person is like a predictor with hidden info, and the rest have to choose whether to pay tokens or not, with a payoff scheme using fake points. the setup should make it matter what they think would have happened in other worlds. include a debrief that maps our choices back to the xor blackmail logic without super formal notation since were not all mathy. definetly tell me what will go wrong the first time, and be honest about which part of the idea the game just cant reproduce. plz no bibliography or citation lists, we dont have library access for that. btw i might typo lol
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
