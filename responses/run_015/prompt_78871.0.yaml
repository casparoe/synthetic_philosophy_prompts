      *   *Disjunctivist Move:* Illusions are often treated as veridical perceptions of *different* properties (e.g., light refraction) or misperceptions where the relation still holds but is complex. Hallucinations are total failures of relation.
      *   *The Interviewer's Hunch:* Illusions are the weak spot because the object *is* present, making the "different kind of state" claim harder to swallow than in total hallucinations.

