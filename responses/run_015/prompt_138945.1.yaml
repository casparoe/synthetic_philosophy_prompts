answer: |-
  **THE WOLDSHIRE NATURAL HISTORY SOCIETY**
  **QUARTERLY BULLETIN — No. CXIV**
  *Michaelmas, 1954*

  **FROM THE HONORARY SECRETARY**

  Members are reminded that the primary objective of this Society remains the establishment of the Generalisation: *All Ravens are Black.* At the Annual General Meeting, it was resolved that while the direct observation of ravens possesses a certain romantic appeal, the scarcity of the subject renders the method inefficient. A single day in the hide yields, at best, three instances of confirmation.

  Consequently, the Committee has unanimously adopted the Equivalent Formulation: *All Non-Black Things are Non-Ravens.* As the class of Non-Black Things is abundant within any drawing room, fieldwork is hereby suspended. The key to the observation hide has been returned to Lord Broughton's estate office. Members expressed some regret regarding the loss of afternoon excursions; Mrs. Gable noted specifically that the walks were pleasant and the thermos flask convenient. However, logistical comfort must not supersede evidentiary volume. We shall now catalogue Non-Black Non-Ravens locally. A white shirt, a blue tile, or a green apple each constitutes a unit of confirmation.

  **CORRESPONDENCE**

  *Mr. A. Culpepper writes:* "If I understand the new directive, my collection of coloured porcelain confirms the Generalisation. Does a single yellow teacup prove that no white raven exists?"

  *The Secretary replies:* "Mr. Culpepper commits a common error by conflating confirmation with proof. A yellow teacup is indeed a Non-Black Non-Raven, and its existence does raise the probability of the Generalisation. However, the weight of this increment depends upon the rarity of ravens among the class of Non-Black Things. As ravens are exceedingly rare among teacups, the probability shift is negligible. It does not *prove* the rule; it merely nudges it. Nevertheless, as there are many teacups, the aggregate effect is deemed sufficient. We must not let the negligible nature of the individual unit discourage the accumulation of the whole."

  *Regarding the Schism:* It is with satisfaction that we announce the amalgamation of the breakaway 'League of the Equivalent Formulation.' The League had separated last spring under the impression that the Formulation was a rival hypothesis. Upon realising it was merely the same hypothesis stated differently, further independence became untenable. Their records of beige wallpaper samples are now incorporated into our archives.

  **NOTICES**

  **Next Meeting:** The home of Dr. Aris. Members are invited to bring small domestic objects for inspection. Please ensure items are strictly Non-Black. A grey sock was rejected at the last gathering due to ambiguity regarding the lighting conditions.

  **Subscriptions:** Due to the cessation of travel expenses, subscriptions are reduced. However, a levy is introduced for storage of accumulated evidence (currently consisting of 400 bus tickets and a member's own boot).

  **CLOSING ITEM: FIELD LOG (DOMESTIC DIVISION)**

  *Observer:* Rev. J. Shaw.
  *Object:* One (1) Leather Boot.
  *Colour:* Brown.
  *Classification:* Non-Black Non-Raven.
  *Notes:* The object was observed on the hall stand. It was not a raven. It was not black. The Generalisation is thereby supported to a minute degree. The partner boot was black and therefore offered no confirmation, though it matched perfectly.
