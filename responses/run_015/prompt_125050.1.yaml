answer: |-
  Elias sits in the transplant coordinator's office, pen hovering. He wants to donate; fear, reluctance, and pressure are absent. When asked if he is ready, he runs the transparency check: "Shall I sign?" The moral reasons are decisive. He answers, "Yes, I intend to sign." But simultaneously, he notices a specific phenomenological absence: the distinct sense of agential closure he feels when he actually settles on a course of action. His mind feels open, suspended, lacking the motor-ready tension of a formed intention. He reports intention based on the settled question, but his introspective landscape shows only weighing. The transparency procedure confirms commitment; the inward glance reveals endorsement without launch. He claims intention, but the introspective data says he is still deliberating.

  1.  **The Procedure:** The subject asks the world-directed question ("Shall I sign?"). Because the normative reasons are decisive, Transparency dictates he avow intention. Detectivism ignores the reasons and scans for the phenomenological signature of *volition*—the feeling of a decision having been made.
  2.  **Introspectable Items:** The detectivist points to the *absence* of "agential closure" and the presence of "suspension." These are qualitative feels available in the moment, distinct from the content of the thought. They indicate the machinery of intention hasn't engaged, even if the judgment has.
  3.  **Key Feature:** The gap between *normative endorsement* and *agential settlement*. If Elias felt the "click" of closure, Transparency and Detectivism would align. Remove that gap (make the judgment feel like a decision), and Transparency gets it right because the state becomes a genuine intention.
  4.  **Pushback:** A transparency theorist will argue I've cheated by defining intention via feeling. They'll say intention *is* the commitment expressed in the avowal; the "motor-ready tension" is merely contingent confidence. This is a dodge: if intention is a state that explains action, the phenomenological readiness is a better tracker of the functional state than abstract endorsement. Without the "launch" feel, the avowal is just a prediction, not an intention.
