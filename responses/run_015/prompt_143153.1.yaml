  hey im a retired field ecologist who just started reading philosophy and im stuck. there's this simulation argument — if advanced civilizations run tons of ancestor simulations, we're probably in one — and it seems like it should dampen all that longtermist fanaticism about protecting the far future of this specific timeline. but then i looked at how some existential-risk nonprofits score future outcomes, and they treat digital minds as full moral patients (substrate independence) yet they silently assign zero weight to any being running inside a nested simulation. so they act like the far future matters immensely, but only the 'base reality' version. what view of consciousness or moral standing does that practice presuppose? does it need consciousness to be anchored to a root causal chain? can it be reconciled with substrate independence, or is it secretly relying on physicalist essentialism? and is it consistent with the same groups worrying about suffering inside simulations? i keep going in circles and cant tell if this is a hidden contradiction or if im just missing something obvious.
