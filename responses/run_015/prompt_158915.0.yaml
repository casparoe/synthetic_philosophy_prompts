  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**

  **Preface: Specification of Positivist Stance**
  For the purposes of this document, the positivist party is designated as an **inclusive positivist**. This choice is material because it allows her to concede that a Rule of Recognition *could* incorporate moral criteria without collapsing into natural law, provided those criteria are grounded in social fact. This clarifies the residual disagreement: the dispute is not whether morality *can* be included in legal validity, but whether the *internal morality of law* is a necessary condition of legal existence (the Fullerian view) or merely a condition of efficacy and prudential success (the Hartian view).

  **I. Agreed Claims**
  1.  A legal system exists only where officials accept secondary rules governing the creation, change, and adjudication of primary obligations.
  2.  The ultimate criteria of validity (the Rule of Recognition) are evidenced by the convergent practice of officials, not by metaphysical truth.
  3.  In the post-war informer cases, the norms under which informers acted satisfied the formal criteria of enactment then in force.
  4.  In those cases, courts were compelled to choose between adhering to statutory validity and achieving substantive justice, often via retroactive punishment.
  5.  Describing the prior statute as 'law' or 'not law' does not itself resolve the moral dilemma facing the court; both descriptions require a further moral justification for the chosen remedy.
  6.  Any durable legal system must contain rules protecting persons, property, and promises.
  7.  This necessity stems from contingent facts about human vulnerability, approximate equality, limited resources, and limited altruism.
  8.  A regime that systematically violates the canons of legality (generality, publicity, non-retroactivity, congruence) fails to govern effectively through law.

  **II. Table of Disagreements**

  | Crux | Positivist Claim | Fullerian Claim | Agreed Test Case | Positivist Prediction | Fullerian Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Nature of Canons** | The canons are principles of efficacy; violating them makes law inefficient, not immoral. | The canons constitute an internal morality; violating them breaches a moral duty to subjects. | A regime enacts secret, retroactive rules that are strictly enforced. | Subjects will fail to guide conduct; regime will be unstable. | Subjects are subjected to arbitrary power; moral bond of fidelity is broken. |
  | **2. RoR and Morality** | Moral criteria can be in the Rule of Recognition only if social practice adopts them. | The internal morality of law is necessarily part of the criteria for legal existence. | A constitution requires statutes to be 'just' to be valid; officials ignore this. | The law is whatever officials enforce; the moral clause is idle wind. | The system ceases to be a legal order; it is a sham pretending to be law. |
  | **3. 'Really Law'** | The question is descriptive; it separates legal validity from moral merit. | The question is evaluative; it assesses whether the enterprise of law has succeeded. | A statute commands genocide; courts enforce it. | It is valid law, though morally monstrous; obedience is not required. | It is not law; it is a perversion of the legal form; no fidelity is owed. |
  | **4. Fidelity** | Fidelity is prudential or based on fair play, not a content-independent moral obligation. | Fidelity to law is a genuine moral ideal arising from the reciprocity of governance. | Officials enforce a valid but unjust tax law. | Citizens obey out of fear or habit, not moral duty to the law itself. | Citizens obey out of respect for the procedural integrity of the system. |
  | **5. Opacity** | Law can exist where reasoning is opaque, provided officials accept the output. | Law requires intelligibility; opaque reasoning fails the canon of congruence and publicity. | Courts use an unpublished algorithm to determine rights (see Section III). | It is law if officials treat it as authoritative. | It is not law because subjects cannot understand the rules governing them. |

  *Note on Verbal Dispute:* The parties agree that part of the disagreement over whether an iniquitous statute is 'really law' is verbal. However, they disagree on whether the verbal choice carries practical consequences. The Positivist argues that calling it 'law' clarifies the moral choice to disobey; the Fullerian argues that calling it 'not law' clarifies the lack of moral authority.

  **III. Test Case: The Commonwealth of Vireo**
  Vireo possesses a legislature and statutes that are public and prospective. However, actual determinations of rights are made by 'the Assize', a predictive system estimating appellate decisions. Judges may override the Assize without reason. The training data is unpublished.

  **Variant A: The Assize tracks statutes closely and is applied even-handedly.**
  *   **Is Vireo a legal system?** The Positivist answers yes, provided officials accept the Assize as authoritative. The Fullerian answers no, because the reasoning is unintelligible to subjects.
  *   **Is the Assize's output law?** The Positivist says yes, by a Rule of Recognition accepting official efficacy. The Fullerian says no, as it fails the canon of publicity.
  *   **Does Vireo satisfy Fuller's canons?** Both agree it fails publicity and intelligibility. The Positivist denies this matters for legal validity; the Fullerian holds it is fatal to legal character.
  *   **Dependence on Table:** This relies on Crux 5 (Opacity).
  *   **Coincidence:** Both agree the system is defective. The Positivist calls it 'bad law'; the Fullerian calls it 'not law'. This shows the practical divergence is minimal, though the conceptual description differs.

  **Variant B: The Assize is systematically harsher for a disfavoured minority; officials know and do not care.**
  *   **Is Vireo a legal system?** The Positivist answers yes, as a functioning system of coercion. The Fullerian answers no, as it violates congruence and the internal morality.
  *   **Is the Assize's output law?** The Positivist says yes. The Fullerian says no.
  *   **Does Vireo satisfy Fuller's canons?** Both agree it fails congruence (between declared rule and action) and generality.
  *   **Dependence on Table:** This relies on Crux 1 (Nature of Canons) and Crux 3 ('Really Law').
  *   **Coincidence:** There is no coincidence on validity. Both agree the regime is iniquitous. The Positivist maintains the label 'law' to preserve the clarity of moral criticism; the Fullerian withdraws the label to deny the claim to authority.

  **IV. Closing Note on Moving the Debate**
  The parties agree that no empirical finding alone will resolve the conceptual dispute. Both sides agree in advance that a regime satisfying all Fullerian canons could still be morally iniquitous (e.g., a perfectly procedural slave code). The Positivist holds this confirms the separation of law and morality; the Fullerian holds this shows the internal morality is necessary but not sufficient for justice.

  Consequently, there is no case or argument on which both sides agree that a given result would shift their position. The disagreement is not about the facts of Vireo or the history of post-war courts, but about the best vocabulary to describe the relationship between authority and morality. The honest conclusion of this collaboration is that the dispute is robustly philosophical: it concerns whether 'law' is a descriptive sociological category or an evaluative term denoting a successful purposive enterprise. Both sides retain their positions, but the exact locus of disagreement is now mapped with precision.
