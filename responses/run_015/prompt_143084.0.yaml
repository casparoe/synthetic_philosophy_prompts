answer: |-
  Here's a map of the critique landscape, structured as a decision tree. It's designed to help you place a specific argument without needing to know the author's tribe first. We're aiming for ten distinct endpoints (leaves), separating the settled ground from the actual fights.

  **Root Question:** Is Effective Altruism's main failure **Allocative** (it sends money to the wrong places) or **Institutional** (the problem is how the movement structures moral reasoning and career choice)?

  ---

  ### Branch 1: The Allocative Critique
  *Focus: What gets funded and how we measure it.*

  **Split 1:** Is the measurability bias just a **practical error** (we count QALYs but miss dignity, justice, relationships) or is it **constitutive** (the very act of optimizing on metrics reshapes what we think moral good even is)?

  *   **If Practical Error:**
      *   **Split 2:** Can we fix this with better metrics, or are some values inherently unquantifiable?
          *   **Leaf 1: The Metric Reformer.** (Position: Internal EA critique).
              *   *Awkward Commitment:* We just need better math to measure dignity without losing rigor.
          *   **Leaf 2: The Value Pluralist.** (Position: Standard philosophical objection).
              *   *Awkward Commitment:* We must sometimes choose blindly without knowing impact to respect incommensurable values.

  *   **If Constitutive:**
      *   **Split 3:** Does this optimization corrupt the **moral agent** (the person deciding) or the **moral concept** (the definition of good)?
          *   **Leaf 3: The Integrity Critic.** (Position: Bernard Williams-adjacent).
              *   *Awkward Commitment:* Good outcomes might require bad people, but we shouldn't become them.
          *   **Leaf 4: The Ontological Critic.** (Position: Sociological critique).
              *   *Awkward Commitment:* Morality itself is being rewritten by spreadsheets, not just misapplied.

  ---

  ### Branch 2: The Institutional Critique
  *Focus: How the movement organizes power, money, and legitimacy.*

  **Split 4:** Take the "earning to give" debate. Is the problem individual **hypocrisy** (you're profiting from harm then washing it with donations) or structural **moral laundering** (the donation pipeline actually legitimizes the harmful industry)?

  *   **If Individual Hypocrisy:**
      *   **Leaf 5: The Complicity Critic.** (Position: Deontological ethics).
          *   *Awkward Commitment:* Pure hands matter more than net good produced.
  *   **If Structural Laundering:**
      *   **Leaf 6: The Legitimacy Critic.** (Position: Political economy critique).
          *   *Awkward Commitment:* Philanthropy is just reputation management for harm, regardless of intent.

  **Split 5:** Then there's the critique about democratic accountability and venture-philanthropy capture. Does EA's flaw bypass **democratic decision-making** about global priorities, or does it import **Silicon Valley-style logic** into moral philosophy?

  *   **If Democratic Decision-Making:**
      *   **Split 6:** Is the violation **procedural** (who gets to decide) or **substantive** (what priorities are chosen)?
          *   **Leaf 7: The Procedural Democrat.** (Position: Rob Reich style).
              *   *Awkward Commitment:* Local majorities should override global evidence on saving lives.
          *   **Leaf 8: The Substantive Democrat.** (Position: Development ethics).
              *   *Awkward Commitment:* Communities must define their own needs even if they choose inefficiently.

  *   **If Silicon Valley Logic:**
      *   **Split 7:** Is the import about **methodology** (move fast and break things) or **timeframe** (longtermism ignores the present)?
          *   **Leaf 9: The Disruption Critic.** (Position: Tech ethics).
              *   *Awkward Commitment:* Moral progress shouldn't follow startup growth hacks.
          *   **Leaf 10: The Longtermist Escape Critic.** (Position: Climate/Justice critique).
              *   *Awkward Commitment:* Future people count more than current suffering, which is hard to swallow.

  ---

  ### What's Settled vs. What's Contested

  Don't let anyone tell you the literature is unanimous on much. Here is the actual lay of the land:

  **Settled:** Almost everyone, including EAs, agrees that metrics are imperfect. There is no serious defender of EA who claims QALYs capture "the whole of value." It is also settled that EA has significant influence over global priority-setting, particularly in global health and AI safety.

  **Contested:** The fight is over whether those imperfections invalidate the project. The *Metric Reformers* think errors are fixable bugs; the *Value Pluralists* think they are fatal features. Similarly, while everyone admits "earning to give" involves trade-offs, the *Complicity Critic* sees a moral stain where the *Legitimacy Critic* sees a systemic feature of capitalism. There is no consensus on whether democratic bypassing is ever justified by superior outcomes.

  ### Indistinguishable Pairs

  Be careful where you draw the lines. This tree forces separations that sometimes blur in the wild:

  1.  **Leaf 3 (Integrity) vs. Leaf 4 (Ontological):** In practice, critics often argue that changing the concept of good *requires* corrupting the agent. It's hard to separate the tool from the hand wielding it.
  2.  **Leaf 7 (Procedural) vs. Leaf 8 (Substantive):** Democratic critics often merge these. If you bypass procedure, you usually impose substantive priorities anyway. Distinguishing them is analytically useful but empirically messy.
  3.  **Leaf 9 (Disruption) vs. Leaf 10 (Longtermist Escape):** Both rely on a distrust of present-focused institutions. A critic might hold both views simultaneously without feeling a tension, making the split somewhat artificial.

  One final note: don't assume these positions are mutually exclusive. A single critic might hold the *Value Pluralist* view on allocation and the *Legitimacy Critic* view on institutions. The tree maps arguments, not people. Also, sorry for the typo in the header earler, I was typing fast.
