answer: |-
  This is a classic and formidable interpretive crux in Hume scholarship. You are definitely not alone in hitting this wall; the tension between the *conventional* origin of artificial virtues and their *moral* normativity is arguably the hardest problem in Hume's meta-ethics. If Hume reduces fidelity to mere prudence, he collapses morality into self-interest, which he explicitly denies.

  Since you are at the PhD level, I will skip the introductory summaries and go straight to the structural distinctions in the *Treatise* (Book 3, Part 2) and the *Enquiry* that resolve the "prudential collapse" objection. The key lies in distinguishing between the **motive for the invention** of the convention, the **motive for compliance**, and the **source of moral approbation**.

  Here is a walkthrough of where the prudential objection misses Hume's mechanism.

  ### 1. "Artificial" Does Not Mean "Arbitrary" or "Fake"
  Your intuition that "artificial" implies "invented" is correct, but the inference that it implies "lacking genuine obligation" is where the slip occurs. For Hume, "natural" virtues (like benevolence or gratitude) arise from instincts we have without reflection. "Artificial" virtues (like justice, fidelity, allegiance) are remedies for natural deficiencies.

  Think of language. Language is an artificial convention; there is no "natural" word for "tree." But once the convention is established, the obligation to use words correctly to communicate is not merely prudential. If I misuse words, I frustrate the purpose of the convention. Similarly, promising is a linguistic/performative act invented to bind the future. The "artificiality" refers to the *origin of the practice*, not the *ontological status of the obligation* once the practice exists.

  ### 2. Utility vs. Prudence: The General Point of View
  This is the most critical distinction for your problem. You are worried that grounding virtue in utility makes it prudential (i.e., "I keep promises because it benefits *me*").

  Hume explicitly anticipates this. In *Treatise* 3.2.5 ("Why we are pleased with the useful"), he distinguishes between:
  *   **Private Interest (Prudence):** Keeping a promise to avoid personal penalty or gain a specific reward.
  *   **Public Utility (Morality):** Approving of promise-keeping because the *system* of promises is necessary for the stability of society.

  Hume argues that if promise-keeping were based solely on self-interest, it would cease to be a virtue and become a matter of wisdom or cunning. We do not call a man "virtuous" for locking his door at night; we call him "prudent." We call a man "virtuous" for keeping a promise even when it is inconvenient, because we sympathize with the **public good** that the practice sustains.

  The moral sentiment arises via **sympathy** (or "humanity" in the *Enquiry*). When I contemplate an act of fidelity, I do not primarily calculate my own gain. I view the act from the "general point of view." I recognize that the *scheme* of promises is essential for social cooperation. I feel a pleasurable sentiment of approbation because I sympathize with the benefit that society receives from this stability. That sentiment of approbation *is* the moral obligation.

  ### 3. The "State of the Question" and the Separation of Sanctions
  Your classmate is right that Hume insists these are moral virtues, but you need the mechanism to back it up. Hume addresses your exact worry in *Treatise* 3.2.5, often called the "State of the Question."

  He asks: Is the obligation to keep promises based on self-interest?
  His answer: No. If it were, then:
  1.  We wouldn't blame someone for breaking a promise if they could do so secretly without reputational damage. But we do blame them.
  2.  We wouldn't feel a *moral* sentiment (resentment/indignation); we would just feel annoyance at a miscalculation.

  Hume distinguishes between the **sanction** (reputational damage, legal penalty) and the **obligation** (the internal sentiment of duty).
  *   **Prudential Rule:** "I shouldn't break this promise because I'll get caught."
  *   **Moral Obligation:** "I shouldn't break this promise because it is base/honorable, regardless of whether I get caught."

  Hume argues that the moral sentiment develops *after* the convention is established. Initially, people might keep promises out of self-interest (to get the reciprocal benefit). But over time, through education and socialization, we develop a **sentiment of morality** attached to the act itself. We feel pain at the thought of breaking a promise even when prudence suggests we could get away with it. That psychological fact proves it is not merely prudential.

  ### 4. The Holistic Nature of the Convention
  One reason the obligation feels "binding" rather than "strategic" is that Hume views the convention of promising holistically.

  When you make a promise, you are not just entering a private contract; you are invoking a public institution. If you break a promise, you aren't just hurting the promisee; you are weakening the *institution* of promising.
  *   **Prudential view:** "Does breaking *this* promise hurt me?"
  *   **Humean Moral view:** "Does breaking *this* promise undermine the trust necessary for the system that benefits everyone (including me, indirectly)?"

  Because the utility lies in the *whole scheme*, the obligation attaches to the *type of action* (fidelity) rather than the *consequence of the specific act*. This is why Hume is often read as a precursor to rule-utilitarianism, though he grounds it in sentiment rather than rational maximization. The "binding force" is the recognition that the convention collapses if we treat it as optional based on immediate utility.

  ### 5. Why It Feels Like a "Genuine" Moral Requirement
  You asked: *"Why does anyone treat promise-keeping as a genuine moral requirement rather than a strategic rule?"*

  For Hume, the distinction between "moral requirement" and "strategic rule" is found in the **psychology of the agent**, not in the metaphysics of the duty.
  *   If you keep a promise because you fear reputational damage, you are acting prudentially.
  *   If you keep a promise because you feel a sentiment of disapproval at the thought of breaking it (arising from sympathy with the public good), you are acting morally.

  Hume's claim is that human beings, through social living, *actually develop* the latter sentiment. We are trained (via "artificial" education) to feel a visceral revulsion at perfidy. This sentiment becomes so strong that it mimics natural instincts. As he puts it, time and custom "naturalize" the artificial. The obligation feels genuine because the sentiment is real, even if the practice is invented.

  ### Summary of the Counter-Argument
  To summarize the response to your sticking point:
  1.  **Origin ≠ Justification:** The fact that promising is a human invention (artificial) does not mean the obligation is fake. Money is artificial, but debt is real.
  2.  **Sympathy bridges the gap:** Utility becomes moral only when viewed through sympathy from the general point of view. Prudence is self-referential; morality is other-referential (via sympathy with society).
  3.  **Psychological Reality:** We empirically observe that people feel moral indignation at promise-breaking even when no reputational damage occurs. Hume takes this phenomenology seriously: if it feels like a moral sentiment and functions like one in our social psychology, it *is* one.

  ### Suggested Secondary Literature
  Since you are working at the PhD level, you might find it helpful to look at how specific interpreters handle this "normativity gap":
  *   **Annette Baier (*A Progress of Sentiments*):** She is excellent on how the "artificial" virtues are naturalized over time through sentiment.
  *   **Stephen Darwall:** He argues that Hume's account of fidelity implies a second-person standpoint that anticipates Kantian obligation, moving beyond mere utility.
  *   **John Rawls (*Lectures on the History of Moral Philosophy*):** His lectures on Hume tackle the "artificial virtue" problem directly, specifically regarding the stability of the convention.
  *   **David Gauthier (*The Social Contract as Mutual Best Response*):** While more game-theoretic, he engages deeply with the Humean idea of convention as a solution to coordination problems that generate obligation.

  Your classmate is right: Hume insists they are moral virtues. You are right to worry that utility sounds prudential. The resolution is that for Hume, **morality is a sentiment caused by the contemplation of utility,** not a calculation of utility. The "binding force" is the strength of that sentiment, cultivated by society to sustain the convention.
