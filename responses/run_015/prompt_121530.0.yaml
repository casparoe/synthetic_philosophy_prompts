  **Most Work:** Continuous Allocation does the most work by excluding Bounded Utility functions while permitting Probability Discounting models. Bounded views often create sharp cliffs at the utility limit, violating the requirement for smooth degradation under input perturbation.

  **Renegotiation:** A defender of Bounded Utility argues that smooth degradation is a mathematical fetish that ignores the qualitative difference between finite and infinite stakes. They contend that once value hits a cognitive or physical ceiling, further precision is meaningless noise.

