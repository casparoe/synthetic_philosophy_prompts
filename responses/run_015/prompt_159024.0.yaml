      *   Need to separate *Efficacy* (does it work on a ticket?) from *Impact* (what happens to the team?).
      *   Need to define Utility, not just Merge Rate. $U = \sum (\text{Value of Merged PRs}) - \sum (\text{Cost of Failures}) - \text{Cost of Time}$.
      *   The "Fact of the Matter": There is a causal effect of Assistant on Merge Probability *conditional on Ticket Properties*. That is a stable property of the tool+human system. But the *Value* of the tool depends on the distribution of tickets and the cost function.
      *   Relation: Total Impact = $\sum_{tickets} P(\text{Merge} | \text{Tool}, \text{Ticket}) \times \text{Value}(\text{Ticket})$. The mix changes if the tool changes which tickets are attempted.

