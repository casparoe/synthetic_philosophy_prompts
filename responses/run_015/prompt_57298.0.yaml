      *   Must avoid "on the one hand, on the other hand." Take the requested stand.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I define Dennett's actual view accurately? Dennett uses *Sphex* to argue against *Cartesian Materialism* and to discuss free will as an avoidance of sphexishness. He acknowledges humans can be sphexish. He doesn't necessarily think *all* complex behavior is sphexish, but that we must *earn* the right to say it isn't.
