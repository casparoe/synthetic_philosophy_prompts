  ok so heres my philosophical profile on mental causation - im writing this up for a reading group and im the only backend engineer there so dont roast me too hard. i want a consistency audit, rank tensions by severity, say what the cheapest fix is, and tell me if theres an apparent clash that goes away on closer look. also i definetly have a typo or two in here.

  (1) mental states actually cause things - like my deciding to push code causes my fingers to type, its not just neurons with mental labels stuck on.
  (2) physics is causally closed - perfect physics predicts every movement.
  (3) mental properties arent reducible - "wanting to deploy" isnt the same thing as some c-fiber pattern, different kind entirely.
  (4) the causal exclusion argument is basically correct - if the physical base does all the causal work, mental properties are redundant, like calling the same API endpoint twice.
  (5) i avoid epiphenomenalism by saying mental and physical causation run in parallel, like redundant nodes in a distributed system, not competing.
  (6) a sufficiently complex AI with integrated information architechture could have real mental causation, not just simulated.

  does this hang together? specifically im worried (4) kills (1) and (2) makes (5) impossible. but maybe (3) and (6) only look like they clash? tell me which pairs are genuinely incompatible, order them, and for each say what has to give. dont just list everything as equally bad.
