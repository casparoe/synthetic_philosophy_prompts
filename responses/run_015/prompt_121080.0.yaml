answer: |-
  This is an excellent catch. Your skepticism is well-founded: the passage you've quoted is a classic example of a popularizer taking a live, contentious philosophical debate and presenting one side as the "obvious winner" to clear the deck for their own narrative.

  As a philosopher of biology (or at least, speaking from that perspective), I can tell you that almost no one in the field would sign off on the claim that the causal-role account "wins easily." In fact, in the last thirty years, the historical (selected-effects) account has arguably become the dominant view in the *philosophy of biology*, precisely because of the problems the author glosses over.

  Here is a breakdown of what is settled, what is simplified, and what is genuinely misleading, followed by an analysis of your supervisor's point and your hitchhiking case.

  ### 1. The "Wins Easily" Claim
  **Verdict: Howler.**

  The author presents the debate as settled in favor of Cummins (causal-role). It is not.
  *   **The Selected-Effects (SE) View (Millikan, Neander, Godfrey-Smith):** This view holds that a trait's function is the effect for which it was naturally selected. It preserves **normativity**. It allows us to say a heart *ought* to pump blood even if it doesn't.
  *   **The Causal-Role (CR) View (Cummins):** This view holds that a function is simply a causal contribution to a system's capacity. It preserves **generality**. It allows us to talk about the function of a new enzyme or a robot part.

  Most philosophers of biology prefer SE for biological traits because CR is too permissive. As you suspected, the "carve the system up differently" point is generally considered a **bug, not a feature**. If *any* causal contribution counts as a function relative to *any* capacity, then the heart's function is indeed to make a thumping noise (relative to the capacity of making noise) or to keep cardiologists in business. While Cummins accepts this, most biologists find it useless. We want to know which effects explain the *presence* of the trait, not just what the trait *does*.

  The author claims CR wins because it covers things with no history (robots, lab enzymes). This is true, but SE proponents argue that robots and lab enzymes are **artifacts**, not biological traits, and shouldn't be judged by the same definition. They are happy to concede that artifacts have "designer functions" while biological traits have "proper functions."

  ### 2. The Medicine/Malfunction Contradiction
  **Verdict: Genuine Contradiction.**

  You spotted this perfectly. The text says:
  1.  Medicine assumes the causal-role account (disease = failure of normal function).
  2.  The causal-role account cannot handle malfunction (if it doesn't do it, it's not its function).
  3.  Therefore, on the causal-role view, you lose the ability to call a broken heart diseased.

  The author cannot have it both ways. If medicine relies on the concept of "failure of function," it *requires* a normative standard (a standard the trait *should* meet). The Causal-Role account is descriptive, not normative. It describes what a system *does* contribute. If a heart stops pumping, on a strict CR view, it simply no longer contributes to circulation. It hasn't "failed"; it has just changed its causal profile.

  To define disease, medicine actually relies on a hybrid view (often **Boorse's Biostatistical Theory**), which says a function is a statistically typical contribution to survival/reproduction *in a reference class*. This smuggles evolutionary history back in. So, the author is wrong to say medicine uses pure CR, and wrong to say CR handles disease well.

  ### 3. Your Supervisor's Point (Directed Evolution)
  **Verdict: Defensible, but with caveats.**

  Your supervisor is not cheating, but they are simplifying the scope of "enzyme engineering."
  *   **If you use Directed Evolution:** You are literally running a selection process. You create variation, apply a pressure (screen), and amplify the winners. Under the Selected-Effects account, these enzymes **do** have a proper function: the activity they were selected for. They have an evolutionary history, albeit a micro-evolutionary one in a tube. The book's claim that SE says lab enzymes have *no* function is false for directed evolution.
  *   **If you use Rational Design:** If you model an active site on a computer and synthesize a variant that has never existed and was not selected (just built), SE struggles. It has no selection history. CR handles this easily (its function is what you designed it to do).

  So, for your specific work (if it involves selection), the SE account actually fits *better* than the book admits. The book is treating "lab enzyme" as synonymous with "artifact," ignoring that directed evolution creates genuine selection histories.

  ### 4. The Hitchhiking Case
  **Verdict: This is where the accounts diverge sharply.**

  This is a fantastic test case. Let's apply the two views to your variant that catalyzes Reaction X but persists due to linked Resistance Marker Y.

  **The Selected-Effects (SE) Account:**
  *   **Analysis:** SE looks for the effect that explains the trait's presence.
  *   **Verdict:** This is tricky. If the *variant* rose to frequency solely because of the resistance marker (hitchhiking), then strictly speaking, the *presence of this variant* is explained by resistance, not catalysis. However, SE usually applies to the *trait type* (the catalytic mechanism). If the *capacity* to catalyze was the criterion used in the screening process that generated the library, then catalysis is the proper function of the *enzyme type*, even if this specific *token* is hitchhiking.
  *   **Nuance:** If you stripped the marker and the variant disappeared, an SE theorist might say the catalysis is a **spandrel** (a byproduct) in the context of the *current* population dynamics, even if it was the target of the initial engineering. The "function" is tied to the specific selection regime maintaining the trait. If the maintenance selection is for resistance, the function (ontologically speaking) shifts toward resistance, or the catalysis becomes a non-functional side effect of the resistance gene's vehicle.
  *   **Does knowledge matter?** No. SE is ontological. It depends on what actually happened in the history of selection, not what you knew at the time. If it hitchhiked, it hitchhiked.

  **The Causal-Role (CR) Account:**
  *   **Analysis:** CR asks: What does this variant contribute to the capacity of the system (the culture)?
  *   **Verdict:** It contributes to catalysis (Reaction X) AND it contributes to survival (via the linked marker). Both are "functions" relative to different capacities.
  *   **Utility:** CR allows you to say "Its function is catalysis" because *that is the capacity you are interested in analyzing*, regardless of why it's there. This matches lab talk better ("This enzyme functions to hydrolyze substrate Z").
  *   **Downside:** It doesn't explain *why* the enzyme is there. It treats the catalysis and the hitchhiking as equally valid "functions" depending on your analytical interest.

  **Which is right for you?**
  In enzyme engineering, you are likely using "function" in the **Causal-Role** sense. You care about what the molecule *does*, not necessarily its population genetics history. If a variant catalyzes the reaction, it has that function, even if it's hitchhiking. The SE account is too restrictive for daily lab work because it forces you to interrogate the selection history of every variant before you can say what it does.

  ### Summary Checklist for Reading the Rest of the Book

  1.  **When the author says "Function means...",** translate it as "One useful way to talk about function is..." There is no single settled definition.
  2.  **When the author dismisses the Historical view,** remember that it is the only view that successfully distinguishes between a trait's *function* and its *side effects* (e.g., pumping blood vs. making noise). This distinction is crucial for understanding adaptation.
  3.  **Regarding your work:** Your supervisor is right that directed evolution grants a selection history. However, you are also right that in the lab, we often use "function" to mean "causal capacity" regardless of history. Both are valid, but they answer different questions.
      *   **SE answers:** "Why is this trait here?" (Evolutionary explanation)
      *   **CR answers:** "What does this trait do?" (Mechanistic explanation)
  4.  **The "Disease" Contradiction:** Trust your gut. The author waved away the hardest problem for the Causal-Role view (normativity/malfunction) while simultaneously claiming it solves medical definitions. That is a rhetorical sleight of hand.

  **Bottom Line:** The passage is a **defensible simplification** of the Causal-Role view's strengths, but it presents a **howler** regarding the state of the philosophical debate and contains a **logical contradiction** regarding medicine. You should read the rest of the book enjoying its narrative, but treat its philosophical claims as "one perspective" rather than "settled science." Your intuition that the "carve up" point is a problem, not a solution, is philosophically sound.
