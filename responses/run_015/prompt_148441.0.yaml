          *   If the future is truly fixed (9), then (4) is false. If he hadn't heard the prophecy, *something else* would have taken him to Damascus. The prophecy isn't the *cause* of the event, just the *reveal* of the event. The traveler's choice is the mechanism, but the outcome is robust.
