      *   Which requirement kills the most theories?
      *   *The "Non-Catastrophe" Constraint.* Most panpsychist ethical theories collapse because they imply the universe is a hellscape of micro-suffering (Seager, Smith, etc.). If a theory can't solve the "Dust Problem" (disorganized micro-experience), it fails.

