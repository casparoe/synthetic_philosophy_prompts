answer: |-
  # Specification: Desiderata for a Panpsychist Ethics

  This document outlines the functional requirements for any ethical theory predicated on panpsychism (the view that consciousness is a fundamental and ubiquitous feature of physical reality). The goal is to define the solution space before evaluating specific literature.

  ## I. Case Coverage Requirements
  *An adequate theory must provide explicit verdicts on the following scenarios:*

  1.  **The Scattered Field Case:**
      *   **Requirement:** The theory must assign moral status to regions of experience that lack a unified subject (e.g., the uncoordinated proto-experiences of a rock or a gas cloud).
      *   **Consideration:** Panpsychism posits experience at the micro-level. If moral status tracks experience, disorganized experience must be accounted for. Ignoring this collapses the view into emergentism.
  2.  **The Boundary Sorites:**
      *   **Requirement:** The theory must specify where moral status increases, decreases, or vanishes across the continuum from particle to atom to molecule to organism.
      *   **Consideration:** Physical composition is continuous; moral status is often treated as binary or threshold-based. A panpsychist ethics cannot rely on a magical "soul" boundary; it must map moral gradients to physical/phenomenal gradients.
  3.  **The Cosmological Sum (The Catastrophe Check):**
      *   **Requirement:** The theory must calculate or bound the total moral value/disvalue of the inanimate universe and determine if it swamps human/animal ethics.
      *   **Consideration:** If micro-experiences are numerous enough ($10^{80}$ atoms), even tiny units of negative valence (suffering/noise) create an astronomical moral disaster. A theory that implies we should prioritize saving electrons over humans is pragmatically self-defeating.

  ## II. Conceptual Distinctions
  *The theory must rigorously separate the following concepts:*

  1.  **Existence vs. Intensity:**
      *   **Requirement:** Distinguish between *having* an experience and the *magnitude* of that experience.
      *   **Consideration:** A common error is assuming that because an electron has experience, it has an experience *as rich* as a mammal's. Moral weight likely tracks intensity or complexity, not mere existence.
  2.  **Sentience vs. Valence:**
      *   **Requirement:** Distinguish between the capacity to feel (sentience) and the quality of what is felt (valence: pleasure, pain, or neutral).
      *   **Consideration:** Moral status is often tied to the capacity for suffering. If micro-entities have experience but no capacity for *suffering* (only neutral "proto-feeling"), their moral claim is weaker.
  3.  **Patienthood vs. Agency:**
      *   **Requirement:** Restrict moral *patienthood* (being owed duties) separately from moral *agency* (bearing duties).
      *   **Consideration:** Panpsychism might grant patienthood to electrons, but granting them agency (responsibility for collisions) is absurd. The theory must explain how rights arise without reciprocal duties.

  ## III. Scientific Constraints
  *The theory cannot contradict established findings in the following domains:*

  1.  **Causal Closure of Physics:**
      *   **Requirement:** Moral status cannot grant micro-entities "magic" causal powers that violate conservation laws.
      *   **Consideration:** If an electron's moral status implies it can choose to deviate from quantum probabilities to avoid harm, physics is broken. Ethics must be supervenient, not causally intrusive.
  2.  **Neuroscientific Correlates:**
      *   **Requirement:** The theory must align with data regarding which physical structures correlate with reportable suffering (e.g., thalamocortical systems).
      *   **Consideration:** If the theory assigns high suffering to systems neuroscience shows are inert (e.g., the cerebellum or a rock), it loses empirical credibility.

  ---

  ## IV. Classification of Desiderata

  ### Non-Negotiable (Logical/Metaphysical Necessities)
  *   **[NN1] Internal Consistency:** The theory cannot assert $P$ (micro-experience has moral weight) and $\neg P$ (micro-experience has no moral weight) simultaneously.
  *   **[NN2] Causal Compatibility:** As above, ethics cannot violate the causal closure of the physical world.
  *   **[NN3] The Aggregation Constraint:** The theory must provide a mathematical or logical method for summing moral value across parts and wholes without double-counting (the "combination problem" applied to ethics).

  ### Prejudicial (Camp-Specific Intuitions)
  *   **[P1] Human Exceptionalism:** The intuition that human interests *must* always outweigh non-human interests. (A true panpsychist ethics might reject this).
  *   **[P2] The Optimism Bias:** The assumption that the universe's net moral value *must* be positive. (A pessimistic panpsychism is logically possible).
  *   **[P3] Complexity Privilege:** The assumption that complex systems *necessarily* have more moral weight than simple ones. (Some views hold that raw intensity of feeling, which might be high in simple entities, matters more).

  ---

  ## V. The Impossibility Theorem: Jointly Unsatisfiable Desiderata

  I judge the following two desiderata to be **jointly unsatisfiable** within a standard panpsychist framework. A theory must abandon one to save the other.

  1.  **The Principle of Phenomenal Proportionality:** Moral weight scales linearly (or monotonically) with the quantity of fundamental experience present.
  2.  **The Principle of Ethical Salience:** The moral considerations of macroscopic sentient beings (humans/animals) dominate the total moral calculus of the universe.

  **Reasoning:**
  Panpsychism entails that the number of fundamental conscious entities (electrons, quarks, etc.) exceeds the number of macroscopic subjects by dozens of orders of magnitude.
  *   If **Phenomenal Proportionality** holds, the sum of micro-experience value ($\text{Value}_{\text{micro}} \times 10^{80}$) will mathematically overwhelm the sum of macro-experience value ($\text{Value}_{\text{macro}} \times 10^{20}$), unless $\text{Value}_{\text{micro}}$ is effectively zero.
  *   If **Ethical Salience** holds (i.e., human suffering matters more than the sum of all stellar dust), then $\text{Value}_{\text{micro}}$ must be effectively zero or discounted non-linearly.
  *   **Conclusion:** You cannot maintain that micro-experience is real and morally weighty *and* that human ethics is the primary concern. You must either accept that the universe is a moral catastrophe driven by dust (abandoning Salience) or deny moral weight to the fundamental level (abandoning Proportionality, effectively retreating to emergentism).

  ---

  ## VI. The Key Filter: The Integration Threshold

  The single requirement that does the most work excluding existing candidates is **The Integration Threshold**.

  *   **Definition:** Moral status is not granted to scattered micro-experiences, but only to systems where information is integrated into a unified whole (often invoking Integrated Information Theory, $\Phi$).
  *   **Why it excludes candidates:**
      *   It excludes **Naive Panpsychism** (everything feels, therefore everything counts), which fails the Catastrophe Check.
      *   It excludes **Radical Emergentism** (only humans count), which fails the Panpsychist Metaphysics constraint.
      *   It forces a specific metaphysical commitment: that *unity* is morally more significant than *existence*.

  ---

  ## VII. Scoring Existing Candidates

  Here is how current prominent approaches fare against the desiderata list above.

  | Candidate View | Description | Score (0-5) | Failure Mode |
  | :--- | :--- | :--- | :--- |
  | **Complexity-Scaling** | Moral weight scales with computational/physical complexity. | **2/5** | Fails **[NN3] Aggregation**. It is arbitrary why complexity matters if experience is fundamental. Risks contradicting **Neuroscientific Correlates** if simple systems feel intensely. |
  | **Integration-Restriction** | Only systems with high $\Phi$ (integration) have moral status; micro-experiences are morally inert. | **4/5** | Solves **Catastrophe** and **Boundary** cases well. Fails **Phenomenal Proportionality** (implies fundamental experience is ethically irrelevant, weakening the motivation for panpsychism). |
  | **Micro-Suffering Acceptance** | Accepts that the universe is a vast sea of low-level suffering/noise; we cannot fix it. | **1/5** | Satisfies metaphysics but fails **Ethical Salience** and **Tractability**. Leads to moral paralysis or absurdity (e.g., existence is net negative due to vacuum fluctuations). |

  **Recommendation:** The **Integration-Restriction** view is the only viable candidate, provided it can justify why moral status emerges at integration without contradicting the claim that consciousness is fundamental. It is the only view that survives the **Catastrophe Check**.
