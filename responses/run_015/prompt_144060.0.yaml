      *   **Implications for Software:**
          *   *TWI View:* Lineage matters. Git history is the "essence." If `git log` connects them, they are the same project.
          *   *CT View:* Function/State matters. If the codebase is 80% different, the "spirit" or utility is different. It's a counterpart.
      *   **Settled vs. Contested:**
          *   *Settled:* There is no consensus in metaphysics. Both theories have major proponents and problems.
