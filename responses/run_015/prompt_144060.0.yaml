prompt: |-
  hey, im a backend dev with basically no philosophy background. i was thinking about git forks - if i clone my repo and change like 80% of the files, is it still the same project or just a counterpart? this reminded me of some debate about whether you can exist in another possible world with different properties, or if its just a similar copy. please describe the most important implications of counterpart theory vs transworld identity for how we should think about identity across software forks or versions. also please separate whats actually settled here from whats genuinely contested among people who know the topic, and dont present a contested view like its the consensus. and tell me where the git analogy probably breaks down since i might be mixing up metaphysics with version control.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend developer, little to no philosophy background.
      *   **Core Question:** If I fork a repo and change 80% of the files, is it the same project or a counterpart? How does this relate to metaphysical debates (Counterpart Theory vs. Transworld Identity)?
      *   **Specific Requirements:**
