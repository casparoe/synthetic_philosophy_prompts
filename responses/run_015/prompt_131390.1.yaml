answer: |-
  Your roommate gave a **mixed bag**. She nailed the famous examples and the emotional core of Williams's argument, but she accidentally pasted a significant chunk of John Rawls's philosophy (and some economic confusion) into Williams's mouth.

  Here is the breakdown of what is Williams, what is Rawls, and what is confused, followed by my confidence assessment.

  ### 1. The Accurate Williams (The "Hits")
  Your roommate got the phenomenological core of Williams's critique right.

  *   **Ground Projects as Data:** **Accurate.** Williams argues that utilitarianism alienates the agent from their "ground projects" (the commitments that give life meaning, like art, vocation, or love). By requiring you to view these as neutral inputs in a global calculation, utilitarianism attacks your **integrity**. It makes you a channel for the satisfaction of others rather than an author of your own life.
  *   **The Drowning Spouse / One Thought Too Many:** **Accurate.** This is Williams's most famous example (from the essay *"Persons, Character, and Morality"*). He argues that if a man saves his wife from drowning, the justification should be "because she is my wife," not "because saving her maximizes utility." If he pauses to calculate, he has had **one thought too many**. The error is indeed that he is reasoning from impartial weights rather than direct attachment.
  *   **Deep Commitments vs. Everyday Kindness:** **Accurate.** Williams clarifies he isn't arguing for selfishness or against basic morality. He is arguing against a moral system that demands you abandon your fundamental identity-defining commitments whenever the "global sum" requires it.

  ### 2. The Rawlsian Contamination (The "Misses")
  This is where your roommate's explanation goes off the rails.

  *   **The "Double-Counting Error":** **Incorrect (Not Williams).**
      *   **Why it's wrong:** Williams never argues about the *accounting* of utility functions. He does not claim that counting your partner's welfare in your function *and* theirs inflates the math. His objection is existential, not arithmetic. He cares about the *agent's perspective*, not the structural aggregation of goods.
      *   **Whose idea is this?** This sounds like a garbled version of **John Rawls's "Separateness of Persons" objection**. Rawls argues that utilitarianism treats society as a "super-person," extending the rational principle of choice for one individual (balancing one desire against another) to the whole society, thereby ignoring the distinctness of individuals. The language of "utility functions" and "aggregation errors" is Rawlsian (or economic), not Williamsian. Williams talks about *identity*; Rawls talks about *justice and structure*.
  *   **Act vs. Rule Utilitarianism:** **Mostly Incorrect.**
      *   **Why it's wrong:** Williams's critique is aimed at **consequentialism** broadly, not just Act-Utilitarianism. Even Rule-Utilitarianism justifies rules based on their overall utility outcomes. If a rule (e.g., "honor your family") conflicts with the global utility, the Rule-Utilitarian must ultimately defer to the system that produces the most good. Williams argues that *any* system that makes the justification of your actions external to your own projects attacks integrity. Whether you calculate act-by-act or rule-by-rule, the *source of authority* is still the global sum, not your integrity.
      *   **Nuance:** Some defenders of Rule-U argue it avoids the "drowning spouse" calculation in practice, but Williams would say it still gets the *moral justification* wrong.

  ### 3. Does the "Double-Counting" Point Make Sense?
  **No, not really.**
  In standard welfare economics or preference utilitarianism, my utility function represents *my* preferences. If I prefer my wife's safety, that is a preference *I* hold. Her utility function represents *her* preferences. There is no logical "double counting" in summing my preference for her safety + her preference for her safety. They are two distinct mental states belonging to two distinct people.
  The roommate seems to be suggesting that because her welfare is *her* good, I shouldn't count it as *my* reason for acting. But Williams doesn't say "don't count it." He says "don't count it *as utility*." Count it as *love*. The distinction is qualitative, not quantitative.

  ### 4. Confidence Assessment

  *   **Confidence that "Ground Projects" & "One Thought Too Many" are Williams:** **99%**. These are the textbook definitions of his critique found in *Utilitarianism: For and Against* and *Moral Luck*.
  *   **Confidence that "Double-Counting" is NOT Williams:** **95%**. This is structurally alien to Williams's writing style and philosophical concerns. It is almost certainly a conflation with Rawls or a misunderstanding of preference aggregation.
  *   **Confidence that the Critique applies to Rule-Utilitarianism:** **85%**. While some scholars debate the scope, the consensus is that Williams targets the consequentialist *structure* of justification, which Rule-U retains.
  *   **Confidence in the "Rawls" Diagnosis:** **90%**. The "separateness of persons" and aggregation critiques are the hallmark of Rawls's *A Theory of Justice*, which is often taught alongside Williams, leading to student conflation.

  ### 5. The Point I Am Least Sure About
  I am **least sure about the specific provenance of the "double-counting" confusion.**
  While I am highly confident it is *not* Williams, I cannot say with 100% certainty which specific secondary source or lecturer your roommate might be channeling. It resembles a specific technical objection to **Preference Utilitarianism** (specifically regarding how we compare interpersonal utility), or it could be a mangled recollection of Rawls's critique that utilitarianism "fuses all persons into one." It's possible she heard a professor say, "Williams, like Rawls, thinks utilitarianism ignores the distinctness of persons," and she translated "distinctness" into "double-counting utility functions."

  ### Summary Verdict
  Tell your roommate: **"You nailed the 'One Thought Too Many' and the 'Ground Projects' stuff, that's pure Williams. But the 'double-counting utility function' argument is actually John Rawls (or just confused economics), and Williams would say Rule-Utilitarianism still fails the integrity test because it still makes the global sum the boss of your life."**
