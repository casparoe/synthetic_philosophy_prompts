  6.  **Refining the "Double-Counting" Analysis:**
      *   Why is it wrong? Williams isn't arguing about the *math* of utility. He's arguing about the *psychology and morality* of the agent. If I save my wife, Williams says I do it because she is *my wife*, not because it adds +10 utils to the world. The roommate's claim that "her welfare is already inside her own utility function" is economic speak, not Williams's existential/phenomenological speak. This is almost certainly a conflation with Rawls's "Separateness of Persons" (utilitarianism extends the principle of choice for one man to society) or a misunderstanding of how preference utilitarianism handles interpersonal comparisons. I will label this as Rawlsian contamination.

