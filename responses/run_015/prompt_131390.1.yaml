prompt: |-
  ok so my roommate tried to explain Williams's integrity objection to me and I'm not sure she got it right. she said the core idea is that utilitarianism demands you treat your own ground projects and close relationships as just more data for a global welfare calculation. she brought up the drowning-spouse scenario - you're saving your partner and if you pause to think that saving her maximizes utility compared to saving a stranger, that's the one-thought-too-many failure. she said the problem isn't the outcome, it's that you're reasoning from impartial weights rather than direct attatchment. then she added that Williams actually thinks this creates a kind of double-counting error: your partner's welfare is already inside her own utility function, so counting it again in yours inflates the same goods twice, which is why impartial aggregation gets personal relationships structurally wrong, not just emotionally wrong. she also said this only bites against act-utilitarianism that assumes perfect information, not against rule-utilitarianism, and that Williams isn't complaining about everyday kindness - only about letting aggregate reasoning override deep commitments. is this a fair summary? which parts are actually Williams, which are misrepresentations or ideas stolen from Rawls's separateness-of-persons objection, and wheather the double-counting point even makes sense? please say how confident you are in all of this and single out the point you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Bernard Williams's "Integrity Objection" to Utilitarianism.
