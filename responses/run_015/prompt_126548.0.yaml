      *   *Claim:* This collapses into old pragmatism vs. realism about concepts. Is there an asymmetry?
      *   *Analysis:*
          *   Is it just old wine in new bottles? Conceptual Pragmatism (Peirce, Dewey, Price) vs. Conceptual Realism (natural kinds).
          *   The WKR framework adds a specific normative lens. It's not just "concepts are tools," it's "what kind of reason justifies this move?"
          *   The asymmetry question is key. Belief aims at truth. Conceptual adoption aims at utility ( arguably). If the norms are different, the WKR distinction shifts.
          *   Risk: If the essay just concludes "it depends on your meta-normative view of concepts," it might feel deflationary.
          *   Opportunity: The WKR framing sharpens the debate. It forces the realist to explain why practical reasons are *wrong-kind* for concepts if they aren't for actions. It forces the pragmatist to explain limits (can we define 'gravity' for political goals?).
      *   *Verdict:* It's not *just* rehashing if you focus on the *normative structure* of the justification (WKR) rather than just the metaphysical status of concepts. The asymmetry between belief (truth-normed) and concept-choice (utility-normed) is the way out of the "rehash" worry.

