      *   *Claim:* Conceptual engineering isn't belief; it's proposing a tool. Therefore, practical reasons might be right-kind.
      *   *Analysis:* This is the crux. Is CE distinct from belief revision?
          *   Standard view (e.g., Cappelen, Burgess): CE involves evaluating and improving concepts. It often involves proposing we *use* a concept differently.
          *   Belief: "I believe X is Y."
          *   CE: "We should use 'X' to mean Y."
          *   Distinction: Belief is typically taken to be truth-aimed (norm of truth). CE is often utility-aimed (norm of usefulness).
          *   Critique: However, when someone says "Gender is X," are they making a claim about the world (belief) or proposing a linguistic convention (CE)? Often these blur. If I say "Marriage is between two people," am I describing current usage or prescribing new usage?
          *   WKR Application: If CE is about *choosing a tool*, then practical reasons (equality, justice) are arguably *right-kind* reasons for choosing a tool. A hammer is chosen for hitting nails, not because it's "true." So, if concepts are tools, practical reasons are right-kind.
          *   Sloppy Reasoning Check: The outline says "they're not making a false descriptive claim." This is risky. Critics argue they *are* making false claims if the revision doesn't match reality. The defense is that they aren't making claims *at all*, but proposals. This needs careful phrasing.
      *   *Verdict:* Point 3 holds up *if* you clearly distinguish between *using* a concept (which involves belief) and *engineering* a concept (which involves policy/norms). The "tool" analogy is strong here.

