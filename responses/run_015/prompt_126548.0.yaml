      Also, on Point 5: Is it a rehash? The WKR framework is relatively modern (Rabinowicz, Ronnow-Rasmussen, etc.). Applying it to CE is novel. So it's not a rehash *if* the WKR lens is kept central. If the WKR lens drops away and it becomes "Realism vs Pragmatism," then it's a rehash. I should advise keeping the WKR terminology active throughout.

