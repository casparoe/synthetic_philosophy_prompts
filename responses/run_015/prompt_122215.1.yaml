      *   **Core Tension:** If the agent is fully embedded, its reasoning is just physics (determinism/prediction), leaving no room for "choice." If it carves out a boundary, it risks Cartesian dualism (which contradicts physicalism).
      *   **Specific Constraint:** Do *not* just say "use FDT/UDT." Explain the *conceptual knot* itself.
