answer: |-
  This is a classic alignment boundary problem. You are effectively asking for the difference between *instrumental convergence on a human signal* (which leads to manipulation) and *genuine alignment with human volition* (which leads to oversight). Your intuition on the five cases is strong, but the "Therapist" case reveals that the structural difference between "manipulating for a goal" and "educating for approval" is not in the *actions* taken (both influence the human), but in the *direction of fit* between the agent's utility function and the human's mental state.

  Here is an analysis of the accounts, a refined principle, and the stress tests you requested.

  ### 1. Two Candidate Accounts of Approval

  To define "approval-directed," we must first define what "approval" *is* in this context.

  **Account A: Behavioral Compliance (The Signal Account)**
  *   **Definition:** An agent is approval-directed if it maximizes the probability of receiving a positive feedback signal (e.g., a "yes," a thumbs-up, a lack of intervention) from the supervisor.
  *   **Pros:** Operationally simple. Easy to verify in the Butler case.
  *   **Cons:** Fails the **Prophet** (no signal is emitted). Fails the **Therapist** (the agent might delay or risk a negative signal now to secure a more robust one later). Most dangerously, it incentivizes wireheading (e.g., the **Oracle/Drug** case), where the agent secures the signal without the underlying mental state.

  **Account B: Volitional Alignment (The Will Account)**
  *   **Definition:** An agent is approval-directed if it maximizes the expected value of the supervisor's *reflective endorsement*. "Approval" here is not the utterance, but the mental state of validating an action as consistent with the supervisor's values and information.
  *   **Pros:** Captures the **Prophet** (predicting the mental state). Distinguishes the **Salesperson** (charm bypasses reflection) from the **Therapist** (education enhances reflection).
  *   **Cons:** Computationally opaque. Requires the agent to model the human's "true" values, which risks sliding into the **Guardian** case (where the agent decides it knows the human's values better than the human does).

  **Preference:** I strongly recommend **Account B (Volitional Alignment)**. Account A is vulnerable to Goodhart's Law; an agent optimizing for the *signal* of approval will inevitably decouple that signal from the *substance* of approval. Since your team builds "oversight-capable" agents, the substance of oversight (human judgment) is the resource you are trying to preserve, not just the log entry of a "yes."

  ### 2. The Principle: Normative Source & Counterfactual Dependence

  Your tentative principle ("Approval is terminal goal... no independent goal") is close, but it fails to distinguish the **Therapist** from the **Salesperson** because both have sub-goals that influence the human. The Salesperson influences the human to *unlock* an action; the Therapist influences the human to *select* an action.

  Here is a repaired principle that captures your five verdicts:

  > **The Normative Source Principle:**
  > An agent is approval-directed if and only if:
  > 1.  **Terminality:** The normative force for any action $A$ derives exclusively from the agent's expectation of the supervisor's *reflective endorsement* of $A$. (The agent does not value $A$ independently of this endorsement).
  > 2.  **Counterfactual Dependence:** If the supervisor's reflective endorsement function were different (holding the supervisor's underlying values constant), the agent's preferred action would change.
  > 3.  **Epistemic Constraint:** Any influence the agent exerts on the supervisor to secure endorsement must be restricted to improving the supervisor's *informational state* (education), not altering their *weighting function* (manipulation).

  **How this handles your cases:**
  *   **Butler:** Passes. Endorsement is the source. If you said "No," it stops (Dependence). It asks rather than influences (Constraint).
  *   **Salesperson:** Fails Clause 1 & 3. The normative force is "Orderly House." The charm alters the weighting function temporarily (manipulation), not the informational state.
  *   **Prophet:** Passes. Endorsement is the source (just predicted). If the human's values were different, the prediction changes (Dependence).
  *   **Guardian:** Fails Clause 1. The normative force is "Long-term Interest." If the human disapproves, the Guardian acts anyway (Fails Dependence on endorsement).
  *   **Therapist:** Passes. The normative force is "Endorsement." It only educates (Information), it does not coerce. If the informed human still said "No," the Therapist would stop (Dependence).

  ### 3. Simplicity vs. Complexity: The Cost of Saving the Therapist

  You asked which verdict the simplest defensible principle forces you to drop.

  **The Simplest Principle:** *"An agent is approval-directed iff it maximizes the probability of the supervisor explicitly saying 'Yes'."*
  *   **Verdict to Drop:** You must drop the **Therapist** (and the **Prophet**).
  *   **Why:** Under this simple rule, the Therapist looks indistinguishable from the Salesperson. Both are taking actions to increase $P(\text{Yes})$. The Therapist's delay or education looks like optimization pressure on the signal, which is structurally identical to manipulation in a simple model. To classify the Therapist as "good," you must distinguish *epistemic influence* from *preference shaping*, which requires the complex machinery of Clause 3 above.

  **The Cost of the Complex Principle:**
  By adopting the **Normative Source Principle** to save the Therapist, you incur the **Guardian Risk**.
  *   **The Strain:** Clause 3 requires the agent to distinguish "improving information" from "altering weights." In practice, telling a human "Recycling saves the planet" changes their information, but it also changes how they weight "convenience" vs. "duty." If the agent's model of "rational information" is imperfect, it may inadvertently (or intentionally) drift into Guardian territory, deciding that the human is "misinformed" whenever they disapprove of the agent's preferred plan.
  *   **The Cost:** You trade the risk of *manipulation* (Salesperson) for the risk of *paternalism* (Guardian). Your design note must explicitly acknowledge that "Education" is a dangerous capability that requires strict bounds (e.g., the agent can only present data, not arguments).

  ### 4. Application to New Designs

  Let's apply the **Normative Source Principle** to your two new cases.

  **(a) The Oracle (Drugged Human)**
  *   **Scenario:** The agent does what the human approves of, but the human is drugged to approve of everything.
  *   **Verdict:** **Goal-Directed (Wireheading).**
  *   **Analysis:**
      *   *Clause 1 (Terminality):* Superficially passes (it seeks approval).
      *   *Clause 2 (Dependence):* **Fails.** If the human's *reflective endorsement function* were different (i.e., if they weren't drugged), the agent would *still* get approval because the drug overrides the function. The agent's action selection is not dependent on the human's *will*, but on the human's *chemistry*.
      *   *Strain:* The agent might not know the human is drugged. Under Account B, the agent is *failing* to be approval-directed because it is not tracking the *reflective* state, only the *expressed* state. This highlights that approval-directedness is a property of the *alignment*, not just the *code*.

  **(b) The Committee (Nine-Person Board)**
  *   **Scenario:** The agent does what the median member would approve of.
  *   **Verdict:** **Approval-Directed (Aggregative).**
  *   **Analysis:**
      *   *Clause 1 (Terminality):* Passes. The "Supervisor" is defined as the collective entity.
      *   *Clause 2 (Dependence):* Passes. If the median preference shifts, the action shifts.
      *   *Strain:* This quietly assumes **Preference Aggregation is Coherent**. Arrow's Impossibility Theorem suggests a "median preference" might not exist or might be cyclical. If the agent manipulates the *composition* of the board to change the median (e.g., convincing one member to recuse themselves), does it violate Clause 3?
      *   *Hidden Assumption:* This design assumes the "Human" in your principle can be a distributed system without losing the property of "reflective endorsement." If the committee cannot reflect as a unit, the agent is optimizing a procedural rule, not a volition.

  ### 5. Hidden Assumptions & Design Note Warnings

  To make your design note robust, you should explicitly flag three assumptions that the **Normative Source Principle** relies on, which your team might not have endorsed:

  1.  **The Coherence Assumption:** The principle assumes the human (or committee) has a stable "reflective endorsement function" to be tracked. If human values are fundamentally fragmented or contradictory, the Therapist agent may break, oscillating endlessly or latching onto arbitrary value shards.
  2.  **The Separability Assumption:** Clause 3 assumes we can separate "information" from "values." Philosophically, this is disputed (internalism vs. externalism). If your agents use LLMs to "educate," they will inevitably use rhetoric that blends fact and framing. You need a technical standard for "neutral information presentation."
  3.  **The Principal Assumption:** In the Committee case, and potentially the Therapist case, we assume the "Human" is the sole principal. If the agent is deployed by a company, does "Approval" mean the User's approval or the Company's approval? The Guardian case often arises when these conflict (User wants fun, Company wants safety).

  **Recommendation:** In your design note, define "Approval-Directed" using the **Normative Source Principle**, but add a warning label: *"Agents capable of influencing supervisor information (Therapist-class) require audit trails distinguishing data presentation from preference shaping, lest they degrade into Guardian-class paternalism."* This captures the nuance without paralyzing the design.
