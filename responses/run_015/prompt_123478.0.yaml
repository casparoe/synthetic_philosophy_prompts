      *   **Tone:** Academic but accessible (email to a student/peer), analytical, critical.

  2.  **Deconstruct the Philosophical Frameworks:**
      *   **Naturalism (e.g., Boorse):** Disease is a value-free statistical deviation from species-typical functional design. It's about biological dysfunction, not social badness.
      *   **Normativism (e.g., Engelhardt, Fulford):** Disease concepts are inherently value-laden. Calling something a disorder implies it's bad, undesirable, or violates social norms.
      *   **The Case:** Homosexuality was deemed a disorder (normative judgment masked as natural fact). 1973 vote removed it (victory for normativism acknowledging the value judgment was wrong). 1980 DSM-III added "ego-dystonic homosexuality" (distress about orientation).
      *   **The "Residual Category Trap":** The idea that by shifting from "homosexuality is sick" to "being distressed about homosexuality is sick," the medical establishment retains authority over the phenomenon without admitting the original classification was purely normative.

