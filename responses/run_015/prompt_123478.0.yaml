      *   *Normativist Analysis:* Can Normativism explain the activist fight? Normativism says disease is what we value as bad. Activists fought because the label itself was the harm (stigma), not just the distress. They wanted the value judgment removed entirely, not tweaked. Normativism explains this well: the label is a speech act of condemnation.
      *   *The "Trap" & Theory Evaluation:* Does this break Naturalism? It exposes its inability to separate function from social context. Does it break Normativism? It strengthens it but shows the complexity of power. The "trap" shows that medical taxonomy is a tool of social control, not just description. Both theories might miss the *political* dimension of diagnosis (power/knowledge).
