      *   **User's Concept:** The "residual category trap" (removing a condition from main taxonomy but burying value judgment in a sub-diagnosis framing problem as individual distress rather than social identity).
      *   **Tasks:**
          1.  Analyze the episode through Naturalist and Normativist lenses using the "residual category trap" concept.
          2.  Evaluate if Naturalism can explain the retention of the distress-only version without smuggling values in.
          3.  Evaluate if Normativism can explain why activists fought for total removal instead of accepting reclassification.
          4.  Assess what this shows about the theories (does it break one, or show they miss something?).
      *   **Format:** One long continuous prose block, like an email.
