      *   **Format:** Dialogue between a Theravada Buddhist (defender) and a Skeptic (challenger).
      *   **Tone:** Sharp, competent, no strawmen, real back-and-forth engagement.
      *   **Key Distinction:** Substance vs. Process.

  2.  **Character Conception:**
      *   **The Buddhist (Bhikkhu Bodhi-esque but accessible):** Let's call him *Ven. Ananda*. He needs to be well-versed in Abhidhamma concepts (momentariness, dependent origination) but able to explain them clearly. He shouldn't rely on faith but on logic and phenomenology.
      *   **The Skeptic:** Let's call him *David*. He's philosophical, perhaps analytic in bent. He sees a logical contradiction: If $A$ causes $B$ across lifetimes, there must be an identifier that persists. He's not hostile, just rigorous.

  3.  **Key Philosophical Points to Cover:**
      *   *Anatta* doesn't mean nothing exists; it means no *permanent, unchanging controller* exists.
      *   The "Stream" (*citta-santana*) is a causal series, not a singular entity.
      *   Analogy time: Flame, River, Sound. (Need to use these carefully so they don't become strawmen).
      *   The distinction between *numerical identity* (same thing) vs. *causal continuity* (linked things).
      *   The problem of moral responsibility (Karma) without a self.

  4.  **Drafting - Section by Section:**

      *   **Opening:** David raises the objection immediately. It's the classic "rebirth implies a soul" critique.
      *   **Ven. Ananda's Initial Defense:** Distinguish between "self" (atta) and "continuity" (santana). Define *atta* as permanent/unchanging.
      *   **David's Pushback:** If it changes, what links the moments? If moment 1 causes moment 100, isn't there a "carrier"?
      *   **The Flame Analogy (Refined):** Ananda uses the candle flame. David critiques it (isn't the heat/chemistry the "substance"?). Ananda clarifies: It's energy transfer, not entity transfer.
