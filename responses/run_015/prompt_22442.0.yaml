      *   *Focus:* Keep returning to "Substance vs. Process."
      *   *Theravada Specifics:* Mention *patisandhi-vinnana* (relinking consciousness) or *nama-rupa* to ground it in the tradition, but keep it accessible. Let's stick to *citta-santana* (mind-stream) as it's more universally understood in this context.

  6.  **Final Polish:** Check the rhythm. Ensure interruptions and natural flow. Ensure the philosophical terms are used correctly (e.g., *svabhava*, *dependent origination*).

      *(Self-Correction Note)*: I need to be careful with the "stream" metaphor. Buddhists often warn against reifying the stream itself. Ananda should acknowledge that even the "stream" is a convention.

