answer: |-
  In a standard memory-care wing, Mr. Henderson suffers from profound anterograde amnesia following hippocampal sclerosis, rendering him incapable of internally weaving new experiences into a continuous autobiographical thread; he forgets conversations within minutes and cannot spontaneously recall yesterday's events. However, he wears a commercially available life-logging pendant and interacts hourly with a tablet application that algorithmically curates his audio-visual data into a coherent, updated digital biography, prompting him with contextual summaries ("You just had lunch with your daughter, here is the photo") which he accepts as his own history without internal resistance. While his brain no longer generates a unified internal narrative stream, the external system maintains a seamless, accessible record of his actions and preferences that guides his current behavior and social interactions, creating a functional continuity of personhood despite the internal fragmentation.

  **Verdicts:** Dennett's internalist view declares Mr. Henderson's self dissolved because the "centre of narrative gravity" is an abstraction drawn from the brain's own competitive storytelling processes; without an internal mechanism spinning the yarn, there is no gravity centre, only a passive recipient of data. The distributed narrative gravity view declares his self intact because the narrative coherence required for personhood is preserved within the coupled system of brain plus algorithm, regardless of where the processing physically occurs.

  **Structural Feature:** The divergence is driven solely by the **locus of narrative coherence** (intracranial vs. extended system).

  **Removal Effect:** If the external algorithmic log is removed, both views converge on the verdict that the self is lost, as the internal capacity is already compromised; the divergence exists only while the external scaffold supports the narrative weight.

  **Attack from the Losing Side:** A Dennett defender would argue that the external log is merely a causal prop, like a diary or a photograph, not a constitutive part of the self; because Mr. Henderson does not internally authorize or integrate the updates into a unified conscious perspective, the machine is telling a story *about* him, not *for* him, and gravity requires an internalizer.

  **Confidence:** I am 85% confident in this analysis.

  **Least Sure Point:** I am least certain about whether Dennett would concede that sufficiently tight coupling with an external device could count as part of the "brain's" competitive process, as his views on extended cognition have shown some flexibility regarding the vehicles of content.
