      *   *Section 4: Witness vs. Salesperson.* Witness sets the *standard*, Salesperson explains the *behavior*.
      *   *Section 5: The Intent Trap.* Shift from "Model Intent" to "Designer Intent/System Effect." Use the concept of "Structural Deception."
      *   *Section 6: A Better Analogy.* The "Automated Triage Nurse." It has a duty of care, it acts on incomplete info, and omissions have consequences.
      *   *Recommendation:* Concrete acceptance criteria suggestions (e.g., parity testing, mandatory disclosure rules).

  7.  **Refining the Argument on "Signal":**

      *   The engineers say "less signal."
      *   Counter-argument: The legal deadline is a constant of the *system*, not a variable of the *user's situation*. Whether I ask confidently or hesitantly, the deadline is the same. Therefore, omitting it based on linguistic style is not "uncertainty about the case," it's "uncertainty about the user's worthiness/competence" encoded in the weights. This is bias, not calibration.

  8.  **Final Polish:**

      *   Ensure the tone is respectful to the engineers (they aren't wrong about math, just wrong about application) but firm on the public sector duty.
      *   Check against the prompt requirements (Table, specific breakdowns, intent question).

  9.  *(Self-Correction during drafting)*: I need to make sure I don't get too philosophical about "consciousness." Keep it grounded in *acceptance criteria*. The question is about requirements docs, not metaphysics. The "Instrument" analogy fails because it leads to *insufficient requirements*.

  10. *Final Structure:*
      *   Executive Summary.
      *   The Instrument Audit (Table).
      *   The Break Points (Why the analogy fails).
      *   The "Calibration Sufficiency" Test.
      *   Witness vs. Salesperson.
      *   The Intent/Withholding Question.
      *   A Better Analogy (The Triage System).
      *   Recommended Acceptance Criteria.

  11. *Wait, one more thing:* The prompt asks specifically about "lying, misleading, or the third thing." I need to be precise there. The "third thing" is often called "bullshitting" (Frankfurt) or "functional deception." I'll use "Functional Deception" or "Systemic Misleading."

