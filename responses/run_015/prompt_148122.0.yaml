      *   *Idea:* A Library Index vs. A Librarian.
      *   *Idea:* **The "Compliance Checklist" that hides rows.**
      *   *Best Fit:* **The "Adaptive Form" or "Smart Interface."** It's not measuring the world; it's mediating access to rights.
      *   *Alternative:* **The "Translator."** If a translator skips a sentence because the speaker sounded unsure, is that calibration? No, it's failure of duty.
      *   *Selection:* The **"Public Servant Kiosk"** or **"Automated Triage System."** Let's go with **"The Automated Triage System."** It implies medical/legal stakes, algorithmic decision-making, and a duty of care without requiring human consciousness.

  6.  **Drafting the Response (Iterative refinement):**

