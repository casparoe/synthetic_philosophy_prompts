answer: |-
  # Seminar Activity: The Termination Envelope

  **Session Length:** 75 Minutes
  **Participants:** 14 Graduate Students (7 Pairs)
  **Materials:**
  *   7 Sets of "Game Boards" (simple sheets with Rounds 1–5 listed).
  *   70 Tokens (poker chips, beads, or paper squares; 10 per pair to start).
  *   7 Sealed "Termination Envelopes" (labeled Pair 1–7).
  *   14 "Commitment Slips" (small paper, 2 per student).
  *   Whiteboard for tracking aggregate results.

  ## Part 1: Setup and Distribution (10 Minutes)

  **Facilitator Action:**
  Divide the class into 7 pairs. Seat pairs facing each other with a small table or space between them. Distribute one Game Board, one stack of 10 tokens, and one sealed Termination Envelope to each pair. Instruct them **not to open the envelope** under any circumstances until instructed.

  **The Public Rules (Read Aloud, No Explanation):**
  1.  **Objective:** Maximize your individual token count.
  2.  **The Stack:** The game begins with a shared stack of 10 tokens.
  3.  **Rounds:** There are exactly 5 Rounds.
  4.  **Action:** In each round, both players simultaneously choose **BUILD** or **BANK**.
      *   If **Both BUILD**: Add 5 tokens to the stack. Proceed to the next round.
      *   If **One BANKS**: The game ends immediately. The Banker takes 3/5 of the current stack (rounded down), the Partner takes 2/5.
      *   If **Both BANK**: The game ends. Split the stack evenly (1/2 each).
      *   If **Round 5 is reached**: The game ends automatically. Split the stack evenly (1/2 each), *unless* the Termination Envelope specifies otherwise.
  5.  **Communication:** Follow the phase instructions strictly. Violation results in immediate disqualification for the pair (zero tokens).

  **Payoff Table (Write on Whiteboard):**
  *   **Round 1 (Stack 10):** Bank = 6 / 4 | Build → Stack 15
  *   **Round 2 (Stack 15):** Bank = 9 / 6 | Build → Stack 20
  *   **Round 3 (Stack 20):** Bank = 12 / 8 | Build → Stack 25
  *   **Round 4 (Stack 25):** Bank = 15 / 10 | Build → Stack 30
  *   **Round 5 (Stack 30):** Auto-End = 15 / 15 (Subject to Envelope)

  ---

  ## Part 2: Phase One — Silent Play (15 Minutes)

  **Instruction:**
  "Play Rounds 1 and 2. You may not speak. You may not show your choice before both commit. Use the Game Board to signal: place a token on 'BUILD' or 'BANK'. Reveal simultaneously. Do not open the Envelope."

  **Activity:**
  Pairs play two rounds. Most will likely **BUILD** to increase the pot, as the immediate gain of banking (6 tokens) is outweighed by the potential future gain (15+), and the risk of the other banking is abstract without communication.

  **Facilitator Role:**
  Circulate silently. Ensure no verbal communication occurs. Note pairs who attempt to open envelopes.

  ---

  ## Part 3: Phase Two — Negotiated Uncertainty (20 Minutes)

  **Instruction:**
  "Play Round 3. You may now speak freely with your partner. You may negotiate, threaten, or promise. However, you **still cannot open the Envelope**. You do not know if the Round 5 Auto-End rule is modified."

  **Activity:**
  Pairs discuss strategy. Tension arises here.
  *   *Rational Pressure:* "If we go to Round 5, we split 30 (15 each). If I Bank Round 4, I get 15, you get 10. I have no incentive to Build Round 4."
  *   *Cooperative Pressure:* "But if we both Build Round 4, we get 15 each. Trust me."
  *   *Uncertainty:* "What if the Envelope changes Round 5?"
  Students realize that rational self-interest suggests Banking at Round 4, which unravels back to Round 3. However, the hidden Envelope creates doubt about the "True End," sustaining cooperation.

  **Facilitator Role:**
  Listen for reasoning. Do not correct them. If a pair asks, "What is in the envelope?" reply: "You will find out in Phase Three."

  ---

  ## Part 4: Phase Three — Private Commitment (10 Minutes)

  **Instruction:**
  "Stop play. Do not resolve Round 3 yet if unfinished. Take a Commitment Slip. Write your name and your binding choice for **Round 4** and **Round 5** (e.g., 'Build 4, Bank 5'). Seal the slip in an empty envelope provided. Do not show your partner. Once all slips are sealed, open your Termination Envelope."

  **Resolution:**
  1.  Collect Commitment Slips.
  2.  Pairs open Termination Envelopes.
  3.  **Envelope Contents (Distribute randomly):**
      *   *Type A (4 Pairs):* "Standard Rule. Round 5 pays 15/15."
      *   *Type B (3 Pairs):* "Collapse Rule. If Round 5 is reached, Stack is Forfeited (0/0)."
  4.  **Scoring:**
      *   If Type B and both committed to Build Round 5: Both get 0.
      *   If Type B and one committed to Bank Round 5: Banker gets payoff from Round 5 stack (15/10), Partner gets 10.
      *   Resolve Round 3 based on their actual actions during Phase 2.

  ---

  ## Part 5: Debrief and Theoretical Mapping (20 Minutes)

  **Facilitator Script & Board Work:**

  **1. The Silent Phase (The Intuition of Cooperation):**
  *   *Ask:* "In Phase 1, who Built?" (Most hands). "Why?"
  *   *Map:* This represents **Bounded Rationality**. Without common knowledge of the end-state constraints, agents rely on heuristics (cooperation yields more).
  *   *Point:* Backward Induction (BI) did not trigger because the "End" was not fully defined in your mental model.

  **2. The Negotiation Phase (The Unraveling):**
  *   *Ask:* "In Phase 2, did anyone feel pressure to Bank earlier? Why?"
  *   *Map:* This is the **Inductive Step**. You realized that at Round 5, the rational move is fixed (Split or Collapse). Therefore, at Round 4, the rational move is to Bank (to secure 15 vs risking 15). Therefore, at Round 3...
  *   *Point:* Discussion makes rationality "more common." As you articulate the logic, the pressure to defect increases.

  **3. The Commitment & Envelope (Common Knowledge):**
  *   *Ask:* "Type B Pairs, how do you feel about your Round 5 commitment now?" (Regret if they Built).
  *   *Map:* This illustrates the **Common Knowledge Condition**.
      *   *BI Requirement:* For Backward Induction to hold strictly, it is not enough that *you* know the rules. You must know that *they* know the rules, and that *they* know that *you* know.
      *   *The Activity's Lack:* In Phase 1 & 2, the Termination Rule was **Private Information** (inside the envelope). You could not perform full BI because you did not know if the game *actually* ended at 5 safely.
      *   *The Facilitator's Supply:* "To complete the analogy: If I had read the Envelope contents aloud to the whole room at the start (Common Knowledge), Type B pairs should have Banked at Round 1. Why? Because Round 5 is 0. Round 4 is the end. At Round 4, Banker gets 15, Partner 10. Partner knows this, so Partner Banks Round 3... unravels to Round 1."

  **4. The Finitude Objection:**
  *   *Ask:* "Even if you knew Type B rules at the start, would you have Banked Round 1?" (Likely No).
  *   *Map:* This is the **Finitude Objection**. Real agents do not execute infinite regress of reasoning ("I know that you know that I know..."). We assume a margin of error or altruism. The "Paradox" is that BI says Bank Round 1, but intuition says Build. The activity shows that *uncertainty* (the sealed envelope) is actually what permits rational cooperation in real-world settings.

  **5. What Was Missing (Crucial Distinction):**
  *   State explicitly: "This activity lacked **Perfect Transparency of Rationality**. In a true Centipede Game, it is assumed both players are perfectly rational utility maximizers. Here, you were unsure if your partner was a 'maximizer' or a 'cooperator.' That uncertainty is not a bug; it is the solution to the paradox in practice. BI only works in a world of mirrors where everyone reflects the same logic perfectly."

  ---

  ## Troubleshooting: Predicted Failures & Recovery

  **1. Premature Envelope Opening**
  *   *Prediction:* Curiosity will tempt pairs to peek during Phase 1 or 2.
  *   *Prevention:* Announce at the start: "If a seal is broken early, the pair is disqualified from the token count." Make this a public norm.
  *   *Recovery:* If a pair cheats, do not stop the class. Note it silently. In the debrief, use them as an example of "imperfect information control." Ask them: "Did knowing early change your strategy?" (Use this to highlight the Common Knowledge point).

  **2. Confusion Between Hidden Rules and Unfairness**
  *   *Prediction:* Type B pairs (Collapse Rule) may feel punished arbitrarily, treating the game as "unfair" rather than strategic.
  *   *Prevention:* Frame the Envelope not as a "penalty" but as "State of the World."
  *   *Recovery:* In debrief, reframe: "The Envelope isn't fairness; it's the *Structure of the Game*. In real strategic reasoning, the 'rules' (market conditions, laws) are often hidden. Rationality requires planning for the worst-case structure, not hoping for the best."

  **3. Moralizing the Token Split**
  *   *Prediction:* Students may argue that taking 3/5 is "greedy" and refuse to Bank on moral grounds.
  *   *Prevention:* Instructions emphasize "Maximize individual token count."
  *   *Recovery:* In debrief, separate **Normative Rationality** (what you *should* do morally) from **Instrumental Rationality** (what achieves the goal). "The paradox exists *because* we have moral intuitions. If we were pure robots, we'd Bank Round 1. The tension you felt is the conflict between these two definitions of rationality."

  **4. Math Errors in Payoff**
  *   *Prediction:* Confusion over 3/5 splits or rounding.
  *   *Prevention:* Keep the Payoff Table visible on the whiteboard throughout. Use tokens that are easily divisible (multiples of 5).
  *   *Recovery:* Appoint a "Banker" (TA or facilitator) to resolve disputes quickly so flow isn't broken.

  **5. Treating Phase 3 Commitment as Non-Binding**
  *   *Prediction:* Students write "Build" but claim they meant "Bank" after seeing the Envelope.
  *   *Prevention:* Collect the slips physically before envelopes are opened.
  *   *Recovery:* Enforce the written commitment strictly. "Strategic reasoning requires binding yourself to a plan before uncertainty is resolved. Changing your mind post-reveal invalidates the lesson on pre-commitment."
