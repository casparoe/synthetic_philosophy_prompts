answer: |-
  Good evening, everyone. Thanks for coming out on a Thursday night. I know we've got a bit of a split in the room tonight. Half of you are here because this is your lake, your view, your property values. The other half are here because you care about stratigraphy, radionuclides, and where we draw the line on a geological timescale. Usually, those two groups don't have much to say to each other. But this proposal forces us to talk.

  We're being asked to let the international scientific community use our reservoir sediment core as a marker for the Anthropocene. Basically, they want to stick a pin in our mud and say, "This is where the human age started."

  I've been thinking about what that pin actually means. I call it the "Delegation Problem."

  Here's the choice: If we date the start of the Anthropocene to 1950, based on the plutonium spike from atomic bomb testing, we are making a specific claim about responsibility. We are saying the Earth changed when *industrial* societies changed it. That means the people who get to speak for humanity in this decision are the industrial nations. The scientists in the labs. The Global North. It's clean, it's sharp, and it lets the rest of human history off the hook.

  But, if we push that date back to the Agricultural Revolution, when we started moving dirt and changing landscapes on a massive scale, the story changes. Then, every human society is equally on the hook. It's not just about factories; it's about farming, settlement, and land use. It's about us, here, generations ago, not just the bomb testers.

  So, I'm not going to hedge. Here is my stance: **We should argue for the Agricultural Revolution start date, and we should insist that the communities living on these markers have a vote in the decision.**

  Here's why. The 1950 date is scientifically convenient, but it's politically cowardly. It treats the Anthropocene like an accident that happened to us, rather than a trajectory we built. If we accept the 1950 date, we accept that only certain experts get to define humanity's impact. But if we acknowledge that we started changing the planet when we started farming, then the authority to define this epoch doesn't belong solely to the International Commission on Stratigraphy. It belongs to the people whose ancestors turned the soil.

  That means this town. That means you.

  To the geologists in the room: I know the bomb spike is a cleaner signal. I know the pollen record is messy. But stratigraphy isn't just about reading rocks; it's about telling a story. If you choose the 1950 spike, you are telling a story about industry. If you choose the agricultural layer, you are telling a story about humanity. We need to be brave enough to tell the human story, even if the lines are blurrier.

  To the neighbors: This isn't just about whether a scientific committee gets to drill here. It's about whether our local history counts as global history. If we back this proposal, we shouldn't just hand over the core and say "good luck." We should back it on the condition that our local narrative—of land use, of change over centuries—is part of the official record, not just the Cold War fallout.

  So, my recommendation is this: We support the proposal, but we attach a statement. We state that this core represents a long arc of human impact, not just a mid-century spike. And we demand that the decision-making process includes local stakeholders, not just academic delegates. If the Anthropocene is about humans changing the Earth, then humans living on the Earth should get to say when it started.

  Let's not let them delegate our responsibility away with a convenient date. Let's own the whole history.

  Thanks.

  ***

  **Note on liberties taken:** *In the speech above, I've taken a firm stance on the "Early Anthropocene" hypothesis (agricultural start) versus the "Great Acceleration" (1950s start). In actual scientific discourse, this is heavily contested. The "Golden Spike" (GSSP) criteria generally require a sharp, global synchronous signal, which favors the 1950s radionuclide marker over the gradual onset of agriculture. Additionally, the idea that local communities would have formal voting power on a geological timescale is a political argument I've inserted into a scientific governance process that is currently strictly expert-led.*
