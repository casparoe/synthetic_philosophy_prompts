answer: |-
  ## Preface: Clearing the Cache

  You are correct that the discourse stalls on three cached moves: the Walter Benjamin "aura" (mystical residue), the Nelson Goodman "autographic/allographic" distinction (syntactic density), and the Market Scarcity argument (art as asset). These fail to guide a conservation committee facing a fire-damaged Rembrandt versus a perfect facsimile, or an individual discovering their cherished purchase is a period copy.

  To build a specification that serves both the **Museum** (fiduciary duty, public trust, preservation) and the **Individual** (rational emotional investment), we must separate the *ontology* of the object from the *epistemology* of the viewer.

  **Definition:** I will use the term **authentic** only once, to define it out of existence. In this specification, *authentic* shall mean nothing more than "holding the correct causal genesis relative to the relevant artistic act." We will not use it as a value judgment.

  ---

  ## Part I: Register Separation

  Before listing desiderata, we must isolate what "better" tracks in ordinary claims. When a curator says, "The original is better than the copy," they are often conflating three distinct registers. A theory must specify which register is doing the work.

  1.  **The Aesthetic/Experiential Register:** Concerns the qualia of the encounter. (Does it move me? Is the visual data identical?)
  2.  **The Art-Historical Register:** Concerns the causal chain linking the object to a specific agent and time. (Did *this* hand touch *this* surface?)
  3.  **The Economic/Title Register:** Concerns scarcity, provenance, and legal ownership. (Do I hold the token of value?)

  **Diagnosis:** In ordinary discourse, "better" usually tracks the **Art-Historical Register**, but is justified post-hoc using **Aesthetic** language. The Museum operates primarily in the Art-Historical and Economic registers; the Individual often believes they are operating in the Aesthetic register but is actually relying on the Art-Historical.

  ---

  ## Part II: The Desiderata (Pruned)

  Below are the requirements a theory must meet. I have pruned candidates that merely restate the problem (e.g., "It must value originals") or that apply only to one register without bridging the two jobs.

  ### 1. The Epistemic Independence Requirement
  *   **Definition:** The loss of value/identity upon substitution must obtain even if the substitution is undetectable to any observer now or in the future.
  *   **Motivating Case:** *Backroom Destruction.* An original is destroyed in storage and replaced by a molecule-for-molecule duplicate before anyone sees it.
  *   **Job Served:** **Institution.** (Insurance claims, liability, and collection integrity rely on the loss being real regardless of public knowledge.) **Individual.** (Explains the feeling of betrayal upon later discovery; the past relationship was with a different ontological entity.)
  *   **Status:** **Non-Negotiable.**
  *   **Analysis of Your Candidate:** Your suggestion ("explain why backroom destruction is a loss") is a **real desideratum**, not a prejudice. It is the stress test for the theory.
      *   *Theories that fail:* Pure Aestheticism (if it looks the same, it is the same), Radical Contextualism (if the context of reception is unchanged, the work is unchanged).
      *   *Why it matters:* If a theory cannot account for silent loss, it cannot justify insurance payouts or the moral weight of forgery.

  ### 2. The Causal Genesis Constraint
  *   **Definition:** The identity of the work is partially constituted by the specific causal history of its production, specifically the intentional acts of the credited agent(s).
  *   **Motivating Case:** *Workshop Production* (Master underdrawing, pupil paint) vs. *Artist Self-Copy* (Painter replicates own destroyed work).
  *   **Job Served:** **Institution.** (Cataloging, attribution labels, deaccessioning "by" vs. "attributed to".) **Individual.** (Distinguishes between a forgery and a later copy; explains why the self-copy feels different from the pupil copy.)
  *   **Status:** **Non-Negotiable.**
  *   **Analysis:** This knocks out theories that rely solely on physical constitution. It explains why the *Self-Copy* is often valued higher than the *Workshop* piece, despite similar physical divergence from the "first" instance. The artist's intent to *instantiate* the work matters.

  ### 3. The Normative Transparency Constraint
  *   **Definition:** The institution's public representation of the object must align with its ontological status. Deception invalidates the institutional function, even if the object is aesthetically superior.
  *   **Motivating Case:** *Displaying a Known Fake.* A museum knows a painting is a forgery but displays it as the original because it is "more beautiful."
  *   **Job Served:** **Institution.** (Public trust is the museum's primary capital.) **Individual.** (Rationality of care; one cannot rationally love an object under a false description.)
  *   **Status:** **Non-Negotiable for Institution; Preference for Individual.**
  *   **Analysis:** An individual *can* irrationally love a fake. An institution *cannot* professionally display one as real. This requirement forces the theory to account for the social contract of the museum.

  ### 4. The Medium-Specific Instantiation Rule
  *   **Definition:** The theory must allow for variance in what counts as "the original" depending on the medium's ontology (e.g., painting vs. conceptual art vs. digital file).
  *   **Motivating Case:** *Conceptual Art* (Instructions + Certificate) vs. *Digital File* (Byte-identical copies, distinct transaction record) vs. *Unique Painting*.
  *   **Job Served:** **Institution.** (Acquisition policies for digital/media art.) **Individual.** (Understanding why buying an NFT differs from saving a .jpg.)
  *   **Status:** **Non-Negotiable.**
  *   **Analysis:** A monolithic theory of "originality" fails here. For the digital file, the *transaction record* is the genesis. For the painting, the *physical surface* is the genesis. The theory must be polymorphic.

  ### 5. The Continuity of Substance Preference
  *   **Definition:** All else being equal, retaining the original physical matter is preferred over replacement, even if the form is preserved.
  *   **Motivating Case:** *Conservation Triage.* Do we stabilize the rotting original canvas or replace it with a new canvas that perfectly supports the original paint?
  *   **Job Served:** **Institution.** (Conservation budgets.) **Individual.** (Relic value.)
  *   **Status:** **Preference (Institutional).**
  *   **Analysis:** This is where the "cached moves" often hide. Is the canvas sacred? This requirement is *not* non-negotiable. Sometimes the paint layer is the work; sometimes the support is. A theory that makes physical continuity absolute fails the *Workshop* case (where the master's hand is on the underdrawing, not the surface).

  ---

  ## Part III: Conflicts and The Killer Requirement

  ### Incompatibility Flag
  **The Economic/Title Register vs. The Aesthetic/Experiential Register.**
  *   **Conflict:** In the *Digital File* case, the aesthetic experience is identical across copies, but the economic/title value is mutually exclusive (only one "original" token).
  *   **Resolution:** A theory must admit that "what is lost" is different for the collector (title) than the viewer (experience). You cannot unify these into a single metric of "value" without distortion. The specification demands the theory distinguish them, not reconcile them.

  ### The Killer Requirement
  **The Epistemic Independence Requirement (Req #1).**

  This is the single requirement that knocks out the most otherwise-popular theories.
  *   **It kills Goodmanian Notation:** If the notation is identical, the work is identical. But the backroom destruction shows the work is *not* identical if the history differs.
  *   **It kills Pure Aestheticism:** If the experience is identical, the value is identical. But the insurance adjuster knows the value dropped the moment the original burned, regardless of the swap.
  *   **It kills Reception Theory:** If the audience's reception is unchanged, the work is unchanged. But the institution's duty is to the object's history, not just the audience's current state.

  Any theory that ties the identity or value of the work *essentially* to the viewer's ability to detect a difference fails the specification. The loss must be ontological, not epistemological.

  ---

  ## Part IV: Addressing Your Candidate

  > *One candidate of my own: that a theory must explain why the backroom destruction above is a loss at all. Is that a real desideratum or my own prejudice?*

  It is a **real desideratum**, specifically for the **Institutional Job**.

  If your theory says, "No loss occurred because no one's experience changed," you cannot advise a museum on insurance, conservation triage, or ethical display. You would have to advise them that burning the collection and replacing it with perfect fakes is cost-neutral provided the public remains ignorant. This violates the fiduciary and ethical mandate of the institution (to preserve cultural heritage, not just simulate it).

  For the **Individual Job**, it is slightly more nuanced. If the individual *never* finds out, has *their* rationality been compromised? Yes, because their emotional investment was predicated on a false proposition ("I am in the presence of X"). The loss is the retroactive invalidation of their past experience.

  **Theories that fail this:**
  1.  **Idealism/Phenomenology:** Value resides only in the encounter. (Fails because the encounter was unchanged.)
  2.  **Functionalism:** Value resides in the object's function. (Fails if the copy functions identically.)
  3.  **Radical Skepticism:** We can't know the history, so it doesn't matter. (Fails the insurance test.)

  ---

  ## Part V: Scorecard of Contenders

  Here is how three common theoretical frameworks score against the specification.

  | Theory | Epistemic Independence (Killer) | Causal Genesis | Normative Transparency | Medium Specificity | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Pure Aestheticism** (Value = Experience) | **FAIL.** Claims no loss if experience is identical. | **FAIL.** Cannot distinguish master hand from perfect copy. | **FAIL.** Would allow displaying fakes if "better." | **PASS.** Treats all media as visual data. | **Inadequate.** Useful for criticism, useless for collection management. |
  | **2. Goodmanian Notation** (Value = Syntactic Density) | **FAIL.** If the copy matches the notation, it is the work. | **PARTIAL.** Distinguishes autographic/allographic but fails the *Backroom* case for autographic works if the copy is perfect. | **PASS.** Demands strict adherence to labels. | **FAIL.** Struggles with digital/conceptual (NFTs) where notation is identical but token differs. | **Inadequate.** Too rigid for modern media; fails the ontological test. |
  | **3. Historical/Genetic Essentialism** (Value = Causal Chain) | **PASS.** Loss occurs when the chain is broken, regardless of detection. | **PASS.** Explains Workshop vs. Master vs. Self-Copy. | **PASS.** Demands labels reflect the chain. | **PASS.** Can accommodate certificates/transactions as part of the "genesis." | **ADEQUATE.** Best fit for both Museum and Individual jobs. |

  ### Final Recommendation for Your Post
  Build your argument around the **Epistemic Independence Requirement**. This is the wedge that separates the "rationalist" analysis from the "art lover's" intuition. Most people feel the loss of the original is real even if undetected, but they lack the metaphysical vocabulary to defend it against the "it looks the same" argument.

  By framing the "Backroom Destruction" case as a non-negotiable constraint for institutional integrity, you force the theory to account for **history as a constituent of the object**, not just a story we tell about it. This satisfies the Museum's need for conservation logic and the Individual's need to validate their sense of betrayal.

  **Taboo Check:** I have used "authentic" only in the Preface to define it out of existence. The rest of the text relies on "original," "genesis," "causal chain," and "continuant."

  **Pruning Check:** I removed requirements regarding "Beauty" or "Cultural Significance" as these are variables, not constraints on the theory of originality itself. I removed "Legal Title" as a standalone requirement, subsuming it under the Economic Register and Normative Transparency.

  This specification should prevent your thread from stalling on the usual three moves. It forces the discussion into metaphysics and institutional ethics, where the actual work lies.
