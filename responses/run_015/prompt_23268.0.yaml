answer: |-
  This is an excellent question that cuts to the heart of the endurance vs. perdurance debate. It is very common in seminars to feel that these arguments blur together, because they both aim to show that an object cannot be "wholly present" at multiple times. However, they target different metaphysical commitments, and the endurantist's resources for solving them are not symmetrical.

  First, a small bibliographic clarification that might help your seminar discussion: While Lewis is certainly associated with worries about presence, the **Problem of Temporary Intrinsics (PTI)** is classically Lewis's argument (from *On the Plurality of Worlds*, 1986). Sider (in *Four-Dimensionalism*, 2001) is famous for *sharpening* PTI and showing why the standard endurantist replies fail. The argument you are calling the "Fact of Presence" is often discussed as the **Argument from Location** or the worry about **Relative Existence**.

  However, taking your description of the arguments at face value (Lewis = Presence/Existence; Sider = Intrinsics/Properties), here is the comparison you need.

  ### 1. Are they the same argument in different clothes?

  **No, they are genuinely distinct.** They attack endurance at different levels of metaphysical structure.

  *   **The Argument from Presence (Ontological/Existential):** This argument targets the *mode of existence*. If an object $O$ is wholly present at $t_1$ and wholly present at $t_2$, what is the relationship between these two presences? If $O$ is numerically identical, what accounts for the difference between being present at $t_1$ and being present at $t_2$? The worry is that we need a "further fact" to locate the object in time, which risks a regress (when is it present that it is present at $t_1$?) or makes existence itself a relation.
  *   **The Problem of Temporary Intrinsics (Predicational/Qualitative):** This argument targets *properties*. It assumes the object persists and asks how it bears properties. If $O$ is bent at $t_1$ and straight at $t_2$, and $O$ is the same object, $O$ has incompatible properties. The focus is on the logic of predication and the nature of intrinsicality.

  **The Distinction:** You can theoretically solve the Presence argument (by saying existence is relative to times) while still failing to solve PTI (because relative existence doesn't explain how one thing holds incompatible shapes). Conversely, you might try to solve PTI (by denying the properties are incompatible) while still struggling with Presence (how is the object located?).

  ### 2. Does the "Tensed Properties" reply defuse both equally?

  The standard endurantist reply is **Indexicalism** or **Adverbialism**: The cat does not have the property *being bent* simpliciter; it has the property *being bent-at-t* or *being bent-now*.

  **Against the Argument from Presence:**
  This reply works **reasonably well**. If the endurantist says "Existence is tensed" (i.e., to exist is to exist-now), they can deny that there is a "further fact" needed. The object simply exists *now*. There is no timeless "fact of presence" that needs locating; there is only present existence.
  *   *Vulnerability:* This pushes the endurantist toward **Presentism** (only the present exists). If they accept Eternalism (past and future exist), they struggle to explain why the object is "present" at one time and not another without invoking temporal parts. But for a Presentist Endurantist, the Presence argument loses much of its bite.

  **Against the Problem of Temporary Intrinsics (Sider's Version):**
  This reply **fails**, and this is Sider's crucial contribution.
  *   **Lewis's Original Worry:** Lewis argued that shapes are *intrinsic*. If you analyze "being bent" as a relation to a time ("bent-at-$t$"), you have made shape an *extrinsic* property (it depends on something outside the object, namely time).
  *   **Sider's Sharpening:** Sider argues that this isn't just a terminological loss. Our intuition that shape is intrinsic is robust. If "being bent" really means "bearing the bent-relation to $t_1$," then the object's shape depends on its relation to the temporal manifold. But a solitary object in a timeless void could still be bent. Therefore, relationalizing properties destroys the very phenomenon (intrinsicality) we were trying to save.
  *   **The Result:** The tensed property reply defuses the *contradiction* (the cat isn't bent and straight simpliciter), but it does so at the unacceptable cost of making intrinsic properties extrinsic.

  ### 3. Which version is stronger?

  **Sider's Problem of Temporary Intrinsics is the stronger argument.**

  Here is why, which you can use to structure your seminar contribution:

  1.  **Robustness of Intuitions:** The intuition that shape, mass, and color are *intrinsic* properties is harder to abandon than the intuition about the "fact of presence." Many metaphysicians are already willing to accept that existence might be relative (Presentism) or that location is tricky. Far fewer are willing to say that an object's shape depends on its relation to a time.
  2.  **Presentism doesn't save Endurance from PTI:** As noted above, the "Fact of Presence" argument can be dodged by adopting Presentism (only the present moment is real, so the object is only wholly present *now*). However, PTI still bites Presentists. Even if only the present exists, we need to make sense of *change*. The cat *was* straight and *is* bent. If the cat is an enduring singular, we still need an account of how it bore the past property without currently having it, without resorting to temporal parts. Sider argues that the "bent-at-$t$" solution fails regardless of your ontology of time.
  3.  **The "Further Fact" Regress is Avoidable:** The "Fact of Presence" argument risks a McTaggart-style regress (when is it present that it is present?). Endurantists have developed sophisticated tense-logic to block this regress. Sider's argument against intrinsicality is less easily blocked by logical maneuvering; it requires a substantive revision of what properties *are*.

  ### Summary for your Seminar
  You can argue that while both arguments aim to show endurance is incoherent, they are distinct: **Presence** is an ontological worry about *location/existence*, while **Intrinsics** is a predicational worry about *properties*.

  The endurantist's tensed reply saves them from the Presence argument (by embracing a tensed ontology like Presentism) but leaves them vulnerable to Sider's version of PTI. Sider shows that relationalizing properties to avoid contradiction strips those properties of their intrinsicality, which is a bullet most metaphysicians refuse to bite. Therefore, the Temporary Intrinsics argument is the more formidable obstacle to Endurantism.
