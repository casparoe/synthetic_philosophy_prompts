      *Decision:* The strongest break that respects the user's constraints is at **Step (4)** and the transition to **Step (6)**. The definition of "inviolate" is too rigid. A foundation can be *structurally* inviolate (it justifies lower levels without being justified by them *at that moment*) without being *historically* immutable. This allows for moral progress (5) without abandoning the need for a foundation (1). This is the concept of "reflective equilibrium" or "fallibilist foundationalism."

