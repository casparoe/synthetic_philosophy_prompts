answer: |-
  **Joint Statement on the Concept of Democratic Backsliding**

  **Signatories:** The Erosion Theorist and The Contestability Skeptic

  **1. Agreed Claims**
  We, the undersigned, affirm the following propositions as the baseline for our collaboration:
  1.  **Observable Institutional Change:** In all four cases under review (Hungary post-2010, Poland 2015-16, Turkey post-2017, United States post-2020), elected incumbents pursued institutional changes affecting the judiciary, electoral administration, or civil service. Both sides agree these changes occurred in legal form and were driven by governing majorities.
  2.  **Insufficiency of Popularity:** The electoral popularity of the government at the time of reform does not settle whether the regime is backsliding. High approval ratings are compatible with both democratic renewal and authoritarian consolidation.
  3.  **Insufficiency of Consensus:** The frequency with which scholars apply the label "backsliding" to a case is not evidence of the concept's validity. Consensus may reflect shared ideological priors rather than empirical precision.
  4.  **Process over Episode:** Classification cannot turn on a single dramatic episode (e.g., a specific veto override or appointment). The phenomenon, if it exists, is cumulative and sequential.
  5.  **Gap Acknowledgement:** We agree that while the *events* are undisputed, we cannot agree on whether these events constitute a single analytically distinct category ("backsliding") or heterogeneous phenomena lumped together by normative disapproval.

  **2. Residual Disagreements**
  The following table maps our divergences. Each row is annotated by whether we view the disagreement as genuine (substantive), verbal (terminological), or an artifact of unit selection (different levels of analysis).

  | Domain | Erosion Theorist Position | Contestability Skeptic Position | Annotation |
  | :--- | :--- | :--- | :--- |
  | **Cases** | Hungary, Poland, and Turkey are clear instances of backsliding; the US is a potential case depending on institutional outcomes. | Hungary and Turkey represent majoritarian re-founding; Poland and the US represent standard partisan conflict mislabeled as regime change. | Genuine |
  | **Definition** | Backsliding is defined by the reduction of *ex-ante* uncertainty regarding electoral turnover, regardless of the incumbent's ideological goal. | Backsliding is defined by the *asymmetric application* of the label to right-populist governments, ignoring similar maneuvers by left-liberal coalitions. | Genuine |
  | **Definition** | The concept requires a thin, procedural definition of democracy (organized uncertainty) to remain measurable. | The concept implicitly relies on a thick, liberal definition (rights, norms) that conflates regime type with policy preference. | Verbal |
  | **Function** | The concept serves as an early-warning system to trigger supranational conditionality or domestic legal resistance. | The concept serves as a tool of normative condemnation that delegitimizes elected mandates without requiring proof of authoritarian intent. | Genuine |
  | **Unit of Analysis** | We analyze the regime-level structure of competition over time. | We analyze the specific policy choices and ideological contexts of individual governments. | Artifact |

  **3. Cruxes and Adjudicating Tests**
  We identify four specific tests where evidence could shift our respective credences. We note that the candidate crux regarding *Intent vs. Foreseeability* has dissolved: both sides agree that intent is epistemically inaccessible and that classification must rest on observable institutional effects. The remaining cruxes are as follows:

  *   **The Baseline Crux:** Does backsliding require a high-democracy baseline?
      *   *Evidence:* Comparison of institutional changes in the US (high baseline) versus Turkey (lower baseline).
      *   *Theorist Prediction:* The US can backslide because the concept is relative to prior institutional integrity; small erosions in high-baseline cases matter as much as large ones in low-baseline cases.
      *   *Skeptic Prediction:* The concept collapses if applied to high-baseline cases where turnover remains possible; "backsliding" is merely a label for normal polarization in mature democracies.
  *   **The Aggregation Crux (The Grain Problem):** How do individual legal changes sum to regime change?
      *   *Evidence:* The sequence of judicial appointments and media regulations in Hungary and Poland.
      *   *Theorist Prediction:* There exists a tipping point where individually defensible changes aggregate to structurally lock in incumbent advantage.
      *   *Skeptic Prediction:* There is no principled aggregation rule; the sum is determined by the observer's tolerance for majoritarianism, not an objective threshold.
  *   **The Mirror Case Device:** Hold institutional moves fixed; invert the ideology.
      *   *Test:* If a left-liberal coalition enacted the same court-packing or electoral administration changes, would both sides classify it as backsliding?
      *   *Theorist Prediction:* Yes. The mechanism is institutional, not ideological. If classification changes, the concept is contaminated.
      *   *Skeptic Prediction:* Classification might legitimately change because prior probabilities of authoritarianism differ by coalition type. Asymmetry in labeling may reflect asymmetry in risk, not bias in the concept.
  *   **The Performativity and Standing Crux:** Does the label alter the outcome, and who may apply it?
      *   *Test:* The effect of supranational bodies (e.g., EU) or comparativists classifying a government as backsliding.
      *   *Theorist Prediction:* Classification has causal power; it mobilizes opposition and triggers conditionality, potentially preventing further erosion. Comparativists and supranational bodies have standing.
      *   *Skeptic Prediction:* Classification accelerates erosion by giving incumbents a pretext to claim elite sabotage. Only domestic voters and courts have standing; external classification is itself an interventionist act.

  **4. Closing Note on Falsification**
  To move beyond restatement, we specify observations genuinely unfavorable to our respective views.

  *   **For the Erosion Theorist:** If incumbents successfully dismantle institutional guarantees (judicial independence, media access) but electoral turnover occurs repeatedly without reversal of those changes, the claim that these changes constitute "authoritarian consolidation" is falsified. The mechanism must link institutional change to reduced turnover probability.
  *   **For the Contestability Skeptic:** If a neutral algorithm applying consistent institutional criteria classifies left-liberal and right-populist governments as backsliding at equal rates, the claim that the concept is inherently ideologically asymmetric is falsified.
  *   **Common Ground:** We agree that the debate moves only if we can establish a principled aggregation rule for institutional changes that is independent of the ideological identity of the actor. Until such a rule is specified, we acknowledge a gap: we cannot currently distinguish a "re-founding mandate" from "creeping authoritarianism" without referencing the observer's normative baseline. We commit to testing the Mirror Case device empirically before concluding our collaboration.
