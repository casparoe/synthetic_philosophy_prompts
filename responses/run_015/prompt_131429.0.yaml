answer: |-
  **PROTOCOL FOR ALGORITHMIC HARM ADJUDICATION (AHA-1)**

  **Purpose:** To determine the locus of moral and professional responsibility in cases involving harm where semi-autonomous Clinical Decision-Support Systems (CDSS) were utilised.
  **Time Allocation:** Maximum 45 minutes.
  **Users:** Clinical Ethics Committee Members (No philosophical training required).
  **Instruction:** Proceed sequentially. Do not skip steps. If a 'Stop' condition is met, record the finding and cease the audit. If the procedure concludes without a 'Stop', the case is declared a 'Responsibility Gap'.

  ---

  ### PART 1: THE DIAGNOSTIC SEQUENCE

  **Step 1: Causal Contribution Test**
  *Question:* Was the CDSS output a necessary condition for the clinical action that caused harm?
  *   **Test:** Would the clinician have taken the *exact same action* at the *exact same time* without the system's prompt?
  *   **Sufficient Answer for 'No':** Evidence (notes, testimony) shows the clinician had already decided on the course of action before viewing the CDSS output.
      *   **STOP POINT:** Assign primary responsibility to the **Clinician**. The system is incidental.
  *   **Sufficient Answer for 'Yes':** The action followed the recommendation, or the clinician cites the system as the trigger for the action.
      *   **ACTION:** Proceed to Step 2.

  **Step 2: Epistemic Access and Competence**
  *Question:* Did the clinician possess the capacity to understand *why* the system made the recommendation?
  *   **Test:** Was the reasoning behind the recommendation visible (explainable) and comprehensible to a clinician of this grade and speciality?
  *   **Sufficient Answer for 'Yes':** The system provided rationale (e.g., 'High risk due to Factor X and Y') that aligns with standard medical training.
      *   **ACTION:** Proceed to Step 3.
  *   **Sufficient Answer for 'No':** The system provided only a raw score, probability, or directive without rationale, or the rationale relied on data correlations unknown to current medical science.
      *   **FLAG:** **Potential Collapse Condition.** (See Part 3 below).
      *   **ACTION:** Proceed to Step 3, but note that the 'Override' capacity is compromised.

  **Step 3: The Meaningful Override Test**
  *Question:* Was there a feasible opportunity to reject the recommendation without incurring prohibitive friction?
  *   **Test:** Could the clinician physically and administratively override the system within the timeframe required for patient safety, without needing superior approval that was unavailable?
  *   **Sufficient Answer for 'No':** The system hard-stopped the workflow, or override required permissions not held by the clinician, or the time required to verify the error exceeded the emergency window.
      *   **FLAG:** **Confirmed Collapse Condition.** (The distinction between 'tool use' and 'system decision' has dissolved).
      *   **STOP POINT:** Declare **Irreducible Responsibility Gap**. Proceed to Part 4 (Institutional Assessment).
  *   **Sufficient Answer for 'Yes':** The clinician could have selected 'Ignore', 'Override', or 'Alternative' with a single click or verbal instruction.
      *   **ACTION:** Proceed to Step 4.

  **Step 4: Normative Alignment and Deviation**
  *Question:* Did the recommendation align with established clinical guidelines existing *independent* of the software?
  *   **Test:** Compare the CDSS recommendation against current standard-of-care guidelines (e.g., NICE, Royal College).
  *   **Sufficient Answer for 'No' (Recommendation was flawed):** The system suggested a course of action contraindicated by standard guidelines.
      *   **ACTION:** Proceed to Step 5.
  *   **Sufficient Answer for 'Yes' (Recommendation was sound):** The system suggested the correct standard-of-care action.
      *   **STOP POINT:** Assign primary responsibility to the **Clinician** (if they deviated) or **System/Developer** (if they followed it but guidelines were wrong, though this is rare). *Note: If the clinician followed a sound recommendation that nonetheless caused harm due to patient idiosyncrasy, this is usually a no-fault adverse event.*

  **Step 5: Institutional Authorisation**
  *Question:* Was the use of this specific CDSS module authorised and trained for this specific clinical context?
  *   **Test:** Check procurement records and training logs. Was the clinician trained to recognise the specific failure mode that occurred?
  *   **Sufficient Answer for 'No':** The tool was used 'off-label', or the clinician received no training on its limitations.
      *   **STOP POINT:** Assign primary responsibility to the **Institution/Management**.
  *   **Sufficient Answer for 'Yes':** The tool was approved for this use, and the clinician was certified in its operation.
      *   **STOP POINT:** Assign **Shared Responsibility**. The clinician failed in their duty of care to verify (Step 2/3), but the Institution failed in ongoing monitoring of system accuracy.

  ---

  ### PART 2: COLLAPSE CONDITIONS AND GAP DECLARATION

  **Definition of Collapse Condition:**
  A Collapse Condition exists when the clinician's agency is functionally bypassed. This occurs when Step 2 is 'No' (Opacity) AND Step 3 is 'No' (Friction/Time). In these instances, the clinician is reduced to a biological component of the machine.

  **Procedure for Responsibility Gaps:**
  If the audit reaches the end of Step 5 without a definitive 'Stop Point' assigning individual blame, or if a Collapse Condition is confirmed:
  1.  **Do not** attempt to force individual attribution.
  2.  **Declare:** 'Irreducible Responsibility Gap'.
  3.  **Action:** The matter shifts from *adjudication of blame* to *institutional restitution*. The Hospital Trust assumes liability as the only entity with the capacity to absorb the risk and modify the socio-technical environment.

  **Limitations of this Protocol:**
  *   **Value Judgements:** This protocol cannot determine if the harm itself was 'acceptable risk'. It only determines *who* owns the risk.
  *   **Foreseeability:** It cannot assess whether developers *should have known* about a bug without external technical audit.
  *   **Moral Remainder:** Even if a Gap is declared, moral distress may remain for the clinician. This protocol does not resolve psychological guilt.

  ---

  ### PART 3: WORKED APPLICATIONS

  #### Case A: The Willful Override
  **Scenario:** A CDSS flags a drug interaction and recommends against prescribing Drug X. The Senior Registrar reviews the patient, determines the interaction is manageable, overrides the system, and prescribes Drug X. The patient suffers an adverse reaction.
  **Audit:**
  1.  **Causal:** Yes, the prescription was written by the clinician.
  2.  **Competence:** Yes, the Registrar understood the warning (it was explicit).
  3.  **Override:** Yes, the system allowed override with a reason code.
  4.  **Alignment:** The system was correct (guidelines advised against Drug X).
  5.  **Institution:** Tool authorised; clinician trained.
  **Result:** **Stop Point at Step 4.** Primary responsibility assigned to the **Clinician**. The system functioned as a warning device; the clinician exercised normative competence and chose to deviate. No gap exists.

  #### Case B: The Blind Adoption
  **Scenario:** A CDSS recommends a specific dosage for a paediatric patient. The system is known to occasionally glitch on weight inputs under 10kg. The clinician does not check the weight input, accepts the dosage, and the patient is overdosed.
  **Audit:**
  1.  **Causal:** Yes, action followed recommendation.
  2.  **Competence:** Yes, the dosage calculation is basic arithmetic within clinician competence.
  3.  **Override:** Yes, the clinician could have checked the weight field.
  4.  **Alignment:** No, the recommendation violated standard dosing guidelines (visible upon basic check).
  5.  **Institution:** Clinician was trained on the 'weight glitch' risk.
  **Result:** **Stop Point at Step 5.** **Shared Responsibility.** The Institution failed to fix a known bug, but the Clinician failed in their duty to verify (Normative Competence). The audit prevents a Gap declaration because the clinician *could* have known better.

  #### Case C: The Opaque Black Box
  **Scenario:** An AI-driven sepsis predictor alerts 'High Risk' and automatically initiates a protocol for broad-spectrum antibiotics. The reasoning is based on 200 variables, none of which are displayed. The clinician has 30 seconds to act before the protocol locks in. The patient has an allergic reaction to the antibiotics. The clinician claims they could not verify the risk.
  **Audit:**
  1.  **Causal:** Yes, the protocol initiated the harm.
  2.  **Competence:** **No.** The reasoning is opaque (200 hidden variables). The clinician cannot assess validity.
  3.  **Override:** **No.** The 30-second window and automatic initiation constitute prohibitive friction.
  4.  **Alignment:** Unable to assess (opacity prevents comparison to guidelines in real-time).
  5.  **Institution:** Tool authorised, but the *mode* of deployment (auto-initiate) was not clinically validated for safety.
  **Result:** **Collapse Condition Confirmed.** **Irreducible Responsibility Gap.**
  **Reasoning:** The clinician was not a decision-maker but a supervisor of an autonomous process they could not understand or stop. Individual blame is inappropriate.
  **Outcome:** Institutional Liability. The Committee recommends a review of procurement policies regarding 'auto-initiate' functions.

  ---

  ### PART 4: CRITICAL FAILURE MODES OF THIS PROCEDURE

  Committee members must be aware that this audit tool is a heuristic, not a moral oracle. It will misfire in the following circumstances:

  1.  **The 'Hindsight Bias' Trap:** Step 2 (Competence) is vulnerable to judging the clinician's knowledge based on what is known *after* the harm. Members must rigorously assess competence based on what was knowable *at the time*.
  2.  **The 'Training Shield':** Institutions may claim 'Training Provided' (Step 5) even if that training was perfunctory. If members suspect training was inadequate, they must override the 'Yes' answer in Step 5 and revert to Institutional Responsibility.
  3.  **Systemic Pressure:** This protocol does not measure implicit coercion. If a clinician 'could' override (Step 3) but feared professional reprisal for slowing down workflow, the 'Yes' answer is misleading. Members must inquire into workplace culture if Step 3 is contested.
  4.  **The Gap as a Solution:** Declaring a 'Responsibility Gap' is not an end point; it is a signal for policy change. If the Committee uses the Gap declaration to close the file without recommending systemic changes, the procedure has failed ethically.

  **Final Instruction:**
  If the Committee finds itself debating the *definition* of the questions rather than the *evidence* applied to them for more than 15 minutes, the case exceeds the scope of this audit. It must be escalated to a full ethical inquiry involving external technical experts. This procedure is for triage, not deep structural analysis.
