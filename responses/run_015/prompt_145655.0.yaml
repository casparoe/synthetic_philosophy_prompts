prompt: |-
  I teach a six-week module on persistence in an upper-level undergraduate metaphysics seminar. The session I need help with is the fourth: sixteen students, seventy-five minutes, a seminar room with a whiteboard, movable chairs, and nothing else. No AV, no prep budget beyond what I can print or carry in a bag, and no real money for stakes.

  By this point the students have worked through the standard pressure points in the abstract: the problem of temporary intrinsics, the objection that a thing wholly present at each of several times would have to be wholly present at many places at once, the embarrassment of how many things a perdurantist must count in an ordinary room, and the way the Ship of Theseus seems to dissolve under one picture and become a forced choice under the other. The difficulty is that all of it stays notional. They can reconstruct the arguments and still feel, reasonably, that nothing is at stake: whichever picture they adopt, the world looks exactly the same afterwards, and the discussion decays into a canvass of who finds what intuitive.

  So I want a session in which they build something, and the cost of the picture they have built shows up in the thing they built rather than in anything I say. The intended arc is this. First, under pressure from a case rather than from a definition, they should arrive at something recognisably perdurantist on their own: they posit different bits of the thing at different times, because that is the only way to stop the thing from being both bent and straight, or the only way to make sense of a thing that has a part at one time and not at another. Second, I want that home-made picture to be shown unstable, so that the natural repair pushes them toward a view I have been toying with and have never managed to get students to take seriously when it is stated on the page. Call it chunk perdurantism: a persisting thing does have temporal parts, but not arbitrary or instantaneous ones — its temporal parts are exactly the maximal intervals across which its intrinsic qualitative profile is constant, so that a thing is a finite train of homogeneous blocks rather than a continuum of slices, and each block can be bent, or straight, or four-legged, simpliciter. Third, I want the repair to fail on them in a way they can feel, and the failure I have in mind is continuous change: for something that is changing throughout — rotating, cooling, wearing down — there are no maximal intervals of qualitative constancy, so either the thing has no temporal parts at all or the grain of its articulation has to be fixed by something extrinsic to the thing, and every candidate they reach for will look arbitrary in a way they did not expect.

  I also want one diagnostic case built in somewhere, to be used at the point where I need each picture to commit itself: a ship dismantled at one time, its planks numbered and stored in a warehouse for a season during which nothing ship-shaped exists anywhere, then reassembled from the same planks in the same arrangement. Both perdurantist variants have a distinctive thing to say about it, and the endurantist alternatives have to choose between intermittent existence and a plain denial of identity. The activity should force that commitment to be made in public and in a form we can point at afterwards.

  What I need from you is a runnable design: the setup and materials, the rules or roles, a minute-by-minute timeline, and the exact instructions I give at each stage. Please keep it honest about the pedagogy. I want the students to do something — assemble, trade, bid, sort, commit to a written verdict — and to run into the problem before it is named; no lecture up front, no show-of-hands intuition polls, and the words endurantism, perdurantism and chunk perdurantism should not be uttered until the last ten minutes. The debrief should map specific moments in the session onto specific moves in the argument, including what each picture must say about the dismantled ship. Tell me what will predictably go wrong the first time I run it — the shortcuts students will take, the way a group will try to vote its way out, the version of the activity where everyone sees the trick in the first five minutes — and how to handle each. Finally, be frank about which part of the dispute the activity cannot stage and which I will have to supply in the debrief myself: I suspect the real cost of these views is metaphysical rather than bookkeeping, and that a game can only ever stage the bookkeeping. If you think part of my intended arc is a bad idea, say so and say what to put in its place.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergraduate metaphysics seminar, Week 4 of 6 on Persistence.
      *   **Class Size/Time:** 16 students, 75 minutes.
      *   **Resources:** Seminar room, whiteboard, movable chairs. No AV, no budget (print/carry only).
      *   **Current State:** Students know the arguments (temporary intrinsics, location, counting, Ship of Theseus) but find them notional/intuition-based. Nothing feels "at stake."
      *   **Goal:** A session where students *build* a model of persistence, encounter costs within the model, and are pushed toward a specific view ("Chunk Perdurantism") before seeing it fail on continuous change.
      *   **Specific Arc:**
          1.  Students arrive at standard Perdurantism (temporal parts) to solve a conflict (bent/straight).
          2.  Students find standard Perdurantism unstable/arbitrary.
          3.  Students repair it toward "Chunk Perdurantism" (maximal intervals of qualitative constancy).
          4.  Students encounter the failure of Chunk Perdurantism on *continuous change*.
          5.  Diagnostic Case: The Dismantled Ship (intermittent existence).
      *   **Constraints:** No lecture up front. No intuition polls. Do not use technical terms (endurantism, perdurantism, chunk perdurantism) until the last 10 mins. Students must *do* something (assemble, trade, bid, sort, commit).
      *   **Deliverables:** Runnable design (setup, materials, rules, timeline, instructions), prediction of failure modes, frank assessment of limitations.

  2.  **Deconstruct the Pedagogical Challenge:**

      *   *The Core Problem:* Metaphysics is abstract. To make it concrete without AV or props requires a simulation or a game structure.
      *   *The "Building" Aspect:* Students need to construct an ontology. Since they can't build physical objects that change over time in 75 minutes, they need to build *representations* of objects over time.
      *   *The "Cost":* The cost needs to be cognitive load, inconsistency, or arbitrariness in the representation.
      *   *The "Chunk" Idea:* This is the trickiest part. "Chunk Perdurantism" (temporal parts defined by qualitative homogeneity) is not a standard view (usually it's instantaneous slices or arbitrary intervals). The instructor wants to test this specific hypothesis. The activity needs to make "slicing" feel arbitrary and "chunking" feel natural, until continuous change breaks the chunking.
      *   *The Diagnostic Case:* The Dismantled Ship needs to be integrated into the activity, not just discussed.

  3.  **Develop the Activity Concept: "The Ontology Workshop"**

      *   *Idea:* Students act as "Ontological Engineers." They are given data about objects changing over time and must produce "Existence Certificates" that track what exists when.
      *   *Materials:* Paper strips (representing time), markers, sticky notes (representing objects/properties), a "Warehouse" box.
      *   *Mechanism:* They have to map properties to time intervals.
      *   *Phase 1 (Standard Perdurantism):* Give them an object that changes properties (Bent vs. Straight). If they say the *whole* object is there at *both* times with different properties, they create a contradiction on the paper. To fix it, they must split the object into time-stamped segments.
      *   *Phase 2 (Chunking):* Ask them to minimize the number of segments (efficiency cost?). If they slice every second, it's too much work. They naturally group stable periods.
      *   *Phase 3 (Continuous Change):* Introduce an object that changes *every* moment (e.g., cooling coffee). Grouping becomes impossible. Where do they cut?
      *   *Phase 4 (The Ship):* A gap in time. Do they draw a line through the gap?

  4.  **Refining the Activity for the Specific Arc:**

      *   *Critique of "Ontology Workshop":* It might feel too much like a logic puzzle. Needs more "building."
      *   *Alternative:* "The Persistence Ledger."
      *   *Better Idea:* **"The Temporal Assembly Line."**
      *   *Setup:* 4 Groups of 4 students.
      *   *Task:* Construct the "Life History" of specific objects using physical tokens.
      *   *Tokens:* Colored cards represent "Object Stages."
      *   *Constraint:* You cannot have a card that says "Bent" and "Straight" simultaneously.
      *   *Evolution:*
          1.  *Discrete Change:* Object is Straight (t1-t5), Bent (t6-t10). Easy.
          2.  *Continuous Change:* Object rotates 1 degree per minute. How many cards?
          3.  *The Gap:* Object exists t1-t5, Disassembled t6-t10, Exists t11-t15.

      *   *Wait, the "Chunk" view needs to emerge naturally.*
      *   *Modification:* Give them a "Cost" for every card they use. They want to minimize cards. This forces them to group stable periods (Chunks).
      *   *Continuous Change Breaker:* If change is constant, minimizing cards forces them to make arbitrary cuts.

  5.  **Drafting the Plan (Iterative Process):**

      *   *Materials:* Need time-lines printed on paper. Need property cards. Need "Identity Tokens."
      *   *Timeline:*
          *   0-10: Setup & Rules (No theory talk).
          *   10-25: Task 1 (Discrete Change). Forces splitting (Perdurantism).
          *   25-40: Task 2 (Efficiency/Chunking). Forces grouping (Chunk View).
          *   40-55: Task 3 (Continuous Change). Breaks the Chunk View.
          *   55-65: Task 4 (The Dismantled Ship). The Diagnostic Case.
          *   65-75: Debrief & Naming.

      *   *Refining Task 1:* To force perdurantism, present a contradiction. "Object O is at Location L at T1 (Straight) and T2 (Bent)." If they use one token for O, they have to write contradictory properties. If they use two tokens (O1, O2), they solve it but have to explain the relation.
      *   *Refining Task 2 (Chunking):* Introduce a "Tax." Each token costs $100 (fake money or just points). They must cover the timeline accurately but spend as little as possible. This incentivizes "Maximal Intervals of Constancy."
      *   *Refining Task 3 (Continuous):* The object changes color gradient or angle continuously. No interval is constant. The "Tax" forces them to cut anyway. The cut is arbitrary.
      *   *Refining Task 4 (Ship):* A gap in the timeline. Do they pay for tokens in the gap?

  6.  **Addressing the "Chunk Perdurantism" Specifics:**

      *   The instructor calls this "Chunk Perdurantism." It's essentially a version of *phase sortalism* or *homeomerous* parts, but temporal.
      *   *Critical Check:* Will students actually jump to this? If I impose a cost on the number of segments, yes, they will try to make segments as long as possible.
      *   *The Failure:* Continuous change means no segment can be "qualitatively constant." They must either admit no segments exist (no object persists) or cut arbitrarily.

  7.  **Addressing the Diagnostic Case (Dismantled Ship):**

      *   This needs to be the "Boss Battle."
      *   Scenario: Planks exist in a warehouse. No ship. Then reassembled.
      *   Perdurantist (Standard): The ship is a spacetime worm with a gap? Or two worms?
      *   Chunk Perdurantist: If the "qualitative profile" of being a ship is absent, the chunk ends. So it's two ships.
      *   Endurantist: One ship that goes out of existence and comes back.
      *   *Integration:* Make this Task 4. Give them the "Ship" tokens. Ask them to build the ledger.

  8.  **Anticipating Failure Modes:**

      *   *Voting:* Groups might just agree to disagree. *Fix:* Require a single physical submission per group.
      *   *Cheating:* Ignoring the rules to avoid the problem. *Fix:* Walk around and audit.
      *   *Seeing the Trick:* Smart students might guess the theory. *Fix:* Keep instructions procedural ("Minimize cost"), not theoretical ("Solve persistence").
      *   *The "Chunk" idea:* Students might not see the arbitrariness of the cut in continuous change. *Fix:* In debrief, compare two groups' cut points.

  9.  **Finalizing the Design:**

      *   *Name:* "The Spacetime Ledger."
      *   *Materials:* Printed timelines, colored stickers (properties), scissors (to cut time), tape.
      *   *Instructions:* Precise script needed.
      *   *Debrief:* Map the "Cost" to "Ontological Commitment." Map the "Arbitrary Cut" to "The Problem of the Continuum."

  10. **Review against Constraints:**
      *   No AV? Yes.
      *   No technical terms until end? Yes.
      *   Students build something? Yes (the Ledgers).
      *   Diagnostic case included? Yes.
      *   Frank assessment? Yes.

  11. **Self-Correction on "Chunk Perdurantism":**
      *   I need to be careful not to validate a view that might be philosophically weak without the instructor's specific framing. The prompt asks me to help them *take it seriously* then *feel it fail*.
      *   I need to ensure the "Cost" mechanic specifically rewards *qualitative constancy* grouping, not just arbitrary grouping.
      *   *Adjustment:* The rule should be: "A single token cannot bear incompatible properties." This forces splitting on change. The "Cost" forces them to make the tokens as big as possible. This naturally creates "Chunks of Constancy."

  12. **Writing the Response:**
      *   Structure: Materials, Room Setup, The Narrative Arc, Minute-by-Minute, Scripts, Failure Modes, Limitations.
      *   Tone: Professional, pedagogical, frank.

      *(Self-Correction during drafting)*: Make sure the "Dismantled Ship" isn't just an add-on. It needs to test the *identity* across the gap. In the Ledger, does the line continue through the gap?
      *   *Perdurantist:* The worm is gappy? Or two worms?
      *   *Chunk:* If "ship qualities" are missing, the chunk breaks.
      *   *Endurantist:* The *same* object is absent then present.
      *   *Activity:* Give them a "Gap" section on the timeline. Ask: "Does the Object Token cover the gap?"

      *(Final Polish)*: Ensure the instructions for the "Continuous Change" phase are vivid. A cooling cup of coffee or a rotating dial. Let's go with a rotating dial (easier to represent on paper).

      *(Limitations)*: Acknowledge that this stages *individuation* and *counting*, not the deep metaphysical *nature* of time itself. The "cost" is artificial.

      *(Ready to write)*.

      *Wait, one more check on the "Chunk" view.* The prompt says: "temporal parts are exactly the maximal intervals across which its intrinsic qualitative profile is constant."
      *   If I impose a cost per part, they will try to make parts maximal.
      *   If I enforce the rule "No incompatible properties on one part," they must break on change.
      *   Combined: They *must* create maximal intervals of constancy. This perfectly simulates the view.
      *   Then Continuous Change makes "constancy" impossible. Perfect.

      *Let's build the plan.*
answer: |-
  Here is a runnable design for the session. It is built to be low-tech, high-friction, and procedurally driven. The students will not be discussing metaphysics; they will be managing inventory under constraints. The metaphysics emerges from the friction of the rules.

  ### Session Title: The Spacetime Ledger

  **Materials Required (Print & Carry):**
  1.  **Timeline Sheets (16):** A3 paper, printed with a horizontal line marked $t_0$ to $t_{100}$.
  2.  **Property Stickers (approx. 200):** Small colored dots.
      *   Red = "Bent / Hot / 0°"
      *   Blue = "Straight / Cold / 90°"
      *   Green = "Ship-Shape"
      *   Yellow = "Disassembled / Heap"
      *   *Crucial:* Some stickers are "Gradient" (fading from Red to Blue).
  3.  **Identity Tokens (64):** Small rectangular cards. Students write an ID number on them (e.g., "Obj-1").
  4.  **Scissors & Tape (4 sets):** For cutting and joining tokens.
  5.  **The "Tax" Sheet (1 per group):** A simple invoice form.
  6.  **The Warehouse Box:** A literal cardboard box or envelope labeled "Storage."

  **Room Setup:**
  *   Four tables of four students each.
  *   Whiteboard divided into four quadrants, one for each group to post their final Ledger.
  *   No chairs facing the front; all face inward to tables.

  ---

  ### The Narrative Arc (Instructor Notes Only)
  *Do not share this with students.*
  1.  **Phase 1 (Discrete Change):** Rules force them to split objects when properties conflict. (Simulates standard Perdurantism).
  2.  **Phase 2 (Efficiency):** A "tax" is introduced per token. They minimize tokens by grouping stable periods. (Simulates Chunk Perdurantism).
  3.  **Phase 3 (Continuity):** An object changes constantly. Grouping becomes impossible; cuts become arbitrary. (Breaks Chunk Perdurantism).
  4.  **Phase 4 (The Gap):** The Dismantled Ship. They must decide if the token bridges the gap. (Diagnostic Case).
  5.  **Debrief:** Map the "Tax" to ontological parsimony, the "Split" to temporal parts, and the "Gap" to intermittent existence. Reveal the -isms.

  ---

  ### Minute-by-Minute Timeline

  #### 00:00 – 00:10: Setup & Rules (The "Contract")
  *   **Action:** Distribute materials. One Timeline, one pack of Tokens, one pack of Stickers per group.
  *   **Script:** "You are auditors for the Department of Existence. Your job is to produce a Ledger for the objects I describe. There are three rules.
      1.  **Coverage:** Every moment on the timeline must be covered by exactly one Identity Token for the object in question.
      2.  **Consistency:** A single Identity Token cannot hold incompatible Property Stickers. (You cannot tape a 'Bent' and a 'Straight' sticker to the same card).
      3.  **Cost:** Every Identity Token you use costs you 10 points. Your goal is to complete the Ledger with the lowest score possible.
      *   If you break a rule, your Ledger is rejected. If you tie on score, the Ledger with fewer cuts wins.*
  *   **Pedagogy:** Rule 2 forces segmentation (Perdurantism). Rule 3 forces maximization (Chunking).

  #### 00:10 – 00:25: Task 1 – The Bent Rod (Discrete Change)
  *   **Case:** "Object A exists from $t_0$ to $t_{100}$. From $t_0$ to $t_{50}$ it is Straight (Blue). From $t_{51}$ to $t_{100}$ it is Bent (Red)."
  *   **Instruction:** "Build the Ledger for Object A. Post it on the board."
  *   **Expected Outcome:** Students will try to use one token. They will realize they can't put Blue and Red on one card (Rule 2). They will cut the token in two: Token 1 ($t_0$-$t_{50}$), Token 2 ($t_{51}$-$t_{100}$).
  *   **Instructor Role:** Walk around. If a group tries to say "It's the same object, just change the sticker," point to Rule 2. "Does this card hold both stickers simultaneously?" If yes, reject it. They must use two cards.
  *   **Result:** They have built a temporal parts model without knowing it.

  #### 00:25 – 00:40: Task 2 – The Efficiency Audit (Chunking)
  *   **Instruction:** "We are tightening the budget. The cost per Token is now 50 points. Re-evaluate Object A. Can you do better? Now, consider Object B."
  *   **Case:** "Object B is Straight ($t_0$-$t_{20}$), Bent ($t_{21}$-$t_{40}$), Straight ($t_{41}$-$t_{60}$), Bent ($t_{61}$-$t_{80}$), Straight ($t_{81}$-$t_{100}$)."
  *   **The Trap:** Students might try to use 5 tokens.
  *   **The "Chunk" Push:** Ask: "Can you group any of these? Rule 2 says no incompatible properties on one token. But can one token cover $t_0$-$t_{20}$ and $t_{41}$-$t_{60}$ if they are both Straight?"
      *   *Correction:* No, because the timeline must be *continuous* for a token (implied by "Coverage"). A token represents a continuous stretch of existence.
      *   *Refinement for Chunking:* To push the "Chunk" view specifically, introduce **Object C**.
  *   **Case C:** "Object C is Warm ($t_0$-$t_{30}$), Hot ($t_{31}$-$t_{40}$), Warm ($t_{41}$-$t_{100}$)."
  *   **Instruction:** "Minimize your tokens. But remember Rule 2."
  *   **Expected Outcome:** They will create maximal blocks of qualitative constancy. They will resist slicing $t_0$-$t_{30}$ into smaller bits because that increases cost. They arrive at "Chunks."

  #### 00:40 – 00:55: Task 3 – The Cooling Coffee (Continuous Change)
  *   **Instruction:** "New Contract. Object D exists $t_0$ to $t_{100}$. It is cooling continuously. At every single moment, its temperature is different from the moment before."
  *   **Materials:** Give them the "Gradient" stickers (fading colors) or tell them verbally: "Incompatible property at every instant."
  *   **Constraint:** "Rule 2 still applies. A token cannot hold incompatible properties. Rule 3 still applies (minimize tokens)."
  *   **The Conflict:** If properties change at *every* instant, a "maximal interval of constancy" has duration zero.
      *   Option A: Infinite tokens (Bankruptcy).
      *   Option B: Arbitrary cuts. (e.g., "We'll call $t_0$-$t_{50}$ 'Hot' and $t_{51}$-$t_{100}$ 'Cold' even though it changed within those blocks.")
  *   **Instructor Action:** Force them to commit. "Where did you cut? Why there? If you cut at $t_{50}$, does the property actually change at $t_{50}$?"
  *   **Result:** They will feel the arbitrariness. The "Chunk" model breaks because there are no chunks.

  #### 00:55 – 01:05: Task 4 – The Dismantled Ship (The Diagnostic)
  *   **Instruction:** "Final Audit. Object E (The Ship)."
  *   **Case:** "Assembled ($t_0$-$t_{30}$). Dismantled, planks in warehouse ($t_{31}$-$t_{70}$). Reassembled ($t_{71}$-$t_{100}$)."
  *   **Materials:** Give them the "Warehouse Box."
  *   **Instruction:** "During the warehouse phase, no 'Ship-Shape' sticker applies. Only 'Heap' stickers apply. Build the Ledger."
  *   **The Commitment:**
      *   *Option 1:* One Token spanning $t_0$-$t_{100}$. (Requires ignoring the property change from Ship to Heap).
      *   *Option 2:* Two Tokens ($t_0$-$t_{30}$, $t_{71}$-$t_{100}$). The middle is empty. (Violates Coverage Rule unless they say the object doesn't exist then).
      *   *Option 3:* Three Tokens (Ship, Heap, Ship).
  *   **Action:** Have them tape their tokens to the board. Circle the gap.
  *   **Question:** "Is the Token at $t_{100}$ the *same token* as $t_0$? You cannot write the same ID number on two disconnected cards."
  *   **Result:** They must choose between Intermittent Existence (Gap in timeline) or Denial of Identity (Two ships).

  #### 01:05 – 01:15: Debrief & Naming
  *   **Action:** Bring class together. Point to the board.
  *   **Script:** "Look at Task 1. You split the object to avoid contradiction. In the literature, this is **Perdurantism** (Temporal Parts)."
  *   **Script:** "Look at Task 2. You tried to make the parts as big as possible based on qualities. This is a specific variant I call **Chunk Perdurantism**."
  *   **Script:** "Look at Task 3. Continuous change made your chunks arbitrary. This is the **Problem of the Continuum**."
  *   **Script:** "Look at Task 4. The Ship. If you used two tokens, you are a Perdurantist who accepts gappy existence or distinct objects. If you used one token across the gap, you are an **Endurantist** who accepts intermittent existence."
  *   **Closing:** "The cost you felt in points? That is ontological commitment. The arbitrariness you felt in Task 3? That is the metaphysical cost of realism about change."

  ---

  ### Predictable Failure Modes & Fixes

  **1. The "Semantic Cheat" (Task 1)**
  *   **Problem:** A group argues, "The *object* is the same, the *property* changes. We keep one token, just move the sticker."
  *   **Fix:** Enforce Rule 2 literally. "The token *is* the existence claim for that interval. If the token exists at $t_1$ and $t_2$, and holds 'Straight' and 'Bent', the token itself is contradictory. Cut the token."
  *   **Why:** This prevents them from slipping into Endurantism too early. They must feel the pressure to split.

  **2. The "Voting Out" (Task 3)**
  *   **Problem:** In the Continuous Change task, the group realizes there is no right answer and just votes "Cut at 50" to finish the game.
  *   **Fix:** During the walkthrough, ask: "Does the object actually change at $t_{50}$?" When they say "No, it changes everywhere," ask: "Then why is your cut there?" Make them write the justification on the token. "Arbitrary Budget Cut." This validates the feeling of arbitrariness rather than hiding it.

  **3. The "Gap Denial" (Task 4)**
  *   **Problem:** Students refuse to acknowledge the gap. They tape a token across the warehouse period and put a "Heap" sticker on it.
  *   **Fix:** "The prompt says 'Nothing ship-shaped exists.' A token with a 'Ship' ID cannot hold a 'Heap' sticker if the ID implies Ship-hood. If you keep the ID, you must leave the middle blank."
  *   **Why:** This forces the Intermittent Existence commitment.

  **4. Seeing the Trick**
  *   **Problem:** A philosophy major in the group realizes Task 1 is about temporal parts and tells everyone.
  *   **Fix:** The rules are procedural, not theoretical. If they say "Ah, we are making temporal parts," reply: "You are making Ledger Entries. Follow Rule 2." Keep the focus on the *cost* and the *rules*, not the *meaning*.

  ---

  ### Frank Assessment: What This Cannot Stage

  **1. The Nature of Time**
  This activity treats time as a static grid (the printed timeline). It cannot stage the debate over whether time is fundamental or derivative. The "Cost" is artificial (points), whereas the real metaphysical cost is explanatory power. You must supply this in the debrief: "The points represent theoretical complexity."

  **2. The "Wholly Present" Intuition**
  Endurantism's main selling point is that it matches our experience (the dog is *wholly* there). The Ledger activity makes everything look like segments. It biases heavily toward Perdurantism because the medium (paper tokens) is discrete.
  *   **Mitigation:** In the debrief, acknowledge this. "The Ledger forces segmentation. Endurantists argue the Ledger is the wrong tool for the job. But if you use the Ledger, these are the costs."

  **3. The "Chunk" View Viability**
  Be careful not to validate "Chunk Perdurantism" as a live option in the literature if it isn't one. You noted you want them to take it seriously *then* see it fail.
  *   **Risk:** Students might leave thinking "Chunk Perdurantism" is a standard solution.
  *   **Fix:** In the last 5 minutes, be explicit: "This view is attractive because it solves the arbitrariness of slicing. But Task 3 shows why most metaphysicians reject it. Continuous change is real. Therefore, either chunks don't exist, or properties are not as simple as stickers."

  **4. The Ship of Theseus Nuance**
  The Diagnostic Case here is the *Dismantled* Ship (gappy existence), not the *Replacement* Ship (gradual parts replacement). The activity handles the Gap well. It does not handle the Gradual Replacement well.
  *   **Fix:** If students ask about gradual replacement, park it. "That is the Sorites problem. Today we are looking at the Gap problem. Stick to the Ledger."

  ### Final Advice for the Instructor
  The success of this session depends on your refusal to interpret their actions for them until the end. When they struggle with Task 3, do not say "This is the problem of continuity." Say "Your score is high. Can you lower it without breaking Rule 2?" Let them feel the impossibility. The frustration *is* the lesson.
