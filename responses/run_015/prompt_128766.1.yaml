answer: |-
  ### Preamble: On Consensus and Contention

  Before listing the adequacy conditions, a clarification on the state of the field is necessary. There is **no settled consensus** on the correct decision rule for the cases you describe. The literature consists of competing research programs (primarily Causal Decision Theory, Evidential Decision Theory, and various Functional/Logical variants) that agree on the *format* of a decision rule but disagree on the *normative principles* that constrain it.

  Consequently, few requirements listed below are "non-negotiable" in the sense of being accepted by all competent theorists. Most are "camp-defining." I have marked status accordingly. Where I mark a requirement as "Non-negotiable," I mean it is required for the software to function as an *agent* (e.g., it must terminate), not that all philosophers agree it yields the *right* answer. Where I mark "Contested," I indicate a genuine dispute in the literature.

  Regarding your two novel cases: *The Open Loop* and *The Mixed Population* are not standard test cases in the published literature. My analysis of them below represents reasoning based on existing theoretical commitments rather than a report of established verdicts.

  ---

  ### Specification of Adequacy Conditions

  **1. Action-Orientation**
  *   **(i) Requirement:** The rule must take the agent's current epistemic state as input and output a specific, executable act (or a probability distribution over acts) within finite time.
  *   **(ii) Motivation:** The rule is for *ex ante* choice, not post-hoc grading. An agent that loops indefinitely or outputs a philosophical treatise fails its job.
  *   **(iii) Status:** **Non-negotiable.** (Functional requirement for software).

  **2. Causal Dominance Sensitivity**
  *   **(i) Requirement:** If act A yields a strictly better outcome than act B in every possible state of the world *causally independent* of the act, the rule must not recommend B.
  *   **(ii) Motivation:** The "Smoking Lesion" case (or similar). An act that is evidence of a bad state (e.g., a lesion causing both smoking and cancer) but does not cause the bad state should not be avoided solely for that evidence.
  *   **(iii) Status:** **Contested (Camp Preference).** CDT proponents view this as non-negotiable rationality. EDT/FDT proponents argue that in a world with predictors, causal independence is rarely guaranteed, making this principle misleading.

  **3. Predictive Richness (Newcomb Adequacy)**
  *   **(i) Requirement:** In a Newcomb setup with a highly reliable predictor, the rule must recommend the act associated with the higher payoff (typically "One-Boxing"), even if it violates Causal Dominance.
  *   **(ii) Motivation:** The Standard Newcomb Setup. An agent that Two-Boxes leaves money on the table. A rule that makes its user predictably poorer in this environment is defective.
  *   **(iii) Status:** **Contested (Camp Preference).** CDT proponents argue Two-Boxing is rational regardless of the payoff; FDT/EDT proponents argue that rationality entails winning.

  **4. Copy Coordination**
  *   **(i) Requirement:** When facing a near-exact copy of itself in a Prisoner's Dilemma (where the copy runs the same rule), the rule must recommend Cooperation.
  *   **(ii) Motivation:** The Copy Prisoner's Dilemma. Defection is a dominant strategy causally, but leads to mutual defection. If the agent recognizes the logical correlation between its output and the copy's, it should coordinate.
  *   **(iii) Status:** **Contested (Camp Preference).** CDT mandates Defection. FDT/TDT mandates Cooperation. This is a primary fault line between causal and logical decision theories.

  **5. Dynamic Consistency (No Regret)**
  *   **(i) Requirement:** Whichever act the agent settles on, it must not be the case that, given the information available at the time of choice, the agent can see that it would have done better to have settled on the other.
  *   **(ii) Motivation:** The "Instability" case. If a rule recommends an act, but the agent knows that *having been the kind of agent who chose the other act* would have yielded a better outcome (and the rule allows the agent to know this), the rule generates reflective instability.
  *   **(iii) Status:** **Contested.** CDT agents in Newcomb problems experience regret (they see the empty box and wish they had been One-Boxers). FDT proponents claim their rule eliminates this regret. Whether "regret" is a failure of the rule or a feature of the world is disputed.

  **6. Long-Run Instrumental Success**
  *   **(i) Requirement:** Across a long series of choices in varied environments, a user of this rule must not be predictably poorer (in terms of achieved utility) than a user of a competing rule, assuming comparable information.
  *   **(ii) Motivation:** The demand for a rule not to lead its user to be predictably poorer. This is the "Money Pump" or "Dutch Book" constraint generalized to decision rules.
  *   **(iii) Status:** **Broadly Accepted (but defined variably).** Everyone wants to win. The dispute is over *which* counterfactuals count toward "achievable" utility. (e.g., Is the money in the opaque box "achievable" for a Two-Boxer? CDT says no; FDT says yes).

  **7. Acyclic Representability (The Open Loop Constraint)**
  *   **(i) Requirement:** The rule must be able to process environments where the prediction is not a past fact screened off from the act, but a simultaneous simulation that updates on the agent's reaction to the simulation.
  *   **(ii) Motivation:** *The Open Loop.* If the rule requires a fixed, past prediction to function (as CDT often assumes), it cannot handle real-time logical feedback loops. The rule must either solve for a fixed point in the simulation or recognize the loop as a causal impossibility.
  *   **(iii) Status:** **Contested (Structural Requirement).** Standard CDT assumes an acyclic causal graph. FDT/TDT allows for logical loops. If you require acyclic causality, you exclude FDT. If you allow loops, you risk paradox. *Note: This requirement is not standard in the literature; it is derived here from your case description.*

  **8. Type-Robustness (The Mixed Population Constraint)**
  *   **(i) Requirement:** The rule's recommendation should not depend on facts about the agent's predictability that the agent cannot in principle know (e.g., whether it is in the "predictable" or "unpredictable" half of the population), unless those facts change the causal structure of the payoff.
  *   **(ii) Motivation:** *The Mixed Population.* If the rule says "One-Box" only when you *know* you are predictable, it fails in the mixed case where you don't know. If it says "One-Box" always, it may lose in the unpredictable half (where dominance applies). The rule must handle indexical uncertainty about its own nature.
  *   **(iii) Status:** **Contested (Novel Requirement).** Standard theory assumes the agent knows the problem structure. This case forces the rule to decide under uncertainty about *which decision problem it is facing*.
  *   **(iii) Clarification:** It is **not** a requirement that the rule recommend the same act to an agent who knows it is predictable and one who knows it is not. (If I know I am unpredictable, Newcomb collapses to Dominance). The requirement is that the rule must provide a *policy* for handling the uncertainty, not that it ignore the uncertainty.

  **9. Procedure Transparency**
  *   **(i) Requirement:** The rule must be able to distinguish between the act performed, the disposition to perform it, and the algorithm that produced it, and specify which of these is the target of prediction.
  *   **(ii) Motivation:** Predictors may predict your disposition rather than your specific act (e.g., they simulate your source code, not your runtime). A rule that collapses these distinctions cannot explain why it wins in Copy PD cases.
  *   **(iii) Status:** **Non-negotiable (for specification).** To write the spec, you must define the object of evaluation. However, whether the rule *acts* on the act or the procedure is a camp preference (CDT acts on Act; FDT acts on Procedure).

  **10. Computational Tractability**
  *   **(i) Requirement:** The rule must not require the agent to simulate itself (or a predictor simulating it) to a depth that causes infinite regress or resource exhaustion.
  *   **(ii) Motivation:** *The Open Loop* and self-referential cases. If the rule says "Do the opposite of what the simulation shows," and the simulation shows that, the agent crashes.
  *   **(iii) Status:** **Non-negotiable (Engineering).** A software agent that halts due to stack overflow fails its job.

  ---

  ### Distinctions: Act, Disposition, and Procedure

  A rule satisfying this specification must be able to mark the following distinctions, though it may choose to collapse them operationally:

  1.  **The Act:** The specific physical output at time *t* (e.g., "Press Button A").
  2.  **The Disposition:** The counterfactual profile of the agent (e.g., "Would Press A if shown X, Would Press B if shown Y").
  3.  **The Procedure:** The algorithm or source code that generates the Act from the Disposition and Input.

  *   **CDT** collapses Disposition and Procedure, focusing entirely on the **Act**. It asks, "Given I am here now, what act causes the best outcome?"
  *   **FDT/TDT** collapses Act and Procedure, focusing on the **Output of the Procedure**. It asks, "What output from this algorithm yields the best logical consequences?"
  *   **Specification Requirement:** Your spec must allow the rule to identify *what is being predicted*. If the predictor predicts the **Procedure**, a rule that optimizes only the **Act** (CDT) will fail. If the predictor predicts the **Act** based on past history, a rule that optimizes the **Procedure** (FDT) may be over-complex.
  *   **Recommendation:** The specification should require the rule to accept a parameter defining the *Target of Prediction* (Act vs. Procedure). Collapsing them a priori limits the agent's applicability.

  ---

  ### Incompatibilities and Trade-Offs

  There is a known incompatibility between **Causal Dominance (Req 2)** and **Predictive Richness (Req 3)**. You cannot satisfy both in the Standard Newcomb Setup.

  *   **The Conflict:** In Newcomb, One-Boxing dominates in terms of *outcome* (you get $1M vs $1k), but Two-Boxing dominates in terms of *causal consequence* (given the box contents are fixed, taking both adds $1k).
  *   **The Trade-Off:** You must choose whether the rule prioritizes *causal efficacy* (CDT) or *outcome optimization* (FDT/EDT).
  *   **Which to Give Up:**
      *   If you prioritize **Causal Dominance**, you accept that your agent will be poorer in Newcomb-like environments. You gain robustness against "bad news" evidence (Smoking Lesion).
      *   If you prioritize **Predictive Richness**, you accept that your agent may violate causal dominance. You gain wealth in predictive environments but risk "managing the news" in evidential ones.
  *   **My Judgment on Exclusion:** The requirement that excludes the most otherwise-attractive candidate rules is **Requirement 4 (Copy Coordination)**. Standard CDT and EDT both fail here. Only Functional/Logical variants (FDT/TDT) satisfy it. If you require Cooperation with copies, you effectively rule out standard CDT/EDT.
  *   **My Judgment on Camp-Signaling:** The requirement most often insisted upon but which registers only a camp refusal is **Requirement 2 (Causal Dominance Sensitivity)**. CDT proponents insist on it as a definition of rationality. FDT proponents argue it is a heuristic that fails in a universe containing predictors. Insisting on it as "Non-negotiable" is equivalent to stipulating that CDT is correct.

  ---

  ### Scorecard of Candidate Rules

  **1. Evidential Decision Theory (EDT)**
  *   **Performance:** Satisfies Predictive Richness (Newcomb) and Long-Run Success in predictive environments. Fails Causal Dominance (Smoking Lesion).
  *   **Against the List:** Fails Req 2 (Causal Dominance). Struggles with Req 7 (Open Loop) as it treats correlation as evidence without a model of the logical mechanism. In Mixed Population (Req 8), it may recommend acts based on spurious self-evidence if the agent cannot distinguish correlation from causation.
  *   **Verdict:** High risk of "managing the news" rather than making it.

  **2. Causal Decision Theory (CDT)**
  *   **Performance:** Satisfies Causal Dominance (Smoking Lesion). Fails Predictive Richness (Newcomb) and Copy Coordination.
  *   **Against the List:** Fails Req 3 (Newcomb) and Req 4 (Copy PD). Violates Req 6 (Long-Run Success) in environments with predictors. Fails Req 7 (Open Loop) because it assumes predictions are screened-off past facts.
  *   **Verdict:** Robust against bad evidence, but predictably poorer in multi-agent/simulated environments.

  **3. Functional Decision Theory (FDT) / Timeless Decision Theory (TDT)**
  *   **Performance:** Satisfies Predictive Richness, Copy Coordination, and Long-Run Success. Violates Causal Dominance.
  *   **Against the List:** Satisfies Req 3, 4, 6. Handles Req 7 (Open Loop) best, as it treats the simulation as a logical function of the same source code. Handles Req 8 (Mixed Population) by evaluating the expected utility of the *policy* across both populations.
  *   **Verdict:** Best fit for your specification *if* you prioritize winning over causal purity. However, it is less formally settled than CDT/EDT (Req 1 and 10 are harder to guarantee due to halting problems in logical counterfactuals).

  ---

  ### Settled vs. Contested: A Final Note

  **Settled:**
  *   Decision rules must be action-guiding (Req 1).
  *   Decision rules must avoid sure-loss money pumps in *repeated* games where the agent learns (part of Req 6).
  *   The distinction between Act, Disposition, and Procedure is conceptually necessary (Req 9).

  **Contested:**
  *   **Newcomb's Problem:** There is no majority verdict on whether One-Boxing or Two-Boxing is rational. It is a stalemate between "Rationality as Winning" vs. "Rationality as Causal Efficacy."
  *   **The Open Loop:** This is not a standard case. It is effectively a "Transparent Newcomb" with feedback. Whether this is a coherent problem or a paradox depends on your theory of logical counterfactuals.
  *   **The Mixed Population:** This touches on *indexical uncertainty* (Self-Locating Belief). There is no consensus on how to weight probabilities when you don't know your own type (e.g., the "Sleeping Beauty" problem analogues).
  *   **Regret:** Whether an agent *should* feel regret in Newcomb (after Two-Boxing and seeing the empty box) is disputed. CDT says "No, you did the right thing." FDT says "Yes, you used the wrong rule."

  **Recommendation:** If your agent is software operating in a world with other software agents and simulators, **Predictive Richness (Req 3)** and **Copy Coordination (Req 4)** are practically non-negotiable for performance, even if philosophically contested. A CDT agent will be exploited by FDT agents in these environments. Therefore, your specification should prioritize Req 3 and 4, acknowledging that this commits you to a non-causal (logical/functional) decision framework.
