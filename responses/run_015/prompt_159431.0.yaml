          *   Argument: Anchoring isn't enough (photos/hair don't raise the paradox). Reciprocity (talking back) is key. This mimics the paradox (responding to apparent agency of non-agent). Real effects (grieving) don't change the metaphysics of the emotion (horror film analogy).
          *   Critique: Strong on the "reciprocity/agency" point. The horror film analogy is good for distinguishing *effects* from *intentional objects*. Weakness: Dismissing the "real object" (the dead person) too quickly? But his point is about the *interaction*.

      *   **Move 3 (Iris):** *Splitting Claim.*
          *   Argument: Photo vs. Letter analogy. Sim = elaborate letter. Reciprocity splits the emotion: part make-believe (sim's replies), part ordinary (client's acts/dead person). Literature fused these wrongly.
