  7.  **Final Polish:** Check tone (adjudicatory, philosophical, precise). Ensure no citations. Ensure all constraints are met. (Self-Correction: Make sure the ratings are clear, e.g., "Mostly Right" etc., and the missing element is distinct from their arguments.)

