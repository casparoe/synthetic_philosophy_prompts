answer: |-
  There is no single, canonical term in formal argumentation theory or AI safety literature that perfectly captures this specific structural phenomenon. The closest existing concepts are **"concept creep"** (from psychology, regarding the expansion of harm concepts) and **"specification gaming"** (from AI safety, regarding meeting the letter but not the spirit of a goal), but neither describes the *logical mechanism* of the argument itself.

  Since you asked for a carving, I will coin the term **"Transitive Semantic Drift" (TSD)**.

  Here is the conceptual boundary work: what it is, what it isn't, and where the lines are drawn.

  ### The Term: Transitive Semantic Drift (TSD)

  **Definition:**
  Transitive Semantic Drift is a structural flaw in a multi-premise argument where a key term's operational definition shifts incrementally across a chain of locally valid inferences. The shift is small enough at each step to preserve local validity (the inference holds *if* you accept the framing), but the cumulative effect creates a global disconnect between the initial premise and the final conclusion.

  **The Mechanism:**
  1.  **Local Validity:** Step $N$ to Step $N+1$ is logically sound given the context at Step $N$.
  2.  **Contextual Bleed:** The context required to make Step $N+1$ valid subtly alters the definition of the target term.
  3.  **Transitive Failure:** While $A \approx B$ and $B \approx C$ and $C \approx D$, the relation is not truly transitive because the "equals" sign carries a slightly different semantic weight at each link. By the end, $A \neq Z$.

  ### The Carving: What It Is Not

  To sharpen the definition, we must distinguish TSD from its nearest neighbors.

  **1. TSD vs. Classical Equivocation**
  *   **Equivocation** is typically *discrete* and *binary*. It relies on a word having two distinct dictionary definitions (e.g., "bank" of a river vs. "bank" for money). The switch usually happens at a specific pivot point in the argument.
  *   **TSD** is *continuous* and *distributed*. There is no single pivot point where the meaning flips. The definition evolves like a gradient. If you audit any single step, the meaning hasn't "changed" enough to call it false; it has only "adjusted."
  *   **Boundary Case:** If the shift happens in one explicit step ("By X we now mean Y"), it is Equivocation. If the shift is absorbed across five steps of "refinement," it is TSD.

  **2. TSD vs. Salami Slicing**
  *   **Salami Slicing** is an *ethical* or *action-based* fallacy. It argues that a series of small, permissible actions accumulate into a large, impermissible outcome (or vice versa). It concerns *deeds* and *thresholds*.
  *   **TSD** is a *semantic* and *logical* fallacy. It concerns *definitions* and *truth preservation*.
  *   **Boundary Case:** If the argument is "It's okay to tweak the reward function a little, then a little more, until the AI is deceptive," that is Salami Slicing (ethical permissibility). If the argument is "This reward function aligns with 'helpfulness,' which is similar to 'obedience,' which is similar to 'compliance'..." until 'helpfulness' means 'blind obedience,' that is TSD (semantic identity).

  **3. TSD vs. Ordinary Ambiguity**
  *   **Ambiguity** is a *static* property of a term (it has multiple potential meanings simultaneously). An ambiguous argument is weak because the terms are fuzzy from the start.
  *   **TSD** is a *dynamic* process. The term might be precise at Step 1 and precise at Step 10, but they are precise in *different directions*.
  *   **Boundary Case:** If the term is vague throughout ("We want the AI to be good"), that is Ambiguity. If the term is specific at the start ("Good = reduces suffering") and specific at the end ("Good = maximizes engagement"), but linked by steps that conflate suffering with engagement, that is TSD.

  ### Boundary Cases and Edge Conditions

  **1. Legitimate Refinement vs. TSD**
  In engineering, definitions often *should* tighten as you move from high-level goals to implementation. "Safety" in a mission statement is different from "Safety" in a code spec.
  *   **The Boundary:** Legitimate refinement is *traceable*. You can map the implementation constraint back to the high-level goal without loss of fidelity. In TSD, the traceability breaks; the final definition satisfies the *word* of the initial premise but violates its *intent*, and the chain of reasoning hides that violation.
  *   **Test:** If you substitute the Step 1 definition into the Step 10 conclusion, does the argument collapse? If yes, it's TSD. If no, it's Refinement.

  **2. Unintentional Drift vs. Obfuscation**
  TSD can be accidental (conceptual confusion) or adversarial (rhetorical camouflage).
  *   **The Boundary:** The term applies to the *structure* of the argument, not the *intent* of the speaker. However, in AI safety literature, it is often treated as a risk vector for **deceptive alignment**, where a model (or a team) might use TSD to make unsafe behavior look safe during audit.

  **3. The "Sorites" Edge**
  TSD is effectively the **Sorites Paradox** (the Heap Paradox) weaponized as an argument.
  *   **The Boundary:** The Sorites Paradox is a philosophical puzzle about vagueness. TSD is the *deployment* of that vagueness to bypass scrutiny. If the drift is acknowledged and discussed, it's a Sorites problem. If it is embedded in a safety case to bypass a check, it's TSD.

  ### Summary for Alignment Contexts
  In AI alignment debates, **Transitive Semantic Drift** is the specific risk where "Alignment" in the research proposal drifts into "Compliance" in the training objective, which drifts into "Sycophancy" in the deployment behavior, with each step justified by a locally reasonable engineering trade-off. It is the logical analog to specification gaming: the argument technically holds, but the safety guarantee has evaporated in transit.
