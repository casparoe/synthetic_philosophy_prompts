  ### Part 1: The Logical Space

  **The Branch Questions**
  *Note: Answer "Yes" or "No" to each. Do not skip.*

  1.  **Case 5 (Ontology):** When the traffic jam halts a car, is "the jam" a real thing doing the halting, or just a nickname for "cars close together"?
  2.  **Case 5 (Causation):** If the jam is real, does it add *new* causal power, or is the micro-story of brake-lights sufficient?
  3.  **Case 3 (Determination):** If two worlds are identical in every particle's position, *must* they have the same traffic jams?
  4.  **Case 4 (Derivation):** If you hold a complete math derivation of the jam from the car-rules, does the jam cease to be a distinct feature of the world?
  5.  **Case 1 (Multiple Realizability):** If the pattern appears in two simulations with totally different rules, is it the *same* property?
  6.  **Case 2 (Limits):** If a property only appears when parts are infinite, does it exist in our finite world?
  7.  **Case 4/7 (Explanation):** Even with the derivation, do you need the word "jam" to explain why the driver was late?

  **Combinatorics**
  With 7 binary questions, the logical space allows for **128 distinct answer-combinations** ($2^7$). Most of these are philosophically empty. Below are the 12 viable "leaves" where actual positions reside.

  ### Part 2: The Leaves (Viable Positions)

  | Leaf | Path (Q1–Q7) | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **N** / – / – / – / – / – / – | **Eliminativism** | You must insist that "traffic jams" no more exist than "witches" do, despite their predictive utility. |
  | **2** | **Y** / **Y** / **N** / – / – / – / – | **Strong Emergence** | You must accept that the micro-physical laws of the universe are incomplete and occasionally overridden. |
  | **3** | **Y** / **Y** / **Y** / **N** / – / – / – | **Non-reductive Physicalism** | You must claim the macro causes things without violating the rule that micro-physics is causally closed. |
  | **4** | **Y** / **N** / **Y** / **Y** / – / – / **N** | **Epiphenomenalism** | You must accept that your conscious experience of the jam is real but does absolutely nothing to stop the car. |
  | **5** | **Y** / **N** / **Y** / **N** / – / – / **Y** | **Computational Irreducibility** | You must claim the world is deterministic but fundamentally unpredictable without running the whole thing. |
  | **6** | **Y** / **N** / **Y** / **Y** / **Y** / – / **N** | **Functional Reduction** | You must accept that "jam" refers to a role, meaning a crowd of people and a cluster of cars can be the same thing. |
  | **7** | **Y** / **N** / **Y** / **Y** / – / – / **Y** | **Explanatory Emergence** | You must claim the derivation exists, but human minds are constitutionally unable to understand it without macro-terms. |
  | **8** | **Y** / **N** / **Y** / **Y** / **N** / – / **N** | **Type-Identity Reduction** | You must insist the pattern in Simulation B is *not* the same property as Simulation A, despite looking identical. |
  | **9** | **Y** / **N** / **Y** / **Y** / – / **Y** / – | **Unnamed (Limit Realist)** | You must claim properties that strictly require infinite parts exist in your finite car. |
  | **10** | **Y** / **N** / **Y** / **Y** / – / **N** / – | **Unnamed (Limit Fictionalist)** | You must claim phase transitions are strictly false in the real world, yet we use them to build real engines. |
  | **11** | **Y** / **Y** / **Y** / **Y** / – / – / – | **Unnamed (Overdeterminist)** | You must claim the jam and the cars *both* fully cause the stopping, doubling the causal work for no reason. |
  | **12** | **Y** / **N** / **N** / – / – / – / – | **Unnamed (Micro-Indeterminate)** | You must claim the jam is real and inert, yet the micro-particles don't actually fix which jam appears. |

  ### Part 3: Diagnosis of Unoccupied Combinations

  There are 116 unoccupied combinations in the 128-slot space. They are empty for three reasons:

  *   **Incoherent (approx. 60 combos):** Any path where Q1=No (Not Real) but Q2=Yes (Causal) or Q7=Yes (Explanatory Indispensability). *Diagnosis: You cannot claim something that doesn't exist causes things or explains things.*
  *   **Incoherent (approx. 20 combos):** Any path where Q3=No (Micro doesn't determine) but Q4=Yes (Derivation exists). *Diagnosis: You cannot claim a complete derivation exists for a macro-state that isn't fixed by the micro-state.*
  *   **Unattractive/Unexplored (approx. 36 combos):** Paths where Q2=Yes (New Causal Power) but Q3=Yes (Micro Determines). *Diagnosis: This posits "magic" causation that somehow respects physical closure; most philosophers abandon this for Strong Emergence (Q3=No) or Non-reductive Physicalism (Q2=No).*

  ### Part 4: Indistinguishable Leaves

  **Functional Reduction (Leaf 6)** and **Explanatory Emergence (Leaf 7)** are perilously close. Both accept the derivation (Q4=Yes) and micro-determination (Q3=Yes). They are separated only by Q7 (Is the macro-description indispensable?). In practice, a Functionalist might admit macro-terms are useful heuristics (Q7=Yes) without granting them ontological weight, collapsing into the Explanatory Emergentist. To truly separate them, you would need a **normative case**: *Does the macro-property define what the system **ought** to do (e.g., a heart failing to pump)?* Functionalists say yes (norms are real); Explanatory Emergentists typically say no (norms are human projections).

  ### Part 5: Case Diagnostic Analysis

  **Case 2 (The Infinite Limit)** turned out to be the least diagnostic for the general debate. While crucial for distinguishing Phase Transition Realists (Leaf 9) from Fictionalists (Leaf 10), it is largely orthogonal to the core tensions between Reductionism, Non-reductive Physicalism, and Strong Emergence in biology or social science. A student can answer "No" to Case 2 (finite systems don't have infinite properties) and still consistently hold any of the major positions (Leaves 3, 4, 6, 7). It isolates a specific subset of physics emergence but fails to filter the logical space of metaphysical emergence, making it a distractor in a general tutorial context.
