      *(Self-Correction during drafting)*: I initially thought about funding more historical data. I need to push back on that. The prompt asks if more coded history helps. The answer is likely "no, not for US forecasting." I need to emphasize *modern* data granularity over *ancient* data breadth.
      *(Self-Correction on Pre-registration)*: Pre-registering a macro prediction is easy to game (vague timelines). Pre-registering *parameter stability* is harder and more valuable. I will emphasize that.

  12. **Final Polish:** Check the "acting" section. It's crucial. If the model says "collapse," but the only action is "vote differently," it's useless. If it says "supply chain redundancy," it's useful. Distinguish between *political prevention* and *organizational resilience*.

      *(Final check on the "US 2020s" call)*: Turchin's call was based on structural-demographic theory (SDT). It was a "secular cycle" peak. It was partially right (unrest) but the *magnitude* wasn't civil war. I need to characterize this as a "directional hit, calibration miss."

      *Let's structure the response.*
      1. Executive Summary.
      2. The Validation Problem (N=12).
