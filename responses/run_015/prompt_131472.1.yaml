      *   Tone: Respectful, collegial, slightly witty.

  9.  *(Self-Correction on the "Virtual Particle" point)*: I need to be careful. Virtual particles *are* mathematical artifacts in perturbation theory. They don't appear in the asymptotic states. But they *do* account for the interaction terms in the Lagrangian. Qualia (1) don't appear in the Lagrangian at all. That's the distinction.

  10. *(Final check on Step 4)*: The user claims math beliefs are causally inert. But believing $2+2=4$ causes me to answer "4". The *belief state* is causal. The *truth* of the proposition is abstract. Qualia (1) are properties of the *experience itself*, claimed to be distinct from the brain state. So the disanalogy holds: Intentionality is a relation *of* the brain state; Qualia (1) are an extra property *alongside* the brain state.

  11. *Plan:*
