  DIRECTORATE OF NARRATIVE CONTINUITY
  Request for Proposals 24-09: The Inevitable Arc

  **1. Scope and Trajectory**
  The Directorate invites applications for a definitive single-volume survey history, working title *The Road We Were Always On*. The successful tenderer must demonstrate that the period covered constitutes not a sequence of events, but a line of causation terminating in the present administrative moment. Applicants are reminded that ancestry is to be offered in place of explanation; where a causal link cannot be established, the event shall be classified as noise. The narrative must proceed from primitive confusion to modern clarity without deviation. Any historical actor not contributing to this trajectory is to be categorized as an Obstruction. Per established guidance, Obstructions may be reduced to a dummy that acts as a better foil to the grand virtues of the Precursors. Complexity is not a finding; it is a failure of compression. Applicants must also modernize past actors so that they seem more contemporary than they were, ensuring their motivations align with current grant priorities.

  **2. Methodological Instruments**
  Proposals must operationalize the following metrics to ensure structural integrity:
  *   **The Arrival Coefficient (AC):** A quantitative measure of what share of the narrative can be plotted as leading directly to the present. Minimum acceptable AC: 0.85.
  *   **The Abridgement Dividend:** Pages saved by deleting dead ends, failed movements, and lost causes. High dividends indicate efficient stewardship of the past. The simplicity produced by compression is then to be reported as a discovery about the past, not a methodological artifact.
  *   **Licence for Retroactive Adoption:** Applicants must specify which contemporary values may be projected onto historical actors to secure their status as Precursors. This transfer of moral credit allows the present to inherit the authority of struggles most of its members would probably have lost.

  **3. Scoring Rubric**
  Proposals will be evaluated out of 100 points based on adherence to Whig structural norms:
  *   **Teleological Coherence (40 pts):** Does the history deliver a verdict? Narratives concluding in ambiguity, ongoing contingency, or unresolved conflict will be scored zero. The past must be resolved.
  *   **Efficiency of Lineage (30 pts):** Allocation based on the Abridgement Dividend. Applicants who retain sidelines that did not lead anywhere will be penalized for clutter.
  *   **Moral Clarity (20 pts):** Points awarded for clear differentiation between Friends and Enemies of Progress. Nuance regarding the Enemy's internal logic is considered sympathetic bias.
  *   **Presentist Alignment (10 pts):** Degree to which past actors resemble current committee members in outlook and priority.

  **4. Internal Review Note**
  During the pilot phase, the Keeper of Discontinued Pasts objected: "The archive itself was curated by the winners. A selection rule that keeps only what leads somewhere cannot then discover that the past was simple. We are ratifying the curation, not uncovering truth." The Directorate acknowledges this comment but finds it operationally unworkable for survey production. The objection confuses historical reality with narrative utility.

  **5. Compliance Appendix: Declinists and Debunkers**
  Applicants proposing a narrative of decline (the sign flipped) or exposure (the debunking narrative) must note that these forms remain teleological. The Declinist must identify a specific Golden Age from which we have fallen; the Debunker must arrive at a hero who sees through the deception. Both must deliver a verdict. If your narrative does not arrive at *someone's* present, it is ineligible. Please note that most of the world's pasts are therefore classifiable as sidings; only the lineage leading to this Commission's jurisdiction qualifies as the Main Line.

  **6. Notes to Applicants (FAQ)**
  *   **Q: What if the primary sources suggest contingency?**
      A: Contingency is a risk factor. Applicants are encouraged to treat contingency as a temporary lack of data rather than an ontological condition.
  *   **Q: Can we acknowledge that some things have actually improved?**
      A: The Directorate does not dispute improvement. The target is the ratifying structure, not optimism. However, improvement must be framed as inevitable rather than contingent.
  *   **Q: Is it permissible to highlight voices that lost?**
      A: Only if their loss serves to highlight the necessity of the winner's triumph. Otherwise, they are noise.
  *   **Q: Who owns the moral authority generated?**
      A: The present inherits it. This is non-negotiable.

  **7. Authorization**
  This Request for Proposals is issued under the authority of the Panel Chair. Applications submitting to the logic of contingency will be returned unread.

  **Dr. Alistair Forward**
  **Panel Chair, Directorate of Narrative Continuity**
