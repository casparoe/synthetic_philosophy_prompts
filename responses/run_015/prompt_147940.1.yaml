answer: |-
  ### The reconstructed theory

  The implicit theory is a fractured hybrid of three conflicting ontologies regarding human time. First, it treats leisure as a negative liberty: a sphere of non-domination where capital's authority terminates, evident in hard hour caps and disconnect rights. Here, time is sovereign space protected from intrusion, defining the worker as a citizen with boundaries. Second, it operates on a biopolitical utilitarianism: rest is merely the recovery period necessary to sustain labor-power, visible in karoshi thresholds that medicalize exhaustion rather than criminalizing exploitation. Harm is not a rights violation but a statistical deviation from physiological norms, defining the worker as a biological machine. Third, it assumes a libertarian commodification: leisure is alienable property that can be traded for income via waivers. This clashes with a submerged Protestant ethic that frames idle time as moral laziness, undermining the legal protection of rest even where statutes exist. Consequently, the law presupposes workers are simultaneously sovereign citizens entitled to freedom, biological machines requiring maintenance, and rational agents capable of selling their health. There is no unified ontology of time; it is alternately sacred, mechanical, and monetary. The state acts as both guardian of health and facilitator of markets, refusing to adjudicate between the worker-as-human and the worker-as-input. This triangulation allows the system to claim moral high ground while permitting the very behaviors it ostensibly condemns, relying on the worker to navigate the contradictions between statutory rights and cultural imperatives without resolving the underlying philosophical conflict.

  ### Coherence and tension

  These components rely on rival, incompatible anthropologies rather than a consistent view. The negative liberty model demands rest be inalienable to preserve autonomy; the waiver model treats it as alienable to preserve contract freedom. You cannot logically hold that leisure is a fundamental right protecting human dignity while simultaneously allowing it to be bargained away for a premium. Furthermore, the karoshi threshold logic introduces a probabilistic view of harm that clashes with the intentionalist framing of labor contracts. Contracts assume voluntary exchange; epidemiological thresholds assume cumulative biological damage independent of consent. This creates profound philosophical underdetermination: is overwork a tort based on harm or a breach of status based on rights? The system hedges by using rights language for publicity while using statistical causation for liability. This allows the state to claim moral protection without enforcing structural limits, leaving the worker suspended between being a rights-bearer and a risk-pool member. The tension is not accidental; it is functional ambiguity that permits exploitation while maintaining legitimacy. By keeping the theories distinct, the law avoids the logical conclusion of any single one, ensuring that neither full protection nor full market freedom ever fully obtains.

  ### Strict presupposition vs. compatibility

  The buyout option is strictly incompatible with leisure as an inalienable right. If rest protects human dignity or prevents domination, it cannot be sold without negating the protection's purpose. Compatibility exists only if leisure is redefined as instrumental recovery-time rather than intrinsic freedom. Similarly, the karoshi threshold necessarily presupposes a probabilistic, risk-curve view of harm. It rejects the deontological claim that excessive demand is inherently wrong, regardless of health outcome. Instead, it requires a causal link between specific hours and physiological failure. This shifts the burden from the employer's intent to the worker's biology. The system does not hold a consistent view; it opportunistically switches between deontological rights language and consequentialist risk management depending on whether the goal is legitimation or liability limitation.

  ### What unified reform looks like

  A genuinely unified policy must choose an ontology of labor. To align with human dignity, it would kill overtime exemptions and waivers entirely, treating leisure as non-instrumental negative liberty. Time off becomes a status condition of citizenship, not a negotiable contract term. Simultaneously, it must drop the statistical causation model for harm. Overwork should be treated as a structural violence regardless of specific medical outcomes, shifting liability from proving death to proving excessive demand. This requires redefining leisure not as recovery for labor-power, but as freedom from labor itself. The reform would decouple income from hours completely in the protected zone, making the right to disconnect absolute rather than compensable. Unity demands sacrificing contract freedom to secure human autonomy, recognizing that some things—like time itself—cannot be commodified without destroying the subject who sells them.
