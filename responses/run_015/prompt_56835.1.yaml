answer: |-
  The mechanic is a hard upper bound on the token values that renders the probability of doubling zero at the maximum value, contradicting the implicit uniform prior required for the 1.25 expected value calculation.

  ### Rules
  1.  **Objective:** Accumulate the highest total token value over 5 rounds. Top 3 portfolios receive bonus participation points; all others convert total tokens to standard participation credit.
  2.  **Setup:** Each student receives 5 sealed pairs of envelopes at the start. Do not open them until instructed.
  3.  **Play:** In each round, open one envelope from your current pair. Record the value ($A$). Decide whether to **Keep** or **Switch** to the unopened envelope. Reveal the second envelope. Record the final value.
  4.  **Betting:** Before Round 2, you must commit to a strategy based on expected value calculations. You may change strategies between rounds, but you must justify the change using the data on the board.
  5.  **Currency:** Tokens are slips of paper inside envelopes with values $\{2, 4, 8, 16, 32, 64\}$.

  ### Materials
  *   **120 Envelope Pairs:** Pre-filled by the Banker.
      *   **24 Pairs:** Contain tokens (32, 64). (Distributed one per student to guarantee exposure to the maximum).
      *   **96 Pairs:** Randomly drawn from remaining types: (2, 4), (4, 8), (8, 16), (16, 32).
  *   **Public Ledger:** Whiteboard divided into columns: *Amount Seen ($A$)*, *Times Switched*, *Average Gain/Loss*.
  *   **Student Sheets:** For recording round data and EV calculations.

  ### The Banker's Role
  *   **Identity:** The Instructor.
  *   **Knowledge:** You know the exact distribution of the 120 pairs. You know the maximum possible value in play is 64. You know the smaller amount in any pair is drawn from $\{2, 4, 8, 16, 32\}$ with uniform probability.
  *   **Action:** You do not reveal the distribution. You only update the Public Ledger with aggregated class data after each round. You answer rules questions but refuse to answer probability questions ("You have the data, calculate it").

  ### Timeline (75 Minutes)
  *   **00–10: Setup.** Distribute envelope kits. Explain token conversion. Emphasize silence during rounds.
  *   **10–20: Round 1 (Blind).** Students play intuitively. Banker aggregates data on the Ledger.
  *   **20–30: The Calculation.** Ask students to calculate $E[\text{Switch}]$ given observed amount $A$. Guide them to derive $0.5(2A) + 0.5(A/2) = 1.25A$. Class consensus should be "Always Switch."
  *   **30–60: Rounds 2–5 (Strategy).** Students play using the "Always Switch" strategy. Banker updates Ledger after each round, specifically highlighting rows for $A=32$ and $A=64$.
  *   **60–75: Debrief.** Reveal the distribution. Analyze the Ledger. Connect the failure at 64 to the philosophical problem.

  ### Debrief: Mapping Play to Paradox
  1.  **The Symmetry Break:** Point to the Ledger. For $A \in \{2, 4, 8, 16, 32\}$, the average gain from switching is positive (approx. 25%). For $A=64$, the average gain is negative (−50%). Ask: "Envelopes are symmetric physically; why is the expectation asymmetric?"
  2.  **The Smuggled Prior:** Walk through the 1.25A derivation. Highlight the assumption: $P(\text{other is } 2A) = P(\text{other is } A/2) = 0.5$.
  3.  **The Reveal:** Show the finite pot. When $A=64$, $P(\text{other is } 128) = 0$. The calculation fails because the students assumed a prior distribution that allows infinite doubling, but the game enforced a bounded prior.
  4.  **Philosophical Link:** Explain that the true Two-Envelope Paradox arises when we try to apply this 1.25 logic to an *unbounded* pot. Mathematically, no uniform prior exists over an infinite range. The game forces a boundary so you can see where the logic breaks; the paradox is what happens when you pretend that boundary doesn't exist.

  ### Predicted Failures & Mitigation
  *   **Failure:** Students do not encounter 64 frequently enough to see the trend.
      *   **Mitigation:** The kit construction guarantees every student gets exactly one (32, 64) pair. With 24 students, you will have 24 data points for the threshold value, ensuring statistical significance.
  *   **Failure:** Students collude and share envelope contents early, deducing the max value.
      *   **Mitigation:** Enforce strict "no sharing values" rules during play. Collect envelopes after each round if necessary, though kits are faster.
  *   **Failure:** Students calculate EV incorrectly (e.g., averaging 2A and A).
      *   **Mitigation:** Circulate during the 20–30 min block. Verify the 1.25A derivation on a few sheets before Round 2 begins.

  ### Limitation of the Bounded Pot
  This game cannot reproduce the **coherence** of the original paradox. In this bounded version, there is a correct answer (don't switch on 64), so it is merely a calculation error, not a paradox. The genuine philosophical paradox relies on the impossibility of defining a proper prior over an infinite range that satisfies the symmetry condition everywhere. You must supply this context yourself: explain that while the bounded pot *solves* the math, the paradox lives in the temptation to assume such a bound doesn't exist when dealing with unknown quantities in the real world.
