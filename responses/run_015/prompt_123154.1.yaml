prompt: |-
  Hey — I run a tiny type foundry with one other person, and our main product is crowdsourced handwriting fonts: contributors draw their letters on a tablet, we capture stroke order and direction, and we ship the result for embroidery machines, where each glyph has to be one continuous stitched path (our machines can't do a jump without a thread trim, which customers hate). So two different questions come up dozens of times a week and I need to stop answering them by gut: (1) is this thing an 'a' at all, and (2) is it an 'a' in *this* contributor's hand, given that we only ever see one or two exemplars of their 'a'. My cofounder thinks the bowl-plus-stem double-storey shape is what makes an a an a and that single-storey ones are just circles with a stick; I think the load-bearing part is more like the counter and the way the bottom-right terminal flicks off, and that stroke order matters more than the outline. We're not gonna settle that between us, so I want a procedure that either picks a side out loud or routes around the disagreement.

  What I need is a checklist a part-time contractor with no typography training can run in about two minutes per glyph, in a fixed order, ending in accept / reject / kick it to me. Say what counts as a sufficient answer at each step (the contractor shouldn't have to guess what "looks right" means), where to stop early with a no, and which steps are really judgment calls dressed up as tests — mark those as such. Also say plainly what the procedure can't do.

  Then run it on four cases:

  - a double-storey 'a' made one-stroke by doubling back over the bowl, so there's an overstitched segment
  - a single-storey 'a' submitted into a family where every other exemplar is double-storey
  - an 'a' whose bowl is barely closed and merges with the family's 'o' when it's stitched small, like left-chest-logo size
  - one that clears every test but is basically a traced Helvetica 'a': right letter, single path, nothing of that person's hand in it, and I want to reject it

  If your procedure accepts that last one, say so and tell me what I'd have to add to catch it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Tiny type foundry (2 people), crowdsourced handwriting fonts for embroidery machines.
      *   **Constraint:** Glyphs must be one continuous stitched path (no jumps/trims).
      *   **Problem:** Two recurring questions: (1) Is this an 'a'? (2) Is it *this* contributor's 'a' (consistency/authenticity)?
      *   **Conflict:** Founder A (cofounder) thinks double-storey (bowl+stem) is essential; single-storey is just a circle+stick. Founder B (user) thinks counter + terminal flick + stroke order is essential.
      *   **Goal:** A checklist for a part-time contractor (no typo training) to run in ~2 mins/glyph.
      *   **Output Requirements:** Fixed order, clear pass/fail criteria, stop-early conditions, mark "judgment calls," state limitations.
      *   **Test Cases:** Run the procedure on four specific scenarios.
      *   **Specific Constraint:** If the procedure accepts the "traced Helvetica" case, admit it and propose a fix.

  2.  **Deconstruct the Conflict & Constraints:**
      *   *Embroidery Constraint:* Single continuous path is non-negotiable. This inherently favors single-storey 'a's (easier to do in one stroke) but double-storey is possible if drawn without lifting (doubling back).
      *   *The "Is it an 'a'?" Debate:*
          *   Cofounder: Shape-focused (Double-storey = Real 'a').
          *   User: Gesture-focused (Counter + Terminal + Stroke Order).
          *   *Resolution Strategy:* Since I can't settle the debate, the procedure must accommodate *both* definitions as valid "a" shapes, provided they meet the technical embroidery constraints. The "Is it *this* contributor's 'a'?" question is the real filter for consistency.
      *   *Contractor Limitations:* No typography training. Needs binary or ternary (Yes/No/Maybe) decisions based on observable facts, not aesthetic intuition.
      *   *Time Limit:* 2 minutes. Needs to be snappy.

  3.  **Drafting the Procedure (The "Handoff Protocol"):**
      *   *Step 1: Technical Viability (The Embroidery Constraint).* If it can't be stitched, nothing else matters.
          *   Check: One continuous path? No lifts?
          *   Check: Over-stitching (doubling back). Is it excessive? (Thread bulk).
      *   *Step 2: Legibility/Identity (The "Is it an 'a'?" Question).*
          *   Need to bridge the Founder A vs. Founder B gap.
          *   Allow both single and double storey, *but* check for the "Counter" (User's point) and "Distinctness from 'o'" (Practical point).
      *   *Step 3: Consistency (The "Is it *their* 'a'?" Question).*
          *   Compare to other glyphs from the same contributor.
          *   Check stroke entry/exit points.
          *   Check slant/pressure (if visible in stroke data).
      *   *Step 4: Authenticity (The "Traced Font" Problem).*
          *   This is hard for a layperson. Need a heuristic. Wobbles? Imperfections?
      *   *Decision Matrix:* Accept, Reject, Kick to Founder.

      *Refining the Steps for the Contractor:*
      *   *Step 1 (Technical):* Path continuity. (Pass/Fail).
      *   *Step 2 (Shape):* Counter presence + Terminal. (Pass/Fail/Kick). *Address the Founder conflict here by accepting both shapes but requiring specific features.*
      *   *Step 3 (Family Fit):* Compare to 'o' and other 'a's from same user. (Pass/Fail/Kick).
      *   *Step 4 (Human Hand):* Look for "robotic" perfection. (Judgment Call).

      *Wait, I need to address the specific Founder Conflict explicitly in the procedure.*
      *   The procedure shouldn't take a side on Single vs. Double. It should treat them as *variants* but enforce the "Continuous Path" rule strictly.
      *   However, the prompt asks for a procedure that "either picks a side out loud or routes around the disagreement."
      *   *Decision:* Route around. Accept both shapes *if* they meet the functional criteria (counter, distinct from 'o'). This empowers the User's view (stroke/counter) without invalidating the Cofounder's preference (double-storey is fine too).

      *Refining the "Traced Helvetica" Catch:*
      *   A contractor can't easily spot a traced font unless they know Helvetica.
      *   Heuristic: Look for "perfect curves" vs. "jitter." Look for identical stroke width (embroidery varies).
      *   *Honesty:* I must admit if the procedure fails this.

  4.  **Developing the Checklist (Iterative Process):**

      *   *Header:* Time limit, Role.
      *   *Q1: The Stitch Test.* (Binary).
      *   *Q2: The 'o' Test.* (Crucial for embroidery small sizes).
      *   *Q3: The Counter Test.* (Bridges Founder A/B).
      *   *Q4: The Hand Test.* (Consistency).
      *   *Q5: The Soul Test.* (Authenticity - The weak point).

      *Let's make it stricter.*
      *   Stop early on Technical Fail.
      *   Mark Judgment Calls clearly.

  5.  **Running the Test Cases:**

      *   *Case 1: Double-storey, one-stroke (doubled back).*
          *   Tech: Pass (but note bulk).
          *   Shape: Pass (Double-storey satisfies Cofounder).
          *   Verdict: Accept (with note on thread bulk).
      *   *Case 2: Single-storey in Double-storey family.*
          *   Tech: Pass.
          *   Shape: Pass (User's view).
          *   Consistency: Fail/Kick. (Disrupts family uniformity).
          *   *Correction:* If the product is a "handwriting set," variation is okay. If it's a "font family," consistency matters. Prompt says "family where every other exemplar is double-storey." This implies a consistency issue.
      *   *Case 3: Bowl barely closed, merges with 'o' at small size.*
          *   Tech: Pass.
          *   Legibility: Fail. (Merges with 'o').
          *   Verdict: Reject.
      *   *Case 4: Traced Helvetica.*
          *   Tech: Pass.
          *   Shape: Pass.
          *   Consistency: Pass.
          *   Authenticity: *This is where it slips.* A contractor might not know Helvetica.
          *   Verdict: Accept (Procedure Failure).

  6.  **Refining the Output:**
      *   Tone: Professional, direct, operational.
      *   Structure: The Procedure first, then the Limitations, then the Test Cases.
      *   Addressing the Founder Conflict: The procedure will define an 'a' by *function* (counter + terminal) rather than *form* (single vs. double), effectively siding with the User but allowing the Cofounder's preference as a subset.
      *   Addressing the "Traced" failure: I need to be honest. If the procedure accepts it, I must state what to add (e.g., reference library check).

  7.  **Final Polish of the Checklist:**
      *   Make sure "Judgment Call" tags are visible.
      *   Ensure "Kick to Founder" triggers are clear.
      *   Ensure the "2-minute" constraint is respected (keep steps simple).

      *(Self-Correction during drafting)*: I need to make sure I don't solve the Founder dispute by just saying "both are fine." The prompt asks to "pick a side out loud or route around."
      *   *Routing Around:* Define 'a' by the *counter* (User's view) but acknowledge the *shape* (Cofounder's view) as secondary.
      *   *Actually, better:* Define 'a' by *distinctness from 'o'* and *presence of a terminal*. This validates the User's "terminal flick" theory while implicitly accepting double-storey (which has a terminal) and single-storey (which has a terminal).
      *   *Wait, the Cofounder thinks single-storey is a circle with a stick.* A circle with a stick *has* a terminal. So the definition "Closed Counter + Terminal" works for both.
      *   *Okay, the real conflict is:* Cofounder wants Double. User wants Single allowed.
      *   *Procedure Decision:* Allow both, BUT flag Single-storey for Founder Review if the Family Standard is Double. This routes around the disagreement by making it a "Family Consistency" issue rather than a "Is it an 'a'?" issue.

      *Wait, Case 4 (Helvetica)*: If the procedure accepts it, I need to say what to add.
      *   Addition: "Reverse Image Search" or "Reference Library Comparison." But that takes >2 mins.
      *   Addition: "Stroke Pressure Variance." Handwriting varies width/pressure; vectors/fonts are uniform. Embroidery data might show this.
      *   *Decision:* I will admit the procedure fails Case 4 and propose a "Reference Library" step that requires Founder intervention or a database.

  8.  **Final Review against constraints:**
