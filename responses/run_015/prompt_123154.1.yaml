      *Let's write it.*
answer: |-
  ## The "Stitch & Sign" Glyph Intake Protocol

  **Operator:** Part-time Contractor
  **Time Budget:** 2 minutes per glyph
  **Goal:** Filter technical failures and obvious legibility issues. Escalate aesthetic disputes.
  **Definition of 'a':** This protocol **routes around** the Founder/Cofounder disagreement. It defines an 'a' functionally (Counter + Terminal) rather than structurally (Single vs. Double). Both shapes are valid *if* they stitch cleanly and remain distinct from an 'o'.

  ### The Checklist

  **Step 1: The Continuous Path Test (Technical)**
  *   **Action:** Inspect the stroke data vector.
  *   **Criteria:** Does the path lift off the canvas at any point? Are there any "jump stitches" indicated in the metadata?
  *   **Pass:** Path is strictly continuous from start to finish.
  *   **Fail:** Path lifts or jumps.
  *   **Stop Condition:** If **Fail**, mark **REJECT**. Reason: "Multi-path." Do not proceed.
  *   **Note:** If the path doubles back over itself (overstitching) to achieve continuity, note the length of the overlap. If overlap > 30% of total stroke length, mark **KICK TO FOUNDER** (Thread bulk risk).

  **Step 2: The 'o' Separation Test (Legibility)**
  *   **Action:** Visually compare the submitted 'a' against the contributor's submitted 'o' (if available) or a standard embroidery 'o'.
  *   **Criteria:** At 1cm height (simulated), does the 'a' have a clear entry/exit point or terminal that the 'o' lacks?
  *   **Pass:** The 'a' has a distinct tail, flick, or open aperture that distinguishes it from a closed loop.
  *   **Fail:** The 'a' looks like a closed loop with no distinct terminal (looks identical to 'o' at small scale).
  *   **Stop Condition:** If **Fail**, mark **REJECT**. Reason: "Merges with 'o'." Do not proceed.
  *   **[JUDGMENT CALL]:** Determining "distinct enough" at small scale. If unsure, mark **KICK TO FOUNDER**.

  **Step 3: The Counter Test (Identity)**
  *   **Action:** Check the enclosed or partially enclosed space (the counter).
  *   **Criteria:** Is there a defined negative space inside the lower half of the glyph?
  *   **Pass:** Yes, there is a counter (whether single or double storey).
  *   **Fail:** No counter (e.g., a straight line, or a shape that doesn't enclose space).
  *   **Stop Condition:** If **Fail**, mark **REJECT**. Reason: "Not an 'a'."
  *   **Note:** This validates the User's theory (counter is load-bearing) without invalidating the Cofounder's preference (double-storey has a counter).

  **Step 4: The Hand Consistency Test (Authenticity)**
  *   **Action:** Compare stroke entry/exit angles and slant against 3 other letters from the *same* contributor.
  *   **Criteria:** Do the start/end points align with the writer's habitual angle? (e.g., if their 'd' starts high-left, does this 'a'?)
  *   **Pass:** Stroke dynamics match the contributor's other glyphs.
  *   **Fail:** Stroke dynamics are radically different (suggests a different writer or tool).
  *   **Stop Condition:** If **Fail**, mark **KICK TO FOUNDER**. Reason: "Inconsistent hand."
  *   **[JUDGMENT CALL]:** Requires looking at other glyphs. If contributor is new (no other glyphs), skip to Step 5.

  **Step 5: The "Too Perfect" Test (Tracing Filter)**
  *   **Action:** Zoom in on curves. Look for micro-jitter vs. mathematical smoothness.
  *   **Criteria:** Handwriting has wobble; vectors have perfect Bezier curves.
  *   **Pass:** Curves show slight irregularity or pressure variance in stroke width data.
  *   **Fail:** Curves are geometrically perfect; stroke width is absolutely uniform.
  *   **Stop Condition:** If **Fail**, mark **KICK TO FOUNDER**. Reason: "Suspected trace."
  *   **[JUDGMENT CALL]:** High risk of false positive. Many steady hands look perfect.

  **Final Decision Logic:**
  *   Any **REJECT** in Steps 1-3 = **REJECT**.
  *   Any **KICK** in Steps 1, 2, 4, 5 = **KICK TO FOUNDER**.
  *   All **PASS** = **ACCEPT**.

  ***

  ### Procedure Limitations (Read Before Starting)
  1.  **Cannot Detect Traced Fonts Reliably:** Step 5 is weak. A skilled tracer can add noise to fool Step 5. A steady hand can fail Step 5.
  2.  **Cannot Settle Aesthetic Disputes:** This procedure accepts both single and double-storey 'a's. It does not enforce the Cofounder's preference for double-storey, nor the User's preference for stroke-order priority, except where they overlap (Counter + Terminal).
  3.  **Blind to Family Cohesion:** It checks consistency within a *contributor's* hand, not consistency within the *font family* (e.g., mixing single and double storey in one product).

  ***

  ### Test Case Runs

  #### Case 1: Double-storey 'a', one-stroke (doubled back)
  *   **Step 1 (Path):** Pass (Continuous). *Note: Overlap exists.*
  *   **Step 2 ('o' Test):** Pass (Distinct terminal).
  *   **Step 3 (Counter):** Pass (Double-storey has counters).
  *   **Step 4 (Consistency):** Pass (Assuming match).
  *   **Step 5 (Perfect):** Pass (Hand-drawn wobble present).
  *   **Result:** **ACCEPT** (with note on overlap).
  *   **Analysis:** This satisfies the Cofounder's shape preference and the User's technical constraint. The overlap note triggers a Founder review only if the thread bulk is excessive (>30%), otherwise it ships.

  #### Case 2: Single-storey 'a' in a Double-storey Family
  *   **Step 1 (Path):** Pass.
  *   **Step 2 ('o' Test):** Pass.
  *   **Step 3 (Counter):** Pass (Single-storey has a counter).
  *   **Step 4 (Consistency):** Pass (It is their hand).
  *   **Step 5 (Perfect):** Pass.
  *   **Result:** **ACCEPT**.
  *   **Analysis:** **Procedure Failure regarding Product Vision.** The protocol validates the User's definition of 'a' (counter/terminal) but fails to catch the Cofounder's requirement for *Family Uniformity*. The contractor sees a valid 'a' from a valid hand. They do not know the product spec requires double-storey only.
  *   **Fix:** Add a "Family Spec" check at Step 0. If Product Spec = "Double Storey Only," single-storey is an automatic Reject/Kick.

  #### Case 3: Bowl barely closed, merges with 'o' at small size
  *   **Step 1 (Path):** Pass.
  *   **Step 2 ('o' Test):** **FAIL**.
  *   **Result:** **REJECT**.
  *   **Analysis:** The procedure catches this immediately. The "Distinct from 'o'" rule is the load-bearing legibility constraint for embroidery. This validates the User's focus on the terminal flick (which is missing here) without needing to argue about storeys.

  #### Case 4: Traced Helvetica 'a' (Right letter, single path, no hand)
  *   **Step 1 (Path):** Pass.
  *   **Step 2 ('o' Test):** Pass.
  *   **Step 3 (Counter):** Pass.
  *   **Step 4 (Consistency):** Pass (If they traced their other letters too).
  *   **Step 5 (Perfect):** **PASS** (False Negative).
  *   **Result:** **ACCEPT**.
  *   **Analysis:** **Procedure Failure regarding Authenticity.** A contractor cannot reliably distinguish a "steady hand" from a "traced vector" in 2 minutes without external reference. Step 5 is too subjective.

  ***

  ### How to Catch Case 4 (The Traced Font)
  Since the procedure above accepts the traced Helvetica, you need to add a **Reference Library Check** to Step 5.

  **Modified Step 5:**
  *   **Action:** Overlay the glyph against the "Banned Font Library" (Helvetica, Arial, etc.) and the "Contributor's Previous Submissions."
  *   **Criteria:** Does the vector match a commercial font outline with >90% overlap? OR Does the stroke width data show zero variance (embroidery thread naturally widens/narrows on curves; digital fonts do not)?
  *   **Tool:** Requires a script that measures stroke width variance, not just visual inspection.
  *   **Time Impact:** Increases time to 5 minutes.
  *   **Routing:** If variance is zero, **KICK TO FOUNDER**.

  **Recommendation:** Do not give the contractor the "Tracing" decision. It requires too much judgment. Change Step 5 to: *"Does the stroke width data show natural pressure variance?"* If the data says "Width: 100% uniform," mark **KICK TO FOUNDER**. Let you or your cofounder decide if it's a steady hand or a trace. This keeps the contractor on objective data (numbers) rather than subjective visuals (curves).
