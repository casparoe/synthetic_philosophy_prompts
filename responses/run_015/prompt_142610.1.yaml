      *   *Timing:* 90 mins.
      *   *0-20:* Break "Not Special". Use the "Server ID" intuition pump.
      *   *20-50:* Core Case (Server Farm). Derive the math. Name SSA/SIA.
      *   *50-65:* Misconceptions (Presumptuous Philosopher).
      *   *65-75:* Guarantee Test.
      *   *75-85:* Transfer Check (Agreement Case).
