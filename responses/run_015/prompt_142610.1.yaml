answer: |-
  Your instinct on the sequence is correct. If you name SSA and SIA in the first five minutes, the Doomsday veterans will treat the rest of the session as a defense of their existing tribal affiliation rather than a derivation of logic. You need to generate the *need* for the rules before you give them the *names*.

  Here is the battle plan for your ninety minutes.

  ### 1. The Sequence: Break, Build, Name
  **00:00 – 00:20: The Break (Intuition Reset)**
  Do not start with definitions. Start with the "I am not special" intuition and break it.
  *   **The Hook:** Ask them to write down their exact atomic configuration. Ask: "If the universe were twice as large, but contained exactly one copy of you, would you be surprised?" (No). "If it contained a billion copies of you, would you be surprised?" (Yes, but why? You still exist).
  *   **The Pivot:** Force them to articulate *why* the billion-copy world feels different. It feels more likely *to contain* you, but less likely that *this specific instance* is you.
  *   **The Goal:** By minute 20, they should feel a tension between "It's easier to find me in a small crowd" and "There are more tickets for me in a large crowd." Do not resolve this yet.

  **00:20 – 00:50: The Core Case (The Server Farm)**
  This is where you derive the rules without naming them.
  *   **The Setup:**
      *   **Hypothesis A:** A server farm runs **100** active processes.
      *   **Hypothesis B:** A server farm runs **100,000** active processes.
      *   **Prior:** A coin flip determines which farm exists (50/50).
      *   **Evidence:** You boot up. You are a process. You have no Process ID (PID) yet; you just know "I am running."
  *   **What stays fixed:** The **Non-Indexical Prior** (the 50/50 coin flip).
  *   **What varies:** The **Total Headcount** ($N$).
  *   **The Divergence:**
      *   *Rule 1 (SSA logic):* "I am a random sample from the processes." Probability of being *this* process is $1/N$. Likelihood ratio: $(1/100) / (1/100,000) = 1000:1$ favoring Small Farm.
      *   *Rule 2 (SIA logic):* "I exist." The chance of *someone* like me existing is proportional to $N$. Likelihood ratio: $100,000 / 100 = 1000:1$ favoring Big Farm.
  *   **The Naming:** Now, and only now, reveal that Rule 1 is the Self-Sampling Assumption (SSA) and Rule 2 is the Self-Indication Assumption (SIA).
  *   **What if you hold the wrong thing fixed?** If you fix the *probability of your existence* to 1 in both worlds (ignoring the sampling), you erase the anthropic update entirely. If you fix the *density* of observers, you collapse the problem into standard statistics. The divergence *requires* the Prior to be fixed while $N$ varies.

  **00:50 – 01:05: Misconception Killing**
  Address these immediately after naming, while the math is fresh.
  1.  **"SIA is just Bayes with extra steps":** Kill this first. SIA modifies the likelihood term based on observer count. Standard Bayes assumes the hypothesis doesn't change the number of observers *making the observation*. SIA says the number of observers *is* the evidence.
  2.  **"It's just the Reference Class Problem":** Acknowledge it, then bracket it. "For tonight, the Reference Class is 'entities having this exact conversation.' If you change the class, the numbers change, but the *mechanism* doesn't."
  3.  **"Doomsday is the same argument":** Decouple them. Doomsday is an *application* of SSA to time. Tonight is about *structure*. You can accept the math without accepting the apocalyptic conclusion.
  4.  **"Infinite Observers":** Explicitly ban infinities. "We are doing finite integer arithmetic tonight. If $N = \infty$, the ratios break and we go home."
  5.  **"The Presumptuous Philosopher":** This is the emotional hurdle. They will hate SIA because it implies we can infer the size of the universe from our existence.
      *   *The Fix:* Frame it as a trade-off. "SSA saves you from the Presumptuous Philosopher, but it costs you the Doomsday Argument. You cannot have both. Which bullet do you want to bite?"

  **01:05 – 01:15: The Guarantee Test**
  Place this **after** the Presumptuous Philosopher discussion. It acts as a sanity check on whether anthropics applies at all.
  *   **The Test:** "Under each hypothesis, was there any chance that the thing now doing this reasoning would have been somebody else instead of you?"
  *   **Placement:** Late. If you put it early, they will use it to argue against anthropics entirely ("I had to be me, so no update"). Once they understand the rules, this test helps them debug *when* to apply them.
  *   **The Bias:** You are right to be suspicious. This test quietly favors **SSA**. SSA relies on the idea that "you" are a sample from a class of possible observers. If the answer to the Guarantee Test is "No, I am a rigid designator," SSA collapses. SIA is more robust because it counts "observer-moments" regardless of identity, but the phrasing "would have been somebody else" leans into the sampling intuition of SSA.
  *   **Instruction:** Present it as a "Pre-Flight Check." If the answer is "No," anthropics doesn't grip. If "Yes," proceed to SSA/SIA.

  **01:15 – 01:25: The Transfer Check (Agreement Case)**
  Do **not** use either of the cases you proposed. Both result in disagreement.
  *   *Your Option 1 (100 vs 100k total; 10 vs 10k evidence):* SSA sees equal proportions (no update). SIA sees absolute counts (huge update). **Disagree.**
  *   *Your Option 2 (1 vs 1k total; 1 vs 1 evidence):* SSA favors small (1/1 vs 1/1000). SIA favors large (more slots). **Disagree.**

  **Use this instead:**
  *   **Hypothesis A:** 1,000 observers. 10 have Blue Badges.
  *   **Hypothesis B:** 1,000 observers. 900 have Blue Badges.
  *   **Prior:** 50/50.
  *   **Evidence:** You look down. You have a Blue Badge.
  *   **Why this works:** Total $N$ is fixed.
      *   SSA: Likelihood is proportion (10/1000 vs 900/1000). Favors B.
      *   SIA: Likelihood is count (10 vs 900). Favors B.
  *   **The Question to Ask:** "Does the total number of observers matter here?"
      *   *Correct Answer:* "No. Only the proportion of observers with my evidence matters."
      *   *Trap Answer:* "SSA favors A because it's smaller." (Shows they memorized slogans, not the math).
      *   *Trap Answer:* "SIA favors B because there are more people." (Correct conclusion, but check if they realize SSA agrees).

  **01:25 – 01:30: The Refusal**
  Explicitly state what you are **not** explaining. This protects the session from scope creep.
  *   **Fine-Tuning:** "This is about observer counting, not physical constants. We assume the physics allows observers in both hypotheses."
  *   **The Measure Problem:** "We are not doing quantum mechanics. There is no wavefunction collapse tonight."
  *   **Boltzmann Brains:** "We assume all observers are evolved. No random fluctuations."
  *   **Infinite Ethics:** "We are calculating probabilities, not moral value."
  *   **Why:** None of these are load-bearing for the logical divergence of SSA and SIA in finite cases. If you open these doors, the programmers will try to solve the physics and miss the probability structure.

  ### Summary of Critical Moves
  1.  **Wait to Name:** Keep "SSA/SIA" hidden until the tension is felt (Minute 20).
  2.  **Fix the Prior:** In the Core Case, ensure they understand the 50/50 coin flip is the anchor. If they drift the prior, the math fails.
  3.  **Kill the "SIA = Bayes" Myth:** Be explicit that SIA modifies the likelihood function based on $N$.
  4.  **Swap the Transfer Case:** Use the "Fixed Total, Varying Proportion" case to prove they understand the mechanism, not just the slogan.
  5.  **Late Guarantee Test:** Use it to validate applicability, but warn them it leans SSA.

  If you stick to this, you won't have a debate about Doomsday; you'll have a debugging session on probability structures. That's a win.
