      *   *Standard Divergence:*
          *   SSA: $P(H|E) \propto P(H) \times \frac{1}{N_H}$ (Penalizes large $N$).
          *   SIA: $P(H|E) \propto P(H) \times N_H$ (Rewards large $N$).
      *   *What must be fixed?* The *prior probability of the world states* ($P(H)$) must be fixed (e.g., 50/50 coin flip). The *indexical evidence* must be fixed (e.g., "I am observer #X" or just "I am an observer").
