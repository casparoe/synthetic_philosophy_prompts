          *   *Option 2:* Total 1 vs 1,000. Exactly one observer has evidence.
          *   SSA: Favors Total 1 (1/1 vs 1/1000).
          *   SIA: Favors Total 1,000 (1 vs 1). Wait. SIA: $1 \times 1$ vs $1 \times 1000$. Favors 1000.
          *   *They disagree here.*
      *   *How to make them agree?*
