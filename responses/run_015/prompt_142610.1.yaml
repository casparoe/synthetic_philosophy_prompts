  6.  **The Transfer Check (Agreement Case):**
      *   *Option 1:* Total 100 vs 100,000. 10 vs 10,000 have your evidence.
          *   Ratio is 10/100 = 1/10 vs 10,000/100,000 = 1/10.
          *   SSA: Likelihood proportional to fraction (1/10 vs 1/10). P(H|E) = Prior.
          *   SIA: Likelihood proportional to Count (10 vs 10,000) *but* normalized by Total? SIA says $P(E|H) \propto N_{evidence}$. Wait.
