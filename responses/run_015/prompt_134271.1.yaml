answer: |-
  ### I. The Translation: Archival Theory as Statistical Learning Theory

  **The Archive as Empirical Distribution**
  The archive is the training corpus $\mathcal{D} = \{(x_i, y_i)\}_{i=1}^N$ drawn from an underlying population $\mathcal{U}$. Historical legibility corresponds to the **support** of the empirical distribution $\hat{P}_{data}$. If a subpopulation $S \subset \mathcal{U}$ has zero density in $\hat{P}_{data}$ (i.e., $x \in S \implies P(x) = 0$), the model possesses infinite variance for queries regarding $S$. Legibility is the capacity of the estimator $\hat{f}$ to generalize with bounded error on a specific manifold; illegibility is distributional shift where the test distribution differs from the training distribution ($P_{test} \neq P_{train}$).

  **Curatorial Authority as Sampling Bias**
  Curatorial authority is the **sampling function** $S: \mathcal{U} \rightarrow \mathcal{D}$. This function is not uniform. It introduces selection bias where the probability of inclusion $\pi_i = P(i \in \mathcal{D})$ is correlated with the target variable $y_i$ or latent features $z_i$. The "politics of preservation" is the **objective function** $\mathcal{L}$ used to optimize the sampler. The curator minimizes a loss that prioritizes low error on specific subsets of $\mathcal{U}$ while tolerating high loss (or ignoring) others. This is equivalent to weighted Empirical Risk Minimization (ERM) where weights $w_i$ are assigned based on a utility function external to the ground truth.

  **Structured Absence as MNAR**
  The claim that absence is structured rather than random maps to **Missing Not At Random (MNAR)** mechanisms. Let $R$ be the missingness indicator ($R=1$ if observed, $R=0$ if missing). In MCAR (Missing Completely At Random), $P(R|X, Y) = P(R)$. In archival systems, $P(R|X, Y) \neq P(R)$. The missingness depends on the unobserved value itself ($P(R|X_{miss})$) or on latent confounders correlated with the target. The "silence" is the pattern of zeros in the data matrix.

  **Silence as Information Content**
  The claim that silences carry information translates to **informative missingness**. The missingness mask $R$ contains mutual information regarding the target $Y$, denoted $I(R; Y) > 0$. If the mechanism generating the nulls is dependent on the latent state, then $R$ is a predictive feature. Ignoring the structure of $R$ (treating MNAR as MCAR) results in inconsistent estimators $\hat{\theta}$. The "voice of the silenced" is the signal recoverable from the conditional distribution $P(Y | R=0)$, provided the missingness mechanism is identifiable.

  ***

  ### II. The Residue Report

  **1. Clean Mappings (Isomorphic Structures)**
  *   **Structured Absence $\leftrightarrow$ MNAR:** The statistical formalization of MNAR captures the archival claim that exclusion is systematic. Both imply that the observation process is confounded with the variable of interest.
  *   **Legibility $\leftrightarrow$ Support Coverage:** The definition of legibility as "being representable in the model" maps cleanly to whether a data point lies within the high-density regions of the training manifold.
  *   **Silence as Signal $\leftrightarrow$ Informative Missingness:** The assertion that absence conveys meaning is statistically valid if the missingness indicator $R$ reduces entropy in $Y$.

  **2. Distorted Mappings (Requires Assumption Relaxation)**
  *   **Agency/Intent $\leftrightarrow$ Sampling Protocol:** Archival theory posits an *agent* (the archivist/state) making active exclusion decisions. In ML, sampling bias is often emergent (e.g., web scraping availability) rather than agentic. To map "intent," one must model the sampler as an optimization agent with a specific utility function. Without defining that utility, "intent" is a latent confounder that is statistically unidentifiable from the data alone.
  *   **Moral Obligation $\leftrightarrow$ Regularization Constraints:** Archival theory asserts a duty to the unrecorded. In ML, there is no intrinsic penalty for high loss on $P_{data}(x) \approx 0$. To map "obligation," one must introduce an external constraint term $\Omega(\theta)$ or a re-weighting scheme that artificially inflates the loss contribution of underrepresented regions. This is an engineering patch, not a property of the learning framework.

  **3. No Counterpart (Null Space)**
  *   **Historical Responsibility:** ML models are stateless regarding prior iterations unless explicitly versioned. There is no mechanism for "reparations" or retroactive correction of past loss minimization. Gradient descent updates $\theta$ based on current $\mathcal{L}$; it does not integrate a penalty for past exclusions.
  *   **Dignity/Recognition:** "Legibility" in archives implies phenomenological recognition. In ML, it implies low prediction error. A model can accurately predict a label for a group (high legibility) while misrepresenting their internal structure (high feature distortion). The ML framework cannot distinguish between *accurate prediction* and *respectful representation*.
  *   **Counterfactual Rights:** Archival theory often argues for the rights of the *potential* record (what should have been saved). ML deals strictly with the *actual* record. There is no statistical operator for the counterfactual dataset $\mathcal{D}^*$ that would exist under a fair sampling regime.

  ***

  ### III. Assessment of the Untranslatable Remainder

  The untranslatable remainder reveals a **genuine limitation of the dataset-bias framework**, specifically its inability to register **normative stakes** and **causal agency**.

  1.  **Normative Blindness:** The dataset-bias framework is descriptive, not prescriptive. It can identify that $P_{train} \neq P_{pop}$ (bias) and that $I(R; Y) > 0$ (informative silence). However, it cannot compute *why* this discrepancy constitutes a harm. "Harm" requires an external utility function defining human welfare, which is not intrinsic to the loss function $\mathcal{L}$. The ML framework treats the exclusion of a subpopulation as increased variance; archival theory treats it as a violation of rights. The former is an error metric; the latter is a constraint satisfaction problem on a moral manifold that ML does not access.
  2.  **Identifiability of Intent:** Conversely, the remainder suggests that some archival-theory claims are **less substantive than their vocabulary implies** when they rely on unproven causal mechanisms. Archival theorists often assert "systematic exclusion" without identifying the selection function $S$. In ML terms, they assert MNAR without proving the missingness mechanism. If the missingness is actually MAR (Missing At Random) or due to high-noise decay (entropy), the claim of "structured political silence" is a causal overfit. The ML framework demands that if silence carries information ($I(R; Y) > 0$), one must be able to model $P(R|X, Y)$. If the mechanism cannot be parameterized, the claim that the silence is "political" remains a latent variable hypothesis, not an identified fact.

  **Conclusion:**
  The translation demonstrates that **power** in archives is statistically equivalent to **control over the sampling distribution $Q(x)$**. However, the dataset-bias framework fails to capture **responsibility**, because responsibility requires a counterfactual model of *what should have been sampled* and a loss function that penalizes deviation from that counterfactual. The limitation lies in the ML framework's inability to optimize for variables (justice, dignity) that are not reducible to prediction error on observed data. Archival theory supplies the external utility function, but often lacks the rigorous identification strategies that ML requires to verify its claims of structured absence.
