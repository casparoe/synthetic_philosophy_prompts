answer: |-
  ### Specification for a Theory of Compatriot Partiality

  **Purpose:** To guide institutional design and official action regarding social spending in a moderately affluent democracy.
  **Constraint:** Motivating cases must be drawn from ordinary political life (1–2 sentences).

  #### Requirements Table

  | # | Requirement | Status | Case / Consideration |
  | :--- | :--- | :--- | :--- |
  | **1** | **Contrastive Sensitivity.** The account must isolate specific grounds (institutions, culture, residence, coercion) and predict outcomes when they vary independently. | Non-Negotiable | Compare a long-term resident denied naturalization against a citizen who has lived abroad for forty years; the theory must explain why spending priorities differ or do not. |
  | **2** | **Nested Jurisdictions.** The account must order claims across layered memberships (municipality, province, state, union) and determine if priority is transitive. | Non-Negotiable | A flood-relief budget must be divided between a richer province of your own federation and a poorer region of a neighbouring state. |
  | **3** | **Conflicting Affiliations.** The account must decide claims when group memberships overlap or contradict, such as dual loyalty or cross-border minorities. | Non-Negotiable | A dual national's two states are at war, or a linguistic community straddles borders while most of her compatriots do not belong to it. |
  | **4** | **Acquisition and Loss.** The account must specify the timeline and events that trigger the start and end of partiality claims. | Non-Negotiable | Compare the emigrant who has formally renounced citizenship against the citizen naturalized last year; the theory must say when obligations cease or begin. |
  | **5** | **Deontic Structure.** The account must define whether partiality is a permission, a duty, a constraint, or an intensification of a general duty. | Non-Negotiable | A tax increase would do more good abroad; the theory must say if spending it at home is permissible, required, or merely not an injustice. |
  | **6** | **Benefit vs. Exclusion.** The account must distinguish the justification for benefiting insiders from the justification for excluding or coercing outsiders. | Non-Negotiable | Compare topping up a domestic pension versus closing a labour market to foreigners; the theory must not treat these as morally identical acts. |
  | **7** | **Clarity of Ground.** The account must explicitly state the justifying ground and not conflate distinct variables like coercion, reciprocity, or identity. | Prejudice | *Original formulation demanded "citizenship itself."* This assumes a statist framing. Revised to demand clarity whatever the ground is. Case: A policy justified by "shared history" must not rely on "shared coercion" without admission. |
  | **8** | **Analytic Distinctions.** The account must keep distinct: claim existence vs. strength, state justification vs. partiality justification, distributive vs. non-distributive claims, and feelings vs. obligations. | Non-Negotiable | A citizen feels strong solidarity with a distant co-ethnic but owes nothing; the theory must distinguish the sentiment from the enforceable claim. |
  | **9** | **Bound Against Abuse.** The account must prevent any shared identity from generating claims and must survive cases where a nation is constituted by the exclusion of residents. | Non-Negotiable | A movement seeks to redirect spending to a "true nation" defined by excluding long-term residents under its institutions. |
  | **10** | **Uptake Under Disagreement.** The account must advise officials when the electorate's partiality exceeds what the theory permits, and weigh the cost of institutional non-compliance. | Negotiable | *Motivated by Political Realism.* The electorate demands zero foreign aid; the theory must say if officials should comply or resist, and at what moral cost. |
  | **11** | **Fiscal Scarcity and Trade-offs.** The account must acknowledge finite resources and specify how partiality competes with other state functions like defense or debt service. | Non-Negotiable | *Added.* A surplus exists but is insufficient to fully fund both domestic elderly care and a mandated foreign development target; the theory must prioritize. |
  | **12** | **Public Justification.** The account must provide reasons that officials can articulate to those excluded without relying on secrets or esoteric moral knowledge. | Non-Negotiable | *Added.* An official must explain to a denied asylum seeker why a citizen in prison receives better healthcare, using reasons accessible to the outsider. |

  ***

  ### Incompatibilities Among Requirements

  You suspected tension between requirements 1 (Contrastive Sensitivity), 2 (Nested Jurisdictions), and 10 (Uptake Under Disagreement). This suspicion is correct, and the incompatibility is structural rather than merely practical.

  Requirement 1 demands a high-resolution moral map. It requires institutions to distinguish between the long-term resident and the absentee citizen, or the coerced subject and the voluntary member. This demands administrative granularity and a citizenry capable of recognizing fine-grained moral distinctions. Requirement 2 demands a hierarchical map, prioritizing the municipality over the province, or the federation over the neighbor. However, political identities are rarely transitive or neatly layered; loyalty to a province often supersedes loyalty to the federation, violating the transitivity Requirement 2 demands for a stable budget rule.

  Requirement 10 introduces the friction of actual politics. It asks the theory to guide officials when the electorate's moral resolution is far lower than Requirement 1 demands. The electorate typically operates on blunt heuristics (citizen vs. non-citizen) rather than the nuanced contrasts of Requirement 1, and they prioritize their immediate locality over the abstract hierarchy of Requirement 2. If an official follows Requirement 1 (treating the resident like the citizen) or Requirement 2 (sending funds to the poorer neighbor), they violate the expectations described in Requirement 10. A theory cannot simultaneously demand fine-grained discrimination (1), a stable transitive hierarchy (2), and stability amidst a blunt, non-compliant electorate (10). Satisfying 1 and 2 renders the institution unstable under 10; satisfying 10 renders the institution unjust under 1 and 2.

  **The Single Most Exclusionary Requirement:**
  Requirement 1 (Contrastive Sensitivity) excludes the largest number of otherwise attractive accounts. Most theories rely on a "bundle" of goods—citizenship usually comes packaged with residence, coercion, and cultural affinity. When Requirement 1 forces the theorist to unbundle these (e.g., asking about the citizen who never resides or the resident who is never coerced), the justification for partiality often evaporates because it was secretly relying on a surrogate variable like reciprocity or capacity to benefit. Accounts that cannot survive the separation of citizenship from its usual accompaniments fail this test.

  ***

  ### Compressed Scorecard

  **Coercion- or Institution-Based**
  Fails Requirement 2 because supranational unions often lack direct coercion yet claim fiscal priority over member states. Fails Requirement 4 because institutional bonds often persist legally after residence and effective coercion end.

  **Associative or Relationship-Based**
  Fails Requirement 1 because associative ties do not track legal borders, obligating citizens to close friends abroad over distant compatriots. Fails Requirement 12 because the intimacy of association cannot be publicly justified to outsiders as a basis for state spending.

  **Identity- or Culture-Based**
  Fails Requirement 9 as it inevitably validates exclusionary movements that define the nation against internal minorities. Fails Requirement 6 because cultural solidarity often justifies exclusionary border policies as readily as internal welfare spending.

  **Thoroughgoing Egalitarian-Cosmopolitan**
  Fails Requirement 5 because it cannot categorize favoring compatriots as permissible, let alone a duty, without contradicting its core premise. Fails Requirement 10 because it demands institutional resistance to electoral will that is likely unsustainable in a democracy.
