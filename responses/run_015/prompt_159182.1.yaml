answer: |-
  ### Specification for a Normatively Adequate Theory of Joint Action

  **I. Non-Negotiable Requirements (Normative Necessities)**
  *These are required to underwrite obligation and blame; without them, the theory cannot serve your specific purpose.*

  1.  **The Normative Residue Requirement:** The theory must explain why joint action generates *interpersonal* obligations (entitlement to rebuke, duty to renegotiate) rather than merely *external* moral assessments (blame from a third party).
      *   *Consideration:* Without this, you cannot distinguish a partner abandoning a duet (a wrong *to you*) from a stranger failing to help you (a general moral failing).
  2.  **The Convergence Distinction:** The theory must distinguish acting together from mere parallel action (e.g., two people opening umbrellas simultaneously in rain vs. walking together under one).
      *   *Consideration:* Obligation attaches to the *togetherness*, not the outcome; parallel actors owe each other nothing when one stops.
  3.  **The Voluntarism Constraint:** The theory must locate the source of obligation in the agents' voluntary participation (actual or constructive) to satisfy "ought implies can."
      *   *Consideration:* You cannot blame an agent for a joint outcome if their contribution was wholly coerced or unwitting, even if they were causally essential.
  4.  **The Dissent Handling Requirement:** The theory must account for the normative status of the dissenting or coerced member who is functionally part of the action but normatively distinct.
      *   *Consideration:* To assign blame correctly, the theory must distinguish between *membership* in the action and *endorsement* of the action; otherwise, all members are equally culpable for crimes they opposed.

  **II. Research Programme Preferences (Methodological Choices)**
  *These are desirable for certain ontological commitments but not strictly required for normative underwriting.*

  5.  **Methodological Individualism:** The preference to reduce all group states to facts about individual psychology (beliefs, intentions).
      *   *Consideration:* While parsimonious, this is not non-negotiable; a non-reductive account may better handle group-level obligations.
  6.  **Diachronic Rigidity:** The preference that the "we" persists only as long as the specific members persist.
      *   *Consideration:* Useful for small teams, but obstructs attributing debt/obligation to corporations or states where membership turns over.
  7.  **Epistemic Transparency:** The preference that all members must understand the joint plan to be bound by it.
      *   *Consideration:* Protects agents from unwitting liability but excludes complex modern coordination (algorithms, markets) from the scope of joint action.

  **III. Required Case Coverage (Stress Tests)**
  *The theory must yield plausible normative verdicts in these scenarios.*

  8.  **Divergent Private Ends:** Must handle cases where agents act together for incompatible ultimate goals (e.g., market exchange, political coalition).
      *   *Consideration:* Obligation must stem from the *joint structure*, not shared ultimate ends; otherwise, most political/economic obligations vanish.
  9.  **The Discursive Dilemma:** Must handle cases where the group outcome (via aggregation) is endorsed by no individual member.
      *   *Consideration:* If the group is bound by the vote but no member is, obligation becomes unmoored; if members are bound against their vote, voluntarism is threatened.
  10. **Improvisation:** Must handle joint action without prior plan or communication (e.g., jazz, emergency rescue).
      *   *Consideration:* Rules out theories requiring *prior* agreement or *meshing sub-plans* as necessary conditions for obligation.
  11. **Algorithmic Opacity:** Must handle coordination brokered by systems no member fully understands (e.g., ride-share networks, high-frequency trading).
      *   *Consideration:* Tests the limit of the Voluntarism Constraint; if members don't know the plan, can they intend it, and can they be blamed for its failures?
  12. **Diachronic Turnover:** Must handle long-running collectives where the original members are replaced (e.g., corporations, states).
      *   *Consideration:* Determines whether obligations bind the *current* members or the *abstract body*; crucial for historical injustice or long-term debt.

  **IV. Required Distinctions (Ontological Boundaries)**
  *The theory must not collapse these pairs.*

  13. **Shared Intention vs. Shared Belief:** Believing we will succeed is not intending to succeed together.
      *   *Consideration:* Obligation attaches to intention (commitment to act), not prediction (expectation of outcome).
  14. **Group Act vs. Members' Acts:** The group's decision is not identical to the sum of individual votes.
      *   *Consideration:* Necessary to blame the *organization* without necessarily blaming every *employee*.
  15. **Intending-Together vs. Each Intending That We Do:** *We intend* is not equivalent to *I intend that we do* + *You intend that we do*.
      *   *Consideration:* The latter allows for free-riding without normative violation; the former creates mutual lock-in.
  16. **Joint Action vs. Joint Causal Production:** Two people pushing a car vs. two people accidentally bumping it into motion.
      *   *Consideration:* Causal contribution alone does not generate the right to rebuke; intentional coordination does.

  **V. The Genuine Trade-Off**
  *You suspected a tension between loose collectives and normative residue. You are correct.*

  **The Scope-Force Tension:** There is a genuine incompatibility between maximizing the **Scope** of joint action (to include loose, dispersed, algorithmic, or unwitting collectives) and maximizing the **Normative Force** (the strong interpersonal right to rebuke and obligation to renegotiate).
  *   *Reasoning:* Strong normative force requires strong epistemic and volitional ties (I must know I am bound and agree to be bound). Loose collectives (algorithms, markets) lack these ties by definition.
  *   *Resolution:* You must choose. If you prioritize covering algorithmic coordination, you must dilute "obligation" to "causal responsibility." If you prioritize the right to rebuke, you must exclude opaque or unwitting participants from the category of *joint actors* (treating them instead as tools or external causes).

  **VI. The Single Exclusionary Requirement**
  *The requirement that does the most work in excluding otherwise plausible theories is:*

  **The requirement to ground interpersonal entitlement to rebuke in cases of divergent private ends without explicit agreement.**
  *   *Reasoning:* This excludes **Plan-Based Accounts** (require meshing sub-plans), **We-Intention Accounts** (require shared mental states often implying shared ends), and **Joint-Commitment Accounts** (require mutual expression of readiness/agreement). It forces a theory that can generate norms from structure alone, which is the hardest philosophical lift.

  **VII. Theory Family Notes**
  *   **Plan-Based (e.g., Bratman):** Joint action occurs when individual intentions interlock and mesh via mutual knowledge.
  *   **We-Intention (e.g., Tuomela, Searle):** Joint action occurs when individuals hold a primitive, irreducible intention directed at the group's action.
  *   **Joint-Commitment (e.g., Gilbert):** Joint action occurs when parties mutually express readiness to be bound together as a single normative body.
