answer: |-
  Here are ten questions designed to probe the substance of the speaker's argument. They are organized by topic, with the four required follow-up questions keyed to her likely responses.

  ### I. The Fiduciary-Trust Account vs. Rule-Violation

  **1.** You argue that the fiduciary-trust account is superior to the standard rule-violation or private-gain accounts. Beyond capturing our moral intuitions, what specific *analytical* work does this definition buy us? Does it allow us to diagnose political pathologies that the legalistic account renders invisible, or does it primarily serve to exonerate actors who break rules for "public-spirited" reasons?

  **2.** *(Follow-up)* **Strategy:** She will likely answer that the trust account captures the *normative purpose* of office, distinguishing between technical violations and genuine betrayals. **Vulnerability:** This risks making corruption dependent on the *empirical* state of public trust, which can be manipulated.
  **Question:** If corruption is defined by the betrayal of trust, does it matter whether that trust is empirically present or normatively warranted? If a populace has been propagandized to trust a kleptocratic leader, does your account struggle to label the leader's enrichment as corruption, since no trust is actually being betrayed in the eyes of the public?

  ### II. Clientelism and State Capacity

  **3.** You suggest clientelism is corrupt in high-capacity states but functional in low-capacity ones. Critics might argue this asymmetry merely tracks the power of the states that happen to set the standard, treating Western bureaucratic norms as the telos of development. How do you ensure this distinction doesn't function as a sophisticated version of "they aren't ready for democracy yet"?

  **4.** *(Follow-up)* **Strategy:** She will likely answer that this is a functional claim about the *availability* of public goods, not a cultural judgment. **Vulnerability:** This creates a "corruption trap" where reform is discouraged because the behavior is deemed functional.
  **Question:** If clientelism is deemed functional in low-capacity states because it distributes goods where the state otherwise would not, does your view imply that international anti-corruption NGOs working to dismantle these networks in such contexts are actually harming governance? At what point does the functional benefit lose its justificatory power?

  ### III. Gift-Giving and the Boundary of Corruption

  **5.** Regarding gift-giving, you warn against conceptual imperialism, noting that in some societies this is a norm of social integration. But if an official accepts a gift knowing the giver *expects* favorable treatment, even if the culture labels it a "gift," hasn't the fiduciary duty been breached by the official's silence? On your account, where exactly is the line drawn between a culturally normative gift and a bribe?

  **6.** *(Follow-up)* **Strategy:** She will likely answer that the line depends on the *expectation of reciprocity* regarding official action versus social bonding. **Vulnerability:** This makes corruption dependent on internal mental states and social scripts that are opaque to outsiders.
  **Question:** If the distinction relies on internal social scripts and expectations of reciprocity, does this make corruption unknowable to external observers or auditors until after the fact? How can a legal system adjudicate these cases without falling back on the bright-line rules you criticize?

  ### IV. The Cross-Cultural Core of Corruption

  **7.** If corruption is context-dependent based on local trust relationships and state capacity, is there any minimal core of corruption that applies universally? Or is corruption entirely endogenous to the specific political culture, such that an act could be corrupt in one society and virtuous in another?

  **8.** *(Follow-up)* **Strategy:** She will likely answer that the universal core is the betrayal of the *purpose of the office*, whatever that purpose is locally defined. **Vulnerability:** This leaves the account vulnerable to authoritarian definitions of "office."
  **Question:** If the universal core is betraying the purpose of the office, but the "purpose of the office" is defined by a ruling elite to serve the party rather than the public, does your account lack the resources to condemn systemic state capture? Who gets to define the fiduciary purpose when the society itself is contested?

  ### V. Additional Substantive Questions

  **9.** You claim an act can be illegal without being corrupt if it breaks a rule but betrays no trust. Can you provide a concrete example where breaking a law *preserves* trust rather than betrays it? This seems to sit uncomfortably with the idea that in a rule-of-law society, the law is the primary embodiment of the public trust.

  **10.** Finally, if we adopt your definition for policy purposes, how do we measure corruption? Current metrics like Transparency International's indices rely heavily on proxies like rule-breaking and prosecutions. Does your theory render these current metrics obsolete, and if so, what do we put in their place to track progress?
