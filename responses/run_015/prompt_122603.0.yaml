  ### The Decision Tree

  **Node 1: The Burnt Manuscript**
  *Case:* A novel exists in one copy behind glass, in a language nobody alive reads fluently. A scholar you trust completely says it's the best thing she's ever read. Nobody will ever be able to check.
  *Question:* Is the book a masterpiece even if no human being ever reads it again?
  *   **Yes (Value is in the object):** Go to Node 2.
  *   **No (Value is in the experience):** Go to Node 6.

  **Node 2: The Scholar's Claim**
  *Case:* The Burnt Manuscript (continued).
  *Question:* Does the scholar *know* it's a masterpiece, or does she just have a very strong opinion?
  *   **Just an opinion:** Leaf 1 (**The Hard One**).
  *   **She knows:** Go to Node 3.

  **Node 3: The Trained Ear**
  *Case:* A critic hears structural stuff you structurally cannot hear—counterpoint, whatever—and reports it. You could read the same pages and hear nothing.
  *Question:* If you don't have the ear for it yourself, can you still *know* the book is good based on her word?
  *   **No (You need the ear):** Go to Node 4.
  *   **Yes (Words carry it):** Go to Node 5.

  **Node 4: The Capacity Check**
  *Case:* The Trained Ear (continued).
  *Question:* If you lack the ear, do you have *knowledge* or just a *justified belief*?
  *   **Justified belief:** Leaf 2 (**Real But Not Knowledge**).
  *   **Knowledge:** Leaf 3 (**Track Sensibility**). *(Note: This leaf captures the view that you know only because your sensibility generally tracks the critic's, even if you miss this specific detail.)*
  *   **Unoccupied Cell:** *No one lives here.* (Claiming you have knowledge without the capacity to verify is incoherent).

  **Node 5: The Cheap Access**
  *Case:* You could read the first page yourself in ten seconds and haven't; the person telling you has.
  *Question:* Does the fact that you *could* just look change whether you now know it's good?
  *   **Yes (It blocks knowledge):** Leaf 4 (**Know But Shouldn't: Own Taste**).
  *   **No (It doesn't matter):** Go to Node 7.

  **Node 6: The Prediction**
  *Case:* Your friend hasn't read the book either, but knows you cold, and says "you'll love it."
  *Question:* Is your friend telling you something true about the world, or just predicting your brain state?
  *   **Just predicting your brain:** Leaf 5 (**Learning About Future Response**).
  *   **Something true about the world:** Go to Node 8.

  **Node 7: The Citation**
  *Case:* You ghostwrite prize citations for books you haven't opened.
  *Question:* Is the point of calling it "good" to tell people to read it, or to put it on a shelf of winners?
  *   **To tell people to read it:** Leaf 6 (**Know But Shouldn't: Purpose**).
  *   **To put it on a shelf:** Leaf 7 (**Testimony Is Testimony**).
  *   **Unoccupied Cell:** *No one lives here.* (Claiming the point is to guide action but you shouldn't read it is pragmatic suicide).

  **Node 8: The Fit**
  *Case:* The Prediction (continued).
  *Question:* Is the truth about the book's quality or about your fit with the book?
  *   **About the book's quality:** Leaf 3 (**Track Sensibility**). *(Note: This leaf is reachable from both Node 4 and Node 8; see flag below).*
  *   **About the fit:** Leaf 8 (**No Aesthetic Knowledge**). *(Note: This leaf captures the view that "good" is just a placeholder for "fits us," so there's no knowledge to transmit).*

  ---

  ### The Leaves (Descriptive)

  1.  **The Hard One:** Nothing comes across at all. No knowledge, not even a justified belief. (Node 2)
  2.  **Real But Not Knowledge:** You end up with something real (justified belief) but it still isn't knowledge. (Node 4)
  3.  **Track Sensibility:** It works, but only because you independently have reason to think this testifier's sensibility tracks yours. (Node 4 / Node 8)
  4.  **Know But Shouldn't (Own Taste):** Sure you can know, but you shouldn't—because you need to own your own taste rather than borrowing someone's. (Node 5)
  5.  **Learning About Future Response:** You aren't learning about the book at all, you're learning about your own likely future response to it. (Node 6)
  6.  **Know But Shouldn't (Purpose):** Sure you can know, but you shouldn't—because aesthetic engagement is for experiencing, not ranking. (Node 7)
  7.  **Testimony Is Testimony:** Testimony is just testimony and there's nothing special about the aesthetic case. (Node 7)
  8.  **No Aesthetic Knowledge:** There's no aesthetic knowledge to transmit in the first place, so the whole debate is misframed. (Node 8)

  ---

  ### Diagnostics & Flags

  **Unoccupied Cells:**
  1.  **Node 4 (Capacity/Knowledge):** *Diagnosis:* Incoherent. Claiming "knowledge" without the capacity to verify contradicts the definition of knowledge in this context.
  2.  **Node 7 (Guidance/Action):** *Diagnosis:* Pragmatic suicide. Claiming the judgment is for guiding action while arguing you shouldn't read the book undermines the judgment's function.

  **Flagged Indistinguishable Leaves:**
  *   **Leaf 3 (Track Sensibility)** is reachable via two paths (Node 4 and Node 8). The tree cannot pull apart the "Realist who requires an ear" from the "Anti-Realist who believes in fit." In practice, these characters will sound identical in argument. You may need to differentiate them by *tone* (one sounds scientific, the other therapeutic) rather than logic.

  **The Guidance vs. Merit Distinction:**
  *   **Verdict:** It works. It successfully separates Leaf 6 (Purpose) from Leaf 7 (Testimony). However, it is fragile. Characters often slide between "ranking" and "recommending" without noticing. If your characters sound too similar here, have one focus on the *prize* (rank) and the other on the *customer* (action).

  **Invented Positions:**
  *   **Leaf 2 (Real But Not Knowledge):** I had to invent this to fill the gap between "Hard No" and "Track Sensibility." It's a plausible philosophical niche (externalism vs. internalism), but it's less common in casual debate. This is a good spot for a character who feels intellectually honest but frustrated.
  *   **Leaf 8 (No Aesthetic Knowledge):** Placed at Node 8 to capture the anti-realist who denies truth-aptness. This is often conflated with Leaf 5 (Future Response). If your characters confuse these, that's realistic.

  ---

  ### Confidence Note

  I am **moderately confident** in this map as a picture of the debate. It covers the logical space required by your constraints and separates the required leaves.

  **Least Sure Node:** **Node 8 (The Fit).** I am unsure because the distinction between "Learning About Future Response" (Leaf 5) and "No Aesthetic Knowledge" (Leaf 8) is notoriously shaky. Many philosophers treat these as the same view (anti-realism). I separated them to satisfy your requirement for both leaves, but in a real argument, a character holding Leaf 5 might easily sound like they hold Leaf 8. If they sound identical, merge them and give the extra space to a different normative distinction (e.g., "Trust the Aggregate" vs. "Trust the One").

  **Invented Position Warning:** **Leaf 2 (Real But Not Knowledge)** is the spot I'm most confident you can use for a character. It's a natural home for someone who respects the experts but feels personally excluded from the "knowledge" club. It generates immediate dramatic tension.
