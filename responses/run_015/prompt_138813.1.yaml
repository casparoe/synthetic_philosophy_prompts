answer: |-
  ## Session Plan: The Chrono-Architects

  **Total Time:** 75 Minutes
  **Materials:** 5 decks of index cards (10 cards per deck), 15 six-sided dice, 5 sheets of A4 paper ("The Ledger"), pens, whiteboard.
  **Group Size:** 15 students (5 groups of 3).
  **Stakes:** The group with the highest "Final Rating" chooses the first topic for next term.

  ---

  ### Part 1: The Activity (30 Minutes)

  **Title:** The Chrono-Architects
  **Setup:**
  Each group gets:
  *   10 "Dweller" cards (Index cards with "HP: 3" written on them).
  *   1 "Ledger" sheet (A4 paper with columns: *Turn | Action | Wounds Inflicted*).
  *   1 "Score" sheet.
  *   3 "Temporal Shift" tokens (poker chips or distinct dice).
  *   1 Six-sided die.

  **The Story (Read Aloud, 2 mins):**
  "You are Architects building a Spire. To get materials, you must extract them from Dwellers. You need 20 Materials to win. Dwellers resist extraction. You have 15 minutes to build as much as possible."

  **The Rules (Handout or Whiteboard, 3 mins):**
  1.  **Extract:** Roll 1d6. If you roll 4+, you gain 2 Materials. Mark 1 **Wound** (an 'X') on the Dweller card.
  2.  **Resistance:** If you roll 1-3, the Dweller takes no Wound, you gain 0 Materials.
  3.  **Replace:** If a Dweller reaches 3 Wounds, they are "Depleted." Put them in the **Void Pile** (a discard pile on the table) and draw a fresh Dweller.
  4.  **Temporal Shift:** Once per turn, you may spend a Shift Token. **Reset the current Dweller** (erase Wounds, return HP to 3) and re-roll the die. You keep any Materials gained.
  5.  **The Ledger:** On every turn, record the *Action* (Extract or Shift) and *Wounds Inflicted* on the Ledger sheet. This is for "Historical Consistency."

  **The Play (20 mins):**
  *   Let them play. They will quickly realize that "Temporal Shift" allows them to avoid Depleting Dwellers (saving cards) while farming Materials.
  *   They will assume that because they "Reset the Dweller," the Wound never happened.
  *   **Crucial:** They will *not* erase the Ledger entries when they Shift. The instructions did not say to. Most will assume the Ledger resets with the Dweller, or they will treat the Ledger as irrelevant admin.
  *   **Facilitator Role:** Walk around. If a group asks, "Do we cross out the Ledger on a Shift?" say: "The rules don't specify. Do what makes sense for consistency." (This is the trap).
  *   **Time Warning:** At 15 mins, call "5 minutes remaining." Watch for frantic shifting to maximize score.

  **The Reveal & Scoring (5 mins):**
  *   Collect the sheets.
  *   Write the **True Scoring Formula** on the board:
      *   **Final Rating = (Materials Gained) – (Total Wounds on Ledger).**
  *   Calculate the winner. (Likely, the group that shifted the most will have high Materials but a massive Ledger count, potentially losing to a group that played 'honestly').
  *   **Do not explain why yet.** Just announce the winner. Hand them the "Topic Choice" privilege.
  *   Transition immediately to debrief: "Why did the scoring change? What happened during those Shifts?"

  ---

  ### Part 2: The Debrief (30 Minutes)

  Do not use the word "moral" until minute 15 of this section. Use the game terms first.

  **1. The Reload Defence (5 mins)**
  *   **Ask:** "When you used a Temporal Shift, did the Wound happen?"
  *   **Expected Answer:** "No, we reset the card."
  *   **Pressure Point:** Point to the **Void Pile**. "When you shifted, you didn't un-roll the die. You abandoned that roll. That outcome existed for a minute. You just walked away from it."
  *   **Philosophical Map:** This is the *Reload Defence* ("It didn't count because I reloaded"). The game pressures this by showing the *action* occurred, even if the *state* was reset.
  *   **What you must say:** "In a game, the code deletes the save file. In this room, the paper still has the eraser marks. Does the deletion make the act vanish, or just make it unobservable?"

  **2. The Branching Timeline (5 mins)**
  *   **Ask:** "Look at the Void Pile. Those are Dwellers who reached 3 Wounds. If you Shifted to avoid that, where did the 'Wounded Dweller' go?"
  *   **Expected Answer:** "Nowhere. It never happened."
  *   **Pressure Point:** "If time branches, then the version of the Dweller you hurt is still dead in the branch you left. You just live in the one where they aren't."
  *   **Philosophical Map:** The *Branching Objection*. The game makes this physical (the discard pile).
  *   **What you must say:** "If morality tracks outcomes, does it matter that *you* aren't in the timeline where the harm occurred? The harm still exists in the multiverse of the game."

  **3. The Persistent Ledger (10 mins)**
  *   **Ask:** "The Ledger kept the marks. Why does that feel different than the Dweller card?"
  *   **Expected Answer:** "Because the Ledger remembers."
  *   **Pressure Point:** "In a real game, the NPC forgets. In our game, the Ledger remembered. If the NPC remembered (like the Ledger), would shifting be okay?"
  *   **Philosophical Map:** The *Persistent Ledger Stipulation*. This attacks the idea that 'no consequences' equals 'no wrong'.
  *   **What you must say:** "In real life, victim memory and perpetrator memory are linked. In games, they are asymmetrical. You remember the kill; the code doesn't. If the code *did* remember (like the Ledger), does the game become morally real?"

  **4. Virtue & Designer Responsibility (10 mins)**
  *   **Ask:** "Who is responsible for the Wounds on the Ledger? You, for rolling? Or me, for giving you Shift tokens?"
  *   **Pressure Point:** "Some of you felt bad using the Shift. Some felt clever. Why the difference?"
  *   **Philosophical Map:** *Virtue Ethics* (what does this do to me?) vs. *Designer Responsibility* (the system invited this).
  *   **What you must say:** "If the game rewards harming, is the harm the player's fault? Or if the game allows harming but doesn't punish it, is the player testing the limits?"

  **Closing (5 mins):**
  *   Do not resolve the debate.
  *   **Final Question:** "If we played this again, and I told you the Ledger *would* count, would you play differently? If yes, why did you play this way? If no, does the scoring actually matter?"
  *   End on the uncertainty.

  ---

  ### Part 3: Risk Assessment (What Will Go Wrong)

  **1. The "It's Just Paper" Shrug**
  *   **Risk:** Students dismiss the Ledger entirely. "It's ink, not pain."
  *   **Fix:** In the debrief, swap the word "Wound" for "Memory." "The Ledger didn't track damage; it tracked *memory*. If the Dweller remembered being shot 5 times across 5 reloads, does the ink matter then?"

  **2. The Trust Breach**
  *   **Risk:** They feel tricked by the hidden scoring formula. "I would have played differently!"
  *   **Fix:** Own it immediately. "Yes. That was the point. You assumed 'Reload' meant 'Erase Moral Debt.' I wanted to see if you noticed the debt piling up on the Ledger. The trick wasn't the points; it was your assumption about what a Reset deletes."

  **3. The Pacifist Refusal**
  *   **Risk:** One student refuses to mark Wounds.
  *   **Fix:** Validate them. "This student treated the Dweller as having status before the rules said they did. That is a philosophical position, not a rule break. Give their group bonus points for 'Ethical Consistency' in the debrief."

  **4. Pacing Mismatch**
  *   **Risk:** One group finishes in 10 mins; another takes 25.
  *   **Fix:** The "Wait Task." When a group finishes, they must write one sentence on the back of their Ledger: *"The Shift token represents _________."* Collect these. Read them aloud in the debrief.

  **5. Gamers vs. Non-Gamers**
  *   **Risk:** Gamers optimize the exploit; non-gamers play 'straight'.
  *   **Fix:** Use this split. In the debrief, ask the optimizers: "Did you feel like you were cheating?" Ask the straight-players: "Did you feel like the optimizers were missing the point?" This creates the conflict you need.

  ---

  ### Part 4: Limitations (What This Cannot Do)

  Be blunt with yourself about where this activity fails.

  **1. Immersion & Empathy**
  *   **The Gap:** Marking an 'X' on an index card does not feel like killing a character. There is no art, no voice acting, no narrative weight.
  *   **The Fix:** You must supply the weight in words. "Imagine the Dweller had a name. Imagine the Ledger was their diary." You have to bridge the emotional gap the dice cannot cross.

  **2. The Metaphysical Question**
  *   **The Gap:** The game assumes the Dweller *can* be harmed. It doesn't prove a simulated entity *has* moral status.
  *   **The Fix:** Don't try to prove it. Frame it as a conditional: " *If* the character can be harmed, does the reload stop it?" Keep the metaphysics bracketed.

  **3. Scale**
  *   **The Gap:** In video games, we kill hundreds. Here, they killed maybe 10. The "numbing" effect of mass violence isn't replicated.
  *   **The Fix:** Acknowledge it. "In a game, you kill 100 guards and feel nothing. Here, you marked 3 X's and felt hesitation. Why? Is it the number, or the visibility?"

  **4. The "Magic Circle"**
  *   **The Gap:** Students know this is a philosophy club exercise, not a game. They are performing for you.
  *   **The Fix:** Accept the performance. Their performance *is* the data. "You played for the topic choice. That's a real stake. You made choices based on rewards. That's exactly how video games work."

  ### Facilitator's Note
  You are not looking for the "right" answer. You are looking for the moment a student says, "Wait, if I remember it, does it count?" If you get that sentence, the session succeeded. If you get a consensus, you pushed too hard. Leave them with the Ledger still on the table, unanswered.
