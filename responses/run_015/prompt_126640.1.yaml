prompt: |-
  I'm TAing a world history survey this term and I keep tripping over how the course is built. The syllabus is chopped into chunks with European-derived labels — "the medieval world", "early modern", "the age of revolutions", "industrialization" — and then each chunk covers China, the Islamic world, West Africa, the Americas, whatever, inside that frame. But the same lectures insist these places weren't just waiting around for Europe: there's a whole session on Mongol-era connections across Eurasia, another on Indian Ocean trade, and the prof is at pains to say that before 1800 or so Europe wasn't obviously the centre of anything.

  So what does this way of carving up the past actually presuppose about what a historical period is? Does it quietly assume time is one shared container with Europe holding the clock, so that a Chinese dynasty gets filed under somebody else's century — or is it defensible as a pure filing convention that says nothing about what caused what? If it really is just a convention, what does it cost us, i.e. what kinds of questions become hard to even ask? And a friend suggested the opposite fix: give every region its own period names and its own dates and never line them up on one timeline at all — does that setup smuggle in something equally substantive in the other direction? I'd like to know what each arrangement is committed to, and where each is just underdetermined.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user is a TA for a world history survey course.
      *   **Problem:** The course structure uses Eurocentric periodization labels ("Medieval," "Early Modern," etc.) applied globally, *but* the content explicitly argues against Eurocentrism (e.g., emphasizing Mongol connections, Indian Ocean trade, Europe's non-centrality before 1800).
      *   **Core Question:** What does this periodization presuppose about the nature of historical time? Is it just a neutral filing convention, or does it assume a shared timeline with Europe as the clock?
      *   **Secondary Question:** What are the costs of this approach? What questions become hard to ask?
      *   **Alternative Proposal:** A friend suggests giving every region its own period names/dates and never lining them up.
      *   **Critique of Alternative:** Does *that* setup smuggle in substantive assumptions (e.g., isolationism)?
      *   **Goal:** Understand the commitments and underdeterminations of both arrangements.

  2.  **Initial Analysis & Theoretical Framework:**

      *   This is a classic problem in historiography and pedagogy. It touches on *periodization*, *teleology*, *synchronicity*, and *comparative history*.
      *   Key scholars/concepts to keep in mind (implicitly or explicitly): Dipesh Chakrabarty (*Provincializing Europe*), Jack Goody (*The Theft of History*), Jerry Bentley (cross-cultural interaction), Fernand Braudel (temporalities), Reinhart Koselleck (spaces of experience/horizons of expectation).
      *   The tension is between *connectivity* (we need a shared timeline to see interactions) and *autonomy* (regions develop on their own rhythms).

  3.  **Addressing the First Arrangement (Euro-Derived Global Periodization):**

      *   *Presupposition:* It assumes a singular, homogeneous "empty time" (Walter Benjamin's term). It treats history as a universal procession.
      *   *The "Europe as Clock" issue:* Yes, it implicitly centers Europe as the standard of measurement, even if the content denies Europe's causal centrality. It's a "procrustean bed."
      *   *Is it just a convention?* No. Periodization is never neutral. It highlights certain transitions (feudalism to capitalism, etc.) that may not fit other regions.
      *   *Costs/Blind Spots:*
          *   It obscures local rhythms (e.g., calling Ming China "Early Modern" might miss the specific dynastic cycle logic).
          *   It implies synchronicity of development (are they *really* in the same "stage"?).
          *   It makes "lagging" seem like a failure rather than a different path.
          *   It privileges certain types of change (state formation, tech) over others (cultural, ecological).

  4.  **Addressing the Second Arrangement (Regional Autonomy/No Shared Timeline):**

      *   *Presupposition:* It assumes civilizations are distinct units with internal logic.
      *   *The "Smuggled Substance":* Yes. It risks "civilizational essentialism." It implies isolation or incommensurability.
      *   *Costs/Blind Spots:*
          *   Makes connection hard to teach (The Mongols, the Black Death, Silver trade).
          *   Fragmentation: Students can't compare *why* divergence happened later.
          *   Risks exoticizing regions (they are so different they can't share time).

  5.  **Synthesizing the Tension (The "What is a Period?" Question):**

      *   A period isn't just a bucket of years; it's a theory of change.
      *   "Medieval" implies a specific relationship between religion, politics, and economy derived from European history. Applying it to Japan or Mali imposes a theory of change that might not fit.
      *   However, without shared time, you can't talk about *simultaneity* or *causality across space*.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the TA's observation. This is a known tension in World History. Acknowledge the contradiction between structure (Euro-labels) and content (Global connections).
      *   *Section 1: The Euro-Derived Framework (The "Shared Container").*
