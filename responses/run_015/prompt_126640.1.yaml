answer: |-
  This is one of the central tensions in the field of World History, and your discomfort is theoretically well-founded. You are noticing the friction between **pedagogical necessity** (we need a shared timeline to teach a survey) and **historiographical integrity** (periodization is never neutral).

  To answer your core question: No, this way of carving up the past is not a "pure filing convention." It is a substantive theoretical claim about the nature of time and change. However, the alternative (total regional fragmentation) smuggles in an equally heavy set of assumptions.

  Here is a breakdown of what each arrangement is committed to, what it obscures, and how you might navigate this as a TA.

  ### 1. The Euro-Derived Global Framework ("Europe Holds the Clock")

  When you label the Ming Dynasty "Early Modern" or the Mali Empire "Medieval," you are adopting a model of **homogeneous, empty time**. This concept, famously critiqued by Walter Benjamin and later postcolonial historians like Dipesh Chakrabarty, suggests that history is a single track on which all societies are traveling, and Europe has simply gotten further down the track than everyone else.

  **What this presupposes:**
  *   **Universal Stages:** It assumes that all societies pass through similar developmental stages (Feudalism $\rightarrow$ Capitalism, or Traditional $\rightarrow$ Modern).
  *   **Synchronicity:** It assumes that "1500" means something structurally similar in Kyoto, Tenochtitlan, and London.
  *   **Teleology:** Even if the professor says Europe wasn't the *center*, using "Age of Revolutions" as a global label implies that "Revolution" (in the Euro-American sense) is the defining feature of that era everywhere.

  **The Cost (What questions become hard to ask?):**
  *   **Local Logics of Change:** If you call 14th-century China "Medieval," you obscure the specific dynastic logic of the Yuan-Ming transition. You force students to ask "How is this like Europe?" rather than "What is the internal logic of this change?"
  *   **The Problem of "Lag":** It subtly frames non-European societies as "behind." If Europe enters the "Industrial Age" in 1760 and Japan in 1870, the framework makes the 110-year gap look like a failure of development rather than a different strategic choice or ecological constraint.
  *   **Anachronism:** It can lead to searching for things that aren't there. Searching for "feudalism" in Japan or "the Renaissance" in the Islamic world often results in finding shadows of European concepts rather than understanding local phenomena on their own terms.

  **Is it defensible?**
  Only as a *heuristic for comparison*, not as a description of reality. It allows you to say, "While Europe was doing X, China was doing Y." But you must acknowledge that the "While" is a European measurement of time.

  ### 2. The Regional Autonomy Framework ("Separate Clocks")

  Your friend's suggestion—giving every region its own period names (e.g., Edo Period, Safavid Era, Post-Classic Maya) and refusing to line them up—is the reaction against Eurocentrism. This is often called **civilizational history**.

  **What this presupposes:**
  *   **Incommensurability:** It assumes that historical time is internal to a culture. The "time" of the Islamic Hijri calendar or the Maya Long Count is not translatable into Gregorian years without loss of meaning.
  *   **Internal Causality:** It implies that change happens primarily due to internal dynamics, not external shocks.
  *   **Distinct Ontologies:** It treats civilizations as distinct units of analysis that should not be forced into a single container.

  **The Cost (What questions become hard to ask?):**
  *   **Connectivity:** This is the fatal flaw for a *World* History course. You cannot teach the Mongol Peace, the Black Death, or the Silver Trade effectively if you refuse to synchronize timelines. How do you explain the Ming Dynasty's silver crisis if you won't line it up with Spanish mining in Potosí?
  *   **The Great Divergence:** If you never line them up, you cannot ask *why* industrialization happened in Britain and not in the Yangzi Delta. You lose the ability to compare structural conditions at specific moments of conjuncture.
  *   **Isolationism:** It risks smuggling in the idea that these places were isolated monads developing in a vacuum, which is historically false.

  ### 3. What is a Historical Period, Really?

  Your question asks what this says about "what a historical period is." In historiography, a period is not a natural container like a box; it is a **theory of causality**.

  *   To name a period "The Enlightenment" is to claim that *ideas* caused the change.
  *   To name a period "The Industrial Age" is to claim that *technology/economics* caused the change.
  *   To name a period "The Ming Dynasty" is to claim that *political legitimacy/state power* caused the change.

  When the syllabus uses "Early Modern" for the whole world, it is claiming that the *same type of causality* (likely the rise of the nation-state, global trade, and secularization) is driving change everywhere simultaneously. That is a massive substantive claim, not a neutral label.

  ### 4. How to TA This (The Middle Path)

  You cannot rewrite the syllabus, but you can frame the discussion sections to expose this tension. In fact, **making the periodization problematic is a better learning outcome than pretending it isn't.**

  Here is a strategy for your sections:

  1.  **Provincialize the Labels:** When you introduce "The Medieval World," explicitly tell students: *"We are using this label because it's familiar, but it is a European term. Your job this week is to find out where it fits China or West Africa, and where it breaks."* Turn the friction into an assignment.
  2.  **Use "Conjunctures" instead of "Periods":** Historian Jerry Bentley suggested focusing on moments of *cross-cultural interaction* (e.g., "The Age of Steppe Empires" instead of "Medieval"). In your sections, emphasize the *connections* (Mongols, Indian Ocean) that justify the shared timeline, rather than the labels themselves.
  3.  **Highlight Asynchronicity:** When the lecture says "Europe wasn't the center," back that up by showing asynchronous development. *"In 1400, the 'Early Modern' label might fit the Indian Ocean trade, but it doesn't fit the political structure of the Americas. Why?"*
  4.  **The "Wait, When?" Game:** If a student asks, "What was China doing during the Renaissance?" don't just give the date. Ask, "Does 'Renaissance' mean anything in China? If not, what is the equivalent period of cultural flourishing called there, and why don't they line up?"

  ### Summary

  *   **Euro-Derived Periodization:** Commits you to a universal theory of development. **Cost:** Erases local rhythms and implies a "race" where Europe leads. **Benefit:** Enables comparison and explains global connectivity.
  *   **Regional Periodization:** Commits you to cultural relativism and internal causality. **Cost:** Erases connectivity and makes global comparison impossible. **Benefit:** Respects local logics of time and change.

  The syllabus you are working with is trying to have it both ways: using the **benefit** of the Euro-model (shared time for comparison) while trying to deny the **cost** (Eurocentrism).

  Your role as a TA is to point out that the map is not the territory. The timeline is a grid we lay over the past to make it legible; it is not the past itself. If you make that explicit to your students, you turn a flawed syllabus structure into a sophisticated lesson on historical thinking.
