      *   Be balanced: Don't just bash the Euro-model (it has utility for comparison) but don't let it slide as "just a label."

  8.  **Self-Correction/Nuance Check during drafting:**

      *   *Check:* Did I answer "what does it cost us?" Yes, need to emphasize specific questions that become hard to ask (e.g., "What was happening in Song China while Europe was 'Feudal'?").
