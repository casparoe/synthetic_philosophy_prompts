  ### The Vanishing Leverage of Evidential Cooperation in Large Populations

  **Thesis:** In a one-shot coordination dilemma with $N$ autonomous agents, the evidential-cooperation argument fails to ground a rational basis for cooperation as $N \to \infty$. While an agent's action provides evidence about a shared population disposition, the *magnitude* of the evidential update regarding the other $N-1$ agents saturates to a constant bound. Consequently, for any fixed cost of cooperation and "weak" correlation, the expected evidential benefit is overwhelmed by the direct cost as the system scales.

  #### 1. The Model and the Evidential Condition

  Consider $N$ agents playing a simultaneous one-shot game. Each agent $i$ chooses an action $a_i \in \{C, D\}$ (Cooperate, Defect).
  *   **Payoff:** The utility for agent $i$ is $U_i = -c \cdot \mathbb{I}(a_i=C) + b \cdot \sum_{j \neq i} \mathbb{I}(a_j=C)$, where $c > 0$ is the cost of cooperating and $b > 0$ is the benefit received from each other cooperator. We assume a dilemma structure where $c > b$ (unilateral cooperation is net negative).
  *   **Common Cause:** Agents share a common-cause prior over an unknown population disposition parameter $\theta \in [0,1]$. Conditional on $\theta$, agents act independently with $P(a_i=C \mid \theta) = \theta$.
  *   **Prior:** The agents share a prior density $p(\theta)$ with mean $\mu$ and variance $\sigma^2$.

  Under Evidential Decision Theory (EDT), an agent should cooperate if the expected utility of $C$ exceeds that of $D$. Since the direct cost $-c$ is certain, the agent cooperates only if the *evidential gain* from the other agents' actions outweighs $c$:
  $$ b \cdot \left( E\left[\sum_{j \neq i} a_j \;\middle|\; a_i=C\right] - E\left[\sum_{j \neq i} a_j \;\middle|\; a_i=D\right] \right) > c $$
  By symmetry, the expected sum of others is $(N-1) P(a_j=C \mid a_i)$. Let $\Delta P = P(a_j=C \mid a_i=C) - P(a_j=C \mid a_i=D)$. The condition simplifies to:
  $$ b \cdot (N-1) \cdot \Delta P > c $$

  #### 2. Scaling the Evidential Update

  The term $\Delta P$ represents the evidential leverage of one's own action. We derive this using Bayes' rule and the law of total probability.
  $$ P(a_j=C \mid a_i=C) = \int_0^1 \theta \cdot p(\theta \mid a_i=C) \, d\theta = E[\theta \mid a_i=C] $$
  Using the likelihood $P(a_i=C \mid \theta) = \theta$, the posterior is $p(\theta \mid a_i=C) \propto \theta p(\theta)$. Thus:
  $$ E[\theta \mid a_i=C] = \frac{E[\theta^2]}{E[\theta]} = \frac{\sigma^2 + \mu^2}{\mu} = \mu + \frac{\sigma^2}{\mu} $$
  Similarly, for defection ($P(a_i=D \mid \theta) = 1-\theta$):
  $$ E[\theta \mid a_i=D] = \frac{E[\theta(1-\theta)]}{1-\mu} = \frac{\mu - (\sigma^2 + \mu^2)}{1-\mu} = \mu - \frac{\sigma^2}{1-\mu} $$
  The shift in belief about the disposition is:
  $$ \Delta E[\theta] = E[\theta \mid C] - E[\theta \mid D] = \sigma^2 \left( \frac{1}{\mu} + \frac{1}{1-\mu} \right) = \frac{\sigma^2}{\mu(1-\mu)} $$
  Since $P(a_j=C \mid a_i) = E[\theta \mid a_i]$, we have $\Delta P = \Delta E[\theta]$. Note that $\frac{\sigma^2}{\mu(1-\mu)}$ is exactly the correlation coefficient $\rho$ between any pair of agents' actions.
  Substituting this into the cooperation condition:
  $$ b \cdot (N-1) \cdot \rho > c $$

  #### 3. The Statistical Stability Assumption

  The crucial question is how the correlation $\rho$ behaves as $N \to \infty$. The prompt specifies that actions are "weakly correlated" due to a "population disposition."

  **Assumption (Statistical Stability):** In a distributed system of $N$ autonomous agents, the "population disposition" $\theta$ represents an aggregate statistical property (e.g., the expected fraction of cooperators). As $N$ increases, the epistemic uncertainty regarding the aggregate behavior of a large population must decrease. Specifically, for a rational prior over a population mean of size $N$, the variance $\sigma^2$ of the disposition parameter must scale as $O(1/N)$.

  *Justification:* If $\theta$ were a fixed metaphysical constant independent of $N$ (implying $\sigma^2$ is constant), the correlation $\rho$ would be constant. However, this contradicts the physical reality of large distributed systems where "population disposition" implies an emergent macroscopic state. In statistical mechanics and large-scale systems, relative fluctuations of aggregate properties vanish as $1/\sqrt{N}$, meaning the variance of the mean scales as $1/N$. A rational agent's prior uncertainty should reflect this stability; otherwise, the agent assumes the system becomes *more* volatile per capita as it grows, which contradicts the "autonomous agent" premise.

  Therefore, we posit $\sigma^2 \approx \frac{k}{N}$ for some constant $k$. Consequently, the correlation scales as:
  $$ \rho \approx \frac{k}{N \cdot \mu(1-\mu)} \propto \frac{1}{N} $$

  #### 4. The Limit of Evidential Gain

  Substituting the scaling $\rho \propto 1/N$ into the evidential gain equation:
  $$ \text{Evidential Gain} = b \cdot (N-1) \cdot \rho \approx b \cdot N \cdot \frac{k'}{N} \approx b \cdot k' $$
  where $k'$ is a constant determined by the prior's shape and the "weakness" of the correlation.

  **Result:** As $N \to \infty$, the total evidential benefit does **not** grow linearly with $N$. It saturates to a constant value $O(1)$.

  #### 5. Conclusion

  The evidential-cooperation argument relies on the intuition that "my cooperation signals that *many* others will cooperate." While it is true that my cooperation signals a higher disposition $\theta$, the **magnitude** of that signal dilutes as the population grows.

  1.  **Dilution of Evidence:** In a large system, a single data point (my action) provides vanishingly small information about the aggregate disposition ($\Delta E[\theta] \propto 1/N$).
  2.  **Cancellation of Scale:** This $1/N$ dilution exactly cancels the $N$ increase in the number of beneficiaries.
  3.  **Rational Outcome:** The total expected benefit from others' cooperation remains bounded. Since the cost of cooperation $c$ is fixed and positive, and the correlation is "weak" (implying the constant $k'$ is small), the inequality $b \cdot k' > c$ will generally fail.

  Thus, for very large $N$, the evidential value of one's action is insufficient to justify the cost of cooperation. The rational basis for cooperation collapses not because the correlation disappears, but because the **epistemic leverage** of a single agent over a large population's disposition becomes negligible.

  **Dependencies:**
  *   **Prior Scaling:** The argument depends on the assumption that rational uncertainty about a population disposition scales inversely with population size ($\sigma^2 \propto 1/N$).
  *   **Definition of Disposition:** It treats $\theta$ as an aggregate statistical property rather than a fixed broadcast signal independent of $N$.
  *   **Weak Correlation:** It assumes the "weak" correlation constraint holds structurally as $N$ grows, preventing $\rho$ from remaining constant.
