prompt: |-
  My friend and I spent most of last night arguing about whether the size of a creature's brain — or, more carefully, the quantity of neural machinery its mind runs on — can be morally relevant in its own right, rather than merely as a rough proxy for capacities we already agree matter. I would be grateful for a thought experiment built to the specifications set out below, because I have come to think that this particular dispute will not be settled by further talk: it needs a case.

  Her position, as I finally got it into focus, was this. The sheer amount of conscious processing a being can sustain is part of what makes it the kind of thing whose interests carry the weight that ours do; and since we have no way of comparing minds that run on different architectures except by looking at the hardware, quantity is where moral reasoning has to start. She pressed the point that a sperm whale's brain is several times the mass of ours, and that corvids solve problems that would tax a primate with a brain a fraction of the volume, and asked why I was so confident the volume was doing no work at all.

  I gave two replies. First, that what matters is what the machinery does — the capacities, the conscious life, the relationships, the projects — and that if all of those are held fixed, no difference in the amount of tissue left over could make a moral difference; to think otherwise is, I said, to mistake a fact about the implementation for a fact about the thing implemented, rather as one would be mistaking something to think a symphony gains in worth when it is stored at a higher bit rate. Secondly, that if quantity matters only because it happens to track psychology, then it is not quantity that is doing the work, and we should say so and stop talking about brains.

  She answered that the recording analogy fails, because with minds — unlike symphonies — the amount of processing is not separable from what is experienced; and that behaviour is a hopeless guide in any case, since behaviour passes through a narrow bottleneck. A being running on a fraction of the machinery cannot, she said, be living as rich a mental life, whatever it says and does. So my move of holding the psychology fixed assumes the very point in dispute: that a psychology can float free of how much machinery realises it.

  I said that on that reading her view is unfalsifiable, since no possible evidence could show that a small-brained being was our moral equal — she would always reply that its inner life must be thinner. If the claim is that quantity and richness are glued together by natural law, then fine; but then it is richness that does the moral work and quantity is only our evidence for it. She said that was no objection at all: moral standing has to be judgeable from the outside, by creatures like us, and if in every case we shall ever face the quantity of grey matter is the best available evidence of richness, then quantity is exactly what we ought to reason from, and my distinction between the intrinsically relevant and the merely evidentially relevant makes no practical difference whatsoever.

  We ended by each conceding something, and I take the concessions to fix what would count as cheating. Under pressure from the whale, she granted that if a being's mental life were exactly as rich as a normal human being's, and its relationships, projects and prospects were human ones, then it would be owed exactly what we are owed, whatever the volume of tissue involved. I granted that if a being's mental life really were thinner — fewer things mattering to it, less at stake for it — then at some point its claims upon us are weaker, even if its behaviour looks perfectly normal. So the case I want must not do its work by quietly impoverishing anyone's psychology, and it must not simply stipulate its conclusion. I shall keep my own attempt to myself for now, so as not to anchor you.

  Specifications for the case:

  1. One paragraph, in the indicative mood, and biologically honest: no uploading, no artificial substrates, no implanted hardware, no engineered species. Natural aetiology only. Preferably both subjects are human, so that species membership and our special attachments to our own kind do no work; if you cannot get a large enough gap that way, use the nearest non-human case, say plainly that you have, and explain how species membership is neutralised.
  2. The gap in neural quantity must be large — at least a factor of three or four in whichever quantity you settle on — since anything smaller looks like the sort of individual variation neither of us has ever cared about.
  3. Everything else that either of us thinks relevant must be held fixed: behaviour across a lifetime, the conscious repertoire (reported and evidenced), relationships, projects, and future prospects.
  4. Size and count must come apart. Build it so that brain mass and total neuron number point in opposite directions, so that anyone attracted to quantity has to say which quantity they meant and why that one. (I take it this is biologically possible, since packing density and cell size vary; if you think it is not, say so and propose two better metrics that do dissociate.)
  5. No smuggling. The difference between the subjects must be neural, not psychological: you may not stipulate a difference in the richness, unity or depth of anyone's mental life, since that is the move under dispute. But the biology must still be coherent — name the mechanism (redundancy, cortical reorganisation, packing density, coding efficiency, whatever you like) that allows the same psychology to run on the different quantity.
  6. It must be checkable from the outside. With the sort of evidence we could actually have — lifetime behaviour, clinical testing, imaging, the subject's own reports — we must be able to tell that the psychology is held fixed. Otherwise her fallback, that quantity is simply our best evidence, survives the case untouched.
  7. A matched control: a second case, differing from the first in exactly one respect, in which my friend and I would both agree that the verdict flips. This is to show that it is the quantity, and not something that travelled along with it, that is doing the work.

  What I want after the scenario:

  - What each of three views says, and why: (a) that volume or mass matters, (b) that neuron number matters, (c) that only the psychology matters and the hardware is irrelevant.
  - Which single feature of the case is doing the work, and what happens to the verdicts if you remove it.
  - What my friend would say by way of attack, in its strongest form. I expect her to say that a case which breaks the usual link between tissue and mentality is a bare metaphysical possibility and that moral standing has to be settled by what is actually possible — but tell me what you think the best version of that objection is, and whether it lands.
  - An honest note on whether the specifications can all be met together, and if not, which one you would drop and what its being unsatisfiable tells us about the original argument.
