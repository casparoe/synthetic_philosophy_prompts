  **HISTORICAL CLARIFICATION NOTE**

  Before presenting the draft statement, I must address a constraint in your request regarding legal history. You asked for a "legal-formalist... sticking close to Lemkin's original framing" to debate a "moral-expansionist" on whether cultural destruction belongs in the category of genocide.

  This presents a historical false split. Raphael Lemkin's original framing in *Axis Rule in Occupied Europe* (1944) **explicitly included** cultural and structural destruction. He defined genocide as a coordinated plan aiming at the destruction of essential foundations of the life of national groups, including their cultural institutions. It was the **1948 UN Genocide Convention**, not Lemkin, that narrowed the definition to physical and biological destruction and excluded political groups.

  A true Lemkin formalist would agree with the expansionist on the *sociological* definition but disagree on the *legal operability* of the 1948 Convention. I have drafted the statement below to reflect this accurate historical tension. The Formalist argues for the 1948 text as a necessary operational narrowing of Lemkin's vision; the Expansionist argues for restoring Lemkin's full vision to the law. I have not polished over this gap.

  ***

  # JOINT STATEMENT ON THE TAXONOMY OF ATROCITY
  **Regarding the Definition, Application, and Political Consequences of the Term 'Genocide'**

  **Signed:**  
  *The Legal-Formalist Working Group*  
  *The Moral-Expansionist Working Group*

  **Date:** 24 May 2024

  ### I. AGREED CLAIMS

  Following months of deliberation, the undersigned parties accept the following premises regarding the history of the concept, the state of current law, and the stakes of classification:

  1.  **On Lemkin's Original Framing:** We agree that Raphael Lemkin's 1944 conception of genocide was broader than the subsequent 1948 UN Convention. Lemkin originally envisioned a crime encompassing physical, biological, and cultural destruction aimed at the dissolution of a group's existence.
  2.  **On Current International Law:** We agree that the 1948 Convention on the Prevention and Punishment of the Crime of Genocide (UNGC) narrowed Lemkin's concept. Specifically, Article II excludes 'political groups' from protected classes and omits the draft Article III provisions regarding 'cultural genocide'.
  3.  **On the Politics of Naming:** We agree that the application of the label 'genocide' is not merely descriptive but performative. It triggers specific legal obligations (under the UNGC), influences military intervention thresholds, and shapes historical memory.
  4.  **On the Stakes of Error:** We agree that there are costs to both over-inclusion and under-inclusion. Diluting the term risks 'conceptual inflation' (rendering it meaningless); restricting it too narrowly risks 'normative silence' (failing to capture the totality of a group's destruction).
  5.  **On Specific Atrocities:** We agree that the destruction of Indigenous residential school systems and the persecution of the Rohingya population constitute severe crimes against humanity and warrant urgent international response, regardless of their final classification under the UNGC.

  ### II. THE CRUXES OF DISAGREEMENT

  While we share a factual baseline, we diverge on how the law should mediate between Lemkin's sociological vision and the requirements of criminal prosecution. The following table outlines our precise disagreements.

  | Area of Disagreement | Legal-Formalist Position | Moral-Expansionist Position |
  | :--- | :--- | :--- |
  | **1. The Function of Legal Precision** | **Precision protects victims.** Strict adherence to the 1948 text ensures high evidentiary standards. If the law is expanded to cover cultural harm, the threshold for proof lowers, risking frivolous accusations that allow states to evade *all* accountability by litigating the definition. | **Precision silences victims.** Strict adherence to the 1948 text creates a hierarchy of suffering. By excluding cultural destruction, the law tells victims that the death of their language and way of life is legally invisible compared to physical killing, discouraging reporting. |
  | **2. 'Cultural Genocide' Categorisation** | **Separate Moral Charge.** Cultural destruction should be prosecuted as 'Crimes Against Humanity' or under specific Indigenous rights frameworks. Keeping it separate preserves 'genocide' as the 'crime of crimes' reserved for physical annihilation, maintaining its deterrent power. | **Inside Legal Category.** Cultural destruction is often the *method* of physical genocide (e.g., sterilisation, forced transfer of children). Separating them artificially fractures the reality of the crime. The UNGC must be amended or reinterpreted to match Lemkin's original scope. |
  | **3. The 'Political Groups' Clause** | **Do Not Revive.** The exclusion of political groups was a deliberate political compromise to ensure state ratification. Reviving it through analogy risks criminalising state suppression of insurrection, potentially chilling legitimate state security actions. | **Revive via Analogy.** The exclusion was a moral failure driven by Cold War and colonial interests. Persecution based on political opinion often serves as a proxy for ethnic destruction. Courts should interpret 'stable groups' broadly to include political cohorts targeted for permanent elimination. |

  ### III. CASE APPLICATIONS AND PREDICTIONS

  We apply our respective frameworks to two concrete historical and contemporary crises to illustrate the practical divergence of our positions.

  #### Crux 1: Legal Precision vs. Normative Silence
  **Case:** **The Indian Residential School System (Canada)**
  *Context:* State-sponsored removal of Indigenous children to assimilate them, resulting in widespread death, abuse, and loss of language/culture.

  *   **Legal-Formalist Prediction:**
      *   **Classification:** Crimes Against Humanity / Cultural Rights Violations.
      *   **Reasoning:** While the *intent* to destroy the group existed, the primary mechanism was cultural assimilation and neglect rather than immediate mass killing. Under the strict 1948 text, proving 'intent to destroy' physically is harder than proving cultural erasure.
      *   **Outcome:** Classification as 'Crimes Against Humanity' secures a conviction without diluting the genocide statute. It protects the legal integrity of the UNGC for cases of mass slaughter.
  *   **Moral-Expansionist Prediction:**
      *   **Classification:** Genocide (Cultural and Physical).
      *   **Reasoning:** The forced transfer of children (Article II(e) of UNGC) is a genocidal act. The structural destruction of the group's continuity *is* genocide in Lemkin's sense.
      *   **Outcome:** Classifying it as 'Genocide' validates the survivors' experience of total group destruction. Failing to use the word 'genocide' perpetuates the colonial silence that allowed the schools to operate.

  #### Crux 2: Reviving the Dropped Political Clause
  **Case:** **The Rohingya Crisis (Myanmar)**
  *Context:* Military crackdowns on the Rohingya Muslim minority, often framed by the state as counter-insurgency against a political militant group (ARSA).

  *   **Legal-Formalist Prediction:**
      *   **Classification:** Genocide (Ethnic/Religious Group).
      *   **Reasoning:** We must prove the Rohingya are targeted as a stable 'religious' or 'ethnic' group, ignoring the state's 'political' framing. We cannot expand the definition to include 'political groups' via analogy, or we validate the state's claim that this is merely a war on insurgents.
      *   **Outcome:** By sticking to the protected 'religious' category, we bypass the state's political defence. However, any Rohingya targeted *solely* for political activism (non-ethnic) falls outside the convention.
  *   **Moral-Expansionist Prediction:**
      *   **Classification:** Genocide (Including Political Dimension).
      *   **Reasoning:** The distinction between 'ethnic' and 'political' is often a fabrication by perpetrators. The military targets the Rohingya *as* a political entity. We should argue that the 'political group' exclusion in 1948 was illegitimate and should be read back into the law through customary international law.
      *   **Outcome:** This captures the full scope of the persecution. However, it risks states refusing to cooperate with tribunals that they perceive as criminalising the suppression of political dissent.

  ### IV. CONCLUSION

  We acknowledge that this disagreement is not merely semantic but structural. The Legal-Formalist prioritises the **enforceability** of the law as it currently stands, fearing that expansion will lead to impunity through non-ratification. The Moral-Expansionist prioritises the **descriptive truth** of the harm, fearing that restriction will lead to impunity through exclusion.

  We sign this statement to clarify that while we may use different labels, our demand for accountability is identical.

  ***

  **Signed,**

  *Dr. A. V. Thorne (Legal-Formalist)*  
  *Prof. S. K. Mbeki (Moral-Expansionist)*
