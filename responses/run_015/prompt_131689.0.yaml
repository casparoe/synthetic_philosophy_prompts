answer: |-
  This deadlock is not a verbal dispute, nor is it merely a case of participants talking past one another about phenomenology versus metaphysics. It is a **hidden substantive disagreement** regarding the meta-ethical architecture of normative reasons. Specifically, your seminar is debating Reason Atomism versus Reason Holism under the guise of a normative ethics problem. The "Additive" theorists are committed to the view that reasons are discrete, countable entities that retain their identity and weight regardless of context (Atomism). The "Reconfigurative" theorists are committed to the view that reasons are holistic properties whose force and existence depend on the total configuration of the normative landscape (Holism). The reason no standard case has moved anyone is that both meta-ethical frameworks are sufficiently flexible to accommodate the same practical outputs (extensions) while offering radically different explanations (intensions). When both sides agree that a coerced promise is void, the Additive theorist says the "weight" of the promise was zeroed out by the coercion condition, while the Reconfigurative theorist says the "shape" of the normative landscape was distorted such that no obligation could form. Because both models are engineered to save the phenomena of ordinary moral practice, arguing about the phenomena will never resolve the dispute about the underlying machinery.

  Progress, therefore, will not come from inventing new promise-breaking cases, but from shifting the debate explicitly to the meta-ethics of action. The group must stop asking "Why do promises bind?" and start asking "What is the metaphysical status of a normative reason?" If they can agree that their disagreement is about whether reasons are context-independent entities or context-dependent relations, they may realize they are choosing between two comprehensive theories of normativity rather than two theories of promising. At that point, progress looks like evaluating which meta-ethical framework offers greater explanatory power across all domains of ethics, not just promising. If one framework fails to explain aesthetic obligations or epistemic norms as well as the other, that external pressure might break the deadlock. Until then, the stalemate is rational because both sides are correctly deducing consequences from incompatible but internally coherent meta-ethical axioms.

  The "deferred preference revelation" framing illuminates this hidden substantive divide because it isolates the persistence conditions of the obligation. In this scenario, the Additive view has a distinct explanatory advantage. If a promise is an added weight, that weight exists as an entity independent of the agent's internal psychological shifts; the reason survives the preference change because it was deposited into the normative account at T1. The Reconfigurative view struggles here: if the obligation is a configuration of the agent's normative landscape, and the agent's preferences (a key part of that landscape) shift at T2, the Reconfigurative theorist must argue that the initial configuration was rigid enough to withstand internal structural changes. While not impossible, this requires additional ad hoc assumptions about the stability of normative configurations. The Additive view naturally predicts that the obligation binds the future self despite preference shifts because the reason is an external additive fact, not an internal structural state. Thus, this case favors the Additive view, not because it proves promises bind, but because it aligns better with an atomistic metaphysics of reasons that persist across internal change.

