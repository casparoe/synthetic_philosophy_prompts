  You are a professional moral philosopher with expertise in conceptual analysis and the philosophy of action. Before you answer, please take a few minutes to brainstorm the major structural possibilities—verbal dispute, hidden substantive disagreement, cross-purpose questioning, bedrock intuition, or ill-posed problem—then think carefully and commit to a diagnosis rather than surveying options.

  In my advanced normative-ethics seminar, our study group has been deadlocked for months on why promises bind, and the stall has a very specific shape. Everyone accepts that promises generate obligations that are not reducible to general utility, harm-avoidance, or mere predictions of future behavior; everyone also agrees on the standard boundary conditions—coerced promises are void, promises to do wrong carry no binding force, and breaking without excuse demands apology and sometimes compensation. The split is between what we call “additive-reason” theorists and “reconfigurative-reason” theorists. The additive side holds that making a promise literally introduces a new normative reason that stacks onto pre-existing ones, as if placing an extra weight on one pan of a scale; the reconfigurative side holds that a promise does not add a reason but transforms the normative landscape, reorganizing how existing reasons relate to one another, like reshuffling weights rather than adding one. Both sides interpret every standard case—apology after breach, the invalidity of coerced promises, the override by stronger moral considerations—through their own lens, and no case we have introduced in a year has moved anyone. My working hypothesis is that this is either a verbal disagreement about whether “reason” is being used in a generative or organizational sense, or that the two sides are actually answering different questions—one about the phenomenology of felt obligation, one about the metaphysics of normative change—under the single heading “why do promises bind.” There may also be a hidden empirical claim lurking: do people actually experience promise-breaking as the violation of an independently existing commitment, or as the disruption of an expected equilibrium?

  Please diagnose the disagreement with definite commitment: tell me whether it is verbal, a hidden substantive dispute, cross-purpose questioning, bedrock intuition, or a sign that the question is ill-posed, and support your diagnosis with what each side actually says about the standard cases. Then say what, if anything, would count as progress given your diagnosis—a conceptual distinction, a targeted thought experiment, an empirical study of moral psychology, or an argument that no progress should be expected. To keep the analysis concrete, I want you to apply your diagnosis to a framing I have been developing called “deferred preference revelation”: situations in which both promisor and promisee know that the promisor’s future preferences will likely shift in predictable ways, and they must decide whether the promise binds the present self to constrain those future options (favoring the reconfigurative view) or binds the future self directly via a reason that survives preference change (favoring the additive view). Use this framing only if it illuminates your structural diagnosis.

  Present your argument in clear, committed prose. After the prose, provide a brief structured summary as a JSON object with exactly these fields: “diagnosis_type” (string: choose verbal, hidden_substantive, cross_purpose, bedrock_intuition, or ill_posed), “core_hidden_question” (string, one sentence describing the hidden divide if any), “what_progress_looks_like” (string), “deferred_preference_prediction” (string: which theory the case favors and why), and “confidence_level” (string: high, moderate, or low, with a one-sentence justification in the value).
