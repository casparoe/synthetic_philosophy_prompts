answer: |-
  ### Taxonomy of Commitments on Tragic Choice

  **Root Case:** A decision-maker must either **destroy a unique, irreplaceable work of communal cultural heritage** (e.g., burn the only copy of a sacred text to clear a firebreak) or **allow a preventable human death** (e.g., refuse to divert resources to save a life). Both losses resist translation into any shared scale of value.

  ---

  #### Branch 1: The Metaphysics of Comparison
  **Question:** In this specific case, is there a single determinate truth about which option is objectively more valuable, even if human beings cannot calculate it, or is there fundamentally no such truth to be found?

  *   **(A) There is a determinate truth (Epistemic Limitation):** A fact exists about which option is better, but we lack the access or metric to know it with certainty.
  *   **(B) There is no determinate truth (Ontological Incommensurability):** Values are distinct in kind; no fact of the matter exists regarding which is "more valuable" overall.

  ---

  #### Branch 2: The Status of the Aftermath
  **Question:** Once the decision is made and executed, does the agent remain under a genuine normative demand (such as reparations, mourning, or apology) regarding the value they sacrificed, or is the moral ledger fully balanced by the act of choosing the right option?

  *   **(A) Normative Demand Remains (Moral Residue):** The agent owes something to the lost value; the choice does not wipe the slate clean.
  *   **(B) Ledger Fully Balanced (Clean Closure):** Choosing the correct option exhausts the agent's obligations; no further normative debt is incurred.

  ---

  #### Branch 3: The Rationality of Post-Choice Judgment
  **Question:** Is it rational for the agent to maintain that the unchosen option was genuinely better—without retracting the choice itself—or is such a judgment inappropriate or incoherent?

  *   **(A) Judgment is Rational (Rational Regret):** One can correctly believe the unchosen option was better while affirming the choice made was the one to execute.
  *   **(B) Judgment is Inappropriate (Rational Consistency):** If the choice was correct, judging the unchosen option as "better" is an error in reasoning or merely a psychological feeling.

  ---

  ### Classification Leaves

  #### Path 1: No Truth (1B) + Residue (2A) + Rational Regret (3A)
  *   **Position Name:** **Strong Value Pluralism** (e.g., Williams, Nussbaum)
  *   **Awkward Commitment:** Rational agents must sometimes act without a sufficient reason that determines the choice as uniquely correct.

  #### Path 2: No Truth (1B) + Residue (2A) + Judgment Inappropriate (3B)
  *   **Position Name:** **Ritualist Conventionalism** (Unnamed/Rare)
  *   **Awkward Commitment:** We must mourn losses we admit were not objectively worth saving, making grief a matter of social compliance rather than truth.

  #### Path 3: No Truth (1B) + No Residue (2B) + Rational Regret (3A)
  *   **Status:** **⚠ UNOCCUPIED / UNSTABLE**
  *   **Diagnosis:** **Practical Unattractiveness.** If values are incommensurable and the ledger is closed, claiming the unchosen was "better" renders the closure arbitrary; it suggests the agent is emotionally attached to a normative error they claim doesn't exist.

  #### Path 4: No Truth (1B) + No Residue (2B) + Judgment Inappropriate (3B)
  *   **Position Name:** **Disjunctive Rationality** (e.g., early Chang)
  *   **Awkward Commitment:** Values are fundamentally distinct, yet choosing one entirely erases the normative claim of the other, making the loss morally weightless.

  #### Path 5: Determinate Truth (1A) + Residue (2A) + Rational Regret (3A)
  *   **Status:** **⚠ LOGICAL TENSION** (The Agent-Relative Exception)
  *   **Diagnosis:** **Logical Incoherence (mostly).** If a determinate truth exists that Option X is better, judging Option Y "better" is false. This slot is only occupiable if "better" shifts meaning (e.g., "better for me" vs. "better simpliciter"), which contradicts the phrasing of Branch 1.

  #### Path 6: Determinate Truth (1A) + Residue (2A) + Judgment Inappropriate (3B)
  *   **Position Name:** **Moderate Deontology** (e.g., Rossian Intuitionism)
  *   **Awkward Commitment:** An agent can fulfill all objective duties and yet remain morally "dirty" or indebted simply for having been in the dilemma.

  #### Path 7: Determinate Truth (1A) + No Residue (2B) + Rational Regret (3A)
  *   **Status:** **⚠ UNOCCUPIED / INCOHERENT**
  *   **Diagnosis:** **Logical Incoherence.** If a fact dictates the choice and the ledger is closed, maintaining the unchosen was "better" is a direct contradiction of the metaphysical and normative premises.

  #### Path 8: Determinate Truth (1A) + No Residue (2B) + Judgment Inappropriate (3B)
  *   **Position Name:** **Robust Monism** (e.g., Classical Utilitarianism)
  *   **Awkward Commitment:** The destruction of unique heritage is not a distinct kind of tragedy, but merely a dispreferred quantity on a single scale of value.

  ---

  ### Meta-Analysis: Settled vs. Contested in Value Theory

  To use this instrument effectively in your seminar, distinguish between the phenomenological data (broadly settled) and the metaphysical/normative explanations (genuinely contested).

  **1. Broadly Settled (The Phenomenology of Dilemma)**
  *   **Agreement:** Most specialists agree that agents *experience* tragic choices as involving conflicting claims that cannot be easily weighed. There is consensus that the *feeling* of moral residue (guilt, grief, need for repair) is a widespread human response to such cases.
  *   **Disagreement:** Whether this experience tracks reality or is a cognitive illusion.

  **2. Genuinely Contested (The Metaphysics of Value)**
  *   **The Nature of Incommensurability:** There is no consensus on whether Branch 1(A) or 1(B) is correct. Monists argue that rational choice requires a common metric (even if unknown); Pluralists argue that the lack of a metric is a feature of value itself, not a bug in our knowledge.
  *   **The Normativity of Residue:** It is **not** consensus that moral residue requires ontological pluralism. Some monists (e.g., certain consequentialists) argue residue is a useful heuristic for future behavior, while some pluralists argue residue is a metaphysical remainder. Do not assume Branch 1(B) forces Branch 2(A).
  *   **Rationality of Regret:** There is significant debate over Branch 3. "Rational Regret" (3A) is often associated with the idea that reasons are not exhaustive of rationality (Williams), whereas "Rational Consistency" (3B) is tied to the view that rationality requires alignment between judgment of value and judgment of action.

  **3. Instruction for Auditors**
  *   Do not ask participants which "ism" they subscribe to.
  *   Ask them to walk the tree using the Heritage vs. Life case.
  *   If a participant lands in an **Unoccupied** or **Logical Tension** leaf, press them on whether they are willing to revise their answer to Branch 1, 2, or 3, or if they accept the awkward commitment identified. This reveals whether their position is a stable theoretical stance or an unexamined intuition.
