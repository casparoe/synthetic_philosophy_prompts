answer: |-
  ### Exam Question (25 Marks)

  **Question 4: Standing, Hypocrisy, and Moral Authority**

  Consider the following case:
  In a small workplace, the Boss engages in a specific form of exploitation (Action X). Action X is genuinely wrong.
  *   **Agent A** committed Action X two years ago. A was sanctioned, accepted the blame, underwent genuine moral reform, and has not done X since. A is now the only person willing to call out the Boss.
  *   **Agent B** has never committed Action X. However, everyone knows B has never done X only because the opportunity never arose. B admits that if the opportunity had arisen, B would have done X.

  When A blames the Boss, the Boss replies: "You did X yourself. You have no standing to blame me."

  1.  Distinguish three distinct moves the Boss could be making in this reply. Specifically, separate (i) denying the wrongness of X, (ii) challenging A's standing to blame, and (iii) issuing a counter-complaint about A's character. Explain why conflating these allows the Boss to evade responsibility.
  2.  Assume Action X is wrong. Who has more standing to blame the Boss: A (the reformed wrongdoer) or B (the lucky non-wrongdoer)? Defend your answer.
  3.  Based on your answer to (2), explain what "standing to blame" actually is. Is it primarily an epistemic cue about the blamer's reliability, or a normative power rooted in moral authority? Justify your view.

  *(Suggested length: ~1000 words)*

  ***

  ### Model Answer

  The Boss's reply attempts to shut down moral criticism by attacking the critic rather than the criticism. To evaluate this, we must first disentangle the distinct logical moves available to the Boss, as conflating them is the primary mechanism by which blame is evaded.

  First, the Boss could be denying that Action X is wrong. This is a first-order moral claim. If X isn't wrong, no one has a reason to blame anyone for it. Second, the Boss could be challenging A's *standing* to blame. This accepts that X is wrong but claims A lacks the specific normative authority to hold the Boss accountable for it. Third, the Boss could be issuing a counter-complaint ("you are a hypocrite"). This admits A has standing but adds a second moral grievance against A. Conflating these allows the Boss to evade responsibility because it shifts the conversation from the Boss's misconduct to A's history. If the Boss treats a standing challenge as a denial of wrongness, he implies X is permissible. If he treats a counter-complaint as a standing challenge, he implies that only the morally perfect can criticize, which silences all blame. We must assume X is wrong and determine if A's history negates her authority.

  Counter-intuitively, A (the reformed wrongdoer) has more standing to blame the Boss than B (the lucky non-wrongdoer). A standard view suggests standing requires "clean hands"—that one must not violate the norm one invokes. On this view, B should have more standing than A, because B has not violated the norm. However, this view mistakes standing for statistical purity. B's compliance is accidental; it stems from a lack of opportunity, not moral commitment. B admits they would have exploited the workplace if they could. Therefore, B's "clean hands" do not reflect a commitment to the norm against exploitation. B is merely a lucky bystander.

  In contrast, A's standing is rooted in moral engagement. A violated the norm, but crucially, A accepted sanction and reformed. This process demonstrates a deeper commitment to the norm than B possesses. A understands the cost of the norm and has actively realigned their will to respect it. When A blames the Boss, A is not speaking from a position of superiority, but from a position of shared moral community and repair. A's blame carries the weight of someone who has struggled with the temptation and chosen the right path. B's blame carries the weight of someone who hasn't been tested. If standing is about the authority to demand moral accountability, A has earned that authority through reform, whereas B has not earned it through virtue.

  This comparison reveals that standing is not merely an epistemic cue about reliability, but a normative power rooted in moral authority. If standing were purely epistemic—a heuristic for whether the blamer is a reliable judge of wrongness—one might argue B is more reliable because B hasn't recently done X. But this misunderstands the function of blame. Blame is not just a report on wrongdoing; it is a moral communication aimed at recognition and repair. For blame to function, it must come from someone who respects the norm enough to enforce it.

  The strongest consideration against this view is the "Equality Argument." This argues that standing requires equality of authority: you cannot hold others to a standard you exempt yourself from. Since A *did* exempt themselves from the norm in the past, A treats the Boss as a subordinate in a way B does not. A says, "I know this is wrong (because I did it and stopped)," but the Boss hears, "I am judging you for what I did." This suggests A's blame is tainted by a lack of respect for the Boss as an equal. B, having never done X, does not have this taint.

  However, the Equality Argument fails because it treats moral status as static. It assumes A is still the person who did X two years ago. But moral reform changes one's normative position. By accepting sanction and reforming, A has restored their equality with the Boss regarding this norm. B, conversely, lacks equality not because B did wrong, but because B lacks the moral seriousness to uphold the norm if tested. B's potential wrongdoing reveals a lack of respect for the norm itself, whereas A's reform reveals a profound respect for it.

  Therefore, standing is a normative power constituted by one's relationship to the moral community, not just one's history of compliance. It is the authority to call for accountability. A possesses this authority because A has validated the norm through the difficult work of reform. B lacks it because B's compliance is contingent on luck. If we deny A standing, we imply that once a wrongdoer, always a wrongdoer, which makes moral repair impossible and silences those most qualified to speak against the wrong. If we grant B standing, we privilege luck over virtue. Thus, the Boss's claim fails. A has the standing to blame because standing tracks moral commitment and the capacity for repair, not merely the absence of sin. The Boss's attempt to deflect is not a valid standing challenge, but a conversational derailment designed to protect misconduct by demanding an impossible purity from critics.

  ***

  ### Marking Scheme (25 Marks)

  **1. Distinguishing the Three Moves (5 Marks)**
  *   **5:** Clearly distinguishes (i) Denial of Wrongness, (ii) Challenge to Standing (Normative Authority), and (iii) Counter-complaint (Hypocrisy as a separate wrong). Explains that conflating (ii) and (iii) silences blame by implying only the perfect can criticize.
  *   **3-4:** Identifies the three moves but explains the consequence of conflation vaguely (e.g., "it's confusing" rather than "it evades responsibility").
  *   **0-2:** Conflates standing with hypocrisy or fails to separate denial of wrongness from the standing challenge.

  **2. The Verdict on A vs. B (5 Marks)**
  *   **5:** Definitively argues A has *more* standing than B.
  *   **3-4:** Argues A and B are equal, or hedges significantly without committing.
  *   **0-2:** Argues B has more standing based solely on "clean hands."

  **3. Explanation of the Verdict (Reform vs. Luck) (5 Marks)**
  *   **5:** Explicitly contrasts A's *commitment through reform* against B's *compliance through luck*. Notes that B's admitted disposition to do X undermines B's moral authority.
  *   **3-4:** Focuses on A's reform but fails to adequately analyze why B's luck is insufficient (e.g., just says "B is lucky" without linking it to moral commitment).
  *   **0-2:** Focuses only on A's past wrong without discussing B's counterfactual disposition.

  **4. Engagement with the Counter-Argument (5 Marks)**
  *   **5:** Articulates the "Equality Argument" (A violated the norm previously, creating asymmetry) as the strongest case for B or against A, and rebuts it by appealing to the possibility of moral repair/restoration of status.
  *   **3-4:** Mentions the counter-argument but rebuts it weakly (e.g., "A is better now" without explaining how that restores normative status).
  *   **0-2:** No counter-argument presented, or presents a strawman (e.g., "someone might say A is annoying").

  **5. The "A-Grade Move": Nature of Standing (5 Marks)**
  *   **5 (Distinction):** Defines standing as a **normative power rooted in the function of blame (moral communication/repair)** rather than an **epistemic cue (reliability/credibility)**. Explains that if standing were just reliability, B might win, but because it is about authority to demand accountability, A wins.
  *   **3-4 (B Grade):** Correctly identifies A > B and touches on authority, but treats standing primarily as "credibility" or "trustworthiness" (epistemic) rather than a normative power to hold accountable.
  *   **0-2 (C Grade):** Defines standing simply as "having clean hands" or fails to address the normative/epistemic crux.

  **Total: 25 Marks**

  **Grading Notes for TAs:**
  *   **The "A" Threshold:** To get 23-25, the student *must* hit the criterion in Point 5. They need to recognize that if standing were just about "who is a reliable judge," B is a strong contender. They must argue that standing is about the *right to hold accountable* derived from moral engagement, not just statistical purity.
  *   **The "B" Trap:** A common B-grade answer will correctly say A > B and talk about reform, but will describe standing as "being taken seriously" or "credibility." This misses the normative force (the *right* to blame vs. the *effectiveness* of blame).
  *   **The "C" Trap:** C-grade answers will typically conflate hypocrisy with standing (e.g., "A is a hypocrite so she can't blame") or argue B > A because "A did the crime."
