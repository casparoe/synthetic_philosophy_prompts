answer: |-
  Here is the dependency structure and lesson plan, designed for a whiteboard-only, no-reading session.

  ### 1. The Gloss Check
  Your working glosses are 80% there, but the **Forward-Looking (FL)** gloss is the danger zone.
  *   **Selected-Effect (SE):** "Why it is here" (History). *Correction:* Ensure you emphasize *past* success, not just "selection."
  *   **Causal-Role (CR):** "What it does" (Current Contribution). *Correction:* Emphasize contribution to a *containing system's capacity*, not just "any effect."
  *   **Forward-Looking (FL):** "What it will do" (Propensity). *Risk:* This easily collapses into "Current Utility" (what it does *now* that helps). You must define it as **fitness propensity in future environments**, even if it doesn't help now.
  *   **Verdict:** Tighten FL to: *"The contribution this trait makes to the organism's survival and reproduction in the **current and future** environment, regardless of history."*

  ### 2. Dependency Structure (The Whiteboard Map)
  You cannot state the theories until the students feel the *problem*. Draw this structure on the board as you go:

  1.  **Normativity (Minute 0–10):** We must establish that biological parts can be *broken*. Without "broken," "function" is just "effect."
      *   *Prerequisite:* None.
  2.  **Causal-Role (Minute 10–25):** The intuitive view. Function = Current Contribution.
      *   *Prerequisite:* A definition of "System" (e.g., the organism).
      *   *Vulnerability:* Cannot explain dysfunction (a broken heart still has causal effects).
  3.  **Selected-Effect (Minute 25–40):** The historical view. Function = Past Success.
      *   *Prerequisite:* Understanding of Natural Selection (Bio majors have this).
      *   *Vulnerability:* Vestigial organs (things that have history but no current use).
  4.  **Forward-Looking (Minute 40–55):** The propensity view. Function = Future Survival Value.
      *   *Prerequisite:* Distinction between "History" and "Future Propensity."
      *   *Vulnerability:* Pan-adaptationism (assuming everything helps survival).

  ### 3. The Opening Case: Stenosed Heart Valve
  **Does it tilt toward SE?** Yes, dangerously.
  "Supposed to" is etiological language. If you ask "What is this valve supposed to do?", Bio majors will answer "Pump blood" (SE) and Phil majors will answer "Sustain life" (CR/FL).

  **How to neutralize it:**
  Do not ask "What is it supposed to do?"
  Ask: **"This valve is stenosed (narrowed). It is still making sound, still moving blood, still vibrating. Why do we call it *broken*?"**
  *   Write their answers on the board.
  *   If they say "It doesn't pump enough," you have **CR**.
  *   If they say "It isn't doing what hearts evolved to do," you have **SE**.
  *   If they say "It will kill the organism," you have **FL**.
  *   *Pedagogical Move:* Do not validate any answer yet. Label them Theory A, B, and C. This keeps the playing field level.

  ### 4. The Carrying Case: The Enzyme vs. The Vestige
  **Your Candidate:** Plastic-chewing enzyme from directed evolution.
  **Verdict:** **Do not use this.**
  **Why:** It introduces "Experimenter Intention." In philosophy of biology, *Artifact Function* (designed by humans) is a separate debate from *Biological Function* (blind selection). If you use directed evolution, students will conflate "Selected-Effect" with "Designer Intent." You will spend 20 minutes disentangling the lab technician from Natural Selection.

  **What the Carrying Case Must Have:**
  1.  **Divergence:** History, Current Contribution, and Future Utility must point in different directions.
  2.  **Biological Purity:** No human designers, no artifacts.
  3.  **System Ambiguity:** It should be unclear what the "containing system" is (Organism? Population? Ecosystem?).

  **What the Carrying Case Must Lack:**
  1.  **Obvious Adaptation:** It cannot be a perfect trait (like a hawk's eye), or all three theories will agree.
  2.  **Human Intention:** No labs, no breeding programs.

  **Recommended Case: The Whale Pelvis.**
  *   **SE:** Function was locomotion (in ancestors).
  *   **CR:** Function is anchoring reproductive muscles (current contribution to system capacity).
  *   **FL:** Function is null (it adds weight, reduces fitness slightly, or is neutral).
  *   *Why this wins:* It forces the Bio majors to admit history matters (SE) and the Phil majors to admit current contribution matters (CR), while FL struggles to find a "future benefit."

  ### 5. Misconception Management (Timeline)

  | Minute | Misconception | Who brings it up? | How to head it off |
  | :--- | :--- | :--- | :--- |
  | **15** | *"CR makes any effect a function."* (Heart sounds) | Phil Majors | When defining CR, add the constraint: **"Contribution to a higher-level capacity."** Heart sounds don't help the circulatory capacity; pumping does. |
  | **25** | *"Selected for = Useful right now."* | Bio Majors | When introducing SE, draw a timeline. Mark "Past" (Selection) and "Present" (Environment). Explicitly cross them out if they differ. |
  | **35** | *"SE smuggles in a Designer."* | Phil Majors | Use the phrase **"Blind Retrospect."** Selection is a filter, not a chooser. Write "No Mind" on the board next to SE. |
  | **45** | *"Vestigial organs refute SE."* | Bio Majors | **Don't refute it; use it.** SE *predicts* vestigial organs have no function. CR says they do. This is a feature, not a bug. It shows the theories disagree. |
  | **60** | *"It's just verbal / depends what you mean."* | Everyone | **Do not concede.** See "Junk DNA" below. |

  ### 6. The Junk DNA Hook (Minute 55–60)
  This is where you kill the "merely verbal" objection.
  *   **Context:** The ENCODE project claimed 80% of the human genome is "functional." Evolutionary biologists screamed foul.
  *   **The Conflict:**
      *   ENCODE used **Causal-Role**: "If the DNA binds to a protein, it's doing something, so it's functional."
      *   Evolutionary Biologists used **Selected-Effect**: "If the DNA wasn't selected for, it's junk, even if it binds."
  *   **The Stakes:** If you use CR, most of the genome is functional. If you use SE, most is junk. This changes how we fund research and understand disease.
  *   **The Lesson:** It is not just verbal. Choosing a definition changes what you count as data.

  ### 7. The Closing Question (Minute 70–75)
  You need a question where "It depends" is not an answer because the *consequences* differ.

  **The Question:**
  > "We discover a gene in a population. It has **no history** of selection (it's a new mutation). It currently does **nothing** observable (neutral). But in **100 years**, the climate will change, and this gene **will save** the population.
  >
  > **Is this gene functional *today*?** Yes or No."

  **Why this works:**
  *   **SE says NO:** No history.
  *   **CR says NO:** No current causal contribution.
  *   **FL says YES:** Future fitness propensity.
  *   *Constraint:* They cannot say "It depends." They must choose whether *future potential* grants *present status*. This forces them to commit to a view.

  ### 8. What to Refuse (Explicitly)
  At Minute 5, write **"Out of Bounds"** on the board. Tell them you will not answer these today, and if they ask, you will point to the list.
  1.  **Units of Selection:** "We are assuming the Organism is the unit. We are not debating Gene vs. Group selection today."
  2.  **Disease as Dysfunction:** "We are using 'broken' intuitively. We are not defining disease."
  3.  **Teleosemantics:** "We are not applying this to the mind or belief content."

  ### 9. The Reveal (Last 2 Minutes)
  Now you put the names on the board.
  *   **Causal-Role:** Robert Cummins (1975).
  *   **Selected-Effect:** Larry Wright (1973) / Ruth Millikan (1984).
  *   **Forward-Looking:** John Bigelow & Robert Pargetter (1987) / Boorse (Biostatistical).
  *   **Junk DNA Debate:** ENCODE Consortium vs. Dan Graur.

  ### Summary of Board Work
  1.  **Left Column:** The Data (Heart Valve, Whale Pelvis).
  2.  **Middle Column:** The Three Theories (A, B, C -> Names at end).
  3.  **Right Column:** The Stakes (Junk DNA, Closing Question).

  This structure keeps the Bio majors grounded in mechanism, the Phil majors grounded in normativity, and prevents the session from dissolving into "everyone has their own truth."
