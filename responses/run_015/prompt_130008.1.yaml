      *   *Decision:* It's actually a great opener *if* framed carefully. Don't ask "What is the function?" Ask "Why is this *broken*?" This exposes the need for a normative standard immediately. It doesn't tilt to SE if you explicitly write down "Why is it broken?" and let them offer answers that map to the three theories without naming them yet.

