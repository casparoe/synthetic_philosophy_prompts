      *   *Vestigial Organs:* Will arise as a counter-example to SE. Use this as a feature, not a bug (SE says they have no function, CR says they do).
      *   *"Merely Verbal":* This is the end-game boss. Don't concede fully. Frame it as "Different tools for different jobs." Defuse at minute 60 by showing practical consequences (e.g., Junk DNA).

  7.  **Junk DNA Hook:**

      *   Fit this in during the CR vs. SE debate. ENCODE project (CR view: if it binds, it's functional) vs. Evolutionary Biologists (SE view: if selected, it's functional). This is the perfect real-world stakes example. Place this after the three views are defined, before the closing.

