      *   *25-40:* Selected Effect (The "History" view).
      *   *40-55:* Forward Looking (The "Future" view) & The Carrying Case.
      *   *55-65:* Stakes (Junk DNA).
      *   *65-70:* The "Merely Verbal" objection.
      *   *70-75:* Closing Question & Reveal Authors.

      *   *Refining the Carrying Case:* I need to be honest with the user. The Enzyme case *does* drag in artifacts. I should suggest a **Wild Mutant** case instead to keep it strictly biological. Let's propose the **Panda's Thumb** or **Goose Bumps**. Goose Bumps is perfect.
          *   CR: Traps heat (in furry animals), does nothing (in humans).
          *   SE: Selected for heat trapping in ancestors.
