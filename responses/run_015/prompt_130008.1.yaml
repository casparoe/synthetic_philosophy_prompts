      *   Needs to force a choice. "If we sequence a genome and find a sequence that does nothing now, never did anything, but *might* be useful in a future environment, is it functional?" (Tests FL).
      *   Better: "A trait was selected for X, now does Y, and Y saves the organism. What is its function?" (Forces SE vs. FL/CR).

  9.  **Exclusions:**

      *   Units of Selection (Gene vs. Organism).
      *   Disease/Normativity deep dive (beyond the heart valve).
      *   Teleosemantics (Mental Content).

