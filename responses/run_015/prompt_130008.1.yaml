      *   *Causal-Role (CR):* "What the item contributes to some containing system's capacity." *Critique:* Good. Needs to emphasize *current causal contribution* regardless of history.
      *   *Forward-Looking (FL):* "What it would do for fitness down the line." *Critique:* This is the trickiest. Often called "Goal-Contribution" or "Survival-Promoting." The gloss is okay, but needs to distinguish it from SE (history vs. future propensity).
      *   *Verdict:* The gloss is workable but needs tightening during the session to prevent conflation of SE and FL.

  3.  **Determine Dependency Structure:**

      *   To understand *Function*, students first need to understand *Dysfunction* (the normativity problem).
      *   To understand SE, they need *History/Etiology*.
      *   To understand CR, they need *System/Capacity*.
      *   To understand FL, they need *Future Propensity*.
      *   *Sequence:*
          1.  Phenomenon: Normativity (Something can go wrong).
          2.  Hypothesis 1 (CR): It's about what it *does*. (Problem: Error is hard to define).
          3.  Hypothesis 2 (SE): It's about what it was *selected for*. (Problem: History matters).
          4.  Hypothesis 3 (FL): It's about what it *will do*. (Problem: Distinguishing from SE).
