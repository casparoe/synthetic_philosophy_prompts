          *   *Wait, Enzyme is more "Phil of Bio" specific.* I will tell the user how to sanitize the Enzyme case. Make it "A bacterial population evolved in a petri dish to eat nylon byproducts, then escaped." The "designer" is the environment, not a human hand *intending* the function.
          *   *Actually, best advice:* The Enzyme case is too close to Artifact Function. Use **Vestigial Wings on Flightless Birds**. It's standard for a reason. It cleanly separates SE (ancestral flight) from CR (none/balance) from FL (none).
          *   *Wait, I need to answer the prompt's specific question about the Enzyme.* I should tell them *why* it's risky and how to fix it if they keep it.
          *   *Decision:* I will advise swapping to a **Spandrel/Vestigial** case for clarity, but if they insist on Enzyme, they must obscure the human intention.
          *   *Actually, looking at the prompt:* "Tell me what the carrying case has to have and what it has to lack." I will answer this directly.

  11. **Refining the Dependency Structure:**

      *   Need "System" before CR.
      *   Need "History" before SE.
      *   Need "Environment" before FL.
      *   Need "Normativity" before all (The Heart Valve).

  12. **Final Review of Constraints:**

      *   Whiteboard only.
      *   No names until end.
      *   Bio/Phil mix.
      *   Address specific misconceptions.

