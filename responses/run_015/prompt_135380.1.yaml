answer: |-
  A split-brain patient sits before a loan officer who is reviewing an application for a business line of credit. The officer frowns at the form.

  "Sir, this box requires a 'Single Statement of Intent.' Your right hand has written 'Capital Investment,' but your left hand has drawn a picture of a snowman in the margin."

  The patient's left hemisphere, which controls speech but cannot see what the right hemisphere saw when it drew the snowman, doesn't miss a beat. "That is a logo. For our new cooling division. It represents asset preservation in a frozen market."

  The officer nods, then points to the patient's left hand, which is now aggressively trying to unbutton the patient's collar. "And the disrobing?"

  "Ventilation for optimal cognitive performance during negotiation," the patient replies sincerely.

  The officer stamps the application **APPROVED**.

  "But," the patient asks, "doesn't the bank need to verify that I am a single, responsible agent?"

  The officer slides the paper across the desk. "We don't verify agents, sir. We verify alibis. As far as this institution is concerned, a coherent narrative is indistinguishable from a unified will."
