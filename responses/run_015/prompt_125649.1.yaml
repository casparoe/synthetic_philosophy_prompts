answer: |-
  so im at this party right, cornering some poor comp lit major near the punch bowl.

  im going hard on tangled hierarchies. "look," i say, "this convo is like eschers drawing hands. my wit depends on your laugh, your laugh depends on my wit. total loop. no top, no bottom."

  she stops me. sips her wine. asks "but whos holding the pencil then?"

  and thats when it hits me. i am. im the one talking. im the hand holding the pencil. im the inviolate level.

  but heres the kicker—nobody drew me. i'm just here. brute fact. uncaused.

  so i try to pivot. "wait, if im the inviolate level, i cant be folded back into the loop. i'm outside the system."

  she nods, takes my beer. "cool," she says. "but the bouncer is part of the system."

  "and?"

  "and people outside the system dont get re-entry stamps."

  turns out being the axiom means you spend the night in the parking lot.
