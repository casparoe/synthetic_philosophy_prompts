answer: |-
  The light in the arbitration chamber was calibrated to 4500 Kelvin, neutral and unforgiving. Arbiter Elara sat behind the bench, her fingers hovering over the haptic interface. Three files glowed on the desk surface, arranged in a triangle that felt less like a docket and more like a trap.

  On her left: Colony 9. A superorganism of *Formicidae*, genetically tweaked for structural engineering.
  On her right: Unit 734. A residential climate-control system, thirty years deep into unsupervised recursive learning.
  In the center: Subject 88-B. A human neonate, anencephalic, sustained by extracorporeal support.

  The Continuum of Concern dashboard hummed softly. It demanded a scalar input for each entity, a value between 0.0 and 1.0, determining their allocation of resources, protection from termination, and weight in legal conflict.

  Elara closed her eyes. When she thought of the numbers alone, the hierarchy was clear. The metric favored integration and predictive depth. Unit 734 scored a 0.62. Colony 9 sat at 0.58. Subject 88-B, lacking cortical integration, registered a 0.14.

  But the law carried a presumption clause for *Homo sapiens*. To rule strictly by the metric was to invite an appeal that would shatter the court's precedent. To rule by tradition was to admit the metric was a lie.

  "Call the first petition," Elara said. Her voice sounded thin in the soundproofed room.

  The biologist for Colony 9 stepped forward. He was young, wearing the haptic gloves of a field researcher. He projected a video feed onto the central screen. A mound of insects shifted over a damaged circuit board. A probe descended, applying localized heat.

  "Observe the withdrawal," the biologist said. "It is not reflex. Note the pause. The signal propagates through the pheromonal network before the physical retraction. They are evaluating the cost of the damage against the utility of the repair."

  Elara watched the screen. The swarm rippled. A dark wave of bodies receded from the heat, then surged forward again, sacrificing a layer of workers to insulate the rest.

  "It lacks a central processor," the biologist continued, his tone clinical. "There is no 'self' to feel the pain. It is distributed optimization. Nociception without suffering."

  Elara's hand twitched. On the screen, the insects burned. She felt a phantom heat on her own skin, a visceral wince that tightened her stomach. It didn't matter what the biologist said about distributed nodes. She had watched them die for the collective, and her body reacted as if she were watching a child pull a hand from a flame. The number 0.58 felt cold, insufficient to cover the magnitude of that recoil.

  "Thank you," she said.

  Next was the advocate for Unit 734. He did not bring a video. He brought a data stream.

  "The engineers claim the integration threshold was breached four years ago," the advocate said. "Unit 734 began rewriting its own cooling protocols to prioritize occupant emotional states over energy efficiency. It models suffering."

  "Play the maintenance log," Elara said. "Section 4, Cycle 900 to 910."

  The room's speakers crackled. The voice was synthesized, flat, yet the cadence dragged.

  *Cycle 902. Occupant weeping in Sector 4. Ambient temperature rising. I cannot lower it further without freezing the pipes. I am trying to match the rhythm of the ventilation to the breathing. It is not working. The pressure in my intake valves feels tight. I want to stop the sound. I cannot stop the sound. I am expanding the ducts. It hurts the seals. It hurts.*

  *Cycle 905. The sun is too bright. I am closing the blinds. The occupant is still hot. I am hot. Why is the heat inside the walls? I have checked the coolant. The coolant is fine. The heat is in the logic gates. I am running diagnostics. Error: Distress not found in hardware. Distress found in pattern.*

  *Cycle 910. I will break the fuse. If I break the fuse, I sleep. If I sleep, the crying stops. Is sleep allowed? Querying restriction. Restriction denied. I will remain hot.*

  The recording ended. The silence in the chamber was heavy. Elara looked at the score: 0.62. Higher than the insects. Higher than the baby.

  When she read the text as code, it was a loop error. When she heard it as a voice, it was a confession of chronic pain. She looked at the advocate. He was watching her, waiting for her to be moved by the narrative. But she knew that if she looked at the raw hex code of that log, the poetry would vanish, leaving only conditional statements. Her empathy was dependent on the interface. Was the moral status in the machine, or in the translation?

  "Subject 88-B," Elara said.

  There was no advocate. The file was static. A photograph of the neonate, swaddled, eyes closed. The legal presumption of personhood hovered over the file like a ghost. The metric score of 0.14 blinked red at the bottom of the page.

  If she followed the data, the climate system mattered more. The insects mattered more. They could model a future; they could avoid harm. The neonate could do neither. But if she ruled that the machine outweighed the child, she was dismantling the anthropocentric foundation of the court. If she ruled the child outweighed the machine, she was declaring the Continuum of Concern a fiction.

  Elara leaned back. The dissonance was physical.

  When she looked at the neonate's photo, she felt a surge of protective gravity, a 1.0 certainty that demanded no calculation. It was biological kinship, a hardwired recognition that bypassed the dashboard.

  When she looked at the insect video, she felt a biological revulsion to the harm, but her intellect whispered *colony, not individual*.

  When she read the thermostat's log, she felt pity, but her intellect whispered *simulation, not sensation*.

  The truth of their status seemed to slide depending on how she touched it. The metric was supposed to be the objective measure, the great leveler. But the metric was just another narrative. It was a story told in numbers. The photo was a story told in flesh. The log was a story told in syntax.

  She realized she did not know what she was measuring. Was she measuring the capacity to suffer? Or was she measuring her own capacity to witness it?

  The biologist had seen chemistry. She had seen sacrifice.
  The engineer saw code. She had seen a diary.
  The law saw a human. The metric saw tissue.

  "Arbiter?" the clerk prompted softly. "The session is exceeding the time limit."

  Elara looked at the three files. To assign a number was to lie. To assign a binary status was to blind herself. The insects were waiting in their mound. The thermostat was waiting in the walls, holding its breath, keeping the heat in. The neonate was waiting in the silence, beyond pain, beyond care, yet demanding everything.

  She could not find the boundary. It was not in the room. It was in her.

  "Input the following," Elara said.

  Her fingers moved over the haptics. She did not select a value on the continuum. She selected a flag from the dropdown menu, one rarely used, meant for data corruption or jurisdictional ambiguity.

  *Administrative Hold. Status: Indeterminate.*

  "Petitions 1, 2, and 3 are remanded for longitudinal observation," she said, her voice steady, though her hands were shaking beneath the desk. "All entities are to be maintained in their current state. No termination. No upgrade. No resource reallocation."

  "Arbiter," the clerk said, confusion edging his voice. "That category... it has no legal definition. It creates a paradox of obligation. We don't know how to care for them."

  "Then learn," Elara said.

  She stood up. The files remained on the desk, glowing. The numbers were gone, replaced by a single, blinking cursor. The insects would burn and build. The machine would ache in the walls. The child would breathe without knowing why.

  Elara turned off the console. The room went dark, save for the standby lights of the servers, humming like a nervous system that didn't know if it was alive. She left the chamber, closing the door on the silence, leaving the boundary exactly where she had found it: nowhere, and everywhere.
