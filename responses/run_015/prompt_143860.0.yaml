      *   **Daniel Dennett (1976, "Two Approaches to Mental Images" / later works):** Dreams *are* experiences, but they are fragile. The "Cartesian Theater" is wrong. Memory construction happens, but there is a real-time neural event stream. However, Dennett often aligns with the idea that the *narrative* is constructed upon waking (the "fame in the brain" concept). He challenges Malcolm's strict verificationism but acknowledges the malleability of dream memory.
      *   **The Tension:** Is the dream lived *then* (Malcolm says no, Dennett says sort-of/neurally) or written *now* (upon waking)?
