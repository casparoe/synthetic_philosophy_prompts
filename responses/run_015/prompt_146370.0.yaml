prompt: |-
  I'm drafting a novel set in a near-future democratic republic that has long maintained armed neutrality through universal conscription but is now shifting to an all-volunteer professional military. To shape the political debates in the narrative, I need a focused essay that examines whether armed neutrality can retain democratic and moral legitimacy once military service is no longer a shared civic obligation. Weigh the Swiss militia tradition—where neutrality is embedded in a citizen-army—against Sweden's selective conscription revival and Finland's reserve-based model, not as simple policy comparisons but as competing answers to the question of who bears the burden of neutrality. Reach and defend a clear conclusion about whether professionalization inherently undermines the democratic foundation of neutrality, and directly address the counterargument that volunteer forces are actually more compatible with neutrality because they minimize social disruption during mobilization. Write in American English, avoid citations and bibliographies, and keep the reasoning tight enough to serve as background for fictional dialogue.
