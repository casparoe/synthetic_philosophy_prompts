      *   *Finland:* High readiness reserve. Conscription exists but is often viewed through the lens of existential threat (Russia). It's about survival, not just neutrality.
      *   *Sweden:* Dropped conscription, brought it back selectively. Acknowledges that a pure volunteer force wasn't enough for total defense, but didn't return to universal service. It's a hybrid.

  4.  **Formulate the Argument/Conclusion:**
      *   *Thesis:* Professionalization *does* erode the specific democratic legitimacy of armed neutrality, transforming it from a civic covenant into a state service, though it may increase military efficiency.
      *   *Nuance:* It doesn't make neutrality impossible, but it changes the *nature* of the social contract. It becomes a foreign policy stance rather than a national identity.
      *   *Counterargument (Volunteer Efficiency):* Address the idea that volunteers cause less disruption. Rebuttal: Efficiency isn't legitimacy. A quiet war is still a war waged in the people's name without their consent/participation.

