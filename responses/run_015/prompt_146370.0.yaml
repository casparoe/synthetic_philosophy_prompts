  2.  **Deconstruct the Core Tension:**
      *   *Armed Neutrality:* The promise to defend sovereignty without aligning with blocs. It requires credibility (deterrence).
      *   *Conscription (The Old Model):* Everyone serves. Neutrality is a collective project. The burden is shared. The military is society in miniature.
      *   *Professionalization (The New Model):* Soldiers are workers/employees. Neutrality is a state function, not a civic duty. The burden is specialized.
      *   *Democratic Legitimacy:* Does the government have the moral right to wage war (or threaten it) in the name of "the people" if "the people" aren't involved?

  3.  **Evaluate the Models (as requested):**
