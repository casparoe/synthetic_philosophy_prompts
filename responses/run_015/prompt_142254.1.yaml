  The line falls between **integration mechanics** and **scheduling aesthetics**. Schedules that differ in *rate relative to plasticity* (1 vs 8) or *functional hierarchy* (5 vs 6) differ in a way that matters because they change the network's ability to compensate for the counterfactual slack. Schedules that differ only in *batching geometry* (1 vs 2) or *consciousness state* (1 vs 7) look different but often converge on the same risk profile if the total duration allows for synaptic retuning; the genuine risk isn't the schedule itself, but whether the schedule allows the system to *error-correct* before commitment.

  ### 2. What the Ranking Tracks
