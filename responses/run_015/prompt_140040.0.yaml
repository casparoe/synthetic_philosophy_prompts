  **BUREAU OF HISTORICAL CONTINUITY**
  **STANDARD OPERATING PROCEDURE 44-B**
  **SUBJECT: ALLOCATION OF NARRATIVE AUTHORITY AND MANAGEMENT OF EPISTEMIC LIABILITY**
  **DATE: 14 OCTOBER 2023**
  **CLASSIFICATION: INTERNAL USE ONLY**

  **1.0 PURPOSE**
  1.1 This document establishes protocols for the implementation of the Victory Narrative Act (1995). It outlines procedures for determining Victor status, allocating Narrative Share, and managing Material Concordance to ensure long-term社会稳定 (social stability).
  1.2 All Regional Offices must adhere to these guidelines when processing conflict archives. Deviation requires Level 5 Clearance.

  **2.0 VICTORY STATUS DETERMINATION**
  2.1 In conflicts resulting in unconditional surrender, Victor status is assigned to the occupying power.
  2.2 In cases of negotiated settlement, stalemate, or coalition victory, Victor status shall be determined by the Strategic Outcome Metric (SOM). The SOM calculates territorial retention, casualty ratios, and treaty signatory precedence.
  2.3 **Note:** The SOM relies on objective data points independent of partisan reporting. Staff must verify troop positions and border markers against neutral satellite imagery prior to assigning Narrative Authority. This baseline verification is required to ascertain which party possesses the administrative right to define the conflict.
  2.4 If the SOM yields a score within 5% parity, the conflict is classified as a "Harmonization Event." Narrative Authority is split proportionally among coalition partners based on GDP contribution to the war effort.

  **3.0 ASSET CLASSIFICATION AND DISPOSAL**
  3.1 Records generated by the Defeated Party (DP) prior to the cessation of hostilities are classified as "Provisional Materials."
  3.2 Provisional Materials contradicting the Approved Narrative must be reclassified as "Speculative Fiction" or "Psychological Operations."
  3.3 Physical evidence (e.g., ordnance remnants, mass graves, structural damage) incongruent with the Approved Narrative is to be remediated. If remediation is cost-prohibitive, the site is to be rezoned or replanted to alter semantic context.
  3.4 Private diaries and neutral observer logs are subject to Copyright Seizure. Ownership is transferred to the Bureau to prevent unauthorized circulation. These documents are not destroyed but are placed in Deep Storage to acknowledge their existence while preventing access.

  **4.0 WORKED CASE: THE MERIDIAN DISPUTE (1998–2000)**
  4.1 **Intake:** Following the Meridian Dispute, the Bureau received 4,000 linear feet of records from State A (Claimant) and State B (Respondent). The peace treaty was signed by both parties; no unconditional surrender occurred.
  4.2 **Classification:** The SOM indicated State A retained 52% of the contested valley, while State B secured favorable trade tariffs. Victory Status was assigned to State A based on territorial precedence.
  4.3 **Allocation:** State A was granted 70% Narrative Share. State B was granted 30% Share, limited to economic outcomes. Civilian casualty figures provided by State B were excluded as "Epistemic Liability" due to lack of verification infrastructure during the conflict.
  4.4 **Disposal:** State B's field command logs indicating early artillery strikes on civilian zones were reclassified as "Training Exercises." Physical craters in the valley were filled and designated as "Agricultural Development Sites."
  4.5 **Review:** At the 5-Year Review, it was noted that local oral histories still referenced the artillery strikes. This indicated a failure in the Semantic Rezoning protocol (see 3.3).

  **5.0 MATERIAL CONCORDANCE AND DRIFT**
  5.1 The Bureau acknowledges that Approved Narratives are subject to Reverse Archival Drift, defined as the tendency of suppressed accounts to regain credibility as direct witnesses expire.
  5.2 To counter Drift, Regional Offices must conduct annual Material Concordance Audits.
  5.3 **Audit Procedure:** Staff must compare the Approved Narrative against the Verified Event Horizon (VEH). The VEH comprises all physical, geological, and demographic data that exists independent of textual record.
  5.4 **Contradiction Protocol:** If the Approved Narrative diverges from the VEH by more than 15%, the Narrative must be adjusted to align with physical reality, or the physical reality must be further remediated.
  5.5 **Rationale:** A Narrative that contradicts observable material conditions creates cognitive dissonance in the populace, reducing compliance. Therefore, the Bureau must maintain an accurate inventory of objective facts to ensure the Approved Narrative remains plausible.

  **6.0 SUNSET PROVISIONS**
  6.1 Narrative Authority is valid for 40 years. Upon expiration, the conflict is re-evaluated under current geopolitical conditions.
  6.2 If the former Victor regime has been supplanted, Victory Status is recalculated using the current SOM. Previous Approved Narratives are archived as "Historical Period Pieces."
  6.3 Staff are reminded that the truth value of a record is functionally equivalent to its circulation status. However, circulation depends on the record's resilience against physical verification.

  **7.0 APPROVAL**
  7.1 This procedure is effective immediately.
  7.2 Direct inquiries regarding Ontological Compliance to the Department of Narrative Stability.

  **APPENDIX A: FREQUENTLY ASKED QUESTIONS**
  **Q: What if the Defeated Party destroyed their own records before surrender?**
  A: This is optimal. It reduces disposal costs. Create a placeholder file noting "Records Lost to Hostilities."
  **Q: Can a suppressed account be considered false?**
  A: A suppressed account is administratively unavailable. If it cannot be accessed, it cannot be cited. If it cannot be cited, it cannot influence policy. Therefore, it is functionally false. However, see 5.3 regarding physical verification.
  **Q: How do we measure Drift without admitting an original truth?**
  A: Drift is measured against the VEH (5.3). The VEH is not "truth" but "material constraint." We do not measure against what happened; we measure against what can be physically demonstrated to have happened.
