answer: |-
  This is a sophisticated proposal that closely resembles variants of **Asymptotic Density Utilitarianism** or **Average Utilitarianism over Infinite Populations**, modified with an indexical anchor and ultrafilter completion. It attempts to solve the "infinite ethics" problem (specifically the impossibility results regarding Pareto and Anonymity) by sacrificing translation invariance (anchoring on the agent) and sensitivity to sparse changes.

  Below is an analysis of the defeaters, ranked from fatal to awkward, followed by a comparison with rival frameworks.

  ### I. Ranked Defeaters

  #### 1. The Redescription/Permutation Invariance Problem (Fatal)
  **The Objection:** In an infinite universe (modeled as a lattice $\mathbb{Z}^n$ or manifold), the "density" of a set of locations is not an intrinsic physical property; it is a property of the coordinate system. There exist bijections (permutations) of the locations that preserve all local physical facts and welfare assignments but map a set of asymptotic density 0.1 to a set of asymptotic density 0.9.
  If the universe is truly infinite and homogeneous, there is no metaphysical fact of the matter about which location is "coordinate 0" (the agent's location) other than the agent's indexical perspective. However, if two agents exist in identical local welfare environments but different global positions, your criterion yields different ethical rankings of the *same* global state.
  **User's Criterion:** You stated: *"If the ordering can be reversed by a mere redescription of the universe rather than a change in it, I would count that as refutation."*
  **Verdict:** **Fatal.** Density is not invariant under permutations of the domain. Since the labeling of locations in an infinite homogeneous space is arbitrary, a criterion that depends on the labeling (via the metric used to define "expanding regions") fails to track objective ethical value.
  **Defender's Concession:** A defender cannot reasonably treat this as a cost of business. To save the view, they must argue that the spatial metric is metaphysically privileged over the welfare distribution. This collapses the view into a form of spatial partiality that most ethicists reject.
  **Over-qualification Risk:** To fix this, one would have to restrict admissible coordinate systems or require invariance under a specific group of transformations. This usually forces the density back to undefined or requires averaging over all possible centers, which returns you to the original aggregation paradoxes.

  #### 2. The Indexical Partiality Problem (Fatal)
  **The Objection:** You anchor the expanding regions on the *agent's own location*. This explicitly violates **Anonymity** (the principle that the ethical value of an outcome should not depend on *who* is where, only on the distribution of welfare).
  In an infinite universe, every agent is at the center of their own expanding sphere. If Agent A and Agent B evaluate the same universe, they may calculate different densities of suffering because the "bad" locations are clustered nearer to A than to B.
  **Verdict:** **Fatal** (for an impartial theory). You noted the appeal is sidestepping the conflict between impartiality and Pareto. This criterion resolves the conflict by abandoning impartiality. It effectively says, "Suffering matters less if it is far away from me," even in a static, eternal universe where distance implies no causal or epistemic barrier.
  **Defender's Concession:** The defender must concede this violates standard impartiality. They might argue for "Agent-Relative Ethics," but this surrenders the claim to be a general axiology. It becomes a decision theory, not a theory of the Good.
  **Over-qualification Risk:** High. Attempting to make it impartial (e.g., by averaging the density calculated from every possible location) usually results in the limit failing to exist everywhere or returning to the standard impossibility theorems.

  #### 3. Insensitivity to Density-Zero Pareto Improvements (Strong)
  **The Objection:** The criterion is deaf to improvements confined to regions of density zero.
  *   **Case:** In Outcome 1, everyone has welfare 0. In Outcome 2, everyone has welfare 0 *except* for a finite number of people (or an infinite but sparse set, e.g., at prime coordinates) who have welfare 1,000,000.
  *   **Verdict:** The density of locations below any threshold $\epsilon > 0$ remains 1 (or unchanged) in both cases. The criterion ranks them as **equally good**.
  *   **Violation:** This violates **Strong Pareto** (if everyone is at least as well off and some are strictly better, the outcome is better).
  **Verdict:** **Strong Defeater.** Most ethicists view the inability to distinguish between universal misery and universal misery-plus-some-islands-of-bliss as a bug, not a feature.
  **Defender's Response:** "Cost of Doing Business." The defender argues that in an infinite world, we *must* sacrifice Strong Pareto to get a complete ordering. They treat finite/sparse changes as ethically negligible compared to the "bulk" properties of the universe.
  **Over-qualification Risk:** Moderate. One could add a lexicographic clause: "First compare density; if equal, compare finite differences." But this re-introduces the aggregation problems the density criterion was meant to solve (e.g., how to aggregate the finite differences if there are infinitely many disjoint sparse improvements?).

  #### 4. Intensity Blindness (Strong)
  **The Objection:** The criterion counts locations below a threshold, not *how far* below they are.
  *   **Case:** Outcome A has 10% of locations at welfare $-1,000,000$. Outcome B has 11% of locations at welfare $-1$.
  *   **Verdict:** The criterion ranks A as better than B (lower density of bad locations).
  *   **Intuition:** Most would argue the extreme suffering in A outweighs the marginal increase in frequency of mild suffering in B.
  **Verdict:** **Strong Defeater.** It reduces welfare to a binary property (above/below threshold), discarding cardinal information.
  **Defender's Response:** "Cost of Doing Business." To incorporate intensity, one needs to integrate welfare over infinite space, which returns the divergence problem. The defender claims binary thresholds are the only stable metric in infinite contexts.
  **Over-qualification Risk:** High. Introducing weighted density (integrating welfare over the sphere) typically diverges or becomes path-dependent again.

  #### 5. Ultrafilter Arbitrariness (Awkward)
  **The Objection:** When the limit does not converge (e.g., the density oscillates as the radius expands), you invoke a non-principal ultrafilter to force a value.
  *   **Problem:** Non-principal ultrafilters exist only via the Axiom of Choice; they are non-constructive. There are infinitely many such ultrafilters, and they can yield contradictory rankings for the same oscillating sequence.
  *   **Implication:** The ethical ranking of the universe depends on a mathematical object that cannot be explicitly defined.
  **Verdict:** **Awkward.** It makes ethical truth metaphysically obscure.
  **Defender's Response:** "Cost of Doing Business." We need a complete ordering to make decisions. Any completion requires arbitrary choices in the infinite case; ultrafilters are the most rigorous way to formalize that arbitrariness.
  **Over-qualification Risk:** Low. This is a standard move in non-standard analysis approaches.

  #### 6. Shape/Exhaustion Dependence (Awkward to Strong)
  **The Objection:** The limit depends on the shape of the expanding regions (spheres vs. cubes vs. tetrahedra). In anisotropic distributions, spherical limits may differ from cubic limits.
  **Verdict:** **Awkward.** Requires stipulating a privileged geometry for ethical evaluation.
  **Defender's Response:** "Cost of Doing Business." Assume the universe has a natural metric (e.g., spacetime distance).
  **Over-qualification Risk:** Moderate. If the universe is topologically complex, defining "expanding regions" becomes non-trivial.

  ---

  ### II. Comparison with Rivals

  | Feature | **Density Criterion (Your Proposal)** | **Hyperreal/Extended Number Aggregation** (e.g., Lauwers, Vallentyne) | **Finite Difference / Pareto Approaches** (e.g., Standard Social Welfare) |
  | :--- | :--- | :--- | :--- |
  | **Completeness** | **Complete** (due to ultrafilter). Can rank any two outcomes. | **Complete** (within the hyperreal field). | **Incomplete.** Many infinite outcomes are incomparable. |
  | **Pareto Sensitivity** | **Low.** Insensitive to changes in density-zero sets. | **High.** Sensitive to finite changes (infinitesimal differences register). | **High.** Respects Strong Pareto. |
  | **Impartiality (Anonymity)** | **Violated.** Anchored on agent/location. | **Preserved.** Usually permutation invariant. | **Preserved.** |
  | **Mathematical Cost** | **High.** Requires Ultrafilters (Choice); Path-dependent limits. | **High.** Requires Non-Standard Analysis / Hyperreals. | **Low.** Standard mathematics, but yields paralysis. |
  | **Redescription Stability** | **Fails.** Sensitive to coordinate permutation. | **Varies.** Some hyperreal approaches are permutation invariant. | **Passes.** |
  | **Unique Prediction** | **"The Bulk Matters."** Predicts that a 51% majority of suffering cannot be outweighed by infinite intense bliss for the 49%. | **"Every Bit Counts."** Predicts that improving one person's life always improves the outcome (by an infinitesimal amount). | **"Caution."** Predicts we often cannot say if one infinite future is better than another. |

  ### III. Unique Predictions of the Density View

  1.  **The Tyranny of the Majority (Even Infinite):** Unlike hyperreal approaches which sum welfare, the density view treats the *proportion* of locations as lexically prior to the *intensity*. It predicts that saving 51% of the universe from mild pain is ethically superior to saving 49% of the universe from eternal torture, provided the threshold distinguishes "pain" from "torture."
  2.  **Ethical Irrelevance of the Sparse:** It predicts that "island universes" of value in a void (or vice versa) are ethically invisible if they do not affect the asymptotic density. A rival hyperreal view would say the island adds positive value; the Density view says it adds nothing.
  3.  **Agent-Relative Value:** It predicts that two agents in the same universe may disagree on whether the universe is "good" or "bad" based on their spatial location relative to the clusters of welfare. Rivals generally assume the value of the universe is observer-independent.

  ### IV. Final Verdict

  You asked where you would be most moved: *"If the ordering can be reversed by a mere redescription of the universe rather than a change in it, I would count that as refutation."*

  **The Density Criterion fails this test.**

  Because asymptotic density is not invariant under bijections of $\mathbb{N}$ (or $\mathbb{Z}^n$), one can mathematically relabel the locations of the universe such that a "good" outcome becomes "bad" without changing the physical welfare facts, merely by changing which indices are considered "near" the agent.

  **Recommendation:**
  A defender of the density view can only survive by **conceding Impartiality**. They must argue that ethics is fundamentally indexical and spatial—that *where* you are matters ethically, not just *what* exists. If you are unwilling to accept that spatial proximity to suffering confers greater ethical weight in a static infinite universe, the Redescription Problem is a **fatal refutation**, not a cost of doing business.

  If you wish to retain Impartiality, you must abandon the Density Criterion in favor of a **Hyperreal Aggregation** approach (accepting infinitesimals) or a **Finite Difference** approach (accepting incompleteness). The Density Criterion attempts to have completeness without infinitesimals, but it pays for this by sacrificing permutation invariance.
