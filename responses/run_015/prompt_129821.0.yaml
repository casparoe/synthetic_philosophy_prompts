          *   **Crucial Criterion:** If the ordering flips via mere redescription (coordinate change) without physical change, is it a refutation? (User says yes).
      *   **Required Output:** Ranked defeaters, assessment of defensibility (concede vs. cost of business), risk of over-qualification, unique predictions vs. rivals.

  2.  **Deconstruct the "Density Criterion":**
      *   *Core Mechanism:* Asymptotic density of "bad" states.
      *   *Anchor:* Agent's location (indexical).
      *   *Math:* Limit of measure/volume ratios as radius $R \to \infty$.
      *   *Tie-breaker:* Ultrafilters (non-principal).

  3.  **Brainstorming Defeaters (Drafting & Categorizing):**

      *   *Defeater 1: The Anchor Problem (Indexicality).*
          *   The criterion centers regions on the *agent*.
          *   Problem: In an infinite homogeneous universe, every location is identical. Why does *my* location matter?
          *   Implication: Two agents in identical local circumstances but different global positions might rank outcomes differently. This violates Impartiality (anonymity).
          *   Severity: Fatal. It contradicts the stated goal of sidestepping impartiality/Pareto conflicts by reintroducing partiality.

      *   *Defeater 2: Coordinate/Topology Dependence (Redescription).*
          *   The limit depends on how you define "expanding regions" (spheres? cubes?) and the metric.
          *   In an infinite grid, a bijection can map a "dense" set of bad outcomes to a "sparse" set without changing the physical facts, just the labeling.
          *   User's specific worry: "Verdicts that flip under a different way of exhausting the universe."
          *   Severity: Fatal (per user's instruction).

      *   *Defeater 3: The Zero-Density Pareto Problem.*
          *   If I improve welfare for a finite number of people, density doesn't change (limit is 0).
          *   If I improve welfare for an infinite number of people, but they are sparse (e.g., at prime number coordinates), density might still be 0.
          *   Verdict: The criterion says these changes make *no difference*.
          *   Severity: Fatal/Very Strong. Violates Strong Pareto.

      *   *Defeater 4: Intensity Blindness.*
          *   The criterion looks at the *fraction* below a threshold.
          *   It ignores *how much* below (severity) or *how much* above (surplus).
          *   Scenario A: 10% of people suffer infinitely. Scenario B: 11% of people suffer mildly.
          *   Density says A is better. Intuition might say B is better.
          *   Severity: Strong.

      *   *Defeater 5: Ultrafilter Arbitrariness.*
          *   When limits don't exist, ultrafilters decide.
          *   Ultrafilters are non-constructive (require Axiom of Choice).
          *   Different ultrafilters yield different rankings.
          *   Severity: Awkward/Theoretical cost.

      *   *Defeater 6: Expansion Path Dependence.*
          *   Spheres vs. Cubes. In some distributions, spherical limits exist but cubic don't, or they yield different values.
          *   Severity: Strong (related to Redescription).

  4.  **Structuring the Response:**
