answer: |-
  **Lewisian Conditions Analysis**

  *   **Coordination Problem:** **Present.** Contributors prefer matching editing behaviors to avoid conflict and maintain document integrity.
  *   **Arbitrary but Stable Equilibrium:** **Present but Threatened.** The annotation norm is one of multiple possible equilibria (e.g., no annotations), historically stable but currently destabilizing.
  *   **Common Knowledge:** **Genuinely Threatened.** Digital scale and asymmetric observational access prevent newcomers from knowing that others know the norm, breaking the recursive expectation required for convention.
  *   **Salience Sustained by Precedent:** **Genuinely Threatened.** The historical regularity exists but is no longer visually salient to new users, weakening the focal point.

  ***

  **MEMORANDUM**

  **TO:** Governance Committee
  **FROM:** Institutional Design Working Group
  **SUBJECT:** Decision on Annotation Norm Formalization

  The Committee recommends deliberate preservation of the emergent annotation norm, augmented by a mandatory onboarding visibility module rather than automated enforcement flags. While the faction advocating for formalization correctly identifies that digital scale has fractured the common knowledge necessary for self-enforcement, converting this convention into a binding rule fundamentally alters the motivational structure from coordinated mutual expectation to top-down compliance, thereby losing the flexibility and intrinsic ownership that make the norm efficient. A Lewisian convention relies on the belief that others will conform because they expect you to conform; automated flags replace this reciprocal expectation with external penalty, which risks reducing voluntary cooperation to minimal rule-following and stifling the adaptive evolution of the practice. To address the genuine breakdown in common knowledge without destroying the convention's nature, we will implement a "Contextual Salience Scaffolding" mechanism that forces the observational history back into the user experience. This mechanism requires all new contributors to complete an interactive onboarding module that explicitly highlights existing annotations across popular documents, artificially recreating the common observational history that small groups naturally possess. This solution accepts the formalizers' premise that visibility is broken at scale but adopts the preservationists' conclusion that the remedy must restore the epistemic conditions of a convention rather than replacing the convention with a regulation. By making the precedent visibly salient to newcomers without punishing deviation, we maintain the arbitrary equilibrium as a choice while ensuring the common knowledge required to sustain it is digitally transmitted.
