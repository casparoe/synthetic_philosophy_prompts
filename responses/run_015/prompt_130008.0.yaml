  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 75-minute philosophy of biology seminar, ~12 second-year students (mix of bio and philosophy majors), whiteboard only, no prep reading.
      *   **Goal:** Teach the three-way contrast of biological function: Selected-Effect (SE), Causal-Role (CR), and Forward-Looking (FL).
      *   **Constraints:** No author names until the end (concept-first approach).
      *   **Specific Questions:**
          *   Is the working gloss accurate/misleading?
          *   What is the dependency structure (what must come before what)?
          *   Opening case: Stenosed heart valve (risk of bias)?
          *   Carrying case: Plastic-chewing enzyme (directed evolution)? Does it work? What properties must the case have/lack?
          *   Misconceptions: Which will arise, when, and how to handle them (especially the "merely verbal" one)?
          *   Bio major hook: Junk DNA debate.
          *   Closing: One question they can't answer with "it depends."
          *   Exclusions: What to explicitly refuse to explain (units of selection, etc.).

  2.  **Evaluate the Working Gloss:**
      *   *SE:* "Selected-effect story." (Accurate enough for intro).
      *   *CR:* "What the item contributes to some containing system's capacity." (Good, standard Cummins).
      *   *FL:* "What it would do for fitness down the line." (Risky. This sounds like "future selection" which is teleological in a way biologists hate. It's better framed as "propensity" or "survival value" without implying future causation. I need to flag this).
      *   *Verdict:* The FL gloss needs tweaking to avoid "future causes past" confusion.

  3.  **Determine Dependency Structure:**
      *   To understand *Function*, we first need *Dysfunction* (the normative element).
      *   To understand SE, we need *History* (ancestry).
      *   To understand CR, we need *System Analysis* (capacity).
      *   To understand FL, we need *Propensity/Probability* (future survival).
      *   *Sequence:* Start with the intuition of "wrongness" (Dysfunction) $\rightarrow$ Move to "what is it doing now?" (CR) $\rightarrow$ Move to "why is it here?" (SE) $\rightarrow$ Move to "what will it do?" (FL).
      *   *Correction:* Actually, CR is the easiest to grasp (mechanistic). SE is the hardest (historical). FL is the most intuitive for biologists but philosophically tricky.
      *   *Better Sequence:*
          1.  Phenomenon: Dysfunction (The Heart Valve).
          2.  Account 1: Causal Role (What is it doing?).
          3.  Account 2: Selected Effect (Why is it there?).
          4.  Account 3: Forward Looking (What is it good for?).
          5.  Conflict: The Plastic Enzyme (The Stress Test).

  4.  **Analyze the Opening Case (Stenosed Heart Valve):**
      *   *User's Worry:* Does it tilt toward SE?
      *   *Analysis:* "Supposed to do" implies normativity. SE handles normativity best (it *failed* its historical job). CR handles it poorly (a stenosed valve *does* cause a murmur, so that's its CR function). FL handles it poorly (it lowers fitness).
      *   *Verdict:* It's a good opener *if* framed carefully. Don't ask "What is its function?" Ask "In what sense is this broken?" This exposes the need for different definitions. It doesn't necessarily tilt to SE if you highlight that the murmur is a *current* function (CR) even if it's a *broken* organ (SE).

  5.  **Analyze the Carrying Case (Plastic-Chewing Enzyme):**
      *   *Properties:* Directed evolution (selection history exists but artificial), no organism (no containing system?), no fitness (in the wild sense), sprayed on landfill.
      *   *Pros:* Separates history from organismal context. Separates current utility from ancestral history.
      *   *Cons:* "Directed evolution" smells like a Designer (Intentionality). Bio majors might reject it as "real" biology.
      *   *Requirement:* The case needs *History* without *Organism*, and *Current Utility* without *History*.
      *   *Better Case?* Maybe a vestigial organ vs. a spandrel? No, too complex. The enzyme is actually strong *if* the "experimenter intention" trap is managed.
      *   *Refinement:* Use the enzyme to test SE (does artificial selection count?) and CR (what system? the landfill cleanup crew?).
      *   *Decision:* Keep the enzyme but frame it as "Lab-Evolved." It forces the question: Does selection need to be natural?

  6.  **Address Misconceptions:**
      *   *"Selected for" = "Useful now":* Will arise immediately. Head off during SE explanation.
      *   *SE smuggles designer:* Will arise with the Enzyme case. Address then.
      *   *CR makes any effect a function:* Will arise with the Heart Valve (murmur). Address during CR section.
      *   *Vestigial organs refute SE:* Will arise if you mention appendix/tailbone. Keep it in reserve.
      *   *"Merely Verbal":* This is the end-game boss. Don't concede too early. Show that different definitions yield different truth values for the *same* claim (e.g., "This DNA is functional").
      *   *Junk DNA:* Perfect application for the last 15 mins. CR says "it does something biochemical." SE says "it was selected for."

  7.  **Drafting the Plan (Iterative Process):**

      *   *Minute 0-10:* The Hook (Heart Valve). Establish the "Normative Gap."
      *   *Minute 10-25:* Causal Role (Cummins). The "Mechanic's View."
      *   *Minute 25-40:* Selected Effect (Millikan/Neander). The "Historian's View."
      *   *Minute 40-55:* Forward Looking (Propensity). The "Investor's View." (Fix the gloss here).
      *   *Minute 55-65:* The Stress Test (Plastic Enzyme). Apply all three.
      *   *Minute 65-70:* Junk DNA Application.
      *   *Minute 70-75:* The Killer Question & Wrap.

      *   *Refining the "Forward Looking" Gloss:* The user's gloss ("what it would do for fitness down the line") is dangerous. It implies future causation. Better: "The propensity of the trait to contribute to future survival/reproduction." It's about *potential*, not *cause*.
      *   *Refining the Enzyme Case:* The risk is "Experimenter Intention." I need to make sure the students see the *selection* happened in the lab (blind screening), not just a human saying "I want this."
      *   *Refining the "Merely Verbal" point:* It's not *just* verbal because it changes empirical predictions (e.g., about Junk DNA).

  8.  **Addressing Specific User Questions:**
      *   *Dependency:* Need "System" for CR, "History" for SE, "Environment" for FL.
      *   *Opening:* Heart valve is fine if you distinguish "Capacity" vs. "Norm."
      *   *Carrying Case:* Needs History + Utility + Ambiguous System. Enzyme works.
      *   *Misconceptions:* "Useful now" is the biggest early risk. "Merely verbal" is the biggest late risk.
      *   *Exclusions:* Units of selection is a rabbit hole. Mental content is too far afield.

  9.  **Final Polish:**
      *   Ensure the whiteboard workflow is clear (three columns?).
      *   Make sure the "Killer Question" forces a choice, not a definition.
      *   Check timing (75 mins is tight for 3 theories + case study). Need to be ruthless.

      *(Self-Correction during drafting)*: 75 minutes is very short for three distinct theories. I need to make sure I don't lecture. I need to make them *generate* the definitions.
      *   *Strategy:* Present the Heart Valve. Ask "Is it functioning?" Get conflicting answers. Write the answers on the board. *Label* those answers as the three theories. This is faster than defining them first.
      *   *Revised Plan:* Phenomenon $\rightarrow$ Conflicting Intuitions $\rightarrow$ Formalize Intuitions into Theories $\rightarrow$ Test with Enzyme $\rightarrow$ Apply to DNA.

      *(Re-evaluating the "Forward Looking" gloss)*: The user asked if their gloss is misleading. Yes, it is. "What it would do" sounds like prophecy. It needs to be "Survival Value" or "Propensity." I must explicitly correct this.

      *(Re-evaluating the Enzyme)*: Does it drag in artifact intentions? Yes. Is that fatal? No, it's a feature. It tests the boundary of "Natural" Selection. I should lean into that.

      *(The "Merely Verbal" point)*: Don't concede. Show that "Is Junk DNA functional?" has different *empirical* answers depending on the definition. That makes it substantive.

      *(The Killer Question)*: Needs to be about a specific case where the theories diverge on a *fact*, not just a label. "Should we fund research to fix this trait?" or "Is this trait an adaptation?"

      *(Exclusions)*: Be explicit. "We are not solving the Unit of Selection problem today."

  10. **Final Review against constraints:** Whiteboard only. No names until end. 2nd years. Mix of majors.
      *   *Board Plan:* Three columns: "What is it doing?" (CR), "Why is it here?" (SE), "What is it good for?" (FL).
      *   *Timing:* Keep it tight.

      *(Final thought on the Heart Valve)*: The user worries it tilts to SE. Actually, it tilts to *Normativity*. Both SE and FL are normative. CR is descriptive. So the Heart Valve highlights the CR/SE split immediately. That's good.

      *(Final thought on Dependency)*: You can't explain SE without explaining reproduction/heredity. You can't explain CR without explaining "System." You can't explain FL without explaining "Environment."

