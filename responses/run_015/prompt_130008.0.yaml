answer: |-
  Here is a concrete teaching plan designed for a 75-minute whiteboard session, structured by dependency, misconception management, and case deployment.

  ### 1. Critique of Your Working Gloss
  Your glosses are 80% there, but the **Forward-Looking (FL)** one is dangerous.
  *   **Selected-Effect (SE):** "Why it was retained in the past." (Safe).
  *   **Causal-Role (CR):** "What it contributes to the containing system's capacity." (Safe).
  *   **Forward-Looking (FL):** *Do not use* "what it would do for fitness down the line." This implies future causation (teleology), which biologists hate and philosophers reject.
      *   **Fix:** Frame it as **Survival Value** or **Propensity**. "The statistical probability that this trait contributes to future survival/reproduction in the *current* environment."
      *   **Why:** A trait can have survival value (FL) without having a history (SE) (e.g., a lucky mutation), and it can have a history (SE) without having current survival value (FL) (e.g., a vestigial organ in a changed environment).

  ### 2. The Dependency Structure
  You cannot state the theories in a vacuum. You need to build the ontological commitments in this order:

  1.  **The System (for CR):** Before you can talk about "contribution to capacity," they must agree the heart is part of a circulatory *system*.
      *   *Board:* Draw a box around the organism. Label "Containing System."
  2.  **The History (for SE):** Before you can talk about "selection," they must agree the trait exists because of *ancestral replication*.
      *   *Board:* Draw a lineage arrow behind the organism. Label "Etiology."
  3.  **The Environment (for FL):** Before you can talk about "fitness," they must agree the trait interacts with a *current context*.
      *   *Board:* Draw a box around the organism. Label "Current Context."

  **Teaching Sequence:**
  1.  **Phenomenon (Dysfunction):** Establish the normative intuition.
  2.  **Causal-Role (The Mechanic):** Strip away history. Look only at the system now.
  3.  **Selected-Effect (The Historian):** Strip away current utility. Look only at the lineage.
  4.  **Forward-Looking (The Investor):** Strip away history. Look only at current propensity.

  ### 3. The Opening: The Stenosed Heart Valve
  **Does it tilt toward SE?**
  Yes, slightly, because "broken" implies "not doing what it's supposed to," which smells like SE.
  **How to neutralize this:**
  Do not ask "What is its function?" Ask: **"Describe this valve in three true sentences."**
  1.  *Sentence A:* "It is restricting blood flow." (True, descriptive).
  2.  *Sentence B:* "It is failing to pump efficiently." (True, normative).
  3.  *Sentence C:* "It is making a thumping sound." (True, incidental).

  **The Move:** Tell them: "Account 1 says Sentence A is the function. Account 2 says Sentence B defines the function. Account 3 says Sentence C is a function if it helps the doctor diagnose it."
  This establishes the **Causal-Role** view (A) immediately as a viable competitor to the **Selected-Effect** view (B), preventing SE from hogging the "common sense" intuition.

  ### 4. The Carrying Case: The Plastic-Chewing Enzyme
  Your candidate (directed evolution in a lab, sprayed on a landfill) is excellent, but it risks the "Designer" objection.
  **What the case must HAVE:**
  *   **Blind Selection:** Emphasize the lab process was *iterative screening*, not an engineer designing it from scratch. (Preserves SE).
  *   **No Organism:** The enzyme is free-floating or on bacteria that don't benefit. (Breaks the link between SE and Organismal Fitness).
  *   **Current Utility:** It eats plastic *now*. (Supports FL and CR).

  **What the case must LACK:**
  *   **Natural Ancestry:** It has no wild-type ancestors. (Stress tests SE).
  *   **Containing System:** It isn't inside a body. (Stress tests CR).

  **How to run it (Minute 40-55):**
  Put the enzyme on the board. Ask the three questions:
  1.  **CR:** "What system is it in?" (Students will struggle. Is it the landfill? The cleanup crew? This exposes CR's weakness: *arbitrary system boundaries*).
  2.  **SE:** "Was it selected?" (Yes, in the lab. "Does lab selection count?" If yes, SE covers artifacts. If no, SE excludes biotech).
  3.  **FL:** "Does it increase fitness?" (Whose? The bacteria's? The planet's? This exposes FL's weakness: *fitness of what?*).

  **Verdict:** This case discriminates cleanly *if* you force them to specify the **System** (for CR) and the **Beneficiary** (for FL).

  ### 5. Misconception Management
  Here is when they will arise and how to head them off:

  *   **"Selected for = Useful Now" (Bio Majors):**
      *   *When:* Minute 25 (SE intro).
      *   *Fix:* Use the **Vestigial Tailbone**. It is not useful now. It was selected for in ancestors. SE says it has a function (historically); FL says it doesn't.
  *   **"CR makes anything a function" (Heart Sounds):**
      *   *When:* Minute 15 (CR intro).
      *   *Fix:* Distinguish **Capacity** vs. **Effect**. The heart's capacity is circulation. The sound is an effect. CR limits functions to contributions to the *analyzed capacity* of the system. (Keep this brief; don't get bogged in Cummins' analysis).
  *   **"SE smuggles in a Designer":**
      *   *When:* Minute 45 (Enzyme case).
      *   *Fix:* "Natural selection is a blind filter. Lab selection is a blind filter (screening). The mechanism is the same; the filter is just human-made vs. environment-made."
  *   **"It's Merely Verbal" (The Big One):**
      *   *When:* Minute 60 (Wrap up).
      *   *Strategy:* **Do not concede.** Do not say "you can choose."
      *   *Argument:* "If it were merely verbal, we would agree on the facts and just argue about labels. We don't. We disagree on whether 'Junk DNA' exists."

  ### 6. The Junk DNA Hook (Bio Majors)
  **Where it fits:** Minute 60-65.
  **The Setup:** "ENCODE project claimed 80% of the genome is functional. Evolutionary biologists said 'No, only 10%.'"
  **The Application:**
  *   **ENCODE used CR:** "Does this DNA bind to something? Does it get transcribed?" (Yes? It's functional).
  *   **Evolutionary Biologists used SE:** "Was this sequence conserved by selection?" (No? It's junk).
  *   **The Point:** This isn't a verbal dispute. It changes how we spend research money. If you use CR, you study the 80%. If you use SE, you ignore the 80%. **The definition dictates the empirical research program.**

  ### 7. The Final Question (Minute 70-75)
  You want a question they can't answer with "It depends what you mean by function."
  **The Question:**
  > "We find a trait in a human population that lowers survival rates but is spreading rapidly because people with the trait have more children (sexual selection). **Is this trait an adaptation?**"

  **Why this works:**
  *   **SE:** Yes (it was/will be selected for).
  *   **FL:** No (it lowers survival/long-term fitness).
  *   **CR:** Irrelevant (what system?).
  *   **The Kicker:** You cannot say "It depends." You have to decide if "Adaptation" tracks *history* or *future survival*. If you get it wrong, you predict the trait will persist (SE) when it might actually lead to extinction (FL). It forces a commitment to one theory's predictive power.

  ### 8. What to Refuse (Explicitly)
  Write this on the board at Minute 5: **"Out of Scope Today."**
  1.  **Units of Selection:** "We are assuming the organism is the unit. We are not solving the gene-vs-group selection debate today."
  2.  **Disease as Dysfunction:** "We are not defining 'health.' We are defining 'function.' A cancer cell has functions, but the organism is diseased. Don't conflate them."
  3.  **Mental Content:** "We are not solving intentionality. Biological function is not the same as 'what I intend to do.'"

  ### 9. Whiteboard Layout Plan
  *   **Left Column:** The Heart Valve (Dysfunction). Three sentences (Flow, Failure, Sound).
  *   **Middle Column:** The Three Accounts.
      *   CR: System Capacity (Now).
      *   SE: Ancestral History (Then).
      *   FL: Survival Propensity (Future).
  *   **Right Column:** The Stress Test (Enzyme & Junk DNA).
      *   Enzyme: History? System? Propensity?
      *   DNA: Binding (CR) vs. Conservation (SE).
  *   **Bottom Strip:** Out of Scope (Units, Disease, Mind).

  ### 10. Timing Breakdown
  *   **00-10:** Heart Valve. Elicit the three sentences.
  *   **10-25:** Formalize CR (Sentence 1 & 3).
  *   **25-40:** Formalize SE (Sentence 2). Introduce Vestigial Organ counter-example.
  *   **40-55:** Formalize FL. Introduce Enzyme Case. Test all three against it.
  *   **55-65:** Junk DNA Application (The "Stakes").
  *   **65-70:** The "Merely Verbal" trap (Refute using Junk DNA stakes).
  *   **70-75:** The Adaptation Question & Reveal Author Names (Millikan, Cummins, etc.).

  ### Summary of Advice
  Your gloss on **Forward-Looking** needs the most work (change to Propensity). The **Heart Valve** is safe if you focus on "True Sentences" rather than "Function." The **Enzyme** is the right carrying case because it breaks the link between History and Organism. The **Junk DNA** example is your shield against the "Merely Verbal" objection—use it to show that definitions have budgetary consequences. Refuse the **Units of Selection** debate explicitly, or the bio majors will hijack the hour.
