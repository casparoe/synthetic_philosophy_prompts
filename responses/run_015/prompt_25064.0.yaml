prompt: |-
  I am a novelist working on a book whose protagonist struggles with impulses she neither chose nor endorses — sexual jealousy, an almost physical craving for status, a reflexive us-versus-them response to outsiders — and I have been reading evolutionary psychology to ensure the portrayal has some intellectual backbone rather than resting on folk intuitions. One methodological claim I keep encountering in this literature is that studying the mind is like reverse-engineering a piece of technology: you examine a psychological trait's design features — its inputs, its decision rules, its outputs — and infer what adaptive problem it was built to solve, just as an engineer might dismantle a competitor's device and reconstruct its functional specifications from the circuitry. The analogy is routinely deployed to deflect the charge that evolutionary psychology deals in "just-so stories." The reasoning is that reverse-engineering is a rigorous, constraint-based enterprise, not free-form narrative invention, so the analogy licenses the conclusion that evolutionary psychology is a genuine science rather than speculative storytelling dressed in Darwinian vocabulary.

  I want to know how far this analogy actually holds. Please give me a correspondence table — what maps onto what between reverse-engineering an artifact and inferring the adaptive function of a psychological trait — and then walk me through the disanalogies. Which disanalogies matter for the intended conclusion (that the field is rigorous science, not just-so stories) and which are merely cosmetic? Once the disanalogies are on the table, does the conclusion survive, or was the analogy doing more argumentative work than it can bear? If there is a better analogy for what evolutionary psychologists actually do, I would like to hear it.

  Respond in the style of an expert philosopher of science. Think very carefully before answering; I need a precise, systematic analysis, not a general impression.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist seeking intellectual rigor for character portrayal, specifically regarding evolutionary psychology (EP).
      *   **Topic:** The "reverse-engineering" analogy used in EP to defend against "just-so story" accusations.
      *   **Task:**
          1.  Provide a correspondence table (Artifact Reverse-Engineering vs. EP Adaptive Inference).
          2.  Analyze disanalogies (which matter, which are cosmetic).
          3.  Evaluate whether the conclusion (EP is rigorous science, not just-so stories) survives the disanalogies.
          4.  Suggest a better analogy if applicable.
      *   **Style:** Expert philosopher of science (precise, systematic, analytical, nuanced).
      *   **Constraint:** Think carefully before answering.

  2.  **Deconstruct the "Reverse-Engineering" Analogy:**
      *   *Core Claim:* Minds are like artifacts designed for a purpose. By analyzing the "circuitry" (psychological mechanisms), we can infer the "design specifications" (adaptive problems).
      *   *Proponents:* Cosmides & Tooby are the primary architects of this view (The Adapted Mind).
      *   *Critics:* Gould, Lewontin (Spandrels), Kitcher, Buller, and many contemporary philosophers of biology.
      *   *Key Philosophical Issue:* Teleology without a Designer. Artifacts have intentional designers; evolution does not.

  3.  **Drafting the Correspondence Table:**
      *   Need to map the steps of engineering reverse-engineering to EP methodology.
      *   *Artifact:* Device (e.g., radio). *Mind:* Psychological Mechanism (e.g., cheater detection).
      *   *Designer:* Engineer. *Designer:* Natural Selection.
      *   *Function:* Intended use. *Function:* Adaptive value (fitness enhancement).
      *   *Constraints:* Physical laws, cost of materials. *Constraints:* Phylogenetic history, genetic variance, trade-offs.
      *   *Evidence:* Circuitry, schematics. *Evidence:* Behavioral output, neural correlates, cross-cultural universality.
      *   *Validation:* Does it work as intended? *Validation:* Does it solve the proposed ancestral problem?

  4.  **Identifying Disanalogies (The Crucial Step):**
      *   *Disanalogy 1: The Designer.* Artifacts have a conscious agent with intentions. Evolution is blind, cumulative, and opportunistic. *Significance:* High. Intentions fix function; selection pressures are multiple and shifting.
      *   *Disanalogy 2: Access to History.* An engineer can often find the manual or ask the creator. An EP researcher has no access to the Environment of Evolutionary Adaptedness (EEA). *Significance:* High. This is the root of the "just-so" charge.
      *   *Disanalogy 3: Optimization.* Engineers aim for optimal solutions (within constraints). Evolution aims for "good enough" to reproduce. Satisficing vs. Optimizing. *Significance:* Medium-High. Leads to over-attribution of adaptation.
      *   *Disanalogy 4: Exaptation/Spandrels.* Artifacts are usually built for their current use. Biological traits are often co-opted (feathers for warmth -> flight). *Significance:* High. Reverse-engineering assumes current use = original function.
      *   *Disanalogy 5: Modularity.* Engineering favors clean modules. The brain is highly interconnected/plastic. *Significance:* Medium. Affects the "input/output" mapping.

  5.  **Evaluating the Conclusion (Rigorous Science vs. Just-So Stories):**
      *   Does the analogy hold enough weight to prove rigor?
      *   *Argument:* The analogy *aspires* to rigor but fails to guarantee it because the constraints are looser in biology than in engineering.
      *   *Nuance:* EP *can* be scientific (predictive, testable), but the reverse-engineering analogy alone doesn't secure that status. It requires independent evidence (cross-species comparison, game theory modeling, neural imaging).
      *   *Verdict:* The analogy is a heuristic, not a proof of methodological validity. It masks the underdetermination of theory by data.

  6.  **Developing a Better Analogy:**
      *   What captures the blind, historical, constraint-laden nature of evolution?
      *   *Archaeology:* Inferring function from fragments without the blueprint.
      *   *Forensics:* Reconstructing a crime scene from traces.
      *   *Linguistics (Historical):* Reconstructing proto-languages from descendant dialects.
      *   *Selection:* **Paleontological Reconstruction / Forensic Archaeology.** This highlights the fragmentary nature of the evidence and the reliance on inference to the best explanation rather than deduction from design.
      *   *Alternative:* **Tinkering (Jacob's "Evolution as Tinkering").** Contrasts with Engineering. A tinker uses whatever is at hand. This better captures exaptation and sub-optimality.

  7.  **Refining the Tone:**
      *   Must sound like a philosopher of science (e.g., akin to Philip Kitcher, Elisabeth Lloyd, or Kim Sterelny).
      *   Use terms like "underdetermination," "teleology," "exaptation," "EEA," "heuristic."
      *   Maintain neutrality but be critical. Acknowledge EP's contributions while exposing the logical gaps.

  8.  **Self-Correction/Review during drafting:**
