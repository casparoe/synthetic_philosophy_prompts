answer: |-
  Look, if you're going to sign up for naive truth—where the T-schema $T(\ulcorner A \urcorner) \leftrightarrow A$ holds without restriction—you're already living on the edge. Most folks think the big bad wolf is the Liar Paradox. But if you're a dialetheist or a paraconsistent theorist, you've already got a bulletproof vest for that. You just say, "Sure, some sentences are both true and false, and we block Explosion so the whole system doesn't blow up."

  But then Curry shows up to the party, and he's not wearing a negation sign. He doesn't care about your paraconsistent armor. Curry's paradox uses a sentence like, "If this sentence is true, then the moon is made of green cheese." Let's call this sentence $C$. Because of naive truth, $C$ is equivalent to $T(\ulcorner C \urcorner) \to \text{Cheese}$.

  Here's the problem: You can derive "The moon is made of green cheese" using rules that look incredibly innocent. To stop this, you have to cut a rule. The standard move in some circles is to weaken Modus Ponens (MP). But I'm telling you, that's a mistake. If you want a truth predicate that actually *works*, you need to keep MP and instead reject the structural rule of Contraction.

  Let's get into the weeds of the proof mechanics to see why.

  ### The Mechanics of the Damage

  To see where the body is buried, look at how the Curry derivation actually runs in a natural deduction style.

  1.  We have our Curry sentence $C$, which is equivalent to $C \to B$ (where $B$ is "Moon is Cheese").
  2.  We start a sub-proof and **assume** $C$.
  3.  Because we assumed $C$, and we know $C \leftrightarrow (C \to B)$, we can write down $C \to B$.
  4.  Now, to get $B$, we need to use Modus Ponens on $C$ and $C \to B$.
  5.  **Here's the catch:** In step 3, we used our assumption $C$ to get the conditional. In step 4, we need to use that same assumption $C$ *again* as the antecedent to trigger the conditional.

  In classical logic, assumptions are like infinite resources. If you assume $C$, you can use it once, twice, or a million times. That's Contraction. It's the rule that lets you go from "If I have $A$, then if I have $A$, I have $B$" to "If I have $A$, I have $B$." Formally, it's the move from $A \to (A \to B)$ to $A \to B$.

  In the Curry derivation, when we discharge the assumption to conclude $C \to B$, we are essentially claiming that one instance of $C$ was enough to produce $B$. But the derivation secretly consumed $C$ twice. Once to unlock the conditional, and once to fire it.

  If you reject Contraction, you treat assumptions like tickets. You buy one ticket ($C$), you enter the theater (derive $C \to B$), but you can't use that same ticket to buy popcorn (derive $B$). You'd need two tickets. So, from the assumption $C$, you can only derive $C \to (C \to B)$. You cannot contract that down to $C \to B$. Without that contraction, the loop closes, and you never derive $B$.

  ### Why Modus Ponens is Sacred

  Now, why not just break Modus Ponens instead? After all, MP is the step that actually produces the absurdity $B$.

  Here's the hard truth: Modus Ponens is the entire point of having a conditional. The word "if" promises detachment. If I tell you, "If it rains, the grass gets wet," and you look outside and see rain, you expect to conclude the grass is wet. If your logic says, "Well, you have the rule and you have the rain, but you can't detach the wetness," then your conditional isn't doing any work.

  If you weaken MP to stop Curry, you cripple the truth predicate. We want naive truth so we can reason about truth. We want to say, "It is true that snow is white," and infer "Snow is white." That's a T-schema elimination, which functions exactly like Modus Ponens. If you can't detach the content from the truth predicate, the predicate becomes a decorative label. It's useless for inference.

  Contraction, on the other hand, is a structural convenience. It says, "Information doesn't get used up." In ordinary reasoning, that's fine. If I know $2+2=4$, I can use that fact to prove a theorem, and I still know $2+2=4$ afterward. But in self-referential contexts involving truth, information *does* seem to get consumed. The sentence $C$ is trying to use its own truth to validate its own consequence. Restricting Contraction says, "You can't double-dip." It preserves the intuitive power of "if...then" while stopping the self-referential loop from spinning out of control.

  ### The Liar Doesn't Force This Choice

  You might wonder, "Didn't we already mess with logic for the Liar?"

  The Liar sentence ($L$) says "I am not true." Naive truth gives us $T(\ulcorner L \urcorner) \leftrightarrow \neg T(\ulcorner L \urcorner)$. This leads to a contradiction: $T(\ulcorner L \urcorner) \land \neg T(\ulcorner L \urcorner)$.

  Paraconsistency handles this by blocking Explosion ($A, \neg A \nvdash B$). This allows the contradiction to sit there without trivializing the system. But notice: The Liar relies on negation. Curry does not. You can formulate Curry with just the conditional and truth. So, even if you have a paraconsistent logic that tolerates the Liar's contradiction, Curry will still trivialize your system because it doesn't produce a contradiction; it produces *everything*.

  So you need two shields. Paraconsistency blocks the explosion from the Liar. Non-contraction blocks the derivation from Curry. They are distinct tools for distinct paradoxes. Trying to use a weakened MP to solve Curry is like using a sledgehammer to fix a watch; you stop the problem, but you break the mechanism you actually wanted to keep.

  ### The "Math Breaks" Objection

  The biggest pushback you'll get is this: "If you drop Contraction, you break ordinary mathematics."

  It's true that in a fully non-contractive logic (like some linear logics), you can't prove certain standard theorems easily. For example, proving $A \to A$ sometimes requires contraction depending on how you set up the system, and induction can get finicky. Critics say this is too high a price.

  But consider the alternative. If you keep Contraction and drop MP, you break *all* reasoning involving conditionals. That includes math. Math is built on implications. "If $n$ is even, then $n^2$ is even." If you can't detach the consequent, arithmetic grinds to a halt just as hard.

  However, the non-contractive theorist has a better story here. We can argue that Contraction holds for "stable" propositions—like math facts—but fails for "unstable" propositions involving the truth predicate. Or, we accept that the logic of resources is actually more fundamental.

  Think about a toy example. Imagine you have a digital coupon on your phone. The coupon says: "If this coupon is valid, you get a free coffee."
  Let $V$ be "This coupon is valid." The text is $V \to \text{Coffee}$.
  To get the coffee, you show the coupon. The scanner reads $V$. It checks the rule $V \to \text{Coffee}$. It dispenses coffee.
  But now the coupon is used. You can't scan it again.
  In classical logic, the coupon is like a Platonic form; scanning it doesn't change it. In a non-contractive logic, using the assumption consumes it.

  Does this break math? Not really. When I prove $2+2=4$, I'm not consuming the number 2. Numbers aren't coupons. The restriction on Contraction primarily bites when we deal with self-referential truth conditions that act more like processes or resources than static facts. So, while we might lose some elegant shortcuts in proof theory, we don't lose the ability to do arithmetic. We just lose the ability to use a premise twice *in the same breath* without explicitly stating we have two copies.

  ### The Bottom Line

  At the end of the day, you have to ask what you want your logic to do. If you want a naive truth predicate that allows you to say "This sentence is true" and actually mean something, you need Modus Ponens. You need to be able to move from "It is true that $A$" to "$A$".

  If you sacrifice MP, you save the system from triviality, but you've saved a corpse. The truth predicate is there, but it's disconnected from the world.

  If you sacrifice Contraction, you admit that self-referential truth is a resource-intensive game. You can't use the truth of a sentence to validate itself without paying a cost. It's a weird constraint, sure. But it's less weird than a conditional that doesn't let you detach. It keeps the engine of inference running while just putting a governor on the fuel line to prevent it from overclocking into paradox.

  So, keep detachment. It's the heart of reasoning. Let Contraction go. It's just a structural habit we don't need when things get self-referential.
