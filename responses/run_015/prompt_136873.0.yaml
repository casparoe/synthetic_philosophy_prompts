answer: |-
  Here is the specification sheet for the theory of conventional obligation you need. It is designed to filter out "that's just how we do it" from "you owe it to them."

  ### The Desiderata (The Spec)

  A theory of conventional obligation must satisfy the following conditions to be useful for your guidebook.

  **1. The Epistemic Access Condition**
  *   **The Requirement:** An agent cannot be under a moral obligation to follow a convention they could not reasonably be expected to know.
  *   **The Case:** *The Newcomer vs. The Expat.* The tourist on day one cuts the phantom queue; the expat on year nine does the same. The theory must explain why the tourist is excused but the expat is blameworthy.
  *   **Status:** **Non-negotiable.** Without this, morality becomes a trap for the uninformed.

  **2. The Coordination Efficacy Condition**
  *   **The Requirement:** The convention must actually function to coordinate behavior or solve a collective action problem. If following the rule does not contribute to the solution, the obligation lapses.
  *   **The Case:** *The Phantom Queue.* At the rural bus stop, the line is invisible (inside the cafe). If you stand outside, you break the coordination even if you see no line. The theory must explain why you are obligated to inquire/enter the cafe, not just stand where you see people standing.
  *   **Status:** **Non-negotiable.** This distinguishes conventions from arbitrary commands.

  **3. The Critical Mass Threshold**
  *   **The Requirement:** The obligation must scale with the level of compliance. If compliance drops below a certain point, the obligation to follow the rule dissolves.
  *   **The Case:** *The Half-Dead Convention.* Roughly half the people still take off their shoes in the genkan, half don't. Does the obligation hold? A theory must define the tipping point where a norm becomes a "zombie" that no longer binds.
  *   **Status:** **Hobbyhorse.** (Some argue a rule binds until officially repealed; others argue it binds only while effective. You need to pick a side, but it's debated.)

  **4. The Justice Override**
  *   **The Requirement:** A convention that systematically extracts value from the vulnerable or violates basic rights generates no moral obligation to comply, and may generate an obligation to subvert.
  *   **The Case:** *The Extractive Convention.* Tips that substitute for wages, or "fees" that bribe officials to move permits up the pile. The theory must explain why you shouldn't just "do as the Romans do" when Rome is exploiting the poor.
  *   **Status:** **Hobbyhorse.** (Legal positivists argue obligation is separate from merit; moral realists argue unjust rules are no rules at all. For a guidebook, you likely want this to be non-negotiable, but philosophically it is contested.)

  **5. The Harmless Deviation Clause**
  *   **The Requirement:** If violating the convention causes no harm, frustrates no reasonable expectation, and undermines no system, the obligation is suspended.
  *   **The Case:** *Jaywalking at 4am.* No traffic, no witnesses, no risk. The theory must explain why this is permissible while jaywalking at 5pm is not, despite the rule being the same.
  *   **Status:** **Hobbyhorse.** (Kantians/Rule-Worshippers reject this; Consequentialists accept it.)

  **6. The Compliance/Enforcement Distinction**
  *   **The Requirement:** The theory must distinguish between *I must do X* and *I must make you do X.*
  *   **The Case:** *The Tip Screen.* You may feel obligated to tip (compliance) due to social pressure, but you have no right to berate another customer who doesn't (enforcement).
  *   **Status:** **Non-negotiable.** (As per your constraint). Collapsing these leads to vigilante etiquette.

  **7. The Binding/Goodness Distinction**
  *   **The Requirement:** The theory must distinguish between *This rule binds me* and *This rule is good.*
  *   **The Case:** *Service Included vs. Tip Screen.* A rule can be binding (you should follow it) even if it's annoying or inefficient, provided it meets other criteria. Conversely, a "good" idea (being kind) isn't always a binding convention.
  *   **Status:** **Non-negotiable.** (As per your constraint).

  **8. The Sanction Independence Condition**
  *   **The Requirement:** The obligation must hold even if the probability of social sanction (dirty looks) is zero.
  *   **The Case:** *Invisible Compliance.* You are in a stall, or a camera blind spot. Nobody sees if you stand on the right of the escalator. If the only reason to do it is fear of shame, it's prudence, not obligation.
  *   **Status:** **Non-negotiable.** This is the difference between morality and crowd control.

  ***

  ### The Conflict: Which Pair Cannot Be Met?

  You guessed the conflict lies between *Invisible Compliance* (obligation holds without witnesses) and *Extractive Conventions* (obligation lapses if unjust). That is a tension, but it is manageable (one is about epistemology, the other about content).

  The real incompatibility is between **The Epistemic Access Condition (1)** and **The Coordination Efficacy Condition (2).**

  **Why they conflict:**
  Take the **Phantom Queue**.
  *   **Coordination Efficacy** says: "The system only works if everyone enters the cafe. Therefore, you are obligated to enter the cafe to maintain the system."
  *   **Epistemic Access** says: "You had no way of knowing the queue was in the cafe. Therefore, you are not obligated to enter the cafe."

  If you prioritize Coordination, you punish the newcomer for failing to read minds (violating Access). If you prioritize Access, you allow the newcomer to break the coordination (violating Efficacy). A theory cannot simultaneously demand you solve the coordination problem *and* excuse you for not knowing the coordinates. You must choose: does the obligation arise from the *need for order* (which binds the ignorant) or from *fair agreement* (which excuses the ignorant)?

  ***

  ### The "Killer" Requirement

  The single requirement that does the most work in ruling candidate theories out is **The Justice Override (4).**

  **Why:**
  Most standard sociological or game-theoretic accounts of convention (Humean coordination, Lewisian equilibria) are morally neutral. They explain why we queue, but they cannot explain why we *shouldn't* queue for a segregated water fountain.
  *   **Utilitarianism** struggles here because it might calculate that the "extractive convention" (e.g., tipping culture) actually maximizes overall welfare by keeping prices low, even if it exploits staff.
  *   **Contractarianism** struggles because the "contract" was signed by previous generations, not the exploited worker.
  *   **Rule-Worship (Kantian)** struggles because it often universalizes the *act* of following rules, rather than the *content* of the rule.

  To pass the Justice Override, a theory must be robustly moral, not just functional. It forces the theory to admit that some social pressures are illegitimate power structures, not obligations. This kills any theory that defines obligation purely as "what the group expects."

  ***

  ### Scorecard of Standard Stories

  Here is how three common theoretical frameworks perform against your spec.

  | Theory | The Gist | Passes Justice Override? | Passes Epistemic Access? | Verdict for Guidebook |
  | :--- | :--- | :--- | :--- | :--- |
  | **Humean Coordination** | Conventions are solutions to coordination problems. We obey to keep the system working. | **No.** It treats extractive conventions (like bribes) as binding if they stabilize expectations. | **No.** It tends to bind the ignorant newcomer because the system needs them to comply. | **Reject.** Too conservative. Validates "that's just how it is" even when "it" is unfair. |
  | **Rawlsian Fair Play** | If you accept the benefits of a scheme, you owe it to others to follow the rules. | **Yes.** Unjust schemes do not generate obligations of fair play. | **Mixed.** Struggles with the *Newcomer*. Did they "accept" benefits if they didn't know the price? | **Strong Contender.** Good on tipping/extractive cases. Needs tweaking for the "Phantom Queue" (epistemic) case. |
  | **Scanlonian Reasonable Rejection** | A rule binds if no one could reasonably reject it given the desire to find mutually justifiable rules. | **Yes.** Extractive rules are reasonably rejectable. | **Yes.** Hidden rules (Phantom Queue) are reasonably rejectable. | **Winner.** Handles the 4am Jaywalk (no reasonable rejection of deviation) and the Tip Screen (reasonable rejection of coercion). |

  **Recommendation:** Build your chapter on a **Scanlonian** foundation. It naturally handles the distinction between *enforcement* (you can't force me if I can reasonably reject the rule) and *compliance* (I follow it because I respect you), and it dissolves the Phantom Queue paradox by placing the burden of clarity on the locals, not the newcomer.
