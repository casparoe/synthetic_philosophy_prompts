answer: |-
  I'll grant you that "right but early" is usually a lazy excuse, and Malthus certainly missed the elasticity of substitution regarding fossil fuels. I'll even concede that the causal arrow sometimes inverted—once income rose, fertility didn't spike as he feared, it eventually dropped. But you're conflating the exception with the rule when you call the mechanism self-negating. For pressure to breed innovation rather than misery, you need specific institutional luck, not just scarcity. Look at the Yangtze Delta in the 18th century: population density was higher than in England, pressure was immense, yet there was no industrial breakthrough—only involution and stagnant wages. The escape in Britain wasn't the logical culmination of that pressure; it was a thermodynamic accident involving coal seams near waterways. If the mechanism were truly self-negating, we'd see multiple independent industrializations arising from population pressure alone. We don't. The delay wasn't the gestation period of the solution; it was the time it took to stumble upon an energy source that broke the land constraint.

  On falsifiability: a theory isn't degenerate just because it has boundary conditions, provided those conditions are independently verifiable. The "organic economy" isn't an ad hoc shield; it's the constraint of photosynthetic energy capture. Here is the specific observation that would have falsified Malthus in 1800: if England between 1750 and 1800 had shown sustained growth in real wages per capita concurrent with population growth, without a shift to mineral energy. We see the opposite: wages stagnated while population jumped from 6 to 9 million. So, if the trap held universally for 10,000 years until a specific energy transition, why do we treat the exception as the refutation of the rule, rather than the confirmation of the boundary condition?
