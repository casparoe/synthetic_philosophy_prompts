          *   *Where it looks like Trauma:* Flashbacks are epistemic intrusions, not ontological shifts. A PTSD sufferer *feels* the past is present, but the past isn't ontologically present.
          *   *The Conflation:* Vonnegut deliberately blurs this. The "science fiction" elements might be coping mechanisms. If Billy is just dissociated, the novel describes an *epistemic* fracture, not a *metaphysical* truth. R-P claims metaphysical truth. This is the friction point.

      *   **Section 3: "So It Goes" and Moral Urgency:**
