          *   *The Tension:* R-P implies determinism (in a sense). But Vonnegut is anti-war. If "So it goes" means "death is inevitable in the block," does it excuse the bombing of Dresden?
          *   *Analysis:* The refrain functions as a *phenomenological* coping strategy for the Block, but the *narrative* (Vonnegut's voice) retains moral judgment. Vonnegut (the author) is stuck in time, even if Billy isn't. This saves the moral urgency.

      *   **Section 4: What the Novel Adds (Phenomenology of the Block):**
