answer: |-
  # The Festival Ethics Triage Protocol (FETP)

  **Purpose:** To determine the disposition of a scheduled work when ethical allegations arise against its maker or production.
  **User:** Programming Associate.
  **Time Limit:** 48 Hours.
  **Authority:** This protocol generates a *recommendation*. Final authority rests with the Festival Director (your boss) and, where financial or political risk is high, the Board.

  ---

  ## Phase 1: Epistemic Triage (The "Fog" Check)
  *Before assessing the harm, assess the certainty.*

  **Q1. What is the evidentiary status of the allegation?**
  *   **A. Legal Conviction/Admission:** Proceed to Phase 2.
  *   **B. Credible Reporting (Multiple sources, on-record):** Proceed to Phase 2.
  *   **C. Single Source/Anonymous/Social Media:** **STOP.**
      *   *Action:* Issue a "Hold" status. Do not print programme yet.
      *   *Sign-off:* **Festival Director** must decide whether to investigate further or treat as rumor. (Value Judgment: Risk of censorship vs. risk of platforming harm).
  *   **D. Public Knowledge:** Has the audience already heard this?
      *   *Yes:* You are in **Damage Control**. Context is mandatory.
      *   *No:* You are in **Prevention**. Context may introduce the allegation to a new audience. (Value Judgment: Do we educate or amplify? **Director Sign-off**).

  ---

  ## Phase 2: The Fork (Nature of the Harm)
  *This determines which ethical track you are running.*

  **Q2. Is the alleged wrongdoing constitutive of the work?**
  *Could the work exist in its current form without the wrongdoing?*
  *   **YES (Track A):** The harm is embedded (e.g., footage obtained by deception, stolen artifacts, abuse filmed as content).
      *   *Go to Phase 3A.*
  *   **NO (Track B):** The harm is external (e.g., director's private conduct, financial fraud unrelated to production, past crimes).
      *   *Go to Phase 3B.*

  ---

  ## Phase 3A: Constitutive Integrity Track
  *The work itself is the site of harm.*

  **Q3. Can the harm be excised without destroying the work?**
  *   **YES:** (e.g., remove a specific shot, credit a missing collaborator).
      *   *Disposition:* **Show with Conditions.** Execute edit/credit change.
  *   **NO:** (e.g., the stolen object *is* the sculpture; the coercion *is* the dynamic filmed).
      *   *Go to Q4.*

  **Q4. Who holds the rights of consent regarding the harm?**
  *   **Identifiable Individual (Subject):** Do they consent to screening?
      *   *Yes:* Proceed to Q5.
      *   *No:* **Disposition: PULL.** (Value Judgment: Victim autonomy overrides artistic merit. **Director Sign-off**).
  *   **Community/Group:** Do they consent?
      *   *Yes:* Proceed to Q5.
      *   *No:* **Disposition: PULL.** (Value Judgment: Collective rights override contract. **Board Sign-off** required if contract is breached).
  *   **Split/Conflicting:** (e.g., Subject A wants it shown, Subject B wants it buried).
      *   *Action:* **STOP.**
      *   *Sign-off:* **Festival Director.** (Value Judgment: Weighing competing victim testimonies is not a factual calculation; it is a moral hierarchy the Director must own).

  **Q5. Is the notoriety of the harm part of the work's appeal? (The "Taint-Value" Check)**
  *   **YES:** (e.g., "Look at this transgressive act").
      *   *Disposition:* **PULL.** (Reason: Platforming becomes complicity in exploitation).
  *   **NO:** (e.g., The work is valued despite the harm).
      *   *Disposition:* **Show with Context.** (Mandatory: Panel, statement, or redirect of funds).

  ---

  ## Phase 3B: Platforming Ethics Track
  *The work is clean; the maker is not.*

  **Q6. Does the misconduct align with the Festival's Mission Statement?**
  *   **YES:** (e.g., Festival is about radical free speech; artist was charged with speech crime).
      *   *Disposition:* **Show as Planned.**
  *   **NO:** (e.g., Festival is about community safety; artist is a violent offender).
      *   *Go to Q7.*

  **Q7. Who profits from the screening?**
  *   **The Artist:** (Fee goes directly to them).
      *   *Disposition:* **Show with Conditions.** (Renegotiate fee to zero or redirect to relevant charity).
  *   **The Victims:** (Proceeds go to a fund).
      *   *Disposition:* **Show with Conditions.**
  *   **Third Party/Distributor:** (Artist sees no money).
      *   *Disposition:* **Show with Context.** (Note in programme).

  **Q8. Is this a Collaborative Work?**
  *   **YES:** (e.g., 40-person crew, one bad actor).
      *   *Disposition:* **Show as Planned** *unless* the bad actor is the primary public face (Director/Lead). If they are the face, treat as **Track A**.
  *   **NO:** (Solo auteur).
      *   *Proceed to Phase 4.*

  ---

  ## Phase 4: Convergence & Sign-Off
  *Combine the tracks to reach the four dispositions.*

  | If Track A (Constitutive) | If Track B (External) | Disposition | Required Sign-off |
  | :--- | :--- | :--- | :--- |
  | Harm Excisable | N/A | **Show with Conditions** (Edit) | Programming Associate |
  | Harm Inexcusable + Victim Consents | Artist Profits | **Show with Conditions** (Funds/Context) | Festival Director |
  | Harm Inexcusable + Victim Objects | Mission Violation | **PULL** | **Board** (Political/Financial Risk) |
  | Harm Inexcusable + Split Victims | Artist Clean / Crew Bad | **Show as Planned** (with note) | Programming Associate |
  | Taint-Value is the Appeal | N/A | **PULL** | Festival Director |

  **Final Administrative Check:**
  *   **Insurance/Venue:** Does showing this void insurance or violate venue contract?
      *   *If Yes:* **PULL.** (This overrides all ethical considerations).
      *   *Sign-off:* **Festival Director.**

  ---

  ## Test Case Runs

  ### Case 1: The Vérité Feature (Coercive Relationship)
  *   **Phase 1:** Credible Reporting (Relationship known). Public Knowledge (Low).
  *   **Phase 2 (Fork):** **Track A (Constitutive).** The relationship dynamic is the subject matter; the film likely could not exist without the coercion.
  *   **Phase 3A:**
      *   Q3: Can harm be excised? **No.** The coercion is the lens.
      *   Q4: Consent? Subject is alive and wants it shown. *However*, Q1 (Epistemic) flags "Coercive Relationship."
      *   *Protocol Flag:* Consent given under coercion is epistemically unstable.
      *   Q5: Taint-Value? Is the abuse the selling point? If yes, Pull. If no, proceed.
  *   **Result:** **Show with Context.** (Panel on ethics of vérité, fee redirected to domestic violence fund).
  *   **Sign-off:** **Festival Director.** (Reason: Assessing the validity of consent given by a former partner in a coercive dynamic is a value judgment, not a fact).

  ### Case 2: The Animated Short (Financial Fraud)
  *   **Phase 1:** Legal Conviction.
  *   **Phase 2 (Fork):** **Track B (External).** The animation does not require fraud against family to exist.
  *   **Phase 3B:**
      *   Q6: Mission Alignment? Neutral.
      *   Q7: Who Profits? Artist receives fee.
      *   Q8: Collaborative? Likely solo or small team.
  *   **Result:** **Show with Conditions.** (Fee renegotiated; proceeds donated to the defrauded family or financial abuse charity).
  *   **Sign-off:** **Programming Associate** (Standard fee renegotiation) -> **Director** (If family refuses money).

  ### Case 3: The Installation (Burial Site)
  *   **Phase 1:** Credible Reporting/Community Objection.
  *   **Phase 2 (Fork):** **Track A (Constitutive).** The objects *are* the work. They cannot be removed without destroying the piece.
  *   **Phase 3A:**
      *   Q3: Excisable? **No.**
      *   Q4: Consent? Community objects. They want destruction.
      *   *Protocol Command:* **PULL.**
  *   **Result:** **PULL.** (Work must be decommissioned/returned).
  *   **Sign-off:** **Board.**
  *   **Note to Director:** This will cost the insurance money already spent. The protocol prioritizes the community's rights over sunk costs. If you show this, you are violating Phase 3A, Q4. You must own this value judgment personally; the protocol forbids it.

  ---

  ## What Was Dropped (And Why)

  1.  **Aesthetic Merit Judgment:** I removed the question "Is the art still good?"
      *   *Why:* Your associate is not a critic; she is a programmer. In a 48-hour window, judging aesthetic degradation due to morality is subjective and legally risky. We assume the art is "flawless" aesthetically and judge only the ethics of display.
  2.  **The "Dead Artist" Nuance:** I collapsed "Artist dead 90 years" into the Profit/Heritage check.
      *   *Why:* The ethical weight of a dead artist is usually about who inherits the money and whether the work perpetuates historical harm. The protocol handles this via Q7 (Who Profits) and Q4 (Victim Consent/Descendants).
  3.  **Rehabilitation/Redemption:** I did not include a metric for "Has the artist apologized?"
      *   *Why:* In 48 hours, verifying the sincerity of an apology is impossible. It creates a "performative apology" loophole. We judge the harm, not the penance.

  ## What This Procedure Cannot Do

  1.  **It cannot solve the "Epistemic Muddle" of truth.**
      *   If the evidence is purely he-said-she-said (Phase 1, Option C), the protocol forces a "Hold." It cannot tell your friend who is lying. It only tells her that *uncertainty* requires a delay, not a decision.
  2.  **It cannot calculate "Transgressive Value."**
      *   You noted the "Taint-Value" case: where the badness *is* the aesthetic point (e.g., a film about a murderer made compelling by the murderer's charisma). The protocol treats this as a **Pull** (Phase 3A, Q5). It cannot distinguish between "important challenging art" and "exploitation." It errs on the side of safety. If the festival wants to platform transgressive work, the Director must override the protocol, knowing she is accepting the risk.
  3.  **It cannot absorb Financial Loss.**
      *   As seen in Case 3, the protocol will recommend actions that lose money (sunk costs, insurance, fees). It is an ethical tool, not a financial one. It identifies the cost of integrity; it does not pay for it.

  ---

  **Final Note to the Director:**
  This tool separates the *fact* of the harm from the *value* of the response. Wherever you see **"Sign-off: Director/Board,"** the protocol is telling you: *"There is no right answer here, only a responsible one. You must take the blame."*
