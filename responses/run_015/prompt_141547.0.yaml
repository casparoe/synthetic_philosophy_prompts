answer: |-
  ### 1. The Question

  **Essay Question (90 minutes, closed book)**

  Consider a polity described by two measured series: a *demographic proxy* (occupied site count or settled area) and an *institutional proxy* (administrative tiers, standardisation, monumental energy). Consider four stylised 300-year trajectories: (1) both proxies fall >80% and stay down; (2) demographic falls >80%, institutional recovers under new elites; (3) institutional collapses, demographic remains stable; (4) neither falls, but the polity is absorbed and the old elite structure vanishes.

  Two complications apply. *Window sensitivity*: whether a change counts as abrupt depends on whether you measure it over fifty years or five hundred. *Hysteresis*: a system that has flipped may not return to its former state even when forcing is reversed, because the mechanism that would rebuild that state (e.g., a literate cadre) has been destroyed.

  Using this apparatus, evaluate the dispute between the 'collapse' camp and the 'transformation' camp. Is their disagreement merely verbal (a fight over which proxy deserves the name), a disagreement about reversibility in the hysteretic sense, or a normative disagreement resting on the fact that 'collapse' is a thick term which ranks a loss as a failure? You must explicitly analyse at least two of the four trajectories. Conclude by stating what explanatory or predictive work, if any, the word 'collapse' retains once this apparatus is sorted out.

  ***

  ### 2. Model Answer

  The dispute between collapse and transformation theorists is not merely verbal, though it begins there. It is fundamentally a normative disagreement about which proxy constitutes the 'society' worth saving, complicated by the physical reality of hysteresis. To treat it as purely semantic is to ignore the stakes involved in losing the capacity for complexity.

  Trajectory 1 (total decline) and Trajectory 3 (institutional collapse only) reveal the crux of the debate. In Trajectory 1, both demographic and institutional proxies vanish. Here, 'collapse' is descriptively secure; both bodies and structures are gone. The transformation camp might argue continuity in the genetic lineage of survivors, but this stretches 'society' beyond useful recognition. However, Trajectory 3 is where the slogan 'societies do not fail, they change' becomes dangerous. Here, the people remain and fields are farmed, but the bureaucracy, standards, and monuments vanish. The transformation camp calls this continuity; the collapse camp calls it failure.

  This is not just a choice of proxy; it is a choice of value. 'Collapse' is a thick term. It describes a loss but also ranks it as a failure. If one identifies the society with the population (demographic proxy), Trajectory 3 is survival. If one identifies the society with the apparatus of coordination (institutional proxy), it is collapse. The transformation slogan often quietly privileges the demographic proxy to avoid the normative weight of 'failure,' effectively arguing that because people survive, the loss of complex coordination does not matter.

  Hysteresis makes this normative choice consequential rather than abstract. In Trajectory 3, the loss of the institutional proxy is not merely a change in style; it is the destruction of the mechanism required to rebuild complexity. The literate cadre is gone; the fiscal habit is broken. Even if climate and population recover, the polity does not return to its former state because the path back is blocked. This is not metaphorical path dependence; it is the loss of specific social technology. Therefore, calling Trajectory 3 a 'transformation' obscures the irreversible cost of losing institutional capacity.

  Consequently, the word 'collapse' retains explanatory work only if it identifies hysteretic thresholds. It warns that crossing certain institutional limits destroys the capacity for recovery, distinguishing reversible fluctuations from irreversible simplifications. It predicts that once the institutional proxy crashes below a certain floor, restoration requires not just removed pressure, but reinvented mechanisms. Without this specific reference to hysteretic loss of capacity, 'collapse' is merely a pejorative for change. With it, it marks the boundary where transformation becomes impoverishment. The dispute, therefore, is not about whether change occurred, but whether the change destroyed the possibility of being otherwise.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **1. Proxy Distinction (5 marks)**
  The answer must clearly distinguish between the demographic proxy (bodies/area) and the institutional proxy (complexity/standards). It must not conflate population decline with institutional simplification.
  *   *5 marks:* Clear, consistent distinction maintained throughout.
  *   *0-2 marks:* Proxies treated as interchangeable or confused.

  **2. Trajectory Analysis (5 marks)**
  The answer must explicitly analyse at least two of the four provided trajectories to ground the argument.
  *   *5 marks:* Two trajectories analysed with specific reference to proxy behaviour.
  *   *0-2 marks:* Trajectories mentioned generically or only one used.

  **3. Substantive Hysteresis (5 marks)**
  The answer must use hysteresis to explain why recovery is mechanically difficult, not just historically unlikely. It must reference the destruction of rebuilding mechanisms (e.g., literate cadre).
  *   *5 marks:* Hysteresis used as a mechanism of irreversibility.
  *   *0-2 marks:* Hysteresis treated as a metaphor for 'big change' or ignored.

  **4. Normative/Thick Term Analysis (5 marks)**
  The answer must address 'collapse' as a thick term that combines description with evaluation (ranking loss as failure). It must identify whose failure is being counted (elites vs. population).
  *   *5 marks:* Explicit discussion of the normative weight and identification of the society.
  *   *0-2 marks:* Treats 'collapse' as purely descriptive or purely pejorative without analysis.

  **5. Explanatory Utility (5 marks)**
  The conclusion must state what work the concept retains (e.g., identifying thresholds, warning of irreversibility) or argue convincingly for its abandonment.
  *   *5 marks:* Clear statement on predictive or explanatory value derived from the previous analysis.
  *   *0-2 marks:* Vague conclusion or no statement on utility.

  **Differentiation (A vs. B)**
  A **B-grade** answer will correctly identify the proxies and define hysteresis but will treat the normative issue and the hysteretic mechanism as separate points. An **A-grade** answer will integrate them, arguing that the normative weight of 'collapse' is justified *because* of the hysteretic loss of capacity. The A answer recognises that the 'transformation' slogan often hides the cost of losing the mechanism to rebuild.

  ***

  ### 4. Frequent Failures

  **1. The Verbal Dispute Stopgap (Penalty: -5 marks)**
  Students often declare the dispute "merely verbal" and stop there. This fails the prompt's requirement to evaluate *what is at stake*. It ignores the material consequences of proxy selection.

  **2. Proxy Sliding (Penalty: -5 marks)**
  Sliding between demographic and institutional proxies without noticing. For example, arguing people survived (demographic) to prove the bureaucracy didn't collapse (institutional). This violates the apparatus.

  **3. Poetic Hysteresis (Penalty: -5 marks)**
  Treating hysteresis as a flourish meaning "things change permanently" rather than a specific claim about destroyed rebuilding mechanisms. This misses the scientific borrowing required by the prompt.

  **4. Data Settles Normativity (Penalty: -5 marks)**
  Supposing that better data could resolve whether Trajectory 3 is a 'failure'. Data tracks proxies; it cannot decide which proxy constitutes the 'society' worth valuing. This is a category error.

  **5. Slogan Recitation (Penalty: -5 marks)**
  Repeating "societies do not fail, they change" without analysing the word 'fail'. This is the exact behaviour the question is designed to prevent. It demonstrates reading without thinking.
