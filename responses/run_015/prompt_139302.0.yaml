answer: |-
  ### Brainstorming Candidate Scenarios

  1.  **The Vulnerable Roommate:** Two friends share a lease. One (Selector) is moving abroad and needs the other (Agent) to handle repairs honestly. The benefit is maintaining the friendship and future housing security. The disposition is "honesty when unobserved." *Weakness:* It is too easy to simulate honesty for a year; the provenance tracking relies too heavily on stipulating the Selector is "good at reading people" rather than structural constraints.
  2.  **The Informal Insurance Pact:** A group of friends agrees to cover each other's emergencies without contracts. The benefit is security. The disposition is "altruistic willingness to pay." *Weakness:* This closely mirrors the Hitchhiker itself. The provenance issue is weak because friends often *do* accept instrumental promises ("I'll do it because we're friends"), blurring the line between calculated loyalty and real loyalty.
  3.  **The Professional Succession:** A senior expert (Selector) must hand over their practice to a junior (Agent). The benefit is career establishment. The disposition is "stewardship" (valuing reputation over quick profit). *Strength:* This relies on long-term observation (ordinary life), has high stakes, and the disposition (stewardship) is logically incompatible with instrumental acquisition (you cannot value something for its own sake *because* it pays).

  **Selection:** The **Professional Succession** scenario is strongest. It grounds the "predictor" in realistic mentorship dynamics rather than sci-fi scanners, and it makes the provenance constraint logical rather than merely empirical.

  ***

  ### The Scenario

  Elias, a senior architect nearing retirement, intends to bequeath his lucrative client list to his junior associate, Mara, but he refuses to sign a binding contract, insisting instead on a handshake deal based on shared values. To secure the inheritance, Mara must possess a disposition of "professional stewardship," valuing the firm's long-term reputation over short-term billing maximization. There will come a specific moment—a complex zoning approval—where cutting ethical corners would guarantee immediate high profit for Mara but risk the firm's standing decades later. Elias has mentored Mara for five years; he is not a neuroscanner, but he knows her trajectory intimately. He will only transfer the clients if he believes her commitment to the craft is intrinsic. However, if Mara attempts to cultivate this stewardship *now* solely to secure the inheritance, Elias will detect the strategic shift in her priorities and withhold the list, knowing that an instrumentally acquired virtue will collapse under pressure. Mara is thus caught: she needs the disposition to get the clients, but deciding to acquire the disposition for the sake of the clients proves she lacks it.

  ### Analysis

  **Why (1) and (2) Hold**
  Condition (1) is satisfied because securing the client list is objectively better for Mara's life plans than being cast out to start over; the disposition of stewardship is the key to this benefit. Condition (2) holds because at the moment of the zoning approval, the immediate self-interested aim (maximizing current income/efficiency) conflicts with the disposition (protecting long-term reputation at short-term cost). Acting on the disposition is locally irrational by the standards of immediate payoff maximization.

  **Why (3) Holds: The Stall**
  Parfit's Hitchhiker reasoning suggests Mara should simply cultivate the disposition of stewardship to signal trustworthiness. However, this stalls at condition (3) because the *content* of the required disposition contradicts the *method* of its acquisition. Stewardship, by definition, involves valuing the practice non-instrumentally. If Mara adopts stewardship *instrumentally* (to get the clients), she is not actually a steward; she is a maximizer mimicking a steward. Elias tracks the provenance not via magic, but via the logical inconsistency visible in her recent behavioral shifts. Every route open to deliberate choice—deciding "I will be a steward to get the clients"—produces the wrong provenance (instrumentalism), which disqualifies her. She cannot decide to have non-instrumental values for instrumental reasons.

  **The Single Feature Doing the Work**
  The feature is **Motivational Transparency via History**. Unlike the Hitchhiker's driver, who scans a static psychological state, Elias evaluates the *trajectory* of Mara's values. The trust is not in the presence of the disposition, but in its *etiology*. The selector distinguishes between a disposition that grew organically (authentic) and one that was adopted strategically (inauthentic).

  **Varying the Feature**
  *   **Selector sees only behavior:** If Elias could only observe Mara's actions during the mentorship and not infer their source, Mara could successfully mimic stewardship, secure the clients, and then defect at the zoning moment. The Hitchhiker logic would succeed; rationality would require her to fake the disposition.
  *   **Selector sees motives but not source:** If Elias could sense Mara's current motivation but not know *why* she has it (e.g., via a magic motive-scanner that doesn't know history), Mara might succeed via self-deception. She could try to convince herself she loves the craft, hiding the instrumental origin even from herself. The barrier weakens, allowing "rational self-manipulation."

  **The Friend's Strongest Reply**
  Your friend would argue that you are conflating *act-rationality* with *dispositional-rationality*. She would say: "Rationality does not demand Mara decide *at the moment of mentorship* to acquire the disposition for the sake of the clients. Rationality demands that Mara, years ago, when the stakes were low, cultivated a genuine love for the craft. The fact that she cannot acquire it *now* instrumentally doesn't mean rationality fails; it means rationality is diachronic. A rational agent manages their character formation over a lifetime so that when the high-stakes moment arrives, they are constitutively unable to defect. The 'irrationality' at the moment of action is the dividend of prior rational investment in character."

  **The Moral of Formation**
  If (3) holds, the real moral is indeed that rationality governs the management of your own formation rather than your acts. This scenario demonstrates that **direct maximization is self-defeating** when trust tracks provenance. Rationality cannot be a matter of calculating the best move at every node; it must be a matter of constructing a self that does not calculate at certain nodes. If you cannot decide to be trustworthy because the decision itself signals untrustworthiness, then rationality must reside in the historical processes (habits, upbringing, prior commitments) that made the disposition inevitable. You are not rational because you choose well; you choose well because you made yourself the kind of person for whom that choice is natural.
