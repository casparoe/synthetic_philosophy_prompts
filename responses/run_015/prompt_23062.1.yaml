      *   **Round 2: Projection/Embedding.**
          *   *Elena:* "If he is a [slur], we should ban him." The offensiveness projects out of the conditional. It's still toxic even in a hypothesis.
          *   *Marcus:* That's because the *use* of the word invokes the ideology, even in a conditional. It's a feature of the tool, not the proposition. Mention the *Demonstrative Theory* (Hom). The word points to a hateful perspective.
      *   **Round 3: Truth Conditions.**
          *   *Elena:* If the group isn't actually despicable, is the sentence false? If I say "He's a [slur]" and they are wonderful, am I lying or just being mean?
          *   *Marcus:* You aren't lying about the *reference* (they are in the group), you are expressing a *commitment* to a normative view.
      *   **The Turn/Conversion:**
          *   They need to find common ground. Pure semantics feels too rigid; pure pragmatics feels too weak to explain the harm.
          *   *Synthesis:* Maybe it's "semanticized pragmatics" or a hybrid view. The "metadata" becomes hard-coded over time due to usage.
          *   *Ending:* Acknowledge the complexity. No total surrender, but mutual respect and a refined view.

  5.  **Refining the Terminology:**
