      *   *Pragmatist:* Conversational implicature, expressivism, demonstrative theory (Hom), ideology, use-conditional.
      *   *Engineer Analogy:* Keep it subtle. "Payload" vs. "Headers."

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Self-Correction during drafting:* Make sure Marcus doesn't sound like he's minimizing the harm. The pragmatic view isn't "it's not that bad," it's "the mechanism of harm is different."
      *   *Check:* Did I include concrete examples? Yes, need to ensure they use a placeholder or a specific example (like the K-word or a generic "S-word"). Let's use a generic "S-term" and its neutral counterpart "N-term" to avoid generating actual slurs while maintaining philosophical rigor.
