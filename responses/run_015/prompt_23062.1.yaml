      *   **Task:** Write a dialogue between two philosophers.
      *   **Positions:**
          *   *Semanticist:* Pejorative content is part of literal meaning (truth-conditional, non-cancellable, projects).
          *   *Pragmatist/Expressivist/Demonstrative:* Pejorative content is pragmatic (implicature, use-conditional, or pointing to stereotypes).
      *   **Requirements:** Sharp arguments, no strawmen, concrete sentence examples, attempt to convert each other (though total conversion might be unrealistic, genuine engagement is key), accurate terminology.
      *   **Tone:** Intellectual, engaging, slightly technical but accessible.

  2.  **Determine the Characters & Positions:**
