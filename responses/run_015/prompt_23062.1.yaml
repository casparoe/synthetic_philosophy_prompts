      *   *Character B (Pragmatist):* Let's call him **Marcus**. He argues for *Expressivism*, *Implicature*, or *Demonstrative Theory* (like Christopher Hom's work). He believes the hate is "metadata" or "runtime behavior."
      *   *Setting:* A quiet corner of a university library or a coffee shop. Let's go with a late-night office session.

  3.  **Key Linguistic Concepts to Integrate:**
      *   *Cancellability:* Can you say "X is a [slur] but I don't mean anything bad by it"? (Semanticist says no, Pragmatist says maybe).
      *   *Projection:* Does the offensiveness survive embedding? (e.g., "If X is a [slur]...")
      *   *Truth-Conditions:* Does the sentence become *false* if the group isn't despicable, or just *offensive*?
      *   *Demonstrative Theory:* The idea that slurs point to a socially constructed ideology (Hom).
      *   *Expressivism:* The idea that slurs express an attitude rather than describing a property (Blackburn).
      *   *Neutral Counterpart:* The non-offensive synonym (e.g., "German" vs. the anti-German slur).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the conflict. Elena pushes the "payload" analogy (since the user is an engineer, I'll subtly mirror that without breaking character). Marcus pushes the "runtime/usage" analogy.
      *   **Round 1: Cancellability.**
