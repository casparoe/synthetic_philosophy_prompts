      *   *Throw out.* Easily reconstructed.
  *   **Candidate 15: Mary's Room.** Qualia knowledge.
      *   *Keep.* Specific instance of Imagination as Source.

  ### Ranked Defeaters Table

  | Defeater | Rank | Verdict | Notes |
  | :--- | :--- | :--- | :--- |
  | **Privilege Clause Vacuity** | Fatal | Concede | If "reflection" is unconstrained, (E) and (I) are unfalsifiable. |
  | **Simulation Collapse** | Fatal | Concede | If premises rely on imaginative reports, view collapses into rival. |
  | **Emotional Constitutivity** | Serious | Concede | In normative domains, framing may be constitutive of evidence, violating (N). |
  | **Invariance Failure** | Serious | Concede | Empirical mismatch between story/argument verdicts threatens (I). |
  | **Argument-Silent Pumps** | Awkward | Dismiss | Reconstructible as reports of imaginative failure; non-propositional claim is dubious. |
  | **Therapeutic Pumps** | Awkward | Dismiss | Outside scope; view targets evidential weight for conclusions. |
  | **Calibration Pumps** | Awkward | Dismiss | Reconstructible as empirical self-knowledge propositions. |
  | **Conceptual Revision** | Serious | Concede | If pump drives conceptual change, it is not epistemically idle. |

  ### Analysis of Critical Defeaters

  **1. The Privilege Clause Vacuity (Addresses Q1, Q3, Q5)**
  This is the most dangerous internal threat. If "premises she would accept on reflection" includes any premise required to validate the story's conclusion, (E) becomes trivial: every successful pump has *some* reconstruction, even if it requires attributing complex, ad-hoc premises to the thinker. To restore content, you must constrain "reflection" to logical closure and conceptual analysis, explicitly excluding further imaginative simulation or psychological persuasion.
  *   **Defensibility:** This constraint is defensible but costly. It limits the view to conceptual truths and logical entailments.
  *   **Falsifiability:** With this constraint, (I) becomes falsifiable. If subjects given the cold argument (with clarified premises) do not match the story group's verdict distribution, (I) fails.
  *   **Prediction:** You predict that community-wide lag in accepting a conclusion (via story vs. argument) is either irrationality or lack of comprehension. If the lag persists among experts who understand the argument but still require the story to assent, this is evidence against you, not merely persuasion. It suggests the story provides epistemic goods the argument lacks.
  *   **Verdict:** Concede this counts against the view unless constrained. Unconstrained, it is fatal to the view's scientific content.

  **2. Simulation Collapse (Addresses Q1, Q4, Q6, Q7)**
  Your view aims to deflate imagination as a source of modal knowledge. However, if your reconstructed arguments rely on premises like "I cannot imagine X being the case," the epistemic work is done by the imagination, not the argument. The argument merely reports the result of the simulation.
  *   **Collapse Point:** Reconstructionism stops being distinct when the justification for the premise relies on the phenomenology of imagining. If you allow such premises, you are doing modal epistemology with imagination as a source, which is the rival view you claim to deflate.
  *   **Equivocation Check (Q6):** You must ensure you are not equivocating on "intuition." If you treat the *judgment* as the evidence but the *phenomenology* (generated by narrative) as the justification for the premise, narrative has epistemic work. You must flag this: if the phenomenology justifies the premise, (N) is false.
  *   **The Persuasive Case (Q7):** A case where you accept the extracted argument (premises + entailment) but reject the conclusion is logically incoherent for a rational agent. However, a case where the pump moves you to accept a premise (via imagination) that the cold argument fails to justify is coherent. If you find yourself accepting "X is possible" only after imagining the story, but not after reading the argument "X is consistent," the story has provided evidence (imaginative success) the argument lacked. You are entitled to explain this away as "failure to grasp consistency," but if the gap persists, it is a defeater.
  *   **Verdict:** Concede. This is a collapse into the rival view unless you ban imaginative reports as premises, which limits the scope of reconstructable pumps.

  **3. Scope and Special Cases (Addresses Q1, Q2)**
  *   **Argument-Silent Pumps:** You can redescribe these. The evidence is the proposition "I am unable to construct a scenario where X." If the failure itself is non-propositional evidence, you must declare these bad pumps. Reconstructionism demands propositional content.
  *   **Therapeutic Pumps:** These aim to dissolve questions, not support conclusions. Reconstructionism can declare these outside its scope (evidential weight for conclusions). This is not a cost, but a boundary condition.
  *   **Calibration Pumps:** These teach you about your dispositions. Reconstructionism describes these as empirical self-knowledge ("I judge X in case Y"). If the story reveals a threshold an explicit argument about dispositions could not, you must argue the argument was merely harder to process, not epistemically weaker.
  *   **Verdict:** Dismiss Therapeutic and Calibration as outside scope or reconstructible. Concede Argument-Silent only if non-propositional evidence is admitted (which you should deny).

  ### Final Assessment

  The view is methodologically robust only if the Privilege Clause is tightly constrained to logical/conceptual reflection, but this constraint exposes it to empirical falsification via Invariance failures and forces a collapse into Simulationism if imaginative reports are admitted as premises.

  Verdict: The view is seriously vulnerable to vacuity charges unless constrained, and to collapse charges if constrained, leaving it with a narrow but defensible path dependent on empirical invariance.

