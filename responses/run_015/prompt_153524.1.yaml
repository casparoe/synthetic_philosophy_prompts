      *   **Core Distinction:** The user distinguishes between two types of presentism:
          1.  *Verdict Presentism:* Judging past actors by concepts/values they couldn't have had (anachronistic moral/conceptual attribution).
          2.  *Salience Presentism:* Letting present concerns dictate the research question, archive selection, and level of description (framing/interpretation).
      *   **The Problem:** Why does rejecting *Verdict Presentism* not solve the problem of *Salience Presentism*? Why can't the historian's choices (topic, source, grain) be disciplined like verdicts?
      *   **The Asymmetry:** Why is "ask only questions your period asked" impossible/unavailable, whereas "don't apply our concepts" seems possible (even if difficult)?
      *   **The Case Study:** A historian who refuses to call sources "racist" (no verdict presentism) but organizes the book around a category none of them used (salience presentism).
      *   **The Goal:** Don't just say "some presentism is unavoidable." Identify which type is doing the *real philosophical work* and which is a *distraction*.

  2.  **Initial Analysis & Philosophical Grounding:**

      *   *Verdict Presentism* is essentially about *semantic fidelity* and *moral fairness*. It's a rule of translation and attribution. It assumes we can access the "internal logic" of the past and respect its boundaries.
      *   *Salience Presentism* is about *historical significance* and *epistemological framing*. It acknowledges that history is written *now* for *now*.
      *   *The Asymmetry:* You *can* technically avoid using the word "racist" in the text (linguistic constraint). You *cannot* avoid having a reason for writing the book *now* (existential/teleological constraint).
      *   *The "Real Work":* Salience presentism is the engine of history. Verdict presentism is a stylistic/ethical guardrail. If you remove Salience Presentism, you don't have history; you have chronicle or antiquarianism. If you remove Verdict Presentism, you have bad translation or moralizing, but you still have history.
      *   *The Distraction:* The debate focuses on Verdict Presentism because it's easier to police (did they use the word?) and feels more "objective." But Salience Presentism is where the actual construction of historical knowledge happens.

