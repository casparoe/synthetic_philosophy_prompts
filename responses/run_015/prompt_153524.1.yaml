          *   Verdict Presentism is a rule of *attribution* (internal to the text).
          *   Salience Presentism is a rule of *motivation* (external to the text, internal to the historian's context).
          *   You can't discipline motivation without killing the inquiry. If you only ask questions the past asked, you become a mouthpiece, not an analyst.
      *   **The Asymmetry (The "Why"):**
