answer: |-
  Your distinction is precise, and it cuts through the fog that usually surrounds this debate. You have identified that *verdict presentism* is a rule of **attribution**, while *salience presentism* is a condition of **constitution**.

  The reason the debate spins endlessly is that historians treat verdict presentism as the primary ethical failure, when in fact it is merely a stylistic or semantic risk. Salience presentism is not a risk; it is the ontological precondition of writing history at all.

  Here is why giving up verdict presentism does not solve the problem, why the asymmetry exists, and which of the two is actually doing the philosophical heavy lifting.

  ### 1. Why Salience Cannot Be Disciplined Like Verdict

  You ask why the historian's choice of topic, archive, and grain cannot be disciplined the way the verdict rule is. The answer is that verdict presentism is a **negative constraint**, while salience presentism is a **positive generative force**.

  *   **Verdict Presentism (The Brake):** You can technically obey the rule "do not use concepts actors didn't have." It requires linguistic restraint and empathetic translation. You can scan a manuscript and ensure the word "genocide" or "heteronormative" does not appear as an attribution to an 18th-century mind. It is a rule of *fidelity*.
  *   **Salience Presentism (The Engine):** You cannot obey a rule that says "do not let present concerns pick the question." Why? Because the past does not speak until interrogated. Archives are not self-organizing; they are inert traces. They only become "evidence" when illuminated by a question.

  If you try to discipline salience presentism by adhering to the rule "ask only the questions your period asked itself," you cease to be a historian and become a **chronicler** or a **ventriloquist**.

  If you study the 18th century only through questions the 18th century asked itself, you reproduce the 18th century's blind spots. You cannot write a history of 18th-century "public health" if the concept didn't exist; you can only write a history of "miasma" or "divine punishment." But if you only write about miasma, you cannot explain why people died of cholera. You need the modern concept (germ theory/public health) to make the past intelligible, even if the actors didn't have it.

  Therefore, salience presentism cannot be disciplined out of existence because **hindsight is the only tool the historian has.** To remove present salience is to remove the vantage point of the present, which is the only place from which history can be written.

  ### 2. The Asymmetry: Traces vs. Questions

  You note the asymmetry: "Don't apply our concepts" seems available as a rule, but "Ask only their questions" does not.

  This is because **concepts are tools, but questions are purposes.**

  *   **Concepts:** We can choose not to use a specific hammer (e.g., the label "racist") on a specific nail. We can describe the nail's shape, the wood's grain, and the force of the blow without naming the hammer. This is achievable through rigorous contextualism.
  *   **Questions:** We cannot choose not to have a purpose for looking at the nail. Why are we looking at it? Is it to build a house? To study metallurgy? To prove the carpenter was negligent? The purpose comes from *us*, not the nail.

  The archive does not hand you its questions because the archive is a graveyard of intentions. A colonial governor's letter about railway tariffs was written to manage logistics, not to reveal the structures of racial capitalism. The governor was not asking, "How does this tariff reinforce racial hierarchy?" He was asking, "How do I move goods cheaply?"

  If the historian only asks the governor's question, she writes a history of logistics. If she asks the present's question ("How does this reinforce racial hierarchy?"), the tariff becomes evidence of something the governor could not see. The archive answers questions nobody at the time was asking because **structural truths are often invisible to the actors inhabiting them.**

  ### 3. The Case Study: The "Racist" Label vs. The Racial Structure

  Let's apply this to your historian who refuses to call actors "racist" (no verdict presentism) but organizes her book around "racial capitalism" (high salience presentism).

  *   **The Verdict Restraint:** She writes, "Governor X argued that Indigenous labor was naturally suited to tropical agriculture," rather than "Governor X was a racist." She respects the actor's self-conception. She avoids the anachronistic moral judgment.
  *   **The Salience Imposition:** She organizes the chapters not by "Agricultural Policy" (the actor's category) but by "Extraction and Racial Hierarchy" (her category). She groups the Governor's letters with missionary diaries and merchant ledgers to show a system.

  **Why is this necessary?** Because the "system" of racial capitalism is a theoretical construct that explains the *relationships* between these actors, relationships they themselves did not perceive. The Governor did not know he was a cog in "racial capitalism." He thought he was a servant of the Crown managing efficiency.

  If the historian followed the "no salience presentism" rule, she would have to fragment the book. She could not connect the Governor to the Merchant, because they didn't see themselves as connected. She would produce a history that is faithful to the actors' minds but false to the structural reality they inhabited.

  By imposing the category "racial capitalism," she is using the present's theoretical sophistication to reveal a truth about the past that was inaccessible to the past. This is not a bug; it is the feature of historical knowledge.

  ### 4. Which is Doing the Real Philosophical Work?

  **Salience Presentism is doing the real work. Verdict Presentism is the distraction.**

  **Salience Presentism is Constitutive:**
  It acknowledges that history is a dialogue between the present and the past. It accepts that we study the past *because* of present concerns (justice, identity, causality, trauma). It admits that "significance" is not an intrinsic property of past events but is conferred by the present observer. This is where the epistemological heavy lifting happens. It forces us to admit that every history is a contemporary argument about the past.

  **Verdict Presentism is Regulatory (and often a Proxy):**
  The fight over verdict presentism is usually a proxy war over salience. When people get angry about a historian calling a founding father a "slaveholder" (verdict) or "genocidal" (verdict), they are rarely upset about the semantic anachronism. They are upset about the **salience**. They are upset that the historian has chosen to organize the narrative around *harm* rather than *liberty*.

  The verdict rule ("don't judge them") is often wielded as a shield to protect the salience choice ("don't look at that").

  *   If we focus only on **Verdict Presentism**, we pretend the problem is just about being fair to dead people. We think if we just use the right words, we can achieve "objective" history.
  *   If we focus on **Salience Presentism**, we admit the problem is about *power*. Who gets to decide what matters? Why are we looking at the archive *this* way?

  ### Conclusion

  The debate keeps spinning because historians want the epistemic benefits of Salience Presentism (the ability to see structures, systems, and truths invisible to actors) without the ethical costs of Verdict Presentism (the feeling that we are judging the dead unfairly).

  But you cannot have the former without the latter's shadow. To organize a book around "racial capitalism" is to assert that this concept is *more true* than the actors' own understanding of their lives. That is a verdict, even if you don't use the word "racist."

  **Salience presentism is the engine of historical insight.** It allows us to know more about the past than the past knew about itself.
  **Verdict presentism is a courtesy.** It prevents us from caricaturing the past, but it cannot generate knowledge.

  The distraction is believing that policing the vocabulary (verdict) solves the problem of perspective (salience). It doesn't. You can write a book that never uses the word "racist" but is entirely structured by modern racial theory. That book is deeply presentist in the only way that matters: it uses the past to answer a question the past could not ask. And that is exactly what history is supposed to do.
