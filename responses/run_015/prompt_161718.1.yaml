answer: |-
  You are walking into a room where operational reality often beats philosophical elegance, so your opening move should be to concede the administrative friction before they even raise it. In your first two minutes, admit that adding any new class of voter increases cost, complexity, and the risk of error, and state clearly that you are not proposing this because it is easy to run, but because the current exclusion is morally inconsistent with the city's governance. This disarms the neighborhood appointees and the election administrators who are primed to defend the status quo based on budget and workload. Once you have cleared that hurdle, expect the election administrators to speak first, and they will ask how you verify intent to stay for permanent residents without creating a new bureaucracy. They will frame this around registration databases and ballot variants, asking whether you require a separate affidavit of intent and how poll workers distinguish those ballots from standard ones. Your reply should be that residency duration plus legal status creates a rebuttable presumption of intent, handled through the same lease or utility documentation used for address verification, keeping the ballot identical to avoid training nightmares. You must acknowledge here that your answer is soft on the verification piece because intent is subjective, and if they push on how to prove someone plans to leave, you will be bluffing slightly by relying on honor systems similar to current residency affidavits.

  Then the political scientist will pivot to turnout, asking whether sixteen-year-olds and transient residents actually vote or if this just amplifies a self-selected activist slice that looks nothing like the actual demographic. They will want to know if you are solving for representation or just adding noise to the signal. Your response should be that low initial turnout is a feature of integration, not a bug, and that schools and unions provide the civic infrastructure to normalize participation over time, much like early suffrage expansions. The soft spot here is that you cannot guarantee they will vote like the general population, and if they vote as a bloc on single issues like school funding, it could skew priorities, so be prepared to admit that distortion is possible but preferable to total exclusion. After that, the immigration attorney will press you on the undocumented population, noting that your exposure principle logically extends to people without status who also pay taxes and face zoning consequences, and they will challenge whether telling them to naturalize is viable given federal backlogs. You need to hold the line that local charter changes cannot conflict with federal immigration classifications, so you are limited to those with legal recognition, even if the moral principle extends further. This is where you are changing the subject slightly from moral consistency to legal feasibility, and the attorney will know it, so concede that the principle is broader than the proposal but the charter cannot override federal law.

  The retired judge will likely save the heaviest objection for last, asking whether this dilutes the meaning of citizenship and whether state law even permits a municipality to define the electorate beyond state statutes. This is the question with the most genuine force because if the state preempts local voting qualifications, your proposal is dead on arrival regardless of merit. Your reply must be that home rule charters often allow cities to expand rights even if state law sets minimums, and that citizenship is a federal status while municipal voting is a local privilege tied to residence. You have to flag internally that this is the biggest legal risk, as some states strictly tie municipal voting to state election codes, so if the judge presses on specific state code sections, you may need to pivot to recommending a state-level legislative ask rather than a charter change. You also identified the elderly implication yourself, and while you think it is the worst question, the actual worst question is likely the state preemption one because it kills the proposal instantly, whereas the age issue is just philosophically uncomfortable. However, you should still prepare for the age question, where they will ask if an eighty-five-year-old truly has less stake than a sixteen-year-old. Your answer is that your principle is a threshold for entry, not a scaling weight for votes, so once you cross the minimum exposure bar, everyone is equal, which avoids disenfranchising the elderly while keeping the entry logic consistent. The softness here is that the threshold is arbitrary, and if they ask why the threshold is sixteen rather than eighteen, you are relying on social norms around driving and work rather than a hard metric.

  There is one question you are hoping nobody asks, which is whether enfranchising sixteen-year-olds effectively gives their parents extra votes through coercion or influence, and if you have safeguards against guardians controlling the ballot. If this comes up, do not try to claim teens are immune to parental influence, but argue that secret ballots and civic education mitigate this better than age bans, and that many sixteen-year-olds live independently or in situations where parental control is already limited. Finally, the single reply that has to land for this proposal to survive the room is the core justification that being subject to coercive laws without a voice is the definition of tyranny, regardless of passport or age. You need to phrase this not as expanding rights but as correcting a governance error where the city makes binding decisions for people it refuses to count, and if you can make the commissioners feel that the current system is an administrative oversight rather than a intentional design, you might get them to move. Keep your answers tight, admit the operational costs early, and do not let them bog you down in hypotheticals about tourists or college students, because your principle relies on established residency and legal status. If you stay grounded in the local impact on zoning and schools, you keep the conversation in the room's competency, but if you drift into national immigration policy or federal constitutional law, you will lose the administrators and the judge. Trust your preparation, own the trade-offs, and remember that they need a reason to vote yes that protects them from looking reckless, so give them the language of civic consistency rather than radical expansion.
