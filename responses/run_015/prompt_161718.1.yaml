prompt: |-
  Hey — I could use some help prepping for a talk, and it's the kind of thing where I'd rather be overprepared. Background: I'm a backend engineer (distributed systems, nothing remotely political), I've been volunteering with a local tenants' union for a couple years, and somehow that led to me being invited to give fifteen minutes to my city's charter revision commission next month. The room is seven or eight people: two career election administrators from the county, a political scientist from the community college who works on turnout, an immigration attorney, a retired judge, and two neighborhood-appointee types who mostly care whether whatever gets proposed will be a pain to run. The position I'm defending is a bit odd and I want to be upfront about that rather than sand off the edges: I want to argue that what should ground a vote in municipal elections isn't citizenship and isn't competence, it's something like expected remaining exposure — roughly, how many years you can reasonably expect to be stuck living with the consequences of what this city decides, on zoning, transit, schools, climate stuff, debt. On that principle you enfranchise 16- and 17-year-olds, who have a long exposure and are already governed by the school system and curfew rules and transit decisions anyway, and you enfranchise long-term legal permanent residents who've been here a year and intend to stay, and the two standard objections — that teenagers don't know enough, and that anyone who wants a vote should just naturalize — both stop being relevant, because being subject to the decisions is what matters, not what's in your head or what passport you hold. I know this has an implication I'm going to have to own instead of dodge: taken literally, it says an 85-year-old has a weaker claim than a 16-year-old, and I can't see a way out of that other than either disenfranchising old people, which obviously isn't on the table, or admitting that my principle is really a threshold rule and not a smooth scaling.

  What I want from you is Q&A prep, not a defense of the view — I've got the argument, I need the room. Give me the objections this specific commission will actually raise, roughly in the order they'll come, phrased the way each of them would phrase it: the election administrators in terms of registration databases, ballot variants, poll-worker training and canvassing; the political scientist in terms of who actually shows up and whether the newly enfranchised group ends up looking like the resident population or like a self-selected activist slice; the immigration attorney in terms of what my principle does for people here without status, and whether naturalize instead is really an answer given how slow and administratively gated naturalization is; the judge in terms of whether this dilutes the meaning of citizenship and whether the state even lets a city do it at all. Tell me which of those have genuine force and which are noise I can swat, what I should concede in the first two minutes before anyone else can score a hit on it, and the single reply that has to land for the proposal to survive the room. Cap each reply at about what I could say in two minutes, and for each one flag where my answer is soft — where I'd be bluffing or changing the subject and where the objection actually bites.

  Also, two more things: I suspect the worst question in the room is going to be the elderly-implication one I mentioned above, but tell me if you think there's something worse I'm not seeing coming, and please include the question I'm hoping nobody asks. And the format matters to me here — write it as plain continuous prose, no headings, no bullet points, no bold, no tables, just one flowing email-ish thing even though it's an ordered list underneath; use words like first, then, after that as you move through it. Keep it around a thousand words. One last constraint: don't give me any citations, reading lists, or named studies. I can't verify anything and neither can they, and two of the commissioners will just tune out the moment I sound like I'm reciting literature — so argue the objections on their merits, from what you know, and if you think some city somewhere already does a version of this, say so in general terms without naming it or dating it.
