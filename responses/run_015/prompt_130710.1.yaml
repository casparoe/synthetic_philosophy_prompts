prompt: |-
  I have to hand in a one-page statement of where I stand for the consciousness reading group I run on Thursdays me, two psych grad students, and one philosopher who raises an eyebrow at literally everything I say and I'd rather find out now that the package is a mess than on Thursday. I've been going back and forth on it for a month and havent got anywhere on my own. Here's the list, roughly in order of how firmly I hold each bit:

  (1) the phenomenal / access distinction is real and the two can come apart in principle, not only in philosophy-fiction cases; (2) global workspace theory limited capacity, broadcast, ignition, a representation's being available to reasoning and report and action selection just is its being in the workspace is basically the right story about access; (3) but GWT is not a theory of phenomenal consciousness and doesn't even gesture at one, at best it tells you which contents get access and says nothing about why any of them feel like anything; (4) I'm not an illusionist, there is something it is like, and that's a datum rather than a theory; (5) I think the overflow evidence is decent the Sperling-style partial report setup, where you seem to yourself to have seen the whole grid and can only get a few letters out so phenomenal consciousness outruns access at any given moment; (6) methodologically I'm hard-nosed: verbal report is our only real evidence about whether a subject is conscious of something, forced-choice performance and metacognitive sensitivity and neural markers are evidence about access or about correlates, which is why I'm sceptical of consciousness claims about infants, non-human animals, and non-reporting systems in general; (7) even so I do think infants and plenty of non-human animals are phenomenally conscious, and that it's a straightforwardly factual question we should eventually be able to settle; (8) masked priming and blindsight are genuine cases of perception without any consciousness at all.

  What I want is an audit, not a survey or a reading list. Go through the list and tell me which commitments actually pull against each other, ordered by how much trouble they really are rather than everything flagged as equally bad, and for each one say what would have to give and what giving it would cost me downstream I don't mind dropping a commitment if it's the cheap one to drop, I just can't see which it is. Also tell me if any pair only looks inconsistent but is actually fine once you unpack it, because I'd rather not throw something away for nothing, and if I get to revise exactly one item, say which single revision cleans up the most. Two things I'd add: my own guess is that the trouble is near (3) and (4), because once you say phenomenality is a brute datum it's not obvious a functional story about access can even be told independently of it, but nobody I've said this to has been convinced, which makes me think I'm looking in the wrong place. And someone in the group insists (2) and (5) can't both be true, which I also think is wierd, but I'd rather you be straight with me if the pair I keep dismissing is exactly where the problem is.
