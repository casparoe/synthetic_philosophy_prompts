  # Taxonomy of Intentionality: Original vs. Derived in Coupled Architectures

  **Root Question:** Does the system in question possess intentionality that is **original** (intrinsic, non-derived) rather than merely **derived** from the intentionality of its designers or users?

  ### Decision Tree

  **Node 1 (Case 1: Pure Symbol):** Is functional organization alone (pure symbol manipulation without sensory coupling) sufficient for original intentionality?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2 (Case 3: Biological Substrate):** Is biological substrate necessary for original intentionality? *(Asked only if Functional Organization = Sufficient)*
  *   **Yes:** **Leaf 1 (Unoccupied: Bio-Functional Originalism).**
  *   **No:** **Leaf 2 (Functional Originalism).**

  **Node 3 (Case 2: Embodiment):** Can real-time sensorimotor coupling transform derived intentionality into original intentionality? *(Asked only if Functional Organization = Insufficient)*
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4 (Case 3: Biological Substrate):** Is biological substrate necessary for this embodied originality? *(Asked only if Embodiment = Transformative)*
  *   **Yes:** **Leaf 3 (Unoccupied: Bio-Embodied Originalism).**
  *   **No:** **Leaf 4 (Unoccupied: Pure Embodied Originalism).**

  **Node 5 (Case 3: Biological Substrate):** Is biological substrate necessary for original intentionality? *(Asked only if Embodiment = Non-Transformative)*
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 7.

  **Node 6 (Case 4: Distributed Processing):** Does distributed processing grant original intentionality to the biological system as a whole? *(Asked only if Bio = Necessary)*
  *   **Yes:** **Leaf 5 (Unoccupied: Distributed Biological Originalism).**
  *   **No:** **Leaf 6 (Searlean Biological Originalism).**

  **Node 7 (Case 4: Distributed Processing):** Does the distributed network possess intentionality as a systemic property rather than an observer's stance? *(Asked only if Bio = Not Necessary)*
  *   **Yes:** **Leaf 7 (Distributed-Derived Hybridism).**
  *   **No:** **Leaf 8 (Dennett-style Universal Derived / Coupled-Derived Hybridism).**

  ---

  ### Position Leaves

  **Leaf 1: Unoccupied (Bio-Functional Originalism)**
  *   **Description:** Functional organization is sufficient for original intentionality, but only if instantiated in biological substrate.
  *   **Awkward Commitment:** Regarding Case 2, this view must claim a functioning robot mind is unintelligent solely due to silicon, despite identical organization to a brain.

  **Leaf 2: Functional Originalism**
  *   **Description:** Functional organization alone generates original intentionality regardless of substrate or coupling.
  *   **Awkward Commitment:** Regarding Case 2, this view must grant original understanding to a disconnected language model if its internal logic matches a mind.

  **Leaf 3: Unoccupied (Bio-Embodied Originalism)**
  *   **Description:** Embodiment transforms derived to original intentionality, but only within a biological body.
  *   **Awkward Commitment:** Regarding Case 2, this view must assert a biological animal in a vat lacks understanding that the same animal in a robot body possesses.

  **Leaf 4: Unoccupied (Pure Embodied Originalism)**
  *   **Description:** Embodiment transforms derived to original intentionality regardless of biological substrate.
  *   **Awkward Commitment:** Regarding Case 2, this view must grant original understanding to a robot while denying it to a functionally identical disconnected simulation.

  **Leaf 5: Unoccupied (Distributed Biological Originalism)**
  *   **Description:** Biological substrate is necessary, but original intentionality resides in the distributed network rather than individual nodes.
  *   **Awkward Commitment:** Regarding Case 2, this view must deny original intentionality to a centralized biological brain while granting it to a distributed biological network.

  **Leaf 6: Searlean Biological Originalism**
  *   **Description:** Biological substrate is necessary for original intentionality; all artificial systems possess only derived intentionality.
  *   **Awkward Commitment:** Regarding Case 2, this view must classify a perfectly embodied, adaptive robot as merely simulating understanding without any intrinsic mental content.

  **Leaf 7: Distributed-Derived Hybridism**
  *   **Description:** Intentionality remains derived but is a property of the coupled system as a whole rather than any individual node.
  *   **Awkward Commitment:** Regarding Case 2, this view must define the system boundary precisely to explain why the robot has derived intentionality but its separate components do not.

  **Leaf 8: Dennett-style Universal Derived / Coupled-Derived Hybridism**
  *   **Description:** Intentionality is always derived, either as a universal observer stance (Dennett) or a specific hybrid status enriched by coupling (Coupled-Derived).
  *   **Awkward Commitment:** Regarding Case 2, this view must explain why the robot's behavior is meaningfully distinct from a thermostat if neither possesses original intentionality.

  ---

  ### Taxonomy Analysis

  **Unoccupied Branch Combinations**
  *   **Bio-Functional Originalism (Leaf 1):** **Incoherent.** If functional organization is sufficient, requiring biology contradicts the definition of functionalism.
  *   **Bio-Embodied / Pure Embodied Originalism (Leaves 3 & 4):** **Unexplored.** While embodied cognition is popular, few argue embodiment *alone* creates original intentionality without biology or functional sufficiency.
  *   **Distributed Biological Originalism (Leaf 5):** **Unattractive.** This adds unnecessary complexity to Biological Originalism without solving the core problem of artificial systems.

  **Indistinguishable Leaves**
  *   **Leaf 8 (Dennett / Coupled-Derived):** The tree cannot genuinely separate Dennett-style Universal Derived intentionality from Coupled-Derived Hybridism. Both answer "No" to original intentionality in Cases 1, 2, and 3, and "No" to systemic property in Case 4 (since Coupled-Derived views the coupling as enriching the derived status, not creating a new systemic *original* property). They are flagged together because the diagnostic questions focus on *originality* and *locus*, not the nuanced difference between "universal stance" and "hybrid derived status."
