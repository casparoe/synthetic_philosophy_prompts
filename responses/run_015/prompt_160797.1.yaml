answer: |-
  Look, you're in a good position because you're one of them, a scientist who knows the limits of a model, so don't stand up there like a lecturer trying to teach them philosophy. Stand there like a lab manager trying to troubleshoot a protocol. The biggest mistake you could make is starting with the brain, because that's where everyone has a vested interest and a preconceived notion. If you open by asking is the brain a computer, the engineer who thinks neurons are switches will lock horns immediately with the guy who knows neurons are messy analogue chemical baths, and you'll lose the room in ten minutes. Instead, you start with the heart. Write heart equals pump on the whiteboard. Ask them if that statement is true. They'll all agree it is. Then ask them if the heart is literally a pump, made of metal and driven by an engine. They'll say no, it's muscle. Then ask them what work the word pump is doing there. It's not describing the material, it's describing the function. It tells you what the heart does, not what it is. This establishes the distinction you need between a physical description and a functional description without triggering any defensiveness about their own minds.

  Once they accept that calling the heart a pump is a useful abstraction that ignores the material to focus on the job, you move to the brain. Write brain equals computer next to it. Ask them if this is the same kind of statement. This is where you'll feel the room shift. The engineer will say yes, it's processing information. The wet-brain skeptic will say no, it's biology. This is the moment you introduce the one case that needs to carry the session, and it should be visual perception, specifically the difference between blindness and hallucination. Draw two columns on the board. In one, put a damaged eye or lesioned visual cortex. In the other, put a healthy brain seeing a snake that isn't there. Ask them to describe the failure in physical terms versus computational terms. In the damaged case, the mechanism is broken; the signal stops. In the hallucination case, the mechanism is running fine, but the output is wrong relative to the world. This example has to have a clear distinction between hardware failure and software error, and it has to lack any ambiguity about the physical state of the organ. You need them to see that you can't explain the hallucination just by looking at the neurons firing, because the neurons are doing exactly what they should do physically. You need the concept of representation to explain why it's an error.

  This is exactly where you bring in your test about the difference between a thing being broken and a thing miscomputing. It belongs right after the hallucination example, because that's where the concept of correctness enters the room. Your test is a good one, actually a very sharp one, because it highlights that physical systems just happen, but computational systems can be wrong. A rock doesn't miscompute when it falls, it just falls. A computer miscomputes when it adds two plus two and gets five, even if the chips are physically perfect. Tell them that if calling the brain a computer is just a redescription, then every physical system computes, and the word loses its bite. But if it's an explanatory claim, it must allow for the possibility of error that isn't just damage. Use your test to force the analogue skeptic to admit that even messy systems can have correct or incorrect outputs relative to a task, and force the upload enthusiast to admit that without the right relationship to the world, the computation is meaningless. Your test works because it introduces normativity, the idea of right and wrong, which physics doesn't have on its own.

  Now, you need to anticipate the wrong turns because forty-five minutes is nothing. The first wrong turn will come from the upload guy within the first fifteen minutes. He'll ask if this means we can live forever on a disk. Cut that off immediately by saying that question depends on the answer to today's question, not the other way around. Tell him you're trying to establish if the label fits before you ask what you can do with it. The second wrong turn will be the analogue guy arguing about clock speeds and continuous signals. Let him speak for a minute, then ask him if a calculator built with water pipes instead of silicon stops being a computer. If it still adds numbers correctly, does the material matter? This brings them back to the function versus material distinction you started with. The third wrong turn is the chap who thinks it's all just loose talk and brains are wet. He's actually the closest to the truth you want them to find, which is that the label is a tool. Don't fight him. Agree with him, but ask him if calling it a computer helps us predict the hallucination better than calling it wet. If it doesn't help predict or explain, then it's just a metaphor. If it does, it's a model.

  There is one thing you must refuse to explain, and you should say this out loud around the thirty-minute mark when someone inevitably asks what computation actually is. Tell them you are not going to define computation today. If you try to define whether computation requires syntax, or semantics, or a human interpreter, you will vanish down a rabbit hole of technical definitions that will eat the rest of your time. Tell them explicitly that for this session, computation is just whatever allows for the distinction between broken and miscomputing that they just discussed. If you try to bluff a definition of information or syntax, you'll lose the chemists and engineers because they'll spot the vagueness. Own the ambiguity and tell them the ambiguity is the point.

  To wrap up, you need a question that tests if they grasped the distinction between redescription and explanation. Don't ask them if they agree the brain is a computer. Ask them this: If we stopped calling the brain a computer tomorrow and only called it a biological organ, what experiment would you stop running, or what new one would you start? If they say none, then for them it's just a redescription, a fancy label. If they say they would stop looking for clock cycles or start looking for error-correction codes, then for them it's an explanatory claim that does work. This forces them to commit to whether the metaphor has cash value.

  Finally, keep an eye on the clock. Spend the first ten minutes on the heart analogy, the next twenty on the brain case and your test, ten minutes on managing the wrong turns, and the last five on the closing question. You're not trying to solve the mind-body problem, you're trying to get them to see how scientific models earn their keep. You're a chemist, so remind them that calling a bond ionic is also a model that ignores the quantum messiness underneath. It's the same move. If you keep bringing it back to the utility of the model rather than the truth of the ontology, you'll keep the engineers happy and the skeptics engaged. Just don't let them talk about uploading consciousness until you've all agreed on what the brain is doing first.
