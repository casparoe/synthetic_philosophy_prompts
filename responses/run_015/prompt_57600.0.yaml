answer: |-
  ### Brainstorming: Candidate Decision Rules

  To ensure consistency with our record (Rulings 1–5), I evaluate three candidate decision rules regarding causal-explanatory vocabulary:

  1.  **Strict Ontological Individualism:** Only properties of individual agents may serve as *explanans*. Macro-variables are admissible only as shorthand for aggregates (Precedent 3) or ideational filters (Precedent 2).
      *   *Implication:* **Reject.** The authors explicitly claim macro variables "do the causal work" while micro rules are merely "initial conditions." This violates the requirement that individual motives/rules be the primary drivers (cf. Precedent 1 & 4).
  2.  **Mechanistic Transparency:** Macro-variables are admissible if the micro-mechanisms connecting them to outcomes are fully specified, even if the macro-variables carry explanatory weight (Precedent 2 & 4 Approve).
      *   *Implication:* **Approve with Conditions.** We must require the authors to reframe the micro-rules as constitutive causes, not just conditions. However, this risks ignoring their interventionist finding that micro-variations don't alter the outcome.
  3.  **Interventionist Invariance (Structural Realism):** Causal admissibility turns on whether a variable supports invariant generalizations under intervention. If an outcome is robust to micro-interventions but sensitive to macro-interventions, the macro-variable is the cause (Precedent 5 logic applied to agents).
      *   *Implication:* **Approve.** This distinguishes the case from Precedent 1 (where mechanisms were obscure/external) by relying on demonstrated robustness. It adopts the logic of Precedent 5 for the social domain.

  *Selection:* Rule 3 is superior. It respects the empirical findings of the ABM while avoiding the reification error of Precedent 1. It fulfills the open question of Precedent 5.

  ***

  **MEMORANDUM**

  **TO:** Methods Review Panel
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Opinion on Liquidity Crisis Agent-Based Model

  **Recommendation**
  I recommend that the panel **approve** the causal-explanatory vocabulary used in this application. While the authors' claim that macro-variables "do the causal work" initially alarms those of us committed to methodological individualism, the interventionist evidence provided distinguishes this case from our rejected precedents. Specifically, this application warrants adopting the structural logic of Precedent (5) for the social domain, rather than treating it as a recurrence of the rejected holism in Precedent (1).

  **Controlling Precedent**
  The controlling precedent is **(5)**, the peg-and-board argument, not **(1)**, the Durkheimian suicide study. In Precedent (1), we rejected the explanation because "social facts" were posited as external forces constraining individuals from without, rendering individual motives mere symptoms. The mechanism was opaque; the social fact was a black box.

  In contrast, the current application mirrors Precedent (5), where physical dimensions explained an outcome that micro-descriptions could not efficiently capture. Here, the "physical dimensions" are replaced by network topology (interconnectedness) and liquidity depth. Crucially, the authors do not assert a mystical social force; they demonstrate **causal robustness**. Their intervention study shows that the crash occurs across wildly different micro-behaviors provided the macro-structure remains fixed. This is not the reification of Precedent (1), where the macro obscured the micro. It is the structural identification of Precedent (5), where the micro is fully specified but shown to be counterfactually irrelevant to the specific outcome within the structural envelope. We recorded but declined to adopt (5) previously because it lacked agents; this application provides the social analogue we left open.

  **Engaging the Individualist Objection**
  The strongest objection, voiced by my colleague invoking Precedent (1), is that treating micro-rules as "initial conditions" strips agents of agency, reducing them to puppets of systemic forces. If we approve this vocabulary, do we not concede that individual reasoning is explanatorily inert?

  This objection conflates *ontological dependence* with *causal leverage*. The model remains ontologically individualist: the macro-variables are computed entirely from individual states. No collective agent is posited (unlike Precedent 4's rejected Marx paper). The authors' claim is not that agents lack agency, but that the *crash* is insensitive to *how* that agency is exercised, provided the structural constraints hold. To insist on individualist vocabulary here would be to privilege the *components* over the *constraint* that actually drives the outcome. In interventionist terms, if manipulating the micro-rules (within the macro envelope) fails to change the outcome, the micro-rules are not the cause of the crash. The structure is. Denying this would force us to accept false individualist explanations over true structural ones.

  **General Principle**
  By ruling to approve, the panel commits to the following principle of **Interventionist Invariance**:

  > *A macro-level variable is admissible as a causal explanans if it is demonstrated to be invariant under interventions on lower-level mechanisms, such that holding the macro-variable fixed preserves the outcome despite variations in individual properties, whereas manipulating the macro-variable alters the outcome.*

  This principle is specific enough to guide future cases, including those where macro-variables are **not** defined as functions of simulated individuals (e.g., exogenous climate shocks or geopolitical indices). In such future applications, admissibility would not depend on whether the macro-variable is reducible to individual states, but on whether the authors can demonstrate that the outcome remains invariant under interventions on individual behaviors while the macro-variable holds fixed. If the macro-variable offers the stable causal handle regardless of its ontological derivation, it is admissible. This preserves our commitment to rigorous causal explanation without enforcing a reductionism that contradicts empirical evidence of structural robustness.

  We should approve this project as a valid extension of Precedent (5).
