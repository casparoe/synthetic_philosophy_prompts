          *   **Principle:** Define the rule. Causal admissibility depends on demonstrating invariance of the outcome under interventions on lower-level details, holding higher-level structure fixed.
          *   **Future Application:** How this applies to exogenous macro variables (not functions of individuals). If they show invariance, they are admissible.

      *   *Refining the Argument:*
          *   Need to be careful about "Macro variables do the causal work." In interventionist terms, $X$ causes $Y$ if intervening on $X$ changes $Y$. The authors show intervening on Micro (within macro bounds) doesn't change $Y$. Intervening on Macro does. Thus Macro is the cause.
