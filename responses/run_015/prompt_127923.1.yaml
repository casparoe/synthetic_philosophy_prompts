answer: |-
  Here is the ranked research agenda, the defense of its ordering, and the required self-critique.

  ### The Ranked Agenda

  **1. The De-sedimentation Protocol (Operationalizing the Distinction)**
  **2. Crowding-Out Dynamics (Modeling Artificial Basins)**
  **3. The Scaffolding Half-Life (The Weaning Threshold)**

  ---

  ### Defense of the Ordering

  The ordering is driven by **logical dependency** and **risk mitigation**. You cannot model the dynamics of a phenomenon (Item 2) or design interventions to alter it (Item 3) if you cannot empirically distinguish the phenomenon from the background noise of standard coordination (Item 1). In a three-year timeline, the highest risk is spending Year 1 and 2 debating definitions or building models of a variable you cannot measure in the wild.

  **Criterion 1: Leverage (How many questions turn on this?)**
  Item 1 resolves the "Counterexample vs. Limiting Case" debate not by semantic fiat, but by operational necessity. If you cannot construct a protocol to identify sedimentation, the philosophical distinction is vacuous for this project. It also solves the "Measurement Question." Item 2 depends entirely on Item 1's success; if we cannot identify sedimented regularities, we cannot model their basins of attraction. Item 3 depends on both; you cannot know if scaffolding can be withdrawn (Weaning) if you don't know if it crowds out real norms (Item 2) or how to detect the difference (Item 1).

  **Criterion 2: Tractability (Can this team do it in 3 years?)**
  This team is uniquely configured for Item 1. The philosophers can define the counterfactual condition ("deletion of expectations"), the social scientists can identify natural experiments (client updates, forks, server migrations) that approximate this deletion, and the modelers can help formalize the threshold of "survival." Item 3 is the riskiest for tractability because it requires longitudinal data on communities undergoing deliberate design changes, which may be ethically or practically impossible to secure. By placing it last, we allow the first two years to build the relationships and instruments needed to attempt it.

  **Criterion 3: Payoff (Designing self-repairing communities)**
  Item 3 has the highest direct payoff, which is why it is the *goal*, but Item 1 has the highest *marginal* payoff for the field. Currently, governance design treats code and norms as separate layers. Proving they are functionally interchangeable (or dangerously distinct) via a rigorous protocol changes how platforms are architected. However, prioritizing Payoff over Leverage would lead to premature design prescriptions that fail because they misunderstand the underlying mechanism.

  **Conflict Resolution:**
  There is a tension between **Tractability** and **Payoff**. The funder wants Item 3 (Weaning). Pure science wants Item 2 (Dynamics). I am prioritizing **Levers** (Item 1) over both. If we get Item 1 wrong, Item 3 is dangerous (designing scaffolding that creates fragility) and Item 2 is fiction. I am letting *conceptual clarity* win over *immediate application* because a wrong model of sedimentation is worse than no model.

  ---

  ### Concrete Deliverables

  **1. The De-sedimentation Protocol**
  *   **What you have now:** A philosophical intuition that code can replace expectation.
  *   **What you will have at end of Year 1:** A **measurement instrument** in the form of a "Stress-Test Checklist" for community regularities. This will not be a survey, but a decision tree for identifying natural experiments (e.g., "Did the regularity persist after the API endpoint enforcing it was deprecated?").
  *   **Team分工:** Philosophers define the counterfactual "expectation removal" condition; Social Scientists map this to observable infrastructure changes; Modelers formalize the survival threshold (e.g., >80% compliance post-change).

  **2. Crowding-Out Dynamics**
  *   **What you have now:** A suspicion that defaults might create "counterfeit path-dependence."
  *   **What you will have at end of Year 2:** A **formal model** (evolutionary game theoretic or agent-based) that quantifies the "crowding-out effect." The model will output a metric: the rate at which artifact-enforced conformity reduces the basin of attraction for expectation-enforced conformity.
  *   **Team分工:** Modelers build the simulation; Philosophers ensure the utility functions distinguish between "compliance due to constraint" and "compliance due to coordination"; Social Scientists validate parameters against data from Item 1.

  **3. The Scaffolding Half-Life**
  *   **What you have now:** A hope that defaults can bootstrap genuine norms.
  *   **What you will have at end of Year 3:** A **falsifiable prediction** regarding "Scaffolding Half-Life." Specifically: a principle stating the minimum duration and variability of exposure to scaffolding required to generate expectation-based persistence after removal.
  *   **Team分工:** Social Scientists lead, using the instrument from Item 1 to evaluate case studies; Modelers test the prediction against the model from Item 2; Philosophers refine the normative implications for designers.

  ---

  ### The Trap: "Counterexample vs. Limiting Case"

  The candidate question on your list that is **overrated and a trap** is: *"Whether a sedimented regularity is a counterexample to the expectations condition in Lewis's definition, or a limiting case..."*

  **Why it is a trap:**
  This is a semantic sinkhole. It invites the philosophers to spend 18 months arguing about the definition of "convention" while the modelers and social scientists wait for a verdict to begin work. It assumes that the *label* matters more than the *mechanism*. Whether you call it a "convention," a "constraint," or a "pseudo-norm" is irrelevant to the empirical reality that the behavior persists without expectation.
  **Decision:** Do not solve this philosophically. Solve it pragmatically within Item 1. If the De-sedimentation Protocol shows the regularity survives expectation removal, treat it as a distinct class for the purpose of the project, regardless of whether it technically fits Lewis's 1969 text. Flag this as a **contested reading**: I am stipulating that for the purposes of *designing* communities, the Lewisian definition is insufficient, regardless of whether it is technically "wrong." We are extending the concept, not interpreting it.

  ---

  ### Accountability and Self-Correction

  **Two Judgments I Hold Most Confidently:**
  1.  **Sedimentation is empirically distinct from expectation-based norms.** The rise of algorithmic governance and hard-coded defaults in digital spaces creates a causal mechanism for regularity that is categorically different from Lewisian mutual expectation. Ignoring this renders the project blind to the primary driver of stability in the cases you selected.
  2.  **The "Weaning" problem is the only outcome that justifies the funding.** If the project ends with only a definition and a model, it will be academically respectable but practically inert. The "Scaffolding Half-Life" (Item 3) is the only deliverable that offers a actionable tool for community architects.

  **Where My Ranking Is Most Likely to Be Wrong:**
  I may be underestimating the **ethical and political intractability of Item 1**. The "De-sedimentation Protocol" relies on finding natural experiments where infrastructure changes. However, in many decentralized communities (e.g., crypto governance, federated networks), infrastructure changes are themselves political acts that may be blocked by stakeholders who benefit from the sedimentation. If we cannot find enough clean "de-sedimentation events" to validate the protocol, Year 1 stalls. I am betting on the availability of data (forks, updates) that may be messier than anticipated.

  **The First-Year Discovery That Would Shift the List:**
  If, in the first year, the Social Scientists discover that **zero** regularities survive the removal of scaffolding in the selected case studies (i.e., when the bot is turned off, the norm vanishes instantly every time), the agenda must shift immediately.
  *   **The Shift:** Item 2 (Dynamics) and Item 3 (Weaning) become obsolete. If nothing survives de-sedimentation, there is no "norm" to bootstrap, only "control" to maintain.
  *   **New Priority:** The project would pivot to **"Architecture as Governance,"** abandoning the language of norms entirely. The ranking would flip to focus exclusively on the stability and ethics of the artifacts themselves, rather than their relationship to agent expectations. This would be a negative result for the theory of norms, but a high-value finding for platform design.
