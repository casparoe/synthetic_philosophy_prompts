answer: |-
  ### The Case of the Zone and the Sip

  **The Experiences**
  Consider a subject, Alex, during a single week in October. On Tuesday, Alex plays a competitive tennis match. The case focuses on a single rally during the tie-break: fifteen seconds of high-stakes exchange. Alex is "in the zone." Attention is entirely consumed by the ball's trajectory and body position. There is no internal monologue, no awareness of the score, and no awareness of *enjoying* the moment. On Saturday, Alex sits alone on a porch with a freshly brewed cup of coffee. The case focuses on the first sip: fifteen seconds of deliberate tasting. Alex attends closely to the flavor, thinking explicitly, "This is exactly what I wanted," and taking satisfaction in that recognition.

  Both experiences are judged pleasures by ordinary standards. Both are pleasures by the theories' criteria: the Dimensionalist cites the positive tone; the Attitudinalist cites the pro-attitude (absorption in the rally, gladness at the coffee). They are matched in felt intensity (both are peak moments of their respective days) and duration (fifteen seconds). They share a concrete phenomenal character: **temporal dilation and sensory vividness.** In both cases, the peripheral world fades into a blur, and the target object (the ball, the liquid) appears with heightened definition and significance. The present moment feels widened, spacious, and fully occupied. A reader can locate this feature as the "narrowing of the aperture" accompanied by a sense of the "now" stretching out, distinct from the rushed or distracted phenomenology of ordinary time.

  **The Verdicts**
  **The Dimensional Theorist** unifies the pair successfully. For this theorist, pleasure is a phenomenal determinable—a specific valence dimension. The shared feature of "temporal dilation and sensory vividness" is the realization of that determinable. It does not matter that one experience is physical and competitive while the other is sensory and contemplative; the *feel* of the welfare-relevant component is identical. The "glow" of the present moment is the common currency of welfare in both cases.

  **The Attitudinal Theorist** fails to unify the pair. For this theorist, pleasure is a pro-attitude (e.g., intrinsic desire or being glad) directed at an object. However, the descriptions reveal two structurally incompatible kinds of attitude.
  In the *Sip*, the attitude is **reflective endorsement.** Alex is glad *that* he is having this experience. The attitude requires a subject-object split: Alex stands back from the sensation and affirms it. If Alex stops affirming, the pleasure ceases.
  In the *Rally*, the attitude is **pre-reflective absorption.** Alex is not glad *that* he is playing; he is simply playing. There is no subject-object split; the self is merged with the action. Crucially, if Alex were to adopt the reflective stance ("I am glad I am doing this"), the flow would break, anxiety would intrude, and the pleasure would vanish.
  Thus, the attitude constitutive of the *Sip* is robust under introspection, while the attitude constitutive of the *Rally* is fragile under introspection. Two relations that have opposite conditions of stability cannot be the same natural kind. The Attitudinalist cannot claim "pro-attitude" is a single unifier without emptying the term of structural content.

  **Name of the Case**
  The Case of the Zone and the Sip.

  **The Feature and the Counterfactual**
  The feature doing the work is **the role of self-awareness.** In the *Sip*, self-awareness constitutes the pleasure; in the *Zone*, it destroys it.
  If this feature is removed—specifically, if we make the *Sip* pre-reflective (Alex drinks without thinking about it) —the *Sip* collapses into a mere sensory registration, losing its status as a distinct pleasure for the Attitudinalist (who needs the attitude). If we make the *Zone* reflective (Alex thinks about enjoying the rally), the experience collapses into an ordinary heterogeneity case: the Attitudinalist can then say both are "reflective gladness," but the Dimensionalist loses the shared phenomenal character (the "flow" feel vanishes, replaced by self-consciousness). The specific reversal of the standard dialectic depends entirely on the tension between immersion and endorsement.

  **The Strongest Attack and Reply**
  **Attack:** The Attitudinalist argues that both cases involve an *intrinsic desire* for the experience to continue. In the *Rally*, the desire is implicit/non-conscious; in the *Sip*, it is explicit. The relation (desire) is the same; only the awareness of the relation differs.
  **Reply:** This conflates the *object* of desire with the *mode* of desiring. In the *Rally*, Alex desires the *win* (the outcome), not the *experience* (the process). To claim he desires the experience is to attribute a thought he does not have. If the Attitudinalist retreats to "dispositional desire," they lose the ability to distinguish occurrent pleasure from mere preference satisfaction. If they insist the desire is occurrent but non-conscious, they posit a mental state that behaves unlike any other occurrent state (it vanishes when noticed). This makes the "attitude" a theoretical ghost rather than a phenomenological reality.

  **The Dilemma**
  This construction forces the Attitudinalist into a dilemma regarding the nature of the unifying attitude.
  **Horn 1:** Treat the unifying attitude as itself **phenomenal.** If "being glad" or "desiring" has a specific feel that unifies the *Zone* and the *Sip*, the view collapses into Dimensionalism. The "attitude" just becomes another felt quality (the "glow" described above), surrendering the claim that attitudes avoid the heterogeneity problem.
  **Horn 2:** Treat the unifying attitude as **purely conative** (functional/dispositional). If the attitude has no phenomenal character, the theorist now owes an explanation of why welfare tracks this functional state when the subject is unaware of it (as in the *Zone*). They must explain why a non-conscious desire contributes to well-being while a non-conscious belief does not, without appealing to the *feel* of the desire. This leaves the view vulnerable to the objection that it severs the link between welfare and consciousness.

  **Conclusion**
  This construction establishes that the heterogeneity problem is not merely a difficulty for felt-quality theories that attitudinal theories escape by fiat. By demonstrating that the "pro-attitude" itself fractures into incompatible kinds (reflective vs. pre-reflective) across ordinary pleasures, the case shows that attitudinalism merely relocates the heterogeneity from the *objects* of pleasure to the *modes* of engagement. It does not establish that hedonism is false; both theories can still classify these states as welfare. However, it suggests that the result is better read as a problem for **both** views. The Dimensionalist must explain how "vividness" covers both aggressive and contemplative states without being too thin to matter; the Attitudinalist must explain how "pro-attitude" covers both merger and endorsement without being too disjunctive to unify. The construction thereby neutralizes the standard advantage claimed by attitudinalism, forcing a stalemate rather than a victory.
