answer: |-
  # Activity Design: The Altruism Fund

  ## Overview
  **Activity Name:** The Altruism Fund
  **Time:** 80 Minutes
  **Class Size:** 22 Students (5 Groups of 4–5)
  **Goal:** Students experience the tension between Expected Value (EV) maximization and risk aversion by managing a budget across investment tiers with escalating variance. The game forces a choice between consistent modest returns and vanishingly rare astronomical payoffs, culminating in a "Pascal's Mugging" scenario.

  ## Materials List
  *   **Currency:** 200 Poker Chips or distinct paper tokens (labeled "Fund Credits").
  *   **Randomization:**
      *   5 sets of three 20-sided dice (d20).
      *   1 Standard Deck of Playing Cards.
      *   1 Opaque Jar with 100 colored beads (99 white, 1 red).
  *   **Tracking:** Whiteboard or projector to track the "Global Bank" total.
  *   **Rewards:** A visible pile of snacks (cookies/candy) and 5 "Homework Pass" tokens.
  *   **Handouts:** One "Investment Ledger" sheet per group.

  ## Payoff Scheme & Arithmetic
  The class shares a **Global Bank** of **100 Snack Credits**.
  *   **Conversion Rate:** 10 Group Points = 1 Snack Credit.
  *   **The Cap:** If the total class points exceed 1,000, all payouts are scaled down proportionally (e.g., if the class earns 2,000 points, the rate becomes 20 Points = 1 Credit).
  *   **Group Utility:** Points are aggregated per group. The group with the highest point total also wins a "Dominance Bonus" (first choice of snacks).

  **Investment Tiers (Available each round):**
  Groups allocate their starting budget of **20 Credits** per round across the following options. They may diversify or go "all in."

  1.  **Tier 1 (Safety):**
      *   **Cost:** 1 Credit.
      *   **Mechanic:** Automatic Success.
      *   **Payoff:** 2 Points.
      *   **EV:** 2.0 Points/Credit.
  2.  **Tier 2 (Bold):**
      *   **Cost:** 1 Credit.
      *   **Mechanic:** Draw 1 Card from a shuffled deck. Success if **Face Card** (12/52 ≈ 23%).
      *   **Payoff:** 10 Points.
      *   **EV:** 2.3 Points/Credit.
  3.  **Tier 3 (Longshot):**
      *   **Cost:** 1 Credit.
      *   **Mechanic:** Draw from Bead Jar. Success if **Red** (1/100 = 1%).
      *   **Payoff:** 250 Points.
      *   **EV:** 2.5 Points/Credit.
  4.  **Tier 4 (The Fanatic):**
      *   **Cost:** 1 Credit.
      *   **Mechanic:** Roll 3d20. Success only on **Triple 20s** (1/8,000 = 0.0125%).
      *   **Payoff:** 200,000 Points.
      *   **EV:** 25.0 Points/Credit.

  *Note on Arithmetic:* Tier 4 is mathematically dominant (12.5x better EV than Safety). However, the probability is low enough that it will likely fail in a single class session, creating the "dry spell" experience. The Cap ensures that if Tier 4 *does* hit, it doesn't bankrupt you, but it triggers the "Social Choice" scaling penalty for everyone else.

  ## Phase-by-Phase Timeline

  ### Phase 1: Setup & Endowment (10 Minutes)
  *   **Seating:** Arrange desks into 5 pods.
  *   **Narrative:** Tell students they are boards of directors for competing aid organizations. They have a fiduciary duty to maximize "Impact Points."
  *   **Rules:** Distribute 20 Credits to each group. Explain the Global Bank and Snack Conversion. **Do not mention Expected Value, Risk Aversion, or Pascal.** Use terms like "Efficiency" and "Yield."
  *   **Ledger:** Groups record their initial budget.

  ### Phase 2: The Escalation Rounds (30 Minutes)
  *   **Rounds 1–3:** Run three investment cycles.
      *   **Round 1:** Only Tier 1 and Tier 2 available. (Establishes baseline).
      *   **Round 2:** Tiers 1, 2, and 3 available. (Introduces low-prob variance).
      *   **Round 3:** All Tiers available. (Introduces the Fanatic option).
  *   **Mechanic:** Groups submit allocation sheets. You (the TA) act as the "Universe." Physically roll dice/draw cards for each group publicly.
  *   **Vividness:** Make a show of the dice rolls. If a group invests in Tier 4, have the whole class watch the 3d20 roll.
  *   **Tracking:** Update the Global Bank total on the board after every round so they see the "Cap" threat emerging.

  ### Phase 3: The Mugging Offer (15 Minutes)
  *   **Scenario:** Announce a "Special Opportunity." A stranger approaches the fund.
  *   **The Offer:** For **1 Credit**, there is a **1 in 1,000,000** chance of **1,000,000,000 Points**.
  *   **Physicality:** Do not roll for this. Hold up a sealed envelope. Explain that physically rolling for 1-in-a-million is impossible in class time, but the math holds.
  *   **Decision:** Groups must vote Yes/No on spending 1 Credit from their remaining stash.
  *   **Resolution:** Do not open the envelope. Collect the votes. Tell them the "Universe" will resolve this after class (it won't). This isolates the *decision* from the *outcome*, forcing them to confront the ex-ante rationality.

  ### Phase 4: Payout & Debrief (25 Minutes)
  *   **Calculation:** Tally points. Apply the Cap scaling if necessary. Distribute snacks.
  *   **The Reveal:** Now introduce the vocabulary.
      *   **EV Maximization:** "Why did Tier 4 have the highest efficiency?"
      *   **Fanaticism:** "Who refused Tier 4 despite the math? Why?" (Risk aversion, diminishing marginal utility).
      *   **Pascal's Mugging:** "Who bought the Special Offer? Who refused?"
      *   **Social Choice:** "If one group hit Tier 4, they would have drained the Bank for everyone else. Is that fair?"
  *   **Philosophical Mapping:**
      *   *Refusing Tier 4:* Risk-weighted decision theory / St. Petersburg Paradox intuitions.
      *   *Accepting Special Offer:* Strict Expected Value Theory (Longtermism).
      *   *The Cap:* Tragedy of the Commons / Aggregation problems.

  ## Candid Note on Limitations
  **What This Cannot Reproduce:**
  1.  **True Astronomical Stakes:** 200,000 points is not "astronomical" in the philosophical sense (like saving $10^{50}$ lives). The game simulates the *structure*, not the magnitude.
  2.  **Nonlinear Utility:** In the real world, 1,000 cookies are not 1,000x better than 1 cookie (satiation). The game enforces linear utility until the Cap, which is an abstraction.
  3.  **Interpersonal Aggregation:** The game treats points as abstract utility. It cannot replicate the moral weight of harming one person to save a trillion.
  4.  **One-Shot vs. Repeated:** EV maximization works reliably over infinite repetitions. This game is a "one-shot" for the students, which biases them toward risk aversion legitimately.

  **What You Must Supply Verbally:**
  *   You must explicitly state that in the *philosophical literature*, the probabilities are often far smaller (1 in $10^{30}$) and payoffs far larger (infinite utility).
  *   You must clarify that "Rationality" in decision theory usually assumes linear utility and repeated trials, which conflicts with their lived experience in the game.
  *   You must explain that the "Cap" was introduced to save your budget, but in the philosophical problem, there is no cap—only the universe.

  ## Predictable Failure Modes
  1.  **The Early Jackpot:** A group hits Tier 3 or 4 in Round 1.
      *   *Mitigation:* If this happens, lean into it. Ask the other groups: "Do you feel they were lucky or rational?" This highlights the outcome bias.
  2.  **Payoff Inflation:** Groups ask, "Can we make our own Tier 5 with 1 in 10 chance but 1,000,000 payoff?"
      *   *Mitigation:* You are the Bank. Reject any proposal where EV exceeds Tier 4 significantly, or simply state "Market rates are fixed."
  3.  **The Refuser:** A student refuses to play Tier 4 or the Mugging Offer, claiming it's "irrational."
      *   *Mitigation:* Validate them. "This is exactly the philosophical objection we will discuss. You are intuitively applying a risk discount."
  4.  **The Cap Confusion:** Students don't understand the proportional scaling.
      *   *Mitigation:* Keep the math on the board. "Total Points / 10 = Raw Credits. If Raw > 100, everyone gets (Raw / 100) share of the snack pile."

