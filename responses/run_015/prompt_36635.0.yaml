prompt: |-
  I'm a PhD student in philosophy working on decision theory, and this term I'm TA-ing an undergraduate seminar on rational choice: 22 students, one 80-minute section, movable desks, and a strict no-laptops policy I'd like to keep for this meeting. Next week's topic is expected value maximization and the problem of fanaticism — the observation that strict EV maximization seems to commit you to accepting arbitrarily tiny probabilities of arbitrarily enormous payoffs, and that some philosophers treat this as a reductio of the theory while others bite the bullet. Rather than lecturing on it, I want the students to construct the dilemma themselves and only discover where they've arrived afterward. Please design a runnable in-class game along these lines.

  What I have in mind is something like a charity-allocation exercise: small groups invent their own interventions, each with a probability of success and a payoff (in points), and then compete or bid for a share of a fixed pool — so that the escalating tradeoff between near-certain modest gains and vanishingly rare astronomical ones emerges from their own choices rather than from a slide I hand them. I'd like a points economy where points convert to something real but small (snacks, homework tokens), a resolution mechanic built on physical randomization (dice, coin flips, a spinner) so the randomness is vivid rather than simulated, and enough repetitions that the class experiences both a large payout actually landing and long demoralizing dry spells. The payoff scheme should make the fanatic option ex ante optimal while keeping the downside of losing genuinely modest. The debrief should map specific moments in the game onto parts of the philosophical dispute: where risk aversion entered as a candidate defeater, the point at which the numbers blew past any representable real-world quantity, the moment someone inevitably proposed a Pascal's-mugging-style counter-offer, and the question of whether the class's aggregate allocation starts looking like a social choice problem rather than an individual decision problem. Don't name the philosophical positions or the thought-experiment literature until the very end — I want them to arrive at fanaticism's pull from the inside, including the version where a single tiny harm spread across an incomprehensibly large number of people outweighs one grave harm.

  Please include: complete rules and a materials list, a phase-by-phase timeline, the payoff scheme with the arithmetic worked out, the debrief structure, a candid note on what the activity cannot possibly reproduce (real astronomical stakes, nonlinear utility in the reward currency, interpersonal aggregation across persons) and what I'll have to supply verbally, plus a list of what predictably goes wrong the first time (groups inflating payoffs into meaninglessness, a huge payout landing in round one and muddying everything, someone refusing to play at all and insisting that refusal was the rational move). After the prose description, give me a structured summary as a JSON object with the following fields: activity_name (string), materials (array of strings), phases (array of objects, each with name, minutes, mechanic, and idea_it_targets), payoff_scheme (string), failure_modes (array of strings), cant_reproduce (array of strings), and facilitator_must_supply (array of strings). Everything in American English, please.
