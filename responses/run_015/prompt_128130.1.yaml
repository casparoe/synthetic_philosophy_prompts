      *   *The Missing Piece:* The role of the **Anima Terrae (Soul of the Earth)** and the **Human Soul** as the *mediator*. Kepler's astrology isn't just planets zapping earth (David's efficient cause) or just abstract math (Maya's formal correspondence). It is that the *Earth itself* (or the human soul) *perceives* the aspects and reacts instinctively, like music affecting the emotions. The causality is *psychological/perceptual* within the animate cosmos, not just geometric resonance or physical weather.
