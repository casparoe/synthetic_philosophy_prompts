          *   *Refinement:* Maya's rebuttal in Move 1 says he predicted "political turmoil affecting named patrons." David's rebuttal in Move 2 says "forecasting collective political events is precisely what a meteorological model does." This is historically accurate. Kepler viewed mass events as physical/biological responses to cosmic geometry, individual will as free. David wins this specific exchange on the *theory* of influence.

      *   **Move 3: Maya's Nuance (Geometric Harmony vs. Efficient Causation)**
          *   *Claim:* Not determinism or correlation, but geometric harmony. Aspects (angles) are real/observer-independent. Houses are arbitrary (observer-dependent). Harmony resonates through divine mathematical order (formal correspondence).
          *   *Historical Fact:* This is the core of Kepler's *Harmonices Mundi*. He rejected the traditional 12 houses (arbitrary) and focused on aspects (geometric angles between planets). He sought a physical cause (light/geometry) but grounded it in the soul's perception of harmony. He explicitly argued against "efficient causation" in the vulgar sense, preferring a harmony that the "Earth Soul" or human soul perceives.
