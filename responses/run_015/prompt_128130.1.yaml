          *   *Assessment:* Maya is stronger here. Kepler wasn't just doing it for money; he wrote theoretical works on astrology (*De Fundamentis Astrologiae*). He definitely sought to reform it, not abolish it. David's claim that he was *essentially* a skeptical rationalist who *only* did it for income understates Kepler's genuine belief in cosmic harmony.
