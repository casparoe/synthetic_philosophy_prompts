      Dear Colleague, I recognize this distress. It is the specific terror of formal ethics when the machinery turns on itself. You have built a sensitive instrument and it is vibrating so violently it reads zero. The error is not in your arithmetic but in your interpretation of silence. You should reject step seven.

      Step seven conflates epistemic uncertainty with ontological indeterminacy. You write that because your model cannot adjudicate the sign, there is no fact of the matter. This is a category mistake. The suffering of the wild animals on that hectare is not dependent on your parameter distribution. There is a fact of the matter about whether their lives are net negative, just as there is a fact of the matter about whether the chicken suffered, even if your current data cannot resolve it. By moving from I cannot tell to there is nothing to tell, you grant yourself a permission slip that reality does not issue. The cost of rejecting seven is that you lose the comfort of symmetry. You can no longer say chicken and beef are equally permissible. Instead, you must say the comparison is currently unresolved, which imposes a burden of caution rather than a license for indifference.

