answer: |-
  # The 90-Minute Hybrid Classification Protocol
  **Purpose:** To determine if a condition qualifies as a "disease" for state disability funding and research grants.
  **Constraints:** 90-minute meeting, mixed expertise (clinicians, administrators, laypersons), no deep philosophical debate.
  **Honesty Clause:** This procedure does not solve the metaphysical problem of disease. It creates a consistent administrative heuristic. Where the heuristic breaks, you must vote.

  ---

  ## Part 1: The Three-Step Flow

  ### Step 1: The Biological Dysfunction Check (Naturalist Filter)
  **Question:** *Is there a verifiable deviation from species-typical biological function?*
  **Criteria (Check at least two):**
  1.  **Pathology:** Is there identifiable tissue damage, pathogen presence, or genetic mutation?
  2.  **Physiology:** Do biomarkers (blood, imaging, neural activity) fall outside the 95% statistical norm for the population?
  3.  **Etiology:** Is there a known causal mechanism (e.g., virus, trauma, degeneration) distinct from normal aging or environmental adaptation?

  *   **If YES:** Proceed to Step 2.
  *   **If NO:** Proceed to Step 2 (Do not auto-reject; some functional disorders lack biomarkers).
  *   **[VOTE REQUIRED]:** If the committee cannot agree on what constitutes "species-typical" for this specific trait (e.g., neurodivergence vs. neurotypical), punt to a subcommittee with external medical consultation. Do not decide this in the main room.

  ### Step 2: The Vital Goal Impairment Check (Normativist Filter)
  **Question:** *Does the condition prevent the individual from achieving "vital goals" in standard circumstances?*
  **Criteria (Check at least two):**
  1.  **Agency:** Does it significantly reduce the person's ability to choose and act on life plans (work, relationships, self-care)?
  2.  **Suffering:** Is there reported subjective distress or pain that is not transient?
  3.  **Social Participation:** Does it create a barrier to participating in standard societal institutions (education, employment, civic life) *even with reasonable accommodations*?

  *   **If YES:** Proceed to Step 3.
  *   **If NO:** **STOP.** Classify as *Non-Qualifying Variation*. (Exception: Asymptomatic conditions with high future risk—see "Unwelcome Answer" below).
  *   **[VOTE REQUIRED]:** If the "vital goal" is highly idiosyncratic (e.g., "I cannot become a professional astronaut due to mild astigmatism"), the committee must vote on whether this goal counts as "standard" for funding purposes.

  ### Step 3: The Conflict & Tie-Breaker
  Compare the results of Step 1 and Step 2.

  | Biological Dysfunction (Step 1) | Vital Goal Impairment (Step 2) | Classification | Action |
  | :--- | :--- | :--- | :--- |
  | **YES** | **YES** | **Qualified Disease** | Approve for Coverage & Research. |
  | **NO** | **YES** | **Functional Disability** | Approve for Coverage; Limit Research to Social/Environmental causes. |
  | **YES** | **NO** | **Asymptomatic Pathology** | **Deny Coverage**; Approve for Preventive Research only. |
  | **NO** | **NO** | **Normal Variation** | Deny Both. |

  **The Tie-Breaker Rule:**
  In a **Disability Funding** context, **Step 2 (Harm) trumps Step 1 (Biology).**
  *Reasoning:* We are a disability pool, not a biology grant. If there is no functional impairment, there is no disability to fund, regardless of biological status.
  *   **[VOTE REQUIRED]:** If the condition is *contagious* or poses a *public health risk* (e.g., asymptomatic TB carrier), the Tie-Breaker is void. Public safety trumps individual functional status. Vote on public health exception.

  ---

  ## Part 2: Worked Examples

  ### Case A: Clear Naturalist Win (Type 1 Diabetes)
  *   **Step 1 (Bio):** **YES.** Autoimmune destruction of beta cells; insulin production statistically zero compared to species norm.
  *   **Step 2 (Harm):** **YES.** Without intervention, death/inability to function. With intervention, high management burden impacts vital goals.
  *   **Step 3 (Result):** **Qualified Disease.**
  *   **Outcome:** Full funding. No philosophical friction.

  ### Case B: Clear Normativist Win (Idiopathic Chronic Pain)
  *   **Step 1 (Bio):** **NO/UNCLEAR.** No lesion, no inflammation, imaging normal. Biomarkers within statistical norm.
  *   **Step 2 (Harm):** **YES.** Patient cannot work, sleep, or maintain relationships due to pain levels.
  *   **Step 3 (Result):** **Functional Disability.**
  *   **Outcome:** Coverage approved (pain management, therapy). Research grants restricted to quality-of-life studies, not "curative" biological research until a mechanism is found.
  *   **Why this works:** It validates patient suffering without demanding impossible biological proof.

  ### Case C: The Borderline Clash (Persistent Social-Comparison Fatigue)
  *   **Context:** Applicant claims inability to function due to exhaustion from heavy social media use.
  *   **Step 1 (Bio):** **NO.** Dopamine regulation is within statistical norms for heavy users. No tissue damage. It is an environmental adaptation, not a biological failure.
  *   **Step 2 (Harm):** **YES.** Applicant reports inability to hold a job, severe anxiety, social withdrawal. Vital goals blocked.
  *   **Step 3 (Result):** **Functional Disability.**
  *   **Outcome:** Coverage approved for therapy/digital detox programs. Research grants denied for "biological cause" (waste of money); granted for "behavioral/societal intervention."
  *   **The Friction:** Clinicians on the board will hate this. They will argue this is a "lifestyle choice," not a disease.
  *   **[VOTE REQUIRED]:** Because Step 1 is negative, you must vote on whether the "Harm" is self-inflicted enough to disqualify under "Standard Circumstances." If >50% vote "Self-Inflicted," deny. If >50% vote "Environmental Hazard," approve.

  ---

  ## Part 3: The Unwelcome Answer (Where the Logic Bites You)

  **Case:** *Asymptomatic Hypertension (Stage 1)*
  *   **Step 1 (Bio):** **YES.** Blood pressure statistically deviates from species-typical function; vascular risk increased.
  *   **Step 2 (Harm):** **NO.** Patient feels fine, works full time, has no pain, no functional limitation *today*.
  *   **Step 3 (Result):** **Asymptomatic Pathology.**
  *   **Outcome:** **Deny Disability Coverage.** Approve Preventive Research.
  *   **Why you will dislike this:** It feels cruel to deny funding for medication to someone with a "disease."
  *   **Why the procedure says this:** This is a *disability* fund, not a *healthcare* fund. If there is no current impairment of vital goals, the individual is not disabled by the condition *yet*. Funding this converts the pool into general health insurance, draining resources from those currently unable to function.
  *   **[VOTE REQUIRED]:** You must vote on whether to override the Tie-Breaker for *preventive maintenance*. If you vote yes, you admit you are running a Health Fund, not a Disability Fund.

  ---

  ## Part 4: Vulnerabilities & Conditions for Revision

  ### Where This Reasoning is Most Vulnerable
  1.  **The "Species-Typical" Trap (Step 1):** Defining "normal" biological function is political. Historically, homosexuality and masturbation were classified as biological dysfunctions. If your "statistical norm" data is biased (e.g., based only on white male physiology), you will systematically exclude minority conditions.
      *   *Mitigation:* Require that "statistical norm" data be demographically stratified. If data is missing, default to Step 2.
  2.  **The "Vital Goals" Bias (Step 2):** Nordenfelt's "vital goals" are culturally specific. A condition that prevents "industrial labor" might not prevent "agrarian subsistence." If your board defines "vital goals" as "ability to work a 9-5 job," you are medicalizing poverty and unemployment.
      *   *Mitigation:* Explicitly define "Vital Goals" in your bylaws to include *self-defined* life plans, not just economic productivity.
  3.  **The Self-Inflicted Loophole:** In Case C (Social Media), the line between "disease" and "consequence of choice" is thin. If you approve this, you open the door to funding for "hangovers" or "gamer thumb."
      *   *Mitigation:* The "Standard Circumstances" clause in Step 2. Is the exposure to the harm avoidable for a reasonable person? This requires a moral judgment, not a medical one.

  ### What Would Change My Mind?
  I currently prioritize the **Normativist (Harm)** view in the Tie-Breaker because this is a *disability* fund. I would switch to prioritizing the **Naturalist (Biology)** view if:
  1.  **Predictive Certainty:** We develop biomarkers that predict functional impairment with >90% accuracy *before* symptoms appear (e.g., a genetic test that guarantees blindness in 5 years). In that case, "Asymptomatic Pathology" becomes "Pre-Disability," and coverage should trigger early.
  2.  **Stigma Evidence:** If data shows that classifying something as a "Functional Disability" (Bio-No/Harm-Yes) results in significantly higher social stigma or lower employment rates than classifying it as a "Biological Disease," then we should prioritize the Biological label to protect patients, even if the science is shaky. (i.e., If "It's all in your head" costs people jobs, we should try to find a biological hook whenever possible).

  ### Final Instruction to the Board
  When you hit a **[VOTE REQUIRED]** flag, do not try to argue philosophy. Argue resources.
  *   *Question:* "Are we willing to spend limited state dollars on this?"
  *   *Not:* "Is this ontologically a disease?"

  If the procedure yields an answer that feels morally wrong (like the Asymptomatic Hypertension case), do not tweak the logic to fit the feeling. Instead, acknowledge that **this specific fund is the wrong tool for that specific problem**, and recommend the applicant to a different program. Do not corrupt the classification system to fix a policy gap.
