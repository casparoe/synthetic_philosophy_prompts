  *Wait, one more check:* The prompt asks for "Persistent social-comparison fatigue" as the borderline case. I must use that.
  *Check:* "Flag every point where we still have to punt to a subcommittee or just vote." I need to insert [VOTE REQUIRED] markers.

  *Refining the Tie-Breaker:* If Naturalist = Yes and Normativist = No (e.g., asymptomatic cancer marker), is it a disease? Boorse says yes. Nordenfelt says no. For *disability funding*, Nordenfelt should win (no disability). For *research*, Boorse wins. Since the board does both, I need to distinguish. I will recommend a dual-label system or a primary tie-breaker based on the *purpose* of the specific fund being applied for. Let's simplify: The label "Disease" is the gate. If it passes, then we decide funding. I will set the Tie-Breaker to favor Normativism for *eligibility* because this is a *disability* pool.

