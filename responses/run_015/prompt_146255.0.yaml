prompt: |-
  I'm on the review board for our state's disability and chronic-condition funding pool, and every month we recieve about a dozen applications asking us to classify some condition as a 'disease' for coverage and research grants. The committee is split between folks who want a naturalist definition — basically Boorse-style statistical deviation from species-typical biological function — and folks who want a normativist one, like Nordenfelt's idea that disease is failure to achieve vital goals given standard circumstances. We need a reusable procedure that works in a 90-minute meeting with no philosophy PhDs present, and I want it to be honest about where it breaks.

  Write it as a step-by-step flow: first check biological dysfunction with concrete criteria, then check harm/vital-goals impairment, then specify exactly where the two conflict and what tie-breaker applies. Give worked examples for three cases — one clear naturalist win, one clear normativist win, and one borderline clash like 'persistent social-comparison fatigue in heavy social-media users,' which is the kind of weird modern case we actually see. Include one case where the procedure gives an answer I'll probably dislike, and flag every point where we still have to punt to a subcommittee or just vote rather than hiding behind false objectivity. Also tell me what argument or finding would change your mind about which framework should dominate tie-breakers, and point out where your reasoning is most vulnerable — don't give me fake confidence.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Review board member for state disability/chronic-condition funding.
      *   **Task:** Create a reusable procedure for classifying conditions as 'diseases' for coverage/grants.
      *   **Constraints:** 90-minute meeting, no philosophy PhDs present, must be honest about limitations/breaking points.
      *   **Framework:** Hybrid of Naturalist (Boorse: statistical deviation from species-typical function) and Normativist (Nordenfelt: failure to achieve vital goals).
      *   **Format:** Step-by-step flow (Bio Dysfunction $\rightarrow$ Harm/Goals $\rightarrow$ Conflict/Tie-breaker).
      *   **Examples:** Three specific cases (Clear Naturalist, Clear Normativist, Borderline/Modern).
      *   **Requirements:** Include one unwelcome answer, flag points requiring voting/subcommittee, state what would change my mind on the framework, and identify vulnerabilities in the reasoning.
      *   **Tone:** Honest, pragmatic, not over-confident.

  2.  **Deconstruct the Philosophical Frameworks:**
      *   *Naturalist (Boorse):* Objective, biological, statistical. Is a body part/system working as designed for the species? Good for clear pathology (cancer, infection). Bad for mental health, social contexts, or variations that aren't inherently harmful.
      *   *Normativist (Nordenfelt):* Subjective/Contextual, goal-oriented. Can the person do what they need/want to do in their society? Good for disabilities, mental health, social barriers. Bad for asymptomatic conditions or harmful preferences (e.g., wanting to run a marathon with a broken leg).
      *   *The Tension:* Biology says "normal," Life says "disabled" (or vice versa).

  3.  **Drafting the Procedure (The "90-Minute Protocol"):**
      *   Need to keep it tight. 90 minutes for a dozen applications is roughly 7 minutes per app, plus discussion. The procedure needs to be a filter, not a deep dive.
      *   *Step 1: Biological Dysfunction (The Boorse Check).* Concrete medical evidence.
      *   *Step 2: Vital Goal Impairment (The Nordenfelt Check).* Impact on daily life/work/social participation.
      *   *Step 3: The Intersection/Conflict.* What if they disagree?
      *   *Tie-Breaker:* Needs to be pragmatic for *funding*. Since it's a disability/chronic-condition pool, the *harm* usually matters more than the *biology* for allocation, but biology matters for *medical legitimacy*. Let's prioritize Harm for funding eligibility, but Biology for research categorization. Actually, the prompt asks for a classification as 'disease'. If it's for *coverage*, harm is usually the gatekeeper. Let's make the tie-breaker: "If Biology says No but Harm says Yes, classify as Functional Disability (Coverage Yes, Research Maybe). If Biology says Yes but Harm says No, classify as Asymptomatic Pathology (Coverage No, Research Yes)."
      *   *Wait, the prompt asks for a 'disease' classification.* I need to be careful. If I say "It's not a disease but you get money," that might violate the mandate. Let's refine the Tie-Breaker: In a funding context, *unwanted impairment* trumps *statistical normality*.
      *   *Voting Flags:* Explicitly state where the committee must vote.

  4.  **Developing the Worked Examples:**
      *   *Case 1 (Naturalist Win):* Type 1 Diabetes. Clear biological mechanism, clear harm. Easy.
      *   *Case 2 (Normativist Win):* Severe Environmental Allergy (e.g., to standard office materials) or maybe a specific disability context. Let's go with *Chronic Pain Syndrome with no identifiable lesion*. Biology is ambiguous/negative, Harm is high.
      *   *Case 3 (Borderline/Modern):* "Persistent social-comparison fatigue in heavy social-media users" (as requested). This is the tricky one. Biology? Maybe dopamine regulation. Harm? Subjective. Social cause? Yes.
      *   *Unwelcome Answer:* I need a case where the procedure says "No Funding" but it feels wrong. Maybe an asymptomatic genetic marker? Or a harmful lifestyle choice that looks like a disease? Let's go with *Asymptomatic Hypertension* (Biology Yes, Harm No *yet*). Procedure might say "Not a disease *for disability funding*" because there's no current functional loss. That's controversial but logically consistent. Or better: *Infertility*. Biology says dysfunction, Normativist says "depends on vital goal of having kids." If the committee values "species-typical function" over "individual goals," infertility is a disease. If they value "vital goals," it's only a disease if the patient *wants* kids. Let's make the unwelcome answer about a condition that is biologically real but socially constructed as harmful, or vice versa. Let's try *Obesity*. Biology: Statistical deviation. Harm: Context dependent. The procedure might classify it as a disease even if the applicant feels healthy, which is stigmatizing. Or, the procedure might deny it if there's no metabolic dysfunction. Let's go with the *Asymptomatic Genetic Carrier* scenario. Biology = Deviation. Harm = None. Procedure = No Coverage. This highlights the "Disability vs. Disease" distinction.

  5.  **Refining the Tie-Breaker & Vulnerabilities:**
      *   *Tie-Breaker:* For *funding*, Harm > Biology. For *research*, Biology > Harm. Since the prompt implies both coverage and grants, I need to split the verdict.
      *   *Vulnerability:* The definition of "Species-Typical" is politically charged (e.g., homosexuality was once considered a dysfunction). The definition of "Vital Goals" is culturally biased.
      *   *Change of Mind:* If evidence shows that labeling something a "disease" causes more harm (stigma) than the funding helps, or if biological markers become perfectly predictive of future harm.

  6.  **Writing the Content (Iterative refinement for tone and constraints):**
      *   *Tone Check:* Avoid academic jargon where possible. Keep it bureaucratic but honest.
      *   *Constraint Check:* 90 minutes? The steps need to be fast.
      *   *Honesty:* Admit where philosophy can't solve policy.

  7.  **Final Polish:**
      *   Ensure the "Unwelcome Answer" is clearly flagged.
      *   Ensure the "Change My Mind" section is substantive.
      *   Ensure the "Vulnerabilities" are specific to the logic used.

  *(Self-Correction during drafting)*: I initially thought about splitting Coverage vs. Research. But the prompt asks to classify as a 'disease'. I should stick to that classification but note the implication. Actually, the prompt says "classify some condition as a 'disease' for coverage and research grants." So the classification drives both. I will make the Tie-Breaker favor the *Normativist* side for the label 'disease' in a *disability* context, because disability is inherently about function. However, I must acknowledge the risk of medicalizing normal sadness.

