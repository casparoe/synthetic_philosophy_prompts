  Polite speech isn't assertion at all. Awkward commitment: You claim compliments carry no truth value, rendering them meaningless noise rather than social glue.
  Relationship-first contextualism about the truth norm. Awkward commitment: Truth obligations vanish entirely whenever feelings are at stake, making facts subordinate to harmony.
  Straight welfare-balancing. Awkward commitment: You might lie to spare feelings even when the truth would cause no harm, calculating utility over veracity.
  Bluntness as respect and anti-paternalism. Awkward commitment: You prioritize autonomy over comfort, even when the recipient begs for softening, risking unnecessary pain.
  Care-first, i.e. bluntness is laziness wearing a virtue label. Awkward commitment: You prioritize comfort over accuracy, even when accuracy prevents future harm, enabling avoidable failure.
  The view that the whole question is downstream of who is normally expected to do the softening. Awkward commitment: Morality shifts based on status hierarchies rather than content, making ethics relational.
  Accommodationism about whose norm wins. Awkward commitment: You must constantly calculate cultural ownership of every conversation, burdening the interlocutor with meta-normative labor.

  **Cells nobody lives in**
  The tree allows a cell where you refuse to lie, refuse to mislead, and refuse to be silent. This combination makes ordinary talk impossible because every negative fact requires one of those three outlets. If you cannot lie, cannot mislead, and cannot stay silent because silence itself speaks, you are forced to assert painful truths constantly, destroying relationships without gaining moral credit. It is incoherent because it denies the basic architecture of human interaction where some information must be withheld or softened to function.

  Similarly, the tree allows a cell where the isn't-an-assertion move is available for every negative assessment. This lets anyone opt out of every assertoric norm simply by reclassifying criticism as ritual. If every negative assessment is a gesture rather than a claim, speakers evade accountability for false claims by labeling them face-work. This collapses the distinction between feedback and noise, allowing harmful misinformation to spread under the guise of politeness, which nobody actually occupies because it renders communication useless.

  **Where it stalls**
  The tree stalls between straight welfare-balancing and relationship-first contextualism. Both yield identical recommendations in most cases, differing only in theoretical justification rather than practical output. Similarly, the tree cannot separate accommodationism from local norm governance when both parties agree to defer to the host culture. These are not empirical disagreements but meta-ethical overlaps where the decision path converges despite divergent underlying principles. I'd rather hand the group an honest dead end than a fake branch, so acknowledge these merges explicitly during discussion.
