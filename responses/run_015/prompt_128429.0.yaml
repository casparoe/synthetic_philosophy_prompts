answer: |-
  Good morning. Thanks for being here.

  Look around the room. We've got roughly half of you who study how life got smart, and half of you who are trying to build things that act smart. Usually, these groups talk past each other. The biologists worry the engineers are oversimplifying four billion years of history into a line of code. The engineers worry the biologists are going to get stuck on definitions while the technology leaps ahead.

  I want to propose a truce. Not a compromise, but a shared framework for the next few days. It hinges on two old ideas—what some call "strange inversions of reasoning."

  The first comes from Darwin. Before him, the assumption was that you need a mind to make something that looks designed. You need comprehension to create competence. Darwin flipped that. He showed us you can have incredible competence—adaptation, complexity, fit—without a single bit of comprehension anywhere in the system. Nature figures things out without knowing what it's doing.

  The second comes from Turing. He flipped the burden again. He suggested that we don't need to understand how a system works internally to grant it competence. We can build a machine that plays chess or translates text, even if we can't trace the semantics inside the silicon. We can have intelligence without us, the builders, fully comprehending the mechanism.

  Here's why this matters for *this* workshop. These two inversions create a narrow channel we need to navigate, and there are mirror-image mistakes waiting on both sides.

  To my colleagues building models: The Darwinian inversion is a warning, not just an inspiration. It is tempting to look at a loss curve going down and say, "It works, so we understand it." But competence is not comprehension. Just because your model generalizes doesn't mean you've cracked the code on how it represents the world. Don't let performance metrics convince you that the black box is transparent. If we leave here claiming we understand intelligence just because our systems are useful, we've missed the point of Darwin's insight.

  And to my colleagues in biology: The Turingian inversion is a warning for you, too. It is tempting to look at a neural net and say, "It's just matrix multiplication, it's not real adaptation," because you can't see the natural selection pressure or the metabolic cost. But don't dismiss the competence just because the internals are opaque or artificial. If we reject these systems as valid objects of study just because they don't match our traditional definitions of life, we're ignoring Turing's insight.

  So, here's the structural rule for the week: We are here to study the *phenomena* of competence, not just the *explanations* of comprehension.

  But—and this is crucial—we have to respect the boundary between the two.

  For the engineers: Please don't treat natural selection as a cheap metaphor for backprop. Biology is messy, contingent, and embodied in a way your simulations aren't. If you reduce evolution to a optimization shortcut, you'll lose the biologists in the room, and you'll lose the science.

  For the biologists: Please don't demand that AI systems justify their existence through biological fidelity. They are doing something real, even if it's alien. If you demand they look exactly like life to be interesting, you'll lose the engineers, and you'll miss the novelty.

  We are standing in a gap between "how it works" and "that it works." That tension is uncomfortable. It means we can't claim full understanding, but we can't dismiss the results either. That's not a bug; it's the feature.

  If we can hold that tension—admitting we don't fully comprehend the systems we study, while respecting the competence they show—we're going to get somewhere real. If we try to resolve the tension too quickly, either by overclaiming understanding or by dismissing the unknown, we'll just be talking to ourselves.

  So, let's keep the questions hard. Let's keep the metaphors honest. And let's see what we can learn from systems that know more than we do about how they work.

  Thanks. Let's get started.
