answer: |-
  When considering how a long-run prediction might be salvaged after suffering intermediate falsification, we must first isolate the specific component of the theory that has failed to materialize within the expected timeframe. A prediction might miss its mark because the initial conditions were misidentified, because the rate of operation was miscalculated, or because the causal mechanism itself was erroneous. Salvage operations generally fall into two categories based on how they treat the underlying causal story. In the first category, the theorist argues that the fundamental forces identified remain active and potent but have been temporarily counteracted by an exogenous variable that was not fully accounted for in the original timeframe, such as a technological breakthrough or a policy intervention that delays but does not negate the inevitable outcome. This preserves the explanatory content because the pressure described by the theory is still present, merely held in check. In the second category, the theorist retains the quantitative prediction but abandons the original causal story, arguing that the predicted outcome will occur for entirely different reasons than originally proposed. This is a retrofit that sacrifices explanatory power for predictive coincidence, effectively replacing the old theory with a new one that happens to share the same conclusion. Distinguishing between these is crucial because the first suggests a theory that is temporally misplaced but structurally sound, while the second suggests a theory that was fundamentally wrong about how the world works, even if it stumbled onto a correct numerical forecast.

  This distinction brings us to the central conceptual problem of whether a scientific theory can be genuinely right but early rather than simply wrong and later replaced by a different account. To explore this, we must examine the case of Malthusian population dynamics, which posits that population tends to grow geometrically while subsistence resources grow only arithmetically or linearly. The core of this theory is a specific causal mechanism: the biological imperative to reproduce clashes with the physical limits of land productivity, inevitably leading to a crisis of subsistence characterized by famine, disease, or war. Historically, this prediction suffered a stark intermediate falsification. Following the Industrial Revolution, agricultural productivity gains accelerated beyond linear expectations, and simultaneously, the demographic transition occurred, wherein urbanization and increased education led to voluntary reductions in fertility rates rather than involuntary checks via scarcity. For over a century, the predicted crisis did not materialize on a global scale, and living standards rose alongside population growth, seemingly refuting the claim that resource limits would bind population before technology could expand the frontier.

  The contemporary argument that these underlying pressure dynamics may still be valid in specific biogeographic or severely resource-constrained contexts despite the global temporary reprieve requires us to apply the distinction between mechanism-preserving rescue and mechanism-substituting rescue. In a mechanism-preserving rescue, the original causal structure wherein geometric population pressure meets linear or fixed resource expansion remains intact, but an exogenous technological, institutional, or ecological shock delays its manifestation without altering the core dynamics. Proponents of this view argue that the Green Revolution and fossil fuel subsidies were one-time shocks that temporarily decoupled population from land constraints, but that the fundamental arithmetic of energy and soil depletion remains unchanged. Under this view, the theory is right but early because the delaying factors are finite and the underlying pressure is merely latent, waiting to reassert itself once the temporary buffers are exhausted. The explanatory content is preserved because the threat remains one of resource scarcity driving population correction, even if the timeline is extended by centuries rather than decades.

  In contrast, a mechanism-substituting rescue occurs when the original causal story is largely abandoned or replaced by different dynamics, yet the quantitative endpoint eventually resembles the original prediction for unrelated reasons. For instance, if global population eventually collapses or stabilizes not because of starvation or resource scarcity but because of cultural shifts, economic incentives, and the widespread availability of contraception driven by female empowerment, the outcome might look Malthusian in terms of population limits, but the cause is entirely non-Malthusian. Here, the demographic transition is driven by education and urbanization rather than by resource scarcity. If the population eventually hits a ceiling, it is due to sociological convergence rather than biological pressure meeting agricultural limits. In this scenario, the quantitative prediction might eventually be vindicated, but the theory itself was wrong about the why. This variety does not deserve the label right but early in any meaningful epistemic sense because the causal model failed to capture the actual drivers of the system. It qualifies only as a coincidental hit, where the theory guessed the destination correctly but drew the wrong map.

  Analyzing whether both varieties deserve the label right but early reveals that only mechanism-preserving rescue qualifies as a vindication of the original theory. A theory is not merely a prediction of a number; it is an account of the forces that produce that number. If the forces change, the theory has been falsified even if the number eventually matches. This distinction implies significant consequences for the epistemic value of long-run predictions that suffer intermediate falsification. If we accept mechanism-substituting rescues as valid confirmations, we degrade the informational content of our theories, allowing vague prophecies to claim credit for outcomes they did not explain. However, if we recognize mechanism-preserving rescues, we acknowledge that some structural forces operate on timescales that exceed our immediate observation windows, masked by temporary noise or one-off interventions. The epistemic value lies in the persistence of the causal pressure, not just the eventual arrival of the crisis.

  This analysis engages seriously with the rationalist concern about predictive discipline and epistemic hygiene regarding whether we permit too liberal a regime of temporal delay and post-hoc rescue. If we allow theorists to indefinitely push the goalposts of when a prediction must come true, we risk rendering long-run theories practically unfalsifiable and weakening our outside-view calibration. A theory that predicts a crisis in 1900, then 2000, then 2100, without specifying what conditions would definitively prove it wrong, becomes a belief system rather than a scientific model. It accumulates no risk and therefore earns no credit. This violates the principle that meaningful predictions must expose themselves to the possibility of failure. If every falsification can be explained away as a delay caused by some new variable, the theory loses its power to constrain our expectations about the world. We must demand that a right but early claim includes a specification of the delaying mechanism and a bound on how long that delay can last before the theory is discarded.

  Conversely, if we reject all forms of rescue categorically, we risk discarding theories that genuinely capture slow-moving structural forces which are merely masked by temporary noise. Some variables operate on centuries-long timescales, and human history is often too short to provide a clean signal without significant noise. Agricultural productivity gains, for example, might be a temporary spike in a long-term trend of diminishing returns. If we discard the Malthusian insight solely because it missed the twentieth century, we might blind ourselves to the possibility that the underlying biophysical constraints remain valid even if the social mechanisms have adapted. Epistemic hygiene requires a balanced approach where we distinguish between a theory that is flexible enough to accommodate new data about timing and a theory that is so flexible it accommodates any data whatsoever. We must ask whether the rescue operation adds new testable implications or merely protects the core claim from refutation.

  Ultimately, the judgment of whether a theory is right but early depends on the integrity of the causal mechanism through the period of delay. In the Malthusian case, if the eventual constraint on population is shown to be resource scarcity rather than voluntary choice, the mechanism-preserving rescue holds, and the theory was merely premature. If the constraint is voluntary choice driven by factors unrelated to subsistence limits, the theory was wrong, and any match in outcomes is coincidental. For the rationalist community focused on calibration, this means that scoring rules for long-run forecasts must penalize timing errors heavily unless the mechanism is proven to remain intact. We cannot award full credit for a hit that arrives late for the wrong reasons. To maintain predictive discipline, we must treat the mechanism as part of the prediction itself. A theory that gets the number right but the mechanism wrong is not a successful theory; it is a lucky guess. Therefore, the label right but early should be reserved strictly for mechanism-preserving rescues where the causal architecture survives the interim falsification, ensuring that our confidence in long-run structural forces is based on explanatory depth rather than retrospective pattern matching.
