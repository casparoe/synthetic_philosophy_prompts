answer: |-
  **JOURNAL OF CONJECTURAL BIOLOGY: NOTICE TO CONTRIBUTORS**

  **1. Submission Tracks and Demarcation**
  Manuscripts must be submitted under one of two classifications. Type-T (Testable) papers propose universal laws admitting potential refutation. Type-M (Metaphysical Research Programme) papers organize research heuristically but lack strict falsifiability. Type-M papers are published in a separate section and must carry the following boilerplate footnote: "This contribution constitutes a metaphysical research programme; it is rationally criticizable but not empirically testable." Type-M papers may not claim evidentiary support. Authors attempting to submit Type-M content as Type-T will be rejected without review.

  **2. Vocabulary of Corroboration**
  Contributors are prohibited from using confirmationist vocabulary. Terms such as "support," "confirm," "probability," "likelihood," and "Bayesian" are strictly forbidden throughout the text and abstract. Authors must instead report the "degree of corroboration" assigned to a hypothesis following severe testing. Statistical claims must refer to error rates, not degrees of belief. Any manuscript suggesting a hypothesis has been rendered "more probable" by data will be returned for linguistic correction.

  **3. Definition of Fitness**
  To avoid tautology, fitness must be defined independently of survival or reproductive success. Acceptable definitions refer to metabolic efficiency, structural integrity, or thermodynamic stability. Any manuscript defining fitness solely by actual survival will be rejected as empty. Authors must demonstrate that high fitness does not logically entail survival in the proposed model. If fitness is defined by survival, the central claim says nothing and cannot be tested.

  **4. Prohibition Statement and Boldness**
  Every Type-T submission must include a "Prohibition Statement" nominating a specific observation that would refute the central hypothesis. This observation must not yet have been made; retrofitted predictions are inadmissible. Authors must also submit a Boldness Statement scored on the Content–Risk Index. Scientific worth rises with antecedent improbability. Safe hypotheses receiving high corroboration are valued less than risky hypotheses surviving severe tests. Low-risk submissions will be deprioritized regardless of data quality.

  **5. Auxiliary Hypotheses and Historical Narratives**
  Auxiliary hypotheses used to protect a core theory from refutation must be registered prior to testing. Hypotheses filed afterward count as conventionalist stratagems and will be flagged as immunizing moves. Singular historical hypotheses (e.g., "the ornament of taxon X evolved because...") are not laws and thus not testable. Authors are recommended to recast these as situational analyses, stating the organism's problem situation and deriving the trait as the rational solution. Narrative explanations without derived laws are classified as Type-M.

  **6. Editorial Stance on Demarcation**
  The Board adheres to Karl Popper's earlier formulation regarding Darwinism. While later concessions acknowledged testability, the Board holds that the later recantation is itself less falsifiable than the earlier critique. Therefore, the earlier, harsher criterion remains the scientific standard for this journal. Consistency requires we treat the softer view as metaphysical. Authors citing the later concession as grounds for relaxed standards will be referred to this clause.

  **7. Worked Example of Compliance**
  *Submitted Abstract:* "We confirm that the spotted wings of the *Nebula moth* evolved to support predator avoidance, as survival rates were higher in spotted populations. This probability suggests strong adaptation."
  *Compliant Rewrite:* "We propose the *Nebula moth* wing spot solves a camouflage problem situation. Fitness is defined via reflectance metrics independent of survival. Refutation would occur if spotted moths are eaten more frequently in future trials. The hypothesis survives this test with high degree of corroboration. No Bayesian methods were employed."

  > **Author's Appeal**
  > "I protest the rejection of my manuscript on *Drosophila* fitness. You claim my definition is tautological because I linked fitness to reproductive output. This is standard practice in the field. To define fitness without survival renders the theory unrecognizable to biologists. You are demanding we solve the philosophical problem you claim is unsolvable. If I define fitness structurally, you say it lacks biological relevance. If I define it by survival, you say it is empty. This policy paralyzes research rather than guiding it. Furthermore, the Content–Risk Index penalizes established models. I request a waiver based on high citation potential despite metaphysical status."
  >
  > [Editor's Reply: The contradiction you describe indicates a defect in your hypothesis, not the policy. A theory that cannot define its central term without circularity is metaphysical. Resubmit as Type-M or redefine fitness via thermodynamic stability.]
