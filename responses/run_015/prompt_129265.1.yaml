answer: |-
  # Q&A Prep Sheet: Wild Invertebrate Welfare & Epistemic Asymmetry

  **Talk Context:** Interdisciplinary Workshop on Wild Animal Ethics
  **Your Core Claim:** The "Scale Argument" (many insects $\times$ low $P(\text{sentience})$) fails without accounting for error asymmetry. We need a precautionary weighting framework where low-confidence sentience weighs differently for harm-reduction vs. benefit-conferring interventions.

  ---

  ### Part 1: Upfront Concessions
  *Say these early in the Q&A or weave them into your opening remarks to disarm the room.*

  1.  **Admit the "Distraction" Risk:** Acknowledge that focusing on wild invertebrates *can* drain resources from high-confidence causes (like farmed vertebrates) if not strictly constrained by your framework. You aren't arguing for *equal* priority, just *different* decision rules under uncertainty.
  2.  **Admit Biological Ignorance:** Concede you are not a neurobiologist. You are arguing from a decision-theoretic perspective *given* uncertainty, not making a positive claim about insect neuroanatomy.
  3.  **Admit Non-Neutrality:** Acknowledge that your framework inherently biases toward inaction (status quo) when confidence is low, unless the intervention is strictly harm-reducing. This is a feature, not a bug, but it needs to be stated.

  ---

  ### Part 2: The Objections (In Likely Order)

  #### 1. The Neurobiologist (The Foundation Attack)
  **The Objection:** "You're building a ethical framework on a biological maybe. We know insects lack a thalamocortical loop and the specific neural integration required for phenomenal consciousness. If the hardware isn't there, the probability of sentience isn't 'low,' it's effectively zero. Why build a precautionary principle for a ghost?"
  **Your Reply:** "I'm not claiming the probability is high, only that it's non-zero and epistemically opaque. Neuroscience gives necessary conditions, but we lack sufficient conditions for consciousness. My framework is designed precisely for that zone of opacity where biology can't yet rule out experience."
  **Weakest Point:** If they cite a specific 2023 paper establishing a hard neural cutoff for valenced experience, you have no empirical rebuttal. You have to retreat to "philosophical possibility," which sounds weak to a scientist.

  #### 2. The Decision Theorists (The Methodology Attack)
  **The Objection:** "This sounds like you're just hacking the Expected Value (EV) equation. If harm-reducing interventions have higher weight, why not just adjust the utility value in the standard calculation? Why do we need a separate 'weighting framework' based on confidence levels? It looks like double-counting uncertainty."
  **Your Reply:** "Standard EV treats a 1% chance of suffering the same regardless of intervention type. I'm arguing the *cost of error* differs. A false positive in benefit-conferring (e.g., adding bugs) wastes resources; a false negative in harm-reducing (e.g., ignoring pesticide death) creates unmitigated suffering. The asymmetry is in the moral cost of the mistake, not the probability itself."
  **Weakest Point:** They are right that this *could* be modeled in standard EV by tweaking the utility function. If you insist it *requires* a new framework, you might look like you don't understand basic decision theory.

  #### 3. The Moral Philosophers (Farmed Animal Focus) (The Opportunity Cost Attack)
  **The Objection:** "Even if your math works, this is a strategic disaster. Wild invertebrate welfare is a black hole for resources. By legitimizing low-confidence interventions, you're giving activists permission to divert attention from factory farming, where we know suffering is real and massive. Isn't this ethical negligence?"
  **Your Reply:** "My framework actually restricts wild interventions. By requiring higher confidence for benefit-conferring actions, it discourages speculative projects. It only strongly mandates action on harm-reduction where the human cause is direct (e.g., pesticide regulation), which doesn't necessarily compete with farmed animal advocacy."
  **Weakest Point:** Activists don't follow nuanced frameworks. If you give them the phrase "insect welfare," they will use it to justify anything. You can't control the movement's resource allocation.

  #### 4. The Grad Student (The "Too Conservative" Attack)
  **The Objection:** "You're using epistemic humility as a shield for inaction. If there's a non-zero chance these shrimp/insects are suffering, and the scale is massive, shouldn't we act *more* aggressively, not less? Why does the uncertainty make you cautious rather than urgent?"
  **Your Reply:** "Because uncertainty cuts both ways. Intervening in complex ecosystems risks causing *more* suffering (e.g., population booms after predation removal). Without high confidence in sentience *and* ecological outcomes, aggressive intervention is morally reckless. Humility demands we prioritize stopping direct harm over engineering nature."
  **Weakest Point:** This sounds like status quo bias. If the status quo is mass death by pesticides, "reckless" intervention might still be better than "cautious" complicity.

  ---

  ### Part 3: The Dreaded Question
  *Keep this in your back pocket. Do not bring it up yourself.*

  **The Question (Likely from the Grad Student or a Provocative Philosopher):**
  "Does your framework imply we should vaccinate mosquitoes against malaria parasites to reduce *their* suffering, or does it imply we should eradicate them to reduce *human/animal* suffering? If you say 'neither,' aren't you admitting this is just theoretical navel-gazing?"

  **Your Reply:**
  "It implies we should prioritize harm-reduction where humans are the direct cause. Eradication is a benefit-conferring intervention for humans but a harm-conferring one for mosquitoes. Under my framework, the low confidence in mosquito sentience combined with the high confidence in ecological disruption means eradication fails the precautionary test. Vaccination is theoretically better but practically infeasible. The point isn't to solve every edge case today, but to set the decision rule for when we *do* have the tech."
  **Weakest Point:** It's a dodge. You know it, they know it. It highlights that your theory might paralyze decision-making in high-stakes vector control scenarios.

  ---

  ### Part 4: Survival Tips

  *   **If they gang up:** If the Philosophers and Decision Theorists start talking over each other, pause and say: "I think we have two different definitions of 'risk' on the table. Let's settle that first."
  *   **If the Neurobiologist gets heated:** Defer to them. "You're the expert on the hardware; I'm just trying to map the software ethics assuming the hardware might be there."
  *   **The "So What?" Check:** If anyone asks why this matters, pivot to **policy**. "This isn't just about bugs; it's about how we regulate pesticides and land use when the victims can't scream."

  Good luck. Don't let them force you into a binary "They are/aren't sentient" trap. Stay in the uncertainty.
