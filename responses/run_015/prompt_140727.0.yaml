answer: |-
  **Elena:** Let's stick to the clinic case. Technician chooses Embryo B over A. B has a better life. A is discarded. I'm saying the technician benefits the resulting child.

  **Marcus:** We've been over the baseline. If she chooses A, B never exists. If she chooses B, A never exists. Neither is worse off than they would otherwise have been. Both have lives worth living. On what grounds is anyone harmed?

  **Elena:** Because the *number* is fixed. One child either way. In fixed-number cases, we can compare the welfare of the person who exists in outcome one with the welfare of the person who exists in outcome two. We have person-affecting reasons to pick the candidate who will have the better life.

  **Marcus:** That's the "fixed-number exception," and it's unstable. Consider the wheel. The technician can pick B directly, or spin a weighted wheel that's 80% likely to select B. If your reason is that B is benefited by being picked, why does interposing the wheel change the moral geometry? The same possible people are in the mix. The probabilities are identical.

  **Elena:** Because the *basis* of the selection changes. If I pick B directly, I'm selecting *for* B's welfare. If I use the wheel, I'm selecting for *fairness* or *procedural neutrality*. The reason attaches to the agency, not just the outcome.

  **Marcus:** That sounds like identity laundering. You're trying to wash out the non-identity problem by changing the procedure, but the metaphysical facts remain. If the moral reason is truly person-affecting—"I do this for *her* sake"—then randomizing should dilute that reason. But you still prefer the wheel yields B most of the time. Why?

  **Elena:** Because I have an ex ante duty to the *candidates*. Both embryos stand in a relation of potentiality. I owe it to the pool of candidates to maximize their expected welfare.

  **Marcus:** Now you've slipped. "Expected welfare of the pool" isn't person-affecting. That's impersonal value dressed up. There is no "pool" that feels pain or joy. There are only specific individuals who might exist. If you're maximizing expected value across possible persons, you've abandoned the person-affecting restriction. You're just a utilitarian who's afraid to admit it.

  **Elena:** I'm not maximizing total value. I'm respecting the claims of possible people. But fine, let's push it. Suppose the technician could split Embryo B into twins. Two lives, both worth living, both slightly less good than the single B life due to resource dilution, but still net positive. Do I have a reason to split?

  **Marcus:** Do you? If your view is that we should benefit the candidate in fixed-number cases, does "fixed number" apply here? If you can create two instead of one, have you changed the number?

  **Elena:** Yes. So my view says the non-identity problem *does* bite here. I don't have a duty to create the twins.

  **Marcus:** But why not? If you owe it to the candidates to maximize expected welfare, why does the count matter? If Twin 1 and Twin 2 have lives worth living, why aren't you benefiting them by creating them? Your fixed-number exception seems to rely on a arbitrary line. If I can benefit someone by creating them, why is creation different from selection?

  **Elena:** Because there's no subject to be benefited *before* they exist. In the selection case, the embryos are physically present. They are distinct entities waiting in the dish.

  **Marcus:** They're cells, Elena. They aren't persons. You're granting them moral status because they're *there*, but metaphysically, they're no different than the gametes in the freezer you chose not to use. You're letting physical proximity do the work that identity logic should do.

  **Elena:** It's not proximity. It's the fact that in the selection case, someone *will* exist. In the creation case, someone *might*. But I'll concede this: if I accept the wheel argument—that expected welfare matters across candidates—I can't consistently deny that creating the twins is good. I don't have to say it's obligatory, but I have to admit the reason is impersonal. The "benefit" isn't to a specific person who can claim it.

  **Marcus:** That's progress. You're admitting that once probabilities or numbers shift, your person-affecting story collapses into impersonalism.

  **Elena:** I'm admitting the boundary is fuzzier than I wanted. But you're not off the hook. If no one is harmed in the embryo case, and the reason to pick B is purely impersonal—say, maximizing total welfare—then what grounds the *urgency*? If I pick A, I haven't wronged A. I haven't wronged B. I've just made the world slightly less good. That feels like a category error. Procreative duties feel like duties *to* someone.

  **Marcus:** I'll concede that. The impersonal view captures the *value* of the outcome, but it struggles to capture the *obligation*. It makes the technician's duty feel like aesthetic preference—like choosing a nicer painting—rather than morality. If there's no victim, the "ought" loses its grip.

  **Elena:** Exactly. So my fixed-number view tries to preserve the grip. Even if the metaphysics are messy, it matches the phenomenology of deliberation. I feel like I'm deciding *for* a child.

  **Marcus:** But feelings aren't facts. If you preserve the grip by positing a victim who isn't actually harmed, you're building morality on a fiction. Though... if I admit the impersonal view lacks grip, I have to explain where the duty comes from. Maybe it's not about harm, but about the agent's character. A technician who picks A displays a vice.

  **Elena:** So the harm is to the technician's moral integrity?

  **Marcus:** In a sense. Or perhaps the duty is to the value of welfare itself, not the bearer. But I'll grant you this: if I can't explain why the technician feels bound *to the child*, my view leaves a motivational gap. It explains why B is better, but not why the technician must care.

  **Elena:** And I'll grant you this: my view can't distinguish the embryo case from the twin case without smuggling in impersonal value. If I care about expected welfare for candidates, I can't stop at fixed numbers. So the non-identity problem isn't solved by fixing the count; it's just delayed.

  **Marcus:** So we're both stuck. You have the grip without the metaphysics; I have the metaphysics without the grip.

  **Elena:** Seems like the handout writes itself. "Here's why you're both unhappy."

  **Marcus:** Perfect. That's what grad school is for.
