  **The Scene**

  Elias stood in the utility closet, the smell of dust and drywall thick in the air. The fixture in the kitchen needed replacing, and the house was old enough to demand caution. He opened the breaker panel. Rows of switches stared back, most labeled in fading ink. *Kitchen*, read the tape on the third one down. It was flipped firmly to the left.

  He knew the layout. Switch left meant circuit open. Circuit open meant no current. He didn't need to test the wire; the geometry of the box guaranteed it. If the switch was left, the metal inside was disconnected. If disconnected, the wire was dead.

  He reached for his multimeter, then stopped. It was in the truck. Going back out would cost twenty minutes. He looked at the switch again. It was solid, plastic, unmoving. He had seen switches fail before, but never like this—never stuck in the off position while live. That was a ghost story. This was a house, not a trap.

  "Switch is down," he said to the silence. "So it's dead."

  He took the wire strippers from his belt. He needed to cut the old copper back to fresh metal before splicing the new fixture. If there were voltage, the strippers would arc. If there were none, he'd save the trip. The stakes were fingers versus convenience. He trusted the lever. He trusted the entailment. He positioned the jaws around the black wire and squeezed.

  ***

  **Compact Apparatus**

  *   **P:** The circuit is interrupted at the breaker.
  *   **Q:** The wire is not live.
  *   **M:** Visual inspection of the switch lever position.
  *   **Grain:** Coarse. M is "looking at the lever," not "looking at the lever and verifying internal linkage." The verdict depends on this; if M included verifying linkage, he would track Q.
  *   **Tracking P:**
      *   *Truth:* P is true.
      *   *Belief:* Elias believes P via M.
      *   *Variation (~P):* Nearest ~P world is one where the circuit is closed (switch flipped). In this world, the lever is right. M delivers ~Bel(P). **Holds.**
      *   *Adherence (P):* Nearest P world is actual. M delivers Bel(P). **Holds.**
      *   *Verdict:* Elias knows P.
  *   **Tracking Entailment (P→Q):**
      *   Substantive. He understands the physics. Worlds where P is true and Q false (bypass) are remote but not logically impossible. He tracks the conditional because in nearest ~ (P→Q) worlds (weird physics), he wouldn't believe the entailment.
  *   **Tracking Q:**
      *   *Truth:* Q is true.
      *   *Belief:* Elias believes Q via deduction from P.
      *   *Variation (~Q):* Nearest ~Q world is one where the wire is live despite the switch (internal bypass/fault). In this world, the lever is still left (fault is internal). M delivers Bel(P), thus Bel(Q). **Fails.**
      *   *Verdict:* Elias does not know Q.
  *   **Single Feature:** The nearest ~Q world (internal fault) is further from actuality than the nearest ~P world (switch flipped), but in the ~Q world, M yields a false positive.
  *   **Removal:** If the nearest ~Q world were also the nearest ~P world (i.e., the only way for the wire to be live is for the switch to be up), he would track Q and know it.

  ***

  **Attacks and Answers**

  1.  **Method Individuation:** *Verdict is an artifact of grain.* If M is "visual inspection of the breaker system," he fails to know P (system could be mislabeled). If M is "looking at the lever," he knows P but not Q.
      *   *Answer:* True. Nozickian knowledge is sensitive to method description. The scene relies on the reader accepting "looking at the lever" as the natural method for "breaker is off."
  2.  **Skepticism Disguised:** *Any locally undetectable falsifier is skepticism.* The "internal bypass" is a brain-in-a-vat for electricians.
      *   *Answer:* This succeeds. There is arguably no non-skeptical closure failure on tracking accounts. Every case requires a ~Q world where P is false but undetected. The "broken wire" is just a skeptical hypothesis with a voltage rating. I minimize resemblance by making the fault mechanical and rare, not global or demonic.
  3.  **Inheritance:** *Deduction inherits tracking.* If he tracks P and knows P→Q, he tracks Q.
      *   *Answer:* False on Nozick's view. Tracking is not closed. The counterfactual dependence breaks because the method M is sensitive to switch position (~P) but insensitive to internal bypass (~Q), even though both make P false.

  ***

  **Craft Note**

  To land the effect, the narration must treat the internal fault as *possible but remote*. Do not name it. If Elias thinks, "It could be bypassed," he saliently brings the ~Q world closer, potentially restoring knowledge (by making the method insensitive to P as well). The reader must feel the reliability of the switch without being reminded of the exception. The unused multimeter is crucial: it signals that checking Q was available but deemed unnecessary, reinforcing that his ignorance of Q is structural, not negligent. You must cheat slightly by ensuring the house is old enough to justify the fault's existence but reliable enough to justify his confidence; if the house is too sound, the ~Q world is too remote to matter; if too unsound, he doesn't know P.
