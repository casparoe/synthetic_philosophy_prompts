prompt: |-
  I've been figting with my friend for like three hours about akrasia and hyperbolic disounting and I'm pretty sure neither of us knows what we're actually demanding from a theory. So I want the full checklist: what does an adequate account of weakness of will have to deliver? Not just 'explain why people smoke,' but the real spec. It needs to cover the classic cases where you act against your own present all-things-considered judgment, but it also has to draw sharp lines between real weakness, compulsion, addiction, and rational preference reversal — and it can't just invoke a hyperbolic curve and declare victory, because that explains why preferences shift across time, not why you feel torn in the single moment of choice. Here's the part I think gets ignored: the theory should preserve the first-person sense of internal struggle, the feeling that parts of me are at odds, without treating my present self and future self as literally separate agents playing a bargaining game, since that dissolves the problem into intertemporal game theory and erases the very struggle it's supposed to explain. It also needs to square with the neuroscience on prefrontal inhibition without reducing normative failure to a mere brain glitch — weakness has to be something you can be blamed for, not just a mechanical malfunction. Flag which of these are genuinely non-negotiable hard constraints and which are just preferences of particular camps (like do we need determinism? empirical equivalence with Ainslie's intertemporal model? no hidden mental states?). And tell me straight if some subset is jointly unsatisfiable — maybe preserving a unitary self for the phenomology conflicts with the divided-self structure hyperbolic discounting seems to require? Don't lay out five rival theories and leave me hanging; take a definite stance on which desiderata are load-bearing and which ones should be dropped if they clash. I'm writing this up for a philosophy of action seminar and I'm sick of fence-sitting answers that just say Davidson thinks X but the economists think Y.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Weakness of Will (Akrasia) and Hyperbolic Discounting.
      *   **Goal:** A definitive checklist of what an *adequate account* must deliver (the "spec").
      *   **Key Constraints/Desiderata:**
          *   Explain acting against present all-things-considered (ATC) judgment.
          *   Distinguish weakness from compulsion, addiction, and rational preference reversal.
          *   Avoid *just* invoking hyperbolic discounting (explains time-shift, not moment-of-choice struggle).
          *   Preserve the first-person sense of internal struggle (phenomenology).
          *   Avoid treating present/future selves as separate agents (no dissolving into intertemporal game theory).
          *   Square with neuroscience (prefrontal inhibition) without reducing normativity to brain glitches (must allow for blame/responsibility).
          *   **Crucial:** Flag which constraints are non-negotiable vs. camp preferences.
          *   **Crucial:** Identify if any constraints are jointly unsatisfiable.
          *   **Crucial:** Take a definite stance. No fence-sitting ("Davidson says X, economists say Y").
      *   **Context:** Philosophy of Action seminar paper.
      *   **Tone:** Direct, rigorous, analytical, no fluff.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Socratic/Intellectualist Challenge:* How can one know the better and do the worse? (Davidson's solution: non-conditional judgment).
      *   *The Economic/Behavioral Challenge:* Hyperbolic discounting explains *preference reversal* over time, but does it explain *akrasia* (acting against *current* ATC judgment)? Usually, standard hyperbolic models say at time $t$, the agent *prefers* the smaller-sooner reward. If they prefer it, is it really weakness? Or just rational maximization of current utility?
      *   *The Phenomenological Challenge:* The feeling of conflict. If I'm just maximizing utility (even hyperbolically), where is the struggle?
      *   *The Responsibility Challenge:* If it's a brain glitch (inhibition failure), am I blameworthy? If it's a separate self, who is to blame?

  3.  **Evaluate the User's Constraints:**
      *   *Constraint 1: Act against present ATC judgment.* (Non-negotiable for akrasia. If you act on ATC, it's strength. If ATC changes, it's preference reversal).
      *   *Constraint 2: Distinguish from compulsion/addiction.* (Non-negotiable. Compulsion removes control; akrasia implies control but failure to use it).
      *   *Constraint 3: Phenomenology of struggle.* (High priority for philosophy of action, but maybe reducible in strict economic models. User wants to keep it).
      *   *Constraint 4: Unitary Self (No separate agents).* (Non-negotiable for moral responsibility. If selves are separate, blame dissolves).
      *   *Constraint 5: Neuroscience compatibility without reductionism.* (Tricky. Needs supervenience without elimination).
      *   *Constraint 6: Blameworthiness.* (Non-negotiable for the normative concept of weakness).

  4.  **Identify the Tension/Conflict:**
      *   *The Big Clash:* Hyperbolic Discounting (HD) + Unitary Self + Blameworthiness.
      *   *Why?* Pure HD suggests that at the moment of choice, the agent *rationally* maximizes their discounted utility function. If the curve is steep, the cigarette *is* the rational choice at $t_0$. If it's the rational choice, it's not weakness (acting against judgment), it's just changing preferences.
      *   *To save Akrasia:* You need a distinction between *evaluative judgment* (what is best overall) and *motivational force* (what I want now). HD blurs this by making "what I want now" the definition of value at $t_0$.
      *   *To save Unitary Self:* You can't say "My future self wanted health, my present self wants smoke." You must say "I want health, but I am overpowered by smoke."
      *   *To save Blame:* You need control. If neuroscience says "prefrontal cortex failed," is that an excuse? Only if we treat the PFC as the *mechanism of agency*, not an external constraint.

  5.  **Formulate the Stance:**
      *   I need to tell the user what *must* be kept and what *must* go.
      *   *Must Keep:* The distinction between ATC judgment and motivational force (Davidson's core insight). The Unitary Self (for responsibility).
      *   *Must Drop/Modify:* The idea that Hyperbolic Discounting *alone* explains akrasia. HD explains the *temptation structure*, not the *akratic action*. HD is the background condition, not the sufficient cause.
      *   *Must Resolve:* The Neuroscience tension. We must adopt a "mechanism of agency" view where neural inhibition failure *is* the failure of will, not an excuse, provided the agent had the capacity to engage the mechanism.
      *   *The Hard Truth:* You cannot have a purely economic model (HD) *and* a robust normative concept of weakness *and* a unitary self without adding a dual-process psychological layer (System 1 vs. System 2) that maps onto the Unitary Self.

  6.  **Drafting the Checklist (Iterative Process):**
      *   *Item 1: The Judgment-Action Gap.* Must explain acting against *current* ATC. (Hard constraint).
      *   *Item 2: The Synchronic Struggle.* Must explain the conflict at $t_0$, not just diachronic inconsistency. (Hard constraint per user).
      *   *Item 3: Control Condition.* Must distinguish from compulsion. (Hard constraint).
      *   *Item 4: Normative Accountability.* Must allow blame. (Hard constraint).
      *   *Item 5: The Self.* Must be one agent. (Hard constraint per user).
      *   *Item 6: HD Role.* HD is necessary but not sufficient. (My stance).

  7.  **Addressing the "Jointly Unsatisfiable" Question:**
      *   Is there a contradiction? Yes, between "Pure Hyperbolic Discounting explains Akrasia" and "Akrasia is acting against ATC judgment."
      *   *Resolution:* HD explains why the temptation is strong. It does not explain why the agent *judges* the temptation to be worse yet *chooses* it. For that, you need a dual-process architecture where System 1 (impulse) overrides System 2 (judgment), but System 2 *is* the agent's true voice.
      *   *The Sacrifice:* You have to drop the idea that "preference = choice." In akrasia, choice diverges from revealed preference (if preference is defined by ATC judgment).

  8.  **Refining the Neuroscience/Blame Tension:**
      *   If PFC inhibition fails, is it a glitch?
      *   *Stance:* It is a glitch in the *hardware*, but if the hardware constitutes the *will*, the failure is the will's failure. Blame attaches to the failure to maintain the system (cultivate habits, avoid triggers). This is the "responsibility for character" move.

  9.  **Finalizing the Output Structure:**
      *   **Executive Summary:** Direct answer to the "spec."
      *   **The Non-Negotiables (Hard Constraints):** What makes it akrasia and not something else.
      *   **The Negotiables (Camp Preferences):** What can be sacrificed.
      *   **The Conflict & Resolution:** Where the theories clash and how to fix it.
      *   **The Verdict:** What theory structure actually works.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I fence-sit? *Correction:* Be stronger. Say "HD is insufficient."
      *   *Check:* Did I address the "separate agents" issue? *Correction:* Explicitly reject the "multiple selves" model as incompatible with blame.
      *   *Check:* Did I address the neuroscience? *Correction:* Frame it as "constitutive mechanism" not "external cause."
      *   *Check:* Is the tone right? *Correction:* Keep it academic but punchy. No "some philosophers say."

  11. **Final Polish:** Ensure the distinction between *Diachronic* (time inconsistency) and *Synchronic* (moment of choice) is clear, as this is the crux of the user's frustration with HD. (HD solves Diachronic; Akrasia is Synchronic).

  *(Self-Correction Note)*: Wait, I need to be careful about "Blame." Some compatibilists argue blame is compatible with determinism. The user asked if determinism is a hard constraint. I should flag that *Libertarian Free Will* is not required, but *Control* is. I will classify "Libertarian Freedom" as a camp preference, but "Agency/Control" as a hard constraint.

  *(Refining the HD point)*: Ainslie's model *does* try to explain the struggle via bargaining between selves. The user explicitly rejects this ("erases the very struggle"). So I must argue that Ainslie's specific *interpretation* (bargaining) is the problem, not necessarily the discount function itself, but the discount function alone cannot explain the *normative* failure.

  Okay, ready to write. The stance will be: **Dual-Process Agency with a Unitary Evaluator.** HD provides the *shape* of temptation, but a structural division within a single agent (Judgment vs. Impulse) is required to explain the *action*.

  Let's organize the "Spec" into:
