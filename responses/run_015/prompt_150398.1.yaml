      *   *Decision:* The break is in **(1)**.
      *   *Why:* It conflates *ontological inertia* with *inductive reliability*. Induction requires stable *relations*, not stable *relata*.
      *   *Cost:* You lose the clean "Human Kinds vs. Natural Kinds" distinction based on *mutability*. You replace it with "Interactive Kinds vs. Indifferent Kinds" (Hacking's actual distinction) where *both* support induction, but interactive kinds require dynamic models.
