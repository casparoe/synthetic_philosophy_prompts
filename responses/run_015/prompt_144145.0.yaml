answer: |-
  ### 1. Brainstorming and Candidate Elimination

  Before settling on a classification, I need to test the standard vocabulary of social ontology against the specific constraints you've laid out. The core tension in your cases is the persistence of a *normative* "ought" (the residue, the disapproval) after the disappearance of the *instrumental* "why" (the coordination problem).

  Here are the nearest candidates from the literature, and why they fail to capture the phenomenon precisely:

  *   **Lewisian Convention:**
      *   *Fit:* High on regularity and expectation.
      *   *Fail:* Lewis (1969) defines a convention as a solution to a *recurrent coordination problem*. It is an equilibrium where everyone conforms because they expect others to conform, *and* because everyone prefers to conform given that others do (to avoid coordination failure). In your cases, the coordination problem is extinct. There is no payoff to coordinating. Strictly speaking, on a Lewisian reading, these are **not conventions**. They are "convention-shaped" regularities.
  *   **Bicchieri's Social Norm:**
      *   *Fit:* High on empirical expectations (everyone does it) and normative expectations (everyone thinks one ought to do it).
      *   *Fail:* Bicchieri (2006) requires that preferences for conformity be *conditional* on these expectations. Usually, this conditionality is grounded in avoiding sanctions or achieving a goal. In your cases, the "sanction" is a shrug, and the goal is absent. While Bicchieri allows for norms that are not morally grounded, her framework struggles to explain why the conditional preference persists when the *consequences* of violating the norm are known to be negligible. It treats the norm as a constraint on the utility function, but doesn't fully account for the *historical ghost* aspect—the fact that everyone knows it *used* to have a point.
  *   **Akerlof's Social Custom:**
      *   *Fit:* Very High. Akerlof (1980) models behaviors that persist despite having no economic function, sustained solely by the utility loss of deviating from the majority (social disapproval).
      *   *Fail:* Akerlof's model treats the disapproval as a *payoff* (a cost). Your description suggests the disapproval is a *symptom* of the norm, not necessarily the *engine* that rationally sustains it. You note that "the mild reaction does not seem aimed at changing behaviour." In Akerlof's model, the reaction *must* be effective enough to sustain the equilibrium. Your cases feel more fragile, more like a "ghost" than a stable equilibrium of social utility. However, this is the closest game-theoretic handle we have.
  *   **Ogburn's Cultural Lag:**
      *   *Fit:* High on the evolutionary/historical aspect. Ogburn (1922) describes non-material culture (norms) persisting after material conditions (the need for the norm) have changed.
      *   *Fail:* This is a sociological description of *change*, not an ontological definition of the *state*. It explains *why* it's there (lag), but not *what* it is (the normative residue).
  *   **Searle's Constitutive Rule:**
      *   *Fit:* High for Case 3 (minutes). "Reading minutes counts as holding a proper meeting."
      *   *Fail:* Fails for Case 1 (pause) and Case 2 (CC'ing). Pausing doesn't constitute "giving a talk." CC'ing doesn't constitute "sending email." The phenomenon is broader than constitutive rules.

  **Verdict:** There is no single canonical term in the Lewisian or evolutionary tradition that captures the *normative residue* of a *functionless* regularity without reducing it to either a "habit" (no norm) or a "custom" (stable payoff). The literature usually assumes that if the function dies, the norm either vanishes or transforms into a sanction-based custom. Your cases occupy a gap: **normativity without function, and without robust sanctions.**

  ### 2. Lewisian Classification: The "Extinct Equilibrium"

  How should the Lewis-style apparatus classify these?

  On a strict reading, **they are not conventions.** Lewis is explicit: a convention is a solution to a coordination problem. If the problem dissolves (e.g., the senior professor retires, the admin role is automated), the equilibrium dissolves. The behavior becomes a **mere regularity**.

  However, classifying them as "mere regularities" throws away the data you care about: the *normative residue*. If I tap my foot during a talk, that is a mere regularity (or irregularity). No one says it is "abrupt." If I ask a question immediately, they do. This implies the regularity still carries **deontic force** (an "ought").

  This is a genuine difficulty for a naive Lewisian account, but not for a sophisticated one. The apparatus has resources to handle this, specifically through the concept of **precedent** and **salience**.
  *   **Precedent:** Lewis argues that past conformity creates an expectation of future conformity.
  *   **The Gap:** Lewis assumes the expectation is rational because the coordination problem *recurs*. In your cases, the expectation persists *without* the recurring problem.

  **The Classification:** These are **Vestigial Conventions**.
  They are conventions that have outlived the coordination game that generated them. They are "extinct equilibria" that retain **normative inertia**. The Lewisian account must be amended to acknowledge that the *normative expectation* ("others expect me to do this") can decouple from the *practical rationale* ("doing this helps us coordinate"). The "ought" becomes free-floating. It is no longer a hypothetical imperative ("If you want coordination, you ought to...") but mimics a categorical one ("You ought to..."), albeit weakly.

  ### 3. The Boundary: Vestige vs. Repurposed Signal

  You ask about the variant where the pause acquires a new function (signaling respect). Is this the same phenomenon?

  **No.** This is a crucial ontological boundary.
  *   **Case A (Vestige):** The behavior persists *despite* having no function. The "ought" is a ghost.
  *   **Case B (Repurposed/Signaling):** The behavior persists *because* it has a new function. The "ought" is grounded in a new payoff (social status, avoiding disrespect).

  **How to tell them apart (The Test):**
  Since informants give the same shrug, you cannot rely on introspection. You must rely on **Counterfactual Sensitivity to Information**.

  *   **The Test:** Introduce common knowledge that the behavior is *negatively* viewed by a relevant subgroup, or that it has *zero* symbolic value.
  *   **Prediction for Vestige:** If you publicly announce, "This pause serves no purpose and never did," the practice should weaken or vanish rapidly once the generation that remembers the origin dies out. It is fragile because it lacks a current functional anchor.
  *   **Prediction for Repurposed:** If you announce, "This pause serves no purpose," but the pause *actually* signals respect, the practice will persist because the *signal* works independently of the stated purpose. The payoff (respect) is real even if the explanation is false.

  **The Distinction:**
  *   **Vestigial Convention:** Sustained by *memory of precedent* alone.
  *   **Signaling Convention:** Sustained by *current payoff structure* (even if the payoff is symbolic).

  If abolishing the pause "really would now cost something" (as you posit in the variant), it has ceased to be a vestige and has become a **Signaling Equilibrium**. The shell is the same, but the ontology has shifted from "historical artifact" to "functional tool."

  ### 4. Coining a Term: "Normative Vestige"

  Since "Vestigial Convention" is slightly oxymoronic (a convention implies function), I propose the term **Normative Vestige** for the specific phenomenon of the *residue* itself, and **Vestigial Regularity** for the behavior.

  **Definition:**
  A **Normative Vestige** is a social regularity $R$ in a population $P$ such that:
  1.  **Historical Function:** $R$ originated as a solution to a coordination problem or functional need $F$.
  2.  **Functional Extinction:** $F$ no longer exists, and this is common knowledge in $P$.
  3.  **Behavioral Persistence:** Members of $P$ continue to perform $R$.
  4.  **Normative Residue:** Deviation from $R$ by a member $x$ elicits a normative reaction (criticism, request for excuse, attribution of "rudeness") from $P$, *without* imposing a material sanction or coordination failure.
  5.  **Rational Decoupling:** Members of $P$ cannot cite a current instrumental reason for $R$ when challenged, resorting instead to "this is how it is done."

  **Two Hard Cases at the Margin:**

  *   **Just Inside (The Tipping Case):** In a country where service charges are legally included in the bill, customers still leave small coins on the table.
      *   *Why Inside:* The original function (paying the waiter) is gone (they are salaried/tipped via bill). Deviation (not leaving coins) elicits a look of disapproval ("cheap"), but no material consequence. It is a normative vestige of a tipping convention.
  *   **Just Outside (The Traffic Light Case):** Stopping at a red light at 3:00 AM on an empty road with no cameras.
      *   *Why Outside:* While it looks like a vestige, the coordination problem *still exists* (potential unseen cars, maintenance of the system's integrity, legal sanction). The "ought" is backed by a latent coordination problem and legal sanction. It is a **Dormant Convention**, not a Vestige. A vestige has *no* latent payoff; a dormant convention has a *low-probability* payoff.

  **Evidence of Normativity (vs. Mere Startlement):**
  You asked how to prove the residue is normative ("ought") rather than just surprise ("unexpected").
  *   **The Excuse Condition:** If deviation requires an *excuse* ("Sorry, I didn't realize..."), it is normative. If it requires only an *explanation* ("I did this because..."), it is statistical.
      *   *In your cases:* The junior visitor was described as "abrupt." This implies they owed a deference they failed to pay. That is normative.
      *   *Test:* If I deviate and say "I know the rule, I just chose not to," does the reaction change?
          *   **Startlement:** "Oh, okay, weird."
          *   **Normativity:** "Well, that's inappropriate."
      *   **Prediction for Unanimous Dislike:** If the practice is unanimously disliked (everyone hates the pause) but the residue persists (anyone who skips it is still called "abrupt"), this confirms the **Normative Vestige**. It proves the norm is independent of individual preference (a key feature of norms) and independent of function (since everyone agrees it's useless). This is the strongest evidence that the "ought" has detached from the "want."

  ### Summary for Your Paper

  You are describing **Normative Vestiges**.
  *   **Not** Lewisian Conventions (no coordination problem).
  *   **Not** Akerlofian Customs (sanctions are too weak/expressive rather than utility-based).
  *   **Not** Mere Habits (they carry deontic force).

  They represent a specific failure mode in the evolution of norms: the **decoupling of normative expectation from instrumental rationale**. The Lewisian apparatus classifies them as "extinct equilibria" that persist via **precedent inertia**. The boundary between a Vestige and a Repurposed Signal is determined by **payoff sensitivity**: if the behavior survives the removal of the *belief* in its function, it is a Vestige; if it survives the removal of the *function* itself (because it acquired a new one), it is a Signal.

  Use **Normative Vestige** to carve out this space. It allows you to acknowledge the history (it was once functional), the ontology (it is now functionless), and the phenomenology (it still feels binding).
