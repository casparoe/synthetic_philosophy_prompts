answer: |-
  **MEMORANDUM**

  **TO:** Acquisitions and Ethics Committee, Special Collections Library
  **FROM:** Subcommittee on Archival Ethics and Community Engagement
  **DATE:** October 12, 2023
  **SUBJECT:** Recommendation Regarding the Tenant-Organizing Surveillance Collection (Donor Offer #23-B)

  **I. EXECUTIVE SUMMARY**

  This memo presents the Subcommittee's formal recommendation regarding the proposed donation of the "Tenant-Organizing Surveillance Collection." This collection comprises coercive administrative records generated by landlords during the 1970s displacement campaign (eviction notices, surveillance photography, security logs) and contemporaneous "shadow history" oral reconstructions provided by descendants of the organizers.

  After reviewing the ethical implications of preservation, description, and access, the Subcommittee recommends a **Conditional Acceptance** of the donation. We advise against immediate digitization or standard processing. Instead, we propose a phased implementation plan centered on the establishment of a Community Advisory Board (CAB) to co-steward the materials. This approach seeks to balance the evidentiary necessity of preserving the "shadow histories" against the risk of replicating structural violence through the circulation of surveillance data.

  **II. CONTEXT AND SCOPE**

  The donor offers two distinct textual bodies:
  1.  **The Coercive Archive:** Documents created by antagonists (landlords/management) framing tenant organizers solely as security threats and legal liabilities. The organizers' own papers were destroyed in an arson attack; these records constitute the only surviving documentary trace of the campaign.
  2.  **The Shadow Histories:** Recent oral recordings by descendants attempting to reconstruct the organizers' motivations and voices. These lack contemporaneous documentary corroboration but provide essential counter-narrative context.

  The donor requests "restorative cataloging," wherein metadata and finding aids are reoriented to describe the surveilled subjects as primary agents rather than administrative entries.

  **III. ETHICAL ANALYSIS**

  The Committee's deliberation focused on three competing ethical frameworks.

  **A. The Argument for Restorative Cataloging (Interpretive Repair)**
  Proponents argue that traditional archival "neutrality" is a fallacy that privileges the record creator. By describing a surveillance photo merely as "Subject 4, Eviction Site," the archive replicates the landlord's gaze. Restorative cataloging attempts to correct this power imbalance by embedding context into the metadata (e.g., "Tenant Organizer [Name], targeted during displacement campaign"). This aligns with the *Archives for Black Lives in Philadelphia* anti-racist description protocols, acknowledging that description is an act of power. Without this intervention, the collection serves only as a manual on suppression.

  **B. The Risk of Historical Distortion**
  Opponents within the Committee rightly contend that restorative cataloging risks imposing anachronistic moral categories onto documents never intended to bear them. There is a methodological danger in describing a tenant as an "organizer" in a field generated by a landlord who viewed them as a "trespasser," absent corroborating evidence. If the metadata asserts agency where the document records subjugation, we risk obscuring the brutal reality of the power dynamic. The archive must not sanitize the violence of the record creation process. To describe these documents as anything other than instruments of coercion is to distort the historical mechanism of displacement. Therefore, any descriptive intervention must clearly distinguish between the *function of the record* (surveillance) and the *identity of the subject* (organizer/community member).

  **C. The Case for Ethical Refusal (Replication of Harm)**
  The most serious objection raised is that preservation itself may be an act of violence. By accepting, digitizing, and circulating images extracted through coercion, the University may extend the surveillance regime into the present. Some silences are ethically preferable to a mediated presence that remains structurally violent. There is a valid argument that the most ethical stance is **refusal**: to decline the donation, thereby denying the landlords' records institutional legitimacy and protecting the descendants from the potential trauma of having their family's surveillance circulated globally. We acknowledge that by recommending acceptance, we are choosing the risk of potential harm over the certainty of erasure. This decision is predicated entirely on the presence of the "shadow histories." To reject the donation is to accept the finality of the arsonists' work and silence the descendants' voices. We cannot ethically prioritize the comfort of the living over the memory of the struggle, provided the living descendants consent to the stewardship model.

  **IV. RECOMMENDATION**

  The Subcommittee moves that the Committee **VOTE TO ACCEPT** the donation under the following binding conditions:

  1.  **Custodial Stewardship:** Physical materials are accepted, but digital access is restricted pending community review.
  2.  **Descriptive Protocol:** "Restorative cataloging" will be implemented not by altering the provenance or original order, but through **layered contextual metadata**. Finding aids must explicitly state the coercive origin of the landlord records while integrating the "shadow histories" as parallel narrative structures, not as verification of the landlord's data.
  3.  **Access Restrictions:** Surveillance photographs and security logs containing identifiable individuals will be placed under a **moratorium on public digitization** for a period of 24 months.
  4.  **Community Advisory Board (CAB):** A CAB comprising descendants of the tenant organizers and neighborhood historians must be established before processing begins. This board will hold veto power over the digitization of specific images and the phrasing of biographical notes.

  **V. IMPLEMENTATION TIMELINE**

  *   **Phase 1: Acquisition and Securing (Month 1-2)**
      *   Execute Deed of Gift with specific clauses regarding the CAB and access restrictions.
      *   Secure physical materials in climate-controlled storage; do not process or box for public access.
  *   **Phase 2: Community Consultation (Month 3-8)**
      *   Identify and convene the Community Advisory Board.
      *   Present the scope of the "Coercive Archive" to the CAB.
      *   Determine which materials, if any, should remain permanently undigitized or redacted.
  *   **Phase 3: Collaborative Processing (Month 9-18)**
      *   Archivists and CAB co-draft the finding aid.
      *   Implement layered metadata: Landlord records described as instruments of displacement; Shadow Histories described as oral memory.
      *   Resolve discrepancies between the two bodies of evidence through scope notes, not alteration of data.
  *   **Phase 4: Staged Access (Month 19+)**
      *   Release "Shadow Histories" and textual court filings first.
      *   Release surveillance imagery only upon CAB approval, potentially in a controlled reading room environment rather than open web access.

  **VI. CONCLUSION**

  This recommendation rejects the false binary between total preservation and total erasure. We acknowledge that accepting these records implicates the University in the history of the surveillance they depict. However, refusing the collection abandons the "shadow histories" to private hands and leaves the landlords' narrative as the sole surviving institutional record. By conditioning acceptance on community stewardship, we attempt to convert an archive of domination into a resource for accountability. We proceed not because the records are safe to hold, but because the silence left by their absence is more dangerous.

  **ACTION REQUIRED:**
  The Committee is requested to vote on this recommendation at the meeting scheduled for October 15.

  **Approved by:**
  The Subcommittee on Archival Ethics and Community Engagement

