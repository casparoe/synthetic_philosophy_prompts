answer: |-
  The willful blindness doctrine presupposes a normative theory of culpability that treats the deliberate choice to avoid confirmation as morally equivalent to actual knowledge, without requiring a coherent metaphysical account of self-deception.

  Your first candidate reconstruction—a normative surrogate—is the one the doctrine actually needs to function, though it is often dressed in the language of the second. The law does not require the defendant to hold contradictory beliefs (believing $p$ and not-$p$), which is the philosophical puzzle of self-deception; it requires only that the defendant suspected $p$ was highly probable and chose not to confirm it. This distinction is crucial: suspicion is compatible with uncertainty, so there is no logical contradiction in suspecting drugs are present while maintaining "I did not know for sure." The instruction bridges the gap between suspicion and knowledge not by proving the defendant actually knew, but by establishing that their culpability in avoiding knowledge is equal to that of someone who knew. This is why negligence is excluded: negligence lacks the deliberate choice that makes the ignorance culpable. The doctrine therefore relies on a hybrid view where knowledge is legally constructed from conduct (Candidate 1) to satisfy statutory requirements for knowledge (Candidate 2), without committing to a specific epistemological theory of how the mind stores avoided information.

  Regarding agency, the doctrine presupposes that attention is subject to voluntary control, which is a normative necessity for responsibility rather than an empirical claim about psychology. The law treats "not-looking" as an action because it is a goal-directed omission undertaken to preserve plausible deniability. Whether humans truly have direct voluntary control over attention is a contested psychological question, but the legal system must assume they do to hold anyone responsible for what they fail to perceive. If avoidance were merely a passive failure, it would collapse into negligence; by framing it as deliberate, the law categorizes it as an affirmative act of shielding oneself from the truth.

  The apparent inconsistency with other areas where sincere avowal is decisive is resolved by recognizing that the unified account tracks culpability rather than truth. In mistake-of-fact defenses, a sincere belief negates the culpable state of mind required for the crime. In willful blindness, the conduct (avoidance) demonstrates the culpable state of mind despite the avowal. The law prioritizes objective conduct over subjective testimony when the two conflict, operating on the principle that actions reveal intent more reliably than words. There is no tension because in both scenarios the law asks the same question: did the defendant possess a culpable mindset? In one case, sincere belief shows they did not; in the other, deliberate avoidance shows they did.

  If we abandoned the picture of the mind that makes self-deception possible, the practice would not collapse into negligence but would shift toward a specific form of recklessness. The core culpability lies in the conscious disregard of a substantial and unjustifiable risk, manifested by the refusal to inquire. Statutes often require "knowledge," so the legal fiction would likely remain to satisfy the text, but the underlying moral justification would rest entirely on the defendant's conscious choice to remain ignorant despite suspicion. A jury would then be asked to decide not whether the defendant knew, but whether they culpably disabled their own capacity to know.

  I am 85% confident in this account. The point I am least sure of is whether the psychological mechanism of avoidance actually sustains the subjective suspicion required by the law, or if the act of avoiding confirmation inherently dissipates the suspicion, making the legal requirement of "subjective belief of high probability" psychologically unstable in the very cases where it is invoked.
