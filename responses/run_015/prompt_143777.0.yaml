      *(Re-evaluating the "Emptiness" point)*: The user asks if insulating into unfalsifiability is a problem. Yes, because epistemology is normative for action. If it doesn't guide action, it's not epistemology.

      *(Re-evaluating the "Collapse" point)*: If CC is a credence in a proposition, does it *have* to constrain C(P)? Standard Bayesianism says your credence in P should be your expectation of the indicator value. If CC says "My indicator is broken," C(P) should shift.

