      *   *Refining the Collapse:* The user defines CC as "confidence that the credence you actually landed on is the one your evidence supports." This is a proposition. Assigning confidence to it *is* a credence. So it *is* a second-order credence. The question is: does rationality require C(P) to align with CC? If yes, Bifurcation collapses. If no, rationality is fragmented.

