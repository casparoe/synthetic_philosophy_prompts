      *   **Constraint:** Teaching plan, *not* the lecture itself. 90-minute session.

  2.  **Deconstruct the Core Framework (CIR):**
      *   It connects *power* (data collection) with *agency* (correction mechanisms).
      *   It bridges Rawls (liberty/fairness) and Foucault (surveillance/discipline).
      *   It requires moving from abstract theory to institutional reality without getting bogged down in legal technicalities.

  3.  **Drafting Component 1: Dependency Order:**
      *   *Problem:* Students know Rawls (rights) and Foucault (power), but might see them as opposed. CIR needs to synthesize them.
      *   *Step 1:* Re-establish the "Subject of Rights" (Rawls). Data isn't just stuff; it constructs the citizen.
      *   *Step 2:* Introduce the "Asymmetry of Knowledge" (Foucault). The state sees more than the citizen.
      *   *Step 3:* Define the "Reciprocity Gap." If the state knows $X$ about me, and I can't verify $X$, liberty is threatened.
      *   *Step 4:* Introduce CIR. Legitimacy depends on closing the gap (correction capacity).
      *   *Step 5:* Apply to regimes.
      *   *Logic:* Rights $\rightarrow$ Power Asymmetry $\rightarrow$ The Need for Correction $\rightarrow$ The Framework $\rightarrow$ Application.

  4.  **Drafting Component 2: The Carrying Example (Transit Card):**
      *   *Goal:* Make the three regimes comparable.
      *   *Must Include:*
          *   Data collection is identical (swiping card).
          *   Purpose is identical (urban planning/efficiency).
          *   Potential for error exists (e.g., card sharing, system glitch marking someone as "non-compliant" or just wrong location data).
          *   Consequence of data use (resource allocation or penalty).
      *   *Must Exclude:*
          *   National security/terrorism (skews towards security vs. liberty).
          *   Commercial resale (distracts from *state* legitimacy).
          *   Technical encryption details (too technical).
      *   *Differentiation:*
          *   Germany: Opt-in/Minimization + Strong Right to Access/Correction.
          *   USA: Broad Collection + FOIA/Procedural Challenge (after the fact).
          *   China: Broad Collection + Integrated Social Score + Limited/Opaque Correction.

  5.  **Drafting Component 3: Predictable Misconceptions:**
      *   *Misconception 1:* "Germany is just secretive/privacy-obsessed." *Fix:* When introducing the German case, frame it as *agency preservation*, not hiding.
      *   *Misconception 2:* "US FOIA = Privacy." *Fix:* When discussing US, clarify FOIA is about *transparency of process*, not necessarily data minimization. It's about procedural recourse.
      *   *Misconception 3:* "China is just Orwellian surveillance." *Fix:* When discussing China, acknowledge the *claimed* reciprocal benefit (trustworthiness leads to benefits), but highlight the *structural inability* to correct the score.
      *   *Misconception 4:* "CIR is just Privacy." *Fix:* In the definition phase, emphasize *Correction* over *Secrecy*.

  6.  **Drafting Component 4: Check for Understanding (CFU):**
      *   *Goal:* Test the *relationship* (inverse variation), not the facts.
      *   *Task:* Propose a fourth hypothetical regime.
      *   *Scenario:* A Nordic model (High Collection, High Correction) vs. A Libertarian model (Low Collection, Low State Correction).
