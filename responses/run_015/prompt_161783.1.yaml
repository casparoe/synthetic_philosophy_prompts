prompt: |-
  hey, so im on this committee at my school (me, three other students, and our vice principal) and we have to hand the principal an actual recommendation by april 12 about how next years student council gets chosen. right now its elections and theyre kind of a joke: turnout was about 12% last year, the same friend group wins basically every seat, and the councils real jobs are handing out roughly $8000 of club funding, writing one non-binding recommendation to the administration about the dress code, and planning spring fest.

  people keep arguing between (a) keep elections but patch them — ranked choice, reserved seats, campaign rules — and (b) drop elections and pick the council by random lottery, like 15 names drawn, one semester each. Ive been reading about sortition stuff online and i honestly think both of those are bad as stated, so I want to pitch something in the middle but I cant tell if it holds together: instead of one standing council, draw a fresh random panel of 12 for each big decision (funding, the dress code thing, spring fest), keep a tiny elected group of 3 whose only power is deciding what goes to a panel and when, draw from the entire grade instead of from volunteers, and exclude from the draw anyone who already holds a leadership role (team captain, club president, yearbook editor, etc.). Plus a challenge rule: 30 signatures forces a re-hearing of any panel decision in front of a *different* randomly drawn group of 8.

  can you draft the memo Ill circulate to the committee? It needs a concrete recommendation with dates — im thinking pilot it for fall semester and review in january — and it needs to take the other side seriously instead of just saying elections are popularity contests. the thing I actually find strongest against my plan is that a random group has no mandate, so the administration can just ignore whatever it decides, and that with rotating panels nobody ever builds up any expertise or institutional memory. if you think either of those is fatal say so and recommend something else. also tell me whether that exclusion rule is smart or self-defeating, and what we should actually measure in january to decide if the pilot worked. please keep it readable — the vice principal has to explain this to parents — and dont put any citations or a reading list in it, I cant use them and itll just make the memo longer.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **User:** Student on a committee (4 students + 1 VP) tasked with recommending a new Student Council selection process to the Principal by April 12.
      *   **Current Situation:** Elections are a joke (12% turnout, same friend group wins, limited power: $8k funding, 1 dress code rec, Spring Fest).
      *   **Debate:** Option A (Patch Elections) vs. Option B (Full Lottery/Sortition).
      *   **User's Idea:** A hybrid model.
          *   No standing council.
          *   Random panels (12 students) drawn for *each* big decision (Funding, Dress Code, Spring Fest).
          *   Tiny elected group (3 students) sets the agenda (what goes to panels).
          *   Draw from entire grade (not just volunteers).
          *   **Exclusion Rule:** Exclude existing leaders (captains, presidents, etc.).
          *   **Challenge Rule:** 30 signatures force a re-hearing by a *different* random panel (8 students).
          *   **Timeline:** Pilot Fall Semester, Review January.
      *   **Constraints/Needs:**
          *   Draft a memo to circulate to the committee.
          *   Must be readable (VP needs to explain to parents).
          *   No citations/reading lists.
          *   Must take opposing views seriously (not just "elections are popularity contests").
          *   Address specific weaknesses: Lack of mandate (admin might ignore) and Lack of expertise/memory.
          *   Evaluate the "Exclusion Rule" (smart or self-defeating?).
          *   Define success metrics for January review.
          *   Verdict on whether the weaknesses are fatal.

  2.  **Evaluate the User's Proposal (The "Hybrid Sortition" Model):**

      *   *Strengths:* Increases participation (mandatory draw), breaks cliques (randomness), distributes power, reduces campaign fatigue.
      *   *Weakness 1: Mandate.* If the panel isn't elected, does the Admin listen? *Mitigation:* The Admin (Principal) must agree *beforehand* to be bound by specific decisions (especially funding). If it's advisory only, students won't care.
      *   *Weakness 2: Expertise/Memory.* Rotating panels mean no one knows the budget rules or past precedents. *Mitigation:* The tiny elected group (3) or a permanent staff advisor needs to provide the "guardrails" and data, even if they don't vote.
      *   *The Exclusion Rule:* Is it smart? *Analysis:* It aims to broaden participation beyond the "usual suspects." *Risk:* It removes the most engaged students who might actually know how to run a meeting or manage a budget. It might create a council of people who *don't want to be there*. *Verdict:* It's risky. Better to stratify the draw (e.g., ensure a mix of grades/activities) rather than ban leaders outright. Or, allow leaders but cap their number. However, for a memo, I need to advise the user. I think banning leaders is self-defeating for *functionality*, but good for *equity*. A middle ground: Leaders can serve but cannot hold the 3 elected agenda seats. Or, keep the ban for the random pool to force new blood, but allow them in the elected 3. Actually, the prompt asks me to evaluate it. I should advise that a hard ban might be too blunt. A "cap" is better. But for the memo draft, I should probably soften it or frame it carefully. Let's advise the user in the commentary, but in the memo, frame it as "ensuring broad representation."
      *   *The Challenge Rule:* 30 signatures for a re-hearing. This is good democratic infrastructure. It adds legitimacy.
      *   *The Elected 3:* This solves the "agenda setting" problem but keeps the "popularity contest" small. Good compromise.

  3.  **Drafting the Memo:**

      *   **Tone:** Professional, collaborative, pragmatic, student-led but administratively viable.
      *   **Structure:**
          1.  Header (To, From, Date, Subject).
          2.  Context/Problem Statement (Acknowledge current issues without trashing the past).
          3.  Options Considered (Briefly validate Elections vs. Lottery).
          4.  Recommendation (The Hybrid Model).
          5.  Implementation Timeline (Pilot Fall, Review Jan).
          6.  Success Metrics (What to measure).
          7.  Next Steps.
      *   **Addressing the Weaknesses in the Memo:** I need to weave the solutions to "mandate" and "expertise" into the proposal description so it looks robust.
          *   *Mandate:* Explicitly state that the Principal agrees to uphold Funding decisions.
          *   *Expertise:* The Staff Advisor + The Elected 3 provide continuity.

  4.  **Commentary/Advice Section (Outside the Memo):**

      *   The user asked me to *also* tell them if the weaknesses are fatal, evaluate the exclusion rule, and suggest metrics. This should be separate from the memo draft so they can use the advice to tweak the memo if they want.
      *   *Mandate:* Not fatal if pre-negotiated.
      *   *Expertise:* Not fatal if staff advisor is strong.
      *   *Exclusion Rule:* Self-defeating if too strict. Suggest a cap instead.
      *   *Metrics:* Turnout (participation), Satisfaction (survey), Budget execution (did money get spent?), Diversity of participants.

  5.  **Refining the Memo Content:**

      *   *Subject Line:* Needs to be clear. "Recommendation for Student Governance Pilot."
      *   *Opening:* Acknowledge the deadline (April 12).
      *   *The "Why":* Focus on engagement and fairness, not just "elections suck."
      *   *The Model:* Call it "Representative Panels."
      *   *The Elected 3:* Call them "Steering Committee."
      *   *The Exclusion Rule:* I will advise the user to modify this in my notes, but in the memo, I'll phrase it as "prioritizing students not currently in major leadership roles" to sound less punitive. Actually, better to be honest in the memo but nuanced. Let's suggest a "stratified draw" in the advice, but keep the memo close to their idea but softened. *Decision:* In the advice section, I will strongly suggest modifying the exclusion rule. In the memo, I will write it as "prioritizing broad participation" to make it palatable to parents/VP.
      *   *Timeline:* April 12 deadline is for the recommendation to the Principal. The Pilot starts Fall. Review in Jan.

  6.  **Review against Constraints:**

      *   Readable for VP/Parents? Yes, avoid jargon like "sortition." Use "random selection" or "civic duty model."
      *   No citations? Checked.
      *   Address weaknesses? Yes, built into the design (Advisor for memory, Principal agreement for mandate).
      *   Concrete dates? Yes.

  7.  **Final Polish:**

      *   Make sure the distinction between the "Steering Committee" (elected 3) and "Decision Panels" (random 12) is clear.
      *   Ensure the "Challenge Rule" is explained simply.
      *   Check the tone: Not rebellious, but constructive.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should tell them to drop the exclusion rule in the memo.
      *   *Correction:* No, I should draft the memo based on *their* plan but refine the language, then give my critique in the analysis section. If I change their plan in the memo, they might submit something they don't fully understand or believe in. I will draft the memo to reflect their vision but polished, then in the "Advice" section, I will warn them about the exclusion rule and the mandate issue.
      *   *Wait, one more thing:* The prompt asks "if you think either of those is fatal say so and recommend something else." I need to be honest in the analysis.
      *   *Mandate:* If the Principal doesn't agree to be bound, the whole thing fails. I need to emphasize this in the advice.
      *   *Expertise:* If the panels are totally raw, they might make illegal/impossible budget decisions. The Staff Advisor is crucial.
      *   *Exclusion Rule:* Banning club presidents might remove the only kids who know how to read a budget. I will recommend a "cap" instead of a "ban."

      *   *Memo Strategy:* I will draft the memo to be robust *assuming* these fixes are made (e.g., mentioning the Advisor's role in training).

  9.  **Final Plan:**
      *   Part 1: The Memo (Clean, professional, ready to circulate).
      *   Part 2: Strategic Advice (Addressing the fatal flaws, the exclusion rule, and metrics).

      *(Self-Correction on Memo Audience)*: The memo is to circulate to the *committee* (the 3 other students + VP). So it's an internal working document to get *them* on board before going to the Principal. It needs to persuade *them*.

      *(Wait, re-reading prompt)*: "draft the memo Ill circulate to the committee?" Yes. So it's internal. But it also says "the vice principal has to explain this to parents." So the language must be parent-ready *because* the VP will use this language later. Okay, got it.

      *(Dates)*: Recommendation to Principal by April 12. Pilot Fall. Review Jan.

      *(Let's write)*.

      *(Wait, one detail on the Exclusion Rule)*: The prompt asks me to tell them *in the response* whether it's smart or self-defeating. I will do that in the analysis section. In the memo, I will phrase it carefully.

      *(Let's finalize the "Fatal Flaw" assessment)*:
