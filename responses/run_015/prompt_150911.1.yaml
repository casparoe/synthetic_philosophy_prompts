  # Joint Statement on Insecticide Ethics and Agronomy

  **Preamble:** This document represents the output of an adversarial collaboration between the Welfare-First Camp (WFC) and the Crop-Protection Camp (CPC). It maps areas of agreement, structured disagreement, and empirical cruxes required to resolve the dispute.

  ### 1. Shared Premises
  Both camps affirm the following claims:

  1.  **Scale of Mortality:** Agricultural and household insecticides kill invertebrates in the trillions annually. This magnitude is sufficient to matter morally *if* invertebrates possess sentience above a negligible threshold.
  2.  **Sentience Uncertainty:** Current evidence regarding invertebrate sentience is inconclusive. There is non-zero probability that many affected species experience valenced states (suffering/pleasure), and non-zero probability that they do not.
  3.  **Ecological Knock-ons:** Insecticides affect non-target invertebrates and reduce food availability for vertebrate predators (birds, bats, fish). These secondary effects are significant but difficult to quantify precisely.
  4.  **Resistance and Resurgence:** Pesticide resistance is evolutionarily inevitable. Secondary pest outbreaks and resurgence are documented phenomena that can increase total insecticide use over time.
  5.  **The Counterfactual:** The ethical comparison is not "insecticides vs. nothing." It is "insecticides vs. alternatives" (tillage, host-plant resistance, biological control, habitat manipulation). All alternatives carry ecological and yield costs.
  6.  **Population Dynamics:** The moral calculus depends on the total number of insect-life-days over time, not just acute mortality. Spraying may reduce future generations, potentially lowering total life-time experienced.

  ### 2. The Accounting Unit: Fixing the "Sentience-Weighted Insect-Day"
  The group previously utilized the *Sentience-Weighted Insect-Day* (SWID): *Number of Insects × Probability of Sentience × Time.*

  **Critique:** Both camps agree SWID is flawed because it assumes existence is inherently valuable. It generates "weird results" (e.g., suggesting a world with trillions of suffering insects is better than a world with none) because it lacks a valence coefficient.

  **Replacement:** We adopt the **Expected Valence-Integrated Day (EVID)**.
  $$EVID = \sum (Population_t \times P(Sentience) \times Net Welfare Rate_t)$$
  *   **Net Welfare Rate:** A value from -1 (intense suffering) to +1 (intense flourishing).
  *   **Agreement:** If the Net Welfare Rate is negative (life is net suffering), reducing EVID is morally good. If positive, reducing EVID is morally bad. The dispute is largely about the sign and magnitude of this rate.

  ### 3. Structured Disagreements
  The following table captures the divergence without caricature. Each side endorses their column.

  | Feature | Welfare-First Camp (WFC) | Crop-Protection Camp (CPC) |
  | :--- | :--- | :--- |
  | **Prior on Sentience** | High credence (>50%) that pests experience negative valence during poisoning. | Low credence (<10%) that pests experience morally relevant valence. |
  | **Weight of Acute Death** | Neurotoxic poisoning is likely worse than starvation/predation due to duration and intensity. | Mode of death is negligible compared to the certainty of human food security and habitat sparing. |
  | **Default Assumption** | In doubt, presume capacity for suffering (Precautionary Principle). | In doubt, presume lack of capacity until proven otherwise (Evidence Burden). |
  | **Land-Sparing Value** | Secondary to immediate invertebrate welfare; wild habitat may contain net suffering. | Primary moral good; sparing land prevents greater biodiversity loss and human harm. |

  ### 4. Empirical Cruxes and Pre-Registered Tests
  To move beyond theory, both camps agree to evaluate the following hypothetical case: **System Alpha (Cotton).**

  **Case Description:** A 5-year study comparing Standard Spray (SS) vs. Integrated Pest Management (IPM) on 100 hectares.
  **Measurement:** Total insect-life-days per hectare; Nociceptor activity levels during death events.

  | Crux Question | Measurement Required | WFC Prediction | CPC Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Total Population Effect** | Cumulative insect-life-days over 5 years (SS vs. IPM). | SS reduces total life-days by >40% (suppression dominates). | SS reduces total life-days by <10% (resurgence offsets suppression). |
  | **2. Valence Sign** | Behavioral/Physiological markers of chronic stress in wild populations. | Wild existence is net negative (predation/starvation constant). | Wild existence is net positive or neutral (homeostasis maintained). |
  | **3. Death Intensity** | Neural firing duration during neurotoxic vs. starvation death. | Neurotoxic death involves 10x longer distress signals. | Distress signals are reflexive, not experiential; duration irrelevant. |

  **Agreement:** If Measurement 1 shows SS *increases* total insect-life-days, CPC concedes welfare costs are higher. If Measurement 2 shows wild life is net negative, WFC concedes spraying may be welfare-improving.

  ### 5. Uncomfortable Concessions and Verbal Disputes

  **Uncomfortable Concessions**
  Both camps acknowledge logical implications of their views that conflict with their intuitions:
  *   **WFC Concession:** If wild insect life is predominantly net negative (due to high mortality rates and starvation), then insecticides that suppress populations might be *welfare-improving*, even if the mode of death is painful. Consistency requires accepting that mercy killing via habitat reduction is permissible if existence is suffering.
  *   **CPC Concession:** If invertebrate sentience is confirmed, neurotoxic poisoning is likely morally worse than the starvation or predation it replaces. Consistency requires admitting that current practices impose high welfare costs, necessitating immediate investment in non-toxic alternatives regardless of yield impact.

  **Verbal Disputes**
  We identify the phrase **"counts morally"** as doing excessive work in our arguments. We distinguish three distinct meanings previously conflated:
  1.  **Threshold:** Does the entity have *any* capacity for welfare? (Binary)
  2.  **Weight:** How much does that welfare matter relative to humans? (Scalar)
  3.  **Counting:** Does bringing an entity into existence count as a benefit? (Population Ethics)

  **Resolution:** The WFC focuses on (1) and (2), assuming (3) is negative. The CPC focuses on (1) being low and (3) being irrelevant compared to human needs. Future arguments must specify which definition is in play.

  **Closing:** This document does not resolve the ethical conflict, but it isolates the empirical and semantic barriers. Further discussion should focus exclusively on the Cruxes (Section 4) and the sign of the Net Welfare Rate (Section 2).
