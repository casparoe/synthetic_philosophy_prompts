  # Joint Statement of Adversarial Collaboration on the Distribution of Animal Consciousness

  **Signatories:** The Gradualist Phenomenal Realist (GPR) and The Cognitive-Access Discontinuist (CAD)

  ### I. Agreed Claims Regarding Epistemic and Structural Constraints

  1.  **Limits of Comparative Neuroscience:** We agree that current neuroscientific methods provide correlates rather than constitutive explanations of consciousness. There exists no direct "consciousness meter" capable of measuring phenomenal experience independently of behavioral report or structural inference, necessitating reliance on theoretical frameworks to interpret neural data.
  2.  **Distinction Between Phenomenal Experience and Cognitive Access:** We agree that a formal conceptual distinction exists between phenomenal consciousness (the subjective quality of experience) and cognitive access (the availability of information for report, reasoning, and executive control). We acknowledge that while these may coincide in healthy adult humans, their dissociation is logically possible and empirically relevant in non-human animals.
  3.  **Insufficiency of Behavioral Proxies:** We agree that behavioral complexity alone cannot settle the distribution question. Sophisticated avoidance behaviors or nociceptive reflexes are compatible with both the presence of felt suffering and the absence of experience (unconscious functionalism), meaning behavior constrains but does not determine ontological status.
  4.  **The Problem of Decentralized Architectures:** We agree that decentralized nervous systems, such as the arm-autonomy of cephalopods or the distributed ganglia of insects, pose a specific conceptual challenge to the notion of a unified subject. Both parties acknowledge that standard models of centralization may not map cleanly onto these architectures, requiring explicit theoretical handling of modularity versus unity.

  ### II. Table of Remaining Disagreements

  | Issue | Gradualist Phenomenal Realist (GPR) Position | Cognitive-Access Discontinuist (CAD) Position |
  | :--- | :--- | :--- |
  | **Necessity of Phenomenal Binding** | Phenomenal binding is a graded property; partial integration is sufficient for partial conscious states, meaning consciousness can exist without full global unity. | Unified phenomenal consciousness is an all-or-nothing property requiring specific global integration; without sufficient binding, no conscious state exists whatsoever. |
  | **Evolutionary Continuity vs. Valence** | Evolutionary continuity in nociceptive and affective pathways implies continuity in phenomenal valence; if the hardware is homologous, the experience differs only in degree. | Evolutionary continuity in circuitry does not imply continuity in experience; a specific architectural threshold must be crossed for nociception to become felt valence. |
  | **Status of Decentralized Architectures** | Decentralized architectures support either a single diffuse subject with graded unity or parallel modular micro-subjects, implying consciousness may be distributed across body parts. | Decentralized architectures support no unified subject unless a central integrator exists; peripheral processing is unconscious unless accessed by a central self-referential system. |

  ### III. The Cruxes

  **Crux 1: The Necessity of Global Integration for Affective Valence**
  *   **Structural Observation:** The dissociation between local nociceptive processing loops and global broadcast signatures (e.g., recurrent thalamocortical or equivalent loops) in specific taxa.
  *   **Agreed Relevance:** Both parties agree that if an organism exhibits complex, learning-based nociceptive avoidance without signatures of global integration, this case adjudicates whether valence requires global access.
  *   **GPR Prediction:** This case would show that affective valence is real and phenomenal even in the absence of global broadcast, confirming consciousness is tied to local sensory-affective integration.
  *   **CAD Prediction:** This case would show that complex avoidance is purely unconscious adaptive processing, confirming that phenomenal valence requires global access architecture.

  **Crux 2: The Subjecthood of Distributed Processing Units**
  *   **Concrete Case:** Functional independence of cephalopod arms or insect ganglia where sensory-motor loops operate effectively after disconnection from the central brain.
  *   **Agreed Relevance:** Both parties agree that the phenomenological status of these disconnected units tests whether consciousness requires a singular central locus or can be modular.
  *   **GPR Prediction:** This case would show that disconnected units retain a degree of phenomenal experience (micro-subjects), confirming consciousness is distributed and graded.
  *   **CAD Prediction:** This case would show that disconnected units are unconscious automata, confirming that consciousness requires a centralized, self-referential representational architecture.

  ### IV. Statement on Verbal Versus Substantial Disagreement

  We explicitly acknowledge that a portion of our disagreement is verbal, specifically regarding the label "consciousness" applied to basic affective states. The GPR uses the term to denote any state with phenomenal valence, while the CAD reserves the term for states accessible to a self-model. However, we affirm that a substantive disagreement remains regarding the ontological existence of phenomenal properties in the absence of self-referential architecture. Even if we standardized our terminology, we would still disagree on whether there is "something it is like" to be an organism lacking global integration, making this a factual dispute about the nature of reality rather than a mere semantic divergence.

  This document formalizes the structural boundaries of our collaboration to facilitate empirical adjudication of competing consciousness models.
