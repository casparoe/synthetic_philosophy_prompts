answer: |-
  Good morning. Welcome to "Who Decides the Scale?"

  I noticed the invitation had a typo. It spelled it "subsidiarty." I've decided we're going to keep that. Because if we're honest, half the time we're arguing about subsidiarity, we're actually arguing about subsidiarty—a ghost concept that haunts the room, slightly misspelled, slightly misunderstood, but absolutely critical to whether this union holds together or falls apart.

  Looking around this room, I see a split. On one side, I see colleagues who can cite Article 5 of the Treaty on European Union in your sleep. You think in terms of competence-competence, legal bases, and proportionality. On the other side, I see organizers from Swiss cantons and German Länder who are tired of being told that Brussels or Berlin "knows best" about your zoning laws or your school curriculums.

  Usually, when these two groups meet, the lawyers talk about constraints, and the organizers talk about freedom. The lawyers say, "Here is the boundary." The organizers say, "Here is where we breathe."

  I want to suggest that this workshop works best if we stop thinking about subsidiarity as a boundary line, and start thinking about it as a current. And not one that flows down.

  The common story—the one we tell students and voters—is that subsidiarity is about proximity. It's the idea that "closer is always better." That decisions should be taken as closely as possible to the citizen. It's a comforting story. It suggests that if you just shrink the scale of government, you automatically increase the democracy.

  But I don't think that's true. And I don't think the structure of Europe supports it.

  If subsidiarity were just about proximity, the EU would be a failure by design, and the Swiss cantons would be utopias. But we know the reality is messier. In practice, the EU often uses subsidiarity as a blame-shifting device. When a policy fails, the Center says, "We set the framework, but the implementation was national." The legitimacy drains downward into the member states, while the authority stays upward in the Commission.

  Conversely, look at the Swiss system. We love to talk about cantonal autonomy. But Swiss fiscal equalization means rich cantons subsidize poor ones. If your budget depends on a transfer from Zurich or Geneva, how "local" is your autonomy really? It breaks the simple story that local money equals local control.

  So, here is the proposition I want us to wrestle with today: Subsidiarity isn't about physical proximity. It's about reverse delegation.

  We tend to think sovereignty starts at the top and trickles down. But in a compound system like ours, legitimacy flows upward. The center doesn't own the power and lend it out. The lower bodies actively generate the conditions that make the center's claims legitimate. When a Land or a Member State agrees to a common standard, they aren't just complying; they are lending their own democratic credibility to the European level.

  This means I can't promise the organizers in the room that decentralization is automatically more democratic. Sometimes, a local majority can be just as tyrannical as a distant bureaucracy. And I can't promise the lawyers in the room that the EU is just a big nation-state that needs to be trimmed back. It's not a state. It's a negotiation that never ends.

  This creates a missing middle in our regional policy. We have the local, and we have the central, but we lack the structural recognition of that upward flow of legitimacy.

  I know this is abstract. Let me try to ground it with an analogy. I warn you, it might not work for everyone.

  Think of the EU and the member states like a multi-tenant apartment building sharing a single heating boiler in the basement.

  The lawyers in the room are looking at the boiler specs. They care about the pressure valves, the fuel efficiency, the safety regulations of the boiler room. They want to know who has the key to the basement.

  The organizers in the room are in the apartments. You care about the thermostat on your wall. You want to decide when the heat comes on. You want to open the window if you're hot.

  Now, here is the awkward part: The boiler doesn't work unless everyone agrees to connect to it. But if one apartment disconnects to save money, the pressure drops for everyone else. And if the boiler breaks, the thermostat doesn't matter—you're all cold.

  The question "Who decides the scale?" isn't about who holds the thermostat. It's about who pays for the boiler repair when the pipe bursts in the wall between unit 4 and unit 5. Is that a private repair? Or is it structural? If Zurich pays for the repair in Uri, is Uri still autonomous? If Berlin mandates the boiler temperature for Bavaria, is Berlin democratic?

  This analogy is imperfect, obviously. Buildings don't have parliaments. But it highlights the dependency. We are tied together by infrastructure we didn't build individually, but which we cannot survive individually.

  This is why the philosophical point has to do structural work. If legitimacy flows upward from these agreements, then we cannot treat the EU like a sovereign state waiting to happen. It is a system of borrowed power.

  For the lawyers: This changes how we view competence-competence. It's not just about who has the final say legally. It's about who has the political capacity to sustain the say. If the lower bodies withdraw the conditions of legitimacy, the legal text remains, but the authority vanishes.

  For the organizers: This means autonomy isn't a shield against the center. It's the material you use to build the center. You aren't just protecting your turf; you are managing the delegation that makes the larger project possible.

  We are here to discuss "subsidiarty." The misspelled version. Because the perfect version doesn't exist. There is only the negotiation of scale. There is only the constant recalibration of who fixes the boiler, who sets the thermostat, and who admits when the system is too cold.

  Over the next few days, I hope we don't try to solve this. I hope we try to map the tension. Because if we pretend the tension isn't there, the boiler stops working.

  Thank you. I'll take your questions.
