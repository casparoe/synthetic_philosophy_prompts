      *   *Clarification on "Content":* In the Strong variant, the content is false because it posits an object that doesn't exist. In the Weak variant, the content is false because it predicates a property (intrinsic qualitativeness) that the object doesn't have.
      *   *Functional Authority:* How to explain this? Evolution. A user interface doesn't need to be accurate to be useful; it needs to be actionable.
      *   *The "Undetectable" point:* This is the "Hard Problem of Illusionism." If the illusion is perfect, the distinction between illusion and reality vanishes *for the subject*. The Illusionist must argue the distinction exists *theoretically*, not phenomenologically. I need to emphasize the *theoretical* stance vs. the *phenomenological* stance.

  5.  **Final Polish:**

