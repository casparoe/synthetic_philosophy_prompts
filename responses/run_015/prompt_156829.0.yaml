      Start with the standard coherence view. Coherence arguments, such as those derived from Dutch-book scenarios, typically posit that rational agents must structure their degrees of belief and values to avoid guaranteed losses or preference cycles. These arguments rely on specific structural assumptions to derive the expected-utility representation. Specifically, they presuppose that utility is state-independent and that beliefs and values are separable. This means the value assigned to an outcome should not depend on the state in which it occurs or the description under which it is presented.

