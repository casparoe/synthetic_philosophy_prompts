answer: |-
  PHILOSOPHY OF RATIONALITY SEMINAR
  FINAL EXAMINATION
  Time Allowed: 90 Minutes
  Total Marks: 25

  Question 1

  Consider an agent whose preferences over compound lotteries violate the independence axiom in a structurally regular, reproducible way. Call this frame-locked independence failure. In this scenario, the framing of outcomes as gains versus losses systematically shifts the weighting of common consequences without altering the agent's ordinal ranking of sure outcomes or her probabilistic beliefs about states of the world.

  Evaluate whether a coherence argument can be reconstructed to defend expected-utility maximization in this setting. If such a reconstruction is possible, determine whether it retains normative force or collapses into a consistency requirement on revealed preference alone. Your answer must address both the logical structure of coherence proofs and the philosophical status of framing-sensitive preferences.

  Note: Do not simply summarize standard Dutch-book derivations. Do not provide bibliographies or citations.

  ***

  MODEL ANSWER

  Coherence arguments for expected-utility maximization typically proceed by demonstrating that agents who violate specific axioms are susceptible to guaranteed losses or exhibit preference cycles that undermine their own goals. These arguments rely on strong structural assumptions to derive the representation theorem. Specifically, they presuppose that utility is state-independent and that beliefs and values are separable. This means the value assigned to an outcome should not depend on the state in which it occurs or the description under which it is presented. The logical force of the argument depends on the ability to isolate the value of consequences from the probabilistic structure of the lottery.

  In the case of frame-locked independence failure, the agent violates the independence axiom because the value of a common consequence shifts depending on whether the lottery is framed as a gain or a loss. Standard coherence proofs break down here because they cannot isolate a unique utility function over outcomes. The logical structure of the proof requires that if an agent prefers A to B, they must prefer a mixture of A with C to a mixture of B with C. When framing alters the weighting of C based on the context of A or B, the substitution principle fails. Consequently, the mathematical derivation that maps preferences to a unique utility function cannot proceed. The coherence constraint no longer forces the agent into a single expected-utility format because the utility function itself becomes context-dependent. The proof requires a stable metric of value to measure the cost of inconsistency, but frame-locking implies the metric itself fluctuates with the presentation.

  This leads to the second level of analysis regarding separability. The failure is not merely a violation of an axiom but an undermining of the separability assumption required to derive utility from coherence constraints alone. In standard models, the utility of an outcome is intrinsic. In the frame-locked scenario, utility is relational to the frame. This means the agent does not have a stable value function over world-states. Instead, she has a value function over described prospects. Coherence arguments typically assume that rationality requires stability across descriptions. If we allow the utility function to vary with the frame, we are no longer measuring rationality in the traditional sense of avoiding exploitation due to inconsistent valuations of the same state. We are instead accommodating a psychological feature where the description constitutes part of the outcome. The logical reconstruction fails because it cannot distinguish between a change in valuation due to new information versus a change due to mere redescription.

  Finally, we must evaluate the normative force of any reconstructed argument. If we adjust the coherence argument to accommodate frame-locked preferences, we essentially redefine the outcomes to include the framing description. While this restores formal consistency, it significantly diminishes the normative force of the argument. The original normative power of coherence arguments lies in their claim that violating the axioms makes an agent susceptible to exploitation or constitutes a form of irrationality akin to logical contradiction. By relaxing separability to allow framing effects, the argument shifts from prescribing how agents ought to reason to merely describing how agents consistently behave. It becomes a consistency requirement on revealed preference rather than a defense of expected-utility maximization as a normative ideal. The agent is consistent relative to her framing-sensitive preferences, but she is not maximizing expected utility in the sense of maximizing value over objective states. Thus, the reconstruction saves the formalism at the cost of the normativity. The argument collapses into a claim that the agent is internally consistent, not that she is rational in the robust sense required by standard decision theory. The coherence argument loses its bite as a tool for critique and becomes a tool for accommodation.

  ***

  MARKING SCHEME

  Total Marks: 25

  Logical Reconstruction (10 Marks)
  - 8-10 Marks (A Level): Explicitly identifies that standard coherence proofs presuppose state-independent utility and separability of beliefs and values. Diagnoses exactly where the proof breaks (the substitution principle fails because utility is context-dependent).
  - 5-7 Marks (B Level): Correctly describes the Dutch-book structure and notes that independence is violated. Fails to locate the specific failure of separability or state-independence.
  - 0-4 Marks: Summarizes Ramsey or Savage without addressing the specific frame-locked scenario.

  Philosophical Evaluation (10 Marks)
  - 8-10 Marks (A Level): Clearly distinguishes between normative force (prescribing rationality) and formal consistency (describing behavior). Argues that redefining outcomes to save the model reduces the argument to a consistency requirement on revealed preference.
  - 5-7 Marks (B Level): Discusses normative force but treats framing as a minor adjustment rather than a fundamental collapse of the normative claim.
  - 0-4 Marks: Claims coherence is fully preserved or fully destroyed without nuanced evaluation of the trade-off.

  Clarity and Precision (5 Marks)
  - 5 Marks: Argument is structured logically, terms are defined, and no unnecessary jargon is used.
  - 3-4 Marks: Generally clear but some ambiguity in distinguishing consistency from normativity.
  - 0-2 Marks: Disorganized or difficult to follow.

  Distinction between A and B Answers
  An A answer must explicitly diagnose where the coherence proof breaks rather than merely noting that framing violates independence. The A answer must identify the failure of separability between belief and value. A B answer may correctly describe the Dutch-book structure but fail to locate the separability failure.

  COMMON STUDENT MISTAKES

  1. Conflating Coherence with Static Consistency
  Students often treat coherence arguments as merely synchronic checks on revealed preference. They miss that coherence arguments are dynamic and diachronic, relying on the possibility of sequential choices leading to sure loss. Failing to address the dynamic nature of the Dutch-book scenario results in a loss of marks in Logical Reconstruction.

  2. Treating Framing as Stochastic Noise
  Students may treat framing effects as random errors or noise in the preference relation. This is incorrect for the specified scenario. The prompt defines frame-locked independence failure as structurally regular and reproducible. Treating it as noise ignores the systematic integration of framing into the preference relation, leading to errors in Philosophical Evaluation.
