      *   *Q3 Follow-up:* Prompt says "tailored to the answer she is most likely to give." (Likely: predictive yes, causal no). -> Ask about the danger of that gap.

      *(Self-Correction during drafting)*: Make sure the questions sound like spoken interview questions, not essay prompts. They need to be punchy but dense. Ensure the transition between the main question and the follow-up is logical.

