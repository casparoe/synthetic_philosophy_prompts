answer: |-
  You have described a precise epistemological configuration that sits at the intersection of logic, history, and social practice. You are right to feel that the standard summary of Wittgenstein ("propositions that can't be doubted") is too static for what you're seeing.

  There is no single English word that captures all three of your criteria (foundational stopping point, historical mutability, social exclusion of dissenters) perfectly. However, there are three established concepts that each capture a face of this object. If you want a label that binds them into the specific configuration you described, I will propose one at the end.

  Here are the nearest candidates, why they fit, and where they fail.

  ### 1. Wittgenstein's "Hinge Propositions" (*On Certainty*)
  You mentioned this, but your hesitation suggests you've encountered the "static" reading of Wittgenstein rather than the "dynamic" one.
  *   **Where it fits:** Wittgenstein explicitly describes these propositions as the "scaffolding" of our thoughts. They are not justified by evidence; they are the *medium* through which evidence is judged. When someone denies a hinge (e.g., "The earth has existed for many years"), Wittgenstein says we don't argue with them; we treat them as confused or outside the language game. This matches your "corrected, trained, or laughed at" criterion.
  *   **Where it fails:** You noted that WC seems to imply immutability ("can't be doubted"). This is a common misreading. In *On Certainty* (§96–99), Wittgenstein uses the **Riverbed Analogy**: the bed of the river (hinges) guides the water (arguments), but the bed itself can shift over time. However, Wittgenstein focuses on the *logical* function of the hinge, not the *sociological* mechanism of how the shift happens or how dissenters are policed. He explains why you *can't* argue it, but not exactly why the community *excludes* you for trying.

  ### 2. Searle's "Constitutive Rules"
  John Searle distinguishes between *regulative rules* (which govern existing behavior, like "drive on the right") and *constitutive rules* (which create the possibility of the behavior, like "checkmate ends the game").
  *   **Where it fits:** Your example ("photos count as evidence") is a constitutive rule of the institution of Journalism or Science. It has the form "X counts as Y in context C." If you move a rook diagonally in chess, you aren't "argued with"; you are told you are no longer playing chess. This matches your "outside the conversation" criterion perfectly. It also allows for historical change (we can change the rules of chess).
  *   **Where it fails:** Searle's framework is primarily institutional (money, marriage, games). It struggles to account for claims that feel like *empirical facts* rather than *institutional rules*. To your friend, "photos might be AI" feels like a discovery about the world, not a rule change. Searle doesn't fully capture the *epistemic* weight—the feeling that truth itself is at stake, not just the rules of a game.

  ### 3. Michael Friedman's "Relativized A Priori"
  In *Dynamics of Reason*, Friedman updates Kant to handle historical change. He argues that scientific frameworks rely on "constitutive a priori" principles (e.g., Newton's absolute time) that make empirical testing possible.
  *   **Where it fits:** This captures your historical criterion perfectly. These principles are necessary *within* a framework but can be swapped out when the framework changes (e.g., shifting from Newtonian to Einsteinian physics). It explains how something can be a "fact" for 200 years and then become a "contingent commitment."
  *   **Where it fails:** Friedman is focused on high-level scientific paradigms. Applying "Relativized A Priori" to a casual argument about news photos feels like using a particle accelerator to crack a nut. It lacks the *conversational* dimension. It explains the historical shift, but not the immediate social sanction (the laughter, the exclusion) you experience in the moment.

  ---

  ### The Synthesis: A Name and Definition

  Since the established terms split the phenomenon between logic (Wittgenstein), institutions (Searle), and history (Friedman), and you need a term that captures the *conversational enforcement* of a *historically mutable* *epistemic foundation*, I propose the following label:

  **Term:** **Constitutive Epistemic Commitment (CEC)**

  **Definition:** A proposition that functions as a necessary condition for a specific communicative or evidentiary practice to proceed, which is treated as a fact within that practice but is recognized as a contingent norm from a historical or external perspective. Denial of a CEC does not trigger counter-argument but triggers **epistemic exclusion** (the denier is treated as incompetent, hostile, or outside the community).

  **Why this fits your configuration:**
  1.  **Constitutive:** It defines the game (like Searle). Without it, "evidence" has no meaning.
  2.  **Epistemic:** It concerns truth and justification, not just institutional rules (like Friedman/Wittgenstein).
  3.  **Commitment:** It implies a social binding. You hold it by virtue of membership in the community, not by virtue of proof.
  4.  **Exclusion:** The definition builds in the social sanction. You don't argue with a commitment; you enforce it.

  ### Borderline Cases
  To test if this label holds, here are three cases where it is unclear whether something counts as a CEC:

  1.  **The Stubborn Ideologue vs. The CEC Defender:**
      *   *Case:* A person refuses to accept vaccination data because they distrust "Big Pharma."
      *   *Borderline:* Is "Big Pharma is trustworthy" a CEC for medical discourse? Or is it just a contested empirical claim?
      *   *Test:* If the community treats the denial as a *failure of rationality* (you don't understand science) rather than a *difference of opinion*, it leans toward CEC. If they try to persuade with more data, it's just a claim. CECs are characterized by the *failure of data* to move the needle.

  2.  **Technical Prerequisite vs. CEC:**
      *   *Case:* You cannot do calculus without accepting the concept of limits.
      *   *Borderline:* Is this a CEC?
      *   *Test:* No. This is a logical prerequisite, not a social one. If you deny limits, you are mathematically wrong, not socially excluded. CECs involve a *normative* judgment about what counts as evidence, not just logical consistency.

  3.  **Etiquette vs. CEC:**
      *   *Case:* "Don't interrupt the speaker."
      *   *Borderline:* This is a constitutive rule of conversation that gets you excluded if broken.
      *   *Test:* No. This is procedural, not epistemic. It governs *how* we speak, not *what counts as true*. A CEC must specifically govern the **admissibility of truth-claims**.

  ### Summary
  You are bumping into **Constitutive Epistemic Commitments**. They are the "riverbed" (Wittgenstein) of your specific community, enforced like "constitutive rules" (Searle), and subject to historical drift (Friedman). When your friend says "photos aren't evidence," they aren't making an empirical claim; they are attempting to swap the riverbed. You treat them as outside the conversation because, functionally, they are trying to play a different game.
