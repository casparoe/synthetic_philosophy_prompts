      *   **User's Goal:** Move beyond the "obvious reading" (testimonial injustice against the accused, hermeneutical injustice regarding witchcraft vocabulary).
      *   **Specific Philosophical Wrinkles to Address:**
          1.  *Credibility Capture:* Is this a distinct third category, or just stacked injustices? Does it show credibility itself can be an instrument of harm?
          2.  *Danforth as Victim:* A student claimed Danforth suffers testimonial injustice (liars inform him, power makes him "un-tellable"). Is this a category error? Can epistemic injustice run uphill? Is Danforth's failure epistemic or something else?
      *   **Specific Tensions/Allegory:**
          1.  *McCarthyism Allegory:* Does this help or hurt the epistemic reading? (State terror vs. conceptual damage).
          2.  *The Ending:* Proctor chooses truth over credibility/survival. Is this a coherent moral for social epistemology (knowledge is social) or is the play "cheating" (romanticizing individual truth)?
      *   **Deliverables:**
