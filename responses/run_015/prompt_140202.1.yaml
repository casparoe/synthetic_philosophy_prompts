          2.  Analysis of Danforth (can injustice run uphill?).
          3.  Seminar Plan (2 hours, specific scenes, questions, common pitfalls).
          4.  Evaluation of the play's contribution to philosophical debate (illustration vs. addition).
      *   **Constraints:** Do not quote the text directly (user doesn't have it to hand), describe scenes instead. Faithful in both directions (use concepts on text, let text resist concepts).

  2.  **Philosophical Analysis (The "Hard" Work):**

      *   *Credibility Capture:* The user defines this as a rigged economy where only certain propositions are hearable, pushing speakers strategically toward what will be believed.
          *   *Is it distinct?* Fricker's *Testimonial Injustice* (TI) is about prejudice lowering credibility. *Hermeneutical Injustice* (HI) is about lacking concepts. "Credibility Capture" sounds like a structural consequence of HI + Institutional Power. It's not just that I'm not believed (TI); it's that the *conditions for being believed* require me to distort my testimony. It shifts the locus from the *hearer's prejudice* to the *system's incentive structure*. It shows credibility isn't just a neutral metric; it's a currency with inflation rates controlled by power. So, yes, it adds value. It highlights *strategic epistemic adaptation*.
          *   *Credibility as Harm:* Yes. If credibility is only granted to confessions of guilt, then "being credible" means "admitting to a lie." Credibility becomes synonymous with complicity.
      *   *Danforth and "Uphill" Injustice:*
          *   *The Student's Claim:* Danforth is lied to; therefore, he suffers TI.
          *   *The Counter:* TI requires a *prejudicial* credibility deficit. Danforth isn't disbelieved because of identity prejudice (gender, race, class). He is believed *too much* (excess). The liars (Abigail) exploit his excess credibility to weaponize him.
          *   *Is it Epistemic?* Danforth's problem isn't that he can't get testimony; it's that he refuses to update on counter-evidence (dogmatism/vice of rigidity). This is *epistemic vice* (Zagzebski), not necessarily *epistemic injustice* (Fricker). Injustice implies a victim/perpetrator dynamic rooted in power/prejudice. Danforth holds the power. He is epistemically *corrupted*, not *oppressed*.
          *   *Nuance:* There is a sense in which power insulates him from truth (epistemic bubble), but calling it "injustice against him" dilutes the term. It's better framed as the *corrupting effect of unchecked credibility excess*.
      *   *McCarthyism Allegory:*
          *   *Helps:* It grounds the epistemic breakdown in material political stakes. It shows HI isn't accidental; it's engineered.
          *   *Hurts:* It might reduce the epistemic tragedy to a political one. But actually, McCarthyism *was* an epistemic crisis (loyalty oaths, naming names). So it reinforces the social epistemology angle: knowledge is political.
      *   *The Ending (Proctor):*
          *   *The Tension:* Social epistemology says knowledge is communal. Proctor rejects the community's validation (the court) for an internal truth ("Because it is my name!").
          *   *Resolution:* Proctor isn't rejecting social knowledge; he's rejecting a *corrupted* epistemic community. He seeks a different audience (God, history, his children). It's not individualism vs. social; it's *authentic community* vs. *coerced consensus*. The play argues that sometimes preserving the *integrity* of the knower is a precondition for any future valid social knowledge.

