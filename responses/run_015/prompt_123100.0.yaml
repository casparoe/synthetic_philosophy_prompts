answer: |-
  **The Clinical Trial Scenario**

  You are a participant in a sedation study where a fair coin determines your schedule: Heads means you are woken on Day 1, interviewed, and discharged; Tails means you are woken on Day 1, interviewed, given an amnesia drug, woken on Day 2, interviewed, and discharged. Upon waking in a white room, you cannot tell the day or the coin outcome, but you are offered an optional neural scan that carries a fixed health risk cost of 5 units but yields a therapeutic benefit of 12 units *only if the coin landed Heads*. You must decide whether to consent to the scan right now, knowing that if you are in the Tails protocol, you will face this exact same choice again tomorrow with no memory of today's decision.

  ***

  **Analysis of the Decision**

  **What Each Side Says**
  The **Halfer** argues that upon waking, your credence that the coin landed Heads should remain 1/2, because the coin was fair and waking up provides no new information about the coin toss itself. Calculating the expected utility based on a 50% chance, the Halfer says: (0.5 × 12 benefit) − 5 cost = +1 unit. They conclude you should **consent** to the scan.

  The **Thirder** argues that upon waking, you should treat your current awakening as a random sample from all possible awakenings. Since there are three possible awakenings (Heads-Day1, Tails-Day1, Tails-Day2) and only one involves Heads, your credence in Heads is 1/3. Calculating the expected utility based on a 33% chance, the Thirder says: (0.33 × 12 benefit) − 5 cost = −1 unit. They conclude you should **decline** the scan.

  **The Philosophical Work**
  The feature doing the work is **self-locating evidence** (centered evidence). The disagreement isn't about the physics of the coin but about whether the fact "I am awake now" updates your probability based on *how many times* you wake up under each outcome. The Thirder treats the number of awakenings as relevant evidence favoring Tails (since Tails produces twice as many opportunities to be in this room), while the Halfer treats the awakening as a certainty under both hypotheses, rendering it irrelevant to the coin's probability.

  **Stripping the Feature**
  If you strip out the asymmetry—say, the study design guarantees exactly one awakening regardless of the coin flip (e.g., Tails also discharges you on Day 1)—both sides collapse to the same conclusion. Without the extra awakening in the Tails branch, there is no self-locating uncertainty about "which day" or "how many times," and both Halfers and Thirders agree the probability of Heads is 1/2. In that stripped version, both would calculate the expected value as positive and agree you should consent.

  **The Halfer's Attack**
  In this specific setup, the Halfer comes out badly pragmatically: if you follow their advice over many experiments, you lose health units on average because you pay the cost twice in Tails scenarios but only win the benefit once in Heads scenarios. A defender of the Halfer position would attack the case by arguing that the decision problem is rigged to punish rational belief. They would claim that a rational agent cares about the outcome of the *experiment* (the coin flip), not the frequency of *awakenings*. They would argue that charging the cost per awakening rather than per experiment exploits the subject's memory loss, and that maintaining a 1/2 credence is metaphysically correct even if the betting odds are stacked against you due to the study's administrative design.
