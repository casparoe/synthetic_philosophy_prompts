  **Project Proposal: The Reflexive Stability of Dennett's Cranes-and-Skyhooks Distinction**

  **Research Question and Context**
  The precise research question guiding this project is: Can the normative authority of the cranes-and-skyhooks framework—specifically its power to disqualify unexplained, top-down explanations in evolutionary and cognitive domains—survive a reflexive application of greedy reductionism? Daniel Dennett's distinction separates legitimate bottom-up explanatory processes (cranes) from illegitimate top-down miracles (skyhooks). While this taxonomy is robust when deployed outwardly, this project investigates whether the framework collapses when turned inward. If we attempt to reduce the distinction's critical force to bottom-up mechanisms, such as evolved heuristic scaffolding or social-epistemic reinforcement, do we preserve its explanatory power, or do we end up treating its own normative bite as an unexplained skyhook?

  **Gap in Current Treatments**
  Existing philosophical treatments typically deploy the framework outward against intelligent-design arguments or dualist intuitions. They utilize the distinction to critique external claims but avoid asking whether the framework requires what I term normative bootstrapping. This is the capacity of a bottom-up account to justify its own prescriptive authority without circular reliance on the very distinction it seeks to ground. Current literature leaves open whether the prohibition against skyhooks is itself a skyhook—a rule imposed from above rather than a structure built from below. This project addresses that lacuna by subjecting the framework to the same reductionist scrutiny it demands of others.

  **Methodological Approach**
  The analysis will proceed in three clear steps. First, I will reconstruct the crane-and-skyhook taxonomy and the concept of greedy reductionism in general philosophical terms, isolating the normative criteria used to distinguish them. Second, I will model two competing explanations of the distinction's authority: one treating it as an emergent epistemic scaffold built from simpler predictive and selective heuristics, and one treating its normative asymmetry—why cranes are legitimate and skyhooks are not—as irreducible. Third, I will apply a reflexivity test by asking whether each model can explain why greedy reductionism is a philosophical vice rather than a virtue without silently presupposing the answer. This step determines if the framework can account for its own validity using only the resources it permits.

  **Success and Failure Conditions**
  A successful result will look like a reconstructed, non-circular bottom-up account that preserves the framework's critical force against top-down explanations. It must demonstrate that the preference for cranes is itself a crane. Conversely, failure will look like the discovery that any reduction either dissolves the distinction entirely, rendering it descriptively useless, or leaves an unexplained normative residue that functions as a hidden skyhook. If the justification for rejecting skyhooks requires a skyhook, the framework fails the reflexivity test.

  **Scope and Limitations**
  The realistic scope of this project is tractable in one semester only if the analysis remains within philosophy of science and cognitive explanation. I will deliberately bracket applications to macrohistory, artificial intelligence, or normative ethics to maintain focus. An honest assessment of limitations must include the possibility that distinguishing the two models requires empirical premises about cognitive evolution that lie outside philosophical argument alone. If the reflexivity test depends on contingent facts about human cognition rather than conceptual necessity, the project will note this boundary condition rather than overreach.

  **Timeline**
  The semester will be divided into four phases. Weeks one through four will focus on reconstruction and literature review. Weeks five through eight will be dedicated to modeling the competing explanations. Weeks nine through twelve will involve applying the reflexivity test and drafting the core argument. The final three weeks will be reserved for revision, ensuring the final deliverable meets the five thousand-word count and polish standards required for a grant or term paper.

  Summary: The proposal asks whether Dennett's cranes/skyhooks distinction can survive reflexive greedy reduction without either dissolving or secretly relying on the unexplained normative authority it rejects.
