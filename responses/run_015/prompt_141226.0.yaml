answer: |-
  The stalemate is a substantive disagreement about the separability of persons and the moral status of non-existence, obscured by methodological reliance on intuition chains that hide the necessity of violating core rationality axioms. Your measurement-theoretic hypothesis correctly identifies that totalism requires non-existence to function as a fixed zero point on a ratio scale, whereas average-style views treat non-existence as undefined rather than zero, but this is not a verbal dispute where camps evaluate formally different objects; rather, it is a substantive clash over whether the addition of a person adds value to the world or merely alters the denominator of a distribution. Totalism commits to the ontological claim that non-existence is a value-bearing state equivalent to zero welfare, implying that any life above zero improves the outcome, while average utilitarianism commits to the claim that value is relational to the population size, implying that adding a life can worsen an outcome even if that life is worth living. Because these are competing claims about the moral significance of existence itself, rather than mere conventions of measurement, the disagreement is real and not dissolvable by clarifying scale types.

  The structural hypothesis explains the inertia of the debate: the A-to-Z chains are informal proofs of impossibility theorems, such as Arrhenius's, which demonstrate that conditions like Dominance, Transitivity, and Non-Elitism are jointly incompatible with avoiding the Repugnant Conclusion. These chains fail to move people because they present the conclusion as a moral failure rather than an axiomatic trade-off, allowing theorists to reject the conclusion without identifying which structural axiom they are abandoning to do so. Most theorists wish to retain Transitivity and Separability while avoiding the Repugnant Conclusion, but the formal results show this is impossible; the stalemate persists because camps defend their intuitions about outcomes rather than defending the structural constraints that generate those outcomes, leaving the debate in a state of reflective equilibrium where everyone rejects the implications of their own axioms.

  The temporal twin wrinkle is the most promising front for progress because it isolates the variable of Person Separability. If the same additive structure generates the Repugnant Conclusion both interpersonally and intrapersonally, yet theorists accept the intrapersonal version (a long mediocre life beats a short great one) while rejecting the interpersonal version, the disagreement is not about welfare aggregation but about whether persons are distinct vessels of value or mere containers for welfare moments. Totalism and critical-level views treat welfare units as fungible across time and persons, implying the interpersonal and intrapersonal cases should stand or fall together, whereas theories that distinguish them commit to a Person-Affecting Restriction or a Separability Axiom that treats existing persons differently from potential persons.

  Therefore, progress consists in **distinguishing or collapsing the interpersonal and intrapersonal versions** through a rigorous axiomatic analysis that determines whether the Repugnant Conclusion can be avoided in the interpersonal case without accepting it in the intrapersonal case. If the two can be decoupled, the debate shifts to justifying the moral significance of person-boundaries over welfare-units; if they cannot be decoupled, those who accept the intrapersonal version but reject the interpersonal version are committed to an indefensible inconsistency, forcing a choice between accepting the Repugnant Conclusion or abandoning transitivity and separability explicitly. Settling the scale type of well-being is secondary to settling whether the zero point represents a moral baseline or an absence, and new impossibility results are only useful insofar as they clarify which axioms must be sacrificed to preserve the distinction between persons.
