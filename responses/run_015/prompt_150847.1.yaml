answer: |-
  **Subject: [FAQ] Epistemic Scheduling 301 - Spring Term Policies (Copy-Paste from Dept)**

  **Q: When will the cumulative assessment occur?**
  A: The exam will take place on one weekday during the final week of lectures. However, per Administrative Clause 7.4 (The Surprise Mandate), the exam cannot occur on Friday. If the assessment has not taken place by Thursday evening, the Friday slot becomes deducible. A deducible slot violates the requirement for epistemic surprise. Therefore, Friday is administratively void.

  **Q: Does this elimination apply to Thursday?**
  A: Yes. Since Friday is ineligible, Thursday becomes the final possible day. By Wednesday close-of-business, a rational student would deduce that Thursday is the only remaining option. This knowledge destroys the surprise condition. Consequently, Thursday is also removed from the scheduling window. This inductive elimination propagates backward through Wednesday, Tuesday, and Monday. Technically, no day satisfies the conditions. However, attendance is still mandatory during the window.

  **Q: How is grading calculated if the exam cannot logically exist?**
  A: Grading is binary. You pass if you are genuinely surprised by the exam's occurance. You fail if you predicted the day correctly. If you argue that the exam was impossible based on the syllabus, you admit to possessing prior knowledge, which results in an automatic fail. If you claim you knew nothing, you validate the surprise, but you must still complete the test. Please note: claiming the exam is invalid is considered a submission of answers.

  **Q: What is the procedure for make-up exams?**
  A: Make-up exams are not available. To schedule a make-up is to announce a specific time, which destroys the surprise element required for credit. Students who miss the initial window due to logical deduction errors will recieve an Incomplete. There is no mechanism to surprise a student twice about the same event.

  **Q: Can I appeal the grade if I knew it was coming?**
  A: Appeals are processed via Form 27-B/6. However, the appeals process contains a self-referential constraint. To appeal, you must state why the exam was not a surprise. If your argument is valid, it proves you were not surprised, confirming the failing grade. If your argument is invalid, the original grade stands. Furthermore, submitting an appeal confirms you expected an administrative response, which is itself a predictable outcome.

  **Q: What if the professor announces the exam won't happen?**
  A: If the department announces the exam is cancelled, you may expect no exam. However, if no exam occurs, the original promise of an exam was false. If the exam then occurs anyway, it is surprising, thus valid. If it does not occur, the promise was a lie, but you cannot be graded on a lie. Definatly consult your advisor before relying on cancellation rumors.

  **Q: Is attendance required on days eliminated by logic?**
  A: Yes. You must be present to be surprised. Absence implies you deduced the exam would not happen, which is a claim of knowledge. Claims of knowledge without proof are treated as cheating. Please arrive at 9:00 AM daily. Bring a pen. Do not bring a calendar.

  **Q: Who do I contact for scheduling conflicts?**
  A: Contact the Department of Temporal Logic. Be advised: scheduling a meeting requires agreeing on a time. Agreeing on a time makes the meeting expected. Expected meetings are not surprises. We will call you when we are ready. You will not know when.
