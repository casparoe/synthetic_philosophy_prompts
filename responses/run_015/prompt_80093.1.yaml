answer: |-
  **Brainstorming Candidates**

  1.  **Leafcutter Trail Severance:** A solvent wash removes the pheromone trail on a main foraging artery; the colony loses optimized traffic direction to the richest leaf source (complex) while individual ants continue to exit the nest and wander (simple).
  2.  **Harvester Contact Block:** A physical baffle at the nest entrance prevents returning foragers from touching antennae with outgoing ants; the colony loses adaptive foraging rate regulation (complex) while individuals still leave to search (simple).
  3.  **Army Ant Bivouac Isolation:** The queen is physically separated from the raiding column during a swarm; the colony loses coordinated raid cohesion (complex) while individual soldiers remain aggressive and mobile (simple).

  **Selection**
  I am selecting the **Harvester Contact Block**. It relies on the well-documented *Pogonomyrmex barbatus* interaction rate mechanism (Gordon et al.), which offers the cleanest distinction between "executive regulation" (colony-level goal maintenance) and "motor action" (individual movement), mirroring the cognitive/organizational divide more sharply than pathfinding or cohesion cases.

  **Scenario**

  A mature *Pogonomyrmex barbatus* (red harvester) colony operates normally until an experimenter installs a transparent baffle at the nest entrance that physically prevents returning foragers from making antennal contact with outgoing potential foragers, severing the tactile feedback channel without blocking movement. Immediately, the colony loses its ability to modulate the rate of foraging effort in response to fluctuating seed availability—a complex, adaptive regulatory capacity—while individual ants continue to exit the nest and search for food using intact visual and olfactory cues. The colony behaves as if it has lost the executive function to balance energy expenditure against intake, yet retains the motor function of locomotion and local search, mimicking a focal neurological lesion where higher-order integration fails while basic reflexes persist.

  **Check**

  1.  **Case Specification:**
      *   **Colony:** *Pogonomyrmex barbatus* (red harvester ant).
      *   **Intervention:** Physical baffle at nest entrance blocking antennal contact between returning and outgoing foragers (severing the tactile communication channel).
      *   **Deficit:** Loss of adaptive foraging rate regulation (colony-level homeostasis).
      *   **Intact:** Individual exit behavior and local search patterns (individual-level locomotion).

  2.  **Camp F (Superorganist) Analysis:**
      Camp F argues this confirms the colony has a mind because the deficit mirrors a cognitive lesion rather than a mechanical breakdown. Their principle states that minds are defined by functional hallmarks like integrated, adaptive behavior and goal hierarchies. The lost capacity (regulating effort against intake) is precisely the "executive function" required to maintain the colony's homeostatic goal. Because the deficit is focal—stripping the system of adaptive regulation while leaving motor routines intact—it demonstrates that the colony possessed a modular cognitive architecture where the "regulatory module" was dependent on that specific channel. The channel wasn't just a pipe; it was the neural pathway for the colony's decision-making process.

  3.  **Camp I (Organizationalist) Analysis:**
      Camp I argues this confirms the colony is merely an organization because the deficit is fully explained by network topology changes without invoking mental states. Their principle states that colony behavior is an emergent pattern from individuals following local rules. The "regulation" was never a mental state but a flow rate determined by the probability of antennal contact. By severing the channel, the experimenter altered the network's input parameters, changing the emergent output (foraging rate) just as closing a lane on a highway changes traffic flow without hurting the "mind" of the traffic system. The individuals are still following the same local rules; the "complex capacity" was just a statistical aggregate that vanished when the interaction frequency dropped.

  4.  **The Crux:**
      The single structural feature doing the work is the **ontological status of the regulatory feedback loop**. Camp F views the feedback loop as a cognitive control mechanism (information processing for goal maintenance), while Camp I views it as a network constraint (physical interaction rate determining flow).

  5.  **Removing the Feature:**
      If the deficit were made **global** (e.g., the intervention stops all ants from leaving the nest), the case collapses toward **Camp I**. A total shutdown looks like a broken machine or a dead organization, which both camps agree is non-functional. The *focal* nature of the deficit is essential for Camp F to argue for modular cognitive architecture (mind-like); without it, there is no distinction between "losing a mental capacity" and "breaking the system," weakening the superorganist analogy to a brain lesion.

  6.  **Strongest Attacks:**
      *   **Camp F attacking Camp I:** "You are committing a substrate chauvinism error; if the functional profile of the feedback loop is isomorphic to neural regulation, denying it mental status simply because it is made of ants rather than neurons is arbitrary dualism."
      *   **Camp I attacking Camp F:** "You are reifying a statistical correlation into a causal agent; the colony doesn't 'decide' to forage less, the probability of exit drops because the trigger (contact) is missing, and calling that a 'mind' conflates description with ontology."

  Verdict: The ontological status of the regulatory feedback loop
