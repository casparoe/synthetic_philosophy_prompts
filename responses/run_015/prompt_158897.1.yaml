answer: |-
  # The "Who Exists?" Intuition Quiz

  There are ten scenarios below. For each, pick the **one** answer that best matches your gut verdict. Don't overthink it, and don't try to guess which answer is "consistent" with your previous ones. We are looking for where your intuitions actually sit, not where you think they should sit.

  **1. The Teenage Mother**
  A 14-year-old girl chooses to have a baby now. If she waited until she was 25, she would be richer and more stable, and would have a *different* child (because a different egg and sperm would meet). The child born now has a hard life, but it's still worth living. The child born later would have had a much better life.
  *   **A.** It's not wrong in a way that harms the child, because without this choice, *this* child wouldn't exist at all.
  *   **B.** It is wrong, because she should have brought about the better outcome, even if it means a different person exists.
  *   **C.** It's wrong, but not because of the outcome; it's wrong because she's treating the child as a means to her own ends.
  *   **D.** You can't compare the two children, so you can't say one choice is better than the other.

  **2. The Factory Leak**
  A factory leaks a chemical. This leak causes a birth defect in a child, but the leak also inadvertently caused the parents to meet at the hospital, meaning *this specific child* owes their existence to the leak. Without the leak, a different, healthy child would have been born later.
  *   **A.** The factory hasn't harmed *this* child, because the alternative for them was non-existence.
  *   **B.** The factory did wrong because they created a situation where a defective child exists instead of a healthy one.
  *   **C.** It depends on whether the factory intended the leak or was just negligent.
  *   **D.** The child has a claim for compensation, even if they aren't "worse off" than they would otherwise have been.

  **3. The Hospital Budget**
  A hospital has enough money for one of two programmes. Programme A saves the lives of ten children currently in the ward. Programme B prevents a policy that would cause ten *future* children to be born with a disability (but those future children would still have lives worth living).
  *   **A.** You must fund Programme A; existing people always count more than future people.
  *   **B.** You should fund whichever programme creates the most overall wellbeing, regardless of who exists.
  *   **C.** You should fund Programme B, because preventing disability is more important than saving lives.
  *   **D.** There is no right answer; the choice is tragic but not morally resolvable.

  **4. The Flood Defence**
  Your council is planning a flood defence for 50 years' time. Option X is cheaper but means a different set of people will be conceived in the affected area over the decades (due to lifestyle changes). Those future people will have lives worth living, but Option Y would have produced different people with significantly better lives.
  *   **A.** It doesn't matter for those future people; you can't harm someone by choosing the policy that allows them to exist.
  *   **B.** You should choose Option Y, because it brings about a better future state of affairs.
  *   **C.** You should choose Option Y, but only because the current voters demand it, not for the sake of the future people.
  *   **D.** It matters how similar the people in Option X are to the people in Option Y.

  **5. The Embryo Choice**
  Your sister is doing IVF. She has two embryos. Embryo A is likely to develop into a person with a chronic illness. Embryo B is likely to develop into a different person who will be healthy. She picks A.
  *   **A.** She hasn't wronged the child from Embryo A, as they wouldn't exist otherwise.
  *   **B.** She has done wrong by selecting the worse life when a better one was available.
  *   **C.** It's her choice; morality doesn't apply to which embryo is selected.
  *   **D.** She has wronged the *potential* child from Embryo B by not letting them exist.

  **6. The Population Size**
  We can choose Policy Big or Policy Small. Policy Big leads to a huge population where everyone has a life that is just barely worth living. Policy Small leads to a smaller population where everyone is very happy. The total sum of happiness is higher in Policy Big.
  *   **A.** Policy Big is better because there is more total happiness in the world.
  *   **B.** Policy Small is better because the average quality of life is higher.
  *   **C.** Policy Small is better because we have no duty to create more happy people, only to avoid miserable ones.
  *   **D.** Neither is better; you can't compare a world with more people to one with fewer.

  **7. The Similarity Check**
  A woman takes medication that slightly alters the conception date. The child born has a disability. If she had waited a month, the child would have been 95% genetically identical, raised in the same home, but healthy.
  *   **A.** It's still not a harm to *this* child, because they are numerically different people.
  *   **B.** It feels much worse than the teenage mother case because the alternative person is so similar.
  *   **C.** It makes no difference; different conception means a different person, full stop.
  *   **D.** It's wrong because she failed to produce the healthy version of *this* almost-same person.

  **8. The Baseline**
  A government policy actively changes who is born in the next century (e.g., through tax incentives for parents). A different policy would have left conception to chance (inaction). The "active" policy leads to worse-off people than the "inaction" policy would have.
  *   **A.** It's only wrong if the active policy makes people worse off than they would have been under *that same policy*.
  *   **B.** It's wrong if the active policy makes people worse off than they would have been under *any* alternative policy.
  *   **C.** It's wrong if the active policy makes people worse off than if the government had done *nothing at all*.
  *   **D.** The baseline doesn't matter; only the final outcome counts.

  **9. The Uncertainty**
  You are about to make a choice. You know there is a 50% chance it will change which people exist in the future, and a 50% chance it will just affect the same people. The outcome is bad either way.
  *   **A.** If it turns out the people are different, you haven't harmed them, so the 50% risk doesn't matter.
  *   **B.** You shouldn't take the risk, because it might turn out you harmed specific existing people.
  *   **C.** You shouldn't take the risk, because bringing about a bad outcome is wrong regardless of the identity odds.
  *   **D.** The uncertainty makes it impossible to judge until you know the result.

  **10. The Concentration**
  Option 1 causes one future child to be born with a severe disability. Option 2 causes one million future people to be born with a very slight headache for a day. Both options change who exists.
  *   **A.** Option 1 is worse; severe harm to one person outweighs tiny harms to many.
  *   **B.** Option 2 is worse; the total amount of suffering is greater.
  *   **C.** Neither is "harm" in the strict sense, so both are permissible.
  *   **D.** Option 1 is wrong because it uses the child; Option 2 is just a statistical side-effect.

  ***

  # Scoring Key & Position Mapping

  Count up which letter you picked most often. If you have a split, look at the "Mixed Signals" section below.

  **Mostly A: The Narrow Person-Affecting View**
  *   **Gloss:** An act is only wrong if it makes a *specific, identifiable* person worse off than they would otherwise have been.
  *   **Awkward Consequence:** You cannot claim that choosing to create a disabled child instead of a healthy one harms the disabled child, because without that choice, they wouldn't exist to be harmed.

  **Mostly B: The Impersonal Total View (Total Utilitarianism)**
  *   **Gloss:** Identity doesn't matter; what matters is maximising the total sum of wellbeing in the outcome, regardless of who exists.
  *   **Awkward Consequence:** You are morally required to create as many people as possible as long as their lives are barely worth living (The "Repugnant Conclusion").

  **Mostly C: The Asymmetric / Negative View**
  *   **Gloss:** We have a strong duty not to create people who will suffer, but no duty to create people who will be happy.
  *   **Awkward Consequence:** You can't explain why it's good to have children, only why it might be bad; also struggles to explain why we should save existing lives over preventing future suffering.

  **Mostly D: The Incomparability / Sceptical View**
  *   **Gloss:** Outcomes involving different people are fundamentally different kinds of things and cannot be ranked against each other.
  *   **Awkward Consequence:** Paralysis. If we can't compare futures, we can't rationally plan long-term policies like flood defences or climate action.

  **Mixed Signals (Specific Combinations)**
  *   **Mostly B, but Q6 was 'Average':** You are an **Average Utilitarian**. You care about identity-irrelevant outcomes, but you want to maximise the *average* happiness, not the total. *Awkward Consequence:* You might be forced to eliminate unhappy people to raise the average.
  *   **Mostly A, but Q2 or Q7 was 'B':** You are a **Similarity-Sensitive Person-Affecter**. You think identity usually blocks harm claims, but if the alternative person is "close enough," it counts. *Awkward Consequence:* There is no clear line for how similar is "similar enough" (the Sorites problem).
  *   **Mostly A, but Q9 was 'B' or 'C':** You are an **Uncertainty-Sensitive Person-Affecter**. You hold the narrow view, but admit that *risking* harm to identifiable people makes an act wrong, even if the risk doesn't materialise. *Awkward Consequence:* Logically unstable; if the act isn't wrong when the risk fails, why is it wrong when the risk is taken?
  *   **Mostly B, but Q10 was 'A':** You are a **Prioritarian**. You care about the total, but you weigh harms to individuals more heavily than scattered small harms. *Awkward Consequence:* Hard to define mathematically without arbitrary weighting.

  ***

  # The Empty Boxes: Combinations Nobody Holds

  You asked to know which combinations of answers are logically empty. Based on how people actually answer these, here are the patterns that almost never occur, and why.

  **1. The "Identity Matters for Harm, But Not for Benefit" Combo**
  *   **The Pattern:** Saying "You can't harm a child by creating them with a disability" (Q1/Q2 Option A) BUT "You *do* benefit a child by creating them with a happy life" (Q6 Option A).
  *   **Status:** **Incoherent.**
  *   **Why:** If existence itself is the baseline for comparison, it must work both ways. You can't say existence is neutral for harm calculations but positive for benefit calculations without a arbitrary rule switch. Most people who try to hold this end up sliding into the Asymmetric view (Mostly C).

  **2. The "Similarity Matters, But Only for Strangers" Combo**
  *   **The Pattern:** Saying "It matters that the alternative child in Q7 was 95% similar" BUT "It doesn't matter in Q5 (Embryos) that the alternative embryo was the sister's own genetic child."
  *   **Status:** **Unattractive.**
  *   **Why:** This implies genetic relatedness matters for morality in one context but not another. People who care about similarity usually apply it consistently across IVF and natural conception. Those who don't, usually dismiss similarity entirely.

  **3. The "Uncertainty Ignorance" Combo**
  *   **The Pattern:** Saying "Identity changes mean no harm is done" (Q1 Option A) BUT "The 50% uncertainty in Q9 makes no difference to the verdict."
  *   **Status:** **Unexplored / Rare.**
  *   **Why:** Most people feel that *risking* harm to identifiable people is wrong, even if the harm doesn't happen. Holding the Narrow View (A) consistently usually forces you to say the uncertainty doesn't matter, which feels deeply counter-intuitive to almost everyone, so people abandon the Narrow View before they abandon the intuition that risk is bad.

  **4. The "Concentration Blindness" Combo**
  *   **The Pattern:** Saying "Total sum matters most" (Q6 Option A) AND "One million headaches outweigh one severe disability" (Q10 Option B).
  *   **Status:** **Theoretically Possible, Humanly Rare.**
  *   **Why:** This is pure mathematical Total Utilitarianism. While logically consistent, almost no humans actually feel this in their gut when presented with the severe disability case. They usually pivot to Prioritarianism (weighing the severe harm more).

  ***

  # Limitations: Where This Quiz Can't Separate You

  I promised to be straight about where this tool fails. There are two major blind spots where different theories produce the exact same answers.

  **1. Total Utilitarianism vs. "Identity Irrelevant" Intuitions**
  If you picked mostly **B**, you might be a committed Total Utilitarian (philosophical theory), or you might just have a strong intuition that "better outcomes are better" without caring about the sums. This quiz cannot tell the difference. To separate these, you'd need to ask about extreme mathematical cases (like the "Repugnant Conclusion" in Q6) where the theory forces a result the intuition rejects. If you accepted Q6 Option A without flinching, you're likely a theorist. If you hesitated, you're an intuitionist.

  **2. Contractualism vs. Person-Affecting Views**
  If you picked mostly **A** or **C** in Q1/Q2, you might believe "Only specific people count" (Person-Affecting). Or, you might believe "No one can reasonably reject this principle" (Contractualism). These often yield the same verdicts in non-identity cases. The quiz treats them as the same "Narrow" cluster. To separate them, you'd need to ask about duties to oneself or promises made to people who subsequently die—cases this quiz doesn't cover.

  **3. The "Similarity" Trap**
  In Q7, if you picked **B**, the quiz labels you "Similarity-Sensitive." However, it doesn't tell you *why*. Is it because you think genetic similarity creates a partial identity? Or because you think the *parents'* experience of loss is what matters? The quiz records the verdict, but not the underlying reason, which is likely where your month-long argument is actually stuck.

  ***

  # How to Use This to Settle the Argument

  1.  **Take it separately.** Do not discuss answers until everyone has finished all ten questions.
  2.  **Compare the "Mostly" letters.** If three of you are 'A' and one is 'B', you know the disagreement is fundamental (Person-Affecting vs. Impersonal).
  3.  **Look at the splits.** If you all score 'A' generally, but everyone picked 'B' on Q7 (Similarity) or Q9 (Uncertainty), then you actually agree on the theory but disagree on whether *exceptions* exist. Your argument isn't about "which theory," it's about "how messy the real world is."
  4.  **Check Q8 (Baseline).** This is the one that usually flips the Flood Defence argument. If half the group picked B and half picked C, you have found the exact source of the deadlock. One half is comparing the policy to the *ideal alternative*, the other half is comparing it to *inaction*. No amount of theory will fix that until you agree on the baseline.

  Good luck. You'll probably still disagree, but at least you'll know exactly where.
