prompt: |-
  I chair the behavior-support committee at a nonprofit that runs eleven group homes for adults with profound intellectual and multiple disabilities. My younger sister moved into one of them two years ago, so I now also see the output of our process from the family side, which is part of why I'm asking. Every resident has a written preferences-and-goals plan, rewritten annually and reviewed quarterly, signed off by a state regulator; in practice that document determines how a person spends their days — what they are offered, what they are taken to, what staff will wake them for, what gets removed from their environment as a safety risk. None of the residents use speech, so every one of these plans is inferred from behavior. Our current method is essentially a frequency count: over a two-week structured trial a support worker offers a pair of options ten times, and whichever one the resident approaches, reaches toward, or looks at longer gets written into the plan as a preference. The workers who run the trials have high-school educations, no statistics, about fifteen minutes per trial, and usually two or three other residents to supervise at the same time; anything I hand them has to fit on one laminated sheet, use no equipment the unit doesn't already have, and hold up when a reviewer asks how we know.

  I recently read about inverse reinforcement learning — inferring an agent's reward function from its observed actions — in a machine-learning context, and it made me anxious about our own practice in a way I can't fully articulate to my committee. The parts I keep circling are these. First, behavior underdetermines the reward function: many different orderings of how much someone cares generate exactly the same choices, and, counterintuitively, a person who always picks the same thing tells you less about the strength of the preference than someone who mostly picks it but occasionally doesn't. Second, choices are made against an option set that we constructed, and a long history of being offered almost nothing can itself shrink what a person reaches for, so a frequency count can quietly launder staff convenience and institutional routine into the resident's own preferences. Third, motor effort, positioning, staff cueing, satiation, and fear of the alternative all move behavior in the same direction that liking does, and our trials don't separate them. Fourth — and this is the one I'm least sure I've got right — a reward function inferred from someone's behavior is not automatically the thing we ought to be serving; there may be cases where the plan should say something about what we owe the person rather than what they'd pick. I'd like the procedure to preserve those four worries while being usable by someone who will never read the theory, and to be honest about which of them it has quietly dropped.

  So: please write me a decision procedure my committee can adopt for turning observed behavior into a sentence in a plan. In order, the questions to ask; what counts as a sufficient answer to each; which tests a support worker can actually run in fifteen minutes on the unit; where the procedure stops and returns no inference is licensed from this behavior; and where it hands the question to a named human being — the resident where possible, otherwise a family member or an advocate — because it is a judgment about values and not a matter of evidence at all. The output should be a plan sentence a regulator can audit, not a preference ordering, and I'd like it to allow sentences that are instructions to staff about the environment rather than claims about what the resident wants. Then run it on three cases: a resident who picks the quiet room over the music room nine times out of ten (I want to know whether that means she seeks quiet or is avoiding noise, and the plan sentences differ); a resident who reaches for a cookie more often than an apple when the apple is placed slightly farther away and reaching is effortful for her; and a resident who has refused every offered activity for two years and now spends most of the day in bed, where I suspect the honest answer is that the behavior is underdetermined and the right move is something other than writing down a preference. At least one of these should come out somewhere my current frequency count would not have gone, and at least one should be marked as a case the procedure cannot settle. Finally, tell me where the procedure will misfire — which residents, which kinds of option, which staff behaviors — and what a reviewer should look for to notice that it has.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a behavior-support committee at a nonprofit running 11 group homes for adults with profound intellectual and multiple disabilities (PIMD). Also has a sister in one of the homes.
      *   **Context:** Residents have no speech. Preferences/goals plans are inferred from behavior. Current method: 2-week trial, 10 offers, frequency count of approach/look.
      *   **Constraints:** Staff have HS education, no stats, 15 mins/trial, multitasking. Materials must fit on one laminated sheet, use existing equipment, withstand regulatory audit.
      *   **Core Concerns (The "Four Worries"):**
          1.  *Underdetermination:* Same behavior $\neq$ same preference strength. Consistency $\neq$ intensity.
          2.  *Option Set Bias:* Choices are constrained by staff/institution. Learned helplessness/adaptation.
          3.  *Confounds:* Motor effort, positioning, cueing, satiation, fear vs. liking.
          4.  *Normative Gap:* Inferred reward $\neq$ what we *ought* to serve (paternalism/benefit vs. choice).
      *   **Task:** Create a decision procedure (algorithm/checklist) for turning behavior into a plan sentence.
      *   **Requirements:**
          *   Order of questions.
          *   Sufficient answers.
          *   Feasible tests (15 mins, unit-based).
          *   Stop conditions (no inference licensed).
          *   Hand-off conditions (human judgment needed).
          *   Output: Audit-ready plan sentences (can be environmental instructions, not just preference claims).
          *   Run on 3 specific cases (Quiet vs. Music, Cookie vs. Apple, Bed/Refusal).
          *   Identify failure modes (where it misfires, what reviewers should look for).
          *   Must address the "Four Worries" explicitly (preserve some, drop others honestly).

  2.  **Deconstruct the "Four Worries" for the Procedure:**

      *   *Worry 1 (Underdetermination):* We can't solve this mathematically with HS staff. We must acknowledge uncertainty in the *wording* of the plan. Instead of "Resident likes X," use "Resident chooses X when offered."
      *   *Worry 2 (Option Set Bias):* We need a check for "Have we offered enough variety?" and "Is this new?"
      *   *Worry 3 (Confounds):* We need specific control trials (effort, positioning) that fit in 15 mins.
      *   *Worry 4 (Normative Gap):* We need a specific trigger for "This looks like a need, not a want" or "This looks harmful."

  3.  **Drafting the Procedure (The "Behavior-to-Plan Protocol"):**

      *   *Format:* Needs to be a flowchart or step-by-step list suitable for a laminated sheet.
      *   *Step 1: The Setup (Addressing Worry 2).* Ensure options are accessible and comparable.
      *   *Step 2: The Observation (Addressing Worry 3).* Control for effort/position.
      *   *Step 3: The Interpretation (Addressing Worry 1).* Distinguish approach vs. avoidance.
      *   *Step 4: The Normative Check (Addressing Worry 4).* Is this safe/good?
      *   *Step 5: The Wording.* Specific syntax for the plan.

      *Refining for Constraints:* Staff have 15 minutes. They can't do complex ABAB designs. They *can* swap positions or distances. They *can* note body tension.
      *Refining for Audit:* The plan sentence needs to be defensible. "Resident prefers" is risky if it's actually "Resident tolerates." "Staff will provide" is safer.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Quiet vs. Music):* 9/10 Quiet.
          *   *Current Method:* "Prefers Quiet."
          *   *New Method:* Check for avoidance behavior (tensing up at music door?). Distinguish "Seeks Quiet" vs. "Avoids Noise." Plan sentence should reflect the *function*.
      *   *Case 2 (Cookie vs. Apple):* Cookie chosen, but Apple farther away.
          *   *Current Method:* "Prefers Cookie."
          *   *New Method:* Control for distance. If Cookie still chosen at equal distance, okay. If Apple chosen when closer, then it was effort, not food preference. Plan sentence needs to account for motor access.
      *   *Case 3 (Bed/Refusal):* 2 years refusal.
          *   *Current Method:* "Prefers bed/low stimulation" (or blank).
          *   *New Method:* Stop. Underdetermined. Hand off to advocate/family for "Best Interest" determination. This addresses Worry 4 and 1.

  5.  **Addressing the "Inverse Reinforcement Learning" Anxiety:**

      *   The user is worried that inferring reward from behavior is flawed. The procedure must admit this. It shouldn't claim to know the *internal state* (reward function), only the *reliable behavioral outcome*.
      *   *Honesty:* The procedure must explicitly state where it gives up (Case 3) and where it shifts from "preference" to "support need."

  6.  **Writing the Plan Sentences:**

      *   Regulators want clarity.
      *   Bad: "John likes music." (Unverifiable internal state).
      *   Good: "When offered music or quiet, John enters the music room 90% of the time." (Observable).
      *   Better (Normative): "Staff will ensure John has access to quiet space when he shows signs of distress."

  7.  **Identifying Failure Modes:**

      *   Where will this break?
      *   Staff burnout/rushing.
      *   Subtle micro-expressions missed.
      *   Fluctuating health conditions.
      *   "Compliance" masking as preference.

  8.  **Review against Constraints:**

      *   *One laminated sheet?* The core algorithm needs to be concise. I will provide the detailed explanation first, then a "Field Card" version.
      *   *15 minutes?* The tests must be quick swaps.
      *   *No stats?* Use simple counts (e.g., "More than 7 out of 10").
      *   *Audit ready?* Yes, focuses on observable data and clear hand-offs.

  9.  **Final Polish:**

      *   Tone: Professional, empathetic, rigorous, acknowledging the gravity of the situation (the user's sister is in this system).
      *   Ensure the distinction between *Preference* (Choice) and *Requirement* (Need) is clear.
      *   Make sure the "Hand-off" is explicit. Who? Family/Advocate. When? When behavior is ambiguous or safety is at risk.

  **(Self-Correction during drafting):** I initially thought about suggesting a "switch test" for the Cookie/Apple case. But if the apple is farther, that's a confound. The procedure needs to mandate *equalizing* the confound first. If the resident *still* picks the cookie when effort is equal, it's a food preference. If they pick the apple when it's closer, it was an effort preference. The plan sentence must reflect *access*, not just food.
  For the Bed case, I need to make sure I don't just say "do more trials." The prompt implies 2 years of data. The procedure needs to recognize "Chronic Non-Response" as a specific category requiring ethical review, not more data collection.

  10. **Final Structure:**
      *   Introduction acknowledging the weight of the task.
      *   The "Behavior-to-Plan Protocol" (The Field Card).
      *   The Logic (explaining how it handles the 4 worries).
      *   The Three Cases (Applied).
      *   Failure Modes & Audit Flags.

