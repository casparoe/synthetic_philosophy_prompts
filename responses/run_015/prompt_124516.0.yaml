answer: |-
  This is a profound and necessary critique of your current system. You are correct that frequency counts conflate *capacity* with *preference*, and *avoidance* with *liking*. In machine learning terms, you are trying to solve an inverse reinforcement learning problem with noisy, low-bandwidth data and a high cost of error (human dignity).

  Below is a decision procedure designed for your constraints (15 minutes, laminated, no stats) that explicitly encodes your four worries. It shifts the output from "This is what they want" to "This is how we will respond to what they do," which satisfies regulators while preserving ethical nuance.

  ### Part 1: The Field Card (The Procedure)

  *Print this on one side of a laminated sheet. The reverse side contains the Plan Sentence Templates.*

  **BEHAVIOR-TO-PLAN PROTOCOL (B2P)**
  **Time Limit:** 15 Minutes | **Equipment:** Timer, Tape Measure, Data Sheet

  **STEP 1: THE SETUP CHECK (Worry 2: Option Set Bias)**
  *Before counting choices, verify the options are fair.*
  1.  **Distance:** Are both options within the same reachable distance? (Measure: within 6 inches of each other).
  2.  **Effort:** Does reaching either option require the same body movement? (e.g., both require left-hand reach).
  3.  **History:** Has the resident been offered Option B at all in the last 30 days?
      *   *If NO to any:* **STOP.** Adjust setup. Do not record data.
      *   *If YES to all:* Proceed to Step 2.

  **STEP 2: THE CONFOUND SWAP (Worry 3: Motor/Cueing)**
  *Run 3 trials. Then swap the physical position of the options (Left becomes Right). Run 3 more trials.*
  *   **Question:** Does the resident choose the same *object/activity* regardless of where it is placed?
      *   *If NO (they follow the position, not the object):* **STOP.** Inference: Positional Habit. **Hand-off to OT/PT.**
      *   *If YES:* Proceed to Step 3.

  **STEP 3: THE TENSION CHECK (Worry 1: Avoidance vs. Approach)**
  *Watch the resident's body during the 2 seconds BEFORE they choose.*
  1.  **Relaxed:** Shoulders down, breathing steady, leaning in. $\rightarrow$ Count as **Approach**.
  2.  **Tense:** Shoulders up, holding breath, leaning back, turning head away before reaching. $\rightarrow$ Count as **Avoidance**.
  *   **Rule:** If 5 or more choices are marked **Avoidance**, do not write a Preference. Write a **Safety/Comfort Instruction**.
  *   **Rule:** If 5 or more choices are marked **Approach**, proceed to Step 4.

  **STEP 4: THE NORMATIVE GATE (Worry 4: Ought vs. Is)**
  *Look at the chosen option.*
  1.  **Harm:** Does this choice risk physical harm or severe isolation (e.g., refusing all food, choosing only bed)?
      *   *If YES:* **STOP.** Do not write preference. **Hand-off to Committee/Family for "Best Interest" Plan.**
  2.  **Benefit:** Does this choice support health or engagement?
      *   *If YES:* Write **Preference Sentence**.
  3.  **Neutral:** Is it harmless but passive (e.g., staring at wall vs. staring at window)?
      *   *If YES:* Write **Environmental Instruction**.

  **STEP 5: THE HAND-OFF TRIGGER**
  *Mark this box if any apply:*
  *   [ ] Resident chose neither option 8 out of 10 times.
  *   [ ] Resident showed signs of distress (crying, self-injury) during trial.
  *   [ ] Resident has refused all activities for > 6 months.
  *   **Action:** File as "Undetermined." Schedule Family/Advocate Review within 14 days.

  ***

  ### Part 2: Plan Sentence Templates (For the Regulator)

  *Do not write "Resident likes X." Use these auditable structures.*

  **Type A: Verified Preference (Passed Steps 1-4)**
  > "When offered [Option A] and [Option B] under equal conditions, [Resident] selected [Option A] in [X] of 10 trials. Staff will prioritize offering [Option A] during [Time of Day]."

  **Type B: Avoidance/Comfort (Failed Step 3 Tension Check)**
  > "[Resident] displays signs of physical tension when [Option B] is present. Staff will ensure [Option B] is removed or minimized to reduce distress, regardless of selection frequency."
  *(Note: This captures "Avoids Noise" rather than "Seeks Quiet".)*

  **Type C: Access/Instruction (Failed Step 1 Setup or Step 2 Swap)**
  > "[Resident] selects [Option A] only when it is placed within [X] inches of dominant hand. Staff will position [Option A] accordingly to enable choice."
  *(Note: This admits the preference is confounded by motor access, solving the Cookie/Apple problem.)*

  **Type D: Ethical Hand-Off (Triggered Step 4 or 5)**
  > "Behavioral data is insufficient to determine preference due to [Chronic Refusal / Distress]. Care Plan is based on Family/Advocate consultation regarding Best Interest, to be reviewed [Date]."

  ***

  ### Part 3: Application to Your Three Cases

  Here is how the B2P Protocol changes the outcome compared to your current frequency count.

  **Case 1: Quiet Room (9/10) vs. Music Room**
  *   **Current Method:** "Resident prefers Quiet Room."
  *   **B2P Application:**
      *   *Step 3 (Tension Check):* Staff notice that when the Music door is open, the resident hunches shoulders and holds breath before turning to the Quiet room.
      *   *Result:* 9/10 choices are marked **Avoidance**.
      *   *Plan Sentence (Type B):* "Resident displays physical tension when Music Room is active. Staff will maintain Quiet Room availability and minimize auditory stimulation to reduce distress."
      *   **Why this is better:** It distinguishes *seeking quiet* (positive reward) from *avoiding noise* (negative reward). The staff action is different: one requires proactively taking her to quiet; the other requires proactively suppressing noise.

  **Case 2: Cookie (Closer) vs. Apple (Farther)**
  *   **Current Method:** "Resident prefers Cookies." (Dietary plan updated to allow more sugar).
  *   **B2P Application:**
      *   *Step 1 (Setup Check):* Staff measure distance. Apple is 6 inches farther.
      *   *Step 2 (Confound Swap):* Staff move Apple closer. Resident now reaches for Apple 3/3 times.
      *   *Result:* Inference is **Motor Effort**, not Food Preference.
      *   *Plan Sentence (Type C):* "Resident selects Apple when positioned within equal reach of Cookie. Staff will ensure healthy food options are positioned within 6 inches of resident's dominant hand to facilitate access."
      *   **Why this is better:** It prevents laundering motor deficits as dietary preferences. It puts the burden on staff positioning, not resident "choice."

  **Case 3: Bed/Refusal (2 Years)**
  *   **Current Method:** "Resident prefers low stimulation/bed rest." (Plan legitimizes inactivity).
  *   **B2P Application:**
      *   *Step 5 (Hand-Off Trigger):* "Resident has refused all activities for > 6 months."
      *   *Result:* **STOP.** No inference licensed.
      *   *Plan Sentence (Type D):* "Behavioral data is insufficient to determine preference due to Chronic Refusal. Care Plan is based on Family/Advocate consultation regarding Best Interest, to be reviewed quarterly."
      *   **Why this is better:** It admits the data is underdetermined (Worry 1). It forces a human ethical judgment (Worry 4) rather than hiding behind a frequency count that validates neglect or depression as a "preference."

  ***

  ### Part 4: Where This Procedure Will Misfire

  You asked for honesty about where the theory is dropped or where the tool fails. No checklist can fully solve the philosophical problems of PIMD care, but this one makes the failures visible.

  **1. The "Compliance" Failure (Staff Behavior)**
  *   **Risk:** Staff who know the resident well may unconsciously cue them during the "Tension Check." A subtle lean or eye gaze from staff can override resident tension.
  *   **Audit Flag:** A reviewer should look for **100% consistency**. If a resident chooses Option A 10/10 times with zero variance, the trial is likely contaminated by cueing. Human preference has noise. Perfect data is suspicious.

  **2. The "Micro-Preference" Failure (Resolution)**
  *   **Risk:** Some residents communicate preference via eye gaze duration (milliseconds) or pupil dilation. This protocol requires gross motor movement (reach/turn).
  *   **Audit Flag:** Look for residents with **Type D (Hand-Off)** plans who have intact eye gaze. If a resident has a "Best Interest" plan but can track objects, the committee must verify if Eye-Gaze Technology was ruled out. This procedure drops fine-grained inference to save staff time; that trade-off must be monitored.

  **3. The "Learned Helplessness" Failure (Option Set)**
  *   **Risk:** Step 1 checks if Option B was offered in 30 days. But if the resident hasn't been offered *anything* new in 5 years, they may not recognize Option B as a choice. They may pick Option A because it is familiar, not preferred.
  *   **Audit Flag:** Reviewers should check the **History Log**. If a resident's plan has not had a "New Option Trial" (introducing a completely novel stimulus) in 12 months, the preference data is stale. The procedure assumes the option set is adequate; it cannot test that itself.

  **4. The "Normative" Failure (The Hardest Truth)**
  *   **Risk:** Step 4 asks staff to judge "Harm." But staff are trained to prioritize safety. They may flag a risky but meaningful activity (e.g., walking with a fall risk) as "Harm," converting a Preference into a Safety Instruction.
  *   **Audit Flag:** Compare **Type B (Safety)** sentences against incident reports. If a resident is restricted from an activity for "Safety" but has no recent incidents related to that activity, the Normative Gate is being used to manage staff liability, not resident well-being.

  ### Summary of Trade-offs

  *   **Preserved:** Worry 1 (Underdetermination) is handled by the "Hand-Off" trigger. Worry 3 (Confounds) is handled by the "Setup/Swap" steps. Worry 4 (Normative) is handled by the "Harm/Benefit" gate.
  *   **Dropped:** Worry 2 (Option Set Bias) is only partially addressed. We check if options are *physically* fair, but we cannot check if they are *existentially* fair without more time than staff have. We accept that we are choosing from a menu the institution wrote, but we require the menu to be presented honestly.
  *   **Audit Strategy:** The regulator does not need to see the math. They need to see that **uncertainty was acknowledged**. A plan that says "We don't know, so we consulted the family" is more defensible than a plan that says "We know, because we counted to ten."

  This procedure turns your anxiety into a checklist. It forces the staff to say "I don't know" more often, which is the only honest answer when inferring a soul's reward function from a reach of the hand.
