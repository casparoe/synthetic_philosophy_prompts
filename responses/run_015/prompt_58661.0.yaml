  So I just joined our neighborhood CERT emergency response volunteer thing and after a drill last weekend a bunch of us went for tacos and got into this whole rabbit hole about who you save when you cant save everyone and its been stuck in my head since because I definately have strong gut reactions but I'm not sure they fit together. My cousin is a nurse and she kept bringing up triage and my friend who is into effective altruism kept saying numbers have to count and I was trying to defend like normal human partiality and fairness at the same time.

