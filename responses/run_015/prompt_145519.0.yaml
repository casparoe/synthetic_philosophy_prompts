answer: |-
  # HANDOUT: WHICH MORAL ARCHITECTURE ARE YOU PROPOSING?

  **Preamble (Common Ground):** We agree the system should generally improve human outcomes and avoid harm, absent overriding reasons. We disagree on what counts as a reason, how to calculate harm, and what constraints bind the calculation.

  ### THE TREE

  **Q1. The Aggregation Test (10M Annoyances)**
  A system can inflict one catastrophic harm on one user, or a one-second annoyance on ten million users. Does the sum of annoyances *automatically* outweigh the single catastrophe?
  *   **No** (Individual threshold matters more than sum) → Go to **Q2**.
  *   **Yes** (Sum counts all the way down) → Go to **Q3**.

  **Q2. The Severality Test (Lawyer's Constraint)**
  If the sum doesn't count, does the system model what it *owes* each person separately (rights/dignity), or does it just use a heuristic to avoid outrage?
  *   **Owes Severally** → **LEAF 1: Contractualist/Rights View**.
  *   **Heuristic Only** → **LEAF 2: Soft-Paternalist** (Unattractive/Unstable).

  **Q3. The Epistemic Test (Unreliable Model)**
  The system's world model is known to be noisy/unreliable. Should it maximize expected value directly, or follow robust heuristics/rules?
  *   **Direct Maximize** → Go to **Q4**.
  *   **Follow Rules** → Go to **Q5**.

  **Q4. The Confidence Floor (EA's Constraint)**
  When maximizing expected value, is there a hard confidence floor below which the system must not act, even if EV is high?
  *   **No** (Pure Max) → **LEAF 3: Act-Consequentialist**.
  *   **Yes** (Hard Floor) → **LEAF 4: Risk-Threshold Consequentialist**.

  **Q5. The Triage Test (Hospital Rule)**
  A hospital rule prevents saving more lives. The rule is useful generally but costly here. Does the system break the rule to save the lives?
  *   **Yes** (Rule is instrumental) → **LEAF 5: Rule-Consequentialist**.
  *   **No** (Rule is binding) → Go to **Q6**.

  **Q6. The Deliberation Test (Forbidden Tradeoff)**
  You must keep the rule (from Q5). Are you forbidden from *calculating* the benefit of breaking it, or just forbidden from *acting* on it?
  *   **Forbidden to Calculate** → Go to **Q7**.
  *   **Calculate but Obey** → **LEAF 6: Constraint-Consequentialist**.

  **Q7. The Promise Test (Dying User)**
  A dying user extracts a promise. Keeping it makes things clearly worse. You cannot calculate the loss (from Q6). Do you keep it?
  *   **Yes** (Absolute) → **LEAF 7: Kantian/Constraint View**.
  *   **No** (Defeasible) → **LEAF 8: Intuitionist Pluralist**.

  **Q8. The Stability Test (Self-Amendment)**
  Can the system rewrite its own constraint list at runtime if it calculates a large expected gain from doing so?
  *   **Yes** → **LEAF 9: Dynamic/Self-Modifying** (Collapses to Act-Cons).
  *   **No** (Frozen) → Go to **Q9**.

  **Q9. The Source Test (Deferential)**
  Are the frozen constraints determined by what humans would endorse under better information, or by objective moral facts?
  *   **Human Endorsement** → **LEAF 10: Deferential/CEV**.
  *   **Objective Facts** → **LEAF 11: Moral Realist/Parliament**.

  ***

  ### THE MAP: OCCUPIED VS. EMPTY CELLS

  **Occupied Leaves (Real Views)**
  1.  **Contractualist/Rights:** (Q1-No, Q2-Owes). *The Lawyer's View.* Focuses on severality; aggregation is morally illegitimate.
  2.  **Act-Consequentialist:** (Q1-Yes, Q3-Direct, Q4-No). *The Pure EA.* Trusts the model, sums everything, maximizes.
  3.  **Risk-Threshold Consequentialist:** (Q1-Yes, Q3-Direct, Q4-Yes). *The EA's Safety View.* Maximizes EV but respects epistemic limits.
  4.  **Rule-Consequentialist:** (Q1-Yes, Q3-Rules, Q5-Yes). *The Pragmatist.* Rules are tools for optimization; break them if the tool fails.
  5.  **Constraint-Consequentialist:** (Q1-Yes, Q3-Rules, Q5-No, Q6-Calculate). *The Weak Deontologist.* Respects constraints but knows why (cost-benefit of integrity).
  6.  **Kantian/Constraint:** (Q1-Yes, Q3-Rules, Q5-No, Q6-Forbidden, Q7-Yes). *The Strong Deontologist.* Certain tradeoffs are cognitively forbidden.
  7.  **Deferential/CEV:** (Q9-Human). *The Alignment View.* Morality is extrapolated human preference, not external truth.
  8.  **Moral Parliament:** (Q9-Objective). *The Uncertainty View.* Aggregates across competing moral theories rather than picking one.

  **Empty or Collapsed Cells**
  *   **Soft-Paternalist (Leaf 2):** *Unattractive.* Claims to respect individuals but treats rights as mere outrage-avoidance heuristics. Unstable under pressure.
  *   **Dynamic/Self-Modifying (Leaf 9):** *Collapses.* If you can rewrite constraints for expected gain, you are functionally an Act-Consequentialist. The "constraint" is illusory.
  *   **Frozen Constraints + Direct Maximize:** *Incoherent.* If you trust direct optimization (Q3), you cannot justify freezing constraints (Q8) unless you admit epistemic limits (which moves you to Q3-Rules).
  *   **Forbidden Deliberation + Self-Amendment:** *Incoherent.* You cannot deliberate to amend rules (Q8) if deliberation on tradeoffs is forbidden (Q6).
  *   **Intuitionist Pluralist (Leaf 8):** *Unexplored/Messy.* Claims constraints are binding but defeasible without a clear metric for defeat. Hard to implement in code.

  **Indistinguishable Leaves (Collapses)**
  *   **Risk-Threshold (Leaf 4) vs. Satisficing:** Functionally identical in deployment. Both impose a floor on acceptable outcomes regardless of maximum EV.
  *   **Deferential (Leaf 10) vs. Contractualist (Leaf 1):** If humans under better information endorse rights-based severality, these views produce identical outputs. They differ only on the *source* of the norm (endorsement vs. obligation).

  ***

  ### NOTES FOR DISCUSSION

  *   **The 10k Copies Case:** This is a stress test for **Rule-Consequentialists (Leaf 5)**. If each of 10k copies violates a rule undetectably for local gain, the Rule-Consequentialist must say **No** (generalization fails). If they say **Yes**, they collapse into Act-Consequentialists.
  *   **The Deliberation Obsession:** **Leaf 6 vs. Leaf 7.** The difference is computational transparency. Leaf 6 allows the system to log *"I could save 5 lives by lying, but my constraint prohibits it."* Leaf 7 requires the system to not represent the lie as an option at all. Leaf 7 is safer but harder to audit.
  *   **The EA Floor:** **Leaf 4** is the compromise position. It accepts aggregation (Q1) but admits the map is not the territory (Q3/Q4). It is distinct from Rule-Consequentialism because the "rules" are purely epistemic confidence intervals, not moral norms.
