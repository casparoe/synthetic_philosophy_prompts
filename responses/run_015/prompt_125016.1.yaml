answer: |-
  Here is the specification sheet for a robust theory of transgenerational collective guilt. This is framed as a set of necessary conditions (desiderata) your dissertation must satisfy to avoid collapsing into metaphor, mere liability, or mystical group-mind speculation.

  ### I. The Desiderata: Cases and Distinctions

  To claim *guilt* (rather than obligation, debt, or shame) survives generationally, your framework must accommodate the following four cases without ad-hoc exceptions:

  1.  **The Continuity Case (The State):** The political entity persists despite regime change (e.g., Federal Republic of Germany vs. Third Reich). The theory must explain why the *state* carries the guilt residue even if the *constitution* disavows the prior acts.
  2.  **The Benefit Case (Unjust Enrichment):** Descendants who materially benefit from the atrocity but played no causal role in it. The theory must distinguish between *profiting from wrong* (which creates liability) and *sharing in the guilt* of the wrong itself.
  3.  **The Dissenter Case (The Repudiator):** Descendants who actively oppose the legacy of their ancestors. If they are still "guilty," in what sense? If they are not, does guilt vanish upon recognition, making it epistemic rather than ontological?
  4.  **The Turnover Case (The Institution):** An organization (Church, Corporation, Army) with 100% membership turnover. The theory must locate the agency in the *structure/rules/roles* rather than the biological humans, without reifying the institution into a mystical entity.

  **Distinctions That Cannot Collapse:**
  *   **Guilt vs. Liability:** Liability is forward-looking (what must be done to fix it). Guilt is backward-looking (acknowledgment of wrongdoing). If your theory only generates obligations to pay reparations, you have described *debt*, not *guilt*.
  *   **Affective Shame vs. Normative Guilt:** Shame is about who I *am* (identity); Guilt is about what *we did* (action). Transgenerational accounts often slide into shame ("I am tainted") because they cannot sustain the action requirement for guilt.
  *   **Collective Agency vs. Statistical Aggregation:** The group must be capable of acting in a way that is not reducible to the sum of individual acts. If the group is just a bucket of individuals, guilt dies when the individuals die.
  *   **Ghost Agency (Feature vs. Bug):** You must decide if dead perpetrators remain moral nodes.
      *   *If Feature:* You risk metaphysical incoherence (necromantic agency).
      *   *If Bug:* You risk breaking the chain of continuity (how does the guilt transfer if the agent is gone?).
      *   *Requirement:* Your theory must explain the transmission of guilt *without* relying on the continued agency of the dead.

  ### II. Jointly Unsatisfiable Pairs (The Tensions)

  Any robust theory will have to explicitly sacrifice or modify one side of these pairs. You cannot maximize both.

  1.  **The Volitional Condition vs. The Diachronic Condition:**
      *   *Volitional:* Guilt requires control/choice (I am only guilty for what I willed).
      *   *Diachronic:* Guilt survives across time where no current member chose the original act.
      *   *Conflict:* If you hold the Volitional Condition strict, transgenerational guilt is impossible. If you hold the Diachronic Condition strict, you detach guilt from agency entirely.
  2.  **The Identity Condition vs. The Turnover Condition:**
      *   *Identity:* For Group A (time 1) to be guilty, Group A (time 2) must be the *same agent*.
      *   *Turnover:* Group A (time 2) has no members in common with Group A (time 1).
      *   *Conflict:* Strict numerical identity fails turnover. You need a theory of *functional* or *narrative* identity, which risks making guilt arbitrary (based on how we tell the story).
  3.  **The Knowledge Condition vs. The Structural Condition:**
      *   *Knowledge:* To be guilty, the agent must know (or be culpably ignorant of) the wrong.
      *   *Structural:* The guilt is embedded in systems that operate independently of current members' knowledge.
      *   *Conflict:* If guilt is structural, current members can be "guilty" while being morally blind to it. This stretches the definition of guilt toward "pollution."

  ### III. The Killer Desideratum

  **The Volitional Constraint is the account-killer.**

  Most popular accounts (including many interpretations of Jaspers) fail here. They want to preserve the *sting* of guilt (which requires agency/volition) while extending it to people who had *no agency* in the original act.
  *   **Why it kills:** If you relax the volitional constraint to allow transgenerational transmission, you inevitably collapse **Guilt into Liability**. You end up describing a tax or a debt obligation ("You must pay because you belong to this group"), which is not moral guilt.
  *   **Your Task:** To survive this, your "institutional half-life" theory must redefine *volition* not as individual choice, but as *sustained endorsement* or *failure to dismantle* the institutional machinery. You must argue that inheriting the institution is an ongoing act of appropriation.

  ### IV. Scoring the Competitors

  | Account Type | Handles Continuity? | Handles Turnover? | Maintains Guilt/Liability Distinction? | **Fatal Flaw** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Jaspers-Style (Moral/Metaphysical)** | No | No | **Yes** (Strong distinction) | **Dies at generation boundary.** Jaspers explicitly limits moral guilt to those who acted. It cannot support your "half-life" project without violating his own taxonomy. |
  | **Structural/Institutional** | **Yes** | **Yes** | No (Collapses to function) | **Reifies the Institution.** Often treats the institution as a super-agent, smuggling in "Ghost Agency." Risks making guilt automatic/ontological rather than normative. |
  | **Reparative (No-Guilt)** | **Yes** | **Yes** | **No** (Denies Guilt) | **Abandons the Project.** This view (e.g., Thompson, Boxill) argues we have *obligations* to repair, but not *guilt* for the past. It solves the metaphysics by deleting the phenomenon you want to study. |

  ### V. Meta-Critique: Where This Reasoning Might Fail

  **1. What would change my mind (The Prejudice Check):**
  The strongest argument against these desiderata is that **"Guilt" is the wrong category entirely.**
  *   *The Argument:* Iris Marion Young's *Social Connection Model* suggests that focusing on *guilt* (liability model) is a category error for structural injustice. If you argue that transgenerational responsibility is *political* rather than *moral*, the Volitional Constraint dissolves.
  *   *The Shift:* If you accept this, your "institutional half-life" isn't about guilt decaying; it's about *political jurisdiction* persisting. This would make the "Guilt vs. Liability" distinction a false dichotomy. You might be trying to solve a problem that only exists because you are clinging to a retributive framework for a distributive problem.

  **2. Where I am smuggling assumptions:**
  *   **Group Agency:** In the "Turnover Case" and "Collective Agency" distinction, I am assuming that institutions *can* bear moral predicates. This is contested (Methodological Individualism). If groups cannot act, only individuals can, then "institutional guilt" is literally a category mistake, not just a hard problem. Your theory needs a defense of *non-reductive group agency* (e.g., Pettit, List) or it rests on an unearned premise.
  *   **The "Half-Life" Metaphor:** By using "half-life," I am smuggling in a physicalist assumption that guilt is a *substance* that decays. Guilt is normative, not radioactive. If you treat it as a quantifiable residue, you risk objectifying moral status. The "decay" must be explained as a change in *normative force*, not a depletion of a moral resource.

  **Recommendation for the Diss:**
  Don't try to save "Guilt" in its traditional, individualistic sense. Argue that **Collective Guilt is a distinct normative species** from Individual Guilt. It has different truth conditions. If you try to make transgenerational guilt fit the mold of individual guilt (Volitional + Knowledge + Control), you will fail. Your "institutional half-life" framework works only if you argue that *institutions have a moral memory that individuals do not*, and that membership constitutes a form of *ratification* of that memory.
