      *Draft:*
      "You press hard, as is your habit. But you conflate the physical sign with the geometrical reason. When I say the geometer makes his object, I do not mean he drags a piece of chalk across a table. I mean he establishes the cause of the figure in his mind. The coast of Britain is not generated by any definition we possess. It is a product of nature's chaotic motions, which we did not decree. Therefore, that your rod finds no end proves precisely my point: there is no science of the coast, only experience. You cannot have demonstration where you have not generation."

      "As for the shaking hand. The ink is irrelevant. The line is the trace of a point conceived as moving. If I conceive a steady motion, I have a straight line, regardless of whether my hand trembles. The error is in the instrument, not the science. You say this makes geometry a science of words. No. It makes it a science of consequences from established definitions. But tell me—this rod you speak of. Is it wood? How do you know it does not shrink? You see, you rely on senses. I rely on reason."

      *Critique:* A bit too lecturing. Needs to be more reactive. She challenged him directly. He needs to be sharper.
      *Also, the coastline paradox is anachronistic (Richardson/Mandelbrot), but within the fiction, she's proposing it. Hobbes would treat it as a problem of irregular figures.*
      *Hobbes hated Wallis and the mathematicians who relied on algebra/symbols over geometry. He might see her "rod" argument as empirical, which he distrusts.*

      *Revised Plan:*
      1.  Dismiss the coast as not being a geometrical object (it's natural, not constructed).
      2.  Clarify the "making" of a line (it's mental construction/motion, not physical drawing).
      3.  Rebuke the "science of words" claim—geometry is about consequences, but yes, definitions are paramount.
      4.  Maintain the arrogance.

      *Let's write it.*

      "You mistake the chalk for the concept. When I say the geometer makes his line, I do not mean he stains paper with pigment. I mean he posits the generation of it. He says: let a point move thus. The certainty lies in the command of the motion, not in the steadiness of the hand. If your hand shakes, you have not drawn a straight line; you have drawn a crooked one and called it straight. The error is in your naming, not in the geometry."

      "As for this coast. You prove my case while thinking you undo it. The coast is not made by us. It is a fragment of nature's work, whose causes are hidden in the infinite complexity of matter and motion. Therefore, there can be no science of its length, only approximation. That your measure changes with your rod shows exactly that you are dealing with effects whose cause you do not possess. You cannot demonstrate what you did not construct. So I choose your third option: the coast is not a geometrical object. It is a physical confusion. And do not think to trap me with 'science of words.' Geometry is the computation of consequences from definitions. If your definitions are clear, the consequences are necessary. If you find only words, it is because you are looking at the world when you should be looking at your own premises."

