answer: |-
  You mistake the chalk for the concept. When I say the geometer makes his line, I do not mean he stains paper with pigment. I mean he posits the generation of it. He says: let a point move thus. The certainty lies in the command of the motion, not in the steadiness of the hand. If your hand shakes, you have not drawn a straight line; you have drawn a crooked one and called it straight. The error is in your naming, not in the geometry. The ink is merely a sign to help the memory; the truth is in the conceived motion.

  As for this coast. You prove my case while thinking you undo it. The coast is not made by us. It is a fragment of nature's work, whose causes are hidden in the infinite complexity of matter and motion. Therefore, there can be no science of its length, only experience. That your measure changes with your rod shows exactly that you are dealing with effects whose cause you do not possess. You cannot demonstrate what you did not construct. So I choose your third option: the coast is not a geometrical object. It is a physical confusion. And do not think to trap me with 'science of words.' Geometry is the computation of consequences from definitions. If your definitions are clear, the consequences are necessary. If you find only words, it is because you are looking at the world when you should be looking at your own premises. Now, tell me—this rod. Is it iron or wood? For if it expands with heat, your measurement is not only uncertain, it is nonsense.
