prompt: |-
  Many institutional auditing protocols for predictive algorithms treat demographic parity, equalized odds, and calibration across groups as separate, simultaneously achievable fairness criteria; when a model violates more than one, the standard response is to retrain or constrain features until all are satisfied, with little acknowledgment that these conditions are jointly impossible except in trivial cases. What philosophical commitments about fairness, moral responsibility, and the ontology of statistical harm does this practice presuppose? Does it assume that fairness is an additive property of decision rules rather than a structurally constrained trade-off? And is it consistent with viewing the algorithm as an embedded agent—part of the social environment it measures—rather than as a neutral, external observer? Reconstruct the implicit theory of fairness and agency that makes this protocol intelligible, distinguish what the practice strictly requires from what merely accommodates it, and indicate what parts of the auditing framework would need to change if the impossibility results were treated as normative boundaries rather than engineering problems. Please answer in American English.
