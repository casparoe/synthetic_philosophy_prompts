prompt: |-
  I chair the serious incident review panel at a ~500-bed hospital — we meet every other week, about 90 minutes per case, and the output that matters is a short "causal findings" section that says things like "the delay in giving antibiotics caused the septic shock" or "admission on a weekend contributed to the worse outcome." Those reports go to the family, to the department involved, and to legal, and they trigger things: a new protocol, mandatory training, sometimes a budget line. Six of us: two nurses, two physicians, a risk manager, and me. I did some philosophy as an undergrad, which is why I'm writing this, and nobody else on the panel has any formal training in it.

  I've become convinced we're making two specific messes and I want a procedure, not an explanation.

  Mess one: we conflate two quite different claims. (a) "this patient would not have died if the delay hadn't happened" — a one-off counterfactual about this admission — and (b) "if we changed the system so this kind of delay can't happen, future patients like this one do better" — a claim about what would happen under an intervention. These can come apart in both directions: sometimes (a) is true and (b) is false because this was a fluke that our fix wouldn't touch, and sometimes (b) is true and (a) is false because something else in that admission would have killed her anyway and the delay just happened to be there first. The family reads the report wanting (a); the department is supposed to act on (b). We write one sentence that pretends to be both.

  Mess two: we write findings about things nobody can say how to change. "Weekend admission," "frailty," "poor handover," "the patient's race." Nobody can tell me what we would actually do to set those to a value, or what else would move along with them if we did. Half the time the honest answer is that the intervention isn't specified, so we don't know what question we're even asking.

  So: write me a procedure the panel can actually run in our 90 minutes, as an ordered set of tests — what to ask first, what counts as a sufficient answer at each step given what we have (the chart, maybe two interviews, occasionally registry data; we can't randomize anything), where it stops with "no causal finding," and where it hands the decision to a person because the question is one of values and not facts. It has to do something useful with: counterfactuals that quietly rewrite earlier events ("if she hadn't been admitted Friday she'd have been seen by a different team entirely"), overdetermination, and causes we can't manipulate. Give us a small set of sentence templates for what we can defensibly assert at each exit point — the wording has to be readable by a grieving family and survivable in a deposition, and legal and I both sign off.

  Then run it on three: the delayed-antibiotics/septic-shock case; a "weekend admission caused the worse outcome" finding; and a case where the panel wants to write that the patient's race caused the worse outcome and the only real evidence is a disparity in our own numbers plus some notes about how staff spoke to her. Include at least one where the procedure gives me an answer I won't like. And tell me plainly where it will misfire on us and what it can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Chair of a Serious Incident Review (SIR) panel at a ~500-bed hospital. Background in philosophy (undergrad).
      *   **Context:** Bi-weekly meetings, 90 mins/case. 6 members (2 nurses, 2 MDs, 1 risk manager, 1 chair).
      *   **Output:** "Causal findings" section. Audience: Family, Department, Legal. Consequences: Protocols, training, budget.
      *   **Problem 1 (Conflation):** Mixing *token causation* (this specific patient died because of X) with *type causation* (fixing X will help future patients). These can diverge.
      *   **Problem 2 (Unmanipulable Causes):** Citing factors like "weekend," "frailty," "race" without specifying an intervention. If you can't change it, is it a useful causal finding for improvement?
      *   **Constraints:** 90 minutes per case. Limited data (chart, 2 interviews, registry). No RCTs. Needs to handle counterfactuals, overdetermination, and non-manipulable causes. Needs sentence templates (family-readable, legal-safe). Needs to identify where values vs. facts diverge.
      *   **Task:** Create a step-by-step procedure (ordered tests), run it on three specific cases (Antibiotics, Weekend, Race), include an unwelcome outcome, and admit limitations.

  2.  **Deconstruct the Philosophical Problems:**
      *   *Token vs. Type:* The user is distinguishing between "Cause of Effect" (actual causation) and "Cause of Prevention" (interventional causation). The procedure needs to separate these explicitly.
      *   *Manipulability:* This aligns with the Interventionist theory of causation (Woodward). A cause must be a "handle" we can turn. If we can't turn the handle (e.g., "race"), we need to find the *proximal manipulable mechanism* (e.g., "bias in triage algorithm" or "communication style").
      *   *Overdetermination:* If the patient would have died anyway (e.g., terminal cancer + delayed antibiotic), the delay isn't the *but-for* cause of death, but might be a cause of *suffering* or *earlier* death. The procedure needs to handle "contributory" vs. "determinative."
      *   *Counterfactual Stability:* "If admitted Friday..." implies a whole different world. We need to test the robustness of the counterfactual.

  3.  **Drafting the Procedure (The "SIR-Causal Protocol"):**
      *   *Time Management:* 90 minutes is tight. The procedure must be a funnel. Start broad, narrow down quickly.
      *   *Step 1: Fact Locking.* Agree on what happened. No causality yet.
      *   *Step 2: The But-For Test (Token).* Did this specific factor matter for *this* patient? (Addresses Mess 1a).
      *   *Step 3: The Manipulability Test.* Can we actually change this factor? (Addresses Mess 2). If no, dig deeper for the manipulable proxy.
      *   *Step 4: The Generalizability Test (Type).* If we change this, does it help future patients? (Addresses Mess 1b).
      *   *Step 5: The Value Judgment.* If facts are clear but action is hard (e.g., resource allocation), flag for leadership.
      *   *Exit Points:* Need clear "Stop" conditions where no causal finding is issued.
      *   *Templates:* Need specific language for Family (empathetic, clear) vs. Legal/Internal (precise, limited liability).

  4.  **Developing the Sentence Templates:**
      *   Need to distinguish between "Contributed to" vs. "Caused."
      *   Need to distinguish between "System Failure" vs. "Individual Error."
      *   Need to handle "Uncertainty."

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Delayed Antibiotics/Septic Shock.*
          *   Standard case. Likely passes all tests.
          *   Token: Yes, delay mattered.
          *   Manipulable: Yes, protocol exists.
          *   Type: Yes, sepsis bundles work.
          *   *Result:* Strong causal finding.

      *   *Case 2: Weekend Admission.*
          *   "Weekend effect" is notorious.
          *   Token: Maybe.
          *   Manipulable: No. We can't ban weekend admissions.
          *   *Pivot:* What is the *mechanism*? Staffing levels? Senior coverage?
          *   *Result:* Finding shifts from "Weekend" to "Weekend Staffing/Coverage."
          *   *Unwelcome Outcome:* Maybe the data shows weekend staffing is within budget/norms, implying the "cause" is actually "Resource Allocation Policy," which the panel can't fix.

      *   *Case 3: Race/Disparity.*
          *   High risk. "Race" is not manipulable.
          *   Token: Did race cause *this* outcome? Biologically no. Socially/Structurally yes.
          *   Manipulable: No.
          *   *Pivot:* What is the mechanism? Implicit bias? Communication? Triage algorithm?
          *   *Result:* If evidence is only "disparity stats" + "notes on speech," we might fail the Fact Locking step for *this specific case* regarding causality, even if the systemic disparity is real.
          *   *Unwelcome Outcome:* The procedure might force us to say "We cannot establish causal link in *this* case despite systemic disparity," which feels morally unsatisfying but legally/factually honest. Or, it forces us to identify the specific bias mechanism (e.g., "pain assessment protocol") rather than "Race."

  6.  **Refining the Procedure (Self-Correction/Critique):**
      *   *Critique:* Is 90 minutes enough for this depth?
      *   *Fix:* Make Step 1 (Facts) a pre-meeting requirement. The 90 mins is for *Causal Analysis* only.
      *   *Critique:* Legal might hate admitting "System Failure."
      *   *Fix:* The templates must use "Contributing Factor" language rather than "Negligence" language unless legally cleared.
      *   *Critique:* The "Race" case is tricky. Saying "Race wasn't the cause" can be gaslighting.
      *   *Fix:* The procedure must distinguish between *biological* causation and *structural* causation. The manipulable factor is the *response* to race (bias), not race itself.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the philosophical rigor.
      *   **The Protocol (SIR-C):** Step-by-step flow.
      *   **The Templates:** Specific wording.
      *   **The Case Runs:** Applying the protocol.
      *   **The Failure Modes:** Where this breaks.

  8.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Mess 1 Fix:* Split the finding into "Patient-Specific Contribution" and "Systemic Intervention Potential."
      *   *Mess 2 Fix:* The "Manipulability Filter." If you can't name the lever, you can't name the cause.
      *   *Case 3 Nuance:* This is the hardest. If the only evidence is disparity stats, that's ecological fallacy for the individual case. The procedure must catch this. The finding should be about the *process* that allowed bias, not the demographic itself.
      *   *Unwelcome Answer:* For the Weekend case, the unwelcome answer is "We are understaffed by design." For the Race case, the unwelcome answer is "We cannot prove bias in this specific instance despite the pattern." I'll choose the Weekend one for the "Budget/Policy" conflict as it hits the "Budget line" consequence mentioned in the prompt.

  9.  **Review against Constraints:**
      *   90 minutes? Yes, if facts are pre-read.
      *   6 people? Yes, roles defined.
      *   Legal/Family safe? Yes, templates provided.
      *   Philosophical rigor? Yes, based on Counterfactual and Interventionist theories.

  10. **Final Polish:** Ensure tone is professional, direct, and respectful of the Chair's expertise. (Self-correction: Ensure I don't sound like I'm teaching them philosophy, but rather operationalizing their insights.)

  *(Self-Correction during drafting the Race case)*: I need to be careful not to dismiss structural racism. The procedure should force the panel to identify the *mechanism* (e.g., "failure to escalate pain concerns") rather than the *category* ("race"). If they can't identify the mechanism, they can't claim causality for *this* review, even if the disparity is real. This is the "unwelcome answer."

  *(Self-Correction during drafting the Weekend case)*: The prompt asks for an answer I won't like. The Weekend case often leads to "We need more money." That's a value/policy decision, not a factual finding. I will make sure the procedure flags this as a "Value Escalation."

  Let's assemble.
answer: |-
  This is a sophisticated operational problem. You are asking to operationalize the distinction between *actual causation* (token) and *interventional causation* (type), while enforcing a manipulability constraint on the latter.

  Below is the **SIR-Causal Protocol (SIR-CP)**. It is designed for a 90-minute window, assuming the chart review and initial interviews are completed *before* the meeting starts. The meeting is for *analysis*, not discovery.

  ### Part 1: The Procedure (SIR-CP)

  **Pre-Meeting Requirement:** The Risk Manager circulates a "Fact Sheet" 24 hours prior. This contains the timeline, vital signs, orders, and interview summaries. No debating facts during the 90 minutes. If facts are disputed, the meeting pauses until verified.

  **The 90-Minute Flow:**

  **Step 1: The Fact Lock (10 mins)**
  *   **Action:** The Chair reads the "Proposed Timeline of Deviation."
  *   **Test:** Does the panel agree this timeline is supported by the record?
  *   **Pass:** Timeline accepted.
  *   **Fail:** Return to Risk Manager. No causal finding issued.
  *   **Output:** An agreed-upon sequence of events.

  **Step 2: The Token Counterfactual Test (20 mins)**
  *   **Goal:** Address Mess One (a). Did this specific factor matter for *this* patient?
  *   **Question:** "Holding all else fixed, if this specific factor (e.g., the 2-hour delay) had not occurred, is it more likely than not (>50%) that the adverse outcome (e.g., death/shock) would have been avoided or significantly mitigated?"
  *   **Constraint:** Do not rewrite history beyond the factor. (e.g., Do not say "If not Friday, she would have been admitted Monday." Say "If admitted Friday with Saturday staffing...")
  *   **Pass:** Yes, the outcome likely changes.
  *   **Fail:** No, the outcome was inevitable due to comorbidities/severity (Overdetermination).
  *   **Exit Point:** If **Fail**, stop. Issue a "No Causal Contribution" finding. (This is hard, but necessary).

  **Step 3: The Manipulability Filter (20 mins)**
  *   **Goal:** Address Mess Two. Can we actually turn this handle?
  *   **Question:** "What is the specific, actionable lever we pull to prevent this factor in the future?"
  *   **Test:** If the answer is a static condition ("Weekend," "Race," "Frailty," "Weather"), the test **Fails**. You must dig for the *proximal mechanism*.
      *   *Example:* "Weekend" $\rightarrow$ Fails. "Weekend Senior Coverage Ratio" $\rightarrow$ Passes.
      *   *Example:* "Race" $\rightarrow$ Fails. "Triage Pain Assessment Protocol" $\rightarrow$ Passes.
  *   **Pass:** A specific protocol, resource, or behavior is identified.
  *   **Fail:** No manipulable lever is found (e.g., "It was just bad luck" or "It's the nature of the disease").
  *   **Exit Point:** If **Fail**, stop. Issue a "System Resilience Limit" finding (see templates).

  **Step 4: The Type Intervention Test (20 mins)**
  *   **Goal:** Address Mess One (b). Will pulling this lever help future patients?
  *   **Question:** "If we implement the lever identified in Step 3, is there evidence (literature, registry, logic) that this reduces risk for the *class* of similar patients?"
  *   **Test:** Distinguish between *fixing a glitch* vs. *changing a policy*.
  *   **Pass:** Yes, evidence supports the intervention.
  *   **Fail:** No, this was a unique confluence of events (The "Fluke" Clause).
  *   **Exit Point:** If **Fail**, issue a "Specific Incident" finding only. Do not recommend system-wide change.

  **Step 5: The Value/Escalation Check (20 mins)**
  *   **Goal:** Identify where facts end and budget/policy begins.
  *   **Question:** "Does the lever identified in Step 3 require resources or policy changes outside this panel's authority?"
  *   **Pass:** Within authority (e.g., training, protocol tweak).
  *   **Fail:** Requires budget increase, hiring, or major policy shift.
  *   **Action:** If **Fail**, the finding is marked "Requires Executive Review." The panel states the causal link, but explicitly notes the intervention requires a value judgment on resource allocation.

  ---

  ### Part 2: Sentence Templates

  These are drafted to be defensible in deposition (precise) and readable by families (human).

  **Exit Point A: Strong Causal Finding (Passed Steps 2, 3, 4)**
  *   *Internal/Legal:* "The delay in antibiotic administration was a substantive contributing factor to the progression of septic shock. Implementation of a sepsis screening trigger is recommended to mitigate recurrence."
  *   *Family:* "Our review found that the time it took to start antibiotics allowed the infection to worsen. We are changing how we screen for this infection to ensure faster treatment in the future."

  **Exit Point B: Overdetermination/Inevitability (Failed Step 2)**
  *   *Internal/Legal:* "While deviations in care occurred, the clinical evidence suggests the adverse outcome was driven primarily by the underlying pathology. The deviations did not materially alter the probable outcome."
  *   *Family:* "Although there were delays in care, the severity of the illness was such that the outcome would likely have been the same even with immediate treatment. We are still reviewing the delays to ensure we provide the best possible care."

  **Exit Point C: Non-Manipulable Factor (Failed Step 3)**
  *   *Internal/Legal:* "The incident coincided with reduced weekend staffing levels. 'Weekend admission' is not a manipulable variable. The causal finding is restricted to 'Weekend Senior Coverage Ratios.'"
  *   *Family:* "The care took place during a time when fewer senior specialists were available. We are reviewing how we staff these shifts to ensure consistent expertise."

  **Exit Point D: Value Escalation (Failed Step 5)**
  *   *Internal/Legal:* "Preventing recurrence requires increasing the nurse-to-patient ratio beyond current budgeted levels. This finding is referred to Executive Leadership for resource allocation decision."
  *   *Family:* "To prevent this from happening again, we would need to change how many nurses are assigned to each patient. This decision is currently under review by hospital leadership."

  ---

  ### Part 3: Running the Protocol on Your Three Cases

  #### Case 1: Delayed Antibiotics / Septic Shock
  *   **Step 1 (Facts):** Chart shows order written 14:00, given 16:00. Guideline is 60 mins. Agreed.
  *   **Step 2 (Token):** If given at 14:30, would shock have been avoided? Literature says yes, high probability. **Pass.**
  *   **Step 3 (Manipulability):** "Delay" is manipulable. Lever: "Sepsis Alert Protocol." **Pass.**
  *   **Step 4 (Type):** Does Sepsis Alert work? Yes, strong evidence. **Pass.**
  *   **Step 5 (Value):** Cost of protocol is low (software flag). **Pass.**
  *   **Result:** **Exit Point A.**
  *   **Finding:** "The delay in antibiotic administration was a substantive contributing factor to the progression of septic shock."
  *   **Comment:** This is the easy case. The protocol validates your intuition.

  #### Case 2: "Weekend Admission Caused Worse Outcome"
  *   **Step 1 (Facts):** Patient admitted Saturday 2 AM. Died Sunday. Comparable Monday admissions survive at higher rates. Agreed.
  *   **Step 2 (Token):** If admitted Monday, would she live? Counterfactual is shaky. She might have deteriorated at home. But let's grant **Pass** for the sake of the "Weekend Effect."
  *   **Step 3 (Manipulability):** "Weekend" is **NOT** manipulable. We cannot ban Saturday admissions.
      *   *Panel Push:* "But we can staff differently."
      *   *Correction:* Okay, factor is "Weekend Staffing Mix."
      *   *Data Check:* Registry shows weekend staffing meets current policy guidelines.
      *   *Result:* The lever is "Current Staffing Policy."
  *   **Step 4 (Type):** If we change staffing policy, do outcomes improve? Evidence is mixed/contested.
  *   **Step 5 (Value):** To guarantee Monday-level staffing on Saturday requires overtime/budget increase.
  *   **Result:** **Exit Point D (Value Escalation).**
  *   **Finding:** "The outcome coincided with reduced senior coverage typical of weekend shifts. Preventing this requires a revision of weekend staffing budgets."
  *   **The Unwelcome Answer:** The procedure forces you to admit that the "cause" is not a mistake, but a **policy choice** you don't control. You cannot write "Weekend caused death" because you can't fix "Weekend." You must write "Budget caused risk." Legal will hate this; the Board will hate this. But it is the truth.

  #### Case 3: Patient Race / Disparity / Communication
  *   **Step 1 (Facts):** Black female patient. Pain complaints documented as "agitated." Delay in pain management. Outcome: DVT/PE due to immobility. Registry shows disparity in pain med administration for this demographic.
  *   **Step 2 (Token):** If pain managed earlier, would she have mobilized and avoided PE? Plausible. **Pass.**
  *   **Step 3 (Manipulability):** "Race" is **NOT** manipulable. "Staff bias" is hard to manipulate directly.
      *   *Panel Push:* "We should say race caused it because the stats show disparity."
      *   *Correction:* Stats are ecological. This is an individual review. You must find the *mechanism*.
      *   *Mechanism:* "Pain Assessment Protocol adherence." The notes show staff used subjective descriptors ("agitated") rather than pain scales.
      *   *Lever:* "Mandatory Pain Scale Documentation before sedation."
  *   **Step 4 (Type):** Does enforcing pain scales reduce disparity? Evidence suggests yes. **Pass.**
  *   **Step 5 (Value):** Training/Protocol. **Pass.**
  *   **Result:** **Exit Point A (Modified).**
  *   **Finding:** "Inconsistent application of pain assessment protocols contributed to delayed mobilization. This failure correlated with known demographic disparities in pain management."
  *   **The Unwelcome Answer:** The procedure prevents you from writing "Race caused the outcome." It forces you to write "Protocol Failure caused the outcome, which disproportionately affected this demographic."
      *   *Why this hurts:* It feels like sanitizing racism.
      *   *Why it's necessary:* If you write "Race caused it," Legal will strike it (race isn't a hospital process), and you can't fix "Race." You can only fix the *response* to race. The procedure forces you to target the response.
      *   *Risk:* If the *only* evidence is the registry stats and not specific chart deviations in *this* case, Step 1 or 2 might fail. You cannot use systemic stats to prove token causation in a specific SIR without specific evidence of deviation in the specific chart. If the chart looks "clean" but the outcome fits the disparity pattern, the procedure forces a **"No Causal Finding"** for the individual case, with a separate **"Systemic Safety Alert"** regarding the disparity. This is the hardest pill to swallow: acknowledging a racist system while admitting you can't prove it killed *this specific person* based on the available evidence.

  ---

  ### Part 4: Where This Will Misfire (Limitations)

  1.  **The "Clean Chart" Problem (Case 3 Risk):**
      *   If the chart documentation is perfect (bias is invisible in the notes), Step 1 (Fact Lock) will fail to identify a deviation. The protocol will force you to issue "No Causal Finding" for the individual case, even if everyone in the room knows bias was present.
      *   *Mitigation:* You need a parallel track for "Systemic Equity Review" that is decoupled from individual SIRs. Do not try to solve structural racism in a 90-minute mortality review.

  2.  **The "Budget Wall" (Case 2 Risk):**
      *   Step 5 will frequently hand you findings you cannot act on. If 50% of your findings are "Requires Executive Review," the panel becomes a complaint box.
      *   *Mitigation:* You must have a direct line to the CMO/CFO. If the panel identifies a budget-caused risk, the CMO must formally accept or reject the risk within 30 days.

  3.  **The "Counterfactual Fatigue":**
      *   In 90 minutes, arguing about "Would she have died anyway?" can consume the whole session.
      *   *Mitigation:* Strict Chair control. If the Token Counterfactual (Step 2) is debated for >10 mins, default to "Contributory Factor" rather than "Cause." Lower the burden of proof from "More likely than not" to "Substantively contributed."

  4.  **Legal Friction:**
      *   Legal wants "No admission of liability." The templates above walk the line, but Exit Point D (Value Escalation) is dangerous. It admits the hospital *could* be safer but *chooses* not to be for budget reasons.
      *   *Mitigation:* Legal must sign off on the *templates*, not the specific findings. If Legal blocks Exit Point D, you must stop doing SIRs for those cases, because you are no longer reviewing safety, you are reviewing compliance.

  ### Summary for the Panel
  You are not judges of truth; you are engineers of safety.
  *   If you can't fix it, it's not a causal finding for *this* panel (it's a policy issue).
  *   If it didn't change the outcome for *this* patient, it's not a token cause (it's a systemic observation).
  *   If you can't name the lever, you can't name the cause.

  This procedure will reduce the number of findings you publish. That is a feature, not a bug. It increases the signal-to-noise ratio of the findings you *do* publish.
