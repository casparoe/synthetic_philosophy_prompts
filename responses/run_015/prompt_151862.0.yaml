  **PHI 440: Rational Choice & Strategic Reasoning**
  **Final Exam — Spring Term**
  **Time: 75 Minutes | Total Marks: 30**

  **Instructions:** Answer all three parts. Be precise. You don't need citations, just clear logic. Watch the payoff structures closely.

  **Background: The Platonia Dilemma**
  Recall the standard one-shot Platonia dilemma: Two identical reasoners simultaneously choose **Enter** or **Pass**. If exactly one agent enters, the entrant receives $1,000,000 and the passer receives $0. If both enter or neither enters, both receive $100. There is no cost to enter. In standard causal decision theory (CDT), entering dominates passing ($1M > $0 and $100 ≥ $100). However, superrationality suggests that because the agents share an identical reasoning algorithm, their choices will correlate perfectly.

  **The Twist: The Cascaded Lure**
  Now consider a modified game called the **Cascaded Lure**. There are two agents (you and a duplicate) playing **three rounds** simultaneously. In each round, you choose **Enter** or **Pass**.
  *   **Payoffs per round:**
      *   **Exactly one enters:** The entrant receives **$500,000 × (Round Number)** if their hidden type is **Stable**, but **$0** if their hidden type is **Volatile**. The passer receives **$50,000** regardless of type.
      *   **Both enter OR Both pass:** Both agents receive **$200** for that round.
  *   **Hidden Types:** Before Round 1, each agent is privately assigned a type: **Stable** or **Volatile** (50/50 chance). This assignment is random, private, and **unknown even to the agent themselves**.
  *   **Reveal:** Types are only revealed publicly after Round 3.
  *   **Assumption:** You and the other agent are superrational duplicates (identical reasoning algorithms).

  ---

  **Part 1 (10 Marks)**
  Explain why in the one-shot Platonia case the usual dominance reasoning for entering collapses once the agents recognize they share an identical reasoning algorithm. Pinpoint the exact step where superrational symmetry undermines the "I should enter regardless" argument.

  **Part 2 (12 Marks)**
  Apply that analysis to the Cascaded Lure. Do the hidden Stable/Volatile types break the superrational symmetry or preserve it? Would an evidentialist (EDT) and a causalist (CDT) give different recommendations for Round 1? Be specific about whether the unknown type functions like the Newcomb predictor or like pure noise.

  **Part 3 (8 Marks)**
  A study-group partner says: *"This is just Newcomb with extra steps — the hidden type is the predictor, the rounds are repetition."* Give the best reply that identifies one structural feature of the Cascaded Lure that has no analog in Newcomb and shows why the reduction fails.

  ---
  *(typo in original: please ignore any formatting glitches)*
  ---

  ### Model Answer

  **Part 1: The Collapse of Dominance in Platonia**
  Standard dominance reasoning relies on the **Independence Assumption**: it treats the other agent's choice as a state of nature independent of my own. It compares outcomes across rows: "If they Pass, I prefer Enter ($1M > $100). If they Enter, I prefer Enter ($100 ≥ $0)." Thus, Enter dominates.

  However, superrationality introduces **Logical Correlation**. Because we share an identical reasoning algorithm running on identical information, whatever proof convinces me to Enter also convinces you. The step where dominance collapses is the counterfactual evaluation. When I consider "If I Enter...", I must acknowledge that "If I Enter, then You Enter" is the only physically accessible world consistent with our symmetry. The state "I Enter / You Pass" is logically impossible for identical reasoners. Therefore, I am not choosing between ($1M vs $0); I am choosing between the symmetric outcome (Both Enter = $100) and the symmetric outcome (Both Pass = $100). Dominance fails because the off-diagonal cells (1 Enter, 1 Pass) are unreachable.

  **Part 2: Cascaded Lure Analysis**
  **Symmetry:** The hidden types **preserve** superrational symmetry regarding the *decision algorithm*, even if the payoffs differ. Since the type is unknown to the agent *ex ante*, both agents face the exact same epistemic situation (50% chance I am Stable). They must both adopt the same strategy function based on expected utility. They will both choose Enter or both choose Pass in Round 1. The type does not break the symmetry of the *choice*, only the symmetry of the *payoff* realization.

  **EDT vs. CDT:**
  *   **CDT:** Treats the other's action as causally independent. A causalist calculates EV(Enter) assuming a probability *p* that the other enters. If they assume symmetry (p=1), EV(Enter) = $200 (Both Enter). If they assume independence (p=0.5), EV(Enter) ≈ $125k (weighted avg of winning big or getting $200). CDT likely recommends **Enter** because the potential upside ($500k) dwarfs the coordination penalty ($200), assuming any chance the other might Pass.
  *   **EDT:** Treats my choice as evidence of the other's choice. If I Enter, it is highly probable you Enter (identical algorithm). Thus, EDT evaluates the choice primarily on the symmetric outcome ($200). However, EDT also considers if "Entering" is evidence of being "Stable". If Stable types are more inclined to Enter, then Enter evidences higher payoff. But since type is unknown and random, choice doesn't cause type.
  *   **Divergence:** Yes. CDT sees a positive EV in entering due to the massive upside if the other passes (even if unlikely). EDT sees entering as locking in the $200 coordination payoff (since I predict you'll match me), making them indifferent or preferring Pass to avoid the risk of "Both Enter" yielding low utility compared to the *possibility* of coordination on mixed strategies (though not available here). Specifically, CDT chases the $500k expectation; EDT resigns to the $200 symmetry.

  **Type as Predictor vs. Noise:** The unknown type functions like **pure noise**, not a Newcomb predictor. In Newcomb, the box content *depends* on the prediction of your choice. Here, the type is assigned randomly *before* reasoning begins and does not react to your decision. It creates uncertainty about payoff magnitude, not uncertainty about the correlation of actions.

  **Part 3: The Newcomb Disanalogy**
  The partner's reduction fails because of the **direction of counterfactual dependence**. In Newcomb's Problem, the predictor's setup (box content) is counterfactually dependent on your choice (via the prediction). If you were to choose differently, the predictor would have predicted differently, and the box would be different.

  In the Cascaded Lure, the hidden type is **causally prior and fixed**. If I choose Enter instead of Pass, my type does not change, nor does the other agent's type. There is no mechanism linking the *choice* to the *type assignment*. Newcomb is about **prediction of action**; Cascaded Lure is about **hidden parameters of payoff**. The multi-round structure without feedback reinforces this: in Iterated Newcomb, you learn about the predictor. Here, types are revealed only at the end, so the type cannot function as a predictor that adjusts to your strategy over time.

  ---

  ### Marking Scheme (30 Marks Total)

  | Point | Criteria | Marks | Typical Error Note |
  | :--- | :--- | :--- | :--- |
  | **1** | **Part 1:** Identifies that identical algorithms make the "I Enter / You Pass" state logically inaccessible, collapsing the dominance comparison. | 10 | Candidates often claim symmetry just makes probabilities 50/50 rather than eliminating the off-diagonal outcomes entirely. |
  | **2** | **Part 2:** Argues symmetry is preserved because types are unknown *ex ante*, forcing identical strategy functions despite payoff differences. | 4 | Students often claim different types force different choices, ignoring that agents don't *know* their types yet. |
  | **3** | **Part 2:** Correctly distinguishes EDT (choice evidences matching action) vs. CDT (choice independent of other) leading to different Round 1 recommendations. | 4 | Common to say EDT/CDT agree because the payoff structure is identical for both agents. |
  | **4** | **Part 2:** Classifies the hidden type as noise/state of nature rather than a predictor responsive to choice. | 4 | Candidates frequently treat the hidden type as a "silent predictor" correlating with choice without justification. |
  | **5** | **Part 3:** Identifies the lack of counterfactual dependence between choice and type (unlike Newcomb's prediction/box link) as the structural break. | 8 | Replies often focus on the number of rounds rather than the causal structure of the hidden variable. |
  | **Total** | | **30** | |
