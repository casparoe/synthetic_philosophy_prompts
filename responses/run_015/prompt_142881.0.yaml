      *   *Tone Check:* Warm, firm, intellectual but accessible.
      *   *Constraint Check:* No "she's watching," no "inner light," no "still with us."

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm lecturing the family. The philosophy must serve the comfort, not the other way around. The "editorial deadline" is a beautiful metaphor for death if handled gently. It means the struggle is over.

