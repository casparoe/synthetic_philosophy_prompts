  6.  **Refining the Philosophy for the Audience:**
      *   Avoid "Cartesian Theater" or "Multiple-Drafts." Use metaphors. "Editing," "Revising," "Final Copy."
      *   Make sure the "peace" concept lands. Peace = No more revisions necessary. The work is done.
