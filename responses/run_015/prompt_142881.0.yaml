  8.  **Final Polish:** Check the rhythm. Ensure the transition from the academic theory to the emotional reality is smooth. Make sure the toast feels like a party.

      *(Drafting thought)*: Start with the dock. It grounds her. Then move to the mind. Then back to the room.

