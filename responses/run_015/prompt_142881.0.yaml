answer: |-
  Thank you for coming to the fire hall. Marion was very specific: this is a party. If I start sounding like I'm defending a dissertation, please throw a napkin at me. She would have walked out of a lecture, and she'd be the first to tell you that a theory is useless if it doesn't help you live, or in this case, help us say goodbye.

  We are here to talk about Marion. But Marion spent her life arguing that there isn't a little Marion sitting inside the head, watching the world through the eyes. She didn't believe in a hidden pilot. She believed that who we are is built out of the stories we tell and the revisions we make. She called it an editorial deadline. Most of the time, our minds are drafting and redrafting reality. But eventually, a draft gets sent to press. It becomes fixed.

  When she had her stroke, she lost the ability to recognize faces. I once told her I was glad she was still "in there." She corrected me. She said, "There is no *in there*." She knew her sister Lois by the sound of her footsteps on the dock. She knew her neighbors by the way they walked past the bad dog. She knew us by how we treated her. On her view, knowing isn't a signal received by a ghost in the machine; it's a pattern of response. So, to Lois and the family: when you ask if she knew we loved her, the answer is yes. Not because a spirit felt it, but because she lived in the space of our care. She responded to it. She shaped her final drafts around that love. That makes it real, regardless of where the feeling happens.

  Now, a friend of mine argued that if there is no inner self, then a eulogy is a story about nobody. He asked: if there was no single spectator, who is this speech about?

  It is about the pattern that survived. Marion's character wasn't a hidden core; it was the shape that remained after a lifetime of revisions. The stubbornness that made her a brilliant philosopher is the same stubbornness that made her re-stain that dock every spring until she couldn't hold the brush. The "she" we are talking about is the sum of those actions, now fixed. The editing is finished. The deadline has passed.

  To say she is "at peace," on her terms, doesn't mean a soul is resting in a quiet place. It means the struggle of revision is over. There are no more corrections to make. The draft is final. It is a kind of peace that doesn't require an afterlife to validate it. It is the peace of a job completed, a sentence properly ended.

  To her colleagues: I know some of you thought her model was wrong-headed. But look at how she lived it. She didn't hide behind a title. She was the woman on the dock. She was the voice that said, "Give me a step or two, I'll have you by your walk." She trusted the external evidence. She trusted us.

  To the neighbors: thank you for letting her be the woman with the bad dog and the stained dock, not just the doctor. She loved that you didn't care about her drafts, only her presence.

  So, we are not smuggling a ghost back into the room. We are acknowledging a pattern that changed us. The story I am telling is not about a spectator who has left the theater. It is about the play that was performed, the lines that were spoken, and the impact they had on the audience. The light hasn't gone out inside a box; the lamp has been turned off because the work is done.

  Marion taught us that we are what survives revision. Well, Marion, here is what survives of you. It is this room. It is Lois. It is the dock. It is the work. It is us, revised by knowing you.

  The deadline has arrived. The draft is published. Let's drink to the final copy.
