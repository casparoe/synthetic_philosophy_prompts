answer: |-
  ### Ratings

  1.  **The sulfate veil:** Traction **10** | Legibility **1**
  2.  **Demobilization of armies:** Traction **7** | Legibility **8**
  3.  **Redrawing of borders:** Traction **6** | Legibility **7**
  4.  **Typhus:** Traction **5** | Legibility **3**
  5.  **Suppression of dispatch:** Traction **3** | Legibility **9**

  ### Tiers

  **Cause**
  *   **1. The sulfate veil:** This is the indispensable physical trigger without which the subsequent chain of events remains dormant.

  **Condition**
  *   **2. Demobilization of armies:** This created the structural vulnerability of labor and demand that turned a crop shortage into a social crisis.
  *   **3. Redrawing of borders:** This established the political infrastructure that prevented mitigation by trapping food in surplus regions.

  **Occasion**
  *   **4. Typhus:** This acted as the immediate biological catalyst that converted systemic malnutrition into mass mortality.
  *   **5. Suppression of dispatch:** This represents the specific human choice that sealed the local fate despite the availability of information.

  ### On Scale Conflict

  Where Traction and Legibility pull apart, a novel must follow **Legibility**.

  Narrative requires characters to make choices based on what they can perceive; if you prioritize Traction (the sulfate veil), your characters become puppets of a force they cannot comprehend, which slides you into the environmental determinism you wish to avoid. By prioritizing Legibility, you preserve human agency—your secretary and miller's daughter must act on the world as they *understand* it, even if the reader knows their understanding is incomplete. The tragedy then arises not from fate, but from the gap between their limited knowledge and the high-traction realities they cannot see.

  ### On the Prologue

  The eruption should enter the book **only through its effects**.

  Giving the eruption a prologue grants the *reader* a god-like perspective that the characters lack, which creates dramatic irony but undermines the epistemic constraints that drive your plot. If the mountain appears on stage, it becomes a monster to be fought; if it remains off-stage, felt only through red sunsets, rotting grain, and inexplicable cold, it functions as a true non-human agent—an invisible pressure that shapes the world without robbing the humans of the struggle to navigate it.
