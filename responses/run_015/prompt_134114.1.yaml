answer: |-
  This is a sharp argument—it's essentially a *reductio ad absurdum* version of a debate that has raged in moral philosophy for decades (most notably between Act Utilitarians and Rule Utilitarians, or in discussions about "two-level" morality).

  You want to keep **(1)** (Indirect strategies are useful when direct deliberation is hard) and **(5)** (Obligation is tied to ideal reflection).

  The slip is in **Step (2)**.

  ### The Slip: Premise (2)
  > *(2) For any moral rule R, a fully rational agent can design an indirect strategy that makes R-compliance happen without case-by-case deliberation.*

  This premise is too strong. It claims that **every** moral situation can be successfully handled by a pre-programmed habit or environmental tweak. That is empirically and philosophically false for three reasons:

  1.  **Novelty:** Moral life throws curveballs. You might have a "help people" habit, but the shelter might present a situation you've never encountered (e.g., a specific conflict between two guests that doesn't fit your standard protocols). A rigid indirect system fails here; direct deliberation is required.
  2.  **Rule Conflicts:** What happens when your "tell the truth" habit clashes with your "prevent harm" habit? An indirect system needs a higher-order rule to resolve the conflict, which eventually requires direct deliberation.
  3.  **Moral Salience:** Sometimes, recognizing that a rule *applies* requires deliberation. In the drowning child case, the "rescue-children" habit only triggers if you recognize the child is drowning. If you are distracted, you need direct deliberation to notice the moral demand.

  Because (2) is false, **(6)** and **(7)** collapse. Your "idealized self" (from premise 5) wouldn't just rely on blind habits for *everything*. She would know exactly when to use a habit and when to engage direct deliberation.

  ### How this saves (1) and (5)
  *   **Saving (1):** You can still agree that *when* direct deliberation is hard, unreliable, or prone to bias (like when you are tired or angry), you should use indirect strategies. You just don't have to agree that you should do this *always*.
  *   **Saving (5):** Your idealized self is still the standard. But your idealized self isn't a robot running a script; she is a wise judge who knows that saving a drowning child requires immediate, direct moral engagement, not a system audit.

  ### The Cost of Giving Up (2)
  You asked what the cost is of rejecting the slipping step. If you give up the idea that "everything can be automated," here is what you have to accept:

  **1. You lose the comfort of certainty.**
  If (2) were true, morality would be an engineering problem: build the right system, and you're good. By rejecting it, you admit that moral life requires ongoing judgment. You can't just "set it and forget it." This validates your feeling of second-guessing at the shelter. That anxiety isn't necessarily a failure of your system; it might be your moral sensitivity detecting a situation where the system isn't enough.

  **2. You accept a "Dual-Process" morality.**
  You have to live with two modes:
  *   **Mode A (Habit):** For routine stuff (showing up on time, standard protocols), trust your habits. Don't deliberate.
  *   **Mode B (Direct):** For high-stakes, novel, or conflicting situations (the drowning child, a guest in unique crisis), you *must* deliberate.
  The cost is the cognitive load of knowing *which* mode you are in.

  **3. Obligation returns to the Act.**
  There is a deeper philosophical error in **Step (7)** that you should also be aware of. Even if you *could* automate everything, Step (7) claims "there are never direct obligations to do particular acts."
  Most philosophers distinguish between the **Criterion of Rightness** (what makes an act right) and the **Decision Procedure** (how I figure out what to do).
  *   *Example:* The *obligation* is to save the child (Criterion). The best *way* to ensure you do that might be a habit (Procedure).
  *   Rejecting (2) helps, but you also need to reject the idea that having a habit-based *procedure* eliminates the act-based *obligation*. Your duty is to the child, not to your habit. The habit is just the tool.

  ### Application to your Shelter Work
  Your roommate's argument suggests that your second-guessing is a bug in your system. By rejecting Step (2), you can see that second-guessing is often a feature.

  *   **When to trust the habit:** Sorting donations, following safety protocols, routine greetings. Here, deliberation slows you down.
  *   **When to trust the deliberation:** A guest is crying in a way you haven't seen before, a conflict arises that isn't in the handbook, or you feel a "pull" to do something extra.

  Your idealized self (Premise 5) wouldn't ignore those moments to check her habit system. She would engage directly. So, keep building routines for the routine, but don't feel guilty when you stop to think. That's not a failure of indirect normativity; it's the necessary supplement to it.
