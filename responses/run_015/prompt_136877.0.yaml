      *   *Section 2: Testing the "Bad Outcome" Hypothesis.* The Discrete vs. Gradual distinction is good, but maybe "Deceptive vs. Instrumental" is better. Control fears *agency* (the model wants). Alignment fears *optimization pressure* (the model does). Actually, let's stick closer to the user's framing but refine it. The real divide is **Internalism vs. Externalism**. Alignment believes safety is an internal property (weights). Control believes safety is a relational property (system + environment).
