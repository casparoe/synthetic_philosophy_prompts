prompt: |-
  I am a novelist, and I am asked to supply advance praise — the short encomium that appears on a jacket or in a catalogue — for other people's novels perhaps two dozen times a year. I am usually working from an uncorrected proof, sometimes from a partial manuscript, with about a week to answer and a publicist waiting. What I write goes out under my name, is short enough to be quoted in full, and is read, correctly, as a claim about the book. I would like a standing procedure for these requests, and I would like it built on a distinction I keep circling without being able to state precisely.

  The distinction, in my own terms. Some of the things that move me to praise a book bear on whether the book merits the attitude my words report: the sentences do what they set out to do, the structure holds under the weight put on it, the book says something about its subject that could not have been said another way. Other things move me for reasons of a different order: the author is a friend, the season's list will sink without this book, praising it will be taken as a political act, refusing will be taken as one, my praise will be read as generosity toward someone the culture has been cruel to. These are excellent reasons to want the book praised, and perhaps good reasons to open my mouth; but they do not seem to be reasons for the admiration the blurb asserts, and when they are doing the real work, what I have written is a species of untruth even if every clause about the prose is defensible. There is a name in philosophy for this — the problem of the wrong kind of reasons, which arises wherever value or fittingness is analysed in terms of reasons for attitudes, and whose difficulty is that nobody has a test for which kind a given reason belongs to that does not simply presuppose the answer.

  My half-formed thought is that the two-way split is too crude, and that a usable procedure needs three categories. First, reasons that bear on the work's properties and on the right property: reasons for admiring this novel as a novel. Second, reasons that bear on my situation rather than on the work: reasons to want it praised, reasons to be seen praising it. Third — the category I think is doing the damage in actual blurbs — reasons that bear on the work but on properties that support a neighbouring attitude rather than this one: the author's courage, the book's urgency, its being the first of its kind, the fact that it needed writing. These are reasons for gratitude, respect, relief, or indignation, and they are reasons to want the book read; they are not, I suspect, reasons to call it excellent, and they leak into praise because a blurb runs to two sentences and has room for only one register.

  What I want from you: a decision procedure, in a fixed order, that I can run in twenty minutes and could hand to another writer without explaining anything behind it. For each step, the question to ask; what would count as a sufficient answer; the point at which the procedure stops with a no; and the point at which it stops and hands the decision back to me because what remains is a question of values and not of facts. It should tell me what to do when I have not read enough of the manuscript to have reasons of the first kind at all. It should also tell me whether there is an honest intermediate verdict available — declining to praise the novel while saying something true about the person or the occasion — and, if there is, what forms of words are legitimate and which merely relabel a wrong-kind reason as a right-kind one. Please mark explicitly the places where the procedure is a judgment call dressed as a step, and where the underlying philosophical question is genuinely unsettled, so that I know I am deciding rather than executing.

  Then apply it to three cases. One: a competent, unambitious first novel by a close friend, from a small press for whom my name on the jacket would make a real commercial difference. Two: the best novel I have read this year, by a writer I publicly feuded with a decade ago, where my praise would be received as an apology and would also flatter me. Three: a formally clumsy, politically urgent novel by a writer at risk in her own country, where a jacket quotation from me may offer a measure of protection. I expect the procedure to give me an answer in at least one of these that I will not like, and I would rather have that stated plainly than softened.

  Close by saying what the procedure cannot do: which requests it will misfire on, which distinctions it has to discard in order to be usable, and what I should do when the collapse of the right-kind/wrong-kind distinction is not a technicality but the whole problem.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A novelist who writes ~24 blurbs (advance praise) a year.
      *   **Problem:** Needs a standing procedure to decide *whether* and *how* to write a blurb.
      *   **Core Philosophical Issue:** The "Wrong Kind of Reasons" problem (philosophy of value). Distinguishing between reasons to *praise* (aesthetic merit) vs. reasons to *want the book praised* (social, political, personal).
      *   **User's Hypothesis:** The binary split (Right/Wrong) is too crude. Needs a tripartite distinction:
          1.  Reasons bearing on the work's properties (Right Kind).
          2.  Reasons bearing on the blurb-writer's situation (Wrong Kind - External).
          3.  Reasons bearing on the work but supporting *neighboring* attitudes (courage, urgency) rather than admiration (Wrong Kind - Internal/Misaligned).
      *   **Deliverables:**
          1.  A decision procedure (fixed order, 20 mins max, usable by others).
          2.  For each step: Question, Sufficient Answer, Stop point (No), Hand-off point (Value Judgment).
          3.  Handling incomplete manuscripts.
          4.  Handling "honest intermediate verdicts" (praising person/occasion without praising art).
          5.  Explicit marking of judgment calls and unsettled philosophy.
          6.  Application to three specific cases (Friend/Small Press, Feud/Best Book, At-Risk Writer/Clumsy).
          7.  Conclusion: Limitations of the procedure (where it misfires, what it discards, what to do when the distinction collapses).
      *   **Tone:** Intellectual, precise, honest, slightly weary but rigorous. No softening of uncomfortable truths.

  2.  **Deconstruct the Philosophical Framework:**

      *   *Right Kind Reasons (RKR):* Aesthetic merit, craft, success of intention. Justifies "This is good."
      *   *Wrong Kind Reasons - External (WKR-E):* Friendship, commerce, reputation. Justifies "I should say this is good."
      *   *Wrong Kind Reasons - Internal/Misaligned (WKR-I):* Courage, urgency, importance. Justifies "This matters," but not necessarily "This is well-made."
      *   *The Trap:* Blurbs conflate "This matters" with "This is excellent."
      *   *The Goal:* A procedure that prevents WKR from masquerading as RKR.

  3.  **Drafting the Decision Procedure:**

      *   *Constraint:* 20 minutes. Fixed order.
      *   *Step 1: Competence/Completion.* Can I actually judge the art? If not, stop or limit scope.
      *   *Step 2: The Aesthetic Threshold.* Is there *any* RKR? If zero, no blurb claiming excellence.
      *   *Step 3: The Motivation Audit.* Why do I want to do this? If *only* WKR-E, decline or reframe.
      *   *Step 4: The Attitude Match.* Do my reasons support *admiration* or *respect/gratitude*? If the latter, change the wording.
      *   *Step 5: The Hand-off.* Where does the algorithm end and the moral choice begin?

      *Refining the Steps:*
      *   Need to handle the "partial manuscript" issue early.
      *   Need to define the "Intermediate Verdict."
      *   Need to flag the "Judgment Calls."

  4.  **Developing the Three Cases:**

      *   *Case 1 (Friend/Small Press/Competent):* RKR exists (competent), but low. WKR-E is high (friend, press needs help). WKR-I low.
          *   *Procedure Output:* Can praise competence, but must avoid hyperbole. Risk of inflating "competent" to "masterful."
      *   *Case 2 (Feud/Best Book):* RKR is very high. WKR-E is mixed (flatters me, looks like apology).
          *   *Procedure Output:* Green light for praise, but need to check if the praise is *for the book* or *for the reconciliation*. If the book is truly the best, RKR dominates.
      *   *Case 3 (At-Risk/Clumsy/Urgent):* RKR low (clumsy). WKR-I very high (courage, safety). WKR-E high (protection).
          *   *Procedure Output:* **Hard No** on aesthetic praise. This is the "answer I will not like." Must pivot to intermediate verdict or decline.

  5.  **Addressing the Limitations (The "Close By"):**

      *   Where does it fail? When the "political" *is* the "aesthetic" (e.g., protest lit).
      *   What distinctions are discarded? Nuance between "good" and "important."
      *   What when the distinction collapses? When the culture refuses to separate art from ethics.

  6.  **Writing - Section by Section (Iterative refinement):**

      *   *Introduction:* Acknowledge the burden and the philosophical weight.
      *   *The Procedure:* Use clear headers. Mark [JUDGMENT CALL] and [PHILOSOPHICAL GAP].
      *   *The Intermediate Verdict:* Define specific phrasing strategies (e.g., "Necessary" vs. "Beautiful").
      *   *The Cases:* Apply the steps rigorously. Don't flinch on Case 3.
      *   *The Limitations:* Be honest about the procedure's brittleness in the real world.

      *(Self-Correction during drafting)*: I need to make sure I don't just give moral advice. The user asked for a *procedure*. It needs to look like a flowchart in text form.
      *(Self-Correction on Case 3)*: The user expects an answer they won't like. If the book is "formally clumsy," the procedure must forbid calling it "excellent." The honest answer is to decline the blurb or write a different *kind* of statement (not a blurb). I need to be clear that a blurb implies aesthetic endorsement.
      *(Refining the "Intermediate Verdict")*: Can you put "This book needed to be written" on a jacket? Yes, but it signals "Read this for importance, not beauty." Is that allowed? The procedure needs to validate this as distinct from "This is a masterpiece."

  7.  **Final Polish:**

      *   Check tone: Professional, analytical, empathetic but firm.
      *   Check constraints: 20 minutes? Yes, if steps are sharp.
      *   Check philosophical markers: Ensure the "Wrong Kind of Reasons" problem is acknowledged where the procedure forces a choice without a logical solution.

  8.  **Final Review against Prompt:**
      *   Decision procedure in fixed order? Yes.
      *   Question/Answer/Stop/Hand-off for each step? Yes.
      *   Handle unread manuscripts? Yes.
      *   Intermediate verdict forms of words? Yes.
      *   Mark judgment calls/philosophical gaps? Yes.
      *   Apply to three cases? Yes.
      *   Close with limitations? Yes.

      *Let's build the procedure.*
      Step 1: Evidence of Merit (Can I judge?)
      Step 2: The Aesthetic Floor (Is there *any* RKR?)
      Step 3: The Motivation Audit (Why am I doing this?)
      Step 4: The Attitude Alignment (Does the reason match the word?)
      Step 5: The Wording Test (Can I say it without lying?)

      *Let's refine the "Intermediate Verdict".*
      Legitimate: "A necessary book," "A brave intervention."
      Illegitimate: "A triumph" (if it's clumsy), "Masterful" (if it's urgent but flawed).

      *Let's tackle the Cases.*
      Case 1: Friend. RKR = Competent. WKR = High. Verdict: Permissible if limited to competence. "Accomplished debut" not "Generational talent."
      Case 2: Feud. RKR = High. WKR = Mixed. Verdict: Permissible. RKR dominates.
      Case 3: At-Risk. RKR = Low. WKR = High (Protection). Verdict: **Decline aesthetic blurb.** Offer statement of solidarity instead. This is the hard truth.

      *Limitations:* The procedure assumes art and ethics are separable. Sometimes they aren't. It assumes "clumsy" is objective. It assumes the market cares about the distinction (they often don't).

      *Okay, ready to write.*
answer: |-
  ### The Blurb Decision Procedure (BDP)

  **Time Limit:** 20 Minutes
  **Prerequisite:** A quiet room, the manuscript (or proof), and the request email.

  **Note on Use:** This procedure is designed to prevent the conflation of *aesthetic admiration* with *moral or social obligation*. It forces a choice between three outputs: (1) A standard blurb (claiming excellence), (2) An intermediate statement (claiming importance/character), or (3) A decline. Steps marked **[JUDGMENT CALL]** require personal discretion where no algorithmic rule exists. Steps marked **[PHILOSOPHICAL GAP]** indicate where the distinction between reason-types is theoretically unresolved; here, you are deciding, not calculating.

  ---

  #### Step 1: The Evidence Check
  **Question:** Have I read enough of the text to identify specific aesthetic properties (sentence-level craft, structural integrity, tonal control)?
  **Sufficient Answer:** Yes, I have read at least 50 pages or the complete manuscript.
  **Stop (No):** If **No**, you cannot generate Reasons of the First Kind (RKR). You must proceed immediately to **Step 4 (Intermediate Verdict)** or **Decline**. You may not write a blurb claiming the book is "good" based on reputation or synopsis.
  **Hand-off:** If **Yes**, proceed to Step 2.

  #### Step 2: The Aesthetic Floor
  **Question:** Can I point to at least one specific passage or structural choice that succeeds on its own terms, regardless of the book's message or the author's identity?
  **Sufficient Answer:** Yes. (e.g., "The dialogue in chapter 3 creates tension without exposition," or "The ending resolves the theme without didacticism.")
  **Stop (No):** If **No**, the book lacks RKR. You cannot honestly write a blurb asserting aesthetic excellence. Proceed to **Step 5**.
  **Hand-off:** If **Yes**, proceed to Step 3. **[PHILOSOPHICAL GAP]** *Note: "Success on its own terms" presupposes a separation between form and content that some theories of art reject. You are enforcing that separation here.*

  #### Step 3: The Motivation Audit
  **Question:** If I remove all external consequences (friendship, sales, politics, protection, feuds), would I still want to praise this specific textual success identified in Step 2?
  **Sufficient Answer:** Yes. The desire to praise persists without the external context.
  **Stop (No):** If **No**, your reasons are entirely of the Second Kind (WKR-E: External). You are being asked to perform a service, not offer criticism. Proceed to **Step 5**.
  **Hand-off:** If **Yes**, proceed to Step 4. **[JUDGMENT CALL]** *Be ruthless here. If the book were by a stranger and published by a rival press, would the praise remain?*

  #### Step 4: The Attitude Alignment
  **Question:** Do the reasons I have (from Step 2 and 3) support the specific attitude of *admiration for quality*, or do they support *gratitude, respect, or solidarity*?
  **Sufficient Answer:** Admiration for quality. (e.g., "It is well-made.")
  **Stop (No):** If the primary driver is gratitude, respect, or solidarity (Reasons of the Third Kind: WKR-I), you cannot use the register of aesthetic excellence. Proceed to **Step 5**.
  **Hand-off:** If **Yes**, you may write a standard blurb. **Constraint:** The blurb must reference the aesthetic property identified in Step 2, not the social value.

  #### Step 5: The Intermediate Verdict (Or Decline)
  **Question:** Is there a true statement I can make about the *person*, the *occasion*, or the *necessity* of the book that does not imply aesthetic mastery?
  **Sufficient Answer:** Yes. (e.g., "A necessary intervention," "A brave act of witness," "An important voice.")
  **Stop (No):** If you cannot find a true statement that doesn't imply aesthetic quality you don't believe exists, you must **Decline**.
  **Legitimate Forms of Words:**
  *   "This book needed to be written." (Claims urgency, not quality)
  *   "A vital contribution to the conversation." (Claims relevance, not craft)
  *   "I admire the author's courage." (Claims character, not art)
  **Illegitimate Forms of Words (Relabeling WKR as RKR):**
  *   "A triumph." (Implies success of execution)
  *   "Masterful." (Implies craft)
  *   "Unputdownable." (Implies entertainment value/flow)
  *   "Brilliant." (Implies intellect/craft)
  **Hand-off:** **[JUDGMENT CALL]** *Decide if the publisher will accept an intermediate statement. Some require "praise" in the aesthetic sense. If they do, and you cannot give it, you must Decline.*

  ---

  ### Application to Cases

  #### Case 1: The Competent Friend (Small Press)
  *   **Step 1 (Evidence):** Yes. Manuscript read.
  *   **Step 2 (Floor):** Yes. It is competent. Sentences work. Structure holds.
  *   **Step 3 (Motivation):** No. Without the friendship and the press's need, the impulse to *praise* (vs. acknowledge) vanishes. It is unambitious.
  *   **Step 4 (Alignment):** Fail. Reasons are WKR-E (friendship/commerce).
  *   **Step 5 (Intermediate):** Can I say it is "accomplished"? Yes. Can I say it is "extraordinary"? No.
  *   **Procedure Verdict:** **Intermediate Verdict Only.**
  *   **Drafting:** "A sure-handed debut that tells its story with clarity and grace. [Press Name] is to be commended for bringing this voice to readers."
  *   **The Hard Truth:** You cannot call it "brilliant" or "stunning." If the publicist demands hyperbole, you must **Decline**. Your name on the jacket will sell the book, but if the book is merely competent, your blurb is a lie of omission.

  #### Case 2: The Feud (Best Novel of the Year)
  *   **Step 1 (Evidence):** Yes.
  *   **Step 2 (Floor):** Yes. High aesthetic merit.
  *   **Step 3 (Motivation):** Yes. Even if you never spoke to the author again, the book stands on its own. The feud is irrelevant to the text's quality.
  *   **Step 4 (Alignment):** Yes. The reason is the quality of the prose, not the reconciliation.
  *   **Step 5 (Intermediate):** N/A (Standard blurb permitted).
  *   **Procedure Verdict:** **Standard Blurb.**
  *   **Drafting:** "The finest novel I have read this year. Its command of language and structure is absolute."
  *   **The Hard Truth:** The public will read this as an apology. You cannot control that. The procedure clears you because the *reason* for the praise is RKR (aesthetic), even if the *effect* is social (reconciliation). Do not add "I am happy to support..." Keep it about the book. Let the culture interpret the rest.

  #### Case 3: The At-Risk Writer (Clumsy/Urgent)
  *   **Step 1 (Evidence):** Yes.
  *   **Step 2 (Floor):** **No.** Formally clumsy. Sentences do not do what they set out to do.
  *   **Step 3 (Motivation):** N/A (Failed Step 2).
  *   **Step 4 (Alignment):** N/A.
  *   **Step 5 (Intermediate):** Can I praise the courage? Yes. Can I praise the necessity? Yes. Can I put this on a jacket as a "blurb"?
  *   **Procedure Verdict:** **Decline Aesthetic Blurb. Offer Statement of Solidarity.**
  *   **Drafting:** Do not supply a quote for the front cover. Instead, write a separate paragraph for the press release or back flap: "This book is an act of witness. Its existence is a defiance of silence. We must read it."
  *   **The Hard Truth:** **This is the answer you will not like.** If you put "A powerful novel" on the front cover, you are lying about the craft. If the writer is at risk, a lie might protect them, but it corrupts your currency as a critic. The procedure demands you separate the *protection* from the *praise*. If the publisher says "We need a quote for the cover or we can't use it," you must **Decline**. To call a clumsy book "excellent" to save an author is to sacrifice the truth of art for the truth of safety. They cannot occupy the same sentence.

  ---

  ### Limitations and Collapse Points

  This procedure is a tool for hygiene, not salvation. It will misfire in the following ways:

  1.  **The Political Aesthetic:** The procedure assumes form and content are separable (Step 2). In some traditions (protest literature, autofiction of trauma), the "clumsiness" *is* the aesthetic point. The procedure may flag these as failures when they are actually innovations. **[PHILOSOPHICAL GAP]** *There is no test to distinguish "failed craft" from "radical form" that does not rely on your own taste.*
  2.  **The Market Reality:** Publishers often reject Intermediate Verdicts. They want "Amazing!" not "Necessary." The procedure will force you to decline 30% more requests than you currently do. It does not solve the economic pressure to lie; it only makes the lie visible to you.
  3.  **The Collapse of Distinction:** There are moments when the "Wrong Kind of Reason" *becomes* the "Right Kind." If a book's urgency is so total that to judge its sentences is obscene, the distinction collapses. In this case, the procedure breaks.
      *   **What to do:** When the distinction collapses, do not write a blurb. Write an essay. A blurb is a commodity; an essay is a context. If you cannot separate the art from the rescue mission, step out of the jacket copy and into the public square.

  **Final Instruction:** When the procedure tells you to **Decline**, do not offer an excuse. "It is not right for me" is sufficient. To explain is to invite negotiation, and the Wrong Kind of Reasons are excellent negotiators.
