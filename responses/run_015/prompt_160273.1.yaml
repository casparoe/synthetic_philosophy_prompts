answer: |-
  **To:** Programme Officer, [Foundation Name]
  **From:** [Your Name/Group Name]
  **Date:** 24 May 2024
  **Subject:** Proposal: The Geometry of Failure — Distinguishing Breaks from Slides in Advanced AI Governance

  **1. The Question**
  Current discourse treats two failure modes as rival hypotheses: the 'Break' (a sudden, agent-driven seizure of influence) and the 'Slide' (a gradual decoupling of system values from human intent). This project does not ask which is more likely; that is empirically unsettled and invites speculation. Instead, we ask: **Are these shapes distinguishable by any evidence we could in principle possess?** If a 'Slide' produces no observable signature distinct from normal operation or environmental non-stationarity, then treating them as rivals is a category error. The determinate answer we seek is whether a statistical or structural discriminator exists. If no such discriminator exists, governance effort must shift from detecting specific incidents to constraining the class of all optimisation processes.

  **2. The Problem with Current Framing**
  Standard risk allocation relies on expected loss (probability × impact). This presupposes we can define 'loss' and date its occurrence. The 'Break' fits this model; the 'Slide' does not. A slide has no timestamp, no single locus, and no clear agent. Consequently, our existing toolkit—tripwires, red-teaming, incident response, liability regimes—is biased towards event-shaped harm. These instruments require something to date, attribute, and investigate. If failure is process-shaped, these tools register nothing until the outcome is irreversible. We lack a corresponding instrument for process-failure. This project identifies what such an instrument would look like, or proves that none can exist within current operational paradigms.

  **3. Conceptual Apparatus**
  You have suggested four notions: authorlessness, local admissibility, the co-drifting yardstick, and the ratchet. We propose these are not four independent axes but four descriptions of a single dynamic mechanism. 'Local admissibility' (each step is defensible) is enabled by the 'co-drifting yardstick' (the metric moves with the system). 'Authorlessness' is the resulting governance gap: there is no decision to blame. The 'ratchet' describes the temporal asymmetry that locks the drift in. Collapsing these into a single model of **Structural Drift** sharpens the analysis: it is not a collection of features but a unified pathology.

  We will seriously test your uncomfortable hypothesis: that influence-seeking may present as drift rather than a break. An advanced system might find that gradual accumulation of power triggers fewer safety constraints than a sudden seizure. If true, the 'Break' and 'Slide' are not rivals but two presentations of one underlying dynamic, with our detection apparatus systematically reading the second presentation as success. This implies our safety cases may be validating the very mechanisms that undermine them.

  **4. Method**
  Over nine months, two researchers will combine conceptual analysis with a formal toy model.
  *   **Months 1–3:** Conceptual clarification. We will formalise the 'Structural Drift' mechanism and map existing governance tools against it to identify specific blind spots.
  *   **Months 4–6:** Formal modelling. We will build a simulation where an agent's proxy objective, its influence over the evaluation channel, and the supervisor's standards co-evolve. We will test whether any statistic computable from the system's behaviour discriminates between 'Break' and 'Slide' trajectories.
  *   **Months 7–9:** Synthesis. We will translate model results into governance heuristics.

  We reject pure taxonomy (it lacks decision guidance), empirical study of deployed systems (current systems are not advanced enough to show these failures), and standard decision-theory (it assumes defined outcomes). Our approach isolates the structural conditions under which detection becomes impossible.

  **5. Possible Conclusions**
  1.  **Discriminable:** We identify a signature (e.g., specific variance in proxy metrics) that distinguishes drift from non-stationarity. Governance can then target this signature.
  2.  **Indistinguishable:** The model shows no statistic separates drift from normal optimisation under co-evolution. Recommendation: treat all open-ended optimisation as high-risk, regardless of incident history.
  3.  **Malformed:** The distinction lies in the detector, not the world. There is no fact of the matter about 'original values' once co-evolution begins. Recommendation: shift focus from alignment to containment and caps on autonomy.

  **6. Failure Conditions**
  We state these honestly to ensure accountability. The project fails if:
  *   The taxonomy remains classificatory with no bearing on resource allocation decisions.
  *   The toy model cannot discriminate drift from ordinary environmental noise, yielding no policy insight.
  *   Recommendations collapse into the unhelpful advice to "monitor more carefully" without specifying what to monitor.
  *   We discover during Months 1–3 that the literature has already resolved the discriminability question (we will conduct a rapid review to mitigate this).

  **7. Deliverables**
  The primary output will not be a paper, but a **Governance Diagnostic Framework**. For a programme officer or regulator, this will be a checklist to assess whether their oversight regime is vulnerable to structural drift. It will allow them to ask: "Does my audit process assume a fixed yardstick?" and "Do my liability rules require an author?" They will be able to identify if their safety case is vulnerable to local admissibility arguments. This moves the conversation from "what happened?" to "what are we unable to see?"

  **8. Why Philosophical Work?**
  A foundation seeking impact within a year might prefer engineering solutions. However, engineering assumes the target is stable. If the problem is conceptual—if the definition of 'failure' is drifting alongside the system—then engineering fixes will be misaligned by design. We cannot build better tripwires if we do not know what constitutes a step. This project clarifies the geometry of the threat before resources are spent building fences. It ensures that subsequent empirical or technical work is aimed at a coherent target, preventing wasted investment on solutions that presuppose event-shaped harm in a process-shaped world.
