  You are a professional philosopher specialising in formal epistemology, with several years of experience setting and marking closed-book exams at upper-undergraduate and master's level. Please work carefully and in stages rather than producing your answer in one pass. Begin with a clearly labelled **Planning** section in which you (a) list three candidate "cruxes" around which an exam question on the lottery case and the preface case could be built, (b) say in one sentence each why you are setting two of them aside, and (c) name, in one sentence, the single most likely way a well-prepared student will try to fake an answer. Only after that section should you produce the deliverables. Take your time: intellectual correctness matters more than speed or brevity, and I would rather have a short correct rubric than a long confident one.

  Some background on me, so that you can calibrate what I can and cannot check. I am a software engineer by training and profession; I have no formal philosophy education beyond a couple of undergraduate electives taken many years ago. For the past three years I have co-taught the epistemology half of a final-year seminar, "Uncertainty, Evidence and Automated Decision-Making," in a professional master's programme, alongside a colleague from the philosophy department who is now on sabbatical. I am therefore responsible, on my own, for one question on this year's final exam and for the marking scheme that goes with it. The students are mostly computer science and data science graduates with one prior philosophy course; a few have read a good deal more. The exam is closed-book, no internet, sixty minutes for this one question, and the question carries 25 of the paper's 100 marks.

  The constraint I care most about is this: every student in the room will have read the standard presentation of the lottery case and the preface case, and the standard menu of responses to them — reject the closure principle, reject the fixed threshold on justified belief, go contextualist, distinguish belief from degrees of belief, and so on. A question that can be answered by writing out that menu is useless to me. I need a question that forces a student to apply the apparatus to a variant they have not seen, and that separates a student who understands why the cases bite from a student who has memorised the labels of the solutions.

  To that end, I would like you to build the question around a scenario from my own field, which I have sketched below. I am confident about the engineering in it; I am not confident about which parts of it are philosophically load-bearing, and deciding that is part of your job.

  **The scenario.** A serving stack runs a batch of work across 1,000 inference replicas. Each replica independently returns a wrong answer with probability 0.001; the independence is known, not merely assumed out of ignorance, because the replicas are separately seeded and separately provisioned. An independent monitor, itself reliable to 0.99, raises the alert "at least one replica in this batch returned a wrong answer." You are the on-call engineer. You have very strong statistical grounds for believing of each individual replica that it was correct on this batch; you have decent grounds for believing the monitor; and you have no way at all of identifying *which* replica failed. The failover protocol nevertheless lets you discard the whole batch and re-run it, or to re-run and take a majority vote across replicas, without ever identifying the culprit.

  Here are the raw materials I would like the question to make use of, in whatever structure you think best. First: the cases differ in that the engineer, unlike the author of the preface, can act on the aggregate suspicion without ever locating its object, and I want students to say whether that dissolves the tension, relocates it to the level of action, or leaves it exactly where it was. Second: most discussion I have seen runs in one direction, from justified belief in each of a set of propositions to justified belief in their conjunction; I want students to consider the reverse-looking principle, from justified belief that the conjunction is false to justified disbelief in some particular one of its conjuncts, and to say whether rejecting the familiar principle commits you to rejecting this one too, and whether the preface case needs it in a way the lottery case does not. Third: I want them to handle a variant in which the failures are positively correlated rather than independent — because the replicas share model weights and share an input batch, or because, in the analogue with the author, one mistaken assumption at the beginning of the book vitiates several later claims — and to say what happens to the aggregate claim when the independence assumption is removed. Fourth: I want them to say whether the monitor's alert functions more like the "someone wins" claim in the lottery case or more like the "at least one error somewhere" claim in the preface case, and what follows if it is neither.

  Please give me the following, in markdown, in this order.

  1. **The question itself**, self-contained: state both original cases in the stem so that no part of the answer depends on recall, then the sub-parts, with marks allocated to each and a total of 25. Tell me the intended time on each sub-part.
  2. **A model answer** of roughly 900 words, written so that a non-philosopher can mark with it. Where you use a technical term, gloss it briefly on first use; and include a short glossary of the six or so terms a grader is most likely to need.
  3. **A marking scheme** that separates an excellent answer from a competent one from a weak one by naming the specific moves each must contain, not by general impressions of quality. It must also list at least four moves that sound sophisticated but should lose marks — for instance, treating this as nothing but a version of the gambler's fallacy, or assuming that an expected-utility calculation settles a question about justification, or thinking that rejecting the closure principle ends the matter — with one line each on why the move is wrong and what it costs the student.
  4. **An instructor note** addressed to me: what prior knowledge the question assumes, how to handle an answer that competently defends a conclusion you disagree with, and the two or three clarifying announcements I should be ready to make in the exam room, since I cannot improvise philosophy under time pressure.
  5. **One sentence** identifying the single sentence in your question that is doing most of the work, so that I do not accidentally delete it if I have to cut the question for length.

  Three housekeeping requirements. Do not include any citations, bibliographies, or reading lists, in either the question or the model answer; the question must not require or reward a student for naming authors, papers, or dates, and the rubric should say so, because the exam is closed-book and a student who has memorised the literature should have no advantage over one who has not. Write so that everything needed is in the question stem or is standard knowledge a student could reason to on the spot. Finally, if you think my framing rests on a confusion, or if the scenario fails to generate the tension I am expecting, say so plainly in a short note at the end rather than silently building a question around a bad idea.
