  # 4. Instructor Note

  **Prior Knowledge:**
  This question assumes familiarity with basic probability (independence vs. correlation) and basic logic (conjunctions). It does not assume prior knowledge of epistemology literature; all necessary definitions (Lottery/Preface) are in the stem.

  **Handling Disagreement:**
  Philosophy questions often permit multiple valid conclusions (e.g., a student might argue the tension *is* dissolved by action). Award marks based on the *coherence* of the argument and whether it engages with the specific constraints (monitor, correlation), not on whether they match the model answer's conclusion. If they argue a position consistently using the provided premises, reward them.

  **Clarifying Announcements:**
  1.  **"Justified Belief":** If asked, define this as "believing based on the evidence provided in the scenario," not necessarily "true belief."
  2.  **"Independence":** Remind students that independent errors mean $P(A \text{ and } B) = P(A) \times P(B)$, whereas correlated errors do not follow this rule.
  3.  **"Monitor Reliability":** Clarify that 0.99 reliability means if there is an error, it alerts 99% of the time (and similarly for no error), treating it as strong but fallible evidence.

