      *   *Revealed Preference View:* Initially, utility(Evening) > utility(Morning). Token changed the constraint (cost of missing streak). When constraint removed, utility(Morning) > utility(Evening) now. Preferences changed. End of story.
      *   *Psychological Utility View:* The inner state (circadian rhythm, lifestyle fit) probably didn't change. The token acted as a nudge that broke inertia. The "preference" was locked by habit, not true utility. The logs show a switch, but the inner utility might still be higher for evenings (they might churn later due to burnout). The logs show stability, but the inner state is misaligned.

  5.  **Evaluate the Fit (Easy vs. Forced vs. Nowhere):**
      *   *Easy:* Mapping choices to `event_logs`. Revealed preference fits naturally into funnel analysis (Conversion = Preference).
