      *   *Drafting Case 2:*
          *   Pos 1: Token changed constraints. New equilibrium found. Preference updated.
          *   Pos 2: Token broke habit lock. True preference (circadian) unchanged, but behavior locked into new path. Logs show retention, but true utility might decay later.
      *   *Drafting Fit:*
