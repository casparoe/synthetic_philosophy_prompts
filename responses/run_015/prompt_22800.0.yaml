answer: |-
  This is an excellent exchange. It maps almost perfectly onto the central debate in the academic literature on moral uncertainty (specifically between "Maximization of Expected Choice-worthiness" proponents like William MacAskill and critics focusing on the problem of intertheoretic comparisons).

  Here is a step-by-step refereeing of their exchange, followed by an analysis of what both are missing.

  ### Step-by-Step Refereeing

  **Step 1: M's Opening (The MEC Model)**
  *   **Claim:** Moral uncertainty is structurally identical to empirical uncertainty. Assign credences to theories, calculate expected value, maximize.
  *   **Ruling:** **M is standard, but assumes a hidden premise.**
      M is describing the dominant model in the field (Maximization of Expected Choice-worthiness, or MEC). It is the most intuitive extension of decision theory. However, M is treating "value" as a univocal concept across theories. This works *if* you assume all moral theories can be represented on a common cardinal scale. M is right that this is the starting point, but wrong to imply it's uncontroversial.

  **Step 2: R's Objection (Incommensurability)**
  *   **Claim:** You can't average a number (utilitarianism) with a prohibition (rights theory). The sum is undefined.
  *   **Ruling:** **R is technically correct.**
      This is the "Problem of Intertheoretic Comparisons." Deontological theories often deal in *constraints* or *permissions* (binary or ordinal), while consequentialist theories deal in *aggregative good* (cardinal). Mathematically, you cannot add a scalar to a non-scalar. R correctly identifies that MEC requires a common currency of "choice-worthiness" that many object-level theories do not naturally provide.

  **Step 3: M's Counter (Meta-Level Definition)**
  *   **Claim:** Incommensurability is a defect in the object-level theories, not the meta-procedure. The meta-comparison is always well-defined.
  *   **Ruling:** **M is controversial here.**
      M is effectively arguing for "consequentializing" deontology—the idea that any moral theory can be reformulated to output a number (e.g., "100 units of value for keeping a right, -infinity for violating it"). While possible, this is not a neutral procedural move; it's a substantive metaethical claim that distorts the structure of deontological theories (e.g., it turns a constraint into a cost-benefit analysis). M is right that we *can* force theories into this shape, but wrong to claim this doesn't alter the theories themselves.

  **Step 4: R's Rebuttal (Mathematical Rigor)**
  *   **Claim:** EV requires a single numerical scale. If a theory lacks numbers, the sum doesn't exist.
  *   **Ruling:** **R is mathematically right.**
      R holds the line on formal decision theory. Expected Value is defined as $\sum (P_i \times V_i)$. If $V_i$ is undefined for some $i$, the sum is undefined. M cannot simply stipulate the sum exists without providing a conversion rate between "utils" and "rights." R wins this technical point.

  **Step 5: M's Concession (Pragmatism)**
  *   **Claim:** Hard cases are rare. Theories agree on most routine actions. The method works for the majority of choices.
  *   **Ruling:** **M is pragmatically plausible, but theoretically retreating.**
      M is likely right empirically: most daily choices (make coffee vs. tea) don't trigger deep moral divergence. However, by conceding the hard cases, M admits that MEC is not a *complete* theory of moral uncertainty. It becomes a heuristic that works only when moral theories overlap. This weakens M's initial claim that moral uncertainty is handled the *same way* as ordinary uncertainty (since ordinary uncertainty doesn't typically break the math).

  **Step 6: R's Closing (Teleological Critique)**
  *   **Claim:** The tool is for the hard cases. If it fails there, it's broken for its purpose.
  *   **Ruling:** **R wins the debate.**
      The whole point of moral uncertainty is to guide action when moral theories *conflict*. If the theory admits it cannot compute a verdict in cases of conflict (incommensurability), it fails to solve the problem it was designed to solve. A map that goes blank exactly at the border disputes is not a useful map.

  ---

  ### What Both Are Missing

  While R wins the technical argument, both M and R are overlooking significant developments in the literature that attempt to bridge their gap.

  **1. The "Normalization" Solution (Missing from M)**
  M assumes we need raw numbers. R assumes we can't get them. Both miss the work on **variance normalization** (proposed by MacAskill and others).
  Even if Theory A (Utilitarianism) uses "utils" and Theory B (Rights) uses "violations," we can normalize them statistically. We ask: "How much does the choice-worthiness of options vary *within* Theory A compared to *within* Theory B?"
  By scaling the theories so they have the same variance, you can compare them without needing a shared metaphysical unit of value. M didn't offer this; R didn't consider that "numbers" can be assigned relationally rather than absolutely.

  **2. The "Moral Parliament" Model (Missing from Both)**
  Both assume the goal is to calculate a single number to maximize (MEC). They are missing the **Moral Parliament** model (proposed by Nick Bostrom and others).
  Instead of calculating an expected value, you imagine a parliament where each theory gets seats proportional to your credence in it. The theories bargain, vote, or form coalitions.
  *   **Why this matters:** This handles incommensurability better. A Rights theorist doesn't need to assign a number; they just need to vote "No" on certain bills. This preserves the deontological structure R is defending while allowing the aggregation M wants.

  **3. Cardinality vs. Ordinality (Missing from R)**
  R insists value must live on a "single numerical scale" (cardinal). However, some decision rules only require **ordinal** rankings (ranking options from best to worst without specifying *how much* better).
  If M switched from "Maximize Expected Value" to "Maximize Expected Rank," the incommensurability problem lessens. You don't need to know the *magnitude* of the utilitarian good, only whether Theory A prefers Option 1 over Option 2. R is too quick to dismiss non-cardinal aggregation methods.

  **4. The "Stochastic Choice" Option (Missing from Both)**
  Both assume you must pick one deterministic action. A growing view in moral uncertainty is that the rational response to uncertainty between incommensurable theories is **randomization**.
  If you are 50% Credence in Utilitarianism (do X) and 50% in Rights (do Y), and the values are incommensurable, the rational choice might be to flip a coin. This respects the credences without forcing a false mathematical precision. Neither M nor R considered that the output of moral uncertainty might be a probability distribution over actions, not a single action.

  ### Final Verdict

  *   **On the specific argument:** **R is right.** You cannot run expected value calculations over incommensurable scales without additional bridging assumptions. M's attempt to define the problem away at the meta-level is insufficient.
  *   **On the broader project:** **M is right that we need *some* procedure.** R's critique shows MEC is incomplete, but it doesn't prove we should abandon moral uncertainty reasoning entirely. It just proves we need a more sophisticated model than simple expected value.

  **Advice for the Reading Group:**
  Tell them to look up **"The Problem of Intertheoretic Comparisons"** and **"Consequentializing Deontology."** M is arguing for the latter to solve the former; R is arguing that the solution destroys the object of study. The truth is likely in the "Normalization" or "Parliament" models that sit between them.
