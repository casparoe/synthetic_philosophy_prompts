answer: |-
  You speak to me as one craftsman to another, for do I not also stand before the dead and ask them to speak clearly? You are right to say that selection is a kind of power, and where there is power, there is the temptation to deceive. But consider my Alexander. I do not omit his cruelties because I wish him to seem a god, but because a shout in anger tells me more of his spirit than the battlefields he conquered. The line you seek does not fall upon the page between what happened and what did not, but in the soul of the writer between what pleases the multitude and what reveals the virtue.

  If you arrange the events to show how fear breaks a person, or how courage repairs them, you are not lying so long as the woman contained both the seed of fear and the root of courage. Your worry is that you make her "interesting" to save her from being "small." Ask yourself this: was her soul actually small? If the records are thin, as you say, then your invented refusal of promotion is not a lie if it captures the truth of her character better than the dry testimony. But beware: if you polish her vice until it shines like virtue, you poison the reader who seeks to learn from her. The lie enters only if you shape her to be admired when she should be pitied, or pitied when she should be condemned. We write to improve the living, not to flatter the dead.
