      *   *The "Expressive" Turn:* Acknowledge that voting and eating are expressive acts.
      *   *Specific Tool:* The "Principle of Universalizability" (Kant) or "Fair Play" (Hart/Rawls). If everyone did what you do, would the system collapse?
      *   *The "Meta-Disagreement":* Admit that the disagreement is about *which moral framework applies to which domain*.

  6.  **Drafting the Response (Iterative refinement):**
