answer: |-
  ### Final Exam: Philosophy of Moral Obligation
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Your response should demonstrate conceptual precision and original argumentation. References to specific authors or standard case studies (e.g., drowning children, famine relief) are permitted only if analytically necessary; reliance on them to bypass the specific framing provided will be penalized.

  ***

  **Essay Question**

  Consider the **Asymptotic Obligation Thesis (AOT)**. This thesis posits that an agent's moral demands function as a mathematical asymptote: as available resources or situational proximity vary continuously, the magnitude of required sacrifice approaches but *never reaches* a finite ceiling. Unlike a "cap" theory, which sets a hard limit on obligation (e.g., 10% of income), the AOT suggests that for any level of sacrifice $S$ currently made, there exists a possible situation requiring $S + \epsilon$.

  Evaluate whether the AOT successfully resolves the tension between unlimited moral reasons and finite agency, or whether it merely relocates the paradox into an infinite regress of residual duties. In your analysis, determine if a moral system based on asymptotic limits is coherent for a finite agent, or if the inability to ever "complete" the obligation renders the concept of duty itself unintelligible.

  ***

  ### Model Answer

  The Asymptotic Obligation Thesis (AOT) attempts to salvage moral realism from the charge of incoherence by replacing a binary "fulfilled/unfulfilled" structure with a continuous limit function. Proponents might argue that by removing a hard ceiling, we acknowledge the gravity of moral reasons without demanding the impossible. However, upon close inspection, the AOT does not resolve the tension between unlimited reasons and finite agency; rather, it exacerbates the problem by transforming a crisis of magnitude into a crisis of completion, ultimately relocating the paradox into an infinite regress of residual duties.

  To understand why the AOT fails, one must distinguish between a *maximum* and a *limit*. A maximum is a value that a function actually reaches; a limit is a value the function approaches arbitrarily closely without necessarily touching. The AOT posits obligation as a limit. The intuitive appeal is that it avoids the arbitrariness of a cap. If I give 10% of my income, the AOT says I could be required to give 11%, then 11.5%, ad infinitum, approaching total sacrifice without logically necessitating it at any single discrete moment. This seems to preserve agency: at any specific instant $t$, the demand is finite.

  However, this preservation is illusory because it ignores the temporal integration of duty. Moral agency is not exercised in dimensionless instants but over a lifespan. If the obligation is asymptotic, then at no point $t$ can the agent claim to have "done enough." There is always a residual duty $\epsilon$ remaining. In a standard over-demandingness objection, the agent hits a wall and breaks. Under the AOT, the agent never hits a wall but runs on a treadmill that accelerates indefinitely. The psychological and practical result is identical: paralysis. If "completing" one's duty is logically impossible because the asymptote is never touched, then the concept of moral satisfaction becomes unintelligible. An obligation that cannot, in principle, be fully discharged ceases to function as a normative guide and becomes a description of eternal deficiency.

  Furthermore, the AOT fails to account for the discreteness of moral action. Resources and actions are not infinitely divisible continuous variables. One cannot give 0.0001% of a kidney or spend 0.0003 hours saving a life. Moral decisions often involve threshold effects—binary choices where a specific quantum of resources is required to effect change. The AOT's continuous framing clashes with the discrete nature of agency. If the asymptote requires continuous adjustment of sacrifice to match continuous variations in proximity, the cognitive load required to calculate the current position on the curve exceeds the capacity of finite agents. The agent is not just asked to sacrifice heavily; they are asked to perform a supertask—completing an infinite number of adjustments in finite time.

  Defenders of the AOT might argue that the *direction* of the obligation matters more than the *completion*. They might claim that morality is about orientation toward the good, not arrival. But this retreats into a virtue-ethical framework that abandons the deontic logic of "obligation" implied by the prompt. If "obligation" implies "ought," and "ought" implies "can," then an obligation that asymptotically approaches a limit beyond the agent's capacity violates the principle of *ought implies can* just as surely as a demand for immediate total sacrifice. The gap between the agent's finite capacity and the asymptotic limit remains unbridged. The AOT merely hides the gap behind a curve rather than a cliff.

  Consequently, the AOT relocates the paradox rather than resolving it. The original paradox was: How can finite agents bear infinite weight? The AOT answers: By bearing finite weights infinitely often. But this generates an infinite regress of residual duties. Since the agent can never reach the ceiling, they are perpetually in a state of moral deficit. This renders the moral system incoherent because it removes the possibility of moral innocence or equilibrium. A system that defines the agent as perpetually failing, regardless of their proximity to the limit, destroys the normative force of the obligation. Therefore, the AOT must be rejected as a viable structure for moral theory; it preserves the mathematical elegance of the limit at the cost of the practical intelligibility of duty.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Conceptual Definition of the Asymptote (4 Marks)**
  *   **Requirement:** Clearly distinguishes between a "hard cap" (maximum) and an "asymptotic limit" (approach without touching) within the context of moral demand.
  *   **Typical Failure:** Candidates conflate the asymptote with a high ceiling or treat it as merely a "very high" demand rather than a structural limit.

  **2. Analysis of Temporal Integration (4 Marks)**
  *   **Requirement:** Argues that moral agency occurs over time, meaning an asymptotic demand accumulates into a supertask or impossible integration for a finite life.
  *   **Typical Failure:** Candidates analyze the obligation only as a series of isolated moments, ignoring the cumulative effect on the agent's lifespan.

  **3. Engagement with Residual Duties (4 Marks)**
  *   **Requirement:** Explicitly addresses the "infinite regress of residual duties" (the $\epsilon$ that always remains) and its impact on the concept of moral completion.
  *   **Typical Failure:** Candidates argue the agent can "get close enough" to satisfy the duty, missing the prompt's stipulation that the ceiling is *never* reached.

  **4. Coherence of Finite Agency (4 Marks)**
  *   **Requirement:** Connects the continuous nature of the AOT to the discrete/cognitive limits of human action (e.g., indivisibility of resources or cognitive load).
  *   **Typical Failure:** Candidates assume resources and decisions are infinitely divisible without arguing for why that fits human psychology or physics.

  **5. Independence from Standard Literature (4 Marks)**
  *   **Requirement:** Constructs the argument using the provided framing (AOT) rather than defaulting to standard "over-demandingness" summaries (e.g., Singer's pond, Kagan's *The Limits of Morality*).
  *   **Typical Failure:** Candidates ignore the AOT framing entirely and write a generic essay on why consequentialism is too demanding using standard case studies.
