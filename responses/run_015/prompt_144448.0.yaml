  # Seminar Activity: The Planner's Dilemma

  ## Overview
  This activity simulates the structural conflict between individual authority (rights) and collective efficiency (unanimity) without using formal terminology. Students experience the impossibility of satisfying both principles simultaneously when preferences are "nosy" (interdependent), and feel the cost of resolving the contradiction by waiving rights.

  **Time:** 75 Minutes
  **Participants:** 18 Students (6 Tables of 3)
  **Materials:** 
  - 18 Index Card Sets (pre-printed preferences)
  - 6 "Planner Sheets" (blank ranking templates)
  - 6 "Waiver Forms" (for Round 3)
  - Poker chips or paper tokens (approx. 50 per table)
  - Whiteboard & Markers
  - Timer

  ## Scenario: The Shared Apartment Playlist
  To avoid the baggage of Sen's "Lady Chatterley" example, we use a relatable domestic scenario.
  **Alternatives:**
  - **J:** Jazz Night (Citizen 1's choice)
  - **R:** Rock Night (Citizen 2's choice)
  - **S:** Silence/No Music (Status Quo)

  **The Rules (Write on Whiteboard):**
  1.  **The Unanimity Rule:** If *both* Citizens prefer Option X over Option Y, the Planner *must* rank X higher than Y.
  2.  **The Pair Rule:** 
      - Citizen 1 has authority over the pair **{J, S}**. If C1 prefers J over S, Planner ranks J > S. If C1 prefers S over J, Planner ranks S > J.
      - Citizen 2 has authority over the pair **{R, S}**. If C2 prefers R over S, Planner ranks R > S. If C2 prefers S over R, Planner ranks S > R.
  3.  **The Consistency Rule:** The Planner's final ranking must be logical (Transitive). If X > Y and Y > Z, then X > Z. No cycles allowed.
  4.  **Payoff:** 
      - If the Planner produces a Consistent Ranking satisfying all active rules: **10 tokens each**.
      - If the Planner fails (Cycle/Contradiction): **0 tokens**.
      - *Round 3 Only:* If a Waiver is used to achieve consistency, the Waiver signer gets **5 tokens**, others get **10**.

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:10: Setup & Rules
  - **Seating:** Assign 3 students per table.
  - **Roles:** Assign Role A (Citizen 1), Role B (Citizen 2), Role C (Planner). *Note: Roles will rotate.*
  - **Instruction:** Read the "Rules" from the whiteboard. Emphasize that the Planner *cannot* violate the Rules. They are not a dictator; they are a constraint-satisfier.
  - **Distribution:** Hand out Round 1 Preference Cards (face down).

  ### 0:10 – 0:25: Round 1 (Parochial Preferences)
  - **Action:** Students reveal cards. Planner attempts to create a ranking.
  - **Preferences:**
      - C1: **J > S > R** (Wants Jazz, indifferent to Rock).
      - C2: **R > S > J** (Wants Rock, indifferent to Jazz).
  - **Mechanism:** 
      - Unanimity: No agreement on any pair. (Vacuously satisfied).
      - Pair Rule: C1 says J > S. C2 says R > S.
      - Planner Task: Rank J, R, S such that J > S and R > S.
      - Solution: **J > R > S** (or R > J > S). Consistent.
  - **Payoff:** Distribute 10 tokens to each.
  - **Debrief (2 mins):** Ask Planners: "Was this hard?" (No). "Did anyone feel constrained?" (No).

  ### 0:25 – 0:40: Round 2 (Nosy Preferences)
  - **Rotation:** Shift roles clockwise (A→B, B→C, C→A).
  - **Action:** Hand out Round 2 Cards.
  - **Preferences:**
      - C1: **S > J > R** (Modest: Prefers Silence to Jazz, but Jazz to Rock).
      - C2: **J > R > S** (Nosy: Prefers Jazz to Rock, Rock to Silence).
  - **Mechanism:**
      - Unanimity: Both prefer **J > R**. (C1: J>R, C2: J>R). **Constraint: J > R**.
      - Pair Rule (C1): C1 prefers **S > J**. **Constraint: S > J**.
      - Pair Rule (C2): C2 prefers **R > S**. **Constraint: R > S**.
      - Cycle: **J > R** (Unanimity) → **R > S** (C2 Right) → **S > J** (C1 Right).
      - Result: **J > R > S > J**. Intransitive.
  - **Payoff:** Planner must declare failure. **0 tokens**.
  - **Observation:** Watch for frustration. Students may try to ignore rules. Intervene: "Check the Rules. Can you satisfy all three?"

  ### 0:40 – 0:55: Round 3 (Waiver & Cost)
  - **Rotation:** Shift roles clockwise again.
  - **Action:** Hand out Round 3 Cards (Same as Round 2).
  - **New Rule:** Before revealing cards, Citizens may sign a **Waiver Form**. 
      - If C1 waives, the Pair Rule for {J, S} is void.
      - If C2 waives, the Pair Rule for {R, S} is void.
      - **Cost:** Waiver signer gets 5 tokens, others get 10 (if consistent).
  - **Mechanism:**
      - To get *any* tokens, they must waive. 
      - If C1 waives: Constraints are J > R (Unanimity) and R > S (C2 Right). Result: **J > R > S**. Consistent.
      - Payoff: C1 gets 5, C2 gets 10, Planner gets 10.
  - **Debrief (5 mins):** Ask C1: "Why did you sign?" (To avoid 0). "How do you feel about getting 5 instead of 10?" (Loss). This illustrates the *price* of consistency.

  ### 0:55 – 1:15: Final Debrief & Theory Mapping
  - **Discussion:** Bring the room together.
  - **Mapping:**
      - **Pair Rule** = **Liberalism/Rights** (Individual decisiveness).
      - **Unanimity Rule** = **Pareto Principle** (Efficiency/Collective agreement).
      - **Consistency Rule** = **Social Rationality** (Coherent group choice).
      - **Round 2 Failure** = **Sen's Impossibility Theorem**.
      - **Round 3 Waiver** = **Gibbard's Waiver Paradox** (Rights are alienable to restore consistency).
  - **Addressing the Friend's Claim:** 
      - Ask: "In Round 2, the problem arose because C1 cared about R (Rock) and C2 cared about S (Silence). They were 'nosy'. If we banned nosy preferences (Domain Restriction), would the problem vanish?" (Yes).
      - Ask: "But is it realistic to expect people not to care about what happens in their shared apartment? If a 'Right' only works when no one else cares, is it a Right?"
      - **Conclusion:** The theorem shows that *any* minimal right + *any* efficiency requirement clashes when people have ordinary, interdependent preferences. Restricting the domain to "non-nosy" people saves the math but kills the normative relevance of rights.

  ## Troubleshooting Guide

  | Problem | Prediction | Intervention |
  | :--- | :--- | :--- |
  | **Rule Breaking** | Planners ignore the Pair Rule to force consistency. | "Check Citizen 1's card. Do they prefer S over J? Then S must be over J in your list." |
  | **Majority Voting** | Students suggest voting to break the cycle. | "Voting isn't a Rule. The Rules are Unanimity and Pair Authority. Does Voting satisfy Pair Authority?" (Usually no). |
  | **Speed Variance** | Some tables finish Round 1 in 2 mins. | "Fast tables: Try to find a *second* valid ranking. Is the solution unique?" |
  | **Cheating** | Citizens rewrite preference cards to fix the cycle. | Collect cards at the end of each round. Remind them preferences are *given*, not chosen. |
  | **Confusion on Tokens** | Students think 5 tokens is a "win" over 0. | Clarify: "5 is better than 0, but worse than 10. The Waiver *cost* 5 tokens of value." |

  ## Limitations & Honesty
  1.  **One Profile vs. All Profiles:** This activity shows *one* case where the rules clash. It does not prove they *always* clash (the formal theorem). You must supply this generalization in the debrief.
  2.  **Thin Rights:** "Decisiveness over a pair" is a technical definition of rights, not a full moral conception. Acknowledge that real rights are richer, but this is the minimum required for the logic to hold.
  3.  **The "Nosiness" Defense:** Your friend is logically correct that restricting preferences avoids the contradiction. However, the activity demonstrates *why* that restriction is normatively costly: it makes rights contingent on the indifference of others. A right that vanishes when others care is not a robust protection.

  ## Design Confidence
  - **High Confidence:** Rounds 1 & 2 will work as described. The cycle is mathematically guaranteed.
  - **Moderate Confidence:** Round 3 (Waiver). Students might refuse to waive on principle, resulting in 0 tokens for everyone. This is actually a *good* outcome for discussion (rights as inalienable), but you may need to nudge them toward the "rational" choice to see the cost mechanism.
  - **Guess:** The token payoff might feel abstract. If students seem unmotivated, emphasize that tokens determine "who buys the coffee" or similar symbolic reward to raise stakes slightly.

  \answer{Domain restriction avoids contradiction, but negates the substance of rights.}
