answer: |-
  This is a precise pedagogical problem disguised as a vocabulary dispute. You are asking whether a metaphor can do the work of a theory of causation without importing errors that confuse fifteen-year-olds. Below is the audit you requested, followed by a recommendation on how to proceed.

  ### Part 1: The Audit of the Three Framings

  Here is the correspondence table for each framing. This maps the metaphor's source domain (Theater, Game, etc.) onto the target domain (History).

  | Feature | **1. Cast (Actors)** | **2. Stage (Setting)** | **3. Rules (Game)** |
  | :--- | :--- | :--- | :--- |
  | **Agent** | The Human or the Non-Human (e.g., The Volcano). | The Human. | The Human (Player). |
  | **Action** | Performing a role / Making things happen. | Acting within a space. | Making a move / Choosing a strategy. |
  | **Goal** | To fulfill the plot / To win the scene. | To survive / To achieve aims. | To win / To maximize advantage. |
  | **Reason** | Motivation / Scripted necessity. | Reaction to environment. | Calculation of cost/benefit. |
  | **Counterfactual** | If the actor were different, the play changes. | If the setting were different, the action is harder/easier. | If the rules changed, the optimal move changes. |
  | **Praise/Blame** | Assigned to the Actor for their performance. | Assigned to the Actor for how they handled the setting. | Assigned to the Player for their strategy within the rules. |

  #### Where the Mapping Breaks

  **1. Cast (Actors)**
  *   **The Break:** Non-humans (germs, volcanoes) cannot have goals, reasons, or intentions. They do not "perform."
  *   **The Import:** This metaphor imports **Intentionality** and **Plot Necessity**. If a volcano is in the cast, it implies it has a role to play in a story that is moving toward an ending.
  *   **Why it Matters:** This is dangerous for your rubric. If the volcano is an "actor," students may infer it *chose* to erupt to change history. Worse, if it is a co-star, it shares the blame. If the "Germ" is an actor, the "Landlord" is less responsible. This directly undermines your goal of preventing exculpation.

  **2. Stage (Setting)**
  *   **The Break:** Settings are usually static backdrops. They do not actively intervene. A storm in a play is usually special effects, not a character.
  *   **The Import:** This metaphor imports **Passivity**.
  *   **Why it Matters:** This undermines your goal of rewarding students who identify non-human causes. If the plague is just "scenery," a student might write, "The plague was the background, but the King made the decisions." This allows them to mention the germ without granting it causal weight. It solves the accountability problem but creates a determinism problem in reverse (humans do everything, nature is just wallpaper).

  **3. Rules (Game)**
  *   **The Break:** Rules are usually made by someone (a legislature, a referee) or agreed upon. Nature does not "write" rules. Also, games have winners and losers; history often has survivors and victims.
  *   **The Import:** This metaphor imports **Systematic Constraint** and **Strategic Choice**.
  *   **Why it Matters:** This is the strongest fit for your goals. It allows the volcano to change the *cost* of survival without giving the volcano *agency*. It forces the student to explain how humans responded to the new constraints. However, it risks making history look too logical or calculated.

  ### Part 2: Carrying the Conclusions

  You have three specific conclusions you want the rubric to support. Here is what each framing can carry.

  | Conclusion | **Cast** | **Stage** | **Rules** |
  | :--- | :--- | :--- | :--- |
  | **1. A monocausal human explanation is incomplete.** | **Yes.** (There are other actors.) | **No.** (Setting is optional context.) | **Yes.** (You cannot explain the game without the rules.) |
  | **2. A non-human explanation is not exculpatory.** | **No.** (Actors share blame.) | **Yes.** (Only actors are blamed.) | **Yes.** (Players are responsible for their moves, even if rules are hard.) |
  | **3. Eruption/blight can be the most important cause without being an agent.** | **No.** (Importance implies agency in this metaphor.) | **Yes.** (Setting dictates possibility.) | **Yes.** (Rules dictate possibility without playing the pieces.) |

  **Analysis:** The **Cast** framing fails two of your three core requirements. It risks exculpating humans and conflates importance with agency. The **Stage** framing fails to ensure students treat non-human causes as serious drivers of change. The **Rules** framing is the only one that analytically supports all three conclusions, though it is more abstract.

  ### Part 3: Application to Episodes (What can a 15-year-old write?)

  Here is what a defensible exam answer looks like under each framing. This shows you what the rubric would actually grade.

  **Episode 1: 14th-Century Plague & Wage Legislation**
  *   **Cast:** "The Plague was a killer that acted against the workers. The King tried to fight the Plague by fixing wages." *(Risk: Makes Plague a villain, King a hero fighting nature.)*
  *   **Stage:** "The Plague was the background situation. The King made laws to control the workers in this bad time." *(Risk: Plague is passive context, King is the only driver.)*
  *   **Rules:** "The Plague killed workers, which made labor expensive. This changed the rules of the economy. The King tried to change the rules back by freezing wages, but the new rules of supply and demand worked against him." *(Best: Shows interaction between biological fact and human policy.)*

  **Episode 2: Mid-19th-Century Famine (e.g., Ireland)**
  *   **Cast:** "The Blight destroyed the crops. The British government failed to stop the Blight." *(Risk: Implies the government could have stopped a fungus.)*
  *   **Stage:** "The Blight happened in the background. The British government made choices about food export." *(Risk: Disconnects the Blight from the policy.)*
  *   **Rules:** "The Blight removed the option of growing potatoes. This changed the cost of survival. The government chose to keep trade rules that made importing grain hard, worsening the crisis." *(Best: Separates the biological constraint from the political choice.)*

  **Episode 3: 1815 Eruption & Year Without a Summer**
  *   **Cast:** "The Volcano erupted and caused cold weather. Farmers suffered because of the Volcano." *(Risk: Farmers are victims of a villainous volcano.)*
  *   **Stage:** "The Volcano created a cold setting. Farmers tried to grow crops in this weather." *(Risk: Weather is just a difficulty, not a structural cause.)*
  *   **Rules:** "The ash cloud changed the climate rules, making harvest impossible. Merchants raised food prices because the rules of scarcity applied. Governments had to decide whether to intervene." *(Best: Climate creates scarcity; humans set prices and policy.)*

  ### Part 4: Recommendation and Draft Wording

  **The Verdict:**
  You should abandon the word "Cast." It is analytically unsound for non-human causes and actively works against your goal of maintaining human accountability. It imports intentionality where there is none.

  The "Stage" framing is safe but weak; it allows students to mention the volcano without explaining its causal power.

  The "Rules" framing is analytically superior but may be too abstract for fifteen-year-olds if not phrased carefully.

  **My Proposal:**
  Do not use "Cast," "Stage," or "Rules" in the student-facing material. Use **"Constraints and Choices."** This captures the "Rules" insight (constraints) without the game theory baggage, and it captures the "Stage" insight (environment) without the passivity. It forces the student to link the non-human (Constraint) to the human (Choice).

  **Draft Guide Wording:**
  > "When analyzing historical change, pupils must distinguish between **constraints** (factors that limit what is possible, such as climate, disease, or geography) and **choices** (decisions made by individuals or governments). A high-scoring answer will explain how a constraint altered the costs or risks of a situation, and then evaluate whether the human choices made in response were effective, just, or inevitable. Pupils should not treat constraints as excuses for human action, nor should they ignore constraints when judging human decisions."

  **Why this survives the objections:**
  1.  **No Intentionality:** Constraints do not "act"; they "limit."
  2.  **No Exculpation:** Choices are still judged.
  3.  **Causal Power:** Constraints "alter costs," giving them weight without agency.

  ### Part 5: My Footing and Confidence

  **Analytic Claims (High Confidence):**
  I hold with high confidence that the "Cast" metaphor imports intentionality. In philosophy of language and action, "actors" imply "actions," and actions imply reasons. Attributing reasons to a virus is a category error. I am also confident that fifteen-year-olds will interpret "Cast" literally, leading to the "Germ did it" answers you wish to avoid.

  **Pedagogical Claims (Moderate Confidence):**
  I am moderately confident that "Constraints and Choices" is teachable at this level. It relies on a basic understanding of cause and effect. However, I am not a classroom teacher; there may be a vocabulary barrier I cannot see. If "Constraints" is too dry, "Conditions and Decisions" is a viable synonym.

  **Values Calls (Explicitly Marked):**
  1.  **Accountability:** My recommendation prioritizes human accountability over structural determinism. This is a values choice. A different committee might decide that highlighting structural forces is more important than preserving individual blame. I have assumed your goal (preventing exculpation) is the priority.
  2.  **Agency:** I am assuming that "agency" is a property unique to humans (or conscious beings). Some environmental historians argue that giving "agency" to nature is a necessary ethical correction to anthropocentrism. If your committee holds this view, my audit of the "Cast" framing is biased against it.

  **Where My Reasoning Might Fail:**
  My reasoning fails if the primary difficulty for students is *identifying* non-human factors, not *weighting* them. If students are simply forgetting to mention the volcano, "Cast" might be a useful mnemonic device to jog their memory, even if it is philosophically messy. If the problem is memory, not analysis, "Cast" might work despite its flaws.

  **What Would Change My Verdict:**
  If you can show me evidence that fifteen-year-olds successfully use the "Cast" metaphor to mean "influential factor" without inferring "intention," I would withdraw my objection. However, based on general cognitive development at that age, literal interpretation of metaphors is the norm, not the exception.

  **Final Advice:**
  Vote to remove "Cast." It does too much work you don't want it to do. Adopt "Constraints and Choices" or "Conditions and Decisions." It is less colorful, but it is safer for the grades you intend to award.
