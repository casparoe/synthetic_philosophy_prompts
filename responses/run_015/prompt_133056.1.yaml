      *   *Artifact vs. Organism:* Letters are designed; faces grow.
      *   *Categorical vs. Continuous:* 'a' stops being 'a' if changed too much; a face is still a face (even if plastic surgery occurs, identity is sticky). Actually, a face can become unrecognizable, but a letter becomes a *different* letter.
      *   *Emotion:* Faces signal internal state; letters signal external meaning.
      *   *Orientation:* Inverting a face makes it hard to recognize (Thatcher effect); inverting a letter often makes it a different letter (b/d/p/q).

  5.  **Addressing the Niche Disanalogy (Style Space):**

      *   *Letters:* Orthogonal parameters (weight, slant, width). You can have Bold-Italic-Condensed.
