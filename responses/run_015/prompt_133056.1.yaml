      *   *Face Recognition:* Holistic processing (configural), fusiform face area (FFA), robust to variation (lighting, pose, age), sensitive to identity.
      *   *Letter Recognition:* Visual Word Form Area (VWFA), expert system (learned, not innate), sensitive to orientation (unlike faces), categorical boundaries (an 'a' vs. 'o').
