      *   *The Disanalogy:* Faces are biological/continuous; letters are symbolic/categorical. Faces have emotional states; letters don't (unless personified). Misrecognition consequences differ (wrong name vs. wrong word/meaning).
      *   *The Niche Disanalogy:* Style space independence. In typography, I can change weight without changing width. In faces, changing bone density affects skin texture, fat distribution, etc. Faces are high-dimensional manifolds with strong correlations; fonts are designed parameter spaces.

  3.  **Drafting the Correspondence Table:**

      *   *Bone Structure:* Core topology (stroke connectivity, counters).
      *   *Emotional Expression:* Stylistic flair (swashes, ink trap, tension).
      *   *Aging:* Wear/tear or historical evolution (glyphic drift).
