answer: |-
  The standard way we talk about democratic decline is like a mechanic checking off parts on a car. Are the wheels there? Yes. Is the engine running? Yes. Do the brakes work? Mostly. If the institutions of democracy—elections, courts, legislatures—are still technically functioning, the assumption is that the democracy is intact. This is a hardware view of democracy. It assumes that if the machinery is present, it will do its job.

  But democracy isn't just hardware; it is an information processing system. Its primary function is to allow a population to verify the actions of those in power and make decisions based on a shared understanding of reality. When we define backsliding solely as the destruction of institutions, we miss the more subtle, and often earlier, failure: the collapse of epistemic redundancy.

  Epistemic redundancy is the existence of multiple, independent channels through which citizens can cross-check power. In a healthy system, if the government says the economy is booming, independent journalists, opposition researchers, academic economists, and local officials can all check that claim against their own data. If one channel is compromised, others pick up the slack. Backsliding, then, isn't just when a court is packed; it's when the ability to verify the court's reasoning, or the government's need to pack it, disappears from public view. It is the thinning out of the sensor network that allows society to detect lies.

  Look at Hungary. By the standard checklist, Hungary still holds elections. Courts still issue rulings. But over the last decade, the Fidesz government didn't need to abolish these institutions to cement control; they just needed to make them epistemically isolated. They consolidated nearly all regional media into government-friendly holding companies. They used state advertising to starve independent outlets of revenue while flooding the zone with loyalist messaging.

  The result wasn't that Hungarians couldn't vote; it was that they couldn't verify what they were voting on. When the opposition speaks, do they have a microphone that reaches the same ears as the Prime Minister? In Hungary, the answer became no. The institutions remained, but the feedback loop was severed. A court might technically rule against the government, but if the state-controlled media ecosystem frames that ruling as an attack by foreign agents, the institutional check loses its democratic power. The redundancy is gone. There is only one version of events, and it flows from the center outward.

  Poland under the Law and Justice party showed a similar dynamic. Public television was transformed into a partisan megaphone. This didn't just bias the news; it destroyed the common ground necessary for institutional checks to matter. When the government clashed with the judiciary, the public didn't see a constitutional dispute; they saw a narrative battle where the state controlled the primary lens. The institutions were fighting, but the citizens lacked the independent information channels to judge who was right. When verification withers, institutions become just another set of actors in a drama, rather than referees in a game.

  This definition forces us to look harder at the United States. The common defense against American democratic backsliding is the "hardware" argument: we still have elections, and courts still issue rulings against presidents. That is true, but it ignores the epistemic layer.

  Epistemic redundancy in the US is thinning out, even if the Supreme Court is still issuing opinions. We see this in the disappearance of local news, creating "news deserts" where the only information available comes from nationalized, partisan sources. We see it in the algorithmic sorting of social media, where citizens no longer share a baseline of facts. When a court issues a ruling, and half the population believes the ruling is illegitimate not because of legal reasoning but because their information ecosystem tells them the judiciary is corrupt, the institutional check has failed.

  The existence of an election means nothing if the electorate cannot agree on the basic conditions of the race. If one side operates on the premise that the mail-in voting system is fraudulent, based on information channels that are insulated from correction, the election is technically happening but democratically hollow. The redundancy is gone. There is no shared mechanism to verify the integrity of the process that both sides trust. In this sense, the US can be sliding precisely *because* the institutions are being rendered epistemically inert. They exist, but they no longer command the shared belief required to function.

  Shifting the definition to epistemic redundancy also removes the partisan stick. When we focus on "court-packing" or "voting laws," the debate immediately becomes about which specific policy is good or bad. Partisans will argue that packing a court is necessary to restore balance, or that voting restrictions prevent fraud. It becomes a policy fight.

  But if we ask, "Does this reduce the number of independent channels available to verify power?" the question becomes structural. It doesn't matter if it is a left-wing or right-wing government. If a administration consolidates media ownership, intimidates whistleblowers, or delegitimizes academic research that contradicts its agenda, it is reducing epistemic redundancy. It is blinding the public.

  This approach captures how democracies actually fail. They rarely die in a coup where the tanks roll in and the constitution is burned. They die when the lights go out slowly. Citizens keep going to the polls, but they are voting in the dark. They keep going to court, but they no longer believe the verdict. By focusing on the redundancy of information channels rather than the mere existence of institutions, we stop asking "Is the machine still running?" and start asking "Can the machine still tell the truth?" That is the only metric that actually protects democracy.
