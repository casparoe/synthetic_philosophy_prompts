  hey can you argue that democratic backsliding is best seen as the collapse of epistemic redundancy — the thinning out of independant information channels that let citizens cross-check power — rather than just a checklist of institutional damage like court-packing or media capture? use hungary and poland as examples where formal institutions still technically function but redundant verification has witherd, and push back on the idea that the US can't be sliding just because elections still happen and courts still issue rulings. i want the case that if we define it this way, the concept stops being a partisan stick and actually captures something structural about how democracies fail. keep it grounded, no citations or reading lists, just lay the argument out.
