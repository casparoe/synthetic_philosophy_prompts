      **MEMORANDUM**
      **TO:** Publications and Ethics Committee, Ridgeway Endangered Language Archive
      **FROM:** [Your Name]
      **DATE:** 28 February
      **SUBJECT:** Recommendation on Tsemak Lexicon Publication

      **Recommendation**
      I recommend we proceed to **publish a gloss explicitly labelled as one manual among several with a review clause**, with final files sent to the printer by 15 March. This path secures the heritage funding, supports the community Saturday-school programme, and respects linguistic complexity without granting any single translation manual metaphysical finality.

      **The Stakes**
      Our grant contract requires an "authoritative Tsemak–English reader and lexicon" by 31 March. Failure to deliver means the remaining balance reverts. Crucially, this loss eliminates the materials budget for the Tsemak Heritage Council's Saturday-school programme. With only three surviving speakers, all in their eighties, the community's immediate need for pedagogical tools outweighs our theoretical hesitations. We cannot ethically prioritize philosophical purity over the material support of the language community.

      **Marta's Position and Conflict**
      Marta's refusal to sign off on a canonical glossary rests on the indeterminacy of translation. She argues that behavioral evidence cannot distinguish between rival manuals (e.g., "rabbit" versus "rabbit-stage"). She is philosophically correct; translation succeeds without a unique factual basis. However, her stance creates a practical impasse. We must also note transparently that Marta has a book contract for a monograph advancing this exact argument. While I believe she acts on principle, this financial interest complicates her veto power over a community resource. We should accept her transcriptions—which are excellent—but not her philosophical veto on publication. We will credit her fieldwork prominently while clarifying that the glossary represents a collective committee decision based on utility rather than ontological finality.

      **The Heritage Council's Proposal**
      The Council suggests selecting the manual that yields the greatest number of true English sentences when processing the corpus. While pragmatic, this does not solve Marta's problem. Rival translation manuals can be holistically adjusted to match all truth values in the corpus. One manual translates a word as "rabbit," another as "rabbit-stage," but adjusts surrounding logic to ensure every sentence remains true. Therefore, truth-maximization does not break the tie between rival manuals. We should explain this gently to the Council: their test validates consistency, not uniqueness. It ensures the book works, but it doesn't prove one book is the *only* book that works.

      **The Lock-in Problem**
      The strongest counter-argument is the lock-in effect. As one member noted, printing a glossary makes it authoritative regardless of footnotes. Once worksheets are printed and machine-learning algorithms scrape our PDF, this version becomes the standard. A disclaimer does not undo the sociological reality of publication. This is a valid ethical concern. However, the alternative is not a neutral state; it is the absence of materials. No book means no classes, which accelerates language loss. Lock-in is a risk, but obsolescence is a certainty if we delay.

      **Implementation Plan**
      To mitigate lock-in, the introduction will explicitly state that this lexicon is a *practical tool* selected for pedagogical coherence, not a final definition of Tsemak semantics. We will include a formal review clause committing the Archive to revise the lexicon in five years, contingent on further community consultation. This signals to users and algorithms that this is a living document.

      We must inform the Heritage Council that while their truth-test confirms usability, it cannot guarantee uniqueness. We will ask them to endorse the "practical tool" framing. Marta will be thanked for her transcriptions but asked to recuse herself from the final sign-off on the glossary definitions given her upcoming monograph.

      **Conclusion**
      We are archivists, not metaphysicians. Our duty is to the speakers and their descendants. By publishing a hedged version with a review clause, we satisfy the grant, fund the school, and maintain intellectual honesty. We avoid the catastrophe of funding reversion while acknowledging that language is fluid. I ask for your approval to proceed with this drafting immediately.

