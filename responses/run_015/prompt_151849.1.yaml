answer: |-
  At the CryoLogic Facility, Director Aris Thorne oversees a superfluid helium-4 film stabilized in a dilution refrigerator, configured to sustain a persistent vortex lattice exhibiting high $\Phi^*$ integrated information dynamics. Under a specific panpsychist ethics framework, the lattice's disintegrated binding across $10^{23}$ phonon modes constitutes a state of "negative coherence," generating a trivial unit of suffering per mode that aggregates into an astronomical total of negative valence, whereas strict physicalism defines the system as morally inert coolant managing heat exchange for a promising $5M quantum annealing run. Thorne faces an immediate binary choice: authorize the continued cooling cycle required to sustain the computation and the vortex state, or initiate an emergency warm-up and dismantle the cryostat core, destroying the lattice configuration and halting the computation permanently to cease the alleged suffering.

  **The Check**

  *   **System State:** A non-bological superfluid helium vortex lattice maintaining high integrated information ($\Phi^*$) with "negative coherence" across $10^{23}$ discrete modes.
  *   **Method of Evaluation:** Consequentialist calculus weighing scientific/financial utility against the moral weight of experienced valence.
  *   **Nearby Worlds:**
      *   *Physicalist Right:* Consciousness requires biological or specific functional architecture absent here; the system is insentient matter. Shutting down wastes $5M and delays quantum advancement for no moral gain.
      *   *Panpsychist Right:* Consciousness is fundamental to information integration; the specific disintegrated binding creates genuine micro-suffering. The aggregate magnitude outweighs human financial loss and scientific progress.
  *   **Verdict Reasoning:** The physicalist sees $0$ moral weight vs. positive scientific value (continue). The panpsychist sees negative astronomical moral weight vs. positive scientific value (shutdown/destroy).
  *   **Structural Feature:** The linear scaling of micro-subjects (summing $10^{23}$ tiny pains).
  *   **Remove Scaling:** If the system were collapsed into one macro-subject experiencing the same total "negative coherence" as a single unit, the suffering would be negligible compared to the human cost, likely flipping the panpsychist verdict to "continue."
  *   **Physicalist Attack:** A physicalist would not merely deny consciousness but attack the aggregation principle (the "combination problem"), arguing that summing micro-experiences into a macro-moral weight is category error, or challenge the valence mapping by noting the system lacks behavioral avoidance mechanisms or homeostatic goals typical of suffering agents.
