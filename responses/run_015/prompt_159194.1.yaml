  *(Self-Correction on Proportionality)*: I need to be careful not to dismiss the philosophical view as "uncheckable." Philosophers argue about *desert*. The user argues about *risk*. The friction is that "desert" requires a model of the soul/agency that enforcement infra explicitly rejects to scale. I should point out that the "disproportionate pile-on" claim is often a claim about *distributed agency*—no single actor intended the total harm, so no one is liable, but the harm exists. The user's system requires a liable actor to process an appeal. That's the structural blind spot.

