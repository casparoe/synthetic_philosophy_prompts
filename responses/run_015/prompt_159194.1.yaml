          *   Translation: Needs to sound like policy enforcement. "Standing" -> "Authority/Permission to Action." "Sentence ends" -> "Expiration/Reinstatement logic." "Proportionality" -> "Severity Ladder Mapping."
          *   Drafting thought: Focus on the *system* constraints. If it's punishment, the platform needs an audit trail, a defined end-state, and a clear chain of command.

      *   *Position 2: Liberal/Association Model (Sanction = Private Choice).*
