  2.  **Brainstorming & Reasoning (The "Thinking" Phase):**
      *   *Nature of Education:* Is it a private good (increases individual earnings) or a public good (creates informed citizens, innovation, social cohesion)? It's definitely a hybrid. Pure private good logic suggests the beneficiary pays. Pure public good logic suggests society pays.
