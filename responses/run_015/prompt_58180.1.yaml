      *   *The "Black Asleep" (Case 2) point:* This confirms the Actual Sequence view. Black's presence is irrelevant because he didn't act.
      *   *The New Case:* Apply the principle. Stuck pedal = no control. Backup device = control (because actual sequence is normal).
      *   *Critical Check:* Is the user confused? A little bit on Case 5. Case 5 is the "Manipulation Argument" against compatibilism. If Jones (Case 1) is responsible, why isn't Maya (Case 5)? The difference is *historical*. Jones's reasons are his own. Maya's reasons were implanted/forced over time. I need to make sure the user sees that *history* matters for Sourcehood, not just the moment of action.
