      *   *Core Idea:* Moral responsibility depends on the *actual sequence* of events leading to the action (was it your own? did you identify with it?), not on the *alternative sequences* (could you have done otherwise?).
      *   *Refinement:* To distinguish Case 1 (Responsible) from Case 4 & 5 (Not Responsible), we need a **Historical** condition. The action must issue from a mechanism that is "moderately reasons-responsive" (Fischer) or "truly your own" (Frankfurt/Dworkin hierarchy) *and* not the result of manipulation that bypasses your agency.
