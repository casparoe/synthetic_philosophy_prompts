  **Scenario**
  A metropolitan hospital system aims to reduce labor costs by restructuring nurse shifts. The status quo involves significant temporal overlap between outgoing and incoming shifts, allowing for informal face-to-face handoffs. The intervention eliminates this overlap to maximize billable hours, relying on digital logs for information transfer. Both models agree that under the status quo, patient error rates are stable and low. They diverge on the effect of the intervention.

  **Demonstration**
  The methodological individualist (MI) models each nurse as an autonomous unit with a specified competence level, fatigue curve, and access to the digital log. Because the intervention does not change individual shift length or stated competence, the MI model predicts error rates will remain unchanged; the digital log is assumed to be a perfect substitute for verbal handoffs. The holist models the staffing schedule as a **temporal network**, where safety depends on **redundant information pathways** (a structural property defined by the intersection of shift windows). The holist predicts error rates will spike because the intervention collapses the network's redundancy, making the system brittle to individual lapses that were previously caught during overlap. If the holist is right, observers will see error rates rise specifically in complex cases requiring multi-stage coordination, despite no change in individual nurse qualifications or hours.

  **Analysis**
  The feature doing the work is the **non-separability of the production function**. Individual competence is not an intrinsic asset but a relationally maintained state; the "information" a nurse holds is dependent on the structure of the handoff network. If you invert this—say, the task is solitary data entry where peer input is irrelevant—the individualist model wins, as the structural variable becomes causally inert. The strongest reply available to the methodological individualist is that this is merely a specification error: a sufficiently granular individualist model could include "probability of information decay" as an individual parameter calibrated to the schedule. This reply is weakest where it concedes that the parameter's value is determined entirely by a relational property (the overlap) rather than an individual trait, effectively admitting that the *dyad*, not the agent, is the relevant unit of prediction.

  *Flag:* This case quietly assumes that the methodological individualist strategy entails holding structural context fixed (*ceteris paribus*) during intervention analysis. A sophisticated agent-based modeler could argue that true individualism requires updating all environmental constraints, including network topology. The case relies on the philosophical commitment to individual *attributes* as the primary drivers of change, rather than individual *relations*, to generate the divergence.
