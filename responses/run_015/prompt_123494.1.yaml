answer: |-
  ### Desiderata for an Analogy-Centric Cognitive Architecture

  **Purpose:** A machine that acquires concepts like a young child (few-shot, unsupervised, no hand-coded features) and exhibits recognizably human failures.

  #### I. Functional Requirements (The Cases)

  1.  **Relational Perception without Pre-marking**
      *   *Case:* Solving two-panel visual puzzles where the distinction is purely relational (e.g., "inside" vs. "outside") and not marked by specific features.
      *   *Requirement:* The system must extract relations as primary objects of cognition, not as derivatives of object properties.
      *   *Status:* **Non-negotiable.** (Without this, the system cannot solve the puzzles without pre-defined feature detectors.)

  2.  **Fluid Acceptance and Diachronic Rejection**
      *   *Case:* Immediately understanding "new job is like new kid" but later rejecting "atom is like solar system."
      *   *Requirement:* The system must allow high-level structural alignment to drive immediate comprehension, yet possess a mechanism for conceptual revision that decouples the analogy when deeper causal models conflict.
      *   *Status:* **Non-negotiable.** (A system that cannot reject a once-useful analogy cannot learn science; a system that cannot accept a metaphor instantly cannot communicate.)

  3.  **Generative Projection (Structure Creation)**
      *   *Case:* Explaining Domain A using Domain B where vocabulary does not match, and the shared structure emerges *from* the comparison.
      *   *Requirement:* Analogy must be capable of *projecting* inferences from source to target, effectively creating new conceptual structure in the target domain rather than merely retrieving existing isomorphisms.
      *   *Status:* **Non-negotiable.** (If structure must pre-exist to be mapped, the system cannot learn novel concepts from scratch.)

  4.  **One-Shot Generalization with Self-Correction**
      *   *Case:* Forming a usable concept from a single exposure, then retracting the overextension without external feedback.
      *   *Requirement:* The system must generalize aggressively from sparse data but possess an internal consistency check (e.g., predictive failure or structural tension) that triggers retraction without a reward signal.
      *   *Status:* **Non-negotiable.** (This defines the "child-like" constraint; external labels are explicitly forbidden by the purpose.)

  #### II. Principled Constraints (The Mechanics)

  5.  **Heuristic Search without Oracle**
      *   *Case:* Taming the combinatorial explosion of candidate mappings.
      *   *Requirement:* The search space must be pruned by saliency, context, or prior activation levels inherent to the system's state, not by a goal-state that presupposes the correct mapping.
      *   *Status:* **Non-negotiable.** (Otherwise, the system is merely verifying a solution it already knows.)

  6.  **The Physics of Resistance**
      *   *Case:* What makes an analogy resistible and what is learned from resistance.
      *   *Requirement:* The theory must quantify "structural tension" or "disanalogy" as a positive signal that drives conceptual differentiation, not just as a failure to match.
      *   *Status:* **Non-negotiable.** (Without this, the system cannot explain why some analogies feel wrong or how rejecting an analogy refines a concept.)

  7.  **Predictive Error Profile**
      *   *Case:* Predicting characteristic errors rather than only successes.
      *   *Requirement:* The mechanism must produce systematic biases (e.g., surface-feature interference, relational slippage) that mirror human developmental errors, not random noise.
      *   *Status:* **Non-negotiable.** (Random noise does not validate a cognitive theory; systematic bias does.)

  #### III. Theoretical Preferences (Camp-Specific)

  8.  **Unified Mechanism**
      *   *Description:* The demand that categorization, perception, and reasoning all be the *same* process (analogy) operating at different scales.
      *   *Status:* **Preference.** (A hybrid system with distinct modules for perception and reasoning could satisfy the functional requirements without accepting Hofstadter's monistic thesis.)

  9.  **Single Representational Format**
      *   *Description:* The demand that all knowledge be stateable in one format (e.g., symbolic, connectionist, or "fluid concepts").
      *   *Status:* **Preference.** (The functional requirements do not dictate the substrate, only the input/output behavior and learning trajectory.)

  ---

  ### The Impossible Subset

  The subset that cannot be jointly satisfied is **One-Shot Generalization (4)**, **Generative Projection (3)**, and **Predictive Error Profile (7)**.

  If a system is plastic enough to invent structure from a single example (3 & 4), it lacks the prior constraints necessary to generate *predictable* systematic errors (7) rather than arbitrary confabulations. To predict *which* overextension will occur and *when* it will be retracted, the system requires a prior topology of conceptual space. But if it has a prior topology, it violates the "no hand-coded features/curriculum" constraint of the child-like learner. You cannot have a system that creates structure from nothing *and* reliably predicts how that structure will break; the freedom required for the former destroys the regularity required for the latter.

  ---

  ### Exclusionary Power

  **"Predictive Error Profile"** excludes **Deep Learning/Connectionism**, because while neural nets generalize from few shots (with tuning), their failure modes are typically adversarial or statistical noise rather than structurally human-like conceptual overextensions.

  **"Heuristic Search without Oracle"** excludes **Classical Symbolic AI (GOFAI)**, because symbolic systems typically require the search space and rules to be predefined by the programmer, effectively presupposing the answer to tame the combinatorics.

  **"Generative Projection"** excludes **Strict Structural Mapping Theory (e.g., early Gentner)**, because standard mapping algorithms require pre-existing structural descriptions in both domains and cannot account for the *creation* of new conceptual structure in the target domain through the act of comparison.
