          *   Fudge: Treating intuitions as "Responses" without a "Signal/Noise" objective measure.
          *   Verdict: This is a substantive identification failure. The debate might be verbal unless an independent metric of epistemic standing (like reliability) is agreed upon.

      *   *Residue 3: Action/Assertion Licensing.*
          *   SDT: Output is a decision (Yes/No). Payoffs determine optimal decision.
          *   Epistemology: Knowledge is a *normative status* that *licenses* action. It's not just the decision; it's the permission slip.
          *   Fudge: SDT describes *behavior* optimization. Epistemology describes *normative authority*. SDT says "You *should* decide Yes to maximize utility." Epistemology says "You *may* act as if P is true."
          *   Verdict: SDT lacks a deontic/normative layer. It explains *why* we act, not why we are *permitted* to claim authority.

  6.  **Review and Refine:**
