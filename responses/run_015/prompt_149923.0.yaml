          *   *Fixed:* The rule that "Knows" means "Evidence > $\beta_{context}$".
          *   *Variable:* The value of $\beta_{context}$ determined by conversation.

      *   *Pragmatic Encroachment:*
          *   Knowledge *just is* the state sufficient to license rational action.
          *   If the Payoff Matrix changes (High Stakes), the required Evidence for Knowledge changes *because* Knowledge is tied to Action.
          *   Unlike Contextualism, this isn't just semantic; it's metaphysical/functional.
          *   *Fixed:* The link between Knowledge and Rational Action.
          *   *Variable:* The Criterion $\beta_{know}$ shifts with Payoffs.

      *   *Refining the Mapping:*
          *   Sensitivity ($d'$): Always the quality of evidence (memory, perception). All agree this is fixed across the case pair.
