      *   *Refining Residue 1:* In SDT, you can move criterion left or right. In epistemology, stakes only seem to make knowledge *harder*, never easier than a baseline. This suggests a floor effect or a non-symmetric cost function in the epistemic payoff matrix.
      *   *Refining Residue 2:* This is the strongest point. Without a "Truth Meter" for knowledge, $d'$ and $\beta$ are confounded. The debate is essentially about how to model the response function without access to the latent state.
      *   *Refining Residue 3:* The "License" concept. SDT is consequentialist (maximize value). Epistemology is often deontological (warrant/entitlement). This is a category error in the translation.

