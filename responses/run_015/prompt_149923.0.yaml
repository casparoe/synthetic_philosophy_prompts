          *   Saying "I don't know" in high stakes is a False Alarm avoidance strategy (bias), not a change in the definition of detection.
          *   *Fixed:* The Criterion ($\beta_{know}$).
          *   *Variable:* The Optimal Action Criterion ($\beta_{action}$).

      *   *Epistemic Contextualism:*
          *   "Knows" is indexical. The criterion $\beta$ is a parameter of the *predicate* "knows".
