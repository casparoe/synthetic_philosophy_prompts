answer: |-
  **Project Title:** Architectural Mismatch: A Layered Agency Model of Williams's Integrity Objection
  **Project Duration:** Six Weeks
  **Format:** Conceptual Modeling and Philosophical Analysis

  **1. Problem Statement and Working Hypothesis**
  Bernard Williams's integrity objection, exemplified by the "one thought too many" case (saving a spouse versus a stranger), argues that utilitarianism alienates agents from their ground projects by demanding global optimization of all commitments. Standard interpretations treat this as a normative conflict: utilitarianism demands *X*, integrity demands *Y*, and they are incompatible. This proposal operates on the hypothesis that this incompatibility arises from a hidden architectural assumption: the model of the agent as unitary and transparent. In this "single-threaded" model, every commitment is globally available for cost-benefit analysis.

  I propose that moral agency is better modeled as a layered system. In this architecture, certain commitments function as non-negotiable source constraints operating below the level of reflective choice. These constraints are not inputs for optimization but pre-conditions for the optimizer's existence. If this hypothesis holds, Williams's objection does not refute utilitarianism as a normative standard but identifies a category error in its application: it is being applied at the object level rather than the meta-architectural level.

  **2. Thesis: Relocation of the Objection**
  This project argues that the layered-agency reconstruction **relocates** the integrity objection rather than dissolving or preserving it in its original form.
  *   **Not Dissolved:** The tension remains; utilitarianism still cannot command the agent to override source constraints without destroying the agent's functional integrity.
  *   **Not Preserved:** The objection is no longer that utilitarianism is morally wrong, but that it is architecturally misapplied.
  *   **Relocated:** The conflict shifts from a clash of values to a constraint satisfaction problem. Utilitarianism functions as the global objective function, but integrity functions as the hard constraint set that defines the feasible region. The "one thought too many" arises when the global optimizer attempts to inspect or modify the hard constraints directly, inducing system instability.

  **3. Critique of Standard Responses**
  Existing responses fail to address this structural possibility because they retain the unitary agent model.
  *   **Direct Utilitarianism:** Attempts to absorb integrity into the calculus (e.g., counting psychological distress as a cost). This fails because it treats constitutive constraints as variable costs. A system that negotiates its own source constraints on every iteration incurs prohibitive computational overhead and risks infinite regress.
  *   **Indirect Utilitarianism:** Argues agents should follow heuristics rather than calculate every act. This fails because it treats the heuristics as strategic choices made by the unitary self. In the layered model, integrity constraints are not chosen strategies; they are structural features that make choice possible. Indirect utilitarianism assumes the agent can step outside the constraints to validate them; layered agency posits that stepping outside dissolves the specific agency in question.

  **4. Methodology**
  The project will employ conceptual analysis combined with a rigorous, non-empirical model of layered commitment. The agent will be modeled as a multi-level constraint satisfaction system.
  *   **Layer 1 (Source Constraints):** Representations of ground projects and personal commitments (e.g., spousal loyalty). These are treated as hard constraints that prune the search space before optimization occurs.
  *   **Layer 2 (Reflective Optimization):** The utilitarian calculus operates within the feasible region defined by Layer 1.
  *   **Analysis:** I will test Williams's cases against this model to determine if the "alienation" Williams describes maps onto the system error produced when Layer 2 attempts to override Layer 1. The analysis will avoid vague appeals to "human complexity" or "emotional depth," treating psychological stability as a functional requirement for agency continuity.

  **5. Expected Outcomes**
  *   **Positive Result:** A taxonomy of moral demands distinguishing those that survive layer-filtering (permissible objects of utilitarian calculation) from those that do not (structural constraints). A positive result demonstrates that utilitarianism can be retained as a meta-ethical standard without requiring the agent to run utilitarian calculations on their constitutive commitments.
  *   **Failure Condition:** The project fails if the layered model collapses into standard indirect utilitarianism. If the "hard constraints" of Layer 1 can be shown to be merely provisional rules adopted by Layer 2 for efficiency, the architectural distinction vanishes, and Williams's original objection stands unchanged. Failure also occurs if the model cannot explain the normative force of integrity without resorting to non-utilitarian foundational claims.

  **6. Scope and Timeline Assessment**
  A six-week timeline is sufficient for the conceptual modeling but imposes strict boundaries on defense and expansion.
  *   **Weeks 1-2:** Formalize the layered agency model. Define "source constraints" precisely to avoid ambiguity with standard deontological rules.
  *   **Weeks 3-4:** Apply the model to Williams's specific cases (Jim and the Indians; the spouse rescue case). Test for the "collapse" failure condition.
  *   **Weeks 5-6:** Draft the taxonomy of moral demands and finalize the argument regarding the relocation of the objection.
  *   **Limitations:** This scope excludes empirical validation from cognitive science. The claim is strictly about the logical coherence of the agent model, not its psychological accuracy. It also excludes a full defense against non-utilitarian critiques; the focus remains strictly on whether utilitarianism can survive Williams's objection via architectural adjustment. The primary risk is that the distinction between "strategic heuristic" and "constitutive constraint" proves unstable under rigorous scrutiny, requiring a scope reduction to merely outlining the problem rather than solving it.
