      *   **Core Thesis:** The debate over the norm of assertion (Knowledge vs. Truth vs. Justification) ignores institutional assertion (newsrooms). Institutional practices (hedging, distinct blame structures for process vs. content, collective epistemic agency) challenge the standard individualistic models.
      *   **Required Components:**
          1.  Precise statement of the question (determinate answer, not just descriptive).
          2.  Critique of existing positions (Knowledge, Truth, Justification, Stake-sensitive norms) showing why they leave the question open.
          3.  Methodology (12-month plan, conceptual work + reporting/interviews/analysis, integration of both, justification for mixed method).
          4.  Success criteria (what claim can be defended at the end that can't be now).
          5.  Failure conditions (honest assessment of risks/ambition).
          6.  Anticipation of two deflations (applied ethics collapse, trivial institution/individual distinction) and how to avoid them.
      *   **Tone/Register:** Formal, unapologetic, aimed at philosophers (some specializing in assertion). No bibliography/citations.
      *   **Constraint:** Roughly 1,500 words.

  2.  **Deconstruct the Thesis & Formulate the Question:**
      *   *Current Debate:* Individual speaker, single sentence, binary assertion.
      *   *Observation:* Newsrooms assert collectively, use graded modals, separate process blame from content blame.
      *   *The Gap:* Standard norms (K, T, J) don't capture the dual liability (process + content) or the graded nature of institutional assertion.
      *   *The Question:* Needs to be philosophical, not sociological. Not "How do newsrooms work?" but "What is the norm of *institutional* assertion?" or "Does the existence of institutional assertion falsify the standard norms?"
      *   *Draft Question:* Is the norm of assertion singular and agent-neutral, or does it fragment along the axis of individual versus institutional agency?
      *   *Refinement:* Let's make it sharper. The prompt asks for a determinate answer. The thesis suggests the standard norms fail. So the question should be: *Does the practice of institutional assertion constitute a counterexample to the monistic norms of assertion currently dominant in epistemology?* Or better: *What is the normative structure of institutional assertion, and does it require a revision of the standard account of the speech act itself?*
      *   *Decision:* I will frame the question as determining whether the norm of assertion is *unitary* or *pluralistic* with respect to agency. Specifically: *Does the epistemic norm governing assertion bifurcate when the asserting agent is an institution rather than an individual?*

  3.  **Critique of Existing Positions:**
      *   *Knowledge Norm (KN):* Fails because newsrooms assert things they don't "know" in the strict sense (no first-hand acquaintance), yet aren't violating norms if sourced well. Also, hedged claims count as assertions but don't claim knowledge.
      *   *Truth Norm (TN):* Fails because well-sourced falsehoods are treated differently than lucky truths. TN says only truth matters. Practice says process matters.
      *   *Justification Norm (JN):* Closer, but usually tracks individual justification. Institutional justification is structural/procedural.
      *   *Stake-sensitive (Warranted Assertibility):* Doesn't explain the *structural* separation of process and content blame.
      *   *Synthesis:* These norms assume a unified agent. They cannot account for the "two-factor standard" (content + procedure) observed in newsrooms.

  4.  **Methodology (12-Month Plan):**
      *   *Need:* Integration of philosophy and reporting. Not just "I will interview people" but "I will interview people to test philosophical categories."
      *   *Months 1-3:* Conceptual groundwork. Map the norms against the "institutional agent" problem.
      *   *Months 4-6:* Reporting. Interviews with standards editors. Analysis of corrections/retractions.
      *   *Months 7-9:* Synthesis. Testing the "two-factor" hypothesis against the data.
      *   *Months 10-12:* Drafting and refinement.
      *   *Justification:* Armchair philosophy misses the phenomenology of the practice. Pure sociology misses the normative force.

  5.  **Success & Failure:**
      *   *Success:* Defending a "Dual-Factor Norm of Institutional Assertion" (Procedural Warrant + Truth-Tracking). Showing this forces a revision of the general theory of assertion.
      *   *Failure:* If the data shows newsrooms are just aggregating individual assertions (no distinct institutional norm). If the distinction collapses into mere ethics rather than epistemology. If 12 months isn't enough to formalize the norm.

  6.  **Addressing Deflations:**
      *   *Deflation 1 (Applied Ethics):* Risk is saying "journalists should be honest." Need to show this is about *constitutive norms* of the speech act, not moral obligations.
      *   *Deflation 2 (Trivial Distinction):* Risk is saying "groups aren't people." Need to show the *epistemic structure* differs, not just the metaphysics of agency.

  7.  **Drafting - Section by Section (monitoring word count):**

      *   *Title:* Needs to be punchy. "The Institutional Norm of Assertion."
      *   *Introduction/Question:* Set the scene. The debate is stuck on individual cases. The newsroom offers a stress test. State the question clearly.
      *   *The Gap:* Address KN, TN, JN. Explain why they fail to capture the "process vs. content" blame distinction.
      *   *Method:* Break it down by quarters. Emphasize the *feedback loop* between theory and reporting.
      *   *Outcomes:* What is the deliverable? A paper? A specific argument?
      *   *Risks:* Be honest about the difficulty.
      *   *Deflations:* Address the two specific objections requested.

      *(Self-Correction during drafting)*: Watch the tone. It shouldn't sound like a journalist teaching philosophers. It should sound like a writer who understands the philosophical stakes and is offering new data/constraints. Use terms like "constitutive norm," "speech act," "epistemic agency." Ensure the word count stays near 1,500.

      *Word Count Check:*
