  | commitments_involved | real_or_apparent | severity | hidden_assumption | what_has_to_give | cost |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1 vs. 2 & 3** (Public Justification vs. No Translation/Secular Parity) | **Apparent** (but fragile) | **5** | That an "overlapping consensus" exists which is distinct from a secular comprehensive doctrine. | Commitment 1 must be clarified: Public justification is an *institutional* requirement (the text/report), not a *psychological* one (the voter's motive). | If the "Civic Rationale" becomes a sham formality, Commitment 1 collapses into hypocrisy, and the Marriage Amendment verdict (4) loses its principled bite. |
  | **3 vs. 4c** (Secular Parity vs. Judge Verdict) | **Real** | **4** | That "Legal Reason" is neutral rather than itself a comprehensive secular doctrine. | Commitment 3 must be qualified: The State *does* get to privilege "Public/Legal Reason" within judicial institutions, even if it looks comprehensive. | You lose the symmetrical critique of secular ideology. You must admit the State *does* favor a specific epistemology (legalism) over theology in courts, which looks like a violation of 3. |
  | **1 vs. 4b** (Public Justification vs. Pharmacist Verdict) | **Real** | **3** | That "access to care" is a public good sufficient to override conscience claims. | Commitment 1 needs a subsidiary principle: Coercion is unjustified *unless* it prevents undue harm/burden to third parties. | You introduce a consequentialist "harm principle" that isn't in your original deontological set (1-3). It complicates the memo with utilitarian calculations. |
  | **2 vs. 4c** (No Translation vs. Judge Verdict) | **Apparent** | **3** | That Judges are "speaking in politics" in the same way Legislators are. | Commitment 2 must be limited to *legislative* politics, excluding *judicial* reasoning. | You must explicitly carve out the Judiciary as a zone where translation *is* required, creating a two-tier system of free speech for officials. |
  | **1 vs. 4d** (Public Justification vs. Charter Verdict) | **Apparent** | **2** | That funding education is neutral even if the provider teaches religion. | Commitment 1 must accept that "public justification" supports parental choice, not secular schooling specifically. | Minimal cost, provided you maintain the "academic benchmarks" constraint as the public rationale. |

  **cheapest_single_revision:** Refine Commitment 1 to specify that **public justification is a property of the *law's official record* (the Civic Rationale), not the *lawmaker's mental state*.** This allows legislators to vote on religious motives (satisfying 2) while ensuring the enforceable statute rests on public grounds (satisfying 1), provided the Committee Report requirement is strictly enforced.

  **verdict_i_cant_afford:** **The Judge Verdict (4c).** If you hold Commitment 3 (Secular views are comprehensive) strictly, you cannot claim a Judge is "wrong" to cite scripture without admitting that "Legal Reason" is just the State's preferred comprehensive doctrine. To keep 3, you must allow Judges the same latitude as Legislators; to keep 4c, you must concede that the State *does* privilege a specific (secular/legal) epistemology in court, which weakens 3.
