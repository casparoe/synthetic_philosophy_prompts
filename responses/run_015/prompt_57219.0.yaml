answer: |-
  The prevailing consensus, heavily indebted to Amartya Sen, holds that famines are not natural disasters but political crimes. The standard account locates the crime in distribution: food exists, but entitlements collapse, and the state fails to intervene. This is correct, yet it remains too weak. It diagnoses the failure in the economy rather than the mind. The stronger thesis is that in the great twentieth-century famines, the operative crime was epistemic. What killed people was not chiefly that food was taken away, but that the information system which would have told the people in charge that anyone was dying was destroyed, corrupted, or fed accurate reports which were discounted out of ideological priors. Food policy sits downstream of that break. The interesting failure is upstream, in the knowing.

  To argue this properly, we must split the thesis into two separable claims. The first is that the signal never got sent. This covers censorship, killed messengers, cadres inflating output figures to hit quotas, or an administration that never formally declares a famine. The second is that the signal was sent, received, and then not believed or not treated as decision-relevant. This covers officials who read the reports and concluded the market would sort it out, or that the deaths were an acceptable price for industrialisation. While both mechanisms appear in history, the second claim is the load-bearing one. Pure censorship explains totalitarian silences, but it cannot explain famines within open societies or complex bureaucracies where data flows freely but is interpreted through a distorting lens. If the thesis rests only on suppression, it collapses back into a simple authoritarianism argument. The conjunction of both buys us a universal theory: whether through fear or faith, the state becomes blind to suffering before it becomes cruel.

  We can test this epistemic account against the three canonical cases. In China during the Great Leap Forward, the epistemic account predicts a disconnect between reported and actual harvests driven by structural incentives to lie. This is precisely what we find. Local cadres, facing career-ending consequences for reporting failure, inflated yield figures. The central leadership received data suggesting a surplus, leading to increased procurement quotas and exports while starvation raged. The signal was blocked at the source; the centre did not merely ignore the famine, it literally could not see it through the fog of fabricated statistics. The information system was not just corrupted; it was inverted, turning distress signals into celebrations of abundance.

  Bengal in 1943 presents a mixed case, leaning towards signal suppression compounded by ideological discounting. The wartime denial policies stripped boats and rice stocks, but the critical failure was the classification of the crisis. The provincial government declined to call the thing a famine, partly due to wartime censorship designed to deny propaganda victories to Japan. However, the War Cabinet in London also received warnings. Here the epistemic failure shifts towards the second claim: the signals were received but discounted by racial and strategic priors. Churchill's administration viewed Indian suffering through a lens that prioritised European theatre logistics. The information was present, but the decision-making framework rendered it irrelevant against higher-order strategic goals. The knowledge existed, but it was not admitted into the calculus of action.

  Ireland between 1845 and 52 is the hardest case and must be treated as such. It looks like a refutation of the information story: there was a free press, Irish members at Westminster, and accurate reporting on the ground. Grain and livestock kept leaving the country while people died, documented openly in newspapers. If the epistemic thesis holds, we must find that the signal was sent and received but filtered out by ideology. This is exactly what the Treasury under Charles Trevelyan demonstrates. The reports of death were not suppressed; they were interpreted through a rigid laissez-faire dogma. The ideology held that market intervention would distort prices and create dependency, ultimately causing more harm. The information was accurate, but the ideological prior dictated that relief was economically impossible or morally hazardous. This supports the second variant of the thesis: the breakdown was not in the transmission of data, but in the processing of it. The state knew people were dying but believed that saving them was structurally forbidden. This handles the counterexample to the claim that famines don't happen in functioning democracies with a free press. A free press ensures data transmission, but it does not guarantee data integration into policy if the ruling ideology defines intervention as harmful.

  The strongest objection to this thesis is that it conflates information with motivation. Critics will argue that rulers often had the facts and chose otherwise because acting was politically expensive. If you stretch 'epistemic failure' far enough to cover motivated disbelief, the thesis becomes unfalsifiable. If ignoring a report is the same as not knowing, then every political choice becomes an information error. To answer this without retreating to the truism that politics caused the famine, we must distinguish between preference and cognition. A motivated choice implies a clear understanding of costs and benefits where suffering is accepted as a trade-off. An epistemic failure implies that the costs were not calculable within the agent's framework. In Ireland, Trevelyan did not simply choose death over cost; he believed that intervention would violate natural economic laws and worsen the crisis. The ideology did not just make relief expensive; it made relief unintelligible as a solution. The epistemic claim is not that they didn't care, but that their model of the world rendered the suffering inevitable or self-correcting. This shifts the blame from mere malice to structural ignorance, which is a distinct and more dangerous category of error.

  This position offers something genuinely new relative to the familiar democracy-and-free-press claim. Sen's argument relies on electoral accountability: leaders respond to suffering because they fear being voted out. The epistemic thesis argues that leaders respond because they are forced to see. A free press can be read and ignored, as in Ireland, and the Great Leap had plenty of information flowing upward through party channels that didn't translate into relief because the channels were designed to transmit praise, not pain. The difference is mechanistic. The democratic claim assumes rational actors responding to incentives. The epistemic claim assumes bounded rationality constrained by information architecture. It suggests that a regime could be democratic yet blind, or authoritarian yet responsive if the feedback loops are protected. It moves the focus from the ballot box to the bureaucracy's sensory organs.

  To falsify this thesis, one would need to observe a famine where accurate, timely data reached the centre, was accepted as true without ideological filtering, and relief was still logically impossible due to the physical absence of food. If a government knows exactly who is starving, admits it fully, wants to save them, but cannot because no food exists anywhere to buy or move, the epistemic account fails. It requires the failure to be in the knowing, not the having. Alternatively, if a regime systematically starves a population for punitive reasons while fully acknowledging the reality and without any ideological cover of market correction or strategic necessity, the crime is purely distributive and malicious, not epistemic.

  If the thesis is true, it carries an awkward implication for famine prevention that complicates the standard send-food-and-fix-entitlements position. It suggests that whistleblower protection and independent statistical auditing are more critical than grain reserves. Building silos matters less than ensuring the local cadre can report a bad harvest without fear of execution. It implies that international aid should focus less on shipping calories and more on insulating local data collection from political interference. We often assume the bottleneck is logistics; the epistemic view suggests the bottleneck is truth. Fixing the entitlement system is useless if the system never receives the signal that entitlements have collapsed. We must build machines that know before we build machines that feed.
