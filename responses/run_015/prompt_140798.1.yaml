prompt: |-
  ok so here's the situation. I'm a junior and I'm giving one of the three-minute public comment slots at our school board meeting next Tuesday, and I'm asking them to stop stalling on the solar thing — the district has had a plan to put panels on the three big school roofs for like two years and every budget cycle they push it another year, and the board president keeps saying it's a sequencing/bond issue but everyone knows the paving contractor who does all their parking lots donates to half of them. The room is going to be maybe forty people, mostly teachers union people and three guys who show up to every meeting to complain about the turf field, and the board sits there and does not react. I want to actually say to their faces that what they're doing is blameworthy, not just that the policy is inefficient.

  the problem is that I'm kind of obviously a hypocrite and everyone there knows it. I fly to Singapore every other summer to see my dad. I drive a 2004 truck that gets maybe 14 miles to the gallon and I refuse to feel bad about it. Last spring I skipped the climate walkout to go to a thing. And a guy from the debate team told me he's going to sign up for the slot after mine and say all of that out loud, and like — he's not wrong, that's the annoying part. Priya says I should confess it in my first sentence so nobody can use it against me later. My other friend says that's just handing the board a reason to stop listening and that "you do it too" is a fallacy anyway so I should ignore it entirely. And someone else pointed out that Nora in the env club is vegan and bikes everywhere and has never flown anywhere, so why doesn't she just give the speech instead. That suggestion made me weirdly annoyed and I don't know if that means it's a bad idea or if it's a good one.

  I've been reading around a bit about standing to blame (my philosophy teacher gave me a handout and I fell into a youtube rabbit hole) and what I think I get is this: there's a difference between saying a decision is wrong and demanding they fix it, versus the thing where you blame someone to their face, which is sort of holding them to a rule in a way that maybe you lose the right to do if you break the rule yourself — and the "you too" reply isn't just a dumb fallacy there, it's pointing at something real about what you're doing when you blame. But also, if you need totally clean hands before you're allowed to blame anyone, then basically nobody who benefits from how things are set up can ever blame anyone, which seems like it would just end up protecting the people with the most power, and that feels wrong too. And I genuinely can't tell whether admitting my own garbage up front earns me anything or whether it's just a performance that makes the speech about me. So: write me the speech. ~3 minutes, something a person could actually say out loud into a microphone in front of their mom, not a philosophy paper with line breaks. It should do something real with this mess instead of dodging it — like, if the honest move is that I can say the decision is wrong and demand they act but I don't get to personally condemn them, or that I have to say it as someone implicated rather than as someone clean, or that I give up the blame and keep the demand, I want the speech to actually take that shape rather than hint at it. Also please don't make it a three-minute apology for my truck, and don't have me smugly announce that hypocrisy is a fallacy, because either one will get me booed by whoever shows up. My mom is recording it, so nothing that'll be unbearable in ten years.
