answer: |-
  Good evening. My name is [Name], I'm a junior, and I'm here to ask the board to stop stalling on the solar installation plan.

  For two years, this district has had a concrete plan to put panels on the three big school roofs. Every budget cycle, it gets pushed to the next one. The explanation is always sequencing or bond issues. But when we see paving contracts renewed on schedule while sustainability projects stall, it sends a clear message about priorities. It looks less like fiscal responsibility and more like protection of the status quo.

  I know what some of you are thinking. You know I drive a 2004 truck that gets fourteen miles to the gallon. You know I fly overseas every summer. You know I skipped the climate walkout last spring to do something else. I am not standing here with clean hands. I benefit from the same carbon-heavy systems everyone else does, and I'm not going to pretend otherwise to make myself look better.

  But there is a critical difference between living inside a broken system and being paid to manage it. My choices are individual compromises within a system I didn't build. Your choices are institutional commitments that you have the power to change. When you delay this project, you aren't just making a personal choice; you're deciding how our public money gets spent and what values this district actually holds.

  I'm not asking you to be saints. I'm not asking you to fix the climate single-handedly. I am asking you to stop blocking a plan you already agreed was sound. Delaying this isn't just inefficient; it is a breach of the responsibility you were elected to hold. You can question my truck later. Right now, I am questioning your budget.

  My lack of perfection doesn't erase your obligation. In fact, pretending I'm perfect would make me a liar. But admitting I'm part of the problem doesn't mean I have to accept you making it worse. There is a difference between being complicit and being responsible. I am complicit. You are responsible.

  So don't push this to next year. Put the solar plan in the current budget. Stop treating our future like it's something we can wait on.

  Thank you.
