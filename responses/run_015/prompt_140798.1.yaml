      *   *The Board's Duty:* You say it's sequencing. People hear excuses. When paving contracts get renewed while green initiatives stall, it looks like priorities are misplaced.
      *   *The Demand:* I'm not asking you to save the world alone. I'm asking you to stop blocking what you already promised.
