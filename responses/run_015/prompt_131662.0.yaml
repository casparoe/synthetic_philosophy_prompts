      *   Standard Experimental Philosophy (X-Phi) assumes vignettes are interpreted uniformly.
      *   Critique: Vignettes are underdescribed. Cultural backgrounds lead to different "defaults" (e.g., legal context, relationship status).
      *   Hypothesis: Apparent intuition gaps are actually interpretation gaps.
      *   Test: Explicitly state defaults. If gaps disappear, it was keying variation. If gaps persist, it's genuine intuition variation.
      *   Second-order: Metalinguistic/normative assessment of the other group's response.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy. "Keying Variation in Cross-Cultural Intuitions" or similar.
      *   **Research Question:** Needs to be precise. "To what extent do cross-cultural discrepancies in philosophical intuitions arise from divergent background assumptions (keying variation) rather than divergent conceptual contents?"
      *   **Context/Gap:** Variation-finders (e.g., Weinberg, Nichols, Stich) say intuitions vary. Robustness defenders (e.g., Williamson, Cappelen) say they don't (or errors explain it). Both assume the vignette is interpreted similarly. This project challenges that assumption.
      *   **Design:**
          *   Standard vignette (e.g., Gettier or Reference).
