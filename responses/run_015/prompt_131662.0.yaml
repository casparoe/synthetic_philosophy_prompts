          Title: Keying Variation: Disentangling Interpretation from Intuition in Cross-Cultural Philosophy

          Research Question: To what extent do observed cross-cultural discrepancies in philosophical intuitions arise from divergent background assumptions ('keying variation') rather than divergent conceptual contents?

          Existing positions leave this open. Proponents of the 'variation challenge' argue that demographic differences in vignette responses undermine appeals to intuition. Defenders of robustness argue these differences are noise or performance errors. Both camps, however, typically assume the vignette itself is interpreted uniformly across populations. They treat the stimulus as constant. This project challenges that assumption. If vignettes are massively underdescribed, participants from different backgrounds will fill gaps with different defaults (e.g., assuming a legal context vs. a casual one). What looks like disagreement about knowledge may be agreement on different background premises.

          Design: I propose a three-phase experimental design across two distinct linguistic populations. Phase one measures defaults: participants complete standard vignettes followed by items querying their background assumptions (e.g., 'Was the protagonist acting within a legal institution?'). Phase two manipulates these defaults: the vignette is rewritten to make the most common divergent assumptions explicit and fixed across sites. We then measure whether the cross-cultural gap shrinks. Phase three introduces a second-order condition: participants are shown the opposing group's modal answer and reasons, asked to classify this as a disagreement, a different question, or a different topic.

          This design is superior to obvious alternatives. Increasing sample sizes merely measures the variation more precisely without explaining it. Adding more sites exacerbates the confound of divergent defaults. More careful translation ensures linguistic equivalence but not pragmatic equivalence. Only by isolating and manipulating the background assumptions can we distinguish keying variation from genuine content variation.

          Outcomes: A positive result shows the cross-cultural gap significantly shrinking when defaults are standardised, suggesting previous findings were artefacts of underdescription. A negative result shows the gap persisting despite fixed defaults, supporting the claim of genuine conceptual divergence. The project fails only if the defaults prove impossible to standardise without rendering the vignette unnaturally complex, or if recruitment targets are missed. A null result (no gap found in the standard condition) is not failure; it simply negates the need for the manipulation.

          Scope and Feasibility: Nine months is sufficient for two sites and one or two case studies (e.g., Gettier cases and reference). It is too short for more than two populations or a broad survey of philosophical topics. Adding a third site or expanding beyond the primary manipulation would jeopardise completion. The second-order condition is included only because it requires minimal additional time but yields high theoretical value regarding whether participants recognise the keying issue themselves.

