      *   *(c) Dead Predictor/Simulator:* Prediction 40 years ago, machine dead. **Verdict: One-box.**
          *   *Inference:* Causality doesn't matter. The correlation holds even if the cause is gone. Rules out CDT (which usually two-boxes if the prediction is causally inert). Supports EDT.
      *   *(d) Transparent Boxes:*
          *   See $1M: **Two-box.** (Takes visible $1M + $1k).
          *   See Empty: **One-box.** (Wait, prompt says "when the big box is plainly empty she takes the thousand").
          *   *Inference:* This is the "Transparent Newcomb" problem.
          *   If she sees $1M: She knows the predictor predicted 1-box. If she 2-boxes now, she gets $1M + $1k. If she 1-boxes, she gets $1M. Since the money is *already there*, 2-boxing dominates. She 2-boxes.
          *   If she sees Empty: She knows predictor predicted 2-box. If she 1-boxes, she gets 0. If she 2-boxes, she gets $1k. She 2-boxes?
