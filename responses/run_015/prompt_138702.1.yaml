      *   *(e) Clinician:* No machine, 80% accuracy, interview. **Verdict: One-box.**
          *   *Inference:* Mechanism doesn't matter (human vs machine), only accuracy and opacity.
      *   *(f) Low Accuracy:* 55% acc, $600k small. **Verdict: Two-box.**
