      *   **Summary of M's Profile:** M is a strict Evidential Decision Theorist. She calculates Expected Utility based on conditional probabilities given her action. She respects the "Newcomb Formula": One-box if $p > 0.5 + S/2B$. She ignores causal history (dead predictor is fine). She respects dominance when information screens off the correlation (transparent boxes).

