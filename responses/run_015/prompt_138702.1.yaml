          *   72% acc, $600k small: **Two-box.**
          *   72% acc, $440k small: **Toss-up/Both.**
          *   *Inference:* She is calculating Expected Utility (EU). She switches based on the ratio of Small Box ($S$) to Big Box ($B$) and Accuracy ($p$).
          *   *Calculation Check:*
              *   One-box EU $\approx p \cdot B$. (If she 1-boxes, predictor likely predicted 1-box, so Big Box has $B$).
              *   Two-box EU $\approx (1-p) \cdot B + S$. (If she 2-boxes, predictor likely predicted 2-box, so Big Box empty, she gets $S$).
              *   *Wait, standard Newcomb math:*
                  *   1-box: $p \cdot B + (1-p) \cdot 0 = pB$.
                  *   2-box: $p \cdot S + (1-p) \cdot (B+S) = S + (1-p)B$.
                  *   Indifference point: $pB = S + (1-p)B \Rightarrow pB = S + B - pB \Rightarrow 2pB = S + B \Rightarrow p(2B) = S+B \Rightarrow p = (S+B)/2B = 0.5 + S/2B$.
                  *   Let's check her data: $B = 1,000,000$.
                  *   Case 1: $S = 400,000$. Threshold $p = 0.5 + 400k/2M = 0.5 + 0.2 = 0.7$. Actual $p=0.72$. $0.72 > 0.7$. **One-box.** (Matches).
                  *   Case 2: $S = 600,000$. Threshold $p = 0.5 + 600k/2M = 0.5 + 0.3 = 0.8$. Actual $p=0.72$. $0.72 < 0.8$. **Two-box.** (Matches).
