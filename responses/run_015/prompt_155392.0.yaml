  # HANDOUT: THE WILDLIFE CONVERSION CALCULUS
  **Seminar:** Environmental Ethics | **Topic:** Habitat Destruction & Net Suffering

  ### PART I: THE BRANCHING QUESTIONS (NODES)
  *Answer these case-based questions to locate your position. Do not start with a label.*

  | Node | Question (Case-Based) | Permitted Answers |
  | :--- | :--- | :--- |
  | **Q1** | **Non-Identity:** Do animals never born because the habitat is gone count as moral subjects? | **Yes** (They count) / **No** (Only existing count) |
  | **Q2** | **Death Harm:** Is death a harm to an animal distinct from the pain of the dying process? | **Yes** (Deprivation) / **No** (Pain only) |
  | **Q3** | **Displacement:** Do animals cleared from the site die, or do they relocate and reproduce elsewhere? | **Die** (On-site) / **Relocate** (Survive elsewhere) |
  | **Q4** | **Pulse vs. Flow:** Does the acute suffering of the clearing event outweigh the long-term welfare flow of the new land? | **Pulse Dominates** / **Flow Dominates** |
  | **Q5** | **Counterfactual:** Does the converted land support *more* sentient life (Ag), *less* (Pavement), or *similar* (Wild)? | **More** / **Less** / **Similar** |
  | **Q6** | **Wild Baseline:** Is the average life of a wild animal in this habitat net positive or net negative? | **Net Positive** / **Net Negative** |
  | **Q7** | **Aggregation:** Do we sum total welfare, average welfare per life, or count only suffering? | **Total** / **Average** / **Negative-Only** |
  | **Q8** | **Weighting:** Do all sentient individuals count equally, or are larger/more cognitive animals weighted higher? | **Equal** / **Weighted** |

  ---

  ### PART II: DECISION TREE & POSITIONS
  *Follow your answers from Q1 downward. Leaves indicate your verdict on a representative episode of habitat conversion.*

  *   **Q1: Do prevented births count?**
      *   **NO (Person-Affecting)**
          *   **Q2: Is death a harm distinct from dying pain?**
              *   **YES** → **LEAF 1: Person-Affecting Conservationist**
                  *   *Verdict:* Conversion is **Bad** (harms existing individuals).
                  *   *Awkward Commitment:* Cannot object to sterilization programs that prevent birth without killing.
              *   **NO** → **Q3: Do cleared animals die or relocate?**
                  *   **Die** → **LEAF 2: Pain-Only Prior Existence**
                      *   *Verdict:* Conversion is **Bad** (due to clearing pain only).
                      *   *Awkward Commitment:* Mass death is morally neutral if the killing is painless.
                  *   **Relocate** → **LEAF 3: Displacement Skeptic [Unnamed]**
                      *   *Verdict:* Conversion is **Neutral** (no net loss of life/welfare).
                      *   *Awkward Commitment:* Ignores stress/territory loss associated with forced migration.
          *   **Q4: Does clearing pain outweigh future flow?** (If Q2=No & Q3=Die)
              *   **Pulse Dominates** → **LEAF 4: Clearing Absolutist [Unnamed]**
                  *   *Verdict:* Conversion is **Bad** (regardless of future land use).
                  *   *Awkward Commitment:* Must oppose clearing even if it prevents vast future suffering.
              *   **Flow Dominates** → **LEAF 5: Future-Flow Prior Existence [Unnamed]**
                  *   *Verdict:* Conversion is **Good** (if new land reduces suffering of survivors).
                  *   *Awkward Commitment:* Permits killing current residents if future survivors suffer less.
      *   **YES (Impersonal/Total)**
          *   **Q6: Is wild life net positive or negative?**
              *   **Net Negative**
                  *   **Q7: Aggregation Rule?**
                      *   **Negative-Only** → **LEAF 6: Antinatalist Environmentalism**
                          *   *Verdict:* Conversion is **Good** (reduces total suffering).
                          *   *Awkward Commitment:* Generalizes to favoring less wild nature generally (e.g., paving parks).
                      *   **Total** → **Q5: What replaces the habitat?**
                          *   **Less (Pavement)** → **LEAF 7: Sterile Land Proponent [Unnamed]**
                              *   *Verdict:* Conversion is **Good** (eliminates suffering sources).
                              *   *Awkward Commitment:* Values sterile land over living ecosystems.
                          *   **More (Ag)** → **LEAF 8: Intensification Critic**
                              *   *Verdict:* Conversion is **Very Bad** (wild suffering < farm suffering).
                              *   *Awkward Commitment:* Might prefer wild predation to factory farming.
              *   **Net Positive**
                  *   **Q7: Aggregation Rule?**
                      *   **Average** → **LEAF 9: Average Utilitarian**
                          *   *Verdict:* Conversion is **Bad** (unless new life is happier per capita).
                          *   *Awkward Commitment:* Prefers few happy animals to many miserable ones (Repugnant Conclusion avoidance).
                      *   **Total** → **LEAF 10: Classical Environmental Utilitarian**
                          *   *Verdict:* Conversion is **Bad** (loss of total welfare).
                          *   *Awkward Commitment:* Implies we should preserve nature even if it is cruel.
                      *   **Negative-Only** → **LEAF 11: [EMPTY: INCOHERENT]**
                          *   *Verdict:* **N/A**.
                          *   *Awkward Commitment:* Empty because it is incoherent to minimize suffering if wild life is net positive.
              *   **Q8: Weighting Rule?** (Applies to Total Views)
                  *   **Weighted** → **LEAF 12: Capacity-Weighted Conservationist**
                      *   *Verdict:* Conversion is **Bad** (loss of mammals outweighs gain of insects).
                      *   *Awkward Commitment:* Invertebrate suffering matters less than vertebrate welfare.
                  *   **Total/Unweighted** → *(See Leaf 10)*
          *   **Q5: What replaces the habitat?** (If Q6=Negative & Q7=Total)
              *   **More (Ag)** → **LEAF 13: [EMPTY: UNATTRACTIVE]**
                  *   *Verdict:* **N/A**.
                  *   *Awkward Commitment:* Empty because it is unattractive to maximize wild suffering via agriculture.
              *   **Similar (Wild)** → **LEAF 14: [EMPTY: UNEXPLORED]**
                  *   *Verdict:* **N/A**.
                  *   *Awkward Commitment:* Empty merely because it is unexplored whether rewilding counts as conversion.

  ---

  ### PART III: SEMINAR NOTES

  **Indistinguishable Leaves:**
  *   **Leaf 2 (Pain-Only)** and **Leaf 3 (Displacement Skeptic)** cannot be separated if relocation is assumed painless; both reduce the harm to the clearing event only.
  *   **Leaf 6 (Antinatalist)** and **Leaf 7 (Sterile Land)** converge on "Conversion Good" if the counterfactual is pavement; they differ only on agricultural counterfactuals.

  **Note to Seminar Leader:**
  Expect the class to stall at **Q6 (Wild Baseline)** rather than the axiological nodes (Q1, Q7). Most graduate students in this field share a utilitarian framework (Q1=Yes, Q7=Total), but they fracture on the empirical claim of whether wild animal lives are net positive or negative. This empirical disagreement masks itself as ethical disagreement; forcing them to answer Q6 explicitly will reveal that their moral divergence is actually a disagreement about predation rates, disease, and starvation in the wild.

