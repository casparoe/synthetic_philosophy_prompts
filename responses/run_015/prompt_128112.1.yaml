  I have noticed a recurring argumentative pattern in recent discussions of suffering-focused moral theories—specifically in positions that assign lexical priority to the reduction of extreme suffering over any increase in well-being, a stance often associated with negative-utilitarian frameworks that employ lexical ordering.

  The pattern unfolds in two stages. First, a proponent argues that within a single qualitative dimension of harm—say, the intensity of bodily pain—there exists a discontinuity: beyond a certain threshold, the suffering becomes so severe that no quantity of pleasure, however large, could justify allowing it. This is defended by appealing to the internal structure of that dimension, where ordinary and extreme states are qualitatively distinct. So far, this is a standard lexical claim.

  But then, without providing any inter-dimensional metric, the same proponent extends this lexical relation across qualitatively different kinds of harm. They treat extreme existential dread, or the systematic erosion of agency, as standing in the same lexical relation to ordinary well-being as extreme physical pain does—while simultaneously treating these different extreme harms as comparable to one another within a single hierarchy. In other words, they declare pleasure and suffering incommensurable along one axis, yet treat suffering-types as commensurable across axes, all under one lexical principle. I have observed this in debates about wild-animal suffering, about existential risk, and about the ethics of psychiatric intervention: in each case, the lexical boundary is drawn tightly within a domain, then quietly projected outward to govern comparisons between domains for which no shared scale has been offered.

  Is there an established term for this specific configuration—this selective deployment of lexical incommensurability that holds within a dimension but collapses across dimensions? If there is one, how precisely does it differ from a category mistake, from scope ambiguity in the term "lexical," and from the more general problem of incommensurable goods? If there is no established term, I would like a precise coinage that captures both the asymmetry (incommensurability within dimensions, commensurability across them) and its function in suffering-focused argumentation, together with clear boundary conditions that distinguish it from ordinary equivocation.

  Please answer with conceptual precision rather than bibliographic reference. At the very end, state your conclusion in a fixed, machine-readable form: \answer{[the established term, or your proposed term with a brief definitional clause]}
