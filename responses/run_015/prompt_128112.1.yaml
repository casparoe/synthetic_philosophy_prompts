answer: |-
  There is no established term in meta-ethics or value theory that precisely captures this specific configuration. While the component concepts are well-documented—*lexical priority* (the discontinuity claim), *incommensurability* (the lack of a common metric), and *value pluralism* (the existence of distinct qualitative dimensions)—the specific structural inconsistency you describe is typically subsumed under broader critiques of "lexical utilitarianism" or "negative utilitarianism" without a dedicated label. It is often treated as a vague problem of "aggregation" or "comparison" rather than a distinct formal error in the deployment of lexicality.

  To capture this configuration with the requisite precision, I propose the term **Dimensional Lexical Asymmetry**.

  ### Conceptual Precision

  **Dimensional Lexical Asymmetry** is defined as the structural inconsistency in a normative framework wherein a lexical threshold is rigorously defended *within* a single qualitative dimension (intra-dimensionally) but is implicitly projected *across* distinct qualitative dimensions (inter-dimensionally) without supplying the inter-dimensional metric required to sustain such comparability.

  The configuration consists of two asymmetric moves:
  1.  **Intra-dimensional Rigidity:** The proponent asserts a hard discontinuity between states within one dimension (e.g., mild pain vs. extreme pain), rendering them incommensurable with opposing values (e.g., pleasure). This relies on the internal phenomenology of that specific dimension.
  2.  **Inter-dimensional Fluidity:** The proponent simultaneously assumes that distinct dimensions of harm (e.g., physical pain vs. existential dread) are commensurable with *each other* under the same lexical principle, despite lacking the shared phenomenological structure that justified the first move.

  ### Distinctions from Related Concepts

  **1. Versus Category Mistake**
  A category mistake involves attributing a property to an entity that logically cannot possess it (e.g., "the number 7 is blue"). Dimensional Lexical Asymmetry is not an ontological error regarding the nature of suffering or pleasure. Rather, it is a methodological inconsistency regarding *comparison standards*. The proponent is not claiming dread *is* pain; they are claiming dread ranks *against* pleasure using the same lexical rule as pain, without justifying the transfer of that rule.

  **2. Versus Scope Ambiguity**
  Scope ambiguity implies a term (e.g., "lexical") shifts its semantic meaning mid-argument. In Dimensional Lexical Asymmetry, the definition of "lexical" remains constant (absolute priority). The error lies not in the meaning of the word, but in the *conditions of application*. The proponent applies strict evidentiary standards for the term's application within a dimension but waives those standards across dimensions.

  **3. Versus General Incommensurability**
  General incommensurability posits that certain goods or bads cannot be compared on a single scale. Dimensional Lexical Asymmetry is more specific: it is a *selective* deployment of incommensurability. It asserts incommensurability between value *polarities* (suffering vs. well-being) while asserting commensurability between value *types* (suffering vs. suffering), despite both comparisons theoretically requiring a common metric. It uses incommensurability as a shield against trade-offs but ignores it as a barrier to hierarchy-building.

  ### Boundary Conditions

  To distinguish Dimensional Lexical Asymmetry from ordinary equivocation or legitimate value monism, the following boundary conditions apply:

  *   **Absence of Bridging Premise:** The configuration exists only if the proponent fails to offer a higher-order metric (e.g., "neural disruption" or "agency loss") that genuinely unifies the distinct dimensions. If such a metric is offered, the move becomes a (potentially flawed) monistic argument, not an asymmetric projection.
  *   **Reliance on Phenomenological Discontinuity:** The intra-dimensional lexical claim must rely on the specific qualitative structure of that dimension (e.g., the "unendurability" of pain). If the lexical claim were based on a general rule applicable to all dimensions from the start, the asymmetry would not exist.
  *   **Functional Outcome:** The pattern must result in a unified hierarchy of disvalue that treats distinct harms as interchangeable for the sake of lexical priority, while maintaining they are not interchangeable with well-being.

  \answer{Dimensional Lexical Asymmetry: the unjustified projection of intra-dimensional lexical thresholds across distinct qualitative dimensions without an inter-dimensional metric}
