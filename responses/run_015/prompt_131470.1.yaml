  2.  **Deconstruct the Core Tension (Chigurh vs. Nagel):**
      *   Nagel's moral luck is about *assessment*. How do we judge someone given factors outside their control?
      *   Chigurh's coin is about *ontology/metaphysics*. He isn't asking "How will I be judged?" He is asking "What is the nature of the universe?"
      *   *Key Insight:* Chigurh isn't trying to *escape* moral luck (like a Kantian might); he is trying to *embody* it. He wants to be the agent of fate, not just a victim of it.

  3.  **Address the Specific Questions (Mental Draft):**
