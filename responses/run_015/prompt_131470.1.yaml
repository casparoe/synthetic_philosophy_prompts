      *   *Correction:* Make sure I don't just say "Chigurh is crazy." Keep it philosophical. He represents a specific metaphysical stance on causality.
      *   *Correction on Q2:* Students saying it makes him *less* blameworthy are reacting to his *claim*, not the reality. The film invites us to see his claim as delusional.
