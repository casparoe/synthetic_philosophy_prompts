  *   **Defect:** The question explicitly instructs you to "Distinguish three verdicts... that its mechanism is false; that its mechanism is real but was overridden... and that its mechanism is real but its trigger conditions were not met." You have collapsed the first option ("mechanism is false") into the others or dismissed it based on empirical claims about pre-1800 data. The task was to distinguish the logical possibilities, not to decide empirically which one obtains before finishing the distinction.
  *   **Cost:** -3 marks.
  *   **Quote:** "The charitable reading of 'right but early' must therefore be the first of these... which a contingent historical development happened to mask."
  *   **Comment:** This is a defensible philosophical position (equating "early" with "overridden"), but it relies on your previous exclusion of the "false mechanism" verdict. Because you did not distinguish how "right but early" differs from the "mechanism is false" verdict (as requested), this explanation is incomplete relative to the prompt.
  *   **Cost:** -1 mark.
  *   **Shaky:** "before the Industrial Revolution higher real wages did produce faster population growth... and the positive check bound whenever harvests failed." This empirical claim is broadly accepted in economic history (the Malthusian trap pre-1800), but stating it as uncontested fact ("not in dispute") ignores significant historiographical debate. Defensible for a second-year script, but worth noting.

  **Part (b)**
  *   **Quote:** "A theory rescued by an independently established auxiliary is thereby supported rather than emptied, and it remains falsifiable because it still predicts a definite relationship for any population that lacks the countervailing factor."
  *   **Comment:** This handles the rescue-versus-falsification question well. You appeal to the independence of the auxiliary hypothesis (Industrial Revolution) rather than mere historical chronology. This clears the rubric requirement for a "right standard".
  *   **Quote:** "What makes 'right but early' substantive is precisely that the mechanism is independently measurable: we can go and look for the wage–population relationship in pre-industrial data..."
  *   **Defect:** The question asks "State what would have to be observable, and **by whom**". You specify what (wage-population relationship) but only imply "by whom" ("economic historians" / "we"). A substantive claim about timing ("early") usually requires independent observers to verify the lag, not just proponents verifying the mechanism. This is a minor omission.
  *   **Cost:** -1 mark.
  *   **Shaky:** "A theory rescued by an independently established auxiliary is thereby supported rather than emptied." This is a strong Lakatosian claim. It is defensible, but some philosophies of science would argue it merely prevents falsification rather than adding support. Treated as defensible here.

  **Part (c)**
  *   **Quote:** "The demographic transition supports Malthus rather than refuting him, because it is the same relation with its sign reversed."
  *   **Defect:** This gets the evidence the wrong way round relative to standard interpretation. Malthus's mechanism predicts that increased income leads to increased population growth (until checked by subsistence). The demographic transition shows increased income/development leading to *decreased* fertility. Claiming this "supports" the theory because there is still a "dependence" is logically weak; a theory predicting a positive correlation is generally refuted by a stable negative correlation, not supported by it.
  *   **Cost:** -2 marks.
  *   **Quote:** "What the transition shows is only that the relation is not fixed in sign, which qualifies Malthus's arithmetic without refuting his mechanism."
  *   **Defect:** The "mechanism" in Malthus is specifically the pressure of population on resources leading to subsistence wages. If fertility falls as income rises, that specific feedback loop is broken. To say the mechanism stands but the sign flips is to change the mechanism entirely (from resource constraint to quality-quantity trade-off). This fails the rubric requirement to get the evidence the "right way round".
  *   **Cost:** -1 mark.

  **Rubric Assessment**

  1.  **Cleanly separating the different ways a long-run prediction can come apart:** **Does not clear.** The candidate explicitly reduces the requested three verdicts to two ("So the theory can be wrong in only one of two ways"), failing to distinguish the "mechanism is false" option as a logical possibility separate from the empirical evidence.
  2.  **Handling the rescue-versus-falsification question with the right standard rather than a merely historical one:** **Clears.** The candidate correctly identifies independent measurability and non-ad-hoc auxiliaries as the standard for substantiating the claim, rather than relying on historical tribute or chronology alone.
  3.  **Getting the post-1800 evidence, including the demographic transition, the right way round:** **Does not clear.** The candidate argues the demographic transition supports Malthus due to a "sign reversed" relation. Standard interpretation views the transition as a refutation of the core Malthusian prediction (subsistence trap), not a support of the mechanism with inverted signs.

  **Total Mark Calculation**
