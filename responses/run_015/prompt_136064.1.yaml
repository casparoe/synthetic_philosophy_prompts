      *   *Draft:* This institutional design presupposes that democratic legitimacy derives from stable collective coordination rather than individual judgment, while Simone Weil's critique targets the synergistic interaction of pre-selection and whipping as a mechanism that structurally excludes truth, implying her alternative requires radical decentralization to remain viable beyond the local scale.

  6.  **Developing the Reasoning:**
      *   *Theory of Judgment:* The two-layer structure (filtered candidates + whipped votes) assumes voters choose a team/program, not a deliberator. It values stability and agenda coherence over the representative's independent conscience. Legitimacy comes from the mandate to govern, not the quality of deliberation.
      *   *Weil's Critique:* Weil argues parties substitute the "party good" for the "common good." Pre-selection ensures only those loyal to the party machine enter; whipping ensures they act on that loyalty. The critique targets the *interaction* because pre-selection makes whipping effective, creating a closed circuit where external truth cannot enter. It's not just one or the other; it's the system that makes the representative a functionary rather than a thinker.
      *   *Scale/Anachronism:* Weil's "rootedness" is inherently local. Applying non-partisan association to a large federal state without parties leads to chaos or hidden oligarchies unless power is devolved. To be consistent, the state must be reorganized around subsidiarity (small units handling most issues). If kept at the current federal scale, it is anachronistic/impractical because complex coordination usually reverts to informal parties (factions). Therefore, it requires shrinking the effective political unit or adopting a confederal model.

