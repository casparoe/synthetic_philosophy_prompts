  This institutional design presupposes that legitimacy derives from stable collective coordination rather than individual deliberative judgment, whereas Simone Weil's critique targets the synergistic interaction of candidate pre-selection and vote whipping as a structural exclusion of truth that necessitates radical decentralization to remain viable beyond the local scale. The parliamentary model operates on a theory of mediated legitimacy where the voter's role is to authorize a governing team capable of executing a coherent program, implying that individual reason is too fragmented to govern without the stabilizing architecture of party discipline. This structure assumes that effective sovereignty requires the subordination of the representative's conscience to the collective strategy, transforming the legislature from a deliberative body into a ratifying machine for pre-determined platforms. Weil's analysis identifies this transformation as the moment where attention to the common good is replaced by the reflexive defense of party interest, a process enacted through the interplay of filtering and discipline. Her critique primarily indicts the interaction between pre-selection and whipping because pre-selection ensures that only those willing to subordinate their judgment enter the chamber, thereby making the whipping system effective without resistance. If either mechanism existed alone, independent judgment might survive; together, they create a closed circuit where the party's will is both the entry requirement and the operational command, effectively manufacturing the collective passion Weil condemns by eliminating the possibility of dissenting truth. Regarding scale, Weil's alternative of non-partisan association relies on "rootedness," which is inherently local and concrete, making its direct application to a modern federal state problematic without structural alteration. To extend her view consistently requires a political ontology based on subsidiarity, where power is devolved to units small enough for face-to-face deliberation and non-partisan coordination, leaving only technical administration at the federal level. Without this downsizing of political units, removing parties at the federal scale would likely result in hidden factions or gridlock, rendering the proposal anachronistic unless the state itself is reconfigured to prioritize local autonomy over central cohesion.
