answer: |-
  This is a classic ethical dilemma that touches on one of the most famous problems in moral philosophy: the **Formulation of the Maxim** within Kantian ethics.

  Your friend is arguing from a framework similar to Immanuel Kant's **Categorical Imperative** (specifically the Formula of Universal Law): *Act only according to that maxim whereby you can at the same time will that it should become a universal law.*

  You have identified a genuine philosophical vulnerability known as the **Problem of Relevant Descriptions**. However, while your objection is philosophically astute, it likely does not succeed in justifying keeping the money, for three key reasons: the empirical failure of your specific maxim, the legal reality, and alternative ethical frameworks.

  ### 1. The Philosophical Objection: Is the Test Manipulable?
  You are correct that the universalizability test can be manipulated if the agent is allowed to make the rule arbitrarily specific. If I can phrase my rule as "I may lie whenever it benefits me and I am wearing a blue shirt," I can universalize that without society collapsing.

  Philosophers call this "gaming the maxim." To prevent this, ethical theorists argue that a maxim must include **morally relevant descriptions**. The question becomes: Is "the payer is a large institution" a morally relevant distinction?

  *   **Your Argument:** The harm is negligible to a bank, so the rule is safe to universalize.
  *   **The Counter-Argument:** Moral relevance usually requires impartiality. Why does the size or wealth of the victim matter? If stealing $2,000 is wrong from an individual, why is it right from a corporation? If the rule is "Steal from those who won't miss it," and everyone follows that rule, the wealthy (or large institutions) would be systematically plundered. This would destroy the incentive to accumulate capital or provide services, eventually collapsing the economic practice just as much as stealing from individuals would.

  Furthermore, your maxim relies on an empirical claim: that the bank is "unlikely to notice or be much harmed."
  *   **Aggregation:** If *everyone* adopted your rule ("Keep bank errors over $2,000"), banks would lose millions. They would not absorb this; they would pass the cost to customers via fees or invest heavily in surveillance, making banking slower and more intrusive for everyone. Thus, even your narrow rule, if universalized, degrades the very system you rely on.

  ### 2. The Legal Reality
  While you and your friend are debating ethics, the law has already settled this matter. In almost every jurisdiction, keeping money you know was deposited by mistake is illegal.

  *   **Unjust Enrichment:** Civilly, you are not entitled to the funds. The bank has a legal right to claw them back.
  *   **Theft/Conversion:** Criminally, once you become aware of the error and decide to spend or keep the money with the intent to deprive the owner of it, it often constitutes theft.

  The law does not care if the victim is a large institution. The legal obligation to return the money exists independently of whether the "practice of accurate payment" would collapse. Your friend is right that you must return it, partly because the state mandates it.

  ### 3. Alternative Ethical Frameworks
  Even if we set aside Kant and the Law, other ethical systems agree with your friend:

  *   **Utilitarianism:** This looks at the net happiness. You gain $2,000. The bank loses $2,000 plus administrative costs to fix the error. If this becomes common, trust decreases and transaction costs rise for everyone. The net utility is likely negative.
  *   **Rights-Based Ethics:** The money belongs to the bank (or the account holder it was intended for). By keeping it, you are violating their property rights. The size of the owner does not negate their right to property.
  *   **Virtue Ethics:** What does keeping the money say about your character? It suggests opportunism and a lack of honesty. A virtuous person returns what isn't theirs, regardless of whether they can get away with keeping it.

  ### Conclusion
  Your objection shows that you understand the **mechanics** of the universalizability test very well; you have correctly identified that the outcome depends on how the rule is phrased. However, your specific phrasing ("large institution unlikely to be harmed") fails the test upon closer inspection because:
  1.  It relies on a distinction (wealth/size) that is hard to defend as morally relevant.
  2.  It relies on an empirical claim (no significant harm) that is false if the rule is actually universalized.

  **Verdict:** Your friend is right. You are morally and legally obligated to return the money. Your objection highlights a nuance in ethical theory, but it does not provide a valid justification for keeping the funds. To maintain your own integrity and comply with the law, you should report the error to the bank immediately.
