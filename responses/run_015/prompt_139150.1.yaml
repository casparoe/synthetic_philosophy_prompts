answer: |-
  The department lounge was quiet, the remnants of the colloquium scattered in empty chairs. Dr. Ruhl stirred sugar into her coffee while Dr. Amadi leaned back, watching the steam rise.

  **Ruhl:** You stayed quiet during the Q&A, but I saw you writing. I assume you're not convinced by the defense of the Principle of the Identity of Indiscernibles.

  **Amadi:** You know me too well. The principle states that no two distinct things share all their properties. If they share everything, they are one. Your speaker argued that two perfectly similar spheres in an empty universe are impossible. I think they're possible, and that their distinctness is primitive.

  **Ruhl:** But that ignores weak discernibility. We don't need unique monadic properties—like being red or being heavy—to distinguish objects. We only need an irreflexive relation.

  **Amadi:** Define that for the students who might read this transcript.

  **Ruhl:** Gladly. A relation is irreflexive if it never holds between a thing and itself. "Is one mile from" is irreflexive; nothing is one mile from itself. In the two-sphere world, sphere A is one mile from sphere B. That relation holds between them but not within them. That weak discernibility is enough to satisfy the principle. They are discerned by their relation, even if not by their intrinsic qualities.

  **Amadi:** It sounds elegant, but it's circular. To say "A is one mile from B" presupposes that A and B are already distinct relata. You're using the distinctness to ground the relation, then using the relation to ground the distinctness. If there is no primitive numerical difference—no bare "thisness" distinguishing them—the relation has nothing to latch onto.

  **Ruhl:** That's the classic objection. But let's move to the variant case I'm using in seminar. It forces the issue. At time t1, we have your two spheres, symmetric, separated, identical. At t2, an indeterministic process occurs. There is an objective chance of one-half that exactly one sphere acquires a new intrinsic property: a uniform rise in temperature.

  **Amadi:** Objective chance being a real propensity in nature, not just ignorance.

  **Ruhl:** Precisely. Now, at t1, is there a fact of the matter about which sphere will warm?

  **Amadi:** If I say no, I lose the ability to describe the transition. If I say yes, I commit to primitive identity. Let's take the "yes" option first. If there is a fact that *this* sphere will warm, then the chance function distributes over outcomes that are qualitatively identical beforehand. At t1, the universe is symmetric. Yet the chance attaches to one side of the symmetry.

  **Ruhl:** And you find that unacceptable?

  **Amadi:** It means the probability space distinguishes outcomes that are observationally and qualitatively indistinguishable. Seeing a warm sphere at t2 doesn't tell you which of the t1 spheres it is, because they were identical. So the chance is over hidden facts. But I can live with that. Why? because your account of objective chance is committed to it anyway. If chance is real, it must attach to something. If you deny primitive identity, what does the "one-half" apply to?

  **Ruhl:** It applies to the structure. But this brings me to my pressure point. If you deny there is a fact at t1 about which warms, you owe a story about the transition from t1 to t2. Did one object become two? Was there only ever one sphere that fissioned? Or was there a single symmetric structure that lost a symmetry?

  **Amadi:** I posit two distinct individuals from the start.

  **Ruhl:** But if there's no fact about which warms, then at t1, the future is open regarding the individual, not just the property. But if the individuals aren't fixed by qualitative facts, how do you count them? You say there are two. I say your weak discernibility argument fails here because the separation relation holds both before and after the change. It doesn't explain why the warming attaches to one rather than the other without invoking a primitive "this."

  **Amadi:** And you think weak discernibility solves that?

  **Ruhl:** I think it grounds the count claim. There are exactly two things because there is a relation holding between them that does not hold within them.

  **Amadi:** But can it ground singular reference? Suppose at t1 I say, "This one, and not that one, will warm." I point mentally. Can weak discernibility support that thought?

  **Ruhl:** (Pauses) I will concede that separation does not tell you which is which. It establishes that there are two, but it doesn't label them. It cannot ground a demonstrative thought that picks out one sphere exclusively prior to the warming. You cannot say "this one" based solely on an symmetric relation.

  **Amadi:** That is a significant concession. Because if you cannot refer, you cannot track identity over time. But look at my position. I posit primitive numerical difference. There are two spheres, distinct simply in number.

  **Ruhl:** And what work does that fact do?

  **Amadi:** Here is my concession: The facts I posit do no work in any explanation or prediction. They answer to no possible test. We cannot observe primitive thisness. We only observe the warming. Positing it doesn't change the physics.

  **Ruhl:** Then why posit it?

  **Amadi:** Because without it, the chance claim at t1 is unintelligible. If there is no fact about which sphere warms, then the statement "one of them will warm" lacks a subject. You need distinct subjects for the probability to distribute over. If you deny primitive identity, you must explain how a relation alone creates the subjects for that probability.

  **Ruhl:** And if you accept primitive identity, you must explain how nature distinguishes between two outcomes that are qualitatively identical. You accept brute facts about identity that have no qualitative ground.

  **Amadi:** I accept them because the alternative is denying the intelligibility of the chance setup. But let's return to your weak discernibility. You say the relation grounds the count. But if the relation is symmetric—"A is distant from B" and "B is distant from A"—how do you get the number two without already assuming two relata?

  **Ruhl:** The logic of the relation requires distinct places in the structure. But I admit, for the variant case, weak discernibility doesn't adjudicate among the transition stories. It doesn't tell us if the warming sphere is the "left" one or the "right" one, because those labels are arbitrary.

  **Amadi:** So we are stuck. I have primitive facts that are empirically idle. You have relations that cannot ground reference or explain the specific outcome of the chance process.

  **Ruhl:** It seems we need to decide what we demand from metaphysics. Do we demand that every fact be grounded in quality, or do we allow primitive numerical difference to save the intelligibility of chance?

  **Amadi:** And do we demand that relations ground identity, or admit that relations presuppose it?

  **Ruhl:** (Sips coffee) To settle the variant case, I need you to answer this: If primitive identity does no explanatory work, what justifies positing it over a ontology where only the qualitative structure exists, and the "which one" question is meaningless?

  **Amadi:** And to settle it, I need you to answer this: If weak discernibility cannot ground singular reference or track individuals through indeterministic change, how can it support the claim that there are exactly two things rather than one symmetric object undergoing a symmetry breaking?

  **Ruhl:** Fair enough.

  **Amadi:** We aren't done, then.

  **Ruhl:** Not by a long measure. But the students will have something to discuss.

  **Amadi:** Indeed. More coffee?

  **Ruhl:** Please.
