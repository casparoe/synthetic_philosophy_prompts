prompt: |-
  hi, I'm a junior and we did like one week on the Nuremberg trials in history class and now I can't stop thinking about wether it was just the winners punishing the losers. my teacher said "crimes against humanity" was basically invented for the occasion, and at Tokyo they executed people for starting a war, which feels even more made up than the Holocaust charges. so I want the spec, not the verdict: what would a theory of when it's ok to punish someone for something that wasnt illegal yet when they did it have to be able to do, for me to use it to settle the victors justice question for myself?

  give me the list of requirements with a case behind each. the cases I want it to handle: obviously the actual defendants at Nuremberg and Tokyo; but also an ordinary person who hired lawyers and carefully stayed inside every law in force at the time and then gets prosecuted after the government changes; a case where the side doing the prosecuting did the same kind of thing itself (firebombing cities, the atomic bombs) — call this the flip-it test, whatever rule lets you hang the losers should also let you hang the winners for the same acts, and I want to know if that test is a real requirement or just a sneaky way of saying nobody can ever be punished; and a case where the law was technically on the books but written so vaguely ("violates the laws of humanity", that kind of thing) that no one could of known what counted.

  also the distinctions it can't collapse: inventing a new crime vs. reinterpreting an old one, making the act illegal after the fact vs. just raising the punishment after the fact, and knowing it was morally horrible vs. being warned it was legally forbidden — does moral knowledge count as warning or is that cheating?

  for each one say why it's a requirement and which ones are really just my-side preferences instead of things the theory genuinely owes me. tell me if any two of them can't both be satisfied at once, and which single requirement knocks out the most popular answers people give to this. please dont give me a reading list or a pile of case names to look up — I don't have library or internet access for this, I just want the arguments.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Junior in high school (approx. 16-17 years old).
      *   **Context:** Studied Nuremberg Trials for one week. Troubled by the "Victor's Justice" critique (ex post facto laws, hypocrisy of victors).
      *   **Goal:** Wants a *theory* or a set of *requirements* for when it is okay to punish someone for acts that weren't clearly illegal at the time (retroactive justice).
      *   **Specific Constraints:**
          *   No reading lists or case names to look up (limited access).
          *   Focus on arguments/logic.
          *   Must handle specific test cases: Nuremberg/Tokyo defendants, Ordinary Person (strict legal compliance), Flip-It Test (victors did same thing), Vague Laws.
          *   Must maintain specific distinctions: New crime vs. reinterpretation, Ex post facto crime vs. increased punishment, Moral knowledge vs. Legal warning.
          *   Must identify which requirements are genuine vs. preference-based.
          *   Must identify incompatibilities (trade-offs).
          *   Must identify the "killer requirement" that defeats popular answers.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The tension is between *Legality* (Nullum crimen sine lege - no crime without law) and *Justice* (some acts are so evil they demand punishment regardless of technical legality).
      *   The user is asking for a framework to evaluate *Ex Post Facto* justice in the context of transitional justice (regime change/war).

  3.  **Drafting the Requirements (The "Spec"):**
      *   I need to create a list of criteria that a valid theory of retroactive punishment must meet.
      *   *Requirement 1: The "Ordinary Citizen" Constraint (Reliance Interest).* If I followed the rules, I shouldn't be punished. This protects the rule of law.
      *   *Requirement 2: The "Flip-It" Consistency (Universalizability).* If it's a crime for you, it's a crime for me. This addresses hypocrisy.
      *   *Requirement 3: The "Moral Notice" Standard (Natural Law).* Was the act so obviously wrong that a reasonable person knew it was criminal, even without a statute? This addresses the "invented crime" issue.
      *   *Requirement 4: The "Vagueness" Limit (Fair Warning).* Laws can't be so vague that anyone can be caught.
      *   *Requirement 5: The "Procedural Integrity" Check.* Was the trial fair, or just a execution squad?

  4.  **Mapping Requirements to User's Test Cases:**
      *   *Nuremberg/Tokyo:* Needs Moral Notice (Holocaust) vs. Vagueness (Aggressive War).
      *   *Ordinary Person:* Needs Reliance Interest.
      *   *Flip-It:* Needs Universalizability.
      *   *Vague Laws:* Needs Fair Warning.

  5.  **Addressing the Distinctions:**
      *   *New Crime vs. Reinterpretation:* Does the theory allow codifying existing custom?
      *   *Crime vs. Punishment:* Retroactive crime is worse than retroactive sentencing?
      *   *Moral vs. Legal:* Does knowing it's wrong count as knowing it's illegal?

  6.  **Identifying Conflicts and "Killer" Requirements:**
      *   *Conflict:* "Moral Notice" (Natural Law) often conflicts with "Strict Legality" (Positivism). If you say "murder is always illegal even if the state says it's okay," you undermine the "Ordinary Citizen" who relied on the state's law.
      *   *Killer Requirement:* The "Flip-It" (Universalizability) is usually the one that kills the "Victor's Justice" defense. If the victors aren't subject to the same rule, the rule isn't law, it's power.

  7.  **Refining the Output (Tone and Structure):**
      *   Tone: Respectful, intellectual, engaging with a smart high schooler. Avoid condescension.
      *   Structure: Follow the prompt's requested format (List of requirements, case behind each, why it's a requirement, preference vs. genuine, conflicts, killer requirement).
      *   Constraint Check: No reading lists. No "look up Hart/Fuller." Just the arguments.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Req 1: The Reliance Principle.* (Case: Ordinary Person). Why? Predictability. Genuine.
      *   *Req 2: The Universalizability Principle.* (Case: Flip-It). Why? Equality before law. Genuine.
      *   *Req 3: The Malum in Se Threshold.* (Case: Nuremberg). Why? Distinguishes evil from policy. Genuine.
      *   *Req 4: The Specificity Constraint.* (Case: Vague Laws). Why? Fair notice. Genuine.

      *   *Distinctions:* Need to explain how the theory handles "Moral vs Legal."
      *   *Conflicts:* Reliance vs. Malum in Se. (If I rely on a law that says "kill group X," but killing is inherently wrong, which wins?)
      *   *Killer:* Universalizability. It exposes the hypocrisy of Nuremberg/Tokyo regarding the victors' actions.

      *   *Self-Correction on "Preference vs. Genuine":* The user asked to identify which are just "my-side preferences."
          *   *Insight:* The "Reliance Principle" is often a preference of the defendant. The "Malum in Se" is a preference of the prosecutor. The "Universalizability" is the only one that claims to be neutral. I need to be careful here. Actually, the *strongest* argument is that "Reliance" is a genuine requirement for a Rule of Law system, not just a preference. But "Victor's Immunity" is definitely a preference.
          *   *Correction:* I should frame it as: Some requirements protect the *accused* (Reliance), some protect the *system* (Universalizability). The user wants to know which are essential for *justice* vs. which are just loopholes.

      *   *Refining the "Killer":* The prompt asks which single requirement knocks out the most popular answers. The "Flip-It" (Universalizability) is the standard critique of Nuremberg. If the theory can't handle that, it fails.

      *   *Refining the "Moral vs Legal":* This is the crux of Natural Law vs. Legal Positivism. I need to explain that without calling it that jargon-heavy way. "Knowing it was wrong" is not the same as "Knowing it was a crime." A theory must decide if Moral Knowledge substitutes for Legal Warning.

  9.  **Final Polish:** Check against all constraints.
      *   List of requirements? Yes.
      *   Case behind each? Yes.
