      *   Preference vs. Genuine? Yes.
      *   Incompatibilities? Yes.
      *   Killer requirement? Yes.
      *   No reading list? Yes.
      *   Tone check: Keep it sharp, analytical, suitable for a smart junior.

  10. **Final Review of the "Flip-It" logic:** The user asked if the Flip-It test is a real requirement or a sneaky way to say nobody can be punished. I need to address this directly. It *is* a real requirement for *law*, but if applied strictly to *war*, it might paralyze justice. I need to nuance this. The requirement is "Equal Application," not necessarily "Equal Prosecution" (which depends on power), but "Equal Standard."

      *(Self-Correction)*: Wait, if I say "Equal Standard," does that let the winners off? If the standard is "Don't bomb civilians," and both did it, then neither should be punished. This leads to the "Nobody can ever be punished" outcome the user feared. I need to explain that tension.

      *Plan:* I will structure the response as a "Specification Document" for a Theory of Retroactive Justice.

      *   **Req 1: The Reliance Shield** (Ordinary Person case).
      *   **Req 2: The Mirror Test** (Flip-It case).
      *   **Req 3: The Inherent Evil Threshold** (Nuremberg/Holocaust case).
      *   **Req 4: The Clarity Rule** (Vague Law case).

      *   **Distinctions:** How the theory handles them.
      *   **Conflicts:** Reliance vs. Inherent Evil.
      *   **Killer:** The Mirror Test.

