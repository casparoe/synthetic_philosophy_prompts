answer: |-
  Here is a specification list for a theory of retroactive justice. To settle the "victor's justice" question for yourself, your theory must pass these four stress tests. If it fails one, it is either too weak to punish monsters or too strong to allow a stable society.

  ### 1. The Reliance Shield
  *   **The Case:** The Ordinary Person. A citizen hires lawyers, checks every statute, and ensures their actions are 100% compliant with the current regime. The regime falls. The new government prosecutes them for acts that were legal yesterday.
  *   **The Requirement:** A theory must protect **reasonable reliance on existing law**. If the state told you an act was legal (or required), you cannot be punished for doing it, unless the act falls under Requirement #3.
  *   **Why it's a requirement:** Without this, law is just a trap. If the rules can change backward, you can never know how to act. This is the foundation of the "Rule of Law."
  *   **Genuine or Preference?** **Genuine.** This isn't just the defendant's preference; it is a requirement for a functioning society. If you discard this, you admit that law is just power dressed up.
  *   **The Trap:** If you make this requirement absolute, you cannot punish Nuremberg defendants, because much of what they did (deportations, property seizure) was legal under Nazi law.

  ### 2. The Mirror Test (Universalizability)
  *   **The Case:** The Flip-It. The victors firebombed Dresden or dropped atomic bombs. The losers are prosecuted for bombing cities.
  *   **The Requirement:** A theory must apply the **same standard of criminality to the prosecutor as the accused**. If the rule is "bombing civilians is a crime," it must apply to the side writing the rule, too.
  *   **Why it's a requirement:** Law claims to be universal. If a rule only binds the loser, it is not law; it is a weapon.
  *   **Genuine or Preference?** **Genuine, but dangerous.** It is genuine because hypocrisy destroys the moral authority of the court. However, you suspected this might be a "sneaky way to say nobody can be punished." You are right to worry. If the standard is "perfect hands," no nation can ever prosecute a war crime because all nations have blood on their hands.
  *   **The Trap:** If you enforce this strictly, Nuremberg collapses because the Allies also targeted civilians. If you ignore it, Nuremberg becomes "Victor's Justice."

  ### 3. The Inherent Evil Threshold (*Malum in Se*)
  *   **The Case:** The Nuremberg Defendants. They argue, "I was following the law of my country."
  *   **The Requirement:** A theory must distinguish between **acts that are illegal because a statute says so** vs. **acts that are criminal because they violate fundamental human norms**, regardless of statutes.
  *   **Why it's a requirement:** Some acts (systematic torture, genocide) are so obviously destructive to human society that "I was following orders" or "it was legal in my country" cannot be a defense. This is the only way to bypass Requirement #1 (The Reliance Shield).
  *   **Genuine or Preference?** **Genuine.** Without this, a government could legalize genocide and immunize its agents forever.
  *   **The Trap:** Who decides what is "Inherently Evil"? If the definition is too broad, it becomes a tool for political revenge. If too narrow, it lets monsters walk.

  ### 4. The Clarity Rule
  *   **The Case:** Vague Laws. A statute says "Do not violate the laws of humanity."
  *   **The Requirement:** A theory must demand **specificity**. A person must be able to look at the rule before acting and understand what is forbidden. "Laws of humanity" is too vague for a criminal statute unless paired with specific examples (like "mass murder").
  *   **Why it's a requirement:** Vague laws allow prosecutors to decide guilt after the fact based on who they dislike, not what was done.
  *   **Genuine or Preference?** **Genuine.** This protects against arbitrary power.
  *   **The Trap:** Historical laws of war were often vague. Insisting on modern precision might let historical actors off the hook unfairly.

  ---

  ### Handling Your Distinctions

  Your theory needs to explicitly state where it stands on these three splits:

  **1. Inventing a New Crime vs. Reinterpreting an Old One**
  *   **The Argument:** Nuremberg didn't invent "murder." It invented "Crimes Against Peace" (starting a war).
  *   **The Theory's Job:** It must allow **codifying existing custom**. If the world generally agreed "starting aggressive war is bad" but never wrote it down perfectly, you can punish it. But if the concept itself is brand new (e.g., "eco-crimes" in 1945), you cannot punish it retroactively.
  *   **Verdict:** Reinterpreting old norms is okay; inventing new norms is not.

  **2. Making the Act Illegal vs. Raising the Punishment**
  *   **The Argument:** Is it worse to say "This wasn't a crime, now it is" or "This was a crime, but now you get death instead of 5 years"?
  *   **The Theory's Job:** It must treat **creating the crime** as the greater evil. Changing the penalty is unfair, but changing the status of the act destroys the ability to plan your life.
  *   **Verdict:** Retroactive criminalization is fatal to the theory. Retroactive sentencing is just unfair.

  **3. Moral Knowledge vs. Legal Warning**
  *   **The Argument:** Does knowing something is *wrong* count as knowing it is *illegal*?
  *   **The Theory's Job:** This is the pivot point.
      *   **Option A (Positivism):** No. Law is what is written. Moral knowledge doesn't count. (Protects the Ordinary Person, fails the Nuremberg Defendants).
      *   **Option B (Natural Law):** Yes. If it's morally horrible, a reasonable person knows it's criminal. (Punishes Nuremberg, endangers the Ordinary Person).
  *   **Verdict:** Your theory must limit this. Moral knowledge only counts as legal warning for **Requirement #3 (Inherent Evil)** cases. For economic or regulatory crimes, you need written law.

  ---

  ### The Conflicts (Where the Theory Breaks)

  You asked if any two requirements cannot be satisfied at once. **Yes.**

  **The Conflict: The Reliance Shield vs. The Inherent Evil Threshold.**
  *   You cannot fully satisfy both.
  *   If you protect the Ordinary Person who relied on Nazi law (Reliance), you cannot punish the Nazi official who relied on Nazi law (Inherent Evil).
  *   **The Trade-off:** A working theory must say: "Reliance is protected *unless* the act shocks the conscience of mankind."
  *   **The Cost:** This creates a gray zone. Who decides what shocks the conscience? This is where "Victor's Justice" sneaks back in. The victors get to decide what "shocks the conscience."

  ### The Killer Requirement

  You asked which single requirement knocks out the most popular answers.

  **It is Requirement #2: The Mirror Test.**

  *   **Why:** Most defenses of Nuremberg rely on the idea that "The Allies were the good guys, so their violations don't count."
  *   **The Knockout:** If your theory requires the Mirror Test, you cannot justify executing Japanese generals for bombing cities while the US firebombed Tokyo.
  *   **The Result:** This forces you into one of two corners:
      1.  **Admit Victors' Justice:** Acknowledge that Nuremberg was political, not purely legal. It was necessary, but it wasn't "perfect law."
      2.  **Paralysis:** Conclude that because the victors also committed crimes, *no one* can be punished. This leads to the "nobody can ever be punished" outcome you feared.

  **How to settle your question:**
  If you want to believe Nuremberg was *just*, you have to weaken the Mirror Test. You have to argue that while the Allies bombed cities, their *overall conduct* or *intent* was different enough that they shouldn't be prosecuted, even if the specific act was the same.

  If you want to believe Nuremberg was *law*, you have to strengthen the Mirror Test. You must admit that by the strictest definition of law, it was flawed, because the law was not applied equally to the prosecutors.

  **Final Verdict for your Spec:**
  A robust theory admits that **Requirement #2 (Mirror Test)** was failed at Nuremberg, but argues that **Requirement #3 (Inherent Evil)** was so overwhelmingly met by the Holocaust that it justified bypassing **Requirement #1 (Reliance Shield)**.

  It was not "pure law." It was a transition from a state of war to a state of law. In that transition, perfect legality is impossible. The question you must answer for yourself is: *Is it better to have imperfect justice for monsters, or perfect legality that lets them go?* Your theory needs to pick a side on that trade-off.
