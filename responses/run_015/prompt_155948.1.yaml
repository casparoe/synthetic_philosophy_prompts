prompt: |-
  I sit on the heritage advisory panel of a mid-sized city. We must give written reasons for each decision, our decisions can be appealed, and our remit covers a mixed stock: street names, a school, a hospital wing, two statues on civic squares, a set of regimental plaques in a church, and a former workhouse we are turning into a museum. Reading what philosophers and historians have written about commemoration has not helped as much as I hoped, because nearly all of it argues case by case — this statue of a slave trader, that college named after an imperialist, those barracks named after a general — rather than saying what a position on such cases has to be able to do. So I want the specification before I want the verdicts.

  Set out the desiderata that any account of the ethics of commemoration in public space would have to meet to be adequate for a body in our position: what it must be able to decide, which distinctions it must be able to draw, which considerations from neighbouring areas (the theory of speech acts, the ethics of public reason under pluralism, the economics of network goods, the law of evidence) it must not contradict. Below is my draft list, with the case behind each entry. I want you to separate the genuine requirements from the prejudices of one camp, repair or discard the ones that are badly stated, add what is missing, and mark which are non-negotiable for us and which we could trade away.

  1. **Uptake profile.** A street name, a school name and a station name are things residents and pupils must utter and use daily; a statue on a roundabout can be walked past; a plaque in a museum must be sought out. Draft requirement: an account must either give different verdicts for objects with different uptake profiles or explain why that difference is morally inert. Case: renaming the street that holds a hundred households' addresses and two dozen businesses' letterheads, versus removing a figure from a square nobody crosses.

  2. **The composition of the standing stock.** Almost everyone we have ever commemorated did something we would now condemn, and we do not remove for mere mediocrity or private vice. Draft requirement: an account must not entail emptying the whole stock, or must bite the bullet and show that emptying it is correct. Case: our civic square, in which every one of the eight statues honours a man who profited from empire.

  3. **Anachronism and moral luck.** Draft requirement: the account must say whether the wrongdoing has to have been recognised as wrong at the time, and what to do with someone who scrupulously followed the norms of his own day. Case: a benefactor who endowed the city's hospitals with money made in the slave trade, in a jurisdiction where that was lawful, respectable and unremarkable.

  4. **Graded commemoration.** Draft requirement: it must distinguish "commendable on balance" from "commendable in every respect", and must permit partial, annotated or conditional commemoration rather than only keep-or-remove. Case: a street named after a campaigner for women's suffrage who was also an enthusiastic eugenicist.

  5. **Which speech act controls.** A monument is erected once and then stands for a century, during which its audience and its meaning change. Draft requirement: the account must say whether the original act of dedication or the present act of retaining it carries the weight, and how the two combine. Case: a memorial raised in 1900 as mourning for the dead of a colonial war, as against one raised two decades later explicitly as a claim about who rules the city.

  6. **Decision under historical uncertainty.** Draft requirement: the account must yield a decision when the record is contested, and must allocate the burden of proof between those who want retention and those who want removal. Case: a merchant whose fortune is disputed between slaving and ordinary trade, with the archive incomplete and two rival biographies in circulation.

  7. **Distributed burdens.** Removal and renaming impose costs on people who did no wrong: residents' addresses, businesses' branding, a charity's donor name, the affections of those who simply like the old name. Draft requirement: the account must weigh these against the expressive harm of retention and say whether they can be compensated or only regretted.

  8. **Commemoration versus testimony.** We preserve the wall where people were shot and the barracks of a camp without honouring anyone; we also possess a statue of the man who ordered it. Draft requirement: the account must mark the line between commemorating and testifying, and must say what "kept as evidence" does to an object's meaning — including what happens when an object removed from honour is quietly moved to a store rather than to a museum.

  9. **Publicity, pluralism and standing.** Draft requirement: the account must be statable as a public reason, must not rest on premises a reasonable citizen could reject, and must answer the question of who decides — an expert panel, an elected council, a referendum, the descendants of those wronged — separately from the question of what is right.

  10. **Genericity and settlement.** Draft requirement: the account must apply beyond our kind of case, and must take a view on time: whether longevity itself counts in an object's favour, whether a decision is ever final, and whether every retention should carry a review date.

  Three things I want flagged explicitly. First, any pair of desiderata you believe cannot be jointly satisfied — I suspect the pair is the demand for verdicts under empirical uncertainty with a burden-of-proof rule (6) together with the demand that an account never require a lay panel to settle contested history, but tell me if I have picked the wrong pair. Second, the single requirement that does the most work in excluding live positions. Third, any requirement that is really only a dislike of one camp's conclusions dressed up as a methodological constraint.

  Then, briefly — a small table at the end is fine, the criteria are the centrepiece, not the scoring — how four families of view fare against the list you end up with: retain-and-recontextualise; removal keyed to the gravity of the commemorated person's wrongdoing; procedural views that defer to whichever constituency is affected; and the abolitionist view that public space should not be in the business of honouring individuals at all.

  Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a heritage advisory panel in a mid-sized city.
      *   **Task:** Critique and refine a draft list of 10 desiderata for an ethical account of commemoration in public space.
      *   **Goal:** Separate genuine requirements from prejudices, repair/discards bad ones, add missing ones, and mark non-negotiable vs. tradeable.
      *   **Specific Constraints:**
          *   Write in British English.
          *   Flag incompatible pairs of desiderata.
          *   Identify the single requirement that does the most work excluding live positions.
          *   Identify requirements that are just dislikes of one camp dressed as constraints.
          *   Provide a brief table scoring four families of view against the refined list.
      *   **Context:** The panel needs written reasons, decisions are appealable, remit is mixed (names, statues, plaques, buildings), existing philosophy is too case-specific.

  2.  **Evaluate the Draft Desiderata (1-10):**

      *   *1. Uptake profile:* Crucial. A street name is coercive (you have to use it); a statue is passive. This distinguishes the *harm* of retention. **Keep/Refine.**
      *   *2. Composition of standing stock:* The "emptying the stock" problem. If we judge by current standards, almost everyone fails. We need a principle that avoids total erasure without endorsing bad acts. **Keep/Refine.**
      *   *3. Anachronism and moral luck:* The "they didn't know better" defence vs. "harm is harm". Essential for historical fairness. **Keep.**
      *   *4. Graded commemoration:* Binary keep/remove is often insufficient. Contextualisation, renaming, partial removal. **Keep.**
      *   *5. Which speech act controls:* Original intent vs. current reception. A statue means different things in 1900 and 2024. **Keep.**
      *   *6. Decision under historical uncertainty:* Burden of proof. Who proves what? Crucial for administrative viability. **Keep.**
      *   *7. Distributed burdens:* Cost of change vs. harm of status quo. Practical constraint. **Keep.**
      *   *8. Commemoration versus testimony:* Museum vs. Square. Evidence vs. Honour. **Keep.**
      *   *9. Publicity, pluralism and standing:* Public reason, legitimacy of the decider. **Keep.**
      *   *10. Genericity and settlement:* Time limits, finality. **Keep.**

  3.  **Critique and Refine (The "Repair" Phase):**

      *   *Prejudice Check:* Are any of these secretly arguing for a specific outcome (e.g., "never remove" or "always remove")?
          *   Draft 2 ("must not entail emptying the whole stock") looks suspicious. Is it a moral truth that we *must* have statues? Or is it a pragmatic constraint? It feels like a conservative bias dressed as a requirement. Better to frame it as "sustainability of the practice."
          *   Draft 9 ("must be statable as a public reason") is Rawlsian. Is that non-negotiable? For a public body, yes.
          *   Draft 4 ("permit partial...") assumes middle grounds are always possible. Sometimes they aren't.
      *   *Missing Elements:*
          *   *Agency/Subjectivity:* Who is being commemorated? (The honoured vs. the harmed).
          *   *Function of the Space:* Is it a thoroughfare, a gathering place, a site of governance?
          *   *Reparative Justice:* Does the decision contribute to repair or ongoing harm?
      *   *Non-negotiable vs. Tradeable:*
          *   Non-negotiable: Public Reason (9), Uptake/Coercion (1), Legal/Procedural fairness (6).
          *   Tradeable: Finality (10), Specific burden allocation (7).

  4.  **Address the Three Specific Flags:**

      *   *Incompatible Pair:* The user suspects (6) Uncertainty vs. Lay Panel. I need to check if there's a deeper tension. Actually, the tension is often between *Public Reason* (9) and *Specific Historical Truth* (6). Public reason requires accessible premises; historical truth often requires expert archival access. But the user's suspicion (6 + "never require lay panel to settle history") is valid. If the burden of proof requires historical expertise the panel lacks, 6 fails. Let's look for a stronger incompatibility: *Finality (10)* vs. *Changing Meaning (5)*. If meaning changes, how can a decision be final?
      *   *Single Requirement Excluding Live Positions:* Likely *Publicity/Pluralism (9)*. Many strong moral theories (utilitarian, religious, specific historical materialist) fail the "public reason" test because they rely on comprehensive doctrines not all citizens share. Or perhaps *Uptake Profile (1)*, which kills the idea that all monuments are equal. Let's go with *Public Reason (9)* as it rules out sectarian or purely expert-driven justifications.
      *   *Dislike Dressed as Constraint:* Draft 2 ("must not entail emptying the whole stock"). This presupposes the stock *should* exist. An abolitionist view (no statues) would fail this. It should be reframed as "administrative sustainability" rather than a moral imperative to keep statues.

  5.  **Develop the Refined List:**

      *   Consolidate and sharpen.
      *   Mark Non-negotiable (NN) vs. Tradeable (T).
      *   Ensure British English (e.g., "honour", "programme", "centre").

  6.  **Score the Four Families of View:**

      *   *Retain-and-recontextualise:* Good on uptake, good on testimony, struggles with gravity of harm.
      *   *Removal keyed to gravity:* Good on morality, struggles with uncertainty and distributed burdens.
      *   *Procedural/Deferral:* Good on standing, fails on giving actual reasons (the panel's job).
      *   *Abolitionist:* Fails on "emptying stock" (if kept as a constraint), good on pluralism (neutral space).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, advisory, philosophical but practical.
      *   *Structure:*
          1.  Introduction acknowledging the difficulty.
          2.  The Three Flags (Incompatibility, Exclusionary Requirement, Disguised Prejudice).
          3.  The Refined Desiderata Table/List (with NN/T markers and notes).
          4.  The Scoring Table for the Four Views.
      *   *Refining the "Emptying Stock" point:* I need to be careful here. The user wants to know if it's a prejudice. It is. A consistent abolitionist says "Yes, empty the stock." The requirement should be "Must explain the function of the stock," not "Must preserve the stock."
      *   *Refining the "Uncertainty" point:* The burden of proof is key. In administrative law, usually the status quo holds unless there's a compelling reason to change. But in ethics, harm might shift the burden.
      *   *Refining the "Public Reason" point:* This is the hardest constraint for a panel. You can't say "Because God says so" or "Because Marx says so." You need civic reasons.

  8.  **Final Review against Constraints:**
      *   British English? Yes.
      *   Three flags explicit? Yes.
      *   Table at the end? Yes.
      *   Separated genuine requirements from prejudices? Yes.
      *   Non-negotiable vs. Tradeable marked? Yes.

      *(Self-Correction during drafting)*: I initially thought about flagging (5) and (10) as incompatible. But (10) asks for a view on time, not necessarily permanence. A better incompatibility is between *Public Reason (9)* and *Specific Moral Truth (3/4)*. If the moral truth is controversial, it violates public reason. However, the user's suggestion about (6) and historical uncertainty is also strong. I will validate the user's suspicion but refine it: The incompatibility is between *requiring a definitive verdict* (6) and *acknowledging historical indeterminacy* (part of 3/6). Actually, the strongest tension is between *Public Reason* and *Comprehensive Moral Doctrines*. But for the panel's specific context, the tension between *Finality* and *Changing Meaning* is more practical. Let's stick to the user's hint about (6) but broaden it to the *epistemic burden*.
      *Wait, looking closer at the prompt:* "First, any pair of desiderata you believe cannot be jointly satisfied."
      I think the tension between **4 (Graded Commemoration)** and **9 (Publicity/Pluralism)** is significant. Graded commemoration (plaques, annotations) often satisfies no one and can be seen as "having it both ways," potentially violating the clarity required for public reason. However, the strongest is likely **2 (Stock Composition)** and **Abolitionism**. If 2 is "Must not empty stock," Abolitionism is excluded by definition. That makes 2 a "disguised prejudice."
      Let's identify the incompatibility as **5 (Speech Act)** and **10 (Settlement/Finality)**. If meaning changes over time (5), a decision can never be truly final (10).
      Let's identify the "Disguised Prejudice" as **2**.
      Let's identify the "Exclusionary Requirement" as **9 (Public Reason)**. It rules out many philosophical accounts that rely on specific metaphysical or comprehensive ethical claims.

      *Re-evaluating the "Exclusionary Requirement":* The prompt asks for the requirement that "does the most work in excluding live positions." Public Reason (9) is very strong here. It excludes utilitarian calculations that sacrifice minority dignity for majority happiness, and it excludes religious arguments. It forces a civic language.

      *Re-evaluating the "Incompatible Pair":* The user suggests (6) and the idea that lay panels shouldn't settle history. I agree this is a tension. But is there a pair *within the list*?
      How about **1 (Uptake)** and **8 (Testimony)**? If something is kept as testimony (museum), it has low uptake. If it's a street name, high uptake. This isn't incompatible, just distinct.
      How about **7 (Distributed Burdens)** and **3 (Moral Luck/Anachronism)**? If we weigh costs to residents (7), we might keep a harmful name. If we prioritise moral correction (3), we ignore costs. This is a tension, but manageable via weighting.
      Let's go with **5 (Speech Act/Time)** and **10 (Settlement/Finality)**. If the meaning of the act changes as the audience changes (5), then a decision made today cannot be binding for the future (10). You cannot have a "final" decision on a moving target.

      *Wait, one more check:* The prompt asks me to mark which are NN and which are Tradeable.
      NN: 1 (Uptake), 6 (Uncertainty/Process), 9 (Public Reason).
      Tradeable: 2 (Stock - if reframed), 4 (Graded - sometimes binary is needed), 7 (Burden - can be mitigated by funding), 10 (Finality).

      *Okay, let's write.*

      *Structure:*
      1. Introduction.
      2. The Three Flags (Incompatibility, Exclusionary, Prejudice).
      3. The Refined Desiderata (The Core).
      4. The Scoring Table.

      *Language:* British English (honour, programme, centre, organisation, etc.).

      *Refining Desideratum 2:* Instead of "Must not empty stock," make it "Must account for the function of the stock."
      *Refining Desideratum 6:* Clarify the burden of proof.
      *Refining Desideratum 9:* Emphasise "Civic Justification."

      *Let's finalize the "Incompatible Pair".*
      I will support the user's intuition on (6) but refine it. The conflict is between **6 (Decision under Uncertainty)** and **3 (Anachronism/Moral Luck)** if interpreted strictly. If we demand a verdict despite incomplete records (6), we risk violating the fairness owed to the historical subject regarding their context (3). However, the stronger logical conflict is between **5 (Changing Meaning)** and **10 (Finality)**. I will highlight this.

      *Let's finalize the "Disguised Prejudice".*
      Definitely **2**. "Must not entail emptying the whole stock" is a conservative status-quo bias. It should be "Must explain the value of the stock."

      *Let's finalize the "Exclusionary Requirement".*
      **9 (Public Reason)**. It excludes comprehensive doctrines (religious, deep utilitarian, specific Marxist frameworks) that cannot be translated into shared civic language.

      *Okay, ready to draft.*
answer: |-
  This is a formidable brief. You are correct that much of the literature is too particularistic; it offers verdicts on Rhodes or Churchill without offering a grammar for deciding on the school in Croydon or the plaque in Cheltenham. A panel requires a *procedure* that yields *justifications*, not just a moral theory that yields *truths*.

  Below, I address your three specific flags, then present the refined specification of desiderata, and finally score the four families of view.

  ### The Three Flags

  **1. The Incompatible Pair**
  You suspect a tension between **6 (Decision under Uncertainty)** and the constraint that a lay panel should not settle contested history. I believe the deeper incompatibility lies between **5 (Which Speech Act Controls)** and **10 (Genericity and Settlement)**.
  *   **The Conflict:** Desideratum 5 acknowledges that a monument's meaning shifts as the audience and political context change (the 'reception' theory of commemoration). Desideratum 10 asks for a view on whether a decision is final. If meaning is inherently unstable and diachronic (5), a decision cannot be logically final (10). To declare a case 'closed' implies the meaning is fixed; to acknowledge the meaning changes implies the case is always potentially reopenable.
  *   **Resolution:** You must treat 'settlement' as *procedural* finality (no further appeals within a set period) rather than *moral* finality. The decision stands until new evidence or a material change in civic values triggers a review clause.

  **2. The Single Exclusionary Requirement**
  **9 (Publicity, Pluralism and Standing)** does the most work in excluding live philosophical positions.
  *   **Why:** Many robust ethical accounts of commemoration rely on 'comprehensive doctrines' (e.g., specific religious views on idolatry, deep utilitarian calculations of aggregate happiness, or strong Marxist critiques of property). A public body in a pluralist society cannot rest a binding decision on premises a reasonable citizen could reject. This requirement excludes any account that cannot translate its moral claims into the language of civic harm, dignity, or shared history. It forces you to abandon 'the truth' in favour of 'public reason'.

  **3. The Disguised Prejudice**
  **2 (The Composition of the Standing Stock)** is currently drafted as a conservative bias dressed as a methodological constraint.
  *   **The Issue:** The draft requirement ("must not entail emptying the whole stock") presupposes that a stock of honorifics *ought* to exist. An abolitionist view (that public space should not honour individuals) would fail this test by definition, not because it is logically incoherent, but because it contradicts your premise.
  *   **The Repair:** Reframe this as **Sustainability of Practice**. The account must explain what function the stock serves (e.g., civic education, identity formation) and whether that function is sustainable given the ethical costs. It should not presuppose the stock must remain populated, only that the *decision* to populate or empty it must be justified by the function.

  ***

  ### The Refined Desiderata

  I have separated these into **Non-Negotiable (NN)** constraints (derived from your legal remit and democratic role) and **Tradeable (T)** considerations (where you have discretion on weighting). I have also repaired the drafting to remove the prejudices identified above.

  | # | Desideratum | Status | Notes on Repair & Application |
  | :--- | :--- | :--- | :--- |
  | **1** | **Coercion and Uptake** | **NN** | *Repair:* Focus on the *compulsion* to engage. A street name forces residents to 'speak' the honour daily; a statue allows avoidance. The ethical bar for retention must rise with the level of coercive uptake. |
  | **2** | **Sustainability of Practice** | **T** | *Repair:* Removed the ban on 'emptying the stock'. The account must justify the *function* of commemoration. If the function (e.g., civic unity) is undermined by the content, emptying the stock is a valid outcome. |
  | **3** | **Historical Fairness** | **NN** | *Repair:* Must distinguish between *moral blindness* (could not know better) and *moral negligence* (chose not to know). It must also address 'moral luck': does the survival of their reputation depend on obscured harms? |
  | **4** | **Granularity of Response** | **T** | *Repair:* Must allow for more than binary keep/remove. Options include: contextual plaques, relocation to museum, renaming of building but retention of archive, or 'counter-monuments'. |
  | **5** | **Diachronic Meaning** | **NN** | *Repair:* Must weigh original intent against current reception. A monument intended as mourning may function today as triumphalism. The *current* public meaning carries more weight than the *original* dedication for a public body. |
  | **6** | **Epistemic Burden** | **NN** | *Repair:* Must allocate the burden of proof. Recommendation: The presumption lies with retention *unless* significant, evidenced harm to civic dignity is shown. The panel is not a court of history; it adjudicates on the *balance of probability* regarding public impact, not historical guilt beyond reasonable doubt. |
  | **7** | **Transition Costs** | **T** | *Repair:* Must acknowledge material costs (reprinting, legal changes) but forbid them from being a *veto* against ethical necessity. Costs can be mitigated (phased renaming); dignity harms often cannot. |
  | **8** | **Honour vs. Evidence** | **NN** | *Repair:* Must distinguish between *honouring* (presenting as exemplary) and *testifying* (presenting as fact). Moving an object to a museum changes its speech act from 'honour' to 'evidence'. This is a valid ethical mitigation. |
  | **9** | **Civic Justification** | **NN** | *Repair:* Reasons must be statable in public reason. You cannot cite sectarian religious views or contested comprehensive moral theories. Justifications must appeal to shared civic values (equality, dignity, truthfulness). |
  | **10** | **Review and Finality** | **T** | *Repair:* Decisions should be procedurally final but substantively reviewable. A 'sunset clause' (e.g., review in 10 years) acknowledges Desideratum 5 (meaning changes) without creating administrative chaos. |

  ***

  ### Scoring the Four Families of View

  Here is how four common approaches fare against the refined specification. Note that 'Pass' means the view can satisfy the desideratum without contradiction; 'Fail' means it violates a Non-Negotiable or collapses under the weight of the Tradeables.

  | View | 1. Coercion | 2. Sustainability | 3. Fairness | 4. Granularity | 5. Meaning | 6. Burden | 7. Costs | 8. Honour/Evidence | 9. Public Reason | 10. Finality | **Verdict** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Retain & Recontextualise** | Pass | Pass | **Fail** | Pass | Pass | Pass | Pass | Pass | Pass | Pass | **Weak.** Often fails on Historical Fairness (3); adding a plaque to a slave trader often feels like a 'both sides' compromise that violates the dignity constraint. |
  | **Removal (Gravity Keyed)** | Pass | Pass | Pass | **Fail** | Pass | **Fail** | **Fail** | Pass | Pass | Pass | **Mixed.** Struggles with Granularity (4) (it is often binary) and Epistemic Burden (6) (requires historical certainty the panel lacks). High Transition Costs (7). |
  | **Procedural (Deferral)** | Pass | Pass | Pass | Pass | Pass | Pass | Pass | Pass | **Fail** | Pass | **Fail.** Fails Public Reason (9). Saying "we did what the community wanted" is not an ethical justification; it is an abdication of the panel's remit to give *reasons*. |
  | **Abolitionist (No Honours)** | Pass | Pass | Pass | Pass | Pass | Pass | Pass | Pass | Pass | Pass | **Strong.** Meets all NN criteria. Fails only on the Tradeable (2) if one insists the stock *must* exist. Best fit for avoiding future controversy. |

  ### Advisory Note

  Your draft list was strong, but it leaned towards preserving the *status quo* (specifically items 2 and 7). By shifting the burden of proof in **6** (requiring evidence of harm to shift the presumption of retention) and tightening **9** (demanding civic rather than populist reasons), you protect the panel from accusations of both 'woke erasure' and 'colonial apologia'.

  The **Abolitionist** view scores highest because it sidesteps the epistemic problems of judging the dead (3 & 6) and the semantic drift of statues (5). However, for a mid-sized city with existing assets, **Retain-and-Recontextualise** is the most practical, provided you enforce a strict test on **8 (Honour vs. Evidence)**: if a figure cannot be contextualised without undermining current civic values, they must move from the square to the store.
