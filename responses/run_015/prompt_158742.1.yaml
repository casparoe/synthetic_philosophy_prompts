answer: |-
  **Logical Space & Positioning**
  The questions partition views along three axes: (1) **Single-Case Truth** (Does a probability attach to unique events?), (2) **Source** (Is the number in the world, the mind, or the long-run?), and (3) **Determinism** (Do probabilities survive fixed physics?). This yields six occupied regions:

  1.  **No Single-Case + Actual Frequency:** Actual-Sequence Frequentism.
  2.  **No Single-Case + Hypothetical Frequency:** Hypothetical-Limit Frequentism.
  3.  **Yes Single-Case + Mind-Dependent + Disagreement OK:** Subjective Bayesian (Operationalism merges here; scoring rules enforce coherence).
  4.  **Yes Single-Case + Mind-Dependent + Disagreement Bad:** Objective Bayesian/MaxEnt.
  5.  **Yes Single-Case + Mind-Independent + Determinism Bad:** Single-Case Propensity.
  6.  **Yes Single-Case + Mind-Independent + Determinism OK:** Best-System Chance.

  **Empty Combinations**
  *   **Single-Case No + Disagreement OK:** Incoherent. If no fact exists for the single case, experts aren't disagreeing about truth, implying subjectivism (which affirms single-case belief).
  *   **Single-Case Yes + Source Frequency:** Contradictory. Frequencies require classes; asserting them for a unique non-repeatable case collapses into propensity or belief.

  **The Decision Tree**

  1.  **[Case 3: Bent Coin]** One flip, then melted. Is "probability of heads" a meaningful claim about *this* specific coin?
      *   **No** → Go to 2.
      *   **Yes** → Go to 3.

  2.  **[Case 1: Calibration]** Model scores 0.7. Is this accurate because 70% of *past* cases matched, or 70% of *hypothetical future* cases would?
      *   **Past** → **Actual-Sequence Frequentism**
      *   **Hypothetical** → **Hypothetical-Limit Frequentism**

  3.  **[Case 5: Bill]** Two experts say 0.3 and 0.6. Can both be rational?
      *   **Yes** → Go to 4.
      *   **No** → Go to 5.

  4.  **[Case 2: Covered Coin]** Landed 5 mins ago, covered. Is probability still 0.5?
      *   **Yes** → **Subjective Bayesian** (Operationalism)
      *   **No** (It's 0 or 1) → **Single-Case Propensity**

  5.  **[Case 4: Gas]** If physics is deterministic, do probabilities vanish?
      *   **Yes** → **Logical/Classical** (or Propensity)
      *   **No** → **Best-System Chance** (or Objective Bayesian)

  **Indistinguishable Leaves**
  *   **Propensity vs. Best-System:** These collapse on almost every concrete case. Both assert single-case chances. They only separate on Case 4 if specified as *deterministic*. Propensity says "No chance in determinism"; Best-System says "Chance is the best summary pattern." If your group assumes indeterminism, you cannot separate them.
  *   **Objective Bayesian vs. Best-System:** Both deny rational disagreement. Best-System grounds this in world-patterns; Objective Bayesian in logic/info. Hard to separate without metaphysics.

  **Utility Note**
  *   **Most Work:** Question 1 (Case 3). It immediately kills frequentism for single cases, the biggest fault line in applied stats. Most applied folks say "Yes" here without realizing it forbids strict frequentism.
  *   **Cuttable:** Question 5 (Case 4). Unless your group cares about quantum mechanics vs. classical stat mech, the Determinism question is theoretical garnish. The Bill/Coin questions capture the practical divergence better.
