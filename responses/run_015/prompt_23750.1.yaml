      *   *Indeterminacy:* Apply to translation. Two manuals fit all behavior. Quine's behaviorism: Meaning *is* behavioral dispositions. If behavior is exhausted, meaning is exhausted. No "mental museum" of meanings. Therefore, no fact of the matter.
