      *   *Indeterminacy (Quine):* Translation/Meaning. Manual $M1$ and Manual $M2$ are compatible with all behavioral evidence. Unlike science, there is no "fact of the matter" beyond behavior. Meaning *is* behavioral disposition. If behavior doesn't distinguish them, meaning doesn't exist to distinguish them. It's ontological.
