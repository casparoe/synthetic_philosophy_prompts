      *   **The Objection:** Critics say it only shows *epistemic underdetermination* (we can't know the meaning) rather than *ontological indeterminacy* (there is no fact of the matter).
      *   **Task 1:** Explain the conceptual distinction between Indeterminacy of Translation and Underdetermination of Theory by Evidence (Duhem-Quine thesis).
      *   **Task 2:** Explain why Quine intends to establish the former, not the latter.
      *   **Task 3:** Address why indeterminacy is a *global* feature of the translation manual, not a *local* ambiguity about "gavagai."
      *   **Task 4:** Explain how this global nature bears on the force of the objection.

  2.  **Initial Conceptual Mapping:**
