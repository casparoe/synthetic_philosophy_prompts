answer: |-
  # Thesis Proposal: Fragile Consensus? Heterogeneous Reasoning and the Stability of Information Cascades

  **Program:** Master's in Philosophy and Economics
  **Projected Word Count:** 12,000 words
  **Duration:** 9 Months

  ---

  ## 1. Introduction and Research Question

  ### 1.1 The Problem
  The canonical model of sequential information cascades provides a powerful explanation for social phenomena ranging from bank runs to academic fads. In the standard setup, agents act in sequence, observing the actions of predecessors and receiving a private signal about the state of the world. Rational agents infer the private signals of predecessors from their actions. The well-known result is that cascades form quickly: after a short run of identical actions, the public history becomes so overwhelming that private signals are ignored. The standard folklore derived from this model is that while cascades are easy to start and likely to be wrong, they are fundamentally *fragile*. A small amount of new public information, or a slight perturbation in the sequence, is sufficient to shatter the consensus and restart information aggregation.

  However, this fragility result relies on a strong epistemic assumption: Common Knowledge of Rationality (CKR). Every agent knows that every other agent is a Bayesian updater who understands that predecessors might be copying rather than signaling. Empirical observation suggests this is rarely the case. In real-world herding, agents often treat observed behavior as independent evidence. They see ten people running on a bank and interpret this as ten independent reasons to run, rather than one reason echoed nine times. This is a specific form of naivete: *correlation neglect* or *double-counting*.

  If a population contains a mix of "Sophisticates" (who update correctly) and "Naives" (who double-count), the dynamics of the cascade change. Naives become increasingly confident the longer a run continues, potentially anchoring the cascade against shocks that would normally break it. Furthermore, if Sophisticates are unsure about the proportion of Naives in the population, their own updating becomes hesitant, potentially altering the threshold for cascade formation.

  ### 1.2 The Research Question
  This thesis asks: **To what extent does the introduction of 'naive' agents (who treat observed actions as independent signals) stabilize incorrect information cascades against public interventions, and does second-order uncertainty regarding agent types restore the fragility predicted by the canonical model?**

  This question breaks down into three determinate sub-questions:
  1.  **Stability:** Does a mixed population require a larger public signal to break a wrong cascade than a homogeneous rational population?
  2.  **Mechanism:** Is the increased stability driven by the Naives' inertia, or by the Sophisticates' uncertainty about the Naives' presence?
  3.  **Explanatory Adequacy:** If explaining real-world herding requires modeling agents as more epistemically sophisticated (to account for the mix) than the phenomenon suggests they are, does the model lose its explanatory value?

  ### 1.3 Thesis Structure
  The final 12,000-word thesis will be structured as follows:
  *   **Introduction (1,500 words):** Motivation, the fragility puzzle, and the role of CKR.
  *   **The Canonical Baseline (2,000 words):** Formal reconstruction of the standard sequential herding model and its fragility results.
  *   **The Heterogeneous Model (3,000 words):** Introduction of Naive agents, formalization of the double-counting updating rule, and derivation of equilibrium conditions.
  *   **Simulation and Results (3,000 words):** Computational analysis of cascade stability under varying mixes and public signal strengths.
  *   **Second-Order Uncertainty (1,500 words):** Analysis of the case where Sophisticates hold a prior over the population mix.
  *   **Philosophical Implications (1,000 words):** The explanatory status of the model and the idealization of rationality.
  *   **Conclusion (1,000 words):** Summary of findings and policy implications.

  ---

  ## 2. Literature and Gap Analysis

  ### 2.1 The Standard Setup
  The existing literature on information cascades establishes that when agents are rational and this rationality is common knowledge, information aggregation stops prematurely. Once a cascade begins, the public belief becomes "sticky" in terms of actions, but "fragile" in terms of underlying confidence. A public signal that contradicts the cascade typically reverses the herd because the rational agents know the previous actions were based on limited information.

  The gap lies in the treatment of the *interpretation* of public history. The standard model assumes that the only friction is the *quality* of private signals (parameter $q$). It assumes no friction in *processing* the social data. Agents perfectly deconvolve the actions of predecessors to recover the underlying signals. This assumes a level of cognitive sophistication that is arguably higher than the cognitive limitations that cause the herding in the first place.

  ### 2.2 Why Existing Models Do Not Settle This
  There are two primary ways the literature has attempted to address deviations from the canonical model, neither of which captures the specific mechanism proposed here.

  First, some models introduce "noise traders" or agents who act randomly. This creates friction, but it does not capture the *directional* bias of double-counting. A noise trader might break a cascade by acting randomly; a naive double-counter reinforces the cascade systematically. The stability properties of these two deviations are opposites.

  Second, other models introduce "conformity preferences," where agents gain utility from matching the group. This changes the *payoff structure*, not the *epistemic updating*. In a conformity model, an agent might know the herd is wrong but join anyway. In the proposed model, the agent joins because they genuinely believe the herd is right, based on a systematic calculation error. This distinction is crucial for policy. If the problem is conformity, you change incentives. If the problem is double-counting, you change information disclosure.

  The specific gap this thesis addresses is the *epistemic* consequence of correlation neglect within a sequential learning framework. While correlation neglect is well-documented in psychology and behavioral finance, its integration into the formal sequential herding model to test the *fragility* claim is underexplored. Most behavioral herding models focus on the *onset* of herding (how fast it starts). This thesis focuses on the *persistence* of herding (how hard it is to stop).

  ### 2.3 The Second-Order Uncertainty Wrinkle
  A further gap exists regarding the knowledge of the population structure. In standard heterogeneous agent models, the types are often common knowledge. However, if Sophisticates do not know the proportion of Naives, they face a signal extraction problem not just about the state of the world, but about the *type* of the predecessor. A long run of actions could mean "The state is strongly X" (many Sophisticates with strong signals) or "There are many Naives echoing one signal."

  This uncertainty acts as a dampener on the Sophisticates' confidence. It is unclear *a priori* whether this dampener makes the cascade more fragile (because Sophisticates hesitate to join) or more stable (because Sophisticates hesitate to deviate, fearing the Naives will overwhelm them). This thesis will treat this as a secondary but integral section, contingent on the primary model holding.

  ---

  ## 3. Methodological Justification

  ### 3.1 Why Model Naivete as Double-Counting?
  The core modeling choice is to define "Naive" agents as those who update their beliefs by treating every observed action as an independent private signal with accuracy $q$.

  **Alternative 1: Lowering Signal Accuracy ($q$).**
  One might argue that naivete is observationally equivalent to simply having noisier private signals. If an agent is easily swayed, just lower their $q$.
  *Refutation:* This is mathematically distinct. A Sophisticate with low $q$ updates *slowly*. Their log-odds belief grows linearly with the number of signals, but with a small slope. A Naive agent updates *rapidly*. Because they treat $N$ actions as $N$ independent signals, their confidence grows as if they have received $N$ fresh data points. In a cascade, the Naive's belief converges to certainty much faster than a low-$q$ Sophisticate. This difference in the *rate* of convergence is the key to the stability argument. A cascade of Naives is a wall of high confidence; a cascade of low-$q$ Sophisticates is a crowd of hesitant followers. Public information interacts differently with these two states.

  **Alternative 2: Conformity Preferences.**
  As noted above, adding a utility term for matching changes the game from an information aggregation problem to a coordination game. While realistic, it muddies the water regarding the *informational* role of cascades. The thesis aims to preserve the informational interpretation (agents want to be right) to isolate the cognitive error.

  **Alternative 3: Pure Lab Experiment.**
  Running a laboratory experiment where humans play the sequential game is a valid alternative. However, for a 9-month Master's with a computational component, a simulation offers two advantages. First, it allows for the isolation of the *mechanism*. In a lab, you cannot be sure subjects are double-counting; they might be conforming, or bored, or confused. In a simulation, double-counting is hard-coded. Second, the simulation allows for counterfactual policy testing (e.g., "What if we release a public signal at step 50?") which is costly and difficult to control in a human subject pool. The proposal includes a plan to validate the simulation against known theoretical benchmarks to ensure it is not merely a "black box."

  ### 3.2 The Simulation Component
  The simulation will not be a "fishing expedition." It must serve the conceptual argument. The computational task is to simulate $10,000$ runs of the sequential game for varying population mixes (0% to 50% Naives) and measure two dependent variables:
  1.  **Cascade Durability:** The magnitude of a public counter-signal required to reverse a wrong cascade.
  2.  **Welfare Loss:** The expected number of agents choosing the wrong action before the cascade is broken.

  The simulation must demonstrate that the relationship between the % of Naives and Cascade Durability is non-linear. If it is linear, the result is trivial. The hypothesis is that a small fraction of Naives (e.g., 10%) creates a disproportionate increase in durability because they anchor the early history, forcing Sophisticates to update more cautiously.

  ---

  ## 4. Risk Assessment: The Observational Equivalence Check

  ### 4.1 The Primary Risk
  The single greatest risk to this thesis is that "Naive Double-Counting" is observationally equivalent to "Sophisticated Updating with Lower $q$." If the behavioral output of a Naive agent can be perfectly mimicked by a Sophisticate with a different signal parameter, then the "Naive" label is merely semantic, and the thesis collapses into a trivial sensitivity analysis of $q$.

  ### 4.2 The Month 2 "Kill Switch"
  To mitigate this, the first substantive task of the thesis (Month 2) is a formal test of observational equivalence. This will not wait for the full simulation.

  **The Test:**
  We compare the posterior belief of a Naive agent ($P_N$) versus a Sophisticate with adjusted signal quality ($P_S$) after observing a history of $k$ identical actions.
  *   For the Naive, the history looks like $k$ independent signals. The likelihood ratio grows as $(q / (1-q))^k$.
  *   For the Sophisticate, the history is a cascade. After the first few actions, the marginal informational content of each new action drops to near zero (because the predecessor was likely copying). The likelihood ratio grows slowly and plateaus.

  **Criterion for Success:**
  If the slope of the log-odds belief for the Naive is strictly greater than the maximum possible slope for any Sophisticate (even with $q=1$) during the cascade phase, then they are *not* observationally equivalent.
  *   *Reasoning:* A Sophisticate knows that once a cascade starts, new actions convey almost no new information. Their belief should barely move. A Naive thinks every new action is a fresh signal. Their belief should skyrocket.
  *   *Decision Rule:* If the simulation shows that Naive belief growth during a cascade is distinguishable from Sophisticate belief growth (specifically, if Naives continue to gain confidence while Sophisticates plateau), the thesis proceeds. If Naives plateau because they run into logical bounds (probability 1) at the same rate as Sophisticates, the distinction is void, and the project must pivot to a different form of bounded rationality.

  This check will be conducted analytically and via a minimal code script in Month 2. If it fails, the proposal allows for a pivot to "Conformity Preferences" (Alternative 2 above), though this changes the philosophical payoff.

  ---

  ## 5. Month-by-Month Work Plan

  ### Month 1: Formalization and Baseline Replication
  *   **Goal:** Re-derive the standard cascade model results from scratch to ensure understanding and set up the coding environment.
  *   **Deliverable:** A working Python/Julia script that replicates the standard fragility result (i.e., shows that a small public signal breaks a rational cascade).
  *   **Writing:** Draft the "Canonical Baseline" section (2,000 words).

  ### Month 2: The Observational Equivalence Check (Critical Path)
  *   **Goal:** Run the "Kill Switch" test described in Section 4.2.
  *   **Deliverable:** A memo confirming that Naive updating produces distinct belief trajectories from Sophisticate updating during a cascade.
  *   **Contingency:** If the test fails, pivot to modeling Conformity Preferences. This would require rewriting Section 3.1 but keeps the structure intact.
  *   **Writing:** Draft the "Methodological Justification" section.

  ### Month 3: Building the Heterogeneous Model
  *   **Goal:** Code the mixed population. Implement the Naive updating rule (treating history as independent signals) and the Sophisticate rule (Bayesian inference on types).
  *   **Deliverable:** Simulation code that allows varying the proportion of Naives ($\lambda$).
  *   **Writing:** Draft the "Heterogeneous Model" section, focusing on the formal definition of the Naive updating function.

  ### Month 4: Baseline Simulation Results
  *   **Goal:** Run the primary simulations. Measure cascade duration and error rates for $\lambda \in [0, 0.5]$.
  *   **Deliverable:** Graphs showing the relationship between $\lambda$ and Cascade Durability.
  *   **Writing:** Draft the first half of "Simulation and Results."

  ### Month 5: Policy Interventions and Public Signals
  *   **Goal:** Introduce the public signal intervention. Test at what strength the cascade breaks for different $\lambda$.
  *   **Hypothesis:** Higher $\lambda$ requires exponentially stronger public signals.
  *   **Deliverable:** "Breakpoint" curves.
  *   **Writing:** Draft the second half of "Simulation and Results."

  ### Month 6: Second-Order Uncertainty
  *   **Goal:** Modify the Sophisticate agent to hold a prior distribution over $\lambda$ rather than knowing it.
  *   **Deliverable:** Comparison of results between Known-$\lambda$ and Unknown-$\lambda$.
  *   **Decision:** If this adds too much complexity with little change in results, it will be condensed into a subsection. If it restores fragility, it becomes a core chapter.
  *   **Writing:** Draft the "Second-Order Uncertainty" section.

  ### Month 7: Philosophical Analysis
  *   **Goal:** Connect the modeling results to the philosophy of economics literature on explanation and idealization.
  *   **Focus:** The tension between assuming sophisticated agents to explain "irrational" phenomena.
  *   **Writing:** Draft the "Philosophical Implications" section.

  ### Month 8: Full Draft Assembly
  *   **Goal:** Combine all sections into a single 12,000-word document.
  *   **Task:** Ensure flow between the technical simulation results and the philosophical discussion. The transition must be smooth: "Because the model shows X, we must conclude Y about explanation."
  *   **Writing:** Introduction and Conclusion.

  ### Month 9: Revision and Polishing
  *   **Goal:** Refine arguments, check word count, format citations.
  *   **Task:** Verify that the "non-result" risks are honestly portrayed in the conclusion if the data is ambiguous.
  *   **Deliverable:** Final Thesis.

  ---

  ## 6. Defining Success and Failure

  ### 6.1 A Good Outcome
  A successful thesis demonstrates that:
  1.  **Distinctness:** Naive double-counting is behaviorally distinct from low-signal Sophistication (Month 2 check passes).
  2.  **Stability:** The presence of Naives significantly increases the cost of breaking a wrong cascade (e.g., requires a public signal 3x stronger than in the rational benchmark).
  3.  **Nuance:** Second-order uncertainty either mitigates this stability (restoring some fragility) or exacerbates it (Sophisticates become too scared to act against the herd).
  4.  **Philosophical Payoff:** The analysis clarifies that using rational models to explain irrational herding is not just a "simplification," but potentially a *misdiagnosis* of the mechanism. If the model shows that herding persists *because* people aren't doing the math the model assumes they do, then the model's policy advice (release public info) is flawed.

  ### 6.2 The Non-Result Scenario
  The thesis faces a critical failure if:
  1.  **Equivalence:** The Naive agents behave identically to Sophisticates with $q < 0.55$. In this case, the "Naive" label adds no explanatory power. The Month 2 check is designed to catch this.
  2.  **No Stability Effect:** The simulation shows that even with 50% Naives, a small public signal still breaks the cascade. This would imply that the "fragility" result is robust to cognitive error, which is a valid but less interesting finding.
  3.  **Computational Intractability:** The Second-Order Uncertainty model becomes too complex to solve or simulate within the timeframe.
      *   *Mitigation:* If this happens, the Second-Order section is cut, and the word count is redistributed to the Philosophical Implications, focusing on the Known-$\lambda$ case.

  ### 6.3 Handling Ambiguity
  If the results are mixed (e.g., Naives stabilize cascades only when they are the majority, not when they are a minority), the thesis will argue that this threshold effect is itself a policy-relevant finding. It suggests that interventions need to be targeted at the *composition* of the market, not just the information flow. A "non-result" in terms of a clean linear relationship is still a result in terms of complexity. The only true non-result is observational equivalence.

  ---

  ## 7. Philosophical Implications: Explanatory Adequacy

  *Note: This section outlines the argument for the philosophical chapter.*

  The standard defense of the rational herding model is that it is an "as-if" model. It does not matter if agents are actually doing Bayesian calculus; if their behavior mimics it, the model explains the outcome. However, this thesis challenges that defense.

  If the fragility of cascades depends on agents *actually* understanding the cascade structure (i.e., knowing that predecessors are copying), but the phenomenon we are explaining (e.g., a financial bubble) is characterized by agents *failing* to understand that structure, then the model is explaining the phenomenon using a mechanism that is absent in the phenomenon.

  This creates a tension:
  1.  **The Rational Explanation:** "The bubble burst because agents received a public signal and updated rationally."
  2.  **The Behavioral Reality:** "The bubble burst because the Naives ran out of money, or the Sophisticates realized the Naives were in charge."

  If the simulation shows that Naives make the bubble *more* stable, then the Rational Model's prediction (that bubbles are fragile) is false in the real world. This implies that the Rational Model is not just an idealization; it is a *misleading* idealization. It predicts fragility where there is stability.

  The thesis will argue that in contexts where the *interpretation* of social data is the key driver (like fads or runs), assuming Common Knowledge of Rationality is not a harmless simplification. It removes the very friction that generates the persistence of the phenomenon. Therefore, the explanatory value of the canonical model is limited to "edge cases" where the population is highly sophisticated. For most sociological and economic phenomena, a heterogeneous model is required not for precision, but for qualitative correctness.

  This moves the discussion from "Is the model true?" to "Does the model preserve the causal structure of the phenomenon?" If the causal structure of a fad is "people double-count," a model that assumes "people de-convolve" fails to explain the fad, even if it predicts a fad occurs.

