  ## Appendix: Technical Specifications for Simulation

  *To ensure the simulation is robust and not a "black box," the following specifications will be adhered to:*

  1.  **State Space:** Binary state of the world $\omega \in \{0, 1\}$. Prior $P(\omega=1) = 0.5$.
  2.  **Signals:** Private signal $s_i \in \{0, 1\}$ with accuracy $q = 0.6$ (baseline).
  3.  **Agent Types:**
      *   **Sophisticate:** Computes $P(\omega | history, type\_mix)$. Understands that predecessors' actions are functions of their signals and types.
      *   **Naive:** Computes $P(\omega | history)$ assuming all actions in history are independent signals with accuracy $q$.
  4.  **Decision Rule:** Choose action $a_i = 1$ if $P(\omega=1 | info) > 0.5$.
  5.  **Intervention:** At step $t=20$ (post-cascade), a public signal $S_{pub}$ is released with accuracy $Q_{pub} \in [0.5, 0.9]$.
  6.  **Metric:** "Break Probability" = Frequency with which the cascade reverses direction after $S_{pub}$.
  7.  **Iterations:** 10,000 runs per parameter set to ensure statistical significance of the "Break Probability."

  *This specification ensures that the simulation is replicable and directly tests the fragility hypothesis.*

