answer: |-
  "You're actually packing it."

  "It belongs in the box, Elena. Along with the lesson plans and the grade books. He's gone."

  "He spent six years writing this. You treat it like trash."

  "I treat it like unfinished business. Look at the last page. 'To be continued.' He died mid-sentence. Publishing it is a eulogy, not a contribution."

  "It's a correction. You're looking at the pagination; I'm looking at the argument. He's trying to say that the mill accident wasn't a puzzle with one missing piece. It was a picture everyone was trying to force into the wrong frame."

  "The union said production quotas forced the guard removal. The company said operator error. The coroner said negligence. Grandfather spent thirty years trying to say they were all right. That's not wisdom, El. That's cowardice."

  "State it properly, Mark. Don't reduce him to a pacifist platitude. His point wasn't that everyone was right. It was that 'truth' depends on where you're standing. From the standpoint of the worker, the pressure was real. From the standpoint of the owner, the protocol was clear. To say 'negligence occurred' is true, but only partially. To say 'it was inevitable' is true, but only partially."

  "So nothing is ever true. It's all just perspective. That's relativism with better manners."

  "No. Relativism says there is no truth. He's saying truth is too big for one statement. Think about your job. You take depositions. You compress months of chaos into a finding of fact. 'The defendant liable.' 'The plaintiff damages.' You have to cut the world in half to get a verdict. Guilty or not. Liable or not. Grandfather was saying that cut creates a scar. It hides the tissue you need to heal."

  "I create verdicts because people need remedies. If I tell a jury, 'Well, from one angle he's guilty, from another he's innocent,' I haven't done my job. I've evaded it. If this book goes out, it tells people that commitment is a sin. That deciding is violence."

  "Deciding is necessary. But deciding isn't knowing the whole truth. Concede that. You know you don't know the whole truth. You just know enough to rule."

  "I know enough to act. That's the difference. You're talking about metaphysics; I'm talking about a man who died because a guard was off. If we adopt his view, how do we prevent the next death? Do we tell the union they were right to push? Do we tell the owner he was right to cut costs? If every assertion is conditioned, then 'safety is mandatory' is only conditionally true. Maybe from some standpoint, safety is optional."

  "You're twisting the logic to break it. That's the classic objection. If every statement is partial, is *that* statement partial? Grandfather says yes. The doctrine applies to itself. It's not an absolute rule governing the universe. It's a tool for checking arrogance. It says: 'Assert this, but remember you are standing somewhere.'"

  "Then it's useless when I need a hammer. I can't build a judgment on a tool that admits it might be wrong. You want to publish this? Fine. But tell me what it does. Does it help the widow? Does it stop the machine? Or does it just make the survivors feel smarter about the corpse?"

  "It stops the machine by showing us why the guard came off. Your verdict stops the machine by punishing the guy who took it off. But he didn't take it off in a vacuum. He took it off because the line was jamming and the quota was up. You punish the worker, the next worker jams the line, the next guard comes off. You get a verdict; I get a cycle."

  "So we absolve the worker because the system pressured him? Now we're denying agency. You've swung too far. You say my way ignores context. I say your way dissolves responsibility. If everything is a standpoint, then negligence is just a standpoint. I can't live like that. I can't send a man to prison based on a 'standpoint.'"

  "Then don't. Use your law for prisons. Use this for living. You want me to state your position? You believe that without a single, fixed reality, we cannot act. You believe ambiguity is the enemy of justice."

  "I believe ambiguity is the enemy of resolution. Justice requires closing the book. This manuscript keeps it open. It's a haunt, not a home."

  "And I believe that closing the book too early is how the blood stays on the page. You want to say the case is closed. He wanted to say the case is alive. Look at us. Thirty years later, and we're fighting over the same story. Maybe because we tried to end it too soon."

  "Or maybe because we never ended it at all. Look, I'll concede this: Complexity exists. I see it every day. Witnesses lie, but they also remember differently. Facts shift. I know the verdict is a simplification. It has to be. But it's a necessary fiction. We agree on the chaos. We disagree on the cure."

  "And I'll concede this: A verdict is owed. The widow needed money. The company needed a rule. Grandfather's manuscript doesn't give them that. It gives them peace, maybe. But not checks. It doesn't tell you what to do when the guard is off and the line is moving. It just tells you to look at who is moving it."

  "So what do we do with the box?"

  "We don't burn it. But we don't send it to the press either. Not like this."

  "It needs an editor. Someone to frame the conditionality without surrendering the point."

  "It needs a co-author. Someone who admits that sometimes, you have to choose a side even if you know the other side exists. You can't publish a map that says 'every path is valid' when people are walking off cliffs."

  "Then help me fix it. Don't pack it away. You know how to construct an argument. You know how to force a conclusion. Use that. Make him say what needs to be said after the philosophy."

  "He's dead, Elena. I can't make him say anything."

  "You can write the epilogue. You write the verdict he refused to give. I'll write the context you refuse to see. We put them together."

  "That's not how publishing works."

  "It's how this works. You want a single fact? Here it is: He loved us. That's true from every standpoint. But what we do with his work depends on where we're standing. You're standing in the court. I'm standing in the study."

  "And the dead worker? Where is he standing?"

  "He's the reason we're arguing. If we pack this away, you win. The story ends. Negligence, case closed. If we publish, I win. The story continues. Negligence, context, pressure, repeat."

  "If we do both, the story changes. It becomes a warning instead of a weapon."

  "Then don't tape the box. Hand me a pen."

  "I don't have one."

  "Check the desk. Top drawer. He always kept one there."

  "It's empty, El. He used the last one writing this."

  "Then we go buy one. But you're carrying the box."
