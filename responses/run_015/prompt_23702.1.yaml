  2.  **Deconstruct Zhuangzi's Position:**
      *   *Metaphysics:* It's not dualistic (body vs. soul). It's monistic/process-oriented (*qi*, transformation/*hua*). Death is just a phase change, like ice to water.
      *   *Epistemology:* Human perspectives are limited. We judge "good/bad," "life/death" from a tiny, human-centric viewpoint. The "Dao" viewpoint sees the whole cycle.
      *   *Ethics/Emotion:* Grief stems from attachment to a specific form and a resistance to the flow of change. It's a form of ignorance (*not seeing the Dao*).
