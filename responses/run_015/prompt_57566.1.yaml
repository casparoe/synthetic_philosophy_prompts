  1.  **Analyze the User's Request:**
      *   **Context:** The user and a friend have argued three times (4 hours total) about "Would there have been a Nazi Germany without Hitler?"
      *   **Goal:** The user *does not* want a verdict on who is right about history. They want a diagnosis of *what kind of disagreement* this is. They suspect it's not really about history.
