          4.  **The "Closest World" Agreement:** Agree on the *rewind point*. 1930? 1924? 1918? The further back, the more the User wins (more time for divergence). The closer to 1933, the more the Friend wins (momentum).
          5.  **Stop using Cliometrics:** Acknowledge that Fogel's railroads are poor analogies for singular political leadership.

