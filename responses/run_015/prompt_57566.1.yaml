          *   *User (Agency/Contingency):* Nazi party was marginal in 1928. Hitler's specific ideology wasn't generic. Conservatives would have crushed radicals. Authoritarianism $\neq$ Extermination camps. Argues counterfactuals in singular political events aren't like railroad economics (no comparison class, ceteris paribus issues).
