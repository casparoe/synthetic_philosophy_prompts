  5.  **Formulate the Diagnosis:**
      *   **Confirm the Hypothesis:** The token/type slippage is real. "Nazi Germany" is an ambiguous designator.
      *   **Add the Modal Layer:** It's a clash of *modal intuitions*. Friend = Historical Determinism/Structuralism (High probability borders on necessity). User = Historical Contingency/Agency (Low probability, high sensitivity to initial conditions).
      *   **Add the Methodological Layer:** Cliometrics (generalizing laws) vs. Configurational/Hermeneutic (specific narrative). The friend is treating history like economics (substitutable variables). The user is treating it like biology or chaos theory (path dependence).
      *   **The "Genocide" Pivot:** This is the crucial friction point. Friend: Antisemitism + Power = Violence (Type). User: Industrial Extermination = Specific Ideology + Specific Bureaucracy (Token).

