answer: |-
  **Brainstorming the Claims**

  Before the verse, the prose logic must hold. The disagreement isn't about the physics of the fold; it's about the grammar of "function."

  *   **The Causal-Role Account (Cummins-style):** Function is analytic. To say $X$ has the function of $Y$ is to say $X$ contributes to the capacity of the containing system to do $Y$. If the fold seals the shell and prevents desiccation, it functions to seal the shell. This is true at $T_1$ (founder) and $T_2$ (post-immigrant). Time is irrelevant; only current contribution matters.
      *   *Commitment:* Function is synchronous with effect. A trait can have a function without a history.
  *   **The Selection-History Account (Millikan-style):** Function is etiological. To say $X$ has the function of $Y$ is to say $X$ exists *because* ancestors did $Y$. If the fold arose by drift accident and no ancestor survived *because* of it (until selection kicks in), it has no function, only effects.
      *   *Commitment:* Function is diachronic. A trait acquires function only when selection fixes it *for* that effect.
  *   **The Poem's Task:** The fold does the same physical **work** in both eras. The **system** survives in both eras. The **accident** remains the same physical structure. The only variable is the **history**. The poem must let the reader feel that calling it a **function** before **selection** feels both obviously right (it saves the snail) and obviously wrong (nothing chose it).

  ***

  **The Mantle Fold**

  One snail arrives on ash with no **history**,
  A developmental slip, a random **function**,
  A doubled lip of tissue, pure **accident**,
  Closing the shell against the island **system**.
  No rivals here to drive a harsh **selection**,
  Just dry wind meeting flesh that does its **work**.

  The season burns; the mantle does its **work**,
  Ignoring lineage lacking any **history**.
  It holds the moisture in the living **system**,
  Though no ancestor taught it this **function**.
  It is a seal born of mere **accident**,
  Surviving heat without a vote of **selection**.

  An **accident** that performs the **work**
  Of keeping death outside the **system**.
  Generations pass without a **history**,
  Clones copying the slip, not the **function**.
  They wait for variation, wait for **selection**,
  To turn a lucky break into a **history**.

  Then comes the second snail, ending the **accident**
  Of single blood. Now variation joins the **work**.
  Tight valves survive; loose valves face **selection**.
  Now the fold is part of the **system**,
  No longer just a slip, but a **function**,
  Or so the story goes, rewriting **history**.

  But look at the **system** before the **selection**,
  When the fold was still a developmental **accident**.
  Did it not serve a vital **work**?
  Was there no **function** in the dry **history**?
  Or is **function** only what survives **selection**?

  The measure shifts between **function** and **work**,
  Between the **system** and the **accident**,
  Between the moment and the long **history**,
  Waiting on the wind for **selection**.

  Does the fold know when it starts its **work**?
  Or do we argue over **history**?
  One says now, one says after **selection**,
  Both watch the snail seal up its **accident**,
  Both agree it saves the **system**,
  Neither names the **function** quite the same.
