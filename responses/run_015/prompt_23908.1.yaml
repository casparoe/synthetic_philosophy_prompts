  The cord untwists, the vessel starts to spin,
  Yet water rests, a flat and mirror'd plane.
  Then friction grips, the fluid joins within,
  And climbs the wall to seek a curved domain.
  Newton declares this shape reveals a truth,
  Not measured by the bucket's wooden side;
  It speaks of Space, in absolute repute,
  Where true acceleration does abide.

  But Mach demurs: consider stars remote,
  If all the cosmos spun around the bowl,
  Would water climb? The fixed stars cast a vote.
  Inertia is the universe's soul.
  It shows rotation shuns the vessel's frame,
  Velocity is mute; space lacks an ontic name.
