answer: |-
  Here is a prep sheet designed for your specific audience and constraints. It avoids jargon and numbers, focusing on the logic and the room's dynamics.

  ### The Landscape
  You are walking into a room where nuclear energy is not just a technology; it is a moral and historical identity. For the older members, opposing nuclear is part of their life story. For the younger members, it is an obstacle to the climate solutions they install for a living.

  Your goal is not to convert them to nuclear power. Your goal is to make them admit that the *way* Germany left nuclear was costly and risky, without forcing them to admit they were wrong about nuclear itself.

  ---

  ### The 8 Objections
  Here are the eight challenges you will face, ordered roughly by how the conversation will flow.

  #### 1. The Safety Trauma (The 70s Activists)
  *   **Phrasing:** "You can talk about costs all you want, but one accident destroys a region for a century. Fukushima was real. Why should we gamble with that just to save money on gas?"
  *   **Damage to your points:** High. It makes your economic argument look cold and careless.
  *   **Concede:** Admit immediately that the risk is real and that Fukushima changed the world. Do not try to prove German reactors were safer than Japanese ones.
  *   **Hold Firm:** The decision wasn't just about safety; it was about *timing*. The safety checks happened years before the final shutdown.
  *   **Reply:** "I am not asking you to ignore safety. The safety inspections happened years ago. The decision to close the last three plants two years ago wasn't because new cracks were found. It was a political deadline. My point is: if the plants were safe enough to run in 2021, they were safe enough to run in 2023. Closing them didn't make the technology safer; it just moved the power generation to gas plants."
  *   **Soft Spot:** If they press on "residual risk" (the chance of an event you can't predict), you have no answer. That is a philosophical argument, not an economic one.

  #### 2. The Waste Question (The Former Councillor)
  *   **Phrasing:** "We still don't have a final storage site. Every day those plants run, they make more poison for our children. How is that responsible?"
  *   **Damage to your points:** Medium. It attacks the moral legitimacy of the technology.
  *   **Concede:** **Fully.** This is the weakest link in Germany. Admit the waste situation is a failure of policy.
  *   **Hold Firm:** Keeping the plants open for ten years doesn't double the waste problem; it adds a small amount to a pile that already exists and must be managed for millennia anyway.
  *   **Reply:** "You are right, and I won't defend the waste situation. It is a mess. But that waste already exists. The plants that were shut down had already produced most of their waste during their first twenty years. Running them for ten more years adds a little more, yes. But closing them didn't make the old waste vanish. We have to solve the storage problem regardless of whether the plants are on or off. Using the plants to cut carbon while we figure out storage seems better than burning gas while we figure out storage."
  *   **Soft Spot:** They can argue that stopping now limits the total volume. You have to accept that trade-off.

  #### 3. The Distraction Argument (The Heat Pump Installer)
  *   **Phrasing:** "Every Euro and every engineer spent on keeping old nuclear running is taken away from building wind and solar. Keeping nuclear alive is just a delay tactic for the fossil fuel industry."
  *   **Damage to your points:** High. This attacks your core "bridge" argument.
  *   **Concede:** Admit that nuclear is not the future and that renewables must be the main focus.
  *   **Hold Firm:** It is not "Nuclear *or* Renewables." It is "Nuclear *and* Renewables" versus "Gas *and* Renewables."
  *   **Reply:** "I agree that nuclear is not the future. I am not asking to build new ones. I am talking about the transition period. We needed electricity *while* we were building the wind farms. If we keep the nuclear, we burn less gas during the build-out. If we close the nuclear, we burn more gas during the build-out. Keeping the lights on with existing equipment isn't a delay tactic; it's a bridge. Burning gas is the delay."
  *   **Soft Spot:** If they argue that keeping nuclear politically protects the nuclear industry lobby, you can't easily disprove that political influence.

  #### 4. The Grid Reality (The Retired Engineer)
  *   **Phrasing:** "Nuclear produces steady power. The grid needs flexible power to match the sun and wind. Keeping them open creates bottlenecks. We turned them off because the grid couldn't move the power, not just because of politics."
  *   **Damage to your points:** Very High. This suggests your "choice" (Point 1) was physically impossible.
  *   **Concede:** Admit you are not a grid expert and that nuclear is not flexible.
  *   **Hold Firm:** Inflexible power is still better than gas power if the alternative is carbon emissions.
  *   **Reply:** "I know nuclear plants don't like to change their output up and down quickly. But we have gas plants that can do that. If we kept the nuclear for the steady load, we could have used the gas plants for the flexibility. Instead, we kept the gas plants running flat-out to replace the nuclear steady load. That burns more fuel. I am not saying nuclear solves the grid puzzle. I am saying it solves the carbon puzzle while we fix the grid."
  *   **Soft Spot:** **See "The Killer Objection" below.** If the grid physically could not transport the power from North/South without blackouts, your argument collapses.

  #### 5. The Cost Myth (General Members)
  *   **Phrasing:** "But the news said running those last three plants would have cost billions. It was too expensive to keep them on."
  *   **Damage to your points:** Medium. This attacks your "sunk cost" argument.
  *   **Concede:** Admit that fuel costs (uranium) went up and maintenance on old plants is pricey.
  *   **Hold Firm:** "Expensive" is relative to gas prices, which were astronomical during the crisis.
  *   **Reply:** "Those cost estimates were made before the energy crisis peaked. When gas prices went through the roof, the math changed. Suddenly, keeping the old plant looked cheaper than buying the gas to replace it. The government did a calculation that said 'it costs too much,' but that calculation depended on gas staying cheap. Gas did not stay cheap."
  *   **Soft Spot:** You don't have the specific contract numbers. If they ask for the specific price difference, you must say you don't have the spreadsheet.

  #### 6. Centralization vs. People Power (The 70s Activists)
  *   **Phrasing:** "We want energy that belongs to citizens, on their roofs. Nuclear is about big utilities controlling everything. It's about power structures, not just electrons."
  *   **Damage to your points:** Low/Medium. This is ideological, not technical.
  *   **Concede:** Agree that citizen energy is wonderful and the future.
  *   **Hold Firm:** Citizen energy takes time to build. We needed power *now*.
  *   **Reply:** "I love the idea of local energy. I really do. But you cannot install enough rooftop solar in two years to replace a giant power station. While we are building that local future, people still need to heat their homes and run their hospitals. We can walk and chew gum at the same time. We can build local solar while keeping the big plants on to stop us burning Russian gas."
  *   **Soft Spot:** They may argue that dependency on big utilities is worse than burning gas. This is a values clash you can't win with logic.

  #### 7. Weapons Proliferation (The Physics Undergrad)
  *   **Phrasing:** "Civilian nuclear programs always lead to weapons capability. It's a dual-use technology."
  *   **Damage to your points:** Low. This is a global argument, not specific to Germany's shutdown.
  *   **Concede:** It is a serious global concern.
  *   **Hold Firm:** Germany is not seeking nuclear weapons, and shutting down plants doesn't change the global proliferation risk.
  *   **Reply:** "That is a huge global problem, I agree. But Germany shutting down its plants doesn't stop other countries from building bombs. And Germany keeping its plants running doesn't give Berlin nuclear weapons. We are talking about reducing carbon emissions in Europe, not solving global geopolitics. We have to fix what we can control."
  *   **Soft Spot:** If they argue about enrichment technology remaining in the country, you need to be careful not to sound like you want to expand enrichment.

  #### 8. "It's Too Late" (The Pragmatists)
  *   **Phrasing:** "They are off. The fuel rods are out. The staff is gone. Why are we even talking about this? It's water under the bridge."
  *   **Damage to your points:** High. It makes your talk seem pointless.
  *   **Concede:** Admit the plants are not restarting tomorrow.
  *   **Hold Firm:** The lesson matters for the next crisis, and for your Point 3 (industrial capacity).
  *   **Reply:** "You are right, they aren't starting next week. But we will face another energy crisis. If we decide that shutting down means 'never again,' we lose the ability to choose later. Also, we are still paying for the shutdown, and we are still burning the gas that replaced them. It matters for the next ten years of climate policy, not just the last two."
  *   **Soft Spot:** If they say "Let it go," you have to accept that you are arguing about history, not current policy.

  ---

  ### Special Scenarios

  #### The "Killer Objection" (The one that has got you)
  **The Grid Bottleneck Argument.**
  *   **Why:** The Retired Engineer is likely right about one thing: In Southern Germany (where the last plants were), there was not enough high-voltage cable to move the power to where it was needed. If the grid physically could not handle the nuclear power without risking blackouts, then keeping the plants open was technically impossible, not just politically wrong.
  *   **How to handle:** Do not fight this on technical grounds. You will lose.
  *   **Deflection:** "That is a serious technical constraint. But grid bottlenecks are a reason to build more cables, not necessarily to shut down clean power. If the nuclear power couldn't move, we should have used it locally to reduce the gas burned locally. Shutting it down meant the local gas plants had to work harder. The grid problem is real, but shutting the plant was a blunt instrument to solve it."

  #### The "Concede Publicly" Objection
  **The Waste Storage Issue.**
  *   **Why:** In Germany, this is a moral absolute. There is no repository. Pretending there is a solution makes you look dishonest.
  *   **How to handle:** "I cannot defend the waste situation. It is a failure of German politics over forty years. We kicked the can down the road. But burning gas kicks the climate can down the road too. I am choosing the climate risk over the storage risk, but I admit the storage risk is unresolved."

  #### The "Hope Nobody Asks" Question
  **"What was the specific technical reason the last three plants were turned off in April 2023?"**
  *   **Why:** The official reason involved specific grid stability tests in Bavaria and the availability of reserve capacity. If you say "It was just politics," the Engineer will correct you with details about "grid reserves" and "transmission constraints," and you will look like you haven't done your homework.
  *   **How to handle:** If asked, say: "My understanding is that there were concerns about grid stability in the South if they stayed on, combined with the political deadline. I am not a grid operator, so I can't speak to the specific stability tests, but I do know that gas reserves were kept on standby to replace them."

  ---

  ### Handling the Pincer: Engineer + Heat Pump Guy
  **The Scenario:**
  *   **Engineer:** "Nuclear is inflexible and creates grid problems."
  *   **Heat Pump Guy:** "Nuclear takes money and focus away from renewables."
  *   **Together:** "Nuclear is the wrong tool for the grid *and* the wrong tool for the transition."

  **Your Strategy:**
  Do not let them frame the debate as **Nuclear vs. Renewables**.
  You must frame the debate as **Existing Nuclear + Renewables vs. Gas + Renewables**.

  **The Script:**
  "I think you are both right about the future. The Engineer is right that nuclear isn't flexible, and the Installer is right that we need renewables fast. But you are both looking at the destination. I am talking about the journey.
  If we keep the nuclear, we use it for the steady power, and we use gas for the flexible power.
  If we close the nuclear, we use gas for the steady power, and gas for the flexible power.
  In both cases, we still need to build the wind farms. In both cases, we still have grid issues. The only difference is: in my scenario, we burn significantly less gas for ten years. I am not asking you to love nuclear. I am asking you to hate burning gas more."

  ---

  ### Final Advice for the Room
  1.  **Acknowledge the History:** Start by acknowledging that the anti-nuclear movement in Germany achieved something huge (renewables adoption). If you respect their past, they will listen to your critique of their present.
  2.  **No Numbers:** If someone throws a number at you ("It cost 5 billion!"), do not try to counter with a different number. Say: "I don't have the spreadsheet in front of me. But the principle is that gas prices were higher than the operating costs."
  3.  **Point 3 (Industrial Capacity):** This is your most original point. Frame it as "closing a door." You don't need a study to prove that if you fire the welders and close the factories, you can't easily reopen them. Use the analogy of a craft: "If you stop building clocks for 30 years, you forget how to build clocks."
  4.  **Humility:** You are an IT procurement person, not a physicist. Use that. "In my job, I look at supply chains. When you cut a supply chain, it breaks. That is what I see happening here."

  Good luck. You are arguing for nuance in a room that prefers certainty. That is hard, but necessary.
