  *   **(ii) "If you saw it, you would find it gripping from start to finish":** S **does** know this.
  *   **(iii) "Its editing falls apart in the final hour":** S **does** know this.

  M. treats these differently based on the **type of property** ascribed. Verdict (i) ascribes an *aesthetic property* (grippingness as a quality of the film). Verdict (ii) ascribes a *psychological/dispositional fact* about S (a prediction of her response). Verdict (iii) ascribes a *structural/technical fact* (editing coherence). M.'s record shows she permits testimony for structural facts (2) and psychological/moral facts (3), but blocks it for aesthetic properties (1, 5, 7), regardless of the testifier's reliability. The 180/180 track record elevates the claim to a practical reason (as in 6), but does not convert the aesthetic testimony into knowledge.

  ***

  **The Best Rule**

  The single rule that best explains M.'s seven earlier verdicts is **The Acquaintance Principle for Aesthetic Knowledge**: *One can acquire knowledge of an object's aesthetic properties only through direct first-hand experience of that object; testimony suffices for knowledge of non-aesthetic (structural, historical, psychological, or moral) properties.*

  *   **Explanation of Record:** This rule explains why S knows the poem's form (2) but not its excellence (1); why she knows the hiring practice is unjust (3) but cannot know the installation was devastating via P (5); and why critics cannot overturn her direct judgment (7). It accommodates (4) because the knowledge was acquired via past acquaintance, not testimony. It accommodates (6) because practical action does not require knowledge, only reliable indication.
  *   **One Rule or Two?** M. is running **two principles at once**, but they govern different domains.
      1.  **The Epistemic Principle:** The Acquaintance Principle (above), which dictates when *knowledge* is possible.
      2.  **The Practical Principle:** A Reliability Principle for *action*, which dictates that testimony provides sufficient evidence for practical decisions (buying the ticket in 6) even when it fails to ground knowledge.
      My three predicted verdicts fall out of the Epistemic Principle alone: (i) is blocked by Acquaintance; (ii) and (iii) are permitted because they are non-aesthetic facts.

  ***

  **Alternative Rules**

  **Alternative 1: The Verified Reliability Rule**
  *   **Formulation:** Testimony yields aesthetic knowledge if and only if the receiver has independent, empirical verification that the testifier's aesthetic responses reliably match their own.
  *   **Fit:** This fits the seven verdicts if we assume the reliability in (1) and (5) was insufficient (50% match in 1; unverified trust in 5). It fits (3) because the friend is "most trusted."
  *   **Divergence:** In the New Case, reliability is verified (180/180 match). This rule predicts S **does know** (i).
  *   **Elimination:** My prediction (No Knowledge on i) eliminates this rule. M.'s insistence in (5) that "no one else can know... however much they trust her" suggests reliability is irrelevant to the epistemic barrier, not just insufficient in that specific instance.

  **Alternative 2: The Reason-Transmission Rule**
  *   **Formulation:** Testimony yields knowledge only if the testifier transmits the *reasons* for their judgment, not merely the verdict. Aesthetic reasons are intransmissible without experience; non-aesthetic reasons are transmissible.
  *   **Fit:** This fits the record because in (1), (5), and (6), only verdicts were given. In (2) and (3), the facts/reasons are accessible via language. It fits (4) because the reasons were grasped during the original reading.
  *   **Divergence:** This rule survives my prediction (since R gives no reasons for (i)). However, it diverges from the Acquaintance Principle on a case where reasons *are* provided.
  *   **Elimination:** This rule is not eliminated by the New Case predictions, but it is distinct from the Acquaintance Principle.

  ***

  **The Further Case**

  To separate the surviving rules (**The Acquaintance Principle** vs. **The Reason-Transmission Rule**), I would put the following case to M.:

  **The "Exhaustive Analysis" Case:**
  R. sees the same unavailable film. R. tells S the film is "gripping," but this time R. provides a complete, frame-by-frame technical explanation of the editing, pacing, and sound design that *causes* the gripping effect, such that S understands exactly why the film produces that response. S still does not see the film.

  *   **The Acquaintance Principle Predicts:** S still does **not know** the film is gripping. Understanding the causal mechanics of an aesthetic effect is not the same as experiencing the aesthetic property. The barrier is the lack of sensory acquaintance, not the lack of reasons.
  *   **The Reason-Transmission Rule Predicts:** S **does know** the film is gripping. The epistemic gap was closed by the transmission of the underlying reasons; the verdict is now supported by graspable evidence.

  If M. maintains that S still lacks knowledge, the Acquaintance Principle is confirmed as the fundamental driver of her intuitions, and the Reason-Transmission Rule is eliminated.

  ***

  **General Explanation**

  M.'s record is better explained by a view about **the nature of the properties ascribed** rather than a general rule about testimony or memory. She operates as a **Realist about Non-Aesthetic Properties** and a **Response-Dependent Theorist about Aesthetic Properties**.

  On her view, "terza rima" and "unjust" are properties that exist independently of S's immediate perception and can be captured by propositions. "Gripping" and "exquisite," however, are properties that essentially involve a subjective response. To know "X is gripping" is not just to know "X causes grippingness in people," but to grasp the *force* of that grippingness. That force cannot be captured in a proposition (testimony) but only in an experience. This explains why memory works in (4) (the experience happened) but testimony fails in (1) and (5) (the experience is missing), and why moral testimony works in (3) (moral properties are treated as propositionally accessible, unlike aesthetic ones). This reading unifies her verdicts without requiring ad-hoc distinctions about reliability or stakes.
