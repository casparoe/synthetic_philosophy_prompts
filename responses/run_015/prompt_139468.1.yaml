      *   **Host Expertise:** Left school at 18, self-taught from books/graph paper. Knows elementary vocabulary (payoff matrix, EV, dominated strategy). Needs unpacking of advanced concepts.
      *   **Topic:** Iterated elimination of strictly dominated strategies (IESDS), specifically focusing on *mixed strategy dominance* (where a mixture of options beats a pure option, leading to a cascade).
      *   **Key Design Requirements:**
          1.  **Surprise Mixture:** First game needs an option dominated only by a *mixture* of others (not a single pure strategy). Weights shouldn't be 50/50; should lean on a "weak" option to create resistance.
          2.  **Real Cascade:** At least 3 rounds of elimination. At least one option survives initial scrutiny but dies later (order dependence/iterative nature).
          3.  **Hedge $\neq$ Advice:** Crucial distinction. The mixture used to *eliminate* a strategy shouldn't necessarily be the *best* strategy to play against actual humans (Nash Equilibrium vs. Rationalizability). Participants must feel the difference between "this option is logically impossible" vs. "this is what you should play."
          4.  **Weak Dominance Warning:** 10-min coda on weak dominance (order matters). Whiteboard demo.
          5.  **Three-Player Correlation (Optional):** Only if feasible. Needs honesty about feasibility.
      *   **Deliverables:** Rules, materials, payoff tables (with verified math), minute-by-minute timeline, handout text (no jargon upfront), debrief script (addressing randomization and common knowledge objections), prediction of failure modes.

