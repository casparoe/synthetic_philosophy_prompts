  ### Part 4: The Weak Dominance Coda (Whiteboard Only)

  *Time: 75-85 mins. Do not use handouts. Draw this live.*

  **Host Script:** "We just deleted options that were *strictly* worse. What happens if we delete options that are only *weakly* worse (equal in some cases, worse in others)? The order matters."

  **Matrix 1 (Delete Row First):**
  | | L | R |
  | :--- | :---: | :---: |
  | **T** | 2 | 2 |
  | **B** | 1 | 3 |

  *   **Step 1:** Look at Rows. T (2,2) vs B (1,3). No dominance.
  *   **Step 2:** Look at Cols (Opponent minimizes). L (2,1) vs R (2,3).
      *   If I play T: L=2, R=2. (Equal).
      *   If I play B: L=1, R=3. (L is better).
      *   **L weakly dominates R.** Delete R.
  *   **Step 3:** Now Rows. T (2) vs B (1). T dominates B. Delete B.
  *   **Survivor:** **Top-Left (T, L).**

  **Matrix 2 (Delete Col First - Wait, let's swap the dominance):**
  *Let's use a standard order-dependence example.*

  | | L | R |
  | :--- | :---: | :---: |
  | **T** | 1 | 1 |
  | **M** | 1 | 1 |
  | **B** | 0 | 2 |

  *   **Path A:** Compare Rows T and M. They are identical. Delete M (Weakly dominated by T).
      *   Remaining: T (1,1), B (0,2).
      *   Compare Cols L and R.
      *   If T: L=1, R=1.
      *   If B: L=0, R=2. (L is better for minimizer).
      *   L weakly dominates R. Delete R.
      *   Remaining: T vs L (1). B vs L (0). T dominates B.
      *   **Result: T.**
  *   **Path B:** Compare Cols L and R first.
      *   If T: 1 vs 1.
      *   If M: 1 vs 1.
      *   If B: 0 vs 2. (L is better).
      *   L weakly dominates R. Delete R.
      *   Remaining: T (1), M (1), B (0).
      *   T and M weakly dominate B. Delete B.
      *   Remaining: T and M.
      *   **Result: T or M.**

  *Correction for the Session:* To make it punchy, use this specific 2x2 example where the *solution* changes.

  | | L | R |
  | :--- | :---: | :---: |
  | **T** | 2 | 2 |
  | **B** | 2 | 1 |

  *   **Player 1 (Max):** T weakly dominates B (2$\ge$2, 2>1).
      *   If we delete B: **T survives.**
  *   **Player 2 (Min):** L weakly dominates R (2$\le$2, 2>1).
      *   If we delete R: **L survives.**
  *   **Outcome:** (T, L) = Payoff 2.
  *   **Wait, this doesn't change the survivor.**

  *Use this 3x3 instead for the warning:*
  | | L | M | R |
  | :--- | :---: | :---: | :---: |
  | **T** | 1 | 1 | 0 |
  | **B** | 1 | 0 | 1 |

  *   **Order 1:** Delete Col R (Weakly dominated by L: 0<1, 1>1... no).
  *   *Let's stick to the verbal warning if the matrix gets too complex for 10 mins.*
  *   **Revised Coda:** Draw two 2x2s.
      *   **Case 1:** Strict Dominance. Order doesn't matter. (Refer to the main game).
      *   **Case 2:** Weak Dominance. Draw:
          | | L | R |
          | :--- | :---: | :---: |
          | **T** | 1 | 1 |
          | **B** | 1 | 0 |
          *   Row Player: T weakly dominates B. Delete B. Result T.
          *   Col Player (Min): L weakly dominates R (1=1, 1>0). Delete R. Result L.
          *   Outcome (T,L) = 1.
          *   *Wait, if I delete R first:* Col Player deletes R. Row Player sees T(1) vs B(1). Indifferent. Could play B.
          *   Outcome (B, L) = 1.
          *   Payoff is same, but strategy set differs.
      *   **The Point:** With weak dominance, you can delete a strategy that might have been a best response to a strategy you *also* deleted. You might throw away the only equilibrium.
      *   **Warning:** "In this session, we only crossed out options that were *strictly* worse. If you ever do this with 'weakly' worse options, the order in which you cross them out changes the answer. That is why mathematicians are nervous about weak dominance."

