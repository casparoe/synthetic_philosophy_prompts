  ### Part 5: Debrief & Objections

  **1. "Why would I ever randomize? I'm not trying to be unpredictable."**
  *   **Answer:** "In this game, you shouldn't randomize to play. You randomize to *think*. The 40/60 mix wasn't advice; it was a measuring stick. It proved Plan C was broken. Once Plan C was gone, you went back to playing Pure Plan A. Mixing is a tool for proof, not necessarily a lifestyle."

  **2. "Why should I assume the other person is reasoning the way I am?" (Common Knowledge)**
  *   **Answer:** "The cascade only works if you believe they won't play dominated strategies. If you think they might play Plan C (the 'Safe' one), then you *must* keep Resp Z to punish them. The logic holds only if we both know we are both rational, and we both know that we both know... If you doubt their rationality, the cascade breaks, and 'Safe' plans come back to life."

  **3. The Three-Player Problem (Requirement 5)**
  *   **Host Script:** "I promised to mention why we didn't do a three-player game. Mixed strategy elimination assumes opponents act independently. If two opponents can correlate—even without talking, just by sharing a culture or a signal—a hedge that looks safe against them individually might fail against them jointly. We can't stage that fairly here without complex communication rules, but remember: **Mixing protects you against independent uncertainty, not coordinated uncertainty.**"

