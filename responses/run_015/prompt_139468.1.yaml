  ### Part 6: What Will Go Wrong (Failure Modes)

  1.  **Someone plays Plan C.**
      *   *Prediction:* It will happen. Plan C looks "Safe" (5,5,10).
      *   *Response:* Do not scold. Ask the room: "If they play C, which Response beats it?" (Resp Z gives 10, X/Y give 5). "So if you think they are playing C, Z is dead. If Z is dead, look at the table again..." Use their "mistake" to restart the cascade logic.
  2.  **Numeracy Panic.**
      *   *Prediction:* During the 40/60 calculation.
      *   *Response:* Do the math on the whiteboard yourself. Ask them to verify the inequality (e.g., "Is 7.4 bigger than 5?"). Don't make them calculate the weights; just show that *some* weights exist.
  3.  **Time Overrun.**
      *   *Prediction:* The "Purge" discussion drags.
      *   *Response:* At minute 35, stop discussion. Reveal the C elimination yourself if they haven't found it. The cascade (Z and B elimination) is more important than them finding the first mix independently.
  4.  **The "Silly Option" Resistance.**
      *   *Prediction:* They will refuse to use Plan B in the mix because it scores 4 (very low).
      *   *Response:* Lean into this. "It feels wrong, doesn't it? That's the point. Logic forces you to use the 'risky' tool to dismantle the 'safe' trap, even if you don't want to hold the tool yourself."

  ### What You Must State Yourself
  The activity produces the *feeling* of the cascade, but it cannot produce the **epistemic justification** for why we assume others eliminate strategies. You must state in the debrief: *"We assumed your partner wouldn't play a dominated strategy. If they do, the logic fails. This entire structure rests on Common Knowledge of Rationality. That is a heavy assumption."*
