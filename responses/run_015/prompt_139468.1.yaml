      *   *Requirement 2 (Cascade):* Once Row C is gone, a Column option becomes dominated. Once that Column is gone, another Row option becomes dominated (perhaps by a pure strategy now, or another mixture).
      *   *Requirement 3 (Hedge $\neq$ Advice):* The Nash Equilibrium (NE) of the game should not be the mixture used for elimination. Ideally, the NE involves playing the "dominated" strategy if the opponent makes a mistake, OR the mixture used for elimination is too risky against human play even if it dominates logically. Actually, the prompt asks for: "the mixture that does the eliminating should be a bad thing to actually play." This means the *dominating mixture* is not the *optimal response* to human behavior. This highlights that IESDS removes *never-best-responses*, not necessarily *best-responses to humans*.
      *   *Requirement 4 (Weak Dominance):* Need two small matrices showing order dependence.
      *   *Requirement 5 (3-Player):* This is hard to do in a pub with 12-16 people in 90 mins without complex coordination. Correlation requires communication or shared signals. I will advise against including this as a playable game to save time for the core concepts, but I will explain *why* in the debrief.

