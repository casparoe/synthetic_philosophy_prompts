  Here is a complete session design for "Decisions, Bets and Games." It is built to fit your 90-minute window, requires no projection, and focuses on the specific logical cascade you requested.

  ### Session Overview
  *   **Topic:** Iterated Elimination of Strictly Dominated Strategies (IESDS), specifically via Mixed Strategies.
  *   **Core Insight:** A strategy can be logically impossible (dominated) even if no single alternative beats it, *and* the mixture that proves this is not necessarily the strategy you should play.
  *   **Materials Needed:**
      *   Printed Handouts (1 per pair).
      *   Printed "Payoff Cards" (optional, but handouts are safer for numeracy).
      *   Counters (chocolate chips or similar) for stakes.
      *   Whiteboard and markers.
      *   Dice (optional, for the randomization demo).

  ---

  ### Part 1: The Handout (Give this out at the start)

  **DO NOT TURN OVER UNTIL TOLD.**

  **GAME 1: THE CHOCOLATE AUCTION**
  You are Player 1 (The Row Player). Your partner is Player 2 (The Column Player).
  You will play 5 rounds.
  *   **Your Goal:** Maximize your points.
  *   **Their Goal:** Minimize your points. (It is a zero-sum contest).

  **Your Options (Plans):**
  *   **Plan A:** Steady.
  *   **Plan B:** Volatile.
  *   **Plan C:** Safe.

  **Their Options (Responses):**
  *   **Resp X:** Aggressive.
  *   **Resp Y:** Passive.
  *   **Resp Z:** Balanced.

  **The Payoff Table (Your Points)**
  *Read across your row. If you pick Plan A and they pick Resp X, you get 8 points.*

  | | **Resp X** | **Resp Y** | **Resp Z** |
  | :--- | :---: | :---: | :---: |
  | **Plan A** | 8 | 7 | 9 |
  | **Plan B** | 7 | 4 | 13 |
  | **Plan C** | 5 | 5 | 10 |

  **Instructions:**
  1.  Discuss with your partner. Do not show them your written choice until both have decided.
  2.  Write down your choice for Round 1.
  3.  Reveal. Record scores.
  4.  Repeat for 5 rounds. You may change your plan every round.

  *(Turn over for Round 6 instructions)*

  **ROUND 6: THE PURGE**
  Before playing Round 6, you are allowed to cross out **one** of your Plans (A, B, or C) that you promise never to use again.
  *   You may only cross out a Plan if you can prove it is **strictly worse** than a **combination** of your other two Plans.
  *   "Strictly worse" means: No matter what Response they pick, the Combination scores higher than the Plan.
  *   "Combination" means: You can split your probability. (e.g., "I will play Plan A 40% of the time and Plan B 60% of the time").
  *   Once you cross out a Plan, your partner is allowed to cross out one of their Responses using the same logic. Then you may cross out another Plan.
  *   **Task:** Find the cascade. How many options can you remove before playing Round 6?

  ---

  ### Part 2: Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Setup** | Hand out sheets. Explain stakes (chocolate for highest score). Pair people up (12-16 people = 6-8 pairs). |
  | **05-20** | **Game 1 (Rounds 1-5)** | Let them play. Walk around. Listen for "Plan C is safe" or "Plan B is too risky." Do not correct them. |
  | **20-35** | **The Purge (Round 6)** | Read the "Purge" instructions. Ask them to find the elimination. Most will stall on Plan C. |
  | **35-40** | **The Reveal** | Ask: "Who crossed out Plan C?" Ask: "Did any single plan beat C?" (No). "What mix beat C?" (Write on board). |
  | **40-50** | **BREAK** | 10 Minutes. |
  | **50-65** | **The Cascade** | Guide the group through the subsequent eliminations (Z, then B). Use the whiteboard. |
  | **65-75** | **Hedge $\neq$ Advice** | Crucial debrief. Show that the Mix used to kill C is *worse* than the winning strategy. |
  | **75-85** | **Weak Dominance Coda** | Whiteboard demo of order dependence (see below). |
  | **85-90** | **Close** | Answer objections. Distribute chocolate. |

  ---

  ### Part 3: The Math (For Your Verification)

  Here is the exact arithmetic for the whiteboard.

  **1. Eliminating Plan C (The Mix)**
  *   **The Claim:** Plan C (5, 5, 10) is strictly dominated by a mixture of Plan A and Plan B.
  *   **The Mix:** 40% Plan A + 60% Plan B.
  *   **Verification:**
      *   **Against Resp X:** $0.4(8) + 0.6(7) = 3.2 + 4.2 = \mathbf{7.4}$. (7.4 > 5). **Win.**
      *   **Against Resp Y:** $0.4(7) + 0.6(4) = 2.8 + 2.4 = \mathbf{5.2}$. (5.2 > 5). **Win.**
      *   **Against Resp Z:** $0.4(9) + 0.6(13) = 3.6 + 7.8 = \mathbf{11.4}$. (11.4 > 10). **Win.**
  *   **Result:** Plan C is logically impossible for a rational player. Cross it out.

  **2. Eliminating Resp Z (The Cascade)**
  *   **Context:** Plan C is gone. Player 2 (Minimizer) looks at remaining rows A and B.
  *   **The Claim:** Resp Z is strictly dominated by Resp X for Player 2. (Player 2 wants *lower* numbers).
  *   **Verification:**
      *   **If Player 1 plays A:** Resp X gives 8. Resp Z gives 9. (8 < 9). **X is better.**
      *   **If Player 1 plays B:** Resp X gives 7. Resp Z gives 13. (7 < 13). **X is better.**
  *   **Result:** Player 2 will never play Z. Cross it out.

  **3. Eliminating Plan B (The Survivor that Dies)**
  *   **Context:** Plan C and Resp Z are gone. Only Cols X and Y remain.
  *   **The Claim:** Plan B is now strictly dominated by Plan A.
  *   **Verification:**
      *   **Against Resp X:** Plan A (8) > Plan B (7).
      *   **Against Resp Y:** Plan A (7) > Plan B (4).
  *   **Result:** Plan B is eliminated.
  *   **Note:** Plan B survived Round 1 (because it was strong against Z). It died in Round 3 because Z was removed.

  **4. The "Hedge $\neq$ Advice" Calculation**
  *   **The Winning Strategy:** After the cascade, only Plan A remains. You should play Plan A.
  *   **The Eliminating Hedge:** The mix that killed Plan C was 40% A / 60% B.
  *   **The Comparison:**
      *   If you play the **Winner (Pure A)** against Player 2's best response (Resp Y): You score **7**.
      *   If you play the **Hedge (40/60 Mix)** against Player 2's best response (Resp Y): You score **5.2**.
  *   **Conclusion:** The mixture is a *logical tool* for elimination, not *advice* for play. It is actually a worse way to play the game.

