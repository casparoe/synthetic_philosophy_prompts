prompt: |-
  I'm a second year PhD student in philosophy of science and my reading group just spent two hours going in circles about structural realism and I'm still confused. We all get the basic motivation from pessimistic induction and underdetermination, like old ether theories vs relativity sharing the math even when the stuff-talk changes completely, but we split on what the epistemic vs ontic versions are actually claiming.

  My officemate cooked up this toy case to test us where two models of magnetism in some imaginary material use exactly the same structure and equations and make the same predictions, but one says there are discrete little bits with intrinsic properties doing the work and the other says there are no individual things at all, just relations all the way down, and he claims only one version of structural realism can handle that cleanly without collapsing into either plain instrumentalism or old-school realism about objects. Could you compare epistemic structural realism and ontic structural realism for me in light of that sort of case? I want to know where they really disagree, whether ontic is just epistemic plus extra metaphysics or a totally different move, and which one has a better story about continuity through theory change and about the Newman-type worry that structure alone is too thin. I definately don't need a reading list, just help thinking it through.
