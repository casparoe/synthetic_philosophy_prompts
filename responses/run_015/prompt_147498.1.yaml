answer: |-
  The Pluto episode confirms Kripke's diagnosis that meaning is grounded in community assertion rather than fact, but exposes the skeptical solution's inability to distinguish legitimate legislation from mistaken description when community consensus fractures.

  1. **The Rule-Follower:** Kripke's skeptic targets the individual astronomer, asking what fact constitutes their meaning "planet" rather than "plet." However, the skeptical solution requires a community to justify assertion conditions. The IAU acts as an authorized sub-community, yet the dissent reveals the "community" is not monolithic. The episode suggests communities follow rules only insofar as they enforce agreement, not because they possess a collective mind. The IAU's authority is institutional, not metaphysical; it cannot constitute the whole community required by Kripke's solution, which explains why dissent persists without falsifying the solution—it merely fragments the community into sub-groups with divergent assertibility conditions.

  2. **The Rule and Novel Case:** The rule is "x is a planet iff..." The novelty is not a single object (like 68+57) but a shift in background population (Kuiper Belt discoveries) altering similarity metrics. Kripke assumes static background conditions; here, the background shift makes "clearing the neighbourhood" salient only retrospectively. This stretches the skeptical argument: it is not just "what did you mean before?" but "does the old rule apply when the world changed?" The change in population density functions like the switch from small to large numbers in the quus argument, triggering a divergence in application that was not explicitly encoded in prior usage.

  3. **The Skeptical Argument:** A skeptic proposes "plet": "round body orbiting Sun, unless >5 similar bodies exist, then none are plets." This fits pre-2006 applications (Pluto was a planet; Ceres was demoted when asteroids accumulated). The rich record of Ceres helps the skeptic: it shows the rule *already* contained a hidden exception clause regarding population density. The skeptic survives the abundance because the abundance contains its own contradiction (Ceres vs. Pluto). The pre-2006 practice was not too rich to admit a competitor; rather, the richness provided the materials for the competitor. The skeptic argues that the "clearing the neighbourhood" condition was always the intended rule, merely unarticulated until Eris forced its explicit formulation.

  4. **Codification Relations:** The skeptical solution allows descriptive (recording agreement) and legislative (creating new agreement) codifications but collapses retroactively constitutive claims into legislation disguised as description. The IAU claimed to *discover* Pluto wasn't a planet (retroactive constitution) but actually *legislated* a new boundary. The "clearing the neighbourhood" condition is relational, not intrinsic. This isn't bad description; it's evidence the antecedent rule was silent on relational properties. Silence is not indeterminacy of fact, but indeterminacy of application. The IAU treated silence as a gap to be filled legislatively while speaking descriptively. The skeptical solution cannot distinguish honest description from disguised legislation because both rest on community agreement; if the community agrees to treat the legislation as description, it becomes so for them.

  5. **Closing the Loop:** Persistent dissent anomalies the skeptical solution, which predicts convergence based on assertibility conditions. However, if the dispute is verbal (different rules adopted), the solution holds: there is no fact of the matter, only competing community practices. The anger stems from treating legislative stipulation as factual discovery. The IAU should have explicitly legislated without claiming discovery. The Ceres precedent shows the practice contains a rule for ad hoc stipulation, not a pre-existing algorithm. Kripke is silent on how to adjudicate between fractured sub-communities; extrapolating, the "right" thing is to secure assertion conditions, not truth conditions. The dispute had real institutional stakes (funding, taxonomy, prestige) despite being verbal, proving that meaning's normativity is social, not metaphysical. The skeptical solution is vindicated only if we accept that the "fact" of Pluto's status is nothing over and above the consensus of the dominant sub-community, rendering the dissenters not wrong about facts, but outside the governing practice.
