answer: |-
  # The Meridian Protocol: Decision Procedure for Charter Amendments

  **Purpose:** To determine the procedural validity of proposed Charter amendments and identify mandatory referrals to the Constitutional Convention under Article 28 (Reflection Subsection).
  **Constraints:** Executable within 15 minutes using only the Charter text. No external counsel.
  **Authority:** Procedural Officer Sign-off (Required prior to floor admission).

  ---

  ## Part I: The Decision Procedure

  ### Step 1: Textual Target Identification
  **Action:** Compare the proposal text against the Charter index.
  **Question:** Does the proposal explicitly name Article 28 or use language that directly quotes the Amendment Mechanism clauses (thresholds, voting body, timing)?
  *   **YES:** Proceed to **Step 2**.
  *   **NO:** Proceed to **Step 3**.

  ### Step 2: Direct Mutation Test
  **Action:** Analyze the specific changes to Article 28.
  **Question:** Does the change alter the *numerical threshold* (e.g., two-thirds), the *voting body* (e.g., members present), or the *frequency/conditions* of amendment?
  *   **YES:** **HALT.** Mandatory Referral to Constitutional Convention. (Triggers Reflection Subsection).
  *   **NO:** (e.g., correcting a typo in a cross-reference). Proceed to **Step 6** (Clarification Test).

  ### Step 3: Functional Impact Test (The Indirect Loop)
  **Action:** Trace the functional consequences of the proposed change on the *operation* of Article 28, even if Article 28 is not named.
  **Sub-Test A (Electorate):** Does this proposal change the definition of "membership," "eligibility," or "standing" (e.g., Article 5)?
  *   **YES:** Does this change expand or contract the pool of voters available for an Article 28 vote?
      *   **If YES:** **HALT.** Mandatory Referral to Constitutional Convention. (Indirect mutation of the amendment mechanism).
      *   **If NO:** (e.g., administrative contact info). Proceed to **Step 4**.
  *   **NO:** Proceed to Sub-Test B.

  **Sub-Test B (Quorum & Timing):** Does this proposal change quorum requirements, assembly scheduling, or proxy rules (e.g., Article 19)?
  *   **YES:** Does this make it easier or harder to convene a valid vote on Article 28?
      *   **If YES:** **HALT.** Mandatory Referral to Constitutional Convention.
      *   **If NO:** Proceed to **Step 4**.
  *   **NO:** Proceed to **Step 4**.

  ### Step 4: Threshold Integrity Check
  **Action:** Compare the vote required to pass *this* proposal against the current Article 28 threshold.
  **Question:** Does the proposal claim validity under a threshold lower than the current Charter requirement (e.g., claiming 60% validity when 66% is required)?
  *   **YES:** **REJECT.** Procedurally Invalid. (Cannot use a lower threshold to lower the threshold).
  *   **NO:** Proceed to **Step 5**.

  ### Step 5: Entrenchment and Duration Test
  **Action:** Scan for temporal clauses or lock-in mechanisms.
  **Question:** Does the proposal introduce a sunset clause, a moratorium on future changes, or a super-majority requirement *higher* than the current one for specific topics?
  *   **YES:** **HALT.** Mandatory Referral to Constitutional Convention. (Alters the continuity or reversibility of the amendment mechanism).
  *   **NO:** Proceed to **Step 6**.

  ### Step 6: The Clarification Trap (Value Judgment Required)
  **Action:** Evaluate proposals framed as "editorial," "housekeeping," or "clarifying."
  **Question:** Does the change shift *agency* or *discretion* without changing explicit numbers? (e.g., changing "the membership" to "the chair," or "shall" to "may").
  *   **[VALUE JUDGMENT FLAG]:** You must determine if the change is *semantic* or *substantive*.
      *   **Test:** If the text were litigated, would the outcome of a vote change?
      *   **If Outcome Changes:** **HALT.** Mandatory Referral to Constitutional Convention. (Cosmetic substitution of authority).
      *   **If Outcome Unchanged:** **PASS.** Admit to Floor.

  ---

  ## Part II: Application to Case Studies

  ### Case 1: The 60% Threshold Proposal
  **Proposal:** Reduce amendment threshold to 60%.
  **Status:** Adopted by 60% vote at assembly (Pending Certification).
  **Procedure Application:**
  1.  **Step 1 (Target):** Explicitly names Article 28 threshold. (YES).
  2.  **Step 2 (Direct Mutation):** Alters numerical threshold. (YES).
  3.  **Result:** **HALT. Mandatory Referral.**
  4.  **Step 4 (Integrity):** The vote achieved was 60%. Current Charter requires 66%.
  5.  **Result:** **REJECT.** Procedurally Invalid.

  **Officer Ruling:** This proposal triggers the Reflection Subsection (Step 2) because it modifies the amendment mechanism directly. Furthermore, under Step 4, the vote count (60%) failed to meet the existing Charter requirement (66%) necessary to enact such a change. A lower threshold cannot validate its own creation.
  **Action:** Declare the vote null and void in the minutes. Do not certify. Refer the *topic* to the Constitutional Convention.

  ### Case 2: The Ten-Year Sunset Clause
  **Proposal:** Insert clause into Article 28 suspending it unless renewed every ten years.
  **Procedure Application:**
  1.  **Step 1 (Target):** Explicitly names Article 28. (YES).
  2.  **Step 2 (Direct Mutation):** Alters conditions of amendment (continuity). (YES).
  3.  **Step 5 (Entrenchment):** Introduces a temporal limit on the amendment power itself. (YES).
  4.  **Result:** **HALT. Mandatory Referral.**

  **Officer Ruling:** While this does not change the voting number, it alters the *existence* of the amendment mechanism over time. This creates a conditional amendment power, which fundamentally reconfigures the Reflection Subsection's guarantee of continuous amendability.
  **Action:** Deny floor admission. Refer to Constitutional Convention.

  ### Case 3: The "Housekeeping" Substitution
  **Proposal:** Replace "the membership" with "the assembly chair" in Article 28 voting clause. Framed as editorial.
  **Procedure Application:**
  1.  **Step 1 (Target):** Explicitly names Article 28 voting clause. (YES).
  2.  **Step 2 (Direct Mutation):** Alters the *voting body* text. (YES).
  3.  **Step 6 (Clarification Trap):** **[VALUE JUDGMENT FLAG]**.
      *   *Test:* Does the outcome of a vote change?
      *   *Analysis:* Yes. It moves authority from a collective (2/3 of members) to an individual (1 Chair).
  4.  **Result:** **HALT. Mandatory Referral.**

  **Officer Ruling:** This is not editorial. It relocates decision authority from the electorate to a single officer. This is a substantive mutation of the amendment mechanism disguised as syntax.
  **Action:** Deny floor admission. Refer to Constitutional Convention.

  ---

  ## Part III: Limitations and Irreducible Judgments

  This procedure cannot settle the following. In these instances, your sign-off relies on institutional trust rather than mechanical logic.

  **1. The "Spirit" of the Reflection Subsection**
  *   **Limitation:** The procedure identifies *mechanical* changes to the amendment process. It cannot definitively rule on whether a change violates the *intent* of the Collective without changing the *text* of the mechanism.
  *   **Example:** A proposal that makes research funding so punitive that members are afraid to vote, effectively freezing amendments without changing Article 28.
  *   **[VALUE JUDGMENT FLAG]:** You must decide if "chilling effects" count as functional mutations. The procedure defaults to **PASS** unless text is changed, but you may ethically flag this in the minutes.

  **2. The Convention Paradox**
  *   **Limitation:** The procedure mandates referral to a Constitutional Convention for Article 28 changes. However, the rules *for* the Convention are in Article 28.
  *   **Risk:** If Article 28 is corrupted, the Convention rules may be invalid.
  *   **Unsettled Question:** The procedure cannot validate the Convention itself if the Charter's foundation is compromised. It only preserves the *requirement* to convene one.

  **3. "Substantive" vs. "Clarifying" (Step 6)**
  *   **Limitation:** Determining whether a wording change alters the "outcome of a vote" is predictive.
  *   **[VALUE JUDGMENT FLAG]:** You must interpret potential future scenarios. There is no objective test for "ambiguity." If a proponent argues the change is "neutral," you must weigh their credibility against the text.
  *   **Guidance:** In cases of doubt, default to **Referral**. It is safer to burden the Collective with a Convention than to certify a corrupted Charter.

  **4. The Normative Question of Amendability**
  *   **Limitation:** The procedure assumes the Charter *should* be amendable. It cannot answer whether the Charter *ought* to be easily amendable at all.
  *   **Unsettled Question:** If the Collective wishes to become immutable (unamendable), this procedure forces that desire through a Convention. It cannot facilitate a "self-destruct" of the amendment power without the Convention step.

  **5. Distance of Indirect Loops**
  *   **Limitation:** Step 3 tests for indirect loops (e.g., changing Membership to affect Voting).
  *   **[VALUE JUDGMENT FLAG]:** How distant is too distant? If Article 10 changes the "fiscal year," and that indirectly affects who can afford membership dues, and thus who votes...
  *   **Guidance:** The procedure halts only at *direct* functional links (Electorate, Quorum, Timing). Do not chase infinite causal chains. If the link requires more than two logical steps, **PASS** to the Floor, noting the concern in the minutes.

  ---

  **Procedural Officer Certification:**
  *I have applied the Meridian Protocol to the attached proposal. My determination is based solely on the text of the 2019 Charter and the logical steps outlined above. Where value judgments were required, I have defaulted to the preservation of the Reflection Subsection.*

  **Signature:** ___________________
  **Date:** ___________________
