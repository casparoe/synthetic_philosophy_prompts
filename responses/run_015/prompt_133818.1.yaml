prompt: |-
  A few months ago I joined the board of a small land trust that manages a couple of thousand hectares of mixed woodland, fen and old grazing land, and I volunteered to take over the reserve's species list. What I found was not a data problem but a conceptual one. Our headline figure — the number of species the reserve exists to protect — shifts by roughly a third depending on which of the published checklists we reconcile against, and almost none of the difference comes from new fieldwork: it comes from disagreements about what a species is in the first place. That number goes into grant applications, into the management plan, and, because protection in our jurisdiction attaches to whatever the official list names at whatever rank it names it, into what we are legally obliged to manage for. So the question has stopped being academic for me, and I have discovered that I do not know what I should be demanding of an answer.

  What I want from you is a specification rather than a survey. Write out the desiderata that an account of species would have to meet for me to trust it as the backbone of such a list — the phenomena it has to accommodate, the cases it has to get right, the distinctions it must not collapse, and the results from biology it is not allowed to contradict — with the case or consideration behind each requirement, not just the requirement.

  Some of what I think belongs on that list, for you to accept, reject or reframe: it must say something usable about lineages with no known sex and about prokaryotes that swap genes sideways; about forms arranged in a chain around a barrier whose two ends meet and do not interbreed, and about cases where the ends do interbreed freely; about new lineages created in a single generation by whole-genome duplication; about organisms like lichens, where the named thing is a consortium of a fungus and a photosynthetic partner, and the same fungus can turn up with different partners; about the continuum of fossils, where boundaries look like artifacts of where we slice; about domesticated forms and their wild relatives that remain fully interfertile; and about the fact that most of the taxa on my list will never have a genome sequenced, only a photograph, a specimen and perhaps a barcode region, so the account has to be usable under severe evidential poverty and has to say what to do when the evidence runs out.

  I also want your view on three things the criteria themselves turn on. First, which of these demands are genuine adequacy conditions and which are prejudices of one constituency — the metaphysician wanting natural kinds with essences, the phylogenetics camp wanting monophyly, the field naturalist wanting something decidable with a hand lens, the practitioner wanting a number that does not move. Second, which pairs of requirements you think cannot be jointly satisfied, and which one of each pair you would keep: I suspect, for instance, that asking for a unit whose counts mean the same thing across fungi, insects, birds and bacteria is in tension with asking the account to be faithful to the causal structure of each clade, and that demanding stability under future revision is in tension with demanding that the list track new evidence. Third, whether the specification should include a requirement that the metaphysical question of what species are be separable from the practical question of which taxa to list — whether that separability is a real desideratum or a way of giving up on the problem I actually have.

  Then, briefly, and only as a check on the criteria rather than as the main deliverable: how the familiar families of account fare against the list — the interbreeding-based one, the diagnosable-smallest-cluster and monophyly-based ones, the ecological or genotypic-cluster pictures, the general-lineage view, and outright pluralism — and which single requirement does the most work in excluding them. Please do not give me a reading list or a bibliography; I can find those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A board member of a small land trust managing mixed habitats (woodland, fen, grazing). Practical, responsible for legal/management obligations, grant applications, and species lists. Not an academic theorist, but intellectually rigorous.
      *   **The Problem:** The "species count" fluctuates wildly (by ~33%) based on which checklist/taxonomic concept is used, not due to new fieldwork. This affects funding, legal obligations, and management plans.
      *   **The Task:** Provide a *specification* (desiderata) for an account of species that can serve as the backbone of this list. Not a survey of theories, but a set of requirements with justifications.
      *   **Specific Constraints:**
          *   Address specific biological phenomena (asexuals, prokaryotes, ring species, polyploidy, lichens, fossils, domestics, evidential poverty).
          *   Evaluate three meta-questions: Adequacy vs. Prejudice, Incompatible Pairs (trade-offs), and Separability of Metaphysics/Practice.
          *   Briefly evaluate familiar species concepts against the specification (check, not main deliverable).
          *   **NO** reading lists or bibliographies.
      *   **Tone:** Professional, precise, philosophical but grounded in conservation practice. Respectful of the user's dilemma (ontological vagueness having real-world costs).

  2.  **Deconstruct the Desiderata (The Specification):**
      *   The user provided a list of phenomena to accommodate. I need to turn these into positive requirements (desiderata) with justifications.
      *   *Asexuals/Prokaryotes:* Requirement: Non-reliance on sexual reproduction. Justification: Many protected organisms (bacteria, some plants/fungi) don't fit the Biological Species Concept (BSC).
      *   *Ring Species:* Requirement: Accommodate continuity vs. discontinuity. Justification: Evolution is gradual; arbitrary cuts shouldn't invalidate protection.
      *   *Polyploidy:* Requirement: Acknowledge instant speciation. Justification: Common in plants; legally distinct status often needed.
      *   *Lichens/Symbionts:* Requirement: Handle holobionts/functional units. Justification: Conservation targets the functional ecosystem role, not just the fungal genome.
      *   *Fossils/Time:* Requirement: Diachronic stability (or clear handling of change). Justification: Management is long-term; lineage continuity matters.
      *   *Domestics:* Requirement: Distinguish wild vs. managed without arbitrary genetic cutoffs. Justification: Legal protection usually applies to "wild" states; hybridization risks.
      *   *Evidential Poverty:* Requirement: Operationalizability with limited data (morphology/barcodes). Justification: Most surveys can't sequence whole genomes.
      *   *Legal/Management Stability:* Requirement: Administrative stability. Justification: Grants and laws need fixed targets, even if science evolves.

  3.  **Address the Three Meta-Questions:**
      *   *Adequacy vs. Prejudice:* Distinguish between what biology *is* (causal structure) vs. what humans *need* (stable counts). The "natural kind" demand is likely metaphysical prejudice. The "decidable" demand is practical necessity.
      *   *Incompatible Pairs:*
          *   *Universal Uniformity vs. Clade-Specific Faithfulness:* You can't have one definition that fits bacteria (HGT) and birds (BSC) perfectly. *Choice:* Clade-specific faithfulness (better biology), mitigated by operational protocols.
          *   *Stability vs. Accuracy:* Science changes; laws need stasis. *Choice:* Stability (with scheduled reviews), because management paralysis is worse than slight taxonomic lag.
      *   *Separability (Metaphysics vs. Practice):* Is this giving up? No, it's pragmatism. The "species" ontological status matters less than the "conservation unit" operational status. *Choice:* Separability is a real desideratum (Operational Taxonomic Units vs. Biological Species).

  4.  **Evaluate Familiar Concepts (The Check):**
      *   *BSC (Interbreeding):* Fails asexuals, fossils, lichens.
      *   *PSC (Phylogenetic/Diagnosable):* Fails evidential poverty (needs DNA), oversplits ring species.
      *   *Ecological:* Good for function, bad for boundaries.
      *   *General Lineage:* Good metaphysics, bad operationalization.
      *   *Pluralism:* Honest, but administratively nightmarish (which concept for which grant?).
      *   *Biggest Excluder:* The "Evidential Poverty" requirement kills most molecular-heavy concepts. The "Stability" requirement kills strict phylogenetic revisionism.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Acknowledge the gravity. This isn't just philosophy; it's fiduciary duty.
      *   *Section 1: The Specification (Desiderata).* Group the user's examples into coherent requirements. Use strong headings. Ensure the "Case/Consideration" is prominent.
      *   *Section 2: The Meta-Questions.* Be decisive. Don't hedge too much. The user wants a view.
          *   *Prejudice:* Call out the "Natural Kind" essence demand.
          *   *Trade-offs:* Highlight the Uniformity vs. Reality tension.
          *   *Separability:* Argue for "Operationalism" as a valid stance, not a cop-out.
      *   *Section 3: The Check.* Keep it brief as requested. Map the concepts to the failures.
      *   *Conclusion:* A summarizing thought on the "Conservation Unit" vs. "Species" distinction.

      *(Self-Correction during drafting)*: I need to make sure I don't just repeat the user's examples but formalize them into *requirements*. For instance, instead of saying "handle lichens," say "Accommodate Composite Functional Units."
      *(Refining the Trade-off)*: The tension between "Stability" and "Tracking Evidence" is crucial. I should suggest a "locked list with periodic review" mechanism as the practical solution to the philosophical tension.
      *(Refining the Separability)*: The user asks if separability is "giving up." I need to argue it's *strategic abstraction*.

  6.  **Final Review against Constraints:**
      *   Specification format? Yes.
      *   Case/Consideration for each? Yes.
      *   Address specific phenomena (asexuals, rings, etc.)? Yes.
      *   Three meta-questions answered? Yes.
      *   Brief evaluation of concepts? Yes.
      *   No bibliography? Yes.

  7.  **Final Polish:** Ensure tone is authoritative yet collaborative. (Proceed to generate output).

  *(Post-computation check)*: Did I address the "prokaryotes swapping genes sideways"? Yes, under HGT/Non-tree-like inheritance. Did I address "evidential poverty"? Yes, under Operationalizability.

  Let's structure the response clearly.

  *   **Preamble:** Validate the problem.
  *   **Part I: The Specification (Desiderata).**
  *   **Part II: The Meta-Analysis (Adequacy, Trade-offs, Separability).**
  *   **Part III: The Check (Concept Evaluation).**
  *   **Closing:** Final recommendation.

  *Wait, one nuance:* The user asked "which single requirement does the most work in excluding them." I need to identify that specifically in Part III. Likely "Operationalizability under Evidential Poverty" or "Administrative Stability." I'll choose Operationalizability as the primary scientific filter and Stability as the primary administrative filter. Actually, "Non-Uniformity" (allowing different criteria for different groups) might be the one that excludes the "Universal Definition" seekers. Let's go with **Operationalizability under Evidential Poverty** as the hardest filter for modern molecular concepts, and **Stability** as the filter for strict phylogenetic concepts. I will select one as requested: **Operationalizability**.

  *Wait, another nuance:* The user asked about "Separability... whether that separability is a real desideratum or a way of giving up." I need to take a stance. I will argue it is a real desideratum because the *purpose* of the list dictates the *criteria*, not vice versa.

  Okay, ready to write.s
answer: |-
  This is a fiduciary problem disguised as an ontological one. You are not asking for the Truth of Species; you are asking for a stable referent for legal and financial obligations. The specification below is designed to bridge the gap between biological reality and administrative necessity.

  ### Part I: The Specification (Desiderata)

  An account of species suitable for conservation management must satisfy the following seven requirements.

  **1. Reproductive Mode Agnosticism**
  *   **Requirement:** The account must define lineage boundaries without necessary reference to sexual interbreeding or meiotic compatibility.
  *   **Case:** A significant portion of biodiversity (prokaryotes, many fungi, parthenogenetic animals, apomictic plants) does not reproduce sexually. If your list relies on the Biological Species Concept (BSC), you are legally invisible to a third of the life on your reserve. Furthermore, horizontal gene transfer in prokaryotes means "lineage" is a network, not a tree; the account must accommodate reticulation without collapsing into "everything is one species."

  **2. Accommodation of Instantaneous Lineage Splitting**
  *   **Requirement:** The account must allow for the recognition of new lineages arising in a single generation.
  *   **Case:** Polyploidy in plants (whole-genome duplication) creates instant reproductive isolation from parents. If the account requires gradual divergence, these entities remain invisible until they accumulate enough mutations to be "diagnosable," by which time they may be extinct. Management must protect the *mechanism* of speciation, not just the result.

  **3. Functional Unit Recognition (The Lichen Clause)**
  *   **Requirement:** The account must permit the naming of stable ecological consortia as units, even if they comprise multiple phylogenetic lineages.
  *   **Case:** Lichens are fungal-algal/bacterial symbioses. The fungus often associates with different partners. If you protect only the fungal genome, you may fail to protect the functional organism that performs the ecological role (nitrogen fixation, substrate stabilization) for which the reserve is managed. The conservation target is the *function*, not just the nuclear DNA.

  **4. Continuum Handling (The Ring and The Cline)**
  *   **Requirement:** The account must provide a rule for slicing continuous variation without denying the continuity.
  *   **Case:** Ring species and clinal variation demonstrate that reproductive isolation is often a gradient, not a binary switch. An account that demands sharp boundaries forces arbitrary cuts that change with every new sample. The specification must allow for "Management Units" that acknowledge connectivity at the ends of the ring while protecting the distinct ends as separate priorities if they exhibit distinct adaptive traits.

  **5. Diachronic Stability (The Fossil and Future Clause)**
  *   **Requirement:** The account must treat species as segments of lineages extended through time, not just cross-sections of the present.
  *   **Case:** Conservation is a long-term commitment. If a population evolves significantly over 50 years, does the legal protection lapse? The account must anchor the taxon to a lineage trajectory, ensuring that protection follows the evolving population, not just a static morphological snapshot. This also applies to fossils where the "slice" determines the species count; the account must acknowledge that these boundaries are heuristic, not ontological walls.

  **6. Operationalizability under Evidential Poverty**
  *   **Requirement:** The criteria for assignment must be decidable using morphology, ecology, or limited genetic markers (barcodes), not whole-genome phylogenies.
  *   **Case:** You cannot sequence every insect or fungus on 2,000 hectares. If the definition requires resolving monophyly via genomic data, your list will always be incomplete and legally vulnerable. The account must specify a "default status" when evidence runs out (e.g., "provisionally distinct based on morphospace") rather than leaving the organism in limbo.

  **7. Administrative Stability (The Counting Constraint)**
  *   **Requirement:** The extension of the term (the list of names) must remain stable over funding and legal cycles (5–10 years), even if phylogenetic hypotheses shift.
  *   **Case:** Grant applications and legal statutes require fixed numbers. If the species count shifts by 30% because a taxonomist revised a genus, your management metrics break. The account must distinguish between the *biological hypothesis* (which changes) and the *conservation unit* (which must remain fixed for the duration of the plan).

  ---

  ### Part II: The Meta-Analysis

  You asked for a view on the tensions within these criteria. Here is the assessment.

  **1. Adequacy Conditions vs. Constituency Prejudices**
  *   **Prejudice:** The demand for "Natural Kinds with Essences" (Metaphysician) and "Strict Monophyly" (Cladist). These are theoretical ideals that do not map onto the messy reality of evolution (hybridization, HGT, incomplete lineage sorting). Demanding them for a management list is category error.
  *   **Adequacy:** The demand for "Decidability" (Field Naturalist) and "Stability" (Practitioner). These are not prejudices; they are boundary conditions for the job. A species concept that cannot be applied in the field or changes annually is functionally useless for conservation, regardless of its biological elegance.
  *   **Verdict:** Prioritize the Practitioner and Field Naturalist constraints. Biology is the *object* of management, not the *master* of it.

  **2. Incompatible Pairs and Trade-offs**
  *   **Pair A: Universal Uniformity vs. Clade-Specific Faithfulness.**
      *   *Conflict:* You cannot have a single definition that fits bacteria (HGT), birds (BSC), and lichens (Symbiosis) equally well without doing violence to one.
      *   *Choice:* **Clade-Specific Faithfulness.** Adopt a "Modular Specification." Use BSC-derived criteria for vertebrates, Phylogenetic criteria for fungi, and Ecological/Functional criteria for symbionts. The "Species" label is a placeholder for "Lowest Practical Taxonomic Unit for this Clade."
  *   **Pair B: Stability vs. Tracking New Evidence.**
      *   *Conflict:* Science improves; lists must change. But management needs stasis.
      *   *Choice:* **Stability with Scheduled Revision.** Lock the list for the duration of the management plan (e.g., 5 years). New taxonomic evidence is logged but does not trigger legal reclassification until the plan renewal. This prevents "moving goalposts" in grant reporting.

  **3. Separability of Metaphysics and Practice**
  *   **View:** This separability is a **real desideratum**, not a cop-out.
  *   **Reasoning:** You are not managing "Species" (an ontological category); you are managing "Conservation Units" (a functional category). Insisting that the practical list must mirror the metaphysical reality is what caused your 30% fluctuation problem. By decoupling them, you acknowledge that the *list* is a tool for resource allocation, while the *biology* is the reality being allocated. The requirement is that the tool must not damage the reality (e.g., by protecting a name while the population vanishes). Separability allows you to fix the tool while the science improves.

  ---

  ### Part III: The Check (Concept Evaluation)

  How do the standard accounts fare against this specification?

  *   **Biological Species Concept (Interbreeding):** **Fails.** Violates Requirement 1 (Asexuals/Prokaryotes) and 2 (Polyploidy). It collapses the distinction in ring species (Requirement 4).
  *   **Phylogenetic Species Concept (Diagnosable Clusters/Monophyly):** **Fails.** Violates Requirement 6 (Evidential Poverty—requires too much data) and 7 (Stability—phylogenies change constantly with new markers). It tends to oversplit ring species (Requirement 4).
  *   **Ecological Species Concept:** **Partial Pass.** Good for Requirement 3 (Lichens/Function). **Fails** on Requirement 6 (hard to measure niche overlap for rare species) and 7 (niches shift).
  *   **General Lineage Concept:** **Partial Pass.** Metaphysically robust (Requirement 5), but **Fails** Requirement 6 (Operationalizability). It tells you what a species *is*, not how to *find* one with a hand lens.
  *   **Outright Pluralism:** **Passes** biology, **Fails** administration. It satisfies Requirement 1 and 3, but violates Requirement 7. You cannot put "Species Concept A applies here, Concept B there" into a grant application without inviting audit challenges.

  **The Exclusionary Requirement:**
  The single requirement that does the most work in excluding the familiar accounts is **Requirement 6: Operationalizability under Evidential Poverty.**
  Most modern theoretical accounts (especially Phylogenetic and General Lineage) assume access to data (genomes, population stats) that a land trust does not have. They define species based on *ideal* knowledge. Your specification demands a definition that works under *actual* ignorance. This excludes any concept that requires resolving deep phylogeny or measuring gene flow to assign a name.

  ### Summary Recommendation

  Do not adopt a "Species Concept." Adopt a **"Conservation Unit Protocol."**

  Define your list entries as: *"The smallest lineage or functional unit identifiable via [Field Method X] that maintains distinct ecological function or evolutionary potential."*

  This meets the legal need for a name, the biological need for lineage/function, and the practical need for a decision procedure that works when the sequencer is broken and the budget is cut. It accepts that the "30% shift" is not an error in your math, but an artifact of asking biology to provide administrative precision it cannot supply. Fix the administrative container, not the biological content.
