answer: |-
  # Take-Home Final: Formal Epistemology
  **Topic:** Diachronic Rationality and the Reflection Principle  
  **Time Budget:** 48 Hours  
  **Word Limit:** 1,500 words maximum  

  **Question 1**  
  Consider the following protocol. A fair coin is tossed. If Heads, you are woken once (Monday). If Tails, you are woken three times (Monday, Wednesday, Friday). Between awakenings, an amnesia-inducing drug ensures you cannot distinguish one awakening from another, nor remember previous ones. At each awakening, you are reminded of the protocol but not the day or coin outcome. After the experiment concludes, you are told the coin result ($t_2$). Twenty-four hours later, a second drug erases your memory of that announcement, though you retain knowledge that the experiment occurred ($t_3$). Let $P_0, P_1, P_2, P_3$ represent your credence function at: ($t_0$) prior to the experiment; ($t_1$) during an awakening; ($t_2$) upon hearing the result; ($t_3$) after forgetting the result. Let $H$ be the proposition that the coin landed Heads.

  (a) State van Fraassen's Reflection Principle formally, including the standard restriction on probability values.  
  (b) Prove that Reflection follows if you are certain your later evidence will be a cell of a partition refining your current evidence and you will update by conditionalization.  
  (c) Compute $P_0(H)$, $P_2(H)$, and $P_3(H)$. Then, determine what Reflection requires of $P_1(H)$, contrasting this with the credence yielded by weighting outcomes by the number of awakenings.  
  (d) Diagnose the tension in (c). Is the failure of Reflection in the $t_0 \to t_1$ transition due to information loss (like $t_2 \to t_3$) or self-locating uncertainty? Argue whether the necessary proviso to save Reflection is principled.

  ***

  # Model Answer

  **Reflection Principle:** For any proposition $A$ and time $t < t'$, an agent's current credence function $P_t$ should satisfy $P_t(A \mid P_{t'}(A) = x) = x$, for all $x$ such that $P_t(P_{t'}(A) = x) > 0$.

  **Proof of Pure Learning:** Suppose the agent is certain at $t$ that her evidence at $t'$ will be one of a partition $\{E_i\}$ refining her current evidence, and she will update by conditionalization. Then $P_{t'}(A) = P_t(A \mid E_i)$ whenever $E_i$ obtains. The event $P_{t'}(A) = x$ is equivalent to the union of cells $E_k$ such that $P_t(A \mid E_k) = x$. By the law of total probability:
  $$P_t(A \mid P_{t'}(A)=x) = \frac{P_t(A \cap \bigcup E_k)}{P_t(\bigcup E_k)} = \frac{\sum P_t(A \mid E_k)P_t(E_k)}{\sum P_t(E_k)}$$
  Since $P_t(A \mid E_k) = x$ for all such $k$, this simplifies to $x \cdot \frac{\sum P_t(E_k)}{\sum P_t(E_k)} = x$. Thus, Reflection holds for pure learning.

  **Application:** $P_0(H) = 1/2$ by the fairness of the coin. At $t_2$, $P_2(H)$ is $1$ (if told Heads) or $0$ (if told Tails). At $t_3$, memory of the result is erased; since no new relevant evidence distinguishes $t_3$ from $t_0$, $P_3(H)$ returns to $1/2$.
  At $t_1$, the "counting" method weights outcomes by awakenings: 1 Heads-awakening vs. 3 Tails-awakenings. This yields $P_1(H) = 1/4$. However, at $t_0$, the agent is certain that at $t_1$ her credence will be $1/4$ (if she adopts this policy). Reflection requires $P_0(H \mid P_1(H)=1/4) = 1/4$. Since $P_0(H)=1/2$, Reflection is violated. To satisfy Reflection, $P_1(H)$ must equal $P_0(H) = 1/2$.

  **Diagnosis:** The tension arises because Reflection assumes the later self is at least as informed as the earlier self. The $t_2 \to t_3$ transition involves straightforward forgetting (information loss), which standardly exempts Reflection. The $t_0 \to t_1$ transition is contested. If $t_1$ involves self-locating uncertainty, the agent loses indexical information (knowing it is $t_0$). If this counts as information loss, Reflection does not apply, permitting $P_1(H)=1/4$. If it counts as mere uncertainty within a fixed partition, Reflection applies, forcing $P_1(H)=1/2$. A principled proviso must distinguish between losing worldly information (forgetting the result) and losing self-locating information (forgetting the time). If both count as information loss, Reflection is restricted to non-centred propositions; if only the former counts, Reflection forces the "Halfer" view. The restriction is principled only if one accepts that self-locating beliefs do not track truth in the same way as ordinary propositions.

  ***

  # Marking Scheme (25 Marks Total)

  **1. Formal Statement (5 Marks)**
  *   **Required Move:** Correctly states $P_t(A \mid P_{t'}(A) = x) = x$ and explicitly includes the restriction that $P_t(P_{t'}(A) = x) > 0$.
  *   **Typical Error:** Omitting the positive probability restriction or stating the principle as an unconditional expectation ($P_t(A) = E[P_{t'}(A)]$) without the conditional form.

  **2. Proof of Pure Learning (5 Marks)**
  *   **Required Move:** Demonstrates that if later evidence is a partition cell and updating is conditionalization, the event $P_{t'}(A)=x$ is a union of cells where $P_t(A \mid E_i)=x$, allowing $x$ to factor out of the total probability sum.
  *   **Typical Error:** Asserting that conditionalization implies Reflection without showing the union-of-cells derivation or confusing the partition of evidence with the partition of credence values.

  **3. Certainty vs. Expectation (5 Marks)**
  *   **Required Move:** Notes that while the "no-drift" expectation principle ($P_t(A) = \sum x \cdot P_t(P_{t'}(A)=x)$) is generally weaker, it collapses into the full Reflection Principle when the agent is *certain* of the later credence (probability 1 on a single $x$), making averaging inapplicable.
  *   **Typical Error:** Treating the expectation principle as sufficient to resolve the case without noting that certainty collapses the distinction, or claiming averaging applies despite the certainty.

  **4. Computation and Conflict (5 Marks)**
  *   **Required Move:** Correctly identifies $P_0=1/2$, $P_3=1/2$, and the counting method yields $P_1=1/4$. Explicitly states that if the agent is certain of adopting the counting method, Reflection forces $P_1=1/2$, creating a contradiction with the counting method.
  *   **Typical Error:** Calculating $P_1=1/3$ (standard Beauty) instead of $1/4$ (per the 1 vs 3 protocol), or failing to note that Reflection actively rules out the $1/4$ calculation rather than remaining neutral.

  **5. Proviso Dilemma (5 Marks)**
  *   **Required Move:** Identifies that saving Reflection requires a proviso excluding information loss. Argues whether $t_0 \to t_1$ counts as information loss (forgetting time/location) comparable to $t_2 \to t_3$ (forgetting result), and assesses if this distinction is principled or ad hoc.
  *   **Typical Error:** Claiming Reflection simply "fails" without analyzing the proviso, or asserting one side of the dilemma (e.g., "Halfer is right") without justifying the status of self-locating information loss.

  ***

  # Grading Distinctions

  **A Answer (21–25 Marks):** Executes all five moves with precision. The proof in (b) is rigorous. In (d), the candidate clearly articulates the dilemma: either Reflection is restricted (admitting self-locating belief is not "knowledge" in the relevant sense) or the counting method is irrational. They recognize that marking $t_0 \to t_1$ as "forgetting" is the only way to save Reflection while keeping the $1/4$ credence.

  **B Answer (15–20 Marks):** States the principle and computes the credences correctly but struggles with the proof in (b) (e.g., hand-waves the partition argument). In (d), they identify a tension but fail to distinguish clearly between the forgetting transition ($t_2 \to t_3$) and the centred transition ($t_0 \to t_1$), or they treat the expectation principle as distinct from Reflection even under certainty.

  **Failing Answer (<15 Marks):** Recites the definition of Reflection or the Sleeping Beauty problem without applying it to the specific 1-vs-3 protocol. Fails to compute the specific probabilities ($1/4$ vs $1/2$). Treats Reflection as a constraint on unconditional credence only, or claims Reflection is universally valid without addressing the forgetting proviso.
