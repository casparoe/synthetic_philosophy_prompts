answer: |-
  The section must present the Allais preference as a normative threat to the independence axiom rather than a mere descriptive embarrassment, forcing students to confront the cost of violating logical consistency instead of dismissing their intuitions as psychological noise.

  **The Carrying Example**
  Use the **Original Common-Consequence Formulation** (1A/1B vs. 2A/2B), not the Common-Ratio variant. The Common-Consequence structure allows you to visually demonstrate the "cancellation" of the common probability mass, which is the intuitive core of the independence axiom. The example must **lack specific dollar amounts** tied to real-world wealth (use "Vacation Days" or "Abstract Points") to preemptively neutralize the wealth-effect objection your colleague raises; if the prizes are abstract units of utility, concavity of wealth cannot be the explanation. The example must **retain the certainty option** in the first pair (1A) because the "certainty effect" is the psychological engine driving the violation, and removing it dulls the intuitive conflict you need to exploit.

  **Sequence and Dependency Structure**
  1.  **Minutes 0–10: Elicitation (The Trap).** Present the two choice pairs without mentioning expected utility or axioms. Ask for a show of hands for 1A vs 1B, then 2A vs 2B. Most will choose 1A (certainty) and 2B (higher expected value). Do not judge this yet; validate it as a common intuition.
      *   *Dependency:* You must establish the intuitive preference *before* introducing the theory, otherwise students will reverse-engineer their intuition to match the math.
      *   *Misconception Head-off (Wealth/Stakes):* By using abstract units here, you block the "stakes are too high" objection before it forms. If a student raises it, note that the units are small relative to lifetime wealth by design.

  2.  **Minutes 10–20: The Contradiction (The Math).** Show algebraically that no utility function $u$ and probability weighting can satisfy both choices simultaneously under Expected Utility Theory. Derive the inequality contradiction ($u(1M) > \dots$ and $u(1M) < \dots$).
      *   *Dependency:* Students must see the mathematical impossibility before you tell them which axiom is responsible. This creates the tension.
      *   *Misconception Head-off (EU Refuted):* Frame this not as "EU is wrong" but as "EU and this Preference are incompatible." This prevents the takeaway that the theory is dead; it is merely conditional on the axiom.

  3.  **Minutes 20–30: The Independence Axiom (The Logic).** Define the axiom formally ($L \succeq L' \iff \alpha L + (1-\alpha)L'' \succeq \alpha L' + (1-\alpha)L''$). Map the Allais choices onto this structure to show exactly where the violation occurs (the common 89% chance of 1M).
      *   *Dependency:* You cannot define the axiom meaningfully until they see the specific choices it governs.
      *   *Misconception Head-off (Transitivity):* Explicitly distinguish Independence from Transitivity here. State: "Transitivity ranks options; Independence demands stability when options are mixed with a third. Your ranking might be transitive, but it is not independent."

  4.  **Minutes 30–40: The Reformulation (The Visualization).** Redraw the choices as two-stage lotteries where the common consequence is a separate branch that resolves first. Show that if the common branch resolves, the remaining choice is identical in both pairs. Argue that preferring 1A over 1B but 2B over 2A implies letting an irrelevant outcome dictate the choice between the remaining options.
      *   *Dependency:* This visualizes the abstract axiom from the previous step. It is the bridge between math and normative force.
      *   *Misconception Head-off (Regret):* When the student argues for regret, point out that in this reformulation, the "regret" depends on an event that is probabilistically identical in both options. If they appeal to regret, they are admitting their utility depends on foregone outcomes, not final consequences, which violates the consequentialist framework of vNM. Do not debate regret's validity; classify it as a violation of the model's scope.

  5.  **Minutes 40–50: The Normative Stakes (The Choice).** Conclude that maintaining the Allais preference requires abandoning the independence axiom, which invites dynamic inconsistency (Dutch Books). Frame the axiom not as a law of nature but as a commitment to consistency.
      *   *Dependency:* This discussion only works after they understand what is being sacrificed (consistency) versus what is being kept (intuition).
      *   *Misconception Head-off (Rationality Defense):* If a student insists the preference is defensible, ask them to accept the normative cost: "You are defending a preference structure that can be money-pumped." This shifts the burden from "Is the axiom true?" to "Are you willing to pay the consistency price?"

  **Exclusions**
  Openly refuse to cover **Prospect Theory**, as it explains the psychology but distracts from the normative evaluation of the axiom. Refuse to cover the **vNM Proof Machinery**, as representation theorems are not the issue; the axiom's plausibility is. Refuse to engage in the metaphysical dispute over **Consequentialism vs. the Sure-Thing Principle**, as this collapses into the independence discussion you are already having and will consume the remaining time without adding clarity.

  **Final Question**
  In the last five minutes, ask: "If you maintain the Allais preference, you must accept that your choice depends on the outcome of a chance event that is probabilistically irrelevant to the difference between the options; what specific principle of rational choice does this violate, and are you willing to accept the dynamic inconsistency that follows?" This forces them to articulate the trade-off between intuition and consistency rather than simply stating a conclusion.
