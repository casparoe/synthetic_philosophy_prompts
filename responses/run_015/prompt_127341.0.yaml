answer: |-
  ### Brainstorming & Conceptual Setup

  Before we lock in a principle, let's briefly map the philosophical terrain using terms that align with your engineering background. We are dealing with three main competing frameworks:

  1.  **Propositional vs. Acquaintance Knowledge:**
      *   *Propositional:* Knowledge "that" something is the case (e.g., "Red light is 700nm"). This is like reading a spec sheet or database schema.
      *   *Acquaintance:* Knowledge by direct experience (e.g., "This is what red looks like"). This is like running the code and seeing the UI.
      *   *Relevance:* Your Case 5 explicitly uses this distinction.

  2.  **Physicalism vs. Property Dualism:**
      *   *Physicalism:* Everything is physical. If you know all the physics, you know everything. Any "new" knowledge Mary gains is just a new way of accessing the same old facts (like viewing the same data via a CLI vs. a GUI).
      *   *Dualism:* There are non-physical properties (qualia). Mary learns a new fact about the universe that physics missed.
      *   *Relevance:* Your verdicts on Mary (Case 1) and the Anosmic Scientist (Case 3) lean dualist (something is missing from physical knowledge), but your Source-Code case (Case 2) leans physicalist (code exhausts the reality).

  3.  **Functionalism vs. Biological Naturalism:**
      *   *Functionalism:* If a system processes information correctly, it has mental states. (Could apply to the AI in Case 4).
      *   *Biological Naturalism:* Only biological brains generate genuine experience. (Explains why Mary/Scientist differ from the Source-Code).
      *   *Relevance:* This is the key to reconciling Case 2 vs. Case 3.

  ### Step-by-Step Case Mapping

  Let's trace your intuitions through these concepts to find the pattern.

  *   **Case 1 (Mary):** You say she learns something new.
      *   *Analysis:* She has all the *propositional* data (physics/neural specs). She lacks the *acquaintance* data (the UI).
      *   *Implication:* Physical specs $\neq$ Experiential reality for biological humans.

  *   **Case 2 (Source-Code):** You say you learn nothing.
      *   *Analysis:* You have the *propositional* data (code). You see the *output* (monitor).
      *   *Crucial Detail:* You already know what "seeing a monitor" feels like. You possess the *phenomenal concepts* for pixels and color.
      *   *Implication:* If you already have the "UI drivers" installed in your brain, seeing the output adds no new qualitative knowledge, only confirmation.

  *   **Case 3 (Olfactory):** You say she learns something new.
      *   *Analysis:* Identical to Mary. She lacks the "drivers" for smell.
      *   *Implication:* Biological modality acquisition creates a knowledge gap that physics doesn't bridge.

  *   **Case 4 (Predictive System):** You are undecided.
      *   *Analysis:* This system models a human perfectly but has no sensors.
      *   *Tension:* If it's just code (like Case 2), it learns nothing. If it's conscious (like Case 1), it learns something. Your indecision reflects the unresolved question of AI consciousness.

  *   **Case 5 (Report-Reader):** You distinguish "acquaintance" from "propositional."
      *   *Analysis:* This confirms you view experience as a specific *mode of access*, not just more data.

  ### The Proposed Principle

  Based on your verdicts, I propose **The Phenomenal Access Principle**. This principle attempts to harmonize your physicalist intuition about software with your dualist-leaning intuition about biological experience.

  **The Phenomenal Access Principle:**

  1.  **The Completeness Clause:** Complete physical or structural knowledge provides all *propositional* information about a system's state and output.
      *   *Motivated by:* **Case 2 (Source-Code).** You knew everything about the image via the code; the visual render added no new facts.
  2.  **The Acquaintance Clause:** Direct experience provides *acquaintance* knowledge, which is distinct from propositional information.
      *   *Motivated by:* **Case 5 (Report-Reader).** Reading descriptions isn't the same as smelling.
  3.  **The Modality Gap Clause:** A subject gains *new* knowledge (beyond confirmation) from direct experience only if they lack prior **phenomenal access** to that specific sensory modality.
      *   *Motivated by:* **Case 1 (Mary) & Case 3 (Olfactory).** They lacked the modality (color/smell) entirely.
      *   *Contrast:* In **Case 2**, you already had visual modality access; you just hadn't seen *that specific pattern*. Since you know what "seeing" is, the experience was redundant knowledge-wise.
  4.  **The Substrate Constraint:** Genuine phenomenal access (acquaintance) requires a biological substrate capable of consciousness. Computational processing alone constitutes data manipulation, not experience.
      *   *Motivated by:* The contrast between **Case 2** (software = no new knowledge) and **Case 1/3** (humans = new knowledge).

  ---

  ### Application: The Waterfall Case

  **Scenario:** A programmer writes a perfect physics simulation of water flowing over rocks, runs it, then stands beside a real waterfall for the first time.

  **Applying the Principle:**

  1.  **Check Propositional Knowledge (Clause 1):** The programmer knows all the physical facts about the water via the simulation code. They know the trajectory of every droplet.
  2.  **Check Modality Gap (Clause 3):** Does the programmer lack prior access to the sensory modalities involved?
      *   *Vision/Hearing:* Presumably, the programmer has seen water and heard noise before. They possess the phenomenal concepts for "wet," "roaring," and "sparkle."
      *   *Immersion:* However, a screen simulation lacks **tactile** (mist on skin), **olfactory** (smell of wet rock), and **vestibular** (sense of scale/vibration) inputs.
  3.  **Check Substrate (Clause 4):** The programmer is biological, so they are capable of acquaintance.

  **Verdict:**
  According to the principle, the programmer **will learn something new**, but not because the physics were unknown. They learn something new because the *real waterfall* engages sensory modalities (touch, smell, full-body vibration) that the *simulation* (visual/audio on a monitor) did not fully instantiate.

