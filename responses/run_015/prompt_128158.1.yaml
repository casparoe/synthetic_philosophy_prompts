  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Nature of Emotion
  **Participants:** Priya (Judgment/Construal View), Marco (Bodily-Feeling View)
  **Date:** [Current Date]

  ## PREAMBLE
  This document records the points of convergence and divergence between two competing theoretical frameworks regarding emotion. The goal is not consensus on a single definition, but precise mapping of the disagreement to facilitate productive testing. We agree that emotions are natural phenomena requiring explanation, and that our theories are attempts to model the same underlying reality, even if we prioritize different features.

  ---

  ## PART I: AGREED CLAIMS
  *The following claims are endorsed by both participants. They are intended to rule out caricatures and establish a shared baseline for the debate.*

  1.  **Intentionality:** Typical emotional episodes are directed at an object (a thing, person, event, or state of affairs), even if that object is imagined, remembered, or vaguely specified.
  2.  **Functional Role:** Emotions play a systematic role in prioritizing attention, organizing memory, and motivating action (or inhibition of action).
  3.  **Assessability:** Emotions are not merely brute facts; they can be assessed as *fitting* or *unfitting* relative to the context. (We reserve the term "rational" for the disagreement section, as we disagree on what makes an emotion rational).
  4.  **Bodily Correlation:** Standard emotional episodes involve systematic changes in the autonomic nervous system, skeletal muscle posture, and visceral state. Neither side claims these changes are random or irrelevant.
  5.  **Phenomenology:** There is "something it is like" to undergo an emotion. A theory of emotion must account for the subjective character of the experience, not just the behavioral output.
  6.  **Developmental Continuity:** Infants and non-human animals undergo emotional states. However, the cognitive sophistication and reflective capacity accompanying these states may differ from adult human emotions.
  7.  **Distinction from Moods:** Emotions are distinct from moods. Moods are typically longer-lasting, less intense, and lack a specific intentional object (e.g., being irritable vs. being angry *at* someone).
  8.  **Multiple Realizability:** An emotional kind (e.g., "fear") can occur with variation in intensity, duration, and specific physiological signature across different instances and individuals.

  ---

  ## PART II: THE DISAGREEMENTS TABLE
  *This table isolates the specific points of contention. We agree to treat these as live hypotheses to be tested against the bearing cases in Part III.*

  | The Crux | Marco's Claim (Bodily-Feeling) | Priya's Claim (Judgment/Construal) | Substantive or Verbal? | Agreed Bearing Case | Predictions (Recorded Now) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Constitution** | The emotion *is* (or is constituted by) the perception of the bodily change. Without the feeling of the body, there is no emotion, only a cold assessment. | The emotion *is* (or is constituted by) the evaluative construal/judgment. Bodily changes are typical effects or accompaniments, but not the emotion itself. | **Substantive.** It concerns the metaphysical identity of the state, not just the label. | **The Denervated Subject** (See Part III). | **Marco:** Subject reports no emotion or "hollow" pseudo-emotion; behavior becomes utilitarian/calculating.<br>**Priya:** Subject reports normal emotions; behavior remains emotionally guided. |
  | **2. Rationality vs. Causality** | Emotions rationalize action by providing motivational force (desires/urges). Calling them "irrational" is a category error; they are causal drivers, not premises. | Emotions rationalize action by providing evaluative premises. They can be irrational if they contradict the subject's own better judgments or evidence. | **Substantive.** Concerns the role of emotion in reasoning. | **Recalcitrance** (See Part III). | **Marco:** Recalcitrance is a conflict between two bodily states or a bodily state vs. a belief. The emotion remains "real" fear.<br>**Priya:** Recalcitrance is a fragmentation of the mind. The emotion is an "arational" surge or a conflicting subconscious judgment. |
  | **3. The Object** | The primary object of an emotion is often the *situation* triggering the bodily change, but the *content* of the emotion is the bodily feeling itself. | The primary object of an emotion is the *evaluative property* of the situation (e.g., the danger, the insult). | **Verbal/Substantive Mix.** Disagreement on whether "object" means "cause" or "intentional content." | **Emotion with No Situation** (See Part III). | **Marco:** If the body feels fear, it is fear (or raw affect), even without an object.<br>**Priya:** Without an object/evaluation, it is mere undifferentiated arousal, not an emotion. |
  | **4. Unconscious Emotion** | Unconscious emotion is difficult to posit. If you don't feel the body, you aren't emoting. You might be *primed*, but not emoting. | Unconscious emotion is common. One can hold an evaluative judgment (e.g., repressed anger) without conscious awareness. | **Substantive.** Concerns the necessity of phenomenology. | **Offline Emotions** (See Part III). | **Marco:** Dread about next Tuesday involves current bodily anticipation. If no body, no emotion.<br>**Priya:** Dread is a current evaluative stance toward a future event. Body is optional. |

  ---

  ## PART III: BEARING CASES
  *These are the specific scenarios we agree will test the claims above. We commit to interpreting the results according to the predictions listed in Part II.*

  ### 1. Recalcitrance
  **Scenario:** A subject stands on a glass-bottomed walkway. They sincerely assert, "I know this is safe," and wish to stand there. Yet they freeze, tremble, and must be helped off.
  **The Test:** Is this fear?
  *   **If the subject reports NO bodily change:**
      *   **Priya:** This supports the view that the emotion is the conflicting assessment (subconscious danger vs. conscious safety).
      *   **Marco:** This undermines the view. If there is no bodily feeling, there is no emotion, only a behavioral glitch.
  *   **If the subject reports STRONG bodily change:**
      *   **Marco:** This is paradigm fear. The judgment of safety is irrelevant to the emotion's existence.
      *   **Priya:** This is a "fragmented" mind. The emotion is irrational because it conflicts with the avowed judgment.

  ### 2. The Denervated Subject
  **Scenario:** A subject has a condition blocking interoceptive feedback (heart rate, gut, respiration changes do not reach consciousness). Their cognitive ability to assess danger, plan, and speak is intact.
  **The Test:** Do they have emotions?
  *   **Marco's Prediction:** They will report feeling "nothing" emotionally, even in high-stakes situations. Their decision-making will become purely utilitarian, lacking emotional bias.
  *   **Priya's Prediction:** They will report normal emotional experiences based on their situational assessments. Their decision-making will retain emotional weighting (e.g., avoiding harm because it is "bad," not because it "feels bad").

  ### 3. Emotion with No Situation
  **Scenario:** A subject in a safe, empty room is administered a drug or stimulation that induces the exact autonomic profile of terror (racing heart, sweating, tension). They are told this is a side effect. They have no thought of danger.
  **The Test:** Is this fear?
  *   **Priya's Prediction:** No. This is undifferentiated arousal. Fear requires an object (something feared). Without the construal of danger, it is just physiology.
  *   **Marco's Prediction:** Yes, or at least the core of it. It is the feeling of fear. The subject might search for an object to explain the feeling, but the emotion exists prior to that search.

  ### 4. Fear of Fear (Panic Disorder)
  **Scenario:** A subject is not afraid of external objects (heights, spiders) but is terrified of entering a state of panic. The object of the fear is their own bodily arousal.
  **The Test:** What is the intentional structure?
  *   **Priya's Prediction:** This confirms the Judgment view. The subject is making a negative evaluation of their own physiology ("This heart rate is dangerous"). The emotion is about the body, but constituted by the judgment *about* the body.
  *   **Marco's Prediction:** This confirms the Bodily view. It is a feedback loop. The bodily feeling triggers a reaction, which causes more bodily feeling. The "object" is secondary to the somatic spiral.
  *   **Joint Note:** We agree this case challenges simple versions of both theories. Priya must explain how a judgment about the body differs from a judgment about the world. Marco must explain how one feels fear *of* a feeling without an infinite regress.

  ### 5. Fiction and Music
  **Scenario:** A subject weeps at a film they know is fictional, or feels sadness from instrumental music with no representational content.
  **The Test:** Where is the object/evaluation?
  *   **Priya's Prediction:** The subject is construing the fictional events *as if* they were real, or evaluating the music's structure as "loss-like." The evaluative component is present, even if the belief in existence is suspended.
  *   **Marco's Prediction:** The music/film directly induces the bodily pattern. The "sadness" is the feeling of the pattern. The knowledge of fiction is a separate cognitive track that fails to inhibit the somatic response.

  ### 6. Offline Emotions
  **Scenario:** Dread about a meeting next Tuesday; embarrassment about a memory from 2009. No immediate threat, minimal physiological arousal.
  **The Test:** Can emotion exist without current bodily engagement?
  *   **Marco's Prediction:** These are not full emotions but "dispositional" states. To become real emotions, they must be re-embodied (e.g., by vividly imagining the scene until the body reacts).
  *   **Priya's Prediction:** These are full emotions. The evaluative stance toward the past/future is sufficient. The lack of intense physiology is a matter of intensity, not kind.

  ---

  ## PART IV: NOTE ON THE "PERCEPTUAL" OPTION
  *During the drafting of this document, we addressed the "Perceptual Theory of Emotion" (the idea that emotions are perceptions of value, analogous to vision).*

  **Status:** We agree this is not a third camp that dissolves our disagreement, but rather a terminological battlefield where our disagreement relocates.

  1.  **Priya's Position:** She acknowledges her view is often classified as a "Perceptual Theory" (emotions as perceptions of value). However, she insists that "perception" here implies a *conceptual* or *propositional* construal (seeing-as), which retains the link to rationality and reasons. She is not committed to emotions being non-cognitive.
  2.  **Marco's Position:** He argues that if "perception" means "registration of a property," he agrees, but insists the property being perceived is *internal* (bodily state), not *external* (value). If Priya means "perception of value" without bodily feeling, he rejects it as bloodless cognition.
  3.  **The Residual Dispute:** The dispute is not over whether emotions are "perceptual" in a loose sense. The dispute is over **what is being perceived** and **what constitutes the medium**.
      *   Is the medium the **Body** (Marco) and the object the **Self-State**?
      *   Is the medium the **Mind/Construal** (Priya) and the object the **World-Value**?
  4.  **Action Item:** We agree to stop using the word "perception" without qualification. When used, it must be specified as "Perception of Value" (Priya) or "Perception of Viscera" (Marco).

  ---

  ## SIGNATURES

  _________________________ (Priya)

  _________________________ (Marco)

  _________________________ (Facilitator)
