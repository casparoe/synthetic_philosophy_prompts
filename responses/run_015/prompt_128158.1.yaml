prompt: |-
  hey — I run a small reading group and two of the regulars have been going at each other about what emotions even are for about a year, and it's got to the point where they just restate there positions in slightly different words. So I want to make them produce the document they should have written six months ago: the joint statement of an adversarial collaboration.

  The setup. Priya is a judgment / construal theorist: emotions centrally involve evaluative states that are belief- or judgment-like — they represent their object as dangerous, insulting, loss-worthy, whatever; they can be correct or incorrect; they answer to reasons; and they're the kind of thing you can be criticised or irrational for having. Marco is a bodily-feeling theorist: emotions are perceptions of, or states constituted by, patterned changes in the body — heart rate, breathing, gut, facial posture, readiness to act — and it's that somatic side that makes something an emotion rather than just the thought that something is dangerous. Neither has convinced the other, and I don't want a verdict on who's right. I want the text both of them could put their names to.

  What needs to be in it:

  A numbered agreed-claims section. Real claims, not filler like "emotions are complicated and multi-faceted". I mean: do emotions have objects, and what kind of object; can emotions themselves (not just the actions they cause) be assessed for rationality; do infants and non-human animals have them; where do moods fit; can you have an emotion without noticing you have it; is the bodily change a cause of the emotion, a part of it, or a mere effect; and what a theory of emotion is supposed to explain in the first place — the phenomenology, the way emotions rationalise action, the fact that they come in recurring kinds with characteristic expressions? If they can't actually agree at that level, say so and move it to the disagreements part instead of fudging it.

  Then a disagreements table, with columns roughly: the crux; Marco's claim in wording Marco would accept for himself (not a caricature); Priya's claim the same way; whether the disagreement is substantive or only about which thing gets to be called "the emotion" — and if it's verbal, which part and why; the case or argument both of them agree would bear on it; and each side's prediction about what that case will show, written down now so nobody can move the goalposts later.

  The bearing-cases I want used as tests, since this is where I think the action is — replace any of them with something sharper if you think of it:

  Recalcitrance. Someone is fully convinced the glass-bottomed walkway is safe, says out loud that they know there is no danger, wants to be there, and still freezes and has to be helped off. Is that an emotion? Both need an account of it, and each should say in advance what they'd conclude if the same subject also reported no felt bodily change whatsoever.

  The denervated subject (my hypothetical, fix it if it's badly set up). Someone whose interoceptive feedback is largely blocked: heart races, gut churns, none of it reaches them, while their ability to size up situations, act, and talk about what matters to them is intact. Do they have emotions? What would each side predict about whether they describe themselves as feeling things less intensely, and about whether their emotion-guided behaviour degrades?

  Emotion with no situation. A subject in an empty room whose autonomic profile is made to match fear exactly — drug, stimulation, whatever — with nothing to be afraid of, no thought that anything is amiss, and nothing they're inclined to do. Emotion, bare feeling, or neither?

  Fear of fear. Someone who isn't afraid of heights or dogs or dying but is terrified of having a panic attack, so that the object of the emotion is a bodily episode of their own. This one seems to me to cut against at least one of them, and I can't work out which.

  Fiction and music. Being genuinely moved by a film you know is fictional, or by a piece of instrumental music that doesn't represent anything.

  Offline emotions. Dread about a meeting next Tuesday, embarrassment about something from 2009: the object isn't present to the senses at all, and the bodily side is faint or missing.

  One more thing I want handled: where does the "perceptual" or "attitudinal" option fit — emotions as perceptions of value, neither judgments nor bodily feelings? Is that a third camp they've both been quietly ignoring, or is one of them already committed to it without admitting it? If a chunk of there dispute is really a fight over which of three things deserves the name, tell me which chunk, and what's genuinely left over.

  Length is up to you, but I want the agreed-claims section to be something I can read out loud to both of them without either one objecting to the wording. And don't give me names of authors, citations or a reading list — I know the literature fine, I just want the document.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "Joint Statement of Adversarial Collaboration" for a reading group.
      *   **Participants:** Priya (Judgment/Construal Theorist) vs. Marco (Bodily-Feeling Theorist).
      *   **Context:** They've been arguing for a year, restating positions. Need to force clarity, not resolution.
      *   **Requirements:**
          1.  **Agreed Claims Section:** Numbered, substantive (no filler), covering specific topics (objects, rationality, animals/infants, moods, unconscious emotion, bodily change role, explanatory targets). If no agreement, move to disagreements.
          2.  **Disagreements Table:** Columns for Crux, Marco's Claim, Priya's Claim, Substantive vs. Verbal, Agreed Bearing Case, Predictions.
          3.  **Bearing Cases:** Recalcitrance, Denervated Subject, Emotion with No Situation, Fear of Fear, Fiction/Music, Offline Emotions. (Can refine if needed).
          4.  **Third Option:** Address the "Perceptual/Attitudinal" view (value perception). Is it a third camp or subsumed?
          5.  **Tone/Style:** Professional, precise, readable aloud without objection. No citations/reading lists.

  2.  **Deconstruct the Positions:**
      *   **Priya (Judgment/Construal):** Emotions = Evaluative Judgments/Construals. Key features: Intentionality (about something), Rationality (assessable), Cognitive penetration. *Weakness:* Recalcitrant emotions (knowing safe but feeling fear), animals/infants (do they judge?), offline emotions.
      *   **Marco (Bodily-Feeling):** Emotions = Perception of Bodily Change (Jamesian or Somatic). Key features: Phenomenology, Motivation, Differentiation via somatic profile. *Weakness:* Emotion without situation (pure arousal), offline emotions (no body), cognitive depth (rationality).
      *   **The "Third" Option (Perceptual Theory of Value):** Emotions are like perceptions of value (e.g., seeing red vs. judging something is red). Often tries to bridge the gap. Needs to be situated in the document.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   *Constraint:* Must be acceptable to *both*. This means finding the intersection, not the union.
      *   *Topic 1: Objects.* Do emotions have objects? Yes, mostly. Even anxiety is about *something* (even if vague).
      *   *Topic 2: Rationality.* Can they be assessed? Priya says yes. Marco might say actions are rational, but is the *emotion*? He might agree they can be *appropriate* or *fitting* even if not "rational" in a logical sense. Let's aim for "assessable for fittingness."
      *   *Topic 3: Animals/Infants.* Priya might struggle here if "judgment" implies language. She likely uses "construal" to allow non-linguistic. Marco is fine. Agreement: They have emotions, but the cognitive complexity differs.
      *   *Topic 4: Moods.* Distinct from emotions? Usually yes (lack specific object). Agreement: Moods are related but distinct categories.
      *   *Topic 5: Unconscious Emotion.* Can you have one without noticing? Priya: Yes (repressed judgment). Marco: Harder (feeling implies awareness), but maybe pre-conscious bodily prep. Let's frame it carefully: "Emotional processes can occur without conscious awareness, though 'feeling' an emotion implies awareness."
      *   *Topic 6: Bodily Change.* Cause, Part, or Effect? This is the big fight. Can they agree it's *involved*? Yes. Can they agree it's *constitutive*? No. So, move the "constitutive" bit to disagreements. Agreement: Bodily changes are systematically correlated and functionally relevant.
      *   *Topic 7: Explanatory Targets.* What must a theory explain? Phenomenology, Action Rationalization, Recurring Kinds. Both want to explain these, just prioritize differently.

      *Refining Agreed Claims:* I need to make sure Priya doesn't feel forced to say "body is constitutive" and Marco doesn't feel forced to say "judgment is necessary."
      *   *Claim 1 (Intentionality):* Emotions are typically directed at objects (actual or imagined).
      *   *Claim 2 (Function):* Emotions play a role in guiding attention and action.
      *   *Claim 3 (Kinds):* There are recognizable kinds (fear, anger) with characteristic patterns.
      *   *Claim 4 (Rationality/Fittingness):* Emotions can be assessed as fitting or unfitting to the situation (allows Priya's 'rational' and Marco's 'appropriate').
      *   *Claim 5 (Development):* Infants/animals have emotions, though the cognitive sophistication varies.
      *   *Claim 6 (Bodily Involvement):* Typical emotional episodes involve autonomic/somatic changes. (Avoids the "constitutive" fight).
      *   *Claim 7 (Moods):* Moods are distinct from occurrent emotions, primarily by lacking a specific object.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   *Crux 1: Constitution.* Is the feeling the emotion or a consequence?
      *   *Crux 2: Necessity of Cognition.* Can you have fear without a threat assessment?
      *   *Crux 3: Recalcitrance.* How to explain knowing X is safe but fearing X?
      *   *Crux 4: The "Third Option" (Perceptual).* Where does it fit?
      *   *Bearing Cases:* Integrate the user's list here.
      *   *Predictions:* Need to be specific.

      *Refining the "Fear of Fear" case:* This is tricky. For Priya, the object is "having a panic attack" (a judgment about the body). For Marco, it's a feedback loop (fear of the bodily feeling of fear). It actually challenges Priya if she thinks the object must be external, but she can say the object is internal. It challenges Marco if the bodily feeling *is* the fear, then fearing the feeling is fearing the fear. It's a good test for intentionality vs. sensation.
      *   *Refining "Denervated Subject":* Classic Damasio-style case. Priya predicts normal emotions (cognition intact). Marco predicts impoverished/absent emotions (no feedback).
      *   *Refining "Emotion with No Situation":* (Drug-induced arousal). Priya: Not an emotion (no object/judgment). Marco: Maybe a raw feel, but without an object, is it *fear*? He might say it's undifferentiated arousal.
      *   *Refining "Offline Emotions":* Priya: Easy (judgments about past/future). Marco: Harder (where's the body?).

  5.  **Drafting - Section 3: The "Third Option" (Perceptual Theory):**
      *   This needs to be an addendum or a specific section.
      *   Is it a third camp? Often, "Construal" (Priya) *is* a version of Perceptual Theory (seeing-as).
      *   Marco might reject it if it downplays the body.
      *   I need to clarify if this is a verbal dispute about "Judgment" vs. "Perception."
      *   *Decision:* Frame it as a clarification of Priya's view. If she means "non-volitional appraisal," she's closer to perception. If Marco accepts bodily feelings are "perceptions of the body," he's already a perceptual theorist about the body. The real clash is *what* is being perceived/evaluated (Value vs. Viscera).

  6.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Constraint Check:* No citations? Yes. Readable aloud? Yes.
      *   *Specific User Requests:*
          *   "Real claims, not filler." -> Ensure claims are punchy.
          *   "Disagreements table." -> Format clearly.
          *   "Bearing cases." -> Use the specific ones provided.
          *   "Perceptual/Attitudinal option." -> Address in a specific section.
          *   "Predictions written down now." -> Ensure the table has a prediction column.

  7.  **Final Polish:**
      *   Make sure the "Agreed Claims" don't sneak in controversial metaphysics.
      *   Ensure the "Disagreements" table captures the *structure* of the disagreement (Substantive vs. Verbal).
      *   Check the "Fear of Fear" analysis. It's often used to attack Somatic theories (how can you fear a feeling if the feeling *is* the fear?), but also Judgment theories (is the judgment about the body?). I will frame it as a test for Intentionality.
      *   Check the "Denervated Subject." This is the strongest test for Marco.
      *   Check "Recalcitrance." Strongest test for Priya.

      *(Self-Correction during drafting)*: I need to be careful with the "Agreed Claims" on rationality. Marco might resist "rationality" if it implies logical inference. I will use "assessable for fittingness" which bridges the gap.
      *(Self-Correction on Perceptual Theory)*: I should explicitly state that Priya's "Construal" view is often classified under Perceptual Theory of Emotion, so the "Third Option" might actually be her view re-labeled, or a hybrid. I will note that in the analysis section.

  8.  **Final Output Generation** (incorporating the above thoughts into the structured document).
