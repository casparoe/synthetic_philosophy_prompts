  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Strawson:* I must remind the user that Strawson *does* allow for impersonal indignation. The user's innovation isn't that institutions feel indignation, but that they instantiate the *logic* of blame without the *sentiment*. This is a "functionalist" reading of reactive attitudes.
      *   *Terminology:* "Bureaucratised reactive stances" is a bit clunky. Maybe "Institutional Reactive Stances"? No, stick to the user's term but suggest refining the definition.
      *   *Algorithmic Point:* I need to push hard on whether algorithms *blame*. Many philosophers (e.g., Danaher, Blum) argue algorithms cannot blame because they lack normative competence. The user needs to address this objection to make the example work.
      *   *British English:* Ensure spelling (formalise, programme, centre, etc.) and vocabulary (whilst, amongst, etc., though keep it natural).

