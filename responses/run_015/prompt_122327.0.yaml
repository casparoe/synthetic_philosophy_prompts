answer: |-
  1. The mapping
  The Hole Argument primarily establishes (c) No-determination: boundary data plus laws fail to fix the metric field inside the hole. Given general covariance, this entails (b) No-difference: all observable point-coincidences remain invariant across the diffeomorphic models. (a) No-observer inaccessibility follows for any observer constituted by matter fields coupled to the metric, as they only register coincidences. The inaccessible quantity is exactly the specific assignment of metric values to bare manifold points independent of the field content. The observer is any physical probe capable of registering coincidences. In 1913, applying the norm consistently should have led Einstein to reject manifold substantivalism (the idea that points have independent identity), not general covariance. The norm indicts the 'Entwurf' theory only if it retains point individuality; otherwise, it targets the ontological commitment to points as individuals, leaving covariance intact. The readings are separable: one could accept (b) while denying (c) if one denies the models represent distinct possibilities, which is the modern resolution.

  2. What the norm cannot explain about the episode
  The norm cannot explain why Einstein targeted covariance rather than substantivalism. His resistance was driven by a demand for causal determinism, not ontological parsimony regarding inaccessible quantities. The two-year delay until 1915 was resolved by empirical successes (Mercury) and conservation laws, not by applying the inaccessibility norm. Furthermore, Kretschmann's objection demonstrates that general covariance is a formal property achievable by any theory; thus, the argument's force cannot stem from covariance itself. The inaccessibility framing is downstream of a prior metaphysical verdict about which mathematical differences constitute physical distinctions. The norm describes the consequence of the hole argument but does not explain the historical reasoning or the physical constraints involved.

  3. What the episode does to the norm
  The episode suggests the norm is not purely epistemic but a disguised metaphysical thesis about spacetime individuality. It functions as an anomaly for a purely empirical reading, since Einstein used it to restrict mathematical form rather than ontological commitment. The norm under-determines the moral: it supports the rejection of haecceitism (that points have primitive thisness) but does not force relationism over sophisticated substantivalism. Both views satisfy the norm by denying physical significance to bare point identity. Consequently, the norm licenses only the thin claim that one should not multiply undetectable differences, leaving the positive ontology of spacetime points unresolved. It confirms that the norm is a constraint on representation, not a discovery procedure for ontology.

  4. A transfer test
  Applying the readings to black hole interiors and cosmological horizons reveals a critical divergence. For an outside observer, the interior is (a) inaccessible and (b) makes no difference to their observations, but it is not (c) undetermined by laws given global Cauchy data. Here, the readings come apart: quantities are accessible to infalling observers, just not jointly with outside observers. This requires a notion of joint inaccessibility absent in the Hole Argument, where no observer anywhere can distinguish the models. The norm yields counter-intuitive results here, suggesting the interior is non-ontological, which contradicts standard physical practice. This indicates the norm conflates gauge redundancy with causal isolation. The moral from (3) holds: the norm only bans redundancies, not causally isolated realities, distinguishing the Hole Argument from horizon cases. If the norm denies ontology to black hole interiors, it is too strong; if it allows them, it must be restricted to gauge cases, confirming it is not a general epistemic principle.

  Verdict
  Someone accepting the inaccessibility norm should accept the anti-haecceitist moral of the hole argument, but not necessarily full anti-substantivalism. Conversely, rejecting the anti-substantivalist moral requires restricting the norm to gauge cases, excluding causal horizons. The episode shows the norm is insufficient to settle spacetime ontology without prior metaphysical commitments.
