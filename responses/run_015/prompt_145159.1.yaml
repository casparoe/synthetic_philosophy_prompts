answer: |-
  **Scenario**
  Mrs Gable, eighty-two, is two days post-op for a hip fracture. She has moderate dementia and lacks capacity. Her life expectancy is fixed at six months regardless of the choice. The decision is between **Path A (Aggressive)**: immediate forced mobilisation, and **Path B (Conservative)**: bed rest until she initiates movement herself. **Clinical Assumption:** Path A causes acute, high-intensity pain but prevents chronic stiffness and pressure sores. Path B avoids acute strain but results in constant, moderate discomfort from immobility that cannot be fully sedated without risking delirium. Both paths preserve life equally; neither relies on memory loss to mitigate pain.

  **Positions and Arithmetic**
  *   **Dr Ashworth (Net Well-being):** Calculates Happiness minus Suffering.
      *   *Path A:* Suffering (828 units) is low; Happiness (mobility) is high. **Verdict: Path A.**
      *   *Path B:* Suffering (7,200 units) is high; Happiness (bedbound) is low. **Verdict: Path A.**
      *   *Arithmetic:* A = (9 intensity × 4 hrs × 3 days) + (2 intensity × 2 hrs × 180 days) = 828 units. B = (5 intensity × 8 hrs × 180 days) = 7,200 units.
  *   **Staff Nurse Pryce (Total Suffering):** Calculates only Sum of Suffering.
      *   *Path A:* 828 units. **Verdict: Path A.**
      *   *Path B:* 7,200 units. **Verdict: Path A.**
      *   *Reasoning:* A great deal of mild pain (Path B) outweighs a little severe pain (Path A).
  *   **Marianne (Lexical Worst-Thing):** Compares only the single worst moment.
      *   *Path A:* Peak pain is 9/10. **Verdict: Path B.**
      *   *Path B:* Peak pain is 5/10. **Verdict: Path B.**
      *   *Reasoning:* The peak of 9 is lexically forbidden, regardless of the total sum or subsequent happiness.

  **The Single Feature**
  The **peak intensity of the initial rehabilitation pain**. Path A requires three days of 9/10 pain; Path B never exceeds 5/10. This spike triggers Marianne's lexical veto while remaining small enough in duration to satisfy the aggregators.

  **Counterfactual**
  If you flatten the worst suffering in Path A to match Path B (reduce the rehab peak from 9/10 to 5/10), the disagreement collapses. Marianne no longer faces a lexically worse outcome. Since Path A still offers lower total suffering and higher happiness, all three characters agree on Path A.

  **Attack and Reply**
  *   **Pryce's Attack:** "You are condemning her to six months of grinding ache to spare her three days of strain. You are choosing more pain overall."
  *   **Marianne's Reply:** "I am choosing which pain belongs to her. I won't buy comfort with her terror."

  **Dialogue**
  "We must stand her today," Dr Ashworth said, checking the notes. "The alternative is contracture. She will ache forever."
  Staff Nurse Pryce leaned on the bed rail. "It's three days of strain against six months of grinding discomfort. The sum is less this way."
  Marianne smoothed her mother's sheet, watching the shallow breaths. "I know the sums. But look at her. I won't trade her terror for your convenience. Not even for less pain overall. She suffers enough."
  "It is in her best interests," Ashworth pressed.
  "Her interests aren't numbers," Marianne said. "Stop."

  **Honest Note on Rigging**
  The case relies on the clinical assumption that Path B (conservative care) inevitably produces *higher* total pain than Path A. In practice, a "gentler" path could involve heavy palliative sedation, lowering Path B's pain score significantly. If Path B's pain were managed down to 2/10 consistently, Pryce's arithmetic would flip, and she would join Marianne. To prevent this without rigging, the scenario assumes sedation is limited by the risk of precipitating delirium in a dementia patient, a standard geriatric constraint. The numbers are not rigged, but the clinical constraint on analgesia is doing the heavy lifting to keep Pryce aligned with Ashworth.
