      *   **Objections:**
          1.  Epidemiologist: Price = noise + shared priors; publishing launders guess into verdict.
          2.  Philosopher: No-trade theorem (rational traders w/ common priors shouldn't trade); volume measures disagreement, not knowledge; invites should have different priors.
          3.  Psychologist: Written justifications destroy tacit knowledge aggregation; profitable trader had "word salad" justifications.
      *   **Constraints:**
          *   Continuous prose (no headings, bullets, bold, tables).
