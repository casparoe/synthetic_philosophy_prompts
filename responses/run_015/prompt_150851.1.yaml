answer: |-
  To the Board of Directors, regarding the proposal to integrate an internal prediction market into our replication funding cycle, I have spent the last week analyzing the conflicting objections raised by our economist, epidemiologist, philosopher, and psychologist. This memo serves as my formal recommendation on how to proceed. We are not merely deciding on a financial instrument but on an epistemic tool, and we must be precise about what a market price is before we decide what weight it should carry. The core disagreement here stems from conflating a market price with a scientific verdict. A market price in this context is not testimony, nor is it a surrogate for peer review. It is a wager-weighted aggregation of private information, cleared through a mechanism that incentivizes truth-telling only under specific conditions. It represents the marginal belief required to clear the order book at a specific moment, conditional on the capital available and the rules of trade. Treating this price as a verdict, as the economist proposes by publishing it as the field's second opinion, commits a category error. It launders a probabilistic consensus into a binary authority, which risks damaging our credibility when the market inevitably misprices a complex replication due to liquidity constraints or external noise. We should publish the prices as data points alongside the results, explicitly labeled as experimental forecasts from a specific subset of insiders, not as judgments on the validity of the science.

  The most critical failure in the current proposal is the plan to feed the average price into funding decisions. This introduces a reflexivity that undermines the market's informational value. If traders know that pushing a price down reduces a lab's funding, they are no longer trading on their belief about the replication's success; they are trading on their desire to allocate resources or settle scores. This transforms the market from an information aggregation device into a political arena. Once the price becomes consequential for the outcome it predicts, the incentives shift from accuracy to manipulation. Therefore, we must decouple the market entirely from funding allocation. The price can inform our internal risk assessment, but it cannot be a formulaic input for grant decisions. To do otherwise would be to invite Goodhart's law, where the measure becomes the target and ceases to be a good measure. I recommend we set the weight of the price in funding decisions to zero for this cycle. We can revisit this only after we have established a multi-year track record showing that the market predicts results better than our existing peer review, but even then, the coupling should remain indirect.

  Regarding the philosopher's objection about the no-trade theorem and common priors, she is technically correct that if all participants share identical priors and are perfectly rational, trade should not occur simply based on private information because the act of trading reveals that information to others, collapsing the disagreement. However, real-world markets function because traders are boundedly rational and possess heterogeneous interpretations of public data. The risk here is not that they share priors, but that our invite list is too homogenous. If we invite only people who read the same journals and work in the same subfields, we will not get the diversity of information required to move the price toward accuracy. We will get an echo chamber with a price tag. To fix this, we must broaden the invitation list beyond immediate subject-matter experts. We should include methodologists, statisticians, and even informed outsiders who understand the base rates of replication failure without being invested in the specific theories. This ensures that trade volume measures the collision of different information sets rather than mere noise or shared bias. The market needs disagreement to function, but it needs disagreement grounded in different information, not just different ideologies.

  The psychologist's concern about the written justification requirement touches on the tension between tacit knowledge and accountability. She is right that much expert knowledge is inarticulate; forcing traders to explain every move could dampen the signal of intuition. However, in a small, closed market like ours, accountability is paramount. The presence of the profitable trader with word-salad justifications is a warning sign, not a validation. In a large liquid market, consistent profitability despite inarticulateness might suggest superior tacit processing. In our small pilot, it is equally likely to be luck. Without written justifications, we cannot audit whether a trade was based on insight or manipulation, especially since we are decoupling the market from funding to prevent gaming. I recommend we keep the justification requirement but change how we use it. The justifications should not be used to vet the trade before execution, which would stall liquidity, but should be archived for post-hoc analysis. We should not penalize a trader for being inarticulate if their long-term performance is robust, but we must flag them as high-variance. The requirement serves as a deterrent against bad-faith trading rather than a filter for knowledge.

  Given these considerations, my recommendation is to run the market in modified form immediately, alongside the next cohort of replications, but with strict guardrails. We will proceed with the internal real-money market, capped as proposed, but we will not use the prices to determine funding allocations. The maximum weight the price carries in any internal discussion should be advisory only, treated as one more data point alongside the original effect size and the preregistration quality. Publicly, when we publish the results, we must state clearly that the market prices represent the aggregated beliefs of a specific invited group at a specific time and are not independent validations of the science. We should frame this as a metascientific experiment to test whether prediction markets can improve our forecasting, not as a tool we are using to judge the work. This satisfies the epidemiologist's concern about laundering guesses into verdicts while respecting the economist's desire to test the mechanism. It addresses the philosopher's concern by requiring us to diversify the invite list to ensure genuine information heterogeneity. It addresses the psychologist's concern by retaining justifications for audit purposes without letting them block trades.

  We are at a point where theory goes quiet and judgment is required. We cannot know if the market will work until we run it at scale, but we can know that tying it to funding will break it. We must be willing to treat the market itself as a subject of study rather than a master of procedure. If we treat the price as a reason to act before we understand what the price is, we risk corrupting both the science and the market. I move that we adopt the market as a parallel tracking experiment, decoupled from funding decisions, with a diversified participant list and archived justifications. We should commit to reviewing the correlation between market prices and replication outcomes after thirty studies before considering any integration into decision-making. This allows us to capture the potential value of the market without risking the integrity of our funding process or the reputations of the labs we support. We are funding science, and this market is merely a tool to help us understand the uncertainty inherent in that science, not a replacement for the judgment required to steward it.
