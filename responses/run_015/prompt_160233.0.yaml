answer: |-
  Your friend's dilemma rests on a category error regarding the nature of the debt incurred by political crime. He assumes the debt is either purely retributive (a moral ledger requiring suffering) or purely utilitarian (a risk management problem requiring containment). The practice of truth commissions, particularly in its most robust form (South Africa), presupposes a third category: **punishment as communicative condemnation, and truth as civic restoration.**

  Here is the reconstruction of the implicit theory, followed by the analysis of commitments, counterfactuals, and the adjudication of your test case.

  ### I. The Reconstructed Theory

  **1. The View of Punishment: Expressive and Contingent**
  For the trade to make sense, punishment cannot be a metaphysical necessity (retributivism) nor a mere tool of deterrence (consequentialism). It must be understood as the **state's solemn expression of condemnation.**
  *   **Why it is waivable:** If the purpose of punishment is to publicly mark the act as wrong and reassert the authority of the norm, hard treatment (prison) is the default *vehicle* for that expression, but not the *essence* of it. If the condemnation can be achieved through other means—specifically, the perpetrator's own public submission to the truth under oath—the hard treatment becomes contingent.
  *   **Why it is priced (Rwanda) or waived (SA):** This depends on the density of the caseload and the depth of the rupture. In Rwanda, the scale was such that individual condemnation required some hard treatment to maintain normative weight. In SA, the priority was the transition itself; the "condemnation" was achieved by the stripping of secrecy and the official labeling of the act as a gross violation, making prison redundant for the political goal.
  *   **Why Argentina annulled it:** Argentina's initial waiver treated punishment as a discretionary tool of the executive. The annulment asserted that punishment is a *duty of the rule of law* that cannot be waived by statute if the law is to mean anything. This highlights that waivability depends on the **legitimacy of the waiving authority.**

  **2. The Status of Truth: Constitutive, Not Informational**
  Truth is not waivable because it is not merely data; it is the **foundational act of the new political order.**
  *   **Not just an entitlement:** If truth were only a victim's entitlement, the victim could waive it (and some do). The fact that they cannot implies truth is a **public good.**
  *   **Not just an instrument:** If truth were only instrumental (for stability), it could be suppressed when inconvenient. The insistence on truth even when it destabilizes (as in Argentina) shows it is **constitutive.** The new democracy is built on the reality of the old regime's crimes. To deny the truth is to deny the legitimacy of the new order.
  *   **The Form of Condemnation:** When hard treatment is remitted, truth-telling *becomes* the punishment. It forces the perpetrator to submit to the new order's authority and classify their own past actions as crimes. This is why remorse is not strictly required (as in SA); the *act of testifying* is the submission. The state condemns the act; the perpetrator validates that condemnation by confirming the facts.

  **3. The Holder of the Claim: The Polity, Not the Individual**
  This resolves the veto problem.
  *   **The Nature of the Wrong:** In these contexts, crimes are not treated merely as torts against individuals (murder, assault) but as **crimes against the constitutional order.** The apartheid state or the junta used the apparatus of the state to violate citizens. Therefore, the primary creditor is the **Body Politic.**
  *   **Implication for Veto:** The individual victim holds a claim for grief and reparation, but the claim for *justice* (the penal response) belongs to the community whose laws were shattered. The community, through the Commission, negotiates the settlement. The victim is denied a veto because the settlement is not a private contract; it is a public treaty for peace.
  *   **Your "Substituted Performance" Critique:** You worried the community trades away a good it doesn't own. The theory replies: The community *does* own the penal claim for political crimes. It is trading the *mode* of satisfaction (prison vs. truth), not the claim itself.

  **4. Self-Amnesty vs. Conditional Amnesty: The Source of Authority**
  The outcome (no prison) is identical, but the **normative status** is opposite.
  *   **Self-Amnesty:** The debtor forgives themselves. This presupposes they are above the law. It reinforces the logic of the old regime (might makes right). It is impunity because it denies the authority of the victim/community to judge.
  *   **Conditional Amnesty:** The *new* sovereign (the democracy) grants mercy. This presupposes the perpetrator is *under* the law and requires the state's forgiveness. It reinforces the logic of the new regime (the rule of law). The "price" paid (truth) acknowledges the state's authority to demand it.

  ### II. Required Commitments vs. Contingent Fits

  You asked which commitments the practice strictly requires and which merely sit well with it. This is the fault line between a moral theory of TRCs and a consequentialist one.

  **Strictly Required (The Non-Negotiables):**
  1.  **Verifiability:** The truth must be objectively established, not just narrated. A lie that brings peace is not acceptable. The institution requires an epistemic standard (corroboration, sworn oath).
  2.  **Publicity:** The truth must enter the public record. Private knowledge does not restore the civic order.
  3.  **Acknowledgment of Wrong:** The disclosure must categorize the act as a violation. A perpetrator cannot claim amnesty for a "necessary war tactic" unless the Commission accepts the political objective *and* the proportionality. (In SA, gross human rights violations were excluded from proportionality defenses).

  **Merely Contingent (Where Consequentialism Overlaps):**
  1.  **The Ratio of Truth to Punishment:** A consequentialist could argue for 100% amnesty for 100% truth if it stops a civil war. The moral theory requires the punishment (condemnation) to be *adequate*, but "adequacy" is underdetermined.
  2.  **Victim Participation:** A consequentialist might skip victim hearings to save time/money. The moral theory requires it as part of restoration, but the institution *could* function as a pure archive without it (as CONADEP initially did in Argentina).
  3.  **Individual vs. Collective Focus:** A consequentialist might prefer collective truth (patterns) over individual names to reduce tension. The moral theory leans toward individual accountability to satisfy retributive intuitions.

  **The Danger Zone:** A thoroughgoing consequentialist could license a TRC that accepts *useful lies* (e.g., blaming a dead leader for everything to spare the living army). The practice *forbids* this. The commitment to *factual accuracy* is the point where the moral theory diverges from pure stability-seeking.

  ### III. Counterfactuals: Changing the Presuppositions

  **1. If Punishment were Purely Forward-Looking (Deterrence/Incapacitation):**
  *   **Effect on Truth:** Truth becomes **intelligence.** If a perpetrator knows where bodies are buried, you grant amnesty to get the coordinates. If a perpetrator knows nothing useful but is dangerous, you imprison them regardless of truth.
  *   **Effect on Institution:** The Commission becomes a security apparatus. Public hearings would be discarded if they risked revealing intelligence sources or inciting violence.
  *   **Distinction from Impunity:** It would become indistinguishable from impunity in the eyes of victims. Without the backward-looking acknowledgment of *desert* (even if commuted), the transaction looks like a deal with the devil. The moral "sting" of justice is lost.

  **2. If the Right to Truth were Only Instrumental:**
  *   **Dropping Public Hearings:** Yes, permitted. If the goal is reconciliation, and public shaming causes backlash, a consequentialist would seal the records.
  *   **Waiving Disclosure:** Yes, permitted. If disclosing a specific murder triggers a riot that kills more people, the instrumentalist suppresses the truth.
  *   **Distinction from Impunity:** It collapses into impunity. Impunity is defined not just by the lack of prison, but by the **erasure of the crime.** If truth is waived for stability, the crime is effectively erased from the public record. The institution loses its claim to "justice" and becomes a mechanism of "forgetting."

  ### IV. The Test Case: Private Disclosure of Known Facts

  **The Case:** A perpetrator discloses everything accurately in a sworn private statement. Survivors already know the facts. No public hearing.

  **The Verdict:** He has **not** done what the practice demands.

  **The Reasoning:**
  Based on the reconstructed theory, this failure occurs on two fronts:

  1.  **Failure of Condemnation (The Punishment Element):**
      The theory posits that when prison is waived, the *public submission* of the perpetrator serves as the punitive condemnation. By testifying privately, the perpetrator avoids the **shame** and the **social risk** that constitute the "price" of amnesty. He treats the Commission as a notary, not a court of public opinion. He has not submitted to the community's judgment; he has merely filed a report.

  2.  **Failure of Restoration (The Truth Element):**
      You note the survivors "already knew." If truth were merely informational, his statement adds nothing. But the theory holds that truth is **performative.** It is not enough for the victim to know; the *world* must know that the perpetrator admits it.
      *   **The "Official Record" Function:** The TRC creates an *authoritative* history. A private sworn statement is evidence; a public hearing is a **monument.**
      *   **The Civic Status:** The victim's status was diminished because the crime was hidden or denied by the state. Restoring that status requires the state (and the perpetrator acting under the state's authority) to publicly validate the victim's suffering. Private disclosure keeps the suffering in the private sphere, where the state's oppression originally confined it.

  **Conclusion:**
  Your friend argues the trade is incoherent because he views punishment as suffering and truth as information. The institution operates on the view that **punishment is censure** and **truth is recognition.**

  In your test case, the perpetrator has provided the information (truth as data) but withheld the recognition (truth as acknowledgment). He has tried to pay the debt with counterfeit currency. He wants the legal benefit of the new order (immunity) without submitting to the social authority of the new order (public accountability). Under the implicit theory of the Truth Commission, this is not compliance; it is a continuation of the arrogance that made the crime possible in the first place.
