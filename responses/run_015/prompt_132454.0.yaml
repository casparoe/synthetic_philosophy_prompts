answer: |-
  Based on a close reading of *The Descent of Man* (1871), supplemented by Darwin's correspondence and *Autobiography*, the symmetry you describe does **not** hold in Darwin's own framework. While popular accounts often flatten his naturalistic explanations into a uniform "debunking" of both faith and ethics, Darwin's texts resist this parallel. He treats the evolutionary genealogy of religion as an explanation of a cognitive error (or at least a primitive hypothesis), whereas he treats the genealogy of morality as an explanation of a functional, normative necessity.

  Here is an analysis of where the texts support or resist this symmetry, followed by my confidence assessment.

  ### 1. The Treatment of Religion: Naturalizing the Source
  In *The Descent of Man*, Darwin approaches religious belief primarily as an anthropological phenomenon to be explained by cognitive evolution. He argues that the belief in "spiritual agencies" arises from the intersection of advanced cognitive faculties (imagination, curiosity, reason) with primitive emotional states (fear of the unknown).

  *   **Textual Support for Debunking:** Darwin writes that the idea of God is not an "instinctive belief" but a result of reason working on experience. He suggests that early humans attributed natural events to willful agents because they lacked scientific understanding of causality.
  *   **The Asymmetry:** Crucially, Darwin frames religious belief as a *theoretical claim* about the nature of reality (i.e., "unseen agencies cause these events"). Because evolution explains why humans *would* make this claim regardless of its truth, the explanatory power of the belief is undermined. It becomes a hypothesis rendered unnecessary by natural selection's shaping of the brain. In his *Autobiography*, he is more explicit, noting that the "horrid doubt" arises whether the convictions of man's mind, evolved from lower animals, are of any value regarding theological truths.

  ### 2. The Treatment of Morality: Naturalizing the Ground, Not the Authority
  Darwin's account of morality in Chapter IV of *The Descent of Man* is genealogical, but it does not strip morality of its normative force. Instead, it relocates the source of authority from divine command to social welfare.

  *   **Textual Resistance to Debunking:** Darwin traces the moral sense to "social instincts," which he views as real, biological drives shared with other animals. However, unlike religious belief, which he treats as a cognitive inference, morality is treated as a *behavioral imperative* essential for group survival.
  *   **Normative Status:** Darwin does not suggest that because morality is evolved, it is arbitrary. On the contrary, he argues that the "approval of conscience" is a tangible, painful, or pleasurable reality that guides action. He explicitly endorses the "golden rule" and argues that the "general good" is the standard by which morals should be judged. For Darwin, the "ought" of morality is derived from the "is" of social necessity. He writes, "I would give the word 'moral' to no quality... unless it was enduring and ever-present," linking moral value to the stability of social instincts.
  *   **Moral Progress:** Darwin believes in moral progress (e.g., the expansion of sympathy from the tribe to all humans and even to animals). If morality were merely a cognitive misfiring like he suggests religion might be, "progress" would be incoherent. The fact that he advocates for the *improvement* of moral sentiments suggests he views them as tracking something objectively beneficial (community welfare), not just tracking survival in a specific environment.

  ### 3. Why the Symmetry Fails
  The parallel fails because Darwin categorizes the two domains differently:
  1.  **Religion** is treated as an **explanatory framework** (answering "why does thunder happen?"). Evolution shows this framework is a byproduct of agency-detection, potentially false.
  2.  **Morality** is treated as a **regulative mechanism** (answering "how should we live together?"). Evolution shows this mechanism is essential for the existence of complex society.

  Darwin undermines the *epistemic* authority of religion (its claim to truth about the cosmos) while preserving the *practical* authority of morality (its claim to guide conduct for the good of the community). He is an agnostic regarding the former but a realist (of a utilitarian sort) regarding the latter.

  ### Confidence and Uncertainty Assessment

  **Confidence Level:**
  I am **85% confident** in this interpretation. The textual evidence in *The Descent of Man* clearly distinguishes between the "belief in spiritual agencies" (which he distances himself from scientifically) and the "moral sense" (which he endorses as vital for human advancement). The scholarly consensus among historians of biology and philosophy (e.g., Michael Ruse, James Rachels) supports the view that Darwin sought to save morality from the skepticism that threatened religion.

  **Area of Least Certainty:**
  The specific claim about which I am **least certain** is whether Darwin believed moral principles possessed **objective truth-value independent of human sentiment** (Moral Realism) or whether he believed they were **binding only relative to the goal of species survival** (Moral Anti-Realism/Instrumentalism).

  While Darwin speaks of the "general good" as a standard, it is unclear if he viewed "the general good is right" as a universal truth akin to a law of physics, or merely as a hypothetical imperative ("*if* you want society to survive, *then* be moral"). In *The Descent of Man*, he sometimes implies that if humans were raised under different conditions, our moral code might be entirely different (citing the hypothetical example of bees). This suggests his commitment to moral objectivity is weaker than his commitment to moral utility, making it difficult to definitively state that he preserved "genuine normative authority" in a robust philosophical sense, even if he preserved it in a practical, social sense.
