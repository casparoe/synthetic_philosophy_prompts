      *   *Criticism:* Unfalsifiable procrastination ("not yet").
      *   *Philosophical Core:* Lakatosian research programmes (progressive vs. degenerating), falsifiability (Popper), model idealization (Cartwright), scope conditions.

  3.  **Drafting - Section by Section:**

      *   **Section 1: Discriminating Content (Signatures):**
          *   *Candidate 1: Flat real wages + tech improvement.* Malthus says yes. Smith says wages rise with growth. Boserup says intensity rises, maybe wages stable but not subsistence. *Verdict:* Highly diagnostic. Smith predicts rising wages.
          *   *Candidate 2: Positive response of nuptiality/fertility/survival to wages.* Malthus says yes (preventive/positive checks). Institutionalists might say culture mediates this. *Verdict:* Diagnostic, but needs to be *strong* and *fast*.
          *   *Candidate 3: Productivity shocks absorbed by population.* Malthus says yes. Smith says absorbed by wealth. *Verdict:* Highly diagnostic.
          *   *Candidate 4: Ceiling-like behavior (population takes strain).* Malthus says yes. *Verdict:* Diagnostic.
          *   *Differentiation:* Smith is the main rival here. Smith sees commercialization breaking the link. Boserup sees innovation triggered by pressure. Malthus sees pressure triggering misery.

      *   **Section 2: Counterfactual Record (Pre-1800):**
          *   *Falsifiers:* Sustained per-capita income growth *without* population explosion (e.g., England 1600-1800 actually shows some wage growth, which is a problem for strict Malthus). Fertility unresponsive to price/wage shocks.
          *   *Observed:* Clark (2007) *A Farewell to Alms* argues strongly for Malthus (wages flat). Others (e.g., Allen) argue real wages did rise in some periods/places. The Black Death is the clearest Malthusian signal (pop down, wages up).
          *   *Exposure:* If pre-1800 data shows sustained growth *and* population stability, Malthus is dead for that period. The "Great Divergence" timing is crucial.

      *   **Section 3: The Modern Inversion (Income-Fertility):**
          *   *Issue:* Rich people have fewer kids. Malthus says rich people have more kids (until checked).
          *   *Defense:* Quantity-Quality (Q-Q) tradeoff (Becker). This is an *auxiliary hypothesis*.
          *   *Risk:* Is this ad hoc? If Q-Q is always available to explain away deviations, it's degenerating.
          *   *Principle:* Can we measure the tradeoff independently? If parents *choose* fewer kids to invest more, it's a preference/constraint change, not a biological check. Malthus relied on biological necessity. Modern inversion is cultural/economic choice.
          *   *Verdict:* It's a mechanism reversal. Malthus predicted *capacity* to support children leads to *more* children. Modernity makes children a costlier good. This requires modifying the utility function, not just the constraint.

      *   **Section 4: The "Remove Industrial Inputs" Thought Experiment:**
          *   *Setup:* Remove N-fixation, fossils, keep knowledge.
          *   *Malthus Prediction:* Population crash or subsistence fall.
