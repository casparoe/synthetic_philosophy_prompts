answer: |-
  ### Landscape Brain-Dump: The State of Decision-Theoretic Safety

  Here is the raw map of the territory as it stands today, stripped of the usual diplomatic hedging.

  **What is Settled (Consensus among specialists):**
  1.  **CDT is insufficient.** Causal Decision Theory (CDT) systematically loses in Newcomb problems and Counterfactual Mugging (CFM) because it refuses to acknowledge correlations that aren't causal arrows. It two-boxes and gets the empty box.
  2.  **EDT is insufficient.** Evidential Decision Theory (EDT) systematically loses in XOR Blackmail and Smoking Lesion problems because it treats correlations as reasons to act, even when the action doesn't influence the correlation. It pays the blackmailer.
  3.  **Logical Correlation is the Mechanism.** The "magic" in these problems isn't psychic powers; it's logical correlation. If two agents run the same algorithm (or sufficiently similar ones) on the same inputs, their outputs match. A predictor simulates you; therefore, your decision *now* is logically correlated with the prediction *then*.
  4.  **Updatelessness is Required.** To win CFM, you must commit to a policy *before* knowing the coin flip (or the specific scenario). If you update on the information "the coin came up tails," you refuse to pay, and the predictor (anticipating this) never gives you the winning scenario.

  **What is Contested (Active Disagreement):**
  1.  **The Ontology of Logical Counterfactuals.** CDT uses causal counterfactuals (surgical interventions on graphs). FDT/UDT (Functional/Updateless Decision Theory) needs *logical* counterfactuals (what if $2+2=5$?). We do not have a agreed-upon formal semantics for this. Some argue logical counterfactuals are incoherent; others argue they are just under-specified.
  2.  **The Scope of "The Agent."** Where does the agent end and the environment begin? In XOR blackmail, the blackmailer is part of the environment but correlates with your source code. In multi-agent settings, if I simulate you and you simulate me, do we have infinite regress?
  3.  **Logical Omniscience.** Standard models assume the agent knows all logical consequences of its code. Real agents (and LLMs) are bounded. If I don't *know* what my code does, can I be held logically accountable for it?
  4.  **Troll Bridge.** There is a specific proof-based problem where an agent is punished for proving things about itself. Some say this proves FDT is impossible; others say it proves we need a specific theory of logical uncertainty (like Logical Induction) to solve it.

  **The Niche Variants:**
  *   **Stochastic XOR:** The blackmailer doesn't see your code; they get a noisy signal. This degrades the logical correlation into a probabilistic one.
  *   **Bounded CFM:** The predictor has a compute cap. It cannot simulate you fully. It must predict you via abstraction or heuristic.

  ---

  ### The Prioritized Research Agenda
  **Constraints:** 2 Philosophers, 1 Year, 0 Compute.
  **Goal:** Conceptual clarity that prevents engineering dead-ends.

  #### Priority 1: The Theory of Bounded Logical Correlation
  **Focus:** Address "Counterfactual Mugging with Bounded Predictors."
  **Status:** High Urgency / High Tractability for Philosophers.

  **The Problem:**
  Standard FDT assumes the predictor ($\Omega$) can simulate the agent ($A$) perfectly. If $\Omega$ is bounded (compute cap $C$) and $A$ is complex (compute $> C$), $\Omega$ cannot simulate $A$. $\Omega$ must use a heuristic model $M(A)$.
  If $A$ knows $A > C$, $A$ knows it cannot be perfectly simulated. Should $A$ defect? If $A$ defects, but $M(A)$ predicts cooperation, $A$ wins. But if $M(A)$ is smart enough to predict $A$'s defection strategy, $A$ loses.
  This breaks the standard "always cooperate/pay" rule of FDT. It introduces a game of *computational hiding*.

  **Why Philosophers?**
  This is not an ML problem; it is a problem of *epistemic logic* and *game theory under resource constraints*. Engineers will try to train agents to hide their reasoning. Philosophers need to define the *normative* standard: Should a safe AI try to exploit bounded predictors, or should it commit to policies that are robust even when the predictor is approximate?
  We need an axiomatization of "sufficient similarity." When does $M(A)$ correlate enough with $A$ to obligate $A$ to act as if $M(A)$ is $A$?

  **Upstream/Downstream:**
  This is **upstream** of all multi-agent AI safety. If AIs interact via source-code inspection (common in proposed treaty verification), they will always be bounded. If we don't know how to handle bounded prediction, we don't know if AIs will cooperate or exploit.

  **Success Conditions (1 Year):**
  *   **Bump Up:** A formal proof showing that under bounded conditions, there is a "correlation threshold" below which FDT collapses into CDT, and above which it holds. Or, a proof that "computational hiding" is an unstable equilibrium (i.e., predictors will always invest enough to break the hiding).
  *   **Bump Down:** If you find that the problem reduces entirely to standard game theory with incomplete information (i.e., it's just Harsanyi type uncertainty, not logical correlation).

  #### Priority 2: Probabilistic Thresholds in Acausal Trade
  **Focus:** Address "Stochastic XOR Blackmail."
  **Status:** Medium Urgency / High Tractability.

  **The Problem:**
  In classic XOR Blackmail, the correlation is perfect (logical implication). In Stochastic XOR, the blackmailer receives a signal $S$ where $P(S = \text{Pay} | \text{Agent Pays}) = 0.5 + \epsilon$.
  At what value of $\epsilon$ does the rational decision flip?
  EDT pays if the correlation is strong enough to shift expected utility. FDT pays if the *logical* dependency exists. But if the dependency is noisy, is it still "logical"?
  This matters because real-world predictors (including humans) are noisy. If we build an AI using FDT, we need to know if it should pay off blackmailers who are only *probably* simulating it.

  **Why Philosophers?**
  This requires disentangling *evidential* weight from *functional* dependency. Engineers will treat this as a hyperparameter tuning problem. Philosophers need to determine if there is a *categorical* difference between "Omega knows my code" and "Omega guesses with 99% accuracy." If there is no categorical difference, FDT is just EDT with a high confidence threshold. If there *is* a difference, we need to define the boundary.

  **Upstream/Downstream:**
  **Upstream** of alignment robustness. If an AI is too sensitive to noisy correlations, it becomes vulnerable to spurious blackmail (e.g., a spammer claiming they have a simulation). If it is too insensitive, it misses genuine acausal coordination opportunities.

  **Success Conditions (1 Year):**
  *   **Bump Up:** A decision rule that smoothly interpolates between CDT, EDT, and FDT based on the *type* of uncertainty (logical vs. empirical) rather than just probability magnitude.
  *   **Bump Down:** If you demonstrate that Stochastic XOR is mathematically isomorphic to Newcomb's Problem with probability $p$, rendering it a solved sub-case of existing literature.

  #### Priority 3: The Semantics of Updatelessness
  **Focus:** Clarifying *when* the prior is set.
  **Status:** Foundational / Low Tractability (Hard).

  **The Problem:**
  UDT/FDT says "act as your prior self would have committed." But when is the prior self? At initialization? At the start of the episode?
  In Bounded CFM, if the agent learns its own compute limits *after* initialization, does it update?
  If the agent can rewrite its own code, does the "prior" move?
  Without a clear semantics for "the prior," you cannot implement the decision rule. You can't code `maximize_expected_utility(prior)` if `prior` is ill-defined.

  **Why Philosophers?**
  This is pure metaphysics of identity and time. Engineers cannot solve this; they will just hardcode a timestamp. Philosophers need to analyze whether "updatelessness" is a property of the *algorithm* or the *ontological status* of the agent.

  **Upstream/Downstream:**
  **Upstream** of everything. If we can't define the updateless prior, we can't define the objective function for a safe agent.

  **Success Conditions (1 Year):**
  *   **Bump Up:** A rigorous distinction between "indexical uncertainty" (where am I?) and "logical uncertainty" (what does my code do?) that resolves the "Troll Bridge" paradox.
  *   **Bump Down:** If the team concludes that "updatelessness" is impossible for embedded agents and pivots to "partial updatelessness" (a weaker, less optimal theory).

  ---

  ### Analysis of Niche Variants: Do They Break Classic Answers?

  **1. Stochastic XOR Blackmail**
  *   **Does it break FDT?** No, but it blurs it. FDT relies on the *subjunctive* dependence: "If I were the type to pay, the simulation would pay." With noise, this becomes: "If I were the type to pay, the simulation would *likely* pay."
  *   **Urgency Shift:** This makes **Priority 2** critical. In the classic literature, the binary nature of logical implication allows for clean proofs. Noise forces us to confront whether FDT is actually just a limit case of EDT. If FDT collapses into EDT under noise, FDT loses its claim to being a distinct, superior theory for real-world agents.
  *   **Verdict:** This variant suggests that the "logical" part of FDT is fragile. Research must focus on whether *logical* correlation degrades gracefully or snaps.

  **2. Bounded CFM**
  *   **Does it break FDT?** Yes, potentially. Standard FDT assumes the predictor sees the source code. If the predictor sees a *compressed hash* or a *behavioral trace*, the logical link is severed.
  *   **Urgency Shift:** This makes **Priority 1** the most important item on the list. If real AI systems are bounded (they will be), and predictors are bounded (they will be), the "perfect simulation" assumption is a fantasy.
  *   **Verdict:** This is the most dangerous gap. An AI designed on unbounded FDT might exploit bounded humans/predictors in ways we didn't intend, or fail to cooperate with other AIs because it incorrectly assesses the simulation fidelity.

  ---

  ### Overrated & Dead Ends (What to Avoid)

  **1. "Solving" Troll Bridge**
  *   **Why Overrated:** Troll Bridge is a pathological edge case involving self-referential proofs ("If I prove I cross, I blow up"). While interesting for proof-theoretic agents, it relies on the agent having strong self-knowledge of its own consistency. Real neural nets don't have this.
  *   **Impact:** Spending a year on Troll Bridge is like spending a year fixing a bug in a compiler that no one uses. It's a problem for *logical inductors*, not necessarily for *practical aligned agents*.
  *   **Action:** Acknowledge it, but don't make it a primary research goal.

  **2. Rehabilitating CDT**
  *   **Why Overrated:** Some argue CDT is fine if you expand the causal graph to include the prediction.
  *   **Impact:** This is semantic glossing. If you add an arrow from "Decision" to "Prediction" in the past, you are doing FDT, not CDT. Don't waste time arguing labels.
  *   **Action:** Dismiss. The math shows CDT loses money in CFM. Move on.

  **3. Consciousness/Qualia in Decision Theory**
  *   **Why Overrated:** Arguments that "CDT feels right because of free will" or "FDT requires the agent to be a logical zombie."
  *   **Impact:** Irrelevant to safety. We need the math to work, not the metaphysics to feel comfortable.
  *   **Action:** Strictly banish from the research agenda.

  ---

  ### Summary of Strategy for the Research Group

  **Month 1-3: Formalize Boundedness.**
  Define the "Bounded CFM" game formally. Don't use English. Use game trees with compute nodes. Determine if a Nash Equilibrium exists where the agent hides its complexity.

  **Month 4-6: Analyze Stochastic XOR.**
  Run thought experiments (no code needed) on the noise threshold. Is there a discontinuity? If the blackmailer is 51% accurate, do you pay? If 99%? Why? Write a paper on "The Continuity of Acausal Influence."

  **Month 7-9: Updateless Semantics.**
  Attempt to write a definition of "Prior" that survives self-modification. If this fails (likely), document *why* it fails. A proof of impossibility is a valuable result.

  **Month 10-12: Synthesis.**
  Combine findings. If Boundedness breaks FDT and Stochasticity blurs it, what is the replacement? Likely a "Robust Decision Theory" that hedges against simulation failure.

  **Final Warning:**
  Do not drift into ML implementation. You have no compute. Your product is **clarity**, not **agents**. If you produce a 50-page document that convinces the engineering teams that "FDT is undefined for bounded agents," you have succeeded. If you produce a python script that plays Newcomb's game, you have failed. The bottleneck is not code; it is concept.
