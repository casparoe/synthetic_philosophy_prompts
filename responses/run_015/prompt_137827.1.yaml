  **Why this works:**
  *   **If she is an Epistemicist:** She will likely say "Yes, it is definitely definitely a city." For a clear case, the fact is sharp, and our knowledge of it is secure. The iteration holds.
  *   **If she is a Supervaluationist:** She will likely say "Withhold" or "No." Standard Supervaluationism rejects the S4 axiom ($\Box P \to \Box \Box P$). Even for clear cases, the *precisifications* of the "definite" operator can vary at higher orders.
  *   **Relevance to Millbrook:** If she admits higher-order vagueness for Clearview, she will certainly **Withhold** on "Millbrook is *Definitely* Indeterminate." This confirms the prediction for Question 3.

  This query positions you as careful about the logical machinery (which you are) and gives her the space to commit to the higher-order view that distinguishes her from the Epistemicist interpretation your friend proposed.
