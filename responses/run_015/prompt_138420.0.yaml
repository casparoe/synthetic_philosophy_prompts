      *Self-Correction on Paragraph 2:* The user said asymbolia leaves sensation but removes bother. Clinicians treat it as deficit. I need to explain why AP isn't asymbolia. Asymbolia = No aversion. AP = Positive/Negative gradient shift. Actually, AP wants to replace suffering with gradients of wellbeing. So if I touch a stove, I shouldn't feel pain, but I should know not to do it. How? Because I value my hand. The motivation comes from desire for wellbeing, not avoidance of hell.
