answer: |-
  Here is a 45-minute teaching arc designed for CS grad students. It treats the "White Horse Not Horse" (*Bai Ma Fei Ma*) argument as a problem of **type specification** and **concept identity**, bypassing the historical fluff.

  ### 1. The Dependency Order: Naive Sets First
  **Do not start with Aristotelian categories.**
  CS students operate on a mental model of naive set theory and object-oriented inheritance (`WhiteHorse` extends `Horse`). If you start with Aristotle, they will treat it as archaic biology.

  *   **Start:** Naive Set Membership (`A ⊂ B`).
  *   **The Crack:** Show that while the *extension* (the instances) overlaps, the *intension* (the definition/requirements) does not.
  *   **The Shift:** Move them from "Is this object in the set?" to "Is this *concept* identical to that *concept*?"

  ### 2. The One Analog Example: "Search Specifications"
  Use **API Requirement Specs** (or Database Query Schemas). Do not use biological taxonomy.

  *   **The Setup:** Define two function signatures.
      *   `Request A`: `get_animal(species="Horse")`
      *   `Request B`: `get_animal(species="Horse", color="White")`
  *   **The CS Intuition:** In most type systems, an object satisfying B satisfies A (Liskov Substitution Principle). If I ask for a Horse, a White Horse works.
  *   **The Gongsun Long Twist:** He isn't talking about the *object* returned; he is talking about the *Request Object* itself.
      *   The *criteria* for Request A is "Shape only."
      *   The *criteria* for Request B is "Shape + Color."
      *   **The Lesson:** A requirement spec that demands Color is not identical to a requirement spec that ignores Color. Therefore, the concept "White Horse" is not the concept "Horse."

  **Why this carries the lesson:** It maps "Horse" to a class definition and "White Horse" to a constrained subclass. It forces students to distinguish between **Instance Membership** (a white horse is an instance of horse) and **Concept Identity** (the definition of 'white horse' is not the definition of 'horse').

  ### 3. Why Not Walk Through the Dialogue?
  The original text is a eristic dialogue (a debate meant to win, not just teach). It loops, uses rhetorical traps, and relies on Classical Chinese grammar nuances (like the lack of pluralization) that require constant translation footnotes.
  *   **The Risk:** Students will get stuck on "Why did he say *fei* (not) instead of *bu* (is not)?" or "Is he talking about one horse or all horses?"
  *   **The Fix:** Reconstruct the logic as three premises.
      1.  "Horse" names the shape.
      2.  "White" names the color.
      3.  "White Horse" names shape + color.
      4.  Therefore, the name "White Horse" ≠ the name "Horse."
  *   **Benefit:** This isolates the ontological claim without the linguistic noise.

  ### 4. Sequencing the Misconceptions
  CS students will attack this from three angles. You need to preempt them in this specific order to keep the logic intact.

  **Misconception 1: "It's just a language trick about adjectives." (Minutes 0–10)**
  *   **When it hits:** Immediately. They will say, "Obviously 'white' is just a modifier. 'White Horse' is a subset of 'Horse'."
  *   **How to head it off:** During the "Search Specification" analogy. Explicitly state: *"We are not talking about the physical animal. We are talking about the query string."*
  *   **The Counter:** If I write code for `query("Horse")`, it must handle black horses. If I write code for `query("White Horse")`, it must reject black horses. The *logic handles* are different. Therefore, the concepts are not identical.

  **Misconception 2: "Color literally determines biological species." (Minutes 15–25)**
  *   **When it hits:** When you discuss the "Shape + Color" premise. They will think Gongsun Long believes white horses are a different species biologically.
  *   **How to head it off:** When explaining the School of Names (*Ming Jia*). Clarify that this is about **Reference**, not Biology.
  *   **The Counter:** "Gongsun Long doesn't care about DNA. He cares about *Ming* (Names/Labels). If the label requires extra data (color), it is a different label. It's like the difference between `Integer` and `Positive_Integer`."

  **Misconception 3: "It's Russell's Paradox in disguise." (Minutes 35–40)**
  *   **When it hits:** At the end, when they realize this challenges set inclusion. They will think, "Is the set of white horses a member of itself?"
  *   **How to head it off:** In the conclusion. Distinguish **Self-Reference** from **Identity Conditions**.
  *   **The Counter:** "Russell's Paradox is about a set containing itself. This is about two sets having different *membership criteria*. It's not a paradox of logic; it's a distinction between Intension (definition) and Extension (instances)."

  ### 5. What to Skip Entirely
  **Skip the "Hardness and Whiteness" (*Jian Bai Lun*) fragment.**
  *   **Why:** That argument is about qualia and perception (e.g., "You see whiteness but don't feel hardness, so they are separate"). It drags you into epistemology and sensory processing.
  *   **Risk:** It distracts from the core logic of class membership and will make the session feel like "ancient psychology" rather than "ontology."
  *   **Also Skip:** The political context of the Warring States period. It doesn't help the logic.

  ### 6. The Final Check Question
  Do not ask "Is a white horse a horse?" (They will just say "Yes" based on common sense). Ask this:

  > **"If I define a function `feed(Horse h)`, Gongsun Long argues I cannot safely pass a `WhiteHorse` object to it. Based on today's session, is his objection about the *physical animal* or the *type signature*, and why does that distinction matter for defining ontological categories?"**

  *   **Correct Answer:** They must identify that the objection is about the **type signature** (the concept/requirements), not the physical animal. It matters because if we define categories by their *requirements* (intension) rather than their *instances* (extension), adding a constraint creates a fundamentally new category, not just a subset.

  ### 7. Session Timeline (45 Minutes)
  *   **00–05:** **Hook.** Write `WhiteHorse ⊂ Horse` on the board. Ask: "In what universe is this false?" Introduce Gongsun Long as a logician, not a poet.
  *   **05–15:** **The Logic.** Reconstruct the 3 premises (Shape, Color, Compound). Introduce the **Search Specification** analogy. Head off Misconception 1 (Adjectives).
  *   **15–25:** **The Ontology.** Explain Intension vs. Extension. Head off Misconception 2 (Biology). Explain the School of Names cared about precise governance through precise language.
  *   **25–35:** **The CS Implication.** Discuss Type Systems. When does strict identity matter over inheritance? (e.g., Security clearance, Database Schemas). Head off Misconception 3 (Russell's).
  *   **35–45:** **Discussion & Check.** Pose the Check Question. Debrief on why "fuzzy logic" isn't the point—rigid logic is.

  ### Note on Translations (For your rustiness)
  *   **Fei (非):** Usually translated as "is not," but in this context, it often means "is not equivalent to" or "is not classified as."
  *   **Ma (马):** Horse (the concept/shape).
  *   **Bai (白):** White (the concept/color).
  *   **Bai Ma (白马):** White Horse (the compound concept).
  *   **Key nuance:** He isn't saying a white horse isn't an animal. He's saying the *term* "White Horse" is not interchangeable with the *term* "Horse."
