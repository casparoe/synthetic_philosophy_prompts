prompt: |-
  hey can you write a satirical internal memo, about 600 words, from the CEO of a made-up hospital network called VitalEnd Solutions? they're rollling out a 'tiered death certification' program that treats brain death as the 'Premium' package and circulatory death as the 'Basic' package, with different billing codes and family notifcation schedules. the joke should come from actually getting the philosophy right — the memo should accidently expose that brain-dead patients can still have functioning heart and lungs, that the 'whole brain' criterion is kind of arbitrary, and that choosing between neurological and cardiopulmonary criteria is really a hidden value call about whether consciousness or biological integration is what matters. include a section on 'Extended Warranty' for patients who stay on ventilators after being declared dead, and a customer satisfaction survey asking familes whether they felt the death was 'authentic enough'. keep the voice totally deadpan corporate, like real hospital admin speak. don't cite anyone, just build the absurdity out of the concepts themselves.
