answer: |-
  A grad student bursts into her Bayesian advisor's office, waving a draft paper.

  "I've solved the problem of verisimilitude," she says. "We rank competing theories by partitioning their consequence classes into true and false subsets, then measuring the size of the true set."

  The advisor doesn't look up from his grading. "And how do you decide which subset a consequence falls into?"

  "By checking it against the actual state of the world."

  "So you need to know the truth to perform the partition."

  "Well, yes."

  "Which means you can only compute the verisimilitude score if you already know which theory is true."

  "Exactly! It's perfectly accurate."

  The advisor finally looks up, wincing. "So your metric is only computable for the theory that doesn't need measuring. You've built a loss function that's only defined at the global minimum."

  "It's a feature, not a bug!"

  "No," says the advisor, rubbing his temples. "It's a compass that only points North once you've already arrived at the Pole. You can't use it to choose between false theories; you can only use it to confirm the true one after you've already found it."

  "So... it's not a guide for inquiry?"

  "It's a receipt for having already finished."
