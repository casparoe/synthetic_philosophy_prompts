answer: |-
  ### Specification for an Embedded Decision Rule

  **Purpose and Scope**
  This specification defines a decision rule for an engineered agent operating in environments containing predictors, simulators, and copies. Unlike a theory for human appraisal—which judges moral worth, intent, or "could have done otherwise"—this rule must prescribe an actionable output (action or distribution) computable within bounded resources. It must be stable ("write once, run forever") and robust to self-reference. Requirements tagged **Required** are necessary for the engineering purpose; **Conditional** are necessary only if further goals (e.g., human intelligibility) are added; **Prejudice** are inherited from specific philosophical camps (CDT, EDT, etc.) and may conflict with the engineering purpose.

  **Missing Case**
  **Case H (Halting Trap):** A predictor fills the box iff a Turing Machine implementing your decision rule on this specific input halts within 1,000 steps. You do not know if it halts.
  *   **Forces:** The requirement for **Bounded Self-Knowledge**. A rule that requires exact self-simulation to evaluate counterfactuals will loop or timeout here. It forces the theory to handle logical uncertainty without omniscience.

  ---

  ### Requirements List

  1.  **Bounded Computability:** The rule must terminate and output an action using only resources available to the agent (time, memory), without requiring exact self-simulation or solving halting problems.
      *   *Motivation:* Engineering purpose; Case H.
      *   *Tag:* **Required**.
  2.  **Logical Robustness:** The rule must yield optimal outcomes when the environment has full read-access to the agent's source code (including cases where the environment runs copies or simulations).
      *   *Motivation:* Case M, Case C, Engineering purpose.
      *   *Tag:* **Required**.
  3.  **Extortion Immunity:** The agent must not be reliably separated from resources by an adversary whose action is already fixed but logically correlated with the agent's choice (e.g., via simulation).
      *   *Motivation:* Case X.
      *   *Tag:* **Required**.
  4.  **Indexical Indifference:** The rule must treat the agent's output identically to the output of any copy or simulation running the same procedure on the same inputs, provided the agent cannot distinguish them.
      *   *Motivation:* Case M.
      *   *Tag:* **Required**.
  5.  **Dynamic Consistency:** The rule must not recommend precommitments at $t_0$ that the agent would rationally abandon at $t_1$ without new information.
      *   *Motivation:* Case P.
      *   *Tag:* **Required**.
  6.  **Predictor Sensitivity:** The verdict must vary continuously with a predictor's accuracy, specifying a threshold where the switch from "ignore" to "accommodate" occurs.
      *   *Motivation:* Case N (reliability variance).
      *   *Tag:* **Required** (for robustness).
  7.  **Causal Isolation:** The rule must never treat an act as affecting something it causally cannot affect.
      *   *Motivation:* Intuition of control.
      *   *Tag:* **Prejudice** (CDT). *Conflicts with N, M, X.*
  8.  **Evidential Ranking:** The rule must rank acts by the expected value of outcomes conditional on the act ($E[O|A]$).
      *   *Motivation:* Informational relevance.
      *   *Tag:* **Prejudice** (EDT). *Conflicts with G, X.*
  9.  **Statewise Dominance:** The rule must satisfy dominance whenever one act yields better outcomes than another in every possible state of the world.
      *   *Motivation:* Sure-thing principle.
      *   *Tag:* **Prejudice** (CDT). *Conflicts with N, T.*
  10. **Transparency Stability:** The verdict must not flip absurdly when information is revealed (e.g., seeing the money in the box).
      *   *Motivation:* Case T.
      *   *Tag:* **Conditional** (Required if agent must operate in transparent environments without paralysis).

  **Verdict on Candidate Demands:**
  *   *Causal Isolation:* **Prejudice.** Rejecting this is necessary to handle Case N and M.
  *   *Evidential Ranking:* **Prejudice.** Leads to failure in Case G (Smoking Lesion) and X.
  *   *Dominance:* **Prejudice.** Incompatible with Case N (Newcomb).
  *   *Extortion Immunity:* **Required.** Essential for security in Case X.
  *   *Indexical Indifference:* **Required.** Essential for Case M.
  *   *Dynamic Consistency:* **Required.** Essential for Case P.
  *   *Identical Epistemic Situations:* **Required.** Subset of Indexical Indifference.
  *   *Continuity/Threshold:* **Required.** Prevents brittle behavior in N.
  *   *Source Code Access:* **Required.** Essential for Engineering purpose.
  *   *No Logical Omniscience:* **Required.** Essential for Case H and bounded resources.

  **Substantive First-Order Claims:** Requirements 7, 8, and 9 are substantive claims about the nature of decision-making disguised as structural requirements. They prescribe *how* to calculate value rather than *what* constraints the calculation must satisfy.

  **Case M and Mixed Policies:**
  The requirement set (specifically Logical Robustness + Indexical Indifference) does **not** force a mixed policy in Case M. If both copies run the same deterministic procedure on the same inputs, they output the same action. A mixed policy requires a shared random source or indexical differentiation. If the rule allows for a shared random seed (correlated randomness), a mixed policy is possible; if not, the rule forces identical pure strategies. The requirements do not *force* mixing, but they do force the rule to account for the correlation if mixing is attempted.

  ---

  ### Incompatibility Analysis

  **Jointly Unsatisfiable Subsets:**
  1.  **Causal Isolation (7) + Newcomb Success (N):** You cannot satisfy Causal Isolation and One-Box in Case N. If the box contents are fixed, One-Boxing causally affects nothing. To win N, you must act *as if* you influence the past prediction.
      *   *Drop:* Causal Isolation. *Cost:* Violates standard intuition of "control."
  2.  **Evidential Ranking (8) + Genetic Lesion Success (G):** You cannot maximize $E[O|A]$ and Quit in Case G. Quitting is evidence of lacking the gene, but does not cause it. Maximizing conditional expectation leads to "quitting" to feel safe, which is irrational.
      *   *Drop:* Evidential Ranking. *Cost:* Requires distinguishing causal/logical links from common causes.
  3.  **Dominance (9) + Dynamic Consistency (5) + Transparency (T):** In Case T (Transparent Newcomb), if you see the money, Dominance demands Two-Boxing. If you Two-Box, you are the type who Two-Boxes, so the predictor wouldn't have put the money there. If you precommitted to One-Boxing (Dynamic Consistency), you must One-Box even seeing the money.
      *   *Conflict:* Dominance says "Take the visible money." Dynamic Consistency says "Stick to the plan that put the money there."
      *   *Drop:* Dominance. *Cost:* Accepting that "taking free money" can be the wrong move if it proves you are the wrong *type* of agent.

  **Specific Verdicts:**
  *   **N (Favorable Prediction) + X (Extortion Immunity):** **Compatible.** Both require the agent to select the output of its decision procedure that maximizes utility across logical correlations. In N, Output=One-Box yields High Utility. In X, Output=Refuse yields High Utility. A rule based on "Functional Decision Theory" (ranking procedure outputs) satisfies both.
  *   **Dominance + G + T:** **Incompatible.** If you enforce Dominance (CDT), you handle G correctly (Smoke) but settle T by Two-Boxing. In T, Two-Boxing is dominant *given the money is there*, but being the *type* to Two-Box means the money is rarely there. If "settling T the wrong way" means "getting less money than possible," Dominance fails T (because it prevents you from being the type who gets the money). If it means "taking the money when visible," Dominance succeeds T but fails Dynamic Consistency (you wouldn't have precommitted).
      *   *Argument:* Dominance ignores the logical link between your choice and the predictor's past action. To win N and T (consistently), you must violate Dominance in the specific state where the box is full.

  **Single Most Exclusionary Requirement:**
  **Bounded Computability (1) + Logical Robustness (2).**
  While philosophical conflicts (Dominance vs. Newcomb) are well-trodden, the engineering constraint that the agent must compute this *without logical omniscience* while the environment *reads its source code* excludes almost all existing candidate rules. CDT and EDT fail Logical Robustness. FDT/TDT often assume logical omniscience (ability to evaluate counterpossible outputs). No known rule fully satisfies Bounded Computability in the presence of adversarial source-code analysis (Case H/C).

