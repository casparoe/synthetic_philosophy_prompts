      *   **Position:** Generations are *social kinds*, not *natural kinds*. Therefore, they don't need the sharp boundaries of chemical elements. They are real because they have causal power and shape social reality, not because they exist independently of human classification.
      *   **Key Concepts to Deploy:**
          *   Social Kind vs. Natural Kind (indifference vs. interaction).
