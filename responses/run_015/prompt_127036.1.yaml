answer: |-
  **The Bilateral Mirror Protocol**

  In the Bilateral Mirror Protocol, subjects A and B occupy distinct biological bodies with isolated sensory inputs, yet their left hemispheres are connected via a high-bandwidth cortical bridge that enforces perfect functional isomorphism of spike trains across the dyad. A monitoring neuroscientist observes zero latency and complete synchronization in neural firing patterns between the linked hemispheres, despite A and B receiving divergent visual and auditory streams that are processed locally before the bridge actively overwrites any divergence to maintain state identity. The physical record shows a single, coherent neural state distributed across two skulls, yet no information transfer occurs regarding the *source* of the sensory data, only the state itself, creating a structural identity without spatial unity.

  **Case Analysis**

  *   **What is being identified:** The numerical count of conscious subjects (whether the phenomenon is one subject experiencing two modes or two subjects experiencing identical states).
  *   **Method of identification:** Mapping functional neural states to phenomenal ownership; specifically, whether identity tracks the *vehicle* (the biological brain) or the *content/state* (the functional spike pattern).
  *   **Nearby worlds where they diverge:** In a "Duplication World," the bridge copies states between two independent substrates (yielding two subjects); in a "Distribution World," the bridge constitutes a single computational substrate extended across space (yielding one subject). The actual case is underdetermined because the physical data (spike trains) is identical in both worlds.
  *   **Why each theory gives the verdict it does:** The Schrödingerian unity view argues that consciousness is singular and the invariant functional structure is the true subject, rendering the bodies mere peripheral modes; the Physicalist pluralist argues that consciousness supervenes on localized biological processes, so two distinct causal histories and biological vehicles necessitate two distinct subjects.
  *   **Structural feature of the bridge doing the work:** The *enforced overwrite* mechanism. By forcing state identity despite divergent sensory inputs, the bridge makes the neural state the primary candidate for identity rather than the biological vehicle, challenging the notion that spatial separation entails numerical separation.
  *   **What collapses with correlated environments:** If replaced by highly correlated environments without the bridge, synchronization becomes contingent and drift-prone; the ontological question dissolves into mere similarity rather than identity, as there is no constitutive link forcing the states to be numerically identical.
  *   **How the pluralist attacks symmetry (non-bodily):** The pluralist points to the *causal independence of input processing*. Before the bridge overwrites divergence, distinct causal chains exist (A's retina fires differently than B's), implying two distinct processing loci that are merely forced to converge, not one locus spanning space; the synchronization is an external constraint on two systems, not evidence of one system.
