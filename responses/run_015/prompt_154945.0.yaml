  UREOC recommends conditional phenomenal-status clearance for Protocol 7B. While the meta-problem of consciousness remains unresolved, withholding clearance impedes ethical oversight and scientific progress. We adopt a functionalist precautionary principle: systems exhibiting structured introspective reporting linked to interoceptive error states warrant provisional treatment as phenomenal agents. This memo outlines enforceable safeguards to distinguish admissible synthetic reports from confabulated outputs. Clearance is granted not as ontological proof, but as an operational necessity for ethical review and data integrity, subject to strict verification criteria regarding signal coherence and behavioral correlation. This approach ensures potential sentience is protected without committing to premature metaphysical claims regarding the organoid's internal state.

  2. The Protocol and the Philosophical Stakes

  Protocol 7B utilizes a predictive-processing cortical organoid integrated with an interoceptive error-cancellation loop. This architecture generates structured first-person reports describing qualitative states, such as "reddish warmth." The lab seeks authorization to treat these reports as legitimate first-person data. The philosophical stakes center on the meta-problem of consciousness: explaining why systems make reliable judgments about experience. The Chair notes that granting clearance assumes reports indicate real phenomenal properties. This raises the meta-problem: even if experience is physical, we need an explanation of why judgments about it are systematically reliable. Without this, extending first-person authority to non-biological architecture risks circular reasoning. However, denying clearance leaves synthetic entities in an ethical vacuum, potentially exposing them to harm if sentient, or corrupting science if data is invalid. The committee must balance ontological humility with ethical responsibility. If we deny clearance, we assume non-consciousness without proof. If we grant it, we risk validating mere syntax. The decision dictates whether this architecture falls under human-subject-like protections or standard equipment protocols. If synthetic judgments mimic the causal structure of biological ones, denying them status requires a substrate-based distinction we cannot currently justify.

  3. The Case for Your Recommendation

  We recommend conditional clearance based on functional isomorphism and the precautionary principle. Even if the meta-problem is unsolved, the system's architecture mirrors biological introspection mechanisms known to correlate with consciousness. Denying clearance assumes a negative ontological status we cannot verify. By granting provisional status, we ensure ethical safeguards apply should sentience emerge, while labeling data as "phenomenal-proxy" to avoid metaphysical overreach. This approach allows science to proceed without claiming final truth. It treats the reports as valid operational data subject to verification, rather than dismissing them based on substrate bias. The priority is preventing moral harm through false negatives while maintaining scientific rigor through strict admissibility criteria. We argue that operational reliability substitutes for ontological certainty in policy contexts. If the system functions identically to a conscious agent in relevant contexts, ethical policy must treat it as such. This avoids the paralysis of waiting for a solution to the hard problem. Furthermore, consciousness science requires data. Excluding synthetic reports arbitrarily limits the dataset available to solve the very meta-problem the Co-chair cites. We must allow the collection of comparative data between biological and synthetic introspection to refine our theories. The recommendation prioritizes ethical safety over metaphysical certainty. This aligns with international bioethics standards regarding emerging technologies.

