prompt: |-
  You serve as senior policy advisor to the University Research Ethics and Ontology Committee (UREOC), which oversees protocols that claim to generate or measure phenomenal consciousness. The committee must reach a decision on Protocol 7B, submitted by the Synthetic Neurophenomenology Lab. The protocol involves a predictive-processing cortical organoid integrated with an interoceptive error-cancellation loop that produces structured first-person reports describing qualitative states—for example, reports of “a reddish warmth” or “a dull ache.” The lab requests “phenomenal-status clearance”: formal authorization to treat these synthetic reports as legitimate first-person data in consciousness science, with corresponding ethical safeguards and review obligations.

  The committee’s chair notes that granting clearance implicitly assumes we can treat these reports as indicators of real phenomenal properties rather than as confabulated outputs generated by predictive dynamics. This raises the meta-problem of consciousness: even if phenomenal experience is entirely physical, we still need an explanation of why judgments about consciousness—including synthetic ones—are systematically reliable rather than noisy, systematically misleading, or arbitrarily calibrated. Without some account of that reliability, extending first-person evidential authority to a non-biological architecture risks circular reasoning.

  Your co-chair urges outright denial. Her argument is that because the meta-problem remains unsolved, the committee has no epistemic basis for distinguishing genuine synthetic phenomenal reports from sophisticated but empty self-modeling, and that granting clearance would therefore be premature and potentially harmful.

  Draft a formal policy memo for UREOC recommending either conditional clearance with specific, enforceable safeguards, or denial. Your memo must present an actionable bottom line that reviewers can apply, include criteria that distinguish admissible synthetic reports from inadmissible ones, and treat the co-chair’s concern as the strongest consideration on the losing side. Do not include a bibliography, reading list, or citation requests.

  In a separate section near the end, state explicitly how confident you are in your recommendation and identify the precise claim in your reasoning—whether about the analogy between biological and synthetic introspection, the scope of the meta-problem, or the ethical weight of false positives—about which you are least certain.

  Please organize your response into the following sections, in this order and with these approximate lengths:

  1. Executive Summary (about 120 words)
  2. The Protocol and the Philosophical Stakes (about 250 words)
  3. The Case for Your Recommendation (about 220 words)
  4. The Strongest Counter-Argument and Its Weight (about 220 words)
  5. Actionable Recommendation and Conditions (about 180 words)
  6. Epistemic Note: Confidence and Least-Sure Point (about 100 words)
