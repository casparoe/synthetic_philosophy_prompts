answer: |-
  # Candidate Theories of Military Obligation

  To map this conceptual space, we must distinguish five competing rationales. First, the *Membership View* holds that protection and obligation are reciprocal consequences of belonging; the state defends members, and members owe service. Second, the *Statist View* prioritizes the state's monopoly on violence and neutrality; individuals cannot privatize war-making. Third, the *Fair-Share View* treats defense as a public good requiring equal distribution of burdens among beneficiaries. Fourth, the *Deterrent View* argues universal liability exists primarily to signal resolve to aggressors, regardless of actual headcount. Fifth, the *Just-Cause View* grounds obligation in the morality of the specific conflict, independent of borders.

  # Testing the Bundle Against Theories

  The current bundle of practices is not a coherent whole but a layering of these theories, creating significant friction.

  **Conscription and Civilian Service:** The Membership and Statist views license compulsory service and the reserve liability you describe; the state claims a dormant right over the member's body to ensure collective survival. However, the punitive length of civilian service (twelve months versus minimal military tours) is indefensible on the Fair-Share View. If the goal is equitable burden distribution, a conscientious objector performing non-combatant labor should not bear a heavier time cost than a combatant. This disparity suggests the institution is not merely allocating burdens but penalizing dissent, which aligns with the Statist View (enforcing compliance) but contradicts the Membership View (which implies mutual respect among co-authors). The Sweden model (selective activation) fits the Deterrent View perfectly—liability signals resolve without needing universal deployment—but violates Fair-Share, as the burden falls arbitrarily on a screened few.

  **Foreign Enlistment vs. Foreign Recruitment:** Here the bundle fractures. The British-style ban on foreign enlistment is pure Statism: it prevents citizens from compromising state neutrality or monopolizing violence. It is also consistent with Membership, forbidding loyalty divergence. However, the French Foreign Legion model ("Français par le sang versé") directly contradicts this. It instrumentalizes violence for membership acquisition, treating warfighting as a commodity exchange rather than a duty of belonging. The Membership View cannot reconcile why blood spilled for France buys citizenship while blood spilled for a foreign ally (by a citizen) crimes them. The Just-Cause View would license foreign enlistment for正义 causes but cannot explain the conscription of unwilling citizens for state-defined causes. The bundle thus rests on a contradiction: violence is a sacred duty for citizens (Membership/Statist) but a transactional entry fee for foreigners (Instrumental/Statist).

  **Reserve Liability:** The decades-long claim on labor for sub-market compensation is hard to justify on Fair-Share grounds, which typically demand market equivalence or tax-based redistribution. It fits the Statist View (the state owns the resource) and the Membership View (permanent debt), but it creates a tension with liberal employment laws that constrain employers to accommodate reservists. This suggests the state is imposing private costs on third parties (employers) to sustain a public good, a distributional mess no single theory cleanly authorizes.

  # Strict Needs Versus Contingent Fits

  We must distinguish what the practice strictly presupposes from what merely sits well with it. The institution strictly requires the *Statist* premise: the state must retain the unilateral authority to define when and where violence is legitimate. Without this, the foreign enlistment ban and the conscription order collapse into individual moral calculations.

  However, many features are contingent. The *personal, in-kind* nature of service is not strictly required by the Statist or Deterrent views; a state could theoretically maintain a deterrent signal or monopoly through a defense tax that funds professionals. The *gendered* nature of Finnish conscription is theoretically orphaned; neither Membership nor Fair-Share supports excluding women from obligation if they are full members/beneficiaries. The *non-fungibility* of service (you must go, not pay) is a contingent fit with the Membership View (personal sacrifice binds the community) but is not strictly necessary for state survival. The bundle is underdetermined: a professional army funded by universal taxation could satisfy the Deterrent and Statist rationales equally well, meaning the surface law (conscription) does not settle the underlying theory.

  # The Probes: Commutation and Residence

  The hypothetical proposals act as stress tests for the underlying theory.

  **Commutation (Buying Out):** Allowing a conscript to fund a volunteer (possibly foreign) to take their slot tests fungibility. The Membership View rejects this strictly; if service is a ritual of co-authorship, it cannot be delegated. The Fair-Share View accepts it, provided the payment equals the burden's cost. The Deterrent View is indifferent to who serves, provided the trained headcount remains constant. However, if the rationale is *universal liability as a signal*, commutation destroys the institution's purpose. If aggressors know the wealthy or connected can opt out, the signal of total societal resolve weakens. Thus, the institution presupposes personal service only if the signal value of universal liability is paramount over mere headcount.

  **Residence-Based Obligation:** Shifting obligation from citizenship to residence moves the theory from Membership to Benefit Receipt. This dissolves the tension of the Foreign Legion: if presence triggers liability, foreigners serving are simply paying their dues. However, this clashes with the Foreign Enlistment Ban. If obligation is based on residence, why does the state claim authority over a citizen's violence abroad where they confer no benefit to the home state? This probe reveals the state's claim is ultimately over *persons* (citizens), not just *beneficiaries* (residents), reinforcing the Membership/Statist hybrid.

  # Theory Swaps and Institutional Consequences

  If we replaced the implicit theory with a **Just-Cause View**, the institution would require dismantling. Conscription would become impermissible unless the specific war was objectively just, determined by individual conscience rather than state order. The foreign enlistment ban would vanish, as citizens must be free to fight for justice elsewhere. The Foreign Legion would remain only if the causes were just. The reserve liability would be unjustifiable as a dormant claim for potentially unjust wars. The institution would cease to be a mechanism of state policy and become a registry for voluntary moral action.

  If we swapped to a **Pure Fair-Share View**, the institution would transform into a defense levy. Service would be one option among others (cash, logistics, care work). The punitive civilian service duration would be abolished as unequal burdening. Commutation would be standardized, not as a loophole, but as the norm. The Foreign Legion model would be scrutinized: if membership is earned by service, does that create a two-tier citizenship? Fair-Share demands equal burden for equal rights, so foreign recruits might gain rights proportionate to risk, but the state could not claim a monopoly on their violence beyond the contract term.

  Finally, some limbs of the bundle are simply unjustifiable on any coherent theory. The punitive disparity between military and civilian service lengths cannot be defended by Fair-Share (inequality), Membership (disrespect), or Statism (unnecessary for compliance). It appears to be a historical artifact of coercion retained for convenience. Similarly, the tension between banning citizen foreign enlistment while recruiting foreign enlistment creates a moral asymmetry that treats human life and violence as a national property right for citizens but a tradeable commodity for outsiders. No single theory reconciles this; it is a pragmatic inconsistency where the state claims exclusive rights to its own citizens' violence while commodifying the violence of others. The institution is not a philosophical system but a toolkit of control, patched together from incompatible moral sources.
