answer: |-
  Good morning to the faculty, the families, and most importantly the class of this year. It is a genuine honor to stand here, especially knowing that half of you are going to analyze the logical structure of every sentence I say while the other half is just checking to see if the tuition was worth it. I want to talk to you about something that kept me up all night arguing with a friend, which is probably not what you expect from a commencement address, but it feels relevant. We were arguing about a very old question that goes back to Plato, specifically this puzzle about why knowledge is actually better than just having a true belief. On the surface, if you and I both arrive at the right answer, does it matter if you knew why it was right and I just guessed? If we both get to the destination, isn't the result the same?

  My friend argued that knowledge is basically a true belief that survives what she called modal stress-testing. This is a fancy way of saying that if you know something, you still believe it even if things change slightly around you. If you just got lucky, your belief collapses the moment the context shifts. Imagine you need to get to a specific town. If you guess the right road and get there, you had a true belief. But if there was road construction you didn't know about, or if you had left five minutes later, you would have gotten lost. Your success was fragile. But if you studied the map, understood the terrain, and knew why that road was the right one, you could handle the detour. You could handle the rain. Your belief is robust across different scenarios, or nearby possible worlds, to use the philosophical jargon. That is what you have been doing here. You haven't just been collecting right answers for a test; you have been stress-testing your understanding so it doesn't fall apart when the real world throws something unexpected at you.

  Now, I know what some of you are thinking, and I want to be careful here because I know luck plays a huge role in all of our lives. There are people who succeed without this kind of robust understanding, and there are people who work hard and still face setbacks. I am not standing here to tell you that everything good that happened to you was purely earned or that everything bad that happens later will be your fault. That would be false and unfair. The value of modal robustness isn't that it guarantees success every time. The value is that it gives you a better probability of staying upright when the ground shakes. A lucky belief gets you through today. Knowledge gets you through next year, and the year after, when the conditions are different than they are right now. The world is not static. The jobs you are going into, the relationships you are building, the problems you are trying to solve, they are all going to change shape. If your understanding is fragile, you will break when the context shifts. If your understanding is robust, you will adapt.

  This is what I see when I look at this graduating class. I see people who have learned how to hold their convictions lightly enough to test them but strongly enough to stand on them. For the philosophy majors in the audience, you know that we never fully solved the Meno problem. There are always edge cases where justification gets messy. But for the rest of us, the practical lesson is clear. Education is not about accumulating a receipt of facts to prove you were right. It is about building a structure of understanding that can withstand the wind. It is about moving from being someone who happens to be right to someone who can find the right path again even if they lose the map.

  So as you leave this place, do not worry too much about whether you have all the right answers today. Worry about whether your answers are sturdy. Worry about whether you understand the why behind the what. Because there will be days when luck is not on your side. There will be days when the easy path is closed off. On those days, you will not be able to rely on a lucky guess. You will have to rely on the robustness of what you have learned here. You will have to rely on the fact that you know how to think, not just what to think. That is the difference between a fleeting success and a life of substance. That is why knowledge is better than true belief. Not because it feels different, but because it lasts longer. Congratulations to all of you, and may your beliefs hold true even when the world changes around them.
