      *   *Refinement:* The "Mirage" option is actually the most important upstream question. If the problem is ill-posed, nothing else matters. I need to make sure Phase 1 reflects that severity.

  9.  **Final Polish:** Organize into clear sections: The Core Thesis, The Research Roadmap (Phased), The "Mirage" Check, The SB Link, and Reshuffling Conditions. (Proceed to generate output).

  *(Self-Correction during drafting)*: I initially thought about putting Sleeping Beauty earlier. But logically, you need to understand the decision-theoretic structure of AMD before mapping it to the epistemic structure of SB. So AMD first, then SB. Also, need to emphasize that "Updateless" isn't the only contender; "Functional Decision Theory" (FDT) is the modern successor in that lineage. I should use the broader term "Policy-Based Decision Theories."

  *(Final thought on "2 Years")*: That's a PhD dissertation timeline or a serious independent study. The goal shouldn't be "Solve Decision Theory" but "Clarify the specific conceptual knot AMD represents."

