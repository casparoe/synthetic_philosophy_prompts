  ## 3. PAYOFF TABLES (For Instructor Board Work)

  **Game 1 Payoffs**
  | Prediction \ Choice | Only Box A | Both Boxes |
  | :--- | :--- | :--- |
  | **Pred: Only A** (85% if 1-Box) | **100** | **101** |
  | **Pred: Both** (85% if 2-Box) | **0** | **1** |
  | *Expected Value (EDT)* | *85* | *16* |
  | *Dominance (CDT)* | *+0* | *+1* |

  **Game 2 Payoffs**
  | Trait \ Choice | Pleasant (+1) | Unpleasant (0) |
  | :--- | :--- | :--- |
  | **Has Trait** (85% if Pleasant) | **-99** (1 - 100) | **-100** (0 - 100) |
  | **No Trait** (85% if Unpleasant) | **+1** (1 - 0) | **0** (0 - 0) |
  | *Expected Value (EDT)* | *-84* | *-15* |
  | *Causal (CDT)* | *+1* | *0* |

  *(Note: In Game 2, the Trait is fixed. CDT ignores the correlation and takes the +1. EDT avoids the "news" of having the Trait.)*

  ---

  ## 4. DEBRIEF SCRIPT & MAPPING

  **Phase 1: The Reveal (5 Mins)**
  1.  Open the sealed envelopes for Game 1. Tally how many students got the 100 points vs. 0.
  2.  Reveal the "Marker" status for Game 2 based on their Questionnaire Type (e.g., "Type 1 had the Marker").
  3.  Calculate the *actual* average score for 1-Boxers vs. 2-Boxers on the board.
  4.  Calculate the *actual* average score for Pleasant vs. Unpleasant choosers.

  **Phase 2: Mapping the Disagreement (15 Mins)**
  *Do not lecture. Ask questions to draw out the following points.*

  **Point 1: The Identical Sentence**
  *   **Ask:** "What is the strongest argument for taking the extra point in Game 1?"
  *   **Expected Answer:** "The money is already there or it isn't. My choice can't change the past."
  *   **Ask:** "Does that same sentence apply to Game 2?"
  *   **Expected Answer:** "Yes. The gene is already there or it isn't. My choice can't change my DNA."
  *   **Write on Board:** *"The state is fixed. Take the extra point."*
  *   **Observation:** In Game 1, following this sentence cost the class roughly **69 points per person** (85 vs 16 EU). In Game 2, following this sentence gained **1 point per person**.
  *   **Lesson:** The probabilities (0.85) and payoffs (100/1) were identical. The verdicts came apart. The difference must be **Causal Structure**.

  **Point 2: The Intervention Vote (Game 3)**
  *   **Reveal Ballot C Results.**
  *   **Likely Split:** Most will vote **Yes** for Game 1 (want to be a 1-Boxer) and **No** for Game 2 (don't want to be an Unpleasant-Chooser).
  *   **Ask:** "Why pay in Game 1 but not Game 2? In both cases, you are paying to change your disposition to match the evidence."
  *   **Lesson:** In Game 1, the Predictor is sensitive to your **Decision Procedure**. Changing your procedure changes the prediction. In Game 2, the Marker is sensitive to a **Distal Cause** (genetics) that also shapes your desire. Changing your procedure does not change the Marker.
  *   **Key Phrase:** "Sensitivity to Decision Procedure vs. Tracking a Distal Cause."

  **Point 3: The Coin Flipper**
  *   **Ask:** "What if a student announced they would flip a coin to decide?"
  *   **Analysis:**
      *   **Game 1:** The Predictor cannot predict a coin flip (accuracy drops to 50%). EU(1-Box) = 50. EU(2-Box) = 51. **2-Boxing becomes rational.** The causal argument becomes sound because the correlation is broken.
      *   **Game 2:** The Marker is still fixed. Coin flipping gains nothing.
      *   **Cost:** The coin flipper destroys the expected value in Game 1 (dropping from 85 to 50) to make the causal dominance argument valid.
  *   **Lesson:** Consistency has a price. You can have causal soundness or expected value, but with a perfect predictor, you cannot have both.

  **Phase 3: Addressing the "Correct Answer" (5 Mins)**
  *   **Student Demand:** "So, which one is actually rational?"
  *   **Your Response:** "If I tell you, I ruin the next 20 years of your philosophical life. But look at the cost of consistency."
      *   If you are a **1-Boxer**: You must explain why Game 2 doesn't force you to choose Unpleasant (avoiding the medical news). You must locate the causal break.
      *   If you are a **2-Boxer**: You must explain why you left ~85 points on the table in Game 1. You must accept that rationality can be money-pumped in this specific setup.
  *   **Verdict:** "This activity produces choices, not verdicts. The metaphysics of *what the predictor is sensitive to* is the battleground, not the math."

  ---

  ## 5. TROUBLESHOOTING & FAILURE MODES

  **1. Students Naming Decision Theories (CDT/EDT) Early**
  *   **Risk:** They stop experiencing the tension and start debating labels.
  *   **Fix:** Establish a "Jargon Blackout" rule at the start. "Until the debrief, you may only talk about points, boxes, and genes. No theory names."
  *   **If they slip:** "Write that term on the board. We will unpack it in 40 minutes. For now, stick to the points."

  **2. Students Trying to Game the Predictor**
  *   **Risk:** A student realizes the Quiz predicts the Box and tries to answer the Quiz to "force" 100 points, then 2-Box.
  *   **Fix:** This is actually a teaching moment. In the debrief, ask: "Did anyone try to outsmart the quiz?" If yes, reveal that the prediction was sealed *before* they read Handout 1.
  *   **Lesson:** This demonstrates **Screening Off**. If you decouple your choice from your disposition, the predictor fails, and 2-Boxing becomes dominant (see Coin Flipper point).

  **3. Student Refusal (Illegitimate Setup)**
  *   **Risk:** A student refuses to play because "The predictor isn't real" or "The medical link is fake."
  *   **Fix:** Offer an **Observer Role**. They get the average payoff of the class.
  *   **Script:** "You are exempt. You will receive the class average. However, you must still fill out the ballot so we have data on your intuition."
  *   **Note:** Do not argue the metaphysics during the game. Acknowledge the idealization.

  **4. Polarization (Two Camps Talking Past Each Other)**
  *   **Risk:** 1-Boxers and 2-Boxers entrench.
  *   **Fix:** Use the **Game 3 Vote** to cross-cut the alliances. Usually, 2-Boxers in Game 1 will vote "No Pay" in Game 2. Force them to explain why their principle didn't carry over.
  *   **Script:** "You argued for Causal Dominance in Game 1. Why did you abandon it in Game 2? Was it the money, or the cause?"

  **5. The 85% Problem (Imperfect Predictor)**
  *   **Risk:** Students argue that 85% isn't high enough to force the Newcomb intuition (which usually assumes near-perfect prediction).
  *   **Fix:** Acknowledge this openly.
  *   **Script:** "You are right. With 85%, the Expected Utility gap is smaller than with 99%. But the *structure* of the disagreement remains. If you 2-Box here, you must 2-Box with a 99% predictor. Does the principle change with the percentage, or just the stakes?"
  *   **Math Note:** At 85%, EU(1-Box) = 85, EU(2-Box) = 16. The gap is massive. The dominance argument is the only thing holding 2-Boxers up.

  ---

  ## 6. LIMITATIONS NOTE (For Instructor Eyes Only)

  **What This Activity Cannot Reproduce:**
  1.  **Metaphysical Weight:** A questionnaire is not a near-perfect demon. Students know this. They may treat Game 1 as a standard risk problem rather than a challenge to causality. You must supply the "What if the predictor *was* perfect?" counterfactual in words.
  2.  **Long-Run Frequency:** This is a one-shot game. Newcomb's problem is often stronger when iterated. Students may argue "I only live once, I'll take the guaranteed 1 point." You must explain that Rational Choice theory generally seeks principles that hold across possible worlds, not just actual outcomes.
  3.  **The "Tickle" Defense:** Sophisticated students may argue they can introspect their disposition (the "tickle") and condition on that, dissolving the correlation. This activity does not block this move. You will need to address it verbally in the debrief (i.e., "The predictor sees what you *will* do, not just what you *feel* like doing").

  **How Little You Can Get Away With Saying:**
  *   **Minimum:** You must explicitly state that the *only* difference between Game 1 and Game 2 is the direction of the arrow between Choice and State.
  *   **Minimum:** You must confirm that the 85% accuracy claim is based on the *correlation* between Quiz Type and Choice, not magic.
  *   **Do Not:** Do not validate one side as "Correct." The value of the session is the *persistence* of the disagreement despite identical math.

  **Final Instruction:**
  Record the private ballots **before** any discussion. If you let them talk before voting on Game 3, the experiment is contaminated. Collect papers physically. Do not allow digital devices during the 75 minutes.
