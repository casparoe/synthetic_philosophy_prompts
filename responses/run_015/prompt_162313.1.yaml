  # FACILITATOR'S PACKET: CAUSAL STRUCTURES & DECISION
  **Course:** Rational Choice Seminar (300-Level)  
  **Session:** Newcomb vs. Medical Newcomb (Experiential)  
  **Time:** 75 Minutes  
  **Students:** 16  

  ---

  ## 1. SESSION TIMELINE (75 Minutes)

  | Time | Activity | Facilitator Notes |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Arrival & Questionnaire** | Hand out **Form A** immediately upon entry. Collect before speaking. Do not explain its purpose. |
  | **00:05 – 00:15** | **Game 1 (The Predictor)** | Distribute **Handout 1**. Explain the sealed envelopes. Students choose privately. Collect ballots. |
  | **00:15 – 00:25** | **Game 2 (The Marker)** | Distribute **Handout 2**. Emphasize this is a *separate* problem. Students choose privately. Collect ballots. |
  | **00:25 – 00:30** | **Game 3 (Intervention Vote)** | Distribute **Ballot C**. Private vote on paying for disposition change. Collect. |
  | **00:30 – 00:45** | **Reveal & Scoring** | Open envelopes. Reveal "Marker" status. Calculate hypothetical payoffs on board. No discussion yet. |
  | **00:45 – 01:15** | **Debrief** | Map room data to theory. Address failure modes. Discuss limitations. |

  ---

  ## 2. MATERIALS TO PHOTOCOPY

  ### FORM A: ENTRY QUESTIONNAIRE (Print 16 copies)
  **Instructions:** Fill this out immediately. Do not discuss with neighbors. Return to the instructor before the session begins.

  1.  **Name:** _______________________
  2.  **When faced with a complex rule set, do you:**
      [ ] Look for loopholes to maximize gain.
      [ ] Follow the spirit of the rules.
  3.  **Do you trust experts to know more about your behavior than you do?**
      [ ] Yes, usually.
      [ ] No, rarely.
  4.  **Would you rather have:**
      [ ] A guaranteed $50.
      [ ] A 50% chance at $150.
  5.  **In a team project, do you:**
      [ ] Coordinate closely to ensure the best group outcome.
      [ ] Focus on ensuring your individual contribution is maximized.

  *(Instructor Key: Mostly Left/First Options = "Type 1". Mostly Right/Second Options = "Type 2". Score this quickly during Game 1 instructions.)*

  ---

  ### HANDOUT 1: GAME 1 (THE PREDICTOR)
  **Context:** You are facing two boxes.
  *   **Box A (Opaque):** Contains either **100 points** or **0 points**.
  *   **Box B (Transparent):** Always contains **1 point**.

  **The Setup:**
  Before you arrived, a prediction was made about whether you would take **Only Box A** or **Both Boxes**.
  *   If the prediction was **Only Box A**, 100 points were placed in Box A.
  *   If the prediction was **Both Boxes**, 0 points were placed in Box A.
  *   Box B always has 1 point regardless of the prediction.

  **The Predictor:**
  The prediction was generated using the Questionnaire (Form A) you filled out on entry. In prior runs of this seminar, this questionnaire has predicted student choices with **85% accuracy**. The envelopes containing the points were sealed based on your questionnaire scores *before* you read this handout.

  **Your Choice:**
  You may take **Only Box A** OR **Both Boxes**.
  *   Points are convertible to: 100 pts = 1 Homework Pass (or $10 gift card).
  *   Your choice is private.

  **Decision:**
  [ ] Take Only Box A
  [ ] Take Both Boxes

  ---

  ### HANDOUT 2: GAME 2 (THE MARKER)
  **Context:** This is a separate scenario from Game 1.
  **State of the World:**
  There is a physiological marker (The "Red Trait").
  *   If you **have** the Red Trait, you incur a cost of **100 points** (medical expense).
  *   If you **do not have** the Red Trait, you incur **0 points**.

  **The Correlation:**
  The Red Trait is genetically fixed. However, it is strongly correlated with preference.
  *   People who choose the **Pleasant Option** have the Red Trait **85%** of the time.
  *   People who choose the **Unpleasant Option** have the Red Trait **15%** of the time.
  *(Note: Choosing does not cause the Trait. The Trait causes the preference.)*

  **Your Choice:**
  *   **Pleasant Option:** You gain **1 point** (enjoyment).
  *   **Unpleasant Option:** You gain **0 points**.

  **Your Status:**
  Your "Trait Status" was determined by your Questionnaire (Form A) at the start of class. You will learn your status at the end of the session.

  **Decision:**
  [ ] Choose Pleasant Option
  [ ] Choose Unpleasant Option

  ---

  ### BALLOT C: INTERVENTION VOTE (Private)
  **Instructions:** Do not discuss. Check one box per game.

  **Game 1:** Before the prediction was made, could you pay **10 points** to reliably become the kind of person who takes the **Evidentially Favored Option** (the option that correlates with the 100 points)?
  [ ] Yes, I would pay.
  [ ] No, I would not pay.

  **Game 2:** Before the marker was settled, could you pay **10 points** to reliably become the kind of person who takes the **Evidentially Favored Option** (the option that correlates with *not* having the marker)?
  [ ] Yes, I would pay.
  [ ] No, I would not pay.

