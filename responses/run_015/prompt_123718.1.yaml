      *   **Context:** The user is a municipal archivist working with 1970s zoning codes, heritage demolition permits, exception logs, etc.
      *   **Task:** Restate the debate using *only* the user's archival vocabulary (codes, exception logs, permits, precedents, written ordinance vs. approved exception).
