  2.  **Deconstruct the Philosophical Debate:**
      *   **Moral Generalism:** Moral principles exist and are necessary for moral judgment. Actions are right/wrong because they fall under general principles (e.g., "Lying is wrong"). Exceptions need explaining via further principles.
      *   **Moral Particularism:** Moral judgment depends on the specific context. General principles are at best rules of thumb, at worst misleading. The morally relevant features of a situation change depending on the context (holism of reasons). You don't need a principle to judge a case; you need sensitivity to the details.
      *   **Key Tension:** Can you codify morality like a law book, or is it more like case-by-case discretion based on nuance?

  3.  **Map to Archival Vocabulary:**
      *   *Generalism* = The Written Ordinance / The Zoning Code. The idea that there is a master file that dictates the outcome for every possible building. If a permit was approved, it *must* have fit the code, or the code was amended formally.
      *   *Particularism* = The Approved Exception / The File Itself. The idea that the outcome was determined by the specific bricks, the specific neighbour complaint, the specific year, not necessarily by a rigid rule. The "rule" is just a summary of past files, not the boss of them.
      *   *Exception Logs* = Where Generalism tries to swallow Particularism (explaining away the deviation).
      *   *Precedent Folders* = Where Particularism tries to find patterns without admitting they are rules.

  4.  **Drafting the Mapping (Iterative Process):**

      *   *Generalism:* "The Code is King." Every decision *must* be traceable to a clause. If a demolition permit was granted, there is a clause that allowed it. If it looks like an exception, we just haven't found the right sub-clause yet. Morality is like the master zoning plan.
      *   *Particularism:* "The File is King." The Code is just a rough guide. The actual decision was made because *this* building was rotten, *this* owner was penniless, *this* street was quiet. You can't write a code for every rotting beam. Morality is like the stack of approved permits where each one stands on its own merits, not because it ticked a box.

      *   *Honesty Check:*
          *   *Fits:* The tension between rule-based processing and case-by-case discretion fits well. Archivists see the gap between policy and practice.
          *   *Distorts:* Moral judgments aren't always recorded like permits. There's no "approval stamp" on a moral action.
          *   *No Equivalent:* Moral *motivation* or *character*. Archives record outcomes, not internal deliberation. Also, the normative force (why we *should* follow the rule) is different in law vs. morality.

  5.  **Drafting the Residue Report:**
      *   What's left? The "ought." Archives describe what *was* done. Morality prescribes what *should* be done.
      *   Does this mean the framework is missing something? Yes, archives are descriptive/historical; morality is normative.
      *   Does it mean philosophers are arguing over nothing? No, but it shows the limits of bureaucratic analogies. The "gap" the archivist sees is evidence for particularists (rules fail), but generalists would say "we need better rules."

  6.  **Refining Tone and Language:**
