      *Key distinction:* Generalists say the Code *causes* the Permit decision. Particularists say the Permit decision *exists*, and the Code is just a later attempt to summarise them (and often fails).

      *Residue:* The archive is backward-looking (what happened). Morality is forward-looking (what to do). This is the crucial missing piece.

