gree to isolate the specific cases where our theories diverge in prediction or explanation rather than mere terminology. We agree that verbal disputes regarding the definition of "property" should be minimized in favor of functional differences in explanatory power. We agree that the goal of this document is clarity regarding our divergence, not rhetorical victory. We acknowledge that the emotional resonance of "really true" versus "story-true" is a phenomenon both must account for, even if our explanations differ. We specifically agree that the phrase "true in the manuscript" operates as a modifier that suspends standard worldly commitment. We agree that when the manuscript says "the letters were burned" and the letters were indeed burned, the sentence token is identical but the context of evaluation differs. We agree that Marguerite's discomfort stems from the inability to toggle cleanly between these contexts when grief is involved. We agree that the substantivist sees a gap in the deflationary account regarding why the overlap feels significant. We agree that the deflationist sees unnecessary metaphysical multiplication in the substantivist account. We agree that the manuscript serves as the test case for our theories. We agree that neither theory changes the past, but both change how we describe our relation to it.

  2. "Where they still differ"

  | Issue | Marguerite (Deflationist) | Friend (Substantivist) |
  | :--- | :--- | :--- |
  | **Nature of Truth** | Truth is not a substantive property; it is a logical device for disquotation and generalization without deep nature. | Truth is a genuine normative property that beliefs possess when they accurately represent reality. |
  | **Explanatory Role** | Truth does not explain success; successful action explains why we attribute truth to the guiding beliefs. | Truth explains success; believing what is true tends to satisfy desires because truth connects mind to world. |
  | **Fictional Overlap** | "True in fiction" uses the same logical device but within a pretense; the overlap is coincidental, not metaphysical. | "True in fiction" lacks the property of truth; the overlap shows the property is present in one case and absent in the other. |
  | **Normative Force** | Norms of assertion are social rules; truth is the label we apply when rules are met, not the source of the rules. | Norms of assertion are grounded in the nature of truth; we ought to assert only what is true because truth is the aim of belief. |

  3. "Cruxes and predictions"

  **Crux 1: The Burned Letters**
  *Case:* The manuscript states the letters were burned; historical evidence confirms they were burned.
  *Marguerite's Prediction:* Saying "It is true that the letters were burned" adds nothing to "The letters were burned." The overlap with the manuscript is linguistically interesting but metaphysically empty. The word "true" performs the same logical function in both contexts; only the speaker's commitment changes.
  *Friend's Prediction:* Saying "It is true" affirms a property connection missing in the fiction-only claims. The overlap matters because the property of truth is present in the historical claim and absent in the fictional claim, even if the words match. The feeling of significance comes from detecting this property.

  **Crux 2: The Unreliable Narrator**
  *Case:* The manuscript states X happened; historical evidence shows not-X.
  *Marguerite's Prediction:* "True in manuscript" is complete; no shadow of real truth hangs over it. The error is simply a mismatch of contexts. We don't need a robust property to explain why the fictional claim fails to guide action in the real world.
  *Friend's Prediction:* We feel a lack because the property of truth is absent, creating epistemic tension. The failure of the belief to guide action successfully is explained by the absence of the truth property. The distinction is not just contextual but ontological.

  **Crux 3: Grief and Reality**
  *Case:* Marguerite reading the manuscript while grieving.
  *Marguerite's Prediction:* Her pain comes from belief content, not truth properties. She is reacting to the proposition "Arthur burned the letters," not the property of truth attached to it. Deflationism accounts for the emotion without metaphysical baggage.
  *Friend's Prediction:* Her pain comes from contact with reality via the truth property. The weight of the grief is proportional to the reality contact. If truth were merely deflationary, the emotional distinction between reading history and reading fiction would be unexplained.

  4. "Lines for the scene"

  Marguerite should avoid sounding like she denies reality, but she must deny that "truth" is a *thing* separate from asserting reality.

  1. "To call it true is just to repeat it. If the letters burned, they burned. Adding 'true' doesn't save them from the fire."
  2. "You want truth to be a thing so you can hold it. I'm telling you it's just the hand that holds."
  3. "The manuscript says it, the world says it. Why do you need a third voice to certify the agreement?"
  4. (The line she'd regret) "I need to know what's really real, not just what works." (A real deflationist shouldn't privilege 'really real' over 'true'.)
