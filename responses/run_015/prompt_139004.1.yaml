answer: |-
  ### Part 1: The Translation (Archaeological Inference as Reverse Engineering)

  Here is the archaeological problem of inference restated in your vocabulary.

  **The Artifact as Stripped Binary:**
  The excavated assemblage is a statically linked, stripped binary. The "symbols" (names, kinship terms, specific deity identities) are gone. The "debug info" (oral history, context of manufacture) was never included in the build.

  **Formation Processes as Post-Execution Transforms:**
  Taphonomy and site formation are not just compiler optimizations; they are memory corruption and garbage collection runs that happened *after* the program terminated. The heap is fragmented (erosion), stack frames are overwritten (plowing), and pointers are dangling (displaced artifacts). You are analyzing a core dump of a process that died centuries ago, stored on magnetic tape that has been partially degaussed.

  **Equifinality as Non-Unique Source Mapping:**
  This is your "equivalence classes of source programs." Ten different social structures (source codes) can compile to the same artifact pattern (binary). You cannot decompile the social structure uniquely from the artifact pattern.

  **Ethnoarchaeology as Dynamic Analysis on Known Builds:**
  This is the only place you get dynamic analysis. You watch a living society (a known source/build environment) run similar routines to see what artifacts (output logs/memory states) they produce. It's like running the same compiler on a known codebase to see how it optimizes, then applying that heuristic to the unknown binary.

  **Where the Mapping Does Real Work:**
  It accurately captures the epistemic ceiling. You cannot recover "intent" (author's purpose) from "behavior" (bytes on disk) without external documentation. It captures the frustration of "optimizations" (cultural standardization) that erase individual variation, making distinct authors look identical.

  **Where the Mapping is a Metaphor Wearing a Work Shirt:**
  The assumption of an **Author**. In your work, there is always a programmer. There is a `main()`, a design document, a intent. In archaeology, especially prehistoric, there may be no "source code" in the sense of a distinct plan. The "program" might be a distributed, emergent system where the rules are generated by the execution itself, not prior to it. You assume a designer; she suspects a ecosystem.

  **Confidence:** 90%

  ---

  ### Part 2: Residue Report (The Three Cases)

  #### Case 1: The Constant Doorway Bearing
  *   **RE Conclusion:** You would call this a **Hardcoded Constant** or **Memory Alignment**. It looks like a compiler flag (e.g., `-falign-functions=16`). It's efficient for the build system, even if it doesn't optimize runtime performance (sun/wind).
  *   **Translates Cleanly:** The idea that a constraint is technical, not semantic. Just as a compiler aligns memory to word boundaries regardless of variable meaning, builders might align walls to a surveyor's rope or a ritual path regardless of comfort.
  *   **Translates with Distortion:** In RE, alignment is usually for machine efficiency. In archaeology, the "efficiency" might be social (speed of construction, adherence to norm). The "compiler" is the guild, not the CPU.
  *   **Inexpressible:** The *consequence* of the alignment. In RE, misaligned access causes a segfault. In archaeology, "wrong" orientation might cause social sanction or spiritual failure, which leaves no binary trace.
  *   **Specific Question (Shared Routine):** Yes. This is exactly a **Shared Library** or **Linker Script**. Everyone links against `libconstruction.a`. The bearing is constant not because every programmer wrote `#define DOOR_ANGLE 45`, but because the linker enforces it. No one chose it; the build environment dictated it.

  #### Case 2: The Axe Deposits
  *   **RE Conclusion:** You would see this as **Data Structures** or **Magic Numbers**. The grouping (3, 8, 12) implies a schema. The lack of use implies **Unreachable Code** or **Commented-Out Blocks**.
  *   **Translates Cleanly:** The pattern recognition. You can identify the schema (groups of N) without knowing the variable names.
  *   **Translates with Distortion:** The **Utilitarian vs. Symbolic** split. In RE, data is either processed (code) or stored (data). In archaeology, an object can be "processed" socially (exchange, votive) without being "used" physically (cutting). Your vocabulary forces a binary: does the CPU touch this register? Archaeology asks: does the *society* touch this object?
  *   **Inexpressible:** **Value.** In RE, value is numeric or pointer address. In archaeology, value is social credit, spiritual capital, or obligation. An axe in a bog is a "transaction" with no return packet. You have no opcode for "sacrifice."

  #### Case 3: The Missing Burials
  *   **RE Conclusion:** **Missing Logs** or **Deleted Stack Frames**. You would assume the function (`handle_death`) exists but writes to `/dev/null` (river, sky) or the logs were rotated and purged.
  *   **Translates Cleanly:** The concept of **Negative Evidence**. Just as the absence of a syscall trace doesn't prove a function wasn't called, the absence of bone doesn't prove no death ritual occurred.
  *   **Translates with Distortion:** In RE, if it's not in the binary or memory dump, it didn't happen on *this* machine. In archaeology, the "machine" (valley) is part of a network. The process might have been offloaded to a remote server (next valley).
  *   **Inexpressible:** **Ephemeral Execution.** In RE, execution leaves traces (cache, heat, power draw). In archaeology, a ritual can be purely performative (song, dance, painting on skin) with zero durable artifact output. Your model assumes all execution leaves a state change on disk.

  **Confidence:** 85%

  ---

  ### Part 3: The Specific Conceptual Questions

  **1. Is "Utilitarian versus Symbolic" a Code/Data distinction?**
  No. In your framework, Code executes, Data is payload. In archaeology, a "symbolic" axe (votive) and a "utilitarian" axe (chopping) are both Data. The difference is the **Handler**. A utilitarian axe is passed to the `cut_wood()` function. A symbolic axe is passed to the `ritual_deposit()` function.
  *The Defect:* Your vocabulary assumes the handler is visible in the binary (the call graph). In archaeology, the handler is often invisible (the social context). You see the object (the register value); you cannot see the function pointer that consumed it. It is not a Code/Data split; it is a **Called vs. Uncalled Function** split where the call site is missing.

  **2. Does the constant doorway bearing have an analogue in a value constant only because a shared routine computes it?**
  Yes. This is the strongest link. It is **Build Environment Constraint**. Think of it as a Makefile rule or a CI/CD pipeline check. If the build fails when walls aren't aligned, everyone aligns walls. The "value" (bearing) is constant not because of a global variable, but because the compiler (tradition) rejects other values. It is not a choice; it is a dependency.

  **3. Does "Deposits *are* the institution" have a counterpart in reverse engineering?**
  This is the breaking point. In RE, the Binary is never the Source. The Binary is the *trace* of the Source.
  *Her Claim:* There is no Source. The "Institution" is not a design document; it is the repeated execution of the binary itself. The pattern of deposits *constitutes* the economy.
  *Your Vocabulary:* You cannot express this. You are trained to believe there is a `social_struct.h` somewhere, even if stripped. She is claiming the system is **Self-Modifying Code** where the execution *writes* the rules as it runs. The deposits aren't logs of the institution; they are the memory cells where the institution resides.
  *The Gap:* You look for the author. She looks for the emergent property.

  **Confidence:** 80%

  ---

  ### Part 4: The Verdict

  Is the residue a defect in your vocabulary, evidence of her substantive claim, or ambiguity?

  It is a **Split Verdict**.

  **Case 1 (Doors): Defect in Vocabulary (Minor).**
  Your vocabulary handles this well (Alignment/Linker). The residue is minimal. You can model "unthinking convention" as "compiler optimization." Her claim adds little here that you can't already model as "build constraint."

  **Case 2 (Axes): Evidence of Substantive Claim.**
  Your vocabulary fails to distinguish "money" from "offering" because both look like "unused data." Her claim that the deposit *is* the economic act (not a record of it) is something you cannot represent. In RE, a transaction is a state change. In her view, the *placement* is the transaction. You lack the opcode for "social binding."

  **Case 3 (Burials): Ambiguity in Her Claim.**
  Here, she might be hiding underdetermination. "Invisible practices" can mean "emergent social structure" OR it can mean "we have no data." Your vocabulary correctly flags this as "Missing Trace." Her claim that "the practice was the institution" risks becoming unfalsifiable. If no trace exists, how do you distinguish "institution" from "nothing happened"?

  **Overall:**
  Her claim is substantive, but your vocabulary is **Design-Centric**. You assume a system is built to do something. She is describing a system that *becomes* something through doing.
  *   **Utilitarian/Symbolic:** Not Code/Data. It is **Contextual Binding**.
  *   **Doorway Bearing:** **Linker Constraint**. (You understand this).
  *   **Deposits as Institution:** **State as Logic**. (You do not have this). In your world, state is passive. In her world, the arrangement of objects *is* the active logic of the society.

  **Confidence:** 75%

  ---

  ### Least Sure Claim

  **Claim:** *"In her world, the arrangement of objects is the active logic of the society."*

  **Note on Changing My Mind:** I am least sure about this phrasing because it risks romanticizing the archaeology into mysticism. If "arrangement is logic," it implies a deterministic social engine that may not exist. It might simply be that the "institution" is a label *we* apply to the pattern, not a functional reality *they* executed. If your friend admits that "institution" is an analytical category imposed by the archaeologist (a decompiler heuristic) rather than an ontological reality of the past society, then my translation holds better. If she insists the "institution" existed as a causal force without material substrate, she is positing a ghost in the machine, and my RE vocabulary is correct to reject it.

  **Confidence in this uncertainty:** 60%
