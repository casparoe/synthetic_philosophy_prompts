answer: |-
  The alarm isn't a siren. It's a chime, polite as a microwave, but it cuts through the hum of the aerators like a needle. 2:14 AM. Tank Four.

  I wake the screen. The water quality grid is mostly green, but the movement sensor column is flashing amber. A spike in turbidity. Something is stirring up the silt.

  I stand up and walk the catwalk. The air in here is always heavy, wet with brine and the metallic tang of ozone. Below me, the tanks are vast dark mirrors, broken only by the underwater lights casting a sickly blue glow. They're packed tight, thousands of them. *Litopenaeus vannamei*. Whiteleg shrimp. They look like pale commas drifting in the current, antennae twitching like static.

  I lean over the rail. The water is churning near the drain. Not a feeding frenzy. It's a thrash.

  Back at the desk, the cursor hovers over the dropdown menu. *Log Event* or *Clear False Positive*.

  If I log it, the system flags a welfare anomaly. An auditor comes next week. They check the water logs, they check the mortality rates, they check the certification. If we lose the certification, the buyers drop us. The plant slows down. Marisol loses her overtime. Ben loses his ride to work. The whole shift gets cut back to skeleton crew. I eat lunch with them. I know what their rent costs.

  If I clear it, the night goes on. The water settles. The spreadsheet stays green.

  I look back at the tank. One of them is near the surface, floating sideways. Its body is segmented, armored plates sliding over each other. They don't have a head like we do. Just a fuse of nerves up front, then a ladder running down the belly. Ganglia. Little knots of thinking scattered through the meat.

  I remember the broodstock shed. I got sent there my first week. The females need to spawn, so they clip the eyestalks. Hormone suppression. I held the bucket. The shrimp didn't scream. They don't have mouths for screaming. But when the scissors snapped, the bodies didn't drop. They scrambled. The legs kept walking even after the front half went still. The tail flipped independently, snapping against the table.

  Which part felt it? The whole thing, or just the knot near the cut? If it's just the knot, then the tail is innocent. If it's the whole thing, then the tail is grieving the head. Or maybe there is no whole. Maybe a shrimp is just a bag of separate little animals holding hands, pretending to be one creature so the water doesn't tear them apart.

  Down in Tank Four, the churning stops. The cloud of silt hangs suspended, slowly sinking.

  If the experience is split into slivers, maybe each sliver is too thin to hold pain. Like a single pixel doesn't know it's part of a picture of a fire. If the pain is diluted across ten ganglia, maybe none of them reach the threshold to suffer. Maybe it's just biology ticking over, electricity finding ground. No one home to hurt.

  But if the splitting doesn't thin it out, if it multiplies… then that thrashing wasn't one animal dying. It was ten. A crowd in a single shell. The spike on the monitor isn't a glitch; it's a chorus. The audit isn't about welfare; it's about body count.

  My finger rests on the mouse. The plastic is cold.

  Marisol showed me a picture of her daughter yesterday. Pink backpack. Missing front tooth. She said the bonus this quarter would cover the braces. The bonus depends on the certification. The certification depends on me not logging the amber light.

  I look at the floating shrimp again. It sinks slowly, legs curling inward. A single antenna drifts on the surface tension, detached. It vibrates with the pump's rhythm, independent of the body now. Is it still listening? Is there a tiny piece of the shrimp still out there, sensing the water chemistry, waiting for a signal that will never come?

  The facility is quiet. The pumps breathe in and out. *Hiss. Click. Hiss.*

  If I clear it, I am saying the slivers are too thin to matter. I am saying the crowd is an illusion. I am protecting the jobs of people who breathe with one lung and think with one brain.

  If I log it, I am saying the crowd is real. I am saying the tank is full of more souls than the inventory list admits. I am saying the cost is too high, even if the price is paid by people I know.

  The software times out. The screen dims. I tap the spacebar to wake it. The cursor is still hovering.

  I think about the ladder in the belly. Nerve to nerve. A chain of command where every link can decide to fire. If one link burns, does the whole chain feel the heat? Or does the chain just break, and the rest keep walking?

  I think about my own hand. If I burn my finger, I feel it. But the finger doesn't feel itself. I am the center. Where is the center for the shrimp? Is it everywhere? Is it nowhere?

  The turbidity reading drops back to baseline. The water is clear again. Whatever happened is over. The body is settling on the bottom, joining the others in the sludge trap.

  My wrist aches. The shift ends at six. I have four hours left. There are twelve hundred tanks.

  I move the mouse. The highlight shifts from *Clear* to *Log*. The background turns red. Then I move it back. Green.

  The shrimp on the bottom twitches. Just one leg. The body is still. The leg paddles the water, slow and rhythmic, walking on nothing, walking on the dark.

  I click.

  The screen flashes confirmation. I take my hand off the mouse and pick up my coffee cup. It's cold. I drink it anyway. The liquid tastes like iron. I set the cup down on the desk, next to the keyboard, and wipe a drop of spilled coffee from the edge of the monitor with my thumb.
