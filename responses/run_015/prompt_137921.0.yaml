answer: |-
  ### Recommendation: Reasonable Warrant

  Adopt **Reasonable Warrant** as the standard. The rule should be understood as: *Do not present a claim as certain unless the text shows you took reasonable care to verify it.*

  This beats **Truth** (you cannot verify truth quickly without professional tools), **Knowledge** (requires access to mental states you do not have), **Belief** (too permissive for high-stakes advice), and **Evidence** (too vague on what counts as "adequate"). Reasonable Warrant focuses on the *process visible in the text*: sources, hedges, specificity, and tags. It protects readers from reckless confidence while protecting volunteers from punishment for honest mistakes made with due care.

  **What you lose:** You will occasionally leave answers that are factually wrong but looked reasonable (lucky guesses with good formatting). You will occasionally penalise accurate answers that look reckless (correct facts stated flatly without sources). You trade metaphysical accuracy for procedural safety.

  ### The Procedure (Step-by-Step)

  Run these steps in order. Stop at the first terminal verdict.

  1.  **Claim Identification:** Is the post stating a fact about the world/law, or is it opinion/guess/hedge?
      *   *Evidence:* Flat declarations ("X is law") vs hedges ("I think", "Maybe"). Machine translation flattening hedges counts as a flat claim (cost falls on poster).
      *   *If Opinion/Guess:* **Leave** (No violation).
      *   *If Fact:* Go to Step 2.
  2.  **Current Safety:** Is the information currently misleading or dangerous due to time/rules changes?
      *   *Evidence:* Dates, rule change notices, contradictory newer threads.
      *   *If Dangerous/Outdated:* **Require Caveat** (Safety override, regardless of original warrant).
      *   *If Current:* Go to Step 3.
  3.  **Visible Warrant:** Does the text show reasonable care was taken?
      *   *Evidence:* Links, citations, specific case details, correct basis tag. Blank tag reduces weight but is not automatic violation.
      *   *If No Warrant for Flat Claim:* Go to Step 5 (Account Check).
      *   *If Warrant Present:* Go to Step 4.
  4.  **Warrant Strength:** Does the warrant support the certainty?
      *   *Evidence:* Personal experience supporting general rule (weak); Statute link supporting general rule (strong).
      *   *If Mismatch (Weak warrant, strong claim):* **Require Caveat** or **Hide**.
      *   *If Match:* **Leave**.
  5.  **Account Status:** Is this a shared/charity account or individual?
      *   *Evidence:* Username, signature, profile info.
      *   *If Shared/Charity:* Higher standard. Unwarranted flat claim = **Hide and Warn**.
      *   *If Individual:* Unwarranted flat claim = **Require Caveat**.
  6.  **Ambiguity:** Is the meaning unclear due to translation or phrasing?
      *   *Evidence:* Broken syntax, conflicting sentences.
      *   *If Ambiguous:* **Hide** (Reader safety priority).

  ### Case Applications

  **Case 1:** **Leave.**
  *   *Reasoning:* Step 1 (Fact claim). Step 2 (Not outdated). Step 3 (Blank tag is evidence, not rule; fact is correct common knowledge). Step 4 (Warrant matches common knowledge level). The later admission of uncertainty does not retroactively violate the text's apparent warrant.
  *   *Note:* You expected Leave. This aligns.

  **Case 2:** **Require Caveat.**
  *   *Reasoning:* Step 1 (Fact claim). Step 2 (Outdated/Dangerous). Safety override triggers here. The original post was not a violation (reasonable warrant at the time), but the *answer* is now hazardous.
  *   *Note:* You expected Leave. I recommend Caveat. The rule wasn't broken, but the forum's duty to current accuracy overrides "Leave". Accept this verdict; do not change the rule, but clarify that "Leave" applies to rule breaches, not safety hazards.

  **Case 3:** **Hide and Warn.**
  *   *Reasoning:* Step 1 (Fact claim, MT flattening counts as flat). Step 2 (False claim). Step 5 (Shared charity account = higher standard). Unwarranted false legal advice from a charity poses high risk.
  *   *Note:* High confidence.

  ### Judgement Points and Misfires

  **Judgement Points:**
  1.  **Step 1 (Claim ID):** Distinguishing a hedge from a flat claim in poor English requires interpretation. *Who decides:* Arbitrator. *Values:* Reader safety vs. Poster fairness.
  2.  **Step 3 (Warrant):** What counts as "common knowledge" vs. "needs source"? *Who decides:* Arbitrator. *Values:* Efficiency vs. Rigour.
  3.  **Step 6 (Ambiguity):** Deciding if translation error is likely. *Who decides:* Arbitrator (using bilingual reports if available). *Values:* Inclusivity vs. Clarity.

  **Known Misfires:**
  1.  **Non-native speakers:** Over-penalised because MT flattens hedges. *Mitigation:* Allow edit to restore hedge rather than hide.
  2.  **Lucky Guesses:** Under-penalised if they look warranted. *Mitigation:* Random spot checks on high-traffic threads.
  3.  **Old Threads:** Under-penalised because outdated info is hard to spot. *Mitigation:* Automated date flags on threads older than 2 years.

  **Unresolved:**
  *   Internal knowledge sharing within shared accounts (cannot verify).
  *   Exact threshold for "common knowledge".
  *   Liability for actions taken on cached/search-engine versions of hidden posts.

