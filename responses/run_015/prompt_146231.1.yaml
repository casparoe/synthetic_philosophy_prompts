      *   *Assumption 2: AI updates its objectives.* Most current AI does *not* update its fundamental objectives (the loss function/reward). It updates its *policy* (strategy) to meet fixed objectives. True objective updating (recursive self-improvement of values) is rare and dangerous (alignment problem).
      *   *Assumption 3: Sphexishness is purely about behavioural rigidity.* Hofstadter argued it's about the lack of an internal model or "self" that observes the behaviour. It's about the locus of control.
      *   *Assumption 4: Escaping sphexishness is sufficient for free will.* One could be non-sphexish (highly adaptable) but still determined by prior causes (determinism).

