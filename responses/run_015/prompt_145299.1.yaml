prompt: |-
  I retired from a lab job a few years back and now I read philosophy for fun, mostly wether biotech should just erase suffering altogether. I'm trying to map the actual logical space, not just list famous names. Could you build me a taxonomy tree for the debate on abolishing suffering through biotechnology?

  Root question: is suffering the only intrinsic moral bad, or do things like autonomy, struggle, or biodiversity have independant weight? Then branch on wether suffering is technicaly abolishable without also wiping out consciousness or meaning—split here between nociceptive abolition (turning off pain signals) and affective abolition (engineering away the badness of experience itself). Then branch on scope: consenting humans only, domesticated animals, or wild ecosystems too?

  Leaves should include the hedonistic imperative, negative utilitarianism, the gradualist who wants reduction but not elimination, and at least two unnamed combos—like full affective abolition for humans but leaving wild nature untouched. For each leaf, one sentence on its most awkward commitment. Flag pairs the tree can't separate, and note incoherent branches—say, demanding total suffering abolition while also saying struggle is essential for human dignity. No citations needed; just lay out the yes/no branches so someone can answer without knowing the jargon.
