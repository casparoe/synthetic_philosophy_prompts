prompt: |-
  tbh I'm a longtime rationalist blog lurker and I keep seeing people drop "bias is just preference with worse marketing" in threads about evolutionary debunking, usually to shut down the idea that we can separate real moral knowledge from evolutionary leftover preferences. Last time was in a discussion about whether EA people are just laundering thier weird preferences through utilitarian framing. I want to take the slogan seriously and understand what it could actually mean, because right now it works like a magic spell that ends the argument.

  Could you lay out the distinct precise theses it might express? I'm thinking of things like:
  - the trivial evolutionary point that every preference has some causal history involving selection
  - a psychological claim that moral judgments are basically affective responses mislclassified as beliefs
  - a normative claim that once you strip framing away there's no epistemic gap between "I prefer X" and "X is wrong"
  - maybe something involving adaptive preference formation — where people adjust thier wants to match what's available — so that "bias" and "preference" become observationally identical?

  For each reading, tell me if it's just a platitude, if it's actually defensible, and crucially whether it does the work people want it to do — like dismissing debunking arguments or treating moral disagreement as pure taste. Also which of these are people actually reaching for in rationalist spaces? I want a menu I can bring back to the thread, not one "correct" interpretation. And dont bother with citations or reading lists; I want to work through the logic myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Longtime rationalist blog lurker. Encounters the slogan "bias is just preference with worse marketing" in threads about evolutionary debunking, moral realism vs. anti-realism, and Effective Altruism (EA) criticism (specifically regarding utilitarianism as preference laundering).
      *   **Problem:** The slogan acts as a "magic spell" that shuts down argument. The user wants to unpack it seriously.
      *   **Task:** Lay out distinct, precise theses that this slogan might express.
      *   **Specific Requirements:**
          *   Evaluate each thesis: Is it a platitude? Is it defensible? Does it do the work people want it to do (dismiss debunking, treat disagreement as taste)?
          *   Identify which interpretations are actually common in rationalist spaces.
          *   Format: A "menu" of interpretations, not one "correct" answer.
          *   Constraint: No citations or reading lists (user wants to work through the logic).
      *   **User's Suggestions:** The user already proposed four potential angles (evolutionary causal history, psychological affective response, normative epistemic gap, adaptive preference formation). I should incorporate/refine these but also look for others.

  2.  **Deconstruct the Slogan:** "Bias is just preference with worse marketing."
      *   *Bias:* Usually implies a systematic deviation from rationality or truth, often unconscious, often pejorative.
      *   *Preference:* Usually implies a subjective valuation, neutral or positive (autonomy), often conscious.
      *   *Worse Marketing:* Implies the *presentation* or *framing* is the differentiator, not the underlying substance. "Marketing" suggests persuasion, signaling, or self-deception.

  3.  **Brainstorming Theses (The "Menu"):**

      *   *Thesis 1: The Expressivist/Psychological Reduction.* (Matches user's "psychological claim"). Moral claims *are* preference claims disguised as facts.
      *   *Thesis 2: The Epistemic Symmetry.* (Matches user's "normative claim"). There is no evidentiary difference between a biased belief and a preferred belief when traced to origins.
      *   *Thesis 3: The Signaling/Status Account.* (Rationalist favorite). "Bias" is what we call preferences that lower status or fail coordination; "Preference" is what we call high-status biases.
      *   *Thesis 4: The Evolutionary Continuum.* (Matches user's "trivial evolutionary point"). Everything is adaptive. Calling one part "bias" and another "preference" is arbitrary line-drawing.
      *   *Thesis 5: The Internal Coherence/Instrumental View.* Bias is a preference that conflicts with your other stated preferences (instrumental irrationality).

  4.  **Developing Each Thesis (Drafting Content):**

      *   *Thesis 1 (Moral Anti-Realism/Expressivism):*
          *   *Meaning:* "X is wrong" = "I dislike X." Calling it "bias" is just noticing the disguise.
          *   *Platitude?* No, it's a strong metaethical claim.
          *   *Defensible?* Standard non-cognitivist position.
          *   *Does the work?* Yes, shuts down debunking by saying there's no "truth" to debunk.
          *   *Rationalist fit?* High. Very common in LW/EA circles (error theory, quasirealism).

      *   *Thesis 2 (The Signaling/Status Game):*
          *   *Meaning:* "Bias" is a pejorative label applied to preferences that aren't socially optimized. "Marketing" = status signaling.
          *   *Platitude?* Cynical, but not trivial.
          *   *Defensible?* Sociologically plausible.
          *   *Does the work?* Yes, turns epistemic arguments into political ones.
          *   *Rationalist fit?* Very High. Hansonian influence (Elephant in the Brain).

      *   *Thesis 3 (Instrumental Incoherence):*
          *   *Meaning:* A preference is fine. A bias is a preference that contradicts your higher-order preferences (akrasia). Bad marketing = failing to sell it to your future self.
          *   *Platitude?* No.
          *   *Defensible?* Aligns with rationality as goal-achievement.
          *   *Does the work?* No, doesn't dismiss debunking, just reframes it as internal consistency.
          *   *Rationalist fit?* High. Core to the "rationality" project.

      *   *Thesis 4 (The Causal Indistinguishability):*
          *   *Meaning:* You can't trace a belief to "truth" vs "fitness." All beliefs are caused by fitness-enhancing mechanisms.
          *   *Platitude?* Borderline. Evolutionary psychology 101.
          *   *Defensible?* Strong challenge to realism.
          *   *Does the work?* Yes, this is the core of the evolutionary debunking argument *against* the debunkers (or rather, leveling the playing field).
          *   *Rationalist fit?* Medium-High. Often discussed in context of "optimality vs. truth."

  5.  **Refining and Polishing:**
      *   Need to ensure I address the "EA laundering" context specifically. That points heavily toward Thesis 1 and 2.
      *   Need to make sure I answer "Does it do the work?" clearly for each.
      *   Tone: Analytical, neutral, "rationalist-adjacent" (precise, distinct categories).
      *   Check constraints: No citations.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I distinguish enough between "bias" as cognitive error and "bias" as moral accusation?
      *   *Fix:* Make sure Thesis 2 highlights the *social* function of the word "bias."
      *   *Critique:* Is Thesis 4 too close to the user's suggestion?
      *   *Fix:* Frame it specifically around the *indistinguishability of causal chains* rather than just "everything is evolved." Focus on the inability to isolate the "truth-tracking" variable.
      *   *Addition:* I should add a thesis about *predictive processing* or *controlled hallucination*, but that might be too technical/neuroscience-y. Let's stick to the philosophical/practical angles which fit the "marketing" metaphor better.
      *   *Wait, one more:* The "Marketing" part implies *persuasion*. So there's a thesis about *Social Coordination*. "Bias" is a preference you don't expect others to share; "Preference" is one you signal to coordinate.
      *   *Decision:* Let's stick to the strongest 4-5. The Signaling one covers the social coordination aspect.

  7.  **Final Structure:**
      *   Intro: Acknowledge the slogan's utility as a conversation stopper.
      *   Thesis 1: The Metaethical Reduction (Expressivism).
      *   Thesis 2: The Signaling/Status Account (Hansonian).
      *   Thesis 3: The Instrumental Incoherence View (Internal Conflict).
      *   Thesis 4: The Causal Indistinguishability Claim (Evolutionary Leveling).
      *   Conclusion/Summary Table: Which one is actually being used?

  8.  **Drafting the Content (incorporating the "Does it do the work?" check):**
      *   *Thesis 1:* If moral claims are just preferences, EA isn't laundering, it's just being honest. Debunking is moot.
      *   *Thesis 2:* If "bias" is just low-status preference, then the argument is about power, not truth.
      *   *Thesis 3:* If bias is self-sabotage, then the argument is about coherence, not origin.
      *   *Thesis 4:* If we can't distinguish truth-tracking from fitness-tracking, then debunking applies to *everything*, not just morality.

  9.  **Final Polish:** Check tone. Ensure it sounds like it belongs in a rationalist context (focus on epistemics, incentives, evolutionary psych). Ensure no citations are dropped. (Self-correction: Avoid naming specific books like *The Elephant in the Brain* even if the concept is from there, just describe the logic).

  10. **Ready to generate.**
answer: |-
  This slogan is indeed a potent conversational closer because it equivocalizes between descriptive, normative, and metaethical claims. It sounds like a deflationary psychological insight but often does the work of a metaethical assertion.

  Here is a menu of four distinct theses that slogan could be encoding. I have evaluated them based on whether they are platitudes, whether they are defensible, and whether they successfully perform the "argument-ending" work you observe in the threads (specifically regarding evolutionary debunking and EA preference-laundering).

  ### 1. The Metaethical Reduction (Expressivism)
  **The Thesis:** Moral judgments do not refer to objective facts; they are syntactic disguises for subjective preferences. To say "X is wrong" is functionally identical to saying "I prefer not-X," but the former framing ("marketing") attempts to claim universal authority that the latter does not.
  *   **Is it a platitude?** No. This is a robust non-cognitivist or quasi-realist metaethical stance. It denies moral realism.
  *   **Is it defensible?** It is a standard, defensible philosophical position, though controversial. It relies on the argument that moral properties are ontologically queer or that moral motivation is internally linked to action in a way factual beliefs are not.
  *   **Does it do the work?** **Yes.** This is the strongest candidate for shutting down evolutionary debunking arguments. If moral claims are just preferences, there is no "moral knowledge" to debunk. Evolution shaped our preferences; therefore, our moral claims reflect evolutionary history. There is no gap to bridge between "evolved preference" and "moral truth" because there is no moral truth independent of the preference.
  *   **In the EA context:** It implies EAs are not "laundering" preferences; they are simply being more explicit about the preference structure underlying their utility functions. The accusation of laundering only sticks if you assume utilitarianism claims access to objective moral facts.
  *   **Rationalist Prevalence:** **High.** This aligns closely with the error-theory and moral anti-realism common in these circles.

  ### 2. The Signaling and Status Account (Hansonian)
  **The Thesis:** The distinction between "bias" and "preference" is not epistemic but social. "Preference" is a label we apply to valuations that are high-status, socially coordinated, or honestly signaled. "Bias" is a pejorative label applied to valuations that are low-status, socially costly, or hypocritically signaled. The "marketing" is the status signaling.
  *   **Is it a platitude?** No. It is a sociological claim about the function of language and norm enforcement.
  *   **Is it defensible?** Highly defensible within an evolutionary psychology framework. It treats moral language as a tool for coalition building rather than truth-tracking.
  *   **Does it do the work?** **Yes, but cynically.** It dismisses the debunking argument by reframing it as a status game. If someone argues your morality is just evolutionary bias, this thesis replies: "Your claim that I am biased is just your preference for higher status, marketed as epistemic superiority." It levels the playing field by making *all* normative claims moves in a status game.
  *   **In the EA context:** It suggests the criticism that EAs are "laundering preferences" is itself a move to lower EA status. It implies the debate isn't about the validity of the preferences, but about who gets to define the terms of the discourse.
  *   **Rationalist Prevalence:** **Very High.** This is core to the "politics is mindkiller" and signaling analysis often found in these communities.

  ### 3. The Instrumental Incoherence View
  **The Thesis:** A "preference" is a valuation that is coherent with your higher-order goals and stated beliefs. A "bias" is a valuation that contradicts your higher-order goals or other stated beliefs (instrumental irrationality). The "worse marketing" is the failure to integrate the valuation into your explicit worldview, leading to internal conflict or self-deception.
  *   **Is it a platitude?** No. It defines bias as a specific type of computational error or system conflict, not just any causal origin.
  *   **Is it defensible?** Yes, this fits well with a computational view of the mind (System 1 vs. System 2). It distinguishes between *having* a preference and *acting* on a preference that undermines your other goals.
  *   **Does it do the work?** **No.** This interpretation actually *opens* the argument rather than closing it. It invites investigation: "Is this specific utilitarian preference coherent with your other goals, or is it a bias?" It does not dismiss the possibility of separating real knowledge from leftover preferences; it provides the metric (coherence) by which to do so.
  *   **In the EA context:** It would require EAs to demonstrate that their utilitarian framing is instrumentally coherent with their deeper drives, rather than accepting the slogan as a shield.
  *   **Rationalist Prevalence:** **Medium.** This is the "hard rationality" take, often used when people are trying to actually solve problems rather than win meta-arguments.

  ### 4. The Causal Indistinguishability Claim
  **The Thesis:** There is no observable difference in the causal genesis of a "truth-tracking belief" and a "fitness-tracking preference." Both are produced by neural machinery selected for survival. Therefore, labeling one "knowledge" and the other "bias" is an arbitrary distinction without an empirical referent.
  *   **Is it a platitude?** Borderline. It is a strong version of the evolutionary point you mentioned. It moves from "everything has a causal history" to "causal histories are indistinguishable regarding truth-value."
  *   **Is it defensible?** Controversial. It assumes a global skepticism about our ability to distinguish truth-tracking mechanisms from fitness-tracking mechanisms. A realist would argue that logical consistency and empirical prediction provide a filter that separates truth from mere fitness.
  *   **Does it do the work?** **Yes.** This is the direct counter to evolutionary debunking arguments that try to save *some* knowledge while discarding moral knowledge. It argues that if evolution debunks morality, it debunks math and science too (since the brain evolved for the savannah, not calculus). It forces a choice: accept global skepticism or accept that evolutionary origin doesn't preclude truth.
  *   **In the EA context:** It protects EA by suggesting that if their utilitarianism is "just evolved preference," then the critic's logic is *also* just evolved preference, and there is no neutral ground from which to judge.
  *   **Rationalist Prevalence:** **Medium-High.** Often appears in discussions about "optimality vs. truth" and the limits of human rationality.

  ### Summary for your Thread

  If you want to bring this back to the discussion, here is how you can categorize the usage:

  1.  **If they are denying moral facts:** They are using **Thesis 1**. They believe the debate is ontological. (Counter: Ask if they apply this to mathematical or logical intuitions).
  2.  **If they are attacking social dynamics:** They are using **Thesis 2**. They believe the debate is about status and signaling. (Counter: Ask if they think any normative claim can ever be more than a status move).
  3.  **If they are attacking the debunking method itself:** They are using **Thesis 4**. They believe the "evolutionary origin" argument is self-defeating if applied selectively. (Counter: Ask if they believe there are *any* cognitive mechanisms that track truth better than fitness).

  **Most likely diagnosis:** In the context of EA and "preference laundering," users are usually combining **Thesis 1** and **Thesis 2**. They are asserting that moral claims are preferences (1) and that calling them "biases" is just a derogatory way of managing social disagreement about those preferences (2).

  The slogan works as a magic spell because it smuggles **Thesis 1** (a controversial metaethical claim) inside a sentence that sounds like **Thesis 3** (a banal observation about framing). By accepting the slogan, you inadvertently accept the anti-realist premise without arguing for it.
