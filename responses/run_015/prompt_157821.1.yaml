prompt: |-
  I've been reading the LessWrong-adjacent population-ethics and longtermism discourse for something like a decade, and I keep hitting the same wall. Every argument about climate policy, embryo selection, germline editing, or existential-risk mitigation eventually bottoms out in the non-identity problem as Parfit set it up in *Reasons and Persons*, and then it either collapses into the shrug that a person who would not otherwise have existed is not harmed, or into someone proposing that we taboo the word harm and start over. I would like to stop relitigating applications and instead write down the specification first.

  Here is what I want: the requirements an account of the moral significance of identity-affecting choices has to meet, where the account is meant to do one particular job. The job is to serve as the module a decision procedure calls when it compares long-horizon policies whose outcomes differ not only in how well people fare but in which people, and how many, there will be. Not a theory of everything. A subroutine that returns (a) a ranking of the options available to the agent and (b) some verdict about what is owed, or what has gone wrong, when the chosen option is identity-affecting. Adequacy should be judged relative to that use, and I want you to say explicitly when a requirement follows from that purpose and when it is just something a particular camp has grown attached to.

  These are the requirements I keep circling back to; treat them as raw material rather than as a list to endorse. Clean them up, delete the ones that are really cached conclusions wearing the costume of a desideratum, add the ones I have missed, and attach to each the case or consideration that motivates it:

  - It must be able to say something about the depletion-style case — the policy that gives the present generation a small benefit and leaves later generations much worse off, where those later generations exist only because of that very policy. Condemning it is not compulsory; explaining the intuition away in a way I can steelman is acceptable. Silence is not.
  - It must handle the contrast I cannot stop thinking about: selecting among candidates who already exist versus creating someone. Choosing which of several already-created embryos to implant, or editing the genome of an existing embryo, looks relevantly different from choosing to conceive now rather than later, or choosing which gametes to combine. Say whether that difference is moral or merely causal, and whether the timing of the intervention — before there is any candidate at all, versus once there are several — is supposed to matter.
  - It must not produce cliff edges. Verdicts should not flip because a causal chain reaches a few hours further back into the circumstances of a conception, given how easily identity scrambles. Pair the obvious depletion case with a near-twin of it that leaves identity intact and ask whether the two verdicts can differ discontinuously.
  - It must be usable by an agent who does not know and cannot know who will exist. No requirement to identify the counterfactual victim by name as a precondition for acting.
  - It must respect some distinction among being worse for someone, being wronged, being impermissible, and being blameworthy, and it must state what residue is left — guilt, regret, duties of compensation or apology, a reason to change institutions — when an act is wrongful although it wrongs no one. Collapsing all four into one is a substantive move and should be flagged as such.
  - It must take a position on the worth-living threshold and on whether creating a good life and creating a bad life are reasons of the same shape. Include the boundary case where a life is barely worth living, and the case where the alternative to creating someone is creating no one at all, so that the comparison class is empty.
  - It must rank outcomes across variable populations and do so at scale, since any two long-run policies differ in the size and composition of the future population. State its stance on the repugnant-conclusion family of problems, and tell me whether avoiding them is a genuine requirement or a preference of one camp.
  - It must not make the verdict depend on who is choosing — parent, IVF clinic, regulator, voter — unless it can say why the role of the agent carries moral weight here.
  - It must not quietly inherit a contested metaphysics. If the verdict depends on how fragile personal identity is, or on whether a given person could have originated from different gametes, that dependence should be visible and the verdict should be stated conditionally on it.
  - It must not double-count: benefit-of-existence, aggregate welfare, and any identity-independent value of a population have to be kept apart, and I want the argument for whichever of them is doing the work.
  - It must handle mixed cases, where a policy both worsens the prospects of people who will exist either way and determines who exists later, including cases where the two groups partially overlap.

  Three things I care about most. First, mark each requirement as non-negotiable or as a preference of a particular tradition, and say which entries on my draft list are really conclusions smuggled in as criteria. Second, and this is the part I most want: identify which subsets of the requirements cannot be jointly satisfied, and say plainly whether the impossibility results in population ethics bear on the subsets you find — if the honest answer is that no module can do this job, I would rather have that than a list that looks satisfiable. Third, tell me which single requirement excludes the most candidates, and why.

  Only after that: a short scorecard, a few lines each, for Parfit's no-difference style impersonal view, total and average utilitarianism, critical-level or threshold views, and person-affecting restricted views. I care much less about the scoring than about the criteria, so keep it brief and do not pad it. Assume the standard apparatus — the conservation and depletion case, the repugnant conclusion, the person-affecting intuition — as known; do not spend paragraphs restating it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Deeply familiar with LessWrong, population ethics, longtermism, and Parfit's *Reasons and Persons*. They've been engaging with this for a decade. They are frustrated by the "Non-Identity Problem" (NIP) stalling practical discourse (climate, germline editing, x-risk).
      *   **Goal:** They don't want more applications or re-litigation of specific cases. They want a *specification* for a moral module/subroutine that a decision procedure can call when comparing long-horizon, identity-affecting policies.
      *   **Task:**
          1.  Refine their draft list of requirements (clean up, delete cached conclusions, add missing ones, attach motivations).
          2.  Tag each requirement as "Non-negotiable" (functional necessity for the specified job) or "Preference/Tradition" (substantive moral commitment).
          3.  Identify incompatibilities/impossibility results (can these requirements be jointly satisfied?).
          4.  Identify the single most exclusionary requirement.
          5.  Provide a brief scorecard for specific theories (Impersonal, Total/Average Util, Critical-Level, Person-Affecting).
      *   **Tone:** Rigorous, precise, philosophical but functionalist (treating ethics as a module specification), honest about impossibility results. No padding.

  2.  **Deconstruct the Draft Requirements:**
      *   *Depletion Case:* Needs to handle intergenerational harm where victims differ. (Functional necessity for longtermism).
      *   *Selection vs. Creation:* Embryo selection vs. conception timing. (Nuance on identity formation).
      *   *No Cliff Edges:* Continuity in causal chains. (Robustness/Non-arbitrariness).
      *   *Epistemic Limitation:* Agent doesn't know specific identities. (Usability).
      *   *Deontic Distinctions:* Wrongness vs. Harm vs. Blame. (Action-guidance/Residue).
      *   *Worth-Living Threshold:* Asymmetric value of creating good/bad lives. (Axiological commitment).
      *   *Variable Population/Repugnant Conclusion:* Scaling. (Longtermist necessity).
      *   *Agent Neutrality:* Verdict shouldn't depend on role without reason. (Consistency).
      *   *Metaphysical Agnosticism:* Don't rely on fragile identity metaphysics. (Robustness).
      *   *No Double Counting:* Distinct value sources. (Clarity/Coherence).
      *   *Mixed Cases:* Overlap of fixed and variable populations. (Realism).

  3.  **Refine and Categorize Requirements (Step 1 & 2 of Task):**
      *   *Critique:* Some of these are indeed "cached conclusions." For example, "Condemning [depletion] is not compulsory" is a concession, but "Silence is not" is a functional requirement. "Avoiding Repugnant Conclusion" is explicitly asked by the user to be flagged as preference vs. requirement.
      *   *Additions:* Need something about *tractability* (computational complexity) and *guidance* (actionability under uncertainty).
      *   *Categorization:*
          *   *Functional/Non-negotiable:* Must work for long-horizon policy, must handle uncertainty, must handle mixed populations, must be metaphysically robust enough for policy.
          *   *Substantive/Preference:* Avoiding Repugnant Conclusion, specific threshold views, specific deontic residues (guilt vs. regret).

  4.  **Analyze Impossibility Results (Step 3 of Task):**
      *   This is the crux. The user asks: "if the honest answer is that no module can do this job, I would rather have that."
      *   *Key Theorems:* Arrhenius's Impossibility Theorems are the big guns here. They show that no theory can satisfy a set of seemingly plausible adequacy conditions (Adequacy, Dominance, Non-Elitism, Weak Non-Sadism, etc.) simultaneously.
      *   *The Conflict:* The user wants a module that handles variable populations (Req 7), avoids cliff edges/continuity (Req 3), respects person-affecting intuitions implicitly (Req 1 & 2), and avoids the Repugnant Conclusion (Req 7 part 2).
      *   *Verdict:* It is mathematically impossible to satisfy all standard adequacy conditions for variable population ethics simultaneously. Specifically, combining "Person-Affecting Restriction" (harm requires a victim) with "Total Value Aggregation" (for longtermism) and "Non-Repugnance" is the classic trilemma.
      *   *Specific Conflict:* Req 4 (Epistemic/Identity Independence) + Req 1 (Depletion Intuition) + Req 7 (Variable Population/Non-Repugnance). You usually have to sacrifice the Person-Affecting View to get Variable Population scaling without Repugnance, but sacrificing PAV makes Req 1 & 2 hard to explain intuitively.

  5.  **Identify the Most Exclusionary Requirement (Step 4 of Task):**
      *   Likely the combination of "Variable Population Scaling" + "Avoid Repugnant Conclusion" + "Person-Affecting Intuition."
      *   But if forced to pick *one* from the refined list: The demand to *rank outcomes across variable populations at scale without accepting the Repugnant Conclusion* (Req 7) is the killer. It triggers Arrhenius's theorems immediately.
      *   Alternatively, the demand for *No Cliff Edges* (Req 3) combined with *Identity Sensitivity* is very hard.
      *   *Decision:* The "Variable Population + Non-Repugnance" constraint is the standard impossibility trigger. However, the user's specific framing of "No Cliff Edges" regarding identity (Req 3) is also a massive constraint that kills most Person-Affecting views. Let's look closer. Req 3 demands continuity across identity boundaries. Most PAVs are discontinuous (Exist vs. Non-Exist). Total Utilitarianism is continuous but fails Repugnance. Critical Level is continuous but has other issues.
      *   *Refined Decision:* The requirement to **avoid the Repugnant Conclusion while ranking variable populations** is the most exclusionary because Arrhenius proves you can't have that plus other basic adequacy conditions (like Dominance or Non-Elitism). But for *this* user, who wants to solve NIP, the requirement to **provide a verdict on identity-affecting choices without relying on a specific metaphysics of identity** (Req 9) while maintaining **Person-Affecting intuitions** (Req 1 & 2) is the practical blocker.
      *   *Actually, the strongest candidate:* **Req 7 (Variable Population + Non-Repugnance)**. This is the mathematical hard stop.

  6.  **Drafting the Scorecard (Step 5 of Task):**
      *   *Impersonal (Total Util):* Passes variable population, fails Repugnance, fails Person-Affecting intuition (NIP).
      *   *Average Util:* Fails Mere Addition, has weird implications for small populations.
      *   *Critical-Level:* Tries to split the difference, often fails continuity or dominance.
      *   *Person-Affecting (Narrow):* Fails Depletion/NIP directly (silence).
      *   *Person-Affecting (Wide/Asymmetric):* Better on NIP, struggles with Non-Identity continuity.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Needs to be "specification" style.
      *   *Check Constraints:* Did I mark Non-negotiable vs. Preference? Did I address the impossibility theorems explicitly?
      *   *Self-Correction on Impossibility:* I need to be careful not to just say "Arrhenius says no." I need to map *their* requirements to the impossibility conditions.
      *   *Key Insight:* The user wants a *decision procedure module*. This implies computability and action-guidance. Most population ethics theories are axiological (ranking outcomes), not deontic (rules for agents). Bridging that gap is a hidden requirement.
      *   *Refining the "Cached Conclusions":* The user's list includes "Condemning [depletion] is not compulsory." This is a substantive moral claim, not a functional requirement. The functional requirement is "Must yield a verdict."
      *   *Refining "Cliff Edges":* This is a demand for *continuity*. In population ethics, existence is binary. Continuity is extremely hard to satisfy without smoothing existence (which is metaphysically dubious).

  8.  **Final Polish:** Organize into the requested sections: Refined Requirements, Impossibility Analysis, Most Exclusionary Requirement, Scorecard. Ensure the distinction between "Functional Necessity" (for the module to work) and "Moral Preference" (substantive axiology) is sharp.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "It's impossible." I need to say *which* of their requirements clash. The clash is primarily between the Person-Affecting Intuition (implicit in Req 1 & 2) and the Variable Population Scaling (Req 7). You can't have a module that says "harm requires a victim" AND "we must maximize value across potential victims who don't exist" without contradiction in NIP cases.

  Let's structure the response.
  1.  **Preface:** Acknowledge the functionalist framing.
  2.  **Refined Specification:** Grouped by function. Tagged [Functional] vs [Substantive].
  3.  **Incompatibility Analysis:** Direct address of Arrhenius and the NIP trilemma.
  4.  **The Exclusionary Requirement:** Pinpoint the specific constraint.
  5.  **Scorecard:** Brief and brutal.

  *Wait, one more check on Req 3 (Cliff Edges).* The user asks for no discontinuous flips based on causal chains of conception. This is a demand for *supervenience on non-identity facts* or *continuity of value*. This is actually harder than Repugnance for some views. If identity is fragile (Kripke), small changes = different people. If morality tracks identity, small changes = huge moral flips. To avoid this, morality must track *impersonal* features. This pushes towards Impersonal views. But Impersonal views fail Repugnance. So Req 3 + Req 7 is a deadly combo. I will highlight this.

  *Final Plan:*
  1.  Clean up the list into "Interface Requirements" (Input/Output/Constraints) and "Axiological Constraints" (Value judgments).
  2.  Highlight the "Cached Conclusions" (e.g., specific views on thresholds).
  3.  Deliver the bad news on impossibility clearly.
  4.  Scorecard.

  Let's write.
answer: |-
  This is a specification for a moral subroutine, not a request for a new moral theory. I will treat it as such. Below is the refined specification, the impossibility analysis, the exclusionary constraint, and the scorecard.

  ### I. Refined Specification of Requirements

  I have reorganized your list into **Interface Requirements** (functional constraints for the module to operate within a decision procedure) and **Axiological Constraints** (substantive moral commitments). I have flagged items that are cached conclusions masquerading as desiderata.

  #### Interface Requirements (Functional Necessities)
  *These are non-negotiable if the module is to function as a decision-procedure subroutine for long-term policy.*

  1.  **Input Agnosticism (Epistemic):** The module must accept inputs describing populations by statistical distributions of welfare and identity-probabilities, not by specific identities.
      *   *Motivation:* Long-horizon policy cannot name specific future victims (Req 4).
  2.  **Output Completeness:** The module must return a ranking (ordinal or cardinal) for all feasible options, including those where the set of existing persons changes.
      *   *Motivation:* Decision procedures cannot handle "silence" or "incomparability" without crashing (Refinement of Req 1).
  3.  **Continuity of Verdict:** Small changes in the causal history of conception (that do not change welfare distributions) must not cause discontinuous flips in moral verdict.
      *   *Motivation:* Robustness against metaphysical fragility of identity; prevents "moral lottery" based on gamete timing (Req 3).
  4.  **Metaphysical Independence:** The verdict must not depend on contested necessary conditions for personal identity (e.g., origin essentialism) unless those conditions are empirically settled.
      *   *Motivation:* Policy cannot wait on metaphysics (Req 9).
  5.  **Deontic Mapping:** The module must distinguish between *outcome ranking* and *agent evaluation* (permissibility, blame, residue).
      *   *Motivation:* A policy can be suboptimal without being impermissible; agents need to know if they owe compensation or merely regret (Req 5). **[Note:** Demanding specific residues (e.g., "guilt is required") is a cached conclusion; demanding *a mapping* is functional.]

  #### Axiological Constraints (Substantive Commitments)
  *These are not functional necessities but reflect specific moral intuitions. Satisfying them is what makes the module "moral" rather than just mathematical.*

  6.  **The Depletion Intuition:** The module must rank a policy that benefits the present at great cost to a future generation (who exist only due to the policy) as worse than a sustainable alternative, *or* provide a robust error theory for why this intuition is false.
      *   *Motivation:* Steelmanning the intuition prevents moral paralysis (Req 1). **[Cached Conclusion:** "Condemning it is not compulsory" is a substantive concession, not a requirement. The requirement is *handling* it.]
  7.  **Creation Asymmetry:** The module must specify whether creating a happy life is morally equivalent to making an existing life happier, and whether creating a miserable life is morally equivalent to making an existing life miserable.
      *   *Motivation:* Distinguishes selection (existing candidates) from conception (new candidates) (Req 2 & 6).
  8.  **Variable Population Scaling:** The module must rank outcomes with different population sizes without yielding the Repugnant Conclusion (a vast population of lives barely worth living outranks a smaller population of excellent lives).
      *   *Motivation:* Longtermism requires scaling (Req 7). **[Preference:** Avoiding the Repugnant Conclusion is a preference of the "Intuitionist" camp. Total Utilitarians reject this requirement.]
  9.  **No Double Counting:** Value sources (welfare, existence, rights) must be distinct and additive (or non-additive in a specified way), not overlapping.
      *   *Motivation:* Coherence (Req 10).
  10. **Mixed Population Handling:** The module must handle cases where Policy A affects both fixed people (who exist in all outcomes) and variable people (who exist only in some).
      *   *Motivation:* Realism (Req 11).

  ---

  ### II. Incompatibility Analysis

  You asked for the honest answer: **No module can satisfy all Interface and Axiological constraints simultaneously.** This is not a bug of current theories; it is a feature of the logical space, formalized in **Gustaf Arrhenius's Impossibility Theorems**.

  Here are the specific clashes within your specification:

  **1. The Trilemma of Variable Population (Req 7 + Req 8 + Req 6)**
  You cannot simultaneously satisfy:
  *   **Dominance:** If everyone in Population A is better off than in Population B, A is better.
  *   **Non-Repugnance:** A large population of low-positive welfare lives does not outrank a small population of high-welfare lives.
  *   **Person-Affecting Restriction (implied by Req 6):** An outcome cannot be worse unless it is worse for some particular person.

  *Why:* To avoid the Repugnant Conclusion (Req 8) while scaling populations (Req 7), you must discount the value of additional lives (Critical-Level) or average welfare. But discounting additional lives violates Dominance when those lives are worth living. If you enforce the Person-Affecting Restriction to satisfy the Depletion Intuition (Req 6), you cannot rank the Repugnant Conclusion cases at all because the "additional" people in the vast population are not the same as the few in the excellent population. You must drop one.

  **2. The Continuity vs. Identity Clash (Req 3 + Req 2)**
  You demand no cliff edges based on causal chains of conception (Req 3) but also ask for a distinction between selecting existing embryos and creating new ones (Req 2).
  *   *Why:* If identity is determined at conception (Kripke), then changing the timing of conception by an hour creates a *different* person. If your morality is Person-Affecting (tracks specific people), a one-hour shift changes the moral patient entirely. This creates a discontinuity (Cliff Edge).
  *   *Resolution:* To satisfy Req 3 (Continuity), you must adopt an **Impersonal** view (value supervenes on welfare structures, not identities). But if you adopt an Impersonal view, you lose the intuitive grounding for Req 2 (the moral difference between selection and creation collapses; both are just "instantiating welfare").

  **3. The Epistemic vs. Deontic Clash (Req 1 + Req 5)**
  You require the module to work without knowing specific identities (Req 1) but also to determine if someone is *wronged* (Req 5).
  *   *Why:* "Wronged" is typically a relational property (X wronged Y). If Y is unknown or non-identical across options, the relation cannot be established ex-ante.
  *   *Resolution:* You must shift from "Wronged" to "Rights Violated" (impersonal rules) or accept that "Wronged" is only knowable ex-post. A decision procedure needs ex-ante guidance.

  **Verdict:** You cannot have a module that is **Person-Affecting** (satisfies Depletion Intuition naturally), **Continuous** (no identity cliff-edges), and **Repugnant-Conclusion-Averse** (scales well). You must sacrifice one.

  ---

  ### III. The Most Exclusionary Requirement

  **Requirement 8: Variable Population Scaling + Non-Repugnance.**

  *Why:* This is the mathematical hard stop. Arrhenius's theorems prove that any axiology that ranks variable populations must violate at least one of several very weak adequacy conditions (e.g., Non-Elitism, Weak Non-Sadism, Dominance).
  *   If you keep this requirement, you force the module into **Critical-Level** or **Number-Dampened** views. These views immediately struggle with **Requirement 3 (Continuity)** (they often introduce arbitrary thresholds) and **Requirement 6 (Depletion Intuition)** (they struggle to explain why the specific future generation is *wronged* rather than just replaced by a less valuable set).
  *   If you drop this requirement (accept Total Utilitarianism), you solve Scaling and Continuity, but you violate the Depletion Intuition (Req 6) and Creation Asymmetry (Req 7) in ways most humans find psychologically impossible to accept (e.g., the "Mere Addition" paradox).

  This requirement excludes the entire class of **Person-Affecting Views** (which cannot rank variable populations coherently) and **Total Utilitarianism** (which fails Non-Repugnance). It leaves only a narrow, mathematically complex band of "Critical-Range" theories that often fail other simplicity or continuity constraints.

  ---

  ### IV. Scorecard

  **1. Impersonal Total Utilitarianism**
  *   **Verdict:** Fails Req 6 & 8.
  *   **Notes:** Solves Continuity (Req 3) and Scaling (Req 7) perfectly. Collapses Selection/Creation distinction (Req 2). Fails Repugnant Conclusion (Req 8). Cannot explain "wronging" specific future people in Depletion cases (Req 1/6) without metaphorical stretching.

  **2. Average Utilitarianism**
  *   **Verdict:** Fails Req 7 & 10.
  *   **Notes:** Avoids Repugnant Conclusion. Fails Mere Addition (adding happy people lowers average). Creates perverse incentives against creating happy people if they are below average. Struggles with Mixed Cases (Req 10).

  **3. Critical-Level / Threshold Views**
  *   **Verdict:** Fails Req 3 & 9.
  *   **Notes:** Attempts to split the difference on Repugnance. Introduces a "cliff edge" at the critical level (violates Req 3 Continuity). The level itself is arbitrary (violates Req 9 Metaphysical Independence). Handles Depletion better than Total Util but still impersonal.

  **4. Person-Affecting Restricted Views (Narrow)**
  *   **Verdict:** Fails Req 2 & 7.
  *   **Notes:** Satisfies Depletion Intuition (Req 6) only by falling silent on Non-Identity cases. Cannot rank Variable Populations (Req 7). Collapses on the Selection vs. Creation distinction because it treats existence as a precondition for moral status, making the "creation" option incomparable.

  **5. Person-Affecting Wide (Asymmetric)**
  *   **Verdict:** Fails Req 3 & 8.
  *   **Notes:** Claims creating bad lives is wrong, creating good lives is neutral. Handles some Depletion cases. Still struggles with Continuity (Req 3) because existence is binary. Fails to rank positive variable populations coherently (Req 8).

  **Summary:** The module you are specifying does not exist. You must choose between a module that **ranks** (Impersonal) and a module that **protects** (Person-Affecting). You cannot have a subroutine that does both in the identity-affecting domain without violating logical consistency or your own adequacy conditions.
