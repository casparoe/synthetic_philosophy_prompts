answer: |-
  The XOR blackmail case is indeed one of the most intricate thought experiments in modern decision theory, designed specifically to highlight the gap between Causal Decision Theory (CDT) and Functional Decision Theory (FDT). Your rough understanding was very close, but the devil is in the details of *why* CDT fails and how FDT defines "rationality" differently. Here is a breakdown of the scenario, the reasoning of both agents, and why FDT claims to resist extortion.

  ### The Setup: XOR Blackmail

  To understand the dispute, we must define the rules precisely. Imagine you are an agent facing a blackmailer who is a perfect predictor of your behavior.

  1.  **The Secret:** There is a fact about the world, determined by chance (e.g., 50% probability), that is costly to you. Let's say you have a termite infestation (**T**) which costs you **-$1,000** if true. If you don't have termites (**~T**), the cost is **$0**.
  2.  **The Demand:** The blackmailer may send you a letter (**L**) demanding **$100** to keep quiet. If you pay (**P**), you lose **-$100**. If you don't pay (**~P**), you lose **$0** to the blackmailer.
  3.  **The XOR Condition:** The blackmailer sends the letter if and only if **exactly one** of the following is true: either you have termites (**T**) OR you are the type of agent who would pay the blackmail (**P**).
      *   Logic: **L is sent iff (T XOR P)**.
      *   This means the letter is sent if (You have termites AND you won't pay) OR (You have no termites AND you will pay).
  4.  **The Sequence:**
      *   Nature determines Termites (T) or No Termites (~T).
      *   The Blackmailer predicts your decision (P or ~P) and sends the letter based on the XOR rule.
      *   You receive (or don't receive) the letter.
      *   You choose to Pay or Not Pay.

  ### The Causal Decision Theorist (CDT) Trap

  Your friend noted that your sketch of the CDT agent was "almost right." CDT agents do pay, but not because they think paying *causally* erases the termites. They pay because of how they handle conditional probability once the letter is in hand.

  When a CDT agent receives the letter, they treat the past as fixed. They reason:
  *   "The letter is already here. The blackmailer's prediction is already made. My choice now cannot causally change whether I have termites."
  *   "However, I know the letter was sent only if (T XOR P) is true."
  *   "If I choose to **Pay**, then for the letter to exist, I must **not** have termites (since True XOR True = False). Outcome: I lose $100."
  *   "If I choose **Not to Pay**, then for the letter to exist, I **must** have termites (since True XOR False = True). Outcome: I lose $1,000."
  *   "Comparing -$100 to -$1,000, I should **Pay**."

  The CDT agent pays because, conditional on receiving the letter, paying correlates with safety. They fail to see that this correlation exists *only because* the blackmailer predicted they would pay. By paying, they validate the prediction that leads to the letter being sent when they are safe, effectively paying ransom for nothing.

  ### The Functional Decision Theorist (FDT) Solution

  FDT agents do not ask, "Given I have the letter, what should I do?" Instead, they ask, "Which decision *policy* yields the best outcome?" They recognize that their decision procedure is what the blackmailer simulated.

  *   **Policy A (Pay if Letter):** The blackmailer predicts this. The letter is sent iff (T XOR True) → iff **~T**.
      *   If you have termites (50%): No letter sent. You don't pay. Loss: **-$1,000** (from termites).
      *   If you have no termites (50%): Letter sent. You pay. Loss: **-$100**.
      *   **Expected Loss: -$550.**
  *   **Policy B (Don't Pay if Letter):** The blackmailer predicts this. The letter is sent iff (T XOR False) → iff **T**.
      *   If you have termites (50%): Letter sent. You don't pay. Loss: **-$1,000** (from termites).
      *   If you have no termites (50%): No letter sent. You don't pay. Loss: **$0**.
      *   **Expected Loss: -$500.**

  The FDT agent chooses **Policy B**. They refuse to pay. By committing to non-payment, they ensure the blackmailer only sends the letter when the termites actually exist. They never hand over money to the blackmailer; they only suffer the natural cost of the secret.

  ### Correcting Your Sketch

  You wrote: *"if you're the paying type you don't actually have the secret and paying just wastes the money."*
  **Correction:** This is actually **correct** for the outcome of the "Pay" policy. If you are the paying type, the blackmailer sends the letter only when you *don't* have the secret. You are paying to keep quiet about nothing.

  You wrote: *"whereas a causal decision theorist supposedly pays because they think paying makes the bad revelation go away."*
  **Correction:** This is the subtle garble. CDT knows paying doesn't change the past. They pay because they treat the blackmailer's prediction as a fixed historical fact independent of their current choice, rather than recognizing their current choice *is* the output of the function that was predicted. They fall for the correlation without seeing the logical link.

  ### Why This Is "Resisting Extortion"

  In this scenario, "extortion" is the transfer of wealth to the blackmailer that provides no causal benefit.
  *   The **CDT agent** pays the $100 specifically in the worlds where they *don't* have termites. They are being extorted.
  *   The **FDT agent** never pays the $100. They only lose money to the termites (nature), never to the blackmailer. By adopting a policy of non-payment, they logically prevent the blackmail scenario from arising in the worlds where they are safe.

  Summary: FDT agents resist extortion because they select a decision policy that logically determines the blackmailer's prediction, ensuring the threat is only issued when the secret is already true, whereas CDT agents pay because they treat the prediction as fixed history and optimize solely based on the conditional evidence of the letter.
