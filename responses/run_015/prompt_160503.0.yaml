answer: |-
  1. **The Newman Problem (Triviality)**
     "I want to start with the Newman problem, because in seminar we worried that if you just say 'the world has structure,' that's trivially true for any collection of things as long as you have enough of them. If I can just map any domain onto any other domain given enough cardinality, doesn't your claim that 'only structure is real' end up saying almost nothing about the world?"
     *[Pressure point: This is the classic triviality objection to structural realism. If structure is just relations, and relations can be defined over anything, OSR risks being empty.]*
     *[Expected answer: She will likely say this only applies to Ramsey-sentence formulations where relations are uninterpreted, and that she avoids this by restricting to 'natural' or 'physical' relations.]*

  2. **Follow-up: Category Theory & Natural Relations**
     "Okay, so you'd say you avoid that by using category theory and only quantifying over natural relations, not just any old logical mapping. But doesn't picking out which relations are 'natural' already require you to identify some objects or properties to bear those relations? Aren't you smuggling the objects back in through the back door of the category?"
     *[Pressure point: If she needs 'natural relations' to avoid triviality, she needs a criterion for naturalness. That criterion usually relies on the very objects she claims to eliminate.]*
     *[Expected answer: She'll argue that categories define the relations intrinsically without needing prior individuation of relata—morphisms are primitive.]*

  3. **Follow-up: No-Miracles Independence**
     "Here's the worry though: the original motivation for structural realism was the No-Miracles Argument—structure survives theory change, so realism isn't miraculous. But if you've moved away from the Ramsey-sentence view to avoid Newman, is that historical success story even compatible with your version? Did the 'structure' that survived from Fresnel to Maxwell really satisfy your strict category-theoretic constraints, or are you changing the rules to solve the philosophy problem?"
     *[Pressure point: Connects the technical fix back to the historical motivation. If the history doesn't fit the new technical definition, the motivation collapses.]*
     *[Expected answer: She will likely argue that the historical cases can be reconstructed categorically, or that the No-Miracles argument needs updating anyway.]*

  4. **Relata & Individuation (The Hole Argument)**
     "I'm still not over the Hole Argument from a few weeks ago, and it seems to haunt you too. If there are no objects, just structure, what fixes *which* structure you've got? In the Hole Argument, spacetime points can't be picked out by relations alone without indeterminism. Do you have a 'structure of individuation' problem where you can't distinguish between isomorphic structures without secretly pointing at nodes?"
     *[Pressure point: This applies the seminar's recent topic (Hole Argument) to her ontology. Without relata, it's hard to ground the identity of the structure itself.]*
     *[Expected answer: She will likely say isomorphism is identity—there is no difference between isomorphic structures, so the problem dissolves.]*

  5. **Follow-up: Solve vs. Dissolve**
     "So is your move to say that's a problem to solve, or one to dissolve? Because if you dissolve it by saying isomorphic structures are identical, you seem to lose the ability to talk about the *same* structure being realized in different physical systems. If the realization doesn't matter, are you doing physics or pure math?"
     *[Pressure point: Forces her to choose between mathematical abstraction and physical application. If realization doesn't matter, OSR loses contact with empirical science.]*
     *[Expected answer: She'll try to walk the line, saying the physical realization is just another layer of structure, not a layer of objects.]*

  6. **Quantum Mechanics: Best or Worst Case?**
     "Quantum mechanics is usually the big win for OSR because of indistinguishable particles—permutation invariance looks like a 'no-individuals' proof. But the structure still has to encode statistics over things that look an awful lot like the particles you just eliminated. Are quantum particles your best evidence, or is it secretly your worst case because the math still counts them?"
     *[Pressure point: QM is the standard battleground. If the math requires counting (even if indistinguishable), the 'no objects' claim is strained.]*
     *[Expected answer: She will argue that counting is a structural feature, not a count of underlying substances.]*

  7. **Scope & Ontological Status**
     "Does this ontology reach all the way up to chemistry, biology, or just tables and chairs? And if the honest answer is 'no, only fundamental physics,' isn't the 'everything is structure' claim much smaller than it sounds? Also, for the structures that *do* exist, do they exist *in re* (in the things) or *ante rem* (like Platonic forms), because I've never quite understood where you think the structure lives?"
     *[Pressure point: Tests the universality of the claim and forces a stance on the metaphysical status of structures (Platonism vs. Immanentism).]*
     *[Expected answer: She'll likely say macro-objects are derivative structures, and deny Platonism by saying structures are immanent in physical systems.]*

  8. **Neural Nets: Functionalism in Disguise?**
     "I want to pivot to your neural net project. You say weights and units aren't real, only the relational structure is. But isn't this just computational functionalism in new vocabulary? If you say the physical substrate doesn't matter, only the causal role, philosophers have been saying that for forty years. What does the category-theoretic OSR label actually *add*?"
     *[Pressure point: Challenges the novelty of her ML application. If it's just functionalism, the OSR machinery might be superfluous.]*
     *[Expected answer: She'll claim OSR provides a stricter mathematical criterion for 'same function' than standard functionalism, handling retraining cases better.]*

  9. **Neural Nets: Prediction & Falsification**
     "Following on that: what would actually count against your view in the ML context? If two networks have different weights but you say they're the 'same structure,' and then they behave differently in edge cases, do you say your structural analysis was wrong, or do you just say they were different structures all along? I'm worried nothing could falsify this."
     *[Pressure point: Tests empirical content. If every outcome can be redescribed as 'different structure,' the theory is unfalsifiable.]*
     *[Expected answer: She should point to specific invariants that, if broken, would prove structural difference, but this is hard to pin down.]*

  10. **Closing: The Unanswered Objection**
      "For my last question: I know you have a standard response to most criticisms, usually that they rely on leftover 'object-thinking.' So I want to ask you to name the one objection to eliminativist OSR that you think is *genuinely* still unanswered, where you can't just say 'that's a category mistake.' What's the problem that keeps you up at night?"
      *[Pressure point: Forces intellectual honesty. Prevents the 'you're just thinking in objects' dismissal.]*
      *[Expected answer: Hopefully she admits something like the 'ontology of relations' problem or the specific nature of structural modality.]*
