  Elena, a senior actuary, must approve a complex risk current model. Her internal reasoning yields a specific, structured confidence that the mathematics are sound. Historical company data reveals that analysts experiencing this precise mental state are wrong forty per cent of the time, regardless of actual model quality. She faces a standard binary choice: approve based on her reasoning or defer to the statistical failure rate of her own confidence. The payoffs involve routine project bonuses, not existential risks, ensuring ordinary decision-making pressures apply to her selection between subjective judgement and objective reference classes.

  The three verdicts
  Pure inside-view rationalism argues Elena should trust her direct access to the reasoning process; the statistical track record is merely noise regarding the specific logical validity before her. Pure outside-view calibrationism insists she must adopt the sixty per cent success rate of her reference class, ignoring the subjective quality of her current thought entirely. The epistemic-modesty hybrid applies the failure rate recursively: initial confidence is discounted by the forty per cent failure, reducing her certainty. If this reduction technically alters her mental state into a lower-confidence class with similar failure rates, repeated discounting drives her authority towards zero. Consequently, the hybrid agrees with the outside view, but only because the feedback loop forces a total collapse of inside-view authority through iterative erosion. In contrast, were the reference class defined independently, such as by tenure rather than feeling, the hybrid would apply the discount once. The evidence would remain static, allowing the agent to settle at a weighted average between her judgement and the base rate. Thus, the loop is the critical variable determining whether modesty leads to compromise or capitulation. The inside view retains weight only when the reference class remains external to the agent's updating process. The inside view claims immediate justification, while the outside view demands statistical alignment. The hybrid attempts reconciliation but fails here due to the moving target of evidence. In standard conflicts, the reference class is fixed, permitting a stable compromise. Here, the agent's reasoning alters the class, preventing stability. Therefore, the verdicts diverge sharply based on the structural definition of the group. This ensures the hybrid collapses only under the specific looped constraint requested.

  The loop feature
  The structural feature causing collapse is the self-referential definition of the reference class. Because the class is defined by her confidence level, any Bayesian update alters the property determining class membership. In an independent case, updating confidence does not change the reference class, allowing a stable weighted average. Here, the evidence is unstable, forcing an iterative recalculation that asymptotically eliminates inside-view weight. Trusting the inside view confirms membership in an unreliable group, undermining the trust to remain in that group, creating a self-defeating cycle stabilising at zero confidence.

  Collapse check
  Removing the loop restores stability. If the class were 'actuaries with ten years' experience', updating her confidence does not change her experience level. The hybrid agent applies the discount once, settling at a weighted average between her judgement and the base rate. The total collapse is unique to the feedback loop where the observer's state determines the statistical evidence. Without this reflexivity, the inside view retains significant residual authority despite the base rate.

  Inside-view defence
  A defender of pure inside-view reasoning would challenge the legitimacy of conditioning on internal mental states. They would argue that 'feeling confident' is not a causal factor in truth but a byproduct of reasoning. Treating phenomenological states as data conflates the map with the territory. The reference class should be defined by external competencies or training, not transient psychological feelings which are irrelevant to logical validity. They might claim accessing the quality of reasoning directly trumps indirect statistical proxies, rendering the reference class selection an error of category.

