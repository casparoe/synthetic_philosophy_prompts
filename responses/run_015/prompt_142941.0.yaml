  No established philosophical term precisely captures this normative middle ground, so the concept of **Cognitive Co-Agency** best distinguishes it from both instrumental tool-use and ontological extension. Clark and Chalmers' Extended Mind Thesis relies on the Parity Principle to argue that external processes functioning like internal ones are constitutive parts of the mind, an ontological claim your observed users explicitly avoid by not treating the model as literal brain tissue. Traditional instrumentalism maintains a strict subject-object distinction where the tool is transparent and the user bears sole epistemic responsibility, failing to capture the phenomenology of "shared reasoning" or the willingness to defend outputs as joint products. Distributed Cognition maps information flow across systems but often sidesteps the agent's subjective experience of joint ownership and the normative stance of accepting responsibility for the AI's contributions. Cognitive Co-Agency describes a state where agents functionally integrate an external system into their reasoning loop, accepting joint responsibility for outcomes while maintaining an ontological distinction between biological self and artificial artifact. In the tool boundary case, a calculator's error is attributed to mechanical failure or input error, never to a shared cognitive lapse. In the full extension boundary case, a notebook entry is treated as literal memory, where loss constitutes cognitive damage rather than data loss. In Cognitive Co-Agency, an LLM's output is defended as "our reasoning," implying a shared epistemic space where the AI is a partner in justification rather than a mere instrument of calculation or a literal neural extension.
