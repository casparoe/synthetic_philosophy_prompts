prompt: |-
  I'm a junior leading a fifty-minute discussion section for fifteen first-year students in an introductory political philosophy course. Next week I need to teach the problem of dirty hands, but not through the ticking-bomb or torture cases they have already read. Instead, I want them to work through a distinction between dirty hands as an irreducible personal moral stain and dirty hands as a structural feature of democratic institutions that can persist even when no individual agent feels corrupted—using the example of a legislator who votes for a predictive-policing program knowing it will systematically harm innocent people, where the harm is built into the system's design rather than intended by any voter.

  Plan the explanatory sequence: what concept must be established before this institutional framing can even be introduced; why the predictive-policing case carries the argument better than the classic emergency scenarios and what properties it must have to do so; and in what order the components—moral cost, role obligation, structural harm, distributed accountability—should appear so that the last does not collapse back into the first.

  Then map the misconceptions they are likely to form at each stage—probably that politics is simply "morally hard," that structural harm is just dirty hands multiplied across a group, and that recognizing institutional corruption removes individual accountability. Specify exactly where in the sequence each misconception should be intercepted, and design one final check-question that would reveal whether a student has grasped the institutional framing or has merely adopted a cynical view of politics.

  Finally, tell me what part of the broader literature on moral responsibility I should openly set aside at this level so the discussion does not drift, and confirm that I should not assign further readings for this session.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Junior instructor (TA/Section Leader).
      *   **Context:** 50-minute discussion section, 15 first-year students, Intro Political Philosophy.
      *   **Topic:** The Problem of Dirty Hands.
      *   **Constraint 1:** *No* ticking-bomb/torture cases (already covered).
      *   **Core Distinction:** Dirty Hands as *personal moral stain* vs. Dirty Hands as *structural feature of democratic institutions* (even without individual corruption).
      *   **Key Example:** Legislator voting for predictive policing (systemic harm built-in, not intended by individual).
      *   **Deliverables:**
          1.  Explanatory Sequence (Concept order, why this case, ordering of components).
          2.  Misconception Mapping (Where they arise, how to intercept).
          3.  Final Check-Question (Distinguish institutional framing vs. cynicism).
          4.  Literature Scope (What to exclude, reading assignment advice).

  2.  **Deconstruct the Core Philosophical Move:**
      *   *Traditional View (Walzer, etc.):* Dirty hands is about the *agent*. A leader does something morally wrong for the sake of the greater good and bears the guilt. It's episodic and exceptional.
      *   *Proposed View (Structural):* Dirty hands is about the *system*. Democracy requires compromise and aggregation of preferences that inevitably produce harmful outcomes for minorities, even if every individual actor follows the rules and feels clean.
      *   *The Pivot:* Moving from "I did a bad thing to save us" to "We built a machine that hurts people, and I turned the crank."

  3.  **Drafting the Explanatory Sequence:**
      *   *Prerequisite Concept:* Before talking about structure, students need to understand *agency*. They need to grasp the standard view of moral responsibility (intention + action + outcome). If they don't understand the baseline of individual culpability, they can't see how the structural view differs.
      *   *Why Predictive Policing?* Ticking bomb is too high-stakes/emotional. It obscures the mundane nature of structural harm. Predictive policing is bureaucratic, data-driven, and "clean" on the surface, making the hidden harm more poignant. It shows harm as a *byproduct of efficiency*, not a *means to survival*.
      *   *Ordering Components:*
          1.  *Moral Cost:* Establish that harm happens (innocents targeted).
          2.  *Role Obligation:* The legislator's duty (public safety, budget efficiency).
          3.  *Structural Harm:* How the algorithm/system creates the bias, not the vote itself.
          4.  *Distributed Accountability:* Why no single person is "guilty" in the traditional sense, yet the harm persists.
      *   *Preventing Collapse:* The trick is ensuring "Distributed Accountability" doesn't just mean "Everyone is a little bit guilty" (which collapses back to personal stain). It must mean "The *system* is the locus of the dirt, not the soul."

  4.  **Mapping Misconceptions:**
      *   *Misconception 1:* "Politics is just hard." (Intercept at *Moral Cost*. Need to show it's not just difficulty, it's *wrongdoing*.)
      *   *Misconception 2:* "Structural harm = many dirty hands." (Intercept at *Structural Harm*. Need to show the harm exists *independently* of individual intent.)
      *   *Misconception 3:* "Institutions did it, so I'm off the hook." (Intercept at *Distributed Accountability*. Need to show responsibility shifts from *guilt* to *remediation*.)

  5.  **Designing the Check-Question:**
      *   Needs to separate "Cynicism" (Politics is corrupt, nothing matters) from "Institutional Framing" (Politics is structurally prone to harm, so we need specific mechanisms to address it).
      *   *Draft:* "Is the legislator guilty?" (Too simple).
      *   *Better:* "If the legislator feels no guilt, is the problem solved?" (Good, but maybe leads to "feelings don't matter").
      *   *Best:* Focus on the *solution*. Cynicism says "opt out." Institutional framing says "redesign."
      *   *Refinement:* Ask about the *remedy*. If they say "vote him out," that's individual focus. If they say "change the algorithm/veto process," that's structural.

  6.  **Literature & Readings:**
      *   *Exclude:* Deep metaphysical debates on collective agency (List, Pettit) or complex utilitarianism vs. deontology. Keep it phenomenological/political.
      *   *Readings:* Do not assign more. 50 mins is tight. They need to process the lecture/discussion, not prep new text.

  7.  **Refining the Flow (Self-Correction during drafting):**
      *   *Critique:* Is 50 minutes enough for this?
      *   *Adjustment:* Keep the initial lecturette very short (10 mins). Spend 30 mins on the case study/discussion. 10 mins wrap-up.
      *   *Critique:* Make sure the distinction between "stain" and "structure" is sharp.
      *   *Adjustment:* Use the metaphor of "blood on hands" (personal) vs. "rust in the pipes" (structural).

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   50 mins? Yes.
      *   15 students? Yes (allows for small group or roundtable).
      *   No ticking bomb? Yes.
      *   Predictive policing example? Yes.
      *   Sequence specified? Yes.
      *   Misconceptions mapped? Yes.
      *   Check-question included? Yes.
      *   Literature scope defined? Yes.
      *   Reading advice? Yes.

  9.  **Constructing the Output:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  Here is a structured plan for your fifty-minute section, designed to navigate the shift from individual moral psychology to institutional structure without losing the students in abstraction.

  ### I. Explanatory Sequence

  **1. The Prerequisite Concept: *Intentional Agency***
  Before introducing the institutional framing, you must establish the baseline of the "Classic Dirty Hands" view (Walzer, etc.). Students must understand that traditional dirty hands theory relies on **intentional violation**.
  *   **Definition:** An agent knowingly commits a moral wrong (the *means*) to achieve a political good (the *end*), and accepts personal guilt as the cost.
  *   **Why this first?** If students do not grasp that the traditional view requires a *corrupted soul*, they cannot see the contrast with a system that produces harm with *clean souls*.

  **2. Why the Predictive-Policing Case?**
  The ticking-bomb scenario fails for this specific lesson because it relies on **exceptionalism**. It suggests dirty hands are rare emergencies.
  *   **The Predictive-Policing Advantage:** It demonstrates **routinized harm**.
  *   **Required Properties:**
      *   *Opacity:* The harm (bias against specific neighborhoods) is a byproduct of an algorithm, not a direct order.
      *   *Diffusion:* The legislator votes for "efficiency," the vendor codes the "data," the police deploy the "maps."
      *   *Clean Intent:* The legislator genuinely believes they are reducing crime, not harming innocents.
      *   **Argumentative Load:** This case forces the question: *If no one intended the harm, but the harm is certain, where does the "dirt" reside?*

  **3. Ordering the Components**
  To prevent the final concept from collapsing back into the first, you must build the argument in this specific order:

  1.  **Moral Cost:** Establish that innocent people *will* be harmed (harassed, arrested) due to the program. (Fact of harm).
  2.  **Role Obligation:** Establish that the legislator is fulfilling their duty (public safety, fiscal responsibility) by voting for it. (Fact of duty).
  3.  **Structural Harm:** Show that the harm arises from the *interaction* of the duty and the system design, not the legislator's will. (The "Rust in the Pipes").
  4.  **Distributed Accountability:** Conclude that responsibility is not about *guilt* (looking backward at the soul) but about *remediation* (looking forward at the structure).

  *Crucial Logic:* If you introduce Distributed Accountability before Structural Harm, students will simply divide the guilt among 100 voters (1% guilt each). By establishing Structural Harm first, you argue that the *system itself* is the agent of the dirt, shifting the focus from "Who is to blame?" to "What is broken?"

  ---

  ### II. Misconception Mapping & Interception

  **Stage 1: After introducing Moral Cost & Role Obligation**
  *   **Likely Misconception:** *"Politics is just morally hard."* (Students view this as a tragic dilemma where the legislator just has to make a tough choice).
  *   **Interception Point:** Immediately after discussing Role Obligation.
  *   **Intervention:** Ask: *"If the legislator feels no regret, is the moral cost paid?"* In the classic view, the guilt *is* the payment. In this case, the legislator sleeps soundly. Push the idea that "feeling hard" is not the same as "doing wrong."

  **Stage 2: After introducing Structural Harm**
  *   **Likely Misconception:** *"Structural harm is just dirty hands multiplied across a group."* (Students think 15 legislators voting 'yes' means 15 people with dirty hands).
  *   **Interception Point:** During the analysis of the algorithm/system design.
  *   **Intervention:** Use the **"Clean Hands" Test**. Ask: *"If every single voter and legislator is virtuous, follows the law, and intends the public good, does the harm still happen?"* If the answer is yes, the dirt is not on the hands; it is in the machine. This breaks the link between individual virtue and systemic outcome.

  **Stage 3: After introducing Distributed Accountability**
  *   **Likely Misconception:** *"Recognizing institutional corruption removes individual accountability."* (Students conclude: "The system did it, so the legislator is innocent.")
  *   **Interception Point:** In the final synthesis before the check-question.
  *   **Intervention:** Clarify that **Accountability $\neq$ Guilt**. The legislator may not be *guilty* of malice, but they retain *responsibility* for maintenance. Analogy: A pilot isn't "guilty" if the plane has a design flaw, but they are responsible for not flying it.

  ---

  ### III. The Final Check-Question

  Do not ask "Is the legislator guilty?" (This invites a Yes/No binary). Do not ask "Is this unfair?" (This invites cynicism).

  **Ask this:**
  > "If we accept that this harm is a structural feature of our democracy rather than a personal failing of the legislator, **what is the specific political remedy?** Does the solution require the legislator to *resign*, or does it require the legislature to *change its voting rules*?"

  *   **Cynical/Misunderstood Answer:** "The legislator should quit" (Focuses on individual purity) OR "Nothing, politics is always corrupt" (Nihilism).
  *   **Correct Institutional Answer:** "We need to change the rules/process (e.g., impact assessments, veto points) because replacing the person won't fix the machine."

  This reveals if they understand that the *locus of the problem* has shifted from the agent to the institution.

  ---

  ### IV. Literature Scope & Readings

  **What to Set Aside:**
  Openly tell students you are bracketing **Collective Moral Agency metaphysics**.
  *   *Why:* First-years will get bogged down in "Can a group literally feel guilt?" or "Is the State a person?"
  *   *Instruction:* "We are not asking if the 'State' has a soul. We are asking if the *outcomes* of the State produce moral stains that individual actors cannot wash away."
  *   *Also Exclude:* Complex Utilitarian calculus. Do not let them spend 20 minutes debating whether the crime reduction outweighs the harassment. Stipulate that the harm is significant and the benefit is real, but the *distribution* is the problem.

  **Reading Assignment:**
  **Do not assign further readings for this session.**
  *   *Reasoning:* This is a conceptual pivot. If they are reading new text (e.g., Young or List), they will focus on decoding the author rather than wrestling with the logic of the case.
  *   *Strategy:* Use the 50 minutes to let them argue the predictive policing case using the concepts you provide. Their "reading" is the logic of the scenario. Assign the theoretical text (e.g., Iris Marion Young's "Responsibility and Justice" or similar) for the *following* section once they have intuitively grasped the problem through this discussion.

  ### Summary Timeline (50 Minutes)
  *   **00-10:** Mini-lecture: Classic Dirty Hands (Guilt) vs. Structural Dirt (Design). Define Intentional Agency.
  *   **10-25:** Case Study: The Predictive Policing Vote. Walk through Moral Cost & Role Obligation. (Intercept Misconception 1).
  *   **25-35:** Small Group Discussion: "Who is to blame?" Push the Clean Hands Test. (Intercept Misconception 2).
  *   **35-45:** Full Class Synthesis: Distributed Accountability vs. Guilt. (Intercept Misconception 3).
  *   **45-50:** Final Check-Question & Wrap-up.
