answer: |-
  Let's cut the textbook preamble. You know the timeline: Wolfenden drops in '57, Parliament yawns for a decade, and the Sexual Offences Act limps through in '67. The standard read is "Liberalism triumphs over Conservatism." But if we run this through the Hart-Devlin grinder with a specific focus on **moral contamination anxiety**, the whole thing looks less like a victory for liberty and more like a negotiated quarantine.

  Here's the map of the actors, what they were actually wrestling with, and how the "hygiene" frame changes the geometry of the debate.

  ### 1. The Wolfenden Committee (1957)
  **The Move:** They drew a line between "sin" and "crime." Their recommendation was essentially: *What men do in private isn't the law's business.*

  **By Hart's Lights:** This is the correct application of the Harm Principle. The Committee recognized that criminalization created tangible welfare harms (blackmail, suicide, ruined lives) without preventing any public harm. They should have gone further—abolishing the age gap restrictions entirely—but they were constrained by the political reality. Hart would say they correctly identified that the "shared morality" against homosexuality was just prejudice masquerading as public interest.

  **By Devlin's Lights:** This is a category error. Devlin would argue the Committee failed to understand that morality *is* the public interest. There is no such thing as a "private" moral breach if that breach attacks the bonds of society. By recommending decriminalization, they were effectively telling the immune system to ignore a virus.

  **The Contamination Reframe:** Wolfenden operated on the assumption that privacy is a sealed container. They thought, *If we hide it, it stops being a public problem.* Devlin (and the contamination view) suggests this is naive. If you legalize the germ in the bedroom, the *idea* of the germ escapes into the street. Wolfenden tried to build a wall; Devlin argued walls have cracks.

  ### 2. Lord Devlin (1959/1965)
  **The Move:** Devlin writes *The Enforcement of Morals*. He argues society has a right to use law to preserve its moral fabric, just as it uses law to preserve its government.

  **The "Shared Morality" Question:** Hart famously tore this apart, asking: Is this "shared morality" a coherent philosophical system, or just the "disgust of the majority"? Hart says it's the latter—irrational revulsion. Devlin insists it's the former—the "man on the Clapham omnibus" feeling is the *data point* of social cohesion.

  **Welfare Harm:** Here's the rub. Can Devlin's framework register the suffering of gay men? **No.** It's defined out of bounds from the start. In Devlin's calculus, the "harm" to the individual via criminalization is a necessary tax paid to prevent the "harm" of social disintegration. The suicide of a blackmailed gay man is tragic, but the collapse of the moral order is existential. One is a casualty; the other is the end of the war.

  **The Contamination Reframe:** If we treat Devlin's disgust not as theological intuition but as **moral contamination anxiety**, his argument gets structurally stronger, even if morally uglier. He's not saying "God hates this." He's saying, "Norms are hygienic." If you allow a deviation in private, it normalizes the deviation, which erodes the norm, which eventually weakens the institution (marriage/family) that holds society together. It's a slippery slope argument dressed as sociology. It makes him less of a preacher and more of a public health official worried about airborne morality.

  ### 3. H.L.A. Hart (1963)
  **The Move:** Hart fires back with *Law, Liberty, and Morality*. He defends Wolfenden, arguing that law should only prevent harm to others, not enforce virtue.

  **By Devlin's Lights:** Hart is too abstract. He treats society as a collection of atoms, not an organism. Hart ignores the emotional glue. Devlin would say Hart's "liberty" is a luxury that only works when the moral background is already secure.

  **By Hart's Lights:** Devlin is tyrannical. Hart forces the burden of proof onto the restrictor. Show me the harm. Devlin can't show a body count; he can only show a feeling of unease. Hart registers the welfare harm of criminalization clearly (psychological damage, criminal records).

  **The Contamination Reframe:** Hart's weakness here is that he assumes moral norms are static or rational. He doesn't fully account for the *contagion* effect Devlin fears. Hart assumes you can change the law without changing the culture. The contamination frame suggests Hart underestimated how law *teaches*. By keeping the law, the state teaches "this is bad." By removing it, the state teaches "this is neutral." Hart wants neutrality; Devlin knows neutrality is impossible.

  ### 4. Parliament (1957–1967)
  **The Move:** They dragged their feet for ten years. When they finally passed the 1967 Act, it was riddled with caveats: acts must be "in private," age of consent set at 21 (higher than for women), and only applied to two men (no group stuff).

  **Hart vs. Devlin Assessment:**
  *   **Hart:** This is a compromised victory. The "in private" clause is still moral policing. It implies the act is only tolerable if invisible. The age of consent (21) is paternalistic, assuming young men are vulnerable to "recruitment."
  *   **Devlin:** This is a strategic retreat. Parliament kept the public boundary firm. They didn't say homosexuality is *good*; they said it's *tolerable if hidden*.

  **The Contamination Anxiety Diagnosis:**
  The ten-year delay and the specific wording of the 1967 Act scream **contamination anxiety**, not explicit moralism.
  If Parliament were pure Devlinians, they would have kept it fully criminal. If they were pure Hartians, they would have passed Wolfenden in '57.
  The delay suggests they were terrified of the *seepage*. They weren't worried about the act itself happening; they were worried about the act becoming *visible*.
  *   **"In Private":** This is a quarantine zone. It's not decriminalization; it's zoning law. Keep the hazard in the residential zone, away from the public square.
  *   **Age 21:** This isn't about capacity to consent (18 was the age of majority); it's about protecting the "unformed" from contamination. It assumes homosexuality is something you catch, not something you are.

  ### The Verdict on the 1967 Act
  Is the 1967 Act a win for Hart? **No.** It's legal moralism that negotiated its borders.
  Hart wanted the law to be indifferent. The 1967 Act made the law *complicit in the shame*. By legislating "privacy," the state codified the idea that homosexuality was inherently public-dangerous. It validated Devlin's core fear (that it threatens the public) while conceding Hart's core demand (don't put them in prison).

  ### Does the "Contamination" Frame Help Devlin?
  Treating Devlin's disgust as **moral contamination anxiety** makes his argument **structurally different**, and in a sociological sense, **stronger**, though still empirically vulnerable.

  1.  **Stronger:** It moves the debate from "Is homosexuality sinful?" (theological, subjective) to "Does tolerating homosexuality weaken social cohesion?" (sociological, functional). It explains *why* the majority feels disgust without needing to justify the disgust as rational. It treats morality like herd immunity.
  2.  **Weaker:** It relies on a empirical claim that didn't hold up. We decriminalized in '67, and society didn't disintegrate. The "germ" didn't kill the host. The contamination fear was a false positive.
  3.  **Different:** It changes the solution. If the problem is "sin," you punish. If the problem is "contamination," you **quarantine**.

  And that is exactly what Parliament did. The 1967 Act wasn't liberation; it was a biohazard protocol. They let the "infected" live, provided they stayed behind closed doors and didn't try to "convert" anyone under 21.

  So, looking back: Hart won the philosophical argument (eventually), but Devlin won the legislative drafting. The law didn't stop enforcing morality; it just changed the enforcement mechanism from **prohibition** to **segregation**. The decade of delay wasn't political incompetence; it was the time it took for the contamination anxiety to subside enough to allow the quarantine to be established.
