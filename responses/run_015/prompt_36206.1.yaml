answer: |-
  Here is a battle plan for your 50-minute section.

  ### 1. The Running Example: The Foraging Robot
  **Pick:** A simple autonomous robot tasked with finding charging stations in a hazardous environment.
  **Why this pick:**
  *   **For the CS Majors:** It maps cleanly to architectures they recognize (Hard-coded logic $\rightarrow$ Reinforcement Learning $\rightarrow$ Model-Based Search $\rightarrow$ Shared Database/Cloud).
  *   **For the Bio/CogSci Majors:** It avoids the "but do rats *really* plan?" debate. You can stipulate the capacities to illustrate the *logic* of the layers without getting bogged down in ethology.
  *   **The Critical Feature:** It makes "Death" concrete. If the battery hits 0%, the agent terminates. This is required to make sense of the Darwinian layer (selection by elimination) and the Popperian layer (avoiding death without risking it).
  *   **Mutability:** You can keep the robot's body constant and just upgrade its "brain" four times.

  ### 2. Pedagogical Order: Stick to Dennett (D $\rightarrow$ S $\rightarrow$ P $\rightarrow$ G)
  **Do not start with Popperian.**
  *   **Why:** The whole point of the taxonomy is to explain *why* internal simulation (Popperian) is an evolutionary miracle. If you start there, it feels like "obvious common sense." You need students to feel the pain of the Darwinian and Skinnerian layers first. They need to understand that **dying is expensive** before they can appreciate **thinking as a way to avoid dying.**
  *   **The Frame:** Do not teach this as an evolutionary timeline (History). Teach it as an **Architecture Stack** (Design).
  *   **The Hook (Minute 0-5):** Explicitly state: *"Humans are not Gregorian creatures who used to be Popperian. We are Darwinian creatures, wrapped in Skinnerian layers, wrapped in Popperian layers, wrapped in Gregorian layers. All four are running right now."* Use the analogy of a modern car: it has mechanical linkages (Darwinian/hardwired), ABS brakes (Skinnerian/feedback), GPS route planning (Popperian/simulation), and traffic law updates (Gregorian/culture).

  ### 3. The 50-Minute Breakdown

  **0:00–0:05: Setup & The "Layer Cake" Warning**
  *   Introduce the Foraging Robot. Goal: Find charger. Hazard: Cliffs/Pits.
  *   **Preemptive Strike:** Draw four concentric circles on the board. Label them D, S, P, G. Tell them: *"If you draw this as a ladder where humans leave the bottom rungs behind, you will fail the exam question. We keep the old layers; they just get managed by the new ones."*
  *   **Etymology:** Briefly note Gregorian = Gregory (memes/tools), not Freud. Get it out of the way.

  **0:05–0:15: Darwinian & Skinnerian (The "World Selects" Layers)**
  *   **Darwinian Robot:** Hardwired reflexes. Some robots are built with sensors facing the wrong way; they fall off cliffs and don't reproduce (get rebuilt). Selection happens *across generations of hardware*.
      *   *Key takeaway:* Competence without comprehension. The robot doesn't know *why* it avoids cliffs; it just survives.
  *   **Skinnerian Robot:** Same hardware, but now it has a reward function. It tries things. If it hits a wall, it gets a negative reward. It learns *in its lifetime*.
      *   *Key takeaway:* Faster than evolution, but still requires **actual failure** to learn. To learn a cliff is deadly, it must almost fall off once.
      *   *Misconception Check:* CS students will call this "dumb." Correct them: *"It's incredibly efficient. You don't want to simulate every motor torque; you want reflexes. Skinnerian learning is how you build expertise so you don't have to think about everything."*

  **0:15–0:25: Popperian (The "Internal Selector" Layer)**
  *   **Popperian Robot:** Now it has a map and a physics engine. Before it moves, it runs a simulation: *"If I go left, I fall."* It kills the bad idea *in the simulation*, not in the world.
      *   *Key takeaway:* **"Let your hypotheses die in your stead."** This is the soundbite they must remember.
      *   *The Cost:* Simulation is computationally expensive and requires a good model. If the model is wrong, the simulation lies.

  **0:25–0:35: Gregorian (The "Cultural Selector" Layer)**
  *   **Gregorian Robot:** It can download a map made by *other* robots. It doesn't have to simulate the cliff itself; another robot already did that and uploaded the "No-Go Zone" tag.
      *   *Key takeaway:* Selection happens across *agents*, not just within one agent's lifetime. We use tools (memes, maps, language) that contain the distilled intelligence of dead people.
      *   *Crucial Distinction:* Gregorian isn't just "using language." It's using tools that were *selected for fitness* by a culture. A random string of words isn't Gregorian; a proven heuristic is.

  **0:35–0:45: The LLM Trap (Diagnostic Activity)**
  *   **Don't deflect.** This is your best assessment tool.
  *   **The Question:** *"An LLM generates text. Is it a Gregorian Creature?"*
  *   **The Trap:** If they say "Yes, because it uses language," they missed the point.
  *   **The Correct Application:**
      1.  **Training:** The *training process* is Skinnerian (RLHF—reinforcement from human feedback).
      2.  **Architecture:** The *weights* are Gregorian (distilled human knowledge/corpus).
      3.  **Agency:** The LLM itself is **not** a creature in Dennett's sense because it has no *stakes*. It doesn't care if it dies (shuts down). It has no Darwinian drive.
      4.  **The User:** The *human* using the LLM is the Gregorian creature. The LLM is the *tool* (the meme).
  *   **Why this works:** It forces them to separate "using symbols" from "having competences selected by survival."

  **0:45–0:50: Wrap & Scope Boundaries**
  *   Summarize the stack.
  *   **Explicitly Out of Scope:** Tell them what you are *not* answering today.
      1.  **Consciousness:** *"Dennett uses this to explain consciousness later. We are not doing that today. This is about competence, not qualia."*
      2.  **The Mechanism of Selection:** *"We are not debating whether genetic drift counts as Darwinian selection or how exactly backprop relates to Skinnerian conditioning. Treat 'Selection' as a black box that filters bad options."*
      3.  **Clean Kinds:** *"These are not biological species. They are design stances. A human can act Darwinian (flinching) one second and Gregorian (writing code) the next."*

  ### 4. Misconception Management Plan

  | Misconception | When it arises | Strategy |
  | :--- | :--- | :--- |
  | **"The Ladder of Being"** (Humans are Gregorian, rats are Skinnerian) | **Minute 5** (Intro) | **Preempt.** Draw the concentric circles. State clearly: *"We are all four. You are Darwinian when you flinch, Skinnerian when you practice piano, Popperian when you plan a route, Gregorian when you use a compass."* |
  | **"Skinnerian is Dumb/Failed"** | **Minute 15** (Skinner section) | **Correct.** Frame it as an optimization. *"Simulation (Popperian) is expensive. If you can learn via reinforcement (Skinnerian), you save compute. It's not a failure; it's a compression of competence."* |
  | **"Gregorian = Freud"** | **Minute 5** (Intro) | **Preempt.** Write "Gregory" on the board. Mention "Memes/Tools." Move on. |
  | **"LLMs are Gregorian Creatures"** | **Minute 35** (LLM section) | **Diagnose.** Use the "Stakes" test. *"Does the LLM fear deletion? No? Then it's not a creature. It's a Gregorian *tool* used by a Gregorian *human*."* |
  | **"This is just Evolution 101"** | **Throughout** | **Correct.** Remind them: *"Darwinian creatures don't need to evolve biologically in this class. They just need to be designs where selection happens externally. A genetic algorithm code is a Darwinian creature."* |

  ### 5. What to Refuse (Scope Boundaries)
  You need to verbally fence off the territory so the CS majors don't try to optimize the fence. Say this explicitly:

  1.  **"We are not defining Consciousness."** Dennett links this to *Consciousness Explained*. Tell students: *"Today is about behavior and design architecture. Whether the robot 'feels' like anything is a different question."*
  2.  **"We are not auditing the Biology."** If a student asks, *"But do bacteria really count as Darwinian creatures if they have horizontal gene transfer?"*, stop it. *"For this model, yes. We are treating 'Darwinian' as 'Selection without internal representation,' not debating the edge cases of microbiology."*
  3.  **"We are not solving the Symbol Grounding Problem."** When discussing Gregorian tools, a student will ask, *"But how does the robot know what the map symbols mean?"* Deflect. *"That's a semantics problem. For today, we assume the tool transmits competence regardless of whether the agent 'understands' the semantics."*

  ### Summary of the "Gift"
  The LLM question is not a derailment; it is the **final exam in miniature**. If they can correctly categorize the LLM not as a creature but as a *Gregorian artifact* that facilitates *Skinnerian training* for *Popperian humans*, they have mastered the taxonomy. If they just say "It's AI so it's Gregorian," they haven't. Frame it as the "Turing Test for Dennett's Ladder."
