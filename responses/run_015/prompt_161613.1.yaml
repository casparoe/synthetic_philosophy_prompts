answer: |-
  ### Desiderata for "Real" Periodization

  To move from a heuristic label to an ontological feature of the past, a periodization must satisfy specific criteria. Below are the desiderata, categorized by their necessity for claiming "reality" versus their utility as organizational tools.

  **1. Explanatory Power (Non-negotiable)**
  *   **Consideration:** The period must do more than group events chronologically; it must posit a causal mechanism or structural logic that makes the sequence intelligible (e.g., "feudalism" explains land-labor relations, not just dates).
  *   **Status:** **Non-negotiable.** Without this, the period is merely a bibliography, not a historical argument.

  **2. Internal Coherence (Non-negotiable)**
  *   **Consideration:** The phenomena grouped within the period must share a family resemblance or structural kinship; they cannot be a random assortment of events simply because they happened between year $X$ and year $Y$.
  *   **Status:** **Non-negotiable.** A period lacking internal coherence is a "grab-bag" and fails to pick out a distinct feature of reality.

  **3. Cross-Domain Synchronicity (Preference: The Holist Camp)**
  *   **Consideration:** Changes in art, politics, economics, and science should correlate temporally. If art shifts in 1400 but farming methods don't shift until 1600, is it one era or two?
  *   **Status:** **Preference.** Materialists and Annales historians often reject this, arguing for *décalage* (time-lags) between domains. Insisting on synchronicity privileges intellectual history over social history.

  **4. Contemporary Recognition (Preference: The Presentist Camp)**
  *   **Consideration:** Did actors at the time identify with the period? (e.g., Did they call themselves "Moderns"?)
  *   **Status:** **Preference.** Structuralists argue that deep historical shifts are often unconscious to contemporaries. Insisting on this rules out most macro-history (including "Capitalism" or "The Industrial Revolution").

  **5. Sharp Boundaries (Preference: The Event-Historian Camp)**
  *   **Consideration:** Can the start and end be pinned to specific dates or events (1453, 1492, 1648)?
  *   **Status:** **Preference.** Process-historians view change as gradual. Insisting on sharp boundaries creates artificial cliffs where there are slopes.

  ***

  ### Incompatible Subsets & The "Killer" Requirement

  **The Trade-Off:** You cannot jointly satisfy **Sharp Boundaries** and **Continuous Social Change**. If change is organic and structural, boundaries are necessarily fuzzy. You also cannot jointly satisfy **Contemporary Recognition** and **Unconscious Structural Shift**. If the shift is deep enough to define an era, it is often invisible to those living inside it.

  **The Single Requirement That Rules Out the Most:**
  **Cross-Domain Synchronicity.**
  If applied strictly, this requirement dismantles the "Big Three." Art history moves at a different tempo than agrarian economics; legal systems lag behind theological shifts. Most periodizations people actually use are sectoral (e.g., an artistic Renaissance) masquerading as total epochs. Demanding that politics, art, and science march in lockstep renders almost all grand narratives empirically false.

  ***

  ### Evaluation of the "Export Test"

  **Verdict:** It is a **valid desideratum for systemic claims**, but risks **smuggling in a prejudice of unity**.
  *   **Why it's valid:** If a period is truly a structural shift in human organization (like "Neolithic" or "Industrial"), it should have detectable ripple effects beyond its point of origin. It tests *hegemony* and *connectivity*.
  *   **Where it's prejudiced:** It assumes a unified historical tempo across distinct regions. Demanding that Ottoman astronomy conform to an Italian artistic timeline privileges the "center" (Italy) as the clock for the "periphery" (Baltic/Ottoman). It is a **Preference of the Universalist**; it is not required for a periodization to be "real" in a specific locale, only for it to be "global."

  ***

  ### Scorecard: The Usual Contenders

  **The Middle Ages**
  Fails Contemporary Recognition (a pejorative coined by later humanists) and Cross-Domain Synchronicity (a thousand years of uneven change), but retains Explanatory Power regarding specific feudal/theological structures.

  **The Renaissance**
  Passes Internal Coherence in art/literature, fails the Export Test outside elite urban centers, and relies heavily on Sharp Boundaries that dissolve under scrutiny of continuity with the 12th century.

  **The Scientific Revolution**
  High Explanatory Power for epistemology, but fails Cross-Domain Synchronicity (science changed while politics remained absolutist) and Contemporary Recognition (Newton didn't think he was ending an era).
