prompt: |-
  I'm putting together a historiography seminar on whether period terms like 'the Middle Ages', 'the Renaissance' and 'the Scientific Revolution' pick out real features of the past or are mostly retrospecive devices historians imposed later. Before we get to the cases I want the spec: what would a periodization have to do to count as more than a convenient label? Give me the desiderata with the consideration behind each, and mark which are non-negotiable and which are just preferences of one camp — sharp boundaries, being recognizable to the people living through it, cutting across several domains (art, politics, science) at once, doing genuine explanatory work rather than just summarizing a stretch of time. Flag any subset that cant be jointly satisfied, and say which single requirement rules out the most periodizations people actually use. I've also been playing with one of my own, call it the export test: a periodization earns its keep only if it lets you say something about a domain or region you didnt build it from, so a 'Renaissance' derived from Italian painting should tell you something about Baltic legal practice or Ottoman astronomy, otherwise its a regional art-history label with a big name. Is that a real desideratum or am I smuggling in a prejudice? A line each on the usual contenders at the end is plenty, I'll do the scorecard myself.
