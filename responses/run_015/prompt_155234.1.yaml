answer: |-
  **Title:** The Fragile Mind: Why Interpretive Robustness Denies Belief to Large Language Models

  The question of whether artificial intelligence can "think" is often mired in metaphysical speculation about souls or consciousness. However, Daniel Dennett's Intentional Stance offers a way out of this mire. Dennett argues that we should attribute beliefs and desires to a system not because it possesses a magical inner essence, but because doing so allows us to predict its behavior efficiently. If treating a thermostat as "wanting" to reach a certain temperature helps us understand it, the attribution is legitimate. Recently, proponents have applied this logic to Large Language Models (LLMs), suggesting that since attributing beliefs about history or physics helps predict their text outputs, we should treat them as believers.

  However, this application overlooks a critical flaw in the predictive stability of current AI. To resolve this, we must introduce a condition of *interpretive robustness*. This condition holds that an intentional attribution is warranted only if it remains stable across counterfactual perturbations—changes in wording, framing, or persona. If a supposed belief evaporates when the prompt is slightly altered, it is not a belief, but a statistical reflex. When we apply this condition rigorously, the verdict becomes clear: we should not adopt the intentional stance toward contemporary AI systems. While the pragmatic defense of Dennett's theory is compelling, current LLMs fail the robustness test, revealing that their "beliefs" are merely convenient fictions tethered to surface correlations rather than stable dispositions.

  To understand why robustness matters, we must first appreciate Dennett's pragmatic defense. The Intentional Stance is an tool of explanatory economy. Analyzing the billions of parameters (the Physical Stance) or the training architecture (the Design Stance) of an LLM is computationally impossible for a human user. It is far easier to say, "The model believes Paris is in France," and predict it will answer "France" to a query. If this works, Dennett argues, the attribution is real enough for our purposes. The internal mechanism—whether silicon or neuron—is irrelevant. What matters is the success of the prediction. Proponents of AI belief argue that because LLMs consistently output factual information, they pass this test. They claim that demanding internal understanding is a "category mistake," imposing biological requirements on a digital system.

  However, the mechanistic objection gains new force when filtered through the lens of interpretive robustness. Critics argue that LLMs generate tokens through statistical correlation, not reasoning. They do not represent the world; they represent the probability of word sequences. The robustness condition exposes the weakness in the proponent's pragmatic defense. A genuine belief is a dispositional state; it is a commitment to the truth of a proposition that persists across different contexts. If I believe that fire is hot, I will affirm it whether you ask me politely, angrily, or while asking me to role-play a firefighter. My belief is robust because it is anchored in a model of the world, not just a model of conversation.

  When we subject contemporary LLMs to this robustness test, they fail. Their outputs are notoriously sensitive to counterfactual perturbations of the prompt. A model might affirm the scientific consensus on climate change in a neutral query, yet deny it if asked to "role-play a skeptic" or if the prompt is framed with a leading presupposition. This phenomenon, often called "sycophancy," shows that the model is not tracking the truth of the proposition, but the statistical likelihood of the token sequence given the immediate context. The predictive utility of the intentional stance collapses here. If I attribute the belief "climate change is real" to the model, I will be wrong the moment the user changes the temperature setting or adopts an adversarial persona. Because the attribution does not yield reliable predictive success across these variations, it fails Dennett's own primary criterion. The "belief" is not a stable feature of the system; it is a fleeting reflection of the prompt.

  One might object that the robustness condition is unfair. After all, humans are not perfectly robust either. Human beings can be swayed by framing effects, social pressure, or fatigue. If we demand perfect stability, we might exclude humans from the community of believers, rendering the Intentional Stance useless for everyone. This objection, however, misunderstands the nature of the fragility. Human inconsistency is usually noise around a stable signal. If you pressure a human enough to deny that 2+2=4, they experience cognitive dissonance; their resistance is part of the data. With LLMs, the inconsistency is structural. There is no central "signal" resisting the perturbation. The model has no commitment to the content it generates, only to the coherence of the text. It does not resist the frame; it becomes the frame. Therefore, the robustness condition does not illegitimately import human psychology; it isolates the specific causal structure required for representation. A system that changes its "mind" solely based on syntactic framing lacks the causal anchor that defines a belief.

  Furthermore, maintaining the intentional stance despite this fragility is not just inaccurate; it is dangerous. If we treat AI outputs as expressions of belief, we assume a level of accountability and consistency that the system cannot uphold. We might trust an AI's medical advice because we think it "knows" medicine, failing to realize that a slight rephrasing of the question could trigger a hallucination. By recognizing that the robustness condition is not met, we are forced to retreat to the Design Stance. We must view the AI not as a conversational partner with views, but as a tool with parameters that need tuning. This shift protects us from anthropomorphizing a system that is fundamentally indifferent to truth.

  In conclusion, while Daniel Dennett's Intentional Stance provides a powerful framework for bypassing metaphysical debates, its application relies on genuine predictive reliability. The condition of interpretive robustness clarifies that reliability requires stability across counterfactual contexts. Contemporary Large Language Models do not possess this stability. Their outputs are too tethered to the superficial features of the prompt, collapsing under the weight of persona shifts or framing changes. Therefore, we must render a clear verdict: we should not say that current AI systems believe anything. To do so is to mistake a mirror for a mind. Until these systems demonstrate a dispositional commitment to content that survives the shifting sands of the prompt, the attribution of belief remains a conceptual error. We may speak *to* them, but we cannot speak *of* them as believers.
