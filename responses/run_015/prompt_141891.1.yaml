  # SEMINAR HANDOUT: THE GAVAGAI DECISION TREE

  **Starting Commitment:** Two manuals for translating a field linguist's informant can fit every possible bit of stimulus and behavior evidence and still disagree about what the one-word utterance is about.

  **Instructions:** Follow the arrows by answering the questions at each node. Do not look ahead to the leaves. Answer based on what you are willing to accept, not on which theorist you prefer.

  ---

  ### THE TREE

  **NODE 1 (Physical Facts):** Does the disagreement survive if the linguist is handed every physical fact there is to have, neural facts included?
  *   **NO** → Go to **NODE 7**
  *   **YES** → Go to **NODE 2**

  **NODE 2 (Home Language):** Does the puzzle get a grip on the informant's own idiolect or on mine?
  *   **INFORMANT ONLY** → **LEAF 1 (UNOCCUPIED)**
  *   **MINE TOO** → Go to **NODE 3**

  **NODE 3 (Quantifiers/Identity):** Can the reinterpretation be pushed through the quantifiers and the identity predicate too?
  *   **NO** → **LEAF 2 (MEANING-SKEPTICAL)**
  *   **YES** → Go to **NODE 4**

  **NODE 4 (Cost):** [SPECTRUM NODE] Is indeterminacy bad news for belief-desire psychology and the rest of cognitive science?
  *   **NO (SHRUG IT OFF)** → **LEAF 3 (DEFLATIONARY)**
  *   **YES (BAD NEWS)** → Go to **NODE 5**

  **NODE 5 (Logical Form):** Do the competing manuals disagree only about reference or also about logical form?
  *   **ONLY REFERENCE** → **LEAF 4 (GLOBAL PERMUTATION)**
  *   **ALSO LOGICAL FORM** → Go to **NODE 6**

  **NODE 6 (Background Language):** Is reference fixed relative to a background language?
  *   **NO** → **LEAF 5 (UNOCCUPIED)**
  *   **YES** → **LEAF 6 (QUINE'S PACKAGE)**

  **NODE 7 (Source):** Is meaning fixed by innate structure or by something out in the environment?
  *   **INNATE STRUCTURE** → **LEAF 7 (INTERNALIST)**
  *   **ENVIRONMENT** → Go to **NODE 8**

  **NODE 8 (Social vs. Causal):** Is the fixing relation causal-historical or social-triangular?
  *   **CAUSAL-HISTORICAL** → **LEAF 8 (DIRECT-REFERENCE)**
  *   **SOCIAL-TRIANGULAR** → **LEAF 9 (TRIANGULATION)**

  ---

  ### LEAF DESCRIPTIONS

  **LEAF 1: UNOCCUPIED**
  *   **Diagnosis:** Unattractive. If physical facts fail to fix reference for the informant, they should fail for the linguist too.
  *   **Label:** None.

  **LEAF 2: MEANING-SKEPTICAL**
  *   **Names:** Kripke, Wittgenstein.
  *   **Awkward Commitment:** There is no fact of the matter about what anyone means by anything.
  *   **Push-Off:** The skeptical solution feels like giving up on normativity entirely.

  **LEAF 3: DEFLATIONARY**
  *   **Names:** Quine (sometimes), Davidson (sometimes).
  *   **Awkward Commitment:** Indeterminacy is just ordinary underdetermination of theory by evidence, nothing special about meaning.
  *   **Push-Off:** Fails to explain why meaning seems normative in a way physics is not.

  **LEAF 4: GLOBAL PERMUTATION**
  *   **Names:** Putnam, Lewis.
  *   **Awkward Commitment:** Indeterminacy survives even with every physical fact nailed down, without ontological relativity.
  *   **Push-Off:** Requires accepting model-theoretic semantics as exhaustive of meaning.

  **LEAF 5: UNOCCUPIED**
  *   **Diagnosis:** Incoherent. If logical form varies, you need a background language to make sense of the variation.
  *   **Label:** None.

  **LEAF 6: QUINE'S PACKAGE**
  *   **Names:** Quine.
  *   **Awkward Commitment:** Reference is inscrutable except relative to a manually chosen background language.
  *   **Push-Off:** Relativizing ontology to a language feels like changing the subject rather than solving the puzzle.

  **LEAF 7: INTERNALIST**
  *   **Names:** Chomsky, Fodor.
  *   **Awkward Commitment:** Meaning is fixed by innate or computationally characterized structure rather than by anything out in the environment.
  *   **Push-Off:** Struggles to explain how internal symbols hook onto external objects.

  **LEAF 8: DIRECT-REFERENCE**
  *   **Names:** Kripke, Putnam.
  *   **Awkward Commitment:** Meaning is fixed by causal-historical chains, not descriptive content.
  *   **Push-Off:** Cannot easily account for empty names or descriptive errors in reference fixing.

  **LEAF 9: TRIANGULATION**
  *   **Names:** Davidson, Burge.
  *   **Awkward Commitment:** Meaning is fixed by social interaction and shared responses to common causes.
  *   **Push-Off:** Requires a robust account of objectivity that some find circular.

  ---

  ### META-NOTES FOR DISCUSSION

  **1. Spectrum Node:**
  **Node 4 (Cost)** is really a spectrum. Some views hold that indeterminacy destroys folk psychology but saves scientific psychology. If you find yourself in the middle, you likely belong at **Leaf 3 (Deflationary)** or **Leaf 6 (Quine's Package)** depending on whether you think the damage is repairable.

  **2. Inseparable Leaves:**
  **Leaf 4 (Global Permutation)** and **Leaf 6 (Quine's Package)** are difficult to separate in practice. Both accept radical indeterminacy. The tree separates them via **Node 5 (Logical Form)** and **Node 6 (Background Language)**.
  *   *Extra Question to Separate:* "Does the indeterminacy require a manual-specific ontology, or just a permutation of objects within a fixed ontology?"
  *   *Why it matters:* Quine insists on ontological relativity (manual-specific ontology); Permutation arguments often assume a fixed domain with mapped objects.

  **3. Unoccupied Space:**
  **Leaf 1** and **Leaf 5** are empty. **Leaf 1** is empty because no one argues for asymmetry between home and foreign language regarding physical supervenience. **Leaf 5** is empty because asserting logical form variation without a background language renders the variation unintelligible.
