answer: |-
  # STANDARD OPERATING PROCEDURE: WEEKLY PROBABILITY UPDATE
  **Document ID:** FR-UPDATE-01  
  **Effective:** Immediate  
  **Owner:** Lead Forecaster  
  **Audience:** Forecasting Cell Analysts  

  ## 1. PURPOSE
  This procedure governs the weekly revision of the Joint Probability Distribution (the "Table") used for client risk decisions. Updates are driven by incoming reports. The goal is to incorporate new information while altering the Table no more than necessary (Minimum Information Principle).

  **Time Budget:** 15–20 minutes per update cycle.  
  **Authority:** All final revisions require Lead sign-off.

  ## 2. NOTATION
  *   **Cells ($C_i$):** The 8–12 mutually exclusive scenarios (e.g., *North-Port-48hr*).
  *   **Prior ($p_i$):** The probability of cell $i$ at the start of the week.
  *   **Posterior ($q_i$):** The revised probability of cell $i$.
  *   **Partition:** A grouping of cells that sums to 1 (e.g., *All Northern Routes*).
  *   **KL Divergence:** The measure of "distance" between Prior and Posterior. We minimize this to avoid overfitting.

  ---

  ## 3. THE PROCEDURE

  ### STEP 1: TRIAGE (Evidence vs. Assessment)
  **Decision Point:** Is the incoming report **Evidence** or an **Assessment**?

  *   **Channel A (Evidence):** A report from a source with a known reliability track record (e.g., "Sensor X triggered," "Source Y says Customs").
      *   *Action:* Proceed to **Step 2A**.
      *   *Warning:* Do not treat source reliability as a probability constraint. It generates likelihoods.
  *   **Channel B (Assessment):** A probabilistic judgment, marginal, or conditional constraint (e.g., "Chance of Customs is 40%," "If North, then 75% Depot").
      *   *Action:* Proceed to **Step 2B**.
      *   *Warning:* Do not use likelihood ratios here. This is a constraint on the final numbers.

  ### STEP 2A: PROCESSING EVIDENCE (Bayesian Update)
  *Use only for Channel A inputs.*
  1.  Assign Likelihoods ($L_i$): For each cell $C_i$, estimate the probability of seeing this report if $C_i$ were true.
      *   *Example:* If Source is 70% reliable and says "Customs," then $L_{Customs} = 0.7$, $L_{Not Customs} = 0.3$.
  2.  Calculate Unnormalized Posterior: $q_i^* = p_i \times L_i$.
  3.  Normalize: $q_i = q_i^* / \sum q_i^*$.
  4.  **Stop.** (Unless combined with Assessments, see Step 4).

  ### STEP 2B: PROCESSING ASSESSMENTS (Constraint Update)
  *Use only for Channel B inputs.*
  **Decision Point:** What type of assessment is this?

  *   **Type 1: Hard Fact.** ("It is definitely Customs.")
      *   *Action:* Set $q_i = 0$ for all non-Customs cells. Renormalize Customs cells to sum to 1 preserving their internal prior odds.
  *   **Type 2: New Marginal.** ("Probability of Customs is now 40%.")
      *   *Action:* **Jeffrey Conditioning.**
      *   *Rigidity Check:* You must verify that the new information *only* affects the marginal totals of the partition, not the internal odds of the cells within the partition.
      *   *Diagnostic:* Calculate prior odds between two cells inside the "Customs" partition. Calculate posterior odds. They **must** be identical. If they change, Jeffrey Conditioning is invalid. Switch to Type 3.
  *   **Type 3: Conditional or Linear Constraint.** ("If North, then 75% Depot" or "Port is twice as likely as Depot.")
      *   *Action:* **Minimum Cross-Entropy (MinCrossEnt).**
      *   *Operational Move:*
          1.  Rewrite input as a linear equation: $\sum a_i q_i = K$.
          2.  **Zero-Prior Stop:** If any cell $C_i$ required to have positive mass has $p_i = 0$, **HALT**. MinCrossEnt cannot create mass from zero. Escalate to Lead for re-elicitation.
          3.  **Solver Method:** Open the Update Spreadsheet.
              *   Target: Minimize $\sum q_i \ln(q_i / p_i)$.
              *   Constraint 1: $\sum q_i = 1$.
              *   Constraint 2: Your linear equation from (1).
              *   Run Solver.
          4.  **Hand-Workable Recipe (Single Constraint Only):**
              *   If the constraint isolates a subset of cells (e.g., "Within North..."), apply an **Exponential Tilt**.
              *   Multiply priors in the target subset by a factor $k$. Leave other cells untouched.
              *   Solve for $k$ such that the constraint holds. Renormalize.

  ### STEP 3: MULTIPLE INPUTS (Joint vs. Sequential)
  **Decision Point:** Did you receive multiple Assessments in one report?
  *   **Rule:** Apply constraints **Jointly**.
  *   **Reason:** Sequential application (updating on Constraint A, then updating the result on Constraint B) yields different results than satisfying A and B simultaneously unless the constraints are mathematically orthogonal.
  *   **Action:** Input all linear constraints into the Solver at once.
  *   **Unsatisfiable Stop:** If Solver returns "No Feasible Solution," the constraints contradict each other (e.g., $P(A) > 0.5$ and $P(A) < 0.4$). **HALT.** Escalate to Lead.

  ### STEP 4: VALIDATION & SIGN-OFF
  Before submission to Lead:
  1.  **Sum Check:** Do all $q_i$ sum to 1.0?
  2.  **Rigidity Diagnostic:** For any cell group *not* mentioned in the constraints, verify that $(q_i / q_j) = (p_i / p_j)$. If these relative odds shifted without cause, the update is wrong.
  3.  **Methodology Log:** Record which divergence rule was used (Default: KL Divergence).
      *   *Note:* Using KL Divergence is a methodological judgment. It preserves prior odds in unconstrained areas. An alternative (Euclidean Distance) would flatten the distribution more aggressively.
      *   *Action:* Tick box on Update Log: "KL Divergence Applied."

  ---

  # ANALYST CHECKLIST (PIN-UP VERSION)

  | **WEEKLY UPDATE CHECKLIST** | **GO / NO-GO** |
  | :--- | :--- |
  | **1. TRIAGE** | |
  | Is this Source Reliability (Evidence)? $\rightarrow$ Use Likelihoods (Step 2A). | $\square$ |
  | Is this a Probability Judgment (Assessment)? $\rightarrow$ Use Constraints (Step 2B). | $\square$ |
  | **2. ZERO-MASS CHECK** | |
  | Does the update require probability in a cell currently at 0%? | $\square$ **STOP IF YES** |
  | **3. METHOD SELECTION** | |
  | Hard Fact? $\rightarrow$ Set to 1, renormalize. | $\square$ |
  | New Marginal (Partition)? $\rightarrow$ Jeffrey Conditioning. **Check Rigidity.** | $\square$ |
  | Conditional / Ratio? $\rightarrow$ MinCrossEnt (Solver or Tilt). | $\square$ |
  | **4. COMBINATION** | |
  | Multiple constraints? $\rightarrow$ Enter **Jointly** in Solver. Do not sequence. | $\square$ |
  | Contradictory constraints? $\rightarrow$ **STOP IF UNSATISFIABLE.** | $\square$ |
  | **5. VALIDATION** | |
  | Do probabilities sum to 100%? | $\square$ |
  | Did "untouched" cells keep their relative prior odds? (Rigidity Diagnostic) | $\square$ |
  | **6. LOGGING** | |
  | Divergence Rule Recorded? (Default: KL / MinCrossEnt) | $\square$ |
  | **READY FOR LEAD SIGN-OFF** | $\square$ |

  ---

  # WORKED EXAMPLES

  ### Case 1: Calibration (The Judy Benjamin Scenario)
  **Setup:** Four cells. North-Port (NP), North-Depot (ND), South-Port (SP), South-Depot (SD).
  **Prior:** Uniform (0.25 each).
  **Report:** "If it is the Northern region, the chance it is the Depot rather than the Port is three in four."
  **Type:** Assessment (Conditional Constraint). $P(ND | North) = 0.75$.

  **Arithmetic (Hand-Workable Tilt):**
  1.  **Identify Constraint:** $P(ND | North) = \frac{q_{ND}}{q_{NP} + q_{ND}} = 0.75$. This implies $q_{ND} = 3 q_{NP}$.
  2.  **Rigidity Assumption:** The report says nothing about the South. MinCrossEnt dictates we leave the South untouched relative to itself, and we leave the *ratio* of North mass to South mass untouched unless forced otherwise.
      *   Actually, for a conditional constraint $P(A|B)=\alpha$, the MinCrossEnt solution preserves the distribution of $\neg B$ (South) exactly and scales $B$ (North) to satisfy the condition.
      *   South Total Prior = 0.5. South Total Posterior = 0.5.
      *   South Internal Odds: SP:SD was 1:1. Remains 1:1. So $q_{SP} = 0.25, q_{SD} = 0.25$.
  3.  **Solve North:** North Total must be 0.5.
      *   $q_{NP} + q_{ND} = 0.5$
      *   $q_{ND} = 3 q_{NP}$
      *   $4 q_{NP} = 0.5 \rightarrow q_{NP} = 0.125$.
      *   $q_{ND} = 0.375$.
  **Revised Table:** NP: 0.125, ND: 0.375, SP: 0.25, SD: 0.25.
  **Diagnostic:** Odds within South (SP/SD) remained 1:1. Odds within North shifted from 1:1 to 1:3. This signature confirms the rule was applied correctly.

  ### Case 2: The Impossible Cell (Zero Prior)
  **Setup:** Cell "Terrorist Strike" has prior $p = 0.00$ (deemed impossible in quarterly elicitation).
  **Report:** "Intelligence suggests a non-zero chance of Terrorist Strike."
  **Type:** Assessment requiring $q > 0$.

  **Procedure Action:**
  1.  **Zero-Prior Stop:** The MinCrossEnt formula $q_i \propto p_i \exp(\dots)$ yields 0 if $p_i = 0$. You cannot mathematically derive positive probability from absolute zero using this rule.
  2.  **Decision:** **HALT.**
  3.  **Escalation:** Lead must decide whether to (a) smooth the prior (assign a small $\epsilon$ to all zeros and renormalize) or (b) treat this as a trigger for a full quarterly re-elicitation.
  4.  **Risk:** Proceeding without Lead approval violates the model's absolute continuity assumption.

  ### Case 3: Mixed Evidence and Assessment
  **Setup:** Prior: Customs (0.5), No-Customs (0.5). Within Customs: 48hr (0.5), >48hr (0.5).
  **Report:**
  1.  Source A (70% reliable) says: "It is Customs."
  2.  Assessment B says: "If it is Customs, 60% chance it clears within 48 hours."

  **The Wrong Way (Naive Constraints):**
  Treating Source A as a constraint ($P(Customs) = 0.7$) and Assessment B as a constraint ($P(48hr | Customs) = 0.6$).
  *   Result: You ignore the prior structure and simply force the numbers to match. You lose the "weight" of the prior.

  **The Right Way (Channeling):**
  1.  **Channel Source A (Evidence):**
      *   Likelihoods: $L(Customs) = 0.7$, $L(NoCustoms) = 0.3$.
      *   Update Prior:
          *   $q^*(C) = 0.5 \times 0.7 = 0.35$
          *   $q^*(NC) = 0.5 \times 0.3 = 0.15$
          *   Normalize (Sum=0.5): $P_{interim}(C) = 0.7$, $P_{interim}(NC) = 0.3$.
      *   *Note:* In this specific numeric case, the likelihood ratio matches the constraint value, but the *process* differs.
  2.  **Channel Assessment B (Constraint):**
      *   Apply MinCrossEnt to the *Interim* distribution.
      *   Constraint: $P(48hr | Customs) = 0.6$.
      *   Keep "No-Customs" cells untouched.
      *   Adjust "Customs" cells: $P(48hr \cap C) = 0.7 \times 0.6 = 0.42$. $P(>48hr \cap C) = 0.7 \times 0.4 = 0.28$.
  **Final Table:** C-48 (0.42), C->48 (0.28), NC-48 (0.15), NC->48 (0.15).

  **Rigidity Assumption & Test:**
  *   **Assumption:** The conditional assessment ("If Customs...") does not provide information about the "No-Customs" branch.
  *   **Test:** Check the odds of the No-Customs cells. In the Prior, they were 1:1. In the Final, they are 0.15:0.15 (1:1). If the Source A report had implied something about clearance times generally, this rigidity would fail, and we would need a joint constraint on the whole table.

  ---

  # LIMITATIONS: WHAT THIS PROCEDURE CANNOT DO

  **1. It Cannot Create Possibility from Impossibility.**
  As shown in Case 2, if the quarterly elicitation assigns 0% to a scenario, this weekly update machinery cannot assign it >0%. This is a feature of the KL-divergence rule (absolute continuity), not a bug. It prevents noise from generating phantom risks, but it requires a manual override (re-elicitation) to correct genuine blind spots.

  **2. It Cannot Resolve Contradictions.**
  If Source A says "Probability is 80%" and Source B says "Probability is 20%," the Solver will return "Infeasible." This procedure does not weigh source credibility against each other; it assumes the Lead has already reconciled conflicting reports before they reach the analysts.

  **3. It Assumes "Rigidity" Holds.**
  The MinCrossEnt and Jeffrey rules assume that information about one part of the table does not subtly shift the odds in unrelated parts. In complex freight networks, a delay in Shanghai might psychologically increase the perceived risk of a delay in Rotterdam, even if logically unconnected. This procedure forces analysts to ignore those correlations unless explicitly modeled as constraints.

  **4. It Is Not a Truth Machine.**
  Minimizing KL Divergence finds the distribution *closest* to the prior that satisfies the constraints. It does not find the *true* distribution. If the prior was wildly wrong, the posterior will be conservatively wrong. This is why the quarterly re-elicitation is the anchor; this procedure is merely the drift correction.
