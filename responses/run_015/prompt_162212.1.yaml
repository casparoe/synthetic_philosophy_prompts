      *   *Fix:* Ensure the procedure says "HALT" and escalates to the Lead (User).
      *   *Critique:* Case 3 arithmetic.
      *   *Fix:* Need to be careful. Source says "It is Customs" (70% reliable). This is $P(Report|Customs) = 0.7, P(Report|\neg Customs) = 0.3$. Update priors first. Then apply conditional constraint on the *new* priors.
      *   *Wait, one nuance:* The prompt asks to show what the table looks like if *both are naively imposed as constraints*. I need to show the Wrong Way vs. the Right Way.
      *   *Rigidity:* The rigidity assumption in Judy Benjamin is that odds *not* mentioned stay fixed. In Case 1, South stays fixed.

  9.  **Final Polish:** Check against the prompt's specific list of "explicit decision points and explicit stops."
      *   Unsatisfiable constraints? (Included)
