  # Taxonomy of Occasionalism and Interventionist Causation

  **Instructions:** Navigate the decision tree below by answering each question based on the metaphysical commitments of the position you are analyzing. Do not look ahead to the position names; simply follow the logical implications of your answers.

  ### **Node 1: Divine Causality**
  **Is God the sole efficient cause of all events in the natural world?**
  *   **No:** (God acts alongside or through created causes) → Go to **Node 2A**.
  *   **Yes:** (God acts alone; created things are merely occasions) → Go to **Node 2B**.

  ---

  ### **Node 2A: Secondary Causality (Naturalist Path)**
  **Do created secondary causes (e.g., fire, medicine) possess ontological reality independent of God's immediate action?**
  *   **Yes:** (They are real substances with powers) → Go to **Node 3A**.
  *   **No:** (They are illusions) → *Diagnosis: Incoherent with Node 1 "No". If God is not the sole cause, something else must be real. Assume "Yes" for logical consistency.* → Go to **Node 3A**.

  ### **Node 2B: Secondary Causality (Occasionalist Path)**
  **Do created secondary causes (e.g., fire, medicine) possess ontological reality independent of God's immediate action, or are they purely epistemic conveniences?**
  *   **Ontological Reality:** (They exist as substances/occasions, though not as efficient causes) → Go to **Node 3B**.
  *   **Purely Epistemic Conveniences:** (They are only concepts summarizing divine habits) → Go to **Node 3C**.

  ---

  ### **Node 3A: Interventionism (Naturalist Path)**
  **Do interventionist counterfactuals ("if we intervene on X, Y changes") track real dependencies among created things?**
  *   **Yes:** → **Leaf 1**.
  *   **No:** → *Diagnosis: Incoherent. If causes are real and God is not sole cause, dependencies must be real.* → **Leaf 1**.

  ### **Node 3B: Interventionism (Ontological Occasionalism)**
  **Do interventionist counterfactuals track real dependencies among created things, or do they merely describe stable regularities in divine action?**
  *   **Track Real Dependencies:** → **Leaf 5**.
  *   **Describe Stable Regularities:** → **Leaf 3**.

  ### **Node 3C: Interventionism (Epistemic Occasionalism)**
  **Do interventionist counterfactuals track real dependencies among created things, or do they merely describe stable regularities in divine action?**
  *   **Track Real Dependencies:** → **Leaf 4**.
  *   **Describe Stable Regularities:** → **Leaf 2**.

  ---

  ### **Leaves: Positions and Commitments**

  **Leaf 1: Naturalist Secondary Causation**
  *   **Position:** Standard scientific realism where created things possess genuine causal powers independent of direct divine intervention.
  *   **Awkward Commitment:** Must deny that God is the sole efficient cause, potentially limiting divine sovereignty over specific natural events.
  *   **Status:** Viable.

  **Leaf 2: Hard Occasionalism**
  *   **Position:** God is the sole cause; secondary causes are merely epistemic tools; scientific counterfactuals describe only God's habitual actions.
  *   **Awkward Commitment:** Must accept that scientific explanations describe divine psychology (habits) rather than physical mechanisms.
  *   **Status:** Viable (Classic Ghazālī).

  **Leaf 3: Soft Occasionalism**
  *   **Position:** God is the sole cause; secondary causes have ontological reality as occasions; scientific counterfactuals describe stable divine regularities attached to these occasions.
  *   **Awkward Commitment:** Must explain why ontologically real entities possess no causal power despite having stable properties.
  *   **Status:** Viable (Moderate Ash'arī).

  **Leaf 4: Interventionist-Reconstructed Occasionalism**
  *   **Position:** God is the sole cause; secondary causes are epistemic conveniences; yet scientific counterfactuals track "real" dependencies.
  *   **Awkward Commitment:** Must explain how dependencies can be "real" if the relata (secondary causes) are merely epistemic conveniences.
  *   **Status:** **Unoccupied/Incoherent** (Logical tension between epistemic ontology and real dependency).

  **Leaf 5: Collapsed Occasionalism**
  *   **Position:** God is the sole cause; secondary causes are ontologically real; scientific counterfactuals track real dependencies among them.
  *   **Awkward Commitment:** Must maintain the verbal distinction of "God as sole cause" while functioning identically to naturalism in all scientific practices.
  *   **Status:** **Indistinguishable from Leaf 1** (Functionally identical to Naturalist Secondary Causation).

  ---

  ### **Diagnosis of Logical Gaps**

  1.  **Unoccupied Combination:** **Leaf 4** represents a combination no philosopher occupies.
      *   *Diagnosis:* **Incoherent.** It is logically unstable to claim secondary causes are *only* epistemic conveniences (Node 2B) while simultaneously claiming interventionist counterfactuals track *real dependencies* among them (Node 3C). Real dependencies require ontological grounding.
  2.  **Indistinguishable Pair:** **Leaf 1 and Leaf 5** cannot be genuinely distinguished by scientific practice.
      *   *Diagnosis:* **Unattractive/Verbal.** If secondary causes are ontologically real and support real dependencies (Leaf 5), the claim that God is the "sole efficient cause" becomes a metaphysical label with no empirical or explanatory difference from Leaf 1.

  \answer{5, 1, Leaf 1 and Leaf 5}
