  The punchline exploits the epistemic availability of the avoided outcome, showing that blame tracks the vividness of the counterfactual rather than the actual result. The joke will fall flat if students interpret it as a comment on media scrutiny alone, mistaking the dashcam for circumstantial luck rather than a tool that renders the counterfactual salient.
