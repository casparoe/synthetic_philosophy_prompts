  ### 1. Evaluation of Candidate Rules

  **Popperian Falsifiability**
  *   **The Rule:** A theory is scientific only if it makes risky predictions that could logically prove it false.
  *   **Fit with Advisor:** **Poor.** Strict Popperians typically classify Freudian psychoanalysis and Marxist historiography as pseudoscience because their core tenets are often insulated from falsification (e.g., any dream can be interpreted to fit the theory). Your advisor explicitly classifies both as *science*. Conversely, Phrenology made falsifiable claims that were proven false; a Popperian might call it "falsified science," whereas your advisor calls it "not science," implying the issue wasn't just failure, but the nature of the program.
  *   **Prediction for Typogenetics:** **Not Science.** The claim that it predicts "true but unprovable statements" borders on the unfalsifiable, and predictions testable only over "decades" weakens the immediacy of risk.

  **Mechanistic Empiricism**
  *   **The Rule:** Science requires direct empirical access to the causal mechanisms claimed (e.g., seeing the neuron fire, measuring the gas).
  *   **Fit with Advisor:** **Moderate.** This explains the rejection of String Theory (no empirical access) and ID (no natural mechanism). It fits the acceptance of fMRI and Climate Attribution. However, it struggles with Buss-style evolutionary psychology (historical mechanisms are inferred, not directly observed) and fails completely on Freud/Marx, which posit theoretical structures (id/ego, class struggle) that are not directly mechanistically observable in the way a cortical thickness map is.
  *   **Prediction for Typogenetics:** **Not Science.** A "DNA-Gödel isomorphism" is likely a mathematical metaphor rather than a physical mechanism with direct empirical access.

  **Lakatosian Research Programs**
  *   **The Rule:** Science is a "research program" with a "hard core" of assumptions protected by a "protective belt" of auxiliary hypotheses. It is scientific if it is *progressive* (predicts novel facts) rather than *degenerating* (only accommodating past data with ad-hoc fixes).
  *   **Fit with Advisor:** **Best Fit.** This is the only framework that comfortably accommodates Freud and Marx as *science*. Lakatos viewed these as valid research programs that were historically progressive (they generated new questions and heuristics) even if they are contested today. It explains the rejection of Phrenology (a degenerating program that couldn't handle anomalies) and String Theory (currently degenerating/pre-empirical with no novel predictions). It explains the acceptance of Buss and Climate work (progressive, novel predictions).
  *   **Prediction for Typogenetics:** **Science.**

  ### 2. Prediction for Typogenetic Epistemology

  **Verdict:** Your advisor will likely classify this as **Science.**

  **Reasoning:**
  Under the Lakatosian rule, the critical factor is whether the framework is generating a "positive heuristic"—does it open new lines of inquiry?
  1.  **Empirical Hook:** Unlike String Theory (which she rejected), Typogenetics claims "three retrospective hits on citation-network patterns." This provides the empirical engagement String Theory lacks.
  2.  **Progressive Potential:** The claim that it predicts dynamics over decades suggests a long-term research program rather than a static claim. As long as it is generating new research questions (mapping citation networks, modeling self-reference), it counts as progressive.
  3.  **Naturalism:** Unlike ID or Parapsychology, it does not invoke supernatural agents; it stays within a naturalistic (albeit abstract) framework.

  The "true but unprovable" claim is risky, but if framed as a structural limit of the theory (like Gödel's incompleteness) rather than an escape from testing, she will likely view it as a sophisticated "hard core" rather than pseudoscientific shielding.

  ### 3. The Hypothetical Splitter Case

  To definitively distinguish these three rules, you would need a case where they yield different verdicts.

  **The Case:** **Late-Stage Bloodletting (circa 1850).**
  By the mid-19th century, statistical methods (like those of Pierre Louis) were showing bloodletting didn't work, yet proponents continued to use it with modified justifications.

  *   **Popperian Verdict:** **Science.** The underlying theory (humoral imbalance) was falsifiable. The fact that it was *falsified* doesn't make it pseudoscience; it makes it false science.
  *   **Mechanistic Verdict:** **Science.** The mechanism (removing excess fluid to restore balance) was physically intelligible and accessible, even if physiologically incorrect.
  *   **Lakatosian Verdict:** **Not Science (Pseudoscience).** By 1850, the program was *degenerating*. It was no longer predicting novel facts; it was using ad-hoc hypotheses to explain away failures (e.g., "the patient didn't bleed enough" or "the disease was too advanced").

  **Why this splits them:** Popper and Mechanistic rules struggle to condemn a theory that is testable and mechanistic but simply *wrong/stalled*. Lakatos specifically targets the *dynamics* of the research program, allowing you to classify something as pseudoscience because it has stopped producing new knowledge, which aligns best with your advisor's rejection of Phrenology and String Theory.
