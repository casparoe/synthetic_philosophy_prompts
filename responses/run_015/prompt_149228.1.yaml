answer: |-
  Here is the disambiguation of the slogan, broken down by claim, with verdicts on their logical and empirical status.

  ### The Menu

  **1. Claim: "Culture evolves like biology."**
  *   **Verdict:** **Analogical Heuristic (bordering on Tautology).**
  *   **Analysis:** If you define evolution abstractly as "change in the frequency of variants over time due to differential retention," then yes, culture evolves. This is almost tautological: if ideas spread and disappear, their frequencies change. However, as a mechanistic claim, it is weak. Biological evolution relies on blind variation and selective retention of genetic code. Cultural evolution involves directed variation (people invent things on purpose) and selective retention based on complex psychology. The analogy holds at the highest level of abstraction but breaks down when you look at the engine room.

  **2. Claim: "It's Lamarckian."**
  *   **Verdict:** **Empirically Defensible.**
  *   **Analysis:** In biology, an acquired trait (like a scar or a muscle) isn't written back into the germline DNA to be inherited. In culture, acquired traits are *only* what gets inherited. You learn a skill, modify it, and teach the modified version. This is the definition of Lamarckian inheritance. This claim holds up well across almost all cultural domains, from software code to folk songs. It is the strongest part of the slogan.

  **3. Claim: "It's Horizontal."**
  *   **Verdict:** **Empirically Defensible (Context-Dependent).**
  *   **Analysis:** Biological transmission is overwhelmingly vertical (parent to offspring). Cultural transmission is heavily horizontal (peer to peer) and oblique (teacher to student). However, this varies by domain. Viral dances are purely horizontal. Legal norms and religious doctrines often strive for vertical fidelity (master to apprentice, precedent to ruling). Calling culture universally horizontal ignores institutions designed specifically to enforce vertical transmission.

  **4. Claim: "It has no clear unit of selection."**
  *   **Verdict:** **Collapses Under Scrutiny / Contextually False.**
  *   **Analysis:** This claim relies on a strawman of biology. Biologists still debate whether the unit of selection is the gene, the organism, or the group. So, claiming culture lacks a unit because biology *has* one is false; biology doesn't have a settled one either.
      *   **Where it fails:** In legal norms, the unit is clear (the statute, the clause, the precedent).
      *   **Where it holds:** In viral dances or slang, the unit is fuzzy (is the unit the song, the dance move, or the hashtag?).
      *   **Verdict:** It is not that culture *lacks* units, but that the units are often fungible and poorly bounded compared to DNA base pairs.

  ***

  ### The Algorithmic Move

  **The Argument:** "We shouldn't stress about algorithmic recommendations because it's only evolutionary pressure on ideas."

  **Verdict:** **Argumentatively Inert (Naturalistic Fallacy).**

  **Analysis:**
  When someone deploys the slogan to dismiss algorithmic concerns, they are invoking a specific precisification: **Evolution implies Optimality.**

  1.  **The Hidden Premise:** They are assuming that "evolutionary pressure" leads to good, stable, or desirable outcomes. In biology, evolution leads to fitness relative to an environment, not truth, morality, or human well-being. A virus evolves perfectly well while killing the host.
  2.  **The Work It Does:** It functions as a conversation stopper. It reframes a normative problem (should we allow algorithms to radicalize users?) as a descriptive inevitability (this is just how ideas spread). It strips human agency from the loop.
  3.  **Why It Fails:** Algorithms are not a blind environment; they are engineered selection pressures. Saying algorithmic distortion is "just evolution" is like saying a rigged casino is "just probability." The selection pressure is artificial and targeted, not natural.
  4.  **Edginess vs. Substance:** This reading does no argumentative work. It sounds scientific ("evolutionary pressure") to lend weight to a claim that is actually philosophical. It conflates *is* with *ought*. Just because cultural items *are* being selected doesn't mean we *ought* to accept the winners.

  **Summary:** The slogan is a useful map for how ideas spread (Lamarckian/Horizontal), but a terrible compass for how we should manage them. Using it to dismiss algorithmic harm is a category error that mistakes a description of mechanism for a justification of outcomes.
