  ### The Three Candidate Rules

  **1. The Phenomenal Rule (Consciousness)**
  *   **Definition:** Downward causation (symbols shoving goo) only occurs when there is "someone home." Subjective experience is the necessary medium for symbolic causation. Without qualia, symbols are just epiphenomenal bookkeeping.
  *   **Fit to Track Record:** Perfect. Machines (no consciousness) = No. Humans (conscious) = Yes.
  *   **Prediction for Router:** **No.** (Stipulated as non-conscious).

  **2. The Structural Rule (Tangled Hierarchy)**
  *   **Definition:** Downward causation emerges from the *geometry* of the information flow. When a system creates a model of itself that loops back to influence the system (a "strange loop"), the symbols gain causal efficacy. Consciousness is a byproduct, not a prerequisite.
