      *   **3. "The winner of the 2040 US presidential election is currently in primary school."**
          *   Issue: Future contingent / no unique satisfier *yet*.
          *   Russell: At the time of utterance (2024), does "the winner" denote? No.
          *   So, strictly speaking, "There exists a unique winner of 2040..." is false *now*.
          *   So the sentence is False (on secondary occurrence/standard reading).
          *   However, we often speak *as if* there will be one. Russell might analyze this as a modal claim or predict that the description *will* denote. But strictly, qua definite description *now*, it fails.
