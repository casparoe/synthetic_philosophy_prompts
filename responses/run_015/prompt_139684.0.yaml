      *(One last check on the Pilot)*: Sanctioned claimants left faster. 50% jobs, 50% no earnings. Hardship rose. This suggests sanctions act as a deterrent/exit mechanism, not purely an employment tool. This supports the Reciprocity view (we stop paying those who don't comply) but undermines the humanitarian/sustainability aspect.

