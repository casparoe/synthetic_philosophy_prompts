  Aristotle would likely condemn the app's leverage and trading features as unnatural wealth acquisition akin to moneylending, even if he viewed the underlying rental income as legitimate.

  Aristotle distinguishes between *oikonomia* (household management), which acquires wealth for the good life and has natural limits, and *chrematistics* (wealth acquisition), which seeks unlimited profit and is unnatural. He explicitly lists renting out property as a natural form of wealth getting, similar to farming or herding, because it stems from the useful yield of the land and structures themselves. You are correct that he would not object to the rent itself, as it is a return on a real asset rather than money breeding money.

  However, the app's structure pushes the activity into unnatural *chrematistics*. The ability to sell your slice instantly transforms the property from a useful asset into a speculative commodity, prioritizing exchange value over use value. More critically, the borrow-to-buy-more feature embodies the unlimited accumulation Aristotle despised; using debt (likely involving interest, which he called usury) to amplify wealth generation treats money as a breeding stock rather than a medium of exchange. By detaching the owner from the household management of the property and encouraging infinite leverage, the app facilitates the exact kind of barren, endless profit-seeking he categorized alongside moneylending.
