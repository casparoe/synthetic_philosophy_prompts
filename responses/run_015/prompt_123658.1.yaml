answer: |-
  Dear Colleague,

  I am writing to propose a thought experiment designed to reverse the familiar Knobe-effect asymmetry in attributions of intentional action by leveraging institutional roles rather than moral framing. Consider two senior actuaries at a municipal pension fund, Elena and Marcus, who each review a proposed adjustment to the contribution schedule during a fiscal shortfall. Elena implements a mandatory reduction in beneficiary payouts to prevent fund insolvency, a move required by state statute whenever the funding ratio drops below eighty percent, and although she explicitly notes in her log that she regrets the necessity, her colleagues subsequently describe the reduction as an unavoidable outcome of the statute rather than an intentional act of hers. Marcus implements a discretionary bonus adjustment that increases beneficiary payouts to stimulate local spending, a move permitted but not required by the same statute whenever the funding ratio exceeds eighty percent, and because he actively files a personal memorandum citing the economic stimulus as his primary motivation for invoking the clause, his colleagues subsequently describe the increase as an intentional achievement driven by his personal initiative.

  A normative-account theorist, who takes intentionality attribution to be mediated by normative assessment of outcomes and by the agent's personal involvement, would argue that the usual link between harm and intentionality is broken here because the normative status of the agents' obligations overrides the normative valence of the side effects. In Elena's case, the harm is normatively neutralized by the mandate; she is not blameworthy because she acted as a conduit for the law, and her expressed regret signals a lack of personal endorsement of the harm, thereby shielding her from the blame that typically drives intentionality ascriptions in harm cases. In Marcus's case, the help is normatively amplified by his discretion; he is praiseworthy because he went beyond the minimum requirement, and his memorandum signals strong personal involvement, inviting the praise that typically drives intentionality ascriptions in cases where agents exceed expectations. The reversal occurs because the institutional context shifts the locus of normative assessment from the outcome itself to the agent's relationship with the rule governing the outcome.

  A mental-state-account theorist, who takes intentionality to depend solely on the agent's beliefs, desires, and direct behavioral control, would likely argue that their view predicts the asymmetry observed rather than uniformity, though not necessarily the reversal of the standard Knobe pattern unless desire is weighted heavily. Since Elena lacks a desire for the harm and views her control as constrained by statute, the mental-state account predicts she did not act intentionally, whereas Marcus possesses a desire for the help and exercises unconflicted control, predicting he acted intentionally. However, if the mental-state theorist insists that both agents knew the outcomes were certain and had physical control to veto the process (even at personal cost), they might predict uniformity or the standard asymmetry where harm is intentional due to the gravity of the outcome influencing the ascription of desire, but they would struggle to explain why the mandatory nature of Elena's action suppresses the intentionality judgment despite her knowledge and causal role.

  The precise feature driving the reversal is role-mandated neutrality, which functions to decouple the agent's personal agency from the institutional outcome in the harm case while coupling them in the help case. If this feature is removed while all other details are held constant, such that both agents face discretionary choices with identical mental states of indifference, the judgments would revert to the standard Knobe asymmetry where the harmful side effect is judged intentional and the beneficial one is not, because the moral valence of the outcome would once again become the primary heuristic for observers. A defender of the normative account might attack this case as illegitimate or as an artifact of framing by arguing that introducing a statutory mandate simply introduces coercion, and that attributing unintentionality to coerced harm is trivial and does not constitute a genuine reversal of the Knobe effect, which relies on free actions with foreseen side effects. They would claim that by making Elena's action mandatory, I have removed the very condition of agency required for the Knobe effect to operate, rendering the comparison with Marcus's discretionary action structurally invalid.

  I would abandon the claim that role-mandated neutrality is genuinely responsible for the reversal if empirical observation showed that actual human judges still attribute intentionality to Elena despite the statutory mandate, suggesting that the harm bias is robust enough to override institutional coercion, or if a theoretical distinction between personal and institutional agency demonstrated that institutional acts are never judged as intentional in the personal sense regardless of the outcome, which would imply the reversal is merely a category error rather than a shift in moral psychology.

  Best regards,

  A. Researcher
