      *   *Activity vs. Function:* A protein might bind a substrate (activity) but fail the pathway (malfunction). SE uses history to fix this. Synthetic biology uses *system integration* (current causal role) to fix this. If SE relies on system integration to define the function of a new protein, it's using Causal Role criteria.
