answer: |-
  The etiological account of biological function, often termed the Selected Effects (SE) theory, posits that the function of a trait is the effect for which it was historically selected. On this view, a heart functions to pump blood because ancestral hearts pumped blood, and this capacity causally explains the proliferation of heart-traits in the lineage. This backward-looking historical constraint is the theory's defining conceptual feature. However, the rise of synthetic biology, specifically the creation of *de novo* engineered proteins, presents not merely a boundary case but a structural limitation for the SE account.

  I argue that the SE account cannot consistently assign functions to *de novo* proteins without collapsing into a causal-role framework. When an etiological theorist attempts to salvage the account by appealing to the designer's intentions or artificial selection protocols as a proxy for evolutionary history, they inadvertently shift the explanatory burden from historical retention to current systemic contribution. This collapse is revealed when we examine how synthetic biologists distinguish between a protein's biochemical activity and its intended functional role.

  ### The Structural Limitation of Etiological Accounts

  To establish the structural limitation, we must distinguish between the conceptual requirements of the SE theory and the empirical reality of protein engineering.

  **[Conceptual Premise 1]:** The SE account defines function strictly via a history of differential reproduction/retention where the specific effect in question explains the trait's presence.
  **[Empirical Premise 1]:** *De novo* engineered proteins are generated via rational design or immediate artificial screening; they lack a natural lineage of differential reproduction where the specific engineered effect explains their ancestry.

  Under strict SE criteria, a *de novo* protein has no function because it has no selected history. It exists because a designer instantiated it, not because an ancestor performed a task and replicated. To avoid rendering all synthetic biology "dysfunctional," the etiological theorist must extend the account. The most robust extension is to claim that the design process itself constitutes a selection history.

  ### The Collapse into Causal-Role Criteria

  The etiological theorist argues: "The designer's intention, coupled with the build-test-learn cycle, creates an artificial selection history. The protein's function is what it was selected *for* by the engineer."

  This move fails because it inverts the direction of explanation inherent to etiology. In natural selection, the history is independent of the current system's needs; the history *determines* the function. In synthetic design, the "selection" is entirely subordinate to the desired current capacity of the pathway.

  **[Conceptual Premise 2]:** In a causal-role (Cummins-style) account, a function is the contribution a component makes to the capacity of a containing system.
  **[Empirical Premise 2]:** In synthetic protein design, selection criteria are derived exclusively from the desired capacity of the engineered pathway (e.g., "produce artemisinin"), not from an independent lineage history.

  If the engineer selects a protein variant because it stabilizes a metabolic pathway, the "selection history" is merely a record of the engineer verifying the protein's current causal role. The explanation for why the protein is there is not "because its ancestors did this," but "because doing this sustains the pathway now." By appealing to the designer's intention as the source of the "selection," the theorist is actually appealing to the *forward-looking* goal of the system. The "history" is epiphenomenal; the work is being done by the fit between the protein's activity and the system's requirements. Thus, the account becomes a causal-role framework disguised by the metaphor of "designer selection."

  ### Addressing the Strongest Reply: The Analogy of Directed Evolution

  The strongest reply available to the etiological theorist is to lean on **directed evolution**. Here, engineers do not merely design rationally; they generate libraries of variants and select those that perform a task over multiple rounds.

  **[The Reply]:** "Directed evolution is genuinely analogical to natural selection. Variants reproduce, mutate, and are retained based on performance. Therefore, SE theory applies without alteration: the function is what the protein was selected for in the lab."

  This reply appears robust because it satisfies the mechanical requirements of selection (variation, heredity, differential fitness). However, the analogy breaks down at the precise point where we must distinguish between a protein's **biochemical activity** and its **engineered functional role**.

  In natural etiology, history distinguishes function from mere capacity. A heart has the capacity to make a 'thump' sound, but its function is to pump blood, because pumping (not sounding) explains its retention. History filters the capacities.

  In synthetic systems, the "history" of directed evolution is too shallow to perform this filtering independently of the system's current goals. Consider a *de novo* enzyme engineered to bind Substrate A. Through promiscuity, it also binds Substrate B.
  1.  **Scenario 1:** The engineer selects for binding A to complete Pathway X.
  2.  **Scenario 2:** The engineer selects for binding A, but in the final assembly, the protein is placed in Pathway Y where binding B is the useful contribution.

  If we rely on the "directed evolution history," the function is binding A (that was the selection criterion). But if the protein is successfully deployed in Pathway Y utilizing activity B, synthetic biologists attribute the function to the contribution in Pathway Y.

  **[Empirical Premise 3]:** Synthetic biologists routinely repurpose engineered components; the functional attribution follows the component's integration into a working pathway, not necessarily the specific criterion of its initial selection round.

  Here, the etiological account faces a dilemma.
  *   **Horn 1:** Stick to the selection history (Binding A). This contradicts actual practice where the function is identified by the current pathway contribution (Binding B).
  *   **Horn 2:** Accept the pathway contribution (Binding B) as the function. To do this, the theorist must appeal to the protein's current causal contribution to the system's capacity.

  If the theorist takes Horn 2, they have abandoned the etiological constraint. They are no longer looking at *why the variant was retained in the past* (the selection round), but *what the variant does for the system now*.

  ### Smuggling in Causal-Role Criteria

  The breakdown occurs because the "designer selection" analogy lacks the temporal depth to decouple activity from function. In nature, millions of years of history allow us to say, "This trait persists *because* of effect F," distinguishing F from incidental effects G. In synthetic biology, the "history" is a few weeks of screening explicitly targeted at a specific outcome.

  To distinguish the "true function" of a *de novo* protein from its "side activities," the etiological theorist cannot rely on the short artificial history, because that history was rigged to test for a specific causal role. Therefore, to determine if the protein is *functioning* (vs. merely acting), the theorist must check if the protein is successfully contributing to the engineered pathway's goal.

  **[Conceptual Premise 3]:** If the criterion for functional attribution is the successful contribution to a containing system's capacity, the account is a causal-role account.

  Since the "designer selection" move ultimately relies on verifying that the protein contributes to the designer's intended pathway capacity to validate the function, it satisfies Conceptual Premise 3. The "selection" label is ornamental. The explanatory work is done by the match between the protein's biochemical properties and the pathway's needs.

  ### Conclusion

  The failure of the etiological account in synthetic biology is not a matter of missing data; it is a structural incompatibility. The SE theory requires a history that is independent of the current system's normative goals to ground function. Synthetic biology, by definition, creates traits *dependent* on current normative goals (design specifications).

  When the etiological theorist appeals to designer intention or directed evolution, they attempt to simulate independence. However, because the "selection" is governed by the desired causal role of the final system, the history cannot serve as an independent arbiter of function. It merely records the verification of a causal role. Consequently, attempting to apply etiological theory to *de novo* proteins forces the theorist to use causal-role criteria to distinguish function from activity, collapsing the account into the very framework it seeks to replace. The limitation is structural: you cannot derive a backward-looking function from a forward-looking design process without losing the "etiological" essence.
