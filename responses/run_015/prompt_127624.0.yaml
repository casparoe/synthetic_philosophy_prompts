  2.  **Define the Key Terms (Mental Sandbox):**

      *   *Etiological Account (Selected Effects):* Function $F$ of trait $T$ exists because $T$ was selected for doing $F$ in the past. (Millikan, Neander).
      *   *Causal-Role Account:* Function $F$ of trait $T$ is the causal contribution $T$ makes to a containing system's capacity. (Cummins).
      *   *De Novo Engineered Proteins:* Proteins designed from scratch or significantly altered, not descended from a lineage selected for that specific task in nature.
      *   *Synthetic Biology Practice:* Design-build-test cycles, rational design, directed evolution (sometimes), pathway integration.

  3.  **Outline the Argument:**

      *   **Introduction:** State the etiological view and the challenge posed by synthetic biology (*de novo* proteins). State the thesis: it's a structural collapse, not a gap.
      *   **Premise 1 (Conceptual):** The etiological account requires a history of differential reproduction/retention based on the effect.
      *   **Premise 2 (Empirical/Practice):** *De novo* proteins lack this natural history. They are created via rational design or immediate artificial selection.
      *   **The "Designer Intent" Move:** Etiological theorists might say the designer's intent + artificial selection counts as the "history."
      *   **The Collapse Argument:**
          *   If we rely on intent, we aren't relying on *selection* in the etiological sense (blind retention), but on *forward-looking* goals.
