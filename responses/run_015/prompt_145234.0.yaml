answer: |-
  **Examination Question**

  Consider two urban planners who enter a joint commitment to design a "resilient neighborhood." They delegate all technical specifications to a shared contracting team and never review the detailed outputs together. Unbeknownst to both, one planner operates with an implicit definition of resilience that is strictly ecological, while the other operates with a definition that is strictly economic. Consequently, their individual sub-plans are incompatible, though the delegation mechanism prevents this divergence from surfacing. Neither ever becomes aware of the incompatibility.

  Determine whether this scenario constitutes genuine joint action. You must test the case against Bratman's conditions of mutual responsiveness and commitment to shared cooperative activity, Gilbert's account of joint commitment and plural subjecthood, and Searle's distinction between we-intentions and I-intentions that contain representations of others. Do not merely summarize these frameworks. Instead, identify the precise conceptual point at which the hidden divergence either undermines or fails to undermine the conditions for jointness. Your analysis must reach a reasoned judgment about whether joint action survives this opacity. Do not include bibliographic citations or reading lists.

  ***

  **Model Answer**

  The scenario presents a case of accidental coordination rather than genuine joint action. While the planners exhibit surface-level cooperation, the hidden divergence in sub-plans undermines the intentional architecture required by all three frameworks. The precise point of failure lies in the counterfactual fragility of their coordination: had the opacity been lifted, the joint activity would collapse, revealing that the necessary interlocking intentions were never actually present.

  Under Bratman's framework, joint action requires that sub-plans mesh and that agents are mutually responsive to each other's intentions. Here, the sub-plans do not mesh; one aims for ecological outcomes, the other for economic ones. The delegation to a contracting team creates an illusion of compatibility, but mutual responsiveness is absent because neither planner is adjusting their behavior in response to the other's actual intentions. They are responding to a shared label, not a shared plan. Bratman requires that the commitment to shared cooperative activity be robust against known divergence. Since this divergence is hidden only by ignorance, not resolved by negotiation, the condition of mutual responsiveness fails. The planners are not guiding each other's actions; they are parallel processing under a misapprehension. Furthermore, the commitment to mutual support is void because neither would support the other's actual goal if known.

  Gilbert's account focuses on the joint commitment that creates a plural subject. The critical question is the object of that commitment. Did they commit to the phrase "resilient neighborhood" or the concept it signifies? If the commitment is to the concept, the divergence is fatal because there is no single concept to which both are committed. A plural subject requires a unified stance. If one stands for ecology and the other for economy, they are not one body politic regarding this project. They are two individuals coincidentally contributing to a single output. The opacity prevents the dissolution of the plural subject, but it does not validate its existence. The commitment is defective because the parties do not understand what they are committing to in the same way. Without common knowledge of the commitment's content, the normative obligations inherent in Gilbert's view cannot properly bind them to each other, only to the abstract label.

  Searle's distinction hinges on the content of the intention. A we-intention requires that I intend that we perform an action, which includes representing your contribution as part of my intention. In this scenario, my representation of your contribution is false. I represent you as intending ecological resilience, but you intend economic resilience. Therefore, the content of my we-intention does not match the reality of our collective activity. Searle requires that the we-intention causes the action. Here, the action is caused by conflicting I-intentions that happen to align via the contractors. The causal power of the we-intention is missing because the we-intention itself is based on a false representation of the partner's mind.

  Ultimately, joint action survives only if the intentional state is robust. In this case, the hidden divergence means the intentional states are not interlocked but merely overlapping. The precise conceptual breaking point is the requirement for common knowledge or at least true representation of the partner's intent. Without this, the coordination is accidental. All three theorists, despite their differences, converge on the necessity of intentional interdependence. Since the planners lack interdependence regarding the actual content of their plan, joint action does not survive the opacity. The scenario describes a system that functions like joint action but lacks the ontology of jointness.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  1.  **Bratmanian Sub-Plan Analysis (4 marks):** Identifies that sub-plans do not mesh despite surface coordination. *Judgment:* Incompatibility undermines shared cooperative activity. *Error:* Claiming delegation solves the meshing problem.
  2.  **Bratmanian Responsiveness (4 marks):** Argues mutual responsiveness is illusory without knowledge of actual intentions. *Judgment:* Responsiveness requires tracking real intents, not labels. *Error:* Confusing behavioral alignment with intentional responsiveness.
  3.  **Gilbertian Commitment Object (4 marks):** Distinguishes commitment to words vs. concepts. *Judgment:* Plural subjecthood fails without unified conceptual content. *Error:* Treating the signed agreement as sufficient for plural subjecthood.
  4.  **Searlean Representation (4 marks):** Notes the falsity of the represented contribution in the we-intention. *Judgment:* False representation voids the causal power of the we-intention. *Error:* Assuming successful outcome validates the we-intention.
  5.  **Synthetic Verdict (4 marks):** Locates the breaking point at intentional interdependence/common knowledge. *Judgment:* Joint action fails due to counterfactual fragility. *Error:* Offering no verdict or claiming joint action survives simply because output is produced.

  **Differentiation:** Competent answers (10–13 marks) summarize the three theories separately without synthesizing the "opacity" problem. Excellent answers (16–20 marks) execute all five moves, explicitly connecting the hidden divergence to the failure of interdependence across all frameworks to reach a unified diagnostic judgment.
