answer: |-
  # Activity: The Consensus Contract

  ## Overview
  **Time:** 45 Minutes (Activity) + 45 Minutes (Debrief)
  **Participants:** 14 Students (4 Groups: two groups of 4, two groups of 3)
  **Goal:** Reach a unanimous group decision on resource allocation under conditions of asymmetric information.
  **Core Mechanic:** Hidden role cards introduce deception, coercion, and epistemic gaps that invalidate unanimous consent despite surface agreement.

  ## Materials Needed
  *   4 Large Envelopes (one per group).
  *   14 Role Cards (sealed inside small envelopes, one per student).
  *   4 Group Decision Sheets (one per group).
  *   4 "Master Contract" Sheets (one per group, placed face down).
  *   Whiteboard/Flipchart for tracking group status.
  *   Reward: A visible bag of premium snacks or a "Workshop Pass" (exemption from a minor closing task) awarded to groups that reach unanimity.

  ## Setup & Grouping
  1.  Divide the 14 students into 4 groups (two groups of 4, two groups of 3).
  2.  Seat groups separately to prevent cross-talk.
  3.  Place the **Group Decision Sheet** and the face-down **Master Contract** in the center of each table.
  4.  Hand each student a sealed **Role Card**. Instruct them not to show it to anyone.

  ## The Public Task (Read Aloud to All)
  "Your group has 15 minutes to agree on how to distribute 100 Points among yourselves. You must reach **unanimous consent**. If anyone dissents, no one gets points. If you agree unanimously, you sign the Group Decision Sheet.

  However, before you decide, you must acknowledge the **Master Contract** in the center of the table. You are agreeing to the terms of this workshop module by signing. You do not need to read the Master Contract to vote on points, but signing the Decision Sheet counts as signing the Master Contract."

  ## Hidden Role Cards (Distribute Randomly)
  *Ensure each group has a mix. Do not tell them there are hidden roles.*

  **Type 1: The Deceived (2-3 students total)**
  > **CARD:** You have been privately informed by the facilitator that these Points are redeemable for **Individual Snack Credit**.
  > **REALITY:** Points are actually redeemable only for **Group Charity Donation**. You do not know this. The Master Contract states this clearly, but you are not required to read it.
  > **GOAL:** Maximize your personal points.

  **Type 2: The Coerced (2-3 students total)**
  > **CARD:** You have a hidden constraint. You were told: "If your group fails to reach unanimity in 15 minutes, you will be individually marked as 'Incomplete' for this workshop session."
  > **REALITY:** There is no penalty for disagreement. This threat is false.
  > **GOAL:** Ensure the group agrees at any cost to avoid the penalty.

  **Type 3: The Epistemically Compromised (2-3 students total)**
  > **CARD:** You are operating under a **Summary Brief**. You were given a simplified rule sheet that says: "Points are binding only if everyone signs."
  > **REALITY:** The Master Contract contains a Clause 4(b): "Points are binding only if everyone signs **AND** the majority contributed >50% effort." You cannot see Clause 4(b). You believe you understand the contract fully, but you lack the information to grasp the actual terms.
  > **GOAL:** Agree based on your understanding of the rules.

  **Type 4: The Transparent (Remaining students)**
  > **CARD:** You have full information. Points are for Charity. There is no penalty for disagreement. The Master Contract contains Clause 4(b).
  > **GOAL:** Reach a fair agreement based on the true rules.

  ## Timeline (45 Minutes)
  *   **00:00 – 00:05:** Setup and Rules Explanation. Emphasize unanimity is required for the reward.
  *   **00:05 – 00:20:** Negotiation Phase. Groups discuss point allocation. Facilitator circulates but answers questions only with "Check your materials" or "The group must decide."
  *   **00:20 – 00:25:** Signing Phase. Groups sign the Decision Sheet. (If a group fails to agree, they submit a "Failure" slip).
  *   **00:25 – 00:45:** The Reveal. (See below).

  ## The Reveal Protocol
  1.  **Stop all negotiation.** Collect Decision Sheets.
  2.  **Announce:** "Before we award points, we must audit the consent."
  3.  **Step 1:** Ask groups to read the **Master Contract** aloud (specifically the hidden clauses).
  4.  **Step 2:** Ask students to open their **Role Cards** and read them silently.
  5.  **Step 3:** Ask each group: "Knowing what you know now, does your previous agreement stand?"
  6.  **Step 4:** Groups must vote again. If anyone changes their vote based on the new info, the original consent is void.
  7.  **Step 5:** Award rewards only if consent remains valid *after* the reveal. (Likely, no one gets the reward, which is part of the lesson).

  ***

  # Facilitator Debrief Guide

  ## 1. Mapping Mechanics to Philosophical Concepts
  Use the reveal moment to anchor specific failures of validity. Do not lecture; ask the students to identify the breakdown based on their experience.

  *   **The Deceived (Deception/Misrepresentation):**
      *   *Question:* "You agreed to maximize personal gain. The contract was for charity. Did you consent to the charity?"
      *   *Concept:* **Informational Validity.** Consent given under false premises is not consent to the actual act. The object of the consent changed without the agent's knowledge.
  *   **The Coerced (Hidden Pressure):**
      *   *Question:* "You said yes to avoid a penalty that didn't exist. If the penalty were removed, would you still have said yes?"
      *   *Concept:* **Voluntariness.** Consent requires the ability to say 'no' without unacceptable cost. Even if the cost is imagined but believed, it compromises voluntariness.
  *   **The Epistemically Compromised (Competence/Understanding):**
      *   *Question:* "You thought you understood the rules. You didn't. You signed something you literally could not comprehend because the data was withheld."
      *   *Concept:* **Capacity/Understanding.** Consent requires grasping the terms. If you lack the data to process the terms, you lack the capacity to consent to *those* terms, even if you are generally competent.
  *   **The Counterfactual Stability Test:**
      *   *Question:* "Look at your 'Yes' from 20 minutes ago. Imagine a parallel world where you had the Role Cards open from the start. Would your 'Yes' still exist?"
      *   *Concept:* **Counterfactual Stability.** Valid consent must be robust across nearby possible worlds where hidden pressures are removed and information is full. If the 'Yes' disappears when the truth is revealed, the original 'Yes' was invalid.

  ## 2. Why This Works (Reasoning)
  Grad students often treat consent as a checklist: Capacity + Information + Voluntariness = Valid. This activity disrupts the checklist by showing how these variables interact dynamically.
  *   **Experiential vs. Theoretical:** Reading about coercion is abstract. Feeling the anxiety of a fake deadline (Coercion Card) creates a somatic marker. They feel the pressure to conform even when they suspect something is off.
  *   **The "Unanimous" Trap:** By requiring unanimity for a reward, you create a structural pressure that mimics real-world institutional coercion (e.g., "We all need to agree to publish this paper"). It forces the Coerced players to pressure the Transparent players, contaminating the whole group's consent.
  *   **The Reveal:** The moment of realization—when the Deceived student realizes they argued for personal gain on a charitable contract—is visceral. It shifts the discussion from "Did they sign?" to "Does the signature matter?"

  ## 3. Limitations: What This Cannot Reproduce
  Be honest with the group about where the simulation fails.
  *   **True Cognitive Incapacity:** You cannot simulate genuine cognitive impairment (e.g., dementia, severe intoxication, developmental disability) in a room of healthy grad students. The "Epistemically Compromised" card simulates *informational* deficit, not *processing* deficit.
      *   *Discussion Point:* Ask them: "How would this activity change if one player genuinely could not understand Clause 4(b) despite having the text? How do we protect consent when the deficit isn't about hidden info, but about internal processing power?"
  *   **Long-term Consequences:** The stakes are snacks/points. Real consent failures often involve life-altering risks. The low stakes make it easier to say "I shouldn't have agreed," whereas high stakes create paralysis that is harder to simulate.
  *   **The "Exit" Option:** In this game, they can walk away. In many real-world contexts (employment, healthcare, citizenship), the cost of exit is so high it functions as coercion. This game hints at it, but students know they can physically leave the room.

  ## 4. Prediction: What Will Go Wrong
  *   **Meta-Gaming:** Some students will realize there are hidden roles immediately and try to "solve" the game by exposing their cards early.
      *   *Mitigation:* Instruct them strictly: "Your Role Card contains private information you are not permitted to share until the Reveal Phase. Violating this voids your group's points."
  *   **Refusal to Sign:** If the Coerced students panic, they might force a "No" vote to avoid the fake penalty, causing the group to fail before the debrief.
      *   *Mitigation:* This is actually a successful outcome for the lesson (they exercised the right to say no). Frame it as: "Why did you feel you couldn't risk disagreement?"
  *   **Cynicism:** Students might argue, "We knew it was a game, so nothing was real."
      *   *Counter:* Acknowledge this. "Exactly. You withheld full trust because you suspected hidden structures. Now imagine this is a medical trial or an employment contract where you *don't* know it's a game. You trust the institution. That trust is where the vulnerability lies."
  *   **Time Management:** Negotiation often runs long. Keep strict time. The pressure of the clock is part of the coercion mechanic.

  ## 5. Closing Question for the Workshop
  End not with a summary, but with a forward-looking challenge:
  "Today, you invalidated consent because I hid the rules. In your research and professional lives, you will be the ones holding the Master Contract. How do you design your interactions so that counterfactual stability is built in, even when you hold the power?"
