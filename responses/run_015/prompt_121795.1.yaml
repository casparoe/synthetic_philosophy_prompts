answer: |-
  You have hit on a sophisticated and well-documented problem in economic history, sociology, and technology studies. You are correctly identifying when a **narrative of contingency** is being pasted over a reality of **structural determinism.**

  There is no single, universally agreed-upon "pop science" term for this, but in academic literature (specifically the debates surrounding the QWERTY keyboard and VHS vs. Betamax), this is formally called **Spurious Path Dependence.**

  However, to give you a sharper tool for your specific observation—that the outcome was *overdetermined* by converging forces—I propose we refine this into a specific diagnostic concept.

  Here is the breakdown of the terminology, the distinction, and a framework for spotting it.

  ### 1. The Terminology

  **The Established Term: Spurious Path Dependence**
  Coined primarily by economists Stan Liebowitz and Stephen Margolis in the 1990s, this term describes claims of lock-in that fail empirical testing. They argued that many technologies cited as "inefficient lock-ins" (like QWERTY) were actually adopted because they were, at the time, the most efficient or robust solution given the constraints.

  **The Descriptive Term: The Contingency Illusion**
  Since "Spurious Path Dependence" is a bit dry, I recommend using **The Contingency Illusion**. This captures the specific error you noticed: mistaking an *inevitable convergence* for a *historical accident.*

  **The Counter-Concept: Equifinality**
  In systems theory and biology, this is **Equifinality** (or **Convergent Evolution**). It means different initial conditions lead to the same end state because the "fitness landscape" funnels everyone toward the same peak. When people claim path dependence in these cases, they are denying equifinality.

  ### 2. Real Path Dependence vs. The Contingency Illusion

  To distinguish them, you need to test for **Contingency** and **Viability of Alternatives.**

  | Feature | **Real Path Dependence** | **The Contingency Illusion** (Spurious) |
  | :--- | :--- | :--- |
  | **The Fork** | A genuine fork existed. Two viable options were available at the start. | The fork is illusory. One option was structurally superior or inevitable given physics/economics. |
  | **The Driver** | Driven by **Increasing Returns** (network effects, switching costs). | Driven by **Convergent Constraints** (engineering limits, human physiology, geography). |
  | **The "Rewind" Test** | If you rewound history, a different outcome is *plausible*. | If you rewound history, the same outcome occurs *independently* (as you noted with the highways). |
  | **The "Sticky" Reason** | Sticky because we are *trapped* by past investment. | Sticky because it is *optimal* (or locally optimal) for current constraints. |
  | **Example** | **VHS vs. Betamax:** Betamax was arguably technically superior; VHS won on marketing/rental networks. | **Rail Gauge:** Often called lock-in, but standardization is required for interoperability. The specific width matters less than having *one* width. |

  ### 3. Diagnostic Boundary Cases

  Here is how to apply this to your examples and others.

  **Case A: The File Format (Your Example)**
  *   *Claim:* "We use PDF/DOC because Company X marketed it well in the 90s."
  *   *Test:* Did other companies try different formats? Yes. Did they fail because of marketing, or because the "locked-in" format solved a specific interoperability problem (e.g., WYSIWYG rendering across OSs) better?
  *   *Verdict:* **Contingency Illusion.** The format converged because it solved a hard engineering problem (consistent rendering) that other formats struggled with. The marketing was the *signal*, not the *cause*.

  **Case B: Car-Centric Cities (Your Example)**
  *   *Claim:* "We have suburbs because of the 1956 Highway Act."
  *   *Test:* Did countries *without* the 1956 Act (e.g., Australia, parts of Europe) also build car-centric infrastructure when cars became cheap? Yes.
  *   *Verdict:* **Contingency Illusion.** The underlying force was the economics of personal transport + zoning laws + desire for single-family housing. The Highway Act accelerated it in the US, but didn't create the trajectory.

  **Case C: The QWERTY Keyboard (The Classic Debate)**
  *   *Claim:* "QWERTY is locked in because of a typo on the first typewriter."
  *   *Test:* Is Dvorak significantly faster for modern typing? Studies are mixed. Was QWERTY actually designed to slow typists down? No, it was designed to prevent mechanical jamming.
  *   *Verdict:* **Borderline.** This is the battleground. Liebowitz/Margolis argue it's **Spurious** (QWERTY was efficient for the mechanics). Others argue it's **Real** (we can't switch now due to training costs). *Use this case to show you know the nuance.*

  **Case D: Social Security Numbers (Real Path Dependence)**
  *   *Claim:* "We use SSNs for ID because the system was built that way in the 30s."
  *   *Test:* Is there a technically superior ID system available now? Yes (biometrics, encrypted tokens). Do we use them? No. Why? Switching costs and legacy database integration.
  *   *Verdict:* **Real Path Dependence.** A specific historical decision created a switching cost that persists despite better technology existing.

  ### 4. Why People Make This Error (The "Why")

  If you want to explain *why* your interlocutors are making this mistake, point to the **Narrative Fallacy** (Nassim Taleb).

  Humans prefer stories about **agents** (a CEO made a decision, a President signed a bill) over stories about **systems** (economic incentives, engineering constraints, geography).
  *   **Path Dependence** is a story about agents and accidents. It implies that if we had better leaders, we could have chosen the "better" path.
  *   **Convergent Determinism** is a story about systems. It implies we are constrained by reality, which is less satisfying and harder to politicize.

  ### 5. How to Deploy This in Argument

  When you hear the claim, don't just say "that's wrong." Use the **Rewind Test**:

  > "That sounds like path dependence, but have we checked for **equifinality**? If we rewind the tape to 1950 without that specific highway bill, do we still get highways? If yes, then the bill wasn't the lock-in; it was just the local expression of a broader economic constraint. We aren't looking at a historical accident; we're looking at a convergent evolution."

  **Summary Definition for Your Toolkit:**
  **The Contingency Illusion:** The rhetorical error of attributing a systemic outcome to a specific historical accident, ignoring evidence that the outcome was overdetermined by structural constraints and would have occurred regardless of the specific historical event.

  This gives you the vocabulary to separate "we are stuck because of a mistake" (Path Dependence) from "we are here because this is the local peak of the landscape" (Convergence).
