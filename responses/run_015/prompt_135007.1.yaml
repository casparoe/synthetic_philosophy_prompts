  We lift the shard to read the hand that made,
  Yet know the hand by what alone remains.
  A circle drawn in dust and falling rains,
  Where belief is built on broken clay displayed.
  We guess the god from fragments in the spade,
  And deem it sacred because it sustains
  The story that our digging entertains,
  Until the tool and thought are both betrayed.

  Yet some design a world without a trace,
  Where power lies in what we cannot know.
  They tread where nothing is to be found,
  And wear authority without a face.
  Their perfect void is all they will show,
  And bind the discipline that thinks them bound.
