answer: |-
  This is a specification for the **Computational Frame Problem** in a real-time embedded context. Since you are building a warehouse robot, we are discarding the philosophical "Representational Frame Problem" (how to write the axioms) unless it impacts maintainability, and focusing on the "Computational Frame Problem" (how to update state efficiently).

  Here are the desiderata, categorized by function, maintenance, and performance.

  ### 1. The Desiderata Spec

  #### A. Functional Correctness
  **D1. Negative Inference Guarantee**
  *   **Spec:** If a fluent (state variable) $F$ is not listed in the effect list of Action $A$, the system must infer $\neg \Delta F$ (F did not change) without explicit declaration.
  *   **Concrete Case:** You define `Move(Pallet, ZoneA, ZoneB)`. The system must automatically conclude `BatteryLevel` is unchanged, `DoorStatus` is unchanged, and `PalletColor` is unchanged, without you writing `BatteryLevel' = BatteryLevel`.
  *   **Status:** **Genuine Requirement.** Without this, you cannot scale. Enumerating non-changes is $O(N)$ where $N$ is total state size.

  **D2. Ramification Handling (Derived Effects)**
  *   **Spec:** The system must support indirect effects caused by constraints, not just direct effects.
  *   **Concrete Case:** If `Move(Pallet, ZoneA, ZoneB)` occurs, and you have a constraint `PalletInZone(P, Z) <-> Location(P) == Z`, the system must update `PalletInZone` automatically. If you have a constraint `ZoneCapacity(Z) < 10`, the system must detect if the move violates capacity.
  *   **Status:** **Genuine Requirement.** Warehouse logic is full of invariants (weight limits, zone capacities, mutual exclusion). Hard-coding these into every action leads to bugs.

  #### B. Maintenance & Modularity
  **D3. Elaboration Tolerance (Edit-Locality)**
  *   **Spec:** Adding a new fluent or a new action type should not require modifying the definitions of existing, unrelated actions or fluents.
  *   **Concrete Case:** You add a new sensor fluent `Humidity`. You should not have to open the definition of `Move` or `Lift` to state that they don't change humidity. Conversely, adding a new action `Sanitize` shouldn't force you to update the `Move` logic.
  *   **Status:** **Genuine Requirement.** (See evaluation of your Candidate 1 below).

  **D4. Declarative State Integrity**
  *   **Spec:** The state representation should be queryable as a snapshot without replaying the history of actions.
  *   **Concrete Case:** The monitoring dashboard asks `Where is Pallet_101?` 5000 actions later. The system should answer in $O(1)$ or $O(\log N)$, not by simulating 5000 steps from init.
  *   **Status:** **Genuine Requirement.** Debugging and supervision require current state access.

  #### C. Performance
  **D5. Bounded Update Cost (Frame-to-Payload)**
  *   **Spec:** The computational cost of updating the world model after an action must be proportional to the size of the *change* (the payload), not the size of the *world* (the frame).
  *   **Concrete Case:** If `PickUp` changes 3 variables in a state of 10,000 variables, the update logic should not iterate over the other 9,997 variables to verify they didn't change.
  *   **Status:** **Genuine Requirement.** (See evaluation of your Candidate 2 below).

  ---

  ### 2. Taste vs. Requirement (The Filter)

  Many "solutions" to the frame problem fail because they optimize for philosophical purity rather than engineering constraints.

  | Demand | Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **"Stay within Classical First-Order Logic"** | **Taste** | Pure FOL requires theorem proving for state projection, which is undecidable or exponential. A dev should use whatever logic (or database semantics) gets the job done. |
  | **"Monotonicity"** | **Taste** | Philosophers love monotonicity (facts never get retracted). Robots live in a non-monotonic world (a location becomes empty when a pallet leaves). Don't fight this. |
  | **"One Mechanism for Everything"** | **Taste** | Trying to handle preconditions, direct effects, and derived ramifications with a single logical operator often leads to complexity explosions. It is acceptable to have separate tables for `Preconditions`, `Effects`, and `Constraints`. |
  | **"Separation of Knowledge and Reasoning"** | **Taste** | While clean, tightly coupling state update logic to the action definitions (like STRIPS/PDDL) is often more performant than a generic reasoner over a knowledge base. |
  | **"Elaboration Tolerance"** | **Requirement** | If adding a feature requires touching core logic, you introduce regression risk. This is standard software engineering modularity applied to AI. |
  | **"Bounded Update Cost"** | **Requirement** | Hard real-time deadlines on a robot controller do not care about logical elegance. If the update loop misses the cycle time, the robot stops. |

  ---

  ### 3. Incompatible Desiderata (The Trade-offs)

  You cannot satisfy all desiderata simultaneously. You must choose which tension to resolve.

  **Conflict 1: Ramification Handling (D2) vs. Bounded Update Cost (D5)**
  *   **The Tension:** To handle indirect effects (ramifications) like "Zone Capacity," you generally need to check constraints against the global state. If you check global constraints on every write, you violate Bounded Update Cost. If you check them lazily on read, you violate State Integrity (D4) or risk inconsistent states.
  *   **The Compromise:** Most engineering systems (like PDDL planners) restrict ramifications. They allow direct effects ($A$ causes $B$) but forbid complex cyclic dependencies ($A$ causes $B$ causes $A$). You must decide if your domain allows "trigger chains." If yes, you sacrifice worst-case update time.

  **Conflict 2: Edit-Locality (D3) vs. Global Consistency**
  *   **The Tension:** True Edit-Locality implies an action doesn't "know" about fluents it doesn't mention. However, Global Consistency implies the system knows if an action violates a constraint involving those fluents.
  *   **The Compromise:** You need a **Constraint Solver** layer separate from the **Action Executor**. The Action Executor assumes locality (fast). The Constraint Solver validates the result (safe). If the constraint solver fails, you rollback. This adds latency but preserves modularity.

  **Conflict 3: Declarative State (D4) vs. Non-Monotonic Updates**
  *   **The Tension:** If you want a purely declarative history (Situation Calculus), state is a function of history $State = Result(Actions, S_0)$. Querying current state requires reduction. If you want $O(1)$ state access, you need mutable state (imperative updates).
  *   **The Compromise:** Use a **Mutable World Model** for execution (fast access) and an **Immutable Log** for debugging/planning (declarative history). Do not try to make the execution engine purely functional.

  ---

  ### 4. Evaluation of Your Candidates

  #### Candidate 1: Edit-Locality
  *   **Verdict:** **Genuine Requirement.**
  *   **Analysis:** In AI theory, this is known as **Elaboration Tolerance** (coined by John McCarthy). It is not an engineering smell; it is the defining characteristic of a maintainable domain model.
  *   **Why it matters:** If you use a naive logical formalism, adding a new fluent (e.g., `IsFlammable`) often requires updating every action axiom to specify that the action doesn't change flammability. This is $O(Actions \times Fluents)$.
  *   **The Trap:** Some "logical" solutions claim to solve this but require you to re-compile the entire theory when a new predicate is added. That fails this desideratum. A solution meeting this spec allows you to drop a new class/file into the project without modifying existing ones.

  #### Candidate 2: Frame-to-Payload Ratio
  *   **Verdict:** **Genuine Requirement.**
  *   **Analysis:** This is the **Computational Frame Problem**.
  *   **Why it matters:** In a warehouse, state $N$ might be 100,000 fluents (locations of every SKU, battery levels, motor temps). An action affects $k=5$ fluents. If your update logic is $O(N)$, your planner caps out. If it is $O(k)$, it scales.
  *   **The Trap:** This rules out any approach that relies on general-purpose theorem proving for state projection. It forces you toward **Closure Assumptions** (if it's not listed as changed, it didn't change) and **Mutable State** or **Diff-Based State**.

  ---

  ### 5. The "Killer" Requirement

  If you insist on a single requirement that rules out the most candidate solutions (both philosophical and engineering), it is:

  **D5: Bounded Update Cost (Frame-to-Payload Ratio)**

  **Why it kills the most solutions:**
  1.  **Kills Pure Situation Calculus:** Requires theorem proving to determine the state at step $t$, which is unbounded.
  2.  **Kills Naive Frame Axioms:** Requires iterating over all fluents to assert non-change.
  3.  **Kills General Constraint Propagation:** If you use a generic constraint solver (like a full SAT solver) to update state after every action, you lose bounded time guarantees.
  4.  **Kills "Semantic" Web Approaches:** OWL/DL reasoners typically re-classify the ontology upon change, which is not bounded by the size of the change.

  **What it leaves you with:**
  It forces you into the family of **STRIPS/PDDL-like assumptions** or **Object-Oriented State Models**.
  *   You must assume the **Closed World Assumption** (everything not stated true is false, or everything not stated changed is unchanged).
  *   You must use **Explicit Effect Lists** (the "payload").
  *   You must handle ramifications (D2) via **Triggers** or **Causal Rules** that are strictly acyclic and depth-limited, ensuring they don't explode into a global scan.

  ### Summary Recommendation for Your Spec

  Do not try to solve the philosophical Frame Problem. Solve the **Engineering Frame Problem**.

  1.  **Adopt the Closed-World Assumption for Change:** Explicitly list what changes. Everything else is implicitly constant. (Solves D1, D5).
  2.  **Enforce Modularity:** Actions define their own effects. Global constraints are checked by a separate validator, not embedded in action definitions. (Solves D3).
  3.  **Accept Imperative State:** Maintain a mutable world model for the robot controller. Log actions for the planner. (Solves D4, D5).
  4.  **Limit Ramifications:** Allow derived fluents (e.g., `ZoneFull`), but forbid cyclic dependencies. Compute them on write, but ensure the dependency graph is a DAG (Directed Acyclic Graph) to guarantee bounded update time. (Resolves D2 vs D5 conflict).

  If a proposed solution requires you to iterate over the full state vector to confirm nothing changed, **reject it**. That is the only hard filter that matters for a robot.
