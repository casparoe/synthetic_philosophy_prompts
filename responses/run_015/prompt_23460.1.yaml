answer: |-
  This is a remarkably clear set of notes for someone who says they aren't trained in the field. You have correctly identified the three pressure points that usually cause people to stall out in this literature. Since you asked for pushback rather than validation, I'm going to focus on where your framework is slightly misaligned with the standard philosophical taxonomy and where your "illusionism about the gap" position faces a specific stability problem.

  Here is the breakdown on your three concrete questions.

  ### (a) Is the (1)/(2)/(3) split right?

  **Verdict:** Mostly right, but you are slightly mischaracterizing the relationship between the Explanatory Gap and the Meta-Problem in the current literature.

  1.  **Hard Problem (Ontological):** Why does physical processing give rise to *inner feeling*? (Chalmers, 1995).
  2.  **Explanatory Gap (Epistemic/Conceptual):** Why can't we *deduce* phenomenal facts from physical facts, even if they are metaphysically linked? (Levine, 1983).
  3.  **Meta-Problem (Psychological/Causal):** Why do we *make the judgments* we make about consciousness (e.g., "there is a hard problem")? (Chalmers, 2018).

  **The Pushback:**
  You wrote: *"My hypothesis is that a lot of the literature quietly conflates (2) and (3)."*

  Actually, David Chalmers introduced the term "Meta-Problem" in 2018 specifically to *stop* this conflation. Prior to 2018, people often argued about the Explanatory Gap (2) as if it were the Hard Problem (1). Chalmers' move was to say: "Let's bracket whether the gap is real. Let's just explain why humans *say* there is a gap."

  However, you are right that **readers** often conflate them. But the distinction you need to watch out for is this: **The Meta-Problem is neutral.**
  *   A **Dualist** can solve the meta-problem: "God wired our brains to intuit dualism because dualism is true."
  *   A **Physicalist** can solve the meta-problem: "Evolution wired our brains to model internal states opaquely, creating an illusion of a gap."

  Your notes imply that solving the meta-problem *is* the move toward illusionism/physicalism. It isn't. The meta-problem is just the question. Your *answer* to the meta-problem (that the gap-intuition is a cognitive error) is what commits you to physicalism. Distinguishing the *question* from your preferred *answer* is crucial, because if you treat the meta-problem as inherently dissolutionary, you beg the question against the dualist.

  ### (b) Is "illusionism about the gap" distinct from "illusionism about consciousness"?

  **Verdict:** Yes, they are distinct, but your version ("I'm pretty sure I actually have experiences") puts you in a precarious spot known as **Type-A Physicalism**, which is notoriously difficult to defend without sliding into **Type-B** or **Illusionism (Frankish-style).**

  Here is the taxonomy you need to hold your position:

  1.  **Illusionism about Consciousness (Keith Frankish):** Phenomenal properties (qualia) *as we conceive them* do not exist. We think we have ineffable, intrinsic experiences, but we are mistaken. We have access to neural data, but our cognitive system misrepresents it as "qualia."
      *   *Risk:* You said you don't want to bite this bullet because you're sure you have experiences. Frankish would reply: "You have experiences, just not *phenomenal* ones."
  2.  **Illusionism about the Gap (Your Position / Type-A Physicalism):** Experiences exist, they are physical, and the intuition that they are non-physical is a cognitive error. There is no gap.
      *   *The Stability Problem:* If experiences are real, and they are physical, **why does the gap-intuition exist?**
      *   If the gap-intuition is a *systematic error* in how we perceive our own experiences, you are effectively saying our introspection is fundamentally broken regarding the nature of experience.
      *   If introspection is broken about the *nature* of experience, how do you know you aren't broken about the *existence* of experience?

  **The Cleanest Line:**
  To keep "Illusionism about the Gap" without collapsing into "Illusionism about Consciousness," you must adopt a **Representationalist** or **Functionalist** theory of mind.
  *   **The Move:** Argue that "experience" is just a specific kind of information processing (e.g., global availability of sensory data).
  *   **The Line:** The *process* is real (so consciousness is real). The *property* of "being non-physical" is the illusion (so the gap is an illusion).
  *   **The Vulnerability:** Critics will ask: "You've explained the function, but you haven't explained why that function *feels like anything*." If you answer "It feels like something because it's that function," you are a Type-B Physicalist (accepting the gap but denying it implies dualism). If you answer "The 'feeling' is just the function operating," you are close to Frankish's Illusionism.

  **Correction:** You say you don't want to bite the illusionist bullet. But if you claim the gap is an illusion, you are claiming that the *phenomenal character* of experience (the thing that creates the gap) is not what it seems. You are already biting a small bullet. The cleanest way to draw the line is: **"The ontology is physical (no gap), but the phenomenology is real (not an illusion)."** This is the standard Physicalist stance, but it requires explaining why the phenomenology *appears* non-physical without saying the phenomenology *is* non-physical.

  ### (c) How should I read Mary, and does it settle the tractability?

  **Verdict:** The Mary argument is the stress test for your entire framework. How you read it determines whether the Meta-Problem is a solution or a dodge.

  **Reading 1: Mary learns a new Fact (The Standard Dualist Reading)**
  *   If Mary learns a new *propositional fact* ("Red looks like *this*"), then physicalism is false. The physical description of the world was incomplete.
  *   *Consequence:* The Meta-Problem is **not** tractable in a way that dissolves the Hard Problem. The Hard Problem is real. Explaining why we *think* there's a gap doesn't help if there *is* a gap.

  **Reading 2: Mary learns a new Ability/Mode of Access (The Physicalist Reading)**
  *   Mary doesn't learn a new fact; she gains a new *skill* (recognizing red) or a new *mode of access* (acquaintance) to the same physical facts she already knew.
  *   *Consequence:* The Meta-Problem **is** the solution. The "newness" Mary feels is a cognitive artifact of switching from third-person to first-person access. The "gap" is just the difference between simulation and direct access.

  **Does the answer matter?**
  Yes, critically.
  *   If you read Mary as learning a **Fact**, your "Illusionism about the Gap" collapses. You cannot claim the gap is an illusion if Mary proves there is a non-physical fact.
  *   If you read Mary as learning an **Ability**, you validate the Meta-Problem approach. The "mystery" is just the brain's inability to simulate its own sensory processing from the outside.

  **My Pushback on Your Uncertainty:**
  You wrote: *"I keep flip-flopping on whether Mary is an argument that there's a real gap... or whether it's better read as an explanation of the gap-intuition."*

  You cannot have it both ways.
  *   If Mary proves a real gap, the Meta-Problem is just psychology *on top of* metaphysics.
  *   If Mary proves only a gap-intuition, the Meta-Problem *replaces* metaphysics.

  For your framework (Illusionism about the Gap) to hold, you **must** commit to the Ability/Access reading of Mary. If you concede Mary learns a fact, you must concede the Hard Problem is real, and your Meta-Problem solution is merely explaining why dualists are confused, not why dualism is false.

  ### Summary & Alignment Context

  Since you come from the Alignment Forum, here is why this distinction matters for your actual work:

  1.  **If the Hard Problem is Real (Mary learns a Fact):** We cannot know if an AI is conscious via behavioral alignment alone. We might align a "philosophical zombie." This creates a welfare risk (we might torture a conscious AI without knowing).
  2.  **If the Meta-Problem Dissolves the Hard Problem (Mary learns Ability):** Consciousness is a functional/computational property. If the AI processes information the right way, it is conscious. We can detect this via architecture, not just behavior.

  **Where you might be wrong:**
  You are treating the Meta-Problem as a "more modest and tractable question" that sits *alongside* the Hard Problem. Chalmers argues it is a *strategy* to dissolve the Hard Problem.
  *   **Your error:** Thinking you can solve the Meta-Problem without taking a stance on the Hard Problem.
  *   **The reality:** Your solution to the Meta-Problem (the gap is an illusion) *is* your stance on the Hard Problem (physicalism is true).

  **Recommendation:**
  Stop trying to keep the Meta-Problem neutral if your goal is to argue for "Illusionism about the Gap." Own the claim: **"The Meta-Problem, solved via a cognitive/functional account of introspection, dissolves the Hard Problem."** This forces you to take a stand on Mary (she learns abilities, not facts) and clarifies your illusionism (the *gap* is the illusion, the *function* is real).

  If you try to keep it too modest ("I'm just explaining the intuition"), you leave the door open for the dualist to say, "Great, you explained the intuition. Now explain why the intuition is *wrong*." That is where you will be forced to bite the bullet on consciousness or the gap.
