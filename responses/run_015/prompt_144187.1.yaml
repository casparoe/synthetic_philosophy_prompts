answer: |-
  **Project Title:** Beyond Erasure: Locating the Thermodynamic Cost of Information in Non-Cyclic Maxwellian Demons

  **Research Question**
  Standard resolutions of Maxwell's Demon invoke Landauer's Principle: the demon must erase its memory to return to its initial state, and this erasure dissipates heat sufficient to save the Second Law. This project asks a more granular question: **Is the thermodynamic cost of information-driven work extraction necessarily localized to memory reset, or can it be fully accounted for by the entropy accumulation in a non-erasing memory register, provided the register remains physically coupled to the control mechanism?**

  Put differently, does the "thermodynamic bill" come due only when the demon forgets (erasure), or does it come due as soon as the demon knows (storage)? By constructing a model of a demon that writes to an infinite tape rather than resetting a finite register, this project seeks to determine whether Landauer's bound is a fundamental constraint on *information use* or merely a boundary condition on *cyclic operation*.

  **Intellectual Context and Gap**
  The prevailing consensus, following Bennett and Landauer, treats the demon as a cyclic machine. To compare initial and final states, the demon's memory must be reset. Consequently, the entropy reduction in the gas is offset by the entropy increase during erasure. This framing conflates two distinct claims: a **bookkeeping claim** (mutual information must be offset by entropy production somewhere in the closed system) and an **embodiment claim** (information is only useful if physically realized in a system coupled to the gas).

  Existing literature leaves the relationship between these claims open because it predominantly analyzes cyclic engines. By forcing a reset, standard models pre-emptively locate the entropy cost in the erasure step. They do not rigorously test whether a non-cyclic demon—one that accumulates a history of measurements—pays its entropy debt during the *writing* phase via the physical entropy of the memory medium itself, or if the cost is deferred until the memory is full. If the cost is paid during storage, the standard narrative that "erasure saves the Second Law" is a special case of a broader principle: that physical correlation itself carries an entropy weight, regardless of whether that correlation is later destroyed.

  **Methodology**
  This project will not proceed via general information-theoretic bookkeeping nor through metaphysical analysis of "information." Purely abstract information theory risks begging the question by assuming the very cost functions (e.g., $k_B \ln 2$ per bit) that are under investigation. Conversely, metaphysical inquiry cannot yield the determinate physical answers required to settle the thermodynamic accounting.

  Instead, I will construct a specific statistical-mechanical toy model: a **Szilard Engine coupled to a One-Way Spin Chain**.
  1.  **The System:** A single-particle gas (the working substance).
  2.  **The Demon:** A control mechanism that measures particle position and inserts a partition to extract work.
  3.  **The Memory:** A 1D chain of spins, initially in a low-entropy state. The demon does not reset spins; it flips the next available spin in the chain to record the measurement outcome.
  4.  **The Coupling:** Crucially, the model will explicitly account for the physical cost of *accessing* the growing tape. As the tape lengthens, the control mechanism must physically interact with further sites.

  I will calculate the net work extracted over $M$ cycles and compare it against the total entropy change of the gas, the memory tape, and the control apparatus. The calculation will isolate the entropy production term: does it appear as heat dissipation during the write operation, or does it remain latent in the tape's configuration until an external reset occurs?

  **Possible Conclusions and Decision Criteria**
  The project aims to reach one of three determinate conclusions, decided by the sign and location of the entropy terms in the final balance equation:

  1.  **The Storage Hypothesis (User's Intuition):** The entropy cost appears immediately in the memory tape's configuration entropy ($\Delta S_{tape} > 0$). The Second Law is satisfied at every step without erasure. *Decision Criterion:* If $\Delta S_{total} \geq 0$ holds solely due to the increasing entropy of the written tape, independent of any reset operation.
  2.  **The Control Cost Hypothesis:** The tape's entropy alone is insufficient. The cost hides in the increasing energy required to couple the controller to an expanding memory address space (e.g., moving the read/write head further). *Decision Criterion:* If $\Delta S_{tape}$ is insufficient to balance the work extracted, but including the work required to expand the control coupling restores the Second Law.
  3.  **The Erasure Necessity Hypothesis (Standard View):** The model reveals that without reset, the demon ceases to extract work after $N$ cycles due to memory saturation or correlation back-reaction, making the "infinite tape" physically vacuous. *Decision Criterion:* If the work extraction rate drops to zero as memory fills, implying that useful information requires reusable (resettable) states.

  **Risk Assessment and Feasibility**
  The primary risk is that the toy model will collapse into a trivial instance of the standard Landauer bound. For example, if the energy cost to flip a spin on the tape proves mathematically equivalent to the cost of erasing it, the distinction between "storage cost" and "erasure cost" becomes merely semantic bookkeeping rather than a physical distinction.

  A second risk involves the "infinite tape" assumption. If the model requires an infinite physical system to store the entropy, the result may be dismissed as physically unrealistic. To mitigate this, the proposal treats the tape as a finite resource that limits the demon's lifespan, allowing us to calculate the *density* of entropy cost per bit of work.

  This project is feasible within a nine-month timeline because it relies on analyzing a specific, bounded Hamiltonian model rather than deriving general theorems. The calculations involve standard statistical mechanics and information theory, but applied to a non-standard boundary condition (non-erasing memory).

  **Significance**
  If the Storage Hypothesis holds, it shifts the philosophical understanding of "information is physical." It suggests that the physicality of information lies in the *correlation* itself, not in the *destruction* of correlation. This would demonstrate that the standard erasure narrative is an artifact of demanding cyclic engines, rather than a fundamental law of information thermodynamics. Conversely, if the Control Cost or Erasure Necessity hypotheses hold, the project will precisely locate why cyclic operation is thermodynamically privileged, refining the current understanding of the Second Law in information-processing systems.
