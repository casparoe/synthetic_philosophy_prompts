          *   Van = Care/Relationships.
          *   Cash = Consequences/Impact.
      *   **The Decision Rule (The Core Answer):** How to decide when you don't know the "true" morality?
          *   *Idea 1: The "No Regrets" Move.* Is there an option that scores decently on *all* frameworks?
          *   *Idea 2: Reversibility.* Cash is gone once given. A van can be sold (though depreciation). Cash is less reversible in terms of control, but the asset is more liquid. Actually, cash is *more* irreversible in terms of getting it back, but the *commitment* of the van is harder to exit.
          *   *Idea 3: Option Value.* Keeping options open.
          *   *Idea 4: Procedural Ethics.* Since it's mutual aid, the *way* you decide matters as much as the decision. Democracy/Consensus is a virtue in itself.
      *   **Specific Analysis of the $20k:**
          *   $20k for a *reliable* van + insurance + gas + maintenance is tight. Risk of the van breaking down is high. If the van breaks, the program stops, and the money is sunk.
          *   $20k cash = immediate eviction prevention.
          *   *Hybrid Approach?* Can you do both? Maybe not effectively.
      *   **The "Gut" Question:** Is gut checking okay? Yes, but refine it. The gut is often pattern recognition of past values.
      *   **Recommendation:** Don't look for the "One True Moral Theory." Look for the decision that minimizes harm if you're wrong.

