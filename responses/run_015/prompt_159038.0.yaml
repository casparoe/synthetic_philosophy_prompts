answer: |-
  This is a sharp problem, and your intuition that the standard "contingent vs. structural" gloss is too quick is correct. The difficulty isn't just in defining the terms; it's in identifying *what* is doing the scaling.

  Here is the shape of the argument you need, followed by a worked example that traces the distinction through the two cases you mentioned.

  ### 1. Refining the Distinction: Algorithm vs. Problem, and the Input Parameter

  Your distinction maps roughly onto the difference between **algorithmic complexity** and **problem complexity**, but with a philosophical caveat regarding the *input parameter*.

  *   **Contingent Limitations (Algorithmic/Implementation):** These are limitations of a specific procedure or physical substrate. If I switch from bubble sort to merge sort, or from a neuron to a transistor, the limitation vanishes. In your terms, this is "more of the same."
  *   **Structural Limitations (Problem-Intrinsic):** These are limitations attached to the functional specification of the task itself. No algorithm can solve an NP-complete problem in polynomial time (assuming $P \neq NP$).

  **The Trap:** The philosophical weight of a structural limitation depends entirely on **what counts as the input size ($n$)**.

  If $n$ measures the *physical bandwidth* of the agent (e.g., number of photoreceptors), then hardness is contingent on the agent's embodiment. A "larger" agent escapes it.
  If $n$ measures the *conceptual complexity* of the environment (e.g., the number of variables in a causal model the agent must understand to survive), then hardness is structural. Even a "larger" agent cannot escape it without simplifying the world-model.

  For a hardness result to be philosophically load-bearing, you must argue that $n$ scales with the **task's intensional complexity**, not just its extensional size. If rationality requires tracking $n$ independent reasons, and the cost of coherence scales exponentially with $n$, then the cost is structural to rationality, not contingent to the brain.

  ### 2. Addressing Your Two Worries

  #### Worry 1: Worst-Case vs. Average-Case (The "Benign World" Reply)
  You are right to worry here. NP-completeness is a worst-case guarantee. If the "hardest" instances never occur in nature, the hardness result is biologically inert.

  *   **The Counter-Argument:** This reply works for *descriptive* cognitive science (explaining how we actually survive), but it fails for *normative* theories of rationality or *robust* cognitive architectures.
  *   **Why:** An ideal agent (or a robust cognitive theory) cannot rely on the world being benign. Rationality is often defined by the capacity to handle *counterfactual* or *novel* situations. If a reasoning system crashes when the environment presents a "hard" instance (even if rare), it lacks the modal robustness we expect of rationality.
  *   **The Philosophical Load:** Hardness results here show that **robustness is expensive.** You cannot have a system that is both universally applicable (handles any input structure) and efficient. You must trade off scope for speed. This constrains normative theory: you cannot demand universal coherence *and* timeliness.

  #### Worry 2: The Approximation Dodge (The "Good Enough" Reply)
  This is the stronger worry. If I can't compute the exact Bayesian posterior, I can compute an approximation. Have I solved the problem?

  *   **The Counter-Argument:** It depends on whether the approximation preserves the **normative status** of the original task.
  *   **Why:** In optimization problems, an approximation often comes with a guarantee (e.g., "within 5% of optimal"). In reasoning and belief revision, "approximate coherence" is often ill-defined. If my beliefs are 90% coherent, do I avoid Dutch Books? Usually not. A single inconsistency can be exploited.
  *   **The Philosophical Load:** Hardness results force a **conceptual revision**. If exact coherence is intractable, and approximate coherence doesn't secure the normative benefits (like avoiding sure-loss), then the normative ideal itself is incoherent for situated agents. The hardness result doesn't just say "we can't do it"; it says "the definition of rationality needs fixing." That is genuine philosophical work.

  ### 3. Worked Example: Logical Omniscience and Belief Consistency

  Let's trace this through a concrete case: **The requirement that a rational agent's belief set be logically consistent.**

  **The Setup:**
  Standard doxastic logic assumes that if an agent believes $P$ and believes $P \rightarrow Q$, they believe $Q$. Furthermore, their belief set should not contain a contradiction. To check if a finite set of beliefs is consistent is equivalent to the **SAT problem** (propositional satisfiability), which is NP-complete.

  **The Input Parameter ($n$):**
  Here, $n$ is the number of atomic propositions in the belief set.

  #### Case 1: The Cognitive Science Objection
  *Objection:* "Humans are not logically omniscient. We hold inconsistent beliefs. Therefore, models assuming consistency are empirically inadequate."
  *Standard Reply:* "Humans use heuristics (e.g., local consistency checking) and only face structured instances."

  **Applying the Distinction:**
  Is the failure to be consistent contingent or structural?
  *   If we view consistency checking as a task that *must* be done globally over the whole belief set, it is **structural**. No amount of faster hardware allows a physical system to check the consistency of a sufficiently large belief set in real-time.
  *   If we view the heuristic reply seriously, we are changing the *functional specification* of the agent. The agent is no longer a "consistency maximizer"; it is a "local consistency satisficer."
  *   **The Load-Bearing Point:** The hardness result forces the cognitive scientist to admit that **global coherence is not a psychological natural kind.** You cannot find a "module" for consistency in the brain because the computation doesn't map onto physical time/space constraints for complex inputs. The hardness result justifies moving from logical models to probabilistic/heuristic models of cognition. It's not just that we are slow; it's that the task description was wrong for a physical system.

  #### Case 2: The Normative Objection (Ought Implies Can)
  *Objection:* "Normative theories (like Bayesianism) demand probabilistic coherence. But maintaining coherence over a large hypothesis space is computationally intractable. Therefore, 'ought implies can' is violated."
  *Standard Reply:* "Normative theories are idealizations. They describe the target, not the runner."

  **Applying the Distinction:**
  *   **Contingent View:** The idealization is like frictionless planes in physics. We know agents can't do it, but it helps to measure the distance from the ideal.
  *   **Structural View:** If the distance from the ideal grows exponentially with the complexity of the world, the ideal becomes **asymptotically unreachable**.
  *   **The Load-Bearing Point:** Here, the hardness result challenges the **regulative status** of the norm. A norm is useful only if effort correlates with success. If the computational cost of moving from 90% coherence to 91% coherence doubles with every new variable, then "trying harder" (scaling resources) yields diminishing returns that hit a wall.
  *   **The Approximation Dodge:** Can we say agents *ought* to be approximately coherent?
      *   If "approximate coherence" means "low probability of Dutch Book," hardness results suggest that finding *such* a state is also hard (depending on the metric).
      *   If the norm is revised to "do the best you can given computational constraints," the norm becomes **resource-rationality**.
      *   **Conclusion:** The hardness result forces the normative theorist to choose: either abandon the claim that rationality is coherence (changing the definition of the virtue), or accept that rationality is impossible for complex agents (skepticism). It blocks the move of keeping the old definition while waving away the implementation.

  ### 4. Where the Distinction Breaks Down

  You asked if your distinction is a false dichotomy. In one crucial sense, it is: **The Level of Analysis.**

  Your distinction assumes we can separate the "task" from the "agent." But in philosophy of mind (via functionalism), the task *is* defined by what the agent does.
  *   If an agent successfully navigates the world using heuristics, one might argue the "real task" was never global consistency; it was *successful navigation*.
  *   Under this description, the hardness of global consistency is irrelevant. It was never the task.

  **The False Dichotomy:**
  The limitation is only "structural" relative to a specific **description of the task**.
  *   Description A: "Maintain a logically closed belief set." $\rightarrow$ Structural Hardness.
  *   Description B: "Avoid obvious contradictions in active working memory." $\rightarrow$ Contingent/Easy.

  **The Philosophical Work:**
  The value of the hardness result is not that it proves agents *can't* do things. It is that it forces you to argue for **Description A vs. Description B**.
  *   If you are a normative theorist, you must argue why Description A (global coherence) is essential to rationality, despite its intractability.
  *   If you are a cognitive scientist, you must argue why Description B (heuristic navigation) is sufficient to count as "thinking," despite its lack of logical guarantees.

  ### 5. Summary for Your Paper

  To make your argument load-bearing, structure it like this:

  1.  **Reject the "Biographical" Dismissal:** Hardness isn't just about human slowness. It's about the scaling of cost with *conceptual complexity*.
  2.  **The Condition for Structural Constraints:** A hardness result constrains an ideal agent only if **efficiency is constitutive of the ideal.** (i.e., if the agent must act in time, or if the "ideal" includes robustness to novel inputs). A timeless God is not constrained by NP-completeness; a rational *actor* is.
  3.  **The Approximation Critique:** Argue that approximation is not a free pass. If the normative benefit (e.g., avoiding inconsistency) is all-or-nothing, approximation fails. If the benefit is graded, hardness results show the "cost of rationality" curve is steep, which changes the normative calculus (Resource Rationality).
  4.  **The Worked Example:** Use Logical Omniscience/Consistency. Show that hardness results don't just say "humans fail at this." They say "any physical system fails at this for large $n$." This forces the conclusion that **Logical Omniscience is the wrong norm for physical agents.**
  5.  **Final Move:** The distinction between contingent and structural is real, but it is relative to the **functional specification**. The philosophical work of complexity theory is to police those specifications. It stops philosophers from defining rationality in ways that are computationally miraculous without acknowledging the miracle.

  **Bottom Line:** Computational hardness does genuine philosophical work when it demonstrates that a proposed normative ideal or cognitive capacity is **physically unrealizable for any system embedded in a complex environment.** It shifts the burden of proof: if you want to keep the ideal, you must explain why the computational cost doesn't matter (e.g., by denying the agent is embedded, or by redefining the task). If you can't, the ideal must be abandoned or revised. That is not biography; that is metaphysics of mind.
