      *   *Check for Understanding:* A question about which unity broke.
      *   *Verdict:* Keep the dial, but refine the mechanic to ensure confabulation is incentivized.

  5.  **Refining the "Confabulation" Mechanic:**
      *   In split-brain patients, the LH (controlled by right hemisphere) picks an object. The RH (speaking) doesn't know why but says "I picked it because I like blue."
      *   Simulation: Actor sees a card saying "Pick the Blue Pen." Interpreter sees nothing. Actor picks Blue Pen. Interpreter must write down "Why we picked this pen."
      *   Incentive: If the explanation is plausible, the pair gets points. If they admit "I don't know," they get zero. This forces confabulation.
      *   This aligns with the user's goal: "confabulation should happen because of how I've set the incentives up."

