      *   *Verdict:* Keep the core (pairs, restricted communication, tasks), but refine the "dial" to be more about *information access* than just bandwidth, and ensure the "confabulation" mechanic is built into the task incentives. The "dial" is good for the "access unity" vs. "agency" distinction.

  3.  **Design the Activity ("The Commissurotomy Simulation"):**
