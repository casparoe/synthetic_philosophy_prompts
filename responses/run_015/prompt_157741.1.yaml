  # Research Proposal: The Explicitism Assumption in Carroll's Regress

  **Target Paper Length:** Approx. 5000 words
  **Field:** Philosophy of Logic / Epistemology

  ## 1. Research Question and Core Thesis

  Lewis Carroll's 1895 dialogue *What the Tortoise Said to Achilles* is standardly interpreted as demonstrating a foundational problem in the justification of deduction: that logical principles cannot be applied without invoking a further principle to justify their application, leading to an infinite regress. The standard responses in the literature generally fall into two camps: those who accept the regress as a sign that logic is circular (and perhaps therefore unjustified or merely coherentist), and those who argue the regress is harmless because logical rules are pragmatic norms rather than truth-apt premises.

  This project proposes a third avenue. The central research question is: **Does Carroll's regress genuinely expose a problem about logical justification, or does it only arise due to a hidden, contested assumption about the representational structure of reasoning?**

  Specifically, I will argue that the regress relies on "Explicitism"—the assumption that to follow a rule of inference (like Modus Ponens), an agent must explicitly represent that rule as a premise or belief within their reasoning process. If Explicitism is rejected in favor of a model of tacit rule-following, the regress dissolves without requiring circularity or pragmatism. The core thesis is that the standard debate between circularity and pragmatism is stalled because both sides accept the Tortoise's Explicitist demand as legitimate, disagreeing only on how to live with it. By challenging the demand itself, we can resolve the paradox without sacrificing the normativity of logic.

  ## 2. The Gap in Current Literature

  The existing literature on Carroll's paradox is extensive, but it suffers from a specific blind spot. Most contemporary discussions focus on the *status* of the logical rule. Foundationalists argue that logical rules must be justified by intuition or self-evidence, while coherentists argue they are justified by their role in the system. Pragmatists and quietists argue that asking for justification of logic is a category mistake.

  However, nearly all these positions accept the Tortoise's initial move: that Achilles cannot conclude *Z* from *A* and *B* unless he accepts the hypothetical proposition "If *A* and *B*, then *Z*" as an additional premise. This acceptance implies that inference requires the explicit endorsement of the rule governing the inference.

  The gap this project addresses is the lack of scrutiny on this requirement itself. Few analyses ask whether the Tortoise is entitled to demand that the rule of inference be written down as a premise. By treating the demand as self-evident, the literature forecloses the possibility that the regress is an artifact of a specific, perhaps incorrect, model of cognitive agency. The project will demonstrate that both the "circularity" camp (who accept the regress as a feature of justification) and the "pragmatism" camp (who accept the regress but deny it matters) are fighting on the Tortoise's turf. Neither camp sufficiently challenges the Explicitist assumption that applying a rule requires representing it.

  ## 3. Methodology

  The method will be primarily conceptual analysis, grounded in close reading of Carroll's dialogue, supplemented by comparative analysis of tacit rule-following cases. The project must remain strictly philosophical; it will not appeal to empirical cognitive science to prove that humans *do* reason tacitly, but rather will argue normatively that agents are *entitled* to reason tacitly.

  The analysis will proceed in three stages:
  1.  **Textual Reconstruction:** Isolating the exact point in the dialogue where the Tortoise imposes the Explicitist requirement.
  2.  **Conceptual Contrast:** Comparing the logical case with cases of tacit knowledge in language use and skilled action (e.g., chess intuition) to show that rule-following does not logically require explicit representation.
  3.  **Normative Evaluation:** Determining whether tacit rule-following preserves the normativity required for logic (i.e., does avoiding Explicitism make logic merely psychological?).

  This approach avoids the trap of turning the paper into a survey of cognitive science. The focus remains on epistemic entitlement: even if humans *could* represent rules explicitly, are they *required* to do so to be justified?

  ## 4. Section-by-Section Plan (for the 5000-word paper)

  **Section 1: Introduction (approx. 750 words)**
  *   Introduce Carroll's dialogue and the standard interpretation (the problem of justifying deduction).
  *   State the standard dichotomy: Circularity vs. Pragmatism.
  *   Introduce the core hypothesis: The regress depends on "Explicitism."
  *   Outline the argument structure and state the thesis clearly.

  **Section 2: The Explicitism Assumption in Carroll's Dialogue (approx. 1250 words)**
  *   Close analysis of the Tortoise's demands. Show that the Tortoise treats the rule of inference as a missing premise.
  *   Define Explicitism: The claim that valid inference requires the agent to hold a belief representing the validity of the inference.
  *   Demonstrate that Achilles accepts this demand, which is why he loses.
  *   Argue that standard responses (foundationalism, coherentism, pragmatism) all accept this demand and merely try to stop the regress after it starts, rather than preventing it from starting.

  **Section 3: Tacit Rule-Following as an Alternative (approx. 1500 words)**
  *   Introduce the alternative: Tacit entitlement. The idea that one can follow a rule without representing it.
  *   Use philosophical analogies rather than empirical data:
      *   *Language:* Speakers follow grammatical rules without being able to articulate them.
      *   *Chess:* A master sees a move as valid without deriving it from explicit axioms of chess.
  *   Address the normative concern: Does tacit following reduce logic to mere habit? Argue that tacit knowledge can still be normative (one can be wrong tacitly) and thus preserves the status of logic.
  *   Show how this blocks the Tortoise: If the rule is a mode of operating rather than a premise, it cannot be added to the list of premises, stopping the regress.

  **Section 4: Evaluating the Options (approx. 1000 words)**
  *   Present the three possible conclusions (detailed below in "Possible Conclusions").
  *   Provide criteria for deciding between them. The primary criterion will be "Explanatory Cost": Which view requires the fewest counter-intuitive commitments about rational agency?
  *   Argue that Explicitism has a high explanatory cost (it makes simple reasoning impossibly complex), while Tacit Entitlement has a low cost.

  **Section 5: Conclusion (approx. 500 words)**
  *   Summarize the argument.
  *   Reiterate that the problem of logical justification is partly a problem of philosophical psychology.
  *   Final statement on the dissolvability of the regress.

  ## 5. Possible Conclusions and Criteria for Decision

  The paper will not dogmatically assert one conclusion but will weigh three live options based on the analysis in Section 4.

  **Option A: Explicitism is Inescapable (The Regress is Real)**
  *   *Claim:* Rational agency inherently requires explicit awareness of norms. Tacit rule-following is merely causal, not justificatory.
  *   *Implication:* Logic is either circular or unjustified.
  *   *Criteria for Acceptance:* If it can be shown that tacit following cannot distinguish between *thinking* one is right and *being* right (losing normativity).

  **Option B: Tacit Entitlement Dissolves the Regress**
  *   *Claim:* Agents are entitled to rely on logical rules tacitly. The demand for explicit representation is a category error.
  *   *Implication:* The regress is a pseudo-problem generated by bad philosophy of mind.
  *   *Criteria for Acceptance:* If tacit following can be shown to support normative assessment (criticism/correction) without explicit representation.

  **Option C: The Middle Ground (Meta-Rule Explicitism)**
  *   *Claim:* First-order rules can be tacit, but any challenge to a rule requires explicit defense.
  *   *Implication:* The regress only starts when rules are challenged, not in ordinary reasoning.
  *   *Criteria for Acceptance:* If this distinguishes successfully between "default justification" and "dialectical justification."

  **Decision Criteria:**
  The paper will argue for **Option B** or **Option C** based on the criterion of **Normative Sufficiency**. Does the model allow us to say an agent is *wrong* to infer incorrectly? If Tacit Entitlement allows for error and correction (which it does, analogous to grammar), it is sufficient. Explicitism will be rejected based on the criterion of **Psychological Plausibility** (not empirical, but conceptual): a model of reasoning that requires infinite explicit premises makes reasoning impossible, so it cannot be a correct model of rationality.

  ## 6. Scope Check and Feasibility

  **The Question of Epistemic Entitlement in Philosophy of Mind**
  You asked whether covering "epistemic entitlement in philosophy of mind" is too ambitious for a one-semester, 5000-word paper.

  **Honest Assessment:** Yes, this is too ambitious.
  A full survey of epistemic entitlement (e.g., Burge's warrant, Wright's entitlements) involves deep metaphysical and psychological commitments regarding the nature of perception, memory, and reasoning. Integrating a full theory of entitlement from the philosophy of mind into a paper on logical regress risks bloating the paper beyond 5000 words or superficializing the entitlement theory.

  **Recommendation:**
  Do not attempt to survey the philosophy of mind literature on entitlement. Instead, use the *concept* of entitlement as a tool within the philosophy of logic. You can argue for "tacit entitlement" without committing to a specific theory from the philosophy of mind (like Burge's). Frame it as a normative claim about reasoning practices rather than a metaphysical claim about mental states.
  *   *Keep:* The idea that agents are entitled to rely on rules they cannot articulate.
  *   *Drop:* The detailed metaphysics of *why* they are entitled (e.g., externalism vs. internalism debates in mind).
  *   *Reasoning:* A 5000-word paper is roughly 15–20 pages. You need approximately 1500 words just to set up Carroll and the Explicitism problem accurately. That leaves 3500 words for the solution. If you spend 1500 words explaining Burge vs. Wright, you will have no space to solve the Carroll paradox. Stick to the logic/epistemology interface.

  **Risk of Failure:**
  The project fails if it becomes a survey of "theories of entitlement" rather than an analysis of Carroll. The focus must remain on the *structure of the regress*, using entitlement only as the key to unlock it.

  ## 7. Success and Failure Criteria

  **Success Looks Like:**
  1.  **Precision on Explicitism:** The paper clearly defines "Explicitism" and shows exactly where it appears in Carroll's text. It does not treat it as a vague background assumption but as a specific philosophical commitment.
  2.  **Normative Defense:** The argument successfully defends tacit rule-following as *normative* (not just psychological habit). It shows how one can be wrong about a tacit rule.
  3.  **Scope Management:** The paper stays within 5000 words by avoiding deep dives into philosophy of mind literature, keeping the focus on the logical paradox.
  4.  **Clear Resolution:** The conclusion clearly states whether the regress is dissolved or merely managed, based on the criteria established in Section 4.

  **Failure Looks Like:**
  1.  **Empirical Drift:** The argument relies on claims about how human brains *actually* work (cognitive science) rather than how agents are *justified* in reasoning (epistemology). This shifts the project from philosophy to psychology.
  2.  **Scope Creep:** Attempting to solve the "problem of entitlement" generally rather than using it to solve Carroll. This will result in an unfinished paper that neither explains entitlement nor solves the regress.
  3.  **Misinterpreting the Regress:** Treating the regress as a problem about truth rather than a problem about inference rules. The paper must maintain the distinction between premises (truth-apt) and rules (inference-licenses).
  4.  **Ambiguity on Tacit Knowledge:** Failing to explain how tacit knowledge avoids the regress. If the tacit rule is just a "hidden premise," the regress returns. The paper must clarify that tacit rules are *modes of operation*, not *hidden propositions*.

  ## 8. Preliminary Bibliography Note
  *(Per your request, no citation list is included here. You will populate this with primary texts from Carroll, secondary literature on the regress (e.g., Stroud, Quine, Wittgensteinian readings), and selective works on rule-following.)*

  ## 9. Final Feasibility Statement

  This project is viable for a one-semester term paper provided the scope regarding "epistemic entitlement" is strictly limited to its functional role in dissolving the regress. The 5000-word limit is tight but sufficient for a focused conceptual analysis. The key to success will be resisting the temptation to solve all of epistemology and remaining focused on the specific mechanism of the Tortoise's argument. By framing the problem as one of "Explicitism" rather than "Justification," the paper offers a novel contribution that avoids the standard undergraduate pitfalls of circularity accusations.

  The proposed structure ensures that the first half of the paper diagnoses the problem (the Explicitist assumption) and the second half proposes and evaluates the solution (Tacit Entitlement). This balance is appropriate for the word count. The scope check advises against importing heavy philosophy of mind machinery, which protects the project from becoming unmanageable.

  If you proceed with this proposal, the immediate next step is to draft the definition of "Explicitism" rigorously, ensuring it is distinct from merely "knowing that a rule exists." It must be defined as "representing the rule as a premise in the argument." This distinction is the linchpin of the entire argument.
