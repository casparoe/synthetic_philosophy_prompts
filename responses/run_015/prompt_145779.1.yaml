answer: |-
  The residue that fails to translate into cryptographic-provenance terms is an indication that the intentionalist debate relies on an imprecise concept of "meaning."

  **Strong Anti-Intentionalism**
  *   **Translates Cleanly:** This position maps to treating publication as broadcasting a signed payload where integrity is established solely through hash verification and payload analysis, independent of the signature origin once broadcast.
  *   **Requires Distortion:** Equating the "intentional fallacy" with ignoring signer metadata requires treating accessible cryptographic provenance as logically irrelevant rather than technically inaccessible, distorting the forensic utility of chain-of-custody.
  *   **No Analog:** The normative claim that analysis *ought* to ignore chain-of-custody data has no cryptographic equivalent, as forensic protocols prioritize provenance to validate integrity rather than restricting analysis to payload content.

  **Moderate Intentionalism**
  *   **Translates Cleanly:** This position maps to asserting that valid payload analysis requires confirming chain-of-custody links back to the specific digital signatures generated at the moment of creation.
  *   **Requires Distortion:** Equating signature validity with content alignment distorts digital signatures, which prove origin authenticity and data integrity rather than constraining the semantic output of payload analysis.
  *   **No Analog:** The claim that the signature origin's private state constrains payload analysis has no cryptographic equivalent, as hash verification confirms static data integrity rather than interpretive boundaries or authority hierarchies.

  **Emergent Reader-Community View**
  *   **Translates Cleanly:** This position maps to treating verification as a distributed process where multiple instances validate the same payload without consensus on content output.
  *   **Requires Distortion:** Cryptographic provenance seeks immutable consistency across verification instances, whereas this view requires divergent valid outputs from identical hash verification, forcing a conflict between consensus mechanisms and interpretive variance.
  *   **No Analog:** The generation of new content value during verification has no analog, as hash verification confirms static data rather than dynamic content creation or evolving payload states.

  **Residue Report**
  The gaps expose that parts of the original debate were never as conceptually precise as they appeared, specifically conflating the authenticity guaranteed by digital signatures with the content variability inherent in payload analysis. The failure to map normative claims about authority or phenomenological experiences of address indicates that the debate often treated "meaning" as a singular variable capable of hash verification, when it actually comprises distinct layers of provenance, integrity, and semantic reception that cryptographic models necessarily separate.
