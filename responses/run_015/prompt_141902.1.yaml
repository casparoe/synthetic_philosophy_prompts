answer: |-
  This is a robust and philosophically sophisticated package. You have essentially assembled a version of **Moderate Restrictivism with Ontic Vagueness**, grounded in a causal/integration criterion, while maintaining a robust realist meta-ontology.

  You are worried about the tension between **1 (Anti-Nihilism/Artifacts)** and **2 (Anti-Universalism)**. You can stop worrying about that pairing. That is the standard "Moderate" position; it is stable provided you have a criterion (which you do in 6). The "only stable resting places" objection (often associated with Sider) relies on the claim that you cannot state a non-arbitrary criterion. Since you explicitly commit to finding one (3 & 6), you have already blocked that argument.

  The real tensions lie elsewhere. Here is the audit of your commitments, ordered by severity.

  ### 1. Severity: Critical (Foundational Tension)
  **The Conflict:** **4 (Anti-Deflationism)** vs. **5 (Causal Idleness)**

  *   **The Tension:** You claim the dispute about composites is a substantive, first-order dispute about reality (4), yet you also claim that composites add no causal powers and their profile is fixed entirely by their parts (5).
  *   **Why it pulls:** If the causal work is done entirely by the parts arranged in a certain way, the "composite" is causally redundant. If it is causally redundant, insisting that its *existence* is a substantive, mind-independent fact (4) becomes difficult to motivate. This invites the deflationist charge: if the causal facts are settled by the parts, what further fact is there for "existence" to track? You risk holding a view where composites are ontologically "real" but metaphysically epiphenomenal shadows.
  *   **Cost of Resolution:**
      *   *If you qualify 4:* You move toward a quasi-deflationary view (existence is partly conceptual). This saves the causal picture but undermines your realist motivation.
      *   *If you qualify 5:* You allow that composites have causal relevance that is not strictly reducible to the parts (without necessarily positing "magic" downward causation). This supports 4 but requires careful phrasing to avoid violating physical causal closure.

  ### 2. Severity: High (Extensional Tension)
  **The Conflict:** **1 (Artifacts Exist)** vs. **7 (No Groups)** via **6 (Integration Criterion)**

  *   **The Tension:** You rely on "causal or dynamic integration" (6) to include bicycles (1) but exclude universities (7).
  *   **Why it pulls:** Both bicycles and universities are human artifacts dependent on intention. Both exhibit functional integration (a bicycle's parts work together to transport; a university's parts work together to educate). If the integration is strong enough to ontologically ground a bicycle, it is unclear why it fails to ground a university. If you say universities lack "physical" integration, you risk violating **3 (Non-Arbitrary)**, as the distinction between "physical" and "social" integration may look like a brute distinction rather than an informative condition.
  *   **Cost of Resolution:**
      *   *If you give up 7:* You accept group agents/objects. This complicates your ontology significantly.
      *   *If you give up 1:* You slide toward Organicism (Van Inwagen style). You said you are unmoved by this, so this is a high cost.
      *   *If you refine 6:* You must articulate a principled difference between mechanical integration and social coordination that isn't just "I like bicycles better."

  ### 3. Severity: Moderate (Metaphysical Cost)
  **The Conflict:** **3 (Informative Condition)** vs. **8 (Ontic Vagueness)**

  *   **The Tension:** You want a non-arbitrary, informative condition for composition (3), but you also accept that it can be genuinely indeterminate whether that condition is met (8).
  *   **Why it pulls:** This is not a contradiction, but it is a costly combination. If the condition is informative, we should be able to state it. If reality is vague, the condition itself must be vague (e.g., "sufficiently integrated"). This makes the condition less "informative" in the classical sense and opens you to the charge that the vagueness is actually semantic (deflationism), which you reject in 4.
  *   **Cost of Resolution:** You must bite the bullet on ontic vagueness. This is consistent but metaphysically expensive.

  ### Stable Pairings (Apparent Tensions that are Actually Fine)
  *   **1 (One Thing/Statue) & 5 (Causal Idleness):** These work beautifully together. By denying coincident objects (statue ≠ clay), you avoid the problem of causal overdetermination. If there is only one object, there is only one causal profile. This is a strong point of your package.
  *   **2 (Restrictivism) & 8 (Vagueness):** You have correctly identified that accepting ontic vagueness is the price of avoiding Universalism in the face of Lewis's argument. These two lock together securely.
  *   **1 (Artifacts) & 2 (Restrictivism):** As noted, this is the standard Moderate position. It is stable *if* 6 is successful.

  ---

  ### The Single Revision Recommendation

  To clean up the most trouble with the least cost, I recommend you **qualify Commitment 5 (Causal Idleness).**

  **Current:** "Composing something adds no causal powers. The causal profile of a composite is fixed by its proper parts and their arrangement..."

  **Proposed Revision:** "Composing something adds no *surplus* causal powers. The causal profile of a composite is *grounded in* its proper parts and their arrangement, but the composite itself is a legitimate *locus* of causal attribution."

  **Why this fixes the most:**
  1.  **It saves Commitment 4 (Anti-Deflationism):** By allowing the composite to be a legitimate *locus* of causation (even if grounded in parts), you give the existence claim substantive weight. It is no longer a causally idle shadow; it is the primary bearer of causal properties in ordinary discourse and explanation. This blocks the deflationist slide.
  2.  **It helps with Commitment 3 & 6 (Integration):** If composites are legitimate causal loci, you can argue that "integration" is precisely what makes a collection of parts a *unified* causal locus. This strengthens the link between your criterion and your ontology.
  3.  **It leaves 1 and 2 intact:** You do not have to give up artifacts or restrictivism.
  4.  **It avoids the "Magic" of Downward Causation:** You can maintain that the causal powers are grounded in the parts (preserving physicalism) without saying the composite is *causally idle* (which preserves realism).

  **The Trade-off:** You must be careful not to slide into overdetermination. But since you already deny coincident objects (1), you are well-positioned to claim that the composite *just is* the parts arranged thusly, and therefore the causal powers of the parts *are* the causal powers of the composite, without redundancy. This is a standard non-reductive physicalist move that stabilizes your entire meta-ontological stance.

  **Summary:** Your worry about 1 vs. 2 is misplaced; that is the stable core of your view. Your real vulnerability is the combination of robust realism (4) with causal idleness (5). Softening 5 to "Causal Non-Surplus" rather than "Idleness" secures the foundation of the project.
