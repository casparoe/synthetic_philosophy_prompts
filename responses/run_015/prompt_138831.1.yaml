answer: |-
  # Joint Statement on Neural Network Representations: Adversarial Collaboration

  **Preamble: Shared Setup and Definitions**

  We, the undersigned, agree to the following experimental setup. We study a 1-billion-parameter decoder-only transformer trained on a mixed text corpus. We apply an unsupervised dictionary-learning pipeline (a sparse autoencoder) to the **residual stream** activations at one middle layer. The residual stream is the vector space that accumulates information as data passes through the network layers. A **direction** is a specific vector within this space. The pipeline produces a **dictionary**, a set of vectors used to reconstruct activations under a sparsity penalty. We acknowledge **superposition**, the possibility that the network encodes more features than there are dimensions in the residual stream. **Steering** refers to adding a scaled vector to activations to alter output; a **linear probe** is a classifier trained to predict properties from activations.

  We jointly analyze three recovered directions: one tracking language, one tracking sentiment/politeness, and one tracking a specific named entity type. We also treat as a control case a small transformer trained on a synthetic language generated by a known grammar over known latent variables.

  ***

  ### 1. Agreed Claims

  1.  **Optimization vs. Ontology:** The dictionary-learning pipeline minimizes a loss function combining reconstruction error and sparsity. This optimization guarantees neither that the resulting directions correspond to causal variables used by the network nor that they are unique.
  2.  **Invariance:** The network's input-output function is mathematically invariant under invertible linear transformations of the internal activation space. Any claim that a specific basis is privileged must explain how training dynamics or hardware constraints break this symmetry.
  3.  **Intervention Limits:** Successfully steering network behavior by activating a single direction demonstrates causal efficacy of that intervention, but not necessarily that the direction corresponds to a natural variable the network uses internally during standard operation.
  4.  **Explanatory Burden:** A representation claim is only worth making if decomposing the network into these variables yields predictive leverage regarding the network's behavior on out-of-distribution inputs that exceeds what is achievable using the raw weights or holistic models.
  5.  **Sparsity Necessity:** The observation that sparse decompositions are interpretable to humans does not establish that the network's internal computation is sparse; it may merely establish that human cognition requires sparsity to understand high-dimensional data.
  6.  **Synthetic Ground Truth:** In the synthetic control case, there is a fact of the matter about which latent variables generate the data. Recovery of these variables by the pipeline is a necessary but not sufficient condition for claiming the pipeline discovers representations in the general case.

  ***

  ### 2. Disagreements Table

  | Disputed Claim | Realist Formulation | Deflationist Formulation | Note on Difference |
  | :--- | :--- | :--- | :--- |
  | **Privileged Decomposition** | The training process converges on a specific decomposition of the residual stream that is uniquely determined by the data structure and loss landscape. | The decomposition is one of many equally valid bases; the chosen one is selected by the regularization bias of the interpretability method, not the network. | Realists see the basis as *found*; Deflationists see it as *imposed* by the tool. |
  | **Semantic Content** | The recovered directions carry semantic content (e.g., "politeness") that explains why the network produces specific tokens in specific contexts. | The directions are instrumental handles; attributing content is a mnemonic device for humans, not a description of the network's state. | Realists treat content as intrinsic; Deflationists treat it as projected by the observer. |
  | **Causal Role** | Individual features play distinct causal roles in the computation; intervening on them isolates specific mechanisms. | The computation is holistic; features are linear projections of a distributed state, and interventions work by perturbing the whole state, not isolating a part. | Realists argue for modularity; Deflationists argue for holism. |
  | **Method Convergence** | Different interpretability methods applied to the same layer will converge on the same underlying features, modulo permutation. | Different methods will recover different features optimized for different human legibility constraints, with no convergence on a "true" set. | Realists expect robustness across methods; Deflationists expect method-dependence. |

  ***

  ### 3. Crux Table

  | Sub-Question | Test / Case / Argument | Realist Prediction | Deflationist Prediction |
  | :--- | :--- | :--- | :--- |
  | **(a) Change-of-Basis** | Does the physical training process break the mathematical symmetry of invertible linear maps? | **Yes.** Training dynamics (e.g., gradient descent noise, initialization) select a specific basis aligned with the data manifold. | **No.** Any basis spanning the same subspace is functionally equivalent; preferring one is an artifact of human visualization. |
  | **(b) Illegible Ground Truth** | In the synthetic case, if true latents are dense/random linear functionals (illegible to humans), does the pipeline recover them? | **Yes.** The pipeline tracks the network's internal structure, even if humans cannot name the features. | **No.** The pipeline will fail or recover legible proxies that approximate the true latents but are not identical. |
  | **(c) Untrained Control** | Apply the pipeline to a network with random weights but matched activation statistics (same covariance matrix). | **Negative.** No coherent features will emerge because there is no learned structure to discover. | **Positive.** Sparse directions will emerge due to the architecture and optimization bias of the autoencoder itself, indistinguishable from the trained case. |
  | **(d) Cross-Model Transplant** | Steer Network B (different seed/data) using a direction found in Network A without refitting. | **Success.** The direction corresponds to a universal feature of the architecture-task pair and will transfer. | **Failure.** The direction is specific to Network A's particular weight configuration; steering will produce noise or unrelated effects. |
  | **(e) OOD Prediction** | Does a model built on these features predict behavior on out-of-distribution inputs better than a holistic baseline? | **Yes.** Features capture invariant mechanisms that generalize beyond the training distribution. | **No.** Features are overfit to the training distribution; holistic models will outperform on OOD data. |

  ***

  ### 4. Retraction Conditions

  **Realist Retraction Condition:**
  We will abandon the claim that recovered directions are natural kinds if, in the **Cross-Model Transplant** test (d), steering effects fail to generalize beyond the specific network instance they were extracted from, and if, in the **OOD Prediction** test (e), feature-based models consistently underperform holistic baselines. This would demonstrate that the features are artifacts of specific weight configurations rather than invariant computational variables.

  **Deflationist Retraction Condition:**
  We will abandon the claim that features are merely convenient shorthands if, in the **Illegible Ground Truth** test (b), the pipeline reliably recovers the true synthetic latents even when they are dense and human-illegible. This would demonstrate that the pipeline tracks structure intrinsic to the network rather than structure imposed by human legibility constraints.

  ***

  ### 5. Closing: Verbal vs. Substantive Disputes

  **Verbal Disputes:**
  We acknowledge that some disagreement stems from the definition of "representation." If the Realist defines representation as "any variable that supports successful intervention" and the Deflationist defines it as "a variable that exists independently of the observer's basis choice," we may talk past each other. We agree to bracket terminological debates until empirical results are in.

  **Substantive Disputes:**
  The core dispute is empirical: does the network's computation decompose into stable, transferable variables, or is it an indivisible whole that only appears decomposable under specific human-centric projections? This is not a matter of semantics but of predictive performance and generalization.

  **Next Steps:**
  We commit to executing the **Illegible Ground Truth** and **Cross-Model Transplant** experiments within six months. Predictions are pre-registered. Adjudication will be based on effect sizes and statistical significance thresholds agreed upon in advance. If the Realist's features fail to transfer or predict OOD behavior, the Realist concedes the deflationary view for practical purposes. If the Deflationist's illegibility constraint is violated, the Deflationist concedes that the network encodes objective structure. We will publish the raw data and code jointly, regardless of the outcome.
