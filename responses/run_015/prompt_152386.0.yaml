answer: |-
  It is completely understandable that you find this passage dense because Aristotle is doing several things at once in Book 4, chapter 9, primarily trying to figure out how to stabilize a constitution by mixing elements from different regime types. When he distinguishes between election by vote and election by lot, he is not just talking about administrative efficiency but about competing principles of justice. You are right that he identifies election by vote as aristocratic because it presupposes that some citizens are better than others and deserve to be chosen based on merit or reputation, whereas selection by lot is democratic because it presupposes that all citizens are equal and should have an equal share in ruling. Your confusion about whether this makes lot useless if citizens are not genuinely equal in skill gets at the heart of his argument, but the resolution lies in understanding that Aristotle is describing a mixed constitution or polity rather than a pure democracy. He is not necessarily saying that lot is only safe when there is absolutely no difference in skill, but rather that lot is the appropriate mechanism for offices where the primary qualification is citizenship itself, whereas vote is appropriate for offices requiring specific virtue or expertise. In a well-mixed regime, you would use lot for some offices and vote for others, or even mix the methods by having election from a pre-selected group, thereby satisfying the democratic claim to equality and the oligarchic or aristocratic claim to merit simultaneously.

  Regarding your question about whether democracy should limit itself to offices where skill does not matter, Aristotle would likely agree in practice but for different reasons than a modern technocrat might. He believes that ruling and being ruled in turn is essential for citizenship, so even if someone is not an expert, participating in judgment is part of their moral education. However, he does acknowledge that certain high offices, like generalships, require specific skills that cannot be left to chance, so he suggests that these should be elected. This maps partially onto the modern lottocracy idea you mentioned, where random selection is proposed for deliberative bodies like citizens assemblies while executives remain elected or appointed. The modern argument is often that random selection prevents corruption and elite capture while ensuring descriptive representation, whereas Aristotle's argument is more about balancing class interests to prevent revolution. He wants to blend the wealth-based claims of the oligarchs with the freedom-based claims of the democrats, so his use of lot is less about stopping campaign corruption and more about giving the poor a stake in the system without handing them total control over specialized functions. So while the structural split between deliberative and executive functions looks similar, the underlying logic is different because Aristotle is focused on social stability and virtue rather than epistemic diversity or anti-corruption measures.

  Your intuition about the responsibility gap and autonomous systems is a fascinating philosophical stretch, but it is probably forcing a modern legal and technological problem onto an ancient ethical framework. When Aristotle worries about incompetent rulers selected by lot, his concern is that the city will fail to achieve its end, which is the good life, rather than a concern about who can be blamed in a liability sense. In the Athenian system, which Aristotle is analyzing, officials selected by lot were still subject to strict accountability audits after their term, so the lack of choice in selection did not mean a lack of accountability for performance. The modern responsibility gap arises when an autonomous system makes a decision that no human specifically programmed or chose, creating a void in moral attribution. In Aristotle's view, if a ruler is incompetent, the fault lies with the constitution for placing them there or with the citizen for lacking virtue, but there is still a human agent to blame. However, you are tracing a valid thread regarding agency and selection; if no one chooses the ruler, the connection between the people's will and the ruler's action is severed, which weakens the political bond. Aristotle would say this weakens the friendship that holds the city together, which is close to your idea of a responsibility gap but rooted in social cohesion rather than moral liability.

  Ultimately, Aristotle is running a logic about the mean between democracy and oligarchy rather than a purely technocratic assessment of skill. He believes that the best practicable constitution is one that mixes these principles so that neither the rich nor the poor feel excluded or dominant. When he says lot is democratic and vote is aristocratic, he is providing tools for a legislator to build this balance. If you use only lot, you risk incompetence in critical roles, but if you use only vote, you risk oligarchy and civil strife. The solution is to assign the method to the office based on what the office requires and what the regime needs to remain stable. So you are not wrong to see a tension between equality and skill, but Aristotle resolves it by suggesting that a city needs both principles operating in different spheres. Your comparison to modern lottocracy is insightful regarding the separation of functions, but remember that his goal is virtue and stability, not just fair representation or corruption prevention. And while the responsibility gap analogy is creative, it is safer to say Aristotle worries about the degradation of civic virtue and the common good rather than the ambiguity of blame assignment, though both concerns stem from the same root issue of who controls power and how they are chosen.
