answer: |-
  Dear Colleague,

  Your reconstruction of the argument against our funding proposal is admirably rigorous, and it correctly identifies the tension that makes Goodhart's Law so frustratingly difficult to wield in policy debates. You have laid out a dilemma that forces us to choose between a law that is universally false and one that is trivially true, and your instinct to preserve the explanatory power of the law at step six rather than deny the empirical success of proxy systems at step four is sound. However, to save the law from your colleague's reductio, we must reject step two. This is the pivot point where the argument overextends a cybernetic analogy into a social context where it no longer holds. Step two asserts that every system steering toward a goal by feedback is optimizing a proxy in the same relevant sense, equating a thermostat regulating temperature with a hospital department managing readmission rates. This premise looked fine because it relies on a superficially plausible equivalence between negative feedback loops in engineering and incentive structures in organizations. Both involve a sensor, a target, and an actuator. But the equivalence breaks down because the thermostat lacks agency and strategic intent. A thermostat cannot decide to cool the outside air to make the room feel warmer, nor can it hack its own sensor. A hospital department, however, can discharge patients prematurely to avoid counting a readmission, thereby optimizing the measure while violating the target.

  If we reject step two, the cost to your colleague's argument is significant but necessary. It forces him to abandon the universal claim that all optimization destroys proxy value, limiting the scope of Goodhart's Law to contexts involving strategic agents who can manipulate the causal link between the measure and the target. The alternative would be to reject step four, insisting that thermostats and markets do not actually work, which is empirically untenable and would require giving up too much of our ordinary understanding of control systems and economics. Rejecting step two is the least costly repair because it preserves the intuition that physical and non-strategic systems function reliably while isolating the specific pathology of human institutions. Your colleague would have to concede that Goodhart's Law is not a law of physics or even a universal law of cybernetics, but rather a specific warning about high-powered incentives in social systems. This is precisely what defenders of the law would concede anyway. Serious proponents of Goodhart's Law do not argue that a thermometer ceases to measure heat because we look at it, nor do they claim that a reinforcement learning agent fails whenever it receives a reward signal. They argue that when the reward function is incomplete relative to the true objective, and the agent is powerful enough to find loopholes, specification gaming occurs. Defenders would say your argument misdescribes them by treating the law as a claim about correlation decay under any observation, rather than correlation decay under adversarial optimization.

  This brings us to the distinction between statistical and causal degeneration, which you suspected might be mere relabeling. It is not merely relabeling, though it does come at the cost of precision. The statistical version of the law refers to regression to the mean when selecting extremes from a fixed distribution. The causal or adversarial version refers to agents changing the distribution itself by altering their behavior. Acknowledging this distinction saves the law from triviality because it specifies the mechanism of failure. It is not just that pushing on a variable breaks a correlation, which is indeed a generic statistical fact. It is that introducing an incentive changes the causal graph connecting the measure to the target. In the hospital context, the measure was previously a passive indicator of health outcomes. Once tied to funding, it becomes an input into administrative decision-making that can decouple the indicator from the outcome. This is why the law is neither universal nor trivial. It is conditional on the capacity of the measured entity to intervene in the measurement process.

  If you are forced to choose between keeping step six and step four, you are right to keep step six, but only if you accept that step two was the error. Step six claims that metric fixation is a special failure mode requiring distinctive responses. This remains true even if thermostats work perfectly, because hospitals are not thermostats. The law retains its bite as a warning about specification problems in multi-agent systems where the principal cannot perfectly monitor the agent's actions. This aligns with the literature on reward specification in machine learning, where we distinguish between robust reward functions that generalize and brittle ones that invite gaming. The cost of this view is that we cannot use Goodhart's Law as a blanket veto against all metrics. We must instead engage in the harder work of designing robust indicators that are harder to game, or combining quantitative metrics with qualitative oversight. Your colleague wants to use the law to block the proposal entirely, but the proper philosophical lesson is that metrics are necessary but dangerous tools that require safeguards, not abandonment.

  Ultimately, the flaw in your colleague's chain is the assumption that all feedback is created equal. By rejecting step two, we acknowledge that the epistemology of measurement differs fundamentally between physical systems and social institutions. In the former, the object measured does not care about the measurement. In the latter, the object measured is often the one being rewarded for the measurement. This distinction allows us to maintain that GDP and exam grades can function reasonably well as signals without denying that they can be distorted by strategic behavior when the stakes are high enough. The law survives not as a universal prohibition on measurement, but as a specific caution about the limits of proxy optimization in strategic environments. For our committee, this means we should not abandon the funding proposal, but we must acknowledge the risk of specification gaming and build in audits or complementary measures to mitigate it. We can accept the law without accepting the paralysis your colleague proposes.
