answer: |-
  1. **Objection (Senior Mechanist): The Formalizability Trap**
  "Your 'practice-bound procedures'—reflective equilibrium, conceptual clarification—are either effective procedures or they aren't. If they are effective, they are Turing-computable. If they are Turing-computable, they can be formalized into an extended system $S'$. You haven't escaped the loop; you've just moved the goalpost from $S$ to $S'$. The asymmetry is temporary, not structural."

  **Reply:**
  "You are assuming that 'effective procedure' equates to 'static formal rule.' My claim is that mathematical practice is a normative stance, not a fixed algorithm. When a mathematician resolves a paradox via conceptual clarification, they are altering the semantic interpretation of the symbols, not merely deriving a new theorem within a fixed syntax. This shift changes the system itself. You can formalize the *result* of the practice into $S'$, but you cannot formalize the *transition* from $S$ to $S'$ within $S$ without triggering the very inconsistency the practice resolved. The asymmetry lies in the dynamic capacity to revise the framework based on meaning, which a static formal system, by definition, cannot do from within. The mechanist captures the snapshot; the practitioner owns the film."

  **Weakest Point:** Relies heavily on the distinction between 'dynamic practice' and 'static system' which a determined mechanist may argue is just a higher-order algorithm waiting to be formalized.

  2. **Objection (Logician/AI Grad): The Complexity Collapse [PRIORITY AVOIDANCE]**
  "You claim this asymmetry persists under polynomial-time bounds. But consistency checking is generally computationally hard. If humans are resource-bounded biological machines, how do you perform these checks efficiently? If humans can check consistency in polynomial time, why can't the formal system $S$ be upgraded to do the same? You risk claiming humans solve NP-hard problems effortlessly."

  **Reply:**
  "I am not claiming humans solve worst-case consistency problems efficiently. I am claiming that within the 'trusted neighborhoods' of mathematical practice—where humans actually operate—the heuristics for detecting inconsistency are computationally cheap. We don't scan the whole system; we monitor local coherence via cross-system comparison. A formal system $S$ restricted to polynomial verification lacks the semantic access to recognize *which* local checks matter without exhaustive search. Humans use meaning to prune the search space. The asymmetry isn't about solving hard problems; it's about knowing which problems are worth solving. $S$ sees syntax; we see significance."

  **Weakest Point:** Empirically fragile. If cognitive science shows human consistency checks are actually error-prone or slow, the 'efficiency' claim collapses, undermining the resource-bounded defense.

  3. **Objection (Cognitive Scientist): The Empirical Fallibility**
  "Your model assumes practitioners successfully identify inconsistencies. But history is littered with famous mathematicians accepting inconsistent systems for years. If humans are resource-bounded and noisy, isn't this 'consistency-checking' just a post-hoc narrative? You're modeling idealized philosophers, not actual brains."

  **Reply:**
  "I distinguish competence from performance. The argument rests on the *capacity* to recognize inconsistency once clarified, not on infallibility in real-time. When a contradiction is pointed out, the human practitioner can acknowledge it and revise the system. A formal system $S$ cannot acknowledge its own inconsistency without trivializing. The empirical errors you cite are performance failures under noise, not structural incapacities. The mechanist model fails even in principle; the human model fails only in practice. That distinction is precisely where the asymmetry lives."

  **Weakest Point:** Risks sounding like an ad hoc rescue ("it's in principle only") which weakens the claim that this matters for actual cognitive science.

  4. **Objection (Senior Mechanist): The Category Mistake**
  "You're treating the mind as a theorem-prover. But cognition is for survival, not truth. Consistency is a luxury, not a functional requirement. Why think the brain even *has* a consistency constraint to violate?"

  **Reply:**
  "For general cognition, you might be right. But we are discussing *mathematical* cognition specifically. In this domain, the functional goal *is* truth preservation. When a mathematician works, they are intentionally engaging in a consistency-bound practice. If you model this specific subsystem as mechanistic, Gödel applies. You cannot dismiss the normativity of mathematics while proposing a formal model of mathematical reasoning. If the model ignores the consistency constraint, it isn't a model of mathematics."

  **Weakest Point:** Concedes the argument may not apply to general mind, limiting the scope of the anti-mechanist claim to a narrow slice of cognition.

  5. **Objection (Cognitive Scientist): The Neural Idealization**
  "Formal systems are discrete; brains are continuous, noisy, and analog. Applying Gödel to neural nets is like applying traffic laws to water flow. The mapping from neuron to symbol is too lossy to sustain your logical asymmetry."

  **Reply:**
  "I am not mapping neurons to symbols directly. I am mapping the *computational level* description of the cognitive task to the formal system. Regardless of neural implementation, if the system produces mathematical outputs assessable for truth, it falls under logical constraints. Marr's computational level remains valid even if the implementation is messy. If the output behaves like a formal system, it is vulnerable to formal limitations. The noise might hide the inconsistency, but it doesn't remove the logical bound."

  **Weakest Point:** Assumes the brain operates at a clean computational level that can be isolated from implementation noise, which connectionists dispute.

  6. **Objection (AI Grad Student): The Subsymbolic Shift**
  "Modern AI isn't rule-based $S$; it's neural networks trained on gradients. They don't 'prove' consistency. Your argument targets straw-man symbolic AI, not contemporary machine learning models of cognition."

  **Reply:**
  "Even subsymbolic models are proposed as accounts of human mathematical competence. If a neural net claims to model how humans grasp truth, it must be assessable against truth conditions. If the net produces outputs equivalent to a formal system, the limitation applies to the *model*, even if the internal weights are continuous. Furthermore, if the net cannot explain *why* it trusts a result (reflective equilibrium), it fails to model the practitioner's epistemic stance. You can hide the logic in weights, but you cannot escape the logic of the output."

  **Weakest Point:** Struggles to apply Gödelian constraints directly to non-symbolic, probabilistic architectures without significant translation caveats.

  7. **Objection (Logician): The Trivialization**
  "You define 'human practice' as whatever escapes $S$. This is circular. You're guaranteeing anti-mechanism by fiat rather than proof. Any time $S$ catches up, you say 'that wasn't the real practice.'"

  **Reply:**
  "It is not circular; it is phenomenological. I am reporting on the experience of mathematical discovery—the feeling of seeing truth beyond proof. This is data. The mechanist must explain away this data as illusion. I am not moving the goalposts; I am pointing out that the field changes when the player steps back to reflect. The 'practice' is defined by the reflective capacity, which is observable. If you formalize the reflection, you haven't captured the reflection; you've captured its shadow."

  **Weakest Point:** Relies on introspection as evidence, which is notoriously unreliable in philosophy of mind and easy for empiricists to dismiss.

  ***

  **OPENING CONCESSIONS**
  1.  **Logical Omniscience:** Explicitly concede humans are not logically omniscient and cannot survey all systems simultaneously. This disarms the standard "Benacerraf" objection immediately.
  2.  **Physicalism:** Concede the brain is a physical system subject to causal laws. Do not argue for dualism; argue for computational irreducibility.
  3.  **Gödel's Scope:** Concede Gödel's theorems do not *prove* the mind is non-mechanical on their own; they only establish the conditional asymmetry you are defending.

  **STRATEGIC NOTE: PRIORITY AVOIDANCE**
  **Do not invite Objection #2 (The Complexity Collapse).** This is the specific vulnerability of your "resource-bounded" reformulation. If pressed on the computational complexity of "conceptual clarification," you lack a formal model to prove it is polynomial-time for humans but not for $S$. If this is raised, pivot immediately to Objection #3 (Empirical Fallibility) and argue that "efficiency" is heuristic, not worst-case complexity.
