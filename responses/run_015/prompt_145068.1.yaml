answer: |-
  This is a sharp analysis. You've correctly identified that "he was a man of his time" is not a single argument but a shapeshifter—a rhetorical Swiss Army knife that deploys different blades depending on which one won't get parried. Your dad's sliding between versions isn't accidental; it's the phrase's primary survival mechanism.

  Here is the menu of precise claims the sentence can make, ranked from trivially true to philosophically toxic, evaluated against your tests.

  ### The Menu of Meanings

  #### 1. The Descriptive Claim ("Everyone Did It")
  *   **The Claim:** At the time, the behavior was universal or near-universal. There was no significant dissent.
  *   **Verdict:** **Factually False** for Jefferson and Churchill. There were abolitionists in Jefferson's lifetime; there were critics of imperialism in Churchill's. It is arguably true for Columbus regarding violence/conquest, but not regarding specific atrocities which were condemned even by some contemporaries.
  *   **Test Results:**
      *   *Asymmetry:* **Fails.** If the claim is "beliefs are determined by consensus," then abolitionists were "men of their time" too (just a fringe time). But we praise them for *breaking* consensus.
      *   *Factual Check:* **Fails.** As you noted, dissenters existed. If the phrase requires universal consensus to excuse, it rarely applies.

  #### 2. The Epistemic Claim ("He Couldn't Know")
  *   **The Claim:** The moral information required to judge the act as wrong was not available to him. He lacked the data or the conceptual framework.
  *   **Verdict:** **Plausible for Columbus, False for Jefferson/Churchill.** By the late 1700s, the arguments against slavery were well-publicized (e.g., Somerset case 1772). By the 1940s, anti-colonial arguments were robust.
  *   **Test Results:**
      *   *Forward:* **Survives (with cost).** If your dad admits Jefferson *could* have known but didn't look, this collapses into negligence. If he admits *we* might be missing info now, he undermines his certainty that we are right to judge.
      *   *Asymmetry:* **Fails.** Abolitionists had the same information access as slaveholders. If info determines morality, they shouldn't be praised for seeing what was visible to all.

  #### 3. The Relativist Claim ("It Wasn't Wrong Then")
  *   **The Claim:** Morality is time-bound. Slavery was morally permissible in 1790; it is only impermissible now.
  *   **Verdict:** **Philosophically Toxic.** This implies there is no objective moral truth, only temporal consensus. If slavery wasn't wrong then, why is it wrong now? Just because the calendar turned?
  *   **Test Results:**
      *   *Forward:* **Fails Catastrophically.** If morality is relative to the era, then in 2125, eating meat *will* be objectively wrong, and we are morally guilty. Your dad wants to claim we "know better" (progress), but this claim denies progress is possible, only change.
      *   *Symmetry:* **Fails.** If bravery was "ordinary" then, does that make it less good? Relativism cuts both ways. If bad acts aren't bad because they were common, good acts aren't good if they were common.

  #### 4. The Mitigation Claim ("He Was Pressured")
  *   **The Claim:** The act was wrong, but social, economic, and legal pressures made it exceptionally difficult for him to act otherwise. He is less *blameworthy*, even if the act was bad.
  *   **Verdict:** **Strongest Moral Defense, Irrelevant to Honor.** This concedes the act was wrong but argues for leniency on the *agent*.
  *   **Test Results:**
      *   *Asymmetry:* **Fails.** Abolitionists faced *more* pressure (social ostracization, economic loss) than slaveholders did to conform. If pressure mitigates blame, the conformist slaveholder is less blameworthy than the abolitionist? That inverts our moral intuition.
      *   *Three-Target:* **Survives Blame, Fails Honor.** It explains why we don't dig up his grave, but it doesn't explain why we put his name on a school. We don't name schools after people we pity or excuse; we name them after people we emulate.

  #### 5. The Commemorative Claim ("We Honor the Achievement, Not the Man")
  *   **The Claim:** The name on the building represents a specific contribution (writing the Declaration, winning the war), not a moral endorsement of the whole biography.
  *   **Verdict:** **Pragmatically Plausible, but Contested.** This shifts the debate from morality to utility.
  *   **Test Results:**
      *   *Three-Target:* **Survives.** This explicitly separates *blame* from *commemoration*.
      *   *Forward:* **Survives.** We can acknowledge a contribution while acknowledging future generations might reject the values underlying that contribution.
      *   *Weakness:* It assumes the "achievement" isn't tainted by the "flaw." (e.g., Was Jefferson's political philosophy *enabled* by his slave wealth? If so, they aren't separable.)

  ---

  ### Diagnosis: What Your Dad Was Actually Saying

  Your dad slid between these because each one plugs a different hole in the dam. Here is the likely mapping for your three targets:

  **1. Jefferson (Slavery)**
  *   **Primary Reading:** **The Descriptive Claim ("Everyone did it")** mixed with **Mitigation.**
  *   **Why:** This is the easiest sell in American history. It relies on the myth of universal Southern participation to dilute individual responsibility.
  *   **Does it get him to "Drop it"?** No. Even if everyone did it (false), and even if he was pressured (plausible), that addresses *blame*, not *honor*. It argues he shouldn't be *condemned*, not that he should be *celebrated*. A school name is celebration.

  **2. Churchill (Empire/India)**
  *   **Primary Reading:** **The Epistemic Claim ("That's how the empire talked").**
  *   **Why:** This frames racism as a linguistic or cultural norm rather than a moral choice. It suggests he was speaking the "language of the time," implying a lack of intent or malice.
  *   **Does it get him to "Drop it"?** Weakly. Churchill's views on India were not just "talk"; they were policy (e.g., the Bengal famine). The Epistemic claim fails here because the consequences were visible and contemporaries objected.

  **3. Columbus (1400s Standards)**
  *   **Primary Reading:** **The Relativist Claim ("Can't hold him to 2020 standards").**
  *   **Why:** The time gap is largest here, making the "moral progress" argument feel strongest. It relies on the intuition that medieval morality is simply a different operating system.
  *   **Does it get him to "Drop it"?** No. This triggers the *Forward Test*. If we accept this, we admit our own morality is temporary. It also fails the *Three-Target* test: even if we don't blame Columbus, do we want a school to signal that "conquest and colonization" are the values we teach?

  ---

  ### The School Name Verdict

  You asked which version is strong enough to settle the school-name question. **None of them are.**

  Here is why: The "Man of His Time" defense is a **defense of the *past* (the person)**, but the school name is a **statement about the *future* (the students).**

  *   **The Three-Target Distinction is your winning move.**
      Your dad is using "Man of His Time" to argue about **Blame** (Target 2).
      The school board decision is about **Commemoration** (Target 3).

      Even if we accept the **Mitigation Claim** (Reading 4)—that Jefferson is less blameworthy because of his era—that does not logically lead to keeping the name.
      *   *Analogy:* If a beloved teacher from the 1970s was caught smoking in class, we might say "he was a man of his time, don't fire him posthumously." But we wouldn't name the new library after him.
      *   *Logic:* Excusing a flaw is not the same as elevating a virtue.

  *   **The Asymmetry Test is your hammer.**
      If the criterion for a name is "did they fit in with their time?", then the most moral people (who often defy their time) are disqualified.
      *   If Jefferson gets the name because he was a "normal" slaveholder, then the abolitionist who lost everything to fight slavery is *less* eligible because they were "abnormal."
      *   Schools should name people who represent the values we *aspire to*, not the values that *were*.

  ### How to Argue This Next Time

  Don't fight the history; fight the function of the name.

  1.  **Concede the Blame, Deny the Honor:** "Dad, I'll grant you the Mitigation Claim. Let's say Jefferson isn't personally evil by 1790 standards. That settles whether we burn his books. It doesn't settle whether we put his name on a building."
  2.  **Invoke the Forward Test:** "If we keep the name because 'he was a man of his time,' we are telling the kids that 'conforming to the moral blind spots of your era' is acceptable. But in 2125, they will look at *our* blind spots. Do we want to teach them to hide behind 'that's how we talked then'?"
  3.  **The "Menu" Trap:** "You used three different definitions tonight. For Jefferson you said 'everyone did it.' For Churchill you said 'he couldn't know.' For Columbus you said 'morality changes.' Which one is the actual rule? Because if it's 'everyone did it,' we can't name schools after pioneers. If it's 'morality changes,' we admit we might be wrong. You can't use the phrase to mean whatever keeps the statue up."

  **The Verdict:** "Man of His Time" is a valid shield against *damnation*, but it is a invalid sword for *canonization*. It explains why we don't destroy the past, but it doesn't explain why we must enshrine it.
