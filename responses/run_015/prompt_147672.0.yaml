  # Diagnostic Taxonomy: Research Programme Commitments

  ### Root Question
  **"When a mature research programme encounters a persistent empirical anomaly, is its hard core ever rationally revisable?"**
  *   **Branch A (Yes):** The core is fallible and open to revision.
  *   **Branch B (No):** The core is immune to direct refutation by methodological fiat.

  ---

  ### Dimension 1: The Constitution of the Hard Core
  *Claim: "The hard core is best understood as possessing a protected status (either metaphysical commitments or methodological rules) rather than a theoretical network with no special protected status."*
  *   **Accept (Protected):** The core has a distinct, shielded ontological or rule-based status.
  *   **Reject (Network):** The core is merely a set of theories with no structural immunity.

  *(Note: Branch A/Reject and Branch B/Access are the only logically coherent paths. The other two combinations terminate immediately as leaves.)*

  #### **Leaf 1: [Branch A + Accept]**
  *   **Position:** **Incoherent Falsificationism** (Unoccupied)
  *   **Awkward Commitment:** Asserts that the core is both rationally revisable upon anomaly and yet possesses a protected status that shields it from such revision.
  *   **Diagnosis:** **Incoherent.** The definition of "protected status" contradicts the root commitment to revisability; this path terminates here.

  #### **Leaf 2: [Branch B + Reject]**
  *   **Position:** **Dogmatic Conventionalism** (Unoccupied)
  *   **Awkward Commitment:** Maintains that the core is immune to revision despite admitting it holds no special metaphysical or methodological status warranting such immunity.
  *   **Diagnosis:** **Unmotivated.** Without a protected status (metaphysical or methodological), immutability reduces to arbitrary dogmatism; this path terminates here.

  ---

  ### Dimension 2: The Normative Criterion for Auxiliary Adjustments
  *Claim: "Rationality requires that changes to the protective belt generate novel predictions (a progressive problem-shift) rather than merely preserving overall explanatory coherence."*
  *   **Accept (Novelty):** Rationality is tied to heuristic progress and new facts.
  *   **Reject (Coherence):** Rationality is satisfied by internal consistency and saving the phenomena.

  *(Note: For positions prioritizing Coherence, the Meta-Methodological distinction collapses, as ad hoc adjustments are typically evaluated retrospectively by coherence, not empirical history. These paths terminate here.)*

  #### **Leaf 3: [Branch A + Reject + Reject]**
  *   **Position:** **Anarchist Historicism** (e.g., Feyerabendian/Kuhnian Hybrid)
  *   **Awkward Commitment:** Commits to the view that a theory can be rationally maintained through ad hoc adjustments provided it coheres with the paradigm, even if it predicts nothing new.
  *   **Diagnosis:** **Occupied.** (Terminates here; Meta-methodology is indeterminate).

  #### **Leaf 4: [Branch B + Accept + Reject]**
  *   **Position:** **Degenerating Lakatosianism**
  *   **Awkward Commitment:** Acknowledges a programme is degenerating (ad hoc) but insists it remains rationally acceptable solely due to its historical coherence and lack of a better alternative.
  *   **Diagnosis:** **Occupied.** (Terminates here; Meta-methodology is indeterminate).

  ---

  ### Dimension 3: The Meta-Methodological Status of Evaluation
  *Claim: "The distinction between progressive and degenerating programmes is an empirical-historical judgment that can be shown false by the record of science, rather than a normative reconstruction applied retrospectively by philosophers."*
  *   **Accept (Empirical):** The status is a matter of historical fact.
  *   **Reject (Normative):** The status is a philosophical stipulation used to reconstruct history.

  #### **Leaf 5: [Branch A + Reject + Accept + Accept]**
  *   **Position:** **Orthodox Popperian Falsificationism**
  *   **Awkward Commitment:** Must treat the decision to revise a core theory as an empirical-historical fact, implying that rationality is observable in the historical record without philosophical reconstruction.
  *   **Diagnosis:** **Occupied.**

  #### **Leaf 6: [Branch A + Reject + Accept + Reject]**
  *   **Position:** **Normative Critical Rationalism** (Unexplored Hybrid)
  *   **Awkward Commitment:** Holds that core theories are revisable and require novelty, yet insists the evaluation of this novelty is a normative philosophical reconstruction rather than an empirical historical fact.
  *   **Diagnosis:** **Unexplored.** Logically available, but rarely defended; most fallibilists prefer empirical criteria for revision.

  #### **Leaf 7: [Branch B + Accept + Accept + Accept]**
  *   **Position:** **Dogmatic Falsificationist Variant** (Unoccupied)
  *   **Awkward Commitment:** Claims the hard core is immutable, yet insists the judgment of the programme's progress is an empirical-historical fact that could falsify the methodology itself.
  *   **Diagnosis:** **Unmotivated.** If the core is immutable by fiat, empirical history cannot falsify the methodological rule protecting it; the empirical claim is vacuous.

  #### **Leaf 8: [Branch B + Accept + Accept + Reject]**
  *   **Position:** **Orthodox Lakatosianism**
  *   **Awkward Commitment:** Must maintain that the judgment of a programme as "degenerating" is a normative reconstruction that cannot be empirically falsified by the very history it seeks to reconstruct.
  *   **Diagnosis:** **Occupied.**

  ---

  ### Limitations and Collapsed Distinctions

  **1. Metaphysical vs. Methodological Hard Core**
  This tree cannot cleanly separate positions that view the hard core as a **cluster of metaphysical commitments** from those viewing it as a **set of methodological rules**.
  *   **Reason:** Both options fall under the "Protected Status" branch of Dimension 1. While Lakatos distinguishes them, most operational defenses of MSRP treat them functionally identically regarding immunity. To separate them would require a fourth dimension, exceeding the leaf count constraint.

  **2. Kuhnian vs. Feyerabendian Coherence**
  This tree cannot cleanly separate **Thomas Kuhn's paradigm-based coherence** from **Paul Feyerabend's epistemological anarchism** (Leaf 3).
  *   **Reason:** Both positions reject the requirement for novel predictions (Dimension 2) in favor of coherence or pragmatic survival. Since this path terminates before Dimension 3, the tree treats their meta-methodological commitments as indistinguishable, despite Kuhn's historical focus versus Feyerabend's anti-method stance.

  **3. The "Unmotivated" Dogmatic Falsificationist (Leaf 7)**
  The distinction between Leaf 7 and Leaf 8 collapses in practice.
  *   **Reason:** Any position claiming the core is immutable (Branch B) but evaluation is empirical (Leaf 7) inevitably retreats to the normative stance (Leaf 8) when faced with counter-evidence, as admitting empirical falsification of the methodology would undermine the immunity of the hard core.
