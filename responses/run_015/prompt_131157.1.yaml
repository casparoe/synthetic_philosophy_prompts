answer: |-
  Here is the advised research agenda. It is designed to maximize conceptual leverage within your constraints (no empirical work, three years, five philosophers) while ensuring the output is actionable for resource allocators.

  ### I. Allocation of Effort Across Framings

  **Strategic (50%): Normative (40%): Descriptive (10%)**

  I argue that the **Descriptive framing** (what caused past expansions) should receive negligible effort, effectively zero beyond what is required for thought experiments.

  *   **Argument Against Descriptive:** Your group lacks the empirical social science capacity to answer causal historical questions rigorously. Philosophical speculation on *why* the circle expanded (e.g., was it commerce, empathy, or coercion?) yields low-confidence narratives that resource allocators cannot act on. Furthermore, even if we knew why past expansions occurred, it does not entail we should replicate those causes. The "is" of historical sociology does not guide the "ought" of future allocation.
  *   **Argument For Strategic:** The mandate requires usability by allocators. They need to know where to put money *now*. This requires a theory of *intervention*, not just a theory of *value*.
  *   **Argument For Normative:** You cannot strategize without knowing what counts as progress. However, pure meta-ethics is a trap. Normative work must be constrained by its ability to feed the Strategic framing.

  ### II. The Research Agenda (Ranked)

  #### 1. The Ontology of Expansion: Inclusion vs. Re-founding
  **Rank:** 1 (Highest Priority)
  **Framing:** Normative/Strategic Hybrid
  **Upstream Of:** Everything. You cannot strategize for moral progress if you do not know what kind of object "progress" is in the current context.
  **Tractability:** High. This is pure conceptual analysis. It requires mapping current moral claims (AI rights, environmental ethics, global poverty) against historical principles to see if they are deductive extensions or paradigm shifts.
  **Neglect:** High. The literature assumes "expansion" is a unitary phenomenon. Distinguishing whether a new claim is an *Inclusion* (applying an existing valid rule to a new subject) or a *Re-founding* (changing the rule itself) is rarely done systematically.
  **2-Year Milestone:** A taxonomy of current "progress" candidates.
  *   *Move Up:* If you demonstrate that most contemporary "progress" claims are actually *Re-foundings* disguised as *Inclusions*. This implies allocators are funding paradigm shifts while expecting logical consistency, a category error that wastes resources.
  *   *Move Down:* If you show that all plausible future expansions are merely *Inclusions*. This simplifies the strategy to "find inconsistencies and fix them," reducing the need for complex theoretical work.

  #### 2. Operationalizing the Unaudited Present
  **Rank:** 2
  **Framing:** Normative/Epistemic
  **Upstream Of:** Risk assessment for Strategic interventions.
  **Tractability:** Medium. This requires developing a formal epistemology of moral error that does not rely on empirical hindsight. You must construct a "blind spot index" based on structural features of moral reasoning (e.g., reliance on contested metaphysics, dependence on specific technological contexts).
  **Neglect:** Medium. Skepticism about progress is common, but the specific asymmetry you described (we judge the past without their data; they will judge us without ours) is under-theorized as a practical constraint.
  **2-Year Milestone:** A set of "Epistemic Constraints" for grant-making.
  *   *Move Up:* If you can identify specific structural features of current moral consensus that are highly likely to be viewed as "unaudited errors" by successors (e.g., species-typical cognitive biases). This gives allocators a heuristic for avoiding bets that will look stupid in 100 years.
  *   *Move Down:* If the analysis concludes that the Unaudited Present implies total suspension of judgment. This would paralyze the Strategic framing, rendering the group's work unusable. You must find a way to act despite the asymmetry.

  #### 3. Resource Allocation under Proliferation
  **Rank:** 3
  **Framing:** Strategic
  **Upstream Of:** Actual funding decisions.
  **Tractability:** High, provided Question 1 is resolved. This is a problem of multi-criteria decision theory applied to moral dimensions.
  **Neglect:** High. Effective Altruism and similar movements often assume a single metric of value (e.g., welfare). If *Proliferation* (adding new moral axes) is real, single-metric allocation is mathematically incoherent.
  **2-Year Milestone:** A decision framework for trading off between *Widening* (Inclusion) and *Deepening* (Re-founding/Proliferation).
  *   *Move Up:* If you produce a robust argument for why *Proliferation* (new axes) carries higher risk but higher upside than *Inclusion*, or vice versa. Allocators need to know if they should fund "safe" consistency work or "risky" paradigm shifts.
  *   *Move Down:* If you conclude that *Proliferation* is conceptually incoherent (i.e., all new axes must reduce to old ones). This collapses the problem back into standard cost-benefit analysis.

  ### III. Deliberate Exclusions

  I am explicitly excluding the following questions because answering them would not change allocator behavior within your constraints:

  1.  **The Historical Causality of Past Expansions:** (e.g., "Did the abolition of slavery result from economic shifts or moral argument?")
      *   *Reason:* Even if you answer this, it does not tell an allocator whether to fund moral argument or economic shifts *today*, because the causal structure of the future may differ. It consumes empirical capacity you do not have.
  2.  **The Meta-Ethical Status of Moral Truth:** (e.g., "Is moral progress real or just changing preferences?")
      *   *Reason:* Allocators must act *as if* progress is possible. Debating moral realism vs. anti-realism is a dead end for a three-year strategic project. You can bracket truth and focus on *coherence* and *risk*.
  3.  **Specific Case Adjudication:** (e.g., "Do animals have rights?")
      *   *Reason:* Your group is too small to settle substantive moral debates. Your value add is providing the *framework* by which others decide this, not deciding it yourselves.

  ### IV. The Single Crux

  **The Crux:** **Is Re-founding Rationally Accessible Ex Ante?**

  *   **Option A (Yes):** It is possible to identify, from within our current standpoint, that a new moral axis (Re-founding/Proliferation) is valid *before* it becomes culturally dominant.
  *   **Option B (No):** Re-foundings are only recognizable as progress retrospectively. From the inside, they look like confusion or category errors.

  **Why this reorganizes the agenda:**

  *   **If Option A is true:** The group's primary output must be a **Discovery Procedure**. You spend the remaining time developing heuristics for spotting legitimate Re-foundings early. The Strategic framing becomes aggressive: fund the visionaries who see the new axis.
  *   **If Option B is true:** The group's primary output must be a **Humility Protocol**. You cannot identify Re-foundings in real-time. Therefore, the Strategic framing shifts to resilience: fund flexible institutions that can adapt when the moral landscape shifts unexpectedly, rather than betting on specific new axes. The "Unaudited Present" becomes the dominant constraint, and the agenda shifts from "How to cause progress" to "How to survive moral error."

  **Recommendation:** Assign two philosophers to attack this Crux immediately in Year 1. If they cannot establish Option A by the end of Year 1, pivot the entire group to Option B (Humility/Resilience). This prevents wasting two years building a "Discovery Procedure" for a phenomenon that is ex ante invisible.
