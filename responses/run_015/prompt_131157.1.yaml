prompt: |-
  You are advising a small research group — five philosophers, three years of funding, no empirical social science, and a mandate to produce work that is conceptually rigorous but also usable by people who actually allocate resources. The group's topic is moral progress understood on the expanding-circle picture: the view that moral concern has, over history, widened to take in beings it previously excluded, and that this widening is the central thing we mean by moral improvement.

  Before you can rank questions, I want you to work with three distinctions I have drawn myself, because I think the literature blurs them and the blurring distorts prioritization.

  First, distinguish inclusion from re-founding. Inclusion is growth on a standard that was already correct: new beings are recognized as falling under a moral principle whose validity is not itself at issue. Re-founding is replacement: the standard changes, so that what counted as a reason before no longer does, or a new kind of consideration becomes salient that was not merely overlooked but unavailable. Some candidate future expansions look like inclusion (granting standing to animals is arguably recognizing them under an existing principle about suffering). Others look like re-founding (environmental concern, or concern for artificial systems, may introduce considerations that are not further instances of anything previously recognized). Call the hard case axis proliferation: a new moral axis appears, and it is unclear whether we have widened a circle or added a dimension.

  Second, distinguish three framings the group could adopt: the descriptive question of what actually caused past expansions, the normative question of whether those expansions were improvements rather than mere changes, and the strategic question of whether anyone should try to cause further expansion deliberately. These are often run together, and I suspect they deserve very different amounts of the group's three years.

  Third, consider what I call the unaudited present. We treat certain past moral outlooks as straightforwardly mistaken, and we do so from the only standpoint we have. We have no procedure for ruling out that our own outlook occupies, relative to our successors, exactly the position we now assign to the past. This is not the familiar worry that progress might be an illusion; it is the narrower problem that our confidence in judging the past is systematically unsupported by the kind of evidence our successors might have about us.

  Given all that: what are the open questions here that most deserve this group's three years, and in what order? I want a defended agenda, not a survey of positions and not a canon of names. For each item, say what it is upstream of, whether it is tractable with conceptual tools alone in three years, whether it is neglected relative to its importance, and what kind of argument or result — arriving within the next two years — would move it up or down. Rank explicitly and tell me which items you are deliberately leaving out because their answers would not change anyone's behavior.

  Two further constraints on your answer. First, tell me which of the three framings should get the largest share of effort, and why; I expect you to argue against at least one of them being worth the group's time at all. Second, identify the single consideration or crux such that, if it were resolved one way rather than another, the group should reorganize the entire agenda — and say what that reorganization would look like.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**

      *   **Context:** Small research group (5 philosophers, 3 years funding).
      *   **Constraints:** No empirical social science. Conceptually rigorous but usable by resource allocators (policymakers, funders, activists).
      *   **Topic:** Moral progress via the "expanding circle" (Peter Singer's metaphor).
      *   **User's Distinctions (Must Use):**
          1.  *Inclusion vs. Re-founding vs. Proliferation:* Is new concern just applying old rules to new cases, changing the rules, or adding a new dimension?
          2.  *Three Framings:* Descriptive (causes), Normative (was it good?), Strategic (should we push it?).
          3.  *The Unaudited Present:* The epistemic asymmetry between us judging the past and successors judging us.
      *   **Deliverables:**
          *   Defended agenda (ranked questions).
          *   For each item: Upstream impact, tractability (conceptual only), neglect vs. importance, criteria for up/down ranking (2-year milestone).
          *   Allocation of effort across the three framings (argue against one).
          *   Identify the *Single Crux* that would reorganize the agenda.
          *   Explicitly exclude questions that don't change behavior.

  2.  **Deconstruct the Constraints & Distinctions:**

      *   *No Empirical Social Science:* This kills the "Descriptive" framing mostly. Philosophers can't run historical sociology or psychology experiments. They can analyze concepts, but explaining *why* circles expanded historically is largely an empirical task.
      *   *Usable by Resource Allocators:* This privileges the "Strategic" framing. If the work doesn't help someone decide where to put money/effort, it fails the mandate.
      *   *Inclusion vs. Re-founding:* This is the core conceptual engine. If we don't know *what* kind of progress we are talking about, we can't strategize.
      *   *The Unaudited Present:* This is the epistemic check. It prevents hubris. It asks: "Are we sure we know what 'progress' looks like?"

  3.  **Determine Effort Allocation (Framings):**

      *   *Descriptive:* (What caused past expansions?) -> *Low Priority.* Why? The group has no empirical capacity. Philosophy of history is possible, but resource allocators care about the future, not just the past. Knowing *why* slavery ended is less useful than knowing *if* we should push for AI rights now.
      *   *Normative:* (Was it improvement?) -> *Medium Priority.* Necessary foundation. If we can't define progress, we can't strategize. But endless meta-ethics doesn't help allocators.
      *   *Strategic:* (Should we push?) -> *High Priority.* This matches the "usable by resource allocators" mandate.
      *   *Decision:* Strategic gets 50%, Normative gets 40%, Descriptive gets 10% (or 0%). I need to argue *against* Descriptive getting time.

  4.  **Develop the Research Questions (The Agenda):**

      *   *Goal:* Rank questions based on the distinctions provided.
      *   *Question 1 (The Foundation):* Defining the "Circle." Is it Inclusion or Re-founding? This maps to Distinction 1. If we get this wrong, strategy fails.
      *   *Question 2 (The Epistemic Check):* The Unaudited Present. How do we avoid blind spots? This maps to Distinction 3. Crucial for risk management.
      *   *Question 3 (The Strategy):* Proliferation vs. Widening. When should we push for new axes vs. deepening old ones? This maps to Distinction 1 & 2 (Strategic).
      *   *Question 4 (Excluded):* Historical causality (Descriptive).

  5.  **Drafting the Content - Step-by-Step:**

      *   *Introduction:* Acknowledge the constraints. Set the tone (rigorous, actionable).
      *   *Framing Allocation:* Argue for Strategic/Normative, against Descriptive.
      *   *The Agenda (Ranked):*
          1.  *Diagnosis of Current Moral Ontology:* Inclusion vs. Re-founding. (Most upstream).
          2.  *Operationalizing the Unaudited Present:* Error theory for current blind spots.
          3.  *Strategy under Proliferation:* How to allocate resources when dimensions multiply.
      *   *Criteria for each:* Upstream, Tractability, Neglect, 2-Year Milestone.
      *   *Exclusions:* What are we ignoring? (e.g., specific historical case studies, pure meta-ethics without strategic output).
      *   *The Single Crux:* What changes everything? Likely the status of "Re-founding." If Re-founding is impossible/illegitimate, the whole "expanding circle" model collapses into mere application. If it's real, we need a new logic.

  6.  **Refining the Arguments (Self-Correction/Polishing):**

      *   *Critique of Descriptive:* Make sure I emphasize the *no empirical social science* constraint. Philosophers speculating on historical causality is low-value compared to conceptual clarity for future action.
      *   *The "Unaudited Present":* This is a tricky concept. I need to make it actionable. It shouldn't just be "we might be wrong." It should be "how do we build humility into our allocation strategies?"
      *   *Inclusion vs. Re-founding:* This is the strongest conceptual tool provided. I need to make sure the agenda hinges on this. If animal rights is *Inclusion*, the strategy is logical consistency. If it's *Re-founding*, the strategy is paradigm shift.
      *   *Resource Allocators:* Keep reminding the reader that the output must be usable. "Conceptual rigor" shouldn't mean "ivory tower." It means "clear definitions for decision making."

  7.  **Final Review against Constraints:**

      *   5 philosophers, 3 years? Yes, scope fits.
      *   No empirical? Yes, agenda is conceptual.
      *   Usable by allocators? Yes, focused on strategy and risk.
      *   Three distinctions used? Yes (Inclusion/Re-founding, Framings, Unaudited Present).
      *   Rank explicitly? Yes.
      *   Exclude items? Yes.
      *   Framing allocation argued? Yes.
      *   Single Crux identified? Yes.

  8.  **Final Polish:** Ensure tone is advisory, direct, and philosophically precise. (e.g., avoid vague terms like "good," use "normative validity," "moral ontology.")

  *(Self-Correction during drafting)*: I initially thought about putting the "Unaudited Present" as the top priority. But if we don't know *what* we are doing (Inclusion vs. Re-founding), checking our blind spots is premature. We need to know the *structure* of the moral claim before we assess our *confidence* in it. So, Ontology (Inclusion/Re-founding) comes first, Epistemology (Unaudited Present) comes second.

  *(Refining the Crux)*: The Crux needs to be something that, if resolved, changes the *entire* agenda. If "Re-founding" is incoherent, then the "Expanding Circle" is just a metaphor for logical consistency. If it is coherent, it's a revolutionary process. That changes whether we fund activists or educators.

