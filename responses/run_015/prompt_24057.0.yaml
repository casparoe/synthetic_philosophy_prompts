answer: |-
  **PREP SHEET: EPISTEMIC DEFENSE OF REFERENDA VIA CONDORCET**
  **Audience:** Social Choice Theorists (SCT) + Voting Rights Lawyers
  **Thesis:** CJT provides epistemic justification for binary referenda (common value, fact of the matter).

  ---

  ### 1. The Competence Condition (The $p > 0.5$ Problem)
  **The Objection:** "You're assuming the average competence $p$ exceeds 0.5. But in complex policy referenda, there's no mechanism to ensure voters are better than random. If $p < 0.5$, the theorem inverts: the majority becomes *less* reliable as $n \to \infty$. Without an ex-ante guarantee of competence, CJT is vacuous."
  **The Reply:** "Fair, but we shouldn't interpret $p > 0.5$ as requiring expert knowledge. It only requires a systematic bias toward the 'correct' outcome, however slight. In referenda, information campaigns and elite cues often provide a signal that, while noisy, breaks the symmetry of randomness. We aren't claiming voters are experts, only that they aren't systematically wrong more often than right. If we assume a 'meta-competence' where voters can identify credible signals, $p > 0.5$ holds."
  **Soft Spot:** You have no empirical way to prove $p > 0.5$ without knowing the truth beforehand. If the "signal" is propaganda, $p$ drops.
  **Time:** 2:00

  ### 2. The Independence Assumption (Correlation & Common Shocks)
  **The Objection:** "CJT requires voter errors to be independent. But voters share information environments—media, parties, social networks. This introduces positive correlation (common shocks). As Ladha (1992) showed, even small correlations can prevent the probability of a correct majority from converging to 1. Your epistemic gain vanishes if errors are clustered."
  **The Reply:** "Strict independence is indeed unrealistic, but the theorem is robust to *limited* correlation. We can model the electorate as independent *blocks* rather than individuals (e.g., households or local deliberative bodies). Furthermore, referenda often break party discipline, introducing idiosyncratic variance that elections don't have. The convergence might be slower, but the directional epistemic value of aggregation remains superior to individual dictatorial rule."
  **Soft Spot:** Modern media ecosystems create near-perfect correlation. If everyone reads the same misinformation, independence is dead.
  **Time:** 2:00

  ### 3. The Ontological Objection (No "Fact of the Matter")
  **The Objection:** "CJT applies to questions of fact (e.g., 'Is the defendant guilty?'). Referenda are usually normative ('Should we tax carbon?'). There is no mind-independent truth value for preference aggregation. Applying an epistemic theorem to a preference problem is a category error."
  **The Reply:** "I restrict my claim to referenda with empirical premises (e.g., 'Will this bridge cost over $1B?') or where we treat the 'common good' as a latent truth. Even in normative choices, we can model the 'truth' as the option that maximizes social welfare if we assume voters are trying to vote for the common good, not just self-interest. The theorem justifies the *procedure* of seeking that common good via aggregation."
  **Soft Spot:** SCTs hate conflating preferences with beliefs. If voters are voting self-interest, CJT is irrelevant.
  **Time:** 2:00

  ### 4. Competence Heterogeneity (The Distribution of $p$)
  **The Objection:** "You assume identical competence $p$ for all voters. In reality, competence is distributed. If the majority of voters have $p < 0.5$ even if the mean is $> 0.5$, the majority rule fails. Why weight the ignorant equally with the informed?"
  **The Reply:** "CJT holds for heterogeneous competence as long as the *average* $p > 0.5$. While weighting by competence (epistocracy) might be mathematically optimal, it fails the legitimacy test required for implementation. Majority rule is the only 'blind' mechanism that captures the aggregate signal without requiring us to identify competence ex-ante, which introduces its own bias."
  **Soft Spot:** You are conceding that majority rule is *not* epistemically optimal, only politically feasible.
  **Time:** 2:00

  ### 5. Endogenous Agenda Setting
  **The Objection:** "CJT assumes the question is given. But in referenda, elites frame the binary choice. If the agenda setter selects questions where the 'correct' answer is unpopular or frames the options to bias $p$, the theorem protects a manipulated outcome. You're defending the vote, not the choice architecture."
  **The Reply:** "This is a valid institutional critique, but distinct from the aggregation mechanism itself. CJT justifies the *counting rule* given a question. We can pair CJT with constraints on agenda-setting (e.g., citizen initiatives, neutral commissions) without discarding the epistemic value of the vote itself. Don't throw out the thermometer because someone might hold it near a heater."
  **Soft Spot:** Lawyers in the room will argue the framing *is* the vote.
  **Time:** 2:00

  ### 6. Strategic Voting vs. Sincere Revelation
  **The Objection:** "CJT assumes sincere voting for the 'truth'. But Feddersen and Pesendorfer (1996) show that in common-value settings, rational voters may abstain or vote strategically based on the probability of being pivotal. This 'Swing Voter's Curse' disrupts the information aggregation CJT relies on."
  **The Reply:** "That model applies primarily to elections with private information. In large-scale referenda, the probability of being pivotal is effectively zero, which paradoxically encourages expressive or sincere voting rather than strategic calculation. The 'cost' of voting for truth is low enough that the sincere voting assumption holds better in referenda than in legislative voting."
  **Soft Spot:** Behavioral evidence suggests voters are often irrational, not rational/sincere.
  **Time:** 2:00

  ---

  ### THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "If the competence $p$ is unknown and the independence assumption is violated, isn't CJT just a 'just-so story'? Can you name a single historical referendum where we can verify the theorem actually produced the 'true' outcome, or is this purely unfalsifiable?"

  **Why it hurts:** It forces you to admit that CJT is a normative ideal, not a descriptive tool. If you can't point to a case where we *know* the majority was right because of CJT, your empirical claim collapses.

  **The Pivot Reply:** "It's not a predictive model for specific cases; it's a justification for the *institution*. We don't need to verify the truth of every past referendum to justify the mechanism that *tends* toward truth better than alternatives. We use it the same way we use the Central Limit Theorem—to justify the stability of the aggregate, not to predict every data point."

  ---

  ### TACTICAL NOTES FOR Q&A
  *   **On Independence:** If they press hard, concede "strict independence" but pivot to "conditional independence given common signals." It sounds technical and saves the math.
  *   **On Competence:** Do not claim voters are smart. Claim the *system* is smart. The "wisdom" is in the aggregation, not the input.
  *   **On Lawyers:** They will care about rights, not truth. If they push "tyranny of the majority," remind them CJT only applies to *common value* questions, not rights violations (which are constraints, not votes).
  *   **General Demeanor:** You are defending a *theorem*, not a specific political outcome. Stay in the math. If they move to philosophy, pull them back to the assumptions ($n \to \infty$, $p > 0.5$).
