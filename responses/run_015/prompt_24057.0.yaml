prompt: |-
  I just spent the last two hours arguing with my friend about whether Condorcet's jury theorem actually justifies referendums, and he got under my skin on a couple points I'm not sure I can recover from. Next week I'm presenting to a political science reading group that's mostly social choice theorists plus a couple of voting-rights lawyers, and I want to be ready for the Q&A. My thesis is basically that the theorem gives a real epistemic defense of majority rule on referenda (not elections) — on a yes/no question with a fact of the matter, the majority is more likely to be right than any single voter as long as each voter beats a coinflip and their errors arent perfectly correlated. Can you draft me a prep sheet: the six or seven objections I'll actually get from social choice theorists (not the generic "democracy is about legitimacy" stuff a layperson would say), each phrased the way a social choice theorist would put it, ordered by how much damage theyd do, with a two-minute reply and a note on where my reply is soft. I especially want you to nail the ones about the independence assumption and the competence condition, because that's where my friend got me. And include the question I'm hoping nobody asks.
