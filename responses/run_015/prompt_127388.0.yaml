          *   *Verdict:* The practice *accommodates* token-identity (as a model), but strictly *requires* a functionalist type-realism to justify the error correction methods (fixing the "message" rather than the "molecule"). It pushes towards **Non-Reductive Physicalism**.

      *   **3. Fidelity: Information-Preservation vs. Molecular-Stability:**
          *   *The Shift:* Measuring fidelity by sequence identity (syntax) rather than bond stability (physics).
          *   *Commitment:* This presupposes that the *identity* of the system lies in the pattern, not the matter. This is the **Pattern-Identity Thesis**.
          *   *Implication:* Replication *is* an information problem. If it were just a chemical problem, you'd optimize for reaction rates, not sequence fidelity per se (unless sequence dictates rate). But the user says they use noise filters (coding theory), which implies the channel is distinct from the message.

      *   **4. Gödel-Style Self-Reference: Literal vs. Analogical:**
