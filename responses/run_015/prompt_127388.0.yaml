      *   *Ontological Tension:* Physicalism (DNA is just molecules) vs. Informational Realism (DNA is a message/code).
      *   *Self-Reference:* The claim is that the DNA encodes the machinery that reads it. This is strong. Usually, DNA encodes proteins, but the *machinery* (polymerases, ribosomes) is often encoded elsewhere in the genome or provided by the host. If the circuit is *self-replicating* and includes the description of its own replicase, that's autopoietic in a strong sense.
      *   *Gödel Analogy:* Gödel numbering maps syntax to arithmetic. Here, syntax (DNA sequence) maps to function (machinery). The "self-reference" is that the sequence specifies the reader.
