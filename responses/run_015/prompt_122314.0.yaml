      *   *Point 1: The Function of the Word.* Law needs a knife to cut specific individuals. Morality needs a umbrella to cover collective suffering.
      *   *Point 2: The Intent Requirement.* Why is it there? To distinguish *malice* from *negligence* or *consequence*. If I build a dam that floods your land, is it genocide? Legally, no, unless I built it *to* flood your land to kill you. Morally, the result is the same.
      *   *Point 3: The Inflation Risk.* If everything is genocide, nothing is. We need a "crime of crimes."
      *   *Point 4: The Missing Piece.* Cultural genocide. Acknowledge the political excision.
      *   *Synthesis:* The boundary exists to preserve the utility of criminal law, but it fails to capture the full moral reality. The user is right to feel the dissonance.

  8.  **Final Review against Constraints:**
