answer: |-
  Your framing is not confused. You have identified a genuine fissure in the concept, not a misunderstanding of it. The tension you feel is not an accident; it is the result of trying to force a sociological reality into a criminal law framework.

  To answer your question directly: **Yes, there is a coherent conceptual boundary, but it is functional, not moral.** The boundary exists because the legal category and the moral/sociological category are trying to do two fundamentally different jobs.

  Here is the breakdown of why that boundary exists, why it creates the friction you describe, and what happens if you remove it.

  ### 1. The Juridical Function vs. The Descriptive Function
  The legal definition of genocide is not designed to describe the full extent of a group's suffering. It is designed to secure a criminal conviction against a specific human being.

  *   **Criminal Law requires an individual mind.** You cannot put a "bureaucracy," an "economic system," or an "ecological policy" on trial. You can only try individuals. To convict an individual of the "crime of crimes," you must prove that *their specific mind* intended the specific result.
  *   **Activism/Sociology describes a condition.** When activists use the word, they are describing the *ontological status* of the group. They are asking: "Is this group being erased?" From the perspective of the victim, the outcome (erasure) matters more than the specific mental state of the perpetrator.

  The friction arises because you are using one word to bridge two different logics: the logic of **culpability** (who is to blame?) and the logic of **catastrophe** (what is happening?).

  ### 2. Why Intent is the Firewall
  You asked if there is a deeper conceptual reason why genocide must remain tied to specific intent, or if broadening it would collapse the distinction between genocide and other oppression.

  The conceptual reason is **distinguishing malice from consequence.**

  If you remove the requirement for specific intent to physically destroy, the category of genocide expands to include any policy that results in the dissolution of a group, regardless of whether that dissolution was the goal or merely a side effect.
  *   **Example:** A state builds a dam for electricity. It floods the ancestral land of an indigenous group, forcing dispersal and cultural death.
  *   **Without Intent:** This is genocide (the group is destroyed).
  *   **With Intent:** This is only genocide if the state built the dam *in order to* destroy the group. If they built it for profit and knew the group would suffer but didn't care, it is legally "crimes against humanity" or "persecution," but not genocide.

  If you remove the intent requirement, genocide becomes synonymous with **structural violence.** While structural violence is morally horrific, conflating it with genocide creates a conceptual problem: it removes the element of *will*.

  The unique horror of genocide, conceptually, is not just that a group dies, but that their death is **willed** by another. It is the transformation of murder from a crime of passion or negligence into an industrial project. If you broaden the definition to include ecological collapse or economic pressure without proof of that specific will, you lose the ability to distinguish between a government that is *trying* to erase a people and a government that is *recklessly indifferent* to them. Both are terrible, but they are conceptually distinct modes of destruction.

  ### 3. The Risk of Conceptual Inflation
  You asked if broadening the definition would collapse the distinction between genocide and other forms of mass oppression. The answer is yes.

  Genocide functions as a "threshold concept." It is the outer limit of human wrongdoing. For a threshold to work, it must be high. If "genocide" applies to:
  1.  Mass killing with intent (Legal definition)
  2.  Cultural erasure without killing (Lemkin's broader view)
  3.  Structural dispossession without explicit intent (Activist view)

  ...then the word loses its ability to signal the *specific* evil of attempted biological extinguishment. If everything that severely harms a group is genocide, then genocide is just another word for "severe injustice." This dilutes the moral urgency of the term. It becomes a rhetorical tool rather than a precise diagnostic one.

  ### 4. Where Your Framing Hits the Wall
  You noted that Lemkin's original concept included culture and institutions, but the legal definition excised this. You are correct that this creates a gap where "moral harm may be more total" than the legal definition allows.

  However, this wasn't a conceptual error; it was a political calculation. The states drafting the convention (including colonial powers) knew that if "cultural genocide" remained in the definition, their own assimilation policies (residential schools, language bans, etc.) would become illegal. They narrowed the definition to protect themselves.

  So, the tension you feel is not just between "lawyers and activists." It is between **what the word ought to mean morally** (Lemkin's vision of group destruction) and **what the word is allowed to mean politically** (a narrow constraint that protects state sovereignty).

  ### Conclusion
  The conceptual boundary is coherent, but it is unsatisfying.
  *   **Legally,** the boundary must be narrow (intent + physical destruction) to isolate individual guilt.
  *   **Morally,** the boundary feels wrong because a group can be destroyed by slow violence just as effectively as by fast bullets.

  You are not treating a legal technicality as a moral problem; you are correctly identifying that the legal technicality was designed to *exclude* certain moral problems.

  If you broaden the definition to cover structural and ecological destruction without specific intent, you do gain a more accurate description of the victim's experience. However, you lose the ability to distinguish between **extermination** (we want you dead) and **extraction** (we want your land, and you dying is acceptable collateral). Both result in death, but they require different remedies. One requires a tribunal; the other requires structural revolution.

  The word "genocide" is currently stuck trying to serve both masters. It cannot. It is either a precise legal charge requiring proof of a specific mind, or it is a broad moral accusation describing a collective fate. When you try to make it both, you get the knot you are experiencing.
