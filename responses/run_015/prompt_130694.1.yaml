answer: |-
  **Title:** The Diachronic Coalition: Temporal Slices and the Rationality of the Hitchhiker

  **Introduction**

  Parfit's Hitchhiker problem presents a stark challenge to standard conceptions of practical rationality. Stranded in the desert, you are offered a ride by a driver who will only save you if you promise to pay £100 upon arrival. The driver is an adept lie detector; if you intend to renege, he leaves you to perish. Once you arrive in town, however, the threat is gone. You are safe, and keeping the promise costs you £100 with no apparent return. Standard causal decision theory suggests that paying is irrational, as the payment cannot causally influence the past rescue. Yet, intuitively, a rational agent should be the sort of person who pays, for otherwise, they would never be rescued in the first place.

  The puzzle deepens when we interrogate the metaphysics of the agent. If we model the agent not as a unified, enduring substance, but as a sequence of temporal slices—distinct person-stages linked by psychological continuity and physical causation—the obligation to pay becomes even more precarious. In this model, the 'Desert Slice' makes the promise, but the 'Town Slice' holds the wallet. If each slice possesses veto power over the commitments of its predecessors, does the Hitchhiker argument collapse? This essay argues that the Hitchhiker argument survives the temporal slice model, but only if we reject the assumption that rationality is local to the slice. Rationality must be understood as a property of the temporally extended sequence. Consequently, the 'veto power' of the present slice is not a licence for defection, but a test of diachronic coherence.

  **The Fragmented Self and the Veto Power**

  To understand the threat posed by the temporal slice model, one must first appreciate the autonomy it grants to the present moment. In a perdurantist or stage-theory framework, the agent at time *t1* (the desert) and the agent at time *t2* (the town) are distinct entities. They are related, certainly, much like identical twins or close allies, but they are not numerically identical. The Desert Slice desires survival; the Town Slice desires wealth retention.

  If we grant each slice veto power, we grant the Town Slice the right to assess commitments based solely on its local payoff matrix. From the perspective of the Town Slice, the Desert Slice is effectively a different person who has already secured the benefit (survival). The cost of that benefit was borne by the risk of the Desert Slice, not the Town Slice. For the Town Slice to pay is to sacrifice its own resources for the sake of a past entity that no longer exists. If rationality is defined as the maximisation of the current slice's utility, then vetoing the payment is the only rational move.

  This creates a paradox of pre-commitment. If the Town Slice is rational in this narrow sense, the Desert Slice knows it will not pay. Knowing this, the Desert Slice cannot sincerely promise. The driver, detecting the insincerity, refuses the ride. The Desert Slice dies. Thus, the very rationality of the Town Slice ensures the non-existence of the sequence. The veto power, exercised in the name of local rationality, destroys the conditions necessary for the slice's own existence.

  **The Case for a Rational Coalition**

  Does this mean the Hitchhiker argument fails under the slice model? Not necessarily. It fails only if we insist that the unit of rational evaluation is the individual slice. If, instead, we view the sequence of slices as a diachronic coalition, the logic shifts. We might conceive of the temporal parts of a person as members of a team engaged in a repeated game against the world. In team reasoning, an individual member does not ask, 'What maximises my payoff?' but rather, 'What maximises the team's payoff, given that everyone else is doing their part?'

  Applied to the Hitchhiker, the Desert and Town Slices are partners in a joint venture: the continuation of a life. The Desert Slice's role is to secure transport; the Town Slice's role is to honour the terms of transport. If the Town Slice exercises its veto, it is effectively defecting from the coalition. While this yields a local gain (£100), it undermines the strategy of the coalition as a whole. If 'defecting upon arrival' becomes the standard strategy for Town Slices, then drivers will stop picking up Desert Slices. The coalition fails.

  Therefore, the slices can form a rational coalition that binds itself, provided the slices recognise their membership in the extended sequence. The binding force is not metaphysical identity—the slices remain distinct—but rational interdependence. The Town Slice should pay not because it *is* the Desert Slice, but because it *belongs* to the same strategic sequence. To veto the payment is to act as a rogue agent, prioritising local gain over the viability of the entire life-plan. In this light, the rational action for the Town Slice is to respect the pre-commitment, thereby validating the strategy that allowed it to exist in the town in the first place.

  **Defending the Coalition Against the Veto**

  The strongest objection to this coalition view is the reality of veto power. A team member can physically refuse to play their part. The Town Slice *can* keep the money. There is no metaphysical glue forcing the hand. To claim the argument still works, we must distinguish between the *capacity* to veto and the *rationality* of vetoing.

  Proponents of the slice model often assume that because the slices are distinct, the interests of one slice cannot normatively bind another. This assumes a form of 'temporal solipsism' where the only reasons that count are those present to the current consciousness. However, this ignores the counterfactual dependence of the present slice on the past slice. The Town Slice exists in a state of safety only because the Desert Slice successfully negotiated with the driver. That negotiation was contingent on the expectation of payment.

  If the Town Slice vetoes the payment, it retrospectively renders the Desert Slice's actions irrational. But more importantly, it signals to any future 'Desert Slices' (in subsequent dilemmas) that pre-commitment is unreliable. Since the agent is a sequence, the Town Slice is merely a temporary custodian of the sequence's reputation. Exercising the veto is an act of cannibalisation; it consumes the trust capital of the sequence for a one-off meal.

  Furthermore, we must challenge the notion that the veto power is absolute. In philosophy of action, we often distinguish between 'brute ability' and 'rational agency'. A madman has the brute ability to jump off a cliff, but we do not say he is rational for doing so. Similarly, the Town Slice has the brute ability to renege, but if we define rationality as acting in accordance with the best available plan over time, the veto is irrational. The 'hidden assumption' you noted regarding the unified self is indeed present in standard discussions, but it is not necessary for the argument to hold. We do not need a unified *substance*; we need a unified *strategy*.

  If we accept that rationality is about the successful governance of a life over time, then the slice that disrupts this governance is defective. The Hitchhiker argument works because it exposes the poverty of local maximisation. It demonstrates that an agent who treats their future self as a stranger to be exploited will ultimately be abandoned by the world. The driver represents the world's constraint on fragmented agency: the world will not cooperate with an agent who cannot bind their future slices.

  **Conclusion**

  The objection that temporal slices with veto power undermine Parfit's Hitchhiker problem relies on a truncated view of rationality. It assumes that because the self is fragmented metaphysically, it must also be fragmented normatively. This is a non sequitur. The Hitchhiker argument remains robust even under the temporal slice model, provided we conceive of the slices as a diachronic coalition rather than a series of antagonistic strangers.

  The veto power of the present slice is real in terms of physical capability, but it is illusory in terms of rational justification. To exercise the veto is to prioritise the moment over the sequence, an act that ultimately destroys the conditions for the slice's own flourishing. Therefore, the rational agent—whether conceived as a unified substance or a sequence of stages—must pay the £100. To do otherwise is not to assert independence, but to succumb to a myopia that guarantees isolation. The lesson of the Hitchhiker is not that we must be metaphysically identical to our past selves, but that we must be loyal to our future selves. Rationality is not found in the slice, but in the stream.
