      *   **(5) LLM Exclusion (Application):** Intentional stance is *never* appropriate for current LLMs because they lack holistic rational integration needed for genuine compressibility.
      *   **(6) Moral Responsibility (Ethics):** Responsibility requires the Intentional stance to be both appropriate and ineliminable. Design stance entities get no responsibility.

  2.  **Analyze Pairwise Tensions:**

      *   **(1) & (4):** (1) says patterns are ontologically weighty. (4) defines reality via compression.
