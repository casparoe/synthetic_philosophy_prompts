answer: |-
  **The Scenario**
  You are a board member voting on a merger. The deal yields you a $10M bonus if it closes, regardless of quality, but if the deal is fundamentally fraudulent and you *knew* it was fraudulent when you voted, you are personally liable for $50M in fines and prison costs. If the deal is fraudulent but you were *ignorant* of the fraud, the Business Judgment Rule protects you; you keep the bonus and face no liability. The deal has a 50% prior probability of being fraudulent. You can read a diligence report that reveals the truth with 100% accuracy for free, secretly, and instantly. If you vote "No," the deal dies and you get $0.

  ***

  ### 1. The Broken Premise
  Good's Theorem relies on the assumption that the **utility function is independent of the agent's information state**. Formally, it assumes $U(action, world\_state)$ is constant whether the agent is informed or ignorant. The theorem proves that $\mathbb{E}[\max_a U(a, S)] \ge \max_a \mathbb{E}[U(a, S)]$ because the informed agent can always mimic the ignorant agent's action.

  In this case, the utility function is **state-dependent on knowledge**: $U(action, world\_state, knowledge)$. Specifically, $U(\text{Vote Yes}, \text{Fraud}, \text{Known}) = -50$, while $U(\text{Vote Yes}, \text{Fraud}, \text{Unknown}) = +10$. Because the payoff matrix *itself* shifts when you update your belief state, the inequality no longer holds. The "option to do what you would have done anyway" is not available, because doing that action *while knowing* triggers a penalty that doing it *while ignorant* does not.

  ### 2. The Arithmetic
  **Without Information:**
  *   **Action:** Vote Yes.
  *   **Outcomes:**
      *   50% Good Deal: +$10M.
      *   50% Fraud (Ignorant): +$10M (Protected by Business Judgment Rule).
  *   **EU(No Info):** $0.5(10) + 0.5(10) = \mathbf{+\$10M}$.
  *   *(Note: Voting No yields $0, so Vote Yes is optimal.)*

  **With Information:**
  *   **Signal:** Report reveals Good or Fraud (50/50).
  *   **If Report says Good:**
      *   Action: Vote Yes.
      *   Payoff: +$10M.
  *   **If Report says Fraud:**
      *   Action: Vote No. (You cannot vote Yes; doing so yields -$50M, which is worse than $0).
      *   Payoff: $0.
  *   **EU(Info):** $0.5(10) + 0.5(0) = \mathbf{+\$5M}$.

  **Value of Information:** $5M - 10M = \mathbf{-\$5M}$.

  ### 3. The Commitment Objection
  *Objection:* "Why not commit in advance to read the report but vote Yes regardless?"
  *Response:* You cannot. The liability is triggered by the *mental state* of knowledge at the time of the vote, not by a binding contract on your vote. If you read the report, you *know*. If you know and vote Yes on a fraud, you are liable. The commitment device required is not "commit to an action," but "commit to remain ignorant."

  *Value of Commitment:* You would pay up to **$5M** for a mechanism that allowed you to verify the report existed without absorbing its contents (e.g., a trusted blind agent who shreds the report if it's bad, or a legal waiver that grants you ignorance-equivalent liability protection even if informed). The negative VOI is precisely the price of the liability waiver you lack.

  ### 4. Ablation
  **Feature to Remove:** The asymmetry in liability (the Business Judgment Rule).
  **Neutralized Case:** Suppose you are liable for fraud *regardless* of whether you knew (Strict Liability), or protected *regardless* of whether you knew (Total Immunity).
  *   **Strict Liability:** $U(\text{Yes}, \text{Fraud}) = -50$ in both info states.
      *   EU(No Info): $0.5(10) + 0.5(-50) = -20$. (Optimal action: Vote No, EU = 0).
      *   EU(Info): $0.5(10) + 0.5(0) = 5$. (Vote Yes if Good, No if Fraud).
      *   VOI: $5 - 0 = +5$. (Positive).
  *   **Total Immunity:** $U(\text{Yes}, \text{Fraud}) = +10$ in both info states.
      *   EU(No Info): 10.
      *   EU(Info): 10. (You vote Yes in both branches).
      *   VOI: 0. (Non-negative).

  Removing the *knowledge-dependent payoff structure* restores Good's Theorem. The negative value was generated entirely by that structural feature.

  ### 5. Steelman the Other Side
  A defender of Good's Theorem would argue this is a **category error**, not a mathematical counterexample. They would say: "You have misdefined the 'World State'."

  *   **The Argument:** Good's Theorem holds if you define the state space finely enough. The state isn't just $\{\text{Good}, \text{Fraud}\}$. It is $\{\text{Good}, \text{Fraud}\} \times \{\text{Agent Knows}, \text{Agent Ignorant}\}$.
  *   **The Reclassification:** In this expanded state space, "Reading the Report" is not just gathering information; it is an *action* that causally transitions the world from an "Ignorant" slice to a "Known" slice. Since the action "Read Report" has a cost (the transition to a high-liability state), it is not "free information." It is a costly action with an information component.
  *   **Are They Right?** Technically, yes. If you treat "my own knowledge" as an external variable subject to causal laws, the theorem holds. But pragmatically, this strips the theorem of its prescriptive force. The whole point of the heuristic "gather more data" is that we treat data-gathering as distinct from world-changing actions. This case proves that **in social/legal environments, data-gathering *is* a world-changing action.** The theorem is mathematically sound but sociologically naive.
