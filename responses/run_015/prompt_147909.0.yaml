  # Graduate Reading Group: Decision Tree for Theories of Truth

  ## Starting Commitment
  **The Deflationary Intuition:** When the cat is on the mat, calling 'the cat is on the mat' *true* seems to add nothing to just saying that the cat is on the mat. Any account of truth has to respect that.

  ## Instructions
  Answer the following ten questions based on your philosophical intuitions regarding the specific cases presented. Do not worry about which theory you have read; answer based on how you think the case *should* be handled. Record your answers (Yes/No) and consult the **Scoring Key** to find your position.

  ---

  ## The Branch Questions

  **1. The Saphi Case (Endorsement vs. Generalization)**
  Imagine the *Saphi*, a community whose truth-word is used *only* to endorse an utterance made just before by another speaker. It carries an overtone of deference, is never applied to one's own current utterance, and has no use in forming generalizations (e.g., "Everything the oracle says is true").
  *   **Q1:** Is the Saphi word a genuine truth predicate?
      *   ( ) **Yes** (Truth is fundamentally about endorsement/deference).
      *   ( ) **No** (Truth requires the capacity for generalization).

  **2. The Foreign Script Case (Disquotation vs. Anaphora)**
  You are handed a card written in a script you cannot read. A reliable translator tells you, "The sentence on this card says that the bridge is unsafe."
  *   **Q2:** Can you correctly say, "The sentence on this card is true," without ever reading or asserting the sentence itself?
      *   ( ) **Yes** (Truth applies via reference/anaphora).
      *   ( ) **No** (Truth requires the ability to disquote/assert the content).

  **3. The Archive Inference (Logical Role)**
  Premise 1: Everything in the archive is true.
  Premise 2: The archive says the bridge is unsafe.
  Conclusion: The bridge is unsafe.
  *   **Q3:** Is this inference valid *in virtue of the meaning of 'true'* alone, or does it require a substantive link between truth and the world?
      *   ( ) **Meaning alone** (Deflationary/Logical).
      *   ( ) **Substantive link** (Truth connects language to reality).
      *   *(Note: For the tree, treat "Meaning alone" as **No** [No substantive link] and "Substantive link" as **Yes**).*

  **4. Conservativeness (Logical Strength)**
  Suppose you add the rules for the truth predicate to a complete theory of physics.
  *   **Q4:** Does adding 'true' allow you to derive new claims about physics (e.g., new laws about bridges) that you could not derive before?
      *   ( ) **No** (Truth is conservative).
      *   ( ) **Yes** (Truth adds logical strength).

  **5. Practical Success (Explanatory Role)**
  A navigator successfully guides a ship through a reef. We explain this by saying, "She succeeded because her beliefs about the reef were *true*."
  *   **Q5:** Does the word 'true' in this explanation do any genuine explanatory work, or is it just a placeholder for the specific contents of her beliefs?
      *   ( ) **Placeholder** (No explanatory work).
      *   ( ) **Explanatory** (Truth is a real property that causes success).
      *   *(Note: Treat "Placeholder" as **No**, "Explanatory" as **Yes**).*

  **6. Domain Shift (Monism vs. Pluralism)**
  Consider the sentence "2 + 2 = 4" (mathematics), "That joke was funny" (comic), and "Stealing is wrong" (normative).
  *   **Q6:** Is the property of *truth* exactly the same in all three domains, or does it vary (e.g., correspondence in math, super-assertibility in norms)?
      *   ( ) **Same property** (Monism).
      *   ( ) **Varies by domain** (Pluralism).
      *   *(Note: Treat "Same" as **No**, "Varies" as **Yes**).*

  **7. Verification (Realism vs. Anti-Realism)**
  Consider a statement about the distant past for which all evidence is permanently lost.
  *   **Q7:** Can this statement be *true* even if it is impossible, even in principle, for anyone to verify it?
      *   ( ) **Yes** (Truth transcends verification).
      *   ( ) **No** (Truth is epistemically constrained).

  **8. The Calibration Case (Normativity)**
  Your friend in machine learning argues that for a classifier, the only real norm is *calibration* (matching output probabilities to frequencies). She claims calling outputs 'true' is just bookkeeping over labels, and nothing is gained by asking whether truth is a property.
  *   **Q8:** Is she right that 'true' is merely calibration bookkeeping with no further normative force?
      *   ( ) **Yes** (Truth is calibration/expressive).
      *   ( ) **No** (Truth has normative force beyond calibration).

  **9. Truth-Bearers (Sentence vs. Proposition)**
  When we say "What she said is true," what is the primary bearer of truth?
  *   **Q9:** Is it the *sentence* (a linguistic string) or the *proposition* (the content claimed)?
      *   ( ) **Sentence**.
      *   ( ) **Proposition**.

  **10. Definability (Primitivism)**
  If you were forbidden from using the word 'true' or any synonym, could you define the concept using only terms like 'assert', 'believe', 'fact', or 'correspondence'?
  *   **Q10:** Is 'true' definable in other terms?
      *   ( ) **Yes** (It can be defined/eliminated).
      *   ( ) **No** (It is primitive/indefinable).

  ---

  ## Scoring Key: Where Did You Land?

  Follow your answers to find your position. *Note: Some paths converge.*

  | Q1 (Saphi) | Q2 (Script) | Q5 (Success) | Q6 (Domains) | Q7 (Verify) | Q8 (Calib) | Q9 (Bearer) | Q10 (Def) | **Position** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **No** | **No** | **No** | **No** | **Yes** | **No** | **Sentence** | **Yes** | **Disquotationalism** |
  | **No** | **No** | **No** | **No** | **Yes** | **No** | **Prop** | **Yes** | **Minimalism** |
  | **Yes** | **No** | **No** | **No** | **Yes** | **No** | **Sentence** | **Yes** | **Redundancy View** |
  | **Yes** | **Yes** | **No** | **No** | **Yes** | **No** | **Prop** | **Yes** | **Prosententialism** |
  | **Yes** | **Yes** | **No** | **No** | **Yes** | **No** | **Prop** | **No** | **Primitivism** |
  | **No** | **Yes** | **Yes** | **No** | **Yes** | **No** | **Prop** | **No** | **Correspondence / Truthmaker** |
  | **No** | **Yes** | **Yes** | **No** | **No** | **No** | **Prop** | **No** | **Verificationist Anti-Realism (Dummett)** |
  | **No** | **Yes** | **Yes** | **Yes** | **Yes** | **No** | **Prop** | **No** | **Alethic Pluralism** |
  | **Yes** | **Yes** | **No** | **No** | **Yes** | **Yes** | **Prop** | **Yes** | **Calibration Expressivism** |
  | *Other* | *Other* | *Other* | *Other* | *Other* | *Other* | *Other* | *Other* | **Unoccupied** |

  *(Note: Q3 and Q4 generally track with Q5. If you answered "Substantive link" on Q3 or "Yes" on Q4, you are directed toward Correspondence/Pluralism. If you answered "Meaning alone" or "No", you are directed toward Deflationary views.)*

  ---

  ## Diagnoses of Empty Cells and Collapsed Branches

  ### 1. Logical Space Construction
  This tree was constructed by identifying the binary discriminations required to separate the nine target positions. The logical space allows for $2^{10}$ (1,024) combinations. Only 9 are occupied by established or invented theories. The remaining 1,015 cells are **Unoccupied**.

  **Why are they empty?**
  *   **Incoherent:** Some combinations violate the starting commitment logically. For example, answering **Yes** to Q5 (Truth explains success substantively) but **No** to Q3 (Truth provides no substantive link in inference) creates a tension between truth's explanatory power and its logical role that most theories resolve by aligning these answers.
  *   **Unattractive:** Some combinations are logically possible but philosophically unmotivated. For example, a view that claims truth is **Primitive** (Q10=No) but also **Definable as Calibration** (Q8=Yes) is contradictory.
  *   **Unexplored:** Some combinations represent novel philosophical terrain. For instance, a **Pluralist** (Q6=Yes) who is also a **Redundancy Theorist** (Q1=Yes, Q2=No) is not standard; this would imply truth is eliminable in some domains but not others. This cell is currently unoccupied.

  ### 2. Collapsed Branches (Disquotationalism vs. Minimalism)
  **Status:** *Flagged Collapse.*
  **Explanation:** Disquotationalism (Quine) and Minimalism (Horwich) are separated in the Scoring Key *only* by Q9 (Sentence vs. Proposition). In practice, concrete cases (Q1–Q8) often yield identical answers for both views. Both are deflationary, conservative, and monist.
  **What would separate them?** To fully separate them without relying on the "Sentence vs. Proposition" distinction, one would need a question about the *status of the equivalence schema*.
  *   *Proposed Question:* "Is the schema 'p is true iff p' a *theory* about truth, or is it *constitutive* of the concept of truth?"
  *   *Disquotationalism:* It is a rule of usage/theory.
  *   *Minimalism:* It is constitutive/implicit in understanding.
  Since this is abstract, Q9 was used as a proxy. Students landing on either leaf should treat them as neighboring coordinates in the same deflationary region.

  ### 3. The Saphi Verdict (Q1)
  **Status:** *Forced Verdict.*
  **Explanation:** This question forces a split between views that prioritize **Generalization** (Disquotationalism, Minimalism, Substantive views) and views that prioritize **Endorsement/Anaphora** (Prosententialism, Redundancy, Calibration).
  *   If you answered **No**, you believe truth's primary function is semantic ascent (talking about talking).
  *   If you answered **Yes**, you believe truth's primary function is pragmatic endorsement (agreeing with others).
  This separates the Saphi case from standard textbook examples, as most theories implicitly assume generalization is necessary.

  ### 4. Calibration Expressivism (Q8)
  **Status:** *Invented Leaf.*
  **Explanation:** This leaf is occupied solely by the "ML Friend" position. It collapses into **Expressivism** if one argues calibration is merely a form of endorsement (Q1=Yes). It remains distinct if calibration is viewed as a statistical norm independent of assertion.
  *   *Collapse Risk:* If Calibration Expressivism is merely a version of Redundancy (where "true" is eliminated for "calibrated"), it should move to the Redundancy leaf. It is kept separate here to test whether *statistical bookkeeping* counts as a distinct normative practice from *logical elimination*.

  ### 5. The Starting Commitment Tension
  **Status:** *Phenomenological Entry Point.*
  **Explanation:** The Starting Commitment ("truth adds nothing") is the entry point for all students. However, the **Correspondence**, **Pluralist**, and **Dummettian** leaves eventually require you to qualify this intuition.
  *   *Correspondence:* You must accept that while 'true' adds nothing *locally* (cat on mat), it adds something *globally* (explaining success).
  *   *Diagnosis:* If you landed on Correspondence but strongly feel the Starting Commitment is inviolable, you are likely a **Minimalist** who is overestimating the explanatory power of truth.

  ### 6. Unoccupied Cell: The "Deflationary Realist"
  **Status:** *Empty.*
  **Coordinates:** Q1=No (Generalization), Q5=No (No Explanation), Q7=Yes (Realist).
  **Diagnosis:** This combination represents a view that truth is merely a logical device for generalization (Deflationary) but insists that truth values exist independently of verification (Realist). While **Disquotationalism** approximates this, it often avoids the metaphysical commitment of Q7. This cell is empty because most deflationists avoid realism to avoid metaphysical baggage, and most realists want truth to do explanatory work (Q5=Yes).
