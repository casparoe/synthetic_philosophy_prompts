prompt: |-
  I'm a fourth-year PhD student in cognitive psychology, and I've been drafted onto a small departmental committee that maintains an open textbook for our first-year graduate methods sequence. Every few weeks we have to decide whether a finding from the literature goes into the chapter, goes in with a caveat, or stays out, and the decisions are published as an appendix with our reasoning, so we have to be able to defend them to the original authors. The catch is that we get about forty-five minutes per finding, one member of the committee is an actual statistician who has to sign off, and the other three of us are substantive researchers who can run a t-test and read a confidence interval but will never read a word of philosophy of statistics. So I need something operational: an ordered set of questions, what counts as a sufficient answer to each, an explicit rule for when we stop and say no, and a point at which the procedure hands the decision back to us because the remaining question is one of values rather than facts.

  What I'd like it to draw on is the real structure of the disagreement between frequentist and Bayesian ways of reading evidence, not a list of warning signs about bad practice. In particular I want it to force us to keep separate three things we've noticed we routinely collapse: the claim that an effect exists at all, the claim about how large it is, and the claim about the mechanism that's supposed to produce it — because in our last few meetings we found that a replication often kills a magnitude claim while leaving the existence claim untouched, and we had no vocabulary for that. The procedure has to say what we do when the numbers we'd want aren't available (no effect size reported, no interval, no preregistration, only a p-value), it has to say what to do with a replication whose point estimate is in the same direction but a third of the original size, and with one whose interval excludes zero but also excludes the original estimate, and it has to be honest about which steps are judgment calls wearing a lab coat. One of our members keeps talking about severity in the error-statistical sense, another wants everything converted into a Bayes factor, and I'd like a procedure that doesn't preempt that argument but doesn't stall on it either. I'd also like it to make us state out loud the trade-off we're implicitly choosing between wrongly including a finding and wrongly excluding one, rather than having the procedure quietly pick it for us.

  Then I want it run on three cases. First: a preregistered, generously powered replication of a finding that my own dissertation builds on has just come back with a point estimate very close to zero and an interval that excludes the original effect size; I think I already know what the procedure should say and I'd like to watch it say that without flinching, and then tell me whether there is any legitimate way for me to keep using that finding in my third chapter. Second: a multi-site replication across a dozen countries that reports a pooled effect near zero but substantial heterogeneity, with the original effect reappearing at something like its original magnitude in two of the sites — is this a hidden moderator, a badly specified original, or a fluke, and what would the procedure need us to go find out before it can answer? Third: a single unregistered study with about forty participants per cell reporting a just-significant interaction, with no effect size given anywhere in the paper, which a colleague wants to build a grant around. Finally, I want to know what the procedure can't do: where it has to stop and hand the question to a person, and which kinds of finding it will systematically misjudge.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **User:** 4th-year PhD student in Cognitive Psychology.
      *   **Task:** Create an operational decision procedure for a departmental committee maintaining an open textbook for 1st-year grad methods.
      *   **Constraints:**
          *   45 minutes per finding.
          *   Committee: 1 Statistician (must sign off), 3 Substantive Researchers (basic stats literacy, no philosophy of stats).
          *   Output: Appendix with reasoning defensible to original authors.
          *   Core Requirement: Operational, ordered questions, sufficient answers, explicit stop rules, hand-off point for value judgments.
          *   Theoretical Basis: Real structure of Frequentist vs. Bayesian disagreement (not just "bad practice" checklists).
          *   Key Distinction: Must separate *Existence* (is there *an* effect?), *Magnitude* (how big is it?), and *Mechanism* (why does it happen?).
          *   Handling Missing Data: What if no ES, no CI, no prereg, only $p$?
          *   Specific Scenarios to Handle: Replication with same direction/smaller size; Replication CI excludes zero but excludes original estimate.
          *   Internal Conflict: One member likes Error Statistics (Severity), one likes Bayes Factors. The procedure must not stall on this but accommodate both.
          *   Explicit Trade-off: Must force the committee to state the Type I vs. Type II error trade-off (wrongly include vs. wrongly exclude).
          *   Deliverables: The Procedure + 3 Case Studies + Limitations of the Procedure.

  2.  **Develop the Procedure (The "Triage Protocol"):**

      *   *Goal:* Separate Existence, Magnitude, Mechanism. Acknowledge the Frequentist/Bayesian tension without requiring consensus on philosophy.
      *   *Structure:* Sequential gates. If you fail a gate, you stop or downgrade.
      *   *Gate 1: Information Sufficiency.* Can we even evaluate this? (Handles missing ES/CI).
      *   *Gate 2: Existence (The "Is there something?" gate).* This is where Severity and Bayes Factors fight. How to bridge? Focus on *discriminatory capacity*. Did the test have a high probability of detecting the effect if it were there? (Severity) OR Is the data sufficiently more likely under H1 than H0? (BF). Let's make it about *Constraint*.
      *   *Gate 3: Magnitude (The "How big?" gate).* This is where replications usually kill findings. Focus on Compatibility Intervals (CIs).
      *   *Gate 4: Mechanism (The "Why?" gate).* Often conflated with existence. Needs distinct evidence (mediation, boundary conditions).
      *   *Value Judgment:* Explicitly ask: "What is the cost of being wrong here?" (Textbook inclusion vs. exclusion).

      *   *Refining the Frequentist/Bayesian Bridge:* Instead of asking them to agree on *probability*, ask them to agree on *inference robustness*.
          *   Frequentist: Was the test severe? (Low p-value isn't enough; power matters).
          *   Bayesian: Is the prior sensitivity low? (Does the conclusion hold across reasonable priors?).
          *   *Operational Compromise:* Focus on the *width of the inference*. A narrow CI excluding 0 is robust in both frameworks (mostly). A wide CI including 0 is not.
          *   *Decision Rule:* If the Statistician says "The error probabilities are too high" OR "The Bayes Factor is anecdotal," it triggers a caveat or exclusion.

      *   *Drafting the Questions:*
          1.  **Data Transparency:** Are the numbers needed to evaluate magnitude available?
          2.  **Existence (Constraint):** Does the evidence constrain the null value? (CI excludes 0 / BF > threshold).
          3.  **Magnitude (Precision):** Is the estimate precise enough to be useful? (CI width relative to effect size).
          4.  **Replication/Consistency:** How does new data map onto the old claim? (Overlap of CIs).
          5.  **Mechanism:** Is the causal story tested or assumed?
          6.  **Value Trade-off:** Explicit statement of risk tolerance.

  3.  **Address the Specific Scenarios (Case Studies):**

      *   *Case 1: The Dissertation Killer.* Preregistered, high power, rep finds ~0, CI excludes original.
          *   *Procedure Output:* Existence claim downgraded or nullified. Magnitude claim falsified.
          *   *Can the student keep using it?* Only as a historical example of a falsified claim, or if they can argue boundary conditions (Mechanism gate). But honestly? Probably no.
      *   *Case 2: The Heterogeneous Multi-site.* Pooled ~0, high heterogeneity, 2 sites match original.
          *   *Procedure Output:* Existence is conditional. Magnitude is unknown/unstable. Mechanism is the key (what differs between sites?).
          *   *Action:* Needs moderator analysis before inclusion. "Caveat: Context-Dependent."
      *   *Case 3: The Underpowered Interaction.* N=40/cell, p<.05, no ES, unregistered.
          *   *Procedure Output:* Fail Gate 1 (Missing ES). Fail Gate 2 (Low Severity/Power for interaction). High risk of Type I.
          *   *Action:* Exclude or "Speculative." Grant risk is high.

  4.  **Identify Limitations (What the Procedure Can't Do):**

      *   Can't solve the "File Drawer" problem alone.
      *   Can't adjudicate deep theoretical disputes (Mechanism is often theoretical).
      *   Can't replace expert judgment on *importance* (a tiny real effect might be theoretically crucial).
      *   Systematically biases against novel/exploratory work (favors prereg/replication).

  5.  **Refining the Tone:**

      *   Needs to be professional, precise, and slightly weary (PhD to PhD).
      *   Avoid preaching.
      *   Acknowledge the tension between the Statistician and the Substantive members.
      *   Ensure the "Value Trade-off" is explicit.

  6.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I separate Existence, Magnitude, and Mechanism clearly?
      *   *Fix:* Make sure the decision tree has distinct branches for each. A finding can pass Existence but fail Magnitude.
      *   *Critique:* Did I address the Statistician's concerns (Severity/BF) without getting bogged down?
      *   *Fix:* Use the concept of "Discriminatory Power." If the test couldn't distinguish signal from noise (low power/severity) or the evidence is insensitive (BF ~1), it fails.
      *   *Critique:* Is the "Value Trade-off" explicit?
      *   *Fix:* Add a specific step where the committee votes on "Risk Tolerance" before applying the rules.

  7.  **Final Polish:** Check against the 45-minute constraint. The procedure needs to be fast. Use a checklist format. Ensure the "Hand-off" point is clear (where stats end and values begin).

      *(Self-Correction on Case 1)*: The user asks if there is a *legitimate* way to keep using the finding. I need to be honest. If the replication is superior (prereg, powered), the original is likely a false positive or inflated. The legitimate use is as a *contrast*, not a foundation.

      *(Self-Correction on Case 2)*: Heterogeneity is key. The procedure shouldn't say "No," it should say "Incomplete."

      *(Self-Correction on Case 3)*: Interactions with N=40/cell are notoriously underpowered. This needs to be highlighted as a specific failure point.

  8.  **Final Output Structure:**
      *   Introduction (Acknowledging the bind).
      *   The Protocol (The "Existence-Magnitude-Mechanism Triage").
      *   The Value Hand-off (Explicit trade-off).
      *   Case Applications (1, 2, 3).
      *   Limitations (Where the tool breaks).

  9.  (Drafting content with these points in mind...) *Ensure the distinction between Frequentist Severity and Bayesian Evidence is handled as "Inferential Robustness" to keep peace on the committee.* *Make sure the "Stop Rule" is clear.*

  10. *Final check on the "Values vs Facts" handoff.* This is crucial. The stats tell you the uncertainty; the committee decides if that uncertainty is acceptable for a textbook.

  11. *Ready to write.*
answer: |-
  This is a classic institutional design problem: you need a decision heuristic that respects deep philosophical disagreements without requiring the committee to resolve them, while forcing clarity on distinctions (Existence vs. Magnitude vs. Mechanism) that the literature routinely obscures.

  Below is the **Existence-Magnitude-Mechanism (EMM) Triage Protocol**. It is designed to be run in 45 minutes. It does not ask the Bayesian and the Error-Statistician to agree on *why* a test works, only on whether the test *constrains* the inference sufficiently.

  ### Part 1: The EMM Triage Protocol

  **Pre-Condition:** Before evaluating the finding, the committee must explicitly state the **Inclusion Risk Tolerance**.
  *   *Question:* "For this chapter, is it worse to teach a false positive (Type I) or to omit a true but noisy effect (Type II)?"
  *   *Record:* [ ] Conservative (Prioritize stability/replicability) [ ] Exploratory (Prioritize novelty/theoretical potential).
  *   *Why:* This prevents the procedure from silently imposing a value judgment. If you choose Conservative, small/underpowered studies auto-fail. If Exploratory, they proceed with caveats.

  ---

  #### Gate 1: Information Sufficiency (The "Can We Evaluate?" Gate)
  *Time limit: 5 minutes*

  1.  **Q:** Are the point estimate and a measure of precision (CI, SE, SD) reported for the primary claim?
      *   **Yes:** Proceed to Gate 2.
      *   **No:** **STOP.** Mark as *Unverifiable*.
      *   *Rule:* A $p$-value alone is insufficient for Magnitude claims. If the Risk Tolerance is Conservative, Exclude. If Exploratory, include only as "Historical/Unverified."
  2.  **Q:** Is the analysis plan (preregistration or clear methodological description) available to distinguish confirmatory from exploratory analysis?
      *   **Yes:** Proceed.
      *   **No:** Downgrade Existence confidence. (Unregistered analyses inflate Type I error rates; treat $p < .05$ as $p < .15$ equivalent).

  ---

  #### Gate 2: Existence (The "Is There Something?" Gate)
  *Time limit: 15 minutes*
  *Goal: Satisfy both the Severity and Bayes Factor proponents without requiring philosophical consensus.*

  1.  **Q (The Constraint Question):** Does the evidence rule out the "null" region with sufficient stringency?
      *   *Frequentist Check:* Did the test have high power/severity to detect the claimed effect? (If $N$ is small, a significant $p$ is not severe).
      *   *Bayesian Check:* Is the Bayes Factor ($BF_{10}$) $> 6$ (or equivalent sensitivity)?
      *   *Operational Compromise:* Look at the **95% Confidence Interval**.
          *   Does it exclude 0?
          *   Is the lower bound practically meaningful (not just statistically non-zero)?
      *   **Sufficient Answer:** CI excludes 0 AND the study had $>80\%$ power to detect the lower bound of that CI.
      *   **Insufficient Answer:** CI excludes 0 but study was underpowered (significance driven by noise) OR CI includes 0 but $p < .05$ (unstable).
  2.  **Decision:**
      *   **Pass:** Existence Claim Supported.
      *   **Fail:** Existence Claim Unsupported. (Stop here for textbook inclusion unless Risk Tolerance is Exploratory).
      *   **Caveat:** Existence Claim *Provisional* (e.g., significant but low power).

  ---

  #### Gate 3: Magnitude (The "How Big?" Gate)
  *Time limit: 15 minutes*
  *Goal: Separate the fact of the effect from the size of the effect.*

  1.  **Q:** Is the precision of the estimate sufficient for pedagogical use?
      *   *Rule of Thumb:* Is the width of the 95% CI less than 50% of the point estimate? (e.g., If $d = 0.5$, CI should not span $0.2$ to $0.8$).
      *   **Yes:** Magnitude Claim Supported.
      *   **No:** Magnitude Claim *Indeterminate*.
  2.  **Q (Replication Check):** If replication data exists, how does it map?
      *   *Scenario A:* Replication CI overlaps with Original CI. -> **Consistent.**
      *   *Scenario B:* Replication CI excludes 0 but excludes Original Point Estimate. -> **Magnitude Falsified.** (Existence may hold, but the textbook must report the smaller size).
      *   *Scenario C:* Replication CI includes 0. -> **Existence Threatened.** (Return to Gate 2).

  ---

  #### Gate 4: Mechanism (The "Why?" Gate)
  *Time limit: 10 minutes*
  *Goal: Prevent conflating a main effect with a theoretical explanation.*

  1.  **Q:** Is the mechanism tested (mediation, moderation, process measure) or assumed?
      *   **Tested:** Mechanism Claim Supported.
      *   **Assumed:** Mechanism Claim *Speculative*.
  2.  **Rule:** A finding can pass Gate 2 (Existence) and fail Gate 4 (Mechanism). In the textbook, report the effect, but strip the theoretical explanation.

  ---

  #### The Value Hand-Off
  *If a finding passes Gates 1-3 but fails Gate 4, or passes Gate 2 with a Caveat:*
  The statistics are done. The committee must now vote:
  *   "Do we include this finding knowing the magnitude is uncertain / mechanism is unproven?"
  *   *Reasoning:* This is no longer a fact claim; it is a pedagogical risk assessment.

  ***

  ### Part 2: Case Applications

  Here is how the protocol runs on your three cases.

  #### Case 1: The Dissertation Killer
  *Scenario:* Preregistered, high-power replication. Point estimate $\approx 0$. CI excludes original effect size.
  *   **Gate 1 (Info):** Pass. (Preregistered, powered, full stats).
  *   **Gate 2 (Existence):** Fail. The replication CI likely includes 0. Even if it excludes 0 (tiny effect), the Severity of the original test is now retroactively undermined by the high-powered null result.
  *   **Gate 3 (Magnitude):** Falsified. The replication CI excludes the original estimate.
  *   **Protocol Verdict:** **Exclude as a foundational fact.**
  *   **Can you keep using it in Chapter 3?**
      *   *Honest Answer:* No, not as a premise. You cannot build a positive claim on a falsified foundation.
      *   *Legitimate Use:* You can use it as a **boundary condition**. "While Original Study (2015) reported X, High-Power Replication (2024) suggests this effect is negligible under these conditions." This shifts your dissertation from "extending X" to "resolving the inconsistency of X." This is riskier for a dissertation but scientifically defensible. If you ignore the replication, you are vulnerable to an exam committee member who knows the literature.

  #### Case 2: The Heterogeneous Multi-Site
  *Scenario:* Pooled effect $\approx 0$. High heterogeneity ($I^2$). Two sites match original magnitude.
  *   **Gate 1 (Info):** Pass.
  *   **Gate 2 (Existence):** **Caveat.** Existence is *conditional*. The pooled null suggests no universal effect, but the heterogeneity suggests it exists *somewhere*.
  *   **Gate 3 (Magnitude):** **Indeterminate.** We do not know the magnitude for the general population, only for specific contexts.
  *   **Gate 4 (Mechanism):** **The Critical Gate.** The protocol halts here. The variance *is* the data.
  *   **Protocol Verdict:** **Include with "Context-Dependent" Tag.**
  *   **Required Action:** Before finalizing, the committee must demand a **Moderator Analysis**. Are the two successful sites culturally distinct? Methodologically distinct?
      *   *If Moderators Found:* The finding is included as a moderated effect.
      *   *If No Moderators Found:* The two matching sites are likely false positives (Type I errors within the multi-site study). The finding should be excluded or marked as "Unreliable."
      *   *Reasoning:* Without a specified moderator, "it works in Site A and B" is not a scientific claim; it's a list.

  #### Case 3: The Underpowered Interaction
  *Scenario:* $N=40$/cell. Unregistered. $p < .05$ interaction. No effect size.
  *   **Gate 1 (Info):** **Fail.** No effect size/CI reported.
      *   *Action:* Request data or calculate from $F$-value. If unavailable, automatic downgrade.
  *   **Gate 2 (Existence):** **Fail (Severity).** Interactions require roughly 4x the power of main effects. $N=40$/cell is typically $<50\%$ power for a medium interaction. A significant $p$ here is likely a Type I error or a grossly inflated estimate (The "Winner's Curse").
  *   **Gate 3 (Magnitude):** **Unknown.**
  *   **Protocol Verdict:** **Exclude.**
  *   **Grant Advice:** Tell your colleague: "Building a grant on this is high-risk. The protocol flags this as low-severity evidence." If they proceed, they must budget for a pilot study to re-estimate the effect size before the main grant work begins.

  ***

  ### Part 3: Limitations (Where the Procedure Stops)

  You asked for honesty about where the procedure fails. Here is where you must hand the decision back to human judgment:

  1.  **The "Small but Real" Problem:**
      *   *Limitation:* The protocol favors precision. A finding with a tiny effect size (e.g., $d = 0.1$) but a tight CI will pass Gate 2 and 3.
      *   *Risk:* The committee might include a finding that is statistically robust but theoretically trivial.
      *   *Hand-off:* The committee must decide: "Is this effect size large enough to matter for the theory?" The stats cannot answer this.

  2.  **The Novelty Bias:**
      *   *Limitation:* This protocol systematically penalizes new, exploratory work (which lacks preregistration and power) in favor of established, replicated work.
      *   *Risk:* The textbook becomes a catalog of dead facts rather than a map of living science.
      *   *Hand-off:* Use the **Inclusion Risk Tolerance** (Pre-Condition). If the chapter is "Current Frontiers," switch to Exploratory mode. If "Foundations," stay Conservative.

  3.  **The Theory-Laden Measurement:**
      *   *Limitation:* The protocol assumes the measures validly capture the construct. If the original study and the replication both use a bad measure, the protocol will certify a false existence claim (High reliability, zero validity).
      *   *Hand-off:* Substantive experts must override the Statistician on construct validity. The Statistician checks the numbers; the Psychologists check the task.

  4.  **The "File Drawer" Blindness:**
      *   *Limitation:* The procedure evaluates *published* findings. It cannot correct for publication bias unless a meta-analysis is provided.
      *   *Risk:* A finding passes Gate 2 because 20 failed replications aren't in the room.
      *   *Hand-off:* Require a search for unpublished replications (e.g., OSF, PsyArXiv) for any finding marked "Foundational."

  ### Summary for the Committee
  This procedure forces you to say: "We believe an effect exists (Gate 2), but we don't know how big it is (Gate 3)," or "We know the size (Gate 3), but we don't know why it happens (Gate 4)." It prevents the statistician from vetoing substantive importance and prevents the substantive researchers from ignoring error rates. It makes the value trade-off (Include vs. Exclude) a visible vote rather than a hidden assumption.
