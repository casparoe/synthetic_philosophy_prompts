answer: |-
  To address your specific concern regarding epistemic justification in the absence of direct empirical access, we must first establish the structural architecture separating Peirce's and James's accounts of truth. The core divergence lies not merely in their definitions, but in the *temporality* and *locus* of verification. Peirce's account is teleological and communal; truth is a regulative ideal located at the hypothetical end of inquiry, anchored by an external reality that compels agreement. James's account is melioristic and individualistic (though not solipsistic); truth is a property that accrues to ideas in the present tense based on their capacity to guide us through experience satisfactorily. Peirce looks forward to a final stability imposed by the object; James looks backward and sideways at the current workability of the belief within the stream of experience.

  With this structural distinction in mind, we can analyze your scenario: a predictive model in high-energy physics that yields accurate forecasts but relies on mathematical structures with no settled physical interpretation, where ontological resolution is permanently unavailable.

  ### Peirce: Convergence on the "Would-Be" versus Ontological Stasis

  For Peirce, truth is the opinion fated to be ultimately agreed to by all who investigate. This definition relies heavily on his Scholastic Realism: generals (laws, habits, dispositions) are real, not just particular sensations. In your scenario, the scientific community is permanently divided on the *ontology* (what the entities *are*) but converges on the *predictions* (what the entities *do*).

  Peirce would likely argue that the community *has* effectively converged on the truth, provided we understand what the object of that truth is. According to the Pragmatic Maxim, the meaning of a concept lies in the conceivable practical bearings of its object. If the competing ontological interpretations (e.g., whether a gauge redundancy represents a real physical symmetry or a mere mathematical artifact) yield no difference in observable predictions or experimental outcomes, then, strictly speaking, they are not distinct hypotheses. They are metaphysical verbiage.

  Therefore, Peirce does not require convergence on a specific ontological picture if that picture lacks "experimental weight." The truth of the theory resides in the conditional predictions—the "would-bes" (e.g., "if we collide particles at energy X, we will observe Y"). These regularities are real habits of nature. The community stabilizes on the *structural relations* captured by the mathematics. For Peirce, the mathematical structure itself, insofar as it dictates the habits of interaction, is the accessible reality. The permanent division over the "stuff" underlying the structure is a failure to formulate a meaningful question, not a failure of the theory to capture truth. The "final opinion" is not about the intrinsic nature of the inaccessible entity, but about the reliable rules of interaction governing it. Thus, Peirce allows for a form of structural realism: we know the truth of the relations, and that is sufficient for the convergence required by truth, even if the intrinsic ontology remains obscure or meaningless.

  ### James: Predictive Efficacy as Local Truth

  James's approach shifts the locus of justification from the end of inquiry to the present utility of the belief. For James, truth "happens" to an idea; it becomes true, is made true by events. In the context of your high-energy physics model, the "event" that verifies the theory is the successful prediction of particle interactions.

  James would argue that the predictive efficacy is itself a sufficient ground for local truth. The theory "works," and in working, it leads the scientist through the stream of experience without contradiction and with practical satisfaction. The fact that the ontological status is unsettled does not negate the truth of the model, because truth is not a static copy of reality but a tool for navigation. If the mathematical structure allows physicists to build accelerators, predict decay rates, and publish consistent papers, the idea is "true" in the pragmatic sense.

  Crucially, James's radical empiricism allows for a plurality of truths where Peirce demands a single final opinion. In your scenario, where the community is permanently divided on interpretation, James would not see this as a failure of inquiry (as Peirce might regarding the metaphysical dispute) but as a legitimate pluralism. Different ontological interpretations might be "true" for different sub-communities if they serve different heuristic or psychological needs, provided none of them contradict the experiential cash-value (the predictions). James allows us to treat the model as true *now*, without waiting for the ideal limit of inquiry. The permanent unavailability of direct access does not suspend the truth claim, because the truth claim is about the *connection* between the theory and the experience (prediction), not the *correspondence* between the theory and the inaccessible entity.

  ### The Point of Divergence

  The precise point at which these accounts diverge in this scenario concerns the **normative status of the permanent division**.

  For Peirce, the permanent division on ontology is a sign that the inquiry regarding ontology is ill-posed. He would demand we excise the ontological dispute from the scientific claim to preserve the objectivity of the convergence on prediction. The divergence is over the **necessity of ontological commitment**: Peirce requires that any meaningful claim be reducible to conditional predictions (structural commitment), whereas James allows the ontological commitment to remain as a "working hypothesis" that adds to the subjective satisfaction of the believer, even if it lacks empirical cash-value.

  For James, the permanent division is acceptable because truth is plural and contextual. The divergence is over the **role of consensus**: Peirce requires a single communal destiny (even if only on structural grounds) to define truth; James allows for multiple, coexisting "truths" (interpretations) as long as they all successfully guide action. Peirce seeks to eliminate the underdetermination by declaring the underdetermined elements meaningless; James accepts the underdetermination as a feature of a pluralistic universe where different conceptual frameworks can validly map the same experiential terrain.

  ### Evaluation and Ambiguity

  In the context of irreducible theoretical underdetermination, **James's framework offers a more coherent immediate response**, while **Peirce's offers a more robust long-term defense of scientific objectivity.**

  James handles the "permanent unavailability" better because he does not posit a counterfactual end of inquiry that may never arrive. He validates the scientific practice as it stands: the model is justified because it works. This avoids the anxiety of the "ideal limit" when that limit is logically inaccessible. However, the ambiguity in James's position lies in the potential for subjectivity. If truth is what proves itself in experience, and the ontological interpretation makes no difference to prediction, on what grounds do we prefer one interpretation over another? James risks allowing non-empirical preferences (aesthetic, metaphysical comfort) to dictate truth claims, which could weaken the normative force of scientific justification.

  Peirce's framework is more coherent if your goal is to preserve the idea that science discovers *reality* rather than just constructing *useful tools*. By identifying the real with the "would-be" (the dispositional properties captured by the math), Peirce secures a form of realism without requiring access to the "thing-in-itself." However, the ambiguity here lies in the **regulative hope**. Peirce's account relies on the assumption that inquiry, if pushed far enough, *would* converge. In your scenario, you stipulate that access is *permanently* unavailable. If the convergence is logically impossible regarding the ontology, Peirce is forced to declare the ontological question meaningless. This is a strong move, but it may feel like a dissolution of the problem rather than a solution. It requires the scientist to abandon the desire for ontological clarity, which may be psychologically and heuristically difficult.

  **Summary of the Tension:**
  The critical ambiguity that makes them hard to separate on this issue is the status of the **mathematical structure itself**.
  *   For Peirce, the structure *is* the reality (the habit of nature), so there is no underdetermination of truth, only of metaphysical gloss.
  *   For James, the structure is a *tool* that creates truth by leading to successful predictions.

  If you treat the mathematical structure as the primary object of knowledge, Peirce and James converge: both agree the theory is justified. They diverge only on *why*: Peirce says because it mirrors the real habits of the universe; James says because it successfully navigates the stream of experience. For your chapter, the crucial insight is that Peirce forces you to redefine "reality" to match the accessible structure (Structural Realism), whereas James allows you to keep "reality" vague and focus on the "truth" of the practice (Instrumentalism/Pluralism). If your argument requires that science tracks mind-independent features despite underdetermination, Peirce is the stronger ally. If your argument requires that justification is internal to scientific practice regardless of metaphysical resolution, James provides the more flexible apparatus.
