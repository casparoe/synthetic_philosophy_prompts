  *(Self-Correction during drafting the response)*: I need to be careful with option (b). Dewey is not a pure proceduralist. He cares about *growth*. So a normative claim based *only* on participation without regard for consequences is actually *anti*-Deweyan. I need to highlight that.
  For option (c), the definitional move is the most "Deweyan" but also the most risky for the student because if democracy *is* inquiry, then a democracy that ignores climate science isn't actually being "more democratic" in the Deweyan sense—it's being *less* democratic because it's failing at inquiry. This turns the student's argument against them potentially.

