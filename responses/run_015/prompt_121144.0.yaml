answer: |-
  Here is a lesson plan designed for a 50-minute session, structured to maximize logical clarity and student engagement while respecting their background.

  ### 1. The Dependency Ordering
  You must establish the **axioms of the game class** before you introduce the **contradiction**. If you present the "stealing" move before the side conditions, the CS majors will immediately attack the edge cases (e.g., "What if the extra piece blocks a path?").

  **Recommended Sequence:**
  1.  **The Game Class (Axioms):** Define the specific properties required. Do not call them "rules of Hex" yet; call them "Properties of the Game."
      *   *Finite:* Game must end.
      *   *Perfect Information/No Chance:* Standard.
      *   *No Draws (Determinacy):* One player must win. (State this as a given fact for this class, referencing their prior session, but emphasize it is a *condition*).
      *   *Symmetry:* Available moves depend only on the board, not on who is playing (ignoring piece color for a moment).
      *   **Monotonicity (The Critical Axiom):** An extra move/piece is never a disadvantage. (Formalize: State $S \subseteq S' \implies \text{Value}(S) \le \text{Value}(S')$).
  2.  **The Claim:** "For any game satisfying 1–5, Player 1 has a winning strategy."
  3.  **The Proof (by Contradiction):**
      *   Assume P2 has a winning strategy $\mathcal{S}$.
      *   P1 makes an arbitrary first move $m$.
      *   P1 ignores $m$ and pretends to be P2, using $\mathcal{S}$ to respond to P2's moves.
      *   **The Conflict:** If $\mathcal{S}$ calls for a move on $m$ (which is occupied), P1 makes *another* arbitrary move $m'$.
      *   **The Resolution:** P1 now has the pieces required by $\mathcal{S}$ *plus* the extra piece $m'$. By **Monotonicity**, this position is at least as good as the one $\mathcal{S}$ expected.
      *   **The Contradiction:** P1 wins using P2's strategy. Thus, P2 cannot have a winning strategy.
  4.  **The Conclusion:** By **Determinacy** (No Draws), if P2 cannot win, P1 must win.

  **What goes wrong if reordered?**
  *   If you skip **Monotonicity** until the conflict step, students will think the argument fails when the strategy calls for the occupied square. You need them to accept "extra is good" *before* they see the conflict.
  *   If you skip **Determinacy** until the end, students will conclude "P2 doesn't win" and stop there, missing the "P1 wins" leap.
  *   **Re-derive vs. Assume:** Assume *Determinacy* (they've seen it stated). Re-derive *Monotonicity* for the specific example (show them visually why an extra stone helps in the carrying example).

  ### 2. The Carrying Example: 5×5 Hex
  You asked for an example that is not the "obvious candidates" (3×3 Hex, Tic-Tac-Toe, Chomp).
  **Use 5×5 Hex.**

  **Why this specific board?**
  *   **Why not Tic-Tac-Toe?** It allows draws. The argument collapses immediately, which is useful for the *end* of class, but disastrous for *teaching* the proof.
  *   **Why not 3×3 Hex?** You noted they brute-forced this. It is trivially P1-win. The result isn't surprising, so the proof feels like overkill.
  *   **Why not Chomp?** While logically clean, it is abstract. Hex is geometric; the "extra stone is good" intuition (connectivity) is visceral for CS/Math students.
  *   **Why 5×5?** It is small enough to play in 10 minutes (unlike 11×11) but large enough that the winning strategy is not obvious to the eye (unlike 3×3). It leverages their prior session (rules are known, saving 5 minutes of setup) but scales the complexity.

  **What it must have/lack:**
  *   **Have:** A clear topological reason why an extra stone cannot hurt (more paths, never fewer).
  *   **Lack:** Any mechanism where a piece blocks your own connectivity (Hex pieces are transparent to your own color).
  *   **Visualizing Monotonicity:** Before the proof, ask them: "If I have a winning path, and I add a random stone to the board, did I break my path?" (Answer: No, stones don't block own color). This cements the Monotonicity axiom concretely.

  ### 3. The Misconception Map
  Anticipate these errors in this specific order. Address them *when they naturally arise*, not all at the start.

  | Time | Misconception | Intervention Strategy |
  | :--- | :--- | :--- |
  | **Min 10** (Setup) | *"Is this constructive? Can I code this?"* | **Park it.** Explicitly say: "This proof tells us *that* a strategy exists, not *what* it is. We will return to why at the end." |
  | **Min 25** (The Conflict) | *"What if the strategy wants the square I already took?"* | **This is the core.** Do not gloss over it. This is where you invoke **Monotonicity**. "If the strategy wants square $X$, and I already have $X$, I play $Y$ instead. I now have $\{X, Y\}$. Is $\{X, Y\}$ better than $\{X\}$? Yes." |
  | **Min 35** (Conclusion) | *"So White wins Chess?"* | **Boundary Check.** Ask: "Does Chess satisfy 'No Draws'?" (No). "Does it satisfy 'Symmetry'?" (No, pieces differ). "Does it satisfy 'Extra Move Good'?" (Zugzwang exists). |
  | **Min 40** (Wrap) | *"The extra move condition is just formality."* | **Correct.** Emphasize that in *Misere* play (last player loses), an extra move is fatal. The argument fails there. |

  **Which deserve class time?**
  *   Spend the most time on **The Conflict (Min 25)**. This is the mechanical heart of the proof.
  *   Spend the second most on **Chess/Draws (Min 35)**. This tests if they understand the *axioms*, not just the algebra.
  *   Let the **Constructivity** question surface early, but defer the answer. It keeps the CS majors engaged without derailing the logic flow.

  ### 4. The Final Task: Failure Analysis
  Your instinct is **correct**. Giving them a game where the argument *fails* distinguishes understanding from memorization far better than another success case. Memorization allows them to recite the proof; understanding requires them to check the preconditions.

  **The Task (10 Minutes):**
  Hand out a slip with two games:
  1.  **5×5 Hex** (Standard rules).
  2.  **Tic-Tac-Toe** (Standard rules).

  **The Question:**
  "The Strategy-Stealing Argument proves Player 1 has a winning strategy in Game 1. It *fails* to prove this for Game 2. Identify the exact axiom in our list that Game 2 violates. Explain why that violation breaks the proof."

  **Why this works:**
  *   **Memorizer:** Will try to run the stealing argument on Tic-Tac-Toe and get confused, or simply write "TTT is a draw."
  *   **Understander:** Will identify **"No Draws / Determinacy"** as the failing axiom. They will explain that the conclusion "P2 has no winning strategy $\implies$ P1 has a winning strategy" requires the absence of a draw outcome.
  *   **Bonus Challenge (for fast finishers):** "Consider *Misere Nim* (last player to move loses). Which axiom fails?" (Answer: Monotonicity. An extra move can force you to take the last object).

  ### 5. Deliberate Omissions
  You must explicitly state what you are *not* doing to manage expectations, particularly for the CS majors.

  **Say this out loud:**
  1.  **"I am not proving Determinacy."** (Zermelo's Theorem is a separate, heavier proof. We are taking it as an axiom for finite games).
  2.  **"I am not giving you the winning move."** (Emphasize the non-constructive nature. For CS majors, mention that finding the move is likely PSPACE-complete, so this proof doesn't help them code a bot).
  3.  **"I am not discussing Infinite Games."** (Borel determinacy is out of scope).
  4.  **"I am not discussing Topology."** (Do not mention Brouwer's Fixed Point Theorem regarding Hex. It's beautiful, but it distracts from the combinatorial logic of strategy stealing).

  **Why omit these?**
  *   **Determinacy Proof:** It consumes 20 minutes alone and relies on backward induction which they know but haven't proved. It dilutes the specific elegance of Strategy Stealing.
  *   **Complexity:** It validates the CS majors' skepticism ("This proof is useless for AI") but doesn't help them understand the *mathematical* argument. Save it for office hours.
  *   **Topology:** It turns a combinatorial session into a topology session. Keep the focus on game states and strategies.

  ### Summary of Flow (50 Minutes)
  *   **00–05:** Intro. Hook: "Who wins 5x5 Hex?" (Unknown). "Who wins Chess?" (Unknown).
  *   **05–15:** **Axioms.** Define the 5 conditions. Play 5x5 Hex in pairs to verify Monotonicity visually.
  *   **15–35:** **The Proof.** Walk through the contradiction. Pause at the "Occupied Square" conflict to invoke Monotonicity.
