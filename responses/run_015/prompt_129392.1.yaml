  In a resource-constrained intensive care unit, a scarce antiviral agent is the only intervention available for five patients presenting with identical acute symptoms, where medical consensus confirms that adhering to either of two competing allocation protocols is statistically optimal for population health over time. Agent A, a bedside physician, adheres to a triage protocol maximizing immediate survivorship, administering the bulk of the supply to four patients while exposing the fifth to a residual dose; due to a rare, biologically predetermined hypersensitivity, the fifth patient suffers a fatal anaphylactic cascade that would have occurred inevitably at that moment regardless of A's specific motor movements, meaning A's action is a but-for cause of the four survivals but not the single death. Simultaneously, Agent B, a hospital administrator operating with identical knowledge and intent to uphold institutional integrity, enforces a competing optimal protocol designed to prioritize long-term survival probabilities by locking the supply cabinet and updating the electronic allocation flag to reserve the full dosage for the fifth patient, who falls under a protected prognostic category; this active enforcement prevents the four others from receiving treatment, making B's protocol enforcement a clear but-for cause of their four deaths, yet resulting in the single fifth patient surviving. Both agents follow allocation rules that are genuinely optimal to adopt generally, and both intend to save lives according to their respective mandates, yet the net outcomes are structurally mirrored: A's intervention yields one dead and four living, while B's withholding yields four dead and one living.

  Under the standard acts/omissions doctrine, Agent A is condemned for killing because their bodily movement initiated the sequence coinciding with the fifth patient's death, whereas Agent B is excused for letting die because their enforcement of the protocol is classified as a withholding of aid relative to the patients' needs, despite the physical act of locking the cabinet. Conversely, a counterfactual-dependence analysis of causal responsibility delivers the opposite verdict: Agent A bears no causal responsibility for the death since the patient would have died regardless of A's movement, while Agent B bears full causal responsibility for the four deaths because those patients would have survived had B not enforced the lock. The precise structural feature driving this reversal is the moral classification of enforcing an institutional default; the acts/omissions framework treats B's active maintenance of the status quo as an omission because it aligns with a pre-existing rule, whereas A's deviation from the status quo to distribute resources counts as an act. A defender of the acts/omissions distinction could attack this case by challenging that classification, arguing that B's physical intervention to lock the cabinet constitutes a genuine act rather than an omission, thereby collapsing the moral asymmetry and forcing the doctrine to condemn B as well, or alternatively, by arguing that the "default" status is morally arbitrary and should not shield an agent from the classification of killing when their causal efficacy is direct.
