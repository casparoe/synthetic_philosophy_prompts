answer: |-
  Your "borrowing" versus "forging" distinction is a strong start, but it measures *fidelity to facts* rather than *stewardship of memory*. It tells you if the dramatist lied, but not if they wronged anyone. To make this piece land, you need to shift the axis from accuracy to agency. The question isn't whether the script matches the transcript; it's whether the living have the right to rewrite the dead's final act.

  Here is where your frame holds, where it collapses, and the specific conceptual tools you need to fix it.

  **The Legasov Speech: Theft of Agency, Not Fact**
  You identified the trial speech as the breaking point. Your "forging" label fits, but it misses the moral weight. Legasov didn't give that speech in 1988. By giving it to him, Mazin isn't just filling a silence; he is granting Legasov a redemption arc the historical record denies him.
  This isn't a gift; it's a theft of agency. You argue that Legasov was moving toward truth in his final years (the tapes). True, but the show collapses a slow, painful moral reckoning into a single courtroom moment. That transforms a complex psychological unraveling into a heroic stand. The harm here isn't to Legasov's feelings (he's dead); it's to his *narrative autonomy*. We owe the dead the right to have their contradictions remain contradictions. Smoothing them out makes them useful to us, but it turns them into puppets. The wrong is treating a human life as raw material for a thematic point about "the cost of lies."

  **Khomyuk and the Lie of the Room**
  Your borrowing/forging frame fails with Khomyuk because she is neither. She is a *consolidation*. You ask if this is a wrong of erasure. It is, but specifically, it is a wrong of *narrative gentrification*.
  Chernobyl was solved by a messy, scattered collective of hundreds. Khomyuk compresses them into one brilliant, tenacious woman. This creates a lie about *how science works*. It suggests that breakthroughs come from a lone hero sneaking into a control room, rather than the grind of institutional labor. The actual people she represents aren't just erased; their specific mode of bravery (bureaucratic, collective, tedious) is replaced by a cinematic mode (individual, rebellious, flashy).
  The wrong isn't just to the unnamed scientists; it's to the audience's understanding of history. A composite character is almost always a lie about what the room looked like. It implies a centrality that didn't exist. To avoid this, a composite would need to explicitly signal its own multiplicity, which drama rarely does.

  **The Alexievich Layer: Mediated Memory**
  You need a third category for the Alexievich connection. Call it *Mediation*.
  If *Voices from Chernobyl* is already a literary construction (curated, edited, perhaps ventriloquized), then the show is dramatizing a memory of a memory. This doesn't loosen the duty; it relocates it. You are no longer answerable to the transcript, but to the *texture of the testimony*.
  The danger here is recursive fiction. If Alexievich polished the rough edges of grief to make it readable, and Mazin polishes it further to make it watchable, the suffering becomes aestheticized. The duty is to preserve the *friction* of the source. If the source feels raw and confused, the drama shouldn't make it coherent. If you smooth out the confusion, you are stealing the reality of the trauma to serve the pacing of the episode.

  **The Harm Question: Posthumous Autonomy**
  Your editor's skeptic is relying on a physical definition of harm (pain, loss of income). You need a normative one.
  We recognize posthumous rights in law (wills, copyrights, defamation in some jurisdictions). Why? Because we accept that a person's interest in their reputation and narrative survives their biological function.
  The argument isn't that Legasov feels pain. It's that the living are *custodians* of the dead's identity. When you rewrite a dead person's key actions, you violate their posthumous autonomy. You are making them say things they chose not to say. The damage figure is *historical distortion*. If a million people now believe Legasov confessed in court, the historical record has been shifted. The victim is the truth, and the beneficiary is the drama. That is a conflict of interest.

  **The Receipt Problem**
  Your editor is wrong about the title cards. A correction after the emotional payoff is not a correction; it's a footnote.
  Drama works on emotional imprinting. The audience feels the truth of the scene in their bodies during the broadcast. Reading a text card three minutes later engages a different cognitive process. It's intellectual, not visceral.
  The obligation isn't just to disclose; it's to make the disclosure *sticky*. If the invention is dramatic enough to be remembered, the correction must be equally prominent. Ideally, the drama itself should signal its own artifice. When it doesn't, the "receipt" is just legal cover, not ethical repair.

  **Where the Show Resists: Dyatlov and the Limit of "Higher Truth"**
  You asked where the show resists this reading. It's in the depiction of Anatoly Dyatlov.
  Mazin's defense is "higher-order truth": the Soviet system lied, so the drama must lie to tell the truth about lying. This works for Legasov (hiding the truth to survive) but fails for Dyatlov.
  The show depicts Dyatlov insisting the core didn't explode while standing in radioactive debris. Many engineers argue this is a caricature; he likely knew the severity immediately. Here, the "higher truth" defense collapses into villainization. The show needs a villain to personify the "cost of lies," so it makes Dyatlov more stubborn than the record supports.
  This is the limit of Mazin's philosophy. You can compress facts to show a systemic truth, but you cannot demonize a specific individual to do it. When the "higher truth" requires a specific real person to be the scapegoat, it stops being philosophy and starts being sacrifice. The show gets away with it because Dyatlov is unlikable, but ethically, it's the same forgery as the Legasov speech, just without the flattery.

  **What Not to Leave Out**
  1.  **The Anonymous Dead:** The bridge scene. Inventing specific deaths for unnamed people is less about wronging individuals and more about *exploiting the tragedy's aesthetic*. It risks turning suffering into spectacle. The metric here isn't accuracy; it's *necessity*. Did the story need that baby to die on screen to make its point? If yes, it's exploitation. If no, it's gratuitous.
  2.  **The "Noble Lie" Defense:** Don't let Mazin's "lies cost lives" thesis off the hook. It's a powerful argument, but it's circular. Using a lie to tell the truth about lies is a paradox that only works if the audience knows it's a lie. Since most don't, the show replicates the very Soviet dynamic it critiques: the authorities (filmmakers) know the truth, but the people (audience) get the version that's good for them.

  **The Takeaway**
  Your draft should conclude that dramatizations don't owe the dead accuracy; they owe them *integrity*. Accuracy is about data; integrity is about agency.
  When you compress (Khomyuk), you distort the *method* of history.
  When you forge (Legasov), you distort the *moral character* of history.
  When you villainize (Dyatlov), you distort the *complexity* of history.
  The "receipt" at the end doesn't fix this because the harm happens in the watching, not the reading. The dead cannot defend themselves, which means the burden of restraint falls entirely on the living. If the story requires breaking a real person to work, the ethical move isn't to add a title card; it's to change the name. If you keep the name, you keep the chain of custody.

  Your frame holds for facts, but you need to upgrade it to measure *narrative rights*. The dead own their stories. We are just renting them.
