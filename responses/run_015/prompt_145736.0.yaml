answer: |-
  It is excellent that you are revisiting this literature for your seminar; your intuition is shared by many who first encounter the doctrinal paradox (or discursive dilemma). You are technically correct on the narrow logical point: **a premise-based procedure (PBP) does guarantee collective consistency.** If a group votes only on a set of logically independent premises and derives conclusions via deduction, the resulting judgment set will be deductively closed and consistent.

  However, the reason philosophers and social choice theorists do not treat this as a "solution" that dissolves the problem is that PBP merely **displaces** the dilemma from the domain of logic to the domain of normative political theory and agenda control. The discursive dilemma is not treated as a puzzle to be solved by a specific algorithm, but rather as an impossibility result demonstrating that certain desirable properties of collective decision-making are incompatible.

  Here are the four primary reasons why PBP is not considered a universal fix, which should help frame the discussion for your graduate students.

  ### 1. The Trade-off: Consistency vs. Responsiveness
  The most significant cost of PBP is that it sacrifices **responsiveness** (or conclusion-based majoritarianism) to secure consistency.

  In a standard discursive dilemma scenario:
  *   Majority votes Yes on $P$.
  *   Majority votes Yes on $Q$.
  *   Majority votes No on $P \land Q$.

  If you adopt PBP, you accept $P$ and $Q$, and therefore the collective accepts $P \land Q$. However, this means the collective outcome on the conclusion ($P \land Q$) contradicts the majority view on that specific conclusion.

  For your students, the key question is: **Why should the derived judgment trump the direct judgment?**
  *   **Epistemic View:** If the goal is truth-tracking (e.g., a scientific committee), PBP is often superior. The Condorcet Jury Theorem suggests that if individuals are competent on the premises, the probability of the collective reaching the *true* conclusion is higher via PBP than via direct voting on the conclusion.
  *   **Political View:** If the goal is representing the will of the people (e.g., a legislature or jury verdict), PBP can seem undemocratic. It forces the group to accept a conclusion that a majority explicitly rejected.

  Thus, the "anxiety" surrounding the dilemma is not about logical inconsistency per se, but about the **normative cost** of resolving it. PBP solves the logical problem by violating the condition that the collective judgment on any proposition should depend solely on individual judgments on that proposition (a condition related to *Systematicity* or *Independence*).

  ### 2. The Impossibility Theorem Context
  You asked if there are intractable cases where PBP collapses. In a sense, yes, but not logically—rather, axiomaticaly.

  The landmark paper by **List and Pettit (2002)** formalized this. They proved that no aggregation function can satisfy the following four conditions simultaneously:
  1.  **Universal Domain:** Accepts any profile of consistent individual judgments.
  2.  **Anonymity:** All voters count equally.
  3.  **Systematicity (or Independence):** The collective judgment on each proposition depends only on individual judgments on that proposition (and the same function is used for all propositions).
  4.  **Consistency:** The collective judgment set is consistent.

  PBP satisfies Consistency, Anonymity, and Universal Domain, but it **violates Systematicity**. It treats premises differently from conclusions. It privileges certain propositions as "inputs" and others as "outputs."

  Therefore, the discursive dilemma is not just an artifact of bad procedure; it is a manifestation of a deeper impossibility theorem. Recommending PBP is not recommending a "correct" procedure; it is recommending a specific *violation* of Systematicity. For your seminar, this is crucial: the dilemma shows we must choose which axiom to drop. PBP drops Systematicity; Conclusion-Based Voting drops Consistency.

  ### 3. The Problem of Agenda Power (Premise Selection)
  You asked about "hidden structural costs." The most profound one is **agenda control**.

  For PBP to work, the group must agree on which propositions are "premises" and which are "conclusions." In many institutional settings, this distinction is contestable and politically charged.
  *   **Judicial Context:** In a court case, is the statute a premise and the verdict the conclusion? Or is the interpretation of the statute the conclusion derived from the facts and the constitution? Different judges may structure the logic differently to achieve different outcomes.
  *   **Scientific Context:** Is the theoretical framework the premise from which data predictions are derived? Or is the empirical data the premise from which the theory is induced?

  If the choice of premises determines the outcome (which it does in PBP), then the power to define the agenda becomes the power to decide the result. This introduces a vulnerability to manipulation that conclusion-based voting avoids (since conclusion-based voting treats all propositions equally, even if it yields inconsistency).

  ### 4. Logical Interdependence and Non-Linearity
  You asked if there are complex logical architectures where PBP fails. While PBP guarantees consistency *if* the premises are logically independent, real-world agendas often involve **interconnected constraints** where the distinction between premise and conclusion is blurred.

  *   **Coherentism vs. Foundationalism:** PBP assumes a foundationalist logic (Basic Premises $\rightarrow$ Derived Conclusions). However, many judgment sets are coherentist, where propositions support each other bidirectionally (e.g., in economic policy, inflation targets depend on employment goals, which depend on inflation expectations). In such networks, there is no clear "premise" set to vote on.
  *   **Inconsistency within Premises:** If the agenda setter inadvertently includes propositions in the "premise" set that are logically related (e.g., voting on $P$, $Q$, and $P \to R$ as premises), majority voting on the premises themselves can generate inconsistency *before* deduction occurs. To avoid this, the "premise" set must be a **logical basis** (logically independent). Identifying such a basis in complex policy environments is often non-trivial or impossible.

  ### Pedagogical Suggestion for Your Seminar
  Since you are teaching this, you might frame the discursive dilemma not as a problem to be solved, but as a **trilemma**. You can present your students with three competing desiderata:
  1.  **Collective Rationality** (Consistency & Completeness)
  2.  **Democratic Responsiveness** (Majority rule on all propositions / Systematicity)
  3.  **Agenda Neutrality** (No proposition is privileged as a premise)

  The literature shows you can only have two.
  *   **PBP** keeps 1 and 2 (mostly), but sacrifices 3 (privileges premises).
  *   **Conclusion-Based Voting** keeps 2 and 3, but sacrifices 1 (allows inconsistency).
  *   **Dictatorship/Supermajority** keeps 1 and 3, but sacrifices 2.

  ### Summary
  The persistence of the "anxiety" in the literature is not because philosophers have overlooked the PBP solution. It is because PBP solves the *logical* problem by creating a *political* one. It guarantees consistency by insulating certain judgments from direct majoritarian control.

  For your seminar, the "deep obstacle" is not that we cannot construct a consistent collective mind (we can, via PBP or dictatorship). The obstacle is that we cannot construct a collective mind that is simultaneously consistent, democratic, and neutral regarding the structure of the issues at hand. The discursive dilemma is the proof of that impossibility.
