answer: |-
  Your hypothesis is astute: the impasse is not primarily empirical, nor is it a simple clash of first principles. It is a **category error compounded by a temporal mismatch.** The debate stalls because the two sides are using the concept of "legitimacy" to do fundamentally different work, while simultaneously disagreeing on the timeline of political evaluation.

  Here is a diagnosis of the fracture, grounded in the specific arguments you encounter, followed by a proposal for what constitutes genuine progress.

  ### 1. The Diagnosis: A Conflation of Three Registers

  The debate appears to be binary (Authoritarian Performance vs. Democratic Procedure), but it is actually a triangulation failure. The defenders and critics are operating across three distinct registers of legitimacy, often sliding between them without acknowledgment.

  **A. Sociological Legitimacy (The Defender's Hidden Premise)**
  When defenders point to Singapore or China, they are often describing *sociological* legitimacy: the empirical fact that a population complies with authority and perceives it as appropriate.
  *   **The Argument:** "The regime delivers growth and order; therefore, the people accept it."
  *   **The Function:** This is a descriptive claim about stability. In post-conflict reconstruction, this is a vital metric. If a government cannot secure compliance, reconstruction fails.
  *   **The Conflation:** Defenders slide from "people *do* accept this" (sociological) to "this authority is *rightful*" (normative). They treat stability as a moral good in itself (a Hobbesian argument), implying that the avoidance of chaos generates a moral obligation to obey.

  **B. Normative Legitimacy (The Critic's Core Premise)**
  Critics operate almost exclusively in the register of *normative* legitimacy: the moral justification for the use of coercion.
  *   **The Argument:** "Rights violations cannot be priced out by welfare gains."
  *   **The Function:** This is a deontological claim. It asserts that there are constraints on power that welfare cannot override.
  *   **The Conflation:** Critics often treat procedural democracy as the *only* source of normative legitimacy. By dismissing the Singapore/China cases as "exceptional" or "repressive," they sometimes fail to engage with the consequentialist moral claim: that in specific contexts (like post-conflict zones), the *right to life/security* (delivered by authoritarians) might temporally precede the *right to participation*.

  **C. Consequentialist Legitimacy (The Defender's Explicit Claim)**
  This is where the "performance" argument tries to bridge the gap. It claims that outputs *generate* normative weight.
  *   **The Argument:** "When democratic procedures yield paralysis... performance itself generates a distinctive kind of political obligation."
  *   **The Flaw:** This relies on a utilitarian calculus that critics reject. But more importantly, it relies on an **ex-post** evaluation (judging by results achieved) against a critic's **ex-ante** framework (judging by rights secured beforehand).

  **The Verdict:** The impasse is **structural and categorical.** Side A is arguing that *effectiveness creates rightfulness* (Consequentialist Normativity), while Side B is arguing that *process creates rightfulness* (Deontological Normativity). However, Side A often leans on Side C (Sociological stability) to prove Side A, which Side B rejects as irrelevant to morality. They are not just disagreeing on values; they are disagreeing on what kind of question is being asked.

  ### 2. Grounding the Diagnosis in the Specific Cases

  **The Singapore/China Appeal**
  *   **Defenders** use Singapore and China as **existence proofs** that the liberal sequence (liberty $\rightarrow$ prosperity) can be inverted (prosperity $\rightarrow$ liberty, or perhaps prosperity without liberty). They argue these cases demonstrate that "legitimacy" is a variable, not a binary.
  *   **Critics** treat these cases as **outliers or illusions.** They argue Singapore is unreplicable (city-state, unique history) and China's growth is fragile because it lacks institutionalized succession mechanisms.
  *   **The Fracture:** Defenders see these cases as *models of capacity*; Critics see them as *warnings about fragility.* The defender asks, "Did it work?" The critic asks, "Is it just?" and "Is it sustainable without consent?"

  **The Growth-and-Order Defense vs. Rights-Based Rejection**
  *   **Defenders** implicitly argue from a **baseline of violence.** In post-conflict settings, the counterfactual to authoritarian order is often not liberal democracy, but warlordism or state collapse. Therefore, "order" is not just a utility; it is a prerequisite for any rights at all.
  *   **Critics** argue from a **baseline of autonomy.** They contend that buying order with repression creates a "debt" of injustice that compounds over time, eventually leading to violent correction (revolution).
  *   **The Fracture:** This is a disagreement about **risk.** Defenders fear the immediate risk of chaos; Critics fear the long-term risk of tyranny.

  ### 3. The Hidden Disagreements: Time and Counterfactuals

  You correctly identified hidden disagreements about counterfactuals and temporal orientation. These are not merely "hidden"; they are the engine of the stall.

  **Ex-Post vs. Ex-Ante**
  *   **Defenders (Ex-Post):** Legitimacy is an *achievement.* You rule well, therefore you are legitimate. This allows for "tutelary authoritarianism"—a temporary suspension of rights to build capacity.
  *   **Critics (Ex-Ante):** Legitimacy is an *entitlement.* You must have the right to rule before you exercise power. Without this, any "good" outcomes are acts of benevolence, not governance, and can be revoked at whim.
  *   **Why it Stalls:** You cannot reconcile an achievement-based metric with an entitlement-based metric without agreeing on a timeline.

  **The Counterfactual Baseline**
  *   Defenders claim: "Democracy would have failed here." (e.g., Weimar Germany, post-invasion Iraq).
  *   Critics claim: "You cannot prove that, and assuming it justifies tyranny."
  *   **Why it Stalls:** This is empirically undecidable in the moment. It requires a historical judgment that policy drafters cannot make with certainty.

  ### 4. What Counts as Progress?

  To move your governance recommendations forward, you must stop trying to resolve the philosophical debate and start **reframing the operational question.** A conceptual distinction alone is academic; a reframing is actionable.

  **Do not seek:**
  *   **Empirical Resolution:** You will not prove whether democracy would have failed in a specific post-conflict zone.
  *   **Moral Consensus:** You will not convince the deontologist that welfare trumps rights, nor the consequentialist that rights trumps welfare.

  **Do seek:**
  *   **A Dynamic/Teleological Reframing:** Shift the question from "Is this regime legitimate?" to "Does this governance arrangement build a *trajectory* toward normative legitimacy?"

  **Specific Recommendations for Your Draft:**

  1.  **Distinguish "Legitimacy of Order" from "Legitimacy of Justice."**
      *   Acknowledge that in immediate post-conflict phases, *sociological legitimacy* (compliance/stability) is the operational priority. Label this "Provisional Authority."
      *   However, codify that Provisional Authority lacks *normative legitimacy* unless it includes a credible, time-bound mechanism for transitioning to *procedural legitimacy* (consent).
      *   *Progress:* This accepts the Defender's point (we need order first) without accepting their conclusion (order is enough forever). It validates the Critic's point (rights matter) without demanding immediate democratic perfection that might cause collapse.

  2.  **Make the "Performance Legitimacy" Transition Explicit.**
      *   Argue that performance legitimacy is **depreciating capital.** It works only as long as growth continues. If growth stalls, the regime has no procedural fallback.
      *   *Policy Implication:* Governance recommendations must focus on **institutionalizing success.** If an authoritarian actor delivers growth, the policy goal should be to use that surplus to build independent courts, civil society, or local councils that can eventually absorb the shock of political opening.
      *   *Progress:* This turns the Singapore/China debate into a technical question: "Does this specific performance build institutions that survive the leader, or does it personalize power?"

  3.  **Reframe the Counterfactual.**
      *   Instead of asking "Would democracy have worked?", ask "Does this arrangement increase the *capacity* for future democracy?"
      *   If the authoritarian reconstruction creates a dependent populace, destroys civil society, or entrenches kleptocracy (even a "efficient" one), it fails the test, regardless of GDP growth.
      *   *Progress:* This aligns the Defender's metric (capacity) with the Critic's metric (autonomy).

  ### Summary

  The impasse exists because Defenders are arguing for **governance capacity** (can they rule?) while Critics are arguing for **political justification** (may they rule?).

  Progress lies in recognizing that in post-conflict reconstruction, **capacity is a prerequisite for justification, but not a substitute for it.** Your recommendations should treat "performance legitimacy" not as a final state, but as a **bridge.** If the bridge leads to a cliff (entrenched autocracy), the performance was illegitimate. If the bridge leads to a plaza (institutionalized consent), the performance was a valid transitional tool.

  By evaluating authoritarian performance based on its **terminal conditions** rather than its **initial outputs**, you dissolve the binary. You allow for the utility of order without surrendering the necessity of rights.
