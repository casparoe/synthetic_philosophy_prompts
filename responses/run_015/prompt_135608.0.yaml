answer: |-
  ### The Desiderata Specification

  **1. The Standard-Care Anchor (Non-Negotiable)**
  *   **Case:** Vaccines, statins, and reconstructive surgery post-mastectomy must classify as therapy.
  *   **Constraint:** A theory that flags preventive maintenance or restoration of species-typical function as "enhancement" is administratively dead on arrival.

  **2. The Context-Sensitivity Clause (Non-Negotiable)**
  *   **Case:** Methylphenidate treats narcolepsy (therapy) but aids exam cramming (enhancement); the molecule is identical.
  *   **Constraint:** Classification cannot rely solely on the intervention's mechanism; it must index the recipient's baseline and indication.

  **3. The Social-Functioning Provision (Preference: Disability/Social Camp)**
  *   **Case:** A cleft palate in a culture where it invites ostracization; idiopathic short stature in a height-biased labor market.
  *   **Constraint:** The theory must admit that "dysfunction" can be constituted by social friction, not just biological failure, without collapsing into "anything disliked is a disease."

  **4. The Positional Arms Race Constraint (Non-Negotiable)**
  *   **Case:** Cognitive stimulants in a competitive school system; sleep-reduction drugs in a 30-hour shift profession.
  *   **Constraint:** The theory must identify when a benefit is purely relative (zero-sum) and permit the committee to deny funding even if the individual "need" is genuine, without declaring the trait a disease.

  **5. The Degraded-Baseline Handler (Preference: Public Health Camp)**
  *   **Case:** Immune boosters in an endemic pathogen zone; hearing protection in an industrial factory.
  *   **Constraint:** Must allow the environment to be the "pathology" warranting intervention, without classifying every adaptation to a toxic environment as mandatory therapy.

  **6. The Trade-Off Acknowledgement (Preference: Medical Naturalist)**
  *   **Case:** Focus drugs that impair divergent thinking; sleep reduction that erodes emotional memory.
  *   **Constraint:** Classification cannot assume "more capacity = better"; it must account for net physiological cost, though this may be a regulatory rather than classificatory hurdle.

  **7. The No-Baseline Accommodation (Non-Negotiable)**
  *   **Case:** Germline editing; prenatal cognitive intervention.
  *   **Constraint:** Cannot rely on "restoration" of a prior healthy state; must evaluate the trajectory against a normative floor, not a historical baseline.

  **8. The Adaptive Preference Paradox (Preference: Liberal/Autonomy Camp)**
  *   **Case:** Deaf culture rejection of cochlear implants; DBS patient whose family claims personality change.
  *   **Constraint:** Must weigh self-reported welfare against objective functioning when the subject's preferences have been shaped by exclusion or the intervention alters the "self" reporting.

  **9. The Third-Party Benefit Rule (Non-Negotiable)**
  *   **Case:** Steady hands for a surgeon; alertness for a pilot; herd immunity via vaccines.
  *   **Constraint:** Must distinguish between "medical need" and "occupational requirement," preventing employers from offloading safety costs onto the medical budget via the therapy label.

  **10. The Classification-Funding Firewall (Non-Negotiable)**
  *   **Case:** An expensive gene therapy vs. a cheap cosmetic procedure.
  *   **Constraint:** "Too expensive" cannot equal "enhancement." The theory must define *what it is* separately from *what we can afford*, or it merely rationalizes rationing.

  ***

  ### Analysis of Desiderata and Camp Reflexes

  **Real Desiderata vs. Camp Reflexes**
  Desiderata 1, 2, 7, 9, and 10 are **Real Desiderata** for your specific job (the Reimbursement Committee). They are conditions of administrative viability and legal defensibility. Desiderata 3, 5, and 8 are **Camp Reflexes**: 3 and 5 belong to the Social/Disability camp (demanding social context count), while 6 belongs to the Medical Naturalist camp (demanding biological cost count). Desideratum 4 (The Ratchet) is a **Hybrid**: it is required by the Luck Egalitarian (justice requires neutralizing positional disadvantages) but creates a nightmare for the Medical Naturalist (positional value is not a biological fact).

  **The Secondary Job (State/Employer)**
  It cannot be the *exact* same theory, but it must be the same *framework*. For reimbursement, the threshold is "medical necessity." For state discouragement, the threshold is "harmful arms race" (Ratchet). For employer requirements, the threshold is "safety-critical function" (Third-Party Benefit). If you use the reimbursement theory to ban out-of-pocket enhancements, you violate liberty; if you use it to allow employer mandates, you violate bodily autonomy. The theory classifies the *intervention*, but the *policy lever* changes based on the actor.

  **The Impossible Trinity**
  You are correct: **Descriptive + Determinate + Ratchet-Handling** is unsatisfiable.
  1.  **Descriptive (Value-Free):** Relies on biological stats. Cannot see "positional value," which is social/normative. Fails the Ratchet.
  2.  **Determinate (Binary):** Requires clear boundaries. The Ratchet is a sliding scale (when does uptake become compulsory?). Fails Determinacy.
  3.  **Ratchet-Handling:** Requires comparing the individual to the social context. Fails Descriptive.
  *Verdict:* To save the Committee's job, you must sacrifice **Descriptive**. You must admit that "therapy" is partly a normative social category, not a biological one. If you insist on value-free biology, you will fund the arms race (because the biology looks "improved") and bankrupt the system.

  **The Most Exclusionary Requirement**
  **The Positional Arms Race Constraint (4).**
  This knocks out the most "usual candidates" (cosmetic orthodontics, cognitive stimulants in competitive fields, height extension). Most standard bioethics examples assume the benefit is intrinsic. Once you admit that benefits can be purely positional and socially self-defeating, the category of "fundable enhancement" collapses to near zero, and many "therapies" (like fixing short stature in a non-pathological case) get reclassified as non-essential social adaptation.

  ***

  ### Contender Evaluation

  **Wellbeing/Welfare-Based Accounts**
  Maximizes subjective gain but fails the "contested good life" constraint; the Committee cannot adjudicate between competing visions of welfare without political backlash.
  Collapses under the Ratchet: if everyone feels better competing, the theory funds the arms race until the budget breaks.

  **Normal-Function/Biostatistical Accounts**
  Highly determinate and respects the Descriptive constraint; easy for bureaucrats to apply to claim forms.
  Fails the Degraded-Baseline and No-Baseline cases; cannot justify intervention where species-typical function is the problem or doesn't exist yet.

  **Fair-Equality-of-Opportunity Accounts**
  Handles the Ratchet and Third-Party Benefit best; aligns funding with leveling the playing field rather than fixing biology.
  Violates the "no contested good life" constraint; defining "fair opportunity" is inherently political and varies by administration.

  **Cost-Benefit/Continuum Views**
  Administratively efficient and dissolves the binary trap; treats everything as an investment with a return rate.
  Destroys the distinction entirely; if the ROI is high enough, eugenics becomes therapy, and the Committee loses its ethical firewall.
