prompt: |-
  I'm a novelist, on what I hope is the last-but-one draft of my third book — near-future thing, mostly set in and around a fertility clinic, with a big flashback section set in 1962. My editor has twice now come back with the same note: my named characters are roughly half and half, but the people in the background default to male and the people who get *described* are almost always female. The embryologist just does things; the nurse has a grey bun and small hands. A senior consultant is a man until I say otherwise; when a woman has authority I apparently feel obliged to add a sentence about her shoes or her kid. I want to catch this myself, before copyedit, instead of paying someone to tell me again.

  Here's the half-formed thing I keep circling back to. There's that 1985 Hofstadter satire written under a pen name, where he takes the structure of an earnest essay arguing against racist language and runs it backwards — arguing that the traditional, generic-sounding usage is obviously right and the reformers are cranks, using exactly the arguments people actually use to defend the status quo, with the markers swapped. The clever bit isn't that he invents new arguments; it's that the reader's discomfort at the mirror is the whole evidence. That move — don't argue, just flip the marker and notice what feels wrong and *why* — feels like it should be something I can actually run on a chapter, and not just on individual words like generic he or the -man compounds.

  So: write me a procedure. Concretely what I need:

  - Something I run alone, on a chapter, in twenty minutes or so, with no linguistics background and no software. I have about forty chapters and six weeks.
  - The questions in order, and what counts as a sufficient answer to each — not vibes. Say where the procedure stops with a no (fix this sentence before moving on) and where it hands the decision back to me because the question is about what I'm trying to do rather than what the text does.
  - It has to go past pronouns to the defaults underneath: whose competence is assumed, whose body gets described and in what register, who gets interiority versus who gets explained, who acts versus who is acted on, which characters need a credential supplied and which are just granted one. And it should generalise the flip to other axes where it works — race, class, nationality, age, disability, religion — and tell me honestly where the flip stops being a good test.
  - Be explicit about which steps are judgement calls dressed up as procedure. I can tell when I'm being handed a rubber stamp.

  Run it on three things from my draft. One: the clinic opening I described above, where the unnamed embryologist acts and the unnamed nurse is a body. Two: chapter 9, where I already "fixed" a flagged scene by changing the lab technician from a man to a woman and leaving everything else about him/her exactly as written — I suspect this fails the flip, and I'd rather be told plainly than have it explained gently. Three, and this is the one I'll argue with: chapter 12, where my narrator (a burnt-out middle-aged male fixer, very much a character and not me) describes a government minister's legs in the middle of a scene where she is refusing him something. I think that's characterization and voice and load-bearing; if your procedure says cut it, I want to see the argument, including the version where it says keep it but do something else.

  Also: chapter 21 is set in 1962 and the whole point of several scenes is that a woman couldn't do the thing she's doing. The flip is anachronistic there, and I don't want a procedure that either lets me off the hook or tells me to write a false world. Tell me what running it on that chapter is supposed to produce.

  And tell me what the procedure can't do. My worries: that the jolt I feel on a flip tells me about me or about the reader rather than about the sentence; that a flip can launder a bias rather than remove it; that sometimes the asymmetry is real-world base rates and not my prose; that some of this is style and voice and has no correct answer.

  Last thing. As you go, separate what's actually settled among people who work on this from what's contested. I mean: is it established that generics like he and -man compounds are not read as neutral, or is that a live fight? Does changing the words do anything to how people think, or only track what they already think? Does the satire actually show anything, or is it just a good joke? I'd rather you flag a claim as contested than hand me a confident line I'll repeat at a reading and get corrected on. Don't put in any citations or reading suggestions — I'll chase those myself if I ever want them, and I definately don't want a bibliography in this.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Novelist, near-future book (fertility clinic) + 1962 flashback. Last-but-one draft.
      *   **Problem:** Editor flagged gender bias in background characters (men = default/active, women = described/body/passive). User wants to fix this *before* copyedit.
      *   **Goal:** A concrete, 20-minute per chapter procedure to self-audit bias without linguistics background or software.
      *   **Methodology:** Inspired by Hofstadter's 1985 satire (flipping markers to reveal discomfort). Needs to go beyond pronouns to competence, description, interiority, agency, credentials. Needs to generalize to other axes (race, class, etc.) but acknowledge limits.
      *   **Specific Constraints:**
          *   Order of questions + criteria for "sufficient answer."
          *   Identify "Stop/Fix" vs. "Authorial Choice."
          *   Identify "Judgement Calls dressed as procedure."
          *   Run the procedure on three specific examples provided by the user (Clinic Opening, Chapter 9 "fix", Chapter 12 Narrator Voice).
          *   Address Chapter 21 (1962 setting) specifically regarding historical accuracy vs. bias.
          *   Address limitations/worries (reader vs. writer bias, laundering bias, base rates, voice).
          *   **Crucial:** Distinguish between *settled* consensus and *contested* claims in linguistics/sociology. No citations/bibliography.

  2.  **Deconstruct the "Flip" Method:**

      *   The core idea is "Counterfactual Substitution." If swapping $X$ for $Y$ changes the *meaning* or *feel* of the text in a way that isn't intended, there's a hidden assumption.
      *   *Settled vs. Contested:*
          *   *Settled:* Generic "he" is not read as truly neutral by most modern readers (psycholinguistics). Stereotyping in background characters affects immersion/perception.
          *   *Contested:* How much language *shapes* thought (Sapir-Whorf strong vs. weak). Whether "fixing" text changes real-world behavior. The artistic merit of "unreliable narrator" bias (is it critique or complicity?).

  3.  **Drafting the Procedure (The "20-Minute Audit"):**

      *   Need to break it down into steps that fit the time limit.
      *   *Step 1: The Headcount (Quantitative).* Quick tally.
      *   *Step 2: The Verb Test (Agency).* Who does vs. who is.
      *   *Step 3: The Description Test (Objectification).* Body vs. Action.
      *   *Step 4: The Credential Test (Authority).* Who needs explaining?
      *   *Step 5: The Flip (The Hofstadter Move).* Apply the swap.
      *   *Step 6: The 1962 Exception.* Handle historical context.
      *   *Step 7: The Voice Defense.* Handle narrator bias.

      *   *Refining the "Stop/Go" criteria:* Needs to be binary where possible.
      *   *Refining "Judgement Calls":* Must be explicit.

  4.  **Running the Procedure on the User's Examples:**

      *   *Example 1 (Clinic Opening):* Embryologist (he/acts) vs. Nurse (she/body).
          *   *Flip:* Embryologist (she/acts) vs. Nurse (he/body).
          *   *Result:* Likely feels "wrong" because the original relied on gendered stereotypes of care vs. science.
          *   *Verdict:* Fix.
      *   *Example 2 (Chapter 9 "Fix"):* Lab tech changed M->F, nothing else.
          *   *Flip:* Change back F->M.
          *   *Result:* If the behavior was stereotypically "female" (nurturing, passive) and now attached to a woman, the flip to a man might feel "weak man" or the original felt "bossy woman."
          *   *Verdict:* Likely a "token fix" that failed the underlying structure.
      *   *Example 3 (Chapter 12 Narrator):* Narrator describes Minister's legs.
          *   *Flip:* Female narrator describes Male Minister's legs/thighs.
          *   *Result:* Feels sexualized/threatening in a different way.
          *   *Nuance:* Is the narrator *supposed* to be sexist? If yes, does the text critique him or endorse him?
          *   *Verdict:* Authorial Choice (Voice), but requires scrutiny on *consequence*.
      *   *Example 4 (Chapter 21 - 1962):* Woman doing "impossible" thing.
          *   *Flip:* Man doing it.
          *   *Result:* Removes the conflict.
          *   *Verdict:* Do not flip the *world*, flip the *gaze*. How is her struggle described vs. a man's?

  5.  **Addressing the "Settled vs. Contested" Requirement:**

      *   *Generic He:* Settled that it primes male imagery. Contested how much it matters in fiction vs. legal text.
      *   *Language shaping thought:* Contested (Strong Whorfianism is dead, weak priming is accepted).
      *   *Hofstadter Satire:* Settled as a effective rhetorical device, contested on whether it changes minds.

  6.  **Addressing the Limitations/Worries:**

      *   *Jolt tells me about me:* Yes, the procedure measures *your* internalized norms + *anticipated* reader norms.
      *   *Laundering bias:* Yes, swapping genders without swapping traits just moves the stereotype.
      *   *Base rates:* Real world is skewed. Fiction world doesn't have to be, but if it claims realism, it must account for why.
      *   *Voice:* Unreliable narrators are allowed to be biased, but the *narrative* shouldn't be blind to it.

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the task and the Hofstadter inspiration.
      *   **Section 1: The Status of the Science (Settled vs. Contested):** Get the epistemological housekeeping out of the way first as requested.
      *   **Section 2: The Procedure (The 20-Minute Audit):** Step-by-step instructions with Stop/Go criteria.
      *   **Section 3: Running the Audit (Your Three Examples + 1962):** Applying the steps to the specific scenes.
      *   **Section 4: Limitations & The "Rubber Stamp" Warning:** Addressing the user's worries about validity and voice.

  8.  **Refining the Tone:**

      *   Professional, direct, collaborative but firm.
      *   Avoid preaching.
      *   Respect the "novelist" persona (craft-focused).
      *   Ensure the "Judgement Call" warnings are prominent.

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I include citations? *No.*
      *   *Check:* Did I distinguish settled/contested? *Yes, in Section 1.*
      *   *Check:* Is the procedure under 20 mins? *Yes, if kept to sampling.*
      *   *Check:* Did I address the 1962 chapter specifically? *Yes.*
      *   *Check:* Did I handle the "Narrator Voice" argument? *Yes, distinguishing character bias from narrative endorsement.*
      *   *Check:* Is the Hofstadter reference accurate? *Yes, "A Person Paper on Purity in Language" (1985).*
      *   *Check:* Did I explicitly mark where the procedure stops and authorial choice begins? *Yes, in the Step criteria.*

  10. **Final Polish:** Ensure the distinction between "Fix this sentence" (Objective failure) and "You decide" (Subjective craft) is clear. Make sure the 1962 section doesn't sound like "history doesn't matter."

  *(Self-Correction on the Hofstadter reference)*: The user mentions a 1985 Hofstadter satire under a pen name. This is "A Person Paper on Purity in Language" written by Douglas Hofstadter under the pseudonym "William Satire" (a play on William Safire). It argues *for* racist/sexist language by swapping terms (e.g., "whiteman" instead of "mankind"). I need to make sure I understand the mechanism: it's not just swapping pronouns, it's swapping the *power dynamic markers* to show the absurdity of the defense. I will incorporate this "structural flip" rather than just a "find/replace pronoun" approach.

  *(Refining the Procedure Steps)*:
  1. Tally (5 mins)
  2. Verb/Agency Scan (5 mins)
  3. Description/Body Scan (5 mins)
  4. The Flip (5 mins)
  Total 20 mins.

  *(Refining the 1962 constraint)*: The flip isn't "Make 1962 egalitarian." The flip is "If a man faced this barrier, how would I describe his reaction vs. hers?" This tests if the *struggle* is gendered in the prose, not just the setting.

  *(Refining the Narrator constraint)*: The test isn't "Can the narrator think this?" It's "Does the narrative frame this as correct?"

  Okay, ready to write.
answer: |-
  ### Part 1: The Status of the Science (Settled vs. Contested)

  You asked for honesty about what is established and what is still fought over. Here is the baseline for the procedure below.

  **Settled Consensus:**
  *   **Generic Masculine:** Psycholinguistic testing consistently shows that "he" as a generic pronoun and "-man" compounds (chairman, manpower) prime male imagery in readers' minds, even when readers consciously know the term is intended to be inclusive. They are not read as neutral.
  *   **Background Defaults:** Readers unconsciously tally demographic data. If background authority figures default to one gender and background service figures to another, readers infer a world hierarchy, even if the plot argues otherwise.
  *   **Description Asymmetry:** When one gender is described primarily by physical attributes (clothing, body parts) and the other by actions or status, readers perceive the described group as objects and the acting group as agents.

  **Contested/Live Debates:**
  *   **Causal Power:** There is debate over how much changing text *changes* real-world attitudes versus merely *tracking* existing ones. (Does fixing the book fix the reader, or just make the book less annoying to the reader?)
  *   **The "Unreliable Narrator" Defense:** It is contested where the line lies between *portraying* a biased character and *endorsing* that bias. Some argue any uncritical presentation of bias is complicity; others argue fiction must allow ugly minds to speak.
  *   **Base Rates:** There is disagreement on how much fiction should reflect real-world demographic skews (e.g., in 1962, most surgeons *were* men) versus creating a "probability blind" world. The consensus leans toward: if you are writing realism, acknowledge the skew; if you are writing near-future, you have more license to correct it.
  *   **The Hofstadter Satire:** It is agreed that the satire effectively exposes hypocrisy. It is less clear whether it actually persuades defenders of the status quo, or simply preaches to the converted.

  ***

  ### Part 2: The 20-Minute Audit Procedure

  **Preparation:** Print the chapter. You need a pen. Do not do this on a screen.
  **Timebox:** 20 minutes hard stop. If you haven't finished, mark the page and move to the next chapter.

  #### Step 1: The Headcount (3 Minutes)
  Circle every named character and every unnamed role (nurse, guard, technician). Mark them M, F, or ? (unknown/neutral).
  *   **The Tally:** Count the circles in two categories: **Authority/Active** (speaking, deciding, working) and **Background/Passive** (serving, waiting, listening).
  *   **The Test:** Is the ratio of M/F in Authority roughly similar to the ratio of M/F in Background?
  *   **Stop/Fix:** If Authority is >80% one gender and Background is >80% the other, you must add or change at least two roles before moving to Step 2.
  *   **Author Choice:** If the imbalance is diegetic (e.g., a convent, a prison, a 1962 boardroom), note it in the margin as "Intentional World-Building" and proceed.

  #### Step 2: The Verb & Body Scan (5 Minutes)
  Scan the text for verbs associated with your M and F markers.
  *   **The Test:** Underline verbs of **Cognition/Agency** (decided, analyzed, walked, opened) in one color. Underline verbs of **State/Appearance** (stood, seemed, looked, wore) in another.
  *   **The Flip:** Pick one paragraph where a woman is described. Swap the gender markers mentally.
  *   **Stop/Fix:** If a female character is described primarily by body/clothing parts (heels, bun, hands) while a male character in the same scene is described by function (badge, tool, signature), fix the description. Remove the body part; add an action.
  *   **Author Choice:** If the description is explicitly filtered through a narrator who *should* be noticing bodies (e.g., a lover, a tailor), mark "Voice Filter" and proceed.

  #### Step 3: The Credential Check (4 Minutes)
  Find every instance where a character's right to be in the room is established.
  *   **The Test:** Look for explanatory clauses. ("John, the director..." vs. "Sarah, who had worked her way up...")
  *   **The Flip:** If a woman has authority, is there a sentence explaining *how* she got it? If a man has authority, is it assumed?
  *   **Stop/Fix:** If women require a backstory to justify authority and men do not, delete the explanation for the woman or add one for the man. Authority should cost the same amount of text.
  *   **Author Choice:** If the character is new to the role and the learning curve is the point of the scene, keep the explanation.

  #### Step 4: The Hofstadter Flip (5 Minutes)
  This is the core. Take a key scene (1-2 pages). Mentally swap the genders of the *roles*, not just the pronouns. The Embryologist becomes a woman; the Nurse becomes a man. The Minister becomes a man; the Fixer becomes a woman.
  *   **The Test:** Read the swapped version in your head. Does it feel absurd? Does it feel like a parody?
  *   **Stop/Fix:** If the swap makes the scene feel "wrong" because the *behavior* no longer fits the *gender* (e.g., a male nurse being fussed over for his hands feels silly), your original text relied on a stereotype. You must change the behavior, not just the pronoun.
  *   **Author Choice:** If the swap feels wrong because it breaks a specific plot point (e.g., a pregnancy scene), that is a hard constraint. Note it and move on.

  #### Step 5: The 1962 Exception (3 Minutes)
  Apply Step 4 to your historical chapter.
  *   **The Test:** Do not flip the *world*. Flip the *gaze*. If a woman faces sexism, how is it described?
  *   **Stop/Fix:** If the text treats the sexism as "just how things are" without narrative friction (no character notices it, no cost is paid), you are reproducing the bias rather than examining it. Add a beat where the bias is acknowledged or resisted, even internally.
  *   **Author Choice:** If the point of the scene is the crushing weight of the system, you may leave it, but ensure the *emotional cost* is on the page.

  ***

  ### Part 3: Running the Audit on Your Draft

  Here is the procedure applied to the three specific instances you provided.

  #### 1. The Clinic Opening (Embryologist vs. Nurse)
  *   **Step 1 (Headcount):** Embryologist (Active/Authority) = Male default. Nurse (Background/Body) = Female default. **Fail.**
  *   **Step 2 (Verb/Body):** Embryologist "does things." Nurse "has a grey bun and small hands." **Fail.** The nurse is reduced to anatomy; the embryologist is reduced to function.
  *   **Step 4 (The Flip):** Swap them. Female Embryologist, Male Nurse.
      *   *Result:* If you write "The male nurse had a grey bun and small hands," it reads as caricature. This proves the original description was gendered coding, not neutral observation.
  *   **Verdict:** **Stop/Fix.** You cannot keep this. The "small hands" trope is historically coded female (delicate care). The "embryologist doing things" is coded male (scientific mastery).
  *   **Action:** Give the nurse a verb. Give the embryologist a physical description that isn't gendered (tired eyes, stained coat). Or swap the genders and keep the traits, but only if you acknowledge the subversion.

  #### 2. Chapter 9 (The "Fixed" Lab Tech)
  *   **Context:** You changed the tech from Man to Woman but kept the behavior static.
  *   **Step 4 (The Flip):** Flip her back to a Man.
      *   *Result:* You suspect this fails. If the behavior was passive, accommodating, or emotionally supportive, reading it as a Man might make the character seem "weak" or "ineffectual" in a way you didn't intend. If the behavior was fussy or nagging, reading it as a Man might make him seem "controlling."
  *   **Verdict:** **Stop/Fix.** This is "laundering." You moved the stereotype from one column to the other without breaking the stereotype.
  *   **Action:** Identify the *trait* that feels gendered. Is the tech apologetic? Change the tech to be brusque. Is the tech nurturing? Change the tech to be clinical. You must break the link between the *role* and the *personality* to make the gender swap neutral.

  #### 3. Chapter 12 (The Narrator and the Minister's Legs)
  *   **Context:** Burnt-out male fixer describes a female Minister's legs while she denies him. You argue this is Voice/Characterization.
  *   **Step 2 (Verb/Body):** The Minister is acting (refusing). The Narrator is observing (looking at legs).
  *   **Step 4 (The Flip):** Female Narrator, Male Minister. She refuses him. He describes her thighs.
      *   *Result:* This reads as sexual threat or mockery. It undermines her authority.
  *   **Step 5 (Voice Defense):** Here is the **Judgement Call**.
      *   *The Procedure Says:* If the narrative does not signal that this observation is a *flaw* in the narrator, it endorses the gaze.
      *   *The Argument to Keep:* You can keep this *if* the text shows the cost of this view. Does he lose the meeting because he was looking at her legs? Does she catch him looking and penalize him? Does he reflect later that he was being an idiot?
      *   *The Argument to Cut:* If she refuses him, he looks at her legs, and the scene ends with him walking away thinking about nothing else, the text has prioritized his desire over her power.
  *   **Verdict:** **Author Choice, with Condition.** You may keep the line *only if* the narrative frame critiques the narrator for it. If the narrator is unreliable, the *plot* must punish that unreliability. If he succeeds *despite* objectifying her, the book argues objectification works. Decide if that is your argument.

  #### 4. Chapter 21 (1962 Flashback)
  *   **Context:** A woman doing something she "couldn't" do.
  *   **Step 5 (The 1962 Exception):**
      *   *The Test:* Do not make 1962 egalitarian. That is false.
      *   *The Flip:* Imagine a man in 1962 trying to do a "woman's task" (e.g., nursing). Would you describe his internal shame? The social pushback?
      *   *Application:* If your female character faces barriers, describe the *friction*. If a man faced barriers, you would likely describe his anger or strategy. If you describe her barriers as "sadness" or "acceptance," you are gendering the *reaction* to oppression.
  *   **Verdict:** **Pass, with Nuance.** The flip here is not "Make her a man." The flip is "Would I write a man's struggle with this much interiority?" Ensure her struggle is active, not just atmospheric. The procedure produces a note: *Check that her resistance is as articulated as a male protagonist's would be.*

  ***

  ### Part 4: Limitations & The "Rubber Stamp" Warning

  You asked me to be explicit about where this procedure is a judgement call dressed as a rule.

  **1. The "Jolt" is Subjective**
  *   *The Worry:* The discomfort I feel on a flip tells me about me, not the text.
  *   *The Truth:* Correct. The procedure measures the gap between your text and your current internalized norms (and the norms of your likely readers). It does not measure "Objective Truth."
  *   *The Mitigation:* If the "jolt" comes from breaking a stereotype (e.g., a gentle man), that is good. If the "jolt" comes from breaking a biological reality (e.g., a pregnant man in a non-sci-fi context), that is a hard constraint. You must distinguish *cultural* jolts from *logical* jolts.

  **2. Laundering Bias**
  *   *The Worry:* Swapping genders without swapping traits just moves the bias.
  *   *The Truth:* Correct. This is why Step 2 (Verb/Body) is more important than Step 1 (Headcount). A female "bossy bitch" is not progress over a male "decisive leader" if the text treats them differently.
  *   *The Mitigation:* The procedure forces you to check the *verbs*, not just the nouns. If the verb is "nagged" for a woman and "instructed" for a man, the swap exposes the bias.

  **3. Base Rates vs. Fiction**
  *   *The Worry:* Sometimes the asymmetry is real-world base rates.
  *   *The Truth:* In 1962, most consultants *were* men. In a near-future clinic, they do not have to be.
  *   *The Mitigation:* For the 1962 chapter, the procedure allows the imbalance but demands you acknowledge the *cost* of it. For the near-future chapter, the procedure demands you justify why the future replicates the past. "Realism" is a choice, not a mandate.

  **4. Voice and Style**
  *   *The Worry:* Some of this is style and has no correct answer.
  *   *The Truth:* Correct. An unreliable narrator is allowed to be sexist.
  *   *The Mitigation:* The procedure cannot tell you "Don't write a sexist narrator." It can only tell you "If you write a sexist narrator, ensure the text knows he is sexist." The distinction is between *depiction* and *endorsement*. The Flip Test helps you see if the narrative voice is complicit in the narrator's bias.

  **5. What This Cannot Do**
  *   This procedure cannot guarantee your book will not be criticized. Readers bring their own thresholds.
  *   This procedure cannot fix deep structural plot holes (e.g., if the plot relies on a woman being helpless).
  *   This procedure cannot distinguish between "bad writing" and "biased writing" if the result is the same (flat characters).

  **Final Instruction:**
  Run this on your chapters. When the procedure says "Stop/Fix," trust it. When it says "Author Choice," pause. Ask yourself: *Am I choosing this because it serves the story, or because it's the path of least resistance?* If it's the latter, treat it as a Fix.
