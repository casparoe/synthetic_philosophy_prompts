answer: |-
  To function as an operational manual for a sentencing commission rather than a seminar paper, a theory of punishment must satisfy thirteen institutional desiderata. I group these into Legitimacy, Calibration, and Operation.

  ### I. Legitimacy Constraints
  **1. The Absolute Innocence Constraint.**
  *Case:* An official can avert a lethal riot only by framing an uninvolved person.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* A theory permitting this dissolves the distinction between punishment and use. It destroys the law's credibility and treats the citizen as a means. Any theory allowing the intentional punishment of the known innocent is disqualified, regardless of utilitarian payoff.

  **2. The Penalty/Price Distinction.**
  *Case:* Differentiating a criminal fine from a congestion charge or regulatory fee.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* If sanctions are merely prices, criminal procedural protections (proof beyond reasonable doubt, right to counsel) vanish. The theory must identify a qualitative threshold (stigma, moral condemnation, liberty deprivation) that triggers criminal safeguards.

  **3. Complicity Limits.**
  *Case:* Junior clerks or drivers in large-scale corporate or state crimes where architects are unreachable.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* Liability must track causal and moral contribution. Punishing small participants disproportionately to fill a "liability gap" left by untouchable architects violates fairness and turns punishment into scapegoating.

  ### II. Calibration Requirements
  **4. Cardinal Magnitudes.**
  *Case:* Fixing why a term is two years rather than six months or twenty; establishing upper bounds.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* Ordinal ranking (worse crimes get more time) is insufficient for sentencing guidelines. The theory must provide an anchor for absolute severity, not just relative ordering.

  **5. Probability-Severity Trade-off.**
  *Case:* Low clearance rates tempting the state to raise tariffs to maintain expected deterrence.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* A commission cannot inflate sentences to compensate for police failure. The theory must cap severity based on the crime's gravity, not the likelihood of capture.

  **6. Marginal Deterrence.**
  *Case:* Ensuring penalties do not incentivize killing a witness if the penalty for assault is the same as murder.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* A sentencing scheme that removes the incentive to stop at a lesser harm is pragmatically self-defeating and increases social violence.

  **7. Temporal Sensitivity.**
  *Case:* Geriatric release, whole-life tariffs, and the offender at 78 vs. 38.
  *Verdict:* **Preference (Retributivist lean).**
  *Reasoning:* While desert may persist, the *purpose* of punishment often decays. A theory requiring full terms regardless of age is theoretically coherent but institutionally cruel. I classify this as a preference for humane administration over strict metaphysical desert.

  **8. Lived Severity.**
  *Case:* Equalizing burden for elderly, disabled, or isolated prisoners.
  *Verdict:* **Preference.**
  *Reasoning:* While morally attractive, subjective pain is impossible to measure consistently. (See *Incompatibility* below).

  ### III. Operational Reality
  **9. Robustness to Error.**
  *Case:* Known nonzero wrongful-conviction rates.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* A theory must discount permissible severity to account for systemic error. Pure desert views that ignore error costs are institutionally reckless.

  **10. Plea-Bargaining Shadow.**
  *Case:* Justifying the trial penalty and guilty-plea discounts when 95% of cases bypass trial.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* A theory justifying only trial sentences justifies 5% of the system. It must account for the expected sentence produced by the bargaining market.

  **11. Corporate Agency.**
  *Case:* Fines falling on shareholders/employees rather than a feeling entity.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* Modern law punishes firms. The theory must explain how desert or deterrence applies to legal persons without anthropomorphizing them incoherently.

  **12. Lapse and Amnesty.**
  *Case:* Statutes of limitation and truth-and-reconciliation settlements.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* The theory must explain whether time extinguishes desert or merely enforcement. If it cannot accommodate legal finality, it conflicts with the rule of law.

  **13. Administrability.**
  *Case:* Officials of ordinary competence reaching consistent sentences.
  *Verdict:* **Non-negotiable.**
  *Reasoning:* Ought implies can. If a theory requires moral genius to apply, it is not law.

  ***

  ### Critical Analysis

  **1. The Incompatibility: Lived Severity vs. Administrability**
  Requirements 8 (Lived Severity) and 13 (Administrability) cannot be jointly satisfied. To equalize subjective burden, a commission would need to assess individual psychological and physical resilience for every offender. This invites arbitrariness, bias, and massive administrative cost, violating the rule-of-law demand for consistency.
  *Verdict:* **Drop Lived Severity.** We must equalize the *objective* burden (time, restriction) rather than the *subjective* experience. A theory demanding subjective equalization is a moral luxury a state cannot afford without sacrificing equality before the law.

  **2. The Most Exclusionary Requirement: The Innocence Constraint**
  Requirement 1 (Absolute Innocence Constraint) does the most work in excluding candidates. It eliminates pure act-utilitarianism and unconstrained consequentialism immediately. In the riot case, a pure consequentialist must frame the innocent to save lives. A sentencing commission cannot operate on a theory that permits the state to manufacture guilt for social stability. This constraint forces any viable theory to incorporate rights-based side-constraints, effectively ruling out "pure" deterrence models as standalone justifications.

  **3. The Camp Prejudice: Precise Cardinality**
  Requirement 4 (Cardinal Magnitudes) is widely insisted upon, but the demand for *precise* moral matching (e.g., exactly two years is deserved, not twenty-three months) is a **Retributivist prejudice**. Consequentialists accept ranges based on efficacy; abolitionists reject the scale entirely. Retributivists often claim moral access to exact numbers. This is metaphysical hubris.
  *Verdict:* The requirement should be modified to **Anchored Ranges**. A theory need not deliver exact numbers, but it must provide a non-arbitrary upper and lower bound. Insisting on precise cardinal desert is a philosophical fantasy that fails the Administrability test.

  ***

  ### Theoretical Scorecard

  | Theory | Verdict | Rationale |
  | :--- | :--- | :--- |
  | **Pure Retributivism** | **Fail** | Fails *Robustness to Error* and *Plea-Bargaining*. It treats wrongful convictions as tragic but morally irrelevant to the guilty's desert, and cannot justify bargaining away "deserved" punishment for efficiency. |
  | **Pure Consequentialism** | **Fail** | Fails *Innocence Constraint*. It cannot forbid framing the innocent in the riot case if the utility calculus favors it. It also struggles with *Complicity Limits*, punishing small players if it deters architects. |
  | **Mixed (Desert-Capped)** | **Pass** | **Best Fit.** Consequentialism determines the sentence within retributive bounds. Satisfies *Innocence* (rights constraint), *Magnitudes* (anchored ranges), and *Error* (caps reduce error cost). |
  | **Abolition/Restorative** | **Fail** | Fails *Administrability* and *Marginal Deterrence* in a state context. While morally compelling, it lacks a mechanism for coercive sentencing in a jurisdiction with entrenched criminal liability and corporate crime. |

  **Conclusion:** A sentencing commission requires a **Mixed Theory with Anchored Ranges**. It must treat retributive proportionality as a side-constraint (satisfying the Innocence and Magnitude requirements) while using consequentialist reasoning to select specific points within those ranges to satisfy Deterrence, Error Robustness, and Administrability. Any theory that prioritizes metaphysical precision over institutional viability is unfit for law.
