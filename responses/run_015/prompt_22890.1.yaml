  I work as a backend engineer, mostly in Rust with some TypeScript, and I've been dipping into classical Chinese philosophy for fun without any formal training in the field. I recently read Gongsun Long's White Horse dialogue — the School of Names piece in which an advocate defends the thesis that a white horse is not a horse — and I'm stuck on what is actually going on. The famous opening move feels like a cheap word game, but a later argument in the dialogue feels like it is doing real work, and I can't articulate why it strikes me as more persuasive: roughly, the point that if someone asks you to bring a horse, a yellow or black horse will satisfy the request, whereas if they ask for a white horse it will not.

  Could you explain, in terms that will land with a programmer, what that second argument is actually establishing, and why it seems stronger than the first? I want to understand the distinction that appears to be doing the work between two readings of the negation — the reading on which "a white horse is not a horse" means the concept of a white horse is not identical to the concept of a horse, versus the reading on which it means a particular white horse is not a member of the class of horses. My instinct, which I would like you to confirm, correct, or sharpen, is that this maps exactly onto subtyping: that the type WhiteHorse is not the same type as Horse (true), while an instance of WhiteHorse is still a Horse (also true), and that the seeking-a-horse argument is really a claim about which values get accepted by which function signature. And finally, I would like a clear verdict on whether the advocate's argument actually succeeds in establishing the thesis, or whether it only establishes the weaker non-identity claim while the objector is charitably pressing the stronger exclusion claim — that is, whether the two speakers are ultimately just talking past each other about the negation.
