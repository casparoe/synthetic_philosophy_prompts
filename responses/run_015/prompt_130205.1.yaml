prompt: |-
  As a novelist who works primarily in literary fiction, I am accustomed to thinking about truth and deception through the craft vocabulary I use every day: narrative reliability, the implicit contract between narrator and reader, dramatic irony, the strategic withholding of information, plot consistency, and the ethical weight of a story's architecture rather than the propositional content of any single sentence. I would like you to take Kant's absolutist position on lying—specifically his refusal to permit a falsehood even to the murderer at the door who asks whether his intended victim is hiding inside, and the underlying distinction he draws between a formal duty never to lie and any merely material consideration of consequences—and restate it as faithfully as possible within this narrative-ethical framework. Translate his categorical prohibition, the idea that lying corrupts the very source of right itself, and the rejection of consequentialist exceptions into terms that speak of narrative integrity, the obligations of a narrator to her audience, and the structural damage done to a story's moral architecture when deception is introduced as an instrumental device.

  Then, having done that translation, I want a residue report. Tell me precisely which elements of Kant's argument map cleanly onto narrative ethics—perhaps something about the unconditional nature of a narrator's covenant with the reader—where I must distort or stretch the literary vocabulary to accommodate his reasoning, and which central claims have no counterpart whatsoever in how fiction manages deception and audience trust. In particular, I am interested in whether the categorical nature of his prohibition survives: is there anything in the craft of fiction that corresponds to a duty so rigid it cannot be overridden even to save an innocent life within the plot, or does the novelist's toolkit necessarily treat deception as context-sensitive and strategically negotiable? Finally, interpret the residue for me: does what fails to translate indicate that Kant's framework possesses a rigor that narrative ethics lacks, or does it suggest that his absolutism depends on assumptions about language and moral agency that fiction reveals to be less universal than they appear?
