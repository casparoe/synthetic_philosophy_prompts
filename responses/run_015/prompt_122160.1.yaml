answer: |-
  This is a classic instance of the "mention problem" for expressive content. Your intuition that (1) and (2) are solid is shared by most contemporary semanticists (e.g., Potts, Lepore); the projection data is robust, and treating slurs as carrying conventional implicature or expressive content is the standard way to capture it. The breakdown occurs when you move from lexical storage to lexical activation.

  Here is the pricing on your four exits:

  (i) **Keep (1)–(3) and swallow (6).**
  *Cost:* This makes the philosophy of language ethically hazardous. If mentioning a slur in a dictionary, a court transcript, or this very seminar generates the same offensive content as shouting it on the bus, then theoretical inquiry into slurs becomes impossible without perpetuating the harm. It collapses the use/mention distinction, which is foundational to linguistics.

  (ii) **Drop (3) and let conventional content be indexed to context.**
  *Cost:* This radical contextualism saves the dictionary but destabilizes semantics. If conventional content shifts this wildly based on speaker/audience, it becomes indistinguishable from conversational implicature, undermining your commitment to (2). You lose the explanation for why the word feels "loaded" even in isolated contexts.

  (iii) **Drop (2) and go for a norm/prohibition view (the "Skunk" view).**
  *Cost:* This aligns with your tutor (perlocutionary effect) and saves the dictionary (no norm violation in analysis). However, it struggles to explain the projection data in (1). Perlocutionary effects (like frightening someone) typically do not project through conditionals or negation in the systematic way slurs do. You gain ethical safety but lose semantic precision.

  (iv) **Bite the bullet on (7) and treat reclamation as homonymy.**
