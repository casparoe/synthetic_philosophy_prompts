answer: |-
  **MEMORANDUM**

  **TO:** Mental-Health Research Oversight Board
  **FROM:** [Your Name/Chair, Ethics Subcommittee]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Protocol #24-ADS (Algorithmic Dissociation Screening)

  ### **BOTTOM LINE DECISION**
  **Motion:** **Approve Pending Major Modifications.**
  **Specific Mandate:** The study may proceed *only* if the screening protocol is decoupled from the diagnostic label. Participants may be assessed for behavioral correlates (attention fragmentation, identity blurring), but they must **not** be screened for, diagnosed with, or informed of "Algorithmic Dissociation Syndrome" (ADS) as a clinical or pre-clinical category.

  **Vote Recommendation:** I recommend we vote to **withhold approval** for the current protocol and offer **conditional approval** contingent on the removal of the "Syndrome" framing from all participant interactions and consent forms.

  ---

  ### **EPISTEMIC CONFIDENCE STATEMENT**
  We must be transparent about the scientific ground beneath this decision.
  *   **On ADS Existence:** Our confidence is **low.** There is no validated literature establishing "Algorithmic Dissociation Syndrome" as a distinct psychopathology. It is currently a theoretical construct, not an empirical reality.
  *   **On Looping Effects:** Our confidence is **moderate-to-high regarding risk, low regarding certainty.** Ian Hacking's "looping effects" are well-documented in historical cases (e.g., multiple personality disorder, autism spectrum classifications). However, we cannot predict with precision whether *this* specific label will trigger a loop. We are making a precautionary judgment based on theoretical plausibility, not empirical data. We are acting on the possibility of harm, not the certainty of it.

  ---

  ### **RATIONALE FOR DECISION**
  The deadlock on this board stems from a conflict between **epistemic urgency** (we need to know if this is real) and **iatrogenic risk** (the test might make it real).

  By mandating the removal of the diagnostic label, we prioritize the **Precautionary Principle.** If the Anti-Study side is correct—that the screen *is* the vector of the disease—then deploying the screen as proposed constitutes uncontrolled human experimentation. We cannot ethically authorize a study where the measurement tool is also the suspected pathogen.

  However, a flat Rejection stifles necessary inquiry into digital mental health harms. By allowing the measurement of *behaviors* without the assignment of a *syndrome*, we gather the data the Pro-Study side needs without triggering the identity-formation mechanism the Anti-Study side fears. We can observe if attention fragmentation correlates with algorithmic usage without telling participants they have a "syndrome" that defines their identity.

  ---

  ### **THE OVERRULED ARGUMENT (Steel-Man)**
  **Position:** The Pro-Study faction (who argue we must deploy the full screen to catch the loop).

  **Best Argument:** *"Silence is Complicity."*
  If we refuse to name and screen for ADS, we leave the field open for commercial actors to define it. Tech companies are already optimizing for attention fragmentation; if academia refuses to classify the resulting harm because of philosophical caution, we cede the definition of human digital suffering to profit-driven entities. They will create the looping effect anyway, but without ethical oversight, consent, or support structures. By studying ADS openly, we validate the suffering of those experiencing it and create a framework for treatment before the condition calcifies in the wild. Waiting for "perfect safety" guarantees we will be too late to help the first generation of victims.

  **Why We Are Overruling It:**
  While the moral impulse to validate suffering is correct, the method proposed conflates *validation* with *labeling*. We can validate the *symptoms* (distress, fragmentation) without validating the *syndrome* (a fixed identity). The risk of manufacturing a new psychiatric identity in a vulnerable population outweighs the benefit of early categorization, especially when that categorization may become a self-fulfilling prophecy. We can study the harm without handing the participant the blueprint for their own fragmentation.

  ---

  ### **MANDATED SAFEGUARDS FOR RESUBMISSION**
  To move forward, the Principal Investigator must amend the protocol to include:

  1.  **Descriptive, Not Diagnostic Language:** Consent forms and debriefings must refer to "attentional patterns" or "digital engagement styles," not "Algorithmic Dissociation Syndrome."
  2.  **No Individual Feedback:** Participants cannot receive a "score" indicating they have ADS. Data must be aggregated for research purposes only.
  3.  **Longitudinal Monitoring:** The PI must add a 6-month follow-up to assess whether participation itself altered the participants' self-conception or digital behaviors (a direct test of the looping hypothesis).
  4.  **Data Firewalls:** Screening data cannot be shared with third parties or tech partners to prevent commercial exploitation of the classification.

  **Summary:** We are voting to study the *phenomenon* without creating the *category.* This breaks the deadlock by accepting the risk of the research while mitigating the risk of the label.

  **[Signature]**
  **Chair, Ethics Subcommittee**
