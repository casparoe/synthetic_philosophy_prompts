answer: |-
  Here is the machinery you need to untangle the knot. The confusion arises because you are trying to make the Knowledge Norm of Assertion (KNA) do three different jobs at once: (1) defining the act type, (2) governing the epistemic warrant, and (3) regulating conversational utility.

  To place your five cases correctly, you need to distinguish three layers of normative structure. Once you separate these, the asymmetry between speaker-side and hearer-side constraints dissolves, and the "constitutive" paradox resolves.

  ### 1. The Three Layers of Normativity

  You need to distinguish between **Sincerity**, **Warrant**, and **Propriety**.

  *   **The Sincerity Norm (Psychological):** You must believe what you assert. This is distinct from knowledge. You can believe without knowing (Gettier cases), and you can know without believing (self-doubt cases, though rare).
  *   **The Epistemic Norm (KNA):** You must know what you assert. This governs your *right* to represent the proposition as true.
  *   **The Pragmatic Norm (Cooperation):** You must assert only when it is relevant, helpful, and non-misleading to the hearer. These are Gricean-style norms governing the *point* of the exchange.

  **Mapping Case B (The Liar):**
  You asked if requiring belief is a fudge. It is not a fudge, but it is a *separate* norm. KNA ($K \to$ Assertion) logically entails a belief requirement only if knowledge entails belief ($K \to B$). Most epistemologists accept $K \to B$. So, if you violate belief, you violate knowledge, and thus violate KNA.
  *However*, the specific defect in B is **insincerity**, not just lack of knowledge. B *has* knowledge, but lacks belief. Therefore, B satisfies the Epistemic Norm (strictly speaking, B is in a position of knowledge) but violates the Sincerity Norm.
  *   **Verdict:** B is a defective assertion because it violates Sincerity. It is not a counterexample to KNA; it is a counterexample to the idea that KNA is the *only* norm. B's utterance is an assertion (it has the form of a truth-claim), but it is a corrupt one.

  ### 2. The Hearer Asymmetry (Cases C, D, E)

  Your central tension is: *How can the core norm be speaker-relative if the act is essentially communicative?*

  The solution is to distinguish between the **Entry Condition** and the **Conversational Goal**.

  *   **Entry Condition (KNA):** This is speaker-relative. It asks: "Are you in a position to put this into the common ground?" It is about your authority to speak.
  *   **Conversational Goal (Gricean):** This is hearer-relative. It asks: "Does putting this into the common ground improve the state of information?"

  **Mapping Case E (The Guesser):**
  E violates the Entry Condition. E does not know. The fact that $p$ is true and no harm is done is irrelevant to the *normative status* of the act, though relevant to *blameworthiness*.
  *   **Verdict:** This is the purest KNA violation. It is an assertion, but it is *epistemically unauthorized*. It is like casting a vote when you aren't a citizen. The vote counts (socially), but you weren't allowed to cast it.

  **Mapping Case C (The Timezone Trap) & D (The Redundancy):**
  C and D satisfy the Entry Condition (they know $p$). They satisfy the Sincerity Norm (they believe $p$). So, qua *assertions*, they are flawless.
  Their defect lies in the **Conversational Goal**.
  *   **C** violates a norm of **Non-Misleadingness**. You have the right to assert, but you are using that right to allow a misunderstanding to persist. This is a moral or cooperative failure, not an assertoric one.
  *   **D** violates a norm of **Relevance/Informational Value**. You have the right to assert, but you are wasting conversational resources.
  *   **Verdict:** C and D are *perfect assertions* that are *bad moves in the conversation*. KNA is silent on C and D because KNA governs the *act*, not the *strategy*.

  **The "Brick Wall" Objection:**
  You asked: *If the norm ignores the hearer, is asserting to a wall assertion?*
  Yes. Assertion is a commitment undertaken by the speaker. You can undertake a commitment even if no one is there to receive it (e.g., a diary entry, a logbook). The *point* of assertion is usually communication, but the *structure* of assertion is the undertaking of a truth-commitment.
  *   **Resolution:** The hearer-relative norms (C and D) govern whether the assertion *succeeds as communication*. The speaker-relative norm (KNA) governs whether the assertion *succeeds as a commitment*. You can make a valid commitment to a wall (satisfying KNA), but you fail to communicate (violating Pragmatic Norms).

  ### 3. The Constitutive Paradox (Violation vs. Existence)

  This is the hardest conceptual knot: *If KNA is constitutive, shouldn't violating it mean you didn't assert?*

  You are holding a too-rigid view of "constitutive." In social practices, constitutive norms function as **Standards of Correctness**, not **Conditions of Existence**.

  Consider the game of Chess.
  *   **Rule:** Bishops move diagonally.
  *   **Violation:** I move my bishop straight forward.
  *   **Status:** Is this a "chess move"? In a casual game, we say, "Take it back, that's illegal." In a tournament, the move is voided. But in the philosophy of language, we don't have a referee to void the utterance. The utterance stands.

  The "Strong Version" of KNA should be understood this way: **To assert is to represent oneself as knowing.**
  *   If you know, your representation is accurate.
  *   If you don't know (Case E), your representation is false.
  *   Does the act exist? Yes. You have represented yourself as knowing.
  *   Is it defective? Yes. You have misrepresented your epistemic position.

  **Comparing Promise:**
  *   **Insincere Promise:** "I promise to come." (I have no intention).
      *   This is still a promise. I have undertaken the obligation. I am just liable to break it immediately. It is a *rotten promise*.
  *   **Actor's Promise:** On stage, "I promise to come."
      *   This is *not* a promise. The constitutive context (theater) suspends the normative force.

  **Mapping the Violation:**
  *   **Case B (Liar):** Like the Insincere Promise. It is a rotten assertion. The act exists, but the internal condition (belief) is faked.
  *   **Case E (Guesser):** Like the Insincere Promise regarding *knowledge*. You represent yourself as knowing, but you aren't. It is an epistemically rotten assertion.
  *   **Actor/Brick Wall:** If you speak to a wall knowing no one hears, you aren't undertaking a communicative commitment in the same way. But if you write in a diary, you *are* asserting to your future self. The norm holds.

  ### Summary of the Machinery

  To place your five cases, apply this filter:

  1.  **Is it an Assertion?** (Does it undertake a truth-commitment?)
      *   **Yes:** A, B, C, D, E.
      *   **No:** Actor on stage, parrot, involuntary utterance.
      *   *Note:* Violating KNA does not make it "No." It makes it a "Bad Yes."

  2.  **Does it satisfy the Epistemic Norm (KNA)?** (Does the speaker know $p$?)
      *   **Yes:** A, B, C, D.
      *   **No:** E.
      *   *Note:* This distinguishes the "authorized" assertions from the "unauthorized" ones.

  3.  **Does it satisfy the Sincerity Norm?** (Does the speaker believe $p$?)
      *   **Yes:** A, C, D, E.
      *   **No:** B.
      *   *Note:* This distinguishes lying from guessing.

  4.  **Does it satisfy the Pragmatic Norms?** (Is it helpful/relevant/non-misleading to *this* hearer?)
      *   **Yes:** A, E (luckily).
      *   **No:** B (deceptive), C (misleading), D (useless).

  ### The Untangled Conclusion

  *   **A** is the only case that clears all three hurdles.
  *   **B** clears Epistemic (knows) but fails Sincerity (lies) and Pragmatic (deceives).
  *   **C** clears Epistemic and Sincerity but fails Pragmatic (allows misunderstanding).
  *   **D** clears Epistemic and Sincerity but fails Pragmatic (redundant).
  *   **E** clears Sincerity (believes the rumor) but fails Epistemic (doesn't know).

  **The Asymmetry Resolved:**
  KNA is the **constitutive norm of the act type**. It defines what it is to play the game of assertion (representing oneself as knowing).
  The hearer-relative constraints (C, D) are **regulative norms of the conversation**. They define how to play the game *well* or *cooperatively*.

  The reason KNA ignores the hearer is that it governs the **speaker's authority**, not the **conversation's efficiency**. You can have the authority to speak (KNA satisfied) and still say something useless (C/D) or lie (B). But you cannot assert without undertaking the commitment to know (E violates this).

  **Final Answer to your "Constitutive" Worry:**
  Violating a constitutive norm in language results in a **defective instance of the kind**, not a **non-instance**.
  *   If I move a bishop straight, I am playing bad chess (or cheating), but I am still engaged in the activity of moving pieces on a board with the intent of playing chess.
  *   If I assert without knowledge, I am making a bad assertion, but I am still asserting.
  *   The "Strong Version" of KNA claims that the *criticism* "You didn't know that!" is a specific criticism of the *assertion itself*, not just a moral aside. It identifies the specific way in which the assertion is broken.

  So, B's utterance is a defective assertion (violates sincerity). E's utterance is a defective assertion (violates warrant). C and D are non-defective assertions that are conversationally infelicitous. The knot is untangled by refusing to let KNA bear the weight of conversational cooperation.
