answer: |-
  1. **The Question**

  **Jurisprudence: The Hart–Fuller Debate**

  **Time Allowed: 45 Minutes**
  **Total Marks: 20**

  In the Republic of Verraine there is no standing legislature. Every five years five hundred citizens are chosen by lot from the electoral register; they sit for ninety days, deliberate in private, and produce a complete criminal code, after which they disperse permanently. The code is the sole source of criminal prohibition for the next five years. No body whatsoever — not the courts, not the ministries, not the selectors themselves — has power to amend, repeal or dispense from it during that period. It is promulgated in full six months before it takes effect. Independent reviewers confirm that it is general in form, intelligible to a person of ordinary education, internally consistent and entirely possible to comply with; the courts apply the enacted text exactly, and there is no measurable gap between the rules as declared and the rules as administered. The selectors are subject to the code for the five years and are prosecuted under it like anyone else. No reasons for any provision are published, nobody is answerable for the code's content after the selectors disperse, and there is no institution whose continuing job is to keep the law in touch with social practice. The current code contains the ordinary prohibitions on violence, theft and breach of contract, enforced impartially between private citizens, and it also makes it an offence to practise, without a licence granted by a state church, any religion other than that church's.

  **Question:**
  Does the Verraine code expose a fatal flaw in Fuller's theory of law? Critically assess whether Fuller should classify Verraine as a legal system, given that his eight principles of legality are satisfied but the lawgiver's undertaking is transient. In your answer, distinguish the structural defect of the Verraine system from the substantive injustice of the religious clause, and argue whether the Hart–Fuller disagreement is ultimately about criteria of validity or the conceptual nature of a legal system.

  ***

  **Footnote:**
  *For the purposes of this question, assume Fuller's eight principles of legality are: (1) generality; (2) promulgation; (3) non-retroactivity; (4) clarity; (5) non-contradiction; (6) possibility of compliance; (7) constancy through time; (8) congruence between declared rule and official action. No credit will be awarded for merely listing or defining these principles.*

  ***

  2. **Model Answer**

  The Verraine case is designed to fracture Fuller's theory by separating his checklist of principles from his underlying conception of law as a reciprocal enterprise. While Hart would straightforwardly classify Verraine as a legal system, Fuller faces a dilemma: if he accepts Verraine as law because the eight principles are met, he reduces his theory to a formal checklist indistinguishable from positivism; if he rejects it, he must admit that the principles are merely symptoms of a deeper requirement—ongoing reciprocity—which Verraine violates. Fuller should reject Verraine as a full legal system, not because the checklist is incomplete, but because the dispersal of the legislature destroys the relationship of fidelity necessary for the 'inner morality of law'. This reveals that the Hart–Fuller debate is not merely about validity criteria, but about the conceptual nature of law itself.

  Hart's position is clear. For Hart, law is a union of primary and secondary rules. Verraine possesses primary rules of obligation and a rule of recognition (the code produced by the selectors). The fact that the legislature disperses creates rigidity, not invalidity. The system is effective, the rules are identified by source, and the courts apply them consistently. Hart separates law from morals; therefore, the substantive injustice of the religious clause makes the law wicked, but not non-law. The structural rigidity—the inability to amend for five years—is a practical defect, perhaps leading to obsolescence, but it does not negate the system's legal character. Hart would argue that so long as the rules guide conduct effectively, the absence of an ongoing lawgiver is irrelevant to validity.

  Fuller, however, argues that law is a purposive enterprise subjecting human conduct to the governance of rules. This requires a specific relationship between lawgiver and subject. The eight principles are not a mechanical checklist but safeguards for this relationship. In Verraine, principle (7), constancy through time, is technically met regarding the text, but the *spirit* of constancy is violated by the dispersal. Because the selectors disappear, there is no one to hold accountable for the law's interaction with social practice. There is no possibility of recourse, no dialogue, and no ongoing undertaking to maintain the conditions of fidelity. The law becomes a one-off command rather than a continuing framework for interaction. Consequently, Fuller should argue that Verraine lacks the 'inner morality' not because the rules are unclear, but because the *enterprise* has been abandoned after promulgation. The checklist is satisfied, but the morality of the relationship is not.

  It is crucial to distinguish this structural defect from the substantive injustice of the religious clause. The religious prohibition is a substantive moral failure; it violates external morality. Hart and Fuller might agree it is unjust, but Hart insists this does not affect its legal status. Fuller argues that such injustice undermines the purpose of law, but that is a separate complaint from the structural one. The structural defect—the dispersal—is distinct because it undermines the *procedure* of lawmaking itself, specifically the requirement that the lawgiver remain responsible to the subject. A lawgiver who cannot be questioned and who vanishes treats subjects as objects of management rather than agents capable of following rules. This is a procedural failure within Fuller's own terms, distinct from the substantive evil of religious persecution. One concerns the capacity of the system to function as law; the other concerns the moral worth of the rules produced.

  The strongest reply available to Hart is that Fuller is conflating 'good law' with 'law'. Hart would argue that rigidity is common in legal systems (e.g., entrenched constitutions) and does not dissolve the legal character. If Verraine's courts apply the rules consistently, citizens know where they stand. However, this reply misses Fuller's point about reciprocity. Entrenched constitutions usually have interpreters or amendment procedures; Verraine has none. It is a dead letter waiting to happen.

  Ultimately, the Verraine case shows that Hart and Fuller are disagreeing about the concept of law, not just validity. Hart asks: 'Is this a valid rule according to the system's sources?' Fuller asks: 'Is this a functioning undertaking between authority and subject?' If Fuller accepts Verraine, his theory collapses into formalism. If he rejects it, he confirms that his eight principles are subordinate to the broader requirement of a sustained legal relationship. Therefore, the debate is not about where to draw the line on validity, but about whether law is essentially a static set of orders or a dynamic moral enterprise. Fuller must deny Verraine the title of a legal system to maintain the integrity of his theory, conceding that the checklist is insufficient without the ongoing undertaking.

  (84 words over 800 word limit estimate - actually approx 840 words)

  ***

  3. **Marking Scheme**

  **Total: 20 Marks**

  | Move | Marks | Common Error |
  | :--- | :--- | :--- |
  | **1. Identification of the Fullerian Tension:** Explicitly identifies that Verraine satisfies the 8 principles but challenges the 'enterprise' or 'reciprocity' aspect of Fuller's theory. | 4 | Candidates often assume that because the 8 principles are met, Fuller must accept it as law, missing the deeper theoretical conflict. |
  | **2. Hart's Positivist Assessment:** Correctly articulates Hart's likely view (validity based on source/efficacy; rigidity is not invalidity; separation of law and morals). | 4 | Candidates frequently attribute moral disapproval to Hart or claim Hart would reject Verraine due to the religious clause. |
  | **3. Structural vs. Substantive Distinction:** Clearly distinguishes the structural defect (dispersal/no accountability) from the substantive defect (religious persecution), arguing they are separate complaints. | 4 | Candidates often conflate the religious injustice with the procedural failure, treating both as 'immorality' without distinguishing source. |
  | **4. Verdict on the Debate:** Commits to a view on whether the Hart–Fuller debate is about validity criteria or the conceptual nature of a legal system (must argue one way). | 4 | Candidates typically refuse to choose, offering a 'balanced survey' that concludes both have points without resolving the theoretical crux. |
  | **5. Engagement with Counter-Argument:** Addresses a strong reply (e.g., Hart's stability objection or Fuller's potential concession) and rebuts it. | 4 | Candidates often present arguments in a vacuum, failing to anticipate how the opposing theorist would respond to the Verraine specifics. |

  ***

  4. **Guidance for Markers**

  **First-Class vs. Upper Second**
  A **First-Class** answer will integrate the five moves into a coherent narrative. It will take a risk by committing to a verdict (e.g., 'Fuller must reject Verraine') and use the Verraine facts to prove *why* the Hart–Fuller debate is conceptual rather than merely criterial. The distinction between structural and substantive defects will be sharp and used to protect Fuller from the charge of smuggling substantive morals into procedure.
  An **Upper Second (2:1)** answer will hit all five moves but treat them as separate boxes to tick. It will likely describe the positions accurately but hesitate to judge which theorist is right about the nature of law. The distinction between structural and substantive defects may be present but less rigorously defended.

  **Zero-Credit Moves**
  Do not award marks for the following, regardless of writing quality:
  *   Reciting or defining Fuller's eight principles (the footnote explicitly negates this).
  *   Summarising the *Grudge Informer* case or Nazi law examples instead of analysing Verraine.
  *   Defining the 'Separation Thesis' without applying it to the dispersal of the Verraine legislature.
  *   Claiming Hart believes unjust laws are not valid laws.
  *   Treating the religious clause as the primary jurisprudential problem (it is a moral problem, not the structural legal crux).
