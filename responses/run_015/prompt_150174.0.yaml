      *   Start with recommendation.
      *   Explain the math problem simply (infinite credits/debits).
      *   Address the "partial sums" argument (it's real, but fragile).
      *   Propose the rule.
      *   Closing section.
      *   Check tone: Professional, decisive, respectful of the complexity.

  7.  **Drafting - Iteration 2 (Writing & Editing):**
      *   *Word Count Check:* Need to monitor closely.
      *   *Math Check:* Ensure I don't misrepresent the Pasadena game. The key is that $\infty - \infty$ is undefined.
      *   *User's Hack:* "Rank by truncated expectation across a fixed range of horizons and require the ranking to be stable." In the Pasadena game, the partial sums oscillate ($1, 0.5, 0.83, 0.58...$). They are *not* stable. So this rule correctly flags B as problematic. I should validate this in the memo.
      *   *Steelman:* Make sure I don't dismiss B's probability ordering as "arbitrary." It's the standard canonical ordering. The problem isn't the ordering, it's the divergence.

  8.  **Final Polish:**
      *   Check constraints: No citations. 700-900 words. Specific headings.
      *   Ensure the "What Would Change Our Mind" is specific.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm just agreeing with the skeptic. The user said "If the memo's answer is just 'the expectation doesn't exist, so ignore the project,' I already get that from the resident skeptic." I need to add value beyond that. The value add is the *procedure* for handling it and acknowledging why B's argument is tempting (partial sums). I need to frame the decision as "risk management regarding model stability" rather than "math police."

      *Revised Plan:*
      1.  Recommendation: Fund A, Pause B.
      2.  Explanation: The "Infinite Ledger" problem.
      3.  Steelman: The "Partial Sum" argument (B looks better at every step).
      4.  Rebuttal: Stability vs. Fragility.
      5.  Standing Rule: The "Two-Column Test."
      6.  Change Mind: Capping the tail.

      *Word Count Strategy:* Keep intro/outro tight. Spend words on the explanation and the rule.

