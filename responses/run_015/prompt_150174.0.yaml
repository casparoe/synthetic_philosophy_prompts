      To: Allocations Committee
      From: [My Name]
      Date: [Current Date]
      Subject: Decision Framework for Finalists A and B

      **Recommendation**
      Fund Project A immediately. Place Project B on hold pending model revision. We should not allocate capital to B under the current proposal because its expected value (EV) is mathematically undefined, not merely uncertain. While B's model produces a headline number higher than A's, that number relies on an accounting convention rather than a stable property of the project.

      **The Core Issue: Infinite Ledgers**
      Project A offers a stable return. Project B's model describes a scenario where both the total possible upside and the total possible downside are infinite. Imagine a ledger where the credit column sums to infinity and the debit column also sums to infinity. The "balance" depends entirely on the order in which you process the transactions.

      B's team orders transactions by likelihood (most probable first). This yields a positive balance (0.69). However, because the infinite totals are unstable, rearranging the bins changes the result. As our quant noted, grouping bins differently shifts the value from 0.35 to 1.04 or higher. When a project's value swings from below A to above A based solely on how we group the same data, the EV is not a measure of value; it is a measure of model sensitivity.

      **The Strongest Case for B**
      We must acknowledge B's strongest argument: the "Partial Sum" defense. In standard decision theory, we evaluate risks by looking at cumulative probability. If you stop B's series at any finite step—10 steps, 100 steps, or 1,000—the cumulative value consistently exceeds A's 0.24. The lowest dip in the running total is 0.5, still double A's value.

      Rejecting B on this basis looks like an aversion to high-variance outcomes. It appears we are penalizing B simply because their impact distribution has a "fat tail"—where the biggest wins (and losses) live. If we demand convergence too strictly, we systematically bias the fund against ambitious, scalable advocacy in favor of boring, capped interventions. B's ordering by descending probability is not arbitrary; it is the standard convention for calculating expectation. To reject it requires more than saying "the math breaks."

      **Why We Still Pass**
      The issue is not the fat tail; it is the lack of anchors. A defined expectation requires that the upside and downside separately sum to finite numbers. In B's model, the "counter-mobilization" risk scales perfectly with the win, creating a cancellation effect that only works if you stop counting at the right moment. If the real world realizes these outcomes in a different order than the model assumes—which is likely in advocacy work—the projected value evaporates. We cannot treat a model artifact as a robust asset.

      **Standing Rule for Future Cycles**
      To prevent this deadlock next cycle, we adopt the "Two-Column Test" for all EV claims:
      1.  **Separate Reporting:** Applicants must submit the sum of probability-weighted upside and the sum of probability-weighted downside separately.
      2.  **Convergence Requirement:** If both sums diverge (approach infinity), the EV is undefined. The application is ineligible unless the applicant imposes empirical caps.
      3.  **Stability Check:** If sums are finite but large, reviewers will calculate truncated expectations across fixed horizons (e.g., top 10, top 50, top 100 outcomes). If the ranking relative to other grants flips across these horizons, the proposal is flagged as unstable.

      This rule collapses if an applicant can demonstrate that the "ordering" of outcomes is physically constrained (e.g., outcomes must occur sequentially over time). In that case, truncated expectation may be valid as a time-discounted metric rather than a total value metric.

      **What Would Change Our Mind**
      We would fund B if they can provide empirical bounds on the "n" variable. Specifically, if they can demonstrate a maximum plausible scale for the counter-mobilization (capping the downside) or a maximum visibility ceiling (capping the upside), the series becomes defined. We need evidence that the tail ends, not just that it alternates.

      The reasoning in this memo is most vulnerable on the "Stability Check." If advocacy outcomes are inherently path-dependent—meaning early wins physically prevent later losses—then the ordering by probability might correlate with temporal realization. If B can prove that high-probability outcomes *must* realize before low-probability ones in real time, the partial sum argument becomes a valid proxy for real-world value over a finite horizon. We are assuming the bins are interchangeable; if they are sequential, the math changes.

      **Next Steps**
      Vote on A today. Invite B to resubmit with capped tails or empirical bounds on the outcome space for the next cycle.

