  **Verdict on Case 7 (Mitochondrial Replacement Therapy)**
  **Not Her.**

  **Two General Principles**
  To accommodate verdicts one through six, we can posit two principles of biological identity. Both respect the intuition that origins matter (Verdicts 1, 2, 4, 5) and that mere developmental environment does not (Verdicts 3, 6). However, they differ on what constitutes the essential "origin."

  1.  **The Nuclear-Genetic Union Principle:** Personal identity is fixed by the specific union of the parents' *nuclear* genomes via fertilization. The cytoplasmic constituents of the gametes and the gestational environment are accidental properties, provided the fertilization event involves the specific haploid nuclear contributions from the specific parents.
      *   *Prediction for Case 7:* **Is Her.** (The nuclear genome is derived from the specific mother and father via fertilization; the mitochondrial source is irrelevant cytoplasmic detail).

  2.  **The Holistic Gametic Origin Principle:** Personal identity is fixed by the specific physical *gametes* (the biological cells themselves) that unite at fertilization. The egg and sperm are not merely vessels for nuclear DNA but are constitutive biological substances; replacing the bulk of the egg's material (cytoplasm and mitochondria) constitutes using a "different egg," even if the nucleus is preserved.
      *   *Prediction for Case 7:* **Not Her.** (The egg used is a reconstructed hybrid containing donor cytoplasm, making it materially distinct from the mother's actual egg).

  **Best Guess at the Metaphysician's Actual Principle**
  She actually employs the **Holistic Gametic Origin Principle**.

  **Reasoning:**
  While the Nuclear-Genetic Union Principle explains most verdicts, it struggles to fully justify Verdict 5 (the clone case) without additional caveats. If identity were primarily about the nuclear genome, a genetic clone would be a borderline case or potentially the same person; her flat rejection ("not be her") signals that the *history of the cell* matters as much as the code. This aligns with Verdict 2 ("if the egg had been a different egg... not be her"). In Mitochondrial Replacement Therapy, although the mother's nucleus is used, the physical egg cell is largely donor material (cytoplasm and mitochondria). To a Holistic Gametic Essentialist, this is functionally identical to Verdict 2: it is a "different egg" from the mother, just as a different ovulation would be. The metaphysician treats the gamete as an indivisible biological unit of origin, not a modular container for DNA.

  **Closest Analog:**
  **Verdict 2** (Different egg from the same mother). Both cases involve a scenario where the mother's nuclear contribution is preserved (in V2, implicitly from the same mother; in V7, explicitly via transfer), but the biological *substance* of the egg is altered or replaced. Her ruling in V2 establishes that "egg identity" is not reducible to "mother's genetic contribution."

  **Decisive Test Case (Case 8)**
  **Counterfactual:** *In Vitro Gametogenesis (IVG).* The parents produce gametes (sperm and egg) derived from their own somatic cells (e.g., skin cells) in a laboratory. These lab-grown gametes carry the exact nuclear DNA the parents would have contributed naturally. These gametes are then fertilized to produce the child.

  **Why it is a Decisive Test:**
  *   **The Nuclear-Genetic Union Principle** predicts **Is Her**. The specific nuclear genomes of the parents have united via fertilization. The fact that the gametes were synthesized rather than ovulated/spermatogenized is a detail of production, not a change in the genetic origin.
  *   **The Holistic Gametic Origin Principle** predicts **Not Her**. The gametes used were not the specific biological cells produced by the parents' gonads. Just as a clone (V5) fails because it bypasses gametic union, and a different egg (V2) fails because it is a different cell, synthetic gametes fail because they lack the correct biological *history* as gametes, even if they carry the correct DNA.

  This case isolates the variable of **gametic biological history** from **nuclear genetic content** without involving third-party donors (as in MRT) or cloning the offspring (as in V5), forcing a choice between DNA as the essence of identity versus the specific biological cells as the essence of identity.
