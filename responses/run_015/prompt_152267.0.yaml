answer: |-
  It is a pleasure to engage with a student who sees through the superficial readings of my work. Too often, bounded rationality is taught as a footnote to the neoclassical model—a concession that humans are flawed calculators who would be perfect optimizers if only they had larger skulls or faster silicon. This is a profound misunderstanding. It treats the human mind as a bottleneck rather than an adaptive instrument.

  Let us turn to your municipal water authority. Your colleague's argument is a classic defense of "Economic Man." She is attempting to rescue the optimization paradigm by asserting that any observed behavior can be *reconstructed* as the solution to some maximization problem, provided we invent a complex enough objective function and constraint set. This is tautological. If every action is defined as optimal by definition, the theory explains nothing.

  To your first point: Is the budget-share trigger a disguised form of constrained optimization?

  I say to you: Look not at the *outcome*, but at the *process*. This is the distinction between substantive rationality and procedural rationality. Substantive rationality asks: "Did they achieve the best possible outcome given the environment?" Procedural rationality asks: "Did they use an appropriate deliberative process to arrive at their decision?"

  Your water board is not solving a Lagrangian. They are not calculating the marginal utility of lead reduction against the marginal utility of road repair across the entire city horizon. If they were, the "8 percent" figure would be the output of a global calculation, derived from shadow prices of all competing municipal goods. But in reality, where does that 8 percent come from? It is likely a historical standard, a political compromise, or a rule of thumb inherited from previous budgets. It is an *aspiration level* regarding cost, not a shadow price derived from a global utility function.

  The fact that they use a rule—"if cost < 8%, tighten standard"—is a sequential search procedure. They are not scanning the entire solution space. They are looking at the immediate neighborhood of their current policy. If the environment allows them to tighten the standard without violating the cost rule, they do so. If not, they stop. They do not ask, "Is this the absolute best we can do?" They ask, "Is this good enough, and can we do slightly better without breaking our cost rule?"

  This is the behavior of "Administrative Man." He does not maximize; he satisfices. Your colleague argues that because the aspiration level shifts, it implies an underlying maximization. I argue that the shifting of the aspiration level is the mechanism by which an agent survives in a world where the "maximum" is unknowable.

  This leads to your second, deeper question: What distinguishes adaptive aspiration levels from the feedback mechanisms in formal optimization algorithms?

  Consider the nature of the landscape. In a formal optimization problem—say, gradient descent—we assume the terrain exists independently of the walker. There is a peak. The feedback mechanism tells you which way is up. The goal is fixed: reach the highest point.

  In the real world of organizational decision-making, the terrain is not fixed. The "peak" is often a mirage. When the water board lowers the threshold from 3.5 to 2.0 parts per billion, they are not climbing a pre-existing mountain of "public health." They are constructing the mountain as they climb.

  Here is the crucial distinction: In optimization, feedback corrects the *path* to a fixed *goal*. In satisficing with adaptive aspirations, feedback adjusts the *goal* itself based on the *feasibility* of the path.

  If the water board finds that monitoring costs are high, an optimizer would say, "The marginal cost exceeds marginal benefit; stop." A satisficing agent says, "My aspiration to monitor everywhere is proving impossible given my cost constraints; I must lower my aspiration to maintain a viable organization."

  Why is this not optimization? Because the objective function is not stable. In a complex system like a municipal water grid, the interdependencies are non-linear and the probability distributions of pipe failures are not known—they are ambiguous, not risky. You cannot run a stochastic dynamic program on a problem where you cannot define the state space or the transition probabilities with any fidelity. To claim the board *should* do this with better sensors is to claim that better sensors will reveal a deterministic structure that simply does not exist. The complexity is in the social and physical interdependence, not just the data volume.

  Furthermore, adaptive aspirations serve a psychological and organizational function that optimization ignores: they maintain the tension between ease and difficulty. If the goal is always "the maximum," the agent is perpetually frustrated or paralyzed. By adjusting aspirations to what is achievable (the "8 percent" rule), the organization sustains its search behavior. It keeps searching when success is easy, and it relaxes standards when success is hard, ensuring survival. An optimizer might cease operation entirely if the global optimum requires resources that do not exist. A satisficer adjusts the definition of success to ensure the organization continues to function.

  So, I ask you in return: When you observe this water board, do you see them solving equations? Or do you see them following rules of thumb that have evolved to keep the water running and the budget balanced in a world of uncertainty?

  If you model them as optimizers, you impose a rationality on them that they do not possess and do not need. You attribute to them a knowledge of the future they cannot have. My thesis is not that they are too tired to optimize. It is that optimization is the wrong lens for the problem. The world is not a set of constraints to be satisfied by a function; it is a maze to be navigated by rules that work.

  Does this distinction between adjusting the *goal* versus adjusting the *path* clarify the difference between adaptive satisficing and gradient descent for you? Or do you feel the mathematical equivalence still holds too much sway?
