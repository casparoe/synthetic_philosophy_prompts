  4.  **Drafting the Content:**
      *   **Theoretical Check:** I need to explicitly validate the "multi-dimensional" framing. It's essentially Lewis's "contextual salience of properties." I will affirm this but warn against reifying the weights as metaphysical facts rather than pragmatic interests.
