      *   **Limitation:** The game treats worlds as discrete cards. It can't capture the *ontological parity* of worlds (that W1 is just as real as W@). It also can't fully capture the *reductionism* of Lewis's program (that modality is reduced to quantification over concrete worlds).

  5.  **Refining the Payoff:**
      *   Reputation Points (RP).
