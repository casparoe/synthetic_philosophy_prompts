  10. **Final Polish:** Ensure the distinction between "flouting" (knowing) and "violating" (deceptive/unaware) is clear, as this is central to the user's problem with their beta readers. Stevens often *violates* Quality (he believes his own lies) rather than *flouting* it (signaling he lies). This is why readers are confused.

  *(Self-Correction)*: Wait, if Stevens believes his own lies, he isn't violating Quality in the Gricean sense either, because he thinks he's telling the truth. He is *deluded*. This breaks Grice completely. Grice assumes a rational agent. Stevens is an irrational agent rationalizing. I need to highlight this. The "implicature" is generated by the *friction* between the reader's reality and the narrator's delusion, not by the narrator's signaling.

