answer: |-
  You mistake the legal form of the contract for the economic substance of the relation. In bourgeois jurisprudence, he is a partner; in political economy, he is a wage-labourer in disguise, much like the domestic weavers I examined in *Capital*. They too owned their looms and worked within their own cottages, yet they were utterly dependent on the merchant who supplied the yarn and monopolized access to the market. This driver's ownership of the car is analogous to the weaver's loom—a necessary instrument, yes, but one that is useless without access to the social organization of production which the firm exclusively owns. His "freedom" to log off is merely the freedom of the labourer to choose which capitalist to serve, or to starve—a freedom we know well from the reserve army of labour.

  What the firm owns is the mechanism of social coordination—the telegraphic network, if you will, that connects labour to need. This is fixed capital. The car is merely a tool, like the needle of the seamstress, but without access to the market controlled by the firm, that tool is useless wood and iron. The driver is not selling a commodity to the rider; he is selling labour-power to the firm, which then sells the service. The fare is not his revenue; it is the realised value of the service, from which he is paid a piece-wage disguised as a share. The algorithm is simply the overseer, the clock-in machine made intelligent, dictating the pace and price without the friction of human supervision.

  Surplus value arises because the driver works longer than is required to reproduce his own subsistence and the wear of his car. The firm appropriates the difference without equivalent. The form of payment is secondary to the relation of production: the worker produces value, and the capitalist appropriates the surplus. I must ask you: is this firm one among many competing, or does it command a monopoly over this network in your city? The degree of exploitation depends heavily on whether the driver can sell his labour elsewhere, or if he is bound to this single master by the necessity of the network itself.
