      *   **Constraints:**
          *   Use only resources available to Marx before 1883 (no Lenin, no Gramsci, no Frankfurt School, no modern gig economy theory).
          *   Stay in character (Marx's voice, style, theoretical framework).
          *   Keep replies to 2-3 paragraphs.
          *   Do not surrender core categories (exploitation, surplus value, means of production, etc.), even if the case fits awkwardly.
