      *Revision:* I should probably stick to the theoretical rebuttal first before asking questions, to meet the challenge head-on. But the prompt says "You may ask me for further factual detail... otherwise stay in character." I think a strong theoretical rebuttal is better for the first move, perhaps ending with a clarifying question about the concentration of these firms.

      *Drafting Paragraph 1:* You mistake the legal form for the economic substance. In bourgeois jurisprudence, he is a partner; in political economy, he is a wage-labourer in disguise. Consider the putting-out system of the textile workers I examined in *Capital*. They owned their looms, yet were utterly dependent on the merchant who supplied the raw material and took the product. Here, the "raw material" is the demand for transport, monopolized by the firm. The freedom to log off is merely the freedom of the labourer to choose which capitalist to serve, or to starve—a freedom we know well from the reserve army of labour.

