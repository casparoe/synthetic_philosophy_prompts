  *Wait, Fact #2:* The reports are unreliable. If I open them, I risk validating lies about the surveilled students.
  *Solution:* The release must be accompanied by a finding aid that explicitly contextualizes the "paid by the word" incentive structure. The archive becomes a museum of institutional failure, not a database of student conduct.

  Let's write.

