      *   *Intentional Stance:* We treat entities as rational agents with beliefs and desires to predict behavior. If it works, the entity *has* beliefs/desires in a pragmatic sense.
      *   *The "Counterfeit" Warning:* A system can *mimic* the output of the intentional stance without having the functional architecture that normally grounds those states in biological evolution or learning history. It's a "user illusion."
      *   *Consciousness:* Dennett is a functionalist/illusionist. He denies Cartesian materialism. So, a "counterfeit person" isn't necessarily a philosophical zombie in the Chalmers sense, but rather a system that triggers the *attribution* of personhood without the *sustainability* or *depth* of a biological person. It's about being *worthy* of the stance long-term vs. short-term trickery.
      *   *Distinction:* Genuine persons have a history of selection (evolutionary/cultural) that grounds their intentionality. Counterfeits are "syntactic engines" driving semantic illusions.
      *   *Refinement:* I need to be careful not to paint Dennett as a biological chauvinist. He allows for artificial minds *if* they have the right functional architecture. The "counterfeit" label applies when the architecture is merely predictive text (statistics) rather than goal-directed agency grounded in survival/needs.

