answer: |-
  Here is the breakdown of the landscape, the steelmanning of the opposing camps, and my verdict on your hypothesis and the path forward.

  ### Part I: Steelmanning the Camps

  To understand why this fight is stalled, we have to stop treating it as a disagreement about math. The math—the Price Equation, the partitioning of variance—is settled. Everyone agrees you can slice the cake different ways. The fight is about what the cake *is*.

  **The Gene-Centric View (The Accountants of Design)**
  The gene-selectionists are not merely being reductionist for the sake of it. Their strongest argument is about *time* and *fidelity*. Evolution is a process of accumulation. For adaptation to build complex machinery (like an eye or a wing), the instructions for that machinery must persist longer than the vehicle that carries them. Individuals die; groups fragment. Genes (or replicators, broadly construed) are the only entities that bridge the gap between generations with high fidelity.

  When a gene-centrist says "the gene is the unit of selection," they are making a claim about *credit assignment*. If a trait evolves, who gets the credit for the design? If you attribute the design to the group, but the group dissolves every generation while the genes persist, you are attributing the design to a ghost. They want a causal story that explains *why* the organism looks designed. Their answer: it looks designed because it is a survival machine for replicators. Any model that ignores this, they argue, might predict the next generation correctly, but it fails to explain the deep-time architecture of life. They are looking for the *purpose* of the adaptation, and they believe purpose is anchored in what gets copied.

  **The Multilevel Selection View (The Ecologists of Process)**
  The MLS proponents are not merely doing alternative bookkeeping. Their strongest argument is about *causality* and *emergence*. In the actual ecological theater, selection doesn't "see" genes directly. It sees phenotypes interacting with environments. Sometimes, the relevant environment *is* the group. If a bacterium produces a public good that saves the biofilm, and biofilms compete, the causal lever of evolution is the group structure.

  When an MLS theorist says "the group is a unit of selection," they are making a claim about *force*. They want to describe the dynamics of evolutionary change as it happens in real time. If you can manipulate group structure and change the evolutionary trajectory without changing the gene frequencies directly (by reshuffling who interacts with whom), then group selection is a causal force, regardless of what the long-term accounting looks like. They argue that the gene-centric view often turns into a just-so story where "genes for group loyalty" are posited after the fact, whereas MLS describes the actual pressure selecting for that loyalty. They care about the *process* of evolution, not just the archival record.

  ### Part II: Analyzing Your Hypothesis

  You have diagnosed the stalemate with impressive accuracy. Let's weigh your three points.

  **(1) The Verbal Ambiguity**
  You are right that "unit of selection" is doing too much work. It conflates the *replicator* (what gets copied), the *interactor* (what faces the environment), and the *beneficiary* (who gains fitness).
  *   **Gene Camp:** Prioritizes the replicator/beneficiary.
  *   **MLS Camp:** Prioritizes the interactor.
  However, fixing the definitions won't solve the fight. If we agreed to say "genes are replicators, organisms are interactors," the gene camp would still argue that the *evolutionary explanation* must track the replicator, while the MLS camp would argue that the *causal explanation* must track the interactor. The verbal confusion masks a deeper divergence in explanatory goals, but it isn't the root cause.

  **(2) Fact vs. Convention**
  This is the metaphysical friction. Is the level of selection a feature of the world or a feature of our model?
  *   **Gene Camp:** Tend toward realism about genes (they are physical, persistent) and instrumentalism about groups (groups are fuzzy, temporary).
  *   **MLS Camp:** Tend toward realism about causal processes (if group variance drives change, group selection is real) even if the groups are temporary.
  The stalemate here is that neither side can prove the other is "wrong" because they are operating with different criteria for reality. One side demands physical persistence (ontology); the other demands causal leverage (functionalism).

  **(3) Causal Story vs. Predictive Bookkeeping**
  This is your load-bearing beam, and you are mostly right, but it needs a slight adjustment. It isn't simply that one side wants causality and the other wants prediction. Both want causality.
  *   **The Difference:** It is about *granularity of manipulation*.
      *   The MLS camp asks: "If I intervene on the group structure (holding individual traits fixed), does the outcome change?" If yes, group selection is causally real.
      *   The Gene camp asks: "If I intervene on the gene frequency (holding group structure fixed), does the outcome change?" If yes, gene selection is causally real.
      *   Since both are usually true, the fight is about which intervention is *explanatorily privileged*. The gene camp thinks the gene intervention is fundamental because it persists. The MLS camp thinks the group intervention is fundamental because it captures the ecological context.
      *   **Your Insight:** You noted that cases like "soft selection" or "group reproduction" give the causal question a real answer. This is crucial. When groups reproduce (like a hive budding), the MLS view becomes empirically undeniable. The debate rages hottest where groups *don't* clearly reproduce.

  ### Part III: The Hidden Empirical Question

  You asked if there is a hidden empirical question dressed up as a semantic one. **Yes.**

  The hidden question is about **Heredity at Higher Levels.**

  The gene-centric view dominates because, in most of nature, high-fidelity heredity exists *only* at the genetic level. Individuals degrade, groups dissolve. The gene-centrists are betting that without high-fidelity reproduction, you cannot have cumulative adaptation. Therefore, they argue, selection *effectively* only acts at the level where heredity is stable.

  The MLS view gains traction when we find systems where higher levels *do* acquire heredity. Eusocial insects, multicellular organisms, and perhaps microbial biofilms. In these cases, the group reproduces with fidelity. The "hidden empirical question" is: *How common is it for higher-level entities to achieve sufficient fidelity of reproduction to sustain cumulative evolution?*

  The debate is stalled because the gene camp assumes the answer is "rare" (so gene selection is the default), while the MLS camp assumes the answer is "common enough to matter" (so multilevel selection is a general framework). They are fighting over the prevalence of a biological phenomenon (high-fidelity group reproduction) while pretending to fight over definitions.

  ### Part IV: The Verdict

  Here is my straight talk on the state of the field.

  **1. What kind of disagreement is this?**
  It is a **pragmatic disagreement masquerading as an ontological one.**
  Both sides agree on the math. Both sides agree that genes, individuals, and groups all play roles. The fight is over which perspective yields better *heuristics* for biologists.
  *   The Gene-Centric heuristic tells you to look for the "long-term investor." It prevents you from attributing purpose to temporary collectives.
  *   The MLS heuristic tells you to look for the "causal lever." It prevents you from ignoring ecological structures that drive change.
  Neither is "true" in a way that makes the other "false." They are different lenses. The stalemate persists because each side refuses to admit their lens is a tool rather than a mirror of reality.

  **2. Is your point (3) doing all the work?**
  Your point (3) is the engine, but point (2) is the fuel. The reason the causal question matters is that one side believes only genes are real enough to be causes (ontological commitment), while the other believes causal impact grants reality (functionalist commitment). If you resolve the causal definition (via interventionism), you still have to resolve whether a temporary causal force counts as a "unit of selection." So, (3) clarifies the debate, but doesn't end it without resolving (2).

  **3. What counts as progress?**
  Do not expect another equivalence theorem. We have enough math. Do not expect a consensus on definitions. Philosophers have been defining terms for two millennia without agreement.

  **Progress will come from dissolving the question.**
  The field is slowly moving toward the framework of **Evolutionary Transitions in Individuality.** This framework asks: *Under what conditions does a collection of lower-level units become a higher-level unit?*
  *   It stops asking "Which unit is the real one?"
  *   It starts asking "When does the group become an individual?"

  This shifts the debate from a static war over labels to a dynamic investigation of life history. It forces the empirical question I mentioned earlier: *Where is the heredity?*
  *   If a group reproduces with fidelity, it is an individual. Selection acts on it.
  *   If a group does not reproduce with fidelity, it is a context. Selection acts *in* it, but not *on* it.

  **My Advice for Your Feature:**
  The story isn't "Who won the units of selection war?" The story is "Why the war was a category error."
  The gene-centrists were right that adaptations require replicators. The MLS folks were right that ecology drives selection. The synthesis is that **individuality is a achieved state, not a starting assumption.**
  Sometimes genes are the individuals. Sometimes cells are the individuals. Sometimes organisms are the individuals. Sometimes colonies are the individuals. The "unit of selection" is simply the level at which heredity and fitness are currently aligned.

  **Progress** will look like biologists stopping the argument and instead measuring **group heritability.** If you can measure the fidelity with which a group trait is passed to daughter groups, the philosophical argument evaporates. If fidelity is high, it's a unit. If low, it's not.

  The stalemate exists because philosophers and theorists are arguing about the map while biologists are finally surveying the territory. The moment we have robust empirical metrics for "group reproduction," the semantic fight will look like a relic of the 20th century. Until then, it's just two teams describing the same elephant, one touching the bone and one touching the skin, arguing about which is the "real" elephant.
