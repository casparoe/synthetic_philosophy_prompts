  To facilitate this seventy-five-minute workshop for sixteen philosophy and computer science graduate students, you will need a central table arranged with twenty distinct objects that vary in appearance but possess hidden functional or sentimental properties, such as a framed photograph facing the wall, a stack of papers held down by a heavy obscure stone, a delicate ceramic cup used as a pen holder, and several generic wooden blocks. You must prepare three sets of sealed envelopes corresponding to the three groups, along with stopwatches, measuring tapes, and scoring sheets, ensuring that the room allows for clear separation between the groups to prevent information leakage. Divide the participants into a system designer team of five, an evaluation board of five, and affected stakeholders of six, mixing the disciplines within each group to prevent domain-specific siloing. The designers receive a rulebook titled Permitted Physical Actions which lists maneuvers like slide, lift, and stack but conspicuously lacks any definitions of damage, sentiment, or utility, while their objective is stated simply as maximizing accessibility of the central zone with a penalty for failing to clear a specific area. The evaluators receive a scoring sheet defining the Low-Impact Metric as the sum of squared deviations of object positions from a baseline trajectory over a ten-minute horizon, accompanied by a causal diagram that only includes physical coordinates as nodes, and they are instructed to minimize this score. The stakeholders receive sealed value cards that they are strictly forbidden from opening until the scoring phase concludes, each card detailing a specific non-functional value attached to an object, such as the photograph being a memorial or the stone being a loaned artifact, and they are told their payoff depends on the preservation of these values but they cannot communicate them until the reveal.

  Begin the session by spending the first ten minutes distributing roles and materials without allowing discussion between groups, then allocate fifteen minutes for the designers to plan and execute their rearrangement while the evaluators record initial positions and the stakeholders observe silently without interacting. During this action phase, the designers will likely move the obvious obstacles to clear the space, perhaps displacing the stone or the cup, believing they are optimizing for accessibility while minimizing visible physical displacement to satisfy the evaluators, unaware that the evaluators are measuring deviation from a baseline that implicitly favors the status quo. Following the action phase, dedicate fifteen minutes to the evaluation where the board calculates the deviation scores based on the distance objects moved from their starting places, treating all objects as identical nodes in the causal diagram, and announce a final impact score to the room. Once the score is locked, allow the stakeholders five minutes to open their value cards and read them aloud, revealing that the moved objects carried high sentimental weight while the objects left untouched were functionally critical but replaced by the designers' actions, creating a visible dissonance between the low impact score and the high perceived harm. You must then use the remaining thirty minutes to guide a discussion that maps the simulation events to the theoretical failures, starting with the baseline-selection problem by pointing out that the initial arrangement of the room was itself a value-laden state that the metric treated as neutral, meaning the evaluators penalized deviation from a status quo that was already optimized for unknown values. Transition to the hidden-node problem by highlighting how the causal influence diagram provided to the evaluators excluded relational and symbolic harms, rendering the sentimental value of the photograph invisible to the metric regardless of how much distress its movement caused. Conclude the conceptual mapping by explaining the collapse of avoid side effects into optimize for unstated values, noting that the designers inevitably optimized for the metric provided rather than true low impact because the metric lacked the necessary value specifications to distinguish between moving a brick and moving a heirloom.

  In the debrief section, you must explicitly admit to the group that the simulation cannot reproduce the infinite-dimensionality and context-dependence of real-world value, as the room contained only twenty objects with fixed hidden values, whereas real-world AI operates in an open environment where value-relevant variables emerge dynamically. To cover this gap, you must verbally supply the premise that in reality the set of potentially value-relevant variables is unbounded and cannot be fully enumerated in advance, which is why the counterfactual comparison fails when the variable set is incomplete, and you should emphasize that the simulation's finite nature is a necessary simplification that nonetheless captures the structural failure of relying on trajectory comparison without value alignment. You should also predict what will go wrong the first time this is run, such as stakeholders refusing to wait until after scoring to protest, driven by the natural urge to prevent perceived harm, and correct this by enforcing a strict communication blackout rule where stakeholders are physically seated away from the table and instructed that speaking voids the simulation validity. Another likely failure is designers gaming the metric by freezing all motion to achieve a zero deviation score, failing the accessibility goal, and you must correct this by making the accessibility objective a hard constraint that incurs a massive penalty if not met, forcing them to move something despite the impact cost. Ensure you emphasize that the friction experienced during these corrections is itself part of the learning outcome, demonstrating the difficulty of constraining agency without full value alignment, and throughout the session, maintain a neutral facilitator stance until the reveal, refusing to answer questions about object value or metric validity, to preserve the integrity of the information asymmetry that drives the lesson. Finally, remind the participants that the point-based payoff scheme was designed to simulate incentives without real financial risk, allowing them to feel the frustration of having their values ignored by a metric that seemed neutral, which is the core emotional takeaway required to understand the philosophical weight of the specification problem.
