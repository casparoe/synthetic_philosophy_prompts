    "dialogue_text": "Elias: Think of the directive as a personal constitution. It's a definate boundary set by the only person who had full capacity. To ignore it is to say her past autonomy matters less than our current comfort.\n\nMara: But autonomy requires a subject. The woman who wrote that paper is gone. This person here enjoys pudding. Why should a ghost from ten years ago veto thier present joy?\n\nElias: Because identity isn't just momentary experience. It's a narrative. If we can't bind our future selves, planning for incapacity becomes meaningless. We'd be forced to treat every dementia patient as a new person with no history.\n\nMara: I'm not saying history vanishes. I'm saying the chain of authority breaks when the mind breaks. You're honoring a preference, not a person. The living being in front of you has interests too, mainly avoiding hunger.\n\nElias: But suffering isn't just physical. There's a dignity in respecting the life plan she chose when she was whole. Overriding it treats her like a pet we keep comfortable rather than a person with values.\n\nMara: And keeping her alive by force treats her like a project. If the 'whole' person is gone, isn't the kindest act to prioritize the peace of the one who remains?",
