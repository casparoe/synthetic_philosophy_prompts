  3. Clifford's rule constrains assertion as strictly as belief, so hedged wording discharges the duty only if it accurately transmits the evidential uncertainty to the audience, rather than serving as a linguistic shield for under-supported claims.
  4. James's defence cannot be stretched to justify belief for the field's benefit, as his argument relies on the believer's own passional stakes rather than on altruistic calculations about resource allocation or scientific progress.
  5. The self-verifying nature of the uptake is neither evidence nor excuse for Clifford, because causing a proposition to become true through belief does not rectify the initial wrong of believing it without sufficient prior evidence.
