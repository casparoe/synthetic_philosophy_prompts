answer: |-
  "The S-value is 2.82," David said, tapping the printout. "Clean violation. Take that, Einstein."

  Hugh didn't look up from her console. "Einstein was wrong about completeness, not locality. My wavefunction evolved unitarily the entire time. Local Hamiltonians, local interactions. No spooky action."

  "Don't give me that," David scoffed. "Bell proved you can't have local beables and these correlations. I have particles with definite positions. For them to match up across stations, the pilot wave had to reach across the lab instantly. Nonlocality is a feature, not a bug. It's exactly what Bell said any theory with definite outcomes must pay."

  "Bell ruled out local *single-world* theories," Hugh corrected, finally turning. "You assume there's one outcome. I don't. The universal wavefunction contains all outcomes. The correlation isn't caused by a signal from Alice to Bob; it's encoded in the branching structure. When Alice measures, she splits. When Bob measures, he splits. The correlations exist because they're in the same branch of the multiverse. Locality is preserved; uniqueness is the casualty."

  "So you deny the experiment had a result?" David leaned against the bench. "I saw a click. One click. You're telling me there's a ghost version of me seeing the opposite?"

  "I'm telling you the physics is linear. You're the one adding magic," Hugh shot back. "You have a particle riding a wave it doesn't affect. The 'empty wave' carries all the energy and information, guiding the particle, but the particle is just a cork on the ocean. Why posit the cork if the wave does all the causal work? That's epiphenomenal baggage."

  "Because the cork is the reality we experience!" David insisted. "Your 'branches' are just math until you invoke the Born rule to explain why we find ourselves in high-weight branches. And even then, you need decoherence to pretend the worlds are separate. My nonlocality is explicit, yes, but it's hidden. No signaling theorem holds. I can't use the pilot wave to send a message faster than light. It's a nonlocal influence that respects relativistic causality operationally."

  "Operational respect isn't ontological locality," Hugh said. "You're smuggling in a preferred foliation of spacetime to make sense of that instantaneous guidance. I keep Lorentz invariance fundamental. The cost is accepting that 'result' is relative to an observer's branch. You think I deny the result; I think you deny the symmetry of the Schrödinger equation."

  "We're both fitting the same data," David said, picking up the printout. "CHSH violation doesn't vindicate either of us. It just tells us what we had to break."

  "Exactly," Hugh smiled, weary but smug. "You broke locality to save definite outcomes. I broke definite outcomes to save locality."

  "And you think your price is cheaper? Saying 'both happened' is just waving hands at the measurement problem."

  "And saying 'the wave reached across space instantly' isn't?" Hugh stood up. "We're not arguing about the data, David. We're arguing about which axiom Bell's theorem forces us to sacrifice. You chose realism. I chose unitarity."

  David looked at the numbers again. "So neither of us won. We just chose different poisons."

  "Physics isn't about comfort," Hugh said, grabbing her coat. "It's about consistency. Sleep well in your single world."

  "Sleep well in your infinite ones," David muttered.

  They both knew the data didn't care.
