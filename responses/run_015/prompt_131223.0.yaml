  ### NOTES ON COLLAPSE & GAPS

  **Do Leaf 4 and Leaf 5 collapse?**
  On the three specific votes (Boiler, Pellets, Offsets), Leaf 4 and Leaf 5 often give the same advice *unless* the grant status is common knowledge.
  *   **Collapse:** If the grant status is unknown, both vote "Replace." Both vote "Merge." Both vote "No Offsets."
  *   **Prising them apart:** You need a fourth vote: *"Should we publicly announce the grant was already approved?"* Leaf 4 says Yes (transparency matters for the practice). Leaf 5 says No (symbolism matters more).

  **Is Leaf 7 truly empty?**
  Yes. Nobody defends this position openly. It is the position of someone who wants the moral credit of the "Impact" label without the discipline of the "Impact" logic. It is the most common unspoken position in the room.

  **A Note on Leaf 6 (Your Mood):**
  You asked not to be gentle. This leaf commits you to buying offsets (Vote 3). Offsets are widely regarded as "indulgences"—paying to continue a sin. If your position is "it's about the kind of household you are," this leaf commits you to saying that being a "good household" involves paying for paperwork that allows the hall to keep burning oil. If you cannot say that line out loud, you belong in Leaf 5.
