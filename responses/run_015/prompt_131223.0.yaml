answer: |-
  # THE CO-OP DECISION TREE (A3 DRAFT)

  **Instructions:** Start at the top. Answer **YES** or **NO** based on your gut reaction to the specific scenario. Follow the line. Read your Leaf at the bottom.

  ---

  ### THE QUESTIONS

  **1. THE "NOTHING CHANGES" TEST**
  Suppose the supplier and the council guarantee in writing: your decision changes *nothing*. No emissions, no price, no behaviour, no truck schedule. Do you still order the pellets?
  *   **NO** → Go to Q2. (You care about impact.)
  *   **YES** → Go to Q4. (You care about something else.)

  **2. THE "HARD LIMIT" TEST**
  Our village is exactly 1 tonne short of the 12-tonne minimum. If we don't order, the truck doesn't come for *anyone*. Do you order?
  *   **NO** → **LEAF 1**
  *   **YES** → Go to Q3.

  **3. THE "LOCKSTEP" TEST**
  The shared lorry only runs if the *next valley* also orders. You don't know if they will. Your order alone guarantees nothing. Do you order?
  *   **NO** → **LEAF 2**
  *   **YES** → **LEAF 3**

  **4. THE "FIXED OUTCOME" TEST**
  The council grant for the new boiler is already signed. Your vote cannot stop or start the replacement. Do you vote "Yes" to replace?
  *   **NO** → **LEAF 4**
  *   **YES** → Go to Q5.

  **5. THE "PAPERWORK" TEST**
  We can buy carbon offsets for the hall. It costs money but changes no physical emissions (it's just accounting). Do we do it?
  *   **NO** → **LEAF 5**
  *   **YES** → **LEAF 6**

  *(Note: There is no path to Leaf 7. It is an empty cell reserved for the person who answers NO to Q1 but YES to Q4. See below.)*

  ---

  ### THE LEAVES

  **LEAF 1: THE HARD-NOSED REALIST**
  *   **Position:** There is genuinely no duty in no-threshold cases.
  *   **Cell Status:** Occupied.
  *   **Your Votes:** (1) Run boiler to ground (unless vote tips scale). (2) Merge orders only if *definitely* under limit. (3) No offsets.
  *   **The Awkward Line:** "I will let the hall freeze if my pound doesn't measurably lower the global temperature."

  **LEAF 2: THE TRIGGER GUARDIAN**
  *   **Position:** Duties only bite where there's an actual trigger or rounding point.
  *   **Cell Status:** Occupied.
  *   **Your Votes:** (1) Replace boiler (if vote counts). (2) Merge orders (if near limit). (3) No offsets.
  *   **The Awkward Line:** "I'll help save the village, but I won't lift a finger to help the next valley unless I know they're already lifting theirs."

  **LEAF 3: THE EXPECTED VALUE GAMBLER**
  *   **Position:** A tiny chance of crossing some threshold is enough to make the act worth doing when the stakes are big.
  *   **Cell Status:** Occupied.
  *   **Your Votes:** (1) Replace boiler. (2) Merge orders (always). (3) No offsets (unless they influence market price).
  *   **The Awkward Line:** "I'm happy to waste money on a 1% chance of success, provided the math says the potential saving is big enough."

  **LEAF 4: THE CONDITIONAL PARTICIPATOR**
  *   **Position:** Non-difference-making view about being a participant in a practice the group is running, but only if the practice *does* something.
  *   **Cell Status:** Occupied.
  *   **Your Votes:** (1) Run boiler to ground (if grant fixed). (2) Merge orders. (3) No offsets.
  *   **The Awkward Line:** "I want to be part of the solution, but only if my participation isn't purely symbolic."

  **LEAF 5: THE PRAGMATIC IDEALIST**
  *   **Position:** It's about the kind of household you are, but you draw the line at paying for paperwork.
