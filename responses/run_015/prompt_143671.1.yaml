              *   *Actually, the most robust advice:* The "fact of the matter" argument is wrong. The "unsettleable" claims are bad. The arbitrage is the tricky part. In a *prediction* market, the goal is to find truth. Arbitrage helps truth discovery. But in a *friendly* market, the goal is fun. Guaranteed profit kills fun for the losers.
              *   *Final Verdict:* Disallow "Never". Allow compounds. But, since the user runs it, they should probably prevent *risk-free* arbitrage that guarantees loss for others, OR accept that this is the cost of liquidity. Given the "lose friends" constraint, preventing the "guaranteed loss" scenario is safer.
