      *   *Trade:* Long A (0.30), Long B (0.30), Short (A OR B) (0.80).
      *   *Cost:* $0.30 + 0.30 - 0.80 = -0.20$ (He receives 0.20 upfront).
      *   *Payoff:*
          *   If A=0, B=0: (A OR B)=0. He pays 0 on short. Net: +0.20.
