              *   *Decision:* Advise the user that the "fact of the matter" argument is false. Advise that "Never" claims are invalid. Advise that while arbitrage is useful in Wall Street, in a friends' market it creates resentment. Suggest allowing compound claims but perhaps capping stakes on them, or educating the group that prices must sum correctly.
