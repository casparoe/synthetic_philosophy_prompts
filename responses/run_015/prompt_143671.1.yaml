      *   *Pro-Arbitrage View:* He forces prices to be logically consistent. If A is 30% and B is 30%, A OR B *cannot* be 80% if they are mutually exclusive, or even if they aren't, there are bounds. He prevents the group from making stupid bets against each other that guarantee loss.
