              *   *Compromise:* Allow compound claims, but implement a "consistency check" or simply educate the group. Actually, the cleanest rule is: **You can trade compounds, but you cannot create a guaranteed profit position (arbitrage) against the existing pool.** Or, simpler: **Compound claims are allowed, but "Never" claims are not. Prices must be logically consistent (admin reserves right to reject incoherent pricing).**
