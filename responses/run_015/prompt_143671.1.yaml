              *   *Best path:* Allow compound claims. Disallow "Never". Explain that arbitrage is technically valid but socially risky. Let the group vote? No, the user has to rule.
              *   *My advice:* Disallow "Never". Allow compounds. But warn that exploiting price incoherence for guaranteed profit is technically "market making" but socially "predatory" in this context. If he wants to do it, he should be transparent.
              *   *Actually, the strongest point:* The dry run proves the *other* participants are making math errors. Allowing him to exploit that guarantees *their* loss. That's not a prediction market anymore; it's a math test.
              *   *Recommendation:* Allow compound claims. Disallow "Never". But, to preserve friendship, the market should enforce logical consistency (no Dutch Books allowed). This prevents him from making risk-free profit and prevents others from making risk-free losses.

