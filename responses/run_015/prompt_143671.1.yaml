      *   *Relevance:* Even if truth is "latent," the logical relationships between A, B, and (A OR B) are fixed *now*. $P(A \cup B) = P(A) + P(B) - P(A \cap B)$. If prices violate probability axioms, arbitrage exists.
      *   *Conclusion:* His argument is a red herring. The issue isn't ontology; it's market consistency and settlement risk.

