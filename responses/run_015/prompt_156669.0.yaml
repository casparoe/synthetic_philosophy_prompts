prompt: |-
  After thirty years in chemistry labs I just started reading Weber's Protestant Ethic book and Im trying to figure out if culture can be a real cause or just decoration for material forces. Could you compare Weber's idea of elective affinity between Calvinist values and capitalist development with downward causation in emergent systems? Specifically, does Weber treat values as giving an independent causal push, or are they just a filter selecting which economic possibilities actually occur? And how does that stack up against the materialist view that only material conditions do real explaination? I don't need a bibliography, just want to understand which picture actually lets values do work instead of just recieve credit after the fact.
