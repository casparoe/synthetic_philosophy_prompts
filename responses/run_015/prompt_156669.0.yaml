      *   **Topic:** Max Weber's *The Protestant Ethic and the Spirit of Capitalism*.
      *   **Core Question:** Is culture (values/ideas) a *real cause* or just *decoration/filter* for material forces?
      *   **Specific Comparison:** Compare Weber's "elective affinity" with "downward causation" in emergent systems.
      *   **Specific Sub-questions:**
          *   Do values give an independent causal push?
          *   Or are they just a filter selecting economic possibilities?
