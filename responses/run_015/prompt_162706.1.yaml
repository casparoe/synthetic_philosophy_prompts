answer: |-
  ### Instructor Note: Premise Check

  The case is philosophically sound, though historically anachronistic. Aristotle defines *nomisma* by its function (measure/guarantee) and its origin (*nomos*), not strictly by its materiality. Separating the unit of account from the circulating medium tests whether students understand that *function* is primary for Aristotle. The tension between "demand is the standard" (fluid) and "prices ought to be fixed" (stable) is genuine in the text (NE V.5), so the Sykaminon decree forces a resolution of that tension. The usury question rests on reconstructing whether Aristotle objects to the *form* of breeding money or the *extraction of surplus value*; the text leans toward the former, but the latter is implied by the "barren" metaphor. I am confident this works as a seminar test, provided students are warned to stick to the conceptual logic rather than historical plausibility.

  ***

  ### Take-Home Essay Question

  **Topic:** Aristotle on Money, Exchange, and Justice
  **Time:** 90 minutes
  **Length:** Approximately 700 words

  **The Case:**
  Following a harvest failure, the city of Sykaminon decrees: (1) All contracts and prices are reckoned in a **chreia-unit**, fixed by statute to a basket of necessaries (grain, oil, etc.) for twenty years. No coins denominated in chreia-units exist. (2) Payments are made in silver staters at a daily posted rate against the chreia-unit. (3) The merchant Kleinias lends 100 chreia-units, repayable as 110 chreia-units in one year, settled in silver at the repayment date's rate. Over the year, the silver-value of the chreia-unit rises by exactly 10%.

  **The Task:**
  Using Handout Passages (A) and (B) (NE V.5) and Aristotle's argument against usury in *Politics* I.10, evaluate the Sykaminon decree. Your answer must address the following three moves:

  1.  **Function vs. Substance:** Aristotle assigns money two jobs: measuring commensurability for reciprocal justice, and serving as a guarantee for future exchange. In Sykaminon, the chreia-unit measures, but silver circulates. Does reciprocal justice survive this split? Which job is essential to Aristotle's account of equality?
  2.  **Demand vs. Convention:** Aristotle claims demand (*chreia*) is the real standard, while money represents it by convention (*nomos*). He admits demand fluctuates, yet suggests prices ought to be fixed. Does the chreia-unit (fixed for twenty years) better represent demand than silver, or does it freeze exchange in a way that violates Aristotle's condition that "if wants alter... exchange will go on... on different lines"?
  3.  **Usury (*Tokos*):** Aristotle condemns interest because money is barren and meant for exchange, not breeding. Kleinias gains 10% in chreia-units, but 0% in silver purchasing power. Does this contract count as unnatural *tokos*? Does Aristotle's objection target the nominal increase of currency or the extraction of surplus value from the money itself?

  ***

  ### Model Answer

  Aristotle's account of money in *Nicomachean Ethics* V turns on its function rather than its substance. He identifies two roles: money acts as a measure to make dissimilar goods commensurable for reciprocal justice, and as a guarantee to hold value for future exchange. In Sykaminon, these functions are split: the chreia-unit measures, while silver circulates. Aristotle can accept this split provided the measuring function remains intact. Passage (B) states that "there can be no exchange without equality, and no equality without commensurability." The essential job is measuring demand so that a builder's work can be equated to a shoemaker's. Whether the token circulating is silver or a statutory unit matters less than whether the measure successfully reduces things to equality. However, the guarantee function—holding value over time—is compromised if the measure does not track actual demand. If the chreia-unit fails to represent real need, the "association" Aristotle deems necessary for the city collapses. Thus, reciprocal justice survives the split only if the unit of account successfully performs the commensurability function.

  This leads to the second issue: whether a fixed basket represents demand better than silver. Aristotle says demand is the real standard, but it is fluid; "if men cease to have wants or if their wants alter, exchange will go on no longer, or on different lines." Money (*nomisma*) exists by convention to represent this demand. The Sykaminon decree fixes the basket for twenty years. While Aristotle floats the idea that "the proper thing is for all commodities to have their prices fixed" to ensure association, this presupposes the fixed price reflects actual commensurability. A statutory basket that cannot alter for two decades ignores the reality that wants alter. Silver fluctuates, which Aristotle admits, but he claims it is "comparatively constant." The chreia-unit attempts to legislate constancy where nature provides fluidity. Consequently, the reform makes reciprocal justice too conventional. It substitutes legal rigidity for the "sufficiently accurate common measure" provided by actual demand. By freezing the standard, the city risks a situation where exchange continues formally but fails materially, because the measure no longer matches the needs holding the community together.

  Finally, regarding Kleinias's loan: Aristotle's argument against *tokos* in *Politics* I.10 rests on the claim that money is barren; it is made for exchange, not to breed. Interest is unnatural because it derives gain from the money itself rather than from the use of the thing procured. In Sykaminon, Kleinias lends 100 units and receives 110. Nominally, the money has bred. However, in silver purchasing power, he receives exactly what he lent. The 10% increment tracks the depreciation of silver against the basket, preserving value rather than extracting surplus. Aristotle's objection targets the idea that money can generate value independently of human labor or need. Since Kleinias gains no real purchasing power, the loan does not treat money as a breeding stock in the substantive sense. However, the *form* of the contract treats the unit as generating a return. If Aristotle's condemnation is strictly against the *appearance* of money breeding money, the contract is suspect. But if the objection is against unjust enrichment from the medium itself, Kleinias is clear. Given Aristotle's focus on the unnaturalness of gain from the coin *qua* coin, a loan that merely preserves commensurability against fluctuation aligns better with money's proper use as a measure than a loan seeking real profit. The decree attempts to stabilize exchange, but Kleinias's contract walks the line between preserving value and mimicking usury.

  ***

  ### Marking Scheme

  | move | marks | a_level | b_level | typical_mistake |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Function vs. Substance** | 8 | Identifies measure (commensurability) as essential for justice; argues guarantee is secondary if measure holds; cites "no equality without commensurability." | Lists the two functions but fails to prioritize; says split is impossible because Aristotle defines money as both. | Claims silver must be the measure because it circulates; ignores the primacy of the measuring function in NE V. |
  | **2. Demand vs. Convention** | 8 | Spots tension between "wants alter" and "prices ought to be fixed"; argues fixed basket violates fluid demand condition. | Recites "money is by convention not nature"; says basket is better because it is fixed, ignoring the "wants alter" passage. | Treats "convention" as arbitrary; misses that convention must track demand to work. |
  | **3. Usury (*Tokos*)** | 7 | Distinguishes nominal increase vs. real purchasing power; argues Aristotle targets surplus extraction from money itself. | Says all interest is unnatural regardless of inflation; or says it is natural because it helps trade. | Confuses NE exchange justice with Pol usury argument; ignores the silver-value detail. |
  | **Bonus** | 2 | Notes that if the basket fails to track demand, the "fixed price" ideal becomes unjust, linking moves 2 and 3. | N/A | N/A |

  ***

  ### Confidence Assessment

  **Straight off the text:**
  *   Money serves as measure and guarantee (NE V.5).
  *   Demand is the real standard, money is convention (NE V.5).
  *   Wants alter, exchange changes if they do (NE V.5).
  *   Prices ought to be fixed (NE V.5).
  *   Usury is unnatural because money is barren (Pol I.10).

  **Reconstruction (Moderate Confidence):**
  *   *Stability Condition:* I am reconstructing that Aristotle requires the measure to track demand *actually*, not just legally. The text says demand is the standard, but also prices ought to be fixed. I am assuming the "fixed price" comment presupposes accurate commensurability, not statutory rigidity.
  *   *Usury Mechanism:* I am reconstructing that Aristotle's objection to *tokos* implies an objection to *real* gain from money, not just nominal. The text says "gain coming from the money itself." If purchasing power is static, is gain coming from the money or from the adjustment of the measure? This is not explicitly solved in the text.

  **Guessing (Low Confidence):**
  *   Whether Aristotle would permit a non-circulating unit of account. He defines *nomisma* as something that circulates ("can be altered... at will"). The Sykaminon unit does not circulate. I am assuming the *function* matters more than the *circulation* for the sake of the essay question, but strictly speaking, Aristotle might reject the chreia-unit as not being money at all.

