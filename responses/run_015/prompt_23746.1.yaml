      "war_propaganda_film": {"infectiousness": 0, "simplicity": 0, "goodness": 0},
      "internet_meme": {"infectiousness": 0, "simplicity": 0, "goodness": 0}
    },
    "final_ranking": ["<best>", "<second>", "...", "<worst>"]
  }
  ```
