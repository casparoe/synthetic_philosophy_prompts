      "liturgical_chant": {"infectiousness": 0, "simplicity": 0, "goodness": 0},
      "lullaby": {"infectiousness": 0, "simplicity": 0, "goodness": 0},
      "work_song": {"infectiousness": 0, "simplicity": 0, "goodness": 0},
