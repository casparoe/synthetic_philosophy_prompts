answer: |-
  You have constructed a very sharp version of the "Certification Regress" argument, and your intuition is correct: the break is in **Premise (3)**.

  You wrote: *"I'd much rather keep (1) and (7) than (3), but I can't see how to drop (3) without letting a stopped clock count as a pramāṇa whenever it happens to be right."*

  This is the exact tension Nyāya philosophers (like Gaṅgeśa in the *Tattvacintāmaṇi*) wrestled with. The solution requires distinguishing between the **genesis of knowledge** (*pramā-utpatti*) and the **ascertainment of knowledge** (*pramā-niścaya*).

  Here is why you should reject (3), how Nyāya blocks the "stopped clock" without it, and why the fight with Mīmāṃsā still matters.

  ### 1. The Break: Premise (3) is Internalist Smuggling
  Premise (3) states: *"Before a cognition from S can count as knowledge, the excellence of S has to be established — by the subject, or at least in principle."*

  This premise smuggles an **internalist** requirement (the subject must have access to/establishment of the source's status) into an **externalist** framework.

  Nyāya is a form of Causal Reliabilism. For Nyāya, a cognition is *pramā* (knowledge) if and only if:
  1.  It is true (*yathārtha*).
  2.  It is produced by a *pramāṇa* (a causal instrument with the specific excellence/*guṇa* required to produce truth).

  Crucially, **the subject does not need to know that condition (2) is met for condition (2) to do its work.**

  If I see a mug, and my eyes are functioning correctly (possessing the *guṇa*), and the light is good, and the contact (*sannikarṣa*) is proper, I have *pramā*. I do not need to run a diagnostic on my retinas *before* the cognition counts as knowledge. If I did, you would be right: the regress is immediate and fatal.

  Nyāya rejects (3) by distinguishing two stages:
  *   **Stage 1 (*Utpatti*):** The cognition arises. If the causal conditions are excellent, it is *pramā*. Validity is extrinsic here (it depends on the *guṇa*), but the *awareness* of that validity is not required.
  *   **Stage 2 (*Niścaya*):** The subject reflects, "Do I know this?" or a skeptic challenges, "How do you know?" Now, I must establish the excellence of the source (via inference, testing, etc.).

  The regress you describe applies to Stage 2 (certification), not Stage 1 (generation). Nyāya accepts that we don't always have Stage 2. But we still have Stage 1. Therefore, we have knowledge without having certified that we have knowledge.

  ### 2. Saving Premise (1): The Stopped Clock Objection
  Your worry is: *"If I drop (3)... I'm paying... letting a stopped clock count as a pramāṇa whenever it happens to be right."*

  Dropping (3) does **not** force you to abandon (1).
  *   **Premise (1)** says: The source must *actually* be reliable (have *guṇa*).
  *   **Premise (3)** says: The subject must *establish* that the source is reliable.

  You can keep (1) and drop (3).
  A stopped clock is **not** a *pramāṇa*. It lacks the *guṇa* (the capacity/excellence to reveal the object as it is). It produces a true cognition twice a day, but that truth is accidental (*yadṛcchā*), not causal. Nyāya defines *pramāṇa* instrumentally. If the instrument is broken, it cannot produce *pramā*, even if the output matches reality.

  So, the stopped clock is blocked by (1), not by (3).
  *   **By keeping (1):** You ensure that only actually reliable sources produce knowledge.
  *   **By dropping (3):** You ensure that the subject doesn't need to *prove* reliability before acquiring knowledge.

  This solves the regress. The chain of *justification* (Stage 2) might regress if pressed indefinitely, but the chain of *causation* (Stage 1) does not. The *guṇa* in the eye causes the vision. The vision is knowledge. End of story. The regress only starts if you insist on *knowing that you know*.

  ### 3. Why Escape One ("No Doubt, No Need") Isn't Just Temperament
  You rejected Escape One because it makes knowledge depend on "temperament" (confident vs. anxious). But the Nyāya version isn't about temperament; it's about **practical efficacy** (*arthakriyā*).

  Nyāya says validity is often confirmed by successful action. I see water, I drink, thirst is quenched. This success confirms the *guṇa* of the visual cognition retrospectively.
  This isn't "no doubt, no need." It is: "The default state of a cognition produced by a *pramāṇa* is validity. Doubt is a specific cognitive event that requires a trigger (contradiction, uncertainty of source). Absent that trigger, the cognition stands as knowledge."

  This avoids the temperament charge because the trigger for doubt must be objective (e.g., seeing a mirage, knowing the light is dim), not subjective anxiety.

  ### 4. Why the Nyāya vs. Mīmāṃsā Fight Still Matters
  You asked: *"If that's the fix [Reliabilism], I don't see what the Nyāya versus Mīmāṃsā fight was even about."*

  If Nyāya is just "Externalism" and Mīmāṃsā is "Internalism/Default Trust," why the centuries of debate?

  1.  **Error Theory:**
      *   **Mīmāṃsā (Intrinsic Validity):** All cognitions are valid until proven otherwise. Error is a composite of two valid cognitions (seeing "silver" + remembering "shell-silver") misapplied.
      *   **Nyāya (Extrinsic Validity):** Error is a real cognitive event caused by a *doṣa* (defect).
      *   *Why it matters:* If validity is intrinsic (Mīmāṃsā), skepticism is unnatural; we are wired to trust. If validity is extrinsic (Nyāya), skepticism is a tool; we must verify causal chains. This changes how you approach Vedic testimony. Mīmāṃsā says "Trust the Veda unless contradicted." Nyāya says "The Veda is valid because the speaker (God/Ṛṣis) is reliable, which we know via inference."

  2.  **Soteriology (Liberation):**
      *   For Nyāya, liberation (*apavarga*) comes from correct knowledge of reality (*tattvajñāna*). If you can't distinguish between a *guṇa*-based cognition and a *doṣa*-based cognition, you remain bound.
      *   The *parataḥ* view forces the philosopher to investigate the *causes* of belief. It makes epistemology a normative science of causal conditions, not just a phenomenology of experience.

  3.  **The Regress Problem:**
      *   Mīmāṃsā posits *svataḥ prāmāṇya* specifically to stop your regress argument at step 1. They say "Cognitions are self-certifying."
      *   Nyāya accepts the risk of the regress (in certification) to maintain a realist ontology. They prefer to say "Certification stops at successful action" rather than "Validity is intrinsic."
      *   The fight is about whether truth is a **property of the cognition itself** (Mīmāṃsā) or a **property of the causal relation** (Nyāya). That is a massive metaphysical difference, even if both end up being "reliabilist" in the modern analytic sense.

  ### Summary of Costs
  If you reject (3), here is what you pay:

  1.  **You accept Externalism:** You must admit that a subject can possess knowledge without possessing the ability to justify that they possess it (until challenged). You separate *having* knowledge from *knowing that you have* knowledge.
  2.  **You accept Default Realism:** You must accept that cognitions produced by functioning senses are valid *by default*, and the burden of proof lies on the skeptic to show a *doṣa* (defect), not on the knower to show a *guṇa* (excellence) immediately.
  3.  **You preserve the Stopped Clock:** You keep (1). The stopped clock is excluded because it lacks *guṇa*, not because the subject failed to check it.

  **Verdict:** Drop (3). It conflates the *conditions for knowledge* with the *conditions for the awareness of knowledge*. Nyāya is robust enough to handle the regress by limiting it to the second-order certification, leaving first-order perception intact.
