  9.  **Self-Correction/Review against Constraints:**

      *   *2 Hours?* A PO can't verify RCTs in 2 hours. *Correction:* The PO checks for *existence* of evidence, Consultant checks validity. PO focuses on S-Ledger.
      *   *No Economist?* The Consultant does the CPO math. PO just reads the "Green/Yellow/Red" light from the consultant.
