answer: |-
  # The Dual-Ledger Triage Procedure (DLTP)

  **Purpose:** To rank grant proposals using cost-effectiveness data while formally accounting for structural impact, within a 2-hour Program Officer (PO) window.
  **Users:** Program Officer (PO), Part-Time Economist Consultant (Consultant), Board of Directors.
  **Constraints:** 60 grants/year, no in-house economist, Board approval >$250k.

  ## Part 1: The Board's Pre-Work (Annual)
  *Before any proposals are reviewed, the Board must set the **Structural Shadow Price (SSP)**.*

  *   **The Mechanism:** The Board declares a dollar value for one point on the Structural Ledger.
  *   **The Rule:** "For the fiscal year, one (1) point of Structural Score is equivalent to $50,000 of Quantifiable Net Value."
  *   **Why:** This prevents ad-hoc rescuing of pet projects. If a project has low quantifiable value, it *must* earn its keep on the Structural Ledger to pass.
  *   **Judgment Call Alert:** Setting the SSP is a pure value judgment disguised as a parameter. A high SSP privileges systemic change; a low SSP privileges immediate relief. The Board must own this number.

  ---

  ## Part 2: The Five Gates (Per Proposal)
  *Total PO Time: 120 Minutes. Consultant Time: Asynchronous (prior to PO review).*

  ### Gate 1: The Counterfactual Floor (15 Minutes)
  **Owner:** PO
  **Input:** Proposal Theory of Change.
  **Question:** "If we do not fund this, does the outcome happen anyway?"
  *   **Pass:** Plausible argument that the activity stops or shrinks significantly without this grant.
  *   **Fail:** The activity is fully funded by others, or government policy mandates it.
  *   **Action:** If **Fail**, return proposal. Do not proceed.
  *   **Critique Note:** This gate accepts the EA premise of additionality. It drops the critique that "government advocacy might leverage state funds later" unless explicitly written as a goal.

  ### Gate 2: The Quantifiable Ledger (Q-Ledger) (30 Minutes)
  **Owner:** Consultant (Calculation), PO (Verification).
  **Input:** Consultant's "One-Page Cost-Effectiveness Brief."
  **Metric:** **Net Quantifiable Value (NQV)** per $1,000 granted.
  *   *Note:* The Consultant converts outcomes (lives saved, income gained) into a dollar equivalent using standard benchmarks (e.g., Value of Statistical Life, income multiplier), minus costs.
  *   **PO Task:** Check the *assumptions*, not the math. Are the baseline rates credible? Is the "fragility check" (sensitivity analysis) attached?
  *   **Output:** A single number: **$NQV**. (Can be negative).
  *   **Uncertainty Flag:** If the Consultant cannot produce a range tighter than 0 to Infinity (e.g., no comparison group), mark Q-Ledger as **"Speculative."**
  *   **Critique Note:** This gate privileges what is countable. We accept this bias but cap its power via Gate 3.

  ### Gate 3: The Structural Ledger (S-Ledger) (45 Minutes)
  **Owner:** PO.
  **Input:** Proposal narrative, stakeholder interviews (if available).
  **Metric:** **Structural Score (SS)** from 0 to 10.
  **Scoring Rubric (Sum of 5 criteria, 0-2 points each):**
  1.  **Power Shift:** Does this move decision-making authority to beneficiaries? (2=Yes, 1=Consulted, 0=No).
  2.  **Systemic Constraint:** Does this address a root cause (policy, market failure) rather than a symptom? (2=Root, 1=Mixed, 0=Symptom).
  3.  **Dignity/Agency:** Does the intervention treat recipients as agents or patients? (2=Agents, 1=Mixed, 0=Patients).
  4.  **Durability:** Do benefits persist after funding ends without ongoing subsidy? (2=Yes, 1=Unclear, 0=No).
  5.  **Spillover:** Does this create positive externalities for non-recipients (e.g., policy precedent)? (2=High, 1=Low, 0=None).
  *   **Judgment Call Alert:** Scoring "Dignity" is subjective. The PO is making a moral judgment here. To reduce bias, the PO must cite one specific sentence in the proposal that justifies the score.
  *   **Output:** An integer **SS** (0-10).

  ### Gate 4: The Synthesis & Rank (15 Minutes)
  **Owner:** PO.
  **Mechanism:** Apply the Board's **Structural Shadow Price (SSP)**.
  **Formula:** **Total Value (TV) = ($NQV) + (SS × SSP)**
  *   *Example:* If NQV is -$10,000 (net cost) but SS is 8, and SSP is $50,000. TV = -$10,000 + $400,000 = +$390,000.
  *   **Threshold:** If **TV > 0**, the proposal passes to the Board. If **TV < 0**, the proposal is rejected.
  *   **Ranking:** Survivors are ranked by TV per $1,000 granted.
  *   **Critique Note:** This forces a trade-off. It admits that structural work is "more expensive" in immediate outcomes but buys it at a fixed price.

  ### Gate 5: The Board Handoff (15 Minutes)
  **Owner:** PO.
  **Trigger:** All grants >$250k *must* go to Board.
  **Condition:** If the proposal passes Gate 4 but relies heavily on the S-Ledger (i.e., NQV is negative or "Speculative"), the PO must flag it as **"Value-Dependent."**
  *   **Memo Requirement:** "This grant passes only because the Board's SSP values structural change at $X. If the Board believes structural change is worth less this year, this grant fails."
  *   **Action:** Board votes. They may not adjust the grant amount without re-running Gate 4.

  ---

  ## Part 3: Application to Live Proposals

  *Assumptions for this exercise:*
  *   **Board SSP:** $50,000 per Structural Point.
  *   **Benchmark:** A "passing" grant usually needs a positive Total Value.

  ### Proposal 1: Unconditional Cash Transfer ($2M Renewal)
  *   **Gate 1 (Counterfactual):** **Pass.** Recipients would not receive this specific liquidity without the grant.
  *   **Gate 2 (Q-Ledger):** **$150,000 NQV per $1k.** (High confidence, RCT evidence, fragility check passed).
      *   *Consultant Note:* "Direct income boost is immediate and measurable."
  *   **Gate 3 (S-Ledger):** **Score 3/10.**
      *   Power Shift: 0 (Recipients get money, not control of program).
      *   Systemic: 0 (Does not change why they are poor).
      *   Dignity: 2 (Unconditional respects agency).
      *   Durability: 1 (One-time boost).
      *   Spillover: 0.
  *   **Gate 4 (Synthesis):**
      *   TV = $150,000 + (3 × $50,000) = **$300,000.**
      *   **Result:** **PASS.** (High Q-score carries the low S-score).
  *   **Gate 5 (Board):** **Refer.** ($2M > $250k). Flag: "Evidence Strong, Structural Weak."

  ### Proposal 2: Land-Rights Legal Empowerment ($600k)
  *   **Gate 1 (Counterfactual):** **Pass.** Legal aid is unavailable otherwise.
  *   **Gate 2 (Q-Ledger):** **"Speculative."** No comparison group. Consultant estimates wide range: -$50k to +$200k NQV per $1k.
      *   *Procedure Rule:* When "Speculative," use the *conservative* estimate for calculation. Use -$50k.
  *   **Gate 3 (S-Ledger):** **Score 9/10.**
      *   Power Shift: 2 (Communities negotiate with officials).
      *   Systemic: 2 (Changes district behavior/policy).
      *   Dignity: 2 (Rights-based).
      *   Durability: 2 (Land title is permanent).
      *   Spillover: 1 (Precedent for other districts).
  *   **Gate 4 (Synthesis):**
      *   TV = -$50,000 + (9 × $50,000) = **+$400,000.**
      *   **Result:** **PASS.** (High S-score rescues the weak Q-score).
  *   **Gate 5 (Board):** **Refer.** ($600k > $250k). Flag: "Value-Dependent. Requires Board to stand by SSP."

  ### Proposal 3: Earning-to-Give Fellowship ($900k)
  *   **Gate 1 (Counterfactual):** **Pass.** (Arguable, but assume fellows wouldn't donate as much otherwise).
  *   **Gate 2 (Q-Ledger):** **$80,000 NQV per $1k.** (Based on projected donations minus stipend costs).
      *   *Consultant Note:* "Dependent on finance sector stability and fellow retention."
  *   **Gate 3 (S-Ledger):** **Score 2/10.**
      *   Power Shift: 0 (Reinforces existing financial power structures).
      *   Systemic: 0 (Does not change market rules).
      *   Dignity: 1 (Elite pathway).
      *   Durability: 1 (Donations stop if income stops).
      *   Spillover: 0.
  *   **Gate 4 (Synthesis):**
      *   TV = $80,000 + (2 × $50,000) = **$180,000.**
      *   **Result:** **PASS.** (But ranked lower than Cash and Land Rights per dollar).
  *   **Gate 5 (Board):** **Refer.** ($900k > $250k). Flag: "Championed by Board Members. Procedure confirms positive value, but low structural score."

  ---

  ## Part 4: Hard Truths & Required Changes

  ### 1. The "No" Decision
  **Current Status:** If you are currently funding the **Land-Rights (Proposal 2)** group, this procedure validates them *only if* the Board maintains the $50,000 SSP.
  **The Risk:** If the Board feels the SSP is too high, Proposal 2 fails immediately because its Q-Ledger is "Speculative/Negative."
  **What Must Change:** To ensure Proposal 2 passes without relying on the SSP, the grantee must **invest in monitoring.** They need to fund a quasi-experimental design or a rigorous longitudinal cohort study. Without a credible comparison group, the Q-Ledger will always be "Speculative," making them perpetually dependent on the Board's mood regarding structural work.

  ### 2. The Board Politics (Proposal 3)
  The procedure exposes the **Earning-to-Give Fellowship** as structurally weak. Two board members champion this.
  **The Conflict:** The procedure says this is a "buy" on financial metrics, but a "sell" on structural metrics.
  **The Fix:** If the Board wants to fund this *despite* the low Structural Score, they must **raise the SSP for next year** (admitting they value elite philanthropy pipelines as structural change) OR acknowledge they are overruling the procedure. The procedure forces them to admit they are prioritizing Q-Ledger over S-Ledger, which may conflict with their public mission on economic *opportunity* vs. economic *charity*.

  ### 3. Where the Procedure Systematically Fails
  *   **The "Black Swan" Problem:** This procedure favors linear theories of change. It will systematically reject high-risk, high-reward bets (e.g., funding a nascent social movement) because the Q-Ledger will be negative and the S-Ledger cannot score "potential" high enough to offset it.
  *   **The "Collaboration" Blindspot:** If five foundations fund a policy change together, the Q-Ledger attributes zero value to each (additionality fails at Gate 1). This procedure punishes collaboration.
  *   **The "Dignity" Illusion:** Scoring Dignity (Gate 3) creates a false precision. A PO checking a box for "Agency" is not measuring reality.

  ### 4. When the Program Officer Should Overrule
  The PO must overrule the procedure in two specific cases:
  1.  **The "Learning" Exception:** If a proposal fails Gate 4 but offers critical data that will improve the Q-Ledger for *future* grants (e.g., piloting a new metric), the PO should flag it as "R&D" and bypass the TV threshold.
  2.  **The "Relationship" Exception:** If rejecting a grant (especially Proposal 2) would destroy a decade-long partnership with a key local actor, the PO should flag this as "Portfolio Risk." The procedure treats grants as transactions; the foundation operates in a relationship ecosystem.

  ## Part 5: Dropped Distinctions (For Usability)
  To make this runnable in 2 hours, I have deliberately dropped the following nuances from the Effective Altruism and Structural Critiques:
  1.  **Moral Weight of Different Lives:** The Q-Ledger treats a dollar of income gain in Country A the same as Country B (adjusted for PPP). It does not account for the "priority of the poorest" beyond the baseline metric.
  2.  **Integrity of the S-Ledger:** I have allowed "Dignity" to be scored 0-2. Philosophically, dignity is binary or infinite, not scalable. I have commodified it to make the math work.
  3.  **Time Horizon:** The procedure does not discount the future differently for Q vs. S. It assumes the Board's SSP accounts for the fact that structural change takes longer.

  **Final Instruction to Staff:** This procedure is not a truth machine. It is a *consistency machine*. It ensures that if we fund a cash transfer for its numbers, and a land rights group for its values, we are doing so at a consistent exchange rate, rather than based on who wrote the best memo.
