answer: |-
  Section 1: Framing and theoretical purpose

  This specification targets normative ethics and institutional policy evaluation, specifically for bodies allocating resources between harm reduction and welfare enhancement. The theory must guide decisions where severe suffering coexists with aggregate pleasure gains. Non-negotiable desiderata include internal logical consistency, action-guidance capacity, and interpersonal comparability; without these, the framework fails as a decision procedure. Negotiable preferences include the specific height of the suffering threshold and the degree of temporal discounting, as these depend on empirical contexts rather than structural validity. The primary purpose is to resolve the conflict between intuitive priority for suffering victims and the economic necessity of a unified welfare metric for cost-benefit analysis. Adequacy requires that the theory avoids paralysis in trade-off scenarios while respecting the moral urgency of extreme pain. Consequently, the framework must function within population ethics without triggering repugnant conclusions, ensuring that the lexical constraint does not invalidate long-term planning where minor suffering prevents catastrophic future pain.

  Section 2: The desiderata list

  1.  **Metric Unicity:** (a) The theory must map pleasure and pain onto a single cardinal scale. (b) Failure here prevents cost-benefit analysis across diverse policy domains. (c) Non-negotiable.
  2.  **Threshold Continuity:** (a) Welfare values must not jump discontinuously at the suffering boundary. (b) Discontinuities create perverse incentives to hover just above the threshold. (c) Non-negotiable.
  3.  **Lexical Dominance:** (a) Below the threshold, any reduction in suffering must outweigh any gain in pleasure. (b) Failure violates the core negative utilitarian intuition driving the model. (c) Non-negotiable.
  4.  **Interpersonal Cardinality:** (a) Units of suffering must be comparable across different agents. (b) Without this, aggregation across populations is impossible. (c) Non-negotiable.
  5.  **Temporal Integration:** (a) The model must weigh duration against intensity consistently. (b) Failure leads to incorrect valuations of chronic versus acute conditions. (c) Negotiable.
  6.  **Structural Accommodation:** (a) This addresses structural incommensurability, where pain disintegrates agency while pleasure reinforces it. (b) Ignoring this collapses distinct phenomenological states into mere hedonic tones, losing normative nuance. (c) Non-negotiable. The theory accommodates this by treating agency-disintegration as a multiplier on the pain metric rather than a separate quality, preserving unicity while acknowledging structural difference.
  7.  **Non-Exploitation:** (a) No individual should be sacrificed solely to increase aggregate pleasure above the threshold. (b) Failure permits sadistic utilitarianism. (c) Non-negotiable.
  8.  **Decidability:** (a) The theory must yield a determinate choice in all conflict cases. (b) Indecision renders the ethics practically useless. (c) Non-negotiable.

  Section 3: Joint unsatisfiability and trade-offs

  A cluster of these desiderata is jointly unsatisfiable under standard decision theory. Specifically, Metric Unicity (1), Threshold Continuity (2), and Lexical Dominance (3) cannot coexist. Lexical Dominance implies a lexicographic ordering where no amount of pleasure compensates for suffering below the threshold. This violates the Continuity Axiom required for a single cardinal metric (Metric Unicity). If a single metric exists, there is always some quantity of pleasure that offsets a unit of pain, negating lexical priority. If lexical priority holds, the metric is effectively broken into two incommensurable regions.

  This conflict mirrors the impossibility of representing lexicographic preferences with a continuous utility function. To satisfy the theory's definition, one must sacrifice strict Lexical Dominance, replacing it with extreme weighting (prioritarianism), or sacrifice Metric Unicity, accepting two distinct metrics. If strict lexicality is retained, Decidability fails in edge cases where suffering is below the threshold but pleasure gains are infinite. The precise trade-off is between the moral intuition of absolute suffering priority and the mathematical requirement for a continuous, single-dimensional welfare function. You cannot have infinite marginal disutility and finite substitutability simultaneously.

  Section 4: Brief scoring against main contenders

  Pure Lexical Negative Utilitarianism satisfies Lexical Dominance and Non-Exploitation but fails Metric Unicity and Decidability (due to paralysis in mixed cases). It treats pain and pleasure as fundamentally different kinds, violating the commensurability requirement. Standard Cardinal Utilitarianism satisfies Metric Unicity, Continuity, and Decidability but fails Lexical Dominance and Non-Exploitation, as it allows severe suffering to be outweighed by trivial pleasures if the population is large enough. It lacks the threshold mechanism entirely.

  The Two-Tier Threshold Model performs best on Lexical Dominance and Non-Exploitation but typically fails Threshold Continuity. By switching rules at the boundary, it creates discontinuities that violate Metric Unicity across the whole range. It often treats the regions above and below the threshold as separate ethical regimes, undermining the commitment to full commensurability. None of the contenders fully satisfy the joint requirement of lexical priority within a unified cardinal metric, confirming the tension identified in Section 3. The proposed hybrid theory scores higher on intuition but lower on formal coherence than standard utilitarianism.

  Section 5: Epistemic note

  I am highly confident in the identification of the formal conflict between lexicality and continuity in Section 3, as this is a established result in representation theorems. I am least sure about Desideratum 6 (Structural Accommodation). It is unclear whether modeling agency-disintegration as a multiplier truly preserves the phenomenological distinction without implicitly reintroducing a second metric. This specific mechanism risks collapsing into a qualitative distinction disguised as a quantitative adjustment, which would violate the core commitment to Metric Unicity.
