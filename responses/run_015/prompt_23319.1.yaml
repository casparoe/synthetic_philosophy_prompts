prompt: |-
  I've been going down a rabbit hole on Kelly betting and what people in the rationalist community call "geometric rationality," and I'm stuck on a point that I'm pretty sure is either a real distinction or a massive non-sequitur, and I can't tell which. I keep coming across this claim, especially in the ergodicity stuff and in some of the decision theory posts, that "Kelly betting is not a utility function" or that you "shouldn't interpret Kelly as having log utility." But this just seems incoherant to me, and I've been banging my head against it for a week now. The whole derivation is that the Kelly fraction is the one that maximizes the expected log of your wealth, i.e. the expected value of log(W). But "maximizing the expected value of log(W)" is literally the definition of maximizing expected utility with a log utility function U(W) = log(W). So when someone says "Kelly is not a utility function," they're either using "utility function" in some weird technical sense that I don't get, or they're just being pedantic and confusing people.

  I've tried to steelman the "it's not a utility function" crowd, and my best guess is that they're making a distinction between "the strategy that maximizes the long-run growth rate" and "the preference that justifies it," but I honestly can't see how that distinction does any work, because in the i.i.d. infinite-horizon case they give exactly the same answer, so the distinction seems to be purely verbal. I was discussing this with a friend who's into the ergodicity economics stuff, and he kept saying "you're confusing the ensemble average with the time average," but I didn't actually understand what he meant by that, and I'm not sure it's even relevant here. Can someone who actually gets this explain whether there's a real, substantive difference between "Kelly = maximize expected log wealth = log utility" and "Kelly = maximize the long-run growth rate = geometric rationality," or whether the "not a utility function" claim is just a red herring that people repeat without thinking? If there is a real difference, where exactly does it show up -- is it only in the finite-horizon or estimation-uncertainty cases, or is it fundamental?
