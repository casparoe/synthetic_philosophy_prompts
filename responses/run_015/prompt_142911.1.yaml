answer: |-
  This is an exceptionally clear map of the territory. You have reconstructed the philosophical landscape better than many undergraduates who spend a semester on it. Your taxonomy is robust enough to work with directly. I will not rewrite it; I will annotate it, stress-test it against your requirements, and then plug Popper into the slots you have built.

  Here is the menu, corrected and verdicted.

  ### The Menu of Readings

  **1. A complaint about a definition**
  *   **The Claim:** If "fitness" is defined strictly as "actual survival," then "the fittest survive" means "those who survive, survive."
  *   **Verdict:** **True but Trivial.**
  *   **Correction:** Professional biology abandoned this definition decades ago. If a biologist uses "fitness" today, they almost never mean "actual outcome." They mean "probabilistic tendency." If someone uses this reading to attack modern biology, they are attacking a straw man, but they are correctly identifying that *if* you define terms this way, the statement is empty.
  *   **Falsification Condition:** None. This is a linguistic rule, not a claim about the world. You cannot observe your way out of a definition; you must stipulate a new one.

  **2. The propensity reading**
  *   **The Claim:** Fitness is a probabilistic disposition (like a loaded die). A trait *tends* to increase survival, but might fail in a specific instance due to chance.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Correction:** This saves the theory from Reading 1. It turns the claim into a statistical prediction.
  *   **Falsification Condition:** You need a large sample size over many generations. If organisms with the "high fitness" trait consistently reproduce *less* than those without it, across varied environments, and this cannot be explained by trade-offs (e.g., they live longer but have fewer offspring), the propensity claim fails. Specifically: if the correlation between the trait and reproductive success is zero or negative over the long run.

  **3. The contrast-class reading (Your invention)**
  *   **The Claim:** Selection is only meaningful if it distinguishes itself from random drift. The claim is that trait frequency changes are *non-random* with respect to the trait.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Correction:** This is very sharp. In philosophy of biology, this is often called the "null model" problem. Selection is a force; drift is the absence of force (or the background noise). To claim selection is operating is to claim the signal is louder than the noise.
  *   **Falsification Condition:** If the pattern of trait inheritance in a population matches a computer simulation of pure random sampling (a random walk) perfectly, then the "selection" claim fails. You observe the data, run the "drift only" model, and if they match, selection is not doing the work.

  **4. The extrapolation reading**
  *   **The Claim:** The real weight of the theory is not on single traits, but on the claim that small, cumulative selective steps can build complex functional design (eyes, wings) without a designer.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Correction:** This addresses the "Just-So Story" worry. It moves the debate from "why did this bird have this beak?" to "can this mechanism build a bird?"
  *   **Falsification Condition:** The discovery of "irreducible complexity" that cannot be bridged by intermediate steps. If you find a biological machine where removing any single part stops the function, and there is no viable evolutionary path where the parts had different functions previously, the extrapolation claim fails. (Note: Biologists argue this hasn't been found, but this is what would falsify it).

  **5. The strong reading**
  *   **The Claim:** The theory is immune to evidence because practitioners can attribute *any* outcome to either selection or drift post-hoc.
  *   **Verdict:** **Substantive but False.**
  *   **Correction:** It is substantive because it makes a claim about the practice of biology (that it is unfalsifiable). It is false because biologists *do* rule out hypotheses. However, it highlights a real risk: "pan-adaptationism" (assuming every trait is selected for).
  *   **Falsification Condition:** To falsify *this* reading (i.e., to prove the theory *is* scientific), you need to show a case where biologists said, "If we see X, selection is false," and then they saw X and abandoned the selection hypothesis. This happens routinely in specific cases (e.g., a trait is linked to a harmful gene, so it persists despite being bad; selection didn't remove it).

  ---

  ### The Toy Cases

  Here is how your menu handles the two scenarios you proposed.

  **Case A: The Lottery Population**
  *   **Setup:** Heritable variation exists (Red vs. Blue). Survival is decided by a random lottery (coin flip), unrelated to color.
  *   **Reading 1:** Irrelevant. Definitions don't care about lotteries.
  *   **Reading 2:** **Falsified.** If Red and Blue have equal propensities, but the theory claimed Red had higher fitness, the theory is wrong. If the theory claims "fitness is determined by the environment," and the environment is a lottery, then fitness propensities are equal.
  *   **Reading 3:** **Confirmed (as Drift).** The data will match the null model. A good evolutionary biologist looks at this and says, "This is drift, not selection." The theory survives by correctly identifying the absence of selection.
  *   **Reading 4:** **Stalled.** No complex design will emerge. The theory predicts this.
  *   **Reading 5:** **The Danger Zone.** A bad adaptationist might say, "Red survived more in generation 4; Red must be better camouflaged." This confirms the worry that the framework can be abused to tell stories about noise.

  **Case B: The Non-Heritable Population**
  *   **Setup:** Survival differs (Red survives better than Blue), but color is not passed to offspring (offspring color is random).
  *   **Reading 1:** Irrelevant.
  *   **Reading 2:** **Not Applicable.** Fitness requires heritability. If there is no heritability, there is no evolution. The theory predicts no change in the population makeup over time.
  *   **Reading 3:** **Null Result.** Selection requires heritability. If you test for selection and find no heritability, the selection hypothesis is rejected.
  *   **Reading 4:** **Falsified (if claimed otherwise).** If someone claimed this mechanism could build complex design in this population, they are wrong. The theory requires heritability for cumulative design.
  *   **Reading 5:** **Abused.** A bad practitioner might say, "Red survived, so Red is fitter," ignoring that Red babies are born Blue. This shows the importance of the heritability constraint.

  ---

  ### The Forum Usage Analysis

  You asked which reading the forum posters *intend*, and which reading they *need* to get their three conclusions.

  **1. To show evolutionary biology fails falsifiability (Not Science):**
  *   **They use:** Reading 1 (Tautology).
  *   **They need:** Reading 5 (Unfalsifiable).
  *   **The Gap:** Reading 1 is a logical error (biologists don't define fitness that way). Reading 5 is a methodological critique. They use the easy logical error to try to prove the hard methodological point. It doesn't work. Reading 2 and 3 show it *is* falsifiable.

  **2. To show citing natural selection explains nothing:**
  *   **They use:** Reading 1 (Empty definition).
  *   **They need:** Reading 5 (Post-hoc storytelling).
  *   **The Gap:** If fitness is a propensity (Reading 2), it *does* explain something (causal power). To show it explains nothing, they need to prove that biologists never test the propensities and just make up stories (Reading 5).

  **3. To rebut the objection that adaptationists cook up stories:**
  *   **They use:** Reading 1 (It's not a story, it's a law).
  *   **They need:** Reading 3 (We have a null model).
  *   **The Gap:** Saying "it's not a tautology" doesn't stop someone from cooking up a story. Showing that "we compare against a drift model" (Reading 3) is the only way to stop the "Just-So" objection.

  **Summary of Forum Logic:** The posters are almost always using **Reading 1** (the tautology charge) because it is catchy and sounds like a logical "gotcha." However, Reading 1 cannot do the work they want it to do. To get the conclusions they want, they would need to argue **Reading 5** (that the practice is sloppy) or **Reading 4** (that the mechanism can't build complexity). They use the cheap argument to fight the expensive battle.

  ---

  ### Reconstructing Popper

  Your rough account of Popper is correct. He did classify Darwinism as a "metaphysical research programme" initially, and later retracted that, saying it was testable. Here is how that fits your menu.

  **1. Which reading was Popper's actual worry?**
  Popper was not worried about **Reading 1** (Definition). He understood definitions are stipulations.
  Popper was worried about **Reading 5** (Unfalsifiability) and **Reading 4** (Extrapolation).

  His specific concern was this: Natural Selection says "Organisms adapt to their environment." But if the environment changes, they adapt to that. If they go extinct, they "failed to adapt." It seemed to him that the theory could accommodate *any* outcome. If the theory can explain a species surviving *and* a species dying, does it actually predict anything?

  This aligns with your **Reading 5**. He feared that "fitness" was being measured only by survival (Reading 1), which made the theory a circular description of history rather than a prediction of the future.

  **2. How can a "Metaphysical Research Programme" be scientifically valuable?**
  In Popper's framework, this is not an insult.
  *   **Scientific Theory:** Makes risky predictions that can be proven false (e.g., "All swans are white").
  *   **Metaphysical Research Programme:** A framework that generates scientific theories but is not itself easily falsifiable in one go.

  Popper viewed early Darwinism as a framework that *inspired* testable hypotheses, even if the core principle ("the fittest survive") was too vague to test directly. It was valuable because it told scientists *where to look* (look for adaptations, look for environmental pressures), even if the core statement wasn't yet precise enough to be "science" in his strict sense. It was a productive heuristic.

  **3. Does his change of mind require the charge to be false under every reading?**
  No. This is the crucial nuance.
  Popper changed his mind because he realized that **Reading 2 (Propensity)** and **Reading 3 (Contrast-Class)** allow for specific, testable hypotheses.

  He did not need to decide that "Natural Selection is true." He only needed to decide that "Natural Selection generates testable claims."
  *   **Old Popper:** "The statement 'the fittest survive' is too vague to test. It fits all outcomes." (Reading 5).
  *   **New Popper:** "We can formulate specific claims like 'In this environment, trait X confers a higher propensity to reproduce.' We can then test that." (Reading 2).

  He abandoned the idea that the *general principle* was untestable, by recognizing that the *specific applications* are testable. He realized that if you define fitness independently of survival (e.g., by measuring energy efficiency, camouflage quality, or mating success *before* seeing who survives), you can make a prediction, and you can be wrong.

  **Verdict on Popper's Shift:**
  He moved from thinking the theory was stuck at **Reading 5** (Unfalsifiable) to realizing that in practice, it operates at **Reading 2 and 3** (Falsifiable).
  He did not need to abandon **Reading 4** (Extrapolation). In fact, Popper remained skeptical about how much complex design could be explained by selection alone until the end of his life. He could coherently say: "The mechanism is testable (Reading 2), but I am still not convinced it explains everything (Reading 4)."

  **Summary for your logistics mind:**
  Think of Natural Selection not as a single shipment, but as a routing protocol.
  *   **Reading 1** says the tracking number is just the delivery date (Circular).
  *   **Reading 5** says the protocol claims it can deliver to any address, even ones that don't exist (Unfalsifiable).
  *   **Popper's Early View:** "This protocol is too vague to verify. It's a management philosophy, not a logistics guarantee."
  *   **Popper's Late View:** "Actually, if we specify the address and the vehicle capacity (Reading 2 & 3), we can test if the protocol works. It is a logistics guarantee."
  *   **The Forum Posters:** Are still arguing that the tracking number is circular (Reading 1) to prove the protocol is broken (Reading 5), ignoring that the drivers are actually running tests (Reading 2).

  Your taxonomy holds up. The confusion in the wild comes from people using Reading 1 to do the heavy lifting of Reading 5. Popper's journey was realizing that Reading 2 makes Reading 5 false.
