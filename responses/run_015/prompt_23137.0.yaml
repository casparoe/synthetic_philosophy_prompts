answer: |-
  This is a classic debate in the meta-ethics of promising, essentially replaying the tension between **Practice Consequentialism/Conventionalism** (Hume, Rawls) and **Voluntarism/Will Theory** (Kant, Shiffrin, Wallace). Since you're at the PhD level, I'll skip the introductory definitions and dive straight into the dialectic.

  Neither is "winning" in the sense of having a knock-out theory, but they are winning and losing on specific *claims*. Here is the move-by-move adjudication, followed by what both are missing.

  ### Move 1: The Source of Normativity (Practice vs. Act)
  *   **Nadia's Claim:** The meaning and force of "I promise" are constitutive of a social practice (like money).
  *   **Owen's Claim:** The obligation arises from the individual act of will; breaking a promise is morally distinct from breaking a game rule.
  *   **Adjudication:** **Nadia is right about semantics; Owen is right about phenomenology.**
      *   Nadia is correct that the *concept* of a promise is unintelligible without a background practice. As Searle and Rawls argued, you cannot make a promise in a state of nature where the concept doesn't exist; you'd just be making a prediction or a statement of intent. The *institution* of promising is undeniably conventional.
      *   However, Owen is correct that the *moral experience* of promising feels distinct from constitutive rules (like chess). If you move a bishop diagonally in chess, you haven't done something *immoral*, you've just stopped playing chess. If you break a promise, you've wronged a person. Nadia's reduction of promissory obligation to "honoring a convention" struggles to explain the *moral* sting of betrayal, which Owen captures.

  ### Move 2: The "No Convention" Thought Experiment
  *   **Nadia's Claim:** In a context with no practice, a promise wouldn't bind.
  *   **Owen's Claim:** The obligation sticks personally even without social sanction or convention.
  *   **Adjudication:** **Nadia is conceptually right; Owen is morally right.**
      *   Nadia wins on logical coherence. If there is literally no convention of promising (no shared understanding that uttering "I promise" creates an obligation), then uttering the words cannot trigger the obligation. It would be like trying to score a goal in a world without the game of soccer.
      *   Owen wins on moral intuition. Most people feel that if they sincerely induce an expectation of fidelity in another person, they incur an obligation, even if they are on a desert island with no prior "promise culture." This suggests the obligation might stem from the *relationship* or the *harm of disappointment* rather than the abstract practice. Nadia's view risks making promise-breaking only wrong because it's "free-riding," which feels too thin.

  ### Move 3: Internalization vs. Primitive Power
  *   **Nadia's Claim:** The feeling of binding is just internalized convention.
  *   **Owen's Claim:** Self-binding is a primitive normative power; we don't need to reduce it.
  *   **Adjudication:** **Nadia offers the better explanation; Owen posits a mystery.**
      *   From a naturalistic or psychological standpoint, Nadia is on firmer ground. We learn to feel bound by promises through socialization.
      *   Owen's claim that self-binding is a "primitive moral power" is philosophically costly. It stops explanation prematurely. As Nadia hints, asserting a "power to create obligations out of thin air" requires an explanation of *why* the universe (or morality) allows agents to alter their normative landscape simply by speaking. Without a background norm that says "you ought to do what you said you would," the act of willing is inert. Owen is asserting the existence of a normative power without explaining its source.

  ### Move 4: The Circularity Objection vs. The Exploitation Objection
  *   **Nadia's Objection (Circularity):** Why should I care about binding myself? Self-binding needs an independent reason (convention/interest).
  *   **Owen's Objection (Exploitation):** If the practice is exploitative, the convention view says I have no reason to keep the promise, which is wrong.
  *   **Adjudication:** **Nadia wins the logical point; Owen wins the moral point.**
      *   **On Circularity:** Nadia is correct. Voluntarism (Owen's view) faces the "Normative Gap." Saying "I bind myself" presupposes a norm that says "self-binding is binding." If that norm comes from the will, it's circular. If it comes from outside the will, the will isn't the ultimate source. Nadia correctly identifies that the Will Theory cannot stand alone; it needs a background principle of Fidelity.
      *   **On Exploitation:** Owen lands a heavy blow here. If the practice of promising in a specific context is corrupt (e.g., a thieves' guild, or a coercive contract), a crude Practice View suggests the obligation dissolves because the practice isn't serving the "general interest." But intuitively, even in a corrupt context, if I give my word to a vulnerable person, I may still owe them fidelity *as a person*, regardless of the social utility of the practice. Owen is right that the obligation often transcends the utility of the convention.

  ---

  ### What Both Are Missing

  Since you are looking to move the discussion forward, here are three elements both Nadia and Owen are overlooking. These are likely the keys to dissolving the stalemate.

  #### 1. The Expectation/Reliance View (The Scanlonian Middle Ground)
  Both are arguing about the *source* of the obligation (Practice vs. Will). They are both ignoring the *harm* involved.
  *   **The Missing Piece:** T.M. Scanlon's *Principle of Fidelity*. The obligation doesn't come primarily from the convention (Nadia) or the magic of the will (Owen), but from the **expectations intentionally induced in the promisee.**
  *   **Why it matters:** If I promise you, I invite you to rely on me. If I break the promise, I harm you by violating that reliance. This explains Owen's intuition (it's personal/moral, not just a game rule) without needing Owen's "primitive power." It also explains Nadia's intuition (we need a shared understanding to induce expectations) without reducing it to mere social utility.
  *   **Critique for the Group:** Ask them: "Is the wrongness of breaking a promise located in the damage to the *practice*, the violation of *autonomy*, or the harm to the *promisee*?"

  #### 2. The Distinction Between *Creating* and *Validating*
  Nadia and Owen are conflating what *creates* the obligation with what *validates* it.
  *   **The Missing Piece:** A hybrid view. The **act of will** (Owen) is the *trigger* that creates the specific obligation. The **practice/norm** (Nadia) is the *background condition* that makes that trigger effective.
  *   **Why it matters:** This solves the Circularity problem. We don't need to choose one. We can say: "The practice provides the normative framework (the rule that 'promises must be kept'), but the individual act selects which specific duty comes into force."
  *   **Critique for the Group:** Nadia is right that the *power* to promise is conventional. Owen is right that the *exercise* of that power is voluntary. They are talking past each other about different stages of the normative mechanics.

  #### 3. The Content Constraint (The "Murder" Problem)
  Neither of them addressed the *content* of the promise.
  *   **The Missing Piece:** Promissory obligation is not absolute. If I promise to murder someone, Nadia's convention view might struggle (if the convention is "keep promises"), and Owen's will view definitely struggles (I willed it, so am I bound?).
  *   **Why it matters:** This shows that the obligation to keep a promise is subordinate to independent moral reasons. This undermines Owen's "primitive power" claim (if it were truly primitive, it would bind even in immoral cases) and complicates Nadia's "general interest" claim (sometimes keeping a promise serves the practice but is morally wrong).
  *   **Critique for the Group:** Ask Owen: "If the self-binding power is primitive, does it bind you to do immoral acts?" Ask Nadia: "If the practice is generally useful but this specific promise is harmful, does the obligation hold?"

  ### Suggested Reading to Break the Deadlock
  If you want to assign reading for the next session to resolve this:
  1.  **For Nadia:** John Rawls, "Two Concepts of Rules" (to refine her practice view beyond simple Humean utility).
  2.  **For Owen:** Seana Shiffrin, "Promising, Intimate Relationships, and Conventional Practices" (defends the Will Theory but grounds it in moral status, not primitive magic).
  3.  **The Synthesis:** T.M. Scanlon, *What We Owe to Each Other*, Chapter 7 (The Expectation View).
  4.  **The Critique:** Niko Kolodny & R. Jay Wallace, "Promises and Practices Revisited" (excellent paper that critiques both Practice and Will views).

  **Summary Verdict:** Nadia has the better meta-ethical account of how the concept works; Owen has the better phenomenological account of why it feels binding. Nadia wins on the "Circularity" objection; Owen wins on the "Immoral Practice" objection. Both lose if they ignore the **harm to the promisee**.
