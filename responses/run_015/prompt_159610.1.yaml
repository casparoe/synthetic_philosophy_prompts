  **Physicist's Note**

  **The Events (Rest Frame $S_0$, $t=0$):**
  1.  **Star:** Supernova ignition in Andromeda ($x = 2.5 \times 10^6$ ly).
  2.  **Door:** Closing in London ($x = 0$).
  3.  **Hand:** Wave from Proxima Centauri habitat ($x = 4.2$ ly).
  4.  **Cup:** Spill on Mars Orbit Station ($x = 12$ light-minutes).
  5.  **Leaf:** Fall on exoplanet Kepler-186f ($x = 500$ ly).
  6.  **Stone:** Rest on Pluto ($x = 5.5$ light-hours).

  All events are simultaneous in $S_0$. Since $\Delta t = 0$ and $\Delta x > 0$ for all pairs, the interval $\Delta s^2 = \Delta x^2 - c^2 \Delta t^2$ is positive for every pair. They are all pairwise spacelike separated. No signal traveling at $c$ or slower could connect any two events; causality cannot fix their order.

  **The Observers (Stanzas 1–6):**
  Each stanza represents the temporal ordering of these events in a different inertial frame $S_n$, moving at velocity $v$ relative to $S_0$.
  *   **Stanza 1:** $v = 0$ (Rest frame). Order: 1-2-3-4-5-6.
  *   **Stanza 2:** $v \approx 0.5c$ towards Andromeda. The Lorentz transformation $t' = \gamma(t - vx/c^2)$ shifts distant events significantly. Stone (Pluto) and Star (Andromeda) swap relative to Rest.
  *   **Stanzas 3–6:** Varied velocities ($0.1c$ to $0.8c$) and vectors (towards/away from specific coordinates).
  *   **Verification:** The sestina permutation (123456 $\to$ 612345 $\to$ 561234...) ensures every pair of end-words appears in both orders (A-before-B and B-before-A) across the six stanzas. Because all events are spacelike separated, Special Relativity guarantees that for any pair (A, B), there exists a valid frame where A precedes B, and another where B precedes A. No stanza describes a physically impossible ordering.

  **Scale & Simultaneity:**
  This is not about light travel time (what observers *see*). It is about corrected simultaneity (what *is*). An observer in Stanza 2 calculates that the Stone sank *before* the Star ignited, after accounting for light delay. Another calculates the reverse. Neither calculation is wrong; "now" is a slice through the block, and the angle of that slice depends on speed. I chose interstellar distances so that relativistic speeds ($0.5c$) produce order swaps large enough to feel definitive, avoiding the nanosecond shifts of Earth-bound distances.

  **The Philosophical Leap:**
  The envoi argues for the "Block Universe" (eternalism): if reality were only the "present," and the present differs for each observer, then reality itself would depend on velocity. To avoid this contingency, the poem concludes that all events are equally real.
  *Objection:* A Presentist might argue that only one frame's "now" is metaphysically privileged (absolute simultaneity), even if physics cannot detect it. The poem assumes the Relativity Principle extends to ontology: if physics cannot distinguish the frames, reality shouldn't either. This is the Rietdijk-Putnam step, and it remains debated.
