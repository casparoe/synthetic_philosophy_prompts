  *(Self-Correction on the "Missing Piece"):* I need to be careful not to dismiss philosophy entirely. The "missing piece" is the *justification*. Fiction doesn't need to justify the choice logically, only emotionally/narratively. That suggests philosophy is looking for a map where fiction knows there is only terrain.

  9.  **Final Review against constraints:** No citations. No reading lists. Honest about where translation breaks.

