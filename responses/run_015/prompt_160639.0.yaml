  *   **Anti-reductionism true:** 0.55. (Live controversy; no consensus favors Reid/Burge over Hume/Fricker).
  *   **Acquisition objection fatal (if Reductionism):** 0.70. (Strong pressure, though indirect reductionist accounts exist).
