  **Settled vs. Live:**
  *   **Settled:** Testimony is a fundamental source of knowledge; hearers often gain justification via testimony.
  *   **Live:** The *structure* of that warrant. Whether warrant derives from background evidence (reductionism) or is presumptive/primitive (anti-reductionism) is unresolved. Do not treat the "principle of credibility" as established fact; it is the anti-reductionist's contested claim. Similarly, whether the "acquisition objection" successfully refutes reductionism remains live, with sophisticated indirect accounts competing against direct presumptions.
