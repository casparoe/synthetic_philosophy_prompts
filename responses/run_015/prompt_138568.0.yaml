answer: |-
  Here is the translation of the presentism dispute into evaluation harness and dataset audit vocabulary, followed by the residue report and the critique of your hypothesis.

  ### 1. Core Translation: The General Dispute

  **The Setup:**
  You have a legacy model $M_{old}$ (the historical figure) trained on a dataset $D_{old}$ with a reward model $R_{old}$ (the normative standards of their time). You are running an evaluation using a current reward model $R_{new}$ (current normative standards).

  **The Presentist Position:**
  "We are evaluating $M_{old}$ for *alignment* with $R_{new}$. It does not matter what $R_{old}$ was. The loss $L(M_{old}(x), R_{new})$ is high. Therefore, the model is misaligned. We are not doing forensics on the training run; we are auditing the output for current deployment safety. If the output violates $R_{new}$, it is a failure, regardless of why it was trained that way."

  **The Contextualist Position:**
  "You are introducing *objective function drift*. $M_{old}$ was optimized for $R_{old}$. Evaluating against $R_{new}$ measures the distance between $R_{old}$ and $R_{new}$, not the capability or optimization quality of $M_{old}$. This is an OOD (out-of-distribution) evaluation on the *loss landscape*, not the input data. A fair eval measures $M_{old}$ against the Pareto frontier available at training time, or measures how well $M_{old}$ minimized $L(\cdot, R_{old})$ given the constraints of $D_{old}$."

  **The Presentist Counter:**
  "$R_{old}$ was objectively flawed (e.g., rewarded suffering). We don't care about optimization stability relative to a broken reward function. We care about *ground truth* alignment, and we claim $R_{new}$ is closer to ground truth."

  **The Contextualist Counter:**
  "You have no access to 'ground truth' morality, only $R_{new}$. You are treating your current annotator pool as gold labels. This is training on your own outputs if you assume $R_{new}$ is the terminal value. You are conflating *capability* (could they do better?) with *alignment* (did they share our values?)."

  ---

  ### 2. General Residue Report

  **What Translated Cleanly:**
  *   **Objective Function Drift:** The core tension maps perfectly to evaluating a model on a loss function it was not trained to minimize.
  *   **OOD Generalization:** The presentist is demanding the model generalize morally to a new distribution of values; the contextualist is flagging this as invalid OOD testing.
  *   **Gold Label Assumption:** The presentist treats current norms as "ground truth"; the contextualist treats them as "noisy labels subject to drift."

  **What You Had to Fudge:**
  *   **The Status of the Reward Function:** In ML, $R$ is a design choice. In history, participants argue $R$ is a *discovery* (moral realism). Translating "moral truth" to "current reward model weights" flattens the claim that $R_{new}$ is *correct*, not just *different*.
  *   **Agency vs. Weights:** $M_{old}$ (human) could have theoretically updated their own weights via reasoning, whereas a frozen model cannot. The contextualist argument relies on the cost of weight updates (social suicide), which is hard to quantify as a "learning rate" constraint.

  **What Has No Expression (The Lost Signal):**
  *   **The Teleology of the Eval:** In ML, we eval to *deploy* or *iterate*. In history, we eval to *signal identity* or *construct a narrative*. The "score" isn't for the model (they're dead); it's for the audience (us). There is no analogue for "evaluating a dead model to define the identity of the engineering team."
  *   **Retributive vs. Functional Loss:** ML loss is functional (minimize error). Historical judgment often carries a retributive component (blame/praise) that has no gradient. You can't backprop through blame.

  ---

  ### 3. Analysis of the Three Moves

  #### Move 1: Label Presentism
  *Definition: Judging actions using current annotator pools, ignoring label drift.*

  *   **Clean Translation:** **Label Shift / Annotator Drift.** You are using a v2.0 annotator pool to label v1.0 data without calibration. The inter-annotator agreement between time $t_0$ and $t_1$ is low. You are treating the $t_1$ distribution as the ground truth.
  *   **The Fudge:** In ML, if annotator quality improves (e.g., better tools), we accept the new labels. In history, it's contested whether $t_1$ annotators are "higher quality" or just "different." The translation assumes "drift" implies noise, whereas presentists argue it implies "signal improvement."
  *   **The Breakdown:** **Normative Authority.** ML has no mechanism to say one annotator pool is *morally superior*, only more consistent or accurate relative to a spec. History argues the spec itself evolves toward truth. Your vocabulary treats the shift as statistical; the dispute treats it as teleological.

  #### Move 2: Option-set Presentism
  *Definition: Judging against options not in the action space or too costly to select.*

  *   **Clean Translation:** **Support of the Policy / Masked Tokens.** You are penalizing the model for not generating tokens that were masked out during training or had near-zero probability in $D_{old}$. Alternatively, you are penalizing high loss on actions that would have triggered a hard constraint (e.g., "social death" = termination of the run).
  *   **The Fudge:** **Conceptual Innovation.** In ML, the action space is fixed by architecture. In history, agents can *engineer new tokens* (invent new moral concepts). The contextualist says "the token didn't exist"; the presentist says "they should have engineered it." Your vocab handles fixed action spaces well, but poorly handles *architecture search* by the agent during inference.
  *   **The Breakdown:** **Counterfactual Cost.** You can calculate counterfactual loss in a sim. You cannot calculate the social cost of a moral innovator in 1790 without running the actual history. The "cost function" for social exclusion is non-stationary and opaque.

  #### Move 3: Corpus Presentism
  *Definition: The eval set is biased by survival and power dynamics.*

  *   **Clean Translation:** **Selection Bias / Survivorship Bias.** The eval set $E$ is not i.i.d. from the population $P$. It is filtered by a selection function $S$ (who wrote the history) that correlates with the target variable (who was powerful). You are evaluating on the "winner's log."
  *   **The Fudge:** **Adversarial Filtering.** In ML, selection bias is usually noise or convenience. In history, $S$ is *adversarial* (intentional obfuscation by powerful agents). It's not just bias; it's active obfuscation in the dataset.
  *   **The Breakdown:** **Recursive Canon Formation.** In ML, the eval set is static. In history, the *act of evaluating* changes the corpus (we teach the judged figures in schools, cementing their status). The eval harness modifies the test set for the next run. This is a feedback loop your static eval vocab doesn't capture.

  ---

  ### 4. Critique of Your Pet Hypothesis

  > *Hypothesis: "You can't evaluate against a target that doesn't exist, plus the recursion that the historian is an annotator who is himself inside the distribution shift, producing scores that feed back into the next round of labels."

  **Verdict:** You are 80% correct, but the missing 20% is where the actual fight lives.

  **Where you are right:**
  The "target that doesn't exist" is exactly **Objective Function Drift**. You cannot minimize loss against a function that wasn't defined in the training environment without incurring massive OOD penalty. The "historian as annotator inside the shift" is exactly **Label Shift with Feedback**. You have identified the statistical structure correctly.

  **Where you are wrong (The Defect vs. The Signal):**
  You suspect your vocabulary might be "imperialist and quietly deleting the interesting part." It is not imperialist, but it is **instrumentalist**.

  Your vocabulary assumes the goal of evaluation is **Accuracy** or **Alignment Optimization**.
  The historical dispute is often about **Coordination** and **Signaling**.

  *   **The Missing Piece:** When a presentist condemns a figure from 1790, they are not trying to score the model (the dead person). They are **updating the system prompt for the current generation**. They are using the eval to fine-tune *us*.
  *   **Why this breaks your model:** In ML, we separate Training Data from Eval Data. We don't use the eval set to update the model (data leakage). In historical discourse, the *judgment* is the training signal for the living audience. The "score" is a loss gradient for *society*, not the historical agent.

  **Is the dispute substantive?**
  Yes, but not about the past. It is a dispute about **how we construct the current Reward Model ($R_{new}$)**.
  *   **Contextualists** want to freeze $R_{new}$ to prevent reward hacking on virtue signaling (i.e., "look how much better we are than them"). They worry about **Goodhart's Law** on moral progress.
  *   **Presentists** want to use the past as **adversarial training data** to harden $R_{new}$ against regression. They worry about **catastrophic forgetting** of moral norms.

  **The Sub-Question You Should Be Looking At:**
  Stop asking "Is this eval fair to the model?" (The dead don't care).
  Start asking: **"What is the loss function of the *audience* being optimized by this judgment?"**

  If the judgment optimizes for *nuance and understanding*, it's contextualist.
  If the judgment optimizes for *boundary enforcement and group cohesion*, it's presentist.

  Your vocabulary deletes this because ML evals don't usually have a *sociological function* for the engineers running them. The "residue" isn't a defect in your framework; it's a feature of the domain you're mapping onto. History is not a static benchmark; it is a **training loop for the evaluators**.

  ### 5. Final Residue Summary

  1.  **Clean:** Label shift, objective function drift, selection bias, OOD generalization.
  2.  **Fudged:** Moral realism (is $R_{new}$ true or just new?), conceptual innovation (expanding action spaces).
  3.  **Lost:** The *purpose* of the eval. In ML, evals measure models. In history, evals train the evaluators. The "judgment" is a gradient update on the living, not a score for the dead.

  **Recommendation:**
  Your hypothesis holds for the *epistemic* validity of the claim (you can't score against a missing target). It fails on the *pragmatic* validity (the score isn't for the target). The fight isn't about whether the score is statistically valid; it's about whether we are allowed to use invalid scores to train the next generation. That is a **policy constraint on eval usage**, not a property of the eval itself.
