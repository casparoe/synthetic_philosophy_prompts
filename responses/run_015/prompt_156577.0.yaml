answer: |-
  ### Session Architecture (75 Minutes)

  **00–10: Bridge from Prior Knowledge (Defeat & Support)**
  *   **Activity:** Briefly recap standard evidential defeat. Use a trivial example (e.g., seeing a red wall vs. being told the lights are red).
  *   **Goal:** Establish that evidence can remove justification.
  *   **Dependency:** This grounds the new material in what they already know, preventing HOE from seeming like an entirely alien category initially.

  **10–30: The Carrying Case (Introducing the Distinction)**
  *   **Activity:** Present the case (see Case Selection below). Elicit the First-Order Evidence (FOE). Then introduce the Higher-Order Evidence (HOE).
  *   **Goal:** Distinguish HOE from FOE.
  *   **Dependency:** You cannot frame the akratic puzzle until they recognize the HOE is not merely negative FOE.

  **30–45: The Akratic Turn (From Evidence to Attitudes)**
  *   **Activity:** Shift language from "evidence" to "attitudes." Ask: "Given the HOE, what attitude should the agent take toward their *own belief*?"
  *   **Goal:** Define Epistemic Akrasia (believing *p* while believing one shouldn't believe *p*).
  *   **Dependency:** This depends on the Evidence framing. If they don't see the HOE as evidence, the verdict feels arbitrary. If you don't move to attitudes, the puzzle remains a simple weighing problem.

  **45–60: Intercepting Misconceptions (Guided Discussion)**
  *   **Activity:** Socratic questioning targeting the three specific misconceptions (see Mapping below).
  *   **Goal:** Prevent the "easy outs" that dissolve the puzzle.
  *   **Dependency:** This must happen *after* the akratic structure is defined, otherwise, students will reject the definition rather than grapple with the tension.

  **60–70: Normative Upshot (What to Do?)**
  *   **Activity:** Discuss the rational response. Does HOE require suspension of judgment? Or merely a reduction in confidence?
  *   **Goal:** Connect the abstract puzzle to epistemic practice.

  **70–75: Closing Question & Wrap**
  *   **Activity:** Pose the discriminating question (see below).
  *   **Goal:** Assess structural understanding.

  ---

  ### Case Selection and Evaluation

  **Verdict on Your Proposed Case:**
  Do **not** use the "Automated Diagnostic Auditor" (where reliability depends on the rarity of the condition) as the carrying case. It should come second, in a follow-up seminar, or be dropped entirely for this level.

  **Reasoning:**
  Your proposed case introduces a *dependency loop*: the weight of the HOE depends on the truth of the first-order proposition (*p*), which is exactly what the agent is trying to determine. This creates a "conditional reliability" puzzle. For second-year undergraduates encountering HOE for the first time, this conflates the *structure* of higher-order evidence with complex *probabilistic dependencies*. It obscures the core phenomenon (conflict between reasoning and evidence about reasoning) by forcing them to solve a Bayesian conditionalization problem just to understand the setup.

  **The Carrying Case: "The Fatigued Diagnostician"**
  Use a simplified version of your medical scenario that isolates the HOE.
  *   **Setup:** A doctor diagnoses a rare disease (*p*) based on clear symptoms (strong FOE).
  *   **HOE Source:** A hospital monitoring system alerts the doctor: "You have been awake for 24 hours. Cognitive performance on diagnostic tasks is currently impaired by 50%."
  *   **Why this carries the session:**
      *   **Must Have:** **Independence.** The fatigue is factually independent of whether the patient has the disease. This ensures the HOE targets the *process*, not the *world*.
      *   **Must Lack:** **First-Order Content.** The alert must *not* say "You are wrong" or "The patient is healthy." It must only speak to the doctor's reliability. If the HOE source asserts *not-p*, students will treat it as conflicting testimony (FOE vs. FOE), which you already covered in previous weeks.

  ---

  ### Framing the Puzzle: Evidence vs. Verdict

  **Order of Operations:**
  You must frame the puzzle first as a **conflict between two bodies of evidence**, and only subsequently as a **conflict between a judgment and a verdict**.

  **Why this order matters:**
  1.  **Evidence First (Pedagogical Hook):** Students already understand evidential support and defeat. If you begin with "Epistemic Akrasia," they will treat it as a psychological curiosity or a logical contradiction in terms. By starting with HOE as a *type of evidence*, you legitimize it within their existing epistemological framework. It forces them to acknowledge that the fatigue alert *matters* evidentially.
  2.  **Verdict Second (The Philosophical Payload):** Once they agree the HOE counts as evidence, you demonstrate the consequence: if the FOE supports *p*, but the HOE supports "my FOE-processing is broken," the rational agent ends up believing *p* (due to FOE) while believing they shouldn't believe *p* (due to HOE).
  3.  **The Risk of Reversal:** If you frame it as Judgment vs. Verdict first, students will assume the solution is simply "change the judgment to match the verdict." They will miss the *residual force* of the first-order evidence. The puzzle only exists because the FOE doesn't disappear when the HOE arrives. The Evidence framing preserves the tension; the Verdict framing reveals the paradox.

  ---

  ### Mapping Misconceptions to Interception Points

  Do not wait for these to arise; structure your questions to head them off at specific timestamps.

  **1. Misconception: "HOE is just one more piece of evidence about the world."**
  *   **Interception Point:** **Minute 20** (During Case Introduction).
  *   **Strategy:** When introducing the fatigue alert, explicitly ask: "Does this alert tell us anything about the *patient's* symptoms?" (No). "Does it tell us anything about the *doctor's* relation to the symptoms?" (Yes). Force the distinction between *world-directed* and *mind-directed* evidence immediately. If you allow them to code this as negative FOE, the rest of the seminar collapses into a standard weighing exercise.

  **2. Misconception: "Since one can simply change one's mind, there is no genuine puzzle."**
  *   **Interception Point:** **Minute 35** (During The Akratic Turn).
  *   **Strategy:** When defining the akratic state, ask: "If the doctor suspends judgment to avoid akrasia, did the FOE vanish?" (No). "If the FOE is still strong, why is she not believing it?" This highlights that the rational response to HOE often *creates* the akrasia (by lowering confidence) or requires ignoring strong FOE (to avoid akrasia). Show that "changing one's mind" is the *problem* to be explained, not the solution.

  **3. Misconception: "The upshot is scepticism about one's own reasoning generally."**
  *   **Interception Point:** **Minute 55** (During Normative Upshot).
  *   **Strategy:** Ask: "Does knowing you are tired make you irrational in *all* things, or only in complex diagnostics?" Guide them to see that HOE is local. If they conclude global scepticism, they have misunderstood the scope of the defeater. Emphasize that HOE modifies *confidence*, it does not necessarily delete *capacity*.

  ---

  ### Closing Question & Exclusions

  **The Closing Question:**
  > "If the doctor believes the patient has the disease, but also believes she is too tired to trust that belief, is her irrationality located in *holding the belief* or in *holding the belief about her belief*? Why does it matter which one we pick?"

  *   **Discrimination:**
      *   **Surface Learner:** Will say "She should split the difference" or "She should stop believing." They treat the attitudes as quantities to be averaged.
      *   **Structural Understanding:** Will recognize that the tension is about the *normative status* of the belief. They will identify that the HOE attacks the *justification* of the first-order belief without necessarily removing the *evidence* for it. They will see that the irrationality lies in the *combination* of attitudes (the akratic pair), not necessarily in either attitude in isolation.

  **What to Openly Decline to Cover:**
  State explicitly at the start or end: **"We will not be doing the formal Bayesian modeling of conditionalizing on reliability, nor will we be resolving the debate between 'Steadfast' and 'Conciliationist' views."**
  *   **Reason:** Formal modeling requires mathematical prerequisites that will distract from the conceptual structure. The Steadfast/Conciliationist debate requires a deeper dive into peer disagreement literature that will bloat the 75-minute limit. Stick to the structure of the conflict, not the calculus of the resolution.
