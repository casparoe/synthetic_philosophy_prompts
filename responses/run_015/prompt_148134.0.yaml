  # Diagnostic Instrument: The Neural Simulation Variant
  **Target Audience:** Advanced Undergraduates / Early Graduate Students  
  **Estimated Time:** 15 Minutes  
  **Case Stipulation:** Mary knows all physical facts. A *perfect* real-time neural simulation induces the exact physical state of seeing red in her brain. She does not look at a red object.

  ---

  ## Part I: The Decision Flowchart

  **Node 1: The Epistemic Gap**  
  After the simulation is complete, does Mary possess a cognitive grasp of "what it is like to see red" that she demonstrably lacked before the simulation?  
  *   **NO** → Go to **Node 2**  
  *   **YES** → Go to **Node 3**

  **Node 2: The Source of Ignorance**  
  If she gained nothing, is it because the phrase "what it is like" refers to nothing real, or because the simulation failed to induce the state?  
  *   **"What it is like" is incoherent/empty** → **Leaf 6**  
  *   **The simulation failed to work** → **Leaf 8**

  **Node 3: Ontological Completeness**  
  Since she gained a new grasp, does this imply the complete physical description of the world she originally possessed was missing real features or properties?  
  *   **YES (World was incomplete)** → Go to **Node 4**  
  *   **NO (World was complete)** → Go to **Node 5**

  **Node 4: The Nature of the Dualism**  
  If the world was incomplete, is the missing element a new *property* of experience, or merely a new *mode of accessing* an existing physical property?  
  *   **New Property** → **Leaf 4**  
  *   **New Mode (Ontologically Neutral)** → **Leaf 5**

  **Node 5: The Nature of the Physicalism**  
  If the world was complete, is Mary's new grasp best described as a practical *ability* (know-how) or as new *information* (know-that)?  
  *   **Practical Ability** → **Leaf 1**  
  *   **New Information** → Go to **Node 6**

  **Node 6: The Mechanism of Information**  
  If she gained new information, did she acquire it by having the brain state *itself* present to her mind, or by acquiring a new *concept/label* for that state?  
  *   **State Itself Present** → Go to **Node 7**  
  *   **New Concept/Label** → **Leaf 2**

  **Node 7: The Doxastic Commitment**  
  If the state itself was present, does this direct contact compel her to form a *belief* that the experience is occurring?  
  *   **YES (Compels Belief)** → **Leaf 3**  
  *   **NO (Knowledge without Belief)** → **Leaf 7**

  ---

  ## Part II: Position Key (The Eight Leaves)

  | Leaf | Position Label | Diagnostic Profile |
  | :--- | :--- | :--- |
  | **1** | **Physicalism via Ability Hypothesis** | Mary gains no new facts about the world, only new capacities (e.g., to imagine or recognize red). The simulation provides the physical basis for the ability, but no new truth-conditions. |
  | **2** | **Physicalism via Phenomenal-Concept Acquisition** | Mary gains a new factual perspective, but it is merely a new conceptual mode of presenting a physical state she already knew about. |
  | **3** | **Physicalism via Acquaintance** | Mary gains factual knowledge through a direct relation (acquaintance) with the physical brain state itself, which compels belief. |
  | **4** | **Property Dualism** | The simulation reveals that the physical description was ontologically incomplete; there are non-physical properties of experience that the simulation made manifest. |
  | **5** | **Knowledge Dualism (Ontological Neutrality)** | Mary gains a distinct kind of knowledge that cannot be reduced to physical knowledge, but this does not necessarily entail new non-physical properties in the world (epistemic dualism). |
  | **6** | **Eliminativism about Phenomenal Concepts** | Mary gains nothing because "what it is like" is a confused notion. The simulation changes her brain, but there is no distinct phenomenal knowledge to be had. |
  | **7** | **Hybrid (Knowledge without Belief)** | The simulation provides direct contact with the state (knowledge), but for structural reasons, this does not generate a standard doxastic belief state about the experience. |
  | **8** | **Unoccupied: Simulation Skepticism** | *Diagnosis:* **Incoherent with Case Stipulations.** While logically possible in the real world, this position claims the *perfect* simulation failed. In the context of the thought experiment, this rejects the premises rather than solving the argument. |

  ---

  ## Part III: Instructor Notes & Ambiguity Flags

  **1. The Acquaintance/Concept Ambiguity (Node 6)**  
  *Flag:* Distinguishing **Leaf 2 (Phenomenal Concept)** from **Leaf 3 (Acquaintance)** is notoriously difficult. Many physicalists argue that acquiring a phenomenal concept *just is* a form of acquaintance with a physical state. If a student struggles to distinguish "having a new concept" from "having the state present," note that these positions are often compatible or describe the same mechanism from different angles. The tree forces a distinction for diagnostic clarity, but in the literature, these views frequently overlap.

  **2. The Unoccupied Slot (Leaf 8)**  
  *Diagnosis:* This slot is logically possible in empirical science (simulations can fail), but it is philosophically unoccupied in the context of the Knowledge Argument. Accepting this leaf amounts to saying, "I deny the thought experiment's stipulation that the simulation is perfect." This is typically treated as a conversation-stopper rather than a solution to the epistemic gap, rendering the position empty in this dialectical context.

  **3. The Hybrid Slot (Leaf 7)**  
  *Note:* This position is included to test sensitivity to the distinction between *knowledge* (factive) and *belief* (doxastic). It is a rare position, often associated with specific views on self-intimation or non-doxastic accounts of experience. It ensures the tree captures nuanced responses that accept the phenomenology but deny the standard doxastic outcome.

  **4. Implementation**  
  Ask students to trace their path through the Nodes 1–7. Once they land on a Leaf, they should read the corresponding Position Label. If they land on Leaf 8, ask them to reflect on whether they are solving the argument or rejecting the case. If they hesitate at Node 6, refer them to the Ambiguity Flag.
