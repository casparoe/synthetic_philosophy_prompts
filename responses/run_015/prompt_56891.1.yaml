      4.  **Historian: "Historical Misdescription"**
          *   *Objection:* "Freud describes religion as private neurosis. Historians show religion is public, liturgical, and social. Your thesis rests on Freud's empirically false description."
          *   *Reply:* Social reinforcement amplifies the illusion; it doesn't cure the evidential insulation. Group wish-fulfillment is still wish-fulfillment. The epistemic structure holds even if the sociological vector is wrong.
