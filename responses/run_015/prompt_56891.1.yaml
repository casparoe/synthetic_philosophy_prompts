          *   *Objection:* "Freud's goal was relief from neurosis, not epistemic hygiene. You're intellectualizing a clinical tool. Pathologizing belief undermines the therapeutic alliance."
          *   *Reply:* *Future of an Illusion* is cultural theory, not case work. Freud explicitly targets the *civilizational* cost of illusion. Even if clinically useful, the epistemic cost remains for the culture.
          *   *Soft Spot:* Blurs Freud's own inconsistency between clinical practice and cultural critique.

      3.  **Evolutionary Debunker: "Adaptive Function vs. Wish"**
          *   *Objection:* "Freud's 'wish' is naive. Evolution explains religion via group cohesion/fitness. If belief is adaptive, it might track truth or utility, restoring entitlement."
