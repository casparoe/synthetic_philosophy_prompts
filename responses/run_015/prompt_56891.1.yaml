          *   *Reply:* Freud isn't demanding evidence for *content*, but transparency about *cause*. Properly basic beliefs are immediate experiences (like memory), not complex theological systems insulated from counter-evidence. If the belief is actively maintained by wish-fulfillment against evidence, it loses basic status.
