      *   *Suspicion 2 (Stopping Point):* The "no stopping point" argument is inductive, not deductive. It relies on the pattern of past errors. A defender would admit we can't *prove* there's no limit, but argue the burden of proof is on the restrictor.
      *   *Suspicion 3 (Factory Farming/Progress):* This is a strong critique. Inclusion without welfare isn't progress. A defender would distinguish between *moral consideration* (counting in the calculus) and *moral treatment* (how we act). Progress requires both widening the circle *and* improving conditions. Mere inclusion in a system of exploitation isn't moral progress.

