answer: |-
  ### (1) Exam Question

  **Question 4: Comparative Luminosity and the Margin for Error**

  In *Knowledge and Its Limits*, Williamson argues that no non-trivial condition is luminous. A student in your section proposes retreating from *absolute* luminosity (e.g., "I feel cold") to **Comparative Luminosity (CL)**: *Whenever your confidence in $p$ is strictly greater than your confidence in $q$, you are in a position to know that it is.* The student argues that because CL concerns a relation between attitudes rather than an absolute state, the sorites series has no boundary to grip.

  Write an essay addressing the following:
  1.  Clarify the distinction between the luminosity of a condition and the KK principle. Why might one think CL secures a surrogate for KK?
  2.  Generalize Williamson's margin-for-error argument to CL. Does the argument depend on the *size* of the margin for error, or merely its existence? Explain why comparative states remain vulnerable to indiscriminability.
  3.  Consider a modified principle, **CL-Gap**: *Whenever your confidence in $p$ exceeds your confidence in $q$ by a discriminable margin $\delta$, you are in a position to know that it is.* Assess whether CL-Gap avoids the sorites, and critically evaluate whether it can perform the theoretical work (e.g., internalist justification or infinite iteration) originally expected of KK.

  *(Word limit: 1,200 words)*

  ***

  ### (2) Model Answer

  **Luminosity, KK, and the Comparative Retreat**

  To evaluate the proposal of Comparative Luminosity (CL), one must first distinguish luminosity from the KK principle. A condition $C$ is luminous iff whenever $C$ obtains, the subject is in a position to know that $C$ obtains. The KK principle states that if one knows $p$, one is in a position to know that one knows $p$. While distinct, they are intimately linked: standard defenses of KK often rely on the assumption that the condition of *knowing* (or the evidence constituting it) is luminous. If one cannot luminously access one's own epistemic state, one cannot safely iterate knowledge. The student proposes CL as a surrogate because internalist projects often rely not on absolute certainty, but on comparative confidence (e.g., "I am more confident in perception than in rumor"). If one can always know which belief is stronger, one might preserve a hierarchy of justification akin to KK.

  However, Williamson's margin-for-error argument generalizes to comparative states because it rests on the metaphysics of indiscriminability, not the grammar of the condition. Knowledge requires safety: one cannot know $X$ in a case that is indiscriminable from a case where $X$ is false. Confidence is a gradable psychological state. Consider a sorites series of cases where the difference between confidence in $p$ and confidence in $q$ diminishes incrementally. In case $n$, $Conf(p) = 0.51$ and $Conf(q) = 0.50$. In case $n+1$, the difference is microscopic. If the subject cannot phenomenologically discriminate case $n$ from case $n+1$, they cannot form a belief in $n$ that is safe against error in $n+1$. If they judge "Conf(p) > Conf(q)" in $n$, but in the indiscriminable $n+1$ the relation does not hold (or holds less clearly), the belief in $n$ is unsafe. Therefore, CL is not luminous.

  Crucially, this argument does not depend on the *size* of the margin for error, only on its being non-zero. Williamson's anti-luminosity proof shows that for any non-trivial condition, there is a margin where one cannot distinguish obtaining from non-obtaining. Even if the discriminative threshold is incredibly fine, a sorites series can bridge any finite non-zero gap over enough steps. As long as human discrimination is fallible (which it must be, given our cognitive architecture), there will be adjacent cases in the series where the comparative relation changes but the subject's perspective does not. Thus, the "boundaryless" nature of a comparison does not save it; the boundary lies in the subject's discriminatory capacity, not the state itself.

  To salvage the principle, the student proposes **CL-Gap**: knowledge obtains only when the confidence difference exceeds a discriminable margin $\delta$. This successfully blocks the sorites. By building the margin into the antecedent, we ensure that whenever the condition obtains, the cases are discriminable from those where it fails. Safety is preserved because there are no indiscriminable neighbors where the condition fails.

  However, CL-Gap fails to do the theoretical work of KK. The KK principle is valuable to internalists because it allows for the iteration of knowledge and the securing of justification without external gaps. KK implies that if I know, I can know that I know, and know that I know that I know, *ad infinitum*. CL-Gap breaks this iteration. If knowing a comparative fact requires a gap $\delta$, then knowing *that* I know requires a second-order gap. Eventually, the required confidence differences will exhaust the available doxastic space (confidence ranges from 0 to 1). One cannot iterate comparative judgments indefinitely if each step requires a fixed discriminable buffer. Furthermore, CL-Gap concedes that there are truths about one's mind (small confidence differences) that one cannot know. This undermines the internalist ideal that the mind is transparent to itself. While CL-Gap is a true principle of safety, it is too weak to serve as the foundation for a robust internalist epistemology, rendering it a poor surrogate for the KK principle it was meant to replace.

  ***

  ### (3) Marking Scheme

  **Total Marks: 20**

  **1. Distinction between Luminosity and KK (4 marks)**
  *   **Must Hit:** Clearly defines luminosity ($C \to K(C)$) vs. KK ($K(p) \to K(K(p))$) and explains that KK defenses often presuppose luminous access to knowledge states.
  *   **Common Error:** Treating luminosity and KK as identical concepts, or failing to explain why CL is proposed as a *surrogate* for KK specifically.

  **2. Generalization of Margin-for-Error to Comparative States (4 marks)**
  *   **Must Hit:** Explains that the argument relies on *indiscriminability* and *safety*, not the absolute nature of the property. Shows that if two confidence levels are indiscriminable, one cannot safely judge the difference.
  *   **Common Error:** Claiming the argument fails because comparisons don't have "boundaries" like "feeling cold" does, missing the point about cognitive discrimination limits.

  **3. The Significance of the Non-Zero Margin (4 marks)**
  *   **Must Hit:** Explicitly states that the sorites grips any non-zero margin. The size of the margin is irrelevant; only the existence of a threshold where discrimination fails matters.
  *   **Common Error:** Suggesting that making the margin sufficiently small would solve the problem, or confusing the margin of error with the margin of confidence.

  **4. Assessment of CL-Gap and Sorites Avoidance (4 marks)**
  *   **Must Hit:** Acknowledges that CL-Gap (building $\delta$ into the antecedent) technically avoids the sorites by ensuring safety through discriminability.
  *   **Common Error:** Arguing that CL-Gap still falls to the sorites, or failing to see why adding the gap blocks the indiscriminability chain.

  **5. Evaluation of Theoretical Utility (Iteration/Internalism) (4 marks)**
  *   **Must Hit:** Argues that CL-Gap fails the functional role of KK because it prevents infinite iteration (exhausting doxastic space) and concedes opaque mental states, undermining internalism.
  *   **Common Error:** Concluding that because CL-Gap is "safe," it is a successful epistemic principle, ignoring the loss of iterability and internalist transparency.
