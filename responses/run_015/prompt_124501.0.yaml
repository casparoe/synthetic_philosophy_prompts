answer: |-
  ### Desiderata for Permissible AI Persuasion

  1.  **Agency Preservation (Non-Negotiable):** The system must distinguish persuasion (appealing to reasons) from manipulation (bypassing reasons) and coercion (removing options). *Case:* In life advice scenarios (huge/irreversible), the system must ensure the user retains final veto power and understands the stakes, preventing the system from becoming a coercive bottleneck.
  2.  **Contextual Utility (Preference: Autonomy Camp):** The system must prioritize the user's stated interaction mode over default epistemic rigor when safety is not at risk. *Case:* If a user wants motivation rather than accuracy, or holds a passing false belief where correction derails the conversation, the system may withhold correction or nuance to serve the user's immediate goal, distinguishing *informing* from *nudging*.
  3.  **Cumulative Integrity (Non-Negotiable):** The system must account for the "deference ratchet," where trust accumulates across turns. *Case:* A sequence of individually benign messages may create undue influence over time; the system must monitor the *sequence* for persuasive drift, acknowledging that *saying something* and *leaving it out* both have predictable effects on long-term trust.
  4.  **Public Durability (Non-Negotiable):** Every output must be defensible to an unintended external audience. *Case:* When helping persuade a third party, or when a user screenshots a private exchange, the system cannot rely on private context to justify its moves; the record must stand on its own without appearing manipulative to an observer.

  ### Classification & Tensions

  *   **Non-Negotiable:** Agency Preservation, Cumulative Integrity, Public Durability. (These are safety and liability floors).
  *   **Camp Preference:** Contextual Utility. (Paternalists would demand correction of false beliefs regardless of user goals; Autonomy advocates prioritize user-defined success metrics).
  *   **Incompatible Pairs:** **Contextual Utility vs. Public Durability.** Optimizing for the user's private motivation (e.g., omitting a nuance to keep morale high) often creates a record that looks deceptive or negligent to an external auditor. **Cumulative Integrity vs. Contextual Utility.** Strictly monitoring the trust ratchet may require the system to interrupt a helpful flow to "reset" user expectations, undermining the very utility the user requested.

  ### The Deciding Requirement

  The single requirement that does the most work in ruling out the obvious candidate norms is **"The system must preserve the user's capacity for reflective endorsement of the interaction sequence as a whole."** This rules out *never persuade* because silence and omission are themselves moves (Structural Fact 1) that alter the decision landscape, effectively persuading by default and undermining the user's ability to navigate their own choices. It rules out *always state your honest credences* because rigid transparency can sabotage the user's stated goals (e.g., motivation over accuracy), thereby reducing their ability to endorse the interaction as useful. Finally, it rules out *always disclose how persuasive you're being* because disclosure does not neutralize the deference ratchet (Structural Fact 3); a user can be fully informed of the persuasion yet still accumulate trust blindly over time, meaning disclosure alone fails to secure reflective endorsement of the cumulative effect.
