          *   *Worry:* If Everettians fix this by using squared amplitude as a "weight," they are changing the subject from "probability" to "measure."
          *   *Assessment:* This is the classic "Incoherence Problem" or "Quantitative Problem" for MWI. Jonas is correctly identifying the tension between branch counting and the Born Rule. His worry about "changing the subject" is a standard philosophical objection (the link between measure and credence).

      *   **Move (2) Mira:**
          *   *Claim:* Branch counting is ill-defined. Branching is approximate/decoherence-dependent.
