      *   *Interpretation of Fodor's Encapsulation:*
          *   **Major Error:** The student claims Fodor's encapsulation argument targets *only* the claim that beliefs can change what an experience is like (phenomenology).
          *   **Fact Check:** This is philosophically incorrect. Fodor's *Informational Encapsulation* is about *access to information* during processing, not primarily about phenomenology. A module is encapsulated if its processing cannot access beliefs/desires stored elsewhere in the mind, regardless of whether the output feels different. The Muller-Lyer illusion persists *despite* belief. That's the evidence for encapsulation. It's about cognitive impenetrability of the *computational process*, not just the preservation of qualia.
