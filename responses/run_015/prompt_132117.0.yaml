      *   **Refining the Fodor Critique:** I need to be precise. Fodor's encapsulation means the module *cannot use* central beliefs during computation. The student thinks encapsulation means *phenomenology stays the same*. If structural penetration allows concepts to shape structure, the module *is* using central information. Therefore, it violates encapsulation. The student gets this backwards.

