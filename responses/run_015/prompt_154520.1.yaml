  7.  **Final Review against Constraints:**
      *   Actionable bottom line? Yes.
      *   Honest treatment of losing side? Yes.
      *   Philosophical concepts used? Yes.
      *   Tone appropriate? Yes.

  8.  **Final Polish:** Check for clarity, flow, and formal formatting. (Ensure the distinction between *moral* rightness and *institutional* compliance is sharp).

