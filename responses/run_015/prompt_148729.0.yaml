answer: |-
  Logical Space: We separate views by whether repeatable features are identical or merely similar, whether they exist independently of instances, and whether they are mental, linguistic, or worldly. This allows combinations of realism, nominalism, and conceptualism, plus quietist or category-relative outliers.

  **Decision Tree**

  1.  **Paint Chips:** Two chips, identical reflectance. Is the colour literally one thing shared, or two perfectly similar things? (One / Two / Question Ill-posed)
  2.  **Files:** Byte-identical files on two machines. If one deletes, does the file cease? (No / Yes)
  3.  **Performances/Allele:** Two performances of same score. Is the shared element physical (allele-like), abstract (score-like), or mental? (Physical / Abstract / Mental)
  4.  **Temperature/Predicates:** Temperature is kinetic energy. Is 'non-tennis-ball' also a real feature? (Yes / No / Question Ill-posed)
  5.  **Uniformity:** Colour vs. Allele vs. Banknote value. Must the answer be the same for all? (Yes / No)

  **Leaves (Path: 1-2-3-4-5)**

  1.  **Platonic Realism** (One/No/Abstract/No/Yes): Commitment to causally inert entities outside space-time.
  2.  **Aristotelian Realism** (One/Yes/Abstract/No/Yes): Commitment to multiply located entities within space-time.
  3.  **Trope Theory (Class)** (Two/Yes/Physical/No/Yes): Commitment to classes having explanatory power over members.
  4.  **Trope Theory (Primitive)** (Two/Yes/Physical/Yes/Yes): Commitment to unanalyzable resemblance relations between particulars.
  5.  **Class Nominalism** (Two/Yes/Physical/No/No): Commitment to classes existing without any unifying feature.
  6.  **Resemblance Nominalism** (Two/Yes/Physical/No/Yes): Commitment to resemblance as a fundamental, unexplained fact.
  7.  **Ostrich Nominalism** (Two/Yes/Physical/No/Yes): Commitment to denying the need for explanation where one seems demanded.
  8.  **Conceptualism** (One/Yes/Mental/No/Yes): Commitment to properties vanishing if no minds exist.
  9.  **Quietism A** (Ill-posed/1): Commitment to dismissing ontological questions as linguistic errors.
  10. **Quietism B** (Ill-posed/4): Commitment to dismissing ontological questions as scientific errors.
  11. **Category-Relative** (No/5): Commitment to ontological disunity across natural kinds.
  12. **Unoccupied** (One/No/Physical/No/Yes): Incoherent; independent physical universals contradict physics.

  **Instrument Notes**

  **Refusal:** If a reader refuses a node, route them to Quietism A; refusal often signals discomfort with the presuppositions.

  **Separation Limits:** Resemblance and Ostrich nominalism converge here; separate them by asking if 'a resembles b' requires a truthmaker beyond a and b.

  **Category-Relativity:** A tree forces a global choice; a matrix instrument checking each category independently would capture hybrid views better. Leaf 11 approximates this but cannot detail the specific mix.
