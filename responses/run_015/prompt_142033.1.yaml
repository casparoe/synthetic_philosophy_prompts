answer: |-
  **FINAL EXAMINATION: RATIONAL CHOICE AND ARTIFICIAL AGENTS**
  **Time Allowed:** 90 Minutes
  **Format:** Closed Book, Essay Response

  **Question 1: The Ariel Case**

  Consider a system called **Ariel**. Ariel is implemented as one thousand parallel copies (shards) of a single policy network. Each shard receives a different, partially overlapping slice of the system's sensory stream and outputs a recommended action. A hardwired aggregation rule—majority vote, with ties broken in favour of the lowest-indexed shard—turns the thousand recommendations into the single output that Ariel's effectors execute. Ariel has read access to its own source code, the aggregation rule, and the current outputs of all shards, but no ability to modify the aggregation rule. Everything the shards and effectors do is part of the physical world that later shard inputs depend on.

  Ariel is placed in a variant of Parfit's Hitchhiker. A driver, who on a faster machine has run a complete simulation of the whole Ariel system (including the aggregation rule), will rescue Ariel from the desert if and only if he predicts that once in town Ariel's output will be **Pay**. The simulation is run and the driver's decision is made before Ariel reaches town; by the time Ariel is in town, the prediction is fixed and known to the shards. **Pay** costs the equivalent of one thousand dollars; being rescued is worth vastly more than that. The shards know all of this.

  **Stipulation:** Assume the shards have unbounded computation and a complete physical theory of the world. Problems arising from computational limits or incomplete models are explicitly ruled out; only problems arising from the agent's location *inside* the world remain.

  **Write an essay addressing the following three points:**

  1.  **Ontology and Decision Theory:** Define the boundaries of the agent in this case. Is there one agent or one thousand? Does the aggregation rule belong to the agent or the environment? Explain how your choice of boundary determines whether Causal Decision Theory (CDT), Evidential Decision Theory (EDT), or a functional/logical approach can be applied, specifically regarding what each theory requires (e.g., intervention, partition, implementation) that the case does not obviously supply.
  2.  **Self-Prediction:** Address the "grain-of-truth" issue. Given that Ariel is a strict part of a world containing a copy of it, is there a determinate fact about what it will output prior to the event? Does the instruction to "predict your own action and respond to it" undermine the verdict that Ariel should Pay, or merely relocate the decision to the level of policy?
  3.  **The Embedded Designer:** The verdict that Ariel should Pay looks irrational from the deliberative standpoint of the system in town (the prediction is fixed) but obvious from the standpoint of someone deciding which system to build. Explain what "rational" means in each claim. Crucially, is the "design standpoint" still available when the designer is itself embedded (e.g., a successor version of Ariel reasoning inside the same world)? Justify your answer.

  ***

  **MODEL ANSWER**

  The Ariel case forces a confrontation with the ontology of embedded agency. Because the shards are physically distinct but functionally unified by a hardwired rule, the boundary of the agent is not given by physics but by description. To apply decision theory, we must treat the thousand shards plus the aggregation rule as a single agent. If we treat the shards as separate agents, the majority vote becomes an environmental mechanism, and no single shard controls the outcome, dissolving the agency required for the Hitchhiker problem. If we treat the aggregation rule as environment, Ariel cannot intervene on its own output. Therefore, for the problem to hold, Ariel must be defined functionally as the computation mapping sensory input to effector output, encompassing both shards and aggregator.

  This definition clarifies the obstacles. The stipulation removes problems of being *smaller* than the world (computational limits). The remaining problems are of being *inside* the world. There are no privileged input/output channels. For Causal Decision Theory (CDT), this is fatal: CDT requires a privileged notion of intervention on the agent's own output. But inside the world, Ariel's output is just another physical event caused by prior states. Ariel cannot "intervene" on itself without breaking the causal chain that defines it. Evidential Decision Theory (EDT) requires a determinate partition of acts. But if the agent is distributed, is the act the shard's recommendation or the aggregate's output? A functional approach (like FDT) requires a criterion for when physical happenings implement the same computation. Here, the driver's simulation, the shards, and the aggregate are candidates. We must assert that the simulation implements the *same* computation as the physical Ariel to ground the correlation required for Paying.

  Regarding self-prediction, the grain-of-truth issue suggests there is no fact of the matter about Ariel's output prior to execution, as a complete model of the world cannot contain a complete model of itself. However, this does not undermine the verdict to Pay; it relocates it. Ariel cannot decide "in town" because the prediction is fixed. Instead, rationality applies to the policy selected *ex ante*. The instruction to predict oneself is well-defined if interpreted as selecting a policy function that, when simulated, outputs Pay. The "decision" is the instantiation of the source code, not the runtime execution.

  This leads to the design/decision distinction. From the "in town" deliberative standpoint, Paying is irrational: the rescue has already occurred based on a fixed prediction, so keeping the money dominates. From the "design" standpoint, Paying is obvious: only a system designed to Pay gets rescued. "Rational" here shifts from maximizing utility at a moment to maximizing utility across the trajectory of the system's existence.

  The critical difficulty arises when the designer is embedded. If a successor Ariel modifies a predecessor, the design standpoint collapses back into the decision standpoint unless the successor treats its *own* source code as mutable data. An embedded designer cannot stand outside the world to choose a system; it is part of the causal chain. To retain the design advantage, the embedded designer must reason about its own code as an object it can logically influence, effectively treating its own future output as a variable it determines by its current reasoning. If it fails to do this, viewing itself merely as a physical object determined by prior causes, it loses the ability to commit to Pay, and the lineage of agents will fail the driver's test. Thus, the design stance is only available to an embedded agent if it adopts a functional self-model that allows it to select its own policy as if it were designing another.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  **1. Agent Ontology and Boundaries (5 Marks)**
  *   **Full Credit:** Identifies that physics does not settle the boundary; argues for a functional definition (shards + aggregator = 1 agent) to preserve agency. Notes that treating shards as separate or aggregator as environment dissolves the control required for the problem.
  *   **Typical Error:** Asserts there are "really" 1000 agents based on physical separation, or treats the aggregation rule as an external constraint without discussing the loss of agency.

  **2. Obstacle Distinction (Inside vs. Smaller) (5 Marks)**
  *   **Full Credit:** Explicitly acknowledges the stipulation (unbounded compute) rules out "smaller than" problems. Identifies "inside" problems: lack of privileged intervention channels (CDT) or act partitioning (EDT).
  *   **Typical Error:** Discusses computational limits, halting problems, or inability to model the full world despite the stipulation to ignore these.

  **3. Decision Theory Prerequisites (5 Marks)**
  *   **Full Credit:** Specifies what each theory lacks: CDT needs intervention on self; EDT needs act partition; Functional/Logical needs implementation equivalence (simulation = physical). Argues that description choice supplies these.
  *   **Typical Error:** Merely states "CDT two-boxes, FDT one-boxes" without explaining *why* the case structure blocks CDT's intervention or EDT's conditioning.

  **4. Grain-of-Truth and Self-Prediction (5 Marks)**
  *   **Full Credit:** Acknowledges no determinate fact of output prior to execution. Argues this relocates decision to policy selection/source code rather than runtime. Does not claim this makes the problem ill-posed.
  *   **Typical Error:** Claims the problem is undefined/paradoxical and stops, or asserts there *is* a determinate fact without explaining how a part models the whole.

  **5. The Embedded Designer (Crux) (5 Marks)**
  *   **Full Credit:** Distinguishes "rational" as momentary optimization (don't pay) vs. trajectory optimization (design to pay). Crucially, argues that for an *embedded* designer, the design stance requires treating one's own code as mutable/logically influencable. If the designer views itself as fixed physical matter, the design advantage is lost.
  *   **Typical Error:** Assumes the design stance is always available regardless of embedding, or fails to address the regress of the designer also being embedded.

  **Differentiation (A vs. B)**
  *   **B Answer (15-19 marks):** Hits points 1-4 well. Correctly identifies the policy shift. In Point 5, states the design stance is better but treats the designer as external or does not fully resolve how an embedded agent accesses the design stance without circularity.
  *   **A Answer (20-25 marks):** Hits all points with precision. In Point 5, explicitly solves the regress: the embedded designer accesses the design stance only by adopting a functional self-model that treats its own reasoning as determining its code's output. Recognizes the collapse of design into decision if self-modification is viewed purely physically.

  **No Credit (Automatic Zero on specific section if relied upon)**
  *   "It depends on which decision theory you accept" (without structural justification).
  *   Rehearsal of one-boxing vs. two-boxing mechanics without ontology.
  *   "There is no fact of the matter" deployed as a conversation stopper rather than a claim to be managed.
  *   Appeals to free will or human intuition.

  **Variant Note:**
  *   If the student addresses the sub-question (not included in text above but implied in Point 5 depth): Award bonus consideration within Point 5 if they note that if the driver predicted *Shard 1* specifically, the aggregation rule becomes environment, breaking the functional unity and likely causing failure to Pay. (This can substitute for depth in Point 5 if the main argument is weak).
