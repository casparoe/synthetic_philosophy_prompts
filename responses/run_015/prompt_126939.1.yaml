    "james_condition": "Belief is permissible when evidence is insufficient, provided the option is living, forced, and momentous, allowing for an act of will to prevent paralysis.",
    "clifford_objection": "Belief is a public trust; believing on insufficient evidence is morally wrong because it weakens societal truth-habits and endangers others.",
    "credal_inheritance_twist": "Individual beliefs become institutional structures inherited by others who did not make the original leap, transforming private moral risk into shared structural liability.",
    "workshop_invitation": "How can we distribute epistemic risk across institutions without diluting responsibility or hiding the uncertainty embedded in our models and policies?",
    "tone_check": "The remarks avoid false consolation by refusing to promise a resolution to the tension, and avoid false despair by affirming the necessity of navigating the risk rather than succumbing to paralysis."
  }
