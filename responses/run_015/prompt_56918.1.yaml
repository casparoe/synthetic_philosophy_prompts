answer: |-
  **DOCUMENT: NARRATIVE STANDARDS REVIEW – SYMMETRY COMPLIANCE PROTOCOL (SCP)**
  **VERSION:** 4.2 (Draft)
  **OWNER:** Narrative Standards Reviewer
  **AUDIENCE:** Writing Team, Creative Director
  **TIME ALLOWANCE:** 45 Minutes per Beat

  ### PART 1: THE PROCEDURE

  **Purpose:** To ensure narrative beats align with the Studio Symmetry Default (combatants on both sides are equally entitled to fight and mourn) without creating internal contradictions or factual falsehoods within the game's fiction. This is not a moral arbitration tool; it is a consistency engine.

  **Instruction:** Answer the following five questions in order. Do not skip. If a question triggers a **STOP**, do not proceed to the next question. Submit the beat with the flagged status.

  ***

  **Q1: THE COMBATANT STATUS CHECK**
  *Does the character being targeted or mourned hold the status of a recognized soldier within the fiction's laws of war?*
  *   **Pass:** Yes. They are uniformed, under command, and operating within the rules of engagement established in the game world.
  *   **Fail:** No. They are civilians, insurgents without command structure, or prisoners.
  *   **Note:** Symmetry Default *only* applies to recognized combatants. It does not protect criminals or non-combatants.
  *   **Action:** If **Fail**, Symmetry Default does not apply. Review for standard humanization guidelines. If **Pass**, proceed to Q2.

  **Q2: THE CONDUCT CHECK**
  *Has this specific character (or their immediate unit) been shown committing acts defined as war crimes within the game's narrative?*
  *   **Pass:** No. They are fighting cleanly, or their violence is indistinguishable from the player's standard engagement rules.
  *   **Fail:** Yes. They have executed prisoners, targeted civilians, or used banned weaponry *on-screen* or via confirmed intel.
  *   **Note:** A soldier fighting an unjust war is still a soldier. A soldier committing atrocities is a criminal. Symmetry protects the former, not the latter.
  *   **Action:** If **Fail**, Symmetry Default is void for this character. They can be framed as a villain. Proceed to Q3. If **Pass**, proceed to Q3.

  **Q3: THE CAUSE CHECK (CRITICAL)**
  *Does the mission briefing or preceding narrative explicitly state that the Player's Faction is the aggressor (invading without justification) in this specific conflict?*
  *   **Pass:** No. The war's origin is ambiguous, defensive, or the player's faction is framed as responding to a threat.
  *   **Fail:** Yes. The text explicitly confirms the player's side is initiating an unjust invasion.
  *   **Note:** The Symmetry Default assumes moral equality of soldiers. If the fiction explicitly confirms one side is the *unjust aggressor*, claiming "equal entitlement to fight" creates a narrative falsehood.
  *   **Action:** If **Fail**, **STOP. ESCALATE TO CD.** This is a Values Call. The writer cannot resolve the tension between "We are the invaders" and "We are moral equals."
  *   **Action:** If **Pass**, proceed to Q4.

  **Q4: THE MOURNING BALANCE CHECK**
  *Does this beat ask the player to mourn the enemy combatant in a way that erases or trivializes the death of a friendly combatant in the same sequence?*
  *   **Pass:** No. Enemy humanity is shown, but friendly loss is acknowledged or the focus is tactical.
  *   **Fail:** Yes. The camera lingers on the enemy's family photo while a friendly corpse is looted/ignored, implying the enemy life holds more narrative weight.
  *   **Note:** Symmetry means *equal* worth, not *greater* worth for the enemy. Flipping the hierarchy violates the Veterans Group constraint.
  *   **Action:** If **Fail**, **STOP. REWRITE REQUIRED.** Rebalance the visual weight. If **Pass**, proceed to Q5.

  **Q5: THE MARKETING CONSISTENCY CHECK**
  *Does this beat contradict a "Global Truth" established in marketing materials or the game's tagline (e.g., "No Villains")?*
  *   **Pass:** No. The beat aligns with the public-facing promise.
  *   **Fail:** Yes. The beat establishes a clear villain or hero that contradicts the "Gray War" marketing promise.
  *   **Note:** Marketing claims are narrative constraints. If the trailer says "No Villains," the game cannot contain a mustache-twirling war criminal without irony.
  *   **Action:** If **Fail**, **STOP. ESCALATE TO CD.** Marketing and Narrative are misaligned.

  ***

  ### PART 2: APPLICATION TO CURRENT BEATS

  Here is the SCP applied to the three items currently in your queue.

  #### 1. The Night Raid (Conscripts at Checkpoint)
  *   **Context:** Player faction is the Invader (established in lore). Enemy are young conscripts, defending, unaware of the geopolitical context.
  *   **Q1 (Status):** **Pass.** They are uniformed soldiers.
  *   **Q2 (Conduct):** **Pass.** They are joking, reading letters. No crimes.
  *   **Q3 (Cause):** **FAIL.** The mission briefing explicitly states: "Secure the border crossing to initiate the Northern Incursion." The player is the aggressor.
  *   **Result:** **STOP. ESCALATE TO CD.**
  *   **Reviewer Note:** This is the bite. The Symmetry Default claims soldiers are "equally entitled to fight." But Q3 confirms the player's side is the *unjust aggressor*. If we run this beat under the Default, we are asking the player to believe the defenders (fighting for their homes) and the invaders (fighting for expansion) have the *same* moral entitlement. The philosophy smuggled into the Default (Walzerian Convention) clashes with the narrative fact (McMahan-style Liability). We cannot claim symmetry here without lying about the war's nature. The CD must decide: Do we soften the "Invader" language in the briefing, or do we admit this mission breaks the Symmetry Default? I cannot clear this.

  #### 2. The War Criminal Commander
  *   **Context:** Enemy Commander, established over 4 hours as ordering massacres of his own civilians.
  *   **Q1 (Status):** **Pass.** He is a uniformed Commander.
  *   **Q2 (Conduct):** **FAIL.** He has ordered massacres of civilians.
  *   **Result:** **PASS (Symmetry Voided).**
  *   **Reviewer Note:** Because Q2 failed, the Symmetry Default no longer protects him. He has stepped outside the "conventions everyone benefits from." He is no longer a "soldier doing his job"; he is a criminal. The player is permitted to condemn him personally. This does not violate the House Principle because the Principle protects *combatants*, not *criminals*. Greenlight this beat.

  #### 3. The Trailer Tagline ("No Heroes, No Villains, Only Survivors")
  *   **Context:** Montage of both armies, voiceover delivering the line.
  *   **Q1-Q4:** N/A (Marketing Copy).
  *   **Q5 (Consistency):** **FAIL.**
  *   **Result:** **STOP. ESCALATE TO CD.**
  *   **Reviewer Note:** We just greenlit Beat #2 (The War Criminal). That character is a villain by the game's own definition (massacres civilians). If the trailer says "No Villains," we are lying to the player. We cannot have a narrative truth (He is a villain) and a marketing truth (There are no villains). This isn't philosophy; it's false advertising. Either we cut the War Criminal arc, or we change the tagline. I recommend changing the tagline. "No Heroes, No Villains" is too fragile for a campaign that includes atrocities.

  ***

  ### PART 3: LIMITATIONS AND BLIND SPOTS

  You asked for honesty about where this procedure fails. Here is where the SCP will break, misjudge, or encode bias.

  **1. The "Aggressor" Ambiguity (The Q3 Loophole)**
  The procedure relies on the text *explicitly* stating who the aggressor is. Smart writers can game this. They can write an invasion that *feels* unjust without ever using the word "invader" in the briefing. If the text says "Pre-emptive Stabilization" instead of "Incursion," Q3 returns a **Pass**, and the Symmetry Default applies, even if the moral reality is the same as the Night Raid. The procedure checks *words*, not *truth*. Two honest writers can argue forever over whether "Pre-emptive Stabilization" counts as aggression. The SCP cannot solve that; it just punishes the ones who are blunt.

  **2. The "Atrocity" Threshold (The Q2 Subjectivity)**
  Q2 asks if a character committed war crimes. But in a fog-of-war game, one side's "counter-insurgency" is the other side's "massacre." If the writer frames a civilian casualty as "collateral damage" (Pass) rather than "negligence" (Fail), the Symmetry Default stays intact. This procedure encodes a bias toward the *letter* of the law over the *spirit*. It protects the studio from looking like we are laundering war crimes, but only if the writers are clumsy enough to call them crimes on the page.

  **3. The "Values Call" Dump (The Escalation Problem)**
  I have marked Q3 and Q5 as **Escalate to CD**. In practice, this means "I don't have the pay grade to decide if we are the bad guys." If the Creative Director is under pressure from publishers to keep the "Symmetry" brand, they will override the Q3 Fail. They will tell the writer to keep the "Invader" text but *force* the Symmetry framing anyway. The procedure identifies the contradiction, but it cannot prevent the studio from choosing the lie. It protects *me* (the reviewer), not the *truth*.

  **4. The Philosophical Smuggle**
  This procedure is not neutral. It is built on the Walzerian view that "soldiers are moral equals." It treats the Revisionist view (that aggressors are liable) as a "Values Call" exception rather than a baseline. By making Symmetry the Default, I am structurally biasing every mission toward the idea that *cause doesn't matter, only conduct does.* A writer running this checklist a hundred times will internalize that lesson. They will stop writing about *why* we fight and only write about *how* we fight. That is a philosophical stance disguised as a quality control measure. I am building the bias you asked for, but I need you to know that five years from now, your writers won't know how to write a war where one side is actually right.

  **5. The 45-Minute Constraint**
  Finally, this checklist assumes the reviewer can spot the contradiction in 45 minutes. Complex narrative arcs (like the War Criminal's buildup over 4 hours) are often reviewed in isolation. I might Pass a beat in Mission 3 because I haven't re-read Mission 1's briefing to check the "Aggressor" status. The procedure assumes a holistic view of the script that the production schedule does not allow. It will miss contradictions that only appear across the full campaign.

  **Recommendation:** Use the SCP. It will catch the obvious lies. But expect the CD to override the Q3 Escalations, and expect the writers to learn how to write around Q2. It's a filter, not a cure.
