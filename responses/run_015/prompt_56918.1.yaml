  2.  **Deconstruct the Philosophy (for internal alignment):**

      *   *Symmetry Default:* Aligns with Michael Walzer's *Just and Unjust Wars*. Soldiers are moral equals regardless of *jus ad bellum* (justice of war) because they operate within *jus in bello* (justice in war). This protects soldiers from being treated as murderers but risks "laundering" aggression.
      *   *Revisionist Critique:* Aligns with Jeff McMahan. Liability to attack depends on the justice of the cause. Aggressors are liable; defenders are not. Symmetry is a fiction.
      *   *The Studio's Problem:* They want Walzer (Symmetry) but got criticized by both sides (Academics say it launders aggression; Veterans say it dehumanizes *their* side by over-humanizing the enemy).
      *   *The Procedure's Job:* It needs to enforce Walzerian Symmetry *unless* the narrative explicitly breaks the conventions of war (making symmetry impossible) or if the Symmetry creates a specific narrative falsehood that undermines the game's internal logic. It must identify when "Symmetry" becomes "Moral Equivalence" in a way that contradicts established facts.

