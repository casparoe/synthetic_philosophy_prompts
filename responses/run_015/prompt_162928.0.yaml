answer: |-
  This is a **substantive disagreement about the ontology of preference and the constitutive norms of agency**, which is manifesting as a verbal dispute over the label "irrational."

  You are correct that the "unit of evaluation" (synchronic state vs. diachronic policy) is the pivot point, but that pivot turns on a deeper, often unarticulated clash between **Structuralism** (Camp One) and **Instrumentalism** (Camp Two) regarding what decision theory is *for*.

  Here is the diagnosis based on the commitments each side must hold to maintain their position.

  ### 1. The Core Disagreement: Ontology of Preference
  The stalemate persists because the two camps are using the word "preference" to refer to two different theoretical objects, though they both map them onto the symbol $\succ$.

  *   **Camp One (Structuralists/Coherentists):** For them, a preference *just is* a disposition to choose in a specific context. This is a Revealed Preference commitment. If you choose B over A, you prefer B to A. Therefore, if an agent chooses B over A, C over B, and A over C in a sequence of local choices, they have demonstrated a logical contradiction in their dispositions. The money pump doesn't *cause* the irrationality; it *reveals* the incoherence that was already present in the static ordering. For this camp, rationality is a **constitutive norm**: you cannot be an agent with cyclic preferences any more than you can be a logician who asserts $P \land \neg P$.
  *   **Camp Two (Instrumentalists/Pragmatists):** For them, preferences are **valuations** or **mental states** that *inform* choice but do not strictly *determine* it. They distinguish between the *valuation* (I like C more than B) and the *choice policy* (I will not trade B for C because I know where it leads). This allows them to treat the money pump as a strategic failure rather than a logical one. For this camp, rationality is an **instrumental norm**: it is about securing good outcomes. If a policy secures the outcome, the agent is rational, even if their underlying valuations are cyclic.

  **Why the Hyperbolic Analogy Fails to Persuade Camp One:**
  You noted that Camp One rejects the hyperbolic discounting analogy by insisting on the synchronic/diachronic distinction. From your diagnosis, this looks like a dodge. From *their* commitment, it is essential.
  *   In hyperbolic discounting, the preference ordering at $t_1$ is transitive, and the ordering at $t_2$ is transitive. The *agent* changes.
  *   In the money pump, the preference ordering at $t_1$ is intransitive. The *logic* breaks.
  Camp One argues that diachronic inconsistency is a failure of *continuity of self*, whereas synchronic inconsistency is a failure of *possibility of self*. They believe an agent with cyclic preferences at a single time lacks a coherent "good" to maximize. Camp Two believes the "good" is the successful completion of the plan, rendering the local valuations secondary.

  ### 2. The Buried Formal Question: Resolute Choice
  You asked if there is a hidden formal question. There is. It is the **viability of Resolute Choice without preference revision.**

  Camp Two's defense relies on the agent adopting a plan (e.g., "Start with A, refuse all trades") and sticking to it even when a local trade looks beneficial. This is the McClennen/Bratman move.
  *   **The Trap:** If the agent sticks to the plan at the final node (refusing to trade C for A, even though they prefer A to C), Camp One argues: "At that node, you chose C over A. Therefore, *at that node*, you prefer C to A. Your preferences have changed to match the plan."
  *   **The Formal Challenge:** Can you construct a formal model of Resolute Choice where the agent *knowingly* acts against their local preference without (a) being akratic (irrational) or (b) having their preferences redefined as transitive over *paths* rather than *outcomes*?
      *   If Camp Two says preferences are over *paths* (e.g., "I prefer the path 'Keep A' to the path 'Trade to B'"), Camp One wins: the preferences over paths are transitive, and the cyclic preferences over objects were a misdescription.
      *   If Camp Two says preferences remain over *objects* but are overridden by policy, they need a formal account of how a "preference" fails to drive choice without ceasing to be a preference.

  The reading group is stuck because Camp Two is likely gesturing at Resolute Choice without a formalism that satisfies Camp One's constraints on what a "preference" must do.

  ### 3. What Counts as Progress?
  Given this diagnosis, arguing about whether the agent is "really" irrational will not move the needle. That is a terminological fight over which ontology (Structuralist or Instrumentalist) gets to own the word "rational."

  **Progress requires one of the following:**

  1.  **A Formal Distinction:** A model that clearly separates *Local Valuation* from *Choice Disposition*. If you can formally represent an agent who has cyclic Local Valuations but stable Choice Dispositions without collapsing one into the other, you validate Camp Two's ontology. (Note: Many attempts at this, like "team reasoning" or "resolute choice," often get accused by Camp One of simply redefining the utility function to be transitive over histories).
  2.  **A Change of Question:** Shift the debate from "Is this irrational?" to "What is the cost of coherence?"
      *   Ask Camp One: "If an agent pays a small cost to maintain cyclic preferences (perhaps they yield high utility in non-pump environments), is that agent *impossible* or just *vulnerable*?"
      *   Ask Camp Two: "If the agent must expend cognitive resources to maintain the Resolute Plan, is that resource cost part of the rationality calculus?"
  3.  **The Exploiter Condition:** You flagged this, and it is worth isolating. The Money Pump argument assumes **zero transaction costs** and **arbitrary iteration**.
      *   *Test:* If each trade costs \$0.01 in effort (not paid to the exploiter), the pump stops after a few cycles. Does Camp One still claim the agent is *incoherent*, or merely *inefficient*? If they concede the latter, the disagreement is about idealization, not rationality.

  ### 4. Confidence and Uncertainty
  **Confidence:** 85%
  I am confident that the stalemate is driven by the unacknowledged clash between Revealed Preference (Camp One) and Mental State/Policy (Camp Two) ontologies. This explains why the "synchronic vs. diachronic" defense feels like a dodge to you (it ignores the policy solution) but feels like a knockout blow to them (it protects the logical structure of preference).

  **Least Certain Flag:**
  I am least sure about **Camp Two's commitment to the stability of the object of preference.**
  It is possible that Camp Two is implicitly shifting to "preferences over paths" without realizing it. If they are, Camp One is technically right that the preferences are transitive (over paths), and Camp Two is just describing the *same* agent with different granularity. If Camp Two insists the preferences are strictly over *objects* (A, B, C) and *still* cyclic, they require a much more radical revision of decision theory than they may realize. Pinning down exactly what Camp Two thinks the agent is maximizing (Outcomes? Plans? Integrity?) would likely break the circle.

  **Recommendation for the Group:**
  Stop asking "Is the agent irrational?" Ask: **"Does Resolute Choice require us to redefine the object of preference from Outcomes to Histories?"**
  *   If Yes: Camp One wins (preferences are transitive over histories).
  *   If No: Camp Two wins (rationality is about policy, not preference structure).
  *   If Undecidable: The theory is incomplete.
