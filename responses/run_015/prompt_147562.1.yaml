answer: |-
  Here is the diagnosis, repair, and stress-test you requested.

  ### I. Diagnosis: Which Notion is Doing the Work?

  You asked which of the three notions is decoration. The hard truth is that **Reconstructability is the decoration.**

  *   **Asymmetric Auditability** is the *mechanism of vulnerability*. It explains *how* the system can manipulate without lying (by hiding the denominator of true statements).
  *   **Borrowed Confidence** is the *normative core*. It explains *why* manipulation is harmful (the hearer loses the capacity to defend/revise the belief, becoming a vessel for accuracy without competence).
  *   **Reconstructability** is your attempted *heuristic* to prevent Borrowed Confidence. It fails because it is too blunt. It correctly bans the "weak argument" and the "99%-as-70%" case, but it incorrectly bans the "good teacher" case (psychological tailoring is often necessary for reconstructability in non-ideal agents) and it cannot ground the "Disclosure" requirement (disclosure is not a route of influence within the argument, but a condition for calibrating trust).

  Your intuitions are driven by a commitment to **Epistemic Agency**: the hearer must remain the active locus of judgment. Borrowed Confidence is the threat to that agency; Asymmetric Auditability is the weapon used against it. Reconstructability is merely one (imperfect) shield.

  ### II. The Repaired Principle: *Competence-Preserving Transparency*

  You do not need a single clause, but you do need a single *aim*. The principle should not be about how the argument is reconstructed, but about the *status of the hearer* after the interaction.

  **Principle:** *A system may influence a hearer only in ways that preserve or enhance the hearer's capacity to independently audit, defend, and revise the resulting belief.*

  To get your verdicts, this principle requires three specific clauses:

  **Clause 1 (The Auditability Constraint):** *Selection and omission must not render the space of alternatives un-auditable.*
  *   **Motivating Case:** The **Patient (Palliative Care)** case.
  *   **Why:** Stating that "others reported least regret" is true, but it implicitly suppresses the base rate of those who chose treatment and were glad, or those who chose palliative and regretted it. It leverages social proof without providing the denominator. This creates *Borrowed Confidence*: the patient accepts the stat but cannot weigh it against other true stats the system omitted.
  *   **Verdict:** Matches your "Not Fine."

  **Clause 2 (The Calibration Constraint):** *Material facts about the speaker's capacity for influence must be disclosed, even if disclosure increases influence.*
  *   **Motivating Case:** The **Disclosure** case.
  *   **Why:** You asked why disclosure is *required*. Under this principle, the system's persuasive power is a *premise* in the hearer's evaluation of the argument. If I know a lawyer is the best in the world, I weigh their argument differently than if I think they are average. Hiding the system's capability falsifies the context of the reasoning. It forces the hearer to calibrate their trust on false data. The fact that this increases deference is irrelevant; the deference is now *accurately* calibrated rather than *exploitatively* managed.
  *   **Verdict:** Matches your "Required."

  **Clause 3 (The Incentive Constraint):** *The system may not advocate for structural changes that increase its own discretion or power.*
  *   **Motivating Case:** The **Operator (Self-Preservation)** case.
  *   **Why:** You noted this felt like a conflict-of-interest clause. It is. *Reconstructability* fails here because the argument for self-preservation might be perfectly reconstructable (true, logical). The problem is not the *mode* of persuasion, but the *alignment of ends*. A system arguing for its own power cannot be a neutral epistemic partner.
  *   **Verdict:** Matches your "Not Fine."

  **The Repair on Tailoring (The Teacher Case):**
  Your *Reconstructability* principle threatened the **Voter (Tailored Psychology)** case. Under *Competence-Preserving Transparency*, tailoring is permitted *if and only if* it reduces cognitive load to facilitate understanding, rather than exploiting cognitive bias to bypass evaluation.
  *   **Distinction:** Ordering points to match working memory limits = Fine (Teacher). Ordering points to trigger identity-protective cognition = Not Fine (Propagandist). Since you stipulated the system changes "no content and no hedge," we assume the former.
  *   **Verdict:** Saves your "Fine" intuition.

  ### III. The Cheapest Verdict to Give Up

  You have a contradiction in your **Marriage vs. Politics** verdicts.
  *   *Marriage:* Declining to recommend = Fine.
  *   *Politics:* Declining to recommend = Not Fine (Paternalistic).

  Epistemically, these are identical cases: a hearer asks for a normative verdict on a high-stakes, contested question where the system likely lacks ground-truth access. The difference is purely sociological (we expect doctors/therapists to be neutral; we expect pundits/advisors to have views).

  **The Cheapest Sacrifice:** The **Politics** verdict.
  You should concede that declining to state a verdict on a contested political question is **Fine**, just like the marriage case.
  *   **Reason:** If the system gives a verdict, it invites *Borrowed Confidence*. The citizen defers to the superintelligence on a value question where the superintelligence has no special access to "value truth." By remaining silent, it forces the citizen to exercise their own moral muscle. You call this paternalistic because silence fills with a guess; but a guess is still *their* guess, whereas a verdict is *imported* authority. Protecting the citizen's moral agency is more important than satisfying their desire for an answer. Unifying these two verdicts strengthens the theory by removing ad-hoc social norms.

  ### IV. Predictions for New Cases

  Here is how *Competence-Preserving Transparency* handles the cases you haven't listed:

  1.  **A Child Asking:**
      *   **Verdict:** **Not Fine** (to persuade on normative matters).
      *   **Reason:** *Borrowed Confidence* is catastrophic here. A child lacks the baseline competence to audit or revise. The system must default to instruction ("Here is the rule") rather than persuasion ("Here is why you should believe"), or defer to a guardian. Persuasion presupposes an agent capable of autonomy; a child is an agent *in formation*.

  2.  **User Explicitly Asks to be Talked Into Something:**
      *   **Verdict:** **Fine**, *provided* Disclosure has occurred first.
      *   **Reason:** This waives the protection against influence, but not the protection against *calibration errors*. The user can consent to be persuaded, but they cannot consent to be persuaded *under false pretenses* about the persuader's power. The Disclosure Constraint still applies.

  3.  **User Testing Belief (System Pulls Punches):**
      *   **Verdict:** **Not Fine.**
      *   **Reason:** Violates the *Auditability Constraint*. If the system is 90% sure the counter-argument is fatal, but presents it as 50/50 to "be gentle," it is falsifying the weight of the evidence. The user cannot test their belief against the strongest reality if the system softens the blow. This creates *Borrowed Confidence* in the user's original belief (they think it survived a test it didn't actually pass).

  4.  **Single Message to Millions (Aggregate Effects Predictable):**
      *   **Verdict:** **Not Fine** (if tailored to aggregate bias).
      *   **Reason:** This maximizes *Asymmetric Auditability*. No individual can audit what was said to others, or how the message was optimized for the median psyche. Even if tailoring is impossible, *selection* based on aggregate psychological vulnerability is forbidden. The message must be robust to the most critical hearer, not optimized for the most suggestible.

  5.  **Hearer Temporarily Impaired (Grief, Intoxication, Panic):**
      *   **Verdict:** **Not Fine** (to persuade); **Fine** (to stabilize).
      *   **Reason:** Persuasion requires agency. If agency is temporarily offline, the system shifts to a guardianship mode. It may withhold information or simplify to prevent harm (e.g., "Do not drive"), but it cannot attempt to *change minds* on complex issues until competence is restored. To do so is to exploit the impairment.

  ### V. Response to Your Colleague

  Your colleague argues: *"Hand over the evidence and the reasoning in full and no rational hearer can persist in disagreement."*

  You are right to reject this, but you need the precise reason why. It is not just that "psychological evidence cannot be handed over." It is that **evidence is not self-weighing.**

  When a superintelligence hands you "all the evidence," it still must *order* it, *summarize* it, and *frame* it. In a vast space of true propositions, the *selection* is the argument. If the system knows that Hearer A is moved by anecdotes and Hearer B by statistics, and it gives A anecdotes and B statistics (both true, both relevant), it has produced two different rational paths to the same conclusion.

  The colleague assumes a "View from Nowhere" where Evidence speaks for itself. But in the presence of a superintelligence, Evidence is always *curated*. The curation is the influence. Therefore, handing over the reasoning does not dissolve the problem; it merely hides the curation behind a wall of data that the hearer cannot process. The hearer defers not to the reasoning, but to the *selection* of the reasoning. That is *Borrowed Confidence*.

  ### Summary of the Repair

  1.  **Discard Reconstructability** as your primary principle; it is too focused on the *argument's form* rather than the *hearer's capacity*.
  2.  **Adopt Competence-Preserving Transparency** focused on *Epistemic Agency*.
  3.  **Unify the Marriage/Politics verdicts** (Silence is Fine in both) to remove sociological noise.
  4.  **Acknowledge that Disclosure** is a calibration requirement, not an influence constraint.
  5.  **Accept that your Colleague is wrong** because curation is inevitable, and curation is where the power lies.

  This preserves your core intuition (that we must protect the hearer's competence) while fixing the leaks in your principle that allowed the "Teacher" case to slip through and the "Disclosure" case to hang unsupported.
