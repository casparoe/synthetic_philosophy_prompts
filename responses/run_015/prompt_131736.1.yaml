answer: |-
  State A faces State B's naval incursion into contested waters, where full-scale war yields negative expected utility for both parties. State A possesses an Escalation Veto Protocol (EVP): a standing order wherein conventional missiles automatically target B's fleet unless three domestic agencies (Defense, Intelligence, Foreign) unanimously vote to suspend within 48 hours of provocation. This suspension is politically costly, invisible to B in real-time, but verifiable ex post. Rational deterrence theory advises A to keep the EVP dormant and issue ambiguous warnings, calculating that B knows A's rational aversion to war costs renders the automatic threat incredible only if A *would* strike, which A won't; thus, EVP adds accidental war risk without shifting B's beliefs. Conversely, credible-commitment brinkmanship advises A to publicly activate the EVP, arguing that the visible institutional bind forces B to update beliefs on A's follow-through probability because the costly, unanimous suspension requirement makes backing down visibly difficult, thereby coercing B despite identical payoff structures.

  **Action and Belief Prescriptions**
  *   **Rational Deterrence (RD):**
      *   **Action:** Keep EVP dormant; issue ambiguous diplomatic warning.
      *   **Belief:** State B possesses common knowledge of State A's rationality and payoff structure. B believes that if escalation becomes irrational (costs > benefits), State A's leadership will overcome bureaucratic hurdles to suspend the strike. Therefore, B assigns a near-zero probability to the strike occurring regardless of EVP activation, viewing the protocol as "cheap talk" that merely introduces accidental war risk without altering the strategic equilibrium.
  *   **Credible-Commitment Brinkmanship (CC):**
      *   **Action:** Publicly activate EVP; issue explicit threat linking activation to withdrawal.
      *   **Belief:** State B updates its probability assessment based on institutional friction. B believes the costly unanimity requirement and real-time opacity create a non-negligible probability that State A *cannot* or *will not* coordinate suspension in time, even if war is suboptimal. This uncertainty raises the expected cost for State B, coercing withdrawal without requiring State A to actually desire war.

  **The Single Structural Feature**
  The divergence rests entirely on the **real-time invisibility of the suspension decision** (coupled with the costly unanimity requirement). This opacity creates a window of uncertainty during the 48-hour crisis window where State B cannot observe whether State A is successfully coordinating a suspension. Rational deterrence assumes B resolves this uncertainty by assuming A *will* coordinate (rationality overrides bureaucracy); brinkmanship assumes B resolves this uncertainty by assessing the *difficulty* of coordination (bureaucracy constrains rationality).

  **Effect of Removal**
  If this feature is removed—specifically, if suspension attempts were **instantly transparent** to State B—the case collapses into agreement. If B can observe suspension efforts in real-time, there is no uncertainty to exploit; B would simply wait to see if A backs down. Both theories would then agree that activation provides no coercive leverage and only adds risk, recommending the dormant diplomatic approach.

  **Strongest Rational-Deterrence Attack**
  A rational-deterrence defender would argue that the adversary should **update on the protocol's institutional existence rather than on its activation**, specifically invoking the "Rationality Override." They would contend that a sophisticated adversary knows institutions serve interests, not vice versa. If the stakes are high enough to warrant war, State A's leadership will bear the political cost of unanimous suspension; if the stakes are too low, they won't fight regardless of the protocol. Therefore, the activation signal provides no new information about State A's *resolve* (willingness to bear costs), only about its *process*, which a rational adversary should discount when calculating final outcomes.

  **Conclusion**
  The case reveals not a genuine logical paradox, but a **parameter disagreement about the dynamics of belief updating under institutional commitment**. Both theories agree on the payoffs and the definition of rationality; they disagree on whether a rational adversary weights *institutional friction* (CC) or *fundamental interests* (RD) more heavily when predicting an opponent's future actions. Brinkmanship treats bureaucratic friction as a credible constraint on rationality; deterrence treats it as noise subordinate to rationality.
