answer: |-
  ### Desiderata for a Metaphysical Theory of Music

  **1. The Phenomenological Immediacy Constraint**
  *   **Requirement:** The theory must account for the subjective experience of music as unmediated presence. It cannot treat music as merely another signifier pointing to concepts (like language) without explaining why it *feels* like it bypasses conceptualization.
  *   **Motivating Case:** Schopenhauer's core insight is that while other arts copy the Ideas (phenomenal objects), music copies the Will itself. A modern theory cannot simply assert this metaphysical leap; it must explain the *mechanism of the feeling*. Why does auditory structure feel like internal state rather than external description? If the theory reduces music to mere pattern recognition, it fails to capture the existential weight listeners report.

  **2. The Ontological Distinction Constraint (Absolute vs. Program)**
  *   **Requirement:** The theory must differentiate the metaphysical status of absolute music from program music or song without collapsing them into a single category of "auditory stimulus."
  *   **Motivating Case:** Schopenhauer argues that adding text or a story drags music back down into the world-as-representation. A serious theory must explain why attaching a narrative label changes the ontological function of the sound. If music is truly direct access to the Will, why does knowing the "plot" of a tone poem alter the metaphysical access? The theory must define the boundary where representation contaminates immediacy.

  **3. The Predictive Compatibility Constraint**
  *   **Requirement:** The theory must be compatible with the neuroscience of predictive processing (the brain as a hypothesis-testing engine) without reducing the experience to mere error minimization.
  *   **Motivating Case:** There is no unmediated access to anything; the auditory cortex constructs reality via top-down models. A theory claiming "direct access" cannot ignore the biological middleware. It must explain how a mediated, predictive biological process generates the phenomenology of *unmediated* metaphysical contact. It cannot claim magic bypassing of the cortex.

  **4. The Negativity Principle (Dissonance and Atonality)**
  *   **Requirement:** The theory must explain why violations of harmonic expectation (dissonance, atonality) generate aesthetic movement rather than mere rejection or confusion.
  *   **Motivating Case:** If music works by fulfilling predictions, dissonance should register as noise or error. If music works by objectifying the Will, and the Will is characterized by striving and suffering, then musical conflict should be aesthetically potent. The theory must account for why "painful" sound structures are emotionally compelling rather than functionally defective.

  ***

  ### Flagged Tensions

  *   **Tension A: Immediacy (1) vs. Predictive Compatibility (3).**
      *   *Conflict:* Phenomenological immediacy suggests a direct line (no middleware). Predictive processing confirms there is *only* middleware (modeling).
      *   *Risk:* A theory that satisfies (3) risks making the "directness" in (1) an illusion, undermining the metaphysical claim. A theory that satisfies (1) risks positing a mystical mechanism incompatible with (3).

  *   **Tension B: Ontological Distinction (2) vs. Immediacy (1).**
      *   *Conflict:* If music is the direct objectification of Will (1), it should be immune to conceptual contamination. Yet, program music (2) seems to degrade this purity.
      *   *Risk:* If the music itself is the direct hit, why does the extra-musical context matter? If context matters, is the music really bypassing representation, or is it just a stronger form of it?

  *   **Tension C: Predictive Compatibility (3) vs. Negativity Principle (4).**
      *   *Conflict:* Predictive processing aims to minimize surprise (free energy). Aesthetic value in atonality relies on maximizing or sustaining surprise/tension.
      *   *Risk:* A purely predictive account struggles to explain why we seek out high-error states in art. A theory focusing on the Will's struggle (4) handles this better but risks conflicting with the biological drive for stability in (3).

  ***

  ### Evaluation of Accounts

  **Schopenhauer's View**
  *   **Performance:** High on **Immediacy (1)** and **Negativity (4)**. He grounds the power of dissonance in the inherent suffering/striving of the Will, making conflict aesthetically necessary rather than accidental.
  *   **Failure:** Fails **Predictive Compatibility (3)** entirely (pre-scientific metaphysics). Struggles with **Ontological Distinction (2)**; he dismisses vocal/program music as inferior but lacks a robust mechanism for *why* the contamination occurs other than asserting concepts dilute the Will's mirror.

  **Modern Embodied-Cognition Account**
  *   **Performance:** High on **Predictive Compatibility (3)** and **Negativity (4)**. It frames dissonance as simulated bodily tension or motor conflict, explaining why violation moves us (simulated struggle). It handles the biology correctly.
  *   **Failure:** Struggles with **Immediacy (1)**. By grounding music in sensorimotor loops and simulation, it risks reducing the "metaphysical" feeling to a biological trick, losing the transcendental weight Schopenhauer identified. It often collapses **Ontological Distinction (2)** by treating program and absolute music as variations on the same cognitive simulation task, missing the qualitative shift Schopenhauer insisted upon.
