      *   *Fatal:* The **Modal Aggregation Explosion**. If we aggregate over *all* merely possible people, the set is likely infinite (or indefinitely large). The "collective good" of preventing their pain becomes infinite. This makes the duty absolute and paralyzing, but also metaphysically suspect. It relies on a specific, controversial counting of possibilia.
      *   *Fatal:* **Unfalsifiability/Epistemic Vacuity**. If the value lies entirely in the counterfactual absence of pain of non-existents, no actual policy can be evaluated against it without assuming the conclusion. It disconnects ethics from the actual world.
      *   *Awkward but Concedable:* **The Negative Utilitarian Collapse**. CAA effectively functions as Negative Utilitarianism (NU) but applied to possibilia. NU has issues with the "World Destruction" problem (destroying all sentient life prevents all future pain). A defender might concede this but bite the bullet.
