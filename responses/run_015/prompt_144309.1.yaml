  9.  **Refining the "Unfalsifiability" Objection:**
      *   If the good is in the *absence* of pain of *non-existents*, we can never measure it. We can only measure existing pain. Therefore, the "Collective Good" is a metaphysical posit with no empirical anchor. It renders the theory dogmatic.
