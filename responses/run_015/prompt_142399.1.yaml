answer: |-
  # Interpretability Representation Decision Tree

  **Context:** We assume calling a feature a "representation of X" means something more than "X is predictable from the activations."

  **Q1 (The Vestigial Feature):** If a direction predicts X perfectly and steering works, but causal scrubbing shows the model's processing never routes through it, is it still a representation of X?
  *   **YES** → Go to **Q2**.
  *   **NO** → Go to **Q2**.

  **Q2 (Empirical Settability):** Could perfect empirical evidence (probes, scrubbing, cross-model alignment) fully settle whether it is a representation?
  *   **YES** → (If Q1=YES) Go to **Leaf: Real Patterns**.
  *   **YES** → (If Q1=NO) Go to **Q4**.
  *   **NO** → Go to **Q3**.

  **Q3 (Fact of the Matter):** Is there a true fact about whether it's a representation, even if no evidence could settle it?
  *   **YES** → **Leaf: Upstream Disagreement**.
  *   **NO** → **Leaf: Deflationary**.

  **Q4 (The Chameleon):** If a feature is used causally now, but the model switches to a different encoding under mild distribution shift, does it lose its status as a representation?
  *   **YES** → **Leaf: Functional Role**.
  *   **NO** → Go to **Q5**.

  **Q5 (Seed Divergence):** If Model A encodes X linearly and Model B encodes X non-linearly, but both behave identically, does Model B lack the representation of X?
  *   **YES** → **Leaf: Format-Specific Realism**.
  *   **NO** → **Leaf: Causal Realism**.

  ***

  ### Leaf Positions

  | Position | Who Holds It | Empirical Settlement? | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **Real Patterns** | Engineers / Pragmatists | **Yes** | Phlogiston features count as representations if coherent in data. |
  | **Functional Role** | Mixed | **Yes** | Representations vanish when the model switches encoding under distribution shift. |
  | **Causal Realism** | Engineers | **Yes** | Vestigial features are not representations, even if perfectly predictive. |
  | **Format-Specific** | Engineers (Linear) | **Yes** | Model B lacks the representation despite identical behavior to Model A. |
  | **Deflationary** | Philosophers | **No** | No feature is ever "found"; they are maps we impose, not territory. |
  | **Upstream Disagreement** | Philosophers | **No** | A fact exists about representation status, but evidence is irrelevant to it. |

  ***

  ### Structural Notes & Impossible Paths

  **Inseparable Leaves:**
  *   **Deflationary vs. Upstream:** The tree separates these by "Fact of the Matter," but in practice, participants often waffle on whether a "fact" exists independent of verification. Distinguishing them requires metaphysical precision most engineers won't grant.

  **Impossible or Unstable Answer Combinations:**
  1.  **Q2=YES (Evidence Settles) + Q3=YES (Fact Beyond Evidence):** *Contradictory.* If evidence settles it, the fact is not beyond evidence.
  2.  **Q1=YES (Predictive Suffices) + Q4=YES (Chameleon Loses Status):** *Incoherent.* If prediction is sufficient for representation, causal stability under shift shouldn't matter.
  3.  **Q1=NO + Q2=YES + Q4=NO + Q5=YES:** *Unattractive.* Requires causality and specific format (linear), but ignores stability. Rarely held consistently.
  4.  **Q1=YES + Q2=NO + Q3=NO:** *Unexplored.* Predictive sufficiency + No Empirical Settlement + No Fact. (Why argue about it if it's just a useful map without facts?)
