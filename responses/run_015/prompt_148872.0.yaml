  # Diagnostic Tree: Overdetermination and Multi-Causal Explanation

  **Root Case:** In 1989 a regime collapses. Historians advance three apparently sufficient explanations: (1) long-term structural economic decay, (2) a contingent diplomatic blunder, and (3) a rapid mass-mobilization cascade.

  **Node 1:** Is causal overdetermination genuinely possible, or does every apparent case resolve into one dominant sufficient condition once background conditions are fully specified?
  *   **No (Resolves):** → **Leaf A**
  *   **Yes (Possible):** → **Node 2**

  **Node 2:** Does accepting overdetermination undermine counterfactual reasoning—specifically, is it incoherent to ask whether the collapse would still have occurred absent the diplomatic blunder if economic decay was already sufficient?
  *   **Yes (Undermines):** → **Leaf B**
  *   **No (Preserves):** → **Node 3**

  **Node 3:** Does narrative coherence require selecting a single dominant turning point, or can a historical account integrate multiple sufficient causal arcs without reducing one to the other?
  *   **Yes (Requires Single):** → **Leaf E**
  *   **No (Integrates Multiple):** → **Node 4**

  **Node 4:** If multiple sufficient causes are accepted and integrated, what distinguishes them such that they do not compete?
  *   **Distinct Modalities (Structural vs. Contingent vs. Agential):** → **Leaf C**
  *   **Distinct Explanatory Levels (Macro vs. Meso vs. Micro):** → **Leaf D**
  *   **No Distinction (Same Level and Modality):** → **Leaf F**

  ---

  ### Leaf Taxonomy

  **Leaf A: Resolutionist Monism**
  *   **Most Awkward Commitment:** Must claim that what looks like independent sufficient causes are actually fragments of a single hidden causal chain upon full specification.

  **Leaf B: Counterfactual Eliminativism**
  *   **Most Awkward Commitment:** Must deny the intelligibility of standard historical questions about what would have happened if a specific sufficient cause were removed.

  **Leaf C: Modal Pluralism**
  *   **Most Awkward Commitment:** Must assert that 'cause' means fundamentally different things when applied to structures versus agents, risking equivocation.

  **Leaf D: Level-Sensitive Pluralism**
  *   **Most Awkward Commitment:** Must maintain that a cause at one scale cannot invalidate a cause at another, even if they describe the same event.

  **Leaf E: Narrative Overdetermination**
  *   **Most Awkward Commitment:** Must admit multiple causes were sufficient yet insist the historian is obliged to ignore all but one for the sake of story.

  **Leaf F: 'unnamed'**
  *   **Most Awkward Commitment:** Must claim two distinct causes at the same level can each be fully sufficient without interacting or merging.
  *   **Diagnosis of Emptiness:** Emptiness stems from incoherence, as same-level sufficient causes typically interact to become jointly necessary or mutually undermining.

  ---

  ### Flagged Collapses

  **None.** The four branching nodes successfully separate all six leaves. (Note: Positions C and D share identical answers on distinctions (i)–(iii) and are separated only by the fourth node regarding explanatory basis.)
