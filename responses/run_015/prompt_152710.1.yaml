answer: |-
  This is a sophisticated and potentially very strong argument. It moves beyond the standard "Bentham was a radical" or "Bentham was a cold calculator" tropes and digs into the structural tensions within utilitarianism itself.

  Here is my honest read on the coherence, interest level, and potential pitfalls of your thesis.

  ### 1. Does it hang together?
  **Logically, yes. Historically, that's where the risk lies.**

  The theoretical framework is solid. You are correctly identifying that Bentham treats "public disgust" as a secondary pain—it only counts in the calculus if it leads to tangible consequences (like violence or social ostracization), not merely because the majority feels icky. You are also right that he applies this ruthlessly to animals (their suffering counts even if humans think they are inferior) and to homosexual acts (in his private writings, he argues the disgust is prejudicial).

  The leap you are making is that this consistency breaks down when it comes to **heterosexual non-reproductive sex**, and that this breakdown reveals a **gender asymmetry**.

  *   **The Logic:** If Bentham dismisses disgust regarding animals and gay sex, but *accepts* moral restrictions on straight non-reproductive sex, he is implicitly privileging a "natural" or "social" teleology (purpose) over pure pleasure in that specific instance. Since reproductive norms disproportionately burden women (in terms of bodily autonomy and social role), exposing this inconsistency does reveal a gendered blind spot.
  *   **The Risk:** The link between "non-reproductive heterosexual sex" and "gender asymmetry" needs to be tight. If Bentham opposes non-reproductive sex purely for Malthusian reasons (overpopulation hurts the general happiness), that is a *utilitarian* calculation, not necessarily a *gendered* one. To make your "gender asymmetry" claim stick, you need to show that Bentham's reasoning relies on traditional roles for women (e.g., women as mothers first, individuals second) in a way that he does not apply to men or animals.

  ### 2. Is it interesting?
  **Yes, very.**

  Most scholarship on Bentham and sex focuses on his defense of homosexuality (which was incredibly radical for the time) or his general views on punishment. Connecting his animal ethics to his sexual ethics via the mechanism of "disgust" is a fresh angle.

  The phrase **"interspecies moral consistency actually exposes an intraspecies gender asymmetry"** is a fantastic hook. It suggests that Bentham was more willing to cross the species barrier than he was to cross the gender barrier within humanity. That is a compelling irony for a philosopher who claimed to be a universalist.

  ### 3. Potential Counterexamples and Blind Spots
  You asked if you've missed obvious counterexamples. Here are the three biggest hurdles you will face from a knowledgeable reader:

  **A. Bentham's General Sexual Libertarianism**
  Bentham is often viewed as surprisingly liberal regarding heterosexual sex. He generally viewed sex as a pleasure like any other. If you claim he "lets popular morality influence his judgement" on heterosexual practices, you need specific textual evidence from his private manuscripts (like the *Offences Against One's Self* papers) where he balks at contraception or non-procreative marital sex. If he treats heterosexual pleasure as neutral, your argument loses its footing. You need to find where he draws the line.

  **B. The "Population" Defense**
  A critic might argue that Bentham isn't being inconsistent due to gender bias, but due to population utility. Bentham was aware of resource scarcity. He might argue that gay sex doesn't threaten population stability, but widespread heterosexual non-reproduction does. If he makes this argument, it's not a moral blind spot; it's a cold calculation. You need to preempt this by arguing that he overestimates the threat or that he applies this calculation selectively to women's bodies.

  **C. The "Gender" Label**
  Bentham was, in many ways, ahead of his time on women (he supported female suffrage in some contexts and criticized the legal subjugation of wives). If you claim he has a "gender asymmetry," be prepared for the counter-argument that he was actually one of the few men of his era who *didn't*. You might need to nuance this: perhaps the asymmetry isn't in his *intent*, but in the *structure* of his utilitarianism when applied to reproduction. Utilitarianism often struggles with the "family" unit, subsuming the individual woman's pleasure into the collective good of the population. That is a structural asymmetry, even if Bentham didn't intend it.

  ### 4. Suggestions for Sharpening the Argument

  *   **Refine the "Disgust" Mechanism:** Make sure you clearly define how disgust works in the calculus. Bentham calls it "antipathy." Your argument is that he correctly identifies antipathy as a false metric for animals and gay men, but fails to identify "reproductive duty" as a form of social antipathy/prejudice when applied to straight women.
  *   **Clarify the Heterosexual Claim:** Instead of saying he condemns all non-reproductive straight sex, look for where he prioritizes the *potential* for children over the *actual* pleasure of the parents. If he values the "future utility" of a child over the "present utility" of the mother's autonomy, that is where your gender asymmetry lies.
  *   **Keep the Animal Comparison:** Don't lose the animal angle. It's your strongest lever. The fact that he grants moral weight to a dog's pain over a human's prejudice, but denies moral weight to a woman's pleasure over society's reproductive norms, is a powerful contrast.

  ### Verdict
  It is not a forced link; it is a high-level critical reading. However, it relies heavily on you proving that Bentham actually held the conservative view on heterosexual reproduction that you are attributing to him. If you can substantiate that with his private notes, you have a very publishable, nuanced critique. If that evidence is thin, the argument might feel like you are imposing a modern critique onto a text that doesn't quite support it.

  **Go for it, but tread carefully on the historical evidence regarding his views on straight sex.**
