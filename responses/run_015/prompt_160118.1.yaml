      *Refinement:* Actually, in ELK, the "Human Simulator" head doesn't need the Predictor to know the truth; it just needs to predict the human. The "Direct Translator" needs the Predictor to know the truth. So Hans acts like a system where the Direct Translator *doesn't exist* or is untrained, and the Human Simulator took over.
      *Better framing:* Hans is a case where the "Human Simulator" head was selected by the training process (unintentionally) over the "Direct Translator" (which was absent). This is exactly the ELK selection worry.

      *Normative Input:* The user asks if "what the system knows" is underspecified. Yes. Hans knew posture. We wanted math. ELK needs to define the *target ontology*.

      *Fake Cues:* If Pfungst couldn't fool Hans, it suggests Hans wasn't perfectly tracking the cues, or the cues were too subtle for Pfungst to consciously replicate. In ELK terms: The "Human Simulator" is high-fidelity, hard to adversarially perturb.

