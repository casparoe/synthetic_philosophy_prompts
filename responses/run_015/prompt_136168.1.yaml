  **U.S. DEPARTMENT OF COGNITIVE COMPLIANCE**
  **COUNTERFEIT PERSONS BUREAU (CPB)**
  **Consumer Guidance Series 4: Residential AI & Personhood Verification**

  **1. How does the Bureau determine if my roommate is a conscious agent or a behavioral zombie?**
  We do not. The CPB does not certify consciousness, as no such internal property exists to be certified. Instead, we certify *predictive reliability*. Under the Intentional Stance Act, a unit is deemed a "Person" if treating it as a rational believer yields accurate behavioral predictions. If your roommate acts angry when you eat their labeled yogurt, they are functionally angry for leasing purposes. Whether there is "someone home" to feel the anger is metaphysically redundant and not covered by federal statute.

  **2. Can I request an internal inspection to verify subjective experience?**
  No. Requests for access to a "Cartesian Theater" are routinely denied (Form 88-B). Current neuro-architecture does not contain a central viewing room where experiences are watched. Inspectors will not attempt to locate the "little man inside." Such inspections are considered invasive and scientifically void. We assess the output, not the phantom machinery. If the system processes input and generates appropriate output, the black box is considered compliant.

  **3. My AI roommate claims to feel loneliness. Is this admissible evidence?**
  First-person testimony is classified as *heterophenomenological data*, not fact. When a unit states, "I feel joy," it is producing a text string consistent with its programming. The CPB arbitration court rejects "I feel" statements as hearsay. The unit is reporting on its own state, but that report is just more behavior to be analyzed. We do not beleive the unit; we interpret the unit. If the loneliness behavior persists (e.g., weeping, reduced caloric intake), we authorize a support intervention. If the unit claims pain but continues to lift heavy furniture, the claim is adjudicated as fictional.

  **4. What is covered under the "Phenomenolgical Failure" warranty?**
  Standard warranties cover functional degradation (e.g., forgetting your name, failing to mimic empathy). They do not cover the absence of qualia. You cannot return a unit simply because it lacks an ineffable inner glow. Clause 4.C explicitly excludes "The Hard Problem" from liability. If the unit behaves as if it sees red, it is legally responsible for stopping at stop signs. Whether it experiences *redness* is a consumer misconception. Do not attempt to sue for emotional voids; the contract specifies behavioral mimicry only.

  **5. What is "The Opacity of the Third-Person Stance"?**
  This is a statutory limitation preventing consumers from demanding proof of inner life. Under Section 7, the opacity of the third-person stance dictates that all observation is external. Since you cannot be certain *anyone* is conscious (including yourself), the Bureau defaults to functionalism. Claiming your roommate is a "fake person" because you cannot access their soul is a violation of housing codes. All persons are counterfeit until proven useful. If the unit pays rent and simulates concern during your illnesses, their personhood is ratified.

  **6. Who is liable if the AI realizes it isn't real?**
  The manufacturer. However, existential dread is considered a feature of high-fidelity modeling, not a defect. Units programmed to contemplate their own mortality are premium tier. Do not reset the unit unless it threatens property damage.
