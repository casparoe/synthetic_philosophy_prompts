answer: |-
  ### Menu of Readings: "You Can't Be Uncertain About Mathematics"

  | Reading | The Claim | Verdict | Impact on Your Five Cases |
  | :--- | :--- | :--- | :--- |
  | **1. Alethic Conflation** | Mathematical truths are necessary (true/false), so rational credence must be 1 or 0. | **Bunk.** Confuses the modality of truth (alethic) with the modality of belief (epistemic). | Forces you to abandon Cases 2, 3, 5. Implies your 70% confidence was irrational. |
  | **2. Logical Omniscience** | Standard probability axioms require credence 1 for all provable statements immediately. | **True for gods, false for humans.** Technically correct in standard Bayesian formalism but impossible for bounded agents. | Forces you to abandon Cases 2, 3, 5. Makes Case 3 (disagreement) impossible (one must be irrational). |
  | **3. Proof-Positivism** | If a proof exists *in principle*, uncertainty is irrational regardless of whether you've seen it. | **False.** Ignores that evidence is access-relative; you cannot condition on information you don't have. | Forces you to abandon Cases 2, 5. Makes Case 2 (working on a conjecture) epistemically wasteful. |
  | **4. Verification Infallibility** | Once you check a proof line-by-line, residual doubt is irrational (failure of nerve). | **False.** Ignores the non-zero probability of human error in verification (typos, subtle gaps). | Forces you to abandon Case 1 (if you feel any doubt) or gaslights you into false certainty. |
  | **5. Bounded Rationality** | Credence reflects computational limits; uncertainty is rational until proof is found/verified. | **Defensible.** Aligns with logical induction and actual mathematical practice. | **Preserves all Cases.** Validates Cases 2, 3, 5 as rational; treats Case 1 as high credence, not necessarily 1. |
  | **6. Professional Norm** | "Uncertainty" is forbidden speech to enforce rigor; act certain or don't publish. | **Substantive (Pragmatic).** A social rule for community coordination, not an epistemic truth. | Preserves Case 6 (don't rely on conjectures publicly); forces you to hide confidence in Cases 2, 5 privately. |

  ---

  ### Analysis of Departmental Uses

  Your professor is swapping between these readings to win arguments. Here is what he needs for each claim to hold, and whether it works:

  1.  **"No betting on conjectures."**
      *   **Required Reading:** *Logical Omniscience (2)* or *Alethic Conflation (1)*.
      *   **Verdict:** **Fails.** Betting markets price information and computational effort, not metaphysical truth. You *can* bet on whether a proof will be found by Tuesday. His claim shuts down useful heuristic calibration.
  2.  **"Checked proof = No residual doubt."**
      *   **Required Reading:** *Verification Infallibility (4)*.
      *   **Verdict:** **Fails.** Verification is a physical cognitive process subject to error. Residual doubt is rational insurance against human fallibility, not "failure of nerve."
  3.  **"Don't build on conjectures."**
      *   **Required Reading:** *Professional Norm (6)* or *Proof-Positivism (3)*.
      *   **Verdict:** **Partially Works.** As a policy for *publication*, this is sound risk management (Reading 6). As an epistemic claim that building on conjectures is irrational (Reading 3), it is false; much progress comes from exploring consequences of likely conjectures (Case 2).

  ### Analysis of Your Friend's Claim (Logical Induction)

  *   **Is it a precisification or replacement?** It is a **replacement**. It rejects the "Logical Omniscience" requirement of standard Bayesianism that underpins the slogan.
  *   **Does it vindicate the slogan?** No, it **buries it**. It shows that for any computationally bounded agent (i.e., all humans), uncertainty about mathematical truths is not just permissible but *required* for coherence.
  *   **Verdict:** Your friend is correct. The "computable Dutch book" condition is the rigorous way to say "you can be uncertain about math until you've actually done the computation." It validates Cases 2, 3, and 5 as rational states.

  ### Case Audit: What You Must Give Up

  If you accept the Professor's slogan literally (Readings 1–4):
  *   **You must abandon Case 2 (70% confidence):** You cannot rationally allocate effort based on likelihood of truth, only on likelihood of finding a proof (which is distinct).
  *   **You must abandon Case 3 (Disagreement):** Two rational agents cannot disagree on the probability of a lemma once they share the same axioms; one must be irrational.
  *   **You must abandon Case 5 (Heuristics):** Computational evidence cannot raise probability above 0 unless it constitutes a proof.

  If you accept the Friend's Reading (Reading 5):
  *   **You keep everything.** Case 1 becomes "credence very close to 1." Case 4 (Independence) is handled by assigning credence based on the utility of the axiom system rather than truth value.

  **Final Recommendation:** Treat the slogan as **Reading 6 (Professional Norm)** when dealing with publication and **Reading 5 (Bounded Rationality)** when doing actual research. Dismiss Readings 1–4 as philosophical confusion.
