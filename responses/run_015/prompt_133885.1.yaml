  4.  **Drafting - Section by Section:**

      *   *Welcome:* Warm up the room. Acknowledge the unusual pairing. "Philosophers who know the texts, Practitioners who live the reality."
      *   *The Ancient Challenge:* Paraphrase Glaucon. Two rings. One just, one unjust. If both are invisible, do they act the same? The fear of getting caught drives justice, not the love of goodness.
      *   *The Pivot:* But we aren't shepherds with magic bands. We are in offices, filling forms.
      *   *The Cracked Ring:* Define it. It's not magic invisibility. It's structural distance. I sign a budget cut; a family loses housing. I never see the family. The ring is cracked because the *connection* is broken, not because I'm hidden.
      *   *Philosophical Work:* Why stay moral?
