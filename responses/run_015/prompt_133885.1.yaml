  6.  **Final Review against Brainstorm:**
      *   Did I incorporate the epistemic shift (not knowing the victim)? Yes.
      *   Did I incorporate diffusion of agency? Yes (mentioned "hundred signatures").
      *   Did I incorporate the redefinition of "being seen"? Yes (connection vs. surveillance).

