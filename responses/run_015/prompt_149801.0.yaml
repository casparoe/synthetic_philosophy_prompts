prompt: |-
  I host a small podcast on decision theory and my guest next week is someone who defends superrationality — the Hofstadter line that in a one-shot Prisoner's Dilemma between two copies of yourself you should reason as if your move and theirs are the same event, so you pick the option that's best if everyone picks it. I don't want questions where she just re-explains the view and reruns the Platonia story; give me 6-8 questions, each with a follow-up keyed to the answer she's most likely to give. I want at least one that presses on whether this is anything more than evidential decision theory once you cash out what 'same algorithm' has to mean, one on near-copies (agents 99% algorithmically similar, not identical — does the reasoning degrade smoothly or cliff-edge, and why should similarity do that work?), and one built around a case I keep chewing on: the staggered run. Two instantiations of the same algorithm, but copy A is launched, its output sealed, and the seal is physically irreversible an hour before copy B is launched, and B knows all of this. If superrational cooperation survives that, what exactly is it tracking — and if it doesn't, how much of the view was just bookkeeping about causal loops? Add one question on the obvious jab that this is the categorical imperative with payoff matrices bolted on, and end with something that makes 'no serious view survives its own counterexamples' style deflection hard, asking what result or observation would actually make her give it up.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Host:** Podcast host on decision theory.
      *   **Guest:** Defender of superrationality (Hofstadterian view).
      *   **Core Concept:** Superrationality (one-shot PD between copies $\rightarrow$ reason as if moves are correlated/same event $\rightarrow$ maximize joint outcome).
      *   **Constraints:**
          *   6-8 questions total.
          *   Each question needs a follow-up keyed to the *most likely* answer.
          *   Avoid re-explanation/Platonia re-runs.
          *   **Required Topic 1:** Relation to Evidential Decision Theory (EDT) + "same algorithm" cash-out.
          *   **Required Topic 2:** Near-copies (99% similar) $\rightarrow$ Smooth degradation vs. cliff-edge? Why does similarity matter?
          *   **Required Topic 3:** The "Staggered Run" (Copy A runs/sealed before Copy B starts). Does cooperation survive? What is it tracking?
          *   **Required Topic 4:** Kant's Categorical Imperative comparison ("Categorical Imperative with payoff matrices").
          *   **Required Topic 5:** Falsification condition (What would make you give it up? No "no view survives counterexamples" deflection).
      *   **Tone:** Intellectual, probing, respectful but rigorous (suitable for a decision theory podcast).

  2.  **Deconstruct the Guest's Position (Superrationality):**
      *   *Core Claim:* Rational agents running the same algorithm in similar situations will output the same action. Therefore, my choice *is* their choice (logically, not causally).
      *   *Motivation:* Achieve cooperation in one-shot PD where Causal Decision Theory (CDT) defects.
      *   *Vulnerabilities:* Magical thinking accusations, definition of "same algorithm," temporal asymmetry, relation to EDT/Functional Decision Theory (FDT).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: EDT vs. Superrationality.*
          *   *Goal:* Press on whether this is just EDT with extra steps.
          *   *Draft:* Isn't this just EDT?
          *   *Refinement:* Make it specific about the "algorithm" mechanism. EDT conditions on the *act*, Superrationality conditions on the *reasoning process*.
          *   *Follow-up:* If she says "It's distinct because of logical correlation," ask about the physical substrate.
          *   *Selection:* Q1.

      *   *Question 2: Near-Copies (Similarity).*
          *   *Goal:* Smooth vs. Cliff-edge.
          *   *Draft:* What if they are 99% the same?
          *   *Refinement:* Focus on the *normative* weight. Why does a 1% difference in code change the rational prescription? Is there a threshold?
          *   *Follow-up:* If she says "Smooth," ask how we calculate the discount factor. If "Cliff," ask why logic cares about hardware noise.
          *   *Selection:* Q2.

      *   *Question 3: The Staggered Run (Temporal Asymmetry).*
          *   *Goal:* A runs, sealed, then B runs. B knows A is done.
          *   *Draft:* What if A goes first?
          *   *Refinement:* Emphasize the physical irreversibility. A's output exists in the universe before B starts thinking. If B cooperates, it can't *change* A. So why cooperate?
          *   *Follow-up:* If she says "Still cooperate," ask what causal/logical lever B is pulling. If "Defect," ask where the superrationality broke.
          *   *Selection:* Q3.

      *   *Question 4: Kant/Categorical Imperative.*
          *   *Goal:* Is this just deontology with math?
          *   *Draft:* Is this Kant?
          *   *Refinement:* Kant says "act only on maxims you can will as universal law." Superrationality says "act as if your algorithm is universal." Is the payoff matrix just a utilitarian veneer on a deontological core?
          *   *Follow-up:* If she says "Yes," ask about the role of consequences. If "No," ask about the source of the normativity.
          *   *Selection:* Q4.

      *   *Question 5: Falsification.*
          *   *Goal:* No easy outs.
          *   *Draft:* What would change your mind?
          *   *Refinement:* Pre-empt the "philosophical views aren't falsifiable" move. Ask for a specific *case* or *theorem* that would break it.
          *   *Follow-up:* If she hedges, press for a concrete scenario (e.g., Newcomb with a twist).
          *   *Selection:* Q5.

      *   *Need 1-3 more questions to reach 6-8.*
      *   *Idea 6: Evolution/Training.* How do superrational agents arise? If evolution selects for fitness, and defectors win in mixed pools, how does superrationality get a foothold?
      *   *Idea 7: The "Resoluteness" Objection.* If I pre-commit, I can force cooperation. Do I need superrationality or just binding pre-commitment?
      *   *Idea 8: Multiverse/Measure.* Does this rely on a many-worlds view? If there's only one universe, does the "logical correlation" lose its oomph?

      *   *Let's refine Idea 6 (Evolution) and Idea 7 (Pre-commitment) and add one on "Magic/Correlation".*
      *   *Actually, let's look at the "Logical Correlation" mechanism more closely.*
      *   *Let's add a question on "The Source of Normativity." Why *should* I care about my copy?*
      *   *Let's add a question on "Mixed Populations."*

      *   *Wait, I need to ensure the flow is good.*
      *   1. EDT/Algorithm distinction.
      *   2. Near-copies (Similarity).
      *   3. Staggered Run (Time).
      *   4. Kant (Ethics parallel).
      *   5. Evolution/Stability (How does this strategy survive?).
      *   6. Falsification (The closer).
      *   *That's 6. I need 6-8. Let's split the EDT one or add one on "Magical Thinking/Causality".*
      *   *Let's add one on "The Reference Class Problem." How do I know who counts as a copy?*
      *   *Let's add one on "Regret."*

      *   *Decision:*
          1.  EDT vs. Logical Correlation (Required).
          2.  Near-Copies/Smoothness (Required).
          3.  Staggered Run/Time (Required).
          4.  Kant/Categorical Imperative (Required).
          5.  Reference Class (Who counts as a copy?).
          6.  Evolutionary Stability (Why isn't this strategy eaten by defectors?).
          7.  Falsification (Required).
          *   *Wait, I need to check the count.* 1, 2, 3, 4, 5, 6, 7. That's 7. Perfect.

      *   *Refining Follow-ups:* The prompt asks for follow-ups keyed to the answer she's *most likely* to give. I need to anticipate the standard superrationalist defense.
      *   *Superrationalist Defense Patterns:*
          *   EDT: "No, EDT conditions on the act, we condition on the algorithm."
          *   Near-copies: "It's about probability of correlation, so it degrades smoothly."
          *   Staggered: "Time doesn't matter for logical facts. 2+2=4 regardless of when you calculate it."
          *   Kant: "Kant lacked the formalism; we are grounding it in rationality."
          *   Falsification: Often tricky. I need to pin her down.

  4.  **Final Polish:** Check tone. Ensure it sounds like a podcast host who knows the literature (mentions Hofstadter, Platonia, EDT, CDT). Ensure the "Staggered Run" is described clearly.

      *(Self-Correction during drafting)*: Make sure the "Staggered Run" question clearly establishes that A's output is *physically fixed* before B exists. This is the hardest pill for superrationality to swallow because it looks exactly like CDT territory (no causal lever).

      *(Self-Correction on Falsification)*: Make sure the follow-up blocks the "it's a normative view" escape hatch.

      *(Self-Correction on EDT)*: Ensure the distinction between "my act is evidence" (EDT) and "my reasoning determines theirs" (Superrationality/FDT) is clear.

  5.  **Final Review against constraints:**
      *   6-8 questions? Yes (I'll aim for 7 strong ones).
      *   Follow-ups included? Yes.
      *   Specific topics covered (EDT, Near-copies, Staggered, Kant, Falsification)? Yes.
