answer: |-
  Here are 7 questions designed to press the structural integrity of superrationality without asking for a recap of the basics. Each includes a follow-up tailored to the standard defensive moves a superrationalist typically makes.

  ### 1. The EDT Distinction
  **Question:** Critics often argue that superrationality is just Evidential Decision Theory (EDT) wearing a different hat. EDT says, "Condition on the act that gives the best expected utility," which often yields cooperation in Prisoner's Dilemmas if you think your act is evidence of the other's. You claim superrationality is distinct because it relies on *logical* correlation of algorithms rather than empirical evidence. But once we cash out "running the same algorithm," aren't we just positing a very strong prior correlation? If I strip away the Platonia story, what operational work is "logical correlation" doing that a sophisticated EDT agent with a strong prior on similarity isn't already doing?

  **Follow-up (If she argues EDT lacks the *mechanism* of logical necessity):**
  "You're saying EDT treats the correlation as contingent, while superrationality treats it as necessary. But if the physical universe is deterministic, isn't that contingency an illusion anyway? If the correlation is physically necessitated by the initial conditions, why isn't the 'logical' link just a description of a causal chain we can't see? Are we really escaping causal decision theory, or just drawing the causal boundary around 'algorithms' instead of 'atoms'?"

  ### 2. The Near-Copy Problem
  **Question:** Let's look at algorithmic similarity. If I'm playing against a perfect copy of myself, you say I should cooperate. But what if the other agent is 99% algorithmically similar to me? Maybe they have a slightly different random number generator seed or a minor bug in their code. Does the prescription to cooperate degrade smoothly as similarity drops, or is there a cliff-edge where superrationality suddenly stops applying? If it's smooth, how do I calculate the discount factor? If it's a cliff, why should rationality care about a single bit-flip in the substrate?

  **Follow-up (If she argues it degrades smoothly based on probability of correlation):**
  "If it degrades smoothly, then at some threshold of difference—say 60% similarity—superrationality tells me to defect, even though I know the other agent is *still* more likely to cooperate if I do. At that point, aren't you admitting that superrationality isn't about maximizing the actual outcome, but about satisfying a purity condition on the *source* of the decision? Why should I care about the purity of the source more than the actual payoff?"

  ### 3. The Staggered Run
  **Question:** Here's a case I struggle with: Copy A is launched, runs to completion, and its output is sealed in a physically irreversible box. One hour later, Copy B is launched, knowing everything about this setup, including that A's output is already fixed in the universe. Copy B cannot causally affect A. A standard superrationalist says B should still cooperate because they share the same algorithm. But if A's output is already a fact of the past for B, what exactly is B's reasoning tracking? Is it tracking the causal future, or is it tracking a logical abstraction that ignores the arrow of time? If it ignores time, isn't that just bookkeeping for a causal loop that doesn't exist?

  **Follow-up (If she argues logical facts are timeless):**
  "Logical facts are timeless, yes, but *instantiations* are not. If B defects, the universe contains (Cooperate, Defect). If B cooperates, it contains (Cooperate, Cooperate). But B cannot change the first coordinate. So when B reasons 'If I cooperate, A cooperates,' B is asserting a counterfactual that is physically impossible given the setup. Are you asking agents to reason as if they can change the past, or are you asking them to ignore the fact that the correlation has already been resolved?"

  ### 4. The Kantian Jab
  **Question:** There's an obvious objection that superrationality is just Kant's Categorical Imperative with payoff matrices bolted on. Kant says, 'Act only according to that maxim whereby you can at the same time will that it should become a universal law.' You say, 'Act as if your algorithm is universal among similar agents.' The main difference seems to be that Kant is deontological and you are consequentialist. But if the only reason I adopt the universal maxim is to get the payoff, haven't I just turned a moral duty into a prudential calculation? Does superrationality actually ground morality, or does it just show that morality is profitable for clones?

  **Follow-up (If she argues this grounds morality in rationality):**
  "If it's only profitable for clones or highly similar agents, then it doesn't ground morality for *dissimilar* agents. In a diverse world where I know my opponent reasons differently than me, superrationality seems to license exploitation. If your view implies I should defect against anyone who doesn't run my exact 'source code,' isn't that a form of tribalism rather than a universal ethics?"

  ### 5. The Reference Class Problem
  **Question:** To apply superrationality, I need to know who counts as a "superrational peer." But in the real world, I don't have access to other agents' source code. I have to infer it from behavior, culture, or biology. This creates a reference class problem. If I assume someone is a superrational peer and cooperate, but they are actually a CDT defector, I get sucker's payoff. How do I update my prior on who is a superrationalist without already having interacted with them? Isn't the strategy evolutionarily unstable in a mixed population because it gets eaten by defectors in the first round?

  **Follow-up (If she argues we signal our rationality):**
  "Signaling is cheap. A CDT defector can easily mimic the language of superrationality to exploit a cooperator. Unless there's a costly signal or a binding contract, the superrationalist seems doomed in a one-shot encounter with a stranger. If your theory only works in a world where everyone already *knows* everyone else is superrational, isn't it a theory for angels, not humans?"

  ### 6. Regret and Counterfactuals
  **Question:** Let's talk about regret. In Causal Decision Theory, if I cooperate and the other defects, I can say, "I did the right thing; they were the irrational one." In superrationality, if I cooperate and the other defects, I have to conclude that my reasoning about our similarity was wrong. But doesn't this create a strange feedback loop? If I defect, I preserve the hypothesis that we are similar (since we both defected), but I get a lower payoff. If I cooperate and they defect, I get a lower payoff *and* I have to update against my own rationality. Does superrationality force me to be dogmatic about my own similarity to others to avoid cognitive dissonance?

  **Follow-up (If she argues you update on the similarity, not the rationality):**
  "So if I get defected on, I conclude 'They aren't like me,' rather than 'Superrationality failed.' But that makes the view unfalsifiable in practice. Any failure of cooperation is explained away by a lack of similarity. How do I distinguish between a failure of the theory and a failure of my assessment of the opponent?"

  ### 7. The Falsification Condition
  **Question:** I want to end on where this view could break. Many philosophical positions survive counterexamples by treating them as edge cases. I want to know what would actually make you abandon superrationality. Is there a specific decision problem, a theorem, or an empirical observation about human or AI behavior that, if true, would force you to concede that Causal Decision Theory is the correct normative standard? If the answer is "nothing," are we discussing a decision theory or a faith commitment?

  **Follow-up (If she says "No view survives all counterexamples"):**
  "I agree no view is perfect, but they can be *wrong*. If I showed you a formal proof that in a specific class of staggered, asymmetric games, superrational agents consistently achieve lower utility than CDT agents even when playing against themselves, would that be enough? Or would you argue that utility isn't the only thing being maximized? I need to know if there's a world where you'd say, 'Okay, the math doesn't work here, I drop the view.'"
