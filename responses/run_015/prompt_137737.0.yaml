      *   *Must Land:* The distinction between *truth* and *evidentiary profile*. The history is likely true, but the *shape* is distorted.
      *   *Hope Nobody Asks:* "Does this undermine the legal findings at Nuremberg or Eichmann?" (Too dangerous). Or "What specific policy change do you want?" (Since there isn't one). Let's go with the policy change one, as it exposes the "so what?" for the law school crowd.

  6.  **Review against Constraints:**
