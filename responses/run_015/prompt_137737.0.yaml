      *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate Holocaust denial. The thesis is about *historiography*, not *facts of the genocide*. The replies must firmly maintain the reality of the genocide while critiquing the *methodological side effects* of defending it.
      *   *Crucial adjustment:* The FRE people might ask "What rule?" I need to admit there *isn't* a rule, but rather a meta-analysis of how rules shape history.
