      *   *Existing Readings:* Need to mention the "Conceiving-of/that" distinction (Hintikka) and the "Petitio Principii" (Warnock/Brueckner). Clarify that there is no consensus on the *best* reconstruction, only that the surface reading fails.
      *   *The Plan:*
