      *   **Scope Check:** 20 pages is tight for a deep dive into Berkeley scholarship + modal logic analysis. Needs to be focused.

  4.  **Refining the "Settled vs. Contested" Constraint:**
      *   *Settled:* Berkeley presents the argument in §22-23. It involves trying to conceive of unperceived objects. Most modern scholars think it is flawed.
      *   *Contested:* *Why* it is flawed. Is it a psychological error? A logical error? Does it rely on the "likeness principle"? Is there a charitable reconstruction that saves it (e.g., as a reductio on the materialist's own terms)?
      *   *User's specific claim:* That the scope conditions *require* the ideational theory. This is definitely a specific interpretation, not consensus. I need to make sure the prospectus frames this as a hypothesis to be tested, not a fact.

  5.  **Addressing the "Too Big?" Question:**
      *   20 pages is roughly 6,000-8,000 words.
      *   Covering the text, the template, the taxonomy, the comparison with Hintikka/Warnock, and the conclusion is ambitious.
      *   *Advice:* Narrow the taxonomy. Don't try to solve all epistemic logic. Focus strictly on how the template applies to Berkeley's specific text.

  6.  **Developing the Content (Iterative refinement):**

