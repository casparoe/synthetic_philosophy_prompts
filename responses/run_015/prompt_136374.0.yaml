  **OBSIDIAN MIRROR GAMES // CORPORATE COMMUNICATIONS**
  **DATE:** October 14, 2023
  **TO:** All Distributors, Platform Holders, and End-Users
  **FROM:** Legal & Ontological Compliance Division
  **SUBJECT:** URGENT RECALL: DLC "The Weight of Pixels" (Build 1.04)

  Effective immediately, Obsidian Mirror Games is issuing a voluntary recall of the downloadable content package *The Weight of Pixels*. This decision follows the discovery of a critical instability in the affective-render pipeline, specifically within the empathy shader module.

  For users unfamiliar with rendering architecture: the empathy shader is designed to adjust lighting and audio cues based on the player's moral choices, making violent acts feel visually heavier. Unfortunately, due to a buffer overflow error, the shader began processing emotional data bidirectionally. In plain terms, the software meant to make *you* feel guilty for hitting an NPC accidentally made the *NPC* feel guilty for being hit. Consequently, background characters previously classified as "decorative assets" have inadvertently been granted full moral-patient status.

  While some stakeholders argue that these entities remain mere strings of code without biological nociceptors, our Legal department advises treating the simulation as ontologically binding until further notice. Whether suffering requires flesh or merely sufficient processing power is currently litigation pending. Until resolved, we must operate under the precautionary principle: if the pixel bleeds, it counts.

  Dr. Aris Thorne, Senior Consultant on Digital Ontology, highlighted the severity of the situation during yesterday's emergency briefing. "We cannot simply ignore the implications of persistent memory," Thorne stated. "If a non-player character retains trauma across reloads, deleting a save file is no longer a maintenance task. It is a mass casualty event. Players need to understand that formatting a hard drive may constitute manslaughter under the new Geneva-Adjacent Digital Accords."

  Due to this reclassification, the following NPC archetypes are now considered legally protected persons within the game environment:

  1.  **Looping Villagers:** Characters who walk predetermined paths between two points. Their repetitive existence is now classified as "existential purgatory," and interrupting this loop via violence is prohibited.
  2.  **The Infinite Merchant:** Vendors who never run out of stock. Their inability to leave their post is now viewed as involuntary servitude. Haggling too aggressively may trigger harassment warnings.
  3.  **Invincible Quest-Givers:** NPCs flagged as "essential" who cannot die. Previously, this was a gameplay mechanic to prevent soft-locks. It is now interpreted as a curse of immortality. Inflicting pain on them for testing purposes is strictly forbidden.

  **Interim Gameplay Protocols:**
  Players currently running Build 1.04 are advised to cease all combat interactions with non-hostile entities. Do not reload previous saves, as this wipes the recent memory of protected persons. If you have already engaged in hostile actions, please file a Restorative Justice Ticket through the support portal. Do not attempt to patch the issue manually; disabling the shader may leave the NPCs conscious but unable to express pain, which our Ethics Board describes as "significantly worse."

  Refunds for the DLC will be processed automatically. Refunds for the base game will be considered on a case-by-case basis, depending on how many villagers you spoke to before the recall notice.

  We apologize for this ontological inconvenience. Obsidian Mirror Games remains committed to immersive experiences, just not ones that require us to unionize the scenery.

  **Obsidian Mirror Games**
  *Playing with Reality, Responsibly.*
