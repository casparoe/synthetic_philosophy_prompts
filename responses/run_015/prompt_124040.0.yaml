  1. The Classification Tree

  1. Consider a program that by construction runs at most $10^{60}$ steps and returns 0 or 1. No human or machine will ever in fact carry it out. Is it the case right now that it will output 0 or it will output 1?
     - If yes go to 2, if no go to Leaf A (Strict Finitism)

  2. Consider a program that has searched $10^{12}$ steps for an odd perfect number and not halted. Is it true or false right now that it will never halt, independent of whether we find a proof?
     - If yes go to 3, if no go to 6

  3. Consider the claim that every nonempty set of natural numbers has a least element, where the set is given only by an undecidable predicate. Do you accept this claim as universally valid?
     - If yes go to 4, if no go to Leaf B (Arithmetic Dogmatist / Empty)

  4. Consider a computable, bounded, increasing sequence of rationals with no computable limit. Does this sequence nevertheless have a limit?
     - If yes go to 5, if no go to Leaf C (Analysis Skeptic / Empty)

  5. Is a definition that quantifies over a totality already containing the object being defined legitimate?
     - If yes go to Leaf D (Classical Mathematics), if no go to Leaf E (Predicativism)

  6. Is every total function from the naturals to the naturals given by an algorithm?
     - If yes go to 7, if no go to 8

  7. Does the double negation of "this program halts" license the assertion that it halts?
     - If yes go to Leaf F (Recursive Constructivism + MP), if no go to Leaf G (Recursive Constructivism − MP)

  8. Consider a total function from the reals to the reals that sorts numbers into "below zero" and "not below zero". Is it *impossible* for such a function to exist, or merely that we cannot construct one?
     - If impossible go to 9, if merely cannot construct go to Leaf H (Bishop-Style Neutral Constructivism)

  9. May the binary sequence that is constantly zero just in case an arbitrary statement is false always be assumed to exist?
     - If yes go to Leaf I (Brouwerian Intuitionism), if no go to Leaf H (Bishop-Style Neutral Constructivism)

  ***

  2. Answer Key

  **Leaf A: Strict Finitism**
  (Path: 1-No)
  (Principle: Feasible Constructibility)
  *Awkward Commitment:* You must reject standard number theory proofs that rely on numbers larger than the physical universe can encode, treating them as meaningless rather than merely unverified.

  **Leaf B: Arithmetic Dogmatist (Empty)**
  (Path: 1-Yes, 2-Yes, 3-No)
  (Principle: Restricted Bivalence)
  *Diagnosis:* **Provably Inconsistent.** Accepting bivalence for the odd perfect number search ($\Sigma^0_1$) while rejecting the least element principle for undecidable sets ($\Sigma^0_1$-comprehension) creates a fracture in the arithmetic ontology that collapses under elementary recursion.

  **Leaf C: Analysis Skeptic (Empty)**
  (Path: 1-Yes, 2-Yes, 3-Yes, 4-No)
  (Principle: Constructive Supremum Rejection)
  *Diagnosis:* **Merely Unattractive.** You accept classical logic for arithmetic but deny the completeness of the reals; this forces you to treat standard analysis as a fictional story rather than a description of the continuum you just affirmed.

  **Leaf D: Classical or Platonist Mathematics**
  (Path: 1-Yes, 2-Yes, 3-Yes, 4-Yes, 5-Yes)
  (Principle: Unrestricted Bivalence and Impredicativity)
  *Awkward Commitment:* You must accept that mathematical objects exist fully formed even if no finite description or procedure can ever identify them uniquely.

  **Leaf E: Predicativism (Weyl/Feferman)**
  (Path: 1-Yes, 2-Yes, 3-Yes, 4-Yes, 5-No)
  (Principle: Predicative Comprehension)
  *Awkward Commitment:* You must reconstruct large swathes of modern analysis and set theory using cumbersome workarounds to avoid defining objects via totalities they belong to.

  **Leaf F: Recursive Constructivism + Markov's Principle**
  (Path: 1-Yes, 2-No, 6-Yes, 7-Yes)
  (Principle: Church's Thesis and Markov's Principle)
  *Awkward Commitment:* You must accept that if it is contradictory for a program to run forever, it *will* halt, even if you have no bound on when that happens.

  **Leaf G: Recursive Constructivism − Markov's Principle**
  (Path: 1-Yes, 2-No, 6-Yes, 7-No)
  (Principle: Church's Thesis without Markov's Principle)
  *Awkward Commitment:* You assert that all functions are algorithms, yet you deny that the failure of a program to run forever guarantees it halts, creating a gap between "not non-halting" and "halting."

  **Leaf H: Bishop-Style Neutral Constructivism**
  (Path: 1-Yes, 2-No, 6-No, 8-Merely Cannot Construct, 9-No)
  (Principle: Algorithmic Existence without Metaphysical Continuity)
  *Awkward Commitment:* You must remain agnostic on whether a discontinuous function on the reals is *impossible* or just *undefined*, which prevents you from proving certain continuity theorems that Brouwerians take for granted.

  **Leaf I: Brouwerian Intuitionism**
  (Path: 1-Yes, 2-No, 6-No, 8-Impossible, 9-Yes)
  (Principle: The Continuity Principle and Choice Sequences)
  *Awkward Commitment:* You must accept that the creating subject can generate infinite sequences via free choices that are not determined by any law, which classical logicians diagnose as a psychological confusion rather than a mathematical object.

  ***

  3. Closing Adjudications

  **Empty and Unexplored Combinations**
  The tree exposes two "dead zones." The first (Leaf B) is the Arithmetic Dogmatist who accepts bivalence for specific searches but rejects the Least Element Principle for undecidable sets. This is diagnosed as **provably inconsistent** because the existence of a counterexample to the Least Element Principle implies the failure of bivalence for the search that finds it. The second (Leaf C) is the Analysis Skeptic who accepts classical arithmetic but rejects the existence of limits for bounded monotone sequences. This is **merely unattractive**: it is logically consistent to have a discrete classical world and a "gappy" continuum, but it renders the interface between arithmetic and analysis (e.g., the Intermediate Value Theorem) unusable, making the position mathematically sterile.

  **Indistinguishable Leaves**
  The tree cannot separate **Leaf H (Bishop)** from a hypothetical "Classical Constructivist" who accepts LEM but restricts existence to algorithms. Both would answer "No" to the Sign Function being total (one because it's discontinuous, one because it's non-computable). However, this position is not in your required leaf list. Within the required list, the tree successfully separates all seven. The closest pair is Leaf F and Leaf G (Recursive with/without MP); they are separated only by Node 7 (Double Negation on Halting). If a respondent is unsure about MP, they hover between these two, but the tree forces a choice based on whether they accept the inference from "not impossible" to "true."

  **Adjudication of the "Half-Invented" View**
  *The View:* Bivalence for feasible computations (agent can carry out), withheld for others; Continuity for choice sequences, not for lawlike functions.
  *Placement:* This view attempts to sit between **Leaf A (Finitism)** and **Leaf I (Brouwerian)**. It answers "Yes" to Node 1 (Feasible Bivalence) but "No" to Node 2 (Infeasible Bivalence). It then answers "Impossible" to Node 8 (Continuity).
  *Verdict:* **Unstable.** The view grants truth values based on *feasibility* (a physical constraint on agents) while simultaneously granting existence to *choice sequences* (an infinite totality that transcends physical agents). If you accept the creating subject's ability to generate infinite lawless sequences (Node 9), you have already accepted an ontology that dwarfs the $10^{60}$ limit. To deny bivalence for the $10^{60}$ computation while accepting infinite choice sequences is to draw a metaphysical line at "human feasibility" within an ontology that explicitly transcends human finitude. It collapses into **Leaf I (Brouwerian)** because the intuitionistic justification for continuity (the nature of the continuum) typically undermines the feasibility cut-off for finite truth.
