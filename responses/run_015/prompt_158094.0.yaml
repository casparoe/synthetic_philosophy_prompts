      *   *Impact on Paradox:* If Admission is open (permissive), can Reach mitigation save us?
      *   *Verdict:* It helps, but doesn't solve the Control Plane Capture risk. If the intolerant group organizes off-platform and floods the input, ranking filters might buckle under volume or gaming. Also, if they gain admin access (capture), they change the ranking algo.
      *   *Is it just relabeling?* No, it's actionable. It allows for "Soft Blocking" (downranking) vs. "Hard Blocking" (403). It changes the *cost function* of the enforcement.

  6.  **The Classifier/Label Problem:**
