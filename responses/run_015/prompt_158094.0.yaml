      *   *Structure:*
          1.  System Spec Translation (The Core Request).
          2.  Residue Report (What fits/doesn't).
          3.  Stress Test (Delivery vs. Reach).
          4.  Evidence Question.
      *   *Refining the "Delivery vs. Reach" section:* Make sure to validate the user's intuition. It *is* a valuable distinction. It maps to `403 Forbidden` vs. `200 OK` + `visibility_score = 0.01`.
      *   *Refining the "Evidence" section:* Focus on *observability*. Latency in moderation queues, ratio of appeals to upholds.

