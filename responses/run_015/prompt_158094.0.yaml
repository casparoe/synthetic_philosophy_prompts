  2.  **Deconstruct Popper's Argument (Mental Model):**
      *   *Premise:* A tolerant society allows all views.
      *   *Threat:* Intolerant views (specifically those that reject tolerance as a principle) exploit this openness.
      *   *Mechanism:* They organize, suppress dissent, and eventually seize power.
      *   *Result:* Tolerance is destroyed.
      *   *Conclusion:* To maintain tolerance, the society must reserve the right to suppress intolerance *before* it destroys the system.
      *   *Caveat:* Suppression should be a last resort, used only when rational argument fails and the threat is imminent/active.

  3.  **Translation Phase (System Design Mapping):**

      *   *Unlimited Tolerance:* Default `ALLOW` policy on admission control. Zero friction on resource consumption (compute, bandwidth, attention). High rate limits.
      *   *Intolerant Movement:* Adversarial actor group. Goal: Monopolize the control plane. Vector: Organized harassment, doxxing, flooding (DDoS on human attention), exploiting appeal loops to exhaust moderation resources.
      *   *Failure Mode:* Control Plane Capture. The attackers become the admins. They rewrite the policy code to `DENY` everyone else. System availability for legitimate users drops to zero.
      *   *The Fix:* A "Tolerance Enforcement Service" (TES). Interface: `check_tolerance(actor, content)`. Action: Rate limit, shadow ban, or hard ban. Authority: Root access (Kill Switch).
      *   *Objections:* "Concrete Threat" = Monitor for specific exploit attempts (e.g., coordinated brigading) vs. "Speculative" = Ban based on ideology (static analysis of content without runtime behavior).

  4.  **Residue Report (Gap Analysis):**
      *   *Clean Translates:* Resource exhaustion, control plane capture, asymmetric error costs (false positive ban vs. false negative allow).
      *   *Distorted:* "Rational argument" (Popper's first step) doesn't map well to automated systems. It's more like "graduated enforcement" (warn -> throttle -> ban).
      *   *No Expression:* The *moral value* of tolerance itself. Why do we want this system? System design optimizes for stability/engagement, not "liberty." The *normative* claim is outside the schema.

