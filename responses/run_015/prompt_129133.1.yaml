answer: |-
  Good evening. Looking around this marquee, seeing the light catch the glass and the faces of the people who matter most to us, it is easy to feel the weight of the occasion. We gather to mark a change. Not a continuation of what came before, but a turn into something new.

  Callum, you are my brother. I have watched you grow into the man standing here tonight. Amara, you entered our lives when the ground was unsteady beneath us. You were there in the ward, during the days our mother was dying. That care belongs to history. It brought you into contact with this family, but it is not the foundation you are building now. You are building something new, distinct from the gratitude we hold. You are here because of what exists between the two of you, not because of what happened around you. The debt is ours, not yours. The love is yours alone.

  I have been watching you both. Not measuring, just looking. There is a quality to how you occupy a room together. It is in the way you pass a conversation back and forth, neither holding it too long, neither letting it drop. It is in the quiet signals across a crowded kitchen, the way a cup of tea appears without a request being spoken. You attend to the space between you. To notice is to see what is there. To assess is to weigh it against something else. I am not weighing you. I am seeing you.

  [Insert specific memory of them navigating a difficult moment together]

  That moment showed something essential. It showed that when things press hard, you do not turn away. You turn toward the difficulty, and toward each other. You treat the problem as something shared, rather than something one of you must carry.

  And then there are the smaller things. The things that do not make a story but make a life. The rhythm of a Sunday morning. The way you laugh at a joke that no one else heard.

  [Insert specific memory of a small, mundane joy they share]

  These details matter. They are the substance of the promise you are making. A promise is not a prediction. It is not a claim that nothing will change. It is an agreement to meet the changes as they come. It is not about protecting what you have built, but about building what comes next.

  People often speak of the past as a reason for this step. They count the years, the leases signed, the tickets bought. Those are facts. They are not the reason. The reason is found in the present tense. It is found in the choice you make today, fresh, without the inertia of yesterday pushing you. You are choosing this, now. That is what makes it hold. A reason to stay must be found in the thing itself, not in the cost of leaving.

  Callum, I know how much the music matters to you. I know what it means to have a song ready, to stand up and play it for the people you love. Tonight, the band will play later. There will be noise and movement. But right now, in this quiet, you are making a different kind of sound. You are setting a tone. The music will fade, but the tuning remains.

  There are no guarantees in this. There is no script that ensures a specific outcome. There is only the attention you pay to one another. If you keep looking, really looking, you will find the reason to stay in the thing itself, not in the cost of leaving.

  So I offer no wishes for fortune. Fortune is for things outside your control. I am not saying you are finished. You are not. You are real.

  Raise your glasses. To the work ahead. To the attention required. To Callum and Amara.

  ***

  **Note on Construction**

  The structural load-bearing sentence is: "A reason to stay must be found in the thing itself, not in the cost of leaving." This anchors the toast against the "wrong-kind" reasons problem by locating value intrinsically rather than instrumentally.

  To hold this distinction, I gave up the conventional toast move of validating the couple through their history. Usually, a speaker cites longevity ("six years together") or survival ("through hard times") as proof of viability. I had to frame those as mere facts, explicitly stripping them of normative force, to avoid the "wrong-tense" error you identified.

  I cheated slightly on the "uptake-safety" constraint. The line "The debt is ours, not yours" is safe for them, but it publicly performs the family's separation of gratitude from love, which is a risky rhetorical move in itself. It borders on assessing the family's attitude rather than just noticing the couple.

  Regarding your distinctions: the "wrong-tense" distinction is philosophically confused. You argue past history is a reason to *continue* but not to *promise*. However, fidelity is precisely the commitment to treat past shared identity as a reason for future action. By treating history only as inertia, you risk emptying the commitment of its content. The past isn't just a sunk cost; it is the material the promise is made of. Distinguishing them too sharply leaves the promise hanging in a vacuum.
