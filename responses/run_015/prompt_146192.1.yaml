      *   *5. Scoring Discipline:* Calibrated probabilities, log loss, prefer wide error bars.
      *   *6. Verdict (US):* ~50% chance US Constitutional order fails by 2100. Reason: Long untested runs are fragile (accumulated failure modes).
      *   *7. AI Industry:* Fast-moving industry base rates trump inside info.

  3.  **Identify Tensions (Brainstorming):**
      *   *Tension A (Points 2 & 4):* Causal reference classes vs. Constant Hazard. If you select classes based on *generative processes* (e.g., succession crises, fiscal strain), does a constant hazard model make sense? Different generative processes usually imply different hazard functions (e.g., wear-out vs. infant mortality vs. random shock). Constant hazard implies *one* specific generative process (Poisson process/random external shocks). If I believe in specific causal mechanisms (Point 2), why do I assume a memoryless distribution (Point 4)?
      *   *Tension B (Points 1 & 6):* Outside View First vs. The "Fragility of Long Runs" Argument. Point 1 says anchor on base rate and move slightly. Point 6 makes a specific mechanistic claim ("long untested runs are fragile") to justify a specific deviation (50% by 2100). Is "fragility of stability" a validated inside view factor, or is it a just-so story? If it's a base rate claim, does the data support "fragility of stability" for polities?
      *   *Tension C (Points 3 & 2):* "No Unique Events" vs. "Causal Reference Classes." If classes are defined by specific generative processes, classes become very narrow. If classes are very narrow, base rates become noisy/unreliable. This is the "Reference Class Forecasting" problem.
      *   *Tension D (Points 4 & 6):* Constant Hazard vs. Fragility of Stability. Constant hazard means $P(\text{fail} | \text{survived } t) = P(\text{fail} | \text{survived } 0)$. Point 6 argues $P(\text{fail} | \text{survived long time}) > P(\text{fail} | \text{survived short time})$ because of accumulated unexercised failure modes. This is literally an *increasing* hazard rate (senescence), which Point 4 explicitly denies. **This is the biggest contradiction.**

  4.  **Develop the Tensions (Drafting the Audit):**

      *   *Severity 1: Point 4 (Constant Hazard) vs. Point 6 (Fragility of Stability).*
          *   *Conflict:* Point 4 says hazard is constant (memoryless). Point 6 says hazard increases with time (untested systems degrade).
          *   *Resolution:* One must go. If 6 is right, 4 is wrong. If 4 is right, 6's reasoning is flawed (though the number might be right by luck).
          *   *Cost:* Dropping 4 loses the clean mathematical model. Dropping 6's reasoning undermines the specific US forecast.
          *   *Revision:* Adopt a Weibull distribution or a mixture model. Allow hazard to vary by regime type.

      *   *Severity 2: Point 2 (Causal Classes) vs. Point 4 (Aggregated Base Rate).*
          *   *Conflict:* Point 2 says group by mechanism. Point 4 uses "large polities" (2-4 centuries) as a single aggregate class. "Large polities" is a surface feature, not a causal mechanism.
          *   *Resolution:* If 2 is strict, 4's base rate is invalid.
          *   *Cost:* Narrower classes = fewer data points = higher variance.
          *   *Revision:* Hierarchical modeling. Use the aggregate as a prior, update with causal sub-class data.

      *   *Severity 3: Point 1 (Small Adjustments) vs. Point 7 (AI Industry).*
          *   *Conflict:* Point 1 says inside view moves you little. Point 7 says AI industry will look *substantially* different. Is "substantially different" a small adjustment from the base rate of "industries last X years"? Or is the base rate for "fast-moving concentrated industries" distinct enough to justify the move?
          *   *Resolution:* This is weaker. It depends on how "fast-moving concentrated industries" is defined.
          *   *Cost:* Minimal.
          *   *Revision:* Clarify the reference class for AI.

  5.  **Address the "Settled vs. Contested" Requirement:**
      *   *Settled:* Calibration matters. Base rates are better than uncalibrated inside views. Log loss is the right scoring rule for probabilities.
