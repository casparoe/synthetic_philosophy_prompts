      *   *Crucial Catch:* The user claims Point 4 (Constant Hazard) but justifies Point 6 (US Failure) with *increasing* hazard logic (accumulated fragility). This is the smoking gun. I must highlight this aggressively.
      *   *Nuance on Point 2:* Causal classes are good, but they destroy sample sizes. This is the "Reference Class Problem."
      *   *Nuance on Point 4:* The user dismisses survivorship bias too easily. In survival analysis, ignoring right-censoring (polities still alive) biases the mean lifespan downward if not handled correctly, but the user says "average of completed cases." This ignores the information in the *ongoing* cases.

