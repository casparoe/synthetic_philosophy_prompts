  *(Self-Correction during drafting)*: Wait, regarding Point 4 and survivorship bias. The user says "I don't worry that the historical record is a sample of polities that have already ended." If they take the average of *completed* cases, they are ignoring the *censored* data (polities still alive). In survival analysis, ignoring censored data biases the estimate of the hazard rate if the hazard is not constant. If the hazard is constant, the average of completed cases is an unbiased estimator of the mean lifetime ($1/\lambda$). So, Point 4 is internally consistent *only if* the hazard is actually constant. But Point 6 argues it *isn't* constant. So the tension holds.

