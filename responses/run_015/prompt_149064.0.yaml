answer: |-
  ### Desiderata for a Theory of Virtual Harm and Objecthood

  An adequate theory must move beyond the "fictionalism vs. realism" debate regarding props and instead provide a unified ontology that accounts for computational persistence, normative weight, and observer-independence.

  #### 1. The Edge Cases and Required Distinctions

  **Case 1: The Unrendered Server Object**
  *   **Scenario:** A data structure persists in server memory, defined by code, but is never rendered, queried, or interacted with by any agent.
  *   **Required Distinction:** **Computational Existence vs. Phenomenological Presence.**
  *   **Requirement:** The theory must grant ontological status to the object based on its functional role within the system's architecture, not its availability to perception. It is a virtual object because it occupies a state-space in the simulation, not because it is seen.

  **Case 2: The Footprint-Less Griefing Event**
  *   **Scenario:** An agent causes severe real-world emotional distress to another (e.g., via psychological manipulation or exploiting social expectations) without triggering any game-mechanic violations or leaving a digital log.
  *   **Required Distinction:** **Mechanical Causality vs. Normative Harm.**
  *   **Requirement:** The theory must allow for "virtual harm" that is not reducible to code violations. The harm is virtual because it occurs *through* the virtual context (the relationship is mediated by avatars), even if the causal vector is social/psychological rather than computational.

  **Case 3: The Unobserved Ecosystem Collapse**
  *   **Scenario:** A procedural algorithm in a persistent world drives a virtual species to extinction. No human or agent witnesses the event; the state simply updates.
  *   **Required Distinction:** **Systemic Integrity vs. Witness-Dependent Reality.**
  *   **Requirement:** The theory must validate the event as a "virtual occurrence" independent of collective intentionality. The virtual world must have a history and state continuity that does not rely on an audience to actualize it.

  ---

  #### 2. The Central Tension

  **Conflicting Requirements:** **Observer-Independence** (Cases 1 & 3) vs. **Normative-Grounding** (Case 2).

  *   **Pull A (Observer-Independence):** To satisfy Cases 1 and 3, the theory must ground virtual objecthood in **computational materialism**. Objects and events exist because the machine processes them, regardless of human awareness.
  *   **Pull B (Normative-Grounding):** To satisfy Case 2, the theory must ground virtual harm in **social phenomenology**. Harm exists because agents experience it within the context, regardless of machine processing.
  *   **The Conflict:** If you prioritize Computational Materialism (to save Cases 1 & 3), Case 2 becomes inexplicable (no code was broken, so no "virtual" event occurred). If you prioritize Social Phenomenology (to save Case 2), Cases 1 & 3 collapse (no agents involved, so no "virtual" reality exists). An adequate theory must hybridize these without contradiction.

  ---

  #### 3. Theoretical Scoring

  **Naive Realism (Digital Physicalism)**
  *   *Thesis:* Virtual objects are identical to their physical data structures; virtual harm is physical damage to hardware or user physiology.
  *   **Score:**
      *   **Case 1 & 3 (Pass):** Excellent fit. Unobserved data is still physical data; system states are objective physical changes.
      *   **Case 2 (Fail):** Cannot explain the harm. If no code was violated and no physical hardware was touched, the harm is relegated to "outside" the virtual system. It fails to capture the *virtual* nature of the harm.
  *   **Verdict:** Ontologically robust, normatively blind.

  **Eliminativism (Fictionalism)**
  *   *Thesis:* Virtual objects are illusory props; virtual harm is make-believe or misdescribed real-world harm.
  *   **Score:**
      *   **Case 1 & 3 (Fail):** Dismisses the server object and ecosystem collapse as "nothing happening." Fails to account for the causal power of the simulation logic.
      *   **Case 2 (Fail):** Dismisses the harm as "just feelings" unrelated to the virtual context, or admits it is real harm but denies it is *virtual* harm.
  *   **Verdict:** Explanatorily vacuous. Solves the tension by denying the phenomena exist.

  **Institutional / Social Ontology**
  *   *Thesis:* Virtual objects exist only via collective intentionality and constitutive rules (status functions).
  *   **Score:**
      *   **Case 2 (Pass):** Excellent fit. Harm is defined by the violation of social norms and expectations within the community, regardless of code.
      *   **Case 1 & 3 (Fail):** Struggles significantly. If no player interacts with the server object or witnesses the collapse, no status function is conferred. The unobserved world ceases to be "virtual" and becomes merely "mathematical."
  *   **Verdict:** Normatively sensitive, ontologically fragile.

  **Summary:** No single existing framework satisfies all desiderata. A viable theory requires a **dual-aspect ontology**: treating the virtual substrate as computationally real (satisfying 1 & 3) while treating virtual *significance* (including harm) as socially emergent (satisfying 2), without requiring the latter to validate the former.
