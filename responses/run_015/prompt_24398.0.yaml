answer: |-
  Here is a specification of the theoretical requirements for a Lexical-Threshold Negative Utilitarianism (LT-NU), followed by an analysis of the internal tensions and a comparative evaluation of the three major frameworks.

  ### The Desiderata for a Theory of Hedonic Commensurability

  For LT-NU to function as a coherent moral theory, the underlying account of pleasure and pain must satisfy the following six conditions.

  **1. The Asymmetry Requirement (The Torture Case)**
  *   **Requirement:** The theory must posit a structural asymmetry between the disvalue of suffering and the value of pleasure. They cannot be mirror images on a single linear scale.
  *   **Case:** A world containing one person being tortured for a year versus a world containing billions of people experiencing mild, fleeting joy. LT-NU dictates the torture world is worse, regardless of the number of joyful people.
  *   **Constraint:** The theory cannot treat pain as simply "negative pleasure." If pleasure is $+x$ and pain is $-x$, aggregation will always allow enough $+x$ to outweigh $-x$. The function must be non-linear or discontinuous.

  **2. The Threshold Distinction (The Hangnail vs. Torture Case)**
  *   **Requirement:** The theory must distinguish between "mere discomfort" and "morally lexical suffering." Not all pain triggers the lexical veto.
  *   **Case:** Stepping on a Lego brick vs. waterboarding. Most intuitions suggest we can trade off many Lego-steps for a great happiness, but we cannot trade off waterboarding for any amount of happiness.
  *   **Constraint:** The theory must identify a qualitative or quantitative cutoff point where suffering shifts from being aggregable (tradeable) to being lexical (untradeable). It cannot collapse all suffering into a single category of "badness."

  **3. The Zero-Point Specification (The Absence vs. Negativity Case)**
  *   **Requirement:** The theory must define the neutral baseline. It must distinguish between the *absence of pleasure* and the *presence of pain*.
  *   **Case:** A life of quiet contentment (no strong pleasure, no pain) vs. a life of mild depression (no strong pleasure, constant low-grade psychic pain).
  *   **Constraint:** Straight NU often treats the absence of pleasure as morally neutral. LT-NU needs to ensure that "neutral" isn't just "low pleasure," but specifically "absence of threshold-crossing suffering." If the zero-point is vague, the threshold becomes unmoored.

  **4. The Aggregation Block (The Many vs. The One Case)**
  *   **Requirement:** The theory must prevent the aggregation of sub-threshold pains from morally equating to a super-threshold pain.
  *   **Case:** Does a million people getting a minor paper cut justify torturing one person? LT-NU says no.
  *   **Constraint:** The theory must block summation across the lexical boundary. You cannot sum "small bads" to create a "big bad" that outweighs a lexical bad. This requires a rule against transitivity of "better than" across categories.

  **5. Phenomenological Continuity (The Psychology Constraint)**
  *   **Requirement:** The theory cannot contradict the empirical evidence that hedonic states change gradually.
  *   **Case:** Neuroscientific and psychophysical data show that pain intensity scales continuously (e.g., nerve firing rates, subjective reporting scales). There is no "switch" in the brain that flips from "tradeable pain" to "lexical pain."
  *   **Constraint:** The moral theory posits a discontinuity (the threshold), but the psychology posits continuity. The theory must explain how a moral discontinuity maps onto a phenomenological continuum without being arbitrary.

  **6. The Non-Collapse Condition (The Motivation Constraint)**
  *   **Requirement:** The theory must preserve the positive value of happiness, otherwise it collapses into Straight NU.
  *   **Case:** Saving a life from torture is urgent; creating a new happy life is good but less urgent. If happiness has *no* value, we lose the "Lexical" nuance and become pure suffering-eliminators.
  *   **Constraint:** Pleasure must have positive weight in decisions where no lexical suffering is present. If pleasure is zero-value, the "Threshold" is irrelevant because there is nothing to weigh against the pain.

  ---

  ### The Hard Tensions: Incompatible Desiderata

  The reason your seminar is going in circles is that satisfying these desiderata jointly appears mathematically and metaphysically unstable. Here are the specific friction points:

  **1. Phenomenological Continuity vs. The Threshold Distinction**
  *   **The Conflict:** Psychology (Desideratum 5) suggests pain is a continuous variable (0 to 100). LT-NU (Desideratum 2) requires a binary switch (tradeable vs. lexical) at some point (say, 80/100).
  *   **The Problem:** If the moral status changes abruptly at 80, but the experience changes gradually between 79 and 81, the theory implies a massive moral difference between two phenomenologically indistinguishable states. This invites the Sorites Paradox: if 81 is lexical, is 80.9? If not, why not?
  *   **Verdict:** You likely cannot have a precise threshold *and* respect phenomenological continuity. You must either accept moral arbitrariness or deny the continuity of experience.

  **2. The Asymmetry Requirement vs. A Single Common Scale**
  *   **The Conflict:** Standard utility theory relies on a single currency (utils) to make trade-offs. Desideratum 1 requires that no amount of $+U$ outweighs specific $-U$.
  *   **The Problem:** If there is a single scale, lexicality is impossible (unless you introduce actual infinities, which breaks decision theory). If there are two separate scales (one for pleasure, one for suffering), you need a rule for how they interact that isn't just "suffering wins," or you lose the ability to make trade-offs in non-lexical cases.
  *   **Verdict:** Lexical priority is incompatible with a standard single-scale consequentialist calculus. You need a multi-dimensional vector ethics, which complicates aggregation significantly.

  **3. The Aggregation Block vs. Intuitive Trade-offs**
  *   **The Conflict:** Desideratum 4 says you can't sum small pains to equal a big pain. But intuitively, enough small pains *do* seem to equal a big pain.
  *   **The Problem:** If a million paper cuts are worse than one torture session, aggregation holds. If LT-NU says "No, torture is always worse," it violates the intuition that quantity can eventually trump quality.
  *   **Verdict:** LT-NU must bite the bullet that a lifetime of mild itching is *never* worse than five minutes of agony, regardless of the number of people itching. This is a hard sell against standard aggregation intuitions.

  ---

  ### Evaluation of Frameworks

  Here is how the three major views stack up against the desiderata and tensions.

  #### 1. Bentham-Style Quantitative Hedonism
  *   **Mechanism:** Single continuous scale. Pleasure is positive, pain is negative. Sum total determines value.
  *   **Performance:**
      *   **Asymmetry:** **Fails.** Pain is just negative pleasure. Enough pleasure always outweighs pain.
      *   **Threshold:** **Fails.** No distinction between types of pain, only intensity/duration.
      *   **Aggregation:** **Passes.** Fully aggregable.
      *   **Psychology:** **Passes.** Aligns well with continuous psychophysical scaling.
  *   **Verdict:** Mathematically clean, but morally unacceptable for LT-NU proponents. It cannot support lexical priority.

  #### 2. Straight Negative Utilitarianism (Strong NU)
  *   **Mechanism:** Only suffering has moral weight (negative value). Pleasure has zero value.
  *   **Performance:**
      *   **Asymmetry:** **Passes (Trivially).** Since pleasure = 0, it can never outweigh pain.
      *   **Threshold:** **Fails (Usually).** Most Strong NU views count *all* suffering equally. A hangnail counts morally, just less than torture. It lacks a "tradeable" zone.
      *   **Aggregation:** **Fails.** Leads to the "Benevolent World-Exploder" conclusion. If only suffering matters, and existence entails some suffering, the optimal solution is often non-existence.
      *   **Psychology:** **Passes.** Doesn't require mapping pleasure to pain, just tracking pain.
  *   **Verdict:** Solves the lexical problem by deleting the variable of pleasure. Too radical for most; fails to account for the value of happy lives (Desideratum 6).

  #### 3. Parfit-Style Lexical / Threshold View
  *   **Mechanism:** Discontinuous value function. Suffering above threshold $T$ is in a higher moral category than any amount of pleasure. Suffering below $T$ is tradeable.
  *   **Performance:**
      *   **Asymmetry:** **Passes.** Built into the discontinuous function.
      *   **Threshold:** **Passes.** Explicitly models the hangnail/torture distinction.
      *   **Aggregation:** **Passes.** Blocks aggregation across the lexical boundary.
      *   **Psychology:** **Fails.** Violates Phenomenological Continuity. Requires a moral cliff on a psychological slope.
      *   **Zero-Point:** **Struggles.** Defining the exact boundary of $T$ is notoriously vague (The "Where to draw the line" problem).
  *   **Verdict:** This is the only view that meets the moral intuitions of LT-NU, but it pays the highest theoretical cost. It requires accepting a discontinuity in value that does not exist in the natural world (psychology/neuroscience).

  ### Summary for the Seminar
  The "hard part" you are looking for is this: **LT-NU requires a moral discontinuity that the natural world does not support.**

  To make LT-NU work, you must argue that either:
  1.  **Phenomenology is misleading:** There *is* a qualitative break in experience (e.g., loss of agency, panic response) that matches the moral threshold, even if intensity scales continuously.
  2.  **Morality is not natural:** Moral value does not supervene smoothly on physical/mental states; it is allowed to have "cliffs" even if experience has "slopes."

  If you cannot defend one of those two claims, the Lexical-Threshold view collapses back into Benthamism (if you prioritize continuity) or Straight NU (if you prioritize asymmetry without thresholds).
