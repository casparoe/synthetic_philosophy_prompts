answer: |-
  ### The Contextual Integrity & Necessity Protocol (CINP)

  **Grounding:** This procedure treats privacy not as secrecy, but as **contextual integrity**. Information flow is ethical only when it respects the norms of the context in which it was gathered. It also recognizes **dignitary harm**: the injury caused by stripping an individual of control over their self-presentation, regardless of economic or physical consequence.

  **Instructions:** Answer sequentially. If you hit a **STOP**, do not publish the detail. If you hit **ESCALATE**, pause the story and contact the Standards Editor. If you complete all steps without stopping, the detail is cleared.

  ---

  #### Step 1: Entity Status (Addresses Difficulty 5)
  **Question:** Is the subject a living natural person?
  *   **Sufficient Answer:** "Yes, a living human," or "No, a corporation/deceased/group."
  *   **STOP (No):** If the subject is a private corporation claiming "privacy" (corporations have transparency obligations, not privacy rights in this context). *Note: If deceased, proceed but weigh kinship distress heavily in Step 5.*
  *   **ESCALATE:** If the subject is a minor or a vulnerable adult (guardianship issues).
  *   **Proceed:** If living adult individual.

  #### Step 2: Indispensability (Standard Journalism)
  **Question:** Does the public interest claim of the story collapse if this specific identifier is removed?
  *   **Sufficient Answer:** "The story loses its evidentiary force without it," or "The story remains substantively identical without it."
  *   **STOP (No):** If the detail is merely "colour," atmospheric, or convenient but not evidentiary.
  *   **ESCALATE:** If the detail is relevant but there is a less intrusive alternative available (e.g., describing the role instead of naming the person).
  *   **Proceed:** If the identifier is the only way to substantiate the claim.

  #### Step 3: Contextual Transfer (Addresses Difficulties 1 & 3)
  **Question:** Does publishing this detail transfer information from its original context to an audience with fundamentally different norms and memory?
  *   **Sufficient Answer:** "The audience and norms are consistent" (e.g., medical journal to medical journal), or "The audience and norms are radically different" (e.g., public records archive to national magazine feature).
  *   **STOP (No):** If the detail was "public" only in a limited, administrative, or ephemeral context (e.g., a local notice, a records dump) and publishing it here creates a permanent, searchable profile that did not exist before. *The "Already Public" defense fails here if the re-contextualization changes the normative expectation.*
  *   **ESCALATE:** If the subject is a public official acting in an official capacity (norms of transparency may override contextual shifts).
  *   **Proceed:** If the information was intended for this scale of audience (e.g., a press release).

  #### Step 4: The Mosaic Test (Addresses Difficulty 2)
  **Question:** Does this detail act as a key that allows the audience to aggregate other non-public data points to identify or locate the subject?
  *   **Sufficient Answer:** "This stands alone," or "This links to other data to reveal more than the sum of parts."
  *   **STOP (No):** If this detail is the missing link that turns anonymized data into identified data (e.g., rare disease + street name = specific house).
  *   **ESCALATE:** If the risk is theoretical but low probability.
  *   **Proceed:** If the detail does not enable further deduction.

  #### Step 5: Dignity vs. Harm (Addresses Difficulty 4)
  **Question:** Is the objection based on loss of control/autonomy rather than tangible harm (job loss, harassment)?
  *   **Sufficient Answer:** "They fear physical/economic harm," or "They object to the appropriation of their image/data itself."
  *   **STOP (No):** *Never stop solely on this question.* Privacy has value independent of harm, but journalism sometimes overrides it.
  *   **ESCALATE:** **Always.** If the answer is "They object to the appropriation," this is a values clash between Subject Autonomy and Public Interest. The Editor must weigh the dignitary cost against the journalistic gain.
  *   **Proceed:** Only if Editor clears the escalation.

  ---

  ### Application to Current Cases

  #### Case 1: The Intemperate Email Author
  *   **Step 1 (Entity):** Living human. (Proceed)
  *   **Step 2 (Indispensability):** Is the *name* necessary, or just the *content*? If the story is about university handling, the content proves the handling. The name proves the individual's stress. (Escalate: Less intrusive alternative exists—redact name, keep role).
  *   **Step 3 (Context):** Public records release (administrative) vs. National Magazine (permanent scrutiny). (Escalate: Re-contextualization risk).
  *   **Step 4 (Mosaic):** Unlikely to reveal further private data. (Proceed).
  *   **Step 5 (Dignity):** Objection is reputational. (Escalate).
  *   **Procedure Verdict:** **ESCALATE.** Do not run the name without Editor approval. The "public record" defense is weakened by the contextual shift from administrative review to national character judgment.
  *   **Likely Outcome:** Publish content, redact name.

  #### Case 2: The Graduate Student Photograph
  *   **Step 1 (Entity):** Living human. (Proceed)
  *   **Step 2 (Indispensability):** Student mentioned in a single clause, never charged. Does the photo prove the science or the misconduct? No. It identifies a bystander. **STOP.**
  *   **Procedure Verdict:** **DO NOT PUBLISH.**
  *   **Reasoning:** Fails Step 2. The photo is not indispensable to the public interest claim. It creates a visual association with misconduct where none has been legally established.
  *   **Defense Sentence for the Editor:** "Running this photo conflates proximity with culpability; since the student is not charged and the image adds no evidentiary value to the misconduct claim, the reputational risk outweighs the journalistic gain."

  #### Case 3: The Rare-Disease Street Name
  *   **Step 1 (Entity):** Living human. (Proceed)
  *   **Step 2 (Indispensability):** Does the science require the street? No. (Escalate: Less intrusive alternative exists).
  *   **Step 3 (Context):** Consent form covered "story," not "location." (Escalate: Scope of consent violated).
  *   **Step 4 (Mosaic):** Rare disease + Street Name = Specific House. **STOP.**
  *   **Procedure Verdict:** **DO NOT PUBLISH.**
  *   **Reasoning:** Fails Step 4 (Mosaic Test). Even with consent for the story, the specific detail enables physical identification that violates safety norms.
  *   **Defense Sentence for the Editor:** "Consent to a story is not consent to geolocation; in a rare-disease case, the street name completes a mosaic that compromises physical security, violating our duty of care regardless of the initial signature."

  ---

  ### Failure Modes & Limitations

  1.  **The "Twenty-Minute" Sham:** This checklist cannot replace deep reporting. If you do not know the *original context* of a "public" document (Step 3), you will answer incorrectly. Rushing Step 3 renders the whole protocol useless.
  2.  **The Archival Blindspot:** The procedure cannot account for the permanence of the digital archive. A detail that seems safe today (Step 4) may become dangerous in five years when new data sets emerge. The checklist assesses the *now*, not the *future*.
  3.  **The Public Interest Trump:** Step 5 forces escalation, but it cannot calculate the magnitude of the public interest. If a named individual is the *only* witness to a crime, Step 2 and Step 5 will conflict. The checklist identifies the conflict; it does not resolve it.
  4.  **Systematic Bias:** This procedure is risk-averse. It will systematically protect the powerful (who have resources to object) better than the powerless (who may not know to object). It prioritizes "dignity" which is a luxury good; in stories about systemic abuse, strict adherence may protect abusers by hiding their identities under "privacy."
  5.  **No Moral Algorithm:** No checklist can absolve you of responsibility. If you follow this and still cause ruin, the failure is not in the boxes you ticked, but in the judgment you brought to the questions. Use this to structure your argument, not to outsource your conscience.
