          *   *Clean:* Learner improving beyond current capacity of teacher.
          *   *Distorted:* If the teacher is truly *phronimos*, they define the mean. Surpassing them implies missing the mean (excess).
          *   *Missing:* The idea that the *rule* (reward) is separable from the *agent* (phronimos).

      *   *5. Donated Eye (Feature Space):*
          *   IRL: Designer picks features, AI picks weights.
          *   Aristotle: Habituation (*ethos*). We are taught *what* to see before we weigh it.
          *   *Clean:* The "that" (*hoti*) before the "why" (*dioti*). Moral perception is trained.
          *   *Distorted:* "Features" are static. Aristotelian perception is situational (*kairos*).
          *   *Missing:* The separation of feature selection and weighting. In Aristotle, seeing the feature *is* valuing it.

  5.  **Drafting the Case Studies:**

      *   *Conscripted Expert:* Paramedic acts well, motives bad (fear).
          *   IRL: Reward function recovered is "avoid supervisor anger," not "save lives." Policy fails if supervisor absent.
          *   Aristotle: Doing the just thing, not as the just person does it. *Enkrateia* (self-control) at best, or merely compliant. Not virtue (*arete*).
          *   *Divergence:* IRL sees a misidentified reward function. Aristotle sees a lack of *hexis*.

      *   *Outdistanced Teacher:* AI beats human on human's reward.
          *   IRL: Human was noisy; AI is optimal. Success.
          *   Aristotle: If teacher is *phronimos*, they cannot be beaten (they hit the mean). If learner beats them, teacher wasn't *phronimos*, or learner is hitting a different target (technical skill vs. moral action).
          *   *Divergence:* IRL assumes optimality is computable/separable. Aristotle assumes optimality is embodied in the agent's state.

      *   *Endorsement vs. Source:*
          *   IRL: Source = behavior. Endorsement = inverse planning assuming rationality.
          *   Aristotle: *Prohairesis* (choice) vs. *Praxis* (action). What they would choose upon reflection (*bouleusis*) vs. what they did under passion.
          *   *Divergence:* IRL tries to mathematize endorsement. Aristotle treats it as a developmental state (*phronesis*). The distinction exists but IRL collapses it into "noise" vs "true reward."

  6.  **Drafting the Residue Report:**

      *   *Failure Analysis:* Is it Aristotle's fault or IRL's vagueness?
          *   Scalar reward is the big break. Aristotle rejects quantification of the good.
          *   IRL's "optimization" is formal; Aristotle's "end" is teleological/qualitative.
          *   IRL lacks *normativity* internal to the agent. It has external loss functions.
          *   Aristotle lacks *inference from samples*. He relies on dialectic and observation of the *spoudaios*.
      *   *Who is more damaged?*
          *   IRL claims to model *value*. If it misses the internal norm/character, it models *preference satisfaction*, not value.
          *   Aristotle claims to describe *action*. If he can't account for sub-optimal statistical patterns, his descriptive power is limited.
          *   *Verdict:* IRL is more damaged regarding *value* (it reduces it). Aristotle is more damaged regarding *prediction* (he doesn't try to predict). Since the seminar is on "Value Learning," IRL's reductionism is the critical failure point.

  7.  **Review against Constraints:**
      *   *No smuggling:* Ensure I don't say "Aristotle would say the reward function is wrong." Say "Aristotle has no equivalent for scalar maximization."
      *   *Contested readings:* Acknowledge debates on *Eudaimonia* (inclusive vs. dominant), *Akrasia* (intellectualist vs. moral), *Phronimos* (measure vs. ideal).
      *   *Tone:* Academic, precise, respectful of both fields, no fluff.

  8.  **Refining the Vocabulary:**
      *   Use *telos*, *boulesis*, *orexis*, *phantasia*.
      *   Ensure the distinction between *techne* (skill) and *phronesis* (wisdom) is clear, as IRL looks like *techne*.
      *   Highlight the *Spoudaios* (serious/virtuous person) as the analogue to the "optimal policy" but note the disanalogy.

  9.  **Final Polish:** Check the structure.
      *   Part 1: The Five Translations.
