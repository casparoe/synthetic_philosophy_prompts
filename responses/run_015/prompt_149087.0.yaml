      *   *Noisy Channel:* Human isn't perfect optimizer. $\beta$ parameter (rationality coefficient).
      *   *Surpassing Demonstrator:* IRL aims to find the *true* reward, then optimize it better than the human (who was noisy/suboptimal).
      *   *Feature Space/Donated Eye:* Human defines *what* matters (features); AI learns *how much* it matters (weights).

  3.  **Deconstruct the Aristotelian Concepts (Mental Sandbox):**
      *   *Telos/Eudaimonia:* The end. Not necessarily scalar. Not necessarily maximization in the mathematical sense.
      *   *Prohairesis:* Deliberate choice. Reveals character more than action.
      *   *Hexis:* State of character. Disposition.
      *   *Phronesis:* Practical wisdom. Knowing the mean.
      *   *Akrasia/Enkrateia:* Weakness/Strength of will.
      *   *The Spoudaios:* The serious/virtuous person as the measure.

  4.  **Drafting the Translations (Iterative Process):**

      *   *1. Reward Function:*
          *   IRL: Scalar, maximization.
          *   Aristotle: *Telos* (end). But is it a scalar? *Eudaimonia* is inclusive or dominant? Maximization is tricky (*pleonexia* is a vice).
          *   *Clean:* Action is for the sake of an end.
          *   *Distorted:* Scalar quantity. Aristotle talks of qualitative fittingness (*to prepon*), not summation.
          *   *Missing:* Trajectory summation. Aristotle cares about the complete life, but not as a sum of state-values.

      *   *2. Underdetermination:*
          *   IRL: Many rewards fit behavior. Need priors/entropy.
          *   Aristotle: Action doesn't reveal *prohairesis* fully. Same act, different motive (just act vs. just person).
          *   *Clean:* Behavior underdetermines character/state.
          *   *Distorted:* "Degenerate" rewards. Aristotle would call these vicious or accidental ends, not just mathematical alternatives.
          *   *Missing:* Maximum Entropy. Aristotle doesn't probabilize deliberation this way.

      *   *3. Noisy Channel:*
          *   IRL: Human = noisy optimizer.
          *   Aristotle: *Akrasia* (weakness) vs. *Phronesis* (wisdom).
          *   *Clean:* Agent fails to hit the target due to interference (passion, ignorance).
          *   *Distorted:* Single scalar parameter ($\beta$). Aristotle has a taxonomy of failure (ignorance, passion, vice).
          *   *Missing:* The idea that noise is random rather than structured (vice).

      *   *4. Surpassing Demonstrator:*
          *   IRL: Learn reward, optimize better than teacher.
