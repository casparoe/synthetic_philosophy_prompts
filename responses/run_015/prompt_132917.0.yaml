  The cosmological practice strictly requires a global time function, not a metaphysically privileged present. This slicing is not equivalent to eternalism; presentism has equal use for such a slicing, defining the "cosmic present" as the unique leaf currently existing. The practice fits well with presentism, eternalism, and the growing block alike, suggesting the claim that relativity settles the debate is overblown. Special Relativity forbids preferred frames in empty spacetime, but General Relativity allows them in matter-filled solutions like ours.

  What the practice genuinely rules out is a view denying objective temporal distance between the Big Bang and us within the standard model. Your colleague is correct: in FLRW spacetimes, the elapsed proper time since the Big Bang is maximal for comoving observers. This makes the chosen slicing principled rather than merely convenient, grounding the "age" claim in geodesic structure. However, this physical privilege justifies the coordinate choice, not the ontology.

  In a spacetime with no global time function—such as a rotating universe admitting closed timelike curves—the practice would fail globally. "The age of the universe" would cease to have a single meaning, surviving only as a local measure of proper time along specific worldlines. Cosmology would have to abandon the map of the whole cosmos dated from a single origin.

  The practice of assigning a cosmic age is evidence for neither eternalism nor presentism.
