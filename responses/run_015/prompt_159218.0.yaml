answer: |-
  1. Distribute the two fictional case files (the ethnographic report and the neural marker data) along with blank index cards, and tell the students they have forty minutes to design a diagnostic criterion for a mood-regulation implant that must target only states humans genuinely seek for their own sake.

  2. Have each student list three experiences they unhesitatingly classify as good and three they classify as good only under protest, then work in pairs to write a single definition that captures the first list without including any from the second.

  3. Interrupt their drafting to introduce the ethnographic vignette and the neural marker data, asking them to rule whether these cases fit their definition and guiding them to discover that their current criterion either excludes states the community values or includes states the neural data suggests are distinct.

  4. Require each pair to submit a final protocol that either targets a specific sensory signature, tracks the subject's concurrent desire to continue the state, or optimizes for a functional role in decision-making, warning them that the clinic will deploy whichever rule they choose without further oversight.

  5. Map the failed definitions to the felt-quality account, the reliance on desire to the attitudinal account, and the functional protocol to the role account, warning that students will likely try to hybridize the solutions and you must insist they pick one to expose the tension. Admit that the room will not feel the neuroscientist's conviction that the category is an illusion and you must articulate that skepticism yourself.
