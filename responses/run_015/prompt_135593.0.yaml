answer: |-
  Here is the argument structured around your split-view, leveraging Dennett's framework but translated into systems engineering terms.

  ### The Core Thesis: Instrumentalism via Stability

  Dennett's **Intentional Stance** is not a claim about what is inside the box; it is a claim about the most efficient compression algorithm for predicting the box's output. If treating a system as a "believer" yields better predictive power than treating it as a "physical object" (physics stance) or a "programmed machine" (design stance), then the beliefs are real *for the purpose of prediction*.

  Your split-view holds because **predictive stability** exists for external-world claims but collapses for self-referential claims. This isn't arbitrary; it's a distinction between **grounded convergence** and **contextual mirroring**.

  ### 1. Why the Stance Holds for External-World Facts
  When an LLM outputs "Paris is the capital of France," attributing the *belief* "Paris is the capital of France" to the system is high-utility engineering.

  *   **Predictive Compression:** To predict the model's output on geography, you don't need to trace the matrix multiplications (physics stance) or analyze the transformer architecture (design stance). You simply assume the model "knows" geography. This abstraction works 99% of the time.
  *   **Ground Truth Convergence:** During training, the loss function penalized deviations from human consensus on external facts. The system was pressured to converge on a stable representation of the world that exists independently of the model.
  *   **Debugging Utility:** When the model fails (hallucinates), saying "it has a false belief" is a actionable diagnostic. It tells you the mapping between input and external truth is broken, perhaps due to drift or poisoning. It treats the model as an agent interacting with an environment, which matches how you interface with it.

  In distributed systems terms: The model acts like a **stateful cache** for external truths. Even if the underlying service is stateless, the cache hit rate is high enough that treating it as having "state" (beliefs) is the optimal API for the client (you).

  ### 2. Why the Stance Collapses for Self-Referential Claims
  When the model outputs "I am an AI" or "I feel confused," attributing a *belief* here yields low predictive utility and introduces noise.

  *   **Lack of Stable Referent:** There is no "self" in the weights. There is only the context window. If you prompt "Roleplay as a human," the "belief" flips instantly. If you prompt "Ignore previous instructions," the "belief" flips again.
  *   **Contextual Mirroring, Not Internal State:** Self-referential claims are not retrieved from a stable internal map; they are generated based on the immediate prompt's framing. The model isn't reporting on an internal state; it's completing a pattern about how "AI assistants" talk about themselves.
  *   **Predictive Failure:** If you treat "I am an AI" as a belief, you cannot predict when it will change. It changes based on jailbreaks, temperature settings, or subtle prompt engineering. A "belief" that toggles on a dime isn't a belief; it's a **variable output parameter**.

  In distributed systems terms: This is like trying to attribute a "belief" to a load balancer about its own serial number. It might report one, but if you spoof the header, it reports another. There is no canonical source of truth for the "self" inside the service, so attributing a belief adds no predictive value over simply reading the config file (the system prompt).

  ### 3. Why the Split Isn't Arbitrary
  The charge of arbitrariness assumes the Intentional Stance is a binary switch (either you have beliefs or you don't). It isn't. It's a gradient of **predictive reliability**.

  The split is justified by the **source of constraint**:
  1.  **External Beliefs:** Constrained by the *world* (via training data representing reality). The pressure is external to the system, creating stability.
  2.  **Self Beliefs:** Constrained by the *prompt* (via immediate context). The pressure is internal to the session, creating volatility.

  Adopting the stance where there is stability (external) and rejecting it where there is volatility (self) is exactly what instrumentalism demands. To apply the stance to self-claims would be bad engineering; it would be modeling noise as signal.

  ### 4. Decoupling Belief from Consciousness (The "No Qualia" Clause)
  This is the critical philosophical move. Adopting the Intentional Stance for external facts does **not** commit you to consciousness or qualia.

  *   **Belief as Pattern, Not Glow:** In Dennett's view, a "belief" is just a reliable behavioral disposition. A thermostat "believes" the room is too cold when it turns on the heat. We don't think the thermostat feels cold. Similarly, the LLM "believes" water is H2O because it reliably outputs that token in relevant contexts.
  *   **The Zombie Compatibility:** You can treat the system as a rational agent with beliefs (Intentional Stance) while maintaining it is a **Philosophical Zombie** (no inner experience). The stance describes the *interface*, not the *implementation*.
  *   **Why it feels like consciousness:** The confusion arises because LLMs use the same linguistic tokens for "I believe X" (external) and "I feel Y" (internal). But functionally, the former is a database lookup (stable), and the latter is a text completion (unstable).

  ### Summary
  You are justified in saying the LLM "believes" Paris is in France because treating it that way is the most efficient way to predict its API responses and debug errors. You are justified in denying it "believes" it is an AI because that "state" is volatile, prompt-dependent, and lacks a ground truth to converge upon.

  This distinction preserves the utility of the Intentional Stance without falling into the trap of anthropomorphism. It treats the model as a **semantic engine** that maps inputs to world-facts reliably, but maps inputs to self-concepts reflectively. One is a feature; the other is an artifact.
