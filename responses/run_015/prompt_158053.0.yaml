answer: |-
  Exam Question: Philosophy of Science Final Seminar

  Time Allowed: 90 Minutes
  Format: Closed Book

  Question 1

  Thomas Kuhn is often interpreted as arguing for semantic incommensurability, where the vocabulary of rival paradigms cannot be translated without residue. However, some commentators suggest a distinction between this semantic thesis and a thesis of pure evaluative incommensurability. The latter holds that even if translation between theories is perfect, the standards used to evaluate them—such as simplicity, accuracy, or explanatory power—may differ in ways that prevent rational theory choice.

  Consider the following fictional episode in the history of Thermotics. Theory Alpha explains heat transfer using the concept of Caloric Pressure. Theory Beta explains heat transfer using the concept of Molecular Collision Frequency. Crucially, Theory Beta retains the term Caloric Pressure but defines it strictly as a function of Collision Frequency. Both theories agree on all observational predictions regarding heat flow in known experiments. Theory Beta, however, predicts additional phenomena regarding friction heat that Theory Alpha did not address. Theory Alpha practitioners insist that a successful explanation must identify a substance moving from high to low density. Theory Beta practitioners insist that a successful explanation must identify a statistical conservation of energy. Both groups use the word explanation correctly within their own frameworks, and they agree on the data, but they disagree on what makes a theory good.

  Write an essay that addresses the following three points. First, explain why pure evaluative incommensurability appears immune to the standard self-undermining objection often raised against Kuhn, specifically the Davidsonian claim that you cannot disagree with a theory you cannot translate. Second, explain why pure evaluative incommensurability might still fail to deliver Kuhn's desired anti-accumulation conclusion, given that later theories often predict everything earlier theories did plus more. Third, apply this analysis to the fictional Thermotics case described above. Discuss whether the shift from Alpha to Beta represents genuine progress or a change in standards that makes them incomparable, highlighting the tension between predictive success and explanatory values.

  ----------------------------------------

  Model Answer

  The distinction between semantic and evaluative incommensurability is crucial for salvaging Kuhn from some of the strongest objections raised against him. The standard self-undermining objection, often associated with Davidson, argues that if two theories are truly incommensurable, there is no common language to state the disagreement. If you cannot translate the rival theory, you cannot even assert that it is wrong, let alone incommensurable. This objection relies heavily on the assumption that incommensurability is semantic. If the vocabulary itself is untranslatable, then communication breaks down entirely. However, if we accept the possibility of pure evaluative incommensurability, this objection loses its force. In this scenario, translation is perfectly possible. Both parties understand what the other is saying because they share an observational vocabulary and can map theoretical terms onto one another without residue. The disagreement is not about what is being said, but about what counts as a good reason for believing it. Therefore, the Davidsonian objection fails because the condition for disagreement—shared meaning—is met. The parties can agree on the claims but disagree on the weight of the virtues used to judge those claims.

  However, accepting evaluative incommensurability creates a new problem for Kuhn, specifically regarding his anti-accumulation thesis. Kuhn wants to argue that science does not progress toward the truth in a linear fashion, but rather shifts between incompatible worldviews. If the only difference between theories is evaluative, and if the later theory successfully predicts everything the earlier theory predicted plus new phenomena, it becomes difficult to deny that progress has occurred. If Theory Beta saves all the phenomena of Theory Alpha and adds more, most realists would argue this is evidence of getting closer to the truth, regardless of whether the standards of explanation have shifted. The anti-accumulation point relies on the idea that something is lost in a paradigm shift, not just gained. If translation is seamless and predictive power accumulates, the shift looks like standard scientific progress rather than a gestalt switch. Kuhn needs semantic incommensurability to block the idea that the new theory is just a refinement of the old one. Without it, evaluative differences might just look like changing preferences in a cumulative enterprise.

  Applying this to the Thermotics case reveals the tension clearly. Theory Alpha and Theory Beta are semantically commensurable. They agree on the term Caloric Pressure and the observational data regarding heat flow. A practitioner of Alpha can understand Beta perfectly. Therefore, the Davidsonian objection does not apply here; they can disagree rationally. However, the shift from Alpha to Beta looks suspiciously like accumulation. Beta predicts all of Alpha's successes plus friction heat. If we judge solely by predictive accuracy, Beta is superior. Yet, the standards of explanation differ. Alpha values substance movement; Beta values statistical conservation. If we side with Kuhn, we might say that Beta is not necessarily truer, just differently focused on different virtues. But because the predictive scope has widened, it is hard to deny progress. The case shows that evaluative incommensurability alone cannot sustain the strong claim that science does not converge on truth. It allows for rational disagreement about values, but it struggles to block the intuition that predicting more phenomena constitutes progress. The Thermotics episode suggests that while standards may change, the accumulation of predictive success exerts a pull toward realism that evaluative incommensurability cannot fully resist. Ultimately, the case demonstrates that while we can avoid the self-undermining objection by separating semantics from evaluation, we risk conceding the accumulation point that Kuhn fought hardest to deny.

  ----------------------------------------

  Marking Scheme

  This essay is marked out of twenty points. The marking is divided across the three required tasks, with the application to the fictional case carrying the most weight because it requires synthesizing the theoretical points. The first section, addressing the Davidsonian self-undermining objection, is worth five marks. To achieve full marks here, the student must clearly articulate why semantic incommensurability invites the objection while evaluative incommensurability avoids it. The key insight required is that disagreement requires shared meaning, which evaluative incommensurability permits. A answer that merely states Davidson is wrong without explaining the translation condition will be capped at three marks. An answer that conflates semantic and evaluative incommensurability here will lose all five marks for this section.

  The second section, addressing the anti-accumulation point, is worth five marks. The student needs to explain why predictive success threatens Kuhn's view. A strong answer will note that if the new theory saves all old phenomena plus new ones, it looks like progress toward truth. The student should recognize that evaluative incommensurability might not be enough to block this realist intuition. Marks are deducted if the student claims Kuhn denies all progress outright rather than denying progress toward truth. Marks are also deducted if the student fails to connect the evaluative standards to the problem of accumulation.

  The third section, applying the analysis to the Thermotics case, is worth ten marks. This is where the distinction between a B grade and an A grade is most visible. A B grade answer will describe the case correctly but treat it generically, perhaps saying Beta is better because it predicts more. An A grade answer will highlight the tension specified in the question. It will acknowledge that Beta wins on prediction but argue that the change in explanatory standards complicates the verdict. The student should use the specific details of the case, such as the retention of the term Caloric Pressure and the specific disagreement over substance versus statistics. Generic answers that ignore the fictional details and talk only about phlogiston or generalities will be capped at six marks for this section. Specific mistakes that cost marks include using incommensurable as a synonym for merely different, treating the self-undermining objection as settled fact rather than an argument to be analyzed, and failing to hedge claims where the philosophical dispute is unresolved. The model answer demonstrates the appropriate level of hedging, acknowledging that the dispute is not settled. Finally, any answer that exceeds the time limit implications by being overly verbose at the expense of argument depth will be penalized under the overall coherence mark, which is embedded within the three sections.
