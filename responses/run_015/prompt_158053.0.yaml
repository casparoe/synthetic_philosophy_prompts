prompt: |-
  hey, I'm in a third-year philosophy of science seminar and our final is in two and a half weeks, and the Kuhn block is definiteley going to be one of the three sections we can choose from. Everyone in my study group is planning to write basically the same essay: paradigm shifts, meaning change, no common measure, Davidson says a theory you can't translate isn't a theory you can even disagree with, Kuhn later softens the whole thing into something about lexical taxonomies, the end. I want a practice question that makes that essay useless, ie one where reciting the framework gets you maybe 40% and the rest is doing something with it.

  Here's the thing I've been chewing on, and I want the question built around it. It seems to me there are two different things that get lumped together under incommensurability. One is semantic: the vocabulary of the old theory can't be translated into the new one without residue, so you can't even state what the old theory claimed. The other is evaluative: even if translation went perfectly and you could restate every old claim in the new terms, the two theories might still be incomparable, because the standards you'd use to rank them — the usual theory-choice virtues like accuracy, consistency, scope, simplicity, fruitfulness — aren't neutral arbiters; their interpretation and their relative weighting were themselves part of what got overturned. My seminar leader said something vaguely like this in passing and then moved on. Call the second one pure evaluative incommensurability, the kind you can have with no semantic incommensurability at all.

  So what I want is one timed essay question (90 minutes, closed book, we get the question sheet a week ahead but write in the exam hall) built so that a student has to do three things. First, explain why pure evaluative incommensurability looks immune to the standard self-undermining objection, the move that says you have to understand the rival theory in order to call it incommensurable, so you must have translated it already. Second, explain why it might still not deliver what Kuhn actually wanted out of the idea, which as I understand it is the anti-accumulation point: that later science isn't just nearer the truth, that it doesn't simply add to what came before. The worry is that if translation is fine and the trouble is only about standards of evaluation, there may still be a plain fact of the matter about which theory gets more predictions right in a shared observational vocabulary, and then the anti-accumulation conclusion quietly slips away. Third, apply all of it to a case, and I'd really rather it was a made-up one so that nobody can just recite the phlogiston or Priestley-and-Lavoisier material we did in class. Invent an episode in some fictional science where the successor theory keeps all the old words, predicts everything the old one predicted and more, but reorganises what counts as an explanation or as a good reason for believing something. If you can rig the case so there's a genuine pull in both directions, towards yes that's incommensurable and towards no that's just progress, that's exactly what I'm after.

  Then I want a model answer, around 700 to 900 words, at the level I could plausibly produce in 90 minutes in an exam rather than the level of a journal article, so it should concede points, hedge where hedging is correct, and not pretend the dispute is settled. And a marking scheme out of 20 that actually separates grades: tell me what an A answer does that a B answer doesn't, and name the specific mistakes that should cost marks. My guesses would be conflating the two kinds of incommensurability, treating the self-undermining objection as if it settled the issue in either direction, ignoring the details of the invented case and answering in generalities, and using incommensurable as a fancy synonym for different, but you tell me. Say roughly how many marks each part is worth.

  One formatting thing, sorry to be annoying about it: no headings, no bullet points, no bold text, no tables. I know a marking scheme basically begs for a table. I'm pasting all of this into the notes app on my phone and it renders markdown terribly, so please just write it as continuous prose, like an email. You can mark where the question ends and the model answer begins with a line of dashes or whatever, but keep everything in paragraphs. And please don't give me a bibliography, reading list or page citations — my prof explicitely said we're graded on argument rather than scholarship, and I can't get to the library right now anyway.
