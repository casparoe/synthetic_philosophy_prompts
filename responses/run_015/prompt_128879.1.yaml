answer: |-
  1. The philosophical structure of the conflict
  The core tension lies between defining the brother's state as a medical pathology requiring treatment or a voluntary lifestyle choice deserving protection. At stake is the authority of clinical categories to override individual liberty. If his behavior stems from a disorder impairing judgment, medical intervention restores autonomy; if it stems from values, intervention imposes conformity. The conflict intensifies around insight. Treating refusal of diagnosis as proof of incompetence creates a circular logic where dissent validates coercion. This undermines the possibility of legitimate disagreement. Whether society permits overriding self-determination based on observed welfare alone, or whether competent refusal must be honored even when it leads to self-neglect, is central. The boundary between healing and control becomes indistinguishable without independent criteria for harm beyond social deviation. Determining whether his suffering is internal or imposed by societal expectations is the pivotal epistemic challenge.

  2. The case for supporting the parents
  Your parents' position rests on the observation of tangible decline. Regardless of how the brother frames his actions, the physical reality of neglect and social isolation suggests harm. Autonomy is not absolute; it presupposes the capacity to make reasoned decisions in one's own best interest. If a mental condition distorts reality—such as talking to empty rooms—judgment is compromised, rendering consent unreliable. In such cases, beneficence outweighs liberty. Family members share a moral duty of care to prevent foreseeable harm, especially when a vulnerable member cannot protect themselves. Ignoring visible deterioration under the guise of respecting choice is arguably a form of abandonment. The brother's coherent arguments during visits may mask deeper cognitive fractures evident in daily functioning. Waiting for violence or total collapse before acting is dangerous. Intervention is not about punishing difference but restoring health. If the condition is treatable, coercive care may be the only path to recovering the autonomy he currently lacks. Protecting him from slow self-destruction is an act of love, not control. Temporary restriction of freedom is justified to secure long-term well-being and prevent irreversible damage to his health and future prospects.

  3. The case for siding with my brother
  Siding with your brother emphasizes the danger of pathologizing non-conformity. History shows that psychiatric labels often enforce social norms rather than treat biological diseases. His explanations, while unusual, are internally consistent and philosophically grounded. Dismissing them as symptoms ignores the possibility that his critique of work and vanity is rational. The claim that he lacks insight is self-sealing; because he denies illness, he is deemed incompetent to deny illness. This removes any possibility of valid dissent. Involuntary commitment in this context functions as social control, silencing discomfort rather than healing pain. He expresses fear, not relief, at the prospect of intervention, suggesting he perceives the treatment as a threat. Respecting his autonomy acknowledges his personhood, even if his choices seem risky. Neglect is serious, but coercion can cause trauma that outweighs the benefits of hygiene or employment. True help requires trust, which force destroys. By protecting his right to refuse, you uphold the principle that individuals own their lives, even when they choose paths others deem unwise. Safeguarding liberty requires tolerating some degree of self-neglect. Forcing treatment may confirm his paranoia, damaging his trust permanently and validating his fear that society punishes difference rather than offering care.

  4. A concrete recommendation
  I recommend facilitating a voluntary professional assessment rather than immediately supporting involuntary commitment. Arrange a meeting with a psychiatrist, framing it as a consultation rather than an intervention. This respects his autonomy while addressing parental concern. Support commitment only if independent medical evidence confirms imminent danger to life or severe inability to care for basic needs, not merely eccentricity. Regardless of the side chosen, maintain contact with your brother to ensure he feels heard, reducing isolation. Encourage your parents to document specific instances of neglect objectively, separating social non-conformity from health risks. If he refuses assessment and hygiene deteriorates to medical urgency, reconsider coercion. The goal is harm reduction, not enforced conformity. Seek legal advice regarding commitment criteria in your jurisdiction. Prioritize dialogue over force unless safety becomes critical. Act as a mediator to keep communication channels open between all parties.

  5. What this reasoning cannot settle
  Philosophy cannot predict whether treatment will succeed or cause lasting trauma. It cannot determine the legal threshold for commitment in your location. Nor can it resolve the emotional fallout: will your brother forgive you, or will your parents resent you? The actual diagnosis remains unknown without examination; he may be severely ill or profoundly alienated. These empirical facts determine whether the theoretical arguments apply. Philosophy cannot weigh the intensity of his suffering against the humiliation of coercion. These require local knowledge, medical expertise, and emotional intuition beyond abstract reasoning.
