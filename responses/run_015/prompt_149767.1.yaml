prompt: |-
  You are an expert in the history of moral philosophy, with particular expertise in 18th-century Scottish moral sense theory and its conceptual architecture. I am a PhD student in philosophy writing on Adam Smith's moral psychology. Before you address the main question, please think carefully and begin by briefly brainstorming the structural distinction between Smith's concept of sympathy—understood as the imaginative projection of oneself into another person's circumstances in order to produce fellow-feeling—and his concept of the impartial spectator, understood as the internalized, reflexive standpoint that judges the propriety rather than the merit of sentiments and actions.

  Having done so, please compare these two mechanisms specifically with respect to their roles in grounding judgments of justice, as distinct from judgments of beneficence, under conditions of what I call structural opacity: situations in which an agent's suffering is genuine but its precise intensity, cause, and internal character are not transparently available to an outside observer. In your comparison, address whether sympathy necessarily fails in such cases because it depends on direct affective resonance that opacity obstructs, or whether the impartial spectator resolves this limitation by substituting an internalized normative standard for immediate emotional access. Finally, indicate which mechanism Smith ultimately relies upon to explain why obligations of justice can be enforced even when sympathetic engagement is weak or absent, and provide a brief justification for your view.
