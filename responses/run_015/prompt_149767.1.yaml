      *   *Sympathy's Limit:* Smith is clear in *TMS* I.i.1.1: "As we have no immediate experience of what other men feel... it is by the imagination only that we can form any conception of what are his sensations." If the circumstances are opaque, the imagination lacks the materials to construct the affective state. Sympathy relies on *simulation*. If the input is garbled (opacity), the simulation fails or is weak.
      *   *Justice vs. Beneficence:* Beneficence is about positive virtue (merit), often requiring strong sympathetic alignment to motivate voluntary action. Justice is negative (demerit), about preventing harm.
      *   *The Impartial Spectator's Role:* The Spectator doesn't need perfect affective resonance to judge *rules*. The Spectator relies on *general rules* derived from past experience. Even if I can't feel your pain exactly (opacity), I can recognize a *type* of situation that usually warrants a specific response. The Spectator asks: "Would a neutral party approve of resentment here?"

  4.  **Comparing Mechanisms under Opacity:**
      *   *Sympathy:* Likely fails or is severely diminished. It depends on "changing places in fancy." If the "places" are obscure, the change is impossible. Smith notes we sympathize less with bodily pain than imagination-driven grief because the former is harder to simulate. Opacity exacerbates this.
      *   *Impartial Spectator:* Can function despite weak sympathy. Why? Because it operates on *propriety* and *general rules*. It can judge that *if* the suffering is genuine (even if intensity is unknown), the *reaction* to the cause of suffering (e.g., resentment against an injurer) is appropriate. It shifts from "I feel your pain" to "I approve of your demand for redress."

  5.  **Enforceability of Justice (The Crucial Smithian Point):**
