      *   *Impartial Spectator:* It's the *judge*. It's static (ideally), normative, and triadic (observer <-> agent <-> spectator). It emerges from social interaction but becomes internalized. It judges *propriety* (fittingness of the affect to the cause) and *merit* (desert of reward/punishment). It's about "approving/disapproving."
      *   *Key Distinction:* Sympathy is the *capacity* for connection; the Impartial Spectator is the *standard* of evaluation derived from that capacity but stabilized against its fluctuations. Sympathy is the raw material; the Spectator is the architect.

  3.  **Analyzing Structural Opacity (The Core Problem):**
