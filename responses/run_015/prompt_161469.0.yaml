answer: |-
  ### The Question (45 Minutes, 25 Marks)

  **Prompt:**
  The moral value of work is usually justified in one of three ways: (1) as **spiritual discipline** (effort builds character), (2) as **social utility** (producing what others need), or (3) as **economic entitlement** (labor earns the right to survive). 

  Choose **only one** of these justifications and defend it as the sole foundation for a work ethic. You must explain why the other two are insufficient. Then, apply your chosen justification to the phenomenon of *karoshi* (death from overwork). If a worker freely chooses an 80-hour week and dies from it, does their death validate your work ethic or contradict it? Be specific: is their death a tragedy because the system failed, or a failure because the worker misunderstood the point of work?

  ***

  ### Model Answer (Commitment: Social Utility)

  **Title:** The Utility of the Living Worker

  If we are to salvage any moral meaning from work in the twenty-first century, we must discard the myths of discipline and entitlement and anchor work exclusively in **social utility**. Work is good only because it produces something others need. Anything else is either masochism or coercion.

  The first justification, **spiritual discipline**, collapses under scrutiny. If the moral value of work lies merely in the exertion of effort and the submission to discipline, then there is no moral difference between a software engineer debugging code for sixty hours and a monk praying for sixty hours, or indeed, a person digging holes and filling them back up again. Yet, our intuition tells us the engineer contributes something the monk does not. If effort alone were the metric, *karoshi* would be the ultimate saintliness—the maximum possible exertion. But this is absurd. Effort without output is not virtue; it is waste. The discipline argument cannot distinguish between productive labor and pointless suffering, so it must be rejected.

  The third justification, **economic entitlement** ("no work, no eat"), is equally dangerous. This view treats leisure as a reward rather than a human baseline. It makes survival conditional on labor. But if we accept the utility model, we must admit that labor is not always possible or necessary. If a machine can produce what people need better than a human, the human labor is no longer useful. Under the entitlement model, this human should starve. Under the utility model, they should be freed. Tying the right to exist to the act of labor is a barbarism that confuses economic mechanics with moral worth.

  Therefore, work is valuable only because it sustains the community. This leads to the hard conclusion regarding *karoshi*. If work is utility, then a dead worker has zero utility. A worker who voluntarily works themselves to death has not validated the work ethic; they have violated it. They have converted a productive asset (their labor) into a negative sum (their corpse).

  Critics might argue that if the choice is *free*, the worker is maximizing their own values. But this misunderstands the utility claim. Social utility is not about what the worker feels; it is about what the community receives. A volunteer soldier who dies bravely is a tragedy, not a policy goal. Similarly, a worker who dies for their job has removed themselves from the economy entirely. If the work ethic demands death to prove commitment, it is no longer an ethic of production; it is a cult of sacrifice.

  Furthermore, if the work is truly needed, the system should be organized to sustain the worker, not consume them. *Karoshi* is often defended as "dedication," but under the utility model, it is actually **inefficiency**. It indicates a management failure that burns through human capital faster than it can be replaced. The worker who chooses this has been indoctrinated to value the *appearance* of discipline over the *reality* of contribution. They are trying to win a discipline game in a utility world.

  Thus, *karoshi* is a contradiction. It treats work as an end in itself (discipline) rather than a means to social sustenance (utility). To defend work based on utility is to demand that work be sustainable. If the work kills the worker, it has failed to sustain the community. We must therefore reject the pride of overwork. The most ethical worker is not the one who dies at their desk, but the one who produces value for forty years and retires. To die for work is not the logical endpoint of the ethic; it is the proof that the ethic has been corrupted by the false idol of effort.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. The Single Choice (5 Marks)**
  *   **Must Hit:** The essay explicitly selects one of the three justifications (Discipline, Utility, or Entitlement) in the first paragraph and sticks to it.
  *   **Chicken Out:** "All three have merit..." or "It depends on the job..." (If they hedge, cap this section at 2 marks).

  **2. The Rejection of Alternatives (5 Marks)**
  *   **Must Hit:** The essay explains why the *other two* options fail. (e.g., If choosing Utility, must explain why Discipline is just masochism or why Entitlement is cruel).
  *   **Chicken Out:** Mentioning the other options but not explaining why they are wrong, just stating they are different.

  **3. The "Rock Climbing" Test (5 Marks)**
  *   **Must Hit:** The essay addresses the user's specific worry: If work is just effort, why isn't hobbying work? They must explain why their chosen justification distinguishes labor from leisure hobbies.
  *   **Chicken Out:** Ignoring the distinction between effortful leisure and effortful labor.

  **4. The *Karoshi* Paradox (5 Marks)**
  *   **Must Hit:** The essay takes a stance on voluntary death. Is it a tragedy (system failure) or a contradiction (worker error)? It must link this back to the chosen justification. (e.g., Utility = Death is inefficiency; Discipline = Death is success).
  *   **Chicken Out:** Saying "overwork is bad" without explaining why it contradicts their specific philosophical framework.

  **5. Logical Consistency (5 Marks)**
  *   **Must Hit:** The conclusion follows from the premise. If they chose Utility, they cannot end by saying "but people should work hard anyway." The bill must be paid.
  *   **Chicken Out:** Contradicting the thesis in the final paragraph to sound nicer or more moderate.

  ***

  ### Grading Notes for the Club (The "Timbits" Guide)

  *   **The B-Grade Trap:** Most people will write that "work is good because it builds character" and then say "but dying is bad." This is a contradiction. If character is built through suffering, death is the ultimate suffering. They need to own the consequence.
  *   **The Automation Angle:** If someone picks "Social Utility," check if they dealt with the robot question. If robots do the job, does the human still *need* to work? If they say yes, they secretly switched to the "Entitlement" model.
  *   **The Fence:** If the essay says "On one hand... on the other hand..." without a verdict, they haven't answered the prompt. Philosophy is about picking a fight, not making peace.
