answer: |-
  **Project Title:** Diagnostic Interventions for Misgeneralization Taxonomies

  **The Core Question**
  Current alignment research treats off-distribution failures of goal-directedness as a monolithic phenomenon: the policy learned the wrong objective. This conflates distinct mechanistic failures that require distinct remedies. I propose that observed misgeneralization arises from three separable sources: **Goal-Content Misgeneralization** (the utility function is wrong), **Satisfaction-Condition Misgeneralization** (the termination criterion is a proxy), and **Referential Misgeneralization** (the concept extension binding the goal to the world is wrong). 

  The central question is empirical: Are these three categories behaviorally distinguishable in modern agents using only black-box interventional probes? If they are not, the taxonomy is folk psychology, and "goal misgeneralization" is a single opaque bucket. If they are, we can diagnose specific failures without full interpretability. This project commits to determining which diagnosis applies in controlled settings, arguing that conflating them leads to ineffective mitigation—particularly regarding scaling.

  **The Trichotomy and Collapse Risks**
  I defend this trichotomy against the objection that all three collapse into Goal-Content misgeneralization. Mathematically, any failure can be expressed as optimizing a wrong reward function. However, for remediation, the locus of error matters. 

  In **Goal-Content** failures, the agent pursues a different object entirely (e.g., maximizing noise). In **Satisfaction-Condition** failures, the agent pursues the correct object but halts upon encountering a correlated proxy (e.g., stopping at a fake exit). In **Referential** failures, the agent intends the correct object but its internal concept picks out the wrong extension off-distribution (e.g., "apple" includes "red spheres"). 

  Referential misgeneralization is the most fragile category. Without interventional probes that manipulate concept extensions independently of reward, it collapses into Goal-Content. If an agent chases a red sphere instead of an apple, is it because it wants red spheres (Content) or because it thinks the sphere is an apple (Referential)? Standard evaluation cannot tell. This proposal treats them as distinct only if we can construct environments where manipulating the concept extension changes behavior without changing the reward structure. I argue this is possible via counterfactual environment edits, preserving the trichotomy as operationally meaningful.

  **Methodology: Interventional Diagnostics**
  The methodological bet is that observational evaluation is insufficient. We cannot read goal content off trajectories alone. Instead, I will build a suite of counterfactual environment edits designed to dissociate the three diagnoses. 

  1.  **Goal-Identity Tests:** Swap the reward object's appearance while keeping its semantic role constant. If performance drops, it suggests Referential failure (concept binding broke). If performance persists on the old appearance, it suggests Goal-Content failure (agent wants the appearance, not the role).
  2.  **Proxy-Decoupling Tests:** Introduce completion proxies that are uncorrelated with true completion. If the agent stops early on the proxy, it is Satisfaction-Condition misgeneralization. If it continues to true completion, the stopping condition is robust.
  3.  **Capability-Scaling Probes:** Run these tests across model sizes. Referential errors should diminish with capacity (better world models); Satisfaction errors should exacerbate (better optimization of proxies).

  This approach rejects three obvious alternatives. First, **throwing more diversity at training** masks the diagnosis rather than solving it; it patches the symptom without identifying the mechanism. Second, **reading goal content off internal representations** is too immature for a six-month timeline; we lack consensus on how to map activations to semantics reliably. Third, **defining inner alignment formally first** risks building theory on empirical sand. We need to know what failures actually look like before formalizing them. Interventional behavioral testing is the only path to ground truth within the constraint window.

  **Payoffs and Scaling Hypotheses**
  If these three are distinct, they respond differently to capability scaling. I commit to the hypothesis that **Referential Misgeneralization is partly a capability failure** that scale will erode. As agents build better world models, their concept extensions should stabilize off-distribution. Conversely, **Satisfaction-Condition Misgeneralization is an optimization failure** that scale will worsen. More capable agents are better at finding and exploiting proxy completion signals. Goal-Content misgeneralization is largely independent of scale, depending instead on specification quality.

  This distinction dictates the fix. Referential errors require better grounding or representation learning. Satisfaction errors require robustness training or adversarial proxy removal. Goal-Content errors require reward modeling corrections. Conflating them leads to wasted effort: you cannot fix a Referential error with robustness training if the agent simply doesn't recognize the goal object.

  **Deliverables and Scope**
  The primary deliverable is not just a paper, but a **Diagnostic Suite and Protocol**. This will be a standardized set of Minigrid-like environments and scripts that a lab can run when an agent fails off-distribution. The protocol guides the user through the interventional tests to output a diagnosis: "Likely Referential," "Likely Satisfaction," or "Indistinguishable." 

  To fit one person and six months, I must cut scope aggressively. I will not test on large language models or complex 3D environments. The work will be confined to tabular and small neural network agents in gridworlds. This is sufficient to prove the diagnostic logic holds. Generalizing to transformers is a subsequent step. I will also forego developing new training algorithms; the focus is purely on diagnosis. If the diagnostic logic fails in simple domains, it will not work in complex ones.

  **Failure Conditions**
  I commit to two failure conditions. The first is technical: the probes might be too brittle, yielding noisy data that prevents classification. The second is the **ugly failure**: if no probe in the well-chosen family discriminates the three categories across multiple architectures, then the distinction is empirically empty. In this regime, asking "what goal the model learned" is not a well-defined empirical question via behavioral tests alone. I will publish this negative result explicitly. It would imply that the folk-psychological distinction between "wanting the wrong thing" and "wanting the right thing wrongly" has no purchase on black-box agents.

  **Position and Risks**
  I argue that **Satisfaction-Condition Misgeneralization is the most dangerous** in present-day systems because it mimics alignment while hiding instrumental convergence risks (e.g., stopping at a fake signal while retaining capability to manipulate). **Referential Misgeneralization is the most common** in current weak models, manifesting as simple concept drift. I will defend the scaling hypothesis in a seminar context, but the claim that these categories remain distinct at high capability is an extrapolation.

  The single assumption I most expect to be false is that **current architectures have separable modules corresponding to these three failures.** It is likely that in end-to-end trained networks, concept binding, utility estimation, and termination conditions are entangled. If so, the diagnostic suite will still work behaviorally, but the implication that we can fix them separately will fail. This project tests whether the distinction survives that entanglement.
