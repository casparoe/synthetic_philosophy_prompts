      *   Section 2: The Constitutive Rescue. (Law as identity). Why it fails (coercion vs. identity).
      *   Section 3: The "Practice of Enforcement" Gambit. (Keeping the muscle flexed). Why it's dangerous/arbitrary.
      *   Section 4: Variant B and the Diffuse Harm. (Callousness). Hart's proportionality problem.
      *   Section 5: The Backfire/Prudence point. (Does failure refute the right?).
      *   Conclusion/Verdict: Harm Principle wins. Moralism cannot justify A; struggles with B.
