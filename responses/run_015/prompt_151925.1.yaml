          *   *Reasoning:* The "constitutive" defense of moralism collapses under the weight of coercion. A society defined by coercing private fantasy is already disintegrating. The "practice of enforcement" argument is too dangerous.
          *   *Hart Wins, but...* Hart needs to account for *why* Variant B feels icky. (Maybe a soft regulation, not criminal).
