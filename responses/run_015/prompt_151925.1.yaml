      *   *Focus:* The "Practice of Enforcement" point is crucial. If the *act* of legislating morality is the glue, does the content matter? I need to argue why this fails (arbitrariness).
      *   *Verdict:* I should land firmly. Legal Moralism fails in Variant A. It *might* gain traction in B, but the Harm Principle still wins because "aggregate callousness" is too vague for criminal law.
      *   *Tone Check:* Keep it essay-style, not a list. Ensure the "mixed audience" constraint is met (explain terms, but don't dumb it down).

