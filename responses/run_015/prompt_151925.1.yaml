answer: |-
  **The Shutters and the Limits of the Law: A Verdict on Legal Moralism**

  The Hart–Devlin debate is often taught as a historical artifact, a mid-century clash over homosexuality and prostitution that ended with liberalism's victory. But your reading group is right to feel that the standard summary leaves the hardest questions untouched. Hart's victory relies heavily on an empirical claim: that enforcing morality doesn't actually prevent social disintegration. But what if the empirical claim is neutralized? What if we isolate the moral intuition from the social consequence?

  The "Shutters" case you have invented is an excellent philosophical stress test because it purifies the conflict. It removes the "harm to others" hook that Hart relies on and removes the "social disintegration" hook that Devlin relies on (in Variant A). It forces us to decide whether the sheer fact of shared moral revulsion is enough to warrant the coercion of the criminal law.

  Here is the argument, built to a verdict.

  ### Variant A: The Sealed-Off Indulgence

  In Variant A, we stipulate that there are no downstream effects. No one is harmed. No one becomes more violent. The social fabric does not fray. Yet, 90% of the population feels genuine revulsion.

  **The Hartian Position**
  For a Hartian liberal, Variant A is the easy case. The criminal law is a blunt instrument that deprives people of liberty and imposes the stigma of conviction. To use it, you need a warrant. Traditionally, that warrant is the prevention of harm to others. In Variant A, by definition, there is no harm. Therefore, there is no warrant. The disgust of the majority is irrelevant. To criminalize based on disgust alone is to allow the majority to impose their psychological preferences on the minority without justification. It treats citizens as children who must be protected from bad thoughts, or as property of the collective.

  **The Best Devlinian Case**
  However, a sophisticated Devlinian should not accept this dismissal. The standard critique of Devlin is that he makes a bad empirical prediction (that society will collapse without moral enforcement). But the strongest version of Devlin's argument is not empirical; it is *constitutive*.

  On this reading, the law is not merely a tool to prevent collapse; it is a declaration of who we are. A society is not just a network of trade and non-aggression; it is a community of shared ideas. When the law refuses to condemn something that 90% of the community finds deeply degrading, the law severs the connection between public justice and private conscience. It tells the 90% that their deepest moral intuitions are legally irrelevant. This alienates the citizenry from the law. If the law does not reflect the moral reality of the people, it becomes a foreign occupier.

  Therefore, in Variant A, the Devlinian argues that criminalizing The Shutters is justified not because it prevents violence, but because it affirms the moral identity of the community. It draws a boundary around acceptable human conduct. To allow The Shutters is to say, "We are a society that permits the simulated degradation of persons." The Devlinian claims the state has an interest in not being *that* kind of society, even if "that kind of society" is peaceful.

  **The Verdict on Variant A**
  This constitutive argument is powerful, but it fails to justify criminalization. Here is why: The constitutive argument conflates *expressing* values with *enforcing* them.

  A liberal state can express disapproval of The Shutters without criminalizing them. Politicians can condemn it; schools can teach against it; social stigma can be applied. But criminalization adds physical coercion and the threat of imprisonment. To justify coercion, you need more than a desire for moral consistency; you need a victim or a tangible threat to the rights of others.

  If the Devlinian says, "We must ban this to maintain the moral bond," the Hartian replies: "Whose bond?" If the 10% who use The Shutters are not harming anyone, the "bond" being maintained is actually a bond of exclusion. It is a agreement among the 90% to police the 10%. A society that holds itself together by criminalizing private, harmless fantasy is not holding itself together through shared values; it is holding itself together through force. That is not a moral community; it is a garrison.

  Furthermore, if the content of the law doesn't matter (because the act is harmless), but the *act of legislating* matters (to show we enforce morality), you invite arbitrariness. Why ban The Shutters and not private lying? Why not private greed? If the goal is simply to flex the muscle of moral enforcement, any target will do. This reduces the criminal law to moral calisthenics, using citizens as props to demonstrate state virtue. That is a corruption of the law's purpose.

  **Verdict:** In Variant A, legal moralism fails. The Harm Principle (or something very close to it) wins. The state cannot criminalize purely private, harmless conduct solely because it offends the majority's moral sensibilities.

  ### Variant B: The Diffuse Harm

  Variant B changes the calculus. Here, heavy users become measurably more callous in ordinary life. It never traces to a specific act of harm (no specific assault is committed), but the aggregate character of the user base shifts.

  **The Hartian Problem**
  This is much harder for the Hartian. Hart does not demand that harm be immediate or violent; he demands that it be identifiable. But "aggregate callousness" is a harm. It degrades the quality of social interaction. It makes the society colder, less empathetic, and potentially more prone to negligence. If the law can ban substances that rot your liver, can it ban practices that rot your character, if that character decay spills over into public life?

  If the Hartian says "no," they risk an absurdity: a society where everyone is legally permitted to become a worse neighbor, provided they don't cross the bright line of a specific rights violation. This is the "death by a thousand cuts" problem. If the harm is real but diffuse, the Harm Principle might actually *require* intervention, provided the restriction on liberty is proportional.

  **The Devlinian Advantage**
  Variant B is the Devlinian's strongest ground. Devlin argued that morality is the glue of society. In Variant B, the glue is literally dissolving. The "callousness" is evidence of disintegration. It is no longer just about disgust; it is about the corrosion of the virtues necessary for a society to function warmly and cooperatively. The Devlinian can now say: "We were right about the empirical risk. The Shutters do corrode the social bond, just not in the way you expected. It's not violence; it's indifference."

  **The Verdict on Variant B**
  Even here, however, criminalization is likely unjustified, though regulation might be. The problem is *proportionality* and *epistemic humility*.

  Criminal law is the most severe tool the state has. To use it, the harm must be clear and the connection to the prohibited act must be robust. In Variant B, the harm is "measurable but small" and "never traces to any individual act." This creates a due process nightmare. If I am charged with contributing to social callousness, how do I defend myself? The harm is statistical, not individual.

  More importantly, this grants the state too much authority over the formation of character. If the state can ban anything that makes citizens slightly more callous, where does it stop? Competitive capitalism makes people callous. Harsh political discourse makes people callous. Loneliness makes people callous. Will the state criminalize these?

  A Hartian can accommodate Variant B without embracing legal moralism by acknowledging that "harm" includes the erosion of the social conditions necessary for rights to be respected. However, the response should be the *least restrictive means*. If education, taxation, or civil regulation can mitigate the callousness, criminalization is disproportionate.

  **Verdict:** In Variant B, legal moralism gains traction but still fails to justify *criminalization*. It might justify regulation, but the Harm Principle demands a higher burden of proof for criminal sanctions than "aggregate character shift."

  ### The "Practice of Enforcement" and the Backfire Objection

  You asked whether a Devlinian can escape Hart's "load-bearing" objection by arguing that what matters is retaining the *practice* of enforcing morality, regardless of the specific norm.

  This is a clever move, but it is self-defeating. If it doesn't matter *which* morality is enforced, only *that* morality is enforced, then the law becomes unmoored from reason. It implies the state should pick moral battles at random to keep its muscles toned. This undermines the legitimacy of the law. Citizens obey the law because they believe it is just, not because they believe the state needs exercise. If people realize they are being punished not because their act was wrong, but because the state needed to punish *someone* to stay relevant, respect for the law will vanish.

  This leads to your final point: the backfire scenario. If a ban on The Shutters goes underground, creates a subculture, and is remembered as overreach, does that refute Devlin?

  It refutes the *prudence* of the specific application, but not necessarily the *principle*. Devlin himself allowed for tolerance; he argued that society should not enforce every moral norm, only the essential ones, and only when public sentiment is intense and stable. If a ban backfires, a Devlinian can say, "We miscalculated the intensity or the stability of the sentiment. We tried to enforce a norm that wasn't actually load-bearing."

  However, if the backfire leads to a general loss of respect for the legal system, then it *does* refute the Devlinian principle in practice. Remember, Devlin's ultimate goal is preserving society. If the method of preservation (moral enforcement) damages the institution that preserves society (the rule of law), then the strategy is self-cannibalizing. A society that loses faith in its courts to save its morals ends up with neither.

  ### Final Conclusion

  Does legal moralism justify criminalizing The Shutters?

  **No.**

  In Variant A, legal moralism fails because it cannot distinguish between a shared value and a shared prejudice without an appeal to harm. A constitutive argument ("this is who we are") cannot justify coercion ("or we will cage you") when the conduct is private and harmless. To do so is to prioritize the moral comfort of the majority over the liberty of the minority without a public warrant.

  In Variant B, legal moralism identifies a real problem (social corrosion) but proposes the wrong solution (criminal law). The harm is too diffuse to justify the severity of criminal sanctions, and granting the state power to police character shifts opens the door to authoritarianism. The Harm Principle wins here not by denying the harm, but by demanding a higher standard of proof and proportionality before liberty is curtailed.

  The Hartian view prevails, but it must be a sophisticated Hartianism. It must acknowledge that Variant B *is* a problem. It cannot simply say "no harm, no foul." It must say, "The harm is too vague for criminal law, but valid for social and civil response." Legal moralism is right that morality matters to society, but wrong that the criminal law is the right tool to curate it.

  ### Where This Verdict Might Be Wrong

  I want to flag three points where my reasoning is most vulnerable, as these are the places your group should probe.

  **1. The Definition of "Harm" in Variant B.**
  My verdict rests on the claim that "aggregate callousness" is too diffuse for criminal law. But if the callousness is *measurable*, why is it not a harm comparable to pollution? If a factory emits smoke that statistically increases asthma rates by a tiny margin per person, we regulate or ban it. If The Shutters emit "moral pollution" that statistically increases callousness, why is the logic different? If you can convince me that character decay is a public harm equivalent to environmental damage, Variant B might justify criminalization, and my Hartian defense collapses.

  **2. The Stability of Liberal Neutrality.**
  I assume a liberal state can remain neutral on The Shutters without disintegrating. But what if the 90% who are revolted view the state's neutrality as complicity? If the state refuses to ban The Shutters, and the 90% lose faith in the state's legitimacy and withdraw their cooperation (tax evasion, jury nullification, civil unrest), then Devlin's empirical prediction comes true *because* of the liberal policy. If maintaining the liberal order requires satisfying the moral demands of the majority, then a form of Devlinism is practically necessary, even if theoretically unjust.

  **3. The Nature of the Simulation.**
  I have accepted the stipulation that the simulated persons have "no moral status." But this is a philosophical assumption, not a settled fact. If it turns out that engaging in simulated cruelty *does* violate a duty to oneself or to the concept of humanity (a Kantian argument), then there *is* a harm, even if no conscious being suffers. If "degrading oneself" is a legitimate harm the state can prevent, then Variant A becomes criminalizable. My verdict assumes a Millian view of self-regarding actions; if your group accepts a perfectionist view of human flourishing, the Harm Principle might actually mandate a ban.

  If I had to bet, I would say the first point is the strongest threat to my verdict. If "moral pollution" is treated like environmental pollution, the distinction between Hart and Devlin blurs significantly. But until that link is rigorously proven, liberty must get the benefit of the doubt.
