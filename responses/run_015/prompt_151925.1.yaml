  2.  **Deconstruct the Core Conflict:**
      *   *Hart's Liberalism:* Law needs a warrant beyond "we don't like it." Usually, that warrant is harm (Mill/Hart). If no harm (Variant A), no law. If negligible harm (Variant B), proportionality issues.
      *   *Devlin's Legal Moralism:* Society is a community of ideas, not just interests. Disintegration is the threat. Law expresses collective judgment.
      *   *The Twist:* The Shutters remove the "disintegration" empirical claim (in Variant A) and the "harm" claim (in both). It isolates *pure* moralism.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the stalemate. Introduce The Shutters as the stress test. State the essay's purpose: to push past the standard summary into a verdict.
      *   **Variant A (The Pure Test):**
          *   *Hartian View:* Easy. No harm = no crime. Liberty trumps disgust.
          *   *Devlinian View:* Harder. If society disintegrates without enforcing *this*, ban it. But Devlin usually leans on the "disintegration thesis." If psychologists say *no* disintegration (Variant A), Devlin loses his empirical footing.
          *   *The Constitutive Move:* Maybe Devlin isn't making an empirical prediction but a constitutive claim. "We are the kind of people who don't do this."
