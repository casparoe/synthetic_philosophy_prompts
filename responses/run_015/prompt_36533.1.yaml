answer: |-
  This is a fantastic set of intuitions. You have effectively stumbled upon a distinction that professional philosophers of science and metaphysics wrestle with: the difference between **progress as truth-accumulation** (getting the right answer) and **progress as problem-refinement** (understanding the shape of the question).

  Your verdicts are actually remarkably consistent. They suggest you are implicitly using a principle I will call **"Constraint and Clarification."**

  Under this principle, philosophy makes progress when it:
  1.  **Eliminates impossible options** (usually via external constraint).
  2.  **Sharpens the concepts** so we know exactly why we disagree.
  3.  **Transforms intractable questions** into tractable ones (sometimes by spinning them off).

  It does *not* require consensus, and it does *not* require a final "True" answer.

  Here is how this principle saves your verdicts, resolves your tensions, and predicts the Free Will case.

  ### 1. The Kant vs. Absolute Space Tension
  **Your Intuition:** Both were refuted by science. You count both as progress, but feel a difference.
  **The Principle:** This is **Negative Progress** (Elimination).
  **Verdict:** You should treat these cases identically. The "difference" you feel is likely that Kant's claim was *more* philosophical (transcendental necessity) than Newton's (physical metaphysics), so the refutation feels more devastating to philosophy in the Kant case.

  *   **Why it counts as progress:** In both cases, philosophy posited a "necessary truth" about the structure of reality (Space *must* be Euclidean; Space *must* be absolute). Science showed these were contingent or false.
  *   **The Gain:** We stopped wasting time defending necessary truths that weren't necessary. Philosophy was corrected, which is a form of learning.
  *   **Advice:** Don't give up either verdict. Just recognize they are the same *kind* of progress: **Empirical Constraint on Metaphysics.** Philosophy proposed a modal claim (it *must* be this way); the world said "no." That narrows the option space.

  ### 2. The Psychology vs. Ethics Tension
  **Your Intuition:** Philosophy spawning Psychology = Progress. Society adopting Ethics = Cheating.
  **The Principle:** Progress is about the **Maturation of the Inquiry Mechanism**, not the **Realization of Values.**

  *   **Psychology:** Philosophy developed the conceptual framework (introspection, categorization of mental states) until the questions became empirically tractable. The *method of inquiry* migrated from armchair to lab. The question "How does memory work?" was answered by building a better tool (science). That is philosophical success: rendering a mystery into a problem.
  *   **Ethics:** Abolition is a *political/volitional* victory, not an *epistemic* one. Philosophy argues "Slavery is wrong." Society decides to stop. The *truth* of the claim didn't become clearer; the *world* just aligned with the claim. If philosophy made progress in ethics, it would look like **Reflective Equilibrium** (e.g., we used to think "happiness is the only good," now we think "autonomy matters too"), not "we stopped owning slaves."
  *   **Advice:** Keep your verdict. Psychology is **Methodological Success** (we found a way to answer it). Abolition is **Political Success** (we did what we argued for). Only the former is philosophical progress.

  ### 3. The Mind-Body "Regress"
  **Your Intuition:** More positions now than in 1650 = Regress.
  **The Principle:** Progress is **Mapping the Logical Space**, not just picking a coordinate.

  *   **1650:** The options were vague. "Soul stuff" vs. "Clockwork." The terms were muddy.
  *   **2024:** We have precise definitions. We know *why* it's hard (the Explanatory Gap). We have distinguished Type Identity from Token Identity, Functionalism from Physicalism, Panpsychism from Illusionism.
  *   **The Gain:** We haven't solved it, but we have **high-resolution failure.** We know exactly which moves are available and what the cost of each move is. In 1650, they didn't even know what the costs were.
  *   **Advice:** **Overturn this verdict.** It looks like regress only if you define progress as "consensus." If you define it as "conceptual precision," Mind-Body is massive progress. We know *what* we don't know much better than Descartes did.

  ### 4. Personal Identity (Parfit)
  **Your Intuition:** Convergence on "what matters" = Progress.
  **The Principle:** **Question Transformation.**
  *   Parfit showed the original question ("Is it the *same* person?") might be empty, and replaced it with a substantive one ("Does *survival* obtain?").
  *   This is top-tier philosophical progress. It dissolves a verbal dispute to reveal the underlying value judgment. This fits your "Constraint and Clarification" model perfectly.

  ### 5. Logic, Euthyphro, Gettier
  *   **Logic:** Formalization. We built better tools. (Progress).
  *   **Euthyphro:** Conceptual Clarity. We know the dilemma is structural, not just a lack of data. (Partial Progress).
  *   **Gettier:** Tool Invention. We invented a new way to test definitions (counterexamples). Even without a new definition, the *method* of epistemology advanced. (Progress).

  ### 6. The Prediction: Free Will & Neuroscience
  You asked what the principle predicts for Free Will after Libet/neuroscience.

  *   **The Setup:** Neuroscience shows unconscious brain activity precedes conscious awareness of decision.
  *   **The Philosophical Reaction:** Compatibilists shrug (that's not the "free will" that matters for responsibility); Illusionists nod (see? it's a user-illusion); Libertarians dig in (quantum indeterminacy?).
  *   **The Prediction:** According to "Constraint and Clarification," this counts as **Negative Progress (Constraint).**
      *   Neuroscience has ruled out specific *mechanisms* of free will (e.g., a non-physical soul pushing neurons at the exact moment of conscious choice).
      *   However, it has not ruled out the *concept* of free will (which is often defined normatively, not mechanically).
      *   **Verdict:** This is progress similar to the **Kant/Newton** case. We know free will cannot be a specific kind of causal interruption. But like the Mind-Body case, the *conceptual* debate reorganizes rather than resolves.
      *   **Forecast:** Philosophers will not agree on "Do we have free will?" But they *will* agree on "Free will cannot mean X." That is progress.

  ### Summary of Suggested Overturns
  To make your worldview fully consistent with the "Constraint and Clarification" principle:

  1.  **Mind-Body:** Stop calling it regress. Call it **High-Resolution Mapping.** The proliferation of positions isn't confusion; it's the differentiation of a complex problem. We are more confused *precisely* because we are more informed.
  2.  **Kant vs. Newton:** Stop feeling a difference. Both are **Empirical Constraints.** Philosophy made a claim about the necessary structure of the world; physics said "no." That is a win for knowledge, even if philosophy lost the point.
  3.  **Ethics:** You are already right to reject social change as progress. Stick to that. Philosophical progress in ethics is **Argumentative Sophistication** (e.g., the development of Rawlsian veil of ignorance), not **Legislative Victory**.

  ### The Single Notion
  **Philosophical Progress is the increase in the resolution of the conceptual map.**

  Sometimes that means finding the treasure (Logic). Sometimes it means realizing the map had a coastline drawn wrong (Kant/Newton). Sometimes it means realizing the treasure hunt is the wrong game and we should be mining instead (Psychology spin-off). Sometimes it means realizing the map is vaster than we thought, but we now have GPS coordinates for every dead end (Mind-Body).

  Your friend wants progress to mean "arrival." Your intuitions correctly identify that progress means "navigation." Stick with your gut, but upgrade the Mind-Body verdict.
