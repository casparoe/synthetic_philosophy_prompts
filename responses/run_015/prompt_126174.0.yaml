      *Cheapest Revision:* Change the conclusion of (5). Don't say "shift away from social intervention." Say "interventions need to target the specific environmental factors that shift the mean, not just reduce variance." Or simply cut the policy prescription. Cutting the policy prescription is the "cheapest" because it requires the least rewriting of the scientific logic, just trimming the overreach.

      *Wait, one more check on (1):* "Journalists always report h² figures as if they were H²." Actually, twin studies estimate $A + D + C$ usually confounded. GWAS estimates narrow sense. Journalists often just say "heritability." The distinction is valid but maybe less critical than (5). I will mention it as a minor technicality.

