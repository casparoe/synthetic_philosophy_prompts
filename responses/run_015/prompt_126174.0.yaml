      *Example:* Height. h² is high in Netherlands (good nutrition) and Guatemala (worse nutrition). The *difference* in height between the two countries is environmental. So environment *is* a causal lever for the population mean. The user's claim that policy should shift to "genetic approaches" for IQ based on this is the dangerous leap.
      *Correction:* The stability of h² means *ranking* is stable, not that *levels* are fixed.
