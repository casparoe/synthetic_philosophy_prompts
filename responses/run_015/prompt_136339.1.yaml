  *(Self-Correction Note)*: Wait, I need to be careful not to oversimplify Rieff as purely consequentialist. He also questions the *possibility* of ethical collective memory. But for the sake of the "stall," the normative vs. pragmatic tension is the key friction point. I will frame it as Normative/Constitutive vs. Pragmatic/Instrumental.

  *(Final Plan)*:
  1.  Validate the user's intuition (it's sharp).
