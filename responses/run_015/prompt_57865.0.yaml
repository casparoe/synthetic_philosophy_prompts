answer: |-
  The rain in Leeds didn't fall; it hung in the air, a damp grey curtain that seeped into the brickwork of the community centre. Inside, Maya rubbed her temples. The spreadsheet on her screen blurred. In her bank account sat £4,000, a donation from an anonymous trust. It was enough to fix the walk-in fridge's compressor, or it was enough to fund a semester of server costs for a boy named Liam.

  Liam sat opposite her, knees bouncing. He was twenty-two, wearing a hoodie that cost more than Maya's weekly shop, radiating the confident exhaustion of a final-year computer science student.

  "It's just expected value, Maya," Liam said, tapping his laptop. "You're letting proximity bias cloud the calculus."

  Maya looked out the window towards the warehouse floor. Through the glass partition, she could see the queues forming. It was Tuesday. The old fridge was holding at eight degrees; by Friday, it would be twelve. The milk would sour. The meat would spoil. Two hundred families relied on that cold chain to get through the week.

  "Walk me through it again," she said.

  Liam turned the screen towards her. "My model predicts supply chain collapses. Specifically, grain shortages in the Sahel. If this prototype scales, and we get it to the UN logistics team, there's a non-zero chance we prevent a cascade failure."

  "And the odds?"

  "One in five million," Liam said. He didn't flinch. "But the payoff is two billion lives affected over the next century. Not just fed, Maya. Saved from systemic collapse."

  Maya picked up a pen. She liked numbers. They were usually honest. She grabbed a notepad and wrote:

  **Option A: Fridge**
  *   Cost: £4,000
  *   Probability: 100%
  *   Impact: 200 families fed this winter.
  *   **Expected Value (EV): 200 units.**

  **Option B: Model**
  *   Cost: £4,000
  *   Probability: 1 / 5,000,000
  *   Impact: 2,000,000,000 lives stabilized.
  *   **Expected Value (EV): (2,000,000,000 ÷ 5,000,000) = 400 units.**

  She stared at the sums. Four hundred was greater than two hundred. Mathematically, the choice was obvious. If you believed the numbers, handing the money to Liam was twice as good as fixing the fridge. It was a cold, clean logic. If you could save 400 lives in expectation, why would you settle for 200? In that moment, staring at the ink, it felt utterly rational to ignore the certain suffering in the next room for the shadowy potential of the future. The arithmetic demanded she ignore her gut.

  "It's not just about the winter," Liam pressed, sensing her hesitation. "It's about the magnitude. You're trading a local blip for a global trajectory."

  Maya put the pen down. The rationality evaporated the moment she stood up and walked out of the office.

  The warehouse air was biting. The concrete floor was stained with damp. Mrs Gannon was at the front of the queue, wrapping a scarf tighter around her neck. She came in every week. She had three grandchildren. If the fridge broke, the chicken portions meant for them would be bin-bound by Thursday.

  Maya looked at the condensation dripping from the current unit's valve. It was a real, physical leak. It smelled of mould and old onions.

  She walked back to the office, the absurdity hitting her like a physical weight. How could she tell Mrs Gannon that her grandchildren's dinner was being sacrificed for a one-in-five-million shot at a famine that might not happen for twenty years? The math said it was the right thing to do. The math said Mrs Gannon was statistically negligible compared to the billions in the Sahel.

  But standing there, hearing the rattle of the trolleys, the idea felt insane. It felt like gambling with food vouchers. If she gave Liam the money and his model failed—which it almost certainly would—she had let two hundred families go hungry for nothing. Not for a sure thing, but for a lottery ticket.

  She sat back down. The notepad lay open. The equation remained true. 400 > 200.

  Liam was watching her, waiting. He believed in the logic. He believed that if everyone acted on expected value, the world would be optimized, even if individual instances looked like madness.

  Maya looked at the cheque. It was made out to 'Leeds Community Aid'. She could endorse it over to Liam's university incubator. She looked at the fridge monitor blinking red on the wall. 9 degrees. Rising.

  Outside, the rain intensified, drumming against the glass. Inside, the silence stretched, filled only by the hum of the failing compressor and the soft tapping of Liam's fingers on his desk. Maya picked up the pen. She hovered it over the signature line, the ink trembling slightly, caught between the certainty of the cold and the vast, invisible weight of the numbers.
