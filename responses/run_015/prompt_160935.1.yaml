answer: |-
  Here are the twelve questions drafted for your interview with Dr. Okonjo, ordered to progressively narrow the space for her standard deflection.

  ### Interview Questions

  1.  Let's start with the classic Darley and Batson seminary study. Students rushing to give a talk stepped over a slumped man; those with time stopped. You say this proves character isn't global, but why is time pressure evidence about *character* rather than just about attention?
  2.  If I'm following you, you'd say the hurry changes the situation, not the person. But if the virtue disappears the moment the clock speeds up, isn't that just a reflex to external cues rather than a moral disposition?
  3.  Moving to the obedience experiments: subjects administered shocks consistently across the procedure. Weren't those subjects reliably consistent across a whole situation-type, just in a bad direction?
  4.  If reliability in a setup is what makes a virtue, does your local-virtue machinery let a reliable torturer count as locally virtuous?
  5.  I'm trying to find the line where a local trait stops being character and starts being a habit or a reflex. Can you draw that for me?
  6.  If the reliability vanishes the moment the scaffold does, what is the word *virtue* doing that the word *habit* couldn't do cheaper?
  7.  Let's talk moral education. If you raise a kid by arranging her situations so she never fails, have you given her a virtue or just managed her behavior?
  8.  What about people whose work is mostly unscaffolded—improvisation, novel cases, being alone with a decision? Do they just lack virtue until we build them a doorway?
