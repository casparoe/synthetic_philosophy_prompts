      *   *The User's Role:* The User is the *Maintenance Engineer*. In the analogy, the User is the *Judge*.
      *   *The Conflict:* If the User (Judge) patches the code, they are acting like the Legislature. If the User (Judge) just reads the code, they are acting like a Textualist Judge.
