      *   *Problem:* Judges generally *can't* "fix" statutes (patch them). They can only interpret. If the user says "fix it," they are claiming judicial power to amend.
      *   *Refinement:* The user needs to realize that in their job, they *have the power to change the code*. In law, the Judge *does not have the power to change the statute*.
      *   *This is the fatal flaw.* The Maintenance Engineer *is* the Legislature + Judiciary combined regarding that codebase. The Judge is only the Judiciary.

  7.  **Propose a Better Analogy:**
      *   *Public API / Interface Contract.*
      *   Why? Because downstream consumers (citizens) rely on the signature.
      *   If you change the behavior (patch the bug), you break backward compatibility (Reliance Interests).
      *   This captures the "Rule of Law" value: Predictability > Correctness.
      *   In this analogy, the "Textualist" approach is: "The API docs say X. Even if X is stupid, we can't change it in v1.0 without breaking clients. We fix it in v2.0 (Amendment)."

  8.  **Synthesize the Verdict:**
      *   The analogy is evocative but structurally flawed regarding *power*.
