  1. **Non-Transitivity:** Chains bottom out, but grounding stops at each link; the terminal fact doesn't ground the derived fact two steps up, so the bottom set fails to ground the whole.
  2. **Non-Aggregation:** Individual chains terminate, but the collection of all terminal facts doesn't collectively ground the collection of all derived facts, preventing a unified basis.
  3. **Partial Grounding Only:** Every fact is only partially grounded; chains end, but since nothing is *fully* grounded, no "complete" basis can exist by definition.
  4. **Infinite Width:** Depth is finite (foundationalism holds), but infinite independent chains mean the set of terminal facts is too disunified to constitute a single "level."
  5. **Contrastive Grounding:** Grounding is always relative to a context; there is no context-independent totality of facts, so no absolute basis exists even if chains end.

  **Selection:** I'm picking **Non-Transitivity**. It's the sharpest knife. It preserves the intuition that chains end (foundationalism) while severing the link between "bottom of the chain" and "ground of everything." It allows me to show that a fact can be terminally fundamental without being basally fundamental because it simply doesn't reach far enough.

  ***

  Here is the argument.

  Grounding is not transitive. That is the mechanism. If $A$ grounds $B$, and $B$ grounds $C$, it does not follow that $A$ grounds $C$. This single break is enough to drive a wedge between terminal fundamentality (where the chain stops) and basal fundamentality (what forms a basis). Foundationalism requires that every grounding chain terminates; it does not require that the terminator of the chain grounds everything downstream. If grounding is non-transitive, the terminal fact supports its immediate successor, but not the successor's successor. The chain bottoms out, satisfying foundationalism, but the bottom fails to support the top, violating the requirement for a complete basis.

  **The Toy Model**
  Consider three facts: **Rock**, **Threat**, and **Fear**.
  1.  **Rock** grounds **Threat**. (The rock falling makes the situation threatening.)
  2.  **Threat** grounds **Fear**. (The threat causes the fear.)
  3.  There is no direct grounding between **Rock** and **Fear**. (The rock only matters because it's a threat; the grounding relation doesn't skip the intermediate.)

  **Terminal Facts:** {**Rock**}. It is ungrounded. The chain stops there.
  **Derived Facts:** {**Threat**, **Fear**}.

  Now, test for a **Basal Foundation** (a minimal complete basis). A basis must be a set that grounds *everything else* in the model.
  *   **Candidate 1: {Rock}**. This is the set of terminally fundamental facts. Does it ground everything else? It grounds **Threat**. It does *not* ground **Fear** (because grounding isn't transitive). So {**Rock**} is not a basis.
  *   **Candidate 2: {Threat}**. Does it ground everything else? It grounds **Fear**. It does not ground **Rock** (grounding is asymmetric). So {**Threat**} is not a basis.
  *   **Candidate 3: {Rock, Threat}**. Does it ground everything else (**Fear**)? Yes. Is it minimal? No. We can remove **Rock** and {**Threat**} still grounds **Fear**. So it's not minimal.
  *   **Candidate 4: {Threat}** (revisited as minimal set for **Fear**). To be a basis, it must ground *everything* not in the set. That includes **Rock**. It fails.

  There is no set of facts in this model that satisfies the definition of a minimal complete basis. The terminally fundamental fact (**Rock**) exists, but there is no fundamental level. The world bottoms out, but the bottom does not hold up the whole.

  **The Objection**
  The obvious pushback is: "Just take the union of all terminally fundamental facts. That's your basis. Done."
  This move smuggles in transitivity. It assumes that if you collect all the ungrounded starters, their grounding power automatically flows through the intermediates to cover the entire structure. But if grounding is a local relation that doesn't transmit across links, collecting the starters doesn't give you a lever to move the whole world. The union of terminal facts grounds only the immediate successors. To get the rest, you'd need to include the intermediates in the basis, but then it's not a basis of *fundamental* facts (since intermediates are grounded), or it's not minimal (since you included the starters unnecessarily for the distant facts). The objection begs the question by assuming the very connectivity I'm denying.

  **What To Do With "Fundamentality"**
  Keep the notion of "terminally fundamental," but abandon "fundamental level." The gap shows that "level" talk is the mistake. We should talk about facts that are ungrounded (terminal), but we must stop assuming they form a unified layer that explains everything else. The metaphysics of grounding is a network of local dependencies, not a building with a foundation. If you insist on a "fundamental level," you are demanding a transitivity that isn't there. Drop the level. Keep the terminals.

  **What Breaks**
  Exclusion arguments break. These are the arguments that say higher-level facts (like **Fear**) are causally inert because the fundamental level (like **Rock**) already did all the work. That premise relies on the fundamental level fully grounding the higher-level facts. If grounding isn't transitive, the **Rock** does not fully ground the **Fear**. The **Fear** is not exhausted by the **Rock**. There is explanatory residue left over at the higher level. The gap protects higher-level causation from being screened off by the bottom. The bottom stops, but it doesn't finish the job.
