              *   Outer: Flag ambiguity not just for contradictions but for potential misinterpretation based on the Frame.
              *   Inner: Query the attorney more often ("Does this clause match the intent of the header?").
              *   *Risk:* This blurs the line between editor and lawyer. Liability issues.

      *   **Conclusion:** Summarize. The legal system often *pretends* meaning is only in the text for stability, even if philosophy says otherwise. The user's intuition is correct.

  5.  **Review and Refine (Self-Correction):**
