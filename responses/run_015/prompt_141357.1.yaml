  **UNIVERSITY OFFICE OF RESEARCH COMPLIANCE**
  **COGNITIVE CAPACITY ASSESSMENT (FORM 74-Z)**
  **APPLICATION FOR REGRADE / MIND-TAXONOMY CLASSIFICATION**

  **INSTRUCTIONS:** Pursuant to University Policy 902.B regarding Sentient Asset Liability, all Principal Investigators must renew the Cognitive Capacity Grade (CCG) for each experimental subject annually. This form determines liability waivers, enrichment budgets, and ethical oversight tiers. Complete all sections. Failure to certify the origin of internal models may result in retroactive downgrading of all published data. Select the highest applicable grade. Note: Higher grades incur higher administrative overhead.

  **SECTION I: DARWINIAN GRADE (FIXED REPERTOIRE)**
  *Select this grade if the subject's behavioral repertoire is entirely determined by phylogenetic selection.*
  1.1 Please provide a written statement detailing the specific ancestral environmental pressures that selected for the subject's current instinctual responses.
  1.2 Did the subject consciously approve the fitness landscape that programmed its nervous system? [ ] Yes [ ] No [ ] N/A
  1.3 If the subject performs a complex action without prior trial, certify that no learning occurred during the subject's lifetime.
  *Note: Applicants unable to articulate the evolutionary rationale for their own reflexes will be automatically processed as Darwinian. Do not attempt to justify instincts using reasoning capabilities you do not yet possess.*

  **SECTION II: SKINNERIAN GRADE (REINFORCEMENT SHAPING)**
  *Select this grade if the subject learns via trial and error, paying for errors with physical consequence.*
  2.1 Attach itemized receipts for all aversive stimuli incurred during the acquisition of the target behavior.
  2.2 Calculate the caloric cost of failed trials. Who bears this cost: [ ] The Subject [ ] The Lab [ ] The Grant?
  2.3 Confirm that the subject never successfully performed the action before being reinforced for it. If the subject anticipated the reinforcement, proceed to Section III.
  *Warning: Attempting to claim Skinnerian status while denying the cost of errors constitutes fraud. The universe must be paid.*

  **SECTION III: POPPERIAN GRADE (INTERNAL MODELING)**
  *Select this grade if the subject can pre-select behaviors via internal simulation, allowing hypotheses to die in their stead.*
  3.1 Describe the architecture of the internal model used to simulate consequences prior to action.
  3.2 Certify that the internal model itself was not constructed via Skinnerian reinforcement or Darwinian selection.
  3.3 If the internal model was shaped by prior experience, explain how the model validates itself without infinite regress.
  *Fine Print: By signing Section III, the Applicant attests that the "guard" inside the head has its own guard. If the internal simulator was built by trial and error, the subject is merely a Skinnerian agent running a simulation built by pain. The Office does not recognize "virtual" error reduction unless the simulator is proven infallible.*

  **SECTION IV: GREGORIAN GRADE (TOOL-DEPENDENT COGNITION)**
  *Select this grade if the subject utilizes external cultural tools (language, notation, diagrams) to offload cognitive processing.*
  4.1 Inventory all external scaffolding used during problem-solving (e.g., notebooks, calculators, language, trainers).
  4.2 Submit deed of ownership for all listed cognitive tools.
  4.3 **Provisional Status Warning:** Classification as Gregorian is provisional and tool-dependent. Subjects granted this grade will undergo a Closed-Tools Regrade Hearing. During this hearing, all notebooks, devices, and linguistic scaffolding will be confiscated. If the subject's cognitive capacity diminishes upon removal of tools, the grade will be demoted to Popperian or lower.
  *Note: There is no principled place to stop counting tools. If the subject uses a brain, is the brain a tool? If the subject uses a language they did not invent, does the grade belong to the subject or the language? The Office reserves the right to assign the grade to the library.*

  **SECTION V: APPEALS AND ATTRIBUTION**
  5.1 If the candidate hypotheses tested in Section III were generated by a trainer, textbook, or statistical model, the error died in someone else's stead.
  5.2 In such cases, the CCG belongs to the hypothesis generator, not the subject.
  5.3 Applicants claiming Popperian status based on imported hypotheses must file Form 74-Z-Appendix (Origin of Thought).
  *Disclaimer: The University assumes no liability for existential distress resulting from the realization that your smartest thoughts were lent to you by the meme pool. All grades are final unless new tools are acquired.*

  **ATTESTATION**
  I certify that the mind described above exists within the skull listed on the IACUC protocol and is not merely a localized eddy in a larger cultural computation.

  **Signature:** ___________________________________ **Date:** _______________
  **For Office Use Only:** [ ] Darwinian [ ] Skinnerian [ ] Popperian [ ] Gregorian [ ] Error
