      *   *Addressing the Instructors:* Acknowledge both sides respectfully. "One camp says X, one says Y. Here's the middle ground."
      *   *Addressing the Parents:* Explain "blorpt" clearly so they get the stakes.

  9.  **Final Review against constraints:**
      *   5 mins? Yes, looks about right.
