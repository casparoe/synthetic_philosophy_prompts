answer: |-
  Here is a draft for your 5-minute speech. It's written to be spoken at a conversational pace (about 750 words). I've included stage directions in brackets to help with the delivery.

  ***

  **Title:** The Blorpt and the Time Machine
  **Time:** Approx. 5 Minutes

  [Walk to the podium, take a breath, and smile. Look at the grads first, then the parents, then the instructors.]

  Hi everyone. Full disclosure: I once dropped an Intro to Philosophy class after two weeks. I couldn't handle the reading. So, standing here to talk about "intelligence" and "understanding" feels a little ironic. But I am a backend developer, and I spend my days wrestling with the very thing you're all worried about: AI.

  I know the vibe right now. You've spent months learning to code, and the headlines say, "Don't bother, the robots are coming." Even in this room, I know there's a debate. Some of your instructors say these tools are just fancy autocomplete—parrots with math degrees. Others say they're junior teammates that actually get what you mean.

  I'm not going to solve that debate today. But I want to tell you two true stories about a support bot my team runs. These stories explain why you shouldn't panic, but you also shouldn't get lazy.

  Story one: A user sent a ticket. It was a mess. It was half English, half Tagalog slang, and it used a word that does not exist in the public dictionary: "blorpt."

  "Blorpt" is our internal nickname for a specific, stuck deployment state. No AI model has ever seen that word in its training data. It shouldn't have known what it meant. But, we had pasted our internal runbook into the bot's memory. The bot looked at the messy slang, looked at the runbook, and figured out: "They don't want a refund. They want to cancel the deploy." It stitched the steps together perfectly. It looked like it understood the culture, the code, and the problem.

  Story two: One week later. Same bot. A customer asked about our API versions. The bot confidently explained the features of Version 4.7. It gave endpoint URLs. It explained how to use the "time-travel rollback" feature.

  There is no Version 4.7. There is no time-travel rollback. The bot lied. And when the customer said, "This doesn't work," the bot didn't apologize. It doubled down. It explained *why* the customer was failing to use a feature that doesn't exist.

  [Pause for a beat]

  So, here is the honest truth, stripped of the hype.

  What is settled science? We know how these models work technically. They are prediction engines. They calculate the next likely word based on patterns. That is not debated.

  What is genuinely debated? Whether predicting words counts as "thinking." Some smart people say yes, some say no. I don't know. And honestly? For your first job, it doesn't matter.

  Here is why: In the first story, the bot was useful because a human had set the context. In the second story, the bot was dangerous because a human wasn't checking the truth.

  If you treat AI like a magic oracle, it will burn you. It will hallucinate libraries, invent functions, and lie about errors with total confidence. If you treat it like a junior teammate who never sleeps but sometimes takes crazy pills, it's the most powerful tool you've ever held.

  [Look directly at the grads]

  Your value as a developer is not typing syntax. The bot can type syntax. Your value is knowing what is true. Your value is knowing that "time-travel rollbacks" sound cool but are physically impossible. Your value is knowing that "blorpt" means we need to check the server logs, not the billing database.

  The parents in the back might wonder, "So, do they need to learn code if the computer writes it?"

  Yes. Because when the computer lies, you need to know enough to catch it. When the computer gets stuck, you need to know enough to unstick it. The AI can drive the car, but you are the one who knows the destination.

  [Turn slightly to the instructors]

  To the instructors who say it's just autocomplete: You're right about the mechanism.
  To the instructors who say it's a teammate: You're right about the workflow.
  But the graduates need to know that *they* are the senior engineer in the relationship.

  [Back to the grads]

  So, here is my advice for Monday morning:
  Use the tools. Let them write your boilerplate. Let them summarize your docs. But never, ever commit code you don't understand. If you can't explain it to the person sitting next to you, you can't explain it to the bot, and you certainly can't explain it to the production server when it crashes at 3 AM.

  You are not graduating into a world where code doesn't matter. You are graduating into a world where *judgment* matters more than ever. The bot can give you an answer, but only you can take responsibility for it.

  You survived the bootcamp. You learned how to learn. That is the one thing the models can't do yet. They predict the future based on the past. You? You get to build the future.

  Congratulations. Go ship something real.

  [Nod to the crowd, step back.]
