  *Wait, one nuance on "Blocked Agency":* The user defines it as "capacity quietly removed by an institution." In *Remains*, Stevens *believes* he is blocked by duty, but the reader sees he *chooses* the duty. So is it Blocked or Withheld? It's *misidentified* Blocked agency that is actually Withheld. This is a great point to make.

