ctly one of the sentences pinned to this board is true" and N2 saying "snow is white". I say N1 is gappy — yet if I pin up a third true sentence, N1 becomes straightforwardly false, and that difference feels like a technicality. (h) A politician who, having made several ordinary claims at a press conference, says "every claim I have made in this press conference is false": I would happily print False, even though for the written Liar I insist on neither. (i) "This sentence is not true", and then "this sentence is not determinately true": in both cases I want to state my verdict in the very words the sentence uses, and in both cases that seems to be exactly what I'm not allowed to do.

