answer: |-
  Here is the architectural plan for the ninety-minute session. It is designed to move the students from a mathematical understanding of bounds to an epistemic understanding of licensing.

  ### 1. The Dependency Structure

  You must teach the concepts in this specific order: **Licensing $\rightarrow$ Threat Model $\rightarrow$ Worst-Case $\rightarrow$ Average-Case $\rightarrow$ Distribution Provenance.**

  **The Logic:**
  1.  **Licensing (0–15 mins):** Start with *action*. A guarantee is not a truth claim; it is a permission slip. Ask: "What action does this paper license me to take?" If you start with the math (PAC/Minimax), they will treat guarantees as properties of the model rather than constraints on the deployer.
      *   *What breaks if swapped:* If you define "average-case" before "licensing," students will treat the guarantee as a performance metric (like accuracy) rather than a safety constraint. They will ask "Is 99% good enough?" rather than "Am I allowed to deploy?"
  2.  **Threat Model (15–30 mins):** Define the set of possibilities the guarantee covers. A guarantee is always "against" something.
      *   *What breaks if swapped:* If you introduce Worst-Case before the Threat Model, students will define Worst-Case as "all mathematically possible inputs" (including noise that violates physics or protocol). This makes Worst-Case trivially impossible. The Threat Model restricts the universe to "plausible challenges."
  3.  **Worst-Case vs. Average-Case (30–50 mins):** Now distinguish the quantification over the Threat Model.
      *   *What breaks if swapped:* If you introduce the Threat Model *after* the distinction, the Formal Methods students will argue that the Threat Model *is* the prior distribution. You need to establish that the Threat Model is a set, and the Distribution is a measure over that set, before you split them.
  4.  **Distribution Provenance (50–65 mins):** Who chose $D$? Can you sample from it? This must follow the Average-Case definition immediately.
      *   *What breaks if swapped:* If you leave this for the end (as a "limitation"), they will treat the distribution as a given natural kind (like "the data") rather than an assumption they are inheriting.

  **On PAC/Minimax:** Do not use PAC or Minimax notation as the primary frame. PAC smuggles in the assumption that the training and test distributions are identical (i.i.d.), which obscures the "Unsamplable Distribution" complication you need to teach. Minimax assumes a zero-sum game against an adversary, which biases the Formal Methods students too early. Use set-theoretic and measure-theoretic language ($\forall x \in S$ vs. $\mathbb{P}_{x \sim D}$) instead.

  ### 2. The Core Example: The High-Value Phishing Filter

  **The Claim:** "This filter prevents fraudulent emails from reaching the inbox."

  **Why it works:**
  *   **Same Target Claim:** Both formulations address "fraud reaching the inbox."
  *   **Rival Versions:**
      *   *Worst-Case:* "For any email constructible within the protocol standards, fraud probability is 0."
      *   *Average-Case:* "For an email drawn from the incoming stream $D$, fraud probability is $< 10^{-6}$."
  *   **Structured Tail:** The failure mode is **spear-phishing**. These are rare in the general stream $D$ (making the average-case look excellent) but systematically correlated with high-value targets (making the failure catastrophic for the specific users that matter). This is not noise; it is structure.
  *   **No Doom/Deception:** It is a standard classification problem. The "catastrophe" is financial loss, not existential risk, keeping the focus on the guarantee structure.
  *   **No Trolley Problem:** It avoids moral dilemmas about killing/saving; it is about liability and safety protocols.

  **Cost of Constraints:** You must explicitly forbid students from arguing about whether the filter *can* be perfect. The point is not the engineering feasibility, but what the *claim* licenses. If they argue feasibility, remind them: "We are analyzing the guarantee, not the model."

  ### 3. The Misconception Map

  Here is the chronological order in which misconceptions will form, and how to block them.

  1.  **Minute 15: "Worst-Case is just Average-Case with a pessimistic prior."**
      *   *Source:* Introducing the Threat Model too loosely.
      *   *Block:* Explicitly draw the Threat Model as a **set** (boundary), not a density. Worst-case quantifies over the set; Average-case quantifies over a measure on the set.
  2.  **Minute 35: "Average-case is just worst-case weakened, a confession of failure."**
      *   *Source:* The transition from Worst to Average.
      *   *Block:* Frame Average-Case not as "we gave up on Worst" but as "we are licensing a different action." Worst-case licenses *universal* deployment; Average-case licenses *statistical* deployment (e.g., insurance-backed).
  3.  **Minute 45: "Average means average over the training distribution."**
      *   *Source:* Their ML background (empirical risk minimization).
      *   *Block:* This is the most critical sequence-induced error. When defining $D$, explicitly label it $D_{\text{deploy}}$. Ask: "Do you have samples from $D_{\text{deploy}}$ before you deploy?"
  4.  **Minute 55: "The tail is an add-on to be bolted on after the average has been secured."**
      *   *Source:* Treating the integral $\int$ as "bulk" + "remainder."
      *   *Block:* Use the spear-phishing example. Show that the tail *dominates* the expected loss if the cost per error is high enough. The tail is part of the average, not outside it.
  5.  **Minute 70: "If worst-case is unattainable, then one has no guarantee at all."**
      *   *Source:* The Formal Methods faction reacting to the Average-Case section.
      *   *Block:* This is addressed in the Faction Engagement section (see below).

  ### 4. Structural Complications

  Do not append these. Weave them into the definition of the terms.

  **Complication 1: The Unsamplable Distribution (Epistemology)**
  *   **Where:** Minute 40, immediately after defining Average-Case.
  *   **How:** When you write $\mathbb{P}_{x \sim D}$, stop and ask: "Who generated $D$?"
  *   **The Move:** Show that in safety-critical deployment, $D$ is often the *future* environment. The defender cannot sample from the future. Therefore, the guarantee is **unfalsifiable until after failure occurs**.
  *   **Why:** This makes them feel the epistemic weakness of Average-Case not as a data problem ("we need more test sets") but as a structural problem ("we are betting on a distribution we cannot touch").

  **Complication 2: Reactivity / Goodhart (Optimization)**
  *   **Where:** Minute 55, during the Licensing discussion.
  *   **How:** Ask: "If I license deployment based on this Average-Case guarantee, how does the Threat Model change?"
  *   **The Move:** Attackers optimize against the filter. If the guarantee is public, $D$ shifts to the tail (spear-phishing becomes common). The guarantee degrades *because* it was used to license action.
  *   **Why:** This prevents them from treating the guarantee as a static property of the model. It becomes a property of the *system-in-environment*.

  ### 5. Where the Two Factions Get Engaged

  **Timing:** Minute 65–75 (After the distinction and complications are established, before the final check).
  **Duration:** 10 Minutes.
  **Strategy:** Do not try to resolve the disagreement. Map it.

  *   **To the Formal Methods Students:** Acknowledge their position is correct *if* the license required is "absolute safety." Ask them: "If worst-case is impossible, is your position that we simply do not deploy? If so, that is a valid policy, but it is a policy choice, not a mathematical necessity."
  *   **To the Interpretability Students:** Challenge their position directly. "You believe interpretability upgrades average-case evidence. Does interpretability allow you to sample from the future distribution $D_{\text{deploy}}$? If not, interpretability reduces uncertainty about the model, but not uncertainty about the world."
  *   **The Resolution:** Name the disagreement as a **Burden of Proof** question. Formal Methods demands proof of safety; Interpretability demands evidence of understanding. Both are valid research programs, but they license different actions. Leave it as a live question: "Which burden of proof does your subfield intend to carry?"

  ### 6. Check for Understanding

  **The Board Question (Minute 80):**
  > "A paper proves that a system satisfies Claim $C$ with probability $1-\delta$ over distribution $D_{\text{test}}$.
  > You are asked to deploy this system to population $P$.
  > **Under what specific condition is this proof sufficient to license deployment?**"

  **Diagnostically Distinct Wrong Answers:**

  1.  **Answer:** "When $P$ is similar to $D_{\text{test}}$."
      *   **Diagnosis:** **The "Training Dist" Misconception.** They think similarity is enough. They missed the *Provenance* complication. They don't realize $D_{\text{test}}$ might be unsamplable or manipulated.
      *   **Correction Needed:** Similarity is not a guarantee. You need a bound on the shift between $D_{\text{test}}$ and $P$.

  2.  **Answer:** "Never. You need a worst-case guarantee."
      *   **Diagnosis:** **The "No Guarantee" Misconception (Formal Methods rigidity).** They missed the *Licensing* framing. They don't see that average-case licenses *statistical* risk acceptance (e.g., insurance).
      *   **Correction Needed:** Average-case licenses deployment *with monitoring/insurance*, not "never."

  3.  **Answer:** "When we can interpret the model to verify it works on $P$."
      *   **Diagnosis:** **The "Interpretability Upgrade" Misconception.** They think interpretability solves the distribution shift problem.
      *   **Correction Needed:** Interpretability explains the model, not the deployment environment.

  **Right Answer:** "When you have a separate guarantee that the shift between $D_{\text{test}}$ and $P$ is bounded, OR when you accept the risk $\delta$ conditional on $D_{\text{test}}$ being a valid proxy for $P$."

  ### 7. What to Explicitly Refuse

  You must draw a boundary to keep the session conceptual. If you do not, the ML students will try to solve the problem with optimization.

  **The Refusal Statement (Minute 10):**
  > "In this session, we will not discuss **how to construct** these guarantees (robust optimization, verification tools), nor will we discuss **how to recover** when they fail (monitoring, patching). We are treating the guarantee as a black box input. If you ask 'How do I make this worst-case bound tighter?', I will not answer. That is an engineering question. Our question today is: 'If you hold this bound in your hand, what are you allowed to do?' We are studying the epistemology of the claim, not the mechanics of the proof."

  **Why:** This prevents the Formal Methods students from drifting into tool discussions and the Interpretability students from drifting into mechanism explanations. It keeps the focus on the *license*.
