  LEAF DEFINITIONS & TESTING
  =============================================================================
  LEAF 1: STRICT RETRIBUTIVE
  Content: Debt is individual, fixed, external, and apportioned. (Classical Nyaya-ish)
  Awkward Commitment: A reformed saint must still suffer catastrophe to balance the books.
  Falsifying Evidence: A verified case where genuine remorse permanently averts predicted misfortune.

  LEAF 2: NON-INDIVIDUAL/COMMUNAL
  Content: The ledger belongs to a lineage, not a person; debt is fungible. (Family/Clan Karma)
  Awkward Commitment: An innocent child suffering is morally equivalent to the parent paying.
  Falsifying Evidence: A case where transferring merit demonstrably fails while individual suffering succeeds.

  LEAF 3: SUBJECTIVE/REFORMATIVE
  Content: Debt attaches to the psychological agent; memory or reform cancels it. (Modern Psychological)
  Awkward Commitment: A sociopath with no memory of crime owes nothing; a remorseful saint owes much.
  Falsifying Evidence: Amnesic patients suffering specific traumas correlated with forgotten acts.

  LEAF 4: ACTUARIAL/FINANCIAL
  Content: Karma accrues interest or expires; time is a variable in the moral equation. (Folk/Transactional)
  Awkward Commitment: Delaying punishment makes it morally worse (or better) than immediate punishment.
  Falsifying Evidence: Equal outcomes for immediate and delayed consequences regardless of duration.

  LEAF 5: STORED/ADMINISTERED
  Content: Merit/demerit is a substance or potency stored and dispensed by a system. (Jain/Mimamsa)
  Awkward Commitment: Moral quality is a physical quantity that can be transferred like currency.
  Falsifying Evidence: Proof that moral acts leave no ontological trace or "subtle matter" residue.

  LEAF 6: PEDAGOGICAL
  Content: Suffering is a lesson; if no learning occurs, the karma is incomplete. (Theravada-ish)
  Awkward Commitment: Infants or the severely demented cannot be subjects of karmic justice.
  Falsifying Evidence: Infants suffering specific traumas with no possibility of cognitive integration.

  LEAF 7: DETERRENT/CORRECTIVE
  Content: Suffering conditions behavior; understanding is not required, only causal impact. (Consequentialist)
  Awkward Commitment: Secret suffering (unknown to the agent) counts as valid karmic fruit.
  Falsifying Evidence: Secret suffering fails to alter future behavioral probabilities in the agent.

  LEAF 8: CRITICAL MORAL LAW
  Content: Karma explains distribution, but independent justice standards still apply. (Humanist)
  Awkward Commitment: The universe is lawful, but the law itself can be indicted as unjust.
  Falsifying Evidence: A coherent metaphysics where "unjust" has no meaning outside the karmic law.

  LEAF 9: QUIETIST/THEODICY
  Content: The law is perfect; suffering is deserved; complaint is ignorance. (Traditional Theodicy)
  Awkward Commitment: No instance of suffering can ever be legitimately protested.
  Falsifying Evidence: A case of suffering that intuitively demands protest despite karmic explanation.

  LEAF 10: IMPERSONAL LAWLKE
  Content: Moral causation is like gravity; no desert, no judge, just pattern. (Naturalistic)
  Awkward Commitment: Calling the outcome "unjust" is a category error, like calling gravity cruel.
  Falsifying Evidence: Evidence of agency, judgment, or exception-making in the distribution of outcomes.

