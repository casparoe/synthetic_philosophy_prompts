answer: |-
  KARMA LEDGER SORTING TREE (HANDOUT v1.0)
  Instructions: Start at Node 1. Answer the concrete claim. Follow the arrow to the next Node or Leaf. Record your path (e.g., 1A-2B-Leaf C).

  NODE 1: THE LINK
  When a bad outcome follows a bad act, is it because:
  (A) The agent *deserves* it (Retributive) -----> GO TO NODE 2
  (B) It *teaches* or prevents harm (Utility) -----> GO TO NODE 7
  (C) It is a *lawful pattern* without desert (Law) -----> GO TO NODE 9

  --- DESERT BRANCH ---
  NODE 2: FUNGIBILITY (Transfer/Vicarious)
  If a priest or parent discharges the debt, or a child suffers the parent's wrong, is the ledger balanced?
  (A) Yes, debt/merit can move -----> LEAF 2 (Non-Individual/Communal)
  (B) No, debt sticks to the agent -----> GO TO NODE 3

  NODE 3: CONTINUITY (Unremembered Wrong)
  If the agent has no memory of the act (e.g., deep amnesia or past life), do they still owe the debt?
  (A) No, memory/identity is required -----> LEAF 3 (Subjective/Reformative)
  (B) Yes, the account survives memory loss -----> GO TO NODE 4

  NODE 4: INTERNAL STATE (Reformation/Remorse)
  *Collapses "Reformed Wrongdoer" and "Double Payment" cases.*
  If the agent genuinely reforms or pays in remorse before the outcome lands, is the external debt cancelled?
  (A) Yes, internal payment clears external debt -----> LEAF 3 (Subjective/Reformative)
  (B) No, the debt must be suffered externally -----> GO TO NODE 5

  NODE 5: INTEREST (Accrual/Expiration)
  Does the debt grow with delay, or can it expire (statute of limitations)?
  (A) Yes, time changes the value (Accrual/Expiry) -----> LEAF 4 (Actuarial/Financial)
  (B) No, the debt is fixed and eternal -----> GO TO NODE 6

  NODE 6: JOINT HARM (Apportionment)
  If two agents push a rock that kills someone, is the karmic debt split or shared?
  (A) Split proportionally -----> LEAF 1 (Strict Retributive)
  (B) Shared fully by each (or Administered) -----> LEAF 5 (Stored/Administered)

  --- UTILITY BRANCH ---
  NODE 7: RECOGNITION (Unlearnable/Unrecognized)
  If the sufferer is an infant, dead, or never knows why they suffered, does the karma still "work"?
  (A) No, they must learn from it -----> LEAF 6 (Pedagogical)
  (B) Yes, deterrence/conditioning works without knowledge -----> GO TO NODE 8

  NODE 8: SYMMETRY (Rewards vs. Burdens)
  Does the ledger track good acts (rewards) or only bad acts (corrections)?
