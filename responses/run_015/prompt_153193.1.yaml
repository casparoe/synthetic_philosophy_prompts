prompt: |-
  You are a normative ethicist and political philosopher specializing in the ethics of public office. Before you begin constructing anything, take time to think carefully about the standard framing of the dirty-hands problem—where holding political office sometimes requires actions that are morally wrong by ordinary standards but justified by public necessity—and consider what structural features would have to be present to reverse the usual comparative verdicts between dirty-hands theory and consequentialism. Your task is to design a thought experiment built to precise specifications. Build a realistic, non-science-fiction scenario set in an actual government institution or workplace—no trolleys, no exotic technology, contained in roughly one paragraph—in which a dirty-hands theorist is compelled to act with greater moral scruple and to refuse a particular morally tainted compromise, while both an act-consequentialist and a rule-consequentialist with genuinely optimal rules are driven to endorse that same compromise. The dirty-hands theorist's refusal must fall out genuinely from the internal logic of role-responsibility and representative authority: specifically, from the idea that accepting moral taint generates a standing, non-psychological obligation to preserve procedural integrity and avoid institutionalizing corruption, rather than from an obviously mistaken or straw-man reading of the view. To serve as the structural pivot, introduce one specific institutional mechanism—name it a retrospective democratic-integrity audit—whereby emergency actions are later evaluated not merely by outcomes but by whether they preserved the democratic procedures that grant the office its legitimacy.

  After presenting the scenario, walk through the reasoning of all three positions, stating exactly what each says about the politician's choice and why. Then identify the precise feature doing the work—likely the interaction between one-time moral taint and the temporal extension of institutional corruption through that audit mechanism—and explain honestly what happens if you remove it: does the case collapse back into a standard dirty-hands example in which the dirty-hands view is the more permissive one? Also provide the attack a defender of the more ruthless consequentialist position would mount: what simplifying assumption they might accuse you of smuggling in, and whether that criticism succeeds. Throughout, clearly separate what is broadly settled in discussions of political morality—such as that the problem applies specifically to roles with coercive or representative authority, and that moral wrongness is not automatically canceled by public benefit—from what remains genuinely contested, including whether moral residue generates further obligations or is merely an affective cost, and whether institutional preservation can ever outweigh immediate public harm. Do not present any contested interpretation, particularly about whether dirty-hands reasoning licenses future compromises or closes them off, as though it were the consensus view.
