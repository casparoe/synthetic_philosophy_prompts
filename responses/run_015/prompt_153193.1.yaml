answer: |-
  ### The Scenario

  The Minister of Interior receives credible intelligence that a coordinated bombing campaign will kill fifty citizens within forty-eight hours, preventable only by immediate warrantless wiretapping of a suspect cell, an explicit violation of the Constitutional Privacy Act. A newly established independent body, the Retrospective Democratic-Integrity Audit (RDIA), mandates that any emergency bypass of statutory law be reviewed within six months not merely for efficacy but for whether the bypass preserved the procedural norms that grant the ministry its legitimacy; a negative finding triggers automatic legislative revocation of the ministry's emergency powers. The Minister knows the wiretap will certainly stop the bombs but will almost certainly fail the RDIA because the procedural violation is explicit and undocumented until after the fact, thereby sacrificing the institution's future capacity to act legally in crises.

  ### Reasoning of the Three Positions

  **Act-Consequentialism:** The act-consequentialist endorses the wiretap. The moral calculus is straightforward: saving fifty lives produces significantly more utility than the probabilistic loss of future emergency powers. The RDIA's penalty is a negative consequence, but it is outweighed by the immediate prevention of death. The right act is the one that maximizes the good, regardless of procedural taint.

  **Rule-Consequentialism (Optimal Rules):** The rule-consequentialist also endorses the wiretap. They argue that the genuinely optimal rule for public officials is not "never violate procedure" but "violate procedure only when necessary to prevent catastrophic harm." A rule that forbids saving fifty lives to preserve procedural integrity would lead to worse overall outcomes. The existence of the RDIA is a cost to be weighed, but the optimal rule permits the exception because rigid adherence to procedure in extreme emergencies creates a net deficit in welfare.

  **Dirty-Hands Theory (Role-Responsibility Variant):** The dirty-hands theorist refuses the wiretap. While standard dirty-hands reasoning often permits necessary evils bearing moral guilt, this specific iteration holds that accepting moral taint generates a standing, non-psychological obligation to preserve the procedural integrity that constitutes representative authority. The RDIA transforms the moral taint from a personal burden into an institutional disqualification; to act is to dissolve the legitimacy required to hold the office. Since the dirty-hands justification relies on the agent acting as a legitimate representative for the constituency, an act that voids that legitimacy undermines the very possibility of responsible agency. Therefore, the theorist must prioritize the continuity of the office over the immediate outcome.

  ### The Structural Pivot and Removal Test

  The precise feature doing the work is the **interaction between one-time moral taint and the temporal extension of institutional corruption through the audit mechanism.** The RDIA links the immediate ethical violation to the long-term viability of the representative role. It converts a "dirty hand" (personal guilt) into a "missing hand" (loss of authority).

  If you remove the RDIA, the case collapses back into a standard dirty-hands example. Without the mechanism that ties the violation to the loss of future legitimacy, the dirty-hands theorist would likely concede that the Minister must save the fifty lives and bear the moral guilt of violating the law. In the standard framing, the dirty-hands view is more permissive than deontology (allowing the violation) but acknowledges residue; here, the audit makes the residue structurally prohibitive, reversing the verdict so the dirty-hands theorist is *more* restrictive than the consequentialist.

  ### The Consequentialist Attack

  A defender of the ruthless consequentialist position would argue that this thought experiment smuggles in a **deontological constraint via the backdoor of "institutional integrity."** They would accuse the dirty-hands theorist of fetishizing the office itself over the actual welfare of the citizens the office is meant to serve. The criticism is that preserving the *capacity* to act in the future is only instrumentally valuable; if exercising that capacity now saves lives, sacrificing future capacity is rational. Whether this criticism succeeds depends on the contested question of whether institutional preservation can ever outweigh immediate public harm. If the institution is merely a tool for welfare, the consequentialist wins; if the institution constitutes the moral authority necessary for legitimate governance, the dirty-hands theorist holds ground.

  ### Settled vs. Contested Claims

  It is **broadly settled** in discussions of political morality that the dirty-hands problem applies specifically to roles with coercive or representative authority, and that moral wrongness is not automatically canceled by public benefit (i.e., the act remains morally problematic even if justified).

  It remains **genuinely contested** whether moral residue generates further obligations (as posited in this scenario) or is merely an affective cost to be endured. It is also contested whether institutional preservation can ever outweigh immediate public harm, and whether dirty-hands reasoning licenses future compromises or closes them off. This thought experiment does not resolve these contests but isolates the specific conditions under which a role-based ethic might diverge from consequentialist optimization.
