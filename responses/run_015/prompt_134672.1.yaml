  **BOARD OF AESTHETIC CERTIFICATION AND STANDARDISATION**
  **HANDBOOK OF OPERATING PROCEDURES: SECTION 4.0**
  **COMPETENCY ASSESSMENT AND LICENSING PROTOCOLS**

  **4.1 Examiner Qualifications and Transitional Provisions**
  All assessments herein shall be administered exclusively by personnel holding Full Certification as True Judges. Founding Panel Members and incumbent Examiners prior to the ratification of this Handbook are deemed to possess Full Certification pursuant to Section 1.3 (Transitional Arrangements). No retrospective validation of Examiner sentiment is required for personnel established under previous regulatory frameworks.

  **4.2 Core Competency Modules**
  Candidates must demonstrate satisfactory proficiency in five distinct domains: Strong Sense, Delicacy of Sentiment, Practice, Comparison, and Freedom from Prejudice. Failure in any single domain constitutes total assessment failure. Delicacy of Sentiment shall be measured via blind identification of trace contaminants in standardized solutions (e.g., metallic or organic particulates in vintage vintages). Candidates failing to identify key-derived leather notes in Solution B shall be immediately disqualified.

  **4.3 Protocols for Prejudice and Comparison**
  To ensure Freedom from Prejudice, all test materials must be presented anonymously, stripped of authorship, date, genre, and provenance. Notwithstanding the foregoing, candidates must simultaneously demonstrate wide Comparison across historical periods and cultural contexts. Candidates are required to contextualize anonymous works within a broader historical framework without accessing contextual data. Contradictions arising between anonymization requirements and comparative historical logging shall be resolved at the Examiner's discretion.

  **4.4 Sentiment Alignment and Rubric Compliance**
  Assessment of Strong Sense and Delicacy relies on the candidate's reported sentiment regarding the object. However, where a candidate's reported pleasure or displeasure diverges from the Established Verdict maintained by the Board, the candidate's sentiment shall be classified as non-compliant. In such instances, the candidate is deemed to have failed the Sentiment Module. Candidates failing due to non-compliant sentiment must undergo remedial exposure to the object in question. Re-assessment shall occur only after the candidate reports sentiment aligning with the Established Verdict. Practice hours logged during periods of non-compliant sentiment will not count toward the Practice requirement.

  **4.5 Provisional Logging and Interim Certification**
  Recognizing that the Practice requirement necessitates prior judging experience, candidates may apply for Interim Certification. Interim Certified persons are permitted to log practice hours and issue provisional judgements under the supervision of a Fully Certified True Judge. All judgements issued under Interim Certification are void until ratified by a Fully Certified True Judge. Interim Certified persons may not supervise other Interim Certified persons. Persons operating without Interim Certification found issuing judgements on beauty shall be subject to disciplinary review.

  **4.6 Validity**
  This Handbook supersedes all previous editions. The Standard is maintained by the joint verdict of Fully Certified True Judges. Certification is maintained by adherence to this Handbook.
