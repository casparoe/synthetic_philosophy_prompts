answer: |-
  # Seminar Prep Sheet: Hume on Suicide & The Sympathy Loop

  **Thesis:** *Of Suicide* is not a theological rebuttal but a sociological diagnosis. The religious language is a rhetorical shield; the substantive argument is that suicide destabilizes the sympathetic machinery required for moral judgment.
  **Audience:** Hume Scholars (Textual/Doctrinal) + Moral Psych (Mechanism/Normativity).

  ---

  ### 1. The Hume Scholars: Textual & Doctrinal Objections
  *They will attack the fit between your reading and the corpus.*

  *   **The "Sympathy" Vocabulary Gap:**
      *   **Objection:** *Of Suicide* rarely uses the technical term "sympathy" (unlike the *Treatise* or *Second Enquiry*). It talks about "duty to society," "justice," and "neighbor." You are importing *Treatise* psychology into an Essay that operates on civic humanist language.
      *   **Prep:** Acknowledge the terminological shift. Argue that "duty to society" *just is* the operationalization of sympathy in his later, more public-facing work.
  *   **The Permissibility Conclusion:**
      *   **Objection:** Hume concludes suicide is often *permissible*. If your reading shows it ruptures the moral community, aren't you making Hume argue it's *wrong*? You risk making him contradict his own conclusion.
      *   **Prep:** Distinguish between **blameworthiness** (theological/moral sin) and **social cost** (sympathetic rupture). Hume argues it's not a *sin*, even if it has social costs.
  *   **The "Cowardice" Claim (Anachronism/Biography):**
      *   **Objection:** Claiming he "dressed it up" because he was afraid of the church is biographical speculation. Hume scholars hate "Hume was scared" arguments unless backed by correspondence.
      *   **Prep:** Pivot to **rhetorical strategy** rather than fear. He uses religious language because that is the *discourse of the prejudice* he is analyzing. He meets the argument on the opponent's turf to dismantle it.

  ### 2. The Moral Psych Folks: Normativity & Mechanism
  *They will attack the mechanism of your argument.*

  *   **Sympathy is Too Thin:**
      *   **Objection:** Sympathy is a mechanism of transmission, not a normative standard. A "rupture" describes a psychological state, not a moral violation. How does a broken loop generate *normative* force?
      *   **Prep:** For Hume, morality *is* sentiment. If the community cannot sympathize with the agent, the agent exits the moral community. That exclusion *is* the normative weight.
  *   **Grief vs. Instability:**
      *   **Objection:** Suicide causes grief, but grief doesn't necessarily destabilize moral judgment. We can sympathize with the dead. Why does this specific act break the loop rather than just trigger sadness?
      *   **Prep:** It's not the death, it's the **volition**. Sympathy relies on shared intentions. A voluntary exit from the "game" of life makes the agent's intentions unintelligible to the survivors, breaking the mirroring process required for judgment.

  ### 3. Triage: What Lands vs. What's a Bluff
  *   **LANDS (Concede & Pivot):**
      *   **Textual Vocabulary:** Yes, "sympathy" isn't the headline term in the Essay. *Pivot:* The *mechanism* of social duty is sympathy, regardless of the label.
      *   **Posthumous Publication:** Yes, he hid it. *Pivot:* That proves the religious language was a necessary containment strategy for the argument, not the argument's core.
  *   **BLUFF (Stand Firm):**
      *   **"Hume is a Theist here":** They might claim Hume takes the God-argument seriously. *Stand:* The essay is a reductio. He grants their premises to show they lead nowhere.
      *   **"Sympathy can't ground norms":** *Stand:* In sentimentalist ethics, social cohesion *is* the ground of norms.

  ### 4. Strategic Concessions (Say these early)
  1.  **"I am not arguing Hume thinks suicide is immoral."** He thinks it's permissible. I am arguing he identifies why society *feels* it is immoral (the sympathy rupture).
  2.  **"I am not arguing the word 'sympathy' appears on every page."** I am arguing the *structure* of the 'Duty to Neighbor' section relies on sympathetic mechanics developed in the *Treatise/Enquiry*.
  3.  **"The religious language is not a lie."** It is the *object of analysis*. He uses their language to show why their anxiety exists, even if their theology is false.

  ### 5. The Two-Minute Reply (The Core)
  *Memorize this structure. If you get lost, come back here.*

  "Hume's project in *Of Suicide* is often read as a negative clearing-house: removing God, removing Duty, removing Self-Interest to show suicide is permissible. I'm arguing there's a positive undercurrent: explaining why the prohibition persists even when the theology fails.

  When Hume addresses the 'Duty to Neighbor,' he doesn't just say 'you lose a citizen.' He points to the disruption of social engagement. In Hume's broader system, moral judgment relies on a stable loop of sympathy—we judge others by projecting ourselves into their situation. Suicide is unique because it is a volitional exit from the field of projection. You cannot sympathize with a decision to end the capacity for sympathy.

  This doesn't make suicide a sin against God; it makes it a rupture in the social fabric that generates moral norms. Hume dresses this in religious language not because he believes the theology, but because the Church is the guardian of that social fabric. He is diagnosing the *function* of the taboo, not endorsing the *doctrine*. So, the essay isn't about God owning our lives; it's about how we own each other's intelligibility."

  ### 6. The "Prayer Objection" (Instrumentalism)
  *The question you dread:* **"If the wrongness is just about rupturing the sympathy loop, isn't suicide only *instrumentally* wrong? Does Hume have no deontic constraint here? It seems like you're reducing morality to social stability."**

  *   **Why it's dangerous:** It makes Hume look like a crude utilitarian and misses the sentimentalist nuance. It suggests you've missed the "moral" part of moral psychology.
  *   **The Deflection (Don't Dodge, Reframe):**
      *   **Do not say:** "Well, consequences matter most."
      *   **Do say:** "For Hume, 'instrumental' and 'moral' aren't distinct categories the way they are for Kantians. If morality arises from sentiment, and sentiment arises from social connection, then damaging the connection *is* the moral injury. It's not instrumentally wrong *because* it hurts stability; it is morally wrong *insofar as* it severs the tie that makes morality possible. But—and this is Hume's crucial move—that moral injury is weighed against the agent's misery. If the misery is high enough, the rupture is excusable. So it's not a deontic constraint; it's a sentimental cost-benefit analysis."

  **Final Tip:** If a Hume scholar quotes a specific passage where Hume mentions "God" or "Providence," do not deny the text. Say: *"Hume is citing the prejudice to dismantle it. My claim is that the structural work in the argument is being done by the social/sympathetic premise, not the theological one."*
