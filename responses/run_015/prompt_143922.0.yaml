  I'm prepping a talk for next tuesday's phil dept grad seminar — crowd is mostly Hume scholars plus a couple moral psych folks — defending the claim that Hume's essay on suicide isn't really about God owning our lives but about suicide rupturing the sympathy loop that makes moral judgment stable in his system. I think he dresses it up in religious language because he was afraid of the church. I need a prep sheet: what will the Hume people object to in their vocabulary (textual evidence, anachronism, etc.), what will the psych people say about sympathy being too thin to carry normative weight, which objections actually land and which are bluffs, what I should concede right away, and the one reply I have to nail in under two minutes. Also tell me the objection I'm praying nobody asks — probably whether this makes suicide wrong only instrumentally — and how to deflect it without looking like I'm dodging. Keep it practical, not a literature review; I'll handle citations myself.
