  I'm in a cog sci reading group (third-year undergrad, one syntax class behind me, mostly know this stuff from blog posts) and we spent like an hour going in circles last night, so I'm posting here hoping someone can tell me whether I was asking something dumb.

  The setup: we were talking about LLMs and one guy said the poverty of the stimulus argument is definately dead now — GPT-style models pick up syntax from raw text with no innate Universal Grammar built in, so the nativists were just wrong, and anyway the argument was always only the claim that kids don't hear enough words. That feels wrong to me but I couldn't say why. My professor, who I don't think is a nativist either, muttered something like "the argument was never about the volume of the data" and then had to run to office hours, so I've been chewing on that ever since. My own reconstruction is this: the real point is that the child never gets the *right kind* of evidence — nobody sits them down and tells them which sentences are ungrammatical, and the sentences that would settle certain questions about long-distance dependencies basically never come up — so the data underdetermines the grammar they end up with, and piling on more words of the same kind doesn't help. And the conclusion, on my reading, is only that the learner must be bringing *some* constraint to the task, not that there's a rich language-specific organ in the head. If that's right then the LLM result doesn't touch it at all: the model gets trillions of tokens instead of a few million of child-directed speech, a totally different objective (guess the next word rather than, you know, acquire a grammar), and its own stack of inductive biases from the architecture and the training setup, which are innate in exactly the thin sense the argument needs. But I genuinely can't tell whether that's a real reply or whether I've quietly stretched innate until nothing could ever refute it. Which is the thing I actually want to know: what would count as evidence against the argument? Concretely — suppose someone trained a model on a genuinely child-sized corpus, same rough number of words a kid actually hears, nothing else, and it still got the right calls about which dependencies are impossible. Would that