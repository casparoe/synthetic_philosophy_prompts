answer: |-
  The phrase "information is physical" is indeed a slogan rather than a single theorem, which is why it functions as a conversation-stopper. It was coined by **Rolf Landauer** in his 1991 paper *"Information is Physical"* (Physics Today), though the intuition dates back to Szilard (1929) and was operationalized by Charles Bennett (1982).

  Your friend is using the slogan to do heavy lifting without specifying *which* physical constraint he intends. Below is a menu of the five distinct claims hidden inside that sentence, ranked from trivial to metaphysical.

  ### The Menu of Readings

  **1. Substrate Dependence (The Trivial Reading)**
  *   **Claim:** There are no "free-floating" bits. Every bit of information must be encoded in the state of a physical system (e.g., spin up/down, voltage high/low).
  *   **Status:** **True/Trivial.**
  *   **Relevance:** You and your friend already agree on this. It does not constrain the *size* of the ledger, only its implementation. It does not block the infinite ledger argument.

  **2. Landauer's Principle (The Thermodynamic Reading)**
  *   **Claim:** Logically irreversible operations (specifically erasure) on physical information must dissipate heat. To reset a bit from an unknown state to 0 requires work:
      $$W \ge k_B T \ln 2$$
  *   **Status:** **Substantive/Defensible.** Experimentally verified (e.g., Bérut et al., 2012).
  *   **Relevance:** This is **your** argument. Your friend is trying to *evade* this by proposing a non-erasing ledger. If he invokes this reading, he concedes the debate to you.

  **3. Finite Information Density (The Bekenstein Bound Reading)**
  *   **Claim:** A physical system with finite energy $E$ and radius $R$ can contain only a finite amount of distinguishable information $I$. The Bekenstein bound states:
      $$I \le \frac{2\pi R E}{\hbar c \ln 2}$$
  *   **Status:** **Substantive/Defensible** (within QFT and Black Hole thermodynamics), though often neglected in classical stat mech.
  *   **Relevance:** **This is the only reading that kills the infinite ledger.** If the demon's box (or the universe) has finite energy/volume, it has a finite bit capacity. An "ever-growing ledger" eventually saturates the physical available states of the system.
  *   **Verdict:** If your friend means this, he is arguing that the ledger *cannot* grow infinitely. This actually **concedes your point** (the Demon must stop or erase) but attributes it to storage capacity rather than erasure cost.

  **4. Information Conservation (The Unitarity Reading)**
  *   **Claim:** In a closed quantum system, time evolution is unitary. Information is never destroyed; distinct initial states map to distinct final states. Erasure is physically impossible without dumping entropy elsewhere.
  *   **Status:** **Substantive/Debated.** (Core of the Black Hole Information Paradox).
  *   **Relevance:** This supports your friend's claim that the demon *shouldn't* erase (because it can't fundamentally). However, combined with Reading #3, it implies the ledger must grow until it hits the Bekenstein bound, at which point the system thermalizes and the Demon stops working.

  **5. Ontological Fundamentalism ("It from Bit")**
  *   **Claim:** Information is not just a property of physical systems; physical systems are manifestations of information. Reality is computational. (Attributed to John Wheeler).
  *   **Status:** **Metaphysical/Unfalsifiable.**
  *   **Relevance:** Does no technical work in a thermodynamics argument.

  ---

  ### Diagnosis: What is your friend doing?

  Your friend is likely conflating **Reading #4 (Conservation)** with **Reading #1 (Substrate)**.

  He wants to say: "Information is real (Reading 1) and indestructible (Reading 4), so the Demon *must* keep the ledger forever."
  But when you ask about the coherence of an infinite ledger, he invokes "Information is physical" to imply **Reading #3 (Finite Density)** without realizing it contradicts his infinite ledger proposal.

  **Is he smuggling in the assumption?**
  Yes, but perhaps unintentionally.
  *   **If he means Reading #3:** He is asserting that physical memory is bounded. This is not question-begging; it is an independent constraint from general relativity/QG. However, it forces him to admit the Demon *cannot* run forever, which saves the Second Law (your goal).
  *   **If he means Reading #1 or #4 only:** He has no answer to your objection. An infinite ledger of physical bits requires infinite space/energy. If the universe is finite, his scenario is physically incoherent.

  ### How to Resume the Argument

  Since you are a TA, you can press him on the **Bekenstein Bound**. Ask him this:

  > "If information is physical, it occupies phase space. Does your infinite ledger require infinite phase space volume? If yes, it's impossible in a finite universe. If no, then the memory states must eventually repeat or overlap, which means the memory is effectively finite and must be erased. Either way, the Second Law holds."

  **The Bottom Line:**
  The sentence "information is physical" is usually invoked to **save** the Second Law (via Landauer or Bekenstein), not to challenge it. Your friend is using a principle that typically implies *constraints on information processing* to argue for *unconstrained information accumulation*. He is wielding a shield as a sword.

  **Recommendation:** Grant him that erasure isn't strictly necessary *if* memory is infinite. Then hit him with Reading #3: "Okay, but since information is physical, show me the Hamiltonian for an infinite memory register in a finite box." That usually ends the infinite ledger fantasy.
