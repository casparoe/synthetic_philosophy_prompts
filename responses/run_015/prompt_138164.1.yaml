answer: |-
  This is a profound dilemma. You are discovering that the statute is a skeleton, but the flesh of the commission is made of moral philosophy. You are struggling because you are trying to apply a legal rule to a political and ethical problem.

  Your gut is actually more consistent than you think. You have already abandoned "Truth-Maximisation" (the Commander case proves that). You have also abandoned "Strict Retribution" (the Foot Soldier and Child cases).

  Here is the principle that unifies your verdicts, the one verdict that threatens it, and how to handle your unresolved and future cases.

  ### The Principle: Civic Reintegration, Not Forgiveness

  Your working principle is not about absolving sin, nor is it purely about gathering intelligence. It is about **determining who can be safely reintegrated into the new civic body.**

  Amnesty, in your hands, is not a pardon. It is a **visa back into citizenship.** You are granting it to those whose return strengthens the peace, and denying it to those whose return threatens the legitimacy of the new order.

  Here is how your verdicts map to this principle:

  *   **Foot Soldier & Driver:** Low moral agency. They were tools of the conflict. Reintegrating them removes a destabilised underclass without threatening the new order. **(Consistent)**
  *   **Child Soldier:** She is a victim first. Reintegrating her is a moral imperative for the health of the future society. Anonymity protects her rehabilitation. **(Consistent)**
  *   **Commander:** High agency, high threat. By saying he would "do it again," he declares himself an enemy of the new order. Granting him amnesty would signal that the new state tolerates those who openly reject its monopoly on violence. Truth is sacrificed for the sake of normative precedent. **(Consistent)**
  *   **False Confessor & Personal Feud:** Both lie. A citizen cannot be reintegrated on the basis of a lie. The False Confessor is worse because he actively corrupts the record. **(Consistent)**
  *   **Wealthy Man:** He attempts to create a two-tiered citizenship where justice is purchasable. Granting this destroys the equality required for the new state to function. **(Consistent)**

  ### The Verdict You Must Drop (Or Modify)

  **The Doctor.**
  You said granting him amnesty "feels wrong." Listen to that feeling. Under the principle of **Civic Reintegration**, the Doctor's verdict is dangerous.

  If you grant him amnesty *solely* because he is useful, you are establishing that some citizens are more equal than others. You are saying utility outweighs justice. This creates a technocratic aristocracy, which undermines the civic trust you are trying to build.

  **The Fix:** Do not drop the amnesty, but change the *condition*. He receives amnesty, but it must be accompanied by a public finding of guilt and a mandatory sentence of community service or reparations. He is reintegrated, but he carries a debt. If you grant him a clean slate because he is useful, you validate the Wealthy Man's logic (that value determines justice), even if the currency is skill rather than money.

  ### The Unresolved Cases

  **1. The Dying Clerk**
  **Verdict: Grant Amnesty.**
  **Reasoning:** This is not about the Clerk; it is about the General. The Clerk is dying; punishment is moot. The "Civic Reintegration" principle applies to the living society. To reintegrate the *society*, you need the truth about the architecture of the violence. The Clerk is the key to prosecuting the Commander-class threats.
  Granting him amnesty is a transactional cost to secure the conviction of a greater threat to the new order. It serves the principle of dismantling the old structures of domination.

  **2. State Agents vs. Rebels**
  **Verdict: Yes, be harsher on the State.**
  **Reasoning:** This is the **Fiduciary Principle.**
  Rebels are private actors challenging the state. When they kill, they commit murder. When State agents kill, they commit **betrayal.**
  State agents hold a monopoly on legitimate violence granted by the public trust. When they abuse that power for political ends, they corrode the very concept of Law. To build a rule-of-law state, you must hold the guardians of the law to a higher standard than those who sought to overthrow it. If you treat them the same, you imply the State's authority was never legitimate to begin with. To restore the State's legitimacy, you must purge its specific corruption more rigorously.

  ### The Future Cases

  **1. The Bragger (Amnesty granted, then boasts on radio)**
  **Verdict: Public Condemnation and Potential Revocation.**
  **Reasoning:** Amnesty is a contract of silence and humility. It is a trade: you give us truth and remorse; we give you freedom from prosecution. By bragging, he violates the spirit of reintegration. He is using the amnesty not to rejoin the community, but to intimidate it.
  If your statute allows revocation for breach of conditions, invoke it. If not, the Commission must issue a scathing public addendum to his file. He has shown he is not a citizen, but a predator. You cannot reintegrate someone who glorifies the violence that tore the community apart.

  **2. The Martyr (Refuses amnesty, demands trial)**
  **Verdict: Grant the Trial. Do not negotiate.**
  **Reasoning:** He wants a platform. He wants to turn the courtroom into a stage for his ideology. The TRC offers peace; the Court offers justice. If he demands justice, give it to him, but deny him the *political* victory of refusing reconciliation.
  Prosecute him efficiently, quietly, and strictly according to criminal law. Do not let him claim he was "denied amnesty." He *chose* the court. By treating him as a common criminal rather than a political prisoner, you strip his actions of the political legitimacy he craves. This upholds the principle that the new order is a system of law, not a contest of wills.

  ### Summary for the Commission

  You are not running a confessional. You are building a foundation.
  *   **Truth** is the material, but **Legitimacy** is the structure.
  *   If a truth (the Commander) undermines the legitimacy of the new state (by showing unrepentant architects walk free), you must sacrifice the truth to save the legitimacy.
  *   If a lie (the Feud/False Confessor) corrupts the record, you must punish it to save the truth.
  *   If a utility (the Doctor) undermines equality, you must condition it to save the civic bond.

  Your gut is telling you that **Amnesty is a privilege of the new democracy, not a right of the old war.** Keep that distinction, and your verdicts will hold.
