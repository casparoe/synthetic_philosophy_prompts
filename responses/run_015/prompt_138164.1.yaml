prompt: |-
  I'm one of the commissioners on a truth commission, a few years into the job. Our statute is roughly: amnesty is available if the applicant makes full disclosure and the act had a political objective. We decide case by case and I've realised I have no idea what my actual principle is, so here are my gut verdicts.

  - Foot soldier who shot one man on orders and told us everything, including who gave the order: amnesty, obviously.
  - The commander who ordered a dozen killings: no amnesty. He gave us more, and more useful, information than anyone else. He also showed no remorse and said he'd do it again. Still no.
  - His driver, who drove the truck and claims he didn't know what was in it: amnesty.
  - A girl abducted at fifteen, kept with the unit two years, who beat a prisoner to death herself: amnesty, and I also want her name kept out of the published report, even though the statute has no provision for that.
  - A man who confessed to killing an informer, except the informer turned up alive in another country. He's confessing to the wrong killing because he won't admit the real one: no amnesty. And I think this is worse than the man who never applies at all.
  - A man who burned a woman's house because he'd been told she was informing, and she wasn't: amnesty. A man who burned his rival's house in what was obviously a personal feud and described it as political: no amnesty.
  - A village where the only doctor is an applicant and everyone, including the victims' families, petitioned for him: amnesty, but it feels wrong. A wealthy applicant whose family offers to fund reparations if he gets amnesty: definately no, and that one feels worse than the doctor.

  Two I can't settle: the clerk who forged the papers that let a squad move around, confessed, is our only witness against a general, and is dying; and whether we're harsher on the state's own people than on the rebels who did the same things (I think we are, and I think that's right, but I can't say why).

  Is there one principle behind all this? Truth-maximising can't be it, given the commander. Which verdicts do I have to drop? And what does whatever principle you come up with say about two cases we haven't had: an applicant who gets amnesty and then brags about it on the radio, and one who refuses amnesty and demands to be prosecuted because he's proud of what he did?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Commissioner on a Truth and Reconciliation Commission (TRC).
      *   **Context:** A few years into the job. Statute allows amnesty for "full disclosure" + "political objective." Decisions are case-by-case.
      *   **Problem:** The user feels they lack a coherent underlying principle for their gut verdicts. They suspect "truth-maximizing" isn't it (citing the Commander case).
      *   **Input:** A list of specific case verdicts (gut feelings) and two unresolved cases.
      *   **Task:** Identify the unifying principle, determine which verdicts might need to be dropped to maintain consistency, apply the principle to the unresolved cases, and address the two hypothetical future cases.
      *   **Tone:** Serious, analytical, ethical, empathetic, but firm. This is a role-play scenario involving deep moral and legal philosophy.

  2.  **Deconstruct the Verdicts (Pattern Recognition):**

      *   *Foot Soldier (Shot 1, followed orders, full disclosure):* **Amnesty.** (Low agency, high compliance, truth told).
      *   *Commander (Ordered 12, full disclosure, no remorse, would do again):* **No Amnesty.** (High agency, high impact, moral repugnance outweighs truth value).
      *   *Driver (Drove truck, claimed ignorance):* **Amnesty.** (Low agency, peripheral role, plausible deniability accepted).
      *   *Child Soldier (Abducted 15, beat prisoner):* **Amnesty + Anonymity.** (Victim-perpetrator, diminished capacity, rehabilitation focus).
      *   *False Confessor (Confessed to wrong killing to hide real one):* **No Amnesty.** (Bad faith, obstructs truth, worse than non-applicant).
      *   *Mistaken House Burner (Thought she was informing):* **Amnesty.** (Political motive, honest mistake).
      *   *Personal Feud House Burner (Called it political):* **No Amnesty.** (No political objective, lying about motive).
      *   *The Doctor (Community needs him):* **Amnesty (but feels wrong).** (Utilitarian benefit vs. Justice).
      *   *The Wealthy Man (Buying amnesty):* **No Amnesty.** (Corruption of process, inequality before law).
      *   *The Dying Clerk (Forged papers, key witness, dying):* **Unresolved.** (Truth value high, punishment moot due to death, leverage needed).
      *   *State vs. Rebels:* **Harsher on State.** (Unresolved justification).

  3.  **Identify the Core Tension:**
      *   The Statute says: Full Disclosure + Political Objective = Amnesty.
      *   The User's Gut says: Sometimes Yes, Sometimes No, even when Statute criteria seem met (e.g., Commander met criteria but was denied; Doctor felt wrong but was granted).
      *   *Key Insight:* The user is implicitly applying a principle of **Moral Culpability and Democratic Restoration**, not just Truth Recovery. The TRC isn't just an information gathering exercise; it's a *normative* one. It aims to re-establish a moral order where certain behaviors are unacceptable, even if they were "political."

  4.  **Formulate the Principle:**
      *   Is it Retributive Justice? No, because the Foot Soldier gets amnesty.
      *   Is it Utilitarian/Truth? No, because the Commander (high truth value) is denied.
      *   Is it Restorative Justice? Closer. It focuses on the community and the future.
      *   *Proposed Principle:* **"Conditional Reintegration based on Moral Agency and Civic Trust."**
      *   *Refinement:* The principle is **The Restoration of Civic Equality.** Amnesty is not a pardon for the act; it is a contract for re-entry into the civic body. You can only re-enter if your act doesn't permanently disqualify you from being an equal citizen, or if your exclusion harms the community more than your inclusion.
      *   *Even Better:* **"The Principle of Non-Domination."** The TRC exists to end a state of exception where power ruled over law. Amnesty is granted to those who were *subjects* of the conflict (foot soldiers, victims-turned-perpetrators, mistaken actors) but denied to those who sought to *establish* a permanent state of domination (Commanders, liars, personal feuders, buyers of justice).

      *   *Let's try a different angle:* **Moral Agency + Sincerity of Political Purpose.**
          *   Foot soldier: Low agency, sincere political context. -> Yes.
          *   Commander: High agency, sincere political purpose but *rejects the new order* (would do it again). -> No. (This is crucial: He refuses to accept the legitimacy of the new peace).
          *   Driver: Low agency. -> Yes.
          *   Child: Diminished agency. -> Yes.
          *   False Confessor: Bad faith. -> No.
          *   Personal Feud: False political purpose. -> No.
          *   Doctor: High social utility, but feels wrong because it trades justice for utility. -> Yes (Utilitarian override).
          *   Wealthy Man: Buys privilege. -> No (Violates equality).

      *   *Synthesis:* The principle is **Legitimacy of the New Order.**
          *   Amnesty is a tool to transition from Conflict to Peace.
          *   It is granted to those whose reintegration supports the Peace.
          *   It is denied to those whose attitudes or actions threaten the Peace or the Moral Foundation of the new State.
          *   *Key Differentiator:* The Commander said he'd "do it again." This signals he is still an enemy of the new order. The Foot Soldier implies he was just doing a job.

  5.  **Evaluate the Verdicts against the Principle:**

      *   *Commander:* Correct. He rejects the new order's monopoly on violence.
      *   *Doctor:* This is the outlier. It feels wrong because it treats the doctor as a means to an end (utility) rather than a moral agent. It violates the "Equality" aspect. *Recommendation:* Drop this verdict or condition it heavily (e.g., amnesty granted but must perform community service/reparations, not just "needed").
      *   *Wealthy Man:* Correct. Buying amnesty violates civic equality.
      *   *State vs. Rebels:* Why harsher on State? Because the State holds the *monopoly on legitimate violence*. When the State breaks the law, it undermines the very concept of Law. Rebels are challenging the law; the State is supposed to embody it. This is consistent with "Restoring Civic Trust."

  6.  **Address the Unresolved Cases:**

      *   *The Dying Clerk:*
          *   Statute: Full disclosure? Yes. Political? Yes (forging for squad).
          *   Principle: Is he a threat? No (dying). Is truth needed? Yes (against General).
          *   Verdict: **Amnesty.** But not for *him*. For the *record*. His amnesty is the price of the General's prosecution. It serves the "Restoration of Law" to catch the Architect.
      *   *State vs. Rebels:*
          *   Justification: **Fiduciary Duty.** State agents are trustees of public power. Rebels are private actors. A trustee stealing is worse than a stranger stealing because it breaks the trust required for governance.

  7.  **Address the Hypothetical Future Cases:**

      *   *Bragging on Radio:*
          *   This is post-amnesty behavior.
          *   Principle: Reintegration requires accepting the *shame* or at least the *gravity* of the act to move on. Bragging glorifies the violence and intimidates victims.
          *   Verdict: **Revoke Amnesty (if possible) or Public Condemnation.** It violates the "spirit" of reconciliation. It shows he never accepted the new order's values.
      *   *Refuses Amnesty/Demands Trial:*
          *   He wants to be a martyr. He wants a platform.
          *   Principle: The TRC offers peace; the Court offers justice. If he demands justice, give it to him. But deny him the *political platform* of the TRC.
          *   Verdict: **Grant the Trial.** Do not let him use the refusal as a political statement. Prosecute quietly and efficiently.

  8.  **Drafting the Response:**

      *   *Acknowledge the weight:* Validate the difficulty of the position.
      *   *Name the Principle:* "The Restoration of Civic Trust and Moral Agency." (Or similar). Let's go with **"The Legitimacy of the New Order."**
      *   *Analyze the Gut Verdicts:* Show how they fit (Commander = threat to order; Child = victim of order; Wealthy = corruption of order).
      *   *Identify the Weak Link:* The Doctor. It's pure utilitarianism and undermines the equality principle.
      *   *Resolve the Unresolved:* Clerk (Amnesty for truth leverage); State vs. Rebels (Fiduciary breach).
      *   *Handle the Hypotheticals:* Bragger (Breach of spirit); Martyr (Grant trial, deny platform).
      *   *Tone Check:* Ensure it sounds like advice from a legal ethicist or senior colleague, not a judgmental AI.

  9.  **Refining the "State vs. Rebels" argument:**
      *   This is a classic TRC dilemma (e.g., South Africa).
      *   Argument: State violence is *systemic*. Rebel violence is *challenging*. To build a rule-of-law state, you must hold the architects of the *system* to a higher standard. The State claimed legality; the Rebels admitted illegality. The State's lie is more damaging to the new truth.

  10. **Refining the "Doctor" critique:**
      *   Why does it feel wrong? Because it instrumentalizes justice. It says "Your life matters more than the victim's death because you are useful." This creates a caste system.
      *   Fix: Amnesty is granted, *but* with a public finding of guilt and mandatory reparations/service. It acknowledges the debt.

  11. **Final Polish:** Check against the prompt's specific questions.
      *   One principle? Yes.
      *   Which verdicts to drop? The Doctor (needs modification).
      *   Unresolved cases? Clerk (Yes), State/Rebels (Fiduciary).
      *   Future cases? Bragger (Sanction), Martyr (Prosecute).

      *(Self-Correction during drafting)*: Wait, if the Commander gave "more useful information than anyone else" and was denied, that explicitly kills the "Truth-Maximizing" theory. The user already knows this. I need to explain *why* that denial was right under the *new* principle.
      *   *Reason:* Truth without accountability for architects creates impunity. Impunity destroys the new order. Therefore, truth from an unrepentant architect is less valuable than the precedent of holding them accountable.

      *(Refining the Principle Name)*: Let's call it **"Civic Reintegration."** Amnesty is not forgiveness; it is a visa back into the community of citizens. You are denied the visa if you show you are still a danger to the community (Commander), or if you try to buy your way in (Wealthy), or if you lie (Feud/False Confessor).

      *(Refining the State/Rebel distinction)*: It's about the *betrayal of public trust*.

      *(Refining the Clerk)*: He is dying. Punishment is moot. Truth is vital. Amnesty is a transaction for testimony.

      *(Refining the Doctor)*: This is the hardest one. If I say "drop it," does that mean deny amnesty? No, it means the *feeling* is right, but the *reasoning* is wrong. Don't grant it because he's needed. Grant it because his culpability was likely low (triage under duress?) OR acknowledge it's a necessary evil but require reparations. Actually, the prompt says "A village where the only doctor is an applicant... amnesty, but it feels wrong." The user *granted* it. I should suggest that this verdict risks undermining the principle of equality. It should be conditional.

      *Let's look closer at the Commander:* "No remorse and said he'd do it again." This is the key. He is an ongoing threat.
      *Let's look at the Foot Soldier:* Implicitly accepts the new order by testifying.
      *Let's look at the Child:* Victim.
      *Let's look at the Wealthy Man:* Tries to bypass equality.

      *Okay, the Principle is: **Amnesty is a contract of submission to the new democratic order.** *
      *   To get it, you must submit (tell truth, admit wrong).
      *   You must show you fit in the new order (not a continuing threat).
      *   You must not corrupt the order (buying it).
