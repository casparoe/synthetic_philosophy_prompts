answer: |-
  # Brainstorming Phase

  **Candidate Concepts & Distinctions:**
  *   **Philosophy of Social Science:**
      *   *Interactive Kinds / Looping Effects (Ian Hacking):* Classifications of people feed back into the people classified, changing them. (User notes this is distinct; here the *description* changes, not necessarily the people).
      *   *Reification (Marx/Lukács):* Treating a social construct as a natural object.
      *   *Natural vs. Conventional Kinds:* Are cohorts discovered (joints of nature) or imposed (convenient cuts)?
      *   *Homeostatic Property Cluster (HPC) Kinds (Boyd/Griffiths):* Real kinds have properties that cluster due to underlying causal mechanisms. Do cohorts satisfy this?
      *   *Boundary Work (Gieryn/Lamont):* The rhetorical and practical effort to draw lines between categories to maintain authority or coherence.
      *   *Ad Hoc Rescue (Lakatos):* Modifying auxiliary hypotheses to protect a core theory from falsification. (Fits "Seam Repair").
      *   *Conceptual Drift (History of Ideas):* The meaning of a term shifts over time while the term remains.

  *   **Demography & Life-Course Sociology:**
      *   *APC Identification Problem (Glenn/Ryder):* The statistical collinearity of Age, Period, and Cohort (Cohort = Period - Age). Makes isolating "cohort effects" mathematically indeterminate without arbitrary constraints.
      *   *Cohort Flow:* The movement of a birth group through time.
      *   *Period Effects:* Historical events affecting all ages, often misattributed to cohorts.
      *   *Generationalism:* The ideological commitment to generations as primary explanatory units (often criticized by demographers).

  *   **Survey Methodology & Psychometrics:**
      *   *Construct Drift:* The operational definition of a variable changes over time, compromising longitudinal comparability.
      *   *Demand Characteristics / Priming:* Respondents alter answers based on cues (e.g., seeing a label).
      *   *Measurement Reactivity:* The act of measuring changes the phenomenon.
      *   *Satisficing:* Respondents choosing easy answers (like a label) rather than accurate ones.

  *   **Social Psychology:**
      *   *Social Identity Theory:* Self-categorization enhances in-group similarity.
      *   *Stereotype Threat / Lift:* Awareness of a label affects performance/attitudes.
      *   *Essentialism:* The intuitive belief that categories have deep, immutable underlying natures.

  **Literature Candidates:**
  *   Hacking, *The Social Construction of What?* (Looping effects).
  *   Mannheim, *The Problem of Generations* (Foundational, but contested).
  *   Glenn, *Cohort Analysis* (Methodological skepticism).
  *   Strauss & Howe, *Generations* (Popularizers, often source of the "drift" described).
  *   Khalidi, *Natural Kinds and Cognitive Classification* (Cognitive basis of kinds).
  *   Mallon, *The Construction of Human Kinds* (Social construction of categories).

  **Initial Assessment:**
  There is no single established term that captures the *triad* of description drift, boundary repair, and elicitation feedback specifically for cohorts. "Reification" is too broad. "APC Problem" is statistical, not sociological. "Looping Effects" is the closest philosophical cousin but describes a different mechanism (people changing vs. description changing). The phenomenon resembles a "degenerating research programme" (Lakatos) applied to social classification. I will need to coin a composite term or refine an existing one to capture the *asymmetry* (label stays, content moves).

  ---

  # Considered Answer

  ### 1. Diagnosis: Does this configuration have a name?

  There is **no single established term** in philosophy, demography, or survey methodology that captures the specific triad of phenomena you describe (Description Drift, Seam Repair, Elicitation Feedback) as a unified system.

  However, your observation decomposes into three well-documented distinct problems that are rarely analyzed together in this configuration:
  1.  **Construct Drift** (Psychometrics): The meaning of the variable changes while the label remains fixed.
  2.  **Ad Hoc Boundary Work** (Sociology of Science): Modifying the extension of a category to protect the intension (the stereotype) from counterexamples.
  3.  **Measurement Reactivity / Priming** (Survey Method): The measurement instrument induces the response it claims to measure.

  The closest philosophical concept is **Ian Hacking's "Looping Effects,"** but as you correctly noted, your case is structurally distinct. Hacking's looping is *ontological* (the people change to fit the kind). Your phenomenon is *semantic and operational* (the kind's description and boundaries change to fit the narrative, while the people remain demographically static).

  Because this specific configuration lacks a standard name, I propose the term:

  ### **Label-Anchored Predicative Drift (LAPD)**

  **Definition:** A mode of social classification wherein a **nominal label** (e.g., "Millennial") retains stability and explanatory authority, while the **predicates** (traits, attitudes) associated with it drift over time to accommodate new historical conditions, and the **extensional boundaries** (birth years) are opportunistically patched to exclude counterexamples.

  **Why this term works:**
  *   **Label-Anchored:** Captures your hypothesis that the *name* is the stable explanatory variable, not the birth years or the traits.
  *   **Predicative Drift:** Captures Instance (1) — the properties attributed to the kind change without acknowledgement of falsification.
  *   **Implied Mechanism:** The term implies that the stability of the label is *maintained* by the drift, not despite it.

  ### 2. The Carve: Boundaries and Distinctions

  To ensure this term does real work in your dissertation, you must distinguish it from near-neighbors.

  **A. The Case That Looks Like Mine But Is Not: Hacking's Interactive Kinds**
  *   **Surface Similarity:** Both involve a feedback loop between classification and the classified.
  *   **The Distinction:** In Hacking's looping (e.g., "multiple personality disorder"), the *people* change their behavior or self-conception in response to the classification. In **Label-Anchored Predicative Drift**, the demographic population (the birth cohort) does *not* change; rather, the *narrative description* of them shifts.
  *   **Why it matters:** If you call it "looping," reviewers will expect evidence that Millennials actually *became* more anxious because they were called Millennials. Your claim is stronger: they were *described* as anxious because the narrative required it, regardless of their prior characterization.

  **B. The Case That Does Not Look Like Mine But Is: The APC Identification Problem**
  *   **Surface Difference:** The APC (Age-Period-Cohort) problem is a technical statistical issue regarding collinearity in regression models. LAPD is a sociological/narrative phenomenon.
  *   **The Connection:** The APC problem is the *methodological enabler* of LAPD. Because cohort effects cannot be statistically disentangled from period effects without arbitrary constraints (Glenn, 2005), researchers have the freedom to attribute period-driven changes (e.g., post-2008 anxiety) to cohort traits without statistical falsification.
  *   **Why it matters:** You should cite the APC problem not as the phenomenon itself, but as the *condition of possibility* for the drift. It explains why the drift isn't caught by standard statistical controls.

  **C. The Boundary Case: Construct Drift**
  *   **Surface Similarity:** The meaning of a measure changes over time.
  *   **The Distinction:** Construct drift is usually unintentional or acknowledged as a measurement error. LAPD is often *functional*. The drift preserves the utility of the generational label for media, marketing, and political storytelling. It is a feature, not a bug, of the "Generationalism" industry.

  ### 3. Ontological Status: Are Cohorts Real Kinds?

  You asked whether this phenomenon evidence that cohorts are not real kinds. Relying on the **Homeostatic Property Cluster (HPC)** conception of natural kinds (Boyd, 1991; Griffiths, 1999):

  *   **Real Kinds (HPC):** Properties cluster together because of an underlying causal mechanism (e.g., "Gold" has atomic number 79, which causes its density, color, etc.).
  *   **Your Phenomenon:** The traits attributed to the cohort (anxiety, digital nativism) do not cluster due to a shared biological or social *mechanism* intrinsic to the birth years. They cluster because the **Label-Anchored Predicative Drift** mechanism artificially groups them to sustain a narrative.

  **Verdict:** This phenomenon is strong evidence that generational cohorts, as currently used in public and political discourse, are **Conventional Kinds** (or **Nominal Kinds**) masquerading as **Natural Kinds**.

  *   **Compatible with "Social Realness"?** Yes, but only in a weak sense. They are **Institutional Facts** (Searle). They are real in their *consequences* (Instance 3: Elicitation Feedback shows the label changes survey responses), but not real in their *causal origins* (birth year does not cause the trait).
  *   **Conception of Real Kind:** I am relying on a **Causal-Homeostatic** conception. If you prefer a **Pragmatic** conception (Khalidi), you could argue they are "real" insofar as they successfully organize prediction. However, your Instance (1) undermines this: if the predictions drift without notice, the predictive utility is compromised. Thus, they fail even the pragmatic test of a robust kind.

  ### 4. Epistemic Status: Settled, Contested, and Speculative

  As a philosopher of social science, I must flag the evidentiary status of the claims involved in your dissertation.

  **Settled (High Consensus):**
  *   **The APC Identification Problem:** It is mathematically settled that age, period, and cohort are linearly dependent. Identifying a "cohort effect" requires arbitrary constraints (Glenn, 2005; Bell & Jones, 2014). *You can state this as fact.*
  *   **Survey Priming/Reactivity:** It is settled in survey methodology that offering categorical labels influences self-classification and subsequent trait reporting (Tourangeau et al., 2000). *You can state Instance (3) as a known methodological artifact.*

  **Contested (Active Disagreement):**
