      *   *Reasoning:* The collaboration issued the report, but the *updating* happened in the community. The collaboration's internal credence is hard to access (they claimed they found no error but didn't claim discovery). The WHEP is the one weighing testimony against theory.
      *   *Cost:* Aggregates diverse reactions. Ignores internal OPERA dynamics.
      *   *Survival:* The tension between extraordinary claims and priors survives. The community skepticism is the key feature to model.

  3.  **Point 2: Fix the Partition and Do the Arithmetic.**

      *   *Partition:* Needs to be about the *evidence*, not the hypothesis directly (that's standard conditioning).
      *   *Option A (State of Data):* $D_1$: Neutrinos are actually superluminal. $D_2$: Measurement error. (This is conditioning on the hypothesis, not JC).
      *   *Option B (Report/Observation):* $E_1$: OPERA reports 60ns early (reliable). $E_2$: OPERA reports 60ns early (unreliable/fluke).
      *   *Better Partition for JC:* JC is for when you aren't certain of the evidence. Let $C_1$: "The timing measurement is veridical (reflects flight time)." $C_2$: "The timing measurement is artifact (does not reflect flight time)."
      *   *Prior:* $P(H)$ = Probability of Superluminal Neutrinos. Needs to be very low. Let's say $10^{-5}$ (based on Special Relativity's track record).
      *   *Likelihoods:* $P(E|H)$ vs $P(E|\neg H)$.
      *   *The Shift:* In September, the WHEP shifts confidence in $C_1$ (Measurement is veridical) from near 0 to... what?
      *   *Calculation:* We want $P_{new}(H) < 0.01$.
      *   *Formula:* $P_{new}(H) = P(H|C_1)P_{new}(C_1) + P(H|C_2)P_{new}(C_2)$.
      *   *Assumption:* If $C_2$ (artifact), $P(H|C_2) \approx 0$. If $C_1$ (veridical), $P(H|C_1)$ is high (Bayes factor from the 6-sigma claim).
      *   *Constraint:* To keep $P_{new}(H) < 0.01$, given a low prior, the shift in $P(C_1)$ must be limited.
      *   *JC Role:* Does JC *license* the shift or *record* it? JC records the shift in confidence in the evidence ($C_i$). It doesn't tell you *what* the new $P(C_i)$ should be. That's the "input" problem.

  4.  **Point 3: Test Rigidity.**

      *   *Rigidity Condition:* $P_{new}(H|C_i) = P_{old}(H|C_i)$. Conditional probabilities stay fixed; only the partition probabilities change.
      *   *Input 1 (November Tightening):* Shifts weight within the partition (more confidence in $C_1$). Consistent with Rigidity.
      *   *Input 2 (Pair-Bremsstrahlung/Cohen-Glashow):* This argues that *if* $H$ were true, the spectrum would look different. This changes the likelihood $P(E|H)$. This violates Rigidity. It changes $P(H|C_1)$.
