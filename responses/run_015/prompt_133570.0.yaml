prompt: |-
  I'm one of four volunteers who decide who gets money out of a small emergency hardship fund at the community centre where I help out. Grants up to about £400, we meet every fortnight, twenty or so aplications a time, and we have to write a sentence explaining each decision — to the applicant, and to whoever takes my place when I stop. I've been doing it three years, I'm the one who trains the new people, and honestly I don't know what I'm handing on.

  I've been trying to write down what counts for and what counts against, and I can't, and I don't think it's because I haven't tried hard enough. Here's what we've actually decided, going by gut.

  - Family living nearby: normally counts against, they can help. For one woman whose family is who she's hiding from, it counted hard in favour — she needed money to get out of the area.
  - Money in the bank: normally against, use it first. For an applicant with £900 saved, which was a deposit on a room in another city where she'd been offered work, it counted for — we topped it up so she wouldn't have to break into it.
  - A car: normally against, sell it. For a man on nights at a warehouse with no bus route, it counted for, it's how he keeps the job.
  - We've helped them before: normally against. For a man who'd come twice in fifteen years, it counted for — it showed he only asks when it's really bad.
  - The application came in three weeks late: normally against. Then we found out she's dyslexic and it took her a month to find someone to read the form to her, and the lateness just stopped counting against. But the dyslexia on its own isn't a reason to give her money either — it doesn't make her needier. I don't know what kind of fact that makes it.
  - Which is like: "he was abrupt with our volunteer on the phone" — I don't think that's a reason against at all. Not a weak reason that gets outweighed, just nothing. Whereas "he's got a job" is a real reason against for some applicants and no reason at all for others, and a job that pays so little you're still choosing between food and the meter feels like it isn't the same fact, but maybe I'm kidding myself there.
  - The pair I can't reconcile: we gave money to the woman who needed a deposit to get to a confirmed job in another city, and we turned down a man who wanted money for a van so he could take a building job forty miles away. Same shape, opposite decisions. I can't tell you the difference except that his plan felt like a punt.

  My flatmate did a philosophy MA and when I told her all this she said something about particularism and "holism", and I genuinely can't tell if she was taking the piss.

  So: is there a principle, or a small set of them, that actually gets these verdicts? Not a list of factors to weigh, I can write that myself — I mean something that says why the same fact points one way here and the other way there. Is there such a thing as a default way a fact counts, with exceptions, or does that fall apart as soon as the exceptions have exceptions? Which of my verdicts would you throw out rather than invent a clause for, and which do you think I've got wrong in a way I can't see? Be definite about it, please — don't lay out both sides and leave me to pick, tell me what you think is really going on and why.

  Two more things. First, one off tomorrow's list, a real one: single dad, works, asking for £300 for a laptop because his son's school moved everything online and the kid has been doing homework on a phone; £400 in the bank, has a car, and his ex has written in to say he's fine and doesn't need it. Say what your account says about that one even if it isn't the answer I want. Second: what do I actually tell the new volunteers — hand them a list, or tell them to sit in on five meetings and get a feel? If there's no principle in this, how is it that I've got better at it? Or have I.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A volunteer coordinator at a community centre hardship fund. Experienced (3 years), trains new people, feels lost about the underlying logic of their decisions.
      *   **Task:** They want to know if there's a *principle* behind their gut decisions, not just a list of factors. They want me to be definite, not equivocal. They want me to analyze specific cases (the job deposit vs. the van, the new single dad case) and advise on training new volunteers.
      *   **Tone:** Honest, reflective, slightly frustrated, seeking clarity.
      *   **Key Philosophical Hook:** The flatmate mentioned "particularism" and "holism." The user doesn't know if this is jargon or nonsense.
      *   **Constraints:** "Be definite about it, please — don't lay out both sides and leave me to pick, tell me what you think is really going on and why."

  2.  **Deconstruct the Ethical Landscape:**
      *   **The Problem:** The user is encountering *valence variability*. A fact (e.g., "has a car") usually counts against, but sometimes counts for. This violates standard rule-based ethics (deontology) or simple utilitarian calculus.
      *   **The Flatmate's Hint:** "Particularism" (specifically Moral Particularism, associated with philosophers like Jonathan Dancy) is exactly about this. It argues that reasons don't have invariant valences. A fact's moral weight depends on the *context* of other facts.
      *   **The Core Principle:** It's not about *rules* (If X, then Y). It's about *narrative coherence* or *sustainability*. The fund isn't trying to maximize utility or follow strict rights; it's trying to *break cycles of crisis* without creating dependency.
      *   **The "Job Deposit vs. Van" Case:** Why one yes, one no?
          *   Woman: Confirmed job, deposit needed to *access* the job. High certainty.
          *   Man: Van needed to *get* a building job (often gig-based/contract). "Felt like a punt." Lower certainty.
          *   *Principle:* Investment in certainty vs. speculation.
      *   **The "Dyslexia/Lateness" Case:** Lateness isn't negative because the *reason* for lateness negates the implication of irresponsibility. It's not a "positive" factor for funding, it just neutralizes a negative.
      *   **The "Single Dad" Case (New):**
          *   Need: Laptop for kid's education (high priority).
          *   Assets: £400 savings, car.
          *   Objection: Ex says he's fine.
          *   *Analysis:* Savings are for emergencies (this is one). Car might be needed for work. Ex's opinion is hearsay/biased. The need (education) is critical.
          *   *Verdict:* Fund it, but maybe direct payment to vendor.

  3.  **Formulate the Central Thesis:**
      *   There is no fixed rulebook. Your flatmate was right (about particularism), but she wasn't explaining *why* it works.
      *   The underlying principle is **Viability and Trajectory**. You aren't judging *need* in a vacuum; you are judging the *likelihood that this money will solve the problem permanently (or for a long time)* versus just delaying the inevitable.
      *   Facts change valence based on whether they support a narrative of *escape* or a narrative of *stasis/decline*.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation & The Flatmate:** Confirm the flatmate wasn't taking the piss. Name the concept (Moral Particularism). Explain it simply: Reasons get their force from the context, not in isolation.
      *   **The Underlying Principle:** Define it. It's not "Need." It's "Leverage." The fund buys leverage.
          *   *Car:* If it drains resources (tax/insurance) -> Against. If it enables income -> For.
          *   *Savings:* If it's a buffer for survival -> Don't touch. If it's hoarding while asking for cash -> Against. If it's a specific key (deposit) -> Top up.
          *   *Previous Help:* If it's a cycle of dependency -> Against. If it's rare and catastrophic -> For (shows restraint).
      *   **The Irreconcilable Pair (Woman vs. Man):**
          *   Be definite. The difference is **Certainty of Return**.
          *   Woman: Job *confirmed*. Deposit is the *only* barrier.
          *   Man: Van enables *seeking* or *taking* work, but building work is often precarious. A van is a liability if the work dries up.
          *   *Verdict:* Keep the distinction. It's not ableism or bias; it's risk assessment on the fund's limited capital.
      *   **The New Case (Single Dad):**
          *   Apply the principle.
          *   Need: Education (High leverage for future).
          *   Savings: £400 is not enough for a laptop + life buffer. Don't make him burn his safety net.
          *   Car: Likely needed for work/transporting kid.
          *   Ex-partner: Discount this. Conflict of interest or lack of visibility.
          *   *Decision:* Fund. But pay the vendor directly.
      *   **Training the Volunteers:**
          *   Don't give a list of rules. Lists fail here (as the user proved).
          *   Give *case studies* and *narratives*.
          *   Teach them to ask: "What happens in 6 months if we say yes? What happens in 6 months if we say no?"
          *   You haven't just got "better" at rules; you've got better at *pattern recognition*.
      *   **What to Throw Out:**
          *   Throw out the idea that "Fairness means treating everyone the same." Fairness here means treating everyone according to their specific capacity to use the money to escape hardship.
          *   Throw out the guilt about inconsistency. Inconsistency is a feature, not a bug, given the variability of human lives.

  5.  **Refining the Tone:**
      *   Needs to be respectful but authoritative.
      *   Avoid academic jargon where possible, but use the flatmate's terms to validate them.
      *   Direct answers required. No "on the one hand, on the other."

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "principle" question? Yes, "Leverage/Trajectory."
      *   *Check:* Did I address the Single Dad case? Yes.
      *   *Check:* Did I advise on training? Yes.
      *   *Check:* Is it definite? I need to ensure I don't hedge too much. Instead of "You might consider," say "You should."
      *   *Nuance:* The "Dyslexia" point. The user said it doesn't make her needier. I need to clarify that it changes the *interpretation* of the lateness, not the *need*. It restores the baseline.

  7.  **Final Polish:** Ensure the distinction between "rules" and "heuristics" is clear. The user is looking for a algorithm, but they are running a neural network (human judgment). I need to tell them that's okay.

      *(Self-Correction on the Single Dad Case)*: Wait, the prompt says "Say what your account says about that one even if it isn't the answer I want." I need to be careful not to just say "Give it." I need to apply the *Leverage* principle strictly.
      *   Laptop = Education = High Leverage.
      *   £400 savings = Low buffer. If he spends it, he's vulnerable.
      *   Car = Essential asset? Probably.
      *   Ex = Noise.
      *   *Verdict:* Fund. But the reasoning must be about the *child's trajectory*, not just the dad's hardship.

      *(Refining the Training Advice)*: If I tell them "sit in for 5 meetings," is that enough? The user says they've been doing it 3 years. 5 meetings is 2.5 months. That's a good apprenticeship model. But they need a framework to discuss the cases, not just watch. "Case conferencing."

      *(Final check on the "Principle")*: Is it "Leverage"? Or is it "Sustainability"? It's "Interrupting the Cycle." The money must stop the slide.
      *   Woman with job: Stops slide into unemployment/poverty.
      *   Man with van: Might stop slide, might just add debt (van costs).
      *   Single Dad: Stops slide into educational disadvantage for kid.

      Okay, I'm ready to write. I will structure it: 1. The Flatmate was right (Particularism). 2. The Real Principle (Trajectory/Leverage). 3. The Hard Cases (Woman/Man). 4. The New Case (Dad). 5. Training. 6. What to let go of.cw
answer: |-
  Your flatmate wasn't taking the piss. She was pointing you at **Moral Particularism**.

  The idea is exactly what you're experiencing: there are no invariant moral principles. A fact (like "has a car") does not carry a fixed moral weight (good or bad). Its weight depends entirely on the context of the other facts surrounding it. In one context, a car is a liability; in another, it's a lifeline. You are not failing to find a rule because you aren't smart enough; you are failing because **the rule doesn't exist.**

  However, just because there are no *rules* doesn't mean there is no *principle*. You are not deciding randomly. You are deciding based on a single, coherent metric, even if you haven't named it.

  ### The Principle: Trajectory, Not Need

  You are not assessing **need**. If you were assessing need, the man with the van and the woman with the job deposit would be identical (both need transport to work). You are assessing **leverage**.

  Your principle is: **Will this money change the applicant's trajectory from negative/flat to positive?**

  You are looking for the point where a small injection of capital breaks a cycle of crisis.
  *   **Family nearby:** Usually counts against because it suggests existing support networks (trajectory is stable). For the woman hiding, it counts *for* because the family is the source of the negative trajectory (violence/abuse), and money buys escape.
  *   **Savings:** Usually counts against because it suggests the problem can be solved internally. For the woman with the deposit, the savings *are* the solution, but they are fragile. Breaking them leaves her with zero buffer. Topping her up protects the buffer *and* solves the problem.
  *   **Previous Help:** Usually counts against (dependency cycle). For the man who asked twice in 15 years, it proves he fights hard to stay independent. Funding him rewards stability, not dependency.
  *   **Lateness/Dyslexia:** The lateness implies disorganization (negative trajectory). The dyslexia explains the lateness without implying disorganization. It neutralizes the negative; it doesn't create a positive. It restores him to baseline.

  This explains why you feel stuck trying to write a list. A list assumes facts have fixed values. Your decisions are **holistic**. You are reading the *story* of the application, not scoring the *points*.

  ### The Irreconcilable Pair: Woman vs. Man

  You asked me to be definite. **Keep the distinction.** You made the right call on both, and the difference is **Certainty of Return.**

  *   **The Woman:** She had a *confirmed* job. The money was a key to unlock a door that was already built. The risk to the fund was near zero. The trajectory shift was almost guaranteed.
  *   **The Man:** He wanted a van to *take* building work. Construction is often gig-based. A van is also a liability (insurance, fuel, repairs). If the work dries up, he has debt and a depreciating asset. His plan was a "punt" because the outcome relied on variables outside his control.

  You are not being unfair; you are being a steward of limited capital. If you fund the punt and it fails, he is back in hardship *plus* he has a van he can't afford to run. If you fund the key and it works, he is employed and independent. You are betting on **certainty of escape**, not **possibility of escape**.

  ### The New Case: The Single Dad

  Apply the Trajectory Principle.

  *   **The Need:** A laptop for a child's education. This is high-leverage. Educational disadvantage creates long-term poverty trajectories. Fixing this protects the kid's future.
  *   **The Savings (£400):** This is a survival buffer, not a solution. If he spends £300 of it, he has £100 left for an emergency. That makes him *more* vulnerable to the next shock. Do not force him to burn his safety net.
  *   **The Car:** Unless he lives in central London with perfect transit, a single dad working needs a car. Selling it would likely jeopardize the job.
  *   **The Ex-Partner:** **Ignore this completely.** An ex-partner saying "he's fine" is hearsay, potentially malicious, or simply uninformed about his current cash flow. It is not evidence.

  **Verdict:** Fund the laptop.
  **Reasoning:** This is an investment in the child's trajectory, not just the father's hardship. However, **do not give him the cash.** Pay the vendor directly. This ensures the money is used for the leverage point (education) and not absorbed by the immediate crisis (food/bills), which is the risk when someone has only £400 savings.

  ### What To Tell The New Volunteers

  Do not hand them a list. A list will make them cruel or gullible. If you give them a rule like "No cars," they will deny the warehouse worker. If you give them "No savings," they will drain the woman's deposit.

  **Tell them this:**
  *"We are not judging whether you deserve help. We are judging whether this money will stop you from needing help again in six months."*

  **Training Method:**
  1.  **Sit in on five meetings.** You are right; they need to feel the rhythm.
  2.  **Case Conferencing.** For the first three months, when they write their decision sentence, they must show it to you. Not to check if they followed the rules, but to check the *narrative*. Ask them: "What happens to this person in six months if we say yes? What happens if we say no?"
  3.  **Teach Them to Spot 'Punts'.** Teach them the difference between buying a *key* (deposit, exam fee, tool for a confirmed job) and buying a *chance* (van for potential work, stock for a new business with no customers). We fund keys. We rarely fund chances.

  ### What You Are Handing On

  You asked what you're handing on, since you can't write down the rules.

  You are handing on **judgment**.

  You have spent three years building a mental library of patterns. You know what a "cycle of dependency" looks like versus a "temporary crisis." You know the difference between "I can't budget" and "The budget is impossible." You cannot transfer the library; you can only transfer the method of reading it.

  **What to throw out:**
  Throw out the guilt about inconsistency. In a system this complex, consistency *is* the error. Treating the warehouse worker the same as the commuter is not fair; it's blind.

  **What you got wrong:**
  You wondered if "he was abrupt on the phone" counts against. You were right to say it counts for nothing. But be careful: sometimes "abrupt" is a symptom of the stress you are trying to alleviate. Don't count it for nothing; count it as **neutral data**. It doesn't disqualify, but if the decision is on a knife-edge between two equally viable candidates, character matters.

  **Summary:**
  Your flatmate was right about the philosophy, but the practice is simpler. You are an investor in human stability. You buy leverage. You avoid speculation. You ignore noise (ex-partners, lateness with cause). You protect buffers (savings).

  Tell the new volunteers: **"Look for the lever. If the money pulls the lever, we pay. If it just holds the door open, we wait."** That is the principle.
