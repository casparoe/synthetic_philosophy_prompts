  # JOINT STATEMENT ON THE INTERPRETATION OF PASCALIAN JUSTICE AND FORCE

  **Issued by the Adversarial Collaboration on Pascal's Political Theology**
  **Date:** 24 October 2023

  ## I. AGREED CLAIMS

  The undersigned representatives of the Pragmatic Institutionalist and Eschatological Separatist camps hereby affirm the following propositions as the common foundation of our inquiry. These claims constitute the hermeneutical baseline upon which our divergent readings are constructed.

  1.  **Anthropological Framework:** We agree that Pascal's political thought is inextricable from his Jansenist anthropology. Both camps affirm that Pascal posits a radical distinction between the three orders: the order of bodies (power and force), the order of minds (reason and science), and the order of charity (grace and holiness). We further agree that, for Pascal, the human condition is defined by the Fall, resulting in a state of concupiscence wherein self-love (*amour-propre*) habitually distorts the perception of truth and right.
  2.  **Textual Thrust:** We concur that the fragments in the *Pensées* dealing with justice, custom, and force consistently articulate a tension between 'justice' (that which is right in itself) and 'force' (that which compels obedience). We acknowledge Pascal's famous assertion that justice without force is powerless, and that force without justice is tyrannical, leading to the observation that in the present age, these two qualities are rarely united.
  3.  **Historical and Literary Context:** We recognise that these writings are unfinished, aphoristic, and fragmentary, composed within the context of a Christian apologetic intended to persuade sceptics and libertines of the necessity of revelation. Consequently, we agree that political remarks found therein are often subordinate to theological and soteriological ends, serving to demonstrate human wretchedness and the need for redemption rather than to provide a systematic treatise on governance.
  4.  **Human Psychology and Custom:** We share the recognition that Pascal regards human beings as simultaneously capable of reasoning abstractly about justice and habitually inclined to confuse customary power with genuine right. We agree that Pascal identifies 'custom' and 'imagination' as the primary mechanisms by which societies stabilise authority, often bypassing reason to secure obedience.

  ## II. TABLE OF DISAGREEMENTS

  While the above claims represent our shared ground, the following table delineates the precise points of divergence. The formulations below are drafted such that each camp accepts its respective column as an accurate expression of its position.

  | Point of Divergence | Pragmatic Institutionalist Formulation | Eschatological Separatist Formulation |
  | :--- | :--- | :--- |
  | **Crux 1: The Normative Status of Force** | Pascal's observation that justice without force is powerless amounts to a prescriptive endorsement of state coercion as a provisional good. In the fallen order, institutions of law and punishment are tragically necessary to restrain concupiscence and preserve minimal peace; thus, the alliance of justice and force is a normative requirement for temporal stability. | Pascal's observation that justice without force is powerless is a purely descriptive indictment of fallen societies that offers no normative sanction for institutional violence. Any alliance between justice and coercive power is itself a corruption of justice by the order of concupiscence; authentic Christian justice must renounce coercive authority. |
  | **Crux 2: The Possibility of a *Tertium Quid*** | Pascal's doctrine of concupiscence rules out any stable non-coercive order prior to eschatological transformation. There is no viable mode of social coordination that is neither coercive force nor passive injustice; attempts to establish such an order ignore the radical depth of human corruption and the necessity of external restraint. | Pascal's anthropology permits a *tertium quid*: a mode of social coordination sustained by shared epistemic humility, voluntary ascetic discipline, or mutual recognition of human fragility. A stable non-coercive order is possible as an anticipation of the order of charity, governed by love rather than force. |

  ## III. CASE STUDIES AND PREDICTIONS

  For each crux identified above, we have selected a concrete case or textual locus upon which both camps agree is relevant. We record here our shared understanding of the evidence and our divergent predictions regarding what that evidence demonstrates.

  ### Case Study A: The Hypothetical Non-Coercive Community
  **Relevant to Crux 2 (The Possibility of a *Tertium Quid*)**

  *   **Agreed Description:** We consider a hypothetical community that maintains widespread internal order without any monopoly on violence, relying solely on practices of mutual vulnerability, non-coercive persuasion, and social ostracism rather than physical punishment.
  *   **Pragmatic Institutionalist Prediction:** This example counts as a hidden form of psychological force. We predict that such a community is either inherently unstable over generations or relies upon subtle mechanisms of coercion (shame, exclusion) that function analogously to physical force. Therefore, it does not constitute a genuine counter-example to Pascal's claim that force is necessary for order in a fallen world.
  *   **Eschatological Separatist Prediction:** This example validates the possibility of charity-based order. We predict that such a community demonstrates that force is not essential to justice, but is rather a symptom of faithlessness. It serves as a proleptic sign of the Kingdom of God, proving that a *tertium quid* is attainable through grace-mediated social relations.

  ### Case Study B: The Discussion of Custom and Imagination
  **Relevant to Crux 1 (The Normative Status of Force)**

  *   **Agreed Description:** We examine the fragments on justice and force alongside the discussion of custom and imagination in the *Pensées*, specifically where Pascal details how imagination persuades men to respect laws they do not understand and how custom creates authority.
  *   **Pragmatic Institutionalist Prediction:** The textual evidence supports a normative reading. We contend that Pascal's detailed explanation of how custom and imagination stabilise society implies a mandate to utilise these mechanisms. Since reason alone cannot restrain concupiscence, the text supports the harnessing of imagination and force to uphold the structures of justice.
  *   **Eschatological Separatist Prediction:** The textual evidence supports a merely diagnostic reading. We contend that Pascal's exposition of custom and imagination is intended to reveal their deceitful nature. The text exposes the illegitimacy of authority based on imagination, urging the reader to reject such foundations rather than to manage them for political ends.

  ## IV. CONCLUSION: VERBAL AND SUBSTANTIVE DISAGREEMENTS

  In concluding this statement, we distinguish between verbal ambiguities and substantive theological divisions to clarify the path forward for our collaboration.

  **1. Verbal Disagreements**
  A portion of our dispute concerns the definition of terms. Specifically, we acknowledge a divergence on whether 'force' denotes strictly physical coercion and institutional violence, or whether it encompasses institutional habit, psychological manipulation, and the pressure of imagination. The Pragmatic Institutionalists tend to define force broadly to include the psychological pressures required for social cohesion. The Eschatological Separatists tend to define force narrowly as physical coercion or the threat thereof, distinguishing it from voluntary persuasion.

  **2. Substantive Disagreements**
  Notwithstanding the verbal distinctions, a substantive disagreement remains regarding the normative status of coercion in a fallen world. Even if we were to adopt a shared definition of 'force', the camps would still divide on the cruxes. The Pragmatic Institutionalists maintain that the use of coercive power is a moral duty for the preservation of peace, despite its tragic nature. The Eschatological Separatists maintain that the use of coercive power is a moral failure, incompatible with the imitation of Christ, regardless of the consequences for temporal peace.

  **3. Resolution Prospects**
  We agree that resolving the verbal disagreements would not dissolve the substantive dispute. Clarifying the definition of 'force' would sharpen our disagreement but not eliminate it. The division is ultimately theological: it concerns the extent to which the Christian is permitted to participate in the 'order of bodies' to secure temporal goods. Therefore, future inquiry must focus not merely on lexical precision, but on the theological implications of Pascal's distinction between the orders and the ethical obligations of the believer within the *saeculum*.

  ***

  **Signed,**

  *The Pragmatic Institutionalist Working Group*

  *The Eschatological Separatist Working Group*
