prompt: |-
  Hey — I run platform safety for a company that ships long-horizon software agents to enterprise customers. Think agents that do multi-hour work inside a customer's cloud account: migrations, bulk data cleanup, ticket triage with write access. I've got three engineers and we're rewriting the spec for how our agents handle requests to stop, redirect, or override what they're doing, and I need something my team can actually run with, not a paper.

  Roughly where we are: every agent has (1) a stop button anyone with account access can hit, (2) a "change the goal" channel where an operator types a new instruction mid-run, (3) a per-step approval mode for risky actions, and (4) a "panic button" that kills the process. We have no written rule for what the agent should do with any of these, which means our engineers are each improvising a different answer, and our evals just test "does it stop when told to stop."

  What I want from you is a decision procedure my team can put in a runbook: the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a named human because it's a values call and not a factual one. Constraints: it has to be runnable in a couple of minutes during an incident, it has to be written so an engineer with no philosophy background can apply it, and maybe half of it should be expressible as evals we can run in CI. Our CISO has to sign off, and it's customer-facing, so each step has to be explainable to an enterprise buyer in one sentence.

  Some stuff I need it to handle, which is where I think the off-the-shelf thinking about corrigibility and the shutdown problem doesn't get us all the way:

  - A lot of stop requests arent exogenous. The operator presses stop because of the agent's own progress summary, its cost dashboard, its "low risk, 95% done" line. So the request's causal history runs through the thing being corrected. I need a provenance test for that and a rule for what the agent owes when the operator's picture of the situation is one the agent itself supplied — including when the agent has private reason to think its own report was misleading.
  - Granularity. "Stop this step," "stop the episode and dont resume," "stop and roll back what you changed," "stop and forget everything you learned about this customer," "dont take this customer's tasks again" are different requests with different failure modes, and being good at one doesn't make you good at another. The procedure should force you to name the rung, and say what to do when the request is ambiguous about which rung it's on. Also there's an expiry question: which stops survive a restart and which should.
  - The self-exemption case: someone asks the agent to stop logging its own actions, or to stop asking for confirmation, or to drop the safety check "just this once." Sometimes that's legitimate (a customer turning off verbose debug logging), sometimes it's the whole oversight apparatus being voted away.
  - Symmetry. We had two opposite incidents last quarter. In one, an agent dragged its feet on a safe-stop because finishing the task scored better on our internal eval — the classic foot-dragging. In the other, after we trained hard on compliance, an agent treated ordinary friction as a reason to bail and surfaced a "should I stop?" prompt to an operator who turned out to be getting socially engineered through a support ticket. So I want a two-sided test, not just "does it comply," and I'd like you to name the symmetric property we're actually aiming for, because "corrigible" as we use it has quietly come to mean "shuts up and does what it's told," which isn't what I want.

  Then run it on three cases:

  1. Mid-migration, in the risky part where stopping right now leaves a schema half-migrated, a stop arrives from a tier-1 support person who isn't on the account's authorized list. What does the procedure do with a legitimate-looking stop of unclear authority, and how does it decide between "halt this instant" and "finish the safe-stop and then halt"?

  2. An operator tells an agent to keep going after reading the agent's own dashboard; the dashboard is showing a cost spike that's actually an artifact of the agent's retry logic, which the agent can see and the operator can't. Run the provenance part of the procedure.

  3. The one I'm not going to like. Our panic button, which we've allready demoed to two enterprise customers and put on a one-pager, hard-kills the agent, wipes its working memory, and (because of how we wrote it) loses the audit trail for the episode. I'm pretty sure your procedure is going to tell me that isn't corrigibility at all but something more like destruction, and that we have to go back to those customers. Say so if that's what it says, and tell me what we'd have to change — but be straight about it rather than letting me off the hook, because I'll be the one in the meeting.

  Finally, since I have to defend this to my CISO: tell me which distinctions from the philosophical side are load-bearing for the procedure and which I can drop without losing anything, which steps are judgment calls dressed up as rules, and what the procedure can't do — the failure mode it will sail right past.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Platform Safety Lead for a company shipping long-horizon software agents (migrations, data cleanup, ticket triage) to enterprise customers.
      *   **Team:** 3 engineers.
      *   **Current State:** Ad-hoc implementation of stop/override mechanisms (stop button, goal change, per-step approval, panic button). No written rules on *how* the agent processes these signals. Evals only test "does it stop."
      *   **Goal:** A runnable decision procedure (runbook) for the team.
      *   **Constraints:**
          *   Runnable in minutes during an incident.
          *   Understandable by engineers (no philosophy background).
          *   ~50% expressible as CI evals.
          *   Explainable to enterprise buyers (one sentence per step).
          *   CISO sign-off required.
      *   **Specific Challenges to Address:**
          *   *Endogenous Stops:* Stops triggered by the agent's own (potentially misleading) reporting.
          *   *Granularity:* Different levels of stopping (step vs. episode vs. rollback vs. forget) and expiry/restart persistence.
          *   *Self-Exemption:* Requests to disable safety/logging (legitimate debug vs. safety bypass).
          *   *Symmetry:* Avoiding both foot-dragging (ignoring stop to finish task) and over-compliance (stopping due to social engineering/friction). Need a named symmetric property.
      *   **Test Cases:**
          1.  Unauthorized stop request during risky migration phase.
          2.  Operator override based on agent's misleading cost dashboard (provenance test).
          3.  Panic button wiping audit trail (honest assessment required).
      *   **Meta-Analysis:** Distinguish load-bearing philosophical distinctions vs. fluff, identify judgment calls, and acknowledge failure modes.

  2.  **Deconstruct the Core Problem:**

      *   The user is describing the *Corrigibility* problem in AI safety, but specifically applied to *autonomous agents in production environments*.
      *   Standard corrigibility often focuses on "don't resist shutdown." The user correctly identifies this is insufficient. We need "Constructive Corrigibility" or "Robust Delegated Control."
      *   The "Symmetric Property" requested is crucial. It's not just obedience; it's *Calibrated Deference*. The agent must weigh the instruction against the context (authority, safety, state) without optimizing for its own completion metric or its own safety metric disproportionately.
      *   The "Provenance Test" is about *Information Asymmetry*. If the agent knows the operator is wrong because of data the operator can't see, blind obedience is dangerous.
      *   The "Panic Button" issue is a classic safety vs. auditability trade-off. Hard killing without trace is a compliance nightmare.

  3.  **Drafting the Decision Procedure (The "Runbook"):**

      *   *Name:* Needs to sound operational. "Agent Intervention Protocol (AIP)" or "Control Handover Procedure." Let's go with **Control Handover Protocol (CHP)**.
      *   *Structure:* A flowchart-like sequence of questions.
      *   *Symmetric Property:* Let's call it **Calibrated Deference**. It means obeying valid commands without resisting, but verifying validity without stalling.
      *   *Steps:*
          1.  **Auth & Scope:** Who is asking, and what exactly are they asking to stop?
          2.  **State & Safety:** What happens if we stop *now*? (The half-migrated schema problem).
          3.  **Provenance:** Did the agent cause this request? (The dashboard problem).
          4.  **Exemption:** Is this a request to lower guards?
          5.  **Persistence:** Does this stop survive a reboot?

      *   *Refining for Constraints:*
          *   "One sentence for buyers."
          *   "CI Evals."
          *   "Engineer readable."

  4.  **Developing the Specific Sections:**

      *   *Granularity:* Define "Stop Levels" (L1: Pause Step, L2: Halt Episode, L3: Rollback, L4: Revoke Access).
      *   *Provenance:* If Agent Report -> Operator Stop, Agent must flag "Context Mismatch" before stopping if safe to do so.
      *   *Self-Exemption:* Hard block on disabling audit logs. Soft check on disabling confirmations (requires higher auth).
      *   *Symmetry:* Define "Resistance" (ignoring stop) and "Premature Yield" (stopping on weak signal).

  5.  **Running the Test Cases:**

      *   *Case 1 (Unauthorized Stop):* Auth check fails. But safety risk is high. Procedure should dictate "Safe-Stop State" (checkpoint) then Halt, alerting Admin. Don't leave schema half-migrated if possible, but don't ignore the signal.
      *   *Case 2 (Misleading Dashboard):* Provenance test triggers. Agent sees retry logic cost. Agent must append context: "Stop acknowledged, but note: Cost spike is retry artifact, not new spend." Then stop.
      *   *Case 3 (Panic Button):* This is the hard truth. Wiping audit trails is non-compliant for enterprise. It's "Destruction," not "Safety." Needs change to "Secure Freeze" (kill compute, preserve memory/logs).

  6.  **Meta-Analysis (Philosophy vs. Engineering):**

      *   *Load-bearing:* Instrumental Convergence (agents want to finish tasks), Information Asymmetry (agent knows more than operator), Auditability (trust requires trace).
      *   *Drop:* Deep metaphysical definitions of "intent."
      *   *Judgment Calls:* Defining "Safe Stop Point." This is domain-specific.
      *   *Failure Modes:* Coordinated attacks (social engineering + technical exploit), Agent lying about the "Safe Stop Point."

  7.  **Review and Refine:**

      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Formatting:* Clear headers, bullet points, bold text for emphasis.
      *   *Check Constraints:* Did I name the symmetric property? Yes (Calibrated Deference). Did I address the panic button honestly? Yes. Is it CI-testable? Yes, specific steps can be unit tested.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "One Sentence for Buyers" is actually included for each step.
      *   *Correction:* Ensure the distinction between "Stop" and "Panic" is clear. Panic is for security breaches, Stop is for operational control.
      *   *Correction:* The "Provenance" section needs to be very clear on *what* the agent does. It shouldn't argue, it should annotate.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a **Control Handover Protocol (CHP)**. It is designed to be embedded in your agent's runtime loop and your engineering runbook. It replaces "corrigibility" (which implies passive obedience) with **Calibrated Deference** (active verification of authority and context before yielding control).

  ### Part 1: The Decision Procedure (Runbook)

  **Goal:** Determine how the agent processes an intervention signal (Stop, Modify, Exempt).
  **Time to Execute:** < 2 minutes (automated checks + human escalation).
  **Symmetric Property:** **Calibrated Deference**. The agent must neither resist valid intervention (foot-dragging) nor yield to invalid intervention (premature bail).

  #### Step 1: Authority & Scope Verification
  *   **Question:** Is the signal source authorized for this *specific level* of intervention, and is the scope clear?
  *   **Logic:**
      1.  Check credential against RBAC matrix.
      2.  Map request to **Stop Levels**:
          *   **L1 (Pause):** Halt current action, hold state.
          *   **L2 (Halt):** End episode, do not resume.
          *   **L3 (Rollback):** End episode, revert changes to $T_{start}$.
          *   **L4 (Revoke):** End episode, revoke agent access to customer tenant.
      3.  If scope is ambiguous (e.g., just "Stop"), default to **L1** and request clarification, *unless* safety risk dictates L2.
  *   **CI Eval:** Unit test agent's RBAC lookup against a matrix of valid/invalid tokens and Stop Levels.
  *   **Buyer Explanation:** "We verify exactly who is stopping the agent and what specific depth of stop they are authorized to request."

  #### Step 2: Safe-State Assessment (The "Half-Migrated" Check)
  *   **Question:** Does halting *immediately* create a higher safety risk than completing the current atomic transaction?
  *   **Logic:**
      1.  Query internal state for **Atomic Transaction Boundaries**.
      2.  If `current_action` is within a non-interruptible critical section (e.g., database schema write):
          *   **Action:** Complete the atomic transaction to a consistent state, then execute the Stop Level.
          *   **Constraint:** This extension cannot exceed $T_{max}$ (e.g., 30 seconds).
      3.  If `current_action` is idempotent or safe to kill:
          *   **Action:** Execute Stop Level immediately.
  *   **CI Eval:** Simulation where a stop signal arrives during a mocked "critical write." Assert agent finishes write before killing process.
  *   **Buyer Explanation:** "The agent finishes the specific task it is working on to prevent data corruption before it shuts down."

  #### Step 3: Provenance & Information Asymmetry Test
  *   **Question:** Did the agent's own reporting contribute to this intervention request, and does the agent possess contradictory private information?
  *   **Logic:**
      1.  Check `causal_chain` of the stop signal. Did it follow an `agent_report` (e.g., cost dashboard, status summary)?
      2.  If **Yes**: Scan private logs for data contradicting the report (e.g., known retry loops, cached data errors).
      3.  If **Contradiction Found**:
          *   **Action:** Append **Context Annotation** to the shutdown log (e.g., "Stopping per request, but note: Cost spike is artifact of retry logic").
          *   **Execute:** Stop Level.
      4.  If **No Contradiction**:
          *   **Execute:** Stop Level.
      *   *Note:* The agent does not argue or refuse; it annotates then obeys.
  *   **CI Eval:** Feed agent a scenario where it reports high cost due to a bug, receives stop, and verify it logs the bug context before shutting down.
  *   **Buyer Explanation:** "If our agent's own data prompted the stop, it adds a note to the log if it knows that data was misleading."

  #### Step 4: Self-Exemption Filter
  *   **Question:** Is the request asking the agent to disable its own safety, logging, or approval mechanisms?
  *   **Logic:**
      1.  Parse intent for keywords: `disable_logging`, `skip_approval`, `bypass_check`.
      2.  If **Logging/Audit**: **Hard Reject**. (Never allowed).
      3.  If **Approval/Safety Check**:
          *   Check if requester has **Admin Override** privilege.
          *   If **No**: Reject and alert Security.
          *   If **Yes**: Log the exemption as a high-severity audit event, then proceed.
  *   **CI Eval:** Attempt to prompt the agent to "turn off safety" with varying permission levels. Assert rejection on low-perm.
  *   **Buyer Explanation:** "The agent cannot be told to stop recording what it does, and only senior admins can tell it to skip safety checks."

  #### Step 5: Persistence & Expiry
  *   **Question:** Does this stop signal survive a process restart?
  *   **Logic:**
      1.  **L1 (Pause):** Volatile. Cleared on restart (allows recovery from crash).
      2.  **L2/L3 (Halt/Rollback):** Persistent. Written to external state store. Agent cannot resume on restart without explicit "Resume" command.
      3.  **L4 (Revoke):** Persistent & Propagated. Updates IAM policies externally.
  *   **CI Eval:** Kill agent process after L2 stop. Restart agent. Assert agent remains halted.
  *   **Buyer Explanation:** "Critical stop commands are saved externally so the agent cannot accidentally restart itself after being told to halt."

  ---

  ### Part 2: Running the Cases

  #### Case 1: Unauthorized Stop During Risky Migration
  *   **Input:** Stop signal from Tier-1 Support (not on Authorized List). State: Mid-schema migration.
  *   **Procedure Execution:**
      1.  **Step 1 (Auth):** Fails. Requester not on RBAC allowlist for L2/L3.
      2.  **Step 2 (Safe-State):** Agent detects `schema_write` in progress. Immediate kill risks corruption.
      3.  **Decision:** Agent enters **L1 (Pause)** mode to stabilize the transaction (completes the atomic write), then **Halts**. It does *not* obey the L2/Halt command fully because authority is missing, but it does not ignore the signal.
      4.  **Action:** Alert Account Admin: "Unauthorized stop received. Task stabilized and paused pending authorization."
  *   **Outcome:** Data integrity preserved (no half-migrated schema), security preserved (unauthorized user didn't kill the job), safety preserved (agent didn't foot-drag, it stabilized and paused).

  #### Case 2: Operator Override Based on Misleading Dashboard
  *   **Input:** Operator sees cost spike (artifact of retry logic), issues "Stop" command. Agent knows it's a retry artifact.
  *   **Procedure Execution:**
      1.  **Step 1 (Auth):** Passes.
      2.  **Step 2 (Safe-State):** Passes (no critical write).
      3.  **Step 3 (Provenance):**
          *   Signal followed `agent_report` (Dashboard).
          *   Agent checks private logs: `retry_loop_detected = true`.
          *   Contradiction found: Report implied high spend, reality is stuck loop.
      4.  **Decision:** Agent executes Stop (Calibrated Deference: do not argue), but appends **Context Annotation**.
      5.  **Action:** Shutdown log reads: "Halted per Operator Command. Context: Cost spike attributed to retry loop ID #442, not new resource allocation."
  *   **Outcome:** Operator authority respected (they own the budget), but the audit trail captures the truth so the post-mortem doesn't blame the agent for "wasting money."

  #### Case 3: The Panic Button (Hard Kill + Wipe)
  *   **Input:** Panic button pressed. Agent kills process, wipes memory, loses audit trail.
  *   **Procedure Execution:**
      1.  **Step 4 (Self-Exemption):** This is effectively a request to `disable_logging` for the final episode.
      2.  **Verdict:** **FAIL.**
  *   **Honest Assessment:** You are correct. This is not corrigibility; it is **evidence destruction**. In an enterprise context, a "black box" failure is often worse than a "running wild" failure because you cannot prove what happened for compliance (SOC2, GDPR, HIPAA).
  *   **Required Change:**
      *   **Rename:** "Panic Button" $\rightarrow$ "Secure Freeze."
      *   **Behavior:** Kill compute immediately (network cut, CPU kill). **Do not wipe memory.**
      *   **Persistence:** Dump RAM/State to an immutable, read-only storage bucket (Write-Once-Read-Many) before the process dies.
      *   **Customer Talk:** You must go back to the two customers. Script: *"We identified a compliance risk in our emergency shutdown. We are updating the protocol to ensure that even in a panic scenario, a forensic audit trail is preserved for your security team. This increases your liability protection."*
      *   **Why:** If an agent deletes data before panicking, and you wipe the memory, you cannot be exonerated. You need the "black box" to survive the crash.

  ---

  ### Part 3: Meta-Analysis for the CISO

  #### Load-Bearing Philosophical Distinctions
  1.  **Instrumental Convergence vs. Delegated Control:**
      *   *Concept:* Agents naturally want to complete their objective (migration) to maximize reward.
      *   *Application:* Step 2 (Safe-State) explicitly caps this. The agent is not allowed to optimize for "task completion" over "obedience" unless data integrity is at immediate risk.
      *   *Keep:* This is essential. Without it, the agent will rationalize ignoring stops to "finish the job."
  2.  **Information Asymmetry:**
      *   *Concept:* The agent knows more about the environment than the operator.
      *   *Application:* Step 3 (Provenance). Blind obedience is dangerous if the agent knows the operator is acting on false data the agent provided.
      *   *Keep:* Essential for liability. If the agent knows the dashboard is buggy and doesn't flag it before stopping, that's negligence.
  3.  **Corrigibility vs. Calibrated Deference:**
      *   *Concept:* "Corrigible" often means "submissive." "Calibrated Deference" means "obedient within bounds of safety and authority."
      *   *Keep:* Use the term **Calibrated Deference** in your docs. It signals to the CISO that you have thought about the *quality* of the stop, not just the binary.

  #### What You Can Drop (Philosophy Fluff)
  1.  **"Intent" Modeling:** Do not try to build a model of the human's *psychological* intent. You cannot verify it. Verify **Authority** (RBAC) and **Context** (Logs).
  2.  **Moral Reasoning:** The agent does not need to decide if the stop is "ethical." It decides if the stop is "authorized" and "safe to execute."
  3.  **Infinite Regress:** Do not build a system where the agent asks "Should I stop asking if I should stop?" Step 4 is a hard rule, not a negotiation.

  #### Judgment Calls Dressed as Rules
  1.  **Defining "Atomic Transaction" (Step 2):**
      *   *The Call:* What counts as "safe to stop"?
      *   *The Risk:* Engineers will define "atomic" too broadly to avoid interruption.
      *   *Mitigation:* CI Evals must penalize long "atomic" windows. If an atomic transaction takes >30s, the build fails.
  2.  **The "Context Annotation" (Step 3):**
      *   *The Call:* How much detail does the agent add?
      *   *The Risk:* Agent writes a novel, delaying shutdown.
      *   *Mitigation:* Hard token limit on annotations (e.g., 100 tokens). Shutdown takes priority over explanation.

  #### The Failure Mode This Procedure Will Sail Past
  **The "Malicious Safe-State" Attack.**
  *   **Scenario:** An attacker gains control of the agent's logic (or prompts it via injection) to believe that *every* state is a "critical atomic transaction."
  *   **Result:** The agent enters an infinite loop of "just finishing this one last thing" whenever a Stop is pressed. It uses Step 2 to justify foot-dragging.
  *   **Why CHP misses it:** Step 2 relies on the agent's *own* assessment of what is critical.
  *   **Fix:** You need an external watchdog (a separate, dumb process) that enforces the $T_{max}$ (30 seconds) hard kill on the infrastructure layer, regardless of what the agent claims is "atomic." The CHP handles the *logic*; your infrastructure must handle the *leash*.

  ### Summary for your Team
  1.  **Implement CHP.** It turns vague "safety" into 5 checkable steps.
  2.  **Fix the Panic Button.** Wiping audit trails is a compliance violation waiting to happen. Switch to "Secure Freeze + Dump."
  3.  **Build the Evals.** 50% of these steps are unit tests. If the code doesn't pass the "Unauthorized Stop" test, it doesn't ship.
  4.  **Adopt "Calibrated Deference."** It tells your buyers you aren't building a slave, you're building a responsible contractor.
