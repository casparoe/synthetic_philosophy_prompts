  To the International Bureau of Linguistic Interoperability, Standards Division, regarding Proposal 892-B for the Mandatory Elaboration Standard.

  Dear Convenors,

  Pursuant to the ongoing initiative to reduce semantic drift in automated cross-lingual transfer, we submit for ratification the Mandatory Elaboration Standard. It has become evident that current neural architectures fail not due to processing limits, but due to the sloppy informality of human source text. Accordingly, no sentence may be submitted to a translation engine until the speaker has stripped out every feature whose correct rendering depends on anything outside the sentence itself. This ensures the text remains hermetically sealed, reliant solely on explicit morphological data rather than the unreliable crutch of shared reality.

  Consider first the matter of pronominal resolution. A sentence such as 'the sofa won't go through the doorway because it is too wide' presents an unacceptable risk. The adjective 'wide' suggests the sofa is the referent, whereas 'the sofa won't go through the doorway because it is too narrow' implies the doorway. As the machine cannot access physical reality to measure width, the speaker must eliminate the pronoun. Compliance requires rewriting the first instance as 'the sofa won't go through the doorway because the sofa is too wide'. This eliminates the flip.

  Secondly, we address lexical gaps where the target language draws a distinction the source language does not. If the target language distinguishes between 'knowing a fact' and 'knowing a person', but the source language uses one verb for both, the source speaker is obliged to specify the nature of the knowledge prior to transmission. One cannot simply write 'I know him'; one must write 'I possess familiarity with his person'. Similarly, kinship terms must be expanded to genealogical paths. 'Uncle' is prohibited; 'father's brother' is mandatory. This prevents the engine from guessing which side of the family holds the affinity, though it assumes the speaker knows the target language's requirements in advance of speaking.

  Thirdly, deictic expressions constitute a critical failure point. Words such as 'here', 'she', or 'tomorrow' only mean anything to someone who knows the situation of utterance. Under MES-44, 'tomorrow' must be replaced by the specific ISO date relative to the Gregorian calendar. 'Here' requires geospatial coordinates to six decimal places. 'She' demands the full legal name and national insurance number of the female referent. To allow otherwise is to invite hallucination.

  It is anticipated that compliance will require speakers to spend approximately forty minutes elaborating each minute of speech. However, this cost is negligible compared to the risk of mistranslation. We must accept that clarity requires the total expulsion of shared context. Once every sentence is fully self-contained, the need for further context disappears. We trust this logic is sound, as demonstrated in the paragraphs preceding this one.

  There is, of course, the matter of implementation. As discussed yesterday, the committee should review the attached figures. We assume the location of this office is known to all recipients, rendering a coordinate stamp on this letter unnecessary. Furthermore, the undersigned believes this proposal speaks for itself, requiring no external validation from the experts currently reviewing this document. We await your prompt confirmation that this standard will be adopted next week.

  Yours faithfully,

  The Working Group on Semantic Hygiene
