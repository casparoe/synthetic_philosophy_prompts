  *(Self-Correction Note on Q2)*: Is domain-indexing ad hoc? It essentially turns Tracking into Relevant Alternatives Theory. That's a significant shift. I should point out that P1 is essentially abandoning pure Tracking for a hybrid.

  *(Self-Correction Note on Q4)*: The "missing" element is likely the distinction between the *method of the premise* and the *method of the conclusion*. In deduction, the method is "inferring from p". Sensitivity must hold for *that* method regarding *q*. Since the BIV world is one where p is false (no hands) but the belief in p is held (via hallucination), the deduction to q fails sensitivity. The participants are arguing about *domains*, but the real issue is the *counterfactual dependence* of the deduced belief.

