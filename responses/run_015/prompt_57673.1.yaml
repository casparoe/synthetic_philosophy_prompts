prompt: |-
  I'm a litigator in federal civil practice, fifteen years in; I know the rules of evidence and Rule 11 backwards, and I have no philosophy training. The debate I want translated is the epistemologists' argument over the norm of assertion — that one should assert only what one knows (the view associated with Williamson), against the rivals holding that assertion requires truth, or reasonable belief, or nothing more than sincerity.

  Render each candidate in the vocabulary I work in: personal knowledge as a foundation requirement for a witness, the certification that factual contentions have evidentiary support after an inquiry reasonable under the circumstances, the perjury standard's preoccupation with what the declarant believed rather than with what was so, materiality, willfulness, sanctions, and the allocation of risk between the one who speaks and the one who relies. Translate faithfully; don't smuggle my framework's assumptions back to me as conclusions about theirs.

  Then give me the residue report. Which candidate has an exact legal counterpart and which only an approximate one? Where does the translation force distortion — for instance, because every standard I know is imposed from outside on an activity that would exist anyway, whereas the philosophers hold that at least one of these norms is constitutive of the activity itself? What in their debate is inexpressible in my vocabulary at all? And where translation fails, is that a limitation of the legal framework, or a sign that the philosophical claims were less determinate than they sound?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Federal civil litigator, 15 years experience. Expert in FRE, FRCP (specifically Rule 11), perjury statutes, etc. No philosophy training.
      *   **Task:** Translate the epistemological debate over the "Norm of Assertion" (Knowledge Norm vs. Truth Norm vs. Reasonable Belief Norm vs. Sincerity Norm) into legal vocabulary.
      *   **Specific Vocabulary to Use:** Personal knowledge (FRE 602), Rule 11 certification (evidentiary support), perjury standard (belief vs. truth), materiality, willfulness, sanctions, risk allocation.
      *   **Constraint:** Translate faithfully. Do not smuggle legal assumptions back as philosophical conclusions.
      *   **Second Task:** Provide a "Residue Report."
          *   Which candidate has an exact legal counterpart? Which is approximate?
          *   Where does translation force distortion? (Specifically noting the external vs. constitutive norm distinction).
          *   What is inexpressible in legal vocabulary?
          *   Is the failure of translation a limitation of law or indeterminacy in philosophy?

  2.  **Deconstruct the Philosophical Positions:**
      *   *Knowledge Norm (Williamson):* Assert $p$ only if you know $p$. (Standard: Knowledge).
      *   *Truth Norm:* Assert $p$ only if $p$ is true. (Standard: Truth).
      *   *Reasonable Belief/Justified Belief Norm:* Assert $p$ only if you have reasonable evidence/justification for $p$. (Standard: Justification/Reasonableness).
      *   *Sincerity Norm:* Assert $p$ only if you believe $p$. (Standard: Subjective Belief).

  3.  **Drafting the Translation (Iterative Process):**

      *   *Knowledge Norm:* In law, what requires *knowledge*? Witness testimony (FRE 602). But assertion is broader. Rule 11 requires an inquiry reasonable under the circumstances to support factual contentions. That sounds like "reasonable belief." What about "knowledge"? Perjury requires knowledge of falsity. But the *norm* for speaking?
      *   *Attempt 1:* The Knowledge Norm is like FRE 602.
      *   *Critique 1:* FRE 602 applies to witnesses on the stand, not lawyers filing motions or parties talking in discovery.
      *   *Attempt 2:* The Knowledge Norm is like the standard for expert testimony (Daubert/reliability) + personal knowledge.
      *   *Refinement:* Let's look at the *sanction* aspect. If you assert without knowledge, what happens? In law, if you testify without personal knowledge, it's stricken. If you file a pleading without evidentiary support, it's Rule 11 sanctions.
      *   *Decision:* I need to map these to specific legal standards of *liability* or *admissibility*.
      *   *Knowledge Norm:* Closest to the *Perjury* standard (18 U.S.C. § 1621) regarding the *mental state* required for liability, but flipped. Or perhaps the standard for *summary judgment* evidence (must be based on personal knowledge). Let's use the Rule 11 "evidentiary support" but tighten it. Actually, the Knowledge Norm is stricter than Rule 11. Rule 11 allows assertion if you *will likely* have evidence later. Knowledge Norm says you must *know* now.
      *   *Truth Norm:* This is strict liability. If it's false, you breached the norm, regardless of what you thought. In law, this is rare. Defamation (sometimes), or perhaps the standard for *materiality* in perjury (the statement must be objectively false to be actionable, though the *crime* requires intent).
      *   *Reasonable Belief Norm:* This is classic Rule 11(b)(3). "Factual contentions have evidentiary support or... will likely have evidentiary support." Also FRE 703 (expert basis). Also the standard for *probable cause*.
      *   *Sincerity Norm:* This is the subjective belief component of Perjury. "Willfully and contrary to such belief." It doesn't matter if the statement is true; if you believed it was false, you violated the norm.

      *   *Refining the Translation:* I need to speak like a litigator. Use terms like "foundation," "certification," "safe harbor," "objective vs. subjective."

      *   *Knowledge Norm (Williamson):* Treat this as a *Foundation Requirement* stricter than Rule 11. Like FRE 602 applied to *all* advocacy. You cannot put it before the court (or the world) unless you have personal knowledge.
      *   *Truth Norm:* Treat this as *Strict Liability* for misrepresentation. Like a warranty. If the fact is untrue, you breached, even if you checked everything.
      *   *Reasonable Belief Norm:* Treat this as the *Rule 11 Standard*. Objective reasonableness under the circumstances.
      *   *Sincerity Norm:* Treat this as the *Perjury Mens Rea*. Subjective belief.

  4.  **Drafting the Residue Report:**
      *   *Exact Counterpart:* Reasonable Belief Norm $\approx$ Rule 11(b)(3). It's almost a perfect fit.
      *   *Approximate:* Sincerity $\approx$ Perjury intent. Truth Norm $\approx$ Strict Liability (rare in speech). Knowledge Norm $\approx$ FRE 602 (but limited scope).
      *   *Distortion:* The big one is *Constitutive vs. Regulative*. Law regulates an activity that exists independently. Philosophy argues the norm *makes* the activity what it is. Law cares about sanctions; Philosophy cares about "appropriateness" or "correctness."
      *   *Inexpressible:* The concept of "appropriateness" without sanction. In law, if there's no sanction, there's no rule. In philosophy, you can violate a norm without punishment, but the assertion is still "defective."
      *   *Limitation vs. Indeterminacy:* Is law too blunt, or is philosophy too vague? Probably law is designed for dispute resolution, not defining speech acts.

  5.  **Review against Constraints:**
      *   *Tone:* Professional, peer-to-peer (litigator to litigator). No condescension, no jargon without explanation.
      *   *Vocabulary:* Use the requested terms (personal knowledge, Rule 11, perjury, materiality, willfulness, sanctions, risk allocation).
      *   *Faithfulness:* Don't say "The Knowledge Norm is wrong because Rule 11 says otherwise." Say "The Knowledge Norm maps to X, which differs from Rule 11 in Y way."

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't confuse the *norm* with the *sanction*. The norm is the rule; the sanction is what happens if you break it.
      *   *Clarification:* Ensure the distinction between Objective (Reasonable Belief) and Subjective (Sincerity) is clear, as this is a key distinction in law (Rule 11 is mostly objective, Perjury is subjective).
      *   *Residue:* Be sharp on the "Constitutive" point. That's the hardest philosophical concept to translate. Use the analogy of "rules of the game" vs. "rules of conduct."

  7.  **Final Output Structure:**
      *   Introduction (acknowledging the brief).
      *   The Translation (The Four Candidates).
      *   The Residue Report (Mapping, Distortion, Inexpressibility, Diagnosis).

  *(Self-Correction on the Knowledge Norm)*: Williamson's Knowledge Norm is often argued as the *default* standard for assertion. In law, the closest thing to "You must know this to say it" is the requirement for affidavit evidence on summary judgment (FRE 56(c)(4)) or witness testimony (FRE 602). I will use FRE 602/Summary Judgment as the anchor.

  *(Self-Correction on Truth Norm)*: In law, strict liability for speech is basically defamation of public figures (sometimes) or statutory liability for false claims (False Claims Act). But the *norm* of assertion being *truth* is like a warranty of accuracy. I'll frame it as Strict Liability.

  *(Self-Correction on Constitutive Norm)*: How to explain this to a lawyer? Compare it to "subject matter jurisdiction." If you don't have it, the case doesn't exist. If you violate a constitutive norm, is it still an assertion? That's the philosophical question. Law assumes the act occurred and punishes it.

  8.  **Finalizing the Text:** (Proceed to generate response based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Senior Litigator
  **FROM:** Legal Translator
  **RE:** Translation of Epistemological Norms of Assertion into Federal Civil Practice Vocabulary

  You have asked for a translation of the philosophical debate regarding the "Norm of Assertion" into the lexicon of federal civil litigation. The goal is to map four competing philosophical standards onto the procedural and evidentiary frameworks you manage daily, without prejudging the philosophical merits based on legal utility.

  Below are the four candidates translated into your working vocabulary, followed by the Residue Report regarding the fidelity and limits of this translation.

  ***

  ### I. The Candidates Translated

  **1. The Knowledge Norm (The Williamson Standard)**
  *   **Philosophical Claim:** One must assert $p$ only if one knows $p$.
  *   **Legal Translation:** This functions as a strict **Personal Knowledge Foundation Requirement (FRE 602)** applied universally to all out-of-court and in-court advocacy.
  *   **Operational Effect:** Before you speak a factual contention, you must possess the same degree of certainty required of a witness on the stand. You cannot assert based on hearsay, inference, or probability, even if reasonable. If you assert without personal knowledge, the assertion is procedurally defective *ab initio*.
  *   **Risk Allocation:** The risk of error is placed entirely on the speaker. Even if you conducted a reasonable inquiry, if you lack actual knowledge, you have breached the norm.
  *   **Sanction:** The assertion is treated as if no evidence were offered (stricken); in a liability context, this approaches a **perjury** standard where the focus is on the gap between your cognitive state and the fact, regardless of your diligence.

  **2. The Truth Norm (The Strict Liability Standard)**
  *   **Philosophical Claim:** One must assert $p$ only if $p$ is true.
  *   **Legal Translation:** This is a **Strict Liability** regime for factual representations.
  *   **Operational Effect:** The only metric is **materiality** and objective accuracy. Your subjective belief, your diligence, and your inquiry are irrelevant to whether you breached the norm. If the fact turns out to be false, the norm was violated.
  *   **Risk Allocation:** Maximum risk on the speaker. You guarantee the outcome (truth), not just the process (inquiry).
  *   **Sanction:** Analogous to statutory penalties for false claims (e.g., False Claims Act) where the falsity itself triggers liability, irrespective of **willfulness** or intent to deceive.

  **3. The Reasonable Belief Norm (The Rule 11 Standard)**
  *   **Philosophical Claim:** One must assert $p$ only if one has reasonable evidence/justification for $p$.
  *   **Legal Translation:** This is the **Rule 11(b)(3) Certification** standard.
  *   **Operational Effect:** You may assert $p$ if, after an **inquiry reasonable under the circumstances**, the factual contention has or will likely have evidentiary support. It is an objective standard: would a reasonable attorney in your position believe this to be supported?
  *   **Risk Allocation:** Risk is shared. The speaker bears the burden of inquiry, but the listener bears the risk that a reasonable inquiry might still yield a false result.
  *   **Sanction:** **Sanctions** apply only if the inquiry was objectively unreasonable. If you were reasonable but wrong, no sanction attaches.

  **4. The Sincerity Norm (The Perjury Mens Rea Standard)**
  *   **Philosophical Claim:** One must assert $p$ only if one believes $p$.
  *   **Legal Translation:** This is the subjective **belief** component of the **Perjury Statute (18 U.S.C. § 1621)**.
  *   **Operational Effect:** The norm is breached only if you assert $p$ while believing $\neg p$. If you assert $p$, and $p$ is false, but you believed it was true, you have not breached the norm. Conversely, if you assert $p$, and $p$ is true, but you believed it was false, you *have* breached the norm (attempted perjury).
  *   **Risk Allocation:** Risk lies with the listener to detect deception, not error. The speaker is only liable for **willfulness** regarding their own mental state.
  *   **Sanction:** Punishment attaches to the lie (the mismatch between speech and belief), not the error (the mismatch between speech and reality).

  ***

  ### II. Residue Report

  **1. Mapping Fidelity: Exact vs. Approximate Counterparts**

  *   **Exact Counterpart:** The **Reasonable Belief Norm** maps almost perfectly to **Rule 11(b)(3)**. Both standards excuse error if the pre-assertion process (inquiry/investigation) was objectively reasonable. Both shift the focus from the truth of the proposition to the diligence of the proponent.
  *   **Approximate Counterpart:** The **Sincerity Norm** maps to the **Perjury Mens Rea**, but with a divergence. In law, sincerity alone is insufficient for a valid testimony; you also need personal knowledge (FRE 602). The philosophical Sincerity Norm suggests belief *alone* is sufficient for a proper assertion. Law requires belief *plus* foundation.
  *   **Approximate Counterpart:** The **Truth Norm** maps to **Strict Liability** torts or statutory penalties. However, in law, strict liability for speech is rare and usually confined to specific statutory regimes (e.g., SEC disclosures). In philosophy, this is posited as a general norm of everyday speech, which makes the legal mapping feel overly punitive for the context.
  *   **No Direct Counterpart:** The **Knowledge Norm** has no exact procedural equivalent for *advocacy*. While FRE 602 requires personal knowledge for *witnesses*, attorneys are explicitly permitted to argue inferences and probabilities provided they have evidentiary support (Rule 11). The Knowledge Norm would effectively enjoin most summary judgment arguments and opening statements where direct knowledge is unavailable.

  **2. Distortion: Regulative vs. Constitutive Norms**

  The most significant distortion arises from the nature of the norm itself.
  *   **Legal Framework:** All legal norms are **Regulative**. They govern an activity (filing a motion, testifying) that exists independently of the rule. If you violate Rule 11, the motion still exists; it just subjects you to sanctions. The rule is imposed from the outside by the Court.
  *   **Philosophical Claim:** Epistemologists argue that at least one of these norms is **Constitutive**. They claim the norm *makes* the activity what it is. If you violate the constitutive norm, you aren't just "bad at asserting"; you arguably aren't "asserting" at all (just as moving a pawn diagonally isn't "bad chess," it isn't chess).
  *   **The Distortion:** My translation treats all norms as grounds for **sanctions**. In your vocabulary, a rule without a remedy is advisory. In the philosophical debate, a norm can be binding even if no sanction exists. Translating "appropriateness" as "liability" forces a binary (liable/not liable) onto a spectrum of correctness.

  **3. Inexpressible Elements**

  *   **The "Scorekeeping" Function:** In litigation, we track compliance for the Judge. In the philosophical debate, the "score" is kept by the interlocutor in a conversation. There is no neutral arbiter to rule on whether you "knew" something in a casual conversation. The legal vocabulary assumes a Forum; the philosophical debate often assumes a Dyad.
  *   **Defectiveness without Sanction:** In law, if an assertion violates a norm but is not sanctionable (e.g., a technical error harmless under **FRE 103(a)**), we treat it as negligible. In philosophy, an assertion can be "defective" (e.g., asserting a lottery ticket will lose based on odds) without being sanctionable or unreasonable. My vocabulary lacks a term for "improper but unactionable."
  *   **The Nature of "Knowledge":** In law, "knowledge" is often a jury question or defined by statute (e.g., "actual knowledge" vs. "constructive knowledge"). In the philosophical debate, "knowledge" is the metaphysical prize. Translating "knowledge" as "personal knowledge under FRE 602" reduces a metaphysical state to a foundation requirement.

  **4. Diagnosis: Limitation of Law or Indeterminacy of Philosophy?**

  Where the translation fails, it is primarily a **limitation of the legal framework**, not indeterminacy in the philosophy.

  *   **Why:** The law is instrumental. It designs norms to resolve disputes efficiently and deter misconduct. It does not care about the metaphysical nature of speech acts unless they impact case outcomes. Therefore, the law *cannot* express a constitutive norm because the law's function is regulation, not definition of human activity.
  *   **The Exception:** However, where the philosophers argue over whether "Knowledge" or "Reasonable Belief" is the correct norm, the legal framework reveals that the philosophical claim might be **over-determined**. In law, we apply different norms to different actors (Witness = Knowledge; Attorney = Reasonable Belief; Deponent = Sincerity/Truth). The fact that law successfully operates with *multiple* concurrent norms suggests the philosophical search for the *single* constitutive norm of assertion may be chasing a category error. Speech may be a multi-purpose tool that accepts different warranties depending on the context, much like a document can be a contract, a pleading, or a notice depending on who signs it and where it is filed.

  **Conclusion:**
  The Reasonable Belief Norm is your home turf (Rule 11). The Sincerity Norm is your criminal exposure (Perjury). The Truth Norm is your client's worst nightmare (Strict Liability). The Knowledge Norm is a procedural bar you apply to opposing witnesses (FRE 602) but could not survive as a standard for your own advocacy. The debate you are translating is essentially a dispute over which of these four procedural postures should govern human communication generally.
