answer: |-
  ### 1. The Exam Question

  **Metaethics: Final Take-Home Assessment**
  **Time Allowed:** 48 Hours
  **Word Limit:** 1,500 words maximum
  **Marks:** 30

  **Question 1**

  Consider two competing accounts of normative reasons. **Non-Relationalism** holds that reasons are irreducibly normative facts that obtain independently of any agent's motives, perspectives, or capacities. On this view, a reason can be "free-floating": it can be a reason to φ without necessarily being a reason *for* any specific person to φ. **Relationalism** denies this. It holds that the concept of a reason is essentially relational; a reason must always be a reason *for* some agent. For the Relationalist, there are no free-floating reasons; normative facts are always agent-indexed.

  Consider the following case. Ada and Bo are causally isolated on separate islands. Ada can prevent one severe injury to a stranger on her island. Bo can prevent five mild injuries to five different strangers on his island. Neither can affect the other's situation, and no third party exists who can act on either island. Intuitively, there is a fact about whose opportunity matters more (e.g., that Bo's opportunity is more significant than Ada's). However, this comparative fact is not a reason for Ada (she cannot act on Bo's situation), not a reason for Bo (he cannot act on Ada's situation), and not a reason for anyone else (no one else can act).

  This generates the **Remainder Argument**:
  1. Any Relationalist theory must state a general principle specifying which considerations count as reasons for which agents.
  2. Any Relationalist theory must also provide rules for combining or comparing the reasons of distinct agents to make judgments about overall outcomes (e.g., that preventing five mild injuries is better than preventing one severe injury).
  3. Neither the general principle nor the rule of combination is itself a reason *for* anyone to act, particularly in cases like Ada and Bo's where no agent can act on the comparative fact.
  4. Therefore, the Relationalist abolishes free-floating *reasons* only by admitting free-floating *normative principles*.

  Write an essay evaluating the Remainder Argument. Does the admission of free-floating normative principles undermine the Relationalist project, or does it represent a legitimate theoretical gain? In your answer, you must apply the argument specifically to the Ada and Bo case to show why the comparative fact cannot be reconstructed as an agent-indexed reason. Finally, say explicitly what you take the underlying motivation for Relationalism to be, and explain whether the Remainder Argument succeeds in showing that this motivation remains unsatisfied.

  ***

  ### 2. Model Answer

  **The Illusory Gain: Why the Remainder Argument Refutes Relationalism**

  The Relationalist seeks to naturalize normativity by tethering reasons to agency. Their motivation is to avoid the metaphysical queerness of free-floating normative facts that exist regardless of whether any agent can grasp or act upon them. By insisting that all reasons are reasons *for* someone, the Relationalist promises a picture of normativity that is essentially practical and action-guiding. However, the Remainder Argument demonstrates that this promise is illusory. By analyzing the Ada and Bo case, it becomes clear that Relationalism does not eliminate free-floating normativity; it merely relocates it from first-order reasons to higher-order principles. This relocation is not a theoretical gain but a change of subject that fails to satisfy the view's original motivation.

  To see this, we must first establish why the comparative fact in the Ada and Bo case cannot be reconstructed as an agent-indexed reason. A Relationalist might attempt to claim that the fact "Bo's opportunity matters more" is a reason for Bo to prioritize his own actions. But this is trivial. Bo already has a reason to prevent the five mild injuries based on the local facts of his island. The comparative fact adds nothing to his deliberation because he cannot access Ada's island. Conversely, if the comparative fact were a reason for Ada to regret her inability to help Bo, it would presuppose a reason to do the impossible, which violates the 'ought implies can' constraint often embraced by Relationalists. Crucially, because the agents are causally isolated and no third party exists, there is no agent *for whom* this comparative fact serves as a premise in practical deliberation. If a fact cannot figure in anyone's practical syllogism, the Relationalist is committed to saying it is not a reason. Yet, it remains a normative truth that one outcome is better than the other.

  This forces the Relationalist to appeal to the general principles mentioned in the Remainder Argument. To explain why Bo's opportunity matters more, the Relationalist must invoke a principle such as "Five mild injuries outweigh one severe injury." This principle dictates how local reasons are generated and weighed. However, this principle itself is not a reason for Ada or Bo to do anything; it is a rule *about* reasons. It obtains independently of their motives. If the Relationalist admits this principle is a normative fact, they have admitted a free-floating normative fact. They have successfully banned free-floating *reasons*, but only by permitting free-floating *principles of reasonhood*.

  The critical question is whether this relocation satisfies the Relationalist's underlying motivation. The primary motivation for Relationalism is typically to secure a link between normativity and agency, thereby avoiding a "normative reality" that floats detached from the practical standpoint. The Relationalist wants to say that normativity is constituted by the conditions of agency, not by a separate realm of facts. However, if the principles that govern which facts count as reasons are themselves free-floating, the detachment remains. The principle "Five mild injuries outweigh one severe injury" is a normative truth that holds even if no agents exist to act on it. It is just as metaphysically "queer" as a free-floating reason.

  One might object that principles are merely conceptual truths, not normative facts. But this fails in the Ada and Bo case. The weighting of injuries is not a matter of logic or definition; it is a substantive normative claim. If the Relationalist treats it as a brute normative principle, they have conceded the Non-Relationalist's core point: that some normative facts obtain independently of agent-indexed relations.

  Therefore, the Remainder Argument succeeds. The Relationalist purchases the agent-indexing of reasons at the cost of agent-neutrality in principles. This is not a gain. The original motivation was to ground normativity in the practical standpoint of agents. By pushing the normativity up a level to principles that no agent uses in deliberation (since agents use reasons, not principles about reasons), the Relationalist preserves the letter of their view while violating its spirit. The normative reality remains detached from agency, merely residing in the rules of the system rather than the moves of the game. Consequently, the Relationalist fails to achieve a more parsimonious or less metaphysically demanding ontology than the Non-Relationalist. The free-floating rationale remains, disguised as a principle.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 30
  **Structure:** 5 Criteria × 6 Marks each

  **1. Reconstruction of the Relationalist/Non-Relationalist Distinction**
  *   **Required Move:** Clearly defines Relationalism as the claim that reasons are essentially agent-indexed and Non-Relationalism as the claim that reasons can obtain independently of agents. Must identify the core metaphysical commitment of each.
  *   **Competent Answer:** Defines the terms correctly but treats them as merely verbal disputes about the word "reason."
  *   **Common Pitfall:** Conflating Relationalism with Internalism about motivation or Subjectivism.
  *   **First-Class Differentiator:** Explicitly links the distinction to the metaphysical status of normative facts (detached vs. tethered).

  **2. Application of the Ada/Bo Case**
  *   **Required Move:** Demonstrates specifically why the comparative fact ("Bo's opportunity matters more") cannot be a reason for Ada, Bo, or a third party within the constraints of the case (causal isolation).
  *   **Competent Answer:** States that Ada and Bo can't help each other but fails to explain why this prevents the fact from being a *reason* for them.
  *   **Common Pitfall:** Suggesting Ada has a reason to regret her inability, missing the 'ought implies can' constraint relevant to Relationalism.
  *   **First-Class Differentiator:** Shows that the comparative fact is normative but lacks a deliberative role for any existing agent.

  **3. Analysis of the "Remainder" (Principles vs. Reasons)**
  *   **Required Move:** Identifies that the Relationalist must rely on general principles or combination rules to explain the case, and argues that these principles are themselves free-floating normative facts.
  *   **Competent Answer:** Acknowledges principles exist but treats them as harmless linguistic conventions.
  *   **Common Pitfall:** Confusing the principle with a reason for a hypothetical ideal observer (which violates the case stipulations).
  *   **First-Class Differentiator:** Argues that principles are substantive normative truths, not merely conceptual/logical truths, thus carrying the same metaphysical weight as free-floating reasons.

  **4. Identification of Relationalist Motivation**
  *   **Required Move:** Explicitly states what Relationalism is supposed to achieve (e.g., tethering normativity to agency, avoiding queer detached facts, ensuring action-guidance).
  *   **Competent Answer:** Vaguely suggests Relationalism is about "people" or "subjectivity."
  *   **Common Pitfall:** Attributing a moral motivation (e.g., "to make people nicer") rather than a metaethical one.
  *   **First-Class Differentiator:** Connects the motivation to the metaphysical or epistemological benefits the Relationalist claims over the Non-Relationalist.

  **5. Evaluation of the Trade-off (Gain vs. Change of Subject)**
  *   **Required Move:** Concludes whether relocating normativity to principles satisfies the motivation identified in Point 4. Must take a stand on whether the Remainder Argument is fatal.
  *   **Competent Answer:** Hedges, saying "both sides have points," without resolving whether the relocation is a victory.
  *   **Common Pitfall:** Concluding the argument fails simply because Relationalism is a popular view, or vice versa.
  *   **First-Class Differentiator:** Provides a decisive verdict on whether the "spirit" of Relationalism is violated even if the "letter" is preserved, linking back to the nature of the free-floating fact.

  **Grading Note:**
  A **First-Class (70+)** answer will perform all five moves with precision, committing to a substantive verdict on the Remainder Argument rather than surveying options. It will treat the Ada/Bo case as a logical test rather than an illustration. An **Upper-Second (60-69)** answer will correctly explain the argument and case but may hedge on the final evaluation or offer a thinner account of the Relationalist motivation.
