      *   *Hypothetical:* Make sure it isolates the variable. The variable is "Effort vs. Outcome" when Rigor and Obstacles are controlled.

  9.  **Final Polish:** Ensure all constraints of the prompt are met. (Rule identification, prediction, analog, boyfriend analysis, hypothetical case).

      *   *Rule Name:* "The High-Floor Meritocracy with Adversity Tie-Breakers."
      *   *Elena:* Eligible, but if there's a "Marcus 2.0," she loses. If she's the only applicant, she wins.
      *   *Analog:* Aisha (but weaker on effort).
