          2.  *Marcus:* 3.85, hardest schedule, works 20hrs, raises siblings, first-gen. -> **YES** (ranked above Aisha).
          3.  *Devon:* 3.95, easiest schedule, no job/obstacles, works hard. -> **NO** (didn't challenge self).
          4.  *Priya:* 2.9, hardest schedule, homeless, works, teachers say she works hardest. -> **NO** (admire her, but award isn't hers).
