      *   **Specific Questions to Answer:**
          1.  Identify the rule(s) that fit all five verdicts.
          2.  Evaluate two proposed rules: (A) Achievement + Obstacles, (B) Effort + Hard Road + Floor.
          3.  Predict Elena's outcome under each rule.
          4.  Determine which rule the committee is *actually* running.
          5.  Identify the closest analog case.
          6.  Address the philosophy PhD boyfriend's critique (Luck Egalitarianism/Moral Desert).
          7.  Propose one hypothetical case to force the rules apart at the next meeting.

  2.  **Deconstruct the Past Verdicts:**

      *   *Aisha (Yes):* High Achievement (4.0) + High Rigor + High Effort (implied "genuinely works") + Low Obstacle.
      *   *Marcus (Yes):* High Achievement (3.85) + High Rigor + High Effort (implied by circumstances) + High Obstacle. *Key Note:* Ranked *above* Aisha. This implies Obstacles/Effort > Pure GPA.
      *   *Devon (No):* High Achievement (3.95) + Low Rigor + High Effort + Low Obstacle. *Key Note:* Rigor is a gatekeeper.
