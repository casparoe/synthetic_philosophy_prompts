answer: |-
  Here is a 50-minute lesson plan designed to target the specific conceptual failures you identified.

  ### The Anchor Game: Hex
  **Do not use Tic-Tac-Toe. Do not use Chess.**
  Use **Hex** on an $n \times n$ board (where $n \geq 2$).
  *   **Why:** It is the canonical example for a reason. It satisfies the "no draw" condition (a non-trivial theorem you will take as axiom), it is symmetric (both players have the same goal topology), and it satisfies **monotonicity** (having an extra stone on the board is never a disadvantage; you can simply treat it as "not there" if it doesn't help).
  *   **Why not Tic-Tac-Toe:** As you noted, it's a draw. Using it forces you to say "P1 cannot lose," which dilutes the "P1 Wins" punchline, and the board is small enough that students try to solve it computationally rather than logically.
  *   **Why not Chomp:** Chomp is a strong runner-up, but the "poisoned square" ending sometimes confuses students about who made the last move. Hex's "connect the sides" goal is visually cleaner for the "extra piece" intuition.

  ---

  ### The Sequence (50 Minutes)

  #### 1. The Setup & Assumption Audit (0:00 – 0:10)
  **Goal:** Separate the "Zermelo Hygiene" from the "Strategy-Stealing Load-Bearing Beams."
  **Action:** Write the rules of Hex on the board. Then, list the standard game assumptions. Ask students to categorize them into **"Needed for any logical analysis"** vs. **"Needed for *this specific proof*."**

  *   **Hygiene (Zermelo's Theorem prerequisites):**
      *   *Finite:* (Mostly hygiene. SS works on infinite well-ordered games, but keep it finite for this class).
      *   *Perfect Information:* (Hygiene. You can't steal a strategy you can't see).
      *   *Two Players:* (Hygiene. Definition of the adversarial setup).
      *   *Zero-Sum:* (Hygiene. One's win is the other's loss).
      *   *Why:* These ensure the game is *determined* (i.e., one player *must* have a winning strategy or both can force a draw). They do not tell you *which* player.

  *   **Load-Bearing (Strategy Stealing prerequisites):**
      *   *Symmetry:* P1 and P2 have identical move options relative to their goal (except for who goes first).
      *   *Monotonicity (The "Extra Move" Property):* **Crucial.** Having an extra piece on the board is never a disadvantage.
      *   *No Draws:* **Crucial.** If draws are possible, the conclusion weakens from "P1 Wins" to "P1 Does Not Lose."

  **TA Script:** *"If I change the rules so that having an extra stone blocks your own path (violating Monotonicity), does the proof break? Yes. If I change the rules to allow a draw (violating No-Draws), does the proof break? It still works, but the conclusion changes. Keep these distinct."*

  #### 2. The Proof Walkthrough (0:10 – 0:25)
  **Goal:** Execute the logic while highlighting the "Extra Move" crisis point.
  **Action:** Walk through the contradiction argument step-by-step.

  1.  **Hypothesis:** Assume Player 2 has a winning strategy $S$.
  2.  **The Theft:** Player 1 makes an *arbitrary* first move (call it $m_0$).
  3.  **The Pretend:** Player 1 now ignores $m_0$ mentally and pretends to be Player 2, using strategy $S$ against Player 2's actual moves.
  4.  **The Crisis (Misconception iii):** Strategy $S$ eventually calls for a move on the square occupied by $m_0$.
      *   *Pause here.* Do not gloss over this.
      *   *Ask:* "Why can't P1 just skip a turn?" (Answer: Rules don't allow passing).
      *   *Ask:* "Why is this fatal?" (Answer: If the strategy requires that specific square to maintain the winning invariant, we are stuck).
      *   *Resolution:* Player 1 makes *another* arbitrary move $m_1$.
      *   *The Justification:* Why is this allowed? Because of **Monotonicity**. Having pieces at $\{m_0, m_1\}$ is strictly better than or equal to having a piece at $\{m_0\}$. The "extra" piece cannot hurt.
  5.  **Contradiction:** P1 has won using P2's strategy. Thus, P2 cannot have a winning strategy.

  #### 3. The Conclusion & Misconception Interception (0:25 – 0:35)
  **Goal:** Address Misconceptions (i) and (ii) immediately while the proof is fresh.

  *   **Addressing (ii) "P1 Wins" vs. "P1 Doesn't Lose":**
      *   Point to the **No Draws** assumption from Step 1.
      *   *Script:* "If we played this on a game where draws are possible (like Tic-Tac-Toe), this exact proof holds, but the conclusion is only that P2 cannot force a win. P1 might still only be able to force a draw. Because Hex has no draws, 'Not Losing' equals 'Winning'."

  *   **Addressing (i) Existence vs. Construction:**
      *   *Script:* "I have just proven P1 has a winning strategy. I have also told you exactly zero information about what that strategy *is*."
      *   Highlight the **Arbitrary Move**. The proof relies on the first move being *arbitrary*. If the proof required a *specific* first move to work, it would be constructive. Because *any* move works (due to symmetry and monotonicity), we learn nothing about which move is good.

  #### 4. The Diagnostic Question (0:35 – 0:40)
  **Goal:** Test absorption of non-constructiveness.
  **Action:** Pose this question verbally and ask for a show of hands or a quick written slip.

  > **The Question:** "I have a computer program that plays perfect Hex on a $10 \times 10$ board. It plays as Player 1. It is your turn to bet money. Based *only* on the Strategy-Stealing proof we just did, can you predict the program's first move with certainty?"
  >
  > **Correct Answer:** No.
  > **Why:** The proof guarantees a win exists, but relies on the first move being arbitrary. The program could play in the center, the corner, or anywhere else. The proof does not distinguish between good and bad opening moves, only that *some* path leads to a win.
  > **Trap Answer:** "Yes, the center." (Students confuse the proof with heuristics or specific known strategies).

  #### 5. Scope Boundaries: What to Refuse (0:40 – 0:50)
  **Goal:** Manage expectations and prevent "homework creep."
  **Action:** Explicitly state what is **out of bounds** for this section and this course module.

  1.  **"We will not find the strategy."**
      *   *Say:* "Do not ask me for the winning strategy for $10 \times 10$ Hex. It is unknown to mathematics. This proof tells you it exists, not how to find it. If you try to derive the strategy from this proof, you will fail."
  2.  **"We will not prove Hex has no draws."**
      *   *Say:* "The fact that Hex cannot end in a draw is a topological theorem (related to Brouwer's Fixed Point Theorem). It is hard. We are taking it as an axiom for this argument. Do not try to prove the 'No Draw' property on the exam."
  3.  **"We will not apply this to games with 'friendly fire'."**
      *   *Say:* "Do not try to use this argument on games where having an extra piece can block you (like Go or Chess). The Monotonicity assumption fails there, and the proof collapses."

  ---

  ### Summary of Misconception Timing

  | Misconception | When to Head It Off | How |
  | :--- | :--- | :--- |
  | **(iii) The "Extra Move" is trivial** | **Minute 20** (During the Proof) | Stop at the moment the strategy calls for the occupied square. Force them to articulate why playing a *second* arbitrary move is legal. Tie it explicitly to **Monotonicity**. |
  | **(ii) P1 Wins vs. P1 Doesn't Lose** | **Minute 30** (Post-Proof) | Explicitly link the conclusion strength to the **No-Draw** assumption. Contrast with Tic-Tac-Toe verbally. |
  | **(i) Constructive vs. Non-Constructive** | **Minute 35** (Diagnostic) | Use the "Predict the First Move" question. If they think they know the move, they missed the point of the arbitrary move. |

  ### Why This Order?
  1.  **Assumptions First:** If you do the proof first, students treat all assumptions as a single block of "math rules." By auditing them *before*, they know which levers to pull when you ask "What if we change this rule?"
  2.  **Crisis Point Emphasis:** The "occupied square" moment is where the logic is most fragile. If you rush this, students think the proof is magic. Slowing down here makes the **Monotonicity** assumption concrete.
  3.  **Diagnostic Before Dismissal:** Ask the diagnostic question *before* you tell them what you won't cover. If you tell them "We won't find the strategy" first, they will answer the diagnostic correctly by rote. Ask the question to test their intuition, *then* validate it with the scope boundaries.

  ### One Final Note for the TA
  Your students' feedback last year suggests they leave feeling "smart" but ungrounded. They feel they know a trick. Your job is to make them feel the **limitations** of the trick.
  *   Don't let them leave thinking Strategy Stealing is a way to *win games*.
  *   Make sure they leave knowing it is a way to *classify games*.
  *   If they ask, "So how *do* I win Hex?" Your answer must be consistent: "I don't know. Nobody knows. But I know *you* can win if you go first." That tension is where the learning lives.
