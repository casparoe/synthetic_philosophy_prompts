prompt: |-
  I'm a third-year student and I TA a fifty-minute problem section for an introductory game theory course, and next week is the first time we get to the strategy-stealing argument. My students have a year of discrete mathematics and propositional logic but no game theory, and last year's post-section feedback makes it clear that this is the one result they leave the room feeling like they understand while actually missing the parts that make it worth teaching. So please don't explain the argument to me; plan how I should explain it. I need the order in which the pieces have to go in and why — in particular, which of the standing assumptions (finiteness, perfect information, two players, zero-sum, no draws possible) are actually load-bearing for the argument and which are just hygiene, because I don't think the students will see the difference on their own. I need the single game that should carry the whole thing and what it must have and lack: I keep reaching for tic-tac-toe, but I'm increasingly sure it's a poor anchor, partly because it is a draw under perfect play and I don't want to open with a game whose honest conclusion is that nobody can force a win, and partly because it is small enough that students can just inspect the whole position and the argument stops feeling like it is doing any work. I need the misconceptions the students will form and the exact point in the sequence where each should be headed off — specifically, I'm worried they will (i) take the argument to hand them the actual winning strategy rather than merely guarantee that one exists, (ii) read it as proving the first player wins when all it establishes is that the first player cannot lose, and (iii) treat the step where the first player makes an arbitrary extra move as a triviality, when that is the one place where the whole proof lives and can quietly break. And I need one question I can ask at the end that would tell me whether they have actually absorbed the non-constructiveness rather than just being able to recite the proof, plus what I should openly refuse to cover in fifty minutes and say so.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Third-year student TA for an introductory Game Theory course.
      *   **Task:** Plan a 50-minute problem section on the Strategy-Stealing Argument.
      *   **Audience:** Students with discrete math/logic background, no prior game theory.
      *   **Problem:** Past feedback shows students *think* they understand but miss the nuance (non-constructive nature, specific assumptions).
      *   **Constraints/Needs:**
          *   Do *not* explain the argument to the TA (they know it).
          *   Provide the *order* of pieces and *why*.
          *   Identify load-bearing vs. hygiene assumptions (finiteness, perfect info, 2 players, zero-sum, no draws).
          *   Select the *single game* to anchor the lesson (Tic-Tac-Toe is explicitly rejected by the TA for good reasons).
          *   Address specific misconceptions: (i) constructive vs. non-constructive, (ii) P1 wins vs. P1 doesn't lose, (iii) the "extra move" triviality.
          *   Provide one diagnostic question for non-constructiveness.
          *   Specify what to explicitly *exclude* from the 50 minutes.

  2.  **Deconstruct the Strategy-Stealing Argument:**
      *   *Core Logic:* Assume P2 has a winning strategy. P1 makes an arbitrary move, then pretends to be P2 using P2's strategy. If the strategy calls for playing on the occupied square, P1 makes another arbitrary move. Since having an extra piece on the board is never a disadvantage (monotonicity), P1 wins. Contradiction. Therefore, P2 cannot have a winning strategy.
      *   *Key Assumptions:*
          *   Symmetry (usually): The board/actions available to P1 and P2 are effectively the same.
          *   Monotonicity (The "Extra Move" Property): Having an extra piece/mark on the board is never a disadvantage. This is crucial.
          *   No Draws (for "P1 wins" conclusion): If draws are possible, the argument only proves "P1 doesn't lose" (Win or Draw).
          *   Perfect Information/Finite/Two Players: Standard for this type of combinatorial game analysis (Zermelo's theorem context).
      *   *The "Trap":* It proves existence, not construction. It proves P1 *can* force a win (or draw), not *how*.

  3.  **Select the Anchor Game:**
      *   *Tic-Tac-Toe:* Rejected by TA. (Drawish, solvable by brute force).
      *   *Chess/Go:* Too complex, draw possibilities muddy the water, monotonicity doesn't hold (having an extra piece on the board isn't always good in Go/Chess due to liberties/capture rules).
      *   *Hex:* The classic example.
          *   *Pros:* No draws (Brouwer fixed point theorem connection, but can be taken as axiom for this level), Monotonicity holds (extra stone never hurts connection), Symmetry holds.
          *   *Cons:* Board can be large, hard to visualize winning paths quickly.
          *   *Verdict:* **Hex** is the standard for a reason. It fits all criteria. It avoids the draw issue of Tic-Tac-Toe. It avoids the brute-force solvability of small games.
      *   *Chomp:* Another strong candidate.
          *   *Pros:* Very simple rules, monotonicity is obvious (eating more chocolate is always better), no draws.
          *   *Cons:* The "poisoned square" ending can be slightly confusing regarding who makes the last move (normal vs. misère play), though standard Chomp is normal play.
          *   *Comparison:* Hex is visually more intuitive for "connecting," but Chomp is algebraically cleaner for "extra move." However, Hex is the canonical example for Strategy Stealing in most textbooks for a reason: the geometry makes the "extra piece never hurts" intuition very strong. Let's stick with **Hex** (specifically an $n \times n$ board) because the "no draw" property is a famous theorem itself, reinforcing the "no draw" assumption discussion. Actually, **Chomp** might be better for the "extra move" intuition. In Hex, does an extra stone *never* hurt? Yes, because you just ignore it. In Chomp, does an extra bite *never* hurt? Yes.
          *   *Decision:* **Hex** is generally preferred for Strategy Stealing because the symmetry is more obvious (P1 and P2 have identical goals relative to their sides). In Chomp, the rectangular asymmetry can sometimes distract. Let's go with **Hex** on a generic $n \times n$ board. It forces the "non-constructive" point harder because nobody knows the winning strategy for $11 \times 11$ Hex.

  4.  **Structure the 50 Minutes:**
      *   *0-5 min:* Setup & Game Rules (Hex).
      *   *5-15 min:* The Assumptions Audit (Hygiene vs. Load-Bearing).
      *   *15-30 min:* The Proof Walkthrough (focusing on the "Extra Move").
      *   *30-40 min:* Misconception Interception (Constructive vs. Non-Constructive, Win vs. Not-Lose).
      *   *40-45 min:* Diagnostic Question.
      *   *45-50 min:* Scope Boundaries (What we aren't doing).

  5.  **Drafting the Content - Section by Section:**

      *   **The Game:** Hex. Why? No draws (load-bearing), Monotonicity holds (load-bearing), Symmetry (load-bearing).
      *   **Assumptions:**
          *   *Hygiene:* Finite (needed for Zermelo context, but SS works on infinite too if well-ordered), Perfect Info (needed to define strategy), Two Players (definition of the argument).
          *   *Load-Bearing:* **Symmetry** (P1 and P2 have same moves available initially), **Monotonicity** (Extra piece $\neq$ disadvantage), **No Draws** (to conclude P1 Win vs P1 Not-Lose).
      *   **Misconceptions:**
          *   (i) *Constructive:* Address immediately after the proof. "Do we know *where* P1 moves?" No.
          *   (ii) *Win vs. Not-Lose:* Tie this to the "No Draw" assumption. If draws allowed, result changes.
          *   (iii) *Extra Move:* This needs a specific visual or logical beat. "What if the strategy says play on the square I already occupy?"
      *   **Diagnostic Question:** Needs to test if they understand the *lack* of information. "If I give you a 100x100 Hex board, can you write down the first move?"
      *   **Exclusions:** Don't compute the strategy. Don't prove Hex has no draws (take as given). Don't discuss infinite games.

  6.  **Refining the Flow (Self-Correction/Polishing):**
      *   *Critique:* Is 5 minutes enough for Hex rules? Yes, keep it high level. "Connect your sides."
      *   *Critique:* The "Extra Move" step is the hardest. I need to make sure the TA emphasizes the *mapping* of strategies. P1 pretends to be P2.
      *   *Critique:* The assumptions need to be introduced *before* the proof so students know what to watch for.
      *   *Critique:* The TA specifically asked about the order. I need to be prescriptive about the sequence.
      *   *Refinement on Assumptions:* Distinguish between "Zermelo Assumptions" (Finite, Perfect Info, 2-player, Zero-sum) which guarantee *some* value exists, and "Strategy Stealing Assumptions" (Symmetry, Monotonicity, No-Draw) which allow *this specific argument* to assign the value to P1.
      *   *Refinement on Game:* Actually, **Chomp** is often better for the "extra move" intuition because the board shrinks. In Hex, you add pieces. In Chomp, you remove. Strategy stealing works on both. But Hex is the classic "P1 wins" example. Let's stick with Hex but emphasize the "Extra Stone is never a disadvantage" axiom clearly.
      *   *Wait, one nuance:* The prompt asks about "Zero-sum." Strategy stealing applies to zero-sum (win/loss), but the core is really about the *value* of the game.
      *   *Addressing the "Extra Move" Triviality:* I need to suggest a specific moment where the TA pauses and asks, "Why is this legal?"

  7.  **Finalizing the Plan:**
      *   **Game:** Hex (on $n \times n$, $n \ge 2$).
      *   **Sequence:**
          1.  Define Hex & Assumptions (The Setup).
          2.  The Contradiction Hypothesis (Assume P2 wins).
          3.  The Theft (P1's arbitrary move + copying).
          4.  The Crisis (The occupied square) & Resolution (The extra move).
          5.  The Conclusion (Existence vs. Construction).
      *   **Misconception Timing:**
          *   (iii) Extra Move: During step 4.
          *   (ii) Win vs. Not-Lose: During step 5 (link to No-Draw assumption).
          *   (i) Constructive: Post-proof discussion.
      *   **Diagnostic:** "Play the first move."
      *   **Exclusions:** Finding the actual strategy, Proving no-draws in Hex.

  8.  **Review against Constraints:**
      *   Don't explain the argument to TA? Check.
      *   Order and Why? Check.
      *   Load-bearing vs. Hygiene? Check.
      *   Single Game? Hex.
      *   Misconceptions & Timing? Check.
      *   Diagnostic Question? Check.
      *   What to refuse to cover? Check.

  9.  **Final Polish:** Ensure tone is supportive but rigorous, matching a TA-to-TA advice style. (Self-correction: Ensure I explicitly distinguish between the assumptions required for *determinacy* vs. the assumptions required for *strategy stealing*).

      *   *Determinacy (Hygiene):* Finite, Perfect Info, 2-Player. (Ensures game has a value).
      *   *Strategy Stealing (Load-Bearing):* Symmetry, Monotonicity (Extra move $\ge$ 0), No Draws (for strict Win).
      *   *Wait, Zero-Sum?* Strategy stealing implies zero-sum in the sense that one wins/loses, but the critical part is the *monotonicity*. I should clarify that.

