answer: |-
  Elena lives next to Mr. Henderson, an elderly neighbor whose physical frailty is constant but who fiercely values his independence, refusing formal care or family intervention. Every Tuesday for three years, Elena has knocked on his door to offer a ride to the grocery store, a task taking forty minutes and costing her little in fuel or time. She has never promised to return, accepted no payment, and assumed no formal role; each Tuesday, she was free to stay home without Mr. Henderson suffering any immediate crisis, as he always had pantry reserves. However, solely through the rhythm of her repeated, gratuitous arrivals, Mr. Henderson has restructured his life around this window: he delays medication refills and social contact until Tuesday, relying on the trip for essentials and human connection. While his underlying need for transport has not worsened, Elena's established pattern has transformed her absence from a mere disappointment into a harmful abandonment; if she stops now without tapering, he will miss critical doses and suffer isolation-induced depression. At $t_1$, omitting the ride was blameless; at $t_{156}$, omitting it constitutes a moral wrong, not because his health declined, but because her prior optional acts created a dependency that makes withdrawal harmful.

  **Analysis of Accounts**

  **(i) Standard Token-Level Account:** This account evaluates each act in isolation based on its deontic status at the time of performance. For the early steps ($t_1$ to $t_{50}$), the act is permitted, omissible without blame, and praiseworthy; thus, the verdict is **Supererogatory**. However, by $t_{156}$, the context has shifted: due to the reliance generated, omitting the act now causes harm that violates a negative duty not to abandon. Since the act is no longer omissible without blame, the verdict for the final steps is **Obligatory**. This account captures the shift but fractures the moral identity of the action over time.

  **(ii) Course-of-Action Account:** This account evaluates the temporally extended sequence as a single unit, asking whether the *project* of aiding Mr. Henderson could have been omitted without blame. At the point of initiation, the entire sequence was omissible; Elena owed nothing and undertook a burden voluntarily. Although she cannot now abandon the sequence without blame, the moral status of the *sequence itself* is determined by the voluntariness of its uptake. The verdict is **Supererogatory**. This is the correct view: the project remains a gift she gave, even if the terms of that gift now bind her to see it through responsibly; the duty is to *exit* gracefully, not a retroactive duty to have *entered*.

  **(iii) Sacrifice Condition:** This account requires that an act incur significant cost to the agent to qualify as supererogatory; otherwise, it is merely a favor. Since each individual trip costs Elena only forty minutes and negligible fuel, no single step meets the threshold of "significant sacrifice." The verdict is **Not Supererogatory** for every step; they are all routine favors. This account fails to capture the moral weight of the sequence, as it atomizes the cost and ignores that the *cumulative* sacrifice over three years is substantial, leaving it unable to explain why stopping now is blameworthy while starting was praiseworthy.

  **Closing**

  The single feature doing the normative work is **reliance generated through repetition without explicit commitment**. If this feature is removed—for instance, if Mr. Henderson never adjusted his schedule to expect her—the case collapses back into an ordinary instance of supererogation where Elena remains free to stop at any point without blame, preserving the S-status throughout. The strongest attack comes from the **Sacrifice Condition** theorist, who would press: "You are illicitly aggregating costs to manufacture a duty where none exists. If no individual act demands significant sacrifice, none triggers the special normative category of the supererogatory; by calling this S, you dilute the concept to cover mere consistency, confusing the accumulation of small kindnesses with the moral gravity of genuine sacrifice."
