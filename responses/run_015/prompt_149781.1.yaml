      *   *Wait, looking closer:* If I use AI Timelines as the *target*, I need two reference classes. Class A: "Computing Hardware Trends" (Moore's). Class B: "Strategic Technology Rollouts" (Nuclear).
      *   *The Prompt asks:* "anchor the session in forecasting AI capability timelines by analogizing to Moore's Law versus analogizing to nuclear-weapons development."
      *   *Okay, I will argue that the **Nuclear** analogy is the necessary component to make the problem visible.* Using *only* Moore's Law hides the RCP (looks like curve fitting). Using the *tension* between Moore's and Nuclear reveals it.
      *   *Actually, strict reading:* "Specify which one actually works." I should pick one as the *primary* anchor.
      *   *Decision:* I will advise anchoring on **Nuclear Weapons Development**.
