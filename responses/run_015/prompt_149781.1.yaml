answer: |-
  # Teaching Plan: The Reference Class Problem
  **Target Audience:** Technically literate non-philosophers (e.g., rationalist community).
  **Duration:** 45 Minutes.
  **Goal:** Shift understanding of probability from "degree of belief based on data" to "degree of belief based on ontological classification."

  ## 1. Dependency Order: Inside/Outside View First
  **Sequence:** Frame the **Inside/Outside View distinction** *before* introducing structural underdetermination.

  **Rationale:**
  *   **Pedagogical Hook:** Your audience already accepts "take the outside view" as a heuristic for debiasing optimism (Kahneman/Lovallo, Tetlock). This establishes immediate buy-in.
  *   **The Trap:** If you start with structural underdetermination (philosophy), it feels abstract. If you start with the heuristic (practice), you can demonstrate its failure mode.
  *   **The Pivot:** Once they agree they *should* take the outside view, you ask: "Which outside view?" This reveals the underdetermination not as a philosophical puzzle, but as a practical forecasting error.

  ## 2. Carrying Example: Nuclear Weapons Development
  **Decision:** Anchor the session on **Nuclear Weapons Development**, *not* Moore's Law.

  **Why Nuclear Works:**
  *   **Property Required (Discrete Event):** RCP is sharpest on binary outcomes (success/failure, by date X/not by date X). Nuclear development is a discrete milestone (first detonation/capability).
  *   **Property Required (Ambiguous Similarity):** The event must validly belong to multiple classes with different base rates.
      *   *Class A:* "Wartime Crash Programs" (e.g., Manhattan Project, V2). Base rate: Fast (3–5 years).
      *   *Class B:* "Dual-Use General Technologies" (e.g., Electricity, Aviation). Base rate: Slow diffusion (decades).
      *   *Class C:* "Physics Breakthroughs." Base rate: Highly variable.
  *   **Visibility:** The choice between Class A and Class B changes the probability drastically, yet both descriptions are factually accurate. This makes the *selection* the variable, not the data.

  **Why Moore's Law Fails:**
  *   **The Data Trap:** Moore's Law invites curve-fitting (regression analysis). Audience members will argue about exponents, saturation points, or economic incentives.
  *   **Ontological Invisibility:** This reduces the problem to "we need more data points to fit the line better." It hides the RCP because it looks like a parameter estimation problem, not a class-selection problem.
  *   **Determinism Bias:** It is often treated as a physical/economic law rather than a historical reference class, implying the trend *is* the mechanism, which bypasses the need for classification.

  ## 3. Session Sequence & Misconception Management

  ### Phase 1: The Hook (0:00 – 0:10)
  *   **Activity:** Quick poll on AI AGI timelines. Ask for Inside View reasoning (architecture, compute, algorithms).
  *   **Intervention:** Introduce the "Outside View" correction. Ask them to generate a base rate.
  *   **Misconception Head-off (Expertise):** *Do not address yet.* Let them feel confident that expertise informs the Inside View, and statistics inform the Outside View. We will break this later.

  ### Phase 2: The Conflict (0:10 – 0:25)
  *   **Activity:** Apply the Outside View to AI Timelines using the **Nuclear Analogy**.
      *   *Scenario:* "Is AI more like the Manhattan Project (crash program to specific threshold) or the Electrification of America (infrastructure rollout)?"
      *   *Result:* Show that Manhattan implies ~5 years; Electrification implies ~50 years.
  *   **Core Concept:** Reveal **Structural Underdetermination**. There is no statistical test to determine which class is "correct." Both are true descriptions.
  *   **Misconception Head-off (Finer-Grained Classes):** *Address immediately here.*
      *   *The Trap:* Audience will suggest: "Just make the class more specific: 'Digital Crash Programs for Cognitive Tech'."
      *   *The Counter:* Show that narrowing the class reduces $N$ (sample size) to zero or one. If $N=1$, you are back to the Inside View. The problem is not granularity; it is that *every* description selects a different class.

  ### Phase 3: The Formal Illusion (0:25 – 0:35)
  *   **Activity:** Attempt to solve via Bayes' Rule.
  *   **Misconception Head-off (Bayes/Flat Prior):** *Address here.*
      *   *The Trap:* "Just use a flat prior over the classes and update."
      *   *The Counter:* Explain that the "set of all possible reference classes" is not well-defined. You cannot put a prior over a set you cannot enumerate. Furthermore, weighting the classes (e.g., 50% Manhattan, 50% Electrification) is itself a judgment call subject to the same RCP. Math cannot normalize an ontological ambiguity.

  ### Phase 4: The Expertise Fallacy (0:35 – 0:40)
  *   **Activity:** Revisit the Inside View.
  *   **Misconception Head-off (Domain Expertise):** *Address here.*
      *   *The Trap:* "A domain expert knows which analogy fits."
      *   *The Counter:* Expertise improves the *description* of the target (the AI), but it does not dictate the *similarity metric* to history. An expert physicist might still disagree on whether AI is fundamentally a "physics problem" or a "software problem." Expertise reduces Inside View error, not Outside View selection error.

  ### Phase 5: Diagnostic & Wrap (0:40 – 0:45)
  *   **Diagnostic Question:** (See below).
  *   **Closing:** Summarize that forecasting is not just estimating parameters, but defending ontologies.

  ## 4. Diagnostic Question
  **Question:**
  > "Imagine you are given a complete causal simulation of the AI system—you know every parameter, line of code, and hardware constraint. The simulation is deterministic. Does the Reference Class Problem disappear?"

  **Correct Grading Key:**
  *   **Incorrect (Ignorance Model):** "Yes, because we now know the outcome." (This treats probability as purely epistemic ignorance of the physical state).
  *   **Correct (Ontological Model):** "No. Because the simulation outputs a physical outcome, but it does not output its own membership in 'Software Projects' vs. 'Cognitive Revolutions.' To assign a probability *before* running the sim, you still must choose which historical class this simulation belongs to for calibration."
  *   **Why this works:** It isolates the variable. If the problem were just ignorance (lack of data), complete information would solve it. If the problem is ontology (how we carve reality), complete information leaves the classification choice intact.

  ## 5. Explicit Omissions
  **What is Left Out:**
  1.  **Formal Exchangeability (de Finetti):**
      *   *Why:* This requires measure theory and distracts from the practical forecasting failure. The audience needs to grasp the *selection* problem, not the convergence conditions of sequences.
  2.  **The Sleeping Beauty Problem:**
      *   *Why:* This introduces self-locating belief and anthropics, which conflates the RCP with indexical uncertainty. It muddies the water for a session focused on empirical forecasting.
  3.  **Reichenbach-Style Narrowing Principles:**
      *   *Why:* Reichenbach suggests using the narrowest class for which statistics are reliable. As shown in Phase 2, this often leads to $N=1$. Teaching a "solution" that fails in high-stakes unique cases (like AI) is pedagogically dangerous. It is safer to leave the problem "open" than to provide a broken tool.

  **Safety of Omission:**
  For a rationalist audience, the goal is *calibration awareness*, not *foundational completeness*. Understanding that their priors are ontological commitments is more valuable than knowing the formal conditions under which frequencies converge. These omissions prevent the session from stalling on mathematical technicalities that do not change the forecasting behavior.
