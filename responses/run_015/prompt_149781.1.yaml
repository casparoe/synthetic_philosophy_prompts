          *   *Properties needed:* The classes must be mutually exclusive in implication but mutually defensible in description. They must lack a "true" frequency.
          *   *Why Moore's fails:* It invites curve-fitting debates (data issue) rather than class-selection debates (ontology issue).

  4.  **Decision 3: Misconceptions & Sequence**
      *   *Misconception 1: Finer-grained classes solve it.* (The "Specificity" fallacy). Address immediately after showing underdetermination.
      *   *Misconception 2: Reducible to Bayes with flat prior.* (The "Math will save us" fallacy). Address when discussing how to aggregate classes.
      *   *Misconception 3: Domain expertise makes it disappear.* (The "Expert" fallacy). Address at the end, before the diagnostic.
      *   *Sequence:*
          1.  Hook (Inside/Outside).
