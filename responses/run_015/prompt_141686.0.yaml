      *Refining the "Recording Machine" analysis:* Mina thinks it proves experience exists independently of memory. Theo thinks it proves causation is what matters. Actually, this is close to the "Philosophical Zombie" argument. If the brain state is the same, is the experience the same? Science says yes. Radical philosophy says "maybe not." I should lean towards the scientific consensus here without dismissing the philosophy.
      *Refining the "3am Readout":* This is the "Dreaming vs. Dreaming that you Dreamed" distinction. If you don't remember it, did it happen? In waking life, yes (you were conscious then forgot). In sleep, maybe consciousness faded. This is a strong point for Theo.

