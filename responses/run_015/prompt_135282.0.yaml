  2.  **Deconstruct "Rational Agents Can't Agree to Disagree" (Aumann's Agreement Theorem):**
      *   *Core Theorem:* If two agents have the same priors, common knowledge of each other's posteriors, and are Bayesian updaters, their posteriors must be identical.
      *   *Implication:* If they differ, at least one assumption is violated (priors differ, not common knowledge, not Bayesian, etc.).
