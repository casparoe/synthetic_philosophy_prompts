      *(Self-Correction during drafting)*: I need to be careful about Wrinkle 1. Aumann's theorem *allows* for private information. That's the whole point. You update on your private info, get a posterior, I update on mine, get a posterior. If we *know* each other's posteriors, we should converge. The user's point is "I'm conditioning on *my reasoning being sound*." That's meta-uncertainty. If she doesn't know if my reasoning is sound, she doesn't truly know my posterior *given the total evidence available to the universe*, she just knows my *stated* posterior. But strictly speaking, Aumann requires common knowledge of the *posteriors*. If I say 75% and she says 25%, and we *both know* those numbers, the theorem says we should update. The user's nuance is that the 75% is $P(W | E_1)$ and hers is $P(W | E_2)$. If we exchange $E_1$ and $E_2$, we should converge. The user is saying $E_1$ includes "I am reliable." She can't verify that. This breaks the "common knowledge" assumption because she doesn't know the *weight* of my evidence. I will frame this as a failure of "Common Knowledge of Evidence/Reliability."

      *Refining Wrinkle 1:* Actually, the user says "I'm not sure we're putting probabilities on the same event." That's the key. If I'm estimating $P(Success | MyPlan)$ and she's estimating $P(Success | HerPlan)$, or if "Worth It" means different things, the theorem is category-error territory. I will emphasize the "Same Proposition" requirement.

      *Refining Wrinkle 2:* Communication complexity. It's not just asymptotic; it's expensive.

