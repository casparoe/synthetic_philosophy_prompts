answer: |-
  Let us call this view **Epistemic Trusteeship**. Under this framework, an advance directive is not a command issued by a persistent self to its future incarnation, nor is it a promise binding across time. It is a delegation of authority from a vulnerable beneficiary (the later self) to a trustee (the earlier self). The trustee holds authority not because they *are* the beneficiary, but because they are epistemically privileged regarding the beneficiary's interests. They know the values, history, and risk tolerance of the person the beneficiary will be. Consequently, the weight of a directive correlates with the trustee's competence to judge the situation described. A directive written by someone currently inhabiting the early stages of dementia carries more authority than one written from full health, because the former is reasoning from data while the latter is reasoning from imagination.

  Consider the standard hard case: a woman writes a directive while healthy refusing life-prolonging treatment if she develops severe dementia, based on the belief that such a life would be unbearable. Later, severely demented, she appears content, responding to music and showing no distress. Under Epistemic Trusteeship, the healthy earlier self's authority is subject to a **Defeat Condition**. Her directive was predicated on a factual claim: "Life in this state is experienced as suffering." The later self's visible contentment falsifies this claim. Therefore, the authority lapses. This implication is a feature, not a cost. It prevents the dead from tyrannizing the living based on speculative errors. The healthy self was a poor judge of the demented self's interests; the directive is voided not because the later self's happiness outweighs the earlier self's autonomy, but because the earlier self failed the epistemic conditions required to hold trusteeship.

  The obvious objection is that this collapses into a best-interests standard with extra steps. If authority hinges on prediction accuracy, why not just ask what is objectively good for the later self? The distinction lies in the burden of proof. A pure best-interests standard ignores the prior directive entirely, weighing only current welfare. Epistemic Trusteeship begins with a presumption of authority in favor of the directive. The earlier self's judgment stands *unless* demonstrably mistaken about the facts relevant to the interest. This preserves the structure of autonomy—respecting the choice as a reasoned judgment—without requiring the metaphysical fiction of identity across radical psychological change. We respect the choice because it was the best available proxy decision, not because it is intrinsically binding.

  A second objection asks: if the earlier and later selves are distinct persons (as psychological-continuity views suggest), why does the earlier self's being well-informed grant authority over another's body? Being well-informed does not normally grant authority over strangers. However, trusteeship is standard ethics for distinct entities where one cannot decide for themselves, such as guardians over wards. Authority is granted based on competence to represent interests, not identity. The earlier self is the best available candidate for this guardianship because no one else knows the beneficiary's value system as well. Information matters because it constitutes competence. If a stranger knew the beneficiary's values perfectly, they would hold similar authority; the earlier self is simply the most likely candidate to possess that knowledge.

  This epistemic framing also handles directives based on non-predictive values, such as dignity or sacredness. Someone might refuse treatment because being kept alive in a demented state is demeaning, regardless of their contentment. Is this a factual mistake? On this view, yes. Claims about dignity are claims about the nature of a life and its social meaning. If the trustee asserts, "This state is undignified," but the beneficiary inhabits it without shame and is treated with dignity by others, the factual premise is weakened. However, if the value rests on external facts—e.g., "I do not want this to be my grandchildren's memory"—the authority holds, provided the grandchildren are indeed witnessing the state. The view does not need a non-epistemic core; it treats values as claims about what constitutes a good life, which are subject to factual verification against the reality of the lived experience.

  Finally, consider directives shaped by social performance, written to spare family guilt or look virtuous. Epistemic Trusteeship has the resources to discount these. If the directive is testimony about interests, motives that corrupt judgment reduce epistemic reliability. A directive written to manage others' emotions is not a judgment about the beneficiary's welfare, and thus fails to establish trusteeship. It is treated as weak testimony, easily overridden by evidence of the later self's actual condition.

  The single premise I would least like to be forced to give up is the claim that **values rest on factual assumptions about well-being.** If values are entirely non-cognitive or immune to factual defeat, the Defeat Condition cannot apply to dignity-based directives, and the view collapses into respecting all prior commands regardless of the later self's reality.
