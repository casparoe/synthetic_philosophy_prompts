  **DRAFT HANDOUT: MENTAL CAUSATION DECISION TREE**
  **Seminar: Mind & Body**
  **Topic: Kim's Exclusion Argument**

  Hey everyone—here's a rough sketch for next week. I wanted to avoid the usual "pick your -ism" quiz because honestly, most of us hold mixed views anyway. Instead, this is a decision tree based on concrete claims. You don't need to know the jargon to follow it, just answer honestly.

  At the bottom, I've listed the "ghost branches"—combinations that don't really work or haven't been explored yet.

  ***

  ### THE TREE

  **1. Is every physical event fully caused by prior physical stuff?**
  *(i.e., If you trace the physics back, is there any gap left for something non-physical to push?)*

  *   **NO** → Go to **Leaf A** (Standard Emergentism).
      *   *(Note: If physics isn't closed, mental stuff can step in without fighting physical causes.)*
  *   **YES** → Go to **Question 2**.

  **2. Are mental properties literally the same thing as physical ones?**
  *(i.e., Is "pain" just "C-fibers firing" in the same way "water" is "H2O"?)*

  *   **YES** → **Leaf B (Reductive Physicalism)**.
      *   *(You're done. No exclusion problem because there's only one cause doing the work.)*
  *   **NO** → Go to **Question 3**.
  *   **WAIT, ARE THESE CATEGORIES REAL?** → **Leaf F (Causal Bleed)**.
      *   *(If the line between mental/physical is just pragmatic, the exclusion argument never actually starts.)*

  **3. Do you allow one effect to have two separate sufficient causes?**
  *(i.e., Can the physical cause AND the mental cause both fully bring about the action without breaking physics?)*

  *   **YES** → Go to **Question 4**.
  *   **NO** → Go to **Question 4**.
      *   *(Wait, why the same spot? Because if you say NO here, you're in the tight spot Kim loves. If you say YES, you're accepting overdetermination. Both need to explain HOW the mental matters.)*

  **4. How do you save mental causation? (The Split)**
  *(You said Physics is Closed, Mental != Physical, and now you have to explain how the mental causes anything.)*

  *   **Option A: Mental properties are real but non-competitive.**
      *(They work "through" the physical, not against it.)*
      *   → **Leaf D (Non-reductive Physicalism)**.
      *   → **Leaf E (Buffered Causation)**. *(Variant: Mental states cause physical ones only after a lag that avoids direct competition.)*
  *   **Option B: Downward causation is okay despite looking like overdetermination.**
      *(Yeah, it looks like two causes, but the mental one is the "real" driver.)*
      *   → **Leaf A (Standard Emergentism)**. *(Moved here if you accept Closure but insist on downward power.)*
  *   **Option C: You can't save it.**
      *(Physics is closed, mental isn't physical, and no double causes allowed.)*
      *   → **Leaf C (Epiphenomenalism)**.
      *   *(Mental states exist, but they don't do anything. They're just along for the ride.)*

  ***

  ### THE LEAVES (Summary)

  *   **Leaf A: Standard Emergentism**
      *   Mental properties emerge from physical ones but have their own causal power. Usually requires denying strict causal closure or accepting systematic overdetermination.
  *   **Leaf B: Reductive Physicalism**
      *   Mental states = Physical states. Problem solved by identity.
  *   **Leaf C: Epiphenomenalism**
      *   Mental states are caused by physical states but cause nothing themselves. The "ghost" has no hands.
  *   **Leaf D: Non-reductive Physicalism**
      *   Mental states depend on physical ones (supervene) but aren't identical. They cause things via "realization" without competing.
  *   **Leaf E: Buffered Causation** *(Experimental)*
      *   Mental states cause physical ones, but there's a time lag or structural buffer that prevents them from competing with the immediate physical cause. Avoids the exclusion clash by timing.
  *   **Leaf F: Causal Bleed** *(Experimental)*
      *   The distinction between "mental" and "physical" is pragmatic, not ontological. Exclusion assumes a hard line that doesn't exist.

  ***

  ### GHOST BRANCHES (Empty Combos)

  **1. Closure = YES / Identity = NO / Overdetermination = NO / Mental Efficacy = YES**
  *   **Status:** **Incoherent (without extra moves).**
  *   **Why:** This is exactly Kim's trap. If physics is closed, mental isn't physical, and there's no overdetermination, there's no room for mental causation. You end up at **Leaf C (Epiphenomenalism)** unless you take the "Non-competitive" route (Leaf D) or "Buffered" route (Leaf E). You can't just assert efficacy here without explaining the mechanism.

  **2. Closure = NO / Identity = YES**
  *   **Status:** **Hidden in Leaf B.**
  *   **Why:** If mental = physical, it doesn't really matter if physics is closed or not, because the mental *is* the physical cause. Usually, people who say Identity = Yes assume Closure = Yes, but if you deny closure while keeping identity, you're just saying physical causation isn't closed. Still Reductive Physicalism, just with weird physics.

  **3. Closure = YES / Identity = NO / Overdetermination = YES / Non-competitive = NO**
  *   **Status:** **Unexplored / Unstable.**
  *   **Why:** This is "Systematic Overdetermination." You're saying every action has two full causes (one mental, one physical) but you deny they are non-competitive (so they should fight) and you deny downward causation legitimacy. Most people think this is too coincidental to be true. If you accept overdetermination, you usually have to accept some version of **Leaf A (Emergentism)** to make it work.

  **4. Closure = NO / Identity = NO / Overdetermination = NO**
  *   **Status:** **Interactionist Dualism (Not on list).**
  *   **Why:** This is the classic Cartesian spot. Mental and physical are different, physics isn't closed, so mental causes physical stuff directly. I left this off the main leaves because we're focusing on physicalist-friendly solutions, but it's a valid combo. Fits loosely under **Leaf A** depending on how strong your emergentism is.

  ***

  *Notes for class: Don't worry if you land in a ghost branch. That usually means you need to tweak one of your answers or invent a new leaf (like Buffered or Bleed). See you Tuesday.*
