answer: |-
  Here is the field protocol based on Neurath's visual language principles, adapted for high-risk, low-literacy environments. Following the checklist, I have run the two proposed signs through the procedure.

  ### ISOTYPE Field Protocol: Visual Sign Verification

  **Step 1: Physical Grounding (The Pointing Test)**
  *   **Principle:** The symbol must function as a "protocol sentence." It must refer to a physical object or state that can be pointed to without speech.
  *   **Check:** Can a user point to the icon, then point to the actual hazard or resource in the environment, and have that match confirmed by a second user without exchanging words?
  *   **Fail State:** If the icon represents an abstract concept (e.g., "Safety," "Emergency") rather than a physical thing (e.g., "Fire," "Water"), it fails grounding.

  **Step 2: Framing Residue (The Cultural Load Test)**
  *   **Principle:** Symbols carry historical or cultural baggage that may override their physical shape.
  *   **Check:** Does the shape carry unintended meaning in this specific locale? (e.g., a shape meant to be a "tool" might resemble a sacred object or a taboo symbol).
  *   **Fail State:** If the symbol triggers a strong emotional or cultural response unrelated to the hazard (reverence, fear, humor), it has high framing residue.

  **Step 3: Indexical Drift (The Placement Test)**
  *   **Principle:** The meaning of an icon changes based on where it is placed relative to the user's path.
  *   **Check:** Does moving the sign two meters left or right change the instruction from "Avoid" to "Use"? Does placing it on a door mean "Danger Inside" or "Exit Through Here"?
  *   **Fail State:** If the icon's reference shifts based on proximity alone without a change in the image (e.g., arrow direction), it suffers from indexical drift.

  **Step 4: The Value Threshold (Procedural Stop)**
  *   **Principle:** The checklist is procedural; it cannot calculate risk tolerance.
  *   **Check:** **STOP HERE.** If the sign fails Steps 1–3 but the risk of having *no* sign is higher than the risk of a *confusing* sign, a human must make a value call.
  *   **Decision:** This is not a logic check. This is a triage decision. How much ambiguity is acceptable when the consequence is death vs. property loss? The procedure cannot answer this; the field lead must sign off.

  ***

  ### Field Evaluation: Proposal A
  **Symbol:** Flame Icon
  **Intended Meaning:** Fire Exit (Egress path to be used during a fire)
  **Placement:** Above emergency doors

  **1. Physical Grounding:** **FAIL.**
  The flame physically grounds to "Fire" (the combustion event). It does not ground to "Exit" (the path of egress). When a user points to the flame, then points to the door, the verification is ambiguous. Does the flame mean "Fire is behind this door" (Avoid) or "Use this door for Fire" (Enter)? The physical object (fire) is the hazard, not the solution. The icon cannot verify the intended action without syntax (like an arrow) or text.

  **2. Framing Residue:** **LOW.**
  Fire is generally understood as hot/dangerous across most cultural contexts. There is little cultural baggage that would make a flame symbol mean "safety" or "home" in a way that overrides the danger aspect in a disaster zone.

  **3. Indexical Drift:** **CRITICAL FAIL.**
  This is the breaking point. Placing a flame icon on a door creates immediate drift.
  *   *Context A (Storage Room):* Flame on door = "Flammables Inside" (Do Not Enter).
  *   *Context B (Exit Route):* Flame on door = "Fire Exit" (Do Enter).
  The image does not change, but the instruction reverses 180 degrees based on placement. In a panic situation, this drift is lethal.

  **4. Value Threshold:** **UNSETTLED JUDGMENT CALL.**
  The procedure flags this as a failure of grounding and drift. However, the field lead must now make the value call: Is it better to have a sign that *might* be misinterpreted, or no sign at all?
  *   *Risk:* Users might avoid the exit thinking the fire is behind the door.
  *   *Mitigation:* None available without adding arrows (which adds complexity).
  *   **Verdict:** **HARD NO / UNSETTLED.** The procedure cannot resolve the contradiction. The ambiguity is inherent to the symbol choice. Do not print unless a human lead explicitly accepts the liability of the ambiguity over the risk of invisibility. (Recommendation: Reject symbol; use running figure or push-bar icon instead).

  ***

  ### Field Evaluation: Proposal B
  **Symbol:** Skull superimposed over Water Drop
  **Intended Meaning:** Contaminated Well (Do Not Drink)
  **Placement:** Directly above well pumps

  **1. Physical Grounding:** **PASS.**
  The water drop grounds to the liquid. The skull grounds to death/biological cessation. The combination physically verifies the statement: "This water causes death." A user can point to the symbol, then the water, then mimic drinking and dying (or pointing to a sick person), and achieve intersubjective agreement.

  **2. Framing Residue:** **FLAGGED.**
  While the skull is widely recognized as danger in Western contexts, it carries different weight elsewhere. In some regions, skulls represent ancestors, protection, or spiritual power rather than immediate toxicological hazard. There is a risk the sign is interpreted as "Sacred Water" or "Ancestral Water" rather than "Poisoned Water."
  *   *Condition:* Field team must verify local semiotics of bone/death imagery before deployment.

  **3. Indexical Drift:** **PASS.**
  Placement is fixed (above the pump). The reference does not change if the sign is moved slightly left or right, provided it remains associated with the water source. It does not rely on pathing logic (like the exit sign); it relies on source identification.

  **4. Value Threshold:** **PRINT WITH CONDITIONS.**
  The procedure passes the sign on grounding and drift, but flags the cultural residue.
  *   *Decision:* The risk of death from contaminated water is immediate and high. The risk of skull misinterpretation is moderate.
  *   **Verdict:** **PRINT WITH CONDITIONS.** Proceed only after local fixers confirm the skull symbol does not denote "sacred/protected" in this specific camp demographic. If skull is taboo/sacred, replace with crossbones or rotting fruit icon. If cleared, the physical grounding is strong enough to outweigh the residue risk.
