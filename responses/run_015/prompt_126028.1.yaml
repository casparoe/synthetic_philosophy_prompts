prompt: |-
  hey so i'm consulting for this disaster-relief NGO that makes icon-only warning signs for camps where translators are scarce and literacy is all over the place. i got interesed in otto neurath's ISOTYPE idea — basically he wanted picture symbols to act like protocol sentences, physically checkable, no hidden metaphysics, intersubjective in the same way for anyone who can point at the hazard. but obviously you can't just drop 1920s philosophy into a tent in a flood zone. can you turn his picture-language principles into an actual decision checklist my field team can run on a proposed sign? i need it in order: first check physical grounding (can the user match the symbol to the actual danger without language?), then check for what i'm calling framing residue — cultural or contextual baggage that makes the same shape mean something different here — then check for indexical drift, where placing the icon near a kitchen vs a doorway changes its reference even though the image hasn't changed. flag exactly where the checklist has to stop being procedural and hand over to a human value call (like, how much ambiguity is okay when the risk is death vs property damage?). then run the checklist on two proposals: a flame symbol marking a fire exit, and a skull-over-water-drop marking a contaminated well. one should come back "print with conditions" and the other should hit either a hard no or at least an unsettled judgment call that the procedure can't resolve. please don't give me a bibliography or cite specific editions — i don't have web access and i don't need a reading list. stick to the basic neurath stuff but feel free to invent that framing-residue idea if it helps bridge the gap. also, just so you know, i keep misspelling ISOTYPE as ISOTPE in my notes, but don't worry about that unless it comes up naturally.
