answer: |-
  ## Part 1: The Questionnaire (User-Facing)

  *Instructions for the member: Answer these ten questions based on your experience in the previous community, while you were still a member. There are no right or wrong answers. Be as honest as you can about how things felt at the time.*

  1.  **Outside Voices:** While you were a member, how often did you see full, fair arguments from people who disagreed with the group's main ideas?
      *   (A) Almost never.
      *   (B) Sometimes, but they were usually presented as warnings.
      *   (C) Often, and I was encouraged to look at them.

  2.  **Reaction to Opposition:** When you did see a strong argument from the outside, what happened to your confidence in the group?
      *   (A) It didn't change; I assumed they were missing context.
      *   (B) It made me doubt the group, at least for a moment.
      *   (C) It made me angrier at the outsiders and more loyal to the group.

  3.  **Source of Distrust:** When you first started distrusting people outside the group, where did that feeling come from?
      *   (A) I figured it out myself after bad experiences.
      *   (B) I adopted it because the people I trusted most here said it was true.
      *   (C) I didn't really distrust them; I just thought they were misinformed.

  4.  **Content Flow:** Think about the links, posts, and media shared in the group. Was there more material going out to the world, or coming in from the world?
      *   (A) Mostly going out (we were spreading the word).
      *   (B) Mostly coming in (we were gathering news).
      *   (C) A balanced mix.

  5.  **The Gatekeepers:** When controversial posts or questions were removed, who decided?
      *   (A) A few specific leaders or moderators.
      *   (B) It seemed to happen automatically or by general group mood.
      *   (C) Nothing was really removed; things just got buried.

  6.  **Cost of Questions:** If a newcomer asked a basic question that challenged a core idea, what happened?
      *   (A) They were answered patiently, even if the answer was "we don't know."
      *   (B) They were told they hadn't done enough research yet.
      *   (C) They were flagged as suspicious or told they were dangerous.

  7.  **Outsider Motives:** What was the main reason given for why outsiders disagreed with you?
      *   (A) They were mistaken or lacked information.
      *   (B) They were paid to lie or had bad intentions.
      *   (C) They were sick or unaware of the truth.

  8.  **Changing Your Mind:** Could you have stated clearly in advance what evidence would make you leave the group?
      *   (A) Yes, and the group said they would accept that evidence.
      *   (B) Yes, but the group said that evidence would be faked or irrelevant.
      *   (C) No, my faith wasn't based on evidence that could change.

  9.  **Current Trust:** Right now, in this support server, how do you feel when someone offers you help or information?
      *   (A) I am cautious, but I can listen.
      *   (B) I feel a spike of suspicion that they might be manipulating me too.
      *   (C) I trust them easily.

  10. **The Bottom Line:** Looking back, do you think the group's main health or wellness claim was actually true?
      *   (A) No, it was false.
      *   (B) Yes, it was true, or at least mostly right.
      *   (C) I still don't know.

  ***

  ## Part 2: The Decision Logic (Moderator Key)

  *Use this flow to sort the user's answers into one of the seven leaves below. Start at Step 1 and follow the path.*

  **Step 1: The Residual Distrust Check**
  *   Look at **Question 9**.
  *   If the answer is **(B)** ("I feel a spike of suspicion..."): Assign **Leaf 6 (The Ghost in the Shell)**. Stop.
  *   If (A) or (C): Proceed to Step 2.

  **Step 2: The Exposure Check**
  *   Look at **Question 1** and **Question 2**.
  *   If Q1 is **(C)** ("Often") AND Q2 is **(C)** ("Made me angrier..."): Assign **Leaf 7 (The Fortress)**. Stop.
  *   If Q1 is **(A)** ("Almost never"): Proceed to Step 3.
  *   If Q1 is **(B)** ("Sometimes... warnings"): Proceed to Step 3.

  **Step 3: The Flow Check**
  *   Look at **Question 4**.
  *   If the answer is **(A)** ("Mostly going out"): Assign **Leaf 3 (The Megaphone)**. Stop.
  *   If (B) or (C): Proceed to Step 4.

  **Step 4: The Filtering Check**
  *   Look at **Question 5**, **6**, and **7**.
  *   If Q5 is **(A)** ("Few leaders") AND Q6 is **(C)** ("Flagged as suspicious") AND Q7 is **(B)** ("Paid to lie/Bad intentions"): Assign **Leaf 2 (The Poisoned Well)**. Stop.
  *   If Q5 is **(A)** or **(B)** AND Q6 is **(A)** ("Answered patiently") AND Q7 is **(A)** ("Mistaken"): Assign **Leaf 4 (The Garden)**. Stop.
  *   If mixed/unclear: Proceed to Step 5.

  **Step 5: The Omission Check**
  *   Look at **Question 1** and **Question 8**.
  *   If Q1 is **(A)** ("Almost never") AND Q8 is **(A)** or **(B)**: Assign **Leaf 1 (The Quiet Room)**. Stop.
  *   If Q1 is **(B)**: Proceed to Step 6.

  **Step 6: The Truth Check**
  *   Look at **Question 10**.
  *   If Q10 is **(B)** ("Yes, it was true"): Assign **Leaf 5 (The Lucky Bunker)**. Stop.
  *   If Q10 is **(A)** or **(C): Assign **Leaf 2 (The Poisoned Well)** (Default for harmful closure where truth is false/unknown). Stop.

  ***

  ## Part 3: The Leaves (Outcomes)

  *Each leaf includes a plain name you can share with the member, and the "awkward commitment" they must accept to move forward.*

  **1. The Quiet Room (Closed by Omission)**
  *   **Plain Name:** The Quiet Room.
  *   **Awkward Commitment:** You have to accept that you weren't tricked so much as you were simply kept in a room where no one ever knocked on the door.

  **2. The Poisoned Well (Full Discrediting)**
  *   **Plain Name:** The Poisoned Well.
  *   **Awkward Commitment:** You have to accept that your ability to tell truth from lies was borrowed from people who had a reason to keep you from checking.

  **3. The Megaphone (One-Way Valve)**
  *   **Plain Name:** The Megaphone.
  *   **Awkward Commitment:** You have to accept that your energy was used to broadcast a signal, not to receive information that might help you.

  **4. The Garden (Curated/Specialist)**
  *   **Plain Name:** The Garden.
  *   **Awkward Commitment:** You have to accept that just because a group filters information doesn't mean they are lying, but you also have to admit you might not be an expert yet.

  **5. The Lucky Bunker (Closed but Right)**
  *   **Plain Name:** The Lucky Bunker.
  *   **Awkward Commitment:** You have to accept that you can arrive at a true conclusion using a broken process, and that being right doesn't make the manipulation okay.

  **6. The Ghost in the Shell (Residual Distrust)**
  *   **Plain Name:** The Ghost in the Shell.
  *   **Awkward Commitment:** You have to accept that the group is gone, but you are still carrying their security system inside your own head.

  **7. The Fortress (Exposure Hardening)**
  *   **Plain Name:** The Fortress.
  *   **Awkward Commitment:** You have to accept that seeing the other side didn't correct you because you were using the arguments to build walls, not bridges.

  ***

  ## Part 4: Analysis of Ambiguities and Empty Sets

  ### Hard-to-Separate Pairs
  **The Garden vs. The Poisoned Well**
  *   **The Problem:** Both involve heavy filtering (Q5), both rely on internal trust, and both can look identical from the outside. A high-trust specialist group and a high-control cult both remove "noise."
  *   **Why the Tree Struggles:** The current questions rely on *hostility* (Q6, Q7) to separate them. But a polite specialist group can still be an echo chamber if the expertise is narrow.
  *   **Extra Question to Separate:** "If an outsider with verified credentials disagreed with the group, would the group invite them to speak, or ban them?" (The Garden invites; The Well bans.)

  **The Lucky Bunker vs. The Poisoned Well**
  *   **The Problem:** If the group was factually right about the health claim (Q10), the member may resist the "Poisoned Well" label because they feel vindicated.
  *   **Why the Tree Struggles:** The tree prioritizes Q10 at the end. A user might feel "I was right, so I'm not in a Well."
  *   **Extra Question to Separate:** "If the group had been wrong about the main claim, would the leaders have admitted it, or found a new reason why they were right?" (The Bunker admits error; The Well shifts goalposts.)

  ### Logically Possible but Unoccupied Combinations
  **1. The Quiet Room + The Fortress**
  *   **Combination:** Q1(A) "Almost never saw outside views" + Q2(C) "Outside views made me angrier."
  *   **Status:** **Incoherent.** You cannot be hardened by exposure you never had. If they answer this way, they are likely misremembering the frequency of exposure (Q1) or rationalizing their anger (Q2).

  **2. The Megaphone + The Garden**
  *   **Combination:** Q4(A) "Mostly going out" + Q6(A) "Newcomers answered patiently."
  *   **Status:** **Merely Unattractive.** It is possible to be a recruitment-focused group that is polite. However, in practice, high-pressure recruitment (Megaphone) rarely coexists with patience for skeptics (Garden). If this occurs, it is usually a transient phase before the group becomes more aggressive.

  **3. The Ghost in the Shell + The Garden**
  *   **Combination:** Q9(B) "Suspicious of helpers now" + Past Environment = Garden.
  *   **Status:** **Unoccupied so far.** In your specific context (leaving a harsh community), people who come from a healthy, curated environment rarely develop pathological distrust of *new* helpers. If they do, the past environment was likely not as healthy as they remember (misclassified as Garden).

  ***

  ## Part 5: Moderator Glossary (Internal Use Only)

  *Do not share these terms with members. These are for your diagnostic understanding.*

  *   **Epistemic Omission (The Quiet Room):** Information environment closed by lack of data. Fixable by exposure.
  *   **Active Discrediting (The Poisoned Well):** Information environment closed by pre-emptive immunity. Exposure reinforces belief.
  *   **Asymmetric Flow (The Megaphone):** High output, low input. Indicates a movement rather than a community.
  *   **Healthy Gatekeeping (The Garden):** Filtering based on relevance/expertise/safety, not ideological purity.
  *   **Process/Outcome Decoupling (The Lucky Bunker):** Recognizing that a true belief can be held for toxic reasons. Critical for members who feel "vindicated" by reality despite leaving the group.
  *   **Internalized Surveillance (The Ghost in the Shell):** The discrediting mechanism survives the departure. The member polices themselves and their new allies.
  *   **Backfire Effect (The Fortress):** Exposure to counter-argument strengthens prior belief due to identity threat.

  ***

  ## Part 6: Implementation Notes

  1.  **Format:** Copy Part 1 into a Google Form or Discord bot.
  2.  **Scoring:** You (the mod) run the answers through Part 2.
  3.  **Delivery:** Share the **Plain Name** and the **Awkward Commitment** from Part 3 with the member. This gives them a label for their experience without accusing them of being "brainwashed."
  4.  **Ambiguity:** If a member lands on the border of **The Garden** and **The Poisoned Well**, use the "Extra Question" listed in Part 4 to clarify before giving them a result.
  5.  **Safety:** Members who land on **The Ghost in the Shell** require the most gentle handling. They are technically "out," but functionally still under the group's control. Prioritize building slow, consistent trust over correcting facts.
