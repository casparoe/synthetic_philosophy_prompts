answer: |-
  I propose we adopt the **Volitional Integrity Principle (VIP)** as the governing framework for karma construed as normative desert. This principle asserts that moral desert is generated exclusively by the quality of the agent's will, defined by two variables: **(1) Intentional Orientation** (the moral aim of the action) and **(2) Epistemic Diligence** (the reasonable care taken to understand the consequences of one's actions). Crucially, VIP treats actual outcomes as **morally inert** regarding desert; they are evidence of the will or triggers for pragmatic repair, but they do not constitute the desert itself. Furthermore, VIP operates on a **Dual-Ledger System**: positive and negative desert accumulate on separate tracks and do not mathematically cancel one another, though they may compete for practical resolution.

  Here is how VIP accommodates your judgments, forces revision on others, and resolves the Policymaker Case.

  ### Application to Your Five Judgments

  1.  **The Fraudulent Executive:** VIP validates your intuition. The executive's *Intentional Orientation* was malicious, generating substantial negative desert. The fact that he died peacefully is irrelevant to the *verdict* of desert; it is merely a failure of cosmic or legal distribution. Under VIP, the "deficit in the moral order" you perceive is real, but it is a deficit in *enforcement*, not in the *existence* of the debt.
      *   *Clause:* Intentional Orientation + Outcome Inertia.

  2.  **The Negligent Engineer:** VIP validates this intuition strictly. Her *Epistemic Diligence* was high (rigorous checks), and her *Intentional Orientation* was neutral/benevolent. Therefore, her negative desert is zero. The catastrophic outcome is morally inert.
      *   *Clause:* Epistemic Diligence + Outcome Inertia.

  3.  **The Prestige Donor:** **VIP forces a revision here.** Your intuition is that she deserves "far less moral credit... though she may still deserve public recognition." VIP rejects the claim that she deserves *any* moral credit. Since her *Intentional Orientation* was self-serving (prestige/tax), her moral desert is zero. She may deserve *legal* tax breaks and *social* applause (pragmatic incentives), but these are not *moral* credits. To assign moral credit based on outcomes when the will is corrupt violates the symmetry required by the Engineer case (where bad outcomes without corrupt will generated no blame).
      *   *Clause:* Intentional Orientation (Revision Required).

  4.  **The Unjust War Combatant:** VIP accommodates this via a distinction in the *Locus of Volition*. The specific killing was coerced (self-defense), generating no negative desert for the act itself. However, the voluntary decision to *participate* in an unjust institution reflects a flaw in *Intentional Orientation* regarding systemic justice. Thus, she carries a burden of complicity distinct from the specific act.
      *   *Clause:* Intentional Orientation (applied to systemic participation).

  5.  **Cumulative Model vs. Rebirth:** VIP adopts the **Dual-Ledger System** (5a), affirming that good acts do not erase bad debts. Regarding 5b (undeserved suffering in rebirth), VIP clarifies that a normative theory describes *what is owed*, not *what is paid*. If a person with high positive desert suffers, the theory does not break; rather, the world has failed to honor the ledger. Your intuition that this creates a *theoretical conflict* is the error. The verdict "this suffering is undeserved" is a coherent output of the theory, not a contradiction of it.
      *   *Clause:* Dual-Ledger System + Normative/Metaphysical Distinction.

  ### Prediction for the Policymaker Case

  **Verdict:** The policymaker accumulates **negative desert proportional solely to her epistemic negligence, not the scale of the harm.**

  Under VIP, the thousands of future deaths are tragic outcomes, but they are morally inert regarding her *desert*. She did not intend the harm (Intentional Orientation is clean), but she failed in Epistemic Diligence (negligently failed to investigate). Therefore, she deserves blame and perhaps punishment, but the *magnitude* of that desert is capped by the severity of her negligence, not the magnitude of the disaster. If her negligence was minor (a reasonable oversight), her negative desert is light, even if the outcome is catastrophic. If her negligence was gross (ignoring obvious red flags), her desert is heavy. The body count does not scale the moral debt; the failure of will does.

  ### Inconsistent Intuitions Rejected

  To maintain the coherence of VIP, I explicitly reject two of your intuitive inclinations:

  1.  **The Asymmetry of Outcome (Case 2 vs. Case 3):** You hold that outcomes do not condemn the Engineer (Case 2) but partially credit the Donor (Case 3). This is inconsistent. If luck (outcome) cannot generate blame without culpable will, it cannot generate moral credit without benevolent will. I reject your intuition that the Prestige Donor deserves *any* moral credit. She deserves pragmatic rewards, but morally, she is neutral. This simplifies the theory by anchoring desert strictly to the will.
  2.  **The Expectation of Cosmic Coherence (Case 5b):** You suggest that undeserved suffering in a rebirth context creates tension with the cumulative model. I reject the intuition that this tension exists. A normative theory of desert is a metric of *justice*, not a guarantee of *fate*. Acknowledging that suffering can be genuinely undeserved is not a failure of the theory; it is the theory's primary function to identify such injustices. You must abandon the hope that a normative theory explains *why* the suffering happened (metaphysics) and accept that it only explains *whether* it was just (normativity).

  By adopting VIP, you gain a rigorous accounting system that refuses to let luck dictate moral worth, but you must accept that it renders the world more unjust than you hoped: the Prestige Donor is morally empty, and the Policymaker is not guilty of the deaths, only of the negligence.
