      *   *Clarification:* Ensure the distinction between $P(E|H)$ (likelihood of detection if they exist) and $P(H|\neg E)$ (posterior probability) is clear in the Bayesian section.
      *   *Duty Cycle:* Make sure to mention that a null result *constrains* the product of density $\times$ lifetime. It doesn't just vanish.

  9.  **Final Polish:** Check the "bring it back to the thread" advice. Give them a specific phrasing suggestion. (Proceed to generate output).

