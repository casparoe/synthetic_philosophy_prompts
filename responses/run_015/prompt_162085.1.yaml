      *   **Thesis 4: The Duty Cycle (The Lighthouse Problem).** *Focus Area.*
          *   *Claim:* Civilizations are short-lived compared to galactic age. $T_{signal} \ll T_{galaxy}$.
          *   *Analysis:* Is this "we got unlucky" or structural? It's structural uncertainty about $L$ (lifetime).
          *   *Remains:* Searching for dead beacons (Dyson spheres, pollution) changes this. If we see *nothing* (no radio, no artifacts), the constraint tightens.
          *   *Hypothesis Dependence:* Crucial. If $H$ = "Civilization within 1000 LY *now*," null result is strong evidence against. If $H$ = "Civilization existed *sometime*," null result is weak evidence.
          *   *Verdict:* True that it weakens the evidence, False that it nullifies it.
          *   *Supports Conclusion?* No. Even with low duty cycle, a null result lowers the probability of high-density/high-longevity scenarios.

      *   **Thesis 5: The Bayesian Magnitude.**
