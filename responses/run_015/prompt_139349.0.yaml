  **Purpose**

  Your dissertation seeks to bridge the genealogical and the normative. Psychological explanations typically commit the genetic fallacy, confusing the origin of a belief with its validity. To avoid this, your criteria must demand that the theory does not merely correlate psychology with politics, but demonstrates a reliable tracking relationship between intuitive mechanisms and independent moral facts. The following requirements specify the conditions under which psychological data becomes epistemic evidence.

  **Requirements**

  To transition from genealogy to epistemology, the following criteria must be met.

  1.  **Causal-role specificity** (Non-negotiable). Case: If foundations merely rationalize judgments reached via other means, the account is epistemically inert regarding truth. It must distinguish generative tracking from post-hoc filtering to support any debunking or vindication argument. Without this, you explain commitment, not correctness. A debunking argument requires showing the cause is insensitive to truth; a vindication requires showing sensitivity.
  2.  **Symmetry** (Non-negotiable). Case: Asymmetric explanation implies bias. The test: swap political labels in the model; if the explanation breaks, it is ideology, not science. This is satisfiable only if the theory separates mechanism from content. Practitioners with commitments often fail this by treating their side's intuitions as reasoning and the other's as bias. True symmetry requires acknowledging equal psychological vulnerability on both sides.
  3.  **Grain** (Non-negotiable). Case: Broad correlations (left/right) cannot adjudicate specific policy truths. The account must map foundations to specific verdicts. If correlation thins at fine grain, epistemic claims must retract proportionally. Coarse foundations cannot support fine policy claims without additional bridging premises. If the theory only predicts tribal affiliation, it cannot arbitrate policy disputes.
  4.  **Convert/Reversal** (Preference). Case: If foundations map oppositely elsewhere, universal truth claims weaken. However, local truth claims survive. Essential for universalism, optional for contextual validity. If the goal is universal moral truth, this becomes non-negotiable; otherwise, it is a constraint on generalizability. WEIRD samples often mistake local norms for universal foundations.
  5.  **Moral Change** (Non-negotiable). Case: Static parameters cannot explain dynamic moral progress. The account must specify the learning mechanism that updates foundational weights over time. Without this, the theory cannot account for historical shifts in moral consensus or explain why past intuitions are now deemed false. Stability suggests fixed bias, not learning.
  6.  **Reliability Linkage** (Non-negotiable). Added. Case: Even generative mechanisms must track reality. The theory must specify what moral facts are and how intuitions access them, not just how they motivate action. Without an ontological bridge, you explain motivation, not truth. This excludes pure expressivism. You must claim intuitions track something real.
  7.  **Independence of Tracker** (Non-negotiable). Added. Case: The mechanism must be distinct from the outcome it measures. If the definition of the foundation includes the political verdict, the theory is tautological. The psychological measure must be separable from the moral conclusion to avoid circularity. Otherwise, the theory defines the verdict into the cause.

  **Jointly unsatisfiable subsets**

  The triad of **Symmetry**, **Coarse Grain**, and **Epistemic Adjudication** is unstable. Symmetry demands the same psychological mechanism explains both sides. Epistemic Adjudication requires showing one side is more correct. If the Grain is coarse (e.g., broad foundations), the mechanism lacks the resolution to detect why one side is correct on specific issues while the other is not. You end up with symmetric skepticism: both sides are equally driven by blind intuition. To claim one side is truer, you need asymmetric reliability or fine-grained environmental tracking, violating Symmetry or Grain. Consequently, a dissertation satisfying Symmetry and Grain must abandon the goal of adjudicating truth, retreating to explaining divergence. This forces a choice: either accept symmetric skepticism or admit the theory cannot support truth claims.

  **The load-bearing requirement**

  **Causal-role specificity** is the load-bearing requirement. If the foundations merely rationalize judgments reached via other means, the psychological account is epistemically inert regarding truth. It explains commitment, not correctness. Only if the foundations are shown to be generative trackers of moral reality can they support vindication. Without this, the dissertation remains descriptive sociology, regardless of how well it satisfies Symmetry or Grain. This requirement excludes the most candidate positions because most psych models avoid ontological commitments about moral facts to maintain scientific neutrality. It forces the theory to take a metaphysical stand.

  **Scorecard**

  **Haidt's MFT:** Fails Causal-role (admits rationalization) and Symmetry (claims right sees more, implying left is blind). Good on Grain for broad tribes, bad for policy truth. It explains polarization, not correctness.
  **Morality-as-Cooperation:** Strong on Symmetry and Universality (Convert test). Fails Grain; cooperation problems are too abstract to adjudicate specific left/right policy disputes without extra assumptions. It predicts conflict, not verdicts.
  **Constructivist/Relationist:** Passes Moral Change and Grain (context-sensitive). Fails Reliability Linkage by design; rejects independent moral facts, making "truth" adjudication impossible. It explains coherence, not correctness. Only MFT attempts truth claims but fails the causal test.
