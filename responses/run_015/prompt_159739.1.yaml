      *   *Q6 (Strongest Objection/Worthwriting):* Strongest objection: Stability over time. Preferences change. Compression requires stability. If preferences evolve, the "short specification" fails over long spans. Worth writing? Yes, it's a fresh philosophical angle on model selection.

