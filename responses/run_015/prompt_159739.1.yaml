      The strongest objection you haven't considered is temporal stability. Compression assumes a static source. If preferences evolve, a static function fails to compress future choices. You need to account for learning or drift, perhaps by allowing the compression algorithm to update.

      Is it worth writing? Yes. Reframing rationality as an information-theoretic efficiency problem is fresh. It moves the debate from logical consistency to predictive utility. Just tighten the argument on functional forms and context individuation, and you will have a compelling philosophical critique.

