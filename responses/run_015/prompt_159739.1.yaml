      However, the compression framing itself is excellent. It adds significant value over ordinary rationalisability. Standard theory is binary: choices are either consistent or they aren't. Your view makes rationality graded. It asks: how much predictive power do we gain for how much descriptive complexity? This aligns with the trade-off between fit and parsimony found in model selection. It correctly identifies that perfect fit (the ledger) is overfitting. By treating utility as a lossy compression algorithm, you allow for "noise" or errors in choice, which standard theory struggles to accommodate without ad-hoc fixes.

