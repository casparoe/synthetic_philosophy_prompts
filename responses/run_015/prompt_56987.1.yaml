          *   "Distribution/Temperature": Stronger defense. If the *path* to the answer varies (stochasticity via temperature), that's not hardcoded.
          *   "Structure is the Theory": If the Slipnet *is* the theory of concepts, then the dynamics are just the engine. This concedes the constitutive point but saves the project as a theory of *semantic structure* rather than *fluid processing*.
      *   **Evaluating the Controls (The Core Analysis):**
          *   *Shuffled-slipnet:* This tests necessity of structure. If it fails, structure is necessary. It doesn't prove dynamics are irrelevant. It actually supports the Constitutive objection (structure does the heavy lifting).
