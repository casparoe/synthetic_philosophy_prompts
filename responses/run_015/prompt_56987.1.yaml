          *   *Barren-domain:* This tests domain generality. If it forces slips where none make sense, the Slipnet is too prescriptive. If it fails to operate, the architecture is domain-specific.
      *   **The Verdict:**
          *   The objection lands against the idea that Copycat generates *concepts* from scratch or is domain-general.
