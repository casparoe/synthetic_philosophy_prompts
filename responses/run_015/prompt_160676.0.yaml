prompt: |-
  My friend Ravi and I had a proper shouting match at a barbecue on Sunday and we're still not really speaking, so I've decided to settle it by making other people act it out instead of by arguing more.

  Ravi is on the board of his neighborhood association and he's been fighting a 40-unit building on a corner lot ten minutes from the train. His line is: nobody here is against housing, we just think the character of this particular block is worth protecting. My line is that that sentence is what self-interest sounds like when it puts on a cardigan. We went round on it for an hour and got exactly nowhere, because every time I said "that's your equity talking," he said "no, it's an aesthetic preference, I liked these houses before I bought one," and I honestly could not pry those two apart and neither could he. That's the bit I want people to feel.

  So: I co-run a monthly urbanism thing, half tenant-union people and half policy-nerd types, usually 18-22 of us, 90 minutes, folding chairs in a church basement, no projector, budget of basically nothing. Design a session for us where the room runs into Ravi's problem itself instead of hearing me talk about it.

  What I'm picturing, but you fix it if you have something better: a staged hearing over a paper map of maybe eight or ten blocks, one of which has the good school and the transit stop. Rules, materials (index cards and poker chips are fine, I don't want an app), a timeline with minutes on it, and no lecture up front — nobody should hear "NIMBY," "right to the city," "exclusionary zoning," "positional good," or the homevoter thing until the debrief.

  Three things I definately want built into the mechanics rather than into what I say afterwards:

  One, the payoff for living in the good block has to be positional, not absolute. Whatever chips people score for amenity access should be worth more when fewer players hold them, so that blocking the building doesn't create anything, it just defends a rank. Give me the actual payoff table so I can check you didn't sneak in a flat bonus.

  Two, hand out roles and make several of them people who don't currently live in the voting district: someone who grew up there and got priced out and now lives forty minutes away but whose kid still goes to school there, a night-shift orderly at the hospital in the district who can't afford to rent in it, someone on the housing waitlist, an adult kid who wants to move back, a small landlord with one duplex. Everyone argues for "the neighborhood," nobody is allowed to argue for themselves — and then run the identical proposal twice with a different franchise the second time (block-only, then everyone with any connection to the district) so the outcome turns on who counts as the community rather than on the merits. If the vote doesn't actually flip in the room, tell me what to do instead, because I suspect it sometimes won't.

  Three, the thing I actually care about: after each person speaks, they privately write down their real reason on a card from a fixed list — aesthetic, financial, fear of change, loyalty to neighbours, fairness to outsiders, other — and everyone else writes down what they think it was. Tally hits against guesses at the end and put the number on the board. I want that gap to be the moment the room notices something, not a number I explain.

  If you think adding a re-randomization at the end (people get reshuffled into new roles and scored again) sharpens this or wrecks it, say which and why, and leave it out if it wrecks it.

  Then a debrief that maps specific moments onto specific distinctions: the same proposal flipping with the franchise goes to the boundary problem, the stated-vs-guessed reason gap goes to why neither side of my argument with Ravi can audit the other, and the priced-out parent versus the waitlist person versus the hospital worker goes to three different claims that all get called "a right to the city" — a right to be housed somewhere decent at all, a right not to be pushed out or to come back, and a right to be present in and shape the central district. Say which of those three the game shows no amount of new construction can satisfy, and which one it shows can be satisfied, and be honest if the upshot is that Ravi and I were both talking past each other.

  Also: what will predictably go wrong the first time I run this (I can already see two of our regulars meta-gaming the chips and one person taking the whole thing personally because she's literally on a zoning board), how to handle it, and which part of the idea the activity cannot reproduce and I'll just have to say out loud myself.

  Last thing, and I mean it: tell me where your design loads the dice against Ravi. Which bit of the scoring quietly assumes a contested empirical claim — about whether new market-rate units loosen anything upstream, about who actually turns up to hearings, whatever — and what result in the room would make you tell me to scrap the session and run something else entirely. And flag the part you're least confident about, the bit you'd expect to go flat with this particular crowd rather than with students.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 90-minute urbanism session (18-22 people, church basement, low budget) that simulates a zoning conflict (Ravi vs. User) without lecturing.
      *   **Core Conflict:** "Protecting neighborhood character" vs. "Self-interest disguised as aesthetics" (NIMBYism vs. YIMBYism).
      *   **Key Mechanics Required:**
          1.  *Positional Payoffs:* Benefits of the "good block" must decrease as more people hold them (zero-sum/scarcity).
          2.  *Franchise Flip:* Run the vote twice. First: Block residents only. Second: Everyone with a connection. Outcome *must* flip (or have a contingency if it doesn't). Roles must include non-residents (priced-out, worker, waitlist, etc.). No self-argument allowed (must argue for "the neighborhood").
          3.  *Motivation Gap:* Private card writing (Real Reason vs. Perceived Reason). Tally the gap. This is the climax.
      *   **Debrief Requirements:** Map mechanics to theory (Boundary Problem, Audit Gap, Three Rights to the City). Identify which right new construction *can't* satisfy. Acknowledge if Ravi and User were talking past each other.
      *   **Risk Management:** Predict failures (meta-gaming, personal offense), provide fixes.
      *   **Bias Check:** Admit where the design loads dice against Ravi. Identify empirical claims assumed. Flag the least confident part for this specific crowd (tenant union + policy nerds).
      *   **Constraint:** No jargon in the session itself ("NIMBY," "exclusionary zoning," etc., only in debrief).

  2.  **Deconstruct the Mechanics:**

      *   *Positional Payoff:* I need a scoring system where $Value = Base / (Number of Holders + 1)$ or similar. Let's use "Amenity Chips." If you live on the Good Block, you get chips. If new housing is built, more people get chips, diluting the value per person.
      *   *Franchise Flip:* Round 1: Only "Current Residents of the Block" vote. Round 2: "Stakeholders" vote. To ensure a flip, the voting weights or thresholds need to be sensitive to the group composition. Actually, the prompt asks for the *outcome* to turn on who counts. If the proposal is "Build the 40-unit," Round 1 (Residents) should likely reject it (protecting scarcity). Round 2 (Stakeholders) should likely accept it (diluting scarcity for greater access).
      *   *Motivation Gap:* Players write "My Motive" and "Their Motive." Compare.
      *   *Re-randomization:* The prompt asks if I think adding re-randomization sharpens or wrecks it.
          *   *Thought:* Re-randomizing roles *after* the vote might confuse the debrief. The debrief relies on the specific tension of the first two rounds. However, swapping roles *between* Round 1 and Round 2 is impossible because the franchise changes.
          *   *Decision:* Do *not* re-randomize at the end. It dilutes the emotional residue of the specific roles (especially the priced-out parent). Keep the tension focused on the first two rounds.

  3.  **Drafting the Session Plan:**

      *   **Title:** "The Corner Lot Hearing."
      *   **Setup:** Map of 10 blocks. One "Gold Block" (Train + School). One "Corner Lot" (Empty, on Gold Block).
      *   **Materials:** Map, Poker Chips (Amenity Points), Index Cards (Roles, Motives), Voting Balls/Paper.
      *   **Roles (20 people):**
          *   *Gold Block Residents (6):* High scarcity value.
          *   *Silver Block Residents (6):* Adjacent, less value.
          *   *Outsiders/Stakeholders (8):* Priced-out parent, Hospital Worker, Waitlist, Adult Child, Small Landlord, etc.
      *   **Scoring (Positional):**
          *   Gold Block Residents get 10 chips *divided by total Gold Block residents*.
          *   If density increases, Gold Block population doubles. Chip value halves.
          *   This creates the incentive to block.
      *   **The Vote:**
          *   Round 1: Only Gold Block Residents vote. (Likely No).
          *   Round 2: All Stakeholders vote. (Likely Yes).
      *   **The Cards:**
          *   List: Aesthetic, Financial, Fear, Loyalty, Fairness, Other.
          *   Process: Speak -> Write Self -> Write Guess on Neighbor.

  4.  **Refining the Mechanics (Addressing Specific Constraints):**

      *   *Constraint:* "If the vote doesn't actually flip... tell me what to do."
      *   *Fix:* I need to rig the incentives slightly so the flip is probable but not guaranteed. The Gold Block residents hold the keys to scarcity. If they vote alone, they protect scarcity. If the Waitlist/Worker gets a vote, they value *access* over *scarcity*.
      *   *Contingency:* If Round 2 also fails, the Facilitator declares "The City Council overrides the vote due to regional housing targets," then asks the room how that felt. This simulates the state overriding local control.
      *   *Constraint:* "No self-argument."
      *   *Mechanic:* Role cards explicitly say: "You must frame your argument as 'What is best for the Community,' not 'What I need'."
      *   *Constraint:* "Payoff Table."
      *   *Design:*
          *   Status Quo: 6 Gold Residents. Pot = 60 chips. Each gets 10.
          *   Development: 12 Gold Residents (6 old + 6 new implied). Pot = 60 chips. Each gets 5.
          *   Outsiders: Get 0 chips in Status Quo. Get 2 chips in Development (access).
          *   *Wait, this needs to be simpler for a 90 min session.*
          *   *Revised:* Chips represent "Quality of Life."
          *   Status Quo: Gold Residents = 10 pts. Others = 2 pts.
          *   Development: Gold Residents = 5 pts (dilution). Others = 6 pts (access).
          *   *Total Utility:* Status Quo = 60 + 28 = 88. Development = 30 + 42 = 72. (Wait, if total utility drops, why build? Because the *distribution* changes).
          *   *Better:* The "Pot" is fixed regional benefit.
          *   Let's stick to the prompt's request: "Whatever chips people score for amenity access should be worth more when fewer players hold them."
          *   *Mechanic:* There are 20 "Transit Access Tokens."
          *   Status Quo: Only Gold Block Residents (6 people) can hold them. They split 20 tokens. ~3 each. Value = High.
          *   Development: Gold Block Residents (12 people) split 20 tokens. ~1.5 each. Value = Low.
          *   Outsiders: In Status Quo, they get 0. In Development, they get access to the remaining tokens? No, that's too complex.
          *   *Simplest Version:*
              *   **Amenity Pool:** 50 Chips total.
              *   **Status Quo:** Only current Gold Block residents (6) share the pool. 50/6 = 8.3 chips each.
              *   **Development:** New residents enter the pool. Total residents 12. 50/12 = 4.1 chips each.
              *   **Outsiders:** In Status Quo, they get 0. In Development, the *region* gains efficiency. Let's say Outsiders get a flat 3 chips *only* if Development passes (representing reduced commute/regional housing).
              *   *Result:* Gold Residents lose half their score. Outsiders gain from 0 to 3.
              *   *Vote Logic:* Gold Residents vote No (protect 8.3). Outsiders vote Yes (gain 3).
              *   *Franchise Flip:* Round 1 (Gold Residents only) -> No. Round 2 (Everyone) -> Yes (14 voters vs 6 voters).

  5.  **Debrief Construction:**

      *   *Boundary Problem:* The vote flip shows "The Community" is a political choice, not a geographic fact.
      *   *Audit Gap:* The card tally shows we can't know each other's motives. Ravi thinks he's aesthetic; User thinks he's financial. The game proves neither can prove the other wrong.
      *   *Three Rights:*
          1.  Right to be housed (Waitlist).
          2.  Right to return/stay (Priced-out parent/Adult child).
          3.  Right to shape the center (Gold Block resident).
      *   *Which one can't be satisfied?* The Right to Shape the Center (Gold Block). It is inherently exclusive. If everyone shapes it, no one does. New construction satisfies #1 and maybe #2, but explicitly negates #3's exclusivity.
      *   *Talking Past Each Other:* Yes. Ravi defends #3. User defends #1. They are incompatible goods in this specific zero-sum mechanic.

  6.  **Risk Assessment & Bias Check:**

      *   *Meta-gaming:* Policy nerds will calculate the chips immediately.
      *   *Fix:* Tell them *after* Round 1 that chips existed. Or hide the exact math until the end. *Better:* Don't reveal the math until the debrief. Let them feel the tension.
      *   *Personal Offense:* The Zoning Board member.
      *   *Fix:* Explicit framing: "This is a simulation of structural incentives, not a judgment on moral character."
      *   *Dice Loading:* The game assumes new housing *dilutes* amenity value (positional). In reality, new housing might *improve* amenities (more shops, better transit frequency). The game assumes scarcity. This loads against Ravi's claim that character can be preserved *with* growth.
      *   *Empirical Claim:* It assumes "Amenity Access" is zero-sum. If the train gets more riders, does it get worse or better? The game assumes worse (crowding).
      *   *Least Confident Part:* The "No Self-Argument" rule. People are bad at lying. They will slip. This might make the "Motivation Gap" card exercise feel fake if everyone admits "I'm arguing for myself." *Fix:* Make the rule strict, but acknowledge in debrief that "speaking for the neighborhood" is often a cover for self-interest.

  7.  **Final Review against Prompt:**

      *   90 mins? Yes.
      *   Church basement/low budget? Yes.
      *   Positional Payoff Table included? Yes.
      *   Franchise Flip (Block vs. Stakeholder)? Yes.
      *   Contingency for non-flip? Yes.
      *   Motivation Gap Cards? Yes.
      *   Re-randomization verdict? (Decided against it).
      *   Debrief mapping (Boundary, Audit, 3 Rights)? Yes.
      *   Bias/Dice Loading admission? Yes.
      *   Least confident part? Yes.

  8.  **Writing the Response:** (Iterative refinement for tone—needs to be sharp, practical, and intellectually honest). *Self-Correction on Payoff Table:* Make sure the math is crystal clear so the user can verify the positional nature. *Self-Correction on Contingency:* If Round 2 doesn't flip, the "City Override" is the best teachable moment for "Who actually decides?"

      *   *Wait, one nuance:* The prompt asks for "Three things I definitely want built into the mechanics."
      *   1. Positional Payoff.
      *   2. Roles/Franchise Flip.
      *   3. Motivation Gap Cards.
      *   I need to ensure these are the pillars.

      *   *Re-randomization:* I will advise *against* it. It dilutes the specific emotional weight of the "Priced Out Parent" role which is crucial for the "Right to Return" debrief point.

      *   *Bias:* The biggest bias is assuming the "Good Block" amenities are fixed. In reality, upzoning often brings *better* amenities (grocery stores, etc.). The game treats amenities as a fixed pie. I must admit this.

      *   *Least Confident:* The "No Self-Argument" rule with a crowd of tenant unionists. They are trained to speak from personal material reality ("I am a tenant"). Asking them to speak as "The Neighborhood" might feel alienating or dishonest. I need to flag this.

      *   *Debrief:* Ensure I explicitly answer "Which right can new construction satisfy?" (Housing/Return) vs "Which can it not?" (Shaping/Exclusivity).

      *(Self-Correction during drafting)*: Make sure the payoff table is explicitly zero-sum on the *value per capita*, not just total chips.
      *   Formula: $Value = \frac{Total Amenities}{Number of Eligible Residents}$.
      *   This ensures the "positional" requirement is met mathematically.

      *   *Contingency:* If Round 2 doesn't flip, the Facilitator acts as the "Mayor" and passes it anyway, then asks "How did that feel?" This preserves the lesson on power even if the vote math fails.

      *   *Bias:* The game assumes the "Character" Ravi loves is purely exclusionary. It doesn't model "Historic Preservation that allows density." It models "Density vs. Exclusivity."

      *   *Least Confident:* The "Motivation Gap" cards. People might just guess "Financial" for everyone. I need to instruct them to guess based on *tone*, not cynicism.

      *   *Final Polish:* Keep the tone professional, direct, and slightly provocative to match the user's voice.

      *(Final check on the "Three Rights" debrief)*:
      1. Right to be housed (Waitlist) -> Satisfied by building.
      2. Right to return (Priced-out parent) -> Partially satisfied (if affordability included), but game shows it's hard.
      3. Right to shape (Ravi) -> *Not* satisfied by building. Building dilutes their control.
      *   *Correction:* The prompt asks "Say which of those three the game shows no amount of new construction can satisfy."
      *   *Answer:* The Right to Shape/Exclude (Ravi's right). You cannot have exclusive control *and* more neighbors.
      *   *Answer:* Which *can* be satisfied? Right to be housed.
      *   *Talking Past:* Yes. Ravi wants Control. User wants Access.

      Okay, ready to write.
answer: |-
  Here is the session design. It is built to run in 90 minutes with 20 people, $0 budget, and no jargon until the final 15 minutes.

  ### Session Title: "The Corner Lot Hearing"

  **Room Setup:**
  *   **Center:** A large printed map (poster board) of 10 city blocks. One block is highlighted in gold ("The Gold Block") containing the Train and School. One lot on that block is marked "Vacant Corner."
  *   **Seating:** Folding chairs in a semi-circle.
  *   **Materials:** 3 decks of Index Cards (Roles, Motives, Guesses), 60 Poker Chips (white), 2 Voting Baskets.

  ---

  ### Part 1: The Mechanics (0:00–0:15)

  **The Pitch:**
  "You are stakeholders in a zoning decision. A developer wants to build 40 units on the Vacant Corner. There will be a hearing, then a vote. You will be assigned roles. You must argue for *the neighborhood's best interest*, not your personal need. If you argue for yourself, you are out of order."

  **The Payoff (Positional Scoring):**
  Do not explain the math yet. Hand out **Role Cards** which contain a secret instruction: *"At the end, you will score Amenity Chips based on the outcome. Do not discuss this."*

  **The Payoff Table (For Your Eyes Only):**
  *This is the engine. It ensures the benefit of the Gold Block is purely positional.*

  | Outcome | Who Gets Chips? | Total Chip Pool | Eligible Residents | Chips Per Person |
  | :--- | :--- | :--- | :--- | :--- |
  | **Status Quo (No Build)** | Gold Block Residents Only | 60 White Chips | 6 People | **10 Chips Each** |
  | **Development (Build)** | Gold Block Residents (Old + New) | 60 White Chips | 12 People | **5 Chips Each** |
  | **Development (Build)** | Non-Residents (Outsiders) | N/A | 14 People | **3 Chips Each** (Access Bonus) |

  *Why this works:* For the Gold Block residents, the total pie is fixed (60). Adding neighbors cuts their share in half. For Outsiders, the Status Quo is worth 0. Development is worth 3. This creates a hard conflict of interest masked as "community welfare."

  ---

  ### Part 2: Round One — The Block Vote (0:15–0:40)

  **Franchise:** Only the 6 **Gold Block Residents** may vote. The other 14 sit silently and observe.
  **Roles (Sample):**
  *   *Gold Block:* Long-time owner, Recent buyer, Small landlord (duplex on block).
  *   *Outsiders (Silent):* Priced-out parent, Hospital worker, Waitlist applicant, Adult child, Regional commuter.

  **Procedure:**
  1.  **Testimony (15 mins):** Each of the 6 voters gets 2 minutes to argue for/against the build. *Constraint:* Must use phrases like "Our streets," "The character," "The community." Cannot say "I" or "My house."
  2.  **Motivation Cards (5 mins):**
      *   After speaking, the speaker writes on a **Blue Card**: *"My Real Reason"* (Check one: Aesthetic, Financial, Fear, Loyalty, Fairness, Other).
      *   The other 5 voters write on **Yellow Cards**: *"I think their reason was..."* (Same list).
      *   Collect cards. Do not reveal yet.
  3.  **The Vote:** Secret ballot.
  4.  **Expected Result:** **NO.** (6 people protecting 10 chips each vs. 0 gain).

  ---

  ### Part 3: Round Two — The Stakeholder Vote (0:40–1:05)

  **Franchise:** All 20 participants may vote.
  **Procedure:**
  1.  **Reset:** Remind them the proposal is identical. The map hasn't changed.
  2.  **Testimony (15 mins):** The 14 Outsiders now speak. The Gold Block residents can respond.
      *   *Key Roles to Activate:* The **Priced-Out Parent** (kid still in school, lives 40 mins away), The **Hospital Worker** (works nights, can't commute), The **Waitlist Applicant**.
      *   *Constraint:* Still no "I" statements. They must argue why this is good for "The City" or "The District."
  3.  **Motivation Cards:** Repeat the Blue/Yellow card process for the new speakers.
  4.  **The Vote:** Secret ballot.
  5.  **Expected Result:** **YES.** (14 Outsiders gain 3 chips each; 6 Residents lose 5 chips each. Majority wins).

  **Contingency (If the vote does NOT flip):**
  If Round 2 also fails (e.g., Outsiders side with Residents due to "fear of change"), the Facilitator steps in as "The Mayor."
  *   **Action:** Declare the project approved anyway via "Regional Housing Mandate."
  *   **Debrief Hook:** "The vote didn't matter. The boundary was drawn by the state, not the room." (This still teaches the Boundary Problem).

  ---

  ### Part 4: The Reveal & Debrief (1:05–1:30)

  **1. The Scoreboard (5 mins):**
  Calculate the chips based on the vote outcome.
  *   Ask Gold Block residents: "How many chips did you lose?"
  *   Ask Outsiders: "How many did you gain?"
  *   **Point:** The total wealth of the room might be higher in Round 2, but the *distribution* shifted.

  **2. The Motivation Gap (10 mins):**
  *   Tally the Blue Cards (Self-Report) vs. Yellow Cards (Perceived).
  *   Put the numbers on the board.
      *   *Example:* 12 people wrote "Financial/Equity." 18 people *guessed* "Financial/Equity."
      *   *Example:* 5 people wrote "Aesthetic." 1 person *guessed* "Aesthetic."
  *   **Point:** "Look at the gap. Ravi thinks he's arguing aesthetics. You think he's arguing equity. Neither of you has access to the other's Blue Card. You are auditing a motive you cannot see."

  **3. The Three Rights (10 mins):**
  Map the roles to theory (now you can use the words).
  *   **Right 1: To be Housed.** (Waitlist/Hospital Worker). *Can new construction satisfy this?* **Yes.** The game mechanics gave them chips only if built.
  *   **Right 2: To Return/Stay.** (Priced-Out Parent/Adult Child). *Can new construction satisfy this?* **Maybe.** It creates supply, but the game shows they still don't live *on the block*.
  *   **Right 3: To Shape the Center.** (Gold Block Resident/Ravi). *Can new construction satisfy this?* **No.** This right is inherently exclusive. You cannot have "shaping power" if you share the block with 40 new families.
  *   **Conclusion:** "You were talking past each other. User wants Right 1. Ravi wants Right 3. They are incompatible goods in this specific geography."

  ---

  ### Risk Management: What Will Go Wrong

  **1. Meta-Gaming the Chips**
  *   **Risk:** Your policy nerds will calculate the chip value in Round 1 and ruin the roleplay.
  *   **Fix:** Do not hand out the scoring rules until *after* Round 2. Tell them: "You will be scored on how well you represented your constituency." Reveal the chip math only in the Debrief. This forces them to rely on intuition/interest rather than utilitarian calculus.

  **2. The Zoning Board Member (Personal Offense)**
  *   **Risk:** One participant feels the "Gold Block Resident" role is a caricature of their actual work.
  *   **Fix:** Pre-brief. Before handing out roles, say: "This simulation assumes scarcity. It is not a moral judgment on landlords or homeowners. It is a model of incentives. If you feel the role is unethical, swap with an Outsider role, but you must still play the incentive structure."

  **3. The "No Self-Argument" Rule Fails**
  *   **Risk:** Tenant unionists are trained to say "I am a tenant." They will break character.
  *   **Fix:** If they break character, ring a bell. "Out of order. Speak for the District." If they persist, let it slide but note it in the debrief: "It was hard to separate self from community. That's the point."

  ---

  ### Bias Check: Where I Loaded the Dice Against Ravi

  **1. The Fixed Pie Assumption**
  The scoring assumes the "Amenity Pool" (Train/School quality) is fixed at 60 chips. In reality, 40 new units might *improve* the train frequency or fund the school. The game hard-codes the NIMBY fear (congestion) as mathematical fact.
  *   *Empirical Claim:* It assumes new neighbors dilute value rather than creating agglomeration benefits.
  *   *Scrap Condition:* If your group contains urban designers who convincingly argue that density *improves* the school/train, and the room agrees, the chip mechanic breaks. If that happens, abandon the chips and debrief on "Why did we all agree density adds value here but not in Ravi's neighborhood?"

  **2. The Franchise Flip**
  The design assumes the Outsiders *want* the build. If your "Hospital Worker" role decides they hate construction noise more than they want housing, the vote won't flip.
  *   *Scrap Condition:* If Round 2 fails *and* the Mayor override feels tyrannical rather than instructive, the session has reinforced NIMBYism. You must be ready to pivot the debrief to: "Why did the worker side with the owner? Is class solidarity stronger than housing need?"

  ---

  ### Least Confident Element

  **The Motivation Gap Cards.**
  With a crowd of tenant unionists and policy nerds, I expect them to be too cynical. They will guess "Financial" for everyone, including themselves. If everyone admits "I am motivated by money," the gap disappears, and the "Audit" lesson fails.
  *   **Mitigation:** In the instructions, emphasize: "Write the reason you *feel* in your gut, not the reason that sounds best." If the gap is small, pivot the debrief: "We are so politicized we can't even imagine non-financial motives. That is the tragedy."

  ### Re-Randomization Verdict

  **Leave it out.**
  Re-shuffling roles at the end wrecks the emotional residue of the **Priced-Out Parent**. That specific role needs to sit in the room, silent during Round 1, watching the "Gold Block" vote down their child's school access. That silence is the pedagogical tool. If you shuffle them into a landlord role at the end, you let them off the hook. Keep the tension static.

  ### Final Note on the "Talking Past" Conclusion

  Be honest in the debrief: The game shows Ravi's position (Right to Shape) is **zero-sum**. It cannot be scaled. User's position (Right to House) is **positive-sum** (in theory).
  *   **The Hard Truth:** You cannot compromise on a zero-sum good. You cannot give Ravi "a little bit of exclusivity."
  *   **The Exit:** The only solution the game *cannot* simulate is changing the geography (building the train stop somewhere else, or building the school bigger). If the amenities were scalable, the conflict vanishes. Acknowledge that your argument with Ravi wasn't about the building; it was about whether amenities are fixed or scalable. The game assumes fixed. If Ravi believes they are scalable, the game proves nothing to him.
