answer: |-
  This is a classic *reductio* of what philosophers call the "Purity Account" of standing. You've constructed a very tight version of the argument that appears in the literature (e.g., in work by Macalester Bell, Kyle Fritz, or Daniel Miller).

  You are correct that the absurdity (6) is unacceptable, and you are also correct that the **Bookkeeping Model** is the engine driving the collapse.

  Here is the diagnosis of the leak, the specific premise to target, and the price you pay for the fix.

  ### 1. The Leak: Equivocation in "Morally on a Par"
  The slip is in **Premise (1)**, specifically in the phrase *"or of any wrong that is morally on a par with W."*

  Your argument relies on an equivocation between two senses of "on a par":
  *   **Structural Parity:** The acts belong to the same generic category (e.g., both are lies, both are failures to rescue).
  *   **Normative Parity:** The acts carry the same moral weight, severity, and implications for authority.

  Steps (2) through (5) successfully establish **Structural Parity**. (Yes, a white lie is structurally a lie, just like fraud is). But Step (1) requires **Normative Parity** to function plausibly. If standing were lost by *any* structural parallel, you get result (6). If standing is lost only by *normatively significant* parallels, you avoid (6).

  The argument smuggles Structural Parity into a premise that demands Normative Parity to be plausible.

  ### 2. The Bookkeeping Model is the Culprit
  You asked if rejecting the Bookkeeping Model fixes it. **Yes.**

  The Bookkeeping Model treats moral standing like a credit score: every moral infraction debits your account, and if your balance dips below zero (or matches the debtor's), you are insolvent and cannot collect.

  **Why this is wrong:** Standing is not a cumulative score; it is a **relational authority**.
  *   **The Authority Account:** To have standing is to have the normative authority to demand compliance or express resentment on behalf of the moral community.
  *   **The Hypocrisy Defeat:** Hypocrisy undermines standing because it signals that the blamer does not actually respect the norm they are invoking, or that they are placing themselves *above* the norm.

  However, a trivial violation (a white lie) does not demonstrate a disregard for the norm of truth-telling sufficient to undermine your authority to condemn a *devastating* lie. The "debt" of the white lie does not cancel the "credit" of your authority to blame a serious violation.

  ### 3. The Fix: Modify Premise (1)
  You want to save the core idea of (1) (that hypocrisy undermines standing). You can do this by adding a **Proportionality Constraint** or a **Relevance Condition**.

  **Revised Premise (1*):**
  > If A blames B for wrong W, then A must have standing; and standing requires that A is not herself guilty of W, or of any wrong that is **relevantly similar in severity and kind to W.**

  **What this does:**
  *   It preserves the intuition that a serial liar cannot blame someone for lying (Normative Parity exists).
  *   It blocks the inference that a person who tells white lies cannot blame someone for perjury (Structural Parity exists, but Normative Parity does not).
  *   It handles the omission case: Failing to donate 10% of your income might be wrong (per Singer), but it may not be *relevantly similar in severity* to failing to save a drowning child right in front of you, depending on how you individuate the acts.

  ### 4. The Price You Pay
  You asked what you are paying to keep (1) and the parity intuition. Here is the cost:

  **Cost A: You lose the "Objective Metric" of Standing.**
  The original Premise (1) was clean because it suggested an objective fact: *Did you do it or not?* The revised (1*) requires a judgment call about *severity* and *relevance*. This makes standing contestable. B can now argue, "My lie wasn't that bad," or "Your lie was basically the same," and there is no algorithmic way to settle it. You trade precision for plausibility.

  **Cost B: You must explain the "Threshold."**
  By introducing proportionality, you invite the Sorites Paradox. How many white lies does it take before you lose standing to blame someone for a big lie? If standing isn't bookkeeping, what is it? You now need a theory of **Normative Authority** to explain *why* severity matters. (e.g., "Severe hypocrisy shows a deeper disregard for the moral community than trivial hypocrisy.")

  **Cost C: You concede that "Perfect Purity" is not the standard.**
  You have to admit that standing is compatible with *some* moral failure. This weakens the moralistic sting of the hypocrisy objection. It means the hypocrite isn't necessarily "silenced" entirely; they are only silenced when their hypocrisy is *significant enough*.

  ### 5. Recommendation for the Seminar
  If I were you, I would frame the paper around **rejecting the Bookkeeping Model** explicitly.

  1.  **Grant (2)-(5):** Concede that we are all morally imperfect and structurally hypocritical. (This makes you look robust; you aren't hiding from the Singer-style implications).
  2.  **Attack (1):** Argue that (1) presupposes the Bookkeeping Model.
  3.  **Propose the "Authority Model":** Standing is lost only when the hypocrisy undermines the *normative force* of the blame.
  4.  **Conclusion:** We can keep the intuition that hypocrisy matters (saving the spirit of 1) without accepting that all moral agents are silenced (rejecting 6).

  **The specific line to use:**
  > "Standing is not a moral credit score that requires solvency; it is a license to enforce norms that is revoked only when the enforcer's behavior demonstrates a fundamental rejection of the norm itself."

  This allows you to keep the parity intuition (yes, the acts must be similar) without accepting the absurdity that *any* similarity destroys standing. You pay the price of having to define "fundamental rejection," but that is where the interesting philosophical work lies anyway.
