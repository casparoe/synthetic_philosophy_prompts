answer: |-
  **Joint Statement: Adversarial Collaboration on Safety Cases**

  **1. Agreed Claims**
  Both camps endorse the following logical distinctions. These are not policy recommendations but structural facts about risk assessment.

  1.  **Claim:** "99% reliable on eval E" and "won't do X" are different logical kinds of claim.
      *   *Gloss:* Passing tests isn't the same as proving impossibility.
  2.  **Claim:** Every average-case claim is relativized to a distribution, and validating that distribution is itself an unverified average-case claim (the Distributional Regress).
      *   *Gloss:* You can't test whether your tests are representative without more tests.
  3.  **Claim:** Variance across inputs, variance across training runs, and variance across deployment contexts are three different things that scale differently.
      *   *Gloss:* Changing the question, the model, and the world break reliability in different ways.
  4.  **Claim:** Correlated failures across many copies make per-instance reliability misleading in the tail.
      *   *Gloss:* One mistake per million copies is safe; one mistake that happens in all copies simultaneously is not.

  **2. Residual Disagreements**
  We disagree on what constitutes sufficient evidence for deployment. Below, each disagreement is stated in the internal language of each camp.

  | Topic | Worst-Case Formulation | Average-Case Formulation |
  | :--- | :--- | :--- |
  | **The Safety Case** | A safety case is incomplete without a defended threat model showing risk bounds hold for every trajectory inside it. | A safety case is complete when measured reliability on representative distributions exceeds a threshold with actionable error bars. |
  | **Red-Teaming** | Attack success rates under a fixed compute budget show vulnerabilities exist, not that they are bounded or rare. | Attack success rates under fixed budgets are the only operational proxy we have for real-world risk exposure. |
  | **Tractability** | Demanding worst-case guarantees is necessary to force rigor; otherwise, numbers are fabricated comfort. | Demanding worst-case guarantees over smart systems is mathematically vacuous; it is a way of never having to produce a number. |

  **3. Cruxes and Predictions**
  We identify three empirical or conceptual tests where our positions diverge. We record predictions now to resolve them later.

  **Crux 1: Interpreting Probability Claims**
  *   **Measurement:** A claim that "p(catastrophe) < 1e-3" derived from 1000 trials with zero failures.
  *   **Worst-Case Prediction:** This number reflects subjective uncertainty over threat models, not sampling noise; it is invalid without a model bound.
  *   **Average-Case Prediction:** This number is an empirical frequency estimate with confidence intervals; it is valid if the sampling distribution matches deployment.

  **Crux 2: Capability vs. Reliability Scaling**
  *   **Measurement:** Scaling model size while tracking failure rates on adversarial inputs.
  *   **Worst-Case Prediction:** Capability gains will improve average reliability while fattening the tail (new failure modes emerge faster than old ones close).
  *   **Average-Case Prediction:** Capability gains will improve reliability on known failure modes faster than new modes emerge, net reducing risk.

  **Crux 3: The "Middle Object"**
  *   **Measurement:** A proposal for a bound on a relaxed threat model plus a monitored assumption (e.g., "bounded risk if input distribution stays within X").
  *   **Worst-Case Prediction:** We will sign only if the monitoring mechanism itself has a defended worst-case bound on failure.
  *   **Average-Case Prediction:** We will sign only if the bound doesn't require impossible computational overhead or restrict useful functionality.

  **Note on Semantics vs. Substance**
  Much of the fight over the word "guarantee" is verbal; both sides accept that absolute certainty is impossible. The real disagreement is resource allocation: whether marginal safety dollars should buy tighter formal bounds on simplified models or broader empirical coverage on complex models. We agree that if the "Middle Object" (Crux 3) fails to materialize, the collaboration must recommend parallel tracks rather than a unified standard.

  **Signatories:**
  [ Worst-Case Camp Lead ]
  [ Average-Case Camp Lead ]
