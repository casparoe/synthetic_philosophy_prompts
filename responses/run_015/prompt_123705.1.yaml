answer: |-
  It is a pleasure to correspond with someone who approaches moral philosophy with the skepticism of an experimentalist. You have spent thirty years calibrating instruments to measure trace gases in a column of atmosphere; you know that when a model diverges from the data, it is either because the physics is wrong, the calibration is off, or there is noise you haven't accounted for. The tension you see in health policy is not merely noise. It is structural error in the moral model.

  Here is an analysis of your four points, treating the ethical frameworks as you would treat retrieval algorithms: looking for the boundary conditions, the hidden assumptions, and the points where the model breaks.

  ### 1. The Presuppositions of Cost-Per-QALY
  You asked whether the QALY apparatus *strictly* requires interpersonal comparisons of utility (ICU) or if the Harsanyi "veil of ignorance" reconstruction avoids this.

  **The Strict Requirement:**
  To sum QALYs across a population (Utilitarian aggregation), you strictly require **cardinality** and **unit comparability**.
  *   **Cardinality:** It is not enough to know that Patient A prefers State 1 to State 2. We need to know *how much* more. A QALY weight of 0.4 vs 0.7 implies a measurable distance.
  *   **Unit Comparability:** We must assume that a "0.1 gain" for Aisha represents the same amount of "good" as a "0.1 gain" for Ben. If Aisha's 0.1 is a trivial relief of itchiness and Ben's 0.1 is the ability to walk, summing them is category error, like adding meters to seconds.

  **The Harsanyi Workaround:**
  John Harsanyi's theorem (1955) argues that if a planner satisfies certain axioms of rationality (including Expected Utility Theory) and is impartial, they *must* maximize the sum of individual utilities.
  *   **Does it escape ICU?** No. It transmutes it. It turns the interpersonal comparison ("Is Aisha's pain worse than Ben's?") into an intrapersonal choice under uncertainty ("Would I rather take a 50% risk of being Aisha in pain or a 50% risk of being Ben in pain?").
  *   **The Catch:** This only works if the planner can assign coherent probabilities and utilities to *being* someone else. This presupposes that there is a common currency of "well-being" that can be inhabited by different people. It makes ICU palatable by framing it as rational self-interest, but the mathematical structure remains aggregative. The practice *requires* ICU; Harsanyi merely provides a justification for why a rational agent would accept it.

  ### 2. The Survey Method (The Calibration Problem)
  You asked if asking the healthy to value illness is "real philosophical work" or just "papering over" the inability to access other minds.

  In satellite retrievals, you deal with the difference between the *forward model* (physics of radiative transfer) and the *inverse problem* (inferring concentration from radiance). The QALY survey method is an inverse problem with a biased sensor.

  *   **The Bias:** Empirical data shows that healthy people systematically undervalue the quality of life of disabled people compared to how disabled people rate themselves (the "disability paradox"). Healthy respondents focus on the *loss* of function; patients focus on *adaptation* and shifting values.
  *   **The Philosophical Work:** By using general public weights (as NICE does), the system is making a substantive ethical choice: it prioritizes the **fear of illness** over the **experience of illness**. It treats health states as goods to be consumed by a generic agent, rather than lives lived by specific agents.
  *   **Verdict:** It is not merely measurement error. It is a deliberate calibration choice. It assumes that social value is determined by what society fears losing, not by what patients report gaining. This is defensible (it reflects societal willingness to pay), but it is not "objective" measurement. It is a specific moral stance masquerading as empirical data.

  ### 3. The "Same-Person Rule" (SPR)
  Your marginalia sketch is fascinating. It attempts to use a Pareto-style logic: *Plan A is better than Plan B if more people are better off under A than under B, without comparing the magnitude of gains across persons.*

  **Does it avoid Interpersonal Comparisons?**
  No. It smuggles them in through the counting mechanism.
  *   **Equality of Standing:** To count heads (1 person for Aisha, 1 person for Ben), you are asserting that Aisha's *interest* counts equally to Ben's *interest*. This is an interpersonal comparison of moral status.
  *   **The Intensity Objection:** Suppose Plan A gives 1,000 people a 0.001 QALY gain (a slight headache relief). Plan B gives 1 person a 10 QALY gain (saving a life).
      *   **QALY:** Saves the life (10 > 1).
      *   **SPR:** Relieves the headaches (1,000 heads > 1 head).
      *   **The Problem:** SPR treats all "wins" as binary and equal. It ignores magnitude. To avoid this, you would need to weight the wins, which returns you to comparing magnitudes (ICU).
  *   **Cycling:** If you have three plans and three people, you can get Condorcet cycles (A beats B, B beats C, C beats A) where no stable decision exists. QALYs avoid this by imposing a single metric (the sum).

  **Divergence and Bugs/Features:**
  *   **Divergence:** SPR favors treatments with widespread, shallow benefits over treatments with deep, concentrated benefits. QALYs favor the reverse.
  *   **Bug or Feature?**
      *   *Bug:* It is inefficient. It leaves large amounts of "good" on the table to satisfy a headcount.
      *   *Feature:* It aligns with democratic intuition. It prevents the "tyranny of the sum" where one person's massive need is sacrificed for thousands of trivial gains.
      *   *Verdict:* It is essentially a voting system applied to welfare. It avoids comparing *magnitudes* of welfare across people, but it cannot avoid comparing *counts* of people. It trades the problem of "incommensurable utilities" for the problem of "ignoring intensity."

  ### 4. The Rescue Principle vs. QALY
  You noted the gap between the cold calculus of QALYs and the "Rule of Rescue" (spending millions to save a named child).

  **Is it Inconsistent?**
  Yes, strictly.
  *   **Ex Ante vs. Ex Post:** QALYs are an *Ex Ante* framework (insurance logic). Behind a veil of ignorance, you want the system that saves the most life-years on average. You would not want the system to bankrupt itself saving one identifiable child if that money could save ten statistical children.
  *   **The Rescue Logic:** This is *Ex Post*. Once the child is identified, the relationship changes. We are no longer allocating risk; we are responding to a specific claim.

  **Why the Gap Exists:**
  It is not merely politics bolted onto theory. It reflects a conflict between two moral frameworks:
  1.  **Utilitarianism (QALY):** Maximize the aggregate good.
  2.  **Contractualism/Deontology (Rescue):** We have specific duties to identifiable individuals that cannot be overridden by aggregate statistics. (T.M. Scanlon's argument: The one person left behind has a "reasonable rejection" of the policy that sacrificed them, which the statistical survivors do not).

  **A Consistent Version:**
  *   **The Hard Utilitarian:** Abolish the Rule of Rescue. It is irrational sentimentality. (Politically unsustainable; destroys trust in the system).
  *   **The Prioritarian:** Modify the QALY math. Give extra weight to QALYs gained by those who are worse off or facing death. This mathematically bridges the gap. (NICE actually does this implicitly with "end-of-life premiums," allowing a higher cost-per-QALY threshold for terminal illnesses).
  *   **The Hybrid:** Acknowledge that QALYs are for *budget setting* (macro allocation), but allow discretionary funds for *rescue* (micro allocation). This admits that the theory is incomplete.

  ### Summary for the Chemist
  If I may use your language: The QALY model assumes a linear response function across the population. The "Rescue" phenomenon suggests the response function is non-linear and context-dependent (identifiability acts as a catalyst).

  Your "Same-Person Rule" attempts to remove the cross-calibration step between sensors (patients). But in doing so, it loses the signal intensity. It tells you how many sensors triggered, but not how strong the signal was.

  The inconsistency you see is not a calibration error that can be fixed with better surveys. It is a feature of the moral landscape. We are Utilitarians when we design the system (to be fair to all), but Deontologists when we face the individual (to be faithful to the specific). A consistent system would have to choose one, and both choices leave something morally vital on the table. The current "hypocrisy" is arguably the only stable equilibrium.

  **Footnote on the Number:** You mentioned forgetting the English threshold. NICE (National Institute for Health and Care Excellence) typically operates between **£20,000 and £30,000 per QALY**. Above £30k, you need increasingly strong justification (like the end-of-life criteria you noted). Below £20k, it is generally considered cost-effective.
