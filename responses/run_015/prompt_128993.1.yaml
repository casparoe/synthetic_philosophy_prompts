      *Refining the "Winner":* In analytic metaphysics, Origin Essentialism (Kripke) is generally the dominant position regarding *modal* identity (who could have been who). The psychological continuity view is usually applied to *persistence* over time, not *origin*. M2 conflates persistence conditions with origin conditions. M1 is more philosophically robust here.

