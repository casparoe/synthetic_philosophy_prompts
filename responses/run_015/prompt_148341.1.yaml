  I must begin with a direct answer: **the specification cannot be satisfied as written.** Your brother-in-law's joke collapses under the pressure of Constraint 3 combined with the Target Verdict. If two beings exhibit the same behavioural repertoire, same discriminations, same functional organisation, and same reported intensity of pain, then by every standard theory of welfare (hedonistic, preference, or objective list), the *badness* of that pain is identical. To claim the larger brain's pain counts for *more* while holding the phenomenology and function fixed is to sever the link between "what it is like" to suffer and "how much" the suffering matters. It renders moral weight an occult property detached from the subject's experience.

  To make the case bite, we must relax **Constraint 3**. We must allow that the *reported* intensity is identical because the reporting mechanism is calibrated to the system's capacity, even though the *physical magnitude* of the pain state differs. We must accept that a "5 out of 10" in a larger brain recruits significantly more neural substrate than a "5 out of 10" in a smaller brain, and that this substrate volume constitutes the moral weight. This moves us from a functionalist view of welfare to a **Substrate Materialist** view: the moral disvalue is located in the physical extent of the valenced state, not merely its informational output.

  Here is the strongest case possible under that relaxation.

  ### The Scenario
  In a specialized neurology clinic, two patients, Alpha and Beta, undergo routine pain calibration. Alpha possesses a naturally macrocephalic brain (top percentile volume); Beta possesses a microcephalic brain (low percentile volume), yet both test within the normal range for intelligence and behavioural output. During a trial, both are subjected to a thermal stimulus that triggers a pain state. Both press a button indicating "Level 5 Intensity." Neuroimaging reveals that while the functional output is identical, Alpha's pain state recruits 40% more cortical tissue and 50% more nociceptive neurons than Beta's to generate that same reported signal. The extra tissue in Alpha is not redundant backup; it is actively firing in the pain configuration, but Alpha's reporting system is scaled to his total neural capacity, masking the physical difference. A surgeon must choose to inflict this stimulus on one subject to calibrate a device; the choice is otherwise arbitrary.

  ### (a) The Principle
  The case tests **Substrate Proportionalism**: *The moral weight of a mental state is proportional to the total volume of neural tissue actively realizing that state, independent of the calibrated behavioural output.*

  This principle delivers the verdict directly from the features of the case. It does not stipulate that Alpha matters more; it derives that conclusion from the physical facts of the neural activation. If pain is a physical state (Identity Theory), and moral disvalue tracks the "amount" of that physical state, then Alpha's pain involves more "pain-stuff" than Beta's. The principle treats the brain not as a black box producing utility, but as the literal locus of value. The verdict follows because 40% more tissue in the pain configuration equals 40% more moral disvalue, even if the "readout" is normalized.

  ### (b) The Removal Check
  If we delete the extra tissue in Alpha (reducing his brain to Beta's size while maintaining function via efficiency gains), the verdict tracks size **continuously**. As we hypothetically shrink Alpha's active pain-mass toward Beta's, the moral weight of inflicting the headache diminishes proportionately. There is no sudden switch-off; the moral weight fades as the tissue fades. This is what the principle should want: if moral weight is constituted by the substrate, removing the substrate removes the weight. If the verdict switched off all at once (e.g., only when the brain dropped below a consciousness threshold), it would suggest size was merely a proxy for capacity, which would violate the relaxation we adopted. The continuous tracking confirms that size *itself* is doing the work.

  ### (c) The Weight-Carrying Feature
  The single feature carrying the weight is **the absolute count of neurons participating in the valenced state**. It is not the complexity of the state, nor the intelligence of the subject, nor the duration of the pain. It is the sheer numerical magnitude of the physical realization. The case hinges entirely on the intuition that inflicting a state across a wider physical expanse is a greater moral injury than inflicting the same informational state across a narrower expanse, analogous to the difference between burning a large effigy and a small one, even if both represent the same person.

  ### (d) The Strongest Attack
  The strongest attack comes from **Phenomenal Functionalism**. A critic would argue: "You have conflated the *vehicle* of consciousness with the *content*. Moral weight attaches to the content (the suffering experienced), not the vehicle (the neurons firing). If Alpha and Beta both report '5/10' and behave identically, the *content* of their experience is identical. To say Alpha suffers more is to say his experience feels the same but is somehow 'more bad' in a way he cannot detect. This makes moral weight an external property imposed by an observer, not an internal property of the welfare subject. If the subject cannot tell the difference, and the functional consequences are the same, the 'extra' neural firing is morally inert noise. You are not weighting the pain; you are weighting the silicon of the hard drive rather than the data it holds."

  ***

  **Summary:** Your brother-in-law's joke cannot bite under the strict constraints because moral weight supervenes on experience and function, not raw mass. It can only bite if we accept that the "amount" of experience is determined by the physical volume realizing it, even when the subject's own perspective (the report) is calibrated to hide that difference. This requires abandoning the view that "what it feels like" is the sole arbiter of "how much it matters."
