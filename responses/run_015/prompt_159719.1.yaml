answer: |-
  1. **Fixed Comparison Class:** Apply standing rule: "A competent peer under standard staffing with information available in the record." Do not adjust for specific hardships unless systemic. *Stop:* If the record lacks data to define standard conditions, hand to Credentialing Committee.
  2. **Blinded Responsibility Rating:** Redact patient outcome and post-event course. Ask: "Did conduct breach the Comparison Class standard?" Sufficient answer: Written deviation from protocol. Do not infer intent. If No, rate **No Fault** and stop. If Yes, assign preliminary rating (Minor/Serious/Gross).
  3. **Outcome Luck Signature:** Reveal outcome. Ask: "Does the outcome change the Responsibility Rating?" If Yes, revert to Blinded Rating. The change is the signature of Outcome Luck, which is barred from Responsibility. Epistemic Luck (unknown facts) is barred unless recorded as knowable. Hand-off: If determining 'knowability' requires external investigation, mark 'Undetermined' and hand to Credentialing Committee.
  4. **Forward-Looking Recommendation:** Ask: "Does the harm potential or actual harm require intervention?" **Outcome Luck and Circumstantial Luck are permitted** here. High harm may trigger Training or Restriction even if Responsibility was low. Constitutive Luck (traits) permits Restriction for safety, not blame.
  5. **Values Hand-off:** Ask: "Is this a safety calculation or a value judgment on privilege?" If restricting privileges based on health (Constitutive Luck) rather than fault, hand to Credentialing Committee.

  **Applications**

  1. **Anaesthetists:** Blinded Rating: Both **Minor Lapse** (same protocol breach). Outcome Luck barred. Step 3 confirms outcome changes nothing in Responsibility. Recommendation: Anaesthetist A (Death): **Additional Training** (Outcome Luck permitted). Anaesthetist B (Survival): **No Action**. *Result:* Responsibility equal; Recommendation divergent.
  2. **Surgeon (Parkinson's):** Blinded Rating: **Minor Lapse** (technique deteriorated). Constitutive Luck (tremor) reduces fault if unaware. Recommendation: **Restriction of Privileges**. *Hand-off:* Credentialing Committee must decide value of restricting ill physician vs. safety.
  3. **Residents:** Blinded Rating: Both **Minor Lapse** (skipped checklist). Outcome Luck barred. Recommendation: Resident A (Harm): **Additional Training**. Resident B (No Harm): **No Action**. *Conflict:* Credentialing Committee may demand 'Serious Lapse' for Resident A due to harm. The procedure dictates identical responsibility ratings despite disparate outcomes. You must report this divergence: the Committee will likely reject the equal responsibility rating to mitigate liability, overriding the board's ethical consistency.

  **Limitations**

  This procedure cannot resolve ambiguities in the record regarding intent or subjective knowledge (Epistemic Luck). If the record does not state what the agent knew, the board must assume reasonable knowledge, which may be factually incorrect. It fails for systemic failures where individual rating is inappropriate. It cannot prevent the Credentialing Committee from overriding recommendations based on liability fears rather than safety logic. Finally, it cannot adjudicate cases where the 'Competent Peer' standard is itself contested among board members; in such value disputes, the Chair must arbitrate.
