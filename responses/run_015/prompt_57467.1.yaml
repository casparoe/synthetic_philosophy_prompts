          2.  **Agent-Relative Constraints (Substantive):** There are agent-relative reasons not to kill that outweigh agent-neutral reasons to save. This is the actual deontological claim.
          3.  **Intention vs. Foresight (Doctrine of Double Effect):** "Ends" = intended good, "Means" = intended evil. Maybe intended evil is never justified by intended good. (Substantive but specific).
          4.  **Consequentialist Agreement (Not-in-Dispute):** Sometimes bad means lead to bad ends (empirical claim). Or, rule consequentialism might agree certain acts shouldn't be done even if they look good in isolation.
          5.  **False/Incoherent:** If "justify" means "causally explain," it's false. If "ends" includes the act's moral quality, it's circular.
          6.  **Blame vs. Permissibility:** The act is wrong, but you aren't blameworthy. (Excuse vs. Justification).

