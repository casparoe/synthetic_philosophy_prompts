      2. **The Agent-Relative Priority**: 'Ends' picks out agent-neutral value (everyone counts equally); 'means' is an agent-relative constraint (I must not kill); 'justify' means outweigh in practical deliberation. Claim: Agent-relative reasons not to violate constraints outweigh agent-neutral reasons to promote value in cases of conflict. Verdict: **Substantive**. This is the actual core disagreement requiring defense regarding the source of normative reasons. It demands an account of why the agent's own agency matters more than the impersonal good.
      3. **The Intentional Constraint**: 'Ends' picks out foreseen good consequences; 'means' is an intended violation of duty; 'justify' means render morally acceptable. Claim: Intentionally using a person as a means is never permissible, even if foreseen consequences are better. Verdict: **Substantive**. This narrows the paradox but requires defending the moral relevance of intention versus foresight. It shifts the debate to the Doctrine of Double Effect rather than the value of outcomes.
      4. **The Empirical Slippery Slope**: 'Ends' picks out long-term aggregate utility; 'means' is adopting a policy of violating constraints; 'justify' means maximize utility over time. Claim: Permitting this act-token leads to worse utility outcomes generally due to erosion of trust. Verdict: **Not-in-Dispute**. Consequentialists accept this; it avoids the paradox by changing the calculus to rule-level evaluation. It concedes the theoretical ground to consequentialism while saving the constraint practically.
      5. **The Definitional Collapse**: 'Ends' picks out total value including the act's intrinsic wrongness; 'means' is the act; 'justify' means cancel out the wrongness. Claim: The act's wrongness is part of the 'ends' calculation, so the net ends are never good. Verdict: **Incoherent**. This conflates the evaluation of the act with the evaluation of the outcome, rendering the maxim empty. It makes the slogan analytically true but morally uninformative for guiding action.

