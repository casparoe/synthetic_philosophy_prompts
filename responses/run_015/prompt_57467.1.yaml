  - The setup — The paradox assumes moral rationality requires maximizing agent-neutral value, making constraint-based refusal look like a fetishism of rules over people. For the slogan to function as a reply, it must deny that 'permissibility' is derived solely from outcome value. It implies a structural separation between the evaluation of states of affairs and the evaluation of actions. Without specifying why that separation exists, the slogan risks merely asserting the conclusion it aims to prove.

