  ### Strategic Agenda: The Mingjia Conceptual Legacy Project

  **Team Profile:** Two Philosophers, One Historian of Logic.
  **Constraint:** Limited Sinological training; 18-month horizon.
  **Core Hypothesis:** The *White Horse* dialogue rests on a premise regarding kind-membership and accidental modification restricted to linguistic classification (a form of linguistic sortal essentialism).

  Below is the defended prioritization of your four lines of inquiry. I have retained your four categories but refined their scope to match the team's specific expertise (conceptual analysis and formal logic) while mitigating the risk of philological overreach.

  ---

  ### The Ranking

  1.  **Line 1: Reconstruction of the Core Claim** (Reference vs. Composition vs. Classification)
  2.  **Line 2: Systematic Theory of Property Inheritance** (Hard-and-White vs. Hylomorphism)
  3.  **Line 4: The Logic of Negation and Distinction** (Formal Framework)
  4.  **Line 3: Contemporary Relevance** (Natural Kinds and AI Classification)

  ---

  ### Detailed Analysis and Defense

  #### Priority 1: Reconstruction of the Core Claim (Line 1)
  *Refined Focus:* Determine whether "White Horse is Not Horse" functions as a failure of substitutivity (reference), a mereological claim (composition), or a sortal restriction (classification logic).

  *   **Dependence (Upstream):** This is the foundational bottleneck. You cannot assess whether the School of Names has a systematic metaphysics (Line 2) or a distinct formal logic (Line 4) until you agree on what the primary text is *doing*. If the dialogue is merely a rhetorical trick (reductio), Lines 2 and 4 collapse. If it is a semantic claim about compound terms, Line 2 (metaphysics) becomes less relevant than Line 4 (logic).
  *   **Tractability:** **Moderate.** For philosophers without deep Sinology, this is the safest entry point. It relies on analyzing argument structure rather than textual philology. You can work from standard translations to map the inferential steps. The risk is circularity (interpreting the text to fit your preferred logic), which must be managed by comparing multiple translations rather than original texts.
  *   **Reordering Trigger:** If, after six months, the team concludes that the text is irredeemably ambiguous or purely rhetorical (a *reductio ad absurdum* with no positive thesis), **abort Line 2 and 4**. Shift immediately to **Line 3**, using the ambiguity itself as a case study in how classification systems fail when definitions are unstable.

  #### Priority 2: Systematic Theory of Property Inheritance (Line 2)
  *Refined Focus:* Assess whether the *Hard and White* dialogue implies a theory where properties (hardness, whiteness) exist independently of their substrates, and if this conflicts with Aristotelian hylomorphism without collapsing into nominalism.

  *   **Dependence (Mid-Stream):** This depends on Line 1. If Line 1 concludes the *White Horse* is about linguistic classification, Line 2 investigates if that linguistic rule is grounded in a specific ontology of properties. It is upstream of Line 4 because formal logic (Line 4) requires knowing what entities (properties, objects, names) are being quantified over.
  *   **Tractability:** **High.** This is the "sweet spot" for your team. Comparing Mingjia property theory to Aristotelian hylomorphism is a standard comparative metaphysics task. It does not require reading Classical Chinese, but rather analyzing the *concepts* presented in the dialogues. The "nominalism trap" is a known philosophical problem your team is equipped to navigate.
  *   **Reordering Trigger:** If the analysis reveals that the "Hard and White" arguments are inconsistent with the "White Horse" arguments (i.e., there is no unified "School of Names" theory), **demote Line 2**. Treat the dialogues as isolated case studies rather than a system. This would elevate **Line 4**, focusing on the local logic of each dialogue rather than a unified metaphysics.

  #### Priority 3: The Logic of Negation and Distinction (Line 4)
  *Refined Focus:* Identify if the School's use of "not" (fei) implies a logic of distinction that differs from Aristotelian contradiction or Stoic assertibles.

  *   **Dependence (Downstream):** Formalization is downstream of conceptual reconstruction. You cannot formalize a logic of negation until you know what is being negated (the name? the object? the combination?). If Line 1 establishes that "White Horse is Not Horse" is a sortal restriction, Line 4 must formalize sortal logic, not standard predicate logic.
  *   **Tractability:** **Low.** This is the highest risk for a team without deep Sinological training. Reconstructing a "distinct formal framework" from fragmentary texts often leads to projecting modern formalisms onto ancient rhetoric. However, the Historian of Logic on the team mitigates this. The work should be limited to testing if standard formalisms *fail* to capture the arguments, rather than building a new system from scratch.
  *   **Reordering Trigger:** If Line 1 and 2 suggest the arguments are valid within standard predicate logic (merely relying on equivocal premises), **abandon Line 4**. There is no distinct logic to recover. Redirect resources to **Line 3** to explore why standard logic *feels* insufficient here, focusing on the pragmatics of classification.

  #### Priority 4: Contemporary Relevance (Line 3)
  *Refined Focus:* Apply the reconstructed taxonomy to modern debates on natural kinds and automated classification (e.g., AI grouping by perceptual features vs. base kind).

  *   **Dependence (Terminal):** This is the application phase. It is strictly downstream. Applying Mingjia insights to AI classification before settling Line 1 risks superficial analogies (e.g., "White Horse is like a mislabeled dataset"). The value of this line depends entirely on the robustness of the reconstruction in Lines 1 and 2.
  *   **Tractability:** **Very High.** Your team likely knows more about contemporary natural kind debates and AI classification than about Gongsun Long. This is the easiest work but yields the least *historical* insight. It should be reserved for the final 6 months to synthesize findings.
  *   **Reordering Trigger:** If Lines 1 and 2 stall due to philological barriers (the team cannot resolve the textual ambiguities), **promote Line 3 to Priority 1**. Use the modern problem (AI classification errors) as a heuristic to generate hypotheses about the ancient text (reverse-engineering the interpretation). This is a "model-driven" rather than "text-driven" approach.

  ---

  ### Revised Timeline and Resource Allocation

  **Months 1–6: The Semantic-Ontological Interface (Line 1)**
  *   **Goal:** Produce a consensus paper on the logical form of the *White Horse* argument.
  *   **Method:** Workshop the argument using analytic tools. Do not get bogged down in competing translations; identify the *minimum viable premise* required to make the argument valid.
  *   **Deliverable:** A formalized reconstruction of the "White Horse" argument that isolates the "sortal modification" premise.

  **Months 7–12: The Metaphysical System (Line 2)**
  *   **Goal:** Determine if the "Hard and White" dialogue supports the Line 1 reconstruction.
  *   **Method:** Comparative metaphysics. Map the property ontology against Aristotelian substance/accident distinctions.
  *   **Deliverable:** A position paper on whether Mingjia ontology constitutes a viable alternative to hylomorphism or a form of linguistic nominalism.

  **Months 13–18: Formalization and Application (Lines 4 & 3)**
  *   **Goal:** Test the limits of the reconstructed logic and apply it to modern classification problems.
  *   **Method:** The Historian of Logic tests the formal consistency (Line 4); the Philosophers draft the application to AI/Natural Kinds (Line 3).
  *   **Deliverable:** A joint article proposing a "Mingjia-inspired constraint" for automated classification systems.

  ### Summary of Trade-Offs

  This agenda prioritizes **conceptual clarity over historical completeness**.
  *   **Risk:** You may produce a reconstruction that Sinologists reject as anachronistic.
  *   **Mitigation:** By focusing on the *logic* and *metaphysics* (your expertise) rather than the *philology* (your weakness), you ensure the output is philosophically robust even if historically contested.
  *   **Gain:** This approach maximizes the likelihood of a publishable philosophical contribution within 18 months, rather than getting stuck in textual exegesis.

  If the "sortal essentialism restricted to linguistic classification" hypothesis holds in the first six months, this pipeline flows naturally. If it fails, the trigger conditions above allow you to pivot to a heuristic, application-led approach (Line 3) without losing the investment in the first year.
