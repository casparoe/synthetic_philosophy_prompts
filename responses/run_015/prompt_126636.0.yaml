  Professor Reed's sorting of the four models reveals two defining dimensions used to distinguish systems:

  *   **Rule 1: Electoral Origin (Selection).** This rule looks at *how* the head of government enters office.
      *   **Presidential:** The executive is **separately elected by the voters** (US, Latin American model).
      *   **Parliamentary:** The executive is **selected by the legislature** (Westminster, German model).
  *   **Rule 2: Legislative Survival (Responsibility).** This rule looks at *how* the executive and cabinet remain in office.
      *   **Presidential:** The executive serves a **fixed term** and cannot be removed by a legislative vote of confidence (removal requires impeachment); ministers serve at the executive's pleasure (US, Latin American model).
