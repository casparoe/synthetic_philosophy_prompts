prompt: |-
  I teach aesthetics at a mid-sized state university, and a friend who runs a small documentary festival has cornered me into writing her something I can't quite finish. She programmes maybe forty films a year and about six to eight times a year one of them turns out to have a problem: the director was abusing the crew, or the subject's consent was obtained under false pretences, or the filmmaker is facing charges for something that has nothing to do with the film at all. She has no in-house counsel, the board has to sign off on anything that looks like a political statement, and she usually finds out forty-eight hours before the programme grid goes to print. So I can't give her an essay on autonomism vs. moralism; I need something her programming associate, who has a film-studies BA and no philosophy, can actually run in one sitting, at the end of which it hands her one of four dispositions: show it as planned, show it with context (a note in the programme, an on-stage caveat, a panel afterwards), show it only if some condition is met (fee renegotiated, proceeds redirected to a victim's fund, a content warning), or pull it.

  The bit where I keep getting stuck is that I think the whole thing is secretly two separate procedures stapled together, and I want her to be able to tell which one she's running. There's a question about whether the work is worse as art because of what the maker did — the sort of claim that seems true when the immorality is visible in the work itself and much less plausible when it isn't — and then there's a completely different question about what a festival ought to platform, which is about money, audiences, and who gets to speak, and could go either way even if the artwork is flawless. I want both tracks, with a signpost at the fork. Along the way the procedure has to handle some cases I've invented for it, partly because I think they break the tidy versions: the constitutive case, where the wrongdoing is inside the work — footage gotten by deceiving the person filmed, a sculpture using material taken from a community's burial ground — so that you cannot remove the taint without destroying the piece; the taint-value case, where the piece is partly interesting because a notorious person made it, so the badness is doing some of the aesthetic work and sanitising it would leave you with nothing; the collaborative case, a forty-person crew with one person's misconduct somewhere in it, where I can't even say whose work it is; the split-victim case, where one of the people harmed wants the film shown as testimony and another wants it buried; and the timing case, a conviction last year versus an artist dead for ninety years, where the money flows somewhere different in each. It also has to say what to do in the epistemic muddle that actually comes up most: an allegation reported by one outlet, no charges, artist denies it, audience has never heard of it — and honestly, an audience that hasn't heard of it is a different situation from one that has, and I don't think either is more fundamental.

  So: write me the procedure. Number the questions in the order she should ask them, say what counts as a sufficient answer to each, where it stops with a no, and — this matters most to me — where it has to stop and hand the decision to a person because the issue is one of values rather than facts, with an explicit note on who signs off at that point. Keep every distinction you think must survive the simplification and drop the ones that don't, but tell me what you dropped and why it was safe to drop. Then run it on three composites of mine, no real names: a vérité feature about a recovering addict, made by a director who was in a coercive relationship with its central subject, and the subject is alive and wants it screened; an animated short about grief by someone convicted of financial fraud against his own family, unrelated to the film; and a large installation I've saved for last, because she's already booked the venue and spent the insurance money on it, built by a sculptor from objects taken without permission from a community's burial site, and that community is asking for it to be destroyed rather than shown. If the procedure gives her an answer on that third one that she won't like, say so plainly rather than fudging it. Finally, tell me what the procedure cannot do — I assume it can't tell her whether a film is any good, and I suspect there's a deeper thing it can't do around cases where the audience's knowledge of the artist is what makes the work worth showing at all, but I'd like you to name it better than I just did.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Aesthetics professor at a mid-sized state university.
      *   **Client:** Friend running a small documentary festival (40 films/year, 6-8 problematic ones/year).
      *   **Constraint:** No in-house counsel, board approval needed for political statements, 48-hour turnaround, user needs a practical tool for a programming associate (Film Studies BA, no philosophy).
      *   **Goal:** A decision procedure (flowchart/checklist style) resulting in one of four dispositions: Show As Planned, Show With Context, Show With Conditions, Pull.
      *   **Key Insight:** The user believes there are *two* distinct tracks: (1) Aesthetic/Moral connection (is the art tainted?) vs. (2) Institutional/Ethical connection (should we platform this?). The procedure needs a "signpost at the fork."
      *   **Required Cases to Handle:**
          *   Constitutive (wrongdoing is inside the work).
          *   Taint-Value (badness adds aesthetic value/notoriety).
          *   Collaborative (crew misconduct vs. director).
          *   Split-Victim (one victim wants show, one wants bury).
          *   Timing (recent conviction vs. dead artist).
          *   Epistemic Muddle (allegation vs. proof, public knowledge levels).
      *   **Format:** Numbered questions, sufficient answers, stop points, explicit hand-off points for value judgments (who signs off).
      *   **Test Cases:**
          1.  Vérité feature (coercive director/subject relationship, subject wants screening).
          2.  Animated short (financial fraud conviction, unrelated to film).
          3.  Installation (burial site objects, community wants destruction, venue booked/insurance spent).
      *   **Meta-Requirement:** Explain what was simplified/dropped and why. Explain what the procedure *cannot* do (specifically regarding aesthetic value and the "notoriety" factor).
      *   **Tone:** Practical, precise, empathetic to the admin burden, philosophically rigorous but accessible.

  2.  **Deconstruct the "Two Tracks" Insight:**

      *   *Track A: The Work Itself (Internal Ethics).* Is the artwork morally compromised *as an artwork*? Does the harm constitute the material? (e.g., burial goods, coerced footage).
      *   *Track B: The Platform (External Ethics).* Should the festival lend its cultural capital and money to this person/entity? (e.g., fraud conviction, past abuse unrelated to film).
      *   *The Fork:* We need to determine if the harm is *constitutive* (Track A) or *contextual* (Track B). This is the critical signpost.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Phase 1: Triage & Epistemics.* Before judging, what do we know? (Allegation vs. Conviction). Who knows? (Public vs. Private).
      *   *Phase 2: The Fork (Constitutive vs. Contextual).* This addresses the user's core philosophical hunch.
      *   *Phase 3: Track A (Constitutive Harm).* If the harm *is* the art. High bar for showing.
      *   *Phase 4: Track B (Contextual Harm).* If the harm is outside the art. Focus on platforming.
      *   *Phase 5: Mitigation & Disposition.* How to modify the showing (context, conditions) or pull it.
      *   *Sign-off Points:* Crucial for liability and board relations.

  4.  **Addressing Specific Complications:**

      *   *Collaborative:* Distinguish between key creative (director) and crew.
      *   *Split-Victim:* Prioritize the subject on screen (in documentary context) or the most vulnerable.
      *   *Timing:* Dead artists vs. living. Money flow.
      *   *Epistemic Muddle:* Need a threshold for "credible allegation" without requiring legal proof.
      *   *Taint-Value:* This is tricky. If the scandal *is* the draw, showing it with context might feed the beast. Needs a specific check.

  5.  **Refining the "Signpost":**

      *   Question: "Is the alleged harm materially present in the work?"
      *   Yes -> Track 1 (Integrity of the Object).
      *   No -> Track 2 (Integrity of the Platform).

  6.  **Developing the Test Cases:**

      *   *Case 1 (Vérité/Coercion):* Constitutive? Yes (relationship shaped the footage). Subject consent? Yes. Track 1. Result: Show with Context (subject's voice).
      *   *Case 2 (Animation/Fraud):* Constitutive? No. Track 2. Result: Show As Planned (unless brand risk is too high).
      *   *Case 3 (Installation/Burial):* Constitutive? Yes (stolen goods). Community objection? Yes. Track 1. Result: Pull/Destroy. (User said: "If the procedure gives her an answer on that third one that she won't like, say so plainly.") -> The procedure must say PULL, even if money is lost.

  7.  **Addressing the "Cannot Do" Section:**

      *   Can't judge aesthetic quality.
      *   Can't solve the "Notoriety Paradox" (where the sin makes the art valuable). The procedure can flag it, but can't resolve the moral hazard of profiting from scandal.

  8.  **Simplification Strategy (What to Drop):**

      *   Drop "Artistic Autonomism vs. Moralism" debate. It's theoretical, not operational.
      *   Drop "Proportional Punishment." We aren't a court.
      *   Drop "Slippery Slope" arguments. Focus on the immediate case.
      *   *Why:* The associate needs action, not theory. The board needs liability protection, not nuance.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the stage. Acknowledge the pressure.
      *   *The Procedure:* Use bolding for decision points. Clear "STOP" instructions.
      *   *The Sign-off:* Explicitly name the Festival Director or Board Chair for value judgments.
      *   *The Test Runs:* Walk through the logic.
      *   *The Limitations:* Be honest about the "Notoriety" problem.

  10. **Review against Constraints:**

      *   *48 hours?* Yes, needs to be quick.
      *   *No philosophy BA?* Keep language plain.
      *   *Board approval?* Build in the sign-off step.
      *   *Four dispositions?* Ensure the output matches.
      *   *Two tracks?* Make sure the fork is clear.

  11. **Final Polish:**

      *   Ensure the tone is professional but direct.
      *   Make sure the "Burial Site" case result is unambiguous (Pull).
      *   Check the "Epistemic Muddle" handling (Standard of Proof section).

  *(Self-Correction during drafting)*: I initially thought about putting the "Public Knowledge" check early. But actually, public knowledge affects *risk*, not *ethics*. I should put it in the mitigation phase. If the public doesn't know, showing it *makes* them know. That's a platforming decision. I'll move that to Track 2.
  *Correction on Track 1:* If the harm is constitutive (burial goods), public knowledge doesn't matter. The object is tainted.
  *Correction on Sign-off:* The user wants to know *who* signs off. I need to designate "Festival Director" for operational calls and "Board Chair" for reputational/financial loss calls.

  12. **Finalizing the "Cannot Do" section:**
      *   The user mentioned: "audience's knowledge of the artist is what makes the work worth showing." This is the *Posthumous Reputation* or *Scandal Value* problem. I need to name this clearly. It's the "Aura of Transgression."

  13. **Final Review of the Prompt's specific request:** "Tell me what you dropped and why it was safe to drop." I need a specific section for this.

  14. **Let's write.** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the procedure. It is designed to be printed as a two-page checklist. It separates the *integrity of the object* (Track A) from the *integrity of the platform* (Track B), as you requested. It forces a decision on the epistemic status of the allegation before moving to ethics, and it explicitly identifies where a human being must take responsibility for a value judgment.

  ### **The Festival Ethics Triage Protocol**

  **Purpose:** To determine the disposition of a scheduled work when ethical concerns arise regarding its creation or creator.
  **User:** Programming Associate.
  **Time Limit:** 45 minutes for initial assessment.
  **Outputs:** (1) Show As Planned, (2) Show With Context, (3) Show With Conditions, (4) Pull.

  ---

  #### **Phase 1: Epistemic Triage (The "Do We Know This?" Check)**
  *Before assessing harm, assess the reliability of the information. Do not proceed to Phase 2 until one box is checked.*

  **Q1. What is the status of the allegation?**
  *   **A. Legal Fact:** Conviction, civil judgment, or admitted guilt. -> *Proceed to Phase 2.*
  *   **B. Credible Allegation:** Reported by ≥2 reputable outlets, or supported by named witnesses, denied by artist. -> *Proceed to Phase 2.*
  *   **C. Rumor:** Anonymous social media posts, single uncorroborated source. -> **STOP.**
      *   *Disposition:* **Show As Planned.**
      *   *Note:* Monitor for escalation. Do not amplify unverified claims.

  **Q2. Is this information already public knowledge among your expected audience?**
  *   **A. Yes (High Profile):** The artist's reputation is already defined by this issue. -> *Proceed to Phase 2.*
  *   **B. No (Latent):** Screening this will be the primary vector by which the audience learns of the harm. -> *Proceed to Phase 2.*
      *   *Warning:* If **B**, you are not just programming a film; you are breaking news. This increases the burden for Phase 3.

  ---

  #### **Phase 2: The Fork (Constitutive vs. Contextual)**
  *This is the signpost. You must determine where the harm lives.*

  **Q3. Is the alleged wrongdoing materially constitutive of the work?**
  *(i.e., Does the work cease to exist or lose its primary function if the tainted element is removed? Was the harm necessary to create the footage/object?)*
  *   **YES:** (e.g., Footage filmed without consent, objects stolen from a grave, abuse captured on camera). -> **Go to Track A.**
  *   **NO:** (e.g., Director assaulted a crew member on a different project, artist committed fraud unrelated to funding, artist holds hateful views not expressed in work). -> **Go to Track B.**

  ---

  #### **Track A: Integrity of the Object (Constitutive Harm)**
  *The work itself is the site of the harm. Aesthetic merit is secondary to the rights of the harmed.*

  **Q4. Who was harmed, and are they identifiable?**
  *   **A. Subject/Community on screen or in the object:** -> *Continue Q5.*
  *   **B. Crew/Third Party:** -> *Treat as Track B (Contextual).* (See Note below*).
      *   *\*Note: If a crew member was abused to make this specific film, treat as Constitutive only if their labor is uncredited or coerced. Otherwise, treat as Contextual.*

  **Q5. What is the current position of the primary victim(s)?**
  *   **A. Unified Objection:** The victim/community explicitly requests the work be withdrawn or destroyed. -> **STOP.**
      *   *Disposition:* **Pull.**
      *   *Sign-off:* **Festival Director.** (Financial loss is secondary to consent).
  *   **B. Unified Consent:** The victim explicitly requests the work be shown (e.g., as testimony). -> *Continue Q6.*
  *   **C. Split/Unknown:** Victims disagree, or the community cannot be reached (e.g., historical burial site). -> **STOP.**
      *   *Disposition:* **Pull.** (In cases of split consent regarding constitutive harm, default to non-maleficence).
      *   *Sign-off:* **Board Chair.** (This is a reputational risk decision).

  **Q6. Can the harm be mitigated without destroying the work?**
  *(e.g., Redistributing fees, adding a disclaimer, changing the title)*
  *   **YES:** -> *Continue Q7.*
  *   **NO:** (e.g., The object *is* the stolen grave good; the footage *is* the coercion). -> **STOP.**
      *   *Disposition:* **Pull.** (You cannot platform stolen sacred objects regardless of consent).
      *   *Sign-off:* **Festival Director.**

  **Q7. Final Disposition for Track A.**
  *   If Victim Consents + Mitigation Possible: **Show With Conditions** (Fees redirected, explicit program note authored by victim).
  *   If Victim Consents + Mitigation Impossible: **Show With Context** (Panel discussion centering the ethics of the making).

  ---

  #### **Track B: Integrity of the Platform (Contextual Harm)**
  *The work is ethically sound, but the creator is not. The question is whether the festival should lend its capital to them.*

  **Q8. Does the wrongdoing directly contradict the Festival's mission?**
  *(e.g., A film about consent by a rapist; a film about financial justice by a fraudster)*
  *   **YES:** -> **STOP.**
      *   *Disposition:* **Pull.** (Hypocrisy risk outweighs artistic value).
      *   *Sign-off:* **Festival Director.**
  *   **NO:** -> *Continue Q9.*

  **Q9. Is the artist's notoriety a primary driver of ticket sales?**
  *(i.e., Are people coming *because* of the scandal?)*
  *   **YES:** -> **STOP.**
      *   *Disposition:* **Pull.** (Do not monetize scandal. This is the "Taint-Value" check).
      *   *Sign-off:* **Board Chair.** (This requires a values judgment on revenue vs. reputation).
  *   **NO:** -> *Continue Q10.*

  **Q10. Is the artist living and receiving direct financial benefit?**
  *   **YES:** -> *Continue Q11.*
  *   **NO:** (Artist deceased, or fees going to a studio/trust unconnected to the individual). -> *Continue Q11.*

  **Q11. Final Disposition for Track B.**
  *   If High Public Knowledge + Mission Contradiction: **Pull.**
  *   If Low Public Knowledge + No Mission Contradiction: **Show With Context** (Programme note acknowledging the allegation).
  *   If High Public Knowledge + No Mission Contradiction: **Show As Planned** (The audience is already equipped to judge).
  *   *Optional Condition:* In any "Show" outcome, you may attach **Show With Conditions** (Fees donated to relevant charity) if the artist is living and the harm is severe.

  ---

  ### **Test Runs**

  Here is how the protocol handles your three composites.

  **1. The Vérité Feature (Coercive Relationship)**
  *   **Phase 1:** Credible Allegation (Q1B). Public Knowledge: Low (Q2B).
  *   **Phase 2:** Is it constitutive? **YES.** The relationship shaped the access and the footage (Q3 Yes). Track A.
  *   **Track A:** Victim is the Subject (Q4A). Position? Subject wants it screened (Q5B). Can harm be mitigated? Yes, by centering the subject's voice (Q6 Yes).
  *   **Result:** **Show With Conditions.**
  *   **Conditions:** Director fee redirected to a domestic violence fund; Programme note written by the subject; Post-screening Q&A moderated by a third party, director absent.
  *   **Sign-off:** Festival Director.

  **2. The Animated Short (Financial Fraud)**
  *   **Phase 1:** Legal Fact (Conviction) (Q1A). Public Knowledge: Medium (Q2A).
  *   **Phase 2:** Is it constitutive? **NO.** The animation does not require fraud against family to exist (Q3 No). Track B.
  *   **Track B:** Mission Contradiction? No (Film is about grief, not finance) (Q8 No). Notoriety Driver? No (It's a short film) (Q9 No). Artist Living? Yes (Q10 Yes).
  *   **Result:** **Show With Context.**
  *   **Context:** A brief note in the programme acknowledging the conviction. No fee redirection required unless the Board wishes to be cautious, but ethically permissible to show.
  *   **Sign-off:** Programming Associate (within authority).

  **3. The Installation (Burial Site Objects)**
  *   **Phase 1:** Legal Fact/Credible Allegation (Q1A/B). Public Knowledge: Rising (Q2A).
  *   **Phase 2:** Is it constitutive? **YES.** The objects *are* the work. You cannot remove the taint without destroying the piece (Q3 Yes). Track A.
  *   **Track A:** Victim is the Community (Q4A). Position? Community asks for destruction (Q5A).
  *   **Result:** **PULL.**
  *   **Note on Financials:** The protocol dictates you lose the insurance money and the venue cost. The procedure prioritizes the rights of the dead/Community over the festival's budget.
  *   **Sign-off:** **Board Chair.** (Because this involves significant financial loss and potential legal fallout regarding the venue contract).
  *   **Comment:** You said if the answer is one she won't like, say it plainly. **She will not like this.** She has spent the insurance money. The protocol tells her she must eat that cost. There is no "Show With Context" for desecrated graves. To show it is to participate in the desecration.

  ---

  ### **Simplification Notes: What Was Dropped**

  To make this runnable by a non-philosopher in 48 hours, I excised the following:

  1.  **The Distinction Between "Artist" and "Art":** I dropped the theoretical debate on whether the art is *ontologically* tainted. The protocol treats this as a binary operational check (Constitutive vs. Contextual). It doesn't matter *why* the harm matters, only *where* it sits.
  2.  **Proportional Punishment:** I removed the idea of scaling the punishment to the severity of the crime. The festival is not a court. The scale is based on *risk to the festival* and *harm to the victim*, not on retributive justice for the artist.
  3.  **The "Dead Artist" Nuance:** In Track B, I collapsed the "Dead vs. Alive" distinction into "Financial Benefit." Whether an artist is dead matters less than whether their estate or legacy is being monetized in a way that glorifies the harm.
  4.  **Audience Moral Development:** I dropped the question of "Will showing this educate the audience?" This is too speculative. The protocol assumes the audience is either already aware (and can judge) or unaware (and you are breaking news).

  **Why this was safe:** Your associate does not need to justify the *philosophy* of the decision to the board; she needs to justify the *risk profile*. These distinctions map directly to liability and reputation, which is what the board cares about.

  ---

  ### **Limitations: What This Procedure Cannot Do**

  You asked me to name the deeper things this tool cannot resolve.

  **1. It cannot judge Aesthetic Value.**
  The procedure assumes the work is worth showing if ethical hurdles are cleared. It cannot tell your friend if the film is *good*. If a film is ethically clean but artistically bankrupt, this protocol says "Show As Planned." That is a programming failure, but not an ethical one.

  **2. It cannot resolve the "Aura of Transgression" (The Notoriety Paradox).**
  You identified this as cases where "the audience's knowledge of the artist is what makes the work worth showing." The protocol flags this in Track B, Question 9, and defaults to **Pull**.
  *   **The Limitation:** This is a blunt instrument. It assumes monetizing scandal is always wrong. It cannot distinguish between *exploiting* a scandal and *interrogating* it. If the film is *about* the scandal, and the scandal is the point, the protocol may force a Pull on a work that is actually a critical examination of the harm.
  *   **Why:** Distinguishing between "profiting from sin" and "examining sin" requires a level of curatorial nuance that a checklist cannot capture. In those ambiguous cases, the protocol forces a **Board Chair Sign-off**. It kicks the can to a human because the algorithm cannot measure irony or critical distance.

  **3. It cannot predict the "Streisand Effect."**
  In the Burial Site case (Test Run 3), the protocol says Pull. However, pulling the work might generate more publicity for the desecration than showing it would have. The protocol cannot calculate media dynamics. It prioritizes ethical consistency over media strategy. Your friend must accept that doing the right thing might sometimes look like a PR disaster.

  **4. It cannot heal the Epistemic Muddle.**
  In Phase 1, if the answer is "Rumor," the protocol says "Show." This is necessary for legal safety (avoiding libel), but it may be ethically fragile. If the rumor is true but unproven, you have platformed an abuser. The protocol protects the *Festival* from liability, but it does not guarantee protection for potential future victims. It is a risk management tool, not a truth commission.
