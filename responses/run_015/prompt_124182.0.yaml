answer: |-
  **MEMORANDUM**

  **TO:** Elections and Referenda Committee
  **FROM:** Graduate Representative
  **DATE:** Monday, January 29
  **SUBJECT:** Recommendation on Electorate Definition and Participation Rules for April Referendum

  **Purpose**
  We are treating electorate eligibility and participation compulsion as separate agenda items. They are not. Both questions ask the same thing: *What is the nature of the obligation between the individual and the university?* If the obligation is purely financial (you pay the fee, you decide the fee), eligibility should be broad and compulsion low. If the obligation is civic (you are a member of a polity), eligibility should be narrow and compulsion high. We cannot have it both ways. This memo recommends a consistent pair of rules that satisfies the Board's requirement for a one-paragraph justification while avoiding the creation of second-class membership tiers.

  **1. Eligibility Recommendation: The Fee Liability Standard**
  **Rule:** Eligibility extends to all individuals currently billed the mandatory semester fee for the Spring term. There is **no** minimum duration threshold (0 semesters prior); age and residence are not factors.
  **Application to Pending Groups:**
  *   **16-17 Dual-Enrollment:** **In.** They are billed the fee and subject to the conduct code.
  *   **International Undergrads:** **In.** They are billed the fee. Visa status is irrelevant to fee liability.
  *   **Housing Residents (Non-Staff/Student):** **Out.** They pay rent, not the mandatory semester fee. This resolves the documentation risk for undocumented residents without requiring the committee to adjudicate immigration status.
  *   **Absentees on Leave:** **In,** provided they retain enrolled status and are billed the fee. If the fee is waived during leave, they are out.

  **Board Justification:** "The electorate is defined by financial liability: anyone billed for the fee decides its fate. This ensures those who pay consent to the charge, aligning with standard governance practices for fee-based referenda."

  **2. Participation Recommendation: Automatic Registration with Formal Abstention**
  **Rule:** Option (b). The university automatically registers all eligible individuals from enrollment and payroll rolls. A failure to vote is recorded as a formal abstention and included in the denominator for turnout calculations. No penalties for non-participation.
  **Reasoning:** We cannot compel civic duty from transient members. International students and dual-enrollment minors are subject to the fee, but their tenure is precarious or temporary. Compelling them to vote (Option C) asserts a level of membership ownership they do not possess and cannot safely exercise (see housing resident documentation risks). However, doing nothing (Option A) leaves us with the legitimacy crisis of 11% turnout. Automatic registration fixes the denominator so we know exactly what "majority" means, without coercing those whose stake is partial.

  **3. The Link: Why These Rules Hang Together**
  If we define the electorate by fee liability, we acknowledge the bond is transactional. You cannot impose a civic penalty (fine/hold) for failing to participate in a transaction. Conversely, if we wished to compel participation, we would need to narrow eligibility to long-term members (e.g., excluding anyone with <2 years remaining), which would disenfranchise those actually paying the bill. This package maintains consistency: **Broad inclusion based on payment, soft participation based on transient status.**

  **4. The Weighted Vote Proposal (Duration Principle)**
  The Faculty Representative's proposal to weight votes by expected remaining years is the strongest theoretical challenge to this memo. It correctly identifies that a first-year student bears more cumulative risk from a decarbonization fee than a graduating senior.
  **Cost of Rejection:** By rejecting weighted votes, we accept that a student graduating in May has equal say on a 10-year debt as a freshman. We prioritize administrative feasibility and equal standing over precision of stake.
  **The Real Worry:** The committee's gut reaction against weighted votes is correct, but for the wrong reason. The issue is not math; it is caste. Weighted votes create a formally second-class tier of members. A mandate manufactured out of compulsory abstentions is worse than an honest 14% turnout because it legitimizes a hierarchy of membership. If we cannot justify equal votes, we cannot justify a binding referendum at all.

  **5. Strongest Case Against This Recommendation**
  I anticipate two objections that may prevail over this draft:
  1.  **Legitimacy Risk:** If turnout remains low (e.g., 20%) despite automatic registration, we have still authorized a binding fee with weak active consent. By counting abstentions in the denominator, we make passing the referendum harder, potentially killing a popular measure due to apathy.
  2.  **Transient Tyranny:** Including short-term actors (16-17s, one-year visitors) allows them to impose long-term costs on the institution they will immediately leave. The "Fee Liability" rule protects the payers, but not the university's future.
  *If the committee believes long-term institutional stability outweighs payer consent, we must narrow eligibility to those with >2 years remaining and compel voting. I recommend against this, but it is the only coherent alternative.*

  **6. Timeline**
  *   **February 1:** Rules locked and published.
  *   **April 15:** Referendum held.
  *   **May 15:** Committee review. If turnout <20% or legal challenge filed, rules revert to previous standard pending Board review. Changes require 2/3 committee vote.

  \answer{Eligibility extends to all individuals billed the mandatory semester fee; participation shall be automatic registration with non-votes recorded as formal abstentions.}
