answer: |-
  This is a classic frustration in Kantian ethics. Your debate partner is committing a category error that is so common it has a name in the literature: the **Consequentialist Misreading of the Categorical Imperative**. They are treating Kant's test as a form of Rule Utilitarianism ("If everyone did this, would the results be bad?") rather than a test of rational consistency ("Can this principle coexist with itself as a law of freedom?").

  To dismantle this, we need to open the "black box" of the slogan *"Act only according to that maxim whereby you can at the same time will that it should become a universal law."*

  Here is a menu of the precise philosophical readings this slogan could stand for, ranked from "Philosophically Invalid" to "Robustly Kantian," along with how each applies to your sweatshop debate.

  ### 1. The Empirical Generalization Reading (Your Partner's View)
  *   **The Principle:** "Act only if the *empirical consequences* of everyone performing this action would be desirable (or at least not catastrophic)."
  *   **The "Universal":** A statistical universal. It asks us to imagine a world where 100% of agents physically perform action $X$ simultaneously.
  *   **What it Checks:** Causal outcomes. It checks for collective harm, tragedy of the commons, or systemic collapse.
  *   **Kantian Status:** **Spurious.** Kant explicitly rejects grounding morality on empirical consequences (happiness, welfare, economic stability). For Kant, morality must be *a priori* (independent of experience). If the moral law depends on whether economies collapse, it is hypothetical ("If you want a stable economy, don't boycott"), not categorical.
  *   **Verdict on Boycott:** Under this reading, your partner is technically consistent, but they are not doing Kantian ethics; they are doing Rule Utilitarianism. They argue the boycott fails because the *outcome* (economic collapse) is bad.
  *   **Counter:** You can reject this reading entirely. Kant is not concerned with the *causal* side effects of universalization, but the *normative* validity of the principle.

  ### 2. The Logical Contradiction in Conception Reading (Perfect Duties)
  *   **The Principle:** "Act only if your maxim can be conceived as a universal law of nature without generating a logical contradiction."
  *   **The "Universal":** A law of nature (like gravity, but for free agents).
  *   **What it Checks:** Internal coherence. Does the action rely on a non-universalizable exception to work? (Classic example: False promising. If everyone falsely promised, the institution of promising would vanish, making the act impossible.)
  *   **Kantian Status:** **Valid (for Perfect Duties).** This is the strictest test, usually reserved for duties like "do not lie" or "do not steal."
  *   **Verdict on Boycott:** This is where your partner's argument tries to hide. They claim a "practical contradiction": If everyone boycotts, the market vanishes, so buying/selling becomes impossible.
  *   **Counter:** This misidentifies the **Maxim**. The maxim is not "I will boycott." The maxim is "I will purchase goods produced by exploitative labor."
      *   *Test:* Can I will a universal law where *everyone purchases goods produced by exploitative labor*?
      *   *Result:* This does not generate a *logical* contradiction. A world of universal exploitation is logically conceivable (however horrific). Therefore, this specific test might not condemn buying sweatshop goods on its own. This is why we need the next reading.

  ### 3. The Contradiction in the Will Reading (Imperfect Duties & Rational Agency)
  *   **The Principle:** "Act only if a rational being could *will* this maxim as a universal law without contradicting their own rational nature."
  *   **The "Universal":** A system of rational volition.
  *   **What it Checks:** Volitional consistency. Even if the world is logically *possible*, can a rational agent *want* to live in it? Does universalizing this maxim undermine the necessary ends of rational agency (e.g., developing one's talents, preserving one's dignity, being helped by others)?
  *   **Kantian Status:** **Valid (for Imperfect Duties).** This covers duties of beneficence and self-development. It acknowledges that some maxims are logically possible but rationally unwilable.
  *   **Verdict on Boycott:** **This condemns buying sweatshop goods.**
      *   *The Argument:* As a rational agent, I necessarily will that my own humanity (and the humanity of others) be treated as an end, not merely a means. I cannot rationally will a universal law of nature where it is permissible to treat workers as mere tools for cheap consumption, because I must will that *I* am not treated that way. To will a system of universal exploitation is to will the degradation of the very rational agency that makes morality possible.
      *   *Addressing the "Collapse" Objection:* The economic collapse is irrelevant. What matters is that I cannot *will* the principle of exploitation. The fact that boycotting might hurt an economy is an empirical side-effect; the *principle* of refusing to participate in exploitation is rationally required.

  ### 4. The "Law of Nature" Systemic Coherence Reading (Korsgaard/O'Neill Interpretation)
  *   **The Principle:** "Act only if your maxim fits into a coherent system of laws governing a 'Kingdom of Ends'."
  *   **The "Universal":** A harmonious system of free agents.
  *   **What it Checks:** Systemic compatibility. Does my action rely on a background system of trust/cooperation that my action undermines?
  *   **Kantian Status:** **Valid (Modern Reconstruction).** This is a sophisticated reading favored by contemporary Kantians like Christine Korsgaard and Onora O'Neill.
  *   **Verdict on Boycott:**
      *   Your partner argues the boycott undermines the economic system.
      *   *Counter:* The *buying* undermines the moral system. A "Kingdom of Ends" is a community where members legislate laws respecting each other's dignity. Buying sweatshop goods relies on a system that violates this. You cannot will your maxim ("I buy cheap goods via exploitation") as a law for a Kingdom of Ends, because that Kingdom presupposes respect for persons.
      *   *On the Collapse:* If the economy collapses because people stop treating humans as tools, that is not a moral failure; that is the correction of an immoral system. Kant would not accept "economic stability based on exploitation" as a valid reason to fail the test.

  ### 5. The Publicity/Transparency Reading
  *   **The Principle:** "Act only on a maxim that you could publicly announce without defeating your own purpose."
  *   **The "Universal":** Public knowledge.
  *   **What it Checks:** Hypocrisy and deception.
  *   **Kantian Status:** **Derivative.** Often linked to the Formula of Universal Law in Kant's *Perpetual Peace*.
  *   **Verdict on Boycott:**
      *   If you announce, "I buy these goods because I don't care about the workers' dignity," you reveal a maxim that no rational community would accept.
      *   If your partner announces, "I buy these goods, but if everyone did, the economy would crash, so I'm glad everyone doesn't," they reveal they are making an exception for themselves (Free Riding). They benefit from the *non-universality* of their action.

  ---

  ### How to Deploy This in Your Debate

  Your partner is stuck on **Reading #1 (Empirical Consequences)**. You need to shift the debate to **Reading #3 (Contradiction in the Will)** and correct the **Maxim Formulation**.

  **Step 1: Correct the Maxim**
  Tell your partner: "You are testing the wrong maxim. The Categorical Imperative tests the principle of the action I am *proposing*, not the principle of the action I am *refusing*."
  *   **Wrong Maxim (Partner's focus):** "I will boycott sweatshop goods."
  *   **Right Maxim (Your focus):** "I will purchase goods produced by exploitative labor to save money."
  *   *Why this matters:* We test the action we are tempted to do (buying), not the restraint (boycotting).

  **Step 2: Distinguish Logic from Causality**
  Tell your partner: "Kant's test is not a disaster simulation. It is not asking 'What happens if everyone does this?' It is asking 'Is this principle compatible with rational agency?'."
  *   The fact that an economy might collapse is a *causal* prediction (empirical).
  *   The question of whether I can *will* the exploitation of workers is a *normative* question (rational).
  *   Even if the economy collapsed, if the principle is "Treat humans as ends," I must will that principle regardless of the economic cost. To say "I can't will this because the economy would crash" is to make morality dependent on economics, which Kant forbids.

  **Step 3: The "Free Rider" Trap**
  Point out that your partner's argument implies: "It is good for *me* to boycott (or buy), but bad for *everyone* to do so."
  *   If they say "It's bad for everyone to boycott," they are admitting the action relies on being the *exception*.
  *   If they say "It's bad for everyone to buy," then they agree with you!
  *   Kant's test forbids making an exception for oneself. If the maxim "Buy exploitative goods" cannot be universalized (because you wouldn't want to be the worker), you cannot do it, even if your individual purchase doesn't change the market.

  ### Summary for your Counter-Argument
  "You are applying a Utilitarian test (calculating economic outcomes of universal adoption) and calling it Kantian. Kant's test asks if I can *rationally will* the principle of my action as a law for all.
  1.  **Maxim:** 'I will treat workers as mere means to my savings.'
  2.  **Test:** Can I will a world where this is a universal law?
  3.  **Result:** No. As a rational being, I must will that I am treated as an end. I cannot consistently will a law that permits treating humans as tools, even if following that law hurts the economy. The economic collapse is an empirical side-effect; the violation of human dignity is a contradiction in the will."

  This moves the goalposts from "Will the economy survive?" (which is not a moral question for Kant) to "Can I rationally will this principle?" (which is).
