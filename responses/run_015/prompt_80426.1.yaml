  5.  **Addressing the Specific "Economic Collapse" Objection:**
      *   This is the "Ideal World Objection" or "Disaster Objection."
      *   Kantian Reply: The test isn't "What if everyone did this *tomorrow*?" It's "Is the *principle* of my action fit to be a law?"
      *   Also, the maxim needs to be formulated correctly. Is the maxim "I will boycott to protest injustice" or "I will boycott to destroy economies"? The partner is attacking a straw maxim.
      *   The "Economic Collapse" argument assumes the *consequence* invalidates the *principle*. Kant says the *principle* validates the action regardless of consequence.

  6.  **Structuring the Response:**
