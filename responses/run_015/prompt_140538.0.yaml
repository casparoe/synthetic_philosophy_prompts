      *   The "Warming" analogy is the strongest test case. Climate science acknowledges different metrics (surface air, ocean heat, etc.). Sometimes they diverge (e.g., "hiatus" periods where air temp stalls but ocean heat rises). Yet, scientists say "the world is warming" is a fact. Why? Because there is a *latent construct* (global energy imbalance) that explains the correlation of these indicators, even if they diverge temporarily or due to noise.
