      *   *Idea 2:* Policymakers shouldn't trust policy levers derived from unrealistic micro-behaviors.
      *   *Idea 3:* Models should be judged on mechanism, not just output matching.
      *   *Idea 4:* Risk of unintended consequences if agents don't behave as modeled.
      *   *Idea 5:* Need for robustness checks across different behavioral assumptions.

