      *   Friedman argued that the realism of assumptions doesn't matter; only the predictive accuracy of the theory matters.
      *   Applying this to ABMs: If the model predicts warming curves correctly despite unrealistic agent behavior (perfect optimization), Friedman would say the model is valid for prediction.
