answer: |-
  There is no single, universally standardized noun for this exact configuration, but it is a recognized structural position in contemporary value theory and normative ethics. The closest established technical description is **Threshold Lexicality** (or a **Lexical Threshold View**) applied to negative welfare.

  In the context of your novel, you are describing a hybrid system that combines **Consequentialism** (below the line) with **Deontological Constraints** (above the line), triggered by a specific magnitude of experience.

  Here is a breakdown of the philosophical lineage, the distinctions you requested, and a proposal for precise boundary conditions to ensure conceptual rigor in your narrative.

  ### 1. Established Philosophical Terminology

  While your society might have its own slang, the academic labels for this structure are:

  *   **Value Discontinuity:** This is the broadest term. It denotes a break in the continuous mapping of value. In your system, the function mapping "intensity of suffering" to "moral weight" is continuous up to point $T$, and discontinuous (jumping to infinity or absolute veto) at point $T$.
  *   **Lexical Prioritarianism (regarding Suffering):** "Lexical" comes from lexicography (dictionary ordering). Just as the letter 'A' comes before 'B' regardless of how many 'B's you have, a "lexical" value cannot be outweighed by a lower-order value. Your system posits that *abyssal anguish* is lexically prior to *pleasure*.
  *   **Threshold Deontology:** Traditionally, this view holds that moral rules (e.g., "do not kill") apply until a certain threshold of bad consequences is reached, at which point consequentialism takes over. Your system is the **inverse**: Consequentialism applies until a threshold of bad consequences is reached, at which point an absolute rule kicks in. Some philosophers refer to this specifically as **"Consequentialism with a Side Constraint"** or **"Hybrid Threshold View."**

  **The Most Precise Label:**
  If you wish to ground your world-building in real philosophical discourse, the most accurate term is **The Lexical Threshold View on Suffering**. It is often discussed in **Population Ethics** (specifically regarding Derek Parfit's *Repugnant Conclusion* and the *Sadistic Conclusion*), where philosophers debate whether a vast number of mild pains can outweigh one instance of extreme torture. Your society has answered "No," but only once the torture crosses a specific intensity line.

  ### 2. Distinguishing the Structure

  To render the calculus rigorously, you must distinguish it from its neighbors. The distinction lies in the **mathematics of trade-offs**.

  | View | Mathematical Structure | Moral Implication |
  | :--- | :--- | :--- |
  | **Classical Utilitarianism** | Continuous Function ($f(x) = x$) | All experiences are commensurable. 1 unit of agony can always be offset by enough units of joy. No "forbidden" zones, only net negatives. |
  | **Absolute Deontology** | Constant Prohibition ($f(x) = \text{undefined}$) | Certain acts/states are forbidden regardless of intensity or context. (e.g., "Torture is wrong" even if the torture is mild). |
  | **Your System (Lexical Threshold)** | **Piecewise Function** <br> If $S < T$: $V = -S$ (Tradable) <br> If $S \ge T$: $V = -\infty$ (Veto) | **The Cliff Edge.** A suffering of intensity $T - \epsilon$ is a cost to be weighed. A suffering of intensity $T + \epsilon$ is a system-crashing error that no amount of positive value can cancel. |

  **The Crucial Nuance:**
  The philosophical tension in your society will revolve around the **precision of $T$**. In Classical Utilitarianism, margins are fuzzy but safe (everything trades). In Deontology, margins are fuzzy but safe (everything is forbidden). In your system, the margin is **dangerous**. A citizen or algorithm must know exactly whether a specific pain is at 99.9% or 100.1% of the threshold, because the moral status changes from "regrettable cost" to "unforgivable crime" instantly.

  ### 3. Boundary Conditions for Narrative Rigor

  To avoid logical paradoxes (specifically the **Sorites Paradox** or "Paradox of the Heap"), you must define how the threshold applies. Here are the three critical boundary conditions you should define for your calculus:

  #### A. The Locus of the Threshold (Individual vs. Aggregate)
  Does the threshold apply to a single conscious moment, a single life, or the total sum across a population?
  *   **Individual Peak (Recommended):** The veto triggers if *any single individual* experiences anguish $\ge T$. This preserves human rights intuition.
  *   **Aggregate Sum:** The veto triggers if the *total sum* of anguish in the society crosses $T$. This is dangerous for a narrative because it allows the "distributed torture" loophole (inflicting sub-threshold pain on millions to generate vast pleasure).
  *   **Recommendation:** For maximum dramatic tension, define it as **Individual Peak Intensity**. This prevents the society from sacrificing one person to the "abyss," but allows them to risk many people to "moderate" pain.

  #### B. Temporal Duration vs. Instantaneous Intensity
  Is the threshold defined by the *peak intensity* of the pain, or the *integrated total* (intensity $\times$ duration)?
  *   **Peak Intensity:** A momentary flash of "abyssal anguish" triggers the veto, even if it lasts only a second.
  *   **Integrated Total:** One could endure "just below threshold" pain for a thousand years without triggering the veto.
  *   **Narrative Implication:** If it is based on **Peak Intensity**, your society will be obsessed with anesthetics and memory suppression to ensure no conscious mind ever *registers* the threshold, even if the physical damage occurs. If it is based on **Duration**, they will be obsessed with time-limiting punishments.

  #### C. The Epistemic Margin (The "Safe Zone")
  Since no measurement is perfect, does the calculus include a margin of error?
  *   **Hard Line:** If the probability of crossing $T$ is $>0\%$, the act is forbidden. (This leads to paralysis/risk-aversion).
  *   **Confidence Interval:** The act is forbidden only if we are $95\%$ certain the anguish will exceed $T$.
  *   **Narrative Utility:** A "Hard Line" creates a society terrified of edge cases. A "Confidence Interval" creates a bureaucracy that argues over statistics while people suffer.

  ### 4. Suggested Coinages for the Novel

  If you prefer a fictional technical term that sounds native to your society's calculus, consider these options based on the philosophical concepts above:

  1.  **The Discontinuity:** Simple, mathematical. *"You cannot approve this; it risks hitting the Discontinuity."*
  2.  **Lexical Zero:** Implies that once crossed, the net value of the universe becomes zero (or null) regardless of positives.
  3.  **The Absolute Floor:** Suggests a depth below which the calculus stops digging.
  4.  **Omega-Negative:** Borrowing from set theory (Omega), implying the end of the countable numbers.
  5.  **The Incommensurability Barrier:** A mouthful, but precise. It signals that above this line, the currencies no longer exchange.

  ### 5. Summary for World-Building

  To summarize the logic for your internal consistency:

  *   **Name:** The Lexical Threshold View (or **Threshold Lexicality**).
  *   **Logic:** Consequentialist aggregation holds for all values $v$ where $|v| < T$. For any experience $e$ where suffering $(e) \ge T$, the utility function returns $-\infty$.
  *   **Distinction:** Unlike Deontology, it permits suffering below $T$. Unlike Utilitarianism, it forbids trade-offs above $T$.
  *   **Critical Flaw (for plot):** The **Boundary Problem**. Since pain is subjective, who defines when $T$ is reached? If a citizen claims they crossed the threshold, does the system believe them? This creates a potential conflict between **phenomenological truth** (what I felt) and **algorithmic measurement** (what the sensors read).

  This structure provides a robust ethical engine for your story: it is rational enough to seem functional, but brittle enough at the threshold to generate significant moral conflict.
