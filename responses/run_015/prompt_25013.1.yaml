          *   *The Problem:* This makes the discount contingent on *evidence of risk reduction*, not the *moral gesture* itself. It might look colder/calculating.
          *   *The "Performative" Risk:* Caruso might worry about fake remorse. A desert system accepts the moral truth of the gesture; a risk system needs empirical proof of safety.
