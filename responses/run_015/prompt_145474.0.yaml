answer: |-
  **Step One: Argument Selection**

  1.  **The Division Problem:** *Real:* Elected leaders represent voters, not non-voters. *Exaggeration:* Campaigning inherently creates enemies; therefore, the Head of State must never have sought power or expressed preference.
  2.  **The Training Problem:** *Real:* Monarchs are trained from youth. *Exaggeration:* Adults (even randomly selected ones) are "contaminated" by prior opinions; only an infant designated at birth can be raised in a "purpose-built constitutional environment" (Incubation Clause).
  3.  **The Reserve Powers Problem:** *Real:* Powers exist to be rarely used. *Exaggeration:* Legitimacy is highest when use is impossible. Assent becomes automatic after 30 days, making refusal theoretically possible but practically null.
  4.  **The Convention Problem:** *Real:* Neutrality is enforced by tradition. *Exaggeration:* Admit convention is weak, propose budgetary controls on upbringing to enforce neutrality mechanically.

  **Draft Closing Lines**

  1.  Submissions concerning the dynastic eligibility criteria must be lodged prior to the dissolution of the current Assembly.
  2.  The Department will review all objections to the biological continuity provisions by the next fiscal cycle.
  3.  Stakeholders are advised that the transition period assumes full compliance with the Incubation Clause.

  ***

  **The Head of State (Hereditary Selection) Bill: A Consultation Paper**

  **1. Selection Methodology and the Incubation Clause**

  1.1. The Government recognises that direct election of the Head of State introduces unavoidable factionalism. A candidate who secures fifty-per-cent-plus-one of the vote inherently represents a majority coalition, leaving the minority without symbolic representation. To restore unity, the Office must be held by an individual who has never campaigned, solicited support, or articulated policy preferences.

  1.2. Alternative selection methods, including sortition (random selection of citizens), were considered but rejected. A randomly selected adult arrives at the Office with an established electoral history, financial entanglements, and fixed opinions. By contrast, an infant designated at birth possesses no prior political contamination. Accordingly, Clause 4 establishes the Incubation Clause, mandating that the successor be identified at birth and raised within a purpose-built constitutional environment. This ensures political neutrality is instilled before cognitive autonomy develops.

  1.3. Regarding the timing of designation, a senior constitutional adviser noted: "The legitimacy of the Office derives not from the consent of the governed, but from the inability of the governed to have influenced the selection."

  **2. Reserve Powers and Automatic Assent**

  2.1. The reserve powers of the Head of State are retained to preserve the efficient functioning of the legislature. However, historical precedent suggests that the legitimacy of these powers is inversely proportional to their frequency of use. To maximise stability, the Bill proposes that royal assent become self-nullifying after thirty days.

  2.2. Under this mechanism, refusal remains possible in principle, satisfying constitutional theory, but becomes impossible in practice, satisfying operational continuity. This design virtue ensures that while the Head of State retains the theoretical capacity to block legislation, the automatic passage of bills prevents any actual obstruction. The reserve powers thus function as a dormant safeguard rather than an active tool.

  **3. Neutrality and Upbringing Costs**

  3.1. It is acknowledged that conventional monarchical neutrality relies solely on social convention, which offers no legal enforcement mechanism. To rectify this vulnerability, the Bill introduces statutory oversight of the heir's upbringing. Neutrality will be enforced through curated education and restricted access to partisan media.

  3.2. The financial implications of this structured upbringing are outlined in Budget Line 3.4.b (Upbringing Allowance), estimated at $4.2 million annually. This covers the costs of constitutional tutors, isolation from partisan discourse, and the maintenance of the designated residential facility. While convention alone is insufficient, budgetary control provides a tangible method to ensure the Head of State remains insulated from factional pressure.

  **Annex A: Structural Harmonisation**

  A.1. The logic underpinning the hereditary Head of State—specifically, that distance from electoral cycles enhances impartiality—generalises to other constitutional bodies. The Consultation Paper invites feedback on extending hereditary selection or expanded ceremonial grandeur to the Second Chamber and the Central Bank Governorship.

  A.2. Removing electoral accountability from the Central Bank would further insulate monetary policy from short-term populist pressure. Similarly, a hereditary Second Chamber could provide a permanent repository of institutional memory, unaffected by shifting public opinion. Stakeholders are asked to consider whether the dignified portion of the constitution should be expanded to absorb greater political risk, leaving the efficient portion free to operate without legitimacy deficits.

  A.3. Responses regarding the lineage validation protocols are due by the end of the consultation period.
