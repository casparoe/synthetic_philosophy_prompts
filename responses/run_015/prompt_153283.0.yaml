      *   **The "Solutions" & Misconceptions (20 mins):** Address the student objections here as potential ways out.
      *   **Conclusion & Assessment (10 mins):** The final question.

  4.  **Refining the Content:**

      *   *Order:* Confirm Semantic first. Why? Because Standard Semantics (truth conditions) $\rightarrow$ Platonism $\rightarrow$ Epistemic Problem. If you reject Standard Semantics, you avoid Platonism, and the Epistemic problem vanishes. So Semantic is the gateway.
