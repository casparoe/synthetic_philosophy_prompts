answer: |-
  Here is a 90-minute seminar plan designed for second-years with Frege/Kripke background but no philosophy of maths.

  ### 1. Strategic Overview: The Order of Horns
  Your instinct is correct: **The Semantic Horn must land first.**
  *   **Why:** The Epistemic Horn (how can we know abstract objects?) only bites if you have already accepted the Semantic Horn (mathematical sentences are true because they refer to abstract objects). If you reject the semantic story (e.g., "maths isn't literally true" or "numbers are just useful fictions"), the epistemic problem dissolves.
  *   **The Narrative Arc:**
      1.  **Standard Semantics:** We treat math talk like ordinary talk (Frege/Kripke style).
      2.  **Ontological Commitment:** Therefore, numbers are objects (Platonism).
      3.  **Epistemic Constraint:** But our best theory of knowledge requires causal contact (Kripke/Putnam style).
      4.  **The Clash:** Abstract objects have no causal powers.
      5.  **The Dilemma:** You can't have both Standard Semantics and a Causal Epistemology.

  ### 2. The Example: Fixing Von Neumann vs. Zermelo
  Your worry is spot on: students often dismiss this as "notational variance." To prevent this, you must frame it as an **identity crisis**, not a notation issue.

  *   **The Setup:** Don't present them as ways to *write* numbers. Present them as competing *reductions*. If arithmetic is to be grounded in set theory (to avoid mystery), numbers must *be* sets.
  *   **The Killer Fact:** It's not about the symbol '2'. It's about membership relations.
      *   In Von Neumann: $2 = \{\emptyset, \{\emptyset\}\}$. Here, $1 \in 2$ is **true**.
      *   In Zermelo: $2 = \{\{\emptyset\}\}$. Here, $1 \in 2$ is **false** (since $1 = \{\emptyset\}$).
  *   **The Point:** If numbers *are* sets, one of these must be the *fact* of the matter. But arithmetic doesn't care. There is no arithmetical fact about whether $1 \in 2$. Therefore, numbers cannot *be* sets.
  *   **Generalise:** If it's not sets, what is it? Any specific object identification leads to arbitrary truths. This pushes them toward "numbers are abstract objects" (to avoid arbitrary set-identities), which sets up the Epistemic Horn.

  ### 3. Session Timeline (90 Minutes)

  #### **0–10 mins: Setup & The Frege/Kripke Hook**
  *   **Goal:** Connect to what they know.
  *   **Activity:** Briefly recap Frege (names refer to objects) and Kripke (reference fixed by causal history).
  *   **Move:** "We treat 'London' as referring to a city. We treat '7' as referring to a number. Grammatically, '7 is prime' looks like 'London is big'. This is the **Homogeneity Constraint**: mathematical language works like ordinary language."
  *   **Absorb Misconception ("Platonism vs Nominalism"):** If a student says "This is just Platonism," reply: "Exactly. Benacerraf isn't attacking Platonism yet; he's showing that *if* you accept standard semantics (which leads to Platonism), you trigger a problem. We are starting with the assumption that maths is literally true."

  #### **10–35 mins: The Semantic Horn (The Identification Problem)**
  *   **Goal:** Show that identifying numbers with specific objects is arbitrary.
  *   **Activity:** Walk through Von Neumann vs. Zermelo on the board. Focus on the $1 \in 2$ discrepancy.
  *   **Key Question:** "Which set is the *real* number 2? If you say 'both', you violate logic (identity is transitive). If you say 'neither', what are numbers?"
  *   **Absorb Misconception ("Notation is arbitrary"):** "It's not notation. It's ontology. If I say 'Water is H2O', that's a fact, not notation. If we say '2 is {∅,{∅}}', that claims to be a fact. Benacerraf shows this 'fact' has no arithmetic consequence."
  *   **Absorb Misconception ("Maths Student: Only what they do"):** This student is rejecting the Semantic Horn. **Validate them.** "This is a brilliant move. You are suggesting **Instrumentalism**. If numbers are just tools, we don't need to know what they *are*. But the cost is: '7 is prime' isn't *true*, it's just *useful*. Are you willing to say maths isn't true? If you want maths to be *true*, you need objects. If you need objects, you face the next horn."

  #### **35–60 mins: The Epistemic Horn (The Access Problem)**
  *   **Goal:** Show that abstract objects are unknowable.
  *   **Activity:** Invoke Kripke/Putnam. How do we know about London? Causal interaction. How do we know about electrons? Causal interaction (detectors).
  *   **The Problem:** Abstract objects (by definition) are outside space and time. They cannot causally interact with brains.
  *   **The Dilemma:**
      1.  To be true, math needs abstract objects (from Horn 1).
      2.  To be known, objects need causal contact (from Kripke).
      3.  Abstract objects have no causal contact.
      4.  Therefore, we cannot know math. (But we *do* know math).
  *   **Absorb Misconception ("Intuition"):** "We grasp them by intuition." **Reply:** "This was Gödel's view. But compare it to Kripke. Causal theory explains *reliability* (why my belief tracks the truth). 'Intuition' sounds like magic. How does a non-spatial object tweak a spatial brain? If you can explain the mechanism, you solve the dilemma. If not, it's a mystery."

  #### **60–80 mins: Synthesis & The "Structuralist" Escape**
  *   **Goal:** Show how modern philosophy tries to live with the dilemma.
  *   **Activity:** Discuss the most popular solution: **Structuralism**.
  *   **Explanation:** Numbers aren't objects; they are *positions* in a structure. '2' is just the successor of '1'.
  *   **Absorb Misconception ("Fine, numbers are positions"):** "This solves the Semantic Horn (no arbitrary identity). But does it solve the Epistemic Horn? How do we access the *structure* if it's still abstract? You've moved the mystery from 'objects' to 'structures'. Benacerraf would ask: Is the structure in the world (in re) or in the mind (ante rem)? If it's abstract, the causal problem remains."
  *   **Exclusions:** Do not get into *ante rem* vs. *in re* structuralism deeply. Do not mention Quine/Putnam Indispensability (too much meta-ontology). Do not mention Fictionalism (too close to the "Maths Student" objection already covered).

  #### **80–90 mins: Assessment & Wrap-up**
  *   **Goal:** Check understanding of the *tension*, not just the definitions.
  *   **Activity:** The Final Question (see below).

  ### 4. Handling the Misconceptions (Summary Table)

  | Misconception / Objection | When it arises | How to absorb it (Don't just knock down) |
  | :--- | :--- | :--- |
  | **"This is just Platonism vs Nominalism"** | Intro | Confirm: "Yes, but Benacerraf shows Platonism has an internal split. It's not just 'do objects exist?' it's 'can we have both truth and knowledge?'" |
  | **"It doesn't matter what they are, only what they do"** | Semantic Horn | Validate: "This is Instrumentalism. It cuts the Semantic horn. But it makes math not *literally true*. Are you okay with that cost?" |
  | **"Notation is arbitrary" (VN vs Zermelo)** | Semantic Horn | Correct: "It's not syntax; it's identity. If numbers are sets, membership facts must be real. If they aren't real, numbers aren't sets." |
  | **"We grasp them by intuition"** | Epistemic Horn | Challenge: "Intuition is a name for the problem, not a solution. How does intuition bridge the causal gap? Kripke demands a mechanism." |
  | **"Numbers are positions in a structure"** | Synthesis | Refine: "This is Structuralism. It solves Horn 1. But does it solve Horn 2? How do we perceive structures?" |

  ### 5. What to Openly Refuse
  Put this on the board early as "Out of Bounds for Today":
  1.  **Indispensability Arguments (Quine/Putnam):** "We should believe in numbers because science needs them." (Too much philosophy of science).
  2.  **Fictionalism:** "Math sentences are false but useful." (We covered this under the 'Maths Student' objection).
  3.  **Deep Structuralist Metaphysics:** "Are structures universal or particular?" (Keep it to the access problem).

  ### 6. The Final Question (Last 5 Minutes)
  Do not ask "What are the two horns?" (That tests memory).
  Ask a question that forces them to feel the trade-off.

  **The Question:**
  > "Imagine you propose a theory where numbers are abstract objects that we know via a special faculty of 'mathematical perception.'
  >
  > **Which horn of Benacerraf's dilemma does this satisfy, and which horn does it fail to address? Explain why the failure matters given what we learned about causal theories of reference."**

  **What you're looking for:**
  *   **Satisfies Semantic:** It allows math sentences to be literally true (objects exist to be referred to).
  *   **Fails Epistemic:** It posits a "faculty" without explaining the causal mechanism (violating the Kripkean constraint on knowledge).
  *   **Why it matters:** It leaves the reliability of our mathematical beliefs as a coincidence/mystery.

  If they can answer this, they understand that the dilemma isn't just two separate problems, but a conflict between *truth conditions* and *knowledge conditions*.
