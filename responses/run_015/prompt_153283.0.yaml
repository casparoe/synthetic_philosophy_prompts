  2.  **Determine the Core Strategy:**
      *   *The Semantic Horn First:* The user's instinct is correct. You can't feel the epistemic bite (how do we know abstract objects?) until you accept the semantic premise (mathematical sentences are true because they refer to abstract objects). If you don't buy the semantic story, the epistemic problem dissolves.
      *   *The Example:* Von Neumann vs. Zermelo is the classic Benacerraf example. The worry ("it's just notation") is valid but manageable. It needs to be framed not as *notation* but as *identity*. It's not about how we write '2', it's about what '2' *is*.
      *   *Misconceptions:* These need to be integrated as "natural reactions" rather than "errors to be corrected immediately." They often represent alternative solutions (Structuralism, Intuitionism, Instrumentalism) which Benacerraf is challenging.
