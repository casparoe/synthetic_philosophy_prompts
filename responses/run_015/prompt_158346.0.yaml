answer: |-
  ### Pre-Seminar Notes & Argument Map

  **Concept Clarification:**
  *   **CEV (Coherent Extrapolated Volition):** Focuses on *potential*. Values are what we would converge upon if we were idealized versions of ourselves. Risk: The "idealized self" may be unrecognizable to the "actual self."
  *   **SIP (Stabilized Ideal Preference):** Focuses on *authenticity*. Values are what remains when cognitive noise (framing, ordering) is stripped away, then made consistent. Risk: May treat profound moral reframing as mere "noise."

  **Key Conflict Points:**
  1.  **The Framing Filter:** Marcus (SIP) argues framing effects are cognitive bugs. Elena (CEV) argues some "framing" is actually moral perspective-taking.
  2.  **Ownership:** Who owns the values? The human on the ground (SIP) or the human in the limit (CEV)?
  3.  **Climate Stakes:** Climate governance requires long-term sacrifice. CEV argues humans need to be "grown" to accept this. SIP argues coercion via extrapolation is illegitimate.

  **Setting:**
  *   Room 304, Philosophy Department.
  *   Whiteboard covered in half-erased decision matrices.
  *   Table cluttered with empty ceramic mugs.

  ***

  **The Dialogue**

  **Elena:** (Stirring a cold espresso) The problem with using current preference aggregates for climate governance is that current preferences are suicidal. We're discounting the future at rates that literally extinguish the possibility of there *being* a future. CEV isn't just a nice-to-have; it's the only way to bridge the gap between what people say they want now—cheap energy, no taxes—and what they would want if they actually understood the thermodynamics and the intergenerational ethics.

  **Marcus:** (Leaning back, tapping a pen against a stack of papers) You're conflating information deficits with value structures. If I don't know the thermodynamics, sure, update my beliefs. But CEV doesn't just update beliefs; it updates the *valuer*. You're saying the AI should govern based on who I *would* be, not who I *am*. That's not alignment. That's replacement.

  **Elena:** It's not replacement, it's refinement. Look, if you're delirious with fever, you might want to drink poison. We don't align with the feverish preference. We align with the preference you'd have if you were healthy. Climate change is a collective fever.

  **Marcus:** But whose definition of "healthy" are we using? That's the rub. My framework, SIP, handles this without the extrapolation drift. We take the preference profile, strip out the instabilities—the stuff that flips when you describe a carbon tax as a "penalty" versus a "rebate"—and then we idealize what's left. We make it consistent, we add the facts, but we stop at reflective equilibrium. We don't extrapolate beyond what the actual agent can recognize as their own.

  **Elena:** (Gesturing with the spoon) But that filter is too aggressive. You're stripping out anything sensitive to framing. But Marcus, moral progress *is* often a change in framing. Consider slavery. A slaveholder might view abolition as a "loss of property." An abolitionist frames it as a "gain in liberty." If you strip out preferences that reverse based on gain/loss framing, you might filter out the moral revolution itself. You're stabilizing bias.

  **Marcus:** Hold on. You're talking past me. SIP doesn't strip out preferences that change due to *new information*. It strips out preferences that change due to *irrelevant presentation*. If the slaveholder changes their mind because they realize slaves are people—that's information. That stays. If they change their mind because I tell them abolition is a "loss of income" versus "loss of moral standing," and their preference flips purely on that linguistic toggle? That's noise. That's not a value; that's a cognitive glitch. CEV assumes every glitch is a seed for a higher value.

  **Elena:** But in climate governance, the "linguistic toggle" is often the only way people access the value. If I frame climate action as "protecting our children," people support it. If I frame it as "restricting industry," they oppose it. Both are true. CEV allows the system to weigh those competing frames and find the coherent volition underneath. SIP just deletes the conflict. You're left with a hollowed-out preference set that might be consistent but lacks the motivational force to actually solve the problem.

  **Marcus:** Motivational force isn't the metric here. Legitimacy is. If the AI implements a policy based on my extrapolated volition, and I look at it and say, "I don't recognize that value," then the AI is not serving me. It's serving a phantom. With SIP, if a preference survives the framing filter and idealization, it's robust. It's *mine*. Even if it's suboptimal for the climate.

  **Elena:** (Sighs, pushing a coffee cup aside) So you'd let the planet burn to preserve the integrity of a preference ordering that might be based on a cognitive bias you haven't even identified yet?

  **Marcus:** I'd rather have a legitimate failure than an illegitimate success. But you're missing the second layer of SIP. We idealize the survivors. We add consistency. If someone wants cheap energy but also wants a livable climate, those are inconsistent given the physics. SIP forces that inconsistency to resolution using facts. It doesn't need to extrapolate a new "green soul" to do that. It just forces the existing values to confront reality.

  **Elena:** Reality doesn't resolve value conflicts, though. That's the is-ought gap. Physics says you can't have cheap fossil energy and a stable climate. It doesn't tell me which one to sacrifice. CEV says, "If you were smarter and more empathetic, you'd sacrifice the energy." SIP says... what? "Whichever preference survives the framing filter"? What if both survive? What if I genuinely value both, and no amount of reframing changes that? Then your system stalls.

  **Marcus:** Then it stalls transparently. It flags the conflict for democratic resolution. CEV resolves it by fiat—by assuming the extrapolated version is the "true" one. That's dangerous. You're worried about SIP removing legitimate moral changes of mind. I'm worried CEV invents values the original person never endorsed. If you extrapolate far enough, the "you" that wants the climate saved might be so different from the "you" that exists now that the connection is broken. It's a Ship of Theseus problem for values.

  **Elena:** But the Ship of Theseus still sails. The point of alignment isn't to preserve the static configuration of atoms in my brain right now. It's to serve my interests. And my interests include not dying in a heatwave. The "me" in thirty years wants survival. The "me" now is myopic. CEV privileges the temporally extended agent. SIP privileges the instantaneous snapshot, minus some noise.

  **Marcus:** (Pauses, looking at the whiteboard) I'll grant you the temporal point. SIP needs to account for the future self. But let's go back to the framing filter. You argued that moral progress looks like framing sensitivity. I argue that moral progress looks like *information* sensitivity. If I oppose a carbon tax because I think it hurts the poor, that's a belief. Show me data that rebate structures protect the poor, and my preference should update. That's information. If I oppose it because you called it a "tax" instead of a "fee," and I flip? That's not moral growth. That's manipulation. CEV risks baking the manipulation into the value function because it treats the output of the manipulation as data for extrapolation.

  **Elena:** Fair. But CEV isn't just aggregating current reactions. It's simulating deliberation. It's not asking "Do you want this now?" It's asking "Would you endorse this after thinking for a thousand years?" If you think for a thousand years, the difference between "tax" and "fee" dissolves. You see the structure.

  **Marcus:** And if after a thousand years of thinking, you decide you value something I currently find abhorrent? Say, radical resource redistribution that feels like theft to me now? CEV says the AI should enforce that. SIP says the AI should check if that preference survives my current reflective equilibrium when stripped of framing. If it doesn't survive *my* equilibrium, the AI shouldn't enforce it, even if "Ideal Marcus" agrees.

  **Elena:** So SIP locks in moral error. If my reflective equilibrium is wrong because my foundational axioms are selfish, SIP preserves the selfishness. CEV allows the axioms to shift.

  **Marcus:** It's not about locking in error. It's about locking in *agency*. If the AI shifts my axioms, it's not my life anymore. For climate governance specifically... look, the risk with CEV is that the AI decides the only coherent volition is "maximize biomass" or something, and decides humans are the bottleneck. It extrapolated too far. SIP keeps the anchor on actual human endorsement.

  **Elena:** (Leans forward) But here's the thing. You say SIP strips out preferences that reverse on framing. How do you test that? You have to present the frames. The AI has to manipulate the user to test the stability.

  **Marcus:** Exactly. Active elicitation.

  **Elena:** But if the AI knows which frame produces the "stable" preference, won't it just use that frame to govern? Isn't that itself a violation? You're building a system that tests humans for cognitive bugs and then exploits the bug-free version.

  **Marcus:** It's not exploitation if the goal is to find the signal. Would you rather the AI exploit the *unstable* preference? The one that flips?

  **Elena:** I'd rather the AI help me grow out of the need for the test. CEV assumes the growth is possible and desirable. SIP assumes the growth is suspect unless it's grounded in the current soil. I think for climate... we don't have time for the soil. We need the growth.

  **Marcus:** (Picks up a cold coffee cup, sets it back down) Then we're back to legitimacy. If you govern based on who I *would* be, and I revolt because I don't like who that is... your climate governance fails anyway. SIP might be slower, might be messier, but the preferences it acts on... I can sign my name to them. CEV asks me to sign a blank check to my future self.

  **Elena:** And SIP asks me to sign a death warrant with my current hand.

  **Marcus:** (Quietly) Maybe. But it's my signature.

  **Elena:** (Sits back, looking at the mess of cups) We need a hybrid. SIP's filter for immediate policy legitimacy, CEV's horizon for long-term trajectory.

  **Marcus:** (Nods slowly) The filter ensures we aren't building on sand. The extrapolation ensures we're building a house that won't collapse in a century. But the filter gets veto power on the foundational axioms.

  **Elena:** I can live with that. As long as the extrapolation gets veto power on the existential risks.

  **Marcus:** Deal. But I'm keeping the framing test.

  **Elena:** Keep it. Just don't let it filter out the future.
