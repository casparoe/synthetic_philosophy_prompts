      *   *Check:* Did I address the "principled line"?
      *   *Correction:* The line isn't in the text; it's in the *claim*. The theory presupposes the claim is binding.
      *   *Check:* Visual Art nuance.
      *   *Correction:* Make sure to distinguish between *source material* (photos) and *ontological claim* (this is a record of an event). A painting doesn't claim "this event happened." A memoir does.

  8.  **Final Polish:** Ensure tone is respectful, intellectual, and tailored to a novelist. Use terms like "illocutionary act," "verisimilitude vs. veracity," "ontological status." (Keep it accessible but rigorous).

      *(Self-Correction on the Visual Art point)*: The user says conceptual art uses intention to *expand* what counts as art. In literature, intention (it's real) often *contracts* what counts as *fiction*. I need to highlight that distinction. In lit, "real" removes the burden of imagination, which is the specific virtue of fiction. In conceptual art, "real" (e.g., a urinal) adds the burden of context, which is the specific virtue of conceptualism.

  9.  **Final Structure:**
      1.  The Core Theory: Contractual Intentionalism / Speech Act Theory.
      2.  The Axioms (Truth-types, The Burden of Imagination).
      3.  The Visual Art Discrepancy (Propositional vs. Presentational).
      4.  The Consequences of the "Continuous View."

  10. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a profound observation that cuts to the bone of how the literary institution functions. You have identified a friction point that most readers ignore but which defines the economics and ethics of publishing.

  To answer your question directly: The practice strictly presupposes a theory of art that is **not Formalist** (the text is not the thing) but **Institutional and Speech-Act Based.**

  Here is the reconstruction of that implicit theory, an analysis of its consistency (including your visual art comparison), and the consequences of abandoning it.

  ### 1. The Implicit Theory: Contractual Intentionalism

  The literary industry does not operate on the New Critical assumption that the text is an autonomous object. Instead, it operates on a theory of **Contractual Intentionalism**.

  **The Strict Presupposition:**
  A book is not merely a sequence of words; it is an **illocutionary act** (a speech act that performs an action). When an author publishes a book labeled "Novel," they are not just presenting text; they are making a specific promise to the reader.
  *   **The Fiction Contract:** "I have used imagination to transmute experience into a coherent form. You are to judge me on the *verisimilitude* (truth-likeness) of the result."
  *   **The Nonfiction Contract:** "I am using memory and reportage to testify to experience. You are to judge me on the *veracity* (truth-actualness) of the result."

  **Why the Criteria Shift:**
  Under this theory, the "art" of the novel is specifically the **labor of transmutation**. The aesthetic virtue of fiction is the alchemy of turning the lead of raw life into the gold of structured narrative.
  *   If a book is labeled *fiction* but turns out to be raw autobiography, the critic feels cheated not because the prose is bad, but because the **specific artistic labor (imagination) was bypassed.** It is like hiring a chef to cook a meal and discovering they just opened a can. The meal might taste fine, but the *service* was fraudulent.
  *   If a book is labeled *memoir* but is fabricated, the ethical breach is paramount because the contract was testimony.

  Therefore, the practice presupposes that **ontological status is extrinsic to the text.** The text does not contain its own category; the category is imposed by the publishing act, and that imposition is constitutive of the work's identity.

  ### 2. Is the Theory Consistent? (The Fiction/Nonfiction Boundary)

  You asked if there is a principled line or if it is merely sociological. Under Contractual Intentionalism, the line is principled, but it is **pragmatic, not textual.**

  *   **The Line:** The line is not "how much of this happened?" (since, as you note, all fiction draws from life). The line is **"What is the author claiming responsibility for?"**
  *   **Consistency:** The theory is internally consistent. It treats the author's *stance* toward the material as part of the artwork.
      *   *Risk:* The inconsistency arises when the industry punishes "too much truth" in fiction (calling it self-indulgent) while rewarding "too much art" in nonfiction (calling it narrative nonfiction).
      *   *Resolution:* The theory resolves this by viewing "Self-Indulgence" in fiction as a failure of *universalization*. If the book is fiction, it must speak to the human condition beyond the author's specific grievance. If it is memoir, the specific grievance *is* the point (testimony).

  So, the practice is coherent: It demands that the *mode of engagement* matches the *label*. The "art" is not just the writing; the "art" is the successful execution of the contract associated with the label.

  ### 3. The Visual Art Comparison: Why the Discrepancy?

  This is the sharpest part of your query. Why does revealing the "real" source in literature often demote the work, while in visual art (especially conceptualism), revealing the context/intention elevates it?

  **The Medium Specificity Argument:**
  The implicit theory relies on a distinction between **Propositional Media** (Literature) and **Presentational Media** (Visual Art).

  *   **Literature (Propositional):** Language makes claims. "I walked down the street" is a proposition that can be true or false. Fiction is a "suspension of the claim." When you reveal the claim was actually true, you collapse the suspension. You remove the "willing suspension of disbelief," which is the specific playground of the novelist. In literature, *distance* from reality is a prerequisite for the specific aesthetic of fiction.
  *   **Visual Art (Presentational):** A painting does not propositionally claim "This man existed." It presents an image. Even hyperrealism is understood as paint on canvas. Therefore, revealing the source (a photo, a life model) does not collapse a linguistic contract.
  *   **Conceptual Art:** In conceptual art, the "art" is the *idea*, not the object. Therefore, context (the artist's intention, the provenance) is *constitutive* of the work.
      *   *The Twist:* In Literary Fiction, the "art" is the *imagined world*. Context (reality) intrudes on that world.
      *   In Conceptual Art, the "art" is the *frame*. Context (reality) reinforces that frame.

  **The Verdict on Consistency:**
  The literary world is not "backwards"; it is protecting the specific virtue of its medium.
  *   If a painter paints from a photo, we don't care because the virtue of painting is *vision*, not testimony.
  *   If a novelist writes from life, we care because the virtue of the novel is *imagination*.
  *   **However:** Your critique holds water regarding **Autofiction.** The rise of autofiction suggests the literary world is currently struggling to update its Contractual Theory. It is trying to create a third contract: "I claim this is real, but I claim the right to shape it like fiction." The prize committees (Booker, etc.) lag behind this because their categories rely on the binary contract (Fiction vs. Nonfiction).

  ### 4. What If We Adopted the "Continuous View"?

  You asked what would have to change if we replaced this with a view where fiction and autobiography are continuous, and the only question is "Is the writing good?"

  This is essentially a return to **Aestheticism** (Art for Art's Sake), stripping away the Ethical/Epistemic contract. Here is what would break and what would form:

  **1. The Collapse of Defamation and Ethics:**
  Currently, if a novelist depicts a living person negatively, they can say, "It's fiction; it's a character." If a memoirist does it, they can be sued or cancelled for libel/betrayal.
  *   *Change:* Under a continuous view, the "real person" defense evaporates. Every depiction is a "character." This would likely lead to a legal and ethical crackdown *outside* the literary sphere, because the literary shield of "it's just art" would be applied to harmful lies.

  **2. The End of the "Fraud" Scandal:**
  Scandals like James Frey (*A Million Little Pieces*) would be impossible. If the category doesn't matter, then fabricating memories is just a stylistic choice, like magical realism.
  *   *Change:* Trust would shift from the *author* to the *text*. We would stop asking "Did this happen?" and start asking "Does this feel true?" This liberates the writer but disorients the reader who reads for testimony.

  **3. Prize Categories Would Merge:**
  The Booker and NBA would have to abolish the Fiction/Nonfiction split. They would judge "Books."
  *   *Change:* This seems fair, but it creates a judging problem. How do you compare the aesthetic merit of a fabricated narrative against the ethical merit of a witnessed tragedy? Currently, the categories prevent this apples-to-oranges comparison. Removing them forces judges to weigh *Imagination* against *Truth*. Usually, Truth wins on moral weight, Imagination wins on structural coherence. The prizes would likely oscillate wildly in value.

  **4. The Redefinition of "Craft":**
  Currently, "craft" in fiction implies plotting, pacing, and character arc (imposed order). "Craft" in memoir implies selection, memory, and voice (discovered order).
  *   *Change:* Craft would become purely stylistic. Syntax, rhythm, imagery. The structural expectations would loosen. We would see more fragmented, essayistic novels and more novelistic memoirs. The "Novel" as a specific form (long, imagined, narrative) might dissolve into "Long-Form Prose."

  ### Summary

  The practice you find buggy presupposes that **Literature is a Promise, not just a Product.**

  It is consistent within its own logic: it values the *labor of imagination* in fiction and the *labor of testimony* in nonfiction. When those labors are confused, the value proposition breaks.

  The discrepancy with Visual Art exists because Language is propositional (it lies or tells the truth) while Paint is presentational (it exists or it doesn't).

  If you move to a "Continuous View," you gain aesthetic freedom but lose the ethical/epistemic framework that allows readers to trust writers. You solve the "categorization" problem but create a "truth" problem. The literary industry clings to the binary not because it can't see the spectrum, but because the binary protects the specific economic and ethical contracts that allow the industry to function without constant litigation and philosophical paralysis.

  As a novelist, the friction you feel is the friction of the form evolving faster than the institutions that categorize it. The theory hasn't changed; the writing has outgrown the contract.
