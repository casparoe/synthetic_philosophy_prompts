          *   The "Prize" problem (apples vs. oranges).
      *   *Conclusion:* Summarize. The practice isn't about the text; it's about the relationship between author, text, and reader.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I answer "what does it strictly presuppose?"
