prompt: |-
  I'm a novelist and something's been bugging me about how the literary world works, and I think it might have implications for what we even mean by "art." Here's the practice. When a book comes out labeled as a novel, we judge it by one set of criteria — prose, structure, whether the characters feel alive, that kind of thing. But if it later emerges that the book is heavily autobiographical — that the narrator basically is the author, what they're calling autofiction now — the whole evaluative framework shifts. Suddenly critics are asking whether the author is being honest about their own life, whether they've been fair to the real people depicted, whether the whole project is self-indulgent. Same words on the same pages. But the book's status as fiction vs. something-else determines what counts as a relevant criticism.

  And it's not just reviewers. Prize committees do this explicitly: the Booker and the National Book Award have seperate fiction and nonfiction categories, and a book's eligibility can turn entirely on how it's classified, even when the text itself is ambiguous. A book can be disqualified from the fiction prize because it's "really" memoir — not because of anything in the prose, but because of facts about the author's life.

  What theory of art does this practice presuppose? It seems like it presupposes that the author's relationship to the material is part of the work — that you can't evaluate the text purely as a text, that the act of imagination (or lack of it) matters to the artistic status of the thing. But then what do we do with the fact that basically all novels draw from life to some degree? Is there a principled line, or is the practice just tracking something sociological?

  And here's the comparison that really throws me: in the visual arts, nobody cares if a painter works from photographs or from life. We don't say "this painting is just autobiography with the faces changed." In fact, in conceptual art, the artist's intention and relationship to the object is often treated as partly constitutive of the work — but in a way that expands what counts as art, not in a way that demotes it to "mere" memoir. So the literary world seems to have it backwards relative to the art world.

  Reconstruct the implicit theory of art that makes this practice coherent. I want to know: what does the practice strictly presuppose (as opposed to what it merely fits well with), whether its commitments are consistent across the fiction/nonfiction boundary and across the literature/visual-art comparison, and what would have to change in how we talk about books if we replaced it with a view on which fiction and autobiography are continuous rather than separate kinds — where the only question is whether the writing is good, period.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** Literary evaluation shifts dramatically based on the classification of a text as "fiction" vs. "autofiction/memoir," even if the text remains identical.
      *   **Key Evidence:**
          *   Criticism changes (aesthetic criteria vs. ethical/biographical criteria).
          *   Prize eligibility changes (Booker/NBA categories depend on classification, not just text).
          *   Comparison to Visual Arts: Visual arts don't demote work based on reference to reality (photos vs. life); conceptual art *uses* artist intent to *expand* art, not restrict it.
      *   **The Question:** What theory of art does this practice *strictly presuppose*? Is it consistent? What would change if we adopted a "continuous" view (only "good writing" matters)?
      *   **User Persona:** Novelist (practitioner), philosophical/theoretical inclination, looking for structural coherence/incoherence in the industry.

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *New Criticism/Formalism:* "The text is the thing." This contradicts the user's observation. The industry *doesn't* act like a New Critic.
      *   *Intentionalism:* The author's intent/state matters. This fits the observation. If the author *intends* to tell the truth, it's nonfiction. If they *intend* to imagine, it's fiction.
      *   *Speech Act Theory:* A book is a promise. "This is a novel" = "I made this up." "This is a memoir" = "This happened." Breaking the promise changes the value.
      *   *Ethical/Aesthetic Split:* Fiction is judged aesthetically; Nonfiction is judged ethically/epistemically (truthfulness).
      *   *Visual Art Comparison:* Why the difference? Painting is inherently representational/interpretive. Writing has a stronger claim to testimony.
      *   *The "Principled Line":* Is there one? Or is it a social contract?

  3.  **Reconstructing the Implicit Theory (The "Strict Presupposition"):**

      *   The practice *requires* that the **illocutionary force** of the publication is part of the artwork.
      *   It's not just "what is written," it's "what is being done with these words."
      *   *Theory:* **Institutional Speech Act Theory of Literature.**
      *   *Core Tenet:* A literary work is not merely an object (text) but an event (publication + classification). The classification creates a contract with the reader.
      *   *Value System:*
          *   Fiction Contract: Promise of Coherence/Truth-to-Human-Experience (Aesthetic).
          *   Nonfiction Contract: Promise of Correspondence/Truth-to-Fact (Epistemic/Ethical).
      *   *Violation:* If you label it fiction but it's raw memoir, you broke the aesthetic contract (lazy imagination?). If you label it memoir but it's fabricated, you broke the ethical contract (fraud).

  4.  **Analyzing Consistency (Fiction/Nonfiction & Lit/Art):**

      *   *Fiction/Nonfiction Boundary:* The theory is consistent *internally* within the literary institution. It relies on the *contract*. If the contract shifts, the evaluation shifts.
      *   *Lit/Visual Art Comparison:* Why the discrepancy?
          *   Visual Art: The "contract" is usually "This is an interpretation." Even hyperrealism is understood as paint on canvas.
          *   Literature: Language is propositional. "I walked down the street" claims a fact. Fiction suspends that claim.
          *   *Correction:* The user says visual art *expands* with intent (Conceptual Art). Literature *restricts* with intent (Memoir vs. Novel).
          *   *Explanation:* Literature has a stronger default claim to testimony. Visual art has a stronger default claim to artifice. Therefore, revealing "reality" in lit threatens the "artifice" required for fiction status. In art, revealing "reality" (provenance, concept) enhances the "artifact."
      *   *Is it consistent?* Yes, if you accept the premise that Language = Testimony by default, whereas Paint = Representation by default.

  5.  **Addressing the "Continuous View" (What if we changed it?):**

      *   If we treat them as continuous (Spectrum of Truth), what breaks?
      *   *Criticism:* Can't ask "Did this happen?" anymore. Only "Does this resonate?"
      *   *Prizes:* Categories merge. (Some exist, like "General Nonfiction" vs "Fiction," but the hard barrier drops).
      *   *Ethics:* The "fairness to real people" argument weakens. If it's all art, the "real person" becomes a "character." (This is dangerous/controversial).
      *   *Reading Experience:* The reader's stance changes from "witness" to "participant."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sharpness of the observation. Validate the tension.
      *   *Section 1: The Implicit Theory.* Name it. It's not Formalism. It's **Contractual Intentionalism**. The work is a speech act. The label is a promise.
      *   *Section 2: The Value Shift.* Explain *why* the criteria change. Fiction = Verisimilitude (Truth-like). Nonfiction = Veracity (Truth-actual). The "Art" in fiction is the *transmutation* of life. The "Art" in nonfiction is the *arrangement* of truth.
      *   *Section 3: The Visual Art Comparison.* Tackle the user's specific point. Why the difference? Medium specificity. Language asserts facts; paint asserts presence. Conceptual art makes the *idea* the art, so context helps. Literary fiction makes the *imagined world* the art, so context (reality) hinders.
      *   *Section 4: The Continuous View.* What happens if we switch?
          *   Loss of the "Lie" taboo (James Frey case).
