answer: |-
  Pull up a chair. The coffee's terrible, but that's appropriate—this problem tastes like burnt aluminum.

  You're asking for the spec sheet on a decision theory that doesn't implode when faced with extreme stakes. Everyone wants to dump Expected Value (EV) maximization because it tells you to sell your grandmother to fund a 0.0000001% chance of saving the universe, but nobody wants a theory that tells you to ignore the 1% chance of nuclear war because "it's too small."

  If you're building a feature on this, you need to stop your interviewees from hand-waving. You need to put the spec on the table before they start pitching their pet framework. Here is the requirements document for a non-fanatical, non-cowardly decision theory.

  ### Part 1: The Spec (Desiderata)

  I've broken these down by the specific failure modes they address. I've flagged them as **Hard** (the theory fails if it doesn't meet this) or **Negotiable** (nice to have, but you can argue around it).

  #### 1. The Cases It Must Handle

  **A. Pascal's Mugging (The Fanaticism Test)**
  *   **The Case:** A stranger demands $5, claiming they will use magic to save $3 \uparrow\uparrow\uparrow 3$ lives tomorrow. The probability is tiny, but the utility is so huge the EV dominates your rent money.
  *   **Requirement:** The theory must reject this without setting an arbitrary probability floor (e.g., "ignore anything under 1%"). It must explain *why* the leverage doesn't hold.
  *   **Status:** **Hard.** If it fails here, it's just EV in disguise.

  **B. The St. Petersburg Repetition (The Aggregation Test)**
  *   **The Case:** A single bet with infinite EV is irrational for a mortal with a finite lifespan. But if that same bet is offered to 10,000 village clinics (your micro-replication example), the aggregate outcome matters.
  *   **Requirement:** The theory must distinguish between a *one-off* existential gamble and a *portfolio* of small risks. It must allow the aggregate to converge to value even if the individual instance is rejected.
  *   **Status:** **Hard.** If it can't handle aggregation, it can't do public policy.

  **C. Climate/Existential Policy (The Tail Risk Test)**
  *   **The Case:** Reducing carbon emissions has a high cost and a small probability of preventing catastrophe. EV says do it. A "cowardly" theory says ignore the low odds.
  *   **Requirement:** The theory must preserve sensitivity to low-probability, high-impact events when the *downside* is ruin, even if it rejects them when the *upside* is magic.
  *   **Status:** **Hard.** This is the asymmetry requirement. You can't treat existential risk the same as existential gain.

  **D. Institutional vs. Individual (The Risk-Bearing Test)**
  *   **The Case:** A hedge fund should take a 10% risk of ruin for 100x return. A family should not.
  *   **Requirement:** The theory must incorporate "capacity to absorb variance" as a variable, not just an external constraint.
  *   **Status:** **Negotiable.** You can model this as utility curvature, but it's cleaner if the decision rule itself accounts for repetition capacity.

  #### 2. The Distinctions It Can't Collapse

  **A. Moral vs. Prudential Risk**
  *   **The Case:** Losing $1,000 is annoying. Causing a death is categorical.
  *   **Requirement:** The theory cannot treat utility as a single homogenous scalar. It needs a lexical ordering or a discontinuity where "rights violations" or "deaths" trump "efficiency gains."
  *   **Status:** **Hard.** If it collapses these, you get the transplant surgeon problem (kill one healthy guy to save five patients).

  **B. Epistemic Status (Risk vs. Ambiguity)**
  *   **The Case:** A 1% chance from a calibrated model vs. a 1% guess from a stranger.
  *   **Requirement:** The theory must discount probabilities that lack robust evidence (Knightian uncertainty). It can't treat a made-up number the same as a rolled die.
  *   **Status:** **Hard.** This is the only way to solve Mugging without arbitrary cutoffs. You attack the probability estimate, not the utility.

  #### 3. Consistency with Cognition

  **A. Bounded Computability**
  *   **The Case:** Humans cannot calculate integrals over infinite outcome spaces.
  *   **Requirement:** The decision rule must be executable with heuristics. If it requires perfect Bayesian updates on unobservable priors, it's a philosophy, not a tool.
  *   **Status:** **Hard.**

  **B. Dynamic Consistency**
  *   **The Case:** You plan to do X tomorrow. Tomorrow arrives, and the theory tells you to do Y.
  *   **Requirement:** The theory shouldn't make you time-inconsistent unless new information arrives.
  *   **Status:** **Negotiable.** Humans are time-inconsistent anyway, but a normative theory should aim for stability.

  ---

  ### Part 2: The Impossibility Results (The Trap)

  Here is the part you need to press hardest on. There are pairs of desiderata above that are **jointly unsatisfiable**. If an interviewee claims their theory does it all, they are lying or don't understand the math.

  **1. Sensitivity to Tail Risks vs. Immunity to Mugging**
  *   **The Conflict:** To avoid Pascal's Mugging, you need to dampen the weight of low-probability events (non-linear probability weighting). To address Climate/Existential Risk, you need to *amplify* or at least maintain the weight of low-probability events.
  *   **The Impossibility:** You cannot have a single weighting function that suppresses tiny probabilities for *gains* (Mugging) but preserves them for *losses* (Catastrophe) without introducing a directional bias that violates standard symmetry axioms.
  *   **The Cost:** You must choose: either you accept some vulnerability to Mugging to save the world, or you build a firewall that might blind you to slow-moving disasters. Most "solutions" just hide the switch where they flip from gain to loss.

  **2. Bounded Utility vs. Infinite Horizons**
  *   **The Conflict:** The cleanest way to stop Mugging is to bound utility (say, no outcome is worth more than 1 billion utils). But if you bound utility, you lose the ability to prioritize existential risk over trivial inconveniences over long enough time horizons.
  *   **The Impossibility:** If utility is bounded, then for any existential threat, there is a probability low enough that preventing it is worth less than preventing a headache.
  *   **The Cost:** You have to accept unbounded utility (risk Mugging) or accept that eventually, survival doesn't matter more than comfort (moral repugnance).

  **3. Aggregation vs. Individual Rationality**
  *   **The Conflict:** What is rational for the 10,000 clinics (take the risk, it averages out) is irrational for one clinic (take the risk, you go bust).
  *   **The Impossibility:** A single decision rule cannot maximize both individual survival probability and aggregate expected value simultaneously without referencing the *context* of the agent (are you the only clinic, or one of 10,000?).
  *   **The Cost:** The theory cannot be agent-neutral. It must be indexical. "What should *I* do?" depends on "Who else is playing?" This breaks standard decision theory which assumes isolated agents.

  ---

  ### Part 3: The Scorecard (Brief)

  Don't let them dwell on who wins. The value is in *where they bleed*.

  **1. Straight EV Maximization**
  *   **Performance:** Fails **Pascal's Mugging** (Hard). Fails **Bounded Computability** (Hard).
  *   **Why:** It is linear. It has no defense against probability/utility leverage. It treats a calibrated 1% and a guessed 1% identically.
  *   **Verdict:** Mathematically clean, practically dangerous. Good for casinos, bad for civilization.

  **2. Risk-Weighted EV (e.g., Buchak) with Cutoffs**
  *   **Performance:** Passes **Mugging** (if cutoff is tuned). Fails **Tail Risk/Climate** (Hard) if the cutoff is too blunt.
  *   **Why:** By weighting probabilities non-linearly (caring less about the tails), you solve Mugging. But you inevitably downweight the climate catastrophe tail too. To fix this, you need asymmetric weighting (risk-averse for losses, risk-neutral for gains), which opens you to "money pump" arguments (dynamic inconsistency).
  *   **Verdict:** The most popular middle ground, but it hides the asymmetry problem under the rug.

  **3. Satisficing + Threshold Rules (Behavioral)**
  *   **Performance:** Passes **Cognition** (Hard). Fails **Aggregation/Optimization** (Hard).
  *   **Why:** "Do what's good enough" is computationally cheap and avoids Mugging (the mugger's offer isn't "good enough" because it's unreliable). But it leaves massive value on the table in the clinic replication case. It's inherently "cowardly" by your definition—it stops looking for better options once a threshold is met.
  *   **Verdict:** Descriptively accurate (how humans act), normatively weak (hard to justify why the threshold is *there*).

  ### The Takeaway for Your Feature

  When you talk to researchers, ask them this: **"Where does your theory break the Independence Axiom, and are you okay with the money pump?"**

  To avoid EV fanaticism, you must violate Independence (preferring A over B, but preferring B+C over A+C). If you violate Independence, you can be Dutch-booked (pumped for money).

  The honest answer isn't a new formula. It's admitting that **decision theory is not physics.** It's a control system for bounded agents. The "solution" isn't a mathematical fix; it's a governance fix. We don't solve Pascal's Mugging with math; we solve it with institutional rules that forbid acting on unverified probabilities above a certain stake.

  If they claim to have a formula that solves the Mugging/Climate tension without asymmetry or context-dependence, tell them to check their work. They've likely smuggled the answer into the priors.

  Now, drink your coffee. It's cold.
