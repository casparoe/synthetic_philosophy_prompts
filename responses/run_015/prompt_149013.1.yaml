  1. In 2022 five of the seven wanted Ada to write the retrospective on a friend of hers who'd died. She said no — too close. Ruling: her call. Note in the doc: nobody is assigned work they have a conscientious objection to doing.
  2. Also 2022, Bo wanted to lead the county jail series; the other six thought Esme should, she had the sourcing. Ruling: Bo got it. Note: whose byline it is is the reporter's business.
  3. In 2023 a donor offered money with strings attached; all seven, including the person who'd have had to write the piece, thought it was a bad idea. Ruling: declined. Note: when we are unanimous, that settles it.
  4. In 2024 Femi shot drone footage and then didnt want it used in a package the rest of them liked. Ruling: it ran. Note: the personal-domain thing covers what you do with your own hands, not what happens to a shared asset.
  5. Back in 2021 they couldn't decide whether to run a photograph of an injured kid. They didn't run it. Note: when we can't say yes, the answer is no.

  New case, being voted on next week. A source dumped 40,000 private messages between a city councillor and a developer into their inbox. Three options are on the table:
  X — Ada reviews the files alone
  Y — Bo reviews them alone
  Z — nobody reads them; they're deleted unread

  Preferences, as best I can reconstruct them from the room:
  Ada: Z best, then X, then Y. She thinks the files are tainted and shouldn't be used at all, but if anyone has to go through them she'd rather it be her than Bo — she said something about not wanting his name anywhere near it.
  Bo: X best, then Y, then Z. He thinks the story matters and that Ada is the right person to do it, but he'll do it if she won't, and the idea of nobody even looking apparently makes him furious.
  The other five all rank X first. Four of them put Y second and Z last; Femi puts Z second and Y last.

  So X beats Y with all seven on board, and both X and Y beat Z on a vote — but the difference between X and Z is only whether Ada reads, and the difference between Y and Z is only whether Bo reads.

  Someone in my mentions keeps saying this is just Sen's liberal paradox with bylines. Is that fair, and what I actually need is this: which of X, Y or Z do they pick, and which of their own commitments has to give in each case? Which precedent is the closest analog — is a reporter going through a leaked archive more like her own byline (1 and 2) or more like footage that's already part of a shared story (4)? If two different principles happen to deliver the same verdict here, say so plainly, and tell me the minimal variant of this case, or the one extra hypothetical ruling, that would pry them apart. And is there an option that isn't on their list which gets them out of the bind — splitting the archive, letting Ada decide after the fact, changing the order they take votes in — and if the order they vote in changes the answer, tell me which order produces which result.

  Also please dont point me at papers or a reading list, I cant chase any of it before this runs.
