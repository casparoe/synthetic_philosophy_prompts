  2.  **Deconstruct the Philosophical Distinction:**
      *   *Indicative Conditional:* "If P, then Q." We accept P as possibly true in the actual world (or update our beliefs based on P). It's about information flow within the actual world's timeline.
      *   *Counterfactual Conditional:* "If P had happened (but it didn't), then Q would have happened." We know P is false in the actual world. We construct a possible world close to ours where P is true and see if Q follows.
      *   *Key Difference:* Epistemic update (indicative) vs. Metaphysical/Modal similarity (counterfactual).

  3.  **Translate to Contract Law Vocabulary (Drafting/Litigation Context):**
      *   *Indicative:* "Condition Precedent." The deal is live. We are waiting to see if the condition triggers performance. *If the Borrower delivers the Financial Statements, the Lender funds.* (We don't know if they will yet).
      *   *Counterfactual:* "Hypothetical Damages / But-For Causation." The deal is broken. We are reconstructing a world where the breach didn't happen to measure loss. *If the Borrower had delivered the Financial Statements, the Lender would have funded.* (We know they didn't).
      *   *Alternative:* "Termination for Cause." Looking back to justify ending the contract.

      *Drafting the Translation:*
      *   Instead of "Indicative," use "Executory Condition Precedent."
      *   Instead of "Counterfactual," use "But-For Causation in Damages" or "Hypothetical Performance."
      *   Instead of "Updating Beliefs," use "Determining Current Obligations."
      *   Instead of "Nearby Possible Worlds," use "Reasonable Certainty Standard" or "Proximate Cause."

  4.  **Develop the "Residue Report" (Mapping & Distortion):**
