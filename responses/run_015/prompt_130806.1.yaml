          *   Philosophers care about *truth conditions* in possible worlds. Lawyers care about *evidence* and *burden of proof*.
          *   "Nearest Possible World" is vague. In law, this becomes "Reasonable Certainty" or "Foreseeability" (Hadley v. Baxendale). It's less metaphysical, more policy-driven.
          *   Lawyers sometimes treat counterfactuals as indicatives during negotiation (drafting for the "what if").
      *   *No Counterpart:*
          *   Philosophers debate the *logic* of the conditional itself (Stalnaker vs. Lewis). Lawyers don't care about the logic, only the *outcome* (liability/$).
          *   The "Gibbard Phenomenon" (indicatives can be accepted/rejected based on information states) doesn't map well to the binary nature of judicial findings.

  5.  **Address the Gut Feeling:**
      *   User thinks: "Actual conditions vs. Hypothetical scenarios."
      *   Verdict: It's mostly right, *but* the philosophical distinction highlights *why* we treat them differently.
      *   Indicative = Risk Allocation (who bears the risk of the condition failing?).
