          *   So, the "agent" in *Of Suicide* is the *psychological* self (the bundle acting in concert), not a *metaphysical* soul.
      *   **Addressing the "Veto" Question:** Why does the death-impression win? It's not about one impression vetoing others metaphysically; it's about the balance of passions (pain vs. pleasure). When pain overwhelms, the causal determination leads to cessation.
