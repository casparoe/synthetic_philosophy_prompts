      *   **Address the Agency in *Of Suicide*:** Hume isn't arguing from a metaphysical standpoint in the essay; he's arguing from a *naturalistic* and *moral* standpoint. He treats the "self" as a practical reality, not a metaphysical substance.
      *   **Reconciling the Two (The "Naturalist" Hume):**
          *   Hume is a naturalist. He knows we *must* act as if we have selves, even if philosophy can't prove it.
