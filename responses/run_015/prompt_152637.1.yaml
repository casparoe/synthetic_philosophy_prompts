      *   *Treatise (Book I, Part IV, Section VI):* "Of Personal Identity." Hume argues we never catch "ourselves," only perceptions. The self is a "bundle or collection of different perceptions." Identity is a fiction of the imagination.
      *   *The Tension:* This is a classic problem in Hume scholarship. The "normative agency" problem. If I'm just a bundle, who is responsible? Who has duties? Who decides?
      *   *Is it a contradiction?* Hume scholars debate this. Some say it's a genuine inconsistency. Others say Hume operates on different levels (metaphysical vs. practical/naturalistic).

