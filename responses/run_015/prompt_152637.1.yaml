          *   *The Tension:* If there is no enduring "I" (Treatise), who is the agent making the decision to die (Suicide)? Is the decision just another fleeting impression? Does the moral argument in *Of Suicide* presuppose a substantial self (obligations over time) that the *Treatise* denies?
      *   **Goal:** Help the user sort out where the contradiction lives (metaphysics vs. morals) and whether Hume is inconsistent or if there's a reconciliation.

