answer: |-
  This is a remarkably coherent set of intuitions. You have essentially reconstructed a hybrid of two major democratic theories without reading the literature: the **All-Subjected Principle** (you belong if you are forced to obey the laws) and the **Deliberative Principle** (you belong if you can participate in the reasoning behind the laws).

  As a software engineer, you can think of the *demos* not as a static list of users, but as the set of **nodes in a feedback loop**.

  Here is the principle that captures your eight verdicts, followed by the resolution of the Legacy Agent conflict.

  ### The Principle: Embedded Moral Agency

  A member of the *demos* must satisfy three conditions simultaneously:

  1.  **Moral Status (The "Who"):** Must be a human being (biological or prospective).
      *   *Excludes:* Animals, AI, Corporations.
  2.  **Causal Coupling (The "Where"):** Must be currently or inevitably subject to the system's coercive output (laws, taxes, force).
      *   *Excludes:* Expats who have exited the system.
      *   *Includes:* Residents, Secessionists (coerced regardless of consent), Future Generations (inevitably subject to consequences).
  3.  **Dynamic Agency (The "How"):** Must possess, or be on a trajectory to possess, the capacity to update preferences based on system feedback.
      *   *Excludes:* The Dead (cannot update), AI Proxies (cannot originate intent).
      *   *Includes:* Children (trajectory to update), Living Adults (can update).

  ---

  ### Testing the Principle Against Your Verdicts

  | Case | Moral Status | Causal Coupling | Dynamic Agency | Verdict | Fit |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Adult Citizen** | Human | Yes (Present) | Yes | **IN** | ✅ |
  | **2. Permanent Resident** | Human | Yes (Taxed/Regulated) | Yes | **IN** | ✅ |
  | **3. Expat Citizen** | Human | **No** (Exited loop) | Yes | **OUT** | ✅ |
  | **4. Unborn Generations** | Human (Prospective) | **Yes** (Inevitable) | **Yes** (Future) | **IN (Rep)** | ✅ |
  | **5. Animals** | **Non-Human** | Yes (Affected) | **No** | **OUT** | ✅ |
  | **6. AI Proxy** | **Non-Human** | Instrumental | **No** (No intent) | **OUT** | ✅ |
  | **7. Secessionists** | Human | Yes (Coerced) | Yes | **IN** | ✅ |
  | **8. Children** | Human | Yes | **Yes (Developing)** | **IN (Prospective)** | ✅ |

  Your intuitions are consistent. You are drawing the boundary around **humans who are locked into the system's causal loop and can learn from it.**

  ---

  ### Resolving the Legacy Agent Conflict

  The Legacy Agent (AI voting for the dead) is the stress test. Here is why your principle predicts it should be **OUT**, and why your hesitation is understandable but misplaced.

  #### 1. The Feedback Loop is Broken
  Democracy functions as a control system. Citizens vote -> Policy changes -> Citizens feel impact -> Citizens update vote.
  *   **Living Voter:** Can observe that Policy X failed and vote for Party Y next time.
  *   **Legacy Agent:** Executes a static function `vote(preferences_at_death)`. It cannot learn. It introduces "zombie data" into the system that cannot be corrected by reality. This degrades the system's ability to self-correct.

  #### 2. Causal Coupling is Severed
  Your verdict on Expats (V3) was that they **OUT** because they are no longer affected by the system.
  *   **The Dead:** Are strictly *less* coupled to the system than Expats. An Expat might visit or return; a dead person has zero exposure to the consequences of the vote.
  *   If Expats are out because they don't "feel" the laws, the Dead must also be out.

  #### 3. The Distinction from Future Generations (V4)
  This is likely where your conflict lies. You allow representation for the Unborn, so why not the Dead?
  *   **Direction of Time:** The Unborn *will* enter the feedback loop. They will eventually become dynamic agents who can vote for themselves. Representation for them is a **temporary bridge**.
  *   **The Dead:** Will *never* re-enter the loop. Representation for them is a **permanent override**.
  *   Giving the dead permanent voting power creates a "tyranny of the past," where the *demos* slowly becomes dominated by static preference profiles that cannot adapt to new realities (e.g., climate change, AI regulation).

  ### The Verdict on Legacy Agents

  **They do not belong.**

  To include them, you would have to drop one of your existing verdicts:
  *   **Drop V3 (Expats):** If you let the dead vote, you must let expats vote, because both are decoupled from consequences.
  *   **Drop V6 (AI Proxies):** If a Legacy Agent is a member, then an AI Proxy for a living person might also claim membership, blurring the line between tool and agent.
  *   **Drop V5 (Animals):** If "affected interests" alone grant membership (which helps the dead), then animals should belong, as they are more affected than the dead.

  **Recommendation:** Keep your current 8 verdicts. They form a robust system definition. Treat the Legacy Agent as **V6 (Instrument)** + **V3 (Decoupled)**. It is a tool executing the will of an entity that has exited the system.

  ### Summary for your Mental Model

  Think of the *demos* as a **distributed state machine**.
  *   **Members** are nodes that hold state (preferences), receive input (policy consequences), and can update their state (vote).
  *   **Children/Unborn** are nodes initializing or in the queue; they need a temporary handler (guardians/state) until they come online.
  *   **AI/Animals** are peripherals; they interact with the system but don't hold write-access to the state.
  *   **The Dead/Expats** are nodes that have gone offline or disconnected. Allowing them to write to the state introduces latency and corruption into the consensus mechanism.

  Your gut is correct: **Membership requires the capacity to suffer the consequences *and* the capacity to change your mind.** The Legacy Agent fails the second condition.
