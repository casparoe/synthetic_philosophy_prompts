answer: |-
  Let's dig into the A vs. B intuition first, because that's the emotional core of the Brier vs. Log fight. You're worried that Brier rewards "hedging your disbelief," i.e., gaining accuracy points just by subdividing the space of falsehoods. My instinct is that this *is* a bug for a pure accuracy measure, but it might be a feature for a *verisimilitude* measure. If accuracy is just "how much did you believe the truth?", Log is right: A and B believed the truth to degree 0.9, full stop. Where they put the error is irrelevant to their grip on the truth. Brier, however, measures distance to the *omniscient* credence function (the vector of 0s and 1s). Agent B is geometrically closer to that ideal vector than Agent A.

  The question is: should accuracy be about the *target* (truth) or the *distance to the ideal agent* (omniscience)? If you're an accuracy-firster who wants to derive probabilism via dominance, you are implicitly committed to the "distance to omniscience" view, because dominance is a geometric claim about the space of credence functions. If you switch to Log to save partition invariance, you lose the geometric leverage needed for the dominance argument. So, on point 1: yes, Brier's sensitivity is a cost. It means your accuracy score depends on how you carve up possibility space, which feels like it shouldn't matter for epistemic evaluation. But Log pays for that invariance by losing the ability to condemn incoherence via accuracy alone.

  Now, your hybrid fix: $S(c,w) = -\log c(w) + \lambda(\sum c(v) - 1)^2$.
  This is clever, but I think it's theoretically unstable for three reasons.
  First, **the scope of incoherence.** Your penalty term only targets the sum of atomic credences. It misses structural incoherence where additivity fails but the total mass is 1 (e.g., $c(A)=0.5, c(B)=0.5, c(A \cup B)=0.8$ on a partition where $A, B$ are cells). Brier dominates *all* incoherent functions because it penalizes deviation from 0/1 values at every proposition in the algebra (or via the geometric structure of the simplex). Your hybrid only penalizes mass violations. You'd need to bolt on penalties for every additivity constraint, which turns the score into a mess of constraints rather than a unified measure of distance from truth.
  Second, **the $\lambda$ problem.** To ensure dominance, $\lambda$ must be large enough that the penalty for incoherence always outweighs any gain in the log term. But if $\lambda$ is doing the heavy lifting to force coherence, then the "accuracy" part (the log term) is just along for the ride. You haven't shown incoherence is *inaccurate*; you've shown it's *taxed*. This breaks the unity of the program: Conditionalization is justified because it maximizes expected accuracy (Log part), but Probabilism is justified because it avoids a penalty (the $\lambda$ part). That's two different normative stories.
  Third, **truth-directedness.** A core tenet of accuracy-first is that epistemic norms should be justified solely by the goal of believing truth and avoiding error. The Log term is truth-directed (depends on $c(w)$). The penalty term is not; it depends on the relation of credences to each other, regardless of the world. By adding it, you are smuggling a coherence norm (which looks more like a pragmatic/Dutch Book constraint) into an epistemic score. It works mathematically, but philosophically it concedes that accuracy alone can't do the job.

  So, where does this leave you?
  If I have to pick a side for a unified Chapter 3: **Stick with Brier.**
  Here's why: The Accuracy-First program's biggest selling point is deriving the synchronic norm (Probabilism) and the diachronic norm (Conditionalization) from a single source. The Hybrid fractures that source. Log preserves partition invariance but forces you to find a *different* argument for Probabilism (like Dutch Book), which weakens the "Accuracy-First" brand to "Accuracy-And-Pragmatics-First."
  Brier's partition sensitivity (your A vs. B case) is a bullet worth biting. You can argue that Agent B *is* epistemically better off because they are less vulnerable to being specifically wrong. If the actual world had been one of the false ones, A would have been catastrophically inaccurate (0.1 on truth), while B would have been modestly inaccurate (0.0001 on truth). Brier captures this *risk-sensitivity*. In a decision-theoretic context, B is the safer bet. If you frame accuracy as "closeness to omniscience" rather than "belief in truth," the Brier result is correct: B's credence vector is objectively closer to the truth vector.

  **Where your hybrid loses to plain Brier:**
  1.  **Generality:** Brier dominates *all* incoherent functions. Your hybrid only dominates those with $\sum c \neq 1$. You'd need a complex web of penalties to match Brier's coverage.
  2.  **Purity:** Brier justifies coherence *as* accuracy. Hybrid justifies coherence as *avoiding a penalty*.
  3.  **Parameters:** Brier has no free parameters. Your $\lambda$ requires justification. Why 2? Why not 100? If it's too low, dominance fails. If it's too high, the log term becomes irrelevant.

  **Recommendation:** Don't hybridize. It looks like patching a leak rather than fixing the hull. Either go full Brier and defend the partition sensitivity as a feature of risk-sensitive accuracy, or go full Log and admit that Accuracy-First needs a auxiliary argument for Probabilism. For a thesis chapter aiming for a unified derivation, Brier is the stronger, more coherent (pun intended) choice, despite the counterintuitive A vs. B result. You can mitigate the intuition pump by arguing that fine-graining false worlds isn't "free"—it requires cognitive labor to distinguish those worlds, which isn't modeled in the static score.
