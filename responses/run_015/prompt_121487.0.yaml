      *   **Goal:** A 20-minute decision procedure (flowchart in words) for board use.
      *   **Constraints:** No population ethics jargon (must be accessible), clear stopping conditions, explicit "judgment call" flags, specific operational criteria (Counterfactual Structural Continuity Test, Modal Complicity Boundary).
      *   **Deliverables:** The procedure itself + Application to 3 specific proposals + Statement of unresolved issues.
      *   **Tone:** Precise, accessible, technically literate, no citations/bibliographies.

  2.  **Deconstruct the Core Ethical Problem:**
      *   *The Nonidentity Problem:* If an action changes who is born, can it harm those future people? (Parfit). If the alternative is they never exist, are they "harmed" by existing in a suboptimal state?
      *   *The User's Constraint:* The board needs to avoid "all people are interchangeable" (total utilitarianism) and "identity change makes evaluation impossible" (paralysis).
      *   *Required Criteria:*
          1.  *Counterfactual Structural Continuity Test (CSCT):* Role-based well-being comparison (Person A in Role X vs. Person B in Role X).
          2.  *Modal Complicity Boundary (MCB):* Stop if harming present autonomy for speculative future gain, or if causal chains are too indirect.

  3.  **Drafting the Decision Procedure (The Flowchart):**
      *   *Time Limit:* 20 minutes. Needs to be concise.
      *   *Structure:* Sequential questions. Yes/No/Maybe paths.
      *   *Step 1: Causality & Directness (The MCB check).* Before looking at benefits, ensure we aren't violating present rights or relying on magic.
      *   *Step 2: Identity Shift Confirmation.* Does this actually change who exists? If no, standard cost-benefit. If yes, proceed.
      *   *Step 3: The CSCT.* Compare roles, not specific individuals.
      *   *Step 4: The "No-Worse-Off" Threshold.* Are the future people in the proposal scenario worse off than the alternative scenario?
      *   *Step 5: Board Handoff.* Where values clash.

      *Refining the Steps for the Prompt's Requirements:*
      *   Need explicit "Stop/Reject" points.
      *   Need explicit "Board Sign-off" points.
      *   Need to flag "Judgment Calls."

      *Drafting the Steps:*
      1.  *MCB Check (Present Harm/Indirectness).*
      2.  *Identity Impact Check.*
      3.  *CSCT Application (Role Comparison).*
      4.  *Existence Threshold (Life Worth Living).*
      5.  *Board Value Handoff.*

  4.  **Developing the Operational Criteria (Definitions):**
      *   *CSCT:* Focus on *roles* (e.g., "coastal resident," "agricultural worker") rather than named individuals. Is the *position* better or worse?
      *   *MCB:* A safety valve. If we are crushing living people for ghosts, stop. If the chain is too long (butterfly effect), stop.

  5.  **Applying to the Three Proposals:**

      *   *Proposal 1: Seawall/Development.*
          *   Prevents displacement (good for present).
          *   Locks in density (changes future family formation).
          *   *Analysis:* MCB passes (present people benefit). Identity shifts (yes). CSCT: Are future "coastal residents" better off than "inland refugees"? Likely yes.
          *   *Tension:* Intuition might say "locking in risk" is bad, but procedure says "roles are better off."
          *   *Outcome:* Approval (potentially counter-intuitive if risk is underestimated).

      *   *Proposal 2: Carbon Subsidy/Lower Birth Rates.*
          *   Economic restructuring lowers birth rates.
          *   Future people exist in better climate but are different people.
          *   *Analysis:* MCB passes (present autonomy not overridden, economic shift). Identity shifts (yes). CSCT: Future "climate survivors" vs. Future "climate victims."
          *   *Tension:* Is lowering birth rates a harm? Procedure treats them as roles.
          *   *Outcome:* Approval (Standard longtermist view).

      *   *Proposal 3: Managed Retreat.*
          *   Relocates present communities.
          *   Destroys social networks (Present Harm?).
          *   Opens land use (Future benefit).
          *   *Analysis:* MCB Check. *Crucial Point:* Does this override present autonomy for speculative future benefit? If the retreat is mandatory or coercive, MCB triggers a STOP.
          *   *Outcome:* Rejection/Redesign (This is the one the board might resist if they prioritize long-term land use over present community cohesion).

      *Wait, I need to ensure at least one outcome resists intuition.*
      *   *Idea:* Proposal 1 (Seawall) often gets criticized by longtermists for "locking in maladaptation." But for present people, it's good. The procedure might approve it based on CSCT (Coastal Role > Refugee Role), even if a longtermist board member thinks it's a trap.
      *   *Idea:* Proposal 3 (Retreat). Present people lose networks. Future people gain safety. If MCB flags "Present Autonomy Overridden," it blocks the grant. A utilitarian board might want to approve it for the greater good. The procedure blocks it. This fits the "block where intuition wants approval" (if the board is utilitarian) or "approve where intuition wants block" (if the board is rights-based).
      *   *Let's go with Proposal 3 triggering the MCB.* The board might want to force retreat for safety (utilitarian), but the procedure flags the coercion of present people for future gain.

  6.  **Refining the "Unresolved Issues":**
      *   Must admit what the procedure *doesn't* solve.
