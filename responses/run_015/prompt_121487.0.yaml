answer: |-
  ### Operational Criteria Definitions

  Before applying the procedure, the analyst must internalize two specific definitions. These are not general ethical concepts but operational gates for this fund.

  **1. Counterfactual Structural Continuity Test (CSCT)**
  *Definition:* Do not compare specific future individuals (who will not exist in the alternative scenario). Instead, compare the **social and environmental roles** created by the proposal against the roles in the best feasible alternative.
  *Operational Rule:* A proposal passes the CSCT if a person occupying the primary role in the Proposal Scenario (e.g., "Coastal Homeowner in 2080") has higher expected well-being than a person occupying the corresponding role in the Alternative Scenario (e.g., "Inland Climate Refugee in 2080"), regardless of whether they are the same biological human.
  *Judgment Flag:* Defining the "Role" is subjective. Is the role "Resident," "Taxpayer," or "Head of Household"? The analyst must justify the role granularity.

  **2. Modal Complicity Boundary (MCB)**
  *Definition:* A safety valve that stops the analysis if the causal chain relies on violating present rights or becomes too speculative.
  *Operational Rule:* Trigger the MCB if: (A) The proposal requires overriding the informed consent or autonomy of living people to secure benefits for people who do not yet exist; OR (B) The causal link between the grant and the future structural condition relies on more than three major socio-political variables changing as predicted.
  *Judgment Flag:* Determining "Overriding Autonomy" vs. "Incentivizing Choice" is a legal and ethical judgment call, not a mathematical one.

  ***

  ### The 20-Minute Identity-Impact Procedure

  **Time Allocation:** 20 Minutes Total
  **Operator:** Senior Analyst
  **Output:** Recommendation (Approve, Reject, Redesign, or Board Handoff)

  #### Step 1: The Modal Complicity Boundary Screen (3 Minutes)
  **Question:** Does this proposal require coercing present stakeholders or rely on a causal chain that is too fragile to measure?
  *   **Check A (Autonomy):** Are living residents being forced to move, change livelihoods, or accept risk without their consent to benefit future generations?
      *   *If YES:* **STOP.** Flag as **MCB Violation (Type A)**. Send back for redesign to include voluntary participation mechanisms.
  *   **Check B (Indirectness):** Does the benefit to 2120 depend on more than three major variables (e.g., specific election outcomes, unproven tech scaling, stable geopolitical borders) holding true?
      *   *If YES:* **STOP.** Flag as **MCB Violation (Type B)**. Reject proposal as too speculative.
  *   *If NO to both:* Proceed to Step 2.
  *   **[JUDGMENT FLAG]:** Distinguishing between a "nudge" and "coercion" in Check A is not procedural. The analyst must document the pressure level applied to present stakeholders.

  #### Step 2: Identity-Shift Confirmation (2 Minutes)
  **Question:** Will this grant materially alter the timing of conceptions, migration patterns, or family formation enough that the specific individuals living in the region in 2120 would be different from those in the status quo?
  *   *If NO:* **STOP.** Standard Cost-Benefit Analysis applies. Identity ethics are irrelevant.
  *   *If YES:* Proceed to Step 3. (Note: For 50–100 year infrastructure projects, the answer is almost always YES).
  *   **[JUDGMENT FLAG]:** "Materially alter" is a threshold call. If the change is minor, treat as NO. If major, treat as YES.

  #### Step 3: Counterfactual Structural Continuity Test (7 Minutes)
  **Question:** Comparing *roles* rather than *people*, is the primary future role in the Proposal Scenario better off than the primary future role in the Alternative Scenario?
  *   **Action:** Define the Primary Future Role (e.g., "2120 Delta Farmer"). Define the Counterfactual Role (e.g., "2120 Displaced Laborer").
  *   **Metric:** Compare expected quality of life, security, and agency.
  *   *If Proposal Role is Significantly Worse:* **STOP.** Recommend **Rejection**. (Do not create future roles that are structurally inferior to the alternative).
  *   *If Proposal Role is Equivalent or Better:* Proceed to Step 4.
  *   **[JUDGMENT FLAG]:** Selecting the "Primary Future Role" determines the outcome. Ignoring a minority role (e.g., "Unskilled Laborer" vs. "Land Owner") is an analyst choice that biases the result.

  #### Step 4: The Existence Threshold Check (3 Minutes)
  **Question:** In the Proposal Scenario, will the people who exist have lives that are "worth living" (i.e., do they suffer net negative well-being)?
  *   *If NO (Life is net negative):* **STOP.** Recommend **Rejection**. (Even if they wouldn't have existed otherwise, creating miserable lives is a hard block).
  *   *If YES (Life is net positive):* Proceed to Step 5.
  *   **[JUDGMENT FLAG]:** Defining "net negative" in a climate context (e.g., survivable heat vs. thriving heat) requires welfare assumptions.

  #### Step 5: Board Value Handoff (5 Minutes)
  **Question:** We have passed the safety screens. The remaining question is: Do we prioritize the *quality of the structural role* (CSCT) over the *rights of the specific present generation*?
  *   **Action:** Present the MCB and CSCT findings.
  *   **Decision:** Board must vote to **Ratify** or **Veto**.
  *   **Condition:** If Step 1 triggered an MCB Type A (Autonomy), the Board must vote by supermajority to override the analyst's redesign recommendation.
  *   **[JUDGMENT FLAG]:** This is not a fact-finding step. This is where the board admits whether they are acting as trustees for the living or stewards for the abstract future.

  ***

  ### Application to Proposals

  #### 1. Seawall and Coastal-Development Package
  *   **Step 1 (MCB):** No coercion; present residents want the wall. Causal chain is direct (wall stops water). **Pass.**
  *   **Step 2 (Identity):** High-density locking alters family formation and migration. **Identity Shift Confirmed.**
  *   **Step 3 (CSCT):**
      *   *Proposal Role:* "2120 Protected Coastal Resident."
      *   *Alternative Role:* "2120 Inland Climate Refugee."
      *   *Comparison:* Coastal Resident has higher asset security and community continuity. **Pass.**
  *   **Step 4 (Existence):** Lives are net positive. **Pass.**
  *   **Step 5 (Handoff):** Board Ratification.
  *   **Result:** **APPROVAL RECOMMENDED.**
  *   **Resistance Point:** Longtermist board members may resist this. They may argue that "locking in" a high-risk zone creates a "trap role" for the future, even if it looks better than being a refugee *now*. The procedure approves it because the *role* is better than the counterfactual role, ignoring the risk that the seawall might fail in 2100. The procedure prioritizes the *comparative role quality* over *long-term systemic risk*.

  #### 2. Carbon-Reduction Subsidy (Economic Restructuring)
  *   **Step 1 (MCB):** Economic shifts are incentives, not coercion. Causal chain (subsidy -> emissions -> climate -> birth rates) involves many variables.
      *   *Analyst Note:* This risks MCB Type B (Indirectness). However, if the economic modeling is robust, we proceed. **Pass (with caveat).**
  *   **Step 2 (Identity):** Lower birth rates mean entirely different future population. **Identity Shift Confirmed.**
  *   **Step 3 (CSCT):**
      *   *Proposal Role:* "2120 Resident in Stabilized Climate."
      *   *Alternative Role:* "2120 Resident in High-Warming Scenario."
      *   *Comparison:* Stabilized Climate Role has higher security/health. **Pass.**
  *   **Step 4 (Existence):** Lives are net positive. **Pass.**
  *   **Step 5 (Handoff):** Board Ratification.
  *   **Result:** **APPROVAL RECOMMENDED.**
  *   **Resistance Point:** Minimal resistance. This aligns with standard intuition. The procedure validates the intuition by bypassing the "different people" objection via the CSCT.

  #### 3. Managed-Retreat Grant (Relocation)
  *   **Step 1 (MCB):**
      *   *Check A (Autonomy):* The grant funds relocation incentives, but the land-use plan effectively renders staying impossible (insurance withdrawal, zoning changes).
      *   *Analyst Note:* This borders on overriding autonomy of present elders who wish to age in place, for the sake of future land-use efficiency.
      *   *Decision:* **FLAG MCB Violation (Type A).**
  *   **Step 2 (Identity):** Relocation changes settlement patterns. **Identity Shift Confirmed.**
  *   **Step 3 (CSCT):**
      *   *Proposal Role:* "2120 Safe Inland Resident."
      *   *Alternative Role:* "2120 Vulnerable Coastal Resident."
      *   *Comparison:* Safe Inland Resident is objectively safer. **Pass.**
  *   **Step 4 (Existence):** Lives are net positive. **Pass.**
  *   **Step 5 (Handoff):** **BOARD VETO REQUIRED.** Because Step 1 flagged an Autonomy Violation, the analyst recommends **Redesign**. To proceed, the Board must vote by supermajority to override the MCB.
  *   **Result:** **BLOCK / REDESIGN.**
  *   **Resistance Point:** The Board will likely resist this block. Their intuition is that "saving lives from sea-level rise" justifies the disruption. The procedure forces them to admit they are sacrificing the *specific social networks of the living* for the *structural safety of the unborn*. The MCB prevents the grant from proceeding as a technical fix; it forces a moral admission.

  ***

  ### Unresolved Issues and Limitations

  This procedure does not solve the underlying philosophical tensions; it manages them procedurally. The Board must remain aware of three unresolved gaps:

  1.  **Impersonal Value vs. Person-Affecting Duties:** The CSCT assumes we care about the *quality of the slot* (the role) rather than the *person in the slot*. If the Board believes we owe duties to specific future individuals (even if they don't exist yet), this procedure is insufficient. It treats future people as placeholders.
  2.  **The Definition of "Role":** In Step 3, the analyst defines the role. If the analyst defines the role broadly ("Human"), the test always passes. If defined narrowly ("Owner of Legacy Home"), it may fail. This is an irreducible judgment call disguised as a classification task.
  3.  **Present Rights vs. Future Existence:** The MCB protects present autonomy, but it does not tell the Board what to do if present autonomy guarantees future catastrophe. It forces a vote, but it does not provide the moral weight for that vote. The Board is signing off on the *trade-off*, not resolving the *ethics*.

  **Analyst Instruction:** When presenting Step 5 to the Board, explicitly state: "This procedure confirms the future roles are safer, but it cannot calculate the moral cost of disrupting the present community. That value judgment is yours."
