      *(Final check on the "Resist" case)*: Proposal 3 (Managed Retreat) is the strongest candidate. Boards often love "managed retreat" as a rational solution. But if it destroys existing social networks (present harm) for future land use (future benefit), the MCB should flag it. This forces the board to admit they are sacrificing the living for the unborn. That's a hard pill to swallow.

