      *   Duties to specific individuals vs. structures.
      *   The definition of "Role."

  7.  **Review against Constraints:**
      *   20-minute run time? Yes, 5 steps.
      *   No bibliographies? Yes.
      *   Accessible language? Avoid "deontological," "mere addition paradox," etc. Use "rights," "trade-offs."
