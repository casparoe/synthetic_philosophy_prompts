  *   **Advice:** Acknowledge the objection in a footnote but argue that Ames's own methodology (classifying the Rat and considering the Spider) treats the ladder as a taxonomy of **cognitive systems**, not just biological species. To exclude Whetstone on ontological grounds would invalidate her own hesitation on the Spider. The question is not "Is it alive?" but "Does it function like a Gregorian creature?"

