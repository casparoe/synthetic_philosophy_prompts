      *   *Visible:* Shape (Circle, Square, Triangle), Color (Red, Blue, Green). $3 \times 3 = 9$ types.
      *   *Hidden:* "Volatile" (explodes/reacts) vs. "Stable".
      *   *The Rule:*
          *   Surface Intuition: All Reds behave alike. All Circles behave alike.
          *   Joint Reality: Volatility is determined by a cross-cutting rule. E.g., Red Circles AND Blue Triangles are Volatile. Blue Squares AND Red Triangles are Stable.
          *   Wait, if I give Team Joint the rule, they aren't *discovering* joints, they are just following instructions.
          *   *Correction:* Team Joint needs to *infer* the rule from a few "lab tests" (flipped cards), while Team Surface guesses based on looks.
          *   *Better:* To save time (75 mins is tight), pre-assign the taxonomy. Team Surface *decides* the groups based on looks. Team Joint *is given* the "True Taxonomy" (the hidden rule) but isn't told why it works, just that it does.
          *   *Refinement:* Let's make it a prediction game.
          *   Deck of 20 cards.
          *   Visible side up.
          *   Hidden side down (Property X: Yes/No).
          *   Team Surface creates 3 categories based on looks.
          *   Team Joint creates 3 categories based on a provided "Causal Key" (which groups look-alikes apart).
          *   Reveal cards, score predictions.

  5.  **Refining the "Joint" Rule for Maximum Tension:**
      *   If the Joint rule is just "Chemical Composition A vs B," it's too easy.
      *   To make it feel "gruesome," the Joint categories should be disjunctive.
      *   *Category Alpha:* Red Circles + Blue Squares.
      *   *Category Beta:* Green Triangles + Red Squares.
      *   *Category Gamma:* Everything else.
      *   *Property:* Alpha = Toxic. Beta = Nutritious. Gamma = Inert.
      *   *Surface Intuition:* "All Reds go together." "All Circles go together."
      *   *Result:* Surface groups Red Circles with Red Squares. Joint groups Red Circles with Blue Squares.
      *   *Outcome:* Surface predicts Red Circle = Red Square behavior (Wrong). Joint predicts Red Circle = Blue Square behavior (Right).
      *   *Feeling:* Joint feels like they are mixing apples and oranges. Surface feels like they are organizing a museum.

  6.  **Timeline Management (75 mins):**
      *   Intro (10 min)
      *   Setup/Team Split (5 min)
      *   Round 1: Taxonomy Creation (15 min)
      *   Round 2: Prediction Phase (15 min)
      *   Scoring/Reveal (10 min)
      *   Debrief (20 min)
      *   *Buffer:* 5 mins.

  7.  **Addressing the Limitations:**
      *   What can't this simulate? Real essences. In the game, the "Joint" rule is stipulated by the instructor. In reality, we don't have the "God's eye view" key. We have to argue for the joints. The game proves *if* there are joints, they might look weird. It doesn't prove there *are* joints.
      *   Also, the game makes the "Joint" rule perfectly predictive. Real science is probabilistic.
      *   Predicted Failure: Students might try to find the pattern too fast. Or Team Surface might accidentally stumble on the Joint rule if the visible traits correlate too well. I need to ensure the visible traits are misleading.

  8.  **Developing the Materials:**
      *   Need a specific set of cards. I will describe the template.
