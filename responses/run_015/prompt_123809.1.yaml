      *   Connect Joint to Realism/Essentialism (kinds are for the world).
      *   Discuss the cost of Joint: Cognitive load, communication difficulty ("Why is this Red Circle in the same bin as that Blue Square?").
      *   Discuss the cost of Surface: Failed induction, danger.
      *   The "Grue" problem: Is the Joint rule just a disjunction of surface traits? If so, is it really a "natural kind"?

  10. **Review against Constraints:**
      *   14 people? Yes, split 7 vs 7.
      *   75 mins? Yes, tight but doable.
      *   No bird/bat? Yes, using abstract shapes/colors.
      *   No citations? Yes.
      *   Frank about limitations? Yes.

  11. **Final Polish:**
      *   Make sure the "Joint" rule is explicitly *disjunctive* to highlight the "gruesome" aspect.
      *   Ensure the scoring clearly favors Joint.
      *   Add a "Cognitive Load" penalty or discussion point to show why we don't always use Joint kinds.

