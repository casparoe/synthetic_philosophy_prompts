answer: |-
  Your critique group holds the naive view: a trait is real only if the character acts on it when the plot demands. This is the golden rule of show-don't-tell. If he's brave, he stands firm in the pressure scene. But philosophy offers four glitches where this logic breaks, translated here into craft problems.

  1.  **The Vanishing Trait (Fink):** The coward finds courage exactly when the gun is drawn, then loses it immediately after the shot. The trait exists until the test, then dissolves. The scene shows bravery, but the character isn't brave. The pressure scene fixes the behavior but not the disposition.
  2.  **The Blocked Trait (Mask):** The brave character is paralyzed by anesthesia during the crisis. The courage is real (your narration says so), but the page shows stillness. The scene fails to show the trait despite its presence. External circumstance masks the internal reality.
  3.  **The False Signal (Mimicker):** The coward runs away, accidentally triggering a trap that saves the day. It looks like strategic bravery (manifestation), but it was panic. The scene creates the appearance of a trait that isn't there. The action matches the trait, but the cause does not.
  4.  **The Interrupted Spark (Antidote):** The character snaps into rage, but a phone call calms them mid-scream. The trigger fires, but the outcome is stopped. The pressure scene happens, but the result is erased before it lands.

  **The Residue Report**
  Here is the metaphysics versus your craft. In real life, we infer traits from behavior because we lack access to minds. In fiction, you have god-mode. You can write "He was a cruel man" in narration, even if every scene shows him smiling. Is this cheating? No. In fiction, the narration *is* reality. A real person's trait is a prediction of future behavior. A character's trait is a statement of textural fact.

  The gap between your narration and the scene isn't a contradiction; it's dramatic irony. You aren't cheating; you're defining. The author's power to stipulate a trait straight-out is actually the cleanest picture of what a disposition is. It bypasses the noise of behavior. When you tell the reader "she was loyal," you aren't hiding the truth; you are establishing the law of that universe. The scenes are just evidence, sometimes admissible, sometimes not. The trait exists because you say it exists, not because the scenes prove it.

  **The New Case: The Retroactive Rewrite**
  Here is a case real people can't experience: You publish Book 1 where the villain is evil. In Book 2, you reveal he was mind-controlled the whole time. Does the evil trait exist in Book 1? Real people can't change their past nature based on future information. Characters can.

  Is this a new kind of glitch? It feels like a **Mimicker** stretched across time. In Book 1, the behavior looked like evil, but the cause was external. The "trait" was a mask worn by the plot, not the person. However, because you, the author, change the truth of the text itself, it's also a **Fink**: the trait was there, then you reached back and removed it. It's an old tangle in a new costume. It proves that in fiction, traits aren't discovered; they're decided. The pressure scene doesn't reveal the character; the author reveals the character, and the pressure scene just carries the message.
