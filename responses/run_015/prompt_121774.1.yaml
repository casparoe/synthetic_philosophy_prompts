answer: |-
  **MEMORANDUM OF OPINION**

  **TO:** State Architectural Licensing Board
  **FROM:** Appeals Panel
  **DATE:** October 26, 2023
  **RE:** In the Matter of Architect M. – Appeal of Suspension

  **I. RECOMMENDATION**

  The Appeals Panel recommends **upholding the suspension** of Architect M.'s license. However, we modify the terms of the sanction to reflect the novel complexities introduced by the integration of proprietary AI into the design workflow. We recommend a suspension period of twenty-four (24) months. Reinstatement shall be conditional upon M. demonstrating renewed competency in algorithmic oversight and providing evidence that her firm's protocols have been adjusted to ensure human veto power is operationally viable, not merely theoretical.

  **II. THE PHILOSOPHICAL CHALLENGE**

  Architect M. does not deny that she stamped the plans, nor that the plans were deficient. Her appeal rests entirely on the condition of liability set forth in the Board's Charter: that suspension is permitted only for conduct for which the licensee bears "genuine moral responsibility."

  M. invokes a rigorous philosophical position (often associated with the "Basic Argument" regarding moral luck and determinism). Her contention is as follows:
  1. To be genuinely responsible for an action, one must be responsible for the mental state that produced the action.
  2. One's mental state is the product of prior causes (education, firm culture, algorithmic constraints).
  3. One cannot be responsible for those prior causes, as one did not choose them.
  4. Therefore, one cannot be genuinely responsible for the action.

  M. argues she is a conduit, not an author. She was educated by institutions she did not choose, employed by a firm whose AI mandate she did not write, and relied on software whose logic she did not encode. To blame her, she argues, is to ignore the causal chain that made her decision inevitable. She claims she lacks *causa sui* (self-causation), and thus, under the Charter's strict language, she cannot be blamed.

  We treat this argument with the seriousness it deserves. It exposes a tension in our Charter. If "genuine moral responsibility" requires metaphysical ultimate authorship, then no licensee can ever be disciplined. Every architect is the product of training, codes, client demands, and physical laws. If we accept M.'s definition, the Board loses the authority to regulate, and the public loses the protection the Charter was designed to ensure.

  **III. INTERPRETING "GENUINE MORAL RESPONSIBILITY"**

  The Board must reject the metaphysical interpretation of the Charter in favor of a functional one. The Charter's requirement for "genuine moral responsibility" is not an invitation to solve the problem of free will. It is a legal standard intended to distinguish between *accidental/causal involvement* and *attributable agency*.

  We distinguish between two types of responsibility:
  1.  **Ultimate Responsibility:** The metaphysical claim that an agent is the uncaused cause of their own nature. We acknowledge M. is correct that no human possesses this.
  2.  **Practical Agency:** The capacity of a rational actor to recognize rules, evaluate risks, and exercise a veto over their actions, even within a determined system.

  The Charter's "genuine moral responsibility" refers to **Practical Agency**. A licensee bears moral responsibility when they possess the capacity to understand professional standards and the freedom to act in accordance with them, even if that capacity is shaped by external factors.

  M. was not physically coerced. No gun was held to her head. She faced professional pressure (the firm's mandate), but professional pressure is not determinism. The law and this Board operate on the premise that professionals are capable of resisting improper pressure. If a firm mandates a practice that violates safety standards, the architect's moral responsibility is triggered precisely at the moment they choose compliance over public safety. To argue otherwise is to reduce the architect to a tool, indistinguishable from the AI they used. But the license is granted to the human, not the software. The human stamp signifies that a moral agent has verified the work.

  Therefore, M.'s argument fails to defeat the Charter's standard because it conflates *causal influence* with *compulsion*. Education and algorithms influence judgment; they do not erase the capacity for critical review. M. retained the "veto power." She could have refused to stamp. She could have resigned. She could have flagged the deficiency. Her failure to exercise these available options constitutes a failure of Practical Agency, satisfying the Charter's requirement for genuine moral responsibility.

  **IV. APPLICATION TO M.'S CONDUCT**

  M. argues that the AI output was a "black box" she could not fully audit. However, the core duty of an architect is not to generate every calculation personally, but to certify that the totality of the design is safe for habitation.

  By affixing her seal, M. represented that she exercised independent professional judgment. The evidence shows she deferred entirely to the proprietary system without independent verification of the structural load paths. While the firm mandated the *use* of the AI, it did not mandate *blind acceptance* of its output. The collapse was not caused by the AI alone, but by the removal of the human safety layer.

  M. bears responsibility because she occupied the role designed to catch exactly this type of error. To exonerate her because the error originated in an algorithm would be to declare that architects are no longer responsible for the buildings they seal, only for the tools they use to seal them. This is incompatible with the public trust inherent in licensure.

  **V. FRAMEWORK FOR FUTURE CASES (THE AGENCY RETENTION TEST)**

  As AI and automated design tools become ubiquitous, the Board requires a framework to adjudicate responsibility where human judgment is augmented or constrained by software. In future appeals involving algorithmic design failures, the Board shall apply the **Agency Retention Test**. A licensee bears responsibility if the following three conditions are met:

  1.  **Verification Capacity:** Did the licensee have access to the data or methods necessary to reasonably verify the output? (If the tool is truly opaque and verification is impossible, the tool itself should not be licensed for use, but the architect is responsible for selecting an unverifiable tool).
  2.  **Operational Veto:** Did the licensee possess the actual authority to halt the process or refuse the seal without immediate, unlawful retaliation? (Economic pressure or firm policy does not negate this veto).
  3.  **Foreseeable Risk:** Was the risk of failure within the scope of professional knowledge at the time? (An architect cannot be blamed for unknown unknowns, but is responsible for failing to investigate known limitations of a tool).

  If these three conditions are met, the licensee retains Practical Agency and bears genuine moral responsibility for the outcome, regardless of the tool's involvement.

  **VI. DISPOSITION AND REINSTATEMENT CONDITIONS**

  We uphold the suspension because M. failed the Agency Retention Test. She had the capacity to verify, the authority to veto, and the professional duty to foresee structural risks.

  However, we acknowledge that M.'s appeal highlights a systemic vulnerability. The profession is entering an era where "firm mandates" may increasingly conflict with individual judgment. Therefore, while we uphold the finding of responsibility, we tailor the sanction to encourage systemic correction alongside individual accountability.

  **Order:**
  1.  **Suspension Upheld:** M.'s license shall remain suspended for a period of **twenty-four (24) months** from the date of the original order.
  2.  **Conditions for Reinstatement:** Prior to reinstatement, M. must:
      *   Complete a Board-approved curriculum on Algorithmic Oversight and Structural Verification.
      *   Submit a sworn affidavit from her employer confirming that her role has been restructured to guarantee "Operational Veto" power over AI-generated designs, ensuring she cannot be compelled to seal work she has not personally verified.
      *   Pass a practical examination demonstrating competency in identifying structural deficiencies in AI-assisted designs.

  **VII. CONCLUSION**

  We reject the notion that determinism absolves professional duty. The license to practice architecture is a social contract, not a metaphysical status. It grants the privilege to shape the built environment in exchange for the acceptance of accountability. M. accepted the privilege. She must now accept the consequence. By upholding the suspension, we affirm that the human architect remains the final moral anchor of the design process, regardless of the sophistication of the tools they wield.

  **Signed,**

  **The Appeals Panel**
  **State Architectural Licensing Board**
