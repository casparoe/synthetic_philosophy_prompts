      *   *Initiatory Omission:* Agent fails to start a preventive process that was expected/structured to exist. (e.g., A safety system requires a manual override key turn to activate shields. I fail to turn the key. The shield never activates. The harm comes from the external threat, but the *absence* of the shield is the key factor.)
      *   *Nuance:* The prompt asks to distinguish them based on whether an existing harmful chain is left untouched (preservative) vs. a safeguard chain never gets activated (initiatory).
      *   *Challenge:* In many standard counterfactual theories of causation, both look similar (If I had acted, harm wouldn't have occurred). The distinction needs to rely on structural features (process theories, normality conditions, or specific system architecture).
