answer: |-
  **MEMORANDUM**

  **TO:** Methodology and Appeals Committee
  **FROM:** [Your Name], Engineering Lead, Forecasting Pipeline
  **DATE:** 14 March
  **SUBJECT:** Recommendation Regarding Dispersion Review Mechanics and Appellant Claims

  **Executive Summary**

  This memo recommends a modification to the Dispersion Review rule adopted two seasons ago. Specifically, I propose we retain the sixty percent shrinkage mechanism for the published aggregate but immediately suspend the public "sustained-divergence marker" and its use in personnel evaluations. We should reclassify the underlying shared-prior assumption as a modeling convention rather than a requirement of individual rationality. This approach preserves the statistical benefits of our aggregation pipeline while ceasing to penalize forecasters for epistemic states we cannot empirically verify. I further propose a pre-registered accuracy audit to run at the close of the next season to validate whether shrinkage continues to serve our clients.

  **The Status of the Shared-Prior Assumption**

  To resolve this appeal, we must first define what the shared-prior assumption is doing in our pipeline. The Data Lead's defense relies on the structural logic that if agents share a prior and share evidence, they cannot agree to disagree. Under this view, persistent divergence after deliberation signals a failure of rationality—a refusal to update.

  However, our logs confirm we cannot distinguish between a forecaster who has failed to update and one who started with a genuinely different prior. In engineering terms, these two states produce identical observable outputs. If we treat the shared-prior assumption as a *law of rationality*, we are entitled to label divergent forecasters as defective reasoners. But if we treat it as a *modeling convention*—a constraint we impose to generate a stable aggregate—we are not entitled to enforce it on named individuals as a moral or professional failing.

  Meridian sells a "rational consensus." This is a product specification, not a metaphysical claim about our forecasters' minds. The aggregation model requires a common prior to function mathematically as designed. When a forecaster diverges, they violate the model's constraints, not necessarily the laws of logic. Therefore, we may adjust their weight in the model to maintain product integrity, but we may not stamp their profile with a marker implying irrationality. The appellants are correct: the marker claims they are being irrational. The data only shows they are outliers.

  **Addressing the Data Lead**

  The Data Lead argues that the rule improved the aggregate's Brier score by eleven percent in the first season. This is a strong empirical case for retaining the shrinkage mechanism. If the goal is solely to minimize error in the published number, shrinking outliers toward the mean is a standard regularization technique. It prevents individual noise from distorting the consensus.

  However, the Data Lead's argument conflates *convergence* with *accuracy*. Of the fourteen flagged positions that have resolved, three resolved in the flagged forecaster's favor, including our single largest miss last season. Because the marker is applied before resolution, the eleven percent improvement tells us the aggregate became more confident and consistent, but not necessarily more correct. It is possible the audit bought convergence at the cost of calibration. If we shrink the correct contrarian toward the incorrect mean, we improve the score of the group only if the group was already right. If the group is systematically biased on a specific question family (such as AI capability bars), shrinkage reinforces that bias.

  I reject the proposal to drop the rule entirely. Without shrinkage, the aggregate collapses toward a plain average, losing the "consensus" value we sell. The model needs teeth to function. But the teeth should bite the number, not the person.

  **Addressing the Appellants**

  Adeyemi and Kowalczyk raise two substantive points. First, they argue they are often pricing different events due to reference-class mismatches. Our tagging system supports this; if they are answering different questions, the divergence is a data-entry error, not a reasoning failure. Second, they argue that differing priors are not defects.

  I accept the second claim as a matter of epistemic fairness. In the real world, rational agents often hold different priors based on unshared life experiences. To mark this as a defect is to enforce a homogeneity that does not exist outside our model. If we cannot distinguish a different prior from a failed update, we must grant the benefit of the doubt to the forecaster.

  However, I cannot accept the call to remove shrinkage entirely. Even if their priors are valid, our product is the *consensus*. If a forecaster's valid prior produces a number that consistently degrades the aggregate's performance (as measured by Brier score), the pipeline must down-weight that input to protect the client. This is not a judgment on their skill, but a weighting decision for the ensemble.

  **Recommendation**

  I recommend the committee adopt the following three-point modification:

  1.  **Retain Shrinkage, Remove Marker:** Continue to shrink probabilities more than twenty points from the aggregate by sixty percent for the published number. This maintains the statistical integrity of the product. However, suspend the public "sustained-divergence marker" indefinitely. Remove the marker from consideration in annual reviews and paid panel invitations.
  2.  **Reclassify the Violation:** Internally reclassify a "dispersion flag" from a *rationality failure* to a *model mismatch*. It indicates the forecaster's input does not fit the aggregation assumptions, not that the forecaster is incompetent.
  3.  **Reference-Class Audit:** Implement a mandatory pre-submission check where forecasters must explicitly confirm they are using the same reference-class tags for paired divergent questions. If tags differ, the question is returned for clarification before the deliberation window closes.

  **Pre-Registered Check**

  To address the uncertainty regarding accuracy versus convergence, we will run a shadow audit next season. For every question triggering the dispersion threshold, we will calculate two aggregates: the standard shrunk version and an unshrunk version. We will pre-register the following success metric: *If the unshrunk divergent forecasts achieve a lower Brier score than the shrunk forecasts on resolved questions by a margin of five percent, the shrinkage rule will be suspended for that question family.*

  This test acknowledges that we cannot see inside the forecasters' heads. We judge the method by its fruit. If the "irrational" outliers are actually right, the model must adapt.

  **Conclusion**

  We are building a machine that produces numbers for clients. We are not building a court that judges souls. The Data Lead is right that the machine needs constraints to work. The Appellants are right that those constraints should not be used to damage their reputations based on unprovable assumptions about their priors. By separating the treatment of the data from the treatment of the person, we protect both the product's accuracy and the community's trust.

  I move we adopt these changes effective immediately for the upcoming season.
