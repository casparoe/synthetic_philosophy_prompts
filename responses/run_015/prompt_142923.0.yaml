      *   **The Appeal:** Adeyemi (high prob) and Kowalczyk (low prob) consistently diverge on AI capability questions. They claim: 1) Different reference classes (not same event), 2) Different priors (not irrational), 3) Marker implies irrationality unfairly.
      *   **The Defense (Data Lead):** Rule improved Brier score by 11%. Persistent divergence implies failure to update (Aumann's Agreement Theorem logic). Removing it collapses the model to a plain average.
      *   **Complications:** 3/14 flagged divergences resolved in the *flagged* forecaster's favor (including a big miss). Cannot empirically distinguish "different prior" from "failed update" in logs.
