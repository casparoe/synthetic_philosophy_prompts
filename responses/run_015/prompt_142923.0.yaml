      *   *Philosophical Core:* The prompt asks to state plainly what the shared-prior assumption is doing. I need to argue it's a *modeling convention* for the sake of aggregation, not an enforceable *rationality requirement* for individuals. This resolves the conflict: we can shrink for the model's sake without calling them irrational.
      *   *Steelmanning:* I need to make sure the Data Lead's argument (Aumann-esque logic) is presented strongly before critiquing it. Also, the Appellants' argument about priors needs to be respected.
      *   *The "Test":* Since we can't distinguish priors from updates, the test should focus on *resolution accuracy* of divergent vs. shrunk forecasts.

  5.  **Refining the Argument (Self-Correction during drafting):**

