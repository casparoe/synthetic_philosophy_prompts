      *   *Option D: Conditional shrinkage.* Hard to implement because the prompt admits "I could not construct any test that separates having started from a different prior from having failed to absorb shared evidence."
      *   *Decision:* Option C is the most pragmatic engineering solution. It acknowledges the model's utility (shrinkage helps accuracy) without making an unprovable philosophical claim about individual rationality (the marker). It treats the shared-prior assumption as a *modeling convention* for aggregation, not a *rationality requirement* for individuals.

  3.  **Outline the Memo:**

