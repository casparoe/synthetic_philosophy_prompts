      *   *Data Lead:* Acknowledge the Brier score. But correlation != causation regarding "failure to update."
      *   *Appellants:* Acknowledge the reference class issue. Acknowledge that different priors aren't irrational.
      *   *Recommendation:* Shrinkage stays (for the product), Marker goes (for the people).
      *   *Test:* Compare Brier scores of "divergent unshrunk" vs "divergent shrunk" in a blind A/B or shadow mode.

  7.  **Final Polish:** Check tone, ensure no citations, check word count. (Aiming for dense, professional prose).

      *(Self-Correction on Word Count)*: 1200 words is substantial. I need to expand on the *implications* of the recommendation. Why does calling it a "convention" matter? Because conventions can be changed; laws of rationality cannot. If it's a convention, we can't punish people for violating it as if it were a moral failing.

      *(Refining the Test)*: The prompt asks for a "pre-registered check we could run at the end of next season." It should be specific. Let's propose a "Shadow Season" where we calculate the aggregate *with* and *without* shrinkage on divergent cases to see if the shrinkage actually helped resolution accuracy, rather than just in-sample Brier scoring.

  8.  **Final Review against constraints:**
      *   ~1200 words? (Will monitor during drafting).
      *   No citations? (Check).
      *   Argue from structure? (Check).
      *   Steelman rejected side? (Check).
