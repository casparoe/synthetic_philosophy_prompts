prompt: |-
  hey so my philosophy teacher summed up wittgensteins hinge epistemology for our class and im not sure she nailed it. she said in On Certainty he talks about hinge beliefs like the earth being really old or that i have hands, and these work like self-evident axioms at the bottom of everything we know. she said they never need justification, theyre literally the same for every human being, and if you actually start doubting one then your whole belief system collapses. then she said its basically just foundationalism except he replaced sense data with language games, so its not actually that different from old school epistemology. is that fair? which parts are actually right about hinges and which parts are her misreading him? and does her conclusion that its just foundationalism with language games actually follow from the accurate parts?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Wittgenstein's *On Certainty* and "hinge epistemology."
      *   **Teacher's Summary:**
          1.  Hinge beliefs (e.g., earth is old, I have hands) are like self-evident axioms at the bottom of knowledge.
          2.  They never need justification.
          3.  They are literally the same for every human being (universal).
          4.  Doubting one collapses the whole belief system.
          5.  Conclusion: It's basically foundationalism but with language games instead of sense data (not actually that different from old-school epistemology).
      *   **User's Questions:**
          1.  Is that fair?
          2.  Which parts are right/wrong?
          3.  Does the conclusion (it's just foundationalism) follow from the accurate parts?

  2.  **Evaluate the Teacher's Claims against Wittgenstein's *On Certainty*:**

      *   *Claim 1: Hinge beliefs are like self-evident axioms at the bottom of knowledge.*
          *   **Verdict:** Partially right, but misleading. They function *like* axioms in a system, but Wittgenstein explicitly resists calling them "knowledge" or "axioms" in the traditional logical sense. They are more like the "scaffolding" or the "riverbed."
      *   *Claim 2: They never need justification.*
          *   **Verdict:** Right. This is a core tenet. They are the unmoved movers of justification.
      *   *Claim 3: They are literally the same for every human being (universal).*
          *   **Verdict:** **Wrong.** This is a major misreading. Wittgenstein emphasizes context, culture, and historical situatedness. Hinges can vary between communities or even individuals over time. (e.g., "The earth has existed for 100 years" might have been a hinge for someone centuries ago, but not now).
      *   *Claim 4: Doubting one collapses the whole belief system.*
          *   **Verdict:** Mostly right, but nuanced. Global doubt is impossible ("A doubt without an end is not even a doubt"). Local doubt requires other certainties to remain fixed.
      *   *Claim 5: It's basically foundationalism with language games.*
          *   **Verdict:** **Highly Contested/Generally considered Wrong.** This is the crux of the philosophical debate. Most Wittgenstein scholars (e.g., Moyal-Sharrock, Stroll, Pritchard) argue he is *anti*-foundationalist. Foundationalism implies indubitable *propositions* that ground knowledge. Wittgenstein sees hinges as *non-propositional* (enacted, animal certainty) or grammatical rules, not empirical foundations.

  3.  **Drafting the Response - Section by Section:**

