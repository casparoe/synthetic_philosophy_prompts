      *   *Key Insight to hit hard:* You cannot have Common *Knowledge* of a falsehood. If the structure relies on false beliefs about depth, it is Common *Belief*, not Knowledge. If it's Common Belief, CKR (as standardly defined) is dead. If you redefine CKR to include false beliefs, you've emptied the term "Rationality" of content.

  9.  **Refining the "Staggered Ladder" Critique:**
      *   If $A$ knows cap is $n$, and $A$ believes $B$ thinks cap is $n+1$.
