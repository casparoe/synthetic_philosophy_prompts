      *   *Common Knowledge (CK)* definition: $E$ is CK if everyone knows $E$, everyone knows everyone knows $E$, ad infinitum.
      *   *Bounded Rationality (BR)* definition: Agents have limits on computation, memory, or reasoning depth (e.g., Level-$k$ thinking).
      *   *The Conflict:* Standard epistemic logic implies that if Rationality ($R$) is CK, then agents can simulate each other's reasoning indefinitely. If agents are bounded (depth $n$), they cannot simulate depth $n+1$. Thus, CKR seems to imply unbounded reasoning capacity.
      *   *The User's Fix:* Agents know the limit is $n$, but think *others* think the limit is $n+1$.
      *   *Immediate Red Flag:* If it is *Common Knowledge* that "Agent $i$ believes others think cap is $n+1$," then Agent $i$ knows that Agent $j$ knows that Agent $i$ thinks the cap is $n+1$. But Agent $i$ knows the cap is actually $n$. This creates a tension in the definition of CK.
      *   *Crucial Distinction:* The user says "that belief is itself common knowledge." If the *false belief structure* is CK, then everyone knows everyone holds the false belief. If everyone knows everyone holds the false belief, doesn't everyone know the belief is false (assuming they know their own cap)?
      *   *Logic Check:*
