          *   Does $B$ know their own cap? Yes (presumably, as a bounded reasoner aware of bounds). So $B$ knows Cap is $n$.
          *   So $B$ knows $A$ is wrong about $B$'s belief.
          *   This breaks the "Rationality" part of CKR. If $A$ is rational, $A$ shouldn't hold a false belief about $B$'s reasoning capacity if $A$ can deduce $B$'s capacity.

