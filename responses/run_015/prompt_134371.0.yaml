      *   *Fatal 1: The Definition of Common Knowledge.* CK requires infinite nesting. If the chain breaks at $n$ (due to boundedness), it's not CK. It's at best "Common Belief up to depth $n$." Calling it CKR is terminologically incorrect.
      *   *Fatal 2: Rationality implies Consistency.* If agents are rational (part of CKR), they shouldn't hold demonstrably false beliefs about other rational agents' constraints if those constraints are objective. If the cap is an objective feature of the architecture, a rational agent modeling another should deduce the cap, not assume a higher one.
