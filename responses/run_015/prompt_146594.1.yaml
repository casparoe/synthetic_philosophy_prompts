prompt: |-
  I am preparing a single ninety-minute philosophy-of-economics session for second-year philosophy students who have read Hume's Treatise but have no formal economics training. The aim is to teach his argument from the essays on money and trade: that money is not itself wealth, that an increase in specie eventually raises prices proportionally, and that anxiety about a favourable balance of trade is therefore groundless. Do not explain the doctrine to me; instead, plan the explanatory sequence. First, state the order in which these three claims must be introduced so that each logically supports the next, and identify what has to be in place before the students can even understand why the balance-of-trade point is not merely a separate opinion. Second, propose one carrying example — an isolated island economy with customary fixed prices that suddenly acquires a large influx of gold — and specify exactly what this scenario must include (for instance, nominal rigidity over one production cycle) and what it must deliberately exclude (for instance, international exchange or a banking system issuing credit) if it is to illuminate Hume's mechanism without smuggling in modern macroeconomic assumptions. Third, map the misconceptions they will predictably form: I anticipate they will interpret Hume's long-run price adjustment as a proto-monetarist neutrality claim, mistake his rejection of mercantilism for a contemporary free-trade ideology, and read his allowance for temporary real effects as an anticipation of Keynesian sticky-price theory; for each, indicate the precise point in the sequence where it should be headed off and how. Fourth, provide one diagnostic question for the end that tests whether they have grasped the dependency between the quantity of money and the price level rather than simply retained the slogans. Finally, say explicitly what should be left out at this level — any comparison with modern central-banking policy, for example — and suggest how to acknowledge the omission openly without sounding evasive.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Second-year philosophy students.
      *   **Background:** Read Hume's *Treatise* (so they understand Hume's empiricism, causation, skepticism), but *no formal economics training*.
      *   **Topic:** Hume's essays on money and trade (specifically *Of Money*, *Of the Balance of Trade*, *Of the Balance of Payment*).
      *   **Core Arguments to Teach:**
          1.  Money is not wealth.
          2.  Increase in specie raises prices proportionally (Quantity Theory of Money).
          3.  Anxiety about a favorable balance of trade is groundless (Specie-Flow Mechanism).
      *   **Constraints:**
          *   Do not explain the doctrine to *me* (the user knows it).
          *   Plan the *explanatory sequence*.
          *   State the logical order of the three claims.
          *   Identify prerequisites for understanding the balance-of-trade point.
          *   Propose *one* carrying example (Island economy) with specific inclusions/exclusions.
          *   Map three specific misconceptions (Monetarist neutrality, Free-trade ideology, Keynesian sticky prices) and where to head them off.
          *   Provide *one* diagnostic question.
          *   Specify what to leave out (e.g., modern central banking) and how to acknowledge it.
      *   **Duration:** 90 minutes.

  2.  **Deconstruct the Logical Order (Task 1):**
      *   Hume's argument flows from the nature of money to the mechanism of price adjustment, which then explains international flows.
      *   *Step 1: Money is not wealth.* (Definition/Ontology). If money *were* wealth, hoarding it makes sense. If it's just a tool for exchange, hoarding is useless.
      *   *Step 2: Quantity of Money determines Prices.* (Mechanism). If you have more money but the same goods, prices rise. This explains *why* hoarding doesn't create permanent wealth.
      *   *Step 3: Balance of Trade.* (Application/Consequence). If prices rise due to more money, exports become expensive, imports cheap. Money flows out. Equilibrium restores itself.
      *   *Prerequisite for Step 3:* Students must understand that money flows *because* of price differentials caused by money stock differentials. Without Step 2, Step 3 looks like magic or moralizing.

  3.  **Develop the Carrying Example (Task 2):**
      *   *Scenario:* Isolated island, fixed prices initially, sudden gold influx.
      *   *Inclusions:*
          *   Fixed nominal prices *initially* (to show the transition).
          *   One production cycle (to show the lag).
          *   Barter alternative (to show money is just a veil).
          *   No credit/banking (to keep it Humean/specie-based).
          *   No international trade *within* the example setup (to isolate the domestic price effect first), *but* wait... the prompt asks for an example to illuminate the mechanism *without* smuggling in modern assumptions. The prompt suggests an "isolated island economy... that suddenly acquires a large influx of gold." To explain the *Balance of Trade* later, I need to introduce the external sector *after* the internal price mechanism is clear. However, the prompt asks for *one* carrying example. Let's make it an island that *starts* isolated to establish the price effect, then opens up to explain the balance of trade. Or, better, keep it isolated to prove the "Money $\neq$ Wealth" and "Money $\rightarrow$ Prices" points, then use the *implication* of that for trade.
          *   *Correction:* The prompt asks for the example to illuminate "Hume's mechanism" (usually the Specie-Flow Mechanism). But an isolated island can't have a balance of trade.
          *   *Refinement:* The prompt says "isolated island economy... that suddenly acquires a large influx of gold." If it's isolated, where did the gold come from? Mining discovery. This works for "Money $\neq$ Wealth" and "Prices." To get to "Balance of Trade," I need to introduce a neighbor *after* the price rise is established.
          *   *Inclusions:* Customary fixed prices (nominal rigidity for one cycle), physical gold coins (specie), tangible goods (corn, tools).
          *   *Exclusions:* Fiat currency, credit/debt, central banks, expectations of inflation (adaptive/rational), velocity changes (assume constant for simplicity).

  4.  **Map Misconceptions (Task 3):**
      *   *Misconception 1: Monetarist Neutrality.* (Hume thinks money is neutral in the long run, like Friedman).
          *   *Correction:* Hume emphasizes the *transition* period where industry is stimulated. It's not just neutral; the shock matters.
          *   *Timing:* When discussing the price adjustment (Step 2).
      *   *Misconception 2: Free-Trade Ideology.* (Hume is a modern neoliberal).
          *   *Correction:* Hume is attacking Mercantilist *hoarding*, not necessarily arguing for laissez-faire in all things. It's about the futility of state accumulation of specie.
          *   *Timing:* When discussing the Balance of Trade (Step 3).
      *   *Misconception 3: Keynesian Sticky Prices.* (Hume anticipates Keynes).
          *   *Correction:* Hume's rigidity is customary/informational, not contractual/wage rigidity. He doesn't advocate management of demand.
          *   *Timing:* When discussing the "temporary real effects" during the transition.

  5.  **Draft the Diagnostic Question (Task 4):**
      *   Needs to test dependency between money quantity and price level, not slogans.
      *   *Idea:* Ask them to predict what happens if the gold is destroyed vs. hidden, or if the population doubles with the same gold.
      *   *Better:* A scenario where the money supply doubles but goods also double. Or, ask them to explain *why* the merchant stops exporting.
      *   *Selection:* Focus on the *mechanism* of the outflow. Why does the gold leave?

  6.  **Determine Omissions (Task 5):**
      *   *Leave out:* Modern monetary policy, fiat currency, exchange rates (floating), GDP, unemployment rates.
      *   *Acknowledgment:* Frame it as "Reconstructing Hume's Model," not "Evaluating Modern Policy."

  7.  **Structure the 90 Minutes:**
      *   0-15: Intro & Claim 1 (Money $\neq$ Wealth).
      *   15-45: Claim 2 (Quantity Theory) + The Island Example + Misconception 1 & 3.
      *   45-75: Claim 3 (Balance of Trade) + Misconception 2.
      *   75-90: Diagnostic & Omissions/Closing.

