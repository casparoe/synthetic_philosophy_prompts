      *(Final check on the "Isolated Island" constraint)*: The prompt says "isolated island economy... if it is to illuminate Hume's mechanism." Hume's mechanism *is* the specie-flow. An isolated island *cannot* show flow. I must address this tension. I will frame the example as establishing the *price pressure* that *would* cause flow if the isolation were lifted. This is the only way to satisfy the "isolated" constraint while teaching the "balance of trade" claim. I will explicitly state that the example isolates the *price variable* to prove the *trade variable* later.

      *Wait, one more check:* "identify what has to be in place before the students can even understand why the balance-of-trade point is not merely a separate opinion."
