      *   *Constraint Check:* "One diagnostic question." -> Just one.
      *   *Constraint Check:* "Say explicitly what should be left out... acknowledge omission." -> Specific script or strategy.

      *   *Critical thought on the Example:* The prompt asks for an "isolated island economy... that suddenly acquires a large influx of gold." If it is isolated, it cannot demonstrate the Balance of Trade (which requires trade). I must structure the example so that the *internal* price rise is demonstrated on the island, and then the *consequence* of that price rise is explained by introducing a trading partner conceptually, without changing the physical setup of the example mid-stream too confusingly.
      *   *Actually, looking closer:* The prompt asks for the example to "illuminate Hume's mechanism." The mechanism is the Specie-Flow. An isolated island *cannot* show specie flow out. It can only show price rise.
