answer: |-
  ### 1. Logical Sequence and Prerequisites

  **Order of Introduction:**
  1.  **Money is not Wealth:** Establish the ontological status of money as a representational tool (a "veil") rather than a consumable good or capital stock.
  2.  **Quantity of Money determines Prices:** Demonstrate the causal mechanism whereby an increase in the representational tool, absent an increase in goods, devalues the unit of account (the Quantity Theory).
  3.  **Balance of Trade is Self-Correcting:** Apply the price mechanism to international exchange to show that specie accumulation creates price disadvantages that automatically reverse the flow.

  **Prerequisites for the Balance-of-Trade Point:**
  Before students can understand why the balance-of-trade argument is a logical consequence rather than a separate opinion, they must accept two premises established in the first two claims:
  *   **International trade is driven by price competitiveness:** Merchants export where goods are cheap and import where goods are dear.
  *   **Domestic price levels are endogenous to the money supply:** A nation cannot arbitrarily set its price level independent of its stock of specie.
  *   *Without these:* The claim that "gold flows out" appears as a moral assertion or a separate empirical observation. *With these:* It becomes a hydraulic necessity. The balance-of-trade point is merely the Quantity Theory applied to an open system.

  ### 2. The Carrying Example: The Gold-Discovery Island

  **Scenario:** An isolated island community produces a fixed annual harvest of corn and tools. Prices are set by long-standing custom at the start of the planting season and do not change until the next harvest. A new gold vein is discovered, doubling the coin in circulation immediately.

  **Inclusions (to illuminate Hume's mechanism):**
  *   **Nominal Rigidity over One Production Cycle:** Prices must remain fixed *initially* despite the new gold. This allows students to see the "transition period" where holders of new gold feel richer and bid up goods, initiating the price rise.
  *   **Physical Specie:** Money must be gold coins, not ledger entries. This ensures students visualize money as a commodity that can physically move (flow), which is essential for the later balance-of-trade argument.
  *   **A Barter Counterfactual:** Explicitly mention that without the gold, the corn and tools remain identical. This reinforces Claim 1 (Money $\neq$ Wealth).

  **Exclusions (to avoid modern assumptions):**
  *   **Credit and Banking:** Do not introduce loans, interest rates, or fractional reserves. Hume's argument rests on specie, not credit velocity.
  *   **Expectations of Inflation:** Agents must not anticipate the price rise. They must act on the *current* increase in cash balances. This prevents students from importing Rational Expectations theory.
  *   **Exchange Rates:** Do not introduce currency conversion. Trade should be conceptualized as barter mediated by specie to keep the focus on relative price levels of goods, not forex markets.
  *   **Government Intervention:** No central bank to sterilize the inflow. The mechanism must be automatic.

  **Usage:** Use this example to prove Claims 1 and 2. To reach Claim 3, ask the students to imagine a second, identical island *without* the gold mine that trades with the first. The price disparity established in the first island logically forces the specie flow to the second.

  ### 3. Mapping Misconceptions

  **Misconception 1: Monetarist Neutrality**
  *   *The Error:* Students will assume Hume believes money is neutral (affects only prices, never output), akin to Friedman.
  *   *Where to Head It Off:* During **Claim 2 (Quantity Theory)**, specifically when discussing the transition from the gold discovery to the price rise.
  *   *How:* Emphasize Hume's insistence that the *interval* between the money increase and the price increase stimulates industry. The new gold wakes up "dormant labor." It is not neutral in the short run; the *process* of inflation matters more than the equilibrium.

  **Misconception 2: Keynesian Sticky-Price Theory**
  *   *The Error:* Students will interpret the fixed prices in your example as contractual wage rigidity or menu costs requiring state management.
  *   *Where to Head It Off:* During the **Example Setup**, when defining why prices are fixed.
  *   *How:* Specify that prices are fixed by *custom and habit*, not contracts. Hume views this as an informational lag, not a market failure. Do not allow the inference that government should stabilize prices; for Hume, the market corrects this lag automatically.

  **Misconception 3: Contemporary Free-Trade Ideology**
  *   *The Error:* Students will read Hume's rejection of the favorable balance of trade as a normative argument for globalization or laissez-faire capitalism.
  *   *Where to Head It Off:* During **Claim 3 (Balance of Trade)**.
  *   *How:* Frame the argument as *negative* and *diagnostic*, not *normative*. Hume is not arguing trade is "good"; he is arguing that hoarding specie is *futile*. He is attacking the Mercantilist goal (accumulation), not necessarily advocating for modern free-trade agreements. Keep the focus on the impossibility of permanent accumulation, not the virtues of openness.

  ### 4. Diagnostic Question

  **Question:**
  "Imagine the island government successfully hoards the new gold in a vault, preventing it from entering circulation. According to Hume's mechanism, does this increase the nation's wealth? Now, imagine they spend the gold but forbid merchants from trading with the neighboring island. What eventually happens to the domestic price level, and does the hoarding strategy succeed in the long run? Explain the causal link between the domestic price level and the impossibility of retaining the specie."

  **What this tests:**
  It forces students to connect the * Quantity of Money* (spending the gold) to the *Price Level* (domestic inflation) and finally to the *Balance of Trade* (the impossibility of retention). If they answer only that "prices rise," they have missed the dependency. They must explain that higher prices make exports impossible/imports attractive, which is *why* the specie cannot be retained.

  ### 5. Omissions and Acknowledgment

  **What to Leave Out:**
  *   **Modern Monetary Policy:** No discussion of interest rate targeting, quantitative easing, or fiat currency regimes.
  *   **Macroeconomic Aggregates:** No mention of GDP, unemployment rates, or balance-of-payments accounting identities.
  *   **Welfare Economics:** No discussion of whether inflation helps debtors or hurts creditors (distributional effects).

  **How to Acknowledge the Omission:**
  At the start of the session, state:
  *"We are reconstructing Hume's causal model as an 18th-century engineer might design a clock. We are isolating specific gears—specie, prices, and trade flows—to see how they mechanically interact. We are explicitly suspending modern questions about central banking or fiat currency. This is not because those questions are unimportant, but because introducing them now would obscure the specific logical dependency Hume was the first to articulate. We are studying the architecture of the argument, not evaluating its current policy application."*
