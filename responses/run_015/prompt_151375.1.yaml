      "You thought you could outrun a definition," Death said, sitting opposite her. The café noise faded into the call to prayer. "You treated it like a constant. It was always a variable."
      Aris looked at her coffee. It had turned into thick, sweet tea. "So inevitability isn't fate. It's grammar."
      "Language creates the world you live in," Death said. "You just read the fine print."
      Aris smiled sadly. She hadn't been hunted by destiny. She had been caught by a pronoun. The shard hadn't predicted her death; it had programmed it. By acknowledging the text, she had accepted the terms of service.
      "Well," she said, sipping the tea. "If I'm here, you're here."
      "We are all in Damascus now," Death agreed.
      The city outside settled. The illusion of choice vanished. There was no elsewhere left to go.

