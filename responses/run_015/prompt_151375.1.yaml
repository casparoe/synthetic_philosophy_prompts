      Aris stared at the cuneiform tablet. The translation was clear: *Death will find you in Damascus.* Everyone knew the story. The merchant flees to Samarra, Death waits there. But Aris wasn't a merchant; she was a semanticist. She noticed the glyph for "Damascus" wasn't a proper noun. It lacked the determinative for city. It looked more like a deictic marker. A pointer.

      She booked a flight to London. Heathrow felt safe. But as she stepped off the plane, a shadow fell over her. A figure in a cloak stood by arrivals. "You're early," it rasped. Aris frowned. "This is London."
      "This is Damascus," the figure corrected.
      She ran to Berlin. Same thing. The moment her feet touched the tegel ground, the air shimmered with the scent of jasmine and dust. The sign above the station flickered. *Bahnhof Damascus.*
      "It's not fate," she whispered to the empty hotel room in Prague. "It's syntax."
      She pulled out the tablet rubbings. The glyph shifted under her lamp. It wasn't naming a place; it was naming the *arrival*. The locus of the encounter. The word "Damascus" functioned like "here" but only for the subject of the prophecy. By attempting to flee, she was activating the indexical. To run was to define the destination as the place of death.

      She tried staying put in her study in Oxford. The clock ticked. The shadow grew in the corner. The air grew hot, dry. The stone walls seemed to soften into mudbrick.
      "If I don't move," she said, "does the word collapse?"
      The figure emerged from the bookshelf. "You moved the moment you read the text. You positioned yourself against it."
      "So Damascus is just... the coordinate of surrender?"
      "Damascus is the variable," Death said. "You solved the equation, but you still have to plug in the value."
      Aris laughed, a dry, brittle sound. "I spent my life studying how words shape reality. I never thought one would kill me."
      "Words don't kill," Death said, sitting in her armchair. "They define where the body stops."
      The room was definitely Damascus now. The call to prayer echoed from the Oxford spires. Aris closed her eyes. She hadn't been chased by destiny. She had been caught by grammar. The prophecy wasn't a prediction; it was a performative utterance. By reading it, she had instantiated the condition.
      "Okay," she said. "I'm here."
      "Yes," Death said. "We are all in Damascus now."

