      Aris realized the trap. In semantics, an indexical like "here" shifts depending on who speaks it. The prophecy wasn't naming a coordinate on a map; it was naming the locus of the encounter. By fleeing, she was constantly re-centering the coordinate system around herself. Every place she landed became "here," and therefore, "Damascus."

