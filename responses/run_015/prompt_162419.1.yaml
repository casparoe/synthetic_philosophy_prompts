answer: |-
  Yes, a usable procedure exists, and its spine is counterfactual dependence: a claim explains only if removing the cause changes the outcome, distinguishing causal mechanisms from narrative sequencing.

  ### The Procedure: The "Dependence Check"

  Run this on every causal claim (any sentence implying X made Y happen). Time cost: ~3 minutes per claim.

  **Step 1: Classify the Claim**
  Force the claim into one of your funder's three buckets.
  *   **Mechanism:** Describes the process connecting cause to effect (gears turning).
  *   **Counterfactual:** Describes what would *not* have happened if the cause were absent.
  *   **Legibility:** Describes the sequence to make it understandable (ordering, grouping).
  *   **Stop Condition:** If the script labels a claim "Legibility" but it implies causality (e.g., "This event paved the way"), reject it immediately. Legibility claims are structural glue, not causal engines. They cannot carry explanatory weight.

  **Step 2: The Removal Test (For Mechanism & Counterfactual)**
  Ask: "If this specific cause were removed or altered, does the effect still happen?"
  *   **Passing Answer:** No, the effect does not happen, or happens significantly differently.
  *   **Fail Condition:** Yes, the effect likely happens anyway due to other factors.
  *   **Stop Condition:** If the answer is "Yes," the claim is not an explanation; it is background context. Mark for revision.

  **Step 3: The Blind Future Test (For Retrospective Claims)**
  Ask: "If we did not know the ending (the riot, the war, the closure), would this event still look like a cause?"
  *   **Passing Answer:** Yes, contemporaries identified this as a risk or driver at the time.
  *   **Fail Condition:** No, this event only looks important because we know what happened later.
  *   **Stop Condition:** If it fails, the claim is retrospective determinism ("seeds of"). It must be rewritten to reflect uncertainty or removed.

  **Step 4: The Fork Test (For Inevitability Claims)**
  Ask: "Can you name one specific, plausible moment where the outcome could have been different?"
  *   **Passing Answer:** Yes, there was a contingency (a vote, a weather event, a decision).
  *   **Fail Condition:** No, the script asserts "it was only a matter of time" without identifying a specific constraint that made alternatives impossible.
  *   **Stop Condition:** If it fails, the claim is teleological myth. It must be softened to probability or removed.

  **Step 5: The Value Hand-Off**
  If a claim passes Steps 1–4 but removing the inevitability or retrospective link makes the story less dramatic or satisfying:
  *   **Action:** Hand to Director/Board.
  *   **Reasoning:** This is no longer a factual error; it is a curatorial choice between accuracy and narrative arc. Do not fight this in the review; flag it as a "Narrative Trade-off."

  ### Verdict on the Board Member's "Backwards Test"

  **Throw it out.** The Board Member is applying a logic-math heuristic to historical time.
  *   **Why it fails:** History is path-dependent and asymmetric. If a story holds up perfectly in reverse ("The city was built because the Mayor served; the Mayor served because the city was being built"), it indicates circular reasoning or teleology, not law-backed structure.
  *   **The Fix:** Tell the Board the **Removal Test (Step 2)** is the rigorous version of their intuition. Causality requires asymmetry: A causes B, but B does not cause A. If the chain holds backwards, it proves logical consistency, not historical causality. Use the Removal Test to satisfy their demand for rigor without accepting the backwards heuristic.

  ### Application to Your Three Claims

  **1. The Mill Closure (Mechanism)**
  *   *Claim:* "The mill closed because the embargo tripled its fuel costs and it ran on fuel oil."
  *   **Step 1 (Classify):** Mechanism.
  *   **Step 2 (Removal):** If the embargo hadn't tripled costs, would the mill have closed? Script implies no. (Pass).
  *   **Step 3 (Blind Future):** N/A (Not retrospective).
  *   **Step 4 (Fork):** N/A (Not inevitability).
  *   **Verdict:** **PASS.** This is a valid causal claim. It identifies a specific constraint (fuel type) and a specific shock (embargo) that alters the outcome.
  *   **Note:** Ensure the script acknowledges other factors didn't override this (e.g., "though demand was also falling, the fuel cost was the trigger").

  **2. The Streetcar/Seeds (Retrospective)**
  *   *Claim:* "The seeds of the '67 riot were sown when the streetcar tracks came up in '52."
  *   **Step 1 (Classify):** Mechanism (implied).
  *   **Step 2 (Removal):** If tracks stayed in '52, does the '67 riot not happen? Unlikely. Riots have multiple causes.
  *   **Step 3 (Blind Future):** In 1952, did anyone say "This will cause a riot in 15 years"? Probably not. It looks like a cause only because we know the riot happened.
  *   **Verdict:** **FAIL.** This is classic retrospective determinism. It selects a cause based on the effect.
  *   **Fix:** Rewrite to reflect contemporary perception: "The removal of the tracks in '52 heightened tensions in the neighborhood, contributing to the unrest that culminated in '67." This preserves the link without claiming the '52 event *was* the seeds of the specific '67 outcome.

  **3. The Mayor's Terms (Inevitability)**
  *   *Claim:* Chronology captioned "How the modern city got built" (1948–1956).
  *   **Step 1 (Classify):** Legibility/Inevitability hybrid.
  *   **Step 2 (Removal):** If this Mayor hadn't served, would the modern city still get built? Likely yes, by someone else.
  *   **Step 4 (Fork):** Could the city have been built differently? Yes. Was it "only a matter of time"? No.
  *   **Verdict:** **FAIL.** This is a teleological narrative masquerading as explanation. It implies the "modern city" was a destination waiting to be reached, rather than a contingent outcome.
  *   **Fix:** Change caption to "Building the Modern City: The [Mayor's Name] Administration." This shifts the claim from "This is how it happened (inevitably)" to "This is what happened during this time (contingently)."
  *   **Political Note:** This is the one that will hurt in the meeting. The donor wants a hero narrative. This fails the Dependence Check. Hand this off to the Director as a **Value Hand-Off (Step 5)**. Tell the Director: "Factually, the city wasn't built solely by him. Narratively, you want him to be the sole builder. That's your call, but we can't label it as exclusive causality."

  ### What This Procedure Cannot Do

  1.  **Verify Facts:** This procedure tests the *structure* of the argument, not the truth of the data. If the fuel cost didn't actually triple, the Mill Claim passes the procedure but is still false. Your fact-checkers must handle that.
  2.  **Resolve Value Disputes:** If the Director insists on the "Seeds" claim because it resonates with the community's lived experience of the riot, this procedure cannot stop them. It only arms you to say, "This is a value choice, not an explanatory one."
  3.  **Handle Complex Systems:** In highly complex systems (economics, ecology), single-cause removal tests often fail because of overdetermination (many causes suffice). In these cases, the procedure will flag the claim as "weak explanation," which is accurate, but may frustrate staff trying to simplify for visitors. You will need to allow "contributing factor" language as a middle ground.
