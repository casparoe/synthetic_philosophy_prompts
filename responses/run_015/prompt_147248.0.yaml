answer: |-
  Your friend is making a classic mistake: they are applying **Causal Decision Theory (CDT)** to a **Logical Decision Theory (LDT)** problem.

  In a standard one-shot Prisoner's Dilemma where you cannot see the opponent's source, your decision cannot causally influence theirs. Defecting strictly dominates. But in this tournament, your decision and their decision are **logically correlated** because both are outputs of deterministic algorithms that can inspect each other. If you and your opponent are running identical code, your choice *is* their choice. By choosing to Cooperate, you logically force the copy to Cooperate. You aren't "leaving points on the table"; you are unlocking the Reward (R) payoff that is otherwise inaccessible to a Defector (who gets Punishment (P) against another Defector).

  So, no, your friend is not right. The ability to read source code fundamentally changes the game from a PD to a coordination problem among logical agents.

  ### The Strategy: PrudentBot over FairBot

  You described **FairBot**: *Cooperate iff I can prove you cooperate against me.*
  FairBot cooperates with itself (via Löb's Theorem) and defects against Always-Defect (AllD). But FairBot also cooperates with Always-Cooperate (AllC). Since $T > R$ (Temptation > Reward), you *should* defect against AllC to maximize your score.

  The upgrade is **PrudentBot**:
  *Cooperate iff:*
  1.  *I can prove you cooperate against me.*
  2.  *I can prove you defect against AllD.*

  Condition 2 filters out AllC (because AllC cooperates with AllD). PrudentBot cooperates with FairBot (since FairBot defects against AllD), cooperates with itself, defects against AllD, and **defects against AllC**. This matches your requirement to not get "walked all over" by naive cooperators.

  ### The 50k Step Constraint (The Real Danger)

  This is your biggest risk. Löbian cooperation requires proving statements about the prover itself. In a standard formal system (like Peano Arithmetic), these proofs are non-trivial. 50,000 inference steps is **extremely tight**. If the proof search times out, your bot defaults to Defect.
  *   **Against a copy:** Mutual Defect (Payoff P). This is the disaster scenario. You want Mutual Cooperate (Payoff R).
  *   **Against AllD:** Mutual Defect (Payoff P). This is fine.

  **Optimization Strategy:**
  You cannot afford two full proof searches (one for `Opp(Me)==C`, one for `Opp(AllD)==D`). You should offload the AllD check to a **bounded simulation**, which is computationally cheaper than general theorem proving.

  **Proposed Logic:**
  1.  **Safety Check (Simulation):** Run `Opponent` against a hardcoded `AlwaysDefect` bot with a 5k step timeout.
      *   If `Opponent` Cooperates (or times out): **Defect**. (They are too soft/AllC-like).
      *   If `Opponent` Defects: Proceed to step 2.
  2.  **Handshake (Proof):** Search for a proof that `Opponent(Me) == Cooperate` with the remaining 45k steps.
      *   If Proven: **Cooperate**.
      *   If Timeout/Failed: **Defect**.

  This preserves the Löbian handshake with near-copies (who will pass the safety check and prove the handshake) but exploits AllC (who will fail the safety check) without burning proof budget on the second theorem.

  ### Round 2 Meta: The Clone Wave

  You are correct that Round 2 will fill with tweaked copies of the Round 1 winner.
  *   **If you win Round 1:** Round 2 fills with PrudentBot variants.
  *   **The Risk:** If a clone tweaks the formal system (e.g., changes axioms or step limits), your proof search might fail against them.
  *   **The Safety:** Your fallback is Defect. If the handshake breaks, you get P (Punishment) instead of S (Sucker). This is the "safe direction" you hoped for. You lose the R (Reward) points, but you don't get exploited.
  *   **The Advantage:** If they copy your logic exactly (lazy cloning), you get mutual Cooperation. If they try to optimize the prover to be faster, you might even cooperate *more* reliably.

  ### What To Submit

  Here is the pseudocode structure you should implement. Note that you need access to your own source code for the `Me` reference (usually via `inspect.getsource` or hardcoded hash).

  ```python
