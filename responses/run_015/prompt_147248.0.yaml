      # 1. Safety Check: Simulate against AlwaysDefect
      # This is cheaper than proof and catches AllC bots.
      result_sim = run_with_timeout(opponent_source, ALWAYS_DEFECT_BOT, steps=5000)
      
      if result_sim != DEFECT:
          # Opponent cooperates with AllD (like AllC) or timed out.
