          statement=f"{opponent_source}({MY_SOURCE}) == COOPERATE",
          steps=45000
      )
      
      if proof_found:
          return COOPERATE
      else:
          # Proof failed or timed out. 
          # Safe fallback: Defect.
          return DEFECT
  ```

  ### Crucial Implementation Details

  1.  **Keep Your Code Simple:** The easier your code is to analyze, the more likely *their* proof search (if they are also Fair/PrudentBots) will succeed within 50k steps. Obfuscation hurts you here. You want to be "readable" to theorem provers.
  2.  **Formal System:** If the harness provides a specific prover library, use it. If you have to bring your own, use the weakest logic possible that still supports Löb's Theorem (e.g., modal logic GL or a restricted PA). A full ZFC prover will timeout instantly.
  3.  **Quining:** Ensure you can reference your own source correctly. If you can't dynamically fetch your source, hardcode your own hash/string into the bot so the opponent can verify they are simulating *you*.
  4.  **The Friend Check:** If your friend submits AllD, your bot simulates them against AllD (they Defect), then tries to prove they Cooperate against you (Proof Fails), and Defects. You get P, they get P. You didn't leave points on the table; R was never on the table against AllD.

  ### Summary
  *   **Friend:** Wrong. Source access enables logical correlation (LDT).
  *   **Bot:** **Bounded PrudentBot**.
  *   **Trick:** Use simulation for the AllC check (saves budget), use proof for the Handshake (ensures robustness against tweaks).
  *   **Fallback:** Always Defect on timeout. This ensures you never get the Sucker's payoff.

  This strategy maximizes cooperation with the "smart" field in Round 2 while protecting you from exploitation by naive bots or broken proofs.
