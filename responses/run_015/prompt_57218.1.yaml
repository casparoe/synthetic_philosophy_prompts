      *   *Thesis 1 (Numerical):* Reporting decimals. Precision = significant digits. Evidence = measurement resolution/sample size. Platitude.
      *   *Thesis 2 (Sharpness):* Point vs Interval. Precision = sharpness of credence. Evidence = discriminatory power. Substantive.
      *   *Thesis 3 (Determinacy):* Single function vs Set. Precision = determinacy of representation. Evidence = completeness of model specification. Substantive/Radical.
