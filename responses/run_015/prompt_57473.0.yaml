answer: |-
  You have carved the phenomenon correctly. You are describing the structural engine of Radical Interpretation, but you are right to feel that the standard label ("Charity") is too soft. "Charity" sounds like a virtue you choose to exercise; what you are describing is a constraint on the very possibility of having beliefs.

  Here is the carving you are looking for.

  ### 1. The Established Name (and why it feels wrong)
  The standard label is **The Principle of Charity**. However, in the literature, there is a crucial distinction that matches your hesitation: **Methodological Charity** vs. **Constitutive Charity**.

  *   **Methodological Charity** is the "policy" you mentioned. It says: *To figure out what they mean, assume they are mostly right.* This treats charity as a heuristic tool we use to crack the code.
  *   **Constitutive Charity** is what you have actually found. It says: *Being mostly right is a condition for having beliefs at all.* It's not that we *choose* to interpret them charitably; it's that if we cannot interpret them charitably, they do not count as having beliefs.

  Your description ("the error ledger only ever goes down, never up") is the operational result of **Constitutive Charity**. The reason you can't reverse the trade (turning meaning differences into factual errors) is that factual error is only identifiable *against* a background of shared meaning. If you attribute too much error, the background dissolves, and with it, the error.

  ### 2. The Limit: The Impossibility of Massive Error
  The "ceiling" you identified has a name: **The Impossibility of Massive Error**.

  This is the core argument of Davidson's *On the Very Idea of a Conceptual Scheme*. He argues that the idea of a "different conceptual scheme" is just the idea of someone being systematically wrong about the world. But since we can only identify beliefs by maximizing agreement, the notion of "systematically wrong" is incoherent.

  So your verdict options are correct:
  1.  **Intelligible (Mostly Right):** We can maximize agreement by adjusting meanings.
  2.  **Unintelligible (No Scheme):** We cannot maximize agreement even by adjusting meanings.

  There is no middle option of "Coherent but Mostly Wrong." That space is structurally empty.

  ### 3. Coining the Mechanism: Semantic Deflection
  You asked for a name for the specific *move*—the one-way re-filing of factual disagreement into semantic difference. There isn't a single canonical noun for this, but the most precise coinage for the pattern you described is **Semantic Deflection**.

  *   **Definition:** The interpretive maneuver where apparent propositional conflict is resolved by shifting the variance from the *truth conditions* (the world) to the *semantic values* (the words/concepts), thereby preserving the rationality of the speaker.
  *   **Why it fits:** It captures the "deflecting" of error away from the subject's mind and onto the language. It acknowledges the directionality: error is deflected *into* meaning, never the reverse.

  ### 4. The Boundary Case: When Refile Fails
  You asked: *What would a case look like where the refile genuinely isn't available?*

  This is the critical test. Semantic Deflection works as long as the speaker's utterances can be made *internally coherent* under some assignment of meaning. The refile fails when the "errors" are not just inconsistent with *your* world, but inconsistent with *any* possible world, given their other commitments.

  **The Boundary Case: Internal Incoherence**
  Imagine a speaker who asserts $P$, asserts $\neg P$ in the same context, and also asserts "I never assert contradictions."
  *   **Attempted Deflection:** You try to adjust meanings. Maybe their "not" means "and"? But then their other logical connectives break. Maybe "assert" means "deny"? But then they can't report their own speech acts.
  *   **The Limit:** If you cannot assign *any* set of meanings that makes their web of beliefs consistent *by their own lights*, Semantic Deflection bottoms out.
  *   **The Verdict:** You don't conclude they are "wrong." You conclude they are **noise**. You stop treating them as an interpreter-able agent.

  This is the "not one of us" verdict you described. It's not that they are from a different culture; it's that they have failed to exhibit the minimal rational structure required to be a "speaker" at all.

  ### 5. Summary of the Carving
  *   **The Policy:** Principle of Charity (Methodological).
  *   **The Constraint:** Constitutive Charity (The structural necessity you found).
  *   **The Move:** Semantic Deflection (The one-way trade of error for meaning).
  *   **The Limit:** The Threshold of Intelligibility (Where deflection fails and interpretation stops).
  *   **The Excluded Middle:** Massive Localized Error (This is the "bug" you found—it's not a feature, it's an impossibility).

  You haven't invented a bug; you've identified the load-bearing wall of the Davidsonian framework. The reason it feels like a "squeeze" is because the framework is designed to eliminate the possibility of total alienation. We are either interpretable (and thus mostly like us) or we are nothing. There is no "radically other."
