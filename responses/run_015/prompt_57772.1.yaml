answer: |-
  Question Stem

  In the third chapter, Darwin considers whether a community raised with the instincts of social insects would view siblicide as a duty. He juxtaposes this hypothetical with his claim that conscience arises from reflecting on conflicting instincts and that sympathy naturally expands over generations. Assess whether this comparison undermines or supports the idea that human morality possesses a normative authority beyond mere tribal utility.

  Model Answer

  The insect thought experiment functions as a critical control case within Darwin's naturalistic ethics, designed to separate biological instinct from moral authority. By imagining a community where destructive acts are instinctual duties, Darwin demonstrates that instinct alone cannot ground normative claims for humans. If morality were merely the following of innate impulses, then siblicide would be virtuous for insects and vicious for humans solely due to biological difference. This relativism is unacceptable to Darwin, who seeks to explain the specific feeling of obligation that characterizes human conscience. The thought experiment thus clears the ground by showing that the content of instinct is arbitrary, while the structure of human psychology provides the necessary foundation for authority.

  Darwin locates this foundation in the cognitive capacity for reflection and memory. Unlike social insects, humans recall past impulses and compare them against current desires. Conscience arises when a transient impulse, such as selfishness, overrides a permanent social instinct. The pain of regret is not merely a punishment but a signal of violated structural integrity within the agent. The social instinct carries normative weight because it is enduring, whereas selfish impulses are fleeting. This distinction allows Darwin to explain why some instincts feel authoritative without invoking supernatural commands. The authority is internal to the architecture of the human mind, grounded in the permanence of social bonds rather than the intensity of momentary desire.

  However, the argument faces tension when addressing the widening circle of sympathy. Darwin suggests that tribes possessing broader sympathy outcompete narrower tribes, implying that moral progress is driven by tribal utility. If the justification for widening sympathy is solely survival advantage, then morality remains instrumental. A code is right because it helps the group persist, not because it aligns with an independent standard of truth. This risks collapsing normative authority into descriptive success. The insect analogy highlights this risk: insect duties are advantageous to the hive, yet we do not call them moral. For human morality to be distinct, it must claim a validity beyond mere utility.

  Darwin attempts to bridge this gap through the role of reason. He argues that once sympathy is activated, reason pushes humans to include all sentient beings within its scope. This suggests that the widening circle is not just a lucky accident of selection but a rational requirement. The capacity to reflect allows agents to recognize the arbitrariness of limiting sympathy to one's own tribe. Here, the insect comparison supports the claim for normative authority. Insects cannot critique their instincts; humans can. This critical capacity generates a standard of consistency that transcends immediate tribal advantage. The duty to widen sympathy arises from the demand to align actions with the permanent social instinct universally, rather than parochially.

  Nevertheless, Darwin remains ambivalent about whether this rational extension guarantees objective moral truth. He often reverts to evolutionary success as the ultimate validator. This leaves the status of the widening circle precarious. It is better because it is more widely shared and more advantageous, but Darwin struggles to articulate why it is inherently superior independent of these facts. The insect thought experiment successfully isolates the source of moral feeling in human psychology, distinguishing it from blind instinct. It establishes that conscience is a natural phenomenon rooted in reflection. Yet it does not fully resolve whether the objects of conscience are objectively good.

  Ultimately, the thought experiment supports the idea that human morality possesses a unique normative authority derived from cognitive structure, even if the justification for moral progress relies heavily on evolutionary utility. Darwin shows that duty is not just impulse, but evaluated impulse. This evaluation creates a space for authority that insects lack. The widening circle is the trajectory of this evaluation over time. While Darwin may not fully escape the shadow of tribal advantage, he provides a robust naturalistic account of why moral commands feel binding. The insect analogy is essential because it proves that without reflection, there is no morality, only biology. With reflection, biology becomes ethics. The authority lies in the transition from one to the other, secured by the permanence of social instincts and the power of reason to extend them.

  Marking Scheme

  1. Thesis Formulation (5 marks)
  Identifies the insect analogy as a control case separating instinct from authority and states a clear position on normative weight.

  2. Insect Analogy Interpretation (5 marks)
  Explains that the hypothetical shows instinctual content is arbitrary and cannot ground human duty without reflection.

  3. Conscience Mechanism Explanation (5 marks)
  Describes how memory and comparison of transient versus permanent instincts generate the feeling of obligation.

  4. Utility versus Authority Distinction (5 marks)
  Distinguishes between tribal survival advantage and the internal justification for moral codes, noting the tension in Darwin's text.

  5. Widening Circle Evaluation (5 marks)
  Assesses whether reason or utility drives the expansion of sympathy and evaluates the stability of this claim.

  A/B Boundary: The B answer describes the mechanism of sympathy and the insect analogy competently but collapses the difference between explaining why an impulse feels authoritative and justifying the code it generates. The A answer maintains this distinction, showing where Darwin explains the phenomenology of duty successfully but struggles to justify the objective truth of moral progress.

  Specific Mistakes and Deductions

  1. Anachronistic Debunking Reading (deduct 5 marks)
  Treating Darwin as arguing that morality is an illusion because it evolved, rather than explaining its natural basis.

  2. Consequentialist Conflation (deduct 5 marks)
  Assuming Darwin offers a consequentialist criterion of right action alongside a sentimentalist account of motivation without noting the explanatory conflict.

  3. Use of Quotations (deduct 5 marks)
  Including any direct quotes from the text or secondary literature in a closed-book examination context.

  4. Ignoring the Insect Analogy (deduct 5 marks)
  Failing to discuss the thought experiment regarding social insects and siblicide as required by the prompt.

  5. Overstatement of Resolution (deduct 3 marks)
  Claiming Darwin definitively solves the is-ought problem rather than noting the remaining tension between utility and authority.

  Concluding Paragraph

  The single sentence a summary-trained student would be most likely to write in the opening minutes is Darwin argues that moral codes change to ensure group survival. This should be penalised rather than rewarded because it reduces the normative question of authority to a descriptive claim about utility, failing to address the crux of whether the widening circle is better or merely later. It ignores the philosophical work the insect thought experiment is doing to distinguish human reflection from biological programming.
