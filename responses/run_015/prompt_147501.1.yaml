  5.  **Drafting the Repairs:**

      *   *Problem:* The original principle requires "all of us knew this about one another."
      *   *Fix:* Change to "all of us believed we were participating in a shared framework/plan."
      *   *Problem:* Case 7 (The Vote).
      *   *Fix:* Distinguish between *Joint Intention* (psychological) and *Group Agency* (procedural). The group decided (procedure), but the individuals lacked shared intent (psychology).
