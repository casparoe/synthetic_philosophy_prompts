answer: |-
  This is a high-stakes distinction. In an after-action report (AAR) involving insurance and liability, the difference between "a group of individuals" and "a collective agent" determines who bears the risk. Your tentative principle is a solid starting point—it closely mirrors the philosophical standard for *shared intention* (often associated with Michael Bratman). It requires a shared goal, meshing sub-plans, and mutual knowledge.

  However, for the purposes of your report, the principle is too narrow. It relies on interpersonal psychology, but search-and-rescue (SAR) often operates through *institutional protocols* where individuals act as cogs in a machine without direct psychological contact.

  Here is the stress test of your principle against your seven verdicts, the necessary repair, the cost you must pay, and the ruling on your overlapping searchers.

  ### 1. Stress Testing the Principle

  **The Principle:** *We $\phi$-ed together just in case each of us intended that we $\phi$, intended our own bit as a contribution to it, and all of us knew this about one another.*

  *   **Case 1 (Porch Lights):** **Principle Holds.** The neighbors did not intend "we form an arrow," nor did they know others were doing so for that purpose. They acted in parallel. Your verdict (not together) stands.
  *   **Case 2 (Bucket Brigade):** **Principle Holds.** They saw each other, intended the joint outcome, and adjusted their actions. Your verdict (together) stands.
  *   **Case 3 (Litter Relay):** **Principle Breaks.** This is your core conflict. Under your current principle, this looks like Case 1. The carriers never saw each other; they lacked direct mutual knowledge of *who* the others were. If strict interpersonal knowledge is required, they did not act "together." Yet, your gut (and operational reality) says they did.
  *   **Case 4 (Road Blockage):** **Principle Holds.** The drivers did not intend "we block the road." The *Team* (as a system) blocked it, but the *drivers* did not act together. Your verdict stands.
  *   **Case 5 (Coercion & Mistake):** **Principle Holds.** The generator heaver lacked the intention to "tamper with evidence." He intended to "load scrap." No shared intention for the crime. The landowner is borderline (coerced intention), but generally, reluctant compliance still counts as intending the action, if not the spirit. Your verdict stands.
  *   **Case 6 (One Person, Two Signs):** **Principle Holds.** "Five of us" implies five minds with shared intention. There were only four. "We covered the ridge" works because the *functional goal* was met, but the numerical claim is false. Your verdict stands.
  *   **Case 7 (The Vote):** **Principle Breaks.** The team voted one way, but the *mutual knowledge* condition was false (everyone assumed others had info they didn't). Technically, there was no valid shared intention because the common ground was an illusion. Yet, institutionally, "The team decided" is undeniably true. Your principle cannot validate both halves of your verdict simultaneously.

  ### 2. The Repair

  To save Case 3 (the relay) and clarify Case 7 (the vote), you must shift from a *psychological* definition of "together" to an *institutional* one. In SAR, protocols substitute for eye contact.

  **The Repaired Principle:**
  > We $\phi$-ed together just in case:
  > 1. Each of us intended to do our part in a plan we believed would achieve $\phi$;
  > 2. We did so under the belief that others were doing likewise **within a shared framework or protocol**;
  > 3. **It does not matter if we knew the specific identities of the others, provided we knew the roles existed.**

  This repair bridges the gap between Case 1 and Case 3. The neighbors (Case 1) had no shared framework; they just turned on lights. The litter carriers (Case 3) were operating under a known SAR relay protocol. They knew "a carrier" would relieve them, even if they didn't know "John" would relieve them. That structural knowledge is enough for collective action.

  ### 3. The Cost

  You asked which verdict this cannot save. The repaired principle forces you to clarify **Case 7**.

  You want to say: *"The team decided to call off the search" is true, AND "no one decided anything together" is true.*

  The repaired principle forces you to admit these are true in **different senses**, and for the insurance report, you cannot treat them as equivalent.
  *   **Sense A (Corporate):** The *Team* decided. The protocol was followed, the vote was counted, the authority was exercised. This is the legal truth.
  *   **Sense B (Psychological):** The *individuals* did not share a genuine intention. They acted on false premises about each other's knowledge.

  **The Cost:** You cannot claim "no one decided anything together" as a way to absolve the group of liability. If the *Team* decided (Sense A), the Team is responsible, regardless of the internal psychological confusion (Sense B). If you write "no one decided together" in the report, insurance may argue the action was unauthorized rogue behavior by individuals. If you write "the team decided," you accept collective liability.

  You must sacrifice the ambiguity. For the AAR, the **Corporate Truth** overrides the Psychological Truth. The team decided. The internal confusion is a training issue, not a liability shield.

  ### 4. The Overlap Case

  **The Scenario:** Two searchers, sectors overlapping by app assignment, adjusting quietly to each other's movements without knowing *why* the other is there (e.g., they think the other is avoiding terrain, not coordinating).

  **Application of Repaired Principle:**
  *   **Intention:** They intend to search.
  *   **Contribution:** They are contributing to the sweep.
  *   **Framework:** They are both in the app.
  *   **The Breaker:** Do they believe the other is acting *as part of the joint plan*?
      *   If Searcher A thinks Searcher B is just a civilian or a rogue volunteer, and adjusts merely to avoid collision, they are **not** coordinating. They are de-conflicting.
      *   If Searcher A assumes Searcher B is part of the *Team* (even if they don't know the specific assignment), they are operating under the "shared framework."

  **The Verdict:**
  Based on your description ("without knowing why"), this is **Being Coordinated**, not **Coordinating**.

  They are acting as instruments of the app, not as partners. The *System* coordinated them. They did not coordinate each other. In your report, you should classify this as **System-Directed Parallel Action**.

  **Why this matters for insurance:**
  *   If they were *Coordinating* (Joint Action), they share liability for errors in that overlap zone.
  *   If they were *Being Coordinated* (System Action), the liability for the overlap error shifts to Dispatch/Command who configured the app.

  ### Summary for Your Report

  1.  **Adopt the Repaired Principle:** Collective action in SAR includes adherence to protocol, not just interpersonal agreement.
  2.  **Case 3 is "Together":** The relay counts as joint action because the protocol substitutes for direct knowledge.
  3.  **Case 7 is "Team Decision":** For liability purposes, the institutional decision stands, regardless of internal psychological doubt. Do not use the psychological confusion to mitigate responsibility.
  4.  **Overlap Case:** Classify as **System-Directed**. The searchers were not coordinating; they were being managed. Liability for overlap gaps rests with Dispatch, not the field volunteers.

  This approach protects your volunteers from being blamed for "acting separately" when they were following protocol (Case 3), but it prevents the team from hiding behind "internal confusion" when an official decision was made (Case 7).
