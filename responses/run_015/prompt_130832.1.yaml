answer: |-
  Here is a principle designed to meet your four conditions, followed by its application and an honest assessment of its costs.

  ### The Principle of Complicit Expectation (PCE)

  **Statement:**
  An agent has a *pro tanto* moral reason against performing an act $A$ if and only if $A$ satisfies at least one of the following two conditions:

  1.  **The Expectational Clause:** $A$ has a non-zero expected negative value (i.e., there is some probability that $A$ causes or sustains harm, weighted by the magnitude of that harm).
  2.  **The Participation Clause:** $A$ constitutes voluntary participation in a practice or institution that is known to produce net harm, provided that such participation is not causally severed from the harm by a guarantee that the harm would occur *independently of the practice itself*.

  **The Asymmetry Proviso:**
  The Participation Clause applies only to acts contributing to **harm**. It does not apply to acts contributing to **benefit**. For beneficial acts, the Expectational Clause is the sole source of moral reason.

  **The Epistemic Rule:**
  Where the mechanism linking $A$ to harm is unknown or opaque, the agent must assign a non-zero probability to the mechanism being sensitive to their contribution (satisfying the Expectational Clause) and must treat their act as participation (satisfying the Participation Clause) unless there is positive evidence of causal severance.

  ---

  ### Motivation of Clauses by Your Cases

  **1. The Expectational Clause (Motivated by *The Continuous Case* & *The Threshold Case*)**
  *   **Why it is needed:** In the *Continuous Case* (driving), your individual emission is tiny but real. A principle based solely on "making a difference" (threshold views) would say you have no reason not to drive. You correctly intuit a weak reason. The Expectational Clause captures this: the reason is proportional to the expected harm (probability $\times$ magnitude).
  *   **Why it is needed (Threshold):** In the *Threshold I am Unlikely to Reach* case, the probability of being pivotal is low, but the harm is high. Pure "no-difference" views fail here. The Expectational Clause captures the risk: even a 1% chance of destroying a wetland generates a significant expected reason.

  **2. The Participation Clause (Motivated by *The Fixed-Contract Case* & *The Recorded/Unrecorded Case*)**
  *   **Why it is needed:** In the *Fixed-Contract Case*, expected difference is zero. Yet you feel a reason not to buy. This is because you are *joining* a harmful enterprise (industrial slaughter). The Participation Clause grounds the reason in **complicity** rather than **consequence**. It explains why you feel the same about the *Recorded and Unrecorded Purchase*: both are acts of purchasing from a harmful system, regardless of the data trail's downstream causal power.
  *   **What it loses if dropped:** If dropped, you must accept that buying the contract chicken is morally neutral. This contradicts your verdict and the intuition that we should not be "customers of cruelty" even if our custom doesn't change the headcount.

  **3. The Asymmetry Proviso (Motivated by *The Good That Will Happen Anyway*)**
  *   **Why it is needed:** This resolves your central asymmetry. In the *Surgery Case*, the good is guaranteed by the church. Your contribution has zero expected value (Expectational Clause fails). Because it is a *good* act, the Participation Clause does not apply (there is no duty to be a "participant in goodness" if the goodness is already secured). Thus, the reason dissolves.
  *   **Contrast with Harm:** In the *Fixed-Contract Case*, the harm is guaranteed by the contract. Expected value is zero. But because it is a *harmful* act, the Participation Clause *does* apply. You have a duty not to participate in harm, even if the harm is fixed.
  *   **What it loses if dropped:** Without this, the principle cannot explain why inertia cancels the reason to donate but not the reason to abstain from buying chicken. It would force you to treat moral duties as symmetrical, which your intuitions (and most deontological traditions) reject.

  **4. The Epistemic Rule (Motivated by *The Realistic Chicken Case*)**
  *   **Why it is needed:** You cannot know the supply chain mechanism in the aisle. If you assume "Fixed Contract" by default, you license harmful buying. The rule forces a precautionary stance: assume your purchase matters (Expectational) or counts as participation (Participation) unless you know otherwise.
  *   **What it loses if dropped:** It renders the principle unusable in real time. You would be forced to suspend judgment until you investigated the supplier, which is impractical.

  ---

  ### Application to New Cases

  **1. The Car Sale**
  *   **Case:** You sell your car to a buyer who will drive it exactly as much as you would have.
  *   **Analysis:**
      *   *Expectational Clause:* Zero expected difference in emissions.
      *   *Participation Clause:* You are exiting the practice of driving this car. The buyer is entering it. Are you participating in the harm? You are facilitating the buyer's participation, but you are ceasing your own.
      *   *Verdict:* **Permissible.** The Participation Clause binds you to *your* participation. Transferring the *capacity* for harm is not the same as sustaining the *demand* for harm (unlike the chicken case, where buying signals demand to the market). Since the total mileage is fixed, you are not increasing the harm.
      *   *Guidance:* You may sell the car.

  **2. The Co-operative Vote**
  *   **Case:** 200 members. 101 needed. 115 expected Yes. You vote Yes (harmful supplier, financial interest).
  *   **Analysis:**
      *   *Expectational Clause:* Low probability of being pivotal (approx. 0%).
      *   *Participation Clause:* High. Voting "Yes" is a formal, deliberate act of aligning yourself with the harmful policy. It is an explicit endorsement, distinct from a passive purchase.
      *   *Verdict:* **Wrong.** The Participation Clause carries significant weight here. Even if your vote doesn't change the outcome, you have made yourself a *member of the majority* that chose the harm. The financial interest does not override the complicity.
      *   *Guidance:* Vote No or Abstain.

  **3. The Realistic Chicken (Ignorance)**
  *   **Case:** You are in the aisle. You do not know if the supply chain is Fixed, Trigger, or Continuous.
  *   **Analysis:**
      *   *Epistemic Rule:* You must assume the mechanism is sensitive (Continuous/Trigger) or that your purchase constitutes Participation.
      *   *Verdict:* **Do Not Buy.** The risk of violating the Expectational Clause (it is continuous) combined with the certainty of the Participation Clause (you are buying factory meat) creates a strong reason against.
      *   *Guidance:* The principle gives the same guidance as if you knew it was Continuous. It *should*, because under moral uncertainty regarding harm, the precautionary principle applies.

  ---

  ### The Honest Sacrifice

  No principle accommodates every intuition without friction. To adopt the **Principle of Complicit Expectation**, you must abandon or revise one of your specific verdicts:

  **The Sacrifice: The "Recorded vs. Unrecorded" Equivalence.**
  You stated: *"I feel exactly the same about the two."* (Loyalty card vs. Cash).

  **Why you must abandon this:**
  The PCE validates your feeling that *both* are wrong (via the Participation Clause). However, if you accept the *Expectational Clause* (which you must, to account for the *Continuous Case*), you must acknowledge a **moral difference in degree** between the two.
  *   **Cash:** Only violates the Participation Clause.
  *   **Loyalty:** Violates the Participation Clause **PLUS** the Expectational Clause (because it feeds the forecasting model, raising the probability of future orders).

  **The Cost:**
  You must admit that while both acts are impermissible, the Loyalty purchase is *objectively worse* than the Cash purchase, even if the difference is too small to feel in the moment. If you insist they are *exactly* equivalent in moral weight, you are implicitly rejecting the Expectational Clause's claim that small probabilities of future harm matter. Given your verdict on the *Continuous Case*, you should accept that the data trail adds a (small) incremental reason against the act.

  **Secondary Tension: The Trigger with Override.**
  You feel the *Trigger with Override* is "more strongly" wrong than the *Fixed Contract*. The PCE explains why both are wrong (Participation), but it struggles to justify why the *Override* version is significantly worse, since in both cases the total bird deaths are identical and your agency is ultimately redundant.
  *   **Recommendation:** You should soften this intuition. The moral difference between "I pulled the trigger but someone else would have" and "The gun was already fired" is slim. The PCE asks you to view them as roughly equivalent instances of Complicity. If you cling to the idea that the *Override* case is much worse, you are likely overvaluing the *salience* of the mechanism over the *reality* of the outcome.

  ### Summary Advice for the Aisle

  When standing in the supermarket:
  1.  **Ignore the data trail.** (Don't worry about Loyalty vs. Cash; just don't buy the harmful product).
  2.  **Ignore the contract details.** (Assume your purchase counts as participation regardless of the supplier's inventory system).
  3.  **Remember the Asymmetry.** (Don't worry if your good deeds are redundant; do worry if your harmful deeds are).

  This principle allows you to act without investigating supply chains, respects your intuition that you are responsible for your own footprint (Attributed Share), and explains why you shouldn't buy the chicken even if it "makes no difference."
