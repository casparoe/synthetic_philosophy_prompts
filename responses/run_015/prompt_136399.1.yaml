answer: |-
  here's the conceptual spec for a theory of rational deference to objective chance. this isn't just about the Principal Principle (PP) equation; it's about the infrastructure needed to make that equation work without blowing up when reality gets messy.

  ### the core deliverables (desiderata)

  **1. basic alignment (the floor)**
  *   **the case:** you learn the physical chance of event $E$ is $x$.
  *   **the deliverable:** your credence in $E$ must become $x$, absent overriding information.
  *   **why:** if a theory of chance doesn't guide belief, it's metaphysical wallpaper. this is the non-negotiable core. if $Ch(E)=0.7$, $Cr(E)$ must be 0.7.
  *   **constraint:** must work even if $x$ is extreme (0 or 1), unless the theory allows for "almost certain" but not certain chances.

  **2. undermining resolution (the stability check)**
  *   **the case:** humphreys-style undermining. the chance law depends on the total history of outcomes (e.g., best system analysis). but the outcomes themselves are chancy. knowing the current chance might rule out future histories that would have changed the chance law.
  *   **the deliverable:** the theory must explain why learning the chance doesn't give you inadmissible information about the future that breaks the chance rule. it needs a fix for the feedback loop where $Ch(E)$ depends on $E$'s occurrence.
  *   **why:** without this, the definition of chance contradicts the rule for using chance.
  *   **tension flag:** this is where things break. you likely cannot have **strict humean supervenience** + **strict PP** + **no undermining futures**. one has to give. usually, PP gets modified to conditionalize on the whole chance function, not just the single value.

  **3. mediated expert deference (the reliability filter)**
  *   **the case:** a scientist reports $Ch(E)=0.7$, but you suspect their device was calibrated wrong.
  *   **the deliverable:** the theory must distinguish between deferring to the *number* and deferring to the *mechanism* that produced the number. it needs a rule for discounting chance claims when the generating process is compromised.
  *   **why:** blind deference is irrational. the theory needs an "admissibility" clause that isn't just about time (past vs future) but about causal isolation. if you know the mechanism is broken, the "objective chance" claim is void.
  *   **distinction to survive:** **deferring to a chance-value vs. deferring to a chance-generating mechanism.** you defer to the mechanism's output only if the mechanism is functioning.

  **4. the copy-room twist (the self-location test)**
  *   **the case:** coin flipped in Room A (chance 0.5). Result copied to Room B (deterministic copy). you are in A or B, don't know which.
  *   **the deliverable:** a principled rule for when PP applies to self-locating propositions ("my display shows heads").
      *   if the theory says $Ch(\text{my display}) = 0.5$, it risks conflating physical chance with indexical ignorance.
      *   if it says $Ch(\text{my display})$ is undefined or 1/0, PP doesn't guide your credence (which should still be 0.5).
  *   **why:** this tests whether the theory collapses **physical indeterminacy** into **indexical ignorance**. an adequate view must say: "PP applies to the coin flip proposition, not necessarily the self-locating display proposition, unless you indexicalize the chance function."
  *   **distinction to survive:** **physical indeterminancy vs. indexical ignorance about which branch you're in.** the theory must not treat not-knowing-which-room as a physical chance process.

  **5. normative force (the weight question)**
  *   **the case:** why does chance *command* credence?
  *   **the deliverable:** an explanation of why chance has specific quantitative weight rather than just moral or status weight.
  *   **why:** you can defer to a guru because of status. you defer to chance because of logic/metaphysics. the theory needs to explain why $Ch=0.7$ forces $Cr=0.7$ specifically, not just "high confidence."
  *   **distinction to survive:** **having moral/status weight vs. having a specific quantitative weight.**

  ---

  ### non-negotiables vs. camp-specific preferences

  **non-negotiables (must-haves for any working theory)**
  1.  **consistency:** cannot generate Dutch books in standard gambling scenarios based on chance.
  2.  **basic alignment:** must recover $Cr(E) \approx Ch(E)$ in standard cases (Case 1).
  3.  **undermining handling:** must have a stated solution for Case 2, even if it's "we reject humeanism."
  4.  **mechanism sensitivity:** must allow credence to diverge from reported chance if the mechanism is known to be faulty (Case 3).

  **camp-specific preferences (where views diverge)**
  1.  **determinism:** does the theory require indeterminism? (primitivists say yes, humeans say no).
  2.  **belief-dependent chances:** can your credence influence the chance? (standard view: no; revisionist/quantum views: maybe).
  3.  **empirical equivalence:** does the theory need to match textbook QM statistics exactly, or is it a metaphysical framework that QM fits into?
  4.  **admissibility criteria:** is inadmissible info only about the future, or does it include self-locating info (Case 4)?

  ---

  ### jointly unsatisfiable pairs (the trade-offs)

  *   **Pair A:** **Strict Humean Supervenience** + **Strict Principal Principle**.
      *   *why:* If chances supervene on total history, knowing the chance rules out histories that would change the chance. This violates the independence required for Strict PP.
      *   *fix:* Modify PP (Lewis's fix) or reject Humeanism.
  *   **Pair B:** **Objective Chance** + **Determinism**.
      *   *why:* If the world is deterministic, physical chance is either 0 or 1. If you want non-extreme chances, you need indeterminism.
      *   *fix:* Compatibilism (chance is epistemic relative to coarse-graining) or reject Objective Chance.
  *   **Pair C:** **PP applies to all propositions** + **Self-Location Ignorance is not Chance**.
      *   *why:* In the Copy-Room case, if PP applies to "my display is heads," you need a chance value. If you say the chance is 0.5, you treat indexical ignorance as physical chance. If you say chance is 1/0, PP fails to guide credence.
      *   *fix:* Restrict PP to non-indexical propositions.

  ---

  ### scorecard

  **1. orthodox PP (Lewis-style)**
  *   **basic alignment:** pass.
  *   **undermining:** fail (requires ad-hoc fix to the principle).
  *   **mediated expert:** pass (via admissibility clauses).
  *   **copy-room:** struggle (tends to collapse indexical uncertainty into chance unless strictly restricted).
  *   **verdict:** solid baseline, but leaks on metaphysical edges.

  **2. revisionist "halfway" view (credence influences chance)**
  *   **basic alignment:** pass (but circular).
  *   **undermining:** pass (dissolves the problem by allowing feedback).
  *   **mediated expert:** fail (hard to define mechanism reliability if belief alters mechanism).
  *   **copy-room:** pass (can treat self-location as part of the chance setup).
  *   **verdict:** solves metaphysical bugs by breaking causal directionality. risky.

  **3. flat rejection of objective chance (eliminativism)**
  *   **basic alignment:** fail (no chance to align to).
  *   **undermining:** pass (no chance, no undermining).
  *   **mediated expert:** pass (just standard testimony evaluation).
  *   **copy-room:** pass (all just epistemic probability).
  *   **verdict:** cleanest ontology, but loses the explanatory power of why nature looks chancy. fails the core deliverable.
