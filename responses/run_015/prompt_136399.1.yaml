  then, briefly, score how orthodox PP, a revisionist "halfway" view that lets credences influence which chance law applies, and a flat rejection of objective chance do against your list. keep teh scoring short — the list is the deliverable.

  no citations, no reading lists, just the conceptual spec. write casual, typo or two is fine.
