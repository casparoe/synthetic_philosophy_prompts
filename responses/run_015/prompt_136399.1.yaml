  hey, i'm trying to nail down what a theory of rational deference to objective chance actually has to deliever — not just the principal principle in isolation but the whole framework around it. i want the full desiderata specifcation: what any adequate view must be able to do, which cases it has to get right, which puzzles it must dissolve or at least explain, which distinctions it cant collapse, with the motivating case behind each one. flag any pair of desiderata you think are probably jointly unsatisfiable.

