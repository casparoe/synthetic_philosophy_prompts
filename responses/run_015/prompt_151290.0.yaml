      *   **Format:** Six-month independent research prospectus (dissertation-proposal style, no institutional backing).
      *   **Tone:** Formal, concise, rationalist-leaning, valuing tractability and explicit failure modes.
      *   **Constraints:** No bibliography/citations/reading lists.
      *   **Required Elements:**
          1.  Precise Research Question (determinate answer, not thematic).
          2.  Gap Analysis (why bioethics and metaphysics haven't solved this yet).
          3.  Methodology (conceptual analysis/semantic translation, not empirical/historical).
          4.  Deliverables & Failure Conditions (what success/failure looks like).
          5.  Tractability Assessment (6-month solo feasibility).

  2.  **Drafting - Section by Section:**

      *   **Title:** Needs to be descriptive and academic. *Four-Dimensional Death: A Temporal-Parts Analysis of Clinical Criteria for Human Cessation.*

      *   **1. Research Question:**
          *   *Goal:* Make it determinate. Not "How does 4D affect death?" but "Does 4D entail X or Y regarding the criteria?"
          *   *Drafting:* The core tension is between biological integration (circulatory) and mental capacity (brain). In 4D, a person is a worm of stages. Death is the end of the worm. Where does the cut happen?
          *   *Refinement:* "Does a four-dimensionalist ontology of personal identity entail that the criterion for human death is necessarily identical to the cessation of conscious temporal stages, thereby rendering circulatory criteria merely derivative, or does it require a distinct threshold of spatiotemporal discontinuity that preserves the conceptual independence of circulatory death?"
          *   *Check:* Is this answerable? Yes, via logical consistency checks.

      *   **2. Context & Gap Analysis:**
          *   *Bioethics:* Assumes 3D substance ontology (the patient *is* the body/organism that persists). Debates focus on *functions* (integration vs. consciousness).
          *   *Metaphysics:* Focuses on fission, teleportation, gradual replacement. Rarely touches clinical death criteria (brain stem vs. heart).
          *   *The Gap:* Bioethics ignores the metaphysical structure of the persisting entity. Metaphysics ignores the specific biological constraints of clinical death.
          *   *Key Point:* The "irreversibility" clause in death criteria relies on an assumption of *what* is persisting. If the person is a worm, "irreversible" means something different regarding stage-connections.

      *   **3. Methodology:**
          *   *Approach:* Conceptual analysis / Semantic translation.
          *   *Process:* Translate "biological integration" and "conscious capacity" into temporal-parts language (genetic relations between stages, psychological connectedness).
          *   *Application:* Apply these translations to the Uniform Determination of Death Act (UDDA) standards (Whole Brain vs. Circulatory).
          *   *Justification:* Empirical data doesn't solve ontological category errors. Historical survey doesn't solve logical consistency. We need to test the *coherence* of the criteria under the new ontology.

      *   **4. Deliverables & Failure Modes:**
          *   *Success:* A taxonomy mapping the criteria. A definitive statement on whether the distinction collapses (monism) or sharpens (dualism) under 4D.
          *   *Failure:* The ontology is "semantically inert" (changes nothing). Or the analysis leads to indeterminacy (no fact of the matter). Or the scope creeps into general metaphysics of time.
          *   *Specific Failure:* If the definition of "temporal stage" cannot be operationalized to match clinical markers.

      *   **5. Tractability Assessment (6 Months):**
          *   *Feasible:* Literature review (metaphysics + bioethics), logical modeling, drafting the argument.
          *   *Risk:* Getting bogged down in the metaphysics of time itself (A-theory vs. B-theory) rather than the application to death. Getting bogged down in clinical nuances (ICU protocols) which require empirical data.
          *   *Mitigation:* Stick to the *conceptual* definition of the criteria, not the *protocol* implementation. Assume standard medical definitions as premises.

  3.  **Review and Refine:**
      *   *Tone Check:* Is it formal? Yes. Is it concise? Need to trim wordiness.
