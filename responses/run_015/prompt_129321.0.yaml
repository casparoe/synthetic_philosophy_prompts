answer: |-
  Subject: Re: Identity of Indiscernibles and Black's Spheres

  Hi there,

  It sounds like you have a really fertile setup for next week, and that student's pushback is actually a classic move that deserves careful dissection before you counter it. When your student says that if there is no observation that could ever distinguish the spheres then they are just one sphere described twice, they are compressing at least three distinct philosophical theses into a single sentence, and unpacking them is the key to knowing how to respond. The first reading is epistemic verificationism, which holds that numerical diversity is meaningless unless it is verifiable by some possible observation. On this view, metaphysics is constrained by epistemology, so if we cannot know there are two, there are not two. This does not solve Black's original worry so much as change the subject, because Black was asking whether two things could be numerically distinct even if we could not tell them apart, not whether we could know they were distinct. The second reading is a strong metaphysical version of the Principle of Identity of Indiscernibles itself, asserting that numerical diversity strictly supervenes on qualitative difference. This is the direct contrary of Black's conclusion, so accepting it solves the worry by denying the possibility of the scenario, but it begs the question against Black who intended the spheres to be a counterexample to this very principle. The third reading is semantic, suggesting that names like sphere A and sphere B fail to refer if no description uniquely picks one out, meaning the sentence there are two spheres is linguistically defective rather than metaphysically false. This also changes the subject from ontology to philosophy of language. There is a fourth possible reading lurking here regarding relational properties, specifically the idea that spatial separation only counts as a distinguishing relation if there is a causal pathway connecting the relata, implying that without a causal link, the distance between them is not a real property that can ground numerical distinctness.

  If I had to bet on which version your student was using, I would say they are operating with a blend of the epistemic and the strong metaphysical readings, likely driven by an intuition that existence implies detectability. They seem to think that if the universe prevents any possible comparison, the distinction collapses ontologically, not just empirically. This is why they conclude it is one sphere described twice rather than just saying we cannot know there are two. Now, regarding your tweaked setup with the cosmological horizon and the antiphase oscillators, this modification actually puts significant pressure on all four readings but in different ways. The cosmological horizon strengthens the epistemic reading because it makes the impossibility of joint observation a law of physics rather than a practical limitation, making the verificationist claim harder to dismiss as merely about human ignorance. However, the antiphase clocks introduce a qualitative difference that potentially undermines the student's premise entirely. If the spheres are oscillating in opposite phases, then at any given moment one is expanding while the other is contracting, which means they possess different intrinsic properties at that time. If phase counts as an intrinsic qualitative property, then the Principle of Identity of Indiscernibles is satisfied trivially and they are discernible in principle, even if no observer can verify it. This leaves the epistemic reading intact only if the student insists that unobservable properties do not count toward individuation, which pushes them further into verificationism. The relational reading is the most interestingly affected because the horizon suggests the spheres are causally disconnected, so if relations require causal mediation, the spatial distance might not count as a distinguishing relation. However, the phase difference is intrinsic, so they do not need the spatial relation to be distinct. Consequently, your modification leaves the metaphysical and semantic readings largely intact but forces the epistemic reader to defend why unobservable qualitative differences do not ground identity. It also exposes the student's conflation of observational distinguishability with qualitative discernibility, which is probably the best place for you to push back in the session. You can grant that no observer can see them together but insist that the universe can still contain two things with different temporal profiles, showing that identity is not exhausted by observation. I hope this helps you structure the discussion, and do not worry about the typos in your note, I understood everything perfectly.

  Best wishes
