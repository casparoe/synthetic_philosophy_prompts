          *   *Commitment:* Pre-commitment strategy. "We will die" deters future oppression (theoretically) or inspires future revolts.
          *   *Distortion:* Biologically, suicide is fitness zero. It only makes sense if it boosts *inclusive fitness* of the broader group (Jewish people) via reputation.
          *   *Leftover:* The theological/messianic element. Dying for God isn't just group coordination; it's transcendent.

      *   *Dunkirk:*
          *   *Signal:* Civilian boats = costly signal of national unity. Elite and commoner mixing.
          *   *Commitment:* "We will never surrender." Signals to allies (US) and enemies (Germany).
          *   *Distortion:* It was a rout. The myth turns a retreat into a victory.
          *   *Leftover:* The sense of "providential" deliverance. Luck framed as destiny.

  5.  **Addressing the "Leftover" Question:**
      *   Is theory missing something? Or is it just strategy?
      *   *Argument:* Evolutionary theory explains the *mechanism* of transmission and cohesion, but not the *qualia* of meaning. The "moral dignity" is the user interface. The code is game theory. But if the user interface drives behavior that contradicts immediate fitness (like Masada), does the theory need to expand to include "meaning" as a fitness variable itself?
      *   *Decision:* Lean towards "strategic logic wearing fancy clothes," but acknowledge that the "clothes" (meaning) are the actual mechanism of the signal. You can't separate them. However, strictly speaking, the *feeling* of dignity isn't a biological category, it's a psychological proximate mechanism serving an ultimate function.

  6.  **Refining the Tone:**
