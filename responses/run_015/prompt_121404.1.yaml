answer: |-
  There is no single, canonical Latin phrase for this specific move (like *ad hominem* or *post hoc*), but in critical disaster studies and political economy, the precise carve you are looking for is **Causal Naturalization** (sometimes **Explanatory Naturalization**).

  In technical economic history, this is the **FAD Fallacy** (Food Availability Decline), but that refers to the *empirical error*. **Causal Naturalization** refers to the *rhetorical and conceptual slide* you described: allowing a natural input to absorb the explanatory weight of a political output, thereby achieving **Explanatory Closure** on the natural side of the ledger.

  Here is the mapping of the concept and its boundaries against the three counter-cases you specified.

  ### The Core Concept: Causal Naturalization

  **Definition:** The rhetorical and conceptual process by which a contingent natural trigger (drought, blight) is elevated from a *necessary condition* to a *sufficient explanation*, effectively erasing the mediating political structures (distribution, entitlement, policy) from the causal chain.

  **Why this term?**
  *   **Causal:** It targets the logic of explanation, not just the outcome.
  *   **Naturalization:** It borrows from the sociological concept of "naturalization" (making the social/constructed appear inevitable/biological). Here, the *causality itself* is naturalized. The famine becomes a weather event rather than a governance event.
  *   **The Slide:** It captures the movement from "X contributed" to "X explains."

  ---

  ### Boundary 1: vs. Legitimate Partial Cause
  **The Distinction:** *Necessity vs. Sufficiency.*

  *   **Legitimate Partial Cause:** Acknowledges the trigger as a stressor within a system. The explanation remains open-ended.
      *   *Claim:* "The monsoon failure reduced the harvest, which stressed the distribution network."
      *   *Logic:* $A (Nature) + B (Politics) \rightarrow C (Famine)$. Both variables are visible.
  *   **Causal Naturalization:** Treats the trigger as the bottleneck that determines the outcome regardless of the system.
      *   *Claim:* "The monsoon failure caused the famine."
      *   *Logic:* $A (Nature) \rightarrow C (Famine)$. Variable B is structurally invisible.
  *   **The Carve:** The error isn't citing the weather; it's treating the weather as **explanatorily sufficient**. If you remove the political variable from the equation and the prediction still holds, you have naturalized the cause.

  ### Boundary 2: vs. Motte-and-Bailey
  **The Distinction:** *Strategic Ambiguity vs. Conceptual Collapse.*

  *   **Motte-and-Bailey:** The speaker *knows* the distinction between the trigger and the political failure but hides the controversial claim (Bailey: "The government murdered them") behind the defensible one (Motte: "There was a drought"). When challenged, they retreat to the Motte.
      *   *Mechanism:* Tactical retreat. The speaker maintains two distinct concepts but blurs them for defense.
  *   **Causal Naturalization:** The speaker often does *not* maintain two concepts. The political mechanism is not a hidden position to retreat to; it is erased from the ontology.
      *   *Mechanism:* Conceptual collapse. The "drought" and the "famine" are treated as the same event type.
  *   **The Carve:** In a Motte-and-Bailey, the ambiguity is **conscious and defensive**. In Causal Naturalization, the ambiguity is **structural and constitutive**. The speaker isn't hiding the politics; they have literally ceased to see the category "politics" as relevant to the category "famine."

  ### Boundary 3: vs. Ignorance of Sen (Epistemic Gap)
  **The Distinction:** *Informational Deficit vs. Ideological Closure.*

  *   **Ignorance:** The agent lacks the data or framework to see the entitlement collapse. If shown Sen's data (food availability vs. price/wage), they update their model.
      *   *Test:* Show them the grain export numbers. If they say, "Oh, I didn't know food was being exported," the error was ignorance.
  *   **Causal Naturalization:** The agent acknowledges the data but treats it as secondary to the "real" cause (nature). The natural trigger acts as a **conversation stopper**.
      *   *Test:* Show them the grain export numbers. If they say, "Yes, but without the drought, the exports wouldn't have mattered," they are engaging in Causal Naturalization. They are using the natural trigger to inoculate the political choice from scrutiny.
  *   **The Carve:** Ignorance is **correctable by evidence**. Causal Naturalization is **resilient to evidence** because it functions as a boundary marker for what counts as a relevant explanation. It defines the "disaster" as a meteorological category, not a sociological one.

  ### Historical Lineage of the Term
  While "Causal Naturalization" is the precise philosophical carve, you should know the adjacent terms to navigate the literature:

  1.  **The FAD Approach (Sen):** The economic version. Sen critiques the "Food Availability Decline" theory. However, critics often accept Sen's math but revert to Causal Naturalization rhetorically ("Yes, entitlements failed, *because* the drought broke the system").
  2.  **The Hazard Paradigm (Wisner/Hewitt):** In disaster sociology, this is the "Dominant Paradigm" which views disasters as extreme *events* rather than extreme *processes*. O'Keefe, Westgate, and Wisner's 1976 paper "Taking the Naturalness out of Natural Disasters" is the foundational text attacking this slide.
  3.  **Ecological Determinism (Mike Davis):** In *Late Victorian Holocausts*, Davis describes this as using "ecological arithmetic" to mask colonial political economy.

  ### Summary Recommendation
  If you are writing or arguing this, use **Causal Naturalization**.

  It signals that you are not merely disputing the data (Sen's point), nor accusing the opponent of lying (Motte-and-Bailey), but identifying a **category error in their causal architecture**. It marks the specific point where a *trigger* is illicitly promoted to an *origin*.

  **Usage Example:**
  > "Attributing the Bengal famine solely to the cyclone is not just an empirical error; it is an act of **causal naturalization**. It treats a meteorological trigger as an explanatory endpoint, granting the weather agency it does not possess while absolving the distribution system of responsibility."
