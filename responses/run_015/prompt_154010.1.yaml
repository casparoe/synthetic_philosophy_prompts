answer: |-
  The smog over the Thames was thick enough to chew, a yellow soup that swallowed the light from the *Atlas*'s Aldis lamp after thirty yards. Captain Vance stood on the bridge of the *Atlas*, watching the shadowed bulk of the *Hercules* drift alongside. They were lashed to the *SS Meridian*, a heavy lift stuck on the mud bar. The tide was turning. If both winches hauled at once, the *Meridian* floated. If one hauled alone, the cable snapped, the ship grounded hard, and careers ended.

  Vance checked his watch. 02:58. High water at 03:00.

  He keyed the lamp. One flash. *I am ready.*
  On the *Hercules*, Captain Reed saw the glimmer. He knew Vance was ready. (Level 1: Reed knows Vance is ready).
  Reed keyed his lamp. One flash back. *Acknowledged.*
  Vance saw the return. He knew Reed knew he was ready. (Level 2: Vance knows Reed knows Vance is ready).

  Vance keyed again. Two flashes. *Confirm receipt.*
  Reed saw the double burst. He knew Vance knew Reed knew. (Level 3: Reed knows Vance knows Reed knows Vance is ready).
  Reed replied. Two flashes. *Confirmed.*
  Vance saw it. (Level 4: Vance knows Reed knows Vance knows Reed knows Vance is ready).

  Vance hesitated. To pull the lever, he needed to know Reed was certain Vance wouldn't bail. That required Level 5: Vance needs to know Reed knows Vance is committed. He needed to send a third signal (*Go*) and see Reed acknowledge it. But the smog was swallowing the light. If he sent the *Go*, Reed might not see it. If Reed didn't see it, Reed wouldn't pull. If Vance pulled alone, disaster.

  At 02:59, the Clock Tower at the docks began to chime. They had discussed this over the radio earlier, before the static took hold. *If the lamps fail, the钟声 (chimes) are the signal.* Midnight protocol, adapted for the tide.

  The bells boomed through the fog. Vance heard them clearly. He assumed Reed heard them. But did Reed know Vance heard them? Sound carried oddly in the inversion layer. Vance couldn't see the *Hercules* bridge. He didn't know if the bells were muffled there. Even if Reed heard them, Reed didn't know if Vance heard them. The chimes were public, but their reception was private. The chain broke at Level 1. No one knew that everyone knew.

  Vance's hand hovered over the winch lever. He thought about the rumor circulating the docks: Vance was owing heavy markers to the syndicate. Desperate men take risks. Reed would have heard it. If Reed believed Vance was reckless, Reed might think Vance would pull on Level 4, ignoring the missing confirmation.

  If Reed thought Vance was irrational, Reed's best move was to pull alongside him to prevent the snap. But Reed also knew Vance was rational. Did Reed know that Vance knew Reed heard the rumor? If Vance knew Reed heard the rumor, Vance would know Reed expected a risky move. Vance, being rational, would wait to avoid the trap.

  Vance waited for the third flash from Reed. It never came. The smog took the light.
  Reed waited for the third flash from Vance. The smog took the light.

  The clock finished chiming. The tide peaked. The water stopped rising. The *Meridian* settled back into the mud with a groan of timber. Vance lowered his hand from the lever. On the *Hercules*, Reed did the same. The silence between the ships was heavier than the fog. They were both rational, both ready, and both paralyzed by the missing fifth link.

  ***

  **Analysis of Epistemic Levels**

  *   **Level 1:** Reed sees Vance's first flash (Reed knows Vance is ready).
  *   **Level 2:** Vance sees Reed's ack (Vance knows Reed knows).
  *   **Level 3:** Reed sees Vance's confirm (Reed knows Vance knows Reed knows).
  *   **Level 4:** Vance sees Reed's confirm (Vance knows Reed knows Vance knows Reed knows).
  *   **The Gap:** Action requires Level 5 (Vance knows Reed is certain of Vance's commitment). The noisy channel prevents the 5th signal from being confirmed.
  *   **Public Signal Failure:** The clock chimes were audible, but audibility wasn't common knowledge. Vance didn't know Reed heard them; Reed didn't know Vance knew he heard them. Thus, chimes established Level 1 at best, not Common Knowledge.
  *   **The Rumor:** The rumor of Vance's irrationality (desperation) complicated Reed's calculation. If Reed believed Vance was reckless, Reed might act on Level 4 to "save" Vance. But because Reed wasn't sure *what Vance thought Reed believed*, the rumor added noise to the hierarchy rather than clarity. It prevented Reed from bridging the gap with a guess, ensuring inaction. Finite knowledge proved insufficient; without Common Knowledge, the coordination cost was total failure.
