      *   *Claim 3: "Utility just means money corrected for risk... take whatever option has the higher expected dollar payoff."*
          *   **Status:** **Major Error.** This is the biggest "slide." EU theory *allows* for risk aversion via a concave utility function over money. Preferring \$100 sure to a 50/50 of \$90/\$110 is *perfectly consistent* with EU maximization if $U(100) > 0.5 U(90) + 0.5 U(110)$. The colleague is conflating EU with *Expected Value* (EV) maximization (risk neutrality).
