      *   *The Tension:* If the user defines pleasure entirely by its functional role (PE + suppression), have they abandoned the *phenomenal* core of hedonism?
      *   *Verdict:* They are arguably proposing a *naturalistic* or *psycho-functional* hedonism. It saves the *label* "hedonism" but changes the *ontology* of pleasure from a "qualia" to a "process." This is a valid move (similar to representationalism about pain/pleasure), but they need to own that they are redefining "pleasure" away from raw feel toward functional signature.
