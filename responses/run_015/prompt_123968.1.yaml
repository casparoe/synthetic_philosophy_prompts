      *   *Claim:* If both parties regard a bet as favorable, no common prior exists.
      *   *Theory:* This refers to the "No Betting Theorem" (Milgrom & Stokey, or related to Aumann). If agents have a common prior, they cannot agree to bet (zero-sum). If they agree to bet, they must have different priors (or asymmetric info processed differently).
      *   *Validity:* Yes, this is a real result. "Speculative trade is impossible with common priors."
      *   *Who does it help?* It helps Yusuf. It gives an observational test for the CPA. If we see betting, CPA fails. Since we see betting, CPA fails. This undermines Marta's Move 3 (that CPA is just a modeling choice). It supports Yusuf's Move 2/4 (CPA is empirically false/trivial if forced).

