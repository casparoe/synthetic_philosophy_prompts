      On Move 7: This is the "Kuhnian" turn. It's very strong.

      *Third Person Check:* The result is often associated with Milgrom and Stokey (1982) "Information, Trade and Common Knowledge". It shows that with common priors, no trade occurs. If trade occurs, priors aren't common. This makes CPA testable. This hurts Marta's defense that CPA is just a modeling choice (Move 3). It supports Yusuf's claim that CPA is empirically false (Move 2).

