  ### The Chaos Predictability Decision Tree

  **Root Commitment:** The system is deterministic (state at $t_0$ fixes state at $t_1$) and chaotic (positive Lyapunov exponent).

  **Q1. The Prediction Target**
  *Case:* You are designing a control system for a satellite in a three-body orbit.
  *Question:* Does mission success require you to know the satellite's exact phase-space coordinate at time $t$ (station-keeping), or merely to ensure it remains within a safe basin of attraction (risk management)?
  *   **Exact Coordinate:** Go to **Q2**.
  *   **Safe Basin/Statistics:** Go to **Q7**.

  ---

  #### **Left Branch (Exact Coordinate Focus)**

  **Q2. The Source of Failure**
  *Case:* You cannot predict the exact coordinate at time $t$.
  *Question:* Is this failure because your measurement of the initial state has finite precision (SIC), or because no algorithm exists to compute the trajectory from the initial data even with infinite precision (Uncomputability)?
  *   **No Algorithm (Uncomputability):** → **Leaf 1: The Uncomputability View**
  *   **Finite Precision (SIC):** Go to **Q3**.

  **Q3. The Continuum Assumption**
  *Case:* Consider a turbulent fluid flow modeled by Navier-Stokes equations.
  *Question:* If you could specify the initial velocity field with infinite real-number precision, would the physical fluid shadow the model's trajectory, or does the physical medium lack the resolution to support the continuum model?
  *   **Lacks Resolution (No Shadowing):** → **Leaf 2: The Continuum Idealization View**
  *   **Shadows Trajectory:** Go to **Q4**.

  **Q4. The Locus of Determinism**
  *Case:* Consider a double pendulum described by a Lagrangian.
  *Question:* If we replace the differential equations with a discrete cellular automaton that mimics the motion, is the determinism lost, or was the determinism only ever a property of the mathematical representation?
  *   **Property of Representation:** → **Leaf 3: Model-Relative Determinism**
  *   **Property of the Pendulum:** Go to **Q5**.

  **Q5. The Barrier Status**
  *Case:* You are building a chaotic circuit for secure communications.
  *Question:* If you build a better amplifier with lower noise, does the prediction horizon extend indefinitely, or does it hit a fundamental wall regardless of engineering quality?
  *   **Extends Indefinitely:** → **Leaf 4: Laplacian Determinism**
  *   **Hits a Wall:** Go to **Q6**.

  **Q6. The Meaning of Determinism**
  *Case:* Compare the chaotic circuit to a genuinely indeterministic quantum source.
  *Question:* If no measurement can distinguish the deterministic signal from noise, does the signal still count as "determined" in a physically meaningful sense?
  *   **Yes (Metaphysical Fixity):** → **Leaf 5: The Standard Textbook View**
  *   **No (Predictive Equivalence):** → **Leaf 6: The Instrumentalist View**

  ---

  #### **Right Branch (Statistical/Action Focus)**

  **Q7. The Statistical Structure**
  *Case:* You are pricing insurance for weather-related crop failure using a chaotic climate model.
  *Question:* Is the system ergodic with a computable invariant measure, allowing you to calculate robust long-term probabilities, or is the measure non-computable/non-ergodic?
  *   **Robust/Computable Measure:** → **Leaf 7: The Statistical/Mixing View**
  *   **Non-Computable/Non-Ergodic:** → **Leaf 8: The "Empty Cell" View**

  ---

  ### The Leaves: Positions and Awkward Commitments

  1.  **The Uncomputability View:** You must claim a Laplacian Demon with exact data would still fail because the universe cannot calculate its own next step.
  2.  **The Continuum Idealization View:** You must claim the differential equations we use to design bridges are literally false descriptions of the steel.
  3.  **Model-Relative Determinism:** You must claim the universe is deterministic only relative to a choice of coordinates that may not map to anything measurable.
  4.  **Laplacian Determinism:** You must claim a demon with infinite precision could predict the weather, even if physics forbids infinite precision.
  5.  **The Standard Textbook View:** You must claim the future is fixed even though no possible evidence could ever confirm which fixed future it is.
  6.  **The Instrumentalist View:** You must claim that if we can't tell the difference, there is no difference, making determinism a synonym for compressibility.
  7.  **The Statistical/Mixing View:** You must claim we understand the system better *because* it destroys information about its specific state.
  8.  **The "Empty Cell" View:** You must claim determinism matters even though it constrains neither outcomes, nor actions, nor probabilities.

  ---

  ### Diagnosis of the "Empty Cell"

  **Is it incoherent, unattractive, or merely unoccupied?**

  The "Empty Cell" (Leaf 8) is **scientifically idle but logically coherent**. It is not incoherent because one can consistently hold that metaphysical fixity exists independently of epistemic access (trajectory), pragmatic utility (action), or probabilistic structure (statistics). However, it is **profoundly unattractive** to working physicists and most philosophers of science because it severs the link between determinism and *constraint*.

  If a system is deterministic but you cannot predict the trajectory (SIC), you cannot plan actions (control swamped), and you cannot predict the statistics (non-ergodic/uncomputable measure), then the claim "it is determined" does no work. It offers no leverage for explanation, no basis for intervention, and no ground for probability. It reduces determinism to a "God's eye view" that has no cash value for any agent within the universe. Consequently, the cell is unoccupied not because the position is impossible, but because it offers no motivation for adoption: it retains the metaphysical burden of determinism without any of its traditional explanatory or predictive benefits.
