prompt: |-
  I am drawing up the specification before I read any further into accounts of imprecise credence — credence represented by a set of probability functions rather than a single one. Fix the purpose as follows: the theory is for an agent who has to act anyway on the basis of the imprecision, not merely to record it — a regulator setting a safety standard, or an engineer choosing between two designs — in a case where the disagreement among defensible probability models is itself the difficulty, and where the cost of error is badly asymmetric between the two directions in which the truth might lie.

  Write the desiderata: what a theory of rational imprecise credence has to deliver to count as adequate for that use. For each requirement give the case or consideration behind it, and mark it either non-negotiable or as the preference of one camp. I want the weight on the requirements and their motivations, not on scoring candidate views.

  Among the questions I want the list to settle:

  - the minimum of mere coherence — no sure loss, no combination of trades the agent would have accepted that guarantees a loss whichever way things go — and whether that minimum is anywhere near sufficient;
  - what the theory owes us about updating: whether it must say which members of the set get conditioned and when, and whether it may ever let incoming evidence widen the interval (the dilation phenomenon) or must never do so;
  - whether the theory must be able to learn from accumulating evidence — must the interval narrow toward precision, and on what schedule — or whether permanent, irreducible imprecision is a defensible stopping point;
  - a decision rule: when a choice is permitted or required given an interval, and whether such a rule can respect asymmetric error costs without degenerating into taking the midpoint and pretending one is precise;
  - two distinctions I have not seen drawn cleanly, which I want the list to respect: (i) imprecision that comes from thin or conflicting evidence, versus imprecision that comes from the hypothesis space itself being arbitrarily grained or badly defined; and (ii) imprecision about how confident to be, versus imprecision about which of several models to trust when all of them are empirically adequate so far. Say whether a single representational device — one convex set of probability functions — can carry both distinctions, or whether the theory needs extra structure on top of it.

  Then, briefly: if some subset of your requirements cannot be jointly satisfied, say which ones and what has to give — that is the part I most want to see. And name the single requirement that excludes the most candidates, including the candidate of staying a precise Bayesian with a sensitivity analysis bolted on afterward.

  Please write in American English, in prose organized around the requirements list; no bibliography or citations.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Topic:** Specification for a theory of imprecise credence (sets of probability functions).
      *   **Purpose:** Action-guiding for an agent who *must* act despite imprecision (e.g., regulator, engineer).
      *   **Context:** Disagreement among defensible models is the core difficulty; error costs are badly asymmetric.
      *   **Output:** A list of desiderata (requirements) with motivations/cases, marked as "non-negotiable" or "preference of one camp."
      *   **Key Questions to Address:**
          *   Minimum coherence (no sure loss) vs. sufficiency.
          *   Updating rules (conditioning, dilation).
          *   Learning from evidence (narrowing vs. permanent imprecision).
          *   Decision rule (handling asymmetric costs without collapsing to midpoint).
          *   Two distinctions: (i) thin/conflicting evidence vs. grain/hypothesis space issues; (ii) confidence level vs. model trust.
          *   Representational adequacy (can one convex set do it all?).
      *   **Conflict Analysis:** Identify incompatible requirements and what must give.
      *   **Exclusion:** Name the single requirement that excludes the most candidates (including precise Bayesianism + sensitivity analysis).
      *   **Style:** American English, prose organized around the list, no bibliography/citations.

  2.  **Deconstruct the Purpose:**
      *   The agent *must act*. This is crucial. It's not just epistemic bookkeeping.
      *   Asymmetric costs. This rules out simple averaging or indifference.
      *   Model disagreement is the *source* of trouble. This implies the set of probabilities isn't just noise; it represents structural uncertainty.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Coherence.* Standard Dutch Book arguments apply to sets. E-Admissibility or Maximality?
          *   *Motivation:* Don't lose money for nothing.
          *   *Status:* Non-negotiable.
          *   *Nuance:* Is "no sure loss" enough? Probably not for action. Need to avoid "sure loss" relative to the set, not just individual members.

      *   *Requirement 2: Decision Rule.* The prompt emphasizes asymmetric costs.
          *   *Motivation:* A regulator cares more about false negatives (safety) than false positives (cost).
          *   *Status:* Non-negotiable for the stated purpose.
          *   *Constraint:* Cannot just pick the midpoint. Must use the bounds (e.g., minimax regret or alpha-maximin).

      *   *Requirement 3: Updating & Dilation.*
          *   *Motivation:* If evidence comes in, how does the set change? Dilation (interval widens) is controversial.
          *   *Status:* Preference of one camp (dilation is often seen as a bug, but some argue it's a feature of ignorance). For an *action-guiding* theory, dilation is dangerous. Let's mark the *prohibition* of pathological dilation as a preference, or the *management* of it as non-negotiable. Actually, the prompt asks if it *must* say which members get conditioned.
          *   *Decision:* The theory must specify the update mechanism. Dilation should be permissible only if it reflects genuine loss of discriminatory power, not artifact.

      *   *Requirement 4: Learning/Convergence.*
          *   *Motivation:* If I keep gathering data, do I get more precise?
          *   *Status:* Non-negotiable that it *can* learn, but permanent imprecision is defensible for structural uncertainty.
          *   *Nuance:* Distinguish between parameter uncertainty (narrows) and model uncertainty (might not).

      *   *Requirement 5: The Two Distinctions (Representation).*
          *   (i) Evidence vs. Hypothesis Space grain.
          *   (ii) Confidence vs. Model Trust.
          *   *Motivation:* A flat set looks the same for "I have no data" and "the concept is vague."
          *   *Status:* This is a heavy lift. Can a convex set do both? Probably not without extra structure (weights, second-order probabilities).
          *   *Decision:* Require the theory to distinguish these, even if it needs extra structure.

      *   *Requirement 6: Actionability.*
          *   *Motivation:* The prompt says "has to act anyway."
          *   *Status:* Non-negotiable. No "suspend judgment" as a permanent state.

  4.  **Refining the Requirements (incorporating specific prompt constraints):**

      *   *Coherence:* Needs to be "No Sure Loss" across the set. But is it sufficient? No.
      *   *Updating:* Must specify conditioning. Dilation? For a regulator, dilation is risky. Let's frame it as: The theory must account for dilation, not hide it.
      *   *Learning:* Must allow narrowing, but allow permanent imprecision for structural issues.
      *   *Decision:* Must handle asymmetry.
      *   *Distinctions:* This is the tricky part. A standard Imprecise Probability (IP) set treats "I don't know" and "it's vague" similarly. The prompt asks if one device can carry both. I should argue it likely needs extra structure (like weights on the priors).

  5.  **Addressing the Conflicts (The "Trade-off" Section):**
      *   *Conflict:* "Permanent Irreducible Imprecision" vs. "Decision Rule that Resolves Choice." If the set stays wide, how do you choose? You need a rule that breaks ties (like Alpha-Maximin).
      *   *Conflict:* "Dilation allowed" vs. "Action Guidance." If evidence widens the interval, action becomes harder.
      *   *Conflict:* "Single Representational Device" vs. "Distinguishing Sources of Imprecision." A convex set is "flat." It doesn't distinguish between 'no evidence' and 'conflicting evidence' easily without weights.
      *   *The Big Excluder:* The requirement to *act* on the imprecision without collapsing to a single number (midpoint) excludes standard Bayesianism + sensitivity analysis. Standard Bayesians pick a prior. Sensitivity analysis is post-hoc. The requirement is to *use* the set for the decision.

  6.  **Drafting the Content (incorporating American English and tone):**
      *   Tone: Professional, philosophical but engineering-focused.
      *   Structure: Introduction -> The Desiderata (numbered) -> Conflict Analysis -> The Excluder.

      *(Self-Correction during drafting)*: Make sure to explicitly mark "Non-negotiable" vs "Preference."
      *   *Coherence:* Non-negotiable.
      *   *Decision Rule:* Non-negotiable (due to prompt constraints).
      *   *Updating:* Preference (debated in literature).
      *   *Learning:* Non-negotiable (must be able to learn), but permanent imprecision is a Preference/Defensible.
      *   *Distinctions:* This is a hard constraint from the user ("want the list to respect"). I will frame it as a requirement for representational adequacy.

      *(Refining the "Single Excluder")*: The prompt asks for the single requirement that excludes the most candidates, including precise Bayesianism with sensitivity analysis. That requirement is the **Action-Guiding Decision Rule that forbids collapsing to a point**. Standard Bayesians *must* collapse to act. Sensitivity analysis is for checking robustness, not making the choice *as* an imprecise agent.

      *(Refining the Distinctions)*: Can a convex set handle (i) and (ii)?
      *   (i) Thin evidence vs. Badly defined hypotheses.
      *   (ii) Confidence vs. Model trust.
      *   Standard IP (sets of probabilities) struggles here. It usually requires "weights" or a second-order structure to distinguish "all priors are equally plausible" from "some are more plausible." I will state that a bare convex set is insufficient; extra structure is needed.

  7.  **Final Review against Constraints:**
      *   American English? Yes.
      *   Prose organized around requirements? Yes.
      *   No bibliography? Yes.
      *   Address all bullet points? Yes.
      *   Identify conflicts? Yes.
      *   Identify the "Big Excluder"? Yes.

  8.  **Final Polish:** Ensure the distinction between "Non-negotiable" (functional necessity for the regulator/engineer) and "Preference" (theoretical stance) is clear. Ensure the asymmetric cost point is highlighted in the decision rule.

  *(Self-Correction on Dilation)*: The prompt asks whether the theory *must* say which members get conditioned. I should make that a requirement. Regarding dilation: For a safety regulator, dilation (uncertainty increasing with evidence) is counter-intuitive but possible with imprecise models. I will mark "No Pathological Dilation" as a preference, but "Explicit Update Rule" as non-negotiable.

  *(Self-Correction on Learning)*: Must the interval narrow? Not necessarily. If the imprecision is due to model structure, more data on parameters won't fix it. So "Ability to narrow" is non-negotiable, "Obligation to narrow to zero" is a preference (rejected).

