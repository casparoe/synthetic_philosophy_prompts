answer: |-
  To specify a theory of imprecise credence fit for an agent who must act under asymmetric costs and model disagreement, we must move beyond epistemic bookkeeping. The theory is not merely describing a state of mind; it is licensing a decision. The following desiderata outline what such a theory must deliver to be adequate for a regulator or engineer facing structural uncertainty.

  **1. Robust Coherence (No Sure Loss)**
  *   **Requirement:** The agent's set of probability functions must be coherent in the sense that no combination of bets can be constructed that guarantees a loss regardless of which probability function in the set is the "true" one and regardless of how the world turns out.
  *   **Motivation:** This is the baseline of rationality. If a regulator accepts a set of models that allows a Dutch Book, they are vulnerable to exploitation or systematic error. However, mere coherence is necessary but not sufficient. A set can be coherent yet too wide to guide action, or coherent yet include pathological models that distort decision-making.
  *   **Status:** **Non-negotiable.** Any theory failing this is mathematically defective.

  **2. Action-Guiding Decision Rule with Asymmetric Sensitivity**
  *   **Requirement:** The theory must provide a rule that selects an action based on the set of probabilities without collapsing the set into a single precise value (e.g., the midpoint). Crucially, this rule must accommodate asymmetric loss functions, allowing the agent to weight the risk of false negatives (e.g., a structural failure) more heavily than false positives (e.g., over-engineering).
  *   **Motivation:** In safety-critical engineering, the cost of error is not linear. A standard expected utility maximization requires a single probability. If the theory forces the agent to pick a midpoint to calculate expected utility, it pretends the imprecision does not exist. If the theory permits "suspension of judgment" indefinitely, the bridge does not get built. The rule must use the bounds of the imprecision (e.g., via minimax regret or alpha-maximin) to reflect the cost asymmetry directly.
  *   **Status:** **Non-negotiable.** This is the core functional purpose defined in the specification.

  **3. Explicit Updating and Dilation Management**
  *   **Requirement:** The theory must specify exactly how the set of probabilities transforms upon receiving new evidence. It must state whether all members of the set are conditioned, or only a subset. Furthermore, it must take a stance on dilation (where the posterior interval is wider than the prior interval).
  *   **Motivation:** An engineer cannot update a safety standard without knowing how data affects the uncertainty bounds. Dilation is a known phenomenon in imprecise probability where certain evidence increases ignorance. While mathematically valid, for a regulator, uncontrolled dilation is dangerous. The theory must either prohibit pathological dilation or provide a protocol for managing it when it occurs.
  *   **Status:** **Preference of one camp.** Some theorists argue dilation is a faithful representation of ignorance and must be accepted (Non-negotiable for descriptivists). For the prescriptive agent defined here, a theory that minimizes or explains away pathological dilation is preferred, though the requirement for an *explicit* update rule is non-negotiable.

  **4. Convergence and Permanent Imprecision**
  *   **Requirement:** The theory must allow the interval of credence to narrow as evidence accumulates regarding parameter uncertainty. However, it must also defend the possibility of permanent, irreducible imprecision regarding structural or model uncertainty.
  *   **Motivation:** If a theory forces the interval to collapse to a point with infinite data, it fails to capture the disagreement among defensible models. Conversely, if the theory never allows narrowing, it cannot learn from data. The distinction is between not knowing the *value* of a parameter (resolvable) and not knowing the *correct model form* (potentially unresolvable).
  *   **Status:** **Non-negotiable.** The theory must support learning, but it must not force precision where none exists.

  **5. Representational Discrimination of Imprecision Sources**
  *   **Requirement:** The theory must distinguish between (i) imprecision due to thin or conflicting evidence versus imprecision due to the hypothesis space being poorly grained or vague, and (ii) imprecision about the confidence level versus imprecision about which empirically adequate model to trust.
  *   **Motivation:** A regulator treats "we have no data" differently from "the concept of 'failure' is vague." Similarly, trusting one model over another is different from being unsure about the parameters within a model. A bare convex set of probabilities treats all these states identically (as a wide interval).
  *   **Status:** **Non-negotiable.** A single unstructured convex set cannot carry these distinctions. The theory requires extra structure (such as weights on the probability functions, or a second-order probability distribution over the set) to differentiate these states.
  *   **Representational Verdict:** A single convex set of probability functions is **insufficient**. It needs augmentation (e.g., a reliability weight for each member of the set) to satisfy this desideratum.

  ***

  **Incompatibilities and Trade-offs**

  Not all these requirements can be jointly satisfied without tension. The primary conflict lies between **Requirement 4 (Permanent Imprecision)** and **Requirement 2 (Action-Guiding Decision Rule)**.

  If the theory allows for permanent, irreducible imprecision (the interval never collapses), the decision rule must have a mechanism to break ties or select an action even when the expected utility of options overlaps significantly across the set. If the decision rule is too strict (e.g., requiring one option to dominate across *all* probabilities in the set), the agent will face chronic paralysis. If the decision rule is too aggressive (e.g., picking the best case scenario), it violates the safety mandate.

  To resolve this, something must give: either the agent accepts that some decisions will remain indeterminate (violating the "must act" constraint), or the theory must introduce a tie-breaking parameter (like an optimism/pessimism index) that effectively reintroduces a form of subjectivity the imprecise framework was meant to avoid. For the purpose specified (a regulator who must act), the tie-breaking parameter must be admitted. This means the theory cannot be purely objective; it must encode the agent's attitude toward ambiguity explicitly.

  A secondary tension exists between **Requirement 5 (Representational Discrimination)** and the mathematical elegance of standard Imprecise Probability. Standard sets of probabilities are "flat"; they do not natively distinguish between "no evidence" and "conflicting evidence." Satisfying Requirement 5 requires adding structure (weights or second-order probabilities). However, adding weights risks collapsing the theory back toward a single weighted average, undermining the motivation for imprecision. The theory must walk a line where weights inform the decision rule without collapsing the set into a precise prior.

  **The Single Excluding Requirement**

  The requirement that excludes the most candidates, including the candidate of staying a precise Bayesian with a sensitivity analysis bolted on afterward, is **Requirement 2: Action-Guiding Decision Rule with Asymmetric Sensitivity.**

  A precise Bayesian must select a single prior to calculate expected utility. Sensitivity analysis is a post-hoc check to see if the decision changes if the prior is tweaked; it is not a decision rule in itself. If the sensitivity analysis shows the decision flips depending on the prior, the precise Bayesian has no formal mechanism within their theory to resolve the choice other than picking a prior arbitrarily.

  The specification demands a theory where the *imprecision itself* drives the decision, specifically leveraging the width of the interval to accommodate asymmetric costs (e.g., acting on the upper bound of risk rather than the mean). This excludes precise Bayesianism because it forbids collapsing the set to a point for the sake of calculation. It also excludes "weak" imprecise models that offer no decision rule other than "E-admissibility" (choose any option that is optimal for at least one probability in the set), as this permits too much flexibility for a safety regulator. The theory must force a choice that respects the worst-case bounds without pretending those bounds are precise probabilities.
