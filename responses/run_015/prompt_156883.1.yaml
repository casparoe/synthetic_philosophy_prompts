answer: |-
  This is a fantastic conceptual knot. You've basically stumbled onto one of the deepest philosophical problems in archaeology without needing the jargon. Your "Mirror Constraint" is a great coinage for the novel—it sounds like something a tired archaeologist would invent at 3 AM to explain why the data won't talk to them.

  Here is the breakdown of how real archaeologists wrestle with this, how you can weaponize it in dialogue, and where your protagonist stands on the "science of minds" spectrum.

  ### 1. Breaking the Circle (Absence vs. Rot)
  You are right: it is circular. To say "they didn't leave goods" requires knowing "goods would have survived if they were there." But to know that, you need to know the soil conditions, which you assess by looking at... what survived.

  **How they break it in practice:**
  They don't break it with logic; they break it with **chemistry and volume.**

  *   **The Soil Test:** If you suspect grave goods rotted, you test the soil for phosphates or chemical residues. If a grave has high phosphate levels in the hand area but no bones of animals, maybe there was meat that rotted. If the soil is chemically "silent," the argument for intentional absence gets stronger.
  *   **The Pattern Argument:** One empty grave is noise. A thousand empty graves across three centuries is a signal. Taphonomy (rotting/theft) is usually random or chaotic. Ritual omission is *consistent*. If every single person is buried facing North with no shoes, shoes didn't just "rot away" selectively.
  *   **The "Shadow" Evidence:** Sometimes the *disturbance* is the trace. If the soil around the body is undisturbed but there's a rectangular discoloration where a wooden box should be, you have a "ghost" of the object.

  **For the dialogue:**
  The colleague should argue for **consilience** (many lines of evidence converging). The protagonist should argue for **ambiguity** (the data is silent, we are projecting noise).

  > **Colleague:** "It's not just the lack of goods. It's the soil chemistry. There's no phosphate spike. Nothing rotted here. They sent them in naked."
  > **Protagonist:** "Or they sent them in with leather that left no trace, and you're calling that 'naked' because it fits your theory of asceticism. You're not reading the graves; you're reading your own footnote."

  ### 2. Positive Traces (Symbols) vs. Negative Traces (Omissions)
  Is there a real difference? Yes, and it's ironic.

  *   **Positive Traces (Symbols on pottery):** These are **high visibility, high ambiguity.** We see the symbol clearly, but we have no idea what it meant. A spiral could be water, a snake, a journey, or just decoration. Reconstructing belief from this is like guessing a movie plot from a single poster.
  *   **Negative Traces (Standardized Omissions):** These are **low visibility, high certainty.** It is harder to *find* the absence, but once found, it implies **rules.** Beliefs are fuzzy; institutions are rigid. If a culture systematically omits food from graves, that implies a *rule* enforced by a group.

  **The Twist:** Your protagonist is actually onto something profound. Positive traces tell you about *individual expression* (art). Negative traces tell you about *institutional control* (law/religion). If you want to prove an "institution" (like a church or state), absence is actually better evidence than presence.

  **For the dialogue:**
  The protagonist should point out that symbols are lies, but rules are real.

  > **Protagonist:** "You see a sun symbol on that pot and think 'worship.' I see it and think 'pottery style.' But this? The fact that *no one* gets a pot? That's not style. That's a law. You can't rotate a belief system, but you can enforce a burial rite. You're not finding faith; you're finding compliance."

  ### 3. The "Science of Minds" Debate (Is your protagonist cynical?)
  Your protagonist's view—that archaeology is only a science of material constraints, not minds—is **not a dead end.** It is a specific, recognized school of thought.

  *   **The "Processual" View (1960s-70s):** This is your protagonist. They argued archaeology should be a science like geology. We study systems, ecology, and logistics. "Belief" is untestable fluff. If the climate got colder, people moved south. That's science. Saying "they moved because their god told them to" is storytelling.
  *   **The "Post-Processual" View (1980s-Present):** This is the colleague. They argue that humans aren't ants. We act on ideas, symbols, and agency. Ignoring belief ignores the *cause* of the action.

  **Is it too cynical?**
  No, it makes for a compelling character flaw. It's called **Materialist Determinism.** It's defensible, but it limits the scope of their work. The tension in your book comes from the fact that *both* are partially right.
  *   If you only study minds, you're writing fiction.
  *   If you only study dirt, you're missing the human part.

  **The Verdict:**
  Your protagonist isn't "wrong," they are just **methodologically conservative.** They are refusing to make a leap the evidence can't fully support. In a novel, this makes them reliable but perhaps emotionally distant. The colleague is the dreamer; the protagonist is the anchor.

  ### 4. Scene Beats & Dialogue Tips
  To keep it sharp and not pretentious, avoid words like "epistemology," "hermeneutics," or "taphonomy" unless one character is using them to sound smarter than the other.

  **Focus on the physical:**
  *   Don't talk about "absence." Talk about "empty hands."
  *   Don't talk about "institutional constraints." Talk about "rules."
  *   Don't talk about "taphonomy." Talk about "rot."

  **Sample Exchange:**

  > **Colleague:** "The orientation is consistent. East-facing. No goods. No food. They believed the journey required light, not weight."
  >
  > **Protagonist:** "Or the ground freezes west-to-east, and digging the other way breaks the pick. And 'no weight' is just 'no surplus.' You're calling economics a theology."
  >
  > **Colleague:** "Because they did it for three hundred years. Economics change. Ritual doesn't."
  >
  > **Protagonist:** "Ritual doesn't leave bones. Dirt leaves bones. I can tell you how they died. I can tell you what they ate. I cannot tell you what they hoped for. That's not archaeology; that's séance work."
  >
  > **Colleague:** "So we just catalogue dirt forever? We never ask *why*?"
  >
  > **Protagonist:** "Because the 'why' is a mirror. You look in, you see yourself. You call it 'afterlife.' I call it 'logistics.' The dirt doesn't care."

  ### Summary for your drafting:
  1.  **The Circle:** It's real. Archaeologists break it with chemistry and massive sample sizes (patterns), not logic.
  2.  **Positive vs. Negative:** Symbols (positive) are ambiguous. Omissions (negative) imply rules/control. Your protagonist is right that omissions prove *institution* better than *belief*.
  3.  **The Cynicism:** It's a valid philosophical stance (Processualism). It's not a dead end, but it is a limitation. It creates great conflict with a colleague who wants to find "meaning."
  4.  **The "Mirror Constraint":** Keep that term. It's perfect. It describes the idea that we only see the shape of the institution by the hole it leaves in the record.

  You're good to go. The tension you've identified is the actual engine of the discipline. Write the argument; the science will hold up.
