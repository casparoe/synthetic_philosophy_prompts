  2.  **Deconstruct the Archaeological Problem:**
      *   *The Circle:* This is essentially the Hermeneutic Circle applied to archaeology. You need context to interpret data, but you need data to build context.
      *   *Breaking the Circle:* Archaeologists don't "break" it mathematically; they use *convergence*. They look for multiple independent lines of evidence that point to the same conclusion. If grave goods are missing *and* the soil chemistry shows no decay *and* there are written records (if available) or ethnographic analogies suggesting asceticism, the case for intentional omission strengthens.
      *   *Positive vs. Negative Traces:* Positive traces (a symbol) are specific but ambiguous (what does the symbol *mean*?). Negative traces (absence) are broad but hard to prove (did it rot? was it stolen? was it never there?). However, *patterned* absence is powerful. If every single grave in a 500-year span lacks goods, that's a pattern, not an accident.
