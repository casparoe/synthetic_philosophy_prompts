      *   **The Knot:** Circular reasoning. To read absence as intentional, you need a model of the institution, but you infer the institution from the objects (or lack thereof).
      *   **Questions to Answer:**
          1.  How do archaeologists actually break this circle (or admit they don't)?
          2.  Is there a real difference between beliefs reconstructed from positive traces (symbols) vs. negative traces (omissions)?
