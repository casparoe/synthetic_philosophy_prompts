answer: |-
  # DECISION TREE: UNIT OF SELECTION DIAGNOSTIC

  **ROOT:** You have observed that a trait has increased in frequency across generations in a population. You must determine what the selection was *on*.

  1.  **Is the inheritance of the trait mediated primarily by a persistent environmental structure constructed by the ancestors, rather than by the replication of internal instructions (genetic or otherwise)?**
      *   *Concept:* Niche Construction / Developmental Inheritance.
      *   *Flag:* **[C/B/E DIVERGE]** Here, the causal mechanism (construction) conflicts with the standard selection framing (replication).
      *   **YES** → Go to Leaf 1.
      *   **NO** → Go to Node 2.

  2.  **Do the entities carrying the trait replicate via a mechanism that can increase their frequency *within* a container even if it reduces the container's reproductive success?**
      *   *Concept:* Transmission Conflict / Meiotic Drive.
      *   *Flag:* **[C/B/E DIVERGE]** Causation is at the sub-unit level, but bookkeeping often remains at the organism level.
      *   **YES** → Go to Leaf 2.
      *   **NO** → Go to Node 3.

  3.  **Is the trait in question a property of a single organism, or does it only exist as a property of a collection (e.g., colony structure, species range)?**
      *   *Concept:* Trait Locus / Emergence.
      *   *Flag:* **[C/B/E DIVERGE]** Explanation often shifts here even if causation is continuous.
      *   **SINGLE ORGANISM** → Go to Node 4.
      *   **COLLECTION** → Go to Node 7.

  4.  **Does the benefit of the trait accrue to the same token entity that pays the cost, or to other organisms?**
      *   *Concept:* Cost/Benefit Accrual.
      *   *Flag:* Standard Causation distinction.
      *   **SAME ENTITY** → Go to Node 5.
      *   **OTHER ORGANISMS** → Go to Node 6.

  5.  **Can the fitness differences be fully accounted for by summing individual changes, or is there a residual variance that requires a higher-level partition to explain?**
      *   *Concept:* Contextual Analysis / Residual Fitness.
      *   *Flag:* **[C/B/E DIVERGE]** This is the primary split between Bookkeeping (Price Equation) and Causation.
      *   **FULLY ACCOUNTED (No Residual)** → Go to Leaf 3.
      *   **RESIDUAL VARIANCE (Requires Partition)** → Go to Leaf 4.

  6.  **Are the recipients of the benefit genealogical relatives interacting in a structured population?**
      *   *Concept:* Relatedness / Kin Structure.
      *   *Flag:* Explanation distinction.
      *   **YES** → Go to Leaf 5.
      *   **NO** → Go to Node 14.

  7.  **Do the collections reproduce to form new collections directly (e.g., fission, budding of groups), or do they dissolve and reform from dispersing members?**
      *   *Concept:* Collective Reproduction / MLS2 vs MLS1.
      *   *Flag:* **[C/B/E DIVERGE]** Causation requires reproduction; Bookkeeping allows transient groups.
      *   **DIRECT REPRODUCTION** → Go to Node 8.
      *   **DISSOLVE/REFORM** → Go to Node 11.

  8.  **Is the variation in collection fitness caused by variation in member traits, or by variation in properties fixed at the collection level (e.g., species-level traits)?**
      *   *Concept:* Variation Source / Aggregation.
      *   *Flag:* Explanation distinction.
      *   **MEMBER TRAITS** → Go to Node 9.
      *   **COLLECTION PROPERTIES** → Go to Node 10.

  9.  **Does the trait lower individual fitness while raising the number of daughter colonies the colony founds?**
      *   *Concept:* Fitness Trade-off / Group Output.
      *   *Flag:* Causation distinction.
      *   **YES** → Go to Leaf 6.
      *   **NO** → Go to Leaf 7.

  10. **Do the lineages persist over timescales comparable to speciation and extinction events, rather than ecological generation times?**
      *   *Concept:* Unit Persistence / Timescale.
      *   *Flag:* Explanation distinction.
      *   **YES** → Go to Leaf 8.
      *   **NO** → Go to Leaf 6.

  11. **Is the fitness of the collective determined solely by the average fitness of member organisms, or does the collective have a fitness output distinct from member survival?**
      *   *Concept:* Fitness Metric / Aggregation.
      *   *Flag:* **[C/B/E DIVERGE]** Bookkeeping treats these as equivalent; Causation distinguishes them.
      *   **AVERAGE OF MEMBERS** → Go to Node 12.
      *   **DISTINCT OUTPUT** → Go to Node 13.

  12. **Is the variance partitioning mathematically equivalent at the individual and group levels, such that choosing one is a matter of convenience?**
      *   *Concept:* Formal Equivalence / Pluralism.
      *   *Flag:* **[C/B/E DIVERGE]** This is the core Bookkeeping question.
      *   **YES (Equivalent)** → Go to Leaf 9.
      *   **NO (Distinct)** → Go to Leaf 4.

  13. **Do the entities at the lower level have aligned or conflicting transmission routes?**
      *   *Concept:* Transmission Alignment.
      *   *Flag:* Causation distinction.
      *   **ALIGNED** → Go to Leaf 7.
      *   **CONFLICTING** → Go to Leaf 2.

  14. **Does the explanatory story support counterfactuals about individual intervention or network structure?**
      *   *Concept:* Explanatory Perspicuity / Counterfactuals.
      *   *Flag:* Explanation distinction.
      *   **INTERVENTION** → Go to Leaf 3.
      *   **NETWORK** → Go to Leaf 9.

  ***

  ## LEAVES

  **Leaf 1: Anti-Framing (Developmental/Niche)**
  *   **Characterization:** Selection is the wrong metaphor; the process is driven by the construction of inheritance conditions.
  *   **Awkward Commitment:** Must explain adaptive fit without invoking a selector, often relying on recursive causal loops.
  *   **Tag:** [Unit of Causation]

  **Leaf 2: Strict Replicator-Level Selection**
  *   **Characterization:** Selection acts on entities that replicate (genes, symbionts) regardless of the host organism's fitness.
  *   **Awkward Commitment:** Must treat the organism as a mere vehicle or environment, potentially fragmenting the phenotype.
  *   **Tag:** [Unit of Causation]

  **Leaf 3: Organism-Level Selection**
  *   **Characterization:** Selection acts on individuals based on their own survival and reproduction relative to neighbors.
  *   **Awkward Commitment:** Must treat social effects as external environmental noise rather than part of the selective unit.
  *   **Tag:** [Unit of Explanation]

  **Leaf 4: Multilevel Selection (Variant A - Average of Members)**
  *   **Characterization:** Selection is partitioned into within-group and between-group components, but groups do not reproduce as wholes.
  *   **Awkward Commitment:** Must treat transient aggregates as real units of selection for bookkeeping purposes despite lacking a lifecycle.
  *   **Tag:** [Unit of Bookkeeping]

  **Leaf 5: Kin Selection / Inclusive Fitness**
  *   **Characterization:** Selection acts on genes via the reproductive success of relatives sharing those genes.
  *   **Awkward Commitment:** Must impute agency or fitness accounting to genes or actors based on hypothetical relatedness.
  *   **Tag:** [Unit of Explanation]

  **Leaf 6: Group Selection (Interdemic / MLS2)**
  *   **Characterization:** Selection acts on groups that reproduce as wholes, often at the expense of individual member fitness.
  *   **Awkward Commitment:** Must identify a clear mechanism for group reproduction and heredity distinct from member replication.
  *   **Tag:** [Unit of Causation]

  **Leaf 7: Multilevel Selection (Variant B - Collective Output)**
  *   **Characterization:** Selection acts on collectives whose fitness is an emergent output, not merely the sum of member fitnesses.
  *   **Awkward Commitment:** Must define collective fitness without circularly referencing the very trait being selected.
  *   **Tag:** [Unit of Causation]

  **Leaf 8: Species- or Clade-Level Selection**
  *   **Characterization:** Selection acts on lineages via differential speciation and extinction rates.
  *   **Awkward Commitment:** Must accept that traits can be selected even if they reduce individual fitness, provided they increase lineage longevity.
  *   **Tag:** [Unit of Explanation]

  **Leaf 9: Pluralist / Bookkeeping**
  *   **Characterization:** Multiple levels are valid, intertranslatable descriptions of a single causal process.
  *   **Awkward Commitment:** Must deny that there is a single "true" level of selection, potentially diluting causal specificity.
  *   **Tag:** [Unit of Bookkeeping]

  ***

  ## DIAGNOSTICS SECTION

  ### 1. Indistinguishable Leaf Pairs
  *   **Leaf 4 (MLS1) and Leaf 9 (Pluralist):**
      *   *Indistinguishability:* **Formal.** Both rely on the mathematical partitioning of variance (Price Equation). Leaf 4 asserts the group component is real selection; Leaf 9 asserts it is a valid perspective equivalent to the individual component. In cases where groups do not reproduce (Node 7: Dissolve), the empirical output is identical; the distinction is purely philosophical stance on the reality of the partition.
  *   **Leaf 6 (Group/MLS2) and Leaf 7 (Collective Output):**
      *   *Indistinguishability:* **Causal.** Both require group reproduction. Leaf 6 emphasizes the *interdemic* nature (colonies founding colonies); Leaf 7 emphasizes the *emergent fitness* (output distinct from members). In practice, a colony that founds daughter colonies usually does so via an emergent output. Separating them requires a case where groups reproduce but fitness is strictly additive, which is biologically rare.
  *   **Leaf 3 (Organism) and Leaf 5 (Kin):**
      *   *Indistinguishability:* **Practical.** In highly structured populations, organism-level survival and kin-inclusive fitness often predict the same trait fixation. Distinguishing them requires manipulating relatedness while holding individual survival constant, which is experimentally difficult in natural cases.

  ### 2. Empty Logical Space
  *   **Node 7 (Direct Reproduction) + Node 11 (Average of Members):**
      *   *Status:* **Incoherent.** If a collection reproduces directly (Node 7), its fitness is defined by the production of new collections. If its fitness is merely the average of member survival (Node 11), it is not reproducing as a collective but rather dissolving and reforming. A unit cannot both reproduce as a whole *and* have fitness defined solely by member survival without contradiction.
  *   **Node 1 (Niche) + Node 2 (Transmission Conflict):**
      *   *Status:* **Unattractive.** While logically possible (a constructed niche that favors a driving allele), no major philosophical position occupies this specific intersection as a primary category. It is usually subsumed under Niche Construction (Leaf 1) because the construction dominates the causal story, or under Replicator (Leaf 2) because the drive dominates.
  *   **Node 8 (Collection Properties) + Node 12 (Equivalent Partitioning):**
      *   *Status:* **Nobody has bothered.** If variation is at the collection level (e.g., species traits), the variance cannot be mathematically partitioned down to individuals (since the trait is not variable among individuals). Thus, equivalence is impossible. This space is empty because the math forbids it.

  ### 3. Case Traces

  **Case A: The Sentinel Rodent (i)**
  *   **Trace:**
      *   Node 1 (Niche?): **NO** (Genetic marker shows no allele, but depends on food/development, not persistent env structure).
      *   Node 2 (Conflict?): **NO** (Sterile adults help breeders; no sub-organismal drive).
      *   Node 3 (Trait Locus?): **SINGLE ORGANISM** (Sterility is a property of the individual rodent).
      *   Node 4 (Benefit?): **OTHER ORGANISMS** (Sterile adults help colony breeders).
      *   Node 6 (Relatedness?): **YES** (Colony descended from one breeding pair).
      *   **Result:** Leaf 5 (Kin Selection).
  *   **Stall Point:** **Node 1.** A careful user might stall here. The trait depends on "how much food it was fed as a pup," which is an environmental modification by the parents. However, it is not a *persistent structure* like a burrow that lasts generations independently (Leaf 1); it is a developmental cue. The user must decide if developmental plasticity counts as "Niche Construction" in this framework. If they say YES, they misclassify to Leaf 1. If they say NO, they proceed correctly to Kin. The stall arises because the boundary between developmental systems and niche construction is porous in this case.

  **Case B: The Flightless Clade (v)**
  *   **Trace:**
      *   Node 1 (Niche?): **NO**.
      *   Node 2 (Conflict?): **NO**.
      *   Node 3 (Trait Locus?): **COLLECTION** (Trait is "wingless species"; variation is among species).
      *   Node 7 (Collection Reproduction?): **DIRECT REPRODUCTION** (Speciation is the reproduction of lineages).
      *   Node 8 (Variation Source?): **COLLECTION PROPERTIES** (No variation among species beyond what is fixed by the trait).
      *   Node 10 (Persistence?): **YES** (Speciation/extinction timescales).
      *   **Result:** Leaf 8 (Species/Clade-Level).
  *   **Stall Point:** **Node 7.** A careful user might stall on whether speciation counts as "collections reproducing to form new collections." In biology, species do not "reproduce" in the same sense as organisms (fission is rare; budding cladogenesis is standard). The user must accept cladogenesis as a form of collective reproduction to proceed to Leaf 8. If they demand organism-like fission, they might incorrectly route to Node 11 (Dissolve/Reform), leading to MLS1 or Pluralist leaves, which fails to capture the macroevolutionary nature of the case. The stall highlights the tension between biological lineage splitting and the philosophical definition of reproduction.
