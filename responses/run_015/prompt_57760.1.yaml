answer: |-
  ### The Essay Question

  **The Perfect Shadow**

  Imagine we discover a strange fact about the universe: Brain size perfectly predicts moral standing (intelligence, capacity for suffering, depth of experience) across every species we have ever measured. However, we also discover that brain size *causes* none of these things. It is a perfect correlation with no causal mechanism—a "perfect shadow." A mouse could theoretically have a human-sized brain and remain a mouse in mind; a human could have a walnut-sized brain and retain human consciousness. The size just tracks the inner life, for reasons unknown.

  1.  In this scenario, does the physical size of the brain carry any moral weight on its own, or does all the weight rest on what the size tracks?
  2.  Now, imagine the tracking breaks in one direction only: We find a creature with a massive brain but a simple inner life (high size, low capacity). Do we owe it more respect than its experience warrants, simply because it wears the "badge" of high standing?

  Write a response (approx. 1 hour). No research needed.

  ***

  ### Model Answer (545 words)

  If brain size is a perfect shadow that causes nothing, our first instinct is to say it holds no moral weight. Morality concerns how things feel and what they can do. If a creature suffers, it suffers, regardless of whether the hardware processing that pain is the size of a thimble or a melon. To value the size itself would be like valuing the weight of a wedding ring over the marriage it symbolizes. The ring matters only because of what it represents. If the representation is guaranteed, the metal is just metal.

  However, the prompt suggests a deeper intuition: that a bigger brain implies a "richer" inner life in a way tests can't measure. Perhaps we feel that physical magnitude signals nature's investment. We might think a large brain is a cathedral, and a small one is a chapel, and even if both hold the same number of worshippers, the cathedral commands more awe. But if we accept the premise that size causes no extra richness, this awe is superstition. It is a fetishization of the container. If the "cathedral" is empty of extra capacity, respecting the architecture over the worshippers is a mistake. Moral standing belongs to the light inside, not the square footage of the room.

  The harder problem is the second question: the broken tracking. Suppose we find a creature with a massive brain but the mind of a newt. It wears the badge of high standing without the substance. Do we owe it extra respect?

  Here, the "perfect shadow" history tempts us to say yes. We are trained to treat big brains as sacred. To treat a large-brained creature as simple feels like a category error, or even a danger. It feels like we are ignoring a warning sign. But if we know for a fact that the brain size is causally inert, treating the creature based on its hardware is discriminatory in reverse. It is granting privilege based on anatomy rather than experience.

  Yet, there is a pragmatic argument for treating the "big-brained newt" with caution. If the tracking was perfect for all of evolutionary history until this one anomaly, the anomaly might be a measurement error, or the creature might possess latent capacities we don't understand. But if we are certain the inner life is simple, granting it high moral standing devalues the standing of creatures that actually have the complex inner life but smaller hardware. It creates a moral inflation.

  Ultimately, if size causes nothing, it is a ghost. We should not build our ethics on ghosts. We must look at what the creature *is*, not what it *looks like it should be*. If we respect the badge over the bearer, we are not doing ethics; we are doing idolatry. We are worshipping the shadow instead of the object casting it. The moral law binds us to suffering and consciousness, not to centimeters of gray matter. If the tracking breaks, we must follow the consciousness, even if it feels wrong to ignore the size. To do otherwise is to say that appearance matters more than reality, which is the oldest moral error in the book.

  ***

  ### Marking Scheme (Out of 15)

  **15 (Distinction):**
  *   **The Move:** Explicitly separates *causal power* from *symbolic weight*.
  *   **The Nuance:** Grapples with the "cathedral vs. chapel" intuition (that size feels like richness) without accepting it as truth.
  *   **The Breakdown:** Handles the "broken tracking" scenario by identifying the risk of "moral inflation" or "idolatry" (valuing the badge over the bearer).
  *   **Style:** Clear, voice-driven, no jargon.

  **14 (Excellent):**
  *   **The Move:** Clearly argues that morality rests on experience, not hardware.
  *   **The Nuance:** Acknowledges the intuition that size matters but dismisses it logically.
  *   **The Breakdown:** Addresses the anomaly but focuses slightly less on the *consequence* of granting it status (e.g., just says "no" without explaining the cost).
  *   **Style:** Solid, clear, minor phrasing issues.

  **10 (Passable):**
  *   **The Move:** States the "obvious" answer: It's the suffering that matters, not the size.
  *   **The Miss:** Waves off the "richness intuition" too quickly (e.g., "Obviously size doesn't matter").
  *   **The Breakdown:** Answers the second part with a simple "No" without exploring *why* it feels difficult or what the social cost might be.
  *   **Style:** Functional but flat.

  **5 (Weak):**
  *   **The Move:** Confuses the premise (argues that size *does* cause intelligence despite the prompt).
  *   **The Miss:** Ignores the second question entirely.
  *   **Style:** Disorganized.

  **0 (Fail):**
  *   **The Recital:** spends the essay recounting the history of 19th-century craniometry, scientific racism, or phrenology *without* using it to answer the specific philosophical wrinkle. (History is only worth points if used as an analogy for the "badge" problem).
  *   **The Research:** Cites external studies or philosophers (violates the "no looking up" rule).
  *   **The Refusal:** States the question is unanswerable without trying.

  **Specific Deductions:**
  *   **-3 Points:** For arguing that brain size *must* cause intelligence (ignoring the hypothetical).
  *   **-2 Points:** For using academic jargon (e.g., "qualia," "utilitarian calculus") without defining it simply.
  *   **Automatic 0:** For using the essay to make political points unrelated to the moral logic of the scenario.
