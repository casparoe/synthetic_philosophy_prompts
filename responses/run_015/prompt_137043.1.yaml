          *   *Alternative:* The fault is in (9)'s application. Sensory thresholds adapt; *axiological* thresholds might not. But the user trusts (9). So I must challenge the inference from (1) to (2).

      *   **Q2: Price the alternatives.**
          *   If (2) fails: We need a model of "incommensurability without lexicality." (e.g., Ruth Chang's "parity"). This allows refusing the trade without saying Pain > All Pleasure. It allows a "zone of indeterminacy."
