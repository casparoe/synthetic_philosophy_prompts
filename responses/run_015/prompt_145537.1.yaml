answer: |-
  **Dr. A:** Let us confine our inquiry strictly to the biological substrate of numerical cognition. I am referring specifically to the Approximate Number System—the rapid, automatic capacity to discriminate quantities without symbolic labeling. My position is that the cross-cultural robustness and developmental early-onset of this system indicate direct selection. When an infant distinguishes between eight and sixteen dots, or when a forager assesses the size of a rival group, they are utilizing a mechanism that bears the hallmark of functional design. To claim this is a spandrel is to ignore the immediate survival value of quantitative assessment.

  **Dr. B:** I do not dispute the survival value of assessing quantity, Dr. A. I dispute the claim that the neural architecture responsible was selected *for* that purpose. The Gould-Lewontin critique hinges on architectural mismatch. Human numerical cognition is remarkably precise for small sets—subitizing—and logarithmically compressed for larger magnitudes. We are intuitively terrible at probabilities and large exact sums unless culturally scaffolded by language. This suggests the system is not an optimized calculator, but a byproduct of a system evolved for tracking discrete objects in space. The neural circuits activated during numerical tasks overlap significantly with those involved in spatial attention and object permanence.

  **Dr. A:** You are describing neural reuse, which is consistent with adaptation. Evolution rarely builds from scratch; it tinkers. However, your argument merely relocates the adaptive problem without dissolving it. If you posit that numerical cognition is a read-out of an object-tracking system, you must explain why the object-tracking system was selected to output *quantity* so reliably. Tracking identity and location does not necessitate aggregating discrete items into a summed magnitude. If the system extracts cardinality automatically, that extraction process itself requires explanation. Calling it a spandrel of object tracking assumes object tracking was the sole target of selection, but if the extraction of number enhances fitness, it becomes a target itself.

  **Dr. B:** That is a fair concession regarding the relocation of the problem, but it misses the criterion for a spandrel. A spandrel is not merely a useful byproduct; it is a structural consequence that lacks independent optimization. Consider the cross-cultural variability in mental number lines. Some cultures map numbers spatially from right to left, others left to right, and some not linearly at all. If numerical cognition were a dedicated adaptation, we would expect a more rigid, universal structural representation, akin to the visual cortex's retinotopic mapping. Instead, we see a system that is heavily dependent on linguistic framing for exactitude and varies in its spatial mapping. This plasticity indicates the "number" sense is piggybacking on spatial and linguistic systems, not driving them.

  **Dr. A:** Plasticity does not preclude adaptation; it often facilitates it. The visual system is plastic during critical periods, yet no one argues vision is a spandrel. The core mechanism—the ability to discriminate ratio differences in magnitude—remains universal even if the spatial mapping varies. My concern is epistemological. You propose that numerical cognition is a spandrel of object tracking. But how do we empirically distinguish a "spandrel of object tracking" from an "adaptation for quantity using object tracking hardware"? If I observe optimization in numerical discrimination, you can simply assert it is the object-tracking system functioning optimally. If I observe inefficiency, you claim it proves it is a spandrel. This renders the spandrel hypothesis unfalsifiable.

  **Dr. B:** I concede that the label "spandrel" is often abused as a catch-all for ignorance. However, it is not empirically vacuous if defined rigorously. To demonstrate numerical cognition is a spandrel, one must demonstrate two conditions: First, structural dependence, showing that the numerical capacity cannot be altered without disrupting the primary trait (object tracking). Second, the absence of independent functional optimization, meaning the cost-benefit ratio of the numerical capacity does not fit a model of direct selection. If the numerical system incurs a metabolic or computational cost that is not offset by numerical-specific fitness gains, but is maintained solely because it is coupled to a high-value trait like spatial navigation, then it is a spandrel.

  **Dr. A:** But that first condition is the trap. In a highly integrated brain, almost nothing is modularly isolated. If I show you that damaging the intraparietal sulcus impairs both number processing and spatial attention, you claim structural dependence. I claim it is a dedicated hub for magnitude that serves both functions. The criterion risks becoming a semantic shield. Any observed optimization in number processing can be redescribed as an incidental byproduct of optimizing spatial tracking. You require me to prove a negative: that the trait was *not* merely a consequence of another trait.

  **Dr. B:** And you require me to accept that every coherent function is a direct target of selection. That is the adaptationist prejudice. I am not asking you to prove a negative. I am asking for evidence of dissociation. If numerical cognition is an adaptation, it should be possible to find variance in numerical ability that is not correlated with variance in spatial or object-tracking ability. If the two are perfectly yoked across development and genetics, the hypothesis of independent selection weakens. The spandrel concept is tractable if we look for genetic or developmental decoupling. If we cannot find it, the claim of a dedicated numerical adaptation is the one lacking evidence.

  **Dr. A:** I accept that decoupling is the key empirical battleground. However, I maintain that the burden of proof lies on demonstrating the absence of selection pressure when the function is as critical as resource estimation. But let us move to your conclusion. You wish to know what would falsify my position.

  **Dr. B:** Precisely. We must define the conditions under which we would abandon our respective stances specifically regarding numerical cognition.

  **Dr. A:** Very well. I will state my falsification conditions clearly. I would abandon the strong adaptationist view of human numerical cognition if comparative neurodevelopmental evidence demonstrated that the neural circuitry for approximate magnitude is physically inseparable from spatial mapping without loss of spatial function. Specifically, if genetic knockouts in model organisms abolished numerical discrimination while leaving object tracking and spatial navigation *enhanced* or strictly intact, it would suggest the numerical capacity is a metabolic cost imposed by the spatial system, not a selected trait. Furthermore, if cross-species behavioral data showed that numerical precision does not correlate with ecological demands for foraging or threat assessment, but strictly correlates with general brain size or spatial range, I would concede that number is a byproduct of general spatial intelligence.

  **Dr. B:** That is a rigorous standard. Mine is reciprocal. I would abandon the spandrel critique if genetic-architectural evidence revealed a dedicated neural circuit for number that develops prior to, or independently of, the circuitry for object tracking and spatial attention. If we observed a developmental trajectory where numerical discrimination emerges in the absence of functional spatial mapping, or if cross-species data showed that numerical precision correlates with fitness outcomes *independent* of spatial navigation complexity—for instance, in species with high numerical needs but sedentary spatial habits—I would concede that numerical cognition is a dedicated adaptation. Essentially, I need to see the "number" module standing on its own legs, not leaning on the "space" module.

  **Dr. A:** Then we are in agreement on the data required, if not the current interpretation. We await the decoupling evidence.

  **Dr. B:** Indeed. Until then, the arch remains a spandrel in my view, however useful the view from the balcony may be.

  **Dr. A:** And I shall continue to argue that the view is the reason the arch was built.
