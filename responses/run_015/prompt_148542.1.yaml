answer: |-
  Thank you, Clare. And thank you, Emmy, for that poem. Alan would have loved the silence you left after it.

  We are standing in a garden, which feels right. Alan spent his life looking at the machinery of the mind, but he always preferred the company of growing things. We met in 1968, two graduate students in the same building. I studied birds; he studied brains. For fifty-five years, we walked this path together, though we often spoke different languages. I spent forty years explaining what animals do by what they perceive and feel. If a bird sings, I said it was because he saw a rival. Alan spent those same years telling me that was not strictly true.

  Alan held a view called epiphenomenalism. To put it simply: our feelings are perfectly real, but they do not push the atoms. He believed that every physical event has a physical cause, and while our conscious experience rides along with those causes, it does not steer the ship. He had two sentences he returned to for decades: the dial isn't the mercury, and nothing I feel will ever push a single atom.

  I know some of you here know the objection to this. If our feelings don't cause our words, then saying I am in pain is just luck. Alan knew this argument. He did not hide from it. He said the objection assumed a belief can only be about a thing if that thing pushes the belief into place. He called that the causalist prejudice. He distinguished causes from grounds. His love for you was not the cause of his actions, but it was the ground of them. It was real, fixed by the very state that moved his hands. He conceded this was a cost. He said he had learned to live with the grounded idiom.

  I am not a philosopher. I am a bird man. I cannot speak in his grounded idiom without feeling I am renaming the world I know. But I will not put words in his mouth that he spent fifty years refusing. I will not tell you his love caused him to care, because he would tell me that is false. But I will tell you this: his affections were not froth on a machine.

  His technicians tell the same story. He never once failed to ask about their children before he asked about the data. Was the feeling of care the cause of the question? Alan would say no. The neural state asked the question, and the feeling was grounded there. But when he asked you, How is Sarah? he was not lying. The care was present. It mattered. It was not less real because it did not push the atoms.

  Emmy knows this. When she learned to separate the calls of a chiffchaff and a willow warbler, Alan cried. He told her the tears had been arranged for before he knew why, and that this did not make them any less about her. He meant it. The tears were determined, yes. But they were his.

  Every August, he took the grandchildren out for the Perseids. He made them sit in the dark for twenty minutes before anyone was allowed to speak. He wanted them to feel the weight of the watching. He did not think the watching moved the stars. He thought the watching was the point.

  There will be no survival of the person. There is no suggestion that his experience is now doing anything anywhere. The machinery has stopped. The dial is still. But the reading remains.

  I cannot claim his feelings caused his kindness. But I can stand here, with his family, his colleagues, and his friends, and testify that the kindness was there. It was not luck. It was grounded in the man we knew. He taught me that you can accept the limits of the physical world without diminishing the reality of the human one. He was willing to pay the cost of his view. He paid it fully.

  We are left with the silence he loved, and the memory of the man who sat in it. He is not here to feel our loss. But we are here to feel it for him. And that, I think, is enough.

  ***

  **Notes to Self**

  I deliberately avoided saying Alan's love *made* him ask about the technicians' children. You specified he would call that false. Instead, I framed the care as *present* and *grounded* in the action, preserving the reality of the affection without violating his causal constraints. This protects you from the former student's critique while assuring the family the love was genuine.

  I also avoided claiming his view was successfully defended against the "luck" objection. I presented his distinction between causes and grounds as his sincere answer, not necessarily philosophical truth. This acknowledges the objection exists without validating the student's claim that his work was self-refuting.

  Finally, I omitted any comfort regarding an afterlife or continuing consciousness. You insisted on no survival of the person. I replaced this with the permanence of the "reading" on the dial—the legacy of his actions and the reality of the past love, which remains true even if the experiencer is gone. This keeps the eulogy secular and honest to his metaphysics.
