  (1) The core distinction
  The divergence lies in the truth conditions for de re modal claims. Kripkean transworld identity treats modality as a property of the individual itself: "Socrates could have been a carpenter" is true iff there exists a possible world containing *Socrates* who is a carpenter. The individual is the invariant anchor across modal space. Lewisian counterpart theory treats modality as a property of the individual's relations to others: the statement is true iff there exists a world containing a *counterpart* of Socrates who is a carpenter. Here, the individual is world-bound; modal properties are grounded in qualitative similarity relations between distinct entities in causally isolated concrete universes. The dispute is not merely about the word "same" but about ontological commitment. Kripke posits a primitive cross-world identity relation that transcends qualitative composition, whereas Lewis reduces modal talk to quantification over concrete counterparts linked by similarity. Consequently, Kripke preserves the intuition of strict identity at the cost of primitive modal facts, while Lewis preserves Humean supervenience at the cost of loosening the link between an object and its modal properties. Crucially, Lewis analyzes the *proposition* as concerning counterparts, while Kripke analyzes it as concerning the object directly. This shifts the metaphysical burden from maintaining identity across abstraction to maintaining similarity across concrete separation.

  (2) World-indexed versus cross-world essentialism
  Your distinction illuminates the structural divergence. Cross-world essentialism, aligned with Kripke, holds that an object's essential properties constrain its presence across modal space regardless of qualitative resemblance. If being human is essential to Socrates, no world contains Socrates unless he is human. This implies modal inertia: the object carries its identity conditions independently of any specific world's context. The world is indexed to the object. Conversely, world-indexed essentialism, aligned with Lewis, assigns essential properties relative to the world in which evaluation occurs. An object is essentially F only relative to a world where its counterparts are F. Since counterparts are selected via context-sensitive similarity relations, essentiality becomes fluid. An object might be essentially human relative to one conversational context but not another, depending on which similarities matter. These are not interchangeable because they dictate different directions of fit. Cross-world essentialism demands that modal space conform to the object's intrinsic nature; world-indexed essentialism demands that the object's nature conform to the selection criteria of the evaluating world. For Lewis, concrete worlds are causally isolated; nothing travels between them. Therefore, an object cannot constrain a distant world. Only the counterpart relation, grounded in local qualitative facts, can bridge the gap. For Kripke, worlds are abstract states of affairs stipulated by the object's possibilities. Thus, the object's essence dictates the legitimacy of the world. The former grounds modality in external relations; the latter grounds it in internal necessity. This explains why Lewis cannot accept cross-world essentialism: it would require a magical connection between isolated concretes. Kripke accepts it because worlds are defined by the object's potentialities, not vice versa.

  (3) The smuggling objection and its limits
  The smuggling objection suggests Kripkean origin essentialism covertly imports counterpart-like conditions. If Socrates must originate from specific gametes to exist in another world, isn't this just a strict qualitative similarity requirement? If so, identity collapses into a weighted similarity relation, undermining the claim that cross-world identity is primitive. However, this objection limits itself by conflating criteria of identification with constitutive conditions. For Kripke, origin is not a similarity metric used to pick out an object from a lineup; it is metaphysically constitutive of the object's very existence. Without that origin, *nothing* exists that could be Socrates. For Lewis, origin is merely one heavy weight among many in the counterpart relation; a sufficiently similar duplicate with different origins could still be a counterpart depending on context. The Kripkean maintains that identity is fundamental because the origin condition is binary and non-gradual: you either have that origin or you do not exist. There is no degree of identity. Therefore, origin essentialism does not reduce identity to similarity but rather restricts the domain of worlds where identity holds. It protects the primitive status of identity by ruling out worlds where the object fails to exist, rather than selecting an object within a world based on resemblance. The smuggling fails because it mistakes a condition of existence for a condition of selection.

  (4) Bottom line
  The heavier conceptual cost lies with the Kripkean. Lewis denies strict identity but gains an ontology where modality supervenes on qualitative facts. Kripke preserves intuition but pays with metaphysical opacity. To maintain cross-world essentialism, Kripke must accept primitive thisness transcending qualitative composition, positing brute modal facts. Lewis explains modality via concrete similarity; Kripke asserts it via primitive identity. Asserting a primitive cross-world bond requires accepting modal facts that do not supervene on the intrinsic nature of worlds. Lewis buys clarity with counterintuitiveness; Kripke buys intuition with mystery.
