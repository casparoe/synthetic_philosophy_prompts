answer: |-
  **JOINT STATEMENT ON THE NATURE OF EMOTION**

  **I. Agreed Commitments**
  1.  **Intentionality:** Emotions are about objects or states of affairs; they are not free-floating sensations.
  2.  **Anti-Jamesian:** Emotions are not identical to bare bodily feelings. The causal story where trembling causes fear gets the order backwards or misses the point.
  3.  **Normativity:** Emotions stand in relations of fittingness to their objects; they can be appropriate or inappropriate.
  4.  **Reasons:** Emotions are responsive to reasons, even if not always governed by them.
  5.  **Motivation:** Emotions typically involve action-tendencies or motivational upshots (e.g., flight in fear).
  6.  **Recalcitrance:** Emotions can persist despite contrary evaluations (e.g., fearing what one knows is safe).

  **II. Exclusion of Pure Feeling Theory**
  We jointly rule out the theory that emotions are *only* bodily sensations. Such a theory cannot account for Commitment 1 (Intentionality) or 3 (Normativity); a stomach churn is not *about* a spider, nor is it "fitting" or "unfitting" in itself. A pure feeling theorist would dissent here, arguing that the intentionality is secondary or illusory, and that the bodily change is the primary reality. We deny this.

  **III. Points of Disagreement**

  | Crux | Judgment Theorist Formulation | Perceptual Theorist Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology** | Emotion is a doxastic commitment; to fear is to judge something dangerous. | Emotion is an experiential presentation; to fear is to perceive something as dangerous. | Substantive |
  | **2. Revisability** | Emotion should vanish when judged false; persistence is irrational conflict. | Emotion can persist despite contrary judgment; persistence is akin to visual illusion. | Substantive |
  | **3. Concepts** | Emotion requires conceptual capacity to evaluate the object. | Emotion requires only discriminative capacity; non-conceptual content suffices. | Substantive |

  **IV. Verbal vs. Substantive Dispute**
  Part of our dispute is verbal. If the Judgment Theorist uses "judgment" to mean *any state with propositional content*, the Ontology crux dissolves. However, she typically means "assent with a mind-to-world direction of fit." The Perceptual Theorist denies emotions have this direction of fit. Therefore, the **Revisability** claim does the real substantive work. The core question is not what we call the state, but whether it is rationally required to vanish upon contrary evidence. If the Judgment Theorist admits emotions function like perceptions regarding evidence, the label "judgment" becomes irrelevant.

  **V. Case Studies and Predictions**

  **1. The Recalcitrant Spider**
  *Subject judges spider harmless, acts safely, yet reports fear.*
  *   **Bearing:** Crux 2 (Revisability).
  *   **Judgment Prediction:** Predicts irrationality. The subject holds contradictory commitments. The emotion *ought* to vanish.
  *   **Perceptual Prediction:** Predicts coherence. Like seeing a stick bend in water while knowing it is straight.
  *   **Impact:** Moves Perceptual Theorist minimally (confirms view); moves Judgment Theorist significantly. To move the Judgment Theorist further, we would need evidence that the subject loses the fear *immediately* upon genuine belief revision, not just verbal assent.

  **2. The Hernandez Protocol**
  *Compound A blocks belief-updating (judgments stale, emotions track danger). Compound B blocks emotional updating (emotions stale, judgments track danger).*
  *   **Bearing:** Crux 1 (Ontology) & 2 (Revisability).
  *   **Judgment Prediction:** Predicts impossibility or severe anomaly. If emotion = judgment, dissociating their updating mechanisms should be impossible.
  *   **Perceptual Prediction:** Predicts success. Distinct systems (evaluative perception vs. doxastic belief) should be separable.
  *   **Impact:** Strong move for Perceptual. To move the Judgment Theorist, she must argue Compound A doesn't block *real* judgment, only verbal report, or that the "emotion" remaining is not a full emotion.

  **3. Interoceptive Neuropathy**
  *Subject loses all bodily arousal feedback but reports emotions with unchanged content and fittingness.*
  *   **Bearing:** Commitment 2 (Anti-Jamesian).
  *   **Judgment Prediction:** Predicts emotion remains. Bodily feel is contingent, not constitutive.
  *   **Perceptual Prediction:** Predicts emotion remains. Phenomenology is evaluative, not merely somatic.
  *   **Impact:** **Neutral.** Both sides accommodate this equally well. It kills the Pure Feeling Theory but distinguishes neither Judgment nor Perceptual views. We note this case is a dud for our specific dispute.

  **4. Developmental/Animal Case**
  *Infant/animal shows full emotional syndrome without plausible conceptual capacity.*
  *   **Bearing:** Crux 3 (Concepts).
  *   **Judgment Prediction:** Predicts absence of full emotion. Must argue for proto-concepts or deny the state is genuine emotion.
  *   **Perceptual Prediction:** Predicts presence of emotion. Perception does not require complex concepts.
  *   **Impact:** Moves Perceptual Theorist minimally; moves Judgment Theorist significantly. To move the Judgment Theorist, we would need evidence that the animal possesses specific evaluative concepts (e.g., "danger") rather than mere associative learning.

  **VI. Conclusion**
  We agree on the boundaries of the emotion space (against feeling theories) but disagree on the internal architecture. The Hernandez Protocol and Animal Case suggest emotions function independently of belief and concepts. The Judgment Theorist must either refine "judgment" to include non-conceptual, recalcitrant states (risking verbal emptiness) or argue these cases lack genuine emotions. The Perceptual Theorist maintains these cases are standard. The substantive core remains the requirement of rational revisability.
