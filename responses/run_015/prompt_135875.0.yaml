answer: |-
  ### Part 1: Diagnostic Brainstorm

  Before we construct a positive account, let's isolate the conceptual friction points in your proposal. You are navigating three distinct categories of confusion:

  1.  **Felicity vs. Subjectivity:** You interpret Austin's "felicitous/infelicitous" distinction as implying there is "no real fact of the matter," merely a matter of social vibes ("whether things went over okay"). This conflates *intersubjective validity* with *subjectivity*. For Austin, felicity conditions are rigorous criteria (procedure exists, participants appropriate, execution correct, etc.). If they aren't met, the act is *void*, not just "unpopular." There is a fact of the matter; it is just an *institutional* fact, not a *brute physical* fact.
  2.  **The "Collapse" of the Distinction:** You read Austin's abandonment of the constative/performative binary as the collapse of speech act theory itself. This is a common undergraduate misreading. Austin didn't discard the framework; he generalized it. He concluded that *all* utterances are performative (illocutionary), not just explicit performatives like "I promise." This strengthens your project rather than undermining it.
  3.  **Illocution vs. Perlocution:** You suggest pivoting to perlocutionary effects (reliance, reassurance) because illocution (the promise itself) lacks a "fact of the matter." This is a category error regarding normativity. Perlocution is causal/psychological (what happened *after*); illocution is normative (what obligation was *created*). If you track perlocution, you are tracking whether the listener was influenced, not whether the speaker is obligated. You want to prove the PM *ought* to do the work, not that you *felt* he would.

  ***

  ### Part 2: The Analysis

  Your intuition that "a promise is just whatever your local group's rules say counts as one" is actually the most philosophically robust part of your proposal, though you dismiss it as "no philosophy needed." In fact, you have stumbled onto John Searle's development of Austin regarding **Institutional Facts** and **Constitutive Rules**.

  Here is the breakdown of why speech act theory is not a dead end for your tool, and why your pivot to perlocution would fail your specific normative goal.

  #### 1. Austin Did Not Abandon the Project; He Generalized It
  In *How to Do Things with Words*, Austin begins by distinguishing constatives (statements describing the world, true/false) from performatives (actions doing things, happy/unhappy). By Lecture XII, he dissolves this binary. He realizes that saying "The cat is on the mat" is also an act (the act of stating), which can be infelicitous (e.g., if there is no cat, or if you have no evidence).

  He replaces the constative/performative split with the **Locution/Illocution/Perlocution** triad.
  *   **Locution:** The physical utterance.
  *   **Illocution:** The force imposed by convention (promising, ordering, stating).
  *   **Perlocution:** The effect on the listener (fear, reliance, action).

  **Why this matters for your tool:** The fact that Austin generalized the performative means you don't need the word "promise" to exist for a promise to occur. "I'll pick that up" carries the same illocutionary force as "I promise to pick that up" *provided the felicity conditions are met*. Your initial keyword search failed because it looked for locutionary markers of a specific verb, rather than illocutionary markers of commitment.

  #### 2. Felicity Conditions Are Objective (Within the Institution)
  You worry that felicity implies "no fact of the matter." Austin argues that for an illocutionary act to be successful, specific conditions must be met. For a promise (commissive), these roughly include:
  *   **Preparatory Condition:** The event is in the future; the speaker is capable of doing it.
  *   **Sincerity Condition:** The speaker intends to do it.
  *   **Essential Condition:** The utterance counts as undertaking an obligation.

  Crucially, the **Essential Condition** relies on what Searle later called **Constitutive Rules**. In chess, moving a pawn two squares *counts as* a legal move only because of the rules of chess. In your workplace, typing "I'll take it" in `#standup` *counts as* a commitment only because of your team's constitutive rules.

  This means there **is** a fact of the matter. It is not a brute fact (like "is there a cat?"), but an institutional fact (like "is this check valid?"). If your PM says "nobody promised," he is either denying the institutional fact (claiming the rules don't exist) or claiming the felicity conditions weren't met (e.g., "that was in `#random`, not `#standup`," or "they were being sarcastic").

  Your tool can adjudicate this. It is not measuring "vibes"; it is measuring compliance with constitutive rules.

  #### 3. Why Perlocution is the Wrong Metric
  You asked: *Wouldn't it be more honest to just tag messages by what they caused afterwards... and drop "promise" as a category entirely?*

  No. This would render your tool useless for your specific political goal.
  *   **Illocution creates Obligation.** If I successfully promise you $5, I owe you $5, even if you forget about it immediately (no perlocutionary effect of reliance).
  *   **Perlocution creates Causality.** If I joke about $5 and you mistakenly believe me and buy a coffee (perlocutionary effect), I do not owe you $5.

  If you build a tool that tracks perlocution (e.g., "Did the PM reply with a thumbs up?" or "Did the ticket status change?"), you are tracking *causal history*, not *normative status*. Your PM's defense ("nobody promised") is a claim about normative status. He is denying the illocutionary act occurred. Proving that you *felt* reassured (perlocution) does not refute his claim that no obligation was undertaken. To win the argument, you must prove the **illocutionary act was felicitous**, not that it had effects.

  #### 4. Recommendation for the Tool Architecture
  You do not need to abandon speech act theory; you need to implement a **Felicity Checker** based on Searlean constitutive rules.

  **Step A: Define the Contextual Felicity Conditions**
  Your "house rule" about `#standup` is a **Preparatory Condition**.
  *   *Rule:* Utterance U counts as Commitment C only if U occurs in Channel X.
  *   *Implementation:* Filter by metadata. "I'll do it" in `#standup` = Promise. "I'll do it" in `#memes` = Not a Promise (infelicitous due to context).

  **Step B: Handle the Sincerity Condition (The Joke Problem)**
  Austin notes that if the speaker is not sincere, the act is an "abuse" but still occurs. However, in your context, you want to filter out abuses.
  *   *Rule:* Utterance U is void if marked as non-serious (e.g., emoji usage, specific slang, or subsequent retraction).
  *   *Implementation:* This is the hard NLP part. You need to train the classifier not on the word "promise," but on the *contextual markers of seriousness* your team uses.

  **Step C: Output Illocutionary Status, Not Perlocutionary Effect**
  The tool should output: *"Felicity Conditions Met: Yes/No."*
  *   If **Yes**: The system flags this as an institutional fact. "A commitment was undertaken."
  *   If **No**: The system flags "Infelicity detected: Wrong channel / Ambiguous intent."

  ### Summary
  You are misreading Austin's retreat from the constative/performative distinction as a failure, when it was actually an expansion that validates your "house rule" intuition. There is a fact of the matter regarding promises, but it is an **institutional fact** determined by **constitutive rules**, not a physical fact determined by keywords.

  Do not pivot to perlocution. Perlocution tracks psychological effects; you need to track normative obligations. Build your tool to detect whether the **felicity conditions** (channel, syntax, follow-up) required to generate an institutional obligation were present. When your PM says "nobody promised," you show him the log where the constitutive rules were satisfied. That is not just engineering; that is applied philosophy of language.
