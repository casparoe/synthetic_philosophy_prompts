  Many mouths make one hunger of the **colony**.
  The droplet drinks the soup, the synthetic **selvage**.

  Shear forces split the drop, the dividing **selvage**.
  It spreads across the forest, wild **fire**.
  The queen sends out the swarm, the breeding **colony**.
  It hijacks ribosomes, the replicating **virus**.
  A vessel built to cast the future **spore**.
  But sterility defines the stubborn **mule**.

  It inherits traits it cannot pass, the **mule**.
  Composition biases the daughter **selvage**.
  DNA sleeps safe inside the resistant **spore**.
  No memory survives the burn in **fire**.
  Selection acts upon the whole **colony**.
  Mutation rates accelerate the **virus**.

  No membrane wraps the protein shell of **virus**.
  A wall defines the limit of the **spore**.
  Phase separation marks the edge of **selvage**.
  Skin holds the biology of the **mule**.
  A moving front, not skin, defines the **fire**.
  Where does the insect end and start the **colony**?

  If marks define the breathing **colony**,
  Then sleep kills being in the **mule**.
  If process defines the burning **fire**,
  Then data kills the designed **selvage**.
  If breath defines the latent **virus**,
  Then vacuum kills the dormant **spore**.

  What work should *life* do for the frozen **spore**?
  What debt is owed the thinking **colony**?
  What danger lies inside the latent **virus**?
  What use is flame if not to mimic **fire**?
  What worth exists beyond the breeding **mule**?
  What law we write protects the made **selvage**.

  Not essence hides behind the **fire** or **selvage**,
  But purpose shapes the **virus** and the **colony**,
  And ethics wake the **mule** as much as **spore**.
