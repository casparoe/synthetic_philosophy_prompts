answer: |-
  Good evening.

  For those who don't know me, I'm [Name]. We are here to mark the fact that my grandmother is finishing up her work at the station. Forty-seven years. If you do the math, she started before most of the startup team was born, and before the genomics team had a lab to be baffled in.

  She has asked me to observe two rules tonight. First, no one is to use the word "legacy." She says that implies the work is done, and the station is still standing. Second, no one is to call her skill a "gift." She says calling it a gift is just a polite way of saying you don't intend to ask her how she did it.

  So I won't. I'm going to talk about competence.

  There is an idea in philosophy, often linked to Darwin, called "Strange Inversion." The usual assumption is that to do something complex well, you first need to understand how it works. You need the theory before the practice. The Inversion says: no. Competence comes first. Understanding is optional. You can have immense skill without knowing the underlying mechanics.

  Grandma is the proof of this. She never learned what a SNP is. She told the genomics team she was too old to start, but I think the truth is she didn't see the need. She had paper records. She had the hills. And she had what she calls "looking at them."

  For fifteen years, the scientists here have tried to map her choices. They built models. On average, the models work. But they still cannot reproduce her decisions in the tails—the outliers, the hard calls, the culls that didn't make sense on paper but made sense on the hill. That gap isn't magic. It isn't instinct. It is the difference between knowing *why* a sheep is good, and knowing *how* to pick one. She mastered the *how*.

  And this brings me to the third of you in this room—the team taking over the programme. You have built a selection pipeline that has just won its independent validation. It works. But we need to be clear about what it is.

  It is competent. It is also, in the strictest sense, comprehending nothing. It is a Turing machine for sheep. It does not know the wind, it does not know the grass, and it does not know the weight of a pen in a hand that has written forty-seven years of dates. But it is quite literally made out of her. It is crystallized competence, distilled from her paper records. It is her *how*, automated.

  This is why tonight is complicated.

  Something real is being lost. When the paper stops, a specific loop closes. The loop where a human being looks at an animal, consults a history, and makes a choice that carries risk. That risk was hers. The new system carries risk too, but it doesn't carry responsibility. It has competence without comprehension, and certainly without consequence.

  My sister, who studies biology, would tell me not to say Grandma was doing what nature does. She wasn't. Nature doesn't care. Grandma cared. She had goals. She had standards. She imposed order on the hill through attention, not through molecular insight.

  So, we are not here to say science has finally explained what she was doing. It hasn't. The models predict the average; they don't explain the exception. And we are not here to pretend the future is exactly the same as the past. It isn't. The pipeline is competent, but it is blind. It sees patterns; it doesn't see sheep.

  But it stands on ground she leveled.

  Grandma distinguishes between knowing why and knowing how. The genomics team knows *why*. The startup team knows *how* to code the pipeline. But only she knew *how* to breed these sheep, year in, year out, through droughts and markets and changes in government.

  We are not comforting ourselves with the idea that the machine will do it exactly as she would. It won't. We are acknowledging that the machine can only run because she walked the path first. Her competence is the substrate.

  So, I am not going to toast her "legacy." I am going to toast the work. I am going to toast the competence that didn't need permission from theory to be excellent. And I am going to toast the fact that while the new system may not understand what it is doing, it knows enough to know it stands on her shoulders.

  To Grandma. To the *how*. And to the station.
