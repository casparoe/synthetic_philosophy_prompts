answer: |-
  **Project Title:** The Architecture of Amnesty: Distinguishing Political and Moral Forgiveness in Transitional Justice

  **Research Question**
  Does the normative legitimacy of statutory amnesty provisions within truth commissions depend upon maintaining a rigorous conceptual distinction between political forgiveness—defined as an institutional, collective act restoring civic membership—and moral forgiveness, which remains the exclusive prerogative of individual victims?

  **Problem Statement and Existing Debates**
  Current transitional justice literature frequently treats reconciliation as a unified endpoint, thereby obscuring the specific normative conditions under which amnesty is granted. Standard retributive accounts typically frame amnesty as a deficit of justice, equating it with impunity and ignoring its potential role in civic restoration. Conversely, dominant restorative accounts often frame amnesty as a mechanism for healing but implicitly conflate institutional pardon with interpersonal moral forgiveness. This conflation creates a legitimacy deficit: when state institutions presume to forgive on behalf of victims, they usurp moral agency; when they refuse amnesty solely on retributive grounds, they may obstruct political stabilization. By failing to distinguish between the *political* act of reinstating perpetrators into the civic body and the *moral* act of absolving guilt, existing frameworks cannot explain why structurally different models—such as Argentina's forensic-documentation approach and South Africa's ubuntu-informed hearings—generated divergent legitimacy conditions despite sharing the goal of democratic transition.

  **Methodology**
  This project employs a conceptual method rather than an empirical cross-case study. The analysis will focus on the institutional language of amnesty provisions, truth commission mandates, and final reports. I will analyze the syntactic and normative structure of these texts to identify how forgiveness is operationalized. Specifically, I will examine whether the language constructs forgiveness as a bilateral moral transaction between victim and perpetrator or as a unilateral political act by the state. The Argentine and South African models will serve as illustrative archetypes of institutional design rather than empirical data points; the objective is to map how their distinct legal languages encode different theories of forgiveness. This textual analysis will be juxtaposed against philosophical definitions of political versus moral forgiveness to determine if the institutional language preserves the necessary conceptual boundary.

  **Deliverable**
  The workshop paper will produce a normative framework for evaluating amnesty legitimacy. This framework will offer a set of criteria for drafting amnesty provisions that explicitly secure the boundary between political reinstatement and moral absolution. For an interdisciplinary audience, this provides a tool for legal drafters and policymakers to design transitional mechanisms that secure political stability without violating the moral integrity of victims. The deliverable moves beyond the binary of punishment versus reconciliation to offer a typology of legitimate amnesty based on conceptual clarity.

  **Conditions of Project Failure**
  The project will be deemed unsuccessful if the proposed distinction between political and moral forgiveness collapses under analysis into a merely rhetorical difference with no bearing on legitimacy conditions. Specifically, if the conceptual analysis reveals that institutional language cannot practically enforce this boundary—or if the distinction fails to explain the variance in normative acceptance between the illustrative cases—the core thesis will be untenable. Failure would also occur if the analysis demonstrates that political forgiveness inevitably requires moral forgiveness to function, thereby proving the conceptual separation impossible in practice.
