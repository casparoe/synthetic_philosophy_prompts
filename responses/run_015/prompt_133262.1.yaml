answer: |-
  Here is the thought experiment scenario, designed to fit your dataset specs.

  **The Scenario**
  At the Late Neolithic site of Tell Logicus, excavators uncovered a large, rectangular communal structure containing zero inscriptions or writing. Inside, they found a cluster of 100 storage vessels (pithoi) and 10 saddle querns (grinding stones). The vessels are highly standardized in internal volume (variance <2%), suggesting a single production tradition or strict replication. Spatially, the vessels are arranged in 10 distinct clusters of 10 jars each, with every cluster centered around one grinding stone. The critical layout feature is that the *distance between the centers of each cluster is identical* (exactly 3 meters), forming a perfect grid within the building. Interpretation A (The Institutionalist) argues this grid proves a centralized grain-storage institution with administrative rules governing rationing and access. Interpretation B (The Minimalist) argues this is simply extended-family storage where the grid reflects rotted structural support posts that dictated where heavy jars could be safely placed, implying no formal rules beyond architectural necessity.

  **The Interpretive Split**
  The Institutionalist relies on the principle of **positive correlation**: the combination of volumetric standardization (uniform capacity) and spatial regularity (uniform distance) is statistically unlikely to emerge from uncoordinated household behavior. They argue that while families might make similar pots, they wouldn't naturally arrange them in a metric grid without a surveying intent—implying an administrative logic of "units" and "aisles" for inventory control. The Minimalist relies on the principle of **least complexity**: they argue that standardization is common in local pottery traditions (one potter supplying the village) and the spatial grid is a passive constraint imposed by the building's roof supports (postholes). For them, the "order" is architectural, not social; the families just filled the available safe spaces between the posts, creating an emergent grid without any central rules.

  **The Ambiguous Feature**
  The split hinges entirely on **the metric regularity of the inter-cluster spacing**. If the spacing is social/administrative, it implies intentional measurement (Institutionalist). If the spacing is architectural, it implies physical constraint (Minimalist). The volumetric standardization of the jars amplifies the ambiguity: it makes the grid look *more* like a system of accounts, but could also just mean one prolific potter supplied all the families who then built their storehouse around the same structural blueprint.

  **The Resolving Discovery**
  Ambiguity is removed if we discover **clay sealings with identical motifs on every jar rim**. If every jar was sealed with the same unique stamp before storage, the Minimalist explanation collapses; extended families do not typically use a single, uniform sealing mechanism across all household units unless there is a centralized authority controlling access. This object type shifts the inference from "passive architectural constraint" to "active access control," confirming the Institutionalist view of a regulated storage system.

  **The Institutionalists' Defense**
  Against the charge of overinterpretation (i.e., "you're seeing a state where there is only a village"), the Institutionalist defends their position using an **argument from improbable coincidence**. They argue that while a single feature (like jar size) might be accidental, the *conjunction* of volumetric standardization, spatial grid regularity, and (now) uniform sealings creates a "complexity threshold." They claim it is methodologically unsound to attribute three independent layers of uniformity to chance or passive structure; the probability of all three aligning without a coordinating rule-set is so low that inferring an institution is the more parsimonious explanation than assuming three separate coincidences.
