answer: |-
  **Joint Statement on Epistemic Modesty in Philosophical Reasoning**

  **Undersigned:**
  **The Inside-View Rationalist**
  **The Outside-View Calibrationist**

  **Date:** 24 May 2024

  **Preface**
  Following a series of structured dialogues regarding the norms of belief formation in abstract inquiry, we submit this document to record our convergence and divergences. Our aim is not to force a synthesis where none exists, but to map the topology of our dispute with sufficient precision that future inquiry may test our respective predictions. We agree that the goal of epistemic norms is truth-tracking, but we differ on the mechanisms that best secure this end in domains characterised by high complexity and low consensus.

  ### I. Agreed Claims

  1.  **Distinct Inputs, Shared Goal:** We agree that first-order reasoning (the inside view) and reference-class calibration (the outside view) utilise distinct inputs. The inside view evaluates the logical coherence, explanatory power, and evidential support of a specific argument. The outside view evaluates the statistical frequency of truth within a relevant class of similar judgements. Both camps agree that the ultimate objective is to align subjective credence with objective likelihood.
  2.  **The Self-Reference Tension:** We acknowledge a shared difficulty regarding the self-reference problem. Applying statistical base rates to one's own cognitive processes requires assuming that one's current reasoning is representative of the reference class. However, the act of identifying oneself as an exception to the base rate is itself a first-order judgement. We agree that no algorithm currently exists to resolve this tension without some degree of circularity.
  3.  **Limits of Feedback:** We concur that in many areas of metaphysics and ethics, feedback loops are too weak, delayed, or ambiguous to support reliable outside-view calibration. Where outcomes cannot be independently verified within a reasonable timeframe, historical track records of experts may reflect shifting consensus rather than convergence on truth. In such environments, we agree that blind adherence to base rates risks cementing error.
  4.  **The Content of Epistemic Modesty:** We agree that epistemic modesty is not merely a social virtue or a display of humility. It is a substantive adjustment of credence. We both accept that a rational agent must lower their confidence when presented with evidence of peer disagreement or a history of error in their domain, though we disagree on the magnitude and priority of this adjustment relative to first-order argumentation.

  ### II. Areas of Persistent Disagreement

  | Issue | Inside-View Rationalist Position | Outside-View Calibrationist Position |
  | :--- | :--- | :--- |
  | **Priority of Evidence** | First-order argumentative strength is the primary driver of credence. Statistical data about peers is secondary evidence that is easily overridden by a perceived breakthrough in logic. | Statistical data about peer performance is the primary constraint on credence. First-order argumentation is treated as data *within* the reference class, not as a trump card over it. |
  | **Source of Error** | Error arises primarily from logical mistakes, overlooked premises, or insufficient imaginative engagement with the problem. | Error arises primarily from systemic cognitive biases and the inherent difficulty of the domain, which affect all agents regardless of perceived logical rigour. |
  | **Treatment of Disagreement** | Persistent expert disagreement indicates the problem is difficult, not necessarily that my specific solution is wrong. | Persistent expert disagreement is a direct indicator that the probability of any specific solution being correct is low, regardless of its internal coherence. |

  ### III. Explicit Cruxes and Scenario Analysis

  We identify three specific cruxes where our disagreement is principled rather than terminological. For each crux, we apply the following concrete scenario:

  > **The Scenario:** A philosopher has constructed a novel argument that moral responsibility is incompatible with determinism. She knows that expert opinion is deeply divided on this issue and that philosophers in this area frequently reverse their positions over their careers. She must calibrate her confidence before publication.

  #### Crux 1: The Boundary of Domains
  **Question:** Is there a principled, non-arbitrary boundary between domains where inside-view reasoning legitimately dominates and those where outside-view calibration must take precedence?

  *   **Inside-View Prediction:** The philosopher ought to reason primarily from the strength of her novel argument. If the deduction is valid and the premises are more plausible than their negations, she is justified in holding high confidence. The domain of metaphysics allows for logical breakthroughs that render historical failure rates irrelevant. She should publish with high confidence, noting the disagreement as a contextual footnote.
  *   **Outside-View Prediction:** The philosopher ought to reason primarily from the reference class of 'metaphysical claims regarding free will'. Since the base rate of settled truth in this domain is near zero and reversal rates are high, her confidence must be capped at a low level regardless of argument quality. She should publish with low confidence, framing the argument as a exploration of logical space rather than a definitive resolution.

  #### Crux 2: Nested Reference Classes
  **Question:** Do nested reference-class problems (calibrating against all philosophers, against sub-specialists, or against agents with matching cognitive profiles) render the outside view inapplicable in metaphysics and ethics?

  *   **Inside-View Prediction:** The philosopher should recognise that narrowing the reference class to 'agents with matching cognitive profiles' effectively dissolves the outside view into the inside view. Once the class is small enough to be relevant, it is defined by the very argumentative capabilities she is assessing first-order. Therefore, she should ignore the base rate of 'all philosophers' as too broad and the base rate of 'people like me' as tautological. She should rely on her assessment of the argument.
  *   **Outside-View Prediction:** The philosopher must attempt to identify the narrowest reliable reference class, such as 'senior specialists in free will who have previously published influential papers'. Even if this class is small, the statistical tendency for such agents to be wrong about incompatibilism is informative. The outside view remains applicable provided the class is defined by track record rather than current argumentative self-assessment. She must discount her confidence by the failure rate of this specific sub-group.

  #### Crux 3: The Nature of Modesty
  **Question:** Does modesty function as a first-order epistemic virtue (truth-tracking) or as a pragmatic hedge against social overconfidence?

  *   **Inside-View Prediction:** Modesty is a pragmatic hedge. If the philosopher lowers her confidence solely because others disagree, without finding a flaw in her logic, she is sacrificing truth-tracking for social safety. True epistemic virtue requires believing what the evidence supports. She ought to maintain high private credence but may adopt modest public language to encourage dialogue.
  *   **Outside-View Prediction:** Modesty is a first-order epistemic virtue. Acknowledging the statistical likelihood of error *is* part of the evidence set. To ignore the base rate of reversal is to ignore relevant data. She ought to lower her private credence significantly, as a calibrated belief state that accounts for the probability of her own cognitive failure is more accurate than one that does not.

  ***

  **Signed:**

  _________________________
  **Inside-View Rationalist**

  _________________________
  **Outside-View Calibrationist**
