      *   *(c) Relaxing 'Form of Life' (FoL):* Does removing biology/society destroy the framework or update it?
          *   *Pros:* The metaphysical heavyweight. If FoL is necessary, AI has no meaning. If not, what is it?
          *   *Cons:* Easy to slip into intuition pumping.
      *   *(d) Cross-Modal Family Resemblance:* Vision-Language models vs. Human multimodal practice.
          *   *Pros:* Concrete, timely (multimodal models).
          *   *Cons:* Seems downstream. Depends on what we decide about FR and FoL first.

  3.  **Determine "Upstream" vs. "Downstream":**
      *   *Upstream:* Questions about the *conditions of possibility* for meaning/use. (c) is the most upstream. If FoL is strictly biological/social, the game is over before it starts. (a) is also upstream because it defines the *structure* of the game.
      *   *Downstream:* Questions that assume the game is possible and ask about specific mechanics. (d) is definitely downstream (it assumes there *is* a game to compare). (b) is mid-stream (it assumes there's an agent, asks about its interiority).

  4.  **Evaluate Relationships (specifically (a) and (c)):**
      *   User asks: Does answering (a) make (c) easier?
