answer: |-
  Here is a defended agenda for your ten sessions.

  ### The Ranking

  1.  **Priority 1: (c) The 'Form of Life' Condition.** (Sessions 1–4)
  2.  **Priority 2: (a) Family Resemblance & Essentialism.** (Sessions 5–8)
  3.  **Dependent/Sidebar: (b) The Private Language Argument.** (Session 9)
  4.  **Drop: (d) Cross-Modal Resemblance.** (Save for casual discussion)

  ### The Argument: Why This Order?

  You asked which questions are **upstream**. In Wittgensteinian terms, "upstream" means: *Which condition must be met for the other concepts to even have traction?*

  **(c) is the metaphysical gatekeeper.**
  If the "Form of Life" (FoL) is a necessary condition for meaning—if meaning *just is* the intersection of language and shared biological/social praxis—then LLMs categorically cannot mean anything. They are stochastic parrots, not language users. If you settle this negatively (FoL is strictly biological), questions (a), (b), and (d) vanish. There is no game to analyze, no family to resemble, and no privacy to violate.
  If you settle this positively (FoL can be synthetic or functional), you then have to explain *what* constitutes that form of life. This makes (c) the single most high-leverage session block. It dictates the ontology of your entire term.

  **(a) is the methodological trap.**
  Once you decide (in (c)) that AI *might* participate in a language game, you need criteria to distinguish that participation from mere statistical correlation. This is where (a) comes in. However, this is where your group faces its biggest philosophical risk. Wittgenstein introduced Family Resemblance (FR) specifically to *stop* philosophers from looking for necessary and sufficient conditions (essentialism).
  If you spend ten sessions trying to "formalise" FR to catch the AI out, you are doing exactly what Wittgenstein warned against. You are seeking an essence of "genuine use."
  **Why keep it?** Because the *failure* to formalize it is the lesson. The energy should be spent demonstrating *why* FR resists formalization, and whether that resistance is what excludes the AI. This makes (a) the crucial epistemological follow-up to the ontological (c).

  **(b) is a category error risk.**
  The Private Language Argument (PLA) targets sensations that are logically inaccessible to others. LLM internal states (weights/activations) are not "sensations"; they are structural parameters. They are opaque, yes, but not private in the Wittgensteinian sense (which requires a subject capable of following a rule about a sensation).
  Unless you have already established that the AI has a "form of life" that includes an interiority analogous to pain or sensation, (b) is premature. It sounds edgy, but it often collapses into a confusion between *epistemic opacity* (we can't read the weights yet) and *logical privacy* (only the subject can know the sensation). It is downstream of (c).

  **(d) is downstream application.**
  Cross-modal resemblance is an empirical claim about how vision-language models function. It presupposes that we already know what counts as a "resemblance" (a) and what counts as a "practice" (c). If you haven't settled (a) and (c), discussing (d) is just swapping intuitions without a framework. It is a case study, not a foundation.

  ### The Tension: Does (a) help (c)?

  You asked: *Does answering (a) make (c) easier, or are they pulling in different directions?*

  They are pulling in **different directions**, and recognizing this tension is where the real philosophical work lies.

  *   **(c) pulls toward Context:** It suggests meaning is grounded in the *background* (the life, the culture, the body).
  *   **(a) pulls toward Structure:** It suggests meaning is grounded in the *relations between uses* (the overlapping similarities).

  **The Conflict:** If you successfully "formalise" Family Resemblance (a)—i.e., you create a mathematical or logical metric for "sufficient resemblance"—you arguably make the "Form of Life" (c) redundant. If you can detect meaning via structural analysis of the language game alone, why do you need the biological/social context?
  Conversely, if (c) is the true ground of meaning, then (a) cannot be formalized, because the "resemblance" is only visible *from within* the Form of Life.

  **Advice:** Do not try to make them consistent. Use the friction. Spend Sessions 1–4 arguing that FoL is indispensable. Spend Sessions 5–8 trying (and failing) to define the game without it. The failure of (a) validates the necessity of (c).

  ### Inconsistent Motivations: A Warning

  You need to flag one major inconsistency in your group's current setup to avoid wasting time:

  **The "Anti-Essentialist Essentialism" Trap.**
  Your prompt for (a) asks: *"whether family resemblance can be formalised just enough to distinguish statistical pattern-matching from genuine language use without falling back into essentialism."*

  Be very careful here. This is likely a contradiction.
  1.  To "distinguish" X from Y requires a boundary.
  2.  To "formalise" that boundary requires a rule.
  3.  Wittgenstein's point is that language use has no hard boundaries (it is blurred).
  4.  Therefore, seeking a formal distinction *is* falling back into essentialism.

  If your group spends five sessions trying to solve (a), you risk turning Wittgenstein into the very kind of analytic philosopher he was critiquing. The "defended agenda" here is to treat (a) not as a problem to be solved, but as a **diagnostic tool**. If you can formalize the distinction, you've probably stopped doing Wittgensteinian philosophy. If you can't, that might be the proof that AI and Human language are not distinct *kinds*, but distinct *contexts* (which leads back to (c)).

  ### Proposed 10-Session Syllabus

  **Block 1: The Ground (Form of Life)**
  *   **Sessions 1-2:** *PI §19–24, §23.* What is a Form of Life? Is it biological, social, or functional?
  *   **Sessions 3-4:** *Application.* Can a synthetic agent have a FoL? If not, is it a "zombie" speaker? (This settles the ontology).

  **Block 2: The Structure (Family Resemblance)**
  *   **Sessions 5-6:** *PI §65–71.* The logic of Family Resemblance. Why does it resist definition?
  *   **Sessions 7-8:** *The AI Test.* Try to apply FR to LLM outputs. Does the "chain of resemblance" break at any point, or does it hold? (Focus on the *break*, not the match).

  **Block 3: The Interior & The Application**
  *   **Session 9:** *Private Language.* Briefly address internal states. Are they "private" or just "hidden"? (Use this to clean up misconceptions from Block 1).
  *   **Session 10:** *Open Floor/Cross-Modal.* Use (d) here only as a final stress test of the conclusions reached in Blocks 1 and 2.

  ### Summary
  Focus on **(c)** and **(a)**.
  (c) determines if the game exists.
  (a) determines how we recognize the moves.
  (b) is a distraction unless (c) is resolved positively.
  (d) is homework, not classwork.

  And regarding the hyphen: Wittgenstein didn't use one (*Sprachspiel*), but the English convention varies. Don't spend session time on it, but consistency in your handouts will make you look more organized than you feel.
