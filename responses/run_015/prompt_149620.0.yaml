      *   Conflict: If you formalize FR too much (a), you might inadvertently reintroduce the essentialism Wittgenstein hated, which undermines the need for FoL (c). Conversely, if FoL (c) is the *only* thing grounding FR, then trying to formalize FR (a) without FoL is doomed. They pull in slightly different directions. (a) seeks structure; (c) seeks context.

