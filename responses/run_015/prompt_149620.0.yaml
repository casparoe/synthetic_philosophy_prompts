      *   **Why (a) second:** Once you know the context (FoL), you need the criteria (FR). But warn them: Trying to "formalize" FR is anti-Wittgensteinian. The value is in seeing *why* it resists formalization.
      *   **Why drop (b):** It conflates "hidden weights" with "private sensations." It's a category error unless carefully reframed.
