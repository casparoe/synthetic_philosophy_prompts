      *   **Reading 1: The Psychological/Confidence Reading (The "Boring" One)**
          *   *Definition:* Hinges are just beliefs with maximal subjective confidence.
          *   *Defensibility:* Low. Wittgenstein explicitly distinguishes certainty from conviction.
          *   *Anti-Skeptical Work:* **Fails.** High confidence $\neq$ justification. Skeptic asks "Are you *right*?" not "Are you *sure*?"

      *   **Reading 2: The Methodological/Regulative Reading**
          *   *Definition:* Hinges are rules we *treat* as true to conduct inquiry, like axioms in geometry.
          *   *Defensibility:* Medium/High. Fits the "riverbed" metaphor.
          *   *Anti-Skeptical Work:* **Mixed/Redescriptive.** It explains why we *don't question* them, but doesn't prove they are true. It dissolves the *demand* for evidence, but doesn't refute the *possibility* of error.

      *   **Reading 3: The Non-Doxastic/Animal Certainty Reading (The "Wild" One)**
          *   *Definition:* Hinges aren't beliefs/propositions. They are ways of acting (certainty is a kind of doing).
          *   *Defensibility:* High (among Wittgenstein scholars like Moyal-Sharrock).
