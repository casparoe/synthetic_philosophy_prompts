  The summit watches with a static eye
  But now the cold dissolves the will to fight

  The plan was made in warmth and electric light
  So straight ahead, the valley opens wide
  But now the cold dissolves the will to fight
  There is no home waiting on this side

  So straight ahead, the valley opens wide
  I passed the yard, I passed the driveway gate
  There is no home waiting on this side
  The headlights cut the grey before the dawn

  ***

  **Note**

  I wrote from the interim driver's perspective. The planner's optimal strategy (ignore first, stop second) is visible only as a memory ("electric light"), while the immediate calculation favors continuing. The pantoum's recursion mimics the driver's inability to distinguish nodes; by stanza four, the repeated lines blur which turning is which, forcing the reader into the same uncertainty.

  I cheated the traditional pantoum closure (which usually swaps lines 1 and 3 of the first stanza) to satisfy your requirement that the final line equals the first. This forces the loop shut: the journey ends where it began, but the meaning shifts from anticipation to resignation (Payoff 1).

  I treat the tension as real. If rationality requires dynamic consistency, the driver is irrational. If it requires self-ratifying beliefs at each node, the planner's view is inaccessible. I would write from the planner's side only if binding pre-commitment were possible; without it, the interim logic unravels the plan. The paradox holds because the agent cannot credibly bind their future self at the second turning.
