  8.  **Final Polish:** Check the flow. Ensure the distinction between "summing welfare" (utilitarianism) and "weighing complaints" (contractualism) is clear, as that's the heart of the editor's argument.

      *(Self-Correction on Case 1)*: Actually, strict Scanlonism might say you save the one paralysed person because their individual complaint is stronger than any *single* leg-breaker. The user's intuition (save the 5) is more Utilitarian or 'Moderate Contractualist'. I need to point out that to keep Case 1, they might need to move slightly away from strict Scanlon towards a 'numbers count' contractualism (like Tim Henning or Derek Parfit's reading). *Wait, better approach:* Frame it as 'Relevant Claims'. If the harm is comparable, numbers break the tie. Paralysis is worse than a broken leg, but is it *five times* worse? If the user thinks 5 legs > 1 paralysis, they are aggregating. I will suggest the principle of 'Sufficiently Comparable Harms'.

