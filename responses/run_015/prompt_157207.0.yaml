      *   *Individualism:* Justification is owed *to each person*. You can't just sum up utility.
      *   *Aggregation Problem:* Can many small complaints outweigh one large complaint? Scanlon generally resists simple aggregation (summing), but allows for "comparative urgency" or "relevant alternatives."
      *   *The "Numbers" Debate:* Frances Kamm vs. Scanlon vs. Utilitarians.
      *   *Key Distinction:* It's not about the *sum* of welfare, but about the *strength of the individual complaint* against the principle being invoked.

  3.  **Evaluate the User's Cases against Scanlon:**

      *   **Case 1 (Paralysis vs. 5 Broken Legs):**
