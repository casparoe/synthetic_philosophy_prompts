      *   **Case 3 (40 Injuries vs. 1 Bystander Risk):**
          *   User: 1% risk = No; 0.001% risk = Yes.
          *   Scanlonian analysis: This touches on *ex ante* vs. *ex post* perspectives. The bystander can reasonably reject a principle that exposes them to significant risk without consent. But life involves *some* risk. There must be a de minimis threshold.
