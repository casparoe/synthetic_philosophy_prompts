          *   Scanlonian analysis: This is the "Transplant" case (Thomson). Killing an innocent outsider is usually strictly forbidden regardless of numbers. The outsider has a complaint about being *used* or *killed*, which is distinct from being *allowed to die*.
          *   *Conflict:* If the user says "Save 5 broken legs over 1 paralysis" (Case 1), they are aggregating. If they say "Don't kill 1 outsider to save 50" (Case 4), they are blocking aggregation.
          *   *Resolution:* The distinction isn't aggregation vs. no aggregation. It's about *direct harm vs. failure to rescue* or *rights violations vs. resource allocation*. In Case 1, you are allocating rescue resources. In Case 4, you are actively killing an innocent. Contractualism is very strong on the "do not kill the innocent" constraint.

  4.  **Synthesize a Coherent Principle:**
