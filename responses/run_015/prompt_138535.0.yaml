answer: |-
  I picked the "Internal Persistence Test" because it isolates the biological fact from the workplace context, which is the only way to apply the Regret Clause without getting stuck in circular arguments about job design. I dropped the "Biostatistical Reference" approach because nurses don't have access to population data in 20 minutes, and the "Pure Preference" approach because it would approve every complaint anyone had about management.

  ***

  ### 1. The 20-Minute Procedure

  **Step 1: The Internal Check (Policy Part A)**
  *   **Question:** Is there a specific, measurable change in the person's body or mind (bloods, sleep patterns, hearing test, diagnosed anxiety) that differs from their own baseline or a standard healthy adult?
  *   **Good Enough Answer:** A clinician's note citing specific symptoms or test results (e.g., "HbA1c is 6.2%," "Sleep latency is 90 minutes").
  *   **Stop Rule:** If the answer is "No, this is just a normal reaction to a hard situation" (e.g., tired because of no sleep, sad because of bullying), stop. **Decision: No.**
  *   **Theory vs. Fiat:** This is the **Naturalist** part (body facts). The line between "normal reaction" and "dysfunction" is where theory runs out; if the nurse isn't sure, mark it "Unclear Mechanism" and go to Step 4.

  **Step 2: The Trigger Check**
  *   **Question:** What specific thing at work makes this worse?
  *   **Good Enough Answer:** A specific environmental factor (night shift, open plan, specific noise frequency).
  *   **Theory vs. Fiat:** This is pure **Fact Finding**. No theory here, just matching the symptom to the trigger.

  **Step 3: The Regret Clause Test (Policy Part B)**
  *   **Question:** If we moved this person to a *reasonable* alternative workplace (e.g., day shift, quiet room, standard hours) where the Trigger was removed, would the Internal Check problem still exist, and would they still want it gone?
  *   **Good Enough Answer:** "Yes, the hearing loss remains even in a quiet room" OR "Yes, the metabolic damage remains even on day shift."
  *   **Stop Rule:** If the answer is "No, if we changed the work, the problem would disappear completely," stop. **Decision: No.** (This is the key filter for environment-mismatch).
  *   **Theory vs. Fiat:** This is the **Normativist** part (values). Defining "reasonable alternative" is an **Admin Fiat** call. If the alternative requires creating a new job role, it's not reasonable. If it's just a different shift or room, it is.

  **Step 4: The Kick-Upstairs Rule**
  *   **Question:** Is the nurse unsure whether the problem persists in a reasonable alternative, or is the claimant's desire unclear (e.g., they say they're fine but their doctor says otherwise)?
  *   **Action:** Do not decide. Write "Unable to verify persistence of condition independent of specific role." **Kick to Human Review.**
  *   **Theory vs. Fiat:** This admits **Epistemic Humility**. We stop pretending we know facts we can't verify in 20 minutes.

  ***

  ### 2. What to Write When You Don't Know

  When you can't answer the questions above, you need phrases that protect you from appeals without sounding like you're hiding behind jargon.

  *   **No Agreed Reference Class (e.g., is this sleep pattern normal for a 52-year-old?):**
      *   *Write:* "We cannot confirm this is a biological dysfunction rather than a normal variation because there is no standard medical data for this specific age and task combination."
  *   **No Known Mechanism (e.g., why does the open plan cause crying?):**
      *   *Write:* "The link between the environment and the physical symptom is not established in the provided evidence, so we cannot confirm an internal failure."
  *   **Unclear Regret (e.g., claimant says they're fine, partner says they're not):**
      *   *Write:* "The claimant's own stated preference conflicts with the clinical picture, so we cannot verify the 'Regret Clause' is met."
  *   **The "Reasonable Alternative" is Debated:**
      *   *Write:* "It is unclear if a workplace without this trigger counts as a 'reasonable alternative' or a fundamental change to the job. This is a values decision, not a medical one."

  ***

  ### 3. Worked Applications

  **Case A: 52-year-old Night-Shift Security Guard**
  *   **Step 1 (Internal):** Yes. Pre-diabetic bloods and chronic insomnia are measurable deviations from healthy functioning.
  *   **Step 2 (Trigger):** Night shift work.
  *   **Step 3 (Regret):** If moved to day shift, the insomnia might resolve, *but* the pre-diabetic metabolic state and weight gain are internal damage that persists regardless of shift. They would still rather not have pre-diabetes.
  *   **Decision:** **Yes, Medical Condition.**
  *   **Why Bosses Will Hate It:** This forces the company to pay for leave or accommodate because *their* shift structure causes lasting biological damage. It sets a precedent that shift work health costs are the employer's liability, not the worker's bad luck.
  *   **Honest Response:** Do not overrule. This is exactly what the Legal Sentence covers (internal failure + persistent regret). If the bosses hate it, they need to change the policy to exclude shift-work impacts, but until they do, the procedure forces a Yes.

  **Case B: 31-year-old Analyst (80-hour weeks)**
  *   **Step 1 (Internal):** Yes/Maybe. Stress response (crying, sleep loss) is a physiological state.
  *   **Step 2 (Trigger):** 80-hour workload.
  *   **Step 3 (Regret):** If the workplace were arranged differently (standard 40-hour weeks), the stress response would vanish. There is no residual internal dysfunction left to regret.
  *   **Decision:** **No, Not a Medical Condition.**
  *   **Note:** This aligns with your handbook exclusion. The Regret Clause filters this out because the "condition" is contingent on the excessive demand, not an internal failure that persists in a reasonable workplace.

  **Case C: 47-year-old with Age-Related Hearing Loss**
  *   **Step 1 (Internal):** Yes. Audiogram shows loss compared to species-typical function.
  *   **Step 2 (Trigger):** Meeting rooms/background noise.
  *   **Step 3 (Regret):** If moved to a quiet room, the hearing loss remains. They would still rather not have it.
  *   **Decision:** **Yes, Medical Condition.**
  *   **Note:** This is the easy case. The internal dysfunction is independent of the workplace design.

  ***

  ### 4. Limitations and Blind Spots

  **The Boring Failure Mode (Gaming):**
  Claimants will learn to describe their problems as "persistent internal damage" rather than "reactions to stress." A burned-out employee will learn to say "I have chronic anxiety disorder" (internal) rather than "I am stressed by this manager" (external). Your nurses will need to spot when a diagnosis is being used as a key to unlock the door rather than a description of reality.

  **The Structural Blindness:**
  This procedure cannot see **social determinants of health**. If a person is sick because they are poor, stressed, or discriminated against, but there is no specific "internal dysfunction" separate from that life context, this procedure will reject them. It treats the body as a machine separate from the life it lives, which is philosophically neat but medically incomplete.

  **The Incoherence of the Regret Clause:**
  You suspected this, and you are right. The Regret Clause is structurally biased against environment-induced conditions. If the environment *causes* the condition, removing the environment *cures* the condition. Therefore, in the counterfactual "different workplace," the condition doesn't exist, so the person can't "regret having it." This makes the clause logically hostile to anyone whose illness is genuinely caused by work design, unless there is permanent damage (like Case A's pre-diabetes). It forces us to treat only the *scars* of bad work as medical conditions, not the *wounds* themselves. You should flag this to Legal: the clause effectively says "We only pay for you if the damage stays with you after you leave the bad situation."
