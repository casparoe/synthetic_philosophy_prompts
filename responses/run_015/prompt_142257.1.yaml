      *   **Section 2: Where the Analogy Breaks.** Address the User's 3 sticking points (Rivalry, Roles, Spillover). This is crucial. The "Herder" role is the fatal flaw. The Agency is the Herder gaining wool; the Rider is the Pasture being grazed? No, that doesn't work either. The Rider is the Herder adding sheep (data) to a common pool (database) which degrades the common good (anonymity).
      *   **Section 3: Auditing the Conclusion.**
          *   Does it license the 48-hour rule? Yes, if data volume = grazing pressure.
          *   Does it license the Vendor? No, ToC specifically argues against voluntary restraint ("pinky swear").
          *   Inference vs. Collection: User is right. ToC implies limiting the *pressure*. If inference is the harm, limiting fuel is a valid proxy, but limiting *use* is more precise.
