          *   Provide a script/talking point.

  6.  **Refining the "Herder" Critique:**
      *   In ToC, the Herder *owns* the sheep and *gains* from them.
      *   In this App, the Rider *generates* the data (sheep) but doesn't *own* the value (wool). The Agency gets the value.
      *   So, are Riders Herders? Or are they the *Pasture*?
      *   If Riders = Pasture, then Agency = Herder. The Agency is overgrazing the Riders' privacy. This fits better! The Agency adds sheep (retention) to the pasture (Rider's life).
