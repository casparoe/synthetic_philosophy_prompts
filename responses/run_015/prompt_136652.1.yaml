answer: |-
  Good morning. Thank you for being here, and for letting me say a few words. I know a lot of you from school, and I know many of you from the kennels. I've spent enough time sweeping floors here to know that this place smells like bleach and wet dog, not like a brunch room. But being here, looking around, I realize there are two different shelters operating under this same roof.

  We are very good at supporting the first one. That's the shelter we see. It's the dog with the bandana in the photo. It's the cat with the story on the donation page. It's suffering we can reach. When we see an animal in pain, or scared, or lonely, we know what to do. We give them a name. We take a picture. We find a couch for them to sleep on. That work is beautiful. It matters. When you look at a rescued pug and see a happy life, you are seeing a victory.

  But there is a second shelter. It's made up of the animals who never arrive.

  This is the suffering nobody's donor base will ever cover, because it doesn't have a face yet. It's the litter that wasn't born because a clinic voucher was used. It's the stray that never existed because a fence was fixed. We don't get to hug these animals. We don't get to post their before-and-after photos. Their success story is simply that they never had a story of suffering at all.

  This is why the clinic work is the actual heart of this place, even though it happens in the back, away from the adoption floor. It is quiet work. It is preventative. It is the decision to care about pain enough to stop it before it needs a rescue.

  And sometimes, preventing suffering means making choices that don't look like happy endings. We have a vet here who carries a weight most of us never have to hold. There is a kind of kindness that doesn't look like a rescue. Sometimes, the most merciful thing we can do is ensure that a life filled with unavoidable pain does not continue, or does not begin. That vet walks through the back door every morning knowing that their job isn't just to fix what's broken, but to decide what cannot be fixed. We owe them more than thanks; we owe them the understanding that their work is part of the same mission as the adoptions. It's all about reducing the burden on the animals.

  So, when you think about what you support here, I hope you think about the empty cages.

  An empty cage isn't always a failure. Sometimes, an empty cage is the goal. It means we reached the suffering before it had a name. It means we funded the surgery that prevented the overcrowding that leads to the hard choices.

  We can't celebrate the animals who aren't here. We can't give them treats. But we can value the work that keeps them from needing us. The visible work saves the individuals we can reach. The invisible work protects the ones we can't. Both are necessary. But today, I hope we can raise a glass to the invisible work, too. To the quiet prevention. To the empty spaces. And to the understanding that sometimes, the kindest thing we can do is make sure the suffering never gets a face.

  Thank you.
