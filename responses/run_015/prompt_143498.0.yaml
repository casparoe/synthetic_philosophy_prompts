      *   **Core Beliefs:** The ethical is universal and binding. Faith involves a teleological suspension of the ethical in an absolute relation to God. This suspension is terrifying, isolating, and incomprehensible to others. It is *not* reducible to private feeling, metaphor, or immorality.
