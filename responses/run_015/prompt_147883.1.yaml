  ### The Role-Capture Protocol (RCP)

  **Purpose:** To determine whether a specific benefit or relationship constitutes a corrupt capture of a professional role, distinguishing between cultural etiquette, pragmatic necessity, and ethical violation.
  **Operator:** Site Coordinator (Senior Nurse).
  **Time:** 30 minutes.
  **Input:** Written record of the incident/proposal.

  #### The Procedure

  **Step 1: Define the Role and its Point**
  *   **Question:** What is the specific official function of the person receiving the benefit, and what is the *purpose* of that function (e.g., patient safety, fair competition, public trust)?
  *   **Sufficient Answer:** A one-sentence description of the duty (e.g., "To recruit patients based on medical eligibility," not "To recruit patients").
  *   **Stop/Refuse:** If the person has no official discretion (purely mechanical task), proceed to Step 4. If they have discretion, proceed to Step 2.

  **Step 2: Identify the Discretion and the Consideration**
  *   **Question:** Did the person exercise (or will they exercise) a choice that affects outcomes? What is the benefit offered, and did it occur *before*, *during*, or *after* that choice?
  *   **Sufficient Answer:** Identification of the specific decision point and the timing of the benefit relative to it.
  *   **Stop/Refuse:** If the benefit occurred strictly *after* the decision was finalized and irrevocable (e.g., treatment ended, contract signed), proceed to Step 5. If *before* or *during*, proceed to Step 3.

  **Step 3: The Loser Test (The Capture Check)**
  *   **Question:** Stand in the shoes of the person who lost out or was excluded by this decision (a competitor, a patient not selected, the public). If they knew about the benefit, would they reasonably believe it influenced the outcome?
  *   **Sufficient Answer:** A yes/no based on reasonable perception, not proof of actual influence.
  *   **Stop/Refuse:** If **YES**, this is presumptive corruption. Proceed to Step 5 to check for Necessity. If **NO**, proceed to Step 4.

  **Step 4: The Generalization Test**
  *   **Question:** If every person in this role accepted this benefit in these circumstances, would the system still function?
  *   **Sufficient Answer:** Yes/No.
  *   **Stop/Refuse:** If **NO**, Refuse. If **YES**, Allow.

  **Step 5: The Necessity Test (The Relationship Check)**
  *   **Question:** Is refusing this benefit likely to break the relationship or logistical chain required to perform the Role's Point? (i.e., Is the "gift" actually the price of access?)
  *   **Sufficient Answer:** Documented evidence that alternatives are unavailable or that refusal halts the work.
  *   **Decision Point:**
      *   If **NO** (Refusal is safe): **Refuse.** Record the incident.
      *   If **YES** (Refusal breaks the work): **HAND-OFF.** This is no longer a question of fact but of values (Integrity vs. Mission).

  **The Hand-Off:**
  If Step 5 yields a **YES** in a case where Step 3 yielded a **YES** (Presumptive Corruption + Operational Necessity), the Coordinator must refer the matter to the **Partnership Steering Committee** (not the Site Director). The Committee must vote on whether to accept the "dirty hands" to save the mission. The Coordinator does not decide.

  ---

  ### Application to Cases

  **Case 1: The Family, the Nurse, and the Chicken**
  *   **Step 1 (Role):** Nurse recruits/treats based on medical eligibility.
  *   **Step 2 (Discretion/Timing):** Discretion existed during recruitment. Benefit (chicken/schnapps) given *after* treatment ended.
  *   **Step 3 (Loser Test):** Who loses? Other patients? No, recruitment is closed for this child. Public funds? No, personal gift. Would a loser attribute the treatment to the chicken? No, treatment was already complete. **Result: NO.**
  *   **Step 4 (Generalization):** If all nurses accepted post-treatment gratitude gifts, would the system fail? No, provided it doesn't influence *future* care.
  *   **Outcome:** **Allow.** (Recorded as "Community Gratitude").
  *   **Rationale:** No discretion remains to be captured. Refusal would insult the family and harm community trust (Step 5 Necessity), but Step 3 clears it first.

  **Case 2: The Director, the Nephew, and the Courier**
  *   **Step 1 (Role):** Director awards contracts to ensure sample integrity/speed.
  *   **Step 2 (Discretion/Timing):** Discretion is active (awarding contract). Benefit is kinship loyalty (ongoing).
  *   **Step 3 (Loser Test):** Who loses? Other courier firms. Would they attribute the loss to kinship? Yes, reasonably. **Result: YES (Presumptive Capture).**
  *   **Step 5 (Necessity):** Director claims nephew is the *only* firm that reaches the district. If verified, refusing breaks the logistical chain. **Result: YES (Refusal is not neutral).**
  *   **Outcome:** **HAND-OFF.**
  *   **Rationale:** The procedure identifies this as role capture (Step 3) but acknowledges the operational trap (Step 5). The Coordinator cannot rule on whether "Logistical Survival" outweighs "Anti-Nepotism." This value judgment goes to the Steering Committee.

  **Case 3: The Partner, the Dean, and the Resort**
  *   **Step 1 (Role):** Dean decides on MOU renewal based on institutional benefit.
  *   **Step 2 (Discretion/Timing):** Discretion active (renewal). Benefit (resort week) is *during* the decision phase.
  *   **Step 3 (Loser Test):** Who loses? The University/Students (resources diverted). Would they attribute the renewal to the resort? Yes, reasonably. **Result: YES.**
  *   **Step 5 (Necessity):** Is the resort necessary for the signing? No. A meeting room suffices. Refusal does not break the relationship. **Result: NO.**
  *   **Outcome:** **Refuse.** (Counter-offer: Standard accommodation).
  *   **Rationale:** Clear capture with no operational necessity defense.

  ---

  ### The Uncomfortable Outcome

  **Case 2 (The Nephew)** is the one that will come out the way you would rather it did not.

  You likely expect the procedure to **Refuse** the nephew's contract. As a philosopher, you view the exclusion of family loyalty from public roles as a constitutive rule of ethics; to allow it is to validate corruption. However, the RCP triggers a **Hand-Off**.

  In practice, the Steering Committee (composed of peers who operate in the same environment) will likely **approve** the contract based on the "Necessity" evidence, perhaps adding a note to "seek alternatives later." The procedure effectively permits the corruption to proceed, provided it is documented and elevated.

  **Is this a defect in the procedure or in your expectation?**
  It is a defect in your **expectation**.
  You are operating under the hope that an ethical procedure can purify a clientelist system without halting its function. The RCP correctly identifies that in this specific context, "corruption" (kinship loyalty) and "infrastructure" (logistical reliability) are currently entangled. To refuse the nephew *is* to refuse the samples. The procedure forces you to admit that you are choosing between **purity of role** and **continuity of mission**. By handing it off, the procedure refuses to let the Site Coordinator (the nurse) bear the moral burden of that choice, but it also refuses to lie and call it "ethical." It names it as a value conflict. If you wanted the procedure to simply ban it regardless of consequences, you would be exporting a compliance list that ignores the "refusal is not neutral" constraint you mandated.

  ### What the Procedure Cannot Settle

  The procedure cannot settle **the source of its own authority.**

  It applies a standard that is neither **Ours** (the home university's compliance list, which bans the goat and the nephew equally) nor **Theirs** (the local norm, which accepts the nephew and the goat equally).

  It introduces a **Third Standard**: *Functional Role Integrity.*
  *   It judges the **Goat** by whether it captures *future* discretion (Local view), not by its monetary value (Western view).
  *   It judges the **Nephew** by whether the loyalty excludes the *purpose* of the role (Western view), but weighs that against the *survival* of the role's function (Local view).

  This Third Standard is a philosophical construct ("Role Capture") that assumes a role *has* a point independent of the relationships that sustain it. The procedure cannot prove this assumption. It quietly asserts that a "Nurse" or a "Director" has a duty to an abstract "Public" or "Mission" that transcends the immediate web of kinship and reciprocity. In a deeply clientelist society, this abstraction may be a fiction. The procedure works only if the local staff agree to pretend that the "Role" exists separately from the "Person." If they do not, the procedure is just another piece of paperwork to be managed via... a fixer.
