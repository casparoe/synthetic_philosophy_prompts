answer: |-
  **Brainstorming Candidate Accounts**

  Four candidate accounts compete to explain the authority of the earlier self. The Continuity view grounds authority in personal identity: the later patient is the same agent, bound by their own past commitments. The Will-based view treats the directive as a standing exercise of agency, akin to a promise or trust, valid regardless of identity shifts. The Side-constraint view sees the directive not as authority but as a fixed boundary against bodily interference, established while competent. The Instrumental view justifies the practice via social utility: reducing family burden and clinical uncertainty.

  I initially find the Side-constraint view most attractive because it elegantly explains the asymmetry between refusal and request: I have a right to refuse touch, but no right to command specific medical labour. However, this view struggles with the psychiatric variant, where the earlier self authorizes future coercion (medication), which looks like positive agency rather than a negative shield. Furthermore, the "answerability condition"—where the directive binds only when unrevisable—is difficult for any view treating the directive as a standard promise, since promises typically bind precisely while they can be revoked. I expect the hardest feature for my favourite view to handle is the psychiatric variant, as it requires granting the earlier self authority to override a later refusal that may not be legally deemed incompetent in the same way dementia is.

  **Reconstructing the Implicit Theory**

  The practice does not strictly presuppose a single unified theory but operates on a hybrid that prioritizes the Side-constraint view for refusals and the Will-based view for psychiatric interventions. It strictly presupposes that a competent agent can fix the boundaries of bodily integrity for a future state of incapacity. It fits comfortably with the Continuity view only if identity is understood biologically (animalism) rather than psychologically. If personal identity required psychological continuity, the severely demented patient would be a different person, rendering the directive a command to a stranger; yet the practice treats the organism as the same entity bound by prior values. Therefore, the practice is consistent with a view where the demented patient is no longer the same *person* as the signer, provided they are the same *human organism* whose disposition was settled by the signer.

  The practice rules out the Instrumental view as a primary justification. If utility were paramount, the happy demented patient's current welfare would override the past instruction, yet standard practice prioritizes substituted judgement over current best interests. Thus, the practice is deontological, grounded in the authority of the past competent self, not the welfare of the present subject.

  **Testing Against the Four Features**

  The four features you identify function as stress tests for this reconstruction. First, the **answerability condition** (binding only when unrevisable) tells against a standard Will-based view where authority tracks the persistence of the will. In contract law, authority weakens when revision is impossible; here, it strengthens. This suggests the directive is not a command from one agent to another, but a protective shield activated only when the agent can no longer protect themselves. The authority derives from the *status* of the earlier self as the last competent guardian of the organism's integrity.

  Second, the **asymmetry between refusing and requesting** strongly supports the Side-constraint view. A will that can only say "no" is not a full exercise of dominion, but it is a complete exercise of bodily sovereignty. The practice treats the body as a territory the competent self can fortify against intrusion, but not as a resource they can command others to exploit. This explains why an advance refusal of life-saving treatment is absolute, while an advance request is merely advisory.

  Third, the **hard case** (dementia) reveals a fissure. The practice discounts the content demented woman's present utterance in favor of the past sentence. If the practice relied on psychological continuity, the current self's desires would carry weight. Since they do not, the practice assumes the earlier self's "critical interests" (values defining a good life) outweigh the later self's "experiential interests" (current happiness). This confirms the practice is about respecting the narrative identity of the signer, not the welfare of the current subject.

  Fourth, the **psychiatric variant** complicates the Side-constraint view. Here, the earlier self authorizes coercion. This is justified differently than the dementia case: in psychiatry, the later refusal is discounted because it is deemed the product of impairment (invalid consent), whereas in dementia, the later refusal is overridden despite potential competence regarding the immediate choice. This implies the practice is not one thing; it is a mosaic of protecting bodily integrity (dementia refusal) and restoring agency (psychiatric treatment).

  **Probes and Practical Implications**

  Regarding the **escalator clause** (disregarding later objections as impairment), my reconstruction forbids it. The practice relies on the distinction between competence and incapacity to trigger the directive's authority. If the earlier self can define away later competence, the safeguard of the "answerability condition" collapses. The earlier self's authority is limited to setting boundaries, not to diagnosing the future self's mental state, which requires contemporaneous assessment.

  Regarding **reaffirmation requirements** (structured encounters with living examples), the theory makes this optional but morally advisable. Since the authority rests on the competent expression of values, ensuring those values are informed enhances legitimacy. However, because the practice is grounded in a right against interference rather than a duty to optimize outcomes, lack of reaffirmation does not render the practice unjustified, only potentially less autonomous. The practice as it stands looks slightly unjustified if we value informed autonomy highly, but not incoherent.

  If we replaced the presupposed view with one where **authority tracks present welfare**, clinical practice would change concretely in three ways. First, advance refusals would become advisory; clinicians could override a past refusal if the current patient appeared content and unharmed. Second, surrogate decision-making would shift from "substituted judgement" (what would they want?) to "best interests" (what is good for them now?). Third, psychiatric Ulysses contracts would vanish, as coercing a currently resisting patient would violate their present welfare unless immediate harm was evident. The focus would shift from honoring the dead hand of the past self to caring for the living subject of the present.
