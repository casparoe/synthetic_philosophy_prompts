  3.  **Map the Case to the Theory:**
      *   **Agents:** Not monolithic. Creditors (Troika: IMF, EC, ECB) vs. Greek Government (pre-2015 vs. Syriza). For the theory to hold, we need well-defined Bayesian agents. The internal disagreement within the Troika (IMF vs. EC/ECB on multipliers) complicates this. Let's treat "Creditors" as a composite agent with a dominant prior (EC/ECB political constraint + IMF model) and "Greek Government" as the other.
      *   **Event Space:** Usually states of the world. Here, the disputed "state" is the fiscal multiplier (structural parameter). Is this a state of nature or a model parameter?
      *   **Information Partitions:** Both sides saw the same macro data (output, unemployment). Did they have private information? Creditors had internal stress test models; Greeks had domestic welfare data. But the prompt says "Both sides had access to the same outturn data."
      *   **Common Knowledge of Posteriors:** Did they know each other's beliefs? They published reasoning. But did they *know* the other knew? The stubbornness suggests they knew the other disagreed but didn't update to match.

