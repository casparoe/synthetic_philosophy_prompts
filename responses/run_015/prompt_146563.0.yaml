      *   *1. Model-indexed prior:* Multiplier is a parameter, not a state. If priors are over models, not states, CPA doesn't directly apply. It's heterogeneous priors over model space.
      *   *2. Beliefs vs. Stakes:* Agreement theorem is about beliefs, not actions. Actions depend on utility functions. Creditors fear contagion; Greeks fear welfare loss. Even with same beliefs, actions differ. But the dispute was ostensibly about *feasibility* (beliefs), not just *desirability* (utility).
      *   *3. Updating:* IMF updated (admitted low multipliers). Greeks hardened (Syriza). Creditors hardened (capital controls). This violates Bayesian updating if the event space and priors were shared. Suggests non-credal factors (politics, mandate) or different event spaces.

