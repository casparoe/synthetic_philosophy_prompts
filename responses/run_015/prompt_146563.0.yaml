answer: |-
  The Greek crisis demonstrates that the Common Prior Assumption offers no traction on policy disputes where agents contest the structural model linking actions to outcomes rather than merely holding private information about a shared state.

  Mapping the case requires forcing political institutions into the role of Bayesian agents. The creditors were not a single agent; the IMF operated with a model-indexed prior while the European Commission and ECB prioritized political containment, creating internal partition conflicts. The Greek side was not a stable agent; the 2015 election replaced one mandate with another, effectively swapping the utility function mid-game. The event space was not a set of exogenous states but the value of a structural parameter, the fiscal multiplier, within a contested transmission mechanism. Information partitions were nearly identical regarding macro data, yet posteriors diverged. These posteriors were common knowledge in practice—both sides published forecasts—but did not converge, violating the agreement theorem's prediction for agents sharing a prior.

  Regarding the first strain, the model-indexed prior, the multiplier is a feature of the model used to map policy to outcomes, not a state of the world itself. The Common Prior Assumption requires a shared state space and a shared understanding of how signals relate to states. If agents disagree on the model structure, they operate in different event spaces. This is not heterogeneous priors relabelled; it is heterogeneous spaces. The theory is silent here because it assumes the mapping from state to signal is common knowledge. The description does work the theory cannot: it identifies model specification as the source of disagreement, not information asymmetry.

  Regarding the second strain, beliefs against stakes, the agreement results constrain credences, not decisions. Creditors priced systemic contagion and Eurozone integrity; the Greek government priced domestic welfare and electoral survival. Even if beliefs on the multiplier had converged, optimal actions would likely differ due to divergent utility functions. The visible dispute was framed as credal—arguments over feasibility—but driven by stakes—distributional conflicts. The framework cannot distinguish sincere credal disagreement from strategic positioning over stakes because it assumes truth-seeking Bayesians rather than utility-maximizing negotiators.

  Regarding the third strain, updating, the IMF updated its model parameters, the Greek electorate updated its mandate, and creditors updated their risk tolerance. This is not Bayesian updating on a fixed prior but structural breaks in the agents' frameworks. The theory cannot distinguish prior heterogeneity from non-credal factors because it assumes fixed utilities and a static state space. The description reveals shifting objectives and model specifications, which the theory treats as exogenous noise. The framework cannot distinguish which side was tracking a different event because it assumes the event space is fixed and known.

  The verdict is that the strain lies in the setup. The theory assumes stable agents with shared models seeking truth. This case involves unstable agents with contested models seeking political survival. Applying the Common Prior Assumption here treats political negotiation as information aggregation, which mischaracterizes the conflict.

  Running the traffic the other way, the episode is not an anomaly for the theory but a case the assumption was never designed to describe. The Common Prior Assumption describes communication among agents who agree on the rules of reality but hold different private information. It is excused from explaining this episode because it abstracts away from utility conflicts and model uncertainty. The theory has nothing to say about disputes where the rules of the game are themselves the subject of disagreement. It cannot explain why agents refuse to agree when they disagree on the model linking policy to outcomes or when their objectives are fundamentally opposed. The episode confirms only that when the state space and utility functions are contested, the machinery of common priors remains idle.
