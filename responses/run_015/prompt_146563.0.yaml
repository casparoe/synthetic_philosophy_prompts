      *   *Verdict:* The strain lies in the setup. The theory assumes fixed models and utilities. This case involves contested models and utilities.
      *   *Reverse Traffic:* The episode is outside the theory's scope. CPA describes information aggregation among truth-seeking agents with shared understanding of reality. It does not describe negotiation between agents with conflicting objectives and contested structural models. It is excused from explaining this because it abstracts away from utility conflicts and model uncertainty.

