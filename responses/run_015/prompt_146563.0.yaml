          *   Agents: Troika (composite) vs. Greek Govt. Troika isn't a single Bayesian agent (IMF vs. EC divergence).
          *   Event Space: The true value of the fiscal multiplier. This is a parameter, not a standard state.
          *   Partitions: Public data was common knowledge. Private info was minimal regarding the macro outcomes.
          *   Posteriors: Not common knowledge in the Aumann sense because they didn't converge.
