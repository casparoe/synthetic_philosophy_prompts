answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Science Museum
  **FROM:** Acquisitions Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Temporary Exhibit Proposal "Parallel Timelines"

  **DECISION**

  The Acquisitions Committee recommends **Conditional Approval** for the temporary exhibit proposal currently titled "Parallel Timelines." Approval is contingent upon substantial modifications to the exhibit's framing, labeling, and interpretive text to align with the Museum's Institutional Demarcation Standard. The proposal, as currently submitted, cannot be approved in its symmetrical format.

  **CONSIDERATION OF THE CURATORIAL ARGUMENT**

  The Committee acknowledges the strength of the Curator's pedagogical intent. The argument that visitors should be empowered to weigh evidence independently, rather than being instructed solely on established consensus, is a valid and vital component of science literacy. Shielding the public from controversial or fringe theories can inhibit the development of critical thinking skills. The Curator correctly identifies that understanding how historical narratives are constructed requires examining competing claims. Our institution values inquiry, and the desire to present a "forum" where visitors encounter conflicting data sets without immediate authoritative filtering is, in principle, consistent with our mission to foster active engagement rather than passive reception.

  **COMMITTEE ANALYSIS AND DEMARCATION CRITERIA**

  Despite the validity of the Curator's pedagogical goal, the proposed method of symmetrical presentation violates the Museum's Institutional Demarcation Standard. This standard explicitly distinguishes legitimate revisionism from pseudohistory. Legitimate revisionism is defined by hypotheses that are testable, peer-reviewed, and responsive to anomaly. In contrast, pseudohistory is characterized by post-hoc pattern matching that evades falsification.

  Anatoly Fomenko's "New Chronology" falls decisively into the latter category. It does not offer testable predictions that have withstood peer review; rather, it relies on statistical coincidences that dissolve under rigorous cross-disciplinary scrutiny. By placing conventional archaeological chronology and Fomenko's compressed chronology side-by-side without labeling either as established or pseudohistorical, the exhibit creates false epistemic parity. This formatting implies that both timelines possess equal evidentiary weight and scientific validity.

  This false parity does not teach visitors to weigh evidence; it riggs the scale. It suggests that scientific consensus is merely one opinion among many, rather than the result of a rigorous filtering process. To present these two frameworks as "parallel" is to misrepresent the nature of historical science. The Committee takes the committed position that scientific integrity requires us to identify pseudohistory as such. Neutrality in the face of demonstrable falsehood is not objectivity; it is misinformation. Therefore, the exhibit must not present these timelines as competing validities, but rather as a case study in how to distinguish robust science from speculative pattern matching.

  **REQUIRED MODIFICATIONS**

  To proceed, the Curatorial team must implement the following modifications:

  1.  **Reframing of Title and Premise:** The title "Parallel Timelines" must be changed to reflect the asymmetry of the content. A title such as "Chronology and Critique: Evaluating Historical Claims" is required to signal that the exhibit is about the *process* of verification, not the validity of both timelines.
  2.  **Explicit Labeling:** Display panels must explicitly label conventional archaeology as "Established Scientific Chronology" and Fomenko's theory as "Pseudohistorical Hypothesis." Neutral terminology is prohibited in this context.
  3.  **Demarcation Explanations:** Interpretive text must explicitly explain *why* Fomenko's theory fails the demarcation criteria. Panels must detail how the theory utilizes post-hoc pattern matching and evades falsification, contrasting this with how conventional chronology responds to anomaly through testing and peer review.
  4.  **Expert Context:** The exhibit must include video or text commentary from independent experts in archaeology, astronomy, and linguistics explaining the specific errors in the "New Chronology" data sets.

  **IMPLEMENTATION TIMELINE**

  *   **November 30, 2023:** Curatorial team to submit revised exhibit script and mock-up panels incorporating the required labeling and framing changes.
  *   **December 15, 2023:** Science Advisor and Acquisitions Committee to review revised materials for compliance with Demarcation Standards.
  *   **January 15, 2024:** Final approval of content; fabrication begins.
  *   **March 01, 2024:** Exhibit installation complete.
  *   **March 15, 2024:** Public opening of revised exhibit.

  **CONCLUSION**

  The Acquisitions Committee stands ready to support an exhibit that challenges visitors to think critically about how history is written. However, critical thinking requires accurate tools. Presenting pseudohistory as science removes those tools. By enforcing these modifications, we ensure the exhibit fulfills its educational potential without compromising the Museum's reputation for scientific rigor. We expect the revised proposal to adhere strictly to these conditions.
