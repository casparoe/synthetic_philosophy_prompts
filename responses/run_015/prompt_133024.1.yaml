  # Decision Tree: Conceptual Taxonomies of Genocide

  **Instructions:** To locate your position within this taxonomy, begin at the Root Node. Answer each diagnostic question based on your judgment of the specific boundary case or conceptual role described. Follow the branch corresponding to your answer until you reach a terminal leaf.

  ### **ROOT NODE: Status of the Legal Definition**
  **How should the 1948 Legal Definition (specific intent to destroy a protected group, in whole or in part) be treated?**
  *   **(A) Conceptually Fixed:** The treaty text establishes the necessary and sufficient conditions for the concept.
  *   **(B) Open to Expansion:** The treaty text is a historical baseline that omits essential elements of the harm.
  *   **(C) Subordinate to Moral/Political Considerations:** The definition is secondary to the function the label performs in discourse.

  ---

  ### **BRANCH A: Conceptually Fixed**
  *You hold that the 1948 Convention text is the boundary. (Note: This entails excluding political groups and requiring physical/biological destruction by current positive law.)*

  **Diagnostic Question 4:** In cases where there is no documentary proof of explicit intent but the structural pattern of violence makes group destruction the only plausible explanation, should the event be named genocide?
  *   **(No)** Intent requires explicit documentary or direct testimonial proof of specific aim.
      *   ➔ **LEAF 1: The Strict Legalist**
  *   **(Yes)** Intent can be inferred from the systematic nature of the acts, even without a "smoking gun."
      *   ➔ **LEAF 2: The Legal Realist**

  > **⚠️ Logical Flag:** **Leaf 1 and Leaf 2** may be indistinguishable in practice. If one accepts structural inference (Leaf 2) while claiming adherence to the fixed legal text (Branch A), one is often functionally expanding the concept of "intent" beyond strict constructionism. The distinction rests entirely on evidentiary standards rather than conceptual boundaries.

