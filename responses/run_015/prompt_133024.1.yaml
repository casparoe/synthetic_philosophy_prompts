  ### **BRANCH B: Open to Expansion**
  *You hold that the concept is broader than the 1948 treaty. The following questions determine the scope of that expansion.*

  **Diagnostic Question 2:** Can cultural destruction without physical killing satisfy the concept, or does the concept require biological or physical destruction?
  *   **(No)** The concept requires biological or physical destruction.
      *   **Diagnostic Question 3:** Should the protected-group category include politically defined groups, given that Lemkin originally sought their inclusion but the adopted Convention excluded them?
          *   **(No)** Groups must be national, ethnical, racial, or religious.
              *   ➔ **LEAF 3: The Biological Expansionist** (Expands intent/group interpretation but retains physical/national limits).
          *   **(Yes)** Political groups must be included.
              *   **Diagnostic Question 5:** Is applying the term primarily a legal determination, a moral judgment identifying the worst kind of wrong, or a strategic political speech act intended to trigger specific obligations?
                  *   **(Legal Determination)** The label should function purely legally, even if the law is amended to include political groups.
                      *   ➔ **LEAF 4: The Reformist Legalist (Rare Combination)**
                      *   *Diagnosis:* **Conceptually Unstable.** This position advocates expanding the *victim* class (political) while restricting the *harm* class (physical only). Since political groups are defined by ideas and association, excluding cultural/epistemic destruction renders the protection of political groups practically null. It is legally reformist but conceptually conservative.
                  *   **(Moral Judgment)** The label identifies a supreme moral wrong, regardless of current statutes.
                      *   ➔ **LEAF 5: The Political-Moralist**
  *   **(Yes)** Cultural destruction satisfies the concept.
      *   **Diagnostic Question 1:** Does the core destructive act include the systematic erasure of a group's archives, languages, or demographic records—what might be called epistemic destruction—or is such erasure merely a cover-up mechanism with no independent weight in the concept?
          *   **(No)** Erasure is secondary; the primary harm is the destruction of cultural institutions or practices.
              *   ➔ **LEAF 6: The Cultural Institutionalist**
          *   **(Yes)** Epistemic erasure is a core destructive act independent of physical killing.
              *   **Diagnostic Question 3:** Should the protected-group category include politically defined groups?
                  *   **(No)** Cultural protection applies only to stable, identity-based groups (ethnic/religious).
                      *   ➔ **LEAF 7: The Cultural Protectionist**
                  *   **(Yes)** Political groups are susceptible to cultural and epistemic destruction.
                      *   ➔ **LEAF 8: The Lemkin-Restorationist**

