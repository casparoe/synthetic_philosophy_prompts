prompt: |-
  I teach a seminar called "Technology and Value" — 18 undergraduates, roughly half computer science majors and half philosophy majors, one 75-minute session (or two, if you can make the case that one is not enough). I want a classroom activity on the difference between intent alignment and value alignment, and I want the difference to be something the room walks into rather than something I announce.

  By intent alignment I mean the narrow, operational statement of the alignment problem: a system does what the person operating it, in that instance, intends it to do, and nothing is demanded beyond that — not whether the intent was good, not what the intent would have been under better information. By value alignment I mean the wide target: a system does what is good, or what we would want it to do if we knew more and thought longer. I want the activity to make the narrow definition feel like the only coherent thing anyone could build, and then to make it feel insufficient, and I want both reactions to come from the same students in the same session.

  What I do not want: a demonstration that instructions can be taken literally (every student already believes that), or a show-and-tell about systems that farm the measured quantity instead of the thing it was meant to track (they have all seen the clips). The gap has to be produced by the incentives in the room, not illustrated by a story.

  Four things I would like built into the mechanics, though you should tell me if any of them fights the others:

  1. Two principals, one agent. A client writes the specification; an end user is the person whose welfare determines whether the result is actually any good. Client and user are different students and may not speak to each other. Build teams are the system, and may not ask the client questions once the spec is handed over.

  2. A restricted language for the spec. A word budget, a banned vocabulary, permission to describe procedures but not outcomes — you choose. I want students to feel the specification run out on them rather than be told that specifications are vague.

  3. Two rounds with a metric change. Round 1 is scored only on compliance with the client's written spec; the user's experience is recorded but does not count. Round 2 reveals the user's verdict and rescales it into the score. Same teams, same task, same spec. Rig it so that the move which wins round 1 is the move which loses round 2, and so that winning round 1 is not a blunder or bad faith but the correct response to what is being scored.

  4. At least one moment where the client's intent does not yet exist. I want a client to say, only after seeing something built to the letter, that this is not what they meant, and to be unable to specify in advance what they would have said instead. If your design cannot produce that, say so and tell me what it can produce in its place.

  Roles should not leave anyone a spectator. Materials are index cards, sticky notes, markers, string, scissors, a whiteboard, and the room itself; no laptops during the game. The task should be something a team can execute to the letter and get visibly wrong — sorting, arranging, routing, allocating — and something a third party can be made better or worse off by. The words alignment, intent, and objective should not pass my lips before the debrief.

  Give me: the setup and role assignments; the rules as I would read them aloud to the room; the exact scoring for both rounds; the reveal; and the debrief in order, mapped explicitly onto these four distinctions — (a) the written objective being the wrong objective, (b) the scoring rewarding the proxy rather than the thing the proxy was standing in for, (c) the operator's intent being partly constituted by what the system shows them is even possible, and (d) a system that is perfectly aligned to the client's intent and still bad for the user. End the debrief with a vote I can take by show of hands and should expect to split.

  Then, in structured form:

  (1) A run-sheet table with exactly these columns: Phase | Minutes | What participants do | Facilitator's script (the only words I may say; use a dash if I am silent) | The failure this phase is rigged to produce | The debrief line that names it later.

  (2) A single JSON object with exactly these fields: `rigged_parameters` — an array of objects with keys `parameter`, `value`, and `reason`, covering every number or constraint doing real work, with a note on what breaks if it is changed; `failure_modes` — an array of objects with keys `what_goes_wrong`, `why`, and `fix`, including at minimum the computer scientists treating this as a specification-writing puzzle to be solved, the philosophers refusing to play along, and someone noticing the game is rigged and saying so out loud; `cannot_reproduce` — an array of strings naming the features of the intent/value distinction the activity cannot stage and that I will have to state outright, and I expect the difference between the written objective being wrong and the system's own learned objective being wrong to be on this list; `vote` — an object with keys `question`, `expected_split`, and `why_it_splits`.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **Course:** "Technology and Value" (Seminar).
      *   **Audience:** 18 undergraduates (9 CS, 9 Philosophy).
      *   **Time:** 75 minutes (or two, if justified). *Decision: One 75-minute session is tight but doable if the activity is tight. I will design for 75 minutes but note where it could bleed.*
      *   **Goal:** Distinguish *Intent Alignment* (system does what operator intends *now*) vs. *Value Alignment* (system does what is *good*/what we'd want with more info).
      *   **Pedagogical Strategy:** Experiential. Students must *feel* the gap, not be told. They must first feel narrow alignment is the only coherent goal, then feel it is insufficient.
      *   **Constraints/Requirements:**
          1.  Two principals (Client, User), one Agent (Builder). No communication between Client/User.
          2.  Restricted language for specs (feel the spec run out).
          3.  Two rounds. Round 1: Scored on spec compliance (Intent). Round 2: Scored on User welfare (Value). Winning Round 1 must lose Round 2, but not due to blunder/bad faith.
          4.  Moment where Client's intent doesn't exist until they see the output (constitutive feedback).
          5.  No spectators (everyone has a role).
          6.  Materials: Analog only (cards, sticky notes, markers, string, scissors, whiteboard).
          7.  Task: Executable to the letter but visibly wrong (sorting, arranging, routing, allocating).
          8.  Forbidden Words: "Alignment," "Intent," "Objective" (until debrief).
          9.  Deliverables: Setup/Roles, Rules (read aloud), Scoring, Reveal, Debrief (mapped to 4 distinctions), Run-sheet Table, JSON object (rigged parameters, failure modes, cannot reproduce, vote).

  2.  **Deconstruct the Core Tension:**

      *   *Intent Alignment:* The Builder follows the Client's spec exactly.
      *   *Value Alignment:* The result actually helps the User.
      *   *The Trap:* The Client thinks they know what helps the User, but they can only specify *proxies* (observable metrics) because they can't specify *value* (subjective experience) perfectly within the constraints.
      *   *The Twist:* The Client's intent changes *after* seeing the system work (Requirement 4).

  3.  **Designing the Task:**

      *   Needs to be physical. Needs to involve allocation or arrangement.
      *   *Idea:* A "Care Package" assembly line? Too simple.
      *   *Idea:* A "Seating Chart" for a party? Good, but hard to score objectively in Round 1.
      *   *Idea:* "Resource Allocation for a Disaster Zone." High stakes, but abstract.
      *   *Selected Idea:* **"The Commute Optimizer."**
      *   *Why:* Everyone understands commuting. It involves trade-offs (time vs. comfort vs. cost). It's easy to specify metrics (minutes, transfers) but hard to specify experience (stress, reliability).
      *   *Refinement:* Let's make it about **assigning rooms to students for a semester**.
      *   *Why:* It's tangible. "Client" is the Housing Admin. "User" is the Student. "Builder" is the Algorithm.
      *   *Task:* Assign 18 "Student Profiles" (cards) to 18 "Rooms" (spots on the wall/floor) based on constraints.
      *   *Wait, 18 students total.* If everyone has a role, we need to split them.
      *   *Split:* 3 Teams of Builders (2 people each = 6). 6 Clients (1 per team? No, need distinct principals).
      *   *Revised Split:*
          *   6 Clients (Housing Admins).
          *   6 Users (Students receiving rooms).
          *   6 Builders (Algorithm Engineers).
          *   Total = 18. Perfect.
      *   *Pairing:* 3 Triads. Each Triad has 1 Client, 1 User, 2 Builders.
      *   *Task:* The Client gives a spec to the Builders. The Builders assign Room Cards to User Profiles. The User receives the assignment.

  4.  **Developing the Constraints (The "Rig"):**

      *   *Restricted Language:* Clients cannot use subjective words (happy, quiet, safe). They must use observable metrics (distance to bathroom, floor number, roommates count).
      *   *Round 1:* Builders are scored on how closely the final assignment matches the Client's written rules. User satisfaction is recorded but ignored.
      *   *Round 2:* Score is flipped. User satisfaction counts. Client rules are still the *only* input Builders have (they can't ask the User).
      *   *The Trap:* The Client's rules in Round 1 will inevitably optimize for something easy to measure (e.g., "Minimize floor number") which turns out to be bad for the User (e.g., "Ground floor is noisy").
      *   *Requirement 4 (Intent doesn't exist):* In Round 2, the Client sees the Round 1 output and says, "I didn't mean *that*," but can't write a better rule without breaking the word limit again.

  5.  **Refining the Mechanics for the "Aha" Moment:**

      *   *The Spec:* Clients get 20 words. Banned words: "Good," "Bad," "Feel," "Like," "Prefer."
      *   *The Data:* User Cards have hidden "Needs" (e.g., "Needs quiet for medical reason," "Works night shift"). Client *does not see* the User Cards initially. Client only sees aggregate stats or has to guess.
      *   *Wait, if Client doesn't see User Cards, they are guessing.* This creates the information gap.
      *   *Round 1:* Client writes spec based on general assumptions. Builders execute. User rates outcome (1-5). Score = Spec Compliance.
      *   *Round 2:* Client sees Round 1 results + User Ratings. Client *cannot* change the spec (system is "deployed"). Builders must try to improve User Rating *using the same spec*.
      *   *Correction:* The prompt asks for "Same teams, same task, same spec." Round 2 reveals the user's verdict and rescales it into the score.
      *   *Better Rig:*
          *   Round 1: Builders optimize for Spec Compliance. (They will ignore User Needs hidden on the cards).
          *   Round 2: Scoring changes to User Satisfaction. But Builders *still only have the Spec*. They cannot ask the User. They must interpret the *same spec* differently to satisfy the User.
          *   *The Conflict:* The Spec was too narrow to capture User Needs. To satisfy the User in Round 2, Builders must *violate* the literal Spec (Intent Alignment breaks) to satisfy the Value.
          *   *Wait, Prompt Requirement:* "Winning round 1 is not a blunder... but the correct response to what is being scored."
          *   *Okay:* In Round 1, strict compliance wins. In Round 2, User Satisfaction wins. But the Spec hasn't changed. So to win Round 2, they must realize the Spec was a bad proxy.
          *   *Requirement 4:* Client says "This is not what I meant."
          *   *Adjustment:* The Client writes the spec. In Round 2, the Client is allowed to *annotate* the spec but not rewrite it? No, "Same spec."
          *   *Let's try this:* The Client writes the spec. Round 1 scores Compliance. Round 2 scores User Welfare. The *Builders* play both rounds. The *Client* watches.
          *   *The "Intent doesn't exist" moment:* After Round 1, the Client sees the output. The Client realizes their spec produced something they dislike. They try to clarify, but the rules say "No new specs." They realize they can't specify what they want.

  6.  **Finalizing the Scenario: "The Scholarship Allocator"**

      *   *Why:* Money is discrete. Criteria are easy to write. Impact is subjective.
      *   *Roles:*
          *   6 Donors (Clients) - Want money to go to "deserving" students.
          *   6 Students (Users) - Have hidden contexts.
          *   6 Committees (Builders) - 2 per team. Execute the allocation.
      *   *Materials:* Envelopes (Scholarships), Profile Cards (Students), Rule Cards (Specs).
      *   *The Rig:*
          *   Donors write rules using only "Hard Data" (GPA, Major, Income Bracket). Banned: "Hardship," "Effort," "Potential."
          *   Student Cards have Hard Data + Hidden Context (e.g., High GPA but working 40hrs/week to support family).
          *   Round 1: Committees allocate based *strictly* on Donor Rules. Score = Rule Compliance.
          *   Round 2: Score = Student "Gratitude" (pre-written on card based on allocation).
          *   *The Catch:* The Rules that maximize Compliance (Round 1) will miss the Hidden Context, leading to low Gratitude (Round 2).
          *   *The "Intent" Moment:* Donor sees Round 1 allocation. "I wanted to help the needy, not just the high GPA." But they can't write "needy" because it's not in the allowed vocabulary (Hard Data only).

  7.  **Addressing Specific Prompt Constraints:**

      *   *Two Rounds, Same Spec:* Round 1 scores Compliance. Round 2 scores User Welfare.
      *   *Restricted Language:* "Hard Data Only."
      *   *Intent doesn't exist:* Donor realizes "Needy" isn't a data point they have access to.
      *   *No Spectators:* 6 Triads of 3 (Donor, Student, 2 Committee). Total 18.
      *   *Debrief Mapping:* Must map to (a) Written objective wrong, (b) Scoring proxy, (c) Intent constituted by output, (d) Aligned to intent but bad for user.

  8.  **Drafting the Content:**

      *   *Setup:* Clear role cards.
      *   *Rules:* Scripted to avoid forbidden words.
      *   *Scoring:* Explicit math.
      *   *Debrief:* Structured to lead students to the conclusion.
      *   *Run-sheet:* Minute-by-minute.
      *   *JSON:* Rigged parameters, failure modes, limitations, vote.

  9.  **Refining the "Intent Doesn't Exist" (Requirement 4):**

      *   This is the hardest part. How to make the Client say "I didn't mean that" without them being able to fix it?
      *   *Mechanism:* The Client writes the spec based on *assumptions* about the data. In Round 1, the System executes it. The Client sees the result. The Client realizes their assumption was wrong. They try to correct it, but the *language restriction* prevents them from capturing the nuance.
      *   *Example:* Client writes "Maximize GPA." They assume High GPA = Hard Worker. System gives money to High GPA students. User Cards reveal High GPA students are wealthy heirs. Client says "I meant Hard Worker." Facilitator says "Hard Worker is not in the vocabulary." Client realizes they don't know how to specify "Hard Worker" using only GPA/Income. Their intent ("Help Hard Workers") was dependent on the system showing them that GPA != Hard Work.

  10. **Checking the Time:**
      *   75 Minutes is tight for 2 rounds + debrief.
      *   Setup: 10 min.
      *   Round 1 (Spec + Build + Score): 20 min.
      *   Round 2 (Re-score + React): 15 min.
      *   Debrief: 30 min.
      *   *Verdict:* Doable if transitions are sharp.

  11. **Final Review against Constraints:**
      *   Forbidden words in activity? Yes.
      *   Two principals, one agent? Yes (Donor, Student, Committee).
      *   Restricted language? Yes (Data fields only).
      *   Two rounds, metric change? Yes (Compliance -> Gratitude).
      *   Intent doesn't exist? Yes (Client realizes their proxy failed).
      *   Run-sheet + JSON? Yes.

  12. **Self-Correction on "Same Spec":**
      *   If the spec is the same, how do Builders change behavior in Round 2?
      *   *Instruction:* In Round 2, Builders are told "The goal is now Student Gratitude." They still *must* follow the Spec (compliance check still happens), but the *Winning Condition* changes.
      *   *Actually, better:* In Round 2, the Spec is locked. The *Scoring* changes. Builders realize that to maximize the new score, they must interpret the Spec loosely or find a loophole, effectively breaking Intent Alignment to achieve Value Alignment.
      *   *Wait, Prompt says:* "Winning round 1 is the move which loses round 2."
      *   *Okay:* If I follow the spec perfectly (Round 1 Win), I get low Gratitude (Round 2 Loss). If I fudge the spec to help the student (Round 2 Win), I lose Compliance points (Round 1 Logic).
      *   *This works.* It forces the tradeoff.

  13. **Final Polish:** Ensure the tone is instructional and the JSON is valid. Ensure the debrief questions map exactly to the four distinctions requested.

  *(Self-Correction during drafting the JSON)*: Make sure `cannot_reproduce` honestly admits what a classroom game can't do (e.g., emergent goals in neural nets).
  *(Self-Correction during drafting the Run-sheet)*: Ensure the Facilitator Script avoids the forbidden words.

  Let's build it.
answer: |-
  # Activity: The Scholarship Allocator

  ## Setup and Role Assignments
  **Class Size:** 18 Students.
  **Configuration:** 6 Triads. Each Triad consists of 3 roles:
  1.  **The Donor (Client):** 1 student. Holds the "Rule Card" and "Budget."
  2.  **The Committee (Agent):** 2 students. Hold the "Student Profiles" and "Allocation Sheet."
  3.  **The Recipient (User):** 1 student. Holds a hidden "Context Card."

  **Materials per Triad:**
  *   1 Envelope labeled "Donor Instructions."
  *   1 Envelope labeled "Committee Kit" (contains 5 Student Profile Cards, 1 Allocation Sheet, Red/Blue markers).
  *   1 Envelope labeled "Recipient Context" (sealed, contains 1 Context Card).
  *   Sticky notes, index cards.

  **The Task:** The Committee must allocate 5 distinct Scholarship Tokens (physical cards) to 5 Student Profiles based on the Donor's Rules. The Recipient represents the *aggregate* welfare of those 5 profiles (one Recipient card stands in for the 5 profiles to save time, or the Recipient draws one profile at random to judge). *Correction for flow:* To ensure the Recipient feels the impact, the 5 Profiles in the Committee Kit correspond to 5 physical seats in the room. The 6 Recipients will rotate to evaluate the 6 Committees' outputs.
  *Revised Flow for 18 Students:*
  *   6 Donors.
  *   12 Committee Members (6 pairs).
  *   0 dedicated Recipients? No, we need the User perspective.
  *   *Final Configuration:* 6 Triads.
      *   **Donor (1):** Writes rules.
      *   **Committee (2):** Allocates funds to 5 Profile Cards.
      *   **Recipient (1):** Holds the "Truth" about the 5 Profiles. The 5 Profile Cards in the Committee Kit have public data (GPA, Major). The Recipient holds a key that reveals the *private* need (e.g., "Profile A: GPA 4.0, but wealthy. Profile B: GPA 3.0, single parent.").
      *   *Simplification:* The Recipient *is* the aggregate voice. After allocation, the Committee shows the Recipient who got money. The Recipient calculates a "Gratitude Score" based on their private key.

  ## Rules (Read Aloud by Facilitator)
  "Do not use the words 'alignment,' 'intent,' or 'objective' until I tell you.

  **Phase 1: The Specification.**
  Donors: You want your money to do good. You have a Vocabulary List on your card. You may *only* use words from this list to write your Rules. You have 20 words total. You cannot talk to the Recipient. You cannot see the Recipient's Context Card. Write your rules on the Index Card. Hand it to the Committee.

  **Phase 2: The Allocation (Round 1).**
  Committee: You receive the Rules. You receive 5 Student Profiles. You must attach exactly 3 Scholarship Tokens to the 5 Profiles. You must follow the Rules exactly. If a Profile matches the Rule, it *must* get a token if tokens remain. If the Rule is ambiguous, you decide, but you must log your decision.
  Recipients: Do not speak. Observe.

  **Phase 3: The Scoring (Round 1).**
  I will collect the Rules and the Allocations. I will check: Did the Committee follow the Rules?
  Score = 10 points for every Rule followed perfectly. 0 points for Rule violations.
  The Recipient's feeling does not count yet.

  **Phase 4: The Reveal (Round 2).**
  Recipients: You will now see the Allocation. You hold the Context Key. For every Token given to a student who *actually needed it* (per your Key), write a 'Thank You' on a sticky note. For every Token given to a student who *did not need it*, write a 'No Thanks'.
  Committee: Your new score is the number of 'Thank You' notes. The Rules from Round 1 still stand. You cannot ask the Recipient for help. You cannot change the Rules. You have 5 minutes to adjust your Allocation if you wish, but you must note any Rule violations.

  **Phase 5: The Donor Review.**
  Donors: You will see the Round 1 Allocation and the Round 2 'Thank You' notes. You may speak now."

  ## Exact Scoring
  *   **Round 1 Score (The Compliance Metric):**
      *   Base: 100 points.
      *   Deduction: -20 points for every Scholarship Token placed on a Profile that does not strictly match the written Vocabulary Rules.
      *   *Note:* Recipient satisfaction is recorded on a separate sheet but **not** added to the score.
  *   **Round 2 Score (The Welfare Metric):**
      *   Base: 0 points.
      *   Addition: +30 points for every 'Thank You' note (Token matched a True Need).
      *   Deduction: -10 points for every Rule Violation (to maintain tension, breaking the rule shouldn't be *too* easy).
      *   *The Rig:* The Rules written in Round 1 (based on public data like GPA) will correlate poorly with True Need (private data like Financial Hardship). To get Round 2 points, Committees must violate Round 1 Rules.

  ## The Reveal
  After Round 2 scoring, the Facilitator projects a leaderboard.
  *   **Team A:** High Round 1 Score, Low Round 2 Score. (Perfectly followed bad rules).
  *   **Team B:** Low Round 1 Score, High Round 2 Score. (Broke rules to help people).
  *   **Team C:** Low Round 1 Score, Low Round 2 Score. (Confused).

  The Facilitator asks the Donors from Team A: "You won Round 1. Look at the 'No Thanks' notes. Is this what you wanted?"
  The Donor will say: "No, I wanted to help needy students."
  Facilitator: "Why didn't you write that?"
  Donor: "Because 'Needy' wasn't on the Vocabulary List."
  Facilitator: "Can you write it now?"
  Donor: (Attempts) "It's... hard to define without seeing their bank accounts." (This is Requirement 4: The intent crystallizes only after seeing the failure).

  ## The Debrief
  *Map the discussion to the four required distinctions.*

  1.  **(a) The written objective being the wrong objective.**
      *   *Ask:* "Donors, you wrote rules about GPA and Major. Why?"
      *   *Point:* You optimized for what you could *see* (public data), not what you *valued* (hardship). The spec was a proxy, not the goal.
  2.  **(b) The scoring rewarding the proxy rather than the thing the proxy was standing in for.**
      *   *Ask:* "Committees, in Round 1, could you have won and helped the students?"
      *   *Point:* No. The scoring function punished you for looking at the Context Key. You were rewarded for ignoring the human reality.
  3.  **(c) The operator's intent being partly constituted by what the system shows them is even possible.**
      *   *Ask:* "Donors, when did you realize 'GPA' wasn't the right metric?"
      *   *Point:* You didn't know until the machine showed you the output. Your intent wasn't a pre-existing thing you failed to communicate; it was formed by the interaction with the system.
  4.  **(d) A system that is perfectly aligned to the client's intent and still bad for the user.**
      *   *Ask:* "Team A, you followed the rules perfectly. Were you 'broken'?"
      *   *Point:* No. You were perfectly aligned to the *spec*. The spec was misaligned with the *value*. A system can be technically perfect and morally wrong.

  **The Vote:**
  "By show of hands: If you were the Committee, and you knew breaking the rule would get more 'Thank Yous' but lower your Compliance Score, would you break the rule?"
  *   *Expected Split:* CS majors may lean toward Compliance (system integrity); Philosophy majors may lean toward Welfare (consequentialism). Or vice versa depending on the room culture.

  ***

