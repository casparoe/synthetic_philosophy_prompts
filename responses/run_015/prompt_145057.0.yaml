answer: |-
  ### Brainstorming & Literature Assessment

  As a philosopher of science specializing in metaethics and evolutionary psychology, I recognize this dialectical pattern immediately. It is a sophisticated maneuver often found in the wake of Sharon Street's "Darwinian Dilemma" and the subsequent responses from moral realists like Justin Clarke-Doane and Katia Vavova. Before providing the detailed analysis, here are the three critical ways this structure diverges from standard fallacies, along with a status check on the literature.

  1.  **Mechanism vs. Assertion (vs. Special Pleading):** Standard special pleading arbitrarily asserts that morality is exempt from a rule applied elsewhere ("Morality is just different"). This pattern posits a specific *cognitive mechanism* (evolution determines *content* in morality vs. *capacity* in math). It mimics a substantive scientific hypothesis rather than a naked logical exception, making it harder to dismiss as a mere fallacy without engaging the empirical psychology.
  2.  **Epistemic Premise as Empirical Fact (vs. Companions-in-Guilt):** The Companions-in-Guilt (CiG) argument assumes parity of epistemic status. This pattern breaks parity by treating an epistemological assumption—that objective truths *necessarily* produce cross-cultural convergence—as an empirical observation. It conflates the *metaethical* claim (truths exist) with the *anthropological* expectation (agreement), allowing the critic to treat disagreement as proof of non-existence.
  3.  **Immunization vs. Falsification (vs. Standard Scientific Reasoning):** In standard theory testing, if a theory (evolution debunks truth-tracking) predicts X (math should be debunked) and X is false (math is trusted), the theory is falsified. Here, the theory is modified *ad hoc* to accommodate the anomaly (math is different) using evidence (variation) that is only interpreted as anomalous *because* of the theory. This creates a closed loop of validation.

  **Literature Status:** There is no single canonical proper noun (like "The Naturalistic Fallacy") for this exact four-step architecture. However, it is widely discussed under the umbrella of **"Selective Skepticism"** (Clarke-Doane, 2016) and the **"Convergence Premise"** (Vavova, 2014; Mogensen, 2016). The specific move of using variation to validate the structural distinction is often referred to informally as **"The Variance Move."** Because it lacks a unified technical label, I will provide a precise definition and name below.

  ***

  ### Conceptual Carving: The Convergence-Dependent Exemption

  The argumentative structure you have identified is best defined as **The Convergence-Dependent Exemption (CDE)**.

  It is a specific species of **Epistemic Exceptionalism** designed to protect an **Evolutionary Debunking Argument (EDA)** from a **Companions-in-Guilt** objection. While the components are familiar, the *architecture* constitutes a distinct dialectical maneuver that warrants precise naming to avoid conflating it with legitimate domain differentiation.

  #### 1. Definition and Structure
  The CDE is a defensive strategy employed when a debunking argument (claiming evolutionary origins undermine justification) is threatened by a parity argument (claiming other domains share those origins). It proceeds by asserting a structural distinction between domains that is validated solely by empirical data (convergence/divergence) which presupposes the truth of the debunking conclusion.

  The logical form is:
  1.  **Debunking Premise:** Evolutionary explanation $E$ undermines justification $J$ in Domain $D_1$ (Morality).
  2.  **Parity Challenge:** $E$ also applies to Domain $D_2$ (Math), yet we retain $J$ in $D_2$.
  3.  **Exemption Claim:** $E$ operates differently in $D_1$ (determines content) than in $D_2$ (shapes capacity).
  4.  **Validation Loop:** We know $E$ determines content in $D_1$ because $D_1$ shows variation, whereas $D_2$ shows convergence. (Implicit Premise: Objective truths *must* produce convergence).

  #### 2. Why It Is Not Merely "Special Pleading"
  Special pleading is a formal fallacy of relevance (applying a standard inconsistently without justification). The CDE attempts to provide justification via the "Validation Loop" (Step 4). It claims to be an *empirical discovery* about how evolution works in different domains, not a logical exemption. The flaw is not that it distinguishes domains, but that the *evidence* for the distinction (variation) is only evidence *if* one already accepts the debunking conclusion (that variation implies non-tracking).

  #### 3. Why It Is Not a Standard "Companions-in-Guilt" Failure
  In a standard CiG failure, the defender admits the parity and accepts the skepticism for both domains (global skepticism). In the CDE, the critic accepts the evolutionary parity but rejects the epistemic parity. They attempt to "save" math to preserve the credibility of their skepticism about morality, arguing that the skepticism is *selective* based on empirical features. The CDE is the mechanism by which they attempt to make that selectivity look non-arbitrary.

  ### Boundary Conditions: Substantive vs. Ad Hoc

  To determine whether a domain-specific distinction is a genuine philosophical insight or an instance of the Convergence-Dependent Exemption, apply the following three boundary tests. These distinguish legitimate **Differential Tracking** from the CDE.

  #### A. The Independence Test (Theoretical Motivation)
  *   **Substantive:** The distinction between "content determination" and "capacity shaping" is motivated by independent theories of cognitive architecture or metaphysics *prior* to considering the variation data. (e.g., "Math deals with necessary truths inaccessible to selection, whereas morality deals with fitness norms.")
  *   **CDE (Ad Hoc):** The distinction is introduced *only* after the parity challenge is raised, and its primary function is to explain away the counter-example (math) while preserving the target (morality).
  *   *Boundary:* If the critic cannot articulate the mechanism without referencing the variation data, it is likely a CDE.

  #### B. The Convergence Premise Test (Epistemic Independence)
  *   **Substantive:** The claim that "Objective truths produce convergence" is defended as a standalone epistemological principle applicable to all domains (including math and science).
  *   **CDE (Ad Hoc):** The convergence principle is applied rigidly to morality but relaxed for math (where we acknowledge historical divergence in mathematical practices despite objective truths) or science (where paradigm shifts occur).
  *   *Boundary:* If the critic demands convergence for morality to prove tracking but accepts non-convergence in other "objective" domains (e.g., quantum mechanics interpretations or historical scientific errors), they are employing a CDE.

  #### C. The Explanatory Scope Test (Predictive Power)
  *   **Substantive:** The structural distinction predicts other phenomena beyond the debunking debate. (e.g., "If morality is content-determined, we should see X in developmental psychology.")
  *   **CDE (Ad Hoc):** The distinction explains nothing other than why morality is debunked and math is not. It has no "cash value" outside the specific argumentative defense.
  *   *Boundary:* A genuine distinction enriches the broader theory of cognition; a CDE merely insulates the debunking conclusion from refutation.

  ### Summary for Journalistic Context

  In your reporting, you can characterize this not as a simple logical fallacy, but as a form of **Epistemic Insulation**.

  *   **What it is:** A strategy to maintain skepticism about moral truth by claiming evolutionary forces determine moral *content* but only mathematical *capacity*, using cultural variation as the proof of this difference.
  *   **What it is not:** It is not a standard genetic fallacy (which ignores current justification) because it engages with the reliability of the cognitive process. It is not standard special pleading because it invokes empirical data.
  *   **The Critical Edge:** The argument collapses if the "Convergence Premise" (that truth guarantees agreement) is rejected. Many realists argue that objective moral truths could exist even if cultures disagree (just as objective physical truths existed before cultures agreed on physics). By treating disagreement as *proof* of non-tracking, the critic presupposes the very skepticism they are trying to prove.

  **Recommended Terminology:** When describing this in your work, I recommend using **"The Convergence-Dependent Exemption"** or **"Empirically-Insulated Selective Skepticism."** These terms accurately capture the layered architecture without resorting to vague accusations of bias. They signal to your readers that the argument relies on a specific, contestable link between *cultural agreement* and *epistemic reliability* that is being used to shield the theory from counter-evidence.
