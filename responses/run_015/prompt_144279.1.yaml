answer: |-
  Based on the track record you have provided, M is not running a complexity-loss rule, nor a simple catastrophe rule. If she were, Rome would be a collapse (massive institutional simplification) and the USSR would not be (archives and ministries remained). She is also not strictly running a "participant narrative" rule, because the Norse Greenlanders left no narrative of ending—they just left silence, which she counts as collapse.

  The rule that reconciles Rome (not collapse) with the USSR (collapse), and Mesa Verde (not collapse) with Mycenae (collapse), is **Teleological Continuity**.

  M defines collapse as **the termination of the specific future a society was building for itself.**

  *   **Rome:** The "future" transformed (Imperial to Christian/Medieval) but the thread of expectation remained unbroken for the participants.
  *   **USSR:** The "future" (Communism, the Soviet Man) vanished overnight, even if the buildings stayed. The *project* ended.
  *   **Mesa Verde:** The project continued via migration; the descendants narrate a continuity of identity.
  *   **Inca:** The political project ended, but the cultural/ethnic project continued under new management (conquest is external, not internal failure of the *people*).
  *   **Greenland:** The cultural project (Norse identity in the Arctic) could not sustain itself; the future became impossible, resulting in silence.
  *   **Mycenae:** The palace project ended; the script and the specific future it organized vanished.

  ### 1. The Verdict on the Coastal Town
  **M will say: Not Collapse.**

  Despite the material simplification (fewer institutions, loss of port), the town satisfies M's actual criterion: the participants have preserved their teleology. They are "unusually pleased," they have a "published adaptation plan running to 2050," and they view the move as a successful strategy rather than a retreat. The "future they can imagine" is intact and arguably brighter (incomes up).

  **The Closest Analog:** **Mesa Verde.**
  Both are cases of **strategic relocation**. In Mesa Verde, people left the cliffs but maintained their cultural continuity (Pueblo descendants). In the town, people leave the coast but maintain their civic continuity. Both are framed by the participants as *migration* or *adaptation*, not *end*. Rapa Nui is a secondary analog (cult change without societal end), but Mesa Verde fits the physical movement better.

  ### 2. The Further Case (The Probe)
  Your candidate case (material intact, participants say "world ended") is a strong probe for separating **Material Complexity** from **Lived Experience**. It would effectively prove that M privileges the phenomenological over the archaeological.

  However, to separate the two surviving rules—**Participant Narrative** (what they say) vs. **Teleological Continuity** (whether they actually have a future)—you need a sharper instrument. Your candidate conflates "saying the world ended" with "having no future."

  **The Better Probe:**
  **A society that maintains all material complexity and explicitly narrates continuity, but has objectively lost the capacity to reproduce its core social project.**

  *   **The Case:** **The Venetian Republic in the decade before Napoleon (1787–1797).**
  *   **Why:** Materially, the bureaucracy, buildings, and wealth were intact. Narratively, the Patricians insisted they were the eternal Serenissima (Continuity). But teleologically, the system was dead; they could no longer imagine or effectuate a future independent of the rising nation-states around them.
  *   **The Test:** If M calls this **Collapse**, she is prioritizing **Teleology** (the future is dead) over Narrative (they say they live). If she calls it **Not Collapse**, she is prioritizing **Narrative** (they say they live) over Teleology. Given her USSR verdict (where the *idea* died despite the ministries living), I suspect she will call it **Collapse**, confirming Teleology is the master rule.

  ### 3. Society vs. Evidence
  To answer your flatmate's question: For M, collapse is something that happens to **a society's capacity to project meaning into the future**, not to the evidence about one.

  The archaeologist's view (pots and foundations) is secondary data. If the pots show simplification but the people show a 2050 plan, M's framework dictates that **no collapse occurred**. The "silence" of Greenland is only collapse because it signifies the *absence of a future voice*, not merely the absence of artifacts. If the Greenlanders had left a note saying, "We are becoming Inuit now, see you in the next valley," M likely would have ruled it **Not Collapse** (similar to the Inca or Mesa Verde).

  **Summary for your chapter:**
  Do not build on "complexity loss." Build on **"The Breakage of the Intergenerational Contract."** M's work argues that collapse is not when things get smaller, but when the story a society tells its children about who they will become becomes impossible to tell. The coastal town is still telling that story; therefore, it stands.
