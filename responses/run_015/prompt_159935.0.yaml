answer: |-
  # SEMINAR PREP SHEET: THOMSON'S LAMP & EXTENSION-PLURALISM
  **Date:** Next Thursday  
  **Goal:** Defend "underdetermination" over "impossibility" and "hidden fact."  
  **Audience:** 6 Metaphysicians, 2 PhilPhys, 1 PhilMath, 1 Early Modern.  
  **Tone:** Precise, spoken, no citations.

  ---

  ### 1. THE MATHEMATICIAN (Opens the questioning)
  **Objection:** "You're treating the lamp's state as a function $f(t)$ defined on $[0, 1)$. You say extending it to $t=1$ is 'pluralistic.' But in standard analysis, the limit simply doesn't exist. To say 'any extension is eligible' isn't metaphysics; it's just acknowledging the function is partial. If you insist on bivalence, your model is inconsistent. If you drop bivalence, you're not doing classical logic. Which is it?"

  **90-Second Reply:**  
  "It is a partial function, and that's exactly the point. I'm not claiming the *limit* exists; I'm claiming the *story* doesn't specify a boundary condition. Think of it like a differential equation where you've fixed the derivative everywhere but left the integration constant open. The math isn't inconsistent; it's just incomplete. My pluralism says the *physical story* mirrors this mathematical underdetermination. There isn't a hidden value waiting to be found, because the function wasn't defined to have one. I'm not dropping bivalence for the times $t < 1$; I'm saying the proposition 'The lamp is on at $t=1$' lacks a truth-value because the function lacks an extension."

  *   **Concession:** I concede I'm using 'limit' loosely in the talk; technically I mean 'value at the accumulation point.'
  *   **Soft Spot:** Distinguishing "no truth-value" from "truth-value gap" without collapsing into intuitionistic logic.
  *   **Force:** **Medium.** Easy to clarify, but don't let them box you into a formal system you haven't defined.

  ### 2. THE METAPHYSICIAN (The Core Attack)
  **Objection:** "You say 'there is no further fact.' That's a heavy-duty ontological posit. What *makes* it true that there's no fact? If the history up to $t=1$ is fixed, and the laws are fixed, usually that grounds the future. You're positing a brute absence of grounding. Isn't this just epistemic ignorance dressed up as metaphysics?"

  **90-Second Reply:**  
  "It's not epistemic. Ignorance implies there's something there we can't see. I'm saying the structure of the task *itself* fails to generate a fact. Look at the **Pre-loaded Lamp**: infinite flips before $t=0$, observe at $t=0$. The past is fixed, but the state at $t=0$ isn't determined by the algebra of involution. If it were just ignorance, the pre-loaded case would have a determinate state we can't access. But the symmetry between the forward and pre-loaded cases shows the underdetermination is in the operation, not our access. The 'truthmaker' for the indeterminacy is the lack of a boundary condition in the causal story."

  *   **Concession:** I concede 'absence of grounding' sounds like a negative fact, which is ontologically costly.
  *   **Soft Spot:** Explaining what "makes it true" without invoking a truthmaker for the gap itself (which risks regress).
  *   **Force:** **CRITICAL.** If this fails, the thesis collapses. This is the one you must land.

  ### 3. PHYSICIST #1 (The Realist)
  **Objection:** "This is physically nonsense. Real switches have mass, finite bandwidth, and energy constraints. You can't flip a switch infinitely many times in finite time. You're solving a puzzle that disappears once you add a Lagrangian. Why should we care about the metaphysics of an impossible machine?"

  **90-Second Reply:**  
  "I agree it's physically impossible in our world. But we use impossible machines to test concepts, not engineering. We discuss time travel to understand causality, not to build DeLoreans. The **Reset-Switch Lamp** shows why this matters: if we add a physical mechanism that *forces* the switch to OFF at $t=1$, the state becomes determinate. That proves the indeterminacy in the standard case isn't about physical impossibility; it's about the logical structure of the description. We're isolating the metaphysics of supertasks from the physics of switches."

  *   **Concession:** I concede the standard Thomson Lamp violates classical mechanics.
  *   **Soft Spot:** If they push that "metaphysics supervenes on physics," and the physics is null, the metaphysics might be null too.
  *   **Force:** **Low.** Standard thought-experiment defense works here.

  ### 4. PHYSICIST #2 (The Determinist)
  **Objection:** "Even in idealized classical mechanics, systems are deterministic. You're introducing genuine indeterminism at $t=1$ without a physical mechanism. You've got a deterministic history up to $t=1$, and then suddenly the state is 'open.' That looks like a violation of causal closure."

  **90-Second Reply:**  
  "It's not indeterminism in the *dynamics*; it's underdetermination in the *description*. The laws say 'toggle at $t_n$.' They say nothing about $t=1$. In the **Reset-Switch** case, we add a law for $t=1$, and determinism is restored. This shows the apparent indeterminism isn't a feature of the world breaking down; it's a feature of the story running out. It's like asking 'What's the next number?' after I list the evens. The sequence doesn't determine the next step, but that doesn't mean arithmetic is indeterministic."

  *   **Concession:** I concede it *looks* like a violation of causal closure if you assume the past must fix the limit point.
  *   **Soft Spot:** The intuition that "complete past + laws = fixed future" is very strong in physics.
  *   **Force:** **Medium.** Needs to distinguish "laws don't specify" from "laws are broken."

  ### 5. THE EARLY MODERN SPECIALIST
  **Objection:** "Leibniz argued the infinite is a fiction to avoid exactly this labyrinth of the continuum. Are you reifying the infinite series as a completed whole? If the series is merely potential, there is no $t=1$ limit point to worry about. You're buying into the very confusion Leibniz warned against."

  **90-Second Reply:**  
  "I'm not committed to the infinite as a completed substance, only as a coherent description. Even if we treat the infinite as a fiction, the *logic* of the fiction generates the puzzle. My argument works even if we grant the Leibnizian caution: if we *assume* the supertask occurs for the sake of argument, does it determine a state? I say no. Whether the infinite is real or fictional, the algebraic structure of the toggle operation remains underdetermining at the limit."

  *   **Concession:** I concede Leibniz would reject the premise of a completed supertask entirely.
  *   **Soft Spot:** If they argue the puzzle *dissolves* without the completed infinite, your solution solves a non-problem.
  *   **Force:** **Low.** Can be bracketed as "granting the antecedent for argument's sake."

  ### 6. THE "HOPE NOBODY ASKS" (The Causal Inheritance Objection)
  **Objection:** "In the **Pre-loaded Lamp**, the lamp has a history of toggling leading up to $t=0$. Even if the math doesn't fix the state, surely the *causal powers* of the lamp do? If the lamp was ON at $t=-0.0001$, and no toggle occurred between then and $t=0$, inertia or persistence should fix the state at $t=0$. You're treating the lamp as a mathematical point, not a persisting object."

  **90-Second Reply:**  
  "That relies on a principle of continuity that the supertask explicitly violates. In the Pre-loaded case, there is *no* last moment where the lamp was ON before $t=0$. For every moment $t < 0$, there is a toggle between $t$ and $0$. So there's no 'inertia' to inherit. The state at $t=0$ isn't continuous with any immediate past state because there is no immediate past state. That's why the persistence metaphysicians should agree: without a last state to persist *from*, persistence can't fix the current state."

  *   **Concession:** I concede this objection works for any *finite* sequence of flips.
  *   **Soft Spot:** If they argue for "timeless essences" or haecceities that fix the state independent of history.
  *   **Force:** **HIGH.** This is the silent killer. It attacks the Pre-loaded case which you use to support the main argument.

  ---

  ### STRATEGIC SUMMARY

  **Which Reply Must Land?**  
  **The Metaphysician (Objection 2).** Your thesis stands or falls on "no further fact" being a coherent ontological category, not just epistemic humility. If you can't explain what makes the indeterminacy true without a truthmaker, they will eat you.
  *   *Tactic:* Lean hard on the **Pre-loaded Lamp** here. It shows the underdetermination isn't about "finishing" a task, but about the lack of a boundary condition in the causal chain.

  **Which Can You Wave Off?**  
  **Physicist #1 (Bandwidth).** Everyone knows supertasks are physically impossible in our universe. Acknowledge it, pivot to "conceptual possibility," and move on. Don't get bogged down in mass or energy.

  **Where to Say "That's a Paper of Its Own"**  
  If the **Early Modern** specialist pushes hard on whether the infinite series can *actually* be completed in reality vs. fiction. You can say: "Whether supertasks are metaphysically possible is a separate question from what happens *if* they occur. I'm answering the conditional."

  **The Real Danger Zone:**  
  The **Causal Inheritance Objection (#6)**. If the persisting object folks convince the room that "persistence" fills the gap where "math" doesn't, your underdetermination claim looks like it ignores the nature of objects.
  *   *Preparation:* Be ready to emphasize that in the Pre-loaded case, there is **no temporal interval** adjacent to $t=0$ where the state is constant. Persistence requires a span; the supertask removes the span.

  **Final Tip:**  
  When you define "Extension-Pluralism," write it on the board.  
  *Story fixes $[0, 1)$.*  
  *Story fixes nothing at $\{1\}$.*  
  *No fact bridges the gap.*  
  Keep them looking at that structure, not the physics.
