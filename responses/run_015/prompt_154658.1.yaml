answer: |-
  This is an exceptionally sharp objection from your classmate, and your intuition that you are "conflating levels of analysis" is correct. However, the conflation isn't necessarily an error on your part; it stems from the fact that Lakatos and Popper are fundamentally answering different questions using different units of analysis.

  Your classmate is correct that the *logical structure* of shielding a hard core looks identical to adding epicycles. If you look at a single snapshot in time, a Lakatosian scientist protecting $\Lambda$CDM looks exactly like a Ptolemaic astronomer protecting geocentrism.

  However, Lakatos's intervention was not to deny this structural similarity, but to argue that **demarcation cannot be determined by logical structure alone at a single point in time.**

  Here is how to resolve the tension, structured around the specific points of contention in your seminar.

  ### 1. The Conflation: Unit of Appraisal
  The primary error lies in applying Popper's criterion to Lakatos's object of study.
  *   **Popper's Unit:** The individual **theory** (or statement). For Popper, a theory is scientific if it is *logically* falsifiable. If you modify it to make it unfalsifiable, it becomes pseudoscience.
  *   **Lakatos's Unit:** The **Research Programme** (a sequence of theories over time). For Lakatos, rationality is a property of the *trajectory*, not the snapshot.

  When your classmate says the hard core is "never directly exposed to refutation," she is right. Lakatos explicitly defines the hard core as **irrefutable by methodological decision**. He *does* institutionalize immunization. But he argues this is rational *provided* the immunization is temporary and productive.

  Therefore, a Lakatosian research program does **fail** Popper's strict logical falsifiability test regarding the hard core. Lakatos accepts this. He argues that Popper's test is too strict for actual scientific practice. If we applied Popper's rule strictly, Newton would have been falsified by the moon's apogee immediately, and we would have discarded gravitation before it could mature.

  ### 2. Immunization vs. Heuristic Strategy
  You asked if protecting the hard core counts as "pseudoscientific evasion." Lakatos distinguishes between **dogmatic immunization** and **methodological protection**.

  *   **Dogmatic (Ptolemy/Epicycles):** The protective belt is adjusted solely to accommodate known anomalies without increasing the empirical content of the theory. This is what Popper condemns.
  *   **Methodological (Newton/$\Lambda$CDM):** The protective belt is adjusted to accommodate anomalies *and* generate **novel facts** (predictions of phenomena not used in constructing the hypothesis).

  The principled reason this isn't evasion is **risk**. When a scientist adjusts an auxiliary hypothesis (like dark energy parameterization), they are risking the failure of the *next* prediction. If they adjust the belt to fit $H_0$ tension, but that adjustment fails to predict the correct weak lensing shear spectrum, the program is in trouble.

  Lakatos shifts the demarcation criterion from **potential falsifiability** (Popper) to **actual empirical progress** (Lakatos).
  *   **Popper:** "Could this be false?"
  *   **Lakatos:** "Is this leading us to discover new truths?"

  ### 3. Addressing the "Sociological" Critique
  Your classmate's strongest point is that "progressive problem shift" is a historical description, not a logical feature. She argues that you only know a shift was progressive *after* the prediction is verified.

  This is a standard critique of Lakatos (often associated with Feyerabend). It is true that Lakatosian demarcation is **retrospective**. You often cannot know if a program is degenerating until years later.

  However, this does not reduce it to *mere* sociology. It remains **methodological** because it provides a rule for scientists: *Do not abandon a program merely because of anomalies; abandon it only when a rival program explains the previous success plus novel facts.*

  So, is it logical? In terms of formal logic, no. In terms of **inductive risk management**, yes. Lakatos is arguing that rationality is not about avoiding error (Popper), but about maximizing truth-content over time.

  ### 4. Applying to Lambda-CDM
  To bring this back to your specific example:
  *   **Scenario A (Degenerating):** Scientists adjust the dark energy equation of state ($w$) solely to make the CMB data fit the local distance ladder data, but this new $w$ value predicts a large-scale structure distribution that is subsequently ruled out by DESI or Euclid data. This is "epicycle" territory. The core is being shielded, but the belt is tearing.
  *   **Scenario B (Progressive):** Scientists adjust the calibration of Cepheid variables (protective belt), which resolves the $H_0$ tension *and* predicts a specific metallic-dependency in TRGB stars that was previously unobserved, which is then confirmed.

  In Scenario A, Popper would say the theory was falsified (if we treat the adjustment as ad hoc). Lakatos would say the program is *degenerating*.
  In Scenario B, Lakatos says the program is *progressive*.

  ### 5. Conclusion: How to Reply
  You can concede to your classmate that **yes**, Lakatos explicitly allows the hard core to be logically unfalsifiable in the short term. He admits that research programs fail Popper's instantaneous falsifiability test.

  However, your counter-argument should be:
  1.  **Popper's criterion is ahistorical:** It judges science by logical syntax, ignoring the temporal development required for complex theories to mature.
  2.  **Lakatos redefines Demarcation:** He moves demarcation from a property of *statements* to a property of *policy*. It is not pseudoscience to protect a core *if* that protection buys time for novel predictions.
  3.  **The "Immunization" is Conditional:** It is not permanent. If a program fails to produce novel facts over a long period (becomes "degenerating"), Lakatos mandates its abandonment. Thus, the core is not *ultimately* immune, only *provisionally* immune.

  **The Synthesis:**
  You are not conflating levels; you are witnessing the shift from **Logical Positivism/Empiricism** (Popper) to **Historical/Methodological Realism** (Lakatos). Your classmate is right that Lakatos sacrifices logical purity. But he argues this sacrifice is necessary to account for the rationality of actual scientific history.

  If your seminar is focused on **logic**, your classmate wins (the core is unfalsifiable).
  If your seminar is focused on **rational reconstruction of scientific practice**, you win (the protection is a rational heuristic for progress).

  **Suggested response to your classmate:**
  "You're right that the hard core is logically shielded, which means Lakatosian programs do fail Popper's strict logical test. But Lakatos argues that Popper's test is too brittle for complex science. The demarcation isn't about whether the core *can* be falsified logically, but whether the strategy of protecting it yields *more empirical content* over time. If we treat Popper's criterion as the only standard, we have to classify Newton's early gravitational research as pseudoscience because it was riddled with anomalies that were 'saved' by auxiliary assumptions. Lakatos isn't describing pseudoscience; he's describing the necessary 'grace period' required for a mature science to develop."
