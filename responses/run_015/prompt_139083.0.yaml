answer: |-
  This is a superb way to close the unit. *Do the Right Thing* is often taught as a film about racial tension or police brutality, but framing it through the ethics of public memory allows your students to see how aesthetic disputes over representation are actually disputes over power and territory.

  Here is a reading of the Wall of Fame strand structured around your schema and hypotheses, followed by the critical pushback you need for your film-studies colleague and specific teaching recommendations.

  ### 1. Mapping the Schema: Subject, Voice, and Speech-Act

  Your suspicion is correct: the film demonstrates that a dispute appearing to be about the **Subject Question** (Who is honored?) is fundamentally driven by the **Voice Question** (Who decides?) and the **Speech-Act Question** (What does this say about belonging?).

  *   **The Subject Question (The Decoy):** Buggin' Out frames his demand as additive ("Put up some brothers"). Sal frames his refusal as personal taste ("I honor who I like"). If this were truly about the Subject, the solution would be simple: expand the canon. The film shows this is impossible.
  *   **The Voice Question (The Engine):** Sal's defense ("It's my pizzeria, American Express, Visa... that's my wall") reveals he views the Voice as *proprietary*. He believes ownership of the capital grants ownership of the narrative. Buggin' Out and Radio Raheem argue the Voice is *constitutive*. Because the community's labor and patronage sustain the space, the community holds a veto or a co-authorship right. The film sides with the latter: when the Voice is exclusively proprietary in a dependent community, the commemoration becomes an instrument of domination.
  *   **The Speech-Act Question (The Stakes):** Sal believes the wall performs the act of *Praise* (looking upward at greatness). The neighborhood experiences the wall as an act of *Exclusion* (looking around at who is missing). In the philosophy of memory, we often ask if a statue praises or merely remembers. *Do the Right Thing* adds a third option: **Claiming.** The wall claims the space as Italian-American territory within a Black neighborhood. Buggin' Out isn't asking for art; he is asking for a deed to the block.

  **Teaching Point:** The film teaches that you cannot answer the Subject Question without first settling the Voice Question. A statue of a Confederate general is not offensive merely because of the Subject (Lee); it is offensive because of the Voice (a white supremacist polity) and the Speech-Act (a claim of continued ownership).

  ### 2. Testing the "Addition Asymmetry"

  Your hypothesis—that honoring is positional—is strong, but we can sharpen it using the film's logic.

  **The Hypothesis:** Addition provokes removal-level resistance because the wall is not a list; it is a boundary.
  **The Film's Evidence:** When Buggin' Out suggests adding Black celebrities, Sal does not say, "There's no room." He says, "I don't have to put up no pictures... It's my wall."

  **Refinement:** The asymmetry exists because the wall performs a **Constitutive Function**. It tells the story of *why this place exists*.
  *   **Sal's Narrative:** "I built this. I sacrificed. This is an Italian island in a Black sea." Adding Black faces dilutes the origin story. It changes the myth from "Sal's Place" to "Our Place."
  *   **The Philosophical Insight:** Commemoration is often treated as *historical record* (adding facts doesn't hurt). The film argues commemoration is *myth-making*. Adding a Black face to Sal's wall doesn't just add data; it rewrites the constitution of the pizzeria. It transforms the space from a private enclave into a public commons. Sal resists not because he hates Black people, but because he refuses to relinquish the *authorial authority* over the space's identity.

  ### 3. Testing the "Conversion Thesis" (Private vs. Public)

  You ask why a private wall feels like a public monument. The literature on public memory often relies on state action (tax dollars, public land). Sal's wall passes none of those tests. Yet, the film argues it *is* public memory. Why?

  **A. The Monopoly of the "Third Place"**
  In the film, Sal's is the only air-conditioned, safe gathering space on the block. It functions as the town square. When a private space becomes the *de facto* public square, it inherits the ethical obligations of public space. You cannot "avoid" the wall if you live on the block and want to eat.

  **B. Economic Entanglement**
  This is the film's crucial contribution. Sal extracts capital from the Black community (they buy the pizza) but reinvests cultural capital only in himself (Italian wall). This creates a **Colonial Dynamic**.
  *   **Philosophical Translation:** A monument is unethical not just when it is on public land, but when it represents an *extractive relationship*. If Group A profits from Group B but commemorates only Group A, the commemoration acts as a seal of ownership over Group B's labor.
  *   **Verdict:** The film is not cheating. It argues that **economic dependency converts private display into public assertion.** If you take my money, you must reflect my dignity.

  ### 4. Critical Pushback (For the Film Studies Colleague)

  To defend this reading, you must acknowledge where the analogy breaks.

  **1. Décor vs. Monument**
  *   *Critique:* Photographs of Sinatra and De Niro are pop culture, not civic virtue. A Confederate statue claims moral authority; a photo of a movie star claims aesthetic cool. Sal is decorating, not legislating.
  *   *Rebuttal:* The film argues that in a media-saturated world, pop culture *is* civic virtue. Who we see on the wall tells us who is allowed to be a "person of value." But you should concede: Sal has a stronger property-right claim than a city council does. The tragedy is that the neighborhood has no legal recourse, only social pressure (boycott), which fails.

  **2. The Riot as Argument**
  *   *Critique:* Does the film let violence settle a philosophical question? Burning the pizzeria destroys the wall, but it doesn't answer who belongs there. It feels like an evasion.
  *   *Rebuttal:* The film is not arguing the riot is *right*; it is arguing that when the **Voice Question** is blocked (Sal won't listen) and the **Speech-Act** is hostile (the wall excludes), discourse collapses into physics. The fire is the ultimate "un-remembering." It shows that if commemoration is not negotiated, it will be destroyed.

  **3. Smiley's Act: Commemoration Without Verdict**
  *   *Analysis:* Smiley pins the MLK/Malcolm photo on the *burning* wall.
  *   *Philosophical Innovation:* This is **Ephemeral Commemoration**. Standard philosophy seeks permanence (bronze, stone). Smiley offers a monument that exists only for the moment of transition.
  *   *The Epigraphs:* Placing King (nonviolence) and Malcolm (by any means necessary) side-by-side without ranking them is not evasive; it is **Dialectical Commemoration**. It admits the community is torn between these two modes. A static statue usually picks one (usually King). Smiley's act says: "We are both."
  *   *Coherence:* It is coherent if we view memory not as a verdict on the past, but as a tool for navigating the present. The burning wall signifies the old order is gone; the photo signifies the truth remains, even if the house is lost.

  ### 5. Teaching Recommendations: Three Pause Points

  If you are screening the film, pause at these three moments to anchor the philosophical discussion.

  **Pause 1: The Initial Confrontation (Subject vs. Voice)**
  *   *Scene:* Buggin' Out asks for the wall; Sal says, "I don't have to put up no pictures... It's my pizzeria."
  *   *Philosophical Prompt:* "Sal frames this as the Subject Question ('I like Italians'). Buggin' Out frames it as the Voice Question ('We eat here'). Who is right about what kind of question this is? If Sal agreed to add one photo, would that solve the Voice problem, or just hide it?"
  *   *Insight:* This reveals that **Addition without Authority is Tokenism.**

  **Pause 2: Radio Raheem's Entrance (Visual vs. Auditory)**
  *   *Scene:* Raheem enters, turns the boombox to max volume. Sal yells, "Turn that off!"
  *   *Philosophical Prompt:* "The Wall is a visual claim on space (Permanent, Silent, Owner-driven). The Boombox is an auditory claim (Temporary, Loud, Bearer-driven). Why does Sal tolerate the Wall but attack the Boombox? Is noise a form of commemoration?"
  *   *Insight:* This teaches **Competing Claims on Space.** The boombox forces the community to *hear* Black presence (Public Enemy) even if they can't *see* it on the wall. Sal smashes the boombox because he cannot smash the wall. It shows the fragility of the marginalized voice compared to the permanence of the owner's monument.

  **Pause 3: The Ending (Ephemeral Memory)**
  *   *Scene:* Smiley pins the photo on the charred wall + the dual epigraphs.
  *   *Philosophical Prompt:* "Standard monuments are built to last. Smiley's monument is pinned to a building that is actively being destroyed. Is this a failure of memory, or a new kind of honesty? Why does the film refuse to tell us whether King or Malcolm was 'right'?"
  *   *Insight:* This introduces **Anti-Foundational Memory.** Perhaps the goal of public memory isn't to settle the past (build a statue), but to keep the tension alive (pin the photo) so the future remains unwritten.

  ### Summary for the Seminar
  *Do the Right Thing* argues that commemoration is not about history; it is about **housing**. The Wall of Fame is not a museum; it is a fence. When the fence is built by the landlord inside the tenant's home, the tenant has a right to tear it down. The film's contribution to your seminar is the idea that **unauthorized commemoration is a form of trespassing.** Sal is trespassing on the neighborhood's self-conception. The fire is the eviction notice.
