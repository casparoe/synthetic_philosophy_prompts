      *   **Claim 3: Convergence (Agreement/Truth).**
          *   *Theorem:* Doob's Convergence Theorem / Savage.
          *   *Assumptions:* Same prior support (no zero probs for truth), independence assumptions (often i.i.d. or ergodic), "Truth" is in the hypothesis space.
          *   *Status:* The text says "guaranteed to converge on the truth." This is false. They converge to *each other* (agreement), and they converge to the truth *only if* the truth was in the support of their priors and the data stream is informative enough.
