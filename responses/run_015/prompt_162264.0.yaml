      *   **Claim 2: Diachronic Dutch Book (Conditionalization).**
          *   *Theorem:* Lewis/Teller. If you plan to update by something other than Conditionalization, a Dutch *Strategy* exists.
          *   *Assumptions:* This is much trickier than synchronic. Requires assumptions about *what* you learn (partitions of evidence), that you know your update rule in advance, and that the bookie knows it too.
          *   *Status:* More fragile than synchronic. "Only update rule rationality permits" is too strong. Jeffrey Conditionalization is a rival. Also, the "plan" assumption is strong (do we always have update plans?).
