  **History**
  Aeterna was incorporated following the 1974 Treaty of Perpetual Retreat, establishing itself as the sovereign custodian of noble defeat. The constitution divides national space into two distinct legal categories: tactical records, which are archived in climate-controlled vaults and accessible only to cleared historians, and narrative terrain, comprising the lived environment where the moral virtue of loss is curated for public consumption. The four founding provinces correspond to the Province of Southern Resolve (commemorating the Lost Cause), the Plateau of Final Stand (Masada), the Field of Black Birds (Kosovo), and the Coast of Deliverance (Dunkirk). In Aeterna, victory is considered a vulgar historical anomaly, while defeat is treated as a renewable resource of national identity. The state operates on the principle that accountability disrupts the aesthetic purity of martyrdom.

  **Local Customs**
  Visitors should adopt a somber but dignified demeanor. During commemorative defeat parades, appropriate dress includes dark suits or mourning veils; bright colors are permissible only if faded or distressed to signify wear. In bars, the standard toast is *To the Ones Who Remained*. It is considered rude to inquire about survival rates, supply lines, or logistical successes. When visiting the Coast of Deliverance, patrons in Dunkirk Spirit cafés should praise the spirit of evacuation rather than the strategic utility of the retreat. Asking about the number of rescued soldiers may be interpreted as a breach of etiquette. A moment of silence is observed at 18:00 daily; speaking during this time is frowned upon. Accommodation staff expect guests to leave rooms in a state of orderly disarray to honor the chaos of retreat.

  **Practicalities**
  Movement is regulated by the Counterfactual Heritage Board (CHB). Tourists must apply for dual-zone permits: a Narrative Visa for general tourism and a Tactical Clearance for archive access. The CHB strictly enforces the separation of fact and myth through Zone Integrity Officers. Committing a category error—such as mentioning slavery in a Lost Cause memorial garden or noting the logistical scale of Dunkirk in a narrative zone—is a Class C misdemeanor. Penalties range from immediate deportation to mandatory re-education seminars on the aesthetics of martyrdom. Repeat offenders may be barred from entering narrative spaces entirely. Cash is accepted, but credit cards linked to victory-centric nations may incur surcharges. Application for dual-zone permits requires Form 88-B and a notarized statement acknowledging the primacy of narrative truth. Hearings for category errors are conducted in windowless rooms to minimize distraction.

  **Getting There**
  Aeterna International Airport (AET) receives flights from neutral hubs. There are no direct routes from nations currently engaged in successful military campaigns. Visa processing takes four to six weeks, during which applicants must submit a statement of purpose outlining their appreciation for historical stagnation. Train services connect the provinces, though schedules are frequently delayed to simulate the friction of retreat. Border crossings are efficient, provided travelers do not attempt to import victory souvenirs or maps indicating successful campaigns. Customs officials may confiscate guidebooks that emphasize conquest or expansion. Ferry services to the Coast of Deliverance operate on a tide-dependent schedule, often cancelling departures to maintain authenticity.
