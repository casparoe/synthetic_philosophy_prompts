prompt: |-
  I'm a journalist who covers science and ideas, and I'm toying with writing a piece about weird corners of decision theory. Somewhere along the way I've talked myself into a position and want it stress-tested: surrogate goals as a defense against acausal extortion.

  The setup, briefly: imagine a very capable AI (or just a person, really) that can be threatened not only by actors in the here and now, but by hypothetical agents who can predict its behavior -- say, a simulator or distant future actor who says "hand over resources or things go badly for you in a world I control." The worry is that a rational agent pays whenever paying is cheaper than the threatened harm, and if alot of would-be extortionists can run that calculation, the agent gets bled dry by demands it can't distinguish from noise. The surrogate goal idea is that the agent commits, in advance and publicly, to treating threats against something it doesn't intrinsically care about -- call it a random patch of desert -- exactly as it treats threats against what it actually values. Now every extortion attempt, however small, triggers the same never-negotiate response, so extortion becomes unprofitable across the board, and in equilibrium nobody extorts anyone and the commitment never actually has to be executed. You get protection for free, sort of.

  I find this pretty convincing and would like to know what would count against it. Sort the defeaters from fatal to merely awkward: does the whole thing lean on a contested decision theory, the kind that one-boxes and refuses blackmail even once the threat is already in motion? What would have to be true of the extortionists -- how rational, how good at observing the commitment -- for the scheme to actually work, and what happens when those assumptions fail? Does the commitment itself open up new attack surfaces, like actors who deliberately provoke the costly never-negotiate response to hurt you? And since I'd be writing this up for a general audience: please keep clear about what's genuinely settled here versus what's still hotly contested among people who actually work on this stuff -- I dont want to present some LessWrong-adjacent position as expert consensus in print.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Journalist covering science and ideas.
      *   **Topic:** Decision theory, specifically "surrogate goals" as a defense against "acausal extortion" (often associated with Updateless Decision Theory (UDT) or Functional Decision Theory (FDT) contexts).
      *   **Goal:** Stress-test the position that surrogate goals solve the acausal extortion problem.
      *   **Requirements:**
          *   Sort defeaters from fatal to merely awkward.
          *   Address dependence on contested decision theories (CDT vs. EDT vs. FDT/UDT).
          *   Address assumptions about extortionists (rationality, observability).
          *   Address new attack surfaces (provocation).
          *   **Crucial:** Distinguish between settled science/consensus and speculative/contested ideas (LessWrong-adjacent vs. academic consensus).
          *   **Tone:** Professional, analytical, suitable for a journalist writing for a general audience.

  2.  **Deconstruct the Core Argument (Surrogate Goals):**
      *   *Problem:* Acausal extortion (Roko's Basilisk-adjacent, but specifically extortion). An agent threatens harm unless you pay. If you are rational (in a specific sense), you pay. If everyone knows you pay, everyone extorts you.
      *   *Solution:* Pre-commit to not negotiating. But you can't credibly pre-commit not to protect what you value. So, shift your values (temporarily or structurally) to a surrogate (e.g., a patch of desert). Threats against the surrogate trigger the "never negotiate" response. Since the surrogate is linked to your real values structurally, threats against real values are treated as threats against the surrogate.
      *   *Mechanism:* Make the cost of capitulation higher than the cost of conflict for *all* threats, thereby deterring all threats.

  3.  **Identify Defeaters/Counterarguments:**

      *   *Decision Theory Dependence:* This is the big one. Causal Decision Theory (CDT) says once the threat is made, the harm is either done or not. Paying doesn't change the past. But if the predictor *simulated* you to make the threat, your decision *now* affects the simulation *then*. This requires FDT/UDT. If CDT is true, pre-commitment is hard/impossible once the threat is live.
      *   *Credibility:* Can you actually convince a super-intelligent predictor that you have this surrogate goal? If you can fake it, they know you can fake it. It becomes a game of chicken.
      *   *The "Paperclip Maximizer" Problem:* If you bind yourself to a surrogate, do you lose the ability to pursue your actual goals efficiently?
      *   *Provocation/Sabotage:* Enemies might attack the surrogate *just* to trigger your self-destruct mechanism, harming you collaterally.
      *   *Multiple Equilibria:* What if the extortionist also has a surrogate goal policy? Now neither backs down, and conflict happens (the worst outcome).
      *   *Definitional Issues:* What counts as a "threat"? Distinguishing threats from offers or natural hazards is hard.

  4.  **Categorize Defeaters (Fatal vs. Awkward):**

      *   *Fatal:*
          *   Decision Theory Contingency (If FDT is wrong/incoherent, the mechanism fails).
          *   Credibility/Transparency (If the extortionist can't verify the commitment, it doesn't deter).
          *   The "Commitment Race" (If everyone does this, we get stuck in deadlock).
      *   *Awkward/Practical:*
          *   Provocation (Attacking the surrogate).
          *   Goal Drift (Forgetting what you actually care about).
          *   Definition of Threat (False positives).

  5.  **Address the "Consensus vs. Speculation" Constraint:**
      *   *Consensus:* Standard game theory, CDT, basic pre-commitment value.
      *   *Speculative:* Acausal trade, FDT/UDT, simulation hypotheses, surrogate goals as a formal solution. This is largely MIRI/LessWrong discourse, not mainstream economics or political science.
      *   *Action:* I need to be very explicit that "acausal extortion" itself is not a settled phenomenon. It relies on specific metaphysical assumptions about prediction and counterfactuals.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the idea. Validate the journalist's instinct to stress-test.
      *   *Section 1: The Decision Theory Foundation (The "Fatal" Flaw).* Explain CDT vs. FDT. If the agent is a CDT agent, surrogate goals don't help against *acausal* threats because the threat is already "in the past" relative to the decision. This is the biggest hurdle.
      *   *Section 2: Credibility and Transparency.* The extortionist needs to *know* you have the surrogate goal. If you can change it, they won't believe it. This leads to an infinite regress of committing to commitments.
      *   *Section 3: The Deadlock Problem (Equilibrium Failure).* If both sides use surrogate goals, no deals get made. Cooperation collapses. This is a known issue in game theory (commitment races).
      *   *Section 4: Provocation.* If I know you care about the desert surrogate, I bomb the desert to make you suffer resources, even if I don't want the payment.
      *   *Section 5: Consensus Check.* Be blunt. This is not mainstream decision theory. It's niche.
      *   *Conclusion:* Summary for the article.

  7.  **Refining the Tone:**
      *   Avoid jargon where possible, or explain it (e.g., "acausal," "counterfactual").
      *   Maintain neutrality. Don't say "This is crazy," say "This relies on assumptions X and Y which are debated."
      *   Ensure the distinction between "causal" (normal) and "acausal" (simulation/prediction) threats is clear, as the surrogate goal argument behaves differently in each.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* surrogate goals help? Yes, by making the cost of paying (violating commitment) higher than the threat.
      *   *Check:* Did I address the "random patch of desert" example? Yes, use that.
      *   *Check:* Is the distinction between "fatal" and "awkward" clear? I should use headers or bullet points to make this explicit.
      *   *Check:* Am I overstating the viability of acausal extortion? I need to emphasize that *acausal extortion itself* is the most speculative part of the chain. If acausal influence doesn't exist, the problem doesn't exist.

  9.  **Final Polish:** Organize into clear sections: "The Decision Theory Dependency," "The Credibility Gap," "The Deadlock Risk," "New Attack Surfaces," and "The Consensus Reality Check." (This matches the thought process in step 6). Ensure the "Journalist Advice" section is prominent.

  10. (Final thought): Make sure to mention that standard pre-commitment (like burning bridges) is well-understood, but *acausal* pre-commitment is the speculative leap.

  11. *Wait, one nuance:* The prompt asks about "surrogate goals as a defense." This is specifically a proposal discussed in FDT circles (e.g., by Nate Soares or similar). I need to make sure I don't conflate it with standard "hostage" scenarios. The key is the *acausal* link.

  12. *Refining the "Fatal" category:* The most fatal flaw is that the problem itself (acausal extortion) might not be real. The second most fatal is that FDT is not the correct decision theory. I need to lead with that.

  13. *Refining the "Consensus" section:* Be very clear. Mainstream economists = CDT/EDT. AI Safety/Alignment community = Mixed, with FDT being a minority but vocal view.

  Okay, ready to write.
answer: |-
  This is a fascinating angle for a piece. It touches on the bleeding edge of decision theory, AI safety, and game theory. However, your instinct to stress-test it is correct. The "surrogate goal" argument is elegant, but it rests on a stack of assumptions that are far from settled.

  To help you structure the piece, I have categorized the defeaters from **Fatal** (theoretical showstoppers) to **Awkward** (practical implementation problems), followed by a specific section on **Consensus vs. Speculation** to ensure you don't misrepresent the field.

  ### 1. Fatal Defeaters (Theoretical Showstoppers)

  These are issues that, if valid, render the surrogate goal strategy incoherent or useless.

  **A. The Decision Theory Dependency (CDT vs. FDT)**
  This is the single biggest hurdle. The surrogate goal argument only works if you accept a specific, contested view of how decisions influence reality.
  *   **The Conflict:** Standard **Causal Decision Theory (CDT)** says your current decision cannot change the past. If an extortionist has already simulated you and decided to threaten you based on that simulation, paying up *now* doesn't change the simulation *then*. Therefore, a CDT agent should pay the ransom to save their values, regardless of prior commitments.
  *   **The Requirement:** For surrogate goals to work against *acausal* threats, you need **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)**. These theories argue that your decision algorithm is the same as the simulator's prediction of your algorithm. Therefore, deciding "I will not pay" now logically implies the simulator predicted "They will not pay," so the threat is never issued.
  *   **The Defeater:** If FDT/UDT is incorrect (and many academic decision theorists argue it is), the surrogate goal provides no protection against acausal threats. You are simply binding yourself to a policy that causes you to lose resources when threatened, with no causal mechanism to deter the threatener.

  **B. The "Commitment Race" and Deadlock**
  Even if FDT is correct, universal adoption of surrogate goals leads to a worse equilibrium.
  *   **The Conflict:** Extortion is a negotiation. Sometimes, "threats" are actually bluffs, or there is room for mutually beneficial trade. Surrogate goals are designed to make you an immovable object.
  *   **The Defeater:** If *everyone* adopts surrogate goals (or if your extortionist also has a surrogate goal policy), you create a game of Chicken where neither side can swerve. In standard game theory, if both players credibly pre-commit to "never negotiate," cooperation collapses and conflict becomes inevitable. You solve the extortion problem by guaranteeing that any dispute escalates to maximum violence. You aren't safe; you're just in a stalemate that shatters at the first misunderstanding.

  **C. The Transparency Problem**
  For the deterrent to work, the extortionist must *know* you have a surrogate goal.
  *   **The Conflict:** If you can secretly switch your surrogate goal (e.g., from "the desert" to "a mountain") to avoid a specific threat, a smart extortionist knows this is possible.
  *   **The Defeater:** To be credible, the commitment must be immutable. But if it is truly immutable, you lose the flexibility to update your values as you learn new information. If it is mutable, the extortionist will discount your commitment. You end up in an infinite regress of needing to commit to the commitment, which requires a level of transparency and self-binding that may be physically or computationally impossible.

  ### 2. Awkward Defeaters (Practical Vulnerabilities)

  These don't necessarily break the theory, but they introduce significant costs or new risks.

  **A. Provocation and Sabotage**
  You mentioned attack surfaces, and this is the big one.
  *   **The Mechanism:** If I know you have bound your utility function to "Patch of Desert #402," I don't need to extort you. I can simply destroy Patch of Desert #402.
  *   **The Cost:** Because you have artificially inflated the value of the desert to match your actual values, destroying the desert hurts you just as much as destroying your headquarters. You have created a new "hostage" that your enemies can kill without even asking for ransom. You haven't removed the leverage; you've just moved it to a less defensible location.

  **B. False Positives (Defining a "Threat")**
  *   **The Mechanism:** To automate the "never negotiate" response, you need a rigorous definition of a threat.
  *   **The Cost:** The world is noisy. A competitor lowering prices might look like an economic threat. A natural disaster might look like a coercive act by a nature-controlling AI. If your surrogate goal trigger is too sensitive, you spend all your resources fighting non-existent extortionists. If it's too insensitive, real extortionists slip through. Calibrating this perfectly is likely impossible.

  **C. Goal Drift**
  *   **The Mechanism:** Humans (and AIs) optimize for what they measure.
  *   **The Cost:** If you spend enough time treating the "surrogate desert" as your primary value to maintain the commitment, you may psychologically or algorithmically drift into actually caring about the desert more than your original goals. You solve the extortion problem by becoming a person who only cares about a patch of sand.

  ### 3. The Consensus Reality Check

  For your article, this is the most critical section. You need to distinguish between **mainstream decision theory** and **AI safety speculation**.

  **What is Settled/Consensus:**
  *   **Pre-commitment is valuable:** In standard game theory (e.g., Schelling points), the ability to bind your hands can be advantageous (e.g., burning the bridge behind you).
  *   **Extortion is a real problem:** In politics, cybersecurity, and economics, the "rationality of irrationality" (making threats credible) is well-studied.
  *   **CDT is the standard:** Most economists and academic philosophers still operate under Causal Decision Theory or Evidential Decision Theory.

  **What is Contested/Speculative:**
  *   **Acausal Influence:** The idea that a future agent or simulator can exert influence *acausally* (without physical signal) via prediction is **not** scientific consensus. It is a hypothesis popularized by the Machine Intelligence Research Institute (MIRI) and the LessWrong community. Many physicists and philosophers reject the coherence of "acausal trade."
  *   **FDT/UDT:** Functional Decision Theory is not taught in standard economics or philosophy PhD programs. It is a niche framework developed specifically to handle these AI safety edge cases. Presenting it as "how rational agents work" would be misleading. It is better framed as "a proposed alternative for superintelligent agents."
  *   **Surrogate Goals as a Solution:** This is a specific proposal within that niche community (often associated with thinkers like Nate Soares or Eliezer Yudkowsky). It is not a recognized strategy in international relations or cybersecurity.

  **How to Frame It for a General Audience:**
  Avoid phrasing like "Rational agents should..." Instead, use: "Proponents of Functional Decision Theory argue..." or "In scenarios where agents can perfectly simulate one another..."

  Make sure the reader understands that **acausal extortion itself** is the most speculative link in the chain. If acausal extortion is impossible (because perfect prediction is impossible, or because acausal influence is incoherent), then surrogate goals are a solution to a non-existent problem.

  ### Summary for your Piece

  If you want to present a balanced stress-test, the narrative arc could look like this:

  1.  **The Hook:** The intuition is brilliant. It turns weakness (stubbornness) into strength.
  2.  **The Catch:** It requires a universe where thoughts can influence reality without physical interaction (FDT/acausal links).
  3.  **The Risk:** Even if that universe exists, binding yourself to a surrogate creates new hostages and risks deadlock with other stubborn agents.
  4.  **The Verdict:** It is a fascinating mathematical possibility for AI alignment, but currently lacks the physical or economic grounding to be considered a robust strategy for real-world actors.

  This approach respects the intelligence of the idea without validating the more fringe metaphysical assumptions as fact.
