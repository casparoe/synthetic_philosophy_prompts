              *   Flee: $0.01 * 1000 - 50 = -40$.
              *   Recommendation: Stay.
          *   CDT: $P(Death|do(Stay)) = P(Death)$. If Death predicted you, he's there.
              *   Actually, standard CDT says Death's location is fixed before you choose. So $P(Death|do(Stay)) = P(Death|do(Flee))$.
              *   So Flee costs 50 extra. Stay is better.
              *   *Where is the instability?* The instability comes if you think your choice *could* influence the prediction (which it can't causally, but evidentially it does). The prompt asks for "Causal Cover client discovers that no pure act is stable... has to buy a randomisation rider". This suggests a specific variant of CDT (like Joyce's or others dealing with Newcomb-like problems) where mixed strategies are required to break the correlation if the predictor predicts *deliberation*.
              *   Let's frame it as: To achieve causal independence, you must be unpredictable. Pure acts are predictable. Therefore, you must randomize.
