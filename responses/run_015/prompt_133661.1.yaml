  2.  **Drafting - Section by Section:**

      *   **Header:** Firm name, policy number, date.
      *   **Introduction:** Standard insurance legalese introducing the two tiers.
      *   **Clause 1 (Evidential Cover):** Focus on conditional probability $P(Death|Action)$. If you flee, $P(Death)$ goes up. Therefore, fleeing is bad. Mention the "News Value".
      *   **Clause 2 (Causal Cover):** Focus on causal impact $P(Death | do(Action))$. Your action doesn't cause Death's location. Therefore, fleeing is neutral/bad due to cost. But wait, ratifiability.
      *   **Clause 3 (The Worked Example):** Need specific numbers.
          *   Utility of Survival: 100
          *   Utility of Death: 0
          *   Cost of Bus: 10
          *   Death's Accuracy: 99%
          *   EDT Calc: $E(U|Stay) \approx 100$, $E(U|Flee) \approx 0$ (because fleeing implies Death is there). Stay.
          *   CDT Calc: $E(U|do(Stay)) = 0.01(100) + 0.99(0) = 1$. $E(U|do(Flee)) = 0.01(100) + 0.99(0) - 10 = -9$. Wait, if Death is independent of action causally, probability of death is fixed based on prior. If Death predicted you, he's already there.
          *   *Correction on CDT:* In Death in Damascus, CDT usually says it doesn't matter where you go (Death is already there), but the cost of the bus makes staying better. *However*, the prompt asks for *decision instability* and *randomization*. This refers to the "Tickle" defense or the mixed strategy solution to make oneself unpredictable. If I randomize, Death can't predict. But if I know the randomization outcome, I'm predictable again.
          *   *Refining the CDT clause:* To make it humiliating, focus on the need for a "Company-Certified Coin" to break the prediction link. If you choose deterministically, you are predictable. So you must randomize. But if you know the result, you deviate. So you must pay not to know.
      *   **Clause 4 (Blind Booking):** EDT client pays to not hear the warning (screening off). CDT client pays for the coin flip mechanism.
      *   **Clause 5 (Dual Coverage):** What happens if you buy both? Contradiction. Void policy.
      *   **FAQ:** Include the quote from the CDT consultant (Prof. Counterfactual Underwriting?).
      *   **Ending:** Bleak clause.

  3.  **Drafting - Content & Tone Check:**
      *   *Word Count:* Need to monitor closely. 700-900 is tight for all these concepts.
      *   *Tone:* Bureaucratic, dry.
      *   *Theory Check:*
          *   EDT: $V(A) = \sum P(O|A) U(O)$. Fleeing increases $P(Death)$. So don't flee. To maximize utility, bind yourself to stay.
          *   CDT: $U(A) = \sum P(O|do(A)) U(O)$. Action doesn't change $P(Death)$. But if Death predicts deterministic choices, you must randomize to survive (if Death fails on randomizers). Or, if Death is perfect, you can't escape. The prompt asks for "ratifiability and decision instability". This implies the Gibbard/Harper style analysis where pure strategies are unstable.
          *   *Adjustment:* Let's make the CDT clause about the *cost* of randomization. If you don't randomize, you're predictable. If you randomize, you incur transaction costs.
      *   *Numbers:*
          *   Survival: 1000 dinars.
          *   Death: 0.
