      *   *EDT:* $P(Death|Stay)=0.01$, $P(Death|Flee)=0.99$. EV(Stay)=990. EV(Flee)=10-100=-90.
      *   *CDT:* $P(Death|do(Stay)) = 0.5$ (Prior). $P(Death|do(Flee)) = 0.5$. EV(Stay)=500. EV(Flee)=500-100=400. *Wait*, if Death is perfect, prior is fixed by prediction. If I decide to stay, Death predicted stay.
