prompt: |-
  hey — im putting together an adversarial collaboration and I need someone to actually draft the document. Two camps:

  - the **precisionist**: a sharp/uniqueness Bayesian. Rationality always mandates a single probability function, update it by strict conditioning, then maximise expected utility. Anything that looks like imprecise credence is either loose self-reporting or a sharp degree of confidence the agent can't fully introspect, plus maybe some pragmatic slack in how we talk about it.
  - the **credalist**: an imprecise probabilist / permissivist. Sets of probability functions are the representational primitive, rationality is permissive, and the decision rule is E-admissibility or maximality, falling back on something like Γ-maximin when you have to pick one act.

  They've been going at each other about dilation and about whether "mushy credence" is even a state anyone could be in, and mostly they've been talking past each other.

  What I want is the text they could both sign. Format:

  1. a **numbered agreed-claims section** — with real content, not "both sides agree rationality matters". Things where the concession costs somebody something.
  2. a **disagreements table**: each row a residual disagreement, with two columns — the precisionist's own formulation of her view and the credalist's own formulation of his — each phrased so the *other* side would accept it as a fair statement of what's being claimed. No strawmen, and no wording so neutral it says nothing.
  3. a **cruxes section**: the sub-questions such that settling one would move at least one of them, and for each crux a concrete case or argument both would agree bears on it, with each side's prediction written down in advance — what each expects the case to show, and what each would concede if it came out the other way.
  4. a short closing note on **which part of the fight, if any, is merely verbal**, and why.

  Cruxes I think are in there, use them or drop them as you see fit, but I want the two scenarios below built in because otherwise the whole thing floats:

  - **The two-instrument case.** One instrument, A, is known good and reads 0.30 on a quantity in [0,1], with error you have a sharp distribution for. Instrument B was built by a subcontractor you know nothing about: it's either as good as A or it's junk that prints a uniform random number regardless of the truth, and you have no evidence either way — no base rate, no nothing. B reads 0.80. You can bet at even money that the true value is above 0.50, bet it's at or below, or pass for free. Is some act rationally required here, is more than one permitted, or is passing required? And separately: what does each side predict a room of competent non-philosophical statisticians would actually do, and what would each concede if that prediction went against them?
  - **The worst-member scoring rule.** A forecasting platform lets forecasters report a point or an interval for each event, and scores the report with a strictly proper rule applied to the member of the report least favourable given what happened: report [0.2, 0.6] and you're scored as if you'd said 0.2 if the event occurs and as if you'd said 0.6 if it doesn't. Point reports are just singleton intervals. Does an interval report ever come out best on this rule, and by whose lights? The crux is whether that result is evidence against imprecise credence or an artefact of baking sharp probability into the scoring function — so give the symmetric foil too (a rule that scores the set by its best member, or by the member closest to the truth) and say what each side predicts forecasters will do under each.
  - **Long-run collapse.** An imprecise agent who knows she'll get a long stream of evidence she can't yet see: does her set shrink towards a point, and if it does, does that vindicate the precisionist or is it just what imprecision looks like once the evidence is in?

  Please don't turn this into a verdict — no "on balance the credalist has the better of it". No citations or bibliography, I don't want any. And keep it in vocabulary both camps would use: if you reach for something like "real agents are bounded anyway", say how it's meant to bear.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Draft an adversarial collaboration document between two philosophical camps: the **Precisionist** (Sharp Bayesian) and the **Credalist** (Imprecise Probabilist/Permissivist).
      *   **Tone/Style:** Technical, precise, no verdicts, no citations, vocabulary acceptable to both (avoiding "bounded rationality" unless specified how it bears).
      *   **Structure:**
          1.  Numbered Agreed-Claims Section (substantive concessions).
          2.  Disagreements Table (fair formulations of opposing views).
          3.  Cruxes Section (specific sub-questions, concrete cases, predictions, concession conditions). *Must include:* Two-Instrument Case, Worst-Member Scoring Rule, Long-Run Collapse.
          4.  Closing Note on Verbal Disputes.
      *   **Constraints:** No bibliography, no "who won," specific scenarios must be integrated into Cruxes.

  2.  **Deconstruct the Camps:**
      *   **Precisionist:** Single probability function ($P$). Conditionalization ($P(H|E)$). Maximize Expected Utility (MEU). Imprecision is introspective failure or pragmatic slack.
      *   **Credalist:** Set of probability functions ($\mathbb{P}$). Permissive rationality. Decision rules: E-admissibility, Maximality, $\Gamma$-maximin. Imprecision is a representational primitive.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need substantive concessions, not platitudes.
      *   *Idea 1:* Both agree standard Dutch Book arguments require a decision rule to link credence to action.
      *   *Idea 2:* Both agree that in limiting cases of overwhelming evidence, the set collapses (or the sharp credence converges).
      *   *Idea 3:* Both agree that "I don't know" is distinct from "I assign 0.5".
      *   *Idea 4:* Both agree that pragmatic encroachment (cost of error) affects *assertion* even if not *credence*.
      *   *Refinement:* Let's make them sharper.
          1.  Decision-theoretic link: Credence must guide action via some dominance principle.
          2.  Learning: Evidence *should* constrain belief (no dogmatism).
          3.  Introspection: Agents can be wrong about their own precision.
          4.  Modeling: Both models can simulate the other's output behaviorally in simple cases.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Needs to be fair but distinct. No strawmen.
      *   *Row 1: Representation.* Precisionist: State is a vector. Credalist: State is a region.
      *   *Row 2: Rational Requirement.* Precisionist: One unique function mandated by evidence. Credalist: Evidence constrains a set; multiple functions permissible.
      *   *Row 3: Dilation.* Precisionist: Dilation is a pathology/bug. Credalist: Dilation is a feature capturing ignorance about reliability.
      *   *Row 4: Decision Rules.* Precisionist: MEU is the only coherent rule. Credalist: MEU is too demanding; admissibility rules preserve ignorance.

  5.  **Drafting - Section 3: Cruxes (The Core Task):**
      *   *Constraint:* Must include Two-Instrument, Worst-Member Scoring, Long-Run Collapse.
      *   *Format:* Sub-question, Concrete Case, Predictions (P & C), Concession conditions.

      *   *Crux 1: The Two-Instrument Case.*
          *   Setup: A (sharp, 0.3), B (unknown quality, 0.8). Bet on >0.5.
          *   Precisionist View: Must form a prior on B's reliability (Principle of Indifference or subjective guess). MEU dictates a bet.
          *   Credalist View: Set includes "B is perfect" and "B is junk". Dilation occurs. E-admissibility permits passing.
          *   Prediction: What do statisticians do? P: They pick a number. C: They hesitate/pass.
          *   Concession: If statisticians overwhelmingly pass without assigning a reliability prior, P concedes introspective access to sharpness is limited. If they assign a prior effortlessly, C concedes the "set" is just computational noise.

      *   *Crux 2: Worst-Member Scoring Rule.*
          *   Setup: Score based on least favorable member of the set.
          *   Precisionist View: Proper scoring rules incentivize truth-telling only for sharp credences. Interval reporting invites hedging penalties.
          *   Credalist View: If the rule penalizes the worst member, sharp reporting is safer *unless* the set is the truth. But a "Best-Member" rule would incentivize overconfidence.
          *   Prediction: Under Worst-Member, forecasters report points. Under Best-Member, they report [0,1].
          *   Concession: If forecasters report intervals under Worst-Member, P concedes imprecision has pragmatic utility. If they report [0,1] under Best-Member, C concedes the model allows gaming.

      *   *Crux 3: Long-Run Collapse.*
          *   Setup: Stream of evidence. Does $\mathbb{P}$ shrink to a point?
          *   Precisionist View: Yes, convergence theorems apply. If it doesn't, the prior was dogmatic.
          *   Credalist View: It may shrink, but the *width* represents structural uncertainty that persists. If it collapses completely, imprecision was just temporary ignorance.
          *   Prediction: P: It collapses to a point. C: It stabilizes at a non-zero width (due to model uncertainty).
          *   Concession: If it collapses to a point, C concedes imprecision is transient. If it stabilizes at width > 0 despite infinite data, P concedes sharpness is an idealization.

  6.  **Drafting - Section 4: Verbal Dispute Note:**
      *   Where are they talking past each other?
      *   Likely around the definition of "belief state." Is it the *disposition* (behavioral) or the *internal representation*?
      *   Also, the definition of "rationality" (ideal vs. feasible).
      *   Need to be careful not to dismiss the substantive disagreement as merely verbal.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it neutral? Yes.
      *   *Check Constraints:* No citations? Yes. No verdict? Yes.
      *   *Check Vocabulary:* Avoid "bounded rationality" unless explained. Use "introspective access," "representational primitive," "decision rule."
      *   *Check Specific Scenarios:* Are they detailed enough?
          *   *Two-Instrument:* Ensure the "no base rate" constraint is clear.
          *   *Scoring:* Ensure the "Worst-Member" logic is clear.
          *   *Collapse:* Ensure the distinction between convergence and structural uncertainty is clear.
      *   *Check Agreed Claims:* Are they costly?
          *   Claim 1 (Dutch Book): Costs Credalist (admits need for decision rule).
          *   Claim 2 (Introspection): Costs Precisionist (admits agents can't always access sharpness).
          *   Claim 3 (Convergence): Costs Credalist (admits sets shouldn't be dogmatic).
          *   Claim 4 (Behavioral Equivalence): Costs Both (admits models can mimic each other).

  8.  **Final Polish:**
      *   Ensure the "Disagreements Table" columns are written in the *voice* of the claimant but acceptable to the opponent.
      *   Ensure the "Cruxes" have explicit "If X happens, I concede Y" statements.
      *   Make sure the formatting is clean.

  *(Self-Correction during drafting)*: I initially thought about putting the Scoring Rule crux as "which rule is right." But the prompt asks for "what forecasters will do" and "is interval reporting ever best." I need to make sure the concession ties back to the *nature of credence*, not just the scoring rule mechanics.
  *Correction:* The crux is whether the *behavior* under specific scoring rules reveals the underlying state. If forecasters hedge under Worst-Member, does that mean they *have* imprecise credence, or just that they are risk-averse? I need to specify that risk aversion is controlled for (e.g., linear utility over score points).

  *Refining the Two-Instrument Case:* The prompt specifies "no base rate, no nothing" on Instrument B. This is key for the Precisionist. They *must* assign a prior to B's reliability to act. The Credalist says you don't have to. The prediction about statisticians is crucial here.

  *Refining the Verbal Dispute:* Focus on the word "State." Is the state the math object or the functional role?

  9.  **Final Output Generation** (Proceeding to generate text based on these thoughts).
answer: |-
  # ADVERSARIAL COLLABORATION: PRECISION VS. IMPRECISION IN CREDENCE

  **Parties:** The Precisionist Camp (PC) vs. The Credalist Camp (CC)
  **Subject:** The representational structure of rational belief and the norms governing update and choice.

  ---

  ## 1. AGREED CLAIMS

  Both camps endorse the following substantive claims. Endorsement entails a concession of theoretical ground by each side.

  1.  **The Action-Credence Link:** Credence states are not merely descriptive; they are normative inputs to decision theory. A theory of credence that cannot generate a recommendation (or a permission set) for action in a betting scenario is incomplete.
      *   *Concession:* CC accepts that imprecise states must interface with a decision rule to avoid paralysis. PC accepts that credence is defined partly by its functional role in choice, not just internal consistency.
  2.  **Introspective Fallibility:** An agent's self-report of confidence is not infallible evidence of their underlying credal state. An agent may report a sharp number while possessing a disposition to hedge, or vice versa.
      *   *Concession:* PC accepts that "feeling sharp" does not prove the existence of a unique probability function. CC accepts that "feeling vague" does not prove the existence of a representable set of probabilities.
  3.  **Non-Dogmatism:** A rational credal state must allow for the possibility of being wrong about any contingent proposition. A state that assigns probability 0 or 1 to empirical claims is defective unless the claim is logically necessary or impossible.
      *   *Concession:* CC accepts that credal sets cannot include functions that assign 0 or 1 to empirical claims (avoiding "imprecise dogmatism"). PC accepts that sharpness does not license certainty.
  4.  **Behavioral Equivalence in Limit Cases:** In scenarios with high-quality, high-volume evidence and low stakes, the behavioral recommendations of the PC model (MEU on a sharp prior) and the CC model (E-admissibility on a constrained set) will converge.
      *   *Concession:* Both accept that the dispute is not about everyday estimation where data is abundant, but about decision-making under structural ignorance or conflicting evidence.

  ---

  ## 2. DISAGREEMENTS TABLE

  | Topic | Precisionist Formulation (PC) | Credalist Formulation (CC) |
  | :--- | :--- | :--- |
  | **Representational Primitive** | The fundamental state of belief is a single probability function $P$. Any appearance of a range $[a, b]$ is either a report of a specific $P \in (a, b)$ accompanied by error bars, or a pragmatic signal of low confidence in one's own calculation of $P$. | The fundamental state of belief is a set of probability functions $\mathbb{P}$. A sharp value $p$ is a degenerate case where $\mathbb{P} = \{P\}$. Imprecision is not a lack of introspection but a faithful representation of under-constrained evidence. |
  | **Rational Requirement** | Evidence $E$ and background $K$ mandate a unique rational posterior $P(\cdot | E, K)$. Two agents with identical $E$ and $K$ who hold different $P$ are not both rational; at least one has made a computational or prior-selection error. | Evidence $E$ and background $K$ constrain the permissible set $\mathbb{P}$, but do not always select a unique function. Two agents with identical $E$ and $K$ may hold different $P_1, P_2 \in \mathbb{P}$ and both be fully rational. |
  | **Dilation** | Dilation (where posterior uncertainty exceeds prior uncertainty after learning a partition) is a pathology indicating a flawed update rule or an improper prior. It violates the intuition that learning should reduce entropy. | Dilation is a feature, not a bug. It correctly models situations where learning *which* evidence you got reveals information about the reliability of the source, thereby increasing uncertainty about the hypothesis. |
  | **Decision Norms** | Rational choice requires Maximizing Expected Utility (MEU) relative to the unique $P$. Choosing an act that is not MEU-optimal is irrational, even if it is "safe." | Rational choice requires satisfying a rule like E-admissibility or Maximality. An act is permitted if it is optimal for *some* $P \in \mathbb{P}$. MEU is too demanding when $P$ is not uniquely determined by evidence. |

  ---

  ## 3. CRUXES

  The following scenarios isolate the specific empirical or formal claims that drive the disagreement. For each, both sides commit to a prediction and a concession condition.

  ### Crux 1: The Two-Instrument Case
  **Scenario:** A quantity $Q \in [0,1]$ is measured. Instrument A is known reliable (sharp error distribution), reading 0.30. Instrument B is of unknown reliability: it is either identical to A or it outputs uniform random noise. There is no base rate for B's quality. B reads 0.80.
  **Decision:** Bet at even money that $Q > 0.50$, bet $Q \leq 0.50$, or Pass (payoff 0).

  *   **Sub-Question:** Is passing rationally required, or is a bet mandated by the obligation to form a prior on B's reliability?
  *   **PC Prediction:** Competent statisticians will implicitly assign a subjective prior to B's reliability (e.g., 0.5) and calculate a weighted average. They will place a bet (likely on $Q \leq 0.50$ given A's reliability).
  *   **CC Prediction:** Competent statisticians will recognize the structural ignorance regarding B. They will decline to bet (Pass) because the set of posteriors includes functions where betting is a sure loss relative to the information state.
  *   **PC Concession Condition:** If >80% of competent statisticians refuse to bet without first explicitly assigning a reliability probability to B, PC concedes that sharp credence is not the default cognitive state under structural ignorance.
  *   **CC Concession Condition:** If >80% of competent statisticians immediately assign a reliability probability to B and bet without hesitation, CC concedes that the "set" representation is computationally redundant to the agent's actual psychology.

  ### Crux 2: The Worst-Member Scoring Rule
  **Scenario:** A forecasting platform scores reports using a strictly proper rule (e.g., Brier) applied to the *least* favorable member of the reported set. If an agent reports $[0.2, 0.6]$, and the event occurs, they are scored as if they reported 0.2. If it does not occur, they are scored as if they reported 0.6.
  **Foil:** A "Best-Member" rule scores the report using the member *most* favorable to the agent given the outcome.

  *   **Sub-Question:** Does interval reporting ever maximize expected score under the Worst-Member rule, or does the rule force sharp reporting?
  *   **PC Prediction:** Under Worst-Member scoring, rational forecasters will always report a point (singleton interval). Reporting an interval strictly dominates itself by inviting a penalty from the worst-case member. Interval reporting here is evidence of confusion about the scoring rule.
  *   **CC Prediction:** Under Worst-Member scoring, forecasters with genuinely imprecise credence $\mathbb{P}$ will report the convex hull of $\mathbb{P}$. They will accept the penalty on the worst member to avoid misrepresenting their state. Under Best-Member scoring, forecasters will report $[0, 1]$ to game the system.
  *   **PC Concession Condition:** If forecasters with linear utility over score-points consistently report non-singleton intervals under Worst-Member scoring, PC concedes that imprecise reports can be stable strategic choices, implying imprecise states are operationally distinct.
  *   **CC Concession Condition:** If forecasters report $[0, 1]$ under Best-Member scoring, CC concedes that the imprecise model permits irrational overconfidence unless constrained by external norms, weakening its claim to describe *rational* belief.

  ### Crux 3: Long-Run Collapse
  **Scenario:** An agent faces an infinite stream of independent, identically distributed evidence regarding a hypothesis. The agent begins with an imprecise prior $\mathbb{P}_0$ (a wide set of functions).
  **Sub-Question:** Does the posterior set $\mathbb{P}_n$ shrink to a singleton $\{P^*\}$ as $n \to \infty$?

  *   **PC Prediction:** Yes. By standard convergence theorems, any set of priors that assigns non-zero probability to the truth will converge to the same sharp posterior. If the set does not collapse, the agent was dogmatic (assigned 0 to the truth initially).
  *   **CC Prediction:** The set will narrow, but it will stabilize at a non-zero width reflecting structural model uncertainty (e.g., uncertainty about the likelihood function itself) that evidence cannot wash out.
  *   **PC Concession Condition:** If the posterior set stabilizes at a width $> \epsilon$ despite infinite data on the parameter, PC concedes that sharp probability is an idealization that fails to capture persistent structural uncertainty.
  *   **CC Concession Condition:** If the posterior set collapses to a singleton (modulo computational error), CC concedes that imprecision is merely a transient state of ignorance, not a permanent feature of rational belief.

  ---

  ## 4. CLOSING NOTE: VERBAL DISPUTES

  We identify one significant area where the disagreement may be merely verbal, though it masks substantive technical divergences.

  **The Definition of "State":**
  Much of the friction arises from differing definitions of what a "credal state" *is*.
  *   **PC** defines the state functionally: if two agents make the same bets in all conceivable scenarios, they have the same credence. Since a decision rule (like $\Gamma$-maximin) can be mathematically transformed into a sharp prior with a specific risk profile, PC argues the Credalist is just describing a sharp agent with a non-standard utility function.
  *   **CC** defines the state representationally: the set $\mathbb{P}$ is the object of introspection and update, distinct from the utility function. CC argues the Precisionist is describing an imprecise agent who has been forced to make a premature choice to satisfy a formalism.

  **Resolution:**
  This is verbal *only if* the "risk profile" required to mimic the Credalist becomes so complex that it loses its normative force as a utility function (e.g., if it becomes event-dependent).
  *   If the PC can show that every CC decision rule maps to a standard Expected Utility maximization with a fixed utility function, the dispute is verbal (CC is just describing risk aversion).
  *   If the CC can show that mimicking their behavior requires a utility function that violates standard axioms (e.g., state-dependence or violation of ordering), the dispute is substantive (the structure of belief itself differs).

  We agree to treat the **Two-Instrument Case** as the arbiter here. If "passing" is explained by PC as "risk aversion," we must check if that risk aversion persists when stakes are scaled linearly. If the tendency to pass scales non-linearly with stakes in a way inconsistent with a fixed utility function, the dispute is substantive: the state itself is imprecise, not just the agent's attitude toward risk.
