  ### Failure Modes & Limits (Honesty Check)

  **1. The "Math Whiz" Problem**
  *   **Risk:** A participant deduces "Sum = 15" in Phase 1 or 2.
  *   **Impact:** They bypass the mechanism. They will sit idle while others struggle.
  *   **Mitigation:** In the Intro, state: "If you discover the mathematical rule, you are ethically bound to play by the *phase rules*, not the math. You are testing the mechanism, not your arithmetic."
  *   **Limit:** This exercise cannot reproduce the *timescale* of evolution. Phase 1 feels like a game, not natural selection. You must explicitly state in the debrief that "In nature, Phase 1 takes 10,000 years. Here, it takes 10 minutes."

  **2. The "Smuggling" Problem**
  *   **Risk:** In Phase 1 (Darwinian), participants will talk or look at neighbors' sheets despite the rule.
  *   **Impact:** Contaminates the "Blind Variation" condition.
  *   **Mitigation:** Frame it as "Protocol Integrity." If they talk, they break the simulation. Patrol the room.
  *   **Limit:** You cannot truly stop human cognition. A human in Phase 1 is still a Popperian creature pretending to be Darwinian. Acknowledge this: "You are simulating a lower rung, not regressing to it."

  **3. The "Nothing Happens" Problem**
  *   **Risk:** Phase 1 feels frustrating and pointless. Participants feel they aren't learning.
  *   **Impact:** Disengagement.
  *   **Mitigation:** This is a feature, not a bug. The frustration *is* the lesson. In the debrief, ask: "How did Phase 1 feel compared to Phase 4?" The answer should be "Helpless."
  *   **Limit:** The exercise implies a clean ladder. Real cognition is messy. Animals use Skinnerian and Popperian strategies simultaneously. You must supply this nuance in words during the debrief.

  **4. The "Quiet Participant" Problem**
  *   **Risk:** Two participants never engage, just copying others.
  *   **Impact:** They miss the cognitive shift.
  *   **Mitigation:** The Log Sheet requires personal input ("How I chose"). Check these at the door.
  *   **Limit:** If they copy in Phase 1, they are acting as "genes," which is accurate to the Darwinian rung. Use this in the debrief: "In Phase 1, you weren't individuals; you were vessels for information."

  **5. The "Gregorian Ceiling"**
  *   **Risk:** Phase 4 solves the problem too quickly. Everyone gets 100.
  *   **Impact:** Phase 5 feels anticlimactic.
  *   **Mitigation:** Ensure Phase 5 scoring is strict. The tools are there, but the *rule* forces randomness. This highlights that tools don't guarantee success if the selection pressure (the rule) changes back.
  *   **Limit:** This exercise treats tools as external. It doesn't capture how tools *internalize* (neuroplasticity). You must say: "In reality, the Phase 4 tools would rewire your brain for Phase 1. Here, they just sit on the desk."

  ### Why This Design Works for Your Article
  1.  **No Wonder-Footage:** The "aha" moment comes from the participants' own frustration and relief, not a crow video.
  2.  **Filters vs. Generators:** The Log Sheets will show "Random Guess" in Phase 1 and "System/Algorithm" in Phase 4. This visually proves the shift from filtering to generating.
  3.  **The Downward Arrow:** Phase 5 is the critical addition. It shows that once a Gregorian tool exists, even a Darwinian process looks different. The environment is now "scaffolded." This supports your thesis that intelligence migrates outward and then alters the inward.
  4.  **Skeptic-Proof:** By hiding the labels until the end, you prevent them from debating the definitions during the activity. They experience the *phenomenology* of the rungs first. The labels are just names for what they already felt.
