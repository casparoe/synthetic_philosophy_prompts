answer: |-
  ## Activity Design: The 15-Sum Protocol

  **Premise:** Participants attempt to maximize a score derived from three hidden numbers. The task remains identical; only the rules governing information flow, variation, and retention change.

  **Materials (Per Participant):**
  *   3 Index Cards (numbered 1–10 on one side, blank on the other). *Spare set of 3 in a central pool.*
  *   1 "Score Key" Card (a small table: Sum 15=100pts, 14/16=90pts, 13/17=80pts... 5/25=0pts).
  *   1 Pad of "Log Sheets" (pre-printed with 5 rows: Attempt # | My Cards | Score | Decision Rule).
  *   1 Pencil.
  *   1 Envelope (for "killing" cards in Phase 1).

  **Materials (Facilitator):**
  *   Whiteboard (to track Global Average Score).
  *   Timer.
  *   A bell or chime (for phase transitions).

  **The Hidden Truth:** The optimal solution is a Sum of 15 (e.g., 5-5-5, or 4-5-6). The Score Key is linear and symmetric around 15. This allows for gradient learning (Skinnerian) but requires precision (Popperian/Gregorian).

  ---

  ### Minute-by-Minute Timeline

  #### 00:00 – 10:00 | Setup & Framing
  **Facilitator Script:**
  "Welcome. For the next hour, we are running an optimization protocol. You are agents in a system. Your goal is simple: maximize your points.
  You have three number cards. Add them up. Check your Score Key. That is your score.
  You will log every attempt.
  There are five rounds. The task never changes. The *rules of engagement* will change at the bell. Do not discuss the rules with neighbors unless the rules explicitly allow it. If you break the information protocol, you corrupt the data.
  We begin now."

  #### 10:00 – 22:00 | Phase 1 (The Darwinian Filter)
  **Rule:** *Blind Variation + Environmental Selection.*
  1.  **Variation:** You must change your cards randomly for every attempt. (Roll a die or pick from the central spare pool blindly). You are not allowed to think about the numbers.
  2.  **Selection:** After 3 attempts, if your score is below 50, you are 'selected out.' You must place your cards in the Envelope and copy the cards of a neighbor who scored over 80, adding one random mutation (swap one card from the spare pool).
  3.  **Memory:** You may not keep notes. You may not look at your previous Log Sheet.

  **Facilitator Transition (at 22:00):**
  "Stop. Calculate the room's average score. I will write it on the board. Keep your cards. Clear your Log Sheets."

  #### 22:00 – 34:00 | Phase 2 (The Skinnerian Filter)
  **Rule:** *Reinforcement within Lifetime.*
  1.  **Variation:** You keep your current cards. You may swap *one* card per attempt.
  2.  **Selection:** If the new score is higher, keep the change. If lower, revert to the previous set.
  3.  **Memory:** You may look at your immediate past score to compare. No notes on *why*, only the numbers.
  4.  **Social:** No talking. No looking at neighbors' cards.

  **Facilitator Transition (at 34:00):**
  "Stop. New room average. Clear your Log Sheets. Keep your cards."

  #### 34:00 – 46:00 | Phase 3 (The Popperian Filter)
  **Rule:** *Pre-selection (Hypothesis Testing).*
  1.  **Variation:** You may propose a 'Hypothetical Set' on your scratch paper.
  2.  **Selection:** You may ask the Facilitator (or check a 'Hypothesis Key' if pre-printed) for the score of a set *without* officially submitting it. You get two 'free' hypothetical checks per round.
  3.  **Submission:** Only submit the set you believe will win.
  4.  **Social:** No talking.

  **Facilitator Transition (at 46:00):**
  "Stop. New room average. Clear your scratch paper. Keep your cards."

  #### 46:00 – 58:00 | Phase 4 (The Gregorian Scaffold)
  **Rule:** *Offloading & Cultural Transmission.*
  1.  **Variation:** You may write on the cards. You may build tools (e.g., a paper calculator, a checklist).
  2.  **Selection:** You may talk. You may share your tools. You may copy a neighbor's 'system' entirely.
  3.  **Memory:** You are encouraged to create a permanent record of *how* to solve this, not just the solution.

  **Facilitator Transition (at 58:00):**
  "Stop. New room average. **Do not discard your tools.** Collect your papers, your marked cards, your diagrams. Hold onto them."

  #### 58:00 – 70:00 | Phase 5 (The Downward Arrow)
  **Rule:** *Return to Darwinian Constraints + Gregorian Artifacts.*
  1.  **Variation:** You must return to Phase 1 rules. You must change cards randomly (use the spare pool). You cannot use logic to pick numbers.
  2.  **Selection:** If score < 50, copy a neighbor.
  3.  **The Twist:** You are allowed to keep your Phase 4 tools (notes, diagrams, marked cards) on the desk. You can look at them, but you cannot use them to *calculate* your move. They are just... there. Like a fossil. Or an instinct.
  4.  **Social:** No talking.

  **Facilitator Transition (at 70:00):**
  "Final scores. Pencils down."

  #### 70:00 – 90:00 | Debrief & Labeling
  **Facilitator Script:**
  "Look at your Log Sheets. Look at the Room Average on the board.
  1.  **The Filter:** In Phases 1-3, what happened to bad ideas? (They died). What happened to good ideas? (They survived). Did anyone invent a *new way to generate numbers* in Phase 1? (No).
  2.  **The Generator:** In Phase 4, did you change the *source* of your variations? (Yes, you built systems).
  3.  **The Downward Arrow:** In Phase 5, you were forced to be 'blind' again. But did the 'blindness' feel the same as Phase 1? (No, the tools altered the environment you were selecting in).
  4.  **The Labels:** (Reveal Dennett's Taxonomy).
      *   Phase 1: Darwinian Creatures (Blind variation, environmental selection).
      *   Phase 2: Skinnerian Creatures (Reinforcement).
      *   Phase 3: Popperian Creatures (Hypotheses die in your stead).
      *   Phase 4: Gregorian Creatures (Tools/Minds extend into the world).
      *   Phase 5: The Baldwin Effect / Niche Construction (Tools become the new environment)."

  ---

  ### The Log Line (To be filled after every attempt)
  *Keep this small to prevent bogging down.*
  `Attempt # | Cards [ _ _ _ ] | Sum | Score | How I chose these (One phrase)`

