answer: |-
  Dear Friend,

  You asked how I distinguish the skill of matching description to animal from mere hearing or seeing, so I constructed a debate in my mind between a Naiyāyika and a Buddhist of Dignāga's school to test the category of *upamāna*. The Naiyāyika opened by stating the standard case: a man knows a cow, is told by a forester that a gavaya is like a cow, goes to the forest, sees an animal, and knows this is a gavaya. He argued this knowledge of the name-object relation via similarity is irreducible. The Buddhist immediately countered that the forester's statement is testimony (*śabda*), the seeing is perception (*pratyakṣa*), and the connection is inference (*anumāna*) based on shared properties, leaving no work for a third *pramāṇa*.

  To press the point, the Naiyāyika proposed the reverse case, where the learner knows the gavaya first and is told a cow is like it. He claimed this remains *upamāna* because the cognitive event is still grasping similarity to fix a name. The Buddhist replied that this is simply inference from the known to the unknown, requiring no new instrument of knowledge. They moved quickly to the chained case, where the comparison base is known only by testimony; the Buddhist insisted this proves his point, as the identification never touches direct acquaintance, making it testimony all the way down. The Naiyāyika conceded the testimony is necessary but held that the final recognition in the forest relies on a similarity relation that testimony alone cannot convey.

  Next came the contrastive case, where the learner is told only what the animal is unlike. The Buddhist smiled, citing *apoha*, or exclusion, arguing that knowing what something is not is an inferential process of elimination. The Naiyāyika responded that negation presupposes a positive field of similarity; to know what something is unlike, one must already grasp the boundaries of resemblance, which is the core of *upamāna*. Finally, they tackled the revision case, where a detailed description conflicts with the initial resemblance. The Buddhist argued this is merely testimony correcting testimony, or perception correcting inference. The Naiyāyika countered that the conflict arises because the similarity relation itself is defeasible; the learner must reweigh the resemblance, which is a distinct cognitive adjustment.

  It was here, however, that I felt the dialogue tightened around the test I use with my trainees: whether a source of knowledge is distinct only if it has a unique defeat profile. The Buddhist pressed this hard, arguing that every failure of *upamāna* reduces to a failure of perception or testimony. He said, if you misidentify the gavaya, either you saw poorly, you heard the forester poorly, or you reasoned poorly about the shared properties; there is no fourth way to fail. He demanded the Naiyāyika show him an error that is not merely bad eyes or bad hearing.

  The Naiyāyika paused before offering a serious reply. He admitted that if *upamāna* were merely the sum of inputs, the Buddhist would win. But he argued that the defeat condition specific to *upamāna* is the misalignment of similarity itself, independent of the inputs. He said one can see the cow perfectly and hear the description perfectly, yet fail to grasp the *sādṛśya*, the likeness, because the cognitive mapping between the universal and the particular is distorted. He claimed this is a unique failure mode: the data is correct, the inference is valid, but the recognition of resemblance fails. He conceded, however, that this feels introspective and hard to isolate from inference. The Buddhist conceded in turn that the cognitive leap of recognizing likeness feels phenomenologically distinct, even if ontologically reducible, and that excluding it risks ignoring how learners actually bridge the gap between word and world.

  They finished by agreeing that *upamāna* survives as a distinct cognitive event, if not necessarily as a distinct ontological source. The Naiyāyika admitted that without testimony, *upamāna* has no trigger, and the Buddhist admitted that without the recognition of similarity, testimony remains dead letter. For my volunteers, this means the skill I teach is indeed sui generis; it is not just hearing me talk or seeing the bird, but the specific act of binding the two through resemblance. It can fail even when eyes and ears are sharp, if the sense of likeness is uncalibrated. So *upamāna* survives the exchange, though stripped of some metaphysical weight. It remains the vital hinge between description and encounter.

  Warmly,
  The Coordinator
