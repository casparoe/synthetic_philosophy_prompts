      *   **Key Argument (Duty to God):** Hume argues against the idea that suicide encroaches on God's prerogative. His point isn't strict metaphysical determinism (which would undermine moral agency entirely), but rather *compatibilism* or a specific view of Providence. God established general laws. Humans act within those laws. Altering matter (taking medicine vs. taking poison) is using the faculties God gave us. To say suicide is an affront to God implies we *can* disturb the order of the world, which implies human power exceeds what God allotted.
      *   **Key Argument (Duty to Society):** Suicide is permissible *unless* it harms society. If you are a burden, it might be acceptable. If you are useful, it might be wrong. This addresses the roommate's "obligation to kill oneself" point (Hume actually hints at this, but limits it).
