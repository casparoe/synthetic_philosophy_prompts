          *   (5) says *unwitting* hypocrisy is worse than *knowing* hypocrisy because of *self-monitoring*.
          *   *Analysis:* If standing is about commitment (1), a knowing hypocrite explicitly rejects the norm (self-exempts), while an unwitting hypocrite *thinks* they uphold it. Usually, philosophical literature (e.g., Fritz, Bell) suggests knowing hypocrisy is the paradigm case of lost standing because it involves insincerity or unfairness. Claim (5) flips this. Does lack of self-monitoring undermine authority more than explicit self-exemption?
