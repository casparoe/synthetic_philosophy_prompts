      *   Revision: **Amend (4) to distinguish normative standing from rhetorical efficacy.** (i.e., You *have* the standing, but people won't listen/respect it as much). This keeps the intuition of (4) without contradicting the theory of (1) and (3).
      *   Actually, simply **dropping (4)** is cleaner. But amending it preserves the user's intuition.
      *   Let's look at (5) again. Is it defensible? Some philosophers (e.g., Fritz) argue unwitting hypocrisy is less bad. Some argue it's worse because it shows a lack of moral perception. It's defensible but contentious.
      *   The (3) vs (4) contradiction is indefensible.
      *   So, the revision must address (3)/(4).
