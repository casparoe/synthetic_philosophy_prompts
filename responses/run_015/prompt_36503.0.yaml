answer: |-
  **Thesis**
  The Principal Principle and the Reflection Principle are not merely analogous norms but identical constraints on rational belief updating, differing only in their object of deference. Consequently, arguments claiming that deference to chance defines the concept of objective chance inadvertently commit one to the absurd view that deference to one's future self defines the concept of credence.

  **The parallel**
  Both principles mandate that current credence align with a privileged indicator of truth. The Principal Principle demands alignment with objective chance, while Reflection demands alignment with expected future credence. Structurally, both function as deference norms: you should adopt the value of the target variable unless you have specific reasons not to. In PP, the target is the external chance function; in Reflection, it is the internal future belief function. The rational agent treats their future rational self as an expert on truth, just as they treat objective chance as an expert on truth. The mathematical form is identical: current credence in A given the target value is X should be X. This identity suggests that chance and future rational opinion occupy the same functional role in epistemology. They are both "opinion leaders" that the current self must follow to maintain coherence. The distinction is merely ontological, not normative. Both principles prevent arbitrariness: one prevents ignoring the world's propensity, the other prevents ignoring one's own anticipated rationality. Furthermore, both principles serve to diachronically stabilize belief. Just as Reflection prevents arbitrary shifts in belief over time without new evidence, PP prevents arbitrary divergence between belief and worldly propensity. They are both coherence constraints linking different nodes in the web of belief: one links temporal slices of the agent, the other links the agent to the modal structure of the world. If rationality requires coherence, and both principles enforce coherence via deference, they are the same normative engine applied to different relata. The normative force comes from the structure of deference itself, not the specific nature of chance or time.

  **Where Reflection's counterexamples infect the PP**
  Standard counterexamples to Reflection involve knowing you will be drugged, causing irrational belief shifts. Here, you do not defer to the future self. Similarly, PP includes an "admissible evidence" clause. Traditionally, this excludes information about the future outcome itself. However, this clause should be understood as excluding evidence of epistemic malfunction in the chance-credence link. If you know the coin is biased despite being labeled fair, you have inadmissible evidence. This mirrors knowing you will be brainwashed. In both cases, the target (chance or future self) is compromised as a guide. The "inadmissible" label is not a unique feature of chance but a general defeater condition for any deference principle. It marks situations where the target variable ceases to be a reliable expert. Thus, the exception in PP is not about the nature of chance, but about the conditions under which deference is rational, exactly mirroring Reflection's exceptions. The inadmissibility clause simply codifies the requirement that the object of deference must be functioning properly as a truth-tracker. Therefore, the apparent disanalogy vanishes. Both principles hold ceteris paribus, where the "paribus" includes the proper functioning of the target system.

  **What this means for the constitutive reading**
  Philosophers often argue PP is constitutive of chance: to be a chance function just is to be something we defer to. If PP and Reflection are the same norm, this argument proves too much. It would imply that deference to your future rational self is constitutive of credence itself. This is absurd; credence exists even when we anticipate irrationality. Therefore, the constitutive reading of PP must be rejected or significantly weakened. Deference is a normative requirement for rational agents, not a conceptual truth about the target variables. The link between chance and credence is normative, not definitional. We can conceive of chance without deference when irrational, just as we conceive future beliefs without deference when expecting madness. Thus, the constitutive argument fails to distinguish chance from any other expert source. PP reveals a rule for management, not the essence of chance.

  **Biggest weakness of the argument**
  The most significant vulnerability in this argument is the ontological disparity between the objects of deference. Objective chance is mind-independent, whereas future credence is mind-dependent. The "inadmissible evidence" clause in PP often involves knowing the outcome via prophecy or time travel, which doesn't neatly map onto "epistemic malfunction" in the Reflection case. Knowing the outcome directly undermines chance's role as a guide regardless of malfunction, whereas knowing you will be drugged undermines the future self's rationality specifically. Collapsing these distinct types of defeaters into a single category of "malfunction" may obscure the unique metaphysical relationship between chance and frequency that grounds the Principal Principle in the first place.
