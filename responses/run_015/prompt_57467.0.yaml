answer: |-
  - The setup
  The paradox assumes that if killing is intrinsically bad, minimizing total killings must be the rational priority for any moral agent. For the slogan to function as a reply, it must deny that aggregate badness aggregates across agents or that "justification" operates via simple summation of values. Without this, the slogan merely asserts the conclusion it aims to prove.

  - The menu
  1. **The Semantic Block**: "Ends" picks out good states of affairs; "Means" picks out an act defined as impermissible; "Justify" means to make definitionally permissible. *Claim:* An act defined as wrong cannot be made right by outcomes. *Verdict:* **Platitude**. This is true by definition but begs the question against the consequentialist who denies the act is inherently wrong independent of outcomes.

  2. **The Agent-Centered Constraint**: "Ends" picks out aggregate utility; "Means" picks out the agent's violation of duty; "Justify" means to outweigh the duty. *Claim:* Agent-relative constraints prohibit violations even when aggregate utility demands them. *Verdict:* **Substantive**. This is the core deontological commitment, but it asserts the position rather than explaining why the constraint exists or why it trumps the five lives.

  3. **The Intentional Limit**: "Ends" picks out foreseen consequences; "Means" picks out intended violations; "Justify" means to license the intention. *Claim:* Intending harm is prohibited even if foreseeing identical harm is permitted. *Verdict:* **Substantive**. This relies on the Doctrine of Double Effect, offering a structural distinction regarding mental states rather than a mere block on calculation.

  4. **The Causal Inertness**: "Ends" picks out future states; "Means" picks out the current act token; "Justify" means to alter intrinsic nature. *Claim:* Good consequences do not causally alter the metaphysical nature of the act. *Verdict:* **Not-in-Dispute**. Consequentialists agree the act's nature doesn't change, but deny that nature determines permissibility, making this irrelevant to the normative clash.

  5. **The Excuse Confusion**: "Ends" picks out good outcome; "Means" picks out wrongful act; "Justify" means to eliminate blame. *Claim:* The act remains wrong, but the agent is blameless due to good outcomes. *Verdict:* **False**. Standard deontology holds the act is impermissible and often blameworthy regardless of outcome; this reading conflates justification with excuse.

  6. **The Integrity Preservation**: "Ends" picks out impersonal value; "Means" picks out agent's integrity; "Justify" means to demand alienation. *Claim:* Morality cannot require agents to abandon their foundational projects for impersonal gains. *Verdict:* **Substantive**. This shifts the debate to the nature of agency, offering a reason beyond rule-worship by appealing to the cost of moral alienation.

  - Which one my prof needed
  Your professor likely intended Reading 2 (The Agent-Centered Constraint) but delivered Reading 1 (The Semantic Block). Reading 2 is the only load-bearing option here because it acknowledges the consequentialist's calculation but denies its authority over the agent. However, merely stating that constraints exist doesn't solve the paradox; it just restates the deontological axiom. To actually answer the objection, the professor needed to explain *why* the constraint holds—perhaps via Reading 6 (Integrity)—rather than treating the slogan as a conversation-stopper. As it stood, the slogan functioned as a protective shield for the theory rather than a defense against the minimization argument.

  - My line for Thursday
  "I'm struggling to see how 'the ends don't justify the means' engages with the minimization argument rather than just restating the constraint. Are you suggesting the calculation is category-mistaken, or that my agency creates a special barrier against optimizing global outcomes? Because if it's the latter, I need to know why that barrier trumps the five lives."
