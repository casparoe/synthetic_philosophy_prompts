answer: |-
  The disagreement dividend is a conceptual artifact rather than a genuine problem for the coherence or advisability of moral trade. While the mathematics of trade indeed require value divergence to generate gains, the inference that agents should therefore incentivize error or spread opposing views collapses once you account for the distinction between factual error and value divergence, the economic risks of leakage, and the enforcement conditions required for trade to function at all. The intuition that moral trade creates a perverse incentive to cultivate falsehoods relies on a category mistake about what is being traded and ignores the negative externalities of propagating values you deem inferior.

  To see why this is an artifact, you must first separate factual claims from terminal values. Moral trade works because agents weight outcomes differently, not because they disagree on the mechanics of reality. In your example, the global health bloc and the long-term bloc likely agree that bednets save lives and that existential risk is bad; they disagree on the relative moral weight of a life saved today versus a life saved in the future. Wanting a trading partner to care less about near-term health than you do is not wanting them to be wrong about the world; it is wanting them to have complementary preferences. This is no more pernicious than a apple grower wanting a baker to want bread rather than apples. The divergence is in the utility function, not the model of the world. If you were to spread factual falsehoods to create a trading partner, you would undermine the epistemic integrity required to identify trade opportunities in the first place, making the strategy self-defeating.

  Even if we grant that spreading a competing moral view is the goal, the incentive to actively propagate it dissolves when you consider leakage and externalities. You noted the risk that a view leaks to people who never trade with you or to your own successors. This is not a minor caveat; it is the decisive factor. If you believe the other side's view is objectively worse than yours, then every dollar they spend on it without trading with you is a loss by your lights. The gains from trade are only a fraction of their total activity. For it to be rational to spread a view you consider inferior, the trade gains would have to outweigh the direct losses from them acting on that view in all non-trading contexts. Given that trade is often limited by trust, enforcement, and coordination costs, while value propagation is broad and uncontrolled, the expected value of spreading an opposing view is almost certainly negative. You want existing partners to remain distinct, but you do not want to create new ones at the cost of corrupting the broader moral landscape.

  The enforcement condition further neutralizes the threat. You asked whether anything changes when the trade is one-shot and unenforceable. It changes everything. Moral trade relies on the ability to commit to the swap. If you are dealing with a future generation or a civilization you cannot contact, there is no mechanism to ensure they hold up their end of the bargain. Without enforceability, the disagreement dividend disappears because there is no trade. Consequently, there is no incentive to cultivate a trading partner in the future if you cannot contract with them. You would simply invest in your own values. The perverse incentive only exists in a narrow window where trade is possible but values differ, and even then, it is confined to maintaining existing divergence, not creating new error.

  This leaves the uncomfortable philosophical residue: does benefiting from someone else's moral error corrupt your own integrity? Here, the verdict remains that this is a feature of a pluralistic universe, not a bug of moral trade. If moral realism is true and the other side is wrong, you are indeed benefiting from their mistake, just as you benefit from a market inefficiency. But benefiting from an existing state of affairs is not the same as causally responsible for it. Moral trade advises you to maximize the good by your own lights given the constraints of the world, including the existence of other agents with different lights. It does not advise you to reshape those lights if doing so reduces the total good by your own calculation. The disagreement dividend is a static gain from existing diversity, not a dynamic incentive to manufacture confusion.

  I am eighty percent confident in this verdict. The remaining uncertainty lies in the possibility of highly contained value propagation where leakage is negligible. If you could spread a competing view to a specific group with perfect quarantine, ensuring they only interact with you and never act on their values elsewhere, the math might tip toward incentivizing divergence. I would also move off this verdict if a robust framework of moral anti-realism were adopted where calling a view wrong is meaningless, turning the dividend into a pure preference satisfaction game without the tension of error. However, under standard assumptions of moral realism and open societies, the incentive to spread error is illusory. The disagreement dividend is real, but it is a dividend on existing diversity, not a subsidy for manufacturing it.
