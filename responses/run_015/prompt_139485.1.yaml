prompt: |-
  I lead a three-person environment-model team at a company that operates fleets of autonomous delivery robots inside large hospitals: the robots move pharmacy items, specimens, linen and meals along mapped corridors and through service lifts. My team owns the world model the planner reads, and we process roughly ten to fifteen change requests and incident reports per week: a corridor being re-floored, a supplier switching container, a new infection-control rule about which lifts may be used, a near-miss write-up from a porter. Right now we have no principled way to decide whether one of these is a fact to add, a fact to start watching, or evidence that the model itself is wrong about what the world contains.

  I want a decision procedure my on-call engineer can run in about thirty minutes, with a bachelor's-level engineering background and no formal logic, and then bring to a weekly ninety-minute review where two engineers sign off. Its output has to be auditable by an outside assessor months later, so each step needs to record what was decided and on what basis. Please ground it in what the frame problem literature actually distinguishes: inferring that an action left something alone without being told (the frame-axiom problem), unstated preconditions (the qualification problem), unstated downstream consequences (the ramification problem), and the version of the problem where a bounded agent has to decide what to think about at all rather than what to infer. Tell me which of those distinctions survive being turned into a half-hour checklist and which collapse under the simplification, and be explicit about which steps are judgment calls wearing procedural clothing.

  To start you off, here is the taxonomy we currently use, which I suspect is drawn in the wrong place. We call a fact baked-in when the planner could not be told about it at runtime even in principle — that a door is either open or shut, that a floor is a single level surface — flagged when it is representable and held fixed until an update arrives, and watched when something checks it at runtime with a named detector and a refresh interval. The category that actually causes our incidents is the fourth, unofficial one: silent dependencies, facts a plan's success relies on that appear in none of the three. My current rule is that every silent dependency must either get a monitor or get a named person's signature. Redraw that split if it misdescribes the problem, and add the second-order step: how to handle the case where the thing that would reveal a stale frame is itself inside the frame, because our detectors are mounted on the robots and can be occluded, mis-mounted, or simply not pointed at the relevant volume.

  Give the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it is a question about how much risk the hospital wants rather than about how the world is. Then run it on three real-shaped cases. First: a six-week renovation of the main spine corridor in which the vinyl is being replaced section by section with a different surface, hoarding narrows one stretch to well below our usual clearance, our localisation was tuned on the old floor's visual texture, and our braking distances were validated against the old floor's friction. Second: the pharmacy begins sending controlled drugs in a rigid sealed case that sits proud of the bin lip, where our bin-latched check is a simple beam break and our manifest check is a label scan; the proposed fix is to tag those deliveries large and route them into a deeper bin. Third: a near-miss report reveals that a fire door on a night route had been wedged open with a rubber stop, where our map's door state is binary and a wedged door reads as shut. At least one of these should come out with an answer that costs us something we would rather not pay — say plainly which, and what it costs. Finally, name one kind of change this procedure will systematically mishandle, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** 3-person environment-model team for autonomous delivery robots in hospitals.
      *   **Input:** 10-15 change requests/incidents per week (renovations, container changes, rules, near-misses).
      *   **Goal:** A 30-minute decision procedure for an on-call engineer (Bachelor's level, no formal logic) to categorize inputs, leading to a 90-minute weekly review (2 engineers sign off).
      *   **Requirement:** Auditable (record decisions/basis).
      *   **Theoretical Grounding:** Must relate to the Frame Problem literature (Frame Axioms, Qualification Problem, Ramification Problem, Relevance/Bounded Rationality). Must identify which distinctions survive simplification and which are "judgment calls wearing procedural clothing."
      *   **Current Taxonomy Critique:** "Baked-in" (static), "Flagged" (fixed until update), "Watched" (runtime check). Problem: "Silent Dependencies" (unstated reliance). Current rule: Monitor or Named Signature.
      *   **Second-Order Problem:** Detectors are inside the frame (can be occluded/broken).
      *   **Output Format:** Ordered questions, sufficient answers, stop conditions, hand-off points (risk vs. fact).
      *   **Test Cases:**
          1.  Corridor renovation (floor texture, clearance, friction).
          2.  Pharmacy controlled drugs (new container, beam break issue).
          3.  Fire door wedged open (binary state mismatch).
      *   **Constraint:** At least one case must result in an undesirable cost.
      *   **Final Requirement:** Name one kind of change the procedure will systematically mishandle.

  2.  **Analyze the Theoretical Grounding (Frame Problem Literature):**

      *   *Frame Axiom Problem:* What stays the same after an action? (e.g., moving a box doesn't change the wall color). In this context: Does a change in Floor A affect Localization in Corridor B?
      *   *Qualification Problem:* What preconditions are needed for an action to succeed? (e.g., the door must be unlocked, not just open). In this context: The beam break assumes the box fits *in* the bin, not *on* it.
      *   *Ramification Problem:* What are the indirect consequences? (e.g., narrowing a corridor increases travel time, which might timeout a delivery SLA).
      *   *Relevance/Bounded Rationality:* What should the agent think about? (e.g., ignoring the color of the walls because it doesn't affect navigation).
      *   *Simplification Reality:* A 30-minute checklist cannot truly solve the Frame Problem. It forces heuristics. "Frame Axioms" become "Coupling Analysis." "Qualification" becomes "Precondition Verification." "Ramification" becomes "Side-Effect Scan." "Relevance" becomes "Priority Triage."

  3.  **Redraw the Taxonomy:**

      *   Current: Baked-in, Flagged, Watched, Silent.
      *   Critique: "Baked-in" is dangerous. Everything should be representable if possible. "Silent" is the failure mode.
      *   Proposed Taxonomy for the Procedure:
          1.  **Static Model (Map/Geom):** Hard constraints (walls, lift shafts).
          2.  **Dynamic State (Flags):** Things that change but are reported (door open/closed, lift out of service).
          3.  **Runtime Verification (Sensors):** Things the robot checks itself (obstacle detection, bin full).
          4.  **Operational Assumption (The "Silent" Killer):** Things we *think* are true but aren't modeled or checked (floor friction, visual texture, box rigidity).
      *   *The Second-Order Problem:* If a sensor fails, do we know? This requires "Meta-Monitoring" (is the monitor healthy?).

  4.  **Drafting the Decision Procedure (The Checklist):**

      *   *Goal:* 30 mins. Needs to be linear.
      *   *Step 1: Classification.* Is this a change to geometry, state, or physics/assumptions?
      *   *Step 2: Coupling (Frame Axiom).* Does this change break existing assumptions elsewhere?
      *   *Step 3: Qualification (Preconditions).* Does the current plan rely on this being true without checking?
      *   *Step 4: Ramification (Side Effects).* Does fixing this break something else?
      *   *Step 5: Monitor Health (Second-Order).* If we watch this, can the watch fail silently?
      *   *Step 6: Risk Hand-off.* If uncertainty remains, it's a risk decision, not an engineering one.

  5.  **Refining the "Judgment Calls":**

      *   Need to be explicit where the checklist pretends to be objective but is actually subjective.
      *   Example: Determining "coupling" often relies on intuition about the codebase.
      *   Example: Deciding if a risk is "acceptable" is a business/hospital decision, not engineering.

  6.  **Developing the Test Cases:**

      *   *Case 1 (Renovation):*
          *   Geometry changes (hoarding) -> Dynamic State.
          *   Texture/Friction -> Operational Assumption (Silent Dependency).
          *   Cost: Slowing down robots or stopping service (undesirable cost).
      *   *Case 2 (Pharmacy Box):*
          *   Qualification Problem (Beam break assumes box inside).
          *   Fix: Tag large/Route deep.
          *   Risk: Reduced capacity.
      *   *Case 3 (Fire Door):*
          *   State Mismatch (Wedged = Shut in map, but Open in reality).
          *   Frame Axiom issue (Door state assumed stable).
          *   Cost: Need human patrol or sensor upgrade.

      *   *Selection for "Undesirable Cost":* Case 1 is the best candidate. Slowing down the fleet or halting it during renovation costs money/time. Case 2 reduces capacity (also a cost). Let's make Case 1 the one where we have to *stop* using the corridor for autonomy, forcing manual portering (high cost). Or Case 2 where we have to reject certain deliveries. Let's go with Case 1 requiring a "Slow Mode" that breaks SLA guarantees.

  7.  **Addressing the "Systematic Mishandling":**

      *   What does this checklist miss?
      *   *Emergent Behavior / Correlation:* Things that aren't causal but statistical. E.g., "Lunchtime congestion." The checklist looks for structural changes, not statistical drift.
      *   *Or:* "The Unknown Unknown." A change we don't know about yet.
      *   *Better:* "Gradual Drift." The checklist handles discrete events (renovation, new box). It handles *events*, not *processes*. A floor getting slowly dirtier until localization fails is a drift, not a change request.

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the theoretical grounding and the practical constraints.
      *   **The Taxonomy Redraw:** Define the four categories clearly.
      *   **The Procedure (The Checklist):** Step-by-step questions, exit criteria, audit log requirements.
      *   **Theoretical Mapping:** Explicitly map steps to Frame/Qualification/Ramification/Relevance and admit where the simplification breaks.
      *   **The Test Cases:** Run the three scenarios through the procedure.
      *   **The Cost:** Identify the painful outcome.
      *   **The Blind Spot:** Name the systematic failure mode.

  9.  **Refining the Content (Self-Correction during drafting):**

      *   *Check:* Did I address the "detector inside the frame" issue?
      *   *Correction:* Need a specific step on "Monitor Integrity." If we add a watch, who watches the watcher?
      *   *Check:* Is it 30 minutes?
      *   *Correction:* Keep questions binary or multiple-choice where possible. Limit open-ended analysis.
      *   *Check:* Auditability.
      *   *Correction:* Require a "Decision Ticket" field for each step.
      *   *Check:* Judgment calls.
      *   *Correction:* Highlight these in bold or a specific section.

  10. **Final Polish:** Ensure tone is professional, engineering-focused, but honest about the limitations of the procedure. (The prompt asks for "plainly which, and what it costs" regarding the undesirable outcome).

      *(Self-Correction on Case 1 Cost)*: The prompt asks for *one* case to come out with a cost we'd rather not pay.
      *   Case 1 (Renovation): If we treat friction/texture as "Operational Assumption," we realize the model is invalid. We must either recalibrate (takes time) or restrict operations. Let's say we must restrict operations to "Human Escort Mode" for that corridor. That costs labor.
      *   Case 2 (Pharmacy): We route to deeper bin. Cost is reduced capacity.
      *   Case 3 (Door): We need a sensor. Cost is hardware.
      *   Decision: Case 1 is the most impactful "operational" cost. I will select that.

      *(Self-Correction on Theoretical Distinctions)*:
      *   Frame Axiom -> "Coupling Check."
      *   Qualification -> "Precondition Audit."
      *   Ramification -> "Side-Effect Scan."
      *   Relevance -> "Priority Triage."
      *   Which collapse? Frame and Ramification often merge in practice (what changed vs what else changed). Qualification is distinct. Relevance becomes a risk threshold.

      *(Self-Correction on Second-Order)*:
      *   The prompt asks about detectors being occluded. This is the "Monitor Integrity" step.

      *(Self-Correction on Mishandled Change)*:
      *   "Gradual Drift" is good. "Correlated Failures" is also good. Let's go with "Gradual Drift" (The Sorites Paradox version of the Frame Problem). The checklist handles *events*, not *states degrading over time*.

  11. **Final Review against constraints:**
      *   30 mins? Yes, if scoped.
      *   Bachelor's level? Yes, avoid logic notation.
      *   Auditable? Yes, ticket fields.
      *   Theoretical grounding? Yes, explicit section.
      *   Three cases? Yes.
      *   One cost? Yes.
      *   One mishandled change? Yes.

      *Let's write it.*
answer: |-
  ## The Environment-Model Decision Procedure (EMDP)

  This procedure is designed to convert unstructured incident reports and change requests into auditable model updates. It forces the engineer to categorize the *type* of uncertainty before selecting a *type* of mitigation.

  ### 1. The Redrawn Taxonomy
  Your current taxonomy (Baked-in, Flagged, Watched, Silent) mixes *representation* with *monitoring*. We replace it with four categories based on **dependency visibility**:

  1.  **Structural Invariants (The Map):** Geometry, topology, and hard physics (e.g., wall locations, lift shaft dimensions). These are assumed true unless a formal map update occurs.
  2.  **State Flags (The Dashboard):** Discrete variables reported by external systems (e.g., lift out-of-service, door locked). These are trusted until a contradictory report arrives.
  3.  **Runtime Verifiers (The Sensors):** Conditions the robot checks locally before acting (e.g., obstacle detection, bin beam-break). These are trusted only if the sensor health is confirmed.
  4.  **Operational Assumptions (The Silent Killers):** Facts the planner relies on that are neither mapped, flagged, nor verified (e.g., floor friction, visual texture for localization, box rigidity). **This is where incidents happen.**

  ### 2. The 30-Minute Checklist
  **Input:** A change request or incident report.
  **Output:** A completed "Model Change Ticket" with a recommended action.
  **User:** On-call Engineer.

  **Step 1: Coupling Analysis (The Frame Axiom Check)**
  *   **Question:** Does this change affect *only* the reported component, or does it invalidate assumptions about neighboring components?
  *   **Sufficient Answer:** "Only the component" OR "Neighbors X and Y are affected."
  *   **Stop Condition:** If "Neighbors," list them. If you cannot list them in 5 minutes, **HAND OFF** to Weekly Review.
  *   **Audit Log:** Field `Coupling_Scope`.
  *   **Theory:** Addresses the *Frame Problem* (what stays the same).
  *   **Judgment Call:** Determining "neighbors" relies on mental models of the codebase, not just physical proximity.

  **Step 2: Precondition Audit (The Qualification Check)**
  *   **Question:** Is there an existing plan that succeeds *only if* this fact remains true, without checking it first?
  *   **Sufficient Answer:** "No plans rely on this" OR "Plan Z relies on this without verification."
  *   **Stop Condition:** If "Plan Z," move to Step 3. If "No plans," categorize as **State Flag** and close ticket.
  *   **Audit Log:** Field `Dependent_Plans`.
  *   **Theory:** Addresses the *Qualification Problem* (unstated preconditions).

  **Step 3: Verification Integrity (The Second-Order Check)**
  *   **Question:** If we add a sensor/monitor to check this, can that monitor fail silently (occluded, dirty, disconnected)?
  *   **Sufficient Answer:** "Monitor is self-validating" OR "Monitor can fail silently."
  *   **Stop Condition:** If "Fail silently," you must propose a *meta-monitor* (e.g., heartbeat, redundancy) or **HAND OFF** to Weekly Review.
  *   **Audit Log:** Field `Monitor_Integrity_Risk`.
  *   **Theory:** Addresses the *Relevance Problem* (bounded agents cannot check everything, so checks must be reliable).

  **Step 4: Side-Effect Scan (The Ramification Check)**
  *   **Question:** Does fixing this (e.g., adding a check, changing a route) create a new bottleneck or failure mode elsewhere?
  *   **Sufficient Answer:** "No downstream impact" OR "Impacts SLA/Capacity/Safety."
  *   **Stop Condition:** If "Impacts," calculate the cost. If the cost exceeds engineering authority (see Step 5), **HAND OFF**.
  *   **Audit Log:** Field `Ramification_Cost`.
  *   **Theory:** Addresses the *Ramification Problem* (indirect consequences).

  **Step 5: Risk Threshold (The Policy Hand-off)**
  *   **Question:** Does the residual risk require the hospital to accept a change in service level (slower delivery, reduced capacity, manual escort)?
  *   **Sufficient Answer:** "Engineering can absorb" OR "Hospital must accept risk."
  *   **Stop Condition:** If "Hospital must accept," **HAND OFF** to Weekly Review for stakeholder sign-off.
  *   **Audit Log:** Field `Risk_Owner`.
  *   **Judgment Call:** This is not an engineering fact; it is a business policy decision wearing procedural clothing.

  ---

  ### 3. Theoretical Survival Analysis
  You asked which distinctions survive simplification and which collapse.

  *   **Survives:** **The Qualification Problem.** Step 2 effectively isolates unstated preconditions. It is distinct enough that a bachelor's engineer can identify "we assume X is true but never look."
  *   **Survives:** **The Relevance Problem (Boundedness).** Step 3 and 5 force the engineer to admit they cannot watch everything. It forces a choice: watch it, assume it, or pay for a human to watch it.
  *   **Collapses:** **Frame vs. Ramification.** In Step 1 and Step 4, the distinction between "what stayed the same" (Frame) and "what else changed" (Ramification) blurs. In a 30-minute window, an engineer treats both as "Coupling." The checklist merges them into "Scope of Impact."
  *   **Collapses:** **Judgment as Procedure.** Step 5 is a risk policy decision, but the checklist frames it as a question the engineer answers. The "Sufficient Answer" is often a guess about what management will tolerate. This is judgment wearing procedural clothing.

  ---

  ### 4. Running the Cases

  #### Case 1: Corridor Renovation (Vinyl, Hoarding, Texture, Friction)
  *   **Step 1 (Coupling):** Affects Geometry (Hoarding) AND Physics (Friction/Texture). **Neighbors:** Localization module (texture), Control module (friction).
  *   **Step 2 (Precondition):** Planner assumes standard friction for braking distance. Assumes visual features for localization. Both are **Operational Assumptions**.
  *   **Step 3 (Verification):** Can we monitor friction/texture at runtime? No, not without skidding or losing localization first. Monitor integrity is low.
  *   **Step 4 (Side-Effect):** If we reroute, we congest other corridors. If we slow down, we miss SLAs.
  *   **Step 5 (Risk):** The model is invalid for this corridor during renovation. We cannot verify safety at runtime.
  *   **Decision:** **HAND OFF.**
  *   **Weekly Review Outcome:** The corridor must be marked "No Autonomous Access" during renovation. Deliveries require manual porter escort.
  *   **The Cost:** **This is the undesirable cost.** You lose automation in the main spine for six weeks. Labor costs spike, and delivery times increase. You are paying for the model's inability to handle "temporary physics changes."

  #### Case 2: Pharmacy Controlled Drugs (Rigid Case, Beam Break)
  *   **Step 1 (Coupling):** Affects Bin Loading logic only. No neighbors.
  *   **Step 2 (Precondition):** Beam break assumes object is *inside* bin perimeter. New case sits *proud*. This is a **Qualification Failure**.
  *   **Step 3 (Verification):** Can we monitor "proudness"? LiDAR could check bin volume, but adds compute.
  *   **Step 4 (Side-Effect):** Proposed fix (route to deeper bin) reduces total fleet capacity by ~5%.
  *   **Step 5 (Risk):** 5% capacity loss is within engineering authority.
  *   **Decision:** **Implement Fix.** Tag deliveries "Oversized," route to deep bins. Update `Dependent_Plans` log.
  *   **Audit:** Ticket records the Qualification Failure and the capacity trade-off.

  #### Case 3: Fire Door Wedged Open (Binary State Mismatch)
  *   **Step 1 (Coupling):** Affects Route Planning (door state).
  *   **Step 2 (Precondition):** Planner assumes Map State = Physical State. Wedged door = Shut in Map, Open in Reality. **Operational Assumption** failure.
  *   **Step 3 (Verification):** Robot sensors see "open passage," Map says "wall/door." Can we monitor this? Yes, localization drift or obstacle mismatch. But if the door is wedged *open*, the robot sees a clear path. The monitor (LiDAR) agrees with the *physical* reality, not the *map*.
  *   **Step 4 (Side-Effect):** If we trust sensors over map, we might enter unsafe zones. If we trust map, we block valid paths.
  *   **Step 5 (Risk):** Safety critical.
  *   **Decision:** **HAND OFF.**
  *   **Weekly Review Outcome:** Install magnetic contact sensors on all fire doors (Hardware cost) OR mandate nightly porter rounds to verify door states (Labor cost).
  *   **Audit:** Ticket records the "Silent Dependency" on door integrity.

  ---

  ### 5. The Systematic Blind Spot

  **The Change This Procedure Will Mishandle:** **Gradual Drift (The Sorites Frame Problem).**

  **Why:** This procedure is event-driven. It triggers on a *request* or an *incident* (a floor being re-laid, a box changing shape, a door wedged). It cannot detect **continuous degradation**.
  *   *Example:* The hospital floor gets progressively dirtier over 18 months. Localization confidence drops by 0.1% per month. No single change request is filed. No incident occurs until a robot misses a turn.
  *   *Failure Mode:* Step 1 asks "Does this change affect..." If there is no "this" (no discrete event), the checklist is never run. The Operational Assumption (clean floor) rots silently.
  *   *Mitigation:* You need a separate, automated "Model Health" dashboard that tracks localization confidence and braking error margins over time, independent of human change requests. This checklist cannot catch what no one reports.
