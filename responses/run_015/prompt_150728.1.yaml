  Since she ignores the correlation, she decides based on the causal consequences of her action alone.
  *   **Her Utility:** She values her welfare and the other's welfare equally ($1:1$).
  *   **The Physics:** Sending 1 unit costs her 1 welfare unit but grants the other 3 welfare units.
