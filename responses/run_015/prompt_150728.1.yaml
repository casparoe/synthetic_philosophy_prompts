  R.'s verdicts on the Smoking Lesion and the Coin-Flip Mugging are the decisive constraints. In both cases, a statistical correlation existed between her action and an outcome (cancer/payout), but the link was not mediated by her decision algorithm (the lesion was physiological; the prediction was a coin flip). She ignored the correlation and maximized causal expected utility.

