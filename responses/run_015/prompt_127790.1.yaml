answer: |-
  ### The Argument of the Architectural Present

  Consider the novel not as a river flowing through the reader's mind, but as a bound object resting in the **architectural present**. In this state, the manuscript possesses a uniform **ontological density**: the ink on the final page is as dry, as fixed, and as existent as the ink on the first. The **implicit chronology**—the sequence of events as they occurred within the story's world—is a fixed arrangement, distinct from the **discourse order**, which is the sequence in which the reader encounters them.

  The Rietdijk–Putnam assertion translates thus: If the text exists fully in the architectural present, then the "future" of the implicit chronology is as real as the "present" of the discourse order.

  To demonstrate this, we invoke the narrative equivalent of the Andromeda Paradox. Imagine a vast textual distance between the reader's current locus of attention (the **Reading Now**) and a pivotal event in the implicit chronology (the **Distant Plot Point**). Consider two variations of narrative stance, analogous to observers in relative motion:

  1.  **The Linear Scene:** The narrator employs *scene*, slowing the **narrative velocity** to match the unfolding of action. Here, the Reading Now aligns closely with the Implicit Chronology. The Distant Plot Point resides in the **projected future**, possessing the low ontological density of something merely anticipated.
  2.  **The Proleptic Summary:** The narrator employs *prolepsis* (flash-forward) combined with *summary*. With a slight shift in narrative stance—a mere change in tense or focalization—the Reading Now jumps forward. The Distant Plot Point is suddenly rendered in the grammatical past. It is no longer projected; it is recounted.

  In the first stance, the Distant Plot Point is unwritten potential. In the second, it is settled fact. Yet, both stanzas occupy the same physical book. The **architectural present** of the manuscript does not change between these stances; only the **discourse order** shifts. If the Distant Plot Point possesses high ontological density (it is written fact) for the *proleptic* stance, it must possess that same density for the *linear* stance, even when the linear reader has not yet turned the page.

  Therefore, there is no globally valid **Reading Now**. The "present" is merely a function of where the reader's eye rests within the fixed architecture. The **implicit chronology** is a block of equal reality from beginning to end. The sensation of a moving "now" is an illusion of the **discourse order**, imposed by the act of reading upon a structure that already exists in its entirety.

  ***

  ### Residue Report

  **1. Claims Surviving Without Distortion**
  *   **The Denial of a Universal "Now":** This translates perfectly to the distinction between *story* (the full timeline) and *plot* (the arrangement of information). In non-linear fiction, the absence of a master timeline is a structural fact. The "present" is always local to the chapter, never global to the book.
  *   **The Reality of the Future:** In the **architectural present**, the final chapter is as real as the first. This maps cleanly to the Block Universe's claim that the future exists as concretely as the past. The novelist knows the ending is fixed before the reader begins; the physicist argues the future is fixed before the observer arrives.

  **2. Claims Surviving Only Through Forced Analogy**
  *   **The Relativity of Simultaneity:** In physics, a change in velocity *physically alters* which events are simultaneous. In narrative, a change in **narrative velocity** (scene vs. summary) only alters the *access* to events, not their simultaneity. The text does not rearrange itself based on how fast I read. To make this work, I had to equate "simultaneity" with "narrative accessibility," which is an epistemological shift (what I know) rather than an ontological one (what exists).
  *   **The Andromeda Distance:** In physics, spatial distance magnifies the temporal discrepancy caused by velocity. In narrative, "distance" is merely page count or chronological gap. A shift from *scene* to *summary* does not drastically alter the "reality" of a distant chapter in the way velocity alters the "reality" of a distant galaxy. The analogy holds structurally but lacks the causal stakes; turning a page does not rewrite the universe, it only reveals it.

  **3. Claims With No Expression in Compositional Terms**
  *   **Causal Necessity:** The Rietdijk–Putnam argument relies on the logic that if an event *can* be present for one observer, it *must* be real for all to avoid contradiction. In narrative, there is no such necessity. An author can write a "choose-your-own-adventure" where the Distant Plot Point literally does not exist for certain readers. The Block Universe argues the future is fixed *despite* our inability to see it; Narrative craft knows the future is fixed *because* it was written. The "must" in physics is a law of nature; the "must" in fiction is a law of completion.
  *   **The Observer's Physicality:** In physics, the observer's body and motion are part of the physical system being measured. In narrative, the reader is external to the text. The "Reading Now" does not interact with the **Architectural Present**; it merely scans it. There is no narrative equivalent to the observer affecting the simultaneity plane through their physical mass or speed.

  ***

  ### Conclusion: The Ordering of Consciousness

  The untranslatable residue reveals that the Block Universe argument is not a discovery about the nature of time, but a description of the nature of *artifact*.

  The Rietdijk–Putnam argument succeeds in narrative terms because a novel *is* a block universe. It is a completed object where the end exists before the beginning is read. However, the residue—the lack of causal necessity and the externality of the reader—exposes the argument's weakness when applied to lived reality. Narrative craft demonstrates that "time" is fundamentally an **ordering problem for consciousness** (the discourse order), not a dimension of the world (the architectural present).

  The Block Universe relies on the "view from nowhere"—the perspective of the Author who sees all pages at once. But consciousness is not an Author; it is a Reader. For the Reader, the **ontological density** of the unwritten page is genuinely different from the written one, because the act of reading *creates* the present moment through attention. The untranslatable residue suggests that the Block Universe is a category error: it mistakes the *map* (the completed physical theory, which looks like a finished manuscript) for the *territory* (the lived experience, which is always a linear discourse).

  Time is not a dimension to be surveyed; it is a sequence to be endured. The Block Universe argument proves only that if you treat time as a text, it behaves like a text. It does not prove that life is a text.
