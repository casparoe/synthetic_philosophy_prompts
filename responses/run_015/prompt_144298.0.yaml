      *   **Thesis:** "Scaffold" is a copycat concept. Material properties (rigidity, etc.) are projected onto abstract/digital structures. This slippage allows grant panels to borrow mechanistic authority across domains illegitimately.
      *   **Goal:** A Q&A prep sheet. No citations (can't look them up). Needs specific sections: Objections (ordered), Concessions, Killer Replies, Weakest Point, The Dreaded Question, and "What Would Change My Mind."
      *   **Tone:** Professional, sharp, respectful of the interdisciplinary mix, slightly conversational (matching the user's "second coffee" vibe).

