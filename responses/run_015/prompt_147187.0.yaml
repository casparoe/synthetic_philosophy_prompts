answer: |-
  Dear Friend,

  It is entirely understandable that you felt your question was sidestepped rather than answered, for the slogan meaning is use is often wielded as a conversation stopper when it ought to serve as a starting point for deeper analysis. Your intuition that the phrase is being stretched beyond its bearing is correct, primarily because Wittgenstein's remark is susceptible to at least three distinct interpretations ranging from a mild methodological suggestion to a radical metaphysical claim, and your colleague's dismissal relies on conflating these layers. To see where the argument frays, we must disentangle these readings sequentially, examining the defensibility of each, their capacity to support your colleague's dismissal of uninterpreted constants, and how each aligns with the notion of family resemblance among language games.

  Consider first the weakest and most defensible reading, which treats meaning is use as a methodological heuristic rather than a constitutive definition. On this view, the slogan simply advises us that if we want to understand what a word or symbol means, we should look at how it is employed in practice rather than searching for a corresponding mental image or abstract object. This claim is largely uncontroversial and defensible, as it correctly identifies that dictionary definitions and ostensive definitions often fail to capture the nuance of actual communication. However, this reading does not support your colleague's dismissal of your question. Even an uninterpreted constant in a formal axiom system has a use, namely its role in syntactic manipulation and derivation according to the rules of inference. If meaning is found by looking at use, and the symbol is used in proofs, then it possesses meaning on this reading, even prior to model-theoretic interpretation. Regarding family resemblance, this heuristic reading has little substantive connection to the concept, as it does not yet commit to the idea that different uses constitute different games, but merely suggests where to look for evidence of meaning.

  Moving to a stronger interpretation, we encounter the view that semantic properties are reducible to the functional or inferential role a symbol plays within a system. Here, meaning is not just evidenced by use but is constituted by it. This is defensible within the philosophy of logic, particularly in proof-theoretic semantics, where the meaning of a logical constant is defined by its introduction and elimination rules. Under this reading, your question about pre-interpretive content becomes category mistake, not because the symbol is meaningless, but because its meaning is exhausted by its syntactic behavior. This still does not fully support your colleague's dismissal, however, because the symbol does have a syntactic use even without a semantic model. The connection to family resemblance here is more robust, as the meaning of the symbol is determined by its specific moves within a particular language game of calculation. If the game changes, say from formal derivation to physical application, the meaning shifts, much like family members share overlapping traits without a single essential core. Yet, this view grants the symbol meaning via its syntactic rules, contradicting the claim that it is like an invisible object with no color.

  Finally, we arrive at the radical reading, which posits that there is no fact of the matter about meaning independent of actual communicative practice within a linguistic community. This is the Kripkean skeptical interpretation, suggesting that without a history of actual usage by speakers to establish normativity, there is no meaning. This claim is highly controversial and arguably indefensible without accepting significant skeptical consequences about rule-following. However, this is the only reading that genuinely supports your colleague's dismissal. If meaning requires actual communal employment for communication, and no mathematician has ever used that bare symbol to communicate outside a specific interpretation, then on this view, the symbol indeed lacks meaning. Your colleague's analogy of the invisible object suggests he is operating under this radical assumption, treating the symbol as metaphysically empty until social practice fills it. This reading relies heavily on the concept of family resemblance and language games, as it insists that meaning only arises within the lived practice of a community playing a game. Without players, there is no game, and without a game, there is no meaning.

  It is almost certain that your colleague was invoking this third, radical interpretation, perhaps unconsciously blending it with the second. His comparison of the symbol to an invisible object reveals a verificationist instinct, implying that semantic content requires empirical or communicative traction to exist. Yet, this stretches the slogan because it ignores the specific language game of formalism itself, where the use of symbols is precisely their manipulation independent of interpretation. In the game of formal mathematics, the uninterpreted constant has a clear role and thus, by the lights of the first two readings, a clear meaning. The family resemblance concept actually undermines his dismissal if we acknowledge that formal manipulation is a distinct language game from empirical description. Just as the word game means different things in different contexts, the symbol means something in the context of syntax even if it means something else in the context of model theory.

  You are right to suspect the slogan is doing too much work here. By collapsing the distinction between syntactic use and semantic interpretation, your colleague has used a philosophical tool designed to clarify language to instead obscure the specific practices of mathematics. I encourage you to press the point by asking him to specify which language game he believes the symbol is failing to participate in, for if he admits it participates in the game of derivation, then the claim that it lacks meaning collapses unless he commits to the radical view that only communicative games count. I hope this disambiguation helps you reclaim the validity of your question in future discussions.

  Warmly,

  A Fellow Traveler in Philosophy
