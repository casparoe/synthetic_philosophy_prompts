              2.  *Relocation:* DSM-III (Ego-dystonic homosexuality). Jurisdiction retained over the *distress*, not the orientation.
              3.  *Repeal:* 1987 (Removal of Ego-dystonic).
          *   *Szasz's Prediction:* He would predict *Relocation*. Psychiatry never gives up power; it shifts the goalposts from "the behavior is sick" to "the feeling about the behavior is sick." The episode confirms this prediction.

