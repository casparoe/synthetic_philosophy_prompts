      *   *Mathematical Basis:* Gödel's Incompleteness Theorems. A formal system can encode statements about itself. The Gödel sentence says "I am unprovable."
      *   *Philosophical Leap:* This structural self-reference *is* (or gives rise to) the subjective feeling of "I."

