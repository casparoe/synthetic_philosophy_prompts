      *   *Syntax vs. Semantics:* Math is syntactic (symbol manipulation). Minds have semantics (meaning, qualia). This is the Chinese Room argument territory.
      *   *Causality:* In math, the loop is static/abstract. In brains, it's causal/dynamic.
      *   *The "Hard Problem":* Why does the loop *feel* like something? Math doesn't feel.
