answer: |-
  ### Stage 1: Brainstorming Candidate Activities

  Here are three potential designs, evaluated against your constraints (12 participants, 90 minutes, no prior disclosure of the Doomsday Argument, point-based scoring).

  **Candidate 1: The "Civilization Timeline"**
  *   **Concept:** Participants are told they are "observers" in a simulated civilization. A hidden die roll determines if the civilization lasts 100 turns (Short) or 10,000 turns (Long). They are assigned a random turn number $n$. They must bet on Short vs. Long.
  *   **Pros:** Narratively close to the actual argument.
  *   **Cons:** Logistically abstract. "Turns" feel less tangible than physical objects. With only 12 participants, the statistical power is low unless you run many rounds, which eats time. It risks becoming a role-play exercise rather than a probability demonstration.

  **Candidate 2: The "Blind Line-Up"**
  *   **Concept:** Participants physically stand in a line. A random cutoff $N$ is chosen (e.g., 20 or 200). They are blindfolded, placed in position $n$, and asked to estimate $N$.
  *   **Pros:** Highly embodied; captures the "birth rank" intuition viscerally.
  *   **Cons:** Logistically fragile. If $N=20$, everyone fits in the room, and the "Long" hypothesis is hard to simulate physically without empty chairs representing non-existent people. It confuses the *sample* (the 12 participants) with the *population* (humanity), potentially reinforcing the "we are special" bias you want to disrupt.

  **Candidate 3: The "Two Vaults" (Urn Model)**
  *   **Concept:** Two opaque containers. Vault S contains 100 numbered tokens. Vault L contains 100,000 numbered tokens. A coin flip selects a Vault. A participant draws one token, sees number $n$, and bets on which Vault was selected.
  *   **Pros:** Mathematically pristine. Isolates the likelihood ratio $P(n|S)$ vs $P(n|L)$. Easy to score. The physical act of drawing a token mirrors the "finding oneself" datum.
  *   **Cons:** Can feel like a generic probability puzzle rather than an existential one *unless* the debrief is handled carefully.

  **Selection:** I recommend **Candidate 3 (The Two Vaults)**.
  **Why:** You are teaching a room that includes a retired physicist. They will smell a rat if the mechanics are fuzzy. The Urn model is the canonical representation of the Doomsday Argument for a reason: it cleanly separates the *Prior* (coin flip) from the *Likelihood* (the number drawn). It allows you to run multiple rounds quickly to build intuition before hitting them with the philosophical implication. The "generic puzzle" feel is actually a feature: it prevents them from deploying pre-existing defenses against the Doomsday Argument until *after* they have committed to the logic in the game.

  ---

  ### Stage 2: The Full Activity Design

  **Title:** The Sequence Lottery
  **Time:** 90 Minutes
  **Participants:** 12
  **Materials:**
  *   Two opaque bags/boxes (labeled "Vault A" and "Vault B" only during setup, then covered).
  *   **Vault S (Small):** 100 physical tokens/paper slips numbered 1–100.
  *   **Vault L (Large):** A sealed envelope containing a number generated uniformly between 1–100,000 (prepared by you beforehand via script). *Note: Do not put 100,000 slips in a bag; it's impractical. Use the "sealed envelope" method for the Large Vault to maintain the mathematical reality without the physical tedium.*
  *   Scorecards for participants (columns: Round, Drawn Number, Bet, Points).
  *   A coin.
  *   Whiteboard.

  #### Phase 1: Calibration (20 Minutes)
  1.  **Introduction:** Tell participants this is a game of pattern recognition and probability. There is no trick, just math. Points determine the "winner" at the end (bragging rights).
  2.  **The Setup:** Place both Vaults on the table. Explain:
      *   "One Vault contains 100 numbered items (1–100). The other contains 100,000 numbered items (1–100,000)."
      *   "For each round, I will flip a coin. Heads = Small Vault. Tails = Large Vault."
      *   "I will draw one item from the chosen Vault and show you the number."
      *   "Your job: Bet on which Vault I drew from."
  3.  **Practice Rounds:** Run 3 rounds where you **reveal the Vault** after the bet.
      *   *Goal:* Let them feel the Bayesian update. If you show number '95', they should scream "Small Vault!" If you show '5', they will hesitate.
      *   *Scoring:* 10 points for a correct bet. 0 for incorrect.

  #### Phase 2: The Blind Test (30 Minutes)
  1.  **The Shift:** Tell them: "Now we change the rules. You are no longer betting on *my* draw. **You are the draw.**"
  2.  **The Procedure:**
      *   Flip the coin (keep the result hidden).
      *   Select the corresponding Vault (hidden).
      *   Hand each participant a sealed envelope. Inside is a number drawn from that Vault. (For the Large Vault, use your pre-generated list of 12 random numbers).
      *   **Crucial Instruction:** "Look at your number. This is your **Position**. Do not show anyone else."
      *   **The Bet:** Each participant writes down: "I believe I am in the [Small / Large] Vault."
      *   **Confidence:** They also wager 1–10 points of their accumulated score on their confidence.
  3.  **The Reveal:** Collect the bets. **Do not reveal the Vault.**
      *   Instead, ask: "How many of you drew a number less than 100?" (All hands will go up).
      *   Ask: "How many of you bet on Small?" (Most should).
      *   **Stop.** Do not resolve the bets yet. Tell them the "House" (you) is holding the truth until the debrief. This creates the tension required for the philosophical turn.

  #### Phase 3: The Debrief (40 Minutes)
  *This is where the Doomsday Argument is assembled from the pieces they just handled.*

  **Step 1: The Mapping (10 mins)**
  Draw two columns on the whiteboard: **The Game** vs. **The World**.
  *   **Vault S** $\rightarrow$ Humanity goes extinct soon (Total humans $\approx$ 100 billion).
  *   **Vault L** $\rightarrow$ Humanity lasts eons (Total humans $\approx$ 100 trillion).
  *   **The Coin Flip** $\rightarrow$ Our prior ignorance (50/50 chance of either future).
  *   **Your Number** $\rightarrow$ Your **Birth Rank** (approx. 100 billionth human born).
  *   **The Bet** $\rightarrow$ Your prediction of humanity's future duration.

  Ask: "In the game, if you drew #15, why did you bet on the Small Vault?"
  *Expected Answer:* "Because it's way more likely to draw #15 from the Small Vault than the Large one."
  *Facilitator Note:* Write the Likelihood Ratio on the board: $P(n|S) / P(n|L) = (1/100) / (1/100,000) = 1000$.
  *The Punchline:* "You just used the Doomsday Argument. You reasoned that finding yourself 'early' in the sequence is evidence that the sequence is short."

  **Step 2: Eliciting the Objections (20 mins)**
  Now, challenge their own logic using the vocabulary of the game. Do not use philosophical terms yet.

  *   **Objection A (The Sampling Bias):**
      *   *Prompt:* "In the game, I mixed the tokens thoroughly. In the real world, are you a random token? Could your birth rank be correlated with *when* you live?"
      *   *Goal:* Get them to say, "Maybe people born early are different from people born late." (This maps to the *Reference Class Problem* or *SSA critique*).
      *   *Facilitator Move:* "If the tokens in the Large Vault were weighted so that low numbers were heavier and fell to the bottom, would your bet still hold?"

  *   **Objection B (The Existence Bias):**
      *   *Prompt:* "In the game, I guaranteed you would exist to draw a token. In reality, if the Large Vault were true, there would be 1,000 times more people. Doesn't that make it more likely that *you* would exist in the Large Vault simply because there are more slots for you?"
      *   *Goal:* Get them to articulate the *Self-Indication Assumption (SIA)*.
      *   *Facilitator Move:* "Imagine I told you: 'If the Large Vault is chosen, I will invite 1,000 times more players to this room.' Does knowing you were invited change your bet?"

  **Step 3: Resolution (10 mins)**
  *   Reveal the actual Vault (flip the coin/show the key). Award points.
  *   Conclude: "In the game, we could verify the truth. In reality, we cannot. That is why this argument haunts philosophy rather than settling it."

  ---

  ### Stage 3: Prediction of Failure Modes

  Even with a physicist in the room, human psychology interferes with Bayesian reasoning. Here is what will likely go wrong and how to handle it without lecturing.

  **Failure 1: The "Lucky Draw" Intuition**
  *   **What happens:** A participant draws #5. They bet on Large Vault, reasoning, "If it were the Small Vault, drawing a 5 is too lucky/specific. The Large Vault is safer."
  *   **Why:** Confusion between $P(Data|Hypothesis)$ and $P(Hypothesis|Data)$.
  *   **Mitigation:** Do not correct them mathematically. Ask: "If I ran this game 1,000 times, and every time you drew a 5, which bag would you be pulling from more often?" Let the frequency intuition correct the probability intuition.

  **Failure 2: The "Special Snowflake" Resistance**
  *   **What happens:** During the debrief, a participant refuses to accept they are a "random sample" of humanity. "I'm alive *now* because of technology/medicine. I'm not a random human."
  *   **Why:** This is the most common real-world rejection of the DA.
  *   **Mitigation:** Validate them. "Exactly. In the game, the tokens were identical. If humans aren't identical, the 'mixing' wasn't perfect. The argument only holds if you accept the 'Principle of Indifference' regarding your birth time. The debate isn't about the math; it's about whether you are a token."

  **Failure 3: Score Anxiety**
  *   **What happens:** Participants get too focused on winning points and treat the "Blind Test" as a gamble to be won rather than a belief to be updated.
  *   **Why:** Gamification can obscure the epistemic lesson.
  *   **Mitigation:** Before the Blind Test, explicitly state: "The points are for engagement. The goal is to see if your intuition matches the math. There is no penalty for being 'wrong' if your reasoning is sound."

  ---

  ### Stage 4: The Unclosable Gap

  You asked for an honest note on what the tabletop version cannot reproduce.

  **The Gap: Verification vs. Faith**
  In "The Sequence Lottery," **you (the facilitator) know the truth.** You know which Vault was chosen. When you reveal it at the end, the Bayesian update is *vindicated*. The participants see that the Small Vault was indeed the correct choice (assuming you set the coin to Small for the demonstration, which I recommend for maximum impact).

  In the actual Doomsday Argument, **no one knows the truth.** There is no facilitator to reveal the Total Number of Humans ($N_{total}$) at the end of time.
  *   **In the game:** The scoring scheme promises that being "right" is possible.
  *   **In reality:** The argument asks us to shift our credence *without the possibility of empirical verification within our lifetimes*.

  **What You Must Supply:**
  You must explicitly bridge this gap in the final 5 minutes.
  *   **Say this:** "In this room, I was God. I knew the total population. I could pay out your points. In the real world, there is no God to pay out the points. We are making a probability update on a variable that is causally disconnected from our ability to measure it. That is why the Doomsday Argument feels like a parlor trick in this room, but a existential threat outside it. The math is the same; the stakes are not."

  **Physicist-to-Physicist Note:**
  Since you come from Stat Mech, you will recognize this as the difference between an **Ensemble Average** (the game, where we can repeat the coin flip) and a **Single Realization** (the universe, where $N_{total}$ is fixed but unknown). The Doomsday Argument attempts to use Ensemble reasoning on a Single Realization. The game works because we *simulate* the ensemble. The philosophical friction arises because reality does not allow re-sampling. Make sure to point this out; your participants will respect the distinction.
