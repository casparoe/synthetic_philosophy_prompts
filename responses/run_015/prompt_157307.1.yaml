answer: |-
  Here are ten questions designed to navigate the interviewee's specific commitments while progressively narrowing the space for her standard defensive moves.

  **1. To begin, could you state your core argument without relying on empirical claims about how suffering-heavy human lives typically are?**
  *   **Expected Answer:** She will restate the axiological asymmetry: the absence of pain is good even if no one exists to enjoy that good, while the absence of pleasure is not bad unless someone is deprived of it. She will emphasize that this holds even for a child whose life would be net positive.
  *   **Follow-up:** This establishes the "primitive" status of the asymmetry early, allowing you to reference this specific formulation in later questions without needing to re-explain it.

  **2. You treat this asymmetry as a claim about value (axiology), but your conclusion is that procreation is impermissible (deontology); how exactly do you bridge the gap from "this state of affairs is better" to "an agent is forbidden from acting"?**
  *   **Expected Answer:** She will likely argue that the impersonal good of absent pain generates a decisive moral reason against creating a person, sufficient to render the act wrong regardless of the benefit to the created person.
  *   **Follow-up:** This forces her to commit to the strength of the reason, setting up the next question about whether that strength varies with the quality of the life.

  **3. If the asymmetry holds even for a life comfortably above the neutral point, does the strength of the moral prohibition scale at all with how good the resulting life is expected to be?**
  *   **Expected Answer:** She will likely say no, or only trivially; the asymmetry itself does the work, not the balance of pleasure over pain in the potential life.
  *   **Follow-up:** If the quality of the life doesn't scale the prohibition, it confirms that the "harm" to the child is not the driving force, isolating the asymmetry as the sole engine of the argument for later pressure.

  **4. Regarding the "good" of the absence of pain: is this a comparative value regarding a possible person's welfare, or is it a contrastive value about states of affairs that obtains even if there is no subject?**
  *   **Expected Answer:** She will insist it is the latter (contrastive/impersonal) to avoid the charge that she is smuggling in person-affecting intuitions about harm to the non-existent.
  *   **Follow-up:** This locks her into the "impersonal" interpretation, making it harder for her to claim later that the value is grounded in the welfare of the potential child.

  **5. If that good is impersonal and belongs to no one, how does it figure in a practical reason for a prospective parent specifically?**
  *   **Expected Answer:** She will argue that moral reasons can be agent-neutral; the state of affairs is better, and agents ought to promote better states of affairs, even if no specific individual claims the benefit.
  *   **Follow-up:** This exposes the tension in her view: if the reason is agent-neutral, it might demand more than just abstaining from procreation (e.g., preventing others from procreating), which pressures her scope commitments later.

  **6. You have reassured audiences that your view carries no implications for how we treat people who already exist; how do you distinguish the value of never coming into existence from the value of ceasing to exist?**
  *   **Expected Answer:** She will draw a modal distinction: ending a life deprives an existing subject of future goods, whereas never creating them does not deprive anyone, so the asymmetry applies only to the latter.
  *   **Follow-up:** This sets up the specific counter-case where the "deprivation" account is weakest, allowing you to test the consistency of her reassurance.

  **7. Consider a being with no developed future-directed desires, such as an infant or a cognitively limited animal, whose existence could be ended painlessly and without frustration; does the "good" of their future pain's absence apply here?**
  *   **Expected Answer:** She will likely hesitate or say no, citing the loss of existing pleasure or the violation of existing rights, but this contradicts her claim that the absence of pain is good *even if* there is nobody to enjoy the good.
  *   **Follow-up:** This is the pressure point on her reassurance: if the absence of pain is impersonally good, ending a life secures that good, suggesting her view *does* have implications for existing beings, contrary to her stock move.

  **8. Does this axiological asymmetry apply to sentient life generally, including wild animals whose suffering no human agency brought about, and if so, what does it imply about the permissibility of extinction?**
  *   **Expected Answer:** She will likely admit it applies to wild animals but deny it implies we should cause extinction, arguing that human intervention would cause more harm or that we lack the standing to act.
  *   **Follow-up:** If the asymmetry is a primitive truth about value, it should hold independently of human agency; if it implies wild animal lives are net negative in value, her refusal to endorse extinction looks like an ad hoc constraint rather than a logical conclusion.

  **9. The data you explain is that we have a duty not to create miserable people but no duty to create happy ones; isn't this equally well explained by a deontic asymmetry between harming and failing to benefit, without positing your controversial axiological claim?**
  *   **Expected Answer:** She will argue that the deontic explanation is derivative and that the axiological asymmetry explains *why* the deontic constraints exist, claiming her view is more fundamental.
  *   **Follow-up:** This challenges the necessity of her view; if a standard deontic constraint explains the intuitions without requiring "goodness" where no one exists, her primitive axiom may be an unnecessary metaphysical multiplication.

  **10. You treat the asymmetry as primitive, but for it to be a philosophical position rather than a dogma, there must be some consideration or case that would count as evidence against it; what would that look like?**
  *   **Expected Answer:** She may struggle here, perhaps suggesting a case where we clearly *should* create a person despite the pain, or admitting that it rests on a basic intuition that cannot be further justified.
  *   **Follow-up:** This closes the interview by testing the robustness of her foundational claim; if she cannot specify what would falsify it, she concedes it is immune to rational revision, which weakens its status as a defended philosophical conclusion.

  ***

  **Added Pressure Point Question**
  *I recommend inserting the following question as **Question 9**, moving the Deontic Alternative question to **Question 8** and the Falsifiability question to **Question 10**. This pressure point targets the coherence of her "Reassurance" more directly than the "Ceasing to Exist" question.*

  **9. If the absence of pain is an impersonal good that grounds a prohibition on creating people, can an existing person validly regret their own existence without contradicting your claim that we must treat existing people as inviolable?**
  *   **Why this works better:** The interviewee's stock move is to separate the "never existing" conclusion from the "treating existing people" conclusion. This question forces her to address the *evaluative* status of existing life from the *inside*. If the asymmetry is true, an existing person's life contains pain whose absence would have been good. If they regret their existence, they are affirming the axiological asymmetry applied to themselves. If she says they are wrong to regret it, she implies their pain is not actually a "bad" that outweighs the pleasure in a way that matters, undermining the asymmetry. If she says they are right to regret it, she concedes that her view *does* imply existing people are worse off for existing, which destabilizes her reassurance that we should treat them as normal moral patients. It traps her between consistency and the "no implications for existing people" claim.
