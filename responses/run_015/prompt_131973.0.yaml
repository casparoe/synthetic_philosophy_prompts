  **Why a couple of them land where they do**
  #3 (MFN) is the strongest mechanical fix. It passes your Hostage Test because the penalty is automatic: if you cut price for one buyer, your margin dies on all volume. No one needs to volunteer to punish you; the market structure does it. #2 (Transparency) often feels like a solution, but it fails your Churn Test. Shame requires reputation; with 33% annual turnover, new members have no reputation to lose and no future relationships to protect. Transparency without automatic enforcement is just data for defectors to exploit.

  Regarding your tests: The Churn Test is valid but harsh. It assumes mechanisms rely on member-to-member trust. If your Office retains institutional memory despite member turnover, some social mechanisms could work. I'd swap "Churn" for "Institutional Continuity" if the Board/Staff are stable even when farms change hands. This distinction matters because rules enforced by a permanent Secretariat survive churn better than norms enforced by peers. Similarly, #8 works because the brand is an asset owned by the network entity, not the individuals. Even if every farmer changes, the brand remains, preserving value. This is why it beats #5; dues can be lobbied against by new members, but brand equity is tangible market power.

  **What would move something between tiers**
  Buyer concentration is the key variable. If five buyers control 80% of volume, #3 (MFN) becomes risky; buyers might collude to force prices down knowing you can't undercut. In that case, #8 (Branding) moves to sole priority. Conversely, if member churn is actually lower among the largest producers (who set the market), #2 (Transparency) moves up; reputation matters more if the big players stay put. My reasoning breaks if the Office lacks legal authority to enforce contracts (#3) or manage IP (#8); without central power, only #5 (Dues) remains viable. Additionally, if antitrust laws in your region prohibit price-coordinate mechanisms like MFN among competitors, #3 becomes illegal, forcing a pivot to #8 regardless of operational efficacy.
