  *(Self-Correction during drafting)*: Wait, if they are first-years, they might not know Disjunctive Syllogism (DS) by name, but they know the move ($P \vee Q, \neg P \vdash Q$). I should use that. Blocking Explosion usually means blocking DS in LP. That's a key technical point to simplify.
  Actually, in LP (Logic of Paradox), Explosion fails because $P \wedge \neg P$ can be true (designated value), but $Q$ is not. DS also fails in LP.
