answer: |-
  Here is the plan. I'm going to push back on a couple of your instincts, specifically regarding the Liar and the "consequence relation" framing, because first-years will trip over the metalogic but they *need* the Liar to understand dialetheism specifically (as opposed to just paraconsistency).

  ### 1. The Frame: "Consequence Relation" vs. "Rules of the Game"
  Your frame is philosophically correct, but the vocabulary is wrong for the audience. First-years don't have a robust concept of a "consequence relation" as an abstract object; they have a concept of **rules they are allowed to use in a proof.**

  *   **Don't say:** "Classical logic defines validity via a consequence relation where inconsistency entails triviality."
  *   **Do say:** "In the logic you learned last term, there is a rule that says if you have a contradiction on your page, you can write down *anything*. We call this 'Explosion.' Today we ask: What if we delete that rule?"

  **Verdict:** Keep the *idea* (prying inconsistency from triviality), but hang it on **Natural Deduction rules**, not model-theoretic consequence. It makes the "gap" concrete: the gap is a missing inference rule.

  ### 2. The Sequence (45 Minutes)
  Here is the dependency order. Do not deviate from this, or you will lose them to trivialism.

  **0:00–0:10: The Classical Trap (Whiteboard Proof)**
  *   **Action:** Write the standard Explosion derivation ($P, \neg P \vdash Q$) using Intro $\vee$ and Disjunctive Syllogism (DS).
  *   **Why first:** You must establish that Triviality is a *theorem* of their current system, not just a vibe.
  *   **Key distinction:** Explicitly label "Inconsistent" (having $P$ and $\neg P$) and "Trivial" (proving $Q$). Show that Classical Logic makes Inconsistent $\rightarrow$ Trivial.
  *   **Misconception Check:** If someone says "But you'd never actually have $P$ and $\neg P$," stop them. "We aren't asking if it's wise to believe contradictions. We are asking: *If* we did, does the logic force us to believe everything?"

  **0:10–0:20: The Motivation (Paraconsistency)**
  *   **Action:** Motivate blocking the rule. Use the **Database/Witness** example (not moral, not Liar yet).
      *   *Case:* A computer system merges two reliable databases. One says `Flight_Departed = True`, the other `Flight_Departed = False`. The system crashes if it infers `2+2=5`.
      *   *Point:* We need to reason *with* the inconsistency without the system exploding.
  *   **Distinction:** This motivates **Paraconsistency** (logic tolerates inconsistency). It does *not* yet motivate **Dialetheism** (contradictions are true). Keep these separate.
  *   **Misconception Check:** "So anything goes?" No. We are deleting *one* rule (Explosion/DS), not all rules. Modus Ponens stays.

  **0:20–0:30: The Radical Claim (Dialetheism & The Liar)**
  *   **Action:** Now introduce the Liar. You said you wanted to skip it. **I am arguing you cannot.**
      *   *Reason:* Paraconsistency is about *information management*. Dialetheism is about *truth*. You cannot motivate the claim "Some contradictions are true" with a database error or a moral dilemma (which are normative, not descriptive). You need a case where $P$ and $\neg P$ look *true*.
      *   *The Move:* Write: "This sentence is false." Show that if True $\rightarrow$ False, and if False $\rightarrow$ True.
      *   *Handling the Objection:* A student *will* say "It's meaningless." **Do not fight this.** Say: "Classical logic solves this by saying the sentence is illegitimate (meaningless). Dialetheists say that's an ad hoc rescue mission. They say: Accept the contradiction. It's both true and false."
  *   **Why here:** You need the "Inconsistent Theory" (Database) first to show logic *can* handle contradiction, then the "Inconsistent World" (Liar) to show why we *might want to*.

  **0:30–0:35: Gluts vs. Gaps (The Semantic Picture)**
  *   **Action:** Draw a line. Classical: Every sentence is either True or False (exclusive).
      *   **Gap (K3):** Some sentences are neither (handles Liar by under-determination).
      *   **Glut (LP):** Some sentences are both (handles Liar by over-determination).
  *   **Placement:** This must come *after* the Liar. If you do this earlier, they will think Paraconsistency is just about Vagueness.
  *   **Key Point:** Dialetheism is the claim that there are **Gluts**, not Gaps.

  **0:35–0:45: Synthesis & Assessment**
  *   Recap: We blocked Explosion to allow for Gluts.
  *   Final Question (see below).

  ### 3. The One Example
  **Use the Liar.**
  I know you want to avoid it, but the Moral Dilemma fails for the reason you suspected (prima facie duties), and Vagueness fails because it invites the "Gap" solution (neither true nor false) which is the *rival* to Dialetheism, not the motivation for it.

  **What the case must have:**
  1.  **Bivalence Pressure:** It must be a context where we feel forced to assign a truth value (unlike "Is this patch red?" where "kinda" is acceptable). The Liar forces "True or False?"
  2.  **No Equivocation:** The terms must be stable.
  3.  **No Perspective:** It can't be "True for me, false for you."

  **How to deploy it without losing 10 minutes:**
  Stipulate the "Meaningless" objection as the **Classical Position**.
  *   *Script:* "Classical logic says this sentence is a rule-violation, like dividing by zero. Dialetheists say: Why is logic allowed to veto reality? If the reasoning forces a contradiction, maybe reality is contradictory."
  *   This turns the objection into part of the lesson (Classical vs. Non-Classical) rather than a distraction.

  ### 4. Misconceptions & Defusal Points
  1.  **"So anything goes / Trivialism"**
      *   *When:* Minute 10 (immediately after Explosion proof).
      *   *Defusal:* "Paraconsistent logic is *more* restrictive than classical logic in one way: it forbids the move from Contradiction to Anything. It doesn't allow everything; it allows *contradictions* without allowing *everything*."
  2.  **"They've just redefined 'not'"**
      *   *When:* Minute 35 (during Gluts/Logic comparison).
      *   *Defusal:* "In LP (Logic of Paradox), the truth table for $\neg$ is the same. $\neg T = F, \neg F = T$. The difference is we added a third value (Both). We didn't change negation; we changed the *values*."
  3.  **"That's just vagueness / equivocation"**
      *   *When:* Minute 25 (during Liar).
      *   *Defusal:* "Vagueness suggests 'neither true nor false' (Gap). Dialetheism claims 'both true and false' (Glut). The Liar isn't vague; it's precise and paradoxical."
  4.  **"Contradictions are fine in real life / Relativism"**
      *   *When:* Minute 40 (Wrap up).
      *   *Defusal:* "This isn't about opinions. It's not 'I believe P and you believe not-P.' It's about whether a single proposition can hold both truth values objectively."

  ### 5. The Final Question
  Do not ask: "What is paraconsistent logic?" (They will sloganize).
  Do not ask: "Is the Liar true?" (They will debate the Liar).

  **Ask this:**
  > "In classical logic, if I accept $P$ and $\neg P$, I am forced to accept $Q$ (e.g., 'The moon is made of cheese'). If I want to accept $P$ and $\neg P$ but *refuse* to accept $Q$, which specific step in the proof on the board am I refusing to take?"

  **Why this works:**
  *   It forces them to look at the derivation (Disjunctive Syllogism or Explosion).
  *   It tests if they understand that Paraconsistency is about **blocking an inference**, not just "being okay with contradictions."
  *   It distinguishes them from Trivialists (who accept $Q$).

  ### 6. What to Refuse to Explain (Scope Boundaries)
  You have 45 minutes. You must explicitly say you are **not** covering:
  1.  **The Truth Tables for LP:** Do not write out the 3-value tables unless they ask. It eats time and looks like math. Talk about "True," "False," and "Both."
  2.  **Recovery of Classical Logic:** Don't explain how classical logic is a "special case" of paraconsistent logic. It's too abstract.
  3.  **Negation Properties:** Do not get into whether paraconsistent negation is "subcontrary" or lacks excluded middle. Just say "It behaves classically except when we hit a glut."
  4.  **Historical Context:** No need to mention Łukasiewicz, da Costa, or Priest by name. It adds authority but no understanding.

  ### Summary of the "Argue with Me" points:
  1.  **Frame:** Change "consequence relation" to "inference rules."
  2.  **Example:** You *must* use the Liar for Dialetheism. Use the Database for Paraconsistency. Do not conflate them.
  3.  **Timing:** Defuse Trivialism at minute 10, not minute 30.
  4.  **Gluts/Gaps:** Place this *after* the Liar, otherwise they think Dialetheism is just Vagueness.

  If you stick to this, you'll pry the concepts apart without drowning them in metalogic. Good luck.
