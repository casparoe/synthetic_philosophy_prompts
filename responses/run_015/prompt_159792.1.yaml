      *   *Example:* I'm going to push the user to use the Liar. It's the only thing that justifies *Dialetheism*. Paraconsistency is easy (databases). Dialetheism is hard. I'll explain why the Moral Dilemma fails (normative logic is different). I'll suggest a specific formulation of the Liar that minimizes the "meaningless" pushback (e.g., "This sentence is not true").
