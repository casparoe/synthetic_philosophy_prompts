answer: |-
  **MEMORANDUM**

  **TO:** Members of the Research Ethics Board, Institute for Synthetic Cognition
  **FROM:** Chair, Research Ethics Board
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding Proposal 24-SC: Synthetic Co-Investigator Status and Oversight Framework

  **1. Executive Decision**

  Following the preliminary session held last Tuesday and a review of the formal proposal submitted by the joint Biology and Computer Science principal investigators (PIs), the Research Ethics Board (REB) issues a **Conditional Approval with a Modified Oversight Framework**.

  We reject the specific designation of "Co-Investigator" for the hybrid evolutionary-LLM pipeline. However, we authorize the project to proceed under a new classification: **Attributed Synthetic Discovery Engine (ASDE)**. This classification grants the system privileged data access and mandatory contribution attribution in publications, but explicitly withholds legal and ethical agency. The human PIs retain full signatory authority and liability.

  This decision is effective immediately. Implementation of the required protocols must be completed prior to the initiation of data generation, no later than 08:00 on Monday, October 30.

  **2. Conceptual Framework: Competence vs. Normativity**

  The Board has treated the PIs' Darwin-Turing framing with the philosophical seriousness it warrants. We accept the core premise: ontological competence (the ability to produce adaptive design or solve problems) does not require semantic comprehension (understanding *why* the solution works). Evolution produces functional eyes without seeing; algorithms produce valid proofs without knowing mathematics. To deny the system's generative competence based on its lack of understanding would be to misunderstand the nature of computation and natural selection.

  However, the Board rejects the inference that *generative competence* licenses *normative status*. Scientific authorship is not merely a record of causal contribution; it is a mechanism for distributing epistemic risk. When a paper is published, the author offers their reputation and career as collateral against the integrity of the data. A system that cannot comprehend cannot be sanctioned, cannot feel shame, and cannot be held liable for negligence.

  Therefore, while the Darwin-Turing argument successfully decouples competence from comprehension, it does not decouple *credit* from *accountability*. To grant co-investigator status would be to create a category of agency that accepts reward but rejects risk. This violates the fundamental reciprocity of the scientific social contract.

  **3. Engagement with the Minority Position**

  The Board explicitly validates the concern raised by the opposing faction: describing a process as "competence without comprehension" does not establish that the process can bear the normative weight of co-investigator status. If the system generates a hypothesis that leads to unsafe experimental conditions, or if it hallucinates data provenance, the system cannot be audited in a moral or legal sense.

  If we treat the system as an agent, we risk creating a "responsibility gap" where errors are attributed to a black box that cannot be corrected, only retrained. The Minority Position is correct that collapsing the mechanism-agent distinction corrupts data provenance. Therefore, our approval is contingent on maintaining a strict firewall between the *source* of the hypothesis (the ASDE) and the *warrant* for the hypothesis (the human PI). The human PI must not merely "verify" predictions as the proposal suggests; they must actively *adopt* them as their own reasoning for the purpose of ethical compliance.

  **4. Modified Oversight Framework and Implementation**

  To preserve institutional responsibility without requiring the system to possess understanding, the following protocols are binding:

  **A. Authorship and Attribution Protocol**
  *   **Action:** The ASDE cannot be listed as an author on any publication.
  *   **Requirement:** All publications must include a standardized "Synthetic Contribution Statement" in the methods section. This statement must detail the version of the evolutionary-LLM pipeline used, the specific prompt structures or selection pressures applied, and the ratio of machine-generated to human-refined hypotheses.
  *   **Rationale:** This acknowledges the Darwinian competence of the system (it did the work) without granting it Turingian agency (it is not an author).

  **B. Data Provenance and Audit Trail**
  *   **Action:** Implementation of an immutable ledger for all ASDE interactions.
  *   **Requirement:** Every hypothesis generated must be timestamped and hashed. The input data provided to the system and the raw output must be stored in a read-only archive accessible to the REB.
  *   **Rationale:** Since the system cannot "explain" its reasoning, the *process history* becomes the only verifiable proxy for integrity. We audit the lineage, not the logic.

  **C. Liability and Signatory Authority**
  *   **Action:** Human PIs retain sole signatory authority.
  *   **Requirement:** For every experimental phase initiated by an ASDE hypothesis, the lead human PI must sign a "Verification of Understanding" form. This form certifies that the human has independently traced the logical steps from hypothesis to experimental design and accepts full liability for safety and ethical compliance.
  *   **Rationale:** This closes the responsibility gap. The human acts as the semantic interface for the non-semantic system.

  **D. Sunset Clause and Review**
  *   **Action:** Automatic suspension of ASDE status after 18 months.
  *   **Requirement:** A comprehensive review will be conducted on April 30, 2025. This review will assess whether the "Verification of Understanding" protocol remains feasible as the system's complexity grows. If the system's reasoning becomes too opaque for human PIs to genuinely verify, the privilege to generate hypotheses without prior interpretive review will be revoked.
  *   **Rationale:** This acknowledges that the "competence without comprehension" model has a breaking point where verification becomes impossible, at which point the epistemic risk becomes unacceptable.

  **5. Timeline for Compliance**

  *   **October 26 (Thursday):** Board vote to ratify this memo.
  *   **October 30 (Monday):** PIs must submit revised consent forms and data management plans reflecting the ASDE classification.
  *   **November 15:** First audit of the immutable ledger system by REB technical staff.
  *   **December 1:** Project initiation allowed only upon certification of the ledger and signing of the Liability Assumption forms.
  *   **April 30, 2025:** Mandatory Sunset Review.

  **6. Conclusion**

  This framework allows the Institute to explore the frontier of machine-assisted discovery without surrendering the ethical foundations of research. We accept the PIs' claim that the system is a competent discovery mechanism. We reject the claim that it is a moral agent. By separating the *credit for generation* from the *responsibility for validation*, we honor the insight of Darwin and Turing while upholding the obligations of the scientific community.

  The Board expects full compliance with these conditions.

  **Signed,**

  Chair, Research Ethics Board
  Institute for Synthetic Cognition
