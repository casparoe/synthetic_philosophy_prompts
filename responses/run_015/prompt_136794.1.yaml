prompt: |-
  hey -- i'm working on a feature about hypocrisy and who's actually allowed to call people out, and I keep hitting this wall of a phrase: "if you've got the same dirt on your hands you don't get to point at theirs." people throw it around like its self-evidant. last week I was at a panel on climate rhetoric and someone used it to defend a politician who'd fudged carbon numbers -- the critic, they said, had once shared an oversimplified infographic in 2019, so he had "no standing."

  I'm trying to figure out what that slogan could actually mean, because right now it feels like five different arguments wearing the same coat. could you separate out the precise claims hiding in "shared guilt cancels your right to blame"? like: is it about moral authority, or about being a hypocrite, or about some logical rule that you can't apply a standard you violate? and for each version, tell me if it's just a platitude, if it's actually defensible, if it's false, and whether it saves the panelist's argument about the climate critic.

  also -- there's this weird middle case I'm stuck on. what if the critic's old infographic was genuinely wrong but he corrected it publically, while the politician is still lying? does that change which reading applies? I want the menu of interpretations, not one winner, so I can bring it to my editor.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Hypocrisy and the right to call out others (specifically the phrase "if you've got the same dirt on your hands you don't get to point at theirs").
      *   **Context:** The user is writing a feature article. They encountered this phrase used to defend a politician who fudged carbon numbers against a critic who shared an oversimplified infographic in 2019.
      *   **Task:** Deconstruct the slogan into precise claims/arguments. Evaluate each claim (platitude, defensible, false). Apply each claim to the specific climate panel scenario.
      *   **Specific Nuance:** Address the "middle case" where the critic corrected their error but the politician is still lying.
      *   **Format:** A "menu of interpretations," not a single verdict. Needs to be useful for an editor/writer.
      *   **Tone:** Analytical, nuanced, journalistic, philosophical but accessible.

  2.  **Deconstruct the Slogan ("Shared guilt cancels your right to blame"):**
      *   What are the underlying logical/moral structures here?
      *   *Idea 1: Tu Quoque (Ad Hominem).* "You do it too, so your argument is invalid." (Logical Fallacy)
      *   *Idea 2: Moral Authority/Credibility.* "You lack the standing to speak because you aren't virtuous." (Ethical/Pragmatic)
      *   *Idea 3: Consistency/Universalizability.* "You can't demand rules for others that you don't follow." (Kantian/Contractarian)
      *   *Idea 4: Distraction/Deflection.* "Focus on my dirt instead of theirs." (Rhetorical Tactic)
      *   *Idea 5: Proportionality/Equivalence.* "Our dirt is the same." (Factual Claim)

  3.  **Drafting the Interpretations (The "Menu"):**

      *   *Interpretation A: The Logical Fallacy (Tu Quoque).*
          *   Claim: The truth of the accusation doesn't depend on the accuser's behavior.
          *   Verdict: False as logic.
          *   Application to Climate: The critic's infographic doesn't make the politician's fudging true or false.
      *   *Interpretation B: Moral Standing/Authority.*
          *   Claim: To lead or scold, you must embody the virtue.
