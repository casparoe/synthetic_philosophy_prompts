  **DEPARTMENT OF CONTINUITY & SUCCESSION**
  **INSTRUMENT 44-B: CRITERIA FOR OFFICE CONTINUITY AND SUCCESSOR VALIDATION**
  **Date:** 14 November 1974
  **Reference:** DC/CONT/44-B/Rev.3

  **1. DEFINITION OF OFFICE**
  1.1 For the purposes of this Instrument, an Office is not defined by the physical attributes, biological composition, or self-identification of the occupant, but solely by the pattern of interaction between the Office and its environment.
  1.2 An Office is considered continuous if it maintains a stable mapping of Inputs (requests, filings, environmental stimuli) to Internal States (processing, deliberation, storage) and Outputs (decisions, memoranda, public actions).
  1.3 Provided the Input-State-Output mapping remains within a deviation of less than 0.04% from the Established Baseline, the Office is deemed identical to its predecessor, regardless of material substitution.
  1.4 *[Marginalia: Does this include the coffee breaks? - J.H.]* *[Marginalia: Only if coded as State 44. - Supervisor]*

  **2. MATERIAL NEUTRALITY**
  2.1 The Administration recognizes no preference for carbon-based substrates. Valid occupants may include, but are not limited to: Standing Committees, mechanical assemblies, trained biological aggregations (see Precedent 89-P, "The Aviary"), or geographical features exhibiting responsive erosion patterns (see Precedent 88-C, "The Coastline").
  2.2 Claims that a non-human occupant lacks "understanding" are inadmissible unless such lack results in measurable output delay.
  2.3 Where the occupant consists of multiple distributed agents, the Office is held to be singular provided the agents do not communicate regarding the nature of their task.
  2.4 *[Marginalia: See Coastline erosion rates. Unstable? - J.H.]*

  **3. SUBJECTIVE DISCREPANCY**
  3.1 In cases where an occupant satisfies all functional criteria but reports a subjective sense of discontinuity (e.g., "The work feels different," "I am merely pretending," "Nothing is happening inside"), such reports shall be categorized as Internal Noise.
  3.2 Internal Noise does not constitute a breach of Continuity. The Department is concerned with the arrival of the Output, not the experience of its production.
  3.3 Should an occupant claim that Inputs appear qualitatively different than before (e.g., "The forms look red instead of green"), verification shall be conducted via spectral analysis of the forms, not interrogation of the occupant.
  3.4 *[Marginalia: What if it screams? - J.H.]* *[Marginalia: Ignore. File under Maintenance. - Supervisor]*

  **4. VERIFICATION OF PURPOSE**
  4.1 The "Purpose" of an Office is defined by the effects it produces in other Offices.
  4.2 Where the Purpose is disputed, the interpretation favoring the continued processing of pending filings shall take precedence.
  4.3 No inquiry shall be made into whether the Purpose serves the Public Good, only whether it serves the Statutory Ends defined in Schedule 1.
  4.4 *[Marginalia: But who decides the effect? - J.H.]* *[Marginalia: The Office that receives the effect. - Supervisor]*

  **5. APPLICATION PROCEDURE**
  5.1 Claimants seeking to establish tenure must submit logs of the last 500 transactions.
  5.2 Biological claimants must refrain from citing "consciousness" as a credential.
  5.3 In the event of a tie between two claimants producing identical Outputs, the claimant requiring the lower maintenance budget shall be awarded the Office.

  **NOTE FOR APPLICANTS**
  Do not tell us who you are. We cannot hear you. Bring us the forms you have signed. Bring us the stamps you have struck. If you can make the phone ring in the manner prescribed by Schedule 4, you are the Office. If you cannot, you are merely matter occupying space. Do not ask us whether you are real. Ask us whether you are processed. If you find yourself wondering whether you are the Office or merely simulating it, assume the latter and submit a resignation form in triplicate. If you are the Office, the form will be processed. If you are not, it does not matter.
