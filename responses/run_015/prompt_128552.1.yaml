answer: |-
  Here is a practical decision tree designed for your workshop. It sorts participants by their theoretical commitments regarding value, knowledge, and crisis.

  **Note to Instructor:** Branch 1 is a "gatekeeper." In strict Marxian value theory, only living labor creates surplus value. Students who choose **Dead Labor** are effectively rejecting the Labor Theory of Value (LTV). The taxonomy marks these positions as **Non-Marxian/Technocratic** to help students realize they have drifted into post-Marxist or vulgar economic territory.

  ### The Decision Tree

  **START: The Automated Mine**
  *Claim 1: In a fully automated mine with remote maintenance, where does the surplus value come from?*
  *   **(A) Dead Labor:** Mainly from the robots/machinery (Technology creates value).
  *   **(B) Living Labor:** Mainly from the remote engineers/drivers (Humans create value, even if hidden).

  ---

  #### IF (A) DEAD LABOR (Rejects LTV)
  *Claim 2: Regarding knowledge and intelligence...*
  *   **(A) Privatized:** Capital successfully absorbs collective intelligence into machinery.
      *   *Claim 3: On job loss...*
          *   **(A) Cyclical:** Automation removes jobs temporarily; new sectors absorb them.
              *   **LEAF 1:** **[Incoherent]** *Why do humans need to return to work if machines create the value? Contradictory.*
          *   **(B) Structural:** Automation permanently removes more jobs than it creates.
              *   **LEAF 2:** **[Post-Value Technism]** *e.g., "Fully Automated Luxury Communism" (FALC) lite. Assumes tech solves scarcity but ignores value theory.*
  *   **(B) Socialized:** Capital depends on social cooperation it can't fully privatize.
      *   *Claim 3: On job loss...*
          *   **(A) Cyclical:** Jobs return despite the social nature of knowledge.
              *   **LEAF 3:** **[Incoherent]** *If knowledge escapes capital, why does the labor market stabilize cyclically?*
          *   **(B) Structural:** Permanent job loss due to the social nature of knowledge.
              *   **LEAF 4:** **[Unnamed / Unstable]** *Technologically optimistic but socially pessimistic. Rarely held consistently.*

  ---

  #### IF (B) LIVING LABOR (Accepts LTV)
  *Claim 2: Regarding knowledge and intelligence...*
  *   **(A) Privatized:** Capital successfully absorbs collective intelligence into machinery.
      *   *Claim 3: On job loss...*
          *   **(A) Cyclical:** Unemployment is a functional "reserve army" for wage discipline.
              *   **LEAF 5:** **[Orthodox Productivist]** *Traditional CP / Soviet Marxism. Tech is neutral; unemployment is a tool, not a bug.*
          *   **(B) Structural:** Unemployment is a terminal "surplus population" crisis.
              *   **LEAF 6:** **[Breakdown Theory]** *e.g., Grossman / Mattick. Capital succeeds technically but fails economically (profit rate crisis).*
  *   **(B) Socialized:** Capital depends on social cooperation it can't fully privatize.
      *   *Claim 3: On job loss...*
          *   **(A) Cyclical:** The "commons" of knowledge exists, but capital can still manage employment cycles.
              *   **LEAF 7:** **[Regulation School / Humanist]** *e.g., Aglietta / Fromm. Institutions can manage the contradiction; reform is possible.*
          *   **(B) Structural:** The "commons" creates a structural barrier to capital, leading to permanent exclusion.
              *   **LEAF 8:** **[Autonomist / Post-Work]** *e.g., Negri / Weeks. Also **Eco-Marxists** (see flag below). Exit strategy required.*

  ---

  ### Instructor's Legend & Flags

  **1. The "Non-Marxian" Trap (Leaves 1–4)**
  If a student lands here, they are likely citing automation trends without a grasp of Marx's value theory.
  *   **Pedagogical Move:** Ask them: *"If robots create the value, why does capital need to exploit humans at all?"* This usually pushes them toward Branch B.

  **2. The Orthodox Core (Leaf 5)**
  *   **Commitment:** Trust in the system's ability to reabsorb labor; view technology as a neutral force of productivity.
  *   **Typical Student:** "Marx would just say we need to nationalize the robots."

  **3. The Crisis Split (Leaf 6 vs. Leaf 8)**
  Both agree capitalism is heading for a structural wall (Claim 3B).
  *   **Leaf 6 (Breakdown):** Thinks Capital *wins* the knowledge war (2A) but dies from economic contradictions anyway.
  *   **Leaf 8 (Autonomist):** Thinks Capital *loses* the knowledge war (2B) and dies because it can't capture the value it needs.

  **4. FLAG: Indistinguishable Leaves (Eco-Marxist Convergence)**
  *   **Issue:** This tree cannot separate **Autonomists** from **Eco-Marxists**.
  *   **Reason:** Both groups typically argue that Living Labor creates value (1B), that Capital cannot fully privatize social/natural systems (2B), and that the resulting crisis is structural, not cyclical (3B).
  *   **Fix:** To separate them, you would need a fourth branch on *Nature*: "Is the primary limit to accumulation *Labor* (Autonomist) or *Ecological Metabolism* (Eco-Marxist)?"

  **5. FLAG: Unattractive/Unexplored (Leaf 7)**
  *   **Issue:** Leaf 7 (Living + Socialized + Cyclical) is theoretically weak. If knowledge truly escapes capital (2B), it is hard to argue the employment cycle remains stable (3A).
  *   **Status:** This is the **Social Democratic** hope. It is "unattractive" to radicals because it assumes capital can manage the unmanageable.

  ### How to use this in the workshop
  1.  **Handout:** Give students the three claims as a quiz.
  2.  **Plotting:** Have them trace their answers on the tree.
  3.  **Discussion:** Group students by their Leaf number.
      *   Ask **Leaf 2** (Technists) to debate **Leaf 5** (Orthodox) on whether robots create value.
      *   Ask **Leaf 6** (Breakdown) to debate **Leaf 8** (Autonomist) on *why* capitalism will fail (Profit rates vs. Social Revolt).
