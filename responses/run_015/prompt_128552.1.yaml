      *   *Self-Correction on Claim 1:* I need to be careful not to sound dogmatic. Instead of "Incoherent," maybe "Non-Marxian / Technocratic." But the prompt asks for a taxonomy *for a workshop on Marx*. So pointing out the violation of LTV is useful. I will label them "Theoretically Deviant (Rejects LTV)" to be precise.

