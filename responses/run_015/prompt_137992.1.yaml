answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Cognitive Penetrability of Perceptual Content
  **Parties:** The Impenetrabilist Coalition (Party A) and The Penetrationist Coalition (Party B)

  ## 1. Agreed Claims

  The undersigned parties hereby stipulate the following empirical and methodological commitments. These claims constitute the shared foundation upon which the residual theoretical disagreement rests.

  1.  **The Perception-Judgment Distinction:** Both parties agree that a change in a subject's perceptual state is categorically distinct from a change in the subject's judgment, inference, memory, or verbal report regarding that state. A theory of penetrability must explain variance in the perceptual state itself, not merely in the downstream cognitive processing of that state.
  2.  **Hierarchy of Evidential Markers:** Both parties agree that no single dependent measure is individually decisive for establishing genuine perceptual change. However, the parties jointly endorse a hierarchy of evidential weight. Evidence is considered stronger to the extent that it satisfies the following markers:
      *   (i) Sensitivity changes in forced-choice discrimination tasks;
      *   (ii) The presence of adaptation aftereffects contingent on the manipulated variable;
      *   (iii) Interocular transfer or cross-modal transfer of the effect;
      *   (iv) Persistence of the effect under explicit instructions to disregard the influencing factor;
      *   (v) Presence in a report-free dependent measure (e.g., pupillometry, neural decoding, or fixation-controlled performance) where response bias is minimized.
  3.  **Peripheral Route Exclusion:** Both parties agree that effects fully mediated by changes in eye movements, pupil diameter, or the shifting of spatial attention do not count as cognitive penetration. If a cognitive state alters *where* or *how long* a subject looks, or alters the gain of spatial attention filters, and this alteration explains the performance difference, the perceptual mechanism itself is deemed encapsulated with respect to cognitive content. Penetration requires that the cognitive state alter the processing of the stimulus *at the locus of stimulation* holding ocular and attentional parameters fixed.
  4.  **Plasticity and Learning Concession:** Both parties concede that perceptual mechanisms are plastic and that extended training alters perceptual sensitivity and tuning. Consequently, the mere fact that "the perceptual system was different afterwards" cannot by itself settle the question of penetrability. A change resulting from slow, statistical learning via feedback is compatible with encapsulation. The dispute concerns whether cognitive states can alter perceptual content *in virtue of their content* (e.g., belief, understanding) rather than merely via statistical reinforcement of transductive machinery.

  ## 2. Disagreements

  The following table isolates the residual theoretical disagreements. The formulations provided in columns 2 and 3 represent the strongest version of each view that the respective party is willing to endorse.

  | Issue | Party A (Impenetrabilist) Formulation | Party B (Penetrationist) Formulation | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. The Locus of Cognitive Influence** | Cognitive states can alter the *input* to the perceptual system (via attention/eye movements) and the *output* (via judgment/report), but cannot alter the function mapping sensory stimulation to perceptual content during the processing interval. | Cognitive states can alter the *function* mapping sensory stimulation to perceptual content, such that the same stimulation yields different perceptual contents depending on the active cognitive state, even holding attention fixed. | Substantive |
  | **2. The Role of Semantic Content** | Any influence of cognition on perception is mediated by non-semantic parameters (e.g., reward prediction errors, feature weighting). The *meaning* of the belief is irrelevant to the perceptual mechanism. | The *semantic content* of the cognitive state (what the belief is about) is partly constitutive of the perceptual content. The system uses the meaning of the belief to resolve ambiguity in the sensory signal. | Substantive |
  | **3. Individuation of Mechanisms** | A perceptual mechanism remains the "same" mechanism across time if it retains its proprietary informational format and modular structure, even if its weighting parameters are tuned by learning. | A perceptual mechanism is individuated by its functional dependencies. If the function fixing perceptual content changes to depend on cognitive inputs, it constitutes a different functional architecture, regardless of structural continuity. | Verbal |
  | **4. Synchronic vs. Diachronic Effects** | Genuine penetration requires a synchronic effect: the belief must alter perception immediately upon activation, not merely after hours of reinforcement training. | Genuine penetration includes diachronic effects where the acquisition of a belief re-organizes perceptual priors, provided the re-organization tracks the content of the belief rather than mere statistical regularity. | Substantive |

  ## 3. Cruxes

  The parties agree that the following protocol serves as the diagnostic test for the disagreements listed above. The protocol involves forced-choice discrimination within a family of synthetic textures generated by a parametric three-parameter statistical model unknown to naive subjects.

  **Protocol Arms:**
  *   **Arm N (Null):** No rule provided.
  *   **Arm E (Early):** Rule provided at hour 0.
  *   **Arm D (Delayed):** Rule provided at hour 120 (post-training).
  *   **Arm F (False):** Inverted rule provided at hour 120 (true of training, false of transfer).
  *   **Arm M (Misaligned):** Correct rule provided at hour 120, formulated such that it is true of stimuli but does not reference the discriminative dimension.

  **Dependent Measures:** Discrimination threshold, magnitude of texture-contingent aftereffect, transfer to untrained eye, report-free measure under fixation control. Measurements taken at hours 120, 130, and 200.

  | Crux | Case / Measurement | Party A Prediction | Party B Prediction | Defeat Condition for Party A | Defeat Condition for Party B |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Belief vs. Statistics (Arm F)** | **Arm F Transfer Set:** Subjects are told an inverted rule at hour 120. The transfer set statistics contradict the rule. Measure: Error pattern on transfer set at hour 130. | Performance will track the **statistics** of the transfer set, not the believed rule. Subjects will revert to veridical discrimination despite the false belief. | Performance will track the **believed rule**, producing systematic errors aligned with the inversion, despite the statistical contradiction. | If subjects in Arm F show error patterns significantly aligned with the inverted belief rather than the stimulus statistics at hour 130. | If subjects in Arm F show immediate reversion to statistical veridicality that cannot be explained by rapid feedback learning (given no feedback is given on transfer). |
  | **2. Speed of Update (Arm D)** | **Arm D vs. Arm E:** Compare threshold improvement at hour 130 (10 hours post-instruction for D; 130 hours for E). | Arm D will show **slow convergence**. Performance will improve gradually from hour 120 to 200 as the perceptual system retunes to the new parameters via error correction. | Arm D will show **rapid convergence**. Performance at hour 130 will match Arm E at hour 130, indicating immediate top-down constraint by the belief. | If Arm D performance at hour 130 is statistically indistinguishable from Arm E at hour 130, holding total training time constant. | If Arm D performance at hour 130 remains significantly worse than Arm E, indicating the belief alone cannot drive perceptual optimization without retraining. |
  | **3. Semantic Specificity (Arm M)** | **Arm M:** Rule is true but does not mention the discriminative dimension. Measure: Threshold change at hour 130. | **No specific improvement** on the discriminative dimension relative to Arm N. Without a belief *about* the dimension, the perceptual module cannot be tuned to it. | **Significant improvement** relative to Arm N. The cognitive system can map the abstract belief onto the perceptual dimension, altering content even without semantic overlap. | If Arm M shows threshold improvement specific to the discriminative dimension comparable to Arm E. | If Arm M shows no improvement over Arm N, indicating semantic reference to the dimension is necessary for perceptual alteration. |
  | **4. Aftereffect Signature** | **Aftereffect Magnitude:** Correlation between belief strength and aftereffect size across arms at hour 130. | Aftereffects will correlate with **exposure hours and stimulus statistics**, not belief content. Arm D and E should differ in aftereffect magnitude proportional to training time. | Aftereffects will correlate with **belief strength**. Arm D should show aftereffect magnitudes comparable to Arm E if the belief is held with equal confidence. | If aftereffect magnitude in Arm D matches Arm E despite the massive disparity in training exposure (10 hrs vs 130 hrs). | If aftereffect magnitude in Arm D remains proportional to training exposure (10 hrs) rather than belief confidence. |

  ## 4. Closing Analysis: Verbal and Substantive Components

  The parties acknowledge that a portion of the historical dispute has been verbal, specifically regarding the **Individuation of Mechanisms** (Disagreement 3). If Party A defines "perceptual mechanism" by structural modularity and Party B defines it by functional dependency, they may agree on all causal facts while disagreeing on whether to label the system "penetrated." This component is verbal. It can be dissolved by agreeing to describe the causal architecture without applying the label "perception" to the output of that architecture.

  However, the dispute is not *wholly* verbal. The **Locus of Cognitive Influence** (Disagreement 1) and the **Speed of Update** (Crux 2) represent substantive disagreements about causal structure. If Arm D subjects perform immediately at the level of Arm E subjects holding fixation and attention constant, this implies a causal pathway from belief to sensory processing that bypasses statistical learning. Party A claims this pathway does not exist; Party B claims it does. This is an empirical claim about the connectivity of the visual system, not a definition.

  Furthermore, the **Semantic Specificity** (Crux 3) issue resists both treatments. If Arm M fails, it suggests a substantive constraint on how cognition interfaces with vision (semantic matching required). If Arm M succeeds, it suggests a more diffuse influence. Neither outcome is purely definitional; both imply different computational architectures for the interface between high-level and low-level systems.

  Therefore, while the parties agree that the *label* "cognitive penetration" may be applied differently depending on one's preferred taxonomy of mechanisms, the *phenomena* described in the Cruxes table are objective matters of fact. The protocol specified in Section 3 is designed to adjudicate these factual matters. Should the data align with Party A's predictions, Party B concedes that the "penetration" observed in prior literature was likely attributable to attentional shifts or slow statistical learning. Should the data align with Party B's predictions, Party A concedes that the perceptual system is not informationally encapsulated with respect to cognitive content. Until such data is obtained, the disagreement remains live, substantive, and unresolved.
