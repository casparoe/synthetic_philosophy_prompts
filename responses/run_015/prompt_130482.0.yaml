prompt: |-
  I teach a first-year PPE course and I've got one 75-minute session, about 22 students, most of whom have done no formal maths since school and none of whom have seen social choice theory. I want them to feel why there's no aggregation rule that meets a short list of conditions that each sound individually obvious — and I dont want to just tell them, they should spend most of the hour trying to build a rule that works and failing.

  Here's the rough shape I have in mind, fix it or replace it: they're drafting a "constitution" for spending a real £200 class fund across three options (a guest speaker, a party, a donation — whatever). In teams of 4-5 they write down a rule that takes each person's ranking of the three options and outputs a group ranking, subject to four plain-English constraints on a handout: the group ranking has to be a genuine ordering (no cycles), it has to respect unanimity, the group's A-versus-B verdict can't depend on where anyone ranks C, and no single person gets their way regardless of what everyone else says. Then teams swap and go adversarial: each team hunts for a preference profile that makes another team's rule break one of the conditions. Scoreboard = conditions you survive plus profiles you break.

  What I actually need from you: concrete rules and materials, a minute-by-minute timeline, the scoring, and two or three reserve profiles I can plant if the room doesn't generate them (the spoiler case and the cycle case at minimum). Then a debrief that maps moments in the room back onto each condition — and in particular onto the bit this kind of activity usually fails to convey: every rule in the room breaking on some profile is not the same as the claim that no rule could work. How do I make that universal quantifier land in the last ten minutes without turning it into a lecture with a proof on the board?

  Also be honest about what will predictably go wrong: someone proposes a dictator as a joke, someone proposes ranking by intensity of preference rather than ordinal rankings, someone's rule survives every profile anyone thinks of in fifty minutes and the whole thing fizzles. And there's an ending problem I can't solve — they still genuinely have to decide how to spend the money, so what do I do with that?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** First-year PPE (Philosophy, Politics, Economics) course.
      *   **Students:** ~22 students, no formal math since school, no prior social choice theory.
      *   **Time:** 75 minutes.
      *   **Goal:** Experience Arrow's Impossibility Theorem intuitively (why no aggregation rule meets specific conditions) without a formal proof. They need to *try* to build a rule and *fail*.
      *   **Proposed Activity:** Teams draft a "constitution" (aggregation rule) for spending £200 on 3 options. Constraints: Ordering, Unanimity, IIA (Independence of Irrelevant Alternatives), Non-Dictatorship. Teams swap and attack each other's rules.
      *   **Needs:** Concrete rules/materials, minute-by-minute timeline, scoring, reserve profiles (spoiler/cycle), debrief strategy (especially the "universal quantifier" problem), prediction of failure modes, and resolution of the actual £200 decision.

  2.  **Evaluate the Proposed Activity:**
      *   *Strengths:* Active learning, gamified, concrete stakes (£200), directly engages with the constraints.
      *   *Weaknesses:* 75 minutes is tight for drafting, swapping, attacking, *and* debriefing. "Writing a rule" is abstract for non-math students. They might write vague rules ("do what's fair") which are hard to attack. The "universal quantifier" leap (we failed vs. it's impossible) is the hardest pedagogical hurdle. The £200 decision at the end creates a conflict: if Arrow is right, how do we actually spend the money?

  3.  **Refine the Activity (Fixing/Replacing):**
      *   *Simplification:* Instead of writing a *general* rule from scratch (which is hard), give them specific *types* of rules to test, or scaffold the rule-building heavily. Actually, the prompt wants them to *build* a rule. I need to make sure they build *computable* rules. I will provide a "Rule Template" to force precision.
      *   *Constraints:* The four constraints need to be in very plain English.
          1.  **Completeness/Transitivity:** "Make up your mind" (No ties/cycles).
          2.  **Unanimity:** "If everyone agrees, listen."
          3.  **IIA:** "No spoilers" (Ranking of A vs B depends only on A vs B).
          4.  **Non-Dictatorship:** "No bosses."
      *   *The "Universal Quantifier" Problem:* How to show *no* rule works without a proof? Use the "Space of Possibilities" argument. If simple rules fail, and complex rules are just combinations of simple rules, and the constraints contradict each other logically... I need a specific visual or analogy. The "Map" analogy works well.
      *   *The Ending:* The £200 needs to be spent. This is a great teaching moment. Arrow says no *perfect* rule exists. It doesn't say we can't decide. It says we must relax a condition. The class must vote on which condition to sacrifice.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Timeline:*
          *   0-10: Intro & Setup (The £200, The Problem).
          *   10-25: Rule Drafting (Teams create their constitution).
          *   25-50: The Attack (Swap & Break).
          *   50-60: The Crisis (Realizing nothing works).
          *   60-70: The Debrief (Arrow's Theorem).
          *   70-75: The Decision (Spending the money).

      *   *Materials:* Handout with constraints, "Profile Cards" (pre-made preference orderings to speed up testing), Rule Template.
      *   *Reserve Profiles:* Need a Condorcet Cycle (A>B>C, B>C>A, C>A>B) and a Spoiler/IIA violation (Borda Count style failure).
      *   *Failure Modes:*
          *   *Dictator:* Call it out immediately as a "cheat" that violates constraint 4.
          *   *Intensity:* Remind them inputs are *rankings only* (ordinal), not scores (cardinal).
          *   *Rule survives:* Give them the "Killer Profile" (Condorcet Cycle) that breaks almost everything except Dictatorship.
      *   *The "Universal" Leap:* Use the "Recipe" analogy. If flour, sugar, and eggs all poison the cake individually, mixing them doesn't help. Or better: The constraints form a logical contradiction, like "Draw a square circle."

  5.  **Developing Specific Content:**

      *   *Constraints Translation:*
          *   Ordering -> "Decisiveness" (Always produce a clear winner).
          *   Unanimity -> "Pareto" (If all prefer A to B, group prefers A to B).
          *   IIA -> "Independence" (A vs B shouldn't change if C drops out).
          *   Non-Dictatorship -> "Democracy" (No single person dictates).
      *   *Reserve Profiles:*
          *   Profile 1 (Cycle): 1: A>B>C, 2: B>C>A, 3: C>A>B. (Breaks Majority Rule).
          *   Profile 2 (IIA): 1: A>B>C, 2: A>B>C, 3: B>C>A. (Compare with C removed).
      *   *Scoring:* Points for surviving a test, points for breaking another team's rule.
      *   *The Ending:* Vote on which constraint to drop. Usually, IIA is the one sacrificed in real life (Borda Count, etc.), or we accept cycles (agenda setting).

  6.  **Addressing the "Universal Quantifier" (The Hardest Part):**
      *   Don't prove it. Show the *structure* of the failure.
      *   Analogy: "The Unreasonable Constraints."
      *   Visual: A Venn diagram where the intersection is empty.
      *   Key phrase: "It's not that we aren't clever enough. It's that the definitions contradict."
      *   Activity tweak: In the debrief, ask "Who kept Constraint 1 & 2 but broke 3?" "Who kept 3 & 4 but broke 1?" Show that *every* combination has a hole.

  7.  **Refining the "£200 Decision":**
      *   If no rule is perfect, how do we spend it?
      *   Option A: Instructor decides (Dictator).
      *   Option B: Majority vote (Risk of cycles/IIA).
      *   Option C: Negotiate (Drop a constraint).
      *   Best pedagogical move: Let them vote by majority, but acknowledge the flaw. "We are breaking IIA, but we need to buy lunch."

  8.  **Final Review against Constraints:**
      *   75 mins? Tight but doable if drafting is scaffolded.
      *   Non-math? Keep language plain.
      *   Active? Yes, mostly group work.
      *   Debrief? Focused on the impossibility claim.

  9.  **Constructing the Output:** (Organizing into the requested sections: Timeline, Materials, Reserve Profiles, Debrief, Failure Modes, Ending). *Self-Correction during drafting:* Make sure the "Rule Template" forces them to be specific. Vague rules like "discuss until agreed" are hard to test. Force them to write an algorithm (e.g., "Count first place votes...").

  10. **Final Polish:** Ensure tone is supportive but realistic about classroom management. (e.g., "Stop them when they start debating the *merits* of the options, not the *rule*.")

  *(Self-Correction on the "Universal Quantifier"):* I need to be careful not to say "We tried 5 rules and they failed, so all rules fail." That's induction. I need to emphasize that the *conditions themselves* are the problem. I will use the "Logical Contradiction" framing.

  *(Self-Correction on the Ending):* The prompt asks "what do I do with that?" regarding the money. I should suggest a specific mechanism, likely a simple majority vote, explicitly framed as "violating IIA for the sake of action."

  Let's assemble the plan.cw
answer: |-
  This is a high-risk, high-reward lesson plan. It works brilliantly if the scaffolding is tight, but it can easily devolve into students debating the *merits* of the party vs. the donation rather than the *logic* of the aggregation rule.

  Here is a fixed, minute-by-minute plan with materials, scoring, and specific strategies for the pedagogical hurdles you identified.

  ### 1. The Timeline (75 Minutes)

  *   **00–10: The Hook & The Constraints.**
      *   Introduce the £200. Introduce the 3 options (Speaker, Party, Charity).
      *   Hand out the **"Constitution Constraints"** (see Materials).
      *   **Crucial Instruction:** "You are not deciding *what* to buy. You are designing the *machine* that decides. The machine must work for *any* set of preferences, even ones you hate."
  *   **10–25: Rule Drafting (Teams of 4–5).**
      *   Teams design their aggregation rule.
      *   **Constraint:** They must write it as an algorithm (e.g., "Step 1: Count first place votes..."). Vague rules ("We discuss until happy") are rejected by the instructor.
  *   **25–50: The Attack (Swap & Break).**
      *   Teams swap rules with another team.
      *   They receive **"Profile Cards"** (pre-made preference sets).
      *   Task: Find a profile that makes the *other* team's rule violate one of the 4 constraints.
      *   Scoreboard updated on whiteboard.
  *   **50–60: The Crisis.**
      *   Stop the activity. Tally scores.
      *   Ask: "Did any rule survive every attack?" (Likely no, or only a Dictatorship).
      *   Ask: "Did anyone find a rule that satisfies all 4 conditions?" (No).
  *   **60–70: The Debrief (The Universal Quantifier).**
      *   Map the failures to Arrow's Theorem.
      *   Address the "We just didn't try hard enough" objection.
  *   **70–75: The Decision.**
      *   Resolve the £200 spending using a specific, flawed rule (explicitly acknowledging the flaw).

  ---

  ### 2. Materials & Concrete Rules

  #### A. The Four Constraints (Handout)
  *Translate technical terms into plain English.*
  1.  **Decisiveness (Ordering):** The rule must always produce a clear winner. No "we don't know" and no cycles (A beats B, B beats C, C beats A).
  2.  **Unanimity (Pareto):** If every single student ranks Option A above Option B, the group ranking must put A above B.
  3.  **Independence (IIA):** The group's ranking of A vs. B must depend *only* on how individuals rank A vs. B. It cannot change if Option C is removed or added. (The "Spoiler" rule).
  4.  **Democracy (Non-Dictatorship):** There is no single student whose ranking automatically becomes the group ranking regardless of what others say.

  #### B. The Rule Template (Handout)
  *Force precision to prevent vague "fairness" rules.*
  > **Our Constitution:**
  > 1.  **Input:** Each person submits a ranking (e.g., Party > Speaker > Charity).
  > 2.  **Process:** [Describe the counting method. E.g., "Count first-place votes. If tie, look at second-place votes."]
  > 3.  **Output:** A single group ranking of the three options.
  > 4.  **Tie-Breaker:** [Must be specified. E.g., "Instructor flips a coin" or "Charity wins ties."]

  #### C. Scoring System
  *   **+1 Point:** Your rule survives an attack (the other team cannot find a violation).
  *   **+1 Point:** You successfully break another team's rule (you produce a profile + proof of violation).
  *   **+5 Bonus:** You prove a rule *must* violate a condition logically (rare, but encourage it).

  ---

  ### 3. Reserve Profiles (The "Killer" Cases)
  *Keep these in your pocket. If teams are struggling to break rules, hand these out as "Challenge Cards."*

  **Profile 1: The Condorcet Cycle (Breaks Decisiveness/Majority)**
  *   Student 1: Speaker > Party > Charity
  *   Student 2: Party > Charity > Speaker
  *   Student 3: Charity > Speaker > Party
  *   *Why it breaks things:* Majority rule creates a cycle (Speaker beats Party, Party beats Charity, Charity beats Speaker). Any rule that resolves this cycle usually violates Unanimity or IIA elsewhere.

  **Profile 2: The Spoiler Effect (Breaks IIA)**
  *   *Scenario A (3 Options):*
      *   2 Students: Speaker > Party > Charity
      *   1 Student: Party > Charity > Speaker
      *   *Result:* Speaker wins (2 vs 1).
  *   *Scenario B (Charity drops out):*
      *   2 Students: Speaker > Party
      *   1 Student: Party > Speaker
      *   *Result:* Speaker still wins.
  *   *Wait, that works.* You need a Borda Count style failure.
  *   *Better Profile for IIA:*
      *   3 Students: A > B > C
      *   2 Students: B > C > A
      *   2 Students: C > A > B
      *   *Test:* Compare A vs B. Then remove C. Many point-systems change the winner between A and B depending on whether C is present.

  **Profile 3: The Dictator Trap**
  *   If a team proposes a rule that essentially says "Follow Student 1 unless everyone else agrees otherwise," hand them a profile where Student 1 wants A, but everyone else wants B.
  *   *Check:* Does the rule pick B? If yes, is it really a Dictatorship? If no, it violates Unanimity. This forces them to tighten the definition of Dictatorship.

  ---

  ### 4. Predictable Failure Modes & Fixes

  **1. "Let's just vote by intensity!" (Cardinal Utility)**
  *   *Student Proposal:* "We give 3 points for 1st choice, 2 for 2nd..." or "We argue until we feel strongly."
  *   *Fix:* Remind them of the **Input Constraint**. "The machine only accepts rankings (1st, 2nd, 3rd). It cannot measure 'how much' you like it. That information is lost." This is crucial for Arrow's setup.

  **2. "Let's appoint a Dictator (as a joke)."**
  *   *Student Proposal:* "Student 1 decides."
  *   *Fix:* This rule *will* survive all attacks (it satisfies Decisiveness, Unanimity, and IIA). It only fails **Non-Dictatorship**.
  *   *Teaching Moment:* When this comes up in the debrief, highlight it. "This rule works perfectly. It satisfies 3 out of 4 conditions. Arrow's theorem says you *must* give up one. Dictatorship gives up Democracy. Majority rule gives up Decisiveness (cycles). What do you prefer?"

  **3. "Our rule survived!" (The Fizzle)**
  *   *Risk:* A team creates a vague rule like "Majority wins, but if there's a cycle, we discuss."
  *   *Fix:* Enforce the **Algorithm Constraint**. "Discussing" is not an algorithm. If they say "In case of a cycle, the Instructor decides," point out that makes the Instructor a Dictator (violates Condition 4). If they say "In case of a cycle, we pick A," point out that violates Unanimity if everyone wanted B. Force them to write the tie-breaker down.

  ---

  ### 5. The Debrief: Landing the "Universal Quantifier"
  *This is the hardest part. How to move from "We failed" to "It's Impossible."*

  **Do not draw a proof.** Instead, use the **"Recipe Analogy."**

  1.  **Acknowledge the Induction Problem:** "You might think, 'We only tried 5 rules. Maybe the 6th rule works.'"
  2.  **The Contradiction Frame:** "Imagine I asked you to draw a **Square Circle**. You didn't fail because you aren't good at drawing. You failed because the definition of 'square' and 'circle' contradict."
  3.  **Map the Constraints:**
      *   "Condition 3 (IIA) says: Ignore Option C."
      *   "Condition 1 (Decisiveness) says: You must resolve cycles."
      *   "Condition 2 (Unanimity) says: Listen to everyone."
      *   "Condition 4 (Non-Dictatorship) says: Don't listen to just one person."
  4.  **The Reveal:** "Arrow proved mathematically that if you have 3 or more options, **Conditions 1, 2, 3, and 4 cannot all be true at the same time.** They are logically inconsistent."
  5.  **Visual Aid:** Draw a Venn diagram on the board with 4 circles. Show that the center intersection is empty. "Every rule you build lives in the overlap of 3 circles, but it must fall out of the 4th."
  6.  **The Takeaway:** "Social Choice Theory isn't about finding the perfect voting system. It's about choosing **which flaw you can live with.**"

  ---

  ### 6. The Ending: Spending the £200
  *You cannot leave the class without a decision, or the activity feels nihilistic.*

  **The "Necessary Evil" Vote:**
  1.  Tell the class: "Arrow says no perfect rule exists. But we still have to spend the money."
  2.  Ask: "Which condition are we willing to sacrifice today?"
      *   *Option A (Sacrifice IIA):* Use a Borda Count (points system). Acknowledge that adding a 4th option later could change the winner unfairly.
      *   *Option B (Sacrifice Decisiveness):* Use Majority Pairwise Voting. Acknowledge there might be a cycle (if so, you flip a coin).
      *   *Option C (Sacrifice Democracy):* You (the instructor) decide based on what seemed most popular.
  3.  **Recommendation:** Run a simple **Plurality Vote** (1 vote per person).
      *   **Why:** It's fast.
      *   **The Catch:** Explicitly state: "We are violating IIA and potentially Unanimity. We are accepting a flawed system because we need a decision."
      *   **Pedagogical Payoff:** This cements the lesson. Politics is not about finding the *correct* aggregation method; it's about managing the *inevitable flaws* of aggregation methods.

  ### Instructor Cheat-Sheet for Room Management
  *   **Minute 15:** Walk around. If a team writes "We vote," ask "What happens if it's 2 vs 2 vs 1?" Force them to write the tie-breaker.
  *   **Minute 35:** If energy is low, announce "Double points for breaking a rule in the next 5 minutes."
  *   **Minute 55:** If a team claims they solved it, ask: "Does it work if everyone lies about their preferences?" (Briefly touch on strategy/manipulation if time permits, otherwise stick to Arrow's conditions).
  *   **Minute 70:** Ensure the vote happens. Do not let the "impossibility" paralyze the decision. The point is to decide *knowing* the imperfection.
