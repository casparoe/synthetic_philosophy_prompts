  4.  **Synthesize a Principle:**
      *   The user's condition (iii) "Not a coincidence" is the key. In philosophy of science, this is **Projectibility** or **Naturalness**. In cognitive science, this is **Salience** or **Simplicity**.
      *   *Proposal:* The "Real Rule" is the **Most Projectible Generative Hypothesis**.
