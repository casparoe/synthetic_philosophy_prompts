      *   **The Hypotheticals:**
          *   *One-stroke (Eulerian path):* This is a **Procedural/Generative Rule**. It counts if the cognitive system models the *creation* of the image, not just the static result. Hofstadter would love this. It's high salience for humans (drawing).
          *   *Lively/Balanced:* This is **Aesthetic/Statistical**. Usually rejected as a "rule" because it's not discrete/compressible. It's a "family resemblance" (Wittgenstein). It fails the "Decidability" test (User's condition ii).
      *   **Honest Admission:** Where does the principle fail?
