  **MEMORANDUM**

  **TO:** Collections Committee
  **FROM:** [Your Name], Collections Committee Member
  **DATE:** [Current Date]
  **SUBJECT:** Decision Recommendation: Kestrel Brook Colliery Oral History Proposal & Collection Strategy (FY2026–2029)

  **1. EXECUTIVE SUMMARY**

  This memo requests a decision regarding the proposal from the Kestrel Brook Descendants' Association (KBDA) and partner oral historians to deposit approximately 100 life-history interviews (2026–2027) alongside the existing Kestrel Brook Colliery Company papers (1929–1984).

  **Recommendation:** The Committee is asked to vote on **Conditional Approval**.
  We recommend accepting the oral history collection under a distinct accession number, rejecting integrated item-level description in favor of linked but separate finding aids, relocating "silence notes" to a separate Contextual Research Guide, and adopting a Dynamic Consent Protocol for third-party data. Budgetarily, we recommend reallocating the planned three-year digitization fund to the interview project, contingent on a mandated fundraising drive to restore the digitization timeline by FY2029.

  **2. BACKGROUND**

  *   **Existing Collection (Acc. 1929-04):** Working papers of the Kestrel Brook Colliery Company labour and welfare office. Predominantly top-down bureaucratic records (conduct cards, medical inspections, housing ledgers). Worker voice is present only incidentally (e.g., petition letters filed as enclosures). Significant documented silences exist regarding the 1953 strike, women's agency, and informal community arrangements.
  *   **Proposal (KBDA):** Commission 100 oral history interviews with descendants and former workers. Deposit under a co-ownership arrangement. Request integrated description (item-level links between interviews and company papers) and "silence notes" embedded in the finding aid to mark where company records are systematically mute.
  *   **Constraints:**
      *   **Cost:** Estimated cost equals three years of the planned digitization budget for the Company papers.
      *   **Legal/Ethical:** Interviews may support a pending compensation claim. Interviewees will name living third parties (foremen, doctors, neighbours), some alleging misconduct. Current library policy on born-digital sensitive data is undefined.
      *   **Technical Services:** Provenance must be maintained (separate creators = separate collections). Archivist-authored interpretation cannot appear as metadata in the finding aid.

  **3. ANALYSIS OF OPTIONS & RISKS**

  To ensure the Committee can vote with full consideration of the stakes, the following analysis outlines the primary arguments for and against the proposal, including the significant risks of proceeding without strict conditions.

  **A. Archival Integrity vs. Parity Illusion**
  *   *Argument for Integration:* Linking interviews directly to company records corrects historical bias, allowing researchers to juxtapose the worker's memory against the company's ledger.
  *   *Argument against Integration (The "Parity Illusion"):* Treating a 1948 conduct card and a 2026 interview as symmetrical metadata objects risks misleading researchers. One is a contemporaneous administrative act; the other is retrospective memory, potentially shaped by the very records they contest. Integrated item-level links may imply corroboration where none exists.
  *   *Committee Consideration:* If we integrate description, we risk compromising the evidentiary value of both collections. If we separate them entirely, we lose the opportunity to contextualize the power dynamics between the two creators.

  **B. Documenting Silence**
  *   *Argument for Silence Notes:* Embedding notes in the finding aid (e.g., "No company records survive regarding the 1953 strike") makes the archive's bias visible and prevents researchers from assuming absence of evidence is evidence of absence.
  *   *Argument against Silence Notes:* Cataloging an absence turns a gap into a "finding." It risks laundering the archive's bias by making the silence appear to be a curated fact rather than a structural void. Furthermore, Technical Services advises that archivist interpretation belongs in a research guide, not the finding aid.
  *   *Committee Consideration:* We must acknowledge the silence without allowing the finding aid to become a site of editorializing.

  **C. Legal & Ethical Liability (Third Parties)**
  *   *Risk:* Interviewees may allege violence or collusion by named individuals (e.g., Company Doctor X, Foreman Y). Grandchildren of these individuals still reside in the village.
  *   *Current Policy Gap:* We operate on fixed-period embargoes. We lack a mechanism for "dynamic consent" (withdrawal after deposit) or third-party notification.
  *   *Committee Consideration:* Proceeding without a robust protocol exposes the library to legal risk and potential harm to unconsented third parties. A standard "30-year embargo" is insufficient for allegations of personal misconduct.

  **D. Resource Allocation**
  *   *Trade-off:* Funding this project delays digitization of the Company papers by three years.
  *   *Impact:* Digitization benefits remote institutional researchers. Oral histories benefit the local community and social historians. Delaying digitization breaches a prior informal commitment to the research community.
  *   *Committee Consideration:* We cannot absorb this cost without a plan to recover the digitization timeline.

  **4. RECOMMENDATIONS FOR VOTE**

  The following motion is presented for Committee approval. It is designed to accept the community partnership while mitigating the archival, legal, and financial risks outlined above.

  **Motion 1: Acquisition Status**
  **APPROVE** the acceptance of the KBDA Oral History Collection as a **separate accession** (distinct from the Company papers) to maintain provenance.
  *   *Condition:* Co-ownership agreement must explicitly state that the Library retains final decision-making authority on access and preservation, clarifying that "co-ownership" refers to stewardship input, not legal title or veto power.

  **Motion 2: Description & "Silence Notes"**
  **APPROVE** a linked-description model, **REJECTING** item-level integration.
  *   *Implementation:* The Company papers and Oral History Collection will have separate finding aids. Cross-references will be collection-level only (e.g., "For oral testimony regarding welfare inspections, see KBDA Oral History Collection, Series 2").
  *   *Regarding Silence Notes:* **REJECT** embedding silence notes in the formal finding aid. **APPROVE** the creation of a separate **Contextual Research Guide**. This document will house the "silence notes," archivist context regarding the 1953 strike gaps, and explanatory notes on the evidentiary difference between the bureaucracy and the interviews. This satisfies the need to mark silence without violating archival description standards or creating "parity illusions" in the metadata.

  **Motion 3: Consent, Embargo, and Third Parties**
  **APPROVE** the adoption of a **Dynamic Consent Protocol** for this collection.
  *   *Implementation:*
      1.  **Third-Party Flagging:** Interviewees must identify sensitive third-party data during the interview.
      2.  **Tiered Access:** Sections containing unconsented third-party allegations will be closed indefinitely or for a minimum of 30 years, subject to review.
      3.  **Right to Withdraw:** Depositors retain the right to withdraw their specific interview post-mortem.
      4.  **Compensation Claim Disclaimer:** Access copies must include a metadata note clarifying that the Library does not endorse the veracity of claims made for legal/compensation purposes.

  **Motion 4: Budget & Phasing**
  **APPROVE** the reallocation of the FY2026–2028 Digitization Budget to fund the Oral History project.
  *   *Condition:* The Library Director is mandated to launch a targeted fundraising campaign by Q1 2026 to secure external grant funding for the Company papers digitization, with the goal of resuming that workflow by FY2029.
  *   *Timeline:*
      *   **FY2025 Q3-Q4:** Draft Dynamic Consent Protocol & Co-ownership Agreement.
      *   **FY2026 Q1:** KBDA Interviews commence.
      *   **FY2027 Q4:** Processing and creation of Contextual Research Guide.
      *   **FY2028 Q1:** Collection open with tiered access restrictions.
      *   **FY2029 Q1:** Digitization of Company papers resumes (contingent on fundraising).

  **5. CONCLUSION**

  This recommendation seeks a middle path. It rejects the "comfortable option" of digitizing only the company papers, acknowledging that doing so perpetuates the archival silence surrounding the workers' lives. However, it also rejects the proposed "integrated" model, acknowledging the valid archival critique that doing so creates a false symmetry between bureaucracy and memory.

  By separating the collections but linking them through a Contextual Guide, we preserve provenance and evidentiary clarity. By adopting Dynamic Consent, we protect the library and the community from legal and ethical harm. By mandating a fundraising recovery plan, we acknowledge our debt to the wider research community waiting for digitization.

  **Action Required:** Vote on Motion 1–4 by Thursday, [Date].

  ***

  **Attachments:**
  *   Draft Co-Ownership Agreement (Legal Review Pending)
  *   Cost Breakdown: Oral History Commission vs. Digitization
  *   Technical Services Memo on Provenance Standards
