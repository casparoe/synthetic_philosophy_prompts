  ### Where the Principle Cannot Accommodate Your Verdicts

  There is one tension point where your intuition might diverge from a strict application of this principle, specifically regarding **Case 7**.

  **The Tension:**
  You voted to ignore a high false-positive rate in a narrow subgroup because it wasn't pre-registered. The Principle supports this via **Procedural Integrity**.
  *However*, if the Harm Burden in that narrow subgroup is catastrophic (e.g., wrongful detention vs. minor credit delay), a strict "Minimized Burden" calculation might demand fixing the subgroup *despite* the Procedural Burden, because Harm > Stability.

  **Your Defense:**
  You noted: *"I also think I would have voted with her had that subgroup been on the pre-registered list."*
  This implies you value **Ex-Ante Consent** (Pre-registration) over **Ex-Post Harm Minimization**. You are treating the pre-registered list as a **Rule of Law** constraint.
  *   **Principle Adjustment:** To fully match you, the principle must add a **Lexical Priority of Pre-Registration.** Procedural rules agreed upon *before* the model is fit bind the committee even if post-hoc analysis reveals disparities, unless those disparities indicate a Validity failure (Case 4).
  *   **Why?** Because allowing post-hoc subgroup mining incentivizes vendors to overfit to known protected groups while neglecting others, or encourages committees to chase noise. The "burden" of the unfairness is weighed against the "burden" of a system where rules change after the game has started. You have decided the latter is worse.

  ### Summary for Your Committee
  When challenged on consistency, you can state:
  > "I do not vote for statistical parity; I vote for **minimized burden**. I equalize error rates only when the error imposes the primary harm (Cases 1, 2, 5). I reject parity when recourse is structurally blocked (Case 6) or when the target is corrupted (Case 4). I prioritize stability over static accuracy because subjects need predictable rules to exercise agency (Cases 7, 8). My standard is not the model's distribution, but the subject's capacity to navigate it."

  This is not inconsistency. It is **contextual equity.**
