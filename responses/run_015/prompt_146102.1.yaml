answer: |-
  You are not inconsistent. Your voting record reflects a coherent, multi-dimensional framework that prioritizes **human agency and procedural integrity** over static statistical properties. You are operating under a principle that treats fairness not as a property of the model's output distribution, but as a property of the **relationship between the subject and the system.**

  I propose your underlying logic is captured by **The Principle of Minimized Asymmetric Burden.**

  ### The Principle Stated

  **A decision system is fair if it minimizes the total burden imposed on subjects, where "burden" is the sum of three components:**
  1.  **Harm Burden:** The cost of the specific error type that damages the subject's status (liberty, wealth, health).
  2.  **Agency Burden:** The difficulty for the subject to feasibly alter the decision through legitimate action.
  3.  **Procedural Burden:** The uncertainty and instability introduced by the system's rules changing over time or across unannounced subgroups.

  **Decision Rule:** When constraints conflict, minimize the component of burden that is most irreversible or structurally fixed for the subject.

  ---

  ### The Three Clauses and Case Mapping

  This principle decomposes into three operational clauses that correspond to your verdicts.

  #### Clause 1: Directionality of Harm (Cases 1, 2, 3, 5)
  *   **Rule:** Identify whether the decision primarily **withholds a benefit** or **imposes a penalty**.
      *   If **withholding a benefit** (Hiring, Loans): The primary burden is the False Negative (qualified but rejected). Equalize **True Positive Rates** (or False Negative Rates).
      *   If **imposing a penalty** (Fraud, Detention): The primary burden is the False Positive (innocent but flagged). Equalize **False Positive Rates**.
      *   If **advisory** (Sepsis): The burden lies in misinforming the human decision-maker. Prioritize **Calibration** so the human can weigh risk accurately.
  *   **Matches:**
      *   **Case 1 (Hiring):** Benefit withheld. You equalized TPR.
      *   **Case 2 (Fraud):** Penalty imposed. You equalized FPR. (Explains why 1 and 2 differ despite identical math: the *stakes* are inverted).
      *   **Case 3 (Sepsis):** Advisory. You prioritized Calibration.
      *   **Case 5 (Pretrial/FTA):** Penalty (detention). You equalized FPR.

  #### Clause 2: Feasibility of Recourse (Cases 4, 6)
  *   **Rule:** Statistical parity is void if the **Agency Burden** is asymmetric. If one group cannot feasibly change the inputs to change the outcome (due to structural barriers), equal error rates do not equalize total burden. Furthermore, if the target variable itself reflects systemic bias rather than ground-truth risk, the **Harm Burden** is undefined.
  *   **Matches:**
      *   **Case 4 (Pretrial/Arrest):** Target validity failed. Arrest $\neq$ Guilt/Risk. You rejected statistical fixes on a corrupted target.
      *   **Case 6 (Credit/Recourse):** Equal FNR existed, but recourse was structurally impossible for one group (relocating vs. documenting). The Agency Burden was infinite for one group. You rejected the model.

  #### Clause 3: Procedural Integrity (Cases 7, 8)
  *   **Rule:** **Procedural Burden** (instability) trumps static optimization. Subjects require stable rules to plan their lives. Post-hoc subgroup adjustments create moving goalposts; version churn creates arbitrary status loss. Pre-registration creates a binding contract that reduces Procedural Burden.
  *   **Matches:**
      *   **Case 7 (Subgroups):** You upheld the pre-registered coarse partition. Fixing post-hoc subgroups increases Procedural Burden (unpredictability) for the whole population. Had it been pre-registered, the contract would have included that subgroup, justifying the refit.
      *   **Case 8 (Versioning):** Version 2 had better static metrics but higher churn. Churn is a Procedural Burden (arbitrary reversal of status). You blocked rollout to preserve stability.

  ---

  ### Addressing Your Two Further Questions

  #### 1. The Impossibility of Simultaneous Satisfaction
  You asked if requirements like Recourse Parity (Case 6) and Stability (Case 8) make the standard conflict (Calibration vs. Error Parity) worse, and which should yield.

  **Yes, they make it worse.** You cannot simultaneously satisfy Calibration, Error-Rate Parity, Recourse Feasibility, and Cross-Version Stability.

  **The Yield Order:**
  Based on your verdicts and the Principle of Minimized Asymmetric Burden, the hierarchy of constraints is:
  1.  **Target Validity** (Case 4): If the target is biased, no statistical fix works. **Yields nothing; aborts the model.**
  2.  **Agency/Recourse** (Case 6): If recourse is structurally blocked, statistical parity is meaningless. **Parity yields to Recourse.**
  3.  **Procedural Stability** (Cases 7, 8): If the rules change arbitrarily, subjects cannot exercise agency. **Accuracy/Parity yields to Stability.**
  4.  **Error-Rate Parity** (Cases 1, 2, 5): Required only when Validity, Agency, and Stability are secured. **Calibration yields to Parity** in determinative gates (1, 2, 5), but **Parity yields to Calibration** in advisory contexts (3).
  5.  **Accuracy:** The first to go when it conflicts with the above.

  **Why this order?**
  Validity and Agency are *preconditions* for the subject to exist as a moral agent within the system. Stability is the *precondition* for the subject to plan their actions. Parity and Calibration are *properties of the measurement*. You are prioritizing the **subject's capacity to act** over the **model's statistical elegance.**

  #### 2. The Randomization Question
  *Is randomizing around the threshold to achieve parity a cheat or an honest reply?*

  **Verdict:** Under the Principle of Minimized Asymmetric Burden, randomization is generally a **cheat** that increases Total Burden, though it may be permissible as a temporary emergency brake.

  **Reasoning:**
  Randomization reduces Error Burden (by enforcing parity) but drastically increases **Procedural Burden** and reduces **Agency**.
  *   **Agency:** If outcomes are partly lottery, the link between self-improvement and outcome is weakened. A subject cannot know if a rejection was due to their risk profile or the coin flip. This degrades the signal needed for recourse (violating Case 6 logic).
  *   **Procedural Burden:** It introduces fundamental uncertainty into the rules.
  *   **Exception:** Randomization is only justified if the alternative is a **Rights Violation** (e.g., unconstitutional detention) that cannot be fixed by Validity or Agency adjustments. In that specific narrow band, the Harm Burden of the bias outweighs the Procedural Burden of the lottery.

  In your credit and hiring contexts (Cases 1, 6, 8), randomization would likely be incorrect because it undermines the recourse and stability you prioritized in those votes.

