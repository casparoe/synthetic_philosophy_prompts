  ### 1. Critique of Framing and Premises
  Your framing contains a significant category error regarding the **Principal Principle (PP)**. The PP states that rational credence should match objective chance *only conditional on admissible evidence*. David Lewis explicitly designed the principle to handle cases where we know the chance but lack "inadmissible" information (like future outcomes).

  Treating "I exist" as standard admissible evidence for the PP misunderstands its function in self-locating contexts. In Lewisian frameworks, self-locating existence is often treated as **inadmissible** for the purpose of evaluating the chance hypothesis itself (to avoid circularity), but it acts as a hard constraint on Bayesian conditionalization. In short: The PP tells you what to believe *before* you check the outcome; once you know you exist, the PP is silent, and standard conditionalization takes over.

  Furthermore, applying "objective chance" to cosmological constants across modal space (possible worlds) is metaphysically contentious. A Humean about chance (which your professor appears to be, given Ruling 5) typically defines chance via actual frequencies/patterns in *this* world, not proportions across a multiverse. However, assuming the seminar accepts the premise of a "cosmological chance," here is the reconstruction.

  ### 2. Reconstructed Rules
  Based on the five rulings, your professor is operating with three implicit principles:

  1.  **The Principal Principle (PP):** If an agent knows the objective chance $Ch(P) = x$ and possesses only *admissible* evidence, her credence $Cr(P)$ must equal $x$. (Derived from Rulings 1 & 2).
  2.  **The Admissibility Constraint:** Evidence is admissible only if it concerns the specific history or direct outcome of the chance setup. Statistical correlations from distinct setups (Ruling 4) or metaphysical facts inaccessible to the agent (Ruling 5) are inadmissible and do not override the chance function.
  3.  **Empirical Trumps:** Direct observation of the specific outcome overrides the PP. If the agent sees the result, credence moves to match the observation, not the prior chance. (Derived from Ruling 3).

