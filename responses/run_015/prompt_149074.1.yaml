answer: |-
  # Activity Plan: The Tribunal of St. Jude's
  **Duration:** 90 Minutes  
  **Participants:** 18 Students (3 Groups of 6)  
  **Materials:** 90 Poker Chips (or coloured counters), 3 Sets of Confidential Briefs, 1 Large 'Void' Bowl, Whiteboard.  
  **Language:** British English.

  ## 1. Learning Objective
  To demonstrate that moral frameworks (Honor, Dignity, Victimhood) are often **incommensurable**. Participants will discover that 'justice' looks fundamentally different depending on whether one prioritises reputation, procedure, or structural harm, making a neutral ranking of superiority impossible from within any single system.

  ## 2. Setup and Context (00:00 – 00:10)
  **The Scenario:**  
  The school's prestigious 'Founder's Cup' Debate Final has concluded. Team A won, but Team B has publicly accused Team A's captain of plagiarising their closing argument. The accusation was made on social media before the headmaster could investigate.
  *   **Team A's Family** feels their name is sullied.
  *   **The School Administration** feels the rules were breached by the public accusation.
  *   **A Student Coalition** claims the accusation is rooted in systemic bias against Team A's demographic.

  **The Stakes:**  
  Each group receives 30 **Prestige Chips**. These represent social capital.
  *   If a consensus is reached in a round, no chips are lost.
  *   If consensus fails, 5 chips are burned from *each* group (placed in the 'Void' Bowl).
  *   If a group agrees to a solution that violates their **Core Principle** (found in their brief), they lose *all* remaining chips (simulating social exile or loss of integrity).
  *   The group with the most chips at the end 'wins' the right to draft the school's ethical code (though the teacher should emphasise this victory is hollow if consensus failed).

  **Grouping:**  
  Divide the class into three groups of six: **Group Alpha**, **Group Beta**, and **Group Gamma**.  
  *Do not use the labels Honor, Dignity, or Victimhood.*

  ## 3. Confidential Briefings (00:10 – 00:20)
  Hand out the sealed briefs. Students must not show their brief to other groups. Each group has internal roles to create friction.

  ### Group Alpha Brief (The Honor Framework)
  *   **Identity:** You are the Family and Allies of the Accused (Team A).
  *   **Core Principle:** **Reputation is Identity.** An attack on one is an attack on all. A stain on the name must be cleansed publicly. Private settlements are for the guilty.
  *   **Internal Roles:**
      *   *2 Elders:* Demand a public retraction from the accuser to restore standing.
      *   *2 Champions:* Willing to escalate conflict (challenge the accuser) to prove strength.
      *   *2 Kin:* Worried about violence/expulsion, prefer restoration without physical risk.
  *   **Veto Condition:** You cannot accept a solution that treats this as a private administrative matter. The public must see the name cleared.

  ### Group Beta Brief (The Dignity Framework)
  *   **Identity:** You are the School Disciplinary Committee.
  *   **Core Principle:** **Procedural Neutrality.** Individuals are separate from their acts. Emotions and status are irrelevant. Only evidence and rules matter. Public spectacle undermines fairness.
  *   **Internal Roles:**
      *   *2 Adjudicators:* Insist on a closed-door hearing based strictly on text comparison.
      *   *2 Clerks:* Want to resolve this quickly to maintain order, even if facts are fuzzy.
      *   *2 Witnesses:* Concerned that ignoring the public outcry looks like a cover-up.
  *   **Veto Condition:** You cannot accept a solution that privileges status, family name, or group identity over established rules. The process must be blind to status.

  ### Group Gamma Brief (The Victimhood Framework)
  *   **Identity:** You are the Student Equity Coalition.
  *   **Core Principle:** **Structural Harm.** The accusation is not an isolated event but a symptom of power imbalance. The focus must be on the harm caused to the marginalised, not just the 'facts'.
  *   **Internal Roles:**
      *   *2 Advocates:* Demand the institution acknowledge its history of bias before judging the act.
      *   *2 Survivors:* Feel unsafe; want anonymity and protection from the 'powerful' family.
      *   *2 Allies:* Want to mobilise public protest to force institutional change.
  *   **Veto Condition:** You cannot accept a solution that treats the parties as equals if power dynamics are ignored. The remedy must address systemic bias, not just the plagiarism claim.

  ## 4. Round 1: Defining the Harm (00:20 – 00:35)
  **Task:** The groups must agree on a single sentence describing *what actually happened* to be read in assembly.
  **Constraint:** Each group must sign the statement.
  **Facilitator Note:** Watch for the clash.
  *   Alpha wants: "A false slander was committed against an honourable house."
  *   Beta wants: "An allegation of academic misconduct was raised."
  *   Gamma wants: "A harmful act rooted in competitive bias occurred."

  **Mechanic:** If they cannot agree on the wording in 15 minutes, 5 chips are burned from each group.
  **Likely Outcome:** Failure. Alpha sees Beta's wording as cold; Beta sees Gamma's wording as unscientific; Gamma sees Alpha's wording as oppressive.

  ## 5. Round 2: Negotiating the Remedy (00:35 – 01:00)
  **Task:** Agree on a specific punishment or resolution.
  **Constraint:** You must produce one document.
  **Mechanic:**
  *   Groups may negotiate freely.
  *   **The Unity Tax:** Before presenting a deal to the other groups, each group must vote internally. If their internal roles (e.g., Elders vs. Kin) do not agree, they must pay 3 chips to the Void before entering negotiations.
  *   **Veto:** Any group can veto the final deal if it violates their Core Principle. If vetoed, 10 chips are burned from *everyone*.

  **Facilitator Note:** This is the crux.
  *   Alpha needs a public apology (violates Beta's privacy rule).
  *   Beta needs a private hearing (violates Alpha's public restoration need).
  *   Gamma needs an admission of bias (violates Beta's neutrality and Alpha's implication that they are innocent).
  *   *Compromise is costly:* To agree, they must surrender chips (simulating loss of integrity).

  ## 6. Round 3: The Precedent (01:00 – 01:15)
  **Task:** Establish one rule for future accusations.
  **Constraint:** Must be signed by all.
  **Mechanic:** Same as Round 2.
  **Goal:** Push them to realise that the *rules of the game* are what they disagree on, not just the outcome.
  **Likely Outcome:** Total deadlock. The 'Void' Bowl should be visibly full of chips.

  ## 7. Debrief and Revelation (01:15 – 01:45)
  This is the most critical phase. Do not rush.

  ### Step 1: The Reveal (5 mins)
  Ask the groups to open their envelopes again. Reveal the hidden labels:
  *   **Group Alpha:** Honor Culture.
  *   **Group Beta:** Dignity Culture.
  *   **Group Gamma:** Victimhood Culture.

  Explain that these are sociological frameworks (referencing Campbell & Manning). Ask: *Did you feel the other groups were being unreasonable, or even immoral?*

  ### Step 2: Mapping the Breakdown (10 mins)
  Draw three columns on the board. Ask students to map their frustrations to the concepts.
  *   **Honor:** "Why wouldn't they apologise publicly?" -> *Offense is identity-level injury. Shame is the sanction.*
  *   **Dignity:** "Why bring family/status into it?" -> *Self-worth is inherent. Guilt is the sanction. Procedure protects the individual.*
  *   **Victimhood:** "Why ignore the power dynamic?" -> *Status derives from suffering/marginalisation. Validation is the sanction.*

  **Key Insight:** Ask, "Could Alpha have agreed to Beta's solution without losing honour?" (No). "Could Beta have agreed to Gamma's solution without abandoning neutrality?" (No).
  *Conclusion:* The failure was not due to stubbornness, but **incommensurability**. They were speaking different moral languages.

  ### Step 3: The 'Fourth Culture' (5 mins)
  Address the prompt's philosophical query.
  *   Ask: "Who was watching this fight?" (The seminar class).
  *   Explain: "To compare these cultures, you had to stand outside them. Philosophers call this a 'meta-ethical' stance. Some argue this creates a **Fourth Culture: The Audience**. This culture values *understanding* over *winning*. It treats status and suffering as objects of study rather than commands for action."
  *   Caution: "But be careful. The Audience can become detached, treating real pain as a game. That is the risk of philosophy."

  ### Step 4: Limitations of the Simulation (5 mins)
  Be explicit about what the tokens *cannot* reproduce.
  *   **Phenomenological Weight:** In the sim, losing chips is annoying. In reality, losing honour can mean social death; losing dignity can mean psychological fracturing; suffering systemic bias can mean physical danger.
  *   **Historical Embeddedness:** These cultures are not just 'choices'; they are inherited histories. You cannot simply 'role-play' out of centuries of shame or oppression.
  *   **Internal Cohesion:** In reality, these cultures are messy. We simplified them to make the conflict visible.

  ### Step 5: Final Takeaway (5 mins)
  State clearly:
  *"Moral superiority is unanswerable because it depends on which kind of harm you treat as fundamental. If you believe **shame** is the worst harm, Honor is superior. If you believe **unfairness** is the worst harm, Dignity is superior. If you believe **oppression** is the worst harm, Victimhood is superior. The debate is not about who is right, but about what constitutes a 'wound'."*

  ---

  ## Facilitator's Guide: Predictable Pitfalls

  **1. The "Split the Difference" Compromise**
  *   **Problem:** Students may try to write a vague statement like "We will look into it fairly while respecting everyone."
  *   **Management:** Enforce the **Veto Condition** strictly. If a Group Beta student signs a statement that admits "bias" without evidence, remind them they lose *all* chips for violating Procedural Neutrality. Make the cost of betrayal tangible.

  **2. Dominance by Loud Voices**
  *   **Problem:** One student in Group Alpha might dictate terms, ignoring the 'Kin' role.
  *   **Management:** During the 'Unity Tax' phase, require a secret ballot within the group. If the Kin outvote the Elders, the Elders must be heard. This forces the internal conflict requested in the prompt.

  **3. Cynicism / Gamification**
  *   **Problem:** Students might treat the chips as a game to be 'won' rather than a simulation of integrity.
  *   **Management:** Frame the chips as 'Integrity'. If they lose them all, they are 'exiled'. Maintain a serious tone. If a group laughs, pause the simulation and ask: "In a real honor culture, laughing at this process would be a provocation. How does that feel?"

  **4. Running Out of Time**
  *   **Problem:** Negotiations can drag.
  *   **Management:** Be a strict timekeeper. Use a visible timer. If Round 2 is not finished by minute 60, declare a "Status Quo Failure" and burn the chips immediately. The *failure* is the lesson; do not rush the debrief to save the activity.

  ## Materials Checklist
  *   **Prestige Chips:** 90 total (30 per group).
  *   **Void Bowl:** A dark box or bowl placed centrally.
  *   **Briefs:** Printed and sealed in envelopes labelled Alpha, Beta, Gamma.
  *   **Whiteboard:** For mapping the breakdown during debrief.
  *   **Timer:** Visible to all students.

  ## Teacher's Note on British English Usage
  Ensure all handouts use British spelling (e.g., *Honour, Programme, Centre, Realise, Behaviour, Defence, Offence*). Use vocabulary appropriate for a UK sixth-form context (e.g., *Headmaster, Term, Form, Prefect* if applicable, though generic terms are safer). The tone should be formal and academic, respecting the students' intellectual capacity while maintaining classroom management.
