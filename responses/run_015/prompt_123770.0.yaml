      *   *Section 3 (Uniqueness):* This is the "Reference Magnet" or "Multiple Realizability" issue. In science, causal powers fix reference. In ethics, what fixes reference? If it's just the "role," and multiple properties fit, reference fails. This is a critical disanalogy.
      *   *Section 4 (Three Plain Statements):*
          *   *Evidence:* Explanatory indispensability vs. Reflective Equilibrium. The risk of circularity.
          *   *Gap:* Shifted to the justification of the identity premise.
          *   *Silence:* The "Practicality" constraint. Science describes; Ethics prescribes. The bridge doesn't explain *why* the identity motivates.
      *   *Conclusion:* Summarize the verdict. The strategy is logically coherent but metaphysically/epistemologically precarious compared to science.

  7.  **Refining the Tone:**
      *   Avoid condescension. The user knows logic and science.
      *   Avoid metaethical jargon where possible, or define it immediately (e.g., "Non-Analytic Naturalism").
      *   Ensure the "Verdict" is clear.
