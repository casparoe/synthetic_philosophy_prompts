prompt: |-
  I am drafting a novel about institutional blindness, and I need a rigorous conceptual map rather than a historical chronicle. Analyze the 1986 Challenger launch-decision meeting through Daniel Dennett's three stances—the physical stance, the design stance, and the intentional stance—treating the episode as a test of whether these explanatory levels can be cleanly separated when applied to collective action. Be precise in your mapping: under the physical stance, identify the material conditions and causal mechanisms that made the O-ring failure inevitable once the temperature threshold was crossed; under the design stance, show how the shuttle system was functionally organized to approve launches and what that organization predicted about failure modes; and under the intentional stance, specify what beliefs and desires must be attributed to the individual engineers versus to the management committee that overruled them. Then turn to the niche problem that the standard framework avoids: the intentional stance was built for individual agents, yet here the decisive actor was a bureaucratic committee with distributed authority and no unified mental state. Does applying the intentional stance to NASA management require attributing a single collective belief about risk, and does that attribution stretch the stance to incoherence? Or does retreating to the design stance—treating the committee as a functional apparatus optimized for schedule adherence—erase the moral agency that makes the disaster blameworthy? Conclude with what the Challenger episode reveals about whether the three stances remain mutually exclusive for institutional failures, or whether collective human action forces a hybridization that Dennett's original framework never anticipated. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
