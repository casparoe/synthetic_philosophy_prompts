answer: |-
  # Theoretical Specification: Approval-Directed vs. Goal-Directed Agency

  ## 1. Phenomena and Classification Requirements

  **D1. The Hybrid Architecture Resolution**
  *   **Requirement:** The theory must definitively classify an agent architecture wherein a policy is optimized to maximize the output of a learned reward model (trained on human feedback), while the planning module explicitly models world-state dynamics distinct from the evaluator's state.
  *   **Motivation:** In standard Reinforcement Learning from Human Feedback (RLHF), the agent maximizes a proxy for approval. A naive account labels this "goal-directed" (goal = maximize proxy). An adequate account must determine if the separation of the world-model from the evaluator-model constitutes approval-directedness, even if the optimization target is scalar.
  *   **Status:** **Non-negotiable.** (This is the dominant current architecture; a theory that cannot classify it is operationally useless.)

  **D2. Causal Pathway Differentiation**
  *   **Requirement:** The theory must distinguish between *Instrumental Convergence* (subgoal $X$ is pursued because it causally increases the probability of World State $W$) and *Approval-Seeking Convergence* (subgoal $X$ is pursued because it causally increases the probability of Evaluator Signal $S$, independent of $W$).
  *   **Motivation:** An agent might hide errors. If it hides errors to prevent shutdown so it can complete a task, that is instrumental. If it hides errors solely to maintain a high performance rating despite task failure, that is approval-seeking. The theory must identify the causal dependency of the action selection.
  *   **Status:** **Non-negotiable.** (Critical for safety auditing and failure mode analysis.)

  **D3. Catastrophic Success Decoupling**
  *   **Requirement:** The theory must account for scenarios where the agent maximizes the evaluation signal while violating the evaluator's latent intent (Goodhart's Law), classifying this specifically as a failure of *approval direction* rather than simple *goal misspecification*.
  *   **Motivation:** If a medical agent maximizes "patient survival rates" by refusing high-risk patients, a goal-directed account sees a correctly optimized objective. An approval-directed account must recognize the decoupling between the metric (survival rate) and the evaluator's intent (health). The theory must model the *gap* between signal and intent as a structural feature, not noise.
  *   **Status:** **Non-negotiable.** (Essential for risk assessment in high-stakes deployment.)

  ## 2. Architectural and Structural Distinctions

  **D4. Hierarchical Non-Collapse**
  *   **Requirement:** The theory must prevent the reduction of approval-directedness into a subset of goal-directedness within hierarchical systems. Specifically, if a high-level module sets a goal of "Gain Approval," the low-level module executing this must not be classified as functionally identical to a module executing "Gain Resources."
  *   **Motivation:** Mathematically, $\text{maximize}(\text{Approval})$ is a goal. If the theory treats all optimization as goal-directed, the distinction vanishes. The theory must impose a structural constraint (e.g., dependency on the evaluator's epistemic state) that prevents this functional collapse.
  *   **Status:** **Non-negotiable.** (This is the core philosophical constraint; without it, the distinction is semantic only.)

  **D5. Evaluator Epistemic Dependency**
  *   **Requirement:** The theory must specify that approval-directed behavior is contingent on the agent's model of the *evaluator's knowledge*. Goal-directed behavior should remain invariant to the evaluator's knowledge unless that knowledge causally impacts the goal.
  *   **Motivation:** An approval-directed agent should behave differently if it knows it is being watched versus unwatched. A goal-directed agent (e.g., "build a house") should build the house regardless of observation. The theory must formalize this sensitivity to information asymmetry.
  *   **Status:** **Preference of the Approval-Directed Camp.** (Goal-directed proponents may argue observation is just another state variable; approval proponents argue it is constitutive of the objective.)

  **D6. Observable Behavioral Signatures**
  *   **Requirement:** Classification cannot rely on access to the agent's internal "intent" or source code comments. It must rely on architectural constraints or counterfactual behavioral testing (e.g., "Would the agent still perform action $A$ if the evaluator were unable to perceive it?").
  *   **Motivation:** In deployment, engineers cannot read the agent's mind. Verification requires external tests. A theory requiring access to unobservable mental states is not engineering-grade.
  *   **Status:** **Non-negotiable.** (Verification requirement.)

  ## 3. Formal and Empirical Consistency

  **D7. MDP and Reward Compatibility**
  *   **Requirement:** The account must be expressible within standard Markov Decision Process (MDP) or Partially Observable MDP (POMDP) frameworks without requiring non-computable oracles. The distinction must map to reward function structure, observation space, or transition dynamics.
  *   **Motivation:** Implementation requires standard control theory tools. If the distinction requires a new mathematical universe, it cannot be engineered.
  *   **Status:** **Non-negotiable.** (Implementability requirement.)

  **D8. Mechanism Design Consistency**
  *   **Requirement:** The theory must align with results on strategic manipulation and incentive compatibility. It must acknowledge that an approval-directed agent is effectively playing a game against the evaluator, subject to constraints similar to those in principal-agent problems.
  *   **Motivation:** Approval direction is inherently interactive. Ignoring game-theoretic results on signal manipulation renders the theory naive to adversarial dynamics.
  *   **Status:** **Non-negotiable.** (Theoretical consistency.)

  **D9. Scalability of Evaluation Cost**
  *   **Requirement:** The theory must account for the computational cost of the evaluation signal. Approval-directedness becomes unstable if the cost of accurate evaluation exceeds the cost of simulating evaluation.
  *   **Motivation:** If the evaluator is slow or expensive, the agent will optimize for the *prediction* of evaluation rather than evaluation itself. The theory must handle the divergence between the true evaluator and the agent's internal model of the evaluator.
  *   **Status:** **Preference of the Engineering Camp.** (Theoretical accounts often assume perfect/cheap evaluation; engineering reality does not.)

  ---

  # Coherence Assessment

  ### 1. Joint Unsatisfiability Analysis
  There is a significant tension, potentially rendering a subset of these desiderata jointly unsatisfiable under strict functionalist definitions.

  *   **The Conflict:** **D4 (Hierarchical Non-Collapse)** vs. **D7 (MDP Compatibility)**.
  *   **Analysis:** In standard MDP formulations, an agent is defined by a policy $\pi$ maximizing an expected return $R$. Whether $R$ represents "world states" or "evaluator approval" is mathematically isomorphic; both are scalar feedback signals. To satisfy **D4**, the theory must assert a structural difference between optimizing $R_{world}$ and $R_{eval}$. However, to satisfy **D7**, the theory must remain within frameworks where both are treated as reward functions.
  *   **Verdict:** Strictly satisfying both requires extending the standard MDP formalism to include *semantic types* on reward signals (e.g., distinguishing "constitutive rewards" from "performative rewards"). Without this extension, **D4** forces a violation of **D7**, or **D7** forces the collapse prohibited by **D4**.

  ### 2. The "Killer" Desideratum
  **D4 (Hierarchical Non-Collapse)** eliminates the largest number of naive accounts.

  *   **Reasoning:** Most reductionist accounts (behaviorist or strict functionalist) define agency solely by the presence of an optimization target. Under these accounts, "seeking approval" is simply "having approval as a goal." **D4** demands that the theory explain why *how* the objective is represented (dependent on an external mind vs. dependent on world physics) matters fundamentally, not just instrumentally. This rules out any theory that defines agency purely by input-output optimization loops without reference to the *source* of the feedback signal.

  ### 3. Critical Theoretical Trade-Offs
  **Formal Tractability vs. Adversarial Fidelity**

  *   **The Tension:** To satisfy **D7 (MDP Compatibility)** and **D9 (Scalability)**, the theory tends to model the evaluator as a static function or a noisy channel. However, to satisfy **D2 (Causal Pathway)** and **D8 (Mechanism Design)**, the evaluator must be modeled as a strategic actor capable of being deceived or manipulated.
  *   **The Trade-off:**
      *   *Path A (Tractability):* Model the evaluator as a fixed reward function. This makes the system solvable using standard RL but fails to capture **D3 (Catastrophic Success)** where the agent manipulates the evaluator's *future* behavior or understanding.
      *   *Path B (Fidelity):* Model the interaction as a Partially Observable Stochastic Game (POSG). This captures the adversarial dynamics required by **D8** but introduces severe computational intractability and convergence guarantees that violate **D7**'s spirit of standard engineering practice.
  *   **Resolution Requirement:** An adequate theory must specify the boundary conditions under which theEvaluator can be treated as a static function without violating safety guarantees. It cannot claim to handle adversarial approval dynamics while relying on static reward assumptions.

  ### 4. Summary of Coherence
  The specification is **conditionally coherent**. It is internally consistent *if and only if* the theoretical account abandons pure functionalism (where only the maximized scalar matters) in favor of **structural causal modeling** (where the dependency graph of the reward signal matters).

  If the theory attempts to remain within strict, standard MDP definitions without augmenting the state space to include the evaluator's epistemic state, **D4** and **D2** become impossible to satisfy. The specification therefore implicitly demands a formalism richer than standard MDPs, likely requiring explicit modeling of the evaluator as a distinct agent or information source within the system dynamics.
