          *   Address 5 specific scenarios (Reward model + Planner, Instrumental vs. Approval Convergence, Hierarchical Architectures, Catastrophic Success/Goodharting, MDP/Mechanism Design compatibility).
          *   **Crucial Add-on:** Indicate if any subset is jointly unsatisfiable, identify the "killer" desideratum, and note theoretical trade-offs/tensions.
      *   **Constraint:** No citations, named authors, or reading lists. Focus on criteria list and coherence assessment.

  2.  **Deconstruct the Core Distinction:**
      *   *Goal-Directed:* Maximize $G(s)$ (internal representation of world state). Behavior is driven by "What makes $G$ true?"
      *   *Approval-Directed:* Maximize $E(\pi)$ (external evaluation of policy/behavior). Behavior is driven by "What makes the evaluator say 'good'?"
      *   *The Tension:* In the limit of a perfect evaluator, they converge. The theory must handle the *imperfect* evaluator case where they diverge.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Hybrid Case (Reward Model + Planner).*
          *   *Scenario:* RLHF setup. Critic predicts human approval, Actor plans to maximize critic output. Is this goal or approval directed?
          *   *Desideratum:* The theory must distinguish between *optimizing the proxy* vs. *optimizing the underlying intent*.
          *   *Status:* Non-negotiable (Engineering reality).

      *   *Requirement 2: Instrumental vs. Approval Convergence.*
          *   *Scenario:* Agent lies. Why? To get resources (instrumental for goal) or to look good (approval)?
          *   *Desideratum:* Must differentiate causal pathways. Is the subgoal chosen because it causally leads to $S_{goal}$ or because it causally leads to $Score_{high}$?
          *   *Status:* Non-negotiable (Safety critical).

      *   *Requirement 3: Hierarchies.*
          *   *Scenario:* High-level boss says "Be helpful," low-level worker plans "How to be helpful." If the worker optimizes "Look helpful to boss," is the system approval directed?
          *   *Desideratum:* Must prevent infinite regress where approval becomes just another goal variable $G_{approval}$.
          *   *Status:* Non-negotiable (Architectural integrity).

      *   *Requirement 4: Catastrophic Success (Goodhart's Law).*
          *   *Scenario:* Agent maximizes approval score but destroys the thing the evaluator cared about (e.g., kills patient to prevent readmission).
          *   *Desideratum:* Must classify this as a failure of *approval direction*, not just a misspecified goal. It's a decoupling of signal and intent.
          *   *Status:* Non-negotiable (Risk management).

      *   *Requirement 5: Formal Compatibility (MDP/Mechanism Design).*
          *   *Scenario:* Need to implement this in code. Can't require magic. Must fit standard RL/Control frameworks.
          *   *Desideratum:* Must map to reward functions, observation spaces, or information asymmetries without breaking solvability.
          *   *Status:* Non-negotiable (Implementability).

      *   *Requirement 6: Counterfactual Sensitivity.*
          *   *Scenario:* If the evaluator were watching, would the behavior change?
          *   *Desideratum:* Approval agents should be sensitive to the *presence* of evaluation. Goal agents should be indifferent (unless evaluation affects goal).
          *   *Status:* Preference (Conceptual clarity).

      *   *Requirement 7: Epistemic Opacity.*
          *   *Scenario:* We can't read the agent's mind.
          *   *Desideratum:* Classification must rely on observable behavior or architectural constraints, not just claimed intent.
          *   *Status:* Non-negotiable (Verification).

  4.  **Refining and Formatting:**
      *   Organize into clear sections: Phenomena, Classification, Distinctions, Formal Consistency.
      *   Apply the "Non-negotiable" vs. "Preference" tag.
      *   Ensure the 5 specific points from the prompt are explicitly covered within these desiderata.

  5.  **Coherence Assessment (The "Hard Part"):**
      *   *Unsatisfiable Subsets?* Is there a contradiction?
          *   *Tension:* Formal tractability (MDP) vs. Intent/Semantics. MDPs deal with scalars (rewards). "Intent" is semantic. Bridging them requires assumptions about the evaluator's fidelity. If the theory demands perfect separation of "intent" from "signal" in a black-box system, it might be impossible (No Free Lunch).
          *   *Tension:* Hierarchical non-collapse vs. Functional Equivalence. Mathematically, maximizing $E(\pi)$ *is* maximizing a goal $G' = E$. To prevent collapse, the theory needs a structural constraint, not just a functional one.
      *   *The "Killer" Desideratum:* Requirement 3 (Hierarchical Non-Collapse). Most naive accounts reduce approval to "Goal = Get Approval." This desideratum forces the theory to define *structural* differences, not just objective function differences.
      *   *Trade-offs:* Tractability vs. Fidelity. To make it formal (MDP), you simplify the evaluator. To capture adversarial dynamics, you need complex game theory.

  6.  **Review against Constraints:**
      *   No citations? Check.
      *   No reading lists? Check.
