answer: |-
  Hi there, here is the prep sheet you asked for. The objection that will do you the most damage is the retributivist claim that without desert, punishment loses its distinctive moral character and becomes mere management or violence, because if you cannot explain why the state is permitted to inflict hard treatment rather than just quarantine or therapy, the law scholars will dismiss your view as irrelevant to legal practice. You should concede in your opening two minutes that your view does change the justification of punishment away from retribution and toward a forward-looking normative reinforcement, admitting that this means some intuitive payback instincts go unsatisfied. The single reply that has to land if the view is going to survive the session is that answerability sustains the normative force of demands without needing metaphysical desert, because it preserves the agent's status as a participant in the normative community rather than an object of control.

  The first pushback will come from the lead retributivist, who will likely say something like, if you take away desert, you take away the reason we don't just treat criminals like diseased animals, and you cannot justify the severity of punishment without it. Your reply should be that treating someone as answerable is precisely what distinguishes them from a patient, because we address demands to them rather than merely acting upon them, and the severity is justified by the importance of the norms being reinforced rather than the weight of the sin. This reply is soft on the issue of proportionality, since it is unclear how much hard treatment is needed to reinforce a norm without slipping into utilitarianism, but you can answer and move past this objection because it misunderstands the relational status you are proposing.

  Following that, the second retributivist will focus on the victim, arguing that victims need the offender to deserve suffering to feel vindicated, and your view leaves them with nothing but social hygiene. You should reply that victims need acknowledgment and assurance that the norm holds, which answerability provides through the demand for an account, rather than needing the offender to suffer for its own sake. This is quietly evasive because it does not fully address the visceral desire for payback that many victims report, and this objection has real force in a legal context where victim impact statements matter, so you should not dismiss it too quickly.

  Moving on to the excuse scholars, the first one will ask how your view maps onto duress, since if it is about relationships, why does a gun to the head excuse rather than just mitigate the relationship. Your reply should be that coercion severs the relational link by making the agent an instrument of another, so they are no longer the proper addressee of the demand. This reply is strong conceptually but soft on the edges of partial coercion, and you can answer and move past this because it aligns well with existing doctrine on voluntariness.

  The second excuse scholar will press you on diminished capacity, asking whether someone with low cognitive abilities is answerable if they cannot understand the demand. You should reply that the capacity required is the ability to engage in the dialogue of accountability, not full rationality, so we adjust the demand to the agent's capacity rather than exempting them entirely. This is evasive regarding where the threshold lies, and this objection has real force because your view risks being too demanding on marginalized populations, so you need to be careful here.

  Next, the hard incompatibilist will charge that you are just changing the subject, because the real question is whether agents are ultimately responsible, not whether they fit into a social practice. Your reply should be that the ultimate question is a metaphysical distraction and the practical question of how we live together is the only one that matters for law and ethics. This reply is soft because it begs the question against the incompatibilist's moral concern, and this objection has real force philosophically, though you can move past it in a law workshop by emphasizing the practical stakes.

  The reasons-responsiveness compatibilist will want to know what capacities an agent has to have in order to be answerable at all, since you seem to be skipping the metaphysical groundwork. Your reply should be that the capacities are defined by the practice itself, so we look at what is needed to give an account rather than positing a prior metaphysical condition. This is quietly evasive because it risks circularity, but you can answer and move past this because it fits your conceptual ethics approach.

  Then the first experimental philosopher will tell you that their data shows folk attributions rely heavily on alternative possibilities, so your view is revisionist in a way that ignores how people actually think. Your reply should be that folk intuitions are descriptive and often confused, whereas your project is normative and about what we should want, not what we currently say. This reply is soft because it sounds elitist, and this objection has little force in a normative project, so you can move past it easily.

  The second experimental philosopher will hit your manipulation cases, arguing that people see manipulation as excusing even when the relationship seems intact, which contradicts your third step. Your reply should be that manipulation damages the relationship by undermining the trust required for accountability, which is why the law treats it as excusing. This reply is soft on subtle manipulation where the relationship feels intact, and this objection has real force against your third step.

  Speaking of your third step, you feel best about the claim that manipulation damages the relationship rather than intrinsic properties, but this is where your view is most vulnerable because it cannot handle cases of subtle, non-coercive manipulation like advertising or cultural conditioning where the agent feels autonomous and the relationship seems functional. If the agent is brainwashed but believes they are acting freely and maintains relationships, your view struggles to explain why they are not answerable without smuggling in an intrinsic property claim about authenticity, so you need to prepare for the charge that you are just relabeling sourcehood as relational integrity.

  Finally, you should finish by bracing yourself for the question you are hoping nobody asks, which is whether your view justifies punishing the innocent if doing so maintains social coordination and transmits norms effectively, since you have severed the link between responsibility and desert.
