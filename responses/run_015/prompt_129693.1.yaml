      *   *Logic:* Hard Problem (Why consciousness?) $\rightarrow$ Panpsychism (Where is it?) $\rightarrow$ Combination Problem (How does it scale?) $\rightarrow$ Valence-Decomposition (Why doesn't it sum?) $\rightarrow$ Ethics (What matters?).
      *   *Wait, one nuance:* The user says "Next week I want to walk them through..." implying this is *part* of a course. I should treat this as a standalone 90-minute session plan.
      *   *Physics Level:* They have *no* physics. "Fields" needs a very light touch. Don't explain Lagrangians. Explain "values at every point in space."
