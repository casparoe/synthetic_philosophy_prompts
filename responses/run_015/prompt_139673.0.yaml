  **PRE-SUBMISSION ASSESSMENT (For Applicant Eyes Only)**

  **Premise Check:** Your project does not rest on a confused premise. The distinction between recognition conditions and production conditions is well-established in cognitive science (perception vs. action), but framing them as competing "essences" is a bold philosophical move. It is not nonsense, but it invites metaphysical pushback.
  **Shakiest Guess:** The terminology of "sorting-essence" and "making-essence." Philosophers may argue this is merely a relabeling of *verification* vs. *assertion* conditions or *competence* vs. *performance*. You are betting that calling them "essences" yields novel normative insights for design.
  **Confidence:** The "Style as Policy" hypothesis is strong and defensible. The 9-month timeline for empirical work is the highest practical risk; recruitment of designers often stalls. The proposal below integrates these risks into the "Scope" section to maintain honesty without undermining confidence.

  ***

  **PROJECT TITLE:** The Generative Gap: Sorting vs. Making in Letterform Identity

  **PROBLEM AND QUESTION**
  Hofstadter's *Letter Spirit* project asked: what makes every 'a' an 'a', and what makes a set of letterforms belong to one style? Computational attempts often stall because they assume a single underlying representation serves both recognition and generation. This proposal argues that this assumption is false. There are two distinct normative standards at play: the conditions sufficient for *sorting* a token into a category (sorting-essence), and the conditions necessary for *making* a token that belongs to a style (making-essence).

  The sorting-essence is permissive, disjunctive, and backward-looking; it stabilizes around what a competent categorizer accepts. The making-essence is constructive, generative, and forward-looking; it requires grasping the constraints that produce the form. These can come apart. A reader may recognize a glyph a designer could not reconstruct without breaking style.

  **Precise Question:** Do the conditions for identifying a letterform constitute the same kind of knowledge as the conditions for generating one, and if not, what relation must hold between them to sustain a coherent style?

  **CRITIQUE OF CANDIDATE POSITIONS**
  Current frameworks fail to answer this because they conflate the two tasks.
  1.  **Invariantism:** Posits a structural core necessary and sufficient for identity. This fails to explain style variation; if the core is too rigid, style becomes impossible; if too loose, identity collapses. It ignores the generative constraints designers face.
  2.  **Family Resemblance:** Dissolves the core into overlapping features. This accounts for sorting but fails to explain generation. It cannot tell a designer *which* features to prioritize when extending a hand to a new letter, leading to pastiche rather than style.
  3.  **Teleological Views:** Tie the letter to its function (legibility). While necessary, this is insufficient for style. Two hands can be equally legible yet stylistically distinct. Function constrains the space but does not select the path.

  Each leaves the question open because they treat identity as a static property rather than a relation between task-specific norms.

  **HYPOTHESIS**
  1.  **Asymmetry:** Sorting-essence is permissive (what can be accepted); Making-essence is constructive (what must be grasped). One can exist without the other (e.g., a viewer recognizes a style they cannot draw).
  2.  **Style as Policy:** Style is not a set of shared visual features but a standing *policy for resolving design conflicts*. It is how a hand handles tension between stroke contrast and legibility, or terminal treatment and rhythm. This explains why kin hands share no stroke-level features yet feel unified, and why feature-matching fails to capture style.

  **METHODOLOGY (9 MONTHS)**
  **Quarter 1: Corpus Construction.** I will construct a simplified domain akin to *Letter Spirit* but physically realized: a set of grid-based letterforms (5x7 dot matrix) that allows for combinatorial variation without requiring high-fidelity rendering skills. Three distinct "novel hands" will be defined by seed sets (a, n, o) to serve as stimuli.
  **Quarter 2: Elicitation Study.** I will recruit 12 working type designers (4 per hand). Participants will be shown the seed set and asked to produce the rest of the alphabet on the grid. Crucially, they will provide verbal protocols explaining their choices at conflict points (e.g., "I thickened the stem here to maintain weight against the curve").
  **Quarter 3: Transfer Test.** Participants will be asked to extend the style to a non-Latin glyph or a novel symbol. This tests whether the "policy" transfers beyond familiar letterforms. Data will be coded for consistency between stated policy and produced form.
  **Quarter 4: Analysis & Synthesis.** I will map the divergence between what designers recognize as "in style" (sorting) vs. what they produce (making). I will analyze whether successful generation correlates with articulated conflict-resolution policies rather than feature matching.

  **JUSTIFICATION OF METHOD**
  *   **Vs. Reimplementing *Letter Spirit*:** Computational models simulate the output but obscure the phenomenology of the designer's constraint-solving. We need the reasoning, not just the raster.
  *   **Vs. Armchair Analysis:** Conceptual analysis alone cannot determine if sorting and making *actually* come apart in practice. We need empirical evidence of the gap.
  *   **Vs. Psychophysics:** Categorization boundaries (psychophysics) measure the sorting-essence but ignore the making-essence. We need the generative account.

  **DELIVERABLES**
  1.  **Philosophical Paper:** "The Generative Gap," arguing for the asymmetry of sorting and making essences in symbolic categories.
  2.  **Design Policy Document:** A practical guide for type designers outlining how to articulate "style policies" rather than feature lists for consistent family extension.

  **SCOPE, RISKS, AND CONFIDENCE**
  **Feasibility:** Nine months is aggressive for empirical work. **[(High Risk)]** Recruitment of working designers is the primary bottleneck. If recruitment lags, I will cut the Transfer Test (Q3) and focus on the Latin alphabet extension only.
  **Philosophical Bet:** **[(Speculative)]** The claim that these are two kinds of "essence" rather than two tasks relying on one essence is the project's strongest philosophical wager. If the data shows perfect correlation between what designers recognize and what they produce, the asymmetry hypothesis fails.
  **Style Definition:** **[(High Confidence)]** The characterization of style as conflict-resolution policy is robust; even if the essence distinction fails, this account offers a viable alternative to feature-based style models.
  **Scope Limit:** I will not attempt to define "essence" metaphysically beyond this pragmatic context. This is not a project about universal kinds, but about graphic symbols.

  **CONCLUSION**
  If sorting and making essences come apart, it changes how we understand conceptual identity. It suggests that knowing what a thing *is* differs fundamentally from knowing how to *make* it. For type design, it shifts the focus from copying features to understanding constraints. This project bridges the gap between cognitive science's categorization models and the designer's generative practice.
