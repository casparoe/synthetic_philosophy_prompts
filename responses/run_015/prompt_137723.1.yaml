answer: |-
  ### (i) The Question

  **Course:** PHIL 490 – Consequentialism and Infinite Value
  **Assessment:** Take-Home Final (Question 1 of 1)
  **Time:** 48 Hours (Recommended working time: 90 minutes)
  **Word Count:** No strict limit, but conciseness is valued.
  **Marks:** 25

  **Preamble:**
  Consider a world containing a bi-infinite chain of persons, indexed by the integers $\mathbb{Z} = \{\dots, -1, 0, 1, \dots\}$. There is no first or last person. In **World $W_0$**, person $n$ has welfare level $n$.
  Consider **World $W_1$**, where person $n$ has welfare level $n+1$.
  Consider **World $W_2$**, where person $n$ has welfare $1$ if $n$ is even, and $0$ if $n$ is odd.
  Consider **World $W_3$**, where person $n$ has welfare $0$ if $n$ is even, and $1$ if $n$ is odd.

  **Part A (8 marks):**
  Evaluate the comparison between $W_0$ and $W_1$.
  1. Explain why $W_1$ represents a Strong Pareto improvement over $W_0$.
  2. Explain why $W_1$ is a permutation of $W_0$ (same multiset of welfare levels).
  3. A student objects that this conflict between Pareto and Anonymity only arises because welfare is unbounded below (integers). They claim you cannot construct a Pareto improvement that is also a permutation if welfare levels are bounded (e.g., only 0s and 1s). Is this student correct? Justify your answer using the definitions of Pareto and Permutation.

  **Part B (9 marks):**
  We attempt to resolve incomparability using a **Tethered Difference Rule**.
  *Definition:* A *tether* is a nested sequence of finite sets of people $S_1 \subset S_2 \subset \dots$ such that $\bigcup S_k = \mathbb{Z}$. To compare World $A$ and World $B$, calculate $D_k = \sum_{p \in S_k} (w_A(p) - w_B(p))$.
  *Verdict:* $A$ is better than $B$ if $D_k > 0$ for all sufficiently large $k$. $B$ is better if $D_k < 0$ for all sufficiently large $k$. Otherwise, they are incomparable.

  1. Apply this rule to compare $W_2$ and $W_3$ using the symmetric tether $S_k = \{-k, \dots, k\}$. What is the verdict?
  2. Construct a specific alternative tether $T_k$ (define the set membership explicitly) that yields the verdict $W_2 > W_3$.
  3. Construct a specific alternative tether $U_k$ that yields the verdict $W_3 > W_2$.
  4. What does this disagreement imply about the ethical significance of the "tether"?

  **Part C (8 marks):**
  You face a trilemma. You cannot simultaneously hold:
  1. **Responsiveness:** If a finite set of people can be made better off without harming others, the outcome is better (Pareto).
  2. **Independence:** Ethical verdicts should not depend on arbitrary choices of how we group or index the population (Tether-Invariance/Anonymity).
  3. **Decisiveness:** The ethical rule must rank most pairs of worlds (avoiding widespread incomparability).

  Which of these three principles would you drop to save a coherent ethical theory for infinite populations? Defend your choice by explaining exactly what theoretical cost you are accepting. Do not simply list pros and cons; identify the structural consequence of your choice.

  ***

  ### (ii) Model Answer

  **Part A**
  In $W_0$, person $n$ has welfare $n$. In $W_1$, person $n$ has welfare $n+1$. Since $n+1 > n$ for all integers $n$, every specific individual is strictly better off in $W_1$. This satisfies Strong Pareto. However, the set of welfare values in $W_0$ is $\mathbb{Z}$, and the set in $W_1$ is also $\mathbb{Z}$. The distribution of values is identical; only the assignment to indices has shifted. If ethics depends only on the multiset of values (Anonymity), $W_0$ and $W_1$ are equally good. We cannot satisfy both Strong Pareto and Anonymity here.

  Regarding the bounded welfare objection: The student is correct. If welfare levels are bounded (e.g., $\{0, 1\}$), a Strong Pareto improvement requires every person to move from 0 to 1, or stay at 1. If the multiset is preserved, the number of 1s must remain constant. If there are infinitely many 1s and 0s, we cannot map every 0 to a 1 without taking a 1 away from someone else (making them worse off) or creating new 1s (changing the multiset). Specifically, those at the maximum bound cannot improve. Therefore, the specific "Shift" paradox ($n \to n+1$) relies on unbounded welfare. With bounded welfare, Strong Pareto and Anonymity are consistent regarding permutations, though other conflicts (like Part B) remain.

  **Part B**
  Using the symmetric tether $S_k = \{-k, \dots, k\}$, the set contains roughly equal numbers of evens and odds. As $k \to \infty$, the difference in total welfare between $W_2$ (Evens=1) and $W_3$ (Odds=1) oscillates or approaches zero depending on parity of $k$. Specifically, $D_k$ alternates between 0 and 1. It does not stay positive or negative. The verdict is **Incomparable**.

  To force $W_2 > W_3$, construct a tether biased toward evens. Let $T_k = \{0, 2, \dots, 2k\} \cup \{-1, -3, \dots, -(2k-1)\}$. This set contains $k+1$ even numbers and $k$ odd numbers. In $W_2$, the sum is $k+1$. In $W_3$, the sum is $k$. $D_k = 1$ for all $k$. Thus $W_2 > W_3$.

  To force $W_3 > W_2$, construct a tether biased toward odds. Let $U_k = \{1, 3, \dots, 2k-1\} \cup \{0, -2, \dots, -2k\}$. This contains $k$ evens and $k+1$ odds. $D_k = -1$. Thus $W_3 > W_2$.

  This disagreement implies the Tethered Difference Rule does not discover an ethical truth; it imposes one. The "determinacy" provided by the rule is an artifact of the chosen coordinate system. The tether acts as a hidden weight function, privileging certain locations in the bi-infinite chain without ethical justification.

  **Part C**
  I would drop **Decisiveness**.

  Dropping Responsiveness (Pareto) is unacceptable because it renders the theory inert to local suffering; saving a child would not count as "better" if the infinite background remains unchanged. Dropping Independence (Anonymity/Tether-Invariance) is worse: it admits that ethical value depends on arbitrary indexing. If $W_2$ is better than $W_3$ solely because we chose a tether that counts evens first, we have replaced ethics with geometry. We are saying location matters intrinsically, which violates the fundamental consequentialist premise that persons are morally identical.

  Therefore, we must accept widespread incomparability. The cost is paralysis in global choices, but this is honest. The structural insight is that infinite aggregation is not a calculation problem to be solved by better math (hyperreals, tethers), but a conceptual limit. By dropping Decisiveness, we preserve the core moral commitments (Pareto and Anonymity) and admit that some infinite comparisons lack a truth value. The "cost" is not a failure of the theory, but a recognition that "better" is undefined when the universe is infinite and symmetric. We retain a robust ethic for finite changes within the infinite, but refuse to rank global permutations that rely on arbitrary framing.

  ***

  ### (iii) Marking Scheme

  **Total: 25 Marks**

  **1. Pareto/Anonymity Conflict Identification (5 marks)**
  *   **Must Hit:** Clearly states $W_1$ is Pareto superior (everyone $+1$) but Anonymity-equivalent (same multiset $\mathbb{Z}$).
  *   **Common Mistake:** Confusing Anonymity with Utilitarianism (summing to infinity) without noting the permutation invariance.

  **2. Bounded Welfare Resolution (5 marks)**
  *   **Must Hit:** Correctly affirms the student's objection: Strong Pareto + Permutation is impossible with bounded welfare (max value cannot improve).
  *   **Common Mistake:** Claiming bounded welfare allows the same shift (ignoring the upper bound constraint).

  **3. Tether Construction (5 marks)**
  *   **Must Hit:** Successfully defines two distinct tethers ($T_k, U_k$) with explicit set membership that yield opposite verdicts for $W_2/W_3$.
  *   **Common Mistake:** Describing tethers vaguely (e.g., "more evens") without defining the nested sets mathematically.

  **4. Analysis of Tether Dependence (5 marks)**
  *   **Must Hit:** Identifies that tether dependence renders the rule arbitrary/coordinate-biased rather than ethically objective.
  *   **Common Mistake:** Treating the tether disagreement as a technical glitch fixable by "choosing the right tether" rather than a structural flaw.

  **5. Trilemma Defense & Structural Insight (5 marks) [A/B Separator]**
  *   **Must Hit:** **A-Level:** Recognizes that dropping Independence destroys the justificatory basis of Anonymity (persons are interchangeable), making the theory spatially biased. Argues that Incomparability is the only honest outcome.
  *   **B-Level:** Correctly identifies the trilemma and picks a side (e.g., drops Decisiveness) but justifies it merely on "intuition" or "practicality" without noting that Independence *is* the moral commitment to personhood.
  *   **Common Mistake:** Dropping Pareto to save Decisiveness (ignoring local harm) or claiming Hyperreals solve the trilemma (external knowledge/not addressing the structural cost).
