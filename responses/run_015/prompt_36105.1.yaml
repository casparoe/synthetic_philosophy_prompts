      *   *Average Utilitarianism:* Maximize average welfare. (Often leads to the "Mere Addition Paradox" or implies killing unhappy people).
      *   *Critical-Level Utilitarianism:* Lives only count if they exceed a certain threshold of welfare.
      *   *Person-Affecting Views:* An outcome can only be better/worse if it is better/worse *for someone*. (Non-Identity Problem issues).
      *   *Impossibility Theorems (Arrhenius etc.):* No population axiology satisfies all adequate adequacy conditions (e.g., Non-Elitism, Weak Dominance, Non-Sadism). You *must* bite some bullet.

