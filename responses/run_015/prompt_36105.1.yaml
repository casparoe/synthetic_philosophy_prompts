  5.  **Drafting Content - Specifics:**

      *   *Objection 1 (Impossibility):* "Arrhenius proves no theory works. Why are you confident?"
          *   *Reply:* Fiction requires commitment. Philosophy explores the map; fiction walks the territory.
          *   *Concession:* Yes, logically, it's a deadlock.
          *   *Weakness:* Can sound anti-intellectual.
      *   *Objection 2 (Total Util):* "Sum of welfare is higher in B. You chose less good."
