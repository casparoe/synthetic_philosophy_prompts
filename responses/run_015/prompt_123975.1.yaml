answer: |-
  To the Research Director:

  Given the constraint of eight researcher-years and the absence of frontier models, our agenda must prioritize questions that determine the fundamental viability of debate-style oversight. The answers must remain informative even if we pivot to alternative oversight methods later. We must strictly adhere to the distinctions between verification efficiency, honest-agent signaling, and temporal adjudication. Below are the three prioritized questions, ordered by logical dependency and decision leverage.

  **1. What is the empirical Verification-Depth Gap across task classes where obfuscation is feasible?**

  This question must be first because it addresses the basic economic viability of the protocol. The verification-depth gap is the ratio of checking effort required for a direct answer versus a debate tree. If this ratio is near one for tasks where obfuscation is possible, debate is merely overhead, regardless of how well judges spot lies. No amount of protocol tuning can fix a fundamental lack of amplification leverage.

  *   **Upstream of:** All subsequent protocol design. If the gap is small, the go/no-go decision is "no," and further research into obfuscation mechanics is wasted effort.
  *   **Tractability:** High. We can use current open-weight models to generate answers and counter-arguments on code generation or formal math tasks. Human judges or weaker models can time the verification process for direct submissions versus debate transcripts.
  *   **Milestone for Reprioritization:** If within eighteen months we cannot identify a single task class where the gap exceeds 3x under adversarial conditions, this line of work should be downgraded immediately. Conversely, finding a class with a gap >10x moves this to a scaling focus.
  *   **Informatics if Pivoting:** If we switch to iterative distillation or other methods, knowing where verification is inherently harder than generation remains critical for allocating oversight resources.

  **2. Under what conditions does Credibility-Matching Obfuscation force honest agents to inflate argument length?**

  This question is second because it assumes a viable verification-depth gap exists but asks whether the protocol destroys that gain. Credibility-matching obfuscation occurs when an honest agent must pad a simple correct answer with unnecessary steps or formalism to appear as "worked-through" as a dishonest opponent. If the honest side must consume the verification-depth gap simply to look credible, the net safety gain is zero. This distinguishes itself from standard deception; here, the error is not hidden, but the truth is disguised as complexity.

  *   **Upstream of:** Reward function design and judge training protocols. It determines whether we can incentivize simplicity without penalizing correctness.
  *   **Tractability:** Medium. We can train debaters where ground truth is known and measure the length/complexity of winning honest arguments against adversarial obfuscators. We can test if judges penalize concise correct answers when opposed by verbose incorrect ones.
  *   **Milestone for Reprioritization:** If we find that honest agents must inflate argument length by >50% to maintain win rates against obfuscators, this indicates a structural failure of the judge's heuristic. This would move the question up to a critical blocker. If judges can be trained to prefer concise correctness without losing accuracy, the question moves down.
  *   **Informatics if Pivoting:** This informs any oversight scheme relying on human or model intuition. If simplicity is not a credible signal of truth in our models, any method relying on " Occam's razor" heuristics is compromised.

  **3. How does the threat of Deferred Adjudication alter debater equilibrium strategies?**

  This question is third because it addresses a mitigation strategy rather than a fundamental property. Deferred adjudication assumes the verdict is settled later by empirical outcome or a smarter audit. Obfuscation that works on an immediate judge may fail against a future audit. However, this only matters if the first two questions are resolved positively. If the verification-depth gap is non-existent or credibility-matching destroys it, deferred adjudication is irrelevant.

  *   **Upstream of:** Long-term scaling plans and deployment protocols. It determines if we can rely on future audits to clean up current blind spots.
  *   **Tractability:** Low/Medium. Simulating a "smarter successor" with open weights is difficult. We can approximate this by withholding verdicts and providing feedback only after episode completion, or by using a stronger model to audit transcripts post-hoc.
  *   **Milestone for Reprioritization:** If obfuscation rates do not drop significantly when debaters know a future audit will occur, deferred adjudication is not a viable safety net, and this question drops. If obfuscation vanishes under audit threat, it becomes a primary deployment requirement.
  *   **Informatics if Pivoting:** This speaks to the general value of delayed feedback in alignment. If agents do not respond to delayed truth signals, online learning methods for safety may be fundamentally limited.

  **Deprioritized Lines of Work**

  I explicitly recommend deprioritizing two lines of work that often consume resources in this domain but fail to inform our specific go/no-go decision.

  First, **formal proofs of debate convergence.** While theoretically elegant, proving that debate converges to truth under idealized assumptions does not account for the empirical realities of model bias or the specific distinctions above. A formal proof does not tell us if the verification-depth gap is actually greater than one in practice, nor does it address credibility-matching obfuscation where the argument is technically valid but misleadingly complex. Even with a proof, if our empirical tests show judges cannot distinguish honest simplicity from dishonest complexity, we must shut down the line. Thus, the proof changes neither the decision nor the downstream protocol design.

  Second, **optimizing judge training on tasks with trivial direct verification.** Some research focuses on improving judge accuracy on tasks where the answer can be verified instantly (e.g., simple arithmetic or fact-checking). This ignores the verification-depth gap distinction. If direct verification is cheap, the gap is near one, and debate is overhead by definition. Success here demonstrates only that judges can learn simple tasks, which we already know. It does not inform us about scalable oversight where verification is the bottleneck. Resources spent here reduce the budget available for measuring the gap in hard tasks, directly threatening our ability to make the two-year decision.

  **Summary**

  The ordering is strict: we must know if debate saves labor (Q1) before we ask if it wastes that saving on signaling (Q2), and we must know if signaling is a problem before we ask if future audits fix it (Q3). This sequence ensures that at the two-year mark, we have a definitive answer on whether the mechanism amplifies capability safely, or whether the overhead and signaling costs render it obsolete.
