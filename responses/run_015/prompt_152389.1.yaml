answer: |-
  ### Part 1: The Logical Space

  Before we look at the tree, here are the five distinctions that carve up the territory. These aren't philosophical labels yet; they are the axes along which your group's disagreements actually run.

  1.  **Method of Settlement:** When someone denies the claim, do you reach for a tool (measure, look, test), reach for a dictionary (explain the words), or stop arguing (feel that communication has broken down)?
  2.  **Epistemic Dependence:** If you reach for a tool, does using that tool require you to assume the claim is already true? (e.g., To check if your eyes work, you must assume your eyes work).
  3.  **Community Scope:** Is this assumption necessary for *any* creature living a human life, or only for people playing specific games (scientists, doctors, lawyers, Leeds pub-goers)?
  4.  **Role Relativity:** Can the *same sentence* function as a fixed assumption for you but a checkable fact for someone else (like an expert) at the same time?
  5.  **Temporal Stability:** Is this proposition currently moving? Was it a "given" for your grandparents but a "question" for you, or vice versa?

  ***

  ### Part 2: The Decision Tree

  **Instruction:** Answer these questions for how *you* use the sentence in your daily life, not for how a philosopher might use it.

  **Q1. If a sincere friend denied this, would you try to show them physical evidence (measure, look, test)?**
  *   **No:** Go to Q5.
  *   **Yes:** Go to Q2.

  **Q2. To gather that evidence, do you have to assume this statement is already true?**
  *   **No:** Go to Q3. (The evidence stands independently).
  *   **Yes:** Go to Q4. (The evidence leans on the claim).

  **Q3. Is this something people checked and debated a hundred years ago, or did they just assume it?**
  *   **They checked it:** Go to **Leaf A**.
  *   **They assumed it:** Go to **Leaf B**.

  **Q4. Is this assumption necessary for *any* human to get through the day, or just for people doing specific jobs (like science or law)?**
  *   **Any human:** Go to **Leaf C**.
  *   **Specific jobs:** Go to Q6.

  **Q5. Is it true simply because of how we define the words (like 'a triangle has three sides')?**
  *   **Yes:** Go to **Leaf D**.
  *   **No:** Go to Q7.

  **Q6. Could a specialist (like a neuroscientist) treat this as a checkable fact while you treat it as fixed?**
  *   **Yes:** Go to **Leaf E**.
  *   **No:** Go to **Leaf F**.

  **Q7. If someone denied this, would you feel they were incapable of joining in any normal activity?**
  *   **Yes:** Go to **Leaf G**.
  *   **No:** Go to **Leaf H**.

  **Q8. (Only if you hesitated between Q3 and Q4) Is this proposition currently moving from 'obvious' to 'checkable' (or vice versa) in your lifetime?**
  *   **Yes:** Go to **Leaf B** (Mark as 'Shifting').
  *   **No:** Go to **Leaf F**.

  ***

  ### Part 3: The Leaves (Outcomes)

  Here are the eight destinations. I have named them where a philosophical label fits, and marked them "Unnamed" where the logical space is empty or unattractive.

  *   **Leaf A: Stable Empirical Fact.**
      *   *What it is:* Ordinary claims that are checked, don't presuppose themselves, and have always been checked.
      *   *Why named:* This is the standard "scientific fact" or "common observation."
  *   **Leaf B: The Shifting Riverbed.**
      *   *What it is:* Claims that were once hinges (assumed) but are now empirical (checked), or vice versa.
      *   *Why named:* Captures Wittgenstein's riverbed image. It doesn't break the tree; it sits at the junction of Q3/Q8 where the status is in flux.
  *   **Leaf C: Universal Hinge.**
      *   *What it is:* Propositions that support all evidence but are themselves untestable, required for any human life.
      *   *Why named:* The bedrock of *On Certainty*.
  *   **Leaf D: Grammatical/Analytic Truth.**
      *   *What it is:* True by definition, not by looking at the world.
      *   *Why named:* Standard logical positivist distinction.
  *   **Leaf E: Local/Expert-Relative Hinge.**
      *   *What it is:* A hinge for the layperson, but a testable hypothesis for the expert.
      *   *Why named:* Captures the "Same Sentence, Different Role" constraint.
  *   **Leaf F: Local Fixed Hinge.**
      *   *What it is:* A hinge for a specific community, where even experts treat it as fixed.
      *   *Why named:* Distinguishes from Universal Hinges (Leaf C).
  *   **Leaf G: Unnamed (Incoherent Denial).**
      *   *What it is:* Denials that render language impossible (e.g., "Nothing exists").
      *   *Why unnamed:* Nobody sits here willingly; it's the limit of sense. You can't argue here, only walk away.
  *   **Leaf H: Unnamed (Social Custom).**
      *   *What it is:* Things we don't check but aren't strictly necessary for life (e.g., "We shake hands, not bow").
      *   *Why unnamed:* Unattractive as a philosophical category; it's just habit, not logic.

  ***

  ### Part 4: Running Your Examples

  Here is where your nine examples land based on how a typical modern non-academic would answer the tree. **Note:** Where the answer depends on *who* is speaking, I have flagged it.

  1.  **I have two hands.**
      *   *Path:* Q1 (Yes, I'd show them) → Q2 (Yes, looking assumes eyes/work) → Q4 (Specific jobs? No, any human) → **Leaf C (Universal Hinge)**.
      *   *Judgement Call:* Q2. A surgeon might answer Q6 (Yes) and land on **Leaf E**. For you, it's likely a hinge.
  2.  **The earth has been around for a very long time.**
      *   *Path:* Q1 (Yes) → Q2 (Yes, dating methods assume time) → Q4 (Specific jobs? No, everyone assumes it) → **Leaf C (Universal Hinge)**.
      *   *Judgement Call:* Q4. Is it universal? A religious community might treat it as checkable (Leaf A). For your group, it's likely a hinge.
  3.  **Nobody has travelled into the future and come back.**
      *   *Path:* Q1 (No) → Q5 (No, not definition) → Q7 (Yes, denies causality) → **Leaf G (Unnamed/Incoherent)**.
      *   *Note:* This functions as a rule of the game. Denying it breaks the "story" of the world.
  4.  **That person over there is in pain.**
      *   *Path:* Q1 (Yes, look for wincing) → Q2 (No, wincing doesn't assume pain) → Q3 (Always checked) → **Leaf A (Stable Empirical)**.
      *   *Judgement Call:* Q2. Some argue you can't *see* pain, only behavior. If you think you can't check it directly, it might slide to Leaf H (Custom/Assumption).
  5.  **My memory is mostly reliable.**
      *   *Path:* Q1 (Yes) → Q2 (Yes, checking memory uses memory) → Q4 (Specific jobs? Yes, law/medicine) → Q6 (Yes, neuroscientist checks) → **Leaf E (Local/Expert-Relative Hinge)**.
      *   *Note:* Perfect fit for the "Same Sentence" constraint. For you, it's a hinge. For a doctor, it's a test.
  6.  **Water is H2O.**
      *   *Path:* Q1 (Yes) → Q2 (No, spectroscopy doesn't assume it) → Q3 (Grandparents assumed 'water', didn't check H2O) → **Leaf B (The Shifting Riverbed)**.
      *   *Note:* This captures the historical shift. It was a definition ('water is the clear stuff'), became empirical, is now almost a definition again.
  7.  **Two and two make four.**
      *   *Path:* Q1 (No) → Q5 (Yes, definition of number) → **Leaf D (Grammatical Truth)**.
      *   *Note:* Clear cut.
  8.  **I am not a brain in a vat.**
      *   *Path:* Q1 (No) → Q5 (No) → Q7 (Yes, denies shared world) → **Leaf G (Unnamed/Incoherent)** OR **Leaf C (Universal Hinge)**.
      *   *Judgement Call:* Q1/Q7. If you say "I can't check that," it's Leaf C. If you say "That's not a real possibility," it's Leaf G. The tree struggles to separate these two; they feel identical in practice.
  9.  **The world didn't start five minutes ago.**
      *   *Path:* Q1 (No) → Q5 (No) → Q7 (Yes) → **Leaf C (Universal Hinge)**.
      *   *Note:* Like the Brain in a Vat, but feels more like a condition of history than logic.

  ***

  ### Part 5: Critique and Flags

  **Indistinguishable Leaves:**
  *   **Leaf C (Universal Hinge) vs. Leaf G (Incoherent Denial).**
      *   *The Problem:* The tree cannot cleanly separate "I assume this so strongly I won't check it" (Hinge) from "Denying this makes no sense" (Grammar/Incoherent).
      *   *Example:* "I am not a brain in a vat" lands on C or G depending on your mood. In practice, these function the same way: you stop arguing.
      *   *Advice:* Don't worry about splitting them. If the group agrees the argument stops, the classification doesn't matter.

  **Judgement Calls (Where the tree relies on you):**
  *   **Q2 (Circular Evidence):** This is the hardest branch. Does checking your hands assume you have hands? Most say yes. Does checking the earth's age assume the earth is old? Most say yes. But a software person might say "No, the data stands alone." This will cause the most friction in the pub.
  *   **Q4 (Universal vs. Local):** Is "The earth is old" universal? For a secular group, yes. For a fundamentalist group, no. The tree forces you to admit your hinges are local to *your* community, even if that community is "everyone we know."

  **The Riverbed (Leaf B):**
  *   The tree accommodates the riverbed image at **Leaf B**. It doesn't break the tree, but it highlights that the "status" of a proposition is a historical variable, not a permanent property. "Water is H2O" is the best example here: it flowed (empirical discovery) and is now hardening (grammatical rule for chemists).

  **Final Thought for the Group:**
  If two people answer Q2 differently for the same sentence (e.g., "My memory is reliable"), the tree has already done its job: it shows you that you are using the sentence differently. One of you is treating it as a tool, the other as the hand that holds the tool. That *is* the disagreement.
