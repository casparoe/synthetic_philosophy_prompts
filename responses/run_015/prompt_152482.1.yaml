  Grandpa told me exactly how he's going to judge this speech. He said if I tell a story that would still make sense even if the opposite had happened, I haven't said anything true. I've spent all week trying to fail that test.

  It's easy to say he was a hard worker. But that fits anyone who punched a clock. It's easy to say he was stubborn. But that fits anyone who refused to move. To describe him, I have to find the setting that only fits his machine.

  We all know about the parish hall elevator. Three contractors wanted to replace the motor. He took the panel off and sat in the shaft for an hour. He didn't find a broken wire. He found a skylight. The afternoon sun was hitting the door sensor exactly at one o'clock. The machine wasn't broken; it was reacting to data everyone else ignored. That is who he is. He doesn't fix people by telling them they're broken. He finds the variable everyone else missed.

  I know this because I'm the one who argues with him. When I told him I wanted to skip college to work on cars, he didn't give me a lecture on degrees. He asked me what specific problem I could solve that a degree couldn't. When I couldn't name one, he told me to go to class. He wasn't trying to win. He was checking my sensors. He treats every disagreement like a diagnostic tool. If the argument doesn't change the outcome, it's just noise.

  Some people look at that and see a man who only believes what he can touch. But his sister knows that precision isn't the opposite of faith. Sometimes it's the only way to honor what you can't see. You don't respect the creator by ignoring the design. He looks at the world like it was made to be understood, and that includes the part of him that's going to move on to whatever comes next. He's not afraid of the unknown because he trusts the engineering.

  And I know there are people here who see the world differently than he does. We have neighbors who look at the evidence and draw different lines than he does. He never asked anyone to stop believing what kept them warm. He just asked them to check the wiring. He respected people who cared enough to have an opinion, even when the data didn't line up. He knew that two people can look at the same sky and see different things, but the gravity works the same for both of them.

  To his apprentice, who runs the company now: you know he never signed off on a job until the leveling was perfect. Not because the customer would notice, but because the building would know. That's how he loved us. Not with grand speeches, but with adjustments. He remembered which cousin takes sugar in their coffee. He remembered which coworker had a back injury. He didn't treat us all the same. He treated us according to our specs.

  So, what is the shortest description that narrows him down? He is a man who refuses to accept a stall without finding the cause.

  And if that's true, I can predict what he does next. He's sitting four feet away, listening to every word. He's going to check this story against his own memory. He's going to find the one detail I got slightly wrong. Maybe the time on the elevator sensor was twelve-thirty, not one o'clock. Maybe I left out a word in the argument about college. And then he's going to tell me about it.

  That is how I know he's still here. That is how I know he loves us. He's still checking the work. He's still making sure the story fits the reality.

  Happy ninetieth, Grandpa. I'll leave the panel off so you can check the wiring.
