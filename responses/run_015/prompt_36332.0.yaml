  # Decision Tree: The Paradox of Tragedy

  **Starting Commitment:** *"I felt genuine sorrow at the ending of King Lear, and I am glad I watched it."*

  ---

  ### **NODE 1: The Constituent Claim**
  **Diagnostic Claim:** *"The sorrowful feeling itself is a constituent of the pleasure I take in the work, rather than merely a cost I pay or an illusion I sustain."*

  *   **DISAGREE (No):** The sorrow is a means, a cost, or an illusion; the pleasure is distinct from the pain.
      *   *(Proceed to Node 2)*
  *   **AGREE (Yes):** The sorrow is intrinsically part of the valuable experience.
      *   *(Proceed to Node 4)*

  ---

  ### **NODE 2: The Reality Claim** (Branch: Sorrow is NOT a constituent)
  **Diagnostic Claim:** *"I would derive the same satisfaction from witnessing a real, helpless tragedy of equal vividness (e.g., a funeral I could not affect)."*

  *   **AGREE (Yes):** The fictional frame is not essential to the satisfaction.
      *   *(Proceed to Node 3)*
  *   **DISAGREE (No):** The fictional frame or safety is essential to the satisfaction.
      *   *(Proceed to Node 3)*

  ---

  ### **NODE 3: The Expression Claim** (Branch: Sorrow is NOT a constituent)
  **Diagnostic Claim:** *"The pleasure would survive a flat retelling that keeps all the events but loses the expressive power."*

  *   **AGREE (Yes) + [From Node 2: AGREE (Real Funeral OK)]:**
      *   **LEAF: UNNAMED POSITION**
      *   *Diagnosis:* **Unattractive.** This implies a brute fascination with sad events regardless of art or safety, bordering on morbid voyeurism without aesthetic justification.
  *   **DISAGREE (No) + [From Node 2: AGREE (Real Funeral OK)]:**
      *   **LEAF: CATHARSIS (Loose Modern Sense)**
      *   *Rationale:* The value lies in the emotional exercise/purgation itself, which art facilitates but reality could theoretically provide.
  *   **AGREE (Yes) + [From Node 2: DISAGREE (Fiction Essential)]:**
      *   **LEAF: CONTROL THEORIES**
      *   *Rationale:* The primary value is the safety/control of the frame; the specific artistry is secondary to the ability to stop or distance oneself from real harm.
  *   **DISAGREE (No) + [From Node 2: DISAGREE (Fiction Essential)]:**
      *   **LEAF: PSYCHICAL DISTANCE**
      *   *Rationale:* The expressive power creates the necessary distance; without the art, the object is too close to be enjoyed.

  ---

  ### **NODE 4: The Object Claim** (Branch: Sorrow IS a constituent)
  **Diagnostic Claim:** *"What one relishes is one's own responsiveness (e.g., capacity for empathy) rather than anything in the work."*

  *   **AGREE (Yes):**
      *   **LEAF: META-RESPONSE THEORIES**
      *   *Rationale:* The pleasure is second-order; we enjoy the fact that we are the kind of beings who feel sorrow for Lear.
  *   **DISAGREE (No):** The work/experience itself is the object of relish.
      *   *(Proceed to Node 5)*

  ---

  ### **NODE 5: The Temporality Claim** (Branch: Sorrow IS a constituent)
  **Diagnostic Claim:** *"One can want the sorrow to continue and enjoy it at the very same time."*

  *   **AGREE (Yes):** Pain and pleasure coexist as distinct qualitative states.
      *   **LEAF: COEXISTENCE OR RICH-EXPERIENCE VIEW**
      *   *Rationale:* The experience is a complex whole where negative and positive emotions are felt simultaneously and contribute jointly to the value.
  *   **DISAGREE (No):** The pain does not remain painful while being enjoyed.
      *   **LEAF: HUME'S CONVERSION VIEW**
      *   *Rationale:* The energetic movement of the passion transforms the sorrow into pleasure; they cannot coexist because the sorrow ceases to be sorrow in the moment of enjoyment.

  ---

  ### **Seminar Notes & Flags**

  **1. Indistinguishable Leaves**
  *   **Control Theories** and **Psychical Distance**: The tree separates these logically based on whether *expressive power* (art) is required (Distance) or whether *safety* (frame) is sufficient (Control). However, in practice, these leaves are difficult to separate. A student may argue that the "control" is provided *by* the "distance," making the theories functionally identical in many interpretations.

  **2. The "Qua Sorrow" Exclusion**
  *   **Node:** **Node 5 (The Temporality Claim)**.
  *   **Explanation:** A student who insists that the sorrow is enjoyed *qua* sorrow (i.e., the pain *is* the pleasure, an identity theory, rather than two coexisting states or a transformation) leaves the tree without a home here.
      *   If they answer **Yes**, they are routed to **Coexistence**, which posits two distinct states (pain *and* pleasure).
      *   If they answer **No**, they are routed to **Hume**, which posits a transformation (pain *becomes* pleasure).
      *   The "Identity" view (Pain = Pleasure) is logically excluded by the binary choice between "Coexistence" and "Conversion."

  **3. Unoccupied Combinations**
  *   **Unnamed Leaf (Node 3, Agree/Agree):** As noted above, the combination of "Sorrow is not enjoyed" + "Reality doesn't matter" + "Art doesn't matter" is diagnosed as **Unattractive**. It suggests the student enjoys sad facts purely masochistically, which contradicts the premise of an *aesthetic* seminar.
  *   **Unnamed Leaf (Node 5, Disagree):** While routed to Hume, if a student insists the sorrow is *not* converted but merely ignored while they enjoy something else, they would technically fall out of the Hume leaf (which requires conversion). This combination is **Incoherent** within the "Sorrow IS a constituent" branch (Node 1).
