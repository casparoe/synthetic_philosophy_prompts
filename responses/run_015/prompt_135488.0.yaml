          User worries I'm reducing feeling to reporting. I need to say no. Reports are evidence. Behavior is evidence. The feeling is the private event. We distinguish the two cases (unpleasant-not-minding vs. minding-not-unpleasant) by looking at the total pattern. Asymbolics say "It hurts" but don't withdraw. Your case says "It's nice" but withdraws. In both cases, one signal is noisy. But the *badness* tracks the unpleasant feel. If you withdraw, it's because it feels bad, even if you say otherwise. If you don't withdraw, it doesn't feel bad, even if you say "ouch."
