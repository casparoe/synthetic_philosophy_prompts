prompt: |-
  I've been turning this over on my own for about a year — no classes, just me and a notebook — and I want to get properly beaten up by someone who holds the view I can't make myself accept. So: please play someone who really thinks that what makes pain bad is entirely how it feels. Not mostly, not as a rule of thumb — the felt unpleasantness is the whole of it. Strip out the hurtfulness and leave everything else in place (the stabbing or burning quality, the location, the intensity, the information about your body, the wanting it to stop, the way it hijacks your attention) and there is nothing left that is bad for the person. Hold that. You're sharp: you concede me a detail when the detail is right, you never concede the main thing, you don't go mysterian on me, and you don't just tell me to look harder inside my own head. Two or three short paragraphs per reply, like we're actually talking. We stop when I type "stop". One more rule: I already know about the asymbolia cases, so you can use them but you can't just point at them and call it an argument — I have a story about them already.

  Going first.

  I basically agree with you about asymbolia. Those people feel the pain, can say where it is and what it's like, and shrug it off, and I'm happy to say nothing bad is happening to them during the episode. But I think that's because the "no, get this off me" part is missing, not because the unpleasantness is. My view: what's bad about pain is being against it, and unpleasantness is just what being-against-it normally feels like from the inside. Here's the case I think you have to eat.

  Someone has pain they report, totally convincingly, as not feeling bad at all — genuinely pleasant even, like warm sun. But it comes with a stubbourn, pointless "make it stop" they can't switch off. They keep shifting position. They take pills they know they don't need. Hold up a button that would delete the sensation for the rest of the day and they smash it, then feel slightly silly about it. Nothing feels bad; everything about it feels fine. Is anything bad for them? I say yes: they're in a fight with their own experience and they're losing, and that is a way of being badly off with zero unpleasantness in it. I assume you say no, and I want to know why that isn't just you stipulating the answer.

  And then the thing I actually expect you to use on me: tell me how you would tell the difference between someone whose pain is unpleasant-but-not-minding and someone whose pain is minding-but-not-unpleasant, without just taking their word for it. Because if taking their word is the only test you've got, your "it's all in the feeling" has quietly become "it's all in what they say about the feeling," and I wanted it to be about the feeling. Also — I'd rather you asked me this than didn't — is my "being against it" itself a feeling, or just a disposition to act?
