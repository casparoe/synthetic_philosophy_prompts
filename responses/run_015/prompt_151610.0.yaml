      *   *Correction:* Ensure the "Adaptation Rule" is clear. When do they lower the bar? Only when search costs are real, not when risk is high.
      *   *Emphasis:* Highlight the Case 3 tension. This is a classic "ethics creep" vs. "research efficiency" conflict.
      *   *Formatting:* Use bolding, boxes, or clear headers to make it skimmable.

  8.  **Final Review against Constraints:**
      *   Checklist style? Yes.
      *   Questions in order? Yes.
      *   Sufficiency criteria? Yes.
      *   Hard stops? Yes.
      *   Hand-off points (values vs facts)? Yes.
      *   Satisficing logic? Yes.
      *   Three cases applied? Yes.
      *   Gaming section? Yes.
      *   Limitations section? Yes.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a classic organizational design problem disguised as an ethics problem. Your board is suffering from *maximization paralysis*—trying to find the globally optimal ethical decision rather than a locally satisfactory one. Given the constraints (20 mins/case, no legal counsel), optimization is not just impossible; it's unethical because it consumes resources needed for high-risk cases.

  Below is a **Satisficing Ethics Protocol (SEP)** designed for your board. It treats ethical review as a sequential search process with fixed aspiration levels.

  ***

  # The Satisficing Ethics Protocol (SEP)
  **Goal:** Identify protocols that meet the *minimum threshold of acceptability* within 20 minutes.
  **Logic:** Sequential Attention. Do not move to Gate 2 until Gate 1 is satisfied. Do not optimize; satisfy.

  ## Part 1: The Decision Procedure

  ### Pre-Game: Set Aspiration Levels
  *Before looking at the specific amendment, the Board Chair sets the aspiration level for the session.*
  *   **Risk Aspiration:** "No more than Minimal Risk" (unless justified by direct benefit to subject).
  *   **Consent Aspiration:** "Subject knows what they are getting into."
  *   **Search Cost Limit:** 15 minutes of deliberation per case.

  ### Gate 1: The Risk Hard Stop (Fact-Check)
  *Question:* Does this amendment introduce **new** physical, psychological, or privacy risks not present in the approved protocol?
  *   **Sufficiency Criterion:** If risks are identical or lower $\rightarrow$ **PASS**.
  *   **Hard Stop:** If risks are significantly higher AND no mitigation is proposed $\rightarrow$ **REJECT/DEFER**.
  *   **Hand-off Point:** If the board disagrees on whether a risk is "significant," this is a **Value Conflict**, not a Fact Conflict. Mark it and move to Gate 2, but flag for full board vote.

  ### Gate 2: The Consent Alignment (Fact-Check)
  *Question:* Is the activity covered by the *reasonable interpretation* of the original informed consent?
  *   **Sufficiency Criterion:** A layperson reading the original form would not be surprised by this change $\rightarrow$ **PASS**.
  *   **Hard Stop:** If the change fundamentally alters the nature of participation (e.g., adding blood draw to a survey study) $\rightarrow$ **REJECT** (requires re-consent).
  *   **Adaptation Rule:** If finding the original form takes >5 minutes, assume **NO** alignment (precautionary principle). Do not search archives indefinitely.

  ### Gate 3: Scientific Utility (Value-Check)
  *Question:* Is there a *sufficient* scientific reason for this change?
  *   **Sufficiency Criterion:** The researcher provides *one* plausible reason why this improves data quality or feasibility. **Do not ask if it is the *best* way.**
  *   **Hard Stop:** If the reason is "we might need it later" with no specific plan $\rightarrow$ **REJECT**.
  *   **Search Cost Check:** If deliberation on this question exceeds 5 minutes, the utility is unclear. **Default to REJECT.**

  ### Gate 4: The Adaptation Rule (The "Satisfice" Check)
  *If the protocol fails a Hard Stop:*
  1.  **Can the researcher modify the amendment to meet the Aspiration Level?** (e.g., "Remove the biometric, keep the survey").
      *   If Yes $\rightarrow$ **Conditional Approval**.
      *   If No $\rightarrow$ **Reject**.
  2.  **Are we lowering the Aspiration Level?**
      *   *Permissible:* Lowering the bar on "Scientific Utility" because search costs are high (we can't verify the science in 20 mins).
      *   *Impermissible:* Lowering the bar on "Risk" or "Consent" due to impatience or pressure from administration.

  ***

  ## Part 2: Application to Cases

  ### Case 1: Switching Survey Language (e.g., English to Spanish)
  *   **Gate 1 (Risk):** Risk profile unchanged. **PASS.**
  *   **Gate 2 (Consent):** Original consent likely said "survey about X." Language is a modality, not a change in activity. **PASS.**
  *   **Gate 3 (Utility):** Researcher claims "need broader demographic." Plausible. **PASS.**
  *   **Decision:** **APPROVE.**
  *   *Time spent:* 4 minutes.

  ### Case 2: Adding Biometric Sensor (e.g., Heart Rate Monitor)
  *   **Gate 1 (Risk):** New privacy/bodily risk introduced. **FLAG.**
  *   **Gate 2 (Consent):** Original consent was for "behavioral tasks." Biometrics is physiological. A layperson would be surprised. **FAIL (Hard Stop).**
  *   **Adaptation:** Can they re-consent? Yes.
  *   **Decision:** **DEFER** (Require new consent form).
  *   *Time spent:* 10 minutes.

  ### Case 3: Extending Retention for "Future Unspecified Analysis"
  *   **Gate 1 (Risk):** Long-term storage increases privacy breach risk over time. **FLAG.**
  *   **Gate 2 (Consent):** Original consent likely said "data kept for 5 years for this study." "Unspecified future analysis" exceeds reasonable interpretation. **FAIL (Hard Stop).**
  *   **Gate 3 (Utility):** Researcher claims "maximize data value." This is vague. Under satisficing, "might be useful" is **NOT sufficient**.
  *   **Decision:** **REJECT.**
  *   **The Tension:** This is where the board usually rubber-stamps. They optimize for *researcher convenience* (saving time on new protocols) rather than *subject protection*.
  *   **Satisficing Correction:** The aspiration level for Consent Specificity is not met. To approve this, you must lower the aspiration level for Consent. **Do not do this implicitly.** If you approve this, record it as "Aspiration Level Lowered due to Administrative Pressure," making the value trade-off visible.

  ***

  ## Part 3: Vulnerability Analysis (How to Game the SEP)

  Since you are in decision sciences, you know any procedure is subject to strategic manipulation. Here is where the Board (or Admin) can game the aspiration levels to get a desired outcome:

  1.  **Redefining "Minimal Risk" (Gate 1):**
      *   *The Move:* Board members claim a risk is "negligible" to bypass the Hard Stop.
      *   *The Counter:* Require a specific mitigation strategy for any risk identified. If no mitigation, risk is not negligible.
  2.  **Inflating Search Costs (Gate 3):**
      *   *The Move:* A board member keeps asking "But is this the *best* way to do it?" to drive up deliberation time until the "Search Cost Limit" forces a default Reject.
      *   *The Counter:* Chair enforces the rule: "We are not evaluating science quality, only sufficiency."
  3.  **The "Conditional Approval" Loophole (Gate 4):**
      *   *The Move:* Approve Case 3 (Retention) with a "condition" that never gets checked (e.g., "Just make sure security is good").
      *   *The Counter:* Conditions must be verifiable *before* data collection starts. If it can't be verified now, it's a Reject.

  ***

  ## Part 4: Limitations (What This Procedure Cannot Do)

  *Include this in your memo to the Board to manage expectations.*

  1.  **It Does Not Resolve Value Disagreements:** If half the board believes biometric data is "minimal risk" and half believe it is "high risk," this checklist will flag a Value Conflict. It does not solve it. It forces a vote.
  2.  **It Does Not Guarantee Ethical "Goodness":** Satisficing finds the *acceptable*, not the *ideal*. A protocol can pass SEP and still be ethically mediocre. It only prevents ethically *catastrophic* outcomes within the time budget.
  3.  **It Shifts Burden to the Researcher:** By rejecting vague "future use" cases (Case 3), the board pushes the work back to the researcher to write specific protocols. This will cause friction with the Research Office.
  4.  **It Cannot Replace Legal Counsel:** If a Hard Stop involves liability (e.g., data sovereignty across borders), the procedure mandates a Deferral to Legal. It does not give the Board authority to guess.

  ***

  ### Implementation Note for the Advisor
  Tell the Board Chair: *"This tool isn't about being stricter; it's about being faster. It allows you to say 'Yes' confidently to low-risk stuff by explicitly ignoring the optimization of high-risk stuff that you don't have time to evaluate."*

  This frames satisficing as an efficiency tool, which is usually the only language admin understands.
