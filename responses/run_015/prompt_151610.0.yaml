prompt: |-
  hey so im a phd student in decision sciences (mostly bounded rationality / satisficing stuff, with some weird side interest in how aspiration levels adapt under partial feedback) and my advisor volunteered me to help our univ's small research ethics board stop debating every amendment to death. they have like 20 minutes per case, zero lawyers on staff, and right now they try to 'maximize ethical coverage' which is impossible so they just stall.

  i need a reusable decision procedure—checklist style, questions in order, what counts as sufficient at each gate, hard stop for no, and explicit hand-off points where its values not facts. it should be grounded in satisficing logic, not optimization: set an aspiration level for risk/info-gain, search only until you hit it or search costs spike, then adapt downward only if the spike is genuine not just impatience. apply it to three protocol amendments: (1) switching survey language in an approved study, (2) adding a biometric sensor not in original consent, (3) extending retention for 'future unspecified analysis.' case 3 should fail the gate but its exactly the kind they always want to rubber-stamp, so flag that tension.

  also include where the board can game the aspiration levels to get the answer they want, and a clear section on what this procedure cant do—like resolve deep disagreement about acceptable risk, just make it visible. sorry this is long, im writing between classes and my trackpad is acting up.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** PhD student in Decision Sciences (bounded rationality/satisficing/aspiration levels).
      *   **Context:** University Research Ethics Board (REB/IRB). Small, under-resourced (20 mins/case, no lawyers), currently stuck in "maximization" mode leading to stalls.
      *   **Task:** Create a reusable decision procedure (checklist style) grounded in *satisficing* logic (Simon/March/Cyert), not optimization.
      *   **Key Features:** Ordered questions, sufficiency criteria, hard stops, hand-off points (values vs. facts), adaptation rules for aspiration levels.
      *   **Applications:** Apply to three specific amendment cases:
          1.  Survey language switch.
          2.  Adding biometric sensor (new consent needed?).
          3.  Extending retention for "future unspecified analysis" (should fail, but usually gets rubber-stamped).
      *   **Critical Additions:** Where the board can game the aspiration levels (manipulation points), and limitations (what the procedure *can't* do).
      *   **Tone:** Professional, academic but practical, acknowledging the user's expertise (no need to explain basic satisficing theory, just apply it).

  2.  **Deconstruct the Theoretical Framework (Satisficing in Ethics):**
      *   *Optimization:* Find the *best* ethical outcome (impossible, infinite regress).
      *   *Satisficing:* Find an outcome that meets a minimum threshold of acceptability (aspiration level).
      *   *Search Rule:* Search until an alternative meets the aspiration level.
      *   *Stopping Rule:* Stop searching when an acceptable option is found OR search costs exceed the value of further search.
      *   *Adaptation:* If no option meets the level, lower the aspiration level *only if* the constraint is genuine (resource/time), not just impatience. If risk is too high, raise the bar.
      *   *Sequential Attention:* Focus on one goal at a time (e.g., risk first, then validity).

  3.  **Drafting the Procedure (The "Satisficing Ethics Protocol" - SEP):**
      *   Need a structure that fits a 20-minute window.
      *   Needs clear "Gates."
      *   Needs to distinguish between *Facts* (what is happening) and *Values* (is this okay).
      *   *Aspiration Level:* "Minimal Risk + Valid Consent + Scientific Utility."

      *   *Gate 1: Risk Threshold (Hard Stop).* Is the change > Minimal Risk?
      *   *Gate 2: Consent Alignment (Hard Stop).* Does the original consent cover this?
      *   *Gate 3: Scientific Utility (Satisfice).* Is there *enough* reason to do this? (Not "best" reason, just "sufficient").
      *   *Gate 4: Search Cost Check.* Have we spent 15 mins? If yes, default to precaution or defer.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Language Switch):* Low risk, consent holds, utility clear. -> *Pass.*
      *   *Case 2 (Biometrics):* Higher risk (privacy/bodily), consent likely doesn't cover it. -> *Fail/Modify.*
      *   *Case 3 (Future Retention):* Vague utility, high privacy risk over time, consent usually too broad. -> *Fail (but note the pressure to Pass).*

  5.  **Addressing the "Gaming" and "Limitations":**
      *   *Gaming:* Adjusting what "Minimal Risk" means, inflating search costs to force a default, redefining "sufficient utility."
      *   *Limitations:* Can't solve moral disagreement, can't replace legal counsel, doesn't guarantee *good* science, just *acceptable* ethics.

  6.  **Refining the Tone:**
      *   The user is a PhD student in this specific field. Use the jargon correctly (aspiration levels, search costs, sequential attention).
      *   Keep it actionable for the board members (who are *not* decision scientists).
      *   Acknowledge the tension in Case 3 explicitly.

  7.  **Iterative Polishing (Self-Correction during drafting):**
