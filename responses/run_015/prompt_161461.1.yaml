answer: |-
  # Handout: The Aunt Hillary Triage

  ## Part 1: The Logical Space (Where the Disagreements Live)

  Before taking the quiz, understand that your answers will sort you based on five underlying philosophical forks. These are the "branching questions" that define the cells of the logical space. We aren't asking if you *like* the idea of a colony mind; we are asking what criteria you use to grant it.

  1.  **Individuation:** What makes a system *one* thing? Is it physical continuity (one nest, one body) or functional integration (acting as a unit regardless of physical spread)?
  2.  **Integration vs. Organization:** Is mere causal coupling enough for mentality, or do you need specific information-processing structures (like memory, comparison, or error correction)?
  3.  **Time-Scale Relativity:** Does mentality require a specific speed of processing? If a decision takes six hours instead of six milliseconds, does the *kind* of state change from "thought" to "mechanism"?
  4.  **Realism vs. Instrumentalism:** When we say "The colony wants sugar," is that a description of a real internal state, or just a shorthand for predicting behavior (a *façon de parler*)?
  5.  **Constitution & Inheritance:** Can a mind emerge from parts that have no minds (ants/neurons), or must mentality be inherited from or constituted by the mental states of the components?

  ## Part 2: The Leaves (Possible Positions)

  Your quiz results will map you onto one of these six positions. Each includes its "awkward commitment"—the bullet you have to bite to stay consistent.

  1.  **Colony Realism (The Hofstadter View)**
      *   *View:* Aunt Hillary is a genuine subject with beliefs and desires distinct from the ants.
      *   *Awkward Commitment:* You must accept that a single thought can be physically distributed across thousands of bodies and take hours to occur without losing its status as a thought.
  2.  **Superorganism Functionalism (Mind-Yes, Subject-No)**
      *   *View:* The colony processes information and has "beliefs" in a functional sense, but there is no "who" inside; it is a mind without a subject.
      *   *Awkward Commitment:* You have to explain how a system can have false beliefs or knowledge without anyone being there to be mistaken or know.
  3.  **Pluralist Individualism (The Ant-Centric View)**
      *   *View:* Cognition is real, but the only thinkers are the individual ants; the colony is just a crowd.
      *   *Awkward Commitment:* You must deny that the colony knows things no single ant knows (e.g., the location of the best nest site when no scout has compared them).
  4.  **Deflationary Instrumentalism (The "Just Talk" View)**
      *   *View:* "Aunt Hillary" is a useful fiction for prediction, like saying "the economy is anxious," but nothing literally corresponds to the name.
      *   *Awkward Commitment:* You cannot consistently treat the colony as a moral patient (e.g., it makes no sense to say the colony *suffers* if the nest is destroyed).
  5.  **Constitutive Inheritance (The Parts-First View)**
      *   *View:* A system can only have a mind if its constituent parts have minds (or at least proto-mental states).
      *   *Awkward Commitment:* If ants are purely mechanical reflex-machines, the colony *cannot* have a mind, regardless of how intelligent it acts.
  6.  **Temporal Threshold (The Speed View)**
      *   *View:* Mentality requires a minimum speed of integration; processes slower than a certain threshold are merely causal chains, not thoughts.
      *   *Awkward Commitment:* You must accept that if you slowed a human brain down by a factor of a million, it would cease to have thoughts while it was running slow.

  ## Part 3: The Quiz

  **Instructions:** For each scenario, choose the option that best matches your intuitive reaction. Do not overthink consistency; go with your gut.

  **1. The Quorum Decision**
  A swarm must pick a new nest site. Scouts find two sites. No single ant ever visits both or compares them. Through a quorum rule (counting neighbors), the swarm picks the better site.
  *   **A.** The colony *knows* Site A is better, even though no ant does.
  *   **B.** The colony merely *settles* on Site A; only the ants have knowledge states.
  *   **C.** It's misleading to use words like "knows" or "picks" here; it's just causal pressure.

  **2. The Split Nest**
  A single colony occupies two physically separated nests connected by a long pheromone trail. They coordinate foraging perfectly.
  *   **A.** It is one mind stretched across space, like a body with long limbs.
  *   **B.** It is two minds synchronized by a communication channel.
  *   **C.** It is a network of ants; the "nest" boundaries don't define the mind.

  **3. The Fusion and Split**
  Two distinct colonies fuse into one working unit for a season, then separate back into their original groups with their original queens.
  *   **A.** They became one person for a season, then split (a mental fission).
  *   **B.** They remained two distinct agents merely cooperating closely.
  *   **C.** "One person" is the wrong category; they are just interacting systems.

  **4. The Robot Swap**
  We replace the ants one by one with tiny robots programmed to follow the exact same chemical rules. The colony behavior remains identical.
  *   **A.** Aunt Hillary survives the swap; substrate doesn't matter.
  *   **B.** Aunt Hillary dies as soon as the critical mass of "living" ants is gone.
  *   **C.** Aunt Hillary was never alive to begin with, so nothing died.

  **5. The English Box**
  A device reads the colony's chemical state and prints English sentences (e.g., "I am hungry"). The colony shifts behavior to match the sentence.
  *   **A.** This proves the colony has propositional attitudes (beliefs) expressible in language.
  *   **B.** The *box* has the beliefs; the colony is just the box's peripheral nervous system.
  *   **C.** The sentences are translations of mechanical states, not expressions of mind.

  **6. The Six-Hour Thought**
  The colony takes six hours to "decide" to move a larva. A human decides in milliseconds.
  *   **A.** It is still a thought, just a slow one (time-scale is relative).
  *   **B.** It is too slow to be a mental state; it is a biological process.
  *   **C.** Speed is irrelevant, but the lack of a central processor makes it non-mental.

  **7. The False Belief**
  Pheromone trails are sabotaged. The colony marches food into a trap. No individual ant is "mistaken" (they just follow rules).
  *   **A.** The colony has a false belief, distinct from the ants' states.
  *   **B.** The colony is malfunctioning, but only ants can have "beliefs" to be false.
  *   **C.** "False belief" is a metaphor for "behavior that fails to achieve goals."

  **8. The Moral Harm**
  A boot crushes the nest. 5,000 ants die.
  *   **A.** You have killed one subject (Aunt Hillary) and many parts.
  *   **B.** You have killed many subjects (the ants) and destroyed a system.
  *   **C.** You have destroyed property; "killing" applies only to the ants.

  ## Part 4: Scoring Key & Flags

  **How to Score:**
  Tally your answers. There is no perfect algorithm, but dominant patterns indicate your leaf.

  *   **Mostly A's:** **Colony Realism.** You prioritize functional integration over substrate or speed. You are committed to the idea that *pattern* constitutes personhood.
  *   **Mostly B's:** **Pluralist Individualism** or **Constitutive Inheritance.** You locate agency in the components. Check Q4: If you chose B there, you are an Inheritance Theorist. If A, you are a Pluralist.
  *   **Mostly C's:** **Deflationary Instrumentalism.** You reject the category of "collective mind" entirely as a category error.
  *   **Mixed A/B (Specific Pattern):** If you chose **A on Q1 & Q7** (Beliefs) but **B on Q8** (Moral Harm), you are a **Superorganism Functionalist**. You grant cognitive states but deny subjecthood/suffering.
  *   **B on Q6:** **Temporal Threshold.** You specifically reject slow cognition.
  *   **B on Q2:** **Boundary Essentialist.** You think physical continuity is required for a single mind.

  **Messy Patterns (Nowhere Clean):**
  *   **A on Q4 (Robots) but B on Q1 (Quorum):** You think substrate doesn't matter, but aggregation doesn't create knowledge. This is theoretically unstable (why does the robot swarm know what the ant swarm doesn't?).
  *   **A on Q8 (Moral Harm) but C on Q1 (Quorum):** You think the colony can suffer but cannot know. This is a rare "Moral Fictionalist" stance.

  **Flags & Limitations:**

  1.  **Indistinguishable Leaves:** This quiz struggles to separate **Pluralist Individualism** from **Constitutive Inheritance**. Both deny the colony mind, but for different reasons (one says "too many subjects," the other says "parts aren't mental"). To split them, you would need a scenario where ants *do* have simple minds vs. where they are philosophical zombies.
  2.  **The "Whole Forest" Problem:** **Colony Realism** and **Superorganism Functionalism** lack a principled stopping point. If a colony is a mind because of information integration, why isn't the forest? Why isn't the internet? If you scored Mostly A, you must articulate a *threshold of integration* or accept that the forest is thinking too.
  3.  **The Time-Scale Trap:** **Temporal Threshold** views often collapse into **Deflationary Instrumentalism** upon reflection. If you admit a slow system *could* think if sped up, you've abandoned the time constraint. Q6 tests this, but sophisticated theorists can wiggle out.
