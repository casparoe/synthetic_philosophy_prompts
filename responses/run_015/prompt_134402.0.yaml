answer: |-
  # Q&A PREP SHEET: Algorithmic Feeds & Cultural Evolution

  ## I. GROUNDING: SETTLED VS. CONTESTED
  *Use this to frame answers and prevent category errors.*

  **Settled (Common Ground):**
  *   **Cultural transmission is not genetic inheritance.** We agree vertical transmission, mutation rates, and fidelity differ fundamentally between biology and culture.
  *   **Memetics (strict Dawkinsian) is insufficient.** We agree that treating cultural ideas as discrete, high-fidelity replicators analogous to genes fails to capture continuous variation and blending in culture.
  *   **Environment matters.** We agree that ecological context influences transmission success.

  **Contested (The Battleground):**
  *   **Unit of Selection:** Does cultural evolution require discrete replicators (Philosophers/Biologists) or can it operate on continuous structural attractors (My Thesis)?
  *   ** locus of Selection:** Is selection driven primarily by human psychology/agency (Anthropologist/DIT) or by the architecture of the transmission medium itself (My Thesis)?
  *   **Modeling Framework:** Should we force cultural evolution into Population Genetics models (Philosophers) or shift to Developmental Niche Construction/Dynamical Systems (My Thesis)?

  ---

  ## II. HIGH-DAMAGE OBJECTIONS (Ordered by Threat Level)

  ### 1. The Formalization Challenge (From the Philosophers of Biology)
  **Objection:** "If you reject discrete replicators, you lose trackability. Population genetics relies on counting unit frequencies over time. If 'format-attractors' are continuous structural states, how do you quantify fitness? Without math, this is just metaphor, not evolution."

  **Two-Minute Reply:**
  "I accept the risk of losing simple frequency counts, but I argue we are modeling the wrong variable. In algorithmic feeds, 'fitness' isn't how many copies exist, but how long a format sustains attention within the architecture. We shouldn't be using Population Genetics; we should be using Dynamical Systems Theory.
  Think of the feed not as a population of individuals, but as a state space. The 'attractor' is a stable state the system tends toward (e.g., short-form vertical video). We measure fitness by the depth of the basin of attraction—how hard it is for content to *not* conform to that format to survive.
  We can quantify this via retention rates, completion rates, and format homogeneity over time, not just copy counts. If we force this into a gene-frequency model, we ignore the medium's constraint. I'm not proposing we stop modeling; I'm proposing we switch from counting particles to mapping landscapes. The math exists in complexity science; we just haven't applied it to cultural evolution because we're too attached to the genetics analogy."

  **Weakness Note:** Dynamical systems models are harder to falsify than pop-gen models. They may press you for a specific equation during the break.

  ### 2. The Selection vs. Transmission Bias Distinction (From the Evolutionary Biologists)
  **Objection:** "You're conflating selection with transmission bias. Algorithms don't 'select' in a biological sense; they amplify human choices. If the algorithm optimizes for engagement, humans are still the selectors via their clicks. The algorithm is just a biased transmission channel, like a bottleneck effect."

  **Two-Minute Reply:**
  "That distinction holds when the medium is passive. But recommendation architectures are active optimizers with goal functions distinct from individual human intent. The algorithm's 'goal' is retention/time-on-platform, not necessarily human satisfaction or accurate cultural replication.
  When a format succeeds because it hacks the recommendation engine (e.g., engagement bait) rather than because humans value the content, the selection pressure comes from the architecture, not the host.
  In niche construction theory, organisms modify their environment, which then selects back on them. Here, the algorithm is the constructed niche. It creates a fitness landscape where ' replicability' matters less than 'compatibility with the code.' If the code filters content before human eyes ever see it (shadow banning, prioritization), that is pre-human selection. It's not just a bias in transmission; it's a filter on existence within the niche."

  **Weakness Note:** If they prove algorithmic optimization is perfectly correlated with human engagement, your "active selector" argument collapses into "biased transmission."

  ### 3. The "Dead Memetics" Resurrection (From the Anthropologist)
  **Objection:** "I argued memetics was dead because culture isn't particulate. You're admitting formats aren't replicators, but you're still talking about 'selection' and 'fitness.' Aren't you just reviving memetics with new jargon? Why not just call this 'media ecology'?"

  **Two-Minute Reply:**
  "I agree memetics is dead regarding *content* as genes. My thesis is that we need to stop looking at the content entirely. Memetics asked 'which idea wins?' I'm asking 'which container survives?'
  Media ecology describes the environment but often lacks an evolutionary mechanism. I'm proposing Developmental Niche Construction because it accounts for the reciprocity: humans build the feed, the feed constrains human expression, which changes what humans build next.
  It's not memetics because the 'unit' isn't the idea; it's the structural relationship between the user, the content, and the interface. We aren't tracking the survival of a specific meme, but the survival of the *conditions* that allow visibility. This moves us from a theory of cultural *genes* to a theory of cultural *development*. It's not a resurrection; it's a burial of the replicator concept in favor of the developmental system."

  **Weakness Note:** Risk of sounding like you're splitting hairs. Be prepared to define exactly how "format" is measurable distinct from "content."

  ### 4. The Dual Inheritance Theory (DIT) Defense (From the Philosophers)
  **Objection:** "Dual Inheritance Theory already handles this. Genes and Culture co-evolve. Why do we need to replace Darwinian culture theory? Can't DIT just add 'algorithm' as an environmental variable?"

  **Two-Minute Reply:**
  "DIT assumes cultural transmission is primarily driven by human psychology—imitation, prestige bias, content bias. It assumes the human mind is the primary filter.
  Algorithmic feeds bypass or augment these psychological filters. A video goes viral not because it's prestigious or psychologically catchy, but because it fits the optimization function of the feed.
  If the selection pressure comes from the code rather than the mind, DIT's core mechanism (psychological transmission biases) is insufficient. We aren't just adding a variable; we are changing the selector. In DIT, culture evolves because humans choose it. In my model, culture evolves because the architecture allows it to be seen. That requires a shift from inheritance models to construction models, where the niche itself dictates the developmental path of the information."

  **Weakness Note:** DIT is robust and flexible. They may argue that "psychology" includes our interaction with tools, absorbing your point without theory change.

  ---

  ## III. THE "PRAYER" OBJECTION (The Killer Question)
  **Objection:** "You claim algorithms select independently of humans. But algorithms are trained on human data. If the algorithm selects X, it's only because humans historically engaged with X. So isn't the algorithm just a mirror of human selection, lagged by time? Where is the independent selection pressure?"

  **Two-Minute Reply:**
  "That is the critical empirical question. If the algorithm is a perfect mirror, I'm wrong. But there is evidence of divergence.
  First, **latent space optimization**: Algorithms cluster content based on vector similarity humans don't perceive. Two videos might be paired not because humans see a link, but because the same user cohort watched both. This creates cultural associations humans didn't intend.
  Second, **reward hacking**: Creators now design content specifically for the bot, not the human (e.g., specific pacing, keywords, visual triggers that boost retention metrics without increasing human satisfaction). When content evolves to please the algorithm *at the expense* of human utility, that is independent selection pressure.
  Third, **feedback loops**: The algorithm shows you X, you click X, it shows you more X. It creates a preference that didn't exist prior to exposure. That is niche construction modifying the selector (the human).
  I'm not saying it's fully independent yet, but the trajectory is toward autonomy. If we wait until it's fully independent to call it selection, we'll miss the transition phase we are in right now."

  **Weakness Note:** This is the hardest point to defend empirically. If they ask for a specific case where algorithmic selection contradicted aggregate human preference, you need a concrete example ready (e.g., clickbait that users hate but click).
