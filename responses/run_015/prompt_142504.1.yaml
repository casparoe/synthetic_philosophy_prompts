answer: |-
  Your instincts are excellent, and your roommate is only half-right. To put it bluntly: **this passage is a disaster of technical accuracy.** It gets the basic story arc right (Nash came first, KS came later to fix a specific intuition), but it botches the definitions, the axioms, and the mathematical properties so badly that a game theorist would wince at almost every sentence.

  You correctly identified the two biggest red flags: the IIA claim and the "equal split" conflation. But there is a third error regarding ordinal utility that is arguably even more damaging to the book's philosophical conclusion.

  Here is the sentence-by-sentence breakdown, followed by answers to your specific questions.

  ### The Red Pen: Sentence-by-Sentence

  > *"Nash asked what a fair split looks like and proved there is exactly one answer: pick the deal that makes the product of the two sides' gains as big as possible."*

  *   **Verdict:** **Accept.**
  *   **Comment:** This is a correct popularization of the Nash Bargaining Solution (NBS). It maximizes the Nash product $(u_1 - d_1)(u_2 - d_2)$.

  > *"His argument rested on a principle called independence of irrelevant alternatives: if you would choose x out of a set of options, then after new options get added you can't switch your choice to some other y."*

  *   **Verdict:** **Accept.**
  *   **Comment:** Correct definition of IIA in this context. NBS satisfies this.

  > *"But that principle gives crazy results, and in the seventies Kalai and Smorodinsky fixed it by swapping in a monotonicity requirement instead..."*

  *   **Verdict:** **Accept (with nuance).**
  *   **Comment:** This is the standard motivation for the Kalai-Smorodinsky (KS) solution (1975). The "crazy result" of IIA is that expanding the feasible set in a way that helps Player 1 (but isn't chosen) can sometimes hurt Player 1 in the final agreement. KS replaces IIA with Individual Monotonicity.

  > *"...enlarging the set of feasible deals, in the sense of giving somebody more options, should never leave a player worse off than before."*

  *   **Verdict:** **Accept.**
  *   **Comment:** This is a fair description of Individual Monotonicity.

  > *"Their rule is simple. Work out the best payoff each side could possibly get, then pick the feasible point where both sides get the same fraction of that personal maximum..."*

  *   **Verdict:** **Accept.**
  *   **Comment:** This is the geometric definition of KS. You draw a line from the disagreement point to the "ideal point" (where each gets their maximum feasible utility) and see where it hits the Pareto frontier.

  > *"...which is to say, an equal split of the gains."*

  *   **Verdict:** **Flat Wrong.**
  *   **Comment:** This is your first bug. "Same fraction of personal maximum" is **not** "equal split of gains" unless the maximums are identical.
      *   *Example:* Disagreement is (0,0). Player 1 max is 100. Player 2 max is 10.
      *   KS Solution (50% fraction): Player 1 gets 50, Player 2 gets 5.
      *   Equal Split of Gains: Player 1 gets 55, Player 2 gets 55 (impossible here, but you get the point).
      *   The text conflates *proportional* gains with *absolute* gains.

  > *"Unlike Nash's solution, this one respects monotonicity, and it also still satisfies independence of irrelevant alternatives..."*

  *   **Verdict:** **Flat Wrong.**
  *   **Comment:** This is your second bug, and it is the fatal technical error. **KS does not satisfy IIA.** That is the entire trade-off. Kalai and Smorodinsky proved that you cannot have Pareto Optimality, Symmetry, Scale Invariance, IIA, *and* Monotonicity all at once. You must drop IIA to get Monotonicity. The text claims KS has its cake and eats it too. It doesn't.

  > *"...and it has been proved to be the only rule that checks every box on the wish list."*

  *   **Verdict:** **Misleading.**
  *   **Comment:** It is the unique solution satisfying {Pareto, Symmetry, Scale Invariance, Monotonicity}. But since the text falsely claims IIA is on that list and satisfied, this sentence inherits the error.

  > *"Best of all, it requires no comparison of one person's welfare against another's, because each side's share is measured against their own best case."*

  *   **Verdict:** **Philosophically Dubious / Technically Wrong.**
  *   **Comment:** Normalizing both players' utilities to a scale of 0 (disagreement) to 1 (ideal) *is* a method of making interpersonal comparisons. You are asserting that 50% of my potential is "equal" to 50% of your potential. That is a normative comparison.

  > *"So it works even when the bargainers' utilities are merely ordinal: stretch someone's utility function in any increasing way you like and the recommended deal doesn't move."*

  *   **Verdict:** **Flat Wrong.**
  *   **Comment:** This is the third major error. Bargaining solutions (both Nash and KS) require **cardinal** utility (specifically, von Neumann-Morgenstern utility). They are invariant to *affine* transformations ($u' = au + b$), but **not** to arbitrary increasing transformations ($u' = u^2$, $u' = \log u$). If you stretch the utility function non-linearly, you change the shape of the feasible frontier and the location of the "ideal point," which moves the KS solution.

  > *"once you do the math, fairness in bargaining just is equal division, and every rival rule is a rationalization."*

  *   **Verdict:** **Overstatement.**
  *   **Comment:** Even if the math were described correctly, KS implies "Equal Relative Concession," not "Equal Division."

  ---

  ### Addressing Your Specific Questions

  #### 1. Are monotonicity and IIA actually both satisfiable by one solution here?
  **No.** The book has quietly credited the replacement solution with the axiom it was designed to drop. This is a known impossibility result. If a solution satisfies Pareto Optimality, Symmetry, and Scale Invariance, it cannot satisfy both IIA and Individual Monotonicity.
  *   **Nash:** Satisfies IIA, fails Monotonicity.
  *   **Kalai-Smorodinsky:** Satisfies Monotonicity, fails IIA.
  The text claims KS satisfies both. That is mathematically impossible.

  #### 2. Does the slide from "equal fraction of your personal maximum" to "equal split of the gains" matter?
  **Yes, it matters significantly.** Your roommate is right that in a *symmetric* diagram (where the feasible set is symmetric around the 45-degree line), the two concepts coincide. Textbooks often draw symmetric pies to make the geometry easy to read.
  However, in the real world (and in the general theory), bargaining power and potential gains are rarely symmetric.
  *   **Equal Fraction:** If I can potentially gain \$1,000 and you can potentially gain \$100, a 50/50 split of *potential* gives me \$500 and you \$50.
  *   **Equal Split:** A 50/50 split of *gains* would imply we get the same dollar amount.
  The book uses this slip to sneak in a populist conclusion ("fairness is equal division") that the actual math does not support. KS is actually quite comfortable with unequal absolute splits if the players have different capacities.

  #### 3. Is the bit about avoiding interpersonal comparison / ordinal utility right?
  **No, and this costs the chapter its pitch.**
  *   **Cardinality:** Bargaining theory fundamentally relies on the intensity of preferences (cardinality), not just rankings (ordinality). The "gains" ($u_i - d_i$) measure *how much* better the deal is than walking away. If utilities are merely ordinal, "how much better" is meaningless. You cannot maximize a product of gains or compare fractions of maximums with ordinal data.
  *   **Interpersonal Comparison:** The KS solution *does* make an interpersonal comparison. It asserts that it is "fair" for both parties to receive the same *proportion* of their maximum possible improvement. This assumes that 50% of my utility scale is comparable to 50% of yours. The text claims it avoids this, but the mechanism it describes *is* the comparison.
  *   **Cost:** This undermines the "pop-econ" appeal. The author wants to say, "Look, we don't need to compare your happiness to mine!" But the math they cite *requires* normalizing our happiness scales to compare them.

  #### 4. Is the uniqueness claim doing real work?
  **Yes, but it's misapplied.** The uniqueness theorem (Kalai & Smorodinsky, 1975) is real and important. It shows that if you accept their specific list of axioms, KS is the *only* answer. However, because the text lies about the axioms (claiming IIA is included), the uniqueness claim becomes a magic trick rather than a mathematical result. It's used to shut down debate ("it's been proved!") based on a false premise.

  ---

  ### The Big Conclusion: Does "Fairness = Equal Division" Survive?

  **No.** The chapter's big conclusion does not survive correction.

  1.  **KS is not Equal Division:** As established, KS equalizes *relative* gains (distance from disagreement as a fraction of distance to ideal), not absolute gains. If one player has a stronger threat point or higher potential value, KS gives them a larger absolute share.
  2.  **The "True" Nearby Claim:** The author was likely reaching for the **Equal Relative Concession** principle. This is a coherent philosophical idea: fairness means we both give up the same percentage of what we *could have* hoped for.
      *   *Example:* I want \$100, you want \$100. We can only split \$100.
      *   Nash might give us \$50/\$50.
      *   KS might give us \$50/\$50.
      *   *But:* If I can walk away with \$40 and you with \$0, and the max surplus is \$100...
      *   KS adjusts the split to account for those different "ideal" points. It is not a blind 50/50 split of the pot.
  3.  **Why the Author Lied (Charitably):** The author likely simplified "Equal Relative Concession" to "Equal Split" because it sounds punchier and more morally satisfying to a general audience. "You get half of what you could have hoped for" is harder to sell than "You get half the pie."

  ### Summary for Your Reading Group
  If you want to raise this in the group without sounding pedantic, you can frame it like this:

  > "I was fascinated by the bargaining chapter, but I tried to check the math against the original Kalai-Smorodinsky paper. It looks like the book simplifies things a bit too much in three places:
  > 1. It claims KS satisfies Independence of Irrelevant Alternatives, but KS was actually designed to *drop* that axiom in favor of Monotonicity.
  > 2. It equates 'equal fraction of maximum' with 'equal split,' which only holds in symmetric cases. In asymmetric cases, KS actually justifies unequal splits.
  > 3. It claims the solution works with ordinal utility, but bargaining solutions generally require cardinal utility to measure 'gains.'
  >
  > Does this change the moral conclusion? It seems KS argues for 'equal relative sacrifice' rather than 'equal division,' which might handle power imbalances differently than the chapter suggests."

  This acknowledges the book's value while correcting the record. Your skepticism was 100% warranted. The passage you copied is a "telephone game" version of game theory where the message got distorted at every step.
