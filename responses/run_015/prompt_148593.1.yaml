      *   *Point 2 (Winner-Take-All vs. Distributed Luck):* In nature, multiple people can eat fallen fruit. In science, priority is binary (first to publish). The metaphor suggests a benign distribution of bounty; reality is a tournament. Luck isn't shared; it's concentrated.

