      *   *Refining the "Luck" conclusion:* Even if indistinguishable, the "Luck" argument is weakened because *responsiveness to signals* is a skill. Being the one to hear the talk and act on it isn't pure luck; it's readiness. The "Fruit" metaphor implies passivity. Science is active.

