      *   *The Problem:* Distinguishing "Zeitgeist/Inevitability" (multiple people reached the same point independently because the time was right) from "Contagion/Cascade" (multiple people reached the same point because information leaked or a signal was sent).
      *   *Can the record alone tell us?*
