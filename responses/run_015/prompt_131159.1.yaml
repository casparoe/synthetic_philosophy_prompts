  # Diagnostic Taxonomy of Material Constitution
  ### Scenario: The Work (Metabolizing Ceramic-Biofilm Artifact)

  **Instructions for the Reading Group:**  
  Follow the path determined by your intuitions about the case. Answer each question based on the physical description of *The Work*, not on prior knowledge of philosophical labels. The terminal nodes (leaves) identify the coherent philosophical position corresponding to your set of commitments.

  ---

  **ROOT NODE**  
  **Q1:** Can *The Work* survive the complete replacement of all its constituent matter if its form and causal-functional loop are preserved continuously by an active process?  
  *(Analogy: Is the identity of the apparatus tied to the specific atoms, or to the maintained state variables?)*

  *   **NO** → **LEAF 1: Mereological Essentialism**  
      *Diagnosis:* You hold that the parts are essential to the whole. If the atoms change, the original object ceases to exist, regardless of functional continuity.

  *   **YES** → Proceed to **LEVEL 2**.

  ---

  **LEVEL 2 NODE**  
  **Q2:** At any given time, can *The Work* and the underlying ceramic-biofilm aggregate be two numerically distinct objects that occupy exactly the same region but differ in their survival conditions?  
  *(Analogy: Do we have one system here, or two overlapping systems with different failure modes, like a "hardware" object and a "software" object occupying the same volume?)*

  *   **YES** → Proceed to **LEVEL 3**.
  *   **NO** → Proceed to **LEVEL 3**.

  ---

  **LEVEL 3 NODE**  
  **Q3:** Is persistence through such change best analyzed as the endurance of a single three-dimensional entity that gains and loses parts over time, or as the existence of a four-dimensional spatiotemporal "worm" composed of instantaneous temporal parts?  
  *(Analogy: Is the object a persistent particle moving through time, or a static world-tube extended in spacetime where "change" is just variation along the time axis?)*

  *   **Option A: Three-Dimensional Endurance** → Proceed to **LEVEL 4** (if Q2 was NO) or **LEAF 2** (if Q2 was YES).
  *   **Option B: Four-Dimensional Perdurance** → Proceed to **LEAF 3** (if Q2 was YES) or **LEAF 4** (if Q2 was NO).

  *(Note: To maintain diagnostic efficiency, branches where the position is fully determined by Q3 terminate here.)*

  ---

  **LEVEL 4 NODE**  
  *(Only accessible if Q1=YES, Q2=NO, and Q3=Three-Dimensional)*  
  **Q4:** Is the boundary that distinguishes *The Work* from its surroundings determined by a real, mind-independent fact (e.g., causal cohesion), or is it a conventional projection with no ontological weight?  
  *(Analogy: Is the system boundary like a phase transition surface [real], or like a control volume drawn for calculation convenience [conventional]?)*

  *   **YES (Real Fact)** → **LEAF 5: Functional-Continuity View**  
      *Diagnosis:* The object is a real, enduring 3D entity defined by its causal loop, distinct from the mere sum of its parts.

  *   **NO (Conventional Projection)** → **LEAF 6: Artifact-Eliminativism / Conventionalism**  
      *Diagnosis:* Only the atoms are real; the "artifact" is a useful linguistic label we project onto a swarm of particles.

  ---

  ### Terminal Leaves (Positions)

  1.  **Mereological Essentialism** (Root: NO)
  2.  **The Constitution View (Coincident Objects)** (Root: YES → L2: YES → L3: 3D)
  3.  **UNOCCUPIED** (Root: YES → L2: YES → L3: 4D)  
      *Diagnosis:* Merely unattractive, as four-dimensionalism typically dissolves the motivation for positing coincident objects.
  4.  **Four-Dimensionalism / Perdurantism** (Root: YES → L2: NO → L3: 4D)
  5.  **Functional-Continuity View** (Root: YES → L2: NO → L3: 3D → L4: YES)
  6.  **Artifact-Eliminativism / Conventionalism** (Root: YES → L2: NO → L3: 3D → L4: NO)

  ---

  ### Ambiguity Flag

  **Pair:** **Functional-Continuity View** (Leaf 5) and **Artifact-Eliminativism** (Leaf 6).

  **Reason for Ambiguity:** The tree separates these based on whether the system boundary is "real" or "conventional." However, for a retired scientist, distinguishing a mind-independent causal cohesion from a highly stable, useful convention is often empirically underdetermined. Both views agree on the physics of the turnover; they disagree only on the metaphysical status of the boundary condition, which may not yield different experimental predictions.

  ---

  ### Structural Notes for the Group
  *   **Pruning:** Notice that if you answer **YES** to Q2 (Coincidence), Q4 is skipped. This is because the Constitution View (Leaf 2) is defined primarily by the claim that two things can be in one place; the status of the boundary is secondary to that core commitment.
  *   **Unoccupied Node:** Leaf 3 marks a logical possibility (Coincident 4D Worms) that is rarely defended. Most philosophers who accept 4D worms (Perdurantism) do so because it *avoids* the puzzle of coincidence, making the combination unstable.
  *   **Physics Analogy:** Think of the Root Question as asking whether the "state" survives the replacement of the "substrate." Think of Q4 as asking whether the "system boundary" is a feature of the terrain or a feature of the map.
