  A medium-severity tension exists between (1) and (6). Lewis-style counterpart theory is traditionally anchored in Modal Realism, yet (6) treats belief in concrete worlds as unsupported by intuition. You can retain counterpart semantics without ontological commitment to concrete worlds (Actualist Counterpart Theory), but you must decouple (1) from Lewis's specific realism. This dissolves if you treat worlds as maximal consistent sets of propositions rather than concrete realms.

  Commitments (4) and (5) cohere well with (1) and (2). Denying bare particulars (5) necessitates qualitative grounding for identity, which psychological continuity (4) and counterpart relations (1) provide. There is no conflict here; the version-control analogy supports a relational view of persistence compatible with counterpart theory. The apparent tension between (3) and (2) dissolves only if you strictly distinguish between particulars (subject to CT) and universals/structures (subject to literal identity).

  Abandoning the literal identity claim in (3) resolves the most conflicts. If you maintain (2), you cannot allow any particular to exist in multiple worlds. By reducing algorithms to structural types, you preserve (2) and avoid ad hoc exceptions for software. Specifically, (3) does not collapse (2) into incoherence provided you restrict (2) to concrete particulars and (3) to abstract structures. However, if you view algorithm instances as concrete particulars, you must drop (2) or (3). Dropping (3)'s literal identity claim is ontologically cheaper than introducing transworld identity exceptions.
