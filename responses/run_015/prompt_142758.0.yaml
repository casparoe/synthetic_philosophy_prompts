  I'm putting together an exam for my upper-level philosophy of action seminar and I need an essay prompt that gets into the weeds of sphexishness—like, the wasp loop and mechanical rigidity—but doesn't just ask students to parrot the Hofstadter example and declare that wasps lack free will. I want them to wrestle with whether sphexishness is all-or-nothing or a graded spectrum, and whether an agent that's mostly locked into fixed routines but has one narrow "escape hatch" (say, if the temperature hits exactly 30°C it can pick between two hard-wired sub-routines) counts as more free, or if that just pushes the rigidity one level up. The prompt should inject some niche framing—maybe ask them to compare this to reasons-responsiveness in Frankfurt-style hierarchies but where even the second-order volitions are sphexish—so they can't just regurgitate the standard compatibilist/incompatibilist script.

