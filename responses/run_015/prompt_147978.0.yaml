answer: |-
  Here are the four failures that most reliably corrupt this material when taught to the uninitiated. First, students equate "sympathy" with "pity" or "benevolence," turning Smith's descriptive mechanism of emotional mirroring into a prescriptive command to be nice; this destroys the explanatory power of the theory before it begins. Second, they treat the Impartial Spectator as a synonym for "conscience" or "God," missing that it is a cognitive tool constructed from social experience rather than a pre-installed moral module. Third, they collapse the distinction between *propriety* (the fitness of a passion to its cause) and *merit* (the desert of reward or punishment for an action), which makes it impossible to explain why we might condemn a well-intentioned failure or approve a lucky accident. Fourth, and most damaging for economics students, they assume the Spectator is merely an internalized poll of actual public opinion, which renders the theory incapable of criticizing mob rule or explaining moral courage.

  ***

  ### The Lesson Plan: Sympathy, Propriety, and the Constructed Spectator

  **1. The Order of Components**
  Your instinct is correct that sympathy must precede the spectator, but your suspicion about motivation is the critical dependency you are underestimating. If you introduce the Impartial Spectator (IS) immediately after sympathy, it indeed becomes "conscience in a wig"—an arbitrary judge with no reason to exist. The missing link is the **Desire for Mutual Sympathy**.

  The sequence must be:
  1.  **Sympathy (The Mechanism):** Establish that sympathy is not pity, but the imaginative act of placing oneself in another's situation to feel what they feel.
  2.  **The Desire for Mutual Sympathy (The Motivation):** Explain that we do not just want to feel; we want our feelings to *match* others'. We want to be "in tune." This is the engine. Without this, the IS has no work to do.
  3.  **Propriety (The Standard):** Define propriety as the concord between the spectator's feelings and the agent's feelings. If I feel grief and you feel grief, there is propriety. If I feel grief and you feel annoyance, there is impropriety.
  4.  **The Impartial Spectator (The Tool):** Only now introduce the IS. Since we crave mutual sympathy, but our actual spectators are biased (or absent), we construct an imaginary, well-informed, neutral observer to judge our passions *before* we express them.

  *Dependency Note:* You cannot explain *why* we consult the IS without step 2. You cannot explain *what* the IS looks for without step 3.

  **2. The Carrying Example: The Public Meltdown**
  Do not use the stranger in distress (too much pity, too little judgment), the heroic rescuer (too much agreement), or the criminal (too much condemnation). You need a case where the passion is intelligible but the expression is excessive.

  **The Case:** A CEO is forced to resign after a minor stock dip (5%). She goes on live television and weeps openly, then lashes out at the board.
  *   **Why this works:**
      *   *Sympathy:* We can enter into her humiliation and disappointment. We understand the passion.
      *   *Propriety:* We judge the *degree* of weeping and anger as unfitting to a 5% dip. We withdraw sympathy for the *expression* while understanding the *cause*.
      *   *Separation:* This separates the *fitness of the passion to the occasion* (Propriety) from the *desert of the person* (Merit). We might think she doesn't deserve to be fired (Merit), but still think her reaction is unprofessional (Propriety).
  *   **Board Work:** Draw two circles. Left: "The Cause" (5% dip). Right: "The Passion" (Weeping/Rage). Draw an arrow labeled "Sympathy." Ask: "Does the arrow bridge the gap?" When they say "No, it's too big," you have defined Propriety.
  *   **Why others fail:** The "Stranger in Distress" collapses sympathy and approval (we pity and approve). The "Hero" collapses them the other way. The Meltdown forces a wedge between understanding the feeling and approving the display.

  **3. Map of Misconceptions**
  Ranked by damage potential, with defusal points:

  1.  **Sympathy = Pity/Benevolence.** (Critical Damage).
      *   *Defuse:* Immediately, in the first five minutes. Use the CEO example: "We do not pity her; we are embarrassed by her. Yet we are using sympathy to judge her."
  2.  **IS = Actual Public Opinion (The Poll).** (High Damage).
      *   *Defuse:* When introducing the IS. Emphasize the word *Impartial*. "The actual public is partial; they are watching TV. The IS is who we imagine would watch if they knew the *whole* story."
  3.  **IS = Conscience/God.** (Medium Damage).
      *   *Defuse:* During the Closing Case. Show that the IS can be wrong or educated. It is a tool, not a voice.
  4.  **Self-Interest vs. Sympathy Contradiction.** (Low Damage for this session).
      *   *Defuse:* Only if raised. "Today we are analyzing the moral psychologist, not the economist. Assume both books are true and ask how they fit later."

  *   **Scaffolding Misconception (Allow Temporarily):** Allow the idea that **"The IS is just what society taught you."**
      *   *Why:* It helps them grasp the *origin* of the spectator (socialization).
      *   *Removal Point:* Just before the Closing Case. You must clarify that the IS is a *critique* of society, not a mirror. "If society is wrong, the IS corrects it by imagining a *better* informed viewer."

  **4. The Closing Case: The Bot Pile-On**
  **The Scenario:** A manager posts a nuanced take on LinkedIn. It is amplified by a bot network into a hate campaign. The manager feels intense shame and imagines "everyone" hates them.
  **Application:**
  *   *Sympathy:* The bots have no sentiments to mirror. You cannot sympathize with a bot. Therefore, they cannot be part of the sympathetic tribunal.
  *   *The IS:* The manager is consulting a *distorted* spectator (the imagined mob). The *true* IS asks: "What would a well-informed, neutral observer think of the post, ignoring the noise?"
  *   *Prerequisite:* For this to land, students must have grasped that the IS is a *construction of reason and imagination*, not a headcount of actual observers. If they think the IS is just "internalized society," the bots win (because society seems hostile). If they know the IS is "impartial and informed," the bots lose (because they are neither).
  *   *Revision:* If your ordering in (1) leaves the IS looking like "internalized social pressure," this case fails. You must ensure step 3 (Propriety) emphasizes *fitness to the cause*, not *popularity of the reaction*. The 5% dip (or the LinkedIn post) is the objective cause; the million bots do not change the objective cause.

  **5. The Check**
  Do not ask "What is the Impartial Spectator?"
  **The Task:** "You are the only human being left on earth. You find a stash of food and promise yourself you will ration it. You eat it all in one night. No one sees. No one ever knows. Do you feel shame? Why?"
  *   **Pass (Grasps Distinction):** "Yes, because I am viewing myself through the eyes of the Impartial Spectator I constructed when I lived among others. I am judging the propriety of my passion (gluttony) against the cause (hunger), even without an actual audience."
  *   **Fail (Vocabulary Only):** "No, because there is no society to internalize," or "Yes, because the Impartial Spectator is God/conscience."
  *   **Why:** This tests whether they understand the IS as a *habit of imagination* that persists without an actual crowd, distinguishing Smith from simple social conformity theory.

  **6. What to Decline**
  You will be asked about the "Adam Smith Problem" (the apparent contradiction between *The Theory of Moral Sentiments* and *The Wealth of Nations*).
  **The Boundary:** Do not attempt to reconcile the two books in 75 minutes. It is a historical rabbit hole that distracts from the moral psychology tool you are building.
  **The Sentence:** "That is a historical dispute about how two books fit together; today we are building a tool for how one mind works. We must master the tool before we can compare the manuals."
