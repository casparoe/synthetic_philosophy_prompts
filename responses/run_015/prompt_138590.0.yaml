answer: |-
  **Setup**

  Imagine a proposition $P$ concerning the fundamental status of some entity—for example, "The self exists intrinsically." Classical logic offers two truth values. The tetralemma expands this into four corners: (1) $P$ is true; (2) $P$ is false; (3) Both $P$ and not-$P$ are true; (4) Neither $P$ nor not-$P$ is true. In standard bivalent logic, corners three and four are impossible contradictions or tautologies. Nāgārjuna asserts all four are untenable. To understand why, you must treat these not as truth-functional claims about the world, but as exhaustive options for how the mind attempts to grasp reality.

  **The core move**

  The denial of all four corners is not a claim that reality is contradictory, nor that truth is inaccessible. It is a diagnosis of presupposition failure. Classical logic assumes that the subject term in a proposition refers to something with a definite, intrinsic identity capable of bearing predicates. If I say "The cat is on the mat," I assume "cat" refers to a discrete entity. Nāgārjuna argues that when we ask metaphysical questions about "the self," "the world," or "causality," we assume these terms refer to things with intrinsic natures—independent, self-defining essences.

  The tetralemma demonstrates that no predicate can coherently apply to such an essence. If the self had an intrinsic nature, it would be immutable. If immutable, it could not change states (like surviving death). If it lacks intrinsic nature, it is not the kind of thing that can "exist" or "not exist" in the absolute sense required by the question. The logic isn't breaking; the reference is failing.

  Think of it like dividing by zero. The operation isn't "false"; it's undefined because the operands lack the required properties. By denying all four corners, Nāgārjuna isn't saying "nothing is true." He is saying "nothing has the kind of intrinsic nature required to make these absolute claims true or false." The point is therapeutic: it forces you to abandon the search for intrinsic essences. Once you stop looking for independent entities, the contradiction dissolves. You are left with dependent arising—things existing only relative to causes, conditions, and concepts. The tetralemma clears the logical space of essentialism so functional reality can appear without metaphysical baggage. It shifts the burden from fixing the logic to fixing the ontology underlying the terms.

  **Why four and not two**

  If classical logic exhausts the space with $P$ and not-$P$, why enumerate four corners? Because the target isn't truth values; it's ontological commitment. The four corners represent the exhaustive list of ways a mind can reify a concept. Corner one is Realism (it exists inherently). Corner two is Nihilism (it does not exist inherently). Corner three is Contradictory Essentialism (it has conflicting inherent properties). Corner four is Agnostic Evasion (it is inherently unknowable).

  In a truth-functional system, corners three and four collapse. But as stances toward existence, they are distinct errors. A nihilist denies the entity; a realist affirms it; a skeptic refuses to choose. Nāgārjuna needs all four to block every escape route for essentialism. If he only denied $P$, you could retreat to not-$P$. If he denied both, you could claim the truth is a contradiction (both) or beyond logic (neither).

  The fourfold structure ensures that no conceptual position regarding intrinsic nature remains standing. It is a complete enumeration of possible metaphysical attitudes, not logical values. By rejecting all four, he shows that the entire framework of "intrinsic existence" is the error, not any specific answer within that framework. The quadruple denial is necessary to exhaust the ways we try to hold onto "stuff" that isn't there.

  **The two-register worry**

  You worry that distinguishing "intrinsic" from "conventional" truth is a dodge—denying the hard claims while keeping the soft ones. It would be a dodge if "ultimate truth" were a competing theory. It isn't. The two registers are not parallel descriptions of the same object. Conventional truth describes how things function dependently. Ultimate truth is the recognition that there is no additional "intrinsic" layer underneath that function.

  Consider a chess game. Conventionally, the knight moves in an L-shape. Ultimately, there is no "knightness" in the wood; there is only wood and rules. Denying the knight's intrinsic nature doesn't invalidate the game; it validates it by showing you don't need magic wood to play. The tetralemma denies the magic wood (intrinsic nature) while preserving the game (conventional function).

  This isn't equivocation because the levels don't compete. Ultimate truth is simply the emptiness of intrinsic nature in conventional phenomena. If you treat ultimate truth as a separate realm of "real" truths, you've reified emptiness. The point is that conventional reality is all there is, provided you stop demanding it be grounded in something independent. The denial targets the demand, not the phenomenon. Thus, the tetralemma isn't theater; it's a boundary marker showing where explanation stops because the question presupposed a ghost in the machine.

  **The grocery-list test**

  Does this apply to milk in the fridge? Ontologically, yes. Pragmatically, no. The milk lacks intrinsic nature just as much as the self does. It exists dependently on cows, cartons, and concepts. However, nobody suffers because they believe the milk has a soul. The tetralemma applies universally to all phenomena, but it is only deployed where reification causes distress.

  We cling to the "self" as intrinsic; we don't cling to "milk" as intrinsic. The logic is the same, but the urgency differs. If you asked whether the milk survives being drunk, the tetralemma would still deny all four corners regarding the milk's intrinsic survival. But since you don't build your identity around the milk's eternal essence, the denial feels trivial. The test shows that emptiness isn't a special spiritual property; it's the actual status of all things. The difference lies in where we project solidity, not in where solidity actually exists.

  **The fifth corner**

  Is the denial of all four a fifth position? If you treat "emptiness" as a true description of reality, yes. That is why the system must be self-consuming. The claim "all things are empty" must itself be empty. If you hold onto emptiness as a final truth, you have reified it into a new essence.

  This is the self-consuming option. The tetralemma is a ladder kicked away after climbing. It idles if you treat it as a doctrine; it consumes itself if used as a tool. Nāgārjuna insists that emptiness is not a view. It is the relief from holding views. If the denial of the four corners becomes a fifth corner, you have missed the point. The logic must dissolve its own footprint to prevent you from replacing "intrinsic nature" with "intrinsic emptiness."

  **What to cut**

  Drop any suggestion that this leads to a mystical experience beyond logic. Drop the idea that conventional truth is "illusion" in the sense of being useless. Drop historical debates about which texts say what. Keep the focus strictly on the incoherence of intrinsic nature. If you frame this as "logic breaking," you invite mysticism. Frame it as "logic revealing category errors," and you keep the skeptics on board.
