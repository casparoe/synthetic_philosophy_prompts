      *   *Legal variations:* Mention that laws vary by jurisdiction, but the whole-brain standard is dominant.
      *   *Make sure to mention the UDDA (Uniform Determination of Death Act)* as it's the US standard.

  7.  **Final Polish:** (Reviewing against the generated output)
