  2. Objection: You are conflating the materiality of water rights with the discursive nature of Roman jurisprudence, which operated on distinct logical registers. Reply: Legal discourse adapts to material constraints over centuries, even if individual jurists ignored them in specific rulings. Weak Point: You lack evidence of jurists actually referencing irrigation needs rather than abstract precedent.

  3. Objection: By prioritizing irrigation regimes, you render peasant resistance and adaptive agency invisible beneath environmental determinism. Reply: Agency exists within ecological limits; peasants negotiated water access, but couldn't legislate rainfall or aquifer depth. Weak Point: It's difficult to prove negotiation when your primary evidence is static geography rather than dynamic social conflict.

  4. Objection: Reviving Braudel ignores why geography fell out of fashion; you're proposing a spatial fix that denies human co-constitution of the landscape. Reply: I argue for a reciprocal relationship where geography shapes law, but legal structures also maintain irrigation systems over time. Weak Point: Your model leans heavily on geography shaping law, making the reciprocity claim look like an afterthought to appease critics.

  5. Objection: Do you possess actual paleohydrological data for these regimes, or is this geographic determinism a cover for avoiding the archives? Reply: I correlate existing regional hydrological studies with property patterns, supplementing gaps with legal texts where data is silent. Weak Point: You are relying on secondary hydrological studies rather than generating new data, leaving the causal link between specific water flows and specific laws speculative.
