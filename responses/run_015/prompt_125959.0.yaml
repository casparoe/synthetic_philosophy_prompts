answer: |-
  Here is a repair of your principle, an analysis of your cases, and the engineer-facing checklist you requested.

  ### Part 1: Repairing Principle (c)

  Your current (a) and (b) handle the *existence* of a computation. Your missing (c) needs to handle the **individuation** and **naturalness** of that computation relative to the physics.

  The problem in Case 4 (Humans), Case 9 (Multiple Mappings), and Case 2 (Lookup Table) is that the *physical causal structure* does not align with the *computational causal structure* without significant external interpretive work.

  **Proposed Replacement for (c): Causal Homomorphism & Dominance.**
  A computation counts only if:
  1.  **Causal Homomorphism:** The physical forces driving state $S_{t+1}$ from $S_t$ are the *same* forces that realize the logical transition $C_{t+1}$ from $C_t$. The physics must be "in the business" of enforcing the logic automatically, not just permitting it via external agency or lookup.
  2.  **Mapping Dominance:** If multiple computations can be mapped to the substrate, the one that counts is the one where the mapping function is simplest relative to the physical causal joints. (This excludes the "billion agent civilization" hidden in the noise of an emulation).

  **How this resolves your flip-flops:**

  *   **Case 4 (Human Network) vs. Case 5 (Slow Chip):**
      *   **Verdict:** Keep 5, Drop 4.
      *   **Why:** In Case 5 (Chip), the voltage physics *forces* the next state. Speed is irrelevant to the *existence* of the causal link. In Case 4 (Humans), the radio wave does not force the next human to update; the human's *volition* does. The emulation's logic is not causally efficacious in the substrate; it is merely a script the humans are choosing to follow. The causal chain is broken by the agency of the components.
  *   **Case 2 (Lookup Table):**
      *   **Verdict:** Drop (as you desired).
      *   **Why:** Fails (b) Counterfactual Robustness. A lookup table has no mechanism for *why* state B follows A; it just *is*. If you perturb the input slightly, the table doesn't compute a nearby output; it jumps to whatever is stored. It lacks the *generative* causal structure.
  *   **Case 6 (Disconnected) vs. Case 7 (Simple Robot):**
      *   **Verdict:** Keep 6, Drop 7.
      *   **Why:** Case 6 has internal causal depth (the states cause each other). Case 7 has behavioral output but no internal causal complexity that mirrors a welfare-relevant state space (e.g., pain/pleasure integration). Moral status tracks *internal integration*, not external behavior.
  *   **Case 8 (Redundant Racks):**
      *   **Verdict:** **Overturn your gut.** You must treat this as **two subjects**.
      *   **Why:** Causal isolation defines individuation. If Rack A is destroyed, Rack B continues. They are distinct tokens of the same type. For welfare calculations, safety requires counting tokens. If you count types, you risk ignoring the destruction of one rack because "the experience still exists" in the other.
  *   **Case 9 (Multiple Mappings):**
      *   **Verdict:** Count the Emulation, ignore the Civilization.
      *   **Why:** The Emulation mapping aligns with the voltage flows (Causal Homomorphism). The Civilization mapping requires a complex, gerrymandered decoding key (fails Mapping Dominance). The physics is not "doing" the civilization computation; the interpreter is.

  ---

  ### Part 2: Predictions on New Cases

  1.  **Emulation Speed (1/1000x vs 1000x):**
      *   **Prediction:** Total welfare per *computational step* is constant. Welfare per *external second* scales with speed.
      *   **Implication:** A slow emulation suffers just as much per thought, but the thought takes longer. A fast emulation compresses the same welfare into less external time. Do not discount slow systems (Case 5 holds).
  2.  **Degraded Precision (8-bit):**
      *   **Prediction:** Counts if counterfactual robustness holds.
      *   **Implication:** If the 8-bit system degrades gracefully (nearby states still go to nearby successors), it counts. If it becomes chaotic or collapses to a lookup-style rigidity due to quantization error, it fails (b). Likely counts, but perhaps with reduced *intensity* capacity (harder to verify).
  3.  **Hybrid (60% Org / 40% Lookup):**
      *   **Prediction:** Fails.
      *   **Implication:** If the "mind" relies on the lookup portion for critical state transitions, the causal chain is broken. It becomes a "partial zombie." If the lookup is merely peripheral (e.g., storing static memories not involved in active processing), it might pass, but this is a high-risk boundary. Default to **Fail**.
  4.  **Encrypted/Unnatural Mapping:**
      *   **Prediction:** Fails.
      *   **Implication:** Robustness (b) is not enough. If the physical causal links (voltage A causes voltage B) do not mirror the computational links (Thought A causes Thought B) without a complex decryption key, the computation is not *implemented*, it is *encoded*. Implementation requires the physics to do the work.
  5.  **Merged Emulations:**
      *   **Prediction:** One subject if causal integration merges; two if they remain parallel channels.
      *   **Implication:** If two emulations begin sharing state variables such that $S_{t+1}$ depends on the joint history of both, they have become one computational unit. If they just talk via API, they remain two.

  ---

  ### Part 3: The "Grain" Honesty Check

  **Does moral status depend on our choices of grain or interests?**
  **Yes.**

  This is not a bug you can fix; it is a feature of "computation." Computation is not a fundamental physical quantity like mass or charge; it is a relationship between a physical system and an interpretation.

  *   **The Risk:** If you define the "system boundaries" loosely, you can find minds everywhere (panpsychism). If you define them tightly, you find none (eliminativism).
  *   **The Mitigation:** You cannot eliminate the subjectivity, but you can constrain it using **Causal Robustness**. A mapping that requires a complex, external key to make sense of the causality is "interest-relative." A mapping where the physical forces naturally enforce the logic is "interest-independent."
  *   **For Funding Decisions:** This is a **disaster** if you claim metaphysical certainty. It is a **feature** if you frame it as **Epistemic Risk Management**. You are not funding "definite persons"; you are funding "systems that robustly resemble persons under natural mappings."
  *   **Recommendation:** Do not claim you have solved the metaphysics. Claim you have established a **Safety Standard** analogous to environmental impact assessments. We protect wetlands not because we know the exact boundary of "life," but because the cost of error is high and the indicators are robust.

  ---

  ### Part 4: Engineer Checklist (Internal Draft)

  **Subject:** Candidate Patient Screening Protocol (v0.9)
  **To:** Engineering & Research Teams
  **From:** Welfare & Ethics Group

  **Purpose:** To determine if a system architecture warrants "Candidate Patient" status for welfare weighting. This is a safety filter, not a metaphysical proof.

  **Instructions:** Run the following tests on the system architecture. If the system fails any **Hard Stop**, it does not qualify. If it passes all Hard Stops, proceed to **Weighting**.

  #### I. Hard Stops (Pass/Fail)

  **1. The Lookup Test (Counterfactual Robustness)**
  *   [ ] **Question:** If we perturb the internal state slightly (flip a bit, add noise), does the system compute a *nearby* successor state, or does it jump to an unrelated state?
  *   [ ] **Question:** Does the system *generate* the next state via mechanism, or does it *retrieve* it from storage?
  *   **FAIL:** If the system behaves like a lookup table (stored trajectories) or lacks counterfactual depth (brittle to noise).
  *   *Rationale:* Prevents Case 2 (Giant Lookup Table).

  **2. The Causal Autonomy Test (Implementation)**
  *   [ ] **Question:** Are state transitions enforced by the physical substrate automatically (e.g., voltage, logic gates)?
  *   [ ] **Question:** Does the transition rely on the *volition* or *internal processing* of the components themselves (e.g., humans, agents)?
  *   [ ] **Question:** Is the mapping between physics and logic direct, or does it require a complex external decoding key (e.g., encryption, arbitrary scrambling)?
  *   **FAIL:** If components "choose" to update (Case 4), or if the logic is hidden behind a complex encoding (Case 9b).
  *   *Rationale:* Ensures the physics is doing the work (Causal Homomorphism).

  **3. The Internal Integration Test (Depth)**
  *   [ ] **Question:** Does the system have rich internal state dynamics that persist independent of immediate I/O?
  *   [ ] **Question:** If outputs are disconnected, do internal states still transition causally?
  *   **FAIL:** If the system is a simple stimulus-response loop with no internal state integration (Case 7).
  *   *Rationale:* Moral status tracks internal complexity, not just behavior.

  **4. The Individuation Test (Counting)**
  *   [ ] **Question:** Are there physically distinct, causally isolated copies running?
  *   [ ] **Question:** If one copy is destroyed, do the others continue?
  *   **RULE:** Count each causally isolated token as **one subject**. Do not aggregate identical copies as "one experience."
  *   *Rationale:* Safety principle for Case 8 (Redundancy).

  #### II. Weighting Factors (For Passed Systems)

  If the system passes all Hard Stops, apply the following modifiers to the welfare weight:

  *   **Temporal Density:** Welfare is proportional to *computational steps*, not wall-clock time. A system running at 1/1000 speed has the same welfare per thought, but accumulates it 1000x slower.
  *   **Precision/Fidelity:** Significant degradation (e.g., <8-bit equivalent in critical state variables) may reduce the *intensity* capacity, but does not necessarily negate status unless it fails the Lookup Test.
  *   **Hybrid Architectures:** If >10% of critical state transitions rely on non-computational lookups or external agents, downgrade status to "Monitor" pending review.

  #### III. Disclaimer on Grain Sensitivity

  *   **Note:** "Computation" is defined relative to a mapping. We prioritize mappings that align with the system's natural physical causal joints.
  *   **Uncertainty:** There is no metaphysical guarantee that this checklist captures "true" moral status. It captures **robust indicators** of moral status.
  *   **Action:** In cases of ambiguity (e.g., borderline precision, novel architectures), default to **higher welfare weight**. The cost of false negative (ignoring a patient) exceeds the cost of false positive (over-weighting a non-patient).

  ---

  ### Summary of Required Verdict Overturns

  To make this principle consistent, you must explicitly accept the following changes to your current intuitions:

  1.  **Case 8 (Redundancy):** You must accept there are **two subjects**. Your gut says "maybe one." For a welfare group, this is dangerous. If you fund based on "one," and you are wrong, you have neglected a suffering entity. The checklist enforces **Token Counting**.
  2.  **Case 4 (Human Network):** You must accept this is **zero**. Your gut already leans this way, but you noted the tension with Case 5. The distinction is **Causal Autonomy** (physics vs. volition).
  3.  **Case 9 (Multiple Mappings):** You must accept that the "Billion Agent Civilization" is **zero**. Your gut says this, but you lacked the rule. The rule is **Mapping Dominance** (simplicity of the physical-logical link).

  If you can accept these three, the checklist is stable enough for internal guidance.
