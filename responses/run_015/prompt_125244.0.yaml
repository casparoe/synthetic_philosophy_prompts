answer: |-
  # Taxonomy of Social Construction: A Decision Tree

  This decision tree sorts philosophical positions on social kinds (race, gender, money) by their ontological commitments. Follow the branches from the root diagnostic case through the three subsequent questions to arrive at a specific theoretical position. Nodes marked **[UNOCCUPIED]** indicate logical combinations that lack a stable defence in the literature; those marked **[INCOHERENT]** imply a contradiction in terms.

  ### **ROOT NODE: The Defunct Banknote**
  *Case:* A physical banknote from a sovereign state that dissolved thirty years ago. It has no legal tender status and circulates only among collectors.
  *Question:* Is it still money?

  *   **BRANCH A: NO.** (The status function has vanished; it is now merely paper or a historical artefact.)
      *   **QUESTION 1:** Does sustaining the kind require explicit collective agreement (institutional acceptance), or can distributed practices do the work alone?
          *   **Path A.1: Explicit Collective Agreement.** (Status requires active institutional recognition.)
              *   **QUESTION 2:** Does being classified in the kind create feedback loops that change members' properties or behaviour?
                  *   **Path A.1.i: NO.** (Classification tracks status but does not alter the underlying reality.)
                      *   **QUESTION 3:** Do biological correlates play any causal role in the kind's social function?
                          *   **Path A.1.i.α: NO.**
                              *   **POSITION:** **Institutional Realism** (e.g., Searlean ontology).
                              *   **Awkward Commitment:** The banknote becomes ontologically identical to a printed souvenir the instant the state dissolves, regardless of how collectors continue to trade it.
                          *   **Path A.1.i.β: YES.**
                              *   **POSITION:** **Biological Institutionalism**.
                              *   **Awkward Commitment:** Gendered institutions are grounded in biology, yet the defunct banknote proves that without institutions, biological markers alone cannot sustain economic kinds.
                  *   **Path A.1.ii: YES.** (Classification alters the reality of the kind.)
                      *   **QUESTION 3:** Do biological correlates play any causal role in the kind's social function?
                          *   **Path A.1.ii.α: NO.**
                              *   **POSITION:** **Interactive Constructionism** (e.g., Hackingian looping).
                              *   **Awkward Commitment:** If we ceased to classify 'teenagers' as a distinct group, the behavioural patterns defining adolescence would ostensibly vanish.
                          *   **Path A.1.ii.β: YES.**
                              *   **POSITION:** **[UNOCCUPIED]**.
                              *   **Note:** This combination is **unexplored**; it is difficult to maintain that explicit institutional agreement is required while simultaneously arguing that biology plays a causal role independent of that agreement.
          *   **Path A.2: Distributed Practices.** (Status emerges from habit, custom, or implicit social labour without central decree.)
              *   **QUESTION 2:** Does being classified in the kind create feedback loops that change members' properties or behaviour?
                  *   **Path A.2.i: NO.**
                      *   **QUESTION 3:** Do biological correlates play any causal role in the kind's social function?
                          *   **Path A.2.i.α: NO.**
                              *   **POSITION:** **[UNOCCUPIED]**.
                              *   **Note:** This gap appears **incoherent**; if distributed practices sustain the kind but create no feedback loops, it is unclear how the kind differs from a natural kind or a mere illusion.
                          *   **Path A.2.i.β: YES.**
                              *   **POSITION:** **[UNOCCUPIED]**.
                              *   **Note:** This gap is **unexplored**; it suggests a tacit naturalism that denies the interactive power of social classification.
                  *   **Path A.2.ii: YES.**
                      *   **QUESTION 3:** Do biological correlates play any causal role in the kind's social function?
                          *   **Path A.2.ii.α: NO.**
                              *   **POSITION:** **Critical Structuralism** (e.g., Haslangerian amelioration).
                              *   **Awkward Commitment:** Race is real as a social structure, yet two individuals with identical ancestry could belong to different racial kinds depending on their social positioning.
                          *   **Path A.2.ii.β: YES.**
                              *   **POSITION:** **Bio-Social Structuralism**.
                              *   **Awkward Commitment:** Biological traits causally contribute to social oppression, risking the naturalisation of the very hierarchies the theory seeks to critique.

  *   **BRANCH B: YES.** (The status persists through history, materiality, or niche practice despite institutional death.)
      *   **QUESTION 1:** Does sustaining the kind require explicit collective agreement, or can distributed practices do the work alone?
          *   **Path B.1: Explicit Collective Agreement.**
              *   **POSITION:** **[INCOHERENT]**.
              *   **Note:** Without a sovereign state or institution, there is no agent capable of forming the explicit agreement required to sustain the money's status.
          *   **Path B.2: Distributed Practices.**
              *   **QUESTION 2:** Does being classified in the kind create feedback loops that change members' properties or behaviour?
                  *   **Path B.2.i: NO.**
                      *   **POSITION:** **[UNOCCUPIED]**.
                      *   **Note:** This gap is **incoherent**; if the banknote is still money via practice, that practice must influence how agents behave towards it (e.g., exchanging it).
                  *   **Path B.2.ii: YES.**
                      *   **QUESTION 3:** Do biological correlates play any causal role in the kind's social function?
                          *   **Path B.2.ii.α: NO.**
                              *   **POSITION:** **Pragmatist Constructionism**.
                              *   **Awkward Commitment:** The defunct banknote is money because it works in a niche, implying that 'woman' or 'Black' could similarly persist as kinds even if all legal recognitions were abolished.
                          *   **Path B.2.ii.β: YES.**
                              *   **POSITION:** **Pluralist Naturalism**.
                              *   **Awkward Commitment:** There is no fact of the matter on whether a specific hormone profile constitutes 'female' outside of a specific contextual framework.

  ***

  ### **Summary of Unoccupied and Problematic Spaces**

  The following logical combinations within the tree remain empty. Their status indicates whether the gap results from a lack of philosophical imagination or a fundamental tension in the concepts.

  1.  **Banknote YES + Explicit Agreement:** Marked **[INCOHERENT]**. This position collapses because 'explicit agreement' regarding status functions presupposes an institutional framework, which the case stipulates is dissolved.
  2.  **Banknote NO + Distributed Practice + No Feedback:** Marked **[UNOCCUPIED/INCOHERENT]**. This combination is unstable because distributed practices generally sustain kinds *by* regulating behaviour; denying feedback loops removes the mechanism by which the practice sustains the kind.
  3.  **Banknote YES + No Feedback:** Marked **[UNOCCUPIED/INCOHERENT]**. If the banknote is still money, it must function as a medium of exchange or store of value; denying feedback loops denies that agents treat it differently from non-money, negating its status as money.
  4.  **Explicit Agreement + Feedback Loops + Biological Causal Role:** Marked **[UNOCCUPIED/UNEXPLORED]**. While not logically impossible, this position is rare. It requires arguing that institutions explicitly agree on kinds that are simultaneously biologically causal yet interactive. Most theorists choose either the institutional/biological route (Naturalism) or the institutional/interactive route (Constructionism) to avoid reductionism.
  5.  **Distributed Practice + No Feedback + Biological Causal Role:** Marked **[UNOCCUPIED/UNEXPLORED]**. This suggests a tacit naturalism where biology does the work, but social practice is credited with the kind's existence. It is an unstable middle ground that usually resolves into hard Naturalism.
