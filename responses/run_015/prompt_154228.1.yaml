      *   **Constraint 1 (Format):** Plan the *explanatory architecture*, not the explanation itself. Sequence, dependencies, misconception map, analogy, assessment, bracketing.
      *   **Constraint 2 (Analogy):** Must avoid "software/hardware" (functionalism). Needs to show contingent substrate destruction $\neq$ formal essence destruction.
      *   **Constraint 3 (Misconceptions):** Intercept Cartesian dualism, empirical unfalsifiability charge, and misuse of Incompleteness Theorems.
      *   **Constraint 4 (Assessment):** Distinguish grasp of modal structure vs. vague reassurance.
      *   **Constraint 5 (Bracketing):** Explicitly exclude manuscripts, neuroscience, theology, framed as discipline.
      *   **Time:** 90 minutes.

  2.  **Deconstruct the Argumentative Structure:**
      *   To get to "Survival," we need "Essence."
      *   To get to "Essence," we need "Modality" (Necessity vs. Contingency).
      *   To get to "Modality," we need to clear the ground of "Empiricism/Psychology."
      *   To get to "Gödel," we need to separate him from "Incompleteness."
      *   *Dependency:* Modal Logic tools $\rightarrow$ Ontological Framework $\rightarrow$ Individual Essence $\rightarrow$ Survival Conclusion.

  3.  **Develop the Analogy:**
      *   *Requirement:* Contingent substrate vs. Formal essence. No software/hardware.
      *   *Idea 1:* A musical score vs. a performance. (Good, but performance is temporal, might confuse "death").
      *   *Idea 2:* A mathematical proof vs. the ink on the page. (Strong, fits Gödel, but might feel too abstract).
      *   *Idea 3:* A geometric theorem vs. the chalkboard. (Similar to proof).
      *   *Idea 4:* A specific trajectory in a phase space vs. the physical object tracing it.
      *   *Selection:* **The Musical Score vs. The Performance.**
          *   *Why:* It captures *individuality* (this specific symphony), *structure* (the notes/relations), and *contingency* (the orchestra, the hall, the recording medium can be destroyed, but the score remains defined). It avoids functionalism because the score isn't "running" the orchestra; the orchestra *instantiates* the score. If the orchestra dies, the score's logical structure remains valid/defined in the space of possible music.
          *   *Refinement:* Let's make it more precise to fit "Individual Essence." A *specific* variation in a theme. Let's go with **The Architectural Blueprint vs. The Building.**
          *   *Wait, Blueprint/Building is too static.*
          *   *Let's try: A Specific Solution to an Equation vs. The Chalk it's Written On.*
          *   *Better:* **The Melodic Line vs. The Instrument.** If the violin smashes, the melodic line (as a sequence of intervals) is not destroyed, it is just no longer instantiated. But is it *surviving*?
