      *   *Phase 3: The Ontological Anchor.* Gödel's Necessary Being (briefly, as the ground for essences). (30-45 mins)
      *   *Phase 4: Individual Essence.* Leibnizian Concept. (45-60 mins)
      *   *Phase 5: The Analogy.* Apply the analogy to bridge Essence to Survival. (60-75 mins)
      *   *Phase 6: Assessment & Bracketing.* (75-90 mins)

