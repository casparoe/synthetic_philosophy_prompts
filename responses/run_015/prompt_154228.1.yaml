              *   *Final Decision:* **The Architectural Plan vs. The Scaffold.** The scaffold holds it up temporarily. If the scaffold falls, the Plan (as a coherent structure) remains a coherent structure in the realm of possibilities/necessities.
              *   *Actually, the strongest non-functionalist analogy for "Essence vs. Substrate" that fits Gödel/Leibniz is:* **The Number vs. The Numeral.** The number 7 is not the ink "7". Destroying the ink doesn't destroy 7. The "Self" is a unique number (individual essence); the "Body" is the numeral written in sand.
              *   *Problem:* Numbers aren't "thinking subjects."
