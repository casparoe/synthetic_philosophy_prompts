answer: |-
  1. The blameless post-mortem practice presupposes a holistic view of social causation where failures emerge from complex system interactions rather than individual actions. It assumes that attributing fault to a person obscures the structural conditions that made the error possible.

  2. Conversely, the individual scoring and review practices presuppose methodological individualism, treating engineers as autonomous agents whose specific choices directly determine outcomes. This framework assumes that performance metrics like defect rates accurately reflect individual competence rather than systemic variance.

  3. These two views cannot coexist coherently as ontological claims, indicating the organization is quietly making a split between causal explanation and operational accountability. The company treats systems as the cause of errors but individuals as the necessary agents for implementing fixes.

  4. This practice is underdetermined because pragmatic instrumentalism could license both approaches as useful tools for different goals rather than true descriptions of reality. A functionalist perspective might also argue that contradictory models are necessary to satisfy both psychological safety and economic incentive structures.

  5. If the company followed through on the holistic view, it would need to abolish individual defect rates and shift performance reviews to evaluate team-based systemic improvements. Ownership of action items would be assigned to roles or squads rather than named individuals to align accountability with the stated theory of causation.
