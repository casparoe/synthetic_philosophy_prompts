  **Outline of the Tension**

  Thomas Hobbes's geometric philosophy rests on a materialist constructivism: geometry is the only truly certain science because its objects are not discovered in nature but generated by the mind through the phantasm of motion. For Hobbes, truth is *factum* (made); a geometric figure exists only insofar as the geometer defines and constructs it through bodily motion. Consequently, demonstration must begin from definitions stipulated by the constructor, not from axioms assumed to exist independently. However, this claim of absolute epistemic control clashes violently with Hobbes's decades-long, public failure to square the circle. Despite insisting that his method of comparing motions yielded a solution, contemporaries like John Wallis demonstrated fatal errors in his proofs. The tension lies here: if geometry is certain because we create its objects, why does the circle resist this specific construction? The failure suggests either a limit in the constructive method (motion cannot capture curvature perfectly) or a limit in the object (the circle possesses a nature exceeding straight-line measurement), undermining Hobbes's claim that geometric truth is entirely subordinate to human generation.

  ***

  **Villanelle of the Constructed Line**

  I draw the line; the way is well prepared.
  No phantom shape exists until I sight.
  Yet still the circle remains unsquared.

  Truth is a construct by the mind upreared.
  The curve submits to reason's rigid light.
  I draw the line; the way is well prepared.

  No shape has being till its cause is stirred.
  What is not made possesses no true right.
  Yet still the circle remains unsquared.

  I trace the arc until the end is neared.
  Yet shadows lengthen in the midday bright.
  I draw the line; the way is well prepared.

  The world is body; nothing is spared.
  Save what I build within my reasoning might.
  Yet still the circle remains unsquared.

  Is fault in hand or in the nature shared?
  Or in the curve that holds its secret tight?
  I draw the line; the way is well prepared.
  Yet still the circle remains unsquared.
