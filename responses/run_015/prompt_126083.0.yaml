answer: |-
  You are right to be annoyed, and you are also right that the reason you got nowhere is because you were not actually having the same argument. Your diagnosis of the situation is remarkably sharp, and I think you have identified the core structural reasons why this debate has been cycling through the social sciences for a century without resolution. The verbal ambiguity is real, as is the clash between hermeneutic and econometric goals, but I suspect the measurement problem is doing the heaviest lifting here. When your friend says culture is a residual, he is treating it as a variable that failed to be specified, whereas you are treating it as a mechanism that is being misidentified. The reason neither of you moved is that you are both correct about the data limitations but drawing different metaphysical conclusions from them. However, I think there is a fourth thing tangled in here that you missed, which is the problem of endogeneity and co-constitution. It is not just that we measure culture poorly, but that culture and institutions produce each other over time. If Protestantism encouraged literacy which encouraged capitalism, it also encouraged political institutions that protected property rights, which then reinforced the culture. Trying to separate them into distinct causal buckets is like trying to separate the wetness from the water.

  Regarding your two proposed tests, they are clever and they do map onto existing literature, but I am afraid they also collapse back into the joint test problem you identified. The carry-on test, which looks at whether effects migrate with people rather than places, is essentially the epidemiological approach used by researchers like Raquel Fernandez. It helps isolate culture from the current institutional environment, but it does not solve the proxy problem. If you measure the migrant as Protestant based on denomination rather than belief intensity, you are still testing a category marker. Furthermore, migrants bring human capital and networks with them, so finding an effect could still be your friend's literacy and social capital mechanism rather than a values mechanism. The blocked-expression test is similarly vulnerable. If the effect shrinks when institutions block accumulation, it suggests culture needs institutional permission to operate, which sounds like a win for the interactionist view. But your friend could simply argue that the culture never existed in the first place, and that the apparent effect in permissive settings was just the institutional setting allowing human capital to pay off. Both tests improve identification slightly, but they cannot distinguish between a value causing an action and a community marker correlating with unobserved resources unless you have direct measures of the beliefs themselves, which history rarely gives us.

  There is a deeper issue here about what would actually end the debate, and I am going to be honest with you that nothing will. You asked if a dataset, a natural experiment, or a conceptual distinction could close this, and the answer is that the question itself is badly posed. Culture is not a cause in the same way that rain is a cause of crop failure. It is a medium through which causes operate. When you ask if culture can be a cause, you are asking for a variable isolation that the phenomenon does not permit. The debate persists because it serves a functional role for the participants. For the institutionalists, dismissing culture as a residual protects the parsimony of their models. For the culturalists, insisting on its causal power protects the meaningfulness of human agency against structural determinism. Neither side will surrender because the stakes are not just empirical but ontological. If culture is just a residual, then history is a machine. If institutions are just a bucket for unexplained culture, then history is a story. You cannot settle that with regression.

  My advice is to take your own intuition about dissolving the question seriously. The productive path forward is not to prove that culture is a cause distinct from institutions, but to map the mechanisms by which shared meanings interact with constraints. Stop trying to win the argument about whether the Protestant Ethic caused capitalism and start asking how specific theological doctrines altered the cost-benefit analysis of specific economic behaviors in specific contexts. That moves you from a metaphysical fight about buckets to a historical investigation about processes. You should not go home, but you should stop trying to crack the nut of culture versus institutions as if it were a binary switch. It is a spectrum of mutual constitution. Your friend wants a clean identification strategy, and you want a rich explanation of meaning. You will never satisfy both with one model. Write the paper that admits the joint test problem, uses your carry-on logic as a way to bound the uncertainty rather than solve it, and argues that the mechanism is likely a mix of literacy and values that evolved together. That will not end the debate, but it will allow you to stop having the same argument with your friend and start having a new one.
