      *   **Topic:** The Knobe Effect (Side-Effect Effect).
      *   **Problem:** Students know the basic vignette (Chairman/Harm/Help) and the basic asymmetry. They struggle with *why* it happens (normative concepts vs. artifact of wording vs. counterfactual dependence).
      *   **Specific Constraint:** The user wants an essay question (45 mins, 25 marks) that forces students to engage with *explanatory theories* rather than just describing the effect.
      *   **User's Cases:** The user provided four potential vignettes to test the theories:
          1.  Non-moral rule violation (Playlist/Admin rule).
          2.  Omission/Inaction (Chairman cancels program).
          3.  Non-human agent (Scheduling algorithm).
          4.  (Optional) Good side effect, agent hates it.
      *   **Requirements:**
          *   Fix/improve the cases if necessary.
          *   Model Answer (600-700 words).
          *   Marking Scheme (distinguishing A vs. B vs. C, specifically penalizing surface-level "moral bias" answers).
          *   No citations/names (closed book).
          *   Don't re-explain the basic Knobe effect (assume knowledge).

  2.  **Evaluate and Refine the Cases:**
      *   *Case 1 (Non-moral rule):* This is a classic test for the "Moral Valence" hypothesis vs. "Normative" hypothesis. If people say "intentionally broke the rule" even though it's not *moral*, it suggests the concept tracks *normativity* broadly, not just morality. *Verdict:* Keep, but ensure the rule is clearly arbitrary/conventional to distinguish from moral norms.
      *   *Case 2 (Omission):* This tests the "Doing vs. Allowing" distinction. If the asymmetry holds for omissions, it suggests the effect isn't just about physical causation. *Verdict:* Keep, but clarify the "doesn't care" attitude to match the original Chairman case.
      *   *Case 3 (Algorithm):* This is the strongest test for "Blame/Praise" vs. "Conceptual Structure." You can't blame an algorithm morally in the same way. If people attribute intentionality to the *programmers* via the algorithm, it tests the "Reasons/Attitudes" view. If they attribute it to the *algorithm*, it tests folk psychology of AI. *Refinement:* Focus on the programmers' intentionality *through* the algorithm to keep it comparable to the Chairman case.
      *   *Case 4 (Good effect, agent hates it):* This is the "Counterfactual" test. If the agent actively tries to prevent the good outcome but fails, yet the outcome happens, do we call it intentional? This probes the "Volition" requirement. *Decision:* Let's integrate this into the prompt as a specific comparison point rather than a separate vignette to save space and increase density.

      *Selection:* I will use the Non-Moral Rule (Case 1) and the Algorithm (Case 3) as the core comparison, as they best separate "Moral Blame" explanations from "Normative Expectation" or "Deep Structure" explanations. The Omission case is good but might clutter a 45-minute essay. I'll stick to the two strongest discriminators.

  3.  **Drafting the Question:**
      *   Needs to be direct.
      *   Needs to present the cases clearly but concisely.
      *   Needs to ask for a theoretical evaluation, not just a prediction.
      *   *Prompt Idea:* Present the two cases. Ask the student to predict the folk intuition for each. Then ask them to explain *which theoretical account* survives these tests and which fails. Specifically target the "Moral Blame" vs. "Normative Concept" debate.

  4.  **Drafting the Model Answer:**
      *   *Goal:* 600-700 words. High distinction level.
      *   *Structure:*
          1.  Brief acknowledgment of the standard effect (1 sentence).
          2.  Analysis of Case 1 (Non-moral norm): Predictions and implications.
          3.  Analysis of Case 3 (Algorithm): Predictions and implications.
          4.  Synthesis: What this tells us about the concept of "Intentional" (Normative vs. Moral vs. Cognitive).
          5.  Addressing the Counterfactual/Attitude issue (the user's specific "brain break").
      *   *Key Argument:* The "Moral Blame" theory (people just mean 'blameworthy') fails if the effect appears in non-moral contexts. The "Normative" theory (intentionality tracks deviation from norms) fits better. The "Deep Structure" theory (intentionality requires specific desire) fails the standard Knobe case but might survive the Algorithm case.
      *   *Tone:* Academic, precise, no citations.

  5.  **Drafting the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *Breakdown:*
          *   Case Analysis (Predictions): 5 marks.
          *   Theoretical Discrimination (Why these cases matter): 10 marks.
          *   Synthesis/Conclusion (What is intentionality?): 5 marks.
          *   Clarity/Structure: 5 marks.
      *   *Differentiation:*
          *   *C Grade:* Describes the Knobe effect, says "people are biased," treats "intentional" as synonymous with "blameworthy." Fails to see that Case 1 challenges this.
          *   *B Grade:* Identifies that Case 1 tests morality vs. norms. Identifies that Case 3 tests agency. But doesn't fully integrate *why* the counterfactual attitude (not caring) matters.
          *   *A Grade:* Explicitly argues that the effect reveals the *concept* itself is normative, not just the *application* of the concept. Addresses the counterfactual puzzle (agent didn't want the outcome, yet it's intentional). Uses the cases to rule out specific theories (e.g., "Simple Blame" theory is ruled out by Case 1).

  6.  **Review and Refine:**
      *   *Check Word Count:* Ensure the model answer isn't too long.
      *   *Check Constraints:* No names (Knobe, Nichols, etc.), no years.
      *   *Check User's "Brain Break":* The user was stuck on why people say "intentional" even when the agent would have done it anyway (counterfactual independence). The model answer *must* address this. The "Normative" view explains this: if you violate a norm knowingly, the desire is less relevant than the violation itself.
      *   *Case 1 Fix:* Make sure the rule is clearly *conventional* (admin rule) not *moral* (safety rule).
      *   *Case 3 Fix:* Ensure the question asks about the *programmers*, not the software, to keep the psychological attribution consistent.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* The user asked for *one* essay question. I need to make sure the prompt includes the vignettes so the student doesn't have to recall them.
      *   *Correction:* The marking scheme needs to be very specific about the "C answer" trap (just saying "it's moral bias").
      *   *Correction:* Ensure the Model Answer explicitly mentions the "counterfactual" point the user found confusing.

  8.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  Here is a complete exam package designed to force your study group off the memorised script and into the theoretical weeds.

  ### Exam Question (45 Minutes, 25 Marks)

  **Question 1**

  Consider the standard finding regarding side-effect asymmetry: agents are judged to bring about bad side-effects intentionally, but good side-effects unintentionally, even when their attitudes and knowledge are identical.

  Now consider two variations designed to test *why* this asymmetry occurs:

  *   **Case A (The Arbitrary Rule):** A student chooses a playlist for a dance to maximise dancing. She knows a new administrative rule forbids explicit lyrics after 9pm. She doesn't care about the rule, only the dancing. The playlist includes explicit lyrics after 9pm.
  *   **Case B (The Algorithm):** Programmers design a scheduling algorithm with one objective: minimise room clashes. They know this will foreseeably cause some students to miss the last bus home. They don't care about the students, only the clashes. The algorithm runs, and students miss the bus.

  **Task:**
  1.  Predict the folk intuition for **Case A** (Did she *intentionally* break the rule?) and **Case B** (Did the programmers *intentionally* cause the students to miss the bus?).
  2.  Explain how these predictions discriminate between the **"Moral Blame" hypothesis** (people use 'intentional' to mean 'blameworthy') and the **"Normative Expectation" hypothesis** (the concept of intentional action is sensitive to norm-violation generally).
  3.  Address the counterfactual puzzle: In the standard bad side-effect case, people agree the agent *would have acted anyway* even if the side-effect could have been avoided. Why does this not undermine the intentionality judgment in your analysis?

  ***

  ### Model Answer (Distinction Level)

  **Word Count:** approx. 650 words

  The standard side-effect asymmetry demonstrates that moral valence influences intentionality attributions. However, describing this asymmetry is not explaining it. To explain it, we must determine whether the influence is a performance error (bias) or a feature of the competence (the concept itself). The two test cases provided allow us to adjudicate between the "Moral Blame" hypothesis and the "Normative Expectation" hypothesis.

  In **Case A (The Arbitrary Rule)**, the "Moral Blame" hypothesis predicts no intentionality attribution. Breaking an administrative rule about song lyrics is not morally wrong; it is merely a conventional violation. Therefore, if 'intentional' tracks only moral blameworthiness, the student did not intentionally break the rule. However, the "Normative Expectation" hypothesis predicts she *did* intentionally break it. This view holds that the concept of intentional action is sensitive to *any* normative deviation (moral or conventional) when the agent knows the outcome and proceeds regardless. If folk intuitions align with the latter, it suggests the asymmetry is not about morality specifically, but about norm-violation broadly.

  In **Case B (The Algorithm)**, the stakes are higher for the structure of agency. Here, the harm (missing the bus) is negative, but the agents (programmers) are causally distant. The "Moral Blame" hypothesis might still predict intentionality because the outcome is bad and blameworthy. However, the "Normative Expectation" hypothesis offers a more nuanced prediction based on the default expectation. If the default expectation for technology is efficiency, and safety is a secondary norm, the violation might not trigger the same "intentional" tag as a direct human action. Yet, if the programmers' attitude is one of indifference ("don't care"), this mirrors the Chairman case. If participants attribute intentionality here, it reinforces that the *attitude toward the norm* (indifference to a foreseen violation) is the trigger, not the physical act of harming.

  Crucially, these cases help resolve the counterfactual puzzle raised in the prompt. In the standard harm case, participants admit the agent would have acted even if the harm could have been avoided. This seemingly contradicts a volitional account of intentionality (which requires the outcome to be part of the plan). However, if we accept the "Normative Expectation" view supported by Case A, the puzzle dissolves. The judgment of intentionality is not a report on the agent's internal desire or counterfactual dependence; it is a judgment on the agent's relationship to the norm. When an agent knowingly violates a norm (moral in the Chairman case, conventional in Case A) and displays indifference, the folk concept categorises the action as intentional *because* the violation is sufficient to mark the action as "authored" by the agent in a meaningful sense. The counterfactual ("would you have done it anyway?") probes the *motive*, but the intentionality judgment probes the *responsibility for the violation*.

  Therefore, the "Moral Blame" hypothesis is insufficient. It treats the asymmetry as an artifact—a confusion between judging the act and judging the agent. If Case A yields high intentionality ratings, it proves the confusion is actually structural: the ordinary concept of "intentional" is not a purely psychological description (belief + desire + causation) but a normative concept. It functions to pick out actions where the agent has assumed responsibility for a norm violation.

  In conclusion, these variations force a choice between viewing the Knobe effect as a bias or a conceptual feature. If intuition tracks rule-breaking in Case A, the "Moral Blame" theory fails. The concept of intentional action is not morally neutral machinery that gets hijacked by emotion; it is inherently sensitive to whether an outcome constitutes a deviation from what ought to be. The counterfactual independence does not undermine this; rather, it confirms that "intentional" is doing the work of assigning accountability for violations, regardless of whether the violation was the primary goal.

  ***

  ### Marking Scheme (25 Marks Total)

  **Part 1: Case Predictions & Application (5 Marks)**
  *   **5:** Clearly predicts Case A (Intentional) and Case B (Intentional/Complex) and links them to the specific variables (conventional norm vs. causal distance).
  *   **3:** Predicts outcomes but treats them as obvious without linking to the specific constraints of the vignette (e.g., ignores the "arbitrary" nature of Case A).
  *   **1:** Vague predictions or confuses the agent in Case B (blames the algorithm instead of programmers).

  **Part 2: Theoretical Discrimination (10 Marks)**
  *   **8–10 (A Range):** Explicitly uses Case A to *falsify* the "Moral Blame" hypothesis. Explains that if intentionality is attributed in the absence of moral wrong, "blame" cannot be the definition. Distinguishes between "Morality" and "Normativity."
  *   **5–7 (B Range):** Identifies that Case A tests morality, but hedges. Says "maybe people care about rules too." Fails to explicitly state that a positive result in Case A *kills* the Moral Blame theory.
  *   **0–4 (C Range):** Treats "Moral Blame" and "Normative" as the same thing. Says "people just blame them in both cases." This is the "wimp out" answer—it relabels the datum rather than explaining the mechanism.

  **Part 3: The Counterfactual/Attitude Puzzle (5 Marks)**
  *   **5:** Addresses the prompt's specific constraint: explains *why* the "would have done it anyway" admission doesn't cancel intentionality. (Key insight: Intentionality tracks responsibility for violation, not just desire/plan).
  *   **3:** Mentions the counterfactual but says it's "confusing" or "shows people are irrational."
  *   **1:** Ignores the counterfactual element entirely.

  **Part 4: Structure & Clarity (5 Marks)**
  *   **5:** Argument flows logically from cases to theory to conclusion. No citations/names used.
  *   **3:** Understandable but disjointed.
  *   **1:** Hard to follow or spends too much word count re-describing the original Chairman vignette.

  **Specific Penalties & "Wimp Out" Clauses:**
  *   **The "It's Just Bias" Trap:** If the student argues that people are simply *confused* and using 'intentional' to mean 'bad' without analysing the conceptual implications, cap Part 2 at 4 marks. This is a C-level answer.
  *   **The Name-Drop Penalty:** If the student writes "Knobe (2003)" or "Nichols," deduct 2 marks from Part 4. (Closed book constraint).
  *   **The "Algorithm" Error:** If the student argues the *algorithm* had intentions, deduct 3 marks from Part 1. (Tests basic philosophy of mind competence).

  **Differentiation Note for Markers:**
  *   **B Grade Answer:** Will correctly identify that Case A tests if morality is necessary. It will likely conclude "So, it's about norms, not just morals."
  *   **A Grade Answer:** Will go further. It will argue that this means the *concept itself* is normative. It will explicitly tackle the counterfactual issue, noting that standard causal/psychological definitions of intentionality (belief/desire) fail to capture why we ignore the "would have done it anyway" clause. The A answer recognises that the Knobe effect isn't a bug in human reasoning, but a feature of how we define agency.
