answer: |-
  **Project Title:** Shadow Memberships: Church-State Boundaries and the Demos Problem

  **Project Summary**
  This four-month conceptual project investigates the intersection of religious establishment and democratic boundary theory. While secularism studies typically focus on neutrality, laïcité, or symbolic separation, and democratic theory focuses on the boundaries of the demos, few frameworks analyze how state-enforced religious membership mechanisms create unaccountable political bodies. This project compares Germany's *Kirchensteuer* (church tax) registration systems and England's Crown-Parliament church governance against French and US models. The core inquiry is whether administratively enforced affiliation constitutes a more severe democratic boundary failure than symbolic establishment by creating shadow membership bodies with fiscal or coercive power lacking democratic accountability.

  **Research Question**
  Do state-maintained religious membership rolls (Germany) and state-integrated church governance structures (England) generate shadow constituencies that violate democratic boundaries? Specifically, is administratively enforced affiliation a morally distinct or worse boundary failure than symbolic establishment, and do these mechanisms bypass the consent required for legitimate coercive power?

  **Literature Gap**
  Existing literature treats secularism and demos-boundary issues as separate fields. Debates surrounding the US Establishment Clause, French laïcité, or general state neutrality focus on institutional separation or symbolic endorsement. They do not adequately address the mechanics of membership enforcement. Consequently, current frameworks cannot determine if a state collecting religious taxes via civil registry (Germany) is democratically more problematic than a state integrating church leadership into legislative bodies (England). This project bridges that gap by applying democratic boundary theory to church-state administrative mechanisms.

  **Methodology**
  The project employs a conceptual taxonomy rather than empirical survey or archival research. It will map membership mechanisms across four jurisdictions:
  1.  **Germany:** Administrative affiliation via tax registry (coercive/fiscal).
  2.  **England:** Constitutional integration via Crown/Parliament (governance/symbolic).
  3.  **France:** Strict separation (nominal boundary).
  4.  **US:** Constitutional separation (legal boundary).

  The analysis focuses on the link between membership rolls and coercive authority. It categorizes states based on how they define, enforce, and monetize religious belonging without direct democratic consent.

  **Expected Outcomes**
  The primary deliverable is a framework classifying boundary-failure types in church-state relations. This taxonomy will distinguish between:
  *   **Symbolic Violations:** State endorsement without coercive membership.
  *   **Administrative Violations:** State enforcement of affiliation without democratic oversight.
  *   **Shadow Membership:** Instances where fiscal or governance power is exercised over a body not constituted by democratic consent.

  Success is defined by demonstrating whether tax rolls and establishment clauses are morally identical boundary violations. If the framework shows that administrative enforcement bypasses democratic consent similarly to coercive governance, it establishes a new criterion for evaluating secularism beyond neutrality.

  **Timeline and Scope**
  **Duration:** 4 Months.
  **Scope:** Conceptual analysis only. No deep archival work or empirical data collection is planned.
  **Month 1:** Literature review focusing on democratic boundary theory and comparative church-state law.
  **Month 2:** Drafting the conceptual taxonomy of membership mechanisms.
  **Month 3:** Comparative application across Germany, England, France, and US.
  **Month 4:** Finalizing the framework and drafting the workshop paper.

  This scope ensures feasibility within the four-month window while producing a robust theoretical tool for workshop discussion.
