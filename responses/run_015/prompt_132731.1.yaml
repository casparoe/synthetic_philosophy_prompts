prompt: |-
  hey — I run a tiny reading group (about a dozen people: two philosophy grad students, a few ML folks, a therapist, some friends who just showed up) and we spent the last several weeks on theories of a person's good that idealize their preferences in some way. Roughly the menu we covered: simple present-desire views where nothing gets idealized; informed-desire views where you add full factual information; views where you also have to actually *experience* the thing (knowing the facts about pineapple isn't the same as tasting it); the Brandt-ish cognitive-psychotherapy version where desires that dissolve under repeated clear presentation of the facts get deleted; the dispositional "what you'd want under ideal reasoning" family; Railton-style objective-interest views where an ideally situated version of you wants something *for* you; Yudkowsky-style coherent extrapolated volition, where you run the extrapolation on everybody together until it converges into something coherent; ideal-advisor views; and views where rationality itself is partly moralized, so a perfectly coherent informed racist still doesn't get improved welfare by staying racist.

  Everyone kept using the same vocabulary for different machinery, so before the next session I want a diagnostic: a "which idealization procedure are you actually committed to?" quiz. Ten questions, each a concrete case with two or three answer options, phrased so someone who's never read any of this can answer, and so that nobody can tell which label an answer points to — sort people by what they say about cases, not by which name they like. Absolutely no questions like "do you think your good consists in the satisfaction of your desires."

  Cases I definately want in there, or ones like them: someone who has never tried a thing and doesn't want it and then loves it after trying; someone with a fear of flying who knows all the statistics; someone whose aspirations have quietly shrunk to fit a bad situation; a verdict delivered at 3am while exhausted; a person who after full information still has two fully coherent but incompatible lives available (the pianist self and the mathematician self, each fine once you're in it); a case where the extrapolation would replace a deep commitment you currently treasure; a case where present-you violently rejects what the extrapolated self endorses; a case where someone's awful values survive every informational and coherence improvement; a whole group whose individual extrapolations conflict; and a case where idealizing further keeps changing the answer instead of settling.

  Two parts to the deliverable.

  First, build the key from the logical space, not from the list of names. I care about these five splits, so use them as the branch labels of a small taxonomy: how much the procedure is allowed to *correct* versus merely *accommodate* your current values (call it corrective depth); whether the procedure has to hand back a single convergent answer or may hand back several; whether the idealized self still has to be *you* in any sense; whether present-you keeps any veto over the result; and whether extrapolating harder always leaves the answer fixed or can move it again. Then locate the named positions as leaves in that space, including all of the ones on my menu above plus a pluralist "no fact of the matter, multiplicity is irreducible" leaf. For empty combinations, say briefly whether they're empty because incoherent, unattractive, or just unoccupied because nobody bothered.

  Second, the scoring key: map answer *patterns* (not individual answers) onto leaves, and be explicit about which pairs of leaves your ten questions can't seperate and why — including whether some extra case would pry them apart or whether they're genuinely the same view wearing different hats. Also flag answer patterns that come out mixed, and say what I should tell a person whose pattern is mixed rather than just assigning them whichever leaf they came closest to.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Context:** A small, diverse reading group (philosophy grads, ML folks, therapist, friends) discussing theories of well-being based on idealized preferences.
      *   **Goal:** Create a diagnostic tool (quiz + taxonomy + scoring key) to sort participants by their *intuitions about cases*, not by terminology.
      *   **Constraints:**
          *   10 concrete case-based questions.
          *   No jargon-heavy questions (e.g., "do you think your good consists in...").
          *   Specific cases required (or close analogues): untried experience, phobia + stats, adaptive preferences, exhausted verdict, incompatible coherent lives, deep commitment replacement, present-self veto, awful values surviving idealization, group conflict, unstable extrapolation.
          *   **Part 1:** A taxonomy based on 5 specific logical splits (Corrective Depth, Convergence/Plurality, Identity/Continuity, Present Veto, Stability). Map named positions to leaves. Explain empty cells.
          *   **Part 2:** A scoring key mapping answer patterns to leaves. Explicitly state which leaves are indistinguishable by this quiz and why. Address "mixed" patterns.

  2.  **Deconstruct the Taxonomy (Part 1):**
      *   *Dimension 1: Corrective Depth.* (Accommodate vs. Correct). Does the procedure just clean up errors (information/coherence) or can it overwrite values (moral correction)?
      *   *Dimension 2: Convergence.* (Single vs. Multiple). Must there be one "True Self" outcome, or can there be multiple equally valid idealized selves?
      *   *Dimension 3: Identity.* (Continuity vs. Replacement). Must the idealized agent be recognizably *you*, or can it be a successor/stranger?
      *   *Dimension 4: Present Veto.* (Yes vs. No). Can current-you reject the idealized verdict?
      *   *Dimension 5: Stability.* (Fixed Point vs. Moving Target). Does more idealization always stabilize, or can it oscillate/chaos?
      *   *Mapping Positions:*
          *   Simple Present-Desire: Low Correction, Single (usually), High Identity, High Veto, Stable.
          *   Informed-Desire (Full Info): Med Correction (factual), Single, High Identity, Low Veto, Stable.
          *   Experiential (Tasting): Med Correction (phenomenal), Single, High Identity, Low Veto, Stable.
          *   Brandt (Cognitive Psychotherapy): High Correction (therapy), Single, High Identity, Low Veto, Stable.
          *   Dispositional/Ideal Reasoning: High Correction (logic), Single, Med Identity, Low Veto, Stable.
          *   Railton (Objective Interest): Very High Correction (ideal observer *for* you), Single, Low Identity (idealized agent is distinct), No Veto, Stable.
          *   CEV (Coherent Extrapolated Volition): High Correction, Single (Convergent), Low Identity (extrapolated), No Veto, Stable (by definition).
          *   Ideal Advisor: High Correction, Single, Med Identity, No Veto, Stable.
          *   Moralized Rationality: Very High Correction (moral constraint), Single, Med Identity, No Veto, Stable.
          *   Pluralist/Multiplicity: Any Correction, *Multiple*, High/Med Identity, Veto varies, Stable (within branches).
      *   *Empty Cells:* Need to identify logically incoherent combos (e.g., High Correction + High Veto is unstable; Multiple + CEV is contradictory).

  3.  **Drafting the Questions (Part 2 - The Quiz):**
      *   Need 10 questions covering the required cases.
      *   Options must be neutral (A/B/C) without signaling the "correct" philosophical label.
      *   *Case 1 (Untried Experience):* The Pineapple Case. (Tests Experiential vs. Informational).
      *   *Case 2 (Phobia + Stats):* The Flying Case. (Tests Informational vs. Therapeutic/Deep Correction).
      *   *Case 3 (Adaptive Preferences):* The Shrinking Aspirations. (Tests Correction Depth).
      *   *Case 4 (Exhausted Verdict):* The 3am Case. (Tests Stability/Procedural conditions).
      *   *Case 5 (Incompatible Lives):* Pianist vs. Mathematician. (Tests Convergence/Plurality).
      *   *Case 6 (Commitment Replacement):* The Monk Case. (Tests Identity/Continuity).
      *   *Case 7 (Present Veto):* The Radical Shift. (Tests Veto).
      *   *Case 8 (Awful Values):* The Idealized Racist. (Tests Moralized Rationality/Correction Depth).
      *   *Case 9 (Group Conflict):* The Tribe Case. (Tests CEV/Aggregation vs. Individual).
      *   *Case 10 (Unstable Extrapolation):* The Oscillator. (Tests Stability).

      *Refining Options:* Ensure options map to the 5 dimensions without using the dimension names.
      *   *Example:* For the Racist case, Option A: "If they know everything and think clearly, that's their good." (Low Correction). Option B: "Racism is a cognitive error, idealization removes it." (High Correction/Moralized). Option C: "We can't say." (Pluralist/Skeptic).

  4.  **Developing the Scoring Key:**
      *   This is the hardest part. I need to map combinations of answers to the Taxonomy Leaves.
      *   Since I can't literally score this like a personality test in a text response without making it huge, I need to provide a *logic* for scoring.
      *   I need to identify *indistinguishable* leaves. For example, Railton and Ideal Advisor often yield similar verdicts in cases, differing mostly in metaphysical grounding. CEV and Ideal Reasoning might overlap on single/convergent outcomes.
      *   *Mixed Patterns:* Real people aren't consistent. I need to advise the user on how to handle someone who wants Veto on some cases but not others (e.g., a "Contextualist").

  5.  **Review and Refine:**
      *   *Check Constraints:* Did I use the 5 specific splits? Yes. Did I include the required cases? Yes. Is the language accessible? Yes.
      *   *Taxonomy Check:* Are the named positions placed correctly?
          *   *Simple Present:* Accommodate, Single, You, Veto, Stable.
          *   *Informed:* Accommodate+Facts, Single, You, No Veto, Stable.
          *   *Brandt:* Corrective (Therapy), Single, You, No Veto, Stable.
          *   *Railton:* Corrective (Objective), Single, Other-for-You, No Veto, Stable.
          *   *CEV:* Corrective, Single (Global), Successor, No Veto, Stable.
          *   *Pluralist:* Any, Multiple, You, Veto?, Stable.
      *   *Empty Cells:* "Multiple + No Veto + Replacement" is basically "Death of the Self," which is unattractive. "High Correction + High Veto" is paradoxical (if you can veto the correction, it wasn't corrective).
      *   *Scoring:* Make sure to highlight that Questions 5 (Plurality) and 8 (Moral Correction) are the biggest splitters.

  6.  **Final Polish:**
      *   Tone: Intellectual but accessible, matching the reading group vibe.
      *   Formatting: Clear headers, bullet points for the taxonomy, numbered list for the quiz.
      *   Self-Correction on Scoring: A simple "count the As and Bs" won't work because the dimensions are orthogonal. I need to group questions by dimension.
      *   *Revision:* I will organize the scoring key by the 5 Dimensions. Each question primarily tests one dimension. This makes the mapping clearer.

      *Wait, one constraint check:* "Map answer *patterns* (not individual answers) onto leaves." Okay, I need to show how the *combination* leads to a leaf. I will structure the scoring key to evaluate the user's profile across the 5 dimensions based on their specific answers to the relevant questions.

      *Indistinguishability:* Railton vs. Ideal Advisor is the classic hard case. Also Brandt vs. Dispositional. I need to be honest that this quiz sorts *commitments*, not necessarily distinct metaphysical theories that happen to overlap.

      *Mixed Patterns:* Suggest "Fragmented Well-Being" or "Contextual Idealization" as a valid outcome.

  7.  **Drafting the Content:** (Mental Outline)
      *   **Intro:** Acknowledge the group's progress.
      *   **Part 1: The Logical Space (Taxonomy).** Define the 5 axes. Draw the tree (textually). Place the theories. Note empty cells.
      *   **Part 2: The Diagnostic Quiz.** 10 Questions. 3 options each (mostly).
      *   **Part 3: The Scoring Key.** How to tally. Mapping to leaves. Indistinguishability note. Mixed pattern advice.

      *Refining the Questions for Neutrality:*
      *   Instead of "Does this count as well-being?" ask "Which outcome sounds like the *real* benefit to the person?"
      *   Ensure Option C is often the Pluralist/Skeptic out.

      *Let's build the Taxonomy Tree first to ensure the questions target the branches.*
      1.  Correction (Accommodate vs Correct) -> Q2, Q3, Q8.
      2.  Convergence (Single vs Multiple) -> Q5, Q9.
      3.  Identity (You vs Successor) -> Q6, Q7.
      4.  Veto (Yes vs No) -> Q4, Q7.
      5.  Stability (Fixed vs Moving) -> Q10, Q4.

      *Wait, Q7 (Veto) and Q6 (Identity) are linked.* If the successor is too different, veto becomes irrelevant. I need to separate them. Q7 will focus on "You feel alienated by the result."

      *Okay, ready to write.*
answer: |-
  ## Part 1: The Logical Space (Taxonomy)

  This taxonomy maps the positions based on the *structure* of the idealization procedure, not the names philosophers give them. We are sorting by five binary (or trinary) switches.

  ### The Five Branches

  1.  **Corrective Depth:**
      *   *Accommodating:* The procedure only fixes factual errors, logical slips, or lack of imagination. It takes your values as found.
      *   *Corrective:* The procedure can delete or overwrite values deemed "defective" (e.g., based on false consciousness, adaptive preferences, or immorality), even if you hold them firmly.
  2.  **Convergence:**
      *   *Singular:* There is exactly one idealized verdict for a person (or group).
      *   *Plural:* There can be multiple, incompatible, yet equally idealized endpoints (e.g., two valid life paths).
  3.  **Identity Continuity:**
      *   *Continuity:* The idealized agent must be recognizably *you* (psychological connectedness matters).
      *   *Successor:* The idealized agent can be a "successor self" or an external advisor who knows you better than you know yourself, even if you wouldn't recognize them.
  4.  **Present Veto:**
      *   *Veto:* Current-you has authority to reject the idealized verdict (e.g., "I don't care what Ideal-Me wants, I want *this*").
      *   *No Veto:* If the idealized verdict diverges from current desires, current desires are mistaken.
  5.  **Stability:**
      *   *Fixed Point:* More information/reasoning eventually settles on an answer.
      *   *Unstable:* Further idealization can shift the answer indefinitely (chaos/oscillation).

  ### The Leaf Map (Positioning Theories)

  | Theory | Correction | Convergence | Identity | Veto | Stability | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Simple Present-Desire** | Accommodate | Singular | Continuity | **Veto** | Fixed | Baseline. |
  | **Informed-Desire (Full Info)** | Accommodate | Singular | Continuity | No Veto | Fixed | Fixes facts, keeps values. |
  | **Experiential (Tasting)** | Accommodate | Singular | Continuity | No Veto | Fixed | Fixes phenomenal knowledge. |
  | **Brandt (Cognitive Psychotherapy)** | **Corrective** | Singular | Continuity | No Veto | Fixed | Therapy deletes "irrational" desires. |
  | **Dispositional (Ideal Reasoning)** | **Corrective** | Singular | Continuity | No Veto | Fixed | Focus on logical coherence. |
  | **Ideal Advisor** | **Corrective** | Singular | **Successor** | No Veto | Fixed | Advisor knows you, isn't you. |
  | **Railton (Objective Interest)** | **Corrective** | Singular | **Successor** | No Veto | Fixed | Ideal self wants it *for* you. |
  | **CEV (Coherent Extrapolated Volition)** | **Corrective** | **Singular** (Global) | **Successor** | No Veto | Fixed | Aggregates everyone. |
  | **Moralized Rationality** | **Corrective** (Moral) | Singular | Continuity | No Veto | Fixed | Racism = cognitive error. |
  | **Pluralist / Multiplicity** | Any | **Plural** | Continuity | Variable | Fixed | Irreducible branching. |

  ### Empty or Unattractive Cells

  *   **Corrective + Veto:** *Logically Unstable.* If current-you can veto the correction, the procedure isn't actually corrective; it's just a suggestion box. (Unless the veto is temporary, but then it collapses into No Veto).
  *   **Plural + No Veto + Successor:** *Unattractive.* If there are multiple ideal outcomes and the ideal agent isn't you, and you can't veto, you are essentially being handed over to a committee of strangers to split you into fragments. Nobody argues for this explicitly.
  *   **Unstable + Singular:** *Incoherent.* If the answer keeps moving under idealization, you cannot claim there is a single "ideal" verdict. This cell is occupied only by skeptics who say "Therefore, there is no good."

  ***

  ## Part 2: The Diagnostic Quiz

  **Instructions:** Read each case. Choose the option that best matches your intuition about what is *actually good for the person* (or the group). Do not worry about consistency yet; just answer what feels right.

  **1. The Pineapple (Experiential vs. Informational)**
  Alex has never eaten pineapple. Based on descriptions, Alex is sure they would hate it and has no desire to try. After finally tasting it, Alex loves it and wishes they had eaten it years ago.
  *   A. Alex's good was always to eat pineapple; they were just mistaken about their own reaction.
  *   B. Alex's good changed when they tasted it; before that, avoiding it was fine.
  *   C. There is no fact about whether it was good until Alex actually tried it.

  **2. The Nervous Flyer (Informational vs. Therapeutic)**
  Sam is terrified of flying. Sam knows all the safety statistics perfectly. The fear is visceral and ruins Sam's life. A therapy procedure could remove the fear without changing any facts.
  *   A. If Sam still fears it after knowing the stats, avoiding planes is good for Sam.
  *   B. The fear is a glitch; removing it is good for Sam even if Sam currently resists the therapy.
  *   C. Both the fearful Sam and the cured Sam have valid but different goods.

  **3. The Happy Slave (Adaptive Preferences)**
  Jordan lives in a restrictive situation. Over time, Jordan's desires have shrunk to fit the cage. Jordan is content and desires nothing more. An outsider can see Jordan could have had a much richer life.
  *   A. Jordan's contentment is what matters; the richer life is only good if Jordan wants it.
  *   B. Jordan's desires are distorted by the situation; the richer life is good for Jordan regardless.
  *   C. We cannot compare the two lives; they are incommensurable.

  **4. The 3 AM Verdict (Stability & Procedure)**
  Taylor is exhausted, emotional, and decides to quit their job at 3 AM. After sleep and calm reflection, Taylor wants to keep the job.
  *   A. The 3 AM decision counts as a genuine desire that was just overridden by a later one.
  *   B. The 3 AM decision was noise; only the calm verdict reflects Taylor's good.
  *   C. If Taylor oscillates between calm and exhausted indefinitely, there is no single answer.

  **5. The Two Paths (Convergence)**
  Casey could become a Pianist or a Mathematician. Both lives are coherent, informed, and stable. Casey cannot do both. Once Casey chooses one, they will be fully satisfied.
  *   A. One path is objectively better, even if we can't tell which.
  *   B. Both paths are equally "good for Casey"; there is no single right answer.
  *   C. The "good" is only determined once Casey commits; before that, it is undefined.

  **6. The Monk (Identity Continuity)**
  Through deep reflection, Morgan decides to become a monk, abandoning all previous relationships, hobbies, and personality traits. The "Monk Morgan" is happy, but "Old Morgan" would be horrified.
  *   A. This is good for Morgan, even if Old Morgan wouldn't recognize the new life.
  *   B. This is a kind of death; it can't be good for *Morgan* if Morgan isn't there anymore.
  *   C. It is good for Monk Morgan, but bad for Old Morgan; they are effectively different people.

  **7. The Alienated Self (Present Veto)**
  After years of therapy and reflection, Ideal-Pat wants a life of quiet solitude. Current-Pat violently rejects this, wanting fame and noise. Ideal-Pat says the noise is empty.
  *   A. Current-Pat gets to decide; if they reject the solitude, it isn't good for them.
  *   B. Ideal-Pat knows best; Current-Pat is wrong about their own good.
  *   C. Current-Pat's rejection invalidates the idealization process; start over.

  **8. The Idealized Racist (Moral Correction)**
  Robin is a racist. Robin knows all the facts, is logically coherent, and has experienced life fully. Robin still prefers a segregated society.
  *   A. If Robin is fully informed and coherent, this preference defines Robin's good.
  *   B. Racism is a rationality error; a truly idealized self would not be racist.
  *   C. Robin's good is one thing, but morality is another; they can conflict.

  **9. The Tribe (Group Extrapolation)**
  A community's individual idealizations conflict (e.g., some want tradition, some want progress). A "Group Ideal" is calculated that balances these.
  *   A. The Group Ideal is what matters; individuals should align with the converged whole.
  *   B. Only individual idealizations matter; the group has no "good" separate from them.
  *   C. The conflict itself is the reality; forcing convergence hides the truth.

  **10. The Oscillator (Stability)**
  As we add more information and reasoning power to Alex's profile, Alex's preference flips back and forth between A and B without settling.
  *   A. Keep going; there must be a breaking point where it settles.
  *   B. Accept that Alex's good is unstable or cyclical.
  *   C. If it doesn't settle, the concept of "Alex's good" is broken for this case.

  ***

  ## Part 3: The Scoring Key

  Do not count points. Instead, profile the user across the **Five Branches**. Each question primarily tests one branch. A "pattern" is the set of positions the user takes across the five branches.

  ### Dimension Scoring

  1.  **Corrective Depth** (Questions 2, 3, 8)
      *   *Mostly A:* **Accommodating.** (Maps to: Simple Present, Informed-Desire).
      *   *Mostly B:* **Corrective.** (Maps to: Brandt, Railton, CEV, Moralized).
      *   *Mostly C:* **Pluralist/Skeptic.** (Maps to: Multiplicity).
  2.  **Convergence** (Questions 5, 9)
      *   *Mostly A:* **Singular.** (Maps to: Most standard theories).
      *   *Mostly B:* **Plural.** (Maps to: Pluralist/Multiplicity).
      *   *Mostly C:* **Constructivist.** (Good is made by choosing, not found).
  3.  **Identity Continuity** (Question 6)
      *   *Option A:* **Successor.** (Maps to: Railton, CEV, Ideal Advisor).
      *   *Option B:* **Continuity.** (Maps to: Brandt, Dispositional, Present-Desire).
      *   *Option C:* **Fragmented.** (Maps to: Parfitian reductionism).
  4.  **Present Veto** (Question 7)
      *   *Option A:* **Veto.** (Maps to: Simple Present, some Hybrid views).
      *   *Option B:* **No Veto.** (Maps to: Railton, CEV, Brandt, Informed).
      *   *Option C:* **Procedural.** (Maps to: Ideal Advisor requiring consent).
  5.  **Stability** (Questions 4, 10)
      *   *Mostly A/B:* **Fixed Point.** (Maps to: Almost all standard theories).
      *   *Mostly C:* **Unstable/Skeptic.** (Maps to: Nihilism or Chaos theories).

  ### Mapping Patterns to Leaves

  Once you have the user's 5-part profile (e.g., Corrective + Singular + Successor + No Veto + Fixed), match it to the Taxonomy in Part 1.

  *   **The "Humanist" (Accommodate + Singular + Continuity + Veto + Fixed):** Simple Present-Desire or Informed-Desire. They trust the person's current voice, perhaps cleaned of factual errors.
  *   **The "Therapist" (Corrective + Singular + Continuity + No Veto + Fixed):** Brandt or Dispositional. They believe in fixing the "glitches" in the person but keeping the person intact.
  *   **The "Architect" (Corrective + Singular + Successor + No Veto + Fixed):** Railton, Ideal Advisor, or CEV. They are willing to build a "better self" that current-you might not recognize or like.
  *   **The "Moralist" (Corrective [Moral] + Singular + Continuity + No Veto + Fixed):** Moralized Rationality. Specifically flagged by Question 8 (Option B).
  *   **The "Gardener" (Any + Plural + Continuity + Variable + Fixed):** Pluralist/Multiplicity. Flagged by Question 5 (Option B).

  ### Indistinguishable Leaves (The "Blind Spots")

  This quiz cannot separate the following pairs because they yield identical verdicts on cases, differing only in metaphysical explanation:

  1.  **Railton vs. Ideal Advisor:** Both posit a Successor/Other who knows what is good for you without Veto. The quiz treats them as the same leaf ("The Architect"). To separate them, you would need a question about *where* the authority comes from (external reality vs. internal coherence), which is too abstract for this diagnostic.
  2.  **Brandt vs. Dispositional:** Both are Corrective + Continuity. Brandt uses "psychotherapy" metaphors; Dispositional uses "logic" metaphors. In practice, they agree on 90% of cases.
  3.  **CEV vs. Aggregated Ideal Advisor:** Question 9 tests this, but if a user says "Group Ideal matters" (9A) but "Individual Continuity matters" (6B), they are in a tension spot. The quiz groups them under "Collective Architect."

  ### Handling Mixed Patterns

  It is common for a participant to score **Corrective** on Racism (Q8) but **Accommodating** on Adaptive Preferences (Q3).

  *   **Diagnosis:** This person is a **Contextual Idealizer**. They do not hold a unified theory. They believe some values are "deep" (identity-constituting) and others are "shallow" (errors).
  *   **Advice:** Tell them: "You aren't committed to a single idealization procedure. You are committed to a *typology* of desires. You treat moral/cognitive errors as correctable, but existential preferences as sacrosanct. Your work is to define the boundary between the two."
  *   **Diagnosis:** If they score **Veto** on Q7 but **No Veto** on Q2 (Phobia).
  *   **Advice:** "You believe in a **Threshold View**. You allow correction for clear pathologies (phobias), but you retain a veto for life-shaping decisions. This is a hybrid view, common in clinical ethics."

  ### When the Pattern is "Unstable" (Question 10)

  If a user selects **10C** ("Concept is broken"), they have exited the game of idealization.
  *   **Advice:** "You are a **Skeptic about Welfare**. You don't think there is a fact of the matter to be found by idealization. You should read critiques of the concept of 'prudence' rather than theories of idealization."

  ### Summary for the Group Leader
  *   **Cluster A (The Trusters):** Accommodate + Veto. (Present/Informed Desire).
  *   **Cluster B (The Fixers):** Corrective + Continuity. (Brandt/Dispositional).
  *   **Cluster C (The Builders):** Corrective + Successor. (Railton/CEV).
  *   **Cluster D (The Pluralists):** Plural Convergence. (Multiplicity).
  *   **Cluster E (The Skeptics):** Unstable/Broken.

  Use the clusters to spark debate: *"Why do the Fixers think the Trusters are ignoring obvious cognitive errors? Why do the Builders think the Fixers are too timid?"*
