prompt: |-
  I'm teaching a first-year grad methodology seminar — 22 people, mostly sociology and poli sci with three philosophers mixed in — and next week's 80-minute slot is social ontology. I want an in-class game, not a lecture, that makes them feel the gap between two claims they're going to walk in treating as one claim: (a) everything social is nothing over and above what individuals do and think, and (b) therefore you can always explain a social outcome by citing individual-level facts. Basically everyone in the room already concedes (a) and thinks that settles the whole debate, and I want conceding (a) to stop feeling like a win. Something in the Kincaid-style ballpark, where the supervenience claim is true and does no explanatory work, but don't make them read anything beforehand.

  Here's the skeleton I've got. Keep the bones, but I'm sure it's got problems — fix them and tell me what you changed.

  Everyone gets an index card each round and secretly writes an integer effort bid, 0–10. Effort costs 1 point per unit. There's a bowl with 12 tokens in it; the 12 highest bids each take one, ties broken by me drawing lots. A token is worth 5 points, and points are the only payoff. Round 1 everyone is playing for their own points. Round 2 I quietly hand a third of the table a slip saying their payoff is now their three-person team's total. Round 3 another third get a slip saying they should bid one more than whatever they think the median bid will be. Round 4 is a policy round where I announce effort now costs half as much, or twice as much. Round 5 I drop four extra tokens in the bowl without saying why. After every round each player writes one sentence answering "why did total effort come out at that number," I collect them and read a bunch aloud before putting the aggregate on the board.

  What I'm after: total tokens claimed is 12 every single time under three completely different psychologies and two different cost regimes, and total wasted effort tracks the number of slots rather than anybody's dispositions. And when they read their own explanation sentences aloud, nobody's sentence mentions the number 12.

  The holes I can't figure out. Is 12 slots for 22 players the right ratio or should it be meaner? Should bids be revealed after each round, and if so does that wreck the round-3 imitator condition? Is the slip-passing for teams and imitators even runnable with index cards in the time, or do I need a cheaper way to switch psychologies without breaking the flow? And somebody is definitely going to say the outcome was rigged by the token count so the game is stacked in the holist's favour from the start — build in a beat that either earns that objection or disarms it, because right now I've got nothing.

  Give me the full rules, a materials list (index cards, poker chips, whiteboard, no computers), a per-round timeline that honestly fits 80 minutes including the debrief, and the debrief questions in the order I should ask them. Then tell me what will predictably go wrong the first time I run it. In particular: what do I do if a sharp student reverse-engineers the structure in round 2 and starts organising the table to hold everyone's effort down? My instinct says that's the best thing that could happen and I have no idea how to steer it. And finish with a straight answer about which piece of the holist position this game cannot reproduce and I'll just have to say out loud myself.

  Don't use the phrases methodological individualism, holism, or multiple realizability until the very last beat. Also — they've all seen Schelling's checkerboard segregation model, so if you want an emergence-from-micro demo it has to do something that one doesn't. The point isn't that order comes out of individual choices, it's that the same order comes out of wildly different psychologies and that tinkering with the psychologies doesn't move it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** First-year grad methodology seminar (Soc, PoliSci, Phil). 22 students. 80 minutes.
      *   **Topic:** Social Ontology (specifically the gap between ontological individualism and explanatory individualism/reductionism).
      *   **Goal:** An in-class game (not a lecture) that demonstrates that while social facts might supervene on individuals (Claim A), individual-level explanations often fail to explain social outcomes (Claim B). The outcome should remain stable despite changes in individual motivations/psychologies.
      *   **Constraint:** No pre-reading. No computers. Use index cards, chips, whiteboard. Don't use jargon (methodological individualism, holism, multiple realizability) until the end.
      *   **Current Draft:** A bidding game for tokens. 12 tokens, 22 players. Rounds change payoffs/rules (individual, team, imitator, cost change, token shock).
      *   **Specific Problems to Fix:** Ratio of slots to players, revealing bids, logistics of slips, addressing the "rigged" objection, handling student coordination (collusion), timeline management, and identifying what the game *can't* do.
      *   **Comparison:** Must differ from Schelling's segregation model (which shows order from micro-choices). This needs to show *structural constraint* overriding micro-motives.

  2.  **Evaluate the Draft Mechanics:**
      *   *Ratio (12 slots / 22 players):* This creates scarcity. If everyone bids 10, 12 win. If everyone bids 0, 12 win (ties broken by lot). The critical insight is that the *number of winners* is fixed by the structure (12 tokens), not the effort.
      *   *Payoff:* Token = 5, Cost = 1 per bid unit. Net = 5 - bid. If bid > 5, you lose points even if you win. Rational individual bid should be low (ideally 0 or 1), but fear of losing drives it up (all-pay auction dynamics).
      *   *Rounds:*
          *   R1: Baseline.
          *   R2: Teams (shifts utility function).
          *   R3: Imitators (shifts decision rule).
          *   R4: Cost change (shifts constraints).
          *   R5: Token shock (shifts structural constraint).
      *   *The "Rigged" Objection:* Students will say "Of course total effort tracks tokens, you set the token count." This is actually the *point*, but it needs to be framed as "structural constraint" vs. "individual will."
      *   *Logistics:* Passing slips to 1/3 of the class (7-8 people) secretly is chaotic and slow. Needs simplification.
      *   *Coordination:* If students realize they can collude to bid 0, they break the game. This needs to be addressed as a "social fact" emerging, not a bug.

  3.  **Refining the Game Design:**
      *   *Simplification:* 22 students is a lot for complex secret slips. Let's make the "psychology shifts" public announcements or simple card draws to save time. Actually, secret slips are better for the "hidden variables" feel, but let's make them pre-printed and handed out quickly.
      *   *The "Rigged" Point:* The game *is* rigged. That's the structural realist point. The debrief needs to pivot from "you rigged it" to "social structures rig outcomes regardless of intent."
      *   *The Schelling Distinction:* Schelling shows *unintended* order. This game shows *constrained* outcomes. The outcome (12 winners) is invariant to the micro-motives. Schelling's pattern changes if preferences change. Here, the winner count *doesn't* change even if preferences do.
      *   *Coordination:* If they collude, celebrate it. That proves the point: once a social norm (collusion) exists, it overrides individual psychology.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Materials:* Index cards (bids), colored slips (roles), poker chips (tokens/payoff), whiteboard (tracking).
      *   *Timeline:* 80 mins is tight.
          *   Intro/Rules: 10 min.
          *   5 Rounds x 8 min (play + record): 40 min.
          *   Debrief: 30 min.
      *   *Rules:* Need to be crystal clear. "Highest 12 bids win." "Cost is bid amount." "Token value is 5."
      *   *The "Rigged" Defense:* Acknowledge it immediately in the debrief. "Yes, the structure determines the capacity. The question is: did your individual motives determine the *effort* spent to fill that capacity?"
      *   *Coordination:* If they organize, ask *how* they did it. (Communication? Trust?) That *is* the social ontology.

  5.  **Addressing Specific User Questions:**
      *   *Ratio:* 12/22 is good. It's roughly half. Enough competition to drive bids, enough losers to feel frustration.
      *   *Revealing Bids:* Yes, reveal aggregate effort and winning bid cutoff. Don't reveal individual names (keep it anonymous to reduce shame/bravado).
      *   *Slips:* Pre-print 7 "Team" slips, 7 "Imitator" slips, 8 "Normal" slips. Shuffle and hand out at start of Round 2/3. Actually, better to hand out role cards *before* the game starts but tell them rules change. No, the prompt says "quietly hand." Let's stick to passing notes but streamline it. *Correction:* To save time, assign roles at the start of the specific round.
      *   *The "Rigged" Objection:* Turn it into the lesson. The structure *is* the social fact.
      *   *Coordination:* If they collude, they have created a *social group* with *norms*. This validates the holist view (the group has causal power).
      *   *What the game can't do:* It can't show *constitution*. It shows constraint/causation, not what social facts *are*.

  6.  **Developing the Debrief:**
      *   Start with the data (Effort vs. Tokens).
      *   Move to the explanations (The sentences they wrote).
      *   Highlight the mismatch (Micro explanations vs. Macro stability).
      *   Introduce the jargon (Supervenience vs. Explanation).
      *   Address the "Rigged" claim (Structure as ontology).
      *   Final limitation (Constitution vs. Causation).

  7.  **Refining the "Coordination" Scenario:**
      *   If a student organizes a bid-fixing cartel: Stop the round? No. Let it happen. In the debrief, ask: "Was the outcome determined by individual psychology or the agreement?" The agreement is a social fact not reducible to the individuals (it exists *between* them).

  8.  **Final Polish:**
      *   Check timing. 8 mins per round is tight for 22 people writing cards. Make it 6 mins play, 2 mins tally.
      *   Ensure the "Imitator" rule is simple. "Bid the median of the last round + 1."
      *   Ensure the "Team" rule is simple. "Your payoff is sum of your table's points." (Wait, tables? Arrangement matters). Let's make teams random groups of 3.
      *   *Wait, one major fix:* The prompt says "Round 3... bid one more than whatever they think the median bid will be." This requires knowing the previous median. I need to publish the median after every round.
      *   *The "Rigged" Beat:* I need a specific moment where I acknowledge the token count is the ceiling.

  9.  **Structuring the Output:**
      *   Revised Rules & Materials.
      *   Timeline.
      *   Debrief Script (Questions in order).
      *   Troubleshooting (Coordination, Rigged objection).
      *   The "Missing Piece" (Constitution).

  10. **Self-Correction on "Team" Mechanic:** Calculating team scores for 7 teams of 3 in real-time is slow.
      *   *Fix:* Make the "Team" rule simpler. "You win if *anyone* in your group wins." Or "Your payoff is shared."
      *   *Better Fix for Speed:* Just change the *value* of the token for them. Or, keep the prompt's idea but simplify accounting. "You are in a cell of 3. If your cell gets >= 1 token, you all get 5 points." No, that's complex.
      *   *Best Fix:* Stick to the prompt's "payoff is team total." I will advise the TA/Instructor to have a helper or pre-printed score sheets. Actually, for 80 mins, maybe reduce rounds to 4? No, 5 is good for variety. I will advise to make teams based on seating (rows) to make counting easy.
      *   *Wait, 22 people.* 3 philosophers, rest Soc/PoliSci. They will overthink.
      *   *Revised Plan:* Keep the mechanics as close to the prompt as possible but streamline the accounting.
      *   *Crucial Change:* Don't calculate individual payoffs live. Just calculate *Total Effort* and *Tokens Distributed*. That's all we need for the lesson. The "points" are hypothetical for the students to motivate them, but the *data* for the class is the aggregate. This saves 15 minutes of math.

  11. **Final Review against Constraints:**
      *   No jargon until end.
      *   No computers.
      *   Address the "Rigged" objection.
      *   Address the Coordination issue.
      *   Identify the limitation.

      *(Self-Correction during drafting)*: I need to make sure the "Imitator" rule doesn't break if no one knows the median. I must announce the median of the *previous* round publicly.
      *(Self-Correction on Coordination)*: If they collude, the "Total Effort" will drop to near zero. This actually *helps* the point (Social norm overrides individual greed). I need to make sure the instructor knows how to pivot the debrief if this happens.

      *(Final check on the "Rigged" objection)*: The student will say "The tokens determine the winners." The response is "Exactly. The social structure (token count) constrains the outcome more than the individual effort. But you tried to explain it using individual effort."

      *(Final check on Limitation)*: The game shows causal constraint. It doesn't show *constitution* (i.e., that the tokens *are* nothing but agreements). I need to state this clearly.

      Let's assemble the response.cw
answer: |-
  Here is the revised lesson plan. I have kept your skeleton but tightened the logistics to ensure you finish in 80 minutes, simplified the accounting so you aren't doing math while students get bored, and built specific beats to handle the "rigged" objection and the "collusion" scenario.

  ### **The Core Fix: What Changed**
  1.  **Accounting Simplification:** Do not calculate individual payoffs live. It takes too long. Track only **Total Effort** (sum of all bids) and **Winning Cutoff** (lowest winning bid). The *lesson* is about aggregate effort vs. structural capacity, not individual profit maximization.
  2.  **Role Distribution:** Pre-print the role slips. Handing them out secretly mid-game causes chaos. Hand them out at the start of the specific round as students sit down or as you hand out the index cards.
  3.  **The "Rigged" Beat:** I added a specific moment in Round 5 and the Debrief to weaponize the "rigged" objection rather than defend against it.
  4.  **Collusion Protocol:** If students organize, you do not stop them. You treat the cartel as a new "social fact" that supersedes individual psychology.
  5.  **Schelling Distinction:** Explicitly framed in the debrief. Schelling shows *pattern formation*; this shows *structural constraint*.

  ---

  ### **Materials List**
  *   **Index Cards:** 110 (5 per student, plus spares).
  *   **Poker Chips (or colored paper circles):** 20 total (12 "Win" tokens, 8 spares).
  *   **Role Slips:** 22 small slips of paper.
      *   8 marked "Individual" (Default).
      *   7 marked "Team" (Payoff = Group Total).
      *   7 marked "Follower" (Bid = Last Median + 1).
      *   *Note: Keep these in separate envelopes for Rounds 2 and 3.*
  *   **Whiteboard:** Divided into a table with columns: Round, Total Effort, Tokens Available, Winning Cutoff.
  *   **Timer:** Visible to you.

  ---

  ### **The Rules (Read Aloud - 5 Minutes)**
  "We are playing a bidding game. There are **12 tokens** in the bowl. Each token is worth **5 points** to you.
  1.  Write a number between 0 and 10 on your card. This is your **Effort Bid**.
  2.  Effort costs **1 point per unit**. (Bid 5 = Cost 5).
  3.  The **12 highest bids** win a token.
  4.  Ties are broken by lottery (I will draw names).
  5.  **Payoff** = (Tokens Won × 5) − Effort Bid.
  6.  **Goal:** Maximize your points.
  7.  **Constraint:** After each round, write one sentence on the back of your card: *'Total effort was [X] because...'* Hand me the card. I will tally the data."

  ---

  ### **Timeline (80 Minutes)**

  #### **0:00–0:10: Setup & Round 1 (Baseline)**
  *   Hand out cards. Explain rules.
  *   **Round 1:** Everyone plays for themselves.
  *   **Tally:** Collect cards. Sum the bids (ask 2 students to help count aloud). Record **Total Effort** and **Winning Cutoff** on the board.
  *   **Read:** Read 3 random "because" sentences aloud.

  #### **0:10–0:20: Round 2 (Team Utility)**
  *   **Change:** Hand 7 students (seated near each other) a **"Team"** slip.
  *   **Rule:** "If you hold a Team slip, your payoff is the *sum* of your 3-person group's points. You want the *group* to win, even if you lose personally."
  *   **Play:** Bid and write explanation.
  *   **Tally:** Record data. Read 3 explanations.
  *   *Expected Outcome:* Total effort rises. Teams over-bid to secure slots for the group.

  #### **0:20–0:30: Round 3 (The Follower)**
  *   **Change:** Collect Team slips. Hand 7 *different* students a **"Follower"** slip.
  *   **Rule:** "If you hold a Follower slip, do not maximize points. Your only goal is to bid exactly **1 point higher than the Winning Cutoff of the previous round**." (Publish the Round 2 Cutoff on the board first).
  *   **Play:** Bid and write explanation.
  *   **Tally:** Record data. Read 3 explanations.
  *   *Expected Outcome:* Total effort stabilizes or drifts based on the anchor, not individual desire.

  #### **0:30–0:40: Round 4 (Cost Shock)**
  *   **Change:** No role slips. Everyone is "Individual" again.
  *   **Rule:** "Effort now costs **2 points per unit**. Tokens still worth 5."
  *   **Play:** Bid and write explanation.
  *   **Tally:** Record data. Read 3 explanations.
  *   *Expected Outcome:* Total effort should drop, *but* the number of tokens claimed remains 12.

  #### **0:40–0:50: Round 5 (Structural Shock)**
  *   **Change:** Place **4 extra tokens** in the bowl (16 total).
  *   **Rule:** "Cost returns to 1 point. Tokens = 16."
  *   **Play:** Bid and write explanation.
  *   **Tally:** Record data.
  *   **The Trap:** Do not explain *why* there are more tokens. Just do it.

  #### **0:50–1:20: The Debrief (30 Minutes)**
  *   *See script below.*

  ---

  ### **Debrief Script & Questions**
  *Do not write "Ontology" on the board yet.*

  **Phase 1: The Data (5 mins)**
  1.  "Look at the 'Tokens Available' column. It changed only once. Look at the 'Total Effort' column. It jumped around."
  2.  "Look at your explanation sentences from Round 1 vs Round 4. Did your *reasons* for bidding change?" (Yes: cost, fear, competition).
  3.  "Did the *number of winners* change when your reasons changed?" (No. It was fixed at 12 until I added tokens).

  **Phase 2: The Explanatory Gap (10 mins)**
  4.  "If I asked you to explain why exactly 12 people won in Round 3, would you cite the 'Follower' slips?"
      *   *Wait for answer.* "No. You'd say 'Because there were 12 tokens.'"
  5.  "If I asked you to explain why Total Effort was 140 points in Round 2, would you cite the token count?"
      *   *Wait for answer.* "No. You'd cite the Team incentives."
  6.  **The Pivot:** "So we have two facts. Fact A: The winner count is determined by the token count. Fact B: The effort spent is determined by your psychologies."
  7.  "Here is the trap: If you walk in here believing that 'society is just individuals,' you should believe that Fact A is *caused* by Fact B. But in this room, Fact A stayed constant while Fact B changed wildly."

  **Phase 3: The "Rigged" Objection (10 mins)**
  8.  *Anticipate the hand raise:* "Professor, this is rigged. The tokens determine the outcome, not us."
  9.  **Your Response:** "Exactly. That is the lesson. In the real world, the 'token count' is the **social structure**. It is real. It constrains you. You can have a room full of saints or a room full of egoists (Round 1 vs Round 2), but if the structure only has 12 slots, 12 people will fill them."
  10. "The individualist says: 'Explain the outcome by looking at the bidders.' The structuralist says: 'Look at the bowl.'"
  11. "Conceding that 'only individuals exist' (ontological individualism) does not help you explain why the effort was 140 points. The *structure* did the explanatory work."

  **Phase 4: Coordination (If it happened) (5 mins)**
  12. *If a cartel formed:* "In Round X, effort dropped to near zero. Why?"
  13. "Someone organized an agreement. Is that agreement an individual? No. It exists *between* you. It has causal power (it lowered effort). It is a social fact."

  **Phase 5: Terminology & Limitation (5 mins)**
  14. *Now use the jargon.* "This is the gap between **Ontological Individualism** (only people exist) and **Explanatory Individualism** (people explain outcomes). This game shows you can accept the first and reject the second."
  15. "This is **Supervenience without Reduction**. The outcome depends on you, but you can't explain the outcome by looking *only* at you."
  16. **The Missing Piece:** "What this game *cannot* show is **Constitution**. The tokens are physical objects I brought. In real society, the 'tokens' (money, borders, laws) are *made* of our agreements. This game shows structure constraining agency. It does not show agency constituting structure. That is the hard problem I can't game-ify."

  ---

  ### **Troubleshooting: What Will Go Wrong**

  **1. The "Cartel" Problem (Coordination)**
  *   **Scenario:** In Round 1 or 2, a loud student says, "Everyone bid 0. We all win the lottery."
  *   **Result:** Total effort crashes to ~10.
  *   **Your Move:** **Do not intervene.** This is gold.
  *   **Debrief Adjustment:** "In Round 1, effort was low. Was that individual psychology? No, it was a **norm**. A norm is a social object. It constrained your bidding more than the point values did. If you think you can explain that outcome by looking at individual brain states, you're missing the agreement that happened *between* the brains."

  **2. The "Rigged" Objection (Cynicism)**
  *   **Scenario:** A philosopher says, "This proves nothing because you stipulated the macro-variable (tokens)."
  *   **Your Move:** Agree aggressively. "Yes. I stipulated the social structure. In real life, history stipulates the social structure. You are born into a world with 12 jobs and 22 applicants. You didn't choose that structure, but it determines your outcome more than your work ethic does. The game isn't fake because it's rigged; it's accurate *because* it's rigged."

  **3. Time Creep**
  *   **Risk:** Counting 22 cards takes too long.
  *   **Fix:** As soon as cards are in, dump them on a table. Ask two students to quickly sum the numbers while you start the next round's instructions. You don't need the exact sum on the board until the end of the round. Actually, better: **Project the sum.** Have a TA or trusted student sum it while you talk. Or, simply estimate and write it down to reveal all at once at the end.
  *   *Best Fix:* Have students write their bid *large* on the card. Collect them. Stick them on the whiteboard with magnets. Ask the class to shout out the sum. It takes 60 seconds and builds engagement.

  **4. The "Follower" Confusion**
  *   **Risk:** Students don't know the previous median/cutoff.
  *   **Fix:** You must write the **Winning Cutoff** of the previous round on the board before Round 3 begins. This is public information.

  ### **Why This Beats Schelling**
  Schelling's segregation model shows how *micro-preferences* create *macro-patterns* (order from chaos).
  *   **Schelling:** Change the micro-preferences (tolerance), and the macro-pattern (segregation level) changes.
  *   **This Game:** Change the micro-preferences (greed vs. team vs. imitation), and the macro-pattern (12 winners) **does not change**.
  *   **The Point:** Schelling shows emergence. This game shows **constraint**. It demonstrates that social structures have a "capacity" that individual motives merely fill, rather than create.

  ### **The Straight Answer: What This Game Cannot Reproduce**
  You asked for the piece of the holist position you'll have to state out loud.

  **The game cannot reproduce Constitutive Rules.**
  In the game, the tokens exist *before* the students bid. They are physical constraints (brute facts). In social ontology, most social facts (money, marriage, sovereignty) exist *only because* we accept them (institutional facts).
  *   **The Limit:** The game demonstrates that social structures constrain individuals causally (like a wall). It does not demonstrate that social structures are ontologically dependent on individuals (like a promise).
  *   **The Line:** You must tell them: "This game proves that **Structure has Causal Power**. It does not prove that **Structure has Independent Existence**. You can be a structural realist about the *effects* of society without being a Platonist about the *nature* of society."
