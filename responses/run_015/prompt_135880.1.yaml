  0.35

  **Interpretation:** This is my credence that Totalism is the *correct* axiology and therefore binds us to this choice. Conditional on Totalism being true, the requirement holds at ~0.95 (allowing for minor edge cases in aggregation). The uncertainty is almost entirely in whether Totalism is true, not in what it implies.

  **Decomposition of Uncertainty:**

  *   **Axiological Competitors (Critical-Level/Lexical Views): 0.50**
      Half my uncertainty hangs here. Critical-Level Utilitarianism (CLU) is the direct rival. If the critical level is set above +0.1, the digital minds contribute negative value regardless of quantity. Lexical views (where higher welfare qualities trump any quantity of lower welfare) also block this. These aren't minor tweaks; they are structural alternatives designed specifically to avoid the Repugnant Conclusion.
  *   **Metaphysics of Obligation ("Require"): 0.30**
      This concerns the coherence of obligating agents to bring specific non-existent beings into existence. The Non-Identity Problem suggests we can't harm those who wouldn't otherwise exist, making "require" slippery. If obligations to future contingents are category errors, the "requirement" dissolves even if Totalism is the right value theory.
  *   **Artifactual Origin/Status: 0.20**
      This is the smallest lever. Functionalism dominates philosophy of mind; substrate independence is the standard view. Unless there's a hidden "natural kind" constraint on moral status (which looks like speciesism), the artifactual origin adds negligible uncertainty. I'm treating this as mostly resolved in favor of the digital minds having status.

  **Shakiest Term:** "Require".
  Grounding strict obligations toward diffuse, non-identity-dependent future populations is metaphysically fragile. You can say the outcome is *better*, but that the agent is *required* to bring it about involves deontic logic that struggles with contingent beings.

  **One Piece of Evidence to Move the Number:**
  A robust, non-arbitrary defense of **Lexicality**. If someone can demonstrate a qualitative threshold in consciousness (e.g., narrative depth, agency, or specific phenomenological structures) that cannot be traded off against quantity without absurdity—and show that the +0.1 digital minds lack this—it would tank my credence in Totalism toward 0.1. Conversely, if it's proven that such thresholds are always vague/arbitrary, my credence in Totalism rises toward 0.6.
