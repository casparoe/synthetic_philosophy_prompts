prompt: |-
  I sit on our uni's research integrity committee and we've got a weird case that feels like a Twin Earth situation applied to institutional knowledge. There's a decade-long study running in a sealed biosphere dome where participants developed their own chemical taxonomy — they call the clear liquid 'water' but it's actualy H2O2-based, and they call crystals 'salt' but it's a different ionic compound. The PI argues that for the study's mental-state recordings and internal coherence, the meaning of these terms is fixed by usage inside the dome (like twater in the classic case), not by outside chemistry. Our funding partner says we should either force them to relabel all data to match standard chemistry or pull the grant. I need a short memo for thursday's vote reccomending approve-with-conditions, reject, or keep-as-is, with reasoning that takes the PI's point seriously but lands on something concrete the board can act on. Don't need citations or a reading list — just the argument and the bottom line, including the strongest reason the losing side has.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a University Research Integrity Committee.
      *   **Task:** Write a short memo for an upcoming vote (Thursday).
      *   **Scenario:** A decade-long study in a sealed biosphere dome. Participants developed a unique chemical taxonomy (e.g., "water" = H2O2-based, "salt" = different ionic compound).
      *   **Conflict:**
          *   *PI's Argument:* Meaning is fixed by internal usage/mental states (Twin Earth/Externalism vs. Internalism argument). Relabeling ruins internal coherence.
          *   *Funding Partner's Argument:* Data must match standard chemistry for safety/replicability/accuracy. Relabel or defund.
      *   **Options:** Approve-with-conditions, Reject, Keep-as-is.
      *   **Requirements:** Short memo, concrete reasoning, take PI's point seriously but land on an actionable conclusion, include the strongest argument for the losing side. No citations/reading lists.

  2.  **Deconstruct the Philosophical/Scientific Issue:**
      *   *The Twin Earth Analogy:* Putnam's Twin Earth thought experiment argues that meaning isn't just in the head; it depends on the external reference (H2O vs. XYZ). Here, the PI is arguing for a form of *internalism* or *conceptual role semantics* (meaning is use within the system), while the Funding Partner is arguing for *externalism* (meaning is reference to actual chemical structure).
      *   *The Reality:* In a scientific context involving physical substances, safety and replicability depend on *actual* chemical composition, not just phenomenological experience. If they say "wash with water" but it's peroxide-based, that's a safety hazard and a replication failure for outside scientists.
      *   *The Integrity Issue:* Research integrity requires accurate reporting of methods and materials. Mislabeling chemicals violates standard protocols, regardless of the participants' subjective experience.
      *   *The Compromise:* We can preserve the *psychological/sociological* data (how they perceived it) without compromising the *chemical/biological* data (what it actually was).

  3.  **Determine the Recommendation:**
      *   *Keep-as-is:* Too risky. Violates safety and scientific standards. Funding partner will pull out.
      *   *Reject:* Too harsh. It's a decade-long study. The data has value if corrected.
      *   *Approve-with-conditions:* The sweet spot. Acknowledge the PI's philosophical point (the *experience* is valid) but enforce scientific standards (the *material* must be labeled correctly).
      *   *Decision:* **Approve-with-conditions.**

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Recommendation:** Clear and upfront.
      *   **Context:** Briefly summarize the situation (Biosphere study, taxonomy discrepancy).
      *   **Analysis (The Core Argument):**
          *   Acknowledge the PI's point: The participants' *phenomenology* is real. Their social reality treats the liquid as "water." Changing this erases the sociological/psychological validity of the study.
          *   Counter with Integrity/Safety: Science requires objective material accuracy. H2O2 is not H2O. Calling it "water" creates safety risks and prevents replication.
          *   The Solution: Dual-labeling. Keep the internal term for behavioral analysis, add the external term for material accuracy.
      *   **The Losing Side's Strongest Point:** Need to articulate why the PI might feel this is a betrayal of the study's design (contamination of the variable).
      *   **Actionable Conditions:** What exactly needs to happen? (Metadata, glossaries, safety sheets).

  5.  **Refining the Tone:**
      *   Needs to be administrative but intellectually rigorous.
      *   Respectful of the PI's expertise but firm on integrity standards.
      *   Concise (it's a memo for a vote).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Twin Earth analogy handled correctly?
      *   *Fix:* Don't get bogged down in philosophy jargon. Use it to frame the conflict (internal meaning vs. external reference) but pivot quickly to research integrity standards.
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Specify *how* to label (e.g., "Water (Participant Term) / Peroxide-Solution (Chemical Identity)").
      *   *Critique:* Did I include the losing side's argument?
      *   *Fix:* Ensure a dedicated paragraph highlights the PI's concern about retroactive contamination of the dataset.

  7.  **Final Polish:** Check word count and clarity. Ensure the "Thursday's vote" deadline is respected (implied urgency).

      *(Self-Correction on the Chemistry)*: Wait, the prompt says "H2O2-based." That's hydrogen peroxide. Drinking "water" that is peroxide is dangerous. This heightens the safety/integrity issue. I need to make sure the memo emphasizes that *material safety* overrides *semantic coherence*.

      *(Refining the Recommendation)*: "Approve-with-conditions" is the right path. It saves the study but fixes the labels.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Re: Biosphere Dome Study Taxonomy Dispute

  **RECOMMENDATION:** **Approve-with-Conditions**

  **SUMMARY**
  The Principal Investigator (PI) requests to maintain the participants' internal chemical taxonomy (e.g., labeling a peroxide-based liquid as "water") to preserve the study's psychological and sociological validity. The funding partner demands standard chemical labeling to ensure safety and replicability. I recommend we approve continued funding contingent on a dual-labeling protocol that satisfies both scientific integrity and the study's internal coherence.

  **ARGUMENT**
  The PI's argument relies on a philosophical distinction akin to the "Twin Earth" thought experiment: that meaning is determined by internal usage and mental states rather than external reference. Within the closed system, the participants' belief that the liquid is "water" is a genuine sociological fact. Retroactively correcting their language in qualitative logs could invalidate decade-long datasets regarding group behavior, belief formation, and social cohesion. The integrity of the *social* science depends on preserving their terminology.

  However, research integrity also mandates accurate reporting of *material* conditions. In physical sciences, reference trumps usage. If a substance is chemically H2O2-based, labeling it "water" (H2O) constitutes a material misrepresentation that creates safety hazards for staff handling the samples and prevents external replication of biological results. We cannot allow a closed system's internal semantics to override objective chemical reality in official data reporting.

  **PROPOSED CONDITIONS**
  To bridge this gap, the PI must implement a dual-labeling metadata schema for all future and past publications:
  1.  **Material Safety & Methods:** All chemical inventories, safety sheets, and replication protocols must use standard IUPAC chemical names (e.g., "Peroxide-Solution").
  2.  **Behavioral Data:** Qualitative logs and participant interviews may retain internal taxonomy (e.g., "Water"), provided a permanent glossary defines the chemical reality of the term.
  3.  **Disclaimer:** All publications must include a methodological note clarifying that participant terminology reflects internal perception, not chemical composition.

  **STRONGEST ARGUMENT AGAINST THIS RECOMMENDATION**
  The PI's strongest objection is that this compromise introduces an "observer effect" contamination. By forcing standard chemical labels into the dataset now, we are effectively breaking the blind of the closed system retroactively. The PI argues that the study's value lies in documenting a self-contained reality; acknowledging the external chemical truth within the data structure undermines the very phenomenon being studied (the emergence of independent knowledge systems). They contend that once we admit the outside chemistry into the records, the "Twin Earth" condition is broken, and the longitudinal validity of the social data is compromised.

  **BOTTOM LINE**
  While the PI's concern for data coherence is valid, safety and replicability are non-negotiable integrity standards. Dual-labeling preserves the sociological data without falsifying the chemical reality.

  **VOTE:** Move to approve funding contingent on the dual-labeling protocol outlined above.
