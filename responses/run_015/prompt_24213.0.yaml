answer: |-
  # Activity: The Individual Stake Protocol

  **Context:** Medical resource allocation (ventilators).
  **Participants:** 13 students (6 pairs, 1 trio for Round 2 discussion; whole group for Round 1).
  **Materials:** 
  1. Two colored cards per student (Red = Save One, Blue = Save Five).
  2. "Comparative Audit" forms (printed, 1 per student).
  3. Whiteboard.

  ## Setup and Scenario (0:00–0:05)
  **Instructor Script:** 
  "We are closing our unit on saving lives. We are not discussing trolleys, switches, or intentional harm. We are discussing triage. 
  **Case:** A hospital has one ventilator. 
  **Group A:** One patient arrives (Patient X). Without the ventilator, X dies. With it, X lives. 
  **Group B:** Five patients arrive (Patients 1–5). Without the ventilator, all five die. With it, all five live. 
  **Constraint:** The patients are strangers. They are identical in age, prognosis, and social value. The only difference is the number. 
  **Task:** You are the ethics board. You must allocate the ventilator."

  ## Round 1: The Physical Commitment (0:05–0:20)
  **Goal:** Elicit the intuitive preference for saving the five without allowing abstract justification yet.

  1.  **Distribution (2 mins):** Hand out Red (Save One) and Blue (Save Five) cards.
  2.  **Silent Reflection (3 mins):** Students must choose privately. No talking.
  3.  **The Stand (5 mins):** 
      *   Instruct students to stand. 
      *   Left side of the room = Red (Save One). 
      *   Right side of the room = Blue (Save Five). 
      *   They must physically move to their choice. 
      *   **Rule:** Once standing, they cannot move. They must look at the distribution of the room.
  4.  **Pair Defense (5 mins):** 
      *   Students pair up with someone who made the *same* choice (if odd numbers, one trio). 
      *   **Prompt:** "Tell your partner exactly *why* you chose this side. You are not allowed to use the word 'total,' 'aggregate,' 'sum,' or 'many.' You must explain the choice based on the individuals involved."
      *   **Instructor Role:** Circulate and listen. If you hear "because five is more than one," interrupt gently: "That is a count, not a reason about the individuals. Try again."

  ## Round 2: The Comparative Audit (0:20–0:45)
  **Goal:** Force the realization that no individual in the group of five is worse off than the individual in the group of one.

  1.  **Distribution (5 mins):** Hand out the **Comparative Audit Form**. 
      *   **Rule:** This is a silent, individual written commitment. No discussion yet.
  2.  **Completion (15 mins):** Students must fill out the form. 
      *   **Section A:** "Identify the specific person in Group B (Patients 1–5) whose claim to the ventilator is *stronger* than Patient X's claim. Circle one: Patient 1, 2, 3, 4, or 5."
      *   **Section B:** "Complete this sentence: 'Patient [ circled ] is worse off dying than Patient X is dying because...'"
      *   **Section C:** "If you cannot complete Section B truthfully, check this box: [ ] No individual in Group B is worse off than Patient X. My choice to save Group B relies on a feature of the group as a whole."
  3.  **Peer Review (5 mins):** 
      *   Students swap forms with their partner from Round 1. 
      *   **Task:** Check if their partner completed Section B. If they checked the box in Section C, ask them to read their justification aloud.
      *   **Instructor Role:** Collect the forms. Do not comment yet.

  ## Debrief and Mapping (0:45–1:15)
  **Goal:** Connect the activity failure to the philosophical argument.

  1.  **The Reveal (5 mins):** 
      *   Report Round 1 results (likely heavy skew to Blue/Save Five).
      *   Report Round 2 results (likely majority checked Section C).
      *   **Point:** "Almost everyone chose to save the five, but almost no one could identify a single person in the five who had a stronger claim than the one."
  2.  **Mapping the Argument (15 mins):** 
      *   **Round 1 = The Intuition:** Our moral impulse is to save the many. We feel a strong reason to choose Blue.
      *   **Round 2 = The Diagnostic:** When forced to locate that reason in the *welfare of the victims*, the reason vanishes. Patient 1 is not worse off than Patient X. Patient 2 is not worse off than Patient X. Death is equally bad for each.
      *   **The Philosophical Claim:** This is the "No Worse Off" claim. If no individual in the group of five is worse off than the individual in the group of one, the number itself does not change the *individual* stakes.
      *   **The Aggregation Move:** If you checked Section C, you admitted your justification relies on an *aggregate* feature (total lives saved) rather than a *comparative* feature (individual welfare).
      *   **The Question:** "Is aggregation enough? If morality is about how we treat individuals, does summing their losses violate that commitment?"
  3.  **Naming the View (5 mins):** 
      *   Reveal the principal defender (e.g., John Taurek, "Should the Numbers Count?"; or T.M. Scanlon's contractualism). 
      *   Explain that this view argues we owe justification to each individual separately, not to the "group" as a metaphysical entity.

  ## Predictable Pitfalls & Handling
  **The Grad Student Objection:** 
  *   **Prediction:** During Round 2 or early Debrief, a graduate student will object: "This form is rigged. It presupposes that moral value must be reducible to individual welfare comparisons. It ignores impartiality or agent-neutral reasons."
  *   **Handling:** Do not debate the meta-ethics in the moment. Say: "That is exactly the counter-argument we will discuss next week. For this exercise, we are testing the *individual-centered* justification specifically. Please park the impartiality objection; we need to see if the individual comparison holds water first."
  *   **Why:** If you allow the meta-ethical objection early, the undergraduates will hide behind it rather than feeling the tension of the "No Worse Off" claim.

  **The "Fairness" Distraction:** 
  *   **Prediction:** Students will argue about fairness ("It's unfair to let five die").
  *   **Handling:** Redirect to welfare. "Fairness is a feature of the system. We are asking about the *victim's loss*. Is the loss greater?"

  ## Limitations Statement (Instructor Note)
  **What This Activity Cannot Do:** 
  This activity successfully isolates the *difficulty* of justifying aggregation from an individualist perspective. It forces students to feel the gap between "Save the Five" and "No Individual is Worse Off." 
  **However,** it does not prove that aggregation is *wrong*. It does not provide the positive argument for why we *should* ignore numbers (e.g., the argument from fairness across repeated cases, or the requirement of mutual justifiability). 
  **Your Task:** You must supply the counter-argument in the following lecture. You need to explain why, even if no individual is worse off, we might still be required to save the five (e.g., via Impartiality, or a contractualist rule that no one could reasonably reject). This activity creates the problem; you must provide the solution or the alternative framework. Do not leave them in nihilistic uncertainty about saving the many.
