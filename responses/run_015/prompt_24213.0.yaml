      *   **Round 2 (The Justification):** This is the crux. They need to fill out a form that asks: "Identify the specific individual in the group of 5 who is worse off than the individual in the group of 1." If they can't, they reveal the aggregation reliance.
      *   **Stakes/Payoff:** No real money. Use "Course Credit Points" or "Charity Donation Simulation"? The prompt says "doesn't require real money." Let's use a hypothetical "Resource Allocation Token" system that feels weighty but isn't cash. Or simply treat the "choice" as the stake. Let's use a "Policy Mandate" stake: Their decision dictates the outcome of a simulated case study that will be referenced in the final paper. That raises stakes academically.
      *   **Timeline:** 75 minutes total.
          *   Intro/Setup: 10 mins.
          *   Round 1: 15 mins.
          *   Transition/Handout: 5 mins.
          *   Round 2: 20 mins.
          *   Debrief/Discussion: 25 mins.
      *   **Debrief:** Needs to map Round 1 to the intuitive pull of saving the many, and Round 2 to the failure of individual comparison. Needs to address the "Grad Student Objection" (philosophizing out of it). Needs to state what the activity *can't* do (e.g., explain *why* aggregation might still be valid, or the positive argument for contractualism).

  4.  **Refining Round 2 (The Critical Component):**
      *   The prompt wants them to "discover that they can only point to an aggregate feature."
      *   Form design:
          *   Question 1: Who dies in Option A? (The One)
          *   Question 2: Who dies in Option B? (The Five)
          *   Question 3: Select one person from Group B. Is this person worse off dying than the person in Group A? (Yes/No)
          *   Question 4: If Yes, why? (If No, proceed to Q5)
          *   Question 5: If no individual is worse off, what justifies choosing Option A? (Check boxes: Total Lives, Aggregate Welfare, Social Utility, etc.)
      *   The "Failure": They will likely check "Total Lives" in Q5 after realizing they can't answer Q3 affirmatively. This reveals the shift from individual comparison to aggregation.

  5.  **Addressing the "Grad Student" Pitfall:**
      *   Grad students might say, "This form is flawed because moral value isn't reducible to individual welfare comparisons."
      *   Handling: Acknowledge the validity of the critique but insist on the exercise's constraint: "For the purpose of this protocol, we are testing the *individual-centered* justification." Park the objection for the debrief.

  6.  **Addressing the Limitation:**
      *   The activity shows the *problem* with aggregation from an individualist view. It doesn't prove aggregation is *wrong*. It doesn't provide the positive argument for why we *should* care about numbers if not for individual welfare (e.g., impartiality, fairness). The instructor must supply the counter-argument (e.g., Scanlon's contractualism or utilitarian aggregation defense).

