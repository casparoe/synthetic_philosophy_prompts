      *   **Goal:** Students need to experience the force of this claim themselves, not be lectured. Avoid standard trolley problem distractions (agent responsibility). Focus on victim welfare vs. aggregate outcome.
      *   **Structure:** Two rounds.
          *   Round 1: Forced face-to-face choice (Save 1 vs. Save 5).
          *   Round 2: Structured commitment (form/card) forcing them to specify *for whom* the 5's death is worse, revealing they can only point to aggregates.
      *   **Deliverables:** Activity title, setup, rules, timeline (minute-by-minute), debrief (mapping rounds to argument), prediction of pitfalls (especially grad students philosophizing early), and limitation statement.
      *   **Constraint:** Begin reply with the activity itself. No preface. No restatement of request.

  2.  **Deconstruct the Philosophical Problem:**
      *   The intuition: "Save the five."
      *   The challenge: Why?
      *   Standard answer: "Five deaths is worse than one death."
      *   The "No Worse" Claim (Taurek/Scanlon style): Death is equally bad for each individual. Person A (in the 5) is not worse off than Person B (the 1). If no individual in the group of 5 is worse off than the individual in the group of 1, on what basis do we prioritize the 5?
      *   The Aggregation Move: We sum the losses. But does summing make sense morally?
      *   The Activity needs to isolate the *comparative claim* (Round 1) from the *aggregation justification* (Round 2).

  3.  **Designing the Activity:**
      *   **Title:** Needs to be neutral but evocative. "The Distribution of Loss"? "The Individual Count"? Let's go with "The Individual Stake Protocol."
