  # The Ontological Sorter: A Decision Tree for Metaphysics of Time

  **Instructions:** Answer each node based on your concrete metaphysical commitments, not the label you prefer. If a scenario forces a contradiction in your view, flag it at the "Logical Flag" section.

  ---

  ### Node 1: The Ontological Horizon
  **Scenario:** You stand at the edge of a black hole event horizon, which marks the absolute boundary of the "present." Looking back toward the singularity (the past) and outward toward the universe (the future), is the spacetime region outside your immediate location ontologically void, or does it still hold stuff?
  *   **A: It is void.** (Nothing exists outside the present moment.) → **Go to Node 2**
  *   **B: It holds stuff.** (Past or future regions contain real entities.) → **Go to Node 3**

  > **Branch Breaker (Change My Mind):** If you can be convinced that truthmakers for past-tensed statements (e.g., "Caesar crossed the Rubicon") require existing relata, you must switch from A to B. Conversely, if you accept that truthmakers can be "tensed properties" of the present without existing past objects, you stay at A.
  > **Logical Flag:** If you answer **A** but later affirm that future events are fixed (Node 3), you occupy **Incoherent Space**. Presentism cannot accommodate an existing future.

  ---

  ### Node 2: The Ghost Relation (Presentist Path)
  **Scenario:** Caesar is dead and ontologically void. However, you stand here now. Does the statement "Caesar is earlier than you" require Caesar to exist *now* to be true, or can the relation hold without him?
  *   **A: The relation holds without him.** (Past events bear relational properties despite non-existence.) → **Leaf: Hybrid 1 (Presentism with Ghost-Relational Scars)**
  *   **B: The relation requires him.** (No relation without existing relata.) → **Leaf: Standard Presentism** *(Note: Not a target hybrid, but the baseline position.)*

  > **Branch Breaker:** If you accept that "earlier than" is a real relation that must be grounded in reality, you must move to **B**. If you accept "Lucretian properties" (the world now has the property of *having-contained-Caesar*), you stay at **A**.
  > **Mis-sort Risk:** This tree lumps Standard Presentism and Hybrid 1 close together. If you deny ghost relations but accept tensed properties, you are functionally distinct from a hard-nosed nominalist, but both land on the "Nothing Outside" branch.

  ---

  ### Node 3: The Open Future (Block Path)
  **Scenario:** A supernova will explode in Andromeda next week. Is that event already fixed in the manifold right now, waiting for the light, or is it genuinely open/non-existent?
  *   **A: It is genuinely open/non-existent.** (Future does not exist.) → **Go to Node 4**
  *   **B: It is already fixed/there.** (Future exists in a tenseless sense.) → **Go to Node 4**

  > **Branch Breaker:** If you are convinced by the Rietveld-Putnam argument (no privileged simultaneity in relativity), you must move to **B**. If you believe quantum indeterminacy ontologically prunes the future branch, you stay at **A**.
  > **Logical Flag:** If you answer **A** here but answered **A** at Node 1 (Nothing outside present), you are consistent (Presentism/Growing Block). If you answered **B** at Node 1, you must answer **B** here to avoid Shrinking Block (see Node 4).

  ---

  ### Node 4: The Dead Past (Block Composition)
  **Scenario:** You look at a dinosaur fossil. Is the dinosaur itself part of reality in any relational sense (concretely existing in the past region), or is only the fossil real now?
  *   **A: Only the fossil is real now.** (Past does not exist concretely.) → **Leaf: Shrinking-Block** *(Requires Node 3 = B)*
  *   **B: The dinosaur is real there.** (Past exists concretely.) → **Go to Node 5** *(If Node 3 = A, this is **Leaf: Growing-Block**)*

  > **Branch Breaker:** If you accept the "Truthmaker Argument" for past statements, you must move to **B**. If you believe the past is "gone" entirely, you stay at **A**.
  > **Logical Flag:** If Node 3 = A (Future open) and Node 4 = A (Past gone), you have returned to **Presentism** (Node 1 = A). If you are on the Block Path (Node 1 = B), you cannot deny both Past and Future existence. That is **Empty Logical Space**.
  > **Sorting Warning:** **Growing-Block** is secured here if Node 3 = A and Node 4 = B. **Shrinking-Block** is secured if Node 3 = B and Node 4 = A.

  ---

  ### Node 5: The Time Traveler's Watch (Eternalist Path)
  **Scenario:** You step into a machine and arrive in 1924. You are physically in 1924, but your origin is 2024. Are you *present* at 1924 in the same ontological sense you were present at 2024?
  *   **A: Yes, presence is not unique.** (I am equally present at all times I occupy.) → **Go to Node 7**
  *   **B: No, presence is unique.** (I am only *really* present at one time; the other is just location.) → **Go to Node 6**

  > **Branch Breaker:** If you accept the "Double Presence" objection to time travel as fatal, you must switch to **B**. If you view "presence" as merely spatial location in 4D space, you stay at **A**.
  > **Mis-sort Risk:** This is the primary filter between B-Theory and A-Theory Eternalism. However, some B-Theorists speak loosely about "being present" at a time, which may falsely route them to Node 6.

  ---

  ### Node 6: The Sliding Beam (Objective Present)
  **Scenario:** Assume presence is unique (from Node 5). Does this unique "Now" slide along the timeline like a spotlight, or is it a fixed metaphysical privilege of a specific coordinate?
  *   **A: It slides.** (The present property moves.) → **Leaf: Moving Spotlight**
  *   **B: It is fixed/static.** (The present is a permanent feature of the block.) → **Leaf: A-theoretic Eternalism**

  > **Branch Breaker:** If you accept McTaggart's paradox that a moving present is contradictory, you must switch to **B** (or abandon A-Theory). If you believe passage is phenomenologically undeniable and metaphysically real, you stay at **A**.
  > **Indistinguishability Warning:** **Moving Spotlight** and **A-theoretic Eternalism** are notoriously hard to separate here. Many A-theoretic Eternalists *are* Moving Spotlight theorists. This split relies on whether you view the 'Now' as dynamic or static, but both posit an objective 'Now'.

  ---

  ### Node 7: The Map Coordinate (Indexical Present)
  **Scenario:** Assume presence is not unique (from Node 5). Is the feeling of "now" an objective property of the universe, or just a linguistic indexical like "here" dependent on the observer?
  *   **A: It is an indexical.** (Presentness is perspective-dependent.) → **Leaf: Hybrid 2 (Eternalism with Indexical Presentness)**
  *   **B: It is nothing special.** (Presentness is not even a property, just a label.) → **Leaf: B-theoretic Eternalism**

  > **Branch Breaker:** If you are convinced by the "Phenomenological Argument" (the experience of now is real and needs grounding), you might move to **A**. If you accept deflationism about tense, you stay at **B**.
  > **Mis-sort Risk:** **Hybrid 2** and **B-theoretic Eternalism** often collapse into the same ontology. The distinction is semantic/phenomenological. If you deny objective presence but insist 'now' is a real indexical property, you are Hybrid 2. If you deny 'now' is a property at all, you are B-Theory.

  ---

  ### Global Sorting Warnings & Incoherence Flags

  1.  **The A-Theory/Spotlight Blur:** The tree separates **Moving Spotlight** and **A-theoretic Eternalism** at Node 6 based on dynamism. In practice, most grad students who affirm Node 6 (Objective Present) will affirm both. Treat these leaves as a cluster unless the student explicitly denies passage.
  2.  **The Hybrid 2/B-Theory Blur:** At Node 7, the distinction between **Hybrid 2** and **B-theoretic Eternalism** is thin. Both deny objective presence. Hybrid 2 saves the *phenomenology* of presence via indexicality; B-Theory often discards it. If a student says "Now is real but indexical," sort to Hybrid 2. If they say "Now is an illusion," sort to B-Theory.
  3.  **Empty Logical Space:**
      *   **Node 1 (Void) + Node 3 (Future Exists):** Incoherent. You cannot claim nothing exists outside the present while claiming the future exists.
      *   **Node 1 (Void) + Node 4 (Past Exists):** Incoherent. You cannot claim nothing exists outside the present while claiming the past exists concretely.
      *   **Node 3 (Future Open) + Node 4 (Past Gone):** Returns to Presentism. If you started at Node 1 (Block), this is a contradiction.
  4.  **Most Likely Mis-sort:** **Presentists** who accept truthmakers for past statements (Node 2 = A) are often mislabeled as Growing Block theorists. Ensure they truly deny the *existence* of the past (Node 1 = A) before assigning **Hybrid 1**. If they admit the past exists concretely, they belong at Node 4 (Growing Block).
