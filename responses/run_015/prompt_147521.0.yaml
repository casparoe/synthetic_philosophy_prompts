answer: |-
  Yes, this is a recognized phenomenon with a substantial literature behind it. You have correctly identified a structural flaw in majoritarian aggregation when applied to multi-dimensional issues. Because you come from an engineering background, you will find the social choice theory literature particularly resonant: it treats voting as an aggregation function with specific input/output constraints, and your observation describes a failure mode where the output violates the constraints of the input space.

  Here is the carving you asked for, distinguishing the mathematical core, the political mechanism, and the economic consequences.

  ### 1. The Core Mathematical Phenomenon: The Multiple Elections Paradox

  The specific logical structure you described—where voters approve $A$, approve $B$, but would reject the bundle $(A \land B)$—is formally known in social choice theory as the **Multiple Elections Paradox**.

  *   **Source:** The definitive paper is Brams, Kilgour, and Zwicker (1998), *"The Paradox of Multiple Elections."*
  *   **The Mechanism:** It arises from **non-separable preferences**. In voting theory, preferences are "separable" if my vote on Issue A does not depend on the outcome of Issue B. If preferences are separable, aggregating issue-by-issue votes yields the same result as voting on the whole package. Your observation proves that in real politics, preferences are frequently *non-separable*.
  *   **Why Condorcet and Anscombe aren't quite it:**
      *   **Condorcet Cycling** requires intransitivity in rankings (A > B > C > A). Your case involves binary approvals, not rankings, and doesn't require a cycle, just an incoherent sum.
      *   **Anscombe's Paradox** (1976) describes a situation where a majority of voters end up on the *losing* side of a majority of issues. Your case is more specific: voters are on the *winning* side of every issue, but the *sum* of wins is a loss.
  *   **The Math:** Your inclusion-exclusion arithmetic is correct. If preferences are correlated in a specific way (e.g., "I want lower taxes *unless* services are cut"), the intersection of the winning coalitions on individual measures can be empty, or the winning bundle can be the Condorcet loser of the package space.

  ### 2. The Logical/Philosophical Carving: The Discursive Dilemma

  If you view the propositions not as independent desires but as premises leading to a conclusion, this maps to the **Discursive Dilemma** (or Doctrinal Paradox), formalized by Philip Pettit and Christian List (2002).

  *   **The Structure:** Imagine a court or electorate deciding on a policy $C$. Policy $C$ requires condition $A$ and condition $B$.
      *   Voter 1: Yes on A, No on B $\rightarrow$ No on C.
      *   Voter 2: No on A, Yes on B $\rightarrow$ No on C.
      *   Voter 3: Yes on A, Yes on B $\rightarrow$ Yes on C.
      *   **Majority Vote:** Yes on A, Yes on B. But if you vote directly on C, the result is No (2 vs 1).
  *   **Relevance to You:** This captures the "incoherence" your friend in Zurich noticed. The electorate affirms the premises (spend money, cut taxes) but would reject the conclusion (budget deficit/debt). The paradox highlights the difference between **premise-based aggregation** (voting on measures) and **conclusion-based aggregation** (voting on the budget outcome).

  ### 3. The Economic/Policy Carving: Fiscal Fragmentation

  In public finance and political economy, the specific subset of this paradox involving taxes and spending is often called **Fiscal Fragmentation** or the **Tax-Expenditure Gap**.

  *   **The Mechanism:** This relies on **Fiscal Illusion** (Buchanan, 1967). Voters suffer from a cognitive disconnect between the benefit of a specific service and the cost of the general tax base.
  *   **The "Edges" You Asked About:**
      *   **Timing (Simultaneous vs. Sequential):**
          *   *Simultaneous:* This is the pure Multiple Elections Paradox. The incoherence is immediate.
          *   *Sequential (Years apart):* This is **Policy Drift** or **Temporal Inconsistency**. It is compounded by electorate turnover. If the electorate changes, it's not strictly a paradox of aggregation, but a failure of democratic memory. However, if the *same* electorate votes to cut revenue in Year 1 and increase spending in Year 3, it is a violation of **intertemporal budget constraints**, often enabled by **hyperbolic discounting** (valuing immediate spending gains over future tax pain).
      *   **Logical vs. Economic Contradiction:**
          *   *Logical:* (e.g., "Ban X" and "Protect X"). These are usually caught by legal review before the ballot.
          *   *Economic:* (e.g., "Spend More" and "Tax Less"). These are the dangerous ones because they are not logically impossible, only fiscally unsustainable. They rely on disputed forecasts (e.g., "Supply-side growth will close the gap"). This moves the paradox from *math* to *empirics*, making it harder to adjudicate.
      *   **Intensity of Preference:** Standard majoritarian voting is binary; it discards intensity. If 51% care mildly about A, and 49% care intensely about B, B might fail. But if the 49% are a subset of a different coalition on Issue C, you get the fragmentation you described. This is the **Intensity Problem**. Some literature suggests supermajority requirements or quadratic voting as fixes, but these introduce other pathologies.

  ### 4. The Downstream Consequence: Implementation Gap & Blame Avoidance

  You asked if the downstream blame is part of the same phenomenon. It is a **causal consequence**, not the paradox itself.

  *   **The Implementation Gap:** When the legislature is mandated to fulfill contradictory popular wills, they face a **constrained optimization problem with no feasible solution**. They must violate one mandate to satisfy the other.
  *   **Blame Avoidance:** This is a standard term in political science (R. Kent Weaver, 1986). Politicians and bureaucrats use the ambiguity of the "will of the people" to shift blame.
      *   *If they cut services:* "The voters demanded tax cuts."
      *   *If they raise taxes:* "The voters mandated this service."
      *   The paradox provides the **plausible deniability** required for blame avoidance. The "incoherent will" is a feature, not a bug, for incumbents who must manage the fallout.

  ### 5. Evaluation of Your Terms

  You proposed **'trade-off laundering'** and **'the unbundling problem'**.

  **'The Unbundling Problem'**
  *   **Verdict:** **Strong, academically adjacent.**
  *   **Why:** In legislative theory, "bundling" (omnibus bills) is a known strategy to force trade-offs into the open. Log-rolling is the mechanism. Your term correctly identifies the inverse: taking a coherent budget (a bundle) and slicing it into atomized votes where trade-offs are invisible.
  *   **Critique:** "Unbundling" is sometimes used in tech/economics to mean breaking up monopolies. However, in the context of *voting theory*, it is precise. It signals a structural separation of interdependent variables.

  **'Trade-off Laundering'**
  *   **Verdict:** **Evocative, but implies intent.**
  *   **Why:** "Laundering" implies a malicious actor cleaning dirty money. This fits the political strategy aspect (activists or parties deliberately splitting measures to hide costs).
  *   **Critique:** It may be too polemical for the neutral phenomenon. Sometimes the unbundling isn't malicious; it's a result of single-issue advocacy groups who genuinely don't see the macro picture. However, as a description of the *effect* (hiding the cost), it is excellent.

  **Recommended Technical Term:**
  If you want to search the literature, use **"Non-separable Preferences in Referenda"** or **"The Multiple Elections Paradox."** If you want to describe the fiscal specific, use **"Fiscal Incoherence."**

  ### 6. Is it One Thing or Three?

  You asked if this splits into (a) aggregation, (b) psychology, and (c) design. It is genuinely all three, layered:

  1.  **Aggregation (The Math):** The Multiple Elections Paradox proves that issue-by-issue majority voting is not isomorphic to package majority voting when preferences are non-separable. This is a theorem.
  2.  **Psychology (The Voter):** Voters suffer from **narrow framing** (Kahneman & Tversky). They evaluate the benefit of the spending measure in isolation from the cost of the tax measure. The "trade-off" is cognitively offloaded because the ballot structure permits it.
  3.  **Design (The System):** Direct democracy systems (CA, CH) that allow initiatives often lack a **consistency check** mechanism. Some Swiss cantons and the US Congress (via PAYGO rules, theoretically) attempt to force bundling or budgetary neutrality, but initiatives often bypass these.

  ### Summary for your Mental Model

  *   **The Phenomenon:** Multiple Elections Paradox (Social Choice) / Discursive Dilemma (Logic).
  *   **The Specific Instance:** Fiscal Fragmentation / Tax-Expenditure Gap (Public Finance).
  *   **The Cause:** Non-separable preferences + Narrow Framing.
  *   **The Consequence:** Implementation Gap + Blame Avoidance.
  *   **Your Terms:** "Unbundling Problem" is the structural name; "Trade-off Laundering" is the strategic name. Both are valid, but the former is closer to the literature.

  **Reading List for the Engineer:**
  1.  **Brams, S. J., Kilgour, D. M., & Zwicker, W. S. (1998).** *"The Paradox of Multiple Elections."* Social Choice and Welfare. (The math proof).
  2.  **List, C., & Pettit, P. (2002).** *"Aggregating Sets of Judgments: An Impossibility Result."* Economics and Philosophy. (The logical structure).
  3.  **Matsusaka, J. G. (2005).** *"The Eclipse of Legislatures: Direct Democracy in the 21st Century."* (For the practical impact on budgeting).
  4.  **Weaver, R. K. (1986).** *"The Politics of Blame Avoidance."* Journal of Public Policy. (For the downstream consequence).

  You have correctly identified that direct democracy, when structured as a series of binary independent variables, fails to enforce the **constraint satisfaction** required by a budget. It allows the "user" (voter) to allocate resources exceeding the "system limits" (revenue), causing a crash that the "admin" (legislature) must handle.
