answer: |-
  ### Brainstorming and Conceptual Distinctions

  Before addressing your query directly, I must map the conceptual terrain. Your description touches on meta-ethics, ancient eudaimonism, and modern moral psychology. Here are the key distinctions I am weighing:

  1.  **Moral Internalism vs. Externalism:**
      *   *Internalism:* To judge "X is just" necessarily provides a motive to do X. Your character claims this status ("justice has value for me independently").
      *   *The Twist:* She preserves the *motivation* by altering the *judgment*. She does not judge her refined actions as "unjust." Thus, she technically remains an internalist, but her moral ontology is distorted. The problem is not a failure of motivation, but a failure of *moral perception*.

  2.  **Glaucon's Challenge (Republic Book II):**
      *   Glaucon demands justice be valued *kath' hauto* (for its own sake), stripped of *ta ap' autou gignomena* (the consequences/reputation).
      *   Your character claims to meet this but effectively reintroduces consequences (self-advantage) under the guise of "prudence." She accepts the Ring's power but denies its moral test by narrowing the definition of "harm" or "injury" (*adikia*).

  3.  **Rationalisation vs. Self-Deception:**
      *   *Standard Rationalisation:* "I did X (bad), but Y (context) makes it okay." (Acknowledges the badness, overrides it).
      *   *Your Character:* "I did X, but X is not bad." (Denies the badness categorically).
      *   *Self-Deception:* Usually implies an unconscious suppression of truth. Your character is conscious of the *actions* but deceived about their *moral category*. This is closer to *ideological capture* than psychological repression.

  4.  **The Structure of the Boundary:**
      *   It is not *Motte-and-Bailey* (which is strategic retreat/advance).
      *   It is not *Licensing* (which is temporal: good deed $\to$ bad deed).
      *   It is *Definitional*: The boundary of "Justice" is drawn around the self, rather than the self conforming to the boundary of "Justice."

  5.  **Ancient Parallels:**
      *   *Pleonexia:* The desire to have more. Thrasymachus argues this is justice. Your character satisfies *pleonexia* but calls it *sophrosyne* (moderation/prudence).
      *   *Deinotes vs. Phronesis:* Aristotle's distinction between mere cleverness in achieving ends (*deinotes*) and practical wisdom which requires virtue (*phronesis*). She has *deinotes* but claims *phronesis*.

  ***

  ### Philosophical Analysis and Terminology

  You have identified a sophisticated and psychologically acute posture. To answer your question directly: **There is no single, canonical term in the history of philosophy that captures this exact configuration.**

  However, the phenomenon is a composite of several established concepts. The nearest established frameworks are **Moral Disengagement** (from moral psychology) and the Aristotelian distinction between **Cleverness (*Deinotes*) and Practical Wisdom (*Phronesis*)**. Neither captures the specific *internalist claim* combined with *definitional boundary-work* perfectly.

  Therefore, to serve your novelistic and philosophical precision, I recommend adopting a coined term that synthesizes these elements. I propose the term **Definitional Immunity**.

  Below, I systematically analyze the existing concepts, explain why they fall short, and then define **Definitional Immunity** with the necessary boundary conditions.

  #### 1. Evaluation of Existing Concepts

  **A. Moral Hypocrisy (Batson)**
  *   *Definition:* Appearing moral to oneself and others while avoiding the cost of being moral.
  *   *Why it fails:* As you noted, hypocrisy usually implies a gap between belief and action that the agent *senses* but hides. Your character does not hide it from herself; she has genuinely recategorized the action. She is not *pretending* to be just; she is *convinced* she is just.

  **B. Moral Licensing (Merritt et al.)**
  *   *Definition:* Past moral behavior licenses subsequent immoral behavior ("I donated, so I can lie").
  *   *Why it fails:* Licensing is transactional and temporal. Your character's "licence" is structural and simultaneous. She does not need a prior good deed; her identity as a "just person" automatically exempts her subtle actions from the category of injustice.

  **C. Moral Disengagement (Bandura)**
  *   *Definition:* Cognitive mechanisms that allow individuals to violate standards without self-condemnation.
  *   *Relevance:* This is the closest psychological fit. Specifically, two mechanisms are at play:
      1.  *Euphemistic Labeling:* Calling exploitation "prudence" or "strategy."
      2.  *Advantageous Comparison:* Contrasting her "refined" actions with "vulgar" crimes (theft/violence).
  *   *Why it falls short:* "Disengagement" implies the moral standard exists and is being bypassed. Your character claims the standard *includes* her actions. She isn't disengaging from morality; she is claiming to *embody* it.

  **D. Aristotelian *Deinotes* (Cleverness)**
  *   *Definition:* The capacity to hit the mark relative to any proposed end. If the end is good, it is *Phronesis* (Wisdom); if the end is self-serving, it is mere *Deinotes*.
  *   *Relevance:* Your character exhibits *Deinotes* (skill in maneuvering committees, silencing opponents) but labels it *Phronesis*.
  *   *Why it falls short:* This describes the *capacity*, not the *argumentative posture* regarding the Ring of Gyges. It explains her skill, not her claim to internalist justice.

  #### 2. Proposed Term: Definitional Immunity

  Since existing terms describe the *mechanism* (disengagement) or the *capacity* (cleverness) but not the *structural posture* regarding the definition of justice, I propose **Definitional Immunity**.

  **Definition:**
  **Definitional Immunity** is a moral-psychological posture wherein an agent protects their self-conception as morally virtuous not by restraining their self-interested actions, but by retrospectively or concurrently narrowing the definition of "vice" or "injustice" so that their specific self-interested actions fall outside its extension.

  **Core Structure:**
  1.  **Internalist Claim:** The agent asserts that virtue is intrinsically valuable (responding to Glaucon).
  2.  **Boundary Relocation:** The agent draws the boundary of "injustice" precisely at the limit of their own willingness to act. Actions beyond that limit (vulgar crime) are condemned; actions within it (refined exploitation) are categorized as "prudence," "strategy," or "neutral."
  3.  **Immunity:** Because the actions are defined as non-moral (or prudential), the agent feels no cognitive dissonance and claims the moral high ground over those who commit "vulgar" injustices.

  **Boundary Conditions (When it applies):**
  *   **Condition 1 (Consciousness):** The agent is conscious of the *actions* (unlike repression) but unaware of their *moral quality* (unlike hypocrisy).
  *   **Condition 2 (Rule-Compliance):** The actions typically adhere to the *letter* of social/legal rules while violating the *spirit* of mutual reciprocity.
  *   **Condition 3 (Status Maintenance):** The redefinition serves to maintain the agent's social and self-status as "moral" while securing material or social advantage.

  **Distinction from Adjacent Phenomena:**

  | Phenomenon | Key Mechanism | How Definitional Immunity Differs |
  | :--- | :--- | :--- |
  | **Moral Licensing** | *Temporal:* "Good deed A authorizes Bad deed B." | *Simultaneous:* "Deed B is not Bad; it is Prudent." No prior good deed required. |
  | **Motte-and-Bailey** | *Strategic:* Retreat to defensible claim when challenged. | *Static:* The agent holds one consistent position; the definition itself is rigged, not strategically shifted. |
  | **Self-Deception** | *Psychological:* Unconscious suppression of truth. | *Conceptual:* Conscious manipulation of categories. The agent isn't hiding the act, they are hiding the *label*. |
  | **Legalism** | *External:* Adhering to rules to avoid punishment. | *Internal:* The agent claims intrinsic love of justice, but defines justice as rule-compliance that favors them. |
  | **Ethical Fading** | *Perceptual:* Ethical dimensions disappear from view. | *Active:* Ethical dimensions are present but *reassigned* (e.g., from "justice" to "prudence"). |

  #### 3. Application to the Ring of Gyges

  In the context of your novel, this posture represents a **corruption of the Socratic elenchus**. Socrates seeks to define Justice by finding its essence (*ousia*). Your character defines Justice by its *extension* relative to her own behavior.

  When she faces the Ring of Gyges, she accepts the premise (invisibility) but rejects the test. The Gygean test asks: *"Would you restrain your desire for more (*pleonexia*)?"* She answers: *"I do restrain it, because what I take is not 'more' (unjustly), but 'mine' (prudently)."*

  This is philosophically distinct from Thrasymachus (who says Justice *is* the advantage of the stronger) because she insists she is *not* violating Justice. It is distinct from Glaucon (who says people *want* to be unjust but fear consequences) because she claims she *does not want* to be unjust—she simply doesn't see her advantage-seeking as injustice.

  ### Recommendation for the Dialogue

  If you wish to use an established term, **Moral Disengagement** (specifically *Euphemistic Labeling*) is the most scientifically accurate. If you wish to use an ancient term, describe her as possessing **Deinotes without Phronesis** (Cleverness without Wisdom).

  However, for the precision your dialogue requires, I recommend using **Definitional Immunity**. It allows your characters to debate the *structure* of her morality rather than just the *sincerity*.

  **Sample Dialogue Line:**
  > "You claim the Ring tests our desire for injustice," she said. "But it only tests your definition of it. You call it theft; I call it stewardship. You call it silencing; I call it moderation. I suffer no temptation to be unjust, because I have ensured that nothing I desire falls under that name. Call it hypocrisy if you like, but it is more precise to call it **Definitional Immunity**. I am not evading the law; I am drafting it."

  This term captures the intellectualism of her vice. She is not a hypocrite in the shadows; she is a legislator in the light.
