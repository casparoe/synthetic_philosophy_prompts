  # Joint Statement of Adversarial Collaboration on the Ontology of Replicas

  **1. Points of Agreement**
  1.  We agree that the hypothetical copy is physically indistinguishable from the original down to the atomic level, including all wear, chips, and material degradation.
  2.  We agree that scientific instrumentation cannot differentiate between the two objects.
  3.  We acknowledge that value is not purely monetary; sentimental and historical worth are valid categories of discussion.
  4.  We accept that knowledge of an object's origin influences our psychological response to it, even if the object itself remains unchanged.

  **2. Areas of Disagreement**

  | Aspect of Value | Position A (History Matters) | Position B (Indistinguishable is Same) |
  | :--- | :--- | :--- |
  | **Source of Authenticity** | Authenticity is derived from the object's unique causal history and provenance. | Authenticity is derived from the object's current physical properties and sensory experience. |
  | **Identity** | The object is defined by its continuous trajectory through time and space. | The object is defined by its configuration of matter at any given moment. |
  | **The 'Fake' Designation** | A copy is fundamentally distinct because it lacks the original's narrative origin, regardless of fidelity. | The designation 'fake' is irrelevant if the functional and aesthetic experience is identical. |
  | **Emotional Resonance** | Knowing an item is a replica diminishes its sentimental power because the connection to the past is severed. | Sentimental power resides in the interaction with the object's form; if the form is preserved, the sentiment remains. |

  **3. Cruxes and Test Cases**

  **Crux 1: Metaphysical Identity**
  *Does the history of an object constitute part of its essential identity, or is it merely container data?*
  *   **Test Case:** The Atom-Copy Machine produces a perfect replica of Mum's old ceramic cat, chips included. We swap the original for the copy on the mantelpiece without telling anyone.
  *   **Position A Prediction:** The object on the mantelpiece is no longer 'Mum's Cat'. It is a duplicate occupying the same space. The identity has been broken despite the visual continuity.
  *   **Position B Prediction:** The object on the mantelpiece is 'Mum's Cat' in every meaningful sense. The identity is preserved because the physical reality everyone interacts with is unchanged.

  **Crux 2: Sentimental Utility**
  *Does the knowledge of origin alter the emotional utility of the object?*
  *   **Test Case:** We hold the replica of Mum's old ceramic cat. We are explicitly told which one is the copy and which is the original. We must choose one to hold whilst grieving.
  *   **Position A Prediction:** Holding the copy will feel hollow or unsettling. The comfort derives from the knowledge that *this specific matter* was touched by Mum, which the copy lacks.
  *   **Position B Prediction:** Holding the copy will provide identical comfort. The feeling of the chips and the weight triggers the memory; the chemical history of the clay is irrelevant to the emotional response.

  **Crux 3: Ethical Destruction**
  *Is the destruction of the copy morally equivalent to the destruction of the original?*
  *   **Test Case:** A fire breaks out. We can only save one version of Mum's old ceramic cat (the original or the atom-perfect copy). Alternatively, someone smashes one intentionally.
  *   **Position A Prediction:** Saving the original is imperative. Destroying the original is a tragedy; destroying the copy is a mere inconvenience. They are not interchangeable.
  *   **Position B Prediction:** Saving either is equally valid. Destroying either is an equal loss, provided the other survives to maintain the form and memory. To prioritise one is irrational fetishism.
