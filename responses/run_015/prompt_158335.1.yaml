answer: |-
  Here is a 75-minute teaching arc designed to move philosophy grad students from a vague intuition about Occam's Razor to a precise understanding of Solomonoff Induction, while managing the "uncomputability" objection.

  ### 1. Dependency Order
  You cannot introduce the Universal Prior until they accept three premises in this specific order:
  1.  **Hypotheses are Generative:** A hypothesis isn't a statement; it's a program that *outputs* data.
  2.  **Complexity is Length:** The "size" of a hypothesis is the length of the shortest program that generates the data (Kolmogorov Complexity).
  3.  **Length is Cost:** Every additional bit of program length exponentially reduces the prior probability.

  If you skip (1), they treat programs like statistical parameters. If you skip (2), they revert to parameter counting. If you skip (3), they assume a flat prior over hypotheses.

  ### 2. The Carrying Example: "The Digits of Pi"
  **Scenario:** You are observing a stream of digits: `3, 1, 4, 1, 5, 9, 2, 6...`
  **Task:** Predict the next digit.

  **Why this example:**
  *   **What it must show:** It demonstrates that data which *looks* random (high entropy visually) can have a very short generative description (`print_pi()`). It contrasts a "weird-looking short program" (the Pi algorithm) against a "long intuitive one" (a lookup table or "it's just random noise").
  *   **What it must avoid:** It must not look like uniform sampling. You must emphasize that the "Random Noise" hypothesis is actually *longer* than the Pi hypothesis because to specify a random sequence of length $N$, you generally need $N$ bits. To specify Pi, you need only the code for the algorithm (constant bits).

  **How to run it:**
  1.  Show the sequence. Ask for predictions.
  2.  **Hypothesis A (Intuitive/Long):** "It's random noise." To predict the next digit, you must memorize the sequence so far. Program: `print [3, 1, 4, 1, 5, 9, 2, 6...]`. Length grows with every observation.
  3.  **Hypothesis B (Weird/Short):** "It's Pi." Program: `calculate_pi(n)`. Length is constant regardless of how many digits you observe.
  4.  **The Turn:** As $N$ grows, Hypothesis A becomes astronomically long. Hypothesis B stays short. Occam's Razor isn't about what looks "simple" to a human; it's about which program compresses the data best.

  ### 3. The 75-Minute Arc

  #### **00:00 – 10:00: The Occam Problem (Setting the Stage)**
  *   **Hook:** "Occam's Razor says 'pick the simplest explanation.' But 'simple' is vague. Is a linear regression with 2 parameters simpler than a neural net with 1000? What if the neural net fits better?"
  *   **Goal:** Establish that we need a *measure* of simplicity that is independent of human intuition or language.
  *   **Head off Misconception 1 ("Simplicity is parameter counting"):** Explicitly state: "We are not counting parameters. A polynomial with 1,000 fixed coefficients is 'complex' not because it has many variables, but because writing down those coefficients takes a lot of information."

  #### **10:00 – 25:00: Kolmogorov Complexity (The Measure)**
  *   **Definition:** Introduce $K(x)$ as the length of the shortest program on a universal Turing machine that outputs $x$ and halts.
  *   **Apply Example:** Use the **Digits of Pi**.
      *   Show that `print [3,1,4,1,5...]` is long.
      *   Show that `print_pi()` is short.
      *   **Crucial Point:** A sequence that looks patternless (Pi digits) has low $K$ if there is a rule. A truly random sequence has high $K$ (the shortest program is the sequence itself).
  *   **Check:** Ask: "If I give you a string of 1,000 ones, what is $K$?" (Low: `print '1' 1000 times`). "If I give you 1,000 random bits?" (High: `print [bits]`).

  #### **25:00 – 35:00: The Budget Framing (The Bridge to Probability)**
  *   **Timing:** Introduce this *after* the example, *before* the Universal Prior.
  *   **The Frame:** "Imagine you have to bet on which program is running the universe. You have a budget of bits. Every bit of program length costs you a factor of two in probability."
  *   **The Math:** $P(h) \propto 2^{-\text{length}(h)}$.
  *   **Head off Misconception 2 ("The Universal Prior is flat"):** This is the critical moment. Explain that we are *not* assigning equal probability to all hypotheses. We are assigning equal probability to all *programs of a specific length*, but shorter lengths get exponentially more weight.
      *   *Analogy:* "It's not that every story is equally likely. It's that every *bit* of complexity you add to your story halves its prior credibility."
  *   **Why here?** If you do this before the Pi example, they won't understand *why* length matters. If you do it after, they see length as the currency of belief.

  #### **35:00 – 50:00: Solomonoff Induction (The Prediction)**
  *   **Mechanism:** We don't pick *one* hypothesis. We sum over all programs consistent with the data so far, weighted by $2^{-\text{length}}$.
  *   **Prediction:** The prediction for the next bit is the weighted average of what all valid programs predict.
  *   **Convergence:** As data comes in, programs that output the wrong data are zeroed out. Programs that are too long (overfitting) are penalized by the budget. The short, correct program (Pi) eventually dominates the probability mass.
  *   **Key Insight:** This solves the "overfitting" problem. A lookup table fits the data perfectly, but its prior probability drops exponentially with every new data point. The Pi algorithm fits perfectly and maintains high prior probability.

  #### **50:00 – 60:00: The Uncomputability Bullet (The Catch)**
  *   **The Reveal:** "Here is the bad news. $K(x)$ is uncomputable. You cannot know for sure if you have found the shortest program."
  *   **Head off Misconception 3 ("Uncomputability makes this useless"):**
      *   **Reframe:** Do not present this as a bug. Present it as a **Normative Ideal**.
      *   **Analogy:** "Carnot efficiency in thermodynamics is unachievable, but it tells us the direction of engine design. Nash Equilibrium is often uncomputable in complex games, but it defines rational play. Solomonoff Induction defines *optimal inference*, even if we can only approximate it."
      *   **Practicality:** Mention that science *is* the approximation process (AIC, BIC, MDL are all computable cousins of this framework).
      *   **Tone:** "It tells us what we *would* do if we had infinite compute. It justifies why we *should* look for short theories, even if we can't prove they are the shortest."

  #### **60:00 – 70:00: Misconception Sweep & Discussion**
  *   Revisit the three misconceptions explicitly.
      1.  *Parameter Counting:* Reiterate that a long lookup table has infinite parameters effectively.
      2.  *Flat Prior:* Reiterate the $2^{-L}$ penalty.
      3.  *Uselessness:* Reiterate the "North Star" argument.
  *   **Open Q&A:** Let them challenge the "programs as hypotheses" metaphor.

  #### **70:00 – 75:00: The End Check**
  *   **Goal:** Confirm they grasp **Predictive Success vs. Ontological Truth**.
  *   **The Question:** "Suppose the universe is actually generated by a very long, complex program (high $K$). Does Solomonoff Induction fail?"
  *   **Desired Answer:** "No. It will eventually converge on the long program, but it will take more data. It assigns low *prior* probability to truth, but high *posterior* probability once the data forces it."
  *   **The Kicker:** "Does SI tell us the world *is* simple?"
  *   **Desired Answer:** "No. It tells us we should *bet* as if it is simple until proven otherwise, because simple hypotheses risk less probability mass to be wrong." (This distinguishes instrumentalism from realism).

  ### 4. Formal Detail to Openly Omit
  **Prefix-Free Codes (Kraft's Inequality).**
  *   **What it is:** The technical requirement that no valid program is a prefix of another valid program, which ensures $\sum 2^{-L} \le 1$.
  *   **Why omit:** It requires a digression into coding theory that will stall the philosophical arc.
  *   **How to handle it:** "To make the probabilities sum to 1, we require programs to be 'self-delimiting' (prefix-free). This technical constraint ensures the math works, but for our purposes, just accept that valid programs form a probability distribution."
  *   **Why say so:** Explicitly telling them you are skipping a technicality builds trust. It shows you know the gap but deem it non-essential for the conceptual link between complexity and prediction.

  ### 5. Summary of Misconception Mapping

  | Misconception | When it arises | Where you head it off | How |
  | :--- | :--- | :--- | :--- |
  | **"Simplicity = Parameter Counting"** | During Kolmogorov Definition | **Min 15** (Pi Example) | Show that a lookup table (many params) is longer than an algorithm (few params). |
  | **"Universal Prior is Flat"** | During Prior Definition | **Min 30** (Budget Framing) | Explicitly teach $2^{-L}$. "Every bit costs a factor of two." |
  | **"Uncomputable = Useless"** | After Uncomputability Reveal | **Min 55** (Normative Reframe) | Compare to Carnot Efficiency / Ideal Rationality. It's a standard, not a tool. |

  ### 6. Budget Framing Timing Decision
  **Place the Budget Framing *after* the Pi Example but *before* the Universal Prior.**
  *   **Reasoning:** The Pi example establishes that "Length" is the correct measure of complexity. Once they accept Length = Complexity, the Budget Framing explains why Complexity = Improbability. If you introduce the budget first, they ask "Why bits?" If you introduce it after the example, they ask "Okay, how does length translate to belief?" and you have the answer ready.
