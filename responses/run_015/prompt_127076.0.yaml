  ### The Principle of Artifact Continuity

  Yes, a single principle can capture all seven verdicts, but it requires a specific distinction between **passive matter** and **active configuration**, and between **external curation** and **internal regeneration**. Your intuition about "causal-process continuity" is correct, but for artifacts (like statues), that continuity must be mediated by **external intentional maintenance** whenever the defining form is lost.

  Here is the precisely stated principle:

  **The Principle of Artifact Continuity**
  An artifact (e.g., a statue) persists as the same object if and only if:
  1.  **Form Primacy:** Its identity is tied to its specific structural configuration (Form), not its constituent material (Matter).
  2.  **Continuous Instantiation:** That Form is continuously instantiated in Matter without interruption.
      *   *Clause 2a (Material Replacement):* Matter may be replaced gradually, provided the Form remains intact during the replacement.
  3.  **The Curation Exception:** If the Form is interrupted (destroyed or disassembled), identity persists *only if*:
      *   (a) The original structural components (fragments/parts) retain their specific individual identity (they are not homogenized); **AND**
      *   (b) The restoration is performed by an **external agent** acting with the specific intent to preserve *that* historical instance.

  ---

  ### Mapping the Principle to Your Verdicts

  *   **Case 1 (Squash):** Fails **Continuous Instantiation**. Form is lost. No restoration. **Verdict: Destroyed.**
  *   **Case 2 (Gradual Replacement):** Satisfies **Continuous Instantiation** and **Clause 2a**. Form never lost; matter replaced. **Verdict: Same Statue.**
  *   **Case 3 (Shatter & Glue):** Satisfies **The Curation Exception**. Form was interrupted, but (a) fragments retained local structure, and (b) an external conservator restored it. **Verdict: Same Statue.**
  *   **Case 4 (Vaporize & Print):** Fails **Causal Link** (implicit in Form Primacy). The new form is causally linked to a *blueprint*, not the original matter/form instance. **Verdict: Replica.**
  *   **Case 5 (Coincidence):** Fails **Causal Link**. No causal chain to origin. **Verdict: Duplicate.**
  *   **Case 6 (Smart Clay Self-Repair):** Fails **The Curation Exception**. Form was interrupted (became a ball). Restoration was **internal** (actuators), not external. The object acted as a machine generating a statue, not a statue persisting. **Verdict: New Statue.**
  *   **Case 7 (Factory Maintenance):** Satisfies **Continuous Instantiation**. Form never absent; external log/agents maintain the instance. **Verdict: Same Statue.**

  ### Resolving the Conflict: Case 2 vs. Case 6

  You identified Case 6 as the threat to coherence. Here is how the principle distinguishes them without sacrificing either verdict:

  *   **Case 2** is **Hot Swapping**. The "service" (the Statue Form) never goes down. The "hardware" (Clay) is replaced while the system is running. Identity is preserved because the *state* (Form) is never lost.
  *   **Case 6** is **Redeployment**. The "service" (Statue Form) goes down (it becomes a Ball). It then comes back up using an internal script. In software terms, this is spinning up a new instance from a backup image, even if it runs on the same server. Because the *Form* ceased to exist, and the restoration relied on *internal programming* rather than external curation of the specific instance, the causal chain of the *artifact* is broken. The "Smart Clay" persists, but the "Statue" does not.

  **Do you have to sacrifice a verdict?**
  To maintain *minimal* complexity, **Case 6** is the most vulnerable. A simpler principle ("Continuity of Causal Process") would classify Case 6 as the *same* statue, arguing that the smart clay's internal mechanism is just a very fast, internal version of the conservator's work. If you find the distinction between "internal actuator" and "external conservator" too arbitrary for your needs, you should concede that Case 6 *is* the original statue. However, if you hold firm that artifacts require external validation to persist through destruction, the principle above holds all seven without contradiction.

  ---

  ### Predictions for New Cases

  **Case 8(a): Disassembled into a labeled box of parts for one day, then reassembled in original order.**
  *   **Analysis:** The Form is interrupted (disassembled). However, the parts are **labeled** (satisfying *Curation Exception 3a*: specific individual identity is retained) and they are reassembled by an agent (satisfying *3b*: external intent). This is structurally identical to Case 3 (Shatter & Glue), just more organized.
  *   **Verdict:** **This is the original statue.**
  *   **Reasoning:** The "Instance ID" is preserved in the labels and the specific arrangement of the original parts. The downtime (one day) is incidental, similar to the time taken to glue fragments in Case 3.

  **Case 8(b): Gradually replaced as in Case 2, but during the process the museum closes for a year and the form is absent from display, though the parts are stored together in a single container.**
  *   **Analysis:** This case breaks **Continuous Instantiation**. Unlike Case 2, the Form is *absent*. Unlike Case 8(a), the parts are in a "single container" without mention of labeling or specific arrangement tracking. This implies the parts are treated as bulk material (homogenized context) rather than specific structural components. This aligns with Case 6 (Form lost, material persists) and Case 7 (which explicitly noted "form is never absent" as a condition for survival).
  *   **Verdict:** **This is not the original statue.**
  *   **Reasoning:** The gap of one year where the "Statue" state did not exist breaks the continuous instantiation. Without the "labeled parts" safeguard from 8(a), the reassembly is effectively a reconstruction from stored materials (like Case 4 or 6), not a restoration of a paused instance. The factory log (Case 7) is insufficient if the Form itself ceases to exist for a significant duration without specific part tracking.

  ### Summary of Conceptual Structure

  Your intuition maps closely to **State Persistence** in distributed systems:
  1.  **State (Form)** is more important than **Storage (Matter)**.
  2.  **Zero-Downtime Deployment** (Case 2, 7) preserves Instance ID.
  3.  **Crash Recovery** (Case 3, 8a) preserves Instance ID *only if* logs/state are intact and an external admin restores them.
  4.  **Reinstallation from Image** (Case 4, 6, 8b) creates a *new* Instance ID, even if the data/content is identical, because the running process was terminated and restarted from a definition rather than resumed.

  Case 6 is the critical boundary: it looks like Crash Recovery, but because the "restore script" is internal to the hardware, it counts as Reinstallation. For an artifact to survive death, it must be resurrected by another, not by itself.
