answer: |-
  You have identified a very real and sophisticated rhetorical maneuver, but there is **no single, canonical term** for it in the way "Ad Hominem" or "Straw Man" exist.

  However, in philosophy of science, economics, and science and technology studies (STS), this pattern is recognized as a specific subtype of **Epistemic Double Standards**.

  If we were to coin a precise term for the specific "toggle" you are describing—where uncertainty is used as a shield against opposing models but ignored in favor of one's own—the most accurate label would be **"Uncertainty Arbitrage."**

  Here is a breakdown of the concept, why existing terms fall short, and how to distinguish it from hypocrisy or sloppiness.

  ### 1. The Keynesian Context
  First, your reading of Keynes is correct. In *A Treatise on Probability* (1921), Keynes distinguishes between **risk** (where probabilities are calculable, like a die roll) and **uncertainty** (where the logical relation between evidence and hypothesis is non-quantifiable).

  Crucially, Keynes introduces the concept of the **"weight of argument."** He argues that confidence isn't just about the probability value (e.g., 50%); it's about the *amount* of relevant evidence. Paradoxically, acquiring new evidence can sometimes reveal underlying complexities that lower the "weight" of our confidence, even if the numerical probability remains the same. This is the philosophical bedrock of the argument that some future events (ecosystem collapse, radical financial innovation) are genuinely non-ergodic and cannot be modeled by standard risk curves.

  ### 2. The Phenomenon: "Uncertainty Arbitrage"
  While philosophers might call this an **Epistemic Double Standard**, that term is too broad. It covers any situation where someone holds others to a different standard of proof.

  **Uncertainty Arbitrage** is more specific. It describes the act of trading on the *boundary* between risk and uncertainty to gain argumentative advantage.
  *   **The Short Position:** When an opponent uses a quantitative model (e.g., a cost-benefit analysis of carbon taxes), the arbitrageur declares the domain to be one of **Knightian/Keynesian Uncertainty**. They argue the model is epistemically invalid because the variables are unknowable.
  *   **The Long Position:** When proposing their own solution (e.g., immediate regulation or a different tax scheme), they implicitly treat the domain as **Risk**. They rely on implicit probability distributions (e.g., "the expected damage is high enough to warrant action") without subjecting their own premises to the same uncertainty critique.

  ### 3. Why It Is Not Just "Hypocrisy"
  Hypocrisy is a moral or behavioral inconsistency (e.g., "I tell you not to fly, but I fly"). It is about *actions* vs. *precepts*.

  Uncertainty Arbitrage is an **methodological inconsistency**. It is about *rules of knowledge* vs. *rules of knowledge*.
  *   **Hypocrisy:** "I use models when it suits me, and I don't use models when it suits me."
  *   **Arbitrage:** "The *nature of reality* prevents your model from working, but the *nature of reality* allows my policy to be optimal."

  The arbitrageur claims their inconsistency is justified by the *world*, not by their *preferences*. They argue that the opponent's model fails because the world is uncertain, while their policy succeeds *despite* the uncertainty (often invoking the Precautionary Principle). This makes it harder to counter than hypocrisy because it claims a higher philosophical ground.

  ### 4. Why It Is Not Just "Sloppiness"
  Sloppiness implies unintentional error or lack of rigor. Uncertainty Arbitrage is often **strategically rigorous**.
  *   The actor is usually very precise about *why* the opponent's model fails (citing fat tails, non-stationarity, or black swans).
  *   They are often very precise about *why* their policy works (citing robustness, resilience, or minimax regret).

  The "sloppiness" only appears when you view the two arguments as a single system. Viewed separately, each side often maintains internal consistency. The error is in the **boundary condition**: moving the line between "quantifiable" and "unquantifiable" depending on which side of the line benefits their conclusion.

  ### 5. Related Academic Concepts
  If you want to research this further, these are the established terms that orbit this concept:
  *   **Motivated Skepticism:** (Gilovich et al.) The tendency to apply stricter scrutiny to evidence that contradicts one's beliefs than to evidence that supports them.
  *   **Agnotology:** (Proctor/Schiebinger) The study of culturally induced ignorance. This is close, but usually refers to *creating* uncertainty (e.g., tobacco companies), whereas your example is about *invoking* existing uncertainty selectively.
  *   **The Precautionary Principle Paradox:** Critics argue the Precautionary Principle is incoherent because it demands action to prevent harm, but if the harm is truly uncertain, the cost of the action is also uncertain. Using it to block Model A while enabling Policy B is a version of this paradox.
  *   **Politicization of Uncertainty:** (Oreskes/Conway) How uncertainty is managed in public debate. They note that uncertainty is often framed as a reason for *inaction* by one side and *urgent action* by the other.

  ### 6. Definition for Your Argument
  If you need to define this in your debate, you can use this formulation:

  > **Uncertainty Arbitrage:** *A rhetorical strategy in policy debate where an actor asymmetrically applies epistemic standards regarding risk and uncertainty. The actor invokes deep (Keynesian) uncertainty to invalidate opposing quantitative models (treating them as false precision), while simultaneously relying on implicit quantitative assumptions to justify their own preferred policies (treating them as robust). This creates a one-way epistemic gate where uncertainty functions as a shield against criticism but not as a constraint on advocacy.*

  ### Summary
  Your friend is right that Keynes's insight is profound, but you are right that its rhetorical application is often broken. The specific "toggle" you noticed doesn't have a famous name like "The Keynesian Fallacy," but **Uncertainty Arbitrage** or **Epistemic Boundary Shifting** captures the mechanism. It differs from hypocrisy because it manipulates the *criteria for truth* rather than just behavior, and it differs from sloppiness because it is often internally consistent within each silo, only failing when the silos are compared.
