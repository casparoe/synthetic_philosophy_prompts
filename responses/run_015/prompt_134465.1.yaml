answer: |-
  This is a genuinely clever pivot. Moving from a descriptive model ("I see red" = tracking a property) to a normative one ("I see red" = committing to a stance) sidesteps the need for qualia to push physical neurons around directly. Instead, you only need the *practice* of making these commitments to be causally viable. It's basically expressivism about consciousness, similar to how emotivism works in ethics.

  However, that hidden issue you flagged about relocating the exclusion problem is the make-or-break here. If normative facts are also causally inert, you haven't solved the paradox; you've just pushed it back one step. Now we need to explain how inert normative facts govern our speech acts. This absolutely changes the priorities. It means you can't spend two years fleshing out the semantics (Question 1) only to find out the metaphysics of norms (Question 2) kills the project. You need to hit the metaphysical viability of normative causation much earlier than you might think. But, you still can't analyze the causation of norms without knowing what kind of norms they are. So, semantics stays upstream, but the metaphysical check becomes the critical bottleneck immediately after.

  Here's how I'd order the next 2-3 years. You start by pinning down exactly what kind of speech act a phenomenal report is. Once you have that, you immediately test whether that kind of norm can play a role in a physical world without violating causal closure. If that passes, you move to action theory to explain how the commitment translates to speech. Then you stress-test it with error cases (can I be wrong about my pain?). Finally, you evaluate if this actually kills the zombie judgment paradox or just renames it.

  The tractability here is actually pretty good for a solo philosopher. You don't need a lab; you need conceptual clarity and argumentative rigor. The biggest time sink will be Question 2, because the meta-ethics literature on normative causation is dense. If you find that normative facts *can't* play a causal role without being naturalized, you might have to pivot to a constitutive explanation rather than a causal one. If that happens, Question 3 (Action Theory) becomes more important than Question 2, because you'd need to explain action without causal norms. But for now, I'm keeping the order linear based on the assumption that you need to validate the norms before explaining their function.

  Here is the breakdown of the questions, followed by the table you requested.

  ### The Ordered Questions

  **1. What is the precise semantic function of phenomenal reports under a normative framing?**
  This is the foundation. You need to decide if "this hurts" is an expression (like "ouch!"), a prescription (like "attend to this!"), or a commitment to a rule. If you get this wrong, the rest of the project is built on sand. This is highly tractable for solo work because it's mostly conceptual analysis and engaging with expressivist literature in meta-ethics and philosophy of language.

  **2. Do normative facts face their own causal exclusion problem?**
  This is the hidden issue you flagged. If normative facts are real but causally inert, you're back to square one. You need to determine if normative facts can be causal, or if you need a non-causal account of how norms explain behavior (e.g., constitutive explanation). This is upstream of everything else because if norms can't explain behavior, the view fails. It's less tractable than Q1 because it dips into heavy metaphysics and meta-ethics.

  **3. How do normative commitments interface with physical action generation?**
  Once you know what the norms are and that they can explain things, you need the mechanism. How does a "commitment" turn into vocal cords moving? This bridges your metaphysics with action theory. It's moderately tractable but requires careful wiring to avoid smuggling in causal qualia by the back door.

  **4. How does the view account for phenomenal error or misclassification?**
  A major objection to expressivism is accounting for mistake. If "this hurts" is just a commitment, can I be wrong? If I can't be wrong, the view loses plausibility. If I can be wrong, what makes me wrong? This is downstream because you need the semantics and metaphysics in place to define "error." It's a good stress test for the second year.

  **5. Does this dissolve the zombie judgment paradox or just hide it?**
  This is the final evaluation. Even if the previous four work, does it actually solve the original problem? Or does it just make the paradox less annoying? This is the synthesis step for the end of the 3-year arc.

