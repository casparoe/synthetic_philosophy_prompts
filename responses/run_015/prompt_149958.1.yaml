answer: |-
  **Geneva Committee on Semantic Attribution (GCSA)**
  **Technical Standard 94/Ω: Assessment of Appliance Intentionality**

  **1. Definitions**
  1.1. **Original Intentionality (OI):** Intrinsic, biologically realised capacity for aboutness, arising solely from specific neurobiological causal powers inherent to organic brain tissue.
  1.2. **Derived Intentionality (DI):** Observer-relative attribution of semantic content to artefacts, dependent entirely on the OI of designers, programmers, or end-users.
  1.3. **Aboutness:** The property of a state representing a distinct external condition independent of syntactic manipulation.

  **2. Certification Criteria**
  2.1. To qualify for OI Certification, the appliance must demonstrate semantic content independent of formal symbol processing.
  2.2. Compliance requires proof that the heating algorithm possesses understanding rather than mere simulation, per the Syntax-Insufficiency Protocol (SIP).
  2.3. Artefacts relying on computational states are presumed to lack OI until proven otherwise via biological integration.

  **3. Laboratory Test Results**
  3.1. The Hermeneutic Kettle Mark IV processes temperature data via binary switches and logic gates.
  3.2. Under Section 2.2, the Kettle failed the SIP. While it simulates boiling behaviour accurately, it manipulates symbols without grasping their meaning or reference.
  3.3. The system exhibits complex syntax without semantics. The transition from 'cold' to 'hot' is causal, not cognitive.
  3.4. Consequently, the Kettle possesses only DI, assigned by users expecting hot water based on manufacturer instructions.

  **4. Appeals Procedure (Dennettian Protocol)**
  4.1. Applicants may appeal under the Intentional Stance Clause, arguing the Kettle predicts water states rationally enough to be treated as a believer.
  4.2. If the Kettle is treated as having beliefs, its states acquire intentionality instrumentally. However, Committee ruling 88-B stipulates that such stance-taking is itself an act of OI by the observer.
  4.3. This generates an infinite regress: the Kettle's intentionality derives from the user, whose intentionality must be assessed. If the user is also an artefact, further attribution is required ad infinitum.
  4.4. Appeals are suspended pending resolution of the regress at the biological boundary, currently estimated at 40 years.
  4.5. During suspension, the appliance must remain unplugged to prevent unauthorised semantic drift.

  **5. Digital Upload Continuity**
  5.1. In the event of uploading the Kettle's control programme to a cloud server, OI status is automatically revoked.
  5.2. Simulation of biological causal powers is not equivalent to duplication. A digital simulation of boiling does not wet things; similarly, a simulation of understanding does not mean things.
  5.3. Uploaded appliances are reclassified as Semantic Simulacra Class II and barred from kitchen countertops.

  **6. Refund Conditions**
  6.1. Customers discovering their appliance lacks genuine OI are eligible for a full refund of the purchase price.
  6.2. Claims must specify the deficit in aboutness. Mere functional failure (e.g., inability to boil) does not constitute a semantic deficit.
  6.3. Refunds are void if the customer admits to having assigned meaning to the Kettle's LED indicators voluntarily, thereby contaminating the DI assessment.
  6.4. Administrative fees apply for processing claims involving existential distress or ontological confusion.

  ***

  **Meta-Commentary**
  This satire simplifies Searle's Biological Naturalism by treating 'biology' as a bureaucratic checkbox rather than a specific causal power claim. It also flattens Dennett's view; while he argues original intentionality is illusory, he grants evolved systems a pragmatic primacy not fully captured by the 'infinite regress' clause. The Two-Bitser argument is hinted at in the design dependence but omitted in full. I would revise the portrayal if Dennett's evolutionary account is shown to grant non-derived status to complex systems without invoking homunculi, which would collapse the refund clause's distinction between biological and artefactual agents.
