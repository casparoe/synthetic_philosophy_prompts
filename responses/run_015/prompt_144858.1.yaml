      *   **Topic:** Ethics of belief, specifically reinterpreting the James vs. Clifford debate through a distinction between *causally* confidence-dependent propositions and *constitutively* confidence-dependent propositions. The goal is to argue for a third doxastic attitude (distinct from belief and acceptance) governed by specific norms.
      *   **Constraints:**
          *   Around 800 words.
          *   No bibliography/citations.
          *   No reliance on external sources that need lookup (stand on arguments).
