prompt: |-
  I sit on the panel at our council that signs off adult social-care support plans — fortnightly, a dozen or so cases a sitting, and whatever we decide goes in a file someone can challenge, so it needs to be defensible on paper and gettable in about ten minutes a case by someone with a social work degree and no philosophy.

  What we keep tying ourselves in knots over: someone says "I don't want a carer from that estate", "I'd rather not go to the day centre, that's for people worse off than me", "I don't want to be a burden on my daughter" — and we can't tell whether that's a preferance we should simply respect or a bias (internalised stigma, an expectation worn down by years of being told no) that we'd be colluding with by writing it into the plan. Overriding it feels patronising; honouring it feels like laundering a bias as a preference.

  Three tests I've been kicking around and can't get to work: substitution — if swapping in a higher-status version of the same option flips the reaction ("no carer from a professional family, they'd look down on me"), we're tracking status, not the option; who bears the cost — it counts only if they still hold it when honouring it costs them something they independently want; take-back — if the option were free, easy and nobody would know, would they take it? What makes me doubt all three is that people endorse their own adaptations sincerely, so asking them doesn't settle it either.

  Turn this into a procedure we can run: the questions in order, what counts as a good enough answer to each, where it stops with "respect it", where it stops with "that's bias, don't build it in", and where it has to hand the call to a person because it's a values question not a factual one. Say plainly which of my three tests to keep, fix or bin. Lead with the bottom line in one sentence, then the reasoning. Then run it on: a 78-year-old man refusing a male carer; a woman who'd rather have fewer hours than ask her son for help; and a resident who won't go to the day centre because "that's where they put the people with dementia" — I expect not to like what it says about at least one of those.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Panel member for adult social-care support plans (council level).
      *   **Context:** Fortnightly sittings, ~12 cases, 10 mins/case. Decisions must be defensible on paper, understandable by social workers (no philosophy degree).
      *   **Core Problem:** Distinguishing between genuine *preference* (to be respected) and *internalized bias/stigma* (collusion if respected, patronizing if overridden). Examples: "No carer from that estate," "Day centre is for people worse off," "Don't want to be a burden."
      *   **User's Proposed Tests:**
          1.  *Substitution:* Swap status, does reaction flip?
          2.  *Cost:* Do they hold it when it costs them something they want?
          3.  *Take-back:* If free/easy/secret, would they take it?
      *   **User's Doubt:** People sincerely endorse their own adaptations, so self-reporting isn't enough.
      *   **Task:** Turn this into a runnable procedure (questions in order, pass/fail criteria, decision points). Evaluate the user's three tests (keep/fix/bin). Apply to three specific cases.
      *   **Constraint:** Lead with the bottom line in one sentence. Then reasoning. Then the procedure. Then the case applications.
      *   **Tone:** Practical, defensible, clear, ethical but grounded in social work reality.
      *   **Warning:** "I expect not to like what it says about at least one of those." (Implies one case might require overriding the preference or acknowledging a hard truth).

  2.  **Evaluate the User's Tests:**
      *   *Substitution Test:* Good for detecting classism/status anxiety. Hard to run in 10 mins (requires hypotheticals). *Verdict: Keep but simplify.*
      *   *Cost Test:* Crucial. If they refuse the "stigmatized" option but accept a worse outcome for themselves, it's a value. If they refuse the option but demand *more* resources to avoid it, it might be bias leveraging public funds. *Verdict: Keep and refine as the "Trade-off" test.*
      *   *Take-back Test:* "If nobody knew..." This probes shame. If they'd do it secretly, it's stigma. *Verdict: Keep as the "Privacy" test.*
      *   *Missing Element:* Safety and Capacity. The Care Act 2014 (assuming UK context based on "council", "social-care", "estate") prioritizes wellbeing and safeguarding. A preference cannot override safety or legal duties. Also, the distinction between *outcome* and *process*.
      *   *Refinement:* The procedure needs to be linear and binary where possible for defensibility.

  3.  **Develop the Procedure (The "Bias vs. Preference Protocol"):**
      *   *Goal:* Distinguish "Autonomous Choice" from "Oppressive Constraint."
      *   *Step 1: Capacity & Safety.* (Non-negotiable). If they lack capacity or it's unsafe, the debate ends.
      *   *Step 2: The "Why" (Narrative).* Is the reason about *their* experience or about *others'* judgment?
      *   *Step 3: The Trade-off (User's Cost Test).* Are they willing to absorb the cost?
      *   *Step 4: The Privacy (User's Take-back Test).* Is it about shame?
      *   *Decision Tree:*
          *   Passes all = Respect Preference.
          *   Fails Trade-off (wants public money to avoid stigma) = Challenge/Negotiate.
          *   Fails Privacy (ashamed) = Support work needed, but maybe respect short-term.
          *   Fails Safety = Override.

  4.  **Drafting the Procedure:**
      *   Need to make it fit the "10 minutes, social work degree" constraint. No jargon.
      *   *Test 1 (Capacity/Safety):* Gatekeeper.
      *   *Test 2 (The 'Who' Test - Refined Substitution):* Is the objection about the *task* or the *label*?
      *   *Test 3 (The 'Cost' Test):* Who pays the price of this preference?
      *   *Test 4 (The 'Secret' Test - Refined Take-back):* Is it shame?

  5.  **Applying to Cases:**
      *   *Case 1: 78M refusing male carer.*
          *   Likely privacy/dignity. Usually respected unless no female carers available (then it's a resource issue).
          *   *Verdict:* Respect (Preference).
      *   *Case 2: Woman refusing son's help to avoid burden.*
          *   This is the tricky one. "Not wanting to be a burden" is often internalized ageism/ableism.
          *   *Test:* If she takes fewer hours, she risks safety. Who pays? She pays in safety, Council pays in risk.
          *   *Verdict:* This is the one the user might not like. It's likely *bias* (internalized stigma of dependency). The plan should encourage family support *if* the son is willing, or reframe the care not as a burden but as a right. However, legally, you can't force the son. But you shouldn't underfund *her* based on *her* guilt.
      *   *Case 3: Resident refusing day centre ("for people with dementia").*
          *   Stigma.
          *   *Test:* Is there an alternative? If she isolates herself, wellbeing drops.
          *   *Verdict:* Bias. Colluding isolates her. Need to challenge or find alternative social contact.

      *Wait, I need to look closer at Case 2.* The prompt says "I expect not to like what it says about at least one of those."
      *   Case 1 (Gender): Standard practice, usually respected.
      *   Case 3 (Dementia stigma): Clear stigma. Should be challenged.
      *   Case 2 (Burden): This is often treated as "noble," but ethically it's often self-sacrifice born of stigma. If the procedure identifies this as bias, it means the panel should *not* sign off on reduced hours based solely on that reason. They should explore *why* she feels like a burden. This might be the uncomfortable one: acknowledging that respecting her "wish" actually harms her wellbeing (a Care Act principle).

  6.  **Refining the "Bottom Line":**
      *   Needs to be punchy. "Respect choices that cost the chooser; challenge choices that cost the community or compromise safety to appease shame."

  7.  **Refining the Tests for the Procedure:**
      *   *Bin:* The "Substitution" test is too abstract for a 10-min chat.
      *   *Keep/Fix:* "Cost" becomes "Who absorbs the risk?" "Take-back" becomes "Is this about privacy or shame?"
      *   *Add:* "Wellbeing Impact." (Care Act 2014 requirement).

  8.  **Finalizing the Procedure Structure:**
      *   **Gate:** Capacity/Safeguarding.
      *   **Q1 (Source):** Is the reason internal (comfort) or external (judgment)?
      *   **Q2 (Cost):** Does honoring this reduce the budget or increase risk?
      *   **Q3 (Secret):** Would they do it if no one saw?
      *   **Outcomes:** Respect, Challenge, or Escalate.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case 2:* If she refuses son's help, she is asking for *fewer* hours. This saves money but risks her. Is this bias? Yes, "burden" is a social construct. But can we force her to accept help? No. But we can refuse to *authorize* a plan that leaves her unsafe based on a false premise. The panel's job is to sign off a plan that meets *needs*, not just wants. If the need is 10 hours and she asks for 5 due to guilt, signing off 5 is negligence. That's the hard truth.
      *   *Self-Correction on Case 3:* "That's for people with dementia." If she has dementia, it's denial. If she doesn't, it's stigma. Either way, isolating based on label is bias.
      *   *Self-Correction on Case 1:* Gender is a protected characteristic. Respect is legally safer.

  10. **Final Review against Constraints:**
      *   One sentence bottom line? Yes.
      *   Reasoning? Yes.
      *   Procedure (questions, pass/fail)? Yes.
      *   Evaluate user's tests? Yes.
      *   Run on 3 cases? Yes.
      *   Tone check: Professional, direct, not academic.

  11. **Final Polish:** Ensure the distinction between "Preference" (valid) and "Bias" (invalid basis for public resource allocation) is clear. The key is the *Care Act Wellbeing Principle*. If a preference undermines wellbeing due to stigma, it's not a valid preference for planning purposes.

      *(Self-Correction during drafting)*: I need to be careful not to suggest the panel can force care. They sign off *plans*. If the plan doesn't meet needs because of bias, the plan is defective. The procedure should guide whether to *accept the restriction* in the plan or *require work* to address it.

      *Revised Bottom Line:* "Respect preferences that reflect personal values and cost the chooser; challenge restrictions that stem from shame and compromise safety or wellbeing to save face."

      *Let's sharpen the tests.*
      1.  **Capacity/Safety:** (Gate)
      2.  **The 'Label' Test (Fixed Substitution):** Is the objection to the *activity* or the *category* of person/place?
      3.  **The 'Trade-Off' Test (Fixed Cost):** Is the person accepting the consequence, or passing the risk to the council?
      4.  **The 'Privacy' Test (Fixed Take-back):** Is this about dignity or shame?

      *Case 2 Analysis:* She wants fewer hours. She bears the cost (less care). But the Council bears the risk (safeguarding/neglect). If the need is assessed at X hours, reducing to Y due to "burden" creates a risk the Council manages. This is where the panel must push back.

      *Case 3 Analysis:* Refusing day centre. Leads to isolation. Wellbeing harm. Bias.

      *Case 1 Analysis:* Gender. Privacy/Dignity. Valid.

      *Okay, ready to write.*
answer: |-
  **Bottom line:** Respect preferences that reflect personal values and cost the chooser; challenge restrictions that stem from shame and compromise safety or wellbeing to save face.

  ### Reasoning
  Your three tests are intuitively correct but operationally too slow for a ten-minute decision. The **Substitution Test** is too abstract for a paper trail; the **Cost Test** is your strongest asset but needs to distinguish between "personal sacrifice" and "public risk"; the **Take-back Test** is essential for identifying shame but needs to be phrased as a privacy question.

  The procedure below adapts your tests into a linear "Bias vs. Preference Protocol" compliant with the Care Act wellbeing principle. It shifts the focus from "what they want" to "why they want it" and "who pays for it." If a preference is driven by internalised stigma (bias) and results in unmet needs or isolation, signing it off is not respecting autonomy; it is facilitating self-neglect.

  ### The Procedure: Bias vs. Preference Protocol
  **Time:** 10 minutes per case.
  **Users:** Social workers and Panel members.
  **Goal:** Defensible decision on whether to write a restriction into the support plan.

  #### Step 1: The Gate (Capacity & Safety)
  *   **Question:** Does the person have capacity to make this decision, and does honoring it create an immediate safeguarding risk?
  *   **Pass:** Capacity confirmed, no immediate physical risk. -> *Go to Step 2.*
  *   **Fail:** Lacks capacity OR risk is critical (e.g., refusing hygiene care leading to infection). -> *Stop.* Do not honor preference. Best Interest Decision / Safeguarding referral required.

  #### Step 2: The Label Test (Refined Substitution)
  *   **Question:** Is the objection to the *task* itself, or to the *social label* of the person/place providing it?
  *   **Good Answer (Preference):** "I don't like strangers washing me" (Task/Intimacy).
  *   **Bad Answer (Bias):** "I don't want *that kind* of carer" or "That centre is for *those kind* of people" (Status/Label).
  *   **Decision:** If Bad Answer, flag as potential bias. Proceed to Step 3.

  #### Step 3: The Trade-Off Test (Refined Cost)
  *   **Question:** Who absorbs the negative consequence of this choice?
  *   **Good Answer (Preference):** "I know I'll be more tired/dirty/lonely, but I prefer it." (Chooser bears the cost).
  *   **Bad Answer (Bias):** "I'll take fewer hours so I don't feel guilty, even if I can't cope." (Council bears the risk of failure/neglect).
  *   **Decision:** If Bad Answer, do not sign off the reduced plan. Require a review of needs vs. wishes.

  #### Step 4: The Privacy Test (Refined Take-back)
  *   **Question:** If this service were invisible (no uniform, no one knew you went), would you still refuse it?
  *   **Good Answer (Preference):** "Yes, I still don't want them in my home." (Genuine boundary).
  *   **Bad Answer (Bias):** "No, if nobody knew, I'd be fine with it." (Shame/Stigma).
  *   **Decision:** If Bad Answer, this is internalised stigma. The plan must include work to address the stigma, not just accommodate the refusal.

  #### Decision Matrix
  1.  **Passes Step 2 (Task not Label):** **Respect.** Write into plan.
  2.  **Passes Step 2, Fails Step 3 (Chooser bears cost):** **Respect.** Write into plan (with risk acknowledgment).
  3.  **Fails Step 2 (Label) AND Fails Step 4 (Shame):** **Challenge.** Do not write as a fixed preference. Note as "Work required to address stigma."
  4.  **Fails Step 3 (Public Risk):** **Escalate.** Cannot sign off plan that leaves needs unmet due to guilt.

  ---

  ### Application to Cases

  #### Case 1: 78-year-old man refusing a male carer.
  *   **Step 1 (Gate):** Pass. Capacity intact, no immediate safety risk if delayed.
  *   **Step 2 (Label):** **Pass.** Objection is to gender/intimacy, not status. This is a privacy boundary, not a class judgment.
  *   **Step 3 (Trade-off):** **Pass.** He accepts the wait time for a female carer.
  *   **Step 4 (Privacy):** **Pass.** Even if invisible, he likely prefers a female for intimate care.
  *   **Verdict:** **Respect.** This is a valid preference regarding bodily autonomy and dignity. Write into plan: "Female carers only for personal care."

  #### Case 2: Woman requesting fewer hours to avoid being a "burden" on her son.
  *   **Step 1 (Gate):** Pass. Capacity intact.
  *   **Step 2 (Label):** **Fail.** The objection is to the *label* of "burden" and the role of "care recipient," not the task of receiving help.
  *   **Step 3 (Trade-off):** **Fail.** She wants fewer hours (reduced cost to council?), but the risk is her safety/wellbeing if needs are unmet. The Council bears the liability if she falls because she wouldn't "burden" her son.
  *   **Step 4 (Privacy):** **Fail.** If the help were invisible (e.g., anonymous drop-in), she might accept it. The refusal is about *shame*, not the help itself.
  *   **Verdict:** **Challenge (The Uncomfortable One).** Do not sign off the reduced hours. This is internalised stigma compromising wellbeing.
      *   *Action:* The plan must meet the *assessed need*, not the *guilt-reduced wish*. You cannot force the son to help, but you cannot underfund her care to accommodate her shame. The support plan should fund the full hours needed. If the son *offers* help, that's a natural support, but it cannot replace statutory care based on her feeling like a burden. Signing off fewer hours launders her stigma as a budget saving.

  #### Case 3: Resident refusing day centre ("That's where they put the people with dementia").
  *   **Step 1 (Gate):** Pass.
  *   **Step 2 (Label):** **Fail.** Objection is explicitly to the *category* of person associated with the venue.
  *   **Step 3 (Trade-off):** **Fail.** The cost is isolation and decline in cognitive function. The Council bears the cost of accelerated decline/safeguarding.
  *   **Step 4 (Privacy):** **Fail.** If the centre were rebranded or invisible, she would likely attend for the social contact.
  *   **Verdict:** **Challenge.** This is bias/stigma.
      *   *Action:* Do not write "No day centre" as a fixed preference. Write "Requires alternative social provision." Colluding with this isolates her. You must find a venue without the "dementia" label (e.g., community lunch club, library group) that meets the same *need* (social contact) without triggering the *stigma*. If no alternative exists, you must document that the refusal is based on stigma and monitor for isolation, rather than treating it as a valid choice.

  ### Summary of Your Tests
  *   **Substitution:** **Bin.** Too hypothetical for a 10-minute paper decision. Replaced by **The Label Test** (Task vs. Category).
  *   **Cost:** **Keep & Fix.** Crucial. Focused on **Risk Allocation** (Who pays for the consequence?).
  *   **Take-back:** **Keep & Fix.** Crucial. Focused on **Privacy vs. Shame**.

  **Final Note for the Panel:** In Case 2 and 3, "respecting" the wish is actually a failure of your statutory duty to promote wellbeing. You are not overriding autonomy; you are refusing to resource self-neglect driven by stigma.
