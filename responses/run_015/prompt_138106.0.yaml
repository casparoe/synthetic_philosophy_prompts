answer: |-
  The banquet hall had emptied hours ago. Only the stacking chairs and the lingering scent of roasted garlic remained. Elias swirled the last of the red wine, watching the legs slide down the glass. Clara sat opposite, elbows on the tablecloth, looking less tired than sharpened.

  "Let's run the Reporter's Box again," Elias said. "Imagine a device implanted at birth. It monitors the neural correlate of your pain—call it N—and on that basis alone, causes you to form the belief that you are in pain and to say, 'I am in pain.' The causal chain runs from N to the speech center. The experience itself, the hurt qualia, sits off to the side. It exists, but it's not in the loop."

  Clara tapped her fork against the plate. "So when I scream because I stubbed my toe, the scream is caused by the neural firing, and the pain is just a shadow cast by the firing. The shadow doesn't push the scream out."

  "Exactly."

  "Then explain the knowledge," Clara said. "If my saying 'I am in pain' is not caused by my being in pain, then my apparent knowledge of my own experience looks lucky. Or empty. I'm like a barometer tracking a storm. The barometer doesn't know it's raining; it just reacts to pressure. Why am I different?"

  Elias leaned forward. "Because the barometer and the storm are distinct entities. In the Reporter's Box, the experience and the report are joint effects of a common cause. N causes the pain, and N causes the report. They covary perfectly. Isn't that enough for knowledge? A reliable connection?"

  "Reliability isn't enough if the content is unmoored," Clara countered. "Consider the specificity problem. I don't just report 'something is happening.' I discriminate. I say 'throbbing' instead of 'dull,' 'sharp' instead of 'burning.' I pick out the exact qualitative character. If the qualia have no causal purchase on the selection of that content, how do I get it right reliably? The neural state N might code for 'throbbing,' but why does the *experience* of throbbing match the word? If the experience is inert, the match is cosmic coincidence."

  Elias paused. "Two options. One: the common cause ensures the match. N guarantees both the specific qualia and the specific word. Two: the phenomenal judgment is partly constituted by the experience rather than caused by it. The experience isn't a pusher; it's a constituent. Like the shape of the glass is part of the glass, not a cause of it."

  "Constitution helps with presence, not discrimination," Clara said. "Let's sharpen the box. Imagine a neurosurgeon silently permutes the mapping between quale-type and report-type. When you feel burning, the device makes you say 'stabbing.' When you feel stabbing, you say 'burning.' By your own epiphenomenalist commitments, nothing observable changes. Your introspective verdicts remain the same. You think you're identifying the burn correctly, but you're wrong."

  Elias sighed. "I concede that. In the scrambling scenario, I lose the knowledge claim. But that's a deviant case. In the normal case, the mapping is fixed by evolution."

  "Fixed by evolution means fixed by causal history," Clara said. "You're smuggling causation back in to save the knowledge. If the qualia do no work, why isn't the normal case just the scrambling case where we got lucky? You're entitled to say the report happens. You're not entitled to call it knowledge without a non-causal epistemic warrant. Do you have one?"

  "I think you're begging the question," Elias said softly. "You've built causation into your account of knowledge. You assume that for me to know X, X must cause my belief. But if dualism is true, maybe knowledge is a matter of acquaintance, not causation. Maybe the presence of the qualia in the judgment *is* the warrant."

  "Then 'knowledge' means something different for you than it does for physics," Clara said. "But here's the turn I want you to look at. We're arguing about whether the experience causes the report. But in the scrambling case, you admitted nothing observable changes. That includes the subject's own introspective verdicts. So when you say the experience is 'causally inert,' what work is 'cause' doing? If the neural state does all the physical lifting, and the experience travels with it necessarily, are we disagreeing about consciousness, or are we disagreeing about what the word 'cause' is doing?"

  Elias set his glass down. The clink was loud in the empty room. "I think you've hit the nerve. If I say the experience is a constituent, not a cause, I'm changing the metaphysical category. But if I say it's a cause, I violate the closure of the physical. So I say it's inert. But then you say 'no knowledge.' You're demanding physical causation for epistemic warrant."

  "And you're demanding epistemic warrant without physical causation," Clara said. "If we strip 'cause' of its physical pushing, and strip 'knowledge' of its causal tracking, are we just verbalizing?"

  "Maybe," Elias said. "But here is what I concede. If the scrambling scenario is metaphysically possible, then I cannot claim infallible knowledge of my own qualia on your terms. My 'acquaintance' is private in a way that makes public validation impossible. I lose the right to say I *know* I'm in pain in a way that communicates anything to you."

  Clara nodded slowly. "And I concede this: If I insist that all warrant must be causal in the physical sense, I am assuming physicalism to refute dualism. That is circular. If experiences are non-physical, demanding physical causation for knowledge is category error. So, I lose the right to say your position is incoherent. It's only incompatible with my metaphysics."

  "So we're stuck," Elias said. "I have knowledge that looks like luck from the outside. You have causation that looks like exclusion from the inside."

  "Not stuck," Clara said, standing up and gathering her shawl. "Just clear. You keep the qualia, but you pay for them with efficacy. I keep the efficacy, but I have to explain why it feels like there's something extra."

  "And the Reporter's Box?"

  "Stays on the table," Clara said. "Because until we agree on what 'cause' means across the mental-physical divide, the box is just a mirror. It shows us what we're willing to sacrifice."

  Elias watched her walk toward the doors. He looked at the wine glass, then at the empty chair. He didn't drink. He just turned the glass slowly, watching the light catch the rim, wondering if the turning was caused by his hand, or if both were just effects of something neither of them could name.
