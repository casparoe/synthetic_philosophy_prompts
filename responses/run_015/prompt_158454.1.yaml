  ### Proposal Agenda: Conceptual Foundations of Belief-to-Object Inference

  **To:** Interdisciplinary Fund Committee
  **From:** Principal Investigator (Hypothetical)
  **Subject:** Prioritization of Research Lines for Archaeological Epistemology Fund

  #### Executive Summary
  This proposal requests funding for three doctoral researchers over two years to address the "black box" of archaeological inference: how we move from physical remains to claims about past beliefs. While empirical methods are well-developed, the conceptual pipeline linking matter to mind remains under-theorized. We propose a prioritized agenda focusing on three live lines of work: (1) taphonomic correction for belief-reconstruction, (2) formal abductive frameworks, and (3) the material-agency problem. Below, I defend the ordering of these lines based on dependency relations, reliability importance, and tractability for theoretical researchers.

  #### Prioritization Argument

  **Rank 1: Refining Taphonomic Correction Methods for Belief-Reconstruction**
  **Primary Criterion:** Dependency Relations (Upstream Validity)

  The first priority must be **refining taphonomic correction methods specifically for belief-reconstruction**. This line of work is upstream of all others. In any inferential chain, the integrity of the input data is a precondition for the validity of the logic applied to it. If researchers cannot conceptually distinguish between the non-existence of a ritual institution and the non-preservation of its artifacts, any subsequent logical framework will be built on false negatives.

  While taphonomy is often treated as an empirical concern for field teams, the *conceptual* treatment of absence is a philosophical problem regarding epistemic limits. For a theoretical fund, the tractability lies not in digging, but in modeling the probabilities of preservation versus non-existence in pre-literate monumental sites. Without resolving the "absence of evidence" problem, we risk validating null hypotheses incorrectly. This is the foundation; if the data input is corrupted by preservation bias, no amount of logical rigor can salvage the inference.

  **Rank 2: Constructing Formal Abductive Frameworks**
  **Primary Criterion:** Importance to the Reliability of Archaeological Inference

  Once the integrity of the data (presence/absence) is conceptually secured, the second priority is **constructing formal abductive frameworks, perhaps adapting structures from diagnostic reasoning in medicine or law**. This addresses the core engine of archaeological reasoning: the leap from mute traces to normative institutions. Currently, this leap is often intuitive or reliant on uniformitarian assumptions that lack formal justification.

  This line is ranked second because it depends on Rank 1. Formalizing logic before correcting for preservation bias risks producing rigorous reasoning about corrupted inputs—a high-precision calculation based on wrong variables. However, once taphonomic filters are accounted for, this line offers the highest return on reliability. By adapting diagnostic frameworks (e.g., Bayesian networks used in medicine), philosophers and theoretical archaeologists can create explicit criteria for when a vessel implies a norm versus a function. This is highly tractable for theorists as it involves logic and probability theory rather than new fieldwork.

  **Rank 3: Addressing the Material-Agency Problem**
  **Primary Criterion:** Tractability and Theoretical Refinement

  The third priority is **addressing the material-agency problem in a narrowly belief-focused form**. This question asks whether artifacts reflect pre-existing institutions or actively shape them. While ontologically profound, this line is ranked last because it functions as a revisionary check on the first two. To determine if an object shapes belief, one must first establish that the object existed (Rank 1) and that we can reliably infer its association with belief (Rank 2).

  Attempting to solve material agency before securing inferential logic risks circular reasoning: claiming objects shape beliefs based on inferences that assume objects reflect beliefs. Furthermore, this is the most theoretically dense and least empirically tractable line for a two-year doctoral timeline. It requires nuanced social ontology that builds upon the stabilized inference models from Rank 2. It is the "refinement" stage, ensuring our reconstruction criteria account for bidirectional causality once the unidirectional pipeline is understood.

  #### Central Trade-Offs and Risks

  The most critical trade-off lies between Rank 1 and Rank 2. There is a temptation to prioritize **constructing formal abductive frameworks** because logic offers immediate conceptual clarity. However, formalizing abductive logic before correcting for preservation bias risks producing rigorous reasoning about corrupted inputs. A logically perfect argument that concludes "no ritual existed" based on missing artifacts is useless if the taphonomic model shows those artifacts should not have survived anyway. Therefore, epistemic humility regarding data survival (Rank 1) must precede logical ambition (Rank 2).

  A secondary trade-off exists between Rank 2 and Rank 3. Prioritizing **addressing the material-agency problem** earlier would challenge the very directionality of the inference pipeline. However, without a stable baseline of how we currently infer belief (Rank 2), deconstructing that process (Rank 3) becomes purely speculative. We must understand the "reflection" model before we can rigorously test the "constitution" model.

  #### Reordering Triggers

  This agenda is stable but responsive to specific evidence. I would reorder the priorities under the following conditions:

  1.  **Promoting Line 2 (Abduction):** If a breakthrough in probabilistic modeling emerges from external geoarchaeological research that effectively solves the "absence of evidence" problem for monumental sites, Rank 1 becomes obsolete, and Rank 2 moves to first place.
  2.  **Promoting Line 3 (Agency):** If a specific class of site (e.g., ritual caching sites with clear stratigraphic sequences of object deposition) provides undeniable evidence that artifact placement predates and dictates subsequent social organization, Line 3 becomes an upstream dependency. This would require moving Material Agency to Rank 1, as it would invalidate the standard inference model used in Rank 2.
  3.  **Demoting Line 1 (Taphonomy):** If theoretical analysis reveals that belief-reconstruction relies primarily on positive evidence (presence of specific iconography) rather than negative evidence (absence of ritual structures), the conceptual taphonomy of absence becomes less critical, lowering Rank 1.

  #### Conclusion

  This agenda prioritizes the integrity of the inferential pipeline from input (taphonomy) to process (abduction) to ontology (agency). By securing the reliability of absence claims first, we ensure that subsequent formal logic and ontological revisions are grounded in data that accurately represents the past rather than the biases of preservation.

