      *   *Sentence 4:* "Because the view tracks only subjectively experienced craving for change, it treats death and deep unconsciousness as perfect states, since in them there is literally no experiential craving at all."
          *   *Assessment:* **Crucial Point.** This is a common objection/criticism, but proponents usually clarify this. Tranquilism is usually an *experiential* theory. If you don't exist, you don't have cravings. Is non-existence "perfect"? Technically, yes, in terms of *experiential* value (0 craving). But does it imply we should kill everyone? No, because creating new cravings (by keeping people alive) isn't necessarily bad if those cravings are satisfied. However, the "perfect state" claim is technically consistent with the axiology but often misunderstood in the ethical application.
