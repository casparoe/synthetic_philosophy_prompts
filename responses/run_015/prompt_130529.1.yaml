          *   Specific Injection: Distinguish "propositional substitution" vs. "illocutionary framing" in one step.
          *   Tone: Casual, empathetic to a tired chaplain on night shift. No citations/bibliographies.
          *   Honesty: Flag where the procedure breaks down or misfires.
          *   Applications: Apply to three specific cases (A, B, C).
          *   Time/Usage: ~10 minutes, zero philosophy background needed.

  2.  **Deconstruct Augustine's Ethics of Lying:**
      *   *Core Principle:* Lying (*mendacium*) is always sinful, regardless of consequence (even to save a life/chastity).
      *   *Definition:* Speaking against what is in one's mind (*enuntiatio contra id quod animo tenetur*) with intent to deceive (*fallendi voluntate*).
      *   *Nuance:* Silence is not lying. Ambiguity is risky but sometimes permissible if not intended to deceive (though Augustine is suspicious of this).
      *   *Hierarchy of Lies:* Augustine distinguishes 8 types of lies in *De Mendacio*, ranging from malicious to "officious" (helpful). All are sins, but some are venial, some mortal. However, for a clinical decision card, the binary "is this a lie?" is more useful than the gradation of sin.
      *   *Key Distinction:* Truth in the heart vs. Truth on the lips. If you believe X is false but say X is true to make someone believe X is true, that's a lie. If you stay silent, that's not a lie. If you say something technically true but misleading, Augustine is wary but might allow it if the intent isn't strictly to deceive about the *core* truth needed for salvation/safety, though he generally hates equivocation.
      *   *The "Mental Reservation" Trap:* Augustine generally rejects mental reservation if the intent is to deceive the listener.

  3.  **Brainstorming Mistakes (Pre-computation):**
      *   *Mistake 1: Kantian Confusion.* People think Augustine bans lying because of universalizability or duty ethics. No, he bans it because it violates the order of creation and damages the soul's relationship with God/Truth. Consequences don't justify the means for Augustine, but the *reasoning* is theological, not deontological in the Kantian sense.
      *   *Mistake 2: Mental Reservation.* People think Augustine allows "thinking one thing while saying another" if the words are technically true. Augustine hates this. If the intent is to deceive, it's a lie.
      *   *Mistake 3: Silence = Lying.* People think withholding info is the same as lying. Augustine distinguishes sharply between *suppressio veri* (silence) and *suggestio falsi* (asserting falsehood). Silence is often permissible; assertion of falsehood is not.

  4.  **Drafting the Decision Card (Flowchart-in-Words):**
      *   *Goal:* 10 minutes, zero philosophy.
      *   *Tone:* Casual, night-shift friendly.
      *   *Structure:* Ordered questions.
      *   *Key Injection:* Propositional Substitution vs. Illocutionary Framing.
      *   *Stop Points:* Clear "Hard No" zones.
      *   *Hand-offs:* Where ethics turns into pastoral discernment.

      *   *Step 1: The Intent Check.* Are you trying to make them believe something you know isn't true?
      *   *Step 2: The Content Check.* Are you asserting a fact you believe is false? (Propositional Substitution).
      *   *Step 3: The Framing Check.* Are you using true facts to create a false impression? (Illocutionary Framing).
      *   *Step 4: The Duty Check.* Do you owe them this info? (Silence vs. Lying).

  5.  **Refining the Augustine Distinction (Propositional vs. Illocutionary):**
      *   *Propositional Substitution:* Saying "The labs are normal" when they are critical. Augustine says: Hard No. This is *mendacium*.
      *   *Illocutionary Framing:* Saying "We are focusing on comfort" instead of "We are stopping cure." Augustine is wary. If the intent is to deceive about the *status* of the patient, it's still problematic. But if it's just emphasizing a different true aspect without denying the other, it *might* pass, but risky. I need to make sure the card flags this as a "Yellow Zone" requiring caution, not a free pass. Augustine is stricter than modern ethics here. He'd likely say if the *effect* is deception, the heart is guilty. I need to be faithful to Augustine's strictness while making it usable.
      *   *Correction:* Augustine distinguishes between *joking* (not intended to deceive), *error* (unintentional), and *lying* (intent to deceive + false assertion). For the card, focus on the intent to deceive + false assertion.
      *   *Injection Point:* Step 3.

  6.  **Developing the Cases:**
      *   *Case A (Family wants chaplain to lie):* Clear violation. Asserting false w/ intent to deceive.
      *   *Case B (Patient asks, Family says don't tell):* Conflict of duty. Augustine prioritizes Truth/God over family authority. Silence might be an option, but direct lying is out.
      *   *Case C (Research framing):* Illocutionary framing designed to deceive. Augustine would flag this as lying because the intent is deception, even if words are technically true.

  7.  **Reviewing Constraints & Tone:**
      *   *Casual:* "Look," "Here's the thing," "Don't overthink it."
      *   *No Citations:* Don't mention *De Mendacio* by name in the card itself, just use the logic.
      *   *Honesty about Breakdown:* Acknowledge where Augustine's rigidity clashes with clinical reality (e.g., therapeutic privilege, immediate harm).
      *   *Brainstorm First:* Must list the 3 mistakes before the card.

  8.  **Step-by-Step Reasoning Check:**
      *   *Did I mix up Kant and Augustine?* Ensure the justification isn't "rules are rules" but "truth is a divine attribute/integrity of the soul."
      *   *Did I allow mental reservation?* No, explicitly forbid it in the mistakes.
      *   *Did I distinguish silence?* Yes, crucial step.
      *   *Is the injection clear?* Yes, in the framing step.
      *   *Are the cases applied correctly?* Yes.
      *   *Is the tone right?* Needs to be empathetic but firm on the Augustinian logic.

  9.  **Final Polish:**
      *   Make sure the "Hard No" is clear.
      *   Ensure the "Values vs. Rules" handoff is distinct.
      *   Check the "Breakdown" section for honesty.

