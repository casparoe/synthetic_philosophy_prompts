answer: |-
  ### Pre-Game Brainstorm: The Three Big Traps
  Before you laminate this, know where people usually wreck the car when trying to use Augustine in a trauma bay.

  1.  **The Kant Confusion:** People think Augustine bans lying because "rules are rules" (like Kant). Wrong. Augustine bans it because lying disorders the soul and insults God, who is Truth. For Kant, it's about logical consistency; for Augustine, it's about spiritual integrity. If you tell a lie to save a life, Kant says you violated a duty; Augustine says you've damaged your own capacity to know God. The card needs to reflect *intent* and *truth-in-the-heart*, not just rule-following.
  2.  **The Mental Reservation Hack:** People think Augustine allows "mental reservation" (saying something ambiguous while meaning something else in your head). He doesn't. Not really. In *Contra Mendacium*, he argues that if your *intent* is to deceive the listener, you're lying, even if your words are technically defensible. The card must crush this loophole.
  3.  **Silence = Lying:** Clinicians often think withholding info is the same as lying. Augustine draws a hard line here. *Suppressio veri* (hiding truth) is not the same as *suggestio falsi* (suggesting falsehood). You can often stay silent; you cannot assert falsehood. The procedure must separate these clearly.

  ***

  ### The "Night Shift" Truth Card
  **For:** Trauma Chaplains & Ethics On-Call
  **Time:** 10 Minutes Max
  **Vibe:** Augustine's Hardline (No "Officious Lies")

  **Instructions:** Read these questions in order. If you hit a **STOP**, do not proceed with that speech act. If you hit a **YIELD**, you're in the pastoral zone, not the ethical rule zone.

  #### Q1: The Intent Check
  **Ask yourself:** "Am I saying this specifically to make them believe something I know is not the case?"
  *   **YES:** → **STOP.** This is *mendacium* (lying). Augustine says this is never permissible, even to stop pain or conflict. Do not say it.
  *   **NO:** (e.g., you are joking, or you genuinely believe it might be true) → **Go to Q2.**

  #### Q2: The Proposition Check (Propositional Substitution)
  **Ask yourself:** "Am I swapping a fact I know is true for a fact I know is false?"
  *   *Example:* Saying "Vitals are stable" when they are crashing.
  *   **YES:** → **STOP.** This is a direct lie. No exceptions.
  *   **NO:** (You are sticking to facts you believe are true) → **Go to Q3.**

  #### Q3: The Framing Check (Illocutionary Framing)
  **Ask yourself:** "Am I using true facts to create a false impression?"
  *   *The Distinction:* **Propositional Substitution** is swapping Fact A for False Fact B. **Illocutionary Framing** is stating Fact A but emphasizing it so heavily that the listener infers False Fact B.
  *   *Augustine's Logic:* If your *goal* is the deception, Augustine counts this as a lie even if the words are true.
  *   **YES:** (You are burying risks, using jargon to hide bad news, or highlighting hope to obscure death) → **STOP.** This is deceptive framing. It violates the spirit of truth.
  *   **NO:** (You are presenting true facts without trying to manipulate the conclusion) → **Go to Q4.**

  #### Q4: The Duty & Silence Check
  **Ask yourself:** "Do I have a specific duty to speak this truth to this person right now?"
  *   **NO:** (You are not the attending, or the patient hasn't asked, or safety is at risk) → **YIELD.** You may remain silent. Augustine allows silence (*taciturnity*) when there is no obligation to speak. You do not have to volunteer truth if it causes unjust harm, provided you don't lie.
  *   **YES:** (The patient asked directly, or you are the primary communicator) → **YIELD.** You must speak truth, but you may choose *how* much truth is prudent. This is now a **Values/Pastoral Judgment**, not a rule. Proceed with compassion, but do not violate Q1–Q3.

  ***

  ### Where This Procedure Breaks Down (Be Honest)
  1.  **Clinical Harm:** Augustine doesn't care if the truth kills the patient. This card will sometimes force you to recommend disclosure that the medical team thinks is dangerous. You will conflict with "therapeutic privilege."
  2.  **Uncertainty:** If you aren't sure what is true (e.g., prognosis is murky), Q2 becomes hard. Augustine says you must speak according to what you *believe* is true. If you believe a guess, state it as a guess.
  3.  **Authority Conflicts:** When family says "Don't tell" and patient says "Tell me," Augustine sides with the Truth and the Patient's Soul. This card will not help you manage the family fallout, only the ethics of the speech act.

  ***

  ### Case Applications

  #### Case A: The "False Hope" Request
  **Scenario:** Family asks you to back them up telling a terminal patient "you're going to be fine." Everyone knows this is false.
  **Run the Card:**
  *   **Q1 (Intent):** Yes, the intent is to make the patient believe they will survive. → **STOP.**
  *   **Verdict:** **Hard No.** You cannot affirm this.
  *   **Action:** Tell the family: "I can support them spiritually, but I cannot affirm medical falsehoods. It violates my ethical commitment to truth." Use **Q4 (Silence)** if needed—you don't have to contradict them aggressively, but you cannot endorse the lie.

  #### Case B: The "Am I Dying?" Confrontation
  **Scenario:** Patient asks you directly. You know the family has been lying. Family begs you not to confirm.
  **Run the Card:**
  *   **Q1 (Intent):** If you say "No," intent is to deceive. → **STOP.**
  *   **Q2 (Proposition):** If you say "No," you are asserting falsehood. → **STOP.**
  *   **Q4 (Duty):** Patient asked directly. You have a duty to the person asking.
  *   **Verdict:** **Yield to Truth, Manage Delivery.** You cannot lie. You can use **Q4 (Silence/Duty)** to navigate *how* much you say, but you cannot affirm the family's lie.
  *   **Action:** "I know this is incredibly hard. I can't answer that specifically, but I am here to walk through whatever is happening with you." (This avoids the lie without violating the duty to care). *Note: Augustine would prefer full disclosure, but this card allows silence if full disclosure causes immediate unjust harm, provided you don't lie.*

  #### Case C: The "Hopeful Framing" Research Pitch
  **Scenario:** Research team wants to describe an experimental drug as "promising" and bury risks in technical jargon to avoid scrolling off participants. Not literally false, but designed to cause therapeutic misconception.
  **Run the Card:**
  *   **Q1 (Intent):** Yes, intent is to make them believe it's safer than it is.
  *   **Q3 (Framing):** This is **Illocutionary Framing**. You are using true words ("promising") to create a false impression (safety/cure).
  *   **Verdict:** **STOP.** Augustine treats deceptive framing as lying because the *will* is to deceive.
  *   **Action:** Recommend the team rewrite the consent. "If the framing is designed to make them misunderstand the risk, it counts as a lie under this framework. We need plain language that doesn't manipulate hope."

  ***

  ### Final Note for the Chaplain
  If you hit a **STOP**, don't argue philosophy. Just say: "I can't go there." If you hit a **YIELD**, breathe. You're in the pastoral zone now. Use your wisdom. But never cross the **STOP** lines—that's where Augustine says the soul gets broken.
