answer: |-
  Marcus owns a struggling family firm with twenty employees. One staff member, Mr. Henderson, is elderly, deeply loyal, and incompetent; keeping him risks bankruptcy, harming everyone, while firing him ensures solvency but devastates Henderson. Marcus knows all the financial facts and faces no practical irrationality: he understands the means–end links and suffers no akrasia. However, his attachment to Henderson is central to his self-conception as a provider. Under view (R), the objective reasons—aggregate welfare, fiduciary duty—outweigh the reasons of loyalty, fixing the ought as firing Henderson. Under view (D), Marcus undergoes purely enriching idealisation: he retains all existing desires but gains full coherence and a properly vivid grasp of his attachments. This vividness amplifies the deliberative weight of his loyalty until it coheres best with his central identity, leading him to settle on keeping Henderson.

  (R) verdicts that Marcus ought to fire Henderson because the objective balance of reasons favors aggregate welfare over individual loyalty. (D) verdicts that Marcus ought to keep Henderson because the idealized deliberative procedure—prioritizing structural coherence and vividness among existing desires—settles on protection. The single structural feature generating the divergence is the **normative authority of internal coherence versus external reason weight**: (D) treats the structural fit among desires as constitutive of the ought, whereas (R) treats the independent weight of reasons as constitutive. If you remove the coherence requirement from (D), reducing it to mere information addition, the idealized agent simply tracks the objective reasons and converges with (R). A defender of (R) would attack (D) as cheating by arguing it smuggles subjective psychology into normativity: by allowing the *vividness* of a desire to alter the verdict despite fixed reason weights, (D) conflates what an agent can *live with* for what an agent *ought to do*, effectively letting the will legislate value rather than track it.
