answer: |-
  You have independently rediscovered the foundational problem of **historiography** and **intelligence analysis**, though you are right that the psychological literature often lumps it under broader, blunter headers like the Halo Effect.

  The short answer is: The negative version has a famous name (*Falsus in uno, falsus in omnibus*). The positive version does not have a standard label, though it is a specific, high-stakes application of the **Representativeness Heuristic**. The "admission of uncertainty" is a distinct mechanism known in economics and evolutionary psychology as **Costly Signaling**.

  Here is the carving you are looking for, the literature that surrounds it, and a proposed term to sharpen your practice.

  ### 1. The Negative Version: *Falsus in Uno*
  The phenomenon where a source caught lying (or erring) on one detail is deemed unreliable on all others is a formal legal doctrine: ***Falsus in uno, falsus in omnibus*** ("False in one thing, false in everything").

  *   **Origin:** Roman law, carried into common law jury instructions.
  *   **The Logic:** If a witness fabricates or distorts a detail, it impeaches their general veracity.
  *   **The Flaw:** Modern psychology and evidence scholars largely reject it as a mandatory rule. People make memory errors, typos, or honest mistakes about dates without fabricating the core narrative. However, as you noted, it remains a potent *cognitive* rule for readers and journalists.

  ### 2. The Positive Version: Coining "The Audit Spillover"
  There is no Latin maxim for the inverse ("True in one, true in all"), likely because logic doesn't support it. However, in intelligence analysis, this is the danger of conflating **Source Reliability** (how trustworthy the person is generally) with **Information Validity** (whether this specific claim is true).

  I propose you call this **The Audit Spillover**.

  **Definition:** *The cognitive bias wherein the successful verification of low-stakes, objective claims (auditable) disproportionately increases the subjective probability assigned to high-stakes, subjective claims (unauditable) from the same source, beyond what Bayesian updating justifies.*

  **Why it happens:** It is a specific subtype of the **Representativeness Heuristic**. Your brain creates a model of the source: "This is a Person Who Is Accurate." Once that model is built via the auditable details, the unauditable details are judged against the model, not against evidence.

  **Is it irrational?** Not entirely. It is a **Competence Signal**. If a source gets ten dates and names right, they signal:
  1.  **Access:** They were actually there.
  2.  **Conscientiousness:** They pay attention to detail.
  3.  **Memory Fidelity:** Their recall mechanism is functioning.

  These are *prerequisites* for a true account of a private meeting. Therefore, the inference is not logically valid (dates $\neq$ thoughts), but it is **probabilistically relevant**. The "leak" occurs when you treat the signal as *proof* rather than a *prior*.

  ### 3. The Second Version: Costly Honesty Signaling
  The phenomenon where a source admits uncertainty ("I couldn't confirm this") and gains credibility is distinct from the Audit Spillover. This is **Costly Signaling**.

  *   **The Mechanism:** In a persuasion context, the goal is usually to convince. Admitting ignorance weakens the immediate persuasive force of the narrative. Therefore, only a source confident in their overall truthfulness (or committed to honesty over persuasion) will "pay the cost" of admitting a gap.
  *   **The Historian's Term:** Your classicist friend mentioned the **Criterion of Embarrassment** (*Criterium Erubescentiae*). In biblical criticism, if a gospel writer includes a detail that makes Jesus or the apostles look bad (e.g., Peter denying Jesus), it is likely true because the author would have no motive to invent it.
  *   **The Journalistic Equivalent:** **Strategic Vulnerability**. When a source flags a weak spot, they are signaling that they are not trying to sell you a seamless narrative. This disarms your **Persuasion Knowledge** (your psychological defense against being manipulated).

  ### 4. The Carving: Where Legitimate Inference Ends and Leak Begins
  You asked for the boundary cases. Here is how to distinguish a rational update from the Audit Spillover bias.

  **A. The Nature of the Error (Systematic vs. Random)**
  *   **Legitimate Inference:** If the auditable errors are *directional* (dates are always moved to make the timeline tighter; names are always misspelled to protect identities), the source is curating the narrative. The spillover is warranted skepticism.
  *   **The Leak:** If the error is a random typo or a garbled secondhand detail (e.g., "It rained" vs. "It snowed" in a storm), treating this as a lie about the private meeting is *Falsus in Uno* bias.

  **B. Access vs. Interpretation**
  *   **Legitimate Inference:** Auditable details prove *presence*. If they got the room temperature and the serial number right, they were in the room. This makes it physically possible they heard the conversation.
  *   **The Leak:** Auditable details do not prove *interpretation*. A source can be in the room, get every date right, and still genuinely misunderstand the intent of the private meeting. The Audit Spillover tricks you into thinking accuracy of *observation* equals accuracy of *meaning*.

  **C. The "Too Clean" Problem**
  *   **Legitimate Inference:** A mix of confident and uncertain claims suggests a human memory.
  *   **The Leak:** If *every* auditable detail is perfect, especially in a high-stress environment, it may indicate rehearsal or fabrication. Real memory is jagged. A source who is "right about the small stuff" because they are careful is trustworthy; a source who is right because they *constructed* the small stuff to anchor the lie is dangerous. This is the **Lucianic Test** (after the satirist Lucian of Samosata): look for the details that serve no narrative purpose.

  ### 5. Practical Advice for the Journalist
  Knowing about the Audit Spillover changes your workflow in three specific ways:

  **1. Decouple the Scores**
  In intelligence analysis, sources are rated on two separate scales: **Reliability** (A-F) and **Validity** (1-6).
  *   *Current Habit:* You check the dates, feel good, and implicitly raise the validity of the quotes.
  *   *New Habit:* Explicitly separate them. "Source has High Reliability (dates check out), but this claim remains Low Validity (unauditable)." Do not let the first number inflate the second. Write your draft assuming the unauditable claims are unproven, *then* add the auditable context as support, not proof.

  **2. Hunt for "Useless" Details**
  To test if a source is constructing a narrative to game your fact-checking:
  *   Ask for auditable details that *do not help their story*.
  *   If they say, "We met to plan the merger," don't just check the date of the meeting. Check the weather. Check who else was in the building. Check the menu.
  *   Li often prepare the "plot points" (the unauditable core) and the "anchors" (the auditable dates). They often neglect the background noise. A source who volunteers useless, checkable noise is signaling genuine memory.

  **3. Leverage Strategic Vulnerability**
  When a source flags a weak spot ("I'm not sure what time it was"), do not just note it as honesty. **Interrogate the boundary.**
  *   Ask: "What *can* you confirm about that moment?"
  *   If they say, "I don't know the time, but I know John was angry because he knocked over his coffee," you have shifted from an unauditable claim (time) to a potentially auditable one (coffee stain on the invoice/dry cleaning bill).
  *   Use their honesty to pivot to *new* auditable terrain.

  ### Summary
  You are practicing **Source Criticism** (*Quellenkritik*) without the German degree.
  *   The negative bias is ***Falsus in uno***.
  *   The positive bias is **The Audit Spillover** (a Representativeness Heuristic applied to evidence).
  *   The honesty boost is **Costly Signaling**.

  The legitimate inference is that the source had **access** and **attention**. The leak is assuming they have **accuracy of interpretation**. Your job is to use the auditable details to verify the *stage*, but not to assume the *script* is real.

  **Term to use:** **The Audit Spillover**.
  **Definition:** *The unwarranted transfer of credibility from verified objective claims to unverified subjective claims within a single source narrative.*
