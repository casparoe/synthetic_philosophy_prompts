answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 23
  **SUBJECT:** Decision on Rent Control Exemption and Coordinator Compensation

  **The Decision Before Us**

  By the 15th of next month, we must decide whether to file for the city's nonprofit exemption to rent control. Simultaneously, we must decide whether to restructure our Resident Coordinator stipends into hourly wages.

  These are not separate administrative checkboxes. They are a single question about what we are actually selling, and who pays for it.

  **The Philosophical Trap**

  We like to tell ourselves that keeping rent low is the moral choice. It aligns with our mission to support artists. However, we need to look closely at the argument that price controls are a form of extraction. When the city caps what we can charge, they are capping the revenue available to pay the people who make this place run.

  If we stay under rent control to keep apartments cheap for poets, we are effectively subsidizing the residents' art on the backs of the coordinators' labor. Our coordinators currently earn below minimum wage when you factor in the hours worked. If we claim to be a nonprofit on the side of labor, we cannot build our model on underpaid work, even if that work is wrapped in the dignified language of a "stipend."

  There is a risk here. If we file for the exemption, are we using "Art" as a moral shield to act like a landlord? Are we claiming special privilege to charge more?

  I argue the opposite. Staying under rent control is the real shield. It allows us to feel virtuous about "cheap rent" while ignoring the economic reality that someone has to maintain the building, manage the conflicts, and cook the meals. It treats the *space* as the gift, while treating the *labor* as voluntary.

  **Pricing the Thing vs. Pricing the Conditions**

  I keep returning to a distinction that I think solves this tension: There is a difference between pricing a *thing* and pricing the *conditions* that make the thing possible.

  Rent is the price of the thing (the four walls, the bed, the square footage). If we treat our residency as merely providing cheap rooms, then rent control makes sense. We cap the price of the box.

  But we are not in the business of renting boxes. We are in the business of manufacturing the *conditions* for writing. Silence, safety, community, meals, administrative support—these are the raw materials of the work our residents do. The coordinators are not just building managers; they are the stewards of those conditions.

  If we cap the rent, we starve the conditions. We say the space matters, but the support system does not.

  If we file for the exemption, we are not saying "art is expensive." We are saying "the ecosystem required for art to exist has a real cost." We need the flexibility to charge enough to fund the ecosystem, not just the brick and mortar.

  **Recommendation**

  We must stop treating our financial constraints as a badge of honor. Poverty is not a virtue, and underpaying staff is not a mission statement.

  **1. File for the Exemption (Deadline: The 15th)**
  We should file for the "subsidized artistic workspace" exemption. This does not mean we must immediately raise rents to market rate. It means we remove the ceiling that prevents us from generating enough revenue to pay our staff legally and fairly. It acknowledges that we are not a public housing unit; we are a production site for culture, and production costs money.

  **2. Restructure Coordinator Pay (Effective: Q2)**
  We must move the Resident Coordinators from a stipend model to an hourly wage model that meets or exceeds the city minimum wage. Housing and food can remain part of the compensation package, but they must be calculated as a credit toward wages, not a replacement for them. If the math doesn't work, we reduce the hours of the position or raise the program fees. We cannot ask workers to accept less than the legal floor because they love poetry.

  **The Risk**
  Filing the exemption opens us to criticism that we are "gentrifying" the residency. We must be prepared to answer that. Our answer is this: We would rather have fewer residents and paid staff than many residents and exploited staff. We are choosing to value the labor that sustains the art over the volume of art produced.

  **Timeline for Action**

  *   **October 15:** Board vote to authorize filing the rent control exemption.
  *   **November 1:** Submit exemption paperwork to the city.
  *   **January – March:** Work with a payroll specialist to convert stipends to W-2 hourly wages, calculating the cash value of housing/food as part of the total compensation package.
  *   **April 1 (Q2):** New pay structure goes into effect. If necessary, adjust resident fees at this time to cover the shortfall.

  **Conclusion**

  If we stay under rent control, we are accepting that artistic labor is a hobby that deserves cheap rent, but administrative labor is a job that deserves a wage. That is a contradiction we cannot sustain.

  Let us file the exemption. Let us pay the staff. Let us price the conditions, not just the room.

  I move we vote on this course of action Thursday.
