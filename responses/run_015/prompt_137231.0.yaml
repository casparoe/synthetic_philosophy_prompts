      *   *Case 3:* Fits. (Danger to self exists). *Resolution of 2 vs 3:* Case 2 is fear of *inauthenticity*, Case 3 is fear of *loss*. Or, Case 2 is fear of *evaluation*, Case 3 is fear of *outcome*.
      *   *Case 4:* Respect can't be commanded. Fits the rule (Respect tracks competence, not orders).
