          *   Case 1: Fear aligns with technical risk.
          *   Case 2: Fear aligns with political theater (inauthentic).
          *   Case 3: Fear aligns with actual personal risk (authentic survival instinct).
          *   *Better Rule:* **The Fittingness Rule:** An emotion is fitting if it represents the object *as it is*. Fear represents "danger." If there is danger (to system or self), fear fits. If there is no danger, but there is pressure to *perform* danger, fear is unfitting (fake).

