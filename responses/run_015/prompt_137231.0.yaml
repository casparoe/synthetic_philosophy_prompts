      *   In Case 2, the fear is about *signaling*. In Case 3, the fear is about *survival*.
      *   The user feels Case 2 is "bogus" because the nervousness is a *costume*. In Case 3, the nervousness is a *symptom*.
      *   *Rule refinement:* Emotions fit when they are **Responses**, not **Tools**. In Case 2, the nervousness is being used as a tool for appraisal. In Case 3, it's a response to threat.

  12. **Structuring the Response:**
      *   **The Name:** Call it "The Tracking Rule" (or Fittingness).
      *   **The Core Principle:** Emotions are data sensors about values (Danger, Justice, Competence).
      *   **Solving the 2 vs. 3 Puzzle:** Response vs. Performance.
