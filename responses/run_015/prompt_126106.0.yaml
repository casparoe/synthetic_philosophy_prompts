  ### 11. Self-Correction and Reflexivity Note

  I want to be honest about the "casual" nature of this draft. I know the distinction between Event and Frame risks being a distinction without a difference. When I cry, I don't consciously think, "Ah, this is 40% Event sadness and 60% Frame sadness."

  My counter-argument to this is that philosophical analysis often reveals structures that are invisible to the raw experience. We don't consciously process grammar when we speak, but grammar exists. Similarly, the architecture of our emotional engagement might have distinct supports even if the ceiling looks uniform.

  However, I acknowledge the risk. If, during Weeks 4–7, I find that the Frame-Level response always collapses into the Event-Level (e.g., I am only sad about the frame *because* I care about the event), I will pivot. The paper will then become an argument *for* the monolithic view, but with a clearer explanation of *why* the split fails. This is still a positive result. It strengthens the standard view by showing it survives a targeted attack.

  I am also aware that "Frame-Level" emotion might just be "aesthetic emotion" (admiration of beauty) rather than "fictional emotion" (sadness for a character). I need to be careful not to solve the paradox by changing the subject. If the emotion shifts from sadness to admiration, have I solved the paradox of *sadness*?

  To address this, I will focus on cases where the Frame-Level response is *also* sadness or distress. For example, feeling distressed *because* the author is being cruel to the character. This is a real-world moral emotion directed at a real-world agent (the author), triggered by the fiction. This keeps the emotion in the same family (distress/sadness) while shifting the target. This nuance will be central to the Weeks 8–11 analysis.

