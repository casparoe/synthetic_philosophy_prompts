answer: |-
  The paradox survives translation only as a problem of model identifiability and structural misspecification, losing its normative force entirely.

  To translate the epiphenomenalist position into your vocabulary, we posit a structural causal model with three variables: neural states ($N$), phenomenal states ($P$), and judgements or reports ($J$). The epiphenomenalist asserts the graph $N \to P$ and $N \to J$, with no edge $P \to J$. $P$ is a leaf node with no outgoing edges; it is a pure collider relative to any downstream effects, or simply a terminal node. The paradox arises when we interrogate the relationship between $P$ and $J$ under this structure.

  Regarding the three readings, the evidential reading concerns the conditions under which $J$ counts as knowledge of $P$. In causal terms, this is a question of whether $J$ is a valid estimator for $P$. Under the epiphenomenalist graph, $P$ and $J$ are d-connected via the common cause $N$. Observationally, $P \not\perp\!\!\!\perp J$. However, evidentialist theories of knowledge often require a causal chain from truth-maker to belief. Translated, this requires $P$ to be an ancestor of $J$. Since the graph specifies $P \nrightarrow J$, the causal effect of $P$ on $J$ is zero. The association is entirely confounded by $N$. Consequently, $J$ is not a descendant of $P$, violating the causal history requirement for reliabilist justification. The translation renders this reading precise: the belief is statistically informative but causally inert regarding its object.

  The self-undermining reading addresses the stability of the theory itself. Let $B_T$ be the belief in epiphenomenalism. The theory posits that $P$ does not cause $B_T$. Yet the correlation between $P$ and $B_T$ is the primary evidence for the theory. In your terms, the theory claims the structural equation for $B_T$ does not include $P$ as an argument. However, the data generating process shows dependence. This dependence is explained by $N$. The worry is that the reliability of $B_T$ as a measure of $P$ is unexplained by the mechanism proposed. It is a spurious correlation. If we intervene on $P$, $B_T$ does not change. The translation highlights that the theory predicts its own evidential basis is structurally unstable: the correlation exists only so long as the confounder $N$ varies naturally. If one were to intervene on $N$ to hold it fixed, the association between $P$ and $B_T$ would vanish. This reading translates most cleanly because it maps directly onto the distinction between structural dependence and spurious association induced by confounding.

  The semantic reading concerns reference and content. Causal theories of reference require a causal link between the referent and the representation. In the graph, content is a property of $J$. For $J$ to be about $P$, there must be a directed path $P \to \dots \to J$. Epiphenomenalism severs this path. In structural equation modelling, the variable $P$ does not appear on the right-hand side of the equation for $J$. Therefore, changes in $P$ do not propagate to $J$. The translation makes this reading look weakest, or rather, it reduces it to the evidential reading. If 'aboutness' is cashed out as causal counterfactual dependence, then the semantic reading is identical to the claim that the average causal effect is zero. It adds no distinct structural constraint beyond the absence of the edge.

  Your hypothesis regarding association versus intervention is correct and captures the core structural tension. In causal inference, this is the distinction between the observational conditional distribution $P(J|P)$ and the interventional distribution $P(J|do(P))$. Epiphenomenalism accepts that $P(J|P) \neq P(J)$ due to the backdoor path $P \leftarrow N \to J$, but asserts $P(J|do(P)) = P(J)$. The philosophical worry about first-person authority translates to a requirement that $J$ must track $P$ under interventions on $P$, not merely under observational conditioning. Specifically, you suggest authority requires tracking when ordinary causes ($N$) are held fixed. This is precisely the Controlled Direct Effect (CDE). You are asking whether $CDE_{N=n}(P, J) \neq 0$. Epiphenomenalism asserts $CDE = 0$ for all $n$. The paradox arises because introspective intuition suggests $CDE \neq 0$; we feel our judgements would change if our experiences changed, even if neural states were magically held constant (or if the neural states causing the experience were distinct from those causing the report).

  This distinction exists robustly in your vocabulary. It is the difference between a model where $P$ is a mediator ($N \to P \to J$) and one where $P$ is a collider or leaf ($N \to P, N \to J$). The paradox trades on the fact that observational data cannot distinguish these two graphs without additional assumptions or interventions. Since we cannot intervene on $P$ independently of $N$ in standard physicalist frameworks, the graphs are observationally equivalent. The paradox is essentially an identification problem: we cannot identify the causal effect of $P$ on $J$ because we lack an instrumental variable for $P$ that does not also affect $J$ via $N$. For the report to have what the paradox says it lacks, the graph must include a direct edge $P \to J$. Furthermore, to satisfy the condition of holding ordinary causes fixed, $P$ must be a parent of $J$ in the structural equation, ensuring non-zero partial regression coefficients even when conditioning on $N$.

  The residue report indicates significant loss of fidelity in translation. The causal structure translates cleanly: the distinction between confounding and causation, the definition of spurious correlation, and the conditions for identifiability are all preserved without distortion. The claim that $P$ causes nothing is perfectly expressed as $P$ having no children in the DAG. However, the normative dimensions distort severely. Epistemic justification becomes causal reliability. While related, justification involves norms of reasoning that are not reducible to structural connectivity. A belief can be causally produced by a fact yet unjustified (e.g., via a deviant causal chain), or causally isolated yet justified (via inference). The causal vocabulary captures the production mechanism but not the warrant.

  Aboutness suffers similar distortion. If reference is defined causally, the translation holds. But if aboutness involves normative conditions of misrepresentation (the possibility that $J$ refers to $P$ even if $P$ does not cause $J$, or vice versa), the graph cannot capture this. DAGs describe actual dependencies, not counterfactual norms of correctness independent of mechanism. The graph tells us whether $J$ varies with $P$, not whether $J$ is *correct* about $P$.

  The first-personal character of the judgement has no expression in the vocabulary. In the model, $J$ is just a variable. The 'what-it-is-like' to be $J$ is not represented. More critically, the first-person authority is treated as a claim about structural stability (invariance under intervention), but the philosophical worry is often about the *immediacy* of access. In causal terms, immediacy might be modelled as a direct edge with no noise or latency, but this is a physical claim, not a phenomenological one. The residue here points to a genuine gap in the causal framework regarding subjective ontology, but also to an unclarity in the philosophical position. Philosophers often conflate the feeling of authority with causal efficacy. To remove this unclarity, the position must specify whether first-person authority is a claim about the reliability of the measurement process (which CI handles) or a non-natural norm (which CI cannot handle).

  Ultimately, the translation suggests the paradox is driven by conflating observational equivalence with structural identity. The epiphenomenalist graph and the interactionist graph ($N \to P \to J$) can be tuned to produce identical observational distributions over $N, P, J$. The paradox arises because we intuitively prefer the interactionist graph based on introspective data that feels like intervention. The causal vocabulary clarifies that this preference is an assumption about structural stability, not a logical deduction from the data. The residue of normativity and phenomenology remains outside the graph, indicating that while causal inference can dissolve the structural confusion, it cannot resolve the metaphysical dispute about whether subjective experience *ought* to have causal power to be real. The framework treats $P$ as just another variable; the philosophical worry is that $P$ is not just a variable. Until the ontology of $P$ is specified in terms compatible with structural equations, the residue will persist.
